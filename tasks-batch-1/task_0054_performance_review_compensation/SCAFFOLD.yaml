scenario: "Performance Review & Compensation Planning: annual/semi-annual goals, 360 feedback, performance calibration, Merit Increase/Promo matrix, Equity Refresh, PIP process, Bell Curve distribution"
domain_name: performance-review-compensation
api_prefix: ""

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Rate / threshold triggers
    - Optimistic concurrency

  entity_topology: hybrid
  # ReviewCycle is the aggregate root (tree: cycle -> reviews -> goals/feedback),
  # but CalibrationSession, CompPlan, PipCase, RatingBand reference reviews across
  # the tree via FK (cross-cutting associations).

  state_machine_shape: branching
  # Review has approve/return cycles; CompPlan branches MERIT-only vs MERIT+PROMO;
  # PipCase branches CURED vs FAILED with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # ReviewCycle -> Review; Review -> Goal; Review -> FeedbackRequest
    - cross_aggregate    # CompPlan.review_id, CalibrationSession membership, PipCase.review_id

  role_model: segregation_of_duties
  # An Employee cannot be their own Reviewer; the Manager who writes the review
  # cannot be the HrbpPartner who finalizes calibration on the same review.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: ReviewCycle
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label, e.g. 'FY26 Annual'"
        constraints: "non-empty, <= 120 chars"
      - name: cadence
        type: enum
        source: input
        description: "Review cadence"
        constraints: "one of ANNUAL, SEMI_ANNUAL"
      - name: merit_budget_pct
        type: number
        source: input
        description: "Total merit budget as a fraction of summed eligible base salary, e.g. 0.04 = 4%"
        constraints: "0 <= merit_budget_pct <= 0.5"
      - name: equity_refresh_pool
        type: number
        source: input
        description: "Total equity (in share units) available to refresh across the cycle"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle state"
        default: DRAFT
        constraints: "DRAFT, OPEN, CALIBRATION, COMP_PLANNING, CLOSED"
      - name: bell_curve_target
        type: object
        source: input
        description: "Target rating distribution as fractions per RatingBand label that must sum to 1.0, e.g. {EXCEEDS:0.20, MEETS:0.65, BELOW:0.15}"
        constraints: "values are fractions in [0,1] summing to 1.000 +/- 0.0005"
      - name: distribution_tolerance
        type: number
        source: input
        description: "Allowed absolute deviation of any band's actual fraction from its target before calibration is blocked"
        default: 0.05
        constraints: "0 <= distribution_tolerance <= 1"
      - name: merit_committed_total
        type: number
        source: computed
        description: "Sum of merit_amount across all CompPlans in APPROVED state for this cycle; reconciliation ledger of committed merit dollars"
      - name: equity_committed_total
        type: number
        source: computed
        description: "Sum of equity_refresh_units across all CompPlans in APPROVED state for this cycle"

  - name: Review
    parent: ReviewCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the person being reviewed"
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> Employee.id; the manager authoring the review"
      - name: base_salary
        type: number
        source: input
        description: "Employee annual base salary snapshotted at review creation, basis for merit math"
        constraints: "> 0"
      - name: self_rating
        type: enum
        source: input
        description: "Employee self-assessment rating band label"
        constraints: "must match a RatingBand.label on the cycle; nullable until submitted"
      - name: manager_rating
        type: enum
        source: input
        description: "Manager-proposed rating band label before calibration"
        constraints: "must match a RatingBand.label on the cycle"
      - name: final_rating
        type: enum
        source: computed
        description: "Rating after calibration adjustment; set when calibration finalizes"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state"
        default: DRAFT
        constraints: "DRAFT, SELF_REVIEW, MANAGER_REVIEW, SUBMITTED, RETURNED, CALIBRATED, FINALIZED"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted goal+feedback score 0..100 computed at submit; drives band assignment"

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Display name"
        constraints: "non-empty"
      - name: manager_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee's manager (self-referential)"
        constraints: "nullable for top of chain; must not equal own id"
      - name: department
        type: string
        source: input
        description: "Org unit label"
      - name: hire_date
        type: datetime
        source: input
        description: "Hire date; tenure gates equity refresh eligibility"
      - name: is_active
        type: boolean
        source: input
        description: "Whether the employee is currently employed"
        default: true

  - name: Goal
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id"
      - name: title
        type: string
        source: input
        description: "Goal statement"
        constraints: "non-empty"
      - name: weight
        type: number
        source: input
        description: "Relative weight of this goal among the review's goals"
        constraints: "> 0 and <= 1"
      - name: attainment_pct
        type: number
        source: input
        description: "Achieved fraction of the goal, 0..1.5 (over-achievement allowed up to 150%)"
        constraints: "0 <= attainment_pct <= 1.5"
      - name: status
        type: enum
        source: system
        description: "Goal state"
        default: OPEN
        constraints: "OPEN, SCORED"

  - name: FeedbackRequest
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id"
      - name: rater_id
        type: string
        source: input
        description: "FK -> Employee.id; the 360 feedback provider"
      - name: relationship
        type: enum
        source: input
        description: "Rater relationship to subject"
        constraints: "PEER, REPORT, MANAGER, SELF"
      - name: score
        type: number
        source: input
        description: "Numeric feedback score 1..5 once submitted"
        constraints: "1 <= score <= 5; null until SUBMITTED"
      - name: status
        type: enum
        source: system
        description: "Feedback lifecycle"
        default: PENDING
        constraints: "PENDING, SUBMITTED, DECLINED"

  - name: CalibrationSession
    parent: ReviewCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id"
      - name: department
        type: string
        source: input
        description: "Department scope of this calibration session"
      - name: facilitator_id
        type: string
        source: input
        description: "FK -> Employee.id; the HRBP facilitating (must hold HrbpPartner role)"
      - name: status
        type: enum
        source: system
        description: "Session state"
        default: OPEN
        constraints: "OPEN, BALANCED, FINALIZED"
      - name: bell_curve_actual
        type: object
        source: computed
        description: "Actual fraction per RatingBand label across the session's SUBMITTED reviews at finalize time"
      - name: review_count
        type: integer
        source: computed
        description: "Count of reviews in scope (cycle+department, status SUBMITTED or later)"

  - name: CompPlan
    parent: ReviewCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id"
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id; the calibrated review this plan compensates"
      - name: plan_type
        type: enum
        source: input
        description: "Whether the plan includes a promotion"
        constraints: "MERIT_ONLY, MERIT_AND_PROMO"
      - name: merit_pct
        type: number
        source: computed
        description: "Merit increase fraction selected from the merit matrix by (final_rating, plan_type)"
      - name: merit_amount
        type: number
        source: computed
        description: "merit_pct * Review.base_salary, rounded per §1.3"
      - name: promo_band_jump
        type: integer
        source: input
        description: "Number of pay-band levels jumped on promotion; 0 for MERIT_ONLY"
        default: 0
        constraints: "0 for MERIT_ONLY; 1 or 2 for MERIT_AND_PROMO"
      - name: equity_refresh_units
        type: number
        source: computed
        description: "Equity refresh granted, computed from band/tenure/pool per §1.3"
      - name: status
        type: enum
        source: system
        description: "Comp plan lifecycle"
        default: DRAFT
        constraints: "DRAFT, PROPOSED, APPROVED, REJECTED"

  - name: PipCase
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id; the review whose low rating triggered the PIP"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; subject of the plan"
      - name: duration_days
        type: integer
        source: input
        description: "Length of the improvement window"
        constraints: "30, 60, or 90"
      - name: target_score
        type: number
        source: input
        description: "Composite score the employee must reach to cure the PIP"
        constraints: "0 < target_score <= 100"
      - name: outcome_score
        type: number
        source: input
        description: "Composite score recorded at the closeout assessment"
        constraints: "0 <= outcome_score <= 100; null until assessed"
      - name: status
        type: enum
        source: system
        description: "PIP lifecycle"
        default: OPEN
        constraints: "OPEN, ACTIVE, CURED, FAILED"

  - name: RatingBand
    parent: ReviewCycle
    common_fields: false
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id"
      - name: label
        type: string
        source: input
        description: "Band label, e.g. EXCEEDS / MEETS / BELOW"
        constraints: "unique within a cycle; non-empty"
      - name: min_score
        type: number
        source: input
        description: "Inclusive lower bound of composite_score mapping to this band"
        constraints: "0 <= min_score <= 100"
      - name: max_score
        type: number
        source: input
        description: "Exclusive upper bound of composite_score for this band (except the top band which is inclusive of 100)"
        constraints: "min_score < max_score <= 100"
      - name: merit_pct
        type: number
        source: input
        description: "Base merit fraction for this band before promo uplift"
        constraints: ">= 0"
      - name: pip_eligible
        type: boolean
        source: input
        description: "True if a review landing in this band triggers a PIP"
        default: false

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ReviewCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /cycles/{id}/open"
        actor: HrAdmin
        preconditions:
          - "cycle has >= 1 RatingBand"
          - "RatingBand.min_score/max_score cover [0,100] with no gaps or overlaps"
          - "bell_curve_target keys are exactly the set of RatingBand.label values"
          - "bell_curve_target values sum to 1.000 +/- 0.0005"
        side_effects:
          - "increments ReviewCycle.version by 1"
      - from: OPEN
        to: CALIBRATION
        trigger: "POST /cycles/{id}/start-calibration"
        actor: HrAdmin
        preconditions:
          - "every Review in this cycle is in SUBMITTED status or later"
        side_effects:
          - "increments ReviewCycle.version by 1"
      - from: CALIBRATION
        to: COMP_PLANNING
        trigger: "POST /cycles/{id}/start-comp-planning"
        actor: HrAdmin
        preconditions:
          - "every CalibrationSession on this cycle is in FINALIZED status"
        side_effects:
          - "increments ReviewCycle.version by 1"
      - from: COMP_PLANNING
        to: CLOSED
        trigger: "POST /cycles/{id}/close"
        actor: HrAdmin
        preconditions:
          - "every CompPlan on this cycle is in APPROVED or REJECTED status"
          - "merit_committed_total <= merit_budget_pct * sum(base_salary of FINALIZED reviews)"
        side_effects:
          - "increments ReviewCycle.version by 1"

  - entity: Review
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SELF_REVIEW
        trigger: "POST /reviews/{id}/begin-self-review"
        actor: Employee
        preconditions:
          - "parent ReviewCycle.status == OPEN"
          - "acting Employee.id == Review.employee_id"
        side_effects:
          - "increments Review.version by 1"
      - from: SELF_REVIEW
        to: MANAGER_REVIEW
        trigger: "POST /reviews/{id}/submit-self"
        actor: Employee
        preconditions:
          - "self_rating is set and matches a RatingBand.label"
          - "acting Employee.id == Review.employee_id"
        side_effects:
          - "increments Review.version by 1"
      - from: MANAGER_REVIEW
        to: SUBMITTED
        trigger: "POST /reviews/{id}/submit"
        actor: Manager
        preconditions:
          - "manager_rating is set and matches a RatingBand.label"
          - "every Goal on the review is in SCORED status"
          - "acting Employee.id == Review.reviewer_id"
        side_effects:
          - "computes composite_score per calc compute_composite_score"
          - "increments Review.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /reviews/{id}/return"
        actor: HrbpPartner
        preconditions:
          - "parent ReviewCycle.status == OPEN or CALIBRATION"
          - "acting Employee.id != Review.reviewer_id (segregation of duties)"
        side_effects:
          - "increments Review.version by 1"
        note: "Branching-with-revert: SUBMITTED can go back to MANAGER_REVIEW via RETURNED."
      - from: RETURNED
        to: MANAGER_REVIEW
        trigger: "POST /reviews/{id}/reopen"
        actor: Manager
        preconditions:
          - "acting Employee.id == Review.reviewer_id"
        side_effects:
          - "increments Review.version by 1"
      - from: SUBMITTED
        to: CALIBRATED
        trigger: "system event: CalibrationSession finalize covering this review"
        actor: system
        preconditions:
          - "review is in scope of a FINALIZING CalibrationSession"
        side_effects:
          - "sets final_rating (may differ from manager_rating after calibration adjustment)"
          - "if final_rating's RatingBand.pip_eligible == true, cascade-creates a PipCase (status OPEN) for this review"
          - "increments Review.version by 1"
      - from: CALIBRATED
        to: FINALIZED
        trigger: "POST /comp-plans/{id}/approve (cascades to its review)"
        actor: CompApprover
        preconditions:
          - "a CompPlan referencing this review is being APPROVED"
        side_effects:
          - "increments Review.version by 1"

  - entity: CompPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /comp-plans/{id}/propose"
        actor: Manager
        preconditions:
          - "Review.status == CALIBRATED"
          - "parent ReviewCycle.status == COMP_PLANNING"
          - "merit_amount and equity_refresh_units have been computed"
        side_effects:
          - "increments CompPlan.version by 1"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /comp-plans/{id}/approve"
        actor: CompApprover
        preconditions:
          - "merit_committed_total + this.merit_amount <= merit_budget_pct * sum(base_salary of CALIBRATED-or-later reviews)"
          - "equity_committed_total + this.equity_refresh_units <= equity_refresh_pool"
          - "acting Employee.id != Review.reviewer_id (segregation of duties)"
        side_effects:
          - "adds merit_amount to ReviewCycle.merit_committed_total"
          - "adds equity_refresh_units to ReviewCycle.equity_committed_total"
          - "transitions referenced Review CALIBRATED -> FINALIZED"
          - "if a PipCase exists for the review and final_rating's band is no longer pip_eligible, transitions PipCase OPEN -> CURED"
          - "increments CompPlan.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /comp-plans/{id}/reject"
        actor: CompApprover
        preconditions:
          - "acting Employee.id != Review.reviewer_id"
        side_effects:
          - "increments CompPlan.version by 1"
        note: "Rejected plans never touch the committed-total ledger; compensating-invariant guard."

  - entity: PipCase
    initial_state: OPEN
    terminal_states: [CURED, FAILED]
    transitions:
      - from: OPEN
        to: ACTIVE
        trigger: "POST /pip-cases/{id}/activate"
        actor: HrbpPartner
        preconditions:
          - "duration_days set and target_score set"
        side_effects:
          - "increments PipCase.version by 1"
      - from: ACTIVE
        to: CURED
        trigger: "POST /pip-cases/{id}/assess"
        actor: HrbpPartner
        preconditions:
          - "outcome_score >= target_score"
        side_effects:
          - "increments PipCase.version by 1"
        note: "Branch CURED vs FAILED diverges on outcome_score vs target_score."
      - from: ACTIVE
        to: FAILED
        trigger: "POST /pip-cases/{id}/assess"
        actor: HrbpPartner
        preconditions:
          - "outcome_score < target_score"
        side_effects:
          - "sets Employee.is_active = false (separation)"
          - "increments PipCase.version by 1"

  - entity: CalibrationSession
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: BALANCED
        trigger: "POST /calibration-sessions/{id}/balance"
        actor: HrbpPartner
        preconditions:
          - "parent ReviewCycle.status == CALIBRATION"
          - "for every RatingBand, |bell_curve_actual[band] - bell_curve_target[band]| <= distribution_tolerance"
        side_effects:
          - "computes bell_curve_actual over in-scope SUBMITTED reviews"
          - "increments CalibrationSession.version by 1"
      - from: BALANCED
        to: FINALIZED
        trigger: "POST /calibration-sessions/{id}/finalize"
        actor: HrbpPartner
        preconditions:
          - "acting Employee.id == facilitator_id"
          - "acting facilitator was not the reviewer_id of any in-scope review (segregation of duties)"
        side_effects:
          - "for each in-scope SUBMITTED review: sets final_rating, transitions review SUBMITTED -> CALIBRATED"
          - "for each newly-CALIBRATED review whose final_rating band is pip_eligible: cascade-creates PipCase (OPEN)"
          - "increments CalibrationSession.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: comp-plan-approve-stale-cycle
    parent_entity: ReviewCycle
    write_endpoint: "POST /comp-plans/{id}/approve"
    occ_field: "expected_cycle_version"
    description: |
      Approving a CompPlan debits the cycle's merit_committed_total and
      equity_committed_total against finite budget pools. A client that last
      observed the cycle before another approval advanced those ledgers holds a
      stale view of remaining budget; approving against that stale cycle version
      is rejected so the budget check is evaluated on current committed totals.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: comp-plan-create-stale-review
    parent_entity: Review
    write_endpoint: "POST /comp-plans"
    occ_field: "expected_review_version"
    description: |
      A CompPlan is created against a CALIBRATED Review. If the review's version
      has advanced since the client observed it (for example its final_rating was
      re-set by a re-finalized calibration), creating a plan on the stale review
      view is rejected, since merit_pct/equity are derived from the review's
      current final_rating.
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: compute_composite_score
    trigger: "On POST /reviews/{id}/submit (manager submit)"
    algorithm: weighted_scoring
    formula: |
      # Goal component (0..100), weights normalized over the review's goals:
      goal_raw = sum(g.weight * min(g.attainment_pct, 1.0) for g in goals)
      weight_sum = sum(g.weight for g in goals)
      goal_score = (goal_raw / weight_sum) * 100        # weight_sum > 0 guaranteed (>=1 goal)
      # Feedback component (0..100) from SUBMITTED 360 feedback only:
      submitted = [f for f in feedback if f.status == SUBMITTED]
      if len(submitted) == 0:
          feedback_score = goal_score          # fallback: no 360 data -> goals carry full weight
      else:
          avg5 = sum(f.score for f in submitted) / len(submitted)   # 1..5
          feedback_score = (avg5 - 1) / 4 * 100                      # map 1..5 -> 0..100
      composite_score = round(GOAL_WEIGHT * goal_score + FEEDBACK_WEIGHT * feedback_score, 2)
    input_set: "All Goals on the review (SCORED), and FeedbackRequests with status==SUBMITTED only (PENDING/DECLINED excluded)"
    constants:
      GOAL_WEIGHT: 0.70
      FEEDBACK_WEIGHT: 0.30
      ATTAINMENT_CAP: 1.0
    precision: "2 decimal places, round_half_up; attainment capped at 1.0 inside the goal component"
    variants:
      - name: no_feedback_fallback
        when: "Zero SUBMITTED FeedbackRequests on the review"
        difference: "feedback_score is set equal to goal_score so composite reduces to goal_score; DECLINED/PENDING never count as zeros"

  - name: assign_final_rating
    trigger: "On CalibrationSession finalize, per in-scope review"
    algorithm: chronological
    formula: |
      # Calibration walks reviews in ascending created_at order (NOT id) and
      # assigns each to the band its composite_score falls in, then SHIFTS the
      # lowest-scoring reviews down one band while any band's actual fraction
      # exceeds target+tolerance, processing forced demotions oldest-first.
      ordered = sort(in_scope_reviews, by=created_at ascending)
      for r in ordered:
          r.final_rating = band_for_score(r.composite_score)   # min_score<=s<max_score, top band inclusive of 100
      while exists band B with actual_fraction(B) > target(B) + tolerance and B is not the lowest band:
          victim = lowest-composite_score review currently in B, tie-break by created_at ascending
          victim.final_rating = next_lower_band(B)
    input_set: "In-scope SUBMITTED reviews (cycle + session.department)"
    constants:
      TIE_BREAK: created_at_ascending
    precision: "Band assignment is exact integer-band; no rounding of scores beyond the 2dp composite"
    variants:
      - name: within_tolerance_no_shift
        when: "All bands already within target +/- tolerance"
        difference: "final_rating == band_for_score(composite_score) with zero demotions"
      - name: forced_demotion
        when: "A band exceeds target+tolerance"
        difference: "Lowest-score reviews in the over-full band are demoted oldest-first until tolerance met; this is the chronological-replay variant that diverges from the naive band_for_score result"

  - name: compute_merit_amount
    trigger: "On CompPlan compute (POST /comp-plans or recompute)"
    algorithm: tiered_pricing
    formula: |
      # merit_pct is selected from the merit/promo matrix, then a promo uplift
      # is applied, then a budget-scaling guard:
      base_pct = RatingBand(final_rating).merit_pct
      if plan_type == MERIT_AND_PROMO:
          promo_uplift = PROMO_UPLIFT_PER_BAND * promo_band_jump   # 1 or 2 bands
          merit_pct = min(base_pct + promo_uplift, MERIT_PCT_CAP)
      else:
          merit_pct = base_pct
      # Evaluation order is pinned: round the per-plan amount BEFORE it is added
      # to the cycle's running merit_committed_total ledger (round-then-sum).
      merit_amount = round(merit_pct * review.base_salary, 2)
    input_set: "The plan's Review (final_rating, base_salary), plan_type, promo_band_jump, the cycle's RatingBand matrix"
    constants:
      PROMO_UPLIFT_PER_BAND: 0.03
      MERIT_PCT_CAP: 0.25
    precision: "2 decimal places round_half_up; ORDER PINNED: round each plan's merit_amount first, THEN sum into merit_committed_total (round-then-sum, not sum-then-round)"
    variants:
      - name: merit_only
        when: "plan_type == MERIT_ONLY"
        difference: "no promo uplift; merit_pct == band base merit_pct"
      - name: merit_and_promo
        when: "plan_type == MERIT_AND_PROMO"
        difference: "promo uplift of 0.03 per band jumped is added, capped at 0.25"

  - name: compute_equity_refresh
    trigger: "On CompPlan compute (POST /comp-plans or recompute)"
    algorithm: waterfall_allocation
    formula: |
      # Equity refresh distributes from a finite cycle pool across plans in band
      # priority then tenure priority. Per-plan target:
      tenure_years = floor((cycle.created_at - employee.hire_date) / 365 days)
      if tenure_years < MIN_TENURE_YEARS: return 0     # boundary: < 1 year ineligible
      band_factor = BAND_EQUITY_FACTOR[final_rating]   # top band higher
      raw_target = band_factor * (1 + TENURE_STEP * min(tenure_years, TENURE_CAP_YEARS))
      # Waterfall: allocate raw_target while pool has remaining units; processed
      # band-priority desc then created_at ascending; final plan absorbs remainder
      # only up to its raw_target (no overflow beyond target).
      granted = min(raw_target, equity_refresh_pool - equity_committed_total)
      equity_refresh_units = round(max(granted, 0), 3)
    input_set: "Plan's Review.final_rating, Employee.hire_date, cycle.equity_refresh_pool, equity_committed_total, BAND_EQUITY_FACTOR map"
    constants:
      MIN_TENURE_YEARS: 1
      TENURE_STEP: 0.10
      TENURE_CAP_YEARS: 5
      BAND_EQUITY_FACTOR: { EXCEEDS: 400, MEETS: 150, BELOW: 0 }
    precision: "3 decimal places round_half_up on share units; allocation order band-priority desc then created_at ascending (never id)"
    variants:
      - name: tenure_ineligible
        when: "tenure_years < 1"
        difference: "equity_refresh_units == 0 regardless of band"
      - name: pool_constrained
        when: "remaining pool < raw_target"
        difference: "granted is clamped to remaining pool (waterfall remainder), so identical employees can receive different equity depending on allocation order"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right); FK bodies reference existing entities"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: business_referential
    check: "self_rating / manager_rating / final_rating reference a RatingBand.label that exists on the review's cycle"
    error_id: ERR_RATING_BAND_UNKNOWN
    http_status: 422
    applies_to: "review submit endpoints, calibration finalize"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: the acting user must not be the review's reviewer_id when returning/calibrating/approving/finalizing that review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reviews/{id}/return, POST /comp-plans/{id}/approve, POST /comp-plans/{id}/reject, POST /calibration-sessions/{id}/finalize"

  - priority: 7
    category: business_constraint
    check: "On cycle open: RatingBands tile [0,100] with no gaps/overlaps AND bell_curve_target keys equal the RatingBand label set"
    error_id: ERR_BAND_COVERAGE_INVALID
    http_status: 422
    applies_to: "POST /cycles/{id}/open"

  - priority: 8
    category: business_constraint
    check: "On cycle open: bell_curve_target fractions sum to 1.000 +/- 0.0005"
    error_id: ERR_DISTRIBUTION_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /cycles/{id}/open"

  - priority: 9
    category: business_constraint
    check: "Goal.weight sum on a review is in (0,1]; attainment_pct within [0,1.5]; cannot submit review with zero goals"
    error_id: ERR_GOAL_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /reviews/{id}/submit, POST /reviews/{id}/goals"

  - priority: 10
    category: business_constraint
    check: "Calibration balance blocked when any band's actual fraction deviates from target by more than distribution_tolerance (Bell Curve guard)"
    error_id: ERR_DISTRIBUTION_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /calibration-sessions/{id}/balance"

  - priority: 11
    category: business_temporal
    check: "Equity refresh requires employee tenure >= MIN_TENURE_YEARS (1 year) as of cycle.created_at"
    error_id: ERR_TENURE_INELIGIBLE
    http_status: 422
    applies_to: "POST /comp-plans, POST /comp-plans/{id}/recompute"

  - priority: 12
    category: business_fiscal
    check: "Approving a CompPlan must not push merit_committed_total above merit_budget_pct * eligible base salary"
    error_id: ERR_MERIT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /comp-plans/{id}/approve"

  - priority: 13
    category: business_fiscal
    check: "Approving a CompPlan must not push equity_committed_total above equity_refresh_pool"
    error_id: ERR_EQUITY_POOL_EXCEEDED
    http_status: 422
    applies_to: "POST /comp-plans/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "promo_band_jump must be 0 for MERIT_ONLY and 1 or 2 for MERIT_AND_PROMO"
    error_id: ERR_PROMO_JUMP_INVALID
    http_status: 422
    applies_to: "POST /comp-plans"

  - priority: 15
    category: state
    check: "OCC: expected parent version must equal the current parent version on guarded writes"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /comp-plans/{id}/approve, POST /comp-plans"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- ReviewCycle ----
  - method: POST
    path: "/cycles"
    description: "Create a review cycle (DRAFT)"
    roles: [HrAdmin]
    code: 201
    input: ["name", "cadence", "merit_budget_pct", "equity_refresh_pool", "bell_curve_target", "distribution_tolerance?"]
    output: ReviewCycle
    side_effects: ["creates ReviewCycle in DRAFT"]
  - method: GET
    path: "/cycles"
    description: "List cycles with pagination/filter by status"
    roles: [HrAdmin, HrbpPartner, CompApprover]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReviewCycle[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}"
    description: "Read a cycle including committed-total ledger fields"
    roles: [HrAdmin, HrbpPartner, CompApprover]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: []
  - method: POST
    path: "/cycles/{id}/rating-bands"
    description: "Add a RatingBand to a DRAFT cycle"
    roles: [HrAdmin]
    code: 201
    input: ["label", "min_score", "max_score", "merit_pct", "pip_eligible?"]
    output: RatingBand
    side_effects: ["creates RatingBand under the cycle"]
  - method: GET
    path: "/cycles/{id}/rating-bands"
    description: "List a cycle's RatingBands (reverse-reachability for RatingBand.cycle_id)"
    roles: [HrAdmin, HrbpPartner, CompApprover]
    code: 200
    input: []
    output: RatingBand[]
    side_effects: []
  - method: POST
    path: "/cycles/{id}/open"
    description: "DRAFT -> OPEN"
    roles: [HrAdmin]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: ["validates band coverage + distribution; increments ReviewCycle.version by 1"]
  - method: POST
    path: "/cycles/{id}/start-calibration"
    description: "OPEN -> CALIBRATION"
    roles: [HrAdmin]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: ["increments ReviewCycle.version by 1"]
  - method: POST
    path: "/cycles/{id}/start-comp-planning"
    description: "CALIBRATION -> COMP_PLANNING"
    roles: [HrAdmin]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: ["increments ReviewCycle.version by 1"]
  - method: POST
    path: "/cycles/{id}/close"
    description: "COMP_PLANNING -> CLOSED"
    roles: [HrAdmin]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: ["validates final merit budget; increments ReviewCycle.version by 1"]

  # ---- Employee ----
  - method: POST
    path: "/employees"
    description: "Create an employee"
    roles: [HrAdmin]
    code: 201
    input: ["full_name", "manager_id?", "department", "hire_date", "is_active?"]
    output: Employee
    side_effects: ["creates Employee"]
  - method: GET
    path: "/employees/{id}"
    description: "Read an employee"
    roles: [HrAdmin, HrbpPartner, CompApprover, Manager, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees"
    description: "List employees; filter by manager_id (reverse-reachability for Employee.manager_id self-FK) or department"
    roles: [HrAdmin, HrbpPartner, CompApprover]
    code: 200
    input: ["manager_id?", "department?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # ---- Review ----
  - method: POST
    path: "/reviews"
    description: "Create a Review under a cycle (DRAFT)"
    roles: [HrAdmin, Manager]
    code: 201
    input: ["cycle_id", "employee_id", "reviewer_id", "base_salary"]
    output: Review
    side_effects: ["creates Review in DRAFT"]
  - method: GET
    path: "/reviews/{id}"
    description: "Read a review including composite_score and final_rating"
    roles: [HrAdmin, HrbpPartner, CompApprover, Manager, Employee]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: GET
    path: "/reviews"
    description: "List reviews; filter by cycle_id (reverse-reachability for Review.cycle_id), employee_id (Review.employee_id), reviewer_id (Review.reviewer_id)"
    roles: [HrAdmin, HrbpPartner, CompApprover, Manager]
    code: 200
    input: ["cycle_id?", "employee_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: Review[]
    side_effects: []
  - method: PATCH
    path: "/reviews/{id}"
    description: "Set self_rating or manager_rating on a review in the appropriate state"
    roles: [Manager, Employee]
    code: 200
    input: ["self_rating?", "manager_rating?"]
    output: Review
    side_effects: ["increments Review.version by 1"]
  - method: POST
    path: "/reviews/{id}/begin-self-review"
    description: "DRAFT -> SELF_REVIEW"
    roles: [Employee]
    code: 200
    input: []
    output: Review
    side_effects: ["increments Review.version by 1"]
  - method: POST
    path: "/reviews/{id}/submit-self"
    description: "SELF_REVIEW -> MANAGER_REVIEW"
    roles: [Employee]
    code: 200
    input: []
    output: Review
    side_effects: ["increments Review.version by 1"]
  - method: POST
    path: "/reviews/{id}/submit"
    description: "MANAGER_REVIEW -> SUBMITTED; computes composite_score"
    roles: [Manager]
    code: 200
    input: []
    output: Review
    side_effects: ["computes composite_score; increments Review.version by 1"]
  - method: POST
    path: "/reviews/{id}/return"
    description: "SUBMITTED -> RETURNED (HRBP, segregation of duties)"
    roles: [HrbpPartner]
    code: 200
    input: []
    output: Review
    side_effects: ["increments Review.version by 1"]
  - method: POST
    path: "/reviews/{id}/reopen"
    description: "RETURNED -> MANAGER_REVIEW"
    roles: [Manager]
    code: 200
    input: []
    output: Review
    side_effects: ["increments Review.version by 1"]

  # ---- Goal ----
  - method: POST
    path: "/reviews/{id}/goals"
    description: "Add a Goal to a review"
    roles: [Manager, Employee]
    code: 201
    input: ["title", "weight", "attainment_pct?"]
    output: Goal
    side_effects: ["creates Goal in OPEN"]
  - method: GET
    path: "/reviews/{id}/goals"
    description: "List a review's Goals (reverse-reachability for Goal.review_id)"
    roles: [HrAdmin, HrbpPartner, Manager, Employee]
    code: 200
    input: []
    output: Goal[]
    side_effects: []
  - method: POST
    path: "/goals/{id}/score"
    description: "Set attainment_pct and move Goal OPEN -> SCORED"
    roles: [Manager]
    code: 200
    input: ["attainment_pct"]
    output: Goal
    side_effects: ["sets Goal.status=SCORED; increments Goal.version by 1"]

  # ---- FeedbackRequest ----
  - method: POST
    path: "/reviews/{id}/feedback-requests"
    description: "Create a 360 feedback request"
    roles: [Manager, HrbpPartner]
    code: 201
    input: ["rater_id", "relationship"]
    output: FeedbackRequest
    side_effects: ["creates FeedbackRequest in PENDING"]
  - method: GET
    path: "/reviews/{id}/feedback-requests"
    description: "List a review's feedback requests (reverse-reachability for FeedbackRequest.review_id)"
    roles: [HrAdmin, HrbpPartner, Manager]
    code: 200
    input: []
    output: FeedbackRequest[]
    side_effects: []
  - method: POST
    path: "/feedback-requests/{id}/submit"
    description: "PENDING -> SUBMITTED with a score"
    roles: [Employee]
    code: 200
    input: ["score"]
    output: FeedbackRequest
    side_effects: ["increments FeedbackRequest.version by 1"]
  - method: POST
    path: "/feedback-requests/{id}/decline"
    description: "PENDING -> DECLINED"
    roles: [Employee]
    code: 200
    input: []
    output: FeedbackRequest
    side_effects: ["increments FeedbackRequest.version by 1"]
  - method: GET
    path: "/feedback-requests"
    description: "List feedback requests; filter by rater_id (reverse-reachability for FeedbackRequest.rater_id), review_id (FeedbackRequest.review_id)"
    roles: [HrAdmin, HrbpPartner, Manager, Employee]
    code: 200
    input: ["rater_id?", "review_id?", "status?", "limit?", "offset?"]
    output: FeedbackRequest[]
    side_effects: []
  - method: GET
    path: "/feedback-requests/{id}"
    description: "Read a single feedback request"
    roles: [HrAdmin, HrbpPartner, Manager, Employee]
    code: 200
    input: []
    output: FeedbackRequest
    side_effects: []

  # ---- CalibrationSession ----
  - method: POST
    path: "/calibration-sessions"
    description: "Create a calibration session for a cycle+department"
    roles: [HrbpPartner]
    code: 201
    input: ["cycle_id", "department", "facilitator_id"]
    output: CalibrationSession
    side_effects: ["creates CalibrationSession in OPEN"]
  - method: GET
    path: "/calibration-sessions"
    description: "List calibration sessions; filter by cycle_id (reverse-reachability for CalibrationSession.cycle_id)"
    roles: [HrAdmin, HrbpPartner]
    code: 200
    input: ["cycle_id?", "facilitator_id?", "limit?", "offset?"]
    output: CalibrationSession[]
    side_effects: []
  - method: GET
    path: "/calibration-sessions/{id}"
    description: "Read a calibration session with bell_curve_actual"
    roles: [HrAdmin, HrbpPartner]
    code: 200
    input: []
    output: CalibrationSession
    side_effects: []
  - method: POST
    path: "/calibration-sessions/{id}/balance"
    description: "OPEN -> BALANCED; computes bell_curve_actual and enforces tolerance"
    roles: [HrbpPartner]
    code: 200
    input: []
    output: CalibrationSession
    side_effects: ["computes bell_curve_actual; increments CalibrationSession.version by 1"]
  - method: POST
    path: "/calibration-sessions/{id}/finalize"
    description: "BALANCED -> FINALIZED; sets final_rating per review, cascades CALIBRATED + PipCase creation"
    roles: [HrbpPartner]
    code: 200
    input: []
    output: CalibrationSession
    side_effects: ["per in-scope review: assign_final_rating, SUBMITTED->CALIBRATED; cascade-create PipCase for pip_eligible bands; increments CalibrationSession.version by 1"]

  # ---- CompPlan ----
  - method: POST
    path: "/comp-plans"
    description: "Create a CompPlan for a CALIBRATED review; computes merit + equity"
    roles: [Manager]
    code: 201
    input: ["cycle_id", "review_id", "plan_type", "promo_band_jump?", "expected_review_version"]
    output: CompPlan
    side_effects: ["computes merit_pct/merit_amount/equity_refresh_units; creates CompPlan in DRAFT"]
  - method: GET
    path: "/comp-plans"
    description: "List comp plans; filter by cycle_id (reverse-reachability for CompPlan.cycle_id), review_id (CompPlan.review_id)"
    roles: [HrAdmin, HrbpPartner, CompApprover, Manager]
    code: 200
    input: ["cycle_id?", "review_id?", "status?", "limit?", "offset?"]
    output: CompPlan[]
    side_effects: []
  - method: GET
    path: "/comp-plans/{id}"
    description: "Read a comp plan"
    roles: [HrAdmin, HrbpPartner, CompApprover, Manager]
    code: 200
    input: []
    output: CompPlan
    side_effects: []
  - method: POST
    path: "/comp-plans/{id}/recompute"
    description: "Recompute merit/equity on a DRAFT plan (e.g., after promo_band_jump change)"
    roles: [Manager]
    code: 200
    input: ["plan_type?", "promo_band_jump?"]
    output: CompPlan
    side_effects: ["recomputes merit_amount/equity_refresh_units; increments CompPlan.version by 1"]
  - method: POST
    path: "/comp-plans/{id}/propose"
    description: "DRAFT -> PROPOSED"
    roles: [Manager]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["increments CompPlan.version by 1"]
  - method: POST
    path: "/comp-plans/{id}/approve"
    description: "PROPOSED -> APPROVED; debits ledgers, finalizes review, may cure PIP (OCC on cycle)"
    roles: [CompApprover]
    code: 200
    input: ["expected_cycle_version"]
    output: CompPlan
    side_effects: ["adds to merit_committed_total + equity_committed_total; Review CALIBRATED->FINALIZED; PipCase OPEN->CURED if band no longer pip_eligible; increments CompPlan.version by 1 and ReviewCycle.version by 1"]
  - method: POST
    path: "/comp-plans/{id}/reject"
    description: "PROPOSED -> REJECTED (no ledger impact)"
    roles: [CompApprover]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["increments CompPlan.version by 1"]

  # ---- PipCase ----
  - method: GET
    path: "/reviews/{id}/pip-cases"
    description: "List PipCases for a review (reverse-reachability for PipCase.review_id)"
    roles: [HrAdmin, HrbpPartner, Manager]
    code: 200
    input: []
    output: PipCase[]
    side_effects: []
  - method: GET
    path: "/pip-cases"
    description: "List PipCases; filter by employee_id (reverse-reachability for PipCase.employee_id)"
    roles: [HrAdmin, HrbpPartner]
    code: 200
    input: ["employee_id?", "status?", "limit?", "offset?"]
    output: PipCase[]
    side_effects: []
  - method: GET
    path: "/pip-cases/{id}"
    description: "Read a PIP case"
    roles: [HrAdmin, HrbpPartner, Manager]
    code: 200
    input: []
    output: PipCase
    side_effects: []
  - method: POST
    path: "/pip-cases/{id}/activate"
    description: "OPEN -> ACTIVE with duration/target"
    roles: [HrbpPartner]
    code: 200
    input: ["duration_days", "target_score"]
    output: PipCase
    side_effects: ["increments PipCase.version by 1"]
  - method: POST
    path: "/pip-cases/{id}/assess"
    description: "ACTIVE -> CURED or FAILED by outcome_score vs target_score"
    roles: [HrbpPartner]
    code: 200
    input: ["outcome_score"]
    output: PipCase
    side_effects: ["CURED if outcome_score>=target_score else FAILED (FAILED sets Employee.is_active=false); increments PipCase.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or FK-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state from which the requested transition is defined"
  - id: ERR_RATING_BAND_UNKNOWN
    http: 422
    condition: "A supplied rating label does not match any RatingBand.label on the cycle"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user is the review's reviewer_id and is attempting a return/calibrate/approve/reject/finalize on it"
  - id: ERR_BAND_COVERAGE_INVALID
    http: 422
    condition: "RatingBands do not tile [0,100] without gaps/overlaps, or bell_curve_target keys != RatingBand label set"
  - id: ERR_DISTRIBUTION_NOT_NORMALIZED
    http: 422
    condition: "bell_curve_target fractions do not sum to 1.000 +/- 0.0005"
  - id: ERR_GOAL_WEIGHTS_INVALID
    http: 422
    condition: "Goal weight sum not in (0,1], attainment out of [0,1.5], or submitting a review with zero goals"
  - id: ERR_DISTRIBUTION_OUT_OF_TOLERANCE
    http: 422
    condition: "A band's actual fraction deviates from target by more than distribution_tolerance at balance"
  - id: ERR_TENURE_INELIGIBLE
    http: 422
    condition: "Employee tenure < 1 year as of cycle.created_at for an equity refresh"
  - id: ERR_MERIT_BUDGET_EXCEEDED
    http: 422
    condition: "Approving the plan would push merit_committed_total above the merit budget"
  - id: ERR_EQUITY_POOL_EXCEEDED
    http: 422
    condition: "Approving the plan would push equity_committed_total above equity_refresh_pool"
  - id: ERR_PROMO_JUMP_INVALID
    http: 422
    condition: "promo_band_jump not 0 for MERIT_ONLY or not 1/2 for MERIT_AND_PROMO"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version != current ReviewCycle.version on a guarded approve"
  - id: ERR_STALE_REVIEW_VERSION
    http: 412
    condition: "expected_review_version != current Review.version on comp-plan create"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, missing required field, or value outside declared field constraints"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: HrAdmin
    description: "Owns cycle lifecycle and org/employee setup"
    identity: opaque
    exclusive_operations:
      - "POST /cycles, /cycles/{id}/rating-bands, /cycles/{id}/open, /start-calibration, /start-comp-planning, /close"
      - "POST /employees"
    shared_operations:
      - "POST /reviews (with Manager)"
      - "GET on cycles, employees, reviews, comp-plans, pip-cases"

  - name: Manager
    description: "Authors reviews, scores goals, builds comp plans for own reports"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /reviews/{id}/submit, /reviews/{id}/reopen"
      - "POST /goals/{id}/score"
      - "POST /comp-plans, /comp-plans/{id}/recompute, /comp-plans/{id}/propose"
    shared_operations:
      - "POST /reviews (with HrAdmin)"
      - "POST /reviews/{id}/goals, /reviews/{id}/feedback-requests (with Employee/HRBP)"
      - "PATCH /reviews/{id} (manager_rating)"
      - "GET reviews, goals, comp-plans, pip-cases"

  - name: Employee
    description: "Subject of a review; self-assessment and 360 feedback"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /reviews/{id}/begin-self-review, /reviews/{id}/submit-self"
      - "POST /feedback-requests/{id}/submit, /feedback-requests/{id}/decline"
    shared_operations:
      - "POST /reviews/{id}/goals (with Manager)"
      - "PATCH /reviews/{id} (self_rating)"
      - "GET own review/goals"

  - name: HrbpPartner
    description: "Facilitates calibration, returns reviews, runs PIP process; must not be the reviewer of in-scope reviews"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /calibration-sessions, /balance, /finalize"
      - "POST /reviews/{id}/return"
      - "POST /pip-cases/{id}/activate, /pip-cases/{id}/assess"
    shared_operations:
      - "POST /reviews/{id}/feedback-requests (with Manager)"
      - "GET on cycles, reviews, calibration-sessions, comp-plans, pip-cases"

  - name: CompApprover
    description: "Approves/rejects comp plans against budget; segregation from the authoring manager"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /comp-plans/{id}/approve, /comp-plans/{id}/reject"
    shared_operations:
      - "GET on cycles, reviews, comp-plans"
