  # ===========================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics,
  # reachable through distinct endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: station_occupancy_at_exact_capacity_admission_boundary
        grounds:
          - calculations.walkin_capacity_occupancy
          - "validations[priority=8]"
        distinguishing_aspect: |
          Metric: station occupancy count vs capacity. With a single STUFF
          station of capacity 2 and exactly 2 non-terminal sessions occupying
          it, the third walk-in creation hits occupancy >= capacity (2 >= 2)
          and is rejected; after one occupying session is paid (terminal), the
          identical request succeeds. The >= (not >) comparison is the boundary.
        test_recipe:
          setup:
            - "Store S11; Customers C11a, C11b, C11c; non-licensed model; STUFF station capacity 2 (SOUND/BATHE/DRESS capacity 2)"
            - "Consumables provisioned"
          setup_api_calls:
