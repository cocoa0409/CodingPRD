        test_recipe:
          setup: ["zone capacity 5; 4 GOOD items stocked one at a time"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
