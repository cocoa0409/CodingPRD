          assert:
            - "Proposal.${prop1_id} created  # the first write advanced Prospect.version"
            - "err == \"ERR_STALE_VERSION\" with http status 412  # the replayed version is now stale"

      - name: occ_assignment_create_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[assignment-create-stale-fundraiser]", "errors[ERR_STALE_VERSION]", "validations[priority=7]"]
        distinguishing_aspect: "A second assignment replaying the fundraiser's creation-time version is rejected 412 because the first assignment advanced the fundraiser's version."
        test_recipe:
          setup: ["fundraiser (version captured at creation); two plain prospects"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "P1", prospect_type: "INDIVIDUAL", contact_email: "p1@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p1_id: $.data.id }
            - call: "POST /advancement/prospects"
              payload: { full_name: "P2", prospect_type: "INDIVIDUAL", contact_email: "p2@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p1_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p2_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_STALE_VERSION\" with http status 412"
            - "Fundraiser.${f_id}.current_prospect_count == 1  # only the fresh write applied"

      - name: version_increments_once_per_mutation
        claim_type: version_increment
        grounds: [entities.Proposal, "concurrency_rules[proposal-create-stale-prospect]"]
        distinguishing_aspect: "PATCH on an editable proposal increments its version by exactly 1 per mutation and updates updated_at."
        test_recipe:
          setup: ["DRAFT proposal exists (version 1)"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
