            - { call: "POST /yard/vessels", payload: { name: "MV Late", owner_name: "O L", owner_user_id: "owner-2", loa_ft: 36, beam_ft: 12, hull_type: "SAIL", displacement_tons: 14 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "PL", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-01-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
