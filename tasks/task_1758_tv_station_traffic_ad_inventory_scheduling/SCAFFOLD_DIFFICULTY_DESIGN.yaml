  # ======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: break_capacity_aggregate_seconds
        grounds:
          - calculations.avail_headroom_check
          - entities.AvailUnit.fields.total_seconds
        distinguishing_aspect: |
          Semantics (aggregate capacity): an AvailUnit break is a duration
          pool — spots coexist freely as long as the SUM of durations stays
          within total_seconds. Two 30s spots share a 60s break; the third
          fails on the aggregate, not on any positional collision.
