  # =========================================================================
  - section: consistency_model
    instances:
      - name: settle_immediately_visible_in_shift_drawer
        claim_type: immediate
        grounds: [entities.Shift.fields.cash_sales_cents]
        distinguishing_aspect: "After a CASH fuel settle, a GET /shifts/{id} in the same sequence already shows cash_sales_cents updated (immediate consistency)."
        test_recipe:
          setup: ["OPEN shift; one CAPTURED CASH BRONZE fuel sale 12 gal @419 (total 5028)."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id, sh_v1: $.data.version }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CASH" }
              as: CashierAttendant
              captures: { tx: $.data.id }
            - call: "POST /fuel-transactions/${tx}/capture"
              payload: {}
              as: CashierAttendant
            - call: "POST /fuel-transactions/${tx}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
          trigger:
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { cs: $.data.cash_sales_cents, exp: $.data.expected_drawer_cents }
          assert:
            - "Shift.${sh}.cash_sales_cents == 5028"
            - "Shift.${sh}.expected_drawer_cents == 25028"
