            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-04T00:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rD59}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rD59}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
