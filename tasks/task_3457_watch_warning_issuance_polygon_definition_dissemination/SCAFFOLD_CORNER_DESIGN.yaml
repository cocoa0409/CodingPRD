              captures: { st_err: $.data.error_id }
          assert:
            - "the settle is 409 with error_id == ERR_RECORD_NOT_SETTLABLE"
            - "DisseminationRecord.${st_rec}.status stays QUEUED with retry_count == 0 and sent_at null"

      - name: issue_against_dissipated_storm_returns_invalid_storm_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.StormEvent, errors.ERR_INVALID_STORM_STATE]
        distinguishing_aspect: "A DISSIPATED storm can no longer support a warning: issue fails 409 ERR_INVALID_STORM_STATE even though the readings met the criteria while the storm was alive."
        test_recipe:
