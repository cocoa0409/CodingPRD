scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_accrual_estimated_vs_settled_basis_diverges
        grounds:
          - calculations.royalty_accrual
          - calculations.royalty_pool_split
          - entities.RoyaltyStatement.fields.basis
          - entities.RoyaltyStatement.fields.lines
          - entities.RevenueEvent.fields.basis_status
          - entities.CreativeAssignment.fields.unrecouped_advance_cents
        distinguishing_aspect: |
          One identical revenue ledger produces two different creator grosses because the ESTIMATED
          variant admits ESTIMATED-plus-ACTUAL rows and holds back 20% of the PRINT_DM net, while the
          SETTLED variant admits ACTUAL rows only with no holdback: 85432 cents versus 79082 cents for
          the same SCRIPT participant in the same period.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Title 'Nebula Knights' GREENLIT with royalty_pool_bps 1200 and cover_participation_bps 1500"
            - "three ACCEPTED assignments on the title, created in this order: SCRIPT 5000 bps with a 25000-cent advance, PENCILS 3000 bps, COVER 1500 bps (so sum_bps_noncover is 8000)"
            - "Issue #1 of the title exists"
            - "five RevenueEvent rows for period 2026-12 on that issue: PRINT_DM/ACTUAL net 328500, PRINT_DM/ESTIMATED net 66000, DIGITAL/ACTUAL net 56000, COLLECTED/ESTIMATED net 90000, SUBSIDIARY/ACTUAL net 200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EditorInChief
            - call: "POST /comics/creators"
              payload: { full_name: "Wanda Writer", crafts: ["SCRIPT"], default_page_rate_cents: 12000 }
              as: EditorInChief
              captures: { cr_w: $.data.id }
            - call: "POST /comics/creators"
              payload: { full_name: "Pablo Penciller", crafts: ["PENCILS"], default_page_rate_cents: 9000 }
              as: EditorInChief
              captures: { cr_p: $.data.id }
            - call: "POST /comics/creators"
              payload: { full_name: "Cora Coverartist", crafts: ["COVER"], default_page_rate_cents: 15000 }
              as: EditorInChief
              captures: { cr_c: $.data.id }
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
              captures: { t1_v_a: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 5000, booking_start_date: "2026-08-01", booking_end_date: "2026-12-01", advance_cents: 25000, expected_title_version: "${t1_v_a}" }
              as: EditorInChief
              captures: { a_w: $.data.id }
            - call: "POST /comics/creative-assignments/${a_w}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "GET /comics/titles/${t1}"
              payload: {}
              as: EditorInChief
              captures: { t1_v_b: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_p}", craft: "PENCILS", page_rate_cents: 9000, royalty_share_bps: 3000, booking_start_date: "2026-08-01", booking_end_date: "2026-12-01", expected_title_version: "${t1_v_b}" }
              as: EditorInChief
              captures: { a_p: $.data.id }
            - call: "POST /comics/creative-assignments/${a_p}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_p}"
            - call: "GET /comics/titles/${t1}"
              payload: {}
              as: EditorInChief
              captures: { t1_v_c: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_c}", craft: "COVER", page_rate_cents: 15000, royalty_share_bps: 1500, booking_start_date: "2026-08-01", booking_end_date: "2026-12-01", expected_title_version: "${t1_v_c}" }
              as: EditorInChief
              captures: { a_c: $.data.id }
            - call: "POST /comics/creative-assignments/${a_c}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_c}"
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-10-14" }
              as: ManagingEditor
              captures: { i1: $.data.id }
            - call: "POST /comics/revenue-events"
              payload: { issue_id: "${i1}", channel: "PRINT_DM", basis_status: "ACTUAL", gross_receipts_cents: 400000, net_receipts_cents: 328500, units: 1108, period: "2026-12" }
              as: RoyaltyAccountant
            - call: "POST /comics/revenue-events"
              payload: { issue_id: "${i1}", channel: "PRINT_DM", basis_status: "ESTIMATED", gross_receipts_cents: 80000, net_receipts_cents: 66000, units: 220, period: "2026-12" }
              as: RoyaltyAccountant
            - call: "POST /comics/revenue-events"
              payload: { issue_id: "${i1}", channel: "DIGITAL", basis_status: "ACTUAL", gross_receipts_cents: 80000, net_receipts_cents: 56000, units: 400, period: "2026-12" }
              as: RoyaltyAccountant
            - call: "POST /comics/revenue-events"
              payload: { issue_id: "${i1}", channel: "COLLECTED", basis_status: "ESTIMATED", gross_receipts_cents: 120000, net_receipts_cents: 90000, units: 150, period: "2026-12" }
              as: RoyaltyAccountant
            - call: "POST /comics/revenue-events"
              payload: { issue_id: "${i1}", channel: "SUBSIDIARY", basis_status: "ACTUAL", gross_receipts_cents: 250000, net_receipts_cents: 200000, period: "2026-12" }
              as: RoyaltyAccountant
          trigger:
            - call: "POST /comics/royalty-statements"
              payload: { title_id: "${t1}", creator_id: "${cr_w}", period: "2026-12", basis: "ESTIMATED" }
              as: RoyaltyAccountant
              captures: { st_est: $.data.id }
            - call: "POST /comics/royalty-statements"
              payload: { title_id: "${t1}", creator_id: "${cr_w}", period: "2026-12", basis: "SETTLED" }
              as: RoyaltyAccountant
              captures: { st_set: $.data.id }
          assert:
            - "RoyaltyStatement.${st_est}.gross_royalty_cents == 85432"
            - "RoyaltyStatement.${st_est}.recoupment_applied_cents == 25000"
            - "RoyaltyStatement.${st_est}.payable_cents == 60432"
            - "RoyaltyStatement.${st_est}.lines has 4 entries with channel values [PRINT_DM, DIGITAL, COLLECTED, SUBSIDIARY] in that order"
            - "RoyaltyStatement.${st_est}.lines[channel=PRINT_DM].included_net_cents == 315600"
            - "RoyaltyStatement.${st_est}.lines[channel=PRINT_DM].channel_pool_cents == 37872"
            - "RoyaltyStatement.${st_est}.lines[channel=PRINT_DM].creator_share_cents == 20120"
            - "RoyaltyStatement.${st_est}.lines[channel=COLLECTED].creator_share_cents == 7172"
            - "RoyaltyStatement.${st_set}.gross_royalty_cents == 79082"
            - "RoyaltyStatement.${st_set}.payable_cents == 54082"
            - "RoyaltyStatement.${st_set}.lines has 3 entries and no COLLECTED line"
            - "RoyaltyStatement.${st_set}.lines[channel=PRINT_DM].included_net_cents == 328500"
            - "RoyaltyStatement.${st_set}.lines[channel=PRINT_DM].channel_pool_cents == 39420"
            - "RoyaltyStatement.${st_set}.lines[channel=PRINT_DM].creator_share_cents == 20942"
            - "RoyaltyStatement.${st_est}.gross_royalty_cents - RoyaltyStatement.${st_set}.gross_royalty_cents == 6350"
            - "CreativeAssignment.${a_w}.unrecouped_advance_cents == 25000 (both statements are still DRAFT, so the advance ledger has not moved)"

      - name: print_run_quantity_order_driven_vs_demand_forecast_same_state
        grounds:
          - calculations.print_run_quantity
          - entities.PrintRun.fields.basis
          - entities.PrintRun.fields.quantity
          - entities.PrintRun.fields.order_base_units
          - entities.RetailerOrder.fields.is_reorder
          - concurrency_rules[print-run-create-stale-issue]
        distinguishing_aspect: |
          From one identical database state (issue ON_SALE, one PRINTED run of 1500, two FOC_LOCKED
          orders totalling 1108 units, one SUBMITTED 200-copy reorder) the ORDER_DRIVEN basis yields
          quantity 1500 from the locked order book while the DEMAND_FORECAST basis yields 750 from
          trailing print velocity, because the two variants read disjoint input sets.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-08-21 -> 2026-09-23 -> 2026-10-14"
            - "Title GREENLIT with one creator holding all five production crafts on five adjacent, non-overlapping bookings; all five assignments ACCEPTED (5000+1500+800+700+500 = 8500 bps, exactly the non-cover budget)"
            - "Issue #1 with all five REQUIRED_CRAFTS stages APPROVED, so production_status == CAMERA_READY and total_slip_days == 0"
            - "Issue #1 solicited and published in catalog 2026-08, two orders FOC_LOCKED (100 standard -> 114 units, 900 standard -> 994 units), issue.total_ordered_units == 1108"
            - "one ORDER_DRIVEN printing of 1500 completed, issue released, commercial_status == ON_SALE"
            - "one further order of 200 standard copies created after release (is_reorder == true) and SUBMITTED"
