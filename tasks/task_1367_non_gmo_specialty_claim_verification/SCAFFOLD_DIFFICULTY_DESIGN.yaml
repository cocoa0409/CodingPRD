          assert:
            - "error_id == ERR_PLAN_NOT_ACTIVE (priority 6 state beats priority 7 business_referential; both conditions hold)"

      - name: decide_verify_safety_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_NON_COMPLIANT_RESULTS_EXIST]
          - errors[ERR_AUDIT_STALE]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_temporal): a CONFIRMED
          NON_COMPLIANT sample exists (safety) AND the only PASSED audit is
          stale (temporal: decided 2026-08-01 + 12 months <= 2027-09-05);
          priority 8 safety wins, so ERR_NON_COMPLIANT_RESULTS_EXIST must surface.
        test_recipe:
          setup:
            - "Product UNDER_EVALUATION: HIGH_RISK ingredient with current affidavit, plan COMPLETED via one sample confirmed at 1.50 (NON_COMPLIANT), brand has a PASSED audit decided at 2026-08-01"
            - "clock advanced to 2027-09-05, making the audit stale; affidavit (valid_until 2028-06-01) still current so the ingredient stays NON_COMPLIANT, not PENDING"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-06-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 1.50 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au: $.data.id } }
            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-05T00:00:00Z" }, as: VerifierAdmin }
          trigger:
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NON_COMPLIANT_RESULTS_EXIST (priority 8 business_safety beats priority 9 business_temporal; the audit is stale at the same instant)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: exemption_weight_at_exact_threshold
        grounds:
          - calculations.ingredient_exemption_and_requirements
          - entities.Ingredient.fields.is_exempt
        distinguishing_aspect: |
          Boundary on the weight-percentage metric via POST /ingredients:
          declared_weight_pct == exemption_max_weight_pct (0.50) is EXEMPT
          (inclusive <=), while 0.51 is not; the flag flips requirements.
        test_recipe:
          setup:
            - "Standard with exemption_max_weight_pct 0.5; DRAFT product P1"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "AtBoundary", crop_type: "LOW_RISK", declared_weight_pct: 0.50 }, as: BrandRep, as_user_id: "${b1}", captures: { ex: $.data.is_exempt, ra: $.data.requires_affidavit, cs: $.data.compliance_status } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "AboveBoundary", crop_type: "LOW_RISK", declared_weight_pct: 0.51 }, as: BrandRep, as_user_id: "${b1}", captures: { ex2: $.data.is_exempt, ra2: $.data.requires_affidavit, cs2: $.data.compliance_status } }
          assert:
            - "weight 0.50 (== threshold): is_exempt == true, requires_affidavit == false, compliance_status == EXEMPTED"
            - "weight 0.51 (> threshold): is_exempt == false, requires_affidavit == true, compliance_status == PENDING"

      - name: pcr_result_at_exact_threshold
        grounds:
          - state_machines.TestSample.RESULT_RECORDED_to_CONFIRMED
          - entities.TestSample.fields.outcome
        distinguishing_aspect: |
          Boundary on the PCR-result metric via POST /samples/{id}/confirm (a
          different endpoint and metric than the weight boundary):
          result_gmo_pct == ingredient_threshold_pct (0.90) is COMPLIANT
          (inclusive <=), 0.91 is NON_COMPLIANT with the full cascade.
        test_recipe:
          setup:
            - "Product UNDER_EVALUATION, HIGH_RISK 100% ingredient, INGREDIENT_INTAKE plan (required 1); samples S1 and S2 both created while the plan is ACTIVE"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.90 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2", captures: { oc1: $.data.outcome } }
            - { call: "POST /samples/${s2}/record-result", payload: { result_gmo_pct: 0.91 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s2}/confirm", as: LabAnalyst, as_user_id: "lab-2", captures: { oc2: $.data.outcome } }
            - { call: "GET /ingredients/${ing}", as: VerifierAdmin, captures: { ics: $.data.compliance_status } }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { cexp: $.data.confirmed_exposure_pct } }
          assert:
            - "S1 at exactly 0.90 == threshold: outcome == COMPLIANT"
            - "S2 at 0.91: outcome == NON_COMPLIANT"
            - "ingredient compliance_status == NON_COMPLIANT and confirmed_exposure_pct == 91.00 (per-ingredient resolution is MAX over CONFIRMED: 100.00 x 0.91)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_gated_by_affidavit_state
        grounds:
          - state_machines.Product.DRAFT_to_SUBMITTED
          - errors[ERR_AFFIDAVIT_MISSING]
        distinguishing_aspect: |
          Entity pair (Product, SupplierAffidavit): the Product DRAFT->SUBMITTED
          transition reads SupplierAffidavit state — a SUBMITTED-but-not-ACCEPTED
          affidavit blocks with ERR_AFFIDAVIT_MISSING; reviewing it to ACCEPTED
          (covering now) unblocks the same transition.
        test_recipe:
          setup:
            - "Product P1 DRAFT with HIGH_RISK 100% ingredient (requires_affidavit); affidavit AFF exists in SUBMITTED state"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
          trigger:
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}", captures: { st: $.data.enrollment_status } }
          assert:
            - "first submit: error_id == ERR_AFFIDAVIT_MISSING (affidavit present but not ACCEPTED)"
            - "after review ACCEPTED: submit succeeds and enrollment_status == SUBMITTED"

      - name: plan_create_gated_by_product_state
        grounds:
          - state_machines.Product.SUBMITTED_to_UNDER_EVALUATION
          - errors[ERR_PRODUCT_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair (SamplingPlan, Product) — distinct from the
          (Product, SupplierAffidavit) pair: plan creation is rejected while the
          product is merely SUBMITTED, and succeeds once the product reaches
          UNDER_EVALUATION.
        test_recipe:
          setup:
            - "Product P1 SUBMITTED (HIGH_RISK ingredient with ACCEPTED affidavit); product version captured"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${v1}" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { v2: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${v2}" }, as: VerifierAdmin, captures: { plan: $.data.id, st: $.data.status } }
          assert:
            - "while SUBMITTED: error_id == ERR_PRODUCT_INVALID_STATE"
            - "after begin-evaluation: creation succeeds, plan status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: affidavit_window_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_AFFIDAVIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on resource (ingredient_id, supplier_name):
          [2026-01-01, 2026-07-01) blocks a sibling starting 2026-06-01 (true
          overlap) but accepts one starting exactly 2026-07-01 (adjacent touch
          at the exclusive end is not an overlap).
        test_recipe:
          setup:
            - "DRAFT product with HIGH_RISK ingredient; affidavit A1 for supplier Acme ACCEPTED covering [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "Acme", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-07-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { a1: $.data.id } }
            - { call: "POST /affidavits/${a1}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
          trigger:
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "Acme", valid_from: "2026-06-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "Acme", valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { a3: $.data.id } }
          assert:
            - "overlapping window (2026-06-01 < 2026-07-01): error_id == ERR_AFFIDAVIT_WINDOW_OVERLAP"
            - "adjacent window (valid_from == sibling valid_until exactly): created with 201, new affidavit id returned"

      - name: facility_audit_capacity_cardinality
        grounds:
          - validations[priority=10]
          - errors[ERR_AUDIT_CAPACITY_CONFLICT]
        distinguishing_aspect: |
          Aggregate-capacity semantics on resource (brand_id, facility_name) —
          deliberately different from the geometric half-open intervals of
          affidavit windows: at most ONE audit with status IN {SCHEDULED,
          REPORT_SUBMITTED} may exist regardless of how far apart the
          scheduled_dates are; the gate lifts once the occupant reaches a
          terminal state.
        test_recipe:
          setup:
            - "Brand B1; audit A1 for facility F1 is SCHEDULED at 2026-08-05"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-12-01T00:00:00Z" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /facility-audits/${a1}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${a1}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-12-01T00:00:00Z" }, as: VerifierAdmin, captures: { a2: $.data.id } }
          assert:
            - "second audit while A1 is SCHEDULED: error_id == ERR_AUDIT_CAPACITY_CONFLICT even though its date is months later"
            - "after A1 reaches terminal PASSED: the identical create succeeds with 201"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: license_suspension_reinstate_validity_conserved
        grounds:
          - calculations.license_validity_extension_on_reinstate
          - state_machines.LabelLicense.SUSPENDED_to_ACTIVE
          - state_machines.Product.SUSPENDED_to_VERIFIED
        distinguishing_aspect: |
          Conserved TIME quantity: across an ENFORCEMENT suspend + reinstate
          pair, license remaining validity is unchanged — valid_until extends by
          exactly the suspension duration (40 days here), so
          valid_until_new - reinstated_at == valid_until_old - suspended_at.
        test_recipe:
          setup:
            - "Product VERIFIED at 2026-08-01 (license valid_from 2026-08-01T00:00:00Z, valid_until 2027-08-01T00:00:00Z); enforcement case opened"
            - "clock at 2026-08-31 when the case is substantiated with LICENSE_SUSPENSION (suspended_at = 2026-08-31T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-06-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au: $.data.id } }
            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: VerifierAdmin }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "RETEST_FAILURE", description: "retest above threshold" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: VerifierAdmin }
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "LICENSE_SUSPENSION" }, as: EnforcementOfficer, as_user_id: "eo-2" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-10T00:00:00Z" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/reinstate", as: VerifierAdmin, captures: { pst: $.data.enrollment_status } }
            - { call: "GET /licenses?product_id=${p1}", as: VerifierAdmin, captures: { licStatus: "$.data[0].status", licUntil: "$.data[0].valid_until" } }
          assert:
            - "after reinstate: product enrollment_status == VERIFIED and license status == ACTIVE"
            - "license valid_until == 2027-09-10T00:00:00Z (2027-08-01 + 40-day suspension 2026-08-31 -> 2026-10-10)"
            - "remaining-validity invariant holds: (2027-09-10 - 2026-10-10) == (2027-08-01 - 2026-08-31) == 335 days"

      - name: plan_confirm_invalidate_count_conserved
        grounds:
          - calculations.sampling_plan_completion
          - state_machines.TestSample.CONFIRMED_to_INVALIDATED
          - entities.SamplingPlan.fields.confirmed_sample_count
        distinguishing_aspect: |
          Conserved COUNT quantity (different conserved type than the license
          time invariant): confirm of a sample followed by invalidate of the same
          sample returns confirmed_sample_count to its pre-confirm value and the
          plan to ACTIVE, with product exposure restored to 0.00.
        test_recipe:
          setup:
            - "Product UNDER_EVALUATION, HIGH_RISK 100% ingredient, INGREDIENT_INTAKE plan required == 1; sample S1 collected and recorded at 0.10"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
          trigger:
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "GET /sampling-plans/${plan}", as: VerifierAdmin, captures: { c1: $.data.confirmed_sample_count, p1s: $.data.status } }
            - { call: "POST /samples/${s1}/invalidate", as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "GET /sampling-plans/${plan}", as: VerifierAdmin, captures: { c2: $.data.confirmed_sample_count, p2s: $.data.status } }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { cexp: $.data.confirmed_exposure_pct } }
          assert:
            - "after confirm: confirmed_sample_count == 1 and plan status == COMPLETED"
            - "after invalidate (compensating action): confirmed_sample_count == 0 — exactly the pre-confirm value — and plan status == ACTIVE"
            - "product confirmed_exposure_pct == 0.00 (no drift from the confirm+invalidate pair)"
