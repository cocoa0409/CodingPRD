# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Sections/claim_types come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_rightsholder_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Rightsholder
          - endpoints.POST./rightsholders
        distinguishing_aspect: "POST /rightsholders with required fields returns 201; status defaults ACTIVE, lifetime_earned_cents=0, unrecouped_balance_cents=0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rightsholders"
              payload: { legal_name: "Acme Pub", party_type: "PUBLISHER", payee_country: "GB" }
              as: Administrator
              captures: { rh_id: $.data.id, rh_status: $.data.status, rh_v: $.data.version }
          assert:
            - "response code == 201"
            - "Rightsholder.status == ACTIVE (default applied)"
            - "Rightsholder.minimum_payout_cents == 5000 (default) AND withholding_pct == 0 (default)"
            - "Rightsholder.lifetime_earned_cents == 0 AND unrecouped_balance_cents == 0 AND version == 1"

      - name: get_rightsholder_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET./rightsholders/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /rightsholders/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rightsholders/00000000-0000-4000-8000-000000000000"
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND AND HTTP status == 404"

      - name: create_work_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Work.fields.iswc
          - endpoints.POST./works
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /works omitting required iswc returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /works"
              payload: { title: "No ISWC", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST AND HTTP status == 400"

      - name: create_work_invalid_enum_pro_affiliation
        claim_type: Type Constraints
        grounds:
          - entities.Work.fields.pro_affiliation
          - endpoints.POST./works
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /works with pro_affiliation not in {ASCAP,BMI,NONE} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /works"
              payload: { title: "Bad PRO", iswc: "T-000000099-0", pro_affiliation: "SESAC", duration_seconds: 180 }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST AND HTTP status == 400"

      - name: duplicate_iswc_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Work.fields.iswc
          - validations[priority=8]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Two works with the same ISWC: the second returns ERR_DUPLICATE_CODE (409)."
        test_recipe:
          setup: ["one work with iswc T-000000050-0 exists"]
          setup_api_calls:
            - call: "POST /works"
              payload: { title: "First", iswc: "T-000000050-0", pro_affiliation: "BMI", duration_seconds: 180 }
              as: Administrator
          trigger:
            - call: "POST /works"
              payload: { title: "Dup", iswc: "T-000000050-0", pro_affiliation: "ASCAP", duration_seconds: 200 }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_CODE AND HTTP status == 409"

      - name: recording_computed_split_total_bps
        claim_type: Computed Fields
        grounds:
          - entities.Recording.fields.split_total_bps
          - endpoints.POST./recording-shares
        distinguishing_aspect: "Recording.split_total_bps is computed from the sum of its RecordingShare.split_bps (4000+6000=10000); client-supplied values are ignored."
        test_recipe:
          setup: ["a work registered with one share; a recording on it with two recording-shares 4000 and 6000 bps"]
          setup_api_calls:
            - call: "POST /rightsholders"
              payload: { legal_name: "LblX", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { lx_id: $.data.id }
            - call: "POST /works"
              payload: { title: "WkX", iswc: "T-000000051-0", pro_affiliation: "NONE", duration_seconds: 200 }
              as: Administrator
              captures: { wkx_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${wkx_id}", rightsholder_id: "${lx_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${wkx_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${wkx_id}", isrc: "USAAA5100001", title: "RecX", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { rx_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rx_id}", rightsholder_id: "${lx_id}", split_bps: 4000 }
              as: Administrator
          trigger:
            - call: "POST /recording-shares"
              payload: { recording_id: "${rx_id}", rightsholder_id: "${lx_id}", split_bps: 6000 }
              as: Administrator
            - call: "GET /recordings/${rx_id}"
              as: Administrator
              captures: { stb: $.data.split_total_bps }
          assert:
            - "Recording.${rx_id}.split_total_bps == 10000 (sum of 4000 + 6000, computed)"

      - name: list_rightsholders_via_statements_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET./statements
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /statements?rightsholder_id=&limit=1 returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["R with two DRAFT statements (non-overlapping periods)"]
          setup_api_calls:
            - call: "POST /rightsholders"
              payload: { legal_name: "RPaging", party_type: "WRITER", payee_country: "US" }
              as: Administrator
              captures: { rp_id: $.data.id }
            - call: "POST /statements"
              payload: { rightsholder_id: "${rp_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z" }
              as: RoyaltyOperator
            - call: "POST /statements"
              payload: { rightsholder_id: "${rp_id}", period_start: "2026-02-01T00:00:00.000Z", period_end: "2026-03-01T00:00:00.000Z" }
              as: RoyaltyOperator
          trigger:
            - call: "GET /statements?rightsholder_id=${rp_id}&limit=1&offset=0"
              as: RoyaltyOperator
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_void_on_allocated_usage_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.UsageEvent.INGESTED_to_VOIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An ALLOCATED usage event cannot be voided — POST /usage-events/{id}/void returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["an ALLOCATED PERFORMANCE usage event (full happy path through allocate)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "RVoid", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1 }
              as: Administrator
              captures: { rv_id: $.data.id }
            - call: "POST /works"
              payload: { title: "WkVoid", iswc: "T-000000052-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { wkv_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${wkv_id}", rightsholder_id: "${rv_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${wkv_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${wkv_id}", isrc: "USAAA5200001", title: "RecVoid", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { rcv_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rcv_id}", rightsholder_id: "${rv_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${rcv_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${rcv_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-02-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${rv_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z" }
              as: RoyaltyOperator
            - call: "POST /usage-events"
              payload: { recording_id: "${rcv_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-01-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
              captures: { uev_id: $.data.id }
            - call: "POST /usage-events/${uev_id}/allocate"
              payload: {}
              as: RoyaltyOperator
          trigger:
            - call: "POST /usage-events/${uev_id}/void"
              payload: {}
              as: RoyaltyOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE AND HTTP status == 409"

      - name: sync_decline_then_accept_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SyncLicense.DRAFT_to_DECLINED
          - state_machines.SyncLicense.DRAFT_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DECLINED sync license is terminal: a subsequent accept returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a DECLINED sync license"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "LblDec", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { ld_id: $.data.id }
            - call: "POST /rightsholders"
              payload: { legal_name: "LicDec", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { licd_id: $.data.id }
            - call: "POST /works"
              payload: { title: "WkDec", iswc: "T-000000053-0", pro_affiliation: "BMI", duration_seconds: 200 }
              as: Administrator
              captures: { wkd_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${wkd_id}", rightsholder_id: "${ld_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${wkd_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${wkd_id}", isrc: "USAAA5300001", title: "RecDec", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { rcd_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rcd_id}", rightsholder_id: "${ld_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${rcd_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /sync-licenses"
              payload: { recording_id: "${rcd_id}", licensee_id: "${licd_id}", media_type: "TV", territory: "US", term_months: 12, base_fee_cents: 50000 }
              as: RoyaltyOperator
              captures: { sld_id: $.data.id }
            - call: "POST /sync-licenses/${sld_id}/decline"
              payload: {}
              as: RoyaltyOperator
          trigger:
            - call: "POST /sync-licenses/${sld_id}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${licd_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE AND HTTP status == 409"

      - name: rights_window_revoke_from_revoked_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.UsageEvent.INGESTED_to_ALLOCATED
          - entities.RightsWindow.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Revoking an already-REVOKED rights window returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a recording with a REVOKED rights window"]
          setup_api_calls:
            - call: "POST /rightsholders"
              payload: { legal_name: "LblRev", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { lrev_id: $.data.id }
            - call: "POST /works"
              payload: { title: "WkRev", iswc: "T-000000054-0", pro_affiliation: "NONE", duration_seconds: 200 }
              as: Administrator
              captures: { wkr_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${wkr_id}", rightsholder_id: "${lrev_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${wkr_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${wkr_id}", isrc: "USAAA5400001", title: "RecRev", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { rcr_id: $.data.id }
            - call: "POST /rights-windows"
              payload: { recording_id: "${rcr_id}", territory: "US", rights_type: "MECHANICAL", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-02-01T00:00:00.000Z" }
              as: Administrator
              captures: { rwr_id: $.data.id }
            - call: "POST /rights-windows/${rwr_id}/revoke"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /rights-windows/${rwr_id}/revoke"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE AND HTTP status == 409"

      - name: reopen_with_settled_payout_blocked
        claim_type: guarded transitions
        grounds:
          - state_machines.Statement.FINALIZED_to_DRAFT
          - state_machines.Payout.PENDING_to_SETTLED
          - errors[ERR_PAYOUT_EXISTS]
        distinguishing_aspect: "A statement whose payout is SETTLED cannot be reopened — POST /statements/{id}/reopen returns ERR_PAYOUT_EXISTS (409). Note Statement reverts to FINALIZED only on payout REVERSE, so a SETTLED payout pins the statement in PAID; reopen on PAID is invalid AND specifically guarded by ERR_PAYOUT_EXISTS."
        test_recipe:
          setup: ["R with a FINALIZED statement net 112000, a payout created and SETTLED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "RSettle", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { rs_id: $.data.id }
            - call: "POST /works"
              payload: { title: "WkSettle", iswc: "T-000000055-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { wks_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${wks_id}", rightsholder_id: "${rs_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${wks_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${wks_id}", isrc: "USAAA5500001", title: "RecSettle", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { rcs_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rcs_id}", rightsholder_id: "${rs_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${rcs_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${rcs_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-03-01T00:00:00.000Z", term_end: "2026-04-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${rs_id}", period_start: "2026-03-01T00:00:00.000Z", period_end: "2026-04-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { sts_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${rcs_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-03-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
              captures: { ues_id: $.data.id }
            - call: "POST /usage-events/${ues_id}/allocate"
              payload: {}
              as: RoyaltyOperator
            - call: "GET /statements/${sts_id}"
              as: RoyaltyOperator
              captures: { sts_v: $.data.version }
            - call: "POST /statements/${sts_id}/finalize"
              payload: { expected_statement_version: "${sts_v}" }
              as: RoyaltyOperator
            - call: "POST /payouts"
              payload: { statement_id: "${sts_id}" }
              as: RoyaltyOperator
              captures: { pays_id: $.data.id }
            - call: "POST /payouts/${pays_id}/settle"
              payload: {}
              as: RoyaltyOperator
            - call: "GET /statements/${sts_id}"
              as: RoyaltyOperator
              captures: { sts_v2: $.data.version }
          trigger:
            - call: "POST /statements/${sts_id}/reopen"
              payload: { expected_statement_version: "${sts_v2}" }
              as: RoyaltyOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAYOUT_EXISTS AND HTTP status == 409"

      - name: finalize_blocked_by_unallocated_usage_in_period
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Statement.DRAFT_to_FINALIZED
          - validations[priority=15]
          - errors[ERR_UNALLOCATED_USAGE_IN_PERIOD]
        distinguishing_aspect: "Finalizing a statement while an INGESTED (unallocated) usage targeting this rightsholder falls in the period returns ERR_UNALLOCATED_USAGE_IN_PERIOD (409)."
        test_recipe:
          setup: ["R with an OPEN DRAFT statement and an INGESTED (not yet allocated) PERFORMANCE usage for R inside the period"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "RUnalloc", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { ru_id: $.data.id }
            - call: "POST /works"
              payload: { title: "WkUn", iswc: "T-000000056-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { wku_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${wku_id}", rightsholder_id: "${ru_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${wku_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${wku_id}", isrc: "USAAA5600001", title: "RecUn", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { rcu_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rcu_id}", rightsholder_id: "${ru_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${rcu_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${rcu_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-04-01T00:00:00.000Z", term_end: "2026-05-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${ru_id}", period_start: "2026-04-01T00:00:00.000Z", period_end: "2026-05-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stu_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${rcu_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-04-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
            - call: "GET /statements/${stu_id}"
              as: RoyaltyOperator
              captures: { stu_v: $.data.version }
          trigger:
            - call: "POST /statements/${stu_id}/finalize"
              payload: { expected_statement_version: "${stu_v}" }
              as: RoyaltyOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNALLOCATED_USAGE_IN_PERIOD AND HTTP status == 409"

      - name: advance_write_off_recomputes_unrecouped
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Advance.ACTIVE_to_WRITTEN_OFF
          - entities.Rightsholder.fields.unrecouped_balance_cents
        distinguishing_aspect: "Writing off an ACTIVE advance sets status WRITTEN_OFF and recomputes Rightsholder.unrecouped_balance_cents to exclude it (from 50000 to 0)."
        test_recipe:
          setup: ["R with one ACTIVE advance principal 50000 (unrecouped_balance 50000)"]
          setup_api_calls:
            - call: "POST /rightsholders"
              payload: { legal_name: "RWoff", party_type: "WRITER", payee_country: "US" }
              as: Administrator
              captures: { rw_id: $.data.id }
            - call: "POST /advances"
              payload: { rightsholder_id: "${rw_id}", principal_cents: 50000, recoupment_pct: 1.0 }
              as: Administrator
              captures: { advw_id: $.data.id }
          trigger:
            - call: "POST /advances/${advw_id}/write-off"
              payload: {}
              as: Administrator
              captures: { adv_status: $.data.status }
            - call: "GET /rightsholders/${rw_id}"
              as: Administrator
              captures: { unrec: $.data.unrecouped_balance_cents }
          assert:
            - "Advance.${advw_id}.status == WRITTEN_OFF"
            - "Rightsholder.${rw_id}.unrecouped_balance_cents == 0 (write-off excluded from balance)"

  # ===========================================================================
  - section: validations
    instances:
      - name: split_total_exceeds_10000_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_SPLIT_TOTAL_INVALID]
        distinguishing_aspect: "Adding a CompositionShare that would push split_total_bps above 10000 returns ERR_SPLIT_TOTAL_INVALID (422)."
        test_recipe:
          setup: ["a work with one composition-share of 7000 bps"]
          setup_api_calls:
            - call: "POST /rightsholders"
