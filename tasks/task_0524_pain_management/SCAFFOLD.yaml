# =============================================================================
# PRD Benchmark Scaffold — Pain Management Clinic & Controlled-Substance Compliance
# Difficulty: Expert
# =============================================================================

scenario: |
  524. Pain Management Clinic & Controlled-Substance Compliance: referral & intake,
  treatment plan (injection/RFA/medication), opioid agreement & PDMP check, urine
  drug-screen schedule, procedure scheduling (fluoroscopy suite), prior-auth,
  pill-count/compliance audit, taper & discharge

domain_name: pain-management
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # Clinic is the aggregate root (Patient/Provider/FluoroscopySuite hang off it);
  # controlled-substance objects (Prescription, UDS, PillCountAudit, OpioidAgreement,
  # PdmpCheck) are flat FK-linked peers of Patient; Procedure links Patient + Suite.

  state_machine_shape: cyclic
  # UrineDrugScreen recollect loop and Prescription taper re-escalation loop are cyclic;
  # TreatmentPlan is branching fork-join.

  relationship_patterns:
    - one_to_many          # Clinic -> Patient; Patient -> Prescription
    - cross_aggregate      # Procedure references FluoroscopySuite across the tree
    - polymorphic          # PriorAuthorization.target references either a Procedure or a Prescription

  role_model: segregation_of_duties
  # The Provider who signs an OpioidAgreement's counter-signature cannot also be
  # the ComplianceOfficer who clears a flagged patient; prescribing and dispensing
  # audit are separated.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic name" }
      - { name: state_code, type: string, source: input, description: "US state code, e.g. CA" }
      - { name: med_review_threshold_mg, type: integer, source: input, default: 90, description: "Daily MED (morphine milligram equivalent) at or above which a prescription requires an ACTIVE, unexpired opioid agreement plus a documented PDMP check; boundary is >=" }
      - { name: pill_count_tolerance, type: integer, source: input, default: 2, description: "Absolute pill-count discrepancy (pills) at or below which an audit is CONSISTENT; boundary is <=" }
      - { name: current_utc, type: datetime, source: system, default: "2026-05-01T00:00:00Z", description: "Logical clock for this clinic; defaults to 2026-05-01T00:00:00Z until set via /_clock/set_current_utc" }

  - name: Provider
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: full_name, type: string, source: input, description: "Provider full name" }
      - { name: dea_number, type: string, source: input, description: "DEA registration number for controlled substance prescribing" }
      - { name: role_kind, type: enum, source: input, description: "PRESCRIBER | COMPLIANCE_OFFICER; a PRESCRIBER may write prescriptions, a COMPLIANCE_OFFICER may clear flags. Constraints: PRESCRIBER, COMPLIANCE_OFFICER" }

  - name: Patient
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: referral_source, type: string, source: input, description: "Referring provider or facility" }
      - { name: status, type: enum, source: system, description: "REFERRED -> INTAKE_SCHEDULED -> INTAKE_COMPLETE -> ACTIVE -> DISCHARGED. Constraints: REFERRED, INTAKE_SCHEDULED, INTAKE_COMPLETE, ACTIVE, DISCHARGED" }
      - { name: intake_utc, type: datetime, source: input, default: null, description: "Scheduled intake appointment time (set on schedule-intake)" }
      - { name: compliance_flag, type: enum, source: computed, default: NONE, description: "NONE | FLAGGED | CLEARED; FLAGGED when an inconsistent UDS or failed pill-count fires. Constraints: NONE, FLAGGED, CLEARED" }
      - { name: current_daily_med_mg, type: number, source: computed, default: 0, description: "Sum of daily MED across this patient's ACTIVE prescriptions; reconciled on every prescription mutation" }
      - { name: open_uds_count, type: integer, source: computed, default: 0, description: "Count of this patient's UrineDrugScreen rows in SCHEDULED or COLLECTED state" }

  - name: OpioidAgreement
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Provider.id; must be a PRESCRIBER who counter-signs" }
      - { name: signed_utc, type: datetime, source: system, default: null, description: "Timestamp the agreement was counter-signed (clinic clock)" }
      - { name: expires_utc, type: datetime, source: system, default: null, description: "signed_utc + AGREEMENT_VALIDITY_DAYS; agreement is unexpired while current_utc < expires_utc" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> (EXPIRED | REVOKED). Constraints: DRAFT, ACTIVE, EXPIRED, REVOKED" }

  - name: PdmpCheck
    parent: Clinic
    common_fields: false
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: queried_by_provider_id, type: string, source: input, description: "FK -> Provider.id; the prescriber who ran the query" }
      - { name: outside_med_mg, type: number, source: input, default: 0, description: "Out-of-clinic daily MED reported by the state PDMP database (non-negative)" }
      - { name: outcome, type: enum, source: input, description: "CLEAR | CONCERN; CONCERN indicates overlapping outside prescriptions. Constraints: CLEAR, CONCERN" }
      - { name: queried_utc, type: datetime, source: system, description: "Clinic clock at query time; a check is fresh while current_utc < queried_utc + PDMP_FRESHNESS_DAYS" }

  - name: TreatmentPlan
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: modality, type: enum, source: input, description: "INJECTION | RFA | MEDICATION. Constraints: INJECTION, RFA, MEDICATION" }
      - { name: requires_procedure, type: boolean, source: computed, description: "True for INJECTION and RFA (procedure branch), false for MEDICATION" }
      - { name: requires_medication, type: boolean, source: computed, description: "True for MEDICATION (prescription branch), false otherwise" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> {PROCEDURE_PATH | MEDICATION_PATH} -> COMPLETED / CANCELLED. Constraints: PROPOSED, ACTIVE, PROCEDURE_PATH, MEDICATION_PATH, COMPLETED, CANCELLED" }

  - name: FluoroscopySuite
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: name, type: string, source: input, description: "Suite label, e.g. Suite-A" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 15, description: "Minutes of mandatory cleanup that must follow every procedure before the next may start in the same suite" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Sum of duration_minutes over this suite's SCHEDULED procedures; conserved quantity for the booking invariant" }

  - name: Procedure
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; plan must be a procedure-path plan" }
      - { name: suite_id, type: string, source: input, description: "FK -> FluoroscopySuite.id" }
      - { name: prior_auth_id, type: string, source: input, description: "FK -> PriorAuthorization.id; must be APPROVED and target this procedure request" }
      - { name: start_utc, type: datetime, source: input, description: "Procedure start (inclusive)" }
      - { name: duration_minutes, type: integer, source: input, description: "Procedure duration; end = start_utc + duration_minutes (exclusive)" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> SCHEDULED -> COMPLETED / CANCELLED. Constraints: REQUESTED, SCHEDULED, COMPLETED, CANCELLED" }

  - name: PriorAuthorization
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: target_kind, type: enum, source: input, description: "PROCEDURE | PRESCRIPTION; polymorphic authorization target. Constraints: PROCEDURE, PRESCRIPTION" }
      - { name: payer, type: string, source: input, description: "Insurance payer name" }
      - { name: authorized_units, type: integer, source: input, description: "Units authorized (procedure count or day-supply)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> {APPROVED | DENIED}. Constraints: SUBMITTED, APPROVED, DENIED" }

  - name: Prescription
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Provider.id; must be a PRESCRIBER" }
      - { name: prior_auth_id, type: string, source: input, default: null, description: "FK -> PriorAuthorization.id; required only for controlled prescriptions at or above the review threshold" }
      - { name: drug_name, type: string, source: input, description: "Controlled substance name, e.g. oxycodone" }
      - { name: dose_mg, type: number, source: input, description: "Milligrams per unit dose" }
      - { name: units_per_day, type: number, source: input, description: "Doses per day" }
      - { name: conversion_factor, type: number, source: input, description: "MED conversion factor for the drug (e.g. oxycodone 1.5)" }
      - { name: day_supply, type: integer, source: input, description: "Total days the prescription covers" }
      - { name: pills_dispensed, type: integer, source: input, description: "Total pills handed to patient at fill" }
      - { name: provisional_daily_med_mg, type: number, source: computed, description: "Projected daily MED at prescribe time = dose_mg * units_per_day * conversion_factor" }
      - { name: final_daily_med_mg, type: number, source: computed, default: null, description: "Chronological daily MED recomputed at taper completion from actual elapsed days" }
      - { name: taper_step_pct, type: number, source: input, default: null, description: "Percent reduction applied per taper step (0-100)" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> {TAPERING <-> ACTIVE} -> DISCONTINUED; SUSPENDED reachable from ACTIVE/TAPERING. Constraints: PROPOSED, ACTIVE, TAPERING, SUSPENDED, DISCONTINUED" }

  - name: UrineDrugScreen
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: due_utc, type: datetime, source: input, description: "When the screen is due to be collected" }
      - { name: collected_utc, type: datetime, source: system, default: null, description: "Clinic clock at collection" }
      - { name: expected_substances, type: array, source: input, description: "Substances that SHOULD be present given active prescriptions" }
      - { name: detected_substances, type: array, source: input, default: null, description: "Substances actually detected (set at result)" }
      - { name: recollect_count, type: integer, source: computed, default: 0, description: "Number of times this screen lineage has been recollected after an inconsistent result" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COLLECTED -> {RESULTED_CONSISTENT | RESULTED_INCONSISTENT}; RESULTED_INCONSISTENT -> SCHEDULED (recollect). Constraints: SCHEDULED, COLLECTED, RESULTED_CONSISTENT, RESULTED_INCONSISTENT" }

  - name: PillCountAudit
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id; the prescription being counted" }
      - { name: audit_utc, type: datetime, source: input, description: "When the pill count was performed" }
      - { name: counted_pills, type: integer, source: input, description: "Pills physically counted in the bottle" }
      - { name: expected_pills_forward, type: number, source: computed, description: "Forward-looking expected remaining = pills_dispensed - projected consumption over full elapsed days" }
      - { name: expected_pills_chronological, type: number, source: computed, description: "Chronological expected remaining = pills_dispensed minus per-interval consumption summed across dose-schedule intervals" }
      - { name: discrepancy_pills, type: number, source: computed, description: "abs(expected_pills_chronological - counted_pills)" }
      - { name: result, type: enum, source: computed, description: "CONSISTENT | INCONSISTENT based on discrepancy vs clinic tolerance. Constraints: CONSISTENT, INCONSISTENT" }

  - name: ControlledSubstanceLedger
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: total_active_med_mg, type: number, source: computed, default: 0, description: "Conserved quantity: sum of provisional_daily_med_mg over the patient's ACTIVE and TAPERING prescriptions" }
      - { name: discontinued_med_mg, type: number, source: computed, default: 0, description: "Running sum of MED removed by discontinuations; total_active_med_mg + discontinued_med_mg + suspended_med_mg is invariant across prescribe/discontinue pairs" }
      - { name: suspended_med_mg, type: number, source: computed, default: 0, description: "MED currently parked in SUSPENDED prescriptions" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patient
    initial_state: REFERRED
    terminal_states: [DISCHARGED]
    transitions:
      - from: REFERRED
        to: INTAKE_SCHEDULED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/schedule-intake"
        actor: IntakeCoordinator
        preconditions:
          - "Patient.status == REFERRED (ERR_PATIENT_STATE_INVALID)"
          - "intake_utc >= clinic.current_utc (ERR_INTAKE_IN_PAST)"
        side_effects:
          - "Patient.intake_utc set to supplied value"

      - from: INTAKE_SCHEDULED
        to: INTAKE_COMPLETE
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/complete-intake"
        actor: IntakeCoordinator
        preconditions:
          - "Patient.status == INTAKE_SCHEDULED (ERR_PATIENT_STATE_INVALID)"
          - "clinic.current_utc >= Patient.intake_utc (ERR_INTAKE_NOT_DUE)"
        side_effects: []

      - from: INTAKE_COMPLETE
        to: ACTIVE
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/activate"
        actor: IntakeCoordinator
        preconditions:
          - "Patient.status == INTAKE_COMPLETE (ERR_PATIENT_STATE_INVALID)"
          - "At least one TreatmentPlan for this patient is in ACTIVE, PROCEDURE_PATH, or MEDICATION_PATH (ERR_NO_ACTIVE_PLAN)"
        side_effects: []

      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/discharge"
        actor: Prescriber
        preconditions:
          - "Patient.status == ACTIVE (ERR_PATIENT_STATE_INVALID)"
          - "No Prescription for this patient in ACTIVE or SUSPENDED status (ERR_ACTIVE_PRESCRIPTIONS_EXIST)"
        side_effects:
          - "CASCADE(depth2): each Procedure for this patient in REQUESTED or SCHEDULED -> CANCELLED"
          - "each cancelled SCHEDULED Procedure debits its suite: FluoroscopySuite.booked_minutes -= duration_minutes"
          - "each TreatmentPlan for this patient not already terminal -> CANCELLED"

  - entity: OpioidAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clinics/{clinicId}/opioid-agreements/{agreementId}/counter-sign"
        actor: Prescriber
        preconditions:
          - "OpioidAgreement.status == DRAFT (ERR_AGREEMENT_STATE_INVALID)"
          - "Acting prescriber's Provider.id == OpioidAgreement.prescriber_id (ERR_NOT_AGREEMENT_PRESCRIBER)"
        side_effects:
          - "signed_utc = clinic.current_utc"
          - "expires_utc = signed_utc + AGREEMENT_VALIDITY_DAYS days"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /clinics/{clinicId}/opioid-agreements/{agreementId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "OpioidAgreement.status == ACTIVE (ERR_AGREEMENT_STATE_INVALID)"
        side_effects:
          - "CASCADE(depth3): revoke -> each ACTIVE/TAPERING opioid Prescription for this patient -> SUSPENDED; that suspension moves each Rx's provisional_daily_med_mg from ControlledSubstanceLedger.total_active_med_mg to suspended_med_mg; the ledger recompute re-derives Patient.current_daily_med_mg"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when clinic.current_utc >= expires_utc at prescribe-time evaluation)"
        actor: system
        preconditions:
          - "clinic.current_utc >= OpioidAgreement.expires_utc"
        side_effects: []

  - entity: TreatmentPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/approve"
        actor: Prescriber
        preconditions:
          - "TreatmentPlan.status == PROPOSED (ERR_PLAN_STATE_INVALID)"
        side_effects: []

      - from: ACTIVE
        to: PROCEDURE_PATH
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/route"
        actor: Prescriber
        preconditions:
          - "TreatmentPlan.status == ACTIVE (ERR_PLAN_STATE_INVALID)"
          - "TreatmentPlan.requires_procedure == true (ERR_PLAN_MODALITY_MISMATCH)"
        side_effects:
          - "Plan enters the procedure branch; only now may Procedures reference it"
        note: "Fork branch A of the branching machine (INJECTION/RFA modalities)"

      - from: ACTIVE
        to: MEDICATION_PATH
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/route"
        actor: Prescriber
        preconditions:
          - "TreatmentPlan.status == ACTIVE (ERR_PLAN_STATE_INVALID)"
          - "TreatmentPlan.requires_medication == true (ERR_PLAN_MODALITY_MISMATCH)"
        side_effects:
          - "Plan enters the medication branch; only now may Prescriptions reference it"
        note: "Fork branch B of the branching machine (MEDICATION modality)"

      - from: PROCEDURE_PATH
        to: COMPLETED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/complete"
        actor: Prescriber
        preconditions:
          - "TreatmentPlan.status == PROCEDURE_PATH (ERR_PLAN_STATE_INVALID)"
          - "Every Procedure referencing this plan is COMPLETED or CANCELLED (ERR_OPEN_PROCEDURES_EXIST)"
        side_effects: []
        note: "Join point of the fork-join"

      - from: MEDICATION_PATH
        to: COMPLETED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/complete"
        actor: Prescriber
        preconditions:
          - "TreatmentPlan.status == MEDICATION_PATH (ERR_PLAN_STATE_INVALID)"
          - "Every Prescription referencing this plan is DISCONTINUED (ERR_OPEN_PRESCRIPTIONS_EXIST)"
        side_effects: []
        note: "Join point of the fork-join"

  - entity: PriorAuthorization
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prior-authorizations/{paId}/decide"
        actor: PriorAuthClerk
        preconditions:
          - "PriorAuthorization.status == SUBMITTED (ERR_PA_STATE_INVALID)"
        side_effects: []

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prior-authorizations/{paId}/decide"
        actor: PriorAuthClerk
        preconditions:
          - "PriorAuthorization.status == SUBMITTED (ERR_PA_STATE_INVALID)"
        side_effects: []

  - entity: Procedure
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/schedule"
        actor: IntakeCoordinator
        preconditions:
          - "Procedure.status == REQUESTED (ERR_PROCEDURE_STATE_INVALID)"
          - "Referenced PriorAuthorization.status == APPROVED and target_kind == PROCEDURE (ERR_PRIOR_AUTH_NOT_APPROVED)"
          - "Referenced TreatmentPlan.status == PROCEDURE_PATH (ERR_PLAN_NOT_ON_PROCEDURE_PATH)"
          - "No SCHEDULED Procedure in the same suite whose [start, end+cleanup_buffer) interval overlaps this one (ERR_SUITE_TIME_CONFLICT)"
        side_effects:
          - "FluoroscopySuite.booked_minutes += duration_minutes"
          - "increments Clinic.version by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/complete"
        actor: Prescriber
        preconditions:
          - "Procedure.status == SCHEDULED (ERR_PROCEDURE_STATE_INVALID)"
          - "clinic.current_utc >= Procedure.start_utc (ERR_PROCEDURE_NOT_STARTED)"
        side_effects:
          - "FluoroscopySuite.booked_minutes -= duration_minutes"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/cancel"
        actor: IntakeCoordinator
        preconditions:
          - "Procedure.status == SCHEDULED or REQUESTED (ERR_PROCEDURE_STATE_INVALID)"
        side_effects:
          - "if was SCHEDULED: FluoroscopySuite.booked_minutes -= duration_minutes (compensating action for the schedule booking; leaves booked_minutes invariant across schedule+cancel)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/cancel"
        actor: IntakeCoordinator
        preconditions:
          - "Procedure.status == SCHEDULED or REQUESTED (ERR_PROCEDURE_STATE_INVALID)"
        side_effects: []

  - entity: Prescription
    initial_state: PROPOSED
    terminal_states: [DISCONTINUED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/activate"
        actor: Prescriber
        preconditions:
          - "Prescription.status == PROPOSED (ERR_RX_STATE_INVALID)"
          - "If provisional_daily_med_mg >= clinic.med_review_threshold_mg: an OpioidAgreement for this patient is ACTIVE and unexpired (ERR_OPIOID_AGREEMENT_REQUIRED)"
          - "If provisional_daily_med_mg >= clinic.med_review_threshold_mg: a fresh PdmpCheck exists for this patient (ERR_PDMP_CHECK_REQUIRED)"
          - "If provisional_daily_med_mg >= clinic.med_review_threshold_mg: prior_auth_id references an APPROVED PriorAuthorization with target_kind == PRESCRIPTION (ERR_PRIOR_AUTH_NOT_APPROVED)"
        side_effects:
          - "ControlledSubstanceLedger.total_active_med_mg += provisional_daily_med_mg"
          - "Patient.current_daily_med_mg recomputed"

      - from: ACTIVE
        to: TAPERING
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/start-taper"
        actor: Prescriber
        preconditions:
          - "Prescription.status == ACTIVE (ERR_RX_STATE_INVALID)"
          - "taper_step_pct is set and 0 < taper_step_pct <= 100 (ERR_TAPER_STEP_INVALID)"
        side_effects: []
        note: "Cyclic machine: TAPERING can return to ACTIVE via re-escalate"

      - from: TAPERING
        to: ACTIVE
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/re-escalate"
        actor: Prescriber
        preconditions:
          - "Prescription.status == TAPERING (ERR_RX_STATE_INVALID)"
        side_effects: []
        note: "Return leg of the taper cycle"

      - from: TAPERING
        to: DISCONTINUED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/discontinue"
        actor: Prescriber
        preconditions:
          - "Prescription.status == TAPERING or ACTIVE or SUSPENDED (ERR_RX_STATE_INVALID)"
        side_effects:
          - "final_daily_med_mg computed chronologically from actual elapsed days"
          - "ControlledSubstanceLedger: move provisional_daily_med_mg out of total_active_med_mg (or suspended_med_mg) into discontinued_med_mg (compensating action; total+discontinued+suspended invariant)"
          - "Patient.current_daily_med_mg recomputed"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/discontinue"
        actor: Prescriber
        preconditions:
          - "Prescription.status == TAPERING or ACTIVE or SUSPENDED (ERR_RX_STATE_INVALID)"
        side_effects:
          - "final_daily_med_mg computed chronologically from actual elapsed days"
          - "ControlledSubstanceLedger: move provisional_daily_med_mg out of total_active_med_mg into discontinued_med_mg (compensating action)"
          - "Patient.current_daily_med_mg recomputed"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic on OpioidAgreement revoke cascade OR on inconsistent-UDS cascade)"
        actor: system
        preconditions:
          - "Prescription.status == ACTIVE or TAPERING"
        side_effects:
          - "ControlledSubstanceLedger: move provisional_daily_med_mg from total_active_med_mg to suspended_med_mg"
          - "Patient.current_daily_med_mg recomputed"

      - from: SUSPENDED
        to: DISCONTINUED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/discontinue"
        actor: Prescriber
        preconditions:
          - "Prescription.status == TAPERING or ACTIVE or SUSPENDED (ERR_RX_STATE_INVALID)"
        side_effects:
          - "final_daily_med_mg computed chronologically from actual elapsed days"
          - "ControlledSubstanceLedger: move provisional_daily_med_mg out of suspended_med_mg into discontinued_med_mg (compensating action)"
          - "Patient.current_daily_med_mg recomputed"

  - entity: UrineDrugScreen
    initial_state: SCHEDULED
    terminal_states: [RESULTED_CONSISTENT]
    transitions:
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/collect"
        actor: IntakeCoordinator
        preconditions:
          - "UrineDrugScreen.status == SCHEDULED (ERR_UDS_STATE_INVALID)"
          - "clinic.current_utc >= UrineDrugScreen.due_utc (ERR_UDS_NOT_DUE)"
        side_effects:
          - "collected_utc = clinic.current_utc"

      - from: COLLECTED
        to: RESULTED_CONSISTENT
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/result"
        actor: ComplianceOfficer
        preconditions:
          - "UrineDrugScreen.status == COLLECTED (ERR_UDS_STATE_INVALID)"
          - "detected_substances set equals expected_substances set (server evaluates consistency)"
        side_effects: []

      - from: COLLECTED
        to: RESULTED_INCONSISTENT
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/result"
        actor: ComplianceOfficer
        preconditions:
          - "UrineDrugScreen.status == COLLECTED (ERR_UDS_STATE_INVALID)"
          - "detected_substances set differs from expected_substances set"
        side_effects:
          - "CASCADE(depth3): result INCONSISTENT -> Patient.compliance_flag = FLAGGED; the flag transition then suspends each ACTIVE/TAPERING opioid Prescription for the patient -> SUSPENDED; each suspension moves that Rx's provisional_daily_med_mg from ControlledSubstanceLedger.total_active_med_mg to suspended_med_mg and recomputes Patient.current_daily_med_mg"

      - from: RESULTED_INCONSISTENT
        to: SCHEDULED
        trigger: "POST /clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/recollect"
        actor: ComplianceOfficer
        preconditions:
          - "UrineDrugScreen.status == RESULTED_INCONSISTENT (ERR_UDS_STATE_INVALID)"
        side_effects:
          - "recollect_count += 1"
          - "detected_substances reset to null; new due_utc supplied"
        note: "Cyclic recollect loop"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: procedure-schedule-stale-clinic
    parent_entity: Clinic
    write_endpoint: "POST /clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/schedule"
    occ_field: "expected_clinic_version"
    description: |
      Scheduling a Procedure into a fluoroscopy suite against a Clinic whose
      version has advanced since the client last observed it is rejected.
      Every successful suite scheduling increments Clinic.version (suite
      capacity is a clinic-wide shared resource); a scheduling request that
      still carries a stale expected_clinic_version is rejected because the
      client's view of suite booking state may no longer hold.
    error_id: ERR_STALE_CLINIC_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_daily_med
    trigger: "Prescription creation (POST prescriptions) and re-evaluated at activate"
    algorithm: forward_looking
    formula: |
      provisional_daily_med_mg = round(dose_mg * units_per_day * conversion_factor, 2)
      This is the projected steady-state daily MED assuming the full prescribed
      schedule is taken every day for the whole day_supply.
    input_set: "single Prescription row; projected (forward-looking) full-course adherence"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "computed at prescribe/activate time"
        difference: "assumes full prescribed schedule for every day of day_supply (forward-looking projection)"

  - name: final_daily_med
    trigger: "Prescription discontinue (any of TAPERING/ACTIVE/SUSPENDED -> DISCONTINUED)"
    algorithm: chronological
    formula: |
      elapsed_days = max(1, floor((clinic.current_utc - prescription.created_at) / 86400 seconds))
      effective_days = min(elapsed_days, day_supply)
      final_daily_med_mg = round(dose_mg * units_per_day * conversion_factor, 2)
      # dose is unchanged, but the "true daily MED experienced" is scaled by the
      # fraction of the course actually elapsed vs planned; see variant.
      final_daily_med_mg = round(provisional_daily_med_mg * (effective_days / day_supply), 2)
    input_set: "single Prescription row; chronological actual elapsed days at discontinue"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final
        when: "computed at discontinue time"
        difference: "scales provisional by actual elapsed course fraction (chronological); a prescription discontinued early yields a lower final_daily_med_mg than its provisional value, so provisional != final for identical dose inputs"

  - name: patient_daily_med_aggregate
    trigger: "any Prescription activate/discontinue/suspend; OpioidAgreement revoke cascade; inconsistent-UDS cascade"
    algorithm: aggregation
    formula: |
      Patient.current_daily_med_mg =
        round( sum( p.provisional_daily_med_mg
                    for p in patient.prescriptions
                    if p.status IN {ACTIVE, TAPERING} ), 2 )
      ControlledSubstanceLedger.total_active_med_mg = same sum (status IN {ACTIVE, TAPERING})
      ControlledSubstanceLedger.suspended_med_mg   = sum where status == SUSPENDED
      ControlledSubstanceLedger.discontinued_med_mg = sum where status == DISCONTINUED
    input_set: "patient's prescriptions filtered by status; SUSPENDED and DISCONTINUED excluded from active total"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: pill_count_expected_remaining
    trigger: "PillCountAudit creation (POST pill-count-audits)"
    algorithm: chronological
    formula: |
      per_day_consumption = ceil(units_per_day)   # whole pills consumed per day
      elapsed_days = max(0, floor((audit_utc - prescription.created_at) / 86400))
      capped_days = min(elapsed_days, day_supply)

      # FORWARD variant (round once at the end):
      expected_pills_forward = round(pills_dispensed - (units_per_day * capped_days), 2)

      # CHRONOLOGICAL variant (round per-day then sum — order matters):
      # consume ceil(units_per_day) whole pills each elapsed day, summed day by day
      expected_pills_chronological = pills_dispensed - sum_{d=1..capped_days} ceil(units_per_day)
                                   = pills_dispensed - (per_day_consumption * capped_days)

      discrepancy_pills = abs(expected_pills_chronological - counted_pills)
      result = CONSISTENT if discrepancy_pills <= clinic.pill_count_tolerance else INCONSISTENT
    input_set: "single Prescription + its PillCountAudit; capped at day_supply"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "chronological uses per-day ceil then sum; forward rounds once at end (2 dp). Pin: result uses the CHRONOLOGICAL value."
    variants:
      - name: forward_projection
        when: "audit reporting / expected_pills_forward field"
        difference: "multiplies fractional units_per_day by elapsed days then rounds once — no per-day whole-pill ceiling"
      - name: chronological_perday
        when: "compliance decision / expected_pills_chronological field and result"
        difference: "ceils units_per_day to whole pills per day then sums across days; for fractional units_per_day this exceeds the forward value, so the two variants differ"

  - name: suite_interval_overlap
    trigger: "Procedure schedule (REQUESTED -> SCHEDULED)"
    algorithm: interval_merge
    formula: |
      new_start = start_utc
      new_end   = start_utc + duration_minutes minutes
      buffered_end = new_end + suite.cleanup_buffer_minutes minutes
      For each existing SCHEDULED Procedure X in the same suite:
        x_start = X.start_utc
        x_buffered_end = X.start_utc + X.duration_minutes + suite.cleanup_buffer_minutes
        # half-open buffered intervals [start, buffered_end):
        conflict if (new_start < x_buffered_end) AND (x_start < buffered_end)
      Reject with ERR_SUITE_TIME_CONFLICT on any conflict.
    input_set: "suite's SCHEDULED procedures; half-open buffered intervals"
    constants: {}
    precision: "minute granularity; intervals half-open [start, buffered_end)"

  - name: agreement_expiry
    trigger: "OpioidAgreement counter-sign sets expires_utc; evaluated at prescription activate"
    algorithm: threshold
    formula: |
      expires_utc = signed_utc + AGREEMENT_VALIDITY_DAYS days
      unexpired  <=> clinic.current_utc < expires_utc   (strict <; at exactly expires_utc the agreement is EXPIRED)
    input_set: "single OpioidAgreement"
    constants:
      AGREEMENT_VALIDITY_DAYS: 365
    precision: "second granularity; boundary is strict <"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path resource IDs exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Referenced FK bodies (suite_id, prior_auth_id, prescriber_id, prescription_id, treatment_plan_id) exist and belong to the same clinic"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST procedures, POST prescriptions, POST pill-count-audits"

  - priority: 5
    category: state
    check: "OCC: expected_clinic_version (when required) equals Clinic.version"
    error_id: ERR_STALE_CLINIC_VERSION
    http_status: 412
    applies_to: "POST procedures/{id}/schedule"
    note: "Checked before business logic on the schedule endpoint"

  - priority: 6
    category: state
    check: "Target resource in a state permitting the requested transition"
    error_id: "ERR_{RESOURCE}_STATE_INVALID"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Referenced PriorAuthorization is APPROVED and its target_kind matches the operation (PROCEDURE for schedule, PRESCRIPTION for activate)"
    error_id: ERR_PRIOR_AUTH_NOT_APPROVED
    http_status: 409
    applies_to: "POST procedures/{id}/schedule, POST prescriptions/{id}/activate"

  - priority: 8
    category: business_referential
    check: "Referenced TreatmentPlan is on the PROCEDURE_PATH for a procedure schedule"
    error_id: ERR_PLAN_NOT_ON_PROCEDURE_PATH
    http_status: 409
    applies_to: "POST procedures/{id}/schedule"

  - priority: 9
    category: business_safety
    check: "For a controlled prescription with provisional_daily_med_mg >= clinic.med_review_threshold_mg: an ACTIVE unexpired OpioidAgreement exists for the patient"
    error_id: ERR_OPIOID_AGREEMENT_REQUIRED
    http_status: 403
    applies_to: "POST prescriptions/{id}/activate"

  - priority: 10
    category: business_safety
    check: "For a controlled prescription at/above threshold: a fresh PdmpCheck exists for the patient (current_utc < queried_utc + PDMP_FRESHNESS_DAYS)"
    error_id: ERR_PDMP_CHECK_REQUIRED
    http_status: 403
    applies_to: "POST prescriptions/{id}/activate"

  - priority: 11
    category: business_safety
    check: "Patient.compliance_flag != FLAGGED when activating an opioid prescription (a FLAGGED patient must be CLEARED first)"
    error_id: ERR_PATIENT_FLAGGED
    http_status: 403
    applies_to: "POST prescriptions/{id}/activate"

  - priority: 12
    category: business_temporal
    check: "Suite has no SCHEDULED procedure whose buffered half-open interval overlaps the requested one"
    error_id: ERR_SUITE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST procedures/{id}/schedule"

  - priority: 13
    category: business_constraint
    check: "taper_step_pct is present and 0 < taper_step_pct <= 100 when starting a taper"
    error_id: ERR_TAPER_STEP_INVALID
    http_status: 422
    applies_to: "POST prescriptions/{id}/start-taper"

  - priority: 14
    category: business_referential
    check: "Discharge blocked while any Prescription for the patient is ACTIVE or SUSPENDED"
    error_id: ERR_ACTIVE_PRESCRIPTIONS_EXIST
    http_status: 409
    applies_to: "POST patients/{id}/discharge"

  - priority: 15
    category: business_fiscal
    check: "PriorAuthorization.authorized_units must be >= the requested units (day_supply for prescriptions, 1 for procedures)"
    error_id: ERR_AUTHORIZED_UNITS_EXCEEDED
    http_status: 402
    applies_to: "POST prescriptions/{id}/activate, POST procedures/{id}/schedule"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clinic ---
  - method: POST
    path: "/clinics"
    description: "Create a clinic (compliance policy holder)"
    roles: [ClinicAdmin]
    code: 201
    input: [name, state_code, "med_review_threshold_mg?", "pill_count_tolerance?"]
    output: Clinic
    side_effects: ["current_utc defaults to 2026-05-01T00:00:00Z"]

  - method: GET
    path: "/clinics/{clinicId}"
    description: "Get a clinic"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock for a clinic (test-driving). Server startup default is 2026-05-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock."
    roles: [ClinicAdmin]
    code: 200
    input: [clinic_id, to_iso8601]
    output: Clinic
    side_effects: ["Clinic.current_utc = to_iso8601"]

  # --- Providers ---
  - method: POST
    path: "/clinics/{clinicId}/providers"
    description: "Create a provider (prescriber or compliance officer)"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, dea_number, role_kind]
    output: Provider
    side_effects: []

  - method: GET
    path: "/clinics/{clinicId}/providers"
    description: "List providers for a clinic (filterable)"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["clinic_id?"]
    output: "Provider[]"
    side_effects: []

  # --- Patients (referral & intake) ---
  - method: POST
    path: "/clinics/{clinicId}/patients"
    description: "Register a referral (patient in REFERRED state)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, referral_source]
    output: Patient
    side_effects: ["status = REFERRED", "compliance_flag = NONE", "current_daily_med_mg = 0", "a ControlledSubstanceLedger row is created for the patient"]

  - method: GET
    path: "/clinics/{clinicId}/patients"
    description: "List patients for a clinic (filterable)"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["clinic_id?", "status?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}"
    description: "Get a patient"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/schedule-intake"
    description: "Schedule intake appointment"
    roles: [IntakeCoordinator]
    code: 200
    input: [intake_utc]
    output: Patient
    side_effects: ["status -> INTAKE_SCHEDULED", "intake_utc set"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/complete-intake"
    description: "Complete intake"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: ["status -> INTAKE_COMPLETE"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/activate"
    description: "Activate patient into care"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/discharge"
    description: "Discharge a patient (taper & discharge)"
    roles: [Prescriber]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "status -> DISCHARGED"
      - "CASCADE: REQUESTED/SCHEDULED procedures -> CANCELLED (SCHEDULED ones debit suite booked_minutes)"
      - "CASCADE: non-terminal treatment plans -> CANCELLED"

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/clear-flag"
    description: "Compliance officer clears a FLAGGED patient (segregation of duties: cannot be the prescriber who wrote the suspended Rx)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: ["compliance_flag = CLEARED"]

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/controlled-substance-ledger"
    description: "Read the patient's controlled-substance MED ledger (reverse-reachability for ControlledSubstanceLedger)"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: []
    output: "ControlledSubstanceLedger[]"
    side_effects: []

  # --- Opioid agreements ---
  - method: POST
    path: "/clinics/{clinicId}/opioid-agreements"
    description: "Draft an opioid treatment agreement for a patient"
    roles: [Prescriber]
    code: 201
    input: [patient_id, prescriber_id]
    output: OpioidAgreement
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/clinics/{clinicId}/opioid-agreements"
    description: "List opioid agreements (filterable by patient)"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?"]
    output: "OpioidAgreement[]"
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/opioid-agreements/{agreementId}/counter-sign"
    description: "Prescriber counter-signs the agreement (DRAFT -> ACTIVE)"
    roles: [Prescriber]
    code: 200
    input: []
    output: OpioidAgreement
    side_effects: ["status -> ACTIVE", "signed_utc = current_utc", "expires_utc = signed_utc + 365 days"]

  - method: POST
    path: "/clinics/{clinicId}/opioid-agreements/{agreementId}/revoke"
    description: "Compliance officer revokes an ACTIVE agreement (cascades to suspend opioid Rx)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OpioidAgreement
    side_effects:
      - "status -> REVOKED"
      - "CASCADE: ACTIVE/TAPERING opioid prescriptions -> SUSPENDED; ledger moves MED active->suspended; patient MED recomputed"

  # --- PDMP checks ---
  - method: POST
    path: "/clinics/{clinicId}/pdmp-checks"
    description: "Record a PDMP database query for a patient"
    roles: [Prescriber]
    code: 201
    input: [patient_id, queried_by_provider_id, "outside_med_mg?", outcome]
    output: PdmpCheck
    side_effects: ["queried_utc = current_utc"]

  - method: GET
    path: "/clinics/{clinicId}/pdmp-checks"
    description: "List PDMP checks (filterable by patient)"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?"]
    output: "PdmpCheck[]"
    side_effects: []

  # --- Treatment plans ---
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/treatment-plans"
    description: "Create a treatment plan (INJECTION/RFA/MEDICATION)"
    roles: [Prescriber]
    code: 201
    input: [modality]
    output: TreatmentPlan
    side_effects: ["status = PROPOSED", "requires_procedure/requires_medication derived from modality"]

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/treatment-plans"
    description: "List a patient's treatment plans"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["patient_id?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/approve"
    description: "Approve a proposed plan (PROPOSED -> ACTIVE)"
    roles: [Prescriber]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/route"
    description: "Route an ACTIVE plan onto its branch (fork: PROCEDURE_PATH or MEDICATION_PATH by modality)"
    roles: [Prescriber]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status -> PROCEDURE_PATH or MEDICATION_PATH per modality"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/treatment-plans/{planId}/complete"
    description: "Complete a plan at the fork-join point"
    roles: [Prescriber]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status -> COMPLETED"]

  # --- Fluoroscopy suites ---
  - method: POST
    path: "/clinics/{clinicId}/fluoroscopy-suites"
    description: "Create a fluoroscopy suite"
    roles: [ClinicAdmin]
    code: 201
    input: [name, "cleanup_buffer_minutes?"]
    output: FluoroscopySuite
    side_effects: ["booked_minutes = 0"]

  - method: GET
    path: "/clinics/{clinicId}/fluoroscopy-suites"
    description: "List fluoroscopy suites (filterable)"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: ["clinic_id?"]
    output: "FluoroscopySuite[]"
    side_effects: []

  # --- Prior authorizations ---
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prior-authorizations"
    description: "Submit a prior authorization (polymorphic target: procedure or prescription)"
    roles: [PriorAuthClerk]
    code: 201
    input: [target_kind, payer, authorized_units]
    output: PriorAuthorization
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/prior-authorizations"
    description: "List a patient's prior authorizations"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: ["patient_id?"]
    output: "PriorAuthorization[]"
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prior-authorizations/{paId}/decide"
    description: "Approve or deny a submitted prior authorization"
    roles: [PriorAuthClerk]
    code: 200
    input: [decision]
    output: PriorAuthorization
    side_effects: ["status -> APPROVED or DENIED per decision"]

  # --- Procedures (fluoroscopy scheduling) ---
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/procedures"
    description: "Request a procedure against a plan/suite/prior-auth"
    roles: [IntakeCoordinator]
    code: 201
    input: [treatment_plan_id, suite_id, prior_auth_id, start_utc, duration_minutes]
    output: Procedure
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/procedures"
    description: "List a patient's procedures"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: ["patient_id?", "suite_id?"]
    output: "Procedure[]"
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/schedule"
    description: "Schedule a requested procedure into the fluoroscopy suite (OCC on clinic version)"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_clinic_version]
    output: Procedure
    side_effects: ["status -> SCHEDULED", "suite.booked_minutes += duration_minutes", "increments Clinic.version by 1"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/complete"
    description: "Complete a scheduled procedure"
    roles: [Prescriber]
    code: 200
    input: []
    output: Procedure
    side_effects: ["status -> COMPLETED", "suite.booked_minutes -= duration_minutes"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/procedures/{procedureId}/cancel"
    description: "Cancel a requested or scheduled procedure"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Procedure
    side_effects: ["status -> CANCELLED", "if was SCHEDULED: suite.booked_minutes -= duration_minutes"]

  # --- Prescriptions (medication / controlled substance) ---
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prescriptions"
    description: "Propose a controlled-substance prescription"
    roles: [Prescriber]
    code: 201
    input: [prescriber_id, "prior_auth_id?", drug_name, dose_mg, units_per_day, conversion_factor, day_supply, pills_dispensed, "taper_step_pct?"]
    output: Prescription
    side_effects: ["status = PROPOSED", "provisional_daily_med_mg computed"]

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/prescriptions"
    description: "List a patient's prescriptions"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["patient_id?"]
    output: "Prescription[]"
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/activate"
    description: "Activate a proposed prescription (enforces opioid agreement, PDMP, prior-auth, flag gates at/above MED threshold)"
    roles: [Prescriber]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status -> ACTIVE", "ledger total_active_med_mg += provisional_daily_med_mg", "patient current_daily_med_mg recomputed"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/start-taper"
    description: "Begin tapering an active prescription"
    roles: [Prescriber]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status -> TAPERING"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/re-escalate"
    description: "Return a tapering prescription to active (cyclic)"
    roles: [Prescriber]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/prescriptions/{rxId}/discontinue"
    description: "Discontinue a prescription (computes final MED, compensating ledger move)"
    roles: [Prescriber]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status -> DISCONTINUED", "final_daily_med_mg computed", "ledger MED moved to discontinued_med_mg", "patient current_daily_med_mg recomputed"]

  # --- Urine drug screens ---
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/urine-drug-screens"
    description: "Schedule a urine drug screen"
    roles: [ComplianceOfficer]
    code: 201
    input: [due_utc, expected_substances]
    output: UrineDrugScreen
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/urine-drug-screens"
    description: "List a patient's urine drug screens"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?"]
    output: "UrineDrugScreen[]"
    side_effects: []

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/collect"
    description: "Collect a scheduled screen"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: UrineDrugScreen
    side_effects: ["status -> COLLECTED", "collected_utc = current_utc"]

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/result"
    description: "Result a collected screen; inconsistent result cascades to flag + suspend"
    roles: [ComplianceOfficer]
    code: 200
    input: [detected_substances]
    output: UrineDrugScreen
    side_effects:
      - "status -> RESULTED_CONSISTENT or RESULTED_INCONSISTENT"
      - "if INCONSISTENT: CASCADE patient.compliance_flag=FLAGGED -> suspend ACTIVE/TAPERING opioid Rx -> ledger MED active->suspended -> patient MED recomputed"

  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/urine-drug-screens/{udsId}/recollect"
    description: "Recollect after an inconsistent result (cyclic, back to SCHEDULED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [due_utc]
    output: UrineDrugScreen
    side_effects: ["status -> SCHEDULED", "recollect_count += 1", "detected_substances reset"]

  # --- Pill-count / compliance audit ---
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/pill-count-audits"
    description: "Perform a pill-count compliance audit against a prescription"
    roles: [ComplianceOfficer]
    code: 201
    input: [prescription_id, audit_utc, counted_pills]
    output: PillCountAudit
    side_effects:
      - "expected_pills_forward, expected_pills_chronological, discrepancy_pills, result computed"
      - "if result == INCONSISTENT: CASCADE patient.compliance_flag=FLAGGED -> suspend ACTIVE/TAPERING opioid Rx -> ledger MED active->suspended -> patient MED recomputed"

  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}/pill-count-audits"
    description: "List a patient's pill-count audits"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?", "prescription_id?"]
    output: "PillCountAudit[]"
    side_effects: []

  # --- Flat cross-cutting discovery endpoints (FK reverse-reachability) ---
  # These flat collections give every foreign key a filtered-list discovery
  # channel and every FK-parent entity a single-resource GET, independent of
  # the nested action-endpoint tree above.
  - method: GET
    path: "/providers/{providerId}"
    description: "Get a provider by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers"
    description: "List providers, optionally filtered by clinic"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["clinic_id?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/patients/{patientId}"
    description: "Get a patient by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, optionally filtered by clinic or status"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["clinic_id?", "status?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/prescriptions/{prescriptionId}"
    description: "Get a prescription by id"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/prescriptions"
    description: "List prescriptions, filtered by patient, prescriber, or prior-auth"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["patient_id?", "prescriber_id?", "prior_auth_id?"]
    output: "Prescription[]"
    side_effects: []

  - method: GET
    path: "/prior-authorizations/{paId}"
    description: "Get a prior authorization by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []

  - method: GET
    path: "/prior-authorizations"
    description: "List prior authorizations, filtered by patient"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: ["patient_id?"]
    output: "PriorAuthorization[]"
    side_effects: []

  - method: GET
    path: "/opioid-agreements"
    description: "List opioid agreements, filtered by clinic, patient, or prescriber"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["clinic_id?", "patient_id?", "prescriber_id?"]
    output: "OpioidAgreement[]"
    side_effects: []

  - method: GET
    path: "/pdmp-checks"
    description: "List PDMP checks, filtered by clinic, patient, or querying provider"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["clinic_id?", "patient_id?", "queried_by_provider_id?"]
    output: "PdmpCheck[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans"
    description: "List treatment plans, filtered by patient"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: ["patient_id?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/fluoroscopy-suites"
    description: "List fluoroscopy suites, filtered by clinic"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: ["clinic_id?"]
    output: "FluoroscopySuite[]"
    side_effects: []

  - method: GET
    path: "/procedures"
    description: "List procedures, filtered by patient, suite, plan, or prior-auth"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: ["patient_id?", "suite_id?", "treatment_plan_id?", "prior_auth_id?"]
    output: "Procedure[]"
    side_effects: []

  - method: GET
    path: "/urine-drug-screens"
    description: "List urine drug screens, filtered by patient"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?"]
    output: "UrineDrugScreen[]"
    side_effects: []

  - method: GET
    path: "/pill-count-audits"
    description: "List pill-count audits, filtered by patient or prescription"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?", "prescription_id?"]
    output: "PillCountAudit[]"
    side_effects: []

  - method: GET
    path: "/controlled-substance-ledger"
    description: "List controlled-substance ledgers, filtered by patient"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: ["patient_id?"]
    output: "ControlledSubstanceLedger[]"
    side_effects: []

  # --- Flat single-resource GETs (needed so every child entity's collection
  #     segment is derivable, completing FK reverse-reachability) ---
  - method: GET
    path: "/opioid-agreements/{agreementId}"
    description: "Get an opioid agreement by id"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: []
    output: OpioidAgreement
    side_effects: []

  - method: GET
    path: "/pdmp-checks/{pdmpCheckId}"
    description: "Get a PDMP check by id"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: []
    output: PdmpCheck
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}"
    description: "Get a treatment plan by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer, PriorAuthClerk]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: GET
    path: "/fluoroscopy-suites/{suiteId}"
    description: "Get a fluoroscopy suite by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: []
    output: FluoroscopySuite
    side_effects: []

  - method: GET
    path: "/procedures/{procedureId}"
    description: "Get a procedure by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, PriorAuthClerk]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  - method: GET
    path: "/urine-drug-screens/{udsId}"
    description: "Get a urine drug screen by id"
    roles: [ClinicAdmin, IntakeCoordinator, Prescriber, ComplianceOfficer]
    code: 200
    input: []
    output: UrineDrugScreen
    side_effects: []

  - method: GET
    path: "/pill-count-audits/{auditId}"
    description: "Get a pill-count audit by id"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: []
    output: PillCountAudit
    side_effects: []

  - method: GET
    path: "/controlled-substance-ledger/{ledgerId}"
    description: "Get a controlled-substance ledger by id"
    roles: [ClinicAdmin, Prescriber, ComplianceOfficer]
    code: 200
    input: []
    output: ControlledSubstanceLedger
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or invalid"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this operation"

  # --- Input ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or type mismatch"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "Enum field (modality, role_kind, outcome, target_kind, decision) has an invalid value"

  # --- Not found ---
  - id: ERR_CLINIC_NOT_FOUND
    http: 404
    condition: "Clinic id not found"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Provider id not found or not in this clinic"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "Patient id not found"
  - id: ERR_TREATMENT_PLAN_NOT_FOUND
    http: 404
    condition: "Treatment plan id not found"
  - id: ERR_SUITE_NOT_FOUND
    http: 404
    condition: "Fluoroscopy suite id not found"
  - id: ERR_PROCEDURE_NOT_FOUND
    http: 404
    condition: "Procedure id not found"
  - id: ERR_PRIOR_AUTH_NOT_FOUND
    http: 404
    condition: "Prior authorization id not found"
  - id: ERR_PRESCRIPTION_NOT_FOUND
    http: 404
    condition: "Prescription id not found"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "Opioid agreement id not found"
  - id: ERR_UDS_NOT_FOUND
    http: 404
    condition: "Urine drug screen id not found"

  # --- OCC ---
  - id: ERR_STALE_CLINIC_VERSION
    http: 412
    condition: "expected_clinic_version does not match current Clinic.version on procedure schedule"

  # --- State ---
  - id: ERR_PATIENT_STATE_INVALID
    http: 409
    condition: "Patient not in the required state for this transition"
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "Opioid agreement not in the required state"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "Treatment plan not in the required state"
  - id: ERR_PA_STATE_INVALID
    http: 409
    condition: "Prior authorization not in SUBMITTED state to decide"
  - id: ERR_PROCEDURE_STATE_INVALID
    http: 409
    condition: "Procedure not in the required state for this transition"
  - id: ERR_RX_STATE_INVALID
    http: 409
    condition: "Prescription not in the required state for this transition"
  - id: ERR_UDS_STATE_INVALID
    http: 409
    condition: "Urine drug screen not in the required state for this transition"

  # --- Temporal ---
  - id: ERR_INTAKE_IN_PAST
    http: 422
    condition: "Scheduled intake_utc is before clinic.current_utc"
  - id: ERR_INTAKE_NOT_DUE
    http: 409
    condition: "complete-intake before clinic.current_utc reaches intake_utc"
  - id: ERR_UDS_NOT_DUE
    http: 409
    condition: "collect before clinic.current_utc reaches due_utc"
  - id: ERR_PROCEDURE_NOT_STARTED
    http: 409
    condition: "complete before clinic.current_utc reaches procedure start_utc"
  - id: ERR_SUITE_TIME_CONFLICT
    http: 409
    condition: "Requested procedure buffered interval overlaps a SCHEDULED procedure in the same suite"

  # --- Business referential / safety / constraint / fiscal ---
  - id: ERR_NO_ACTIVE_PLAN
    http: 409
    condition: "Patient activation requires at least one active/routed treatment plan"
  - id: ERR_PLAN_MODALITY_MISMATCH
    http: 409
    condition: "route requested onto a branch inconsistent with the plan modality"
  - id: ERR_PLAN_NOT_ON_PROCEDURE_PATH
    http: 409
    condition: "Referenced plan is not on PROCEDURE_PATH when scheduling a procedure"
  - id: ERR_PRIOR_AUTH_NOT_APPROVED
    http: 409
    condition: "Referenced prior authorization is not APPROVED or its target_kind does not match the operation"
  - id: ERR_OPEN_PROCEDURES_EXIST
    http: 409
    condition: "Plan completion blocked by non-terminal procedures"
  - id: ERR_OPEN_PRESCRIPTIONS_EXIST
    http: 409
    condition: "Plan completion blocked by non-discontinued prescriptions"
  - id: ERR_NOT_AGREEMENT_PRESCRIBER
    http: 403
    condition: "Counter-signing provider is not the agreement's prescriber"
  - id: ERR_OPIOID_AGREEMENT_REQUIRED
    http: 403
    condition: "Controlled prescription at/above MED threshold lacks an ACTIVE unexpired opioid agreement"
  - id: ERR_PDMP_CHECK_REQUIRED
    http: 403
    condition: "Controlled prescription at/above MED threshold lacks a fresh PDMP check"
  - id: ERR_PATIENT_FLAGGED
    http: 403
    condition: "Activating opioid prescription while patient compliance_flag is FLAGGED"
  - id: ERR_TAPER_STEP_INVALID
    http: 422
    condition: "taper_step_pct missing or outside (0,100] when starting a taper"
  - id: ERR_ACTIVE_PRESCRIPTIONS_EXIST
    http: 409
    condition: "Discharge blocked while patient has ACTIVE or SUSPENDED prescriptions"
  - id: ERR_AUTHORIZED_UNITS_EXCEEDED
    http: 402
    condition: "Prior authorization authorized_units insufficient for the requested units"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Sets up clinics, providers, suites, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /clinics"
      - "POST /_clock/set_current_utc"
      - "POST /clinics/{id}/providers"
      - "POST /clinics/{id}/fluoroscopy-suites"
    shared_operations:
      - "GET (read) endpoints"

  - name: IntakeCoordinator
    description: "Manages referral, intake scheduling, patient activation, and procedure scheduling logistics"
    identity: "opaque"
    exclusive_operations:
      - "POST /clinics/{id}/patients"
      - "POST .../schedule-intake"
      - "POST .../complete-intake"
      - "POST .../activate (patient)"
      - "POST .../procedures (request)"
      - "POST .../procedures/{id}/schedule"
      - "POST .../procedures/{id}/cancel"
      - "POST .../urine-drug-screens/{id}/collect"
    shared_operations:
      - "GET (read) endpoints"

  - name: Prescriber
    description: "Physician who writes plans, prescriptions, agreements, PDMP checks, and discharges. Entity-backed: acts as a Provider with role_kind PRESCRIBER"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST .../treatment-plans (+ approve/route/complete)"
      - "POST .../prescriptions (+ activate/start-taper/re-escalate/discontinue)"
      - "POST /clinics/{id}/opioid-agreements (+ counter-sign)"
      - "POST /clinics/{id}/pdmp-checks"
      - "POST .../patients/{id}/discharge"
      - "POST .../procedures/{id}/complete"
    shared_operations:
      - "GET (read) endpoints"

  - name: ComplianceOfficer
    description: "Oversees UDS results, pill-count audits, flag clearing, and agreement revocation. Segregation of duties: distinct Provider (role_kind COMPLIANCE_OFFICER) from the Prescriber"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST .../urine-drug-screens (+ result/recollect)"
      - "POST .../pill-count-audits"
      - "POST .../patients/{id}/clear-flag"
      - "POST /clinics/{id}/opioid-agreements/{id}/revoke"
    shared_operations:
      - "GET (read) endpoints"

  - name: PriorAuthClerk
    description: "Submits and decides prior authorizations"
    identity: "opaque"
    exclusive_operations:
      - "POST .../prior-authorizations (+ decide)"
    shared_operations:
      - "GET (read) endpoints"
