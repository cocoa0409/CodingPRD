              as_user_id: "${org_id}"
          assert:
            - "The first placement returned 201 with ${d1_id} and advanced the deal version, so ${deal_v3} is strictly greater than ${deal_v2}"
            - "The second placement, identical except for replaying ${deal_v2}, returned 412 ERR_DEAL_VERSION_STALE — the placement itself was legitimate (quota 3, no exclusivity conflict, deal ACTIVE)"
            - "Resending the same body with the freshly read ${deal_v3} returned 201 with ${d2_id}"
            - "GET /sponsorship-deals/${deal_id}/deliverables returns total_count == 2 and SponsorshipDeal.${deal_id}.assigned_count == 2 — the 412 created nothing"
            - "${org_v_after_patch} is strictly greater than ${org_v_stale}: every successful write advances the parent version"
            - "POST /roster-moves replaying ${org_v_stale} returned 412 ERR_ORGANIZATION_VERSION_STALE, and the intervening PATCH touched nothing the move depends on"
            - "GET /roster-moves after the 412 returns total_count == 0"
            - "POST /roster-moves with ${org_v_after_patch} returned 201 with ${m1_id} in move_status PENDING, and the following GET /roster-moves returns total_count == 1"

      - name: cascading_side_effects_reach_every_declared_link_in_order
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines[PlayerContract].transitions
          - state_machines[RosterMove].transitions
        excluded_because:
          difficulty_instance: cascading_state_transition / release_execution_terminates_contract_voids_deliverable_and_reverts_fulfilled_deal
          rationale: "That §1.8 instance walks the four-link chain of a RELEASE execution end to end — contract TERMINATED, future blocks CANCELLED, deliverable VOIDED and the FULFILLED deal reverted to ACTIVE — and its sibling block_completion_escalates_obligation_and_cancels_future_sibling_block covers the ordering-sensitive cascade."

      - name: both_calculation_variants_are_produced_and_reconciled_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.salary_cap_charge.variants
          - calculations.burnout_score.variants
        excluded_because:
          difficulty_instance: dual_variant_divergence / salary_cap_charge_prorated_vs_full_season_on_organization_budget
          rationale: "That §1.8 instance asserts the prorated 12328767 against the full-season 12500000 on the same contract and the ledger delta when league approval switches variant; burnout_score_rolling_7day_vs_season_cumulative_on_player_wellness does the same for the two burnout windows."

      - name: cumulative_and_instantaneous_thresholds_are_tested_at_their_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.burnout_score.constants
          - calculations.weekly_hour_cap
        excluded_because:
          difficulty_instance: threshold_boundary / burnout_score_69_stays_compliant_and_70_escalates_to_warned
          rationale: "That §1.8 instance sits on the BURNOUT_WARN_THRESHOLD boundary and its sibling weekly_committed_minutes_exactly_at_cap_is_admitted_one_minute_over_is_not covers the inclusive weekly-cap comparison, including the WELLNESS_HOLD_DAYS reset."

