      - name: absorption_indexed_publication_without_a_baseline_or_a_review_is_rejected
        claim_type: error_triggerable
        grounds:
          - calculations.rent_growth_repricing
          - errors.ERR_RENT_SCHEDULE_NOT_FOUND
          - errors.ERR_ABSORPTION_REVIEW_NOT_FOUND
        distinguishing_aspect: |
          An indexed publication needs two antecedents and fails with a different 404 for each, in the
          order the formula reads them: the baseline schedule first, then the absorption review. Once both
          exist the same request succeeds and applies the review's negative recommendation, so a repricing
          can move rent *down*.
        test_recipe:
          setup:
            - "Community 'Glenshire' with plat APPROVED and no schedules and no absorption reviews at all."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Glenshire", market_code: "OR-EUG", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 25000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
