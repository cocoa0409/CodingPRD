      - name: repair_retry_loop_condemns_job_at_attempt_cap
        grounds:
          - "1.2 ReverseLogisticsJob transitions PROCESSING to PROCESSING and PROCESSING to CONDEMNED_HOLD on repair-completion FAILED"
          - "1.2 RentalUnit condition transition NEEDS_REPAIR to CONDEMNED"
          - "1.3 calculation servicing_cost_rollup with REPAIR_COST_CENTS and REPAIR_ATTEMPT_CAP 2"
          - "1.5 POST /reverse-logistics-jobs/{job_id}/repair-completion and POST /reservations"
          - "1.4 validation priority 21 ERR_UNIT_CONDEMNED on a named preferred_unit_id"
        distinguishing_aspect: >-
          The job self-loops on PROCESSING for the first FAILED repair and only leaves the loop on the attempt that
          reaches REPAIR_ATTEMPT_CAP, where the same call with the same payload produces a different target state
          (CONDEMNED_HOLD) and drags the unit's condition dimension to CONDEMNED. The non-linearity is visible in
          three places at once: repair_attempts 1 then 2, job state PROCESSING then CONDEMNED_HOLD, and
          servicing_cost_cents 9800 then 19600 because the repair cost multiplies by the attempt count. Once
          condemned, the unit is refused as a preferred unit with ERR_UNIT_CONDEMNED rather than with the generic
          allocation error.
