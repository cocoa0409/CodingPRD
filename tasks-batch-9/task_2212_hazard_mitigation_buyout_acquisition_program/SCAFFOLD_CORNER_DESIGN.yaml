  - section: cross_cutting_complexity_layers
    instances:

      - name: a_parcel_version_captured_before_a_deduction_record_no_longer_authorises_the_offer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.offer-create-stale-parcel
          - endpoints.POST_parcels_parcel_id_purchase_offers
          - entities.Parcel.common_fields
        distinguishing_aspect: |
          The offer writer must present the parcel version it believes it read. A duplication-of-benefits
          record posted after that read bumps Parcel.version, so the same request body that would have
          been valid a moment earlier returns 412 ERR_STALE_PARCEL_VERSION and creates nothing; re-reading
          the parcel and resubmitting the identical body succeeds, and the offer that is finally created
          carries the deduction the writer had not seen.
        test_recipe:
          setup:
            - "The golden path through an ACCEPTED REVIEW appraisal (PRE_EVENT, 20000000) on a VOLUNTARY_CONFIRMED parcel with no offer and no DOB records."
          setup_api_calls:
