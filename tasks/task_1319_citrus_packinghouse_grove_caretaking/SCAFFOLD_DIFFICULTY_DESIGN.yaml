            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${qc_g1}", assignment_id: "${qc_a2}", gross_boxes: 50, tare_boxes: 0 }, as: FieldSupervisor, captures: { qc_d: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/quarantine-orders", payload: { scope_type: GROVE, grove_id: "${qc_g1}", pest_type: CANKER }, as: ComplianceOfficer, as_user_id: "co_qc_a", captures: { qc_q: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${qc_c}", grove_id: "${qc_g2}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T18:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { qc_a3: "$.data.id" } }
          assert:
            - "QuarantineOrder.${qc_q}.status == ACTIVE and Grove.${qc_g1}.quarantine_posture == QUARANTINED (link A->B)"
            - "HarvestAssignment.${qc_a1}.status == CANCELLED without any client call on it (link B->C)"
            - "Delivery.${qc_d}.regulatory_status == HELD (fan-out to the grove's CLEAR deliveries)"
            - "HarvestAssignment.${qc_a3} created (201) on the SAME crew with a window IDENTICAL to the cancelled A1: the cancellation released the crew's committed capacity (link C->D)"
            - "Grove.${qc_g2}.quarantine_posture == CLEAR (unaffected grove untouched by the cascade)"

      - name: sort_run_reversal_reconciles_pool
        grounds:
          - state_machines.SortRun.POSTED_to_VOIDED
          - state_machines.Delivery.processing_status
          - calculations.pool_provisional_price
        distinguishing_aspect: |
          Depth-2 chain from the REVERSE trigger (distinct from quarantine
          creation): reversing a POSTED sort run (A) reverts the delivery to
          READY_TO_SORT (B) and the reversal itself recomputes pool aggregates
          and the provisional price (C) — each hop caused by the previous one.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove, CURRENT PASS maturity, pool OPEN wk 2026-07-27"
            - "Channels JP 25@900 [FANCY] rank1, DOM 40@500 rank2, JUICE @220 rank9; delivery 100 net; sort 40F/30C/20S/8J/2Cu POSTED"
            - "Pool after post: posted_ge_boxes 96.8, posted_proceeds_cents 49760, sorted_field_boxes 100, provisional 514; JP remaining 0, DOM remaining 0"
