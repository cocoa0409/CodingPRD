scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: eligibility_score_screening_and_attested_diverge_on_window_penalty
    grounds:
    - calculations.eligibility_score (variants SCREENING and ATTESTED)
    - entities.ThrombolyticChecklist.fields.screening_eligibility_score
    - entities.ThrombolyticChecklist.fields.attested_eligibility_score
    - calculations.thrombolytic_window_classification
    - 'state_machines.ThrombolyticChecklist: documentation_status=IN_PROGRESS -> documentation_status=DOCUMENTED, determination_status=INELIGIBLE'
    - endpoints.POST /stroke-network/checklists/{id}/determine
    distinguishing_aspect: The dual variant under test lives in the CLINICAL DOCUMENTATION entity domain — two score columns on one ThrombolyticChecklist row. SCREENING omits window_penalty and board_credit because neither is knowable at the bedside; ATTESTED applies both. The same four confirmed inclusion items and zero contraindications therefore leave screening_eligibility_score 60.00 and attested_eligibility_score 52.00 stored side by side, and the 8.00 delta (WINDOW_PENALTY_BY_CLASS[WITHIN_4_5H] with a non-board-certified attester) is the entire clinical decision.
    test_recipe:
      setup:
      - Logical clock walked from 2026-09-01T08:00:00Z.
      - A HUB_PRIMARY centre, a SPOKE centre (both state_code CA) and a TIER_2_CONSULT_ONLY SpokeAgreement between them, ACTIVE, effective 2026-08-01T00:00:00Z .. 2027-08-01T00:00:00Z.
      - One Neurologist with board_certified == false, roster_rank 10, concurrent_consult_limit 2, licensed in CA, ON_CALL, holding a GRANTED CONSULT_AND_THROMBOLYSIS proxy credential on that agreement (TIER_2_CONSULT_ONLY waives routing clause 7, so a non-board-certified neurologist is routable).
      - A CodeStrokeCase at the spoke with door_at 2026-09-01T08:00:00Z, lkw_precision EXACT and last_known_well_at 2026-09-01T04:30:00Z, imaging complete, and a TelestrokeConsult accepted, video-recorded and COMPLETED by that neurologist.
      - A ThrombolyticChecklist on that case with all four REQUIRED_INCLUSION_ITEM_CODES confirmed and no contraindications, so documentation_status is IN_PROGRESS, determination_status is PENDING and screening_eligibility_score is already 60.00 (15.0 * 4).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_2_CONSULT_ONLY
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Owen Bracknell
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: false
          roster_rank: 10
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n2_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n2_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n2_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${spoke_id}
          patient_ref: P-DV-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T04:30:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          dv_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:10:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes/${dv_id}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:15:00Z'
        as: ProgramCoordinator
      - call: GET /stroke-network/code-strokes/${dv_id}
        as: EdPhysician
        captures:
          dv_v: $.data.version
      - call: POST /stroke-network/consults
        payload:
          case_id: ${dv_id}
          agreement_id: ${agr_id}
          requested_privilege_scope: CONSULT_AND_THROMBOLYSIS
          expected_case_version: ${dv_v}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          dv_k: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:18:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/consults/${dv_k}/accept
        payload: {}
        as: Neurologist
        as_user_id: ${n2_id}
      - call: POST /stroke-network/consults/${dv_k}/video-sessions
        payload:
          started_at: '2026-09-01T08:18:00Z'
          ended_at: '2026-09-01T08:22:00Z'
          video_quality: HD
          disconnect_count: 0
        as: Neurologist
        as_user_id: ${n2_id}
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:22:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/consults/${dv_k}/complete
        payload:
          recommendation: THROMBOLYSIS
          nihss_score: 12
        as: Neurologist
        as_user_id: ${n2_id}
      - call: POST /stroke-network/checklists
        payload:
          case_id: ${dv_id}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          dv_ck: $.data.id
      - call: POST /stroke-network/checklists/${dv_ck}/inclusion-items
        payload:
          item_code: INC_ONSET_CONFIRMED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${dv_ck}/inclusion-items
        payload:
          item_code: INC_NIHSS_RECORDED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${dv_ck}/inclusion-items
        payload:
          item_code: INC_BP_CONTROLLED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${dv_ck}/inclusion-items
        payload:
          item_code: INC_ANTICOAG_REVIEWED
        as: EdPhysician
        as_user_id: ed_ann
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:30:00Z'
        as: ProgramCoordinator
      - call: GET /stroke-network/checklists/${dv_ck}
        as: EdPhysician
        captures:
          scr_before: $.data.screening_eligibility_score
          att_before: $.data.attested_eligibility_score
      - call: POST /stroke-network/checklists/${dv_ck}/determine
        payload: {}
        as: Neurologist
        as_user_id: ${n2_id}
      assert:
      - ${scr_before} == 60.00 and ${att_before} == null before the determination
      - ThrombolyticChecklist.${dv_ck}.screening_eligibility_score == 60.00 after the determination — the SCREENING variant is never recomputed retroactively
      - ThrombolyticChecklist.${dv_ck}.attested_eligibility_score == 52.00
      - ThrombolyticChecklist.${dv_ck}.screening_eligibility_score - ThrombolyticChecklist.${dv_ck}.attested_eligibility_score == 8.00, i.e. WINDOW_PENALTY_BY_CLASS[WITHIN_4_5H] (8.0) minus BOARD_CERTIFIED_CREDIT (0.0 for a non-board-certified attester)
      - CodeStrokeCase.${dv_id}.thrombolytic_window_class == WITHIN_4_5H (240 minutes elapsed from last_known_well_at 04:30:00Z to the determination instant 08:30:00Z, inside 181..270)
      - ThrombolyticChecklist.${dv_ck}.determination_status == INELIGIBLE (52.00 < ELIGIBLE_SCORE_MIN 55.0 with relative_contraindication_count 0)
      - ThrombolyticChecklist.${dv_ck}.documentation_status == DOCUMENTED
      - ThrombolyticChecklist.${dv_ck}.determined_at == 2026-09-01T08:30:00Z
      - CodeStrokeCase.${dv_id}.status == ELIGIBILITY_DETERMINED and disposition == NO_TREATMENT
      - a run that reused the SCREENING variant for the attestation would store 60.00 and return ELIGIBLE — the variant selection is observable in determination_status alone
  - name: measure_compliance_rate_provisional_and_certified_diverge_on_draft_pool
    grounds:
    - calculations.measure_compliance_rate (variants PROVISIONAL and CERTIFIED)
    - calculations.abstraction_numerator_denominator (variants PROVISIONAL and CERTIFIED)
    - entities.CertificationReport.fields.dtn_60_compliance_pct
    - entities.CertificationReport.fields.rate_variant
    - entities.CertificationReport.fields.included_abstraction_count
    - 'state_machines.CertificationReport: DRAFT -> SUBMITTED'
    - endpoints.POST /stroke-network/certification-reports/{id}/submit
    distinguishing_aspect: 'The dual variant under test lives in the REGULATORY REPORTING entity domain — a rate aggregated across QualityMeasureAbstraction rows onto a CertificationReport — not in per-row checklist scoring. Divergence is driven by the STATUS POOL, not by extra terms: PROVISIONAL pools status IN {DRAFT, FINALIZED} (and every DRAFT row carries denominator_included true), CERTIFIED pools status == FINALIZED only. The identical underlying two cases therefore read 50.00 while the report is DRAFT and 100.00 the instant it is submitted, with included_abstraction_count falling from 2 to 1.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; a HUB_PRIMARY centre, a SPOKE centre, a THROMBECTOMY_CAPABLE centre and an ACTIVE TIER_1_FULL agreement hub -> spoke.
      - One board-certified Neurologist, ON_CALL, with a GRANTED CONSULT_AND_THROMBOLYSIS proxy credential.
      - 'Case A at the spoke: door_at 08:00:00Z, imaging 08:20:00Z, consult accepted and COMPLETED, checklist ELIGIBLE, thrombolytic at 08:50:00Z so door_to_needle_minutes == 50; then CLOSED with disposition TREATED_LOCAL.'
      - 'Case B at the spoke: door_at 09:10:00Z, imaging 09:30:00Z, consult accepted and COMPLETED, checklist ELIGIBLE, NO thrombolytic; a TRANSFER_ONLY TransferDecision to the thrombectomy centre is accepted and handed off, so the case is CLOSED with disposition TRANSFER_ONLY and door_to_needle_minutes stays null.'
      - One STK_DTN_60 abstraction per case, each created while its case was still open. The case-A row is FINALIZED (numerator_flag true, exclusion_reason NONE, denominator_included true, variant CERTIFIED); the case-B row is deliberately LEFT DRAFT (numerator_flag false, exclusion_reason TRANSFER_ONLY, denominator_included true, variant PROVISIONAL).
      - A DRAFT CertificationReport for the spoke covering [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) with both abstractions attached.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
