              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-LATAM", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["LATAM"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: FuelAnalyst
          assert:
            - "Trigger call 1: HTTP 422 and data.error_id == \"ERR_NO_FORECAST_BASIS\"."
            - "Trigger call 2: data.status == \"DRAFT\", data.version == 1, data.consumption_basis_gallons == 0."

      - name: coverage_two_variants_on_one_program
        claim_type: variant_divergence
        grounds:
          - calculations.hedge_coverage_ratio
        excluded_because:
          difficulty_instance: dual_variant_calc / coverage_notional_basis_vs_delta_adjusted_basis
          rationale: "The named §1.8 instance asserts 45.45 against 39.09 on the same two trades, which is exactly this claim."

      - name: tankering_planned_versus_reconciled_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.tankering_net_savings_usd
        excluded_because:
          difficulty_instance: dual_variant_calc / tankering_planned_basis_vs_reconciled_basis
          rationale: "The named §1.8 instance drives creation then reconciliation and asserts the pinned-price divergence plus savings_variance_usd."

      - name: mtm_totals_rounding_order_precision
        claim_type: precision
        grounds:
          - calculations.mtm_report_totals
        excluded_because:
          difficulty_instance: combinatorial_formula / mtm_totals_round_per_instrument_then_sum
          rationale: "The named §1.8 instance pins the one-cent divergence between round-then-sum and sum-then-round on a three-trade portfolio."

      - name: effectiveness_lower_bound_boundary
        claim_type: correct_result
        grounds:
          - calculations.effectiveness_ratio
        excluded_because:
          difficulty_instance: boundary_precision_check / effectiveness_lower_bound_inclusive_after_rounding
          rationale: "The named §1.8 instance asserts 0.79995 -> 0.8000 PASS against 0.79994 -> 0.7999 FAIL."

  # ===========================================================================
  - section: validations
    instances:

      - name: activate_below_min_coverage_pct_returns_422_coverage_floor
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_COVERAGE_FLOOR_NOT_MET]
          - entities.HedgePolicy.fields.min_coverage_pct
          - entities.HedgeProgram.fields.planned_coverage_pct_delta
        distinguishing_aspect: |
          The floor reads planned_coverage_pct_delta, which counts PROPOSED trades:
          a single PROPOSED 400000-gallon SWAP against a 4400000-gallon basis gives
          9.09, far below min_coverage_pct 50.00, so activation is refused 422 and the
          program remains PENDING_APPROVAL with submitted_by_user_id intact — the
          rejected activation is not a silent return to SIZING.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with min_coverage_pct 50.00 and max_coverage_pct 60.00."
            - "One PENDING_APPROVAL HedgeProgram with basis 4400000 and one PROPOSED 400000-gallon SWAP."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-FLOOR", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 50.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-FLOOR", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 55.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
