              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v: $.data.version }
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 50000, plan_duration_months: 36, expected_case_version: "${case_v}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/file-plan"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "POST /plans/${plan_id}/confirm-plan"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /plans/${plan_id}/confirm-plan .status == 403"
            - "POST /plans/${plan_id}/confirm-plan .data.error_id == ERR_UNAUTHORIZED"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to POST /cases with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A registered debtor exists."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Auth Debtor", email: "authh@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Anonymous
              captures: { err: $.data.error_id }
