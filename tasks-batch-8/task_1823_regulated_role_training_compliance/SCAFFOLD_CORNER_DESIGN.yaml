            - "camp_st == \"DRAFT\" (unchanged)"

      - name: manager_acknowledge_own_notice_and_others_forbidden
        claim_type: ownership
        grounds:
          - "state_machines.EscalationNotice"
          - "errors[ERR_OWNERSHIP_MISMATCH]"
          - "errors[ERR_INVALID_STATE]"
          - "roles[Manager]"
        distinguishing_aspect: "Level-2 notices are addressed to the assignee's manager: another manager gets 403 ERR_OWNERSHIP_MISMATCH, the addressee succeeds, and a repeat acknowledge hits 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-ACK (CALENDAR, interval 10, reminder 7); curriculum CUR-ACK ACTIVE; roles R-ACKM (managers M1, M2), R-ACK (SOFT req due_in_days 2)"
            - "Employee E-ACK reports to M1 and holds assignment A due 2026-08-05T09:00:00Z"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-ACK", name: "ACK Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, escalation_interval_days: 10, reminder_days_before_due: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-ACK", title: "ACK Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://ack-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-ACKM", name: "ACK Mgr Role" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-ACK", name: "ACK Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-ACK-1", full_name: "Ack Mgr One", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { m1: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-ACK-2", full_name: "Ack Mgr Two", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { m2: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-ACK-1", full_name: "Ack Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${m1}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { n: "$.data.notices_created" } }
            - { call: "GET /compliance/employees/${m1}/escalations", as: ComplianceAdmin, captures: { note: "$.data[0].id", note_lv: "$.data[0].level", note_rcpt: "$.data[0].recipient_employee_id" } }
          trigger:
            - { call: "POST /compliance/escalations/${note}/acknowledge", payload: {}, as: Manager, as_user_id: "${m2}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /compliance/escalations/${note}/acknowledge", payload: {}, as: Manager, as_user_id: "${m1}", captures: { ok_st: "$.data.status" } }
            - { call: "POST /compliance/escalations/${note}/acknowledge", payload: {}, as: Manager, as_user_id: "${m1}", captures: { err2: "$.data.error_id" } }
          assert:
            - "n == 1 and note_lv == 2 and note_rcpt == ${m1} (OVERDUE escalation addressed to the direct manager)"
            - "err1 == \"ERR_OWNERSHIP_MISMATCH\" (M2 is not the addressee)"
            - "ok_st == \"ACKNOWLEDGED\""
            - "err2 == \"ERR_INVALID_STATE\" (ACKNOWLEDGED is terminal)"

      - name: level3_escalation_notice_acknowledged_by_compliance_admin
        claim_type: role_denied
        grounds:
          - "state_machines.EscalationNotice"
          - "entities.EscalationNotice.fields.recipient_employee_id"
          - "roles[ComplianceAdmin]"
        distinguishing_aspect: "Level-3 notices carry recipient null and are acknowledgeable only by ComplianceAdmin; a Manager caller is rejected ERR_OWNERSHIP_MISMATCH."
