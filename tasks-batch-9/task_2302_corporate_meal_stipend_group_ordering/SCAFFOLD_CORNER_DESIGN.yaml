scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_meal_program_applies_declared_defaults_for_omitted_optionals
        claim_type: defaults
        grounds:
          - entities.MealProgram.fields.max_delivery_radius_km
          - entities.MealProgram.fields.taxable_benefit_method
          - entities.MealProgram.fields.rollover_policy
          - entities.MealProgram.fields.forecast_basis
        distinguishing_aspect: "Creating a meal program with only the three required inputs must materialise max_delivery_radius_km 8.0, taxable_benefit_method DE_MINIMIS_EXCLUSION, rollover_policy CAPPED_PCT, rollover_cap_pct 0.25 and forecast_basis COMMITMENT."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"] }, as: PlatformAdmin }
          assert:
            - "response max_delivery_radius_km == 8.0"
            - "response taxable_benefit_method == DE_MINIMIS_EXCLUSION and rollover_policy == CAPPED_PCT"
            - "response rollover_cap_pct == 0.25 and forecast_basis == COMMITMENT"
            - "response program_spent_cents == 0, program_reserved_cents == 0, mtd_employer_captured_cents == 0"
            - "response version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: create_restaurant_returns_system_fields_and_initial_eligible_status
        claim_type: creation
        grounds:
          - entities.Restaurant.fields.status
          - entities.Restaurant.fields.max_concurrent_group_deliveries
        distinguishing_aspect: "A newly created restaurant is ELIGIBLE with max_concurrent_group_deliveries 1 by default, and the system stamps id, created_at, updated_at and version 1 rather than accepting them from input."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin }
          assert:
            - "response status == ELIGIBLE"
            - "response max_concurrent_group_deliveries == 1"
            - "response id is a server-minted non-empty string and version == 1"
            - "response created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: create_meal_program_without_billing_account_ref_is_invalid_request
        claim_type: required_fields
        grounds:
          - entities.MealProgram.fields.billing_account_ref
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "billing_account_ref has source input and no default, so omitting it must return 400 ERR_INVALID_REQUEST and create no MealProgram row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", eligible_cuisines: ["THAI"] }, as: PlatformAdmin }
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no MealProgram row exists afterwards"

      - name: create_budget_rule_without_eligible_weekdays_is_invalid_request
        claim_type: required_fields
        grounds:
          - entities.BudgetRule.fields.eligible_weekdays
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "eligible_weekdays is a required input on the budget-rule draft endpoint; omitting it returns 400 ERR_INVALID_REQUEST and leaves EmployeeGroup.active_rule_count at 0."
        test_recipe:
          setup:
            - "A meal program with one Engineering employee group and no budget rules."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id } }
          trigger:
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter" }
            - { call: "GET /employee-groups/${grp_id}", as: ProgramAdmin }
          assert:
            - "the draft response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "EmployeeGroup.${grp_id}.active_rule_count == 0"

      - name: create_budget_rule_with_unknown_overage_policy_is_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.BudgetRule.fields.overage_policy
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "overage_policy is an enum limited to PERSONAL_CARD and BLOCK, so the value DEDUCT_FROM_PAYROLL must be rejected with 400 ERR_INVALID_REQUEST rather than silently defaulted."
        test_recipe:
          setup:
            - "A meal program with one Engineering employee group."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id } }
          trigger:
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "DEDUCT_FROM_PAYROLL" }, as: BenefitsController, as_user_id: "ctrl-drafter" }
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no BudgetRule row exists for group ${grp_id}"

      - name: create_budget_rule_with_window_end_minute_above_1440_is_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.BudgetRule.fields.eligible_window_end_minute
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "eligible_window_end_minute is a minute-of-day in 0..1440, so 1500 is out of range and must return 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A meal program with one Engineering employee group."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id } }
          trigger:
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 1500 }, as: BenefitsController, as_user_id: "ctrl-drafter" }
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: create_order_with_empty_lines_array_is_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Order.fields.lines
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "The lines array must hold between 1 and 20 items, so an empty array returns 400 ERR_INVALID_REQUEST and no Order row is created."
        test_recipe:
          setup:
            - "Program / Engineering group with an ACTIVE rule / HQ Lobby / Thai Garden / Ada with an OPEN 2026-08 period."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [] }, as: Employee, as_user_id: "${emp_id}" }
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /orders with employee_id ${emp_id} returns total_count 0"

      - name: employee_group_active_rule_count_is_derived_from_activation_not_input
        claim_type: computed_fields
        grounds:
          - entities.EmployeeGroup.fields.active_rule_count
          - state_machines.BudgetRule.DRAFT_to_ACTIVE
        distinguishing_aspect: "active_rule_count is computed: it is 0 while the rule is only DRAFT and becomes 1 only after the activation, and the group's version increments on activation."
        test_recipe:
          setup:
            - "A meal program with an Engineering group and one DRAFT budget rule."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
          trigger:
            - { call: "GET /employee-groups/${grp_id}", as: ProgramAdmin }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "GET /employee-groups/${grp_id}", as: ProgramAdmin }
          assert:
            - "the first read has EmployeeGroup.${grp_id}.active_rule_count == 0 and version == 1"
            - "BudgetRule.${rule_id}.status == DRAFT before the activate and ACTIVE after it"
            - "BudgetRule.${rule_id}.rule_sequence == 1 and drafted_by_user_id == ctrl-drafter"
            - "the second read has EmployeeGroup.${grp_id}.active_rule_count == 1 and version == 2"

      - name: refund_ledger_entry_is_append_only_with_no_version_or_update_endpoint
        claim_type: immutability
        grounds:
          - entities.RefundLedgerEntry
          - entities.RefundLedgerEntry.fields.reason
        distinguishing_aspect: "RefundLedgerEntry declares common_fields false, so its rows expose id, created_at, order_id, credit_claim_id, direction, amount_cents and reason but no version or updated_at, and §1.5 declares no write endpoint that targets a ledger row."
        test_recipe:
          setup:
            - "Program / Engineering / HQ Lobby / Thai Garden / Ada with an OPEN 2026-08 period."
            - "Ada's single 1000-cent order is PLACED and then CANCELLED, which writes one EMPLOYER_CREDIT void row for 1787."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /orders/${ord_id}/place", payload: { expected_benefit_period_version: "${per_v}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord_id}/cancel", as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "GET /orders/${ord_id}/refund-entries", as: ProgramAdmin }
          assert:
            - "exactly 1 RefundLedgerEntry row is returned with direction EMPLOYER_CREDIT, amount_cents 1787 and reason ORDER_VOID"
            - "the row exposes id, created_at, order_id, credit_claim_id, direction, amount_cents and reason and no version or updated_at key"
            - "credit_claim_id is null because the void was not raised by a credit claim"
            - "Order.${ord_id}.settlement_status == VOIDED and net_charged_cents == 0 and admin_fee_cents == 0"

      - name: get_benefit_period_by_id_returns_the_stored_allocation_row
        claim_type: retrieval
        grounds:
          - entities.BenefitPeriod.fields.allocated_cents
          - entities.BenefitPeriod.fields.budget_rule_id
        distinguishing_aspect: "Reading a freshly opened period returns allocated_cents 50000 pinned from the ACTIVE rule, rollover_in_cents 0, available_cents 50000 and the pinned budget_rule_id."
        test_recipe:
          setup:
            - "Program / Engineering group with an ACTIVE rule of monthly_allocation_cents 50000 / Ada enrolled / a 2026-08 period opened."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id } }
          trigger:
            - { call: "GET /benefit-periods/${per_id}", as: ProgramAdmin }
          assert:
            - "BenefitPeriod.${per_id}.status == OPEN and period_month == 2026-08"
            - "BenefitPeriod.${per_id}.allocated_cents == 50000 and rollover_in_cents == 0"
            - "BenefitPeriod.${per_id}.available_cents == 50000, reserved_cents == 0, spent_cents == 0, forfeited_cents == 0, rollover_out_cents == 0"
            - "BenefitPeriod.${per_id}.budget_rule_id == ${rule_id} and predecessor_period_id is null"

      - name: list_employees_honours_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Employee
          - endpoints[GET /employees]
        distinguishing_aspect: "With three enrolled employees, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "A meal program with an Engineering group and three employees Ada, Ben and Cleo."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test" }, as: ProgramAdmin }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ben Lovelace", email: "ben@acme.test" }, as: ProgramAdmin }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Cleo Hopper", email: "cleo@acme.test" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /employees", payload: { program_id: "${prog_id}", limit: 2, offset: 0 }, as: ProgramAdmin }
            - { call: "GET /employees", payload: { program_id: "${prog_id}", limit: 2, offset: 2 }, as: ProgramAdmin }
            - { call: "GET /employees", payload: { program_id: "${prog_id}", limit: 0 }, as: ProgramAdmin }
          assert:
            - "the first listing returns 2 rows with meta pagination total_count == 3 and has_more == true"
            - "the second listing returns 1 row with total_count == 3 and has_more == false"
            - "every returned employee has personal_card_on_file == false, tax_treatment_flag == NONE and status == ACTIVE"
            - "the limit 0 request returns 400 with data.error_id == ERR_INVALID_REQUEST because limit must be in 1..100"

      - name: get_order_with_unknown_id_returns_order_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_ORDER_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "An unallocated order id returns 404 ERR_ORDER_NOT_FOUND rather than 403 or an empty 200 body, even for a ProgramAdmin who could read any order."
        test_recipe:
          setup:
            - "A meal program exists but no orders have been created."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin }
          trigger:
            - { call: "GET /orders/ord_does_not_exist", as: ProgramAdmin }
          assert:
            - "the response is 404 with data.error_id == ERR_ORDER_NOT_FOUND"
            - "the response envelope still carries meta.api_request_id and meta.api_request_timestamp"

      - name: create_employee_group_under_unknown_program_returns_meal_program_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EmployeeGroup.fields.program_id
          - errors.ERR_MEAL_PROGRAM_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "The nested employee-group creation resolves its {id} path segment first, so an unknown program id returns 404 ERR_MEAL_PROGRAM_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /meal-programs/prog_missing/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin }
            - { call: "POST /meal-programs/prog_missing/employee-groups", payload: { headcount_planned: 2 }, as: ProgramAdmin }
          assert:
            - "the first response is 404 with data.error_id == ERR_MEAL_PROGRAM_NOT_FOUND"
