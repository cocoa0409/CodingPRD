    instances:
      - name: finalize_lot_four_link_cascade_to_supplier_quality_strike
        grounds:
          - state_machines.RecoveryLot.CHARGED_to_FINALIZED
          - state_machines.Module.CHARGED_to_CONSUMED
          - state_machines.ProcessingCampaign.RUNNING_to_CLOSED
          - calculations.lot_mass_balance
          - calculations.assay_variance_pp
          - entities.Supplier.fields.quality_strike_count
        distinguishing_aspect: |
          One finalize call propagates through four entity hops in the PROCESSING domain:
          link 1 RecoveryLot CHARGED -> FINALIZED with mass_balance_pct 97.00, link 2 every
          CHARGED Module -> CONSUMED, link 3 the contributing settlement flips PROVISIONAL ->
          FINAL and is re-priced from net 10674 to net 30723, link 4 the supplier gains
          quality_strike_count 1 because max_variance_pp 18.00 exceeds SEVERE_VARIANCE_PP, and
          link 5 the RUNNING campaign bubbles up to CLOSED once its only lot is terminal.
