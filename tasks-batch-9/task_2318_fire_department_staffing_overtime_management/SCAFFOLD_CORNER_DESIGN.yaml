              captures: { v99first: "$.data[0].id", v99first_apparatus: "$.data[0].apparatus_id", v99first_seat: "$.data[0].seat_index" }
          assert:
            - "total_count == 3 and DutyShift.${sh99}.required_staffing == 3"
            - "${v99first_apparatus} == ${eng99} and ${v99first_seat} == 1 — the priority-10 engine is allocated first"
            - "data[1].apparatus_id == ${eng99} with seat_index 2 and required_certification \"NONE\""
            - "data[2].apparatus_id == ${med99} with seat_index 1 (restarted, not 3) and required_certification \"PARAMEDIC\""
            - "DutyShift.${sh99}.certification_gap_count == 1 and staffing_posture == \"CRITICAL\""

      - name: closure_selector_takes_highest_priority_non_exempt_company_first
        claim_type: constraint_propagation
        grounds:
          - calculations.company_closure_selector
          - calculations.required_staffing
          - concurrency_rules[company-closure-stale-duty-shift]
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"]
        distinguishing_aspect: "Two successive closures on the same CRITICAL shift remove TRUCK (priority 30) and then HAZMAT (priority 20) while the exempt ENGINE (priority 10) is never touched, and required_staffing falls 12 -> 8 -> 4 as each company leaves service."
        test_recipe:
          setup:
            - "Station 100 with floor 1 and three companies, each crew 4: ENGINE-100 (priority 10, closure_exempt true), HAZMAT-100 (priority 20) and TRUCK-100 (priority 30)."
            - "The 2026-08-11 shift is published with no members at the station at all, so required_staffing is 12, staffing_gap is 12 and staffing_posture is CRITICAL, which justifies a closure."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 100", battalion_code: "E6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st100: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st100}", unit_designation: "ENGINE-100", apparatus_type: "ENGINE", minimum_crew_size: 4, required_certifications: [], closure_priority: 10, closure_exempt: true }
              as: StaffingOfficer
              captures: { eng100: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st100}", unit_designation: "HAZMAT-100", apparatus_type: "HAZMAT", minimum_crew_size: 4, required_certifications: [], closure_priority: 20 }
              as: StaffingOfficer
              captures: { haz100: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st100}", unit_designation: "TRUCK-100", apparatus_type: "LADDER", minimum_crew_size: 4, required_certifications: [], closure_priority: 30 }
              as: StaffingOfficer
              captures: { trk100: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st100}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh100: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh100}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh100_v0: "$.data.version" }
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh100}/company-closure"
              payload: { expected_duty_shift_version: "${sh100_v0}", justification: "no crew available for the third company" }
              as: StaffingOfficer
              captures: { sh100_v1: "$.data.version" }
            - call: "POST /fire-ops/duty-shifts/${sh100}/company-closure"
              payload: { expected_duty_shift_version: "${sh100_v1}", justification: "still critical after the first closure" }
              as: StaffingOfficer
          assert:
            - "AFTER FIRST CLOSURE: DutyShift.${sh100}.closed_apparatus_ids == [${trk100}] and required_staffing == 8"
            - "AFTER SECOND CLOSURE: closed_apparatus_ids == [${trk100}, ${haz100}] and required_staffing == 4"
            - "${eng100} never appears in closed_apparatus_ids because it is closure_exempt"
            - "The four vacancies of each closed company are CLOSED_BY_COMPANY_CLOSURE and open_vacancy_count == 4 after the second closure"
            - "DutyShift.${sh100}.staffing_posture == \"CRITICAL\" throughout and status == \"HIRING\""

      - name: hiring_order_variant_divergence_between_callback_and_voluntary
        claim_type: Variant Divergence
        grounds:
          - calculations.hiring_order_selector
          - calculations.overtime_offer_cost
          - endpoints["POST /fire-ops/vacancies/{vacancy_id}/offer"]
        distinguishing_aspect: "On the same shift with the same two candidates, CALLBACK must skip the on-duty platoon C member and offer the off-duty platoon D member, whereas VOLUNTARY has no platoon restriction and offers the platoon C member first on fewest charged hours — and the two modes price differently (2.0 multiplier with a 3-hour minimum versus 1.5)."
        test_recipe:
          setup:
            - "Station 101 with floor 1, a 900,000-cent budget, one company ENGINE-101 (crew 2, no required certifications), and both a CALLBACK and a VOLUNTARY_OT roster scoped NONE."
            - "Member ff101c is platoon C (on duty on 2026-08-11), Kelly 1, seniority 1, rate 4000; member ff101d is platoon D (off duty), Kelly 1, seniority 5, rate 4237. Both have zero charged hours and zero callbacks."
            - "The 2026-08-11 shift is published with two OPEN vacancies requiring NONE."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 101", battalion_code: "E7", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st101: "$.data.id" }
