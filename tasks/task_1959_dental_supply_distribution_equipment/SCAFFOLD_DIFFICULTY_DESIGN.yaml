scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: repair_cost_warranty_vs_service_plan_divergence
        grounds:
          - calculations.repair_cost
          - state_machines.ServiceTicket.OPEN_to_COVERAGE_ASSESSED
          - state_machines.ServiceTicket.DISPATCHED_to_RESOLVED
        distinguishing_aspect: |
          Dual-variant logic on the ServiceTicket/repair-cost domain: identical
          parts and labor inputs produce customer_due_cents == 0 under the
          WARRANTY variant but 5000 under the SERVICE_PLAN variant
          (gross 27000 - min(27000 - 5000 deductible, 100000 cap) = 5000).
        test_recipe:
          setup:
            - "Practice P (STANDARD, region R1, licensed, credit 10000000)"
            - "EQ1 EQUIPMENT warranty_months 12; EQ2 EQUIPMENT warranty_months 1; PT PART price 15000"
            - "Technician T1 region R1 with INSTALL+REPAIR; van loaded with 10 x PT"
            - "Sale S1 (EQ1) and S2 (EQ2) both driven to ACCEPTED; S1 warranty ACTIVE through 2027-08-01, S2 warranty ends 2026-09-01"
            - "SERVICE_PLAN agreement on S2: deductible 5000, cap 100000, window 2026-08-01..2028-08-01"
            - "Logical clock at 2026-10-01: S2's warranty lazily EXPIRED, plan still ACTIVE"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Repair", region: "R1", practice_tier: "STANDARD", credit_limit_cents: 10000000, regulated_license_expiry: "2030-01-01T00:00:00Z", sterilization_compliant: true }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-1", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq1: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-2", name: "XRay", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 1 }, as: DistributionAdmin, captures: { eq2: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PT-1", name: "Valve", kind: "PART", unit_price_cents: 15000, manufacturer: "M" }, as: DistributionAdmin, captures: { pt: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "PUT /api/technicians/${t1}/van-stock", payload: { product_id: "${pt}", quantity_on_van: 10, min_quantity: 1 }, as: DistributionAdmin }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq1}", sale_price_cents: 900000 }, as: SalesRep, captures: { s1: $.data.id } }
            - { call: "POST /api/equipment-sales/${s1}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s1}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s1}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s1}/complete-training", payload: { training_minutes: 60 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s1}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq2}", sale_price_cents: 900000 }, as: SalesRep, captures: { s2: $.data.id } }
            - { call: "POST /api/equipment-sales/${s2}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s2}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s2}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s2}/complete-training", payload: { training_minutes: 60 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s2}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/coverage-agreements", payload: { practice_id: "${p}", equipment_sale_id: "${s2}", coverage_type: "SERVICE_PLAN", start_date: "2026-08-01T00:00:00Z", end_date: "2028-08-01T00:00:00Z", deductible_cents: 5000, coverage_cap_cents: 100000 }, as: SalesRep, captures: { plan2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s1}", issue_description: "leak" }, as: ServiceDispatcher, captures: { k1: $.data.id } }
            - { call: "POST /api/service-tickets/${k1}/assess-coverage", payload: {}, as: ServiceDispatcher, captures: { det1: $.data.coverage_determination } }
            - { call: "POST /api/service-tickets/${k1}/dispatch", payload: { scheduled_start: "2026-10-02T09:00:00Z", scheduled_end: "2026-10-02T10:00:00Z" }, as: ServiceDispatcher, captures: { j1tech: $.data.technician_id } }
            - { call: "POST /api/service-tickets/${k1}/resolve", payload: { parts_used: [ { product_id: "${pt}", quantity: 1 } ], labor_minutes: 60 }, as: FieldTechnician, as_user_id: "${j1tech}", captures: { due1: $.data.customer_due_cents } }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s2}", issue_description: "leak" }, as: ServiceDispatcher, captures: { k2: $.data.id } }
            - { call: "POST /api/service-tickets/${k2}/assess-coverage", payload: {}, as: ServiceDispatcher, captures: { det2: $.data.coverage_determination } }
            - { call: "POST /api/service-tickets/${k2}/dispatch", payload: { scheduled_start: "2026-10-02T10:00:00Z", scheduled_end: "2026-10-02T11:00:00Z" }, as: ServiceDispatcher, captures: { j2tech: $.data.technician_id } }
            - { call: "POST /api/service-tickets/${k2}/resolve", payload: { parts_used: [ { product_id: "${pt}", quantity: 1 } ], labor_minutes: 60 }, as: FieldTechnician, as_user_id: "${j2tech}", captures: { due2: $.data.customer_due_cents } }
            - { call: "GET /api/coverage-agreements/${plan2}", payload: {}, as: DistributionAdmin, captures: { used2: $.data.used_cents } }
          assert:
            - "Ticket ${k1}.coverage_determination == WARRANTY and customer_due_cents == 0"
            - "Ticket ${k2}.coverage_determination == SERVICE_PLAN and customer_due_cents == 5000"
            - "CoverageAgreement ${plan2}.used_cents == 22000 (plan_share = min(27000 - 5000, 100000))"
            - "Identical repair inputs (1 x PT 15000 + 60 min labor = gross 27000) yield different customer_due_cents across the two coverage variants"

      - name: trade_in_market_vs_scrap_divergence
        grounds:
          - calculations.trade_in_valuation
          - state_machines.TradeIn.REQUESTED_to_APPRAISED
        distinguishing_aspect: |
          Dual-variant logic on the TradeIn valuation domain (distinct from the
          ServiceTicket repair-cost domain): the same trade-in inputs (base
          1000000, age 12, WORKING) appraise to 784717 under MARKET_VALUE
          (1000000 x 0.98^12 x 1.0) but 25000 under SCRAP_VALUE.
        test_recipe:
          setup:
            - "Practice P exists"
            - "Two identical TradeIn rows: age 12 months, condition WORKING, category_base_value_cents 1000000"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Trade", region: "R9", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/trade-ins", payload: { practice_id: "${p}", description: "autoclave", equipment_age_months: 12, condition: "WORKING", category_base_value_cents: 1000000 }, as: SalesRep, captures: { ti1: $.data.id } }
            - { call: "POST /api/trade-ins", payload: { practice_id: "${p}", description: "autoclave twin", equipment_age_months: 12, condition: "WORKING", category_base_value_cents: 1000000 }, as: SalesRep, captures: { ti2: $.data.id } }
          trigger:
            - { call: "POST /api/trade-ins/${ti1}/appraise", payload: { valuation_method: "MARKET_VALUE" }, as: SalesRep, captures: { mv: $.data.appraised_value_cents } }
            - { call: "POST /api/trade-ins/${ti2}/appraise", payload: { valuation_method: "SCRAP_VALUE" }, as: SalesRep, captures: { sv: $.data.appraised_value_cents } }
          assert:
            - "TradeIn ${ti1}.appraised_value_cents == 784717 (MARKET_VALUE)"
            - "TradeIn ${ti2}.appraised_value_cents == 25000 (SCRAP_VALUE)"
            - "Same inputs, two valid valuation algorithms, different credits: 784717 != 25000"

  - rule_id: combinatorial_formula
    instances:
      - name: volume_discount_tier_keyed_on_prediscount_subtotal
        grounds:
          - calculations.order_volume_discount
          - calculations.order_total
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          the discount tier is keyed on the PRE-DISCOUNT subtotal_cents
          (500000 >= 500000 -> 10%), not on the discounted total (450000 would
          fall in the 5% tier); the scaffold pins tier-selection-before-discount.
        test_recipe:
          setup:
            - "Practice P with credit 10000000"
            - "Product C1 CONSUMABLE price 250000"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Vol", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-1", name: "Gloves", kind: "CONSUMABLE", unit_price_cents: 250000, manufacturer: "M" }, as: DistributionAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c1}", quantity: 2 } ] }, as: SalesRep, captures: { sub: $.data.subtotal_cents, vol: $.data.volume_discount_cents, tot: $.data.total_cents } }
          assert:
            - "Order.subtotal_cents == 500000"
            - "Order.volume_discount_cents == 50000 (tier selected on pre-discount subtotal)"
            - "Order.total_cents == 450000"

      - name: bundle_discount_tier_bonus_then_cap
        grounds:
          - calculations.bundle_discount
          - calculations.order_total
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction:
          bundle discount = min(round(component_subtotal x (discount_pct +
          ELITE tier bonus)), max_discount_cents) — conditional branch on
          Practice.practice_tier nested inside a min() against the promo cap.
        test_recipe:
          setup:
            - "ELITE practice PE and STANDARD practice PS, credit 50000000 each"
            - "Products PA 60000, PB 40000, PC 90000, PD 60000 (CONSUMABLE)"
            - "Promotion PROMO1: BUNDLE_DISCOUNT 15%, cap 20000, required [PA, PB], stacking disallowed, window 2026-01-01..2027-12-31"
            - "Promotion PROMO2: same shape, required [PC, PD]"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Elite", region: "R1", practice_tier: "ELITE", credit_limit_cents: 50000000 }, as: DistributionAdmin, captures: { pe: $.data.id } }
            - { call: "POST /api/practices", payload: { name: "P Std", region: "R1", practice_tier: "STANDARD", credit_limit_cents: 50000000 }, as: DistributionAdmin, captures: { ps: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PA", name: "A", kind: "CONSUMABLE", unit_price_cents: 60000, manufacturer: "M" }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PB", name: "B", kind: "CONSUMABLE", unit_price_cents: 40000, manufacturer: "M" }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PC", name: "C", kind: "CONSUMABLE", unit_price_cents: 90000, manufacturer: "M" }, as: DistributionAdmin, captures: { pc: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PD", name: "D", kind: "CONSUMABLE", unit_price_cents: 60000, manufacturer: "M" }, as: DistributionAdmin, captures: { pd: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "B1", promo_kind: "BUNDLE_DISCOUNT", required_product_ids: ["${pa}", "${pb}"], discount_pct: 0.15, max_discount_cents: 20000, stacking_allowed: false, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo1: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "B2", promo_kind: "BUNDLE_DISCOUNT", required_product_ids: ["${pc}", "${pd}"], discount_pct: 0.15, max_discount_cents: 20000, stacking_allowed: false, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo2: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${pe}", kind: "BUNDLE", promotion_id: "${promo1}", lines: [ { product_id: "${pa}", quantity: 1 }, { product_id: "${pb}", quantity: 1 } ] }, as: SalesRep, captures: { e_bun: $.data.bundle_discount_cents, e_tot: $.data.total_cents } }
            - { call: "POST /api/orders", payload: { practice_id: "${ps}", kind: "BUNDLE", promotion_id: "${promo1}", lines: [ { product_id: "${pa}", quantity: 1 }, { product_id: "${pb}", quantity: 1 } ] }, as: SalesRep, captures: { s_bun: $.data.bundle_discount_cents, s_tot: $.data.total_cents } }
            - { call: "POST /api/orders", payload: { practice_id: "${pe}", kind: "BUNDLE", promotion_id: "${promo2}", lines: [ { product_id: "${pc}", quantity: 1 }, { product_id: "${pd}", quantity: 1 } ] }, as: SalesRep, captures: { c_bun: $.data.bundle_discount_cents, c_tot: $.data.total_cents } }
          assert:
            - "ELITE order: bundle_discount_cents == 17000 (100000 x 0.17 bonus-inclusive), total_cents == 83000"
            - "STANDARD order: bundle_discount_cents == 15000 (100000 x 0.15), total_cents == 85000"
            - "Cap case: bundle_discount_cents == 20000 (raw 150000 x 0.17 = 25500 clamped by min), total_cents == 130000"

      - name: rebate_per_line_round_then_sum
        grounds:
          - calculations.rebate_payout
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: each eligible line is
          rounded to whole cents BEFORE summation (62.5 -> 63 twice -> 126);
          the rejected sum-then-round reading yields round(125.0) == 125.
        test_recipe:
          setup:
            - "ELITE practice PE (multiplier 1.25), credit 10000000"
            - "Products P1 and P2, CONSUMABLE, price 1000 each"
            - "MANUFACTURER_REBATE promotion: rebate_per_unit_cents 50, eligible [P1, P2], fund 100000, window 2026-01-01..2027-12-31"
            - "Delivered order with lines P1 x 1 and P2 x 1"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Elite", region: "R1", practice_tier: "ELITE", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { pe: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "P-1", name: "P1", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "P-2", name: "P2", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "R1", promo_kind: "MANUFACTURER_REBATE", eligible_product_ids: ["${p1}", "${p2}"], rebate_per_unit_cents: 50, fund_total_cents: 100000, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pe}", kind: "MANUAL", lines: [ { product_id: "${p1}", quantity: 1 }, { product_id: "${p2}", quantity: 1 } ] }, as: PracticeManager, as_user_id: "${pe}", captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${pe}" }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/rebate-claims", payload: { practice_id: "${pe}", order_id: "${o}", promotion_id: "${promo}" }, as: PracticeManager, as_user_id: "${pe}", captures: { amt: $.data.claim_amount_cents } }
          assert:
            - "RebateClaim.claim_amount_cents == 126 (per-line round_half_up(1 x 50 x 1.25) = 63 on each of two lines, then summed)"
            - "Sum-then-round would yield 125; the pinned per-line-first order is observable"

  - rule_id: non_linear_state_machine
    instances:
      - name: equipment_sale_install_rework_cycle
        grounds:
          - state_machines.EquipmentSale.INSTALLED_to_INSTALL_SCHEDULED
          - state_machines.EquipmentSale.TRAINED_to_ACCEPTED
        distinguishing_aspect: |
          Non-linear machine on EquipmentSale: a true cycle
          INSTALL_SCHEDULED -> INSTALLED -> INSTALL_SCHEDULED (rework) before
          proceeding to TRAINED -> ACCEPTED; install_rework_count records the loop.
        test_recipe:
          setup:
            - "Practice P; EQUIPMENT product with warranty_months 12; technician T1 (INSTALL, region R1)"
            - "Sale confirmed; install scheduled and completed once"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Eq", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-9", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-04T09:00:00Z", window_end: "2026-08-04T12:00:00Z" }, as: SalesRep, captures: { rw_status: $.data.status, rw_count: $.data.install_rework_count } }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 45 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { fin_status: $.data.status, war_id: $.data.warranty_agreement_id } }
            - { call: "GET /api/coverage-agreements/${war_id}", payload: {}, as: DistributionAdmin, captures: { war_type: $.data.coverage_type, war_end: $.data.end_date } }
          assert:
            - "After rework reschedule: status == INSTALL_SCHEDULED and install_rework_count == 1 (cycle INSTALLED -> INSTALL_SCHEDULED taken)"
            - "Final status == ACCEPTED and warranty_agreement_id is non-null"
            - "Created agreement: coverage_type == WARRANTY, deductible_cents == 0, coverage_cap_cents == null, end_date == 2027-08-01T00:00:00Z (accept at default clock 2026-08-01 + 12 months)"

      - name: service_ticket_billable_fork_and_reopen_cycle
        grounds:
          - state_machines.ServiceTicket.OPEN_to_AWAITING_APPROVAL
          - state_machines.ServiceTicket.AWAITING_APPROVAL_to_COVERAGE_ASSESSED
          - state_machines.ServiceTicket.RESOLVED_to_OPEN
        distinguishing_aspect: |
          Non-linear machine on ServiceTicket (different entity than
          EquipmentSale): branching fork OPEN -> AWAITING_APPROVAL (BILLABLE)
          joining at COVERAGE_ASSESSED, plus a RESOLVED -> OPEN rework cycle
          that re-traverses the pipeline to CLOSED.
        test_recipe:
          setup:
            - "Practice P region R1; EQUIPMENT product with warranty_months 0 (warranty spans only the acceptance instant); technician T1 (INSTALL+REPAIR, R1)"
            - "Sale driven to ACCEPTED at default clock; clock then advanced to 2026-08-02 so the warranty lazily EXPIRES (now > end_date)"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Tk", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-0", name: "OldChair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 0 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DistributionAdmin }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "noise" }, as: ServiceDispatcher, captures: { k: $.data.id } }
          trigger:
            - { call: "POST /api/service-tickets/${k}/assess-coverage", payload: {}, as: ServiceDispatcher, captures: { fork_status: $.data.status, est: $.data.estimate_cents, det: $.data.coverage_determination } }
            - { call: "POST /api/service-tickets/${k}/approve-estimate", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { join_status: $.data.status } }
            - { call: "POST /api/service-tickets/${k}/dispatch", payload: { scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ServiceDispatcher, captures: { tech: $.data.technician_id } }
            - { call: "POST /api/service-tickets/${k}/resolve", payload: { parts_used: [], labor_minutes: 45 }, as: FieldTechnician, as_user_id: "${tech}", captures: { due1: $.data.customer_due_cents, st1: $.data.status } }
            - { call: "POST /api/service-tickets/${k}/reopen", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { st2: $.data.status, due2: $.data.customer_due_cents, det2: $.data.coverage_determination } }
            - { call: "POST /api/service-tickets/${k}/assess-coverage", payload: {}, as: ServiceDispatcher }
            - { call: "POST /api/service-tickets/${k}/approve-estimate", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/service-tickets/${k}/dispatch", payload: { scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: ServiceDispatcher, captures: { tech2: $.data.technician_id } }
            - { call: "POST /api/service-tickets/${k}/resolve", payload: { parts_used: [], labor_minutes: 15 }, as: FieldTechnician, as_user_id: "${tech2}", captures: { due3: $.data.customer_due_cents } }
            - { call: "POST /api/service-tickets/${k}/close", payload: {}, as: ServiceDispatcher, captures: { stf: $.data.status } }
          assert:
            - "Fork branch: first assess yields status == AWAITING_APPROVAL with coverage_determination == BILLABLE and estimate_cents == 7500"
            - "Join: approve-estimate moves AWAITING_APPROVAL -> COVERAGE_ASSESSED"
            - "BILLABLE resolution: customer_due_cents == 9000 (45 min x 200)"
            - "Cycle: reopen returns to OPEN with customer_due_cents and coverage_determination cleared to null"
            - "Second pass resolves with customer_due_cents == 3000 and close terminates at CLOSED"

  - rule_id: transitive_cascade
    instances:
      - name: deliver_triggers_usage_update_triggers_auto_order
        grounds:
          - state_machines.Order.SUBMITTED_to_DELIVERED
          - calculations.usage_average
          - calculations.auto_reorder_quantity
        distinguishing_aspect: |
          Depth-3 cascade triggered by order DELIVERY: deliver mutates the Order
          (hop 1); the Order mutation updates UsageProfile.on_hand_estimate and
          average_daily_usage (hop 2, caused by hop 1); the profile update
          breaches the reorder threshold and creates a new AUTO DRAFT Order
          (hop 3, caused by hop 2, not by the deliver call directly).
        test_recipe:
          setup:
            - "Practice P credit 10000000; product C CONSUMABLE price 1000"
            - "UsageProfile for (P, C): reorder_point 20, target_stock_level 100, auto_replenish_enabled true"
            - "MANUAL order of C x 20 submitted"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Casc", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /api/products", payload: { sku: "C-9", name: "Gauze", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${c}", reorder_point: 20, target_stock_level: 100, auto_replenish_enabled: true, expected_practice_version: "${pv}" }, as: PracticeManager, as_user_id: "${p}", captures: { prof: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 20 } ] }, as: SalesRep, captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin, captures: { ost: $.data.status } }
            - { call: "GET /api/usage-profiles/${prof}", payload: {}, as: DistributionAdmin, captures: { oh: $.data.on_hand_estimate, avg: $.data.average_daily_usage } }
            - { call: "GET /api/orders?practice_id=${p}&kind=AUTO", payload: {}, as: DistributionAdmin, captures: { auto_id: "$.data[0].id", auto_status: "$.data[0].status", auto_lines: "$.data[0].lines" } }
          assert:
            - "Manual order ${o}.status == DELIVERED (hop 1)"
            - "UsageProfile ${prof}.on_hand_estimate == 20 and average_daily_usage == 0.7143 (hop 2: 20/28, 4dp round_half_up)"
            - "Exactly one AUTO order exists for the practice: kind == AUTO, status == DRAFT (hop 3)"
            - "AUTO order lines[0].product_id == ${c} and lines[0].quantity == 80 (ceiling(100 - 20))"

      - name: claim_submit_debits_fund_exhausts_promotion
        grounds:
          - state_machines.RebateClaim.DRAFT_to_SUBMITTED
          - state_machines.Promotion.ACTIVE_to_EXHAUSTED
          - calculations.rebate_payout
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (claim submit, not order
          deliver): submit mutates the RebateClaim (hop 1); the claim mutation
          debits Promotion.fund_remaining_cents (hop 2, caused by hop 1); the
          fund hitting 0 flips the Promotion ACTIVE -> EXHAUSTED (hop 3, caused
          by hop 2).
        test_recipe:
          setup:
            - "ELITE practice PE; products P1, P2 price 1000; rebate promotion fund_total_cents exactly 126 (the claim amount), unit rebate 50, eligible [P1, P2]"
            - "Delivered order [P1 x 1, P2 x 1]; claim created (amount 126)"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Fund", region: "R1", practice_tier: "ELITE", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { pe: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "F-1", name: "F1", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "F-2", name: "F2", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "RF", promo_kind: "MANUFACTURER_REBATE", eligible_product_ids: ["${p1}", "${p2}"], rebate_per_unit_cents: 50, fund_total_cents: 126, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pe}", kind: "MANUAL", lines: [ { product_id: "${p1}", quantity: 1 }, { product_id: "${p2}", quantity: 1 } ] }, as: PracticeManager, as_user_id: "${pe}", captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${pe}" }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/rebate-claims", payload: { practice_id: "${pe}", order_id: "${o}", promotion_id: "${promo}" }, as: PracticeManager, as_user_id: "${pe}", captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /api/rebate-claims/${cl}/submit", payload: {}, as: PracticeManager, as_user_id: "${pe}", captures: { cst: $.data.status } }
            - { call: "GET /api/promotions/${promo}", payload: {}, as: DistributionAdmin, captures: { fr: $.data.fund_remaining_cents, pst: $.data.status } }
          assert:
            - "RebateClaim ${cl}.status == SUBMITTED (hop 1)"
            - "Promotion ${promo}.fund_remaining_cents == 0 (hop 2: 126 - 126)"
            - "Promotion ${promo}.status == EXHAUSTED (hop 3: fund <= 0 auto-flip)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_error_precedes_credit_fiscal_error
        grounds:
          - validations[priority=5]
          - validations[priority=28]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: submitting a CANCELLED
          order whose total (150000) also exceeds available credit (100000)
          must return ERR_INVALID_STATE (priority 5), not
          ERR_CREDIT_LIMIT_EXCEEDED (priority 28).
        test_recipe:
          setup:
            - "Practice P credit_limit 100000; product C price 75000"
            - "Order of C x 2 (total 150000 > credit) created then cancelled from DRAFT"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Prio", region: "R1", credit_limit_cents: 100000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-7", name: "Kit", kind: "CONSUMABLE", unit_price_cents: 75000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 2 } ] }, as: SalesRep, captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/cancel", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (terminal CANCELLED; state check wins over the co-violated fiscal check)"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED even though total_cents 150000 > credit_available_cents 100000"

      - name: regulated_license_safety_precedes_qty_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint (different
          pair than state vs fiscal): a REGULATED line with quantity over the
          per-order cap on a practice WITHOUT a valid license must return
          ERR_REGULATED_LICENSE_MISSING (priority 7), not
          ERR_REGULATED_QTY_LIMIT (priority 9).
        test_recipe:
          setup:
            - "Practice P with regulated_license_expiry null (no license)"
            - "REGULATED product RG, max_qty_per_order 2, price 1000"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P NoLic", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "RG-1", name: "Amalgam", kind: "REGULATED", unit_price_cents: 1000, manufacturer: "M", max_qty_per_order: 2 }, as: DistributionAdmin, captures: { rg: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${rg}", quantity: 5 } ] }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REGULATED_LICENSE_MISSING (safety wins over the co-violated quantity constraint of 5 > 2)"
            - "No order row is created"

  - rule_id: boundary_precision_check
    instances:
      - name: reorder_point_equality_triggers_auto_order
        grounds:
          - calculations.auto_reorder_quantity
          - calculations.on_hand_accrual
          - calculations.usage_average
        distinguishing_aspect: |
          Boundary on the stock-level metric reachable via POST
          /api/_replenishment/run: on_hand_estimate EXACTLY EQUAL to
          reorder_point triggers (<=) while 20.7144 > 20 does not.
        test_recipe:
          setup:
            - "Practice P credit 10000000; products PA and PB (CONSUMABLE, 1000)"
            - "Profiles for PA and PB: reorder_point 20, target 100, auto enabled"
            - "Delivered orders: PA x 28 (avg 1.0/day) and PB x 29 (avg 1.0357/day), both at 2026-08-01"
            - "Clock advanced to 2026-08-09: accrual of exactly 8 days leaves PA at exactly 20 and PB at 20.7144"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Bound", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /api/products", payload: { sku: "PA-1", name: "PA", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PB-1", name: "PB", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${pa}", reorder_point: 20, target_stock_level: 100, auto_replenish_enabled: true, expected_practice_version: "${pv}" }, as: PracticeManager, as_user_id: "${p}" }
            - { call: "GET /api/practices/${p}", payload: {}, as: DistributionAdmin, captures: { pv2: $.data.version } }
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${pb}", reorder_point: 20, target_stock_level: 100, auto_replenish_enabled: true, expected_practice_version: "${pv2}" }, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${pa}", quantity: 28 } ] }, as: SalesRep, captures: { oa: $.data.id } }
            - { call: "POST /api/orders/${oa}/submit", payload: {}, as: SalesRep }
            - { call: "POST /api/orders/${oa}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${pb}", quantity: 29 } ] }, as: SalesRep, captures: { ob: $.data.id } }
            - { call: "POST /api/orders/${ob}/submit", payload: {}, as: SalesRep }
            - { call: "POST /api/orders/${ob}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/_replenishment/run", payload: {}, as: DistributionAdmin, captures: { cnt: $.data.evaluated_profile_count, ids: $.data.created_order_ids } }
            - { call: "GET /api/orders?practice_id=${p}&kind=AUTO", payload: {}, as: DistributionAdmin, captures: { a0lines: "$.data[0].lines" } }
          assert:
            - "evaluated_profile_count == 2 and created_order_ids has length 1"
            - "The single AUTO order's lines[0].product_id == ${pa} and lines[0].quantity == 80 (ceiling(100 - 20))"
            - "PA on_hand 20 <= 20 triggers; PB on_hand 20.7144 > 20 does not (boundary metric: stock units, endpoint: replenishment run)"

      - name: credit_limit_exact_equality_passes
        grounds:
          - validations[priority=28]
          - entities.Practice.fields.credit_available_cents
        distinguishing_aspect: |
          Boundary on the money metric reachable via POST /api/orders/{id}/submit
          (distinct metric and endpoint from the reorder boundary): total ==
          credit_available exactly PASSES (<=) while total == credit + 1 cent fails.
        test_recipe:
          setup:
            - "Practice PA credit 150000 with product CA priced 150000; order OA = CA x 1 (total exactly 150000)"
            - "Practice PB credit 150000 with product CB priced 150001; order OB = CB x 1 (total 150001)"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "PA", region: "R1", credit_limit_cents: 150000 }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/practices", payload: { name: "PB", region: "R1", credit_limit_cents: 150000 }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "CA-1", name: "CA", kind: "CONSUMABLE", unit_price_cents: 150000, manufacturer: "M" }, as: DistributionAdmin, captures: { ca: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "CB-1", name: "CB", kind: "CONSUMABLE", unit_price_cents: 150001, manufacturer: "M" }, as: DistributionAdmin, captures: { cb: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pa}", kind: "MANUAL", lines: [ { product_id: "${ca}", quantity: 1 } ] }, as: SalesRep, captures: { oa: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pb}", kind: "MANUAL", lines: [ { product_id: "${cb}", quantity: 1 } ] }, as: SalesRep, captures: { ob: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${oa}/submit", payload: {}, as: SalesRep, captures: { sta: $.data.status } }
            - { call: "GET /api/practices/${pa}", payload: {}, as: DistributionAdmin, captures: { avail: $.data.credit_available_cents } }
            - { call: "POST /api/orders/${ob}/submit", payload: {}, as: SalesRep, captures: { errb: $.data.error_id } }
          assert:
            - "OA submit succeeds: status == SUBMITTED when total_cents == credit_available_cents (150000 <= 150000)"
            - "Practice PA.credit_available_cents == 0 after the boundary-equal submit"
            - "OB submit fails with ERR_CREDIT_LIMIT_EXCEEDED (150001 > 150000 by exactly 1 cent)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: equipment_confirm_blocked_by_suspended_practice
        grounds:
          - state_machines.EquipmentSale.QUOTE_to_CONFIRMED
          - validations[priority=25]
        distinguishing_aspect: |
          Entity pair EquipmentSale -> Practice: the confirm transition is
          guarded by the Practice aggregate's state; a SUSPENDED practice
          blocks confirmation with ERR_PRACTICE_SUSPENDED.
        test_recipe:
          setup:
            - "Practice P; EQUIPMENT product; sale S in QUOTE"
            - "P suspended after the quote was created"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P XDep", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-5", name: "Laser", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/practices/${p}/suspend", payload: {}, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /api/equipment-sales/${s}", payload: {}, as: DistributionAdmin, captures: { sst: $.data.status } }
          assert:
            - "error_id == ERR_PRACTICE_SUSPENDED"
            - "EquipmentSale ${s}.status remains QUOTE (no transition occurred)"

      - name: claim_submit_blocked_until_order_delivered
        grounds:
          - state_machines.RebateClaim.DRAFT_to_SUBMITTED
          - validations[priority=24]
        distinguishing_aspect: |
          Entity pair RebateClaim -> Order (different pair than
          EquipmentSale -> Practice): claim submission is guarded by the source
          order's state; a merely SUBMITTED (not DELIVERED) order blocks the
          claim with ERR_ORDER_NOT_DELIVERED.
