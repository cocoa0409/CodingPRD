            - "Cohort.${coh_id}.seats_waitlisted == 0 and Cohort.${coh_id}.next_waitlist_position == 1 - the monotone counter never moved because nobody was waitlisted"

      - name: record_then_void_completion_conserves_the_contact_hour_ledger
        grounds:
          - state_machines.ModuleCompletion.RECORDED_to_PASSED
          - state_machines.ModuleCompletion.PASSED_to_VOIDED
          - entities.Trainee.fields.earned_contact_hours
          - entities.Cohort.fields.delivered_contact_hours
        distinguishing_aspect: |
          Conserved quantity #3 is a third kind - an HOURS ledger: Trainee.earned_contact_hours ==
          SUM(ModuleCompletion.credited_contact_hours over PASSED rows). Recording and then voiding the
          same completion must return it to 0.0 with passed_core_count back at 0, while
          Cohort.delivered_contact_hours - which tracks SESSIONS, not completions - must stay at 2.5
          because the session itself is still DELIVERED.
        test_recipe:
          setup:
            - "Cohort C-2026A IN_SESSION with Tara ENROLLED and not yet graduated, so no credential or roster cascade can confound the ledger"
            - "Session A for CERT-101 (2.5 contact hours) DELIVERED, giving Cohort.delivered_contact_hours 2.5"
            - "Trainee.earned_contact_hours is 0.0 before the forward action"
