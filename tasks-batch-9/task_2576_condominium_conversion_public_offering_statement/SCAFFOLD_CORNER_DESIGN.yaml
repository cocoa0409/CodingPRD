      - name: percent_funded_adequacy_threshold_is_inclusive_after_a_half_up_rounding
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.reserve_funding_requirement.constants.PERCENT_FUNDED_ADEQUATE_BP
          - calculations.reserve_funding_requirement
          - entities.ReserveStudy.fields.percent_funded_bp
          - entities.ReserveStudy.fields.funding_status
          - endpoints[POST /conversion-projects/{id}/reserve-studies]
        distinguishing_aspect: "Two independent pins on the same boundary. (1) The comparison against
          PERCENT_FUNDED_ADEQUATE_BP 7000 is INCLUSIVE, so an opening balance of exactly 70% of the
          2500000 fully funded balance - 1750000 cents - is ADEQUATE. (2) The comparison runs on the
          ALREADY-ROUNDED basis points, so an opening balance of 1749875 cents, whose exact ratio is
          6999.50 bp, rounds half up to 7000 and is ADEQUATE too, while 1749874 cents gives 6999.496 ->
          6999 and is UNDERFUNDED. Truncating instead of rounding half up, or comparing the unrounded
          ratio, flips the middle study; a strict > comparison flips the first. The opening balance never
          touches recommended_annual_contribution_cents under COMPONENT_METHOD, which stays 333334 in all
          three studies."
        test_recipe:
          setup:
            - "Project (total_unit_count 1) whose ACCEPTED ER-1 holds one VERIFIED ROOF component
              (10000000 cents, effective age 10, RUL 30, EXCELLENT) and whose suitability_gate is PASSED,
              so fully_funded_balance_cents is round_half_up(10000000 * 10 / 40) = 2500000 for every study."
