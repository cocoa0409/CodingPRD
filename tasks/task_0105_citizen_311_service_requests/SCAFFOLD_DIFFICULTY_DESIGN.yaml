scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: jurisdiction_match_smallest_box_vs_first_created
        grounds:
          - calculations.jurisdiction_match
          - entities.ServiceRequest.fields.jurisdiction_id
          - state_machines.ServiceRequest.SUBMITTED_to_TRIAGED
        distinguishing_aspect: |
          Operates on the ServiceRequest geo-routing domain: with a point inside two overlapping
          jurisdiction boxes, smallest_box selects the tighter (smaller-area) inner box while the
          rejected first_created_match would pick the earlier outer box — different jurisdiction_id.
        test_recipe:
          setup:
            - "Two overlapping jurisdictions: OUTER lat[41.80,41.95) lng[-87.70,-87.55) (area 0.0225) created first; INNER lat[41.87,41.89) lng[-87.64,-87.62) (area 0.0004) created second."
            - "A geo-requiring category; a citizen; a request at (41.880,-87.630) which lies inside BOTH boxes."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { name: "OUTER", min_lat: 41.80, max_lat: 41.95, min_lng: -87.70, max_lng: -87.55 }
              as: SystemAdmin
              captures: { outer_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { name: "INNER", min_lat: 41.87, max_lat: 41.89, min_lng: -87.64, max_lng: -87.62 }
              as: SystemAdmin
              captures: { inner_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: true }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "pothole", lat: 41.880, lng: -87.630 }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
              captures: { jur: $.data.jurisdiction_id }
          assert:
            - "ServiceRequest.${req_id}.jurisdiction_id == ${inner_id}"
            - "ServiceRequest.${req_id}.jurisdiction_id != ${outer_id}"
            - "ServiceRequest.${req_id}.status == TRIAGED"

      - name: avg_satisfaction_round_half_up_vs_truncate
        grounds:
          - calculations.avg_satisfaction
          - entities.SatisfactionSurvey.fields.score
          - state_machines.SatisfactionSurvey.SENT_to_COMPLETED
        distinguishing_aspect: |
          Operates on the Department satisfaction domain (a different entity domain than jurisdiction
          routing): three completed scores {5,5,4} average to 14/3 = 4.6667 which round_half_up pins to
          4.67, whereas the rejected truncate variant would yield 4.66.
        test_recipe:
          setup:
            - "One department; one geo-requiring category with a STANDARD SLA; three citizens each with a request routed to the department, all completed, surveys scored 5, 5, 4."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 50 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "a@x.com", full_name: "A" }
              as: Anonymous
              captures: { cit_a: $.data.id }
            - call: "POST /citizens"
              payload: { email: "b@x.com", full_name: "B" }
              as: Anonymous
              captures: { cit_b: $.data.id }
            - call: "POST /citizens"
              payload: { email: "d@x.com", full_name: "D" }
              as: Anonymous
              captures: { cit_d: $.data.id }
            - call: "POST /agents"
              payload: { department_id: "${dept_id}", full_name: "Ag" }
              as: SystemAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${cit_a}", category_id: "${cat_id}", description: "r1" }
              as: Citizen
              as_user_id: "${cit_a}"
              captures: { r_a: $.data.id }
            - call: "POST /service-requests/${r_a}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${r_a}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${r_a}" }
              as: Dispatcher
              captures: { wo_a: $.data.0.id, wo_a_v: $.data.0.version }
            - call: "POST /work-orders/${wo_a}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_a_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_a}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /work-orders/${wo_a}/complete"
              payload: { completion_note: "done" }
              as: Agent
              as_user_id: "${agent_id}"
            - call: "GET /surveys"
              payload: { request_id: "${r_a}" }
              as: Dispatcher
              captures: { surv_a: $.data.0.id }
            - call: "POST /surveys/${surv_a}/respond"
              payload: { score: 5 }
              as: Citizen
              as_user_id: "${cit_a}"
            - call: "POST /service-requests"
              payload: { citizen_id: "${cit_b}", category_id: "${cat_id}", description: "r2" }
              as: Citizen
              as_user_id: "${cit_b}"
              captures: { r_b: $.data.id }
            - call: "POST /service-requests/${r_b}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${r_b}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${r_b}" }
              as: Dispatcher
              captures: { wo_b: $.data.0.id, wo_b_v: $.data.0.version }
            - call: "POST /work-orders/${wo_b}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_b_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_b}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /work-orders/${wo_b}/complete"
              payload: { completion_note: "done" }
              as: Agent
              as_user_id: "${agent_id}"
            - call: "GET /surveys"
              payload: { request_id: "${r_b}" }
              as: Dispatcher
              captures: { surv_b: $.data.0.id }
            - call: "POST /surveys/${surv_b}/respond"
              payload: { score: 5 }
              as: Citizen
              as_user_id: "${cit_b}"
            - call: "POST /service-requests"
              payload: { citizen_id: "${cit_d}", category_id: "${cat_id}", description: "r3" }
              as: Citizen
              as_user_id: "${cit_d}"
              captures: { r_d: $.data.id }
            - call: "POST /service-requests/${r_d}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${r_d}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${r_d}" }
              as: Dispatcher
              captures: { wo_d: $.data.0.id, wo_d_v: $.data.0.version }
            - call: "POST /work-orders/${wo_d}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_d_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_d}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /work-orders/${wo_d}/complete"
              payload: { completion_note: "done" }
              as: Agent
              as_user_id: "${agent_id}"
            - call: "GET /surveys"
              payload: { request_id: "${r_d}" }
              as: Dispatcher
              captures: { surv_d: $.data.0.id }
            - call: "POST /surveys/${surv_d}/respond"
              payload: { score: 4 }
              as: Citizen
              as_user_id: "${cit_d}"
          trigger:
            - call: "GET /departments/${dept_id}/satisfaction"
              payload: {}
              as: Dispatcher
              captures: { avg: $.data.avg_score }
          assert:
            - "response.data.avg_score == 4.67"
            - "response.data.completed_count == 3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sla_breach_sweep_tiered_branch_mode_a
        grounds:
          - calculations.sla_breach_sweep
          - entities.ServiceRequest.fields.sla_breached
          - entities.Escalation.fields.tier
        distinguishing_aspect: |
          Mode (a): a non-linear formula with >=3 inputs (now, sla_deadline_at, tier1_hours,
          tier2_hours, existing-escalation state) whose conditional branch selects TIER2 vs TIER1
          vs none — overdue 6h with tier1=2/tier2=6 selects TIER2, not TIER1.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T08:00:00Z; STANDARD SLA 24h, tier1=2h, tier2=6h; one request routed at 08:00 (deadline 2026-06-02T08:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /_clock/advance"
              payload: { hours: 30 }
              as: SystemAdmin
              captures: { created: $.data.escalations_created }
            - call: "GET /service-requests/${req_id}/escalations"
              payload: {}
              as: Dispatcher
              captures: { esc_tier: $.data.0.tier }
          assert:
            - "ServiceRequest.${req_id}.sla_breached == true"
            - "exactly one Escalation on ${req_id} with tier == TIER2"
            - "no Escalation on ${req_id} has tier == TIER1"

      - name: priority_drives_sla_deadline_eval_order_mode_c
        grounds:
          - calculations.sla_deadline
          - state_machines.ServiceRequest.SUBMITTED_to_TRIAGED
          - state_machines.ServiceRequest.TRIAGED_to_ROUTED
        distinguishing_aspect: |
          Mode (c): the SLA deadline is keyed on request.priority, but priority is only well-defined
          after triage resolves requested_priority-else-default; the scaffold pins triage-before-route
          so a HIGH override applied at triage selects the HIGH SlaPolicy (4h) deadline, not STANDARD (24h).
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; category default STANDARD; two SLA policies for the category: STANDARD 24h and HIGH 4h; a request triaged with requested_priority HIGH then routed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "HIGH", resolution_sla_hours: 4, escalation_tier1_hours: 1, escalation_tier2_hours: 2 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: { requested_priority: "HIGH" }
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
              captures: { ddl: $.data.sla_deadline_at, prio: $.data.priority }
          assert:
            - "ServiceRequest.${req_id}.priority == HIGH"
            - "ServiceRequest.${req_id}.routed_at == 2026-06-01T08:00:00.000Z"
            - "ServiceRequest.${req_id}.sla_deadline_at == 2026-06-01T12:00:00.000Z"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: workorder_cyclic_reopen_loop
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_IN_PROGRESS
          - entities.ServiceRequest.fields.reopen_count
        distinguishing_aspect: |
          Cycle on the WorkOrder entity: COMPLETED -> REOPENED -> IN_PROGRESS returns the work order
          to an active state, distinct from a linear pipeline; after a reopen the WorkOrder is
          IN_PROGRESS again and the request reopen_count is 1.
        test_recipe:
          setup:
            - "A request routed, assigned, started, completed (request RESOLVED, WorkOrder COMPLETED), still inside the 72h reopen window; the owning citizen reopens it."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /agents"
              payload: { department_id: "${dept_id}", full_name: "Ag" }
              as: SystemAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${req_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.0.id, wo_v: $.data.0.version }
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completion_note: "fixed" }
              as: Agent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /service-requests/${req_id}/reopen"
              payload: {}
              as: Citizen
              as_user_id: "${citizen_id}"
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Dispatcher
              captures: { wo_status: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == IN_PROGRESS"
            - "ServiceRequest.${req_id}.reopen_count == 1"
            - "ServiceRequest.${req_id}.status == IN_PROGRESS"

      - name: service_request_branching_submitted_fork
        grounds:
          - state_machines.ServiceRequest.SUBMITTED_to_TRIAGED
          - state_machines.ServiceRequest.SUBMITTED_to_DUPLICATE
          - entities.ServiceRequest.fields.cluster_id
        distinguishing_aspect: |
          Branching fork on the ServiceRequest entity (different entity than the WorkOrder cycle):
          from SUBMITTED a request goes EITHER to TRIAGED (triage path) OR to DUPLICATE (cluster-attach
          path) with divergent side-effect sets; this instance exercises the DUPLICATE branch.
        test_recipe:
          setup:
            - "A canonical request resolved so a cluster can exist; a second SUBMITTED request of the same category within 150m of the canonical; cluster created on the canonical."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: true }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "canonical", lat: 41.8800, lng: -87.6300 }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { canon_id: $.data.id, canon_v: $.data.version }
            - call: "POST /duplicate-clusters"
              payload: { category_id: "${cat_id}", canonical_request_id: "${canon_id}", expected_canonical_version: "${canon_v}" }
              as: Dispatcher
              captures: { cluster_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "dup", lat: 41.8810, lng: -87.6300 }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { dup_id: $.data.id }
          trigger:
            - call: "POST /duplicate-clusters/${cluster_id}/members"
              payload: { request_id: "${dup_id}" }
              as: Dispatcher
              captures: { dup_status: $.data.status, dup_cluster: $.data.cluster_id }
          assert:
            - "ServiceRequest.${dup_id}.status == DUPLICATE"
            - "ServiceRequest.${dup_id}.cluster_id == ${cluster_id}"
            - "DuplicateCluster.${cluster_id}.member_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_cascade_request_resolved_survey_and_escalation
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.ServiceRequest.IN_PROGRESS_to_RESOLVED
          - state_machines.SatisfactionSurvey.SENT_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /work-orders/{id}/complete: completing the WorkOrder (A)
          mutates the request to RESOLVED (B); the request reaching RESOLVED (B) itself synthesizes a
          SENT SatisfactionSurvey AND resolves the request's OPEN escalation (C). Each link is caused
          by the previous link.
        test_recipe:
          setup:
            - "A request routed, assigned, started; an SLA breach has fired one OPEN escalation on it; agent then completes the work order."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
