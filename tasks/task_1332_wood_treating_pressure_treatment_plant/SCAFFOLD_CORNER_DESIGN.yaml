        claim_type: cascading_side_effects
        grounds:
          - state_machines.TreatmentPlant.SUSPENDED_to_REVOKED
        distinguishing_aspect: "Plant revoke cascades: all cylinders → DECOMMISSIONED, all non-terminal charges → SCRAPPED."
        test_recipe:
          setup:
            - "Plant P with 2 cylinders, 2 charges (one IN_CYLINDER, one CYCLE_COMPLETE)"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
