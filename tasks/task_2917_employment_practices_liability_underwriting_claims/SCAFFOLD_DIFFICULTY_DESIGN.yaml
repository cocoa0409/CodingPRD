            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Ashford & Vance LLP", tier: "NATIONAL", jurisdiction_codes: ["CA", "TX"], partner_rate_cents_per_hour: 92000, associate_rate_cents_per_hour: 51000, paralegal_rate_cents_per_hour: 18000, capacity_open_matters: 3 }
              as: PlatformAdmin
