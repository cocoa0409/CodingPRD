            - { call: "POST /api/bottles/${b}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b}/deliver", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b}/return", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_B", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: SanitationLead, captures: { batch: $.data.id } }
