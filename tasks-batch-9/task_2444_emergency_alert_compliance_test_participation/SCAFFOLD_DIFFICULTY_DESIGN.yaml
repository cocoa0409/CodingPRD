            - call: "POST /equipment-outages/${outage_id}/restore"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "GET /eas-devices/${dev1}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "before the cycle: status == RESTORED with continuous_downtime_hours 84.00, obligation_downtime_hours 48.00, restored_at 2026-08-06T20:00:00Z, repair_cycle_count 0"
            - "fail-verification -> status == VERIFICATION_FAILED with restored_at == null, continuous_downtime_hours == null, obligation_downtime_hours == null, continuous_clock_breached == false, obligation_breached == false"
            - "the second start-repair -> status == REPAIR_IN_PROGRESS and repair_cycle_count == 1 (the first start-repair, entered from OPEN, did not increment it)"
            - "the second restore recomputes from detected_at 2026-08-03T08:00:00Z: continuous_downtime_hours == 120.00 ((2026-08-08T08:00Z - 2026-08-03T08:00Z) = 432000 s / 3600)"
            - "continuous_clock_breached == true (120.00 > 60)"
            - "obligation_downtime_hours == 60.00 (12.00 h on each of 08-03..08-07 = 60.00; on 08-08 the restore at 08:00 leaves zero overlap with [08:00Z, 20:00Z))"
            - "obligation_breached == true (60.00 > 48), so this second pass breaches BOTH clocks where the first pass breached only one"
            - "GET /eas-devices/${dev1} shows status == FAILED throughout — only POST /equipment-outages/{id}/close returns the device to READY, so restore alone is not a device-level transition"

      - name: test_event_reverts_ready_to_readiness_pending_and_back_to_ready
        grounds:
          - "§1.2 state_machines.TestEvent READY -> READINESS_PENDING (station posture cascade hop 4) and {SCHEDULED, READINESS_PENDING} -> READY"
          - "§1.2 state_machines.Station: any posture transition INTO SUSPENDED_FILINGS fires hop 4 clearing readiness_score on the station's READY TestEvents"
          - "§1.5 POST /equipment-outages hop 1-4 and POST /equipment-outages/{id}/close side effects"
          - "§1.3 calculations.test_event_readiness_score with READINESS_PASS_MIN 80.00"
        distinguishing_aspect: "TestEvent is not forward-only: the same event visits READY, is knocked back to READINESS_PENDING by a cascade it never triggered itself (readiness_score cleared to null), and then re-enters READY with a freshly computed 80.00 — a linear implementation cannot reproduce the READY -> READINESS_PENDING back-edge nor the null readiness_score in between."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP and NWS; station KWEA; single device dev1 READY carrying BOTH required assignments, so one device failure wipes all source coverage."
            - "Station starts at accessible_source_count 2, compliance_score 100.00, COMPLIANT."
            - "TestEvent te1 WEEKLY [2026-08-12T00:00:00Z, 2026-08-12T01:00:00Z); clock 2026-08-12T00:30:00Z; evaluate-readiness gives 40 (1/1 ready devices) + 40 (2/2 source coverage) + 0 (no recent alerts) = 80.00 -> READY."
            - "The whole cascade-and-recovery sequence stays inside the logging window so evaluate-readiness remains admissible at the end (now <= window_end_at)."
