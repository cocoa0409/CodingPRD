            - "Property is EN and OWNER_OCCUPIED, so oral_confirmation_required is false and rule 23 can never fire."
            - "Certificate raised, signed and VERIFIED at 2026-08-14 and the Disbursement of 3000000 sits REQUESTED, inside the rescission window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
