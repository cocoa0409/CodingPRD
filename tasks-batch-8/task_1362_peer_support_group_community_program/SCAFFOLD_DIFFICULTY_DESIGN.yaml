            - call: "POST /training-courses"
              payload: { code: "T", title: "T", credit_hours: 4, level_weight: 2 }
              as: ProgramAdmin
              captures: { tc: $.data.id }
            - call: "POST /facilitators/${fid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${tc}", completed_at: "2026-07-01T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "R", email: "r@x.com" }
              as: ProgramAdmin
              captures: { rev: $.data.id }
            - call: "POST /facilitators/${rev}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /training-courses"
              payload: { code: "TX", title: "TX", credit_hours: 6, level_weight: 3 }
              as: ProgramAdmin
              captures: { tcx: $.data.id }
            - call: "POST /facilitators/${rev}/training-completions"
              payload: { course_id: "${tc}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/training-completions"
              payload: { course_id: "${tcx}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/certify"
              payload: {}
              as: ProgramAdmin
