          POLICY_B is min(receipts, allowance) — the LOCAL/REGIONAL/NATIONAL/INTERNATIONAL rate
          table and the travel-class multiplier are not consulted at all. With 3 NATIONAL days at
          PREMIUM the POLICY_A branch would allow 337500 and pay 200000; POLICY_B pays 70000.
