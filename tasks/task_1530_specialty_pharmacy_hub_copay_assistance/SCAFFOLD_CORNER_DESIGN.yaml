  - name: clock_default_window_boundary_checks
    claim_type: scheduled_actions
    grounds:
    - endpoints
    - errors[ERR_AE_REPORT_WINDOW_MISSED]
    - validations[priority=5]
    distinguishing_aspect: 'With NO set_current_utc call the logical clock reads exactly the declared default 2026-08-01T00:00:00Z: awareness 23.5h back is reportable, 25h back is ERR_AE_REPORT_WINDOW_MISSED
      — deterministic and wall-clock independent.'
    test_recipe:
      setup:
      - fresh server state; no clock set (default 2026-08-01T00:00:00Z in force); enrollment INTAKE
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgCk
