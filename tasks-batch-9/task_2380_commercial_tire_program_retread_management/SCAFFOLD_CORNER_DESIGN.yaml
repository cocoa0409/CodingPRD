        distinguishing_aspect: "The exclusion rule is symmetric across numerator and denominator: an asset with a survey but zero miles run, and an asset still IN_INVENTORY, must not contribute their cost basis to the group. Only the one asset with real wear is priced, and excluded_asset_count reports the surveyed-but-unusable one."
        test_recipe:
          setup:
            - "a DRIVE policy with pull_point_32nds 6, one TRACTOR unit"
            - "asset A mounted at odometer 500000 tread 24, surveyed at odometer 560000 tread 15 (60000 miles, 9/32nds consumed)"
            - "asset B mounted at TRAILER position on the same unit at odometer 500000 tread 24, surveyed at the SAME odometer 500000 with tread 20 (zero miles run)"
            - "asset C created but never mounted, so it is still IN_INVENTORY"
