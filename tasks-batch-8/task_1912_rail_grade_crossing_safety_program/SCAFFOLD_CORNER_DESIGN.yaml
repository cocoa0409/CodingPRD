  - section: endpoints
    instances:
      - name: preemption_timing_boundary_pass_and_fail
        claim_type: conditional_action
        grounds: [calculations.preemption_timing_check, "errors[ERR_PREEMPTION_TIMING_INADEQUATE]", "errors[ERR_ACTIVE_INTERCONNECTION_EXISTS]"]
        distinguishing_aspect: "Timing check at exact equality passes (green 5 >= required 5, advance 0 >= required 0, approach 26 >= 20); green one second below fails and the entity stays DRAFT; a second interconnection on the same crossing is rejected."
        test_recipe:
          setup: ["Locality; ACTIVE crossings X and Y"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Preempt City", state_code: "KS", contact_email: "pw@pre.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-050001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_x: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-050002", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_y: $.data.id }
          trigger:
            - call: "POST /preemption-interconnections"
              payload: { crossing_id: "${cx_x}", traffic_signal_ref: "SIG-100", track_approach_distance_ft: 1500, design_train_speed_mph: 40, clear_storage_distance_ft: 75, advance_preemption_seconds: 0, track_clearance_green_seconds: 5 }
              as: ProgramAdministrator
              captures: { ic_a: $.data.id, ic_a_approach: $.data.approach_seconds, ic_a_green: $.data.required_clearance_green_seconds, ic_a_adv: $.data.required_advance_preemption_seconds }
            - call: "POST /preemption-interconnections/${ic_a}/transition"
              payload: { to_status: "TIMING_VERIFIED" }
              as: RailSafetyOfficer
              captures: { ic_a_status: $.data.status, ic_a_pass: $.data.timing_check_pass }
            - call: "POST /preemption-interconnections"
              payload: { crossing_id: "${cx_y}", traffic_signal_ref: "SIG-200", track_approach_distance_ft: 1500, design_train_speed_mph: 40, clear_storage_distance_ft: 75, advance_preemption_seconds: 0, track_clearance_green_seconds: 4 }
              as: ProgramAdministrator
              captures: { ic_b: $.data.id }
            - call: "POST /preemption-interconnections/${ic_b}/transition"
              payload: { to_status: "TIMING_VERIFIED" }
              as: RailSafetyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /preemption-interconnections"
              payload: { crossing_id: "${cx_x}", traffic_signal_ref: "SIG-101", track_approach_distance_ft: 1500, design_train_speed_mph: 40, clear_storage_distance_ft: 75, advance_preemption_seconds: 0, track_clearance_green_seconds: 5 }
              as: ProgramAdministrator
              captures: { err2: $.data.error_id }
          assert:
            - "computed: approach_seconds == 26, required_clearance_green_seconds == 5, required_advance_preemption_seconds == 0"
            - "A: TIMING_VERIFIED with timing_check_pass == true (all three >= comparisons at equality pass)"
            - "B (green 4 < required 5): error_id == ERR_PREEMPTION_TIMING_INADEQUATE (422), B stays DRAFT"
            - "second interconnection on crossing X: error_id == ERR_ACTIVE_INTERCONNECTION_EXISTS (409)"

      - name: preemption_commission_requires_gates
        claim_type: conditional_action
        grounds: [state_machines.PreemptionInterconnection.TIMING_VERIFIED_to_COMMISSIONED, "errors[ERR_PREEMPTION_REQUIRES_GATES]"]
        distinguishing_aspect: "Commission is gated on the crossing's device class: FLASHING_LIGHTS rejects; after an inventory patch to GATES (OCC), the same commission succeeds."
        test_recipe:
          setup: ["Locality; ACTIVE crossing with FLASHING_LIGHTS; TIMING_VERIFIED interconnection"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Gates City", state_code: "KS", contact_email: "pw@gates.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-050011", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "FLASHING_LIGHTS" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id, cx_v: $.data.version }
            - call: "POST /preemption-interconnections"
              payload: { crossing_id: "${cx_id}", traffic_signal_ref: "SIG-300", track_approach_distance_ft: 1500, design_train_speed_mph: 40, clear_storage_distance_ft: 75, advance_preemption_seconds: 0, track_clearance_green_seconds: 5 }
              as: ProgramAdministrator
              captures: { ic: $.data.id }
            - call: "POST /preemption-interconnections/${ic}/transition"
              payload: { to_status: "TIMING_VERIFIED" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /preemption-interconnections/${ic}/transition"
              payload: { to_status: "COMMISSIONED" }
              as: RailSafetyOfficer
              captures: { err: $.data.error_id }
            - call: "PATCH /crossings/${cx_id}/inventory"
              payload: { expected_crossing_version: "${cx_v}", warning_device_class: "GATES" }
              as: ProgramAdministrator
            - call: "POST /preemption-interconnections/${ic}/transition"
              payload: { to_status: "COMMISSIONED" }
              as: RailSafetyOfficer
              captures: { st: $.data.status }
          assert:
            - "commission with FLASHING_LIGHTS: error_id == ERR_PREEMPTION_REQUIRES_GATES (http 409)"
            - "after PATCH to GATES: commission succeeds (status == COMMISSIONED)"
            - "device-factor recompute on PATCH: hazard_score was 6.60 with FLASHING_LIGHTS ((5.00*1.10)*1.20) and becomes 5.50 with GATES ((5.00*1.10)*1.00)"

