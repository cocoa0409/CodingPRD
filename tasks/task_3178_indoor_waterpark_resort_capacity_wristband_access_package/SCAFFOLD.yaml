    code: 201
    input: [amount_cents]
    output: ArcadeCreditGrant
    side_effects:
      - "grant_status=SUCCEEDED when room_charge_enabled=true and the amount fits arcade_credit_remaining_cents"
      - "Rejects with ERR_ROOM_CHARGE_DISABLED when room_charge_enabled=false"
      - "Rejects with ERR_ARCADE_LIMIT_EXCEEDED when the amount exceeds arcade_credit_remaining_cents"
      - "Recomputes Wristband.arcade_credit_spent_cents and arcade_credit_remaining_cents"

