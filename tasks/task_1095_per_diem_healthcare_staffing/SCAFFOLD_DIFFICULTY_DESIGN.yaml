scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_final_shift_pay_diverges_on_punch_drift
        grounds:
          - calculations.shift_pay_amount
          - calculations.worked_hours_normalization
          - calculations.differential_hours
          - entities.Shift.fields.estimated_pay_cents
          - entities.Assignment.fields.estimated_pay_cents
          - entities.Assignment.fields.final_pay_cents
          - entities.Timesheet.fields.gross_pay_cents
          - state_machines.Timesheet.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          This dual-variant instance lives in the MONEY/pay-accounting domain (Shift ->
          Assignment -> Timesheet): the ESTIMATED variant is computed from the scheduled
          interval with overtime forced to zero, the FINAL variant from the actual punches
          with weekly overtime and actual-interval differentials, so 86250 != 90225 for the
          same shift.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Facility 'Mercy General' / unit ICU, unit_capacity 2, requires only RN_LICENSE."
            - "RateCard RN at 7500 cents/hour effective from 2026-01-01."
            - "Clinician Ana Reyes with a VERIFIED RN_LICENSE expiring 2027-01-01."
            - "StaffingOrder STANDARD, headcount 1, window 2026-06-08..2026-06-15."
            - "Shift scheduled 2026-06-10T07:00Z..19:00Z; Ana claimed it, was awarded, and confirmed."
            - "Clock advanced to 2026-06-10T19:45Z and Ana submitted punches 07:00..19:30 with 30 break minutes."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Mercy General", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-1001", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 1, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-10T07:00:00Z", scheduled_end: "2026-06-10T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_id: $.data.id, sh_est: $.data.estimated_pay_cents }
            - call: "POST /staffing/shifts/${sh_id}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm_id: $.data.id }
            - call: "GET /staffing/shifts/${sh_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_v: $.data.version }
            - call: "POST /staffing/shifts/${sh_id}/award"
              payload: { expected_shift_version: "${sh_v}", claim_id: "${clm_id}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg_id: $.data.id, asg_est: $.data.estimated_pay_cents }
            - call: "POST /staffing/assignments/${asg_id}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${cl_id}"
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T19:45:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/assignments/${asg_id}/timesheets"
              payload: { clock_in: "2026-06-10T07:00:00Z", clock_out: "2026-06-10T19:30:00Z", break_minutes: 30 }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { ts_id: $.data.id }
          trigger:
            - call: "POST /staffing/timesheets/${ts_id}/verify"
              payload: {}
              as: FacilityVerifier
              as_user_id: "${fac_id}"
              captures: { ts_gross: $.data.gross_pay_cents }
          assert:
            - "Shift.${sh_id}.estimated_pay_cents == 86250"
            - "Assignment.${asg_id}.estimated_pay_cents == 86250"
            - "Timesheet.${ts_id}.raw_minutes == 750"
            - "Timesheet.${ts_id}.unpaid_break_minutes == 30"
            - "Timesheet.${ts_id}.worked_hours == 12.00"
            - "Timesheet.${ts_id}.night_hours == 0.50"
            - "Timesheet.${ts_id}.weekend_hours == 0.00"
            - "Timesheet.${ts_id}.overtime_hours == 0.00"
            - "Timesheet.${ts_id}.gross_pay_cents == 90225"
            - "Assignment.${asg_id}.final_pay_cents == 90225"
            - "Assignment.${asg_id}.final_pay_cents - Assignment.${asg_id}.estimated_pay_cents == 3975"

      - name: provisional_vs_adjudicated_reliability_diverges_on_pending_no_show
        grounds:
          - calculations.reliability_score
          - entities.Clinician.fields.reliability_score
          - entities.Clinician.fields.provisional_reliability_score
          - entities.ReliabilityEvent.fields.adjudication_status
          - state_machines.Assignment.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: |
          This dual-variant instance lives in the RISK/behaviour-scoring domain on Clinician,
          not in pay accounting: immediately after a no-show the ADJUDICATED variant still
          reads 100 (the penalty event is only PENDING) while the PROVISIONAL variant already
          reads 70, so the same event set yields two different scores on the same row.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Ben Ortiz with a VERIFIED RN_LICENSE; reliability 100/100 and status ACTIVE."
            - "Shift 2026-06-08T07:00Z..19:00Z claimed, awarded and confirmed by Ben."
            - "Clock advanced to 2026-06-08T08:00Z, i.e. one hour after the shift started."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Saint Ives", unit_name: "MedSurg", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Ben Ortiz", email: "ben.ortiz@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-2002", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 1, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_id: $.data.id }
            - call: "POST /staffing/shifts/${sh_id}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm_id: $.data.id }
            - call: "GET /staffing/shifts/${sh_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_v: $.data.version }
            - call: "POST /staffing/shifts/${sh_id}/award"
              payload: { expected_shift_version: "${sh_v}", claim_id: "${clm_id}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /staffing/assignments/${asg_id}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${cl_id}"
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /staffing/assignments/${asg_id}/no-show"
              payload: { note: "did not arrive on unit" }
              as: FacilityVerifier
              as_user_id: "${fac_id}"
              captures: { asg_work: $.data.work_status }
          assert:
            - "Assignment.${asg_id}.work_status == NO_SHOW"
            - "Assignment.${asg_id}.pay_status == WAIVED"
            - "Shift.${sh_id}.status == OPEN"
            - "GET /staffing/clinicians/${cl_id}/reliability-events returns exactly 1 event with event_type == NO_SHOW, penalty_points == 30, credit_points == 0, adjudication_status == PENDING"
            - "Clinician.${cl_id}.reliability_score == 100"
            - "Clinician.${cl_id}.provisional_reliability_score == 70"
            - "Clinician.${cl_id}.status == ACTIVE"
            - "Clinician.${cl_id}.no_show_count == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: crisis_night_weekend_stacked_pay_mode_a
        grounds:
          - calculations.shift_pay_amount
          - calculations.differential_hours
          - calculations.rate_card_selection
          - entities.Shift.fields.effective_rate_cents_per_hour
          - entities.StaffingOrder.fields.urgency
          - entities.Timesheet.fields.night_hours
          - entities.Timesheet.fields.weekend_hours
        distinguishing_aspect: |
          MODE (a): a five-input non-linear formula — worked_hours, the CRISIS-conditional
          effective rate (rounded once, before any hour multiplication), overlapping night and
          weekend differential windows that both pay on the same minute, and a min/max overtime
          split — producing 107813 + 5400 + 3600 = 116813 cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Harbor Point requiring RN_LICENSE; RN rate card 7500 cents/hour."
            - "Clinician Cira Nunez with a VERIFIED RN_LICENSE."
            - "StaffingOrder with urgency CRISIS, headcount 1, window 2026-06-13..2026-06-15."
            - "Shift Saturday 2026-06-13T19:00Z .. Sunday 2026-06-14T07:00Z, claimed, awarded, confirmed."
            - "Clock advanced to 2026-06-14T08:00Z and the clinician punched exactly the scheduled interval with 30 break minutes."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Harbor Point", unit_name: "ED", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Cira Nunez", email: "cira.nunez@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-3003", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 1, urgency: "CRISIS", window_start: "2026-06-13T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-13T19:00:00Z", scheduled_end: "2026-06-14T07:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_id: $.data.id, sh_rate: $.data.effective_rate_cents_per_hour }
            - call: "POST /staffing/shifts/${sh_id}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm_id: $.data.id }
            - call: "GET /staffing/shifts/${sh_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_v: $.data.version }
            - call: "POST /staffing/shifts/${sh_id}/award"
              payload: { expected_shift_version: "${sh_v}", claim_id: "${clm_id}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /staffing/assignments/${asg_id}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${cl_id}"
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/assignments/${asg_id}/timesheets"
              payload: { clock_in: "2026-06-13T19:00:00Z", clock_out: "2026-06-14T07:00:00Z", break_minutes: 30 }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { ts_id: $.data.id }
          trigger:
            - call: "POST /staffing/timesheets/${ts_id}/verify"
              payload: {}
              as: FacilityVerifier
              as_user_id: "${fac_id}"
              captures: { ts_gross: $.data.gross_pay_cents }
          assert:
            - "Shift.${sh_id}.base_pay_rate_cents_per_hour == 7500"
            - "Shift.${sh_id}.effective_rate_cents_per_hour == 9375"
            - "Shift.${sh_id}.estimated_pay_cents == 116813"
            - "Timesheet.${ts_id}.worked_hours == 11.50"
            - "Timesheet.${ts_id}.night_hours == 12.00"
            - "Timesheet.${ts_id}.weekend_hours == 12.00"
            - "Timesheet.${ts_id}.overtime_hours == 0.00"
            - "Timesheet.${ts_id}.regular_hours == 11.50"
            - "Timesheet.${ts_id}.gross_pay_cents == 116813"
            - "the three rounded components are 107813 (regular) + 0 (overtime) + 9000 (differentials: 5400 night + 3600 weekend)"

      - name: invoice_round_per_line_then_sum_mode_b
        grounds:
          - calculations.invoice_totals
          - calculations.facility_markup_tier
          - entities.Invoice.fields.bill_total_cents
          - entities.Invoice.fields.lines
          - entities.Invoice.fields.markup_multiplier
          - state_machines.Timesheet.VERIFIED_to_INVOICED
        distinguishing_aspect: |
          MODE (b): nested rounding where the ORDER changes the answer — rounding each of the
          two lines to whole cents first and then summing gives bill_total_cents == 206626,
          whereas summing the exact products and rounding once gives 206625; the scaffold pins
          round-per-line-then-sum, so 206626 is the only correct value.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Lakeview requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Dara Volk with a VERIFIED RN_LICENSE."
            - "StaffingOrder STANDARD, headcount 2, window 2026-06-08..2026-06-15."
            - "Shift A Monday 2026-06-08T07:00Z..19:00Z and Shift B Tuesday 2026-06-09T07:00Z..15:00Z, both claimed, awarded and confirmed by Dara."
            - "Clock advanced to 2026-06-09T16:00Z; both timesheets punched exactly to schedule with 30 break minutes and both VERIFIED, giving gross pays of 86250 and 56250 and Facility.pending_pay_cents == 142500."
            - "Facility.lifetime_billed_cents is still 0, so the markup tier is TIER_1 (1.45)."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Lakeview", unit_name: "Telemetry", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Dara Volk", email: "dara.volk@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-4004", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_a_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-09T07:00:00Z", scheduled_end: "2026-06-09T15:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_b_id: $.data.id }
            - call: "POST /staffing/shifts/${sh_a_id}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm_a_id: $.data.id }
            - call: "GET /staffing/shifts/${sh_a_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_a_v: $.data.version }
            - call: "POST /staffing/shifts/${sh_a_id}/award"
              payload: { expected_shift_version: "${sh_a_v}", claim_id: "${clm_a_id}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg_a_id: $.data.id }
            - call: "POST /staffing/assignments/${asg_a_id}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${cl_id}"
            - call: "POST /staffing/shifts/${sh_b_id}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm_b_id: $.data.id }
            - call: "GET /staffing/shifts/${sh_b_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_b_v: $.data.version }
            - call: "POST /staffing/shifts/${sh_b_id}/award"
              payload: { expected_shift_version: "${sh_b_v}", claim_id: "${clm_b_id}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg_b_id: $.data.id }
            - call: "POST /staffing/assignments/${asg_b_id}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${cl_id}"
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/assignments/${asg_a_id}/timesheets"
              payload: { clock_in: "2026-06-08T07:00:00Z", clock_out: "2026-06-08T19:00:00Z", break_minutes: 30 }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { ts_a_id: $.data.id }
            - call: "POST /staffing/assignments/${asg_b_id}/timesheets"
              payload: { clock_in: "2026-06-09T07:00:00Z", clock_out: "2026-06-09T15:00:00Z", break_minutes: 30 }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { ts_b_id: $.data.id }
            - call: "POST /staffing/timesheets/${ts_a_id}/verify"
              payload: {}
              as: FacilityVerifier
              as_user_id: "${fac_id}"
            - call: "POST /staffing/timesheets/${ts_b_id}/verify"
              payload: {}
              as: FacilityVerifier
              as_user_id: "${fac_id}"
            - call: "GET /staffing/facilities/${fac_id}"
              as: BillingAgent
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /staffing/invoices"
              payload: { facility_id: "${fac_id}", period_start: "2026-06-08T00:00:00Z", period_end: "2026-06-15T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: BillingAgent
              captures: { inv_id: $.data.id, inv_bill: $.data.bill_total_cents }
          assert:
            - "Timesheet.${ts_a_id}.gross_pay_cents == 86250"
            - "Timesheet.${ts_b_id}.gross_pay_cents == 56250"
            - "Invoice.${inv_id}.markup_tier == TIER_1"
            - "Invoice.${inv_id}.markup_multiplier == 1.45"
            - "Invoice.${inv_id}.line_count == 2"
            - "Invoice.${inv_id}.lines[0].pay_cents == 86250 and Invoice.${inv_id}.lines[0].bill_cents == 125063"
            - "Invoice.${inv_id}.lines[1].pay_cents == 56250 and Invoice.${inv_id}.lines[1].bill_cents == 81563"
