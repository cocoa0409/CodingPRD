              as_user_id: "${u_cert}"
            - call: "GET /erate/applicants/${app}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { cap2: $.data.c2_cap_cents, com2: $.data.c2_committed_cents, av2: $.data.c2_available_cents }
          assert:
            - "cap0 == 16700000 and com0 == 0 and av0 == 16700000 (cap == committed + available)"
            - "cap1 == 16700000 and com1 == 4000000 and av1 == 12700000 (forward commit conserves the pool)"
            - "cap2 == 16700000 and com2 == 0 and av2 == 16700000 (compensating termination restores the pool exactly)"
