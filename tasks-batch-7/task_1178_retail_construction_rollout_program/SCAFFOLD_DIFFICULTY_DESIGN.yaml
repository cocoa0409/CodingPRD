  # ---------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: site_submit_design_requires_approved_drawing_set
        grounds:
          - state_machines.Site.DESIGN_to_PERMITTING
          - state_machines.DrawingSet.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Pair (Site, DrawingSet): Site DESIGN -> PERMITTING is gated on a
          DrawingSet in APPROVED for the site's municipality; with the set merely
          SUBMITTED the transition fails with ERR_DRAWING_NOT_APPROVED and
          succeeds only after the drawing approval transition executes.
        test_recipe:
          setup:
            - "Site in DESIGN; jurisdiction drawing set exists in SUBMITTED (not APPROVED)"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/advance-design", payload: {}, as: DesignManager }
          trigger:
            - call: "POST /rollout/sites/${site}/submit-design"
              payload: {}
              as: DesignManager
              captures: { err: $.data.error_id }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
            - call: "POST /rollout/sites/${site}/submit-design"
              payload: {}
              as: DesignManager
              captures: { st: $.data.status }
          assert:
            - "first submit-design fails with error_id == ERR_DRAWING_NOT_APPROVED"
            - "Site.${site}.status == DESIGN after the rejection"
            - "after drawing approval, submit-design succeeds and Site.${site}.status == PERMITTING"

