      - name: closure_plan_list_is_ordered_newest_first
        claim_type: standard_crud
        grounds:
          - endpoints[GET /correspondent-banking/closure-plans]
        distinguishing_aspect: "ClosurePlan listing is the documented exception to the created_at ASC default: it is ordered created_at DESC, so the plan opened second must come first. Two plans on two different respondents are used because one respondent may only hold one live plan."
        test_recipe:
          setup: ["Two DD_IN_PROGRESS respondents, each with one DRAFT closure plan; the plan on the second respondent is created last."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
