              payload: { to_iso8601: "2026-11-01T00:00:00Z" }  # far past waiver TTL
              as: TrackOps
            - call: "POST /tracks/${tid_x2}/track-days/${tdid_x2}/run_ops"
              payload: {}
              as: TrackOps
          assert:
            - "Driver.waiver_status transitions SIGNED → EXPIRED on run_ops"
            - "Driver.cleared_to_run becomes false"

      - name: cascading_side_effects_trackday_cancel_cascades_all
        claim_type: cascade_end_to_end
        grounds:
          - state_machines.TrackDay.OPEN_to_CANCELLED
          - state_machines.Booking.APPROVED_to_CANCELLED

        distinguishing_aspect: "Cancelling a TrackDay releases garage/paddock assignments and cancels all APPROVED bookings atomically."
        test_recipe:
          setup: ["TrackDay with 1 APPROVED booking having a garage assignment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "X3", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_x3: $.data.id }
            - call: "POST /tracks/${tid_x3}/track-days"
              payload: { date: "2026-10-07" }
              as: TrackOps
              captures: { tdid_x3: $.data.id }
            - call: "POST /tracks/${tid_x3}/track-days/${tdid_x3}/open"
              payload: {}
              as: TrackOps
              captures: { td_x3_v: $.data.version }
            - call: "POST /tracks/${tid_x3}/track-days/${tdid_x3}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_x3: $.data.id, rb_x3_v: $.data.version }
            - call: "POST /tracks/${tid_x3}/track-days/${tdid_x3}/rental-blocks/${rbid_x3}/bookings"
              payload: { organizer_user_id: "oX3", group_name: "G", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "P" }
              as: Organizer
              as_user_id: oX3
              captures: { bid_x3: $.data.id }
            - call: "POST /tracks/${tid_x3}/track-days/${tdid_x3}/rental-blocks/${rbid_x3}/bookings/${bid_x3}/approve"
              payload: { expected_rental_block_version: "${rb_x3_v}" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid_x3}", outcome: "AUTHORIZE" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid_x3}", outcome: "CAPTURE" }
              as: TrackOps
            - call: "POST /tracks/${tid_x3}/track-days/${tdid_x3}/garage-assignments"
              payload: { booking_id: "${bid_x3}", bay_number: 1, power_hookups: 1, water_hookup: false, expected_track_day_version: "${td_x3_v}" }
              as: TrackOps
              captures: { gid_x3: $.data.id }
          trigger:
            - call: "POST /tracks/${tid_x3}/track-days/${tdid_x3}/cancel"
              payload: { reason: "WEATHER" }
              as: TrackOps
          assert:
            - "Booking.approval_status == CANCELLED"
            - "GarageAssignment.${gid_x3}.status == RELEASED"
            - "Booking.payment_status == REFUNDED"

      - name: ops_run_checkpoint_increments_ops_run_index
        claim_type: ops_run_checkpoint
        grounds:
          - entities.TrackDay.fields.ops_run_index
          - endpoints."POST .../run_ops"

        distinguishing_aspect: "Each run_ops call increments ops_run_index by 1 (epoch advances deterministically)."
        test_recipe:
          setup: ["TrackDay OPEN"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "X4", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_x4: $.data.id }
            - call: "POST /tracks/${tid_x4}/track-days"
              payload: { date: "2026-10-08" }
              as: TrackOps
              captures: { tdid_x4: $.data.id }
            - call: "POST /tracks/${tid_x4}/track-days/${tdid_x4}/open"
              payload: {}
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid_x4}/track-days/${tdid_x4}/run_ops"
              payload: {}
              as: TrackOps
              captures: { idx1: $.data.ops_run_index }
            - call: "POST /tracks/${tid_x4}/track-days/${tdid_x4}/run_ops"
              payload: {}
              as: TrackOps
              captures: { idx2: $.data.ops_run_index }
          assert:
            - "First run_ops → ops_run_index == 1"
            - "Second run_ops → ops_run_index == 2"

