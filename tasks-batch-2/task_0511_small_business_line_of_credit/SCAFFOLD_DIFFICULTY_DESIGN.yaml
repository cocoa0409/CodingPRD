scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_initial_vs_revision_submit
        grounds:
          - calculations.underwriting_risk_score
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.NEEDS_REVISION_to_SUBMITTED
          - entities.Application.fields.risk_score
        distinguishing_aspect: |
          On the Application domain, the same merchant resubmits after revision against a
          fresher BankFeed and the risk_score recomputes to a different integer (52 -> 73);
          the initial-submit variant uses the original feed, the revision-resubmit variant
          uses the newly attached feed, proving variant selection is context-driven.
        test_recipe:
          setup:
            - "A Merchant exists with monthly_revenue_cents=2000000."
            - "Two BankFeeds exist: feed_lo (avg_daily_balance 700000, deposit_volume 3000000, nsf 0) and feed_hi (avg_daily_balance 900000, deposit_volume 4800000, nsf 0), both FRESH."
            - "An Application requesting 1000000 was submitted against feed_lo (score 52), then sent back to NEEDS_REVISION."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Acme LLC", ein: "100000001", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_lo", pulled_at: "2026-04-20T00:00:00Z", avg_daily_balance_cents: 700000, nsf_count_90d: 0, deposit_volume_cents: 3000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_lo_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_hi", pulled_at: "2026-04-25T00:00:00Z", avg_daily_balance_cents: 900000, nsf_count_90d: 0, deposit_volume_cents: 4800000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_hi_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_lo_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/request-revision"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { bank_feed_id: "${feed_hi_id}" }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { score_after: $.data.risk_score }
          assert:
            - "Application.${app_id}.risk_score == 73"
            - "Application.${app_id}.status == SUBMITTED"
            - "Application.${app_id}.bank_feed_id == ${feed_hi_id}"

      - name: remittance_amount_daily_vs_weekly_cadence
        grounds:
          - calculations.remittance_amount
          - entities.CreditLine.fields.remittance_cadence
          - entities.Remittance.fields.amount_cents
          - state_machines.Remittance.SCHEDULED_to_SETTLED
        distinguishing_aspect: |
          On the Remittance/CreditLine domain (a different domain from the Application
          risk-score variant above), the SAME outstanding_total of 864000 yields amount 17280
          under the DAILY (2%) cadence variant but would yield 86400 under the WEEKLY (10%)
          variant; cadence selects the variant and they diverge numerically.
        test_recipe:
          setup:
            - "A DAILY-cadence CreditLine (TIER_A, fee_factor 800, limit 1000000) is ACTIVE with two OUTSTANDING draws: 500000 (fee 40000) and 300000 (fee 24000), outstanding_total 864000."
            - "A remittance is scheduled at 2026-05-12T00:00:00Z and is now due (clock at that instant)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /merchants"
              payload: { legal_name: "Beta Co", ein: "100000002", state_code: "NY", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_a", pulled_at: "2026-05-09T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 500000 }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 300000 }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /credit-lines/${line_id}/remittances"
              payload: { scheduled_for: "2026-05-12T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { remit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
          trigger:
            - call: "POST /remittances/${remit_id}/settle"
              payload: { outcome: "SUCCESS" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { amt: $.data.amount_cents }
          assert:
            - "Remittance.${remit_id}.amount_cents == 17280"
            - "Remittance.${remit_id}.fee_applied_cents == 17280"
            - "Remittance.${remit_id}.principal_applied_cents == 0"
            - "Remittance.${remit_id}.status == SETTLED"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a) and (c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_weighted_nonlinear_mode_a
        grounds:
          - calculations.underwriting_risk_score
          - entities.BankFeed.fields.nsf_count_90d
          - entities.Merchant.fields.monthly_revenue_cents
        distinguishing_aspect: |
          MODE (a): risk_score combines >=3 inputs (avg_daily_balance, deposit_volume,
          nsf_count_90d) with nested min()/max() clamps and a subtractive penalty, then a
          single final round; with adb 2000000, deposit 9000000, nsf 0, monthly_rev 2000000,
          requested 1000000 the clamps drive both ratios to 1.0 and score is exactly 85.
        test_recipe:
          setup:
            - "A Merchant (monthly_revenue 2000000) and a FRESH BankFeed (adb 2000000, deposit 9000000, nsf 0)."
            - "A DRAFT Application requesting 1000000 against that feed."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Gamma Inc", ein: "100000003", state_code: "TX", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_s", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
              captures: { score: $.data.risk_score }
          assert:
            - "Application.${app_id}.risk_score == 85"

      - name: equivalent_apr_annualize_after_rate_mode_c
        grounds:
          - calculations.equivalent_apr
          - calculations.renewal_total_fee
          - entities.RenewalOffer.fields.equivalent_apr_bps
          - state_machines.RenewalOffer.transitions
        distinguishing_aspect: |
          MODE (c): equivalent_apr pins an explicit evaluation order — compute the flat fee
          RATE first, THEN annualize by (365/term_days) — so a 1200 bps fee over a 180-day
          term yields 2433 bps APR (0.12 * 365/180 * 10000, single final round), not the
          rate-after-annualize ordering; flipping the order would change the cents.
        test_recipe:
          setup:
            - "An ACTIVE CreditLine (TIER_A, limit 1000000) exists."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Delta LLC", ein: "100000004", state_code: "WA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_d", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "WEEKLY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /credit-lines/${line_id}/renewal-offers"
              payload: { new_fee_factor_bps: 1200, term_days: 180 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { offer_id: $.data.id }
          assert:
            - "RenewalOffer.${offer_id}.total_fee_cents == 120000"
            - "RenewalOffer.${offer_id}.equivalent_apr_bps == 2433"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities (two cycles)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: remittance_nsf_retry_cycle
        grounds:
          - state_machines.Remittance.SCHEDULED_to_FAILED
          - state_machines.Remittance.SCHEDULED_to_SETTLED
          - entities.Remittance.fields.attempt_count
        distinguishing_aspect: |
          On the Remittance entity: an NSF settle drives SCHEDULED->FAILED and spawns a fresh
          SCHEDULED retry remittance (SCHEDULED->FAILED->SCHEDULED cycle), proven by a new
          SCHEDULED remittance existing on the line with scheduled_for two days later.
        test_recipe:
          setup:
            - "A DAILY ACTIVE CreditLine (TIER_A, limit 1000000) with one OUTSTANDING draw 200000 (fee 16000)."
            - "A remittance scheduled at 2026-05-15T00:00:00Z, now due."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /merchants"
              payload: { legal_name: "Eps Co", ein: "100000005", state_code: "FL", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_e", pulled_at: "2026-05-12T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 200000 }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /credit-lines/${line_id}/remittances"
              payload: { scheduled_for: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { remit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
          trigger:
            - call: "POST /remittances/${remit_id}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
          assert:
            - "Remittance.${remit_id}.status == FAILED"
            - "Remittance.${remit_id}.attempt_count == 1"
            - "Remittance.${remit_id}.failure_reason == NSF"
            - "GET /credit-lines/${line_id}/remittances with status=SCHEDULED returns exactly 1 remittance whose scheduled_for == 2026-05-17T00:00:00Z"
            - "CreditLine.${line_id}.nsf_strike_count == 1"

      - name: application_revision_resubmit_cycle
        grounds:
          - state_machines.Application.SUBMITTED_to_NEEDS_REVISION
          - state_machines.Application.NEEDS_REVISION_to_SUBMITTED
          - entities.Application.fields.status
        distinguishing_aspect: |
          On the Application entity (a different entity from Remittance): the revision loop
          SUBMITTED->NEEDS_REVISION->SUBMITTED returns the application to SUBMITTED with a
          recomputed risk_score, proving the cycle re-enters a non-terminal prior state.
        test_recipe:
          setup:
            - "A Merchant and FRESH BankFeed (adb 2000000, deposit 9000000, nsf 0)."
            - "An Application requesting 1000000, submitted (score 85), then sent to NEEDS_REVISION by a different underwriter."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Zeta Inc", ein: "100000006", state_code: "OR", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_z", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/request-revision"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
              captures: { score2: $.data.risk_score }
          assert:
            - "Application.${app_id}.status == SUBMITTED"
            - "Application.${app_id}.risk_score == 85"

  # ==========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers (depth 3 and 2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: chargeoff_writeoff_ledger_cascade_depth3
        grounds:
          - state_machines.CreditLine.DEFAULTED_to_CHARGED_OFF
          - state_machines.Draw.OUTSTANDING_to_WRITTEN_OFF
          - entities.LedgerEntry.fields.entry_type
          - calculations.outstanding_principal
        distinguishing_aspect: |
          Trigger = charge-off. Hop1 charge-off mutates CreditLine; hop2 that mutation flips
          each OUTSTANDING Draw to WRITTEN_OFF; hop3 each Draw write-off appends a WRITE_OFF
          LedgerEntry; the final recompute drives outstanding_principal_cents to 0. Each hop
          is caused by the prior hop, depth 3.
        test_recipe:
          setup:
            - "A DELINQUENT CreditLine with nsf_strike_count == 5 and one OUTSTANDING draw 200000 (fee 16000, never repaid), DEFAULT already declared by co_default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /merchants"
              payload: { legal_name: "Eta Co", ein: "100000007", state_code: "GA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_h", pulled_at: "2026-05-12T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 200000 }
              as: Servicer
              as_user_id: "sv_1"
              captures: { draw_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/remittances"
              payload: { scheduled_for: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r1}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r2: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r2}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r3: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-19T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r3}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r4: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r4}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r5: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-23T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r5}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "GET /credit-lines/${line_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ver_pre_default: $.data.version }
            - call: "POST /credit-lines/${line_id}/declare-default"
              payload: { expected_credit_line_version: "${ver_pre_default}" }
              as: CreditOfficer
              as_user_id: "co_default"
              captures: { ver_after_default: $.data.version }
          trigger:
            - call: "POST /credit-lines/${line_id}/charge-off"
              payload: { expected_credit_line_version: "${ver_after_default}" }
              as: CreditOfficer
              as_user_id: "co_chargeoff"
          assert:
            - "CreditLine.${line_id}.status == CHARGED_OFF"
            - "Draw.${draw_id}.status == WRITTEN_OFF"
            - "CreditLine.${line_id}.outstanding_principal_cents == 0"
            - "GET /credit-lines/${line_id}/ledger-entries with entry_type=WRITE_OFF returns exactly 1 entry with amount_cents == 200000"

      - name: nsf_settle_delinquency_cascade_depth2
        grounds:
          - state_machines.Remittance.SCHEDULED_to_FAILED
          - state_machines.CreditLine.ACTIVE_to_DELINQUENT
          - entities.CreditLine.fields.nsf_strike_count
        distinguishing_aspect: |
          Trigger = remittance settle (NSF), a DIFFERENT trigger from charge-off. Hop1 the
          settle flips the Remittance SCHEDULED->FAILED and bumps nsf_strike_count; hop2 that
          strike count reaching NSF_DELINQUENCY_THRESHOLD (3) flips the CreditLine
          ACTIVE->DELINQUENT. Depth 2, caused-by-prior-link.
        test_recipe:
          setup:
