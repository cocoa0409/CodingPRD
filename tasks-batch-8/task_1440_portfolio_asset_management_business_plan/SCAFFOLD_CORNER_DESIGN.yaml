              as_user_id: "am-1"
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
            - { call: "POST /api/capital-projects", payload: { asset_id: "${a1}", plan_id: "${pl1}", name: "X", requested_amount_cents: 10000000, sched_start_month: 3, sched_end_month: 6 }, as: AssetManager, as_user_id: "am-1", captures: { cpx: $.data.id } }
            - { call: "POST /api/capital-projects", payload: { asset_id: "${a1}", plan_id: "${pl1}", name: "Y", requested_amount_cents: 2000000, sched_start_month: 7, sched_end_month: 8 }, as: AssetManager, as_user_id: "am-1", captures: { cpy: $.data.id } }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { pl_v: $.data.version } }
          trigger:
            - { call: "POST /api/capital-projects/${cpx}/approve", payload: { expected_plan_version: "${pl_v}" }, as: InvestmentCommittee, as_user_id: "ic-1", captures: { x_st: $.data.status } }
            - { call: "POST /api/capital-projects/${cpy}/approve", payload: { expected_plan_version: "${pl_v}" }, as: InvestmentCommittee, as_user_id: "ic-1", captures: { err: $.data.error_id } }
          assert:
            - "x_st == APPROVED"
            - "err == ERR_STALE_PLAN_VERSION (412) — Y's approval basis (available 36M) was invalidated by X's approval (now 26M)"

      - name: cascading_side_effects_layer
        claim_type: cascade_chain
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / covenant_fail_cascades_to_portfolio_posture
          rationale: "Depth-3 cascade asserted end-to-end there; asset-sale cascade in asset_sale_close_cascades_loan_plan_project."

