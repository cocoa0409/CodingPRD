            - "Unit.${u1_id}.rental_encumbered_cents == 0, rental_committed_cents == 64800, rental_released_cents == 0, rental_available_cents == 435200"

      - name: parallel_billing_and_fulfillment_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.SupportSurfaceOrder[dimension=fulfillment_status]
          - state_machines.SupportSurfaceOrder[dimension=billing_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_billing_and_fulfillment_dimensions_advance_independently
          rationale: "That §1.8 instance already walks both dimensions of the same order through approve, deliver and return, asserting the combined (fulfillment_status, billing_status) pair at each step."

      - name: cascade_down_from_staging_validation_to_order_hold
        claim_type: Cascade down
        grounds:
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED
        excluded_because:
          difficulty_instance: transitive_cascade / validate_hapi_cascades_case_rca_unit_posture_and_order_hold
          rationale: "Asserted hop-by-hop (1, 1b, 2, 3, 4, 5) by the named §1.8 instance, including that unrelated REQUESTED orders on the unit receive the posture hold."

      - name: ledger_sync_on_consult_cancel_releases_encumbrance
        claim_type: Ledger sync
        grounds:
          - state_machines.ConsultRequest.PLAN_ACTIVE_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_consult_cascades_order_release_to_unit_ledger
          rationale: "The named §1.8 instance asserts hops 1 through 3 including the Unit ledger fields after the RELEASED transition, plus the no-op status of hops 2b, 2c and 3b."

      - name: compensation_on_early_return_reverses_encumbrance_without_drift
        claim_type: Compensation
        grounds:
          - state_machines.SupportSurfaceOrder[dimension=billing_status].ENCUMBERED_to_COMMITTED
        excluded_because:
          difficulty_instance: compensating_invariant / unit_rental_ledger_conserved_across_approve_and_release
          rationale: "That §1.8 instance checkpoints all four Unit ledger fields before approve, after approve, after deliver and after return, and asserts committed + released == authorized exactly."

      - name: cyclic_return_resubmit_loop_terminates_on_revision_count
        claim_type: cyclic
        grounds:
          - state_machines.ConsultRequest.RETURNED_FOR_INFO_to_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / consult_return_resubmit_cycle_increments_revision
          rationale: "The named §1.8 instance drives two full loops, asserts the acuity re-derivation on each pass and asserts the ERR_REVISION_LIMIT_REACHED termination at MAX_REVISIONS."

      - name: guarded_transition_assign_requires_certified_nurse
        claim_type: guarded transitions
        grounds:
          - state_machines.ConsultRequest.TRIAGED_to_ASSIGNED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assign_blocked_when_nurse_lapsed
          rationale: "The cross-entity guard on WocNurse.certification_status is asserted there, including that the priority-32 certification gate wins over the priority-52 load gate."

  - section: calculations
    instances:
      - name: acuity_type_multiplier_and_comorbidity_cap_applied
        claim_type: Constants Applied
        grounds:
          - calculations.consult_acuity_score
          - global_constants.SLA_HOURS_BY_BAND
        distinguishing_aspect: "Three constants must all bite in one call: COMORBIDITY_POINTS_CAP truncates 8 comorbidities from 40 points to 25, DEVICE_RELATED_POINTS adds a flat 10, and TYPE_MULTIPLIER[INCONTINENCE] 0.9 scales the whole sum DOWN — so an INCONTINENCE consult scores less than the identical WOUND consult would."
        test_recipe:
          setup:
            - "Unit 3E exists with a TRAINEE nurse Nina (triage has no certification gate)."
            - "Patient MRN-J1 is ADMITTED with comorbidity_count 8 and device_related_risk true."
            - "Consult C1 is an INCONTINENCE consult with reported_stage STAGE_3."
            - "The logical clock is at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}" }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-J1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 8, device_related_risk: true }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "INCONTINENCE", reported_stage: "STAGE_3", clinical_note: "Deep IAD with a rectal tube in place." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "HTTP status is 200 and ConsultRequest.${c1_id}.acuity_score == 85.5"
            - "Derivation: STAGE_WEIGHT[STAGE_3] 60 + min(COMORBIDITY_POINTS_CAP 25, 5 * 8 = 40) = 25 + DEVICE_RELATED_POINTS 10 + area 0 = 95, times TYPE_MULTIPLIER[INCONTINENCE] 0.9 = 85.5"
            - "The uncapped comorbidity term would have produced (60 + 40 + 10) * 0.9 == 99.0, so the cap is observable"
            - "ConsultRequest.${c1_id}.acuity_variant == INTAKE_PROVISIONAL and priority_band == P1 (85.5 >= P1_THRESHOLD 70.0)"
            - "ConsultRequest.${c1_id}.triaged_at == 2026-08-01T00:00:00Z and sla_due_at == 2026-08-01T04:00:00Z (SLA_HOURS_BY_BAND[P1] == 4)"
            - "ConsultRequest.${c1_id}.status == TRIAGED and version == 2"

      - name: acuity_round_half_up_at_one_decimal_boundary
        claim_type: Precision
        grounds:
          - calculations.consult_acuity_score
          - calculations.consult_acuity_score.precision
        distinguishing_aspect: "MUCOSAL 15 times TYPE_MULTIPLIER[OSTOMY] 1.15 lands on exactly 17.25 — a value whose second decimal is a 5, so round_half_up gives 17.3 while banker's rounding (round_half_even) gives 17.2 and truncation gives 17.2. Only one of the three is correct."
        test_recipe:
          setup:
            - "Unit 3E exists with a TRAINEE nurse Nina."
            - "Patient MRN-J2 is ADMITTED with comorbidity_count 0 and device_related_risk false, so no additive term can mask the multiplier's decimal tail."
            - "Consult C1 is an OSTOMY consult with reported_stage MUCOSAL."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}" }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-J2", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", ostomy_present: true }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "OSTOMY", reported_stage: "MUCOSAL", clinical_note: "Mucocutaneous separation, no peristomal breakdown." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "HTTP status is 200 and ConsultRequest.${c1_id}.acuity_score == 17.3"
            - "Derivation: STAGE_WEIGHT[MUCOSAL] 15 * TYPE_MULTIPLIER[OSTOMY] 1.15 = 17.25, and round_half_up(17.25, 1) == 17.3"
            - "The value is NOT 17.2 — neither round_half_even nor truncation is acceptable"
            - "ConsultRequest.${c1_id}.priority_band == P3 (17.3 < P2_THRESHOLD 40.0) and sla_due_at == 2026-08-04T00:00:00Z (SLA_HOURS_BY_BAND[P3] == 72)"
            - "ConsultRequest.${c1_id}.acuity_variant == INTAKE_PROVISIONAL"

      - name: acuity_clamped_to_acuity_max_when_raw_exceeds_one_hundred
        claim_type: weighted_scoring
        grounds:
          - calculations.consult_acuity_score
          - global_constants.SLA_HOURS_BY_BAND
        distinguishing_aspect: "The weighted sum is not intrinsically bounded: the worst-case additive terms times the largest multiplier reach 132.3, well past ACUITY_MAX. The score must be clamped to exactly 100.0 while priority_band and sla_due_at still derive from the clamped value."
        test_recipe:
          setup:
            - "Unit 3E exists with a TRAINEE nurse Nina."
            - "Patient MRN-J3 is ADMITTED with comorbidity_count 6 and device_related_risk true."
            - "Consult C1 is an OSTOMY consult with reported_stage STAGE_4."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}" }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-J3", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 6, device_related_risk: true, ostomy_present: true }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "OSTOMY", reported_stage: "STAGE_4", clinical_note: "Full-thickness peristomal ulceration with exposed fascia." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "HTTP status is 200 and ConsultRequest.${c1_id}.acuity_score == 100.0"
            - "Derivation: (STAGE_WEIGHT[STAGE_4] 80 + min(25, 5 * 6 = 30) = 25 + 10 + 0) = 115, times 1.15 = 132.25, round_half_up to 132.3, then min(ACUITY_MAX 100, 132.3) = 100.0"
            - "The stored value is not 132.3 and not 132.25 — the clamp is applied and the field respects the 1-decimal precision rule"
            - "ConsultRequest.${c1_id}.priority_band == P1 and sla_due_at == 2026-08-01T04:00:00Z"

      - name: acuity_variant_switches_from_intake_provisional_to_assessed_final
        claim_type: Variant Selection
        grounds:
          - calculations.consult_acuity_score.variants
          - entities.ConsultRequest.fields.acuity_variant
          - state_machines.ConsultRequest.ASSIGNED_to_ASSESSED
        distinguishing_aspect: "Variant choice is dictated by the endpoint, not by the payload: triage must run intake_provisional off ConsultRequest.reported_stage with area_points forced to 0, and the first assessment must run assessed_final off SkinAssessment.observed_stage with a live area term. The acuity_variant field must name whichever ran."
        test_recipe:
          setup:
            - "Unit 3E exists with nurse Nina advanced to CANDIDATE (one signoff plus /advance), which is enough to be an assignment target."
            - "Patient MRN-J4 is ADMITTED at 2026-07-31T00:00:00Z with comorbidity_count 0 and device_related_risk false."
            - "Consult C1 is a WOUND consult with reported_stage STAGE_1; it is triaged and assigned to Nina."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-J4", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Non-blanchable erythema reported by the charge nurse." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v: "$.data.version" }
          trigger:
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_4", measured_area_cm2: 30, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}" }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - "At the triage checkpoint: ConsultRequest.${c1_id}.acuity_variant == INTAKE_PROVISIONAL and acuity_score == 20.0 (STAGE_WEIGHT[STAGE_1] 20 * TYPE_MULTIPLIER[WOUND] 1.0, area_points forced to 0), priority_band == P3, sla_due_at == 2026-08-04T00:00:00Z"
            - "HTTP status is 201 for the assessment and WocNurse.${n1_id}.certification_status == CANDIDATE with max_consult_load == 3"
            - "After the assessment: ConsultRequest.${c1_id}.acuity_variant == ASSESSED_FINAL and acuity_score == 95.0"
            - "Derivation of 95.0: STAGE_WEIGHT[STAGE_4] 80 + 0 + 0 + min(AREA_POINTS_CAP 15, floor(30 / AREA_POINTS_STEP_CM2 10) * AREA_POINTS_PER_STEP 5 = 15) = 15, all times 1.0"
            - "The area term is 15 only because assessed_final is in force; had intake_provisional been re-used, the score would have been 80.0"
            - "ConsultRequest.${c1_id}.priority_band == P1 and status == ASSESSED"

      - name: acuity_variant_switch_reanchors_sla_on_original_triaged_at
        claim_type: Reconciliation
        grounds:
          - calculations.consult_acuity_score
          - state_machines.ConsultRequest.ASSIGNED_to_ASSESSED
          - entities.ConsultRequest.fields.sla_due_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "When the variant switches, the delta lands on sla_due_at — and the recompute must re-anchor on the ORIGINAL triaged_at, not on the current logical clock. Advancing the clock a full day between triage and assessment makes the two candidate answers 24 hours apart, and the correct one is already in the past."
        test_recipe:
          setup:
            - "Unit 3E exists with nurse Nina at CANDIDATE; Patient MRN-J5 is ADMITTED at 2026-07-31T00:00:00Z."
            - "Consult C1 (WOUND, reported_stage STAGE_1) is triaged at the default clock 2026-08-01T00:00:00Z and assigned to Nina."
            - "The logical clock is then advanced to 2026-08-02T00:00:00Z before any bedside assessment is filed."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-J5", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Blanchable redness reported overnight." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemOperator
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v: "$.data.version" }
          trigger:
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_3", measured_area_cm2: 12, observed_at: "2026-08-02T00:00:00Z", expected_patient_version: "${p1_v}" }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - "At the triage checkpoint: acuity_score == 20.0, priority_band == P3, triaged_at == 2026-08-01T00:00:00Z, sla_due_at == 2026-08-04T00:00:00Z"
            - "HTTP status is 201 and ConsultRequest.${c1_id}.acuity_score == 65.0 (60 + 0 + 0 + min(15, floor(12 / 10) * 5) = 5, times 1.0) with priority_band == P2"
            - "ConsultRequest.${c1_id}.triaged_at is STILL 2026-08-01T00:00:00Z — the assessment must not restamp it"
            - "ConsultRequest.${c1_id}.sla_due_at == 2026-08-02T00:00:00Z, i.e. triaged_at + SLA_HOURS_BY_BAND[P2] 24"
            - "sla_due_at is NOT 2026-08-03T00:00:00Z (which is what anchoring on the current clock would produce) and NOT the stale 2026-08-04T00:00:00Z"
            - "ConsultRequest.${c1_id}.acuity_variant == ASSESSED_FINAL and status == ASSESSED"

      - name: survey_metric_scoped_to_each_units_own_observations
        claim_type: Input Set Filtering
        grounds:
          - calculations.unit_survey_metric
          - calculations.unit_survey_metric.input_set
          - state_machines.SurveyRound.LOCKED_to_PUBLISHED
        distinguishing_aspect: "One publish writes a different number to each participating Unit: the metric must be recomputed per Unit id over that Unit's own observations only. Pooling all three rows across both units would give 66.67 for everybody and match neither correct answer."
        test_recipe:
