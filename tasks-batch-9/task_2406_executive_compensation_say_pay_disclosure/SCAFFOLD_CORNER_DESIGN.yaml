      - name: adding_a_member_requires_both_sides_of_the_link_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /exec-comp/peer-groups/{id}/members]
          - errors[ERR_COMPANY_NOT_FOUND]
          - errors[ERR_PEER_GROUP_NOT_FOUND]
          - validations.priority_3_path_not_found
          - validations.priority_4_body_foreign_key_not_found
        distinguishing_aspect: |
          The junction endpoint resolves both endpoints of the association before writing: an unknown path group id
          is ERR_PEER_GROUP_NOT_FOUND (404) at priority 3 and an unknown body peer_company_id is
          ERR_COMPANY_NOT_FOUND (404) at priority 4, and only when both resolve does the row appear carrying both
          foreign keys plus the derived ratios.
        test_recipe:
          setup:
            - "ACME issuer and BRVO peer registered."
            - "A DRAFT RAW_MEDIAN peer group with no members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
          trigger:
            - call: "POST /exec-comp/peer-groups/00000000-0000-4000-8000-000000000abc/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { err_group: $.data.error_id }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "00000000-0000-4000-8000-000000000def", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { err_company: $.data.error_id }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { mem_b: $.data.id }
          assert:
            - "${err_group} == 'ERR_PEER_GROUP_NOT_FOUND' with HTTP status 404"
            - "${err_company} == 'ERR_COMPANY_NOT_FOUND' with HTTP status 404 — the path id resolved, the body id did not"
            - "the third call returns 201 with PeerGroupMember.${mem_b}.peer_group_id == '${pg_id}' and peer_company_id == '${bravo_id}'"
            - "PeerGroupMember.${mem_b}.revenue_ratio == 0.8000 and market_cap_ratio == 0.8000"
            - "PeerGroup.${pg_id}.version == 2 — only the successful link bumped it"

