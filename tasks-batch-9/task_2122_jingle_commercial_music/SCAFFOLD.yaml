  - id: ERR_PROJECT_NOT_HOLDABLE
    http: 409
    condition: "Hold was attempted while the Project is not in BRIEFING, IN_DEMO or IN_PRODUCTION"
  - id: ERR_PROJECT_NOT_ON_HOLD
    http: 409
