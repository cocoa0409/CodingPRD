  # =====================================================================
  # Rule 5 — validation priority conflicts across different category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_change_order_approve
        grounds:
          - validations[priority=40]
          - validations[priority=72]
          - errors[ERR_PROJECT_PHASE_INVALID]
          - errors[ERR_CHANGE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair `state` (priority 40, ERR_PROJECT_PHASE_INVALID) versus
          `business_fiscal` (priority 72, ERR_CHANGE_CAP_EXCEEDED). One request violates both
          — the project is still FEASIBILITY_CLEARED and the change order would push
          cumulative_change_pct_after to 25.21, above the 25.00 cap — and the state error wins.
        test_recipe:
          setup:
            - "AduProject B on Property P2 in PLMD with a LOCAL_ORDINANCE pathway selected, so status == FEASIBILITY_CLEARED (not PERMITTED or UNDER_CONSTRUCTION)."
            - "ChangeOrder CO for +5500000 cents on a 24000000 cent base contract sits in SUBMITTED; approving it would compute builder_fee_cents 550000 and cumulative_change_pct_after 25.21."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_plmd_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_plmd_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000, occupied: false, in_str_overlay: false, existing_mortgage_balance_cents: 60000000 }
              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
              captures: { proj_b_v1: $.data.version }
            - call: "POST /adu-projects/${proj_b_id}/change-orders"
              payload: { expected_adu_project_version: "${proj_b_v1}", title: "Add second bathroom", scope_items: ["Rough in second bath", "Tile and fixtures"], cost_delta_cents: 5500000, schedule_delta_days: 25 }
              as: Homeowner
              as_user_id: "${prop_p2_id}"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_p2_id}"
          trigger:
            - call: "POST /change-orders/${co_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProjectManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and the captured err_id == 'ERR_PROJECT_PHASE_INVALID'"
            - "the captured err_id != 'ERR_CHANGE_CAP_EXCEEDED'"
            - "ChangeOrder.${co_id}.status == 'SUBMITTED' and ChangeOrder.${co_id}.builder_fee_cents == 0"
            - "AduProject.${proj_b_id}.contract_price_current_cents == 24000000"

      - name: safety_beats_temporal_on_phase_schedule
        grounds:
          - validations[priority=60]
          - validations[priority=66]
          - errors[ERR_OCCUPIED_HABITABILITY_VIOLATION]
          - errors[ERR_PHASE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A DIFFERENT category pair from state_beats_fiscal_on_change_order_approve:
          `business_safety` (priority 60, ERR_OCCUPIED_HABITABILITY_VIOLATION) versus
          `business_temporal` (priority 66, ERR_PHASE_WINDOW_CONFLICT). The requested window
          2026-09-03..2026-09-06 is both a 4-day utility shutoff on an occupied parcel and an
          overlap of an already-SCHEDULED window, and the safety error wins.
        test_recipe:
          setup:
            - "Property P1 in SNVL with occupied == true."
            - "AduProject A on P1 at status PERMITTED via a STATUTORY_MINISTERIAL pathway."
            - "ConstructionPhase F (FOUNDATION, INVASIVE) SCHEDULED for 2026-09-01 through 2026-09-05."
            - "ConstructionPhase U (UTILITY_TIE_IN, UTILITY_SHUTOFF) still PLANNED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Sunnyvale", code: "SNVL", local_max_detached_sqft: 750, local_rear_setback_ft: 10.0, local_side_setback_ft: 5.0, local_max_height_ft: 14.0, plan_check_base_fee_cents: 185025, plan_check_rate_per_sqft_cents: 137, impact_fee_per_sqft_cents: 1250, utility_capacity_fee_cents: 415000, correction_response_days: 60, separate_meter_required: true, str_min_lease_days: 30, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_snvl_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_snvl_id}", address_line: "418 Alder Way", lot_sqft: 6000, existing_dwelling_sqft: 1600, electrical_service_amps: 200, existing_water_meter_size_in: 0.75, pre_adu_value_cents: 120000000, occupied: true, in_str_overlay: false, existing_mortgage_balance_cents: 45000000 }
              as: DesignLead
              captures: { prop_p1_id: $.data.id, prop_p1_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p1_id}", expected_property_version: "${prop_p1_v}", unit_type: "DETACHED_NEW", proposed_sqft: 800, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 4.0, bedrooms: 2, contract_base_price_cents: 28000000 }
              as: DesignLead
              captures: { proj_a_id: $.data.id }
            - call: "POST /adu-projects/${proj_a_id}/feasibility-screenings"
              payload: { pathway: "STATUTORY_MINISTERIAL" }
              as: DesignLead
              captures: { scr_a_id: $.data.id }
            - call: "POST /adu-projects/${proj_a_id}/select-pathway"
              payload: { screening_id: "${scr_a_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_a_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_a_id: $.data.id }
            - call: "POST /utility-connections/${uc_a_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_a_id}/permit-submittals"
              payload: { design_sheet_count: 18, title24_compliant: true }
              as: DesignLead
              captures: { sub_a_id: $.data.id }
            - call: "POST /permit-submittals/${sub_a_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_a_id}/plan-check-result"
              payload: { outcome: "APPROVED" }
              as: PlanChecker
            - call: "POST /adu-projects/${proj_a_id}/construction-phases"
              payload: { phase_code: "FOUNDATION", disruption_class: "INVASIVE", sequence_index: 0 }
              as: ProjectManager
              captures: { phase_f_id: $.data.id }
            - call: "POST /construction-phases/${phase_f_id}/schedule"
              payload: { window_start_date: "2026-09-01", window_end_date: "2026-09-05" }
              as: ProjectManager
            - call: "POST /adu-projects/${proj_a_id}/construction-phases"
              payload: { phase_code: "UTILITY_TIE_IN", disruption_class: "UTILITY_SHUTOFF", sequence_index: 3 }
              as: ProjectManager
              captures: { phase_u_id: $.data.id }
          trigger:
            - call: "POST /construction-phases/${phase_u_id}/schedule"
              payload: { window_start_date: "2026-09-03", window_end_date: "2026-09-06" }
              as: ProjectManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and the captured err_id == 'ERR_OCCUPIED_HABITABILITY_VIOLATION'"
            - "the captured err_id != 'ERR_PHASE_WINDOW_CONFLICT'"
            - "ConstructionPhase.${phase_u_id}.status == 'PLANNED'"
            - "ConstructionPhase.${phase_u_id}.window_start_date is null"
            - "ConstructionPhase.${phase_f_id}.status == 'SCHEDULED'"

  # =====================================================================
  # Rule 6 — boundary-precision checks on different metrics and endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: impact_fee_threshold_at_750_sqft
        grounds:
          - calculations.permit_fee_schedule
          - entities.PermitSubmittal.fields.impact_component_cents
          - entities.PermitSubmittal.fields.total_permit_fee_cents
        distinguishing_aspect: |
          NUMERIC threshold on proposed_sqft at the POST /adu-projects/{id}/permit-submittals
          endpoint: 749 sqft is strictly below IMPACT_FEE_EXEMPT_SQFT so impact_component_cents
          is exactly 0 and the total is 565405, while 750 sqft is at the threshold so
          impact_component_cents is 310345 and the total is 876333. The exemption is `<`, not `<=`.
        test_recipe:
          setup:
            - "Jurisdiction PLMD with impact_fee_per_sqft_cents 800."
            - "Property P2 in PLMD with existing_dwelling_sqft 1450."
            - "Two AduProject rows on P2, one at 749 sqft and one at 750 sqft, neither carrying any UtilityConnection so utility_component_cents is 0 for both."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_plmd_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_plmd_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000, occupied: false, in_str_overlay: false, existing_mortgage_balance_cents: 60000000 }
              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 749, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_749_id: $.data.id }
            - call: "GET /properties/${prop_p2_id}"
              payload: {}
              as: DesignLead
              captures: { prop_p2_v2: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v2}", unit_type: "DETACHED_NEW", proposed_sqft: 750, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_750_id: $.data.id }
          trigger:
            - call: "POST /adu-projects/${proj_749_id}/permit-submittals"
              payload: { design_sheet_count: 12, title24_compliant: true }
              as: DesignLead
              captures: { sub_749_id: $.data.id }
            - call: "POST /adu-projects/${proj_750_id}/permit-submittals"
              payload: { design_sheet_count: 12, title24_compliant: true }
              as: DesignLead
              captures: { sub_750_id: $.data.id }
          assert:
            - "PermitSubmittal.${sub_749_id}.impact_component_cents == 0"
            - "PermitSubmittal.${sub_749_id}.plan_check_component_cents == 201466"
            - "PermitSubmittal.${sub_749_id}.school_component_cents == 363939"
            - "PermitSubmittal.${sub_749_id}.total_permit_fee_cents == 565405"
            - "PermitSubmittal.${sub_750_id}.impact_component_cents == 310345"
            - "PermitSubmittal.${sub_750_id}.plan_check_component_cents == 201563"
            - "PermitSubmittal.${sub_750_id}.school_component_cents == 364425"
            - "PermitSubmittal.${sub_750_id}.total_permit_fee_cents == 876333"

      - name: corrections_letter_with_empty_item_array
        grounds:
          - validations[priority=70]
          - errors[ERR_NO_CORRECTIONS_ON_RECORD]
          - state_machines.PermitSubmittal.UNDER_PLAN_CHECK_to_CORRECTIONS_REQUIRED
        distinguishing_aspect: |
          EMPTY-COLLECTION edge on a DIFFERENT metric (array cardinality, not a numeric
          threshold) reached through a DIFFERENT endpoint
          (POST /permit-submittals/{id}/plan-check-result): a CORRECTIONS_REQUIRED outcome
          carrying `correction_items: []` is rejected with ERR_NO_CORRECTIONS_ON_RECORD rather
          than vacuously moving the submittal into CORRECTIONS_REQUIRED with zero corrections.
