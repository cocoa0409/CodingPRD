  - section: state_machines
    instances:

      - name: every_entity_is_born_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.OpticalDesign.initial_state
          - state_machines.GlassLot.initial_state
          - state_machines.WorkOrder.process_status.initial_state
