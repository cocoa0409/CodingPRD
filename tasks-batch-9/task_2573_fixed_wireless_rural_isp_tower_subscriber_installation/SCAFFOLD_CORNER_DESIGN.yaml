      - name: hold_larger_than_the_remaining_allowance_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_INSUFFICIENT_SECTOR_CAPACITY
          - calculations.sector_selection
        distinguishing_aspect: |
          The allowance test is a hard aggregate, not a posture: at committed_mbps 100 the ratio is
          4.000 (WATCH, still open for business) but the remaining allowance is 200 - 100 = 100 Mbps,
          which cannot carry a 150 Mbps plan, so the older GIG150 qualification is refused with
          ERR_INSUFFICIENT_SECTOR_CAPACITY rather than ERR_SECTOR_CAPACITY_HOLD.
        test_recipe:
          setup:
            - "ACTIVE Tower / ACTIVE Sector (allowance 200) with plans STD50 and GIG150."
            - "SR_GIG on GIG150 is created and qualifies while the sector is empty; two STD50 requests are then created and both held, taking committed_mbps to 100 and the posture to WATCH."
