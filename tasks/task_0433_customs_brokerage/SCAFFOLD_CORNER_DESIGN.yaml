  # =========================================================================
  # SECTION 5 — ENDPOINTS (per-side-effect coverage, action endpoints)
  # =========================================================================
  - section: endpoints
    instances:
      - name: pga_review_created_pending_then_listable_by_entry
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/pga-reviews
          - endpoints.GET_/pga-reviews
          - entities.PGAReview.fields.decision
        distinguishing_aspect: "POST /pga-reviews creates a PGAReview with decision=PENDING; GET /pga-reviews?entry_id=X reverse-lists it (FK reachability for PGAReview.entry_id)."
        test_recipe:
          setup:
            - "A DRAFT entry with one FDA line."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-EP01", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
