            - call: "POST /marketing-campaigns"
              payload: { wholesaler_id: "${w_id}", channel: "DIRECT_MAIL", headline: "Cash offer in 24 hours", target_state_code: "TX", discloses_intent_to_assign: true, discloses_unlicensed_status: true }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { mail_id: "$.data.id" }
            - call: "POST /marketing-campaigns/${mail_id}/publish"
              payload: {}
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { mail_status: "$.data.status" }
          trigger:
