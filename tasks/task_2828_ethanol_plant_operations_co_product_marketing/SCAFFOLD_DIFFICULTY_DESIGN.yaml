              captures: { err_id: $.data.error_id }
          assert:
            - "UnitTrainShipment.${sh1_id}.loading_status == SCHEDULED and railcar_count == 60"
            - "UnitTrainShipment.${sh2_id}.loading_status == SCHEDULED and railcar_count == 50"
