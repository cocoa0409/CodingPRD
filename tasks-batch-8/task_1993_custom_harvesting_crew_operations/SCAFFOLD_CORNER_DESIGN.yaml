          - roles.HarvestOperator
          - roles.CrewBoss
        distinguishing_aspect: "CrewBoss attempting POST /harvest/seasons/{id}/close is denied ERR_INSUFFICIENT_PERMISSIONS (HarvestOperator-exclusive)."
        test_recipe:
          setup: ["Season exists in SETTLING with all settlements resolved"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "GET /harvest/seasons/${season_id}"
              payload: {}
              as: HarvestOperator
              captures: { season_v: $.data.version }
          trigger:
            - call: "POST /harvest/seasons/${season_id}/close"
              payload: { expected_season_version: "${season_v}" }
              as: CrewBoss
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (captured ${err})"

      - name: billing_clerk_cannot_create_contract
        claim_type: rbac_denial
        grounds:
          - roles.GrowerLiaison
          - roles.BillingClerk
        distinguishing_aspect: "BillingClerk attempting POST /harvest/seasons/{id}/contracts is denied ERR_INSUFFICIENT_PERMISSIONS (GrowerLiaison-exclusive)."
        test_recipe:
          setup: ["Season exists"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "X", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (captured ${err})"

