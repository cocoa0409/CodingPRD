            - "after POST .../open: consolidation succeeds — HouseWaybill.${hwa}.mawb_id == ${mb1} (captured ${mb_ref}), status CONSOLIDATED"
            - "rated QUOTED: chargeable_weight_kg == 100.0, total_charge_amount == 475.00 (captured ${cw}, ${tot})"

      - name: claim_requires_hwb_delivered
