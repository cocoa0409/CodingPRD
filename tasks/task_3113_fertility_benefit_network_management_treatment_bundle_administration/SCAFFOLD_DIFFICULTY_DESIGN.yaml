# ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 instances, different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: cycle_slot_overlap_touching_interval_and_spacing_buffer
        grounds:
          - state_machines.TreatmentCycle.SCHEDULED_to_STIMULATION
          - validations[priority=12]
          - errors[ERR_CYCLE_SLOT_OVERLAP]
          - entities.TreatmentPlan.fields.min_inter_cycle_days
          - endpoints.POST_/treatment-plans/{id}/treatment-cycles
        distinguishing_aspect: "Half-open interval semantics WITH a spacing buffer: a new cycle's stimulation start is refused when it lands on the exact day the plan's minimum inter-cycle spacing closes, and is admitted one whole day later — so the buffer edge is tested at spacing - 1 against spacing, which is a different geometric treatment from an adjacency test that would admit the touching instant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E16 with bundle B16 of 6 cycles, advocate A16, member M22 CARE_ACTIVE, clinic C16 CONTRACTED at 1450000."
            - "Plan P19 with min_inter_cycle_days 14, two APPROVED authorizations AX19a (sequence 1) and AX19b (sequence 2), and cycle CY19a already driven to OUTCOME_RECORDED with transfer_date 2026-09-10."
            - "The logical clock sits at 2026-09-23, which is 13 whole days after 2026-09-10 — one day short of the 14-day spacing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E16", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
