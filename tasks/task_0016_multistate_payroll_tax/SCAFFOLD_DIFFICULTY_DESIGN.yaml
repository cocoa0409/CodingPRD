      - name: state_beats_business_referential_pay_with_terminated_employee
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_EMPLOYEE_NOT_ACTIVE]
        distinguishing_aspect: |
          When a request POST /paycheck-runs/{id}/approve targets a run that is already PAID
          (state violation, priority 5, category=state) AND its prepared employee is TERMINATED
          (Employee.status violation, priority 6, category=state) — although /approve doesn't
          consult Employee.status — the higher-priority state check fires FIRST returning
          ERR_INVALID_STATE (409), not ERR_EMPLOYEE_NOT_ACTIVE. Categories pair: state (priority 5)
          vs state (priority 6).
        test_recipe:
          setup:
            - "PaycheckRun in status PAID with at least one Paycheck"
            - "Employee status TERMINATED after the run was paid"
          setup_api_calls:
