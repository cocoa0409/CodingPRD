            - "EquipmentLease.${st} == RETURNED"
            - "EquipmentLease.${unret} == 0"

      - name: list_subscriptions_reverse_reachability
        claim_type: Standard CRUD
        grounds:
          - entities.Subscription.fields.account_id
        distinguishing_aspect: "GET /accounts/{id}/subscriptions returns the account's Subscription[] (reverse-reachability for Subscription.account_id)."
        test_recipe:
          setup:
            - "Account PLUS ACTIVE (one subscription)."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "ListSub", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
          trigger:
            - call: "GET /accounts/${acct_id}/subscriptions"
              payload: {}
              as: CustomerServiceAgent
          assert:
            - "response_type == array"
            - "meta.total_count == 1"

  # ===========================================================================
  - section: rbac
    instances:
      - name: subscriber_cannot_apply_promotion
        claim_type: peer_roles
        grounds:
          - roles.CustomerServiceAgent
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Subscriber calling POST /accounts/{id}/promotions (CSA-exclusive) -> ERR_FORBIDDEN_ROLE 403."
        test_recipe:
          setup:
            - "Catalog PLUS, Promo PX(requires_min_rank2). Account PLUS ACTIVE owned by Subscriber."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /promotion-offers"
              payload: { code: "PX", discount_kind: "PERCENT_OFF_PACKAGE", percent_off: 0.1, promo_months: 6, requires_min_rank: 2, rollback_protected: false, active: true }
              as: BillingAdmin
              captures: { px_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Sub", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/promotions"
              payload: { promotion_offer_id: "${px_id}", expected_account_version: "${v1}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: technician_not_assigned_to_visit_cannot_dispatch
        claim_type: peer_roles
        grounds:
          - roles.FieldTechnician
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "A FieldTechnician whose id != the visit's technician_id dispatching -> ERR_NOT_RESOURCE_OWNER 403."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Two techs TECH1 (assigned), TECH2 (acting). Account ACTIVE with SCHEDULED visit on TECH1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T1", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T2", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech2: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Wrong", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits/${vid}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER"

      - name: anonymous_missing_headers_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Creating an account without auth headers -> ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "NoAuth", service_state_code: "CA", contract_term_months: 0 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_downgrade_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tier-change-stale-account]
          - entities.Account.fields.version
        distinguishing_aspect: "Downgrade with expected_account_version equal to current Account.version succeeds and bumps version by 1."
        test_recipe:
          setup:
            - "Catalog BASIC(rank1 fee3000), PLUS(rank2 fee6000). Account PLUS ACTIVE."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "BASIC", name: "Basic", monthly_fee_cents: 3000, channel_count: 60, rank: 1, active: true }
              as: BillingAdmin
              captures: { basic_id: $.data.id }
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "OccOk", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
              captures: { sub_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/downgrade"
              payload: { package_id: "${basic_id}", expected_account_version: "${v1}" }
              as: CustomerServiceAgent
              captures: { new_sub: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { v2: $.data.version }
          assert:
            - "v2 == ${v1} + 1"

      - name: occ_stale_version_downgrade_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tier-change-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        distinguishing_aspect: "A second downgrade carrying the pre-first-downgrade Account.version (v1, now stale) -> ERR_STALE_ACCOUNT_VERSION 412."
        test_recipe:
          setup:
            - "Catalog BASIC(rank1), PLUS(rank2), PREMIER(rank3). Account PREMIER ACTIVE. First downgrade PREMIER->PLUS already applied (version advanced)."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "BASIC", name: "Basic", monthly_fee_cents: 3000, channel_count: 60, rank: 1, active: true }
              as: BillingAdmin
              captures: { basic_id: $.data.id }
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /channel-packages"
              payload: { tier_code: "PREMIER", name: "Premier", monthly_fee_cents: 9000, channel_count: 200, rank: 3, active: true }
              as: BillingAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "OccStale", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${prem_id}" }
              as: CustomerServiceAgent
              captures: { sub_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/downgrade"
              payload: { package_id: "${plus_id}", expected_account_version: "${v1}" }
              as: CustomerServiceAgent
              captures: { new_sub: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${new_sub}/downgrade"
              payload: { package_id: "${basic_id}", expected_account_version: "${v1}" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_ACCOUNT_VERSION"

      - name: winback_occ_stale_covered_by_difficulty
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[winback-stale-account]
        excluded_because:
          difficulty_instance: non_linear_state_machine / account_promo_cycle_rolledback_to_promoactive_winback
          rationale: "Win-back apply carrying a freshly captured account version (post-rollback) is exercised by the named §1.8 instance; the OCC field is mandatory there."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: monthly_recurring_visible_same_request_immediate
        claim_type: immediate
        grounds:
          - calculations.monthly_recurring_charge
          - entities.Account.fields.monthly_recurring_cents
        distinguishing_aspect: "After attaching an add-on, the same POST response's account view (via GET) shows the updated monthly_recurring_cents immediately (7800 = 6000+1500+300 rsf)."
        test_recipe:
          setup:
            - "Catalog PLUS(rank2 fee6000), HBOX(fee1500 min_rank2), RSF CA base300 surcharge0. Account PLUS ACTIVE (monthly 6300)."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "HBOX", name: "HBox", kind: "PREMIUM", monthly_fee_cents: 1500, min_package_rank: 2, active: true }
              as: BillingAdmin
              captures: { hbox_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "CA", base_fee_cents: 300, premier_surcharge_cents: 0, active: true }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { customer_name: "Imm", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/add-ons"
              payload: { premium_channel_id: "${hbox_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net: $.data.monthly_recurring_cents }
          assert:
            - "Account.${net} == 7800"
