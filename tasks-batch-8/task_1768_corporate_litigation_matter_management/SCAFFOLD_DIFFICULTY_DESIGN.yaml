        state-vs-business_fiscal pair: approving an engagement that is BOTH in terminal
        REJECTED state (priority 5, state) AND carries proposed_rate_cents over the firm cap
        (priority 16, business_fiscal) MUST return ERR_INVALID_STATE — the state error
        outranks the fiscal error.
      test_recipe:
        setup:
          - "a STAFFING-stage matter and an APPROVED firm with blended_rate_cap_cents=90000"
