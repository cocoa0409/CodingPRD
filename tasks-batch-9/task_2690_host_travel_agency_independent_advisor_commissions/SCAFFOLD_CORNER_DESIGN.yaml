      - name: corner_two_violated_rules_return_the_higher_priority_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=40]
          - validations[priority=56]
          - validations[priority=62]
          - validations[priority=66]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_advisor_beats_missing_supplier_accreditation
          rationale: "Both priority pairs are asserted by the two §1.8 priority_pair_validation_conflict instances, each of which also proves the loser fires alone once the winner is cured."

      - name: corner_individually_legal_bookings_breach_client_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority=66]
          - entities.Client.fields.max_concurrent_trips
        excluded_because:
          difficulty_instance: resource_temporal_overlap / client_travel_window_half_open_aggregate_capacity
          rationale: "That instance admits two overlapping bookings under max_concurrent_trips 2 and rejects the third with ERR_TRAVEL_WINDOW_CONFLICT, which is exactly the aggregate-limit claim."

      - name: corner_operation_valid_now_creates_a_future_coverage_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=65]
          - validations[priority=68]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / credential_coverage_closed_interval_touching_endpoints_collide
          rationale: "The closed-interval coverage rule, including the touching-endpoint collision and the disjoint refile that succeeds, is asserted there against the same endpoint."

