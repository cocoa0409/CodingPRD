scenario: |
  SSDI Disability Insurance Application: work credit requirement (QC), medical
  evidence, Listings/RFC, ALJ hearing scheduling, Back Pay, SSI supplemental,
  child auxiliary, CDR periodic review

domain_name: ssdi-disability-application
api_prefix: /ssdi

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - name: ssn_last4
        type: string
        source: input
        description: last four digits of Social Security Number, used for identity
        constraints: "4 digits, [0-9]{4}"
      - name: full_name
        type: string
        source: input
        description: claimant legal name
      - name: date_of_birth
        type: datetime
        source: input
        description: birth date, ISO 8601; used for age-bucket QC rules
      - name: filing_state
        type: string
        source: input
        description: USPS 2-letter state code for SSI supplement eligibility
        constraints: "2 uppercase letters"
      - name: monthly_income_cents
        type: integer
        source: input
        description: countable monthly unearned income in cents; used by SSI supplement calc
        default: 0
      - name: countable_resources_cents
        type: integer
        source: input
        description: countable resources in cents; used by SSI supplement eligibility (limit 2000 USD)
        default: 0

  - name: WorkCreditRecord
    parent: null
    common_fields: true
    fields:
      - name: claimant_id
        type: string
        source: input
        description: "FK -> Claimant.id; the claimant this credit record belongs to"
      - name: year
        type: integer
        source: input
        description: calendar year the credits were earned
        constraints: "1990 <= year <= 2099"
      - name: credits_earned
        type: integer
        source: input
        description: quarters of coverage earned that year (0-4)
        constraints: "0 <= credits_earned <= 4"
      - name: earnings_cents
        type: integer
        source: input
        description: total reported earnings for the year in cents

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: claimant_id
        type: string
        source: input
        description: "FK -> Claimant.id; the claimant filing this application"
      - name: alleged_onset_date
        type: datetime
        source: input
        description: "AOD: the date the claimant alleges disability began (ISO 8601)"
      - name: filing_date
        type: datetime
        source: system
        description: server-stamped at POST creation; ISO 8601 UTC
      - name: protective_filing_date
        type: datetime
        source: input
        description: "PFD: optional protective filing date; defaults to filing_date if not provided"
      - name: status
        type: enum
        source: computed
        description: lifecycle state
        constraints: "DRAFT | QC_REVIEW | MEDICAL_REVIEW | DENIED_QC | DENIED_MEDICAL | APPROVED_INITIAL | RECONSIDERATION | ALJ_PENDING | ALJ_APPROVED | ALJ_DENIED | AWARDED | CDR_FROZEN | CESSATION | CLOSED"
      - name: insured_status
        type: enum
        source: computed
        description: result of QC check
        constraints: "PENDING | INSURED | NOT_INSURED"
      - name: total_qc_at_filing
        type: integer
        source: computed
        description: total quarters of coverage at filing; computed by calc qc_count
      - name: recent_qc_in_lookback
        type: integer
        source: computed
        description: quarters of coverage in 40-quarter lookback window ending at filing_date
      - name: medical_decision
        type: enum
        source: computed
        description: medical reviewer determination
        constraints: "PENDING | LISTING_MET | RFC_DISABLED | NOT_DISABLED"
      - name: established_onset_date
        type: datetime
        source: computed
        description: "EOD: medical examiner-set onset date (cannot precede AOD)"
        default: null
      - name: claim_type
        type: enum
        source: input
        description: SSDI only or concurrent SSI supplement
        constraints: "SSDI_ONLY | CONCURRENT_SSDI_SSI"
        default: SSDI_ONLY

  - name: MedicalEvidence
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this evidence supports"
      - name: source_type
        type: enum
        source: input
        description: type of medical source
        constraints: "TREATING_PHYSICIAN | CONSULTATIVE_EXAM | HOSPITAL_RECORD | SPECIALIST_REPORT"
      - name: report_date
        type: datetime
        source: input
        description: date of the medical report (ISO 8601)
      - name: diagnosis_code
        type: string
        source: input
        description: ICD-10 diagnosis code or SSA Listing reference (e.g., "1.04A")
      - name: severity_score
        type: integer
        source: input
        description: examiner-assessed severity 0-100
        constraints: "0 <= severity_score <= 100"

  - name: MedicalDeterminationDecision
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this decision applies to"
      - name: decision_type
        type: enum
        source: input
        description: how the determination was reached
        constraints: "LISTING_MET | RFC_DISABLED | NOT_DISABLED"
      - name: listing_reference
        type: string
        source: input
        description: SSA Listing of Impairments reference (required if decision_type=LISTING_MET)
        default: null
      - name: rfc_score
        type: integer
        source: input
        description: residual functional capacity score 0-100 (required if decision_type=RFC_DISABLED or NOT_DISABLED)
        default: null
      - name: established_onset_date
        type: datetime
        source: input
        description: examiner's medically determined onset date
      - name: examiner_user_id
        type: string
        source: system
        description: server-stamped DDS examiner X-User-ID

  - name: HearingRequest
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application being appealed"
      - name: requested_date
        type: datetime
        source: system
        description: server-stamped at hearing request creation
      - name: scheduled_date
        type: datetime
        source: input
        description: scheduled ALJ hearing date (set by ALJ scheduler, must be >= requested_date + 75 days)
        default: null
      - name: status
        type: enum
        source: computed
        description: hearing lifecycle
        constraints: "REQUESTED | SCHEDULED | HELD | APPROVED | DENIED | CANCELLED"
      - name: alj_user_id
        type: string
        source: input
        description: ALJ X-User-ID assigned to hear the case
        default: null

  - name: BenefitAward
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; one award per approved application"
      - name: primary_insurance_amount_cents
        type: integer
        source: computed
        description: monthly PIA in cents based on claimant earnings (simplified bend-point formula)
      - name: monthly_benefit_cents
        type: integer
        source: computed
        description: monthly cash benefit; equals PIA for primary insured
      - name: back_pay_cents
        type: integer
        source: computed
        description: lump-sum retroactive back pay in cents; see calc back_pay_amount
      - name: back_pay_variant
        type: enum
        source: computed
        description: which variant produced back_pay_cents
        constraints: "INITIAL_APPROVAL | ALJ_APPROVAL"
      - name: entitlement_start_date
        type: datetime
        source: computed
        description: first month of entitlement (EOD + 5-month waiting period, but no earlier than PFD - 12 months)
      - name: status
        type: enum
        source: computed
        description: award lifecycle
        constraints: "ACTIVE | SUSPENDED | TERMINATED"

  - name: ChildAuxiliaryBenefit
    parent: null
    common_fields: true
    fields:
      - name: benefit_award_id
        type: string
        source: input
        description: "FK -> BenefitAward.id; the primary award this auxiliary attaches to"
      - name: child_full_name
        type: string
        source: input
        description: child's legal name
      - name: child_date_of_birth
        type: datetime
        source: input
        description: child birth date (ISO 8601); must be under 18 at award creation
      - name: relationship
        type: enum
        source: input
        description: relationship to primary claimant
        constraints: "BIOLOGICAL | ADOPTED | STEPCHILD"
      - name: monthly_amount_cents
        type: integer
        source: computed
        description: child auxiliary monthly amount = round(PIA * 0.50); subject to family max
      - name: status
        type: enum
        source: computed
        description: lifecycle
        constraints: "ACTIVE | TERMINATED_AGE | TERMINATED_PARENT"

  - name: SSISupplement
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the concurrent application; requires claim_type=CONCURRENT_SSDI_SSI"
      - name: monthly_supplement_cents
        type: integer
        source: computed
        description: SSI supplement = max(0, FEDERAL_BENEFIT_RATE - countable_income); see calc ssi_supplement_amount
      - name: state_supplement_cents
        type: integer
        source: computed
        description: state-specific supplement (CA=2050, NY=8700, others=0)
      - name: status
        type: enum
        source: computed
        description: lifecycle
        constraints: "ACTIVE | INELIGIBLE_RESOURCES | TERMINATED"

  - name: CDRReview
    parent: null
    common_fields: true
    fields:
      - name: benefit_award_id
        type: string
        source: input
        description: "FK -> BenefitAward.id; the award being reviewed"
      - name: scheduled_review_date
        type: datetime
        source: computed
        description: server-computed next CDR date based on diary classification
      - name: diary_classification
        type: enum
        source: input
        description: medical improvement expectation
        constraints: "MIE | MIP | MINE"
      - name: outcome
        type: enum
        source: input
        description: CDR result set when review completed
        constraints: "PENDING | CONTINUED | CESSATION"
        default: PENDING
      - name: completion_date
        type: datetime
        source: input
        description: date CDR was completed
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [DENIED_QC, CLOSED, CESSATION]
    transitions:
      - from: DRAFT
        to: QC_REVIEW
        trigger: "POST /ssdi/applications/{id}/submit"
        actor: Claimant
        preconditions:
          - "application.status == DRAFT"
          - "claimant exists and date_of_birth is set"
        side_effects:
          - "compute Application.total_qc_at_filing via calc qc_count"
          - "compute Application.recent_qc_in_lookback via calc qc_count (lookback variant)"
          - "compute Application.insured_status: INSURED if total_qc_at_filing >= required_total_qc(age) AND recent_qc_in_lookback >= 20, else NOT_INSURED"
          - "set Application.filing_date = NOW; default protective_filing_date = filing_date if null"
          - "increment Application.version"
          - "if insured_status == INSURED: auto-transition to MEDICAL_REVIEW; if NOT_INSURED: auto-transition to DENIED_QC"

      - from: QC_REVIEW
        to: MEDICAL_REVIEW
        trigger: "auto: triggered by submit when insured_status=INSURED"
        actor: system
        preconditions:
          - "Application.insured_status == INSURED"
        side_effects:
          - "set Application.status = MEDICAL_REVIEW"

      - from: QC_REVIEW
        to: DENIED_QC
        trigger: "auto: triggered by submit when insured_status=NOT_INSURED"
        actor: system
        preconditions:
          - "Application.insured_status == NOT_INSURED"
        side_effects:
          - "set Application.status = DENIED_QC (terminal)"

      - from: MEDICAL_REVIEW
        to: APPROVED_INITIAL
        trigger: "POST /ssdi/applications/{id}/medical-decision (decision_type=LISTING_MET or RFC_DISABLED)"
        actor: DDSExaminer
        preconditions:
          - "Application.status == MEDICAL_REVIEW"
          - "at least one MedicalEvidence row exists with application_id == this"
          - "decision.established_onset_date >= Application.alleged_onset_date"
        side_effects:
          - "create MedicalDeterminationDecision with examiner_user_id = X-User-ID"
          - "set Application.medical_decision = decision_type, established_onset_date = decision.established_onset_date"
          - "create BenefitAward with back_pay_variant = INITIAL_APPROVAL; compute monthly_benefit_cents via calc pia_amount; compute back_pay_cents via calc back_pay_amount (variant INITIAL_APPROVAL)"
          - "if Application.claim_type == CONCURRENT_SSDI_SSI: create SSISupplement; compute monthly_supplement_cents via calc ssi_supplement_amount"
          - "schedule CDRReview via calc cdr_schedule"
          - "increment Application.version"

      - from: MEDICAL_REVIEW
        to: DENIED_MEDICAL
        trigger: "POST /ssdi/applications/{id}/medical-decision (decision_type=NOT_DISABLED)"
        actor: DDSExaminer
        preconditions:
          - "Application.status == MEDICAL_REVIEW"
        side_effects:
          - "create MedicalDeterminationDecision with decision_type=NOT_DISABLED"
          - "set Application.medical_decision = NOT_DISABLED"
          - "increment Application.version"

      - from: DENIED_MEDICAL
        to: RECONSIDERATION
        trigger: "POST /ssdi/applications/{id}/request-reconsideration"
        actor: Claimant
        preconditions:
          - "Application.status == DENIED_MEDICAL"
          - "NOW <= MedicalDeterminationDecision.created_at + 60 days"
        side_effects:
          - "set Application.status = RECONSIDERATION; medical_decision = PENDING"
          - "increment Application.version"

      - from: RECONSIDERATION
        to: ALJ_PENDING
        trigger: "POST /ssdi/applications/{id}/request-hearing"
        actor: Claimant
        preconditions:
          - "Application.status == RECONSIDERATION"
        side_effects:
          - "create HearingRequest with status=REQUESTED"
          - "set Application.status = ALJ_PENDING"
          - "increment Application.version"

      - from: ALJ_PENDING
        to: ALJ_APPROVED
        trigger: "POST /ssdi/hearings/{id}/decision (outcome=APPROVED)"
        actor: ALJ
        preconditions:
          - "HearingRequest.status == SCHEDULED"
          - "HearingRequest.scheduled_date <= NOW (hearing has occurred)"
        side_effects:
          - "set HearingRequest.status = APPROVED"
          - "set Application.status = ALJ_APPROVED; medical_decision = RFC_DISABLED"
          - "create BenefitAward with back_pay_variant = ALJ_APPROVAL; compute back_pay_cents via calc back_pay_amount (variant ALJ_APPROVAL)"
          - "if Application.claim_type == CONCURRENT_SSDI_SSI: create SSISupplement"
          - "schedule CDRReview"
          - "increment Application.version"

      - from: ALJ_PENDING
        to: ALJ_DENIED
        trigger: "POST /ssdi/hearings/{id}/decision (outcome=DENIED)"
        actor: ALJ
        preconditions:
          - "HearingRequest.status == SCHEDULED"
        side_effects:
          - "set HearingRequest.status = DENIED"
          - "set Application.status = ALJ_DENIED (terminal-ish)"
          - "increment Application.version"

      - from: APPROVED_INITIAL
        to: AWARDED
        trigger: "auto: cascade from BenefitAward creation in APPROVED_INITIAL or ALJ_APPROVED transition"
        actor: system
        preconditions:
          - "BenefitAward exists with application_id == this and status == ACTIVE"
        side_effects:
          - "set Application.status = AWARDED"

      - from: ALJ_APPROVED
        to: AWARDED
        trigger: "auto: cascade from BenefitAward creation"
        actor: system
        preconditions:
          - "BenefitAward exists with application_id == this and status == ACTIVE"
        side_effects:
          - "set Application.status = AWARDED"

      - from: AWARDED
        to: CDR_FROZEN
        trigger: "POST /ssdi/cdr-reviews/{id}/start"
        actor: SSAAdmin
        preconditions:
          - "Application.status == AWARDED"
          - "CDRReview.scheduled_review_date <= NOW"
        side_effects:
          - "set Application.status = CDR_FROZEN (no benefit changes accepted during review)"
          - "increment Application.version"

      - from: CDR_FROZEN
        to: AWARDED
        trigger: "POST /ssdi/cdr-reviews/{id}/complete (outcome=CONTINUED)"
        actor: SSAAdmin
        preconditions:
          - "Application.status == CDR_FROZEN"
        side_effects:
          - "set CDRReview.outcome = CONTINUED, completion_date = NOW"
          - "set Application.status = AWARDED"
          - "schedule next CDRReview via calc cdr_schedule"
          - "increment Application.version"

      - from: CDR_FROZEN
        to: CESSATION
        trigger: "POST /ssdi/cdr-reviews/{id}/complete (outcome=CESSATION)"
        actor: SSAAdmin
        preconditions:
          - "Application.status == CDR_FROZEN"
        side_effects:
          - "set CDRReview.outcome = CESSATION, completion_date = NOW"
          - "set Application.status = CESSATION (terminal)"
          - "cascade: set BenefitAward.status = TERMINATED"
          - "cascade: set all ChildAuxiliaryBenefit.status = TERMINATED_PARENT (because primary lost; the child loss is caused by the award termination, which is caused by the CDR cessation)"
          - "cascade: if SSISupplement exists, set SSISupplement.status = TERMINATED"
          - "increment Application.version"

  - entity: HearingRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /ssdi/hearings/{id}/schedule"
        actor: ALJ
        preconditions:
          - "HearingRequest.status == REQUESTED"
          - "scheduled_date >= requested_date + 75 days"
          - "Application.status == ALJ_PENDING"
        side_effects:
          - "set HearingRequest.status = SCHEDULED; alj_user_id = X-User-ID; scheduled_date = payload.scheduled_date"
          - "increment HearingRequest.version"

      - from: SCHEDULED
        to: HELD
        trigger: "POST /ssdi/hearings/{id}/record-held"
        actor: ALJ
        preconditions:
          - "HearingRequest.status == SCHEDULED"
          - "HearingRequest.scheduled_date <= NOW"
        side_effects:
          - "set HearingRequest.status = HELD"
          - "increment HearingRequest.version"

      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /ssdi/hearings/{id}/decision (outcome=APPROVED)"
        actor: ALJ
        preconditions:
          - "HearingRequest.status == SCHEDULED"
        side_effects:
          - "see Application.ALJ_PENDING -> ALJ_APPROVED"

      - from: SCHEDULED
        to: DENIED
        trigger: "POST /ssdi/hearings/{id}/decision (outcome=DENIED)"
        actor: ALJ
        preconditions:
          - "HearingRequest.status == SCHEDULED"
        side_effects:
          - "see Application.ALJ_PENDING -> ALJ_DENIED"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /ssdi/hearings/{id}/cancel"
        actor: Claimant
        preconditions:
          - "HearingRequest.status == REQUESTED"
        side_effects:
          - "set HearingRequest.status = CANCELLED"
          - "set Application.status = RECONSIDERATION (reverts so claimant can re-request)"
          - "increment HearingRequest.version"

  - entity: BenefitAward
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ssdi/awards/{id}/suspend"
        actor: BenefitsAdmin
        preconditions:
          - "BenefitAward.status == ACTIVE"
        side_effects:
          - "set BenefitAward.status = SUSPENDED"
          - "cascade: set all ChildAuxiliaryBenefit (with benefit_award_id==this).status = TERMINATED_PARENT"
          - "increment BenefitAward.version"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ssdi/awards/{id}/reinstate"
        actor: BenefitsAdmin
        preconditions:
          - "BenefitAward.status == SUSPENDED"
        side_effects:
          - "set BenefitAward.status = ACTIVE"
          - "note: child auxiliary records are NOT auto-reinstated; must be re-created"
          - "increment BenefitAward.version"

      - from: ACTIVE
        to: TERMINATED
        trigger: "auto: cascade from Application.CDR_FROZEN -> CESSATION"
        actor: system
        preconditions:
          - "Application.status == CESSATION"
        side_effects:
          - "set BenefitAward.status = TERMINATED"

  - entity: ChildAuxiliaryBenefit
    initial_state: ACTIVE
    terminal_states: [TERMINATED_AGE, TERMINATED_PARENT]
    transitions:
      - from: ACTIVE
        to: TERMINATED_AGE
        trigger: "POST /ssdi/_clock/advance (causes child to cross age 18 boundary)"
        actor: system
        preconditions:
          - "child age (NOW - child_date_of_birth) >= 18 years"
        side_effects:
          - "set ChildAuxiliaryBenefit.status = TERMINATED_AGE"

      - from: ACTIVE
        to: TERMINATED_PARENT
        trigger: "auto: cascade from BenefitAward suspension or Application cessation"
        actor: system
        preconditions:
          - "BenefitAward.status IN {SUSPENDED, TERMINATED}"
        side_effects:
          - "set ChildAuxiliaryBenefit.status = TERMINATED_PARENT"

  - entity: CDRReview
    initial_state: PENDING
    terminal_states: [CONTINUED, CESSATION]
    transitions:
      - from: PENDING
        to: CONTINUED
        trigger: "POST /ssdi/cdr-reviews/{id}/complete (outcome=CONTINUED)"
        actor: SSAAdmin
        preconditions:
          - "CDRReview.outcome == PENDING"
          - "Application.status == CDR_FROZEN"
        side_effects:
          - "see Application.CDR_FROZEN -> AWARDED"

      - from: PENDING
        to: CESSATION
        trigger: "POST /ssdi/cdr-reviews/{id}/complete (outcome=CESSATION)"
        actor: SSAAdmin
        preconditions:
          - "CDRReview.outcome == PENDING"
          - "Application.status == CDR_FROZEN"
        side_effects:
          - "see Application.CDR_FROZEN -> CESSATION"

# §1.2.1 Concurrency Rules
concurrency_rules:
  - rule_id: child_auxiliary_create_stale_award
    parent_entity: BenefitAward
    write_endpoint: "POST /ssdi/awards/{id}/child-auxiliaries"
    occ_field: expected_benefit_award_version
    description: |
      Creating a ChildAuxiliaryBenefit against a BenefitAward whose version has
      advanced since the client last observed it is rejected with stale-version.
      Captures the case where another writer has just suspended the award
      (legitimately superseding the prior steady-state under the suspension
      transition) and this writer's view of the award is therefore stale.
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412

  - rule_id: medical_decision_stale_application
    parent_entity: Application
    write_endpoint: "POST /ssdi/applications/{id}/medical-decision"
    occ_field: expected_application_version
    description: |
      A DDSExaminer's medical decision against an Application whose version has
      advanced since they began drafting (e.g., the claimant amended the
      application via a separate path that bumped version) is rejected with
      stale-version. This guards against silently overwriting a state that the
      examiner did not observe.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: qc_count
    trigger: "Application transition DRAFT -> QC_REVIEW (auto on submit)"
    algorithm: aggregation
    formula: |
      total_qc_at_filing = sum(WorkCreditRecord.credits_earned
                               for WorkCreditRecord where
                               claimant_id == application.claimant_id
                               AND year <= year(application.filing_date))

      recent_qc_in_lookback = sum(WorkCreditRecord.credits_earned
                                  for WorkCreditRecord where
                                  claimant_id == application.claimant_id
                                  AND lookback_start_year <= year <= year(application.filing_date))

      where lookback_start_year = year(application.filing_date) - 10

      required_total_qc(age_at_filing):
        if age_at_filing < 24:  required = 6
        elif age_at_filing < 31: required = (age_at_filing - 20) * 4
        else: required = 40   # cap

      insured_status = INSURED if (total_qc_at_filing >= required_total_qc(age))
                                AND (recent_qc_in_lookback >= 20)
                       else NOT_INSURED
    input_set: "all WorkCreditRecord rows where claimant_id matches; no status filter (records are immutable)"
    constants:
      LOOKBACK_QUARTERS: 40
      LOOKBACK_YEARS: 10
      RECENT_QC_THRESHOLD: 20
      MAX_REQUIRED_TOTAL_QC: 40
    precision: "integer arithmetic; no decimals"
    variants:
      - name: total
        when: "total quarters check"
        difference: "sum over all years up to and including filing year"
      - name: lookback
        when: "recent-work check"
        difference: "sum restricted to filing_year - 10 .. filing_year inclusive"

  - name: pia_amount
    trigger: "Application transition MEDICAL_REVIEW -> APPROVED_INITIAL or ALJ_PENDING -> ALJ_APPROVED"
    algorithm: tiered_pricing
    formula: |
      # Simplified bend-point AIME -> PIA formula. AIME = average monthly earnings.
      aime_cents = round(
        sum(WorkCreditRecord.earnings_cents
            for top-N years among records of this claimant) / (N * 12),
        0
      )
      where N = min(35, count of years with credits_earned > 0)

      # Bend points (2024 values) in cents:
      BEND1 = 117400      # 1174.00 USD
      BEND2 = 707900      # 7079.00 USD

      tier1 = min(aime_cents, BEND1)
      tier2 = min(max(0, aime_cents - BEND1), BEND2 - BEND1)
      tier3 = max(0, aime_cents - BEND2)

      pia_cents = round(0.90 * tier1, 0) + round(0.32 * tier2, 0) + round(0.15 * tier3, 0)
      # Per-tier round-then-sum, NOT sum-then-round (the order is pinned).
    input_set: "all WorkCreditRecord rows for claimant; pick top N years by earnings_cents; tie-break by year ASC"
    constants:
      BEND1_CENTS: 117400
      BEND2_CENTS: 707900
      TIER1_RATE: 0.90
      TIER2_RATE: 0.32
      TIER3_RATE: 0.15
      AIME_DIVISOR_CAP: 35
    precision: "round to nearest cent (round_half_up) PER TIER, then sum"

  - name: back_pay_amount
    trigger: "BenefitAward creation on APPROVED_INITIAL or ALJ_APPROVED transitions"
    algorithm: forward_looking
    formula: |
      # Both variants share monthly_benefit (= pia_cents) but differ in retroactive_months.

      eod = decision.established_onset_date
      pfd = application.protective_filing_date
      now = NOW
      pia = pia_amount(...)

      # 5-month waiting period (SSDI standard)
      entitlement_start = first day of (month_of(eod) + 5 months)

      # Retroactive cap: SSDI Back Pay limited to max 12 months before PFD
      retroactive_floor = pfd - 12 months (first day of that month)
      effective_start = max(entitlement_start, retroactive_floor)

      decision_date = (variant=INITIAL_APPROVAL ? MedicalDeterminationDecision.created_at : HearingRequest decision call NOW)

      # Variant difference: which "approval date" caps the back-pay window
      retroactive_months = months_between(effective_start, decision_date)
      retroactive_months = max(0, retroactive_months)

      back_pay_cents = pia * retroactive_months
    input_set: |
      uses Application.protective_filing_date, MedicalDeterminationDecision.established_onset_date,
      and PIA from calc pia_amount; the variant is determined by which transition triggered creation.
    constants:
      WAITING_PERIOD_MONTHS: 5
      MAX_RETROACTIVE_MONTHS_BEFORE_PFD: 12
    precision: "integer cents"
    variants:
      - name: INITIAL_APPROVAL
        when: "BenefitAward created from MEDICAL_REVIEW -> APPROVED_INITIAL"
        difference: |
          decision_date = MedicalDeterminationDecision.created_at; the retroactive
          months close at the DDS examiner's decision date. Because DDS decisions
          typically land within 3-6 months of filing, retroactive_months is small
          or zero for this variant.
      - name: ALJ_APPROVAL
        when: "BenefitAward created from ALJ_PENDING -> ALJ_APPROVED"
        difference: |
          decision_date = NOW at ALJ decision (often 12-24 months after filing).
          Same EOD, same PFD, same PIA, but the longer window means back_pay_cents
          can exceed the 12-month cap and saturate at retroactive_floor. The two
          variants therefore produce different back_pay_cents for identical claimant data.

  - name: ssi_supplement_amount
    trigger: "SSISupplement creation cascade from Application APPROVED_INITIAL or ALJ_APPROVED"
    algorithm: threshold
    formula: |
      # Resource eligibility gate (boundary precision: STRICT > 2000_USD = 200000 cents fails)
      if claimant.countable_resources_cents > 200000:  # > $2,000
          set SSISupplement.status = INELIGIBLE_RESOURCES
          set monthly_supplement_cents = 0
          set state_supplement_cents = 0
          return

      # Federal Benefit Rate (2024 single individual)
      FBR_CENTS = 94300  # $943.00

      # Countable income = claimant.monthly_income_cents minus general exclusion
      GENERAL_EXCLUSION = 2000  # $20.00 disregard
      countable_income = max(0, claimant.monthly_income_cents - GENERAL_EXCLUSION)

      monthly_supplement_cents = max(0, FBR_CENTS - countable_income - SSDI_monthly_benefit_cents)

      # State supplement (lookup table)
      state_supplement_cents = STATE_SUPPLEMENT_TABLE[claimant.filing_state]  # default 0
    input_set: "single Claimant row + BenefitAward.monthly_benefit_cents"
    constants:
      FBR_CENTS: 94300
      RESOURCE_LIMIT_CENTS: 200000
      GENERAL_EXCLUSION_CENTS: 2000
      STATE_SUPPLEMENT_TABLE:
        CA: 2050
        NY: 8700
    precision: "integer cents"

  - name: child_auxiliary_amount
    trigger: "ChildAuxiliaryBenefit creation via POST /ssdi/awards/{id}/child-auxiliaries"
    algorithm: aggregation
    formula: |
      base = round(BenefitAward.primary_insurance_amount_cents * 0.50, 0)

      # Family maximum cap: total family benefit cannot exceed 1.75 * PIA
      family_max = round(BenefitAward.primary_insurance_amount_cents * 1.75, 0)
      existing_aux_total = sum(ChildAuxiliaryBenefit.monthly_amount_cents
                               for ChildAuxiliaryBenefit where
                               benefit_award_id == this AND status == ACTIVE)
      headroom = family_max - BenefitAward.monthly_benefit_cents - existing_aux_total

      monthly_amount_cents = min(base, max(0, headroom))
      # If headroom <= 0, the new auxiliary is rejected with ERR_FAMILY_MAX_EXCEEDED
      # (this is enforced as a validation, not silently set to 0).
    input_set: |
      BenefitAward.primary_insurance_amount_cents and all existing ACTIVE
      ChildAuxiliaryBenefit rows with the same benefit_award_id; tie-break /
      processing order = ChildAuxiliaryBenefit.created_at ASC.
    constants:
      CHILD_RATE: 0.50
      FAMILY_MAX_MULTIPLIER: 1.75
    precision: "round half up to nearest cent"

  - name: cdr_schedule
    trigger: "BenefitAward creation (initial) and CDRReview transition PENDING -> CONTINUED (next review)"
    algorithm: threshold
    formula: |
      # Schedule the next CDR based on diary classification
      diary = CDRReview.diary_classification (default MIE on first scheduling)

      if diary == MIE:    next_review = NOW + 18 months
      elif diary == MIP:  next_review = NOW + 36 months   # 3 years
      elif diary == MINE: next_review = NOW + 84 months   # 7 years

      CDRReview.scheduled_review_date = next_review
    input_set: "single CDRReview row"
    constants:
      MIE_MONTHS: 18
      MIP_MONTHS: 36
      MINE_MONTHS: 84
    precision: "datetime, day resolution"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "request has both X-User-ID and X-User-Role headers"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted by §1.7 for this endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "all path-template ids resolve to extant resources, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "all FK-referenced ids in payload (claimant_id, application_id, benefit_award_id) resolve"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Application.status matches the from-state of the requested transition"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /ssdi/applications/{id}/submit, /medical-decision, /request-reconsideration, /request-hearing"

  - priority: 6
    category: state
    check: "HearingRequest.status matches required from-state"
    error_id: ERR_INVALID_HEARING_STATE
    http_status: 409
    applies_to: "POST /ssdi/hearings/{id}/schedule, /record-held, /decision, /cancel"

  - priority: 7
    category: state
    check: "CDR cannot start unless scheduled_review_date <= NOW"
    error_id: ERR_CDR_NOT_DUE
    http_status: 409
    applies_to: "POST /ssdi/cdr-reviews/{id}/start"

  - priority: 8
    category: business_referential
    check: "stale parent version: payload.expected_<parent>_version != current parent.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /ssdi/applications/{id}/medical-decision"

  - priority: 9
    category: business_referential
    check: "stale BenefitAward version on child-auxiliary creation"
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412
    applies_to: "POST /ssdi/awards/{id}/child-auxiliaries"

  - priority: 10
    category: business_safety
    check: "MedicalDeterminationDecision.established_onset_date >= Application.alleged_onset_date (EOD cannot precede AOD)"
    error_id: ERR_EOD_BEFORE_AOD
    http_status: 422
    applies_to: "POST /ssdi/applications/{id}/medical-decision"

  - priority: 11
    category: business_safety
    check: "decision_type == LISTING_MET requires non-null listing_reference"
    error_id: ERR_LISTING_REFERENCE_REQUIRED
    http_status: 422
    applies_to: "POST /ssdi/applications/{id}/medical-decision"

  - priority: 12
    category: business_temporal
    check: "scheduled_date >= requested_date + 75 days (ALJ hearing minimum lead time)"
    error_id: ERR_HEARING_LEAD_TIME
    http_status: 422
    applies_to: "POST /ssdi/hearings/{id}/schedule"

  - priority: 13
    category: business_temporal
    check: "reconsideration must be requested within 60 days of denial"
    error_id: ERR_RECONSIDERATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /ssdi/applications/{id}/request-reconsideration"

  - priority: 14
    category: business_constraint
    check: "child age (NOW - child_date_of_birth) < 18 years at creation time"
    error_id: ERR_CHILD_OVER_AGE
    http_status: 422
    applies_to: "POST /ssdi/awards/{id}/child-auxiliaries"

  - priority: 15
    category: business_fiscal
    check: "child auxiliary cannot exceed family-max headroom (1.75 * PIA - existing benefits)"
    error_id: ERR_FAMILY_MAX_EXCEEDED
    http_status: 422
    applies_to: "POST /ssdi/awards/{id}/child-auxiliaries"

  - priority: 16
    category: business_constraint
    check: "SSI supplement requires Application.claim_type == CONCURRENT_SSDI_SSI"
    error_id: ERR_SSI_NOT_REQUESTED
    http_status: 422
    applies_to: "auto on APPROVED_INITIAL/ALJ_APPROVED transitions"

  - priority: 17
    category: business_constraint
    check: "WorkCreditRecord.year unique per (claimant_id, year)"
    error_id: ERR_DUPLICATE_CREDIT_YEAR
    http_status: 409
    applies_to: "POST /ssdi/work-credits"

  - priority: 18
    category: business_constraint
    check: "filing_state must be in 2-letter USPS code set"
    error_id: ERR_INVALID_STATE_CODE
    http_status: 422
    applies_to: "POST /ssdi/claimants"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Claimant ----
  - method: POST
    path: "/ssdi/claimants"
    description: register a new claimant
    roles: ["Claimant", "SSAAdmin"]
    code: 201
    input: ["ssn_last4", "full_name", "date_of_birth", "filing_state", "monthly_income_cents?", "countable_resources_cents?"]
    output: Claimant
    side_effects:
      - "create Claimant; X-User-ID becomes the Claimant.id when role=Claimant"

  - method: GET
    path: "/ssdi/claimants/{id}"
    description: fetch a claimant
    roles: ["Claimant", "SSAAdmin", "DDSExaminer", "ALJ", "BenefitsAdmin"]
    code: 200
    input: []
    output: Claimant
    side_effects: []

  - method: GET
    path: "/ssdi/claimants"
    description: list claimants with pagination
    roles: ["SSAAdmin"]
    code: 200
    input: ["limit?", "offset?"]
    output: Claimant[]
    side_effects: []

  # ---- WorkCreditRecord ----
  - method: POST
    path: "/ssdi/work-credits"
    description: post a year's worth of work credits
    roles: ["SSAAdmin"]
    code: 201
    input: ["claimant_id", "year", "credits_earned", "earnings_cents"]
    output: WorkCreditRecord
    side_effects:
      - "create WorkCreditRecord (no side-effect on Application; QC counted at submit)"

  - method: GET
    path: "/ssdi/work-credits/{id}"
    description: fetch a single work credit record
    roles: ["SSAAdmin", "Claimant"]
    code: 200
    input: []
    output: WorkCreditRecord
    side_effects: []

  - method: GET
    path: "/ssdi/work-credits"
    description: list work credits, filterable by claimant_id
    roles: ["SSAAdmin", "Claimant"]
    code: 200
    input: ["claimant_id?", "limit?", "offset?"]
    output: WorkCreditRecord[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/ssdi/applications"
    description: create a draft application
    roles: ["Claimant", "SSAAdmin"]
    code: 201
    input: ["claimant_id", "alleged_onset_date", "protective_filing_date?", "claim_type?"]
    output: Application
    side_effects:
      - "create Application with status=DRAFT, version=1"

  - method: GET
    path: "/ssdi/applications/{id}"
    description: fetch an application
    roles: ["Claimant", "SSAAdmin", "DDSExaminer", "ALJ", "BenefitsAdmin"]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/ssdi/applications"
    description: list applications, filterable by claimant_id
    roles: ["SSAAdmin", "Claimant", "DDSExaminer"]
    code: 200
    input: ["claimant_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/ssdi/applications/{id}/submit"
    description: submit a draft for QC review; auto-computes insured_status and routes
    roles: ["Claimant"]
    code: 200
    input: []
    output: Application
    side_effects:
      - "compute total_qc_at_filing and recent_qc_in_lookback (calc qc_count)"
      - "set insured_status and auto-transition to MEDICAL_REVIEW or DENIED_QC"
      - "increment Application.version"

  - method: POST
    path: "/ssdi/applications/{id}/medical-decision"
    description: DDS examiner records the medical determination
    roles: ["DDSExaminer"]
    code: 201
    input: ["decision_type", "established_onset_date", "listing_reference?", "rfc_score?", "expected_application_version"]
    output: MedicalDeterminationDecision
    side_effects:
      - "create MedicalDeterminationDecision"
      - "transition Application to APPROVED_INITIAL or DENIED_MEDICAL"
      - "on APPROVED_INITIAL: cascade-create BenefitAward (variant INITIAL_APPROVAL), schedule CDR, optional SSISupplement"
      - "increment Application.version by 1"

  - method: POST
    path: "/ssdi/applications/{id}/request-reconsideration"
    description: claimant appeals a medical denial
    roles: ["Claimant"]
    code: 200
    input: []
    output: Application
    side_effects:
      - "transition Application from DENIED_MEDICAL to RECONSIDERATION"
      - "increment Application.version"

  - method: POST
    path: "/ssdi/applications/{id}/request-hearing"
    description: claimant escalates to ALJ
    roles: ["Claimant"]
    code: 201
    input: []
    output: HearingRequest
    side_effects:
      - "create HearingRequest with status=REQUESTED"
      - "transition Application from RECONSIDERATION to ALJ_PENDING"
      - "increment Application.version"

  # ---- MedicalEvidence ----
  - method: POST
    path: "/ssdi/applications/{id}/evidence"
    description: attach a piece of medical evidence to an application
    roles: ["Claimant", "DDSExaminer"]
    code: 201
    input: ["source_type", "report_date", "diagnosis_code", "severity_score"]
    output: MedicalEvidence
    side_effects:
      - "create MedicalEvidence linked to Application via {id}"

  - method: GET
    path: "/ssdi/applications/{id}/evidence"
    description: list all evidence attached to an application
    roles: ["Claimant", "DDSExaminer", "ALJ", "SSAAdmin"]
    code: 200
    input: []
    output: MedicalEvidence[]
    side_effects: []

  - method: GET
    path: "/ssdi/applications/{id}/decisions"
    description: list medical determination decisions on an application
    roles: ["Claimant", "DDSExaminer", "ALJ", "SSAAdmin"]
    code: 200
    input: []
    output: MedicalDeterminationDecision[]
    side_effects: []

  # ---- HearingRequest ----
  - method: GET
    path: "/ssdi/hearings/{id}"
    description: fetch a hearing request
    roles: ["Claimant", "ALJ", "SSAAdmin"]
    code: 200
    input: []
    output: HearingRequest
    side_effects: []

  - method: GET
    path: "/ssdi/hearings"
    description: list hearings, filterable
    roles: ["ALJ", "SSAAdmin"]
    code: 200
    input: ["application_id?", "alj_user_id?", "status?", "limit?", "offset?"]
    output: HearingRequest[]
    side_effects: []

  - method: POST
    path: "/ssdi/hearings/{id}/schedule"
    description: ALJ schedules a requested hearing
    roles: ["ALJ"]
    code: 200
    input: ["scheduled_date"]
    output: HearingRequest
    side_effects:
      - "set HearingRequest.status=SCHEDULED, alj_user_id, scheduled_date"
      - "increment HearingRequest.version"

  - method: POST
    path: "/ssdi/hearings/{id}/record-held"
    description: mark a scheduled hearing as held (after scheduled_date passes)
    roles: ["ALJ"]
    code: 200
    input: []
    output: HearingRequest
    side_effects:
      - "set HearingRequest.status=HELD"
      - "increment HearingRequest.version"

  - method: POST
    path: "/ssdi/hearings/{id}/decision"
    description: ALJ records the hearing outcome
    roles: ["ALJ"]
    code: 200
    input: ["outcome"]
    output: HearingRequest
    side_effects:
      - "transition Application to ALJ_APPROVED or ALJ_DENIED"
      - "on APPROVED: cascade-create BenefitAward (variant ALJ_APPROVAL)"
      - "increment HearingRequest.version"

  - method: POST
    path: "/ssdi/hearings/{id}/cancel"
    description: claimant cancels a pending hearing request
    roles: ["Claimant"]
    code: 200
    input: []
    output: HearingRequest
    side_effects:
      - "set HearingRequest.status=CANCELLED; revert Application.status=RECONSIDERATION"
      - "increment HearingRequest.version"

  # ---- BenefitAward ----
  - method: GET
    path: "/ssdi/awards/{id}"
    description: fetch a benefit award
    roles: ["Claimant", "BenefitsAdmin", "SSAAdmin"]
    code: 200
    input: []
    output: BenefitAward
    side_effects: []

  - method: GET
    path: "/ssdi/awards"
    description: list benefit awards, filterable by application_id
    roles: ["BenefitsAdmin", "SSAAdmin", "Claimant"]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: BenefitAward[]
    side_effects: []

  - method: POST
    path: "/ssdi/awards/{id}/suspend"
    description: BenefitsAdmin suspends an active award
    roles: ["BenefitsAdmin"]
    code: 200
    input: []
    output: BenefitAward
    side_effects:
      - "set BenefitAward.status=SUSPENDED"
      - "cascade: all ACTIVE child auxiliaries to TERMINATED_PARENT"
      - "increment BenefitAward.version"

  - method: POST
    path: "/ssdi/awards/{id}/reinstate"
    description: BenefitsAdmin reinstates a suspended award
    roles: ["BenefitsAdmin"]
    code: 200
    input: []
    output: BenefitAward
    side_effects:
      - "set BenefitAward.status=ACTIVE"
      - "increment BenefitAward.version"

  # ---- ChildAuxiliaryBenefit ----
  - method: POST
    path: "/ssdi/awards/{id}/child-auxiliaries"
    description: register a child auxiliary benefit against an award
    roles: ["Claimant", "BenefitsAdmin"]
    code: 201
    input: ["child_full_name", "child_date_of_birth", "relationship", "expected_benefit_award_version"]
    output: ChildAuxiliaryBenefit
    side_effects:
      - "create ChildAuxiliaryBenefit; compute monthly_amount_cents via calc child_auxiliary_amount"
      - "increment BenefitAward.version"

  - method: GET
    path: "/ssdi/awards/{id}/child-auxiliaries"
    description: list child auxiliaries for an award
    roles: ["Claimant", "BenefitsAdmin", "SSAAdmin"]
    code: 200
    input: []
    output: ChildAuxiliaryBenefit[]
    side_effects: []

  # ---- SSISupplement ----
  - method: GET
    path: "/ssdi/ssi-supplements/{id}"
    description: fetch an SSI supplement
    roles: ["Claimant", "BenefitsAdmin", "SSAAdmin"]
    code: 200
    input: []
    output: SSISupplement
    side_effects: []

  - method: GET
    path: "/ssdi/ssi-supplements"
    description: list SSI supplements, filterable by application_id
    roles: ["BenefitsAdmin", "SSAAdmin"]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: SSISupplement[]
    side_effects: []

  # ---- CDRReview ----
  - method: GET
    path: "/ssdi/cdr-reviews/{id}"
    description: fetch a CDR review
    roles: ["Claimant", "SSAAdmin", "BenefitsAdmin"]
    code: 200
    input: []
    output: CDRReview
    side_effects: []

  - method: GET
    path: "/ssdi/cdr-reviews"
    description: list CDR reviews, filterable by benefit_award_id
    roles: ["SSAAdmin", "BenefitsAdmin"]
    code: 200
    input: ["benefit_award_id?", "outcome?", "limit?", "offset?"]
    output: CDRReview[]
    side_effects: []

  - method: POST
    path: "/ssdi/cdr-reviews/{id}/start"
    description: SSAAdmin begins a due CDR review, freezing the application
    roles: ["SSAAdmin"]
    code: 200
    input: []
    output: CDRReview
    side_effects:
      - "transition Application AWARDED -> CDR_FROZEN"
      - "increment Application.version"

  - method: POST
    path: "/ssdi/cdr-reviews/{id}/complete"
    description: SSAAdmin completes the CDR review
    roles: ["SSAAdmin"]
    code: 200
    input: ["outcome"]
    output: CDRReview
    side_effects:
      - "if outcome=CONTINUED: transition Application CDR_FROZEN -> AWARDED; schedule next CDR"
      - "if outcome=CESSATION: transition Application -> CESSATION; cascade-terminate BenefitAward, ChildAuxiliaryBenefit, SSISupplement"
      - "increment Application.version"

  # ---- Test-driving (clock) ----
  - method: POST
    path: "/ssdi/_clock/set_current_utc"
    description: set the server's current UTC time (test-only)
    roles: ["SSAAdmin"]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects:
      - "set server's NOW; re-evaluate age-derived states (does NOT auto-fire CDR, only allows /start to pass scheduled_review_date check)"

  - method: POST
    path: "/ssdi/_clock/advance"
    description: advance the server clock and re-evaluate age-derived child auxiliary terminations
    roles: ["SSAAdmin"]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects:
      - "set server's NOW"
      - "for every ACTIVE ChildAuxiliaryBenefit whose (NOW - child_date_of_birth) >= 18 years: set status=TERMINATED_AGE"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing X-User-ID or X-User-Role header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted by §1.7 for the requested endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id does not resolve to an existing resource"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "FK id in payload (claimant_id, application_id, benefit_award_id) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, type mismatch, or unknown field in payload"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "Application.status does not match the from-state of the requested transition"
  - id: ERR_INVALID_HEARING_STATE
    http: 409
    condition: "HearingRequest.status does not match the from-state of the requested transition"
  - id: ERR_CDR_NOT_DUE
    http: 409
    condition: "CDRReview.scheduled_review_date is in the future; cannot start"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version != current Application.version on medical-decision write"
  - id: ERR_STALE_AWARD_VERSION
    http: 412
    condition: "expected_benefit_award_version != current BenefitAward.version on child-auxiliary create"
  - id: ERR_EOD_BEFORE_AOD
    http: 422
    condition: "established_onset_date is earlier than the application's alleged_onset_date"
  - id: ERR_LISTING_REFERENCE_REQUIRED
    http: 422
    condition: "decision_type=LISTING_MET but listing_reference is null/empty"
  - id: ERR_HEARING_LEAD_TIME
    http: 422
    condition: "scheduled_date is less than requested_date + 75 days"
  - id: ERR_RECONSIDERATION_WINDOW_EXPIRED
    http: 422
    condition: "NOW > MedicalDeterminationDecision.created_at + 60 days"
  - id: ERR_CHILD_OVER_AGE
    http: 422
    condition: "(NOW - child_date_of_birth) >= 18 years at creation"
  - id: ERR_FAMILY_MAX_EXCEEDED
    http: 422
    condition: "family-max headroom would be exceeded by this child auxiliary"
  - id: ERR_SSI_NOT_REQUESTED
    http: 422
    condition: "SSI supplement requested but Application.claim_type != CONCURRENT_SSDI_SSI"
  - id: ERR_DUPLICATE_CREDIT_YEAR
    http: 409
    condition: "WorkCreditRecord with (claimant_id, year) already exists"
  - id: ERR_INVALID_STATE_CODE
    http: 422
    condition: "filing_state is not a valid USPS 2-letter code"
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "medical-decision attempted with no MedicalEvidence rows attached"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Claimant
    description: "the individual filing for SSDI benefits; acts as themselves"
    identity: "entity_backed:Claimant"
    exclusive_operations:
      - "POST /ssdi/applications (for self only — claimant_id must equal X-User-ID)"
      - "POST /ssdi/applications/{id}/submit"
      - "POST /ssdi/applications/{id}/request-reconsideration"
      - "POST /ssdi/applications/{id}/request-hearing"
      - "POST /ssdi/hearings/{id}/cancel"
    shared_operations:
      - "POST /ssdi/claimants (self-registration)"
      - "POST /ssdi/applications/{id}/evidence"
      - "POST /ssdi/awards/{id}/child-auxiliaries"
      - "GET /ssdi/* (read-only across own resources)"

  - name: DDSExaminer
    description: "Disability Determination Services examiner; renders Listings/RFC decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /ssdi/applications/{id}/medical-decision"
    shared_operations:
      - "POST /ssdi/applications/{id}/evidence"
      - "GET /ssdi/applications/*, GET /ssdi/evidence/*"

  - name: ALJ
    description: "Administrative Law Judge; hears appeals after reconsideration"
    identity: "opaque"
    exclusive_operations:
      - "POST /ssdi/hearings/{id}/schedule"
      - "POST /ssdi/hearings/{id}/record-held"
      - "POST /ssdi/hearings/{id}/decision"
    shared_operations:
      - "GET /ssdi/hearings/*, GET /ssdi/applications/*"

  - name: BenefitsAdmin
    description: "manages benefit awards, child auxiliaries, suspensions"
    identity: "opaque"
    exclusive_operations:
      - "POST /ssdi/awards/{id}/suspend"
      - "POST /ssdi/awards/{id}/reinstate"
    shared_operations:
      - "POST /ssdi/awards/{id}/child-auxiliaries"
      - "GET /ssdi/awards/*, /ssdi/ssi-supplements/*, /ssdi/cdr-reviews/*"

  - name: SSAAdmin
    description: "Social Security Administration operator; manages claimant records, work credits, CDR reviews, and clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /ssdi/work-credits"
      - "POST /ssdi/cdr-reviews/{id}/start"
      - "POST /ssdi/cdr-reviews/{id}/complete"
      - "POST /ssdi/_clock/set_current_utc"
      - "POST /ssdi/_clock/advance"
    shared_operations:
      - "POST /ssdi/claimants"
      - "POST /ssdi/applications"
      - "GET /ssdi/* (full read)"
