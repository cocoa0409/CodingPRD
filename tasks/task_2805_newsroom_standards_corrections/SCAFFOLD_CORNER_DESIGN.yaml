            - "Story.${st}.publication_status == DRAFT"
            - "Story.${st}.standards_status == CLEAN"
            - "Story.${st}.unpublished_at == null"

      - name: excluded_publish_before_clearance_returns_story_not_cleared
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STORY_NOT_CLEARED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / publish_draft_under_lockdown_returns_story_not_cleared_not_posture_lockdown
          rationale: "That instance publishes a DRAFT story and pins ERR_STORY_NOT_CLEARED as the winner over the posture rule."

      - name: excluded_lockdown_blocks_clear_and_publish
        claim_type: error_triggerable
        grounds:
          - errors[ERR_POSTURE_LOCKDOWN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / review_clear_blocked_by_newsroom_posture_then_admitted_after_corrections_resolve
          rationale: "ERR_POSTURE_LOCKDOWN is raised and then cleared by that instance's two-phase fixture."

      - name: excluded_cross_newsroom_reviewer_booking
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CROSS_NEWSROOM_REFERENCE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_cross_newsroom_reviewer_beats_capacity_exceeded
          rationale: "That instance books a foreign-newsroom reviewer and pins ERR_CROSS_NEWSROOM_REFERENCE ahead of the capacity rule."

      - name: excluded_reviewer_capacity_exceeded
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVIEWER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / assignment_admitted_when_reserved_plus_new_equals_capacity_exactly
          rationale: "That instance tests both sides of the capacity boundary, admitting the exact-equality booking and refusing the one-minute overrun with ERR_REVIEWER_CAPACITY_EXCEEDED."

      - name: excluded_pending_disclosure_blocks_activity_approval
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COI_DISCLOSURE_PENDING]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / activity_approval_pending_disclosure_beats_interval_overlap
          rationale: "ERR_COI_DISCLOSURE_PENDING is that instance's expected winner."

      - name: excluded_outside_activity_window_overlap
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OUTSIDE_ACTIVITY_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / outside_activity_half_open_window_admits_touching_endpoints_rejects_true_overlap
          rationale: "The half-open window instance raises ERR_OUTSIDE_ACTIVITY_OVERLAP on the genuinely overlapping request."

      - name: excluded_reviewer_slot_buffer_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVIEWER_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reviewer_slot_closed_interval_buffer_rejects_twenty_nine_minute_gap_admits_thirty
          rationale: "The 30-minute buffer instance raises ERR_REVIEWER_SLOT_CONFLICT on the 29-minute gap."

      - name: excluded_publication_with_an_undecided_source
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SOURCE_NOT_APPROVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / publish_blocked_by_undecided_anonymous_source_then_admitted_after_approval
          rationale: "That instance blocks the publish with ERR_SOURCE_NOT_APPROVED and then admits it once the source is approved."

