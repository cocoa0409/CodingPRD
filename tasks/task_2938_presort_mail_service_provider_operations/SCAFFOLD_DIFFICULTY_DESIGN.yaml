            - call: "POST /mail-jobs/${job_b_id}/hygiene-runs"
              payload: { submitted_piece_count: 1850, cass_matched_count: 1830, ncoa_move_updated_count: 55, undeliverable_removed_count: 50, move_update_age_days: 20 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
