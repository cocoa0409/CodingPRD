scenario: "859. Rent Board & Rent-Stabilization: unit registration & base-rent, allowable-increase (AGA/CPI) calculation, petition (capital-improvement/hardship) & hearing, service-reduction/decrease claim, buyout & relocation filing, exemption/vacancy decontrol, compliance & penalty, registry"
domain_name: rent-board-stabilization
api_prefix: "/rent-board"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  # Units own annual registrations, exemptions (nested); petitions own hearings;
  # tenancies/service-claims/buyouts/penalties are flat peers linked by FK.
  state_machine_shape: cyclic
  # Petition carries a NEEDS_REVISION -> SUBMITTED revision loop; Buyout forks
  # FILED -> {RESCINDED, COMPLETED} with divergent side-effect sets.
  relationship_patterns:
    - one_to_many          # Landlord -> Unit -> Registration/Tenancy/etc.
    - cross_aggregate      # Tenancy.monthly_rent tracks Unit.current_lawful_rent
  role_model: segregation_of_duties
  # ComplianceOfficer who assessed a Penalty cannot confirm it (four-eyes,
  # tracked via X-User-ID); HearingOfficer/RentBoardClerk/ComplianceOfficer own
  # disjoint operation sets; Landlord/Tenant are entity-backed parties.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Landlord / property-owner legal name
      - name: email
        type: string
        source: input
        description: Contact email; unique across landlords
        constraints: unique
      - name: business_license_no
        type: string
        source: input
        description: Municipal rental business license number
      - name: escrow_committed_cents
        type: integer
        source: computed
        description: >
          Sum of relocation_amount_cents over this landlord's Buyouts currently
          in FILED state. Incremented on buyout FILE, decremented on RESCIND and
          on COMPLETE. Conserved-quantity invariant (see §1.3 buyout_escrow).
        default: 0

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Tenant legal name
      - name: email
        type: string
        source: input
        description: Contact email; unique across tenants
        constraints: unique
      - name: phone
        type: string
        source: input
        description: Contact phone

  - name: HearingOfficer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Hearing officer name
      - name: email
        type: string
        source: input
        description: Contact email; unique across officers
        constraints: unique
      - name: active
        type: boolean
        source: input
        description: Whether the officer is available to be scheduled
        default: true

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; owning landlord of this rental unit"
      - name: address
        type: string
        source: input
        description: Street address incl. unit number
      - name: bedrooms
        type: integer
        source: input
        description: Bedroom count; drives the capital-passthrough cap tier
        constraints: ">= 0"
      - name: base_rent_cents
        type: integer
        source: input
        description: Registered base rent at initial registration, in cents
        constraints: "> 0"
      - name: current_lawful_rent_cents
        type: integer
        source: computed
        description: >
          Current maximum lawful monthly rent in cents. Initialized to
          base_rent_cents; mutated by rent-adjustments (allowable increase),
          petition grants (capital/hardship passthrough), and service-claim
          decreases/restorations.
      - name: banked_pct
        type: number
        source: system
        description: >
          Accumulated unused allowable-increase fraction (0..BANKED_CAP_PCT).
          Increased when a rent-adjustment takes less than that year's AGA;
          consumed when a rent-adjustment applies banked increase. Four decimals.
        default: 0
      - name: stabilization_status
        type: enum
        source: computed
        description: >
          Regulatory status. STABILIZED initially. Set to EXEMPT on approval of a
          non-vacancy Exemption, or DECONTROLLED on approval of a VACANCY_DECONTROL
          Exemption.
        default: STABILIZED
        constraints: "one of {STABILIZED, EXEMPT, DECONTROLLED}"
      - name: decrease_active
        type: boolean
        source: computed
        description: >
          True while a substantiated service-reduction decrease is currently
          applied to current_lawful_rent_cents; cleared on restoration.
        default: false

  - name: Registration
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit this annual registration belongs to"
      - name: registration_year
        type: integer
        source: input
        description: Calendar year of the registry filing
      - name: declared_rent_cents
        type: integer
        source: input
        description: Rent declared to the registry for this year, in cents
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: >
          ACTIVE when filed; SUPERSEDED when a newer registration is filed for the
          same unit (older active registration is superseded).
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: filed_by
        type: string
        source: system
        description: X-User-ID that filed this registration (audit)

  - name: Tenancy
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; leased unit"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; occupying tenant"
      - name: start_date
        type: datetime
        source: input
        description: Lease occupancy start (date, inclusive)
      - name: end_date
        type: datetime
        source: input
        description: Lease occupancy end (date, exclusive); null for open-ended
        default: null
      - name: monthly_rent_cents
        type: integer
        source: computed
        description: >
          Rent charged, in cents. Set to Unit.current_lawful_rent_cents at
          creation; cascaded to the new lawful rent whenever the unit's lawful
          rent changes (increase, passthrough grant, decrease, restoration).
      - name: status
        type: enum
        source: computed
        description: ACTIVE on creation; ENDED on /end or on buyout COMPLETE.
        default: ACTIVE
        constraints: "one of {ACTIVE, ENDED}"

  - name: AGADetermination
    parent: null
    common_fields: false
    fields:
      - name: effective_year
        type: integer
        source: input
        description: Calendar year this Annual General Adjustment applies to; unique
        constraints: unique
      - name: cpi_pct
        type: number
        source: input
        description: Published CPI change fraction for the year (informational)
      - name: aga_pct
        type: number
        source: input
        description: Allowable annual general adjustment fraction (e.g., 0.03 = 3%)
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: First date the AGA applies (date)
      - name: effective_to
        type: datetime
        source: input
        description: Last date the AGA applies (date)

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit the petition seeks to adjust"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; petitioning landlord"
      - name: petition_type
        type: enum
        source: input
        description: CAPITAL_IMPROVEMENT (cost/amortization) or HARDSHIP (pct request)
        constraints: "one of {CAPITAL_IMPROVEMENT, HARDSHIP}"
      - name: requested_cost_cents
        type: integer
        source: input
        description: Capital improvement total cost, cents (CAPITAL_IMPROVEMENT only)
        default: null
      - name: amortization_months
        type: integer
        source: input
        description: Months over which capital cost is amortized (CAPITAL_IMPROVEMENT only)
        default: null
      - name: requested_pct
        type: number
        source: input
        description: Requested hardship increase fraction (HARDSHIP only)
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle state; see §1.2 Petition state machine.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, HEARING_SCHEDULED, GRANTED, PARTIAL, DENIED}"
      - name: granted_amount_cents
        type: integer
        source: computed
        description: >
          Monthly passthrough amount granted on a HELD hearing decision (cents);
          0 until decided and on DENY.
        default: 0
      - name: revision_count
        type: integer
        source: system
        description: Number of times the petition returned to SUBMITTED via NEEDS_REVISION.
        default: 0

  - name: Hearing
    parent: Petition
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; petition being heard"
      - name: officer_id
        type: string
        source: input
        description: "FK -> HearingOfficer.id; assigned hearing officer (scheduling resource)"
      - name: scheduled_start
        type: datetime
        source: input
        description: Hearing start timestamp (ISO 8601 UTC)
      - name: scheduled_end
        type: datetime
        source: input
        description: Hearing end timestamp (ISO 8601 UTC); must be > scheduled_start
      - name: status
        type: enum
        source: computed
        description: SCHEDULED on creation; HELD once decided.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD}"
      - name: decision
        type: enum
        source: computed
        description: Officer decision recorded on HELD; null while SCHEDULED.
        default: null
        constraints: "one of {GRANT, PARTIAL, DENY}"

  - name: ServiceClaim
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit with reduced services"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; complaining tenant (must be the unit's active tenant)"
      - name: claim_type
        type: enum
        source: input
        description: Category of service reduction
        constraints: "one of {HEAT, WATER, MAINTENANCE, PEST}"
      - name: severity
        type: enum
        source: input
        description: MINOR or SUBSTANTIAL; drives ordered decrease fraction
        constraints: "one of {MINOR, SUBSTANTIAL}"
      - name: status
        type: enum
        source: computed
        description: See §1.2 ServiceClaim state machine.
        default: OPEN
        constraints: "one of {OPEN, INVESTIGATING, SUBSTANTIATED, DISMISSED, RESTORED}"
      - name: ordered_decrease_pct
        type: number
        source: computed
        description: Decrease fraction applied when SUBSTANTIATED; null otherwise.
        default: null
      - name: decrease_amount_cents
        type: integer
        source: computed
        description: Monthly rent decrease in cents applied when SUBSTANTIATED.
        default: 0
      - name: pre_decrease_rent_cents
        type: integer
        source: system
        description: >
          Snapshot of Unit.current_lawful_rent_cents captured at SUBSTANTIATED, used
          to restore the exact prior lawful rent on RESTORED (conservation invariant).
        default: null

  - name: Buyout
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit subject to the buyout"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; offering landlord"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; tenant being bought out (must be unit's active tenant)"
      - name: offer_amount_cents
        type: integer
        source: input
        description: Buyout payment offered to the tenant, cents
        constraints: "> 0"
      - name: relocation_amount_cents
        type: integer
        source: input
        description: Statutory relocation assistance component, cents
        constraints: ">= 0"
      - name: disclosure_acknowledged
        type: boolean
        source: system
        description: >
          Whether the required tenant-rights disclosure was acknowledged at FILE
          time (set from the /file payload).
        default: false
      - name: status
        type: enum
        source: computed
        description: See §1.2 Buyout state machine (branching FILED -> {RESCINDED, COMPLETED}).
        default: DRAFT
        constraints: "one of {DRAFT, FILED, RESCINDED, COMPLETED}"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the buyout was FILED; null while DRAFT.
        default: null
      - name: rescind_deadline
        type: datetime
        source: computed
        description: filed_at + COOLING_OFF_DAYS; tenant may rescind up to and including this instant.
        default: null

  - name: Exemption
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit seeking removal from stabilization"
      - name: exemption_type
        type: enum
        source: input
        description: Basis for exemption/decontrol
        constraints: "one of {SUBSTANTIAL_REHAB, OWNER_OCCUPIED, VACANCY_DECONTROL, NEW_CONSTRUCTION}"
      - name: status
        type: enum
        source: computed
        description: REQUESTED on creation; APPROVED or DENIED on decision.
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"
      - name: effective_date
        type: datetime
        source: input
        description: Requested/decided effective date of exemption (date); recorded on APPROVE.
        default: null
      - name: vacancy_rent_cents
        type: integer
        source: input
        description: >
          For VACANCY_DECONTROL: the vacancy re-rental rent used to test the
          decontrol threshold; null for other types.
        default: null

  - name: Penalty
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit the penalty concerns"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; penalized landlord"
      - name: penalty_type
        type: enum
        source: input
        description: OVERCHARGE (computed), LATE_REGISTRATION or FAILURE_TO_FILE (flat fee)
        constraints: "one of {OVERCHARGE, LATE_REGISTRATION, FAILURE_TO_FILE}"
      - name: months_overcharged
        type: integer
        source: input
        description: Number of overcharged months (OVERCHARGE only)
        default: null
      - name: monthly_overcharge_cents
        type: integer
        source: input
        description: Overcharge amount per month, cents (OVERCHARGE only)
        default: null
      - name: willful
        type: boolean
        source: input
        description: Whether the overcharge was willful; selects treble vs interest variant
        default: false
      - name: assessed_amount_cents
        type: integer
        source: computed
        description: Total assessed penalty, cents (see §1.3 overcharge_penalty).
      - name: status
        type: enum
        source: computed
        description: ASSESSED on creation; CONFIRMED after four-eyes confirmation.
        default: ASSESSED
        constraints: "one of {ASSESSED, CONFIRMED}"
      - name: assessed_by
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who assessed the penalty.
      - name: confirmed_by
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who confirmed it; must differ from assessed_by.
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Registration
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rent-board/units/{id}/registrations (a newer registration is filed for the same unit)"
        actor: system
        preconditions: ["a prior ACTIVE registration exists for the unit"]
        side_effects:
          - "the prior ACTIVE registration for the unit transitions to SUPERSEDED"
        note: "Each unit has at most one ACTIVE registration; filing a new one supersedes the old."

  - entity: Unit
    initial_state: STABILIZED
    terminal_states: [DECONTROLLED]
    transitions:
      - from: STABILIZED
        to: EXEMPT
        trigger: "POST /rent-board/exemptions/{id}/decide (decision=APPROVE, type in {SUBSTANTIAL_REHAB, OWNER_OCCUPIED, NEW_CONSTRUCTION})"
        actor: ComplianceOfficer
        preconditions: ["unit.stabilization_status == STABILIZED"]
        side_effects:
          - "unit.stabilization_status set to EXEMPT"
          - "exemption.effective_date set from payload"
      - from: STABILIZED
        to: DECONTROLLED
        trigger: "POST /rent-board/exemptions/{id}/decide (decision=APPROVE, type=VACANCY_DECONTROL)"
        actor: ComplianceOfficer
        preconditions:
          - "unit.stabilization_status == STABILIZED"
          - "unit has no ACTIVE tenancy (unit is vacant)"
          - "exemption.vacancy_rent_cents >= DECONTROL_RENT_THRESHOLD_CENTS"
        side_effects:
          - "unit.stabilization_status set to DECONTROLLED"

  - entity: Tenancy
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /rent-board/tenancies/{id}/end"
        actor: Landlord
        preconditions: ["tenancy.status == ACTIVE"]
        side_effects: ["tenancy.end_date set (from payload or logical clock date)"]
      - from: ACTIVE
        to: ENDED
        trigger: "POST /rent-board/buyouts/{id}/complete (cross-entity: buyout completion ends the tenant's active tenancy)"
        actor: system
        preconditions: ["tenancy.status == ACTIVE", "tenancy is the buyout tenant's active tenancy on the unit"]
        side_effects: ["tenancy.end_date set to buyout completion date"]

  - entity: Petition
    initial_state: DRAFT
    terminal_states: [GRANTED, PARTIAL, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rent-board/petitions/{id}/submit"
        actor: Landlord
        preconditions: ["petition.status == DRAFT"]
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rent-board/petitions/{id}/review"
        actor: HearingOfficer
        preconditions: ["petition.status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /rent-board/petitions/{id}/request-revision"
        actor: HearingOfficer
        preconditions: ["petition.status == UNDER_REVIEW"]
        side_effects: []
      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /rent-board/petitions/{id}/submit (resubmission after revision)"
        actor: Landlord
        preconditions: ["petition.status == NEEDS_REVISION"]
        side_effects: ["petition.revision_count incremented by 1"]
        note: "Cyclic revision loop: UNDER_REVIEW -> NEEDS_REVISION -> SUBMITTED -> UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: HEARING_SCHEDULED
        trigger: "POST /rent-board/petitions/{id}/hearings"
        actor: RentBoardClerk
        preconditions:
          - "petition.status == UNDER_REVIEW"
          - "assigned officer has no conflicting hearing (see §1.2.1 / overlap rule)"
        side_effects: ["a Hearing (SCHEDULED) is created for the petition"]
      - from: HEARING_SCHEDULED
        to: GRANTED
        trigger: "POST /rent-board/hearings/{id}/decide (decision=GRANT)"
        actor: HearingOfficer
        preconditions: ["petition.status == HEARING_SCHEDULED", "hearing.status == SCHEDULED"]
        side_effects:
          - "hearing.status -> HELD, hearing.decision = GRANT"
          - "petition.granted_amount_cents = full computed passthrough (see §1.3 petition_passthrough)"
          - "CASCADE: unit.current_lawful_rent_cents += petition.granted_amount_cents"
          - "CASCADE: unit's ACTIVE tenancy monthly_rent_cents set to the new lawful rent"
      - from: HEARING_SCHEDULED
        to: PARTIAL
        trigger: "POST /rent-board/hearings/{id}/decide (decision=PARTIAL, granted_amount_cents supplied)"
        actor: HearingOfficer
        preconditions:
          - "petition.status == HEARING_SCHEDULED"
          - "0 < granted_amount_cents < full computed passthrough"
        side_effects:
          - "hearing.status -> HELD, hearing.decision = PARTIAL"
          - "petition.granted_amount_cents = supplied amount"
          - "CASCADE: unit.current_lawful_rent_cents += petition.granted_amount_cents"
          - "CASCADE: unit's ACTIVE tenancy monthly_rent_cents set to the new lawful rent"
      - from: HEARING_SCHEDULED
        to: DENIED
        trigger: "POST /rent-board/hearings/{id}/decide (decision=DENY)"
        actor: HearingOfficer
        preconditions: ["petition.status == HEARING_SCHEDULED"]
        side_effects:
          - "hearing.status -> HELD, hearing.decision = DENY"
          - "petition.granted_amount_cents stays 0; no rent change"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /rent-board/hearings/{id}/decide"
        actor: HearingOfficer
        preconditions: ["hearing.status == SCHEDULED", "parent petition.status == HEARING_SCHEDULED"]
        side_effects: ["hearing.decision recorded; parent Petition transitions to GRANTED/PARTIAL/DENIED"]

  - entity: ServiceClaim
    initial_state: OPEN
    terminal_states: [DISMISSED, RESTORED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /rent-board/service-claims/{id}/investigate"
        actor: HearingOfficer
        preconditions: ["claim.status == OPEN"]
        side_effects: []
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /rent-board/service-claims/{id}/decide (disposition=SUBSTANTIATE)"
        actor: HearingOfficer
        preconditions: ["claim.status == INVESTIGATING", "unit has an ACTIVE tenancy for the claiming tenant"]
        side_effects:
          - "claim.pre_decrease_rent_cents = unit.current_lawful_rent_cents (snapshot)"
          - "claim.ordered_decrease_pct set from severity (SUBSTANTIAL/MINOR)"
          - "claim.decrease_amount_cents = round(pre_decrease_rent_cents * ordered_decrease_pct)"
          - "CASCADE: unit.current_lawful_rent_cents -= claim.decrease_amount_cents; unit.decrease_active = true"
          - "CASCADE: unit's ACTIVE tenancy monthly_rent_cents set to the decreased lawful rent"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /rent-board/service-claims/{id}/decide (disposition=DISMISS)"
        actor: HearingOfficer
        preconditions: ["claim.status == INVESTIGATING"]
        side_effects: ["no rent change"]
      - from: SUBSTANTIATED
        to: RESTORED
        trigger: "POST /rent-board/service-claims/{id}/restore"
        actor: RentBoardClerk
        preconditions: ["claim.status == SUBSTANTIATED", "unit.decrease_active == true"]
        side_effects:
          - "COMPENSATION: unit.current_lawful_rent_cents = claim.pre_decrease_rent_cents; unit.decrease_active = false"
          - "CASCADE: unit's ACTIVE tenancy monthly_rent_cents set back to pre_decrease_rent_cents"

  - entity: Buyout
    initial_state: DRAFT
    terminal_states: [RESCINDED, COMPLETED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /rent-board/buyouts/{id}/file"
        actor: Landlord
        preconditions:
          - "buyout.status == DRAFT"
          - "disclosure_acknowledged == true (payload)"
          - "buyout.relocation_amount_cents >= RELOCATION_MIN_CENTS"
        side_effects:
          - "buyout.disclosure_acknowledged set from payload"
          - "buyout.filed_at = logical clock now; buyout.rescind_deadline = filed_at + COOLING_OFF_DAYS"
          - "landlord.escrow_committed_cents += buyout.relocation_amount_cents"
      - from: FILED
        to: RESCINDED
        trigger: "POST /rent-board/buyouts/{id}/rescind"
        actor: Tenant
        preconditions:
          - "buyout.status == FILED"
          - "logical clock now <= buyout.rescind_deadline (cooling-off not expired)"
        side_effects:
          - "landlord.escrow_committed_cents -= buyout.relocation_amount_cents"
          - "tenancy is unaffected (tenant keeps the unit)"
        note: "Divergent branch A of FILED: escrow released, tenancy remains ACTIVE."
      - from: FILED
        to: COMPLETED
        trigger: "POST /rent-board/buyouts/{id}/complete"
        actor: RentBoardClerk
        preconditions:
          - "buyout.status == FILED"
          - "logical clock now >= buyout.rescind_deadline (cooling-off elapsed)"
        side_effects:
          - "landlord.escrow_committed_cents -= buyout.relocation_amount_cents"
          - "CASCADE: the tenant's ACTIVE tenancy on the unit transitions to ENDED"
        note: "Divergent branch B of FILED: escrow released AND tenancy ENDED (vacates unit)."

  - entity: Exemption
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /rent-board/exemptions/{id}/decide (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions:
          - "exemption.status == REQUESTED"
          - "unit.stabilization_status == STABILIZED"
          - "if type==VACANCY_DECONTROL: unit has no ACTIVE tenancy AND vacancy_rent_cents >= DECONTROL_RENT_THRESHOLD_CENTS"
        side_effects:
          - "exemption.effective_date set from payload"
          - "unit.stabilization_status -> EXEMPT (non-vacancy) or DECONTROLLED (VACANCY_DECONTROL)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /rent-board/exemptions/{id}/decide (decision=DENY)"
        actor: ComplianceOfficer
        preconditions: ["exemption.status == REQUESTED"]
        side_effects: ["no unit status change"]

  - entity: Penalty
    initial_state: ASSESSED
    terminal_states: [CONFIRMED]
    transitions:
      - from: ASSESSED
        to: CONFIRMED
        trigger: "POST /rent-board/penalties/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "penalty.status == ASSESSED"
          - "confirming X-User-ID != penalty.assessed_by (segregation of duties)"
        side_effects: ["penalty.confirmed_by set to confirming X-User-ID"]

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on Unit.version)
# =====================================================================
concurrency_rules:
  - rule_id: registration-supersede-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /rent-board/units/{id}/registrations"
    occ_field: "expected_unit_version"
    description: |
      Filing a new annual Registration against a Unit whose version has advanced
      since the client last observed it is rejected. The new registration
      legitimately supersedes the prior ACTIVE registration; a stale client view
      (another registration or rent-adjustment already advanced the unit) is
      rejected on the version check rather than silently superseding a record the
      client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rent-adjustment-supersede-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /rent-board/units/{id}/rent-adjustments"
    occ_field: "expected_unit_version"
    description: |
      Applying an allowable-increase rent-adjustment against a Unit whose version
      has advanced since the client last read it is rejected. A new adjustment
      supersedes the prior lawful rent; a stale unit view (a prior adjustment,
      passthrough grant, or service decrease already changed the lawful rent) is
      rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: allowable_increase
    trigger: "POST /rent-board/units/{id}/rent-adjustments"
    algorithm: threshold
    formula: |
      # Select AGA determination by the effective_date's calendar year.
      aga = AGADetermination where effective_year == year(effective_date)
      if aga is None: reject ERR_NO_AGA_DETERMINATION
      prior = unit.current_lawful_rent_cents
      if apply_banked:
          allowable_pct = min(aga.aga_pct + unit.banked_pct, BANKED_CAP_PCT)
      else:
          allowable_pct = aga.aga_pct
      max_new_cents = round_half_up(prior * (1 + allowable_pct))
      # boundary: proposed_new_rent_cents > max_new_cents  -> ERR_INCREASE_EXCEEDS_ALLOWABLE
      #           proposed_new_rent_cents == max_new_cents -> allowed
      #           proposed_new_rent_cents < prior          -> ERR_INCREASE_EXCEEDS_ALLOWABLE (this endpoint only raises)
      # On success:
      taken_pct = (proposed_new_rent_cents - prior) / prior
      if not apply_banked:
          banked_delta = max(0, aga.aga_pct - taken_pct)
          unit.banked_pct = min(round(unit.banked_pct + banked_delta, 4), BANKED_CAP_PCT)
      else:
          consumed = max(0, taken_pct - aga.aga_pct)
          unit.banked_pct = max(0, round(unit.banked_pct - consumed, 4))
      unit.current_lawful_rent_cents = proposed_new_rent_cents
    input_set: "single Unit; AGADetermination selected by year(effective_date)"
    constants:
      BANKED_CAP_PCT: 0.16
    precision: "cents integer, round_half_up; banked_pct 4 decimals"
    variants:
      - name: STANDARD
        when: "apply_banked == false"
        difference: "allowable_pct = aga_pct only; unused AGA (aga_pct - taken_pct) is added to banked_pct"
      - name: BANKED
        when: "apply_banked == true"
        difference: "allowable_pct = min(aga_pct + banked_pct, BANKED_CAP_PCT); portion above aga_pct is consumed from banked_pct"

  - name: petition_passthrough
    trigger: "POST /rent-board/hearings/{id}/decide (GRANT computes full amount; PARTIAL bounds the supplied amount)"
    algorithm: tiered_pricing
    formula: |
      if petition.petition_type == CAPITAL_IMPROVEMENT:
          monthly_amortized = round_half_up(petition.requested_cost_cents / petition.amortization_months)
          # tiered monthly cap on base rent, by bedroom count
          if unit.bedrooms <= 1:   cap_pct = 0.05
          elif unit.bedrooms <= 3: cap_pct = 0.06
          else:                    cap_pct = 0.07
          monthly_cap = round_half_up(unit.base_rent_cents * cap_pct)
          full_passthrough = min(monthly_amortized, monthly_cap)
      else:  # HARDSHIP
          requested = round_half_up(unit.current_lawful_rent_cents * petition.requested_pct)
          hardship_cap = round_half_up(unit.current_lawful_rent_cents * HARDSHIP_CAP_PCT)
          full_passthrough = min(requested, hardship_cap)
      # GRANT: granted = full_passthrough
      # PARTIAL: granted = supplied granted_amount_cents, require 0 < granted < full_passthrough
      # DENY: granted = 0
    input_set: "single Petition + its Unit; capital uses base_rent_cents+bedrooms, hardship uses current_lawful_rent_cents"
    constants:
      HARDSHIP_CAP_PCT: 0.08
    precision: "cents integer, round_half_up"
    variants:
      - name: CAPITAL_IMPROVEMENT
        when: "petition_type == CAPITAL_IMPROVEMENT"
        difference: "min(amortized cost, tiered % of base rent); >=3 inputs (cost, months, base_rent, bedrooms) with tier selection + nested min"
      - name: HARDSHIP
        when: "petition_type == HARDSHIP"
        difference: "min(requested % of current lawful rent, HARDSHIP_CAP_PCT of current lawful rent)"

  - name: overcharge_penalty
    trigger: "POST /rent-board/penalties"
    algorithm: aggregation
    formula: |
      if penalty_type == LATE_REGISTRATION: assessed = LATE_REG_PENALTY_CENTS
      elif penalty_type == FAILURE_TO_FILE: assessed = FAIL_FILE_PENALTY_CENTS
      else:  # OVERCHARGE
          base = months_overcharged * monthly_overcharge_cents
          if willful:
              assessed = base * TREBLE_MULTIPLIER            # treble damages, no interest
          else:
              # ROUNDING ORDER PINNED: round each month's interest to whole cents
              # THEN sum (NOT sum-then-round). Differs by cents at the .5 boundary.
              per_month_interest = round_half_up(monthly_overcharge_cents * MONTHLY_INTEREST_RATE)
              interest_total = per_month_interest * months_overcharged
              assessed = base + interest_total
      penalty.assessed_amount_cents = assessed
    input_set: "single Penalty; OVERCHARGE reads months_overcharged, monthly_overcharge_cents, willful"
    constants:
      TREBLE_MULTIPLIER: 3
      MONTHLY_INTEREST_RATE: 0.0075
      LATE_REG_PENALTY_CENTS: 50000
      FAIL_FILE_PENALTY_CENTS: 100000
    precision: "cents integer, round_half_up; per-month-then-sum for interest"
    variants:
      - name: WILLFUL
        when: "penalty_type==OVERCHARGE and willful==true"
        difference: "assessed = base * 3 (treble, no interest)"
      - name: NON_WILLFUL
        when: "penalty_type==OVERCHARGE and willful==false"
        difference: "assessed = base + sum_over_months(round_half_up(monthly_overcharge_cents * 0.0075))"

  - name: service_decrease
    trigger: "POST /rent-board/service-claims/{id}/decide (disposition=SUBSTANTIATE)"
    algorithm: threshold
    formula: |
      ordered_decrease_pct = SUBSTANTIAL_DECREASE_PCT if severity==SUBSTANTIAL else MINOR_DECREASE_PCT
      pre = unit.current_lawful_rent_cents
      decrease_amount_cents = round_half_up(pre * ordered_decrease_pct)
      unit.current_lawful_rent_cents = pre - decrease_amount_cents
    input_set: "single ServiceClaim + its Unit's current lawful rent snapshot"
    constants:
      SUBSTANTIAL_DECREASE_PCT: 0.25
      MINOR_DECREASE_PCT: 0.10
    precision: "cents integer, round_half_up"

  - name: buyout_escrow
    trigger: "POST /rent-board/buyouts/{id}/file | /rescind | /complete"
    algorithm: aggregation
    formula: |
      # Named conserved quantity: landlord.escrow_committed_cents
      # INVARIANT (must hold after every buyout mutation):
      #   landlord.escrow_committed_cents
      #     == sum(b.relocation_amount_cents for b in landlord's Buyouts if b.status == FILED)
      # FILE:     escrow_committed_cents += relocation_amount_cents
      # RESCIND:  escrow_committed_cents -= relocation_amount_cents   (compensating)
      # COMPLETE: escrow_committed_cents -= relocation_amount_cents
    input_set: "one Landlord; that landlord's FILED Buyouts"
    precision: "cents integer, exact"

  - name: rescind_deadline
    trigger: "POST /rent-board/buyouts/{id}/file"
    algorithm: projection
    formula: |
      rescind_deadline = filed_at + timedelta(days=COOLING_OFF_DAYS)
      # rescind allowed while (now <= rescind_deadline); complete allowed while (now >= rescind_deadline)
    input_set: "single Buyout"
    constants:
      COOLING_OFF_DAYS: 30
    precision: "ISO 8601 UTC, whole seconds"

  - name: hearing_officer_overlap
    trigger: "POST /rent-board/petitions/{id}/hearings"
    algorithm: interval_merge
    formula: |
      buffer = HEARING_BUFFER_MINUTES minutes
      # Reject if any SCHEDULED hearing H for the same officer satisfies:
      #   req.scheduled_start < (H.scheduled_end + buffer) AND
      #   H.scheduled_start < (req.scheduled_end + buffer)
      # Half-open [start, end); a request starting exactly at H.end + buffer is allowed.
    input_set: "SCHEDULED hearings of the requested officer"
    constants:
      HEARING_BUFFER_MINUTES: 30
    precision: "whole minutes"

  - name: policy_thresholds
    trigger: "POST /rent-board/buyouts/{id}/file ; POST /rent-board/exemptions/{id}/decide (VACANCY_DECONTROL)"
    algorithm: threshold
    formula: |
      # relocation floor gate on buyout file:
      #   relocation_amount_cents >= RELOCATION_MIN_CENTS  else ERR_RELOCATION_BELOW_MINIMUM
      # vacancy decontrol rent gate on exemption approval:
      #   vacancy_rent_cents >= DECONTROL_RENT_THRESHOLD_CENTS  else ERR_DECONTROL_THRESHOLD_NOT_MET
      # boundary: value == threshold is allowed (>=); value == threshold - 1 is rejected.
    input_set: "single Buyout / single Exemption"
    constants:
      RELOCATION_MIN_CENTS: 500000
      DECONTROL_RENT_THRESHOLD_CENTS: 500000
    precision: "cents integer"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for owner-scoped ops, the acting entity-backed role owns the resource (Landlord owns unit/petition/buyout; Tenant is the claim/buyout tenant)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /rent-board/units/{id}/rent-adjustments, POST /rent-board/tenancies, POST /rent-board/petitions*, POST /rent-board/buyouts*, POST /rent-board/service-claims, POST /rent-board/buyouts/{id}/rescind"

  - priority: 4
    category: existence
    check: "all path ids and body FK references resolve to existing resources (left-to-right)"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a resource id or FK (specific ERR_*_NOT_FOUND per missing entity)"

  - priority: 5
    category: business_constraint
    check: "required fields present and well-typed; enum values valid; type-specific fields present (capital: cost+months; hardship: requested_pct; overcharge: months+monthly)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Unit.stabilization_status == STABILIZED for lease creation and rent-adjustment"
    error_id: ERR_UNIT_NOT_STABILIZED
    http_status: 409
    applies_to: "POST /rent-board/tenancies, POST /rent-board/units/{id}/rent-adjustments"

  - priority: 8
    category: state
    check: "Petition.status == UNDER_REVIEW before scheduling a hearing"
    error_id: ERR_PETITION_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /rent-board/petitions/{id}/hearings"

  - priority: 9
    category: state
    check: "Unit has no ACTIVE tenancy (vacant) for VACANCY_DECONTROL approval"
    error_id: ERR_UNIT_NOT_VACANT
    http_status: 409
    applies_to: "POST /rent-board/exemptions/{id}/decide"

  - priority: 10
    category: business_safety
    check: "confirming ComplianceOfficer X-User-ID differs from penalty.assessed_by (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /rent-board/penalties/{id}/confirm"

  - priority: 11
    category: business_safety
    check: "tenant-rights disclosure acknowledged (disclosure_acknowledged == true) before filing a buyout"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: "POST /rent-board/buyouts/{id}/file"

  - priority: 12
    category: business_temporal
    check: "cooling-off not expired: logical now <= buyout.rescind_deadline for rescission"
    error_id: ERR_COOLING_OFF_EXPIRED
    http_status: 409
    applies_to: "POST /rent-board/buyouts/{id}/rescind"

  - priority: 13
    category: business_temporal
    check: "cooling-off elapsed: logical now >= buyout.rescind_deadline for completion"
    error_id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /rent-board/buyouts/{id}/complete"

  - priority: 14
    category: business_referential
    check: "claim/buyout tenant is the unit's ACTIVE tenant (Tenancy links tenant_id and unit_id, status ACTIVE)"
    error_id: ERR_TENANT_NOT_LINKED
    http_status: 422
    applies_to: "POST /rent-board/service-claims, POST /rent-board/buyouts"

  - priority: 15
    category: business_temporal
    check: "no ACTIVE tenancy on the unit overlaps the requested occupancy interval [start_date, end_date) (adjacency start==prior end allowed)"
    error_id: ERR_UNIT_OCCUPIED
    http_status: 409
    applies_to: "POST /rent-board/tenancies"

  - priority: 16
    category: business_temporal
    check: "assigned officer has no SCHEDULED hearing whose [start,end) expanded by HEARING_BUFFER_MINUTES overlaps the requested window"
    error_id: ERR_OFFICER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rent-board/petitions/{id}/hearings"

  - priority: 17
    category: business_fiscal
    check: "buyout.relocation_amount_cents >= RELOCATION_MIN_CENTS"
    error_id: ERR_RELOCATION_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /rent-board/buyouts/{id}/file"

  - priority: 18
    category: business_fiscal
    check: "VACANCY_DECONTROL: exemption.vacancy_rent_cents >= DECONTROL_RENT_THRESHOLD_CENTS"
    error_id: ERR_DECONTROL_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /rent-board/exemptions/{id}/decide"

  - priority: 19
    category: business_constraint
    check: "proposed_new_rent_cents <= max allowable (per allowable_increase variant) and >= prior lawful rent"
    error_id: ERR_INCREASE_EXCEEDS_ALLOWABLE
    http_status: 422
    applies_to: "POST /rent-board/units/{id}/rent-adjustments"

  - priority: 20
    category: business_constraint
    check: "no AGADetermination exists for year(effective_date)"
    error_id: ERR_NO_AGA_DETERMINATION
    http_status: 422
    applies_to: "POST /rent-board/units/{id}/rent-adjustments"

  - priority: 21
    category: business_constraint
    check: "PARTIAL hearing decision: 0 < granted_amount_cents < full computed passthrough"
    error_id: ERR_INVALID_GRANT_AMOUNT
    http_status: 422
    applies_to: "POST /rent-board/hearings/{id}/decide"

  - priority: 22
    category: state
    check: "OCC: expected_unit_version matches Unit.version (stale version rejected)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rent-board/units/{id}/registrations, POST /rent-board/units/{id}/rent-adjustments"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- actors / config ----
  - method: POST
    path: "/rent-board/landlords"
    description: Create a landlord
    roles: [RentBoardClerk]
    code: 201
    input: [name, email, business_license_no]
    output: Landlord
    side_effects: []
  - method: GET
    path: "/rent-board/landlords/{id}"
    description: Fetch a landlord
    roles: [RentBoardClerk, Landlord, ComplianceOfficer]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/rent-board/tenants"
    description: Create a tenant
    roles: [RentBoardClerk]
    code: 201
    input: [name, email, phone]
    output: Tenant
    side_effects: []
  - method: GET
    path: "/rent-board/tenants/{id}"
    description: Fetch a tenant
    roles: [RentBoardClerk, Tenant, Landlord]
    code: 200
    input: []
    output: Tenant
    side_effects: []
  - method: POST
    path: "/rent-board/hearing-officers"
    description: Create a hearing officer
    roles: [RentBoardClerk]
    code: 201
    input: [name, email, "active?"]
    output: HearingOfficer
    side_effects: []
  - method: GET
    path: "/rent-board/hearing-officers/{id}"
    description: Fetch a hearing officer
    roles: [RentBoardClerk, HearingOfficer]
    code: 200
    input: []
    output: HearingOfficer
    side_effects: []
  - method: POST
    path: "/rent-board/aga-determinations"
    description: Publish an Annual General Adjustment for a year
    roles: [RentBoardClerk]
    code: 201
    input: [effective_year, cpi_pct, aga_pct, effective_from, effective_to]
    output: AGADetermination
    side_effects: []
  - method: GET
    path: "/rent-board/aga-determinations"
    description: List AGA determinations (filter by effective_year)
    roles: [RentBoardClerk, Landlord]
    code: 200
    input: ["effective_year?", "limit?", "offset?"]
    output: AGADetermination[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: >
      Set the server logical clock (test-driving). Server startup default is
      2026-05-01T00:00:00Z; before any set, the clock reads exactly this default
      and never falls back to wall-clock time. All deadline/cooling-off rules use
      this logical clock.
    roles: [RentBoardClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to the supplied instant"]

  # ---- units ----
  - method: POST
    path: "/rent-board/units"
    description: Register a rental unit with its base rent
    roles: [Landlord, RentBoardClerk]
    code: 201
    input: [landlord_id, address, bedrooms, base_rent_cents]
    output: Unit
    side_effects: ["current_lawful_rent_cents initialized to base_rent_cents; banked_pct=0; status STABILIZED"]
  - method: GET
    path: "/rent-board/units/{id}"
    description: Fetch a unit (incl. current lawful rent, banked_pct, status)
    roles: [Landlord, RentBoardClerk, Tenant, HearingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/rent-board/units"
    description: List units (filter by landlord_id)
    roles: [Landlord, RentBoardClerk, ComplianceOfficer]
    code: 200
    input: ["landlord_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: POST
    path: "/rent-board/units/{id}/registrations"
    description: File the annual registry registration for a unit (OCC on unit version)
    roles: [Landlord, RentBoardClerk]
    code: 201
    input: [registration_year, declared_rent_cents, expected_unit_version]
    output: Registration
    side_effects:
      - "prior ACTIVE registration for the unit -> SUPERSEDED"
      - "increments Unit.version by 1"
  - method: GET
    path: "/rent-board/units/{id}/registrations"
    description: List a unit's registrations (reverse-reachability for Registration.unit_id)
    roles: [Landlord, RentBoardClerk, ComplianceOfficer]
    code: 200
    input: []
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/rent-board/units/{id}/rent-adjustments"
    description: Apply an allowable annual increase to the unit's lawful rent (OCC on unit version)
    roles: [Landlord]
    code: 200
    input: [effective_date, proposed_new_rent_cents, apply_banked, expected_unit_version]
    output: Unit
    side_effects:
      - "recompute allowable_increase; current_lawful_rent_cents = proposed_new_rent_cents"
      - "update banked_pct (bank unused AGA or consume banked)"
      - "CASCADE: unit's ACTIVE tenancy monthly_rent_cents set to new lawful rent"
      - "increments Unit.version by 1"
  - method: GET
    path: "/rent-board/units/{id}/exemptions"
    description: List a unit's exemptions (reverse-reachability for Exemption.unit_id)
    roles: [Landlord, RentBoardClerk, ComplianceOfficer]
    code: 200
    input: []
    output: Exemption[]
    side_effects: []

  # ---- tenancies ----
  - method: POST
    path: "/rent-board/tenancies"
    description: Create a lease/tenancy on a stabilized unit
    roles: [Landlord, RentBoardClerk]
    code: 201
    input: [unit_id, tenant_id, start_date, "end_date?"]
    output: Tenancy
    side_effects: ["monthly_rent_cents set to unit.current_lawful_rent_cents; status ACTIVE"]
  - method: GET
    path: "/rent-board/tenancies/{id}"
    description: Fetch a tenancy
    roles: [Landlord, RentBoardClerk, Tenant]
    code: 200
    input: []
    output: Tenancy
    side_effects: []
  - method: GET
    path: "/rent-board/tenancies"
    description: List tenancies (filter by unit_id and/or tenant_id)
    roles: [Landlord, RentBoardClerk]
    code: 200
    input: ["unit_id?", "tenant_id?", "limit?", "offset?"]
    output: Tenancy[]
    side_effects: []
  - method: POST
    path: "/rent-board/tenancies/{id}/end"
    description: End an active tenancy
    roles: [Landlord, RentBoardClerk]
    code: 200
    input: ["end_date?"]
    output: Tenancy
    side_effects: ["status -> ENDED; end_date set"]

  # ---- petitions ----
  - method: POST
    path: "/rent-board/petitions"
    description: Create a capital-improvement or hardship petition (DRAFT)
    roles: [Landlord]
    code: 201
    input: [unit_id, landlord_id, petition_type, "requested_cost_cents?", "amortization_months?", "requested_pct?"]
    output: Petition
    side_effects: []
  - method: POST
    path: "/rent-board/petitions/{id}/submit"
    description: Submit a DRAFT or resubmit a NEEDS_REVISION petition
    roles: [Landlord]
    code: 200
    input: []
    output: Petition
    side_effects: ["DRAFT->SUBMITTED; NEEDS_REVISION->SUBMITTED with revision_count += 1"]
  - method: POST
    path: "/rent-board/petitions/{id}/review"
    description: Move a submitted petition into review
    roles: [HearingOfficer]
    code: 200
    input: []
    output: Petition
    side_effects: ["SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/rent-board/petitions/{id}/request-revision"
    description: Send a petition back to the landlord for revision
    roles: [HearingOfficer]
    code: 200
    input: ["reason?"]
    output: Petition
    side_effects: ["UNDER_REVIEW -> NEEDS_REVISION"]
  - method: POST
    path: "/rent-board/petitions/{id}/hearings"
    description: Schedule a hearing for a petition under review (officer overlap-checked)
    roles: [RentBoardClerk]
    code: 201
    input: [officer_id, scheduled_start, scheduled_end]
    output: Hearing
    side_effects: ["petition -> HEARING_SCHEDULED; Hearing (SCHEDULED) created"]
  - method: GET
    path: "/rent-board/petitions/{id}"
    description: Fetch a petition
    roles: [Landlord, RentBoardClerk, HearingOfficer]
    code: 200
    input: []
    output: Petition
    side_effects: []
  - method: GET
    path: "/rent-board/petitions"
    description: List petitions (filter by unit_id and/or landlord_id)
    roles: [Landlord, RentBoardClerk, HearingOfficer]
    code: 200
    input: ["unit_id?", "landlord_id?", "limit?", "offset?"]
    output: Petition[]
    side_effects: []

  # ---- hearings ----
  - method: POST
    path: "/rent-board/hearings/{id}/decide"
    description: Record the hearing decision (GRANT/PARTIAL/DENY) and cascade the petition outcome
    roles: [HearingOfficer]
    code: 200
    input: [decision, "granted_amount_cents?"]
    output: Hearing
    side_effects:
      - "hearing -> HELD; petition -> GRANTED/PARTIAL/DENIED"
      - "on GRANT/PARTIAL: unit.current_lawful_rent_cents += granted; CASCADE active tenancy monthly_rent_cents"
  - method: GET
    path: "/rent-board/hearings/{id}"
    description: Fetch a hearing
    roles: [Landlord, RentBoardClerk, HearingOfficer]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/rent-board/hearings"
    description: List hearings (filter by petition_id and/or officer_id)
    roles: [RentBoardClerk, HearingOfficer]
    code: 200
    input: ["petition_id?", "officer_id?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []

  # ---- service claims ----
  - method: POST
    path: "/rent-board/service-claims"
    description: Tenant files a service-reduction / decrease claim
    roles: [Tenant]
    code: 201
    input: [unit_id, tenant_id, claim_type, severity]
    output: ServiceClaim
    side_effects: []
  - method: POST
    path: "/rent-board/service-claims/{id}/investigate"
    description: Open investigation on a service claim
    roles: [HearingOfficer, RentBoardClerk]
    code: 200
    input: []
    output: ServiceClaim
    side_effects: ["OPEN -> INVESTIGATING"]
  - method: POST
    path: "/rent-board/service-claims/{id}/decide"
    description: Substantiate (order decrease) or dismiss a service claim
    roles: [HearingOfficer]
    code: 200
    input: [disposition]
    output: ServiceClaim
    side_effects:
      - "SUBSTANTIATE: snapshot pre_decrease_rent_cents; compute service_decrease; CASCADE unit lawful rent down + active tenancy"
      - "DISMISS: INVESTIGATING -> DISMISSED, no rent change"
  - method: POST
    path: "/rent-board/service-claims/{id}/restore"
    description: Restore services and the pre-decrease rent
    roles: [RentBoardClerk, HearingOfficer]
    code: 200
    input: []
    output: ServiceClaim
    side_effects: ["SUBSTANTIATED -> RESTORED; COMPENSATION unit lawful rent back to pre_decrease; CASCADE active tenancy"]
  - method: GET
    path: "/rent-board/service-claims/{id}"
    description: Fetch a service claim
    roles: [Tenant, Landlord, RentBoardClerk, HearingOfficer]
    code: 200
    input: []
    output: ServiceClaim
    side_effects: []
  - method: GET
    path: "/rent-board/service-claims"
    description: List service claims (filter by unit_id and/or tenant_id)
    roles: [Landlord, RentBoardClerk, HearingOfficer]
    code: 200
    input: ["unit_id?", "tenant_id?", "limit?", "offset?"]
    output: ServiceClaim[]
    side_effects: []

  # ---- buyouts ----
  - method: POST
    path: "/rent-board/buyouts"
    description: Create a buyout & relocation offer (DRAFT)
    roles: [Landlord]
    code: 201
    input: [unit_id, landlord_id, tenant_id, offer_amount_cents, relocation_amount_cents]
    output: Buyout
    side_effects: []
  - method: POST
    path: "/rent-board/buyouts/{id}/file"
    description: File the buyout with disclosure; starts the cooling-off window and commits escrow
    roles: [Landlord]
    code: 200
    input: [disclosure_acknowledged]
    output: Buyout
    side_effects:
      - "DRAFT -> FILED; filed_at set; rescind_deadline = filed_at + COOLING_OFF_DAYS"
      - "landlord.escrow_committed_cents += relocation_amount_cents"
  - method: POST
    path: "/rent-board/buyouts/{id}/rescind"
    description: Tenant rescinds within the cooling-off window
    roles: [Tenant]
    code: 200
    input: []
    output: Buyout
    side_effects: ["FILED -> RESCINDED; landlord.escrow_committed_cents -= relocation_amount_cents"]
  - method: POST
    path: "/rent-board/buyouts/{id}/complete"
    description: Complete the buyout after cooling-off; ends the tenancy
    roles: [RentBoardClerk]
    code: 200
    input: []
    output: Buyout
    side_effects:
      - "FILED -> COMPLETED; landlord.escrow_committed_cents -= relocation_amount_cents"
      - "CASCADE: tenant's ACTIVE tenancy on the unit -> ENDED"
  - method: GET
    path: "/rent-board/buyouts/{id}"
    description: Fetch a buyout
    roles: [Landlord, RentBoardClerk, Tenant]
    code: 200
    input: []
    output: Buyout
    side_effects: []
  - method: GET
    path: "/rent-board/buyouts"
    description: List buyouts (filter by unit_id, landlord_id and/or tenant_id)
    roles: [Landlord, RentBoardClerk]
    code: 200
    input: ["unit_id?", "landlord_id?", "tenant_id?", "limit?", "offset?"]
    output: Buyout[]
    side_effects: []

  # ---- exemptions ----
  - method: POST
    path: "/rent-board/exemptions"
    description: Request an exemption / vacancy decontrol for a unit
    roles: [Landlord]
    code: 201
    input: [unit_id, exemption_type, "vacancy_rent_cents?", "effective_date?"]
    output: Exemption
    side_effects: []
  - method: POST
    path: "/rent-board/exemptions/{id}/decide"
    description: Approve or deny an exemption (compliance)
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "effective_date?"]
    output: Exemption
    side_effects: ["APPROVE: unit -> EXEMPT or DECONTROLLED; DENY: no change"]

  # ---- penalties ----
  - method: POST
    path: "/rent-board/penalties"
    description: Assess a compliance penalty (overcharge / late-registration / failure-to-file)
    roles: [ComplianceOfficer]
    code: 201
    input: [unit_id, landlord_id, penalty_type, "months_overcharged?", "monthly_overcharge_cents?", "willful?"]
    output: Penalty
    side_effects: ["assessed_amount_cents computed; assessed_by = X-User-ID; status ASSESSED"]
  - method: POST
    path: "/rent-board/penalties/{id}/confirm"
    description: Confirm an assessed penalty (four-eyes; confirmer != assessor)
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Penalty
    side_effects: ["ASSESSED -> CONFIRMED; confirmed_by = X-User-ID"]
  - method: GET
    path: "/rent-board/penalties/{id}"
    description: Fetch a penalty
    roles: [ComplianceOfficer, RentBoardClerk, Landlord]
    code: 200
    input: []
    output: Penalty
    side_effects: []
  - method: GET
    path: "/rent-board/penalties"
    description: List penalties (filter by unit_id and/or landlord_id)
    roles: [ComplianceOfficer, RentBoardClerk, Landlord]
    code: 200
    input: ["unit_id?", "landlord_id?", "limit?", "offset?"]
    output: Penalty[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed actor is not the owner/party of the target resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing/invalid required field, bad enum, or missing type-specific field"
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "landlord_id does not resolve"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "tenant_id does not resolve"
  - id: ERR_HEARING_OFFICER_NOT_FOUND
    http: 404
    condition: "officer_id does not resolve"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit_id does not resolve"
  - id: ERR_PETITION_NOT_FOUND
    http: 404
    condition: "petition id does not resolve"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "hearing id does not resolve"
  - id: ERR_SERVICE_CLAIM_NOT_FOUND
    http: 404
    condition: "service claim id does not resolve"
  - id: ERR_BUYOUT_NOT_FOUND
    http: 404
    condition: "buyout id does not resolve"
  - id: ERR_EXEMPTION_NOT_FOUND
    http: 404
    condition: "exemption id does not resolve"
  - id: ERR_PENALTY_NOT_FOUND
    http: 404
    condition: "penalty id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state"
  - id: ERR_UNIT_NOT_STABILIZED
    http: 409
    condition: "Operation requires Unit.stabilization_status == STABILIZED but unit is EXEMPT/DECONTROLLED"
  - id: ERR_PETITION_NOT_UNDER_REVIEW
    http: 409
    condition: "Scheduling a hearing requires Petition.status == UNDER_REVIEW"
  - id: ERR_UNIT_NOT_VACANT
    http: 409
    condition: "VACANCY_DECONTROL approval requires the unit to have no ACTIVE tenancy"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Penalty confirmer X-User-ID equals the assessor (segregation of duties)"
  - id: ERR_DISCLOSURE_REQUIRED
    http: 422
    condition: "Buyout filed without disclosure_acknowledged == true"
  - id: ERR_COOLING_OFF_EXPIRED
    http: 409
    condition: "Rescission attempted after buyout.rescind_deadline"
  - id: ERR_COOLING_OFF_NOT_ELAPSED
    http: 409
    condition: "Completion attempted before buyout.rescind_deadline"
  - id: ERR_TENANT_NOT_LINKED
    http: 422
    condition: "Claim/buyout tenant is not the unit's ACTIVE tenant"
  - id: ERR_UNIT_OCCUPIED
    http: 409
    condition: "Requested tenancy interval overlaps an existing ACTIVE tenancy on the unit"
  - id: ERR_OFFICER_UNAVAILABLE
    http: 409
    condition: "Hearing window (with buffer) overlaps another SCHEDULED hearing for the officer"
  - id: ERR_RELOCATION_BELOW_MINIMUM
    http: 422
    condition: "relocation_amount_cents < RELOCATION_MIN_CENTS at file"
  - id: ERR_DECONTROL_THRESHOLD_NOT_MET
    http: 422
    condition: "VACANCY_DECONTROL vacancy_rent_cents below DECONTROL_RENT_THRESHOLD_CENTS"
  - id: ERR_INCREASE_EXCEEDS_ALLOWABLE
    http: 422
    condition: "proposed_new_rent_cents above the allowable maximum or below prior lawful rent"
  - id: ERR_NO_AGA_DETERMINATION
    http: 422
    condition: "No AGADetermination exists for year(effective_date)"
  - id: ERR_INVALID_GRANT_AMOUNT
    http: 422
    condition: "PARTIAL decision granted_amount_cents not strictly between 0 and full computed passthrough"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_unit_version does not match current Unit.version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Landlord
    description: Property owner; registers units, files registrations/increases, leases, petitions, buyouts, exemption requests
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /rent-board/units/{id}/rent-adjustments"
      - "POST /rent-board/petitions"
      - "POST /rent-board/petitions/{id}/submit"
      - "POST /rent-board/buyouts"
      - "POST /rent-board/buyouts/{id}/file"
      - "POST /rent-board/exemptions"
    shared_operations:
      - "POST /rent-board/units"
      - "POST /rent-board/units/{id}/registrations"
      - "POST /rent-board/tenancies"
      - "POST /rent-board/tenancies/{id}/end"
      - "GET (own units, tenancies, petitions, hearings, buyouts, penalties, registrations, exemptions)"

  - name: Tenant
    description: Occupying tenant; files service claims and rescinds buyouts
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /rent-board/service-claims"
      - "POST /rent-board/buyouts/{id}/rescind"
    shared_operations:
      - "GET (own tenancies, service claims, buyouts, unit)"

  - name: HearingOfficer
    description: Adjudicates petitions and service claims; conducts hearings
    identity: "entity_backed:HearingOfficer"
    exclusive_operations:
      - "POST /rent-board/petitions/{id}/review"
      - "POST /rent-board/petitions/{id}/request-revision"
      - "POST /rent-board/hearings/{id}/decide"
      - "POST /rent-board/service-claims/{id}/decide"
    shared_operations:
      - "POST /rent-board/service-claims/{id}/investigate"
      - "POST /rent-board/service-claims/{id}/restore"
      - "GET (petitions, hearings, service claims, units)"

  - name: RentBoardClerk
    description: Board administrative operator; onboards actors, publishes AGA, schedules hearings, completes buyouts, sets clock
    identity: "opaque"
    exclusive_operations:
      - "POST /rent-board/landlords"
      - "POST /rent-board/tenants"
      - "POST /rent-board/hearing-officers"
      - "POST /rent-board/aga-determinations"
      - "POST /rent-board/petitions/{id}/hearings"
      - "POST /rent-board/buyouts/{id}/complete"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /rent-board/units"
      - "POST /rent-board/units/{id}/registrations"
      - "POST /rent-board/tenancies"
      - "POST /rent-board/tenancies/{id}/end"
      - "POST /rent-board/service-claims/{id}/investigate"
      - "POST /rent-board/service-claims/{id}/restore"
      - "GET (all read endpoints)"

  - name: ComplianceOfficer
    description: Regulatory compliance; decides exemptions/decontrol, assesses and confirms penalties (four-eyes)
    identity: "opaque"
    exclusive_operations:
      - "POST /rent-board/exemptions/{id}/decide"
      - "POST /rent-board/penalties"
      - "POST /rent-board/penalties/{id}/confirm"
    shared_operations:
      - "GET (units, penalties, exemptions, registrations, landlords)"
