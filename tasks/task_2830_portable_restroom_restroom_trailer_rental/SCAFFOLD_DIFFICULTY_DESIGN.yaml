      - name: permit_reject_resubmit_cycle_increments_revision_round_to_limit
        grounds:
          - state_machines.PlacementPermit
          - state_machines.PlacementPermit.DRAFT_to_SUBMITTED
          - state_machines.PlacementPermit.SUBMITTED_to_REJECTED
          - state_machines.PlacementPermit.REJECTED_to_SUBMITTED
          - entities.PlacementPermit.fields.revision_round
          - entities.PlacementPermit.fields.rejection_reason
          - validations[priority=22]
          - errors[ERR_PERMIT_REVISION_LIMIT]
        distinguishing_aspect: |
          Non-linearity by a TRUE CYCLE on a different entity (PlacementPermit): REJECTED -> SUBMITTED
          re-enters a state the row already left, and the loop is bounded by revision_round reaching
          PERMIT_MAX_REVISION_ROUNDS 3, after which the fourth submit is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; MUNICIPAL account with one site requiring a PLACEMENT permit."
            - "The permit has been submitted once (revision_round 1) and rejected once, so its status is REJECTED."
