            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ordA: $.data.id } }
            - { call: "POST /fenestration/orders/${ordA}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 4, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { lineA: $.data.id } }
