          - state_machines.Recount.REQUESTED_to_WITHDRAWN
        distinguishing_aspect: |
          Metric: required_deposit_cents in integer cents at POST /recounts. A 1000-ballot partial scope prices at
          90000 and is lifted to the 100000 floor, a 1250-ballot partial scope prices at exactly 100000 with no lift,
          and the 2250-ballot full-contest scope at the lower full rate prices at 106250 - proving max(floor, raw) is
          applied before min(cap, ...).
        test_recipe:
          setup:
            - "Election ST-02 with contests C2 and C3 both canvassed; C3 (FORD 1180 / GRANT 1070 of 2250 ballots, margin_votes 110, margin_pct 4.8889) has batches C3-B01 1250 and C3-B02 1000."
            - "Clock is 2026-11-05T09:00:00Z, inside C3's 5-day recount request window; margin_pct 4.8889 is inside the 10.0000 request-eligible ceiling."
            - "rep-grant files a PARTIAL_BATCHES recount over C3-B02 alone (raw 50000 + 40 * 1000 = 90000, lifted to the 100000 floor) and withdraws it while the deposit is still PENDING, so nothing is charged."
            - "rep-grant then files a PARTIAL_BATCHES recount over C3-B01 alone (raw 50000 + 40 * 1250 = 100000, exactly the floor) and withdraws that too, clearing the scope for the full-contest filing under test."
            - "Each filing re-reads Contest.version first, because filing and withdrawing both bump it."
