        claim_type: side_effect_execution
        grounds:
          - state_machines.Signup.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: "check-in creates exactly one DistributionRecord kind=CREDENTIAL status=ISSUED discoverable via GET /distribution-records?signup_id=..&kind=CREDENTIAL."
        test_recipe:
          setup: ["RACE_DAY; signup CONFIRMED; clock 06:00 within check-in window"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
