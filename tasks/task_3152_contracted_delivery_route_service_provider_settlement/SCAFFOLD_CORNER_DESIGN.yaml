  - name: stale_service_area_version_on_title_create
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[assignment-create-stale-area]
    - errors[ERR_STALE_VERSION]
    - entities.ServiceArea.fields.version
    distinguishing_aspect: 'Two strictly sequential creates against the same area: the second carries the version read before the first advanced it and is refused with 412.'
    test_recipe:
      setup:
      - Provider A is APPROVED and service area A1 is UNASSIGNED at version 1
      setup_api_calls:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
          area_v_read: $.data.version
      trigger:
      - call: POST /route-settlement/route-assignments
        payload:
          service_area_id: ${area_a1_id}
          provider_id: ${prov_a_id}
          effective_date: '2026-09-03T00:00:00Z'
          transfer_price_cents: 0
          expected_service_area_version: ${area_v_read}
        as: AccountManager
        captures:
          asg_a1_id: $.data.id
      - call: POST /route-settlement/route-assignments
        payload:
          service_area_id: ${area_a1_id}
          provider_id: ${prov_a_id}
          effective_date: '2026-09-04T00:00:00Z'
          transfer_price_cents: 0
          expected_service_area_version: ${area_v_read}
        as: AccountManager
        captures:
          err_stale_area: $.data.error_id
      assert:
      - the first create returns 201 and advances ServiceArea.${area_a1_id}.version to ${area_v_read} + 1
      - the second create returns ERR_STALE_VERSION with 412
      - the assignment list filtered on service_area_id ${area_a1_id} has exactly one row
