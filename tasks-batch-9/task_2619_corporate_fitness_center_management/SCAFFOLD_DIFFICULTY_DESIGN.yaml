  - rule_id: non_linear_state_machine
    instances:

      # ---------------------------------------------------------------- 1 / 2 --
      - name: credential_expiry_renew_reverify_cycle_returns_to_verified
        grounds:
          - state_machines.StaffCredential
          - state_machines.StaffCredential.VERIFIED_to_EXPIRED
          - state_machines.StaffCredential.EXPIRED_to_PENDING_VERIFICATION
          - state_machines.StaffMember.SUSPENDED_FROM_DUTY_to_ACTIVE_DUTY
          - entities.StaffCredential.fields.renewal_count
          - calculations.staff_readiness_index
        distinguishing_aspect: |
          StaffCredential is the CYCLIC machine: PENDING_VERIFICATION -> VERIFIED
          -> EXPIRED -> PENDING_VERIFICATION -> VERIFIED revisits a state it
          already left, and renewal_count is the loop counter that distinguishes
          the second visit from the first. The cycle also drives the holder's
          duty_status down and back up, which no linear pipeline in this scaffold
          does.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ACTIVE COST_PLUS contract with a site manager holding a VERIFIED CPR_AED credential."
            - "One GROUP_EX_INSTRUCTOR ('Ravi Patel') whose GROUP_EX_CERT expires_on is 2026-08-15 and is VERIFIED while the clock is still 2026-08-01 (verification requires expires_on > today)."
            - "The instructor has a 2026-07-15 emergency-response drill, so drill_score stays 100 for the whole recipe and readiness moves only with the credential component."
            - "The clock is then advanced past the expiry to 2026-08-20T06:00:00Z and the ops run is invoked, which is the only actor allowed to expire a credential."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
