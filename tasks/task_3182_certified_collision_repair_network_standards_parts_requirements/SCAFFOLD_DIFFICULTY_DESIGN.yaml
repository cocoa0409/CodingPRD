        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cyc1: $.data.id
      trigger:
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2027-08-31T23:59:59Z'
          window_end: '2028-08-30T23:59:59Z'
        as: NetworkAdmin
        captures:
          err_overlap: $.data.error_id
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2027-09-01T00:00:01Z'
          window_end: '2028-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          err_gap: $.data.error_id
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2027-09-01T00:00:00Z'
          window_end: '2028-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cyc2: $.data.id
      assert:
      - Overlap by one second (start == prev.window_end) rejected with ERR_CYCLE_WINDOW
      - Gap of one second (start == prev.window_end + 2s) rejected with ERR_CYCLE_WINDOW
      - 'Exact adjacency (start == prev.window_end + 1s) succeeds: cycle 2 created'
      - Non-365-day window is also rejected (implied by the two rejected payloads' ends)
- rule_id: compensating_invariant
  instances:
  - name: warranty_reserve_roundtrip_zero_drift
    grounds:
    - calculations.warranty_reserve_accrual
    - state_machines.RepairOrder.COMPLETE_to_WARRANTY_ACTIVE
    - state_machines.RepairOrder.WARRANTY_ACTIVE_to_CLOSED
    - entities.Shop.fields.warranty_reserve_cents
    distinguishing_aspect: "Conserved quantity: Shop.warranty_reserve_cents. The forward action (COMPLETE -> WARRANTY_ACTIVE accrues +A) paired with its compensating action (WARRANTY_ACTIVE -> CLOSED with\
      \ no accepted claims releases -A) MUST leave the reserve unchanged \u2014 net zero drift."
    test_recipe:
      setup:
      - CERTIFIED shop; non-ADAS order, estimate 200000 cents, rework_count 0 -> accrual A = 5000 cents (tier1 100000*3% = 3000; tier2 100000*2% = 2000; multiplier 1.0; penalty 0)
      - Order driven to COMPLETE, then +24h sweep -> WARRANTY_ACTIVE (reserve 5000)
      - Then clock advanced past completed_at + 12 months -> CLOSED (release -5000)
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Reserve Body
          state_code: NM
          zip_code: '87101'
          latitude: 35.08
          longitude: -106.65
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cycle_id: $.data.id
      - call: POST /network/certification-cycles/${cycle_id}/audits
        payload:
          scheduled_start: '2026-09-01T01:00:00Z'
          scheduled_end: '2026-09-01T09:00:00Z'
        as: NetworkAuditor
        as_user_id: aud-1
        captures:
          audit_id: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${audit_id}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${audit_id}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/shops/${shop_id}/technicians
        payload:
          full_name: Re Serve
          tech_role: NON_STRUCTURAL
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          tech_id: $.data.id
      - call: GET /network/shops/${shop_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          shop_v2: $.data.version
      - call: POST /network/shops/${shop_id}/repair-orders
        payload:
          expected_shop_version: ${shop_v2}
          vin: 1HGCV1F34LA000012
          vehicle_model_year: 2015
          estimate_total_cents: 200000
          assigned_technician_id: ${tech_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          order_id: $.data.id
      - call: POST /network/repair-orders/${order_id}/procedure-steps
        payload:
          step_type: PRE_SCAN
          performed_by_technician_id: ${tech_id}
          performed_at: '2026-09-01T03:00:00Z'
          result: PASS
          scan_report_uri: s3://scans/r1.json
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/approve
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/part-lines
        payload:
          part_number: P-RSV
          part_class: OE
          unit_cost_cents: 50000
          quantity: 1
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/start-repair
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/submit-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/procedure-steps
        payload:
          step_type: POST_SCAN
          performed_by_technician_id: ${tech_id}
          performed_at: '2026-09-01T05:00:00Z'
          result: PASS
          scan_report_uri: s3://scans/r2.json
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/pass-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      trigger:
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T06:00:00Z'
        as: NetworkAdmin
      - call: GET /network/shops/${shop_id}
        as: NetworkAdmin
        captures:
          reserve_mid: $.data.warranty_reserve_cents
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2027-09-02T06:00:00Z'
        as: NetworkAdmin
      - call: GET /network/shops/${shop_id}
        as: NetworkAdmin
      assert:
      - 'After the +24h sweep: RepairOrder.${order_id}.status == WARRANTY_ACTIVE and reserve_mid == 5000'
      - 'After the +12-month sweep: RepairOrder.${order_id}.status == CLOSED'
      - "Shop.${shop_id}.warranty_reserve_cents == 0 (accrual 5000 fully released \u2014 compensating invariant holds, zero drift)"
  - name: referral_pending_count_roundtrip_zero_drift
    grounds:
    - state_machines.Referral.UNROUTED_to_ROUTED
    - state_machines.Referral.ROUTED_to_EXPIRED
    - entities.Shop.fields.pending_referral_count
    distinguishing_aspect: 'DIFFERENT conserved quantity: Shop.pending_referral_count. Routing (+1) paired with TTL expiry (-1) leaves the counter unchanged; two referrals routed then both expired net to
      zero.'
    test_recipe:
      setup:
