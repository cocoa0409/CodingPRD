scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: patient_create_computed_renal_fields
        claim_type: computed_fields
        grounds: [entities.PatientProfile.fields.ibw_kg, entities.PatientProfile.fields.crcl_ibw_ml_min, entities.PatientProfile.fields.bmi]
        distinguishing_aspect: "POST /pharmacy/patients derives the renal panel: male 40y (DOB 1986-08-01), 180 cm, 90 kg, SCr 1.0 -> age 40, ibw 74.99, bmi 27.78, crcl_ibw 104.15, abw null (bmi < 30)."
        test_recipe:
          setup: ["Clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Comp Pat", date_of_birth: "1986-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 90.0, scr_mg_dl: 1.0 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "GET /pharmacy/patients/${pat_id}"
              payload: {}
              as: PharmacyAdmin
              captures: { age: $.data.age_years, ibw: $.data.ibw_kg, bmi: $.data.bmi, crcl: $.data.crcl_ibw_ml_min, abw: $.data.abw_kg }
          assert:
            - "age_years == 40 (birthday counts on the date itself at default clock)"
            - "ibw_kg == 74.99 (50 + 2.3*(180/2.54 - 60))"
            - "bmi == 27.78 (90 / 1.8^2)"
            - "crcl_ibw_ml_min == 104.15 ((140-40)*74.99/(72*1.0))"
            - "abw_kg == null and crcl_abw_ml_min == null (bmi 27.78 < 30)"
      - name: drug_product_create_defaults
        claim_type: defaults
        grounds: [entities.DrugProduct.fields.is_hazardous, entities.DrugProduct.fields.renal_dosing_policy, entities.DrugProduct.fields.status]
        distinguishing_aspect: "Omitting optional drug fields applies defaults: is_hazardous false, has_stability_data false, renal_dosing_policy IBW, in_shortage false, status ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /pharmacy/drug-products"
              payload: { name: "Defaults Drug", schedule: "C_IV", concentration_mg_per_ml: 5.0, vial_size_ml: 2.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
          trigger:
            - call: "GET /pharmacy/drug-products/${drug_id}"
              payload: {}
              as: PharmacyAdmin
          assert:
            - "is_hazardous == false, has_stability_data == false, renal_dosing_policy == IBW, in_shortage == false, status == ACTIVE"
      - name: order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pharmacy/medication-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"
      - name: order_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pharmacy/medication-orders without drug_product_id fails schema validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Patient exists"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Req", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Req", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (missing required drug_product_id)"
      - name: staff_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.StaffMember.fields.staff_role, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "staff_role 'DOCTOR' is outside the enum {PRESCRIBER, PHARMACIST, TECHNICIAN, NURSE} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Bad Role", staff_role: "DOCTOR" }
              as: PharmacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
      - name: intervention_append_only_immutability
        claim_type: immutability
        grounds: [entities.ClinicalIntervention]
        distinguishing_aspect: "ClinicalIntervention has common_fields: false (append-only event): response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["Verified order exists"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Imm", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Imm", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugImm", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/interventions"
              payload: { intervention_type: "OTHER", note: "note", placed_on_hold: false }
              as: Pharmacist
              captures: { iv_id: $.data.id }
          assert:
            - "response data contains id and created_at but no version key"
            - "GET /pharmacy/interventions/${iv_id} returns the row with pharmacist_staff_id set and placed_on_hold == false"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: batch_qa_release_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CompoundingBatch.QA_REVIEW_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "qa-release on a DRAFT batch (never started) is an invalid-from rejection: ERR_INVALID_STATE (409), no preparations transition."
        test_recipe:
          setup: ["Clock at default; verified IV order; hood session SCHEDULED; batch DRAFT containing the order"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr IS", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech IS", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat IS", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugIS", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-IS", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_id}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/batches/${batch_id}/qa-release"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409): QA_REVIEW is the only valid from-state for release"
            - "GET /pharmacy/batches/${batch_id}: status still DRAFT"
      - name: order_discontinue_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MedicationOrder.verification:PENDING_|_VERIFIED_|_ON_HOLD_to_verification:DISCONTINUED, "errors[ERR_ORDER_ALREADY_TERMINAL]"]
        distinguishing_aspect: "From terminal verification DISCONTINUED every further mutation (verify, discontinue again, interventions) is rejected with ERR_ORDER_ALREADY_TERMINAL (409)."
        test_recipe:
          setup: ["Order created and discontinued by its prescriber"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr TL", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat TL", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugTL", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/discontinue"
              payload: { reason: "stop" }
              as: Prescriber
              as_user_id: "${pres_id}"
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
              captures: { err1: $.data.error_id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/discontinue"
              payload: { reason: "again" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/interventions"
              payload: { intervention_type: "OTHER", note: "x", placed_on_hold: false }
              as: Pharmacist
              captures: { err3: $.data.error_id }
          assert:
            - "verify on terminal order: error_id == ERR_ORDER_ALREADY_TERMINAL (409)"
            - "second discontinue: error_id == ERR_ORDER_ALREADY_TERMINAL (409)"
            - "intervention on terminal order: error_id == ERR_ORDER_ALREADY_TERMINAL (409)"
      - name: hood_session_start_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.HoodSession.SCHEDULED_to_IN_USE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second start on an already IN_USE session is rejected ERR_INVALID_STATE (409); the first start's version increment already happened."
        test_recipe:
          setup: ["Hood + session SCHEDULED; clock inside the window (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech HS", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-HS", iso_class: "ISO_7" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-02T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); session remains IN_USE"
      - name: preparation_auto_expiry_on_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.CompoundedPreparation.COMPOUNDED_|_QA_PASSED_to_EXPIRED, calculations.beyond_use_dating]
        distinguishing_aspect: "System transition: setting the logical clock to exactly bud_expiry (HIGH/ROOM 24h from 2026-08-01T00:00:00Z -> 2026-08-02T00:00:00Z) flips the COMPOUNDED preparation to EXPIRED and appends an EXPIRED WasteRecord — the expiry boundary is inclusive (now >= bud_expiry)."
        test_recipe:
          setup:
            - "Healthy patient; Drug E non-hazardous; verified IV order 100 mg"
            - "HIGH-risk batch completed at clock 2026-08-01T00:00:00Z, storage ROOM -> bud_expiry 2026-08-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr EX", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech EX", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat EX", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugEX", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-EX", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_id}"], usp_risk_level: "HIGH" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [10.0], waste_ml: 0.0, storage_condition: "ROOM" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PharmacyAdmin
            - call: "GET /pharmacy/preparations"
              payload: { order_id: "${ord_id}" }
              as: Pharmacist
          assert:
            - "preparation.bud_expiry == 2026-08-02T00:00:00Z (HIGH/ROOM = 24h)"
            - "at clock exactly == bud_expiry the preparation status == EXPIRED (inclusive boundary)"
            - "GET /pharmacy/batches/${batch_id}/waste-records includes a row with reason == EXPIRED"
      - name: protocol_auto_expiry_on_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.SubstitutionProtocol.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "ACTIVE protocol with expires_at 2026-08-10T00:00:00Z flips to EXPIRED when the clock is set to exactly that instant (inclusive), and its compensation cascade unflags orders and unblocks pockets."
        test_recipe:
          setup:
            - "Drug SHORT in_shortage; order flagged substitution_pending=true and pocket pick_blocked=true via activation"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr PE", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat PE", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugPES", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, in_shortage: true }
              as: PharmacyAdmin
              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugPEU", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-PE", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_short}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-08-10T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
          trigger:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PharmacyAdmin
            - call: "GET /pharmacy/substitution-protocols/${proto_id}"
              payload: {}
              as: PharmacyAdmin
              captures: { p_status: $.data.status }
            - call: "GET /pharmacy/medication-orders/${ord_id}"
              payload: {}
              as: Pharmacist
              captures: { o_flag: $.data.substitution_pending }
            - call: "GET /pharmacy/adc-pockets/${pk_id}"
              payload: {}
              as: Pharmacist
              captures: { pk_blocked: $.data.pick_blocked }
          assert:
            - "protocol status == EXPIRED at clock exactly == expires_at (inclusive)"
            - "order substitution_pending == false (compensation cascade)"
            - "pocket pick_blocked == false (compensation cascade)"
      - name: discrepancy_case_full_lifecycle_with_adjustment
        claim_type: valid_transition
        grounds: ["state_machines.DiscrepancyCase.OPEN_to_INVESTIGATING", "state_machines.DiscrepancyCase.INVESTIGATING_to_RESOLVED", "calculations.adc_expected_on_hand"]
        distinguishing_aspect: "OPEN -> INVESTIGATING -> RESOLVED with FOUND_ERROR applies a compensating ADJUSTMENT ledger event: pocket expected 46 vs physical 44 (variance -2 on C_II breaches threshold 2), adjustment +2 restores on_hand to 44+2=46==expected... the adjustment aligns the ledger to the physical count."
        test_recipe:
          setup: ["C_II pocket restocked to 50, then 4 witnessed wastes -> expected 46; count physical 44 -> variance -2 opens case"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech DC", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Nurse DC", staff_role: "NURSE" }
              as: PharmacyAdmin
              captures: { wit_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugDC2", schedule: "C_II", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-DC", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_id}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_id}/waste"
              payload: { units: 4, witness_staff_id: "${wit_id}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_id}/count"
              payload: { physical_count_units: 44 }
              as: Pharmacist
              captures: { case_id: $.data.discrepancy_case_id }
          trigger:
            - call: "POST /pharmacy/discrepancy-cases/${case_id}/investigate"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/discrepancy-cases/${case_id}/resolve"
              payload: { resolution: "FOUND_ERROR", adjustment_units: -2 }
              as: Pharmacist
              captures: { res_status: $.data.status }
            - call: "GET /pharmacy/adc-pockets/${pk_id}"
              payload: {}
              as: Pharmacist
              captures: { onhand: $.data.on_hand_units }
          assert:
            - "case status transitions OPEN -> INVESTIGATING -> RESOLVED with resolution == FOUND_ERROR"
            - "ADJUSTMENT event appended with units_delta == -2 and pocket on_hand_units == 44 (ledger aligned to physical count)"
            - "case.resolved_by_staff_id != null"
      - name: discrepancy_escalation_creates_diversion_case
        claim_type: side_effect_execution
        grounds: ["state_machines.DiscrepancyCase.INVESTIGATING_to_ESCALATED", "entities.DiversionCase.fields.opened_via"]
        distinguishing_aspect: "Resolving with UNRESOLVED_ESCALATE moves the case to ESCALATED and cross-entity cascade-creates a DiversionCase (OPEN, opened_via ESCALATION, source_discrepancy_case_id set, station derived from the pocket)."
        test_recipe:
          setup: ["Same C_II discrepancy setup as discrepancy_case_full_lifecycle_with_adjustment, but resolved via escalation"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
