  # ===========================================================================
  # 5. Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: success_and_error_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type object, data; error responses carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cc/facilities"
              payload: { name: "Env Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "GET /cc/facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp ISO8601, response_type == object, data.id == ${fac}"
            - "error: response_type == error, data.error_id == ERR_FACILITY_NOT_FOUND, data.message present"

      - name: transfer_request_list_status_filter
        claim_type: listing
        grounds: [entities.TransferRequest]
        distinguishing_aspect: "Filtered list returns only requests in the requested status; total_count reflects the filter."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; two INTAKE requests, one CANCELLED"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Filter Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PF1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { f1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PF2", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PF3", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "ELECTIVE" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { f3: $.data.id }
            - call: "POST /cc/transfer-requests/${f3}/cancel"
              payload: {}
              as: TransferCenterCoordinator
          trigger:
            - call: "GET /cc/facilities/${fac}/transfer-requests?status=CANCELLED"
              as: Any
          assert:
            - "data contains exactly [${f3}] and total_count == 1"
            - "unfiltered GET total_count == 3"

      - name: fk_reverse_reachability_reads
        claim_type: cross_reference
        grounds: [entities.BedHold.fields.bed_id, entities.BedHold.fields.transfer_request_id, entities.BoardingRecord.fields.admission_id, entities.TransferRequest.fields.accepting_physician_id]
        distinguishing_aspect: "Cascade-created and FK-linked children are discoverable via reverse GETs: holds by bed and by request (array of 1), boarding records by admission, requests by accepting physician."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; bed; request walked to HOLD_PLACED; ED admission with boarding record"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "FK Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr FK", services: ["CARDIAC", "MEDICAL"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { eb: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PFK", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${eb}", patient_ref: "PED", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { br: $.data.id }
          trigger:
            - call: "GET /cc/beds/${b1}/bed-holds"
              as: Any
            - call: "GET /cc/transfer-requests/${tr}/bed-holds"
              as: Any
            - call: "GET /cc/admissions/${adm}/boarding-records"
              as: Any
            - call: "GET /cc/physicians/${dr}/transfer-requests"
              as: Any
          assert:
            - "GET /cc/beds/${b1}/bed-holds returns [${hold}] (total_count 1)"
            - "GET /cc/transfer-requests/${tr}/bed-holds returns [${hold}]"
            - "GET /cc/admissions/${adm}/boarding-records returns [${br}]"
            - "GET /cc/physicians/${dr}/transfer-requests returns [${tr}]"

      - name: bed_candidates_computed_read
        claim_type: computed_read
        grounds: [calculations.bed_match_score]
        excluded_because:
          difficulty_instance: bed_match_score_tiered_ranking
          rationale: "Ranked candidate output with literal scores asserted in the named §1.8 instance."

      - name: load_score_computed_read
        claim_type: computed_read
        grounds: [calculations.transfer_load_score]
        excluded_because:
          difficulty_instance: load_score_raw_vs_weighted_variants
          rationale: "Computed read asserted with literal values in the named §1.8 instance."


  # ===========================================================================
  # 6. Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_family_all_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_PHYSICIAN_NOT_FOUND]", "errors[ERR_ADMISSION_NOT_FOUND]", "errors[ERR_TRANSFER_REQUEST_NOT_FOUND]", "errors[ERR_HOLD_NOT_FOUND]", "errors[ERR_ASSIGNMENT_NOT_FOUND]", "errors[ERR_DIVERSION_NOT_FOUND]", "errors[ERR_BOARDING_RECORD_NOT_FOUND]", "errors[ERR_HUDDLE_NOT_FOUND]", "errors[ERR_FORECAST_NOT_FOUND]"]
        distinguishing_aspect: "Every resource-specific 404 is triggerable by addressing a well-formed but non-existent UUID on that resource's endpoint."
        test_recipe:
          setup: ["One facility exists so nested paths pass the parent check"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "NF Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /cc/physicians/11111111-1111-4111-8111-111111111111"
              as: Any
              captures: { e_phys: $.data.error_id }
            - call: "GET /cc/admissions/22222222-2222-4222-8222-222222222222"
              as: Any
              captures: { e_adm: $.data.error_id }
            - call: "GET /cc/transfer-requests/33333333-3333-4333-8333-333333333333"
              as: Any
              captures: { e_tr: $.data.error_id }
            - call: "GET /cc/bed-holds/44444444-4444-4444-8444-444444444444"
              as: Any
              captures: { e_hold: $.data.error_id }
            - call: "POST /cc/bed-assignments/55555555-5555-4555-8555-555555555555/complete"
              payload: {}
              as: BedManager
              as_user_id: "bm_1"
              captures: { e_asg: $.data.error_id }
            - call: "POST /cc/diversions/66666666-6666-4666-8666-666666666666/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_9"
              captures: { e_div: $.data.error_id }
            - call: "GET /cc/boarding-records/77777777-7777-4777-8777-777777777777"
              as: Any
              captures: { e_br: $.data.error_id }
            - call: "POST /cc/huddles/88888888-8888-4888-8888-888888888888/resolve"
              payload: { resolution: "x" }
              as: HouseSupervisor
              as_user_id: "hs_9"
              captures: { e_hud: $.data.error_id }
            - call: "GET /cc/capacity-forecasts/99999999-9999-4999-8999-999999999999"
              as: Any
              captures: { e_fc: $.data.error_id }
          assert:
            - "e_phys == ERR_PHYSICIAN_NOT_FOUND (404)"
            - "e_adm == ERR_ADMISSION_NOT_FOUND (404)"
            - "e_tr == ERR_TRANSFER_REQUEST_NOT_FOUND (404)"
            - "e_hold == ERR_HOLD_NOT_FOUND (404)"
            - "e_asg == ERR_ASSIGNMENT_NOT_FOUND (404)"
            - "e_div == ERR_DIVERSION_NOT_FOUND (404)"
            - "e_br == ERR_BOARDING_RECORD_NOT_FOUND (404)"
            - "e_hud == ERR_HUDDLE_NOT_FOUND (404)"
            - "e_fc == ERR_FORECAST_NOT_FOUND (404)"

      - name: admission_confirm_from_admitted_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ADMISSION_INVALID_STATE]"]
        distinguishing_aspect: "confirm-discharge requires PENDING_DISCHARGE; calling it on a fresh ADMITTED admission fails ERR_ADMISSION_INVALID_STATE."
        test_recipe:
          setup: ["Clock at 00:00; facility; bed occupied by ADMITTED admission"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
