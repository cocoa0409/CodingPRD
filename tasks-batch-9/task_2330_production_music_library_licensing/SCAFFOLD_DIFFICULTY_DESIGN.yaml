  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cataloging_requires_active_composer_agreement
        grounds:
          - state_machines.Composition.INGESTED_to_CATALOGED
          - validations[priority=13]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - entities.Composition.fields.agreement_id
          - state_machines.ComposerAgreement.PENDING_SIGNATURE_to_ACTIVE
        distinguishing_aspect: |
          Entity pair Composition -> ComposerAgreement: the Composition INGESTED -> CATALOGED transition
          is legal on the Composition's own axis yet is refused with ERR_AGREEMENT_NOT_ACTIVE while the
          governing ComposerAgreement is still DRAFT, and the identical call succeeds the moment the
          composer signs, so the gate lives entirely in the other entity's state.
        test_recipe:
          setup:
            - "One composer."
            - "One ComposerAgreement in DRAFT (never submitted, never signed)."
            - "One composition under that agreement, catalog_status INGESTED with non-empty mood_tags and instrumentation."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Hana Petrov", pro_affiliation: "PRS", payee_country: "GB", tax_withholding_pct: 0.20 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 35.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Salt Flats", duration_sec: 220, tempo_bpm: 76, genre: "CLASSICAL", mood_tags: ["CALM", "HOPEFUL"], instrumentation: ["STRINGS"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
          trigger:
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Hana Petrov" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
          assert:
            - "the first catalog attempt (agreement DRAFT) returns error_id == ERR_AGREEMENT_NOT_ACTIVE with status 409"
            - "the second catalog attempt (agreement PENDING_SIGNATURE) also returns ERR_AGREEMENT_NOT_ACTIVE with status 409"
            - "after both failures Composition.${comp1}.catalog_status == INGESTED and availability_status == AVAILABLE"
            - "ComposerAgreement.${ag1}.status == ACTIVE and signed_at == 2026-08-01T00:00:00Z after the sign call"
            - "the third catalog attempt returns 200 with Composition.${comp1}.catalog_status == CATALOGED"
            - "Composition.${comp1}.availability_status is still AVAILABLE (the catalog transition does not touch the rights axis)"
            - "no RoyaltyLedgerEntry is created by signing because advance_cents == 0 and agreement_type == ROYALTY_SPLIT"

      - name: blanket_license_issuance_requires_active_and_compliant_blanket
        grounds:
          - validations[priority=19]
          - errors[ERR_BLANKET_NOT_ACTIVE]
          - state_machines.BlanketAgreement.DRAFT_to_ACTIVE
          - state_machines.BlanketAgreement.COMPLIANT_to_DELINQUENT
          - entities.License.fields.license_mode
          - entities.License.fields.final_fee_cents
          - entities.BlanketAgreement.fields.delinquent_since
        distinguishing_aspect: |
          A different entity pair from Composition -> ComposerAgreement: License -> BlanketAgreement,
          and the dependency reads TWO independent axes of the same parent. Issuance is refused with
          ERR_BLANKET_NOT_ACTIVE while coverage_status is DRAFT, succeeds once coverage_status is ACTIVE,
          and is refused with the same error again after the reporting axis alone flips to DELINQUENT
          while coverage_status is still ACTIVE.
        test_recipe:
