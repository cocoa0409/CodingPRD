      - name: event_participation_three_dimensions_advance_independently
        grounds:
          - state_machines.EventParticipation
          - entities.EventParticipation.fields.attendance_status
          - entities.EventParticipation.fields.performance_eligibility
          - entities.EventParticipation.fields.tour_status
          - calculations.attendance_eligibility_index
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Parallel shape on a DIFFERENT entity than the revision cycle: one
          EventParticipation row carries three orthogonal dimensions. An
          eligibility review moves only performance_eligibility, a
          tour-requirements call moves only tour_status, and an attendance call
          moves only attendance_status - the combined state after all three is
          (TARDY, ELIGIBLE, READY), a triple no single dimension could produce.
        test_recipe:
