        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch, block B-12 (12.5 acres) enrolled under ACTIVE contract C1 with governing estimate 91.47 tons (tolerance ceiling 100.62)."
            - "ACTIVE HARVEST-capable crew CR1 and window DW_SMALL (capacity_tons 20.00, 2026-09-14T06:00:00Z..18:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b1_id}", contracted_acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-01", avg_clusters_per_vine: 32.0, avg_cluster_weight_lb: 0.42 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { ye1_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "CR1 Piece Crew", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.65, vines_per_hour_standard: 45, task_capabilities: ["PRUNING", "SUCKERING", "LEAFING", "HARVEST"], pest_certified: false, crew_status: "ACTIVE" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { cr1_id: $.data.id }
            - call: "POST /delivery-windows"
              payload: { winery_name: "Estrella Cellars", window_start: "2026-09-14T06:00:00Z", window_end: "2026-09-14T18:00:00Z", capacity_tons: 20.00 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { dws_id: $.data.id, dws_v: $.data.version }
          trigger:
            - call: "POST /harvest-loads"
              payload: { block_id: "${b1_id}", crew_id: "${cr1_id}", delivery_window_id: "${dws_id}", estimated_tons: 16.99, delivery_eta: "2026-09-14T09:00:00Z", expected_delivery_window_version: "${dws_v}" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { hl1_id: $.data.id }
            - call: "GET /delivery-windows/${dws_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { dws_committed_1: $.data.committed_tons, dws_remaining_1: $.data.remaining_tons, dws_posture_1: $.data.window_posture, dws_v2: $.data.version }
            - call: "POST /harvest-loads"
              payload: { block_id: "${b1_id}", crew_id: "${cr1_id}", delivery_window_id: "${dws_id}", estimated_tons: 0.01, delivery_eta: "2026-09-14T15:00:00Z", expected_delivery_window_version: "${dws_v2}" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { hl2_id: $.data.id }
            - call: "GET /delivery-windows/${dws_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { dws_committed_2: $.data.committed_tons, dws_remaining_2: $.data.remaining_tons, dws_posture_2: $.data.window_posture }
          assert:
            - "after the 16.99 booking committed_tons == 16.99, remaining_tons == 3.01 and window_posture == OPEN (0.84950 < 0.85)"
            - "after the 0.01 booking committed_tons == 17.00, remaining_tons == 3.00 and window_posture == NEARLY_FULL (17.00 / 20.00 == 0.85 exactly, compared with >=)"
            - "both creates return HTTP 201; neither breaches validations[priority=111] because 17.00 <= 20.00"
            - "Block.${b1_id}.committed_harvest_tons == 17.00, still under the 100.62 tolerance ceiling"

      - name: five_level_cascade_from_spray_apply
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: spray_apply_cascades_five_levels_to_plan_posture
          rationale: "That §1.8 instance already walks the full SprayRecord -> Block compliance fields -> WorkOrder execution_status -> FarmingPlan.committed_cost -> budget_posture chain end-to-end with per-level literal assertions, and its sibling harvest_receive_cascades_four_levels_to_projected_billable covers the second cascade; a corner test would restate them."

      - name: dual_variant_labor_and_settlement_calculations
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: work_order_labor_cost_estimated_vs_actual_divergence
          rationale: "Both declared dual-variant calculations are exercised by §1.8: work_order_labor_cost by that instance, and contract_period_settlement by contract_settlement_provisional_vs_final_divergence, each asserting both variant results and the delta on switch."

  - section: consistency model
    instances:
      - name: derived_fields_are_visible_in_the_same_response_that_changes_them
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.farming_plan_committed_cost
          - endpoints[POST /work-orders/{id}/complete]
        distinguishing_aspect: "Consistency is immediate and no re-read is needed to see a derived value: the create response already carries estimated_labor_cost 4343.30, the complete response already carries actual_labor_cost 5011.50, and an immediate GET of the plan returns exactly the same committed_cost 5011.50 with remaining_budget 9676.00."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch, block B-12 (12.5 acres), APPROVED FarmingPlan P1 for 2026 (total_budget 14687.50)."
            - "ACTIVE PIECE_RATE crew CR1 (size 12, 19.50 / 0.65 / 45)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "PREMIUM", pruning_budget_per_acre: 420.00, canopy_budget_per_acre: 310.00, irrigation_budget_per_acre: 180.00, pest_budget_per_acre: 265.00, seasonal_water_cap_inches: 9.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "2026 program for B-12" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /farming-plans/${p1_id}/approve"
              payload: { approval_note: "Approved as submitted" }
              as: Controller
              as_user_id: "u-ctl-1"
            - call: "POST /crews"
              payload: { crew_name: "CR1 Piece Crew", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.65, vines_per_hour_standard: 45, task_capabilities: ["PRUNING", "SUCKERING", "LEAFING", "HARVEST"], pest_certified: false, crew_status: "ACTIVE" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { cr1_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", crew_id: "${cr1_id}", task_type: "PRUNING", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T18:00:00Z", planned_vines: 5200, planned_hours: 12.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { wo1_id: $.data.id, wo1_est: $.data.estimated_labor_cost }
            - call: "GET /farming-plans/${p1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { p1_committed_1: $.data.committed_cost, p1_remaining_1: $.data.remaining_budget }
            - call: "POST /work-orders/${wo1_id}/start"
              payload: {}
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
              captures: { wo1_exec: $.data.execution_status }
            - call: "POST /work-orders/${wo1_id}/complete"
              payload: { actual_vines: 6000, actual_hours: 10.0 }
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
              captures: { wo1_actual: $.data.actual_labor_cost, wo1_est2: $.data.estimated_labor_cost, wo1_payroll: $.data.payroll_status }
            - call: "GET /farming-plans/${p1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { p1_committed_2: $.data.committed_cost, p1_remaining_2: $.data.remaining_budget, p1_posture_2: $.data.budget_posture }
          assert:
            - "the create response itself carries estimated_labor_cost == 4343.30"
            - "the immediate plan read returns committed_cost == 4343.30 and remaining_budget == 10344.20 with no second write in between"
            - "the complete response itself carries actual_labor_cost == 5011.50 while estimated_labor_cost stays frozen at 4343.30"
            - "the immediate plan read returns committed_cost == 5011.50 and remaining_budget == 9676.00"
            - "budget_posture == WITHIN_BUDGET (5011.50 / 14687.50 = 0.3412...)"
            - "payroll_status == PENDING in the same complete response"
