  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a request with no X-User-Role/X-User-ID headers fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the target id does not exist (auth beats NOT_FOUND)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bakery/plants/00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: not_found_beats_invalid_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Priority 3 before 6: abort on a nonexistent batch id returns ERR_NOT_FOUND, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bakery/batches/00000000-0000-4000-8000-000000000000/abort"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: suspended_store_blocks_order_confirm
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STORE_SUSPENDED]", state_machines.Store]
        distinguishing_aspect: "A SUSPENDED store's order cannot be confirmed; the order stays PLACED."
        test_recipe:
          setup: ["Store suspended; one PLACED order"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
