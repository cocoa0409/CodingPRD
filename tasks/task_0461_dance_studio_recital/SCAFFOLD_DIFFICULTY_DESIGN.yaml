              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 1, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "fdr@x.com", family_name: "Dr" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Kid Dr", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "ClassSection.${sec_id}.status == SCHEDULED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_with_turnover_buffer
        grounds:
          - validations[priority=9]
          - entities.Room.fields.turnover_buffer_minutes
          - entities.ClassSession.fields.start_minute
          - state_machines.ClassSection.PLANNED_to_SCHEDULED
        distinguishing_aspect: |
          Room conflict uses BUFFERED interval semantics: two sessions conflict if [start, end+turnover_buffer)
          windows overlap on the same day/room. With a 30-min buffer, a session ending at 660 blocks another
          starting at 685 (since 660+30=690 > 685) -> ERR_ROOM_CONFLICT, even though the bare [start,end)
          intervals (600-660 and 685-745) do not touch.
        test_recipe:
          setup:
            - "Room with turnover_buffer_minutes=30; sectionA has a Mon 600-660 session; sectionB will try Mon 685-745 in the same room."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Buf Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio Buf", capacity: 20, turnover_buffer_minutes: 30 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr Buf", email: "buf@x.com", max_weekly_sessions: 30 }
              as: StudioAdmin
              captures: { instA_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ms Buf2", email: "buf2@x.com", max_weekly_sessions: 30 }
              as: StudioAdmin
              captures: { instB_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${instA_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secA_id: $.data.id }
            - call: "POST /sections/${secA_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${instB_id}", discipline: "TAP", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secB_id: $.data.id }
          trigger:
            - call: "POST /sections/${secB_id}/sessions"
              payload: { day_of_week: 0, start_minute: 685, end_minute: 745 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ROOM_CONFLICT"

      - name: instructor_overlap_no_buffer
        grounds:
          - validations[priority=10]
          - entities.ClassSession.fields.start_minute
          - entities.Instructor.fields.max_weekly_sessions
        distinguishing_aspect: |
          Instructor conflict uses UN-buffered [start,end) semantics on a DIFFERENT resource (Instructor, not
          Room): the same instructor's two sessions conflict only on true overlap. A session 600-660 does NOT
          conflict with an adjacent 660-720 (touching at the boundary, half-open) in DIFFERENT rooms, but
          overlapping 650-700 does -> ERR_INSTRUCTOR_CONFLICT. The trigger uses 650-700 to assert the conflict.
        test_recipe:
          setup:
            - "One instructor assigned to two sections in two DIFFERENT rooms; sectionA session Mon 600-660; sectionB tries Mon 650-700 with the same instructor."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Inst Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room 1", capacity: 20, turnover_buffer_minutes: 0 }
              as: StudioAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room 2", capacity: 20, turnover_buffer_minutes: 0 }
              as: StudioAdmin
              captures: { room2_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr Solo", email: "solo@x.com", max_weekly_sessions: 30 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room1_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secA_id: $.data.id }
            - call: "POST /sections/${secA_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room2_id}", instructor_id: "${inst_id}", discipline: "TAP", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secB_id: $.data.id }
          trigger:
            - call: "POST /sections/${secB_id}/sessions"
              payload: { day_of_week: 0, start_minute: 650, end_minute: 700 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INSTRUCTOR_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: costume_order_cancel_conserves_family_money
        grounds:
          - state_machines.CostumeOrder.SUBMITTED_to_CANCELLED
          - calculations.invoice_totals
          - entities.Invoice.fields.fees_cents
          - entities.Family.fields.account_credit_cents
        distinguishing_aspect: |
          Conserved quantity = total money the family owes/holds = Invoice.fees_cents + Family.account_credit_cents.
          Submitting a costume order adds 4500 to fees; cancelling it removes 4500 from the OPEN invoice's fees,
          so fees_cents returns to 0 and account_credit_cents stays 0 — the conserved sum nets to its pre-order value.
        test_recipe:
          setup:
            - "Term OPEN; family student CONFIRMED; costume unit_price 4500, no rush, clock before close."
            - "Costume order SUBMITTED -> family OPEN invoice fees_cents=4500."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Inv Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio Inv", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr Inv", email: "inv@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "BALLET", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 9000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 2, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "finv@x.com", family_name: "Inv" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Kid Inv", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /invoices/generate"
              payload: { family_id: "${fam_id}", term_id: "${term_id}", billing_month: "2026-02" }
              as: StudioAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /sections/${sec_id}/costumes"
              payload: { name: "Tutu", unit_price_cents: 4500, size_window_close_date: "2026-05-01", rush_surcharge_cents: 1500 }
              as: StudioAdmin
              captures: { cost_id: $.data.id }
            - call: "POST /costume-orders"
              payload: { costume_id: "${cost_id}", enrollment_id: "${enr_id}", size_code: "CHILD_M" }
              as: StudioAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /costumes/${cost_id}/submit-order"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /costume-orders/${ord_id}/cancel"
              payload: {}
              as: StudioAdmin
          assert:
            - "CostumeOrder.${ord_id}.status == CANCELLED"
            - "Invoice.${inv_id}.fees_cents == 0"
            - "Family.${fam_id}.account_credit_cents == 0"

      - name: seat_release_conserves_recital_inventory
        grounds:
          - state_machines.SeatAssignment.PURCHASED_to_RELEASED
          - entities.Recital.fields.seats_sold
          - entities.Family.fields.account_credit_cents
          - state_machines.Recital.SOLD_OUT_to_ON_SALE
        distinguishing_aspect: |
          Conserved quantity = recital seat inventory occupancy = seats_sold (a count, different conserved type
          than money). Holding+purchasing a paid seat raises seats_sold to 1 (total=1 -> SOLD_OUT); releasing it
          returns seats_sold to 0 and recital to ON_SALE, AND refunds 2000 to family credit — inventory conserved.
        test_recipe:
          setup:
            - "Term OPEN; recital total_seats=1 ticket_price 2000 free 0; family holds then purchases seat A-1 -> SOLD_OUT; seats_sold=1."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Rel Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio Rel", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr Rel", email: "rel@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 5, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /terms/${term_id}/recitals"
              payload: { name: "Gala", show_datetime: "2026-06-20T19:00:00Z", total_seats: 1, ticket_price_cents: 2000, free_tickets_per_family: 0 }
              as: StudioAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recitals/${rec_id}/open-sales"
              payload: {}
              as: StudioAdmin
              captures: { rec_v1: $.data.version }
            - call: "POST /families"
              payload: { email: "frel@x.com", family_name: "Rel" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /recitals/${rec_id}/seats"
              payload: { family_id: "${fam_id}", seat_label: "A-1", expected_recital_version: "${rec_v1}" }
              as: StudioAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /seats/${seat_id}/purchase"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /seats/${seat_id}/release"
              payload: {}
              as: StudioAdmin
          assert:
            - "SeatAssignment.${seat_id}.status == RELEASED"
            - "Recital.${rec_id}.seats_sold == 0"
            - "Recital.${rec_id}.status == ON_SALE"
            - "Family.${fam_id}.account_credit_cents == 2000"
