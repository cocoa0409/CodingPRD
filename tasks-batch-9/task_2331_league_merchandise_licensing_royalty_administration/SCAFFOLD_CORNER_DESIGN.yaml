              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_j3}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_j3}"
