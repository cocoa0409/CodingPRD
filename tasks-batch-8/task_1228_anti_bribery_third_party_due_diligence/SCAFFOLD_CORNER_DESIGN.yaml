          p_ok_st: $.data[0].payment_status
          p_new_st: $.data[1].payment_status
      - call: GET /compliance/third-parties/${tp_id}/gift-hospitality-entries
        as: ComplianceOfficer
        captures:
          g_st: $.data[0].entry_status
      assert:
      - captured tp_st == TERMINATED and ct_st == TERMINATED
      - captured p_new_st == BLOCKED (SUBMITTED at termination) while p_ok_st == APPROVED (approved payments are not rewritten) and ledger == 40000
      - captured g_st == REJECTED (pending gift refused by the cascade)
- section: consistency_model
  instances:
  - name: mutation_visible_in_same_response
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    - endpoints["POST /compliance/third-parties/{third_party_id}/submit"]
    distinguishing_aspect: 'Immediate consistency: the submit response body itself carries onboarding_status == SCREENING, risk_score_provisional == 16, risk_tier == LOW — no follow-up GET is required to
      observe the mutation.'
    test_recipe:
      setup:
      - Clock 2026-05-01; policy P1 ACTIVE; country CH cpi 80; ThirdParty DRAFT (TECHNOLOGY/NONE)
      setup_api_calls:
      - call: POST /compliance/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: ComplianceAdmin
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      - call: POST /compliance/risk-scoring-policies
        payload:
          w_country: 50
          w_industry: 30
          w_touchpoint: 20
          tier_medium_min: 40
          tier_high_min: 70
          tier_critical_min: 90
          commission_base_cap_pct: 15
          commission_hard_cap_pct: 25
        as: ComplianceAdmin
        captures:
          pol_id: $.data.id
          pol_v: $.data.version
      - call: POST /compliance/risk-scoring-policies/${pol_id}/activate
        payload:
          expected_policy_version: ${pol_v}
        as: ComplianceAdmin
      - call: POST /compliance/third-parties
        payload:
          legal_name: CH Tech GmbH
          country_code: CH
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          tp_id: $.data.id
      trigger:
      - call: POST /compliance/third-parties/${tp_id}/submit
        payload: {}
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          st: $.data.onboarding_status
          prov: $.data.risk_score_provisional
          tier: $.data.risk_tier
      assert:
      - captured st == SCREENING and prov == 16 and tier == LOW in the mutation response envelope itself
