        distinguishing_aspect: "Priority ordering state(6) before business_safety(7): on a DRAFT roster, assignment create for a credential-expired provider surfaces ERR_ROSTER_NOT_PUBLISHED, not ERR_CREDENTIAL_EXPIRED — both violations hold, the lifecycle gate wins."
