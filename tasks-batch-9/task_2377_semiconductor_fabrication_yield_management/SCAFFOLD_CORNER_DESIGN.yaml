              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { page_n: $.meta.total_count }
          trigger:
            - call: "GET /fab/lots?plan_id=${plan_a}&limit=101"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { err: $.data.error_id }
          assert:
            - "${page_n} == 3"
            - "the limit=2&offset=1 page carried exactly 2 items"
            - "HTTP status == 400"
            - "${err} == ERR_VALIDATION"
            - "GET /fab/lots?plan_id=${plan_a}&limit=100 returns meta.total_count == 3 and HTTP status == 200"

      - name: pm_complete_resets_the_ledger_and_opens_the_purge_window
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fab/equipment/{id}/pm-complete]
          - state_machines.Equipment.PM_to_IDLE
          - calculations.equipment_capacity_hours_ledger
        distinguishing_aspect: "One action rewrites four fields at once: the tool leaves PM as IDLE with available_capacity_hours restored to the full 720.00 and hours_since_pm zeroed from 150.0, and it publishes purge_until = clock + purge_buffer_hours = 2026-08-02T00:00:00Z, which is what later blocks track-in."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Tool LITHO-1 created with purge_buffer_hours 24.0 and hours_since_pm 150.0, carrying a QUALIFIED chamber CH_L1, then driven IDLE -> PM by pm-start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
