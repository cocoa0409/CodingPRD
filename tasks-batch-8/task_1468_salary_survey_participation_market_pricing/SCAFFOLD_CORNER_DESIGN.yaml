scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: organization_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Organization.fields.fiscal_year_start_month]
        distinguishing_aspect: "Omitting fiscal_year_start_month applies default value 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
          trigger:
            - { call: "GET /orgs/${org_id}", payload: {}, as: VendorAdmin, captures: { fysm: $.data.fiscal_year_start_month } }
          assert:
            - "Organization.${org_id}.fiscal_year_start_month == 1"

      - name: employee_creation_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Employee.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST employees without required email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Org and job exist"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
          trigger:
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "NoEmail", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: job_current_market_composite_id_initially_null
        claim_type: computed_fields
        grounds: [entities.Job.fields.current_market_composite_id]
        distinguishing_aspect: "Newly created Job has current_market_composite_id == null until first composite publish."
        test_recipe:
          setup: ["Org exists"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id, cmc: $.data.current_market_composite_id } }
          trigger: []
          assert:
            - "Job.${job_id}.current_market_composite_id IS null on creation"

      - name: employee_status_defaults_to_active
        claim_type: defaults
        grounds: [entities.Employee.fields.status]
        distinguishing_aspect: "Newly created Employee starts in status=ACTIVE."
        test_recipe:
          setup: ["Org and job exist"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { emp_id: $.data.id, status: $.data.status } }
          trigger: []
          assert:
            - "Employee.${emp_id}.status == ACTIVE"

      - name: enum_field_rejects_undeclared_value
        claim_type: type_constraints
        grounds: [entities.Job.fields.career_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST jobs with career_level='IC9' (undeclared) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Org exists"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
          trigger:
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC9", title: "Bad", job_family: "ENG", career_level: "IC9", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: audit_event_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.AuditEvent]
        distinguishing_aspect: "AuditEvent has common_fields: false (no version field, no update endpoint); only creation via system side effects."
        test_recipe:
          setup: ["Org exists"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { emp_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "GET /audit_events", payload: {}, as: VendorAdmin, captures: { event_list: $.data } }
          assert:
            - "GET /audit_events returns at least one AuditEvent with action == VENDOR_ACTIVATE"
            - "AuditEvent has no 'version' field in response (common_fields: false)"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: survey_submit_on_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SurveySubmission, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Submit a DRAFT submission (not READY) returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Survey OPEN, submission in DRAFT"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "S", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (DRAFT → SUBMITTED is not a valid transition; must go through READY)"

      - name: terminal_survey_accepted_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Survey]
        distinguishing_aspect: "ACCEPTED is terminal; further close/reject on ACCEPTED survey returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Survey fully ACCEPTED"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "S", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/accept", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "POST /surveys/${survey_id}/reject", payload: { reason: "late" }, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (ACCEPTED is terminal)"

      - name: match_initial_state_is_proposed
        claim_type: initial_state
        grounds: [state_machines.SurveyJobMatch]
        distinguishing_aspect: "Newly created SurveyJobMatch starts in PROPOSED status."
        test_recipe:
          setup: ["Survey OPEN with benchmark; job exists"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B1", benchmark_title: "A", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 8000000, p50_cents: 10000000, p75_cents: 12500000, p90_cents: 15000000, sample_size: 50 }, as: VendorAdmin, captures: { bench_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_id}", benchmark_id: "${bench_id}", match_confidence: "HIGH", match_weight_pct: 100, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_id: $.data.id, status: $.data.status } }
          trigger: []
          assert:
            - "SurveyJobMatch.${match_id}.status == PROPOSED"

      - name: cycle_lock_with_pending_adjustment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.MarketAdjustmentCycle.OPEN_to_LOCKED, "errors[ERR_CYCLE_HAS_PENDING]"]
        distinguishing_aspect: "Cycle lock blocked while any child adjustment is PENDING_APPROVAL."
        test_recipe:
          setup: ["Cycle OPEN with one PENDING_APPROVAL adjustment"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "M", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "S", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "FY26", target_percentile: 50, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { strat_id: $.data.id } }
            - { call: "POST /strategies/${strat_id}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B1", benchmark_title: "A", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 8000000, p50_cents: 10000000, p75_cents: 12500000, p90_cents: 15000000, sample_size: 50 }, as: VendorAdmin, captures: { bench_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/accept", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_id}", benchmark_id: "${bench_id}", match_confidence: "HIGH", match_weight_pct: 100, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_id: $.data.id } }
            - { call: "POST /matches/${match_id}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_id}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /jobs/${job_id}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp_id: $.data.id } }
            - { call: "POST /composites/${comp_id}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { job_v: $.data.version } }
            - { call: "POST /composites/${comp_id}/publish", payload: { expected_job_version: "${job_v}" }, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "C1", effective_date: "2026-09-01", budget_cents: 1000000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { cycle_id: $.data.id } }
            - { call: "POST /cycles/${cycle_id}/adjustments", payload: { employee_id: "${subject_id}", proposed_amount_cents: 100000, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { adj_id: $.data.id } }
            - { call: "POST /adjustments/${adj_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
          trigger:
            - { call: "POST /cycles/${cycle_id}/lock", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_HAS_PENDING"

      - name: survey_close_cascades_draft_submissions_to_returned
        claim_type: cascade_down
        grounds: [state_machines.Survey.OPEN_to_CLOSED, state_machines.SurveySubmission.DRAFT_to_RETURNED]
        distinguishing_aspect: "Closing a survey cascades DRAFT and READY submissions to RETURNED with rejection_reason='SURVEY_CLOSED'."
        test_recipe:
          setup: ["Survey OPEN with one DRAFT submission"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "A", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 100000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "S", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
