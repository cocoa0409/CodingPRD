              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { applied: $.data.applied_price_rule_id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 6000, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-09-30T00:00:00Z", trailing_units: 100 }
