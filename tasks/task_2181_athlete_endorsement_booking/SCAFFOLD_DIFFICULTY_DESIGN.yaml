              as: FinanceManager
            - call: "POST /production-slots"
              payload: { name: "Studio A", capacity: 1, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-12-31T23:00:00Z" }
              as: TalentAgent
              captures: { slot_id: $.data.id }
            - call: "POST /deliverables"
              payload: { engagement_id: "${eng_id}", type: "SOCIAL_POST", due_date: "2026-09-20", disclosure_required: false }
              as: TalentAgent
              captures: { d1: $.data.id }
            - call: "POST /deliverables"
              payload: { engagement_id: "${eng_id}", type: "SOCIAL_POST", due_date: "2026-09-21", disclosure_required: false }
              as: TalentAgent
              captures: { d2: $.data.id }
            - call: "POST /deliverables"
              payload: { engagement_id: "${eng_id}", type: "APPEARANCE", due_date: "2026-09-11", disclosure_required: false, booking_id: "${bk_id}" }
              as: TalentAgent
              captures: { d3: $.data.id }
            - call: "POST /deliverables"
              payload: { engagement_id: "${eng_id}", type: "SHOOT", due_date: "2026-09-16", disclosure_required: false, production_slot_id: "${slot_id}", shoot_start_at: "2026-09-15T09:00:00Z", shoot_end_at: "2026-09-15T13:00:00Z" }
              as: TalentAgent
              captures: { d4: $.data.id }
            - call: "POST /deliverables/${d1}/submit"
              payload: { asset_url: "https://cdn.example/a1.jpg" }
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /deliverables/${d2}/submit"
              payload: { asset_url: "https://cdn.example/a2.jpg" }
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /deliverables/${d3}/submit"
              payload: { asset_url: "https://cdn.example/a3.jpg" }
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /deliverables/${d4}/submit"
              payload: { asset_url: "https://cdn.example/a4.jpg" }
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /deliverables/${d1}/review"
              payload: { decision: "APPROVE" }
              as: BrandRep
              as_user_id: "${brand_id}"
            - call: "POST /deliverables/${d2}/review"
              payload: { decision: "APPROVE" }
              as: BrandRep
              as_user_id: "${brand_id}"
            - call: "POST /deliverables/${d3}/review"
              payload: { decision: "APPROVE" }
              as: BrandRep
              as_user_id: "${brand_id}"
            - call: "POST /deliverables/${d4}/review"
              payload: { decision: "APPROVE" }
              as: BrandRep
              as_user_id: "${brand_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: FinanceManager
              captures: { eng_v2: $.data.version }
          trigger:
            - call: "POST /payout-statements"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: FinanceManager
              as_user_id: "fm-1"
              captures: { ps_id: $.data.id, gross: $.data.gross_amount_cents }
          assert:
            - "PayoutStatement.${ps_id}.line_count == 4"
            - "PayoutStatement.${ps_id}.gross_amount_cents == 3001901"
            - "PayoutStatement.${ps_id}.agency_commission_cents == 450286"
            - "PayoutStatement.${ps_id}.penalty_cents == 0"
            - "PayoutStatement.${ps_id}.athlete_net_cents == 2551615"
            - "Deliverable.${d1}.line_value_cents == 375238 and Deliverable.${d2}.line_value_cents == 375238"
            - "Deliverable.${d3}.line_value_cents == 1500950 and Deliverable.${d4}.line_value_cents == 750475"
            - "PayoutStatement.${ps_id}.gross_amount_cents != Engagement.${eng_id}.binding_fee_cents (3001901 vs 3001900)"
            - "Engagement.${eng_id}.settlement_status == INVOICED"

      - name: renewal_bonus_tier_pinned_before_total_value
        grounds:
          - calculations.performance_bonus_and_renewal
          - entities.RenewalOption.fields.bonus_tier
          - entities.RenewalOption.fields.total_engagement_value_cents
          - entities.RenewalOption.fields.renewal_fee_cents
