            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-10-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "POST /rollouts/opening-plans"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", opening_date: "2026-10-01T00:00:00Z", peak_season: false }
              as: OPERATIONS_LEAD
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPENING_TOO_EARLY (opening 2026-10-01 is only 30 days past the default clock 2026-09-01; needs >= 45)"

      - name: volume_index_locked_after_format_progression
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_STORE_PRECONDITION]
        distinguishing_aspect: "volume_index is editable only while PROPOSED: after select-format succeeds (store still PROPOSED but format set) a volume update still works, but once the store reaches SITE_CONTROL the same PATCH fails with ERR_STORE_PRECONDITION."
        test_recipe:
          setup: ["ACTIVE program; store S PROPOSED with format selected, then agreement EXECUTED (SITE_CONTROL)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
