  - { method: GET, path: "/custody-events", description: "Chain-of-custody log, filterable by order_id (reverse-reachability for CustodyEvent.order_id)", roles: [FieldTechnician, PlantOperator, DestructionWitness, ComplianceOfficer], code: 200,
      input: ["order_id?", "limit?", "offset?"], output: "CustodyEvent[]", side_effects: [] }

