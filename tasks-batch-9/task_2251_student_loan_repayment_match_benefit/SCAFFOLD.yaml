    http_status: 404
    applies_to: "POST /loan-certifications/{certification_id}/lines, POST /loan-accounts/{loan_account_id}/verification, GET /loan-accounts/{loan_account_id}"
  - priority: 8
    category: existence
    check: "certification_id in path, or supersedes_certification_id in body, resolves to a LoanCertification"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /loan-certifications, POST /loan-certifications/{certification_id}/lines, POST /loan-certifications/{certification_id}/submit, POST /loan-certifications/{certification_id}/decision, POST /loan-certifications/{certification_id}/audit-hold, POST /loan-certifications/{certification_id}/audit-release, GET /loan-certifications/{certification_id}, GET /loan-certifications/{certification_id}/lines"
  - priority: 9
    category: existence
    check: "allocation_id in path resolves to a MatchAllocation"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /match-allocations/{allocation_id}/corrections, GET /match-allocations/{allocation_id}"
  - priority: 10
    category: existence
    check: "funding_batch_id in path resolves to a FundingBatch"
    error_id: ERR_FUNDING_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "POST /funding-batches/{funding_batch_id}/transmit, POST /funding-batches/{funding_batch_id}/settlement, GET /funding-batches/{funding_batch_id}"
  - priority: 11
    category: existence
    check: "amendment_id in path resolves to a PlanAmendment"
    error_id: ERR_AMENDMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /plan-amendments/{amendment_id}/status, GET /plan-amendments/{amendment_id}"
  - priority: 12
    category: existence
    check: "test_id in path resolves to a NondiscriminationTest"
    error_id: ERR_TEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /nondiscrimination-tests/{test_id}/compute, POST /nondiscrimination-tests/{test_id}/correction, GET /nondiscrimination-tests/{test_id}"
  - priority: 13
    category: existence
    check: "leave_event_id / certification_line_id / contribution_record_id / correction_id / forfeiture_id in path resolves to the named row"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /leave-events/{leave_event_id}, GET /certification-lines/{certification_line_id}, GET /contribution-records/{contribution_record_id}, GET /correction-adjustments/{correction_id}, GET /forfeiture-records/{forfeiture_id}"
  - priority: 14
    category: auth
    check: "when the acting role is Employee, the target resource's employee_id (or the resource's certification's employee_id) equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /loan-accounts, POST /loan-certifications, POST /loan-certifications/{certification_id}/lines, POST /loan-certifications/{certification_id}/submit, GET /employees/{employee_id}, GET /loan-certifications/{certification_id}, GET /loan-certifications/{certification_id}/lines, GET /loan-accounts/{loan_account_id}, GET /match-allocations/{allocation_id}"
  - priority: 15
    category: state
    check: "expected_employee_version equals the current Employee.version (OCC per concurrency_rules[certification-create-stale-employee])"
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
    applies_to: "POST /loan-certifications"
  - priority: 16
    category: state
    check: "expected_plan_year_version equals the current PlanYear.version of the allocation's plan year (OCC per concurrency_rules[allocation-correction-stale-plan-year])"
    error_id: ERR_STALE_PLAN_YEAR_VERSION
    http_status: 412
    applies_to: "POST /match-allocations/{allocation_id}/corrections"
  - priority: 17
    category: state
    check: "the referenced PlanYear.status == OPEN"
    error_id: ERR_PLAN_YEAR_LOCKED
    http_status: 409
    applies_to: "POST /loan-certifications, POST /loan-certifications/{certification_id}/lines, POST /loan-certifications/{certification_id}/submit, POST /loan-certifications/{certification_id}/decision, POST /contribution-records"
  - priority: 18
    category: state
    check: "LoanCertification.status NOT IN {VOIDED, SUPERSEDED}"
    error_id: ERR_CERTIFICATION_TERMINAL
    http_status: 409
    applies_to: "POST /loan-certifications/{certification_id}/lines, POST /loan-certifications/{certification_id}/submit, POST /loan-certifications/{certification_id}/decision, POST /loan-certifications/{certification_id}/audit-hold, POST /loan-certifications/{certification_id}/audit-release"
  - priority: 19
    category: state
    check: "LoanCertification.status matches the requested transition's from-state (lines require DRAFT or RETURNED; submit requires DRAFT or RETURNED; decision requires SUBMITTED; audit-hold requires ACCEPTED; audit-release requires AUDIT_HOLD); PlanYear OPEN -> LOCKED requires no SUBMITTED/AUDIT_HOLD certification"
    error_id: ERR_CERTIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /loan-certifications/{certification_id}/lines, POST /loan-certifications/{certification_id}/submit, POST /loan-certifications/{certification_id}/decision, POST /loan-certifications/{certification_id}/audit-hold, POST /loan-certifications/{certification_id}/audit-release, POST /plan-years/{plan_year_id}/status"
  - priority: 20
    category: state
    check: "the batch's PayrollPeriod.status == CLOSED"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /funding-batches/{funding_batch_id}/transmit"
  - priority: 21
    category: state
    check: "PayrollPeriod.status == OPEN for contribution-record creation; a FUNDED period may never be reopened"
    error_id: ERR_PERIOD_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /contribution-records, POST /payroll-periods/{payroll_period_id}/status"
  - priority: 22
    category: state
    check: "CLOSED -> OPEN reopen requires no FundingBatch of the period in status IN {TRANSMITTED, SETTLED}"
    error_id: ERR_PERIOD_HAS_SETTLED_FUNDING
    http_status: 409
    applies_to: "POST /payroll-periods/{payroll_period_id}/status"
  - priority: 23
    category: state
    check: "FundingBatch.status matches the requested transition (transmit requires PENDING or REJECTED; settlement requires TRANSMITTED); PlanYear LOCKED -> CLOSED requires no batch in {PENDING, TRANSMITTED}"
    error_id: ERR_BATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /funding-batches/{funding_batch_id}/transmit, POST /funding-batches/{funding_batch_id}/settlement, POST /plan-years/{plan_year_id}/status"
  - priority: 24
    category: state
    check: "PlanAmendment.status matches the requested transition (ADOPTED from DRAFTED; NOTICE_SENT from ADOPTED; EFFECTIVE from NOTICE_SENT; RESCINDED from ADOPTED or NOTICE_SENT)"
    error_id: ERR_AMENDMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /plan-amendments/{amendment_id}/status"
  - priority: 25
    category: state
    check: "compute requires NondiscriminationTest.status IN {PENDING, STALE}; correction requires status == FAILED; PlanYear LOCKED -> OPEN requires no test in status IN {PASSED, CORRECTED}"
    error_id: ERR_TEST_ALREADY_FINAL
    http_status: 409
    applies_to: "POST /nondiscrimination-tests/{test_id}/compute, POST /nondiscrimination-tests/{test_id}/correction, POST /plan-years/{plan_year_id}/status"
  - priority: 26
    category: state
    check: "PlanYear.status == LOCKED for the annual true-up run"
    error_id: ERR_PLAN_YEAR_NOT_LOCKED
    http_status: 409
    applies_to: "POST /plan-years/{plan_year_id}/true-up"
  - priority: 27
    category: state
    check: "PlanYear.true_up_completed == false"
    error_id: ERR_TRUE_UP_ALREADY_RUN
    http_status: 409
    applies_to: "POST /plan-years/{plan_year_id}/true-up"
  - priority: 28
    category: state
    check: "MatchAllocation.funding_status IN {SCHEDULED, FUNDED}"
    error_id: ERR_CORRECTION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /match-allocations/{allocation_id}/corrections"
  - priority: 29
    category: state
    check: "DRAFT -> OPEN requires that no other PlanYear has status == OPEN"
    error_id: ERR_MULTIPLE_OPEN_PLAN_YEARS
    http_status: 409
    applies_to: "POST /plan-years/{plan_year_id}/status"
  - priority: 30
    category: business_safety
    check: "at least one PlanAmendment of the certification's plan year has status == EFFECTIVE (plan document amended and participants notified) before a claim may be accepted"
    error_id: ERR_AMENDMENT_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/decision"
  - priority: 31
    category: business_safety
    check: "an audit release that voids a claim must be performed by a different X-User-ID than LoanCertification.accepted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loan-certifications/{certification_id}/audit-release"
  - priority: 32
    category: business_referential
    check: "every LoanAccount referenced by the certification's lines has status == VERIFIED (checked again at accept time)"
    error_id: ERR_LOAN_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/lines, POST /loan-certifications/{certification_id}/decision"
  - priority: 33
    category: business_referential
    check: "Employee.employment_status != TERMINATED"
    error_id: ERR_EMPLOYEE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /loan-certifications, POST /loan-certifications/{certification_id}/submit"
  - priority: 34
    category: business_temporal
    check: "PlanYear.certification_window_open <= current logical clock <= PlanYear.certification_deadline"
    error_id: ERR_CERTIFICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/submit"
  - priority: 35
    category: business_temporal
    check: "CertificationLine.payment_date falls inside [PlanYear.period_start, PlanYear.period_end]"
    error_id: ERR_PAYMENT_DATE_OUTSIDE_PLAN_YEAR
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/lines"
  - priority: 36
    category: business_temporal
    check: "CertificationLine.payment_date <= current logical clock"
    error_id: ERR_PAYMENT_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/lines"
  - priority: 37
    category: business_temporal
    check: "NOTICE_SENT -> EFFECTIVE requires current logical clock >= PlanAmendment.effective_date"
    error_id: ERR_AMENDMENT_EFFECTIVE_DATE_FUTURE
    http_status: 422
    applies_to: "POST /plan-amendments/{amendment_id}/status"
  - priority: 38
    category: business_constraint
    check: "the new line's half-open [covered_period_start, covered_period_end) window must not intersect any existing line on the SAME loan_account_id belonging to a certification with status IN {DRAFT, SUBMITTED, ACCEPTED, AUDIT_HOLD}; touching endpoints (prev.end == next.start) do NOT intersect"
    error_id: ERR_COVERED_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /loan-certifications/{certification_id}/lines"
  - priority: 39
    category: business_constraint
    check: "no other LoanCertification of the same employee and plan year has status IN {DRAFT, SUBMITTED}; a supersede claim requires supersedes_certification_id to name an ACCEPTED certification of the same employee and plan year"
    error_id: ERR_DUPLICATE_OPEN_CERTIFICATION
    http_status: 409
    applies_to: "POST /loan-certifications"
  - priority: 40
    category: business_constraint
    check: "no existing ContributionRecord has the same (employee_id, payroll_period_id)"
    error_id: ERR_DUPLICATE_CONTRIBUTION_RECORD
    http_status: 409
    applies_to: "POST /contribution-records"
  - priority: 41
    category: business_constraint
    check: "period_number is unique inside the plan year; a plan year may hold at most one PENDING FundingBatch per payroll period"
    error_id: ERR_DUPLICATE_PERIOD_RESOURCE
    http_status: 409
    applies_to: "POST /payroll-periods, POST /funding-batches"
  - priority: 42
    category: business_constraint
    check: "the new leave interval, inflated by PlanYear.leave_merge_buffer_days on both sides, must not collide with any existing LeaveEvent of the same employee: reject when new.start_date <= existing.end_date + buffer AND new.end_date >= existing.start_date - buffer"
    error_id: ERR_LEAVE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /leave-events"
  - priority: 43
    category: business_constraint
    check: "merged unpaid-leave day count inside the plan year after adding this event must be <= PlanYear.unpaid_leave_day_cap"
    error_id: ERR_LEAVE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /leave-events"
  - priority: 44
    category: business_constraint
    check: "the certification has at least one CertificationLine"
    error_id: ERR_NO_CERTIFIED_LINES
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/submit"
  - priority: 45
    category: business_constraint
    check: "the plan year has at least one non-highly-compensated participant with positive counted compensation"
    error_id: ERR_NO_NHCE_POPULATION
    http_status: 422
    applies_to: "POST /nondiscrimination-tests/{test_id}/compute"
  - priority: 46
    category: business_fiscal
    check: "the batch carries at least one non-REVERSED allocation"
    error_id: ERR_BATCH_EMPTY
    http_status: 422
    applies_to: "POST /funding-batches/{funding_batch_id}/transmit"
  - priority: 47
    category: business_fiscal
    check: "max(PlanYear.annual_deferral_limit_cents - Employee.ytd_deferral_cents - sum(certified_total_cents of the employee's OTHER certifications in this plan year with status IN {SUBMITTED, ACCEPTED, AUDIT_HOLD}), 0) > 0"
    error_id: ERR_QSLP_SPACE_EXHAUSTED
    http_status: 422
    applies_to: "POST /loan-certifications/{certification_id}/submit"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/plan-years"
    description: "Create a plan year in DRAFT with its match formula, limits and certification window"
    roles: [BenefitsAdministrator]
    code: 201
    input: [year, period_start, period_end, certification_window_open, certification_deadline, "compensation_cap_cents?", "annual_deferral_limit_cents?", "hce_prior_comp_threshold_cents?", "tier1_pct?", "tier1_match_rate?", "tier2_pct?", "tier2_match_rate?", "nondiscrimination_test_method?", "prior_year_nhce_acp?", "unpaid_leave_day_cap?", "leave_merge_buffer_days?"]
    output: PlanYear
    side_effects: ["creates PlanYear with status=DRAFT, version=1 and all derived totals at 0"]
  - method: GET
    path: "/plan-years/{plan_year_id}"
    description: "Read one plan year with its derived funded totals and forfeiture balance"
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor, Recordkeeper]
    code: 200
    input: []
    output: PlanYear
    side_effects: []
  - method: GET
    path: "/plan-years"
    description: "List plan years"
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor, Recordkeeper]
    code: 200
    input: ["status?", "year?", "limit?", "offset?"]
    output: PlanYear[]
    side_effects: []
  - method: POST
    path: "/plan-years/{plan_year_id}/status"
    description: "Advance the plan year through DRAFT -> OPEN -> LOCKED -> CLOSED, or reopen LOCKED -> OPEN"
    roles: [BenefitsAdministrator]
    code: 200
    input: [to_status]
    output: PlanYear
    side_effects: ["state machine PlanYear transitions", "recomputes Employee.hce_flag and remaining_qslp_space_cents on DRAFT -> OPEN", "increments PlanYear.version by 1"]
  - method: POST
    path: "/plan-years/{plan_year_id}/true-up"
    description: "Run the ANNUAL_TRUE_UP variant for one employee (employee_id given) or for every participant (omitted), creating TRUE_UP allocations and TRUE_UP_RECOUPMENT adjustments"
    roles: [BenefitsAdministrator]
    code: 200
    input: ["employee_id?"]
    output: { true_up_allocation_count: integer, recoupment_count: integer, total_true_up_cents: integer, total_recoupment_cents: integer, employee_count: integer }
    side_effects: ["calculations.qslp_annual_true_up per employee", "creates MatchAllocation rows with allocation_type=TRUE_UP attached to the highest-period PENDING FundingBatch", "creates CorrectionAdjustment rows with reason_code=TRUE_UP_RECOUPMENT", "sets PlanYear.true_up_completed=true", "recomputes PlanYear.total_qslp_match_funded_cents", "moves PASSED/FAILED NondiscriminationTest rows of the plan year to STALE", "increments PlanYear.version by 1", "increments Employee.version by 1 per processed employee"]
  - method: POST
    path: "/plan-amendments"
    description: "Record a drafted plan-document amendment authorizing the QSLP match"
    roles: [BenefitsAdministrator]
    code: 201
    input: [plan_year_id, document_ref, effective_date]
    output: PlanAmendment
    side_effects: ["creates PlanAmendment with status=DRAFTED"]
  - method: GET
    path: "/plan-amendments/{amendment_id}"
    description: "Read one amendment with its adoption and notice timestamps"
    roles: [BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: PlanAmendment
    side_effects: []
  - method: GET
    path: "/plan-amendments"
    description: "List amendments, optionally filtered by plan year or status"
    roles: [BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["plan_year_id?", "status?", "limit?", "offset?"]
    output: PlanAmendment[]
    side_effects: []
  - method: POST
    path: "/plan-amendments/{amendment_id}/status"
    description: "Adopt, record participant notice, declare effective, or rescind an amendment"
    roles: [BenefitsAdministrator]
    code: 200
    input: [to_status, "notice_channel?", "rescinded_reason?"]
    output: PlanAmendment
    side_effects: ["state machine PlanAmendment transitions", "stamps adopted_at / notice_sent_at / effective_at from the logical clock", "increments PlanAmendment.version by 1"]
  - method: POST
    path: "/employees"
    description: "Enroll an employee in the plan"
    roles: [BenefitsAdministrator]
    code: 201
    input: [external_id, hire_date, prior_year_compensation_cents, "vesting_service_months?"]
    output: Employee
    side_effects: ["creates Employee with employment_status=ACTIVE", "computes hce_flag via calculations.hce_determination", "computes vested_pct via calculations.vesting_and_forfeiture schedule"]
  - method: GET
    path: "/employees/{employee_id}"
    description: "Read one employee with HCE flag, YTD payroll aggregates, remaining statutory QSLP space and vested percentage"
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees"
    description: "List employees"
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor]
    code: 200
    input: ["employment_status?", "hce_flag?", "external_id?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: POST
    path: "/employees/{employee_id}/employment-events"
    description: "Record a mid-year employment change (TERMINATE or REHIRE)"
    roles: [BenefitsAdministrator]
    code: 200
    input: [event_type, effective_date]
    output: Employee
    side_effects: ["state machine Employee transitions", "TERMINATE runs calculations.vesting_and_forfeiture, creates ForfeitureRecord rows, recomputes PlanYear.forfeiture_balance_cents and every PENDING FundingBatch offset via calculations.forfeiture_offset_waterfall", "increments Employee.version by 1"]
  - method: GET
    path: "/employees/{employee_id}/audit-packet"
    description: "Computed read: audit documentation summary of one employee's certifications, matches, forfeitures and corrections for the current plan year"
    roles: [ComplianceAuditor, BenefitsAdministrator]
    code: 200
    input: []
    output: { plan_year_id: string, certification_count: integer, accepted_certified_cents: integer, deferral_match_cents: integer, qslp_match_cents: integer, forfeited_cents: integer, correction_cents: integer, remaining_space_cents: integer }
    side_effects: []
  - method: POST
    path: "/leave-events"
    description: "Record a leave interval for an employee"
    roles: [BenefitsAdministrator, PayrollOperator]
    code: 201
    input: [employee_id, leave_type, start_date, end_date]
    output: LeaveEvent
    side_effects: ["creates LeaveEvent with computed day_count", "recomputes Employee.unpaid_leave_days_ytd", "sets Employee.employment_status=LEAVE_UNPAID when the interval contains the logical clock and leave_type=UNPAID", "increments Employee.version by 1"]
  - method: GET
    path: "/leave-events/{leave_event_id}"
    description: "Read one leave event"
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor]
    code: 200
    input: []
    output: LeaveEvent
    side_effects: []
  - method: GET
    path: "/leave-events"
    description: "List leave events, optionally filtered by employee"
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "leave_type?", "limit?", "offset?"]
    output: LeaveEvent[]
    side_effects: []
  - method: POST
    path: "/payroll-periods"
    description: "Create a payroll period inside a plan year"
    roles: [PayrollOperator]
    code: 201
    input: [plan_year_id, period_number, start_date, end_date, pay_date]
    output: PayrollPeriod
    side_effects: ["creates PayrollPeriod with status=OPEN"]
  - method: GET
    path: "/payroll-periods/{payroll_period_id}"
    description: "Read one payroll period with its compensation and match totals"
    roles: [PayrollOperator, BenefitsAdministrator, ComplianceAuditor, Recordkeeper]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: []
  - method: GET
    path: "/payroll-periods"
    description: "List payroll periods"
    roles: [PayrollOperator, BenefitsAdministrator, ComplianceAuditor, Recordkeeper]
    code: 200
    input: ["plan_year_id?", "status?", "limit?", "offset?"]
    output: PayrollPeriod[]
    side_effects: []
  - method: POST
    path: "/payroll-periods/{payroll_period_id}/status"
    description: "Close a payroll period or reopen it for late payroll corrections"
    roles: [PayrollOperator]
    code: 200
    input: [to_status]
    output: PayrollPeriod
    side_effects: ["state machine PayrollPeriod transitions", "increments reopen_count on CLOSED -> OPEN", "increments PayrollPeriod.version by 1"]
  - method: POST
    path: "/contribution-records"
    description: "Post one employee's payroll line for a period; computes the elective-deferral match and the leftover QSLP tier space"
    roles: [PayrollOperator]
    code: 201
    input: [employee_id, payroll_period_id, eligible_compensation_cents, elective_deferral_cents]
    output: ContributionRecord
    side_effects: ["calculations.deferral_match_per_period", "recomputes PayrollPeriod and PlanYear derived totals", "recomputes Employee YTD aggregates and remaining_qslp_space_cents", "moves Employee REHIRED -> ACTIVE when the period starts on or after rehire_date", "increments Employee.version by 1", "increments PlanYear.version by 1"]
  - method: GET
    path: "/contribution-records/{contribution_record_id}"
    description: "Read one payroll line with its computed match and QSLP space"
    roles: [PayrollOperator, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: ContributionRecord
    side_effects: []
  - method: GET
    path: "/contribution-records"
    description: "List payroll lines, optionally filtered by employee and/or period"
    roles: [PayrollOperator, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "payroll_period_id?", "limit?", "offset?"]
    output: ContributionRecord[]
    side_effects: []
  - method: POST
    path: "/loan-accounts"
    description: "Register a student-loan account for an employee"
    roles: [Employee, BenefitsAdministrator]
    code: 201
    input: [employee_id, servicer_name, account_last4, original_principal_cents]
    output: LoanAccount
    side_effects: ["creates LoanAccount with status=UNVERIFIED"]
  - method: GET
    path: "/loan-accounts/{loan_account_id}"
    description: "Read one loan account"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: LoanAccount
    side_effects: []
  - method: GET
    path: "/loan-accounts"
    description: "List loan accounts, optionally filtered by employee"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "status?", "limit?", "offset?"]
    output: LoanAccount[]
    side_effects: []
  - method: POST
    path: "/loan-accounts/{loan_account_id}/verification"
    description: "Verify or disqualify a loan account as qualified education debt of the employee"
    roles: [BenefitsAdministrator]
    code: 200
    input: [to_status, "evidence_ref?"]
    output: LoanAccount
    side_effects: ["sets LoanAccount.status and evidence_ref", "increments LoanAccount.version by 1"]
  - method: POST
    path: "/loan-certifications"
    description: "Open an annual claim in DRAFT; optionally supersede a previously ACCEPTED claim. Requires the employee version last observed by the client (OCC)."
    roles: [Employee]
    code: 201
    input: [employee_id, plan_year_id, certification_method, expected_employee_version, "supersedes_certification_id?"]
    output: LoanCertification
    side_effects: ["creates LoanCertification with status=DRAFT", "increments Employee.version by 1"]
  - method: GET
    path: "/loan-certifications/{certification_id}"
    description: "Read one annual claim with its certified, eligible, matched and unmatched totals"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: LoanCertification
    side_effects: []
  - method: GET
    path: "/loan-certifications"
    description: "List annual claims, optionally filtered by employee, plan year, status, or the claim they supersede"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "plan_year_id?", "status?", "supersedes_certification_id?", "limit?", "offset?"]
    output: LoanCertification[]
    side_effects: []
  - method: POST
    path: "/loan-certifications/{certification_id}/lines"
    description: "Add a certified qualified payment line to a DRAFT or RETURNED claim"
    roles: [Employee]
    code: 201
    input: [loan_account_id, payment_date, amount_cents, covered_period_start, covered_period_end]
    output: CertificationLine
    side_effects: ["creates CertificationLine", "recomputes LoanCertification.certified_total_cents", "increments LoanCertification.version by 1"]
  - method: GET
    path: "/loan-certifications/{certification_id}/lines"
    description: "List the payment lines of one claim (reverse reachability for CertificationLine.certification_id)"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificationLine[]
    side_effects: []
  - method: GET
    path: "/certification-lines/{certification_line_id}"
    description: "Read one certified payment line"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: CertificationLine
    side_effects: []
  - method: GET
    path: "/certification-lines"
    description: "List certified payment lines, optionally filtered by claim or loan account"
    roles: [Employee, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["certification_id?", "loan_account_id?", "limit?", "offset?"]
    output: CertificationLine[]
    side_effects: []
  - method: POST
    path: "/loan-certifications/{certification_id}/submit"
    description: "Submit (or resubmit after a return) the annual claim for sponsor review"
    roles: [Employee]
    code: 200
    input: []
    output: LoanCertification
    side_effects: ["state machine LoanCertification DRAFT/RETURNED -> SUBMITTED", "reserves statutory space: Employee.remaining_qslp_space_cents drops by certified_total_cents", "increments Employee.version by 1", "increments LoanCertification.version by 1"]
  - method: POST
    path: "/loan-certifications/{certification_id}/decision"
    description: "Accept or return a submitted claim; ACCEPT computes the PAY_PERIOD_MIRROR match and schedules it for funding"
    roles: [BenefitsAdministrator]
    code: 200
    input: [decision, "reason?"]
    output: LoanCertification
    side_effects: ["state machine LoanCertification SUBMITTED -> ACCEPTED or -> RETURNED", "ACCEPT: calculations.qslp_eligible_amount then calculations.qslp_mirror_allocation create MIRROR MatchAllocation rows", "ACCEPT: allocations attach to the PENDING FundingBatch of their period (funding_status=SCHEDULED) and batch totals recompute", "ACCEPT: PlanYear.total_qslp_match_funded_cents and accepted_certification_count recompute", "ACCEPT: PASSED/FAILED NondiscriminationTest rows of the plan year move to STALE", "ACCEPT with supersedes_certification_id: the superseded claim moves to SUPERSEDED and its allocations are REVERSED with ERRONEOUS_MATCH adjustments", "increments Employee.version by 1", "increments PlanYear.version by 1", "increments LoanCertification.version by 1"]
  - method: POST
    path: "/loan-certifications/{certification_id}/audit-hold"
    description: "Place an accepted claim on audit hold for documentation review"
    roles: [ComplianceAuditor]
    code: 200
    input: [reason]
    output: LoanCertification
    side_effects: ["state machine LoanCertification ACCEPTED -> AUDIT_HOLD", "stores audit_hold_reason", "increments LoanCertification.version by 1"]
  - method: POST
    path: "/loan-certifications/{certification_id}/audit-release"
    description: "Release an audit hold by clearing the claim or voiding it with full compensating reversal"
    roles: [ComplianceAuditor]
    code: 200
    input: [resolution, "note?"]
    output: LoanCertification
    side_effects: ["CLEAR: AUDIT_HOLD -> ACCEPTED", "VOID: AUDIT_HOLD -> VOIDED, allocations REVERSED, one CERTIFICATION_VOID CorrectionAdjustment per reversed allocation, FundingBatch and PlanYear totals restored to their pre-ACCEPT values, Employee.remaining_qslp_space_cents restored", "increments Employee.version by 1", "increments PlanYear.version by 1", "increments LoanCertification.version by 1"]
  - method: GET
    path: "/match-allocations/{allocation_id}"
    description: "Read one QSLP match allocation with both of its independent state dimensions"
    roles: [BenefitsAdministrator, Recordkeeper, ComplianceAuditor, Employee]
    code: 200
    input: []
    output: MatchAllocation
    side_effects: []
  - method: GET
    path: "/match-allocations"
    description: "List QSLP match allocations by employee, plan year, claim, period, batch or either state dimension (reverse reachability for all MatchAllocation FKs)"
    roles: [BenefitsAdministrator, Recordkeeper, ComplianceAuditor, Employee]
    code: 200
    input: ["employee_id?", "plan_year_id?", "certification_id?", "payroll_period_id?", "funding_batch_id?", "allocation_type?", "funding_status?", "vesting_status?", "limit?", "offset?"]
    output: MatchAllocation[]
    side_effects: []
  - method: POST
    path: "/match-allocations/{allocation_id}/corrections"
    description: "Correct an erroneous match: reverse the allocation and record the signed audit adjustment. Requires the plan-year version last observed by the client (OCC)."
    roles: [BenefitsAdministrator]
    code: 201
    input: [reason_code, expected_plan_year_version, "note?"]
    output: CorrectionAdjustment
    side_effects: ["MatchAllocation funding_status -> REVERSED", "creates CorrectionAdjustment with amount_cents = -allocation.amount_cents", "recomputes FundingBatch totals and PlanYear.total_qslp_match_funded_cents", "moves PASSED/FAILED NondiscriminationTest rows of the plan year to STALE", "increments PlanYear.version by 1", "increments Employee.version by 1"]
  - method: GET
    path: "/correction-adjustments/{correction_id}"
    description: "Read one correction adjustment"
    roles: [BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: CorrectionAdjustment
    side_effects: []
  - method: GET
    path: "/correction-adjustments"
    description: "List correction adjustments by allocation, employee, plan year, test or reason (reverse reachability for all CorrectionAdjustment FKs)"
    roles: [BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["match_allocation_id?", "employee_id?", "plan_year_id?", "nondiscrimination_test_id?", "reason_code?", "limit?", "offset?"]
    output: CorrectionAdjustment[]
    side_effects: []
  - method: POST
    path: "/funding-batches"
    description: "Open a PENDING funding batch for one payroll period so match allocations can be scheduled into it"
    roles: [PayrollOperator]
    code: 201
    input: [plan_year_id, payroll_period_id]
    output: FundingBatch
    side_effects: ["creates FundingBatch with status=PENDING", "runs calculations.forfeiture_offset_waterfall"]
  - method: GET
    path: "/funding-batches/{funding_batch_id}"
    description: "Read one funding batch with allocated, offset and net funding amounts"
    roles: [PayrollOperator, Recordkeeper, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: FundingBatch
    side_effects: []
  - method: GET
    path: "/funding-batches"
    description: "List funding batches by plan year, period or status (reverse reachability for FundingBatch FKs)"
    roles: [PayrollOperator, Recordkeeper, BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["plan_year_id?", "payroll_period_id?", "status?", "limit?", "offset?"]
    output: FundingBatch[]
    side_effects: []
  - method: POST
    path: "/funding-batches/{funding_batch_id}/transmit"
    description: "Transmit the batch to the recordkeeper; a REJECTED batch re-enters PENDING and is transmitted again in the same request"
    roles: [PayrollOperator]
    code: 200
    input: []
    output: FundingBatch
    side_effects: ["state machine FundingBatch PENDING -> TRANSMITTED (or REJECTED -> PENDING -> TRANSMITTED with retransmit_count + 1)", "freezes forfeiture_offset_cents", "increments FundingBatch.version by 1"]
  - method: POST
    path: "/funding-batches/{funding_batch_id}/settlement"
    description: "Recordkeeper settlement response: SETTLED funds every scheduled allocation, REJECTED returns the batch for retransmission"
    roles: [Recordkeeper]
    code: 200
    input: [outcome, "rejection_code?"]
    output: FundingBatch
    side_effects: ["SETTLED: allocations funding_status SCHEDULED -> FUNDED, PayrollPeriod CLOSED -> FUNDED", "REJECTED: stores rejection_code, allocations stay SCHEDULED", "increments FundingBatch.version by 1"]
  - method: GET
    path: "/forfeiture-records/{forfeiture_id}"
    description: "Read one forfeiture record"
    roles: [BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: ForfeitureRecord
    side_effects: []
  - method: GET
    path: "/forfeiture-records"
    description: "List forfeiture records by employee, plan year or allocation (reverse reachability for ForfeitureRecord FKs)"
    roles: [BenefitsAdministrator, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "plan_year_id?", "match_allocation_id?", "limit?", "offset?"]
    output: ForfeitureRecord[]
    side_effects: []
  - method: POST
    path: "/nondiscrimination-tests"
    description: "Open an ACP nondiscrimination test for a plan year under a chosen testing method"
    roles: [ComplianceAuditor]
    code: 201
    input: [plan_year_id, test_method]
    output: NondiscriminationTest
    side_effects: ["creates NondiscriminationTest with status=PENDING"]
  - method: GET
    path: "/nondiscrimination-tests/{test_id}"
    description: "Read one test with its computed ratios and limit"
    roles: [ComplianceAuditor, BenefitsAdministrator]
    code: 200
    input: []
    output: NondiscriminationTest
    side_effects: []
  - method: GET
    path: "/nondiscrimination-tests"
    description: "List tests by plan year or status (reverse reachability for NondiscriminationTest.plan_year_id)"
    roles: [ComplianceAuditor, BenefitsAdministrator]
    code: 200
    input: ["plan_year_id?", "status?", "limit?", "offset?"]
    output: NondiscriminationTest[]
    side_effects: []
  - method: POST
    path: "/nondiscrimination-tests/{test_id}/compute"
    description: "Compute the ACP test; the QSLP match contribution is included in each participant ratio unless explicitly excluded"
    roles: [ComplianceAuditor]
    code: 200
    input: ["include_qslp_match?"]
    output: NondiscriminationTest
    side_effects: ["calculations.acp_test", "state machine PENDING/STALE -> PASSED or FAILED", "stores hce_acp, nhce_acp, limit_acp, hce_count, nhce_count, computed_at", "increments NondiscriminationTest.version by 1"]
  - method: POST
    path: "/nondiscrimination-tests/{test_id}/correction"
    description: "Correct a FAILED ACP test, creating per-HCE corrective adjustments"
    roles: [ComplianceAuditor]
    code: 200
    input: [correction_method]
    output: NondiscriminationTest
    side_effects: ["calculations.acp_corrective_forfeiture creates ACP_CORRECTIVE_FORFEITURE CorrectionAdjustment rows", "recomputes PlanYear.total_deferral_match_funded_cents", "state machine FAILED -> CORRECTED", "increments NondiscriminationTest.version by 1", "increments PlanYear.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [BenefitsAdministrator, PayrollOperator, ComplianceAuditor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sets the logical clock used by every temporal validation, timestamp stamp and leave-window evaluation"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Employee role acts on a resource whose employee_id differs from X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, invalid enum member, non-positive amount, 4-digit rule violated, covered_period_end <= covered_period_start, or a transition-specific field (notice_channel, rescinded_reason, rejection_code) omitted"
  - id: ERR_PLAN_YEAR_NOT_FOUND
    http: 404
    condition: "plan_year_id does not resolve"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee_id does not resolve"
  - id: ERR_PAYROLL_PERIOD_NOT_FOUND
    http: 404
    condition: "payroll_period_id does not resolve"
  - id: ERR_LOAN_ACCOUNT_NOT_FOUND
    http: 404
    condition: "loan_account_id does not resolve"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification_id or supersedes_certification_id does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocation_id does not resolve"
  - id: ERR_FUNDING_BATCH_NOT_FOUND
    http: 404
    condition: "funding_batch_id does not resolve"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "amendment_id does not resolve"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "test_id does not resolve"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "leave_event_id, certification_line_id, contribution_record_id, correction_id or forfeiture_id does not resolve"
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "expected_employee_version does not equal the current Employee.version on claim creation"
  - id: ERR_STALE_PLAN_YEAR_VERSION
    http: 412
    condition: "expected_plan_year_version does not equal the current PlanYear.version on allocation correction"
  - id: ERR_PLAN_YEAR_LOCKED
    http: 409
    condition: "the plan year is not OPEN but the operation requires an open plan year"
  - id: ERR_CERTIFICATION_TERMINAL
    http: 409
    condition: "the claim is VOIDED or SUPERSEDED and admits no further operation"
  - id: ERR_CERTIFICATION_STATE_INVALID
    http: 409
    condition: "the claim is not in the from-state the requested operation requires, or a plan year lock is blocked by a SUBMITTED/AUDIT_HOLD claim"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "transmit attempted while the batch's payroll period is still OPEN"
  - id: ERR_PERIOD_ALREADY_FUNDED
    http: 409
    condition: "payroll line posted to a non-OPEN period, or a FUNDED period reopen attempted"
  - id: ERR_PERIOD_HAS_SETTLED_FUNDING
    http: 409
    condition: "CLOSED -> OPEN reopen attempted while a batch of the period is TRANSMITTED or SETTLED"
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "transmit from a non-PENDING/non-REJECTED batch, settlement from a non-TRANSMITTED batch, or plan-year close blocked by a PENDING/TRANSMITTED batch"
  - id: ERR_AMENDMENT_STATE_INVALID
    http: 409
    condition: "amendment status transition does not match the declared from-state"
  - id: ERR_TEST_ALREADY_FINAL
    http: 409
    condition: "compute on a PASSED/FAILED/CORRECTED test, correction on a non-FAILED test, or plan-year reopen blocked by a PASSED/CORRECTED test"
  - id: ERR_PLAN_YEAR_NOT_LOCKED
    http: 409
    condition: "annual true-up requested while the plan year is not LOCKED"
  - id: ERR_TRUE_UP_ALREADY_RUN
    http: 409
    condition: "annual true-up requested when PlanYear.true_up_completed is already true"
  - id: ERR_CORRECTION_NOT_ALLOWED
    http: 409
    condition: "correction requested on an allocation whose funding_status is UNFUNDED or already REVERSED"
  - id: ERR_MULTIPLE_OPEN_PLAN_YEARS
    http: 409
    condition: "DRAFT -> OPEN attempted while another plan year is already OPEN"
  - id: ERR_AMENDMENT_NOT_EFFECTIVE
    http: 422
    condition: "claim acceptance attempted with no EFFECTIVE plan amendment for the plan year"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "audit release with resolution=VOID performed by the same X-User-ID that accepted the claim"
  - id: ERR_LOAN_NOT_VERIFIED
    http: 422
    condition: "a certified line references a LoanAccount whose status is not VERIFIED"
  - id: ERR_EMPLOYEE_NOT_ELIGIBLE
    http: 422
    condition: "claim creation or submission attempted while the employee is TERMINATED"
  - id: ERR_CERTIFICATION_WINDOW_CLOSED
    http: 422
    condition: "submission attempted with the logical clock outside the plan year's certification window"
  - id: ERR_PAYMENT_DATE_OUTSIDE_PLAN_YEAR
    http: 422
    condition: "certified payment_date falls outside the plan year's period_start..period_end window"
  - id: ERR_PAYMENT_DATE_IN_FUTURE
    http: 422
    condition: "certified payment_date is after the current logical clock"
  - id: ERR_AMENDMENT_EFFECTIVE_DATE_FUTURE
    http: 422
    condition: "EFFECTIVE declared before the amendment's effective_date"
  - id: ERR_COVERED_PERIOD_OVERLAP
    http: 409
    condition: "the new line's half-open covered window intersects another line's window on the same loan account within a non-discarded claim"
  - id: ERR_DUPLICATE_OPEN_CERTIFICATION
    http: 409
    condition: "a DRAFT or SUBMITTED claim already exists for the employee and plan year, or supersedes_certification_id does not name an ACCEPTED claim of the same employee and plan year"
  - id: ERR_DUPLICATE_CONTRIBUTION_RECORD
    http: 409
    condition: "a payroll line already exists for the same employee and payroll period"
  - id: ERR_DUPLICATE_PERIOD_RESOURCE
    http: 409
    condition: "period_number already used inside the plan year, or a PENDING batch already exists for the payroll period"
  - id: ERR_LEAVE_WINDOW_CONFLICT
    http: 409
    condition: "the new leave interval collides with an existing leave interval of the same employee once both are inflated by the plan year's buffer days"
  - id: ERR_LEAVE_CAP_EXCEEDED
    http: 422
    condition: "merged unpaid-leave days inside the plan year would exceed the plan year's unpaid_leave_day_cap"
  - id: ERR_NO_CERTIFIED_LINES
    http: 422
    condition: "submission attempted on a claim with zero certified payment lines"
  - id: ERR_NO_NHCE_POPULATION
    http: 422
    condition: "ACP compute attempted with zero non-highly-compensated participants holding positive counted compensation"
  - id: ERR_BATCH_EMPTY
    http: 422
    condition: "transmit attempted on a batch carrying zero non-REVERSED allocations"
  - id: ERR_QSLP_SPACE_EXHAUSTED
    http: 422
    condition: "submission attempted when the employee's remaining statutory QSLP space (excluding this claim) is zero"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: BenefitsAdministrator
    description: "Plan sponsor benefits staff: configures plan years and amendments, enrolls employees, verifies loans, decides claims, runs the annual true-up and records match corrections"
    identity: opaque
    exclusive_operations:
      - "POST /plan-years"
      - "POST /plan-years/{plan_year_id}/status"
      - "POST /plan-years/{plan_year_id}/true-up"
      - "POST /plan-amendments"
      - "POST /plan-amendments/{amendment_id}/status"
      - "POST /employees"
      - "POST /employees/{employee_id}/employment-events"
      - "POST /loan-accounts/{loan_account_id}/verification"
      - "POST /loan-certifications/{certification_id}/decision"
      - "POST /match-allocations/{allocation_id}/corrections"
    shared_operations:
      - "POST /loan-accounts (also Employee)"
      - "POST /leave-events (also PayrollOperator)"
      - "POST /_clock/set_current_utc (also PayrollOperator, ComplianceAuditor)"
      - "all GET reads except GET /leave-events/{leave_event_id} restrictions (no ownership scoping applies to this role)"
  - name: Employee
    description: "Plan participant who registers loan accounts and files the annual certification of qualified student loan payments"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /loan-certifications"
      - "POST /loan-certifications/{certification_id}/lines"
      - "POST /loan-certifications/{certification_id}/submit"
    shared_operations:
      - "POST /loan-accounts (also BenefitsAdministrator)"
      - "GET /employees/{employee_id}, GET /loan-accounts, GET /loan-accounts/{loan_account_id}, GET /loan-certifications, GET /loan-certifications/{certification_id}, GET /loan-certifications/{certification_id}/lines, GET /certification-lines, GET /certification-lines/{certification_line_id}, GET /match-allocations, GET /match-allocations/{allocation_id} — always scoped to own employee_id (validations[priority=14])"
  - name: PayrollOperator
    description: "Payroll data-exchange operator: maintains payroll periods, posts compensation and deferral lines, opens and transmits funding batches"
    identity: opaque
    exclusive_operations:
      - "POST /payroll-periods"
      - "POST /payroll-periods/{payroll_period_id}/status"
      - "POST /contribution-records"
      - "POST /funding-batches"
      - "POST /funding-batches/{funding_batch_id}/transmit"
    shared_operations:
      - "POST /leave-events (also BenefitsAdministrator)"
      - "POST /_clock/set_current_utc (also BenefitsAdministrator, ComplianceAuditor)"
      - "GET reads of plan years, employees, payroll periods, contribution records, leave events, funding batches"
  - name: Recordkeeper
    description: "External retirement plan recordkeeper that settles or rejects transmitted funding batches"
    identity: opaque
    exclusive_operations:
      - "POST /funding-batches/{funding_batch_id}/settlement"
    shared_operations:
      - "GET /plan-years, GET /plan-years/{plan_year_id}, GET /payroll-periods, GET /payroll-periods/{payroll_period_id}, GET /funding-batches, GET /funding-batches/{funding_batch_id}, GET /match-allocations, GET /match-allocations/{allocation_id}"
  - name: ComplianceAuditor
    description: "Independent compliance reviewer: audits certification documentation, voids improper claims (never the ones it accepted), and runs ACP nondiscrimination testing"
    identity: opaque
    exclusive_operations:
      - "POST /loan-certifications/{certification_id}/audit-hold"
      - "POST /loan-certifications/{certification_id}/audit-release"
      - "POST /nondiscrimination-tests"
      - "POST /nondiscrimination-tests/{test_id}/compute"
      - "POST /nondiscrimination-tests/{test_id}/correction"
    shared_operations:
      - "POST /_clock/set_current_utc (also BenefitsAdministrator, PayrollOperator)"
      - "GET /employees/{employee_id}/audit-packet (also BenefitsAdministrator)"
      - "all other GET reads"
