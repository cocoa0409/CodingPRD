              payload: { legal_name: "OC1 REIT", ticker: "OC1R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 1000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${reit_v}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 100, effective_date: "2026-01-10", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (http 412) — the intervening dividend create incremented Reit.version"

      - name: unfreeze_restores_active_status
        claim_type: cascading_side_effects
        grounds: [state_machines.Shareholder.FROZEN_to_ACTIVE, "endpoints.POST_/reit-compliance/shareholders/{id}/unfreeze"]
        distinguishing_aspect: "Compensating action for the finalize freeze: POST /shareholders/{id}/unfreeze returns the violator to ACTIVE; unfreeze on an ACTIVE holder returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Reit R1 ACTIVE; holder Dom FROZEN via a finalize (97 of 100 shares -> 97.0% > 9.8 limit but top-5 = 97% fails too)"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "UF REIT", ticker: "UFRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Dom", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_dom: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Min", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_min: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 100 }
              as: ComplianceOfficer
              captures: { snap_id: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_dom}", shares_held: 97 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_min}", shares_held: 3 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_id}/finalize"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/shareholders/${sh_dom}/unfreeze"
              payload: {}
              as: TaxDirector
              captures: { st: $.data.status }
            - call: "POST /reit-compliance/shareholders/${sh_min}/unfreeze"
              payload: {}
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "unfreeze on FROZEN holder: status == ACTIVE"
            - "unfreeze on already-ACTIVE holder: error_id == ERR_INVALID_STATE (409)"

  # ===========================================================================
  # Section: consistency_model — immediate visibility of mutations
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/reit-compliance/ep-adjustments/{id}/post"]
        distinguishing_aspect: "Immediate consistency: the POST /ep-adjustments/{id}/post response shows status POSTED, and a subsequent GET /reits/{id} already reflects the new current_ep_balance_cents."
        test_recipe:
          setup: ["Reit R1 ACTIVE; quarter OPEN; DRAFT adjustment 77000"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "IC REIT", ticker: "ICRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "DISALLOWED_DEDUCTION", amount_cents: 77000, effective_date: "2026-01-10", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
              captures: { st: $.data.status }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { ep: $.data.current_ep_balance_cents }
          assert:
            - "post response status == POSTED"
            - "immediate follow-up GET shows current_ep_balance_cents == 77000"
