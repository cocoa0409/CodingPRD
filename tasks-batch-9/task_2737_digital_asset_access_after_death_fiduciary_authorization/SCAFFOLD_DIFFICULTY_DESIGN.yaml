              captures: { a_del_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa1_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
