  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: entitlement_pool_identity_survives_book_exhaust_overage_and_cancel
        grounds:
          - calculations.entitlement_consumption
          - state_machines.EntitlementGrant.OPEN_to_EXHAUSTED
          - state_machines.EntitlementGrant.EXHAUSTED_to_OPEN
          - state_machines.ConsultBooking.SCHEDULED_to_CANCELLED
          - entities.EntitlementGrant.fields.available_count
          - entities.EntitlementGrant.fields.released_count
        distinguishing_aspect: |
          Conserved quantity: entitlement units, pinned as
          available_count + booked_count + consumed_count == granted_count. The
          forward action (book) and its compensating action (cancel) return
          available_count to its pre-book value exactly, advance released_count
          by one, and flip the grant back from EXHAUSTED to OPEN; overage_count
          sits outside the identity and never perturbs it.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One PLUS plan granting 3 lactation consults, one physician with panel_slot_cap 20.0 licensed in CA"
            - "One family, one child, an ACTIVE membership started 2026-06-01 with the June invoice of 40000 cents PAID"
            - "The LACTATION_CONSULT grant for membership_year_index 0 exists with granted_count 3 and available_count 3"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Weiss", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Tess", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /peds/invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "POST /peds/invoices/${inv_id}/pay"
              payload: { amount_paid_cents: 40000 }
              as: BillingSpecialist
            - call: "GET /peds/entitlement-grants"
              payload: { membership_id: "${mem_id}", benefit_type: "LACTATION_CONSULT" }
              as: CareCoordinator
              captures: { grant_id: "$.data[0].id", granted0: "$.data[0].granted_count", avail0: "$.data[0].available_count" }
          trigger:
            - call: "POST /peds/consult-bookings"
              payload: { membership_id: "${mem_id}", consult_type: "LACTATION_CONSULT", consultant_physician_id: "${doc_id}", scheduled_start: "2026-06-20T09:00:00Z", scheduled_end: "2026-06-20T09:45:00Z", modality: "IN_PERSON", patient_state_code: "CA" }
              as: CareCoordinator
              captures: { b1_id: "$.data.id" }
            - call: "POST /peds/consult-bookings"
              payload: { membership_id: "${mem_id}", consult_type: "LACTATION_CONSULT", consultant_physician_id: "${doc_id}", scheduled_start: "2026-06-20T10:00:00Z", scheduled_end: "2026-06-20T10:45:00Z", modality: "IN_PERSON", patient_state_code: "CA" }
              as: CareCoordinator
              captures: { b2_id: "$.data.id" }
            - call: "POST /peds/consult-bookings"
              payload: { membership_id: "${mem_id}", consult_type: "LACTATION_CONSULT", consultant_physician_id: "${doc_id}", scheduled_start: "2026-06-20T11:00:00Z", scheduled_end: "2026-06-20T11:45:00Z", modality: "IN_PERSON", patient_state_code: "CA" }
              as: CareCoordinator
              captures: { b3_id: "$.data.id" }
            - call: "POST /peds/consult-bookings"
              payload: { membership_id: "${mem_id}", consult_type: "LACTATION_CONSULT", consultant_physician_id: "${doc_id}", scheduled_start: "2026-06-20T12:00:00Z", scheduled_end: "2026-06-20T12:45:00Z", modality: "IN_PERSON", patient_state_code: "CA" }
