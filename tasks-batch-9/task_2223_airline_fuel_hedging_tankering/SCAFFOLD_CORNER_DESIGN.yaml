  # ===========================================================================
  - section: rbac
    instances:

      - name: three_roles_cannot_reach_creators_reserved_for_other_roles
        claim_type: role_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles
          - endpoints[POST /fuel/hedge-policies]
        distinguishing_aspect: |
          Role gating is per endpoint, not per entity family: FuelAnalyst may create
          forecasts and programs but not policies, StationCoordinator may touch only
          its own station's inventory, and FuelOpsController may create flight legs
          but not consumption forecasts. Each denial is 403 ERR_FORBIDDEN_ROLE with a
          well-formed body, and priority 2 beats priority 3 - the payloads that are
          rejected here are valid ones.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-RBAC", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: FuelAnalyst
              as_user_id: u_analyst_1
              captures: { e1: $.data.error_id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: StationCoordinator
              as_user_id: u_station_1
              captures: { e2: $.data.error_id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelOpsController
              as_user_id: u_ops_1
              captures: { e3: $.data.error_id }
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-RBAC", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
          assert:
            - "Trigger call 1: HTTP 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\"."
            - "Trigger call 2: HTTP 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\"."
            - "Trigger call 3: HTTP 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\"."
            - "Trigger call 4: HTTP 201 - the identical policy payload is accepted for RiskPolicyAdmin, so the three refusals were about the role only."

      - name: missing_or_unknown_role_header_is_unauthenticated_not_forbidden
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Priority 1 separates "who are you" from "may you": a missing X-User-Role, a
          missing X-User-ID and a role string outside the six declared roles are all
          401 ERR_UNAUTHENTICATED, never 403. Because priority 1 precedes priority 3,
          an unauthenticated request with a deliberately malformed body still reports
          401 rather than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy exists so the read target is real."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-AUTH", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
              captures: { policy_id: $.data.id }
          trigger:
            - call: "GET /fuel/hedge-policies/${policy_id}"
              payload: {}
              as: "(X-User-Role header omitted)"
              captures: { e1: $.data.error_id }
            - call: "GET /fuel/hedge-policies/${policy_id}"
              payload: {}
              as: RiskPolicyAdmin
              as_user_id: "(X-User-ID header omitted)"
              captures: { e2: $.data.error_id }
            - call: "GET /fuel/hedge-policies/${policy_id}"
              payload: {}
              as: "FuelDirector"
              as_user_id: u_ghost_1
              captures: { e3: $.data.error_id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "SPACEPLANE", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: "FuelDirector"
              as_user_id: u_ghost_1
              captures: { e4: $.data.error_id }
            - call: "GET /fuel/hedge-policies/${policy_id}"
              payload: {}
              as: StationCoordinator
              as_user_id: u_station_1
          assert:
            - "Trigger call 1: HTTP 401 and data.error_id == \"ERR_UNAUTHENTICATED\"."
            - "Trigger call 2: HTTP 401 and data.error_id == \"ERR_UNAUTHENTICATED\"."
            - "Trigger call 3: HTTP 401 and data.error_id == \"ERR_UNAUTHENTICATED\" - an undeclared role is not 403."
            - "Trigger call 4: HTTP 401 and data.error_id == \"ERR_UNAUTHENTICATED\", not ERR_INVALID_REQUEST, even though fleet_type is not a valid enum member."
            - "Trigger call 5: HTTP 200 - StationCoordinator is one of the six declared roles and this read allows all six."

      - name: station_coordinator_cannot_adjust_a_station_it_does_not_own
        claim_type: role_denied
        grounds:
          - validations[priority=6]
          - errors[ERR_STATION_NOT_OWNED]
          - endpoints[POST /fuel/stations/{id}/inventory-adjustments]
        distinguishing_aspect: |
          StationCoordinator holds a row-scoped grant: the role passes priority 2 for
          this endpoint, then priority 6 compares X-User-ID against the path station
          id and returns 403 ERR_STATION_NOT_OWNED for any other station. The scoping
          is not applied to FuelOpsController, which may adjust either station, so the
          same rejected call succeeds unchanged for that role.
        test_recipe:
          setup:
            - "Two stations, DFW and ORD, both at zero inventory."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-OWN", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000 }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
              captures: { st_dfw: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 80000 }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
              captures: { st_ord: $.data.id }
          trigger:
            - call: "POST /fuel/stations/${st_dfw}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Coordinator posting against the wrong station record." }
              as: StationCoordinator
              as_user_id: "${st_ord}"
              captures: { e1: $.data.error_id }
            - call: "POST /fuel/stations/${st_dfw}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock at the coordinator's own station." }
              as: StationCoordinator
              as_user_id: "${st_dfw}"
            - call: "POST /fuel/stations/${st_dfw}/inventory-adjustments"
              payload: { delta_gallons: -100000, reason: "Operations controller trues up after a large lifting." }
              as: FuelOpsController
              as_user_id: u_ops_1
          assert:
            - "Trigger call 1: HTTP 403 and data.error_id == \"ERR_STATION_NOT_OWNED\"."
            - "Trigger call 2: HTTP 200, data.inventory_gallons == 500000, data.days_cover == 5.00, data.supply_posture == \"WATCH\"."
            - "Trigger call 3: HTTP 200, data.inventory_gallons == 400000, data.days_cover == 4.00, data.supply_posture == \"WATCH\" - FuelOpsController is not row-scoped."

      - name: exception_requester_cannot_decide_their_own_exception
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=18]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PolicyException.fields.requested_by_user_id
        distinguishing_aspect: |
          Priority 18 compares identities, not roles: a caller who legitimately holds
          RiskPolicyAdmin is still refused 403 on both /approve and /deny when
          X-User-ID equals the exception's requested_by_user_id, and the refusal is not
          convertible by switching endpoint. A different admin decides the same row
          immediately afterwards, so the block was about the person.
        test_recipe:
          setup:
            - "One REQUESTED PolicyException raised by user u_dual_1 with no entity references."
          setup_api_calls:
            - call: "POST /fuel/policy-exceptions"
              payload: { reason_code: "EARNINGS_VOLATILITY_BREACH", justification: "Standing tolerance requested ahead of the February revaluation cycle." }
              as: FuelAnalyst
              as_user_id: u_dual_1
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /fuel/policy-exceptions/${exc_id}/approve"
              payload: { decision_note: "Self-approval attempt by the requester wearing the admin role." }
              as: RiskPolicyAdmin
              as_user_id: u_dual_1
              captures: { e1: $.data.error_id }
            - call: "POST /fuel/policy-exceptions/${exc_id}/deny"
              payload: { decision_note: "Self-denial attempt by the requester wearing the admin role." }
              as: RiskPolicyAdmin
              as_user_id: u_dual_1
              captures: { e2: $.data.error_id }
            - call: "GET /fuel/policy-exceptions/${exc_id}"
              payload: {}
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
            - call: "POST /fuel/policy-exceptions/${exc_id}/deny"
              payload: { decision_note: "Denied by an independent approver; tolerance not justified." }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
          assert:
            - "Trigger call 1: HTTP 403 and data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"."
            - "Trigger call 2: HTTP 403 and data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"."
            - "Trigger call 3: data.status == \"REQUESTED\", data.decided_by_user_id == null, data.decided_at == null, data.requested_by_user_id == \"u_dual_1\"."
            - "Trigger call 4: HTTP 200, data.status == \"DENIED\", data.decided_by_user_id == \"u_admin_1\", data.decided_at is non-null."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_program_version_blocks_a_second_instrument_until_refreshed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[instrument-create-stale-program]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Adding a second instrument is legitimate, so nothing but the version guard
          can reject the stale writer: replaying the version captured before the first
          instrument returns 412 ERR_STALE_VERSION, the rejected attempt leaves
          hedged_gallons and open_instrument_count untouched, and re-reading the
          program lets the identical payload through.
        test_recipe:
          setup:
            - "One SIZING HedgeProgram at version 2 with consumption_basis_gallons 4400000 and no instruments."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5000 }
              as: FuelAnalyst
              captures: { inst_a: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 400000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5500 }
              as: FuelAnalyst
              captures: { e1: $.data.error_id }
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v2: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 400000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v2}", strike_usd_per_gal: 2.5500 }
              as: FuelAnalyst
            - call: "GET /fuel/hedge-programs/${prog_id}/instruments"
              payload: { trade_status: "PROPOSED" }
              as: FuelAnalyst
          assert:
            - "Trigger call 1: HTTP 201 and data.notional_gallons == 1000000."
            - "Trigger call 2: HTTP 412 and data.error_id == \"ERR_STALE_VERSION\"."
            - "Trigger call 3: data.version == 3, data.hedged_gallons == 1000000, data.open_instrument_count == 1, data.consumption_basis_gallons == 4400000."
            - "Trigger call 4: HTTP 201 and data.notional_gallons == 400000."
            - "Trigger call 5: meta.total_count == 2 and len(data) == 2."

      - name: stale_counterparty_version_blocks_a_collateral_posting_after_credit_review
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[collateral-post-stale-counterparty]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /fuel/counterparties/{id}/credit-review]
        distinguishing_aspect: |
          The stale read here is invalidated by an unrelated write: a credit review
          that only re-rates the counterparty still advances its version, so a posting
          quoting the pre-review version is refused 412. The refusal is not a state
          conflict - multiple postings against one counterparty are normal - and the
          same payload with the refreshed version is accepted.
        test_recipe:
          setup:
            - "One APPROVED Counterparty at version 1 and one PROPOSED SWAP to collateralize."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_id: $.data.id, cp_v: $.data.version }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5000 }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /fuel/counterparties/${cp_id}/credit-review"
              payload: { credit_rating: "BBB", review_note: "Quarterly re-rating after the dealer's earnings release." }
              as: TreasuryRiskManager
              as_user_id: u_trm_1
            - call: "POST /fuel/counterparties/${cp_id}/collateral-postings"
              payload: { hedge_instrument_id: "${inst_id}", collateral_type: "CASH", expected_counterparty_version: "${cp_v}" }
              as: RiskPolicyAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /fuel/counterparties/${cp_id}"
              payload: {}
              as: RiskPolicyAdmin
              captures: { cp_v2: $.data.version }
            - call: "POST /fuel/counterparties/${cp_id}/collateral-postings"
              payload: { hedge_instrument_id: "${inst_id}", collateral_type: "CASH", expected_counterparty_version: "${cp_v2}" }
              as: RiskPolicyAdmin
            - call: "GET /fuel/counterparties/${cp_id}/collateral-postings"
              payload: { status: "REQUIRED" }
              as: TreasuryRiskManager
          assert:
            - "Trigger call 1: HTTP 200, data.credit_rating == \"BBB\", data.status == \"APPROVED\", data.version == 2."
            - "Trigger call 2: HTTP 412 and data.error_id == \"ERR_STALE_VERSION\"."
            - "Trigger call 3: data.version == 2 and data.posted_collateral_usd == 0 - the refused posting created nothing."
            - "Trigger call 4: HTTP 201, data.status == \"REQUIRED\", data.required_amount_usd == 0.00."
            - "Trigger call 5: meta.total_count == 1 and len(data) == 1."

      - name: stale_flight_leg_version_blocks_a_follow_up_directive_after_reconciliation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[directive-create-stale-flight-leg]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
          - entities.FlightLeg.fields.actual_uplift_gallons
        distinguishing_aspect: |
          Reconciliation writes actual_uplift_gallons and actual_block_minutes onto the
          leg, so a client holding the pre-reconciliation version is stale even though
          creating another directive on the leg is allowed. Priority 8 fires before the
          contract and uplift checks, and the refused create supersedes nothing - the
          RECONCILED directive is still RECONCILED.
        test_recipe:
          setup:
            - "Logical clock 2027-02-10; ACTIVE contracts at DFW (2.4700) and ORD (3.1000); DFW inventory 500000."
            - "One directive for 3000 gallons on leg FA100 already walked to RECONCILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-TANK", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000 }
              as: RiskPolicyAdmin
              captures: { st_dfw: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 80000 }
              as: RiskPolicyAdmin
              captures: { st_ord: $.data.id }
            - call: "POST /fuel/stations/${st_dfw}/supply-contracts"
              payload: { contract_ref: "DFW-2027", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 5000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${st_ord}/supply-contracts"
              payload: { contract_ref: "ORD-2027", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 5000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${st_dfw}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock for the February tankering window." }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "FA100", departure_date: "2027-02-10", origin_station_id: "${st_dfw}", destination_station_id: "${st_ord}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 15000, tank_capacity_gallons: 26500, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 130000, max_landing_weight_lbs: 205000 }
              as: FuelOpsController
              captures: { leg_a: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_a}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_1: $.data.id }
            - call: "POST /fuel/tankering-directives/${dir_1}/approve"
              payload: {}
              as: FuelOpsController
              as_user_id: u_ops_1
            - call: "POST /fuel/tankering-directives/${dir_1}/execute"
              payload: {}
              as: FuelOpsController
              as_user_id: u_ops_1
            - call: "POST /fuel/tankering-directives/${dir_1}/reconcile"
              payload: { actual_uplift_gallons: 3000, actual_block_minutes: 210 }
              as: FuelOpsController
              as_user_id: u_ops_1
          trigger:
            - call: "POST /fuel/flight-legs/${leg_a}/tankering-directives"
              payload: { requested_uplift_gallons: 2000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { e1: $.data.error_id }
            - call: "GET /fuel/tankering-directives/${dir_1}"
              payload: {}
              as: FuelOpsController
            - call: "GET /fuel/flight-legs/${leg_a}"
              payload: {}
              as: FuelOpsController
              captures: { leg_v2: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_a}/tankering-directives"
              payload: { requested_uplift_gallons: 2000, expected_flight_leg_version: "${leg_v2}" }
              as: FuelAnalyst
            - call: "GET /fuel/flight-legs/${leg_a}/tankering-directives"
              payload: { status: "PROPOSED" }
              as: FuelOpsController
          assert:
            - "Trigger call 1: HTTP 412 and data.error_id == \"ERR_STALE_VERSION\"."
            - "Trigger call 2: data.status == \"RECONCILED\" - the refused create superseded nothing."
            - "Trigger call 3: data.actual_uplift_gallons == 3000 and data.actual_block_minutes == 210."
            - "Trigger call 4: HTTP 201, data.status == \"PROPOSED\", data.requested_uplift_gallons == 2000, data.revision_count == 0."
            - "Trigger call 5: meta.total_count == 1 and data[0].requested_uplift_gallons == 2000."

      - name: publication_cascade_reaches_three_entity_families
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MarkToMarketRun.transitions
          - calculations.margin_requirement_usd
        excluded_because:
          difficulty_instance: transitive_cascade / mtm_publish_adverse_margin_call_chain
          rationale: "The named §1.8 instance asserts all three cascade hops of publication plus the auto-raised SYSTEM_BREACH exception."

      - name: effectiveness_ratio_has_two_computation_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.effectiveness_ratio
          - entities.EffectivenessTest.fields.cumulative_ratio
        excluded_because:
          difficulty_instance: dual_variant_calc / effectiveness_period_basis_vs_cumulative_basis
          rationale: "The named §1.8 instance drives period and cumulative ratios apart and asserts only the cumulative variant decides PASS or FAIL."

      - name: station_gallons_are_reconciled_against_actuals
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Station.fields.inventory_gallons
          - entities.TankeringDirective.fields.savings_variance_usd
        excluded_because:
          difficulty_instance: compensating_invariant / station_gallon_ledger_trued_up_at_reconciliation
          rationale: "The named §1.8 instance asserts the gallon ledger and the savings variance after an actual uplift differing from the plan."

      - name: margin_addon_crosses_concentration_tiers
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.margin_requirement_usd
          - entities.Counterparty.fields.credit_posture
        excluded_because:
          difficulty_instance: combinatorial_formula / margin_concentration_addon_tier_ladder
          rationale: "The named §1.8 instance walks a counterparty through all four add-on tiers with the pinned evaluation order."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: execute_makes_every_derived_ledger_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.margin_requirement_usd
          - calculations.counterparty_credit_posture
          - calculations.hedge_coverage_ratio
        distinguishing_aspect: |
          Consistency is immediate, so the single /execute response already carries the
          instrument's margin_requirement_usd, and the very next reads - with no
          intervening write - show the counterparty ledger at 60000.00 with utilization
          3.00 and the program's coverage at 22.73 percent. Every response, success or
          error, carries meta.api_request_id and the declared response_type, and the
          error envelope puts error_id and message under data.
        test_recipe:
          setup:
            - "An ACTIVE HedgeProgram with consumption_basis_gallons 4400000 and one PROPOSED 1000000-gallon SWAP against a 2000000.00 credit limit."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_id: $.data.id }
