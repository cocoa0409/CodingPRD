# =============================================================================
# Scaffold: Classroom Book Club Flyer Ordering & Teacher Reward Points
# Harder-than-expert calibration: dense cross-entity coupling, dual-variant
# reward economics, posture-driven gating, temporal overlap on school resources.
# =============================================================================

scenario: |
  Classroom Book Club Flyer Ordering & Teacher Reward Points (Scholastic): monthly flyer
  distribution by grade band with title selection and pricing tiers, teacher-managed class
  orders combining student and parent online submissions into one shipment, reward points
  earned on class order value redeemable for classroom books and supplies, bonus point
  promotions and title-specific incentives that shape ordering behavior, order
  consolidation, shipping and back-order handling to a school address, school book fair
  scheduling interaction and title overlap, title acquisition and licensing for club
  editions with special pricing and paperback formats, low-income school programs and
  donation matching of books.

domain_name: classroom-book-club
api_prefix: /club

# =============================================================================
# Complexity Profile (§0.3) — beyond-Expert density calibration
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  target_level: beyond_expert
  entity_count: 12
  state_machine_count: 7
  calculation_count: 6
  endpoint_count: 42
  error_code_count: 30
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School display name" }
      - { name: address, type: string, source: input, description: "Ship-to street address; all class orders and donation shipments deliver here" }
      - { name: low_income_program, type: boolean, source: input, description: "Enrolled in low-income school program; enables Title I free-shipping and donation matching", default: false }
      - { name: posture, type: enum, source: computed, description: "NORMAL | RESTRICTED — derived from ProgramEnrollment.status (NORMAL when an ACTIVE enrollment exists or none has ever been created; RESTRICTED while suspended); gates flyer cycle publishing, order submission, fair scheduling, donation requests", constraints: "NORMAL | RESTRICTED" }
      - { name: active_fair_id, type: string, source: computed, description: "id of the BookFair whose [start_date, end_date) window contains the logical clock today; null when none" }

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; teacher's school; immutable after registration" }
      - { name: full_name, type: string, source: input, description: "Teacher display name" }
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across all Teachers" }
      - { name: grade_band, type: enum, source: input, description: "Grade band taught; flyer cycles and offerings are band-scoped", constraints: "K_2 | G3_5 | G6_8" }
      - { name: points_balance, type: integer, source: computed, description: "Current redeemable reward points; mirror of points_earned_total - points_redeemed_total - points_expired_total; maintained by reward_points_base accrual/redemption/expiry" }
      - { name: points_earned_total, type: integer, source: computed, description: "Lifetime points earned (base + bonus + incentive, at awarded rate)" }
      - { name: points_redeemed_total, type: integer, source: computed, description: "Lifetime points consumed by Redemption transactions" }
      - { name: points_expired_total, type: integer, source: computed, description: "Lifetime points voided by ops-run expiry (unredeemed points older than POINTS_EXPIRY_MONTHS)" }
      - { name: donated_books_received, type: integer, source: computed, description: "Cumulative count of matched donation copies delivered to this teacher" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: isbn, type: string, source: input, description: "ISBN-13 catalog key", constraints: "unique across all Titles" }
      - { name: name, type: string, source: input, description: "Display title" }
      - { name: format, type: enum, source: input, description: "Club edition physical format", constraints: "HARDCOVER | PAPERBACK | CLUB_PAPERBACK" }
      - { name: grade_band, type: enum, source: input, description: "Band this title may be offered to", constraints: "K_2 | G3_5 | G6_8" }
      - { name: base_price_cents, type: integer, source: input, description: "List price in cents (paid by families); must be > 0" }
      - { name: points_cost, type: integer, source: input, description: "Reward-point cost of one copy when redeemed as a classroom book; must be > 0" }
      - { name: rights_holder, type: string, source: input, description: "Licensor name recorded at acquisition" }
      - { name: royalty_cap_cents, type: integer, source: input, description: "Lifetime royalty ceiling owed to rights holder in cents; acquisition gate and license suspension threshold; must be > 0" }
      - { name: license_status, type: enum, source: computed, description: "ACTIVE | SUSPENDED — SUSPENDED when royalty_accrued_cents > royalty_cap_cents; blocks new flyer offerings and auto-backorders submitted lines", constraints: "ACTIVE | SUSPENDED" }
      - { name: royalty_accrued_cents, type: integer, source: computed, description: "Lifetime royalty accrued from PAID/SHIPPED flyer-order lines of this title at ROYALTY_PER_UNIT_CENTS per unit" }
      - { name: fair_count_used, type: integer, source: computed, description: "Count of this title's FlyerOffering rows with fair_overlap == true across all PUBLISHED FlyerCycles; the fair-overlap gate compares against TITLE_FAIR_OVERLAP_LIMIT" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Promotion display name" }
      - { name: kind, type: enum, source: input, description: "BONUS_POINTS applies the class-value multiplier; TITLE_INCENTIVE applies the per-title bonus", constraints: "BONUS_POINTS | TITLE_INCENTIVE" }
      - { name: grade_band, type: enum, source: input, description: "Band the promotion applies to; null means all bands", constraints: "K_2 | G3_5 | G6_8 | null" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; required iff kind == TITLE_INCENTIVE, null otherwise" }
      - { name: multiplier_bp, type: integer, source: input, description: "Bonus-points multiplier in basis points (e.g. 200 = 2x earn); required iff kind == BONUS_POINTS; must be >= 100" }
      - { name: bonus_points_per_unit, type: integer, source: input, description: "Flat bonus points per ordered unit of title_id; required iff kind == TITLE_INCENTIVE; must be >= 0" }
      - { name: starts_on, type: string, source: input, description: "Inclusive window start date (YYYY-MM-DD)" }
      - { name: ends_on, type: string, source: input, description: "Exclusive window end date (YYYY-MM-DD); must be > starts_on" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | EXPIRED — EXPIRED once logical clock date >= ends_on; EXPIRED promotions never apply", constraints: "ACTIVE | EXPIRED" }

  - name: FlyerCycle
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; school this monthly flyer belongs to" }
      - { name: month, type: string, source: input, description: "Cycle month key YYYY-MM" }
      - { name: grade_band, type: enum, source: input, description: "Band this flyer serves", constraints: "K_2 | G3_5 | G6_8" }
      - { name: status, type: enum, source: computed, description: "DRAFT | PUBLISHED | CLOSED — one PUBLISHED cycle per (school, grade_band) at a time", constraints: "DRAFT | PUBLISHED | CLOSED" }
      - { name: offering_count, type: integer, source: computed, description: "Count of FlyerOffering rows in this cycle; publish requires >= 1" }

  - name: FlyerOffering
    parent: FlyerCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> FlyerCycle.id; owning cycle (path-scoped at creation)" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; offered title — must satisfy band, format, and license gates at add-time" }
      - { name: flyer_price_cents, type: integer, source: computed, description: "Pinned flyer price: floor(Title.base_price_cents * CLUB_PRICE_FACTOR_NUM / CLUB_PRICE_FACTOR_DEN) for CLUB_PAPERBACK titles, Title.base_price_cents otherwise; pinned at add-time, never recomputed" }
      - { name: fair_overlap, type: boolean, source: computed, description: "true iff the school has a BookFair in status SCHEDULED or ACTIVE whose [start_date, end_date) window intersects this cycle's month AND the fair's FairTitle list includes title_id; order lines with fair_overlap=true are EXCLUDED from reward point earning" }

  - name: ClassOrder
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> FlyerCycle.id; the PUBLISHED flyer cycle this class order belongs to" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; owning teacher; must teach at the cycle's school and match its grade_band" }
      - { name: status, type: enum, source: computed, description: "OPEN | SUBMITTED | CANCELLED", constraints: "OPEN | SUBMITTED | CANCELLED" }
      - { name: ship_status, type: enum, source: computed, description: "PENDING | PARTIAL | SHIPPED — parallel dimension; advances only via ops-run shipping after SUBMITTED", constraints: "PENDING | PARTIAL | SHIPPED" }
      - { name: points_status, type: enum, source: computed, description: "UNAWARDED | AWARDED | CLAWED_BACK — parallel dimension; awarded once at submit, clawed back on cancel", constraints: "UNAWARDED | AWARDED | CLAWED_BACK" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over non-CANCELLED order lines of qty * unit_price_cents" }
      - { name: rewardable_subtotal_cents, type: integer, source: computed, description: "Sum over non-CANCELLED lines with fair_overlap=false and donation_funded=false of qty * unit_price_cents; the earning base" }
      - { name: discount_cents, type: integer, source: computed, description: "Tier discount in cents, recomputed per tier_discount_band from subtotal_cents" }
      - { name: net_total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents; the amount charged to families" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "SHIPPING_FLAT_CENTS unless waived: waived when school.low_income_program=true OR rewardable_subtotal_cents >= FREE_SHIP_MIN_CENTS; 0 when waived" }
      - { name: awarded_base_points, type: integer, source: computed, description: "Preview of base points at submit time: floor(rewardable_subtotal_cents / CENTS_PER_POINT)" }
      - { name: awarded_bonus_points, type: integer, source: computed, description: "Preview of promotion-driven bonus at submit time (best-promo multiplier bonus + per-unit title incentives)" }
      - { name: awarded_total_points, type: integer, source: computed, description: "awarded_base_points + awarded_bonus_points; credited to Teacher at SUBMIT" }

  - name: OrderLine
    parent: ClassOrder
    common_fields: true
    fields:
      - { name: class_order_id, type: string, source: system, description: "FK -> ClassOrder.id; owning order (path-scoped at creation)" }
      - { name: offering_id, type: string, source: input, description: "FK -> FlyerOffering.id; the offered title being purchased" }
      - { name: student_name, type: string, source: input, description: "Student the books are for" }
      - { name: submitted_by, type: enum, source: input, description: "Submission channel recorded on the line", constraints: "PARENT_ONLINE | TEACHER" }
      - { name: qty, type: integer, source: input, description: "Copies ordered; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of FlyerOffering.flyer_price_cents at line creation; never recomputed" }
      - { name: fair_overlap, type: boolean, source: computed, description: "Snapshot of FlyerOffering.fair_overlap at line creation" }
      - { name: donation_funded, type: boolean, source: computed, description: "true when this line was created by donation matching; donation-funded lines never earn points", default: false }
      - { name: status, type: enum, source: computed, description: "ACTIVE | BACKORDERED | CANCELLED", constraints: "ACTIVE | BACKORDERED | CANCELLED" }
      - { name: points_earned, type: integer, source: computed, description: "This line's attribution of base points: floor(line_rewardable_value / CENTS_PER_POINT) with the order-level remainder given to the earliest-created qualifying line (created_at ASC, tie-break student_name ASC)" }

  - name: BookFair
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; school hosting the fair" }
      - { name: start_date, type: string, source: input, description: "Fair start date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Fair end date YYYY-MM-DD (exclusive); must be > start_date" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED — ACTIVE while the logical clock date is inside [start_date, end_date)", constraints: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED" }

  - name: FairTitle
    parent: BookFair
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: system, description: "FK -> BookFair.id; owning fair (path-scoped at creation)" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title featured at the fair; unique within the fair" }

  - name: DonationRequest
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; requesting school — must be a low-income program school" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; requesting teacher at that school" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; requested title; must be license ACTIVE" }
      - { name: qty_requested, type: integer, source: input, description: "Copies requested; must be >= 1" }
      - { name: qty_matched, type: integer, source: computed, description: "Copies matched by sponsor funds at match time (all-or-nothing)" }
      - { name: status, type: enum, source: computed, description: "OPEN | MATCHED | FULFILLED | CANCELLED", constraints: "OPEN | MATCHED | FULFILLED | CANCELLED" }

  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; redeeming teacher" }
      - { name: kind, type: enum, source: input, description: "Redemption basket kind", constraints: "BOOK | SUPPLY" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; required iff kind == BOOK (the classroom book title), null for SUPPLY" }
      - { name: qty, type: integer, source: input, description: "Units redeemed; must be >= 1" }
      - { name: points_cost, type: integer, source: computed, description: "Total points charged: qty * Title.points_cost for BOOK, qty * SUPPLY_UNIT_POINTS_COST for SUPPLY" }
      - { name: status, type: enum, source: computed, description: "PENDING | CONFIRMED | CANCELLED", constraints: "PENDING | CONFIRMED | CANCELLED" }

  - name: ProgramEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; enrolled school; at most one ACTIVE enrollment per school" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | SUSPENDED — drives School.posture derivation", constraints: "ACTIVE | SUSPENDED" }
      - { name: enrolled_on, type: string, source: input, description: "Enrollment date YYYY-MM-DD" }

  - name: PointsLedger
    parent: null
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; ledger owner" }
      - { name: entry_type, type: enum, source: input, description: "Ledger entry kind", constraints: "EARN | REDEEM | EXPIRE | CLAWBACK | ADJUST" }
      - { name: points, type: integer, source: input, description: "Signed point amount (EARN positive, REDEEM/EXPIRE/CLAWBACK negative, ADJUST either)" }
      - { name: ref_type, type: enum, source: input, description: "What this entry references", constraints: "CLASS_ORDER | REDEMPTION | OPS_RUN | MANUAL" }
      - { name: ref_id, type: string, source: input, description: "id of the referenced ClassOrder / Redemption / ops run / adjustment ticket" }
      - { name: note, type: string, source: input, description: "Free-text rationale (required for ADJUST)", default: "" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: School
    field: posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: RESTRICTED
        trigger: "POST /club/schools/{id}/suspend-program"
        actor: ClubAdmin
        preconditions:
          - "School.posture == NORMAL"
          - "School has a ProgramEnrollment row with status == ACTIVE"
        side_effects:
          - "ProgramEnrollment.status: ACTIVE -> SUSPENDED"
          - "Every ClassOrder in OPEN status belonging to a Teacher of this school is auto-cancelled (status -> CANCELLED); its OPEN OrderLines transition to CANCELLED"
          - "School.active_fair_id recomputed (unchanged unless clock-dependent)"
        note: "Cascade depth: School -> Enrollment -> ClassOrder -> OrderLine"
      - from: RESTRICTED
        to: NORMAL
        trigger: "POST /club/schools/{id}/reinstate-program"
        actor: ClubAdmin
        preconditions:
          - "School.posture == RESTRICTED"
        side_effects:
          - "ProgramEnrollment.status: SUSPENDED -> ACTIVE"
          - "School.active_fair_id recomputed against the logical clock"

  - entity: FlyerCycle
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /club/flyer-cycles/{id}/publish"
        actor: ClubAdmin
        preconditions:
          - "School of the cycle has posture == NORMAL"
          - "offering_count >= 1"
          - "No other FlyerCycle for the same (school_id, grade_band) is currently PUBLISHED"
        side_effects:
          - "For every FlyerOffering in the cycle: recompute fair_overlap against the school's fairs overlapping cycle.month, and add 1 to each offered Title.fair_count_used if fair_overlap == true"
          - "increments FlyerCycle.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /club/flyer-cycles/{id}/close"
        actor: ClubAdmin
        preconditions:
          - "Every ClassOrder in the cycle has status != OPEN"
        side_effects:
          - "Cycle closes; lines in BACKORDERED status remain backordered (they belong to their order, not the cycle)"
      - from: DRAFT
        to: CLOSED
        trigger: "POST /club/flyer-cycles/{id}/close"
        actor: ClubAdmin
        preconditions: []
        side_effects:
          - "Cycle closed without publication; offerings discarded for ordering purposes"

  - entity: ClassOrder
    field: status
    initial_state: OPEN
    terminal_states: [CANCELLED]
    note: "status is one of three parallel dimensions on ClassOrder: status x ship_status x points_status evolve independently."
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /club/class-orders/{id}/submit"
        actor: Teacher
        preconditions:
          - "Acting teacher is the order's teacher_id"
          - "Teacher.school.posture == NORMAL"
          - "Cycle of the order is PUBLISHED"
          - "At least one OrderLine with status != CANCELLED exists"
          - "points_status == UNAWARDED"
        side_effects:
          - "Run reward_points_base (AWARDED variant): award awarded_total_points to Teacher.points_balance and points_earned_total"
          - "points_status: UNAWARDED -> AWARDED"
          - "ship_status: PENDING -> SHIPPED if zero non-cancelled lines remain BACKORDERED, else stays PENDING"
          - "For every non-CANCELLED line whose title license_status == SUSPENDED: line.status -> BACKORDERED and ship_status forced to PENDING"
          - "Accrue ROYALTY_PER_UNIT_CENTS * qty to each ordered Title.royalty_accrued_cents; any Title crossing above royalty_cap_cents flips license_status -> SUSPENDED"
          - "increments ClassOrder.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /club/class-orders/{id}/cancel"
        actor: Teacher
        preconditions:
          - "Acting teacher is the order's teacher_id"
          - "ship_status == PENDING (nothing has shipped)"
        side_effects:
          - "All non-CANCELLED OrderLines -> CANCELLED"
          - "Run reward_points_base (CLAWED_BACK variant): subtract awarded_total_points from Teacher.points_balance; points_status -> CLAWED_BACK; points_earned_total unchanged (clawback is tracked via a negative ledger, balance recomputed)"
          - "Reverse royalty accrual for the order's lines (decrement Title.royalty_accrued_cents by ROYALTY_PER_UNIT_CENTS * qty each); if a Title drops to <= royalty_cap_cents its license_status flips SUSPENDED -> ACTIVE"
          - "increments ClassOrder.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /club/class-orders/{id}/cancel (or school-suspension cascade)"
        actor: Teacher | system
        preconditions:
          - "If actor is Teacher: acting teacher is the order's teacher_id"
        side_effects:
          - "All OPEN/ACTIVE OrderLines -> CANCELLED; BACKORDERED lines -> CANCELLED"
          - "No points were awarded (points_status stays UNAWARDED); no royalty had accrued"
          - "increments ClassOrder.version by 1"

  - entity: ClassOrder
    field: ship_status
    initial_state: PENDING
    terminal_states: [SHIPPED]
    note: "Parallel dimension. Driven only by the shipping ops run; never directly mutated by families."
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "POST /club/_ops/run-shipping"
        actor: ClubAdmin
        preconditions:
          - "ClassOrder.status == SUBMITTED"
          - "At least one line SHIPPED and at least one line still BACKORDERED after this run"
        side_effects:
          - "Lines whose Title.license_status == ACTIVE: BACKORDERED -> ACTIVE -> considered SHIPPED for this run"
          - "Lines whose Title.license_status == SUSPENDED remain BACKORDERED"
          - "increments ClassOrder.version by 1"
      - from: PENDING
        to: SHIPPED
        trigger: "POST /club/_ops/run-shipping"
        actor: ClubAdmin
        preconditions:
          - "ClassOrder.status == SUBMITTED"
          - "After this run, zero lines remain BACKORDERED"
        side_effects:
          - "All BACKORDERED lines with ACTIVE-license titles ship"
          - "increments ClassOrder.version by 1"
      - from: PARTIAL
        to: SHIPPED
        trigger: "POST /club/_ops/run-shipping"
        actor: ClubAdmin
        preconditions:
          - "ClassOrder.status == SUBMITTED"
          - "After this run, zero lines remain BACKORDERED"
        side_effects:
          - "Remaining BACKORDERED lines with ACTIVE-license titles ship"
          - "increments ClassOrder.version by 1"

  - entity: ClassOrder
    field: points_status
    initial_state: UNAWARDED
    terminal_states: [CLAWED_BACK]
    note: "Parallel dimension. AWARDED is not terminal for ship_status but CLAWED_BACK is terminal for points."
    transitions:
      - from: UNAWARDED
        to: AWARDED
        trigger: "POST /club/class-orders/{id}/submit (side effect of status OPEN->SUBMITTED)"
        actor: Teacher
        preconditions:
          - "Covered by the submit transition preconditions"
        side_effects:
          - "Teacher.points_balance += awarded_total_points; Teacher.points_earned_total += awarded_total_points"
      - from: AWARDED
        to: CLAWED_BACK
        trigger: "POST /club/class-orders/{id}/cancel (side effect of status SUBMITTED->CANCELLED)"
        actor: Teacher
        preconditions:
          - "Covered by the cancel transition preconditions"
        side_effects:
          - "Teacher.points_balance -= awarded_total_points (balance may not drop below 0; insufficient balance blocks the cancel with ERR_POINTS_BALANCE_NEGATIVE)"

  - entity: OrderLine
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "DELETE /club/order-lines/{id} or parent-order cancel cascade"
        actor: Parent | Teacher | system
        preconditions:
          - "Parent actor may cancel only lines with submitted_by == PARENT_ONLINE and only while parent ClassOrder.status == OPEN"
          - "Teacher may cancel any line while ClassOrder.status == OPEN"
          - "system cascade cancels regardless when the parent order is cancelled"
        side_effects:
          - "Parent ClassOrder aggregates recomputed (subtotal_cents, rewardable_subtotal_cents, discount_cents, net_total_cents, shipping_fee_cents, awarded_*_points previews)"
      - from: ACTIVE
        to: BACKORDERED
        trigger: "POST /club/class-orders/{id}/submit when the line's Title.license_status == SUSPENDED"
        actor: system
        preconditions:
          - "Parent order submit in progress"
        side_effects:
          - "ClassOrder.ship_status forced to PENDING"
      - from: BACKORDERED
        to: ACTIVE
        trigger: "POST /club/_ops/run-shipping when the line's Title.license_status == ACTIVE"
        actor: system
        preconditions:
          - "Parent ClassOrder.status == SUBMITTED and ship_status in {PENDING, PARTIAL}"
        side_effects:
          - "Line ships; parent ship_status re-derived (PENDING -> PARTIAL or SHIPPED; PARTIAL -> SHIPPED)"

  - entity: BookFair
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /club/_clock/set_current_utc moving the logical clock into [start_date, end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "School.active_fair_id recomputed for the fair's school"
          - "Recompute fair_overlap on every FlyerOffering in PUBLISHED cycles of the school whose month contains the clock date"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /club/_clock/set_current_utc moving the logical clock to >= end_date"
        actor: system
        preconditions: []
        side_effects:
          - "School.active_fair_id cleared (or reassigned to another overlapping fair)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /club/book-fairs/{id}/cancel"
        actor: SchoolAdmin
        preconditions:
          - "BookFair.status == SCHEDULED"
        side_effects:
          - "Title.fair_count_used decremented for every FairTitle of this fair that had been counted"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /club/book-fairs/{id}/cancel"
        actor: SchoolAdmin
        preconditions:
          - "BookFair.status == ACTIVE"
        side_effects:
          - "School.active_fair_id cleared"
          - "Title.fair_count_used decremented for every FairTitle of this fair"
          - "fair_overlap recomputed on affected PUBLISHED-cycle offerings"

  - entity: DonationRequest
    field: status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "POST /club/donation-requests/{id}/match"
        actor: Donor
        preconditions:
          - "School.low_income_program == true AND School.posture == NORMAL"
          - "Title.license_status == ACTIVE"
          - "qty_requested >= 1"
        side_effects:
          - "qty_matched = qty_requested (all-or-nothing match)"
          - "increments DonationRequest.version by 1"
      - from: MATCHED
        to: FULFILLED
        trigger: "POST /club/donation-requests/{id}/fulfill"
        actor: ClubAdmin
        preconditions:
          - "Title.license_status == ACTIVE at fulfillment time"
        side_effects:
          - "Create a ClassOrder (status SUBMITTED, ship_status PENDING, points_status UNAWARDED) on the school's current PUBLISHED cycle for the requesting teacher with qty_matched donation_funded=true OrderLines at unit_price_cents = 0"
          - "If no PUBLISHED cycle exists for (school, teacher.grade_band): create one ad-hoc DRAFT cycle, publish it, then attach (system-forced publish bypasses offering_count >= 1)"
          - "Teacher.donated_books_received += qty_matched"
          - "Accrue royalty on Title for qty_matched units; may flip license_status -> SUSPENDED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /club/donation-requests/{id}/cancel"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []

  - entity: Redemption
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    note: "CONFIRMED is not terminal for the entity lifecycle but no further transitions leave it except none; CONFIRMED redemptions are final."
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /club/redemptions/{id}/confirm"
        actor: Teacher
        preconditions:
          - "Acting teacher is the redemption's teacher_id"
          - "Teacher.points_balance >= points_cost"
          - "If kind == BOOK: Title.license_status == ACTIVE"
        side_effects:
          - "Teacher.points_balance -= points_cost; Teacher.points_redeemed_total += points_cost"
          - "If kind == BOOK: accrue royalty on Title for qty units (redemption copies are club editions)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /club/redemptions/{id}/cancel"
        actor: Teacher
        preconditions:
          - "Acting teacher is the redemption's teacher_id"
        side_effects:
          - "No points movement (hold was never deducted at PENDING)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: class-order-submit-stale-version
    parent_entity: ClassOrder
    write_endpoint: "POST /club/class-orders/{id}/submit"
    occ_field: "expected_class_order_version"
    description: |
      Submitting a ClassOrder whose version has advanced since the client last
      observed it is rejected with ERR_STALE_VERSION. A line add/remove between
      the client's read and submit bumps the order's version via aggregate
      recompute, so the client's priced view is stale and must be refreshed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: title-acquire-stale-version
    parent_entity: Title
    write_endpoint: "POST /club/titles/{id}/acquire"
    occ_field: "expected_title_version"
    description: |
      Re-acquiring (renegotiating royalty cap on) a Title whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION; another acquisition or a royalty-driven license flip
      may have changed the cap/balance the client based its offer on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tier_discount_band
    trigger: "On every OrderLine create/update/cancel while parent ClassOrder.status == OPEN (recomputed live as a preview); pinned into ClassOrder.discount_cents at submit."
    algorithm: threshold
    formula: |
      subtotal = ClassOrder.subtotal_cents  (sum of qty*unit_price_cents over lines with status != CANCELLED)
      tiers = [  # (min_subtotal_cents inclusive, discount_bp of subtotal)
        (0,      0),
        (5000,   500),    # 5.00%
        (15000,  1000),   # 10.00%
        (40000,  1500),   # 15.00%
      ]
      # Boundary rule: tier applies when subtotal >= min_subtotal_cents (inclusive lower bound).
      applicable = last tier t where subtotal >= t.min_subtotal_cents
      # Rounding order is PINNED: discount is computed on the whole subtotal
      # (NOT per-line), then rounded once, half-up to whole cents.
      discount_cents = round_half_up(subtotal * applicable.discount_bp / 10000)
      net_total_cents = subtotal - discount_cents
    input_set: "All OrderLines of the ClassOrder with status != CANCELLED; unit_price_cents snapshots at line creation."
    constants:
      TIER_1_MIN_CENTS: 5000
      TIER_1_BP: 500
      TIER_2_MIN_CENTS: 15000
      TIER_2_BP: 1000
      TIER_3_MIN_CENTS: 40000
      TIER_3_BP: 1500
    precision: "whole cents, round_half_up, applied once to the aggregate"
    variants:
      - name: per_line_rounding
        when: "FORBIDDEN — never used; declared only to pin the rejected alternative"
        difference: "round_half_up per line then sum — produces different cents at tier boundaries; implementations MUST NOT use this variant"

  - name: reward_points_base
    trigger: "ClassOrder submit (AWARDED variant) and ClassOrder cancel-from-SUBMITTED (CLAWED_BACK variant); also drives the awarded_*_points preview on OPEN orders."
    algorithm: aggregation
    formula: |
      # Step 1 — base points from the rewardable base.
      rewardable_subtotal_cents = sum over lines with status != CANCELLED
        AND fair_overlap == false AND donation_funded == false
        of qty * unit_price_cents
      # The earning base is the FULL rewardable subtotal — the tier discount
      # (tier_discount_band) does NOT reduce it.
      base = floor(ClassOrder.rewardable_subtotal_cents / CENTS_PER_POINT)
      # Step 2 — promotion scan over ACTIVE promotions whose window contains
      # the logical clock date AND (grade_band is null OR == teacher.grade_band):
      #   BONUS_POINTS promos: pick the single highest multiplier_bp (ties broken
      #     by earliest Promotion.created_at ASC, then name ASC).
      #     bonus_from_multiplier = floor(base * (best.multiplier_bp - 100) / 100)
      #   TITLE_INCENTIVE promos: sum over qualifying non-cancelled lines
      #     (fair_overlap == false AND donation_funded == false) of
      #     qty * bonus_points_per_unit for each ACTIVE incentive on that title.
      #     Multiple incentives on the SAME title STACK additively.
      # Step 3 — totals.
      awarded_base_points = base
      awarded_bonus_points = bonus_from_multiplier + title_incentive_points
      awarded_total_points = base + awarded_bonus_points
      # Evaluation order is PINNED: base first, then promotions read the
      # already-computed base; the multiplier bonus never re-feeds the base.
    input_set: "Non-CANCELLED lines with fair_overlap == false and donation_funded == false; ACTIVE promotions whose [starts_on, ends_on) contains the logical clock date and whose grade_band matches (null = all bands)."
    constants:
      CENTS_PER_POINT: 100
      PROMO_BASE_BP: 100
    precision: "integer points, floor division"
    variants:
      - name: awarded
        when: "At submit: credits Teacher.points_balance and points_earned_total by awarded_total_points; appends a PointsLedger EARN entry (ref_type CLASS_ORDER)"
        difference: "Uses the earning base EXCLUDING fair-overlap and donation-funded lines"
      - name: clawed_back
        when: "At cancel-from-SUBMITTED: subtracts the original awarded_total_points from Teacher.points_balance; appends a PointsLedger CLAWBACK entry"
        difference: "Reverses the exact pinned awarded_total_points (not a recomputation), so later promotion expiry or price edits cannot change the clawback amount"

  - name: club_price_derive
    trigger: "FlyerOffering creation — flyer_price_cents is pinned once and never recomputed even if Title.base_price_cents later changes."
    algorithm: aggregation
    formula: |
      if Title.format == CLUB_PAPERBACK:
        flyer_price_cents = floor(Title.base_price_cents * CLUB_PRICE_FACTOR_NUM / CLUB_PRICE_FACTOR_DEN)
      else:
        flyer_price_cents = Title.base_price_cents
    input_set: "The single Title referenced by the offering."
    constants:
      CLUB_PRICE_FACTOR_NUM: 70
      CLUB_PRICE_FACTOR_DEN: 100
    precision: "whole cents, floor"
    variants: []

  - name: shipping_fee_resolve
    trigger: "Recomputed on every OrderLine mutation while OPEN; pinned at submit into ClassOrder.shipping_fee_cents."
    algorithm: threshold
    formula: |
      if School.low_income_program == true:
        shipping_fee_cents = 0          # Title I program waiver (school-level)
      elif ClassOrder.rewardable_subtotal_cents >= FREE_SHIP_MIN_CENTS:
        shipping_fee_cents = 0          # order-level waiver; boundary is INCLUSIVE (>=)
      else:
        shipping_fee_cents = SHIPPING_FLAT_CENTS
    input_set: "The ClassOrder's school and its rewardable_subtotal_cents."
    constants:
      SHIPPING_FLAT_CENTS: 750
      FREE_SHIP_MIN_CENTS: 2500
    precision: "whole cents"
    variants: []

  - name: title_royalty_accrue
    trigger: "ClassOrder submit (per ordered line qty), DonationRequest fulfill (per matched qty), Redemption confirm for kind == BOOK (per qty); reversed on ClassOrder cancel-from-SUBMITTED."
    algorithm: chronological
    formula: |
      # Per unit moved, accrue ROYALTY_PER_UNIT_CENTS to Title.royalty_accrued_cents.
      # Units are applied in chronological order of the triggering event's
      # created_at (ASC); the FIRST unit that pushes royalty_accrued_cents
      # STRICTLY ABOVE royalty_cap_cents flips Title.license_status to SUSPENDED
      # (cap comparison is > not >=; hitting the cap exactly keeps ACTIVE).
      # SUSPENSION IS NOT BLOCKING for the in-flight event: the whole submit /
      # fulfill / confirm completes, then the title flips. Later submits
      # involving the title backorder instead.
      # Cancellation of a SUBMITTED order decrements accrued by the same
      # per-unit amount; if the total falls to <= royalty_cap_cents the title
      # flips back SUSPENDED -> ACTIVE.
    input_set: "Triggering event's lines/units for the Title; Title.royalty_accrued_cents and royalty_cap_cents."
    constants:
      ROYALTY_PER_UNIT_CENTS: 90
    precision: "whole cents"
    variants: []

  - name: points_expiry_sweep
    trigger: "POST /club/_ops/run-ops (monthly ops run) — advances the ops epoch; also recomputes School.active_fair_id and expires Promotions whose ends_on <= clock date."
    algorithm: chronological
    formula: |
      # For every Teacher, in order of PointsLedger EARN entries' created_at ASC
      # (tie-break: PointsLedger.created_at ASC then note ASC), expire EARNed
      # points whose ledger entry is older than POINTS_EXPIRY_MONTHS calendar
      # months before the logical clock date and which have not yet been
      # consumed by REDEEM / prior EXPIRE / CLAWBACK entries.
      # Consumption matching is FIFO against the same chronological order.
      # For each expired point: append a PointsLedger EXPIRE entry (-1 point
      # granularity aggregated per teacher per run), increment
      # Teacher.points_expired_total, decrement Teacher.points_balance.
      # points_balance = points_earned_total - points_redeemed_total
      #                  - points_expired_total   (must always reconcile)
    input_set: "All PointsLedger entries of every Teacher, ordered by created_at ASC."
    constants:
      POINTS_EXPIRY_MONTHS: 12
    precision: "integer points"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist, validated left-to-right (school before cycle before order before line); non-existent id -> 404", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Body-referenced FK ids (teacher_id, cycle_id, offering_id, title_id, fair_id, school_id) exist", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "endpoints with FK body fields" }
  - { priority: 5, category: state, check: "Entity is in a state from which the requested transition exists (e.g. submit only from OPEN; cancel only from OPEN/SUBMITTED; match only from OPEN)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Terminal-state lockdown: no transitions out of CANCELLED / CLOSED / FULFILLED / COMPLETED", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "School.posture == NORMAL for order submission, flyer publish, donation match, redemption confirm, fair scheduling on that school", error_id: ERR_SCHOOL_RESTRICTED, http_status: 409, applies_to: "POST /club/class-orders/{id}/submit, POST /club/flyer-cycles/{id}/publish, POST /club/donation-requests/{id}/match, POST /club/redemptions/{id}/confirm, POST /club/book-fairs" }
  - { priority: 8, category: business_safety, check: "Title.license_status == ACTIVE when adding a FlyerOffering, matching a DonationRequest, confirming a BOOK Redemption, or creating a DonationRequest", error_id: ERR_LICENSE_SUSPENDED, http_status: 409, applies_to: "POST /club/flyer-cycles/{id}/offerings, POST /club/donation-requests, POST /club/donation-requests/{id}/match, POST /club/redemptions/{id}/confirm" }
  - { priority: 9, category: business_safety, check: "Title acquisition: proposed royalty_cap_cents must be >= Title.royalty_accrued_cents (cannot cap below what is already owed)", error_id: ERR_ROYALTY_CAP_INVALID, http_status: 422, applies_to: "POST /club/titles, POST /club/titles/{id}/acquire" }
  - { priority: 10, category: business_constraint, check: "Teacher.grade_band == FlyerCycle.grade_band when creating a ClassOrder; Title.grade_band == FlyerCycle.grade_band when adding an offering", error_id: ERR_GRADE_BAND_MISMATCH, http_status: 422, applies_to: "POST /club/class-orders, POST /club/flyer-cycles/{id}/offerings" }
  - { priority: 11, category: business_constraint, check: "Offering title format gate: only PAPERBACK or CLUB_PAPERBACK titles may appear on club flyers", error_id: ERR_FORMAT_NOT_ALLOWED, http_status: 422, applies_to: "POST /club/flyer-cycles/{id}/offerings" }
  - { priority: 12, category: business_constraint, check: "Flyer-cycle uniqueness: at most one PUBLISHED FlyerCycle per (school_id, grade_band); publishing a second is rejected", error_id: ERR_CYCLE_ALREADY_PUBLISHED, http_status: 409, applies_to: "POST /club/flyer-cycles/{id}/publish" }
  - { priority: 13, category: business_constraint, check: "Publish requires offering_count >= 1", error_id: ERR_EMPTY_CYCLE, http_status: 422, applies_to: "POST /club/flyer-cycles/{id}/publish" }
  - { priority: 14, category: business_temporal, check: "BookFair overlap: same school may not hold two BookFairs whose [start_date, end_date) windows intersect — half-open adjacency (a.start == b.end) is ALLOWED", error_id: ERR_FAIR_OVERLAP, http_status: 409, applies_to: "POST /club/book-fairs" }
  - { priority: 15, category: business_temporal, check: "Fair title overlap cap: adding title T to a fair is rejected when T.fair_count_used >= TITLE_FAIR_OVERLAP_LIMIT (inclusive boundary: rejected AT the limit)", error_id: ERR_TITLE_OVERLAP_CAP, http_status: 409, applies_to: "POST /club/book-fairs/{id}/titles" }
  - { priority: 16, category: business_temporal, check: "Promotion window sanity: ends_on > starts_on; creating a wholly-past promotion (ends_on <= clock date) is rejected", error_id: ERR_PROMO_WINDOW_INVALID, http_status: 422, applies_to: "POST /club/promotions" }
  - { priority: 17, category: business_constraint, check: "Promotion shape: kind == BONUS_POINTS requires multiplier_bp >= 100 and title_id null; kind == TITLE_INCENTIVE requires title_id non-null and bonus_points_per_unit >= 0", error_id: ERR_PROMO_SHAPE_INVALID, http_status: 422, applies_to: "POST /club/promotions" }
  - { priority: 18, category: business_fiscal, check: "Redemption confirm affordability: Teacher.points_balance >= Redemption.points_cost", error_id: ERR_INSUFFICIENT_POINTS, http_status: 422, applies_to: "POST /club/redemptions/{id}/confirm" }
  - { priority: 19, category: business_fiscal, check: "Cancel-from-SUBMITTED clawback solvency: Teacher.points_balance >= ClassOrder.awarded_total_points (clawback may not drive balance negative)", error_id: ERR_POINTS_BALANCE_NEGATIVE, http_status: 422, applies_to: "POST /club/class-orders/{id}/cancel" }
  - { priority: 20, category: business_fiscal, check: "Low-income gate: DonationRequest create requires School.low_income_program == true", error_id: ERR_NOT_LOW_INCOME, http_status: 422, applies_to: "POST /club/donation-requests" }
  - { priority: 21, category: business_referential, check: "Ownership: Teacher acting on ClassOrder/Redemption must be the owning teacher_id; Parent cancel restricted to lines with submitted_by == PARENT_ONLINE", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "POST /club/class-orders/{id}/submit, POST /club/class-orders/{id}/cancel, POST /club/redemptions/{id}/confirm, POST /club/redemptions/{id}/cancel, DELETE /club/order-lines/{id}" }
  - { priority: 22, category: business_referential, check: "Cycle closed for ordering: line create/update/delete requires the parent order's cycle to be PUBLISHED and order status OPEN", error_id: ERR_ORDER_NOT_OPEN, http_status: 409, applies_to: "POST /club/class-orders/{id}/lines, PATCH /club/order-lines/{id}, DELETE /club/order-lines/{id}" }
  - { priority: 23, category: business_constraint, check: "Field shape: qty >= 1; dates parse as YYYY-MM-DD; enum members valid; email unique; isbn unique", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 24, category: business_constraint, check: "Submit requires at least one non-CANCELLED line", error_id: ERR_ORDER_EMPTY, http_status: 422, applies_to: "POST /club/class-orders/{id}/submit" }
  - { priority: 25, category: state, check: "OCC: expected_<parent>_version must equal the parent's current version on OCC-guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /club/class-orders/{id}/submit, POST /club/titles/{id}/acquire" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Schools ----
  - { method: POST, path: "/club/schools", description: "Register a school", roles: [ClubAdmin], code: 201, input: [name, address, "low_income_program?"], output: School, side_effects: [] }
  - { method: GET, path: "/club/schools", description: "List schools", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent, Donor], code: 200, input: ["limit?", "offset?"], output: "School[]", side_effects: [] }
  - { method: GET, path: "/club/schools/{id}", description: "Get one school (posture, active_fair_id derived)", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent, Donor], code: 200, input: [], output: School, side_effects: [] }
  - { method: GET, path: "/club/schools/{id}/teachers", description: "Teachers of a school (FK reverse)", roles: [ClubAdmin, SchoolAdmin], code: 200, input: ["limit?", "offset?"], output: "Teacher[]", side_effects: [] }
  - { method: GET, path: "/club/schools/{id}/flyer-cycles", description: "Flyer cycles of a school (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?", "grade_band?", "status?"], output: "FlyerCycle[]", side_effects: [] }
  - { method: GET, path: "/club/schools/{id}/book-fairs", description: "Book fairs of a school (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?", "status?"], output: "BookFair[]", side_effects: [] }
  - { method: GET, path: "/club/schools/{id}/donation-requests", description: "Donation requests of a school (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Donor], code: 200, input: ["limit?", "offset?", "status?"], output: "DonationRequest[]", side_effects: [] }
  - { method: GET, path: "/club/schools/{id}/enrollments", description: "Program enrollments of a school (FK reverse)", roles: [ClubAdmin, SchoolAdmin], code: 200, input: ["limit?", "offset?"], output: "ProgramEnrollment[]", side_effects: [] }
  - { method: POST, path: "/club/schools/{id}/enroll-program", description: "Create a ProgramEnrollment (status ACTIVE) for the school", roles: [ClubAdmin], code: 201, input: [enrolled_on], output: ProgramEnrollment, side_effects: ["School.posture recomputed (NORMAL while an ACTIVE enrollment exists)"] }
  - { method: POST, path: "/club/schools/{id}/suspend-program", description: "Suspend the ACTIVE enrollment; posture NORMAL->RESTRICTED; cascades cancel OPEN class orders", roles: [ClubAdmin], code: 200, input: [], output: School, side_effects: ["ProgramEnrollment -> SUSPENDED", "OPEN ClassOrders of the school's teachers -> CANCELLED with line cascade"] }
  - { method: POST, path: "/club/schools/{id}/reinstate-program", description: "Reinstate enrollment; posture RESTRICTED->NORMAL", roles: [ClubAdmin], code: 200, input: [], output: School, side_effects: ["ProgramEnrollment -> ACTIVE"] }

  # ---- Teachers ----
  - { method: POST, path: "/club/teachers", description: "Register a teacher at a school", roles: [ClubAdmin, SchoolAdmin], code: 201, input: [school_id, full_name, email, grade_band], output: Teacher, side_effects: [] }
  - { method: GET, path: "/club/teachers", description: "List teachers", roles: [ClubAdmin, SchoolAdmin], code: 200, input: ["limit?", "offset?", "school_id?"], output: "Teacher[]", side_effects: [] }
  - { method: GET, path: "/club/teachers/{id}", description: "Get one teacher incl. points balances", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: [], output: Teacher, side_effects: [] }
  - { method: GET, path: "/club/teachers/{id}/points-ledger", description: "Points ledger entries for a teacher (FK reverse)", roles: [ClubAdmin, Teacher], code: 200, input: ["limit?", "offset?", "entry_type?"], output: "PointsLedger[]", side_effects: [] }
  - { method: GET, path: "/club/teachers/{id}/class-orders", description: "Class orders of a teacher (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?", "status?"], output: "ClassOrder[]", side_effects: [] }
  - { method: GET, path: "/club/teachers/{id}/redemptions", description: "Redemptions of a teacher (FK reverse)", roles: [ClubAdmin, Teacher], code: 200, input: ["limit?", "offset?", "status?"], output: "Redemption[]", side_effects: [] }
  - { method: GET, path: "/club/teachers/{id}/donation-requests", description: "Donation requests of a teacher (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher, Donor], code: 200, input: ["limit?", "offset?"], output: "DonationRequest[]", side_effects: [] }

  # ---- Titles ----
  - { method: POST, path: "/club/titles", description: "Acquire a title (initial licensing): registers catalog entry with royalty cap; cap must be >= 0 and is validated against accrued (0 at creation)", roles: [ClubAdmin], code: 201, input: [isbn, name, format, grade_band, base_price_cents, points_cost, rights_holder, royalty_cap_cents], output: Title, side_effects: [] }
  - { method: POST, path: "/club/titles/{id}/acquire", description: "Renegotiate licensing: set a new royalty_cap_cents; OCC-guarded", roles: [ClubAdmin], code: 200, input: [royalty_cap_cents, expected_title_version], output: Title, side_effects: ["license_status recomputed from accrued vs new cap", "increments Title.version by 1"] }
  - { method: GET, path: "/club/titles", description: "List titles", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent, Donor], code: 200, input: ["limit?", "offset?", "grade_band?", "format?", "license_status?"], output: "Title[]", side_effects: [] }
  - { method: GET, path: "/club/titles/{id}", description: "Get one title", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent, Donor], code: 200, input: [], output: Title, side_effects: [] }
  - { method: GET, path: "/club/titles/{id}/promotions", description: "Promotions referencing a title (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?"], output: "Promotion[]", side_effects: [] }
  - { method: GET, path: "/club/titles/{id}/offerings", description: "Flyer offerings referencing a title (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?"], output: "FlyerOffering[]", side_effects: [] }
  - { method: GET, path: "/club/titles/{id}/fair-titles", description: "Fair-title rows referencing a title (FK reverse)", roles: [ClubAdmin, SchoolAdmin], code: 200, input: ["limit?", "offset?"], output: "FairTitle[]", side_effects: [] }
  - { method: GET, path: "/club/titles/{id}/donation-requests", description: "Donation requests referencing a title (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Donor], code: 200, input: ["limit?", "offset?"], output: "DonationRequest[]", side_effects: [] }
  - { method: GET, path: "/club/titles/{id}/redemptions", description: "Redemptions referencing a title (FK reverse)", roles: [ClubAdmin], code: 200, input: ["limit?", "offset?"], output: "Redemption[]", side_effects: [] }
  - { method: GET, path: "/club/flyer-cycles/{id}/class-orders", description: "Class orders on a cycle (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?", "status?"], output: "ClassOrder[]", side_effects: [] }
  - { method: GET, path: "/club/offerings/{id}/lines", description: "Order lines referencing an offering (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }

  # ---- Promotions ----
  - { method: POST, path: "/club/promotions", description: "Create a promotion (bonus multiplier or per-title incentive)", roles: [ClubAdmin], code: 201, input: [name, kind, "grade_band?", "title_id?", "multiplier_bp?", "bonus_points_per_unit?", starts_on, ends_on], output: Promotion, side_effects: [] }
  - { method: GET, path: "/club/promotions", description: "List promotions", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?", "kind?", "status?"], output: "Promotion[]", side_effects: [] }
  - { method: GET, path: "/club/promotions/{id}", description: "Get one promotion", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: [], output: Promotion, side_effects: [] }

  # ---- Flyer cycles & offerings ----
  - { method: POST, path: "/club/flyer-cycles", description: "Create a DRAFT monthly flyer cycle for a school+band+month", roles: [ClubAdmin], code: 201, input: [school_id, month, grade_band], output: FlyerCycle, side_effects: [] }
  - { method: GET, path: "/club/flyer-cycles/{id}", description: "Get one cycle", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent], code: 200, input: [], output: FlyerCycle, side_effects: [] }
  - { method: POST, path: "/club/flyer-cycles/{id}/offerings", description: "Add a title offering to a DRAFT cycle; pins flyer_price_cents", roles: [ClubAdmin], code: 201, input: [title_id], output: FlyerOffering, side_effects: ["club_price_derive pins flyer_price_cents", "offering_count += 1"] }
  - { method: GET, path: "/club/flyer-cycles/{id}/offerings", description: "List offerings of a cycle (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent], code: 200, input: ["limit?", "offset?"], output: "FlyerOffering[]", side_effects: [] }
  - { method: GET, path: "/club/offerings/{id}", description: "Get one offering", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent], code: 200, input: [], output: FlyerOffering, side_effects: [] }
  - { method: POST, path: "/club/flyer-cycles/{id}/publish", description: "Publish a DRAFT cycle (gates: posture, >=1 offering, one-published-per-band)", roles: [ClubAdmin], code: 200, input: [], output: FlyerCycle, side_effects: ["fair_overlap recomputed on offerings", "Title.fair_count_used incremented for overlapped offerings"] }
  - { method: POST, path: "/club/flyer-cycles/{id}/close", description: "Close a cycle (PUBLISHED->CLOSED requires no OPEN orders)", roles: [ClubAdmin], code: 200, input: [], output: FlyerCycle, side_effects: ["Title.fair_count_used decremented for offerings with fair_overlap == true (cycle no longer counts against TITLE_FAIR_OVERLAP_LIMIT)"] }

  # ---- Class orders & lines ----
  - { method: POST, path: "/club/class-orders", description: "Open a class order on a PUBLISHED cycle for a teacher of that school+band", roles: [Teacher], code: 201, input: [cycle_id, teacher_id], output: ClassOrder, side_effects: [] }
  - { method: GET, path: "/club/class-orders/{id}", description: "Get one class order with all computed aggregates", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent], code: 200, input: [], output: ClassOrder, side_effects: [] }
  - { method: GET, path: "/club/class-orders/{id}/lines", description: "List lines of an order (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher, Parent], code: 200, input: ["limit?", "offset?", "status?"], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/club/class-orders/{id}/lines", description: "Add an order line (parent online or teacher entry) to an OPEN order", roles: [Teacher, Parent], code: 201, input: [offering_id, student_name, submitted_by, qty], output: OrderLine, side_effects: ["ClassOrder aggregates recomputed (subtotal, rewardable subtotal, discount via tier_discount_band, net, shipping via shipping_fee_resolve, awarded_* previews via reward_points_base)", "increments ClassOrder.version by 1"] }
  - { method: PATCH, path: "/club/order-lines/{id}", description: "Change qty on a line of an OPEN order", roles: [Teacher, Parent], code: 200, input: [qty], output: OrderLine, side_effects: ["ClassOrder aggregates recomputed", "increments ClassOrder.version by 1"] }
  - { method: DELETE, path: "/club/order-lines/{id}", description: "Cancel a line on an OPEN order (Parent restricted to own PARENT_ONLINE lines)", roles: [Teacher, Parent], code: 200, input: [], output: OrderLine, side_effects: ["line -> CANCELLED", "ClassOrder aggregates recomputed", "increments ClassOrder.version by 1"] }
  - { method: POST, path: "/club/class-orders/{id}/submit", description: "Submit the consolidated class order; awards points (OCC-guarded)", roles: [Teacher], code: 200, input: [expected_class_order_version], output: ClassOrder, side_effects: ["reward_points_base AWARDED variant credits teacher", "points_status -> AWARDED", "royalty accrual per title_royalty_accrue (may flip licenses)", "suspended-license lines -> BACKORDERED", "ship_status derived", "increments ClassOrder.version by 1"] }
  - { method: POST, path: "/club/class-orders/{id}/cancel", description: "Cancel an OPEN or SUBMITTED (ship PENDING) order; clawback on SUBMITTED path", roles: [Teacher], code: 200, input: [], output: ClassOrder, side_effects: ["lines -> CANCELLED", "reward_points_base CLAWED_BACK variant on SUBMITTED path", "royalty reversal on SUBMITTED path", "increments ClassOrder.version by 1"] }

  # ---- Book fairs ----
  - { method: POST, path: "/club/book-fairs", description: "Schedule a book fair at a school (half-open window; overlap rejected)", roles: [SchoolAdmin, ClubAdmin], code: 201, input: [school_id, start_date, end_date], output: BookFair, side_effects: [] }
  - { method: GET, path: "/club/book-fairs/{id}", description: "Get one fair", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: [], output: BookFair, side_effects: [] }
  - { method: GET, path: "/club/book-fairs/{id}/titles", description: "List fair titles (FK reverse)", roles: [ClubAdmin, SchoolAdmin, Teacher], code: 200, input: ["limit?", "offset?"], output: "FairTitle[]", side_effects: [] }
  - { method: POST, path: "/club/book-fairs/{id}/titles", description: "Add a title to the fair (fair-overlap cap enforced)", roles: [SchoolAdmin, ClubAdmin], code: 201, input: [title_id], output: FairTitle, side_effects: ["fair_overlap recomputed on offerings of PUBLISHED cycles at the school whose month intersects the fair window", "Title.fair_count_used recomputed against the cap"] }
  - { method: POST, path: "/club/book-fairs/{id}/cancel", description: "Cancel a SCHEDULED or ACTIVE fair", roles: [SchoolAdmin, ClubAdmin], code: 200, input: [], output: BookFair, side_effects: ["fair_count_used decremented", "School.active_fair_id recomputed", "offering fair_overlap recomputed"] }

  # ---- Donations ----
  - { method: POST, path: "/club/donation-requests", description: "Teacher at a low-income school requests donated copies of a title", roles: [Teacher, SchoolAdmin], code: 201, input: [school_id, teacher_id, title_id, qty_requested], output: DonationRequest, side_effects: [] }
  - { method: GET, path: "/club/donation-requests/{id}", description: "Get one donation request", roles: [ClubAdmin, SchoolAdmin, Teacher, Donor], code: 200, input: [], output: DonationRequest, side_effects: [] }
  - { method: POST, path: "/club/donation-requests/{id}/match", description: "Donor matches the full requested quantity", roles: [Donor], code: 200, input: [], output: DonationRequest, side_effects: ["qty_matched = qty_requested"] }
  - { method: POST, path: "/club/donation-requests/{id}/fulfill", description: "Fulfill a matched request: creates a donation-funded class order shipment to the school", roles: [ClubAdmin], code: 200, input: [], output: DonationRequest, side_effects: ["donation-funded ClassOrder created (SUBMITTED, points UNAWARDED)", "Teacher.donated_books_received += qty_matched", "royalty accrual on Title"] }
  - { method: POST, path: "/club/donation-requests/{id}/cancel", description: "Cancel an OPEN donation request", roles: [SchoolAdmin, ClubAdmin], code: 200, input: [], output: DonationRequest, side_effects: [] }

  # ---- Redemptions ----
  - { method: POST, path: "/club/redemptions", description: "Teacher creates a PENDING redemption (BOOK by title points_cost, or SUPPLY at flat unit cost)", roles: [Teacher], code: 201, input: [teacher_id, kind, "title_id?", qty], output: Redemption, side_effects: [] }
  - { method: GET, path: "/club/redemptions/{id}", description: "Get one redemption", roles: [ClubAdmin, Teacher], code: 200, input: [], output: Redemption, side_effects: [] }
  - { method: POST, path: "/club/redemptions/{id}/confirm", description: "Confirm a PENDING redemption; debits points", roles: [Teacher], code: 200, input: [], output: Redemption, side_effects: ["Teacher.points_balance -= points_cost", "points_redeemed_total += points_cost", "PointsLedger REDEEM entry", "BOOK redemptions accrue royalty"] }
  - { method: POST, path: "/club/redemptions/{id}/cancel", description: "Cancel a PENDING redemption (no points movement)", roles: [Teacher], code: 200, input: [], output: Redemption, side_effects: [] }

  # ---- Test-driving ops endpoints ----
  - { method: POST, path: "/club/_clock/set_current_utc", description: "Set the logical clock (ISO8601). Server startup default is exactly 2026-09-01T00:00:00Z before any set call; never falls back to wall-clock. Advancing the clock fires scheduled transitions (fair ACTIVATE/COMPLETE, promotion EXPIRE, active_fair_id recompute).", roles: [ClubAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["BookFair SCHEDULED->ACTIVE / ACTIVE->COMPLETED transitions as window boundary crossed", "Promotion ACTIVE->EXPIRED when ends_on <= clock date", "School.active_fair_id recomputed"] }
  - { method: POST, path: "/club/_ops/run-ops", description: "Run the monthly ops epoch: points_expiry_sweep across all teachers; returns per-teacher expiry summary", roles: [ClubAdmin], code: 200, input: [], output: { expired_total_points: integer, teachers_affected: integer }, side_effects: ["points_expiry_sweep", "PointsLedger EXPIRE entries", "Teacher.points_expired_total/points_balance updated"] }
  - { method: POST, path: "/club/_ops/run-shipping", description: "Run the shipping sweep: ships BACKORDERED lines whose titles are license-ACTIVE on SUBMITTED orders; advances ship_status", roles: [ClubAdmin], code: 200, input: [], output: { shipped_line_count: integer, orders_touched: integer }, side_effects: ["OrderLine BACKORDERED->ACTIVE for ACTIVE-license titles", "ClassOrder.ship_status re-derived (PENDING->PARTIAL/SHIPPED, PARTIAL->SHIPPED)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint per §1.5 roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (checked left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-referenced FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed field: bad enum, qty < 1, bad date, duplicate email/isbn, missing required field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state (CANCELLED/CLOSED/FULFILLED/COMPLETED)" }
  - { id: ERR_SCHOOL_RESTRICTED, http: 409, condition: "School.posture == RESTRICTED blocks the operation" }
  - { id: ERR_LICENSE_SUSPENDED, http: 409, condition: "Title.license_status == SUSPENDED blocks offering add, donation create/match, BOOK redemption confirm" }
  - { id: ERR_ROYALTY_CAP_INVALID, http: 422, condition: "Proposed royalty_cap_cents below current royalty_accrued_cents" }
  - { id: ERR_GRADE_BAND_MISMATCH, http: 422, condition: "Teacher/title grade band does not match the flyer cycle's band" }
  - { id: ERR_FORMAT_NOT_ALLOWED, http: 422, condition: "Offering requires PAPERBACK or CLUB_PAPERBACK format" }
  - { id: ERR_CYCLE_ALREADY_PUBLISHED, http: 409, condition: "Another PUBLISHED cycle exists for the same (school, grade_band)" }
  - { id: ERR_EMPTY_CYCLE, http: 422, condition: "Publish attempted with offering_count == 0" }
  - { id: ERR_FAIR_OVERLAP, http: 409, condition: "BookFair window intersects another fair at the same school (half-open; touching endpoints allowed)" }
  - { id: ERR_TITLE_OVERLAP_CAP, http: 409, condition: "Title.fair_count_used already >= TITLE_FAIR_OVERLAP_LIMIT (2)" }
  - { id: ERR_PROMO_WINDOW_INVALID, http: 422, condition: "ends_on <= starts_on, or ends_on <= current clock date" }
  - { id: ERR_PROMO_SHAPE_INVALID, http: 422, condition: "Promotion kind/field combination invalid (multiplier vs title incentive shape)" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "Teacher.points_balance < Redemption.points_cost at confirm" }
  - { id: ERR_POINTS_BALANCE_NEGATIVE, http: 422, condition: "Clawback on cancel would drive Teacher.points_balance below 0" }
  - { id: ERR_NOT_LOW_INCOME, http: 422, condition: "DonationRequest created for a school without low_income_program" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Actor does not own the target (teacher mismatch; parent cancelling a TEACHER-submitted line)" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "Line mutation requires parent ClassOrder.status == OPEN on a PUBLISHED cycle" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_ORDER_HAS_SHIPPED, http: 409, condition: "Cancel-from-SUBMITTED requires ship_status == PENDING" }
  - { id: ERR_ORDER_EMPTY, http: 422, condition: "Submit requires at least one non-CANCELLED line" }
  - { id: ERR_CYCLE_NOT_PUBLISHED, http: 409, condition: "ClassOrder creation or submit requires the cycle PUBLISHED" }
  - { id: ERR_DONATION_NOT_MATCHED, http: 409, condition: "Fulfill attempted on a request not in MATCHED status" }
  - { id: ERR_FAIR_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on COMPLETED fair" }
  - { id: ERR_REDEMPTION_SHAPE_INVALID, http: 422, condition: "kind == BOOK requires title_id; kind == SUPPLY forbids title_id" }
  - { id: ERR_ENROLLMENT_EXISTS, http: 409, condition: "School already has an ACTIVE ProgramEnrollment" }

# =============================================================================
# Global derived constants (referenced by §1.3/§1.4)
# =============================================================================
constants:
  TITLE_FAIR_OVERLAP_LIMIT: 2
  CENTS_PER_POINT: 100
  SHIPPING_FLAT_CENTS: 750
  FREE_SHIP_MIN_CENTS: 2500
  CLUB_PRICE_FACTOR_NUM: 70
  CLUB_PRICE_FACTOR_DEN: 100
  ROYALTY_PER_UNIT_CENTS: 90
  POINTS_EXPIRY_MONTHS: 12
  SUPPLY_UNIT_POINTS_COST: 200
  CLOCK_DEFAULT_ISO: "2026-09-01T00:00:00Z"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClubAdmin
    description: "Club platform operator: schools, titles/licensing, promotions, flyer cycles, ops runs, clock"
    identity: "opaque"
    exclusive_operations: ["school CRUD + program suspend/reinstate", "title acquisition/renegotiation", "promotion management", "flyer cycle create/publish/close + offerings", "ops runs (shipping, expiry)", "logical clock", "donation fulfill"]
    shared_operations: ["read any resource", "book fair schedule/cancel", "donation cancel"]
  - name: SchoolAdmin
    description: "School staff: book fairs, teacher registration, donation oversight for their school"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["book fair schedule/cancel/title-add", "teacher registration", "read school-scoped resources", "donation request create/cancel"]
  - name: Teacher
    description: "Classroom teacher: class orders, lines, submit/cancel, redemptions, donation requests"
    identity: "entity_backed:Teacher"
    exclusive_operations: ["class order create/submit/cancel", "redemption create/confirm/cancel"]
    shared_operations: ["order line create/update/cancel", "donation request create", "read flyers/offerings/own ledger"]
  - name: Parent
    description: "Parent/guardian submitting online orders into a teacher's class order"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["order line create/update/cancel (own PARENT_ONLINE lines only)", "read offerings/orders"]
  - name: Donor
    description: "Sponsor matching donation requests"
    identity: "opaque"
    exclusive_operations: ["donation match"]
    shared_operations: ["read donation requests/schools/titles"]
