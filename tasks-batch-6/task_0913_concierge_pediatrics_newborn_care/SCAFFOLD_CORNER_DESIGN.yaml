            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "DTAP", administered_date: "2026-05-13" }
              as: PracticeAdmin
              captures: { d1: "$.data.id", d1_validity: "$.data.validity" }
          trigger:
            - call: "POST /peds/immunization-doses"
