              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/allowance-accounts/${acct_id}/true-up"
              payload: {}
              as: RegulatoryReviewer
          assert:
            - "OperatingHour.${first_hour_id}.heat_input_mmbtu == 1388.889 and OperatingHour.${first_hour_id}.so2_mass_lbs == 4980.0"
