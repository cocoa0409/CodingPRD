            - "EducationCampaign.${cp_id}.status == RUNNING, effectiveness_score == null, alternate_effectiveness_score == null, version == ${cp_v_running}"
            - "InspectionStation.${st_id}.campaign_allocated_cents == 100000 - the failed evaluation leaves allocations alone"

      - name: priority_ordering_evaluation_window_checked_before_the_denominator
        claim_type: priority_ordering
        grounds:
          - validations.priority_33
          - validations.priority_36
          - errors.ERR_EVALUATION_WINDOW_NOT_ENDED
        distinguishing_aspect: "A RUNNING campaign evaluated mid-window with no qualifying inspections violates priority 33 and priority 36 at once; the lower-numbered temporal rule wins, so the answer is 409 ERR_EVALUATION_WINDOW_NOT_ENDED and never 422 ERR_NO_INSPECTIONS_IN_WINDOW."
        test_recipe:
          setup:
            - "Campaign launched over [2026-08-01T00:00:00Z, 2026-08-31T00:00:00Z) with one OPEN station and no inspection records at all."
            - "Clock left at 2026-08-15T00:00:00Z, inside the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /education-campaigns"
              payload: { name: "Clean Drain Dry 2026", target_water_body_id: "${wb_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-31T00:00:00Z", budget_cents: 100000, evaluation_method: "CONTROL_CORRIDOR" }
              as: ProgramAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /education-campaigns/${cp_id}/status"
              payload: { target_status: "RUNNING" }
              as: ProgramAdmin
              captures: { cp_v_running: $.data.version }
            - call: "POST /_clock/set_current_utc"
