            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2321", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "AR" }, as: SafetyManager, captures: { i_id: $.data.id } }
