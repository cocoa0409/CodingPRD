  # ==========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: amendment_rent_change_cascade
        grounds:
          - state_machines.Amendment.APPROVED_to_APPLIED
          - calculations.escalated_rent_for_period
          - calculations.annual_rent_total
        distinguishing_aspect: |
          Depth-3 chain: Amendment.apply (kind=RENT_CHANGE) -> RentScheduleLine.base_rent_cents updated for future periods -> each line's effective_rent_cents recomputed via escalated_rent_for_period -> Lease.cached_annual_rent_cents recomputed via annual_rent_total. Each link caused by previous.
        test_recipe:
          setup:
            - "ACTIVE Lease L1 with two RentScheduleLines (past line and future line)"
            - "EscalationStep pct_bps=1000 applied to future line"
            - "Logical clock 2027-06-01; FY ends 12"
            - "Amendment kind=RENT_CHANGE approved with new_base_rent_annual_cents=2400000 effective 2027-07-01"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: FIXED_PCT, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/escalation-steps"
              payload: { step_index: 1, kind: FIXED_PCT, pct_bps: 1000, effective_on: "2027-07-01" }
              as: PortfolioManager
              captures: { step_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2027-07-01", base_rent_cents: 600000 }
              as: PortfolioManager
              captures: { line_past: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-07-01", period_end: "2028-01-01", base_rent_cents: 600000, escalation_step_id: "${step_id}" }
              as: PortfolioManager
              captures: { line_future: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 0 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b_id: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b_id}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { lease_v_pre: $.data.version, rent_pre: $.data.cached_annual_rent_cents }
            - call: "POST /lease-admin/leases/${lease_id}/amendments"
              payload: { kind: RENT_CHANGE, effective_date: "2027-07-01", new_base_rent_annual_cents: 2400000 }
              as: PortfolioManager
              captures: { amend_id: $.data.id }
            - call: "POST /lease-admin/amendments/${amend_id}/approve"
              payload: { expected_lease_version: "${lease_v_pre}" }
              as: PortfolioManager
          trigger:
