      - name: forecast_variants_and_frozen_adequacy_tier
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: forecast_adequacy_tier_frozen_before_uplift
          rationale: "That §1.8 instance runs EXPECTED_LOSS and STRESSED over the same book (pd 900 vs 2250, gross 253260 vs 633150, adequacy 9871 vs 3949) and pins the frozen-tier ordering, covering both the dual-variant and the constraint_propagation fixed-point claims."
