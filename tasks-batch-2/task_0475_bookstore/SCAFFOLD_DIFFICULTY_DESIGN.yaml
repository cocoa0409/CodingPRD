            - "response.data.error_id == ERR_EVENT_SOLD_OUT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fulfill_requires_payment_paid_cross_axis_guard
        grounds:
          - state_machines.SalesOrder.RESERVED_to_FULFILLED
          - entities.SalesOrder.fields.payment_status
          - entities.SalesOrder.fields.fulfillment_status
        distinguishing_aspect: |
          The fulfillment axis transition RESERVED->FULFILLED is guarded by the payment axis state
          (payment_status == PAID). Reserving an UNPAID order then fulfilling fails ERR_INVALID_STATE.
          Entity pair: SalesOrder fulfillment-axis depends on SalesOrder payment-axis.
        test_recipe:
          setup:
            - "Member M, Title T with 1 AVAILABLE copy, Order O (UNPAID) reserved with one line q1."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m12@x.com", full_name: "M Twelve" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000014", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 1 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, v0: $.data.version }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v0}" }
              as: Bookseller
          trigger:
            - call: "POST /sales-orders/${o_id}/fulfill"
              payload: {}
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: publisher_return_submit_requires_returnable_title
        grounds:
          - state_machines.PublisherReturn.DRAFT_to_SUBMITTED
          - validations[priority=7]
          - entities.Title.fields.returnable
        distinguishing_aspect: |
          PublisherReturn DRAFT->SUBMITTED depends on the referenced Title.returnable == true. A return
          on a non-returnable title fails ERR_TITLE_NOT_RETURNABLE. Entity pair PublisherReturn->Title,
          different from instance 1's SalesOrder-internal pair.
        test_recipe:
          setup:
            - "Non-returnable Title T (returnable=false) with 5 AVAILABLE copies; DRAFT return R for q1."
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9780000000015", name: "T", list_price_cents: 1000, returnable: false }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 5 }
              as: InventoryManager
            - call: "POST /publisher-returns"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: InventoryManager
              captures: { r_id: $.data.id, rv0: $.data.version }
          trigger:
            - call: "POST /publisher-returns/${r_id}/submit"
              payload: { expected_publisher_return_version: "${rv0}" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_TITLE_NOT_RETURNABLE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stock_reservation_exhaustion_on_title_quota
        grounds:
          - state_machines.SalesOrder.OPEN_to_RESERVED
          - validations[priority=12]
          - entities.Title.fields.on_hand_qty
        distinguishing_aspect: |
          Title inventory is a finite quota; reserving order O1 occupies copies, leaving fewer
          AVAILABLE so O2's reserve collides with the depleted pool (count-based occupancy with
          NO buffer — exact remaining-count semantics). Resource entity: Title stock pool.
        test_recipe:
          setup:
            - "Title T with exactly 2 AVAILABLE copies. Member M. O1 (line q2) reserved -> 0 AVAILABLE. O2 (line q1) tries reserve."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m13@x.com", full_name: "M Thirteen" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000016", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 2 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o1_id: $.data.id, o1v: $.data.version }
            - call: "POST /sales-orders/${o1_id}/lines"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sales-orders/${o1_id}/reserve"
              payload: { expected_sales_order_version: "${o1v}" }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o2_id: $.data.id, o2v: $.data.version }
            - call: "POST /sales-orders/${o2_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sales-orders/${o2_id}/reserve"
              payload: { expected_sales_order_version: "${o2v}" }
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

      - name: event_seat_quota_overlap_on_capacity
        grounds:
          - validations[priority=13]
          - entities.AuthorEvent.fields.capacity
          - entities.AuthorEvent.fields.tickets_sold
        distinguishing_aspect: |
          AuthorEvent seats are a finite quota with aggregate-capacity interval semantics (tickets_sold
          vs capacity), distinct from instance 1's per-copy stock occupancy. Booking up to capacity
          succeeds; the booking that would push tickets_sold past capacity collides and fails. Resource
          entity: AuthorEvent (different from Title).
        test_recipe:
          setup:
            - "Clock default. Title T, future event E capacity 2, base 1000. Two members each book one seat (tickets_sold=2). Third member books."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m14a@x.com", full_name: "A" }
              as: Anonymous
              captures: { ma_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m14b@x.com", full_name: "B" }
              as: Anonymous
              captures: { mb_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m14c@x.com", full_name: "C" }
              as: Anonymous
              captures: { mc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000017", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /author-events"
              payload: { title_id: "${t_id}", name: "Two-seat", starts_at: "2026-05-01T18:00:00Z", capacity: 2, base_price_cents: 1000 }
              as: Bookseller
              captures: { e_id: $.data.id }
            - call: "POST /author-events/${e_id}/tickets"
              payload: { member_id: "${ma_id}" }
              as: Member
              as_user_id: "${ma_id}"
            - call: "POST /author-events/${e_id}/tickets"
              payload: { member_id: "${mb_id}" }
              as: Member
              as_user_id: "${mb_id}"
          trigger:
            - call: "POST /author-events/${e_id}/tickets"
              payload: { member_id: "${mc_id}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_EVENT_SOLD_OUT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_restores_store_credit_conserved
        grounds:
          - state_machines.SalesOrder.UNPAID_to_PAID
          - state_machines.SalesOrder.PAID_to_REFUNDED
          - entities.Member.fields.store_credit_cents
          - entities.CreditLedgerEntry.fields.delta_cents
        distinguishing_aspect: |
          Conserved quantity = Member.store_credit_cents (= sum of CreditLedgerEntry.delta_cents).
          Paying with credit_redeemed_cents=300 debits 300; refunding the order credits +300 back.
          INVARIANT: after pay+refund, store_credit_cents equals the pre-pay value (700 -> 400 -> 700).
        test_recipe:
          setup:
            - "Member M with store_credit_cents=700 (seeded via adjustment). Title T (list 1000), 1 AVAILABLE copy."
            - "Order O (credit_redeemed_cents=300) one line q1; pay debits 300 -> credit 400."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m15@x.com", full_name: "M Fifteen" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-adjustments"
              payload: { delta_cents: 700 }
              as: StoreAdmin
            - call: "POST /titles"
              payload: { isbn13: "9780000000018", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}", credit_redeemed_cents: 300 }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sales-orders/${o_id}/refund"
              payload: {}
              as: Bookseller
          assert:
            - "Member.${m_id}.store_credit_cents == 700"
            - "SalesOrder.${o_id}.payment_status == REFUNDED"
            - "SalesOrder.${o_id}.fulfillment_status == CANCELLED"

      - name: publisher_return_reject_restores_available_stock_conserved
        grounds:
          - state_machines.PublisherReturn.DRAFT_to_SUBMITTED
          - state_machines.PublisherReturn.SUBMITTED_to_REJECTED
          - entities.Title.fields.on_hand_qty
          - entities.StockItem.fields.state
        distinguishing_aspect: |
          Conserved quantity = Title.on_hand_qty (count of AVAILABLE StockItems), a different conserved
          quantity than instance 1's money. Submit reserves 2 of 5 copies (on_hand 5->3); reject releases
          them back (on_hand 3->5). INVARIANT: on_hand_qty returns to its pre-submit value and no copy is
          RETURNED_TO_PUBLISHER.
        test_recipe:
          setup:
            - "Returnable Title T with 5 AVAILABLE copies (on_hand 5). DRAFT return R quantity 2."
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9780000000019", name: "T", list_price_cents: 1000, returnable: true }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 5 }
              as: InventoryManager
            - call: "POST /publisher-returns"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: InventoryManager
              captures: { r_id: $.data.id, rv0: $.data.version }
            - call: "POST /publisher-returns/${r_id}/submit"
              payload: { expected_publisher_return_version: "${rv0}" }
              as: InventoryManager
          trigger:
            - call: "POST /publisher-returns/${r_id}/reject"
              payload: {}
              as: InventoryManager
          assert:
            - "PublisherReturn.${r_id}.state == REJECTED"
            - "PublisherReturn.${r_id}.credit_total_cents == 0"
            - "Title.${t_id}.on_hand_qty == 5"
