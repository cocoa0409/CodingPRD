              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-WITHDRAWN", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/withdraw-offer"
              payload: {}
              as: GrowerRelationsManager
              captures: { withdrawn_version: $.data.version }
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
              captures: { e1: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/counter"
              payload: { counter_base_price_per_ton_cents: 520000 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/withdraw-offer"
              payload: {}
              as: GrowerRelationsManager
              captures: { e4: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/settlement-close"
              payload: {}
              as: GrowerRelationsManager
              captures: { e5: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/termination-notice"
              payload: { effective_at: "2027-01-01T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { e6: $.data.error_id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block2_id}" }
