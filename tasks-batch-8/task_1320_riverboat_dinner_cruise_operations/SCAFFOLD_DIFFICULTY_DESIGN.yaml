# =============================================================================
# Task 1320 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (Booking credit money vs GalleyProvisionOrder covers).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: weather_credit_provisional_vs_final_diverge
        grounds:
          - calculations.weather_credit
          - state_machines.CruiseInstance.SCHEDULED_to_CANCELLED
          - state_machines.WeatherEvent.CANCELLATION_ISSUED_to_CREDITS_SETTLED
        distinguishing_aspect: |
          Same booking row yields two different credit amounts: the provisional
          variant (no rebate, no fee) produces 36206 while the final variant
          (rebate +1200 for 4 PLACED covers, fee -450) produces 36956 — a
          divergence on the Booking/Customer money domain.
        test_recipe:
          setup:
            - "Vessel cap 100; STANDARD tier base 8900, load 2.5, bar 4200"
            - "Cruise departs 2026-07-04T19:00:00Z (PEAK season, holiday) "
            - "Clock at 2026-07-03T13:00:00Z -> hours_notice = 30 -> 75% tier"
            - "Booking party_size 4, PAID; total = round(35600*0.95)=33820 -> *1.25=42275 -> +4*1500 = 48275"
            - "Provision order PLACED with provisional_covers 4"
            - "Weather event CANCELLATION_REQUIRED covering depart_at; cruise weather-cancelled"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-07-04T19:00:00Z", return_at: "2026-07-04T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "ana@x.com", full_name: "Ana" }, as: OperationsManager, captures: { cust_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_id}", party_size: 4, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { booking_id: $.data.id } }
            - { call: "POST /bookings/${booking_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /cruises/${cruise_id}/provision-orders", payload: {}, as: GalleyManager, captures: { order_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/provision-orders/${order_id}/place", payload: {}, as: GalleyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-03T13:00:00Z" }, as: OperationsManager }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-07-04T00:00:00Z", window_end: "2026-07-05T00:00:00Z" }, as: OperationsManager, captures: { wev_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/weather-cancel", payload: {}, as: OperationsManager }
          trigger:
            - call: "POST /weather-events/${wev_id}/settle-credits"
              payload: {}
              as: OperationsManager
          assert:
            - "CruiseCredit for Booking.${booking_id}.amount_cents == 36206 (provisional, 75% of 48275)"
            - "CruiseCredit.final_amount_cents == 36956 (36206 + 4*300 rebate - 450 fee)"
            - "Customer.${cust_id}.credit_balance_cents == 36956 after settlement (SETTLED credits count at final_amount_cents)"
      - name: galley_covers_forward_vs_chronological_diverge
        grounds:
          - calculations.galley_provisioning
          - state_machines.GalleyProvisionOrder.PLACED_to_SETTLED
        distinguishing_aspect: |
          The provisional variant (forward-looking reservation counts incl.
          PENDING) yields 6 covers while the final chronological variant (actual
          boarded passengers + confirmed crew) yields 4 — a divergence on the
          GalleyProvisionOrder covers domain, disjoint from Rule 1's money domain.
        test_recipe:
          setup:
            - "Cruise cap 100, STANDARD tier; bookings: A party4 PAID/CONFIRMED, B party2 left PENDING/RESERVED (never paid)"
            - "Provision order placed: provisional = 4 + 2 = 6"
            - "Manifest frozen; boarding opened; only A's 4 passengers check in; 1 BARTENDER assignment CONFIRMED (cert valid)"
            - "Cruise departs and completes: final = 4 boarded + 1 crew = 5... see assert for pinned value"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
            - { call: "POST /customers", payload: { email: "b@x.com", full_name: "B" }, as: OperationsManager, captures: { cust_b: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_b}", party_size: 2, expected_cruise_version: "${cruise_v2}" }, as: Customer, as_user_id: "${cust_b}", captures: { bk_b: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/provision-orders", payload: {}, as: GalleyManager, captures: { order_id: $.data.id, prov_covers: $.data.provisional_covers } }
            - { call: "POST /cruises/${cruise_id}/provision-orders/${order_id}/place", payload: {}, as: GalleyManager }
            - { call: "POST /staff-members", payload: { full_name: "Tom", role_code: "BARTENDER", alcohol_cert_expires_at: "2027-01-01T00:00:00Z" }, as: OperationsManager, captures: { staff_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments", payload: { staff_member_id: "${staff_id}", assigned_role: "BARTENDER" }, as: OperationsManager, captures: { asg_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments/${asg_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "P1", date_of_birth: "1990-01-01" }, as: Customer, as_user_id: "${cust_a}", captures: { p1: $.data.id } }
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "P2", date_of_birth: "1990-01-02" }, as: Customer, as_user_id: "${cust_a}", captures: { p2: $.data.id } }
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "P3", date_of_birth: "1990-01-03" }, as: Customer, as_user_id: "${cust_a}", captures: { p3: $.data.id } }
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "P4", date_of_birth: "1990-01-04" }, as: Customer, as_user_id: "${cust_a}", captures: { p4: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/manifest/freeze", payload: {}, as: Captain }
            - { call: "POST /cruises/${cruise_id}/open-boarding", payload: {}, as: OperationsManager }
            - { call: "POST /bookings/${bk_a}/passengers/${p1}/check-in", payload: {}, as: DockAttendant }
            - { call: "POST /bookings/${bk_a}/passengers/${p2}/check-in", payload: {}, as: DockAttendant }
            - { call: "POST /bookings/${bk_a}/passengers/${p3}/check-in", payload: {}, as: DockAttendant }
            - { call: "POST /bookings/${bk_a}/passengers/${p4}/check-in", payload: {}, as: DockAttendant }
            - { call: "POST /cruises/${cruise_id}/depart", payload: {}, as: Captain }
          trigger:
            - call: "POST /cruises/${cruise_id}/complete"
              payload: {}
              as: Captain
          assert:
            - "GalleyProvisionOrder.${order_id}.provisional_covers == 6 (4 PAID + 2 PENDING, forward-looking)"
            - "GalleyProvisionOrder.${order_id}.final_covers == 5 (4 boarded + 1 CONFIRMED crew, chronological)"
            - "Booking.${bk_b}.booking_status == RESERVED (never paid; depart NO_SHOW sweep touches only CONFIRMED bookings)"
            - "Booking.${bk_a}.booking_status == BOARDED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # (a) ticket_pricing: >=3 inputs, non-linear tier/multiplier interaction.
  # (b) bar_package_pricing: nested rounding order pinned (per-line then sum).
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_pricing_tiered_seasonal_holiday_stack
        grounds:
          - calculations.ticket_pricing
          - entities.CruiseInstance.fields.season
          - entities.CruiseInstance.fields.is_holiday
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — party-size tier
          (5% at >=4), PEAK multiplier 1.25, holiday premium 1500/person applied
          in pinned order; party of 4 on 2026-07-04 yields exactly 48275, while
          the same party one week earlier (PEAK, non-holiday) yields 42275.
        test_recipe:
          setup:
            - "Vessel cap 100; STANDARD tier base 8900"
            - "Cruise H on 2026-07-04 (PEAK + holiday); cruise N on 2026-06-27 (PEAK, non-holiday)"
            - "Clock default 2026-08-01 is AFTER both dates — booking does not validate depart_at vs clock, only cruise status, so setup is valid"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-07-04T19:00:00Z", return_at: "2026-07-04T22:00:00Z" }, as: OperationsManager, captures: { cruise_h: $.data.id, cruise_h_v: $.data.version } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-06-27T19:00:00Z", return_at: "2026-06-27T22:00:00Z" }, as: OperationsManager, captures: { cruise_n: $.data.id, cruise_n_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - { call: "POST /cruises/${cruise_h}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${cruise_h_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_h: $.data.id } }
            - { call: "POST /cruises/${cruise_n}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${cruise_n_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_n: $.data.id } }
          assert:
            - "CruiseInstance.${cruise_h}.season == PEAK and is_holiday == true"
            - "CruiseInstance.${cruise_n}.season == PEAK and is_holiday == false"
            - "Booking.${bk_h}.booking_total_cents == 48275"
            - "Booking.${bk_n}.booking_total_cents == 42275"
      - name: bar_package_per_line_rounding_order
        grounds:
          - calculations.bar_package_pricing
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned per-line-then-multiply. With
          bar_package_price_cents = 4199 and 3 packages, per-line rounding gives
          4199 + round(4199*0.18)=756 -> 4955/pkg -> 14865 total; the forbidden
          sum-then-round order would give 14864 — exactly one cent apart.
        test_recipe:
          setup:
            - "Vessel cap 100; tier with bar_package_price_cents 4199"
            - "BARTENDER with valid cert assigned+CONFIRMED so bar_service_enabled == true at pay"
            - "Cruise 2026-08-10 (PEAK, non-holiday)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "PREMIUM", base_price_cents: 12000, galley_load_per_cover: 3.0, bar_package_price_cents: 4199 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /staff-members", payload: { full_name: "Tom", role_code: "BARTENDER", alcohol_cert_expires_at: "2027-01-01T00:00:00Z" }, as: OperationsManager, captures: { staff_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments", payload: { staff_member_id: "${staff_id}", assigned_role: "BARTENDER" }, as: OperationsManager, captures: { asg_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments/${asg_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 3, bar_package_count: 3, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
          trigger:
            - call: "POST /bookings/${bk_a}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
          assert:
            - "Booking.${bk_a}.bar_package_total_cents == 14865 (per-line rounding pinned)"
            - "Booking.${bk_a}.payment_status == PAID"
            - "CruiseInstance.${cruise_id}.bar_service_enabled == true"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: two machines on DIFFERENT entities.
  # Booking: parallel dimensions (payment_status x booking_status).
  # CharterInquiry: cyclic negotiation QUOTED -> COUNTERED -> QUOTED.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_payment_and_boarding_dimensions
        grounds:
          - state_machines.Booking
          - entities.Booking.fields.payment_status
          - entities.Booking.fields.booking_status
        distinguishing_aspect: |
          Booking carries two independent state axes: payment_status
          (PENDING->PAID->REFUND_PENDING->CREDITED) evolves independently of
          booking_status (RESERVED->CONFIRMED->BOARDED); a weather-cancel moves
          ONLY the payment axis to REFUND_PENDING while booking_status goes to
          CANCELLED, proving the dimensions are parallel rather than one pipeline.
        test_recipe:
          setup:
            - "Cruise cap 100 STANDARD; booking party2 PAID/CONFIRMED"
            - "Weather event covering depart; clock 30h before departure"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T13:00:00Z" }, as: OperationsManager }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev_id: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/weather-cancel"
              payload: {}
              as: OperationsManager
          assert:
            - "Booking.${bk_a}.payment_status == REFUND_PENDING (payment axis advanced)"
            - "Booking.${bk_a}.booking_status == CANCELLED (booking axis on its own terminal path)"
            - "The two axes moved independently — payment REFUND_PENDING is non-terminal while booking CANCELLED is terminal"
      - name: charter_inquiry_cyclic_negotiation_rounds
        grounds:
          - state_machines.CharterInquiry.QUOTED_to_COUNTERED
          - state_machines.CharterInquiry.COUNTERED_to_QUOTED
          - calculations.charter_quote
        distinguishing_aspect: |
          CharterInquiry cycles QUOTED -> COUNTERED -> QUOTED (a true cycle):
          after quote, counter, re-quote the entity returns to QUOTED with
          quote_round == 3 and refreshed quoted_total_cents — a loop no linear
          pipeline can express.
        test_recipe:
          setup:
            - "Vessel cap 60 (MEDIUM charter tier); cruise 2026-08-10 PEAK"
            - "CharterInquiry opened in DRAFT"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 60, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp" }, as: OperationsManager, captures: { cust_c: $.data.id } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cruise_id}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { inq_id: $.data.id, inq_v: $.data.version } }
          trigger:
            - { call: "POST /charter-inquiries/${inq_id}/quote", payload: { expected_inquiry_version: "${inq_v}" }, as: CharterSalesAgent, captures: { q1: $.data.quoted_total_cents, inq_v2: $.data.version } }
            - { call: "POST /charter-inquiries/${inq_id}/counter", payload: {}, as: Customer, as_user_id: "${cust_c}", captures: { inq_v3: $.data.version } }
            - { call: "POST /charter-inquiries/${inq_id}/quote", payload: { expected_inquiry_version: "${inq_v3}" }, as: CharterSalesAgent, captures: { q2: $.data.quoted_total_cents } }
          assert:
            - "CharterInquiry.${inq_id}.status == QUOTED after cycling QUOTED->COUNTERED->QUOTED"
            - "CharterInquiry.${inq_id}.quote_round == 3"
            - "quoted_total_cents == 775000 both rounds (620000 MEDIUM base * 1.25 PEAK, deterministic re-quote)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers,
  # one depth >= 3, other depth >= 2.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: weather_cancel_cascade_depth4
        grounds:
          - state_machines.CruiseInstance.SCHEDULED_to_CANCELLED
          - state_machines.Booking."payment_status=PAID"_to_"payment_status=REFUND_PENDING"
          - state_machines.WeatherEvent.DECLARED_to_CANCELLATION_ISSUED
          - state_machines.ParkingPass.RESERVED_to_RELEASED
          - entities.Dock.fields.parking_in_use
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (POST weather-cancel): cruise CANCELLED
          -> booking payment REFUND_PENDING -> CruiseCredit ISSUED (link 2, caused
          by booking transition) -> WeatherEvent CANCELLATION_ISSUED (link: the
          cruise transition drives the event) and ParkingPass RELEASED -> Dock.
          parking_in_use decremented (link 4: the pass transition itself mutates
          the Dock aggregate). Each hop is caused by the previous entity's
          mutation, not fan-out from the original call.
        test_recipe:
          setup:
            - "Cruise cap 100; booking A party2 PAID; provision order PLACED (covers 2)"
            - "Parking pass RESERVED on home dock (parking_in_use 1)"
            - "BARTENDER assigned CONFIRMED"
            - "Weather event covering depart; clock 30h before"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /cruises/${cruise_id}/provision-orders", payload: {}, as: GalleyManager, captures: { order_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/provision-orders/${order_id}/place", payload: {}, as: GalleyManager }
            - { call: "POST /staff-members", payload: { full_name: "Tom", role_code: "BARTENDER", alcohol_cert_expires_at: "2027-01-01T00:00:00Z" }, as: OperationsManager, captures: { staff_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments", payload: { staff_member_id: "${staff_id}", assigned_role: "BARTENDER" }, as: OperationsManager, captures: { asg_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments/${asg_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /docks/${dock_id}/parking-passes", payload: { booking_id: "${bk_a}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { pass_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T13:00:00Z" }, as: OperationsManager }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev_id: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/weather-cancel"
              payload: {}
              as: OperationsManager
          assert:
            - "CruiseInstance.${cruise_id}.status == CANCELLED"
            - "Booking.${bk_a}.payment_status == REFUND_PENDING (hop 2)"
            - "CruiseCredit exists for booking with credit_status == ISSUED and amount_cents == 16688 (hop 3: 75% of 22250)"
            - "WeatherEvent.${wev_id}.status == CANCELLATION_ISSUED (driven by the cruise cancellation)"
            - "ParkingPass.${pass_id}.status == RELEASED and Dock.${dock_id}.parking_in_use == 0 (hop 4: pass transition decrements dock aggregate)"
            - "GalleyProvisionOrder.${order_id}.status == CANCELLED with restocking_rebate_cents == 600 (2 covers * 300)"
            - "StaffAssignment.${asg_id}.status == RELEASED"
      - name: charter_conversion_cascade_depth2
        grounds:
          - state_machines.CharterInquiry.ACCEPTED_to_CONVERTED
          - state_machines.Booking."booking_status=CONFIRMED"_to_"booking_status=CONVERTED_TO_CHARTER"
          - entities.Customer.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST charter convert): inquiry
          CONVERTED -> each existing booking flips CONVERTED_TO_CHARTER (hop 1)
          -> that booking's own transition issues a conversion CruiseCredit at
          88% of booking_total (hop 2, caused by the booking transition, not by
          the convert call directly).
        test_recipe:
          setup:
            - "Vessel cap 60 (MEDIUM); cruise 2026-08-10 PEAK"
            - "Booking A party4 PAID; total = round(35600*0.95)=33820 *1.25 = 42275 (non-holiday)"
            - "Inquiry DRAFT -> QUOTED -> ACCEPTED"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 60, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp" }, as: OperationsManager, captures: { cust_c: $.data.id } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cruise_id}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { inq_id: $.data.id, inq_v: $.data.version } }
            - { call: "POST /charter-inquiries/${inq_id}/quote", payload: { expected_inquiry_version: "${inq_v}" }, as: CharterSalesAgent }
            - { call: "POST /charter-inquiries/${inq_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_c}" }
          trigger:
            - call: "POST /charter-inquiries/${inq_id}/convert"
              payload: {}
              as: OperationsManager
          assert:
            - "CharterInquiry.${inq_id}.status == CONVERTED (hop 0)"
            - "Booking.${bk_a}.booking_status == CONVERTED_TO_CHARTER and payment_status == CREDITED (hop 1)"
            - "Conversion CruiseCredit for booking == 37202 (hop 2: round(42275*0.88))"
            - "CruiseInstance.${cruise_id}.charter_booking_id non-null and reserved_covers == 60"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two dual-failure scenarios on
  # DIFFERENT error-category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_capacity_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Pair (state, business_safety): a single open-boarding call violates
          BOTH priority-4 state (manifest not FROZEN would be priority 15, but
          here cruise already BOARDING -> ERR_INVALID_STATE at priority 4) AND
          would violate capacity — the state error MUST win because priority 4
          precedes priority 6/15.
        test_recipe:
          setup:
            - "Cruise cap 2; bookings fill capacity: A party1 PAID, B party1 PAID (reserved_covers == 2 == cap)"
            - "Manifest frozen; boarding opened (cruise BOARDING)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 2, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
            - { call: "POST /customers", payload: { email: "b@x.com", full_name: "B" }, as: OperationsManager, captures: { cust_b: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_b}", party_size: 1, expected_cruise_version: "${cruise_v2}" }, as: Customer, as_user_id: "${cust_b}", captures: { bk_b: $.data.id } }
            - { call: "POST /bookings/${bk_b}/pay", payload: {}, as: Customer, as_user_id: "${cust_b}" }
            - { call: "POST /cruises/${cruise_id}/manifest/freeze", payload: {}, as: Captain }
            - { call: "POST /cruises/${cruise_id}/open-boarding", payload: {}, as: OperationsManager }
          trigger:
            - call: "POST /cruises/${cruise_id}/open-boarding"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority-4 state beats any business_safety check — cruise already BOARDING)"
      - name: business_temporal_vs_business_constraint_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_DOCK_SLOT_CONFLICT]
          - errors[ERR_PARKING_FULL]
        distinguishing_aspect: |
          Pair (business_temporal, business_constraint): a dock-slot create that
          overlaps within the turnaround buffer (temporal, priority 8) on a dock
          whose parking pool is also full (constraint, priority 9) — the
          temporal error MUST win; a different error-category pair than
          (state, business_safety).
        test_recipe:
          setup:
            - "Dock with parking_capacity 0 (pool trivially full) AND an existing slot 14:00-16:00 for vessel"
            - "New slot request 16:30-18:00 same vessel: 16:30 < 16:00+45min=16:45 -> temporal conflict"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 0 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /docks/${dock_id}/dock-slots", payload: { vessel_id: "${vessel_id}", slot_start: "2026-08-10T14:00:00Z", slot_end: "2026-08-10T16:00:00Z" }, as: OperationsManager, captures: { slot_id: $.data.id } }
          trigger:
            - call: "POST /docks/${dock_id}/dock-slots"
              payload: { vessel_id: "${vessel_id}", slot_start: "2026-08-10T16:30:00Z", slot_end: "2026-08-10T18:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOCK_SLOT_CONFLICT (priority-8 temporal beats priority-9 parking constraint even though the dock's pool is also full)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics,
  # each via a DISTINCT endpoint.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: coast_guard_capacity_exact_fit_vs_over_by_one
        grounds:
          - validations[priority=6]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.CruiseInstance.fields.reserved_covers
        distinguishing_aspect: |
          Metric = reserved_covers vs coast_guard_capacity (integer headroom):
          party bringing total to exactly capacity is ALLOWED (<= semantics);
          one more cover is rejected — tested through the booking-create endpoint.
        test_recipe:
          setup:
            - "Vessel cap 6; booking A party4 PAID (reserved 4)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 6, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
          trigger:
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cruise_v2}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_b: $.data.id } }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v3: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v3}" }, as: Customer, as_user_id: "${cust_a}", captures: { err: $.data.error_id } }
          assert:
            - "Second booking (party 2) succeeds: reserved_covers == 6 == coast_guard_capacity exactly (boundary allowed)"
            - "Third booking (party 1) rejected: error_id == ERR_CAPACITY_EXCEEDED (6+1=7 > 6)"
      - name: parking_pool_zero_capacity_empty_set_edge
        grounds:
          - calculations.parking_capacity_check
          - errors[ERR_PARKING_FULL]
        distinguishing_aspect: |
          Metric = parking_in_use count vs parking_capacity on the parking-pass
          endpoint (different endpoint, different metric from covers): a dock
          with parking_capacity 0 rejects the very first pass (empty-pool edge,
          0 < 0 false) while capacity 1 admits exactly one then rejects.
        test_recipe:
          setup:
            - "Dock Z parking_capacity 0; dock O parking_capacity 1"
            - "Cruise + PAID booking (pass requires booking; pass creation does not gate on booking payment per scaffold — only booking_id/cruise_id existence)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier Z", parking_capacity: 0 }, as: OperationsManager, captures: { dock_z: $.data.id } }
            - { call: "POST /docks", payload: { name: "Pier O", parking_capacity: 1 }, as: OperationsManager, captures: { dock_o: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_o}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v2}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_b: $.data.id } }
          trigger:
            - { call: "POST /docks/${dock_z}/parking-passes", payload: { booking_id: "${bk_a}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { err_z: $.data.error_id } }
            - { call: "POST /docks/${dock_o}/parking-passes", payload: { booking_id: "${bk_a}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { pass_o: $.data.id } }
            - { call: "POST /docks/${dock_o}/parking-passes", payload: { booking_id: "${bk_b}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { err_o: $.data.error_id } }
          assert:
            - "Dock Z first pass rejected: error_id == ERR_PARKING_FULL (0 < 0 false, empty-pool edge)"
            - "Dock O first pass succeeds: parking_in_use == 1 (boundary: 0 < 1 true)"
            - "Dock O second pass rejected: error_id == ERR_PARKING_FULL (1 < 1 false)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: two dependencies across DIFFERENT
  # entity pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cruise_boarding_gated_on_manifest_frozen
        grounds:
          - state_machines.CruiseInstance.SCHEDULED_to_BOARDING
          - state_machines.BoardingManifest.DRAFT_to_FROZEN
          - errors[ERR_MANIFEST_NOT_FROZEN]
        distinguishing_aspect: |
          Pair (CruiseInstance, BoardingManifest): open-boarding is valid only
          when the cruise's manifest is FROZEN; with the manifest still DRAFT
          the same call fails with ERR_MANIFEST_NOT_FROZEN.
        test_recipe:
          setup:
            - "Cruise cap 100 with one PAID booking; manifest auto-created DRAFT"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          trigger:
            - { call: "POST /cruises/${cruise_id}/open-boarding", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /cruises/${cruise_id}/manifest/freeze", payload: {}, as: Captain }
            - { call: "POST /cruises/${cruise_id}/open-boarding", payload: {}, as: OperationsManager }
          assert:
            - "First open-boarding rejected: error_id == ERR_MANIFEST_NOT_FROZEN (manifest DRAFT)"
            - "After freeze, open-boarding succeeds: CruiseInstance.status == BOARDING"
      - name: bartender_confirm_gated_on_staffmember_cert
        grounds:
          - state_machines.StaffAssignment.ASSIGNED_to_CONFIRMED
          - entities.StaffMember.fields.alcohol_cert_expires_at
          - errors[ERR_ALCOHOL_CERT_EXPIRED]
        distinguishing_aspect: |
          Pair (StaffAssignment, StaffMember): confirming a BARTENDER assignment
          is valid only when the referenced StaffMember's alcohol cert is
          unexpired relative to the logical clock — a different entity pair than
          (CruiseInstance, BoardingManifest).
        test_recipe:
          setup:
            - "Cruise SCHEDULED; clock set to 2026-08-05T00:00:00Z"
            - "Staff member X BARTENDER cert expired 2026-01-01; staff member Y BARTENDER cert valid 2027-01-01"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Exp", role_code: "BARTENDER", alcohol_cert_expires_at: "2026-01-01T00:00:00Z" }, as: OperationsManager, captures: { staff_x: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Val", role_code: "BARTENDER", alcohol_cert_expires_at: "2027-01-01T00:00:00Z" }, as: OperationsManager, captures: { staff_y: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments", payload: { staff_member_id: "${staff_x}", assigned_role: "BARTENDER" }, as: OperationsManager, captures: { asg_x: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments", payload: { staff_member_id: "${staff_y}", assigned_role: "BARTENDER" }, as: OperationsManager, captures: { asg_y: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /cruises/${cruise_id}/staff-assignments/${asg_x}/confirm", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments/${asg_y}/confirm", payload: {}, as: OperationsManager }
          assert:
            - "Confirm expired-cert bartender rejected: error_id == ERR_ALCOHOL_CERT_EXPIRED"
            - "Confirm valid-cert bartender succeeds: StaffAssignment.${asg_y}.status == CONFIRMED"
            - "CruiseInstance.${cruise_id}.bar_service_enabled == true after valid confirmation"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: two rules with DIFFERENT interval
  # semantics on DIFFERENT resource entities.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_slot_turnaround_buffer_adjacency
        grounds:
          - calculations.dock_slot_conflict
          - errors[ERR_DOCK_SLOT_CONFLICT]
        distinguishing_aspect: |
          Semantics = half-open interval PLUS turnaround buffer on the Vessel's
          berth occupations: slot B starting exactly at prior.end+45min is
          ALLOWED (adjacency at buffer boundary), while 1 minute inside the
          buffer is rejected — interval-with-buffer arithmetic on DockSlot.
        test_recipe:
          setup:
            - "Vessel with existing slot 14:00-16:00 on dock"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /docks/${dock_id}/dock-slots", payload: { vessel_id: "${vessel_id}", slot_start: "2026-08-10T14:00:00Z", slot_end: "2026-08-10T16:00:00Z" }, as: OperationsManager, captures: { slot_a: $.data.id } }
          trigger:
            - { call: "POST /docks/${dock_id}/dock-slots", payload: { vessel_id: "${vessel_id}", slot_start: "2026-08-10T16:44:00Z", slot_end: "2026-08-10T18:00:00Z" }, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /docks/${dock_id}/dock-slots", payload: { vessel_id: "${vessel_id}", slot_start: "2026-08-10T16:45:00Z", slot_end: "2026-08-10T18:00:00Z" }, as: OperationsManager, captures: { slot_b: $.data.id } }
          assert:
            - "Slot at 16:44 rejected: error_id == ERR_DOCK_SLOT_CONFLICT (16:44 < 16:00+0:45)"
            - "Slot at exactly 16:45 succeeds (adjacency at buffer boundary allowed)"
      - name: parking_pool_aggregate_non_interval_sharing
        grounds:
          - calculations.parking_capacity_check
          - errors[ERR_PARKING_FULL]
        distinguishing_aspect: |
          Semantics = aggregate-count pool with NO interval arithmetic on the
          Dock resource: two passes for the same cruise consume 2 slots of the
          pool regardless of arrival times, and releasing one reopens exactly
          one slot — deliberately different interval semantics from dock slots.
        test_recipe:
          setup:
            - "Dock parking_capacity 1; cruise with two PAID bookings (bk_a, bk_b)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 1 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v2}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_b: $.data.id } }
            - { call: "POST /bookings/${bk_b}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          trigger:
            - { call: "POST /docks/${dock_id}/parking-passes", payload: { booking_id: "${bk_a}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { pass_a: $.data.id } }
            - { call: "POST /docks/${dock_id}/parking-passes", payload: { booking_id: "${bk_b}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { err_full: $.data.error_id } }
            - { call: "POST /parking-passes/${pass_a}/release", payload: {}, as: DockAttendant }
            - { call: "POST /docks/${dock_id}/parking-passes", payload: { booking_id: "${bk_b}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { pass_b: $.data.id } }
          assert:
            - "Second pass while pool full rejected: error_id == ERR_PARKING_FULL (aggregate count, no time component)"
            - "After release, Dock.parking_in_use == 0 and the retry succeeds (pool semantics, not interval overlap)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT conserved
  # quantities, pinned as explicit formulas.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reserved_covers_conserved_under_booking_cancel
        grounds:
          - entities.CruiseInstance.fields.reserved_covers
          - state_machines.Booking."booking_status=CONFIRMED"_to_"booking_status=CANCELLED"
        distinguishing_aspect: |
          Conserved quantity = CruiseInstance.reserved_covers: forward action
          (create+pay booking party4) paired with its compensating action
          (cancel the same booking) leaves reserved_covers IDENTICAL to its
          pre-action value (0), i.e. reserved_covers_after == reserved_covers_before.
        test_recipe:
          setup:
            - "Cruise cap 100; reserved_covers == 0 initially"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /bookings/${bk_a}/cancel", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          assert:
            - "CruiseInstance.${cruise_id}.reserved_covers == 0 after create+pay+cancel round-trip (no drift)"
            - "Booking.${bk_a}.booking_status == CANCELLED and payment_status == REFUNDED"
      - name: parking_in_use_conserved_under_pass_release
        grounds:
          - entities.Dock.fields.parking_in_use
          - state_machines.ParkingPass.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = Dock.parking_in_use (a DIFFERENT quantity from
          reserved_covers): forward action (create pass) paired with compensating
          action (release pass) leaves parking_in_use identical to its pre-action
          value; formula parking_in_use = count(ParkingPass where status IN
          {RESERVED, REDEEMED}) holds after the round-trip.
        test_recipe:
          setup:
            - "Dock parking_capacity 5, parking_in_use == 0; cruise with PAID booking"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 5 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          trigger:
            - { call: "POST /docks/${dock_id}/parking-passes", payload: { booking_id: "${bk_a}", cruise_id: "${cruise_id}" }, as: DockAttendant, captures: { pass_a: $.data.id } }
            - { call: "POST /parking-passes/${pass_a}/release", payload: {}, as: DockAttendant }
          assert:
            - "Dock.${dock_id}.parking_in_use == 0 after create+release round-trip (no drift)"
            - "ParkingPass.${pass_a}.status == RELEASED"

  # ---------------------------------------------------------------------------
  # OCC concurrency rules exercised as deterministic stale-version tests.
  # (Not one of the 9 rules, but §1.2.1 demands coverage via the write endpoint.)
  # ---------------------------------------------------------------------------
  - rule_id: occ_stale_version
    instances:
      - name: booking_create_stale_cruise_version
        grounds:
          - concurrency_rules[booking-create-stale-cruise]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          After booking A advances CruiseInstance.version 1 -> 2, a second
          booking create still carrying expected_cruise_version = 1 is rejected
          with ERR_STALE_VERSION (412) — two strictly sequential requests.
        test_recipe:
          setup:
            - "Cruise cap 100; customer registered; captured cruise version 1 at create"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/bookings"
              payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (reused stale version 1 after first create bumped it to 2)"
      - name: charter_quote_stale_inquiry_version
        grounds:
          - concurrency_rules[charter-quote-stale-inquiry]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          After a counter advances CharterInquiry.version, a re-quote carrying
          the pre-counter version is rejected with ERR_STALE_VERSION — OCC on a
          different parent entity (CharterInquiry, not CruiseInstance).
        test_recipe:
          setup:
            - "Inquiry DRAFT; quote posted (version 1 -> 2); customer counters (version 2 -> 3)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 60, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp" }, as: OperationsManager, captures: { cust_c: $.data.id } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cruise_id}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { inq_id: $.data.id, inq_v: $.data.version } }
            - { call: "POST /charter-inquiries/${inq_id}/quote", payload: { expected_inquiry_version: "${inq_v}" }, as: CharterSalesAgent, captures: { inq_v2: $.data.version } }
            - { call: "POST /charter-inquiries/${inq_id}/counter", payload: {}, as: Customer, as_user_id: "${cust_c}" }
          trigger:
            - call: "POST /charter-inquiries/${inq_id}/quote"
              payload: { expected_inquiry_version: "${inq_v2}" }
              as: CharterSalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (quote with pre-counter version rejected; current version is 3)"
