  # ===========================================================================
  # SECTION 2 — state_machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: referral_and_assessment_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Referral.initial_state
          - state_machines.Assessment.initial_state
          - state_machines.Referral[INTAKE -> EVALUATION_PENDING]
        distinguishing_aspect: |
          Both freshly created rows sit in their declared initial_state before any trigger fires: a
          referral is INTAKE (not EVALUATION_PENDING, even though a coordinator exists and could have
          been auto-assigned) and an assessment is SCHEDULED (not COMPLETED, even though its
          scheduled_date is in the past relative to the clock).
        test_recipe:
          setup:
            - "One ACTIVE coordinator in CNT_A, one child (dob 2024-06-15) and one referral received 2026-03-02."
            - "Logical clock parked at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-01", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
          assert:
            - "First trigger call: response.data.status == \"INTAKE\" and response.data.version == 1"
            - "Second trigger call: HTTP 200 and response.data.status == \"EVALUATION_PENDING\""
            - "Third trigger call: HTTP 201 and response.data.status == \"SCHEDULED\", with completion_date == null, eligibility_recommendation == null and family_unavailable_days == 0"
            - "response.data.evaluator_user_id equals the X-User-ID sent on the third call"

      - name: assign_coordinator_transition_applies_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.Referral[INTAKE -> EVALUATION_PENDING]
          - calculations.case_weight_points
          - calculations.coordinator_caseload_aggregates
          - endpoints[POST /ei/referrals/{referralId}/assign-coordinator]
          - endpoints[GET /ei/service-coordinators/{coordinatorId}/caseload-summary]
        distinguishing_aspect: |
          All four declared side effects of the intake transition are checked in one request: status
          plus coordinator_id and assignment_date, case_weight_points 1.50 from the PRE_PLAN stage
          (interpreter false, third birthday 2027-06-15 is 470 days out so no transition term, no
          service lines yet), the coordinator's three aggregates (1.50 / 1 / 0.1250) and the version
          bump 1 -> 2.
        test_recipe:
          setup:
            - "One ACTIVE coordinator with a 12.00-point ceiling, one child (dob 2024-06-15), one INTAKE referral received 2026-03-02, clock 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
          assert:
            - "First trigger call: HTTP 200, response.data.status == \"EVALUATION_PENDING\""
            - "response.data.coordinator_id == \"${coord_id}\" and response.data.assignment_date == \"2026-03-02\""
            - "response.data.case_weight_points == 1.50 (PRE_PLAN_STAGE_POINTS only)"
            - "response.data.version == 2 (exactly one increment)"
            - "Second trigger call: response.data.weighted_caseload_points == 1.50, active_case_count == 1, utilization_ratio == 0.1250"
            - "Second trigger call: response.data.caseload_posture == \"OPEN\" and response.data.headroom_points == 10.50"

      - name: not_eligible_branch_cancels_scheduled_assessments_and_zeroes_weight
        claim_type: side_effect_execution
        grounds:
          - state_machines.Referral[EVALUATION_PENDING -> NOT_ELIGIBLE]
          - state_machines.Assessment[SCHEDULED -> CANCELLED]
          - calculations.case_weight_points
          - calculations.coordinator_caseload_aggregates
          - entities.Child.fields.active_referral_count
          - endpoints[POST /ei/referrals/{referralId}/eligibility-determination]
        distinguishing_aspect: |
          The NOT_ELIGIBLE fork of the eligibility branch, with a cascade-down that touches only
          non-terminal children: the still-SCHEDULED supplemental assessment becomes CANCELLED while
          the two already-COMPLETED assessments keep their status, the case weight drops to 0.00, the
          coordinator's aggregates fall to 0.00 / 0 and the child's active_referral_count returns to 0.
        test_recipe:
