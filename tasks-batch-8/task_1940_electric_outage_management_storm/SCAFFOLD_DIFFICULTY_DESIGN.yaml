              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/lodging-blocks"
              payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H", county_code: "C1", room_count: 2, nightly_rate_cents: 10000, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-13T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { lb: $.data.id }
            - { call: "POST /om/lodging-blocks/${lb}/commit", payload: {}, as: MutualAidCoordinator }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo A", crew_type: "LINE", roster_size: 2, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-13T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { ma: $.data.id }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo B", crew_type: "TREE", roster_size: 1, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-14T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { mb: $.data.id }
            - { call: "POST /om/mutual-aid-crews/${ma}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mb}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${ma}/assign_lodging", payload: { lodging_block_id: "${lb}" }, as: MutualAidCoordinator }
          trigger:
            - call: "POST /om/mutual-aid-crews/${mb}/assign_lodging"
              payload: { lodging_block_id: "${lb}" }
              as: MutualAidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WINDOW_OUTSIDE_BLOCK — the priority-7 temporal containment failure wins"
            - "The priority-9 fiscal failure is masked: response is NOT ERR_NO_ROOMS_AVAILABLE even though rooms_allocated (2) + roster_size (1) > room_count (2)"
            - "LodgingBlock.${lb}.rooms_allocated remains 2; MutualAidCrew.${mb}.lodging_block_id remains null"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: clustering_call_threshold_exact_count
        grounds:
          - calculations.clustering_promotion
          - state_machines.TroubleSignal.UNCLUSTERED_to_CLUSTERED
          - entities.Feeder.fields.cluster_call_threshold
        distinguishing_aspect: |
          Metric: signal COUNT. Exactly cluster_call_threshold (5) CUSTOMER_CALL signals promote to a
          SUSPECTED outage; threshold-1 (4) promotes nothing. Reached via POST
          /om/storm-events/{id}/run_clustering — a different endpoint and metric from the FEMA cents
          instance.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder with default thresholds (3 last-gasps / 5 calls)"
            - "Four CUSTOMER_CALL signals ingested at 00:01Z-00:04Z (inside one 60-minute anchor window); first clustering run promotes nothing"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Lambda", event_type: "THUNDERSTORM" }
