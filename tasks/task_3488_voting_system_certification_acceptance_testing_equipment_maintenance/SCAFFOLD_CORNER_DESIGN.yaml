              payload: {}
              as: Auditor
          assert:
            - "GET returns name == \"Consistent County\", state_code == \"NV\", budget_total_cents == 777000"
            - "available_cents == 777000, encumbered_cents == 0, spent_cents == 0 in the same request stream"
