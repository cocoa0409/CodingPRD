scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /flooring/products with all required fields returns 201 and a Product whose status=ACTIVE, version=1, and echoes category."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flooring/products"
              payload: { sku: "HW-CR", name: "Create Oak", category: "HARDWOOD", material_cost_per_sqft_cents: 600, labor_rate_per_sqft_cents: 350, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 5, warranty_years: 20 }
              as: Admin
              captures: { prod_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Product.${prod_id}.status == ACTIVE"
            - "Product.${prod_id}.version == 1"
            - "Product.${prod_id}.category == HARDWOOD"

      - name: get_job_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Job, endpoints]
        distinguishing_aspect: "GET /flooring/jobs/{id} returns the stored job with declared_sqft 250 and status DRAFT echoed."
        test_recipe:
          setup: ["One DRAFT job exists."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Get Guy", address: "1 St", email: "getguy@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep G" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "LVP-G", name: "Get LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 250 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "GET /flooring/jobs/${job_id}"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { st: $.data.status, dsf: $.data.declared_sqft }
          assert:
            - "Job.${job_id}.status == DRAFT"
            - "Job.${job_id}.declared_sqft == 250"

      - name: list_products_paginated_envelope
        claim_type: Listing
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "GET /flooring/products with limit=1 returns a 1-element array with total_count=2 and has_more=true in pagination fields."
        test_recipe:
          setup: ["Two products exist."]
          setup_api_calls:
            - call: "POST /flooring/products"
              payload: { sku: "P1", name: "P1", category: "TILE", material_cost_per_sqft_cents: 500, labor_rate_per_sqft_cents: 400, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 0, warranty_years: 25 }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "P2", name: "P2", category: "CARPET", material_cost_per_sqft_cents: 100, labor_rate_per_sqft_cents: 100, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 0, warranty_years: 5 }
              as: Admin
          trigger:
            - call: "GET /flooring/products"
              payload: { limit: 1, offset: 0 }
              as: Admin
          assert:
            - "response.data is an array of length 1"
            - "response total_count == 2"
            - "response has_more == true"

      - name: get_nonexistent_job_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /flooring/jobs/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /flooring/jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_job_missing_declared_sqft_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Job.fields.declared_sqft, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /flooring/jobs omitting declared_sqft returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Customer, rep, product exist."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Req Guy", address: "2 St", email: "req@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep R" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "REQ-1", name: "Req LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_default_lead_time_zero
        claim_type: Defaults
        grounds: [entities.Product.fields.lead_time_days]
        distinguishing_aspect: "POST /flooring/products omitting lead_time_days applies default 0 (stocked)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flooring/products"
              payload: { sku: "DEF-1", name: "Default Tile", category: "TILE", material_cost_per_sqft_cents: 500, labor_rate_per_sqft_cents: 400, requires_underlayment: false, warranty_years: 25 }
              as: Admin
              captures: { prod_id: $.data.id, lt: $.data.lead_time_days }
          assert:
            - "Product.${prod_id}.lead_time_days == 0"

      - name: job_computed_waste_factor_null_until_measured
        claim_type: Computed Fields
        grounds: [entities.Job.fields.waste_factor_pct]
        distinguishing_aspect: "A DRAFT job has waste_factor_pct == null (computed only at MEASURED)."
        test_recipe:
          setup: ["A DRAFT job exists."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Comp Guy", address: "3 St", email: "comp@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep C" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "COMP-1", name: "Comp LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id, wfp: $.data.waste_factor_pct }
          assert:
            - "Job.${job_id}.waste_factor_pct == null"

      - name: invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Product.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /flooring/products with category not in {HARDWOOD,LVP,TILE,CARPET} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flooring/products"
              payload: { sku: "ENUM-1", name: "Bad", category: "BAMBOO", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 0, warranty_years: 5 }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: customer_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Customer]
        distinguishing_aspect: "Customer (common_fields:false) create response carries id and created_at but no version field."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flooring/customers"
              payload: { full_name: "Imm Guy", address: "4 St", email: "imm@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id, ca: $.data.created_at }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id} has no version field"

      - name: system_field_status_server_set_on_product
        claim_type: System Fields
        grounds: [entities.Product.fields.status]
        distinguishing_aspect: "Product.status is server-set to ACTIVE on create; clients cannot supply it (status is not in the §1.5 input)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flooring/products"
              payload: { sku: "SYS-1", name: "Sys LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id, st: $.data.status }
          assert:
            - "Product.${prod_id}.status == ACTIVE"

      - name: job_wrong_parent_product_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Job.fields.product_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /flooring/jobs with a non-existent product_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Customer and rep exist; no product with the given id."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Par Guy", address: "5 St", email: "par@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep P" }
              as: Anonymous
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "00000000-0000-4000-8000-000000000999", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: flat_fk_integrity_estimate_job_reverse_list
        claim_type: Creation
        grounds: [entities.Estimate.fields.job_id, endpoints]
        distinguishing_aspect: "Flat-topology FK reverse-reachability: GET /flooring/jobs/{id}/estimates returns the Estimate[] for a job, length 1 after one estimate created."
        test_recipe:
          setup: ["A DRAFT job with one PROVISIONAL estimate."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Flat Guy", address: "6 St", email: "flat@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep F" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "FLAT-1", name: "Flat LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "PROVISIONAL", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /flooring/jobs/${job_id}/estimates"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_id}"
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].id == ${est_id}"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: job_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Job, entities.Job.fields.status]
        distinguishing_aspect: "A newly created Job starts in DRAFT (initial_state)."
        test_recipe:
          setup: ["Customer, rep, product exist."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Init Guy", address: "7 St", email: "init@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep I" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "INIT-1", name: "Init LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id, st: $.data.status }
          assert:
            - "Job.${job_id}.status == DRAFT"

      - name: measure_invalid_when_already_measured
        claim_type: Invalid Transitions
        grounds: [state_machines.Job.DRAFT_to_MEASURED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Measuring a job that is already MEASURED (not RE_MEASURE) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A job already in MEASURED status."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Inv Guy", address: "8 St", email: "inv@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Inv" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "INV-1", name: "Inv LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 200, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
          trigger:
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 210, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_terminal_completed_job_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Job, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From the terminal COMPLETED state no transition is allowed; cancelling a COMPLETED job returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A job driven all the way to COMPLETED."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Term Guy", address: "9 St", email: "term@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep T" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "TERM-1", name: "Term Carpet", category: "CARPET", material_cost_per_sqft_cents: 100, labor_rate_per_sqft_cents: 100, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 0, warranty_years: 5 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/install-crews"
              payload: { name: "Term Crew", skill_categories: ["CARPET"], daily_sqft_capacity: 2000, buffer_minutes: 0 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 200, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /flooring/jobs/${job_id}/material-orders"
              payload: {}
              as: Scheduler
              captures: { mo_id: "$.data[0].id" }
            - call: "POST /flooring/material-orders/${mo_id}/receive"
              payload: {}
              as: Scheduler
            - call: "POST /flooring/install-slots"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", start_at: "2026-06-02T09:00:00.000Z", end_at: "2026-06-02T15:00:00.000Z" }
              as: Scheduler
              captures: { slot_id: $.data.id }
            - call: "POST /flooring/install-slots/${slot_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /flooring/install-slots/${slot_id}/complete"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /flooring/jobs/${job_id}/cancel"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: estimate_accept_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Estimate.ISSUED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting the same estimate a second time (now ACCEPTED, terminal) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An estimate already ACCEPTED."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Idem Guy", address: "10 St", email: "idem@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Id" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "IDEM-1", name: "Idem LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 200, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: material_receive_unlocks_slot_start
        claim_type: Side Effect Execution
        grounds: [state_machines.MaterialOrder.ORDERED_to_RECEIVED, state_machines.Job.ACCEPTED_to_IN_INSTALL]
        distinguishing_aspect: "Receiving the MaterialOrder (status->RECEIVED) lets slot start drive Job ACCEPTED->IN_INSTALL successfully."
        test_recipe:
          setup: ["ACCEPTED job, scheduled slot, MaterialOrder received."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Side Guy", address: "11 St", email: "side@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
