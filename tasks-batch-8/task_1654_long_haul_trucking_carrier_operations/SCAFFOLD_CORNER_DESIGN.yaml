            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/accessorials", payload: { type: "LUMPER", quantity: 3013 }, as: Dispatcher, captures: { acc: $.data.id } }
          trigger:
            - { call: "POST /accessorials/${acc}/approve", payload: {}, as: LoadPlanner, captures: { err1: $.data.error_id } }
            - { call: "POST /accessorials/${acc}/dispute", payload: {}, as: LoadPlanner, captures: { err2: $.data.error_id } }
            - { call: "POST /accessorials/${acc}/reject", payload: {}, as: LoadPlanner, captures: { err3: $.data.error_id } }
          assert:
            - "captured ${err1} == ERR_ACCESSORIAL_NOT_APPROVABLE, ${err2} == ERR_ACCESSORIAL_NOT_DISPUTABLE, ${err3} == ERR_ACCESSORIAL_NOT_REJECTABLE"

