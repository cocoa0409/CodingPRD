      - name: objection_window_is_ten_days_and_fifteen_for_a_juvenile
        claim_type: Correct Result
        grounds:
          - calculations.objection_deadline
          - entities.DepictedIndividual.fields.objection_deadline_at
          - entities.DepictedIndividual.fields.notified_at
          - entities.PublicRecordsRequest.fields.open_notification_count
        distinguishing_aspect: |
          Two individuals notified in the same second get different deadlines purely from
          relationship: a WITNESS gets 2026-08-15T14:30:00Z (10 days) and a JUVENILE
          2026-08-20T14:30:00Z (15 days), both preserving the notification time-of-day.
        test_recipe:
          setup:
            - "One 20-minute ROUTINE recording carrying two depicted individuals created before the record is ruled responsive: SUBJECT-1 with relationship WITNESS and SUBJECT-2 with relationship JUVENILE, so both are notification_required and start PENDING."
            - "One clarified request whose single ResponsiveRecord is ruled RESPONSIVE, which recomputes open_notification_count to 2."
            - "The logical clock is moved to 2026-08-05T14:30:00Z immediately before the notices issue."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
