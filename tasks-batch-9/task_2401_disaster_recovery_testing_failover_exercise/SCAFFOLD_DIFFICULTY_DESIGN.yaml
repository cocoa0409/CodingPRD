              captures: { exSmall_id: $.data.id, exSmall_v: $.data.version }
            - call: "POST /exercises/${exSmall_id}/scope-items"
              payload: { recovery_group_id: "${gs_id}", expected_exercise_version: "${exSmall_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exSmall_id}/impact-submissions"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exSmall_id}/impact-decisions"
              payload: { action: "APPROVE" }
              as: RiskApprover
              as_user_id: "${ra3_id}"
          trigger:
            - call: "POST /exercises/${exBig_id}/schedule"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exSmall_id}/schedule"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { capacity_error: $.data.error_id }
          assert:
            - "the first schedule call succeeds with 201: 0 + 6 <= 6 is satisfied at exact equality"
            - "Exercise.${exBig_id}.execution_state == SCHEDULED and Site.${ss_id}.reserved_capacity_units == 6, exactly equal to usable_capacity_units"
            - "Exercise.${exBig_id}.provisional_impact_score == 50.00 and production_impact_score == 53.00 with required_approval_level LEVEL_2, since capacity_component is 10 * 6 / 6 == 10.00"
            - "the second schedule call returns 409 with capacity_error == ERR_SITE_CAPACITY_EXCEEDED because 6 + 2 == 8 > 6"
            - "Exercise.${exSmall_id}.execution_state remains APPROVED and Site.${ss_id}.reserved_capacity_units is still 6 — the rejected call reserved nothing"
            - "the rejection is NOT ERR_SITE_WINDOW_CONFLICT: the windows are a day apart and 2026-08-21T00:00:00Z is more than 240 minutes after 2026-08-20T06:00:00Z"

