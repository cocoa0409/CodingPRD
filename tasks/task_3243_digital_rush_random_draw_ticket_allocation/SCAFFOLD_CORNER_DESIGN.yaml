  - name: reconciliation_variance_is_the_symmetric_difference_sorted_ascending
    claim_type: Input Set Filtering
    grounds:
    - calculations.reconciliation_variance
    - entities.RushAllocation.fields.reconciliation_variance_seats
    - state_machines.SeatHold.HELD_to_ORPHANED
    distinguishing_aspect: "reconciliation_variance compares the claimed label set against only the non-terminal ALLOCATION holds of that performance, sorts the symmetric difference lexicographically ascending, and counts it \u2014 so a label present on both sides cancels out while a label present on one side does not."
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production, an ONSALE performance, and a released STANDARD allocation.
      - The platform holds ALLOCATION holds on ORCH-E-1 and ORCH-E-2, and a BOX_OFFICE hold on ORCH-E-3 that must not enter the comparison.
      setup_api_calls:
      - *id001
      - call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
          mkt_v: $.data.version
      - call: POST /productions
        payload:
          title: Corner Play
          producer_org: Corner Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Variance Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: STANDARD
          daily_quantity: 4
          discount_pct: 0
          release_time_local: 09:00
          refundable: true
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /performances/${perf_id}/seat-holds
        payload:
          allocation_id: ${alloc_id}
          seat_label: ORCH-E-1
          hold_kind: ALLOCATION
        as: AllocationsCoordinator
        captures:
          hold_v: $.data.version
      - call: POST /performances/${perf_id}/seat-holds
        payload:
          allocation_id: ${alloc_id}
          seat_label: ORCH-E-2
          hold_kind: ALLOCATION
        as: AllocationsCoordinator
        captures:
          hold_v: $.data.version
      - call: POST /performances/${perf_id}/seat-holds
        payload:
          allocation_id: ${alloc_id}
          seat_label: ORCH-E-3
          hold_kind: BOX_OFFICE
          origin_ref: BO-E-3
        as: AllocationsCoordinator
        captures:
          hold_v: $.data.version
      trigger:
      - call: POST /allocations/${alloc_id}/reconciliations
        payload:
          seat_count_claimed: 2
          seat_labels_claimed:
          - ORCH-E-1
          - ORCH-E-9
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          var_n: $.data.reconciliation_variance_count
          alloc_v: $.data.version
      assert:
      - RushAllocation.${alloc_id}.reconciliation_variance_count == ${var_n} and it equals 0, because two labels are claimed and two non-terminal ALLOCATION holds exist
      - RushAllocation.${alloc_id}.reconciliation_variance_seats == ["ORCH-E-2", "ORCH-E-9"], the symmetric difference sorted ascending
      - ORCH-E-3 is absent from the variance because its hold_kind is BOX_OFFICE rather than ALLOCATION
      - RushAllocation.${alloc_id}.reconciliation_status == RECONCILED, since the count reached zero
      - the same claimed list reported against the platform's three ALLOCATION holds would give a non-zero count
