            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4701", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/programs/${prog_id}/pause-intake", payload: {}, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/participants", payload: { full_name: "New P", date_of_birth: "1952-08-06", phone: "555-4702", address: "2 Err Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { err1: $.data.error_id } }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker, captures: { err2: $.data.error_id } }
