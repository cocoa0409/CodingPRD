      - name: priority_conflict_pay_period_overlap_beats_duplicate_payroll_reference
        grounds:
          - validations[priority=41]
          - validations[priority=55]
          - errors.ERR_PAY_PERIOD_OVERLAP
          - errors.ERR_DUPLICATE_PAYROLL_REFERENCE
        distinguishing_aspect: |
          Two same-status 409s on POST /pep/payroll-batches whose only ordering signal is the
          declared priority, and the low-priority one is the easier check: a resubmitted payroll
          file that both overlaps an existing half-open pay period and reuses its
          payroll_provider_reference must fail with the temporal ERR_PAY_PERIOD_OVERLAP, not the
          cheap uniqueness error a naive index-constraint-first implementation surfaces.
