            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 60000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-dl" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "ONLINE" }, as: VerificationAgent, captures: { case: $.data.id } }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-04T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /identity-protection/verification-cases/${case}/documents", payload: { doc_type: "PHOTO_ID" }, as: Taxpayer, as_user_id: "${tp}", captures: { err: $.data.error_id } }
            - { call: "GET /identity-protection/verification-cases/${case}", payload: {}, as: VerificationAgent, captures: { caseSt: $.data.status } }
          assert:
