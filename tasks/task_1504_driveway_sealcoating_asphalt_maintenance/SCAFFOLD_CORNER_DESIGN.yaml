        claim_type: occ_stale_version
        grounds: ["concurrency_rules[workorder-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reschedule with the pre-hold WorkOrder.version (stale after the weather-hold cascade bumped it) is rejected 412; re-reading and rescheduling with the fresh version succeeds."
