              captures: { f1: $.data.id }
            - call: "POST /api/cases/${case_id}/findings"
              payload: { allegation_id: "${alg_id}", subject_id: "${subj_id}", evidence_item_ids: ["${e1}", "${e2}"] }
              as: Investigator
              as_user_id: "inv-1"
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /api/findings/${f1}/transition"
              payload: { to_status: CALIBRATED, consistency_level: HIGH, subject_admission: false, finding_type: SUBSTANTIATED }
              as: HRBusinessPartner
              as_user_id: "hr-1"
              captures: { f1_score: $.data.substantiation_score_final, f1_st: $.data.status }
            - call: "POST /api/findings/${f2}/transition"
