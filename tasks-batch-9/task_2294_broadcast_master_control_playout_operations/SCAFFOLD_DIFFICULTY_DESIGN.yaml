  # ===========================================================================
  # RULE 2 — Combinatorial / multi-input formulas
  # Three instances covering all three §0.5 modes:
  #   (a) >=3-input non-linear formula with nested min/max and branch selection
  #   (b) pinned nested-rounding ORDER (round each, then sum)
  #   (c) circular-looking dependency resolved by a pinned 5-step order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: backtime_plan_trim_tail_selected_by_nested_min_max_over_five_inputs
        grounds:
          - calculations.backtime_join_plan
          - entities.NetworkFeedWindow.fields.plan_action
          - entities.NetworkFeedWindow.fields.backtime_trim_seconds
          - entities.PlaylistItem.fields.trim_applied_seconds
          - entities.PlaylistItem.fields.max_trim_seconds
          - validations[priority=48]
        distinguishing_aspect: |
          Mode (a): plan_action is decided by a non-linear function of five
          independent inputs (join_utc, logical clock, pending tail seconds,
          guard_seconds and backtiming_mode) whose branch threshold is itself a
          nested max(guard, min(floor(tail*0.02), 15)) == max(30, min(2, 15)) ==
          30; the deficit 80 then has to be compared against a second nested sum
          sum(min(duration - 1, max_trim_seconds)) == 55 + 35 == 90 before
          TRIM_TAIL rather than SKIP_ELEMENTS can be chosen, and the 80 seconds
          must be consumed 55-then-25 in ascending sequence_number rather than
          split evenly.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500, live_encoder_units_total 2), one ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1), posture NORMAL."
            - "Three QC_PASSED assets: A (expected 1690 s), P (expected 60 s), I (expected 40 s), each scored 100 with no defects."
            - "Playlist for 2026-08-01, schedule_start_utc 12:00:00Z, window_duration_seconds 1800, four contiguous items: seq 1 PROGRAM 1690 s (max_trim 0), seq 2 NETWORK_JOIN 10 s (max_trim 0), seq 3 PROMO 60 s (max_trim 55), seq 4 INTERSTITIAL 40 s (max_trim 35). Total 1800 s so projected_end_variance_seconds == 0 and the playlist reaches ARMED."
            - "Every item still has playout_status SCHEDULED, so the tail at or after anchor_sequence_number 2 is 10 + 60 + 40 == 110 seconds."
            - "The logical clock stands at 2026-08-01T12:28:30Z, exactly 30 seconds before the contractual join_utc of 12:29:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Mac Control", role_class: "MASTER_CONTROL", override_authority: "CRAWL_AND_CUTIN", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { mco_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v1}", call_sign: "WXYZ-DT1", channel_number: "12.1", service_class: "PRIMARY", resolution_class: "SD_480I", requested_bitrate_kbps: 6000, floor_bitrate_kbps: 2000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /assets"
              payload: { house_number: "HN-A", title: "Feature A", source: "FILE_DELIVERY", expected_duration_seconds: 1690, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
