      - name: withdrawal_aggregate_rate_exactly_at_permit_ceiling
        grounds:
          - calculations.withdrawal_rate_envelope
          - validations.priority_50
          - entities.WaterSource.fields.max_concurrent_rate_gpm
        distinguishing_aspect: |
          Metric: a summed gallons-per-minute rate at one decimal place, on
          POST /water-withdrawals, and the boundary is an aggregate over overlapping
          intervals rather than a single stored field. Three overlapping 300 gpm windows
          reach exactly 900 gpm and are accepted; a fourth window of 0.1 gpm is refused.
          The half-open interval semantics are probed in the same instance: a window that
          starts exactly when another ends contributes nothing.
        test_recipe:
          setup:
            - "A water source with 900 gpm concurrent limit and 5000000 gal permitted, so the volume rule can never be the binding constraint."
            - "Two RESERVED withdrawals of 300 gpm each, both covering 2026-08-11T00:00Z to 2026-08-11T12:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 5000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "REUSE_NEXT_TANK", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T12:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd1_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T12:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
              captures: { wd2_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v3: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T06:00:00Z", window_end_utc: "2026-08-11T18:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v3}" }
              as: ErectionSuperintendent
              captures: { wd3_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v4: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T11:59:59Z", window_end_utc: "2026-08-11T20:00:00Z", rate_gpm: 0.1, reserved_volume_gal: 1000, expected_water_source_version: "${ws_v4}" }
              as: ErectionSuperintendent
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T18:00:00Z", window_end_utc: "2026-08-11T23:00:00Z", rate_gpm: 900, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v4}" }
              as: ErectionSuperintendent
              captures: { wd5_id: $.data.id }
          assert:
            - "the third 300 gpm reservation returns 201: the overlapping peak is exactly 900.0 gpm, which is accepted at the limit"
            - "WaterWithdrawal.${wd3_id}.status == RESERVED and WaterSource.${ws_id}.reserved_volume_gal == 300000.00"
            - "the 0.1 gpm window overlapping 11:59:59Z returns 409 ERR_WITHDRAWAL_CAPACITY_CONFLICT (peak 900.1 gpm exceeds 900)"
            - "the 900 gpm window starting exactly at 2026-08-11T18:00:00Z returns 201, because the half-open window [start, end) of wd3 ends at 18:00:00Z and therefore does not overlap"
            - "WaterWithdrawal.${wd5_id}.status == RESERVED and WaterSource.${ws_id}.reserved_volume_gal == 400000.00"
            - "WaterSource.${ws_id}.available_volume_gal == 4600000.00"

