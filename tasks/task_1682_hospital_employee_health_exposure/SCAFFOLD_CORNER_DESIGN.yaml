            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2026, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T23:59:59Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/annual-requirement-cycles/${cyc_id}"
              as: ComplianceOfficer
              captures: { at_due: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/annual-requirement-cycles/${cyc_id}"
              as: ComplianceOfficer
              captures: { past_due: $.data.status }
            - call: "GET /employee-health/employees/${emp_id}"
              as: ComplianceOfficer
              captures: { emp_status: $.data.status }
          assert:
            - "At now == tb_due_date: ${at_due} == OPEN (strict > not met)"
            - "At now == tb_due_date + 1s: ${past_due} == OVERDUE and a TB_OVERDUE ComplianceHold is ACTIVE"
            - "${emp_status} == SUSPENDED (cascade completed)"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a create followed instantly by a GET returns the fully mutated state (status, computed fields) with no lag or stale cache."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-M1", full_name: "Read After", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: true }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "GET /employee-health/employees/${emp_id}"
              as: SafetyOfficer
          assert:
            - "GET returns employee_ref E-M1, status PREPLACEMENT, requires_respirator true, version 1 — identical to the create response"
