      - name: publication_is_permitted_only_from_the_correction_deadline_onwards
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/publish
          - validations[priority=32]
          - errors.ERR_CYCLE_NOT_PUBLISHABLE
          - entities.RatingCycle.fields.correction_deadline_at
          - state_machines.RatingCycle.ORG_REVIEW_to_PUBLISHED
          - calculations.publication_change_classification
        distinguishing_aspect: |
          Publication is the one action whose permission is a function of the clock
          rather than of anything a user does, and the boundary is inclusive: the
          organization owns its review window right up to the final instant, and the
          reviewer may act from that instant onwards. The two calls are one second
          apart around correction_deadline_at with every other precondition already
          satisfied, so nothing but the comparison operator distinguishes them, and
          the accepted one is then held to the full three-hop cascade it triggers.
