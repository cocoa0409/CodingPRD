- rule_id: resource_temporal_overlap
  instances:
  - name: bench_reservation_half_open_window_with_cooldown_buffer
    grounds:
    - validations[priority=55]
    - errors[ERR_BENCH_WINDOW_CONFLICT]
    - entities.TestBench.fields.cooldown_minutes
    - entities.BenchReservation.fields.duration_minutes
    distinguishing_aspect: 'Interval semantics A — HALF-OPEN with a per-bench cooldown buffer on TestBench: the conflict predicate is new_start < existing_end + cooldown_minutes AND new_end > existing_start,
      so a 12:30 start collides with an 08:00-12:00 hold under a 60-minute cooldown while a 13:00 start (exactly at the buffer edge) is accepted.'
    test_recipe:
      setup:
      - TestBench BENCH-1 has cooldown_minutes 60 and reserved_minutes_total 240.
      - Reservation res1 holds BENCH-1 from 2026-08-03T08:00:00Z to 2026-08-03T12:00:00Z for the DESIGN_QUALIFICATION campaign and is HELD.
      - A second campaign (INCIDENT_INVESTIGATION) is PLANNED and needs bench time.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-1
          max_load_capacity_lb: 5000
          cooldown_minutes: 60
        as: TestLabTechnician
        captures:
          b1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: DESIGN_QUALIFICATION
        as: TestLabTechnician
        captures:
          c1: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c1}
          start_at: '2026-08-03T08:00:00Z'
          end_at: '2026-08-03T12:00:00Z'
        as: TestLabTechnician
        captures:
          res1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: INCIDENT_INVESTIGATION
        as: TestLabTechnician
        captures:
          c2: $.data.id
      trigger:
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c2}
          start_at: '2026-08-03T12:30:00Z'
          end_at: '2026-08-03T14:30:00Z'
        as: TestLabTechnician
        captures:
          res_rejected: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c2}
          start_at: '2026-08-03T13:00:00Z'
          end_at: '2026-08-03T14:00:00Z'
        as: TestLabTechnician
        captures:
          res2: $.data.id
      assert:
      - the 12:30 reservation returns HTTP 409 with error_id ERR_BENCH_WINDOW_CONFLICT
      - after that failure TestBench.${b1}.reserved_minutes_total == 240
      - the 13:00 reservation returns HTTP 201
      - BenchReservation.${res2}.status == HELD
      - BenchReservation.${res2}.duration_minutes == 60
      - BenchReservation.${res1}.duration_minutes == 240
      - TestBench.${b1}.reserved_minutes_total == 300
      - GET /ladder-ops/bench-reservations?test_bench_id=${b1} returns exactly 2 items
  - name: audit_window_closed_interval_touching_endpoints_collide
    grounds:
    - validations[priority=56]
    - errors[ERR_AUDIT_WINDOW_OVERLAP]
    - entities.TestCampaign.fields.sample_window_start
    - entities.TestCampaign.fields.sample_window_end
    distinguishing_aspect: 'Interval semantics B on a different resource (ListingRecord, not TestBench) — CLOSED intervals with NO buffer: new_start <= existing_end AND new_end >= existing_start, so a window
      starting exactly on the incumbent''s end instant collides, unlike the half-open bench rule.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA has revision A, listing record lr1 and LOT-0001 (OPEN).
      - Audit campaign A1 on lr1 is PLANNED over the closed window 2026-08-05T00:00:00Z .. 2026-08-09T00:00:00Z.
      - No other audit campaign exists on lr1.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/listing-bodies
        payload:
          body_code: NRTL-1
          accredited_standards:
          - ANSI_ASC_A14_2
          audit_interval_days: 180
        as: ComplianceOfficer
        captures:
          lb1: $.data.id
      - call: POST /ladder-ops/listing-records
        payload:
          product_id: ${p1}
          listing_body_id: ${lb1}
          standard_code: ANSI_ASC_A14_2
        as: ComplianceOfficer
        captures:
          lr1: $.data.id
      - call: POST /ladder-ops/production-lots
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          lot_code: LOT-0001
          planned_units: 500
          pultrusion_batch_id: PB-77
        as: ProductionSupervisor
        captures:
          l1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: PERIODIC_AUDIT
          listing_record_id: ${lr1}
          sampled_lot_id: ${l1}
          sample_window_start: '2026-08-05T00:00:00Z'
          sample_window_end: '2026-08-09T00:00:00Z'
        as: TestLabTechnician
        captures:
          a1: $.data.id
      trigger:
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: PERIODIC_AUDIT
          listing_record_id: ${lr1}
          sampled_lot_id: ${l1}
          sample_window_start: '2026-08-09T00:00:00Z'
          sample_window_end: '2026-08-12T00:00:00Z'
        as: TestLabTechnician
        captures:
          a_rejected: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: PERIODIC_AUDIT
          listing_record_id: ${lr1}
          sampled_lot_id: ${l1}
          sample_window_start: '2026-08-10T00:00:00Z'
          sample_window_end: '2026-08-12T00:00:00Z'
        as: TestLabTechnician
        captures:
          a3: $.data.id
      assert:
      - the touching window returns HTTP 409 with error_id ERR_AUDIT_WINDOW_OVERLAP
      - the 2026-08-10 window returns HTTP 201
      - TestCampaign.${a3}.status == PLANNED
      - TestCampaign.${a3}.escalation_tier == TIER_0
      - TestCampaign.${a3}.prior_failure_rate_pct == null
      - TestCampaign.${a3}.audit_sample_size == 5
      - GET /ladder-ops/test-campaigns?listing_record_id=${lr1} returns exactly 2 items
      - 'no cooldown buffer participates: a window starting one day after the incumbent''s end is accepted with no gap requirement'
- rule_id: compensating_invariant
  instances:
  - name: lot_unit_count_conserved_across_quarantine_and_release
    grounds:
    - entities.ProductionLot.fields.units_wip
    - entities.ProductionLot.fields.units_quarantined
    - entities.ProductionLot.fields.units_released
    - entities.ProductionLot.fields.units_scrapped
    - state_machines.ProductionLot.RELEASED_to_QUARANTINED
    - state_machines.ProductionLot.QUARANTINED_to_RELEASED
    distinguishing_aspect: 'Conserved quantity 1 — PHYSICAL UNITS: units_wip + units_quarantined + units_released + units_scrapped must equal produced_units 400 at every step, and quarantine followed by
      a RELEASE disposition is the forward/compensating pair that moves 400 units out of and back into units_released.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA is DESIGN_FROZEN on revision A.
      - LOT-0001 is RELEASED with produced_units 400, units_released 400 and released_at 2026-08-01T00:00:00Z.
      - Its four joint samples all PASSED and conformance_index is 2.50.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
