            - "HTTP 422 with error_id == ERR_PAYMENT_DEVICE_NON_COMPLIANT, not ERR_ITEM_NOT_IN_PUBLISHED_BUNDLE and not ERR_STORE_CONTENT_FROZEN"
            - "GET /kiosk-ops/order-handoffs?device_id=${dev_id} returns total_count 0"
