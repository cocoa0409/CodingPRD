              as: CrewScheduler
              captures: { shr_scheduler_first: "$.data[0].id" }
            - call: "GET /officials"
              payload: { season_program_id: "${sp_id}" }
              as: GradingSupervisor
              captures: { shr_supervisor_first: "$.data[0].id" }
            - call: "GET /officials"
