      - name: missing_or_unknown_identity_headers_are_rejected_before_authorization
        claim_type: role_permitted_operations
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Priority 1 outranks priority 2, so an empty X-User-ID or an X-User-Role that is not one of the five
          declared roles is 401 ERR_UNAUTHENTICATED — never 403 and never a 404 for the resource being
          addressed. The distinction is observable: the SAME request that yields 401 with an empty X-User-ID
          yields 403 ERR_UNAUTHORIZED once a valid but wrong role is supplied, and 200 with the right one.
        test_recipe:
          setup:
            - "One jurisdiction, one provider and one ACTIVE EN form. Every call below targets that provider row."
            - "The first trigger call sends X-User-Role: ProviderAdmin with an EMPTY X-User-ID header; the second sends X-User-Role: Auditor, a value not declared in §1.7, with a well-formed X-User-ID."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"] }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
          trigger:
            - call: "GET /training-providers/${prov_id}"
              payload: {}
              as: ProviderAdmin
              as_user_id: ""
              captures: { e_empty_id: $.data.error_id }
            - call: "GET /training-providers/${prov_id}"
              payload: {}
              as: Auditor
              as_user_id: "${prov_id}"
              captures: { e_unknown_role: $.data.error_id }
            - call: "GET /training-providers"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { e_wrong_role: $.data.error_id }
            - call: "GET /training-providers/${prov_id}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ok_id: $.data.id, ok_balance: $.data.credit_balance_cents }
          assert:
            - "the empty X-User-ID returns HTTP 401 with error_id == ERR_UNAUTHENTICATED — priority 1 fires before the endpoint's role list is consulted"
            - "the undeclared role Auditor returns HTTP 401 with error_id == ERR_UNAUTHENTICATED, not 403 — an unknown role value fails authentication, not authorization"
            - "GET /training-providers (the provider LIST, which is PlatformAdmin-exclusive) as a fully identified ProviderAdmin returns HTTP 403 with error_id == ERR_UNAUTHORIZED — a declared role reaching a forbidden endpoint"
            - "the same GET /training-providers/${prov_id} with the correct headers returns HTTP 200 with id == ${prov_id} and credit_balance_cents == 0, proving the three failures above were caused only by the identity headers"
      - name: the_admin_who_finalized_the_score_cannot_resolve_that_sittings_incident
