  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_listing_write
        claim_type: optimistic_concurrency
        grounds: [entities.Listing.fields.version, state_machines.Listing.transitions.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Listing.version starts at 1 on create and increments by 1 on activate (and every subsequent mutation)."
        test_recipe:
          setup: ["A DRAFT listing with a lockbox."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3045" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "123 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id, v1: $.data.version }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB21" }
              as: ListingAgent
              as_user_id: "${la_id}"
          trigger:
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v2: $.data.version }
          assert:
            - "version was 1 on create and is 2 after activate (incremented by 1)"

      - name: stale_close_after_contingency_bubble_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[listing-close-stale-listing]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Closing with a stale expected_listing_version (the version observed before a contingency resolution bubbled the listing PENDING) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Listing UNDER_CONTRACT, accepted offer with one INSPECTION contingency PENDING; agent observed listing version pre-resolution."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3046" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3047" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "124 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB22" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: ["INSPECTION"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v_obs: $.data.version }
            - call: "GET /offers/${off_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { ins_id: "$.data[0].id" }
            - call: "POST /contingencies/${ins_id}/waive"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
          trigger:
            - call: "POST /listings/${lst_id}/close"
              payload: { expected_listing_version: "${v_obs}" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_VERSION (412) — the waive bubbled the listing to PENDING and bumped version past v_obs"

      - name: accept_with_contingencies_materializes_them
        claim_type: cascading_side_effects
        grounds: [state_machines.Offer.transitions.OPEN_to_ACCEPTED, entities.Contingency, "endpoints.GET_/offers/{offerId}/contingencies"]
        distinguishing_aspect: "Accepting an offer requesting INSPECTION+FINANCING materializes exactly two PENDING contingencies of those kinds; listing stays UNDER_CONTRACT (not PENDING)."
        test_recipe:
          setup: ["ACTIVE listing with a buyer (income/debt sufficient); offer requests INSPECTION+FINANCING."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3048" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3049" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000, prequalified_amount_cents: 50000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "125 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB23" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: ["INSPECTION", "FINANCING"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${off_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { st: $.data.status }
          assert:
            - "Two contingencies created, kinds == {INSPECTION, FINANCING}, both status PENDING"
            - "Listing.status == UNDER_CONTRACT (not bubbled to PENDING, contingencies outstanding)"

      - name: net_sheet_provisional_vs_final_reconcile
        claim_type: dual_variant_calculation
        grounds: [calculations.net_to_seller.variants.final_net]
        excluded_because:
          difficulty_instance: dual_variant_calc / net_to_seller_provisional_vs_final_diverge
          rationale: "Provisional/final net-to-seller divergence is the body of the named §1.8 dual-variant instance."

