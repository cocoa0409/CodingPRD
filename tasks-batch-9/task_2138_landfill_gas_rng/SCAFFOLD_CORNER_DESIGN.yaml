      - name: compliance_report_returned_to_draft_completes_revision_loop
        claim_type: cyclic
        grounds: ["state_machines.ComplianceReport.RETURNED_to_DRAFT", "state_machines.ComplianceReport.DRAFT_to_SUBMITTED", "entities.ComplianceReport.fields.revision_count"]
        distinguishing_aspect: "The report walks DRAFT -> SUBMITTED -> UNDER_REVIEW -> RETURNED -> DRAFT -> SUBMITTED, returning to a state it already occupied, with revision_count stuck at 1 across the second submission."
        test_recipe:
          setup:
            - "One LandfillSite with permit_nmoc_limit_lb_per_hr 3.5."
            - "One TITLE_V_SEMIANNUAL ComplianceReport for 2026-Q3 prepared by officer-alice with nmoc_lb_per_hr_reported 2.0, taken UNDER_REVIEW by officer-bob and RETURNED by officer-bob."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /compliance-reports"
