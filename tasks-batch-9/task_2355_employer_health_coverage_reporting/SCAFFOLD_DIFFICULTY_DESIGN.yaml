          FurnishingConsent cycle PENDING -> GRANTED -> WITHDRAWN -> GRANTED on a different
          entity from the Transmittal cycle: grant_count records the round (2), and the
          withdrawal's cross-entity side effect drives the electronically furnished form to
          REDELIVERY_REQUIRED and the group to CORRECTION_OPEN, which the re-furnish then
