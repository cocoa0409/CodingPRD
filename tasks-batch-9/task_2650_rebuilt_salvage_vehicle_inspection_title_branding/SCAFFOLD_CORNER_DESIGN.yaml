# =============================================================================
# §1.9 Scaffold Corner Design — Rebuilt Salvage Vehicle Inspection & Title
# Branding. Breadth probe over SCAFFOLD.yaml §1.1–§1.7; the depth probe lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections and claim_types are taken
# verbatim from references/claim-extraction-guide.md.
#
# Logical clock default for every recipe: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_vehicle_returns_system_defaults_and_version_one
        claim_type: creation
        grounds:
          - entities.Vehicle.fields.fraud_hold
          - entities.Vehicle.fields.active_brand_code
          - entities.Vehicle.fields.open_application_count
          - endpoints[POST /v1/vehicles]
        distinguishing_aspect: "A freshly created Vehicle answers 201 with fraud_hold NONE, active_brand_code NONE, brand_history [], open_application_count 0 and version 1 — every system field seeded, none of them client-supplied."
        test_recipe:
          setup: ["empty database at the default logical clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "GET /v1/vehicles/${veh_id}"
              payload: {}
              as: StateTitleClerk
              as_user_id: "clerk-01"
          assert:
            - "the create call returned HTTP 201 with response_type == object"
            - "Vehicle.${veh_id}.vin == 1HGCM82633A007001 and body_class == SEDAN"
            - "Vehicle.${veh_id}.fraud_hold == NONE"
            - "Vehicle.${veh_id}.active_brand_code == NONE"
            - "Vehicle.${veh_id}.brand_history == []"
            - "Vehicle.${veh_id}.open_application_count == 0"
            - "Vehicle.${veh_id}.last_odometer_miles == 0"
            - "Vehicle.${veh_id}.version == 1"

      - name: get_salvage_title_returns_stored_brand_and_issue_fields
        claim_type: retrieval
        grounds:
          - entities.TitleRecord.fields.brand_code
          - entities.TitleRecord.fields.issued_at
          - entities.TitleRecord.fields.transfer_sequence
          - endpoints[GET /v1/title-records/{id}]
        distinguishing_aspect: "GET /v1/title-records/{id} returns exactly the row the create call minted: brand_code SALVAGE derived from the insurer report, issued_at stamped from the logical clock 2026-08-01T00:00:00Z, is_current true, transfer_sequence 0."
        test_recipe:
          setup: ["a vehicle with a total-loss insurer report at 80% damage ratio and the SALVAGE title minted from it"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-90001", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id }
          trigger:
            - call: "GET /v1/title-records/${title_id}"
              payload: {}
              as: StateTitleClerk
              as_user_id: "clerk-01"
          assert:
            - "response status is 200 and response_type == object"
            - "TitleRecord.${title_id}.brand_code == SALVAGE"
            - "TitleRecord.${title_id}.brand_severity == 30"
            - "TitleRecord.${title_id}.status == ACTIVE"
            - "TitleRecord.${title_id}.recognition_state == NOT_REQUESTED"
            - "TitleRecord.${title_id}.issued_at == 2026-08-01T00:00:00Z"
            - "TitleRecord.${title_id}.is_current == true and transfer_sequence == 0"
            - "TitleRecord.${title_id}.odometer_at_issue_miles == 68000"
            - "Vehicle.${veh_id}.active_brand_code == SALVAGE"

      - name: list_parts_documents_with_filter_limit_and_offset_reports_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /v1/parts-documents]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With four photograph documents on one application, GET /v1/parts-documents?application_id=…&limit=2&offset=2 returns exactly 2 rows with total_count 4 and has_more false, so the filter is applied before the window and total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["a TRAILER application in DRAFT carrying exactly four PHOTO_SET documents"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007002", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9001", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-90002", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${title_id}", declared_repair_cost_cents: 320000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "FRONT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "REAR" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "LEFT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "RIGHT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
          trigger:
            - call: "GET /v1/parts-documents"
              payload: { application_id: "${app_id}", limit: 2, offset: 2 }
              as: StateTitleClerk
              as_user_id: "clerk-01"
          assert:
            - "response status is 200 and response_type == array"
            - "exactly 2 PartsDocument rows are returned"
            - "total_count == 4"
            - "limit == 2 and offset == 2"
            - "has_more == false"
            - "every returned row has application_id == ${app_id} and part_class == PHOTO_SET"

      - name: get_application_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - endpoints[GET /v1/applications/{id}]
        distinguishing_aspect: "A syntactically valid but unknown application id resolves to ERR_APPLICATION_NOT_FOUND (404), not to an empty 200 body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
          trigger:
            - call: "GET /v1/applications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404"
            - "error_id == ERR_APPLICATION_NOT_FOUND"
            - "response_type == error and data.message is non-empty"

      - name: create_damage_report_missing_acv_cents_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /v1/damage-reports]
        distinguishing_aspect: "acv_cents is a required input with no default; omitting it fails at priority 40 with ERR_INVALID_REQUEST (400) and no InsurerDamageReport row is created."
        test_recipe:
          setup: ["one vehicle on file"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-90003", basis_code: "GROSS_ESTIMATE", repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /v1/damage-reports?vehicle_id=${veh_id} returns 0 rows"

      - name: omitting_supports_flood_defaults_the_station_to_false
        claim_type: defaults
        grounds:
          - entities.InspectionStation.fields.supports_flood
          - endpoints[POST /v1/inspection-stations]
        distinguishing_aspect: "supports_flood is optional with default false: a station created without it reads back supports_flood == false and scheduled_occupancy_count == 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /v1/inspection-stations"
              payload: { station_code: "NV-90", bay_count: 2, address_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { stn_id: $.data.id }
          trigger:
            - call: "GET /v1/inspection-stations/${stn_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "response status is 200"
            - "InspectionStation.${stn_id}.supports_flood == false"
            - "InspectionStation.${stn_id}.bay_count == 2"
            - "InspectionStation.${stn_id}.scheduled_occupancy_count == 0"

      - name: computed_damage_ratio_written_on_report_creation
        claim_type: computed_fields
        grounds:
          - calculations.damage_threshold_evaluation
          - entities.InsurerDamageReport.fields.damage_ratio
          - entities.InsurerDamageReport.fields.recommended_brand_code
        excluded_because:
          difficulty_instance: dual_variant_calc / damage_basis_variant_flips_recommended_brand_on_identical_damage
          rationale: "That §1.8 instance already asserts damage_ratio and recommended_brand_code as computed outputs of POST /v1/damage-reports under both basis variants, including the literal ratios."

      - name: system_fields_id_created_at_and_version_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Rebuilder.fields.license_status
          - endpoints[POST /v1/rebuilders]
          - endpoints[GET /v1/rebuilders/{id}]
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server: a rebuilder created at the default clock reads back created_at == 2026-08-01T00:00:00Z, version == 1, license_status == ACTIVE and every money counter at 0."
        test_recipe:
          setup: ["empty database at the default logical clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9002", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
          trigger:
            - call: "GET /v1/rebuilders/${rb_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "Rebuilder.${rb_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "the captured ${rb_v} equals 1"
            - "Rebuilder.${rb_id}.license_status == ACTIVE"
            - "Rebuilder.${rb_id}.fees_deposited_cents == 0 and fee_balance_cents == 0"
            - "Rebuilder.${rb_id}.escrowed_fee_total_cents == 0 and fees_consumed_cents == 0"
            - "Rebuilder.${rb_id}.applications_titled_count == 0 and open_referral_count == 0"

      - name: invalid_body_class_enum_on_vehicle_create_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=40]
          - entities.Vehicle.fields.body_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "body_class is a closed enum: the value HOVERCRAFT fails at priority 40 with ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /v1/inspection-stations"
              payload: { station_code: "NV-91", bay_count: 1, address_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "HOVERCRAFT", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no Vehicle row exists with vin == 1HGCM82633A007001"

      - name: immutable_damage_report_exposes_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.InsurerDamageReport
          - endpoints[GET /v1/damage-reports/{id}]
        distinguishing_aspect: "InsurerDamageReport is declared common_fields: false — the read payload carries no version and no updated_at field, and §1.5 declares no PUT/PATCH/DELETE for /v1/damage-reports/{id}, so the insurer's filing is append-only evidence."
        test_recipe:
          setup: ["one vehicle with one insurer damage report"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-90004", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "GET /v1/damage-reports/${rep_id}"
              payload: {}
              as: InsurerAdjuster
              as_user_id: "adj-01"
          assert:
            - "response status is 200"
            - "the returned InsurerDamageReport body contains no version field and no updated_at field"
            - "the returned body still contains created_at"
            - "§1.5 declares no PUT, PATCH or DELETE route for /v1/damage-reports/{id}"
            - "InsurerDamageReport.${rep_id}.damage_ratio == 0.8000 and recommended_brand_code == SALVAGE"

      - name: parts_document_creation_under_unknown_application_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=30]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - endpoints[POST /v1/applications/{id}/parts-documents]
        distinguishing_aspect: "The path parent is resolved at priority 30 before any payload or state check, so filing a document under an unknown application id yields ERR_APPLICATION_NOT_FOUND (404) rather than ERR_APPLICATION_NOT_DRAFT."
        test_recipe:
          setup: ["a registered rebuilder and no applications at all"]
          setup_api_calls:
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9003", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /v1/applications/00000000-0000-0000-0000-000000000000/parts-documents"
              payload: { doc_type: "RECEIPT", part_class: "STRUCTURAL", source_type: "NEW", amount_cents: 200000, vendor_name: "Basin Frame Supply", part_serial_number: "SF-9001" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and error_id == ERR_APPLICATION_NOT_FOUND"
            - "error_id != ERR_APPLICATION_NOT_DRAFT"
            - "no PartsDocument row exists"

      - name: donor_parts_document_links_both_its_application_and_a_donor_title
        claim_type: parent_relationships
        grounds:
          - entities.PartsDocument.fields.donor_title_id
          - entities.PartsDocument.fields.traceable
          - validations[priority=78]
          - endpoints[GET /v1/parts-documents]
        distinguishing_aspect: "The graph topology is real: one PartsDocument hangs off its own application (application_id) while also reaching sideways into a different vehicle's ACTIVE title chain (donor_title_id), and only that second link makes traceable true."
        test_recipe:
          setup:
            - "a subject SEDAN on a SALVAGE title with a DRAFT application"
            - "a separate donor vehicle holding a clean ACTIVE title with brand_code NONE"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007001", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007009", model_year: 2018, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { donor_veh_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${donor_veh_id}", issuing_state_code: "NV", owner_name: "Vega Auto Recyclers" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { donor_title_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9004", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-9001", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-90005", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${title_id}", declared_repair_cost_cents: 800000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PARTS_INVOICE", part_class: "STRUCTURAL", source_type: "USED_DONOR", amount_cents: 300000, vendor_name: "Vega Auto Recyclers", part_serial_number: "SF-9002", donor_vin: "1HGCM82633A007009", donor_title_id: "${donor_title_id}" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /v1/parts-documents/${doc_id}/verify"
              payload: { verification_note: "donor title and stamped serial both match" }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "response status is 200"
            - "PartsDocument.${doc_id}.status == VERIFIED and traceable == true"
            - "PartsDocument.${doc_id}.application_id == ${app_id}"
            - "PartsDocument.${doc_id}.donor_title_id == ${donor_title_id}"
            - "PartsDocument.${doc_id}.verified_by_inspector_id == ${insp_id}"
            - "TitleRecord.${donor_title_id}.brand_code == NONE and status == ACTIVE"
            - "RebuiltApplication.${app_id}.documented_parts_cost_cents == 300000"
            - "GET /v1/parts-documents?donor_title_id=${donor_title_id} returns exactly 1 row"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_application_starts_in_draft_with_attempt_limit_three
        claim_type: initial_state
        grounds:
          - state_machines.RebuiltApplication
          - entities.RebuiltApplication.fields.attempt_limit
          - endpoints[POST /v1/applications]
        distinguishing_aspect: "A newly opened application lands in the declared initial_state DRAFT with attempt_limit 3, attempts_completed 0, fee_escrowed_cents 0 and assessed_fee_cents seeded to BASE_APPLICATION_FEE_CENTS 7500, and the vehicle's open_application_count moves to 1."
