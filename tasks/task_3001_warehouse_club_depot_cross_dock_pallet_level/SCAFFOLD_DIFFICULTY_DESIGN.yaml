              payload: { depot_id: "${depot_id}", run_date: "2026-09-03", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, run_v: $.data.version }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v}" }
              as: DepotPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SAME_DAY_ONLY (422): pallet.received_date 2026-09-02 != run.run_date 2026-09-03"
            - "Pallet status remains RECEIVED; no Allocation created"

      - name: chargeback_appeal_requires_owning_vendor_rep
        grounds:
          - state_machines.Chargeback.ASSESSED_to_APPEALED
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: |
          Pair (Chargeback, Vendor): appealing a chargeback requires the
          acting VendorRep's X-User-ID to equal chargeback.vendor_id — a
          cross-entity identity dependency between Chargeback and Vendor,
          distinct from the Pallet/CrossDockRun pair.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:20:00Z; two vendors V1, V2"
            - "V1 has one ASSESSED LATE_CHECKIN chargeback (checked in 20 minutes after window start, beyond the 15-minute grace)"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "Harbor", code: "HRBR", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Xi Supply", vendor_code: "V140014" }
              as: RegionalOps
              captures: { vendor1_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Omicron Trade", vendor_code: "V150015" }
              as: RegionalOps
              captures: { vendor2_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Harbor Depot", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor1_id}", delivery_date: "2026-09-01", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor1_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:20:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
              captures: { cb_cents: $.data.chargeback_cents }
            - call: "GET /wcd/chargebacks"
              payload: { appointment_id: "${appt_id}" }
              as: DepotManager
              captures: { cb_id: "$.data[0].id" }
          trigger:
            - call: "POST /wcd/chargebacks/${cb_id}/appeal"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /wcd/chargebacks/${cb_id}/appeal"
              payload: {}
              as: VendorRep
