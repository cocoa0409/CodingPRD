          assert:
            - "HTTP 403 with ${err_co} == ERR_UNAUTHORIZED"
            - "GET /markets reports total_count == 0"
            - "the identical body as PlatformAdmin pa-1 then returns HTTP 201 with market_code EU-MAD"

      - name: supplier_user_cannot_publish_another_suppliers_offer
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_SUPPLIER_SCOPE_VIOLATION]
          - roles.SupplierUser.identity
        distinguishing_aspect: "SupplierUser is entity_backed, so X-User-ID must equal the Supplier owning the target: the air supplier acting on the hotel supplier's PENDING_REVIEW offer is HTTP 403 ERR_SUPPLIER_SCOPE_VIOLATION, while the same call with its own supplier id succeeds — and reads stay unrestricted."
        test_recipe:
          setup:
            - "Two certified suppliers, each with an ACTIVE plan and one PENDING_REVIEW offer."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_sup_a
            - *c_cert_a_sub
            - *c_cert_a_rev
            - *c_cert_a_dec
            - *c_ma_a
            - *c_ma_a_act
            - *c_rp_a
            - *c_off_a
          trigger:
            - call: "POST /offers/${off}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { err_scope: $.data.error_id }
            - call: "GET /offers/${off}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_a}"
            - call: "POST /offers/${off}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
          assert:
            - "the cross-supplier publish is HTTP 403 with ${err_scope} == ERR_SUPPLIER_SCOPE_VIOLATION"
            - "the cross-supplier GET is HTTP 200 and returns the hotel offer with display_total_cents 24240"
            - "the owner publish is HTTP 200 with Offer.${off}.status == LIVE and version 2"
            - "Offer.${off_a}.status is still PENDING_REVIEW"

      - name: undeclared_role_header_returns_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "an X-User-Role outside the six declared roles is rejected as unauthenticated (401) rather than unauthorized (403), and this priority-1 check precedes existence checks so an unknown role against an unknown id still returns ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "Market EU-PAR registered."
          setup_api_calls:
            - *c_clock
            - *c_market
          trigger:
            - call: "GET /markets/${mkt}"
              payload: {}
              as: "MarketplaceIntern"
              as_user_id: "in-1"
              captures: { err_auth: $.data.error_id }
            - call: "GET /markets/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: "MarketplaceIntern"
              as_user_id: "in-1"
              captures: { err_auth2: $.data.error_id }
          assert:
            - "the first call is HTTP 401 with ${err_auth} == ERR_UNAUTHENTICATED"
            - "the second call is HTTP 401 with ${err_auth2} == ERR_UNAUTHENTICATED and not ERR_MARKET_NOT_FOUND"

      - name: offer_publish_is_shared_between_commercial_manager_and_supplier_user
        claim_type: shared_operations
        grounds:
          - roles.CommercialManager.shared_operations
          - roles.SupplierUser.shared_operations
          - endpoints[POST /offers/{id}/publish]
        distinguishing_aspect: "offer publication is a genuinely shared operation: the same endpoint succeeds for the opaque-identity CommercialManager and for the entity_backed SupplierUser on its own inventory, and both paths produce identical state (LIVE, version 2)."
        test_recipe:
          setup:
