          assert:
            - "Late cancel of ${b2} (21 h notice < 24 h): penalty_cents == 9000"
            - "The PENALTY entry's batch_id == ${bat10} (the OPEN epoch), NOT the finalized ${bat9}"
            - "Batch ${bat9} remains FINALIZED with entry_count == 1"

