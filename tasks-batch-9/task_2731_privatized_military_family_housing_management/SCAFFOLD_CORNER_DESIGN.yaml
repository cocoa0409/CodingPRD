            - "Two allotment runs have been posted: period 2026-09 (run at 2026-09-01T09:00:00Z) and period 2026-10 (run at 2026-10-01T09:00:00Z), each posting one CHARGE of 218150 to this lease."
            - "One dispute was opened, offered a 5000 credit and accepted at 2026-10-01T09:00:00Z, posting a third ledger row of type REFUND with amount_cents -5000."
            - "The ledger therefore holds exactly three rows in created_at ASC order: CHARGE 2026-09 (running 218150), CHARGE 2026-10 (running 436300), REFUND (running 431300)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
