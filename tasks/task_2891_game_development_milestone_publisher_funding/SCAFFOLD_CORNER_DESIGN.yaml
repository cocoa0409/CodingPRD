              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${other_publisher_id}", display_name: "Rho Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { rival_finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Solo", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 0, acceptance_criteria: ["Core loop playable"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
          trigger:
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: Developer
              as_user_id: "${other_studio_id}"
              captures: { foreign_studio_read_error_id: "$.data.error_id" }
            - call: "GET /development-agreements/${agreement_id}/recoupment-summary"
              payload: {}
              as: PublisherFinance
              as_user_id: "${rival_finance_id}"
              captures: { foreign_publisher_read_error_id: "$.data.error_id" }
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 75.00, crash_free_sessions_pct: 96.00, content_completeness_pct: 60.00, known_blocker_count: 5, release_notes: "Build from a foreign studio" }
              as: Developer
              as_user_id: "${other_studio_id}"
              captures: { foreign_studio_write_error_id: "$.data.error_id" }
            - call: "GET /development-agreements/${agreement_id}"
