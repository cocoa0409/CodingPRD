              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "Cm Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LLcm", payee_account: "acct-cm" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
          assert:
            - "response.status == 201"
            - "HapContract.${hc}.hap_subsidy_cents == 47400"
            - "Voucher.${vid}.status == LEASED"
            - "Household.${hh}.status == LEASED"
