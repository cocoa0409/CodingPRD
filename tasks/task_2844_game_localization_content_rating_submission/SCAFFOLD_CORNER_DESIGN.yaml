              payload: { market_plan_id: "${mp_de}", voice_talent_id: "${talent_id}", recording_booth_id: "${booth_id}", talent_contract_id: "${contract_b}", start_utc: "2026-09-10T09:00:00Z", end_utc: "2026-09-10T12:00:00Z", planned_line_count: 120 }
              as: LocalizationProducer
              captures: { mismatch_error: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id == ERR_CROSS_PARENT_MISMATCH - the contract covers NOVA-41 while the market plan belongs to NOVA-40"
            - "it is NOT ERR_CONTRACT_NOT_FOUND: the contract resolves, so priority 32 passed and 34 is what fired"
            - "RecordingBooth.${booth_id}.reserved_minutes_total == 0 and TalentContract.${contract_b}.committed_fee_cents == 500000 (unchanged by the refusal)"

  # =========================================================================
  # 2. State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Title.initial_state
          - state_machines.MarketPlan.initial_state
          - state_machines.QaPass.initial_state
          - state_machines.TalentContract.initial_state
        distinguishing_aspect: "Four machines declare four different initial states (PLANNING, DRAFT, OPEN, DRAFT) and StringKey opens at EXTRACTED; a creation endpoint must never skip ahead to the state its first action would produce."
        test_recipe:
          setup:
            - "One Title, one StringKey, one MarketPlan and one TalentContract, all freshly created and untouched."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-42", name: "Nova Drift 42", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Miki Sato", language_code: "JA", union_flag: false }
              as: LocalizationProducer
              captures: { talent_id: "$.data.id", talent_v: "$.data.version" }
          trigger:
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id", key_status: "$.data.status" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id", mp_status: "$.data.status" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_id}", territory_scope: ["JP"], media_scope: "IN_GAME_ONLY", buyout_fee_cents: 500000, per_line_rate_cents: 250, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_v}" }
              as: LocalizationProducer
              captures: { contract_id: "$.data.id", contract_status: "$.data.status" }
          assert:
            - "Title.${title_id}.localization_state == PLANNING (not STRINGS_LOCKED even though a key now exists)"
            - "StringKey.${key_id}.status == EXTRACTED"
            - "MarketPlan.${mp_jp}.status == DRAFT (not SCOPED even though scope_tier was supplied at creation)"
            - "TalentContract.${contract_id}.status == DRAFT, signed_at_utc == null and committed_fee_cents == 0 - the buyout term only appears at sign"

      - name: lock_strings_called_twice_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Title[PLANNING -> STRINGS_LOCKED]
          - errors[ERR_TITLE_STRINGS_ALREADY_LOCKED]
        distinguishing_aspect: "lock-strings is not idempotent: the second call must be a 409, and - crucially - must not re-run the cascade, so extracted_key_count and version stay exactly where the first call left them."
        test_recipe:
          setup:
            - "Title NOVA-43 with one EXTRACTED MENU key."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-43", name: "Nova Drift 43", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id" }
          trigger:
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
              captures: { locked_state: "$.data.localization_state", v_after_first: "$.data.version" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
              captures: { second_error: "$.data.error_id" }
          assert:
            - "the first call returns HTTP 200 with localization_state == STRINGS_LOCKED, string_lock == true and version == 2"
            - "StringKey.${key_id}.status == LOCKED after the first call (cascade down applied once)"
            - "the second call returns HTTP 409 with error_id == ERR_TITLE_STRINGS_ALREADY_LOCKED"
            - "Title.${title_id}.version is still 2 after the refusal - the failed transition wrote nothing"

      - name: enter_lqa_from_a_draft_market_plan_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.MarketPlan
          - validations[priority=42]
          - errors[ERR_MARKET_PLAN_STATE_INVALID]
        distinguishing_aspect: "DRAFT has exactly two outgoing edges (scope, block); enter-lqa and start-localization are not among them, so both must be refused at priority 42 by the status gate before any of the completeness rules at 59 even look at the counters."
        test_recipe:
          setup:
            - "Title NOVA-44 locked, with a DRAFT JP plan that was never scoped."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-44", name: "Nova Drift 44", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
              captures: { lqa_error: "$.data.error_id" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
              captures: { start_error: "$.data.error_id" }
          assert:
            - "both calls return HTTP 409 with error_id == ERR_MARKET_PLAN_STATE_INVALID"
            - "the enter-lqa refusal is NOT ERR_LOCALIZATION_INCOMPLETE: priority 42 outranks 59, even though required_unit_count is 0 and would also have failed that rule"
            - "MarketPlan.${mp_jp}.status stays DRAFT, text_effort_units stays 0.00 and version stays 1"
            - "GET /translation-units?market_plan_id=${mp_jp} returns meta.total_count == 0 - the start-localization cascade never ran"

      - name: blocked_market_plan_refuses_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MarketPlan.terminal_states
          - state_machines.MarketPlan[SCOPED -> BLOCKED]
          - calculations.title_release_gate_state
        distinguishing_aspect: "BLOCKED is terminal, so the three forward triggers and a second block must all fail from it - and the block itself must drive Title.release_gate_state to BLOCKED via clause 1, which outranks every other gate clause."
        test_recipe:
          setup:
            - "Title NOVA-45 locked with a SCOPED JP plan."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-45", name: "Nova Drift 45", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /market-plans/${mp_jp}/block"
              payload: { blocked_reason: "Regional counsel halted the JP launch pending a disclosure review" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { blocked_status: "$.data.status", reason: "$.data.blocked_reason" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
              captures: { start_error: "$.data.error_id" }
            - call: "POST /market-plans/${mp_jp}/block"
              payload: { blocked_reason: "second attempt" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { reblock_error: "$.data.error_id" }
          assert:
            - "the block returns HTTP 200 with status == BLOCKED and blocked_reason echoing the supplied text"
            - "Title.${title_id}.release_gate_state == BLOCKED (clause 1 of the gate chain) while localization_state stays STRINGS_LOCKED"
            - "start-localization returns HTTP 409 ERR_MARKET_PLAN_STATE_INVALID and the second block returns HTTP 409 ERR_MARKET_PLAN_STATE_INVALID"
            - "MarketPlan.${mp_jp}.blocked_reason still holds the FIRST reason - the refused re-block did not overwrite it"

      - name: market_plan_block_cancels_only_scheduled_voice_sessions
        claim_type: conditional_cascade
        grounds:
          - state_machines.MarketPlan[IN_LOCALIZATION -> BLOCKED].side_effects
          - calculations.booth_reserved_minutes_total
        distinguishing_aspect: "The cascade is conditional on child state: a SCHEDULED session is cancelled and its booth minutes released, while a RECORDED session on the same booth and talent is left untouched with its minutes still reserved. A cascade that cancelled everything would silently destroy delivered voice work."
        test_recipe:
          setup:
            - "Title NOVA-46, JP FULL_VOICE plan at IN_LOCALIZATION, booth TOK-D (buffer 30), JA talent with a SIGNED JP contract, one RECORDED session 09:00-11:00 (120 min) and one SCHEDULED session 13:00-14:30 (90 min) on 2026-09-10. Talent load 210 of 240 minutes, booth reserved 120+30 + 90+30 = 270."
