            - "the chain is strictly causal: had the fund's opening balance been 160091627 already, LEVEL 2 would mint no row (deposited 0) and LEVELS 3 and 4 would not fire at all"
            - "RatingAgencyBriefing.${brief}.published_at == 2026-08-01T00:00:00Z is preserved — staleness is not a retraction"

      - name: withdrawal_execution_cascades_ledger_then_adequacy_then_briefing_staleness
        grounds:
          - state_machines.WithdrawalRequest.APPROVED_to_EXECUTED
          - state_machines.RatingAgencyBriefing.PUBLISHED_to_STALE
          - calculations.reserve_adequacy
          - entities.ReserveFund.fields.cooling_off_until
          - endpoints[POST /withdrawal-requests/{id}/execute]
        distinguishing_aspect: |
          The same four-level shape fired by a DIFFERENT transition and in the opposite direction:
          execution mints a -15000000 WITHDRAWAL row (L1), which drops balance_cents to 56958137 and
          arms cooling_off_until 2026-09-04T00:00:00Z (L2), which re-scores coverage_ratio_bps from
          9057 to 7169 (L3), which staleness-marks the briefing published two levels earlier (L4) —
          proving the briefing cascade is triggered by a balance change of either sign, not by
          certification specifically.
