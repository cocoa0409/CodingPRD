      - name: creating_a_replacement_contract_supersedes_the_previous_signed_one
        claim_type: cross_entity
        grounds:
          - state_machines.TalentContract[SIGNED -> TERMINATED]
          - endpoints[POST /talent-contracts]
        distinguishing_aspect: "The supersede edge is driven by a sibling creation, not by an explicit terminate call: a second contract for the same (voice_talent_id, title_id) must terminate the incumbent as a side effect, while a contract for a DIFFERENT title must leave it alone."
        test_recipe:
          setup:
            - "Two Titles and one JA talent with a SIGNED contract on NOVA-49."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-49", name: "Nova Drift 49", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
