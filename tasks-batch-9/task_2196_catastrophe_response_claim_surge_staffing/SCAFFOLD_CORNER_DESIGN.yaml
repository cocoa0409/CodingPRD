      - name: corner_sm_precondition_enforcement_surge_gates_fail_in_declared_order
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CatastropheEvent.DECLARED_to_SURGE_ACTIVE
          - errors[ERR_NO_ACTIVE_HOUSING]
          - errors[ERR_LOSS_ESTIMATE_STALE]
