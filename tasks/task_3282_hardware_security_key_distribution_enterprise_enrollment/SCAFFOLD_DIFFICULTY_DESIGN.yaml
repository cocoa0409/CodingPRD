        captures:
          k6: $.data[0].id
      - call: POST /v1/organizations/${org6}/security-keys/${k6}/attest
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org6}/security-keys/${k6}/assign
        payload:
          identity_account_id: ${acct6}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org6}/security-keys/${k6}/mark-distributed
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/identity-accounts/${acct6}/enrollments
        payload:
          security_key_id: ${k6}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          en6: $.data.id
      - call: GET /v1/identity-accounts/${acct6}
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          av6: $.data.version
      - call: POST /v1/identity-accounts/${acct6}/enrollments/${en6}/activate
        payload:
          expected_identity_account_version: ${av6}
        as: SecurityAdmin
        as_user_id: seca1
      trigger:
      - call: POST /v1/organizations/${org6}/purchase-orders/${po6}/quarantine
        payload: {}
        as: SecurityAdmin
