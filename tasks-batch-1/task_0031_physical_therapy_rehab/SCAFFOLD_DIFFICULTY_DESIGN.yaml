            - call: "POST /rehab/therapists"
              payload: { full_name: "T CE B2 Not Enrolled", npi_number: "1000000072", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_b_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat CE B", date_of_birth: "1955-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_a_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_a_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_a_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_a_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_a_id}"
          trigger:
            - call: "POST /rehab/mips-measures"
              payload: { patient_id: "${pt_id}", plan_of_care_id: "${poc_id}", reporting_therapist_id: "${th_b_id}", measure_code: "MIPS128_FALL_RISK", performance_period_start: "2026-06-01", performance_period_end: "2026-06-30", numerator_met: true }
              as: Therapist
              as_user_id: "${th_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response.status == 422"
            - "trigger response.data.error_id == ERR_MIPS_ELIGIBILITY"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 8 — resource_temporal_overlap
  # Two overlap rules with DIFFERENT interval semantics on DIFFERENT resources.
  #   (A) Visit on Therapist: HALF-OPEN [start, end). Adjacent visits at the
  #       exact same instant are PERMITTED.
  #   (B) AuthorizationGrant on PlanOfCare: CLOSED-CLOSED [from, to]. Adjacent
  #       grants sharing a single day are REJECTED.
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:
      - name: therapist_double_book_half_open_adjacent_permitted
        grounds:
          - validations[priority=435]
          - errors[ERR_THERAPIST_DOUBLE_BOOKED]
          - entities.Visit
        distinguishing_aspect: |
          Visit-on-Therapist overlap uses HALF-OPEN interval semantics: the
          existing visit occupies [11:00, 12:00). A new visit at [12:00, 13:00)
          is ADJACENT (shares the instant 12:00 but the existing visit's
          half-open end excludes it) → PERMITTED. A new visit at [11:30, 12:30)
          OVERLAPS the open part → REJECTED with ERR_THERAPIST_DOUBLE_BOOKED.
          The trigger verifies BOTH halves: the adjacent visit succeeds, the
          overlapping visit fails.
        test_recipe:
          setup:
            - "1 Therapist. 2 PATIENTS (COMMERCIAL each) each with their own ACTIVE POC + Grant. 1 SCHEDULED Visit on Therapist [2026-06-10T11:00:00Z, 2026-06-10T12:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
