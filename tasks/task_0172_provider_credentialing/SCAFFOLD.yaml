    side_effects: []

  - method: GET
    path: "/votes"
    description: "List peer-review votes (filter by reviewer_id; reverse-reachability for reviewer_id FK)"
    roles: [MedicalDirector, CredentialingSpecialist, ComplianceOfficer, SystemAdmin]
