  - rule_id: cross_entity_state_dependency
    instances:

      - name: medical_decision_requires_application_in_medical_review
        grounds:
          - state_machines.Application.transitions.MEDICAL_REVIEW_to_APPROVED_INITIAL
          - validations[priority=5]
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: |
          MedicalDeterminationDecision's create transition depends on
          Application.status==MEDICAL_REVIEW. Entity pair:
          MedicalDeterminationDecision → Application. If Application is
          DRAFT, decision is rejected.
        test_recipe:
          setup:
            - "Claimant + application in DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
