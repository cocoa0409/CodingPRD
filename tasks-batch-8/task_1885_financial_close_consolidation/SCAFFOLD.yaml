# =============================================================================
# Task 1885 — Financial Close & Consolidation (corporate accounting department)
# Scaffold seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1885. Financial Close & Consolidation (corporate accounting department): close
  calendar & task dependency tracking, subledger cutoff & accrual estimation,
  intercompany elimination & currency translation, journal entry approval &
  supporting documentation, account reconciliation completion & aging of
  unreconciled items, flux analysis & variance explanation, consolidation
  adjustment & minority interest, close metrics & post-close review

domain_name: financial-close-consolidation
api_prefix: /close

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration        # close-calendar task DAG with fan-out/fan-in
  secondary_archetype: compliance_audit            # SoD on JE approval, tamper-evident trail
  complexity_layers:
    - optimistic_concurrency                       # OCC on ClosePeriod.version for run/lock/reopen
    - cascading_side_effects                       # lock → recompute → posture → task unblock chains
    - dual_variant_calculation                     # CTA current-rate vs temporal; accrual provisional vs final
    - rate_threshold_triggers                      # materiality, flux thresholds, aging buckets
    - derived_field_reconciliation                 # entity_balances, close_posture, recon aging

  entity_topology: hybrid                          # Period→Entity→(JE/Recon) tree + ElimPair cross-links
  state_machine_shape: parallel                    # ClosePeriod.close_posture is compound; JournalEntry has
                                                   # lifecycle × doc-state parallel dims; CloseTask is a DAG

  relationship_patterns:
    - one_to_many            # ClosePeriod→EntityPeriod, EntityPeriod→JournalEntry/Reconciliation/CloseTask
    - self_referential       # CloseTask.depends_on_task_ids (DAG); Entity.parent_entity_id (consolidation tree)
    - many_to_many           # ElimPair matches two JournalEntry lines across entities
    - cross_aggregate        # FluxExplanation references Reconciliation; AccrualEstimate references SubledgerCutoff

  role_model: segregation_of_duties                # Preparer ≠ Approver ≠ Poster; Controller override gated

  consistency_model: immediate                     # all mutations atomic within one request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClosePeriod
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year, e.g. 2026" }
      - { name: fiscal_period, type: integer, source: input, description: "Fiscal period 1..13 within the year", constraints: "1..13" }
      - { name: period_start, type: datetime, source: input, description: "Period start instant (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Period end instant (UTC); strictly after period_start" }
      - { name: close_posture, type: enum, source: computed, description: "OPEN | SOFT_CLOSED | HARD_CLOSED | REOPENED — derived from locked entity periods and explicit lock/reopen actions", constraints: "OPEN|SOFT_CLOSED|HARD_CLOSED|REOPENED" }
      - { name: reporting_currency, type: enum, source: input, description: "Consolidation reporting currency", constraints: "USD|EUR|GBP|JPY" }
      - { name: materiality_threshold_minor, type: integer, source: input, description: "Materiality threshold in reporting-currency minor units (cents); flux explanations and accrual true-ups at-or-above this are mandatory" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → IN_PROGRESS → UNDER_REVIEW → FINALIZED", constraints: "SCHEDULED|IN_PROGRESS|UNDER_REVIEW|FINALIZED" }
      - { name: locked_entity_count, type: integer, source: computed, description: "Count of EntityPeriod rows in HARD_LOCKED for this period" }
      - { name: total_entity_count, type: integer, source: computed, description: "Count of all EntityPeriod rows for this period" }
      - { name: reopened_reason, type: string, source: input, description: "Required reason recorded when a HARD_CLOSED period is reopened", constraints: "required only on reopen" }

  - name: Entity
    parent: null
    common_fields: true
    fields:
      - { name: entity_code, type: string, source: input, description: "Unique legal-entity code, e.g. US100, EU200", constraints: "unique across all entities" }
      - { name: name, type: string, source: input, description: "Legal entity display name" }
      - { name: functional_currency, type: enum, source: input, description: "Entity functional currency", constraints: "USD|EUR|GBP|JPY" }
      - { name: parent_entity_id, type: string, source: input, description: "FK -> Entity.id; null for the consolidation root. Forms a tree — cycles forbidden.", constraints: "nullable; must not create a cycle" }
      - { name: ownership_pct, type: number, source: input, description: "Parent's ownership percentage of this entity, 0 < pct <= 100; <100 creates an NCI (non-controlling interest) split", constraints: "0 < ownership_pct <= 100" }
      - { name: translation_method, type: enum, source: input, description: "Currency translation method: CURRENT_RATE (all balances at period-end rate, P&L at average) or TEMPORAL (monetary at period-end, non-monetary at historical rate)", constraints: "CURRENT_RATE|TEMPORAL" }
      - { name: consolidation_tier, type: integer, source: computed, description: "Depth in the entity tree: root = 0; used to order bottom-up translation chains" }
      - { name: is_elimination_counterparty, type: boolean, source: input, description: "Whether this entity participates in intercompany eliminations", default: true }

  - name: EntityPeriod
    parent: ClosePeriod
    common_fields: true
    fields:
      - { name: close_period_id, type: string, source: system, description: "FK -> ClosePeriod.id; the period this entity-row belongs to" }
      - { name: entity_id, type: string, source: system, description: "FK -> Entity.id; the legal entity for this row" }
      - { name: status, type: enum, source: system, description: "PREPARING → SUBLEDGER_CUT → RECONCILED → READY_FOR_CONSOL → SOFT_LOCKED → HARD_LOCKED / REOPENED", constraints: "PREPARING|SUBLEDGER_CUT|RECONCILED|READY_FOR_CONSOL|SOFT_LOCKED|HARD_LOCKED|REOPENED" }
      - { name: trial_balance_minor, type: integer, source: computed, description: "Sum of POSTED journal entry signed amounts in functional currency minor units" }
      - { name: translated_balance_minor, type: integer, source: computed, description: "trial_balance_minor translated to reporting currency per Entity.translation_method" }
      - { name: cta_minor, type: integer, source: computed, description: "Cumulative translation adjustment plug in reporting-currency minor units (current-rate method) or remeasurement gain/loss (temporal)" }
      - { name: nci_share_minor, type: integer, source: computed, description: "Non-controlling interest share of this entity's translated result, 0 when ownership_pct = 100" }
      - { name: unreconciled_count, type: integer, source: computed, description: "Count of Reconciliation rows not in CLEARED for this entity-period" }
      - { name: aged_over_30_count, type: integer, source: computed, description: "Count of open reconciling items aged strictly more than 30 days past period_end" }
      - { name: open_task_count, type: integer, source: computed, description: "Count of CloseTask rows for this entity-period not in DONE or WAIVED" }

  - name: CloseTask
    parent: ClosePeriod
    common_fields: true
    fields:
      - { name: close_period_id, type: string, source: system, description: "FK -> ClosePeriod.id" }
      - { name: entity_period_id, type: string, source: input, description: "FK -> EntityPeriod.id; the entity row this task tracks (nullable for period-level tasks)", constraints: "nullable" }
      - { name: task_key, type: string, source: input, description: "Stable task identifier, e.g. SL_CUTOFF, ACCRUALS, RECON_AR, TRANSLATE, ELIMINATE, CONSOLIDATE, FLUX, REVIEW" }
      - { name: title, type: string, source: input, description: "Human-readable task title" }
      - { name: depends_on_task_ids, type: array, source: input, description: "Array of CloseTask.id that must all be DONE or WAIVED before this task may start; MUST form a DAG (cycle → ERR_TASK_DEPENDENCY_CYCLE)", default: [] }
      - { name: assignee_user_id, type: string, source: input, description: "X-User-ID of the Preparer accountable for this task" }
      - { name: due_offset_hours, type: integer, source: input, description: "Hours after period_start when the task is due; used for lateness metric" }
      - { name: status, type: enum, source: system, description: "BLOCKED → READY → IN_PROGRESS → DONE / WAIVED; READY derives from dependencies", constraints: "BLOCKED|READY|IN_PROGRESS|DONE|WAIVED" }
      - { name: is_late, type: boolean, source: computed, description: "true when DONE after period_start + due_offset_hours, or when still open past that instant" }
      - { name: completed_at, type: datetime, source: system, description: "Set on transition to DONE; null otherwise", constraints: "nullable" }

  - name: SubledgerCutoff
    parent: EntityPeriod
    common_fields: true
    fields:
      - { name: entity_period_id, type: string, source: system, description: "FK -> EntityPeriod.id" }
      - { name: subledger, type: enum, source: input, description: "Which subledger is being cut off", constraints: "AR|AP|INVENTORY|FIXED_ASSETS|PAYROLL" }
      - { name: cutoff_at, type: datetime, source: input, description: "Cutoff instant; transactions strictly before cutoff_at belong to this period" }
      - { name: cutoff_rule, type: enum, source: input, description: "INCLUSIVE (>= cutoff_at excluded, < included) vs EXCLUSIVE_AT_END — governs boundary transactions exactly at cutoff_at", constraints: "INCLUSIVE|EXCLUSIVE_AT_END" }
      - { name: status, type: enum, source: system, description: "OPEN → CUT → CONFIRMED", constraints: "OPEN|CUT|CONFIRMED" }
      - { name: pre_cutoff_total_minor, type: integer, source: computed, description: "Sum of subledger transaction amounts strictly inside the period per cutoff_rule" }
      - { name: boundary_transaction_count, type: integer, source: computed, description: "Count of subledger transactions whose timestamp equals cutoff_at exactly (boundary set)" }

  - name: AccrualEstimate
    parent: EntityPeriod
    common_fields: true
    fields:
      - { name: entity_period_id, type: string, source: system, description: "FK -> EntityPeriod.id" }
      - { name: subledger_cutoff_id, type: string, source: input, description: "FK -> SubledgerCutoff.id; the cutoff this estimate is computed against" }
      - { name: account_code, type: string, source: input, description: "GL account the accrual targets, e.g. 6100-SALARIES" }
      - { name: basis, type: enum, source: input, description: "Estimation basis: PRIOR_3M_AVG, PRIOR_PERIOD, DAYS_OUTSTANDING", constraints: "PRIOR_3M_AVG|PRIOR_PERIOD|DAYS_OUTSTANDING" }
      - { name: provisional_amount_minor, type: integer, source: computed, description: "Provisional estimate in functional-currency minor units, computed at SUBLEDGER_CUT time" }
      - { name: final_amount_minor, type: integer, source: input, description: "Final actual amount entered at true-up; null until then", constraints: "nullable" }
      - { name: true_up_delta_minor, type: integer, source: computed, description: "final_amount_minor - provisional_amount_minor; sign preserved" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL → TRUED_UP → POSTED", constraints: "PROVISIONAL|TRUED_UP|POSTED" }

  - name: JournalEntry
    parent: EntityPeriod
    common_fields: true
    fields:
      - { name: entity_period_id, type: string, source: system, description: "FK -> EntityPeriod.id" }
      - { name: je_type, type: enum, source: input, description: "MANUAL | ACCRUAL | RECLASS | ELIMINATION | CONSOLIDATION_ADJ | TOP_SIDE", constraints: "MANUAL|ACCRUAL|RECLASS|ELIMINATION|CONSOLIDATION_ADJ|TOP_SIDE" }
      - { name: entry_date, type: datetime, source: input, description: "Effective date; must fall within [period_start, period_end] of the parent ClosePeriod (ERR_JE_OUT_OF_PERIOD otherwise)" }
      - { name: preparer_user_id, type: string, source: system, description: "X-User-ID of the Preparer who created the entry (captured from header)" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the Approver who approved; must differ from preparer_user_id (SoD)", constraints: "nullable until approved" }
      - { name: debit_total_minor, type: integer, source: computed, description: "Sum of line amounts where direction=DEBIT, functional-currency minor units" }
      - { name: credit_total_minor, type: integer, source: computed, description: "Sum of line amounts where direction=CREDIT" }
      - { name: functional_currency, type: enum, source: input, description: "Currency the lines are denominated in; must equal Entity.functional_currency (ERR_JE_CCY_MISMATCH otherwise)", constraints: "USD|EUR|GBP|JPY" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → POSTED / REJECTED; REJECTED → DRAFT rework loop allowed", constraints: "DRAFT|SUBMITTED|APPROVED|POSTED|REJECTED" }
      - { name: doc_state, type: enum, source: computed, description: "Parallel dimension: DOC_MISSING → DOC_ATTACHED → DOC_VERIFIED; independent of approval status", constraints: "DOC_MISSING|DOC_ATTACHED|DOC_VERIFIED" }
      - { name: rejection_reason, type: string, source: input, description: "Reason supplied on reject; required when rejecting", constraints: "nullable" }
      - { name: posted_at, type: datetime, source: system, description: "Set when status becomes POSTED; immutable afterwards", constraints: "nullable" }

  - name: JournalEntryLine
    parent: JournalEntry
    common_fields: true
    fields:
      - { name: journal_entry_id, type: string, source: system, description: "FK -> JournalEntry.id" }
      - { name: line_no, type: integer, source: input, description: "Line sequence number within the entry, 1-based" }
      - { name: account_code, type: string, source: input, description: "GL account code for this line" }
      - { name: direction, type: enum, source: input, description: "DEBIT | CREDIT", constraints: "DEBIT|CREDIT" }
      - { name: amount_minor, type: integer, source: input, description: "Absolute line amount in functional-currency minor units; must be > 0 (ERR_LINE_NOT_POSITIVE)" }
      - { name: counterparty_entity_id, type: string, source: input, description: "FK -> Entity.id; set only on ELIMINATION-type lines to identify the intercompany counterparty", constraints: "nullable" }
      - { name: memo, type: string, source: input, description: "Free-text line memo", constraints: "nullable" }

  - name: SupportingDocument
    parent: JournalEntry
    common_fields: true
    fields:
      - { name: journal_entry_id, type: string, source: system, description: "FK -> JournalEntry.id" }
      - { name: file_name, type: string, source: input, description: "Attachment file name" }
      - { name: content_hash, type: string, source: input, description: "SHA-256 hex of the attachment; two documents on the same JE with identical content_hash are duplicates (ERR_DOC_DUPLICATE)" }
      - { name: doc_category, type: enum, source: input, description: "INVOICE | CONTRACT | BANK_STATEMENT | SCHEDULE | OTHER", constraints: "INVOICE|CONTRACT|BANK_STATEMENT|SCHEDULE|OTHER" }
      - { name: uploaded_by_user_id, type: string, source: system, description: "X-User-ID of the uploader" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the Approver who verified; must differ from uploaded_by_user_id when uploader is also an Approver (SoD on verification)", constraints: "nullable until verified" }
      - { name: status, type: enum, source: system, description: "ATTACHED → VERIFIED / REJECTED", constraints: "ATTACHED|VERIFIED|REJECTED" }

  - name: Reconciliation
    parent: EntityPeriod
    common_fields: true
    fields:
      - { name: entity_period_id, type: string, source: system, description: "FK -> EntityPeriod.id" }
      - { name: account_code, type: string, source: input, description: "GL account being reconciled" }
      - { name: recon_type, type: enum, source: input, description: "BANK | INTERCOMPANY | SUBLEDGER_GL | SUSPENSE", constraints: "BANK|INTERCOMPANY|SUBLEDGER_GL|SUSPENSE" }
      - { name: gl_balance_minor, type: integer, source: input, description: "GL balance for the account at period end, functional-currency minor units" }
      - { name: subledger_balance_minor, type: integer, source: input, description: "Independent subledger/source balance for the account" }
      - { name: difference_minor, type: integer, source: computed, description: "gl_balance_minor - subledger_balance_minor; sign preserved" }
      - { name: is_within_tolerance, type: boolean, source: computed, description: "true when abs(difference_minor) <= recon_tolerance_minor constant (500)" }
      - { name: status, type: enum, source: system, description: "OPEN → IN_REVIEW → CLEARED / STALE", constraints: "OPEN|IN_REVIEW|CLEARED|STALE" }
      - { name: cleared_by_user_id, type: string, source: system, description: "X-User-ID who cleared; must differ from the user who moved it to IN_REVIEW (SoD)", constraints: "nullable until cleared" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID who moved OPEN → IN_REVIEW", constraints: "nullable" }

  - name: ReconcilingItem
    parent: Reconciliation
    common_fields: true
    fields:
      - { name: reconciliation_id, type: string, source: system, description: "FK -> Reconciliation.id" }
      - { name: description, type: string, source: input, description: "Item description, e.g. 'Deposit in transit'" }
      - { name: amount_minor, type: integer, source: input, description: "Signed item amount in functional-currency minor units; may be negative" }
      - { name: item_date, type: datetime, source: input, description: "Date the item originated; drives aging buckets" }
      - { name: aging_bucket, type: enum, source: computed, description: "CURRENT (<= period_end) | AGE_1_30 | AGE_31_60 | AGE_61_90 | AGE_OVER_90 — days past parent period_end", constraints: "CURRENT|AGE_1_30|AGE_31_60|AGE_61_90|AGE_OVER_90" }
      - { name: status, type: enum, source: system, description: "OPEN → RESOLVED / WRITTEN_OFF", constraints: "OPEN|RESOLVED|WRITTEN_OFF" }
      - { name: resolved_at, type: datetime, source: system, description: "Set on RESOLVED or WRITTEN_OFF", constraints: "nullable" }

  - name: ElimPair
    parent: ClosePeriod
    common_fields: true
    fields:
      - { name: close_period_id, type: string, source: system, description: "FK -> ClosePeriod.id" }
      - { name: entity_period_id_a, type: string, source: input, description: "FK -> EntityPeriod.id; first side of the intercompany pair" }
      - { name: entity_period_id_b, type: string, source: input, description: "FK -> EntityPeriod.id; second side; must differ from entity_period_id_a and belong to a different Entity (ERR_ELIM_SAME_ENTITY)" }
      - { name: account_code, type: string, source: input, description: "Intercompany account being eliminated, e.g. 1500-IC_AR" }
      - { name: amount_a_minor, type: integer, source: input, description: "Side-A balance in side-A functional currency" }
      - { name: amount_b_minor, type: integer, source: input, description: "Side-B balance in side-B functional currency (mirror sign expected)" }
      - { name: eliminated_amount_minor, type: integer, source: computed, description: "min(abs(amount_a), abs(amount_b)) after translating both to reporting currency; the smaller absolute side is what can be eliminated" }
      - { name: residual_minor, type: integer, source: computed, description: "abs(amount_a) - abs(amount_b) in reporting currency; non-zero residual above tolerance blocks READY_FOR_CONSOL" }
      - { name: status, type: enum, source: system, description: "PROPOSED → MATCHED → ELIMINATED / DISPUTED", constraints: "PROPOSED|MATCHED|ELIMINATED|DISPUTED" }

  - name: FluxExplanation
    parent: EntityPeriod
    common_fields: true
    fields:
      - { name: entity_period_id, type: string, source: system, description: "FK -> EntityPeriod.id" }
      - { name: account_code, type: string, source: input, description: "Account whose period-over-period movement is explained" }
      - { name: prior_balance_minor, type: integer, source: input, description: "Prior-period balance in functional currency" }
      - { name: current_balance_minor, type: integer, source: input, description: "Current-period balance in functional currency" }
      - { name: variance_minor, type: integer, source: computed, description: "current_balance_minor - prior_balance_minor" }
      - { name: variance_pct, type: number, source: computed, description: "abs(variance_minor) / max(abs(prior_balance_minor), 1) * 100; denominator floored at 1 to avoid div-by-zero" }
      - { name: requires_explanation, type: boolean, source: computed, description: "true when abs(variance_minor) >= materiality_threshold_minor OR variance_pct >= flux_pct_threshold (10.0)" }
      - { name: explanation_text, type: string, source: input, description: "Narrative explanation; required before CLEARED when requires_explanation", constraints: "nullable" }
      - { name: reconciliation_id, type: string, source: input, description: "FK -> Reconciliation.id; optional link to the reconciliation evidencing the variance", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN → EXPLAINED → ACCEPTED / REJECTED", constraints: "OPEN|EXPLAINED|ACCEPTED|REJECTED" }

  - name: FxRate
    parent: null
    common_fields: true
    fields:
      - { name: close_period_id, type: string, source: system, description: "FK -> ClosePeriod.id; rates are scoped per period" }
      - { name: from_currency, type: enum, source: input, description: "Source currency", constraints: "USD|EUR|GBP|JPY" }
      - { name: to_currency, type: enum, source: input, description: "Target currency", constraints: "USD|EUR|GBP|JPY" }
      - { name: rate_kind, type: enum, source: input, description: "PERIOD_END | AVERAGE | HISTORICAL", constraints: "PERIOD_END|AVERAGE|HISTORICAL" }
      - { name: rate, type: number, source: input, description: "Multiplicative rate: to_amount = from_amount * rate; must be > 0", constraints: "> 0" }
      - { name: effective_at, type: datetime, source: input, description: "Instant the rate is effective; HISTORICAL rates selected by latest effective_at <= transaction date" }

  - name: CloseEvent
    parent: ClosePeriod
    common_fields: false
    fields:
      - { name: close_period_id, type: string, source: system, description: "FK -> ClosePeriod.id" }
      - { name: entity_period_id, type: string, source: system, description: "FK -> EntityPeriod.id; null for period-level events", constraints: "nullable" }
      - { name: event_kind, type: enum, source: system, description: "PERIOD_OPENED | SUBLEDGER_CUT | ACCRUAL_POSTED | JE_POSTED | RECON_CLEARED | TASK_DONE | TRANSLATION_RUN | ELIMINATION_RUN | SOFT_LOCK | HARD_LOCK | REOPENED | REVIEW_FINALIZED", constraints: "PERIOD_OPENED|SUBLEDGER_CUT|ACCRUAL_POSTED|JE_POSTED|RECON_CLEARED|TASK_DONE|TRANSLATION_RUN|ELIMINATION_RUN|SOFT_LOCK|HARD_LOCK|REOPENED|REVIEW_FINALIZED" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID that caused the event, or 'system'" }
      - { name: detail, type: string, source: system, description: "Structured detail string (JSON) of before/after values" }
      # append-only audit log: common_fields false → only id + created_at

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClosePeriod
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    note: "close_posture (OPEN/SOFT_CLOSED/HARD_CLOSED/REOPENED) is a COMPOUND derived dimension, orthogonal to status; it recomputes on every EntityPeriod lock transition and on explicit reopen."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /close/periods/{id}/open"
        actor: Controller
        preconditions:
          - "current logical clock >= period_start (ERR_PERIOD_NOT_YET_OPEN)"
          - "no other ClosePeriod with status IN_PROGRESS or UNDER_REVIEW exists (ERR_PERIOD_ALREADY_OPEN) — only one open close at a time"
        side_effects:
          - "create one EntityPeriod (status=PREPARING) per Entity with is_elimination_counterparty or not — every registered Entity gets a row"
          - "close_posture := OPEN"
          - "append CloseEvent PERIOD_OPENED"
          - "increments ClosePeriod.version by 1"

      - from: IN_PROGRESS
        to: UNDER_REVIEW
        trigger: "POST /close/periods/{id}/hard-lock"
        actor: Controller
        preconditions:
          - "expected_close_period_version matches ClosePeriod.version (OCC, ERR_STALE_PERIOD_VERSION)"
          - "every EntityPeriod for this period is SOFT_LOCKED (transitions each to HARD_LOCKED inside the same request)"
          - "every ElimPair for this period is ELIMINATED or DISPUTED-with-residual-within-tolerance (residual_minor abs <= 500)"
          - "every FluxExplanation with requires_explanation=true is ACCEPTED"
        side_effects:
          - "each EntityPeriod: SOFT_LOCKED → HARD_LOCKED"
          - "close_posture := HARD_CLOSED"
          - "locked_entity_count := total_entity_count"
          - "append CloseEvent HARD_LOCK"
          - "increments ClosePeriod.version by 1"

      - from: UNDER_REVIEW
        to: FINALIZED
        trigger: "POST /close/periods/{id}/finalize"
        actor: Controller
        preconditions:
          - "expected_close_period_version matches ClosePeriod.version (OCC)"
          - "post-close review checklist complete: at least one CloseEvent of kind REVIEW_FINALIZED absent — finalize itself appends it"
          - "no EntityPeriod in REOPENED"
        side_effects:
          - "status := FINALIZED (terminal)"
          - "append CloseEvent REVIEW_FINALIZED"
          - "compute close metrics (late tasks, aged items, days-to-close) — snapshot onto CloseEvent.detail"
          - "increments ClosePeriod.version by 1"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /close/periods/{id}/soft-lock — posture-only transition, status unchanged"
        actor: Controller
        preconditions:
          - "expected_close_period_version matches ClosePeriod.version (OCC)"
          - "every EntityPeriod is READY_FOR_CONSOL or beyond"
          - "close_posture is currently OPEN or REOPENED"
        side_effects:
          - "each EntityPeriod READY_FOR_CONSOL → SOFT_LOCKED"
          - "close_posture := SOFT_CLOSED"
          - "append CloseEvent SOFT_LOCK"
          - "increments ClosePeriod.version by 1"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /close/periods/{id}/reopen — reopens a SOFT_CLOSED period (status stays IN_PROGRESS)"
        actor: Controller
        preconditions:
          - "expected_close_period_version matches ClosePeriod.version (OCC)"
          - "close_posture is SOFT_CLOSED (a HARD_CLOSED/UNDER_REVIEW period cannot be reopened — ERR_PERIOD_HARD_LOCKED)"
          - "reopened_reason non-empty (ERR_REOPEN_REASON_REQUIRED)"
        side_effects:
          - "each SOFT_LOCKED EntityPeriod → REOPENED"
          - "close_posture := REOPENED"
          - "append CloseEvent REOPENED with detail=reopened_reason"
          - "increments ClosePeriod.version by 1"

  - entity: EntityPeriod
    initial_state: PREPARING
    terminal_states: [HARD_LOCKED]
    note: "REOPENED is a non-terminal sideways state reachable only from SOFT_LOCKED via period reopen; from REOPENED the entity must re-walk RECONCILED → READY_FOR_CONSOL → SOFT_LOCKED."
    transitions:
      - from: PREPARING
        to: SUBLEDGER_CUT
        trigger: "system — fires when ALL SubledgerCutoff rows for this entity-period reach CONFIRMED"
        actor: system
        preconditions:
          - "at least one SubledgerCutoff exists for the entity-period (ERR_NO_SUBLEDGER_CUTOFF on advance attempt otherwise)"
        side_effects:
          - "recompute every AccrualEstimate.provisional_amount_minor per accrual_estimation rule"
          - "append CloseEvent SUBLEDGER_CUT"

      - from: SUBLEDGER_CUT
        to: RECONCILED
        trigger: "POST /close/entity-periods/{id}/mark-reconciled"
        actor: Preparer
        preconditions:
          - "all Reconciliation rows for this entity-period in CLEARED, or in OPEN/IN_REVIEW with is_within_tolerance=true (auto-tolerated); any row outside tolerance and not CLEARED → ERR_RECON_OUTSTANDING"
          - "all AccrualEstimate rows POSTED or TRUED_UP with abs(true_up_delta_minor) < materiality_threshold_minor; a true-up delta at-or-above materiality left unposted → ERR_ACCRUAL_MATERIAL_TRUEUP"
        side_effects:
          - "unreconciled_count recomputed (must be 0 or all tolerated)"

      - from: RECONCILED
        to: READY_FOR_CONSOL
        trigger: "POST /close/entity-periods/{id}/ready"
        actor: Preparer
        preconditions:
          - "every CloseTask on this entity-period is DONE or WAIVED (ERR_OPEN_CLOSE_TASKS)"
          - "every ElimPair touching this entity-period is MATCHED or ELIMINATED with abs(residual_minor) <= 500 (ERR_ELIM_RESIDUAL_EXCEEDED)"
          - "translated_balance_minor has been computed at least once for this period (a translation run exists) (ERR_TRANSLATION_NOT_RUN)"
        side_effects:
          - "recompute nci_share_minor per minority_interest rule"
          - "bubble-up: if ALL sibling EntityPeriods are READY_FOR_CONSOL or beyond, ClosePeriod becomes eligible for soft-lock (checked on soft-lock call)"

      - from: READY_FOR_CONSOL
        to: SOFT_LOCKED
        trigger: "system — via POST /close/periods/{id}/soft-lock when all siblings ready"
        actor: system
        preconditions:
          - "every sibling EntityPeriod READY_FOR_CONSOL or beyond"
        side_effects:
          - "ClosePeriod.locked_entity_count recomputed"

      - from: SOFT_LOCKED
        to: HARD_LOCKED
        trigger: "system — via POST /close/periods/{id}/hard-lock"
        actor: system
        preconditions:
          - "all siblings SOFT_LOCKED"
        side_effects:
          - "entity row becomes immutable (all child POST endpoints reject with ERR_PERIOD_HARD_LOCKED)"

      - from: SOFT_LOCKED
        to: REOPENED
        trigger: "system — via POST /close/periods/{id}/reopen"
        actor: system
        preconditions:
          - "ClosePeriod.close_posture == SOFT_CLOSED"
        side_effects:
          - "child JournalEntry in POSTED stay POSTED (history preserved); new JEs may again be drafted"
          - "translated_balance_minor and cta_minor marked stale — a fresh translation run is required before READY_FOR_CONSOL again"

      - from: REOPENED
        to: RECONCILED
        trigger: "POST /close/entity-periods/{id}/mark-reconciled"
        actor: Preparer
        preconditions:
          - "same reconciliation gates as SUBLEDGER_CUT → RECONCILED"
          - "a fresh translation run has occurred after the reopen (ERR_TRANSLATION_STALE)"
        side_effects:
          - "unreconciled_count recomputed"

  - entity: CloseTask
    initial_state: BLOCKED
    terminal_states: [DONE, WAIVED]
    note: "BLOCKED → READY is system-derived from depends_on_task_ids closure; tasks with empty depends_on_task_ids start READY. WAIVED is a Controller-only escape for non-critical tasks and is audited."
    transitions:
      - from: BLOCKED
        to: READY
        trigger: "system — dependency closure: every task in depends_on_task_ids reaches DONE or WAIVED"
        actor: system
        preconditions:
          - "for every tid in depends_on_task_ids: CloseTask[tid].status in {DONE, WAIVED}"
        side_effects: []

      - from: READY
        to: IN_PROGRESS
        trigger: "POST /close/tasks/{id}/start"
        actor: Preparer
        preconditions:
          - "X-User-ID == assignee_user_id (ERR_NOT_TASK_ASSIGNEE)"
          - "parent ClosePeriod.close_posture in {OPEN, REOPENED} (ERR_POSTURE_NOT_OPEN)"
        side_effects: []

      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /close/tasks/{id}/complete"
        actor: Preparer
        preconditions:
          - "X-User-ID == assignee_user_id (ERR_NOT_TASK_ASSIGNEE)"
          - "task-key completion gate: RECON_* tasks require the linked reconciliation CLEARED; TRANSLATE requires a translation run this period; ELIMINATE requires all ElimPairs resolved"
        side_effects:
          - "completed_at := now; is_late recomputed"
          - "append CloseEvent TASK_DONE"
          - "cascade: for every dependent CloseTask whose depends_on_task_ids ⊆ {DONE,WAIVED}, flip BLOCKED → READY (fan-out to next DAG layer)"

      - from: READY
        to: WAIVED
        trigger: "POST /close/tasks/{id}/waive"
        actor: Controller
        preconditions:
          - "task_key NOT in {TRANSLATE, ELIMINATE, CONSOLIDATE} — critical-path tasks cannot be waived (ERR_TASK_NOT_WAIVABLE)"
          - "ClosePeriod.close_posture in {OPEN, REOPENED}"
        side_effects:
          - "cascade: dependent tasks re-evaluate BLOCKED → READY (WAIVED counts as satisfied)"

      - from: IN_PROGRESS
        to: READY
        trigger: "POST /close/tasks/{id}/unstart — send back to READY (rework loop)"
        actor: Preparer
        preconditions:
          - "X-User-ID == assignee_user_id"
        side_effects: []

  - entity: SubledgerCutoff
    initial_state: OPEN
    terminal_states: [CONFIRMED]
    transitions:
      - from: OPEN
        to: CUT
        trigger: "POST /close/subledger-cutoffs/{id}/cut"
        actor: Preparer
        preconditions:
          - "parent EntityPeriod.status == PREPARING"
          - "cutoff_at within (period_start, period_end] (ERR_CUTOFF_OUT_OF_PERIOD)"
        side_effects:
          - "compute pre_cutoff_total_minor per subledger_cutoff_totals rule honoring cutoff_rule boundary semantics"
          - "compute boundary_transaction_count"

      - from: CUT
        to: CONFIRMED
        trigger: "POST /close/subledger-cutoffs/{id}/confirm"
        actor: Approver
        preconditions:
          - "X-User-ID != the Preparer who performed cut (SoD — ERR_SOD_VIOLATION)"
        side_effects:
          - "when ALL cutoffs for the entity-period CONFIRMED → parent EntityPeriod PREPARING → SUBLEDGER_CUT (bubble-up cascade)"

  - entity: AccrualEstimate
    initial_state: PROVISIONAL
    terminal_states: [POSTED]
    transitions:
      - from: PROVISIONAL
        to: TRUED_UP
        trigger: "POST /close/accruals/{id}/true-up"
        actor: Preparer
        preconditions:
          - "final_amount_minor provided"
          - "parent EntityPeriod.status in {SUBLEDGER_CUT, RECONCILED, REOPENED}"
        side_effects:
          - "true_up_delta_minor := final_amount_minor - provisional_amount_minor"
          - "if abs(true_up_delta_minor) >= materiality_threshold_minor the entity-period is blocked from RECONCILED until a balancing JE posts (ERR_ACCRUAL_MATERIAL_TRUEUP surfaced at mark-reconciled)"

      - from: TRUED_UP
        to: POSTED
        trigger: "POST /close/accruals/{id}/post — generates a balancing ACCRUAL JournalEntry for the true-up delta"
        actor: Preparer
        preconditions:
          - "abs(true_up_delta_minor) > 0 (a zero delta posts nothing — ERR_ACCRUAL_ZERO_DELTA; a zero-delta accrual is closed by POST directly from PROVISIONAL with no JE)"
        side_effects:
          - "create JournalEntry (je_type=ACCRUAL, DRAFT) with a single DEBIT and CREDIT line of abs(true_up_delta_minor) each to account_code and the accrual-contra account"
          - "append CloseEvent ACCRUAL_POSTED"

      - from: PROVISIONAL
        to: POSTED
        trigger: "POST /close/accruals/{id}/post with final_amount_minor equal to provisional (zero-delta close)"
        actor: Preparer
        preconditions:
          - "true_up_delta_minor == 0 or final never supplied"
        side_effects:
          - "no JournalEntry created"

  - entity: JournalEntry
    initial_state: DRAFT
    terminal_states: [POSTED, REJECTED]
    note: "REJECTED → DRAFT rework loop makes this machine cyclic. doc_state is a PARALLEL dimension (DOC_MISSING → DOC_ATTACHED → DOC_VERIFIED) evolved by SupportingDocument events; APPROVED requires doc_state == DOC_VERIFIED."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /close/journal-entries/{id}/submit"
        actor: Preparer
        preconditions:
          - "debit_total_minor == credit_total_minor and both > 0 (ERR_JE_UNBALANCED)"
          - "parent EntityPeriod.status in {PREPARING, SUBLEDGER_CUT, RECONCILED, REOPENED} (ERR_PERIOD_LOCKED)"
          - "doc_state != DOC_MISSING for je_type in {MANUAL, TOP_SIDE} — at least one SupportingDocument attached (ERR_DOC_REQUIRED)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /close/journal-entries/{id}/approve"
        actor: Approver
        preconditions:
          - "X-User-ID != preparer_user_id (SoD — ERR_SOD_VIOLATION)"
          - "doc_state == DOC_VERIFIED (ERR_DOC_NOT_VERIFIED)"
          - "parent EntityPeriod not SOFT_LOCKED/HARD_LOCKED"
        side_effects:
          - "approver_user_id := X-User-ID"

      - from: APPROVED
        to: POSTED
        trigger: "POST /close/journal-entries/{id}/post"
        actor: Preparer
        preconditions:
          - "X-User-ID != approver_user_id (SoD — poster differs from approver)"
          - "parent EntityPeriod.status in {PREPARING, SUBLEDGER_CUT, RECONCILED, REOPENED}"
        side_effects:
          - "posted_at := now"
          - "EntityPeriod.trial_balance_minor recomputed per trial_balance rule"
          - "translated_balance_minor and cta_minor marked stale (ERR_TRANSLATION_STALE on readiness until re-run)"
          - "append CloseEvent JE_POSTED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /close/journal-entries/{id}/reject"
        actor: Approver
        preconditions:
          - "rejection_reason non-empty (ERR_REJECTION_REASON_REQUIRED)"
          - "X-User-ID != preparer_user_id (SoD)"
        side_effects:
          - "rejection_reason recorded"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /close/journal-entries/{id}/rework"
        actor: Preparer
        preconditions:
          - "X-User-ID == preparer_user_id (only the original preparer reworks)"
        side_effects:
          - "rejection_reason cleared"
          - "doc_state reset to DOC_ATTACHED if any ATTACHED docs remain, else DOC_MISSING"

  - entity: SupportingDocument
    initial_state: ATTACHED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: ATTACHED
        to: VERIFIED
        trigger: "POST /close/documents/{id}/verify"
        actor: Approver
        preconditions:
          - "parent JournalEntry.status in {DRAFT, SUBMITTED}"
          - "X-User-ID != uploaded_by_user_id when the uploader holds an Approver-capable role (SoD)"
        side_effects:
          - "bubble-up: parent JournalEntry.doc_state := DOC_VERIFIED when ALL non-REJECTED docs VERIFIED"

      - from: ATTACHED
        to: REJECTED
        trigger: "POST /close/documents/{id}/reject"
        actor: Approver
        preconditions: []
        side_effects:
          - "parent JournalEntry.doc_state recomputed (may drop from DOC_ATTACHED to DOC_MISSING if this was the only doc)"

  - entity: Reconciliation
    initial_state: OPEN
    terminal_states: [CLEARED, STALE]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /close/reconciliations/{id}/review"
        actor: Preparer
        preconditions:
          - "parent EntityPeriod.status in {SUBLEDGER_CUT, REOPENED}"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"

      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /close/reconciliations/{id}/clear"
        actor: Preparer
        preconditions:
          - "X-User-ID != reviewed_by_user_id (SoD — clearer differs from reviewer; ERR_SOD_VIOLATION)"
          - "either is_within_tolerance == true, or all ReconcilingItem rows in {RESOLVED, WRITTEN_OFF} and recomputed difference within tolerance (ERR_RECON_UNRESOLVED_ITEMS)"
        side_effects:
          - "cleared_by_user_id := X-User-ID"
          - "EntityPeriod.unreconciled_count recomputed"
          - "append CloseEvent RECON_CLEARED"

      - from: IN_REVIEW
        to: OPEN
        trigger: "POST /close/reconciliations/{id}/return — send back for rework"
        actor: Preparer
        preconditions: []
        side_effects:
          - "reviewed_by_user_id cleared"

      - from: OPEN
        to: STALE
        trigger: "system — when logical clock exceeds period_end + 30 days and reconciliation still OPEN"
        actor: system
        preconditions:
          - "now > period_end + 30 days"
        side_effects:
          - "EntityPeriod.aged_over_30_count recomputed; STALE rows block RECONCILED (ERR_RECON_OUTSTANDING)"

  - entity: ReconcilingItem
    initial_state: OPEN
    terminal_states: [RESOLVED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /close/reconciling-items/{id}/resolve"
        actor: Preparer
        preconditions:
          - "parent Reconciliation.status in {OPEN, IN_REVIEW}"
        side_effects:
          - "resolved_at := now; parent difference_minor recomputed (item removed from open set)"

      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /close/reconciling-items/{id}/write-off"
        actor: Approver
        preconditions:
          - "abs(amount_minor) < materiality_threshold_minor (items at-or-above materiality cannot be written off — ERR_WRITEOFF_ABOVE_MATERIALITY)"
          - "aging_bucket in {AGE_31_60, AGE_61_90, AGE_OVER_90} (CURRENT and AGE_1_30 items are too young to write off — ERR_WRITEOFF_TOO_YOUNG)"
        side_effects:
          - "resolved_at := now; parent difference_minor recomputed"
          - "generate WRITEOFF-style MANUAL JournalEntry in DRAFT on the same entity-period"

  - entity: ElimPair
    initial_state: PROPOSED
    terminal_states: [ELIMINATED, DISPUTED]
    transitions:
      - from: PROPOSED
        to: MATCHED
        trigger: "POST /close/elim-pairs/{id}/match"
        actor: Preparer
        preconditions:
          - "both sides' EntityPeriod.status in {RECONCILED, READY_FOR_CONSOL, REOPENED}"
          - "abs(residual_minor) computable — FxRate rows exist for any non-reporting functional currencies (ERR_FX_RATE_MISSING)"
        side_effects:
          - "eliminated_amount_minor and residual_minor recomputed per intercompany_elimination rule"

      - from: MATCHED
        to: ELIMINATED
        trigger: "POST /close/elim-pairs/{id}/eliminate"
        actor: Preparer
        preconditions:
          - "abs(residual_minor) <= 500 (elimination tolerance; above → ERR_ELIM_RESIDUAL_EXCEEDED)"
        side_effects:
          - "create ELIMINATION JournalEntry (APPROVED, auto-balanced) booking eliminated_amount_minor against account_code on both entity-periods"
          - "append CloseEvent ELIMINATION_RUN"

      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /close/elim-pairs/{id}/dispute"
        actor: Preparer
        preconditions: []
        side_effects:
          - "DISPUTED pairs with abs(residual_minor) > 500 block every touched EntityPeriod from READY_FOR_CONSOL"

  - entity: FluxExplanation
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED]
    note: "REJECTED → OPEN rework loop (cyclic)."
    transitions:
      - from: OPEN
        to: EXPLAINED
        trigger: "POST /close/flux/{id}/explain"
        actor: Preparer
        preconditions:
          - "explanation_text non-empty (ERR_EXPLANATION_REQUIRED)"
        side_effects: []

      - from: EXPLAINED
        to: ACCEPTED
        trigger: "POST /close/flux/{id}/accept"
        actor: Controller
        preconditions:
          - "if reconciliation_id set, that Reconciliation must be CLEARED (ERR_FLUX_RECON_NOT_CLEARED)"
        side_effects: []

      - from: EXPLAINED
        to: REJECTED
        trigger: "POST /close/flux/{id}/reject"
        actor: Controller
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: OPEN
        trigger: "POST /close/flux/{id}/reopen"
        actor: Preparer
        preconditions: []
        side_effects:
          - "explanation_text cleared"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — all pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: period-soft-lock-stale-version
    parent_entity: ClosePeriod
    write_endpoint: "POST /close/periods/{id}/soft-lock"
    occ_field: "expected_close_period_version"
    description: |
      Soft-locking a ClosePeriod whose version has advanced since the caller
      last read it is rejected: a JE posted in between bumped trial balances
      and the lock decision must be taken against the freshest aggregate.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

  - rule_id: period-hard-lock-stale-version
    parent_entity: ClosePeriod
    write_endpoint: "POST /close/periods/{id}/hard-lock"
    occ_field: "expected_close_period_version"
    description: |
      Hard-locking against a stale ClosePeriod.version is rejected: the caller's
      snapshot of entity readiness is no longer authoritative once any mutation
      (including a cascaded EntityPeriod change) has bumped the period version.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

  - rule_id: period-reopen-stale-version
    parent_entity: ClosePeriod
    write_endpoint: "POST /close/periods/{id}/reopen"
    occ_field: "expected_close_period_version"
    description: |
      Reopening a SOFT_CLOSED period against a stale ClosePeriod.version is
      rejected: a subsequent soft-lock attempt or task waiver may have already
      changed the aggregate the caller based the reopen decision on.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

  - rule_id: period-finalize-stale-version
    parent_entity: ClosePeriod
    write_endpoint: "POST /close/periods/{id}/finalize"
    occ_field: "expected_close_period_version"
    description: |
      Finalizing against a stale ClosePeriod.version is rejected: finalization
      snapshots close metrics computed from the current aggregate state, which
      the caller has not observed.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trial_balance
    trigger: "JournalEntry transitions to POSTED; also on any JE reversal"
    algorithm: aggregation
    formula: |
      trial_balance_minor = SUM over JournalEntry j of EntityPeriod
        WHERE j.status == POSTED
        of ( SUM(j.lines where direction=DEBIT, amount_minor)
             - SUM(j.lines where direction=CREDIT, amount_minor) )
      Lines of je_type=ELIMINATION are INCLUDED in the entity trial balance.
      Recompute is full (not incremental) on every POST to avoid drift.
    input_set: "JournalEntry rows with status=POSTED under one EntityPeriod; DRAFT/SUBMITTED/APPROVED/REJECTED excluded"
    constants: {}
    precision: "integer minor units; no rounding"

  - name: currency_translation
    trigger: "POST /close/entity-periods/{id}/translate (translation run); required after any JE post or reopen"
    algorithm: dual_variant rate selection
    formula: |
      Inputs: trial_balance_minor (functional), Entity.translation_method,
              FxRate rows for (functional -> reporting) of kind PERIOD_END,
              AVERAGE, and (for TEMPORAL) HISTORICAL.

      CURRENT_RATE variant (Entity.translation_method == CURRENT_RATE):
        translated_balance_minor = ROUND(trial_balance_minor * PERIOD_END.rate)
        cta_minor = translated_balance_minor
                     - ROUND(trial_balance_minor * AVERAGE.rate)
        (CTA is the current-rate plug: the gap between period-end and
         average-rate translation, booked to equity.)

      TEMPORAL variant (Entity.translation_method == TEMPORAL):
        Monetary accounts translate at PERIOD_END; non-monetary at the
        HISTORICAL rate with latest effective_at <= ClosePeriod.period_end.
        The scaffold models the JE population as a single aggregate with a
        declared monetary_fraction (default 1.0 for pure cash/IC accounts);
        for benchmark determinism the temporal split is:
        monetary_minor = ROUND(trial_balance_minor * MONETARY_FRACTION)
        nonmonetary_minor = trial_balance_minor - monetary_minor
        translated_balance_minor = ROUND(monetary_minor * PERIOD_END.rate)
                                   + ROUND(nonmonetary_minor * HISTORICAL.rate)
        cta_minor = 0  (temporal remeasurement hits P&L, not CTA; the
        difference vs current-rate translation is a remeasurement gain/loss,
        surfaced as remeasurement_minor = translated_current_rate - translated_temporal)

      The two variants produce DIFFERENT translated_balance_minor and
      cta_minor for identical inputs whenever PERIOD_END.rate != AVERAGE.rate
      or HISTORICAL.rate != PERIOD_END.rate.
    input_set: "one EntityPeriod + its Entity + FxRate rows scoped to the parent ClosePeriod; missing rate → ERR_FX_RATE_MISSING"
    constants:
      MONETARY_FRACTION: 1.0
    precision: "ROUND = round_half_up to integer minor units; per-component rounding before summation (temporal), so ROUND(m) + ROUND(n), NOT ROUND(m+n)"
    variants:
      - name: current_rate
        when: "Entity.translation_method == CURRENT_RATE"
        difference: "single rate for balance; CTA plug = end-rate minus average-rate translation"
      - name: temporal
        when: "Entity.translation_method == TEMPORAL"
        difference: "monetary at end rate, non-monetary at historical; cta_minor forced to 0; remeasurement difference surfaced instead"

  - name: translation_chain
    trigger: "POST /close/periods/{id}/consolidate — bottom-up multi-entity roll-up"
    algorithm: topological
    formula: |
      Process entities in increasing consolidation_tier (children before
      parents — a translation chain). For each EntityPeriod, translate per
      currency_translation, THEN add each child's translated_balance_minor
      into its parent Entity's consolidated view. Chains of length >= 2
      (grandchild -> parent -> root) must apply rates hop-by-hop: a
      grandchild in JPY under a parent in EUR under a USD root translates
      JPY->EUR at the EUR-scoped rate, then the EUR aggregate -> USD.
      Evaluation order pinned: tier ASC; ties within a tier broken by
      Entity.created_at ASC (never id).
      Cycle in parent_entity_id chain → rejected at Entity create/update
      (ERR_ENTITY_HIERARCHY_CYCLE), so the topological order always exists.
    input_set: "all EntityPeriods of a ClosePeriod with status >= RECONCILED"
    constants: {}
    precision: "round_half_up at each hop; no double-rounding — carry full precision within a hop, round only on write"
    variants: []

  - name: intercompany_elimination
    trigger: "ElimPair match / eliminate"
    algorithm: waterfall_allocation
    formula: |
      Translate both sides to reporting currency first:
        a_rep = ROUND(abs(amount_a_minor) * rateA)
        b_rep = ROUND(abs(amount_b_minor) * rateB)
      eliminated_amount_minor = MIN(a_rep, b_rep)
      residual_minor = a_rep - b_rep      (signed: positive means side A larger)
      Elimination covers only the smaller absolute side; the residual is the
      intercompany out-of-balance that must be investigated. Eliminate
      requires abs(residual_minor) <= ELIM_TOLERANCE.
      Rounding order pinned: translate-and-round EACH side independently,
      then take MIN — never translate the MIN of the raw amounts.
    input_set: "one ElimPair + FxRate rows for both sides (identity rate 1.0 when a side is already in reporting currency)"
    constants:
      ELIM_TOLERANCE: 500
    precision: "integer minor units, round_half_up per side before MIN"
    variants: []

  - name: minority_interest
    trigger: "EntityPeriod → READY_FOR_CONSOL; and consolidate run"
    algorithm: threshold
    formula: |
      nci_share_minor = ROUND(translated_balance_minor
                              * (100 - ownership_pct) / 100)
      when ownership_pct == 100 → nci_share_minor = 0 exactly.
      Parent's share = translated_balance_minor - nci_share_minor
      (subtraction AFTER rounding of the NCI share — pinned order so
      parent + NCI always re-adds to translated_balance_minor exactly).
      Consolidation at a tier sums own translated balance plus children's
      PARENT-share portions only; NCI portions aggregate into a separate
      consolidated NCI line.
    input_set: "EntityPeriod rows with a computed translated_balance_minor; Entity.ownership_pct"
    constants: {}
    precision: "round_half_up to integer minor; NCI rounded first, parent share = residual"
    variants: []

  - name: accrual_estimation
    trigger: "EntityPeriod PREPARING → SUBLEDGER_CUT (system); also re-runnable via POST /close/accruals/{id}/recompute while PROVISIONAL"
    algorithm: dual_variant historical-average
    formula: |
      PRIOR_3M_AVG basis:
        provisional = ROUND( (sum of the account's posted JE net amounts over
                              the 3 ClosePeriods immediately preceding this one)
                             / 3 )
        Requires exactly 3 prior periods; fewer → fall back per variant below.
      PRIOR_PERIOD basis:
        provisional = prior single period's posted net amount (no division).
      DAYS_OUTSTANDING basis:
        provisional = ROUND( daily_run_rate * days_between(cutoff_at, period_end) )
        where daily_run_rate = pre_cutoff_total_minor / elapsed_days_in_period.

      Dual-variant: PROVISIONAL (system-computed at cut) vs FINAL
      (preparer-supplied at true-up). They differ whenever actuals diverge
      from the historical average; true_up_delta_minor captures the gap and
      at-or-above materiality forces a posted balancing JE.
    input_set: "posted JEs to account_code across prior periods; SubledgerCutoff.pre_cutoff_total_minor"
    constants:
      PRIOR_WINDOW: 3
    precision: "integer minor units, round_half_up; division performed once at the end (sum-then-divide-then-round), never per-period-rounded-then-averaged"
    variants:
      - name: provisional
        when: "at SUBLEDGER_CUT"
        difference: "system-computed from historical basis"
      - name: final
        when: "at true-up"
        difference: "preparer-entered actual; delta vs provisional drives materiality gate"

  - name: recon_aging
    trigger: "ReconcilingItem create; logical clock advance; period reopen"
    algorithm: threshold
    formula: |
      days_past = floor( (now_or_resolved_at - period_end) / 86400 ) evaluated
      at the earlier of logical clock now and resolved_at; for OPEN items now.
      bucket:
        item_date <= period_end AND days_past <= 0      -> CURRENT
        1   <= days_past <= 30                          -> AGE_1_30
        31  <= days_past <= 60                          -> AGE_31_60
        61  <= days_past <= 90                          -> AGE_61_90
        days_past >= 91                                 -> AGE_OVER_90
      Boundary precision: exactly 30 days past → AGE_1_30 (not 31_60);
      exactly 31 → AGE_31_60; exactly 90 → AGE_61_90; exactly 91 → AGE_OVER_90.
      aged_over_30_count counts buckets AGE_31_60 and beyond (days_past >= 31).
    input_set: "ReconcilingItem rows of one Reconciliation with status=OPEN"
    constants:
      DAY_SECONDS: 86400
    precision: "integer day boundaries, half-open [lo, hi] per bucket except CURRENT"
    variants: []

  - name: flux_variance
    trigger: "FluxExplanation create/update; materiality change"
    algorithm: threshold
    formula: |
      variance_minor = current_balance_minor - prior_balance_minor
      variance_pct = abs(variance_minor) / MAX(abs(prior_balance_minor), 1) * 100
      requires_explanation = (abs(variance_minor) >= materiality_threshold_minor)
                             OR (variance_pct >= FLUX_PCT_THRESHOLD)
      Boundary: variance exactly AT materiality → required (>= not >).
      prior_balance_minor == 0 with any nonzero current → pct = abs(var)*100
      (denominator floored at 1), virtually always >= 10 → required.
      pct exactly 10.0 → required (>=).
    input_set: "one FluxExplanation row + parent ClosePeriod.materiality_threshold_minor"
    constants:
      FLUX_PCT_THRESHOLD: 10.0
    precision: "variance_pct to 2 decimal places, round_half_up; comparison uses the rounded value"
    variants: []

  - name: close_metrics
    trigger: "ClosePeriod finalize"
    algorithm: aggregation
    formula: |
      days_to_close = floor( (finalize_time - period_end) / 86400 )
      late_task_count = count CloseTask where is_late == true
      task_completion_pct = ROUND( DONE+WAIVED count / total count * 100, 2 )
      aged_item_count = sum EntityPeriod.aged_over_30_count
      open_item_value_minor = sum of amount_minor over ReconcilingItem still OPEN
      All computed at finalize instant against current state; snapshot is
      written into the REVIEW_FINALIZED CloseEvent.detail.
    input_set: "all CloseTask / ReconcilingItem / EntityPeriod rows of the period at finalize time"
    constants: {}
    precision: "pct to 2 decimals round_half_up; counts integer"
    variants: []

  - name: subledger_cutoff_totals
    trigger: "SubledgerCutoff OPEN → CUT"
    algorithm: chronological boundary filter
    formula: |
      Let T = cutoff_at.
      INCLUSIVE rule: include transactions with ts < T (strictly before);
                      a transaction exactly at T is EXCLUDED (belongs to next
                      period). boundary_transaction_count counts ts == T.
      EXCLUSIVE_AT_END rule: include ts <= T (at T INCLUDED); boundary count
                      still ts == T but those amounts are inside the total.
      pre_cutoff_total_minor = SUM(amount) over included transactions.
      The two rules disagree on exactly the boundary set — same subledger
      data yields totals differing by the sum of ts==T transactions.
      Period eligibility additionally requires ts >= period_start.
      Tie-order inside the sum is irrelevant (addition); ordering only
      matters for audit replay, which uses (ts ASC, created_at ASC).
    input_set: "subledger transactions injected via POST /close/_subledger/seed for the entity-period's entity and subledger"
    constants: {}
    precision: "integer minor units"
    variants:
      - name: inclusive_boundary
        when: "cutoff_rule == INCLUSIVE"
        difference: "ts == T excluded from this period"
      - name: exclusive_at_end
        when: "cutoff_rule == EXCLUSIVE_AT_END"
        difference: "ts == T included"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated ids exist and belong to their declared parents (left-to-right: period before entity-period before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "OCC: expected_close_period_version (when an endpoint declares it) equals ClosePeriod.version"
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    applies_to: "POST /close/periods/{id}/soft-lock, hard-lock, reopen, finalize"

  - priority: 5
    category: state
    check: "Target resource's state machine permits the requested transition from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: actor X-User-ID must differ from the complementary role's recorded user (JE approve vs preparer; JE post vs approver; cutoff confirm vs cutter; recon clear vs reviewer; doc verify vs uploader)"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "approve, post, confirm, clear, verify endpoints"

  - priority: 7
    category: business_safety
    check: "Close posture / period lock: no JE draft/submit/post, recon change, or task start on a SOFT_LOCKED/HARD_LOCKED/FINALIZED period or entity (hard-lock also yields ERR_PERIOD_HARD_LOCKED where specified)"
    error_id: ERR_PERIOD_LOCKED
    http_status: 409
    applies_to: "journal-entries, reconciliations, tasks, accruals mutation endpoints"

  - priority: 8
    category: business_constraint
    check: "Structural integrity: task dependency DAG acyclic (ERR_TASK_DEPENDENCY_CYCLE); entity hierarchy acyclic (ERR_ENTITY_HIERARCHY_CYCLE); JE balanced (ERR_JE_UNBALANCED); elim pair spans two distinct entities (ERR_ELIM_SAME_ENTITY); duplicate doc hash on one JE (ERR_DOC_DUPLICATE)"
    error_id: "ERR_TASK_DEPENDENCY_CYCLE | ERR_ENTITY_HIERARCHY_CYCLE | ERR_JE_UNBALANCED | ERR_ELIM_SAME_ENTITY | ERR_DOC_DUPLICATE"
    http_status: 409
    applies_to: "tasks create/update, entities create, journal-entries submit, elim-pairs create, documents attach"

  - priority: 9
    category: business_temporal
    check: "Temporal windows: entry_date within [period_start, period_end] (ERR_JE_OUT_OF_PERIOD); cutoff_at within (period_start, period_end] (ERR_CUTOFF_OUT_OF_PERIOD); period not open before period_start (ERR_PERIOD_NOT_YET_OPEN); write-off aging gates (ERR_WRITEOFF_TOO_YOUNG)"
    error_id: "ERR_JE_OUT_OF_PERIOD | ERR_CUTOFF_OUT_OF_PERIOD | ERR_PERIOD_NOT_YET_OPEN | ERR_WRITEOFF_TOO_YOUNG"
    http_status: 409
    applies_to: "journal-entries create, subledger-cutoffs cut, periods open, reconciling-items write-off"

  - priority: 10
    category: business_referential
    check: "Cross-entity prerequisites: FX rate present (ERR_FX_RATE_MISSING); translation run exists/fresh (ERR_TRANSLATION_NOT_RUN / ERR_TRANSLATION_STALE); linked reconciliation cleared before flux accept (ERR_FLUX_RECON_NOT_CLEARED); task assignee matches (ERR_NOT_TASK_ASSIGNEE)"
    error_id: "ERR_FX_RATE_MISSING | ERR_TRANSLATION_NOT_RUN | ERR_TRANSLATION_STALE | ERR_FLUX_RECON_NOT_CLEARED | ERR_NOT_TASK_ASSIGNEE"
    http_status: 409
    applies_to: "translate, ready, elim match, flux accept, tasks start/complete"

  - priority: 11
    category: business_fiscal
    check: "Aggregate/money gates: reconciliations within tolerance or cleared (ERR_RECON_OUTSTANDING); material accrual true-up posted (ERR_ACCRUAL_MATERIAL_TRUEUP); elim residual within tolerance (ERR_ELIM_RESIDUAL_EXCEEDED); write-off below materiality (ERR_WRITEOFF_ABOVE_MATERIALITY); open tasks done before ready (ERR_OPEN_CLOSE_TASKS); no subledger cutoff present (ERR_NO_SUBLEDGER_CUTOFF); zero-delta accrual post (ERR_ACCRUAL_ZERO_DELTA); required narrative fields (ERR_EXPLANATION_REQUIRED, ERR_REJECTION_REASON_REQUIRED, ERR_REOPEN_REASON_REQUIRED, ERR_DOC_REQUIRED, ERR_DOC_NOT_VERIFIED); only one period open at a time (ERR_PERIOD_ALREADY_OPEN)"
    error_id: "ERR_RECON_OUTSTANDING | ERR_ACCRUAL_MATERIAL_TRUEUP | ERR_ELIM_RESIDUAL_EXCEEDED | ERR_WRITEOFF_ABOVE_MATERIALITY | ERR_OPEN_CLOSE_TASKS | ERR_NO_SUBLEDGER_CUTOFF | ERR_ACCRUAL_ZERO_DELTA | ERR_EXPLANATION_REQUIRED | ERR_REJECTION_REASON_REQUIRED | ERR_REOPEN_REASON_REQUIRED | ERR_DOC_REQUIRED | ERR_DOC_NOT_VERIFIED | ERR_PERIOD_ALREADY_OPEN"
    http_status: 409
    applies_to: "mark-reconciled, ready, eliminate, write-off, post accrual, submit, reject, reopen, explain, periods open"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/close/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time before any set call."
    roles: [Controller]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["re-evaluate Reconciliation STALE auto-transition and CloseTask.is_late against the new now"]

  # --- subledger transaction seeding (test-driving) ---
  - method: POST
    path: "/close/_subledger/seed"
    description: "Inject a raw subledger transaction used by cutoff totals. Business surface has no other way to create subledger transactions, so this is the declared feed."
    roles: [Controller]
    code: 201
    input: [entity_id, subledger, ts, amount_minor, account_code]
    output: "{ subledger_txn_id: string }"
    side_effects: []

  # --- ClosePeriod ---
  - method: POST
    path: "/close/periods"
    description: "Create a close period (status=SCHEDULED, posture computed OPEN)"
    roles: [Controller]
    code: 201
    input: [fiscal_year, fiscal_period, period_start, period_end, reporting_currency, materiality_threshold_minor]
    output: ClosePeriod
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/close/periods/{id}"
    description: "Get one ClosePeriod"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: ClosePeriod
    side_effects: []

  - method: GET
    path: "/close/periods"
    description: "List ClosePeriods with pagination"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ClosePeriod[]
    side_effects: []

  - method: POST
    path: "/close/periods/{id}/open"
    description: "Open the period (SCHEDULED → IN_PROGRESS), spawning one EntityPeriod per Entity"
    roles: [Controller]
    code: 200
    input: []
    output: ClosePeriod
    side_effects: ["EntityPeriod fan-out create", "close_posture=OPEN", "CloseEvent PERIOD_OPENED", "increments ClosePeriod.version by 1"]

  - method: POST
    path: "/close/periods/{id}/soft-lock"
    description: "Soft-lock: all READY_FOR_CONSOL EntityPeriods → SOFT_LOCKED; posture SOFT_CLOSED"
    roles: [Controller]
    code: 200
    input: [expected_close_period_version]
    output: ClosePeriod
    side_effects: ["EntityPeriod cascade to SOFT_LOCKED", "CloseEvent SOFT_LOCK", "increments ClosePeriod.version by 1"]

  - method: POST
    path: "/close/periods/{id}/hard-lock"
    description: "Hard-lock: all SOFT_LOCKED → HARD_LOCKED; status UNDER_REVIEW; posture HARD_CLOSED"
    roles: [Controller]
    code: 200
    input: [expected_close_period_version]
    output: ClosePeriod
    side_effects: ["EntityPeriod cascade to HARD_LOCKED", "CloseEvent HARD_LOCK", "increments ClosePeriod.version by 1"]

  - method: POST
    path: "/close/periods/{id}/reopen"
    description: "Reopen a SOFT_CLOSED period back to REOPENED (SOFT_LOCKED → REOPENED per entity)"
    roles: [Controller]
    code: 200
    input: [expected_close_period_version, reopened_reason]
    output: ClosePeriod
    side_effects: ["EntityPeriod cascade to REOPENED", "translation staleness flagged", "CloseEvent REOPENED", "increments ClosePeriod.version by 1"]

  - method: POST
    path: "/close/periods/{id}/finalize"
    description: "Finalize an UNDER_REVIEW period: compute close metrics snapshot"
    roles: [Controller]
    code: 200
    input: [expected_close_period_version]
    output: ClosePeriod
    side_effects: ["close_metrics computed and snapshotted", "CloseEvent REVIEW_FINALIZED", "increments ClosePeriod.version by 1"]

  - method: POST
    path: "/close/periods/{id}/consolidate"
    description: "Run the bottom-up translation chain + NCI roll-up across the entity tree"
    roles: [Controller]
    code: 200
    input: []
    output: "{ consolidated_balance_minor: integer, consolidated_nci_minor: integer, consolidated_cta_minor: integer, tiers_processed: integer }"
    side_effects: ["per EntityPeriod: translated_balance_minor, cta_minor, nci_share_minor recomputed per translation_chain + minority_interest"]

  - method: GET
    path: "/close/periods/{id}/events"
    description: "Audit trail: CloseEvent rows for the period (append-only)"
    roles: [Controller, Approver, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CloseEvent[]
    side_effects: []

  # --- Entity ---
  - method: POST
    path: "/close/entities"
    description: "Register a legal entity (tree node; cycle + uniqueness validated)"
    roles: [Controller]
    code: 201
    input: [entity_code, name, functional_currency, "parent_entity_id?", ownership_pct, translation_method, "is_elimination_counterparty?"]
    output: Entity
    side_effects: ["consolidation_tier computed from parent chain"]

  - method: GET
    path: "/close/entities/{id}"
    description: "Get one Entity"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: Entity
    side_effects: []

  - method: GET
    path: "/close/entities"
    description: "List Entities"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["limit?", "offset?", "parent_entity_id?"]
    output: Entity[]
    side_effects: []

  # --- EntityPeriod ---
  - method: GET
    path: "/close/entity-periods/{id}"
    description: "Get one EntityPeriod"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: EntityPeriod
    side_effects: []

  - method: GET
    path: "/close/entity-periods"
    description: "List EntityPeriods (filterable by close_period_id / entity_id / status)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["close_period_id?", "entity_id?", "status?", "limit?", "offset?"]
    output: EntityPeriod[]
    side_effects: []

  - method: POST
    path: "/close/entity-periods/{id}/translate"
    description: "Run currency translation for one entity-period (variant per Entity.translation_method)"
    roles: [Controller]
    code: 200
    input: []
    output: EntityPeriod
    side_effects: ["translated_balance_minor + cta_minor computed per currency_translation; clears translation-stale flag", "CloseEvent TRANSLATION_RUN"]

  - method: POST
    path: "/close/entity-periods/{id}/mark-reconciled"
    description: "Advance SUBLEDGER_CUT (or REOPENED) → RECONCILED after reconciliation + accrual gates"
    roles: [Preparer]
    code: 200
    input: []
    output: EntityPeriod
    side_effects: ["unreconciled_count recomputed"]

  - method: POST
    path: "/close/entity-periods/{id}/ready"
    description: "Advance RECONCILED → READY_FOR_CONSOL after task/elim/translation gates"
    roles: [Preparer]
    code: 200
    input: []
    output: EntityPeriod
    side_effects: ["nci_share_minor recomputed per minority_interest"]

  # --- CloseTask ---
  - method: POST
    path: "/close/periods/{id}/tasks"
    description: "Create a close task on the period (DAG dependency list validated acyclic)"
    roles: [Controller]
    code: 201
    input: [entity_period_id, task_key, title, "depends_on_task_ids?", assignee_user_id, due_offset_hours]
    output: CloseTask
    side_effects: ["status=READY if no deps else BLOCKED"]

  - method: GET
    path: "/close/tasks/{id}"
    description: "Get one CloseTask"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: CloseTask
    side_effects: []

  - method: GET
    path: "/close/entity-periods/{id}/tasks"
    description: "List tasks of one entity-period (FK reverse-reachability for CloseTask.entity_period_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: CloseTask[]
    side_effects: []

  - method: GET
    path: "/close/periods/{id}/tasks"
    description: "List tasks of a period (FK reverse-reachability for CloseTask.close_period_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CloseTask[]
    side_effects: []

  - method: POST
    path: "/close/tasks/{id}/start"
    description: "READY → IN_PROGRESS (assignee only, posture open)"
    roles: [Preparer]
    code: 200
    input: []
    output: CloseTask
    side_effects: []

  - method: POST
    path: "/close/tasks/{id}/complete"
    description: "IN_PROGRESS → DONE; cascades dependent tasks BLOCKED → READY"
    roles: [Preparer]
    code: 200
    input: []
    output: CloseTask
    side_effects: ["completed_at set; is_late recomputed", "dependent tasks unblock cascade", "CloseEvent TASK_DONE"]

  - method: POST
    path: "/close/tasks/{id}/waive"
    description: "READY → WAIVED (Controller only; critical tasks not waivable)"
    roles: [Controller]
    code: 200
    input: []
    output: CloseTask
    side_effects: ["dependent tasks unblock cascade"]

  - method: POST
    path: "/close/tasks/{id}/unstart"
    description: "IN_PROGRESS → READY rework loop"
    roles: [Preparer]
    code: 200
    input: []
    output: CloseTask
    side_effects: []

  # --- SubledgerCutoff ---
  - method: POST
    path: "/close/entity-periods/{id}/subledger-cutoffs"
    description: "Create a subledger cutoff spec on an entity-period"
    roles: [Preparer]
    code: 201
    input: [subledger, cutoff_at, cutoff_rule]
    output: SubledgerCutoff
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/close/entity-periods/{id}/subledger-cutoffs"
    description: "List cutoffs for an entity-period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: SubledgerCutoff[]
    side_effects: []

  - method: GET
    path: "/close/subledger-cutoffs/{id}"
    description: "Get one SubledgerCutoff (establishes the subledger-cutoffs collection segment)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: SubledgerCutoff
    side_effects: []

  - method: POST
    path: "/close/subledger-cutoffs/{id}/cut"
    description: "OPEN → CUT; compute pre_cutoff_total_minor + boundary count per cutoff_rule"
    roles: [Preparer]
    code: 200
    input: []
    output: SubledgerCutoff
    side_effects: ["subledger_cutoff_totals computed"]

  - method: POST
    path: "/close/subledger-cutoffs/{id}/confirm"
    description: "CUT → CONFIRMED (Approver; SoD vs cutter); last confirm bubbles EntityPeriod → SUBLEDGER_CUT"
    roles: [Approver]
    code: 200
    input: []
    output: SubledgerCutoff
    side_effects: ["bubble-up: when all cutoffs CONFIRMED, parent EntityPeriod PREPARING → SUBLEDGER_CUT", "accrual_estimation provisional recompute", "CloseEvent SUBLEDGER_CUT"]

  # --- AccrualEstimate ---
  - method: POST
    path: "/close/entity-periods/{id}/accruals"
    description: "Create an accrual estimate spec (status=PROVISIONAL, amount computed at SUBLEDGER_CUT)"
    roles: [Preparer]
    code: 201
    input: [subledger_cutoff_id, account_code, basis]
    output: AccrualEstimate
    side_effects: []

  - method: GET
    path: "/close/entity-periods/{id}/accruals"
    description: "List accruals for an entity-period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: AccrualEstimate[]
    side_effects: []

  - method: GET
    path: "/close/subledger-cutoffs/{id}/accruals"
    description: "List accruals computed against one cutoff (FK reverse-reachability for AccrualEstimate.subledger_cutoff_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: AccrualEstimate[]
    side_effects: []

  - method: POST
    path: "/close/accruals/{id}/true-up"
    description: "PROVISIONAL → TRUED_UP with final_amount_minor; computes true_up_delta_minor"
    roles: [Preparer]
    code: 200
    input: [final_amount_minor]
    output: AccrualEstimate
    side_effects: ["true_up_delta_minor computed; materiality gate flagged for mark-reconciled"]

  - method: POST
    path: "/close/accruals/{id}/recompute"
    description: "Recompute provisional_amount_minor for a PROVISIONAL accrual (used when the accrual spec was created after the entity-period already entered SUBLEDGER_CUT)"
    roles: [Preparer]
    code: 200
    input: []
    output: AccrualEstimate
    side_effects: ["provisional_amount_minor recomputed per accrual_estimation"]

  - method: POST
    path: "/close/accruals/{id}/post"
    description: "TRUED_UP (or zero-delta PROVISIONAL) → POSTED; nonzero delta spawns balancing ACCRUAL JournalEntry"
    roles: [Preparer]
    code: 200
    input: []
    output: AccrualEstimate
    side_effects: ["create balancing JournalEntry when delta nonzero", "CloseEvent ACCRUAL_POSTED"]

  # --- JournalEntry + lines ---
  - method: POST
    path: "/close/entity-periods/{id}/journal-entries"
    description: "Create a JE with inline lines; preparer captured from X-User-ID"
    roles: [Preparer]
    code: 201
    input: [je_type, entry_date, functional_currency, lines]
    output: JournalEntry
    side_effects: ["debit/credit totals computed; doc_state=DOC_MISSING"]

  - method: GET
    path: "/close/journal-entries/{id}"
    description: "Get one JournalEntry"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: JournalEntry
    side_effects: []

  - method: GET
    path: "/close/entity-periods/{id}/journal-entries"
    description: "List JEs for an entity-period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["status?", "je_type?", "limit?", "offset?"]
    output: JournalEntry[]
    side_effects: []

  - method: GET
    path: "/close/journal-entries/{id}/lines"
    description: "List lines of a JE (FK reverse-reachability for JournalEntryLine.journal_entry_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: JournalEntryLine[]
    side_effects: []

  - method: GET
    path: "/close/entities/{id}/journal-entry-lines"
    description: "List JE lines naming this entity as intercompany counterparty (FK reverse-reachability for JournalEntryLine.counterparty_entity_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: JournalEntryLine[]
    side_effects: []

  - method: POST
    path: "/close/journal-entries/{id}/submit"
    description: "DRAFT → SUBMITTED (balance + doc gates)"
    roles: [Preparer]
    code: 200
    input: []
    output: JournalEntry
    side_effects: []

  - method: POST
    path: "/close/journal-entries/{id}/approve"
    description: "SUBMITTED → APPROVED (Approver; SoD vs preparer; docs verified)"
    roles: [Approver]
    code: 200
    input: []
    output: JournalEntry
    side_effects: ["approver_user_id set"]

  - method: POST
    path: "/close/journal-entries/{id}/post"
    description: "APPROVED → POSTED (Preparer; SoD vs approver); recomputes trial balance, flags translation stale"
    roles: [Preparer]
    code: 200
    input: []
    output: JournalEntry
    side_effects: ["trial_balance recompute", "translation stale flag", "CloseEvent JE_POSTED"]

  - method: POST
    path: "/close/journal-entries/{id}/reject"
    description: "SUBMITTED → REJECTED (Approver; SoD; reason required)"
    roles: [Approver]
    code: 200
    input: [rejection_reason]
    output: JournalEntry
    side_effects: []

  - method: POST
    path: "/close/journal-entries/{id}/rework"
    description: "REJECTED → DRAFT (original preparer only)"
    roles: [Preparer]
    code: 200
    input: []
    output: JournalEntry
    side_effects: ["doc_state recomputed from remaining docs"]

  # --- SupportingDocument ---
  - method: POST
    path: "/close/journal-entries/{id}/documents"
    description: "Attach a supporting document to a JE (duplicate hash rejected)"
    roles: [Preparer]
    code: 201
    input: [file_name, content_hash, doc_category]
    output: SupportingDocument
    side_effects: ["parent JE doc_state → DOC_ATTACHED when first non-rejected doc attaches"]

  - method: GET
    path: "/close/journal-entries/{id}/documents"
    description: "List documents of a JE (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: SupportingDocument[]
    side_effects: []

  - method: POST
    path: "/close/documents/{id}/verify"
    description: "ATTACHED → VERIFIED (Approver; SoD vs uploader); bubbles JE doc_state to DOC_VERIFIED"
    roles: [Approver]
    code: 200
    input: []
    output: SupportingDocument
    side_effects: ["parent JE doc_state recompute"]

  - method: POST
    path: "/close/documents/{id}/reject"
    description: "ATTACHED → REJECTED; may drop JE doc_state back to DOC_MISSING"
    roles: [Approver]
    code: 200
    input: []
    output: SupportingDocument
    side_effects: ["parent JE doc_state recompute"]

  # --- Reconciliation + items ---
  - method: POST
    path: "/close/entity-periods/{id}/reconciliations"
    description: "Create a reconciliation for an account (difference + tolerance computed)"
    roles: [Preparer]
    code: 201
    input: [account_code, recon_type, gl_balance_minor, subledger_balance_minor]
    output: Reconciliation
    side_effects: ["difference_minor, is_within_tolerance computed; unreconciled_count bump"]

  - method: GET
    path: "/close/entity-periods/{id}/reconciliations"
    description: "List reconciliations for an entity-period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reconciliation[]
    side_effects: []

  - method: GET
    path: "/close/reconciliations/{id}"
    description: "Get one Reconciliation (establishes the reconciliations collection segment)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: Reconciliation
    side_effects: []

  - method: POST
    path: "/close/reconciliations/{id}/review"
    description: "OPEN → IN_REVIEW (Preparer)"
    roles: [Preparer]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["reviewed_by_user_id set"]

  - method: POST
    path: "/close/reconciliations/{id}/clear"
    description: "IN_REVIEW → CLEARED (Preparer; SoD vs reviewer; items resolved or within tolerance)"
    roles: [Preparer]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["cleared_by_user_id set", "unreconciled_count recompute", "CloseEvent RECON_CLEARED"]

  - method: POST
    path: "/close/reconciliations/{id}/return"
    description: "IN_REVIEW → OPEN rework"
    roles: [Preparer]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["reviewed_by_user_id cleared"]

  - method: POST
    path: "/close/reconciliations/{id}/items"
    description: "Add a reconciling item (aging bucket computed from item_date vs period_end)"
    roles: [Preparer]
    code: 201
    input: [description, amount_minor, item_date]
    output: ReconcilingItem
    side_effects: ["aging_bucket computed per recon_aging; parent difference recompute"]

  - method: GET
    path: "/close/reconciliations/{id}/items"
    description: "List items of a reconciliation (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: ReconcilingItem[]
    side_effects: []

  - method: GET
    path: "/close/reconciliations/{id}/flux"
    description: "List flux explanations linked to one reconciliation (FK reverse-reachability for FluxExplanation.reconciliation_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: FluxExplanation[]
    side_effects: []

  - method: GET
    path: "/close/entity-periods/{id}/events"
    description: "List audit events scoped to one entity-period (FK reverse-reachability for CloseEvent.entity_period_id)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CloseEvent[]
    side_effects: []

  - method: POST
    path: "/close/reconciling-items/{id}/resolve"
    description: "OPEN → RESOLVED"
    roles: [Preparer]
    code: 200
    input: []
    output: ReconcilingItem
    side_effects: ["parent difference recompute"]

  - method: POST
    path: "/close/reconciling-items/{id}/write-off"
    description: "OPEN → WRITTEN_OFF (Approver; materiality + aging gates); spawns write-off JE"
    roles: [Approver]
    code: 200
    input: []
    output: ReconcilingItem
    side_effects: ["parent difference recompute", "create DRAFT write-off JournalEntry on same entity-period"]

  # --- ElimPair ---
  - method: POST
    path: "/close/periods/{id}/elim-pairs"
    description: "Declare an intercompany elimination pair across two entity-periods"
    roles: [Preparer]
    code: 201
    input: [entity_period_id_a, entity_period_id_b, account_code, amount_a_minor, amount_b_minor]
    output: ElimPair
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/close/periods/{id}/elim-pairs"
    description: "List elim pairs of a period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ElimPair[]
    side_effects: []

  - method: GET
    path: "/close/entity-periods/{id}/elim-pairs"
    description: "List elim pairs touching one entity-period on either side (FK reverse-reachability for ElimPair.entity_period_id_a / entity_period_id_b)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: []
    output: ElimPair[]
    side_effects: []

  - method: POST
    path: "/close/elim-pairs/{id}/match"
    description: "PROPOSED → MATCHED; compute eliminated/residual after dual-side FX translation"
    roles: [Preparer]
    code: 200
    input: []
    output: ElimPair
    side_effects: ["intercompany_elimination computed"]

  - method: POST
    path: "/close/elim-pairs/{id}/eliminate"
    description: "MATCHED → ELIMINATED (residual within tolerance); auto-books ELIMINATION JE"
    roles: [Preparer]
    code: 200
    input: []
    output: ElimPair
    side_effects: ["ELIMINATION JournalEntry created", "CloseEvent ELIMINATION_RUN"]

  - method: POST
    path: "/close/elim-pairs/{id}/dispute"
    description: "PROPOSED → DISPUTED; out-of-tolerance dispute blocks readiness"
    roles: [Preparer]
    code: 200
    input: []
    output: ElimPair
    side_effects: []

  # --- FluxExplanation ---
  - method: POST
    path: "/close/entity-periods/{id}/flux"
    description: "Create a flux explanation row (variance + requires_explanation computed)"
    roles: [Preparer]
    code: 201
    input: [account_code, prior_balance_minor, current_balance_minor, "explanation_text?", "reconciliation_id?"]
    output: FluxExplanation
    side_effects: ["flux_variance computed"]

  - method: GET
    path: "/close/entity-periods/{id}/flux"
    description: "List flux rows for an entity-period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: FluxExplanation[]
    side_effects: []

  - method: POST
    path: "/close/flux/{id}/explain"
    description: "OPEN → EXPLAINED (narrative required)"
    roles: [Preparer]
    code: 200
    input: [explanation_text]
    output: FluxExplanation
    side_effects: []

  - method: POST
    path: "/close/flux/{id}/accept"
    description: "EXPLAINED → ACCEPTED (Controller; linked recon must be CLEARED)"
    roles: [Controller]
    code: 200
    input: []
    output: FluxExplanation
    side_effects: []

  - method: POST
    path: "/close/flux/{id}/reject"
    description: "EXPLAINED → REJECTED (Controller)"
    roles: [Controller]
    code: 200
    input: []
    output: FluxExplanation
    side_effects: []

  - method: POST
    path: "/close/flux/{id}/reopen"
    description: "REJECTED → OPEN rework loop"
    roles: [Preparer]
    code: 200
    input: []
    output: FluxExplanation
    side_effects: ["explanation_text cleared"]

  # --- FxRate ---
  - method: POST
    path: "/close/periods/{id}/fx-rates"
    description: "Register an FX rate scoped to the period"
    roles: [Controller]
    code: 201
    input: [from_currency, to_currency, rate_kind, rate, effective_at]
    output: FxRate
    side_effects: []

  - method: GET
    path: "/close/periods/{id}/fx-rates"
    description: "List FX rates of a period (FK reverse-reachability)"
    roles: [Controller, Preparer, Approver, Auditor]
    code: 200
    input: ["from_currency?", "to_currency?", "rate_kind?"]
    output: FxRate[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or required X-User-ID header missing/invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id missing or not under the declared parent" }
  - { id: ERR_STALE_PERIOD_VERSION, http: 412, condition: "expected_close_period_version does not match ClosePeriod.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine forbids the requested transition from the current state" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties: actor matches the complementary step's recorded user" }
  - { id: ERR_PERIOD_LOCKED, http: 409, condition: "Mutation attempted on a SOFT_LOCKED/HARD_LOCKED/FINALIZED period or entity-period" }
  - { id: ERR_PERIOD_HARD_LOCKED, http: 409, condition: "Reopen attempted on a HARD_CLOSED/UNDER_REVIEW/FINALIZED period" }
  - { id: ERR_PERIOD_ALREADY_OPEN, http: 409, condition: "Opening a period while another is IN_PROGRESS or UNDER_REVIEW" }
  - { id: ERR_PERIOD_NOT_YET_OPEN, http: 409, condition: "Open attempted before period_start (logical clock)" }
  - { id: ERR_REOPEN_REASON_REQUIRED, http: 409, condition: "reopened_reason empty on period reopen" }
  - { id: ERR_TASK_DEPENDENCY_CYCLE, http: 409, condition: "depends_on_task_ids introduces a cycle in the period's task DAG" }
  - { id: ERR_ENTITY_HIERARCHY_CYCLE, http: 409, condition: "parent_entity_id chain would create a cycle" }
  - { id: ERR_JE_UNBALANCED, http: 409, condition: "Submit with debit_total_minor != credit_total_minor or zero totals" }
  - { id: ERR_JE_OUT_OF_PERIOD, http: 409, condition: "entry_date outside [period_start, period_end]" }
  - { id: ERR_JE_CCY_MISMATCH, http: 409, condition: "functional_currency != parent Entity.functional_currency" }
  - { id: ERR_LINE_NOT_POSITIVE, http: 409, condition: "JournalEntryLine.amount_minor <= 0" }
  - { id: ERR_ELIM_SAME_ENTITY, http: 409, condition: "ElimPair sides resolve to the same Entity" }
  - { id: ERR_ELIM_RESIDUAL_EXCEEDED, http: 409, condition: "abs(residual_minor) > 500 on eliminate or on readiness gate" }
  - { id: ERR_DOC_DUPLICATE, http: 409, condition: "Same content_hash already attached to the same JournalEntry" }
  - { id: ERR_DOC_REQUIRED, http: 409, condition: "MANUAL/TOP_SIDE JE submitted with doc_state == DOC_MISSING" }
  - { id: ERR_DOC_NOT_VERIFIED, http: 409, condition: "Approve attempted while doc_state != DOC_VERIFIED" }
  - { id: ERR_REJECTION_REASON_REQUIRED, http: 409, condition: "Reject attempted with empty rejection_reason" }
  - { id: ERR_CUTOFF_OUT_OF_PERIOD, http: 409, condition: "cutoff_at outside (period_start, period_end]" }
  - { id: ERR_NO_SUBLEDGER_CUTOFF, http: 409, condition: "EntityPeriod cannot leave PREPARING with zero SubledgerCutoff rows" }
  - { id: ERR_ACCRUAL_ZERO_DELTA, http: 409, condition: "Post from TRUED_UP with true_up_delta_minor == 0 (use the PROVISIONAL zero-delta path)" }
  - { id: ERR_ACCRUAL_MATERIAL_TRUEUP, http: 409, condition: "mark-reconciled with an unposted true-up delta at-or-above materiality" }
  - { id: ERR_RECON_OUTSTANDING, http: 409, condition: "mark-reconciled with a non-CLEARED reconciliation outside tolerance, or any STALE reconciliation" }
  - { id: ERR_RECON_UNRESOLVED_ITEMS, http: 409, condition: "Clear attempted with OPEN items and out-of-tolerance difference" }
  - { id: ERR_WRITEOFF_ABOVE_MATERIALITY, http: 409, condition: "Write-off of an item with abs(amount_minor) >= materiality_threshold_minor" }
  - { id: ERR_WRITEOFF_TOO_YOUNG, http: 409, condition: "Write-off of an item in CURRENT or AGE_1_30 bucket" }
  - { id: ERR_FX_RATE_MISSING, http: 409, condition: "Required FxRate (kind + currency pair) absent for the period" }
  - { id: ERR_TRANSLATION_NOT_RUN, http: 409, condition: "Readiness attempted before any translation run for the entity-period" }
  - { id: ERR_TRANSLATION_STALE, http: 409, condition: "Readiness attempted after a JE post or reopen invalidated the last translation" }
  - { id: ERR_FLUX_RECON_NOT_CLEARED, http: 409, condition: "Flux accept with reconciliation_id pointing at a non-CLEARED reconciliation" }
  - { id: ERR_EXPLANATION_REQUIRED, http: 409, condition: "Flux explain with empty explanation_text" }
  - { id: ERR_NOT_TASK_ASSIGNEE, http: 409, condition: "Task start/complete/unstart by a user other than assignee_user_id" }
  - { id: ERR_POSTURE_NOT_OPEN, http: 409, condition: "Task start attempted while close_posture not in {OPEN, REOPENED}" }
  - { id: ERR_OPEN_CLOSE_TASKS, http: 409, condition: "Readiness attempted with tasks not in DONE or WAIVED" }
  - { id: ERR_TASK_NOT_WAIVABLE, http: 409, condition: "Waive attempted on TRANSLATE / ELIMINATE / CONSOLIDATE critical task" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Controller
    description: "Corporate controller: owns the close calendar, periods, entities, FX rates, locks, reopens, finalization, flux acceptance, and task waivers. Operational role not tied to a persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /close/periods — create period"
      - "POST /close/periods/{id}/open|soft-lock|hard-lock|reopen|finalize|consolidate"
      - "POST /close/entities — register entity"
      - "POST /close/periods/{id}/fx-rates — register FX rate"
      - "POST /close/periods/{id}/tasks — create close task"
      - "POST /close/tasks/{id}/waive — waive non-critical task"
      - "POST /close/entity-periods/{id}/translate — run translation"
      - "POST /close/flux/{id}/accept|reject — adjudicate flux explanations"
      - "POST /close/_clock/set_current_utc and /close/_subledger/seed — test-driving endpoints"
    shared_operations:
      - "GET endpoints (periods, entities, entity-periods, tasks, JEs, recons, elim pairs, flux, events, fx-rates)"

  - name: Preparer
    description: "Entity accountant: runs subledger cutoffs, drafts JEs and accruals, performs reconciliations, works close tasks, proposes and matches elim pairs, writes flux explanations."
    identity: opaque
    exclusive_operations:
      - "POST /close/entity-periods/{id}/subledger-cutoffs and .../cut"
      - "POST /close/entity-periods/{id}/accruals, /close/accruals/{id}/true-up|post"
      - "POST /close/entity-periods/{id}/journal-entries and submit|post|rework"
      - "POST /close/journal-entries/{id}/documents — attach docs"
      - "POST /close/entity-periods/{id}/reconciliations, review|clear|return, items add/resolve"
      - "POST /close/periods/{id}/elim-pairs, match|eliminate|dispute"
      - "POST /close/entity-periods/{id}/flux, explain|reopen"
      - "POST /close/tasks/{id}/start|complete|unstart (assignee-gated)"
      - "POST /close/entity-periods/{id}/mark-reconciled|ready"
    shared_operations:
      - "GET endpoints (same read surface as Controller)"

  - name: Approver
    description: "Senior accountant / manager: confirms cutoffs, approves JEs, verifies documents, writes off reconciling items. Never performs the preparer step on the same artifact (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /close/subledger-cutoffs/{id}/confirm"
      - "POST /close/journal-entries/{id}/approve|reject"
      - "POST /close/documents/{id}/verify|reject"
      - "POST /close/reconciling-items/{id}/write-off"
    shared_operations:
      - "GET endpoints (same read surface as Controller)"

  - name: Auditor
    description: "Read-only post-close reviewer: full GET surface including the event audit trail; no mutations."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (all read surface including /close/periods/{id}/events)"
