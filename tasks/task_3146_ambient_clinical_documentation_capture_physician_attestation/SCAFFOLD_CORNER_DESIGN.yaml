  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: corner_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without role/identity headers is rejected at priority 1 before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /ambient-clinical-documentation/patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "A request sent with no X-User-Role/X-User-ID headers returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
      - name: corner_authz_beats_existence_wrong_role_returns_403
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "A Physician (not permitted on POST /patients) calling with a body that would also fail nothing else still gets 403 — authorization precedes any deeper check."
        test_recipe:
          setup: ["A physician exists"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-V2-1", full_name: "Doc V2", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
          trigger:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-V2-1", full_name: "Pat V2" }
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_UNAUTHORIZED and HTTP status == 403 (role check precedes body validation)"
      - name: corner_non_author_physician_patch_returns_403
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Ownership: Physician B cannot edit Physician A's draft even with a fresh OCC version."
        test_recipe:
          setup: ["Draft owned by physician A; physician B exists"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-V3-1", full_name: "Pat V3" }
