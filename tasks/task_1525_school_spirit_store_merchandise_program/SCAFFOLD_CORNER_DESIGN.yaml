            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "cust-B", payment_method: CARD, lines: [ { variant_id: "${vm}", qty: 1 } ] }, as: StudentCashier, as_user_id: "cashier-01", captures: { o2: $.data.id } }
          trigger:
