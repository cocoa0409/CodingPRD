        distinguishing_aspect: "Evaluation against a scenario whose threshold is only APPROVED (never activated) fails with 409 ERR_NO_ACTIVE_THRESHOLD even though the scenario itself is ACTIVE."
        test_recipe:
          setup: ["Scenario ACTIVE (an APPROVED threshold exists) but no ACTIVE threshold version; account with firing data"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
