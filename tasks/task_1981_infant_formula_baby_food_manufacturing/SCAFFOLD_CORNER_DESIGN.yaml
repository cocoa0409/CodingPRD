scaffold_corner_design:
  # =========================================================================
  # Section 1: Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_nutrient_profile_success
        claim_type: creation
        grounds:
          - entities.NutrientProfile
          - endpoints[POST /api/v1/nutrient-profiles]
        distinguishing_aspect: "POST with all required fields creates NutrientProfile in DRAFT status with system fields populated."
        test_recipe:
          setup:
            - "Empty database. Clock at default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs:
                  - nutrient_code: "PROTEIN"
                    unit: "g"
                    min_per_100kcal: 1.80
                    max_per_100kcal: 3.50
                    target_per_100kcal: 2.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_create: $.data }
          assert:
            - "response status == 201"
            - "data.profile_code == INF-0-6M"
            - "data.status == DRAFT"
            - "data.id is non-null UUID"
            - "data.created_at is ISO 8601"
            - "data.version == 1"

      - name: get_nutrient_profile_by_id
        claim_type: retrieval
        grounds:
          - entities.NutrientProfile
          - endpoints[GET /api/v1/nutrient-profiles/{id}]
        distinguishing_aspect: "GET returns the exact same NutrientProfile that was created."
        test_recipe:
          setup:
            - "One NutrientProfile exists."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-6-12M"
                nutrient_specs:
                  - nutrient_code: "IRON"
                    unit: "mg"
                    min_per_100kcal: 1.00
                    max_per_100kcal: 2.00
                    target_per_100kcal: 1.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_get_id: $.data.id }
          trigger:
            - call: "GET /api/v1/nutrient-profiles/${np_get_id}"
              as: REGULATORY_AFFAIRS
              captures: { np_get: $.data }
          assert:
            - "data.id == ${np_get_id}"
            - "data.profile_code == INF-6-12M"
            - "data.nutrient_specs[0].nutrient_code == IRON"

      - name: list_nutrient_profiles_pagination
        claim_type: listing
        grounds:
          - entities.NutrientProfile
          - endpoints[GET /api/v1/nutrient-profiles]
          - response_envelope.pagination_fields
        distinguishing_aspect: "List endpoint returns paginated results with limit, offset, total_count, has_more."
        test_recipe:
          setup:
            - "Three NutrientProfiles exist."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.0, max_per_100kcal: 3.0, target_per_100kcal: 2.0}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-6-12M"
                nutrient_specs: [{nutrient_code: "I", unit: "mg", min_per_100kcal: 1.0, max_per_100kcal: 2.0, target_per_100kcal: 1.5}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "TODDLER-12-36M"
                nutrient_specs: [{nutrient_code: "C", unit: "mg", min_per_100kcal: 60.0, max_per_100kcal: 180.0, target_per_100kcal: 120.0}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
          trigger:
            - call: "GET /api/v1/nutrient-profiles?limit=2&offset=0"
              as: REGULATORY_AFFAIRS
              captures: { page1: $.data }
          assert:
            - "data is array with 2 items"
            - "meta has total_count == 3"
            - "meta has has_more == true"

      - name: get_nonexistent_nutrient_profile_returns_404
        claim_type: not_found
        grounds:
          - entities.NutrientProfile
          - endpoints[GET /api/v1/nutrient-profiles/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a valid UUID that does not match any resource returns 404 with ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/nutrient-profiles/00000000-0000-0000-0000-000000000000"
              as: REGULATORY_AFFAIRS
              captures: { err_404: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.NutrientProfile.fields.profile_code
          - validations[priority=20]
        distinguishing_aspect: "Omitting required field profile_code on POST returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.0, max_per_100kcal: 3.0, target_per_100kcal: 2.0}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { err_missing: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: supplier_default_qualification_status_pending
        claim_type: defaults
        grounds:
          - entities.Supplier.fields.qualification_status
        distinguishing_aspect: "Newly created Supplier defaults to qualification_status PENDING_AUDIT."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-DEFAULT"
                legal_name: "Default Test Supplier"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup_default: $.data }
          assert:
            - "data.qualification_status == PENDING_AUDIT"
            - "data.last_audit_date is null"

      - name: ingredient_lot_computed_remaining_kg
        claim_type: computed_fields
        grounds:
          - entities.IngredientLot.fields.remaining_kg
        distinguishing_aspect: "remaining_kg is system-computed, initialized to quantity_kg on creation."
        test_recipe:
          setup:
            - "A QUALIFIED Supplier and an Ingredient exist."
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-COMP"
                legal_name: "Computed Test Supplier"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup_comp_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "ING-COMP"
                ingredient_name: "Computed Ingredient"
                category: "DAIRY_BASE"
                pathogen_risk_class: "HIGH_RISK"
                storage_condition: "REFRIGERATED"
              as: QA_MANAGER
              captures: { ing_comp_id: $.data.id }
          trigger:
            - call: "POST /api/v1/ingredient-lots"
              payload:
                ingredient_id: "${ing_comp_id}"
                supplier_id: "${sup_comp_id}"
                lot_number: "LOT-COMP-001"
                quantity_kg: 250.500
                received_date: "2026-07-15T00:00:00Z"
                expiry_date: "2027-07-15T00:00:00Z"
              as: SUPPLY_CHAIN_PLANNER
              captures: { lot_comp: $.data }
          assert:
            - "data.remaining_kg == 250.500 (initialized to quantity_kg)"
            - "data.qc_status == PENDING_QC"

      - name: system_fields_input_ignored_on_create
        claim_type: system_fields
        grounds:
          - entities.NutrientProfile
        distinguishing_aspect: "id, created_at, updated_at, version are system-generated; input values for these are ignored."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "PUREE-4M"
                nutrient_specs: [{nutrient_code: "V", unit: "mg", min_per_100kcal: 5.0, max_per_100kcal: 25.0, target_per_100kcal: 15.0}]
                regulation_ref: "EU 2016/127"
                effective_from: "2026-01-01T00:00:00Z"
                id: "should-be-ignored"
                version: 99
              as: REGULATORY_AFFAIRS
              captures: { np_sys: $.data }
          assert:
            - "data.id != 'should-be-ignored' (system-minted UUID)"
            - "data.version == 1 (not 99)"
            - "data.created_at is ISO 8601"

      - name: invalid_enum_value_returns_error
        claim_type: type_constraints
        grounds:
          - entities.Ingredient.fields.category
          - validations[priority=21]
        distinguishing_aspect: "Providing an invalid enum value for category returns ERR_INVALID_ENUM."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "BAD-ENUM"
                ingredient_name: "Bad Enum Test"
                category: "INVALID_CATEGORY"
                pathogen_risk_class: "HIGH_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { err_enum: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_ENUM"

  # =========================================================================
  # Section 2: State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: nutrient_profile_valid_transition_draft_to_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.NutrientProfile.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Submitting a DRAFT profile transitions it to SUBMITTED."
        test_recipe:
          setup:
            - "A DRAFT NutrientProfile exists."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.80, max_per_100kcal: 3.50, target_per_100kcal: 2.50}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_sm_id: $.data.id }
          trigger:
            - call: "POST /api/v1/nutrient-profiles/${np_sm_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { np_sm: $.data }
          assert:
            - "data.status == SUBMITTED"

      - name: nutrient_profile_invalid_transition_approved_to_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.NutrientProfile
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Attempting to return-for-revision an APPROVED profile fails (no such transition from APPROVED)."
        test_recipe:
          setup:
            - "An APPROVED NutrientProfile exists."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.80, max_per_100kcal: 3.50, target_per_100kcal: 2.50}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_inv_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_inv_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_inv_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
          trigger:
            - call: "POST /api/v1/nutrient-profiles/${np_inv_id}/return-for-revision"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { err_inv: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: batch_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProductionBatch
        distinguishing_aspect: "A RELEASED batch cannot transition back to any prior state."
        test_recipe:
          setup:
            - "A RELEASED ProductionBatch exists (full lifecycle completed)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "TODDLER-12-36M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.50, max_per_100kcal: 3.00, target_per_100kcal: 2.20}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_term_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_term_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_term_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "OAT-TERM"
                ingredient_name: "Oat Terminal Test"
                category: "CARBOHYDRATE"
                pathogen_risk_class: "LOW_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { ing_term_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "CEREAL-TERM"
                product_name: "Terminal Test"
                nutrient_profile_id: "${np_term_id}"
                ingredients: [{ingredient_id: "${ing_term_id}", percentage_by_weight: 100.000, is_critical: true}]
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { f_term_id: $.data.id }
            - call: "POST /api/v1/formulas/${f_term_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${f_term_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-016"
                validation_validity_days: 365
              as: QA_MANAGER
              captures: { pv_term_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pv_term_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pv_term_id}/complete"
              payload:
                test_results: [{test_name: "cv", measured_value: 4.0, acceptance_criteria: "<=5.0", pass: true}]
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${f_term_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${f_term_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "Terminal Test"
              as: REGULATORY_AFFAIRS
              captures: { ls_term_id: $.data.id }
            - call: "POST /api/v1/label-submissions/${ls_term_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${ls_term_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${ls_term_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${f_term_id}/activate"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-TERM"
                legal_name: "Terminal Supplier"
                ingredient_categories: ["CARBOHYDRATE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup_term_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_term_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Term Auditor"
                score: 90.00
                findings: []
              as: QUALITY_ANALYST
            - call: "POST /api/v1/ingredient-lots"
              payload:
                ingredient_id: "${ing_term_id}"
                supplier_id: "${sup_term_id}"
                lot_number: "LOT-TERM-001"
                quantity_kg: 500.000
                received_date: "2026-07-15T00:00:00Z"
                expiry_date: "2027-07-15T00:00:00Z"
              as: SUPPLY_CHAIN_PLANNER
              captures: { lot_term_id: $.data.id }
            - call: "POST /api/v1/ingredient-lots/${lot_term_id}/qc-pass"
              payload: {}
              as: QUALITY_ANALYST
            - call: "GET /api/v1/formulas/${f_term_id}"
              as: QA_MANAGER
              captures: { f_term_ver: $.data.version }
            - call: "POST /api/v1/production-batches"
              payload:
                formula_id: "${f_term_id}"
                batch_size_kg: 100.000
                production_date: "2026-08-01T00:00:00Z"
                expected_formula_version: "${f_term_ver}"
              as: PRODUCTION_SUPERVISOR
              captures: { batch_term_id: $.data.id }
            - call: "POST /api/v1/production-batches/${batch_term_id}/start-production"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_term_id}/complete-blending"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_term_id}/complete-processing"
              payload: { actual_yield_kg: 98.000 }
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_term_id}/submit-for-testing"
              payload: {}
              as: QUALITY_ANALYST
            - call: "POST /api/v1/production-batches/${batch_term_id}/submit-test-results"
              payload:
                nutrient_results: [{nutrient_code: "P", measured_per_100kcal: 2.20}]
                pathogen_results: [{pathogen_code: "SALMONELLA", detected: false, cfu_per_g: 0}]
              as: QUALITY_ANALYST
            - call: "POST /api/v1/production-batches/${batch_term_id}/release"
              payload: {}
              as: QA_MANAGER
          trigger:
            - call: "POST /api/v1/production-batches/${batch_term_id}/start-production"
              payload: {}
              as: PRODUCTION_SUPERVISOR
              captures: { err_term: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE (RELEASED is terminal for start-production)"

      - name: complaint_initial_state_received
        claim_type: initial_state
        grounds:
          - state_machines.Complaint
        distinguishing_aspect: "Newly created Complaint starts in RECEIVED status."
        test_recipe:
          setup:
            - "A Formula exists (for FK reference)."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.80, max_per_100kcal: 3.50, target_per_100kcal: 2.50}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_ci_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_ci_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_ci_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "WPC-CI"
                ingredient_name: "WPC CI Test"
                category: "DAIRY_BASE"
                pathogen_risk_class: "HIGH_RISK"
                storage_condition: "REFRIGERATED"
              as: QA_MANAGER
              captures: { ing_ci_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-CI-1"
                product_name: "CI Test"
                nutrient_profile_id: "${np_ci_id}"
                ingredients: [{ingredient_id: "${ing_ci_id}", percentage_by_weight: 100.000, is_critical: true}]
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { f_ci_id: $.data.id }
          trigger:
            - call: "POST /api/v1/complaints"
              payload:
                complainant_name: "Jane Doe"
                complainant_contact: "jane@example.com"
                product_formula_id: "${f_ci_id}"
                complaint_type: "QUALITY_DEFECT"
                severity: "LOW"
                description: "Product clumping observed"
              as: COMPLAINT_HANDLER
              captures: { complaint_ci: $.data }
          assert:
            - "data.status == RECEIVED"
            - "data.is_adverse_event == false"

      - name: allocation_entry_idempotent_double_fulfillment_rejected
        claim_type: idempotency
        grounds:
          - state_machines.AllocationEntry
          - validations[priority=18]
        distinguishing_aspect: "Recording fulfillment that would exceed allocated_kg is rejected with ERR_FULFILLMENT_EXCEEDS_ALLOCATION."
        test_recipe:
          setup:
            - "An ACTIVE AllocationPlan exists with one entry allocated 50.000 kg."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "CEREAL-6M"
                nutrient_specs: [{nutrient_code: "I", unit: "mg", min_per_100kcal: 1.0, max_per_100kcal: 2.0, target_per_100kcal: 1.5}]
                regulation_ref: "EU 2016/127"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_idem_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_idem_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_idem_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
