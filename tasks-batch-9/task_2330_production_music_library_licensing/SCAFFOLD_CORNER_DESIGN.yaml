          - calculations.blanket_pool_distribution.formula
          - state_machines.UsageReport.SUBMITTED_to_ACCEPTED.side_effects
        distinguishing_aspect: |
          Two consecutive monthly reports straddle the usage cap: the first sits exactly ON the 3-minute
          cap (165 seconds ceilinged per report) so no overage arises, and the second crosses it by one
          minute, which raises that report's pool to 100113 — a figure only reachable if the 450-per-
          minute overage increment is folded into the pool AFTER the 15.00% admin fee base is computed.
        test_recipe:
          setup:
            - "ASCAP composer, ACTIVE 50/50 agreement with blanket_opt_in true, two CATALOGED works A and B, one licensee, one ACTIVE MONTHLY blanket (annual 4800000, pool share 25.00, cap 3 minutes)."
            - "Report 1 for 2026-08 carries two REGISTERED cue sheets: three 45-second cues on A (3.01 credits, 135s) and one 30-second FEATURE cue on B (0.65 credits, 30s); it is SUBMITTED."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
