scaffold_corner_design:

  # =================================================================== entities
  - section: entities
    instances:
      - name: create_store_returns_201_with_defaults_applied
        claim_type: creation
        grounds: ["entities.Store", "endpoints[POST /stores]"]
        distinguishing_aspect: "POST /stores with only name and region_code returns 201 with status ACTIVE, bopis_slot_capacity 2, version 1 and a bare UUID id (no type prefix)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id", st: "$.data.status", cap: "$.data.bopis_slot_capacity", ver: "$.data.version"}
          assert:
            - "HTTP 201"
            - "${st} == ACTIVE"
            - "${cap} == 2"
            - "${ver} == 1"
            - "${store_id} matches the bare UUID form (36 chars, no `str_` style prefix)"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: get_store_with_unknown_id_returns_store_not_found
        claim_type: not_found
        grounds: ["endpoints[GET /stores/{id}]", "errors[ERR_STORE_NOT_FOUND]"]
        distinguishing_aspect: "GET /stores/{id} with a syntactically valid but unknown UUID returns ERR_STORE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: MerchandisingAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_STORE_NOT_FOUND"
            - "HTTP 404"
            - "response_type == error"

      - name: create_product_missing_required_hygiene_class_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Product.fields.hygiene_class", "endpoints[POST /products]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "hygiene_class has source input and no default, so omitting it must be rejected with ERR_INVALID_REQUEST (400) rather than defaulted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP 400"

      - name: create_variant_with_illegal_depth_index_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Variant.fields.depth_index", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "depth_index is constrained to 1..12; depth_index 13 is rejected with ERR_INVALID_REQUEST (400) and no Variant row is created."
        test_recipe:
          setup: ["One product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Foundation", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
          trigger:
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Too Deep", shade_code: "X-13", finish: "MATTE", undertone: "WARM", depth_index: 13, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP 400"
            - "GET /variants?product_id=${prod_id} returns 0 rows"

      - name: variant_price_defaults_to_product_base_price_when_omitted
        claim_type: defaults
        grounds: ["entities.Variant.fields.price_cents", "endpoints[POST /products/{id}/variants]"]
        distinguishing_aspect: "Omitting price_cents makes the variant inherit Product.base_price_cents (4500) verbatim; launch_status defaults to NOT_LIMITED because is_limited_launch defaults to false."
        test_recipe:
          setup: ["Product with base_price_cents 4500."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Foundation", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
          trigger:
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Ivory", shade_code: "F-02", finish: "DEWY", undertone: "WARM", depth_index: 2 }
              as: MerchandisingAdmin
              captures: { price: "$.data.price_cents", ls: "$.data.launch_status", lim: "$.data.is_limited_launch"}
          assert:
            - "${price} == 4500"
            - "${ls} == NOT_LIMITED"
            - "${lim} == false"

      - name: create_variant_under_unknown_product_returns_product_not_found
        claim_type: parent_relationships
        grounds: ["entities.Variant.fields.product_id", "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "The nested create path validates its parent first: an unknown product id in the path yields ERR_PRODUCT_NOT_FOUND (404), not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /products/22222222-2222-4222-8222-222222222222/variants"
              payload: { shade_name: "Ghost", shade_code: "G-01", finish: "MATTE", undertone: "COOL", depth_index: 3, price_cents: 100 }
              as: MerchandisingAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_PRODUCT_NOT_FOUND"
            - "HTTP 404"

      - name: inventory_lot_computed_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds: ["entities.InventoryLot.fields.on_hand_units", "entities.InventoryLot.fields.reserved_units", "endpoints[POST /inventory-lots]"]
        distinguishing_aspect: "on_hand_units is source computed and is set to units_received (10) by the server; reserved/tester/sold/destroyed all start at 0 regardless of what the client sends."
        test_recipe:
          setup: ["Store and variant exist."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
          trigger:
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
              captures: { oh: "$.data.on_hand_units", rv: "$.data.reserved_units", tu: "$.data.tester_units", lr: "$.data.launch_reserved_units"}
          assert:
            - "${oh} == 10"
            - "${rv} == 0 and ${tu} == 0"
            - "${lr} == 0 (default when omitted)"

      - name: duplicate_inventory_lot_for_same_store_and_variant_returns_lot_already_exists
        claim_type: type_constraints
        grounds: ["validations[priority=28]", "errors[ERR_LOT_ALREADY_EXISTS]"]
        distinguishing_aspect: "Uniqueness is on the (store_id, variant_id) pair: a second POST /inventory-lots for the same pair returns ERR_LOT_ALREADY_EXISTS (409) and leaves the first lot untouched."
        test_recipe:
          setup: ["A lot already exists for (SEP-CA, V)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
          trigger:
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 4 }
              as: MerchandisingAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_LOT_ALREADY_EXISTS"
            - "HTTP 409"
            - "InventoryLot.${lot_id}.units_received is still 10"
            - "GET /inventory-lots?store_id=${store_id}&variant_id=${v_id} returns exactly 1 row"

      - name: points_ledger_entry_is_immutable_and_has_no_version_field
        claim_type: immutability
        grounds: ["entities.PointsLedgerEntry", "endpoints[GET /points-ledger/{id}]"]
        distinguishing_aspect: "PointsLedgerEntry declares common_fields false: entries expose id and created_at only, carry no version, and there is no update or delete endpoint anywhere in §1.5."
        test_recipe:
          setup: ["A customer seeded with 500 points has exactly one SEED ledger entry."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "imm@x.com", name: "Imm", initial_points: 500 }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "GET /points-ledger"
              payload: {}
              as: MerchandisingAdmin
              captures: { entry_id: "$.data[0].id"}
          trigger:
            - call: "GET /points-ledger/${entry_id}"
              payload: {}
              as: MerchandisingAdmin
              captures: { et: "$.data.entry_type", dp: "$.data.delta_points", ba: "$.data.balance_after"}
          assert:
            - "${et} == SEED and ${dp} == 500 and ${ba} == 500"
            - "the entry body exposes id and created_at but NO version and NO updated_at"
            - "no PUT/PATCH/DELETE endpoint exists for /points-ledger in §1.5"

      - name: list_orders_paginates_with_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /orders]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /orders?limit=2&offset=0 over 3 DRAFT orders returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One customer with three DRAFT SHIP_FROM_STORE orders at the same store."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "pag@x.com", name: "Pag" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
          trigger:
            - call: "GET /orders?customer_id=${cust_id}&limit=2&offset=0"
              payload: {}
              as: MerchandisingAdmin
              captures: { first_id: "$.data[0].id"}
          assert:
            - "the response returns exactly 2 Order rows"
            - "meta/pagination reports total_count == 3 and has_more == true"
            - "GET /orders?customer_id=${cust_id}&limit=2&offset=2 returns 1 row with has_more == false"
            - "response_type == array"

  # =========================================================== state_machines
  - section: state_machines
    instances:
      - name: order_starts_in_draft_and_unpaid
        claim_type: initial_state
        grounds: ["state_machines.Order", "entities.Order.fields.fulfillment_status", "entities.Order.fields.payment_status"]
        distinguishing_aspect: "A freshly created Order is DRAFT on the fulfilment dimension and UNPAID on the payment dimension, with pricing_variant PROVISIONAL."
        test_recipe:
          setup: ["Store, variant and lot exist; customer exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "init@x.com", name: "Init" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 2 } ] }
              as: StoreAssociate
              captures: { ful: "$.data.fulfillment_status", pay: "$.data.payment_status", pv: "$.data.pricing_variant", sub: "$.data.subtotal_cents"}
          assert:
            - "${ful} == DRAFT and ${pay} == UNPAID"
            - "${pv} == PROVISIONAL"
            - "${sub} == 5000"
            - "InventoryLot.${lot_id}.on_hand_units == 10 and reserved_units == 0 (DRAFT never touches stock)"

      - name: cancel_a_cancelled_order_returns_invalid_order_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order.RESERVED_to_CANCELLED", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same order returns ERR_INVALID_ORDER_STATE (409) and fires no compensating side effects a second time (points stay at 500, not 800)."
        test_recipe:
          setup: ["Customer seeded 500 points; RESERVED order redeeming 300 points; then cancelled once (balance back to 500)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "term@x.com", name: "Term", initial_points: 500 }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", points_redeemed: 300, lines: [ { variant_id: "${v_id}", quantity: 2 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_ORDER_STATE"
            - "HTTP 409"
            - "Customer.${cust_id}.points_balance == 500 (the reversal did not run twice)"
            - "GET /points-ledger?customer_id=${cust_id} still returns exactly 3 entries"

      - name: add_line_to_a_reserved_order_returns_invalid_order_state
        claim_type: invalid_transition
        grounds: ["endpoints[POST /orders/{id}/lines]", "validations[priority=7]", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "Lines may only be added while the order is DRAFT; a line-add against a RESERVED order is rejected with ERR_INVALID_ORDER_STATE (409) and the order's line count is unchanged."
        test_recipe:
          setup: ["A RESERVED order with exactly 1 line."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "addl@x.com", name: "AddL" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { ov: "$.data.version"}
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v_id}", quantity: 1, expected_order_version: "${ov}" }
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_ORDER_STATE (state check at priority 7 runs before the OCC check at priority 8, and the version supplied here is in fact current)"
            - "HTTP 409"
            - "GET /order-lines?order_id=${order_id} still returns exactly 1 row"

      - name: reserve_side_effects_draw_launch_pool_before_general_pool
        claim_type: side_effect_execution
        grounds: ["calculations.launch_allocation_draw", "entities.InventoryLot.fields.launch_reserved_units", "state_machines.Variant.TIER_VIB_PLUS_to_PUBLIC"]
        distinguishing_aspect: "The waterfall drains launch_reserved_units first: reserving 2 units from a lot with units_received 5 / launch_reserved_units 3 leaves launch_reserved_units 1 and on_hand 3 — the general pool (2 units) is untouched."
        test_recipe:
          setup: ["Limited variant at launch_status PUBLIC (clock advanced past launch_open_public_at)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Drop Gloss", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Drop", shade_code: "DR-01", finish: "DEWY", undertone: "WARM", depth_index: 6, price_cents: 2500, is_limited_launch: true, launch_open_rouge_at: "2026-05-01T01:00:00Z", launch_open_vib_at: "2026-05-01T02:00:00Z", launch_open_public_at: "2026-05-02T00:00:00Z", per_customer_cap: 2 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5, launch_reserved_units: 3 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "wf@x.com", name: "WF" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: MerchandisingAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 2 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
          trigger:
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreAssociate
              captures: { oh: "$.data.on_hand_units", rv: "$.data.reserved_units", lr: "$.data.launch_reserved_units"}
          assert:
            - "${lr} == 1 (2 of the 3 earmarked units were drawn first)"
            - "${oh} == 3 and ${rv} == 2"
            - "Variant.${v_id}.launch_status == PUBLIC"

      - name: clock_advance_walks_variant_launch_status_through_every_window
        claim_type: valid_transition
        grounds: ["state_machines.Variant.SCHEDULED_to_TIER_ROUGE_ONLY", "state_machines.Variant.TIER_ROUGE_ONLY_to_TIER_VIB_PLUS", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "The logical clock starts at exactly 2026-05-01T00:00:00Z (never wall-clock), so a limited variant is SCHEDULED at boot, TIER_ROUGE_ONLY at 01:00Z, TIER_VIB_PLUS at 02:00Z and PUBLIC on 2026-05-02T00:00:00Z."
        test_recipe:
          setup: ["Limited variant with rouge 2026-05-01T01:00:00Z, vib 2026-05-01T02:00:00Z, public 2026-05-02T00:00:00Z; the clock has not been set."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Drop Gloss", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
