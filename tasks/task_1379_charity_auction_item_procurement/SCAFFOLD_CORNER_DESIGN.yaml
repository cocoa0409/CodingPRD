            - { call: "POST /solicitations", payload: { donor_id: "${dn1}", gala_event_id: "${ev}", ask_description: "A", ask_estimate_cents: 24999 }, as: ProcurementOfficer, captures: { so1: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn2}", gala_event_id: "${ev}", ask_description: "B", ask_estimate_cents: 25000 }, as: ProcurementOfficer, captures: { so2: "$.data.id" } }
            - { call: "POST /solicitations/${so1}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so1}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so1}", title: "IA", description: "a", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it1: "$.data.id", it1_v: "$.data.version" } }
            - { call: "POST /items", payload: { solicitation_id: "${so2}", title: "IB", description: "b", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it2: "$.data.id", it2_v: "$.data.version" } }
