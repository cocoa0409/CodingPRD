    side_effects:
      - "check_status = INITIALIZED"
      - "valid_window_start_at = ledger clock"
      - "epoch_start_at = active ledger epoch start"
      - "calibration_variance_ms recomputes"
      - "corridor.check_count recomputes"
      - "corridor_readiness_score recomputes"

  - method: GET
    path: "/api/launch-readiness-checks"
    description: "List readiness checks, optionally filtered by corridor"
    roles: [Any]
    code: 200
    input: ["corridor_id?", "check_type?", "check_status?", "limit?", "offset?"]
    output: "LaunchReadinessCheck[]"
    side_effects: []

  - method: GET
    path: "/api/launch-readiness-checks/{id}"
    description: "Get one readiness check with its calibration contribution"
    roles: [Any]
    code: 200
    input: []
    output: LaunchReadinessCheck
    side_effects: []

  - method: POST
    path: "/api/launch-readiness-checks/{id}/calibrate"
    description: "Drive the sensor calibration step of a readiness check"
    roles: [CorridorOperationsManager]
    code: 200
    input: []
    output: LaunchReadinessCheck
    side_effects:
      - "check_status → CALIBRATION_PASSED"
      - "calibration_variance_ms recomputes"
      - "corridor.check_pass_count recomputes"
      - "corridor.posture recomputes"
      - "corridor_readiness_score recomputes"

  - method: POST
    path: "/api/launch-readiness-checks/{id}/validate"
    description: "Validate the mapped route window on a readiness check"
    roles: [CorridorOperationsManager]
    code: 200
    input: [expected_check_version]
    output: LaunchReadinessCheck
    side_effects:
      - "increments LaunchReadinessCheck.version by 1"
      - "check_status → VALIDATED"
      - "corridor.route_validation_calculated_at recomputes"
      - "corridor_readiness_score recomputes"

  - method: POST
    path: "/api/launch-readiness-checks/{id}/expire"
    description: "Expire a readiness check whose validity window has elapsed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LaunchReadinessCheck
    side_effects:
      - "check_status → EXPIRED_FAILED"
      - "corridor.check_pass_count recomputes downward"
      - "corridor.posture recomputes"
      - "corridor_readiness_score recomputes"

  # --- Run plans ---
  - method: POST
    path: "/api/run-plans"
    description: "Create a run plan for a corridor, drawing against a shipper commitment"
    roles: [CarrierDispatcher]
    code: 201
    input: [corridor_id, carrier_id, origin_terminal_id, destination_terminal_id, shipper_commitment_id, window_start_epoch_day, window_end_epoch_day, trailer_count, posted_per_mile_cents, hauler_team_id, "sacra_loadboard_slot_held?"]
    output: RunPlan
    side_effects:
      - "run_status = DRAFT"
      - "per_mile_rate_cents recomputes"
      - "committed_rate_cents recomputes"
      - "scenario_rate_cents recomputes"
      - "run_plan_exposure_cents recomputes"
      - "safety_score = 50, safety_band = MEDIUM"

  - method: GET
    path: "/api/run-plans"
    description: "List run plans, optionally filtered by corridor, carrier or commitment"
    roles: [Any]
    code: 200
    input: ["corridor_id?", "carrier_id?", "shipper_commitment_id?", "run_status?", "limit?", "offset?"]
    output: "RunPlan[]"
    side_effects: []

  - method: GET
    path: "/api/run-plans/{id}"
    description: "Get a run plan with its derived rates"
    roles: [Any]
    code: 200
    input: []
    output: RunPlan
    side_effects: []

  - method: POST
    path: "/api/run-plans/{id}/submit"
    description: "Tender a run plan into readiness pending"
    roles: [CarrierDispatcher]
    code: 200
    input: []
    output: RunPlan
    side_effects:
      - "run_status → READINESS_PENDING"
      - "owning ShipperCommitment.consumed_slots += 1 and remaining_slots recomputes"
      - "owning ShipperCommitment.commitment_status → CONFIRMED when DRAFT"
      - "corridor.check_pass_count recomputes"

  - method: POST
    path: "/api/run-plans/{id}/dispatch-ready"
    description: "Promote a tendered run plan to dispatch ready"
    roles: [CarrierDispatcher]
    code: 200
    input: [expected_run_plan_version]
    output: RunPlan
    side_effects:
      - "increments RunPlan.version by 1"
      - "run_status → DISPATCH_READY"
      - "TerminalServiceWindow rows REQUESTED for this run plan are DISPLACED when yield_to_transit else APPROVED"
      - "owning Terminal.reserved_apron_units, approved_window_count and transfer_turnaround_minutes recompute"
      - "corridor_readiness_score recomputes"

  - method: POST
    path: "/api/run-plans/{id}/requeue"
    description: "Return a dispatch-ready run plan to readiness pending"
    roles: [CarrierDispatcher]
    code: 200
    input: []
    output: RunPlan
    side_effects:
      - "run_status → READINESS_PENDING"
      - "TerminalServiceWindow rows APPROVED on this run plan move to REQUESTED"
      - "owning Terminal.reserved_apron_units and transfer_turnaround_minutes recompute"
      - "owning ShipperCommitment.consumed_slots recomputes"

  - method: POST
    path: "/api/run-plans/{id}/abort"
    description: "Abort a non-terminal run plan and release its commitment slot, its apron windows and its chassis"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RunPlan
    side_effects:
      - "run_status → ABORTED"
      - "TerminalServiceWindow rows REQUESTED or APPROVED on this run plan move to CANCELLED"
      - "owning ShipperCommitment.consumed_slots recomputes"
      - "owning Carrier.recordable_incidents_last_epoch recomputes; Carrier.safety_tier and committed_discount_cents recompute from the current safety_score"

  - method: POST
    path: "/api/run-plans/{id}/start-highway-segment"
    description: "Hand the load to the autonomous system for the highway segment"
    roles: [CarrierDispatcher]
    code: 200
    input: []
    output: RunPlan
    side_effects:
      - "run_status → IN_TRANSIT"
      - "TerminalServiceWindow rows APPROVED on this run plan move to IN_SERVICE"
      - "owning Terminal.reserved_apron_units and transfer_turnaround_minutes recompute"
      - "owning ShipperCommitment.receipt_eligible_stop_count recomputes"

  - method: POST
    path: "/api/run-plans/{id}/complete"
    description: "Complete the highway segment and settle the commitment"
    roles: [CarrierDispatcher]
    code: 200
    input: []
    output: RunPlan
    side_effects:
      - "run_status → COMPLETED"
      - "each DriverTransition on this run plan in RIDE_ALONG_VERIFIED increments the commitment's verified_ride_along_count"
      - "owning ShipperCommitment.ride_along_credit_cents and billed_ride_along_cents recompute"
      - "owning ShipperCommitment.commitment_status → SHIPPED and shipped_at stamps"
      - "owning Carrier.recordable_incidents_last_epoch recomputes; Carrier.safety_tier and committed_discount_cents recompute from the current safety_score"

  - method: POST
    path: "/api/run-plans/{id}/safe-stop"
    description: "Trigger the safe-stop procedure on a monitored run"
    roles: [RemoteSupportOperator]
    code: 200
    input: []
    output: RunPlan
    side_effects:
      - "run_status → READINESS_PENDING"
      - "the monitoring RemoteSupportAssignment sets safe_stop_required = true and moves to EXPIRED"
      - "safe_stop_fee_cents recomputes on that assignment"
      - "TerminalServiceWindow rows on this run plan move to CANCELLED"
      - "owning Carrier.recordable_incidents_last_epoch recomputes"
      - "owning corridor.has_blocking_incident recomputes"

