  # ---------------------------------------------------------------------------
  # Rule 5 - priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_beats_fiscal_authority
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_APPROVAL_AUTHORITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a second approve on an
          already-APPROVED ApprovalRequest violates state (not PENDING) AND
          fiscal (expense 200000 exceeds the second approver's cap 50000);
          priority 8 state beats priority 14 fiscal, so ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement; Agent; two BUSINESS_MANAGER members: BM1 cap 500000, BM2 cap 50000"
            - "Expense 200000 (tier 2: BUSINESS_MANAGER + ARTIST requests) submitted by the Agent"
            - "BM1 has approved the BUSINESS_MANAGER request (it is APPROVED; the ARTIST request still PENDING, expense still PENDING_APPROVAL)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Prio Act", legal_name: "Prio Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Pr", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM One", window_start_date: "2026-01-01", authority_expense_cap_cents: 500000 }
              as: FirmAdmin
              captures: { tm_bm1: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Two", window_start_date: "2026-01-01", authority_expense_cap_cents: 50000 }
              as: FirmAdmin
              captures: { tm_bm2: $.data.id }
            - call: "POST /expenses"
              payload: { artist_id: "${a_id}", category: "PRODUCTION", amount_cents: 200000, incurred_date: "2026-03-01", description: "Staging" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { exp1: $.data.id }
            - call: "GET /approval-requests"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm1}"
              captures: { ap_bm: "$.data[0].id" }
            - call: "POST /approval-requests/${ap_bm}/approve"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm1}"
          trigger:
            - call: "POST /approval-requests/${ap_bm}/approve"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm2}"
              captures: { err: $.data.error_id }
          assert:
            - "Second approve is rejected with error_id == ERR_INVALID_STATE (http 409): the request is already APPROVED"
            - "The fiscal condition ALSO holds (expense 200000 > BM2 cap 50000), so this is a genuine dual-failure: state (priority 8) wins over business_fiscal (priority 14); ERR_APPROVAL_AUTHORITY_EXCEEDED is NOT returned"
            - "Expense.${exp1}.status == PENDING_APPROVAL (no side effects leaked from the rejected call)"

      - name: engagement_confirm_temporal_beats_overlap
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_ENGAGEMENT_WINDOW_PAST]
          - errors[ERR_ENGAGEMENT_OVERLAP]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: confirming a
          hold whose window is already past AND which overlaps a CONFIRMED
          engagement fails with ERR_ENGAGEMENT_WINDOW_PAST (priority 11), not
          ERR_ENGAGEMENT_OVERLAP (priority 13).
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement; Agent; clock advanced from default 2026-08-01 to 2026-10-01 AFTER E1 was confirmed"
            - "E1 CONFIRMED: 2026-09-10T18:00:00Z..2026-09-10T23:00:00Z, buffer 0 (confirmed while the window was still future)"
            - "E2 HOLD: 2026-09-10T20:00:00Z..2026-09-11T02:00:00Z, buffer 0 - overlaps E1 and entirely in the past at clock 2026-10-01"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Clash Act", legal_name: "Clash Act LLC", primary_genre: "rock" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
