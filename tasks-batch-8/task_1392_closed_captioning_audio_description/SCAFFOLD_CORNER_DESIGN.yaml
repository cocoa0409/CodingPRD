# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Closed Captioning & Audio Description Services
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Client.fields.default_turnaround_tier, entities.Client.fields.client_status, entities.Client.fields.ytd_completed_minutes]
        distinguishing_aspect: "Omitting default_turnaround_tier applies STANDARD; system fields client_status=ACTIVE, ytd_completed_minutes=0, version=1 are set without any client input."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme Broadcasting", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id, c_tier: $.data.default_turnaround_tier, c_status: $.data.client_status, c_ytd: $.data.ytd_completed_minutes, c_v: $.data.version }
          trigger:
            - call: "GET /caption-ad/clients/${c_id}"
              payload: {}
              as: OperationsManager
          assert:
            - "default_turnaround_tier == 'STANDARD' (default applied)"
            - "client_status == 'ACTIVE'; ytd_completed_minutes == 0; version == 1"
            - "GET returns the same field set with a server-minted UUID id"

      - name: media_asset_create_missing_required_duration
        claim_type: required_fields
        grounds: [entities.MediaAsset.fields.duration_seconds, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required duration_seconds fails with ERR_VALIDATION 400 before any state or FK logic runs."
        test_recipe:
          setup: ["One ACTIVE client exists"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "No Duration", media_kind: "FILE_BASED", frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http 400; no MediaAsset row is created"

      - name: media_asset_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.MediaAsset.fields.frame_rate, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "frame_rate outside the declared six-member enum is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["One ACTIVE client exists"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Bad FPS", media_kind: "FILE_BASED", duration_seconds: 600, frame_rate: "FPS_60" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http 400"

      - name: work_order_sameday_tier_duration_boundary
        claim_type: type_constraints
        grounds: [calculations.sla_turnaround_window, "errors[ERR_TIER_DURATION_INCOMPATIBLE]", "validations[priority=10]"]
        distinguishing_aspect: "SAME_DAY tier accepts a media asset of exactly 3600 seconds (60-minute boundary inclusive) and rejects 3660 seconds with ERR_TIER_DURATION_INCOMPATIBLE at creation time."
        test_recipe:
          setup: ["One INTERNAL client; one 3600s asset and one 3660s asset"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Exactly60", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_ok: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "SixtyOne", media_kind: "FILE_BASED", duration_seconds: 3660, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_over: $.data.id }
          trigger:
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_ok}", service_type: "CAPTIONS", turnaround_tier: "SAME_DAY", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_ok: $.data.id }
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_over}", service_type: "CAPTIONS", turnaround_tier: "SAME_DAY", language: "en-US" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "3600s order created (201), order_status == DRAFT — boundary minute 60 is tier-compatible"
            - "3660s order rejected ERR_TIER_DURATION_INCOMPATIBLE (422) — minute 61 is not"

      - name: qc_review_immutable_shape
        claim_type: immutability
        grounds: [entities.QCReview]
        distinguishing_aspect: "QCReview has common_fields false: the create response carries id and created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "INTERNAL client, CLEARED asset, CAPTIONS order IN_PRODUCTION, track QC_QUEUED (author editor-1)"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "DASH", expected_work_order_version: "${wo_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_a: $.data.id }
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
          trigger:
            - call: "POST /caption-ad/caption-tracks/${t_a}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 100, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
              captures: { r_id: $.data.id, r_acc: $.data.accuracy_pct }
          assert:
            - "QCReview response contains id and created_at but no version and no updated_at"
            - "accuracy_pct == 99.00 and outcome == PASS (INTERNAL threshold 95.00)"
            - "No PATCH/PUT/DELETE endpoint exists for /caption-ad/qc-reviews/{id} — the record is append-only"

      - name: work_order_unknown_media_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A body FK (media_asset_id) that does not resolve returns ERR_NOT_FOUND 404 — body references get the same existence treatment as path ids."
        test_recipe:
          setup: ["One ACTIVE client"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "00000000-0000-0000-0000-000000000000", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: caption_track_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown track UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /caption-ad/caption-tracks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: work_order_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.WorkOrder.fields.quoted_price_cents, calculations.work_order_quote]
        distinguishing_aspect: "Client-supplied quoted_price_cents at creation is ignored; after /quote the server-computed value 44250 (60 min EXPRESS, ytd 0) replaces it."
        test_recipe:
          setup: ["One INTERNAL client; one 3600s asset (RECEIVED suffices for quote)"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "EXPRESS", language: "en-US", quoted_price_cents: 999 }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "WorkOrder.${wo_a}.quoted_price_cents == 44250 (19500 duration charge * 1.5 + 15000 setup) — the injected 999 was never stored"

      - name: client_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Client]
        distinguishing_aspect: "Client-supplied id and created_at are ignored: the server mints a UUID and stamps the logical clock time."
        test_recipe:
          setup: ["Clock at 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL", id: "custom-id-1", created_at: "1999-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { c_id: $.data.id, c_created: $.data.created_at }
          assert:
            - "data.id != 'custom-id-1' and is a server-minted UUID"
            - "data.created_at == '2026-08-03T10:00:00.000Z' (logical clock, millisecond precision) — not the injected 1999 value"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: media_reject_missing_required_reason
        claim_type: precondition_enforcement
        grounds: [state_machines.MediaAsset.INSPECTING_to_REJECTED_INTAKE, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Reject without rejection_reason fails ERR_VALIDATION; the asset stays INSPECTING."
        test_recipe:
          setup: ["Client; asset INSPECTING"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /caption-ad/media-assets/${m_a}/reject"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; MediaAsset.${m_a}.intake_status remains INSPECTING"

      - name: media_terminal_rejected_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.MediaAsset, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "REJECTED_INTAKE is terminal: begin-inspection from it is rejected ERR_INVALID_TRANSITION."
        test_recipe:
          setup: ["Client; asset driven RECEIVED -> INSPECTING -> REJECTED_INTAKE"]
          setup_api_calls:
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/reject"
              payload: { rejection_reason: "corrupt container" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (409); asset remains REJECTED_INTAKE with rejection_reason stored"

      - name: work_order_deliver_before_ready_invalid
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.READY_FOR_DELIVERY_to_DELIVERED, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "deliver from IN_PRODUCTION (coverage incomplete, no conformed track) is ERR_INVALID_TRANSITION — readiness is a pure state gate because READY_FOR_DELIVERY already implies coverage."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z; INTERNAL client; CLEARED asset; order confirmed and IN_PRODUCTION, no tracks"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_a}/deliver"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (409); order stays IN_PRODUCTION, delivered_at stays null"

      - name: work_order_confirm_twice_invalid
        claim_type: idempotency
        grounds: [state_machines.WorkOrder.QUOTED_to_CONFIRMED, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "Repeating confirm after a successful confirm is not idempotent: the second call is rejected ERR_INVALID_TRANSITION because QUOTED no longer holds."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z; INTERNAL client; CLEARED asset; order QUOTED"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First confirm: CONFIRMED with due_at '2026-08-24T10:00:00Z'"
            - "Second confirm: ERR_INVALID_TRANSITION (409); due_at unchanged"

      - name: track_submit_after_conformed_invalid
        claim_type: invalid_transition
        grounds: [state_machines.CaptionTrack, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "submit-review from CONFORMED is not in the transition table and fails ERR_INVALID_TRANSITION."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z; INTERNAL client; order IN_PRODUCTION; track driven to CONFORMED"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "DASH", expected_work_order_version: "${wo_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_a: $.data.id }
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 100, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/mark-conformed"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
          trigger:
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TRANSITION; track stays CONFORMED"

      - name: qc_second_review_rejected
        claim_type: idempotency
        grounds: [state_machines.CaptionTrack.QC_QUEUED_to_QC_PASSED, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "A finalized QC review transitions the track out of QC_QUEUED, so a second review POST on the same track fails ERR_INVALID_TRANSITION — reviews are single-shot per queueing."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z; INTERNAL client; track QC_QUEUED (author editor-1)"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
