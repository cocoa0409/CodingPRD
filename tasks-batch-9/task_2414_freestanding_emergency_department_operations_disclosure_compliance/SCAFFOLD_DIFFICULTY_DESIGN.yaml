            - call: "POST /dispute-cases/${dc_id}/offers"
              payload: { offer_cents: 240000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /dispute-cases/${dc_id}/offers"
              payload: { offer_cents: 200000 }
              as: PayerRepresentative
              as_user_id: "payer-1"
            - call: "POST /dispute-cases/${dc_id}/offers"
              payload: { offer_cents: 235000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /dispute-cases/${dc_id}/offers"
              payload: { offer_cents: 205000 }
              as: PayerRepresentative
              as_user_id: "payer-1"
            - call: "POST /dispute-cases/${dc_id}/offers"
              payload: { offer_cents: 230000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /dispute-cases/${dc_id}/offers"
              payload: { offer_cents: 210000 }
              as: PayerRepresentative
              as_user_id: "payer-1"
            - call: "POST /dispute-cases/${dc_id}/initiate-idr"
              payload: { certified_entity_name: "Certified IDRE Alpha" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /dispute-cases/${dc_id}/award"
              payload: { award_cents: 210000, award_rationale: "market benchmark" }
              as: IDREntity
              as_user_id: "idre-1"
            - call: "POST /dispute-cases/${dc_id}/withdraw"
              payload: { withdrawal_reason: "certified entity vacated the determination" }
              as: IDREntity
              as_user_id: "idre-1"
          assert:
            - "immediately after the award: Claim.${claim_id}.allowed_amount_cents == 210000, plan_paid_cents == 127999, patient_responsibility_cents == 82001, written_off_cents == 72500, balance_bill_amount_cents == 0, status == RESOLVED"
            - "immediately after the award the snapshots hold the pre-award figures: pre_award_allowed_cents == 190000, pre_award_plan_paid_cents == 112001, pre_award_patient_responsibility_cents == 77999, pre_award_written_off_cents == 92500"
            - "conservation holds after the award: 282500 == 127999 + 82001 + 72500"
            - "after the withdrawal: Claim.${claim_id}.allowed_amount_cents == 190000, plan_paid_cents == 112001, patient_responsibility_cents == 77999, written_off_cents == 92500, balance_bill_amount_cents == 0"
            - "conservation holds again after the withdrawal: 282500 == 112001 + 77999 + 92500"
            - "all four snapshot fields are null and Claim.${claim_id}.status == IDR_PENDING"
            - "DisputeCase.${dc_id}.status == WITHDRAWN with idr_award_cents == null and awarded_at == null"
            - "GET /facilities/${fac_id}/compliance-ledger-entries?event_type=IDR_AWARD_WITHDRAWN returns total_count == 1"
      - name: supersede_then_decline_conserves_every_committed_ambulance_unit
        grounds:
          - calculations.ambulance_unit_ledger
          - state_machines.TransferOrder.REQUESTED_to_CANCELLED
          - state_machines.TransferOrder.REQUESTED_to_DECLINED
          - entities.AmbulanceMOU.fields.units_available
        distinguishing_aspect: |
          A different conserved quantity: AMBULANCE UNITS, where units_committed must always equal
          units_reserved + units_available. A supersede (the second order cancels the first) and a
          decline (the second order releases its own unit) are two different compensating actions,
          and the ledger must balance at 2 == 1 + 1 after the supersede and 2 == 0 + 2 after the
          decline, with Facility.ambulance_units_reserved_total tracking in lockstep.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN"
            - "ACTIVE CARDIAC agreement at capability_tier 3 accepting unstable patients, plus a second ACTIVE CARDIAC agreement with a different destination hospital"
            - "One ACTIVE CRITICAL_CARE ambulance MOU committing 2 units for 2026-07-01T00:00:00Z..2026-12-31T00:00:00Z"
            - "One acuity-4 CARDIAC encounter, ACKNOWLEDGED, screened STABLE, with a first REQUESTED transfer order that reserved 1 unit, so units_reserved is 1 and units_available is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 2, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
