        as: PlatformAdmin
      - call: POST /api/patients
        payload:
          mrn: MRN-G1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_1: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-G2
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_2: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-G3
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_3: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_1}
