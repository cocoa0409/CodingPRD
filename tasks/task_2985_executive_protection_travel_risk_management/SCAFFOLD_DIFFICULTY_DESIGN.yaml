              as: SystemOperator
              as_user_id: "ops-1"
              captures: { drv_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Avi Advance", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 8887 }
              as: SystemOperator
              as_user_id: "ops-1"
