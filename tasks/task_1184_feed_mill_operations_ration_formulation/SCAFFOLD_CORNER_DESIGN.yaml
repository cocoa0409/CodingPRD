            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Customer A", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_a: $.data.id, cust_a_v: $.data.version } }
            - { call: "POST /api/customers", payload: { name: "Customer B", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_b: $.data.id } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_a_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { ord_a: $.data.id } }
          trigger:
            - { call: "GET /api/orders/${ord_a}", as: Customer, as_user_id: "${cust_b}", captures: { err: $.data.error_id } }
            - { call: "GET /api/orders", as: Customer, as_user_id: "${cust_b}" }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404 (foreign order invisible to Customer B)"
            - "GET /api/orders as Customer B returns total_count 0 (only own orders listed)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_order_create_stale_customer_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-create-stale-customer]", "errors[ERR_STALE_CUSTOMER_VERSION]"]
        distinguishing_aspect: "OCC on Customer.version: after order1 creation bumps the customer version, a second create carrying the stale expected_customer_version is rejected 412; re-reading the version and retrying succeeds (multiple orders are legitimate)."
        test_recipe:
          setup: ["catalog + F-GROW ACTIVE; customer at version 1"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 5000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 5, expected_customer_version: "${cust_v} - 1" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/customers/${cust_id}", as: MillManager, captures: { cust_v2: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 5, expected_customer_version: "${cust_v2}" }, as: Customer, as_user_id: "${cust_id}", captures: { o2: $.data.id } }
          assert:
            - "order1 created; Customer.version advanced to 2 as a side effect of creation"
            - "stale create (expected ${cust_v} - 1) rejected: err == ERR_STALE_CUSTOMER_VERSION, http 412"
            - "retry with the fresh version succeeds: CustomerOrder.${o2}.status == QUOTED"

      - name: occ_optimize_stale_formula_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[formula-optimize-stale-formula]", "errors[ERR_STALE_FORMULA_VERSION]"]
        distinguishing_aspect: "OCC on Formula.version: a second optimize carrying the pre-optimize version is rejected 412; re-optimizing with the fresh version succeeds (re-optimization is legitimate and repeatable)."
        test_recipe:
          setup: ["catalog; F-GROW created (version 1)"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
          trigger:
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist, captures: { err: $.data.error_id } }
            - { call: "GET /api/formulas/${f_id}", as: Nutritionist, captures: { f_v2: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v2}" }, as: Nutritionist }
          assert:
            - "first optimize advanced Formula.version 1 -> 2"
            - "second optimize replaying the captured (now stale) version ${f_v} rejected: err == ERR_STALE_FORMULA_VERSION, http 412"
            - "fresh optimize (version 2) succeeds: Formula.version == 3"

      - name: version_pinning_confirm_snapshot_survives_reoptimize
        claim_type: version_pinning_on_approval
        grounds: ["entities.CustomerOrder.fields.pinned_formula_version", "entities.CustomerOrder.fields.pinned_lines", "calculations.formula_provisional_cost"]
        distinguishing_aspect: "A CONFIRMED order keeps its pinned formula version, pinned lines and quoted price even after the formula is re-optimized (version 3 -> 4) and its provisional cost moves 36600 -> 37300."
        test_recipe:
          setup: ["catalog + F-GROW ACTIVE at version 3; order 10t CONFIRMED (pinned at version 3, quoted 426420)"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 31000, effective_from: "2026-04-15T00:00:00Z" }, as: MillManager }
            - { call: "GET /api/formulas/${f_id}", as: Nutritionist, captures: { f_v3: $.data.version } }
          trigger:
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v3}" }, as: Nutritionist }
          assert:
            - "Formula.${f_id}.version == 4 and provisional_cost_cents_per_ton == 37300 after re-optimization"
            - "CustomerOrder.${ord_id}.pinned_formula_version == 3 (snapshot untouched)"
            - "CustomerOrder.${ord_id}.pinned_lines still == [{corn, 70}, {sbm, 30}] of the pinned version"
            - "CustomerOrder.${ord_id}.quoted_total_cents == 426420 (price lock held)"

      - name: cascade_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.Batch.MIXED_to_HOLD", "state_machines.Contract.OPEN_to_EXHAUSTED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / sample_fail_cascades_batch_hold_order_blocked_trips_cancelled"
          rationale: "Both cascade chains (quality-fail and contract-exhaustion) are asserted hop-by-hop in the §1.8 transitive_cascade instances."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: ["calculations.order_price", "calculations.assay_adjustment"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / order_price_quoted_vs_final_diverges"
          rationale: "Both dual-variant calculations are asserted with divergent literals in §1.8."

  - section: consistency_model
    instances:
      - name: immediate_consistency_weighment_response_and_bin_read
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.bin_on_hand"]
        distinguishing_aspect: "Immediate consistency: the weighment creation response already carries the computed unit_price_cents/line_cost_cents, and a read of the bin in the next request shows the deduction — no lag, no reconciliation pass."
        test_recipe:
          setup: ["catalog + F-GROW ACTIVE; order CONFIRMED; batch BATCHING; corn bin 20t"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 4.000 }, as: Operator, as_user_id: "${op_id}", captures: { w_id: $.data.id, w_price: $.data.unit_price_cents, w_cost: $.data.line_cost_cents } }
            - { call: "GET /api/bins/${binc_id}", as: MillManager }
          assert:
            - "weighment response carried unit_price_cents == 30000 and line_cost_cents == 120000 in the same request"
            - "Bin.${binc_id}.on_hand_tons == 16 on the immediately following read (no eventual-consistency lag)"
            - "Bin.${binc_id}.version advanced by the drawdown"
