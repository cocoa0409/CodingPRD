scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: financing_total_due_forward_vs_chronological
        grounds:
          - calculations.financing_total_due
          - calculations.early_settle_rebate
          - state_machines.RepaymentSchedule.SCHEDULED_to_SETTLED
        distinguishing_aspect: |
          Variant A (forward_looking_at_disbursement) computes one rounded interest
          number over the full scheduled term and pins it on RepaymentSchedule.total_due_cents;
          Variant B (chronological_on_early_settle) re-derives interest day-by-day so an
          early-settle pays strictly less. The two variants live on the RepaymentSchedule /
          FinancingApplication entity domain (the "loan"). This is structurally
          different from instance 2 below (which lives on the Supplier risk-scoring
          domain), satisfying §0.5 Rule 1's "different entity domains" clause.
        test_recipe:
          setup:
            - "CoreEnterprise approved with credit_line_total_cents=10_000_000; risk_rating=AAA"
            - "Supplier kyc_status=PASSED, tier_to_core=1, aml_risk_score=0.10 (yields risk_rating=LOW after submit)"
            - "PayableConfirmation confirmed: amount_cents=1_000_000, due_date=2026-04-01"
            - "Receivable registered against confirmation"
            - "Verification PASS"
            - "FinancingApplication mode=FACTORING, requested_amount_cents=1_000_000, term_days=90"
            - "Application approved with approved_amount_cents=1_000_000; pricing formula yields approved_apr_bps = 800 + (-150) + 0 + 0 = 650"
          trigger:
            - "POST /scf/disbursements at clock=2026-01-01"
            - "POST /scf/_clock/advance to=2026-02-15 (45 days elapsed of the 90 scheduled)"
            - "POST /scf/repayment-schedules/{id}/repay early_settle=true with repay_amount_cents = (RepaymentSchedule.total_due_cents - paid_cents - rebate_cents)"
          assert:
            - "After disbursement, RepaymentSchedule.total_due_cents == 1_021_027 (Variant A: principal 1_000_000 + interest round_half_up(1_000_000 * 650 * 90 / (10000*365)) = 16_027 + fee round_half_up(1_000_000 * 50 / 10000) = 5_000)"
            - "early_settle_rebate.rebate_cents > 0 strictly (Variant B day-by-day accrual over 45 days < Variant A pro-rated 90 days), proving the two variants produce different totals on identical inputs"
            - "After full settle, Receivable.status == SETTLED and PayableConfirmation.status == SETTLED"

      - name: supplier_risk_rating_factoring_vs_reverse_factoring
        grounds:
          - calculations.supplier_risk_rating_composite
          - state_machines.FinancingApplication.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          The composite_for_factoring variant uses Supplier.kyc_status as its
          kyc_factor input; the composite_for_reverse_factoring variant replaces
          kyc_factor with CoreEnterprise.risk_rating mapping. Same Supplier produces
          a different rating depending on the mode chosen on the FinancingApplication —
          a Supplier-domain calculation that nevertheless varies by sibling entity.
          This is a different entity domain (Supplier risk scoring) from instance #1
          (RepaymentSchedule total_due).
        test_recipe:
          setup:
            - "Supplier with kyc_status=NOT_RUN (kyc_factor=0.0), aml_risk_score=0.20, tier_to_core=1"
            - "CoreEnterprise risk_rating=AAA (maps to 1.0 in reverse-factoring variant)"
            - "Two FinancingApplications referencing two separate Receivables, one mode=FACTORING, one mode=REVERSE_FACTORING"
          trigger:
            - "POST /scf/financing-applications/{factoring_id}/submit"
            - "POST /scf/financing-applications/{reverse_factoring_id}/submit"
          assert:
            - "Factoring application receives risk_rating=HIGH (composite = 0.5*0.0 + 0.3*0.80 + 0.2*1.0 = 0.44)"
            - "Reverse-factoring application receives risk_rating=LOW (composite = 0.5*1.0 + 0.3*0.80 + 0.2*1.0 = 0.94)"
            - "Both calls succeed, same Supplier, different risk_rating — proving variant divergence"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: apr_pricing_tiered_selection_with_floor_ceiling
        grounds:
          - calculations.financing_apr_pricing
          - state_machines.FinancingApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a): a formula with 4 non-linearly-interacting inputs (mode, core
          risk_rating, supplier risk_rating, supplier tier) where each maps to its own
          bps adjustment, the inputs are summed, then the result is clamped between
          APR_FLOOR_BPS and APR_CEILING_BPS. The clamp is a conditional branch on the
          summed value, so the formula is non-linear: low-tier benign cases never touch
          the floor while compounding high-tier high-risk cases collide with the ceiling.
        test_recipe:
          setup:
            - "CoreEnterprise A: onboarded with risk_rating=AAA, credit_line_total_cents=10_000_000"
            - "CoreEnterprise B: onboarded with risk_rating=BB, credit_line_total_cents=10_000_000"
            - "Supplier_T1 tier_to_core=1 with kyc PASSED, aml_risk_score=0.05 (yields supplier-side risk_rating=LOW)"
            - "Supplier_T4 tier_to_core=4 with kyc PASSED, aml_risk_score=0.40, parent chain confirmed (yields supplier-side risk_rating=HIGH after composite scoring)"
            - "Two FinancingApplications: app1 FACTORING with CoreA+Supplier_T1, app2 REVERSE_FACTORING with CoreB+Supplier_T4"
            - "Each application driven through SUBMITTED → UNDER_REVIEW with Verification PASS, by reviewer U_REV"
          trigger:
            - "POST /scf/financing-applications/{app1}/approve approved_amount_cents=1_000_000 by approver U_APP (different from U_REV)"
            - "POST /scf/financing-applications/{app2}/approve approved_amount_cents=1_000_000 by approver U_APP"
          assert:
            - "app1.approved_apr_bps == 650 (FACTORING 800 + AAA -150 + LOW 0 + tier1 0 = 650, within [300,2400])"
            - "app2.approved_apr_bps == 1250 (REVERSE_FACTORING 600 + BB 250 + HIGH 250 + tier4 150 = 1250, within [300,2400])"
            - "Both literals fall strictly inside [APR_FLOOR_BPS=300, APR_CEILING_BPS=2400] (no clamp triggered for these inputs)"

      - name: overdue_penalty_per_day_round_then_sum_order
        grounds:
          - calculations.overdue_penalty_aging
          - state_machines.RepaymentSchedule.SCHEDULED_to_OVERDUE
          - endpoints[POST /scf/_clock/advance]
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned. overdue_penalty_aging
          mandates "per-day round_half_up, then sum across days". A naive "compute
          continuous-rate penalty over N days then round once at the end" produces a
          different cent count whenever the per-day fractional residue does not
          coincide with the multi-day fractional residue. Example: outstanding=1_000_000
          cents at DPD_1_30 rate 1200 bps. Per-day = round_half_up(1_000_000*1200/3_650_000)
          = 329 cents/day; over 10 days = 3290 cents. Sum-then-round =
          round_half_up(1_000_000*1200*10/3_650_000) = round_half_up(3287.67) = 3288.
          The two orders differ by 2 cents. The scaffold pins the daily-round form.
          This is structurally different from instance 1's mode (a) tiered-selection,
          per §0.5 Rule 2.
        test_recipe:
          setup:
            - "RepaymentSchedule s in SCHEDULED with scheduled_repayment_date=2026-01-01T00:00:00Z, total_due_cents=1_000_000, paid_cents=0"
          trigger:
            - "POST /scf/_clock/advance to=2026-01-11T00:00:00Z (dpd=10)"
            - "POST /scf/_sweep/run"
          assert:
            - "After sweep, the linked CollectionCase reports accrued penalty == 3_290 cents (per-day round 329 * 10 days), NOT 3_288 (the sum-then-round alternative)"
            - "CollectionCase.aging_bucket == DPD_1_30 (dpd=10 ∈ [1,30])"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: financing_application_revision_cycle
        grounds:
          - state_machines.FinancingApplication.SUBMITTED_to_UNDER_REVIEW
          - state_machines.FinancingApplication.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.FinancingApplication.RETURNED_FOR_REVISION_to_SUBMITTED
        distinguishing_aspect: |
          FinancingApplication has a cycle SUBMITTED → UNDER_REVIEW → RETURNED_FOR_REVISION
          → SUBMITTED → UNDER_REVIEW → ... bounded by revision_round < MAX_REVISION_ROUNDS.
          Cycle is on the FinancingApplication entity.
        test_recipe:
          setup:
            - "FinancingApplication in SUBMITTED state; reviewer kicks UNDER_REVIEW; MAX_REVISION_ROUNDS=3"
          trigger:
            - "POST /scf/financing-applications/{id}/return  (round 1)"
            - "POST /scf/financing-applications/{id}/submit  (resubmit)"
            - "POST /scf/financing-applications/{id}/start-review"
            - "POST /scf/financing-applications/{id}/return  (round 2)"
            - "POST /scf/financing-applications/{id}/submit  (resubmit)"
          assert:
            - "After two return-submit loops, FinancingApplication.revision_round == 2 and FinancingApplication.status == SUBMITTED (cycle re-entered)"
            - "Attempting a 4th return after a 3rd return raises ERR_MAX_REVISIONS_EXCEEDED"

      - name: payable_confirmation_branching_revoke_and_settle
        grounds:
          - state_machines.PayableConfirmation.CONFIRMED_to_REVOKED
          - state_machines.PayableConfirmation.CONFIRMED_to_SETTLED
          - state_machines.PayableConfirmation.PENDING_CONFIRM_to_CONFIRMED
        distinguishing_aspect: |
          PayableConfirmation is a branching (fork-join) shape: from CONFIRMED the
          machine forks to either REVOKED (manual revoke) or SETTLED (automatic on
          repayment cascade) with divergent side-effect sets — REVOKE refunds
          credit_line_reserved and cascades Receivable -> WRITTEN_OFF, while SETTLED
          additionally releases credit_line_consumed. Different entity than
          FinancingApplication.
        test_recipe:
          setup:
            - "Two separate PayableConfirmations c1, c2 in CONFIRMED state, no financing yet"
          trigger:
            - "POST /scf/payable-confirmations/{c1}/revoke with revoke_reason='dispute'"
            - "For c2: drive a Receivable + Application + Disbursement + full repayment cascade"
          assert:
            - "c1 ends in REVOKED with associated Receivable cascaded to WRITTEN_OFF; CoreEnterprise.credit_line_reserved_cents debited back by c1.amount_cents"
            - "c2 ends in SETTLED; both credit_line_reserved_cents and credit_line_consumed_cents reduced by c2.amount_cents (different side-effect set)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revoke_confirmation_to_receivable_to_application
        grounds:
          - state_machines.PayableConfirmation.CONFIRMED_to_REVOKED
          - state_machines.Receivable.REGISTERED_to_WRITTEN_OFF
          - state_machines.FinancingApplication.UNDER_REVIEW_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by REVOKE on PayableConfirmation: link 1 sets
          PayableConfirmation.status=REVOKED; link 2 (caused by link 1, not by the
          original API call) flips Receivable.status to WRITTEN_OFF; link 3 (caused by
          link 2) flips the in-flight FinancingApplication.status to CANCELLED. Trigger:
          the manual /revoke endpoint.
        test_recipe:
          setup:
            - "PayableConfirmation pc in CONFIRMED state with linked Receivable r in REGISTERED state and FinancingApplication app in UNDER_REVIEW state pointing to r; pc has no FINANCED downstream"
          trigger:
            - "POST /scf/payable-confirmations/{pc}/revoke with revoke_reason='trade-dispute'"
          assert:
            - "After call: pc.status == REVOKED"
            - "And: r.status == WRITTEN_OFF (link 2, caused by link 1)"
            - "And: app.status == CANCELLED (link 3, caused by link 2 — not by the revoke call directly)"
            - "AuditLogEntry rows recorded for each hop (REVOKE on pc; cascade write-off on r; cascade cancel on app)"

      - name: full_repayment_to_schedule_settled_to_receivable_settled_to_confirmation_settled
        grounds:
          - state_machines.RepaymentSchedule.SCHEDULED_to_SETTLED
          - state_machines.Receivable.FINANCED_to_SETTLED
          - state_machines.PayableConfirmation.CONFIRMED_to_SETTLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by full repayment: link 1 sets RepaymentSchedule.status=SETTLED;
          link 2 (caused by link 1) sets Receivable.status=SETTLED; link 3 (caused by
          link 2) sets PayableConfirmation.status=SETTLED. Different trigger than
          instance 1 (this one is /repayment-schedules/{id}/repay rather than /revoke).
        test_recipe:
          setup:
            - "Disbursed FinancingApplication exists with RepaymentSchedule in SCHEDULED, total_due_cents pinned (e.g., 1_021_027)"
          trigger:
            - "POST /scf/repayment-schedules/{id}/repay with repay_amount_cents=1_021_027"
          assert:
            - "RepaymentSchedule.status == SETTLED (link 1)"
            - "Receivable.status == SETTLED (link 2, transitively caused)"
            - "PayableConfirmation.status == SETTLED (link 3, transitively caused)"
            - "CoreEnterprise.credit_line_reserved_cents reduced by principal_cents AND credit_line_consumed_cents reduced by principal_cents (net effect of the full cascade)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_credit_line
        grounds:
          - validations[priority=20]
          - validations[priority=51]
        distinguishing_aspect: |
          On POST /scf/payable-confirmations/{id}/confirm, if (a) the confirmation
          is already in CONFIRMED state AND (b) the core enterprise's credit line
          is insufficient, the higher-priority `state` check at priority=20 must fire
          first (ERR_INVALID_STATE), NOT the priority=51 `business_fiscal` check
          (ERR_CREDIT_LINE_INSUFFICIENT). Pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "CoreEnterprise approved with credit_line_total_cents=1000 (very small)"
            - "PayableConfirmation with amount_cents=100_000_000 already in CONFIRMED state"
          trigger:
            - "POST /scf/payable-confirmations/{id}/confirm (duplicate call)"
          assert:
            - "Response error_id == ERR_INVALID_STATE (not ERR_CREDIT_LINE_INSUFFICIENT)"
            - "http status == 409"

      - name: auth_segregation_vs_business_referential_tier_parent
        grounds:
          - validations[priority=6]
          - validations[priority=40]
        distinguishing_aspect: |
          On POST /scf/financing-applications/{id}/approve, if (a) the actor is the
          same user who started review (segregation-of-duties violation) AND (b) the
          underlying confirmation is tier-2 with parent not CONFIRMED, the higher-
          priority `auth` check at priority=6 fires first (ERR_SEGREGATION_OF_DUTIES,
          403), NOT the priority=40 `business_referential` check
          (ERR_TIER_PARENT_NOT_CONFIRMED, 422). Pair: auth vs business_referential
          — different from instance 1.
        test_recipe:
          setup:
            - "Tier-2 supplier whose parent confirmation is still in PENDING_CONFIRM"
            - "FinancingApplication in UNDER_REVIEW; start-review actor X-User-ID = U_REVIEWER"
          trigger:
            - "POST /scf/financing-applications/{id}/approve with X-User-Role=CreditApprover and X-User-ID=U_REVIEWER (same user)"
          assert:
            - "Response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "http status == 403 (not 422)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dpd_aging_bucket_boundary
        grounds:
          - calculations.overdue_penalty_aging
          - state_machines.RepaymentSchedule.SCHEDULED_to_OVERDUE
          - endpoints[POST /scf/_clock/advance]
        distinguishing_aspect: |
          DPD bucket boundaries are inclusive lower (1, 31, 61, 91). DPD == 30 must
          map to DPD_1_30; DPD == 31 must map to DPD_31_60. The scaffold pins
          dpd = floor((now - scheduled) / 1 day) — so an extra hour past midnight on
          day 31 puts the case in DPD_31_60. Reached through POST /scf/_clock/advance
          + sweep.
        test_recipe:
          setup:
            - "RepaymentSchedule in OVERDUE with scheduled_repayment_date=2026-01-01T00:00:00Z"
          trigger:
            - "POST /scf/_clock/advance to=2026-01-31T00:00:00Z"
            - "POST /scf/_sweep/run"
            - "POST /scf/_clock/advance to=2026-02-01T00:00:00Z"
            - "POST /scf/_sweep/run"
          assert:
            - "After first sweep at dpd=30: associated CollectionCase.aging_bucket == DPD_1_30"
            - "After second sweep at dpd=31: CollectionCase.aging_bucket == DPD_31_60 (boundary crossed)"

      - name: receivable_uniqueness_zero_other_receivables
        grounds:
          - validations[priority=33]
          - endpoints[POST /scf/receivables]
        distinguishing_aspect: |
          Different metric than instance 1: an empty-collection / count-of-zero edge
          on the uniqueness guard. The check is "no other Receivable shares this
          confirmation_id" — when the existing set is empty (count == 0), creation
          must succeed; the moment a second Receivable would push count to 1,
          ERR_DOUBLE_FINANCING fires. Reached via POST /scf/receivables; different
          endpoint and metric (count-of-set) from instance 1 (numeric threshold).
        test_recipe:
          setup:
            - "PayableConfirmation pc in CONFIRMED state"
          trigger:
            - "POST /scf/receivables {confirmation_id: pc} (first call, count was 0)"
            - "POST /scf/receivables {confirmation_id: pc} (second call, count is now 1)"
          assert:
            - "First call returns 201 with new Receivable"
            - "Second call returns 409 with error_id == ERR_DOUBLE_FINANCING"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: financing_disburse_requires_core_enterprise_approved_not_suspended
        grounds:
          - state_machines.FinancingApplication.APPROVED_to_DISBURSED
          - state_machines.CoreEnterprise.APPROVED_to_SUSPENDED
          - validations[priority=22]
        distinguishing_aspect: |
          FinancingApplication's APPROVED → DISBURSED transition is gated by
          CoreEnterprise.onboarding_status != SUSPENDED at release time. The two
          entities in this pair are (FinancingApplication, CoreEnterprise).
        test_recipe:
          setup:
            - "FinancingApplication in APPROVED state"
            - "Linked CoreEnterprise just transitioned to SUSPENDED via POST /scf/core-enterprises/{id}/suspend"
          trigger:
            - "POST /scf/disbursements {application_id, funder_account_id}"
          assert:
            - "Response error_id == ERR_CORE_ENTERPRISE_SUSPENDED (http=409)"
            - "FinancingApplication.status remains APPROVED (no transition)"

      - name: receivable_pledge_requires_central_registry_filed
        grounds:
          - state_machines.Receivable.REGISTERED_to_PLEDGED
          - validations[priority=43]
          - entities.Receivable.fields.central_registry_filing_no
        distinguishing_aspect: |
          Receivable's REGISTERED → PLEDGED transition is gated by whether the
          Receivable.central_registry_filing_no field (which is itself set by
          a sibling Receivable-on-Receivable filing transition) is non-null when
          central_registry_required is true. The two entities in this pair are
          (Receivable, Receivable's filing record) — distinct from the
          (FinancingApplication, CoreEnterprise) pair in instance 1.
        test_recipe:
          setup:
            - "Receivable with amount_cents above CENTRAL_REGISTRY_THRESHOLD (so central_registry_required==true), central_registry_filing_no=null, status=REGISTERED"
          trigger:
            - "POST /scf/receivables/{id}/pledge"
          assert:
            - "Response error_id == ERR_CENTRAL_REGISTRY_FILING_REQUIRED (http=422)"
            - "Receivable.status remains REGISTERED"
            - "Subsequent POST /scf/receivables/{id}/central-registry-file followed by POST /scf/receivables/{id}/pledge succeeds, transitioning to PLEDGED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: credit_line_aggregate_capacity_window
        grounds:
          - validations[priority=51]
          - entities.CoreEnterprise.fields.credit_line_total_cents
          - entities.CoreEnterprise.fields.credit_line_reserved_cents
          - entities.CoreEnterprise.fields.credit_line_consumed_cents
          - concurrency_rules[third confirmation exhausts credit line]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics: at any instant, the sum of
          credit_line_reserved_cents + credit_line_consumed_cents must not exceed
          credit_line_total_cents. The "interval" here is the lifetime of a
          confirmation/disbursement obligation against a shared bucket — overlap
          means simultaneous active obligations whose sum exceeds the bucket size.
          The resource entity is CoreEnterprise.
        test_recipe:
          setup:
            - "CoreEnterprise approved with credit_line_total_cents=1_000_000_00"
            - "Two PayableConfirmations pc1 (amount=600_000_00) and pc2 (amount=500_000_00) both PENDING_CONFIRM"
          trigger:
            - "POST /scf/payable-confirmations/{pc1}/confirm"
            - "POST /scf/payable-confirmations/{pc2}/confirm"
          assert:
            - "pc1 confirm succeeds: CoreEnterprise.credit_line_reserved_cents == 60_000_000"
            - "pc2 confirm fails with ERR_CREDIT_LINE_INSUFFICIENT (because 60_000_000 + 50_000_000 > 100_000_000); pc2.status remains PENDING_CONFIRM"

      - name: receivable_to_confirmation_one_to_one_anti_double_financing
        grounds:
          - validations[priority=33]
          - entities.Receivable.fields.confirmation_id
          - concurrency_rules[Two FinancingApplications for the same receivable]
        distinguishing_aspect: |
          One-to-one exclusivity interval semantics: a PayableConfirmation can host
          AT MOST ONE Receivable at a time (point-occupancy rather than additive
          capacity). The "interval" is the entire lifetime of a non-terminal
          Receivable; any second attempt overlaps regardless of amount. Resource
          entity is PayableConfirmation, different from CoreEnterprise in instance 1,
          and the geometry is exclusivity vs. additive capacity.
        test_recipe:
          setup:
            - "PayableConfirmation pc in CONFIRMED state"
          trigger:
            - "POST /scf/receivables {confirmation_id: pc, invoice_doc_id: doc1, contract_doc_id: doc2}"
            - "POST /scf/receivables {confirmation_id: pc, invoice_doc_id: doc3, contract_doc_id: doc4}"
          assert:
            - "First receivable created with 201"
            - "Second receivable rejected with ERR_DOUBLE_FINANCING (409) regardless of doc ids"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_line_round_trip_confirm_settle_neutral
        grounds:
          - state_machines.PayableConfirmation.PENDING_CONFIRM_to_CONFIRMED
          - state_machines.PayableConfirmation.CONFIRMED_to_SETTLED
          - state_machines.FinancingApplication.APPROVED_to_DISBURSED
          - state_machines.RepaymentSchedule.SCHEDULED_to_SETTLED
          - entities.CoreEnterprise.fields.credit_line_total_cents
          - entities.CoreEnterprise.fields.credit_line_reserved_cents
          - entities.CoreEnterprise.fields.credit_line_consumed_cents
        distinguishing_aspect: |
          Conserved quantity: CoreEnterprise.credit_line_total_cents - credit_line_reserved_cents
          - credit_line_consumed_cents (the "available headroom"). The forward chain
          (CONFIRMED → DISBURSED → SETTLED) and the compensating SETTLED step MUST
          leave the available headroom equal to its starting value. Specifically:
          invariant_value_before_confirm == invariant_value_after_full_repayment, where
          invariant = total - reserved - consumed.
        test_recipe:
          setup:
            - "Fresh CoreEnterprise with credit_line_total_cents=10_000_000, reserved=0, consumed=0"
            - "Snapshot S0 = total - reserved - consumed = 10_000_000"
            - "PayableConfirmation, Receivable, FinancingApplication created and disbursed end-to-end with principal=1_000_000 and final repayment full"
          trigger:
            - "POST /scf/payable-confirmations/{id}/confirm"
            - "POST /scf/financing-applications/{id}/approve approved_amount_cents=1_000_000"
            - "POST /scf/disbursements"
            - "POST /scf/repayment-schedules/{id}/repay with full balance"
          assert:
            - "Immediately after CONFIRMED: total - reserved - consumed == 9_000_000 (reserved debited 1_000_000)"
            - "Immediately after DISBURSED: total - reserved - consumed == 9_000_000 (reserved restored, consumed debited by 1_000_000 — net unchanged)"
            - "Immediately after full repayment SETTLED: total - reserved - consumed == S0 == 10_000_000 (invariant restored)"

      - name: credit_line_reserved_revoke_round_trip_neutral
        grounds:
          - state_machines.PayableConfirmation.PENDING_CONFIRM_to_CONFIRMED
          - state_machines.PayableConfirmation.CONFIRMED_to_REVOKED
          - entities.CoreEnterprise.fields.credit_line_reserved_cents
        distinguishing_aspect: |
          Different conserved quantity than instance 1 (which conserves
          "available headroom" = total - reserved - consumed across the full
          confirm → disburse → settle cycle). This invariant conserves
          credit_line_reserved_cents ALONE across the compensating pair
          (CONFIRM, REVOKE) on a confirmation that never reached financing.
          Pinned formula: credit_line_reserved_cents_after_revoke ==
          credit_line_reserved_cents_before_confirm, exactly. The pair must
          neither leak nor double-debit.
        test_recipe:
          setup:
            - "Fresh CoreEnterprise CE approved with credit_line_total_cents=10_000_000, reserved=0, consumed=0"
            - "PayableConfirmation pc in PENDING_CONFIRM with amount_cents=2_500_000"
            - "Snapshot R0 = CE.credit_line_reserved_cents == 0"
          trigger:
            - "POST /scf/payable-confirmations/{pc}/confirm"
            - "POST /scf/payable-confirmations/{pc}/revoke with revoke_reason='trade-dispute'"
          assert:
            - "Immediately after confirm: CE.credit_line_reserved_cents == 2_500_000 (forward debit)"
            - "Immediately after revoke: CE.credit_line_reserved_cents == 0 == R0 (compensating credit; invariant restored exactly, no drift)"
            - "pc.status == REVOKED"
