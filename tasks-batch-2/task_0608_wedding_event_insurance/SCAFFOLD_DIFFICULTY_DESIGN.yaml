# =============================================================================
# Task 0608 — Wedding & Special-Event Insurance
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 Test Targeting Index)
#
# 9 rule_ids × 2 instances = 18 instances.
# Canonical reference fixture (reused across instances):
#   CoverageProduct CANC_STD : CANCELLATION/STANDARD  base=20000 per_guest=300
#                              limit=5_000_000 deposit_sublimit_pct=0.5
#   CoverageProduct LIAB_STD : LIABILITY/STANDARD     base=15000 per_guest=200
#                              limit=2_000_000 deposit_sublimit_pct=1.0
#   CoverageProduct LIQ_STD  : LIQUOR_LIABILITY/STANDARD base=18000 per_guest=250
#                              limit=1_000_000 deposit_sublimit_pct=1.0 liquor_required=true
#   EventProfile attendance=150  => CANC rated=65000, LIAB rated=45000
#   Rider RINGS  scheduled=1_200_000 => 18000 ; ATTIRE 100_000 => 2500(clamp floor)
#         GIFTS 5_000_000 => 50000(clamp ceiling)
#   total_premium (CANC+LIAB+RINGS) = 65000+45000+18000 = 128000
# Default logical clock at startup = 2026-01-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- #1: cancellation refund (POLICY money domain), free-look variant ---
      - name: cancellation_refund_free_look_full_refund
        grounds:
          - calculations.cancellation_refund
          - state_machines.Policy.BOUND_to_CANCELLED
          - entities.Policy.fields.refund_due_cents
          - entities.Policy.fields.premium_earned_cents
        distinguishing_aspect: "Operates on the POLICY money domain: a cancel inside the free-look window refunds the FULL total_premium_cents (128000) with premium_earned_cents=0, distinct from claim_indemnity which lives on the CLAIM/coverage domain."
        test_recipe:
          setup:
            - "A bound, paid policy with CANC+LIAB coverages and a RINGS rider; total_premium_cents=128000; bind_at=2026-01-01T00:00:00Z; free_look_days=15."
            - "Clock advanced to 2026-01-10 (day 9, within free-look)."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /coverage-products"
              payload: { coverage_type: "LIABILITY", tier: "STANDARD", base_premium_cents: 15000, per_guest_premium_cents: 200, coverage_limit_cents: 2000000, deposit_sublimit_pct: 1.0 }
              as: PlatformAdmin
              captures: { liab_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false, free_look_days: 15 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${liab_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/riders"
              payload: { rider_type: "RINGS", scheduled_value_cents: 1200000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 128000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /policies/${policy_id}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "ph-1"
          assert:
            - "Policy.${policy_id}.refund_due_cents == 128000"
            - "Policy.${policy_id}.premium_earned_cents == 0"
            - "Policy.${policy_id}.lifecycle_status == CANCELLED"
            - "Policy.${policy_id}.billing_status == REFUNDED"

      # --- #2: claim indemnity (CLAIM/coverage domain), sublimit variant ------
      - name: claim_indemnity_deposit_sublimit_binds
        grounds:
          - calculations.claim_indemnity
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - entities.Claim.fields.approved_amount_cents
          - entities.Coverage.fields.consumed_limit_cents
        distinguishing_aspect: "Operates on the CLAIM/coverage indemnity domain: approved_amount_cents=2500000 = floor(5000000*0.5) deposit sublimit, NOT the policy money-refund domain of cancellation_refund."
        test_recipe:
          setup:
            - "An in-force policy with an ACTIVE CANCELLATION coverage (limit 5000000, sublimit 0.5, consumed 0)."
            - "A CANCELLATION claim for claimed_amount_cents=3000000 in SUBMITTED with one document attached."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { canc_cov_id: $.data.id }
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 65000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/claims"
              payload: { coverage_id: "${canc_cov_id}", claim_type: "CANCELLATION", claimed_amount_cents: 3000000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { claim_id: $.data.id }
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "INVOICE", file_uri: "s3://docs/inv1.pdf" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_id}.approved_amount_cents == 2500000"
            - "Claim.${claim_id}.status == APPROVED"
            - "Coverage.${canc_cov_id}.consumed_limit_cents == 2500000"
            - "Coverage.${canc_cov_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- #1 mode (a): 3-input non-linear min with conditional sublimit branch
      - name: claim_indemnity_three_way_min_line_limit_binds
        grounds:
          - calculations.claim_indemnity
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - entities.Coverage.fields.consumed_limit_cents
        distinguishing_aspect: "Mode (a): approved = min(claimed=2500000, remaining_line=2000000, sublimit_cap=2000000) → 2000000 where the LINE-LIMIT term binds (LIABILITY has no deposit sublimit), exhausting the coverage."
        test_recipe:
          setup:
            - "In-force policy with an ACTIVE LIABILITY coverage (limit 2000000, no deposit sublimit, consumed 0)."
            - "A PROPERTY claim for claimed_amount_cents=2500000 in SUBMITTED with one document."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "LIABILITY", tier: "STANDARD", base_premium_cents: 15000, per_guest_premium_cents: 200, coverage_limit_cents: 2000000, deposit_sublimit_pct: 1.0 }
              as: PlatformAdmin
              captures: { liab_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${liab_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { liab_cov_id: $.data.id }
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 45000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/claims"
              payload: { coverage_id: "${liab_cov_id}", claim_type: "PROPERTY", claimed_amount_cents: 2500000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { claim_id: $.data.id }
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "PHOTO", file_uri: "s3://docs/photo1.jpg" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_id}.approved_amount_cents == 2000000"
            - "Coverage.${liab_cov_id}.consumed_limit_cents == 2000000"
            - "Coverage.${liab_cov_id}.status == EXHAUSTED"

      # --- #2 mode (b): nested rounding order — rider clamp then sum (sum-of-rounded)
      - name: premium_reconciliation_sum_of_rounded_rider_lines
        grounds:
          - calculations.rider_premium
          - calculations.policy_premium_reconciliation
          - state_machines.Policy.QUOTED_to_BOUND
          - entities.Policy.fields.total_premium_cents
        distinguishing_aspect: "Mode (b): rounding order pinned to ceil-then-clamp PER RIDER then SUM-of-rounded-lines: ATTIRE raw 1500→clamp 2500, GIFTS raw 75000→clamp 50000; total=CANC 65000 + 2500 + 50000 = 117500, not round-of-sum."
        test_recipe:
          setup:
            - "A quoted SINGLE_EVENT policy with one CANCELLATION coverage and two riders (ATTIRE scheduled 100000 clamps up to 2500; GIFTS scheduled 5000000 clamps down to 50000)."
            - "Attendance 150 so CANC rated = 20000 + 300*150 = 65000."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/riders"
              payload: { rider_type: "ATTIRE", scheduled_value_cents: 100000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/riders"
              payload: { rider_type: "GIFTS", scheduled_value_cents: 5000000 }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
          assert:
            - "Policy.${policy_id}.base_premium_cents == 65000"
            - "Policy.${policy_id}.rider_premium_cents == 52500"
            - "Policy.${policy_id}.total_premium_cents == 117500"
            - "Policy.${policy_id}.lifecycle_status == BOUND"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- #1: Claim cyclic revision loop (SUBMITTED↔INFO_REQUESTED) ----------
      - name: claim_revision_cycle_increments_revision_count
        grounds:
          - state_machines.Claim.SUBMITTED_to_INFO_REQUESTED
          - state_machines.Claim.INFO_REQUESTED_to_SUBMITTED
          - entities.Claim.fields.revision_count
        distinguishing_aspect: "CLAIM entity exhibits a cycle: request-info then resubmit returns to SUBMITTED with revision_count incremented to 1 (A→B→A loop), not a linear pipeline."
        test_recipe:
          setup:
            - "An in-force policy with an ACTIVE CANCELLATION coverage and a SUBMITTED CANCELLATION claim that already has one document."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { canc_cov_id: $.data.id }
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 65000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/claims"
              payload: { coverage_id: "${canc_cov_id}", claim_type: "CANCELLATION", claimed_amount_cents: 1000000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { claim_id: $.data.id }
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "INVOICE", file_uri: "s3://docs/inv1.pdf" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/claims/${claim_id}/request-info"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://docs/rec1.pdf" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/claims/${claim_id}/resubmit"
              payload: {}
              as: Policyholder
              as_user_id: "ph-1"
          assert:
            - "Claim.${claim_id}.status == SUBMITTED"
            - "Claim.${claim_id}.revision_count == 1"

      # --- #2: Policy parallel dimensions (lifecycle vs billing) --------------
      - name: policy_parallel_billing_advances_independently_of_lifecycle
        grounds:
          - state_machines.Policy.UNPAID_to_PAID
          - state_machines.Policy.BOUND_to_IN_FORCE
          - entities.Policy.fields.billing_status
          - entities.Policy.fields.lifecycle_status
        distinguishing_aspect: "POLICY entity carries two parallel dimensions: after pay, billing_status==PAID while lifecycle_status remains BOUND (the two axes evolve independently on one row), not a single linear chain."
        test_recipe:
          setup:
            - "A bound SINGLE_EVENT policy with one CANCELLATION coverage; total_premium_cents=65000; billing_status=UNPAID; lifecycle_status=BOUND."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
          trigger:
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 65000 }
              as: Policyholder
              as_user_id: "ph-1"
          assert:
            - "Policy.${policy_id}.billing_status == PAID"
            - "Policy.${policy_id}.lifecycle_status == BOUND"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- #1 depth-3: approve → consumed bump → Coverage EXHAUSTED → Policy CLAIMED_OUT
      - name: claim_approve_exhausts_only_coverage_bubbles_policy_claimed_out
        grounds:
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - state_machines.Policy.IN_FORCE_to_CLAIMED_OUT
          - entities.Coverage.fields.consumed_limit_cents
          - entities.Policy.fields.lifecycle_status
        distinguishing_aspect: "Depth-3 chain originating at claim approve: approve mutates Coverage.consumed_limit_cents → that hits coverage_limit so Coverage flips ACTIVE→EXHAUSTED → since it is the only coverage, the bubble-up flips Policy IN_FORCE→CLAIMED_OUT. Each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "In-force policy with a SINGLE ACTIVE LIABILITY coverage (limit 2000000). A PROPERTY claim claimed_amount_cents=2000000 SUBMITTED with one document."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "LIABILITY", tier: "STANDARD", base_premium_cents: 15000, per_guest_premium_cents: 200, coverage_limit_cents: 2000000, deposit_sublimit_pct: 1.0 }
              as: PlatformAdmin
              captures: { liab_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${liab_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { liab_cov_id: $.data.id }
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 45000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/claims"
              payload: { coverage_id: "${liab_cov_id}", claim_type: "PROPERTY", claimed_amount_cents: 2000000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { claim_id: $.data.id }
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "PHOTO", file_uri: "s3://docs/photo1.jpg" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Coverage.${liab_cov_id}.consumed_limit_cents == 2000000"
            - "Coverage.${liab_cov_id}.status == EXHAUSTED"
            - "Policy.${policy_id}.lifecycle_status == CLAIMED_OUT"

      # --- #2 depth-2: cancel → refund split → billing REFUNDED + children VOIDED
      - name: policy_cancel_cascades_billing_refunded_and_children_voided
        grounds:
          - state_machines.Policy.IN_FORCE_to_CANCELLED
