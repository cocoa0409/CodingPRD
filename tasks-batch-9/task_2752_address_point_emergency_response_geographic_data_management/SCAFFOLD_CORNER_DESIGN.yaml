        distinguishing_aspect: "The second half of priority 9 reaches across entities: publish compares X-User-ID against the REPORT's certified_by_user_id, so user qc-1 wearing the ProvisioningOfficer role is refused while prov-1 publishes the same SEALED package — and the refusal happens before the cadence and pin gates, leaving package_version still null."
