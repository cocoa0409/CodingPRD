        grounds: ["validations[priority=6]", state_machines.Drawdown.SUBMITTED_to_APPROVED, "errors[ERR_SOD_CONFLICT]"]
        distinguishing_aspect: "GrantsManager gm-1 who authored the subaward's RiskAssessment then approves a drawdown on that subaward -> ERR_SOD_CONFLICT (four-eyes)."
        test_recipe:
          setup: ["An ACTIVE subaward with a RiskAssessment authored by gm-1 and one SUBMITTED drawdown."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "SoD Org", uei: "UEI-SD", ein: "07-0000007" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
