      - name: recall_tasks_are_created_in_delivered_at_order_over_the_closed_window
        claim_type: chronological
        grounds:
          - calculations.recall_scope
          - errors[ERR_CAMPAIGN_NOT_DRAFT]
          - validations[priority=28]
          - entities.RecallCampaign.fields.kit_shortfall_count
        distinguishing_aspect: |
          Scope and order are both computed from delivered_at, not from insertion order: three DIESEL buses
          are imported in the sequence June, March, July yet their RemedyTasks are created March -> June ->
          July, and the bus delivered exactly on build_window_end 2026-07-31 is included while the one
          delivered 2026-08-01 is not. A PROPANE bus inside the window is filtered out by propulsion family.
