  # ===========================================================================
  - section: calculations
    instances:

      - name: utilization_activation_target_boundary_at_eighty_percent
        claim_type: Constants Applied
        grounds:
          - calculations.research_utilization_score
          - entities.ClientAccount.fields.utilization_score
        distinguishing_aspect: "The activation target 0.80 is read as a cap: a contract with 4 of 5 seats active sits exactly on the target and takes the full 40 points (score 65.00), while 3 of 5 takes only 30 points (score 55.00)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with seat_count_contracted 5, inquiry_allowance_total 5 and four ACTIVE seats."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/clients"
              payload: { legal_name: "Cobalt Financial", industry: "Financial services", region: "EMEA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 5, inquiry_allowance_total: 5, reprint_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "a1@cobalt.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "a2@cobalt.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "a3@cobalt.example", research_role: "ARCHITECT", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s3_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "a4@cobalt.example", research_role: "ARCHITECT", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s4_id: $.data.id }
            - call: "POST /research/seats/${s1_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s2_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s3_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s4_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /research/clients/${acct_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s4_id}/revoke"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "with 4 of 5 seats active ClientAccount.${acct_id}.utilization_score == 65.00 and renewal_posture == WATCH"
            - "after revoking one seat ClientAccount.${acct_id}.active_seat_count == 3"
            - "ClientAccount.${acct_id}.utilization_score == 55.00"
            - "the score is not capped at the target: neither reading is 100.00"
            - "ClientAccount.${acct_id}.contract_status == ACTIVE because 3 is not below ceil(5 / 2)"

      - name: fact_check_deadline_rolls_a_weekend_landing_to_monday
        claim_type: Correct Result
        grounds:
          - calculations.fact_check_response_deadline
          - entities.VendorInclusion.fields.fact_check_due_utc
        distinguishing_aspect: "A round opened on Saturday 2026-09-05 would end on Saturday 2026-09-19, so the deadline rolls forward to Monday 2026-09-21T23:59:59Z, and a response at exactly that instant is still on time."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Document with one INCLUDED inclusion, peer review submitted and the APPROVE verdict pending."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_an2
            - *c_ven1
            - *c_doc
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /research/vendor-inclusions/${inc_id}/finalize"
              payload: { outcome: "INCLUDE" }
              as: ResearchDirector
            - call: "POST /research/documents/${doc_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an2_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/documents/${doc_id}/peer-verdicts"
              payload: { verdict: "APPROVE" }
              as: Analyst
              as_user_id: "${an2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /research/vendor-inclusions/${inc_id}/fact-check-responses"
              payload: { response_summary: "On the deadline.", correction_offered: false }
              as: VendorRep
              as_user_id: "${ven1_id}"
          assert:
            - "VendorInclusion.${inc_id}.fact_check_due_utc == \"2026-09-21T23:59:59Z\""
            - "VendorInclusion.${inc_id}.fact_check_requested_at == \"2026-09-05T00:00:00Z\""
            - "the response at exactly the deadline succeeds and fact_check_status == VENDOR_RESPONDED"
            - "VendorInclusion.${inc_id}.fact_check_late == false"

      - name: fact_check_lapse_is_strictly_after_the_due_instant
        claim_type: Precision
        grounds:
          - state_machines.VendorInclusion.REQUESTED_to_LAPSED
          - errors.ERR_FACT_CHECK_RESPONSE_LATE
          - entities.VendorInclusion.fields.fact_check_late
        distinguishing_aspect: "The lapse boundary is strict: one second past fact_check_due_utc the round reads LAPSED and the vendor's response is refused, while the same response at the due instant was accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Document with one INCLUDED inclusion in an open fact-check round due 2026-09-15T23:59:59Z."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_an2
            - *c_ven1
            - *c_doc
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /research/vendor-inclusions/${inc_id}/finalize"
              payload: { outcome: "INCLUDE" }
              as: ResearchDirector
            - call: "POST /research/documents/${doc_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an2_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/documents/${doc_id}/peer-verdicts"
              payload: { verdict: "APPROVE" }
              as: Analyst
              as_user_id: "${an2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /research/vendor-inclusions/${inc_id}"
              payload: {}
              as: VendorRep
              as_user_id: "${ven1_id}"
            - call: "POST /research/vendor-inclusions/${inc_id}/fact-check-responses"
              payload: { response_summary: "One second too late.", correction_offered: false }
              as: VendorRep
              as_user_id: "${ven1_id}"
              captures: { err_late: $.data.error_id }
          assert:
            - "VendorInclusion.${inc_id}.fact_check_due_utc == \"2026-09-15T23:59:59Z\""
            - "the read at 2026-09-16T00:00:00Z reports fact_check_status == LAPSED and fact_check_late == true"
            - "the response returns 409 and err_late == ERR_FACT_CHECK_RESPONSE_LATE"
            - "VendorInclusion.${inc_id}.fact_check_status is still LAPSED"

      - name: reprint_fee_premium_tier_constants
        claim_type: Constants Applied
        grounds:
          - calculations.reprint_license_fee
          - entities.VendorInclusion.fields.reprint_fee_cents
        distinguishing_aspect: "The PREMIUM constants are applied as declared: 600000 base plus 500 overage copies at 700 is 950000, which clears the 500000 bracket for a 10% discount and pays 855000."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, one ACTIVE vendor and one DRAFT document."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_ven1
            - *c_doc
          trigger:
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "PREMIUM", permitted_marketing_use: "FULL_REPRINT", reprint_copies_authorized: 2500 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /research/vendor-inclusions/${inc_id}/reprint-copy-adjustments"
              payload: { delta_copies: 2500, permitted_marketing_use: "FULL_REPRINT" }
              as: VendorRep
              as_user_id: "${ven1_id}"
          assert:
            - "VendorInclusion.${inc_id}.reprint_copies_used == 2500"
            - "the pre-discount total is 600000 + 500 * 700 == 950000"
            - "VendorInclusion.${inc_id}.reprint_fee_cents == 855000"
            - "VendorInclusion.${inc_id}.permitted_marketing_use == FULL_REPRINT"

      - name: allowance_ledger_excludes_routed_inquiries_from_both_variants
        claim_type: Input Set Filtering
        grounds:
          - calculations.inquiry_allowance_ledger
          - entities.ClientAccount.fields.remaining_consumed_units
          - entities.ClientAccount.fields.remaining_reserved_units
        distinguishing_aspect: "A ROUTED inquiry is in neither the settled set nor the reserved set, so both ledger variants stay at the full allowance while the inquiry sits waiting for an analyst."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with allowance 10, one ACTIVE seat and one analyst."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
          trigger:
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Routed but not booked", requested_start_utc: "2026-09-20T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_id: $.data.id }
            - call: "GET /research/clients/${acct_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "InquiryRequest.${inq_id}.status == ROUTED"
            - "ClientAccount.${acct_id}.remaining_consumed_units == 10"
            - "ClientAccount.${acct_id}.remaining_reserved_units == 10"
            - "ClientAccount.${acct_id}.consumed_inquiry_units == 0 and reserved_inquiry_units == 0"

  # ===========================================================================
  - section: validations
    instances:

      - name: inquiry_create_missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 runs before every other check: a request that carries no X-User-Role / X-User-ID headers is a 401 ERR_UNAUTHENTICATED even though its body is also malformed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /research/inquiry-requests"
              payload: {}
              as: Anonymous
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response status is 401 and err_auth == ERR_UNAUTHENTICATED"
            - "response_type is error and data carries both error_id and message"

      - name: seat_holder_calling_client_create_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - roles.SeatHolder
        distinguishing_aspect: "Authorization precedes every business check: a SeatHolder posting a well-formed client body is refused with 403 ERR_UNAUTHORIZED because ClientAccount creation is exclusive to PlatformAdmin."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with one ACTIVE seat."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
          trigger:
            - call: "POST /research/clients"
              payload: { legal_name: "Shadow Account", industry: "Retail", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 5, inquiry_allowance_total: 5, reprint_tier: "NONE" }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { err_unauth: $.data.error_id }
          assert:
            - "the response status is 403 and err_unauth == ERR_UNAUTHORIZED"
            - "GET /research/clients returns exactly 1 row, the pre-existing account"

      - name: duplicate_seat_email_is_scoped_to_the_account
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_DUPLICATE_SEAT_EMAIL
        distinguishing_aspect: "seat_email uniqueness is tenant-scoped: a repeat on the same account is 409 ERR_DUPLICATE_SEAT_EMAIL while the identical email on a second account is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two accounts."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - call: "POST /research/clients"
              payload: { legal_name: "Second Account", industry: "Retail", region: "EMEA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 2, inquiry_allowance_total: 2, reprint_tier: "NONE" }
              as: PlatformAdmin
              captures: { acct2_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "shared@example.com", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { seat1_id: $.data.id }
          trigger:
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "shared@example.com", research_role: "ARCHITECT", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct2_id}", seat_email: "shared@example.com", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct2_id}"
              captures: { seat2_id: $.data.id }
          assert:
            - "the duplicate on the same account returns 409 and err_dup == ERR_DUPLICATE_SEAT_EMAIL"
            - "GET /research/seats?client_account_id=${acct_id} returns exactly 1 row"
            - "the identical email on the second account is accepted with status 201 and Seat.${seat2_id}.client_account_id == ${acct2_id}"

      - name: analyst_daily_inquiry_cap_blocks_the_fourth_booking
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_ANALYST_DAILY_INQUIRY_CAP
        distinguishing_aspect: "The analyst capacity rule is an aggregate over a UTC calendar day, not a pairwise overlap: three bookings on 2026-09-08 are accepted at non-overlapping times and the fourth distinct slot on the same day is refused."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with allowance 10, one ACTIVE seat and one analyst; three inquiries already SCHEDULED on 2026-09-08."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Slot one", requested_start_utc: "2026-09-08T10:00:00Z", duration_minutes: 30, preparation_notes: "Brief one." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq1_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Slot two", requested_start_utc: "2026-09-08T11:00:00Z", duration_minutes: 30, preparation_notes: "Brief two." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq2_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Slot three", requested_start_utc: "2026-09-08T12:00:00Z", duration_minutes: 30, preparation_notes: "Brief three." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq3_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Slot four", requested_start_utc: "2026-09-08T13:00:00Z", duration_minutes: 30, preparation_notes: "Brief four." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq4_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq1_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq2_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T11:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq3_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T12:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /research/inquiry-requests/${inq4_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T13:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "the fourth booking returns 409 and err_cap == ERR_ANALYST_DAILY_INQUIRY_CAP"
            - "InquiryRequest.${inq4_id}.status == ROUTED and scheduled_start_utc is null"
            - "ClientAccount.${acct_id}.reserved_inquiry_units == 3"
            - "the cap counts only the UTC calendar day: the three accepted bookings all sit on 2026-09-08 and the rejected slot is the fourth on that same day"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: document_publish_requires_cleared_state
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/research/documents/{id}/publish
          - state_machines.ResearchDocument.CLEARED_to_PUBLISHED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "publish is a conditional action: from DRAFT it is refused with 409 ERR_INVALID_STATE and no published_at is stamped, while the same call from CLEARED succeeds."
        test_recipe:
