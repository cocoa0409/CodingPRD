          assert:
            - "${a_prepaid} == 3000"
            - "${e_id} == ERR_REFUND_NOT_AVAILABLE with HTTP 422  # earned_premium 8591 plus fee 2500 exceeds the 3000 prepayment, so refund_cents would be -8091"
            - "GET /enrollments/${enrollment_a} still reports coverage_status ACTIVE, refund_cents null and version 2  # the refused cancellation is fully rolled back"
            - "GET /ledger-entries?enrollment_id=${enrollment_a}&ledger_kind=CASH returns no PRORATION_REFUND row"
            - "${ok_coverage} == CANCELLED, ${ok_earned} == 8591, ${ok_fee} == 2500, ${ok_refund} == 18897, ${ok_credit} == 0 and ${ok_reason} == CUSTOMER_REQUEST  # Aug 27/31 -> 2177, Sep 30/30 -> 2499, Oct 31/31 -> 2499, Nov 17/30 -> 1416, each rounded before the sum"
            - "GET /ledger-entries?enrollment_id=${enrollment_b}&ledger_kind=CASH returns a PRORATION_REFUND row with amount_cents -18897"

      - name: err_remedy_gates_target_then_disposition_then_posted_benefit
        claim_type: priority_ordering
        grounds:
          - validations.complaint-remedy-target-required
          - validations.unsubstantiated-remedy-forbidden
          - validations.reversal-within-posted-benefit
          - errors[ERR_REMEDY_TARGET_MISSING]
          - errors[ERR_REMEDY_NOT_PERMITTED]
          - errors[ERR_REVERSAL_EXCEEDS_BENEFIT]
        distinguishing_aspect: "The three remedy gates fire in their declared order on payloads that differ only in one field: a complaint with no cited target reports ERR_REMEDY_TARGET_MISSING even when the disposition is UNSUBSTANTIATED (which would also be illegal), a cited complaint with UNSUBSTANTIATED reports ERR_REMEDY_NOT_PERMITTED, and a substantiated reversal above the posted 527000 reports ERR_REVERSAL_EXCEEDS_BENEFIT at priority 70."
        test_recipe:
          setup:
            - "One settled claim with benefit_paid_cents 527000 on an ACTIVE enrollment; complaint X cites nothing, complaint Y cites both that claim and that enrollment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /contractors"
              payload: { name: "Cascade Trenchless", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-06-30", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { contractor_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Collapsed service line at the curb." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v2: $.data.version }
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_v2}", contractor_id: "${contractor_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { dispatch_id: $.data.id }
            - call: "POST /dispatches/${dispatch_id}/events"
              payload: { event_type: "ACCEPT" }
              as: NetworkContractor
              as_user_id: "${contractor_id}"
            - call: "POST /dispatches/${dispatch_id}/events"
              payload: { event_type: "ARRIVE" }
              as: NetworkContractor
              as_user_id: "${contractor_id}"
            - call: "POST /dispatches/${dispatch_id}/events"
              payload: { event_type: "COMPLETE", labor_cents: 260000, materials_cents: 175000, permit_number: "PRM-9001", permit_fee_cents: 42000, restoration_cents: 90000, restoration_scope: "BASIC_BACKFILL" }
              as: NetworkContractor
              as_user_id: "${contractor_id}"
              captures: { settled_benefit: $.data.benefit_paid_cents }
            - call: "POST /regulator-complaints"
              payload: { partner_id: "${partner_id}", regulator: "BBB", allegation: "Generic advertising complaint with no policy attached." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_x: $.data.id, complaint_x_v1: $.data.version, x_claim: $.data.claim_id, x_enrollment: $.data.enrollment_id }
            - call: "POST /regulator-complaints"
              payload: { partner_id: "${partner_id}", regulator: "PUC", allegation: "Homeowner says the restoration was billed twice.", claim_id: "${claim_id}", enrollment_id: "${enrollment_id}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_y: $.data.id, complaint_y_v1: $.data.version }
          trigger:
            - call: "POST /regulator-complaints/${complaint_x}/response"
              payload: { response_summary: "Reversing a benefit that was never cited.", disposition: "UNSUBSTANTIATED", remedy_type: "BENEFIT_REVERSAL", remedy_amount_cents: 100000, expected_complaint_version: "${complaint_x_v1}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { e_target: $.data.error_id }
            - call: "POST /regulator-complaints/${complaint_y}/response"
              payload: { response_summary: "Nothing wrong was found, but here is a refund.", disposition: "UNSUBSTANTIATED", remedy_type: "PREMIUM_REFUND", remedy_amount_cents: 5000, expected_complaint_version: "${complaint_y_v1}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { e_not_permitted: $.data.error_id }
            - call: "POST /regulator-complaints/${complaint_y}/response"
              payload: { response_summary: "Reversing more than was ever paid.", disposition: "SUBSTANTIATED", remedy_type: "BENEFIT_REVERSAL", remedy_amount_cents: 600000, expected_complaint_version: "${complaint_y_v1}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { e_reversal: $.data.error_id }
            - call: "POST /regulator-complaints/${complaint_y}/response"
              payload: { response_summary: "Full reversal of the posted benefit.", disposition: "SUBSTANTIATED", remedy_type: "BENEFIT_REVERSAL", remedy_amount_cents: 527000, expected_complaint_version: "${complaint_y_v1}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { ok_status: $.data.status, ok_remedy: $.data.remedy_type, ok_amount: $.data.remedy_amount_cents, ok_version: $.data.version }
          assert:
            - "${settled_benefit} == 527000 and ${x_claim} == null with ${x_enrollment} == null"
            - "${e_target} == ERR_REMEDY_TARGET_MISSING with HTTP 422  # complaint-remedy-target-required is declared before unsubstantiated-remedy-forbidden at the same priority 50, so the missing target wins over the illegal disposition"
            - "${e_not_permitted} == ERR_REMEDY_NOT_PERMITTED with HTTP 422  # the target is present here, so only the disposition rule can fire"
            - "${e_reversal} == ERR_REVERSAL_EXCEEDS_BENEFIT with HTTP 422  # 600000 exceeds the cited claim's benefit_paid_cents 527000"
            - "${ok_status} == CLOSED_SUBSTANTIATED, ${ok_remedy} == BENEFIT_REVERSAL, ${ok_amount} == 527000 and ${ok_version} == 2  # the three refusals left the complaint at version 1, which is why the same expected_complaint_version still works"
            - "GET /ledger-entries?claim_id=${claim_id}&ledger_kind=BENEFIT returns two rows in created_at ASC order: BENEFIT_CHARGE 527000 then a reversal row of -527000"
            - "GET /enrollments/${enrollment_id} reports annual_benefit_used_cents 0 and cap_status WITHIN_CAP"
            - "GET /regulator-complaints/${complaint_x} still reports status OPEN with version 1"

      # --- errors already exercised in depth by §1.8 -------------------------
      - name: err_enrollment_not_active_and_annual_cap_exhausted_on_triage
        claim_type: priority_ordering
        grounds:
          - validations.enrollment-must-be-live-for-triage-approval
          - validations.annual-cap-available
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
          - errors[ERR_ANNUAL_CAP_EXHAUSTED]
        excluded_because:
          difficulty_instance: enrollment_state_gate_outranks_annual_cap_fiscal_check
          rationale: "That instance builds an enrollment that is simultaneously SUSPENDED_NONPAY and ANNUAL_CAP_EXHAUSTED and asserts the priority-30 state gate wins over the priority-70 fiscal gate, then clears the suspension to expose ERR_ANNUAL_CAP_EXHAUSTED underneath. Both triggers and their ordering are already pinned."
      - name: err_appeal_limit_reached_on_the_third_appeal
        claim_type: violation_to_error
        grounds:
          - validations.appeal-limit
          - errors[ERR_APPEAL_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: claim_denial_appeal_remand_cycle_bounded_by_appeal_limit
          rationale: "That instance cycles DENIED -> APPEAL_OPEN -> DENIED twice, refreshing denied_at on each REMAND, and asserts the third appeal is refused with ERR_APPEAL_LIMIT_REACHED at appeal_count 2 == MAX_CLAIM_APPEALS."
      - name: err_contractor_license_expired_and_not_certified_on_manual_dispatch
        claim_type: priority_ordering
        grounds:
          - validations.contractor-license-current
          - validations.contractor-line-certified
          - errors[ERR_CONTRACTOR_LICENSE_EXPIRED]
          - errors[ERR_CONTRACTOR_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: contractor_licence_safety_check_outranks_certification_referential_check
          rationale: "That instance dispatches to a contractor that is both unlicensed and uncertified, asserts ERR_CONTRACTOR_LICENSE_EXPIRED (safety, 40) wins over ERR_CONTRACTOR_NOT_CERTIFIED (referential, 50), and then renews only the licence to expose the certification error."
      - name: err_contractor_window_conflict_inside_the_travel_buffer
        claim_type: temporal_validation
        grounds:
          - calculations.contractor_visit_window_conflict
          - errors[ERR_CONTRACTOR_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: contractor_visit_windows_collide_across_the_travel_buffer
          rationale: "That instance walks the exact TRAVEL_BUFFER_MINUTES 45 boundary on both sides, so the last colliding minute and the first admissible minute of the second window are already asserted."
      - name: err_drop_window_conflict_inside_the_partner_spacing_window
        claim_type: temporal_validation
        grounds:
          - validations.drop-window-spacing
          - errors[ERR_DROP_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: campaign_drop_dates_collide_inside_the_partner_spacing_window
          rationale: "That instance pins min_days_between_drops 21 at both the day-20 refusal and the day-21 acceptance against an already MAILED campaign."
      - name: err_campaign_not_mailed_on_a_campaign_sourced_enrollment
        claim_type: cross_entity_validation
        grounds:
          - validations.campaign-must-be-mailed
          - errors[ERR_CAMPAIGN_NOT_MAILED]
        excluded_because:
          difficulty_instance: enrollment_requires_sourcing_campaign_in_mailed_state
          rationale: "That instance walks an APPROVED campaign through the refusal and then executes the drop so the identical enrollment body succeeds, isolating the state gate from the suppression gate."
      - name: err_contractor_not_active_on_a_probationary_contractor
        claim_type: cross_entity_validation
        grounds:
          - validations.contractor-must-be-active
          - errors[ERR_CONTRACTOR_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: manual_dispatch_requires_contractor_not_on_probation
          rationale: "That instance drives a contractor onto PROBATION through SLA_BREACH_PROBATION_THRESHOLD breaches and asserts the manual dispatch refusal, so the trigger and its cause are already covered."
      - name: err_waiting_period_not_elapsed_at_the_coverage_effective_instant
        claim_type: temporal_validation
        grounds:
          - validations.waiting-period-elapsed
          - calculations.claim_eligibility_assessment
          - errors[ERR_WAITING_PERIOD_NOT_ELAPSED]
        excluded_because:
          difficulty_instance: waiting_period_boundary_at_exact_coverage_effective_instant
          rationale: "That instance asserts the refusal one millisecond before coverage_effective_at and the acceptance at the instant itself, which is the entire content of this error."

  # ===========================================================================
  # Section 7 - rbac
  #
  # Walks §1.7 role by role. Every role's exclusive_operations are exercised on
  # the allow side and refused for at least one other role on the deny side,
  # the read-scoping carve-outs are pinned, and the entity_backed roles are
  # driven against resources they do not own. The role_model is
  # segregation_of_duties, so both §1.4 priority-8 rules get their own instance.
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_platform_admin_exclusive_writes_are_closed_to_other_roles
        claim_type: forbidden_operations
        grounds:
          - roles.PlatformAdmin
          - roles.MarketingOps
          - roles.OperationsAdmin
          - validations.role-permitted
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The three PlatformAdmin exclusives refuse other roles with ERR_UNAUTHORIZED before any body or path id is resolved, while PlatformAdmin's shared operations (POST /premises, POST /contractors, the nightly run and the clock) are accepted - so the role check is per endpoint, not per role tier."
        test_recipe:
          setup:
            - "An empty system with the clock pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { e_partner_create: $.data.error_id }
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000 }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { e_product_create: $.data.error_id }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
