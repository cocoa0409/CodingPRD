            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 5 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 10.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 5, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "GET /linen-stocks/${s1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { ret: $.data.retired_pieces, circ: $.data.in_circulation, cyc: $.data.wash_cycles_completed } }
          assert:
            - "wash_cycles_completed == 5"
            - "retired_pieces == 1 (crossing the 5-cycle multiple)"
            - "in_circulation == 39 (35 + 5 returned - 1 retired)"

      - name: stock_posture_threshold_flips
        claim_type: boundary_edge
        grounds:
          - calculations.stock_posture
        distinguishing_aspect: "Strict < boundaries: available 20 with reorder 15 is LOW (20 < 22 = floor(1.5*15)); after a -6 adjustment available 14 is CRITICAL (14 < 15); available exactly 15 would be LOW, not CRITICAL."
        test_recipe:
          setup: ["facility; stock S1 reorder_point 15, opening 20, reserve 0 (available 20 -> LOW)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 15, opening_pieces: 20, opening_reserve_pieces: 0 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id, v1: $.data.version, pos1: $.data.posture } }
          trigger:
            - { call: "POST /linen-stocks/${s1}/adjustments", payload: { delta_pieces: -6, reason: "WRITE_OFF", expected_linen_stock_version: "${v1}" }, as: LinenManager, as_user_id: "lm-1", captures: { pos2: $.data.posture, circ: $.data.in_circulation } }
          assert:
            - "posture at creation == LOW (20 >= 15 but < 22)"
            - "after adjustment: in_circulation == 14 and posture == CRITICAL (14 < 15)"

      - name: unit_quality_flag_watch_window_boundary
        claim_type: boundary_edge
        grounds:
          - calculations.unit_quality_flag
        distinguishing_aspect: "Count boundary >= 3 inside a trailing 30-day window with inclusive edge: 2 verified complaints leave CLEAR, the 3rd flips WATCH; at exactly +30 days the window still includes them, at +31 days it does not."
        test_recipe:
