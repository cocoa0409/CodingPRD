# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3155_digital_freight_matching_instant_pricing_carrier_tendering
#
# Breadth probe over the claim-extraction guide's nine sections. Corners that
# §1.8 already asserts appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: shipper_create_returns_every_declared_field_and_starts_active
    claim_type: Creation
    grounds:
    - entities.Shipper
    - endpoints.POST_/v1/shippers
    - validations[priority=13]
    distinguishing_aspect: A shipper created with the six declared inputs comes back 201 with status ACTIVE, version 1, credit_used_cents
      0, load_credits_committed 0, breached_pickup_count 0 and an empty blocked_carrier_ids — none of those five are client-supplied.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - Shipper.${shipper_id}.status == ACTIVE and Shipper.${shipper_id}.version == 1
      - Shipper.${shipper_id}.credit_used_cents == 0 and Shipper.${shipper_id}.load_credits_committed == 0
      - Shipper.${shipper_id}.load_credits_available == 10
      - Shipper.${shipper_id}.breached_pickup_count == 0 and Shipper.${shipper_id}.blocked_carrier_ids == []
      - Shipper.${shipper_id}.last_repriced_lane is null
  - name: facility_create_applies_its_two_field_defaults
    claim_type: Defaults
    grounds:
    - entities.Facility.fields.default_appointment_minutes
    - entities.Facility.fields.free_dwell_minutes
    - endpoints.POST_/v1/facilities
    distinguishing_aspect: Omitting default_appointment_minutes and free_dwell_minutes stores 60 and 120 rather than null,
      and the derived detention arithmetic then bills zero for a 120-minute dwell — a facility created without the defaults
      would bill one hour.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          facility_id: $.data.id
      assert:
      - the response status is 201
      - Facility.${facility_id}.default_appointment_minutes == 60
      - Facility.${facility_id}.free_dwell_minutes == 120
      - Facility.${facility_id}.docks_committed_today == 0 and Facility.${facility_id}.status == ACTIVE
      - Facility.${facility_id}.default_appointment_minutes != 0 and Facility.${facility_id}.free_dwell_minutes != 0
  - name: carrier_equipment_listing_paginates_and_reports_total_count
    claim_type: Listing
    grounds:
    - endpoints.GET_/v1/carrier-equipment
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With four units on file, limit=2&offset=0 returns 2 rows with total_count 4 and has_more true,
      offset=2 returns the last 2 with has_more false, and an unfiltered list defaults limit to 10 — total_count counts the
      whole filtered set, not the page.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One carrier with four equipment units, one of them IN_SHOP.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          origin_facility_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Inland Empire DC
          state_code: CA
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          destination_facility_id: $.data.id
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          carrier_id: $.data.id
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: DRY_VAN
          unit_number: TR-9001
          driver_name: D. Okafor
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          equipment_id: $.data.id
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: DRY_VAN
          unit_number: TR-9002
          driver_name: L. Brandt
        as: Carrier
        as_user_id: ${carrier_id}
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: REEFER
          unit_number: TR-9003
          driver_name: M. Pham
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          equip_shop: $.data.id
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: FLATBED
          unit_number: TR-9004
          driver_name: R. Silva
        as: Carrier
        as_user_id: ${carrier_id}
      - call: POST /v1/carrier-equipment/${equip_shop}/status
        payload:
          status: IN_SHOP
        as: Carrier
        as_user_id: ${carrier_id}
      trigger:
      - call: GET /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          limit: 2
          offset: 0
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          page1: $.data[0].id
      assert:
      - the response status is 200 and response_type is array
      - the response returns exactly 2 rows with total_count == 4 and has_more == true
      - GET /v1/carrier-equipment?carrier_id=${carrier_id}&limit=2&offset=2 returns 2 rows with has_more == false
      - GET /v1/carrier-equipment?status=IN_SHOP returns exactly 1 row
      - GET /v1/carrier-equipment?equipment_type=REEFER returns exactly 1 row
      - GET /v1/carrier-equipment with no query parameters returns 4 rows
  - name: load_get_for_an_unallocated_id_returns_load_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/v1/loads/{id}
    - errors.ERR_LOAD_NOT_FOUND
    - validations[priority=3]
    distinguishing_aspect: A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_LOAD_NOT_FOUND,
      and the same unallocated id in a request body produces the same error id rather than a generic ERR_NOT_FOUND.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. No load has been created.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      trigger:
      - call: GET /v1/loads/00000000-0000-4000-8000-0000000000ff
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          path_error: $.data.error_id
      assert:
      - the response status is 404 and path_error == ERR_LOAD_NOT_FOUND
      - response_type is error and data carries both error_id and message
      - the same call to GET /v1/loads/not-a-uuid returns 404 with error_id == ERR_LOAD_NOT_FOUND
  - name: load_create_with_an_out_of_enum_market_band_returns_invalid_request
    claim_type: Type Constraints
    grounds:
    - entities.Load.fields.market_band
    - validations[priority=13]
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: market_band is a closed three-member enum; the value HOT is rejected at priority 13 with 400 ERR_INVALID_REQUEST
      rather than falling through to a pricing error, and no quote is produced.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper and two facilities.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          origin_facility_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Inland Empire DC
          state_code: CA
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          destination_facility_id: $.data.id
      trigger:
      - call: POST /v1/loads
        payload:
          shipper_id: ${shipper_id}
          origin_facility_id: ${origin_facility_id}
          destination_facility_id: ${destination_facility_id}
          pricing_mode: SPOT
          equipment_type: DRY_VAN
          commodity: GENERAL
          weight_lbs: 40000
          declared_cargo_value_cents: 5000000
          distance_miles: 1200
          pickup_window_start: '2026-10-05T08:00:00Z'
          pickup_window_end: '2026-10-05T12:00:00Z'
          delivery_deadline: '2026-10-07T18:00:00Z'
          market_band: HOT
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 400 and error_id == ERR_INVALID_REQUEST
      - GET /v1/loads?shipper_id=${shipper_id} returns 0 rows
      - GET /v1/shippers/${shipper_id} reports load_credits_committed == 0
  - name: tracking_ping_extra_client_sequence_and_status_rank_are_ignored_input
    claim_type: System Fields
    grounds:
    - entities.TrackingPing.fields.sequence
    - endpoints.POST_/v1/loads/{id}/tracking-pings
    distinguishing_aspect: 'TrackingPing carries common_fields false, so sequence is server-assigned and status_rank is computed:
      a client that posts sequence 99 and status_rank 5 is ignored and the row is stored with sequence 3 and status_rank 3,
      the next values in the load''s own progression.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. A booked load with pings 1 and 2 already recorded, and the clock sitting at
        the pickup instant for ping 1.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
