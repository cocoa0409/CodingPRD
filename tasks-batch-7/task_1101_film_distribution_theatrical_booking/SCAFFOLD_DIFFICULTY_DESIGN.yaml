              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 2, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
