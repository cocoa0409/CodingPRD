  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: admission_activate_requires_pasrr_cleared
        grounds:
          - state_machines.Admission.PENDING_to_ACTIVE
          - validations[priority=6]
          - entities.PasrrScreening.fields.status
          - errors[ERR_PASRR_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair Admission -> PasrrScreening: Admission's PENDING->ACTIVE transition is
          gated on the linked PasrrScreening.status==CLEARED; with PASRR still PENDING the
          activate is rejected ERR_PASRR_NOT_CLEARED. This is a PRIVATE-payer admission so no
          qualifying-stay rule interferes — isolates the PASRR dependency.
        test_recipe:
          setup:
            - "PRIVATE admission whose linked PASRR is still PENDING"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "AP SNF", cms_certification_number: "CCN-AP1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "AP Res", medical_record_number: "MRN-AP1", date_of_birth: "1951-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
          trigger:
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == 'ERR_PASRR_NOT_CLEARED'"

      - name: assessment_reopen_blocked_by_finalized_claim
        grounds:
          - state_machines.MdsAssessment.COMPLETED_to_IN_PROGRESS
          - validations[priority=19]
          - entities.Claim.fields.status
          - errors[ERR_ASSESSMENT_LOCKED_BY_CLAIM]
        distinguishing_aspect: |
          DIFFERENT entity pair MdsAssessment -> Claim: an assessment's COMPLETED->IN_PROGRESS
          reopen is gated on no driving Claim being FINALIZED/SUBMITTED/PAID. With a FINALIZED
          claim driven by it, reopen is rejected ERR_ASSESSMENT_LOCKED_BY_CLAIM — a state
          dependency crossing a distinct entity pair from Admission->PasrrScreening.
        test_recipe:
          setup:
            - "Medicare admission with a SUBMITTED assessment that drives a FINALIZED claim"
