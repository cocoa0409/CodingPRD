          rationale: "Asserted as the failure path and the success path of the named §1.8 instance: its trigger drives POST /api/v1/lease-fleet-cars/{id}/settle-returns while the car is UNDER_REPAIR and its CarReturn is still PENDING, pinning HTTP 409 with data.error_id == \"ERR_UNSETTLED_RETURNS\", then proves the same call returns HTTP 200 with status HELD once POST /api/v1/car-returns/{id}/settle flips that CarReturn to SETTLED."

