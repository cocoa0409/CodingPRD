        distinguishing_aspect: "Segregation of duties at K1Amendment issue: the user recorded as prepared_by cannot issue."
        test_recipe:
          setup: ["canonical single-partner fund; K1 delivered; amendment in IN_REVIEW with prepared_by_user_id == rev_1"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund V19", ein: "22-4000020", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
