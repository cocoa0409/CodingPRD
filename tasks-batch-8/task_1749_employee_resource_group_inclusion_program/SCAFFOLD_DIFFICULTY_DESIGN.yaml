      - name: mentoring_buffered_window
        grounds:
          - state_machines.MentoringEngagement.transitions
          - errors[ERR_MENTORING_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Buffered closed-interval semantics on resource ExecutiveSponsor (different
          geometry than the venue's half-open adjacency): a new engagement starting
          2026-09-28 is INSIDE the 14-day post-buffer of an engagement ending 2026-09-15
          and is rejected, while one starting exactly at ends_at + 14 days (2026-09-29)
          is allowed.
        test_recipe:
          setup:
            - "Program OPEN; sponsor emp_spm (max_mentees 3) ACTIVE"
            - "Engagement E1 for mentee emp_m1: 2026-09-01T00:00:00Z to 2026-09-15T00:00:00Z, PROPOSED"
