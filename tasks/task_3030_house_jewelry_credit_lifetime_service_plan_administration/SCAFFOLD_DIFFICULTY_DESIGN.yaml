              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450018, down_payment_cents: 45002 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0101", stone_kind: "NATURAL", carat: 0.95 }
              as: SalesAssociate
              captures: { diamond_id: $.data.id }
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: ChainAdmin
            - call: "GET /promotional-plans/${plan_id}"
              payload: {}
              as: CustomerService
              captures: { plan_v_before: $.data.version }
          trigger:
            - call: "POST /promotional-plans/${plan_id}/payoff"
              payload: { amount_cents: 515220, expected_plan_version: "${plan_v_before}" }
              as: CustomerService
              captures: { plan_v_after_payoff: $.data.version }
            - call: "POST /promotional-plans/${plan_id}/reinstate"
              payload: { expected_plan_version: "${plan_v_after_payoff}" }
              as: CreditAnalyst
          assert:
            - "before the payoff PromotionalPlan.${plan_id}.final_settlement_amount_cents == 515220 (principal 450000 plus 65220 deferred interest)"
            - "after the payoff PromotionalPlan.${plan_id}.plan_status == PAID and the LUMPSUM_PAYOFF entry records amount_cents == 515220 with direction DECREASE"
            - "after reinstatement PromotionalPlan.${plan_id}.plan_status == ACCRUING and the ledger's net INCREASE-minus-DECREASE is still 515220"
            - "the conserved quantity B == principal_cents + deferred_interest_accrued_cents + sum(INCREASE) - sum(DECREASE) is identical before the payoff and after reinstatement, carrying zero drift"
            - "Customer.${customer_id}.account_status == OPEN and standalone_credit_limit_cents == 1000000 after reinstatement"

      # --- Conserved quantity B: a countable obligation population ---
      - name: replacement_registration_swap_conserves_the_open_inspection_population
        grounds:
          - state_machines.Purchase.FINANCED_to_COMPLETED
          - state_machines.ServicePlanRegistration.ACTIVE_to_TERMINATED
          - entities.Store.fields.open_inspection_count
          - state_machines.Customer.OPEN_to_CLOSED
        distinguishing_aspect: "A conserved countable quantity on a different subject, the store's open inspection population C = count of registrations at that store with coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED}: a trade-up terminates the origin registration and opens exactly one replacement, so C is unchanged by the swap, and a subsequent customer close that terminates the survivor drains C to exactly 0 with no negative residue."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE. Customer Nina OPEN with an approved application, origin purchase P1 completed with registration R1 open for inspection, and new purchase P2 ticketed at 900000 naming P1 as origin."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /credit-limit-registry-state"
              payload: { registry_key: "TX", credit_tier: "TIER_3", base_limit_cents: 2000000, min_down_payment_pct: 0.10, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1500000, requested_purchase_amount_cents: 900000, down_payment_cents: 90000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0111", stone_kind: "NATURAL", carat: 0.90 }
              as: SalesAssociate
              captures: { origin_diamond_id: $.data.id }
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0112", stone_kind: "NATURAL", carat: 1.40, origin_registry: "KIMBERLEY-TX-5150" }
              as: SalesAssociate
              captures: { new_diamond_id: $.data.id }
            - call: "POST /protection-bundles"
              payload: { bundle_code: "BUNDLE_180", display_name: "Lifetime Diamond 180", lifetime_plan_fee_cents: 19900, stone_limit_labor_cents: 25000, stone_limit_parts_cents: 60000, inspection_interval_days: 180, inspection_cure_days: 30 }
              as: ChainAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /service-plan-regulations"
              payload: { state_code: "TX", max_plan_term_months: 60, inspection_required_months: 6, lapse_cure_days: 30, replacement_plus_pct: 1.0, max_inspection_gap_days: 210 }
              as: ChainAdmin
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${origin_diamond_id}" }
              as: SalesAssociate
              captures: { origin_purchase_id: $.data.id }
            - call: "POST /purchases/${origin_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${origin_purchase_id}", diamond_id: "${origin_diamond_id}", store_id: "${store_id}", bundle_id: "${bundle_id}", plan_term_months: 24 }
              as: StoreManager
              captures: { origin_registration_id: $.data.id }
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 900000, diamond_id: "${new_diamond_id}", origin_purchase_id: "${origin_purchase_id}" }
              as: SalesAssociate
              captures: { new_purchase_id: $.data.id }
          trigger:
            - call: "POST /purchases/${new_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
          assert:
            - "before the trade-up Store.${store_id}.open_inspection_count == 1"
            - "after the trade-up ServicePlanRegistration.${origin_registration_id}.coverage_status == TERMINATED and exactly one replacement registration exists at PENDING_INSPECTION"
            - "Store.${store_id}.open_inspection_count == 1 again, so the swap conserves the open inspection population"
            - "the conserved quantity C == count of registrations with coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED} equals 1 both before and after, with zero drift"
            - "GET /service-plan-registrations?store_id=${store_id} returns exactly 2 rows in total, one TERMINATED and one PENDING_INSPECTION"