  # --------------------------------------------- cross-cutting complexity ---
  - section: cross_cutting_layers
    instances:
      - name: occ_program_amend_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[program-amend-stale-version]"
          - "errors[ERR_STALE_PROGRAM_VERSION]"
        distinguishing_aspect: "Two strictly sequential amends against the same observed version: the first succeeds and bumps version 1 -> 2; the second, still carrying the stale expected_program_version == 1, is rejected with ERR_STALE_PROGRAM_VERSION (412)."
        test_recipe:
          setup: ["GA program DRAFT (version 1 captured at create)"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id, prog_v: $.data.version } }
          trigger:
            - { call: "POST /api/jurisdiction-programs/${prog_id}/amend", payload: { expected_program_version: "${prog_v}", base_rate_standard: 0.22 }, as: FilmOfficeAdmin, captures: { v_after: $.data.version, rate_after: $.data.base_rate_standard } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/amend", payload: { expected_program_version: "${prog_v}", base_rate_standard: 0.21 }, as: FilmOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First amend (expected == current 1): 200, base_rate_standard == 0.22, version == 2"
            - "Second amend (expected still 1, now stale): error_id == ERR_STALE_PROGRAM_VERSION (http 412); base_rate_standard stays 0.22"
      - name: occ_transfer_create_stale_certificate
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[transfer-create-stale-certificate]"
          - "errors[ERR_STALE_CERTIFICATE_VERSION]"
        distinguishing_aspect: "A seller who read the certificate at version V and already created one proposal (bumping the version) cannot create a second proposal still carrying V: ERR_STALE_CERTIFICATE_VERSION (412). Re-reading and carrying the fresh version succeeds — multiple PROPOSED transfers are legitimate, staleness is the only rejection."
        test_recipe:
          setup: ["GA program OPEN; application APPROVED; audit ACCEPTED (40000000/162500000); certificate issued (cert_v captured); buyer registered"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_id}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_id: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_id}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/attest", payload: { attested_atl_cents: 40000000, attested_btl_cents: 162500000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/decision", payload: { outcome: "ACCEPT" }, as: FilmOfficeReviewer, as_user_id: "reviewer-3" }
            - { call: "POST /api/applications/${app_id}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { cert_id: $.data.id, cert_v: $.data.version } }
            - { call: "POST /api/credit-buyers", payload: { legal_name: "Magnolia Utilities Corp", tax_id: "82-4402177", contact_email: "tax@magnolia.example" }, as: CreditBuyer, captures: { buyer_id: $.data.id } }
          trigger:
            - { call: "POST /api/transfers", payload: { certificate_id: "${cert_id}", buyer_id: "${buyer_id}", amount_cents: 5000000, price_cents: 4500000, expected_certificate_version: "${cert_v}" }, as: Producer, as_user_id: "${co_id}", captures: { t1: $.data.id } }
            - { call: "POST /api/transfers", payload: { certificate_id: "${cert_id}", buyer_id: "${buyer_id}", amount_cents: 6000000, price_cents: 5400000, expected_certificate_version: "${cert_v}" }, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/certificates/${cert_id}", as: Producer, as_user_id: "${co_id}", captures: { cert_v2: $.data.version } }
            - { call: "POST /api/transfers", payload: { certificate_id: "${cert_id}", buyer_id: "${buyer_id}", amount_cents: 6000000, price_cents: 5400000, expected_certificate_version: "${cert_v2}" }, as: Producer, as_user_id: "${co_id}", captures: { t2: $.data.id, t2_st: $.data.status } }
          assert:
            - "First create: 201 PROPOSED (certificate version bumped by the create)"
            - "Second create with the stale version: error_id == ERR_STALE_CERTIFICATE_VERSION (http 412); no transfer persisted"
            - "After re-reading the certificate, the SAME payload with the fresh version: 201 PROPOSED — staleness, not the proposal itself, caused the rejection"
      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.SpendEntry.QUALIFIED_to_DISQUALIFIED"
          - "state_machines.Vendor.VERIFIED_to_REJECTED"
          - "state_machines.CreditTransfer.ACCEPTED_to_SETTLED"
        excluded_because:
          difficulty_instance: disqualify_after_issuance_auto_clawback
          rationale: "All three cascade chains (disqualify, vendor revocation, settle auto-cancel) are asserted end-to-end with literals in §1.8 transitive_cascade instances."
      - name: rate_threshold_boundary_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.credit_amount"
          - "calculations.transfer_price_floor"
        excluded_because:
          difficulty_instance: tiered_credit_rate_threshold_straddle
          rationale: "Tier threshold (inclusive) and price-floor boundary are asserted in §1.8 combinatorial_formula / boundary_precision_check instances."
      - name: corner_boundaries_covered_by_difficulty
        claim_type: boundary_precision
        grounds:
          - "errors[ERR_APPLICATION_DEADLINE_PASSED]"
          - "errors[ERR_PROGRAM_CAP_EXHAUSTED]"
          - "errors[ERR_TRANSFER_PRICE_BELOW_FLOOR]"
          - "errors[ERR_VERIFICATION_WINDOW_EXPIRED]"
          - "errors[ERR_PROGRAM_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: submit_at_exact_deadline_inclusive
          rationale: "Deadline inclusivity, exact cap fit, price floor, verification-window containment, and program-window adjacency are asserted in the five §1.8 boundary_precision_check / resource_temporal_overlap instances."
      - name: corner_cross_entity_gates_covered_by_difficulty
        claim_type: cross_entity_validation
        grounds:
          - "errors[ERR_VENDOR_RESIDENCY_NOT_VERIFIED]"
          - "errors[ERR_AUDIT_NOT_ACCEPTED]"
        excluded_because:
          difficulty_instance: spend_qualify_requires_vendor_verified
          rationale: "All three cross-entity state gates (vendor, audit package, application-for-clawback) are asserted in §1.8 cross_entity_state_dependency instances."
      - name: corner_invariants_covered_by_difficulty
        claim_type: compensating_invariant
        grounds:
          - "entities.JurisdictionProgram.fields.remaining_cap_cents"
          - "entities.IncentiveApplication.fields.capped_total_qualified_cents"
        excluded_because:
          difficulty_instance: qualify_disqualify_round_trip_conserves_totals
          rationale: "Both compensating-action invariants (spend totals round-trip, program cap issue/clawback round-trip) are asserted with zero-drift literals in §1.8 compensating_invariant instances."
      - name: corner_cycles_covered_by_difficulty
        claim_type: cyclic
        grounds:
          - "state_machines.IncentiveApplication"
          - "state_machines.CreditTransfer"
          - "state_machines.AuditPackage"
        excluded_because:
          difficulty_instance: application_correction_loop_cycle
          rationale: "The three cyclic machines (correction loop, negotiation loop, audit rework loop) are exercised multi-round in §1.8 non_linear_state_machine instances."
      - name: corner_dual_variant_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.credit_amount"
          - "calculations.cashflow_projection"
        excluded_because:
          difficulty_instance: cashflow_optimistic_vs_conservative_schedule
          rationale: "Variant divergence and variant-context selection are asserted in the three §1.8 dual_variant_calc instances."

