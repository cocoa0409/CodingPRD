          Specification lock is a ProgramDirector exclusive operation, so PackagingDesigner - the role that owns the
          artwork this specification pins - is still refused 403 ERR_UNAUTHORIZED. The refusal happens at priority 3,
          before the priority-16 state check and before the fiscal commitment, so the DRAFT specification keeps a
          null slotting fee and the program stays uncommitted.
