  # --- FleetSizingRequest --------------------------------------------
  - method: POST
    path: "/fleet-sizing-requests"
    description: "Sizes a motive-power battery for a forklift application and matches a charger to it. Runs the whole selector in one request: daily energy, temperature derate, reserve and depth-of-discharge factors, per-candidate required amp-hours, the pinned design-then-charger evaluation order, and the resulting fleet counts and capital cost."
    roles: [FleetEngineer]
    code: 201
    input: [plant_id, application_name, forklift_class, forklift_count, shift_energy_kwh_per_shift, shifts_per_day, ambient_temp_c, required_voltage_v, compartment_max_kg, charge_window_hours, "chemistry_preference?"]
    output: FleetSizingRequest
    side_effects:
      - "request_state initialises to MATCHED."
      - "CALC motive_power_sizing computes daily_energy_kwh, temp_derate_factor, reserve_factor, required_ah, evaluated_design_count, selected_cell_design_id, selected_charger_id, selected_charge_hours, recommended_battery_count, recommended_charger_count and fleet_capital_cents."
      - "Only APPROVED cell designs whose nominal_pack_voltage_v equals required_voltage_v and whose pack_weight_kg <= compartment_max_kg are eligible; only AVAILABLE chargers whose chemistry_compatibility equals the design chemistry are matchable."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_PLANT_NOT_FOUND, ERR_NO_ELIGIBLE_CELL_DESIGN, ERR_NO_CHARGER_MATCH]

  - method: GET
    path: "/fleet-sizing-requests"
    description: "Lists fleet sizing requests, created_at ASC then id ASC, filterable by plant, selected design, selected charger and state."
    roles: [PlantAdmin, FleetEngineer, ProductionSupervisor]
    code: 200
    input: ["plant_id?", "selected_cell_design_id?", "selected_charger_id?", "request_state?", "limit?", "offset?"]
    output: FleetSizingRequest[]

  - method: GET
    path: "/fleet-sizing-requests/{id}"
    description: "Reads one sizing request with every derived sizing factor and the selection it produced."
    roles: [PlantAdmin, FleetEngineer, ProductionSupervisor]
    code: 200
    input: []
    output: FleetSizingRequest
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_SIZING_REQUEST_NOT_FOUND]

  - method: POST
    path: "/fleet-sizing-requests/{id}/decision"
    description: "Accepts a MATCHED sizing request so units may be shipped against it, or withdraws it. Only an ACCEPTED request may be named at shipment."
    roles: [FleetEngineer]
    code: 200
    input: [action, "decision_note?"]
    output: FleetSizingRequest
    side_effects:
      - "request_state becomes ACCEPTED or WITHDRAWN; the recorded selection and derived factors are never recomputed after the decision."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_SIZING_REQUEST_NOT_FOUND, ERR_SIZING_REQUEST_STATE_INVALID]

  # --- BatteryUnit ---------------------------------------------------
  - method: POST
    path: "/battery-units"
    description: "Ships one battery from a RELEASED lot to a customer, optionally against an ACCEPTED fleet sizing request. Shipment moves lead out of plant inventory into the field and opens the core deposit for LEAD_ACID units."
    roles: [ProductionSupervisor]
    code: 201
    input: [lot_id, serial_number, customer_name, list_price_cents, "sizing_request_id?", "shipped_at?"]
    output: BatteryUnit
    side_effects:
      - "shipped_at defaults to logical now; warranty_status initialises to IN_SERVICE; cycle_count, claim_count and watering counters initialise to 0."
      - "declared_lead_kg is copied from the pinned cell design's lead_content_kg; core_status initialises to DEPOSIT_HELD for LEAD_ACID and NOT_APPLICABLE for LITHIUM_LFP."
      - "plant.lead_inventory_kg decreases and plant.lead_in_field_kg increases by declared_lead_kg (INVARIANT L1); plant.core_deposit_liability_cents increases by CORE_DEPOSIT_CENTS 12500 for LEAD_ACID units only."
      - "watering_compliance_ratio initialises to 1.0000 and usage_fraction to 0.0000."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_LOT_NOT_FOUND, ERR_SIZING_REQUEST_NOT_FOUND, ERR_DUPLICATE_CODE, ERR_LOT_STATE_INVALID, ERR_PLANT_FROZEN, ERR_PLANT_SCOPE_MISMATCH, ERR_SIZING_REQUEST_STATE_INVALID, ERR_LEAD_INVENTORY_INSUFFICIENT]

  - method: GET
    path: "/battery-units"
    description: "Lists shipped units, shipped_at ASC then created_at ASC, filterable by lot, sizing request, warranty axis and core axis."
    roles: [PlantAdmin, ProductionSupervisor, WarrantyAdministrator, FleetEngineer]
    code: 200
    input: ["lot_id?", "sizing_request_id?", "warranty_status?", "core_status?", "limit?", "offset?"]
    output: BatteryUnit[]

  - method: GET
    path: "/battery-units/{id}"
    description: "Reads one unit with both independent axes (warranty_status and core_status) plus the derived cycle, watering and usage figures."
    roles: [PlantAdmin, ProductionSupervisor, WarrantyAdministrator, FleetEngineer]
    code: 200
    input: []
    output: BatteryUnit
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_BATTERY_UNIT_NOT_FOUND]

  - method: POST
    path: "/battery-units/{id}/maintenance-logs"
    description: "Appends a field-service event to a unit. WATERING carries electrolyte_level_ok, CYCLE_REPORT carries cycles_delta, and EQUALIZE/INSPECTION carry neither. Every event recomputes the unit's maintenance-compliance and usage figures that the warranty settlement reads."
    roles: [WarrantyAdministrator]
    code: 201
    input: [event_type, performed_at, "electrolyte_level_ok?", "cycles_delta?", "technician_note?"]
    output: MaintenanceLog
    side_effects:
      - "CYCLE_REPORT increases unit.cycle_count by cycles_delta and re-derives usage_fraction = cycle_count / design.rated_cycles."
      - "WATERING with electrolyte_level_ok true increases unit.watering_events_ok by 1."
      - "unit.months_in_service, unit.watering_events_expected and unit.watering_compliance_ratio are recomputed by CALC watering_compliance_ratio against logical now."
      - "resulting_cycle_count and resulting_compliance_ratio are stamped on the log row."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_BATTERY_UNIT_NOT_FOUND, ERR_EVENT_TIME_OUT_OF_RANGE]

  - method: GET
    path: "/battery-units/{id}/maintenance-logs"
    description: "Lists the unit's field-service events, performed_at DESC then created_at ASC. This is the only discovery channel for maintenance rows, which are append-only and never returned by any other read."
    roles: [PlantAdmin, WarrantyAdministrator]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: MaintenanceLog[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_BATTERY_UNIT_NOT_FOUND]

  - method: GET
    path: "/battery-units/{id}/warranty-evaluation"
    description: "Computed read previewing the warranty settlement gates in their pinned order: usage_fraction, watering_compliance_ratio, months_in_service, the gate that would fire right now and the credit that would be issued."
    roles: [PlantAdmin, WarrantyAdministrator]
    code: 200
    input: []
    output: "{ usage_fraction: number, watering_compliance_ratio: number, months_in_service: integer, warranty_months: integer, would_decide: string, would_credit_cents: integer, governing_gate: string }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_BATTERY_UNIT_NOT_FOUND]

  - method: POST
    path: "/battery-units/{id}/warranty-claims"
    description: "Opens a warranty claim on an in-service or previously denied unit. Optimistically concurrency-controlled on the unit: expected_battery_unit_version must equal the unit's current version."
    roles: [WarrantyAdministrator]
    code: 201
    input: [expected_battery_unit_version, complaint_code, "reported_at?"]
    output: BatteryUnit
    side_effects:
      - "warranty_status becomes CLAIM_OPEN; claim_count is incremented by 1; last_claim_at is set to reported_at or logical now."
      - "The unit's version is incremented by 1, so a second claim reusing the same expected_battery_unit_version is refused with 412."
      - "warranty_decision and warranty_credit_cents are cleared to null - a re-claim supersedes the prior adjudication."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_BATTERY_UNIT_NOT_FOUND, ERR_STALE_BATTERY_UNIT_VERSION, ERR_WARRANTY_STATE_INVALID, ERR_WARRANTY_ALREADY_SETTLED]

  - method: POST
    path: "/battery-units/{id}/warranty-adjudication"
    description: "Adjudicates an open claim. CALC warranty_settlement runs its gates in the pinned order - no defect, then usage exhaustion, then maintenance non-compliance, then in-warranty full honour, then proration - and the FIRST gate that fires decides the claim."
    roles: [WarrantyAdministrator]
    code: 200
    input: [inspection_finding, "adjudication_note?"]
    output: BatteryUnit
    side_effects:
      - "warranty_status becomes CLAIM_DENIED, CLAIM_HONORED or CLAIM_PRORATED per the governing gate; warranty_decision records the gate name and warranty_credit_cents the settled credit."
      - "A DENIED outcome sets warranty_credit_cents to 0; a PRORATED outcome applies the remaining-life multiplier to list_price_cents."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_BATTERY_UNIT_NOT_FOUND, ERR_WARRANTY_STATE_INVALID]

  - method: POST
    path: "/battery-units/{id}/core-return"
    description: "Opens a core-return authorisation for a LEAD_ACID unit, issuing the manifest number the returned core travels under. LITHIUM_LFP units have no core programme."
    roles: [WarrantyAdministrator]
    code: 200
    input: [core_manifest_number]
    output: BatteryUnit
    side_effects:
      - "core_status becomes RETURN_OPEN and core_manifest_number is stored."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_BATTERY_UNIT_NOT_FOUND, ERR_CORE_STATE_INVALID, ERR_CORE_NOT_APPLICABLE, ERR_DUPLICATE_CODE]

  - method: POST
    path: "/battery-units/{id}/core-return/transitions"
    description: "Drives the core-return axis: SHIP (RETURN_OPEN -> IN_TRANSIT), RECEIVE (IN_TRANSIT -> RECEIVED, requires received_lead_kg within 2 percent of the declared mass), RECYCLE (RECEIVED -> RECYCLED, refunds the deposit) or REJECT (IN_TRANSIT -> REJECTED, forfeits it)."
    roles: [WarrantyAdministrator]
    code: 200
    input: [action, "received_lead_kg?", "transition_note?"]
    output: BatteryUnit
    side_effects:
      - "RECEIVE stores received_lead_kg after the 2 percent mass reconciliation and adds the signed difference (received_lead_kg - declared_lead_kg) to plant.core_lead_variance_kg."
      - "RECEIVE also moves the mass: the unit leaves the in-field partition for the processed-on-site partition, so declared_lead_kg moves from plant.lead_in_field_kg into plant.lead_recycled_kg in the same write (INVARIANT L1 stays at 0.000)."
      - "RECYCLE settles the money only - the mass already moved at RECEIVE: core_credit_issued_cents = CORE_DEPOSIT_CENTS 12500 is issued to the customer and plant.core_deposit_liability_cents is reduced by the same amount (INVARIANT C1)."
      - "REJECT forfeits the deposit: core_credit_issued_cents stays 0 and plant.core_deposit_liability_cents is reduced by 12500 with no credit issued (INVARIANT C1 closes through a forfeit rather than a refund), while declared_lead_kg still moves from plant.lead_in_field_kg into plant.lead_recycled_kg because the rejected core is processed on site."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_BATTERY_UNIT_NOT_FOUND, ERR_CORE_STATE_INVALID, ERR_CORE_NOT_APPLICABLE, ERR_CORE_MASS_VARIANCE_EXCEEDED]

# =====================================================================
# 1.6 Error Code Catalog (61 codes; every code is triggerable by at
#     least one §1.5 endpoint and is reachable from an empty database)
# =====================================================================
errors:

  # --- auth / rbac ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, empty, or names a role outside the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_ACTOR_JOB_CLASS_MISMATCH
    http: 403
    condition: "A job-class-restricted operation was attempted by a worker of the wrong job_class: design APPROVE without ENGINEER, exposure sampling without SAFETY, lot RELEASE without QUALITY."
  - id: ERR_ACTOR_MEDICALLY_REMOVED
    http: 403
    condition: "The acting worker's removal_status is MEDICAL_REMOVAL, so the worker may perform no operation until cleared."

  # --- validation ----------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "Payload violates the endpoint's input schema: a required field is missing, an unknown field is present, an enum value is unrecognised, a numeric bound is broken, or an event-discriminated field is supplied for the wrong discriminator (cycles_delta on WATERING, blood_lead_ug_per_dl on an AIR sample, and so on)."
  - id: ERR_PLATE_TYPE_INCOMPATIBLE
    http: 422
    condition: "A LEAD_ACID design does not use FLAT_PASTED or TUBULAR plates, or a LITHIUM_LFP design does not use PRISMATIC_CELL plates or declares a non-zero lead_content_kg."
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "scheduled_end_at is not strictly after scheduled_start_at on a formation run or capacity test."
  - id: ERR_EVENT_TIME_OUT_OF_RANGE
    http: 422
    condition: "An exposure sample's sampled_at is in the logical future or precedes the worker's hire_date, or a maintenance log's performed_at is outside [unit.shipped_at, logical now]."
  - id: ERR_METERED_ENERGY_OUT_OF_RANGE
    http: 422
    condition: "metered_energy_kwh at run completion is not positive or exceeds twice the provisional estimated_energy_kwh."
  - id: ERR_CONNECTION_COUNT_MISMATCH
    http: 422
    condition: "connection_count on a TORQUE verification does not equal 2 * assembly.module_count."
  - id: ERR_CORE_MASS_VARIANCE_EXCEEDED
    http: 422
    condition: "received_lead_kg at core receipt differs from the unit's declared_lead_kg by more than CORE_MASS_TOLERANCE_RATIO (2 percent of declared mass); exactly 2 percent is accepted."
  - id: ERR_NO_ELIGIBLE_CELL_DESIGN
    http: 422
    condition: "No APPROVED cell design satisfies the sizing request's voltage, weight and chemistry-preference filters."
  - id: ERR_NO_CHARGER_MATCH
    http: 422
    condition: "Every eligible cell design failed to find an AVAILABLE compatible charger able to replenish the daily energy inside charge_window_hours."

  # --- existence -----------------------------------------------------
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "No Plant exists for the supplied path id or body plant_id."
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "No Worker exists for the supplied path id."
  - id: ERR_ACTING_WORKER_NOT_FOUND
    http: 404
    condition: "The X-User-ID of an entity_backed role (DesignEngineer, ProductionSupervisor, QualityInspector, SafetyOfficer) resolves to no Worker row."
  - id: ERR_CELL_DESIGN_NOT_FOUND
    http: 404
    condition: "No CellDesign exists for the supplied path id, body cell_design_id or supersedes_design_id."
  - id: ERR_FORMATION_BAY_NOT_FOUND
    http: 404
    condition: "No FormationBay exists for the supplied path id or body bay_id."
  - id: ERR_TEST_CHAMBER_NOT_FOUND
    http: 404
    condition: "No TestChamber exists for the supplied path id or body chamber_id."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "No ProductionLot exists for the supplied path id or body lot_id."
  - id: ERR_ASSEMBLY_NOT_FOUND
    http: 404
    condition: "No BatteryAssembly exists for the supplied path id or body assembly_id."
  - id: ERR_FORMATION_RUN_NOT_FOUND
    http: 404
    condition: "No FormationRun exists for the supplied path id."
  - id: ERR_CAPACITY_TEST_NOT_FOUND
    http: 404
    condition: "No CapacityTest exists for the supplied path id."
  - id: ERR_CHARGER_NOT_FOUND
    http: 404
    condition: "No Charger exists for the supplied path id."
  - id: ERR_SIZING_REQUEST_NOT_FOUND
    http: 404
    condition: "No FleetSizingRequest exists for the supplied path id or body sizing_request_id."
  - id: ERR_BATTERY_UNIT_NOT_FOUND
    http: 404
    condition: "No BatteryUnit exists for the supplied path id."

  # --- uniqueness ----------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A uniqueness scope was violated: Plant.site_code, CellDesign.code, Charger.model_code, BatteryAssembly.serial_number, BatteryUnit.serial_number or BatteryUnit.core_manifest_number globally; FormationBay.bay_code, TestChamber.chamber_code or ProductionLot.lot_code within one plant."

  # --- concurrency ---------------------------------------------------
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal the ProductionLot's current version when a sampling plan is drawn."
  - id: ERR_STALE_BATTERY_UNIT_VERSION
    http: 412
    condition: "expected_battery_unit_version does not equal the BatteryUnit's current version when a warranty claim is opened."

  # --- state ---------------------------------------------------------
  - id: ERR_DESIGN_STATE_INVALID
    http: 409
    condition: "The design's approval_state forbids the request: editing an APPROVED, UNDER_REVIEW or RETIRED design, SUBMIT outside DRAFT, or APPROVE/REQUEST_CHANGES outside UNDER_REVIEW."
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "The lot's process_state forbids the request: to_state is not the immediate successor, a sampling plan is drawn outside ASSEMBLY or LOT_TESTING, RELEASE or QUARANTINE outside LOT_TESTING, RETEST or SCRAP outside QUARANTINED, an assembly is created outside ASSEMBLY, a formation run is scheduled outside FORMATION, a capacity test is scheduled outside LOT_TESTING, a unit is shipped from a lot that is not RELEASED, or an environmental hold is set to the value it already has."
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "The formation run's run_state forbids the request: start outside SCHEDULED, complete outside CHARGING, or abort of an already COMPLETED or ABORTED run."
  - id: ERR_ASSEMBLY_AXIS_ALREADY_RECORDED
    http: 409
    condition: "The addressed verification axis (TORQUE or INSULATION_RESISTANCE) already carries a PASS or FAIL verdict for this rework generation."
  - id: ERR_ASSEMBLY_STATE_INVALID
    http: 409
    condition: "Rework was requested on an assembly whose certification_status is neither REJECTED nor REVOKED."
  - id: ERR_CAPACITY_TEST_STATE_INVALID
    http: 409
    condition: "A result was recorded for a test that is not SCHEDULED (already COMPLETED or VOIDED), or whose scheduled_end_at is still in the logical future."
  - id: ERR_CYCLE_LIFE_SAMPLE_MISSING
    http: 409
    condition: "cycles_completed was omitted when recording the result of a CYCLE_LIFE test, or supplied for a CAPACITY test."
  - id: ERR_SIZING_REQUEST_STATE_INVALID
    http: 409
    condition: "A sizing request decision was applied to a request that is no longer MATCHED, or a unit named a sizing request whose request_state is not ACCEPTED."
  - id: ERR_WARRANTY_STATE_INVALID
    http: 409
    condition: "The unit's warranty_status forbids the request: a claim opened while one is already CLAIM_OPEN, or an adjudication recorded while no claim is open."
  - id: ERR_WARRANTY_ALREADY_SETTLED
    http: 409
    condition: "A claim was opened on a unit whose warranty_status is CLAIM_HONORED or CLAIM_PRORATED - a settled warranty is terminal."
  - id: ERR_CORE_STATE_INVALID
    http: 409
    condition: "The unit's core_status forbids the core action: a return opened outside DEPOSIT_HELD, SHIP outside RETURN_OPEN, RECEIVE or REJECT outside IN_TRANSIT, or RECYCLE outside RECEIVED."
  - id: ERR_CORE_NOT_APPLICABLE
    http: 409
    condition: "A core-return operation was attempted on a LITHIUM_LFP unit, whose core_status is NOT_APPLICABLE."
  - id: ERR_WORKER_NOT_REMOVED
    http: 409
    condition: "Medical clearance was requested for a worker whose removal_status is already ACTIVE."

  # --- safety / compliance -------------------------------------------
  - id: ERR_PLANT_FROZEN
    http: 409
    condition: "The plant's derived compliance_posture is FROZEN (permit SUSPENDED, two or more open medical removals, or emission_utilization_ratio >= 1.0000), which blocks every production, formation, sampling and release write."
  - id: ERR_PLANT_RESTRICTED
    http: 409
    condition: "The plant's derived compliance_posture is RESTRICTED, which blocks only entry into FORMATION and the start of a formation run."
  - id: ERR_LOT_ENV_HELD
    http: 409
    condition: "The lot's env_hold_status is HELD, so no production, verification, sampling, testing or release step may proceed on it."
  - id: ERR_CHEMISTRY_NOT_LICENSED
    http: 409
    condition: "The lot's chemistry is absent from the plant's licensed_chemistries list."
  - id: ERR_CLEARANCE_EVIDENCE_MISSING
    http: 409
    condition: "No BLOOD exposure sample taken within the last 30 logical days shows blood_lead_ug_per_dl below BLL_RETURN_THRESHOLD 20.0, so the removed worker may not return to duty."
  - id: ERR_BAY_UNAVAILABLE
    http: 409
    condition: "The formation bay's bay_status is MAINTENANCE, so it accepts no new or starting runs."
  - id: ERR_CHAMBER_UNAVAILABLE
    http: 409
    condition: "The test chamber's chamber_status is MAINTENANCE, so it accepts no new tests."

  # --- segregation / referential -------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting worker is the design's submitted_by_worker_id on an APPROVE/REQUEST_CHANGES, or the lot's last_test_recorded_by_worker_id on a RELEASE."
  - id: ERR_PLANT_SCOPE_MISMATCH
    http: 409
    condition: "A referenced resource belongs to a different plant than the operation's lot: a bay from another plant, a chamber from another plant, or a sizing request from another plant."
  - id: ERR_DESIGN_NOT_APPROVED
    http: 409
    condition: "A lot was opened against a cell design whose approval_state is not APPROVED."
  - id: ERR_ASSEMBLY_NOT_CERTIFIED
    http: 409
    condition: "A capacity test was scheduled for an assembly whose certification_status is not CERTIFIED."

  # --- quality / acceptance ------------------------------------------
  - id: ERR_SAMPLING_INCOMPLETE
    http: 409
    condition: "A RELEASE was attempted before the sampling plan was satisfied: completed_test_count is below sample_size, no sampling plan has been drawn at all, or no CYCLE_LIFE test has passed."
  - id: ERR_ACCEPTANCE_EXCEEDED
    http: 409
    condition: "A RELEASE was attempted with failed_test_count above the plan's acceptance_number."
  - id: ERR_RETEST_LIMIT_REACHED
    http: 409
    condition: "A third retest was attempted on a lot whose retest_count is already RETEST_MAX 2."
  - id: ERR_REWORK_LIMIT_REACHED
    http: 409
    condition: "A fourth rework was attempted on an assembly whose rework_count is already 3."

  # --- temporal / capacity -------------------------------------------
  - id: ERR_BAY_WINDOW_CONFLICT
    http: 409
    condition: "The requested formation window collides with an existing SCHEDULED or CHARGING run on the same bay once the bay's cooldown_minutes buffer is applied to both ends; touching endpoints collide."
  - id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http: 409
    condition: "At some instant inside the requested half-open test window the aggregate draw_kw of overlapping SCHEDULED tests plus the new test exceeds the chamber's power_cap_kw; a sum landing exactly on the cap is accepted."

  # --- fiscal / quota ------------------------------------------------
  - id: ERR_EMISSION_BUDGET_EXCEEDED
    http: 409
    condition: "The run's reserved_emission_g would push (emission_reserved_g + emission_consumed_g + reserved_emission_g) / monthly_lead_emission_permit_g strictly above 1.0000; a reservation landing exactly on 1.0000 is accepted and freezes the plant instead."
  - id: ERR_LEAD_INVENTORY_INSUFFICIENT
    http: 409
    condition: "The plant's lead_inventory_kg is below the pinned design's lead_content_kg when a unit is shipped."

# =====================================================================
# 1.7 RBAC Matrix
#   Model: segregation of duties layered on peer roles. The four
#   shop-floor roles are entity_backed on Worker, so X-User-ID is a
#   Worker.id and the server can test job_class, removal_status and
#   "not the same person as the previous step" without guessing.
# =====================================================================
roles:

  - name: PlantAdmin
    description: "Plant operations administrator: registers plants, permits, tariffs, workers, formation bays and test chambers, and reads every compliance ledger."
    identity: "opaque"
    exclusive_operations:
      - "POST /plants, PATCH /plants/{id}, PATCH /plants/{id}/permit"
      - "POST /workers"
      - "POST /formation-bays, PATCH /formation-bays/{id}"
      - "POST /test-chambers, PATCH /test-chambers/{id}"
    shared_operations:
      - "GET /plants/{id}/emission-ledger, GET /plants/{id}/lead-mass-balance, GET /plants/{id}/fleet-analysis"
      - "every collection and single-resource GET in the plant, worker, lot, assembly, run, test, charger, sizing and unit surfaces"
      - "POST /_clock/set_current_utc"

  - name: DesignEngineer
    description: "Cell and plate design author and reviewer. Drafts, edits, submits and approves designs; an APPROVE additionally demands job_class ENGINEER and a different person than the submitter."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /cell-designs, PATCH /cell-designs/{id}"
      - "POST /cell-designs/{id}/review-actions"
    shared_operations:
      - "GET /cell-designs, GET /cell-designs/{id}, GET /workers, GET /workers/{id}, GET /production-lots"
      - "POST /_clock/set_current_utc"

  - name: ProductionSupervisor
    description: "Runs the production pipeline: opens lots, advances process stages, builds assemblies, reworks rejects, schedules and runs formation charging, and ships finished units."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /production-lots, POST /production-lots/{id}/advance"
      - "POST /battery-assemblies, POST /battery-assemblies/{id}/rework"
      - "POST /formation-runs, POST /formation-runs/{id}/start, POST /formation-runs/{id}/complete"
      - "POST /battery-units"
    shared_operations:
      - "POST /formation-runs/{id}/abort (with SafetyOfficer)"
      - "GET /production-lots, GET /production-lots/{id}, GET /production-lots/{id}/quality-summary, GET /battery-assemblies, GET /formation-runs, GET /capacity-tests, GET /battery-units, GET /formation-bays, GET /test-chambers, GET /workers"
      - "POST /_clock/set_current_utc"

  - name: QualityInspector
    description: "Owns acceptance quality: verifies assembly torque and insulation resistance, draws sampling plans, schedules and records capacity and cycle-life tests, and dispositions lots. A RELEASE additionally demands job_class QUALITY and a different person than the inspector who recorded the lot's last test."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /battery-assemblies/{id}/verifications"
      - "POST /production-lots/{id}/sampling-plans, POST /production-lots/{id}/disposition"
      - "POST /capacity-tests, POST /capacity-tests/{id}/record-result"
    shared_operations:
      - "GET /production-lots, GET /production-lots/{id}/quality-summary, GET /battery-assemblies, GET /capacity-tests, GET /formation-runs, GET /test-chambers, GET /workers"
      - "POST /_clock/set_current_utc"

  - name: SafetyOfficer
    description: "Industrial hygiene and environmental compliance: records exposure samples, clears removed workers, places and lifts environmental holds on lots, and aborts unsafe formation runs."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /workers/{id}/exposure-samples, POST /workers/{id}/medical-clearance"
      - "POST /production-lots/{id}/env-hold"
    shared_operations:
      - "POST /formation-runs/{id}/abort (with ProductionSupervisor)"
      - "GET /workers/{id}/exposure-samples, GET /workers/{id}/exposure-index, GET /plants/{id}/emission-ledger, GET /plants/{id}/lead-mass-balance, GET /production-lots, GET /formation-runs, GET /formation-bays"
      - "POST /_clock/set_current_utc"

  - name: FleetEngineer
    description: "Motive-power application engineer: catalogues chargers, sizes forklift battery applications, matches chargers and accepts or withdraws the resulting quotes."
    identity: "opaque"
    exclusive_operations:
      - "POST /chargers, PATCH /chargers/{id}"
      - "POST /fleet-sizing-requests, POST /fleet-sizing-requests/{id}/decision"
    shared_operations:
      - "GET /chargers, GET /chargers/{id}, GET /fleet-sizing-requests, GET /fleet-sizing-requests/{id}, GET /plants/{id}/fleet-analysis, GET /cell-designs, GET /battery-units"
      - "POST /_clock/set_current_utc"

  - name: WarrantyAdministrator
    description: "Aftermarket administrator: logs field maintenance and cycle reports, adjudicates warranty claims against cycle count and watering compliance, and runs the core return and recycling programme."
    identity: "opaque"
    exclusive_operations:
      - "POST /battery-units/{id}/maintenance-logs"
      - "POST /battery-units/{id}/warranty-claims, POST /battery-units/{id}/warranty-adjudication"
      - "POST /battery-units/{id}/core-return, POST /battery-units/{id}/core-return/transitions"
    shared_operations:
      - "GET /battery-units, GET /battery-units/{id}, GET /battery-units/{id}/maintenance-logs, GET /battery-units/{id}/warranty-evaluation, GET /capacity-tests, GET /cell-designs, GET /chargers, GET /production-lots"
      - "POST /_clock/set_current_utc"
