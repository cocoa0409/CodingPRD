      - name: proposal_revision_cycle_three_laps_then_limit
        grounds:
          - state_machines.FundReplacementProposal.DRAFT_to_UNDER_REVIEW
          - state_machines.FundReplacementProposal.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.FundReplacementProposal.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.FundReplacementProposal.fields.revision_round
          - entities.FundReplacementProposal.fields.notice_lead_days_required
          - entities.FundReplacementProposal.fields.pinned_plan_version
          - calculations.notice_lead_days
          - concurrency_rules[proposal-create-stale-plan]
          - validations[priority=76]
        distinguishing_aspect: |
          FundReplacementProposal re-enters UNDER_REVIEW three separate times through the
          REVISION_REQUESTED cycle, and the cycle is bounded by a monotonic counter rather than by a
          state: the same /request-revision call that succeeded at revision_round 0, 1 and 2 returns
          409 ERR_REVISION_LIMIT_REACHED at revision_round 3, while each lap recomputes
          notice_lead_days_required (30 -> 60 -> 45) so the revisited state is never identical.
