  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: prerequisite_beats_temporal_on_consent_sign
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_PREREQUISITE_NOT_MET]
          - errors[ERR_CONSENT_TOO_EARLY]
        distinguishing_aspect: |
          On consent sign, a single request that violates BOTH the cross-entity
          prerequisite (priority 9, business_referential: no ACCEPTED Match on the
          case) AND the consent-timing rule (priority 11, business_temporal: clock
          before child_dob+72h) returns the HIGHER-priority error
          ERR_PREREQUISITE_NOT_MET, not ERR_CONSENT_TOO_EARLY. Error-category pair
          = business_referential vs business_temporal, distinct from instance 2's
          state vs business_fiscal.
        test_recipe:
          setup:
            - "Case with NO accepted Match (Match still PROPOSED) and a PENDING ConsentRecord whose child_dob=2026-06-01T08:00:00Z; clock at 2026-06-02T00:00:00Z (both before dob+72h AND no ACCEPTED Match)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "CALENDAR_DAYS", expected_case_version: "${cv0}" }
              as: Caseworker
              captures: { consent_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-02T00:00:00.000Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /consent-records/${consent_id}/sign"
              payload: {}
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_PREREQUISITE_NOT_MET'"

      - name: state_beats_fiscal_on_disburse
        grounds:
          - validations[priority=7]
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          On expense disburse, state precondition (priority 6, state) outranks
          insufficient-escrow (priority 17, business_fiscal): a LOGGED (not yet
          APPROVED) expense with empty escrow returns ERR_INVALID_STATE, not
          ERR_INSUFFICIENT_ESCROW. Pair = state vs business_fiscal, distinct from
          instance 1's referential pair.
        test_recipe:
