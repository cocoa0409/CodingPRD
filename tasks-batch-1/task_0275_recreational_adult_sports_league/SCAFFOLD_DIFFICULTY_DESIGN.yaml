              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "Waiter", captain_player_id: "${cap2_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /teams/${t1_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "GET /seasons/${s_id}"
              payload: {}
              as: LeagueAdmin
              captures: { s_v2: $.data.version }
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "CLOSED", expected_season_version: "${s_v2}" }
              as: LeagueAdmin
              captures: { s_v3: $.data.version }
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "SCHEDULED", expected_season_version: "${s_v3}" }
              as: LeagueAdmin
          trigger:
            - call: "POST /teams/${t1_id}/withdraw"
              payload: {}
              as: LeagueAdmin
          assert:
            - "Team.${t1_id}.status == WITHDRAWN_LOCKED (forward: -1 confirmed)"
            - "Team.${t2_id}.status == CONFIRMED (compensating auto-promotion: +1 confirmed)"
            - "Division.${d_id}.confirmed_team_count == 1 (team-slot count conserved across the withdraw+promote pair)"
