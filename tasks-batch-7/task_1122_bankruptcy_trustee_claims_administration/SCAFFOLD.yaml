    side_effects: []

  - method: GET
    path: "/trustee/creditors/{id}"
    description: "Get a creditor"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: Creditor
    side_effects: []

  - method: GET
    path: "/trustee/creditors/{id}/avoidance_actions"
    description: "List avoidance actions naming this creditor as transferee"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "AvoidanceAction[]"
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/trustee/cases/{id}/claims"
    description: "File a proof of claim; assigns claim_number; computes late flag"
