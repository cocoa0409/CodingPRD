  - rule_id: boundary_precision_check
    instances:

      - name: carry_over_cap_lands_ce_total_exactly_on_requirement
        grounds:
          - calculations.ce_hour_credit_total
          - entities.StateBoardConfig.fields.ce_carry_over_cap_hours
          - entities.RenewalApplication.fields.carry_over_hours_claimed
          - validations[priority=34]
        distinguishing_aspect: |
          The total lands exactly on the 30.00-hour requirement, not one quarter-hour above it:
          25.00 verified hours plus a 9.00-hour carry-over claim that the 5.00-hour cap truncates
          to exactly 5.00. An implementation that honours the raw claim reads 34.00 and an
          implementation that ignores carry-over entirely reads 25.00; only the capped value
          produces the exact equality that lets the renewal pass the >= comparison.
        test_recipe:
          setup:
            - "Board OH keeps ce_hours_required 30.00 and ce_carry_over_cap_hours 5.00."
            - "The clock is moved to 2028-07-01 so the accounting window is [2026-08-01, 2028-08-01) and late_days is 0."
            - "The renewal claims carry_over_hours_claimed 9.00, which exceeds the 5.00 cap."
            - "One accredited LIVE_CONTACT record of 1500 minutes dated 2027-08-08 is attached and VERIFIED, worth exactly 25.00 hours."
            - "The renewal is paid 12000 cents and SUBMITTED."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
