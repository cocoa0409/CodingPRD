# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1905: Private School Admissions & Tuition Assistance
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Every chain replays from empty DB; logical clock defaults to 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ================================================================ entities
  - section: entities
    instances:
      - name: create_cycle_success_defaults
        claim_type: creation
        grounds: [entities.AdmissionCycle]
        distinguishing_aspect: "POST /admissions/cycles with all six required fields returns 201 with server defaults: status DRAFT, aid_committed_cents 0, pacing_cap_cents 7220000 (40% of 18,050,000 in DRAFT/OPEN phase), version 1."
        test_recipe:
          setup: ["Logical clock pinned at the boot default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
          assert:
            - "AdmissionCycle.${cyc}.status == DRAFT and aid_committed_cents == 0 and version == 1"
            - "AdmissionCycle.${cyc}.pacing_cap_cents == 7220000 (round_half_up(0.40 * 18,050,000))"
            - "id is a server-minted UUID; created_at == 2026-08-01T00:00:00Z logical clock"

      - name: create_cycle_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.AdmissionCycle, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required academic_year from cycle creation is rejected ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["Logical clock pinned"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles", payload: { early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: create_cycle_deadline_ordering_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=2.8]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Cycle deadline ordering early < regular < reenroll <= melt is enforced: early == regular violates strict ordering -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Logical clock pinned"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2026-11-01T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_VALIDATION (HTTP 422)"

      - name: create_application_invalid_round_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Application.fields.round, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "round must be EARLY or REGULAR; 'ROLLING' fails enum validation -> ERR_VALIDATION (422) even though all references exist."
        test_recipe:
          setup: ["OPEN cycle with G9 section; fam-a applicant exists"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
          trigger:
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "ROLLING" }, as: Parent, as_user_id: "fam-a", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_VALIDATION (HTTP 422)"

      - name: applicant_legacy_parent_defaults_false
        claim_type: defaults
        grounds: [entities.Applicant.fields.legacy_parent]
        distinguishing_aspect: "Omitting legacy_parent on applicant creation stores false; the returned id is a server-minted UUID and created_at equals the logical clock."
        test_recipe:
          setup: ["Logical clock pinned"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
          assert:
            - "Applicant.${apl}.legacy_parent == false (default applied)"
            - "Applicant.${apl}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: create_applicant_with_id_field_rejected
        claim_type: system_fields
        grounds: [entities.Applicant, "validations[priority=2.7]"]
        distinguishing_aspect: "Client-supplied id (a system field) in a create body is an unknown field -> ERR_INVALID_REQUEST (400); ids are exclusively server-minted."
        test_recipe:
          setup: ["Logical clock pinned"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/applicants", payload: { id: "00000000-0000-4000-8000-0000000000aa", family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: get_nonexistent_application_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent application UUID returns ERR_NOT_FOUND (404) in the error envelope."
        test_recipe:
          setup: ["Logical clock pinned; database otherwise empty"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "GET /admissions/applications/00000000-0000-4000-8000-0000000000ff", payload: {}, as: AdmissionDirector, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: computed_section_counters_after_offer
        claim_type: computed_fields
        grounds: [entities.GradeSection.fields.seats_held, entities.GradeSection.fields.aid_seats_held, calculations.seat_ledger]
        distinguishing_aspect: "After a close-round admit of an aid-seeking candidate into a capacity-2 section, the section's computed counters read seats_held 1, aid_seats_held 1, seats_available 1 — derived, never stored from input."
        test_recipe:
          setup:
            - "OPEN cycle, G9 section capacity 2 tuition 3,000,000 pct 1.0; fam-a EARLY application SUBMITTED with an aid application (provisional), both evaluations SCORED 80/90"
            - "Clock 2026-11-02; close EARLY -> OFFERED"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 2, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 9500000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionDirector }
          trigger:
            - { call: "GET /admissions/grade-sections/${sec}", payload: {}, as: AdmissionDirector }
          assert:
            - "GradeSection.${sec}.seats_held == 1 and aid_seats_held == 1 (PROVISIONAL aid application counts as aid-seeking) and seats_available == 1"
            - "Application.${app}.status == OFFERED with estimated_deposit_cents == 63000 (provisional award 2,370,000)"

      - name: list_applicants_pagination_and_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Applicant]
        distinguishing_aspect: "With 11 applicants, the default page returns exactly 10 items with total_count 11 and has_more true; offset 10 returns the final item with has_more false — exercising pagination_defaults {limit: 10, offset: 0}."
        test_recipe:
          setup: ["11 fam-p applicants created by the officer"]
          setup_api_calls:
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K01", last_name: "Page", date_of_birth: "2013-01-01" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K02", last_name: "Page", date_of_birth: "2013-01-02" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K03", last_name: "Page", date_of_birth: "2013-01-03" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K04", last_name: "Page", date_of_birth: "2013-01-04" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K05", last_name: "Page", date_of_birth: "2013-01-05" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K06", last_name: "Page", date_of_birth: "2013-01-06" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K07", last_name: "Page", date_of_birth: "2013-01-07" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K08", last_name: "Page", date_of_birth: "2013-01-08" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K09", last_name: "Page", date_of_birth: "2013-01-09" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K10", last_name: "Page", date_of_birth: "2013-01-10" }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-p", first_name: "K11", last_name: "Page", date_of_birth: "2013-01-11" }, as: AdmissionOfficer }
          trigger:
            - { call: "GET /admissions/applicants", payload: {}, as: AdmissionOfficer }
            - { call: "GET /admissions/applicants?limit=10&offset=10", payload: {}, as: AdmissionOfficer }
          assert:
            - "First page: response_type == array, data length == 10, total_count == 11, has_more == true, limit == 10, offset == 0"
            - "Second page: data length == 1, total_count == 11, has_more == false"

  # ================================================================ state_machines
  - section: state_machines
    instances:
      - name: application_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Application]
        distinguishing_aspect: "A newly created application starts in DRAFT with submitted_at null, composite_score null, promoted_from_waitlist false."
        test_recipe:
          setup: ["OPEN cycle with G9 section; fam-a applicant"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
          trigger:
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
          assert:
            - "Application.${app}.status == DRAFT, submitted_at is null, composite_score is null, promoted_from_waitlist == false, version == 1"

      - name: submit_when_evaluation_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_APPLICATION_NOT_DRAFT]"]
        distinguishing_aspect: "submit from EVALUATION_COMPLETE (not DRAFT) is rejected with ERR_APPLICATION_NOT_DRAFT while the clock is still before the deadline — isolating the state precondition from the temporal one."
        test_recipe:
          setup: ["fam-a EARLY application fully scored (80/90) -> EVALUATION_COMPLETE at default clock"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
          trigger:
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_APPLICATION_NOT_DRAFT (HTTP 409); Application.${app}.status remains EVALUATION_COMPLETE"

      - name: withdraw_denied_application_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application, "errors[ERR_APPLICATION_TERMINAL]"]
        distinguishing_aspect: "DENIED is terminal: withdraw on a denied application fails with ERR_APPLICATION_TERMINAL and leaves every linked record untouched."
        test_recipe:
          setup: ["capacity-1 section; three EARLY candidates composites 100.0 / 84.0 / 60.0; clock 2026-11-02; close EARLY leaves fam-l's application DENIED"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-h", first_name: "Hal", last_name: "High", date_of_birth: "2013-01-01" }, as: Parent, as_user_id: "fam-h", captures: { aplH: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplH}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-h", captures: { appH: $.data.id } }
            - { call: "POST /admissions/applications/${appH}/submit", payload: {}, as: Parent, as_user_id: "fam-h" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appH}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evHT: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appH}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-h" }, as: AdmissionOfficer, captures: { evHI: $.data.id } }
            - { call: "POST /admissions/evaluations/${evHT}/score", payload: { score: 100 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evHI}/score", payload: { score: 100 }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-m", first_name: "Meg", last_name: "Mid", date_of_birth: "2013-01-02" }, as: Parent, as_user_id: "fam-m", captures: { aplM: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplM}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-m", captures: { appM: $.data.id } }
            - { call: "POST /admissions/applications/${appM}/submit", payload: {}, as: Parent, as_user_id: "fam-m" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appM}", kind: "TEST", scheduled_start: "2026-10-10T10:00:00Z", scheduled_end: "2026-10-10T11:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evMT: $.data.id } }
