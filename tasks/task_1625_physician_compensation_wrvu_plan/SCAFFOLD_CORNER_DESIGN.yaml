        claim_type: version_pinning
        grounds: [entities.PhysicianAgreement.fields.pinned_plan_version, state_machines.PhysicianAgreement.AMENDMENT_REQUIRED_to_EFFECTIVE]
        distinguishing_aspect: "Repin re-points an AMENDMENT_REQUIRED agreement at the ACTIVE successor and snapshots ITS version; the old pinned version is provably replaced (pinned_plan_version and plan_id both change, status returns to EFFECTIVE)."
