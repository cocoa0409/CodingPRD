            - "the repeated assign-makeup then returns 200 and Bag.${c1}.custody_status == IN_MAKEUP"
            - "the load at 14:20 fails with 409 ERR_SORTATION_WINDOW_CLOSED, because 14:20 is past sortation_close_utc 14:15 — again a Flight-side condition on an otherwise loadable Bag"
