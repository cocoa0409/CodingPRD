          trigger:
            - call: "POST /dme/clinics"
              payload: { name: "Shadow Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: InventoryManager
              captures: { err_clinic_create: $.data.error_id }
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: false, quality_hold: true }
              as: PracticeAdmin
              captures: { err_attestation: $.data.error_id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${product_id}", par_min_qty: 1, par_max_qty: 5 }
