        grounds: ["errors[ERR_BOND_STRENGTH_BELOW_SPEC]"]
        excluded_because: { difficulty_instance: lot_release_quick_pass_full_fail_divergence, rationale: "Asserted as the release-blocking error of the named §1.8 dual-variant instance." }
      - name: agreement_not_active_error_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        excluded_because: { difficulty_instance: consignment_confirm_blocked_by_suspended_agreement, rationale: "Asserted as the confirm-blocking error of the named §1.8 cross-entity instance." }
      - name: formulation_not_effective_on_release_covered
