            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Cliffside Team Challenge", starts_at: "2026-09-13T10:00:00Z", ends_at: "2026-09-13T14:00:00Z", planned_headcount: 50, guaranteed_headcount: 50, per_person_cost_cents: 8000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
