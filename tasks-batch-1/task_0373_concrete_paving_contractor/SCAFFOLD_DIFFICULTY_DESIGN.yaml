  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: estimate_tier_boundary_500_vs_501_sqft
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.labor_subtotal
        distinguishing_aspect: |
          The marginal tier-1 ceiling is exactly 500 sqft: a single 500-sqft BROOM/NONE segment gives labor_subtotal
          4500.00 (500*9.00), while 501 sqft gives 4507.50 (500*9.00 + 1*7.50) — the 501st sqft is the first billed at
          the tier-2 rate. Metric: tiered sqft breakpoint; reached via POST /projects/{id}/estimates.
        test_recipe:
          setup:
            - "Two DRAFT projects: one with a single 500-sqft @4 BROOM/NONE segment, one with a single 501-sqft @4 BROOM/NONE segment."
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "B500", client_name: "Lam" }
              as: Estimator
              captures: { p500: $.data.id }
            - call: "POST /projects/${p500}/segments"
              payload: { label: "s", area_sqft: 500, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects"
              payload: { site_name: "B501", client_name: "Lam" }
              as: Estimator
              captures: { p501: $.data.id }
            - call: "POST /projects/${p501}/segments"
              payload: { label: "s", area_sqft: 501, thickness_in: 4 }
              as: Estimator
          trigger:
            - call: "POST /projects/${p500}/estimates"
              payload: {}
              as: Estimator
              captures: { ls500: $.data.labor_subtotal }
            - call: "POST /projects/${p501}/estimates"
              payload: {}
              as: Estimator
              captures: { ls501: $.data.labor_subtotal }
          assert:
            - "Estimate(p500).labor_subtotal == 4500.00"
            - "Estimate(p501).labor_subtotal == 4507.50"

