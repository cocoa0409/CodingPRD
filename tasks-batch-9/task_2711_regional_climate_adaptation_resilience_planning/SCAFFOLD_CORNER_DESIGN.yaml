            - "the asset read: data.jurisdiction_id == ${j_harbor_id} and data.is_shared == true, confirming the commitment crosses the jurisdiction boundary"

      - name: commitment_fulfill_and_release_are_mutually_exclusive_actions
        claim_type: Conditional action
        grounds:
          - endpoints.post_commitment_fulfill
          - endpoints.post_commitment_release
          - validations.priority_22_ERR_COMMITMENT_NOT_ACTIVE
        distinguishing_aspect: "fulfill moves a COMMITTED row to FULFILLED and stamps fulfilled_at, after which release returns 409 ERR_COMMITMENT_NOT_ACTIVE; the fulfilled units stay reserved, so free_units does not return to the pledge."
        test_recipe:
          setup:
