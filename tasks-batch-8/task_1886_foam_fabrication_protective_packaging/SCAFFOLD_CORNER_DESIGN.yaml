            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp1: $.data.id } }
          trigger:
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { err: $.data.error_id } }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v_fresh: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v_fresh}" }, as: DesignEngineer, captures: { cp2: $.data.id, cp2_status: $.data.status } }
          assert:
            - "Second create with the stale observed version -> 412 ERR_STALE_SPEC_VERSION"
            - "Re-read then create with the fresh version succeeds: status == DRAFT"

      - name: pass_limit_g_pinned_at_schedule
        claim_type: version_pinning
        grounds: ["entities.DropTest.fields.pass_limit_g", "entities.PackageSpec.fields.max_fragility_g"]
        distinguishing_aspect: "DropTest.pass_limit_g is pinned from the spec at schedule time: after a revision loop lowers max_fragility_g to 50, the previously scheduled test still carries 60 while a newly scheduled test carries 50."
        test_recipe:
          setup: ["Spec IN_VALIDATION with DT1 scheduled (pinned 60); DT1 records FAIL; spec returned for revision; max_fragility_g PATCHed to 50; spec resubmitted to IN_VALIDATION"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt1: $.data.id, dt1_limit: $.data.pass_limit_g } }
            - { call: "POST /api/drop-tests/${dt1}/record", payload: { measured_peak_g: 75 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/return-for-revision", payload: {}, as: QualityEngineer }
            - { call: "PATCH /api/package-specs/${spec_id}", payload: { max_fragility_g: 50 }, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
          trigger:
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:30:00Z", drop_height_in: 30, orientation: "EDGE" }, as: QualityEngineer, captures: { dt2: $.data.id, dt2_limit: $.data.pass_limit_g } }
            - { call: "GET /api/drop-tests/${dt1}", as: QualityEngineer, captures: { dt1_limit_now: $.data.pass_limit_g } }
          assert:
            - "DT1.pass_limit_g == 60 (pinned at its schedule time; unchanged by the revision)"
            - "DT2.pass_limit_g == 50 (pinned from the revised spec)"

      - name: cascading_side_effects_excluded_here
        claim_type: cascade_chain
        grounds: ["state_machines.PackageSpec.IN_VALIDATION_to_DRAFT", "state_machines.ReleaseOrder.ALLOCATED_to_SHIPPED"]
        excluded_because:
          difficulty_instance: transitive_cascade / supersede_cascade_cancels_orders_and_deamortizes
          rationale: "N-level cascade chains asserted end-to-end by the two §1.8 transitive_cascade instances and the program_suspend corner instance."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: created_entities_reflect_computed_fields_immediately
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "entities.PackageSpec.fields.required_ild_lb", "entities.ProductionOrder.fields.provisional_total_cents"]
        distinguishing_aspect: "Immediate consistency: the create response itself carries computed fields (required_ild_lb 50 on spec create; provisional prices on order create) — no re-read or delay needed."
        test_recipe:
          setup: ["Approved spec + LOCKED CNC program"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id, ild_now: $.data.required_ild_lb } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
          trigger:
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 100 }, as: SalesEngineer, captures: { prov_u: $.data.provisional_unit_price_cents, prov_t: $.data.provisional_total_cents } }
          assert:
            - "Spec create response carried required_ild_lb == 50"
            - "Order create response carried provisional_unit_price_cents == 759 (provisional parts floor(52*0.70)=36; sheets ceil(100/36)=3; material 3*72*250/100=540/part; cutting 40*3=120; unit_raw (540+120)*1.15=759.0)"
            - "Order create response carried provisional_total_cents == 90900 (759*100 + 15000 setup fee)"
