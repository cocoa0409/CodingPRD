            - "pick1 == ${e_high} (reliability 100 beats 90)"
            - "pick2 == ${e_high} (reliability tie 100 == 100 with E_late; earlier created_at wins — id never consulted)"

      - name: selector_empty_pool_returns_422
        claim_type: boundary
        grounds: [calculations.escort_selection_ranking, "errors[ERR_NO_ELIGIBLE_ESCORT]"]
        distinguishing_aspect: "When no ACTIVE escort is certified for the leg's state, the auto-select path fails with the empty-pool fallback error."
        test_recipe:
