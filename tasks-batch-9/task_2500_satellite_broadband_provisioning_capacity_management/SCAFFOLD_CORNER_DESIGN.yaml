          difficulty_instance: non_linear_state_machine / roaming_authorization_needs_info_revision_cycle_bounded_at_three_rounds
          rationale: "Loop-back plus the bounded termination condition (ROAMING_MAX_INFO_ROUNDS == 3) is asserted end-to-end by that §1.8 instance."

      - name: cascade_down_from_licence_suspension_reaches_only_non_terminal_children
        claim_type: cascade_down
        grounds:
          - state_machines.SpectrumLicense.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / license_suspension_cascades_beam_then_subscription_then_roaming_then_cell
          rationale: "The four-hop parent-to-children cascade and its state filters are asserted hop-by-hop by that §1.8 instance."

  # ===================================================================================
  # SECTION 3 — calculations
  # ===================================================================================
  - section: calculations
    instances:

      - name: fair_use_deprioritization_triggers_at_exactly_the_effective_threshold
        claim_type: threshold
        grounds:
          - calculations.fair_use_priority_threshold
          - entities.Beam.fields.deprioritization_grace_gb
          - entities.Subscription.fields.effective_rate_mbps
        distinguishing_aspect: "Two readings of 99.5 and 0.5 GB land cycle_priority_gb_used on exactly 100.000 == priority_data_gb (100) + grace (0), and the >= comparison flips PRIORITY to DEPRIORITIZED at equality rather than one reading later; overage_gb is still 0."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 (100 Mbps, limit 4.0, deprioritization_grace_gb defaulted to 0), cell CELL-001 (max_active_terminals 1)."
            - "Plan PLAN-P1-200: 200 Mbps PRIORITY_1, priority_data_gb 100, deprioritized_rate_mbps 20."
            - "Subscription sn1 is ACTIVE + AUTHORIZED_FIXED + PRIORITY with cycle_priority_gb_used 0 and cycle_billing_index 0."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
