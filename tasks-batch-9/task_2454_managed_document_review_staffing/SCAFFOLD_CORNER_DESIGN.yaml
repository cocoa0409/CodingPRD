          - validations[priority=29]
          - validations[priority=30]
          - errors[ERR_SESSION_OUTSIDE_COVERAGE]
        distinguishing_aspect: "Three different session defects produce three different errors on the same endpoint: a zero-length window (ERR_INVALID_TIME_WINDOW), a window outside the agreement's coverage (ERR_SESSION_OUTSIDE_COVERAGE) and a window overlapping the reviewer's own live session (ERR_SESSION_WINDOW_OVERLAP)."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded; her agreement covers 2026-08-01 through 2026-10-31"
