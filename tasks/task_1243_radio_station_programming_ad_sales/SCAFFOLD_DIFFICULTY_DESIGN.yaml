# =============================================================================
# Task 1243: Scaffold Difficulty Design (§1.8 Test Targeting Index)
# Above-expert calibration: 9 rules x 2-3 instances = 20 instances.
# Logical clock default: 2026-05-01T00:00:00Z (a Friday). 2026-05-02 = SAT,
# 2026-05-04 = MON, 2026-05-05 = TUE, 2026-05-06 = WED.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: locked_vs_repriced_spot_rate_on_ratings_publish
        grounds:
          - calculations.spot_unit_rate
          - entities.Spot.fields.billed_rate_cents
          - state_machines.DailyLog.RECONCILED_to_AFFIDAVIT_ISSUED
          - state_machines.RatingsBook.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Same booking inputs (daypart, hour, date, rate card) produce two different billed rates
          purely from order.reprice_policy: the LOCKED_AT_BOOKING spot keeps 10000 while the
          REPRICED_AT_AFFIDAVIT spot is repriced to 12500 when a higher-share book supersedes the
          old one mid-flight. Entity domain: Spot/Order billing.
        test_recipe:
          setup:
            - "Station with MON clock (SPOT_BREAK hour 6, 10 units / 600s), MORNING_DRIVE rate card base 10000 min 5000, ratings book Winter (share 3.0, 2026-01-01..2026-06-30) PUBLISHED"
            - "Two ACTIVE CASH FIXED orders (L=LOCKED_AT_BOOKING, R=REPRICED_AT_AFFIDAVIT), flight 2026-05-01..2026-05-31, 2 MORNING_DRIVE units each"
            - "Log 2026-05-04 (MON) LOCKED; one spot per order booked at hour 6 (both price at 10000: share 3.0 -> x1.00, MON -> x1.00, utilization 0 then 0.1 -> x1.00)"
            - "Spring book (share 5.0, 2026-05-01..2026-09-30) published, superseding Winter; both spots imported AIRED; log RECONCILED by td-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 10000, min_rate_cents: 5000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /ratings-books", payload: { station_id: "${st}", survey_name: "Winter", period_start: "2026-01-01", period_end: "2026-06-30", share_value: 3.0 }, as: SalesManager, captures: { b1: $.data.id } }
            - { call: "POST /ratings-books/${b1}/publish", payload: {}, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvL", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oL: $.data.id } }
            - { call: "POST /orders/${oL}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oL}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oL}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oL_v: $.data.version } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvR", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "REPRICED_AT_AFFIDAVIT", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oR: $.data.id } }
            - { call: "POST /orders/${oR}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oR}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oR}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oR_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oL}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oL_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { sL: $.data.id } }
            - { call: "POST /spots", payload: { order_id: "${oR}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oR_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { sR: $.data.id } }
            - { call: "POST /ratings-books", payload: { station_id: "${st}", survey_name: "Spring", period_start: "2026-05-01", period_end: "2026-09-30", share_value: 5.0 }, as: SalesManager, captures: { b2: $.data.id } }
            - { call: "POST /ratings-books/${b2}/publish", payload: {}, as: SalesManager }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${sL}", "${sR}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1" }
          trigger:
            - { call: "POST /logs/${lg}/issue-affidavit", payload: {}, as: BillingAdmin, as_user_id: "ba-1", captures: { aff_total: $.data.affidavit_total_cents } }
            - { call: "GET /spots/${sL}", as: BillingAdmin, captures: { sL_billed: $.data.billed_rate_cents } }
            - { call: "GET /spots/${sR}", as: BillingAdmin, captures: { sR_billed: $.data.billed_rate_cents } }
          assert:
            - "Spot.${sL}.billed_rate_cents == 10000 (LOCKED_AT_BOOKING: rate pinned at booking)"
            - "Spot.${sR}.billed_rate_cents == 12500 (REPRICED: 10000 x 1.25 share-5.0 tier x 1.00 MON x 1.00 demand, utilization 2/10 = 0.2 < 0.70)"
            - "DailyLog.${lg}.affidavit_total_cents == 19125 (round(10000*0.85)=8500 + round(12500*0.85)=10625)"
            - "RatingsBook.${b1}.status == SUPERSEDED and RatingsBook.${b2}.status == PUBLISHED"

      - name: trade_value_vs_cash_equivalent_ledger_valuation
        grounds:
          - calculations.trade_valuation
          - calculations.trade_available_balance
          - entities.TradeLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          A single aired TRADE spot is valued two ways: cash_equivalent_cents == unit rate 5000
          (card view) while the ledger DEBIT is round(5000 x 1.20) = 6000 (trade view). Same spot,
          same inputs, different money. Entity domain: TradeAgreement ledger (distinct from the
          Spot/Order billing domain of locked_vs_repriced_spot_rate_on_ratings_publish).
        test_recipe:
          setup:
            - "Station (fallback share 2.5 -> x1.00 tier), TUE clock (SPOT_BREAK hour 10, 10 units / 600s), MIDDAY rate card base 5000 min 1000 covering 2026"
            - "TradeAgreement limit 1000000, trade_ratio 1.20; ACTIVE TRADE order (LOCKED_AT_BOOKING, FIXED, 1 MIDDAY unit, flight 2026-05-01..2026-05-31)"
            - "Log 2026-05-05 (TUE) LOCKED; no ratings book published so fallback share 2.5 applies"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KBBB", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "tue", applies_weekdays: ["TUE"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MIDDAY", weekday_set: ["TUE"], base_rate_cents: 5000, min_rate_cents: 1000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /trade-agreements", payload: { station_id: "${st}", vendor_name: "VendorCo", credit_limit_cents: 1000000, trade_ratio: 1.2 }, as: SalesRep, as_user_id: "rep-1", captures: { ta: $.data.id } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvT", order_kind: "TRADE", trade_agreement_id: "${ta}", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MIDDAY", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oT: $.data.id } }
            - { call: "POST /orders/${oT}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oT}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oT}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oT_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-05" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oT}", log_id: "${lg}", daypart: "MIDDAY", hour: 10, duration_sec: 60, expected_order_version: "${oT_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { sp: $.data.id, sp_rate: $.data.unit_rate_cents, sp_cash: $.data.cash_equivalent_cents } }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { ta_avail: $.data.available_cents, ta_consumed: $.data.consumed_cents } }
            - { call: "GET /trade-agreements/${ta}/ledger-entries", as: BillingAdmin, captures: { debit_amt: "$.data[0].amount_cents", debit_kind: "$.data[0].entry_kind" } }
          assert:
            - "Spot.${sp}.unit_rate_cents == 5000 (5000 x 1.00 fallback tier x 1.00 TUE x 1.00 demand)"
            - "Spot.${sp}.cash_equivalent_cents == 5000 (cash view of the same spot)"
            - "ledger entry[0]: entry_kind == DEBIT and amount_cents == 6000 (trade view: round_half_up(5000 x 1.20))"
            - "TradeAgreement.${ta}.consumed_cents == 6000 and available_cents == 994000"
            - "cash_equivalent_cents (5000) != ledger DEBIT (6000) for the identical spot"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: spot_rate_four_factor_tier_stack_with_preemption
        grounds:
          - calculations.spot_unit_rate
          - calculations.preemption_selector
          - calculations.hour_spot_capacity
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — base 8000 x tiered ratings 1.25
          (share 5.5) x weekend 0.85 x demand 1.30 (utilization exactly 1.0 >= 0.85 at booking)
          floored by min_rate: round_half_up(8000*1.25*0.85*1.30) = 11050. Also exercises the
          preemption ranking (lowest rate, created_at tie-break preempts the FIRST of three
          equal-priced spots).
        test_recipe:
          setup:
            - "Station; SAT clock with SPOT_BREAK hour 15 (4 units / 480s); AFTERNOON_DRIVE rate card base 8000 min 3000 for SAT; book share 5.5 (2026-04-01..2026-06-30) PUBLISHED -> x1.25"
            - "PREEMPTIBLE order P (4 AFTERNOON_DRIVE units) fully booked into hour 15 -> utilization 4/4 = 1.0; booked rates 8500, 8500, 8500, 9775 (u before each: 0, 0.25, 0.5, 0.75 -> x1.00/x1.00/x1.00/x1.15)"
            - "FIXED order F (1 AFTERNOON_DRIVE unit) ACTIVE; log 2026-05-02 (SAT) LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KCCC", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "sat", applies_weekdays: ["SAT"], slots: [{ slot_type: "SPOT_BREAK", hour: 15, capacity_units: 4, capacity_seconds: 480 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "AFTERNOON_DRIVE", weekday_set: ["SAT"], base_rate_cents: 8000, min_rate_cents: 3000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /ratings-books", payload: { station_id: "${st}", survey_name: "Spring", period_start: "2026-04-01", period_end: "2026-06-30", share_value: 5.5 }, as: SalesManager, captures: { bk: $.data.id } }
            - { call: "POST /ratings-books/${bk}/publish", payload: {}, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvP", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "PREEMPTIBLE", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "AFTERNOON_DRIVE", units: 4 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oP: $.data.id } }
            - { call: "POST /orders/${oP}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oP}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oP}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oP_v: $.data.version } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvF", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "AFTERNOON_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oF: $.data.id } }
            - { call: "POST /orders/${oF}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oF}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oF}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oF_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-02" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oP}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oP_v}" }, as: TrafficDirector, captures: { p1: $.data.id } }
            - { call: "GET /orders/${oP}", as: TrafficDirector, captures: { oP_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oP}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oP_v2}" }, as: TrafficDirector, captures: { p2: $.data.id } }
            - { call: "GET /orders/${oP}", as: TrafficDirector, captures: { oP_v3: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oP}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oP_v3}" }, as: TrafficDirector, captures: { p3: $.data.id } }
            - { call: "GET /orders/${oP}", as: TrafficDirector, captures: { oP_v4: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oP}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oP_v4}" }, as: TrafficDirector, captures: { p4: $.data.id } }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oF}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oF_v}", allow_preemption: true }, as: TrafficDirector, captures: { f_spot: $.data.id, f_rate: $.data.unit_rate_cents } }
            - { call: "GET /spots/${p1}", as: TrafficDirector, captures: { p1_status: $.data.status, p1_reason: $.data.make_good_reason } }
          assert:
            - "Spot.${f_spot}.unit_rate_cents == 11050 (round_half_up(8000 x 1.25 x 0.85 x 1.30); demand evaluated pre-booking at u = 4/4 = 1.0 >= 0.85)"
            - "Spot.${p1}.status == MAKE_GOOD_PENDING and make_good_reason == PREEMPTED (lowest rate 8500, earliest created_at wins the tie among p1/p2/p3)"
            - "Spots ${p2}, ${p3}, ${p4} remain SCHEDULED (minimum-prefix waterfall preempts exactly one)"
            - "Hour 15 occupancy after cascade: 4 units / 240 seconds (p1 out, f_spot in)"

      - name: affidavit_net_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.affidavit_billing_total
          - entities.DailyLog.fields.affidavit_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two AIRED spots billed 1003 each.
          Pinned order (round per spot line, then sum): round(1003*0.85)=853 twice -> 1706.
          The forbidden sum-then-round order would give round(2006*0.85) = 1705. Distinct mode
          from spot_rate_four_factor_tier_stack_with_preemption (multi-input tier stack).
        test_recipe:
          setup:
            - "Station; MON clock (SPOT_BREAK hour 6, 10 units / 600s); MORNING_DRIVE rate card base 1003 min 100; book share 3.0 covering 2026-05-04 -> x1.00; MON -> x1.00; utilization stays < 0.70 -> x1.00"
            - "ACTIVE CASH LOCKED_AT_BOOKING FIXED order (2 MORNING_DRIVE units); log 2026-05-04 LOCKED; two spots booked at hour 6 (each bills 1003); both imported AIRED; log RECONCILED by td-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KDDD", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1003, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /ratings-books", payload: { station_id: "${st}", survey_name: "Winter", period_start: "2026-01-01", period_end: "2026-06-30", share_value: 3.0 }, as: SalesManager, captures: { bk: $.data.id } }
            - { call: "POST /ratings-books/${bk}/publish", payload: {}, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvC", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oC: $.data.id } }
            - { call: "POST /orders/${oC}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oC}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oC}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oC_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oC}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oC_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { s1: $.data.id, s1_rate: $.data.unit_rate_cents } }
            - { call: "GET /orders/${oC}", as: SalesRep, captures: { oC_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oC}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oC_v2}" }, as: SalesRep, as_user_id: "rep-1", captures: { s2: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${s1}", "${s2}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1" }
          trigger:
            - { call: "POST /logs/${lg}/issue-affidavit", payload: {}, as: BillingAdmin, as_user_id: "ba-1", captures: { aff_total: $.data.affidavit_total_cents } }
          assert:
            - "Spot.${s1}.unit_rate_cents == 1003"
            - "DailyLog.${lg}.affidavit_total_cents == 1706 (per-line round_half_up(1003*0.85)=853 twice, then sum)"
            - "affidavit_total_cents != 1705 (1705 is the forbidden sum-then-round result round(2006*0.85))"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: spot_make_good_cycle_preempt_then_reschedule
        grounds:
          - state_machines.Spot.SCHEDULED_to_MAKE_GOOD_PENDING
          - state_machines.Spot.MAKE_GOOD_PENDING_to_RESOLVED
          - calculations.preemption_selector
        distinguishing_aspect: |
          Cyclic machine on Spot: SCHEDULED -> MAKE_GOOD_PENDING (preemption) -> RESOLVED while a
          successor Spot is born back into SCHEDULED with makeup_of_spot_id pointing at the
          original — the make-good loop closes one obligation and opens a fresh scheduled unit.
          Entity: Spot (distinct from the DailyLog loop below).
        test_recipe:
          setup:
            - "Station; SAT clock: SPOT_BREAK hour 15 (1 unit / 120s) and hour 16 (2 units / 120s); AFTERNOON_DRIVE rate card base 5000 min 1000 for SAT; book share 3.0 -> x1.00; SAT -> x0.85"
            - "PREEMPTIBLE order P (1 unit) with spot P1 booked at hour 15: rate round(5000*1.00*0.85*1.00) = 4250 at u=0/3"
            - "FIXED order F (1 unit) ACTIVE; log 2026-05-02 (SAT) LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KEEE", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "sat", applies_weekdays: ["SAT"], slots: [{ slot_type: "SPOT_BREAK", hour: 15, capacity_units: 1, capacity_seconds: 120 }, { slot_type: "SPOT_BREAK", hour: 16, capacity_units: 2, capacity_seconds: 120 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "AFTERNOON_DRIVE", weekday_set: ["SAT"], base_rate_cents: 5000, min_rate_cents: 1000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /ratings-books", payload: { station_id: "${st}", survey_name: "Spring", period_start: "2026-04-01", period_end: "2026-06-30", share_value: 3.0 }, as: SalesManager, captures: { bk: $.data.id } }
            - { call: "POST /ratings-books/${bk}/publish", payload: {}, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvP", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "PREEMPTIBLE", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "AFTERNOON_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oP: $.data.id } }
            - { call: "POST /orders/${oP}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oP}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oP}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oP_v: $.data.version } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvF", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "AFTERNOON_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oF: $.data.id } }
            - { call: "POST /orders/${oF}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oF}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oF}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oF_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-02" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oP}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oP_v}" }, as: TrafficDirector, captures: { p1: $.data.id, p1_rate: $.data.unit_rate_cents } }
            - { call: "POST /spots", payload: { order_id: "${oF}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oF_v}", allow_preemption: true }, as: TrafficDirector, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /spots/${p1}/reschedule", payload: { target_log_id: "${lg}", target_daypart: "AFTERNOON_DRIVE", target_hour: 16, duration_sec: 60 }, as: TrafficDirector, captures: { succ: $.data.id, succ_rate: $.data.unit_rate_cents, succ_makeup: $.data.makeup_of_spot_id, succ_status: $.data.status } }
            - { call: "GET /spots/${p1}", as: TrafficDirector, captures: { p1_status: $.data.status } }
          assert:
            - "Spot.${p1}.status == RESOLVED (make-good loop closed)"
            - "Spot.${succ}.makeup_of_spot_id == ${p1} and status == SCHEDULED (successor reborn into SCHEDULED)"
            - "Spot.${succ}.unit_rate_cents == 4250 (fresh pricing: daypart capacity 1+2=3 units, occupied 1 (F1) -> u = 1/3 < 0.70 -> x1.00; 5000 x 1.00 x 0.85)"
            - "Spot.${p1} booked at 4250 before preemption (p1_rate == 4250)"

      - name: daily_log_reopen_loop_reconciling_to_locked_and_back
        grounds:
          - state_machines.DailyLog.RECONCILING_to_LOCKED
          - state_machines.DailyLog.LOCKED_to_AS_RUN
          - state_machines.DailyLog.RECONCILING_to_RECONCILED
        distinguishing_aspect: |
          Branching-with-revert machine on DailyLog: RECONCILING -> LOCKED reopens scheduling
          (a new spot is booked in the reopened window), a second as-run import re-enters AS_RUN,
          and the log still reaches RECONCILED after the outstanding make-good is credited.
          Entity: DailyLog (distinct from the Spot loop above).
        test_recipe:
          setup:
            - "Station; MON clock (SPOT_BREAK hour 6, 10 units / 600s); MORNING_DRIVE rate card base 2000 min 500 for MON; no ratings book (fallback 2.5 -> x1.00)"
            - "ACTIVE CASH FIXED order, 5 MORNING_DRIVE units, flight 2026-05-01..2026-05-31"
            - "Log 2026-05-04 LOCKED; spot s1 booked; first import aired nothing -> s1 MAKE_GOOD_PENDING (MISSED) + 1 discrepancy; log RECONCILING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KFFF", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 2000, min_rate_cents: 500, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvX", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 5 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oX: $.data.id } }
            - { call: "POST /orders/${oX}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oX}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oX}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oX_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oX}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oX_v}" }, as: TrafficDirector, captures: { s1: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
          trigger:
            - { call: "POST /logs/${lg}/reopen", payload: {}, as: TrafficDirector, captures: { posture_after_reopen: $.data.posture } }
            - { call: "GET /orders/${oX}", as: TrafficDirector, captures: { oX_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oX}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oX_v2}" }, as: TrafficDirector, captures: { s2: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${s2}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /spots/${s1}/issue-credit", payload: { note: "preempt credit" }, as: BillingAdmin, as_user_id: "ba-1" }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1", captures: { posture_final: $.data.posture, open_disc: $.data.unresolved_discrepancy_count } }
          assert:
            - "posture_after_reopen == LOCKED (RECONCILING -> LOCKED revert works and re-opens booking)"
            - "Spot.${s2} booked successfully while reopened and ends AIRED after the second import"
            - "Spot.${s1}.status == RESOLVED after issue-credit; its MISSED_SPOT discrepancy auto-RESOLVED"
            - "posture_final == RECONCILED and unresolved_discrepancy_count == 0"
            - "Full path walked: DRAFT -> LOCKED -> AS_RUN -> RECONCILING -> LOCKED -> AS_RUN -> RECONCILING -> RECONCILED"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_cascade_spots_ledger_agreement
        grounds:
          - state_machines.Order.ACTIVE_to_CANCELLED
          - state_machines.Spot.SCHEDULED_to_CANCELLED
          - state_machines.TradeAgreement.EXHAUSTED_to_ACTIVE
          - calculations.trade_available_balance
        distinguishing_aspect: |
          Depth-3 chain from POST /orders/{id}/cancel: order CANCELLED -> its SCHEDULED spots
          CANCELLED (hop 1) -> each TRADE spot appends a REVERSAL ledger entry (hop 2) -> the
          ledger replay flips the agreement EXHAUSTED -> ACTIVE (hop 3). Trigger: order cancel.
        test_recipe:
          setup:
            - "Station; TUE clock (SPOT_BREAK hour 10, 10 units / 600s); MIDDAY rate card base 6000 min 1000 for TUE; no book (fallback 2.5 -> x1.00)"
            - "TradeAgreement limit 12000 ratio 1.0; ACTIVE TRADE order (2 MIDDAY units); log 2026-05-05 LOCKED"
            - "Two trade spots booked at hour 10: DEBIT 6000 twice -> consumed 12000, available 0, agreement EXHAUSTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KGGG", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "tue", applies_weekdays: ["TUE"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MIDDAY", weekday_set: ["TUE"], base_rate_cents: 6000, min_rate_cents: 1000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /trade-agreements", payload: { station_id: "${st}", vendor_name: "VendorCo", credit_limit_cents: 12000, trade_ratio: 1.0 }, as: SalesRep, as_user_id: "rep-1", captures: { ta: $.data.id } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvT", order_kind: "TRADE", trade_agreement_id: "${ta}", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MIDDAY", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oT: $.data.id } }
            - { call: "POST /orders/${oT}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oT}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oT}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oT_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-05" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oT}", log_id: "${lg}", daypart: "MIDDAY", hour: 10, duration_sec: 60, expected_order_version: "${oT_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { s1: $.data.id } }
            - { call: "GET /orders/${oT}", as: SalesRep, as_user_id: "rep-1", captures: { oT_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oT}", log_id: "${lg}", daypart: "MIDDAY", hour: 10, duration_sec: 60, expected_order_version: "${oT_v2}" }, as: SalesRep, as_user_id: "rep-1", captures: { s2: $.data.id } }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { ta_status_pre: $.data.status } }
          trigger:
            - { call: "POST /orders/${oT}/cancel", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { ta_status_post: $.data.status, ta_avail_post: $.data.available_cents } }
            - { call: "GET /trade-agreements/${ta}/ledger-entries", as: BillingAdmin, captures: { e3_kind: "$.data[2].entry_kind", e4_kind: "$.data[3].entry_kind" } }
            - { call: "GET /spots/${s1}", as: BillingAdmin, captures: { s1_status: $.data.status } }
          assert:
            - "ta_status_pre == EXHAUSTED (two DEBITs of 6000 exactly consumed the 12000 limit)"
            - "Order.${oT}.status == CANCELLED and Spot.${s1}.status == CANCELLED (hop 1)"
            - "Ledger entries 3 and 4 are REVERSAL 6000 each (hop 2: one per cancelled trade spot)"
            - "TradeAgreement.${ta}: status ACTIVE again and available_cents == 12000 (hop 3: EXHAUSTED -> ACTIVE auto-transition)"
            - "Each hop is caused by the previous one, not by the cancel call directly"

      - name: clearance_disaffirm_cascade_avails_log_counters
        grounds:
          - state_machines.SyndicationClearance.CLEARED_to_DISAFFIRMED
          - state_machines.BarterAvail.SCHEDULED_to_CANCELLED
          - concurrency_rules[barter-schedule-stale-clearance]
        distinguishing_aspect: |
          Depth-2+ chain from POST /clearances/{id}/disaffirm: clearance DISAFFIRMED -> future
          SCHEDULED BarterAvails CANCELLED (hop 1) -> owning DailyLog occupancy counters
          recomputed and version bumped (hop 2). Trigger differs from order_cancel_cascade.
        test_recipe:
          setup:
            - "Station; MON clock with SPOT_BREAK hours 10 and 11 (4 units / 240s each)"
            - "Clearance CLEARED: MON window [10,12), 1 barter avail/hour, effective 2026-01-01..2026-12-31"
            - "Log 2026-05-04 (MON) LOCKED; barter avails scheduled at hours 10 and 11 (clearance version walked 2 -> 3 -> 4)"
            - "Logical clock at 2026-05-03 so air_date 2026-05-04 is strictly in the future"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KHHH", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 4, capacity_seconds: 240 }, { slot_type: "SPOT_BREAK", hour: 11, capacity_units: 4, capacity_seconds: 240 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "NetTalk", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { cl: $.data.id } }
            - { call: "POST /clearances/${cl}/clear", payload: {}, as: ProgramDirector, captures: { cl_v2: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /barter-avails", payload: { clearance_id: "${cl}", log_id: "${lg}", hour: 10, duration_sec: 60, expected_clearance_version: "${cl_v2}" }, as: TrafficDirector, captures: { a1: $.data.id } }
            - { call: "GET /clearances/${cl}", as: TrafficDirector, captures: { cl_v3: $.data.version } }
            - { call: "POST /barter-avails", payload: { clearance_id: "${cl}", log_id: "${lg}", hour: 11, duration_sec: 60, expected_clearance_version: "${cl_v3}" }, as: TrafficDirector, captures: { a2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: ProgramDirector }
            - { call: "GET /logs/${lg}", as: TrafficDirector, captures: { lg_v_pre: $.data.version } }
          trigger:
            - { call: "POST /clearances/${cl}/disaffirm", payload: {}, as: ProgramDirector }
            - { call: "GET /barter-avails/${a1}", as: TrafficDirector, captures: { a1_status: $.data.status } }
            - { call: "GET /barter-avails/${a2}", as: TrafficDirector, captures: { a2_status: $.data.status } }
            - { call: "GET /logs/${lg}", as: TrafficDirector, captures: { lg_v_post: $.data.version } }
          assert:
            - "SyndicationClearance.${cl}.status == DISAFFIRMED"
            - "BarterAvail.${a1}.status == CANCELLED and BarterAvail.${a2}.status == CANCELLED (hop 1: only future SCHEDULED avails)"
            - "DailyLog.${lg}.version == ${lg_v_pre} + 1 (hop 2: occupancy recompute bumps the log)"
            - "a1/a2 remain queryable via GET /barter-avails?clearance_id (CANCELLED, not deleted)"

  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_state_beats_trade_fiscal_on_spot_booking
        grounds:
          - validations[priority=5.1]
          - validations[priority=10]
          - errors[ERR_LOG_POSTURE_BLOCKED]
          - errors[ERR_TRADE_CREDIT_EXCEEDED]
        distinguishing_aspect: |
          Pair (state, business_fiscal): booking a TRADE spot on a RECONCILING log while the
          agreement has only 1 cent available violates both gates; priority 5.1
          (ERR_LOG_POSTURE_BLOCKED) must win over priority 10c (ERR_TRADE_CREDIT_EXCEEDED).
        test_recipe:
          setup:
            - "Station; TUE clock (SPOT_BREAK hour 10, 10/600); MIDDAY rate card base 5000 min 1000 for TUE"
            - "TradeAgreement limit 10000 ratio 1.0 with ADJUSTMENT -9999 -> available_cents == 1"
            - "ACTIVE TRADE order (1 MIDDAY unit, flight 2026-05-01..2026-05-31)"
            - "Log 2026-05-05: LOCKED -> AS_RUN (empty import) -> RECONCILING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KIII", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "tue", applies_weekdays: ["TUE"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MIDDAY", weekday_set: ["TUE"], base_rate_cents: 5000, min_rate_cents: 1000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /trade-agreements", payload: { station_id: "${st}", vendor_name: "VendorCo", credit_limit_cents: 10000, trade_ratio: 1.0 }, as: SalesRep, as_user_id: "rep-1", captures: { ta: $.data.id } }
            - { call: "POST /trade-agreements/${ta}/ledger-entries", payload: { entry_kind: "ADJUSTMENT", amount_cents: -9999, note: "drain" }, as: BillingAdmin, as_user_id: "ba-1" }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvT", order_kind: "TRADE", trade_agreement_id: "${ta}", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MIDDAY", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oT: $.data.id } }
            - { call: "POST /orders/${oT}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oT}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oT}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oT_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-05" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oT}", log_id: "${lg}", daypart: "MIDDAY", hour: 10, duration_sec: 60, expected_order_version: "${oT_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOG_POSTURE_BLOCKED (state, priority 5.1)"
            - "error_id != ERR_TRADE_CREDIT_EXCEEDED (business_fiscal, priority 10c) although the trade value 5000 exceeds available 1"
            - "HTTP status == 409"

      - name: song_separation_temporal_beats_spin_cap_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - calculations.spin_compliance
          - errors[ERR_SPIN_SEPARATION_VIOLATION]
          - errors[ERR_CATEGORY_SPIN_CAP_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_temporal, business_constraint): re-placing the same song one hour later
          violates song separation (60 < 180 min) AND the daily spin cap (2 > 1); priority 7a
          (ERR_SPIN_SEPARATION_VIOLATION) must win over priority 8 (ERR_CATEGORY_SPIN_CAP_EXCEEDED).
          Different category pair from posture_state_beats_trade_fiscal_on_spot_booking.
        test_recipe:
          setup:
            - "Station; category PWR (min_song_separation 180, min_artist_separation 240, max_spins_per_day 1); song S1 (artist ArtA) in PWR"
            - "MON clock (no slots needed for music), log 2026-05-04 LOCKED; S1 already placed at hour 8"
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KJJJ", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /music-categories", payload: { station_id: "${st}", code: "PWR", min_song_separation_min: 180, min_artist_separation_min: 240, max_spins_per_day: 1 }, as: ProgramDirector, captures: { cat: $.data.id } }
            - { call: "POST /songs", payload: { station_id: "${st}", category_id: "${cat}", title: "Song1", artist: "ArtA", duration_sec: 200 }, as: ProgramDirector, captures: { s1: $.data.id } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/music-placements", payload: { song_id: "${s1}", hour: 8 }, as: TrafficDirector }
          trigger:
            - { call: "POST /logs/${lg}/music-placements", payload: { song_id: "${s1}", hour: 9 }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SPIN_SEPARATION_VIOLATION (business_temporal, priority 7a)"
            - "error_id != ERR_CATEGORY_SPIN_CAP_EXCEEDED (business_constraint, priority 8) although placing a 2nd spin of S1 also breaks max_spins_per_day == 1"
            - "HTTP status == 422"
            - "DailyLog.${lg}.music_placements still has exactly 1 entry (failed placement not appended)"

  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: hour_units_capacity_equality_blocks_third_spot
        grounds:
          - calculations.hour_spot_capacity
          - errors[ERR_HOUR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: SPOT_BREAK unit count at one log-hour; semantics: new unit allowed iff
          occupied_units + 1 <= cap_units, so reaching exactly 2/2 succeeds and the next one
          fails. Reached via POST /spots.
        test_recipe:
          setup:
            - "Station; MON clock SPOT_BREAK hour 6 (2 units / 600s); MORNING_DRIVE rate card base 1000 min 100 for MON; no book (fallback 2.5)"
            - "ACTIVE CASH FIXED order, 5 MORNING_DRIVE units (target above capacity so the daypart quota does not mask the capacity boundary); log 2026-05-04 LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KKKK", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 2, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvB", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 5 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oB: $.data.id } }
            - { call: "POST /orders/${oB}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oB}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oB}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oB_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oB}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oB_v}" }, as: TrafficDirector, captures: { sp1: $.data.id } }
            - { call: "GET /orders/${oB}", as: TrafficDirector, captures: { oB_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oB}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oB_v2}" }, as: TrafficDirector, captures: { sp2: $.data.id } }
            - { call: "GET /orders/${oB}", as: TrafficDirector, captures: { oB_v3: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oB}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oB_v3}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert:
            - "First two bookings succeed (201); occupancy reaches exactly 2/2 units"
            - "Third booking: error_id == ERR_HOUR_CAPACITY_EXCEEDED, HTTP 409"
            - "Spots ${sp1} and ${sp2} remain SCHEDULED (no partial write from the rejected booking)"

      - name: reconcile_requires_exactly_zero_unresolved_discrepancies
        grounds:
          - validations[priority=5.3]
          - state_machines.DailyLog.RECONCILING_to_RECONCILED
          - errors[ERR_UNRESOLVED_DISCREPANCIES]
        distinguishing_aspect: |
          Metric: unresolved_discrepancy_count (empty-set/zero-count edge); count == 0 reconciles,
          count == 1 blocks. Reached via POST /logs/{id}/reconcile — a different endpoint and a
          different metric (count vs capacity units) from hour_units_capacity_equality_blocks_third_spot.
        test_recipe:
          setup:
            - "Station; clock covering MON+TUE with SPOT_BREAK hour 6 (10/600); MORNING_DRIVE rate card base 1000 min 100 for MON+TUE"
            - "ACTIVE CASH FIXED order (2 units); log A 2026-05-04 LOCKED with spotA; log B 2026-05-05 LOCKED with spotB"
            - "Log A imported with spotA aired (0 discrepancies); log B imported with spotB missing (1 discrepancy); both in RECONCILING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KLLL", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "mt", applies_weekdays: ["MON", "TUE"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON", "TUE"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvZ", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oZ: $.data.id } }
            - { call: "POST /orders/${oZ}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oZ}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oZ}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oZ_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lgA: $.data.id, lgA_v: $.data.version } }
            - { call: "POST /logs/${lgA}/lock", payload: { expected_log_version: "${lgA_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oZ}", log_id: "${lgA}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oZ_v}" }, as: TrafficDirector, captures: { spA: $.data.id } }
            - { call: "POST /logs/${lgA}/as-run-import", payload: { aired_spot_ids: ["${spA}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lgA}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-05" }, as: TrafficDirector, captures: { lgB: $.data.id, lgB_v: $.data.version } }
            - { call: "POST /logs/${lgB}/lock", payload: { expected_log_version: "${lgB_v}" }, as: TrafficDirector }
            - { call: "GET /orders/${oZ}", as: TrafficDirector, captures: { oZ_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oZ}", log_id: "${lgB}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oZ_v2}" }, as: TrafficDirector, captures: { spB: $.data.id } }
            - { call: "POST /logs/${lgB}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lgB}/begin-reconciliation", payload: {}, as: TrafficDirector }
          trigger:
            - { call: "POST /logs/${lgA}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1", captures: { lgA_posture: $.data.posture } }
            - { call: "POST /logs/${lgB}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1", captures: { err: $.data.error_id } }
          assert:
            - "Log A (count == 0): reconcile succeeds, posture == RECONCILED"
            - "Log B (count == 1): error_id == ERR_UNRESOLVED_DISCREPANCIES, HTTP 409, posture stays RECONCILING"
            - "DailyLog.${lgB}.unresolved_discrepancy_count == 1"

      - name: trade_adjustment_to_exact_zero_allowed_then_exhausted
        grounds:
          - calculations.trade_available_balance
          - state_machines.TradeAgreement.ACTIVE_to_EXHAUSTED
          - errors[ERR_TRADE_CREDIT_EXCEEDED]
        distinguishing_aspect: |
          Metric: trade available_cents zero-crossing; semantics: available == 0 is ALLOWED
          (>= 0 check) and flips status to EXHAUSTED, while -1 more is rejected. Reached via
          POST /trade-agreements/{id}/ledger-entries — third distinct endpoint and metric
          (money balance vs unit count vs discrepancy count).
        test_recipe:
          setup:
            - "Station; TradeAgreement credit_limit 50000, ratio 1.0, status ACTIVE"
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KMMM", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /trade-agreements", payload: { station_id: "${st}", vendor_name: "VendorCo", credit_limit_cents: 50000, trade_ratio: 1.0 }, as: SalesManager, as_user_id: "mgr-1", captures: { ta: $.data.id } }
          trigger:
            - { call: "POST /trade-agreements/${ta}/ledger-entries", payload: { entry_kind: "ADJUSTMENT", amount_cents: -50000, note: "exact drain" }, as: BillingAdmin, as_user_id: "ba-1", captures: { e1: $.data.id } }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { avail: $.data.available_cents, status: $.data.status } }
            - { call: "POST /trade-agreements/${ta}/ledger-entries", payload: { entry_kind: "ADJUSTMENT", amount_cents: -1, note: "overdraft" }, as: BillingAdmin, as_user_id: "ba-1", captures: { err: $.data.error_id } }
          assert:
            - "ADJUSTMENT -50000 succeeds (201): available_cents == 0 exactly is allowed"
            - "TradeAgreement.${ta}.status == EXHAUSTED (auto-transition at exact zero)"
            - "ADJUSTMENT -1 after that: error_id == ERR_TRADE_CREDIT_EXCEEDED, HTTP 402; available stays 0"

  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: spot_booking_gated_by_daily_log_posture
        grounds:
          - validations[priority=5.1]
          - state_machines.DailyLog.LOCKED_to_AS_RUN
          - state_machines.Spot
        distinguishing_aspect: |
          Pair (Spot, DailyLog): the same booking request succeeds against a LOCKED log and is
          rejected once that log advances to AS_RUN — the valid transition set of Spot creation
          depends on DailyLog.posture.
        test_recipe:
          setup:
            - "Station; MON clock (SPOT_BREAK hour 6, 10/600); MORNING_DRIVE rate card base 1000 min 100; CASH FIXED order (2 units) ACTIVE; log 2026-05-04"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KNNN", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvG", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oG: $.data.id } }
            - { call: "POST /orders/${oG}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oG}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oG}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oG_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oG}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oG_v}" }, as: TrafficDirector, captures: { sp1: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${sp1}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "GET /orders/${oG}", as: TrafficDirector, captures: { oG_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oG}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oG_v2}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert:
            - "Booking against LOCKED log: 201, Spot.${sp1} SCHEDULED (then AIRED by import)"
            - "Same booking against AS_RUN log: error_id == ERR_LOG_POSTURE_BLOCKED, HTTP 409"
            - "Order.${oG}.version unchanged by the rejected booking"

      - name: barter_avail_gated_by_clearance_status
        grounds:
          - validations[priority=6]
          - state_machines.SyndicationClearance.PENDING_to_CLEARED
          - state_machines.BarterAvail
        distinguishing_aspect: |
          Pair (BarterAvail, SyndicationClearance): scheduling an avail against a PENDING
          clearance fails with ERR_CLEARANCE_NOT_CLEARED; after clear, the identical request
          succeeds. Different entity pair from (Spot, DailyLog).
        test_recipe:
          setup:
            - "Station; MON clock SPOT_BREAK hour 10 (4/240); clearance PENDING (MON window [10,12), 1 avail/hr, 2026 window); log 2026-05-04 LOCKED"
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KOOO", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 4, capacity_seconds: 240 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "NetTalk", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { cl: $.data.id, cl_v1: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /barter-avails", payload: { clearance_id: "${cl}", log_id: "${lg}", hour: 10, duration_sec: 60, expected_clearance_version: "${cl_v1}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
            - { call: "POST /clearances/${cl}/clear", payload: {}, as: ProgramDirector, captures: { cl_v2: $.data.version } }
            - { call: "POST /barter-avails", payload: { clearance_id: "${cl}", log_id: "${lg}", hour: 10, duration_sec: 60, expected_clearance_version: "${cl_v2}" }, as: TrafficDirector, captures: { av: $.data.id } }
          assert:
            - "While PENDING: error_id == ERR_CLEARANCE_NOT_CLEARED, HTTP 409, no avail created"
            - "After clear: 201, BarterAvail.${av}.status == SCHEDULED"
            - "Clearance version advanced by the successful scheduling (OCC write)"

      - name: live_read_gated_by_endorsement_contract_status
        grounds:
          - validations[priority=6]
          - state_machines.EndorsementContract.DRAFT_to_ACTIVE
          - state_machines.LiveRead
        distinguishing_aspect: |
          Pair (LiveRead, EndorsementContract): scheduling a live read under a DRAFT contract
          fails with ERR_CONTRACT_NOT_ACTIVE; after activation the identical request succeeds.
          Third distinct entity pair.
        test_recipe:
          setup:
            - "Station; WED clock with LIVE_READ_WINDOW hour 7 (2 units / 120s)"
            - "EndorsementContract (program WED 06:00-09:00, 2 reads/week, 2026-05-01..2026-05-31) still DRAFT; log 2026-05-06 (WED) LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KPPP", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wed", applies_weekdays: ["WED"], slots: [{ slot_type: "LIVE_READ_WINDOW", hour: 7, capacity_units: 2, capacity_seconds: 120 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /endorsement-contracts", payload: { station_id: "${st}", advertiser_name: "AdvE", host_name: "HostH", program_weekdays: ["WED"], program_start_hour: 6, program_end_hour: 9, reads_per_week: 2, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep, as_user_id: "rep-1", captures: { ct: $.data.id, ct_total: $.data.contracted_reads_total } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-06" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /live-reads", payload: { contract_id: "${ct}", log_id: "${lg}", hour: 7 }, as: TrafficDirector, captures: { err: $.data.error_id } }
            - { call: "POST /endorsement-contracts/${ct}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /live-reads", payload: { contract_id: "${ct}", log_id: "${lg}", hour: 7 }, as: TrafficDirector, captures: { lr: $.data.id } }
          assert:
            - "While DRAFT: error_id == ERR_CONTRACT_NOT_ACTIVE, HTTP 409"
            - "After activate: 201, LiveRead.${lr}.status == SCHEDULED"
            - "EndorsementContract.${ct}.contracted_reads_total == 8 (2 reads/week x floor(31/7) = 4 weeks)"

  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: clearance_half_open_window_overlap_with_adjacency_allowed
        grounds:
          - state_machines.SyndicationClearance.PENDING_to_CLEARED
          - validations[priority=8]
          - errors[ERR_CLEARANCE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open hour windows [start, start+duration) combined with
          weekday-set intersection and effective-date-range intersection — [13,15) collides with
          [10,14) but adjacent [14,16) is allowed. Resource: station syndication airtime.
        test_recipe:
          setup:
            - "Station; clearance C1 CLEARED: MON [10,14), effective 2026-01-01..2026-12-31"
            - "C2 PENDING: MON [13,15), effective 2026-06-01..2026-12-31 (overlaps C1 on weekday + hours + dates)"
            - "C3 PENDING: MON [14,16), effective 2026-01-01..2026-12-31 (adjacent: 14 == C1 end, half-open => no intersection)"
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KQQQ", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show1", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 4, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { c1: $.data.id } }
            - { call: "POST /clearances/${c1}/clear", payload: {}, as: ProgramDirector }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show2", provider: "NetCo", weekday_set: ["MON"], start_hour: 13, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-06-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { c2: $.data.id } }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show3", provider: "NetCo", weekday_set: ["MON"], start_hour: 14, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /clearances/${c2}/clear", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "POST /clearances/${c3}/clear", payload: {}, as: ProgramDirector, captures: { c3_status: $.data.status } }
          assert:
            - "C2 clear: error_id == ERR_CLEARANCE_WINDOW_OVERLAP, HTTP 409 ([13,15) intersects [10,14); weekday and date ranges also intersect)"
            - "C3 clear: 200, status == CLEARED (adjacent half-open boundary 14 == 14 does NOT intersect)"
            - "C1 remains CLEARED throughout"

      - name: hour_seconds_aggregate_capacity_boundary
        grounds:
          - calculations.hour_spot_capacity
          - errors[ERR_HOUR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity accumulation (sum of duration_sec vs
          capacity_seconds) rather than pairwise interval geometry — 60s + 60s == 120 == cap is
          allowed, +15s more exceeds. Resource: a DailyLog hour's spot pool (different resource
          and different semantics from clearance windows).
        test_recipe:
          setup:
            - "Station; MON clock SPOT_BREAK hour 6 (10 units / 120 seconds); MORNING_DRIVE rate card base 1000 min 100; CASH FIXED order (3 units) ACTIVE; log 2026-05-04 LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KRRR", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 120 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvS", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 3 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oS: $.data.id } }
            - { call: "POST /orders/${oS}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oS}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oS}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oS_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oS}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oS_v}" }, as: TrafficDirector, captures: { sp1: $.data.id } }
            - { call: "GET /orders/${oS}", as: TrafficDirector, captures: { oS_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oS}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oS_v2}" }, as: TrafficDirector, captures: { sp2: $.data.id } }
            - { call: "GET /orders/${oS}", as: TrafficDirector, captures: { oS_v3: $.data.version } }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oS}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 15, expected_order_version: "${oS_v3}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert:
            - "Two 60s spots succeed: occupied seconds exactly 120 == capacity_seconds (<= allows equality)"
            - "Third spot (15s): error_id == ERR_HOUR_CAPACITY_EXCEEDED (135 > 120) even though units 3 <= 10"
            - "No preemption attempted (allow_preemption absent)"

  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: trade_debit_reversal_conserves_available_credit
        grounds:
          - calculations.trade_available_balance
          - state_machines.Spot.SCHEDULED_to_MAKE_GOOD_PENDING
          - entities.TradeAgreement.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: TradeAgreement.available_cents. A 7000-cent DEBIT at booking paired
          with its compensating REVERSAL when the spot is missed leaves available exactly at the
          pre-booking value 100000; the ledger retains both entries (audit trail, no deletion).
        test_recipe:
          setup:
            - "Station; TUE clock (SPOT_BREAK hour 10, 10/600); MIDDAY rate card base 7000 min 1000 for TUE; no book (fallback 2.5 -> x1.00)"
            - "TradeAgreement limit 100000 ratio 1.0; TRADE order (1 unit) ACTIVE; log 2026-05-05 LOCKED; one trade spot booked (DEBIT 7000 -> available 93000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KSSS", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "tue", applies_weekdays: ["TUE"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MIDDAY", weekday_set: ["TUE"], base_rate_cents: 7000, min_rate_cents: 1000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /trade-agreements", payload: { station_id: "${st}", vendor_name: "VendorCo", credit_limit_cents: 100000, trade_ratio: 1.0 }, as: SalesRep, as_user_id: "rep-1", captures: { ta: $.data.id } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvT", order_kind: "TRADE", trade_agreement_id: "${ta}", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MIDDAY", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oT: $.data.id } }
            - { call: "POST /orders/${oT}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oT}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oT}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oT_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-05" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oT}", log_id: "${lg}", daypart: "MIDDAY", hour: 10, duration_sec: 60, expected_order_version: "${oT_v}" }, as: SalesRep, as_user_id: "rep-1", captures: { sp: $.data.id, sp_rate: $.data.unit_rate_cents } }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { avail_after_book: $.data.available_cents } }
          trigger:
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { avail_final: $.data.available_cents, consumed_final: $.data.consumed_cents } }
            - { call: "GET /trade-agreements/${ta}/ledger-entries", as: BillingAdmin, captures: { e1_kind: "$.data[0].entry_kind", e1_amt: "$.data[0].amount_cents", e2_kind: "$.data[1].entry_kind", e2_amt: "$.data[1].amount_cents" } }
            - { call: "GET /spots/${sp}", as: BillingAdmin, captures: { sp_status: $.data.status } }
          assert:
            - "Spot.${sp}.unit_rate_cents == 7000 and booking appended DEBIT 7000 (avail_after_book == 93000)"
            - "After the missed import: ledger == [DEBIT 7000, REVERSAL 7000] (e1_kind DEBIT, e2_kind REVERSAL, amounts 7000/7000)"
            - "TradeAgreement.${ta}.available_cents == 100000 exactly (== credit_limit: DEBIT + REVERSAL conserve the balance)"
            - "TradeAgreement.${ta}.consumed_cents == 0"
            - "Spot.${sp}.status == MAKE_GOOD_PENDING with make_good_reason MISSED (obligation survives the credit reversal)"
      - name: make_good_obligations_conserve_across_resolution_paths
        grounds:
          - calculations.make_good_conservation
          - state_machines.Spot.MAKE_GOOD_PENDING_to_RESOLVED
          - state_machines.Discrepancy.UNRESOLVED_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity: make-good obligation count — count(MAKE_GOOD_PENDING) + count(RESOLVED)
          == count(MISSED) + count(PREEMPTED) at every step. Two missed spots create exactly two
          obligations; one closes via reschedule (successor born), one via credit; the invariant
          holds with 0 pending + 2 resolved at the end. Different conserved quantity (obligation
          count vs money) from trade_debit_reversal_conserves_available_credit.
        test_recipe:
          setup:
            - "Station; MON clock SPOT_BREAK hour 6 and hour 7 (10 units / 600s each); MORNING_DRIVE rate card base 1000 min 100 for MON"
            - "CASH FIXED order (3 units) ACTIVE; log 2026-05-04 LOCKED; spots s1, s2, s3 booked at hour 6"
            - "Import airs only s1 -> s2 and s3 MAKE_GOOD_PENDING (reason MISSED) with one MISSED_SPOT discrepancy each"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KTTT", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }, { slot_type: "SPOT_BREAK", hour: 7, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvM", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 3 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oM: $.data.id } }
            - { call: "POST /orders/${oM}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oM}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oM}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oM_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oM}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oM_v}" }, as: TrafficDirector, captures: { s1: $.data.id } }
            - { call: "GET /orders/${oM}", as: TrafficDirector, captures: { oM_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oM}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oM_v2}" }, as: TrafficDirector, captures: { s2: $.data.id } }
            - { call: "GET /orders/${oM}", as: TrafficDirector, captures: { oM_v3: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oM}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oM_v3}" }, as: TrafficDirector, captures: { s3: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${s1}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots/${s2}/reschedule", payload: { target_log_id: "${lg}", target_daypart: "MORNING_DRIVE", target_hour: 7, duration_sec: 60 }, as: TrafficDirector, captures: { succ: $.data.id, succ_makeup: $.data.makeup_of_spot_id } }
            - { call: "POST /spots/${s3}/issue-credit", payload: { note: "credit instead of make-good" }, as: BillingAdmin, as_user_id: "ba-1" }
            - { call: "GET /logs/${lg}", as: TrafficDirector, captures: { open_disc: $.data.unresolved_discrepancy_count } }
          assert:
            - "After import: exactly 2 spots MAKE_GOOD_PENDING (s2, s3) and 2 UNRESOLVED discrepancies; invariant 2 + 0 == 2 missed + 0 preempted"
            - "Spot.${s2}.status == RESOLVED and Spot.${succ}.makeup_of_spot_id == ${s2} (reschedule path)"
            - "Spot.${s3}.status == RESOLVED (credit path)"
            - "Final invariant: 0 MAKE_GOOD_PENDING + 2 RESOLVED == 2 missed + 0 preempted"
            - "DailyLog.${lg}.unresolved_discrepancy_count == 0 (both discrepancies auto-resolved by the obligation cascade)"
            - "Spot.${succ} does not consume daypart_targets (successors exempt; order target was exactly 3)"