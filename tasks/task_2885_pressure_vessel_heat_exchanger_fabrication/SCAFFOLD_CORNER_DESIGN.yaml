            - call: "POST /personnel"
              payload: { full_name: "Priya Quandt", role_code: "AUTHORIZED_INSPECTOR", stamp_initials: "QP", ai_agency: "Hartford Steam Boiler" }
              as: ShopAdmin
              captures: { e_stamp: $.data.error_id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C41", customer_name: "Other Buyer", vessel_type: "HEAT_EXCHANGER", design_code: "DIV1", mawp_psi: 400, design_temp_f: 500, mdmt_f: -20, inside_radius_in: 24 }
