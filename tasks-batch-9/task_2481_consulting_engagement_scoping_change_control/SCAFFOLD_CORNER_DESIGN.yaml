  - name: sow_revision_cycle_reprices_on_reentry
    claim_type: cyclic
    grounds:
    - state_machines.Sow.REVISION_REQUESTED_to_DRAFT
    excluded_because:
      difficulty_instance: non_linear_state_machine / sow_negotiation_cycle_revision_round_reprice
      rationale: That instance asserts the backward edge, the revision_round increment and the re-price literals on cycle re-entry.
  - name: engagement_parallel_dimensions_move_independently
    claim_type: parallel
    grounds:
    - entities.Engagement.fields.delivery_state
    - entities.Engagement.fields.economics_state
    excluded_because:
      difficulty_instance: non_linear_state_machine / engagement_economics_state_moves_while_delivery_state_unchanged
      rationale: That instance pins economics_state OVERRUN with delivery_state still ACTIVE in the same response.
  - name: change_request_branch_selected_by_computed_routing
    claim_type: branching
    grounds:
    - state_machines.ChangeRequest.IMPACT_ASSESSED_to_PENDING_LEADERSHIP_APPROVAL
    excluded_because:
      difficulty_instance: boundary_precision_check / change_materiality_ceiling_exact_forty_boundary
      rationale: That instance asserts routing == LEADERSHIP_THEN_CLIENT and the resulting PENDING_LEADERSHIP_APPROVAL branch at the 40.00 boundary.
  - name: quality_failure_cascade_down_to_deliverables
    claim_type: cascade_down
    grounds:
    - state_machines.Deliverable.PLANNED_to_SUSPENDED
    excluded_because:
      difficulty_instance: transitive_cascade / critical_quality_failure_suspends_open_deliverables
      rationale: That instance asserts the four-hop suspension cascade and suspended_deliverable_count == 2.
  - name: time_entry_approval_ledger_sync_to_engagement
    claim_type: ledger_sync
    grounds:
    - state_machines.TimeEntry.SUBMITTED_to_APPROVED
    excluded_because:
      difficulty_instance: compensating_invariant / time_entry_reversal_restores_burn_ledger
      rationale: That instance pins the ledger both after approval (100.00 / 6200000) and after the compensating reversal (60.00 / 3720000).
  - name: change_request_rescind_compensation
    claim_type: compensation
    grounds:
    - state_machines.ChangeRequest.APPROVED_to_RESCINDED
    excluded_because:
      difficulty_instance: compensating_invariant / change_request_rescind_restores_contracted_terms
      rationale: That instance asserts every restored commercial field plus the deliberately surviving escalation.
