# =============================================================================
# SCAFFOLD — task_2977_state_fish_hatchery_stocking_program
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
#
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2977. State Fish Hatchery & Stocking Program (state fish hatchery system): brood
  stock management, spawning schedules and egg-take targets by species, rearing
  operations with feed conversion, growth rate tracking and density management, fish
  health inspections, disease certification and treatment protocols before transfer,
  production allocation across waters based on management plans, angler demand and
  habitat suitability, stocking schedules with transport unit oxygenation, temperature
  acclimation and release site coordination, marking and tagging programs for
  evaluation of contribution to fisheries, water rights, effluent permitting and
  hatchery discharge compliance, budget allocation and stocking request intake from
  regional biologists and the public.

domain_name: fish-hatchery-stocking
# Flat topology: every entity is a top-level collection linked by body foreign keys,
# so the api_prefix is the root. No nested resource paths except the single
# EffluentReading sub-resource read.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  state_machine_shape: branching
  # RearingLot carries two independent state dimensions (rearing_stage ×
  # health_status); HealthInspection is cyclic (FAILED_TREATABLE → RETEST_DUE →
  # FAILED_TREATABLE); StockingRequest and AllocationPlan branch and loop.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_none

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Hatchery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hatchery station name" }
      - { name: station_code, type: string, source: input, description: "Four-character uppercase station code", constraints: "^[A-Z0-9]{4}$; unique across all hatcheries" }
      - { name: water_source_type, type: enum, source: input, description: "Source of rearing water", constraints: "SPRING | WELL | SURFACE" }
      - { name: annual_water_right_af, type: number, source: input, description: "Adjudicated annual water right in acre-feet" }
      - { name: water_reserved_af, type: number, source: computed, default: 0, description: "Acre-feet reserved by SpawnEvents in status PLANNED" }
      - { name: water_used_af, type: number, source: computed, default: 0, description: "Acre-feet consumed by SpawnEvents in status TAKEN plus every EffluentReading flow_af" }
      - { name: water_available_af, type: number, source: computed, description: "= annual_water_right_af - water_reserved_af - water_used_af (4 dp)" }
      - { name: rearing_capacity_lbs, type: number, source: input, description: "Permitted standing-crop capacity in pounds" }
      - { name: biomass_on_hand_lbs, type: number, source: computed, default: 0, description: "Sum of biomass_lbs over RearingLots whose rearing_stage NOT IN {RELEASED, TERMINATED}" }
      - { name: density_index, type: number, source: computed, default: 0, description: "= round(biomass_on_hand_lbs / rearing_capacity_lbs, 4)" }
      - { name: oxygen_supply_lpm, type: number, source: input, description: "Liquid-oxygen delivery capacity in litres per minute available to loading operations" }
      - { name: effluent_permit_number, type: string, source: input, description: "NPDES discharge permit number" }
      - { name: tss_permit_limit_mg_l, type: number, source: input, description: "Permitted total-suspended-solids ceiling in mg/L" }
      - { name: exceedance_count_rolling, type: integer, source: computed, default: 0, description: "Count of EffluentReadings with status EXCEEDANCE whose sampled_at is within EXCEEDANCE_WINDOW_DAYS of the logical clock" }
      - { name: operating_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | FROZEN — derived by calculations.hatchery_operating_posture", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Appropriated stocking budget for the fiscal year, in cents" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "Transport cost of StockingEvents in status SCHEDULED or IN_TRANSIT" }
      - { name: budget_spent_cents, type: integer, source: computed, default: 0, description: "Transport cost of StockingEvents in status RELEASED" }
      - { name: budget_available_cents, type: integer, source: computed, description: "= annual_budget_cents - budget_committed_cents - budget_spent_cents" }

  - name: BroodStock
    parent: Hatchery
    common_fields: true
    fields:
      - { name: hatchery_id, type: string, source: input, description: "FK -> Hatchery.id; the station holding this brood group" }
      - { name: species, type: enum, source: input, description: "Species of the brood group", constraints: "RAINBOW_TROUT | BROWN_TROUT | KOKANEE | WALLEYE | CHINOOK" }
      - { name: strain, type: string, source: input, description: "Genetic strain label" }
      - { name: female_count, type: integer, source: input, description: "Ripe females held in the brood group", constraints: ">= 1" }
      - { name: male_count, type: integer, source: input, description: "Ripe males held in the brood group", constraints: ">= 1" }
      - { name: expected_fecundity_per_female, type: integer, source: input, description: "Planning fecundity in eggs per spawned female", constraints: ">= 1" }
      - { name: females_reserved, type: integer, source: computed, default: 0, description: "Sum of females_spawned over this group's SpawnEvents in status PLANNED" }
      - { name: females_spent, type: integer, source: computed, default: 0, description: "Sum of females_spawned over this group's SpawnEvents in status TAKEN" }
      - { name: females_available, type: integer, source: computed, description: "= female_count - females_reserved - females_spent" }
      - { name: spawning_window_start, type: datetime, source: input, description: "First instant the spawning window may be opened (ISO 8601 UTC)" }
      - { name: spawning_window_end, type: datetime, source: input, description: "Instant the spawning window closes (ISO 8601 UTC); must be strictly after spawning_window_start" }
      - { name: egg_take_target, type: integer, source: input, description: "Season egg-take target for this group" }
      - { name: cumulative_eggs_taken, type: integer, source: computed, default: 0, description: "Sum of eggs_taken over this group's SpawnEvents in status TAKEN" }
      - { name: status, type: enum, source: system, default: "READY", description: "READY | SPAWNING | SUSPENDED | CLOSED — see state_machines.BroodStock", constraints: "READY | SPAWNING | SUSPENDED | CLOSED" }

  - name: SpawnEvent
    parent: BroodStock
    common_fields: true
    fields:
      - { name: brood_stock_id, type: string, source: input, description: "FK -> BroodStock.id; the group spawned" }
      - { name: planned_take_date, type: datetime, source: input, description: "Scheduled egg-take instant (ISO 8601 UTC)" }
      - { name: females_spawned, type: integer, source: input, description: "Females committed to this take", constraints: ">= 1" }
      - { name: target_release_count, type: integer, source: input, description: "Fish this take is meant to deliver to the stocking program at release size" }
      - { name: planned_eggs, type: integer, source: computed, description: "= females_spawned * BroodStock.expected_fecundity_per_female" }
      - { name: water_reserved_af, type: number, source: computed, description: "= round(planned_eggs * WATER_AF_PER_1000_EGGS / 1000, 4); released when the event leaves PLANNED" }
      - { name: cumulative_survival, type: number, source: computed, description: "Stage-survival product pinned by calculations.egg_take_projection (4 dp)" }
      - { name: required_eggs_for_target, type: integer, source: computed, description: "= ceil(target_release_count / cumulative_survival)" }
      - { name: projected_release_count, type: integer, source: computed, description: "= floor(planned_eggs * cumulative_survival)" }
      - { name: eggs_taken, type: integer, source: input, default: null, description: "Actual eggs collected; supplied on record-take" }
      - { name: taken_at, type: datetime, source: input, default: null, description: "Instant the eggs were collected; supplied on record-take" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | TAKEN | CANCELLED", constraints: "PLANNED | TAKEN | CANCELLED" }

  - name: RearingLot
    parent: Hatchery
    common_fields: true
    fields:
      - { name: hatchery_id, type: string, source: system, description: "FK -> Hatchery.id; copied from the spawning BroodStock" }
      - { name: spawn_event_id, type: string, source: system, description: "FK -> SpawnEvent.id; the take that produced this lot" }
      - { name: species, type: enum, source: system, description: "Copied from BroodStock.species", constraints: "RAINBOW_TROUT | BROWN_TROUT | KOKANEE | WALLEYE | CHINOOK" }
      - { name: initial_count, type: integer, source: system, description: "= SpawnEvent.eggs_taken at lot creation" }
      - { name: initial_biomass_lbs, type: number, source: system, description: "= round(initial_count * EGG_WEIGHT_G / GRAMS_PER_LB, 2), frozen at creation" }
      - { name: count_on_hand, type: integer, source: computed, description: "Live fish still in the lot (mortality, culls and released fish removed)" }
      - { name: reserved_count, type: integer, source: computed, default: 0, description: "Fish committed to StockingEvents in status SCHEDULED or IN_TRANSIT" }
      - { name: cumulative_mortality_count, type: integer, source: computed, default: 0, description: "Sum of mortality_count reported across feedings" }
      - { name: cumulative_mortality_biomass_lbs, type: number, source: computed, default: 0, description: "Running sum of mortality_count * avg_weight_g_after / GRAMS_PER_LB, rounded to 2 dp after each feeding" }
      - { name: avg_weight_g, type: number, source: computed, description: "Latest mean individual weight in grams" }
      - { name: growth_rate_g_per_day, type: number, source: computed, default: null, description: "Growth recorded by the latest feeding, 4 dp — see calculations.stage_weight_gate" }
      - { name: biomass_lbs, type: number, source: computed, description: "= round(count_on_hand * avg_weight_g / GRAMS_PER_LB, 2)" }
      - { name: cumulative_feed_lbs, type: number, source: computed, default: 0, description: "Total feed delivered to the lot in pounds" }
      - { name: fcr_biological, type: number, source: computed, default: null, description: "Survivor-only feed conversion ratio, 3 dp — see calculations.feed_conversion_ratio" }
      - { name: fcr_economic, type: number, source: computed, default: null, description: "Whole-cohort feed conversion ratio, 3 dp — see calculations.feed_conversion_ratio" }
      - { name: rearing_stage, type: enum, source: system, default: "EGG", description: "Growth dimension: EGG | FRY | FINGERLING | YEARLING | RELEASED | TERMINATED", constraints: "EGG | FRY | FINGERLING | YEARLING | RELEASED | TERMINATED" }
      - { name: health_status, type: enum, source: system, default: "UNSCREENED", description: "Health dimension: UNSCREENED | UNDER_INSPECTION | CERTIFIED | RESTRICTED | QUARANTINED", constraints: "UNSCREENED | UNDER_INSPECTION | CERTIFIED | RESTRICTED | QUARANTINED" }
      - { name: certificate_expires_at, type: datetime, source: computed, default: null, description: "Instant the current health certificate lapses; null unless health_status == CERTIFIED" }

  - name: HealthInspection
    parent: RearingLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> RearingLot.id; the lot sampled" }
      - { name: inspection_type, type: enum, source: input, description: "PRE_TRANSFER | ROUTINE", constraints: "PRE_TRANSFER | ROUTINE" }
      - { name: sample_size, type: integer, source: input, description: "Fish sacrificed for the assay", constraints: ">= 30" }
      - { name: sampled_at, type: datetime, source: input, description: "Sampling instant; must not be after the logical clock" }
      - { name: sampled_by_user_id, type: string, source: system, description: "X-User-ID of the FishHealthVeterinarian who created the inspection" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FishHealthVeterinarian who signed the certificate" }
      - { name: result, type: enum, source: input, default: null, description: "Latest assay outcome: NEGATIVE | POSITIVE_TREATABLE | POSITIVE_REPORTABLE", constraints: "NEGATIVE | POSITIVE_TREATABLE | POSITIVE_REPORTABLE" }
      - { name: pathogen_code, type: string, source: input, default: null, description: "OIE pathogen code recorded with a positive result" }
      - { name: retest_count, type: integer, source: computed, default: 0, description: "Number of completed treatment-and-retest rounds on this inspection" }
      - { name: escalated_from_retests, type: boolean, source: computed, default: false, description: "True when the inspection reached FAILED_REPORTABLE because a treatable pathogen persisted through MAX_RETESTS rounds" }
      - { name: treatment_code, type: string, source: input, default: null, description: "Therapeutant applied on the latest treatment round" }
      - { name: withdrawal_days, type: integer, source: input, default: null, description: "Mandatory therapeutant withdrawal period in days" }
      - { name: treatment_completed_at, type: datetime, source: input, default: null, description: "Instant the treatment course finished" }
      - { name: withdrawal_clears_at, type: datetime, source: computed, default: null, description: "= treatment_completed_at + withdrawal_days days" }
      - { name: certified_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the certificate was signed" }
      - { name: certificate_expires_at, type: datetime, source: computed, default: null, description: "= certified_at + CERT_VALID_DAYS days" }
      - { name: status, type: enum, source: system, default: "SAMPLED", description: "SAMPLED | PASSED | FAILED_TREATABLE | RETEST_DUE | FAILED_REPORTABLE | CERTIFIED", constraints: "SAMPLED | PASSED | FAILED_TREATABLE | RETEST_DUE | FAILED_REPORTABLE | CERTIFIED" }

  - name: Water
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Water body name" }
      - { name: county, type: string, source: input, description: "County of record" }
      - { name: water_class, type: enum, source: input, description: "COLDWATER_LAKE | COLDWATER_STREAM | WARMWATER_LAKE", constraints: "COLDWATER_LAKE | COLDWATER_STREAM | WARMWATER_LAKE" }
      - { name: habitat_suitability_score, type: integer, source: input, description: "Habitat suitability, 0–100", constraints: "0 <= value <= 100" }
      - { name: angler_demand_index, type: integer, source: input, description: "Angler demand index, 0–100", constraints: "0 <= value <= 100" }
      - { name: plan_species, type: enum, source: input, description: "Species named in the water's management plan", constraints: "RAINBOW_TROUT | BROWN_TROUT | KOKANEE | WALLEYE | CHINOOK" }
      - { name: plan_target_count, type: integer, source: input, description: "Annual management-plan stocking target in fish", constraints: ">= 1" }
      - { name: access_type, type: enum, source: input, description: "PUBLIC_BOAT | SHORE_ONLY | REMOTE", constraints: "PUBLIC_BOAT | SHORE_ONLY | REMOTE" }
      - { name: allocated_count_ytd, type: integer, source: computed, default: 0, description: "Sum of allocated_count over this water's StockingRequests in status ALLOCATED; a fulfilled grant moves out of this counter into released_count_ytd" }
      - { name: released_count_ytd, type: integer, source: computed, default: 0, description: "Sum of released_count over StockingEvents in status RELEASED bound to this water" }
      - { name: plan_shortfall_count, type: integer, source: computed, description: "= max(0, plan_target_count - released_count_ytd - allocated_count_ytd)" }
      - { name: plan_fill_pct, type: number, source: computed, default: 0, description: "= round((released_count_ytd + allocated_count_ytd) / plan_target_count * 100, 2)" }
      - { name: last_release_at, type: datetime, source: computed, default: null, description: "arrived_at of the most recent StockingEvent that reached RELEASED at this water" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED", constraints: "ACTIVE | CLOSED" }

  - name: StockingRequest
    parent: Water
    common_fields: true
    fields:
      - { name: water_id, type: string, source: input, description: "FK -> Water.id; the water asked to be stocked" }
      - { name: allocation_plan_id, type: string, source: system, default: null, description: "FK -> AllocationPlan.id; set by attach-to-plan, cleared never" }
      - { name: requester_kind, type: enum, source: system, description: "BIOLOGIST when submitted by RegionalBiologist, PUBLIC when submitted by PublicRequester", constraints: "BIOLOGIST | PUBLIC" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the submitter" }
      - { name: species, type: enum, source: input, description: "Species requested", constraints: "RAINBOW_TROUT | BROWN_TROUT | KOKANEE | WALLEYE | CHINOOK" }
      - { name: requested_count, type: integer, source: input, description: "Fish requested", constraints: ">= 1" }
      - { name: size_class, type: enum, source: input, description: "FRY | FINGERLING | YEARLING", constraints: "FRY | FINGERLING | YEARLING" }
      - { name: justification, type: string, source: input, description: "Narrative justification recorded with the request" }
      - { name: priority_score, type: number, source: computed, description: "0–100, 2 dp — see calculations.stocking_request_priority_score" }
      - { name: allocated_count, type: integer, source: computed, default: 0, description: "Fish granted by the most recent allocation run" }
      - { name: allocated_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the granting allocation run resolved this request" }
      - { name: deferral_reason, type: enum, source: computed, default: null, description: "POOL_EXHAUSTED | INELIGIBLE | EVENT_ABORTED — why the request left the queue without a usable grant", constraints: "POOL_EXHAUSTED | INELIGIBLE | EVENT_ABORTED" }
      - { name: fulfilled_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the granting StockingEvent was released" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | QUEUED | ALLOCATED | DEFERRED | DENIED | WITHDRAWN | FULFILLED", constraints: "SUBMITTED | QUEUED | ALLOCATED | DEFERRED | DENIED | WITHDRAWN | FULFILLED" }

  - name: AllocationPlan
    parent: Hatchery
    common_fields: true
    fields:
      - { name: hatchery_id, type: string, source: input, description: "FK -> Hatchery.id; the station whose production the plan distributes" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the plan allocates" }
      - { name: species, type: enum, source: input, description: "Species the plan allocates", constraints: "RAINBOW_TROUT | BROWN_TROUT | KOKANEE | WALLEYE | CHINOOK" }
      - { name: size_class, type: enum, source: input, description: "Size class the plan allocates", constraints: "FRY | FINGERLING | YEARLING" }
      - { name: available_count, type: integer, source: input, description: "Fish available for distribution in this plan", constraints: ">= 0" }
      - { name: public_request_cap_pct, type: number, source: input, description: "Share of available_count reachable by PUBLIC requesters, 0.00–1.00", constraints: "0 <= value <= 1" }
      - { name: allocation_mode, type: enum, source: input, default: "PRIORITY_WATERFALL", description: "PRIORITY_WATERFALL | PROPORTIONAL — selects the calculations.allocation_grant variant", constraints: "PRIORITY_WATERFALL | PROPORTIONAL" }
      - { name: allocated_total_count, type: integer, source: computed, default: 0, description: "Sum of allocated_count over requests granted by the latest run" }
      - { name: unmet_demand_count, type: integer, source: computed, default: 0, description: "Sum of (requested_count - allocated_count) over the latest run's candidate set" }
      - { name: run_count, type: integer, source: computed, default: 0, description: "Number of completed allocation runs" }
      - { name: public_allocated_count, type: integer, source: computed, default: 0, description: "Fish granted to requests with requester_kind PUBLIC by the most recent run" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ALLOCATED | CLOSED", constraints: "DRAFT | ALLOCATED | CLOSED" }

  - name: TransportUnit
    parent: Hatchery
    common_fields: true
    fields:
      - { name: hatchery_id, type: string, source: input, description: "FK -> Hatchery.id; home station of the tank truck" }
      - { name: unit_code, type: string, source: input, description: "Fleet code of the transport unit" }
      - { name: certification_expires_at, type: datetime, source: input, description: "Instant the unit's hauling certification lapses (ISO 8601 UTC)" }
      - { name: current_event_id, type: string, source: computed, default: null, description: "FK -> StockingEvent.id; the event currently holding the unit, null while AVAILABLE" }
      - { name: tank_gallons, type: number, source: input, description: "Usable tank volume in gallons", constraints: "> 0" }
      - { name: max_load_lbs, type: number, source: input, description: "Mechanical payload ceiling in pounds", constraints: "> 0" }
      - { name: oxygen_lpm, type: number, source: input, description: "Oxygen delivery rate of the unit's diffuser bank, litres per minute", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | IN_USE | OUT_OF_SERVICE", constraints: "AVAILABLE | IN_USE | OUT_OF_SERVICE" }

  - name: StockingEvent
    parent: StockingRequest
    common_fields: true
    fields:
      - { name: stocking_request_id, type: string, source: input, description: "FK -> StockingRequest.id; the allocated request this trip fills" }
      - { name: lot_id, type: string, source: input, description: "FK -> RearingLot.id; the lot drawn down" }
      - { name: transport_unit_id, type: string, source: input, description: "FK -> TransportUnit.id; the tank truck reserved for the trip" }
      - { name: fish_count, type: integer, source: input, description: "Fish committed to the trip", constraints: ">= 1" }
      - { name: scheduled_depart_at, type: datetime, source: input, description: "Planned departure instant (ISO 8601 UTC)" }
      - { name: scheduled_return_at, type: datetime, source: input, description: "Planned return instant; must be strictly after scheduled_depart_at" }
      - { name: mark_type, type: enum, source: input, default: "NONE", description: "Mark applied to the transported group: NONE | AD_CLIP | CWT | PIT", constraints: "NONE | AD_CLIP | CWT | PIT" }
      - { name: marked_count, type: integer, source: input, default: 0, description: "Fish carrying the mark; must be 0 when mark_type == NONE and <= fish_count otherwise" }
      - { name: planned_load_lbs, type: number, source: computed, description: "= round(fish_count * RearingLot.avg_weight_g / GRAMS_PER_LB, 2) at creation" }
      - { name: transport_cost_cents, type: integer, source: computed, description: "= TRANSPORT_BASE_CENTS + ceil(planned_load_lbs * COST_PER_LB_CENTS) — see calculations.transport_cost" }
      - { name: max_fish_allowed, type: integer, source: computed, default: null, description: "Load-plan ceiling computed at load from the measured water temperature" }
      - { name: oxygen_flow_lpm, type: number, source: computed, default: null, description: "Oxygen demand of the planned load in litres per minute, 3 dp — see calculations.transport_load_plan" }
      - { name: loaded_at, type: datetime, source: input, default: null, description: "Instant loading finished" }
      - { name: load_water_temp_c, type: number, source: input, default: null, description: "Hatchery water temperature at loading, °C" }
      - { name: measured_load_lbs, type: number, source: input, default: null, description: "Scale weight of the load in pounds" }
      - { name: arrived_at, type: datetime, source: input, default: null, description: "Instant the unit reached the release site" }
      - { name: site_water_temp_c, type: number, source: input, default: null, description: "Receiving-water temperature at the release site, °C" }
      - { name: tempering_minutes, type: integer, source: input, default: null, description: "Minutes spent tempering the tank to site temperature before release" }
      - { name: transport_mortality_count, type: integer, source: input, default: 0, description: "Fish dead on arrival" }
      - { name: tempering_minutes_required, type: integer, source: computed, default: null, description: "= ceil(abs(site_water_temp_c - load_water_temp_c) / ACCLIM_DEGREE_STEP) * ACCLIM_MINUTES_PER_STEP" }
      - { name: released_count, type: integer, source: computed, default: null, description: "= fish_count - transport_mortality_count" }
      - { name: recovered_count, type: integer, source: computed, default: 0, description: "Marked fish recovered in creel surveys and reported against this release" }
      - { name: creel_sample_fraction, type: number, source: input, default: null, description: "Fraction of the fishery sampled by the creel survey, 0 < value <= 1" }
      - { name: contribution_index_cohort, type: number, source: computed, default: null, description: "Cohort-basis contribution index, 4 dp — see calculations.contribution_index" }
      - { name: contribution_index_harvest, type: number, source: computed, default: null, description: "Harvest-expansion contribution index, 4 dp — see calculations.contribution_index" }
      - { name: effective_marked_count, type: integer, source: computed, default: null, description: "marked_count discounted by the mark type's tag-loss rate — see calculations.contribution_index" }
      - { name: released_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of release" }
      - { name: aborted_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the event was aborted" }
      - { name: abort_reason, type: enum, source: computed, default: null, description: "OPERATOR_ABORT | LOT_QUARANTINED — recorded when the event reaches ABORTED", constraints: "OPERATOR_ABORT | LOT_QUARANTINED" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_TRANSIT | RELEASED | ABORTED", constraints: "SCHEDULED | IN_TRANSIT | RELEASED | ABORTED" }

  - name: EffluentReading
    parent: Hatchery
    common_fields: false
    fields:
      - { name: hatchery_id, type: string, source: input, description: "FK -> Hatchery.id; the discharging station" }
      - { name: sampled_at, type: datetime, source: input, description: "Sampling instant; must not be after the logical clock" }
      - { name: tss_mg_l, type: number, source: input, description: "Total suspended solids in mg/L", constraints: ">= 0" }
      - { name: total_phosphorus_mg_l, type: number, source: input, description: "Total phosphorus in mg/L", constraints: ">= 0" }
      - { name: flow_af, type: number, source: input, description: "Discharge volume for the reporting period in acre-feet", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "COMPLIANT | EXCEEDANCE — see calculations.effluent_compliance", constraints: "COMPLIANT | EXCEEDANCE" }
      - { name: exceedance_margin_mg_l, type: number, source: computed, description: "= round(max(0, tss_mg_l - Hatchery.tss_permit_limit_mg_l), 3)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Hatchery.operating_posture — derived compliance dimension that gates the
  # production entities below. Cyclic: a station recovers when its exceedances
  # age out of the rolling window or its density falls back.
  # ---------------------------------------------------------------------------
  - entity: Hatchery
    initial_state: OPEN
    terminal_states: []
    note: "Derived dimension on operating_posture; every transition is recomputed by calculations.hatchery_operating_posture. No terminal state — the posture is cyclic by design."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (recompute after POST /rearing-lots/{id}/feedings, POST /effluent-readings, POST /spawn-events/{id}/record-take or POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "exceedance_count_rolling == 1 OR density_index >= DENSITY_RESTRICT_THRESHOLD (0.90)"
          - "NOT (exceedance_count_rolling >= 2 OR water_available_af <= 0)"
        side_effects:
          - "operating_posture = RESTRICTED — new SpawnEvents are refused with ERR_HATCHERY_RESTRICTED; loading and releasing stay legal because they lower standing crop"

      - from: OPEN
        to: FROZEN
        trigger: "system (recompute after POST /effluent-readings or POST /spawn-events)"
        actor: system
        preconditions:
          - "exceedance_count_rolling >= EXCEEDANCE_FREEZE_COUNT (2) OR water_available_af <= 0"
        side_effects:
          - "operating_posture = FROZEN"
          - "cascade link 2 of transitive_cascade.effluent_exceedance_freezes_production: every BroodStock of this hatchery in status SPAWNING transitions to SUSPENDED"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system (recompute after POST /effluent-readings or POST /spawn-events)"
        actor: system
        preconditions:
          - "exceedance_count_rolling >= EXCEEDANCE_FREEZE_COUNT (2) OR water_available_af <= 0"
        side_effects:
          - "operating_posture = FROZEN"
          - "every BroodStock of this hatchery in status SPAWNING transitions to SUSPENDED"

      - from: RESTRICTED
        to: OPEN
        trigger: "system (recompute after POST /rearing-lots/{id}/feedings, POST /stocking-events/{id}/release or POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "exceedance_count_rolling == 0 AND density_index < DENSITY_RESTRICT_THRESHOLD (0.90) AND water_available_af > 0"
        side_effects: ["operating_posture = OPEN"]

      - from: FROZEN
        to: RESTRICTED
        trigger: "system (recompute after POST /_clock/set_current_utc when an EXCEEDANCE reading ages out of EXCEEDANCE_WINDOW_DAYS)"
        actor: system
        preconditions:
          - "exceedance_count_rolling == 1 AND water_available_af > 0"
        side_effects:
          - "operating_posture = RESTRICTED"
          - "every BroodStock of this hatchery in status SUSPENDED whose spawning window still contains the clock transitions back to SPAWNING"

      - from: FROZEN
        to: OPEN
        trigger: "system (recompute after POST /_clock/set_current_utc when every EXCEEDANCE reading ages out of EXCEEDANCE_WINDOW_DAYS)"
        actor: system
        preconditions:
          - "exceedance_count_rolling == 0 AND density_index < DENSITY_RESTRICT_THRESHOLD (0.90) AND water_available_af > 0"
        side_effects:
          - "operating_posture = OPEN"
          - "every BroodStock of this hatchery in status SUSPENDED whose spawning window still contains the clock transitions back to SPAWNING"

  # ---------------------------------------------------------------------------
  # BroodStock — cyclic: SPAWNING ⇄ SUSPENDED driven by hatchery posture.
  # ---------------------------------------------------------------------------
  - entity: BroodStock
    initial_state: READY
    terminal_states: [CLOSED]
    transitions:
      - from: READY
        to: SPAWNING
        trigger: "POST /brood-stocks/{id}/open-spawning-window"
        actor: HatcheryManager
        preconditions:
          - "acting HatcheryManager's X-User-ID == BroodStock.hatchery_id (ERR_HATCHERY_SCOPE_VIOLATION)"
          - "spawning_window_start <= current_utc < spawning_window_end (ERR_SPAWN_WINDOW_CLOSED)"
          - "Hatchery.operating_posture != FROZEN (ERR_HATCHERY_FROZEN)"
        side_effects: ["status = SPAWNING — SpawnEvents may now be planned against this group"]

      - from: SPAWNING
        to: SUSPENDED
        trigger: "system (cascade from Hatchery OPEN/RESTRICTED → FROZEN)"
        actor: system
        preconditions: []
        side_effects:
          - "status = SUSPENDED"
          - "cascade link 3 of transitive_cascade.effluent_exceedance_freezes_production: because this group is suspended, each of its SpawnEvents in status PLANNED transitions to CANCELLED"

      - from: SUSPENDED
        to: SPAWNING
        trigger: "system (cascade from Hatchery FROZEN → RESTRICTED or FROZEN → OPEN)"
        actor: system
        preconditions:
          - "spawning_window_start <= current_utc < spawning_window_end"
        side_effects: ["status = SPAWNING; SpawnEvents already CANCELLED are NOT resurrected"]

      - from: SPAWNING
        to: CLOSED
        trigger: "system (evaluated at the end of POST /spawn-events/{id}/record-take)"
        actor: system
        preconditions:
          - "cumulative_eggs_taken >= egg_take_target"
        side_effects: ["status = CLOSED — no further SpawnEvents may be planned (ERR_BROOD_STOCK_NOT_SPAWNING)"]

      - from: SUSPENDED
        to: CLOSED
        trigger: "system (evaluated at the end of POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= spawning_window_end"
        side_effects: ["status = CLOSED"]

      - from: SPAWNING
        to: CLOSED
        trigger: "system (evaluated at the end of POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= spawning_window_end"
        side_effects: ["status = CLOSED"]

  # ---------------------------------------------------------------------------
  # SpawnEvent — branching: a planned take either lands (TAKEN, producing a
  # RearingLot) or is unwound (CANCELLED, returning females and water).
  # ---------------------------------------------------------------------------
  - entity: SpawnEvent
    initial_state: PLANNED
    terminal_states: [TAKEN, CANCELLED]
    transitions:
      - from: PLANNED
        to: TAKEN
        trigger: "POST /spawn-events/{id}/record-take"
        actor: HatcheryManager
        preconditions:
          - "acting HatcheryManager's X-User-ID == BroodStock.hatchery_id (ERR_HATCHERY_SCOPE_VIOLATION)"
          - "BroodStock.status == SPAWNING (ERR_BROOD_STOCK_NOT_SPAWNING)"
          - "Hatchery.operating_posture != FROZEN (ERR_HATCHERY_FROZEN)"
          - "taken_at <= current_utc (ERR_INVALID_REQUEST)"
          - "eggs_taken >= 1 (ERR_INVALID_REQUEST)"
          - "round(eggs_taken * WATER_AF_PER_1000_EGGS / 1000, 4) <= Hatchery.water_available_af + SpawnEvent.water_reserved_af (ERR_WATER_RIGHT_EXCEEDED)"
        side_effects:
          - "status = TAKEN; eggs_taken and taken_at persisted"
          - "BroodStock.females_reserved -= females_spawned; BroodStock.females_spent += females_spawned; BroodStock.cumulative_eggs_taken += eggs_taken"
          - "Hatchery.water_reserved_af -= SpawnEvent.water_reserved_af; Hatchery.water_used_af += round(eggs_taken * WATER_AF_PER_1000_EGGS / 1000, 4)"
          - "creates one RearingLot: rearing_stage=EGG, health_status=UNSCREENED, initial_count=eggs_taken, count_on_hand=eggs_taken, avg_weight_g=EGG_WEIGHT_G, initial_biomass_lbs and biomass_lbs per calculations.lot_biomass"
          - "recompute Hatchery.biomass_on_hand_lbs, density_index, water_available_af, operating_posture"
          - "if BroodStock.cumulative_eggs_taken >= egg_take_target: BroodStock → CLOSED"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /spawn-events/{id}/cancel"
        actor: "HatcheryManager | ProgramAdmin"
        preconditions:
          - "acting HatcheryManager's X-User-ID == BroodStock.hatchery_id (ERR_HATCHERY_SCOPE_VIOLATION); ProgramAdmin is unscoped"
        side_effects:
          - "status = CANCELLED"
          - "BroodStock.females_reserved -= females_spawned (females return to females_available)"
          - "Hatchery.water_reserved_af -= SpawnEvent.water_reserved_af (acre-feet return to water_available_af)"
          - "recompute Hatchery.water_available_af and operating_posture"

      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade from BroodStock SPAWNING → SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status = CANCELLED"
          - "cascade link 4 of transitive_cascade.effluent_exceedance_freezes_production: BroodStock.females_reserved -= females_spawned and Hatchery.water_reserved_af -= SpawnEvent.water_reserved_af"

  # ---------------------------------------------------------------------------
  # RearingLot — PARALLEL STATE DIMENSIONS. rearing_stage (growth) and
  # health_status (disease) advance independently on the same row; a lot may be
  # YEARLING+QUARANTINED or FRY+CERTIFIED. Only the pair gates stocking.
  # ---------------------------------------------------------------------------
  - entity: RearingLot
    initial_state: "EGG + UNSCREENED"
    terminal_states: [RELEASED, TERMINATED]
    note: "Two independent dimensions. Dimension A (rearing_stage): EGG → FRY → FINGERLING → YEARLING → RELEASED | TERMINATED. Dimension B (health_status): UNSCREENED → UNDER_INSPECTION → {CERTIFIED, RESTRICTED, QUARANTINED}, CERTIFIED → UNSCREENED on certificate lapse. terminal_states are the terminal members of dimension A only."
    transitions:
      # --- dimension A: rearing_stage ---
      - from: "stage EGG"
        to: "stage FRY"
        trigger: "POST /rearing-lots/{id}/advance-stage"
        actor: HatcheryManager
        preconditions:
          - "acting HatcheryManager's X-User-ID == RearingLot.hatchery_id (ERR_HATCHERY_SCOPE_VIOLATION)"
          - "to_stage == FRY (ERR_INVALID_STATE for any non-adjacent target)"
          - "avg_weight_g >= STAGE_WEIGHT_GATES.FRY (1.0) (ERR_STAGE_WEIGHT_NOT_MET)"
        side_effects: ["rearing_stage = FRY; health_status untouched"]

      - from: "stage FRY"
        to: "stage FINGERLING"
        trigger: "POST /rearing-lots/{id}/advance-stage"
        actor: HatcheryManager
        preconditions:
          - "to_stage == FINGERLING"
          - "avg_weight_g >= STAGE_WEIGHT_GATES.FINGERLING (4.0) (ERR_STAGE_WEIGHT_NOT_MET)"
        side_effects: ["rearing_stage = FINGERLING"]

      - from: "stage FINGERLING"
        to: "stage YEARLING"
        trigger: "POST /rearing-lots/{id}/advance-stage"
        actor: HatcheryManager
        preconditions:
          - "to_stage == YEARLING"
          - "avg_weight_g >= STAGE_WEIGHT_GATES.YEARLING (45.0) (ERR_STAGE_WEIGHT_NOT_MET)"
        side_effects: ["rearing_stage = YEARLING"]

      - from: "stage FRY | FINGERLING | YEARLING"
        to: "stage RELEASED"
        trigger: "system (evaluated at the end of POST /stocking-events/{id}/release)"
        actor: system
        preconditions:
          - "count_on_hand == 0 AND reserved_count == 0"
        side_effects:
          - "rearing_stage = RELEASED"
          - "Hatchery.biomass_on_hand_lbs drops this lot's biomass; density_index and operating_posture recomputed"

      - from: "stage EGG | FRY | FINGERLING | YEARLING"
        to: "stage TERMINATED"
        trigger: "system (evaluated at the end of POST /rearing-lots/{id}/feedings)"
        actor: system
        preconditions:
          - "count_on_hand == 0 AND reserved_count == 0 AND cumulative_mortality_count == initial_count"
        side_effects:
          - "rearing_stage = TERMINATED; the lot leaves Hatchery.biomass_on_hand_lbs"

      # --- dimension B: health_status ---
      - from: "health UNSCREENED"
        to: "health UNDER_INSPECTION"
        trigger: "POST /health-inspections"
        actor: FishHealthVeterinarian
        preconditions:
          - "no other HealthInspection on this lot is in status SAMPLED or RETEST_DUE (ERR_INVALID_STATE)"
        side_effects: ["health_status = UNDER_INSPECTION; certificate_expires_at = null"]

      - from: "health CERTIFIED"
        to: "health UNDER_INSPECTION"
        trigger: "POST /health-inspections"
        actor: FishHealthVeterinarian
        preconditions:
          - "no other HealthInspection on this lot is in status SAMPLED or RETEST_DUE"
        side_effects: ["health_status = UNDER_INSPECTION; certificate_expires_at = null — a re-inspection withdraws the standing certificate"]

      - from: "health UNDER_INSPECTION"
        to: "health CERTIFIED"
        trigger: "system (cascade from HealthInspection PASSED → CERTIFIED)"
        actor: system
        preconditions: []
        side_effects: ["health_status = CERTIFIED; certificate_expires_at = HealthInspection.certificate_expires_at"]

      - from: "health UNDER_INSPECTION"
        to: "health RESTRICTED"
        trigger: "system (cascade from HealthInspection SAMPLED | RETEST_DUE → FAILED_TREATABLE)"
        actor: system
        preconditions: []
        side_effects: ["health_status = RESTRICTED; certificate_expires_at = null; the lot may still be fed and advanced but not stocked (ERR_LOT_NOT_CERTIFIED)"]

      - from: "health UNSCREENED | UNDER_INSPECTION | RESTRICTED | CERTIFIED"
        to: "health QUARANTINED"
        trigger: "system (cascade from HealthInspection → FAILED_REPORTABLE)"
        actor: system
        preconditions: []
        side_effects:
          - "health_status = QUARANTINED; certificate_expires_at = null"
          - "cascade link 3 of transitive_cascade.reportable_pathogen_unwinds_stocking: because the lot is quarantined, every StockingEvent on this lot in status SCHEDULED or IN_TRANSIT transitions to ABORTED"

      - from: "health CERTIFIED"
        to: "health UNSCREENED"
        trigger: "system (evaluated at the end of POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc > certificate_expires_at"
        side_effects: ["health_status = UNSCREENED; certificate_expires_at is RETAINED on the lot as the lapsed expiry instant, which is what lets a load distinguish a lapsed certificate from a never-certified lot; the HealthInspection itself stays CERTIFIED as the historical record"]

  # ---------------------------------------------------------------------------
  # HealthInspection — CYCLIC: a treatable finding sends the inspection back to
  # RETEST_DUE, which may fail again (bounded by MAX_RETESTS). CERTIFIED requires
  # a different veterinarian than the one who sampled (segregation of duties).
  # ---------------------------------------------------------------------------
  - entity: HealthInspection
    initial_state: SAMPLED
    terminal_states: [CERTIFIED, FAILED_REPORTABLE]
    transitions:
      - from: SAMPLED
        to: PASSED
        trigger: "POST /health-inspections/{id}/record-result"
        actor: FishHealthVeterinarian
        preconditions:
          - "result == NEGATIVE (ERR_INVALID_REQUEST for an unknown result value)"
          - "RearingLot.health_status != QUARANTINED (ERR_LOT_QUARANTINED)"
        side_effects:
          - "status = PASSED; result, resulted_at persisted; certificate_expires_at stays null until certification"

      - from: SAMPLED
        to: FAILED_TREATABLE
        trigger: "POST /health-inspections/{id}/record-result"
        actor: FishHealthVeterinarian
        preconditions:
          - "result == POSITIVE_TREATABLE"
          - "retest_count < MAX_RETESTS (2)"
        side_effects:
          - "status = FAILED_TREATABLE; pathogen_code persisted"
          - "cross-entity: RearingLot.health_status = RESTRICTED, RearingLot.certificate_expires_at = null"

      - from: SAMPLED
        to: FAILED_REPORTABLE
        trigger: "POST /health-inspections/{id}/record-result"
        actor: FishHealthVeterinarian
        preconditions:
          - "result == POSITIVE_REPORTABLE"
        side_effects:
          - "status = FAILED_REPORTABLE; pathogen_code persisted"
          - "cascade link 2 of transitive_cascade.reportable_pathogen_unwinds_stocking: RearingLot.health_status = QUARANTINED"

      - from: FAILED_TREATABLE
        to: RETEST_DUE
        trigger: "POST /health-inspections/{id}/record-treatment"
        actor: FishHealthVeterinarian
        preconditions:
          - "treatment_code is one of the recognised codes (ERR_INVALID_REQUEST)"
          - "withdrawal_days >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = RETEST_DUE; retest_count += 1; treatment_code persisted"
          - "withdrawal_clears_at = treatment_completed_at + withdrawal_days days — StockingEvent loading is refused while the clock is before this instant (ERR_WITHDRAWAL_PERIOD_ACTIVE)"

      - from: RETEST_DUE
        to: PASSED
        trigger: "POST /health-inspections/{id}/record-result"
        actor: FishHealthVeterinarian
        preconditions:
          - "result == NEGATIVE"
          - "current_utc >= withdrawal_clears_at (ERR_WITHDRAWAL_PERIOD_ACTIVE)"
        side_effects: ["status = PASSED"]

      - from: RETEST_DUE
        to: FAILED_TREATABLE
        trigger: "POST /health-inspections/{id}/record-result"
        actor: FishHealthVeterinarian
        preconditions:
          - "result == POSITIVE_TREATABLE"
          - "retest_count < MAX_RETESTS (2) — this is the cycle back into treatment"
        side_effects:
          - "status = FAILED_TREATABLE"
          - "cross-entity: RearingLot.health_status = RESTRICTED"

      - from: RETEST_DUE
        to: FAILED_REPORTABLE
        trigger: "POST /health-inspections/{id}/record-result"
        actor: FishHealthVeterinarian
        preconditions:
          - "result == POSITIVE_REPORTABLE, OR result == POSITIVE_TREATABLE while retest_count == MAX_RETESTS (2) — the third positive escalates instead of cycling"
        side_effects:
          - "status = FAILED_REPORTABLE; escalated_from_retests = true when the escalation path was taken"
          - "cross-entity: RearingLot.health_status = QUARANTINED plus the full stocking unwind cascade"

      - from: PASSED
        to: CERTIFIED
        trigger: "POST /health-inspections/{id}/certify"
        actor: FishHealthVeterinarian
        preconditions:
          - "X-User-ID != sampled_by_user_id (ERR_SEGREGATION_OF_DUTIES) — the sampling veterinarian may not sign the certificate"
          - "RearingLot.health_status != QUARANTINED (ERR_LOT_QUARANTINED)"
        side_effects:
          - "status = CERTIFIED; certified_by_user_id = X-User-ID; certified_at = current_utc"
          - "certificate_expires_at = certified_at + CERT_VALID_DAYS (30) days"
          - "cross-entity: RearingLot.health_status = CERTIFIED and RearingLot.certificate_expires_at = this certificate's expiry"

  # ---------------------------------------------------------------------------
  # Water — a stocking destination is retired, never revived.
  # ---------------------------------------------------------------------------
  - entity: Water
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /waters/{id}/close"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "status = CLOSED; releases into this water are refused (ERR_WATER_CLOSED); existing SCHEDULED StockingEvents are left alone so they can be aborted deliberately"

  # ---------------------------------------------------------------------------
  # StockingRequest — branching with a loop: a deferred request re-enters the
  # queue and may be granted by a later allocation run.
  # ---------------------------------------------------------------------------
  - entity: StockingRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, FULFILLED]
    transitions:
      - from: SUBMITTED
        to: QUEUED
        trigger: "POST /stocking-requests/{id}/attach-to-plan"
        actor: "RegionalBiologist | ProgramAdmin"
        preconditions:
          - "expected_plan_version == AllocationPlan.version (ERR_STALE_PLAN_VERSION)"
          - "AllocationPlan.status == DRAFT (ERR_INVALID_STATE)"
          - "AllocationPlan.size_class == StockingRequest.size_class (ERR_SIZE_CLASS_MISMATCH)"
          - "acting RegionalBiologist's X-User-ID == StockingRequest.requested_by_user_id (ERR_NOT_REQUEST_OWNER)"
        side_effects:
          - "status = QUEUED; allocation_plan_id = the plan"
          - "AllocationPlan.version += 1"

      - from: QUEUED
        to: ALLOCATED
        trigger: "system (POST /allocation-plans/{id}/run — grant > 0)"
        actor: system
        preconditions:
          - "the request survives calculations.allocation_grant with grant_count > 0"
        side_effects:
          - "status = ALLOCATED; allocated_count = grant_count; allocated_at = current_utc; deferral_reason = null"
          - "Water.allocated_count_ytd += grant_count; Water.plan_shortfall_count recomputed"

      - from: QUEUED
        to: DEFERRED
        trigger: "system (POST /allocation-plans/{id}/run — grant == 0)"
        actor: system
        preconditions:
          - "the request is eligible but calculations.allocation_grant yields grant_count == 0"
        side_effects: ["status = DEFERRED; allocated_count = 0; deferral_reason = POOL_EXHAUSTED; allocated_at = null"]

      - from: QUEUED
        to: DENIED
        trigger: "system (POST /allocation-plans/{id}/run — ineligible)"
        actor: system
        preconditions:
          - "StockingRequest.species != AllocationPlan.species OR Water.status == CLOSED"
        side_effects: ["status = DENIED; allocated_count = 0; deferral_reason = INELIGIBLE"]

      - from: DEFERRED
        to: QUEUED
        trigger: "POST /stocking-requests/{id}/attach-to-plan"
        actor: "RegionalBiologist | ProgramAdmin"
        preconditions:
          - "expected_plan_version == AllocationPlan.version (ERR_STALE_PLAN_VERSION)"
          - "the target AllocationPlan.status == DRAFT and its id differs from allocation_plan_id (ERR_INVALID_STATE when re-attaching to the same plan)"
        side_effects:
          - "status = QUEUED; allocation_plan_id = the new plan; deferral_reason = null"
          - "the new AllocationPlan.version += 1; if the new plan was ALLOCATED it returns to DRAFT"

      - from: ALLOCATED
        to: DEFERRED
        trigger: "system (cascade from StockingEvent → ABORTED)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 4 of transitive_cascade.reportable_pathogen_unwinds_stocking: status = DEFERRED, allocated_count = 0, deferral_reason = EVENT_ABORTED"
          - "cascade link 5: Water.allocated_count_ytd -= the surrendered grant and Water.plan_shortfall_count is recomputed"

      - from: ALLOCATED
        to: FULFILLED
        trigger: "system (POST /stocking-events/{id}/release)"
        actor: system
        preconditions:
          - "the granting StockingEvent reached RELEASED (transport mortality does not block fulfilment)"
        side_effects: ["status = FULFILLED; fulfilled_at = current_utc"]

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /stocking-requests/{id}/withdraw"
        actor: "RegionalBiologist | PublicRequester | ProgramAdmin"
        preconditions:
          - "X-User-ID == requested_by_user_id unless the actor is ProgramAdmin (ERR_NOT_REQUEST_OWNER)"
        side_effects: ["status = WITHDRAWN"]

      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /stocking-requests/{id}/withdraw"
        actor: "RegionalBiologist | PublicRequester | ProgramAdmin"
        preconditions:
          - "X-User-ID == requested_by_user_id unless the actor is ProgramAdmin"
        side_effects: ["status = WITHDRAWN; the request leaves the plan's candidate set (allocation_plan_id is retained for audit)"]

      - from: DEFERRED
        to: WITHDRAWN
        trigger: "POST /stocking-requests/{id}/withdraw"
        actor: "RegionalBiologist | PublicRequester | ProgramAdmin"
        preconditions:
          - "X-User-ID == requested_by_user_id unless the actor is ProgramAdmin"
        side_effects: ["status = WITHDRAWN"]

  # ---------------------------------------------------------------------------
  # AllocationPlan — CYCLIC: attaching a request to an already-run plan drops it
  # back to DRAFT so the selector must be re-run.
  # ---------------------------------------------------------------------------
  - entity: AllocationPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /allocation-plans/{id}/run"
        actor: ProgramAdmin
        preconditions:
          - "expected_plan_version == AllocationPlan.version (ERR_STALE_PLAN_VERSION)"
          - "at least one attached StockingRequest is in status QUEUED (ERR_NO_ELIGIBLE_REQUESTS)"
          - "Hatchery.operating_posture != FROZEN (ERR_HATCHERY_FROZEN)"
        side_effects:
          - "status = ALLOCATED; run_count += 1; version += 1"
          - "every QUEUED request is resolved to ALLOCATED, DEFERRED or DENIED per calculations.allocation_grant"
          - "allocated_total_count, unmet_demand_count and public_allocated_count recomputed"

      - from: ALLOCATED
        to: DRAFT
        trigger: "POST /stocking-requests/{id}/attach-to-plan"
        actor: "RegionalBiologist | ProgramAdmin"
        preconditions:
          - "expected_plan_version == AllocationPlan.version (ERR_STALE_PLAN_VERSION)"
          - "no StockingEvent has yet been created against a request allocated by this plan (ERR_INVALID_STATE)"
        side_effects:
          - "status = DRAFT; allocated_total_count, unmet_demand_count and public_allocated_count reset to 0; version += 1 (run_count keeps its historical value)"
          - "every request previously ALLOCATED or DEFERRED by this plan returns to QUEUED with allocated_count = 0"

      - from: ALLOCATED
        to: CLOSED
        trigger: "system (evaluated at the end of POST /stocking-events/{id}/release)"
        actor: system
        preconditions:
          - "every StockingRequest attached to this plan is in a terminal status (FULFILLED, DENIED or WITHDRAWN)"
        side_effects: ["status = CLOSED — the plan can no longer be re-run or re-attached"]

  # ---------------------------------------------------------------------------
  # TransportUnit — cyclic availability ⇄ in-use, with a maintenance exit.
  # ---------------------------------------------------------------------------
  - entity: TransportUnit
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "system (POST /stocking-events/{id}/load)"
        actor: system
        preconditions:
          - "no other StockingEvent in status IN_TRANSIT holds this unit"
        side_effects: ["status = IN_USE; current_event_id = the loading event"]

      - from: IN_USE
        to: AVAILABLE
        trigger: "system (POST /stocking-events/{id}/release or POST /stocking-events/{id}/abort)"
        actor: system
        preconditions: []
        side_effects: ["status = AVAILABLE; current_event_id = null; trip intervals of terminal events remain on record for overlap checks"]

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "system (evaluated at the end of POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= certification_expires_at"
        side_effects: ["status = OUT_OF_SERVICE — the unit can no longer be booked (ERR_TRANSPORT_UNIT_UNAVAILABLE)"]

  # ---------------------------------------------------------------------------
  # StockingEvent — branching: a scheduled load either reaches the water
  # (RELEASED) or is unwound (ABORTED), returning fish, budget and the unit.
  # ---------------------------------------------------------------------------
  - entity: StockingEvent
    initial_state: SCHEDULED
    terminal_states: [RELEASED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /stocking-events/{id}/load"
        actor: HatcheryManager
        preconditions:
          - "acting HatcheryManager's X-User-ID == RearingLot.hatchery_id (ERR_HATCHERY_SCOPE_VIOLATION)"
          - "Hatchery.operating_posture != FROZEN (ERR_HATCHERY_FROZEN)"
          - "RearingLot.health_status == CERTIFIED (ERR_LOT_NOT_CERTIFIED); QUARANTINED reports ERR_LOT_QUARANTINED"
          - "current_utc <= RearingLot.certificate_expires_at (ERR_HEALTH_CERTIFICATE_EXPIRED)"
          - "current_utc >= the lot's latest HealthInspection.withdrawal_clears_at (ERR_WITHDRAWAL_PERIOD_ACTIVE)"
          - "no other StockingEvent on this TransportUnit has an intersecting trip interval (ERR_TRANSPORT_UNIT_UNAVAILABLE)"
          - "sum of planned_load_lbs over the events overlapping this trip does not push required oxygen above Hatchery.oxygen_supply_lpm (ERR_OXYGEN_SUPPLY_EXCEEDED)"
          - "fish_count <= calculations.transport_load_plan.max_fish for the supplied load_water_temp_c (ERR_TRANSPORT_CAPACITY_EXCEEDED)"
        side_effects:
          - "status = IN_TRANSIT; loaded_at = current_utc; load_water_temp_c, measured_load_lbs, oxygen_flow_lpm and max_fish_allowed persisted"
          - "TransportUnit → IN_USE"
          - "RearingLot.reserved_count stays reserved; count_on_hand is not yet decremented"

      - from: IN_TRANSIT
        to: RELEASED
        trigger: "POST /stocking-events/{id}/release"
        actor: HatcheryManager
        preconditions:
          - "Water.status == ACTIVE (ERR_WATER_CLOSED)"
          - "abs(site_water_temp_c - load_water_temp_c) <= MAX_TEMP_DELTA_C (10.0) (ERR_TEMP_DELTA_EXCEEDED)"
          - "tempering_minutes >= calculations.acclimation_requirement.acclimation_minutes_required (ERR_ACCLIMATION_INSUFFICIENT)"
          - "current_utc >= Water.last_release_at + WATER_REST_BUFFER_HOURS (48) when Water.last_release_at is set (ERR_WATER_REST_BUFFER)"
        side_effects:
          - "status = RELEASED; released_at = current_utc; released_count = fish_count - transport_mortality_count; site_water_temp_c, tempering_minutes and arrived_at persisted"
          - "RearingLot.reserved_count -= fish_count, RearingLot.count_on_hand -= fish_count and RearingLot.cumulative_mortality_count += transport_mortality_count; biomass_lbs recomputed"
          - "Water.released_count_ytd += released_count; Water.allocated_count_ytd -= StockingRequest.allocated_count; Water.last_release_at = current_utc; Water.plan_shortfall_count and plan_fill_pct recomputed"
          - "Hatchery.budget_committed_cents -= transport_cost_cents; Hatchery.budget_spent_cents += transport_cost_cents"
          - "Hatchery.biomass_on_hand_lbs, density_index and operating_posture recomputed"
          - "TransportUnit → AVAILABLE; StockingRequest → FULFILLED; the RearingLot may reach stage RELEASED and the AllocationPlan may reach CLOSED"

      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /stocking-events/{id}/abort"
        actor: "HatcheryManager | ProgramAdmin"
        preconditions:
          - "acting HatcheryManager's X-User-ID == RearingLot.hatchery_id (ERR_HATCHERY_SCOPE_VIOLATION)"
        side_effects:
          - "status = ABORTED; aborted_at = current_utc; abort_reason = OPERATOR_ABORT; released_count = 0"
          - "RearingLot.reserved_count -= fish_count (the fish stay in count_on_hand)"
          - "Hatchery.budget_committed_cents -= transport_cost_cents"
          - "StockingRequest → DEFERRED with allocated_count 0; Water.allocated_count_ytd -= the surrendered grant"

      - from: IN_TRANSIT
        to: ABORTED
        trigger: "POST /stocking-events/{id}/abort"
        actor: "HatcheryManager | ProgramAdmin"
        preconditions:
          - "acting HatcheryManager's X-User-ID == RearingLot.hatchery_id"
        side_effects:
          - "status = ABORTED; the same restorations as the SCHEDULED → ABORTED edge"
          - "TransportUnit → AVAILABLE and current_event_id = null"

      - from: "SCHEDULED | IN_TRANSIT"
        to: ABORTED
        trigger: "system (cascade from RearingLot health_status → QUARANTINED)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 3 of transitive_cascade.reportable_pathogen_unwinds_stocking: status = ABORTED, aborted_at = current_utc, abort_reason = LOT_QUARANTINED"
          - "RearingLot.reserved_count -= fish_count; Hatchery.budget_committed_cents -= transport_cost_cents; TransportUnit → AVAILABLE"
          - "then cascade link 4 flips the StockingRequest to DEFERRED"

# =============================================================================
# §1.2.1 Concurrency Rules — every contested write is serialised by an
# optimistic-concurrency token on the PARENT row's `version`. A caller reads the
# parent, sends the version it saw, and the write is refused with 412 if any
# other write advanced that parent in between. No request is ever "concurrent"
# with another: the tokens make the ordering explicit and deterministic.
# =============================================================================
concurrency_rules:

  - name: stocking-event-create-stale-lot
    parent_entity: RearingLot
    write_endpoint: "POST /stocking-events"
    occ_field: expected_lot_version
    error_id: ERR_STALE_LOT_VERSION
    status: 412
    description: |
      Scheduling an event reserves fish out of RearingLot.count_on_hand, so the
      caller must prove it reserved against the count it read. Any earlier write
      that changed the lot (a feeding, a stage advance, a health cascade, another
      event) advanced RearingLot.version, and the request is refused.
    checked_before: "state checks, business_safety checks and the reservation itself"
    side_effect_on_success: "RearingLot.version += 1"

  - name: allocation-run-stale-plan
    parent_entity: AllocationPlan
    write_endpoint: "POST /allocation-plans/{id}/run"
    occ_field: expected_plan_version
    error_id: ERR_STALE_PLAN_VERSION
    status: 412
    description: |
      Running the selector resolves the whole queued set at once, so the caller
      must prove it read the plan after the last attach or detach. Every attach
      advances AllocationPlan.version, so a run built from an older read is
      refused rather than silently allocating against a changed candidate set.
    checked_before: "ERR_NO_ELIGIBLE_REQUESTS and every per-request eligibility check"
    side_effect_on_success: "AllocationPlan.version += 1"

  - name: request-attach-stale-plan
    parent_entity: AllocationPlan
    write_endpoint: "POST /stocking-requests/{id}/attach-to-plan"
    occ_field: expected_plan_version
    error_id: ERR_STALE_PLAN_VERSION
    status: 412
    description: |
      Attaching enlarges the plan's candidate set. Because two different
      requests attaching to one plan both advance that plan's version, the
      second caller must re-read the plan before it may attach.
    checked_before: "AllocationPlan status checks and ERR_SIZE_CLASS_MISMATCH"
    side_effect_on_success: "AllocationPlan.version += 1"

# =============================================================================
# §1.3 Calculation & Algorithm Table
# =============================================================================
calculations:

  - name: lot_biomass
    algorithm_type: aggregation
    description: "Standing crop of a rearing lot in pounds, and the pounds lost to mortality."
    inputs: [RearingLot.count_on_hand, RearingLot.avg_weight_g, RearingLot.initial_count]
    constants:
      GRAMS_PER_LB: 453.592
    formula: |
      biomass_lbs = round(count_on_hand * avg_weight_g / GRAMS_PER_LB, 2)
      initial_biomass_lbs = round(initial_count * EGG_WEIGHT_G / GRAMS_PER_LB, 2)   # frozen at lot creation
      mortality_biomass_lbs (per feeding) = round(mortality_count * avg_weight_g_after / GRAMS_PER_LB, 2)
      cumulative_mortality_biomass_lbs += mortality_biomass_lbs of each feeding
    precision: "2 decimal places, ROUND_HALF_UP"
    worked_example: |
      A take of 20000 eggs at EGG_WEIGHT_G 0.1 g: initial_biomass_lbs =
      round(20000 * 0.1 / 453.592, 2) = 4.41. After a feeding that reports
      mortality_count 2000 and avg_weight_g_after 4.53592: count_on_hand 18000,
      biomass_lbs = round(18000 * 4.53592 / 453.592, 2) = 180.00 and that
      feeding's mortality_biomass_lbs = round(2000 * 4.53592 / 453.592, 2) = 20.00.

  - name: hatchery_density_index
    algorithm_type: aggregation
    description: "Fraction of permitted rearing capacity currently occupied, and the hatchery-level biomass it derives from."
    inputs: [RearingLot.biomass_lbs, RearingLot.rearing_stage, Hatchery.rearing_capacity_lbs]
    input_set_filter: "RearingLots of this hatchery whose rearing_stage NOT IN {RELEASED, TERMINATED}"
    formula: |
      biomass_on_hand_lbs = round(sum(biomass_lbs of included lots), 2)
      density_index = round(biomass_on_hand_lbs / rearing_capacity_lbs, 4)
    precision: "biomass 2 dp, density_index 4 dp, ROUND_HALF_UP"
    recomputed_by:
      - "POST /spawn-events/{id}/record-take"
      - "POST /rearing-lots/{id}/feedings"
      - "POST /rearing-lots/{id}/advance-stage"
      - "POST /stocking-events/{id}/release"
      - "POST /_clock/set_current_utc"
    worked_example: |
      One included lot at 1600.00 lbs against rearing_capacity_lbs 2000.0:
      density_index = round(1600.00 / 2000.0, 4) = 0.8000.

  - name: hatchery_operating_posture
    algorithm_type: threshold
    description: "Compliance posture of the station, ordered worst-first so a frozen station never reads as merely restricted."
    inputs: [Hatchery.exceedance_count_rolling, Hatchery.water_available_af, Hatchery.density_index]
    constants:
      EXCEEDANCE_FREEZE_COUNT: 2
      DENSITY_RESTRICT_THRESHOLD: 0.90
    formula: |
      if exceedance_count_rolling >= EXCEEDANCE_FREEZE_COUNT or water_available_af <= 0:
          operating_posture = FROZEN
      elif exceedance_count_rolling == 1 or density_index >= DENSITY_RESTRICT_THRESHOLD:
          operating_posture = RESTRICTED
      else:
          operating_posture = OPEN
    boundary_notes: |
      density_index exactly 0.90 is RESTRICTED (the comparison is >=), 0.8999 is
      OPEN. water_available_af exactly 0 is FROZEN (the comparison is <=).
      The FROZEN test is evaluated first, so a station with two exceedances is
      FROZEN even when its density is comfortable.

  - name: feed_conversion_ratio
    algorithm_type: aggregation
    description: "Pounds of feed per pound of fish produced, reported under two industry conventions on every feeding."
    inputs: [RearingLot.cumulative_feed_lbs, RearingLot.biomass_lbs, RearingLot.initial_biomass_lbs, RearingLot.cumulative_mortality_biomass_lbs]
    variants:
      BIOLOGICAL: |
        fcr_biological = round(cumulative_feed_lbs / (biomass_lbs - initial_biomass_lbs), 3)
        # credits only the fish still standing — the conservative husbandry number
      ECONOMIC: |
        fcr_economic = round(cumulative_feed_lbs / (biomass_lbs + cumulative_mortality_biomass_lbs - initial_biomass_lbs), 3)
        # credits the pounds that died too — the number the feed budget is judged on
    variant_selector: "Both variants are computed and stored on every feeding; RearingLot.fcr_biological and RearingLot.fcr_economic are the current cumulative values. ECONOMIC is always <= BIOLOGICAL and the two coincide only when the lot has recorded no mortality."
    precision: "3 decimal places, ROUND_HALF_UP; both variants are null while the denominator is <= 0"
    worked_example: |
      Lot with initial_biomass_lbs 4.41. Feeding 1 (feed_lbs 300.0, mortality 2000,
      avg_weight_g_after 4.53592): biomass 180.00, cumulative_mortality_biomass 20.00,
      cumulative_feed 300 → BIOLOGICAL round(300 / (180.00 - 4.41), 3) = 1.709,
      ECONOMIC round(300 / (180.00 + 20.00 - 4.41), 3) = 1.534.
      Feeding 2 (feed_lbs 1500.0, mortality 2000, avg_weight_g_after 45.3592):
      biomass 1600.00, cumulative_mortality_biomass 220.00, cumulative_feed 1800 →
      BIOLOGICAL round(1800 / 1595.59, 3) = 1.128, ECONOMIC round(1800 / 1815.59, 3) = 0.991.

  - name: egg_take_projection
    algorithm_type: projection
    description: "Survival-chained projection from eggs in the tray to fish at the truck, derated by how crowded the station already is."
    inputs: [BroodStock.female_count, BroodStock.expected_fecundity_per_female, SpawnEvent.females_spawned, SpawnEvent.target_release_count, Hatchery.density_index]
    constants:
      EGG_TO_FRY_SURVIVAL: 0.80
      FRY_TO_FINGERLING_SURVIVAL: 0.90
      FINGERLING_TO_RELEASE_SURVIVAL: 0.95
      DENSITY_DERATE_LOW: 1.00      # density_index < 0.50
      DENSITY_DERATE_MID: 0.95      # 0.50 <= density_index < 0.90
      DENSITY_DERATE_HIGH: 0.85     # density_index >= 0.90
      WATER_AF_PER_1000_EGGS: 0.05
    formula: |
      available_eggs = females_spawned * BroodStock.expected_fecundity_per_female
      derate = DENSITY_DERATE_LOW | DENSITY_DERATE_MID | DENSITY_DERATE_HIGH,
               selected from Hatchery.density_index AS STORED AT SPAWN-EVENT CREATION
      cumulative_survival = round(EGG_TO_FRY_SURVIVAL * FRY_TO_FINGERLING_SURVIVAL
                                  * FINGERLING_TO_RELEASE_SURVIVAL * derate, 4)
      required_eggs = ceil(target_release_count / cumulative_survival)
      projected_release_count = floor(available_eggs * cumulative_survival)
      water_reserved_af = round(available_eggs / 1000 * WATER_AF_PER_1000_EGGS, 4)
    tier_resolution_note: |
      The derate tier is resolved ONCE, from the density_index the hatchery already
      carried when the SpawnEvent was created — never from the density the take
      itself will produce. A station at 0.4999 therefore projects on the LOW tier
      even though the incoming eggs will push it past 0.50.
    precision: "cumulative_survival 4 dp; required_eggs ceil; projected_release_count floor; water_reserved_af 4 dp"
    worked_example: |
      females_spawned 20, expected_fecundity_per_female 3000 → available_eggs 60000.
      At density_index 0.0000 (LOW): cumulative_survival = round(0.80*0.90*0.95*1.00, 4)
      = 0.6840, required_eggs = ceil(15000 / 0.6840) = 21930,
      projected_release_count = floor(60000 * 0.6840) = 41040,
      water_reserved_af = round(60000 / 1000 * 0.05, 4) = 3.0.
      At density_index 0.8000 (MID): cumulative_survival = 0.6498,
      required_eggs = ceil(15000 / 0.6498) = 23085,
      projected_release_count = floor(60000 * 0.6498) = 38988.

  - name: stocking_request_priority_score
    algorithm_type: weighted_scoring
    description: "Single 0–100 score that ranks stocking requests, blending habitat suitability, angler demand and how far the water is from its management-plan target."
    inputs: [Water.habitat_suitability_score, Water.angler_demand_index, Water.plan_target_count, Water.released_count_ytd, Water.allocated_count_ytd, StockingRequest.requester_kind, StockingRequest.species, Water.plan_species, Water.access_type]
    constants:
      W_HABITAT: 0.45
      W_DEMAND: 0.35
      W_PLAN_GAP: 0.20
      REQUESTER_WEIGHT_BIOLOGIST: 1.00
      REQUESTER_WEIGHT_PUBLIC: 0.80
      SPECIES_MATCH_BONUS: 10
      REMOTE_ACCESS_PENALTY: 5
    formula: |
      plan_fill_gap_pct = round(max(0, plan_target_count - released_count_ytd - allocated_count_ytd)
                                / plan_target_count * 100, 2)
      base = W_HABITAT * habitat_suitability_score
           + W_DEMAND  * angler_demand_index
           + W_PLAN_GAP * plan_fill_gap_pct
      weighted = base * (REQUESTER_WEIGHT_BIOLOGIST if requester_kind == BIOLOGIST else REQUESTER_WEIGHT_PUBLIC)
      adjusted = weighted
               + (SPECIES_MATCH_BONUS if StockingRequest.species == Water.plan_species else 0)
               - (REMOTE_ACCESS_PENALTY if Water.access_type == REMOTE else 0)
      priority_score = round(min(100, max(0, adjusted)), 2)
    ordering_note: "The requester weight multiplies the base score only; the species bonus and the remote penalty are applied AFTER the multiplier, so a public request never has its bonus discounted."
    precision: "2 decimal places, ROUND_HALF_UP; clamped into [0, 100]"
    recomputed_by: "POST /stocking-requests (frozen at creation — a later change to the water's counters does not re-score an existing request)"
    worked_example: |
      Water with habitat_suitability_score 80, angler_demand_index 90,
      plan_target_count 2000, released_count_ytd 0, allocated_count_ytd 0,
      plan_species RAINBOW_TROUT, access_type PUBLIC_BOAT; a BIOLOGIST request for
      RAINBOW_TROUT: plan_fill_gap_pct 100.00, base = 36 + 31.5 + 20 = 87.5,
      weighted 87.5, adjusted 97.5 → priority_score 97.50.
      A PUBLIC request for the same species on a REMOTE water with habitat 60 and
      demand 100: base = 27 + 35 + 20 = 82.0, weighted 65.6, adjusted 65.6 + 10 - 5
      → priority_score 70.60.

  - name: allocation_grant
    algorithm_type: waterfall_allocation
    description: "Resolves every queued request on a plan into a whole-truck grant, filling the highest-priority request first out of a finite production pool with a reserved public sub-pool."
    inputs: [AllocationPlan.available_count, AllocationPlan.public_request_cap_pct, AllocationPlan.allocation_mode, StockingRequest.priority_score, StockingRequest.requested_count, StockingRequest.requester_kind, StockingRequest.created_at, StockingRequest.species, Water.status]
    constants:
      STOCKING_UNIT: 25
    input_set_filter: "StockingRequests attached to this plan in status QUEUED"
    formula: |
      # 0. eligibility — ineligible requests are DENIED and never consume pool
      eligible = [r for r in queued if r.species == plan.species and r.water.status == ACTIVE]
      if eligible is empty: reject the whole run with ERR_NO_ELIGIBLE_REQUESTS (nothing is mutated)

      # 1. deterministic ordering
      order by priority_score DESC, then requested_count ASC, then created_at ASC

      # 2. sub-pool reserved for public requesters
      public_pool = floor(available_count * public_request_cap_pct)

      remaining = available_count
      for r in order:
          if allocation_mode == PRIORITY_WATERFALL:
              raw = min(r.requested_count, remaining)
          else:  # PROPORTIONAL
              raw = min(r.requested_count,
                        floor(available_count * r.requested_count / sum(requested_count of eligible)),
                        remaining)
          if r.requester_kind == PUBLIC:
              raw = min(raw, public_pool)
          grant = floor(raw / STOCKING_UNIT) * STOCKING_UNIT     # whole transport units only
          if r.requester_kind == PUBLIC:
              public_pool -= grant
          remaining -= grant
          r.allocated_count = grant
          r.status = ALLOCATED if grant > 0 else DEFERRED
      allocated_total_count = available_count - remaining
      unmet_demand_count = sum(r.requested_count - r.allocated_count for r in eligible)
      public_allocated_count = sum(r.allocated_count for r in eligible if r.requester_kind == PUBLIC)
    ordering_note: |
      The unit rounding happens BEFORE the pool is decremented, so the pounds
      rounded away stay available for the next request in line — a request asking
      for 640 fish takes 625 from a 1000-fish pool and leaves 375, not 360.
      PROPORTIONAL deliberately leaves the rounding remainder unallocated: it is a
      fair-share mode, not a fill mode, and no second pass redistributes it.
    variants:
      PRIORITY_WATERFALL: "each request in priority order takes everything it asked for that the pool can still cover"
      PROPORTIONAL: "each request is capped at its pro-rata share of the original pool, and the remainder is left unallocated"
    variant_selector: "AllocationPlan.allocation_mode, chosen at plan creation"
    precision: "integer fish counts; every grant is a multiple of STOCKING_UNIT"
    worked_example: |
      available_count 1000, public_request_cap_pct 0.20 → public_pool 200. Three
      eligible requests in priority order: A 640 BIOLOGIST, B 300 PUBLIC, C 210 BIOLOGIST.
      PRIORITY_WATERFALL: A raw 640 → grant 625, remaining 375; B raw min(300, 375, 200)
      = 200 → grant 200, remaining 175, public_pool 0; C raw min(210, 175) = 175 →
      grant 175, remaining 0. allocated_total_count 1000, unmet_demand_count
      15 + 100 + 35 = 150.
      PROPORTIONAL on the same set (sum requested 1150): A floor(1000*640/1150) = 556
      → grant 550; B min(260, 200) = 200 → grant 200; C floor(1000*210/1150) = 182 →
      grant 175. allocated_total_count 925 — the 75-fish remainder is NOT redistributed.

  - name: transport_load_plan
    algorithm_type: threshold
    description: "How many fish one transport unit may legally carry on a given trip: the tightest of tank water volume, oxygen delivery and the unit's rated load, derated for warm water."
    inputs: [TransportUnit.tank_gallons, TransportUnit.max_load_lbs, TransportUnit.oxygen_lpm, RearingLot.avg_weight_g, StockingEvent.load_water_temp_c]
    constants:
      TRANSPORT_BASE_DENSITY_LB_PER_GAL: 0.50
      WARM_WATER_TEMP_C: 15.0
      WARM_WATER_DERATE: 0.80
      OXYGEN_LPM_PER_LB: 0.015
      GRAMS_PER_LB: 453.592
    formula: |
      avg_weight_lbs = RearingLot.avg_weight_g / GRAMS_PER_LB
      density_lb_per_gal = TRANSPORT_BASE_DENSITY_LB_PER_GAL
                           * (WARM_WATER_DERATE if load_water_temp_c > WARM_WATER_TEMP_C else 1.0)
      volume_limit_lbs  = round(tank_gallons * density_lb_per_gal, 2)
      oxygen_limit_lbs  = round(oxygen_lpm / OXYGEN_LPM_PER_LB, 2)
      gross_capacity_lbs = min(volume_limit_lbs, oxygen_limit_lbs, max_load_lbs)
      max_fish_allowed = floor(gross_capacity_lbs / avg_weight_lbs)
      planned_load_lbs = round(fish_count * avg_weight_lbs, 2)
      oxygen_flow_lpm  = round(planned_load_lbs * OXYGEN_LPM_PER_LB, 3)
    boundary_notes: |
      The warm-water derate applies only ABOVE WARM_WATER_TEMP_C: 15.0 °C exactly
      carries the full density, 15.1 °C is derated. Which of the three limits binds
      is data-dependent, and the error the caller sees names the fish count, not the
      binding limit.
    precision: "pounds 2 dp, oxygen 3 dp, max_fish_allowed floor to a whole fish"
    worked_example: |
      tank_gallons 500, max_load_lbs 300, oxygen_lpm 12.0, avg_weight_g 45.3592
      (avg_weight_lbs 0.1). At load_water_temp_c 12.0: volume_limit 250.00,
      oxygen_limit 800.00, so gross_capacity_lbs 250.00 and max_fish_allowed 2500.
      At exactly 15.0 °C the answer is unchanged (2500). At 18.0 °C: volume_limit
      200.00 → gross_capacity_lbs 200.00 and max_fish_allowed 2000.
      Loading 2400 fish: planned_load_lbs = round(2400 * 0.1, 2) = 240.00 and
      oxygen_flow_lpm = round(240.00 * 0.015, 3) = 3.6.

  - name: acclimation_requirement
    algorithm_type: threshold
    description: "Minutes of tempering required before release, from the gap between truck water and receiving water."
    inputs: [StockingEvent.load_water_temp_c, StockingEvent.site_water_temp_c]
    constants:
      ACCLIM_DEGREE_STEP: 1.0
      ACCLIM_MINUTES_PER_STEP: 6
      MAX_TEMP_DELTA_C: 10.0
    formula: |
      temp_delta_c = round(abs(site_water_temp_c - load_water_temp_c), 2)
      if temp_delta_c > MAX_TEMP_DELTA_C: reject with ERR_TEMP_DELTA_EXCEEDED
      acclimation_minutes_required = ceil(temp_delta_c / ACCLIM_DEGREE_STEP) * ACCLIM_MINUTES_PER_STEP
      # tempering_minutes < acclimation_minutes_required  → ERR_ACCLIMATION_INSUFFICIENT
    boundary_notes: "A delta of exactly MAX_TEMP_DELTA_C is releasable (60 minutes); 10.01 °C is refused. A zero delta requires zero minutes. The ceiling means a 7.5 °C gap costs the same as an 8.0 °C gap."
    precision: "delta 2 dp; minutes are whole and always a multiple of ACCLIM_MINUTES_PER_STEP"
    worked_example: "load_water_temp_c 12.0 and site_water_temp_c 4.5 → temp_delta_c 7.5, acclimation_minutes_required = ceil(7.5 / 1.0) * 6 = 48."

  - name: transport_cost
    algorithm_type: tiered_pricing
    description: "Cost committed against the hatchery's appropriation when an event is scheduled."
    inputs: [StockingEvent.planned_load_lbs]
    constants:
      TRANSPORT_BASE_CENTS: 45000
      COST_PER_LB_CENTS: 150
    formula: |
      transport_cost_cents = TRANSPORT_BASE_CENTS + ceil(planned_load_lbs * COST_PER_LB_CENTS)
      # committed at POST /stocking-events, moved from committed to spent at release,
      # released back to available at abort
    precision: "integer cents; the per-pound term is ceilinged so a fractional cent always rounds up"
    worked_example: "planned_load_lbs 240.00 → 45000 + ceil(240.00 * 150) = 45000 + 36000 = 81000."

  - name: contribution_index
    algorithm_type: weighted_scoring
    description: "Fraction of a marked release that came back, reported under two evaluation conventions used by fisheries programs."
    inputs: [StockingEvent.mark_type, StockingEvent.marked_count, StockingEvent.released_count, StockingEvent.recovered_count, StockingEvent.creel_sample_fraction]
    constants:
      TAG_LOSS_AD_CLIP: 0.02
      TAG_LOSS_CWT: 0.05
      TAG_LOSS_PIT: 0.01
    formula: |
      tag_loss = TAG_LOSS_AD_CLIP | TAG_LOSS_CWT | TAG_LOSS_PIT, selected from mark_type
      effective_marked_count = round(marked_count * (1 - tag_loss))
    variants:
      COHORT: |
        contribution_index = round(recovered_count / effective_marked_count, 4)
        # marks recovered per mark that survived tagging — the biologist's number
      HARVEST: |
        contribution_index = round((recovered_count / creel_sample_fraction) / released_count, 4)
        # expands the creel census to the whole fishery, then divides by every fish released
    variant_selector: "Both variants are computed and stored on every recovery report: StockingEvent.contribution_index_cohort and StockingEvent.contribution_index_harvest. There is no selector field — the two are reported side by side and disagree whenever creel coverage is partial or part of the release went unmarked."
    precision: "4 decimal places, ROUND_HALF_UP; both variants are null until recovered_count > 0"
    worked_example: |
      mark_type CWT, marked_count 2000 → effective_marked_count = round(2000 * 0.95) = 1900.
      With released_count 2380, recovered_count 57 and creel_sample_fraction 0.25:
      COHORT = round(57 / 1900, 4) = 0.03, HARVEST = round((57 / 0.25) / 2380, 4) = 0.0958.

  - name: effluent_compliance
    algorithm_type: threshold
    description: "Classifies a discharge sample and maintains the rolling exceedance count that drives the station's posture."
    inputs: [EffluentReading.tss_mg_l, EffluentReading.total_phosphorus_mg_l, EffluentReading.sampled_at, Hatchery.tss_permit_limit_mg_l]
    constants:
      TP_LIMIT_MG_L: 0.10
      EXCEEDANCE_WINDOW_DAYS: 90
    formula: |
      status = EXCEEDANCE if (tss_mg_l > Hatchery.tss_permit_limit_mg_l
                              or total_phosphorus_mg_l > TP_LIMIT_MG_L) else COMPLIANT
      exceedance_margin_mg_l = round(max(0, tss_mg_l - Hatchery.tss_permit_limit_mg_l), 3)
      Hatchery.exceedance_count_rolling = count of this hatchery's EffluentReadings with
          status EXCEEDANCE and sampled_at > current_utc - EXCEEDANCE_WINDOW_DAYS days
    boundary_notes: "A sample exactly at the permit limit is COMPLIANT (the comparison is strictly greater). The rolling window boundary is exclusive at its old edge, so a reading sampled exactly EXCEEDANCE_WINDOW_DAYS ago has aged out."
    precision: "margin 3 dp; counts are integers"
    worked_example: "tss_permit_limit_mg_l 20.0 with tss_mg_l 20.0 → COMPLIANT, margin 0.0. With tss_mg_l 26.5 → EXCEEDANCE, exceedance_margin_mg_l 6.5. A second EXCEEDANCE inside 90 days makes exceedance_count_rolling 2 and the posture FROZEN."

  - name: water_plan_shortfall
    algorithm_type: aggregation
    description: "How far a water still is from its management-plan target once allocations and actual releases are counted."
    inputs: [Water.plan_target_count, Water.released_count_ytd, Water.allocated_count_ytd]
    formula: |
      plan_shortfall_count = max(0, plan_target_count - released_count_ytd - allocated_count_ytd)
      plan_fill_pct = round((released_count_ytd + allocated_count_ytd) / plan_target_count * 100, 2)
    recomputed_by:
      - "POST /allocation-plans/{id}/run (allocated_count_ytd rises)"
      - "POST /stocking-events/{id}/release (released_count_ytd rises, allocated_count_ytd falls by the fulfilled grant)"
      - "POST /stocking-events/{id}/abort (allocated_count_ytd falls)"
    precision: "integer count; percentage 2 dp"
    worked_example: "plan_target_count 2000 with allocated_count_ytd 2400 and released_count_ytd 0 → plan_shortfall_count 0 and plan_fill_pct 120.00."

  - name: stage_weight_gate
    algorithm_type: threshold
    description: "Minimum average weight a lot must reach before it may be advanced into the next rearing stage, and the growth arithmetic a feeding records."
    inputs: [RearingLot.avg_weight_g, RearingLot.rearing_stage]
    constants:
      STAGE_WEIGHT_GATE_FRY_G: 1.0
      STAGE_WEIGHT_GATE_FINGERLING_G: 4.0
      STAGE_WEIGHT_GATE_YEARLING_G: 45.0
    formula: |
      next_stage = FRY | FINGERLING | YEARLING, the single stage after rearing_stage
      gate_g = STAGE_WEIGHT_GATE_FRY_G | STAGE_WEIGHT_GATE_FINGERLING_G | STAGE_WEIGHT_GATE_YEARLING_G
      advance is allowed only when avg_weight_g >= gate_g, else ERR_STAGE_WEIGHT_NOT_MET
      growth_rate_g_per_day (recorded on each feeding) =
          round((avg_weight_g_after - avg_weight_g_before) / days_since_last_feeding, 4)
          where days_since_last_feeding = (fed_at - previous fed_at or lot.created_at) in whole days,
          and the rate is null when that span is 0 days
    boundary_notes: "The gate is inclusive: a lot at exactly 4.0 g may advance to FINGERLING, one at 3.99 g may not."
    precision: "growth rate 4 dp"
    worked_example: "A lot at avg_weight_g 45.3592 may advance to YEARLING (gate 45.0). Feeding on 2026-08-20 after a feeding on 2026-08-10 that left 4.53592 g, reporting avg_weight_g_after 45.3592: growth_rate_g_per_day = round((45.3592 - 4.53592) / 10, 4) = 4.0823."

# =============================================================================
# §1.4 Validation & Business-Rule Table
#
# Every write endpoint evaluates these rules in ascending priority order and
# returns the FIRST violation it meets. The ladder is total: when two rules are
# both violated the lower priority number always wins, so the error a caller
# sees is a deterministic function of the request, never of evaluation luck.
# =============================================================================
validation_priority_ladder:
  1:  "authentication — X-User-ID header present and non-blank"
  2:  "role authorisation — the acting role may call this endpoint at all"
  3:  "ownership / hatchery scope — the acting principal may touch THIS row"
  4:  "path resource existence — the {id} in the URL resolves"
  5:  "body foreign-key existence — each FK in the body resolves, left to right in declared input order"
  6:  "request shape — required fields present, types, enums, ranges, formats"
  7:  "optimistic concurrency — expected_<parent>_version matches"
  8:  "own-entity state — the row is in a state that permits this transition"
  9:  "cross-entity state — a related row is in a state that permits this transition"
  10: "business_safety — health, certification and withdrawal gates"
  11: "segregation of duties — the acting user is not the user who performed the prior step"
  12: "business_temporal — interval overlap and rest-buffer conflicts"
  13: "business_constraint — capacity, density and count ceilings"
  14: "business_referential — species and size-class agreement between rows"
  15: "business_fiscal — water-right and budget ceilings"

validations:

  # --- priority 1–2: authentication and role ---------------------------------
  - id: auth-header-present
    priority: 1
    category: authentication
    applies_to: "every endpoint"
    condition: "X-User-ID header is absent, empty or whitespace-only"
    error_id: ERR_UNAUTHENTICATED
    status: 401

  - id: role-permitted
    priority: 2
    category: authorization
    applies_to: "every endpoint"
    condition: "the acting role is not listed in the endpoint's allowed_roles"
    error_id: ERR_FORBIDDEN_ROLE
    status: 403

  # --- priority 3: scope and ownership --------------------------------------
  - id: hatchery-scope
    priority: 3
    category: authorization
    applies_to: "every HatcheryManager write, and GET /hatcheries/{id} plus GET /hatcheries/{id}/effluent-readings"
    condition: "the acting HatcheryManager's X-User-ID differs from the hatchery_id reached from the target row (directly, or via BroodStock, RearingLot, TransportUnit or AllocationPlan)"
    error_id: ERR_HATCHERY_SCOPE_VIOLATION
    status: 403
    note: "Scope is evaluated on a row that was found, so a URL naming a row that does not exist reports the priority-4 404 instead. A manager acting on another station's existing row always sees ERR_HATCHERY_SCOPE_VIOLATION, never a 404 and never a shape error."

  - id: request-ownership
    priority: 3
    category: authorization
    applies_to: "POST /stocking-requests/{id}/withdraw, POST /stocking-requests/{id}/attach-to-plan"
    condition: "X-User-ID differs from StockingRequest.requested_by_user_id and the acting role is not ProgramAdmin"
    error_id: ERR_NOT_REQUEST_OWNER
    status: 403

  # --- priority 4–5: existence ---------------------------------------------
  - id: path-entity-exists
    priority: 4
    category: existence
    applies_to: "every endpoint with a path parameter"
    condition: "the {id} does not resolve to a row of the addressed collection"
    error_id: "the collection's own 404 — ERR_HATCHERY_NOT_FOUND, ERR_WATER_NOT_FOUND, ERR_BROOD_STOCK_NOT_FOUND, ERR_SPAWN_EVENT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_TRANSPORT_UNIT_NOT_FOUND, ERR_EVENT_NOT_FOUND"
    status: 404

  - id: body-fk-exists
    priority: 5
    category: existence
    applies_to: "every endpoint whose input declares a foreign key"
    condition: "a foreign key in the body does not resolve; keys are checked left to right in the order the endpoint's input list declares them"
    error_id: "the referenced collection's own 404"
    status: 404
    note: "POST /stocking-events declares stocking_request_id, then lot_id, then transport_unit_id, so a body with three bad ids reports ERR_REQUEST_NOT_FOUND. Existence is checked before shape validation of the remaining scalar fields."

  # --- priority 6: request shape -------------------------------------------
  - id: request-shape
    priority: 6
    category: request_validation
    applies_to: "every write endpoint"
    condition: "a required field is missing or null, a type is wrong, an enum value is unrecognised, a number is out of its declared range, a string breaks its declared pattern, or an interval field pair is inverted (spawning_window_end <= spawning_window_start, scheduled_return_at <= scheduled_depart_at)"
    error_id: ERR_INVALID_REQUEST
    status: 400

  - id: station-code-unique
    priority: 6
    category: request_validation
    applies_to: "POST /hatcheries"
    condition: "station_code already exists on another hatchery"
    error_id: ERR_DUPLICATE_STATION_CODE
    status: 409

  # --- priority 7: optimistic concurrency ----------------------------------
  - id: occ-lot-version
    priority: 7
    category: concurrency
    applies_to: "POST /stocking-events"
    condition: "expected_lot_version != RearingLot.version"
    error_id: ERR_STALE_LOT_VERSION
    status: 412

  - id: occ-plan-version
    priority: 7
    category: concurrency
    applies_to: "POST /allocation-plans/{id}/run, POST /stocking-requests/{id}/attach-to-plan"
    condition: "expected_plan_version != AllocationPlan.version"
    error_id: ERR_STALE_PLAN_VERSION
    status: 412

  # --- priority 8: own-entity state ----------------------------------------
  - id: own-state-legal
    priority: 8
    category: state
    applies_to: "every action endpoint"
    condition: "the target row's current status has no transition for this trigger — a cancelled spawn event being taken, an aborted event being loaded or released, a released event being aborted, a CLOSED plan being run, a DENIED request being withdrawn, a lot at YEARLING being advanced again"
    error_id: ERR_INVALID_STATE
    status: 409
    note: "One carve-out: POST /health-inspections/{id}/record-treatment against an inspection in status FAILED_REPORTABLE reports ERR_PATHOGEN_NOT_TREATABLE (see pathogen-treatable) instead of ERR_INVALID_STATE, because the reason the transition is missing is exactly the reportable finding. Every other illegal from-status on that endpoint (SAMPLED, RETEST_DUE, PASSED, CERTIFIED) reports ERR_INVALID_STATE as usual."

  - id: spawn-window-open
    priority: 8
    category: state
    applies_to: "POST /brood-stocks/{id}/open-spawning-window"
    condition: "current_utc < spawning_window_start or current_utc >= spawning_window_end"
    error_id: ERR_SPAWN_WINDOW_CLOSED
    status: 409

  - id: inspection-not-open
    priority: 8
    category: state
    applies_to: "POST /health-inspections"
    condition: "another HealthInspection on the same lot is still in status SAMPLED or RETEST_DUE"
    error_id: ERR_INVALID_STATE
    status: 409

  # --- priority 9: cross-entity state --------------------------------------
  - id: brood-stock-spawning
    priority: 9
    category: cross_entity_state
    applies_to: "POST /spawn-events, POST /spawn-events/{id}/record-take"
    condition: "the parent BroodStock.status is not SPAWNING (READY, SUSPENDED or CLOSED)"
    error_id: ERR_BROOD_STOCK_NOT_SPAWNING
    status: 409
    pair: "(SpawnEvent, BroodStock) — a child write gated on the parent's state"

  - id: water-active
    priority: 9
    category: cross_entity_state
    applies_to: "POST /stocking-events/{id}/release"
    condition: "the Water reached through the StockingRequest is in status CLOSED"
    error_id: ERR_WATER_CLOSED
    status: 409
    pair: "(StockingEvent, Water) — a release gated on the destination's state"

  - id: hatchery-not-frozen
    priority: 9
    category: cross_entity_state
    applies_to: "POST /spawn-events, POST /spawn-events/{id}/record-take, POST /brood-stocks/{id}/open-spawning-window, POST /allocation-plans/{id}/run, POST /stocking-events/{id}/load"
    condition: "Hatchery.operating_posture == FROZEN"
    error_id: ERR_HATCHERY_FROZEN
    status: 409
    pair: "(SpawnEvent | StockingEvent | AllocationPlan, Hatchery) — production writes gated on the station's compliance posture"

  - id: hatchery-not-restricted
    priority: 9
    category: cross_entity_state
    applies_to: "POST /spawn-events"
    condition: "Hatchery.operating_posture == RESTRICTED"
    error_id: ERR_HATCHERY_RESTRICTED
    status: 409
    note: "Only new intake is blocked at RESTRICTED. Loading and releasing stay legal because they reduce standing crop, which is how a restricted station recovers."

  # --- priority 10: health and certification safety ------------------------
  - id: lot-certified
    priority: 10
    category: business_safety
    applies_to: "POST /stocking-events/{id}/load"
    condition: "RearingLot.health_status is UNDER_INSPECTION, RESTRICTED, or UNSCREENED with certificate_expires_at null (never certified)"
    error_id: ERR_LOT_NOT_CERTIFIED
    status: 422

  - id: lot-not-quarantined
    priority: 10
    category: business_safety
    applies_to: "POST /stocking-events, POST /stocking-events/{id}/load, POST /health-inspections/{id}/certify, POST /health-inspections/{id}/record-result"
    condition: "RearingLot.health_status == QUARANTINED"
    error_id: ERR_LOT_QUARANTINED
    status: 422
    note: "Reported ahead of ERR_LOT_NOT_CERTIFIED for a quarantined lot: quarantine is the more specific and more serious finding."

  - id: certificate-current
    priority: 10
    category: business_safety
    applies_to: "POST /stocking-events/{id}/load"
    condition: "RearingLot.certificate_expires_at is not null and current_utc > it"
    error_id: ERR_HEALTH_CERTIFICATE_EXPIRED
    status: 422
    boundary: "Loading exactly at certificate_expires_at is legal; one second later is not. Because the clock lapse leaves certificate_expires_at on the row, a lot whose certificate ran out reports ERR_HEALTH_CERTIFICATE_EXPIRED and is checked ahead of lot-certified inside priority 10; a lot that was never certified reports ERR_LOT_NOT_CERTIFIED."

  - id: withdrawal-cleared
    priority: 10
    category: business_safety
    applies_to: "POST /stocking-events/{id}/load, POST /health-inspections/{id}/record-result (from RETEST_DUE)"
    condition: "current_utc < the lot's latest HealthInspection.withdrawal_clears_at"
    error_id: ERR_WITHDRAWAL_PERIOD_ACTIVE
    status: 422

  - id: pathogen-treatable
    priority: 10
    category: business_safety
    applies_to: "POST /health-inspections/{id}/record-treatment"
    condition: "the inspection reached FAILED_REPORTABLE — a reportable pathogen may not be treated out"
    error_id: ERR_PATHOGEN_NOT_TREATABLE
    status: 422
    note: "This row is evaluated AHEAD of own-state-legal for POST /health-inspections/{id}/record-treatment, so a treatment attempt on a FAILED_REPORTABLE inspection reports the specific finding (422) rather than the generic ERR_INVALID_STATE (409). FAILED_REPORTABLE is terminal in every other respect."

  - id: temp-delta-safe
    priority: 10
    category: business_safety
    applies_to: "POST /stocking-events/{id}/release"
    condition: "abs(site_water_temp_c - load_water_temp_c) > MAX_TEMP_DELTA_C (10.0)"
    error_id: ERR_TEMP_DELTA_EXCEEDED
    status: 422

  - id: acclimation-sufficient
    priority: 10
    category: business_safety
    applies_to: "POST /stocking-events/{id}/release"
    condition: "tempering_minutes < calculations.acclimation_requirement.acclimation_minutes_required"
    error_id: ERR_ACCLIMATION_INSUFFICIENT
    status: 422

  # --- priority 11: segregation of duties ----------------------------------
  - id: certify-different-vet
    priority: 11
    category: segregation_of_duties
    applies_to: "POST /health-inspections/{id}/certify"
    condition: "X-User-ID == HealthInspection.sampled_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    note: "Both principals are FishHealthVeterinarians, so this is not a role check: it is the same role refused because it is the same person."

  # --- priority 12: temporal conflicts -------------------------------------
  - id: transport-unit-free
    priority: 12
    category: business_temporal
    applies_to: "POST /stocking-events/{id}/load"
    condition: "another StockingEvent in status SCHEDULED, IN_TRANSIT or RELEASED on the same TransportUnit has an intersecting trip interval, or the unit is OUT_OF_SERVICE"
    error_id: ERR_TRANSPORT_UNIT_UNAVAILABLE
    status: 409
    interval_semantics: "Two trips intersect when new.scheduled_depart_at < existing.scheduled_return_at AND existing.scheduled_depart_at < new.scheduled_return_at. Trips that merely touch (one returns exactly when the next departs) do NOT intersect."

  - id: water-rest-buffer
    priority: 12
    category: business_temporal
    applies_to: "POST /stocking-events/{id}/release"
    condition: "Water.last_release_at is set and current_utc < Water.last_release_at + WATER_REST_BUFFER_HOURS (48)"
    error_id: ERR_WATER_REST_BUFFER
    status: 409
    interval_semantics: "The buffer is measured forward from the last release and its far edge is inclusive: releasing exactly 48 hours later is allowed, 47:59:59 later is not."

  - id: oxygen-supply-adequate
    priority: 12
    category: business_temporal
    applies_to: "POST /stocking-events/{id}/load"
    condition: "the sum of oxygen_flow_lpm over this hatchery's events that are IN_TRANSIT with an intersecting trip interval, plus this event's own oxygen_flow_lpm, exceeds Hatchery.oxygen_supply_lpm"
    error_id: ERR_OXYGEN_SUPPLY_EXCEEDED
    status: 422
    note: "Aggregate temporal rule: each load is individually within its unit's oxygen rating, but the station's bulk supply is shared across trucks that are out at the same time."

  # --- priority 13: capacity and count ceilings ----------------------------
  - id: density-cap
    priority: 13
    category: business_constraint
    applies_to: "POST /rearing-lots/{id}/feedings"
    condition: "the density_index the hatchery would carry after this feeding exceeds DENSITY_HARD_CAP (1.0000)"
    error_id: ERR_DENSITY_CAP_EXCEEDED
    status: 422
    boundary: "A feeding that lands the station at exactly 1.0000 is accepted; 1.0100 is refused and nothing is written."

  - id: transport-capacity
    priority: 13
    category: business_constraint
    applies_to: "POST /stocking-events/{id}/load"
    condition: "fish_count > calculations.transport_load_plan.max_fish_allowed for the supplied load_water_temp_c"
    error_id: ERR_TRANSPORT_CAPACITY_EXCEEDED
    status: 422

  - id: lot-has-fish
    priority: 13
    category: business_constraint
    applies_to: "POST /stocking-events"
    condition: "fish_count > RearingLot.count_on_hand - RearingLot.reserved_count"
    error_id: ERR_LOT_INSUFFICIENT_FISH
    status: 422

  - id: brood-females-available
    priority: 13
    category: business_constraint
    applies_to: "POST /spawn-events"
    condition: "females_spawned > BroodStock.females_available"
    error_id: ERR_BROOD_FEMALES_INSUFFICIENT
    status: 422

  - id: event-within-allocation
    priority: 13
    category: business_constraint
    applies_to: "POST /stocking-events"
    condition: "fish_count > StockingRequest.allocated_count"
    error_id: ERR_ALLOCATION_EXCEEDED
    status: 422

  - id: stage-weight-met
    priority: 13
    category: business_constraint
    applies_to: "POST /rearing-lots/{id}/advance-stage"
    condition: "avg_weight_g < the target stage's weight gate"
    error_id: ERR_STAGE_WEIGHT_NOT_MET
    status: 422

  # --- priority 14: referential agreement ---------------------------------
  - id: species-agreement
    priority: 14
    category: business_referential
    applies_to: "POST /stocking-events"
    condition: "RearingLot.species != StockingRequest.species"
    error_id: ERR_SPECIES_MISMATCH
    status: 422

  - id: size-class-agreement
    priority: 14
    category: business_referential
    applies_to: "POST /stocking-requests/{id}/attach-to-plan"
    condition: "StockingRequest.size_class != AllocationPlan.size_class"
    error_id: ERR_SIZE_CLASS_MISMATCH
    status: 422

  - id: eligible-candidate-set
    priority: 14
    category: business_referential
    applies_to: "POST /allocation-plans/{id}/run"
    condition: "no attached StockingRequest is in status QUEUED, or every queued request is ineligible on species or a closed water"
    error_id: ERR_NO_ELIGIBLE_REQUESTS
    status: 422
    boundary: "An empty candidate set aborts the whole run: the plan stays DRAFT, its version does not advance and no request changes status."

  # --- priority 15: fiscal ceilings ---------------------------------------
  - id: water-right-ceiling
    priority: 15
    category: business_fiscal
    applies_to: "POST /spawn-events, POST /spawn-events/{id}/record-take"
    condition: "the acre-feet this take would reserve or consume exceed Hatchery.water_available_af (plus, at record-take, the reservation this event already holds)"
    error_id: ERR_WATER_RIGHT_EXCEEDED
    status: 422

  - id: budget-ceiling
    priority: 15
    category: business_fiscal
    applies_to: "POST /stocking-events"
    condition: "transport_cost_cents > Hatchery.budget_available_cents"
    error_id: ERR_BUDGET_EXCEEDED
    status: 422

validation_conflict_pairs:
  - name: state-beats-safety
    lower_priority_rule: "lot-not-quarantined (priority 10, ERR_LOT_QUARANTINED)"
    higher_priority_rule: "own-state-legal (priority 8, ERR_INVALID_STATE)"
    scenario: "Loading an already-ABORTED StockingEvent whose RearingLot has since been QUARANTINED violates both rules. The response is ERR_INVALID_STATE (409), never ERR_LOT_QUARANTINED (422)."

  - name: temporal-beats-constraint
    lower_priority_rule: "transport-capacity (priority 13, ERR_TRANSPORT_CAPACITY_EXCEEDED)"
    higher_priority_rule: "transport-unit-free (priority 12, ERR_TRANSPORT_UNIT_UNAVAILABLE)"
    scenario: "A load whose trip overlaps another trip on the same unit AND whose fish_count exceeds the warm-water load plan reports ERR_TRANSPORT_UNIT_UNAVAILABLE (409), never ERR_TRANSPORT_CAPACITY_EXCEEDED (422)."

  - name: safety-beats-fiscal
    lower_priority_rule: "budget-ceiling (priority 15, ERR_BUDGET_EXCEEDED)"
    higher_priority_rule: "lot-not-quarantined (priority 10, ERR_LOT_QUARANTINED)"
    scenario: "Creating an event against a QUARANTINED lot with a cost the appropriation cannot absorb reports ERR_LOT_QUARANTINED (422), never ERR_BUDGET_EXCEEDED."

conserved_quantities:
  - name: fish-count-conservation
    invariant: "RearingLot.initial_count == count_on_hand + reserved_count + cumulative_mortality_count + (fish already released out of this lot)"
    compensating_pair: "POST /stocking-events (reserves) ⇄ POST /stocking-events/{id}/abort (restores). After an abort, count_on_hand and reserved_count read exactly as they did before the event was created, and the request's allocated_count and the water's allocated_count_ytd are restored too."

  - name: water-right-conservation
    invariant: "Hatchery.annual_water_right_af == water_available_af + water_reserved_af + water_used_af"
    compensating_pair: "POST /spawn-events (reserves acre-feet) ⇄ POST /spawn-events/{id}/cancel (returns them). The identity holds after the reservation, after the cancellation and after a take converts reserved acre-feet into used acre-feet."

  - name: budget-conservation
    invariant: "Hatchery.annual_budget_cents == budget_available_cents + budget_committed_cents + budget_spent_cents"
    compensating_pair: "POST /stocking-events (commits transport_cost_cents) ⇄ POST /stocking-events/{id}/abort (releases it). A release instead moves the same cents from committed to spent, so the identity never drifts."

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat collections under the root prefix. Every path placeholder is literally
# {id}. Every list endpoint accepts limit?/offset? and returns the §1.0
# pagination fields. RearingLot has no create endpoint: lots come into existence
# only as a side effect of recording a spawn take.
# =============================================================================
endpoints:

  # --- logical clock --------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    name: set_current_utc
    purpose: "Test-driving endpoint for the logical clock. Every temporal rule in this API reads this clock, never wall time."
    roles: [ProgramAdmin]
    input: [current_utc]
    output: { current_utc: datetime }
    default_clock: "2026-08-01T00:00:00Z — the clock every scenario starts from when it is never set"
    side_effects:
      - "current_utc is stored; it may move forward or backward"
      - "recomputes Hatchery.exceedance_count_rolling and operating_posture for every hatchery, which may suspend or resume BroodStocks"
      - "expires lapsed health certificates: RearingLot.health_status CERTIFIED → UNSCREENED once current_utc > certificate_expires_at"
      - "closes BroodStocks whose spawning_window_end has passed"
      - "takes TransportUnits OUT_OF_SERVICE once current_utc >= certification_expires_at"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  # --- hatcheries -----------------------------------------------------------
  - method: POST
    path: /hatcheries
    name: create_hatchery
    purpose: "Register a hatchery station with its water right, rearing capacity, discharge permit and appropriation."
    roles: [ProgramAdmin]
    input: [name, station_code, water_source_type, annual_water_right_af, rearing_capacity_lbs, oxygen_supply_lpm, effluent_permit_number, tss_permit_limit_mg_l, annual_budget_cents]
    output: Hatchery
    side_effects:
      - "water_reserved_af 0, water_used_af 0, water_available_af = annual_water_right_af"
      - "biomass_on_hand_lbs 0, density_index 0, exceedance_count_rolling 0, operating_posture OPEN"
      - "budget_committed_cents 0, budget_spent_cents 0, budget_available_cents = annual_budget_cents"
      - "the hatchery's id is the X-User-ID a HatcheryManager must present to act on it"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_STATION_CODE]

  - method: GET
    path: /hatcheries/{id}
    name: get_hatchery
    purpose: "Read a station with its live water, biomass, posture and budget ledgers."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: []
    output: Hatchery
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_HATCHERY_NOT_FOUND]

  - method: GET
    path: /hatcheries/{id}/effluent-readings
    name: list_hatchery_effluent_readings
    purpose: "Discharge-monitoring record for a station, newest sample first."
    roles: [ProgramAdmin, HatcheryManager]
    input: ["status?", "limit?", "offset?"]
    output: EffluentReading[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_HATCHERY_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: /effluent-readings
    name: create_effluent_reading
    purpose: "Log a discharge sample; the reading classifies itself and may freeze the station."
    roles: [HatcheryManager, ProgramAdmin]
    input: [hatchery_id, sampled_at, tss_mg_l, total_phosphorus_mg_l, flow_af]
    output: EffluentReading
    side_effects:
      - "status and exceedance_margin_mg_l computed per calculations.effluent_compliance"
      - "Hatchery.water_used_af += flow_af; water_available_af recomputed"
      - "Hatchery.exceedance_count_rolling recomputed over EXCEEDANCE_WINDOW_DAYS"
      - "Hatchery.operating_posture recomputed — a second exceedance inside the window freezes the station and cascades into BroodStocks and their PLANNED SpawnEvents"
      - "the row is immutable once written (common_fields: false — no version, no update endpoint)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_HATCHERY_NOT_FOUND, ERR_INVALID_REQUEST]

  # --- waters ---------------------------------------------------------------
  - method: POST
    path: /waters
    name: create_water
    purpose: "Register a stocking destination with its management-plan target, habitat suitability and angler demand."
    roles: [ProgramAdmin]
    input: [name, county, water_class, habitat_suitability_score, angler_demand_index, plan_species, plan_target_count, access_type]
    output: Water
    side_effects:
      - "allocated_count_ytd 0, released_count_ytd 0, last_release_at null, status ACTIVE"
      - "plan_shortfall_count = plan_target_count and plan_fill_pct 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /waters/{id}
    name: get_water
    purpose: "Read a water with its year-to-date allocation and release counters."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist, PublicRequester]
    input: []
    output: Water
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WATER_NOT_FOUND]

  - method: GET
    path: /waters
    name: list_waters
    purpose: "Browse stocking destinations."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist, PublicRequester]
    input: ["status?", "plan_species?", "county?", "limit?", "offset?"]
    output: Water[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /waters/{id}/close
    name: close_water
    purpose: "Retire a water from stocking."
    roles: [ProgramAdmin]
    input: []
    output: Water
    side_effects:
      - "status = CLOSED; releases into this water are refused with ERR_WATER_CLOSED"
      - "queued requests naming this water become ineligible and are DENIED by the next allocation run"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WATER_NOT_FOUND, ERR_INVALID_STATE]

  # --- brood stocks ---------------------------------------------------------
  - method: POST
    path: /brood-stocks
    name: create_brood_stock
    purpose: "Register a brood group with its spawning window and egg-take target."
    roles: [HatcheryManager, ProgramAdmin]
    input: [hatchery_id, species, strain, female_count, male_count, expected_fecundity_per_female, spawning_window_start, spawning_window_end, egg_take_target]
    output: BroodStock
    side_effects:
      - "status READY; females_reserved 0, females_spent 0, females_available = female_count; cumulative_eggs_taken 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_HATCHERY_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /brood-stocks/{id}
    name: get_brood_stock
    purpose: "Read a brood group with its female ledger."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: []
    output: BroodStock
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_BROOD_STOCK_NOT_FOUND]

  - method: GET
    path: /brood-stocks
    name: list_brood_stocks
    purpose: "Brood groups, filterable by station, species and status."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: ["hatchery_id?", "species?", "status?", "limit?", "offset?"]
    output: BroodStock[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /brood-stocks/{id}/open-spawning-window
    name: open_spawning_window
    purpose: "Declare the group ripe so takes may be planned against it."
    roles: [HatcheryManager]
    input: []
    output: BroodStock
    side_effects:
      - "status READY → SPAWNING; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_BROOD_STOCK_NOT_FOUND, ERR_INVALID_STATE, ERR_SPAWN_WINDOW_CLOSED, ERR_HATCHERY_FROZEN]

  # --- spawn events ---------------------------------------------------------
  - method: POST
    path: /spawn-events
    name: create_spawn_event
    purpose: "Plan an egg take: reserves females and the acre-feet the incubation will consume, and projects the release the take can support."
    roles: [HatcheryManager]
    input: [brood_stock_id, planned_take_date, females_spawned, target_release_count]
    output: SpawnEvent
    side_effects:
      - "status PLANNED; planned_eggs = females_spawned * BroodStock.expected_fecundity_per_female"
      - "cumulative_survival, required_eggs_for_target and projected_release_count computed per calculations.egg_take_projection, with the density derate tier taken from the hatchery's density_index AS IT STANDS NOW"
      - "water_reserved_af computed and added to Hatchery.water_reserved_af; Hatchery.water_available_af recomputed"
      - "BroodStock.females_reserved += females_spawned; females_available recomputed; BroodStock.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_BROOD_STOCK_NOT_FOUND, ERR_INVALID_REQUEST, ERR_BROOD_STOCK_NOT_SPAWNING, ERR_HATCHERY_FROZEN, ERR_HATCHERY_RESTRICTED, ERR_BROOD_FEMALES_INSUFFICIENT, ERR_WATER_RIGHT_EXCEEDED]

  - method: GET
    path: /spawn-events/{id}
    name: get_spawn_event
    purpose: "Read a planned or completed take with its survival projection."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: []
    output: SpawnEvent
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_SPAWN_EVENT_NOT_FOUND]

  - method: GET
    path: /spawn-events
    name: list_spawn_events
    purpose: "Takes, filterable by brood group and status."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: ["brood_stock_id?", "status?", "limit?", "offset?"]
    output: SpawnEvent[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /spawn-events/{id}/record-take
    name: record_spawn_take
    purpose: "Record the eggs actually taken, converting the water reservation into consumption and creating the rearing lot."
    roles: [HatcheryManager]
    input: [eggs_taken, taken_at]
    output: SpawnEvent
    side_effects:
      - "status PLANNED → TAKEN"
      - "BroodStock.females_reserved -= females_spawned; females_spent += females_spawned; cumulative_eggs_taken += eggs_taken; version += 1"
      - "Hatchery.water_reserved_af -= this event's water_reserved_af; water_used_af += round(eggs_taken / 1000 * WATER_AF_PER_1000_EGGS, 4)"
      - "creates one RearingLot at rearing_stage EGG, health_status UNSCREENED, initial_count = eggs_taken, avg_weight_g = EGG_WEIGHT_G"
      - "Hatchery.biomass_on_hand_lbs, density_index and operating_posture recomputed"
      - "BroodStock → CLOSED when cumulative_eggs_taken >= egg_take_target"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_SPAWN_EVENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_BROOD_STOCK_NOT_SPAWNING, ERR_HATCHERY_FROZEN, ERR_WATER_RIGHT_EXCEEDED]

  - method: POST
    path: /spawn-events/{id}/cancel
    name: cancel_spawn_event
    purpose: "Unwind a planned take, returning females and acre-feet exactly."
    roles: [HatcheryManager, ProgramAdmin]
    input: []
    output: SpawnEvent
    side_effects:
      - "status PLANNED → CANCELLED"
      - "BroodStock.females_reserved -= females_spawned; females_available recomputed; version += 1"
      - "Hatchery.water_reserved_af -= water_reserved_af; water_available_af recomputed; operating_posture recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_SPAWN_EVENT_NOT_FOUND, ERR_INVALID_STATE]

  # --- rearing lots ---------------------------------------------------------
  - method: GET
    path: /rearing-lots/{id}
    name: get_rearing_lot
    purpose: "Read a lot's growth, feed-conversion and health state, plus the version an event creation must quote."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: []
    output: RearingLot
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_LOT_NOT_FOUND]

  - method: GET
    path: /rearing-lots
    name: list_rearing_lots
    purpose: "Lots on hand, filterable by station, originating take, stage and health status. This is how a lot created by a spawn take is discovered."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: ["hatchery_id?", "spawn_event_id?", "rearing_stage?", "health_status?", "species?", "limit?", "offset?"]
    output: RearingLot[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /rearing-lots/{id}/feedings
    name: record_feeding
    purpose: "Record a feeding period: feed delivered, the new mean weight and the mortality since the last feeding. Recomputes both feed-conversion variants and the station's density."
    roles: [HatcheryManager]
    input: [fed_at, feed_lbs, avg_weight_g_after, "mortality_count?"]
    output: RearingLot
    side_effects:
      - "count_on_hand -= mortality_count (default 0); cumulative_mortality_count += mortality_count"
      - "avg_weight_g = avg_weight_g_after; growth_rate_g_per_day recomputed; biomass_lbs recomputed"
      - "cumulative_mortality_biomass_lbs += round(mortality_count * avg_weight_g_after / GRAMS_PER_LB, 2)"
      - "cumulative_feed_lbs += feed_lbs; fcr_biological and fcr_economic recomputed (both variants, always)"
      - "Hatchery.biomass_on_hand_lbs, density_index and operating_posture recomputed"
      - "rearing_stage → TERMINATED when the lot has no fish left; version += 1"
      - "refused in whole, with nothing written, when the resulting density_index would exceed DENSITY_HARD_CAP"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_DENSITY_CAP_EXCEEDED]

  - method: POST
    path: /rearing-lots/{id}/advance-stage
    name: advance_rearing_stage
    purpose: "Move a lot into the next rearing stage once it has made weight."
    roles: [HatcheryManager]
    input: [to_stage]
    output: RearingLot
    side_effects:
      - "rearing_stage advances by exactly one step; health_status is untouched"
      - "version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_STAGE_WEIGHT_NOT_MET]

  # --- health inspections ---------------------------------------------------
  - method: POST
    path: /health-inspections
    name: create_health_inspection
    purpose: "Open a fish-health inspection on a lot; the sampling veterinarian is recorded for segregation of duties."
    roles: [FishHealthVeterinarian]
    input: [lot_id, inspection_type, sample_size, sampled_at]
    output: HealthInspection
    side_effects:
      - "status SAMPLED; sampled_by_user_id = X-User-ID; retest_count 0"
      - "RearingLot.health_status → UNDER_INSPECTION and RearingLot.certificate_expires_at = null, withdrawing any standing certificate outright; RearingLot.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_LOT_QUARANTINED]

  - method: GET
    path: /health-inspections/{id}
    name: get_health_inspection
    purpose: "Read an inspection with its retest history, withdrawal window and certificate."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: []
    output: HealthInspection
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSPECTION_NOT_FOUND]

  - method: GET
    path: /health-inspections
    name: list_health_inspections
    purpose: "Inspections, filterable by lot, type and status."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: ["lot_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: HealthInspection[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /health-inspections/{id}/record-result
    name: record_inspection_result
    purpose: "Record a laboratory result. A reportable pathogen quarantines the lot and unwinds every scheduled release from it."
    roles: [FishHealthVeterinarian]
    input: [result, "pathogen_code?"]
    output: HealthInspection
    side_effects:
      - "NEGATIVE → status PASSED"
      - "POSITIVE_TREATABLE → status FAILED_TREATABLE and RearingLot.health_status RESTRICTED, unless retest_count has already reached MAX_RETESTS, in which case the finding escalates to FAILED_REPORTABLE with escalated_from_retests true"
      - "POSITIVE_REPORTABLE → status FAILED_REPORTABLE"
      - "on FAILED_REPORTABLE: RearingLot.health_status QUARANTINED, then every StockingEvent on the lot in status SCHEDULED or IN_TRANSIT is ABORTED (restoring reserved_count, releasing budget_committed_cents and freeing the TransportUnit), then each aborted event's StockingRequest returns to DEFERRED with allocated_count 0, then each affected Water's allocated_count_ytd, plan_shortfall_count and plan_fill_pct are recomputed"
      - "version += 1 on the inspection and on every row the cascade touches"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSPECTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_LOT_QUARANTINED, ERR_WITHDRAWAL_PERIOD_ACTIVE]

  - method: POST
    path: /health-inspections/{id}/record-treatment
    name: record_inspection_treatment
    purpose: "Record the treatment applied to a treatable finding and open the drug-withdrawal window."
    roles: [FishHealthVeterinarian]
    input: [treatment_code, withdrawal_days, treatment_completed_at]
    output: HealthInspection
    side_effects:
      - "status FAILED_TREATABLE → RETEST_DUE; retest_count += 1"
      - "withdrawal_clears_at = treatment_completed_at + withdrawal_days days — loading is refused until the clock reaches it"
      - "version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSPECTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_PATHOGEN_NOT_TREATABLE]

  - method: POST
    path: /health-inspections/{id}/certify
    name: certify_health_inspection
    purpose: "Sign the health certificate that makes the lot transferable. Must be a different veterinarian than the one who sampled."
    roles: [FishHealthVeterinarian]
    input: []
    output: HealthInspection
    side_effects:
      - "status PASSED → CERTIFIED; certified_by_user_id = X-User-ID; certified_at = current_utc"
      - "certificate_expires_at = certified_at + CERT_VALID_DAYS days"
      - "RearingLot.health_status = CERTIFIED and RearingLot.certificate_expires_at = the certificate's expiry; RearingLot.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSPECTION_NOT_FOUND, ERR_INVALID_STATE, ERR_LOT_QUARANTINED, ERR_SEGREGATION_OF_DUTIES]

  # --- stocking requests ----------------------------------------------------
  - method: POST
    path: /stocking-requests
    name: create_stocking_request
    purpose: "Intake a stocking request from a regional biologist or a member of the public; the priority score is computed and frozen at intake."
    roles: [RegionalBiologist, PublicRequester]
    input: [water_id, species, requested_count, size_class, justification]
    output: StockingRequest
    side_effects:
      - "requester_kind = BIOLOGIST for a RegionalBiologist and PUBLIC for a PublicRequester — it is never accepted from the body"
      - "requested_by_user_id = X-User-ID; status SUBMITTED; allocated_count 0; allocation_plan_id null"
      - "priority_score computed per calculations.stocking_request_priority_score from the water's CURRENT counters and frozen on the row"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WATER_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /stocking-requests/{id}
    name: get_stocking_request
    purpose: "Read a request with its score, grant and status."
    roles: [ProgramAdmin, HatcheryManager, RegionalBiologist, PublicRequester]
    input: []
    output: StockingRequest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REQUEST_NOT_FOUND]

  - method: GET
    path: /stocking-requests
    name: list_stocking_requests
    purpose: "Requests, filterable by water, plan, status, requester kind and species."
    roles: [ProgramAdmin, HatcheryManager, RegionalBiologist, PublicRequester]
    input: ["water_id?", "allocation_plan_id?", "status?", "requester_kind?", "species?", "limit?", "offset?"]
    output: StockingRequest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /stocking-requests/{id}/withdraw
    name: withdraw_stocking_request
    purpose: "Withdraw a request that has not yet been fulfilled."
    roles: [RegionalBiologist, PublicRequester, ProgramAdmin]
    input: []
    output: StockingRequest
    side_effects:
      - "status → WITHDRAWN from SUBMITTED, QUEUED or DEFERRED; version += 1"
      - "a withdrawn request is no longer a candidate for its plan's next run"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOT_REQUEST_OWNER, ERR_REQUEST_NOT_FOUND, ERR_INVALID_STATE]

  - method: POST
    path: /stocking-requests/{id}/attach-to-plan
    name: attach_request_to_plan
    purpose: "Queue a request on an allocation plan. Attaching to a plan that has already run sends that plan back to DRAFT."
    roles: [RegionalBiologist, ProgramAdmin]
    input: [allocation_plan_id, expected_plan_version]
    output: StockingRequest
    side_effects:
      - "status SUBMITTED or DEFERRED → QUEUED; allocation_plan_id set; deferral_reason cleared; version += 1"
      - "AllocationPlan.version += 1"
      - "an ALLOCATED plan returns to DRAFT and every request it had resolved returns to QUEUED with allocated_count 0, releasing the corresponding Water.allocated_count_ytd"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOT_REQUEST_OWNER, ERR_REQUEST_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_PLAN_VERSION, ERR_INVALID_STATE, ERR_SIZE_CLASS_MISMATCH]

  # --- allocation plans -----------------------------------------------------
  - method: POST
    path: /allocation-plans
    name: create_allocation_plan
    purpose: "Open a production pool for one species and size class, with a reserved share for public requests."
    roles: [ProgramAdmin]
    input: [hatchery_id, fiscal_year, species, size_class, available_count, public_request_cap_pct, "allocation_mode?"]
    output: AllocationPlan
    side_effects:
      - "status DRAFT; allocation_mode defaults to PRIORITY_WATERFALL when omitted"
      - "allocated_total_count 0, unmet_demand_count 0, public_allocated_count 0, run_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /allocation-plans/{id}
    name: get_allocation_plan
    purpose: "Read a plan with its allocation totals and the version a run must quote."
    roles: [ProgramAdmin, HatcheryManager, RegionalBiologist]
    input: []
    output: AllocationPlan
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_PLAN_NOT_FOUND]

  - method: GET
    path: /allocation-plans
    name: list_allocation_plans
    purpose: "Plans, filterable by station, fiscal year and status."
    roles: [ProgramAdmin, HatcheryManager, RegionalBiologist]
    input: ["hatchery_id?", "status?", "fiscal_year?", "limit?", "offset?"]
    output: AllocationPlan[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /allocation-plans/{id}/run
    name: run_allocation_plan
    purpose: "Resolve every queued request on the plan into whole-transport-unit grants, filling the highest-priority request first out of a finite pool with a reserved public share."
    roles: [ProgramAdmin]
    input: [expected_plan_version]
    output: AllocationPlan
    side_effects:
      - "status DRAFT → ALLOCATED; run_count += 1; version += 1"
      - "every eligible QUEUED request is resolved per calculations.allocation_grant to ALLOCATED (grant > 0) or DEFERRED (grant 0, deferral_reason POOL_EXHAUSTED); ineligible requests become DENIED with deferral_reason INELIGIBLE"
      - "allocated_total_count, unmet_demand_count and public_allocated_count recomputed"
      - "each granted request's Water.allocated_count_ytd += the grant; plan_shortfall_count and plan_fill_pct recomputed"
      - "nothing at all is written when no eligible candidate exists"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_PLAN_VERSION, ERR_INVALID_STATE, ERR_HATCHERY_FROZEN, ERR_NO_ELIGIBLE_REQUESTS]

  # --- transport units ------------------------------------------------------
  - method: POST
    path: /transport-units
    name: create_transport_unit
    purpose: "Register a stocking truck with its tank volume, rated load, oxygen delivery and hauling certification."
    roles: [ProgramAdmin, HatcheryManager]
    input: [hatchery_id, unit_code, tank_gallons, max_load_lbs, oxygen_lpm, certification_expires_at]
    output: TransportUnit
    side_effects:
      - "status AVAILABLE; current_event_id null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_HATCHERY_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /transport-units/{id}
    name: get_transport_unit
    purpose: "Read a truck with its availability and the event currently holding it."
    roles: [ProgramAdmin, HatcheryManager, RegionalBiologist]
    input: []
    output: TransportUnit
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_TRANSPORT_UNIT_NOT_FOUND]

  - method: GET
    path: /transport-units
    name: list_transport_units
    purpose: "Fleet, filterable by station, status and the event holding the unit."
    roles: [ProgramAdmin, HatcheryManager, RegionalBiologist]
    input: ["hatchery_id?", "status?", "current_event_id?", "limit?", "offset?"]
    output: TransportUnit[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  # --- stocking events ------------------------------------------------------
  - method: POST
    path: /stocking-events
    name: create_stocking_event
    purpose: "Schedule a stocking trip against a granted request: reserves fish out of the lot the caller has just read, books the truck's trip interval and commits the transport cost."
    roles: [HatcheryManager]
    input: [stocking_request_id, lot_id, transport_unit_id, fish_count, scheduled_depart_at, scheduled_return_at, expected_lot_version, "mark_type?", "marked_count?"]
    output: StockingEvent
    side_effects:
      - "status SCHEDULED; mark_type defaults to NONE and marked_count to 0"
      - "planned_load_lbs and transport_cost_cents computed per calculations.transport_load_plan and calculations.transport_cost; oxygen_flow_lpm computed"
      - "RearingLot.reserved_count += fish_count; RearingLot.version += 1"
      - "Hatchery.budget_committed_cents += transport_cost_cents; budget_available_cents recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_REQUEST_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_TRANSPORT_UNIT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_LOT_VERSION, ERR_INVALID_STATE, ERR_LOT_QUARANTINED, ERR_LOT_INSUFFICIENT_FISH, ERR_ALLOCATION_EXCEEDED, ERR_SPECIES_MISMATCH, ERR_BUDGET_EXCEEDED]

  - method: GET
    path: /stocking-events/{id}
    name: get_stocking_event
    purpose: "Read a trip with its load plan, acclimation requirement and contribution indices."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: []
    output: StockingEvent
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_EVENT_NOT_FOUND]

  - method: GET
    path: /stocking-events
    name: list_stocking_events
    purpose: "Trips, filterable by lot, request, truck and status."
    roles: [ProgramAdmin, HatcheryManager, FishHealthVeterinarian, RegionalBiologist]
    input: ["lot_id?", "stocking_request_id?", "transport_unit_id?", "status?", "limit?", "offset?"]
    output: StockingEvent[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /stocking-events/{id}/load
    name: load_stocking_event
    purpose: "Load the truck: enforces the health certificate, the drug-withdrawal window, the truck's trip calendar, the station's bulk oxygen supply and the temperature-derated load plan."
    roles: [HatcheryManager]
    input: [loaded_at, load_water_temp_c, "measured_load_lbs?"]
    output: StockingEvent
    side_effects:
      - "status SCHEDULED → IN_TRANSIT; loaded_at, load_water_temp_c and measured_load_lbs persisted"
      - "max_fish_allowed computed from the supplied load_water_temp_c per calculations.transport_load_plan"
      - "TransportUnit → IN_USE with current_event_id = this event"
      - "version += 1 on the event and the unit"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_EVENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_HATCHERY_FROZEN, ERR_LOT_NOT_CERTIFIED, ERR_LOT_QUARANTINED, ERR_HEALTH_CERTIFICATE_EXPIRED, ERR_WITHDRAWAL_PERIOD_ACTIVE, ERR_TRANSPORT_UNIT_UNAVAILABLE, ERR_OXYGEN_SUPPLY_EXCEEDED, ERR_TRANSPORT_CAPACITY_EXCEEDED]

  - method: POST
    path: /stocking-events/{id}/release
    name: release_stocking_event
    purpose: "Release the fish: enforces the destination's status, the temperature delta, the tempering requirement and the water's rest buffer, then settles fish, water and money."
    roles: [HatcheryManager]
    input: [arrived_at, site_water_temp_c, tempering_minutes, "transport_mortality_count?"]
    output: StockingEvent
    side_effects:
      - "status IN_TRANSIT → RELEASED; released_at = current_utc; acclimation_minutes_required computed; released_count = fish_count - transport_mortality_count"
      - "RearingLot.reserved_count -= fish_count, count_on_hand -= fish_count, cumulative_mortality_count += transport_mortality_count; biomass_lbs recomputed; the lot may reach rearing_stage RELEASED"
      - "Water.released_count_ytd += released_count; Water.allocated_count_ytd -= the fulfilled grant; last_release_at = current_utc; plan_shortfall_count and plan_fill_pct recomputed"
      - "StockingRequest → FULFILLED with fulfilled_at = current_utc; the AllocationPlan may reach CLOSED"
      - "Hatchery.budget_committed_cents -= transport_cost_cents; budget_spent_cents += transport_cost_cents; biomass_on_hand_lbs, density_index and operating_posture recomputed"
      - "TransportUnit → AVAILABLE with current_event_id null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_EVENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_WATER_CLOSED, ERR_TEMP_DELTA_EXCEEDED, ERR_ACCLIMATION_INSUFFICIENT, ERR_WATER_REST_BUFFER]

  - method: POST
    path: /stocking-events/{id}/abort
    name: abort_stocking_event
    purpose: "Unwind a scheduled or in-transit trip, restoring the fish, the appropriation and the truck exactly."
    roles: [HatcheryManager, ProgramAdmin]
    input: []
    output: StockingEvent
    side_effects:
      - "status → ABORTED; aborted_at = current_utc; abort_reason = OPERATOR_ABORT; released_count 0"
      - "RearingLot.reserved_count -= fish_count (the fish stay in count_on_hand); RearingLot.version += 1"
      - "Hatchery.budget_committed_cents -= transport_cost_cents; budget_available_cents recomputed"
      - "StockingRequest → DEFERRED with allocated_count 0 and deferral_reason EVENT_ABORTED; Water.allocated_count_ytd -= the surrendered grant; plan_shortfall_count and plan_fill_pct recomputed"
      - "TransportUnit → AVAILABLE when it was IN_USE for this event"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_HATCHERY_SCOPE_VIOLATION, ERR_EVENT_NOT_FOUND, ERR_INVALID_STATE]

  - method: POST
    path: /stocking-events/{id}/recoveries
    name: record_event_recoveries
    purpose: "Record tag recoveries from creel and harvest surveys and evaluate the release's contribution under both conventions."
    roles: [ProgramAdmin, RegionalBiologist]
    input: [recovered_count, creel_sample_fraction]
    output: StockingEvent
    side_effects:
      - "recovered_count and creel_sample_fraction persisted; effective_marked_count computed from mark_type's tag-loss rate"
      - "contribution_index_cohort and contribution_index_harvest both recomputed per calculations.contribution_index"
      - "version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_EVENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

# =============================================================================
# §1.6 Error Catalog
# Every entry is reachable from at least one endpoint in §1.5.
# =============================================================================
errors:

  # --- authentication and authorisation ---
  - { error_id: ERR_UNAUTHENTICATED, status: 401, meaning: "X-User-ID header absent, empty or whitespace-only", raised_by: "every endpoint" }
  - { error_id: ERR_FORBIDDEN_ROLE, status: 403, meaning: "the acting role may not call this endpoint", raised_by: "every endpoint" }
  - { error_id: ERR_HATCHERY_SCOPE_VIOLATION, status: 403, meaning: "a HatcheryManager addressed a row belonging to another station", raised_by: "every hatchery-scoped read and write" }
  - { error_id: ERR_NOT_REQUEST_OWNER, status: 403, meaning: "the acting requester is not the request's author", raised_by: "withdraw_stocking_request, attach_request_to_plan" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status: 403, meaning: "the sampling veterinarian may not sign the certificate", raised_by: "certify_health_inspection" }

  # --- existence ---
  - { error_id: ERR_HATCHERY_NOT_FOUND, status: 404, meaning: "hatchery id does not resolve", raised_by: "get_hatchery, list_hatchery_effluent_readings, create_effluent_reading, create_brood_stock, create_allocation_plan, create_transport_unit" }
  - { error_id: ERR_WATER_NOT_FOUND, status: 404, meaning: "water id does not resolve", raised_by: "get_water, close_water, create_stocking_request" }
  - { error_id: ERR_BROOD_STOCK_NOT_FOUND, status: 404, meaning: "brood stock id does not resolve", raised_by: "get_brood_stock, open_spawning_window, create_spawn_event" }
  - { error_id: ERR_SPAWN_EVENT_NOT_FOUND, status: 404, meaning: "spawn event id does not resolve", raised_by: "get_spawn_event, record_spawn_take, cancel_spawn_event" }
  - { error_id: ERR_LOT_NOT_FOUND, status: 404, meaning: "rearing lot id does not resolve", raised_by: "get_rearing_lot, record_feeding, advance_rearing_stage, create_health_inspection, create_stocking_event" }
  - { error_id: ERR_INSPECTION_NOT_FOUND, status: 404, meaning: "health inspection id does not resolve", raised_by: "get_health_inspection, record_inspection_result, record_inspection_treatment, certify_health_inspection" }
  - { error_id: ERR_REQUEST_NOT_FOUND, status: 404, meaning: "stocking request id does not resolve", raised_by: "get_stocking_request, withdraw_stocking_request, attach_request_to_plan, create_stocking_event" }
  - { error_id: ERR_PLAN_NOT_FOUND, status: 404, meaning: "allocation plan id does not resolve", raised_by: "get_allocation_plan, run_allocation_plan, attach_request_to_plan" }
  - { error_id: ERR_TRANSPORT_UNIT_NOT_FOUND, status: 404, meaning: "transport unit id does not resolve", raised_by: "get_transport_unit, create_stocking_event" }
  - { error_id: ERR_EVENT_NOT_FOUND, status: 404, meaning: "stocking event id does not resolve", raised_by: "get_stocking_event, load_stocking_event, release_stocking_event, abort_stocking_event, record_event_recoveries" }

  # --- request shape ---
  - { error_id: ERR_INVALID_REQUEST, status: 400, meaning: "missing required field, wrong type, unrecognised enum, out-of-range number, bad string pattern or inverted interval", raised_by: "every write endpoint and every list endpoint with pagination or filter parameters" }
  - { error_id: ERR_DUPLICATE_STATION_CODE, status: 409, meaning: "station_code already registered", raised_by: "create_hatchery" }

  # --- optimistic concurrency ---
  - { error_id: ERR_STALE_LOT_VERSION, status: 412, meaning: "expected_lot_version does not match RearingLot.version", raised_by: "create_stocking_event" }
  - { error_id: ERR_STALE_PLAN_VERSION, status: 412, meaning: "expected_plan_version does not match AllocationPlan.version", raised_by: "run_allocation_plan, attach_request_to_plan" }

  # --- own-entity state ---
  - { error_id: ERR_INVALID_STATE, status: 409, meaning: "the row's current status has no transition for this trigger", raised_by: "every action endpoint" }
  - { error_id: ERR_SPAWN_WINDOW_CLOSED, status: 409, meaning: "the logical clock is outside the brood group's spawning window", raised_by: "open_spawning_window" }

  # --- cross-entity state ---
  - { error_id: ERR_BROOD_STOCK_NOT_SPAWNING, status: 409, meaning: "the parent brood group is not in status SPAWNING", raised_by: "create_spawn_event, record_spawn_take" }
  - { error_id: ERR_WATER_CLOSED, status: 409, meaning: "the destination water has been retired", raised_by: "release_stocking_event" }
  - { error_id: ERR_HATCHERY_FROZEN, status: 409, meaning: "the station's operating_posture is FROZEN", raised_by: "open_spawning_window, create_spawn_event, record_spawn_take, run_allocation_plan, load_stocking_event" }
  - { error_id: ERR_HATCHERY_RESTRICTED, status: 409, meaning: "the station's operating_posture is RESTRICTED, so no new intake is accepted", raised_by: "create_spawn_event" }

  # --- health and certification safety ---
  - { error_id: ERR_LOT_NOT_CERTIFIED, status: 422, meaning: "the lot has no standing health certificate", raised_by: "load_stocking_event" }
  - { error_id: ERR_LOT_QUARANTINED, status: 422, meaning: "the lot is under quarantine for a reportable pathogen", raised_by: "create_stocking_event, load_stocking_event, create_health_inspection, record_inspection_result, certify_health_inspection" }
  - { error_id: ERR_HEALTH_CERTIFICATE_EXPIRED, status: 422, meaning: "the clock is past the lot's certificate_expires_at", raised_by: "load_stocking_event" }
  - { error_id: ERR_WITHDRAWAL_PERIOD_ACTIVE, status: 422, meaning: "the drug-withdrawal window has not cleared", raised_by: "load_stocking_event, record_inspection_result" }
  - { error_id: ERR_PATHOGEN_NOT_TREATABLE, status: 422, meaning: "a reportable finding may not be treated out", raised_by: "record_inspection_treatment" }
  - { error_id: ERR_TEMP_DELTA_EXCEEDED, status: 422, meaning: "the truck-to-site temperature gap exceeds MAX_TEMP_DELTA_C", raised_by: "release_stocking_event" }
  - { error_id: ERR_ACCLIMATION_INSUFFICIENT, status: 422, meaning: "tempering_minutes is below the required acclimation time", raised_by: "release_stocking_event" }

  # --- temporal conflicts ---
  - { error_id: ERR_TRANSPORT_UNIT_UNAVAILABLE, status: 409, meaning: "the truck's trip interval intersects another trip, or its certification has lapsed", raised_by: "load_stocking_event" }
  - { error_id: ERR_WATER_REST_BUFFER, status: 409, meaning: "the water's 48-hour rest buffer since the last release has not elapsed", raised_by: "release_stocking_event" }
  - { error_id: ERR_OXYGEN_SUPPLY_EXCEEDED, status: 422, meaning: "the station's bulk oxygen supply cannot cover the trips out at the same time", raised_by: "load_stocking_event" }

  # --- capacity and count ceilings ---
  - { error_id: ERR_DENSITY_CAP_EXCEEDED, status: 422, meaning: "the feeding would push the station's density_index past the hard cap", raised_by: "record_feeding" }
  - { error_id: ERR_TRANSPORT_CAPACITY_EXCEEDED, status: 422, meaning: "fish_count exceeds the temperature-derated load plan", raised_by: "load_stocking_event" }
  - { error_id: ERR_LOT_INSUFFICIENT_FISH, status: 422, meaning: "the lot has fewer unreserved fish than the trip asks for", raised_by: "create_stocking_event" }
  - { error_id: ERR_BROOD_FEMALES_INSUFFICIENT, status: 422, meaning: "the brood group has fewer available females than the take asks for", raised_by: "create_spawn_event" }
  - { error_id: ERR_ALLOCATION_EXCEEDED, status: 422, meaning: "the trip would ship more fish than the request was granted", raised_by: "create_stocking_event" }
  - { error_id: ERR_STAGE_WEIGHT_NOT_MET, status: 422, meaning: "the lot has not reached the target stage's weight gate", raised_by: "advance_rearing_stage" }

  # --- referential agreement ---
  - { error_id: ERR_SPECIES_MISMATCH, status: 422, meaning: "the lot's species differs from the request's species", raised_by: "create_stocking_event" }
  - { error_id: ERR_SIZE_CLASS_MISMATCH, status: 422, meaning: "the request's size class differs from the plan's size class", raised_by: "attach_request_to_plan" }
  - { error_id: ERR_NO_ELIGIBLE_REQUESTS, status: 422, meaning: "the plan has no eligible queued request to allocate to", raised_by: "run_allocation_plan" }

  # --- fiscal ceilings ---
  - { error_id: ERR_WATER_RIGHT_EXCEEDED, status: 422, meaning: "the take would consume more acre-feet than the water right leaves available", raised_by: "create_spawn_event, record_spawn_take" }
  - { error_id: ERR_BUDGET_EXCEEDED, status: 422, meaning: "the trip's transport cost exceeds the station's available appropriation", raised_by: "create_stocking_event" }

# =============================================================================
# §1.7 RBAC Table
#
# Authentication is the X-User-ID header. HatcheryManager is entity-backed: the
# header value IS the Hatchery.id the manager runs, which is what makes cross-
# station scope violations testable without a separate user table.
# =============================================================================
roles:

  - name: ProgramAdmin
    identity: opaque
    description: "Statewide hatchery-program administrator. Owns the reference data (stations, waters, plans, fleet) and the allocation selector."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /hatcheries"
      - "POST /waters"
      - "POST /waters/{id}/close"
      - "POST /allocation-plans"
      - "POST /allocation-plans/{id}/run"
    shared_operations:
      - "POST /brood-stocks, POST /transport-units, POST /effluent-readings (with HatcheryManager, but unscoped)"
      - "POST /spawn-events/{id}/cancel, POST /stocking-events/{id}/abort (with HatcheryManager)"
      - "POST /stocking-requests/{id}/withdraw, POST /stocking-requests/{id}/attach-to-plan (may act on any requester's request)"
      - "POST /stocking-events/{id}/recoveries (with RegionalBiologist)"
      - "every GET"
    cannot:
      - "POST /brood-stocks/{id}/open-spawning-window, POST /spawn-events, POST /spawn-events/{id}/record-take, POST /rearing-lots/{id}/feedings, POST /rearing-lots/{id}/advance-stage, POST /stocking-events, POST /stocking-events/{id}/load, POST /stocking-events/{id}/release — production is the manager's duty"
      - "any /health-inspections write — fish health is the veterinarian's duty"
      - "POST /stocking-requests — the administrator does not author demand"

  - name: HatcheryManager
    identity: "entity_backed:Hatchery"
    description: "Runs one station. X-User-ID is that Hatchery's id, so every write is scoped to the rows reachable from it."
    exclusive_operations:
      - "POST /brood-stocks/{id}/open-spawning-window"
      - "POST /spawn-events"
      - "POST /spawn-events/{id}/record-take"
      - "POST /rearing-lots/{id}/feedings"
      - "POST /rearing-lots/{id}/advance-stage"
      - "POST /stocking-events"
      - "POST /stocking-events/{id}/load"
      - "POST /stocking-events/{id}/release"
    shared_operations:
      - "POST /brood-stocks, POST /transport-units, POST /effluent-readings (own station only)"
      - "POST /spawn-events/{id}/cancel, POST /stocking-events/{id}/abort (own station only)"
      - "reads of hatcheries, brood stocks, spawn events, rearing lots, inspections, plans, fleet, requests and events"
    scope_rule: "Every write and every hatchery-scoped read must resolve to a hatchery_id equal to X-User-ID, following BroodStock.hatchery_id, RearingLot.hatchery_id, TransportUnit.hatchery_id or AllocationPlan.hatchery_id as needed; otherwise ERR_HATCHERY_SCOPE_VIOLATION."
    cannot:
      - "POST /hatcheries, POST /waters, POST /waters/{id}/close, POST /allocation-plans, POST /allocation-plans/{id}/run, POST /_clock/set_current_utc"
      - "any /health-inspections write"
      - "POST /stocking-requests, POST /stocking-events/{id}/recoveries"

  - name: FishHealthVeterinarian
    identity: opaque
    description: "Fish-health professional. Samples, results, treats and certifies lots. Two distinct veterinarians are required to move a lot from sampled to certified."
    exclusive_operations:
      - "POST /health-inspections"
      - "POST /health-inspections/{id}/record-result"
      - "POST /health-inspections/{id}/record-treatment"
      - "POST /health-inspections/{id}/certify"
    shared_operations:
      - "reads of hatcheries, brood stocks, spawn events, rearing lots, inspections and events"
    segregation_rule: "certify_health_inspection refuses X-User-ID == HealthInspection.sampled_by_user_id with ERR_SEGREGATION_OF_DUTIES. The certifying veterinarian needs no other relationship to the lot."
    cannot:
      - "any production write, any allocation write, POST /stocking-requests, POST /stocking-events/{id}/recoveries"

  - name: RegionalBiologist
    identity: opaque
    description: "Fisheries biologist who authors stocking requests for the waters in a region and evaluates tag recoveries."
    exclusive_operations: []
    shared_operations:
      - "POST /stocking-requests (requester_kind BIOLOGIST, weight 1.00)"
      - "POST /stocking-requests/{id}/withdraw and POST /stocking-requests/{id}/attach-to-plan for own requests"
      - "POST /stocking-events/{id}/recoveries (with ProgramAdmin)"
      - "reads of waters, requests, plans, fleet, lots, inspections, brood stocks, spawn events and events"
    ownership_rule: "withdraw and attach act only on requests whose requested_by_user_id equals X-User-ID; otherwise ERR_NOT_REQUEST_OWNER."
    cannot:
      - "any production write, POST /allocation-plans, POST /allocation-plans/{id}/run, POST /waters, POST /hatcheries, any /health-inspections write"

  - name: PublicRequester
    identity: opaque
    description: "Member of the public submitting a stocking request. Scored at the PUBLIC requester weight and capped by the plan's reserved public share."
    exclusive_operations: []
    shared_operations:
      - "POST /stocking-requests (requester_kind PUBLIC, weight 0.80)"
      - "POST /stocking-requests/{id}/withdraw for own requests"
      - "reads of waters and stocking requests"
    ownership_rule: "withdraw acts only on own requests; otherwise ERR_NOT_REQUEST_OWNER."
    cannot:
      - "POST /stocking-requests/{id}/attach-to-plan — queueing a request onto a plan is a program decision"
      - "every production, health, allocation and fleet write"
      - "reads of production data: hatcheries, brood stocks, spawn events, rearing lots, inspections, plans, fleet and events all return ERR_FORBIDDEN_ROLE"
