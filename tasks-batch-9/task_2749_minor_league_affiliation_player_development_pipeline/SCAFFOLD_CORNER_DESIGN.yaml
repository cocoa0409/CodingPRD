      - name: pool_reopen_does_not_revive_auto_rejected_siblings
        claim_type: cyclic
        grounds:
          - "state_machines.SigningPool[HARD_CAPPED -> OPEN]"
          - "state_machines.InternationalSigning[APPROVED -> VOIDED]"
        excluded_because:
          difficulty_instance: signing_pool_allocated_and_remaining_conserved_across_approve_and_void
          rationale: "The §1.8 compensating_invariant instance already drives the pool through approve -> void and pins allocated_cents / remaining_cents at each step, which is the whole observable content of the HARD_CAPPED -> OPEN leg of the cycle; repeating it here would duplicate the same ledger assertions."

      - name: clearance_revocation_reaches_assignment_plan_and_counters
        claim_type: cascade_down
        grounds:
          - "state_machines.MedicalClearance[ISSUED -> REVOKED]"
          - "state_machines.PlayerAssignment[ACTIVE -> SUSPENDED]"
        excluded_because:
          difficulty_instance: clearance_revocation_cascades_to_assignment_plan_roster_and_posture
          rationale: "The §1.8 transitive_cascade instance already walks the full clearance -> assignment -> plan -> roster-counter -> posture chain end to end and asserts every hop, so a separate cascade_down instance would assert a strict subset of it."

      - name: option_year_rescission_reverses_the_original_charge
        claim_type: compensation
        grounds:
          - "state_machines.PlayerAssignment[ACTIVE -> REVOKED]"
          - entities.OptionYearRecord.fields.status
        excluded_because:
          difficulty_instance: option_year_count_conserved_across_two_charges_and_one_revoke
          rationale: "The §1.8 compensating_invariant instance already charges twice, revokes once and pins used/remaining after every step while checking the conservation sum, which covers the undo semantics this claim would test."

      - name: player_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Player.roster_status
          - state_machines.Player.medical_status
        excluded_because:
          difficulty_instance: player_roster_and_medical_dimensions_advance_independently
          rationale: "The §1.8 non_linear_state_machine instance is exactly this claim: it drives a medical DENY that moves medical_status without touching roster_status and vice versa, pinning both dimensions after each event."

      - name: assignment_activation_is_guarded_by_the_agreement_state
        claim_type: guarded_transitions
        grounds:
          - "state_machines.PlayerAssignment[PENDING_CLEARANCE -> ACTIVE]"
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: assignment_activation_requires_agreement_active_on_the_affiliate
          rationale: "The §1.8 cross_entity_state_dependency instance already tests the same guarded transition from both sides — blocked while the agreement is not ACTIVE, admitted immediately after activation with no other state changed."

  # ==========================================================================
  - section: calculations
    instances:

      - name: workload_index_sums_three_weighted_measures_with_the_level_multiplier
        claim_type: correct_result
        grounds:
          - calculations.player_workload_index
          - entities.WorkloadLog
        distinguishing_aspect: "A single log exercises all three measure terms at once at HIGH_A: 0.55*(90/100) + 0.30*(6.0/10) + 0.15*(45/60) = 0.7875, times LEVEL_WORKLOAD_MULTIPLIER 1.05 = 0.826875, rounded once at the end to 0.83 — an implementation that rounds each term first, or drops the multiplier, cannot produce this value."
        test_recipe:
          setup:
            - "The logical clock is at 2026-05-10T00:00:00Z."
            - "A HIGH_A affiliate with an ACTIVE agreement (minimum_active_players 0), a cleared player, an ACTIVE LEVEL assignment 2026-05-01..2026-08-31 (workload_ceiling_index defaults to 12.00)."
            - "Author-computed: raw = 0.495 + 0.18 + 0.1125 = 0.7875; contribution = 0.7875 * 1.05 = 0.826875; round_half_up(_, 2) = 0.83. The player has no ACTIVE DevelopmentPlan, so plan_allowance is 0 and the projected variant equals the actual variant."
