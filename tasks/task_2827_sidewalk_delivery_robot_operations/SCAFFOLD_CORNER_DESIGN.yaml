            - "order O1 was created (version 1) and dispatched, which also took the robot to ON_MISSION and incremented the zone counter"
            - "the load minted the lid code, which advanced the mission and the zone again"
            - "plan P1 was created, validated and activated, and the activation set mission.active_route_plan_id"
