        distinguishing_aspect: "FINALIZED -> FINALIZED is not declared: a second finalize on an already-FINALIZED cycle fails with ERR_INVALID_STATE and must not synthesize duplicate DeductionLines."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GW ACTIVE (0/0.0, DAILY); no employees (empty group); payroll cycle CYCW period 2026-09-01..2026-10-01 FINALIZED."
