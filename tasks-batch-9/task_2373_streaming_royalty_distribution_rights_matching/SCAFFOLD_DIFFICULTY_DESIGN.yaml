      - name: holder_receivable_conservation
        grounds:
          - invariants.holder_receivable_conservation
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - state_machines.RoyaltyStatement.ISSUED_to_SUPERSEDED
          - state_machines.AuditEngagement.finding_status_ASSERTED_to_WITHDRAWN
        distinguishing_aspect: |
          The holder's receivable balance is raised only by issuing a statement and by an UPHELD
          settlement, and it must return to exactly its pre-issue value when the retroactive
          promulgation cascade supersedes that statement — while the second compensating pair
          (assert a finding, then settle with WITHDRAW) must leave the balance untouched at BOTH
          steps, so an implementation that credits on assertion is caught.
