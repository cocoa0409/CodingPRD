      - name: writeoff_too_young_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_WRITEOFF_TOO_YOUNG]", "state_machines.ReconcilingItem.OPEN_to_WRITTEN_OFF"]
        distinguishing_aspect: "Writing off a reconciling item still in the CURRENT or AGE_1_30 bucket is rejected ERR_WRITEOFF_TOO_YOUNG regardless of amount."
        test_recipe:
          setup: ["Period opened; entity-period SUBLEDGER_CUT; reconciliation IN_REVIEW; a small (below-materiality) item dated at period_end with clock only 10 days past (AGE_1_30)"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
