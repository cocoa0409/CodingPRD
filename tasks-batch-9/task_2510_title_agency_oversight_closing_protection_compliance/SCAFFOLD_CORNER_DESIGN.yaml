  # ===========================================================================
  - section: errors
    instances:
      - name: unauthenticated_and_malformed_requests_are_rejected_returns_401
        claim_type: triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_TERMINATION_REASON_REQUIRED
        distinguishing_aspect: "Covers the three request-level errors that need no domain state: a missing role header, a pagination argument outside 1..100, and a TERMINATE decision with no termination_reason."
        test_recipe:
          setup:
            - "One agency exists so the termination decision reaches the priority-30 shape check."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-9001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
          trigger:
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: "(request sent with no X-User-Role and no X-User-ID header)"
            - call: "GET /agencies"
              payload: { limit: 0 }
              as: ComplianceOfficer
            - call: "GET /agencies"
              payload: { limit: 101 }
              as: ComplianceOfficer
            - call: "GET /agencies"
              payload: { offset: -1 }
              as: ComplianceOfficer
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "TERMINATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "trigger[0]: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "trigger[1], trigger[2], trigger[3]: HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" (limit must be 1..100 and offset must be >= 0)"
            - "trigger[4]: HTTP 400 with data.error_id == \"ERR_TERMINATION_REASON_REQUIRED\" — the priority-30 shape check answers before the priority-80 state check ever looks at appointment_status PENDING_REVIEW"
            - "Agency.${ag_id}.appointment_status is still \"PENDING_REVIEW\""

      - name: duplicate_registration_keys_are_rejected_returns_409
        claim_type: triggerability
        grounds:
          - errors.ERR_DUPLICATE_TAX_ID
          - errors.ERR_DUPLICATE_STATE_CODE
          - errors.ERR_DUPLICATE_APPOINTMENT
          - errors.ERR_DUPLICATE_ESCROW_ACCOUNT_REF
        distinguishing_aspect: "Exercises all four registration-level uniqueness constraints in one chain, each with its own scope: tax_id global, state_code global, appointment per (agency, state program), account_ref per agency."
        test_recipe:
          setup:
            - "One state program CA, one agency, one appointment for that pair, and one escrow account with account_ref ESCROW-1."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-9011", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_id: "$.data.id" }
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea_id: "$.data.id" }
          trigger:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title of Nevada", tax_id: "TAX-9011", underwriting_authority_limit_cents: 20000000 }
              as: LicensingAnalyst
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: false, cpl_coverage_cap_cents: 10000000, cpl_scope_allowed: ["FULL_SETTLEMENT"], premium_split_agency_pct: 0.70, policy_issuance_deadline_days: 20, three_way_tolerance_cents: 50000, counsel_referral_threshold_cents: 30000000 }
              as: ComplianceOfficer
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-9999", license_expires_on: "2028-12-31" }
              as: LicensingAnalyst
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "Second State Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
          assert:
            - "trigger[0]: HTTP 409 with data.error_id == \"ERR_DUPLICATE_TAX_ID\" and GET /agencies returns total_count == 1"
            - "trigger[1]: HTTP 409 with data.error_id == \"ERR_DUPLICATE_STATE_CODE\" — a different license number does not help"
            - "trigger[2]: HTTP 409 with data.error_id == \"ERR_DUPLICATE_APPOINTMENT\" and GET /agency-appointments?agency_id=${ag_id} returns total_count == 1"
            - "trigger[3]: HTTP 409 with data.error_id == \"ERR_DUPLICATE_ESCROW_ACCOUNT_REF\" — the bank name is irrelevant, the ref is what collides"

