          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-09-30T00:00:00Z before the deposit."
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan whose reported_participant_count is 250, so the large-plan deadline rule applies."
            - "Two participants and three contracts across two providers."
            - "A WITHHELD remittance batch for pay period [2026-07-01, 2026-07-16) with withholding_date 2026-07-15, total_elective_deferral_cents 999999 and three line items of 555555, 333333 and 111111 cents."
