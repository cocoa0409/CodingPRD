        distinguishing_aspect: |
          Different interval semantics than instance 1: AuditSample doc-response
          window is INCLUSIVE-CLOSED [sampled_at, doc_due_day_index] — receiving
          docs on day == doc_due_day_index succeeds; day == doc_due_day_index + 1
          fails with EXPIRED_NO_RESPONSE. Different resource entity (AuditSample
          vs ExemptionCertificate), different semantic (closed vs half-open).
