    output: InspectionRecord
    side_effects: ["hold_state AGENCY_HOLD -> CLEARED and result reset to PENDING with defect_count = 0, severity_max = 0", "module qc_status HOLD -> IN_PROGRESS", "recomputes wip_earned_cents and the project's DRAFT draw bases", "increments InspectionRecord.version and ModuleUnit.version by 1"]

