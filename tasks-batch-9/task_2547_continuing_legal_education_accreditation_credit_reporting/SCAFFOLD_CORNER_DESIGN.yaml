            - "One ACTIVE attorney at version 1."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2020", full_name: "Sofia Klein", admission_date: "2015-01-01T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
