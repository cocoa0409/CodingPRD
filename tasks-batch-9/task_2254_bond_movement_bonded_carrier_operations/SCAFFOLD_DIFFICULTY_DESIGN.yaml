  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_bond_beats_insufficient_bond_on_filing_rejected
        grounds:
          - validations[priority=10].ERR_BOND_NOT_ACTIVE
          - validations[priority=14].ERR_BOND_INSUFFICIENT
          - state_machines.CustomsBond.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the filing violates BOTH the
          priority-10 bond-state check and the priority-14 sufficiency check
          (obligation 41.75 > available 30.00), and the response must be
          ERR_BOND_NOT_ACTIVE (409), never ERR_BOND_INSUFFICIENT (422).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ports 4601 (NE) and 3901 (MW); carrier ACTIVE."
            - "Bond b2 = CONTINUOUS limit 30.00, 2026-07-01 .. 2027-06-30, so available_amount 30.00 is below the 41.75 obligation the filing would incur."
            - "The surety agent for b2 sets its status to SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
