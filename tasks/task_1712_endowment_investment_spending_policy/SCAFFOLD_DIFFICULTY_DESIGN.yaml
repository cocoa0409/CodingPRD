  # ---------------------------------------------------------------
  # Rule 6 — boundary_precision_check (two different metrics/endpoints)
  # ---------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: underwater_flag_strict_less_than_equality_is_not_underwater
        grounds:
          - calculations.underwater_flag
          - entities.Fund.fields.is_underwater
        distinguishing_aspect: |
          Metric: market_value_cents vs historic_gift_value_cents in cents; endpoint:
          POST /endowment/valuations/{id}/finalize. After Q1 the fund sits exactly at
          MV == HGV == 10000000 — the strict-< rule must keep is_underwater false; after
          Q2 at MV 9999900 (price 99999) it must flip true. Equality is NOT underwater.
        test_recipe:
          setup:
            - "Pool with allocation, engaged manager, ACTIVE fund FEQL with one CORPUS gift 10000000 (HGV 10000000); Q1 report shows ending MV exactly 10000000; the Q1 valuation is PRELIMINARY"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool EQL", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { eq_pool: $.data.id, eq_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${eq_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${eq_pool}", manager_name: "M EQL", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { eq_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${eq_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${eq_pool}", fund_code: "FEQL", fund_name: "Fund EQL", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { eq_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D EQL", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { eq_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${eq_fund}", donor_id: "${eq_donor}", external_ref: "EQ1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { eq_g1: $.data.id } }
            - { call: "POST /endowment/funds/${eq_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${eq_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${eq_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${eq_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { eq_v1: $.data.id } }
          trigger:
            - { call: "POST /endowment/valuations/${eq_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${eq_pv}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/funds/${eq_fund}", as: InvestmentOfficer, captures: { eq_under_q1: $.data.is_underwater, eq_mv_q1: $.data.market_value_cents } }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${eq_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 9999900, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${eq_pool}", estimated_pool_market_value_cents: 9999900 }, as: InvestmentOfficer, captures: { eq_v2: $.data.id } }
            - { call: "GET /endowment/pools/${eq_pool}", as: InvestmentOfficer, captures: { eq_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${eq_v2}/finalize", payload: { final_pool_market_value_cents: 9999900, expected_pool_version: "${eq_pv2}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/funds/${eq_fund}", as: InvestmentOfficer, captures: { eq_under_q2: $.data.is_underwater, eq_mv_q2: $.data.market_value_cents, eq_posture_q2: $.data.spending_posture } }
          assert:
            - "After Q1: Fund.is_underwater == false with market_value_cents == 10000000 == historic_gift_value_cents (equality is NOT underwater; a <= implementation fails here)"
            - "After Q2: Fund.market_value_cents == 9999900 and is_underwater == true (9999900 < 10000000)"
            - "After Q2: Fund.spending_posture == SPENDING_SUSPENDED"

      - name: manager_watchlist_fires_at_exactly_third_negative_excess_streak
        grounds:
          - calculations.excess_streak_tracking
          - state_machines.InvestmentManager.ENGAGED_to_WATCHLIST
        distinguishing_aspect: |
          Metric: consecutive negative-excess report count; endpoint:
          POST /endowment/manager-quarter-reports — a different metric (integer streak
          count) and endpoint from the sibling cents-comparison on finalize. Two negative
          quarters leave the manager ENGAGED; the third flips WATCHLIST immediately in the
          filing response window (no finalize needed for the transition).
        test_recipe:
          setup:
            - "Pool with allocation and an engaged manager; Q1 and Q2 reports filed with excess_bps == -100 each (return 0 vs benchmark 100), quarters finalized; manager still ENGAGED with neg_excess_streak == 2"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool STK", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { sk_pool: $.data.id, sk_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${sk_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${sk_pool}", manager_name: "M STK", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { sk_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${sk_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${sk_mgr}", quarter_index: 1, beginning_mv_cents: 1000000, ending_mv_cents: 1000000, flows: [], benchmark_return_bps: 100 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${sk_pool}", estimated_pool_market_value_cents: 1000000 }, as: InvestmentOfficer, captures: { sk_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${sk_v1}/finalize", payload: { final_pool_market_value_cents: 1000000, expected_pool_version: "${sk_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${sk_mgr}", quarter_index: 2, beginning_mv_cents: 1000000, ending_mv_cents: 1000000, flows: [], benchmark_return_bps: 100 }, as: InvestmentOfficer }
            - { call: "GET /endowment/managers/${sk_mgr}", as: InvestmentOfficer, captures: { sk_status_q2: $.data.engagement_status, sk_streak_q2: $.data.neg_excess_streak } }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${sk_pool}", estimated_pool_market_value_cents: 1000000 }, as: InvestmentOfficer, captures: { sk_v2: $.data.id } }
            - { call: "GET /endowment/pools/${sk_pool}", as: InvestmentOfficer, captures: { sk_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${sk_v2}/finalize", payload: { final_pool_market_value_cents: 1000000, expected_pool_version: "${sk_pv2}" }, as: InvestmentOfficer }
          trigger:
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${sk_mgr}", quarter_index: 3, beginning_mv_cents: 1000000, ending_mv_cents: 1000000, flows: [], benchmark_return_bps: 100 }, as: InvestmentOfficer }
            - { call: "GET /endowment/managers/${sk_mgr}", as: InvestmentOfficer, captures: { sk_status_q3: $.data.engagement_status, sk_streak_q3: $.data.neg_excess_streak } }
          assert:
            - "After the 2nd negative report: engagement_status == ENGAGED and neg_excess_streak == 2 (threshold is exactly 3, not 2)"
            - "After the 3rd negative report: neg_excess_streak == 3 and engagement_status == WATCHLIST (fires at exactly 3)"

  # ---------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (two different entity pairs)
  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: distribution_approve_gated_by_exception_state_distribution_exception_pair
        grounds:
          - state_machines.SpendingDistribution.PROPOSED_to_APPROVED
          - state_machines.PolicyException.ENDORSED_to_APPROVED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair SpendingDistribution -> PolicyException: while the fund is underwater
          the approve transition's valid next-state depends on a DIFFERENT entity (the
          exception for the same fund+fiscal_year) being in APPROVED. First approve fails
          with ERR_UNDERWATER_SPENDING_BLOCKED; after the exception reaches APPROVED the
          same call succeeds with final_amount_cents == 300000 == min(exception 300000,
          band_adjusted 350000).
        test_recipe:
          setup:
            - "Pool with allocation, policy (500/4/0/10000/2026) ADOPTED, engaged manager, ACTIVE fund FXD (HGV 10000000, 100000000000 micro-units); Q2 finalized at price 40000 -> underwater; FY2026 distribution in PROPOSED (base 7000000 from Q1+Q2 MVs 10000000/4000000, raw 350000, final 0 while blocked)"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool XD", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { xd_pool: $.data.id, xd_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${xd_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/policies", payload: { pool_id: "${xd_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { xd_pol: $.data.id } }
            - { call: "POST /endowment/policies/${xd_pol}/adopt", payload: { expected_pool_version: "${xd_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${xd_pool}", manager_name: "M XD", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { xd_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${xd_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${xd_pool}", fund_code: "FXD", fund_name: "Fund XD", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { xd_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D XD", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { xd_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${xd_fund}", donor_id: "${xd_donor}", external_ref: "XD1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { xd_g1: $.data.id } }
            - { call: "POST /endowment/funds/${xd_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${xd_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${xd_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${xd_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { xd_v1: $.data.id } }
            - { call: "GET /endowment/pools/${xd_pool}", as: InvestmentOfficer, captures: { xd_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${xd_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${xd_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${xd_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 4000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${xd_pool}", estimated_pool_market_value_cents: 4000000 }, as: InvestmentOfficer, captures: { xd_v2: $.data.id } }
            - { call: "GET /endowment/pools/${xd_pool}", as: InvestmentOfficer, captures: { xd_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${xd_v2}/finalize", payload: { final_pool_market_value_cents: 4000000, expected_pool_version: "${xd_pv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${xd_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { xd_d: $.data.id } }
            - { call: "POST /endowment/distributions/${xd_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${xd_d}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { xd_block: $.data.error_id } }
            - { call: "POST /endowment/exceptions", payload: { fund_id: "${xd_fund}", fiscal_year: 2026, requested_amount_cents: 300000, justification: "bridge" }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { xd_ex: $.data.id } }
            - { call: "POST /endowment/exceptions/${xd_ex}/endorse", payload: {}, as: InvestmentOfficer, as_user_id: "io-2" }
            - { call: "POST /endowment/exceptions/${xd_ex}/approve", payload: { approved_amount_cents: 300000 }, as: BoardMember, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /endowment/distributions/${xd_d}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { xd_st: $.data.distribution_status, xd_final: $.data.final_amount_cents, xd_exc: $.data.applied_exception_id } }
          assert:
            - "The first approve (before the exception existed) failed with error_id == ERR_UNDERWATER_SPENDING_BLOCKED (http 422)"
            - "After the exception reached APPROVED: distribution_status == APPROVED"
            - "final_amount_cents == 300000 == min(300000 exception cap, 350000 band-adjusted raw)"
            - "applied_exception_id == ${xd_ex}"
            - "Band-adjusted context: smoothed_base_cents == 7000000 and raw_amount_cents == 350000 (window over Q1 MV 10000000 and Q2 MV 4000000, 2 eligible quarters)"

      - name: report_publish_gated_by_distribution_terminality_report_distribution_pair
        grounds:
          - state_machines.AnnualReport.UNDER_REVIEW_to_PUBLISHED
          - validations[priority=17]
        distinguishing_aspect: |
          Entity pair AnnualReport -> SpendingDistribution (different pair from the sibling
          Distribution -> Exception): a SPENDING_COMPLIANCE report for FY2026 cannot publish
          while the fund's FY2026 distribution is PROPOSED; cancelling the distribution
