# =============================================================================
# PRD Benchmark Seed Tables — Employment-Based Immigration (PERM/LCA & H-1B)
# Difficulty: Expert
# =============================================================================

scenario: |
  Employment-Based Immigration (PERM/LCA & H-1B): job order & prevailing-wage
  determination, recruitment & PERM labor certification, LCA filing &
  public-access file, H-1B petition & cap-lottery registration, RFE response,
  status/extension tracking, green-card (I-140) stage, compliance audit (PAF)

domain_name: employment-immigration
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - temporal_windowing            # recruitment/quiet-period/validity windows, overlap arithmetic
    - optimistic_concurrency        # OCC on Employer.version for PWD issuance/supersede
    - cascading_side_effects        # PWD supersede & LCA withdraw drive multi-hop reverts
    - dual_variant_calculation      # required-wage provisional/final; priority-date PERM/self

  entity_topology: flat
  # Flat peer entities linked by FK in request bodies; no deep nested URL paths.

  state_machine_shape: cyclic
  # PermCase FILED<->AUDIT loop and H1BPetition SUBMITTED<->RFE_ISSUED loop are
  # both non-linear cycles; other machines are branching (approve/deny forks).

  relationship_patterns:
    - one_to_many        # Employer -> PWD/PermCase/LCA/Registration/Petition
    - cross_aggregate    # H1BPetition references LCA + Beneficiary + Registration across aggregates
    - polymorphic        # transitions endpoints act on many entity types via to_status

  role_model: segregation_of_duties
  # EmployerAgent files; DOLAnalyst issues PWD & certifies PERM/LCA; USCISOfficer
  # runs the cap lottery, issues RFEs and adjudicates petitions; ComplianceAuditor
  # audits the public-access file. No role may perform another's exclusive step.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: fein, type: string, source: input, description: "Federal Employer Identification Number (9 digits)" }
      - { name: legal_name, type: string, source: input, description: "Sponsoring employer legal name" }
      - { name: employee_count, type: integer, source: input, description: "US full-time-equivalent headcount; drives ACWIA/PL 114-113 fee tiers", constraints: ">= 1" }
      - { name: h1b_dependent, type: boolean, source: input, default: false, description: "Whether the employer is H-1B dependent; drives the PL 114-113 $4000 fee" }
      - { name: total_wage_obligation_cents, type: integer, source: computed, description: "Sum of required_wage_cents over this employer's LCAs whose status == CERTIFIED; starts at 0" }

  - name: PrevailingWageDetermination
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: soc_code, type: string, source: input, description: "SOC/O*NET occupation code, e.g. 15-1252" }
      - { name: job_title, type: string, source: input, description: "Position title" }
      - { name: area_code, type: string, source: input, description: "OFLC area of intended employment code (geographic worksite)" }
      - { name: wage_level, type: enum, source: input, description: "LEVEL_I | LEVEL_II | LEVEL_III | LEVEL_IV" }
      - { name: wage_source, type: enum, source: input, description: "OES | EMPLOYER_SURVEY — selects which annual wage the determination uses" }
      - { name: oes_wage_cents, type: integer, source: input, description: "OES survey annual wage for this SOC/level/area, in cents", constraints: ">= 0" }
      - { name: survey_wage_cents, type: integer, source: input, default: null, description: "Employer-provided survey annual wage in cents; required when wage_source == EMPLOYER_SURVEY" }
      - { name: prevailing_wage_cents, type: integer, source: computed, description: "Annual prevailing wage in cents; equals oes_wage_cents when wage_source==OES else survey_wage_cents; set on issuance (PENDING->ISSUED)" }
      - { name: validity_start, type: datetime, source: input, description: "First day the determination is valid (ISO 8601 UTC)" }
      - { name: validity_end, type: datetime, source: input, description: "Last day the determination is valid (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "PENDING -> ISSUED -> SUPERSEDED | EXPIRED" }

  - name: PermCase
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: pwd_id, type: string, source: input, description: "FK -> PrevailingWageDetermination.id" }
      - { name: job_title, type: string, source: input, description: "Certified position title" }
      - { name: offered_wage_cents, type: integer, source: input, description: "Annual wage the employer will pay, in cents; must be >= PWD.prevailing_wage_cents to recruit", constraints: ">= 0" }
      - { name: recruitment_start, type: datetime, source: system, description: "Set to the logical clock when DRAFT->RECRUITING fires" }
      - { name: recruitment_end, type: datetime, source: system, description: "Set to the logical clock when RECRUITING->QUIET_PERIOD fires" }
      - { name: quiet_period_end, type: datetime, source: computed, description: "recruitment_end + QUIET_PERIOD_DAYS; earliest instant filing is allowed" }
      - { name: filed_date, type: datetime, source: system, description: "Set to the logical clock when QUIET_PERIOD->FILED fires" }
      - { name: priority_date, type: datetime, source: computed, description: "Equals filed_date; the queue position date inherited by a PERM-based I-140" }
      - { name: status, type: enum, source: system, description: "DRAFT -> RECRUITING -> QUIET_PERIOD -> FILED -> AUDIT -> FILED (cycle) -> CERTIFIED | DENIED; RECRUITING->DRAFT on PWD supersede" }

  - name: RecruitmentStep
    parent: null
    common_fields: true
    fields:
      - { name: perm_case_id, type: string, source: input, description: "FK -> PermCase.id" }
      - { name: step_type, type: enum, source: input, description: "JOB_ORDER | NEWSPAPER_AD | PROFESSIONAL_JOURNAL | EMPLOYER_WEBSITE | JOB_FAIR" }
      - { name: start_date, type: datetime, source: input, description: "First day this recruitment activity ran (ISO 8601 UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Last day this recruitment activity ran (ISO 8601 UTC); must be >= start_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VOID (voided when the parent PermCase reverts RECRUITING->DRAFT)" }

  - name: LCA
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: soc_code, type: string, source: input, description: "SOC occupation code" }
      - { name: worksite_areas, type: array, source: input, description: "List of area codes (strings) this LCA covers; length >= 1" }
      - { name: area_wage_map, type: object, source: input, description: "Map of area_code -> annual prevailing wage in cents for every entry in worksite_areas" }
      - { name: offered_wage_cents, type: integer, source: input, description: "Annual wage the employer will pay, in cents", constraints: ">= 0" }
      - { name: prevailing_wage_cents, type: integer, source: input, description: "Annual prevailing wage in cents for the primary worksite (worksite_areas[0])", constraints: ">= 0" }
      - { name: hours_per_week, type: integer, source: input, default: 40, description: "Weekly hours; used to prorate the aggregate wage obligation", constraints: "1..40" }
      - { name: required_wage_cents, type: integer, source: computed, description: "max(prevailing_wage_cents, offered_wage_cents); provisional while DRAFT, locked at certification" }
      - { name: aggregate_wage_obligation_cents, type: integer, source: computed, description: "Sum over worksite_areas of round_half_up(area_wage_map[area] * hours_per_week / 40); round per area then sum" }
      - { name: validity_start, type: datetime, source: input, description: "First day of validity (ISO 8601 UTC)" }
      - { name: validity_end, type: datetime, source: input, description: "Last day of validity (ISO 8601 UTC); must be > validity_start" }
      - { name: has_wage_rate, type: boolean, source: input, default: false, description: "PAF: wage-rate document present" }
      - { name: has_prevailing_wage_doc, type: boolean, source: input, default: false, description: "PAF: prevailing-wage determination document present" }
      - { name: has_notice_of_filing, type: boolean, source: input, default: false, description: "PAF: notice-of-filing document present" }
      - { name: has_actual_wage_memo, type: boolean, source: input, default: false, description: "PAF: actual-wage memorandum present" }
      - { name: paf_completeness_score, type: integer, source: computed, description: "0..100 weighted PAF completeness; each of the four PAF documents is worth PAF_DOC_WEIGHT" }
      - { name: paf_status, type: enum, source: computed, description: "OPEN | COMPLETE | DEFICIENT; set by the audit action" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CERTIFIED -> WITHDRAWN | EXPIRED" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Foreign worker full legal name" }
      - { name: passport_number, type: string, source: input, description: "Passport number (unique per beneficiary)" }
      - { name: current_status_code, type: enum, source: computed, description: "NONE | H1B_ACTIVE | H1B_EXPIRED; derived from the beneficiary's APPROVED H1BPetitions and the logical clock" }
      - { name: status_valid_until, type: datetime, source: computed, description: "Max employment_end over the beneficiary's APPROVED H1BPetitions; null when none" }
      - { name: priority_date, type: datetime, source: computed, description: "Earliest priority_date over the beneficiary's APPROVED I140Petitions (created_at ASC tie-break); null when none" }

  - name: CapProgram
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "H-1B cap fiscal year, e.g. 2027 (unique)" }
      - { name: selection_quota, type: integer, source: input, description: "Total cap seats available for the lottery", constraints: ">= 0" }
      - { name: selected_count, type: integer, source: computed, description: "Count of H1BRegistrations with status SELECTED for this fiscal_year; starts at 0" }
      - { name: available_seats, type: integer, source: computed, description: "selection_quota - selected_count; invariant available_seats + selected_count == selection_quota" }
      - { name: lottery_run, type: boolean, source: system, default: false, description: "True once run-lottery has executed for this program" }

  - name: H1BRegistration
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Cap fiscal year this registration competes in; must match an existing CapProgram" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> SELECTED | NOT_SELECTED; SELECTED -> WITHDRAWN" }

  - name: H1BPetition
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: lca_id, type: string, source: input, description: "FK -> LCA.id" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id" }
      - { name: registration_id, type: string, source: input, description: "FK -> H1BRegistration.id" }
      - { name: worksite_area, type: string, source: input, description: "Area code of intended employment; must be in the LCA.worksite_areas" }
      - { name: employment_start, type: datetime, source: input, description: "Requested employment start (ISO 8601 UTC)" }
      - { name: employment_end, type: datetime, source: input, description: "Requested employment end (ISO 8601 UTC); must be > employment_start" }
      - { name: is_amended, type: boolean, source: input, default: false, description: "Whether this is an amended petition; drives filing-fee waiver of fraud/ACWIA fees" }
      - { name: filing_fee_cents, type: integer, source: computed, description: "Total USCIS filing fee in cents, computed at creation from employer size and flags" }
      - { name: rfe_status, type: enum, source: computed, description: "NONE | ISSUED | RESPONDED; reflects the current RFE cycle" }
      - { name: rfe_issued_date, type: datetime, source: system, description: "Logical clock when the current RFE was issued; null when none" }
      - { name: rfe_due_date, type: datetime, source: computed, description: "rfe_issued_date + RFE_RESPONSE_DAYS (=87) days; response deadline" }
      - { name: rfe_response_date, type: datetime, source: system, description: "Logical clock when the RFE was responded to; null when none" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> RFE_ISSUED -> SUBMITTED (cycle) -> APPROVED | DENIED" }

  - name: I140Petition
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: perm_case_id, type: string, source: input, default: null, description: "FK -> PermCase.id; null for a self-petition (EB1) that carries no PERM" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id" }
      - { name: category, type: enum, source: input, description: "EB1 | EB2 | EB3" }
      - { name: filed_date, type: datetime, source: system, description: "Logical clock when DRAFT->SUBMITTED fires" }
      - { name: priority_date, type: datetime, source: computed, description: "PERM-based (EB2/EB3 with perm_case) = PermCase.priority_date; self-petition (EB1 or no perm_case) = this petition's filed_date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | DENIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PrevailingWageDetermination
    initial_state: PENDING
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /prevailing-wage-determinations/{id}/transitions {to_status: ISSUED}"
        actor: DOLAnalyst
        preconditions:
          - "PWD.status == PENDING"
          - "expected_employer_version matches the parent Employer.version (else ERR_STALE_VERSION)"
          - "If wage_source == EMPLOYER_SURVEY then survey_wage_cents is not null (else ERR_VALIDATION)"
        side_effects:
          - "Set prevailing_wage_cents = (wage_source==OES ? oes_wage_cents : survey_wage_cents) [calc prevailing_wage]"
          - "Any other PWD with the same (employer_id, soc_code, area_code) whose status == ISSUED transitions ISSUED->SUPERSEDED"
          - "increments Employer.version by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a newer PWD for the same (employer_id, soc_code, area_code) is issued"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link1: every PermCase with pwd_id == this PWD whose status IN {DRAFT, RECRUITING, QUIET_PERIOD} transitions to DRAFT (see PermCase RECRUITING->DRAFT / QUIET_PERIOD->DRAFT)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: logical clock advances past validity_end"
        actor: system
        preconditions: ["logical clock > validity_end"]
        side_effects: []

  - entity: PermCase
    initial_state: DRAFT
    terminal_states: [CERTIFIED, DENIED]
    transitions:
      - from: DRAFT
        to: RECRUITING
        trigger: "POST /perm-cases/{id}/transitions {to_status: RECRUITING}"
        actor: EmployerAgent
        preconditions:
          - "PermCase.status == DRAFT"
          - "referenced PWD.status == ISSUED (else ERR_PWD_NOT_ISSUED) [cross-entity PermCase->PWD]"
          - "offered_wage_cents >= PWD.prevailing_wage_cents (else ERR_WAGE_BELOW_PREVAILING) [boundary >=]"
        side_effects:
          - "Set recruitment_start = logical clock"
      - from: RECRUITING
        to: QUIET_PERIOD
        trigger: "POST /perm-cases/{id}/transitions {to_status: QUIET_PERIOD}"
        actor: EmployerAgent
        preconditions:
          - "PermCase.status == RECRUITING"
          - "logical clock - recruitment_start >= RECRUITMENT_MIN_DAYS days (else ERR_RECRUITMENT_TOO_SHORT) [temporal]"
          - "There exists >= 1 ACTIVE RecruitmentStep with step_type == JOB_ORDER and >= 2 ACTIVE RecruitmentStep with step_type == NEWSPAPER_AD (else ERR_RECRUITMENT_INCOMPLETE) [constraint]"
        side_effects:
          - "Set recruitment_end = logical clock"
          - "Set quiet_period_end = recruitment_end + QUIET_PERIOD_DAYS days [calc recruitment_window]"
      - from: QUIET_PERIOD
        to: FILED
        trigger: "POST /perm-cases/{id}/transitions {to_status: FILED}"
        actor: EmployerAgent
        preconditions:
          - "PermCase.status == QUIET_PERIOD"
          - "logical clock >= quiet_period_end (else ERR_QUIET_PERIOD_NOT_ELAPSED) [temporal]"
          - "logical clock <= recruitment_start + PERM_VALIDITY_DAYS days (else ERR_PERM_VALIDITY_EXPIRED) [temporal]"
        side_effects:
          - "Set filed_date = logical clock"
          - "Set priority_date = filed_date"
      - from: FILED
        to: AUDIT
        trigger: "POST /perm-cases/{id}/transitions {to_status: AUDIT}"
        actor: DOLAnalyst
        preconditions: ["PermCase.status == FILED"]
        side_effects: []
      - from: AUDIT
        to: FILED
        trigger: "POST /perm-cases/{id}/transitions {to_status: FILED}"
        actor: EmployerAgent
        preconditions: ["PermCase.status == AUDIT"]
        side_effects: []
        note: "Audit-response cycle: FILED<->AUDIT is the non-linear loop on PermCase."
      - from: FILED
        to: CERTIFIED
        trigger: "POST /perm-cases/{id}/transitions {to_status: CERTIFIED}"
        actor: DOLAnalyst
        preconditions: ["PermCase.status == FILED"]
        side_effects: []
      - from: FILED
        to: DENIED
        trigger: "POST /perm-cases/{id}/transitions {to_status: DENIED}"
        actor: DOLAnalyst
        preconditions: ["PermCase.status == FILED"]
        side_effects:
          - "CASCADE link1: every I140Petition with perm_case_id == this case whose status IN {DRAFT, SUBMITTED} transitions to DENIED (see I140Petition SUBMITTED->DENIED / DRAFT->DENIED)"
      - from: AUDIT
        to: DENIED
        trigger: "POST /perm-cases/{id}/transitions {to_status: DENIED}"
        actor: DOLAnalyst
        preconditions: ["PermCase.status == AUDIT"]
        side_effects:
          - "CASCADE link1: same I140 denial cascade as FILED->DENIED"
      - from: RECRUITING
        to: DRAFT
        trigger: "system: referenced PWD superseded"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link2: every RecruitmentStep with perm_case_id == this case whose status == ACTIVE transitions ACTIVE->VOID"
          - "Clear recruitment_start"
      - from: QUIET_PERIOD
        to: DRAFT
        trigger: "system: referenced PWD superseded"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link2: every ACTIVE RecruitmentStep for this case transitions to VOID"
          - "Clear recruitment_start, recruitment_end, quiet_period_end"

  - entity: RecruitmentStep
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "system: parent PermCase reverts to DRAFT after PWD supersede"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LCA
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /lcas/{id}/transitions {to_status: CERTIFIED}"
        actor: DOLAnalyst
        preconditions:
          - "LCA.status == DRAFT"
          - "offered_wage_cents >= prevailing_wage_cents (else ERR_WAGE_BELOW_PREVAILING) [boundary >=]"
        side_effects:
          - "Lock required_wage_cents = max(prevailing_wage_cents, offered_wage_cents) [calc required_wage, final variant]"
          - "LEDGER: Employer.total_wage_obligation_cents += required_wage_cents [invariant employer_wage_obligation]"
      - from: CERTIFIED
        to: WITHDRAWN
        trigger: "POST /lcas/{id}/transitions {to_status: WITHDRAWN}"
        actor: EmployerAgent
        preconditions: ["LCA.status == CERTIFIED"]
        side_effects:
          - "COMPENSATE: Employer.total_wage_obligation_cents -= required_wage_cents [invariant employer_wage_obligation]"
          - "CASCADE link1: every H1BPetition with lca_id == this LCA whose status IN {DRAFT, SUBMITTED, RFE_ISSUED} transitions to DENIED (see H1BPetition ->DENIED)"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system: logical clock advances past validity_end"
        actor: system
        preconditions: ["logical clock > validity_end"]
        side_effects: []

  - entity: H1BRegistration
    initial_state: SUBMITTED
    terminal_states: [NOT_SELECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SELECTED
        trigger: "system: CapProgram run-lottery selects this registration"
        actor: system
        preconditions: []
        side_effects:
          - "CapProgram.selected_count += 1; CapProgram.available_seats -= 1 [invariant cap_seats]"
      - from: SUBMITTED
        to: NOT_SELECTED
        trigger: "system: CapProgram run-lottery does not select this registration"
        actor: system
        preconditions: []
        side_effects: []
      - from: SELECTED
        to: WITHDRAWN
        trigger: "POST /h1b-registrations/{id}/transitions {to_status: WITHDRAWN}"
        actor: EmployerAgent
        preconditions:
          - "H1BRegistration.status == SELECTED"
          - "No H1BPetition references this registration (else ERR_REGISTRATION_HAS_PETITION) [cross-entity Registration->H1BPetition]"
        side_effects:
          - "COMPENSATE: CapProgram.selected_count -= 1; CapProgram.available_seats += 1 [invariant cap_seats]"

  - entity: H1BPetition
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /h1b-petitions/{id}/transitions {to_status: SUBMITTED}"
        actor: EmployerAgent
        preconditions:
          - "H1BPetition.status == DRAFT"
          - "referenced LCA.status == CERTIFIED (else ERR_LCA_NOT_CERTIFIED) [cross-entity H1BPetition->LCA]"
          - "referenced H1BRegistration.status == SELECTED (else ERR_REGISTRATION_NOT_SELECTED) [cross-entity H1BPetition->Registration]"
          - "worksite_area is in LCA.worksite_areas (else ERR_WORKSITE_NOT_COVERED) [referential]"
        side_effects: []
      - from: SUBMITTED
        to: RFE_ISSUED
        trigger: "POST /h1b-petitions/{id}/transitions {to_status: RFE_ISSUED}"
        actor: USCISOfficer
        preconditions: ["H1BPetition.status == SUBMITTED"]
        side_effects:
          - "Set rfe_status = ISSUED, rfe_issued_date = logical clock, rfe_due_date = rfe_issued_date + RFE_RESPONSE_DAYS days"
      - from: RFE_ISSUED
        to: SUBMITTED
        trigger: "POST /h1b-petitions/{id}/transitions {to_status: SUBMITTED}"
        actor: EmployerAgent
        preconditions:
          - "H1BPetition.status == RFE_ISSUED"
          - "logical clock <= rfe_due_date (else ERR_RFE_EXPIRED) [temporal]"
        side_effects:
          - "Set rfe_status = RESPONDED, rfe_response_date = logical clock"
        note: "Audit/RFE-response cycle: SUBMITTED<->RFE_ISSUED is the non-linear loop on H1BPetition."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /h1b-petitions/{id}/transitions {to_status: APPROVED}"
        actor: USCISOfficer
        preconditions:
          - "H1BPetition.status == SUBMITTED"
          - "No other APPROVED H1BPetition for the same beneficiary_id and worksite_area has an employment interval overlapping [employment_start, employment_end) (half-open; adjacency at the boundary allowed) (else ERR_EMPLOYMENT_OVERLAP) [temporal-overlap Beneficiary]"
        side_effects:
          - "Recompute Beneficiary.current_status_code and Beneficiary.status_valid_until for beneficiary_id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /h1b-petitions/{id}/transitions {to_status: DENIED}"
        actor: USCISOfficer
        preconditions: ["H1BPetition.status == SUBMITTED"]
        side_effects:
          - "CASCADE link2: recompute Beneficiary.current_status_code and status_valid_until for beneficiary_id (loses H1B_ACTIVE if this petition was the source)"
      - from: RFE_ISSUED
        to: DENIED
        trigger: "system: LCA withdrawn (cascade) or logical clock past rfe_due_date"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link2: recompute Beneficiary.current_status_code and status_valid_until for beneficiary_id"
      - from: DRAFT
        to: DENIED
        trigger: "system: referenced LCA withdrawn (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: I140Petition
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /i140-petitions/{id}/transitions {to_status: SUBMITTED}"
        actor: EmployerAgent
        preconditions:
          - "I140Petition.status == DRAFT"
          - "If perm_case_id is not null then referenced PermCase.status == CERTIFIED (else ERR_PERM_NOT_CERTIFIED) [cross-entity I140Petition->PermCase]"
        side_effects:
          - "Set filed_date = logical clock"
          - "Set priority_date per calc priority_date (PERM-based vs self-petition variant)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /i140-petitions/{id}/transitions {to_status: APPROVED}"
        actor: USCISOfficer
        preconditions: ["I140Petition.status == SUBMITTED"]
        side_effects:
          - "Recompute Beneficiary.priority_date for beneficiary_id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /i140-petitions/{id}/transitions {to_status: DENIED}"
        actor: USCISOfficer
        preconditions: ["I140Petition.status == SUBMITTED"]
        side_effects:
          - "CASCADE link2: recompute Beneficiary.priority_date for beneficiary_id"
      - from: DRAFT
        to: DENIED
        trigger: "system: referenced PermCase denied (cascade)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pwd-issue-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /prevailing-wage-determinations/{id}/transitions"
    occ_field: "expected_employer_version"
    description: |
      Issuing a PrevailingWageDetermination (PENDING->ISSUED) whose parent
      Employer.version has advanced since the client last observed it is
      rejected. Issuance supersedes any prior ISSUED determination for the same
      (employer_id, soc_code, area_code) and increments Employer.version, so a
      determination issued against a stale Employer view has been overtaken by a
      newer issuance the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prevailing_wage
    trigger: "PWD PENDING->ISSUED"
    algorithm: threshold
    formula: |
      prevailing_wage_cents = (wage_source == OES) ? oes_wage_cents : survey_wage_cents
    input_set: "The single PWD being issued"
    precision: "integer cents; no rounding"

  - name: required_wage
    trigger: "read of LCA.required_wage_cents; locked at LCA DRAFT->CERTIFIED"
    algorithm: threshold
    formula: |
      required_wage_cents = max(prevailing_wage_cents, offered_wage_cents)
    input_set: "The single LCA"
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "LCA.status == DRAFT"
        difference: "Computed on read using the LCA's CURRENT prevailing_wage_cents field; recomputes if the field changes before certification."
      - name: final
        when: "LCA.status == CERTIFIED"
        difference: "Value is frozen at the instant of certification using the prevailing_wage_cents in effect then; later edits to prevailing_wage_cents do NOT change it. For identical (prevailing, offered) inputs where prevailing was raised between draft and certify, provisional and final diverge."

  - name: aggregate_wage_obligation
    trigger: "read of LCA.aggregate_wage_obligation_cents"
    algorithm: aggregation
    formula: |
      # PIN: round each worksite area FIRST, then sum (round-per-line-item).
      total = 0
      for area in worksite_areas:            # iterate in worksite_areas list order
        per_area = round_half_up(area_wage_map[area] * hours_per_week / 40)
        total = total + per_area
      aggregate_wage_obligation_cents = total
    input_set: "All entries of worksite_areas for this LCA"
    constants:
      FULL_TIME_HOURS: 40
    precision: "round_half_up to whole cents PER AREA before summing; summing rounded per-area values, NOT rounding the grand total"

  - name: h1b_filing_fee
    trigger: "H1BPetition creation (POST /h1b-petitions)"
    algorithm: tiered_pricing
    formula: |
      # PIN evaluation order: base, then conditional add-ons, then amended waiver.
      fee = BASE_FILING_FEE_CENTS                       # 46000
      if not is_amended:
        fee = fee + FRAUD_FEE_CENTS                     # + 50000
        fee = fee + (ACWIA_SMALL_CENTS if employer.employee_count <= ACWIA_SIZE_THRESHOLD else ACWIA_LARGE_CENTS)  # 75000 or 150000
        if employer.employee_count > PL_SIZE_THRESHOLD and employer.h1b_dependent == true:
          fee = fee + PL_114_113_FEE_CENTS              # + 400000
      # amended petitions pay only BASE_FILING_FEE_CENTS
      filing_fee_cents = fee
    input_set: "The employer referenced by employer_id plus this petition's is_amended flag"
    constants:
      BASE_FILING_FEE_CENTS: 46000
      FRAUD_FEE_CENTS: 50000
      ACWIA_SMALL_CENTS: 75000
      ACWIA_LARGE_CENTS: 150000
      ACWIA_SIZE_THRESHOLD: 25
      PL_SIZE_THRESHOLD: 50
      PL_114_113_FEE_CENTS: 400000
    precision: "integer cents"

  - name: priority_date
    trigger: "I140Petition DRAFT->SUBMITTED"
    algorithm: chronological
    formula: |
      if perm_case_id is not null and category in {EB2, EB3}:
        priority_date = PermCase(perm_case_id).priority_date   # inherited PERM filing date
      else:
        priority_date = this.filed_date                        # self-petition uses I-140 filing date
    input_set: "This petition and, when PERM-based, its PermCase"
    variants:
      - name: perm_based
        when: "perm_case_id not null AND category in {EB2, EB3}"
        difference: "Priority date is the earlier PERM filed_date, giving an earlier queue position."
      - name: self_petition
        when: "category == EB1 OR perm_case_id is null"
        difference: "Priority date is the later I-140 filed_date. For identical filing timestamps, the two variants resolve to different dates whenever the PERM was filed before the I-140."

  - name: cap_seat_accounting
    trigger: "any H1BRegistration status change and any read of CapProgram"
    algorithm: aggregation
    formula: |
      selected_count = count(H1BRegistration where fiscal_year == program.fiscal_year and status == SELECTED)
      available_seats = selection_quota - selected_count
    input_set: "All H1BRegistrations sharing this program's fiscal_year"
    precision: "integer counts; invariant available_seats + selected_count == selection_quota"

  - name: employer_wage_obligation
    trigger: "LCA DRAFT->CERTIFIED (+=) and LCA CERTIFIED->WITHDRAWN (-=)"
    algorithm: aggregation
    formula: |
      total_wage_obligation_cents = sum(required_wage_cents for LCA where employer_id == employer.id and status == CERTIFIED)
    input_set: "All CERTIFIED LCAs for this employer"
    precision: "integer cents; invariant: total_wage_obligation_cents equals the summed required_wage_cents of currently-CERTIFIED LCAs"

  - name: lottery_selection
    trigger: "POST /cap-programs/{id}/run-lottery"
    algorithm: waterfall_allocation
    formula: |
      # Deterministic 'lottery': fill seats in registration age order (NOT random).
      candidates = [r for r in H1BRegistration
                    if r.fiscal_year == program.fiscal_year and r.status == SUBMITTED]
      candidates = sort(candidates, key = created_at ASC, tie_break = created_at ASC only)
      for i, r in enumerate(candidates):
        if i < available_seats:   # available_seats == selection_quota when no prior selections
          r.status = SELECTED
        else:
          r.status = NOT_SELECTED
      program.lottery_run = true
    input_set: "SUBMITTED registrations whose fiscal_year matches the program"
    constants: {}
    precision: "integer; selection order is created_at ASC (NEVER id); empty candidate set selects nothing and leaves available_seats == selection_quota"

  - name: recruitment_window
    trigger: "PermCase RECRUITING->QUIET_PERIOD (sets quiet_period_end); checked at QUIET_PERIOD->FILED"
    algorithm: interval_merge
    formula: |
      quiet_period_end = recruitment_end + QUIET_PERIOD_DAYS days
      recruitment_ok  = (recruitment_end - recruitment_start) >= RECRUITMENT_MIN_DAYS days
      filing_open     = (clock >= quiet_period_end) and (clock <= recruitment_start + PERM_VALIDITY_DAYS days)
    input_set: "The single PermCase and the logical clock"
    constants:
      RECRUITMENT_MIN_DAYS: 30
      QUIET_PERIOD_DAYS: 30
      PERM_VALIDITY_DAYS: 180
    precision: "day granularity on the logical clock; >= boundaries are inclusive"

  - name: paf_completeness
    trigger: "POST /lcas/{id}/audit-paf"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if has_wage_rate:            score += PAF_DOC_WEIGHT
      if has_prevailing_wage_doc:  score += PAF_DOC_WEIGHT
      if has_notice_of_filing:     score += PAF_DOC_WEIGHT
      if has_actual_wage_memo:     score += PAF_DOC_WEIGHT
      paf_completeness_score = score
      paf_status = (score == 100) ? COMPLETE : DEFICIENT
    input_set: "The four PAF boolean flags on the LCA"
    constants:
      PAF_DOC_WEIGHT: 25
    precision: "integer 0..100"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per RBAC; entity_backed EmployerAgent must own the target employer's resources (resource.employer_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path {id} and every FK in the body resolve to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or FK body field"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric fields in range, validity_end > validity_start, end_date >= start_date, employment_end > employment_start, area_wage_map covers every worksite_areas entry, survey_wage_cents present when wage_source==EMPLOYER_SURVEY"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: business_constraint
    check: "H1BRegistration uniqueness: no existing registration with the same (employer_id, beneficiary_id, fiscal_year)"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /h1b-registrations"

  - priority: 6
    category: state
    check: "OCC: expected_employer_version equals current Employer.version on PWD issuance"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /prevailing-wage-determinations/{id}/transitions"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /transitions, /run-lottery, /rfes, /audit-paf endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: PWD.status==ISSUED for PermCase recruiting (ERR_PWD_NOT_ISSUED); LCA.status==CERTIFIED for petition submit (ERR_LCA_NOT_CERTIFIED); H1BRegistration.status==SELECTED for petition submit (ERR_REGISTRATION_NOT_SELECTED); PermCase.status==CERTIFIED for I-140 submit (ERR_PERM_NOT_CERTIFIED); worksite_area in LCA.worksite_areas (ERR_WORKSITE_NOT_COVERED); registration has no petition before withdraw (ERR_REGISTRATION_HAS_PETITION)"
    error_id: "ERR_PWD_NOT_ISSUED | ERR_LCA_NOT_CERTIFIED | ERR_REGISTRATION_NOT_SELECTED | ERR_PERM_NOT_CERTIFIED | ERR_WORKSITE_NOT_COVERED | ERR_REGISTRATION_HAS_PETITION"
    http_status: 409
    applies_to: "PermCase/H1BPetition/I140Petition/H1BRegistration transitions"

  - priority: 9
    category: business_temporal
    check: "Time-window gates on the logical clock: recruitment >= 30 days (ERR_RECRUITMENT_TOO_SHORT); quiet period elapsed (ERR_QUIET_PERIOD_NOT_ELAPSED); PERM validity <= 180 days (ERR_PERM_VALIDITY_EXPIRED); RFE response on/before due date (ERR_RFE_EXPIRED)"
    error_id: "ERR_RECRUITMENT_TOO_SHORT | ERR_QUIET_PERIOD_NOT_ELAPSED | ERR_PERM_VALIDITY_EXPIRED | ERR_RFE_EXPIRED"
    http_status: 422
    applies_to: "PermCase and H1BPetition transitions"

  - priority: 10
    category: business_constraint
    check: "Structural recruitment completeness before quiet period: >=1 ACTIVE JOB_ORDER and >=2 ACTIVE NEWSPAPER_AD steps"
    error_id: ERR_RECRUITMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /perm-cases/{id}/transitions {to_status: QUIET_PERIOD}"

  - priority: 11
    category: business_temporal
    check: "Recruitment-step interval overlap: two ACTIVE steps of the same step_type on one PermCase may not overlap; intervals are CLOSED [start_date, end_date] so touching endpoints (end==start) conflict"
    error_id: ERR_RECRUITMENT_STEP_OVERLAP
    http_status: 409
    applies_to: "POST /recruitment-steps"

  - priority: 12
    category: business_temporal
    check: "Employment interval overlap: two APPROVED H1BPetitions for the same beneficiary_id and worksite_area may not overlap; intervals are HALF-OPEN [employment_start, employment_end) so adjacency (end==start) is allowed"
    error_id: ERR_EMPLOYMENT_OVERLAP
    http_status: 409
    applies_to: "POST /h1b-petitions/{id}/transitions {to_status: APPROVED}"

  - priority: 13
    category: business_fiscal
    check: "Wage floor: offered_wage_cents >= prevailing wage (PWD.prevailing_wage_cents for PermCase recruiting; LCA.prevailing_wage_cents for LCA certification)"
    error_id: ERR_WAGE_BELOW_PREVAILING
    http_status: 422
    applies_to: "POST /perm-cases/{id}/transitions {to_status: RECRUITING}; POST /lcas/{id}/transitions {to_status: CERTIFIED}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Employer ----
  - method: POST
    path: "/employers"
    description: "Register a sponsoring Employer. X-User-ID need not equal any resource on this call."
    roles: [EmployerAgent]
    code: 201
    input: [fein, legal_name, employee_count, "h1b_dependent?"]
    output: Employer
    side_effects: ["total_wage_obligation_cents=0, version=1"]
  - method: GET
    path: "/employers/{id}"
    description: "Fetch an Employer"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # ---- PrevailingWageDetermination ----
  - method: POST
    path: "/prevailing-wage-determinations"
    description: "Submit a prevailing-wage determination request (status PENDING)"
    roles: [EmployerAgent]
    code: 201
    input: [employer_id, soc_code, job_title, area_code, wage_level, wage_source, oes_wage_cents, "survey_wage_cents?", validity_start, validity_end]
    output: PrevailingWageDetermination
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/prevailing-wage-determinations/{id}"
    description: "Fetch a PWD"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: PrevailingWageDetermination
    side_effects: []
  - method: GET
    path: "/prevailing-wage-determinations"
    description: "List PWDs; filter by employer_id (reverse-reachability for PWD.employer_id) or status"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["employer_id?", "status?", "limit?", "offset?"]
    output: PrevailingWageDetermination[]
    side_effects: []
  - method: POST
    path: "/prevailing-wage-determinations/{id}/transitions"
    description: "DOL transitions a PWD (ISSUED with OCC/supersede; SUPERSEDED/EXPIRED are system-only and rejected here)"
    roles: [DOLAnalyst]
    code: 200
    input: [to_status, expected_employer_version]
    output: PrevailingWageDetermination
    side_effects: ["On ISSUED: set prevailing_wage_cents [calc prevailing_wage]; supersede prior ISSUED PWD for same (employer_id,soc_code,area_code) with cascade; increments Employer.version by 1"]

  # ---- PermCase ----
  - method: POST
    path: "/perm-cases"
    description: "Create a PERM labor-certification case (status DRAFT)"
    roles: [EmployerAgent]
    code: 201
    input: [employer_id, pwd_id, job_title, offered_wage_cents]
    output: PermCase
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/perm-cases/{id}"
    description: "Fetch a PermCase"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: PermCase
    side_effects: []
  - method: GET
    path: "/perm-cases"
    description: "List PermCases; filter by employer_id or pwd_id (reverse-reachability) or status"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["employer_id?", "pwd_id?", "status?", "limit?", "offset?"]
    output: PermCase[]
    side_effects: []
  - method: POST
    path: "/perm-cases/{id}/transitions"
    description: "Drive a PermCase through recruitment/quiet-period/filing/audit/certify/deny"
    roles: [EmployerAgent, DOLAnalyst]
    code: 200
    input: [to_status]
    output: PermCase
    side_effects: ["Per PermCase state machine incl. recruitment_window calc, filed_date/priority_date stamping, and I-140 denial cascade"]

  # ---- RecruitmentStep ----
  - method: POST
    path: "/recruitment-steps"
    description: "Record a recruitment activity on a PermCase (status ACTIVE)"
    roles: [EmployerAgent]
    code: 201
    input: [perm_case_id, step_type, start_date, end_date]
    output: RecruitmentStep
    side_effects: ["status=ACTIVE; rejected on same-type interval overlap"]
  - method: GET
    path: "/recruitment-steps/{id}"
    description: "Fetch a RecruitmentStep"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: RecruitmentStep
    side_effects: []
  - method: GET
    path: "/recruitment-steps"
    description: "List recruitment steps; filter by perm_case_id (reverse-reachability for RecruitmentStep.perm_case_id)"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["perm_case_id?", "status?", "limit?", "offset?"]
    output: RecruitmentStep[]
    side_effects: []

  # ---- LCA ----
  - method: POST
    path: "/lcas"
    description: "Create a Labor Condition Application (status DRAFT)"
    roles: [EmployerAgent]
    code: 201
    input: [employer_id, soc_code, worksite_areas, area_wage_map, offered_wage_cents, prevailing_wage_cents, "hours_per_week?", validity_start, validity_end, "has_wage_rate?", "has_prevailing_wage_doc?", "has_notice_of_filing?", "has_actual_wage_memo?"]
    output: LCA
    side_effects: ["status=DRAFT; paf_status=OPEN; required_wage_cents provisional [calc required_wage]"]
  - method: GET
    path: "/lcas/{id}"
    description: "Fetch an LCA (includes required_wage_cents, aggregate_wage_obligation_cents, paf fields)"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: LCA
    side_effects: []
  - method: GET
    path: "/lcas"
    description: "List LCAs; filter by employer_id (reverse-reachability) or status"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["employer_id?", "status?", "limit?", "offset?"]
    output: LCA[]
    side_effects: []
  - method: PATCH
    path: "/lcas/{id}"
    description: "Edit a DRAFT LCA (e.g. correct prevailing/offered wage); recomputes provisional required_wage_cents. Rejected unless status==DRAFT."
    roles: [EmployerAgent]
    code: 200
    input: ["prevailing_wage_cents?", "offered_wage_cents?", "area_wage_map?", "hours_per_week?", "has_wage_rate?", "has_prevailing_wage_doc?", "has_notice_of_filing?", "has_actual_wage_memo?"]
    output: LCA
    side_effects: ["required_wage_cents recomputed provisionally [calc required_wage]; aggregate_wage_obligation_cents recomputed"]
  - method: POST
    path: "/lcas/{id}/transitions"
    description: "Certify (DOL) / withdraw (Employer) an LCA"
    roles: [EmployerAgent, DOLAnalyst]
    code: 200
    input: [to_status]
    output: LCA
    side_effects: ["CERTIFIED: lock required_wage_cents, Employer.total_wage_obligation_cents += required_wage_cents; WITHDRAWN: -= required_wage_cents and cascade H1BPetition -> DENIED"]
  - method: POST
    path: "/lcas/{id}/audit-paf"
    description: "Compliance audit of the public-access file; recomputes paf_completeness_score and paf_status"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: LCA
    side_effects: ["Set paf_completeness_score [calc paf_completeness]; paf_status = COMPLETE if 100 else DEFICIENT"]

  # ---- Beneficiary ----
  - method: POST
    path: "/beneficiaries"
    description: "Register a foreign-worker Beneficiary"
    roles: [EmployerAgent]
    code: 201
    input: [full_name, passport_number]
    output: Beneficiary
    side_effects: ["current_status_code=NONE"]
  - method: GET
    path: "/beneficiaries/{id}"
    description: "Fetch a Beneficiary (includes current_status_code, status_valid_until, priority_date)"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  # ---- CapProgram ----
  - method: POST
    path: "/cap-programs"
    description: "Create the H-1B cap program for a fiscal year"
    roles: [USCISOfficer]
    code: 201
    input: [fiscal_year, selection_quota]
    output: CapProgram
    side_effects: ["selected_count=0, available_seats=selection_quota, lottery_run=false"]
  - method: GET
    path: "/cap-programs/{id}"
    description: "Fetch a CapProgram (includes selected_count, available_seats)"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: CapProgram
    side_effects: []
  - method: POST
    path: "/cap-programs/{id}/run-lottery"
    description: "Run the deterministic cap lottery for the program's fiscal year"
    roles: [USCISOfficer]
    code: 200
    input: []
    output: CapProgram
    side_effects: ["SUBMITTED registrations selected in created_at ASC order up to selection_quota [calc lottery_selection]; sets each registration SELECTED/NOT_SELECTED; lottery_run=true; empty candidate set selects nothing"]

  # ---- H1BRegistration ----
  - method: POST
    path: "/h1b-registrations"
    description: "Register a beneficiary for the cap lottery (status SUBMITTED)"
    roles: [EmployerAgent]
    code: 201
    input: [employer_id, beneficiary_id, fiscal_year]
    output: H1BRegistration
    side_effects: ["status=SUBMITTED; rejected on duplicate (employer_id,beneficiary_id,fiscal_year)"]
  - method: GET
    path: "/h1b-registrations/{id}"
    description: "Fetch an H1BRegistration"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: H1BRegistration
    side_effects: []
  - method: GET
    path: "/h1b-registrations"
    description: "List registrations; filter by employer_id or beneficiary_id (reverse-reachability) or fiscal_year/status"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["employer_id?", "beneficiary_id?", "fiscal_year?", "status?", "limit?", "offset?"]
    output: H1BRegistration[]
    side_effects: []
  - method: POST
    path: "/h1b-registrations/{id}/transitions"
    description: "Withdraw a SELECTED registration (compensating cap-seat return)"
    roles: [EmployerAgent]
    code: 200
    input: [to_status]
    output: H1BRegistration
    side_effects: ["WITHDRAWN: CapProgram.selected_count -= 1; available_seats += 1 [invariant cap_seats]"]

  # ---- H1BPetition ----
  - method: POST
    path: "/h1b-petitions"
    description: "Create an H-1B petition (status DRAFT); computes filing_fee_cents"
    roles: [EmployerAgent]
    code: 201
    input: [employer_id, lca_id, beneficiary_id, registration_id, worksite_area, employment_start, employment_end, "is_amended?"]
    output: H1BPetition
    side_effects: ["status=DRAFT; rfe_status=NONE; filing_fee_cents set [calc h1b_filing_fee]"]
  - method: GET
    path: "/h1b-petitions/{id}"
    description: "Fetch an H1BPetition (includes filing_fee_cents, rfe_status, rfe_due_date)"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: H1BPetition
    side_effects: []
  - method: GET
    path: "/h1b-petitions"
    description: "List petitions; filter by employer_id/lca_id/beneficiary_id/registration_id (reverse-reachability) or status"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["employer_id?", "lca_id?", "beneficiary_id?", "registration_id?", "status?", "limit?", "offset?"]
    output: H1BPetition[]
    side_effects: []
  - method: POST
    path: "/h1b-petitions/{id}/transitions"
    description: "Submit (Employer), issue RFE / approve / deny (USCIS), or respond to RFE (Employer)"
    roles: [EmployerAgent, USCISOfficer]
    code: 200
    input: [to_status]
    output: H1BPetition
    side_effects: ["Per H1BPetition state machine incl. RFE cycle, employment-overlap check on APPROVED, and Beneficiary status recompute"]

  # ---- I140Petition ----
  - method: POST
    path: "/i140-petitions"
    description: "Create an I-140 immigrant petition (status DRAFT)"
    roles: [EmployerAgent]
    code: 201
    input: [employer_id, beneficiary_id, category, "perm_case_id?"]
    output: I140Petition
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/i140-petitions/{id}"
    description: "Fetch an I140Petition (includes priority_date)"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: I140Petition
    side_effects: []
  - method: GET
    path: "/i140-petitions"
    description: "List I-140 petitions; filter by employer_id/perm_case_id/beneficiary_id (reverse-reachability) or status"
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: ["employer_id?", "perm_case_id?", "beneficiary_id?", "status?", "limit?", "offset?"]
    output: I140Petition[]
    side_effects: []
  - method: POST
    path: "/i140-petitions/{id}/transitions"
    description: "Submit (Employer), approve / deny (USCIS)"
    roles: [EmployerAgent, USCISOfficer]
    code: 200
    input: [to_status]
    output: I140Petition
    side_effects: ["Per I140Petition state machine incl. priority_date [calc priority_date] and Beneficiary.priority_date recompute"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Setting the clock evaluates due expiries (PWD/LCA validity_end, RFE due date)."
    roles: [EmployerAgent, DOLAnalyst, USCISOfficer, ComplianceAuditor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["ISSUED PWDs past validity_end -> EXPIRED; CERTIFIED LCAs past validity_end -> EXPIRED; RFE_ISSUED petitions past rfe_due_date -> DENIED with Beneficiary recompute"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or EmployerAgent acting on another employer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or a referenced FK does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number, validity_end<=validity_start, end_date<start_date, employment_end<=employment_start, area_wage_map missing a worksite area, or survey_wage_cents absent for EMPLOYER_SURVEY" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A registration already exists for (employer_id, beneficiary_id, fiscal_year)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_employer_version does not match current Employer.version on PWD issuance" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_PWD_NOT_ISSUED, http: 409, condition: "PermCase recruiting requires the referenced PWD to be ISSUED" }
  - { id: ERR_LCA_NOT_CERTIFIED, http: 409, condition: "H-1B petition submit requires the referenced LCA to be CERTIFIED" }
  - { id: ERR_REGISTRATION_NOT_SELECTED, http: 409, condition: "H-1B petition submit requires the referenced registration to be SELECTED" }
  - { id: ERR_PERM_NOT_CERTIFIED, http: 409, condition: "I-140 submit with a perm_case requires that PermCase to be CERTIFIED" }
  - { id: ERR_WORKSITE_NOT_COVERED, http: 409, condition: "Petition worksite_area is not in the LCA's worksite_areas" }
  - { id: ERR_REGISTRATION_HAS_PETITION, http: 409, condition: "Cannot withdraw a registration that already has an H-1B petition" }
  - { id: ERR_RECRUITMENT_TOO_SHORT, http: 422, condition: "Recruitment ran fewer than RECRUITMENT_MIN_DAYS (30) days" }
  - { id: ERR_QUIET_PERIOD_NOT_ELAPSED, http: 422, condition: "PERM filing attempted before quiet_period_end" }
  - { id: ERR_PERM_VALIDITY_EXPIRED, http: 422, condition: "PERM filing attempted more than PERM_VALIDITY_DAYS (180) days after recruitment_start" }
  - { id: ERR_RFE_EXPIRED, http: 422, condition: "RFE response attempted after rfe_due_date" }
  - { id: ERR_RECRUITMENT_INCOMPLETE, http: 422, condition: "Quiet period entered without >=1 ACTIVE JOB_ORDER and >=2 ACTIVE NEWSPAPER_AD steps" }
  - { id: ERR_RECRUITMENT_STEP_OVERLAP, http: 409, condition: "A new recruitment step's closed interval overlaps (or touches) another ACTIVE step of the same step_type on the case" }
  - { id: ERR_EMPLOYMENT_OVERLAP, http: 409, condition: "Approving a petition whose half-open employment interval overlaps another APPROVED petition for the same beneficiary_id and worksite_area" }
  - { id: ERR_WAGE_BELOW_PREVAILING, http: 422, condition: "offered_wage_cents is below the applicable prevailing wage" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EmployerAgent
    description: "Acts on behalf of a sponsoring employer: files PWD requests, PERM cases, recruitment steps, LCAs, cap registrations, and H-1B/I-140 petitions; responds to audits and RFEs. May only touch resources whose employer_id equals its own employer id."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /employers"
      - "POST /prevailing-wage-determinations"
      - "POST /perm-cases"
      - "POST /recruitment-steps"
      - "POST /lcas"
      - "POST /beneficiaries"
      - "POST /h1b-registrations"
      - "POST /h1b-petitions"
      - "POST /i140-petitions"
      - "POST /perm-cases/{id}/transitions {RECRUITING|QUIET_PERIOD|FILED(from AUDIT)}"
      - "POST /lcas/{id}/transitions {WITHDRAWN}"
      - "POST /h1b-registrations/{id}/transitions {WITHDRAWN}"
      - "POST /h1b-petitions/{id}/transitions {SUBMITTED (file and RFE response)}"
      - "POST /i140-petitions/{id}/transitions {SUBMITTED}"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: DOLAnalyst
    description: "Department of Labor analyst: issues prevailing-wage determinations and adjudicates PERM cases (audit/certify/deny) and LCA certification."
    identity: opaque
    exclusive_operations:
      - "POST /prevailing-wage-determinations/{id}/transitions {ISSUED}"
      - "POST /perm-cases/{id}/transitions {AUDIT|CERTIFIED|DENIED}"
      - "POST /lcas/{id}/transitions {CERTIFIED}"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: USCISOfficer
    description: "USCIS adjudicator: creates the cap program, runs the lottery, issues RFEs, and approves/denies H-1B and I-140 petitions."
    identity: opaque
    exclusive_operations:
      - "POST /cap-programs"
      - "POST /cap-programs/{id}/run-lottery"
      - "POST /h1b-petitions/{id}/transitions {RFE_ISSUED|APPROVED|DENIED}"
      - "POST /i140-petitions/{id}/transitions {APPROVED|DENIED}"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ComplianceAuditor
    description: "Public-access-file compliance auditor: runs PAF audits on LCAs."
    identity: opaque
    exclusive_operations:
      - "POST /lcas/{id}/audit-paf"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
