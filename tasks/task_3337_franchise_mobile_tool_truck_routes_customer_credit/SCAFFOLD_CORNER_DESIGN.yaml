            - "the immediately following account read reports principal_balance_cents == 45338 and credit_available_cents == 4662"
            - "the technician read reports revolving_used_cents == 45338 in the same round trip"
            - "the franchisee read reports outstanding_credit_cents == 45338 with no settling delay"

