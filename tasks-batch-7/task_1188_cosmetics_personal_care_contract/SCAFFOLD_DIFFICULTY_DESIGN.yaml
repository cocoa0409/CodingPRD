              captures: { e: $.data.error_id }
          assert:
            - "Allocation of 500 from the unwaived 100-unit variant lot returns error_id ERR_VARIANT_WAIVER_REQUIRED (not ERR_LOT_INSUFFICIENT_QUANTITY)"

  # ===================================================================
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ph_and_viscosity_exactly_at_tolerance_pass
        grounds:
          - calculations.ipc_evaluation
          - "endpoints.POST /cosmfg/batches/{id}/ipc-checks"
        distinguishing_aspect: |
          Boundary metric = continuous measurement delta on the IPC endpoint:
          |6.0 - 5.5| == 0.5 == ph_tolerance and |4400 - 4000| == 400 == the 10%
          viscosity band both PASS (<=, not <); one tick beyond (4401) FAILS.
        test_recipe:
          setup:
            - "CONFIRMED order with a MIXING 100kg batch (formula: viscosity 4000 +/-10%, pH 5.5 +/-0.5)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4400 }
              as: QAManager
              as_user_id: "qa-1"
              captures: { v_res: $.data.result }
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "PH", measured_value: 6.0 }
              as: QAManager
              as_user_id: "qa-1"
              captures: { p_res: $.data.result }
            - call: "GET /cosmfg/batches/${bt}"
              as: QAManager
              captures: { bt_st: $.data.status }
          assert:
            - "VISCOSITY 4400 (exactly at band edge) result == PASS"
            - "PH 6.0 (exactly at tolerance) result == PASS"
            - "Batch.${bt}.status == IPC_PASSED"

      - name: requested_units_equals_minimum_run_passes
        grounds:
          - validations[priority=30]
          - "endpoints.POST /cosmfg/production-orders"
        distinguishing_aspect: |
          Boundary metric = integer unit count on the order-create endpoint
          (distinct from the continuous IPC delta): requested_units == 1000 ==
          minimum_run_units is accepted (>=), while 999 is rejected with
          ERR_BELOW_MINIMUM_RUN.
        test_recipe:
          setup:
            - "Customer with minimum_run_units 1000; ACTIVE formula"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
