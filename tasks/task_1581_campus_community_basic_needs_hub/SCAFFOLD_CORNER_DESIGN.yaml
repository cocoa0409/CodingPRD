            - call: "POST /grant-applications/${g1_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "${rev_id}"
            - call: "POST /grant-applications/${g1_id}/approve"
              payload: { expected_fund_version: "${f_v0}" }
              as: GrantReviewer
