  # ===================================================================================
  # CONSISTENCY MODEL — complexity_profile.consistency_model is `immediate`, so every
  # denormalised counter and computed field must be correct in the SAME response that
  # caused it to move; nothing is allowed to lag behind a later read.
  # ===================================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_of_every_denormalised_counter_and_computed_score
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Corridor.fields.complaint_total_count
          - entities.Corridor.fields.complaint_open_count
          - entities.Corridor.fields.complaint_terminal_count
          - entities.Requester.fields.open_complaint_count
          - calculations.corridor_complaint_count_12mo
          - calculations.corridor_priority_score
        distinguishing_aspect: "Under `immediate` there is no reconciliation step to wait for: the corridor's complaint buckets and the requester's open counter are already correct on the very next read after each complaint write, and the screening and selection responses THEMSELVES carry a priority_score computed from complaints filed seconds earlier in the same run. The recipe also pins that immediacy does not mean naivety — a complaint closed with NO_ACTION raises complaint_total_count to 2 while complaint_count_12mo stays 1, so the score recomputed at selection time is unchanged at 92.50."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One never-retimed intersection i1 (avg_plan_age_days := NEVER_RETIMED_AGE_DAYS 3650) as the single member of ARTERIAL corridor c1 with annual_volume_change_pct 20.0, and one registered requester r1."
            - "Score arithmetic (identical for both variants because the single member is READY): plan_age_component min(1.0, 3650 / 1825) == 1.0; volume_component min(1.0, 20.0 / 25.0) == 0.8; complaint_component min(1.0, 1 / 20) == 0.05; raw == (0.45 * 1.0 + 0.35 * 0.8 + 0.20 * 0.05) * 1.25 == 0.74 * 1.25 == 0.925; priority_score == round_half_up(0.925 * 100.0, 2) == 92.50."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id, c1_total0: $.data.complaint_total_count, c1_score0: $.data.priority_score, c1_variant0: $.data.priority_score_variant }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
              captures: { c1_seq: $.data.sequence_index }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Dana Reyes", email: "dana@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id, r1_open0: $.data.open_complaint_count }
          trigger:
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c1_id}", category: "COORDINATION", narrative: "Northbound platoon stops at every signal in the morning." }
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { cmp1_id: $.data.id, cmp1_status: $.data.status, cmp1_received: $.data.received_at }
            - call: "GET /signal-ops/corridors/${c1_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { c1_total1: $.data.complaint_total_count, c1_open1: $.data.complaint_open_count, c1_linked1: $.data.complaint_linked_count, c1_term1: $.data.complaint_terminal_count }
            - call: "GET /signal-ops/requesters/${r1_id}"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { r1_open1: $.data.open_complaint_count }
            - call: "POST /signal-ops/complaints/${cmp1_id}/triage"
              payload: { disposition: "TRIAGE", note: "Corridor is already on the retiming shortlist." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cmp1_status2: $.data.status }
            - call: "GET /signal-ops/corridors/${c1_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { c1_total2: $.data.complaint_total_count, c1_open2: $.data.complaint_open_count, c1_term2: $.data.complaint_terminal_count }
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { c1_sel1: $.data.selection_status, c1_mc: $.data.member_count, c1_age: $.data.avg_plan_age_days, c1_12mo1: $.data.complaint_count_12mo, c1_score1: $.data.priority_score, c1_variant1: $.data.priority_score_variant, c1_screened_at: $.data.screened_at }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c1_id}", category: "OTHER", narrative: "Unrelated streetlight question." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cmp2_id: $.data.id, cmp2_status: $.data.status }
            - call: "POST /signal-ops/complaints/${cmp2_id}/triage"
              payload: { disposition: "NO_ACTION", note: "Not a signal timing matter; referred to street lighting." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cmp2_status2: $.data.status }
            - call: "GET /signal-ops/corridors/${c1_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { c1_total3: $.data.complaint_total_count, c1_open3: $.data.complaint_open_count, c1_term3: $.data.complaint_terminal_count }
            - call: "GET /signal-ops/requesters/${r1_id}"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { r1_open2: $.data.open_complaint_count }
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Score clears the 50.0 programming threshold." }
              as: SignalOpsAdmin
              captures: { c1_sel2: $.data.selection_status, c1_12mo2: $.data.complaint_count_12mo, c1_score2: $.data.priority_score, c1_variant2: $.data.priority_score_variant }
          assert:
            - "${c1_total0} == 0, ${c1_score0} == 0.00 with ${c1_variant0} == null and ${r1_open0} == 0 — the declared defaults, present in the create responses themselves"
            - "${c1_seq} == 1 — the membership row is returned by its own create response"
            - "${cmp1_status} == OPEN with ${cmp1_received} == 2026-08-01T00:00:00Z"
            - "${c1_total1} == 1, ${c1_open1} == 1, ${c1_linked1} == 0 and ${c1_term1} == 0 — the corridor's buckets are already correct on the first read after the filing, with no lag"
            - "${r1_open1} == 1 — the requester's denormalised counter moved in the same write"
            - "${cmp1_status2} == TRIAGED, and ${c1_total2} == 1 with ${c1_open2} == 1 and ${c1_term2} == 0 — OPEN and TRIAGED share the open bucket, so the immediate refresh correctly moves nothing"
            - "${c1_sel1} == SCREENED with ${c1_mc} == 1, ${c1_age} == 3650, ${c1_12mo1} == 1 and ${c1_score1} == 92.50 labelled ${c1_variant1} == SCREENING — the score is carried by the screen response itself, computed from the complaint filed moments earlier"
            - "${c1_screened_at} == 2026-08-01T00:00:00Z"
            - "${cmp2_status} == OPEN then ${cmp2_status2} == CLOSED_NO_ACTION"
            - "${c1_total3} == 2, ${c1_open3} == 1 and ${c1_term3} == 1 — every bucket is again correct on the next read, and total + buckets stay partitioned"
            - "${r1_open2} == 1 — the closed complaint left the requester's open counter alone"
            - "${c1_sel2} == SELECTED with ${c1_12mo2} == 1 (CLOSED_NO_ACTION is excluded from the 12-month window even though complaint_total_count is 2), so ${c1_score2} == 92.50 again, now labelled ${c1_variant2} == PROGRAMMING"
