scenario: |
  Campus shuttle bus dispatch system: route planning with route definition (start/end/intermediate stops),
  route-distance and time estimation, peak-and-off-peak frequency, multi-route network coordination, and
  route-version control; stop management with stop profile, location coordinates, shelter and amenity
  records, on-shelf and off-shelf workflow, and stop-level capacity reference; vehicle scheduling with
  vehicle ledger, driver assignment, daily run-sheet generation, vehicle-rotation rules, maintenance-period
  blocking, and substitute-vehicle arrangement; employee ride reservation with available-route and slot
  booking, single-employee daily reservation limit, cancellation rules, no-show penalty, and waitlist for
  overbooked runs; actual ridership records with on-board check-in (QR/card/face), boarding and alighting
  stop records, ridership statistics, no-show tracking, and reservation-vs-actual matching; delay handling
  with delay-cause classification (traffic/breakdown/weather), delay notification dispatch,
  alternative-vehicle dispatch, downstream-stop adjustment, and delay-statistics analysis; cost allocation
  with employee-self-pay or department-paid modes, department-level allocation rules, monthly bill
  generation, and refund handling; event-driven synchronization with HR, IM, and payment systems; audit
  logging for reservation changes and delay records.

domain_name: campus-shuttle-dispatch
api_prefix: /shuttle

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - ops_run_checkpoint
    - rate_threshold_triggers
    - waterfall_allocation

  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Human-friendly route code (e.g. "R-A-01"). Unique among ACTIVE routes only.
        constraints: "uppercase, 3-12 chars, [A-Z0-9-]"
      - name: name
        type: string
        source: input
        description: Display name of the route.
      - name: start_stop_id
        type: string
        source: input
        description: FK -> Stop.id; must be in ACTIVE status when the route is published.
      - name: end_stop_id
        type: string
        source: input
        description: FK -> Stop.id; must be in ACTIVE status when the route is published.
      - name: intermediate_stop_ids
        type: array
        source: input
        description: Ordered list of FK Stop.id; positions between start and end. May be empty.
      - name: status
        type: enum
        source: system
        description: Lifecycle status of this route version.
        default: DRAFT
        constraints: "values in {DRAFT, ACTIVE, RETIRED}"
      - name: version_number
        type: integer
        source: system
        description: Monotonic per-code version. Each PUBLISH allocates a new version row by retiring the prior ACTIVE one (a new id is minted; see RouteVersion below for the immutable snapshot).
        default: 1
      - name: peak_frequency_minutes
        type: integer
        source: input
        description: Headway in minutes during peak windows (e.g. 10).
        constraints: "integer, 5 <= x <= 60"
      - name: offpeak_frequency_minutes
        type: integer
        source: input
        description: Headway in minutes during off-peak windows (e.g. 30).
        constraints: "integer, 5 <= x <= 120, must be >= peak_frequency_minutes"
      - name: peak_windows
        type: array
        source: input
        description: |
          Local-time windows [HH:MM, HH:MM) when peak headway applies. Half-open: start inclusive,
          end exclusive. Windows are sorted ascending and MUST NOT overlap nor touch (gap >= 1 minute).
      - name: estimated_distance_km
        type: number
        source: computed
        description: Sum of segment distances between consecutive stops; see calculations.route_distance_estimate.
      - name: estimated_duration_minutes
        type: number
        source: computed
        description: Estimated one-way duration; see calculations.route_duration_estimate.

  - name: RouteVersion
    parent: null
    common_fields: false
    fields:
      - name: route_code
        type: string
        source: system
        description: Logical route code shared across versions.
      - name: version_number
        type: integer
        source: system
        description: Immutable version index for this snapshot.
      - name: stop_sequence_snapshot
        type: array
        source: system
        description: Frozen ordered list of stop ids at publish time.
      - name: peak_frequency_minutes
        type: integer
        source: system
        description: Frozen peak headway.
      - name: offpeak_frequency_minutes
        type: integer
        source: system
        description: Frozen off-peak headway.
      - name: peak_windows
        type: array
        source: system
        description: Frozen peak windows.
      - name: published_at
        type: datetime
        source: system
        description: When this version became ACTIVE.
      - name: retired_at
        type: datetime
        source: system
        description: When this version was superseded; null while still ACTIVE.

  - name: Stop
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stop code unique among status IN {ACTIVE} stops.
      - name: name
        type: string
        source: input
        description: Display name.
      - name: latitude
        type: number
        source: input
        description: WGS84 latitude.
        constraints: "-90 <= x <= 90, 6 decimal places"
      - name: longitude
        type: number
        source: input
        description: WGS84 longitude.
        constraints: "-180 <= x <= 180, 6 decimal places"
      - name: has_shelter
        type: boolean
        source: input
        description: Whether the stop has a shelter.
        default: false
      - name: amenities
        type: array
        source: input
        description: List of amenity tags (subset of {LIGHTING, SEATING, USB, DISPLAY, RAMP}).
      - name: capacity_reference
        type: integer
        source: input
        description: Reference number of riders the stop can hold without crowding.
        constraints: "integer, 1 <= x <= 500"
      - name: status
        type: enum
        source: system
        description: On-shelf / off-shelf status.
        default: DRAFT
        constraints: "values in {DRAFT, ACTIVE, OFFSHELF}"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: plate_number
        type: string
        source: input
        description: Unique plate identifier among status IN {ACTIVE, MAINTENANCE} vehicles.
      - name: seat_capacity
        type: integer
        source: input
        description: Maximum seated riders.
        constraints: "integer, 8 <= x <= 80"
      - name: vehicle_type
        type: enum
        source: input
        description: Vehicle classification.
        constraints: "values in {STANDARD, ELECTRIC, SHUTTLE_VAN}"
      - name: status
        type: enum
        source: system
        description: Operational state.
        default: ACTIVE
        constraints: "values in {ACTIVE, MAINTENANCE, RETIRED}"
      - name: maintenance_window_start
        type: datetime
        source: system
        description: ISO 8601 UTC; populated only while status==MAINTENANCE.
      - name: maintenance_window_end
        type: datetime
        source: system
        description: ISO 8601 UTC; populated only while status==MAINTENANCE.
      - name: last_run_completed_at
        type: datetime
        source: computed
        description: Latest RunSheet.completed_at where this vehicle served; null until first completion.

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: HR-system employee code; unique among status IN {ACTIVE}.
      - name: full_name
        type: string
        source: input
        description: Display name.
      - name: license_expiry_date
        type: datetime
        source: input
        description: License expiry (date, midnight UTC).
      - name: status
        type: enum
        source: system
        description: Driver employment status.
        default: ACTIVE
        constraints: "values in {ACTIVE, SUSPENDED, OFFBOARDED}"

  - name: RunSheet
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: FK -> Route.id (the ACTIVE route).
      - name: route_version_number
        type: integer
        source: system
        description: Pinned at generation time; equals Route.version_number at the moment of creation.
      - name: scheduled_date
        type: datetime
        source: input
        description: Calendar date (UTC midnight) of the run.
      - name: scheduled_departure
        type: datetime
        source: input
        description: Scheduled ISO 8601 UTC departure from start_stop.
      - name: scheduled_arrival
        type: datetime
        source: computed
        description: scheduled_departure + estimated_duration_minutes (rounded up to next minute).
      - name: assigned_vehicle_id
        type: string
        source: system
        description: FK -> Vehicle.id (selected per vehicle-rotation rule; see calculations.vehicle_rotation_selector).
      - name: assigned_driver_id
        type: string
        source: input
        description: FK -> Driver.id.
      - name: substitute_vehicle_id
        type: string
        source: system
        description: FK -> Vehicle.id; populated only after a DISPATCH_SUBSTITUTE action.
      - name: status
        type: enum
        source: system
        description: Lifecycle status of this daily run.
        default: PLANNED
        constraints: "values in {PLANNED, BOARDING, IN_TRANSIT, DELAYED, COMPLETED, CANCELLED}"
      - name: capacity_remaining
        type: integer
        source: computed
        description: Vehicle.seat_capacity minus confirmed Reservations on this run (excluding CANCELLED/NO_SHOW).
      - name: completed_at
        type: datetime
        source: system
        description: When status became COMPLETED.
      - name: delay_minutes_accumulated
        type: integer
        source: computed
        description: Sum of DelayEvent.delay_minutes for this run.

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: HR employee code (opaque external id).
      - name: run_sheet_id
        type: string
        source: input
        description: FK -> RunSheet.id.
      - name: boarding_stop_id
        type: string
        source: input
        description: FK -> Stop.id; must appear in the RunSheet's stop_sequence_snapshot.
      - name: alighting_stop_id
        type: string
        source: input
        description: FK -> Stop.id; must appear AFTER boarding_stop_id in the snapshot.
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle.
        default: CONFIRMED
        constraints: "values in {CONFIRMED, WAITLISTED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}"
      - name: waitlist_position
        type: integer
        source: system
        description: Strictly positive while status==WAITLISTED; null otherwise. Lower number = higher priority.
      - name: payer_mode
        type: enum
        source: input
        description: Who pays for this trip.
        constraints: "values in {SELF_PAY, DEPARTMENT_PAID}"
      - name: department_code
        type: string
        source: input
        description: Required when payer_mode==DEPARTMENT_PAID; else null.
      - name: fare_cents
        type: integer
        source: computed
        description: Fare for this reservation in cents; pinned at creation from route base fare.
      - name: no_show_penalty_points
        type: integer
        source: system
        description: Penalty accrued from this reservation; 0 unless NO_SHOW transition fires.
        default: 0
      - name: cancelled_at
        type: datetime
        source: system
        description: ISO 8601 UTC; set on CANCELLED transition.

  - name: RidershipRecord
    parent: null
    common_fields: false
    fields:
      - name: reservation_id
        type: string
        source: system
        description: FK -> Reservation.id; nullable for walk-on overrides (none in v1, but kept null-tolerant).
      - name: run_sheet_id
        type: string
        source: system
        description: FK -> RunSheet.id.
      - name: employee_id
        type: string
        source: system
        description: Copy of Reservation.employee_id for fast filtering.
      - name: check_in_method
        type: enum
        source: input
        description: How the rider checked in.
        constraints: "values in {QR, CARD, FACE}"
      - name: boarded_stop_id
        type: string
        source: input
        description: Actual boarding stop id.
      - name: alighted_stop_id
        type: string
        source: input
        description: Actual alighting stop id; written on alight event.
      - name: boarded_at
        type: datetime
        source: system
        description: Set at check-in.
      - name: alighted_at
        type: datetime
        source: system
        description: Set at alight; null until then.

  - name: DelayEvent
    parent: null
    common_fields: false
    fields:
      - name: run_sheet_id
        type: string
        source: system
        description: FK -> RunSheet.id.
      - name: cause
        type: enum
        source: input
        description: Delay cause classification.
        constraints: "values in {TRAFFIC, BREAKDOWN, WEATHER}"
      - name: delay_minutes
        type: integer
        source: input
        description: Delay in whole minutes.
        constraints: "integer, 1 <= x <= 480"
      - name: affected_from_stop_id
        type: string
        source: input
        description: First downstream stop affected by this delay.
      - name: notification_dispatched
        type: boolean
        source: system
        description: Whether an IM-system notification was dispatched.
        default: false
      - name: substitute_dispatched
        type: boolean
        source: system
        description: True if a substitute vehicle was attached in response.
        default: false
      - name: reported_at
        type: datetime
        source: system
        description: When this delay was recorded.

  - name: MonthlyBill
    parent: null
    common_fields: true
    fields:
      - name: billing_month
        type: string
        source: input
        description: "Billing period as YYYY-MM (UTC)."
        constraints: "regex ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: payer_scope
        type: enum
        source: input
        description: Whether this bill rolls up an employee or a department.
        constraints: "values in {EMPLOYEE, DEPARTMENT}"
      - name: payer_id
        type: string
        source: input
        description: employee_code when payer_scope==EMPLOYEE, else department_code.
      - name: status
        type: enum
        source: system
        description: Bill lifecycle.
        default: DRAFT
        constraints: "values in {DRAFT, FINALIZED, SETTLED, REFUNDED}"
      - name: gross_cents
        type: integer
        source: computed
        description: Pre-refund sum across in-scope reservations; pinned on FINALIZE.
      - name: refund_cents
        type: integer
        source: computed
        description: Sum of refunds applied while status was FINALIZED.
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: gross_cents - refund_cents at the moment of SETTLE/REFUND. Pinned on settlement.
      - name: line_count
        type: integer
        source: computed
        description: Number of reservations rolled in.
      - name: finalized_at
        type: datetime
        source: system
        description: Set when status transitions DRAFT->FINALIZED.

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: Audit category.
        constraints: "values in {RESERVATION_CREATED, RESERVATION_CANCELLED, RESERVATION_CHECKED_IN, RESERVATION_NO_SHOW, DELAY_REPORTED, SUBSTITUTE_DISPATCHED, ROUTE_PUBLISHED, BILL_REFUNDED}"
      - name: subject_type
        type: enum
        source: system
        description: Entity type the event concerns.
        constraints: "values in {Reservation, RunSheet, Route, MonthlyBill, DelayEvent}"
      - name: subject_id
        type: string
        source: system
        description: Id of the affected entity.
      - name: actor_role
        type: string
        source: system
        description: Acting role at the time of the event.
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at the time of the event.
      - name: payload
        type: object
        source: system
        description: Free-form structured details (diff, reason code, related ids).

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Route
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /shuttle/routes/{id}/publish"
        actor: Dispatcher
        preconditions:
          - "Route.start_stop, Route.end_stop, all intermediate stops have Stop.status == ACTIVE"
          - "If another Route with the same code is ACTIVE, that route MUST be transitioned to RETIRED in the same operation (see side_effects)"
          - "peak_frequency_minutes <= offpeak_frequency_minutes"
          - "peak_windows is sorted, half-open, non-overlapping with gap >= 1 minute"
        side_effects:
          - "Recompute Route.estimated_distance_km via calculations.route_distance_estimate"
          - "Recompute Route.estimated_duration_minutes via calculations.route_duration_estimate"
          - "Append RouteVersion snapshot with version_number = (max prior version_number for this code) + 1"
          - "If a prior ACTIVE Route with same code exists, set its status to RETIRED and stamp the corresponding RouteVersion.retired_at; this RETIRE step in turn triggers any PLANNED RunSheets on the prior route to cascade to CANCELLED (see RunSheet.PLANNED_to_CANCELLED auto-cascade)"
          - "Emit AuditLog{ROUTE_PUBLISHED}"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /shuttle/routes/{id}/retire OR cascaded from publishing a new version with the same code"
        actor: Dispatcher | system
        preconditions:
          - "All RunSheets on this route with scheduled_date >= today and status==PLANNED will be auto-cancelled (see side_effects), not blocked"
        side_effects:
          - "Stamp RouteVersion.retired_at"
          - "Cascade: each PLANNED RunSheet on this route auto-transitions to CANCELLED; each CANCELLED RunSheet in turn cascades its CONFIRMED Reservations to CANCELLED (see RunSheet.PLANNED_to_CANCELLED side_effects)"

  - entity: Stop
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /shuttle/stops/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "Stop has non-null coordinates and capacity_reference"
        side_effects: []
      - from: ACTIVE
        to: OFFSHELF
        trigger: "POST /shuttle/stops/{id}/offshelf"
        actor: Dispatcher
        preconditions:
          - "Stop is NOT a start_stop, end_stop, or intermediate stop of any Route with status==ACTIVE"
        side_effects:
          - "Stop can be referenced by retired RouteVersions but no new Route may include it"
      - from: OFFSHELF
        to: ACTIVE
        trigger: "POST /shuttle/stops/{id}/activate"
        actor: Dispatcher
        preconditions: []
        side_effects: []

  - entity: Vehicle
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /shuttle/vehicles/{id}/maintenance"
        actor: Dispatcher
        preconditions:
          - "Provided maintenance_window_start < maintenance_window_end"
          - "Vehicle is NOT the assigned_vehicle_id of any RunSheet whose scheduled_departure overlaps [maintenance_window_start, maintenance_window_end) with status IN {PLANNED, BOARDING, IN_TRANSIT, DELAYED}"
        side_effects:
          - "Stamp maintenance_window_start and maintenance_window_end on Vehicle"
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /shuttle/vehicles/{id}/maintenance-complete OR clock-advance past maintenance_window_end"
        actor: Dispatcher | system
        preconditions:
          - "clock-advance: now() >= maintenance_window_end"
        side_effects:
          - "Clear maintenance_window_start and maintenance_window_end"
      - from: ACTIVE
        to: RETIRED
        trigger: "DELETE /shuttle/vehicles/{id}"
        actor: Dispatcher
        preconditions:
          - "Vehicle is NOT assigned to any RunSheet in status IN {PLANNED, BOARDING, IN_TRANSIT, DELAYED}"
        side_effects: []

  - entity: RunSheet
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: BOARDING
        trigger: "POST /shuttle/run-sheets/{id}/start-boarding"
        actor: Driver | Dispatcher
        preconditions:
          - "Vehicle.status == ACTIVE (not MAINTENANCE/RETIRED)"
          - "now() within [scheduled_departure - 30 min, scheduled_departure + 30 min]"
        side_effects:
          - "Promote up to (capacity_remaining) WAITLISTED Reservations to CONFIRMED in ascending waitlist_position order, recomputing capacity_remaining after each promotion"
      - from: BOARDING
        to: IN_TRANSIT
        trigger: "POST /shuttle/run-sheets/{id}/depart"
        actor: Driver | Dispatcher
        preconditions:
          - "At least zero CHECKED_IN reservations (no minimum)"
        side_effects:
          - "Auto-transition every CONFIRMED Reservation that did NOT check in to NO_SHOW (see Reservation.CONFIRMED_to_NO_SHOW cascade)"
      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /shuttle/run-sheets/{id}/complete"
        actor: Driver | Dispatcher
        preconditions: []
        side_effects:
          - "Set completed_at = now()"
          - "Set Vehicle.last_run_completed_at = now() (cascade: this in turn becomes the sort key for the next vehicle-rotation selection on that route — see calculations.vehicle_rotation_selector)"
          - "Auto-transition every CHECKED_IN Reservation on this run to COMPLETED"
      - from: PLANNED
        to: DELAYED
        trigger: "POST /shuttle/run-sheets/{id}/delays"
        actor: Dispatcher | system
        preconditions: []
        side_effects:
          - "Append DelayEvent and increment delay_minutes_accumulated"
          - "If cumulative delay_minutes_accumulated >= 30, dispatch IM notification (set DelayEvent.notification_dispatched=true)"
          - "If cause==BREAKDOWN AND substitute_vehicle_id is null, auto-select a substitute via calculations.substitute_vehicle_selector and set substitute_dispatched=true; this in turn sets the new vehicle's effective Vehicle.last_run_completed_at via the same selector ordering when the run later COMPLETES"
          - "Push scheduled_arrival forward by delay_minutes"
      - from: IN_TRANSIT
        to: DELAYED
        trigger: "POST /shuttle/run-sheets/{id}/delays"
        actor: Dispatcher | system
        preconditions: []
        side_effects:
          - "Same side_effects as PLANNED->DELAYED"
      - from: DELAYED
        to: IN_TRANSIT
        trigger: "POST /shuttle/run-sheets/{id}/resume"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: DELAYED
        to: COMPLETED
        trigger: "POST /shuttle/run-sheets/{id}/complete"
        actor: Driver | Dispatcher
        preconditions: []
        side_effects:
          - "Set completed_at = now()"
          - "Set Vehicle.last_run_completed_at = now() (cascades into next vehicle-rotation pick)"
          - "Auto-transition every CHECKED_IN Reservation on this run to COMPLETED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shuttle/run-sheets/{id}/cancel OR cascaded from Route.ACTIVE_to_RETIRED"
        actor: Dispatcher | system
        preconditions: []
        side_effects:
          - "Cascade: every CONFIRMED or WAITLISTED Reservation on this run auto-transitions to CANCELLED (see Reservation.CONFIRMED_to_CANCELLED cascade); each cancelled CONFIRMED Reservation in turn refunds its fare to the corresponding FINALIZED MonthlyBill if any exists (see MonthlyBill.FINALIZED_to_REFUNDED cascade)"

  - entity: Reservation
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /shuttle/run-sheets/{run_id}/check-in"
        actor: Driver | system
        preconditions:
          - "RunSheet.status IN {BOARDING, IN_TRANSIT, DELAYED}"
          - "now() within [RunSheet.scheduled_departure - 30 min, RunSheet.scheduled_arrival + 60 min]"
        side_effects:
          - "Create RidershipRecord with boarded_at = now()"
          - "Emit AuditLog{RESERVATION_CHECKED_IN}"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "DELETE /shuttle/reservations/{id} OR cascaded from RunSheet.PLANNED_to_CANCELLED"
        actor: Employee | system
        preconditions:
          - "Employee-triggered cancel: now() <= RunSheet.scheduled_departure - 15 minutes"
        side_effects:
          - "Set cancelled_at = now() and capacity_remaining on the run is freed"
          - "If a WAITLISTED Reservation exists on the same run AND RunSheet.status == PLANNED, promote the lowest waitlist_position to CONFIRMED (cascade)"
          - "If this reservation already rolled into a FINALIZED MonthlyBill, append a refund line: bill.refund_cents += this.fare_cents and bill auto-transitions to REFUNDED (see MonthlyBill.FINALIZED_to_REFUNDED)"
          - "Emit AuditLog{RESERVATION_CANCELLED}"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "Cascaded from RunSheet.BOARDING_to_IN_TRANSIT"
        actor: system
        preconditions: []
        side_effects:
          - "Set no_show_penalty_points per calculations.no_show_penalty_score"
          - "Bill is unaffected; fare still charged (no-show is non-refundable)"
          - "Emit AuditLog{RESERVATION_NO_SHOW}"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "Cascaded from RunSheet.PLANNED_to_BOARDING OR Reservation.CONFIRMED_to_CANCELLED on same run"
        actor: system
        preconditions:
          - "RunSheet.capacity_remaining >= 1 at the moment of promotion"
        side_effects:
          - "Clear waitlist_position"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "DELETE /shuttle/reservations/{id} OR cascaded from RunSheet.PLANNED_to_CANCELLED"
        actor: Employee | system
        preconditions: []
        side_effects:
          - "Renumber remaining waitlist positions (decrement positions strictly greater than the cancelled one)"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "Cascaded from RunSheet IN_TRANSIT_to_COMPLETED or DELAYED_to_COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "Set RidershipRecord.alighted_at = now() if not already set, defaulting alighted_stop_id to Reservation.alighting_stop_id"

  - entity: MonthlyBill
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /shuttle/bills/{id}/finalize"
        actor: Dispatcher
        preconditions:
          - "All in-scope Reservations have status IN terminal set {COMPLETED, NO_SHOW, CANCELLED}"
          - "billing_month is strictly before the current UTC month"
        side_effects:
          - "Pin gross_cents and line_count per calculations.monthly_bill_aggregation"
          - "Stamp finalized_at = now()"
      - from: FINALIZED
        to: REFUNDED
        trigger: "Cascaded from Reservation.CONFIRMED_to_CANCELLED for a billed reservation"
        actor: system
        preconditions: []
        side_effects:
          - "refund_cents += cancelled Reservation.fare_cents"
          - "Emit AuditLog{BILL_REFUNDED}"
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /shuttle/bills/{id}/settle"
        actor: Dispatcher
        preconditions:
          - "All refunds processed: bill has no pending CONFIRMED-cancel events left to apply"
        side_effects:
          - "Pin net_cents = gross_cents - refund_cents"
      - from: REFUNDED
        to: SETTLED
        trigger: "POST /shuttle/bills/{id}/settle"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Pin net_cents = gross_cents - refund_cents"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - scenario: "Two employees create a reservation simultaneously on a run with exactly 1 seat left"
    guarantee: "At most one reservation enters CONFIRMED; the loser is placed in WAITLISTED with the next position"
    error_id: ERR_RUN_FULL
    http_status: 409
    serialization: "First-writer-wins on RunSheet.capacity_remaining decrement; loser auto-falls to waitlist if waitlist is enabled, else 409"

  - scenario: "Two dispatchers publish a new version of the same Route.code at the same time"
    guarantee: "Exactly one PUBLISH wins; the loser is rejected because the prior ACTIVE row has already been retired (stale-version)"
    error_id: ERR_ROUTE_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on RouteVersion.version_number allocation"

  - scenario: "Driver checks in a reservation while the employee cancels it"
    guarantee: "Exactly one transition succeeds; cancel wins iff applied before check-in is committed, else cancel fails with state error"
    error_id: ERR_RESERVATION_ALREADY_CHECKED_IN
    http_status: 409
    serialization: "First-writer-wins on Reservation.status"

  - scenario: "Two dispatchers start maintenance for the same vehicle covering overlapping windows"
    guarantee: "Only one succeeds; the second fails because the vehicle is no longer in ACTIVE status"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Vehicle.status"

  - scenario: "A second cancel arrives for a reservation already cancelled by the employee"
    guarantee: "Idempotent rejection: only the first DELETE succeeds; the second returns state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Reservation.status"

  - scenario: "Two MonthlyBills for the same (payer_scope, payer_id, billing_month) are created simultaneously"
    guarantee: "Only one bill row exists per (payer_scope, payer_id, billing_month); duplicate rejected"
    error_id: ERR_BILL_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on (payer_scope, payer_id, billing_month)"

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: route_distance_estimate
    trigger: "On Route.DRAFT_to_ACTIVE (publish)"
    algorithm: aggregation
    formula: |
      # Inputs: ordered list of stops S = [start_stop, intermediate_1, ..., end_stop]
      # Distance between consecutive stops uses haversine on (latitude, longitude)
      # in km with Earth radius = 6371.0088.
      total = 0
      for i in range(len(S) - 1):
          a = S[i]; b = S[i+1]
          phi1 = radians(a.latitude); phi2 = radians(b.latitude)
          dphi = radians(b.latitude - a.latitude)
          dlam = radians(b.longitude - a.longitude)
          h = sin(dphi/2)**2 + cos(phi1)*cos(phi2)*sin(dlam/2)**2
          d_km = 2 * 6371.0088 * asin(sqrt(h))
          total += round(d_km, 4)            # round PER SEGMENT to 4 dp
      estimated_distance_km = round(total, 2)  # then round THE SUM to 2 dp
    input_set: "All stops referenced by the Route at publish time"
    constants:
      EARTH_RADIUS_KM: 6371.0088
    precision: "Per-segment rounding to 4 decimal places, total rounded to 2 decimal places, round_half_up"

  - name: route_duration_estimate
    trigger: "On Route.DRAFT_to_ACTIVE (publish)"
    algorithm: forward_looking
    formula: |
      # Variant A (BASE): segment_minutes = distance_km / AVG_SPEED_KMH * 60 + DWELL_MIN per intermediate stop
      base_minutes = (estimated_distance_km / AVG_SPEED_KMH) * 60 + DWELL_MIN * len(intermediate_stop_ids)
      # Variant B (PEAK_ADJUSTED): if scheduled_departure falls inside any peak window, multiply travel time by PEAK_FACTOR
      # The publish-time estimate uses BASE (no specific run instance yet).
      estimated_duration_minutes = ceil(base_minutes)  # ceil to whole minute
    input_set: "estimated_distance_km plus intermediate stop count"
    constants:
      AVG_SPEED_KMH: 25
      DWELL_MIN: 1
      PEAK_FACTOR: 1.25
    precision: "Ceil to whole minute"
    variants:
      - name: BASE
        when: "publish-time estimate stored on Route.estimated_duration_minutes"
        difference: "Uses AVG_SPEED_KMH directly without peak multiplier"
      - name: PEAK_ADJUSTED
        when: "Per-run scheduled_arrival on RunSheet creation"
        difference: "Multiplies travel-time minutes by PEAK_FACTOR if scheduled_departure falls inside any peak window (intersecting on the run's local-time of day); dwell is unaffected"

  - name: fare_calculation
    trigger: "On Reservation creation (POST /shuttle/run-sheets/{id}/reservations)"
    algorithm: tiered_pricing
    formula: |
      # Determine segment_count = number of segments traversed between boarding and alighting (using
      # RunSheet.route_version_number's stop_sequence_snapshot order). Tier by segment_count:
      #   1..2 segments  -> BASE_FARE_CENTS
      #   3..5 segments  -> BASE_FARE_CENTS + 100
      #   6+   segments  -> BASE_FARE_CENTS + 200
      # Then, if scheduled_departure falls inside a peak window, multiply by PEAK_FARE_MULTIPLIER.
      # Evaluation order is fixed and explicit:
      #   step 1: tier_cents = tier(segment_count)
      #   step 2: if peak: raw = tier_cents * PEAK_FARE_MULTIPLIER
      #           else:    raw = tier_cents
      #   step 3: fare_cents = int(round_half_up(raw))   # integer cents
      # NOTE: this order is "tier first, peak multiplier second"; reversing it would not change
      # the result here (multiplier is uniform across tiers) but the order is pinned for
      # forward compatibility with future tier-specific multipliers.
      pass
    input_set: "Route.intermediate_stop_ids ordered + Reservation.boarding_stop_id + Reservation.alighting_stop_id + RunSheet.scheduled_departure + Route.peak_windows"
    constants:
      BASE_FARE_CENTS: 200
      PEAK_FARE_MULTIPLIER: 1.5
    precision: "Integer cents; round_half_up at the final multiplication step"

  - name: no_show_penalty_score
    trigger: "On Reservation.CONFIRMED_to_NO_SHOW"
    algorithm: weighted_scoring
    formula: |
      # base_points = 10 for first NO_SHOW in trailing 30 days for the employee
      # multiplier:
      #   - peak run (scheduled_departure in a peak window): +5
      #   - run with cumulative delay_minutes_accumulated >= 30 at the time of departure: -3 (mitigation)
      # repeat_count = number of prior NO_SHOW Reservations for this employee whose
      #                RunSheet.scheduled_departure is within [now() - 30d, now()] exclusive of this one
      # raw = base_points + 5*peak_flag - 3*delay_mitigation_flag + 2*repeat_count
      # no_show_penalty_points = max(0, raw)   # floor at zero
    input_set: "Prior NO_SHOW Reservations of the same employee within 30 days, plus this run's peak/delay flags"
    constants:
      BASE_POINTS: 10
      PEAK_BONUS: 5
      DELAY_MITIGATION: 3
      REPEAT_FACTOR: 2
    precision: "Integer; floor at zero (max(0, ...))"

  - name: vehicle_rotation_selector
    trigger: "On RunSheet creation when assigned_vehicle_id is not supplied"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter (candidate set):
      #   Vehicle.status == ACTIVE
      #   AND (Vehicle.maintenance_window_start, maintenance_window_end) does NOT intersect the
      #       run's planned occupation window [scheduled_departure - 15 min, scheduled_arrival + 15 min]
      #   AND Vehicle.seat_capacity >= MIN_CAPACITY (configurable default 20)
      # Ranking: ascending by Vehicle.last_run_completed_at (NULL treated as -INF, i.e. picked first
      #          to spread the rotation onto unused vehicles).
      # Tie-break: ascending by Vehicle.plate_number (lexicographic).
      # Empty-set fallback: raise ERR_NO_VEHICLE_AVAILABLE.
    input_set: "Vehicles with status==ACTIVE not overlapping the run's planned occupation"
    constants:
      MIN_CAPACITY: 20
      OCCUPATION_BUFFER_MIN: 15
    precision: "Selection is deterministic; no floating point"

  - name: substitute_vehicle_selector
    trigger: "On RunSheet PLANNED/IN_TRANSIT -> DELAYED with cause == BREAKDOWN"
    algorithm: waterfall_allocation
    formula: |
      # Same eligibility filter as vehicle_rotation_selector EXCEPT we also exclude the run's
      # currently-assigned_vehicle_id and any vehicle currently substitute_vehicle_id of another active run.
      # Then ranking:
      #   1) Vehicles whose seat_capacity >= the run's currently-confirmed rider count come first
      #      (compliant subset).
      #   2) Within the compliant subset: ascending last_run_completed_at, tie-break plate_number asc.
      #   3) If compliant subset is empty: pick the largest non-compliant by seat_capacity descending,
      #      tie-break plate_number asc (overflow handling: riders may exceed capacity by up to 10%
      #      before falling through to ERR_NO_SUBSTITUTE_VEHICLE).
    input_set: "ACTIVE vehicles not currently substituting nor assigned to overlapping runs"
    constants:
      OVERFLOW_TOLERANCE_PCT: 10
    precision: "Selection is deterministic; capacity arithmetic is integer"

  - name: monthly_bill_aggregation
    trigger: "On MonthlyBill.DRAFT_to_FINALIZED"
    algorithm: aggregation
    formula: |
      # In-scope reservations for an EMPLOYEE-scoped bill:
      #   Reservation.employee_id == bill.payer_id
      #   AND Reservation.payer_mode == SELF_PAY
      #   AND Reservation.status IN {COMPLETED, NO_SHOW}     # CANCELLED does not enter gross
      #   AND associated RunSheet.scheduled_date falls in billing_month (UTC)
      # In-scope reservations for a DEPARTMENT-scoped bill:
      #   Reservation.department_code == bill.payer_id
      #   AND Reservation.payer_mode == DEPARTMENT_PAID
      #   AND Reservation.status IN {COMPLETED, NO_SHOW}
      #   AND associated RunSheet.scheduled_date falls in billing_month (UTC)
      # gross_cents = sum_per_reservation(fare_cents)  computed PER LINE then summed
      # (rounding order: each fare_cents is already an integer pinned at reservation creation
      # via fare_calculation; the SUM is integer addition with no further rounding).
      line_count = number of in-scope reservations
    input_set: "Reservations matching payer scope + status filter + billing_month window"
    constants: {}
    precision: "Integer cents; no further rounding at aggregation"

  - name: ridership_statistics
    trigger: "GET /shuttle/run-sheets/{id}/statistics"
    algorithm: aggregation
    formula: |
      # ridership_actual = count(RidershipRecord.run_sheet_id == id)
      # ridership_expected = count(Reservation.run_sheet_id == id AND status IN {CHECKED_IN, COMPLETED, NO_SHOW})
      # no_show_count = count(Reservation.run_sheet_id == id AND status == NO_SHOW)
      # match_rate = ridership_actual / max(ridership_expected, 1)  (float, 4 dp, round_half_up)
      # Includes only confirmed reservations turned into ridership; WAITLISTED never enters.
    input_set: "RidershipRecord and Reservation entries for the run"
    constants: {}
    precision: "Counts integer; match_rate float rounded to 4 dp"

# =====================================================================
# §1.4 Validation Rules Table (Ordered)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Dispatcher, Driver, Employee, Auditor}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All path-segment ids resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Body-referenced FK ids (route_id, vehicle_id, driver_id, stop ids, run_sheet_id, reservation_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK bodies"

  - priority: 6
    category: state
    check: "Subject entity in a valid state for this transition (state machine §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 7
    category: state
    check: "Stop referenced by route is in status==ACTIVE at publish time"
    error_id: ERR_STOP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /shuttle/routes/{id}/publish"

  - priority: 8
    category: business_safety
    check: "Vehicle's maintenance window must not intersect any RunSheet planned occupation window when starting MAINTENANCE"
    error_id: ERR_VEHICLE_HAS_BOOKED_RUNS
    http_status: 409
    applies_to: "POST /shuttle/vehicles/{id}/maintenance"

  - priority: 9
    category: business_safety
    check: "Driver.license_expiry_date strictly after RunSheet.scheduled_departure when driver assigned"
    error_id: ERR_DRIVER_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /shuttle/run-sheets, PATCH /shuttle/run-sheets/{id}"

  - priority: 10
    category: business_temporal
    check: "Cancel window: employee cancels only when now() <= RunSheet.scheduled_departure - 15 minutes"
    error_id: ERR_CANCEL_WINDOW_CLOSED
    http_status: 409
    applies_to: "DELETE /shuttle/reservations/{id} when X-User-Role==Employee"

  - priority: 11
    category: business_temporal
    check: "Check-in window: now() within [scheduled_departure - 30min, scheduled_arrival + 60min]"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /shuttle/run-sheets/{run_id}/check-in"

  - priority: 12
    category: business_referential
    check: "Reservation.boarding_stop_id and alighting_stop_id appear in RouteVersion snapshot AND boarding precedes alighting"
    error_id: ERR_INVALID_STOP_PAIR
    http_status: 422
    applies_to: "POST /shuttle/run-sheets/{id}/reservations"

  - priority: 13
    category: business_constraint
    check: "Employee daily reservation limit: at most DAILY_RESERVATION_LIMIT (=3) non-CANCELLED reservations per employee per scheduled_date"
    error_id: ERR_DAILY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /shuttle/run-sheets/{id}/reservations"

  - priority: 14
    category: business_constraint
    check: "peak_windows are sorted, half-open, non-overlapping with gap >= 1 minute; peak_frequency_minutes <= offpeak_frequency_minutes"
    error_id: ERR_INVALID_FREQUENCY_WINDOWS
    http_status: 422
    applies_to: "POST /shuttle/routes, POST /shuttle/routes/{id}/publish"

  - priority: 15
    category: business_constraint
    check: "Vehicle occupation: a Vehicle MUST NOT be assigned to two RunSheets whose [scheduled_departure - 15min, scheduled_arrival + 15min] windows overlap (closed-closed buffer)"
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /shuttle/run-sheets, PATCH /shuttle/run-sheets/{id}, POST /shuttle/run-sheets/{id}/dispatch-substitute"

  - priority: 16
    category: business_constraint
    check: "Driver occupation: a Driver MUST NOT be assigned to two RunSheets whose scheduled_departure intervals [scheduled_departure, scheduled_arrival] are adjacent or overlapping; adjacent means end_a == start_b exactly (closed-open interval semantics, touching counts as conflict)"
    error_id: ERR_DRIVER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /shuttle/run-sheets, PATCH /shuttle/run-sheets/{id}"

  - priority: 17
    category: business_fiscal
    check: "Reservation total fare contributes to capacity (RunSheet.capacity_remaining >= 1) at the moment of confirmation; loser falls to waitlist or 409"
    error_id: ERR_RUN_FULL
    http_status: 409
    applies_to: "POST /shuttle/run-sheets/{id}/reservations"

  - priority: 18
    category: business_constraint
    check: "Route.code uniqueness restricted to status IN {ACTIVE}; multiple DRAFT or RETIRED rows with same code are permitted but only one ACTIVE at a time"
    error_id: ERR_DUPLICATE_ROUTE_CODE
    http_status: 409
    applies_to: "POST /shuttle/routes/{id}/publish"

  - priority: 19
    category: business_constraint
    check: "MonthlyBill uniqueness: at most one bill per (payer_scope, payer_id, billing_month)"
    error_id: ERR_BILL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /shuttle/bills"

  - priority: 20
    category: business_constraint
    check: "Pagination params: limit in [1,100], offset >= 0; integer types"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 21
    category: business_constraint
    check: "Optimistic concurrency: when client provides version, the row's version MUST match"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Routes ----
  - method: POST
    path: "/shuttle/routes"
    description: "Create a DRAFT route."
    roles: [Dispatcher]
    code: 201
    input: [code, name, start_stop_id, end_stop_id, intermediate_stop_ids, peak_frequency_minutes, offpeak_frequency_minutes, peak_windows]
    output: Route
    side_effects: []

  - method: GET
    path: "/shuttle/routes"
    description: "List routes with optional status filter; supports pagination."
    roles: [Dispatcher, Driver, Employee, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/shuttle/routes/{id}"
    description: "Get one route including computed distance/duration."
    roles: [Dispatcher, Driver, Employee, Auditor]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: PATCH
    path: "/shuttle/routes/{id}"
    description: "Edit a DRAFT route (RETIRED/ACTIVE are immutable; create a new version instead)."
    roles: [Dispatcher]
    code: 200
    input: ["name?", "start_stop_id?", "end_stop_id?", "intermediate_stop_ids?", "peak_frequency_minutes?", "offpeak_frequency_minutes?", "peak_windows?", "version?"]
    output: Route
    side_effects: []

  - method: POST
    path: "/shuttle/routes/{id}/publish"
    description: "Publish a DRAFT route, retiring any prior ACTIVE route with the same code."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects:
      - "calculations.route_distance_estimate"
      - "calculations.route_duration_estimate"
      - "RouteVersion snapshot created"
      - "Prior ACTIVE route with same code is RETIRED (cascade -> cancel PLANNED RunSheets -> cancel CONFIRMED Reservations)"

  - method: POST
    path: "/shuttle/routes/{id}/retire"
    description: "Retire an ACTIVE route; cascades into PLANNED runs and reservations."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects:
      - "Cascade cancel PLANNED RunSheets (depth 3 chain)"

  - method: GET
    path: "/shuttle/routes/{id}/versions"
    description: "List RouteVersion snapshots for a route code."
    roles: [Dispatcher, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteVersion[]
    side_effects: []

  # ---- Stops ----
  - method: POST
    path: "/shuttle/stops"
    description: "Create a DRAFT stop."
    roles: [Dispatcher]
    code: 201
    input: [code, name, latitude, longitude, has_shelter, amenities, capacity_reference]
    output: Stop
    side_effects: []

  - method: GET
    path: "/shuttle/stops"
    description: "List stops with optional status filter."
    roles: [Dispatcher, Driver, Employee, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Stop[]
    side_effects: []

  - method: POST
    path: "/shuttle/stops/{id}/activate"
    description: "Bring a stop on-shelf (DRAFT->ACTIVE or OFFSHELF->ACTIVE)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Stop
    side_effects: []

  - method: POST
    path: "/shuttle/stops/{id}/offshelf"
    description: "Take a stop off-shelf; rejected if referenced by ACTIVE routes."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Stop
    side_effects: []

  # ---- Vehicles ----
  - method: POST
    path: "/shuttle/vehicles"
    description: "Register a vehicle (ACTIVE)."
    roles: [Dispatcher]
    code: 201
    input: [plate_number, seat_capacity, vehicle_type]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/shuttle/vehicles"
    description: "List vehicles."
    roles: [Dispatcher, Driver, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/shuttle/vehicles/{id}/maintenance"
    description: "Start a maintenance window."
    roles: [Dispatcher]
    code: 200
    input: [maintenance_window_start, maintenance_window_end]
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/shuttle/vehicles/{id}/maintenance-complete"
    description: "Manually end maintenance early."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # ---- Drivers ----
  - method: POST
    path: "/shuttle/drivers"
    description: "Onboard a driver."
    roles: [Dispatcher]
    code: 201
    input: [employee_code, full_name, license_expiry_date]
    output: Driver
    side_effects: []

  - method: GET
    path: "/shuttle/drivers"
    description: "List drivers."
    roles: [Dispatcher, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []

  # ---- RunSheets ----
  - method: POST
    path: "/shuttle/run-sheets"
    description: "Create a daily run-sheet on an ACTIVE route; vehicle is auto-selected by vehicle_rotation_selector unless assigned_vehicle_id is supplied."
    roles: [Dispatcher]
    code: 201
    input: ["route_id", "scheduled_date", "scheduled_departure", "assigned_driver_id", "assigned_vehicle_id?"]
    output: RunSheet
    side_effects:
      - "calculations.vehicle_rotation_selector when assigned_vehicle_id missing"

  - method: GET
    path: "/shuttle/run-sheets"
    description: "List run-sheets with filters."
    roles: [Dispatcher, Driver, Employee, Auditor]
    code: 200
    input: ["route_id?", "scheduled_date?", "status?", "limit?", "offset?"]
    output: RunSheet[]
    side_effects: []

  - method: GET
    path: "/shuttle/run-sheets/{id}"
    description: "Get a run-sheet including capacity_remaining."
    roles: [Dispatcher, Driver, Employee, Auditor]
    code: 200
    input: []
    output: RunSheet
    side_effects: []

  - method: POST
    path: "/shuttle/run-sheets/{id}/start-boarding"
    description: "Transition PLANNED -> BOARDING; promotes waitlist."
    roles: [Dispatcher, Driver]
    code: 200
    input: []
    output: RunSheet
    side_effects:
      - "Cascade promote WAITLISTED reservations"

  - method: POST
    path: "/shuttle/run-sheets/{id}/depart"
    description: "Transition BOARDING -> IN_TRANSIT; auto-marks no-shows."
    roles: [Dispatcher, Driver]
    code: 200
    input: []
    output: RunSheet
    side_effects:
      - "Cascade Reservation.CONFIRMED_to_NO_SHOW"

  - method: POST
    path: "/shuttle/run-sheets/{id}/complete"
    description: "Transition IN_TRANSIT/DELAYED -> COMPLETED."
    roles: [Dispatcher, Driver]
    code: 200
    input: []
    output: RunSheet
    side_effects:
      - "Cascade Reservation.CHECKED_IN_to_COMPLETED"
      - "Update Vehicle.last_run_completed_at"

  - method: POST
    path: "/shuttle/run-sheets/{id}/cancel"
    description: "Cancel a PLANNED run-sheet; cascades to reservations."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RunSheet
    side_effects:
      - "Cascade Reservation.CONFIRMED_to_CANCELLED and WAITLISTED_to_CANCELLED, which in turn refund any FINALIZED bills"

  - method: POST
    path: "/shuttle/run-sheets/{id}/delays"
    description: "Report a delay event; auto-dispatches IM notification at threshold, substitute vehicle for BREAKDOWN."
    roles: [Dispatcher, Driver]
    code: 201
    input: [cause, delay_minutes, affected_from_stop_id]
    output: DelayEvent
    side_effects:
      - "Increment RunSheet.delay_minutes_accumulated"
      - "Transition RunSheet.status to DELAYED (if not already)"
      - "If cumulative >= 30 min, set notification_dispatched=true"
      - "If cause==BREAKDOWN and substitute_vehicle_id null, calculations.substitute_vehicle_selector"

  - method: POST
    path: "/shuttle/run-sheets/{id}/resume"
    description: "Transition DELAYED -> IN_TRANSIT."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RunSheet
    side_effects: []

  - method: POST
    path: "/shuttle/run-sheets/{id}/dispatch-substitute"
    description: "Manually assign a substitute vehicle to a run (overrides selector)."
    roles: [Dispatcher]
    code: 200
    input: [vehicle_id]
    output: RunSheet
    side_effects: []

  - method: GET
    path: "/shuttle/run-sheets/{id}/statistics"
    description: "Return ridership statistics for this run."
    roles: [Dispatcher, Auditor]
    code: 200
    input: []
    output: object
    side_effects:
      - "calculations.ridership_statistics"

  # ---- Reservations ----
  - method: POST
    path: "/shuttle/run-sheets/{id}/reservations"
    description: "Create a reservation; auto-waitlists if full."
    roles: [Employee, Dispatcher]
    code: 201
    input: ["employee_id", "boarding_stop_id", "alighting_stop_id", "payer_mode", "department_code?"]
    output: Reservation
    side_effects:
      - "calculations.fare_calculation"

  - method: GET
    path: "/shuttle/reservations"
    description: "List reservations with filters."
    roles: [Dispatcher, Employee, Auditor]
    code: 200
    input: ["employee_id?", "run_sheet_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/shuttle/reservations/{id}"
    description: "Get reservation."
    roles: [Dispatcher, Employee, Auditor]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: DELETE
    path: "/shuttle/reservations/{id}"
    description: "Cancel a reservation."
    roles: [Employee, Dispatcher]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "Promote next waitlist entry"
      - "Refund line on FINALIZED bill"

  - method: POST
    path: "/shuttle/run-sheets/{run_id}/check-in"
    description: "Check in a rider (QR/CARD/FACE)."
    roles: [Driver, Dispatcher]
    code: 201
    input: [reservation_id, check_in_method, boarded_stop_id]
    output: RidershipRecord
    side_effects:
      - "Reservation.CONFIRMED_to_CHECKED_IN"

  - method: PATCH
    path: "/shuttle/ridership/{id}"
    description: "Record alighting on an existing ridership entry."
    roles: [Driver, Dispatcher]
    code: 200
    input: [alighted_stop_id]
    output: RidershipRecord
    side_effects: []

  # ---- Bills ----
  - method: POST
    path: "/shuttle/bills"
    description: "Create a DRAFT monthly bill."
    roles: [Dispatcher]
    code: 201
    input: [billing_month, payer_scope, payer_id]
    output: MonthlyBill
    side_effects: []

  - method: POST
    path: "/shuttle/bills/{id}/finalize"
    description: "Finalize a draft bill, pinning gross_cents."
    roles: [Dispatcher]
    code: 200
    input: []
    output: MonthlyBill
    side_effects:
      - "calculations.monthly_bill_aggregation"

  - method: POST
    path: "/shuttle/bills/{id}/settle"
    description: "Settle a finalized (or refunded) bill, pinning net_cents."
    roles: [Dispatcher]
    code: 200
    input: []
    output: MonthlyBill
    side_effects: []

  - method: GET
    path: "/shuttle/bills"
    description: "List bills with filters."
    roles: [Dispatcher, Auditor]
    code: 200
    input: ["payer_scope?", "payer_id?", "status?", "billing_month?", "limit?", "offset?"]
    output: MonthlyBill[]
    side_effects: []

  # ---- Audit ----
  - method: GET
    path: "/shuttle/audit-logs"
    description: "Query audit log entries."
    roles: [Auditor, Dispatcher]
    code: 200
    input: ["event_type?", "subject_type?", "subject_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # ---- Test-driving / clock ----
  - method: POST
    path: "/shuttle/_clock/advance"
    description: "Advance the system clock to a given ISO 8601 UTC instant. Fires deferred transitions (maintenance auto-complete, no-show sweep)."
    roles: [Dispatcher, Auditor]
    code: 200
    input: [to_timestamp]
    output: object
    side_effects:
      - "Vehicle.MAINTENANCE_to_ACTIVE when now() >= maintenance_window_end"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID and/or X-User-Role header missing or empty"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role value not in {Dispatcher, Driver, Employee, Auditor}"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-segment id does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body FK references a non-existent row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Subject entity not in a valid state for this transition"
  - id: ERR_STOP_NOT_ACTIVE
    http: 409
    condition: "Route references a stop not in status==ACTIVE at publish time"
  - id: ERR_VEHICLE_HAS_BOOKED_RUNS
    http: 409
    condition: "Vehicle's proposed maintenance window overlaps a planned run's occupation"
  - id: ERR_DRIVER_LICENSE_EXPIRED
    http: 409
    condition: "Driver's license_expiry_date is not strictly after scheduled_departure"
  - id: ERR_CANCEL_WINDOW_CLOSED
    http: 409
    condition: "Employee cancel attempted within 15 min of scheduled_departure"
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http: 409
    condition: "Check-in attempted outside [-30min, +60min] of scheduled departure/arrival"
  - id: ERR_INVALID_STOP_PAIR
    http: 422
    condition: "Reservation boarding/alighting stops not on the route snapshot or wrong order"
  - id: ERR_DAILY_LIMIT_EXCEEDED
    http: 409
    condition: "Employee daily reservation limit (3 non-cancelled per scheduled_date) exceeded"
  - id: ERR_INVALID_FREQUENCY_WINDOWS
    http: 422
    condition: "peak_windows malformed or peak_frequency_minutes > offpeak_frequency_minutes"
  - id: ERR_VEHICLE_DOUBLE_BOOKED
    http: 409
    condition: "Vehicle's planned-occupation window overlaps with another run's window (closed-closed buffer)"
  - id: ERR_DRIVER_DOUBLE_BOOKED
    http: 409
    condition: "Driver's run interval is adjacent or overlapping another assigned run (closed-open semantics, touching counts)"
  - id: ERR_RUN_FULL
    http: 409
    condition: "RunSheet.capacity_remaining < 1 and waitlist also exhausted"
  - id: ERR_DUPLICATE_ROUTE_CODE
    http: 409
    condition: "Another Route with the same code is already ACTIVE"
  - id: ERR_BILL_ALREADY_EXISTS
    http: 409
    condition: "Bill exists for (payer_scope, payer_id, billing_month)"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit/offset out of range or non-integer"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency version mismatch on PATCH"
  - id: ERR_ROUTE_VERSION_CONFLICT
    http: 409
    condition: "Concurrent publish of the same route code; loser sees a stale predecessor"
  - id: ERR_RESERVATION_ALREADY_CHECKED_IN
    http: 409
    condition: "Cancel attempted on a reservation already CHECKED_IN"
  - id: ERR_NO_VEHICLE_AVAILABLE
    http: 409
    condition: "vehicle_rotation_selector found no eligible vehicle for a new run"
  - id: ERR_NO_SUBSTITUTE_VEHICLE
    http: 409
    condition: "substitute_vehicle_selector found no eligible substitute and overflow_tolerance exhausted"
  - id: ERR_PAYER_MODE_MISMATCH
    http: 422
    condition: "payer_mode==DEPARTMENT_PAID but department_code missing; or payer_mode==SELF_PAY with department_code provided"
  - id: ERR_BILLING_MONTH_NOT_COMPLETE
    http: 409
    condition: "Bill finalize attempted while billing_month is current or in the future"
  - id: ERR_BILL_HAS_OPEN_RESERVATIONS
    http: 409
    condition: "Bill finalize attempted while at least one in-scope Reservation is still in a non-terminal state"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Dispatcher
    description: "Operations team member who manages routes, stops, vehicles, drivers, run-sheets, delays, substitutes, and bills."
    identity: opaque
    exclusive_operations:
      - "POST /shuttle/routes/{id}/publish"
      - "POST /shuttle/routes/{id}/retire"
      - "POST /shuttle/stops/{id}/activate"
      - "POST /shuttle/stops/{id}/offshelf"
      - "POST /shuttle/vehicles"
      - "POST /shuttle/vehicles/{id}/maintenance"
      - "POST /shuttle/vehicles/{id}/maintenance-complete"
      - "POST /shuttle/drivers"
      - "POST /shuttle/run-sheets"
      - "POST /shuttle/run-sheets/{id}/cancel"
      - "POST /shuttle/run-sheets/{id}/dispatch-substitute"
      - "POST /shuttle/run-sheets/{id}/resume"
      - "POST /shuttle/bills"
      - "POST /shuttle/bills/{id}/finalize"
      - "POST /shuttle/bills/{id}/settle"
      - "POST /shuttle/_clock/advance"
    shared_operations:
      - "POST /shuttle/routes (with Dispatcher only)"
      - "GET routes/stops/vehicles/drivers/run-sheets/reservations/bills/audit-logs"
      - "POST /shuttle/run-sheets/{id}/start-boarding"
      - "POST /shuttle/run-sheets/{id}/depart"
      - "POST /shuttle/run-sheets/{id}/complete"
      - "POST /shuttle/run-sheets/{id}/delays"
      - "POST /shuttle/run-sheets/{run_id}/check-in"
      - "POST /shuttle/run-sheets/{id}/reservations"
      - "DELETE /shuttle/reservations/{id}"
      - "PATCH /shuttle/ridership/{id}"
      - "GET /shuttle/run-sheets/{id}/statistics"

  - name: Driver
    description: "Driver who performs run-sheet field operations (boarding, departure, check-in, delays, completion)."
    identity: entity_backed:Driver
    exclusive_operations: []
    shared_operations:
      - "POST /shuttle/run-sheets/{id}/start-boarding"
      - "POST /shuttle/run-sheets/{id}/depart"
      - "POST /shuttle/run-sheets/{id}/complete"
      - "POST /shuttle/run-sheets/{id}/delays"
      - "POST /shuttle/run-sheets/{run_id}/check-in"
      - "PATCH /shuttle/ridership/{id}"
      - "GET routes/stops/vehicles/drivers/run-sheets"

  - name: Employee
    description: "End user who books, cancels, and lists their own reservations."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /shuttle/routes"
      - "GET /shuttle/stops"
      - "GET /shuttle/run-sheets"
      - "GET /shuttle/run-sheets/{id}"
      - "POST /shuttle/run-sheets/{id}/reservations"
      - "DELETE /shuttle/reservations/{id}"
      - "GET /shuttle/reservations"
      - "GET /shuttle/reservations/{id}"

  - name: Auditor
    description: "Read-only role with access to audit logs, route versions, and statistics."
    identity: opaque
    exclusive_operations:
      - "GET /shuttle/audit-logs"
      - "GET /shuttle/routes/{id}/versions"
    shared_operations:
      - "GET routes/stops/vehicles/drivers/run-sheets/reservations/bills"
      - "GET /shuttle/run-sheets/{id}/statistics"
      - "POST /shuttle/_clock/advance"
