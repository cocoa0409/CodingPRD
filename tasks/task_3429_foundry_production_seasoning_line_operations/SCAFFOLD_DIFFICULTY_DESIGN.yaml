            - "ProductionOrder.${o_id}.margin_flag == true"
  - rule_id: combinatorial_formula
    instances:
      - name: scrap_index_tiered_weighting_restricts_order
        grounds:
          - calculations.scrap_index
          - state_machines.CastingUnit.DEFECT_REVIEW_to_SCRAPPED
          - entities.ProductionOrder.fields.posture
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction —
          conditional per-unit weights (1.0 plain scrap vs 1.5 scrap-after-rework)
          feed a tiered threshold (GREEN/WATCH/RED) that flips the order's posture.
          Here 25 poured units with one plain scrap and one scrap-after-rework give
          2.5/25 = 0.1000 -> RED -> RESTRICTED; treating the reworked unit as 1.0
          would give 0.0800 — the weighting rule changes the tier outcome.
        test_recipe:
          setup:
            - "Product P and order O (planned 30) released; melt B certified and tapped 2010 lbs"
            - "Mold M poured with 25 units (128 oz each = 200 lbs <= remaining 1949.7), shaken out"
            - "u1 scrapped without rework (weight 1.0); u2 reworked once then scrapped (weight 1.5)"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "POST /foundry/production-orders"
              payload: { product_id: "${p_id}", planned_quantity: 30, scheduled_week: 40 }
              as: FoundryManager
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /foundry/production-orders/${o_id}/release"
              payload: {}
              as: FoundryManager
              captures: { o_v2: $.data.version }
            - call: "POST /foundry/melt-batches"
              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T10:00:00Z", planned_tap_end: "2026-09-02T12:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v2}" }
              as: MeltOperator
              as_user_id: op-1
              captures: { b_id: $.data.id }
            - call: "POST /foundry/melt-batches/${b_id}/charge"
              payload: { pig_iron_lbs: 810, scrap_steel_lbs: 790, returns_lbs: 320, alloy_lbs: 90 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/melt-batches/${b_id}/chemistry-readings"
              payload: { carbon_pct: 3.30, silicon_pct: 2.99, manganese_pct: 0.65, sulfur_pct: 0.045, phosphorus_pct: 0.010, bath_temp_f: 2725 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/melt-batches/${b_id}/certify-chemistry"
              payload: { decision: CERTIFY }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/melt-batches/${b_id}/tap"
              payload: { tapped_temp_f: 2690, tapped_lbs: 2010 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/molds"
              payload: { production_order_id: "${o_id}", new_sand_pct: 20.0, reclaimed_sand_pct: 80.0, moisture_pct: 3.8, clay_pct: 10.0, sand_weight_lbs: 500 }
              as: FoundryManager
              captures: { m_id: $.data.id }
            - call: "POST /foundry/melt-batches/${b_id}/pour"
              payload: { mold_id: "${m_id}", unit_count: 25, pour_weight_per_unit_oz: 128.0 }
              as: MeltOperator
              as_user_id: op-1
              captures: { u1: "$.data[0].id", u2: "$.data[1].id" }
            - call: "POST /foundry/molds/${m_id}/shakeout"
              payload: {}
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/casting-units/${u1}/inspect"
              payload: { outcome: DEFECT, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19, defect_type: POROSITY, severity: MINOR }
              as: QualityInspector
              as_user_id: qi-1
            - call: "GET /foundry/casting-units/${u1}/defect-reports"
              payload: {}
              as: QualityInspector
              captures: { r1: "$.data[0].id" }
            - call: "POST /foundry/defect-reports/${r1}/disposition"
              payload: { disposition: SCRAP }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u2}/inspect"
              payload: { outcome: DEFECT, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19, defect_type: SAND_INCLUSION, severity: MAJOR }
              as: QualityInspector
              as_user_id: qi-1
            - call: "GET /foundry/casting-units/${u2}/defect-reports"
              payload: {}
              as: QualityInspector
              captures: { r2: "$.data[0].id" }
            - call: "POST /foundry/defect-reports/${r2}/disposition"
              payload: { disposition: REWORK }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u2}/complete-rework"
              payload: {}
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/casting-units/${u2}/inspect"
              payload: { outcome: DEFECT, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19, defect_type: CRACK, severity: MAJOR }
              as: QualityInspector
              as_user_id: qi-1
            - call: "GET /foundry/casting-units/${u2}/defect-reports"
              payload: {}
              as: QualityInspector
              captures: { r3: "$.data[1].id" }
          trigger:
            - call: "POST /foundry/defect-reports/${r3}/disposition"
              payload: { disposition: SCRAP }
              as: QualityInspector
              as_user_id: qi-1
          assert:
            - "CastingUnit.${u2}.state == SCRAPPED and CastingUnit.${u2}.scrapped_after_rework == true"
            - "ProductionOrder.${o_id}.poured_units == 25"
            - "ProductionOrder.${o_id}.defect_scrapped_units == 2"
            - "ProductionOrder.${o_id}.scrap_weighted_units == 2.5"
            - "ProductionOrder.${o_id}.scrap_index == 0.1000"
            - "ProductionOrder.${o_id}.scrap_tier == RED and ProductionOrder.${o_id}.posture == RESTRICTED"
      - name: channel_split_per_line_rounding_remainder
        grounds:
          - calculations.channel_allocation_split
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding with a pinned order — each
          channel line is round_half_up'd to whole units in the fixed sequence
          MUSEUM_STORE -> FACTORY_OUTLET -> ECOMMERCE, clamped to the remaining
          pool, and RETAIL_CHAIN takes the remainder. For build_qty 37 the
          pinned rule yields {1, 3, 6, 27}; a floor-then-distribute rule would
          give ECOMMERCE 5 (5.55 truncates), not 6 — the rounding mode is
          observable. Different mode from the sibling instance (tiered
          conditional weighting), satisfying the cross-mode requirement.
        test_recipe:
          setup:
            - "Product P exists; its InventoryRecord was auto-created"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "GET /foundry/inventory-records"
              payload: { product_id: "${p_id}" }
              as: RetailPlanner
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "GET /foundry/inventory-records/${inv_id}/allocation-plan"
              payload: { build_qty: 37 }
              as: RetailPlanner
          assert:
            - "response.data.museum_store_units == 1"
            - "response.data.factory_outlet_units == 3"
            - "response.data.ecommerce_units == 6"
            - "response.data.retail_chain_units == 27"
            - "museum_store_units + factory_outlet_units + ecommerce_units + retail_chain_units == 37"
  - rule_id: non_linear_state_machine
    instances:
      - name: melt_chemistry_adjustment_cycle
        grounds:
          - state_machines.MeltBatch.CHEMISTRY_CHECK_to_ADJUSTMENT
          - state_machines.MeltBatch.ADJUSTMENT_to_MELTING
          - calculations.carbon_equivalent
        distinguishing_aspect: |
          MeltBatch is a cyclic machine: CHEMISTRY_CHECK -> ADJUSTMENT -> (supplemental
          charge) -> MELTING -> (new readings) -> CHEMISTRY_CHECK. The first reading
          computes carbon_equivalent 4.49 (out of [3.90, 4.30]) and is ordered into
          adjustment; after a supplemental alloy charge the second reading computes
          4.30 and certifies. Entity: MeltBatch — distinct from the sibling
          instance's CastingUnit rework cycle.
        test_recipe:
          setup:
            - "Product P, order O (planned 10) released; melt B charged (state MELTING)"
            - "First chemistry reading is out of spec (carbon_equivalent 4.49); QualityInspector qi-1 orders an adjustment"
            - "Supplemental alloy charge returns the batch to MELTING; second reading computes 4.30"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "POST /foundry/production-orders"
              payload: { product_id: "${p_id}", planned_quantity: 10, scheduled_week: 40 }
              as: FoundryManager
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /foundry/production-orders/${o_id}/release"
              payload: {}
              as: FoundryManager
              captures: { o_v2: $.data.version }
            - call: "POST /foundry/melt-batches"
              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T10:00:00Z", planned_tap_end: "2026-09-02T12:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v2}" }
              as: MeltOperator
              as_user_id: op-1
              captures: { b_id: $.data.id }
            - call: "POST /foundry/melt-batches/${b_id}/charge"
              payload: { pig_iron_lbs: 810, scrap_steel_lbs: 790, returns_lbs: 320, alloy_lbs: 90 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/melt-batches/${b_id}/chemistry-readings"
              payload: { carbon_pct: 3.45, silicon_pct: 3.10, manganese_pct: 0.65, sulfur_pct: 0.045, phosphorus_pct: 0.020, bath_temp_f: 2725 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/melt-batches/${b_id}/certify-chemistry"
              payload: { decision: ORDER_ADJUSTMENT }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/melt-batches/${b_id}/charge"
              payload: { pig_iron_lbs: 0, scrap_steel_lbs: 0, returns_lbs: 0, alloy_lbs: 10 }
              as: MeltOperator
