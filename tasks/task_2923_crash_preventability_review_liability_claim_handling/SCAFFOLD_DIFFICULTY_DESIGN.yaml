  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: evidence_window_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=42]
          - entities.EvidenceItem.fields.window_start_at
          - entities.EvidenceItem.fields.window_end_at
          - entities.EvidenceItem.fields.kind
          - endpoints[POST /crashes/{id}/evidence-items]
        distinguishing_aspect: |
          Resource: a recording device's capture window on one Crash, where the
          interval semantics are pure half-open [start, end) with NO buffer, so a
          window beginning at exactly the previous window's end instant is
          accepted and only a genuine one-second intersection is refused — the
          opposite polarity from the Driver out-of-service instance, whose
          intervals are widened by SUSPENSION_BUFFER_HOURS before comparison.
        setup_note: "The conflict rule is scoped to the same kind on the same crash, so a same-window FORWARD_CAMERA and two identical SCENE_PHOTO windows are used as controls."
        test_recipe:
          setup:
            - "Terminal ORR01 and one Driver."
            - "A MODERATE crash on 2026-07-30T14:00:00Z."
            - "One existing TELEMATICS_SNAPSHOT evidence item with window [2026-07-30T13:00:00Z, 2026-07-30T15:00:00Z), preservation_state REQUESTED, retention_deadline_at 2026-10-31T00:00:00Z (comfortably after the clock at 2026-08-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Orrville Terminal", terminal_code: "ORR01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1601", full_name: "Elias Trueblood", cdl_number: "OH-CDL-1601", hire_date: "2011-09-19" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T14:10:00Z", location_text: "SR-57 at Smith Rd", severity: "MODERATE", route_class: "LOCAL_DELIVERY", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ECM-9001", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_base_id: $.data.id, ev_base_state: $.data.preservation_state }
          trigger:
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ECM-9001", window_start_at: "2026-07-30T15:00:00Z", window_end_at: "2026-07-30T17:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_after_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ECM-9001", window_start_at: "2026-07-30T11:00:00Z", window_end_at: "2026-07-30T13:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_before_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ECM-9001", window_start_at: "2026-07-30T14:59:59Z", window_end_at: "2026-07-30T16:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "FORWARD_CAMERA", source_device_id: "CAM-9001", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_cam_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "SCENE_PHOTO", source_device_id: "PHONE-114", window_start_at: "2026-07-30T14:20:00Z", window_end_at: "2026-07-30T14:40:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_ph1_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "SCENE_PHOTO", source_device_id: "PHONE-115", window_start_at: "2026-07-30T14:20:00Z", window_end_at: "2026-07-30T14:40:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_ph2_id: $.data.id }
          assert:
            - "${ev_base_state} == REQUESTED, so the pre-existing item is non-purged and therefore in scope for the conflict test"
            - "${ev_after_id} is a new id with HTTP 201 — [15:00, 17:00) starts exactly where [13:00, 15:00) ends and the touching pair is accepted, because 15:00 is excluded from the earlier window"
            - "${ev_before_id} is a new id with HTTP 201 — [11:00, 13:00) ends exactly where the base window starts, the mirror-image adjacency"
            - "${err_overlap} == ERR_EVIDENCE_WINDOW_CONFLICT with HTTP 409 — [14:59:59, 16:00) intersects the base window by exactly one second, and no EvidenceItem row was created"
            - "${ev_cam_id} is a new id with HTTP 201 — an identical [13:00, 15:00) window is legal for a different kind, so the rule is scoped per kind and per crash"
            - "${ev_ph1_id} and ${ev_ph2_id} are both new ids with HTTP 201 — SCENE_PHOTO is outside the three device kinds the rule names, so even two byte-identical windows are accepted"
            - "GET /crashes/${c_id}/evidence-items?kind=TELEMATICS_SNAPSHOT returns exactly 3 rows: [11:00,13:00), [13:00,15:00) and [15:00,17:00)"
            - "GET /crashes/${c_id}/evidence-items returns exactly 6 rows in total"
            - "Crash.${c_id}.evidence_posture == PARTIAL throughout — nothing was preserved, so the conflict rule is proven independent of preservation_state for REQUESTED items"

      - name: suspension_window_buffer_rejects_adjacent
        grounds:
          - validations[priority=41]
          - state_machines.Driver.SUSPENDED_PENDING_ACTION_to_SUSPENDED_PENDING_ACTION
          - entities.DisciplinaryAction.fields.suspension_start_at
          - entities.DisciplinaryAction.fields.suspension_end_at
          - entities.DisciplinaryAction.fields.override_flag
          - calculations.terminal_staffing_posture
        distinguishing_aspect: |
          Resource: a Driver's out-of-service capacity, whose intervals are
          compared as half-open AND THEN widened by SUSPENSION_BUFFER_HOURS (24),
          so a window that merely touches the previous one is refused and the
          first legal start is exactly 24 hours after the previous end — a
          strictly stronger separation semantics than the EvidenceItem windows,
          on a different resource entity.
        setup_note: "Both attempts carry override_reason so that the priority-62 staffing gate can never be the rule that answers; the only remaining discriminator is the priority-41 buffer."
        test_recipe:
          setup:
            - "Terminal POR01 with annual_miles_millions 4.0 and a single Driver hired 2011-09-19."
            - "A SEVERE crash on 2026-07-30T06:00:00Z with mechanical_factor true and all three required evidence kinds PRESERVED, so evidence_posture is COMPLETE."
            - "A decided ReviewCase with three unanimous PREVENTABLE ballots of (4,4,4,4,4) -> 4.00 each, committee_score 4.00, determination PREVENTABLE, so Driver.preventable_points is 8.0 and required_action_tier is SUSPENSION."
            - "One DisciplinaryAction of action_type SUSPENSION already ISSUED with window [2026-08-02T00:00:00Z, 2026-08-09T00:00:00Z) and retraining_course_code DDC-9-2026, issued with no override_reason because staffing_posture was OK (0 suspended of 1 active) at that moment."
            - "The Driver is now SUSPENDED_PENDING_ACTION, so Terminal.suspended_driver_count is 1 of 1 active and staffing_posture is CRITICAL."
            - "Clock stays at 2026-08-01T00:00:00Z; all three trigger windows are in the future, so ERR_FUTURE_TIMESTAMP is not in play (it constrains occurred_at-style observations, not scheduled windows)."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Portsmouth Terminal", terminal_code: "POR01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1701", full_name: "Fiona Delacroix", cdl_number: "OH-CDL-1701", hire_date: "2011-09-19" }
              as: SafetyAdmin
              as_user_id: "sa-001"
