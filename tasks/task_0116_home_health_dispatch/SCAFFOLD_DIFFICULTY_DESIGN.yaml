# =============================================================================
# Task 0116: Home Health Nurse Dispatch — Scaffold Difficulty Design (§1.8)
# Test Targeting Index — every instance grounds in SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pdgm_payment_provisional_vs_final_lupa_divergence
        grounds:
          - calculations.pdgm_provisional_payment
          - calculations.pdgm_final_payment
          - state_machines.Episode.OPEN_to_CLOSED
          - entities.PDGMClaim.fields.provisional_payment
          - entities.PDGMClaim.fields.final_payment
          - entities.PDGMClaim.fields.lupa_applied
        distinguishing_aspect: |
          Operates on the PDGMClaim entity (payment domain). The provisional variant uses a forward-looking
          BASE_30DAY_RATE * wage_index * case_mix_weight formula assuming the visit count will reach
          LUPA_THRESHOLD; the final variant runs chronologically over actually-COMPLETED visits and, when
          their count is strictly less than LUPA_THRESHOLD, switches to a per-visit LUPA formula. The two
          algorithms produce different dollar amounts for identical OASIS inputs — this is the dual-variant
          divergence on the PDGMClaim entity domain.
        test_recipe:
          setup:
            - "POST /clinicians create SN clinician with discipline=SN, license_expiration_date=2026-12-31"
            - "POST /clinicians create PT clinician with discipline=PT, license_expiration_date=2026-12-31"
            - "POST /clinicians create OT clinician with discipline=OT, license_expiration_date=2026-12-31"
            - "POST /patients create patient (wage_index forced to 1.0500 via test home_zip mapping)"
            - "POST /patients/{p}/oasis with assessment_reason=START_OF_CARE, assessment_date=2026-01-01, clinical_grouping=NEURO, functional_impairment_level=MEDIUM, admission_source=COMMUNITY, hha_companion_hours_ordered=0"
            - "POST /patients/{p}/oasis/{o}/lock"
            - "POST /patients/{p}/episodes with source_oasis_id={o} (start_date=2026-01-01, end_date=2026-03-01, timing=EARLY)"
          trigger:
            - "GET /episodes/{e}/claim immediately after Episode open (verify provisional_payment)"
            - "POST /episodes/{e}/visits scheduling exactly THREE visits (SN, PT, OT) on three different dates in January"
            - "POST /_clock/advance to 2026-01-31; POST /visits/{v}/complete on all three"
            - "POST /_clock/advance to 2026-03-02; POST /episodes/{e}/close"
            - "GET /episodes/{e}/claim (read final_payment and lupa_applied)"
          assert:
            - "After Episode open: PDGMClaim.provisional_payment == 2415.00"
            - "After Episode close: PDGMClaim.lupa_applied == true"
            - "After Episode close: PDGMClaim.final_payment == 519.75"
            - "PDGMClaim.final_payment != PDGMClaim.provisional_payment"

      - name: mileage_round_then_sum_vs_sum_then_round_divergence
        grounds:
          - calculations.mileage_reimbursement
          - entities.MileageLog.fields.reimbursement_amount
          - entities.PDGMClaim.fields.total_mileage_reimbursement
          - state_machines.Episode.OPEN_to_CLOSED
        distinguishing_aspect: |
          Operates on the MileageLog entity (mileage reimbursement domain) and aggregates onto PDGMClaim. Two
          valid prose readings — "round each MileageLog to cents then sum" vs "sum raw tier amounts then round
          once" — yield different cent totals at exact tier boundary inputs. The scaffold pins round-per-log
          first, so the dual variants diverge by one cent on the test inputs below.
        test_recipe:
          setup:
            - "Open an Episode (see fixture above) with two SN clinicians and two scheduled SN visits on 2026-01-05 and 2026-01-06"
            - "Complete both visits via POST /visits/{v}/complete"
          trigger:
            - "POST /visits/{v1}/mileage with miles_driven=31.7"
            - "POST /visits/{v2}/mileage with miles_driven=32.3"
            - "POST /_clock/advance to 2026-03-02; POST /episodes/{e}/close"
            - "GET /episodes/{e}/claim"
          assert:
            - "MileageLog for v1: reimbursement_amount == 21.94"
            - "MileageLog for v2: reimbursement_amount == 22.27"
            - "PDGMClaim.total_mileage_reimbursement == 44.21 (round-then-sum) and NOT 44.20 (sum-then-round)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: pdgm_case_mix_four_axis_lookup_with_evaluation_order
        grounds:
          - calculations.pdgm_provisional_payment
          - calculations.pdgm_final_payment
          - entities.PDGMClaim.fields.hipps_code
          - entities.PDGMClaim.fields.case_mix_weight
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order. The provisional formula has three multiplicative inputs
          (BASE_30DAY_RATE, wage_index, case_mix_weight) where the wage_index is rounded to 4 decimals BEFORE
          multiplication by case_mix_weight, then the product is rounded to 2 decimals. The case_mix_weight
          itself is keyed on a 4-axis tuple (timing_category, clinical_grouping, functional_impairment_level,
          admission_source). Reordering the rounding ("round only at the end") would produce different cents
          on edge cases. The scaffold pins the order; the test pins the literal output.
        test_recipe:
          setup:
            - "Force Patient.wage_index = 1.04275 (test home_zip mapping)"
            - "Create OASIS with clinical_grouping=MMTA_OTHER, functional=MEDIUM, admission=COMMUNITY"
            - "Lock OASIS and open Episode (timing_category becomes EARLY)"
          trigger:
            - "GET /episodes/{e}/claim"
          assert:
            - "wage_adjusted_base computed as round_half_up(2000 * 1.04275, 4) == 2085.5000"
            - "case_mix_weight == 1.0000 (CMW_TABLE lookup)"
            - "provisional_payment == round_half_up(2085.5000 * 1.0000, 2) == 2085.50"
            - "hipps_code starts with '1' (timing=EARLY) and ends with '1' constant"

      - name: mileage_three_tier_breakpoint_formula
        grounds:
          - calculations.mileage_reimbursement
          - entities.MileageLog.fields.reimbursement_amount
        distinguishing_aspect: |
          Mode (a) — formula with three inputs (m, tier rates, tier limits) and non-linear interaction via
          nested min/max selecting the active tier. The result depends on whether m falls in (0,30], (30,100],
          or (100, inf). A naive linear formula would not give correct results across tier boundaries.
        test_recipe:
          setup:
            - "Open Episode with one Clinician; schedule and complete one SN visit on 2026-01-10"
          trigger:
            - "POST /visits/{v}/mileage with miles_driven=150"
          assert:
            - "MileageLog.reimbursement_amount == round_half_up(30*0.70 + 70*0.55 + 50*0.40, 2) == 79.50"

      - name: lupa_per_visit_round_then_sum
        grounds:
          - calculations.pdgm_final_payment
          - entities.PDGMClaim.fields.final_payment
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Per-visit LUPA payment is rounded HALF_UP to 2
          decimals BEFORE summing across visits. Sum-then-round on raw wage-adjusted rates would yield a
          different total at fractional cents.
        test_recipe:
          setup:
            - "Force Patient.wage_index = 1.0500"
            - "Open Episode and schedule three visits: SN on 2026-01-05, PT on 2026-01-06, OT on 2026-01-07"
            - "Advance clock and complete all three; advance past end_date; close episode"
          trigger:
            - "GET /episodes/{e}/claim"
          assert:
            - "Per-visit rounded values: SN=168.00, PT=178.50, OT=173.25"
            - "final_payment == 168.00 + 178.50 + 173.25 == 519.75"
            - "lupa_applied == true"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: episode_branching_close_vs_expire
        grounds:
          - state_machines.Episode.OPEN_to_CLOSED
          - state_machines.Episode.OPEN_to_EXPIRED
          - entities.PDGMClaim.fields.lupa_applied
        distinguishing_aspect: |
          Branching (fork) state machine on Episode: OPEN forks to two terminal states with divergent side
          effects. CLOSED runs full pdgm_final_payment, may set lupa_applied=true. EXPIRED copies
          provisional_payment into final_payment, forces lupa_applied=false, and cascade-cancels SCHEDULED
          visits. These are distinct branches, not a linear pipeline.
        test_recipe:
          setup:
            - "Open two identical Episodes E1 and E2 on different patients (same OASIS inputs)"
            - "Schedule one SCHEDULED visit on E2 that is never completed"
          trigger:
            - "On E1: complete enough visits then POST /episodes/{e1}/close"
            - "On E2: POST /_clock/advance to end_date + 8 days; POST /_sweep/expire-episodes"
          assert:
            - "E1.status == CLOSED; PDGMClaim for E1 may have lupa_applied true or false depending on visit count, and final_payment is recomputed from completed visits"
            - "E2.status == EXPIRED; PDGMClaim for E2 has final_payment == provisional_payment and lupa_applied == false; the SCHEDULED visit on E2 transitions to CANCELLED"

      - name: oasis_branching_lock_supersede
        grounds:
          - state_machines.OASISAssessment.DRAFT_to_LOCKED
          - state_machines.OASISAssessment.LOCKED_to_SUPERSEDED
        distinguishing_aspect: |
          Branching state machine on OASISAssessment entity. From DRAFT, locking one OASIS forks the sibling
          DRAFT OASIS rows on the same patient into the SUPERSEDED terminal state as a side effect — multiple
          rows transitioning in a single request to a non-linear shape (one row LOCKED, others SUPERSEDED).
          Different entity from Episode.
        test_recipe:
          setup:
            - "Create Patient P"
            - "POST /patients/{p}/oasis to create DRAFT OASIS O1 (any valid SOC inputs)"
            - "POST /patients/{p}/oasis to create a second DRAFT OASIS O2 (any valid SOC inputs)"
          trigger:
            - "POST /patients/{p}/oasis/{o1}/lock"
          assert:
            - "OASIS O1.status == LOCKED"
            - "OASIS O2.status == SUPERSEDED (cascaded side effect, not a linear successor of LOCKED)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: sweep_expire_to_visit_cancel_to_claim_finalize_chain
        grounds:
          - state_machines.Episode.OPEN_to_EXPIRED
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - state_machines.PDGMClaim.PENDING_to_FINALIZED
          - entities.PDGMClaim.fields.total_mileage_reimbursement
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /_sweep/expire-episodes. Hop 1: sweep mutates Episode OPEN ->
          EXPIRED. Hop 2: Episode's transition itself triggers cascade-cancellation of every SCHEDULED Visit
          on that Episode (Visit SCHEDULED -> CANCELLED — caused by the Episode transition, not by the sweep
          call directly). Hop 3: the now-changed Visit set drives recomputation of
          total_mileage_reimbursement and the PDGMClaim transition PENDING -> FINALIZED — caused by the Visit
          set change, not directly by the sweep. Each link is caused by the previous link, not by the
          original API call.
        test_recipe:
          setup:
            - "Open Episode E on patient P starting 2026-01-01 (end_date 2026-03-01)"
            - "Schedule one SN visit V on 2026-02-15 (status SCHEDULED, never completed)"
            - "Optionally complete one earlier visit and add mileage so the claim has nonzero total_mileage_reimbursement to recompute"
          trigger:
            - "POST /_clock/advance to 2026-03-10 (end_date + 9 days)"
            - "POST /_sweep/expire-episodes"
          assert:
            - "Episode E.status == EXPIRED (hop 1)"
            - "Visit V.status == CANCELLED (hop 2 — caused by Episode transition)"
            - "PDGMClaim for E.status == FINALIZED with final_payment == provisional_payment, lupa_applied == false (hop 3 — caused by Visit set change)"

      - name: oasis_lock_to_episode_open_to_claim_create_chain
        grounds:
          - state_machines.OASISAssessment.DRAFT_to_LOCKED
          - state_machines.Episode.null_to_OPEN
          - state_machines.PDGMClaim.PENDING_to_FINALIZED
          - calculations.pdgm_provisional_payment
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST /patients/{p}/oasis/{o}/lock followed by POST /patients/{p}/
          episodes. Hop 1: locking the OASIS makes it eligible to open an Episode (consumed by the next
          request). Hop 2: opening the Episode synthesizes a paired PDGMClaim and runs pdgm_provisional_
          payment to write provisional_payment, hipps_code, case_mix_weight. Different originating trigger
          from the sweep cascade above.
        test_recipe:
          setup:
            - "Create Patient P and DRAFT OASIS O with clinical_grouping=WOUND, functional=HIGH, admission=COMMUNITY, wage_index=1.0000"
          trigger:
            - "POST /patients/{p}/oasis/{o}/lock (hop 1)"
            - "POST /patients/{p}/episodes with source_oasis_id=O (hop 2 — caused by hop 1's state change making O eligible)"
          assert:
            - "After hop 1: OASIS O.status == LOCKED"
            - "After hop 2: Episode E.status == OPEN with episode_type=INITIAL, timing_category=EARLY, end_date == start_date + 59 days"
            - "After hop 2: PDGMClaim exists in PENDING with case_mix_weight == 1.4000, provisional_payment == 2800.00 (= round_half_up(2000 * 1.0000, 4) * 1.4000)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_safety_visit_schedule_on_closed_episode_with_expired_license
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Episode.OPEN_to_CLOSED
        distinguishing_aspect: |
          Error-category pair: state (priority 6, ERR_EPISODE_NOT_OPEN) vs business_safety (priority 8,
          ERR_CLINICIAN_LICENSE_EXPIRED). When both fail simultaneously on POST /episodes/{e}/visits, the
          state check at priority 6 wins because it ranks higher.
        test_recipe:
          setup:
            - "Open Episode E, close it (any valid path)"
            - "Create Clinician C with license_expiration_date = 2026-01-01 (already expired by test clock)"
            - "Advance clock past episode end_date"
          trigger:
            - "POST /episodes/{e}/visits with clinician_id=C, visit_date=2026-02-01 (after C's license expires AND on a CLOSED episode)"
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_EPISODE_NOT_OPEN (NOT ERR_CLINICIAN_LICENSE_EXPIRED, even though both checks would fail)"

      - name: temporal_vs_fiscal_hha_visit_outside_window_and_over_cap
        grounds:
          - validations[priority=12]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair: business_temporal (priority 12, ERR_VISIT_OUTSIDE_EPISODE) vs business_fiscal
          (priority 16, ERR_HHA_HOURS_EXCEEDED). Different pair from the state-vs-safety pairing above. When
          both fail simultaneously on POST /episodes/{e}/visits, the temporal check at priority 12 wins.
        test_recipe:
          setup:
            - "Open Episode E with start_date=2026-01-01, end_date=2026-03-01, source OASIS hha_companion_hours_ordered=1.0"
            - "Already-scheduled HHA visit consuming 1.0 hour on 2026-02-01"
            - "Create Clinician C with discipline=HHA, valid license"
          trigger:
            - "POST /episodes/{e}/visits with visit_type=HHA, clinician_id=C, visit_date=2026-04-01 (after end_date AND would push hha hours over cap)"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_VISIT_OUTSIDE_EPISODE (NOT ERR_HHA_HOURS_EXCEEDED)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: lupa_threshold_strict_less_than_boundary
        grounds:
          - calculations.pdgm_final_payment
          - entities.PDGMClaim.fields.lupa_applied
          - state_machines.Episode.OPEN_to_CLOSED
        distinguishing_aspect: |
          Numeric threshold boundary on the LUPA visit-count metric. LUPA triggers iff completed_visit_count
          < LUPA_THRESHOLD (strict less-than). Exactly LUPA_THRESHOLD completed visits MUST NOT trigger LUPA.
          Reached via POST /episodes/{e}/close. Different metric (visit count) from the empty-set boundary
          below.
        test_recipe:
          setup:
            - "Open Episode E with Patient.wage_index=1.0500, NEURO/MEDIUM/COMMUNITY (provisional=2415.00)"
            - "Schedule and complete EXACTLY 5 visits across distinct dates and clinicians"
          trigger:
            - "POST /_clock/advance past end_date; POST /episodes/{e}/close; GET /episodes/{e}/claim"
          assert:
            - "PDGMClaim.lupa_applied == false (count == 5 is NOT strictly less than 5)"
            - "PDGMClaim.final_payment == 2415.00 (case-mix path, equals provisional)"

      - name: mileage_zero_miles_rejection_boundary
        grounds:
          - validations[priority=17]
          - calculations.mileage_reimbursement
        distinguishing_aspect: |
          Zero/empty boundary on a different metric (miles) reached through a different endpoint
          (POST /visits/{v}/mileage). miles_driven must be strictly > 0; exactly 0 is rejected.
        test_recipe:
          setup:
            - "Open Episode; schedule and complete one visit V"
          trigger:
            - "POST /visits/{v}/mileage with miles_driven=0"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_MILEAGE_NOT_POSITIVE"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: episode_open_requires_oasis_locked
        grounds:
          - state_machines.Episode.null_to_OPEN
          - state_machines.OASISAssessment.DRAFT_to_LOCKED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Episode -> OASISAssessment. Episode.null_to_OPEN's preconditions inspect the state of a
          different entity (OASIS.status == LOCKED). Opening an Episode against a DRAFT OASIS is rejected
          with ERR_OASIS_NOT_LOCKED.
        test_recipe:
          setup:
            - "Create Patient P and DRAFT OASIS O (do NOT lock)"
          trigger:
            - "POST /patients/{p}/episodes with source_oasis_id=O"
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_OASIS_NOT_LOCKED"

      - name: visit_complete_requires_clinician_available_at_schedule_time
        grounds:
          - state_machines.Visit.null_to_SCHEDULED
          - entities.Clinician.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          Different entity pair: Visit -> Clinician. Scheduling a Visit (Visit.null_to_SCHEDULED) inspects
          Clinician.status (a different entity). A SUSPENDED Clinician blocks the transition with
          ERR_CLINICIAN_NOT_AVAILABLE. Different entity pair from Episode/OASIS.
        test_recipe:
          setup:
            - "Open Episode E"
            - "Create Clinician C with discipline=SN, license_expiration_date=2030-01-01"
            - "PATCH /clinicians/{c} setting status=SUSPENDED"
          trigger:
            - "POST /episodes/{e}/visits with clinician_id=C, visit_type=SN, valid times"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_CLINICIAN_NOT_AVAILABLE"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: clinician_visit_half_open_minute_overlap
        grounds:
          - validations[priority=14]
          - state_machines.Visit.null_to_SCHEDULED
          - concurrency_rules[clinician double-booked]
        distinguishing_aspect: |
          Resource entity: Clinician. Interval semantics: half-open minute intervals [start_minute,
          end_minute). Touching at the same minute (end_minute_A == start_minute_B) is permitted; any
          shared minute is rejected. Same calendar visit_date is the comparison key.
        test_recipe:
          setup:
            - "Open Episode E"
            - "Create one SN Clinician C"
            - "Schedule visit V1 on 2026-01-10 with start_minute=480, end_minute=540"
          trigger:
            - "Touching test: POST /episodes/{e}/visits with C, 2026-01-10, start_minute=540, end_minute=600 — expect 201"
            - "Overlap test: POST /episodes/{e}/visits with C, 2026-01-10, start_minute=530, end_minute=590 — expect 409"
          assert:
            - "Touching schedule succeeds (V2.status == SCHEDULED)"
            - "Overlap schedule fails with status 409 and error_id == ERR_CLINICIAN_DOUBLE_BOOKED"

      - name: hha_companion_hours_aggregate_cap_overlap
        grounds:
          - calculations.hha_companion_hours_consumed
          - validations[priority=16]
          - entities.OASISAssessment.fields.hha_companion_hours_ordered
        distinguishing_aspect: |
          Different resource entity: Episode (companion-hour budget on the OASIS plan of care). Different
          interval semantics: aggregate capacity over hours rather than instantaneous minute overlap. Two
          HHA visits on different dates do not collide on time but collectively exceed the OASIS-ordered
          hour cap. Resource is the budget pool, not the clinician's calendar.
        test_recipe:
          setup:
            - "Create Patient P and OASIS O with hha_companion_hours_ordered=3.0; lock O"
            - "POST /patients/{p}/episodes with source_oasis_id=O"
            - "Create HHA Clinician C with valid license"
            - "Schedule HHA visit V1 on 2026-01-05 with start_minute=480, end_minute=600 (2.00 hours)"
          trigger:
            - "POST /episodes/{e}/visits scheduling HHA V2 on 2026-01-10 with start_minute=540, end_minute=660 (also 2.00 hours)"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_HHA_HOURS_EXCEEDED (cumulative 2.00 + 2.00 = 4.00 exceeds cap of 3.00)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: hha_hours_consumed_invariant_under_schedule_then_cancel
        grounds:
          - state_machines.Visit.null_to_SCHEDULED
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - calculations.hha_companion_hours_consumed
        distinguishing_aspect: |
          Conserved quantity: total_consumed_hha_hours = sum(Visit.hha_hours where status in {SCHEDULED,
          COMPLETED} and visit_type=HHA on this Episode). The forward action POST /episodes/{e}/visits and
          its compensator POST /visits/{v}/cancel MUST leave this aggregate at its pre-action value. Drift
          would falsely block subsequent legitimate scheduling.
        test_recipe:
          setup:
            - "Open Episode E with OASIS hha_companion_hours_ordered=2.0"
            - "Create HHA Clinician C"
            - "Record baseline: compute consumed_hha_hours from HHA visits on E with status in {SCHEDULED, COMPLETED} -> expected 0.00"
          trigger:
            - "POST /episodes/{e}/visits scheduling HHA V on 2026-01-05 with start_minute=540, end_minute=660 (2.00 hours)"
            - "POST /visits/{v}/cancel"
          assert:
            - "Immediately after schedule: consumed_hha_hours == 2.00"
            - "After cancel: consumed_hha_hours == 0.00 (returns to baseline, no drift)"
            - "A subsequent POST /episodes/{e}/visits scheduling another 2.00-hour HHA visit succeeds (proves the invariant held: the cap is free again)"

      - name: pdgm_payment_invariant_under_episode_expire_uses_provisional
        grounds:
          - state_machines.Episode.OPEN_to_EXPIRED
          - calculations.pdgm_provisional_payment
          - entities.PDGMClaim.fields.provisional_payment
          - entities.PDGMClaim.fields.final_payment
        distinguishing_aspect: |
          Different conserved quantity: dollars on PDGMClaim — provisional_dollars_recognized. Forward action
          is Episode OPEN (writes provisional_payment); compensator is Episode OPEN -> EXPIRED via abandonment
          sweep, which pins final_payment := provisional_payment. The invariant: the dollar amount written at
          OPEN is the dollar amount preserved at EXPIRED (no recomputation drift). Different quantity (USD)
          from HHA hours.
        test_recipe:
          setup:
            - "Force Patient.wage_index=1.0500"
            - "Create OASIS with clinical_grouping=NEURO, functional=MEDIUM, admission=COMMUNITY; lock"
            - "POST /patients/{p}/episodes -> provisional_payment is written as 2415.00"
            - "Record baseline: GET /episodes/{e}/claim -> provisional_payment == 2415.00, final_payment == null"
          trigger:
            - "POST /_clock/advance to Episode.end_date + 8 days"
            - "POST /_sweep/expire-episodes"
            - "GET /episodes/{e}/claim"
          assert:
            - "Episode.status == EXPIRED"
            - "PDGMClaim.status == FINALIZED"
            - "PDGMClaim.final_payment == 2415.00 (== provisional_payment, the conserved dollar quantity)"
            - "PDGMClaim.lupa_applied == false"
            - "PDGMClaim.provisional_payment unchanged at 2415.00"
