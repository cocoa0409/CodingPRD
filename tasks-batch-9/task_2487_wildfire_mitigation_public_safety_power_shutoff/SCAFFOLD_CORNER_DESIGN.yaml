      - name: cascading_side_effects_chain_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: reenergize_resumes_mitigation_then_stamps_restore_then_demobilizes_centers
          rationale: "The deepest cascade in the design — patrol completion into circuit clearance, re-energization into mitigation resumption, scope stamping and resource-centre demobilisation — is walked hop by hop there, with the ordering sensitivity asserted."
      - name: cascade_only_touches_non_terminal_children
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: deenergize_locks_posture_and_suspends_mitigation_execution
          rationale: "That instance shows the suspension cascade reaching only IN_EXECUTION projects while APPROVED and COMPLETED siblings are left alone."
      - name: dual_variant_index_computation
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: fpi_forecast_envelope_vs_validated_latest_divergence
          rationale: "The FORECAST worst-case envelope and the VALIDATED latest-observation variant are computed over identical data there and diverge by design."
      - name: dual_variant_benefit_window
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: net_benefit_pre_event_vs_post_event_window
          rationale: "The PRE_EVENT / POST_EVENT switch and the delta it applies to the impact score are that instance's subject."
      - name: instantaneous_threshold_at_the_arming_floor
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: net_benefit_ratio_exactly_at_threshold_arms
          rationale: "The 0.25 arming floor is probed from both sides there, which is the instantaneous-threshold boundary claim for this layer."
      - name: threshold_reset_after_a_resource_center_is_reused
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: resource_center_reset_buffer_closed_interval_plus_240_minutes
          rationale: "The 240-minute reset buffer — the layer's reset claim — is asserted at 239 and at exactly 240 minutes there."

  # =========================================================================
  # §1.9 SECTION 9 — CONSISTENCY MODEL (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.psps_scope_determination
          - calculations.ignition_risk_avoided_score
        distinguishing_aspect: "The scope call's own 200 response already carries every field its cascade produced — the three scope rows' counts, the summed ignition score, the impact score and the ratio — so no follow-up read is needed to observe them and no value lags by a request."
        test_recipe:
          setup:
            - "The F-CHAIN with ALPHA's R5 index and five customers, EV-1 created but not yet scoped."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
          trigger:
            - *k_scope
            - call: "GET /psps-events/${ev1_id}"
              payload: {}
              as: PSPSDutyOfficer
            - call: "GET /psps-events/${ev1_id}/scopes"
              payload: {}
              as: PSPSDutyOfficer
          assert:
            - "the scope response itself reports confirmed_scope_count 3, excluded_scope_count 0, impacted_customer_count 5, medical_baseline_customer_count 1 and critical_facility_count 1"
            - "the same response already carries ignition_risk_avoided_score 15.48, customer_impact_score 45.60, adjusted_customer_impact_score 45.60 and net_benefit_ratio 0.3395"
            - "the follow-up GET returns byte-identical values — nothing settled between the two requests"
            - "the scope listing already returns all three EventScope rows with their fpi_score_applied and ignition_risk_term populated"

      - name: a_multi_entity_cascade_is_fully_visible_to_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.PSPSEvent
          - state_machines.Circuit
          - state_machines.MitigationProject
        distinguishing_aspect: "A single de-energize call writes across four entities — event, three circuits, their scope rows and an in-flight mitigation project — and every one of those writes is readable in the immediately following request, with no intermediate state where the event is ACTIVE but a circuit is still ENERGIZED."
        test_recipe:
          setup:
            - "EV-1 armed over the F-CHAIN with MP-CC in IN_EXECUTION on ALPHA after a 2.0-mile completion, and the clock at 2026-08-15T19:00:00Z."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_mp_cc
            - *k_mp_cc_submit
            - *k_mp_cc_approve
            - *k_get_alpha_v
            - call: "POST /mitigation-projects/${mp_cc_id}/record-completion"
              payload: { completed_miles_delta: 2.0, completion_date: "2026-07-01T00:00:00Z", expected_circuit_version: "${alpha_v_pre}" }
              as: AssetInspector
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - *k_batch_adv
            - *k_clock_0813
            - *k_disp_adv
            - *k_arm
            - *k_batch_imm
            - *k_clock_0815_17
            - *k_disp_imm
            - *k_clock_0815_19
          trigger:
            - *k_deenergize
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: GridPlanner
            - call: "GET /mitigation-projects/${mp_cc_id}"
              payload: {}
              as: GridPlanner
            - call: "GET /psps-events/${ev1_id}/scopes"
              payload: {}
              as: PSPSDutyOfficer
          assert:
            - "the de-energize response reports scope_status ACTIVE with actual_de_energized_at 2026-08-15T19:00:00Z"
            - "the immediately following circuit read already shows energization_state DE_ENERGIZED and risk_posture LOCKED"
            - "the project read already shows status SUSPENDED with completed_miles still 2.0"
            - "the scope listing already shows all three rows with restored_at null and their customer_count_snapshot intact"
            - "no read in the chain observes a half-applied cascade — there is no ordering of these four GETs that yields a different answer"
