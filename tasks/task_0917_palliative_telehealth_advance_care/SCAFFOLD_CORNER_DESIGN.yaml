            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/code-status-orders"
              payload: { patient_id: "${p_id}", requested_code_status: "DNR", surrogate_stated: true, patient_prior_statement: "FULL_CODE" }
              as: PalliativePhysician
