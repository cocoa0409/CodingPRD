scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.BenefitPlan, endpoints]
        distinguishing_aspect: "POST /plans with all required fields returns 201; status=ACTIVE, version=1, id/created_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pbm/plans"
              payload: { name: "Gold", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response.status == 201"
            - "BenefitPlan.${plan_id}.status == ACTIVE"
            - "BenefitPlan.${plan_id}.version == 1"
            - "BenefitPlan.${plan_id}.deductible_cents == 50000"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pbm/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_drug_missing_tier_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.FormularyDrug.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /formulary-drugs omitting required tier returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "N", drug_name: "N", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_drug_invalid_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.FormularyDrug.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /formulary-drugs with tier='TIER_9' (not in enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "N", drug_name: "N", tier: "TIER_9", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: drug_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds: [entities.FormularyDrug.fields.pa_required, entities.FormularyDrug.fields.is_specialty]
        distinguishing_aspect: "Omitting is_specialty/pa_required/rebate_per_fill_cents yields defaults false/false/0 and status ACTIVE."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "N", drug_name: "N", tier: "TIER_1", ingredient_cost_cents: 10000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
          assert:
            - "FormularyDrug.${drug}.pa_required == false"
            - "FormularyDrug.${drug}.is_specialty == false"
            - "FormularyDrug.${drug}.rebate_per_fill_cents == 0"
            - "FormularyDrug.${drug}.status == ACTIVE"

      - name: member_computed_accumulators_start_zero_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Member.fields.deductible_met_cents, entities.Member.fields.oop_met_cents]
        distinguishing_aspect: "On member create the computed accumulators are 0 regardless of any client-supplied value."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
          assert:
            - "Member.${m}.deductible_met_cents == 0"
            - "Member.${m}.oop_met_cents == 0"
            - "Member.${m}.status == ACTIVE"

      - name: protocol_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.StepTherapyProtocol]
        distinguishing_aspect: "StepTherapyProtocol has common_fields:false — its create response carries id and created_at but no version field and no update endpoint exists."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pbm/step-therapy-protocols"
              payload: { plan_id: "${plan_id}", name: "ST", first_line_ndcs: ["A1", "A2"] }
              as: PlanAdmin
              captures: { proto: $.data.id }
          assert:
            - "response.status == 201"
            - "StepTherapyProtocol.${proto}.name == ST"

      - name: list_plans_pagination_envelope
        claim_type: Listing
        grounds: [entities.BenefitPlan, endpoints]
        distinguishing_aspect: "GET /plans returns an array envelope with total_count and has_more present."
        test_recipe:
          setup: ["One plan exists."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
          trigger:
            - call: "GET /pbm/plans"
              payload: {}
              as: PlanAdmin
          assert:
            - "response.status == 200"
            - "response.meta.total_count >= 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pa_decide_on_already_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PriorAuthorization.PENDING_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding a PA already APPROVED returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["PA submitted then APPROVED."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "X", drug_name: "X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
              captures: { pa_v1: $.data.version }
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "DENY", expected_prior_authorization_version: "${pa_v1}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "PriorAuthorization.${pa}.status == APPROVED"

      - name: appeal_on_pending_pa_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PriorAuthorization.DENIED_to_APPEALED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Appealing a PA that is still PENDING_REVIEW (not DENIED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["PA submitted, still PENDING_REVIEW."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "X", drug_name: "X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id }
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/appeal"
              payload: {}
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reverse_already_reversed_claim_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Claim.PAID_to_REVERSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reversing a claim already REVERSED returns ERR_INVALID_STATE (409); accumulators unchanged."
        test_recipe:
          setup: ["A PAID claim, then reversed once."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-06-10T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "Z", drug_name: "Z", tier: "TIER_1", ingredient_cost_cents: 10000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_expired_pa_rejects_decide
        claim_type: terminal_state
        grounds: [state_machines.PriorAuthorization.APPROVED_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An EXPIRED PA (terminal) rejects any decide attempt with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["PA approved with authorized_fills=1, then a PAID claim consumes the last fill -> EXPIRED."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-06-20T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PA", drug_name: "PA", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
              captures: { pa_v1: $.data.version }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL", prior_auth_id: "${pa}" }
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "DENY", expected_prior_authorization_version: "${pa_v1}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "PriorAuthorization.${pa}.status == EXPIRED"

      - name: finalize_rebates_on_already_finalized_is_noop
        claim_type: valid_transition
        grounds: [state_machines.RebateAccrual.PROVISIONAL_to_FINALIZED]
        distinguishing_aspect: "A second finalize sweep finalizes 0 accruals (already-FINALIZED accruals are skipped, not re-finalized); finalized_count==0."
        test_recipe:
          setup: ["Plan with a rebate agreement; one PAID rebate claim; finalize once."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-06-25T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /pbm/rebate-agreements"
              payload: { plan_id: "${plan_id}", manufacturer_name: "Acme", clawback_pct: 1.0 }
              as: PlanAdmin
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "RB", drug_name: "RB", tier: "TIER_1", ingredient_cost_cents: 10000, rebate_per_fill_cents: 4000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
            - call: "POST /pbm/plans/${plan_id}/finalize-rebates"
              payload: { expected_benefit_plan_version: "${plan_v}" }
              as: PlanAdmin
          trigger:
            - call: "GET /pbm/plans/${plan_id}"
              payload: {}
              as: PlanAdmin
              captures: { plan_vnow: $.data.version }
          assert:
            - "response.status == 200"

  # ===========================================================================
  - section: calculations
    instances:
      - name: gross_cost_90day_is_3x_30day
        claim_type: Correct Result
        grounds: [calculations.calc_gross_cost, entities.Claim.fields.gross_cost_cents]
        distinguishing_aspect: "A 90-day fill of a drug with ingredient_cost 10000 has gross_cost_cents 30000 (3x)."
        test_recipe:
          setup: ["Plan deductible 0; T1 drug ingredient 10000; member."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 }, mail_order_copay_multiplier: 2.0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "T1", drug_name: "T1", tier: "TIER_1", ingredient_cost_cents: 10000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 90, pharmacy_type: "MAIL_ORDER" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.gross_cost_cents == 30000"
            - "Claim.${claim}.member_pay_cents == 2000"

      - name: rebate_30day_provisional_accrual_value
        claim_type: Constants Applied
        grounds: [calculations.calc_rebate_accrual, entities.RebateAccrual.fields.accrued_cents]
        distinguishing_aspect: "A 30-day fill of a drug with rebate_per_fill 4000 accrues exactly 4000c PROVISIONAL."
        test_recipe:
          setup: ["Plan + rebate agreement; rebate drug rebate_per_fill 4000; member files 30-day claim."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-07-12T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/rebate-agreements"
              payload: { plan_id: "${plan_id}", manufacturer_name: "Acme" }
              as: PlanAdmin
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "RB", drug_name: "RB", tier: "TIER_1", ingredient_cost_cents: 10000, rebate_per_fill_cents: 4000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.rebate_status == ACCRUED"
            - "RebateAccrual[claim_id=${claim}].accrued_cents == 4000"
            - "RebateAccrual[claim_id=${claim}].status == PROVISIONAL"

      - name: deductible_phase_member_pays_full_gross
        claim_type: Correct Result
        grounds: [calculations.calc_member_pay, calculations.acc_deductible_met]
        distinguishing_aspect: "Fresh member, gross 30000 below deductible 50000 -> member_pay 30000 all deductible, copay 0, plan_paid 0."
        test_recipe:
          setup: ["Plan deductible 50000; fresh member; T2 drug ingredient 30000."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-07-14T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "T2", drug_name: "T2", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.member_pay_cents == 30000"
            - "Claim.${claim}.plan_paid_cents == 0"
            - "Member.${m}.deductible_met_cents == 30000"

      - name: step_satisfied_by_prior_first_line_paid_claim
        claim_type: Input Set Filtering
        grounds: [calculations.calc_step_satisfied, entities.StepTherapyProtocol.fields.first_line_ndcs]
        distinguishing_aspect: "Member with a prior PAID first-line claim (ndc FL1) passes the step gate on the second-line drug -> PAID."
        test_recipe:
          setup: ["Plan; protocol first_line_ndcs=[FL1]; first-line drug ndc FL1; second-line drug with step_therapy_protocol_id set."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-07-16T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/step-therapy-protocols"
              payload: { plan_id: "${plan_id}", name: "ST", first_line_ndcs: ["FL1"] }
              as: PlanAdmin
              captures: { proto: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "FL1", drug_name: "First", tier: "TIER_1", ingredient_cost_cents: 10000 }
              as: PlanAdmin
              captures: { first: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "SL1", drug_name: "Second", tier: "TIER_2", ingredient_cost_cents: 30000, step_therapy_protocol_id: "${proto}" }
              as: PlanAdmin
              captures: { second: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${first}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${second}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.adjudication_status == PAID"

