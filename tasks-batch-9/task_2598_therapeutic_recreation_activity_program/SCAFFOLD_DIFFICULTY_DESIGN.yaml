              as: RecreationTherapist
              captures: { plan_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Tea Time", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Sun Porch", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-08T10:00:00Z", ends_at: "2026-08-08T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "REVISE", review_reason: "THERAPIST_REQUEST" }
              as: RecreationTherapist
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == \"ERR_ENROLLMENT_GATED\""
            - "${err_id} != \"ERR_DUPLICATE_ENROLLMENT\", even though ${rec_id} is a non-VOID PLANNED record for the same (resident, session) pair"
            - "ActivitySession.${sess_id}.enrolled_count == 1"
            - "ParticipationRecord.${rec_id}.status == PLANNED"
  - rule_id: boundary_precision_check
    instances:
      - name: staffing_ratio_boundary_exact_equality_admitted
        metric: "required_staff_count vs ActivitySession.assigned_staff_count"
        endpoint: "POST /recreation/sessions/{session_id}/enrollments"
        grounds:
          - calculations.session_staffing_requirement
          - validations.priority_50_ERR_STAFFING_RATIO_EXCEEDED
          - entities.ActivitySession.fields.weighted_supervision_load
        distinguishing_aspect: |
          Boundary on the staffing comparator, checked on the enrollment endpoint. The rule is
          required_staff_count <= assigned_staff_count, so exact equality (1 <= 1) must be
          ADMITTED and only the next enrollment, which pushes the requirement to 2, may be
          rejected. Both an off-by-one that rejects at equality and one that admits at
          requirement 2 are caught.
        test_recipe:
          setup:
            - "five ADMITTED residents each assessed MILD_IMPAIRMENT + INDEPENDENT so every supervision_tier == TIER_1 and every TIER_WEIGHT == 1.0"
            - "one program with staffing_ratio_denominator 4, max_group_size 10 and max_supervision_tier TIER_3, in a room of capacity 10"
            - "one session with assigned_staff_count 1, so the ratio boundary is crossed at the fifth enrollment and not at the fourth"
            - "the first three residents are enrolled during setup"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Sing Along", domain: "CREATIVE", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
