  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_traverses_held_challenged_held_cycle_twice_with_expiry_preserved_and_asymmetric_credit_ledger
        grounds:
          - state_machines.EventBooking.HELD_to_CHALLENGED
          - state_machines.EventBooking.CHALLENGED_to_HELD
          - state_machines.HoldChallenge.OPEN_to_WITHDRAWN
          - state_machines.HoldChallenge.OPEN_to_DENIED
          - entities.AnchorTenant.fields.challenge_credits
          - entities.EventBooking.fields.hold_expires_at
          - validations[priority=98]
        distinguishing_aspect: |
          The booking re-enters a state it has already occupied: HELD -> CHALLENGED -> HELD twice on
          one row, and the loop is NOT idempotent in its ledger — the withdraw path returns
          challenge_credits from 1 to 2 while the deny path leaves it at 1, so after two traversals
          credits read exactly 1 while hold_placed_at and hold_expires_at are byte-identical to
          their pre-cycle values (2026-08-01T00:00:00.000Z / 2026-08-08T00:00:00.000Z), and the
          second challenge is accepted only because ERR_DUPLICATE_CHALLENGE counts OPEN rows alone.
