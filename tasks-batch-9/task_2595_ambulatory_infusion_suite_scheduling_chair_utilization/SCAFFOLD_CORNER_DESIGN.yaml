# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2595 — Ambulatory Infusion Suite Scheduling & Chair Utilization
#
# Walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. Nine `section:` values; every `claim_type:` is a row name
# taken verbatim from the guide's per-section tables. Corners already asserted
# by a §1.8 instance appear as `excluded_because:` stubs naming that instance.
#
# Standing fixture conventions used throughout (so every chain is readable):
#   center      open 480 close 1140, turnover_buffer 15, urgent_reserve 1,
#               addon_cutoff 900, lab_validity_hours 72, stagger_grid 15,
#               acuity_slot 30
#   drug        base 120 / min 90 / premed 30 / obs_first 60 / obs_sub 30 /
#               acuity 2 / stability 240 / unit_cost 90000 / lab gate on
#               (anc >= 1.5, platelets >= 100)
#   template    dose_tier MID -> acuity_points 2, stagger_offset_minutes 15
#   plan        dose_mg_per_kg 10 on weight_kg 70 -> dose_mg 700 -> MID tier
#   appointment premed 30 + admin max(90, 120+30)=150 + observation 60
#               -> chair_minutes 240, acuity_points 3; booked at 540 -> [540,780)
# The logical clock reads 2026-08-01T00:00:00Z until a test moves it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_infusion_center_returns_every_declared_field_with_zeroed_chair_counters
        claim_type: creation
        grounds:
          - entities.InfusionCenter
          - endpoints[POST /infusion-centers]
          - response_envelope.success
        distinguishing_aspect: |
          The 201 body carries all nine input fields echoed back plus both computed
          counters at 0 and the four common fields, with version exactly 1 — no
          chair exists yet, so available_chair_count and reserved_chair_count are
          the empty-collection case rather than absent keys.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-03T06:00:00Z so created_at is a literal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
          assert:
            - "HTTP status == 201 and response_type == 'object'"
            - "InfusionCenter.${ctr}.name == 'Riverside Infusion Suite'"
            - "InfusionCenter.${ctr}.open_minute == 480 and InfusionCenter.${ctr}.close_minute == 1140"
            - "InfusionCenter.${ctr}.turnover_buffer_minutes == 15 and InfusionCenter.${ctr}.urgent_reserve_chair_count == 1"
            - "InfusionCenter.${ctr}.addon_cutoff_minute == 900 and InfusionCenter.${ctr}.lab_validity_hours == 72"
            - "InfusionCenter.${ctr}.stagger_grid_minutes == 15 and InfusionCenter.${ctr}.acuity_slot_minutes == 30"
            - "InfusionCenter.${ctr}.available_chair_count == 0 and InfusionCenter.${ctr}.reserved_chair_count == 0"
            - "InfusionCenter.${ctr}.version == 1 and created_at == '2026-08-03T06:00:00Z' and updated_at == '2026-08-03T06:00:00Z'"
            - "meta.api_request_id and meta.api_request_timestamp are both present per response_envelope.success"

      - name: get_chair_by_id_returns_the_stored_row_and_its_committed_minutes
        claim_type: retrieval
        grounds:
          - entities.Chair
          - entities.Chair.fields.committed_minutes
          - endpoints[GET /chairs/{id}]
        distinguishing_aspect: |
          A read-back of one chair after a single 240-minute booking returns the five
          stored input fields unchanged AND the derived committed_minutes == 240 in the
          same payload, so the GET is not a thin echo of POST input.
        test_recipe:
          setup:
            - "One center, one chair A1, one nurse (capacity 6, shift 480-1140), the standing gate drug, a MID template, one patient and one ACTIVE plan."
            - "One appointment booked on 2026-08-10 at requested_start_minute 540, so its window is [540,780) and chair_minutes is 240."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
          trigger:
            - call: "GET /chairs/${ch1}"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nr1}"
          assert:
            - "HTTP status == 200"
            - "Chair.${ch1}.id == ${ch1} and Chair.${ch1}.center_id == ${ctr}"
            - "Chair.${ch1}.label == 'A1' and Chair.${ch1}.chair_type == 'STANDARD'"
            - "Chair.${ch1}.status == 'AVAILABLE' and Chair.${ch1}.reserved_for_urgent == false"
            - "Chair.${ch1}.committed_minutes == 240"
            - "Chair.${ch1}.version == 1 — booking an appointment does not version the chair, only its derived committed_minutes moves"

      - name: list_appointments_filtered_by_chair_returns_the_declared_service_date_order
        claim_type: listing
        grounds:
          - endpoints[GET /appointments]
          - entities.Appointment.fields.chair_id
          - entities.Appointment.fields.service_date
        distinguishing_aspect: |
          Two visits on the same chair are created in reverse chronological order
          (2026-08-14 first, then 2026-08-10) and the chair_id-filtered list returns
          them 2026-08-10 then 2026-08-14, proving the declared service_date ASC,
          start_minute ASC ordering overrides insertion order; a second call adding the
          service_date filter narrows the same list to one row.
        test_recipe:
          setup:
            - "One center, one chair A1, one nurse, the standing gate drug, a MID template, one patient, one ACTIVE plan with total_cycles 6."
            - "Cycle 2 is booked first for 2026-08-14 at 540; cycle 1 is booked second for 2026-08-10 at 540. Different dates, so neither the buffered chair rule nor the patient double-booking rule is engaged."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-14", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap_late: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap_early: $.data.id }
          trigger:
            - call: "GET /appointments"
              payload: { chair_id: "${ch1}" }
              as: Scheduler
              captures: { first_id: "$.data[0].id", second_id: "$.data[1].id" }
            - call: "GET /appointments"
              payload: { chair_id: "${ch1}", service_date: "2026-08-14" }
              as: Scheduler
          assert:
            - "First response HTTP status == 200 and response_type == 'array' with exactly 2 rows"
            - "${first_id} == ${ap_early} and ${second_id} == ${ap_late} — service_date ASC, not creation order"
            - "Every row of the first response carries chair_id == ${ch1}"
            - "Second response contains exactly 1 row and its id == ${ap_late}"
            - "Both rows report chair_minutes == 240 and end_minute == 780"

      - name: get_unknown_drug_lot_id_returns_lot_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /drug-lots/{id}]
          - validations[priority 20]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: |
          The collection is deliberately non-empty (one real lot exists) so a 404 proves
          per-id resolution rather than an empty-table shortcut, and the error_id is the
          lot-specific member of the priority-20 catalog, not a generic 404.
        test_recipe:
          setup:
            - "One drug with one real lot of 10 units."
          setup_api_calls:
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-A", units_received: 10, expires_on: "2026-12-31T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id }
          trigger:
            - call: "GET /drug-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and response_type == 'error'"
            - "${err} == 'ERR_LOT_NOT_FOUND'"
            - "GET /drug-lots/${lot1} still returns 200 with units_available == 10 and status == 'AVAILABLE'"

      - name: create_patient_missing_required_mrn_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /patients]
          - entities.Patient.fields.mrn
          - validations[priority 10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          mrn is the one Patient input field with no declared default, so omitting it is
          a 400 ERR_INVALID_REQUEST at priority 10 — before any uniqueness check at
          priority 130 — and no Patient row is created.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and ${err} == 'ERR_INVALID_REQUEST'"
            - "GET /patients returns an empty array — the rejected request created no row"

      - name: omitting_optional_center_and_chair_inputs_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.InfusionCenter.fields.turnover_buffer_minutes
          - entities.InfusionCenter.fields.acuity_slot_minutes
          - entities.Chair.fields.chair_type
          - entities.Chair.fields.status
          - entities.Chair.fields.reserved_for_urgent
        distinguishing_aspect: |
          A center created with only name/open_minute/close_minute comes back with all
          six tuning knobs at their §1.1 defaults (15 / 1 / 900 / 72 / 15 / 30), and a
          chair created with only center_id/label comes back STANDARD, AVAILABLE and
          not reserved — defaults are applied server-side, not left null.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1" }
              as: Scheduler
              captures: { ch1: $.data.id }
          assert:
            - "InfusionCenter.${ctr}.turnover_buffer_minutes == 15"
            - "InfusionCenter.${ctr}.urgent_reserve_chair_count == 1"
            - "InfusionCenter.${ctr}.addon_cutoff_minute == 900"
            - "InfusionCenter.${ctr}.lab_validity_hours == 72"
            - "InfusionCenter.${ctr}.stagger_grid_minutes == 15"
            - "InfusionCenter.${ctr}.acuity_slot_minutes == 30"
            - "Chair.${ch1}.chair_type == 'STANDARD' and Chair.${ch1}.status == 'AVAILABLE'"
            - "Chair.${ch1}.reserved_for_urgent == false and Chair.${ch1}.committed_minutes == 0"
            - "InfusionCenter.${ctr}.available_chair_count == 1 and InfusionCenter.${ctr}.reserved_chair_count == 0"

      - name: drug_lot_unit_counters_are_computed_and_never_accepted_from_the_client
        claim_type: computed_fields
        grounds:
          - entities.DrugLot.fields.units_committed
          - entities.DrugLot.fields.units_available
          - entities.DrugLot.fields.status
          - endpoints[POST /drug-lots]
          - endpoints[POST /appointments/{id}/drug-preparations]
        distinguishing_aspect: |
          POST /drug-lots declares only units_received as input, yet the 201 body already
          carries five computed counters (0/0/0/0 and available 10); committing the whole
          lot to one preparation moves units_committed to 10, units_available to 0 and
          flips status to DEPLETED without any client-supplied counter.
        test_recipe:
          setup:
            - "One center, one chair, one nurse, the standing gate drug, a MID template, one patient, one ACTIVE plan and one booked appointment on 2026-08-10 at 540."
            - "One lot LOT-A of exactly 10 units expiring 2026-12-31."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-A", units_received: 10, expires_on: "2026-12-31T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id }
            - call: "POST /appointments/${ap1}/drug-preparations"
              payload: { units_requested: 10 }
              as: Pharmacist
              captures: { dp1: $.data.id, dp1_lot: $.data.drug_lot_id }
          assert:
            - "At creation DrugLot.${lot1}.units_committed == 0, units_administered == 0, units_wasted == 0, units_returned == 0"
            - "At creation DrugLot.${lot1}.units_available == 10 and status == 'AVAILABLE'"
            - "${dp1_lot} == ${lot1} — drug_lot_id is computed by the FEFO selector, not supplied"
            - "After the preparation DrugLot.${lot1}.units_committed == 10 and units_available == 0"
            - "After the preparation DrugLot.${lot1}.status == 'DEPLETED'"
            - "DrugPreparation.${dp1}.status == 'REQUESTED' and waste_cost_cents == 0 and prepared_at is null"

      - name: system_stamped_timestamps_and_version_come_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Chair
          - endpoints[POST /chairs]
          - endpoints[PATCH /chairs/{id}]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          id / created_at / updated_at / version are server-minted: created_at and
          updated_at both equal the logical clock at insert (2026-08-05T09:00:00Z) with
          version 1, and after the clock moves to 2026-08-05T10:30:00Z a PATCH leaves
          created_at untouched while updated_at becomes the new instant and version
          becomes 2.
        test_recipe:
          setup:
            - "One center; the clock is set to 2026-08-05T09:00:00Z before the chair is created and to 2026-08-05T10:30:00Z before the patch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id, ch1_created: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:30:00Z" }
              as: Scheduler
            - call: "PATCH /chairs/${ch1}"
              payload: { status: "OUT_OF_SERVICE" }
              as: Scheduler
          assert:
            - "${ch1} is a non-empty server-minted id and ${ch1_created} == '2026-08-05T09:00:00Z'"
            - "Immediately after creation Chair.${ch1}.updated_at == '2026-08-05T09:00:00Z' and version == 1"
            - "After the patch Chair.${ch1}.created_at == '2026-08-05T09:00:00Z' (unchanged)"
            - "After the patch Chair.${ch1}.updated_at == '2026-08-05T10:30:00Z' and version == 2"
            - "After the patch InfusionCenter.${ctr}.available_chair_count == 0"

      - name: chair_enum_and_nurse_shift_range_violations_return_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Chair.fields.status
          - entities.Nurse.fields.shift_start_minute
          - validations[priority 10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two different shapes of the same priority-10 rule: an enum member outside
          {AVAILABLE, OUT_OF_SERVICE} and a shift window whose start (900) is not less
          than its end (480) both return 400 ERR_INVALID_REQUEST, and neither row is
          created.
        test_recipe:
          setup:
            - "One center."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", status: "BROKEN" }
              as: Scheduler
              captures: { err_enum: $.data.error_id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 900, shift_end_minute: 480 }
              as: Scheduler
              captures: { err_range: $.data.error_id }
          assert:
            - "First call HTTP status == 400 and ${err_enum} == 'ERR_INVALID_REQUEST'"
            - "Second call HTTP status == 400 and ${err_range} == 'ERR_INVALID_REQUEST'"
            - "GET /chairs with center_id == ${ctr} returns an empty array"
            - "GET /nurses with center_id == ${ctr} returns an empty array"
            - "InfusionCenter.${ctr}.available_chair_count == 0"

      - name: lab_result_is_immutable_with_no_update_endpoint_and_no_version_field
        claim_type: immutability
        grounds:
          - entities.LabResult
          - endpoints[POST /lab-results]
          - endpoints[GET /lab-results/{id}]
        distinguishing_aspect: |
          LabResult is the scaffold's only common_fields == false entity: §1.5 declares
          no PATCH and no DELETE on /lab-results, the response carries no version and no
          updated_at, and a corrected value must be filed as a second, later draw that
          leaves the first row byte-identical.
        test_recipe:
          setup:
            - "One patient. The clock stays at 2026-08-01T00:00:00Z."
            - "A first draw is filed with anc_value 1.2 and platelet_value 90 (both present, so it is RESULTED)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /lab-results"
              payload: { patient_id: "${pt1}", collected_at: "2026-07-30T08:00:00Z", anc_value: 1.2, platelet_value: 90 }
              as: InfusionNurse
              captures: { lr1: $.data.id }
          trigger:
            - call: "POST /lab-results"
              payload: { patient_id: "${pt1}", collected_at: "2026-07-31T08:00:00Z", anc_value: 2.0, platelet_value: 150 }
              as: Pharmacist
              captures: { lr2: $.data.id }
          assert:
            - "HTTP status == 201 and ${lr2} != ${lr1}"
            - "LabResult.${lr1}.anc_value == 1.2 and platelet_value == 90 and status == 'RESULTED' — untouched by the correction"
            - "LabResult.${lr2}.anc_value == 2.0 and platelet_value == 150 and status == 'RESULTED'"
            - "Neither LabResult response body carries a 'version' key or an 'updated_at' key (entities.LabResult.common_fields == false)"
            - "GET /lab-results filtered by patient_id == ${pt1} returns exactly 2 rows"
            - "§1.5 declares no PATCH and no DELETE on /lab-results/{id}, so ${lr1} can never be rewritten"

      - name: self_referential_reference_drug_id_is_discoverable_through_the_drug_filter
        claim_type: listing
        grounds:
          - entities.Drug.fields.reference_drug_id
          - endpoints[GET /drugs]
          - complexity_profile.relationship_patterns
        distinguishing_aspect: |
          Drug.reference_drug_id points at another Drug row, and the flat topology
          exposes that self-reference only through the list filter: filtering by
          reference_drug_id returns exactly the biosimilar child, filtering
          is_biosimilar == false returns exactly the originator.
        test_recipe:
          setup:
            - "One originator drug at 90000 cents per unit and one biosimilar at 60000 cents whose reference_drug_id points at the originator."
          setup_api_calls:
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-bsm", is_biosimilar: true, reference_drug_id: "${dr1}", base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 60000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr2: $.data.id }
          trigger:
            - call: "GET /drugs"
              payload: { reference_drug_id: "${dr1}" }
              as: Pharmacist
              captures: { fam_first: "$.data[0].id" }
            - call: "GET /drugs"
              payload: { is_biosimilar: false }
              as: Pharmacist
              captures: { orig_first: "$.data[0].id" }
          assert:
            - "First response contains exactly 1 row and ${fam_first} == ${dr2}"
            - "That row reports is_biosimilar == true and reference_drug_id == ${dr1}"
            - "Second response contains exactly 1 row and ${orig_first} == ${dr1}"
            - "Drug.${dr1}.reference_drug_id is null — the originator points at nothing"

      - name: foreign_keys_in_the_request_body_are_validated_in_the_declared_input_order
        claim_type: parent_relationships
        grounds:
          - validations[priority 21]
          - errors[ERR_CENTER_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - endpoints[POST /chairs]
          - endpoints[POST /treatment-plans]
        distinguishing_aspect: |
          In a flat topology the owning row is a body FK, not a path segment: an unknown
          center_id on POST /chairs is 404 ERR_CENTER_NOT_FOUND, and when BOTH patient_id
          and drug_id are unknown on POST /treatment-plans the answer is
          ERR_PATIENT_NOT_FOUND because priority 21 walks the endpoint's declared input
          order (patient_id before drug_id).
        test_recipe:
          setup:
            - "Empty database except one real drug, so the second call's unknown patient_id is the first unresolvable FK in input order."
          setup_api_calls:
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
          trigger:
            - call: "POST /chairs"
              payload: { center_id: "00000000-0000-0000-0000-0000000000ff", label: "A1" }
              as: Scheduler
              captures: { err_center: $.data.error_id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ee", drug_id: "00000000-0000-0000-0000-0000000000dd", dose_mg_per_kg: 10, total_cycles: 6 }
              as: Scheduler
              captures: { err_plan: $.data.error_id }
          assert:
            - "First call HTTP status == 404 and ${err_center} == 'ERR_CENTER_NOT_FOUND'"
            - "Second call HTTP status == 404 and ${err_plan} == 'ERR_PATIENT_NOT_FOUND' (not ERR_DRUG_NOT_FOUND)"
            - "GET /treatment-plans returns an empty array"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: authorization_submit_moves_draft_to_submitted_and_counts_the_submission
        claim_type: valid_transition
        grounds:
          - state_machines[AuthorizationRequest].transitions[DRAFT -> SUBMITTED]
          - endpoints[POST /authorization-requests/{id}/submit]
          - entities.AuthorizationRequest.fields.submission_count
        distinguishing_aspect: |
          The declared happy-path leg of the authorization machine: status flips
          DRAFT -> SUBMITTED, submission_count becomes 1 (it is 0 in DRAFT), decided_at
          and expires_at stay null, version becomes 2, and the appointment's
          readiness_status is untouched because only an APPROVED decision clears the
          authorization gate.
        test_recipe:
          setup:
            - "Standing fixture: center, chair A1, nurse (capacity 6), gate drug, MID template, patient, ACTIVE plan, one appointment on 2026-08-10 at 540."
            - "One authorization request created in DRAFT against that appointment."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
