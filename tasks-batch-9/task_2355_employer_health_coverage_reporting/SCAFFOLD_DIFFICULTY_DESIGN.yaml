          assert:
            - "the trigger response status is 409 and ${err_id} == ERR_TRANSMITTAL_NOT_BUILT"
            - "${err_id} != ERR_ELECTRONIC_FILING_REQUIRED even though required_channel == ELECTRONIC and channel == PAPER"
            - "Transmittal.${t1_id}.status == TRANSMITTED"
            - "Transmittal.${t1_id}.required_channel == ELECTRONIC"
            - "Transmittal.${t1_id}.aggregate_return_count == 2"
            - "Transmittal.${t1_id}.channel == ELECTRONIC and transmitted_by_user_id == agent-1"

      - name: segregation_of_duties_beats_notice_window_rejected
        grounds:
          - validations[priority=23]
          - validations[priority=36]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_NOTICE_RESPONSE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal) — a different pair from the
          (state, business_constraint) conflict above: submit-response by the same user who
          filed the last evidence, at a clock past response_due_date, violates priority 23
          and priority 36 together and returns ERR_SEGREGATION_OF_DUTIES with 403.
        test_recipe:
          setup:
            - "FilingSeason 2026 OPEN; ControlledGroup DETERMINED_ALE with a single ACTIVE member whose REPORTING_YEAR headcounts give reporting_year_ft_months 492."
            - "PenaltyNotice with asserted_a_months [1], asserted_b_employee_months [], notice_date 2027-05-01 and response_due_date 2027-06-30."
            - "co-1 filed MEC_OFFER_PROOF evidence for month 1 and ran the recompute at the default 2026-08-01 clock, so status is RECOMPUTED with recalculated_amount_cents 0 and unallocated_amount_cents 0 and last_evidence_user_id co-1."
            - "The clock has then been moved to 2027-07-15, after response_due_date."
          setup_api_calls:
            - call: "POST /ale-reporting/filing-seasons"
              payload: { tax_year: 2026, furnishing_deadline_date: "2027-03-02", filing_deadline_date: "2027-03-31", tier2_cutoff_date: "2027-08-01" }
              as: ComplianceOfficer
