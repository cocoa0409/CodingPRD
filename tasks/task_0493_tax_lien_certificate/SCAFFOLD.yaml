# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting user violates segregation of duties (treasurer awarding own bid / treasurer placing a bid)" }
  - { id: ERR_NOT_CERTIFICATE_HOLDER, http: 403, condition: "Acting investor is not the certificate's current holder" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum/type, missing OCC field" }
  - { id: ERR_INVALID_BID, http: 422, condition: "Bid rate not <= opening rate or not a multiple of the bid-down increment; premium negative" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_CROSS_COUNTY_REFERENCE, http: 409, condition: "Body FK references a resource in the wrong county scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_SALE_NOT_DUE, http: 409, condition: "Opening a sale before scheduled_at" }
  - { id: ERR_SALE_EMPTY, http: 409, condition: "Opening a sale with zero listings" }
  - { id: ERR_REDEMPTION_PERIOD_OPEN, http: 409, condition: "Deed application before redeem_deadline_at" }
  - { id: ERR_DEED_ALREADY_AWARDED, http: 409, condition: "Operation requires a FILED deed application but it is AWARDED" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 409, condition: "Deed sale hammer price below minimum_bid_cents" }
  - { id: ERR_DUPLICATE_SUB_TAX, http: 409, condition: "A sub-tax for this tax_year already exists on the certificate, or assignment to==from" }
  - { id: ERR_INSUFFICIENT_ESCROW, http: 402, condition: "Investor escrow cannot cover a bid hold or outlay" }
  - { id: ERR_VALIDATION, http: 422, condition: "Semantic field constraint violated (out-of-range value, non-multiple increment)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CountyTreasurer
    description: "Operates the county tax-sale process: configures counties/parcels, runs sales (open/close/settle/withdraw), issues certificates via the close cascade, processes redemptions, awards/cancels deeds, and records surplus claims. The clock endpoint is treasurer-operated."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /counties — create county"
      - "POST /counties/{id}/parcels — register parcel"
      - "POST /counties/{id}/sales — create sale"
      - "POST /counties/{id}/sales/{id}/listings — attach listing"
      - "POST /counties/{id}/sales/{id}/open|close|settle — run sale"
      - "POST /counties/{id}/sales/{id}/listings/{id}/withdraw — withdraw listing"
      - "POST /counties/{id}/certificates/{id}/redeem — process redemption"
      - "POST /counties/{id}/deed-applications/{id}/award|cancel — adjudicate deed"
      - "POST /counties/{id}/deed-applications/{id}/surplus/{id}/claim — record surplus claim"
    shared_operations:
      - "POST /investors, POST /investors/{id}/deposits — register/fund investors (also Investor)"
      - "All GET reads"

  - name: Investor
    description: "A registered bidder/holder. Places bids, holds certificates, pays subsequent taxes, records assignments (as the assignor), and applies for tax deeds. May register and fund their own escrow account. Bound to an Investor entity via X-User-ID."
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /counties/{id}/sales/{id}/listings/{id}/bids — place bid"
      - "POST /counties/{id}/certificates/{id}/sub-taxes — pay subsequent tax"
      - "POST /counties/{id}/certificates/{id}/assignments — record assignment"
      - "POST /counties/{id}/certificates/{id}/deed-applications — apply for deed"
    shared_operations:
      - "POST /investors, POST /investors/{id}/deposits — register/fund own account (also CountyTreasurer)"
      - "All GET reads"

  - name: Auditor
    description: "Read-only oversight role. Cannot mutate any resource; may read every entity for audit."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET reads"
