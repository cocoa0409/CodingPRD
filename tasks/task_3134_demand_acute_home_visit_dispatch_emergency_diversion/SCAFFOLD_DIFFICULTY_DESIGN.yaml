              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-I", tech_user_id: "tech-I", supervising_physician_user_id: "md-I", skill_tags: ["POCT", "IV_INFUSION"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
