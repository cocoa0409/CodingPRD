# §1.8 Scaffold Difficulty Design — task 2313 Government Cloud Authorization Program
# 9 Difficulty Rules x >=2 differentiated instances; every numeric assert is a
# literal computed from the §1.3 formulas and their constants.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: preliminary_impact_level_outranks_final_when_a_high_category_stays_unconfirmed
    grounds:
    - calculations.impact_level_determination
    - entities.CloudServiceOffering.fields.preliminary_impact_level
    - entities.CloudServiceOffering.fields.final_impact_level
    - state_machines.CloudServiceOffering.DRAFT_to_CATEGORIZED
    distinguishing_aspect: Variant `preliminary` counts DECLARED categories while variant `final` counts only CONFIRMED ones,
      so one unconfirmed HIGH category leaves preliminary_impact_level == HIGH and final_impact_level == MODERATE on the same
      row, and the selected baseline is the MODERATE baseline even though a HIGH baseline exists.
    test_recipe:
      setup:
      - Logical clock at 2026-02-01T00:00:00Z.
      - Both a HIGH and a MODERATE ControlBaseline exist, effective_from 2026-01-01T00:00:00Z, retired false.
      - Offering in DRAFT with external_dependency_impact_level LOW (default).
      - DataCategory PII (MODERATE/MODERATE/LOW) is CONFIRMED; DataCategory FIN (HIGH/LOW/LOW) is left DECLARED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: HIGH
          version_label: Rev5-HIGH
          effective_from: '2026-01-01T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 4
            priority_rank: 1
          - family_code: SC
            required_control_count: 2
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_high_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: &id001
          - family_code: AC
            required_control_count: 2
            priority_rank: 1
          - family_code: SC
            required_control_count: 1
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: FIN
          confidentiality_impact: HIGH
          integrity_impact: LOW
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_fin_id: $.data.id
      trigger:
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      assert:
      - HTTP 200; CloudServiceOffering.${offering_id}.status == CATEGORIZED
      - CloudServiceOffering.${offering_id}.preliminary_impact_level == HIGH
      - CloudServiceOffering.${offering_id}.final_impact_level == MODERATE
      - CloudServiceOffering.${offering_id}.baseline_id == ${baseline_mod_id}
      - CloudServiceOffering.${offering_id}.baseline_id != ${baseline_high_id}
      - DataCategory.${dc_fin_id}.status == DECLARED (the FIN row is untouched by the determination)
  - name: final_impact_level_escalates_by_external_dependency_that_preliminary_ignores
    grounds:
    - calculations.impact_level_determination
    - entities.CloudServiceOffering.fields.external_dependency_impact_level
    - entities.ControlBaseline.fields.total_required_controls
    - state_machines.CloudServiceOffering.DRAFT_to_CATEGORIZED
    distinguishing_aspect: 'With a single CONFIRMED MODERATE category and external_dependency_impact_level HIGH the two variants
      diverge in the opposite direction from the unconfirmed-category instance: preliminary_impact_level == MODERATE (external
      dependency ignored) while final_impact_level == HIGH (external dependency raises the high-water mark), selecting the
      HIGH baseline with total_required_controls 6.'
    test_recipe:
      setup:
      - Logical clock at 2026-02-01T00:00:00Z.
      - HIGH baseline families [{AC,4,1},{SC,2,2}] and MODERATE baseline families [{AC,2,1},{SC,1,2}] both effective 2026-01-01T00:00:00Z.
      - Offering in DRAFT created with external_dependency_impact_level HIGH.
      - DataCategory PII (MODERATE/MODERATE/LOW) CONFIRMED; no other category exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: HIGH
          version_label: Rev5-HIGH
          effective_from: '2026-01-01T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 4
            priority_rank: 1
          - family_code: SC
            required_control_count: 2
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_high_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
          external_dependency_impact_level: HIGH
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      trigger:
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      assert:
      - HTTP 200; CloudServiceOffering.${offering_id}.status == CATEGORIZED
      - CloudServiceOffering.${offering_id}.preliminary_impact_level == MODERATE
      - CloudServiceOffering.${offering_id}.final_impact_level == HIGH
      - CloudServiceOffering.${offering_id}.baseline_id == ${baseline_high_id}
      - ControlBaseline.${baseline_high_id}.total_required_controls == 6
      - ControlBaseline.${baseline_mod_id}.total_required_controls == 3
  - name: residual_risk_at_submission_ignores_the_extension_that_the_monitoring_variant_honours
    grounds:
    - calculations.residual_risk_score
    - calculations.poam_remediation_deadline
    - entities.AuthorizationPackage.fields.residual_risk_score_at_submission
    - entities.Authorization.fields.residual_risk_score
    - state_machines.PoamItem.risk_disposition_DEVIATION_REQUESTED_to_EXTENSION_GRANTED
    distinguishing_aspect: 'One MODERATE finding with an approved 60-day operational-requirement extension is scored at the
      same instant by both variants: at_submission uses anchor_at + 90 days (2026-05-02T00:00:00Z) and applies OVERDUE_MULTIPLIER
      1.5 for 6.00, while at_monitoring_review uses deadline_at 2026-07-01T00:00:00Z and scores 4.00 — a 2.00 delta produced
      by the extension alone, not by any data change.'
    test_recipe:
      setup:
      - Logical clock starts at 2026-02-01T00:00:00Z; DOT agency, MODERATE baseline, offering (budget 400000.00) AGENCY_SPONSORED,
        coverage 100.00.
      - 'PoamItem: severity MODERATE, source SELF_IDENTIFIED, detected_at 2026-02-01T00:00:00Z -> anchor_at 2026-02-01T00:00:00Z,
        deadline_at 2026-05-02T00:00:00Z.'
      - A DeviationRequest of kind OPERATIONAL_REQUIREMENT for 60 days is routed to BOARD and APPROVED, so granted_extension_days
        == 60 and deadline_at moves to 2026-07-01T00:00:00Z.
      - Engagement 200 h / 120000.00 reaches REPORT_DELIVERED with no findings; package created in DRAFT.
      - Clock advanced to 2026-06-01T00:00:00Z, which is after 2026-05-02T00:00:00Z but before 2026-07-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings/${offering_id}/path-selection
        payload:
          authorization_path: AGENCY_SPONSORED
          sponsor_agency_id: ${agency_dot_id}
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: AC-2
          family_code: AC
          implementation_status: IMPLEMENTED
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: AC-3
          family_code: AC
          implementation_status: IMPLEMENTED
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: SC-7
          family_code: SC
          implementation_status: IMPLEMENTED
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /poam-items
        payload:
          offering_id: ${offering_id}
          control_id: AC-2
          severity: MODERATE
          detected_at: '2026-02-01T00:00:00Z'
          source: SELF_IDENTIFIED
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          poam_a_id: $.data.id
      - call: POST /deviation-requests
        payload:
          poam_item_id: ${poam_a_id}
          kind: OPERATIONAL_REQUIREMENT
          justification: Vendor patch is not available before the deadline.
          requested_extension_days: 60
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dev_id: $.data.id
      - call: POST /deviation-requests/${dev_id}/route
        payload:
          review_queue: BOARD
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /deviation-requests/${dev_id}/decision
        payload:
          decision: APPROVE
        as: ProgramBoardReviewer
        as_user_id: board-2
      - call: POST /assessment-engagements
        payload:
          offering_id: ${offering_id}
          assessor_org_name: Delta Assessors LLC
          assessor_user_id: 3pao-1
          contracted_hours: 200
          labor_cost_usd: 120000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          engagement_id: $.data.id
      - call: POST /assessment-engagements/${engagement_id}/plan
        payload:
          planned_test_start: '2026-03-01T00:00:00Z'
          planned_test_end: '2026-03-31T00:00:00Z'
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
      - call: POST /assessment-engagements/${engagement_id}/plan-approval
        payload:
          decision: APPROVE
        as: AgencyAuthorizingOfficial
        as_user_id: ${agency_dot_id}
      - call: POST /test-slots
        payload:
          engagement_id: ${engagement_id}
          family_code: AC
          start_at: '2026-03-02T09:00:00Z'
          end_at: '2026-03-02T17:00:00Z'
          hours: 8.0
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
        captures:
          slot_a_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-30T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /assessment-engagements/${engagement_id}/report
        payload:
          findings: []
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
      - call: GET /offerings/${offering_id}
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          off_v: $.data.version
      - call: POST /authorization-packages
        payload:
          offering_id: ${offering_id}
          engagement_id: ${engagement_id}
          expected_offering_version: ${off_v}
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          pkg_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      trigger:
      - call: POST /authorization-packages/${pkg_id}/submit
        payload: {}
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /authorization-packages/${pkg_id}/review
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /authorization-packages/${pkg_id}/decision
        payload:
          decision: AUTHORIZE
          risk_acceptance_note: Agency accepts the residual risk.
        as: AgencyAuthorizingOfficial
        as_user_id: ${agency_dot_id}
      - call: GET /authorizations
        payload:
          package_id: ${pkg_id}
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          auth_id: $.data[0].id
          auth_v: $.data[0].version
      - call: GET /authorizations/${auth_id}/risk-summary
        as: CspComplianceLead
        as_user_id: csp-lead-1
      assert:
      - PoamItem.${poam_a_id}.granted_extension_days == 60
      - PoamItem.${poam_a_id}.deadline_at == 2026-07-01T00:00:00Z
      - PoamItem.${poam_a_id}.risk_disposition == EXTENSION_GRANTED
      - AuthorizationPackage.${pkg_id}.submitted_at == 2026-06-01T00:00:00Z
      - AuthorizationPackage.${pkg_id}.residual_risk_score_at_submission == 6.00
      - AuthorizationPackage.${pkg_id}.open_findings_at_submission == 1
      - AuthorizationPackage.${pkg_id}.crm_coverage_pct == 100.00
      - Authorization.${auth_id}.residual_risk_score == 4.00
      - Authorization.${auth_id}.poam_risk_tier == LOW
      - GET /authorizations/${auth_id}/risk-summary -> residual_risk_score == 4.00 and stored_residual_risk_score == 4.00
        and open_findings_count == 1
      - AuthorizationPackage.${pkg_id}.residual_risk_score_at_submission - Authorization.${auth_id}.residual_risk_score ==
        2.00
- rule_id: combinatorial_formula
  instances:
  - name: crm_coverage_rounds_each_family_before_the_weighted_mean
    grounds:
    - calculations.crm_documentation_coverage
    - entities.ControlBaseline.fields.families
    - entities.ControlImplementation.fields.implementation_status
    - entities.ControlImplementation.fields.crm_documented
    distinguishing_aspect: 'Two rounding steps in a pinned order: family_pct is rounded to 2 dp first (AC 2/3 -> 66.67, SC
      1/6 -> 16.67) and only then is the required-control-weighted mean rounded, giving 33.34; the single-step alternative
      round((2+1)/(3+6)*100, 2) yields 33.33 and is wrong.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; MODERATE baseline families [{AC,3,1},{SC,6,2}], total_required_controls 9.
      - Offering CATEGORIZED with final_impact_level MODERATE and baseline_id bound to that baseline.
      - 'Six ControlImplementation rows: AC-2 IMPLEMENTED/crm true, AC-3 PARTIALLY_IMPLEMENTED/crm true, AC-6 PLANNED/crm
        false, SC-7 IMPLEMENTED/crm true, SC-8 IMPLEMENTED/crm false, SC-12 ALTERNATIVE_IMPLEMENTATION/crm true.'
      - Counting set is therefore AC = 2 of 3 and SC = 1 of 6.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: &id003
          - family_code: AC
            required_control_count: 3
            priority_rank: 1
          - family_code: SC
            required_control_count: 6
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      - &id004
        call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: AC-2
          family_code: AC
          implementation_status: IMPLEMENTED
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - &id005
        call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: AC-3
          family_code: AC
          implementation_status: PARTIALLY_IMPLEMENTED
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - &id006
        call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: AC-6
          family_code: AC
          implementation_status: PLANNED
          crm_documented: false
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - &id007
        call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: SC-7
          family_code: SC
          implementation_status: IMPLEMENTED
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - &id008
        call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: SC-8
          family_code: SC
          implementation_status: IMPLEMENTED
          crm_documented: false
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - &id009
        call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: SC-12
          family_code: SC
          implementation_status: ALTERNATIVE_IMPLEMENTATION
          crm_documented: true
          customer_responsibility_text: Customer must configure MFA for all privileged console users.
        as: CspComplianceLead
        as_user_id: csp-lead-1
      trigger:
      - call: GET /offerings/${offering_id}/crm-coverage
        as: CspComplianceLead
        as_user_id: csp-lead-1
      assert:
      - HTTP 200; response.data.overall_coverage_pct == 33.34
      - response.data.overall_coverage_pct != 33.33 (the single-rounding alternative is rejected)
      - response.data.weight_total == 9
      - response.data.family_breakdown has 2 entries ordered AC then SC by priority_rank
      - 'response.data.family_breakdown[0] == {family_code: AC, documented: 2, required_control_count: 3, family_pct: 66.67}'
      - 'response.data.family_breakdown[1] == {family_code: SC, documented: 1, required_control_count: 6, family_pct: 16.67}'
  - name: crm_coverage_excludes_zero_requirement_family_from_numerator_and_weight
    grounds:
    - calculations.crm_documentation_coverage
    - entities.ControlBaseline.fields.families
    - entities.ControlImplementation.fields.family_code
