              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { err_capacity: "$.data.error_id" }
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resC}", studio_id: "${studio}", start_date: "2026-12-01",
