scenario: |
  Generate task harder than expert level!

  2624. Used Furniture Consignment Gallery & White-Glove Pickup (Furniture Consignment Gallery): item acceptance screening from photographs with condition grading, consignment agreement with declining price schedule over time, pickup routing and stair/elevator surcharge quoting, floor placement, tagging and shrinkage reconciliation, split calculation with tier by category and sale price, unsold item disposition (donate, return, discount) election deadlines, buyer delivery scheduling and damage claim, consignor payout ledger and unclaimed-proceeds escheatment
domain_name: used-furniture-consignment-gallery
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  # Every business object is a top-level collection joined by explicit foreign
  # keys (no nesting in URL paths beyond read sub-resources). ConsignmentItem
  # additionally references itself (lot parent -> lot components).

  state_machine_shape: cyclic
  # ConsignmentItem carries TWO independent state dimensions (lifecycle_state x
  # inventory_state); both contain cycles (UNSOLD_PENDING_ELECTION -> MARKED_DOWN
  # -> UNSOLD_PENDING_ELECTION; IN_CUSTODY -> SHRINKAGE_MISSING -> IN_CUSTODY).
  # DamageClaim adds a negotiation cycle (SUBMITTED -> INFO_REQUESTED -> SUBMITTED).

  relationship_patterns:
    - one_to_many          # Consignor -> ConsignmentAgreement -> ConsignmentItem
    - self_referential     # ConsignmentItem.parent_lot_item_id -> ConsignmentItem.id
    - cross_aggregate      # Sale -> ConsignmentItem, DeliveryOrder -> Sale, PayoutLedgerEntry -> Consignor+ConsignmentItem
    - polymorphic          # PayoutLedgerEntry.entry_type discriminates nine ledger sources

  role_model: segregation_of_duties
  # The FloorOperator who counted a shrinkage audit may not be the GalleryManager
  # user id that approves its write-offs; the LogisticsCoordinator user id that
  # scheduled a DeliveryOrder may not be the user id that adjudicates its
  # DamageClaim.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Consignor
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: consignor legal or display name
      - name: email
        type: string
        source: input
        description: contact email, unique across consignors
        constraints: unique
      - name: address_line
        type: string
        source: input
        description: pickup street address
      - name: floor_number
        type: integer
        source: input
        description: floor of the pickup residence, 1 = ground floor
        constraints: ">= 1"
      - name: has_elevator
        type: boolean
        source: input
        description: consignor-declared elevator availability at the pickup address
      - name: payout_method
        type: enum
        source: input
        description: how disbursements are paid out
        default: ACH
        constraints: "one of {ACH, CHECK, STORE_CREDIT}"
      - name: status
        type: enum
        source: system
        description: standing of the consignor account
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: unclaimed_balance_cents
        type: integer
        source: computed
        description: "signed sum of PayoutLedgerEntry.amount_cents over all entries whose consignor_id equals this row's id (may be negative when surcharge debits exceed credits)"
        default: 0
      - name: lifetime_credits_cents
        type: integer
        source: computed
        description: "sum of PayoutLedgerEntry.amount_cents restricted to amount_cents > 0 for this consignor"
        default: 0
      - name: last_activity_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent consignor-facing ledger event; ESCHEATMENT_DEBIT entries deliberately do NOT refresh it"
      - name: escheat_state
        type: enum
        source: system
        description: unclaimed-proceeds dormancy posture
        default: NONE
        constraints: "one of {NONE, DORMANT, ESCHEATED}"

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: buyer name
      - name: email
        type: string
        source: input
        description: buyer contact email, unique across buyers
        constraints: unique
      - name: address_line
        type: string
        source: input
        description: delivery street address
      - name: floor_number
        type: integer
        source: input
        description: delivery floor, 1 = ground floor
        constraints: ">= 1"
      - name: has_elevator
        type: boolean
        source: input
        description: elevator availability at the delivery address
      - name: status
        type: enum
        source: system
        description: buyer standing
        default: ACTIVE
        constraints: "one of {ACTIVE, BLOCKED}"

  - name: PriceSchedule
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: schedule label referenced by agreements
      - name: unsold_trigger_day
        type: integer
        source: input
        description: days_on_floor at or beyond which an item is flagged UNSOLD_PENDING_ELECTION by the markdown run
        constraints: ">= 1"
      - name: election_window_days
        type: integer
        source: input
        description: days granted to the consignor to elect a disposition once flagged unsold
        constraints: ">= 1"
      - name: step_count
        type: integer
        source: computed
        description: "count of PriceScheduleStep rows whose schedule_id equals this row's id"
        default: 0
      - name: status
        type: enum
        source: system
        description: schedule availability
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: PriceScheduleStep
    parent: PriceSchedule
    common_fields: false
    fields:
      - name: schedule_id
        type: string
        source: input
        description: "FK -> PriceSchedule.id; the schedule this markdown step belongs to"
      - name: sequence
        type: integer
        source: input
        description: 1-based step ordinal; must equal PriceSchedule.step_count + 1 at creation
        constraints: ">= 1"
      - name: start_day_offset
        type: integer
        source: input
        description: "inclusive lower bound of the half-open day window [start_day_offset, next step's start_day_offset) this step governs"
        constraints: ">= 0"
      - name: markdown_pct
        type: number
        source: input
        description: fraction subtracted from list_price_cents while this step is in force
        constraints: "0.00 <= markdown_pct <= 0.90"
      - name: min_price_cents
        type: integer
        source: input
        description: absolute cents floor that clamps the marked-down price while this step is in force
        constraints: ">= 0"

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: consignor_id
        type: string
        source: input
        description: "FK -> Consignor.id; the consignor bound by this agreement"
      - name: price_schedule_id
        type: string
        source: input
        description: "FK -> PriceSchedule.id; declining price schedule pinned for every item under this agreement"
      - name: term_days
        type: integer
        source: input
        description: consignment term length in days, measured from effective_at
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: agreement lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, EXPIRED, TERMINATED}"
      - name: effective_at
        type: datetime
        source: system
        description: logical-clock instant at which the agreement was activated
      - name: expires_at
        type: datetime
        source: computed
        description: "effective_at + term_days * 86400 seconds; null while DRAFT"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the GalleryManager that activated the agreement
      - name: item_count
        type: integer
        source: computed
        description: "count of ConsignmentItem rows whose agreement_id equals this row's id"
        default: 0

  - name: ConsignmentItem
    parent: null
    common_fields: true
    fields:
      - name: consignor_id
        type: string
        source: computed
        description: "FK -> Consignor.id; copied from the agreement at intake, never taken from the request body"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ConsignmentAgreement.id; the agreement this item is consigned under"
      - name: parent_lot_item_id
        type: string
        source: input
        description: "FK -> ConsignmentItem.id; set on a lot COMPONENT and points at the lot PARENT item; null for standalone items and for lot parents themselves"
        default: null
      - name: pickup_job_id
        type: string
        source: system
        description: "FK -> PickupJob.id; assigned when the item is attached to a pickup job, cleared when that job is cancelled"
        default: null
      - name: placement_zone_id
        type: string
        source: system
        description: "FK -> FloorZone.id; zone the item currently occupies, null whenever the item is not physically on a sales floor"
        default: null
      - name: title
        type: string
        source: input
        description: short human label for the piece
      - name: category
        type: enum
        source: input
        description: merchandise category driving category factor and split base
        constraints: "one of {SOFA, DINING, CASEGOOD, RUG, ART, OUTDOOR}"
      - name: declared_value_cents
        type: integer
        source: input
        description: consignor's declared replacement value, the multiplicand of every list-price computation
        constraints: ">= 1000"
      - name: photo_count
        type: integer
        source: input
        description: number of intake photographs supplied by the consignor
        constraints: ">= 0"
      - name: volume_cuft
        type: integer
        source: input
        description: cubic feet consumed on the truck
        constraints: ">= 1"
      - name: footprint_sqft
        type: integer
        source: input
        description: square feet consumed in a FloorZone while placed
        constraints: ">= 1"
      - name: photo_surface_score
        type: number
        source: input
        description: appraiser's 0-10 score for surface condition, supplied at screening
        default: null
        constraints: "0 <= value <= 10"
      - name: photo_structure_score
        type: number
        source: input
        description: appraiser's 0-10 score for structural soundness, supplied at screening
        default: null
        constraints: "0 <= value <= 10"
      - name: photo_completeness_score
        type: number
        source: input
        description: appraiser's 0-10 score for completeness of parts, supplied at screening
        default: null
        constraints: "0 <= value <= 10"
      - name: photo_score
        type: number
        source: computed
        description: weighted photo screening score, output of calculations.photo_screening_score
        default: null
      - name: provisional_condition_grade
        type: enum
        source: computed
        description: grade derived from photo_score at screening
        default: null
        constraints: "one of {A, B, C, D, REJECTED}"
      - name: provisional_list_price_cents
        type: integer
        source: computed
        description: list price computed from provisional_condition_grade at screening, retained for divergence comparison
        default: null
      - name: condition_grade
        type: enum
        source: computed
        description: effective grade; equals provisional_condition_grade until receiving inspection overwrites it, and for a lot parent equals the lowest grade among its components
        default: null
        constraints: "one of {A, B, C, D, REJECTED}"
      - name: list_price_cents
        type: integer
        source: computed
        description: effective ticket price before markdown, output of calculations.item_list_price (or calculations.lot_bundle_list_price for a lot parent)
        default: null
      - name: current_price_cents
        type: integer
        source: computed
        description: price after the declining schedule and any discount elections, output of calculations.markdown_price
        default: null
      - name: markdown_sequence
        type: integer
        source: computed
        description: sequence of the PriceScheduleStep currently in force for this item
        default: 0
      - name: lifecycle_state
        type: enum
        source: system
        description: merchandising dimension of the item state machine
        default: INTAKE_SUBMITTED
        constraints: "one of {INTAKE_SUBMITTED, SCREEN_ACCEPTED, SCREEN_REJECTED, SCHEDULED_PICKUP, RECEIVED, RECEIVING_DISPUTE, AWAITING_PLACEMENT, ON_FLOOR, MARKED_DOWN, UNSOLD_PENDING_ELECTION, RETURN_SCHEDULED, DONATION_SCHEDULED, SOLD, SETTLED, RETURNED, DONATED, WRITTEN_OFF}"
      - name: inventory_state
        type: enum
        source: system
        description: custody dimension of the item state machine, evolving independently of lifecycle_state
        default: PENDING_CUSTODY
        constraints: "one of {PENDING_CUSTODY, IN_CUSTODY, SHRINKAGE_MISSING, WRITTEN_OFF_INV, RELEASED}"
      - name: tag_code
        type: string
        source: input
        description: floor tag printed at placement, unique across all items whose inventory_state is not WRITTEN_OFF_INV
        default: null
        constraints: unique among non-written-off items
      - name: listed_at
        type: datetime
        source: system
        description: logical-clock instant of the first successful placement; the origin of days_on_floor
        default: null
      - name: days_on_floor
        type: integer
        source: computed
        description: "floor((current logical clock - listed_at) / 86400); 0 when listed_at is null"
        default: 0
      - name: election_round
        type: integer
        source: computed
        description: number of DISCOUNT elections the consignor has taken on this item
        default: 0
      - name: election_deadline_at
        type: datetime
        source: system
        description: logical-clock instant at or after which a pending disposition election is refused
        default: null
      - name: disposition_election
        type: enum
        source: system
        description: most recent disposition election recorded for this item
        default: NONE
        constraints: "one of {NONE, DONATE, RETURN, DISCOUNT}"
      - name: unsold_trigger_day_effective
        type: integer
        source: computed
        description: "PriceSchedule.unsold_trigger_day + 30 * election_round; the day threshold the markdown run compares days_on_floor against"
        default: 0
      - name: clearance_relocation_pending
        type: boolean
        source: computed
        description: true when a clearance relocation was owed but no eligible CLEARANCE zone had room
        default: false
      - name: lot_component_count
        type: integer
        source: computed
        description: "count of ConsignmentItem rows whose parent_lot_item_id equals this row's id"
        default: 0
      - name: lot_ready
        type: boolean
        source: computed
        description: "true when lot_component_count == 0, or when every component row has inventory_state == IN_CUSTODY"
        default: true
      - name: screened_by_user_id
        type: string
        source: system
        description: X-User-ID of the IntakeAppraiser that screened the item
        default: null
      - name: received_by_user_id
        type: string
        source: system
        description: X-User-ID of the FloorOperator that performed the receiving inspection
        default: null

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: truck call sign
      - name: capacity_volume_cuft
        type: integer
        source: input
        description: maximum summed volume_cuft of items on one pickup job
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: truck availability
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE}"

  - name: WhiteGloveCrew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: delivery crew label
      - name: max_concurrent_jobs
        type: integer
        source: input
        description: how many non-terminal DeliveryOrder windows may intersect at once
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: crew availability
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OFF_DUTY}"

  - name: FloorZone
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: zone label
      - name: zone_type
        type: enum
        source: input
        description: merchandising role of the zone
        constraints: "one of {SHOWROOM_FRONT, SHOWROOM_REAR, WAREHOUSE, CLEARANCE}"
      - name: capacity_sqft
        type: integer
        source: input
        description: usable square feet in the zone
        constraints: ">= 1"
      - name: occupied_sqft
        type: integer
        source: computed
        description: "sum of footprint_sqft over ConsignmentItem rows whose placement_zone_id equals this row's id AND inventory_state IN {IN_CUSTODY, SHRINKAGE_MISSING}"
        default: 0
      - name: utilization_state
        type: enum
        source: computed
        description: "NORMAL when occupied_sqft / capacity_sqft < 0.75; TIGHT when >= 0.75 and < 1.00; FULL when >= 1.00"
        default: NORMAL
        constraints: "one of {NORMAL, TIGHT, FULL}"
      - name: status
        type: enum
        source: system
        description: whether the zone accepts placements
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

  - name: PickupJob
    parent: null
    common_fields: true
    fields:
      - name: consignor_id
        type: string
        source: input
        description: "FK -> Consignor.id; whose residence is being emptied"
      - name: truck_id
        type: string
        source: input
        description: "FK -> Truck.id; truck reserved for the window"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the reserved truck window
      - name: window_end
        type: datetime
        source: input
        description: inclusive end of the reserved truck window
      - name: crew_size
        type: integer
        source: input
        description: movers quoted for the job, drives the crew multiplier
        constraints: "2 <= crew_size <= 6"
      - name: item_count
        type: integer
        source: computed
        description: "count of ConsignmentItem rows whose pickup_job_id equals this row's id"
        default: 0
      - name: total_volume_cuft
        type: integer
        source: computed
        description: "sum of volume_cuft over ConsignmentItem rows whose pickup_job_id equals this row's id"
        default: 0
      - name: declared_stair_flights
        type: integer
        source: computed
        description: "max(Consignor.floor_number - 1, 0) at creation time, or 0 when Consignor.has_elevator is true"
      - name: declared_elevator
        type: boolean
        source: computed
        description: copy of Consignor.has_elevator at creation time
      - name: quoted_surcharge_cents
        type: integer
        source: computed
        description: forward-looking surcharge from calculations.pickup_surcharge variant quoted
      - name: actual_stair_flights
        type: integer
        source: input
        description: flights actually carried, supplied at completion
        default: null
        constraints: ">= 0"
      - name: actual_elevator_used
        type: boolean
        source: input
        description: whether an elevator was actually used, supplied at completion
        default: null
      - name: actual_crew_size
        type: integer
        source: input
        description: movers actually deployed, supplied at completion
        default: null
        constraints: "2 <= actual_crew_size <= 6"
      - name: final_surcharge_cents
        type: integer
        source: computed
        description: settled surcharge from calculations.pickup_surcharge variant final
        default: null
      - name: surcharge_variance_cents
        type: integer
        source: computed
        description: "final_surcharge_cents - quoted_surcharge_cents; null until completion"
        default: null
      - name: status
        type: enum
        source: system
        description: pickup job state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, FAILED, CANCELLED}"
      - name: scheduled_by_user_id
        type: string
        source: system
        description: X-User-ID of the LogisticsCoordinator that created the job

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> ConsignmentItem.id; the piece sold"
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Buyer.id; purchaser of record"
      - name: sale_price_cents
        type: integer
        source: input
        description: negotiated gross ticket actually charged to the buyer
        constraints: ">= 1"
      - name: markdown_sequence_at_sale
        type: integer
        source: computed
        description: copy of ConsignmentItem.markdown_sequence at the instant of sale, an input to the split tier
      - name: split_pct_applied
        type: number
        source: computed
        description: consignor split fraction from calculations.consignor_split
      - name: consignor_share_cents
        type: integer
        source: computed
        description: cents credited to the consignor ledger for this sale
      - name: gallery_share_cents
        type: integer
        source: computed
        description: "sale_price_cents - consignor_share_cents, the gallery's residual"
      - name: refund_cents
        type: integer
        source: computed
        description: cumulative buyer refunds booked against this sale by damage adjudication
        default: 0
      - name: status
        type: enum
        source: system
        description: sale state
        default: COMPLETED
        constraints: "one of {COMPLETED, SETTLED, REVERSED}"
      - name: sold_at
        type: datetime
        source: system
        description: logical-clock instant of the sale
      - name: reversed_at
        type: datetime
        source: system
        description: logical-clock instant of reversal
        default: null
      - name: sold_by_user_id
        type: string
        source: system
        description: X-User-ID of the FloorOperator that rang the sale

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id; the sale being delivered"
      - name: crew_id
        type: string
        source: input
        description: "FK -> WhiteGloveCrew.id; crew reserved for the window"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the half-open delivery window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the half-open delivery window
      - name: stair_flights
        type: integer
        source: computed
        description: "max(Buyer.floor_number - 1, 0) at creation, or 0 when Buyer.has_elevator is true"
      - name: elevator_used
        type: boolean
        source: computed
        description: copy of Buyer.has_elevator at creation
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: buyer-paid white-glove fee, output of calculations.delivery_fee
      - name: status
        type: enum
        source: system
        description: delivery order state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DELIVERED, REFUSED, CANCELLED}"
      - name: outcome_recorded_at
        type: datetime
        source: system
        description: logical-clock instant at which DELIVERED or REFUSED was recorded
        default: null
      - name: claim_window_ends_at
        type: datetime
        source: computed
        description: "outcome_recorded_at + 5 * 86400 seconds when status is DELIVERED, else null"
        default: null
      - name: scheduled_by_user_id
        type: string
        source: system
        description: X-User-ID of the LogisticsCoordinator that created the order; barred from adjudicating this order's damage claims

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: delivery_order_id
        type: string
        source: input
        description: "FK -> DeliveryOrder.id; the delivery the damage is attributed to"
      - name: claim_amount_cents
        type: integer
        source: input
        description: cents the buyer asks to be made whole for
        constraints: ">= 1"
      - name: description
        type: string
        source: input
        description: buyer's narrative of the damage
      - name: status
        type: enum
        source: system
        description: claim state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, WITHDRAWN}"
      - name: resubmission_count
        type: integer
        source: computed
        description: number of times the buyer has re-submitted after an information request
        default: 0
      - name: fault_party
        type: enum
        source: input
        description: adjudicated fault attribution, supplied at adjudication
        default: null
        constraints: "one of {GALLERY, CONSIGNOR, BUYER, UNDETERMINED}"
      - name: adjudicated_amount_cents
        type: integer
        source: computed
        description: capped payable amount, output of calculations.damage_allocation
        default: null
      - name: gallery_absorbed_cents
        type: integer
        source: computed
        description: portion of adjudicated_amount_cents borne by the gallery
        default: null
      - name: consignor_debited_cents
        type: integer
        source: computed
        description: portion of adjudicated_amount_cents charged back to the consignor ledger
        default: null
      - name: info_request_note
        type: string
        source: input
        description: manager's note when more information is requested
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the GalleryManager that adjudicated the claim
        default: null

  - name: ShrinkageAudit
    parent: null
    common_fields: true
    fields:
      - name: floor_zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id; the zone being counted"
      - name: counted_item_ids
        type: array
        source: input
        description: item ids physically found in the zone during the count
      - name: expected_item_count
        type: integer
        source: computed
        description: "count of ConsignmentItem rows whose placement_zone_id equals floor_zone_id AND inventory_state IN {IN_CUSTODY, SHRINKAGE_MISSING}"
      - name: counted_item_count
        type: integer
        source: computed
        description: number of distinct counted_item_ids that belong to the expected set
      - name: variance_count
        type: integer
        source: computed
        description: "expected_item_count - counted_item_count"
      - name: missing_item_ids
        type: array
        source: computed
        description: expected item ids absent from counted_item_ids, ordered by ConsignmentItem.created_at ASC
      - name: write_off_total_cents
        type: integer
        source: computed
        description: total shrinkage credit owed to consignors for the missing items, output of calculations.shrinkage_write_off
        default: 0
      - name: status
        type: enum
        source: system
        description: audit state
        default: COUNTED
        constraints: "one of {COUNTED, RECONCILED, ABANDONED}"
      - name: counted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FloorOperator that submitted the count; barred from approving this audit's write-offs
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the GalleryManager that approved the write-offs
        default: null

  - name: PayoutLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: consignor_id
        type: string
        source: system
        description: "FK -> Consignor.id; ledger owner"
      - name: item_id
        type: string
        source: system
        description: "FK -> ConsignmentItem.id; item the entry is attributable to, null for account-level entries"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: which mechanism minted the entry
        constraints: "one of {SALE_CREDIT, SALE_REVERSAL_DEBIT, SHRINKAGE_CREDIT, SHRINKAGE_RECOVERY_DEBIT, PICKUP_SURCHARGE_DEBIT, DAMAGE_ALLOCATION_DEBIT, DISPOSAL_FEE_DEBIT, PAYOUT_DISBURSEMENT_DEBIT, ESCHEATMENT_DEBIT}"
      - name: amount_cents
        type: integer
        source: computed
        description: signed cents; credits to the consignor are positive, debits negative
      - name: withholding_cents
        type: integer
        source: computed
        description: tax withholding retained on a PAYOUT_DISBURSEMENT_DEBIT, null for every other entry_type
        default: null
      - name: processing_fee_cents
        type: integer
        source: computed
        description: payout-method processing fee on a PAYOUT_DISBURSEMENT_DEBIT, null for every other entry_type
        default: null
      - name: net_payout_cents
        type: integer
        source: computed
        description: cents actually remitted on a PAYOUT_DISBURSEMENT_DEBIT, null for every other entry_type
        default: null
      - name: balance_after_cents
        type: integer
        source: computed
        description: Consignor.unclaimed_balance_cents immediately after this entry was applied
      - name: memo
        type: string
        source: system
        description: human-readable provenance string
      - name: effective_at
        type: datetime
        source: system
        description: logical-clock instant the entry was applied

state_machines:
  - entity: ConsignmentItem
    dimension: lifecycle_state
    initial_state: INTAKE_SUBMITTED
    terminal_states: [SCREEN_REJECTED, SETTLED, RETURNED, DONATED]
    note: |
      Merchandising dimension. Evolves independently of the inventory_state
      dimension declared in the next block: the same row can sit in
      lifecycle_state MARKED_DOWN while its inventory_state is SHRINKAGE_MISSING.
      WRITTEN_OFF is NOT terminal here - a recovered item re-enters
      AWAITING_PLACEMENT.
    transitions:
      - from: INTAKE_SUBMITTED
        to: SCREEN_ACCEPTED
        trigger: "POST /consignment-items/{id}/screen with decision ACCEPT"
        actor: IntakeAppraiser
        preconditions:
          - "lifecycle_state == INTAKE_SUBMITTED"
          - "photo_count >= 3"
          - "calculations.photo_screening_score output grade != REJECTED"
        side_effects:
          - "photo_score, provisional_condition_grade, provisional_list_price_cents set from calculations.photo_screening_score and calculations.item_list_price"
          - "condition_grade := provisional_condition_grade; list_price_cents := provisional_list_price_cents"
          - "screened_by_user_id := X-User-ID"
      - from: INTAKE_SUBMITTED
        to: SCREEN_REJECTED
        trigger: "POST /consignment-items/{id}/screen with decision REJECT, or with decision ACCEPT rejected earlier by validation"
        actor: IntakeAppraiser
        preconditions:
          - "lifecycle_state == INTAKE_SUBMITTED"
        side_effects:
          - "photo_score and provisional_condition_grade recorded; provisional_list_price_cents stays null"
          - "inventory_state stays PENDING_CUSTODY forever; the piece is never picked up"
          - "screened_by_user_id := X-User-ID"
      - from: SCREEN_ACCEPTED
        to: SCHEDULED_PICKUP
        trigger: "POST /pickup-jobs listing this item in item_ids, or POST /pickup-jobs/{id}/items attaching it to an already-scheduled job"
        actor: LogisticsCoordinator
        preconditions:
          - "lifecycle_state == SCREEN_ACCEPTED"
          - "pickup_job_id == null"
        side_effects:
          - "pickup_job_id := the new PickupJob.id"
          - "PickupJob.total_volume_cuft and PickupJob.item_count recomputed, then PickupJob.quoted_surcharge_cents computed"
      - from: SCHEDULED_PICKUP
        to: SCREEN_ACCEPTED
        trigger: "POST /pickup-jobs/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "owning PickupJob.status == SCHEDULED"
        side_effects:
          - "pickup_job_id := null so the item can be re-scheduled onto another truck"
          - "the truck window held by the cancelled job stops blocking overlap checks"
          - "no PICKUP_SURCHARGE_DEBIT is ever minted for a cancelled job"
      - from: SCHEDULED_PICKUP
        to: RECEIVED
        trigger: "POST /pickup-jobs/{id}/complete"
        actor: LogisticsCoordinator
        preconditions:
          - "owning PickupJob.status == SCHEDULED"
        side_effects:
          - "inventory_state := IN_CUSTODY on the same row (custody dimension advances)"
          - "cascade link 1: PickupJob.final_surcharge_cents and surcharge_variance_cents computed from calculations.pickup_surcharge variant final"
          - "cascade link 2: because the job reached COMPLETED with a settled surcharge, one PICKUP_SURCHARGE_DEBIT PayoutLedgerEntry of -final_surcharge_cents is minted for PickupJob.consignor_id with item_id null"
          - "cascade link 3: because that entry exists, Consignor.unclaimed_balance_cents is recomputed and Consignor.last_activity_at := clock"
          - "cascade link 4: because the recomputed balance is below -50000, Consignor.status := SUSPENDED"
      - from: RECEIVED
        to: AWAITING_PLACEMENT
        trigger: "POST /consignment-items/{id}/receive when the receiving grade is at most one grade below provisional_condition_grade"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == RECEIVED"
          - "inventory_state == IN_CUSTODY"
        side_effects:
          - "condition_grade := received_grade; list_price_cents recomputed by calculations.item_list_price"
          - "received_by_user_id := X-User-ID"
          - "if parent_lot_item_id is not null, the parent's list_price_cents is recomputed by calculations.lot_bundle_list_price"
        note: "grade distance is measured on the rank ladder A=4, B=3, C=2, D=1, REJECTED=0; distance = rank(provisional_condition_grade) - rank(received_grade). D -> REJECTED is therefore a ONE-grade downgrade and lands here, with condition_grade REJECTED and list_price_cents null"
      - from: RECEIVED
        to: RECEIVING_DISPUTE
        trigger: "POST /consignment-items/{id}/receive when the receiving grade is two or more grades below provisional_condition_grade"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == RECEIVED"
          - "inventory_state == IN_CUSTODY"
        side_effects:
          - "cascade link 1: condition_grade := received_grade and list_price_cents recomputed by calculations.item_list_price"
          - "cascade link 2: because this row's list_price_cents changed and parent_lot_item_id is not null, the parent item's list_price_cents is recomputed by calculations.lot_bundle_list_price"
          - "cascade link 3: because the parent's list_price_cents changed and the parent is ON_FLOOR or MARKED_DOWN, the parent's current_price_cents is recomputed by calculations.markdown_price"
          - "cascade link 4: because the parent's recomputed current_price_cents fell below 50000 while sitting in a non-CLEARANCE zone, calculations.clearance_relocation_selector moves the parent to the winning CLEARANCE zone (placement_zone_id updated)"
          - "cascade link 5: because the parent's placement_zone_id changed, occupied_sqft and utilization_state are recomputed on both the source and the destination FloorZone"
          - "election_deadline_at := clock + PriceSchedule.election_window_days * 86400 so the consignor must accept or recall the downgraded piece"
        note: "same rank ladder A=4, B=3, C=2, D=1, REJECTED=0; B -> D and A -> C are two-grade downgrades and land here"
      - from: RECEIVING_DISPUTE
        to: AWAITING_PLACEMENT
        trigger: "POST /consignment-items/{id}/elect-disposition with election DISCOUNT"
        actor: Consignor
        preconditions:
          - "lifecycle_state == RECEIVING_DISPUTE"
          - "clock < election_deadline_at"
        side_effects:
          - "disposition_election := DISCOUNT; election_deadline_at := null"
          - "list_price_cents kept at the downgraded value; election_round unchanged"
      - from: RECEIVING_DISPUTE
        to: RETURN_SCHEDULED
        trigger: "POST /consignment-items/{id}/elect-disposition with election RETURN"
        actor: Consignor
        preconditions:
          - "lifecycle_state == RECEIVING_DISPUTE"
          - "clock < election_deadline_at"
        side_effects:
          - "disposition_election := RETURN; election_deadline_at := null"
      - from: AWAITING_PLACEMENT
        to: ON_FLOOR
        trigger: "POST /consignment-items/{id}/place"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == AWAITING_PLACEMENT"
          - "inventory_state == IN_CUSTODY"
          - "owning ConsignmentAgreement.status == ACTIVE and clock < ConsignmentAgreement.expires_at"
          - "lot_ready == true"
          - "target FloorZone.status == OPEN and occupied_sqft + footprint_sqft <= capacity_sqft"
          - "tag_code unused by any item whose inventory_state != WRITTEN_OFF_INV"
        side_effects:
          - "placement_zone_id := target zone; tag_code := supplied tag"
          - "listed_at := clock on the FIRST placement only; markdown_sequence := 1; current_price_cents := list_price_cents"
          - "target FloorZone.occupied_sqft and utilization_state recomputed"
      - from: ON_FLOOR
        to: MARKED_DOWN
        trigger: "POST /_ops/markdown-run when the governing PriceScheduleStep sequence exceeds markdown_sequence"
        actor: system
        preconditions:
          - "lifecycle_state == ON_FLOOR"
          - "governing step sequence >= 2"
        side_effects:
          - "markdown_sequence := governing step sequence; current_price_cents recomputed by calculations.markdown_price"
          - "if current_price_cents < 50000 and the zone's zone_type != CLEARANCE, calculations.clearance_relocation_selector relocates the item and both zones' occupied_sqft and utilization_state are recomputed"
      - from: MARKED_DOWN
        to: MARKED_DOWN
        trigger: "POST /_ops/markdown-run when a later PriceScheduleStep takes force"
        actor: system
        preconditions:
          - "lifecycle_state == MARKED_DOWN"
          - "governing step sequence > markdown_sequence"
        side_effects:
          - "markdown_sequence and current_price_cents advance one or more steps in a single run"
          - "clearance relocation re-evaluated exactly as on the ON_FLOOR to MARKED_DOWN edge"
      - from: MARKED_DOWN
        to: UNSOLD_PENDING_ELECTION
        trigger: "POST /_ops/markdown-run when days_on_floor >= unsold_trigger_day_effective"
        actor: system
        preconditions:
          - "lifecycle_state IN {ON_FLOOR, MARKED_DOWN}"
          - "days_on_floor >= unsold_trigger_day_effective"
        side_effects:
          - "election_deadline_at := clock + PriceSchedule.election_window_days * 86400"
          - "item keeps its placement_zone_id and keeps occupying floor space"
      - from: UNSOLD_PENDING_ELECTION
        to: MARKED_DOWN
        trigger: "POST /consignment-items/{id}/elect-disposition with election DISCOUNT"
        actor: Consignor
        preconditions:
          - "lifecycle_state == UNSOLD_PENDING_ELECTION"
          - "clock < election_deadline_at"
          - "election_round < 2"
        side_effects:
          - "election_round := election_round + 1, which lifts unsold_trigger_day_effective by 30 days"
          - "current_price_cents := max(round_half_up(current_price_cents * 0.80), governing step min_price_cents)"
          - "election_deadline_at := null; disposition_election := DISCOUNT"
          - "clearance relocation re-evaluated against the new current_price_cents"
      - from: UNSOLD_PENDING_ELECTION
        to: DONATION_SCHEDULED
        trigger: "POST /consignment-items/{id}/elect-disposition with election DONATE"
        actor: Consignor
        preconditions:
          - "lifecycle_state == UNSOLD_PENDING_ELECTION"
          - "clock < election_deadline_at"
          - "category IN {SOFA, DINING, CASEGOOD, RUG, OUTDOOR}"
        side_effects:
          - "disposition_election := DONATE; election_deadline_at := null"
      - from: UNSOLD_PENDING_ELECTION
        to: RETURN_SCHEDULED
        trigger: "POST /consignment-items/{id}/elect-disposition with election RETURN"
        actor: Consignor
        preconditions:
          - "lifecycle_state == UNSOLD_PENDING_ELECTION"
          - "clock < election_deadline_at"
        side_effects:
          - "disposition_election := RETURN; election_deadline_at := null"
      - from: UNSOLD_PENDING_ELECTION
        to: DONATION_SCHEDULED
        trigger: "POST /_ops/markdown-run when election_deadline_at <= clock and no election was recorded"
        actor: system
        preconditions:
          - "lifecycle_state == UNSOLD_PENDING_ELECTION"
          - "election_deadline_at <= clock"
        side_effects:
          - "disposition_election := DONATE by default; election_deadline_at := null"
          - "memo on the eventual DISPOSAL_FEE_DEBIT records that the election lapsed"
        note: "automatic transition - the only path that elects on the consignor's behalf"
      - from: ON_FLOOR
        to: SOLD
        trigger: "POST /sales"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state IN {ON_FLOOR, MARKED_DOWN}"
          - "inventory_state == IN_CUSTODY"
          - "sale_price_cents >= round_half_up(current_price_cents * 0.90)"
        side_effects:
          - "placement released: placement_zone_id := null, and the zone's occupied_sqft and utilization_state are recomputed"
          - "cascade link 1: Sale row created with split_pct_applied, consignor_share_cents and gallery_share_cents from calculations.consignor_split"
          - "cascade link 2: because the sale exists, one SALE_CREDIT PayoutLedgerEntry of +consignor_share_cents is minted"
          - "cascade link 3: because that entry exists, Consignor.unclaimed_balance_cents is recomputed and last_activity_at := clock"
          - "cascade link 4: because the recomputed balance is >= 0 while Consignor.status == SUSPENDED, Consignor.status := ACTIVE; and because last_activity_at moved, escheat_state := NONE"
      - from: MARKED_DOWN
        to: SOLD
        trigger: "POST /sales"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == MARKED_DOWN"
          - "inventory_state == IN_CUSTODY"
          - "sale_price_cents >= round_half_up(current_price_cents * 0.90)"
        side_effects:
          - "identical to the ON_FLOOR to SOLD edge, except markdown_sequence_at_sale is >= 2 which can trigger the tenure penalty inside calculations.consignor_split"
      - from: SOLD
        to: MARKED_DOWN
        trigger: "POST /sales/{id}/reverse, or POST /delivery-orders/{id}/complete with outcome REFUSED"
        actor: GalleryManager
        preconditions:
          - "Sale.status == COMPLETED"
          - "inventory_state == IN_CUSTODY"
        side_effects:
          - "cascade link 1: Sale.status := REVERSED, reversed_at := clock"
          - "cascade link 2: because the sale was reversed, one SALE_REVERSAL_DEBIT PayoutLedgerEntry of -consignor_share_cents is minted, so the two entries for this item sum to exactly 0"
          - "cascade link 3: because that entry exists, Consignor.unclaimed_balance_cents is recomputed back to its pre-sale value"
          - "item re-placed in its former zone at markdown_sequence and current_price_cents unchanged; that zone's occupied_sqft and utilization_state are recomputed"
          - "any SCHEDULED DeliveryOrder on the sale is set to CANCELLED"
        note: "the item returns to ON_FLOOR when markdown_sequence == 1 and to MARKED_DOWN when markdown_sequence >= 2; the target state always mirrors the step in force"
      - from: SOLD
        to: SETTLED
        trigger: "POST /delivery-orders/{id}/complete with outcome DELIVERED"
        actor: LogisticsCoordinator
        preconditions:
          - "lifecycle_state == SOLD"
          - "DeliveryOrder.status == SCHEDULED"
        side_effects:
          - "inventory_state := RELEASED"
          - "Sale.status := SETTLED"
          - "DeliveryOrder.claim_window_ends_at := clock + 5 * 86400"
      - from: RETURN_SCHEDULED
        to: RETURNED
        trigger: "POST /consignment-items/{id}/release"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == RETURN_SCHEDULED"
        side_effects:
          - "inventory_state := RELEASED; placement_zone_id := null and the former zone is recomputed"
          - "one DISPOSAL_FEE_DEBIT PayoutLedgerEntry of -4000 (return handling) is minted, then Consignor.unclaimed_balance_cents is recomputed"
      - from: DONATION_SCHEDULED
        to: DONATED
        trigger: "POST /consignment-items/{id}/release"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == DONATION_SCHEDULED"
        side_effects:
          - "inventory_state := RELEASED; placement_zone_id := null and the former zone is recomputed"
          - "one DISPOSAL_FEE_DEBIT PayoutLedgerEntry of -2500 (donation handling) is minted, then Consignor.unclaimed_balance_cents is recomputed"
      - from: ON_FLOOR
        to: WRITTEN_OFF
        trigger: "POST /consignment-items/{id}/write-off, or POST /shrinkage-audits/{id}/approve-write-off"
        actor: GalleryManager
        preconditions:
          - "lifecycle_state IN {AWAITING_PLACEMENT, ON_FLOOR, MARKED_DOWN, UNSOLD_PENDING_ELECTION}"
          - "inventory_state == SHRINKAGE_MISSING"
          - "expected_item_version matches ConsignmentItem.version"
        side_effects:
          - "inventory_state := WRITTEN_OFF_INV; placement_zone_id := null; the former zone's occupied_sqft and utilization_state are recomputed"
          - "one SHRINKAGE_CREDIT PayoutLedgerEntry of +round_half_up(current_price_cents * 0.60) is minted, then Consignor.unclaimed_balance_cents is recomputed and last_activity_at := clock"
          - "version increments by 1"
      - from: WRITTEN_OFF
        to: AWAITING_PLACEMENT
        trigger: "POST /consignment-items/{id}/inventory-flag with flag RECOVERED"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state == WRITTEN_OFF"
          - "inventory_state == WRITTEN_OFF_INV"
        side_effects:
          - "inventory_state := IN_CUSTODY; tag_code := null so the piece must be re-tagged at re-placement"
          - "one SHRINKAGE_RECOVERY_DEBIT PayoutLedgerEntry equal to the negation of the item's SHRINKAGE_CREDIT is minted, then Consignor.unclaimed_balance_cents is recomputed"

  - entity: ConsignmentItem
    dimension: inventory_state
    initial_state: PENDING_CUSTODY
    terminal_states: [RELEASED]
    note: |
      Custody dimension of the same row, advanced by different endpoints than the
      lifecycle dimension. IN_CUSTODY -> SHRINKAGE_MISSING -> IN_CUSTODY is a true
      cycle that can repeat while lifecycle_state never moves.
    transitions:
      - from: PENDING_CUSTODY
        to: IN_CUSTODY
        trigger: "POST /pickup-jobs/{id}/complete"
        actor: LogisticsCoordinator
        preconditions:
          - "inventory_state == PENDING_CUSTODY"
          - "lifecycle_state == SCHEDULED_PICKUP"
        side_effects:
          - "the item becomes eligible for receiving inspection and counts toward lot_ready on its parent"
      - from: IN_CUSTODY
        to: SHRINKAGE_MISSING
        trigger: "POST /consignment-items/{id}/inventory-flag with flag MISSING, or POST /shrinkage-audits when the item is in the expected set but absent from counted_item_ids"
        actor: FloorOperator
        preconditions:
          - "inventory_state == IN_CUSTODY"
          - "lifecycle_state NOT IN {SOLD, SETTLED, RETURNED, DONATED, SCREEN_REJECTED}"
        side_effects:
          - "lifecycle_state is deliberately left untouched, so a MARKED_DOWN item keeps being marked down while missing"
          - "the item still counts toward FloorZone.occupied_sqft until it is written off"
      - from: SHRINKAGE_MISSING
        to: IN_CUSTODY
        trigger: "POST /consignment-items/{id}/inventory-flag with flag RECOVERED"
        actor: FloorOperator
        preconditions:
          - "inventory_state == SHRINKAGE_MISSING"
        side_effects:
          - "no ledger entry is minted because no SHRINKAGE_CREDIT was ever booked for a merely mislaid item"
          - "placement_zone_id is unchanged, so FloorZone.occupied_sqft does not move"
      - from: SHRINKAGE_MISSING
        to: WRITTEN_OFF_INV
        trigger: "POST /consignment-items/{id}/write-off, or POST /shrinkage-audits/{id}/approve-write-off"
        actor: GalleryManager
        preconditions:
          - "inventory_state == SHRINKAGE_MISSING"
        side_effects:
          - "see the lifecycle ON_FLOOR to WRITTEN_OFF edge: placement released, SHRINKAGE_CREDIT minted, balance recomputed"
      - from: WRITTEN_OFF_INV
        to: IN_CUSTODY
        trigger: "POST /consignment-items/{id}/inventory-flag with flag RECOVERED"
        actor: FloorOperator
        preconditions:
          - "inventory_state == WRITTEN_OFF_INV"
        side_effects:
          - "SHRINKAGE_RECOVERY_DEBIT minted to unwind the credit; lifecycle_state := AWAITING_PLACEMENT so the piece must be re-placed and re-tagged"
      - from: IN_CUSTODY
        to: RELEASED
        trigger: "POST /consignment-items/{id}/release, or POST /delivery-orders/{id}/complete with outcome DELIVERED"
        actor: FloorOperator
        preconditions:
          - "lifecycle_state IN {RETURN_SCHEDULED, DONATION_SCHEDULED, SOLD}"
        side_effects:
          - "placement_zone_id := null; the former zone's occupied_sqft and utilization_state are recomputed"
          - "the item stops counting toward any ShrinkageAudit expected set"

  - entity: ConsignmentAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /consignment-agreements/{id}/activate"
        actor: GalleryManager
        preconditions:
          - "status == DRAFT"
          - "Consignor.status == ACTIVE"
          - "referenced PriceSchedule.status == ACTIVE and PriceSchedule.step_count >= 1"
        side_effects:
          - "effective_at := clock; expires_at := effective_at + term_days * 86400"
          - "approved_by_user_id := X-User-ID"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_ops/markdown-run when expires_at <= clock"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "expires_at <= clock"
        side_effects:
          - "no new item may be created under it and no item under it may be placed"
          - "items already ON_FLOOR keep being marked down; the agreement only gates intake and placement"
        note: "automatic transition driven by the ops run epoch"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /_ops/escheatment-run when the owning Consignor reaches escheat_state ESCHEATED"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "Consignor.escheat_state transitions to ESCHEATED in this run"
        side_effects:
          - "the agreement is closed out; intake and placement under it are refused thereafter"
        note: "automatic transition; cascade from the consignor dormancy sweep"

  - entity: PickupJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pickup-jobs/{id}/complete"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED"
          - "item_count >= 1"
        side_effects:
          - "final_surcharge_cents and surcharge_variance_cents computed; every attached item advances SCHEDULED_PICKUP -> RECEIVED and PENDING_CUSTODY -> IN_CUSTODY"
          - "PICKUP_SURCHARGE_DEBIT minted, consignor balance recomputed, suspension threshold re-evaluated"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /pickup-jobs/{id}/complete with actual_crew_size below the quoted crew_size minus 1"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "no items advance; no ledger entry is minted; the truck window is released"
        note: "divergent branch of the same trigger - the fork's two outcomes have disjoint side-effect sets"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pickup-jobs/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "every attached item reverts SCHEDULED_PICKUP -> SCREEN_ACCEPTED and pickup_job_id := null"
          - "the truck window stops participating in overlap checks; quoted_surcharge_cents is retained for audit but never billed"

  - entity: Sale
    initial_state: COMPLETED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /delivery-orders/{id}/complete with outcome DELIVERED"
        actor: LogisticsCoordinator
        preconditions:
          - "status == COMPLETED"
          - "DeliveryOrder.status == SCHEDULED"
        side_effects:
          - "item lifecycle_state := SETTLED and inventory_state := RELEASED"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /sales/{id}/reverse, or POST /delivery-orders/{id}/complete with outcome REFUSED"
        actor: GalleryManager
        preconditions:
          - "status == COMPLETED"
        side_effects:
          - "SALE_REVERSAL_DEBIT minted for exactly -consignor_share_cents; the item returns to the floor"

  - entity: DeliveryOrder
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, REFUSED, CANCELLED]
    note: "fork-join on one trigger - POST /delivery-orders/{id}/complete branches on outcome with disjoint side-effect sets"
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/complete with outcome DELIVERED"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED"
          - "Sale.status == COMPLETED"
          - "item inventory_state == IN_CUSTODY"
        side_effects:
          - "outcome_recorded_at := clock; claim_window_ends_at := clock + 5 * 86400"
          - "Sale.status := SETTLED; item lifecycle_state := SETTLED; item inventory_state := RELEASED"
      - from: SCHEDULED
        to: REFUSED
        trigger: "POST /delivery-orders/{id}/complete with outcome REFUSED"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED"
          - "Sale.status == COMPLETED"
        side_effects:
          - "outcome_recorded_at := clock; claim_window_ends_at stays null so no damage claim may be filed"
          - "Sale.status := REVERSED and a SALE_REVERSAL_DEBIT is minted; the item goes back on the floor in its former zone"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sales/{id}/reverse on the parent sale"
        actor: GalleryManager
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "the crew window is released and stops participating in concurrency checks"
        note: "automatic transition; cascade from sale reversal"

  - entity: DamageClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    note: "negotiation cycle - SUBMITTED -> INFO_REQUESTED -> SUBMITTED may repeat at most twice"
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /damage-claims/{id}/request-info"
        actor: GalleryManager
        preconditions:
          - "status == SUBMITTED"
          - "resubmission_count < 2"
        side_effects:
          - "info_request_note recorded; the claim clock is not extended"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /damage-claims/{id}/resubmit"
        actor: Buyer
        preconditions:
          - "status == INFO_REQUESTED"
          - "resubmission_count < 2"
        side_effects:
          - "resubmission_count := resubmission_count + 1; description replaced by the resubmitted narrative"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /damage-claims/{id}/adjudicate with approve true"
        actor: GalleryManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != DeliveryOrder.scheduled_by_user_id"
          - "claim_amount_cents <= Sale.sale_price_cents"
        side_effects:
          - "adjudicated_amount_cents, gallery_absorbed_cents and consignor_debited_cents computed by calculations.damage_allocation"
          - "Sale.refund_cents := Sale.refund_cents + adjudicated_amount_cents"
          - "when consignor_debited_cents > 0 a DAMAGE_ALLOCATION_DEBIT PayoutLedgerEntry of -consignor_debited_cents is minted, then Consignor.unclaimed_balance_cents is recomputed and, if it falls below -50000, Consignor.status := SUSPENDED"
          - "adjudicated_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /damage-claims/{id}/adjudicate with approve false"
        actor: GalleryManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != DeliveryOrder.scheduled_by_user_id"
        side_effects:
          - "adjudicated_amount_cents := 0; gallery_absorbed_cents := 0; consignor_debited_cents := 0; no ledger entry is minted"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /damage-claims/{id}/resubmit with withdraw true"
        actor: Buyer
        preconditions:
          - "status == INFO_REQUESTED"
        side_effects:
          - "no ledger effect; the delivery order's claim window is unaffected"

  - entity: ShrinkageAudit
    initial_state: COUNTED
    terminal_states: [RECONCILED, ABANDONED]
    transitions:
      - from: COUNTED
        to: RECONCILED
        trigger: "POST /shrinkage-audits (auto, when variance_count == 0) or POST /shrinkage-audits/{id}/approve-write-off"
        actor: GalleryManager
        preconditions:
          - "status == COUNTED"
          - "X-User-ID != counted_by_user_id when reached via approve-write-off"
        side_effects:
          - "each missing item is written off in missing_item_ids order (ConsignmentItem.created_at ASC): inventory_state := WRITTEN_OFF_INV, lifecycle_state := WRITTEN_OFF, placement released, SHRINKAGE_CREDIT minted"
          - "write_off_total_cents finalised; the zone's occupied_sqft and utilization_state are recomputed once after the batch"
          - "approved_by_user_id := X-User-ID; when variance_count == 0 the audit is RECONCILED at creation with write_off_total_cents 0 and approved_by_user_id stays null"
      - from: COUNTED
        to: ABANDONED
        trigger: "POST /shrinkage-audits on the same zone superseding an unreconciled audit"
        actor: FloorOperator
        preconditions:
          - "status == COUNTED"
        side_effects:
          - "the superseded audit books nothing; its missing_item_ids keep their SHRINKAGE_MISSING inventory_state"
        note: "automatic transition; a zone has at most one non-terminal audit"

  - entity: Consignor
    dimension: escheat_state
    initial_state: NONE
    terminal_states: [ESCHEATED]
    note: "dormancy dimension; NONE -> DORMANT -> NONE is a cycle driven by renewed ledger activity"
    transitions:
      - from: NONE
        to: DORMANT
        trigger: "POST /_ops/escheatment-run when dormancy_days >= 365 and unclaimed_balance_cents > 0"
        actor: system
        preconditions:
          - "escheat_state == NONE"
          - "unclaimed_balance_cents > 0"
          - "dormancy_days >= 365"
        side_effects:
          - "no ledger entry; balance untouched; a payout request is still accepted while DORMANT"
      - from: DORMANT
        to: NONE
        trigger: "any PayoutLedgerEntry minted for the consignor other than ESCHEATMENT_DEBIT"
        actor: system
        preconditions:
          - "escheat_state == DORMANT"
        side_effects:
          - "last_activity_at := clock, which restarts the dormancy count from zero"
      - from: DORMANT
        to: ESCHEATED
        trigger: "POST /_ops/escheatment-run when dormancy_days >= 545 and unclaimed_balance_cents > 0"
        actor: system
        preconditions:
          - "escheat_state IN {NONE, DORMANT}"
          - "unclaimed_balance_cents > 0"
          - "dormancy_days >= 545"
        side_effects:
          - "one ESCHEATMENT_DEBIT PayoutLedgerEntry of -unclaimed_balance_cents is minted, driving the balance to exactly 0"
          - "last_activity_at is deliberately NOT refreshed by this entry"
          - "every ACTIVE ConsignmentAgreement of the consignor transitions to TERMINATED"
          - "further payout requests are refused with ERR_CONSIGNOR_ESCHEATED"

concurrency_rules:
  - rule_id: payout-stale-consignor
    parent_entity: Consignor
    write_endpoint: "POST /consignors/{id}/payouts"
    occ_field: "expected_consignor_version"
    description: |
      A disbursement is computed against the balance the client last read. When
      Consignor.version has advanced since that read - because another writer
      booked a sale credit, a surcharge debit or a damage chargeback that
      legitimately supersedes the earlier balance - the request is rejected as
      stale rather than paying out a superseded figure.
    error_id: ERR_STALE_CONSIGNOR_VERSION
    http_status: 412
  - rule_id: write-off-stale-item
    parent_entity: ConsignmentItem
    write_endpoint: "POST /consignment-items/{id}/write-off"
    occ_field: "expected_item_version"
    description: |
      The shrinkage credit is a function of the item's current_price_cents at
      approval time. When ConsignmentItem.version has advanced since the
      manager's read - because a markdown run stepped the price down or a
      recovery cleared the missing flag - the write-off is rejected as stale
      instead of crediting a superseded price.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

calculations:
  - name: photo_screening_score
    trigger: "POST /consignment-items/{id}/screen (provisional variant) and POST /consignment-items/{id}/receive (final variant)"
    algorithm: weighted_scoring
    formula: |
      raw = 0.45 * surface_score + 0.30 * structure_score + 0.25 * completeness_score
      photo_score = round_half_up(raw, 2)

      grade(photo_score):
        photo_score <  3.00 -> REJECTED
        photo_score >= 8.50 -> A
        photo_score >= 6.50 -> B
        photo_score >= 4.50 -> C
        else                -> D
      # the ladder is evaluated top to bottom; every comparison is inclusive (>=)
      # so a score landing exactly on a boundary takes the HIGHER grade.
    input_set: "the three 0-10 appraiser sub-scores carried on the ConsignmentItem row being screened or received"
    constants:
      WEIGHT_SURFACE: 0.45
      WEIGHT_STRUCTURE: 0.30
      WEIGHT_COMPLETENESS: 0.25
      REJECT_BELOW: 3.00
      GRADE_A_MIN: 8.50
      GRADE_B_MIN: 6.50
      GRADE_C_MIN: 4.50
    precision: "photo_score carries 2 decimal places, round_half_up; the grade ladder is applied to the ROUNDED score, never to the raw weighted sum"
    variants:
      - name: provisional
        when: "POST /consignment-items/{id}/screen — grading from the consignor's photographs only"
        difference: "writes photo_score, provisional_condition_grade and provisional_list_price_cents; also seeds condition_grade and list_price_cents so the item can be quoted and scheduled before it is ever touched"
      - name: final
        when: "POST /consignment-items/{id}/receive — grading from physical inspection at intake"
        difference: "overwrites photo_score and condition_grade (and therefore list_price_cents) but LEAVES provisional_condition_grade and provisional_list_price_cents frozen at their screening values, so the divergence remains observable on the row"

  - name: item_list_price
    trigger: "POST /consignment-items/{id}/screen and POST /consignment-items/{id}/receive, for any item whose lot_component_count == 0"
    algorithm: tiered_pricing
    formula: |
      # TWO-STEP rounding, pinned: each factor is applied to an already-rounded
      # integer number of cents. Collapsing the two multiplications into one
      # expression is a DIFFERENT (wrong) answer for some inputs.
      step1_cents = round_half_up(declared_value_cents * GRADE_FACTOR[condition_grade])
      list_price_cents = round_half_up(step1_cents * CATEGORY_FACTOR[category])

      # condition_grade == REJECTED yields no price at all: list_price_cents
      # stays null and the item is refused at screening.
    input_set: "the single ConsignmentItem being priced; declared_value_cents, condition_grade and category are the only inputs"
    constants:
      GRADE_FACTOR: { A: 0.85, B: 0.70, C: 0.55, D: 0.40 }
      CATEGORY_FACTOR: { SOFA: 0.95, DINING: 1.05, CASEGOOD: 1.00, RUG: 1.10, ART: 1.20, OUTDOOR: 0.85 }
    precision: "integer cents at BOTH steps, round_half_up at each step independently"
    variants:
      - name: provisional
        when: "at screening, using provisional_condition_grade"
        difference: "result is stored in BOTH provisional_list_price_cents and list_price_cents"
      - name: final
        when: "at receiving inspection, using the re-graded condition_grade"
        difference: "result overwrites list_price_cents and current_price_cents only; provisional_list_price_cents is never rewritten, and any lot parent above this item is repriced by lot_bundle_list_price"

  - name: lot_bundle_list_price
    trigger: "POST /consignment-items/{id}/screen or /receive on the lot PARENT, and any /receive on a lot COMPONENT that changes that component's list_price_cents"
    algorithm: aggregation
    formula: |
      components = ConsignmentItem rows with parent_lot_item_id == parent.id
                   AND lifecycle_state != SCREEN_REJECTED
      # ordered by created_at ASC purely for deterministic replay; addition is
      # commutative so the order does not change the sum.
      component_sum = sum(c.list_price_cents for c in components)
      parent.condition_grade = worst grade among components, on the ladder A > B > C > D
      parent.list_price_cents = round_half_up(component_sum * BUNDLE_FACTOR)

      # threshold consequence, evaluated after every reprice of a lot parent
      # already sitting on a floor. calculations.markdown_price runs FIRST on the
      # repriced parent, so the comparison is made against the post-markdown
      # figure, never against the raw bundle price:
      run calculations.markdown_price on the parent
      if parent.current_price_cents < CLEARANCE_THRESHOLD_CENTS
         AND parent.lifecycle_state IN {ON_FLOOR, MARKED_DOWN}
         AND the parent's current zone is not of zone_type CLEARANCE:
          run calculations.clearance_relocation_selector on the parent
    input_set: "all non-rejected components of the lot parent; a parent with lot_component_count == 0 is priced by item_list_price instead"
    constants:
      BUNDLE_FACTOR: 0.90
      CLEARANCE_THRESHOLD_CENTS: 50000
    precision: "integer cents, round_half_up, applied once to the component sum (component prices are already rounded integers)"

  - name: markdown_price
    trigger: "POST /_ops/markdown-run, POST /consignment-items/{id}/place, and POST /consignment-items/{id}/elect-disposition with election DISCOUNT"
    algorithm: decay_function
    formula: |
      days_on_floor = floor((clock - listed_at) / 86400)          # 0 when listed_at is null
      steps = PriceScheduleStep rows of the item's agreement's schedule, ordered by sequence ASC
      step  = the LAST step whose start_day_offset <= days_on_floor
              (a schedule always has a sequence 1 step at start_day_offset 0)

      markdown_sequence   = step.sequence
      stepped_cents       = round_half_up(list_price_cents * (1 - step.markdown_pct))
      current_price_cents = max(stepped_cents, step.min_price_cents)

      # the floor is a hard floor: it can RAISE the stepped price, never lower it.
    input_set: "the item's own list_price_cents plus the ordered PriceScheduleStep rows of the schedule attached to its agreement"
    constants:
      DISCOUNT_ELECTION_EXTRA_PCT: 0.10
      SECONDS_PER_DAY: 86400
    precision: "integer cents, round_half_up; the floor comparison happens AFTER rounding"
    variants:
      - name: posted
        when: "no DISCOUNT election is in force (disposition_election != DISCOUNT)"
        difference: "current_price_cents is exactly max(stepped_cents, step.min_price_cents)"
      - name: discount_elected
        when: "disposition_election == DISCOUNT"
        difference: "an extra cut is layered on the SAME step before the floor is applied: stepped_cents = round_half_up(list_price_cents * (1 - step.markdown_pct) * (1 - 0.10)), then the floor is applied to that; identical data therefore yields a different current_price_cents than the posted variant"

  - name: pickup_surcharge
    trigger: "POST /pickup-jobs (quoted variant), POST /pickup-jobs/{id}/items (requote), POST /pickup-jobs/{id}/complete (final variant)"
    algorithm: tiered_pricing
    formula: |
      volume_fee = ceil(total_volume_cuft / 10) * VOLUME_BLOCK_CENTS

      access_fee(stair_flights, elevator):
          if elevator: return ELEVATOR_FLAT_CENTS
          fee = min(stair_flights, STAIR_FLIGHT_CAP) * STAIR_FLIGHT_CENTS
          if stair_flights > STAIR_FLIGHT_CAP: fee = fee + EXTREME_CLIMB_CENTS
          return fee

      bulky_fee = BULKY_ITEM_CENTS * count(items with category IN {SOFA, DINING}
                                           AND volume_cuft >= BULKY_VOLUME_CUFT)

      subtotal = BASE_CENTS + volume_fee + access_fee(...) + bulky_fee
      raw      = round_half_up(subtotal * CREW_MULTIPLIER[bucket(crew)])
      cap      = round_half_up(CAP_PCT * sum(item.declared_value_cents for attached items))
      surcharge_cents = min(raw, cap)

      bucket(crew): crew <= 2 -> "2"; crew == 3 -> "3"; crew >= 4 -> "4_PLUS"
    input_set: "every ConsignmentItem whose pickup_job_id equals the job id, plus the access figures for the variant in force"
    constants:
      BASE_CENTS: 12000
      VOLUME_BLOCK_CENTS: 2500
      VOLUME_BLOCK_CUFT: 10
      STAIR_FLIGHT_CENTS: 4500
      STAIR_FLIGHT_CAP: 6
      EXTREME_CLIMB_CENTS: 8000
      ELEVATOR_FLAT_CENTS: 3000
      BULKY_ITEM_CENTS: 5500
      BULKY_VOLUME_CUFT: 60
      CREW_MULTIPLIER: { "2": 1.00, "3": 1.25, "4_PLUS": 1.45 }
      CAP_PCT: 0.35
    precision: "integer cents; round_half_up after the crew multiplier and, independently, when computing the cap; the min() runs on the two rounded integers"
    variants:
      - name: quoted
        when: "at scheduling and after every item attach — a forward-looking estimate"
        difference: "uses declared_stair_flights and declared_elevator (copied from the Consignor's own address declaration) and the quoted crew_size; writes quoted_surcharge_cents; mints no ledger entry"
      - name: final
        when: "at POST /pickup-jobs/{id}/complete — settled from what the crew actually did"
        difference: "uses actual_stair_flights, actual_elevator_used and actual_crew_size; writes final_surcharge_cents and surcharge_variance_cents = final - quoted, and mints exactly one PICKUP_SURCHARGE_DEBIT of -final_surcharge_cents (never the variance, never the quote)"

  - name: consignor_split
    trigger: "POST /sales"
    algorithm: tiered_pricing
    formula: |
      pct = CATEGORY_BASE[item.category]
          + PRICE_BONUS(sale_price_cents)
          - (TENURE_PENALTY if item.markdown_sequence >= TENURE_PENALTY_SEQUENCE else 0)
      pct = min(max(pct, PCT_FLOOR), PCT_CEILING)      # clamp, both bounds real

      PRICE_BONUS(p): p <  50000 -> 0.00
                      p < 150000 -> 0.05
                      else       -> 0.10

      split_pct_applied     = pct
      consignor_share_cents = round_half_up(sale_price_cents * pct)
      gallery_share_cents   = sale_price_cents - consignor_share_cents
      # the gallery takes the REMAINDER, never its own rounded product, so the
      # two shares always re-add to sale_price_cents exactly.
    input_set: "the sold ConsignmentItem's category and markdown_sequence, and the Sale's sale_price_cents"
    constants:
      CATEGORY_BASE: { SOFA: 0.50, DINING: 0.55, CASEGOOD: 0.55, RUG: 0.60, ART: 0.65, OUTDOOR: 0.45 }
      PRICE_BONUS_LOW_CENTS: 50000
      PRICE_BONUS_HIGH_CENTS: 150000
      TENURE_PENALTY: 0.05
      TENURE_PENALTY_SEQUENCE: 3
      PCT_FLOOR: 0.40
      PCT_CEILING: 0.70
    precision: "split_pct_applied is exact to 2 decimal places; consignor_share_cents is integer cents round_half_up; gallery_share_cents is the exact remainder"

  - name: shrinkage_write_off
    trigger: "POST /consignment-items/{id}/write-off and POST /shrinkage-audits/{id}/approve-write-off"
    algorithm: aggregation
    formula: |
      per_item_credit(item) = round_half_up(item.current_price_cents * SHRINKAGE_CREDIT_PCT)

      # audit batch: processed in missing_item_ids order (ConsignmentItem.created_at ASC)
      write_off_total_cents = sum(per_item_credit(i) for i in missing_items)
      # one SHRINKAGE_CREDIT PayoutLedgerEntry per item, of +per_item_credit(item);
      # never one merged entry for the batch.
    input_set: "for the audit path, exactly the items in missing_item_ids; for the single-item path, the one item named in the path, which must be in inventory_state SHRINKAGE_MISSING"
    constants:
      SHRINKAGE_CREDIT_PCT: 0.60
    precision: "integer cents, round_half_up per item; the batch total is the sum of the already-rounded per-item credits, never a rounding of the summed prices"

  - name: payout_disbursement
    trigger: "POST /consignors/{id}/payouts"
    algorithm: waterfall_allocation
    formula: |
      available_cents = Consignor.unclaimed_balance_cents        # signed, as stored

      # tier selection is keyed on the PRE-withholding available balance and is
      # never recomputed against any later figure in the waterfall.
      withholding_pct = 0.00  if available_cents < TIER_MID_CENTS
                        0.02  if available_cents < TIER_HIGH_CENTS
                        0.03  otherwise
      withholding_cents   = round_half_up(available_cents * withholding_pct)
      processing_fee_cents = METHOD_FEE[Consignor.payout_method]
      net_payout_cents = available_cents - withholding_cents - processing_fee_cents

      # a PAYOUT_DISBURSEMENT_DEBIT of -available_cents is minted, driving the
      # balance to exactly 0; withholding and fee are recorded on the same entry
      # as reporting fields and are NOT separate ledger rows.
    input_set: "the consignor's stored unclaimed_balance_cents and payout_method at request time"
    constants:
      TIER_MID_CENTS: 100000
      TIER_HIGH_CENTS: 500000
      METHOD_FEE: { ACH: 0, CHECK: 250, STORE_CREDIT: 0 }
      MIN_PAYOUT_CENTS: 2000
    precision: "integer cents, round_half_up on the withholding product only; net_payout_cents is exact subtraction"

  - name: damage_allocation
    trigger: "POST /damage-claims/{id}/adjudicate with approve true"
    algorithm: waterfall_allocation
    formula: |
      adjudicated_amount_cents = min(claim_amount_cents, Sale.sale_price_cents)

      # ordered buckets: the gallery's own deductible fills FIRST, always.
      if fault_party == GALLERY or fault_party == BUYER:
          gallery_absorbed_cents  = adjudicated_amount_cents
          consignor_debited_cents = 0
      else:
          gallery_bucket = min(adjudicated_amount_cents, GALLERY_DEDUCTIBLE_CENTS)
          remainder      = adjudicated_amount_cents - gallery_bucket
          if fault_party == CONSIGNOR:
              consignor_debited_cents = remainder
          else:                                    # UNDETERMINED
              consignor_debited_cents = round_half_up(remainder * SHARED_FAULT_PCT)
          gallery_absorbed_cents = adjudicated_amount_cents - consignor_debited_cents
      # gallery_absorbed_cents is the remainder of the adjudicated amount, so the
      # two buckets always re-add to adjudicated_amount_cents exactly.
    input_set: "the claim's claim_amount_cents and fault_party, and the parent Sale's sale_price_cents"
    constants:
      GALLERY_DEDUCTIBLE_CENTS: 5000
      SHARED_FAULT_PCT: 0.50
    precision: "integer cents, round_half_up on the shared-fault product; the gallery bucket is exact"

  - name: delivery_fee
    trigger: "POST /delivery-orders"
    algorithm: aggregation
    formula: |
      access_fee = ELEVATOR_FLAT_CENTS if elevator_used
                   else min(stair_flights, STAIR_FLIGHT_CAP) * STAIR_FLIGHT_CENTS
                        + (EXTREME_CLIMB_CENTS if stair_flights > STAIR_FLIGHT_CAP else 0)
      assembly_fee = ASSEMBLY_CENTS if item.category IN {DINING, CASEGOOD} else 0
      delivery_fee_cents = BASE_DELIVERY_CENTS + access_fee + assembly_fee
    input_set: "the Buyer's floor_number and has_elevator as copied onto the DeliveryOrder, plus the sold item's category"
    constants:
      BASE_DELIVERY_CENTS: 7500
      ASSEMBLY_CENTS: 4000
      STAIR_FLIGHT_CENTS: 4500
      STAIR_FLIGHT_CAP: 6
      EXTREME_CLIMB_CENTS: 8000
      ELEVATOR_FLAT_CENTS: 3000
    precision: "integer cents; every term is already an integer so no rounding occurs"

  - name: clearance_relocation_selector
    trigger: "lot_bundle_list_price whenever a repriced lot parent falls below the clearance threshold, and POST /consignment-items/{id}/place when the item's current_price_cents is already below it"
    algorithm: constraint_propagation
    formula: |
      eligible = FloorZone rows with zone_type == CLEARANCE
                 AND status == OPEN
                 AND (capacity_sqft - occupied_sqft) >= item.footprint_sqft
      rank eligible by (capacity_sqft - occupied_sqft) DESC, then created_at ASC
      # created_at is the only tie-break; row id is never consulted.

      if eligible is empty:
          clearance_relocation_pending = true      # item stays where it is
      else:
          winner = eligible[0]
          release the item from its former zone (that zone's occupied_sqft and
            utilization_state are recomputed), then set placement_zone_id = winner.id
            and recompute the winner's occupied_sqft and utilization_state
          clearance_relocation_pending = false
    input_set: "all OPEN FloorZone rows of zone_type CLEARANCE; occupied_sqft is read as stored, i.e. after any release performed earlier in the same cascade"
    constants:
      CLEARANCE_THRESHOLD_CENTS: 50000
    precision: "integer square feet; no rounding"

  - name: floor_zone_utilization
    trigger: "every placement, release, write-off, recovery and clearance relocation that changes a zone's membership"
    algorithm: threshold
    formula: |
      occupied_sqft = sum(i.footprint_sqft for i in ConsignmentItem
                          where i.placement_zone_id == zone.id
                          AND i.inventory_state IN {IN_CUSTODY, SHRINKAGE_MISSING})
      ratio = occupied_sqft / capacity_sqft
      utilization_state = FULL   if ratio >= 1.00
                          TIGHT  if ratio >= 0.75
                          NORMAL otherwise
    input_set: "items still held in the zone; WRITTEN_OFF_INV and RELEASED items are excluded, which is why a write-off frees square feet and a recovery re-consumes them"
    constants:
      TIGHT_RATIO: 0.75
      FULL_RATIO: 1.00
    precision: "occupied_sqft is an exact integer sum; the ratio is compared without rounding"

  - name: unsold_election_window
    trigger: "POST /_ops/markdown-run"
    algorithm: chronological
    formula: |
      unsold_trigger_day_effective = schedule.unsold_trigger_day
                                     + ELECTION_EXTENSION_DAYS * election_round
      if days_on_floor >= unsold_trigger_day_effective
         AND lifecycle_state IN {ON_FLOOR, MARKED_DOWN}:
             lifecycle_state      = UNSOLD_PENDING_ELECTION
             election_deadline_at = clock + schedule.election_window_days * 86400

      # a DISCOUNT election increments election_round, which pushes
      # unsold_trigger_day_effective out by 30 days and returns the item to the
      # floor - this is what makes the unsold loop terminate only by DONATE,
      # RETURN or a sale.
    input_set: "every ConsignmentItem with listed_at not null whose agreement status is ACTIVE or EXPIRED"
    constants:
      ELECTION_EXTENSION_DAYS: 30
      SECONDS_PER_DAY: 86400
    precision: "whole days; days_on_floor uses floor division so a partial day never advances the count"

  - name: escheatment_dormancy
    trigger: "POST /_ops/escheatment-run"
    algorithm: decay_function
    formula: |
      dormancy_days = floor((clock - Consignor.last_activity_at) / 86400)

      if unclaimed_balance_cents <= 0: escheat_state stays NONE      # nothing to escheat
      elif dormancy_days >= ESCHEAT_DAYS:
          escheat_state = ESCHEATED
          mint one ESCHEATMENT_DEBIT of -unclaimed_balance_cents (balance -> 0)
          # this entry deliberately does NOT refresh last_activity_at
      elif dormancy_days >= DORMANT_DAYS:
          escheat_state = DORMANT
      else:
          escheat_state = NONE          # renewed activity resets the curve

      # consignors are processed in Consignor.created_at ASC order.
    input_set: "every Consignor row; last_activity_at is the origin of the curve and is refreshed by every ledger entry except ESCHEATMENT_DEBIT"
    constants:
      DORMANT_DAYS: 365
      ESCHEAT_DAYS: 545
      SECONDS_PER_DAY: 86400
    precision: "whole days by floor division"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the presented X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: |
      segregation of duties, evaluated before any resource state is inspected:
      X-User-ID != ShrinkageAudit.counted_by_user_id on approve-write-off;
      X-User-ID != DeliveryOrder.scheduled_by_user_id on adjudicate;
      X-User-ID != ConsignmentItem.screened_by_user_id on receive
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /shrinkage-audits/{id}/approve-write-off, POST /damage-claims/{id}/adjudicate, POST /consignment-items/{id}/receive"
  - priority: 4
    category: existence
    check: "every {id} addressed in the path resolves to a stored row; when a path carries more than one, they are validated left to right"
    error_id: ERR_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all path-addressed endpoints"
    note: "ERR_ITEM_NOT_FOUND is the representative of the path-existence family; the sibling ids ERR_CONSIGNOR_NOT_FOUND, ERR_BUYER_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SCHEDULE_NOT_FOUND, ERR_PICKUP_JOB_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_SALE_NOT_FOUND, ERR_DELIVERY_ORDER_NOT_FOUND, ERR_CLAIM_NOT_FOUND and ERR_AUDIT_NOT_FOUND share this priority and are selected by which segment failed"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row; body FKs are validated in the order they appear in the endpoint's input list"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /consignment-agreements, POST /consignment-items, POST /price-schedule-steps, POST /pickup-jobs, POST /pickup-jobs/{id}/items, POST /consignment-items/{id}/place, POST /sales, POST /delivery-orders, POST /damage-claims, POST /shrinkage-audits"
    note: "same family as priority 4, selected by which body FK failed; a path id and a body FK are never both missing in a single test because the path is checked first"
  - priority: 6
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, types correct, enum values in range, integer bounds satisfied (declared_value_cents >= 1000, crew_size in 2..6, footprint_sqft >= 1, photo sub-scores in 0..10, markdown_pct in 0.00..0.90)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 7
    category: state
    check: "expected_consignor_version equals the stored Consignor.version"
    error_id: ERR_STALE_CONSIGNOR_VERSION
    http_status: 412
    applies_to: "POST /consignors/{id}/payouts"
  - priority: 8
    category: state
    check: "expected_item_version equals the stored ConsignmentItem.version"
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
    applies_to: "POST /consignment-items/{id}/write-off"
  - priority: 9
    category: state
    check: "the item's lifecycle_state is a legal from-state for the requested transition (see §1.2 ConsignmentItem lifecycle_state)"
    error_id: ERR_ITEM_STATE_INVALID
    http_status: 409
    applies_to: "every POST /consignment-items/{id}/* action, POST /pickup-jobs/{id}/items, POST /sales"
  - priority: 10
    category: state
    check: "the item's inventory_state is a legal from-state for the requested transition; in particular an item in SHRINKAGE_MISSING or WRITTEN_OFF_INV cannot be sold, placed or delivered"
    error_id: ERR_ITEM_CUSTODY_INVALID
    http_status: 409
    applies_to: "POST /consignment-items/{id}/place, POST /consignment-items/{id}/write-off, POST /consignment-items/{id}/inventory-flag, POST /sales, POST /delivery-orders"
  - priority: 11
    category: state
    check: "the Consignor's escheat_state is not ESCHEATED"
    error_id: ERR_CONSIGNOR_ESCHEATED
    http_status: 409
    applies_to: "POST /consignors/{id}/payouts, POST /consignment-agreements, POST /consignment-items"
  - priority: 12
    category: state
    check: "the Consignor's status is ACTIVE"
    error_id: ERR_CONSIGNOR_SUSPENDED
    http_status: 409
    applies_to: "POST /consignment-agreements, POST /consignment-items, POST /consignment-items/{id}/place"
  - priority: 13
    category: state
    check: "the Buyer's status is ACTIVE"
    error_id: ERR_BUYER_BLOCKED
    http_status: 409
    applies_to: "POST /sales"
  - priority: 14
    category: state
    check: "the governing ConsignmentAgreement is in status ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /consignment-items, POST /consignment-items/{id}/place"
  - priority: 15
    category: state
    check: "the Sale is in status COMPLETED, i.e. not already SETTLED or REVERSED"
    error_id: ERR_SALE_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /sales/{id}/reverse, POST /delivery-orders"
  - priority: 16
    category: state
    check: "the DamageClaim is in a legal from-state for the requested action (SUBMITTED for request-info and adjudicate, INFO_REQUESTED for resubmit)"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /damage-claims/{id}/request-info, POST /damage-claims/{id}/resubmit, POST /damage-claims/{id}/adjudicate"
  - priority: 17
    category: state
    check: "resubmission_count is below 2, so the info-request negotiation cycle cannot run a third time"
    error_id: ERR_CLAIM_RESUBMIT_LIMIT
    http_status: 409
    applies_to: "POST /damage-claims/{id}/request-info, POST /damage-claims/{id}/resubmit"
  - priority: 18
    category: state
    check: "election_round is below 2, so an item cannot be discounted back onto the floor a third time"
    error_id: ERR_ELECTION_ROUND_EXHAUSTED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/elect-disposition with election DISCOUNT"
  - priority: 19
    category: business_temporal
    check: "the logical clock is strictly before election_deadline_at"
    error_id: ERR_ELECTION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/elect-disposition"
  - priority: 20
    category: business_temporal
    check: "the logical clock is strictly before DeliveryOrder.claim_window_ends_at, and claim_window_ends_at is not null"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /damage-claims"
  - priority: 21
    category: business_temporal
    check: "for every other non-terminal PickupJob on the same truck the requested window clears a 45-minute turnaround gap, i.e. it is rejected exactly when new_start < other_end + 45 minutes AND other_start < new_end + 45 minutes, so a window starting exactly 45 minutes after another ends is accepted"
    error_id: ERR_TRUCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pickup-jobs"
  - priority: 22
    category: business_temporal
    check: "adding this delivery order would not push the count of the crew's non-terminal orders whose half-open windows contain any instant of the requested window above WhiteGloveCrew.max_concurrent_jobs"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-orders"
  - priority: 23
    category: business_temporal
    check: "window_start is strictly before window_end"
    error_id: ERR_WINDOW_ORDER_INVALID
    http_status: 422
    applies_to: "POST /pickup-jobs, POST /delivery-orders"
  - priority: 24
    category: business_temporal
    check: "a new PriceScheduleStep has sequence == PriceSchedule.step_count + 1 and start_day_offset strictly greater than the previous step's start_day_offset (step 1 must be at offset 0)"
    error_id: ERR_SCHEDULE_STEP_OVERLAP
    http_status: 422
    applies_to: "POST /price-schedule-steps"
  - priority: 25
    category: business_temporal
    check: "the requested clock value is greater than or equal to the current logical clock; time never runs backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 26
    category: business_safety
    check: "photo_count is at least 3 and all three appraiser sub-scores are supplied"
    error_id: ERR_PHOTOS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /consignment-items/{id}/screen"
  - priority: 27
    category: business_safety
    check: "the grade derived from the submitted sub-scores is not REJECTED; a rejected piece cannot be scheduled, priced or placed"
    error_id: ERR_GRADE_REJECTED
    http_status: 422
    applies_to: "POST /pickup-jobs/{id}/items, POST /consignment-items/{id}/place"
  - priority: 28
    category: business_safety
    check: "a lot parent has lot_ready true (every component in inventory_state IN_CUSTODY) before it may be placed on a floor"
    error_id: ERR_LOT_NOT_READY
    http_status: 409
    applies_to: "POST /consignment-items/{id}/place"
  - priority: 29
    category: business_referential
    check: "tag_code is not already held by another item whose inventory_state is not WRITTEN_OFF_INV"
    error_id: ERR_DUPLICATE_TAG_CODE
    http_status: 409
    applies_to: "POST /consignment-items/{id}/place"
  - priority: 30
    category: business_referential
    check: "the elected disposition is available for this item: DONATE is refused for category ART and for any item whose current_price_cents exceeds 200000; RETURN is refused for an item whose inventory_state is WRITTEN_OFF_INV"
    error_id: ERR_DISPOSITION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /consignment-items/{id}/elect-disposition"
  - priority: 31
    category: business_referential
    check: "parent_lot_item_id points at an item that is itself not a component (its own parent_lot_item_id is null) and belongs to the same agreement; lots are exactly one level deep"
    error_id: ERR_LOT_NESTING_FORBIDDEN
    http_status: 422
    applies_to: "POST /consignment-items"
  - priority: 32
    category: business_referential
    check: "the target FloorZone status is OPEN"
    error_id: ERR_ZONE_CLOSED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/place, POST /shrinkage-audits"
  - priority: 33
    category: business_constraint
    check: "the job's total_volume_cuft including the item being attached does not exceed Truck.capacity_volume_cuft"
    error_id: ERR_TRUCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pickup-jobs/{id}/items"
  - priority: 34
    category: business_constraint
    check: "zone.occupied_sqft + item.footprint_sqft does not exceed zone.capacity_sqft"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/place"
  - priority: 35
    category: business_constraint
    check: "counted_item_ids contains no duplicates and every id in it is a stored ConsignmentItem currently placed in the zone being counted"
    error_id: ERR_AUDIT_COUNT_INVALID
    http_status: 422
    applies_to: "POST /shrinkage-audits"
  - priority: 36
    category: business_fiscal
    check: "sale_price_cents is at least the item's current_price_cents multiplied by 0.80, rounded half up — the gallery may discount at the register but not below the negotiated floor"
    error_id: ERR_SALE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /sales"
  - priority: 37
    category: business_fiscal
    check: "claim_amount_cents does not exceed the parent Sale's sale_price_cents"
    error_id: ERR_CLAIM_EXCEEDS_SALE
    http_status: 422
    applies_to: "POST /damage-claims, POST /damage-claims/{id}/adjudicate"
  - priority: 38
    category: business_fiscal
    check: "unclaimed_balance_cents is strictly greater than 0"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    applies_to: "POST /consignors/{id}/payouts"
    note: "the zero-or-negative test must run BEFORE the minimum test, otherwise every negative balance would answer ERR_PAYOUT_BELOW_MINIMUM and ERR_INSUFFICIENT_BALANCE would be unreachable"
  - priority: 39
    category: business_fiscal
    check: "unclaimed_balance_cents is at least MIN_PAYOUT_CENTS (2000)"
    error_id: ERR_PAYOUT_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /consignors/{id}/payouts"
  - priority: 40
    category: state
    check: "the ConsignmentAgreement is in status DRAFT when activation is requested"
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /consignment-agreements/{id}/activate"
    note: "endpoint-local state precondition; no rule numbered 19-39 applies to this endpoint, so its absolute position in the ladder is never observable"
  - priority: 41
    category: state
    check: "the PickupJob is in status SCHEDULED when completion, cancellation or item attachment is requested"
    error_id: ERR_PICKUP_JOB_STATE_INVALID
    http_status: 409
    applies_to: "POST /pickup-jobs/{id}/items, POST /pickup-jobs/{id}/complete, POST /pickup-jobs/{id}/cancel"
    note: "endpoint-local state precondition; it is only ever reached after priorities 1-6 on these endpoints"
  - priority: 42
    category: state
    check: "the ShrinkageAudit is in status COUNTED when write-off approval is requested"
    error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /shrinkage-audits/{id}/approve-write-off"
    note: "evaluated after the priority 3 segregation-of-duties check, so a counter approving an already-reconciled audit still gets ERR_SEGREGATION_OF_DUTIES"
  - priority: 43
    category: business_referential
    check: "the referenced PriceSchedule is in status ACTIVE, and a retire request targets a schedule that is not already RETIRED"
    error_id: ERR_SCHEDULE_RETIRED
    http_status: 409
    applies_to: "POST /consignment-agreements, POST /consignment-agreements/{id}/activate, POST /price-schedules/{id}/retire"
  - priority: 44
    category: business_referential
    check: "the submitted email is not already held by another Consignor (or, on the buyer endpoint, another Buyer)"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /consignors, POST /buyers"
    note: "uniqueness is checked after schema validation at priority 6; these two endpoints trigger no rule numbered 7-43, so the absolute position is never observable"

endpoints:
  # ---- Consignor -----------------------------------------------------------
  - method: POST
    path: "/consignors"
    description: "Register a consignor with the pickup address facts that drive stair and elevator surcharges."
    roles: [GalleryManager, IntakeAppraiser]
    code: 201
    input: [display_name, email, address_line, floor_number, has_elevator, "payout_method?"]
    output: Consignor
    side_effects:
      - "status := ACTIVE; escheat_state := NONE; unclaimed_balance_cents := 0; lifetime_credits_cents := 0"
      - "last_activity_at := clock"
  - method: GET
    path: "/consignors/{id}"
    description: "Read one consignor, including the derived balance and dormancy posture."
    roles: [GalleryManager, IntakeAppraiser, LogisticsCoordinator, FloorOperator, Consignor, SystemOperator]
    code: 200
    input: []
    output: Consignor
    side_effects: []
  - method: GET
    path: "/consignors"
    description: "List consignors with pagination."
    roles: [GalleryManager, SystemOperator]
    code: 200
    input: ["status?", "escheat_state?", "limit?", "offset?"]
    output: Consignor[]
    side_effects: []
  - method: PATCH
    path: "/consignors/{id}"
    description: "Correct a consignor's address facts or payout method; does not retroactively requote scheduled pickups."
    roles: [GalleryManager]
    code: 200
    input: ["address_line?", "floor_number?", "has_elevator?", "payout_method?"]
    output: Consignor
    side_effects:
      - "increments Consignor.version by 1"
      - "already-created PickupJob rows keep their declared_stair_flights and declared_elevator snapshots"
  - method: GET
    path: "/consignors/{id}/ledger-entries"
    description: "Read the consignor's payout ledger in effective_at ascending order."
    roles: [GalleryManager, Consignor, SystemOperator]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: PayoutLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/consignors/{id}/payouts"
    description: "Disburse the consignor's whole unclaimed balance, applying the withholding tier and the method fee."
    roles: [GalleryManager]
    code: 201
    input: [expected_consignor_version]
    output: PayoutLedgerEntry
    side_effects:
      - "runs calculations.payout_disbursement"
      - "mints one PAYOUT_DISBURSEMENT_DEBIT PayoutLedgerEntry of -available_cents carrying withholding_cents, processing_fee_cents and net_payout_cents"
      - "Consignor.unclaimed_balance_cents recomputed to exactly 0; last_activity_at := clock"
      - "when escheat_state == DORMANT it returns to NONE"
      - "when Consignor.status == SUSPENDED and the recomputed balance is >= 0, status := ACTIVE"
      - "increments Consignor.version by 1"

  # ---- Buyer ---------------------------------------------------------------
  - method: POST
    path: "/buyers"
    description: "Register a buyer with the delivery address facts that drive the white-glove fee."
    roles: [GalleryManager, FloorOperator]
    code: 201
    input: [display_name, email, address_line, floor_number, has_elevator]
    output: Buyer
    side_effects:
      - "status := ACTIVE"
  - method: GET
    path: "/buyers/{id}"
    description: "Read one buyer."
    roles: [GalleryManager, FloorOperator, LogisticsCoordinator, Buyer]
    code: 200
    input: []
    output: Buyer
    side_effects: []
  - method: GET
    path: "/buyers"
    description: "List buyers with pagination."
    roles: [GalleryManager, FloorOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Buyer[]
    side_effects: []
  - method: POST
    path: "/buyers/{id}/block"
    description: "Block a buyer from further purchases without touching existing sales."
    roles: [GalleryManager]
    code: 200
    input: []
    output: Buyer
    side_effects:
      - "status := BLOCKED; increments Buyer.version by 1"
      - "existing Sale and DeliveryOrder rows are untouched"

  # ---- PriceSchedule / PriceScheduleStep -----------------------------------
  - method: POST
    path: "/price-schedules"
    description: "Create a declining price schedule shell; its steps are added separately."
    roles: [GalleryManager]
    code: 201
    input: [name, unsold_trigger_day, election_window_days]
    output: PriceSchedule
    side_effects:
      - "status := ACTIVE; step_count := 0"
  - method: GET
    path: "/price-schedules/{id}"
    description: "Read one price schedule with its derived step_count."
    roles: [GalleryManager, FloorOperator, SystemOperator]
    code: 200
    input: []
    output: PriceSchedule
    side_effects: []
  - method: GET
    path: "/price-schedules"
    description: "List price schedules with pagination."
    roles: [GalleryManager, SystemOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PriceSchedule[]
    side_effects: []
  - method: POST
    path: "/price-schedule-steps"
    description: "Append the next markdown step to a schedule; steps must be appended in sequence order at strictly increasing day offsets."
    roles: [GalleryManager]
    code: 201
    input: [schedule_id, sequence, start_day_offset, markdown_pct, min_price_cents]
    output: PriceScheduleStep
    side_effects:
      - "PriceSchedule.step_count recomputed"
      - "increments PriceSchedule.version by 1"
  - method: GET
    path: "/price-schedules/{id}/steps"
    description: "Read a schedule's markdown steps in sequence ascending order."
    roles: [GalleryManager, FloorOperator, SystemOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: PriceScheduleStep[]
    side_effects: []
  - method: POST
    path: "/price-schedules/{id}/retire"
    description: "Retire a schedule so no new agreement may reference it; agreements already active keep using it."
    roles: [GalleryManager]
    code: 200
    input: []
    output: PriceSchedule
    side_effects:
      - "status := RETIRED; increments PriceSchedule.version by 1"
      - "ACTIVE ConsignmentAgreement rows referencing it are unaffected and keep marking their items down"

  # ---- ConsignmentAgreement ------------------------------------------------
  - method: POST
    path: "/consignment-agreements"
    description: "Draft a consignment agreement binding a consignor to a declining price schedule for a fixed term."
    roles: [GalleryManager]
    code: 201
    input: [consignor_id, price_schedule_id, term_days]
    output: ConsignmentAgreement
    side_effects:
      - "status := DRAFT; item_count := 0; effective_at and expires_at stay null until activation"
  - method: GET
    path: "/consignment-agreements/{id}"
    description: "Read one agreement with its derived expiry and item count."
    roles: [GalleryManager, IntakeAppraiser, FloorOperator, Consignor, SystemOperator]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []
  - method: GET
    path: "/consignment-agreements"
    description: "List agreements, filterable by consignor or by the schedule they reference."
    roles: [GalleryManager, IntakeAppraiser, SystemOperator]
    code: 200
    input: ["consignor_id?", "price_schedule_id?", "status?", "limit?", "offset?"]
    output: ConsignmentAgreement[]
    side_effects: []
  - method: POST
    path: "/consignment-agreements/{id}/activate"
    description: "Activate a drafted agreement, starting its term at the current logical clock."
    roles: [GalleryManager]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects:
      - "status := ACTIVE; effective_at := clock; expires_at := effective_at + term_days * 86400"
      - "approved_by_user_id := X-User-ID; increments ConsignmentAgreement.version by 1"

  # ---- ConsignmentItem -----------------------------------------------------
  - method: POST
    path: "/consignment-items"
    description: "Submit a piece for intake under an active agreement; the consignor is copied from the agreement and never taken from the body."
    roles: [IntakeAppraiser]
    code: 201
    input: [agreement_id, title, category, declared_value_cents, photo_count, volume_cuft, footprint_sqft, "parent_lot_item_id?"]
    output: ConsignmentItem
    side_effects:
      - "consignor_id := ConsignmentAgreement.consignor_id; lifecycle_state := INTAKE_SUBMITTED; inventory_state := PENDING_CUSTODY"
      - "ConsignmentAgreement.item_count recomputed"
      - "when parent_lot_item_id is supplied, the parent's lot_component_count and lot_ready are recomputed"
  - method: GET
    path: "/consignment-items/{id}"
    description: "Read one item with both state dimensions, both grade columns and both price columns."
    roles: [GalleryManager, IntakeAppraiser, FloorOperator, LogisticsCoordinator, Consignor, SystemOperator]
    code: 200
    input: []
    output: ConsignmentItem
    side_effects: []
  - method: GET
    path: "/consignment-items"
    description: "List items filterable by consignor, agreement, lot parent, pickup job, placement zone or either state dimension."
    roles: [GalleryManager, IntakeAppraiser, FloorOperator, LogisticsCoordinator, Consignor, SystemOperator]
    code: 200
    input: ["consignor_id?", "agreement_id?", "parent_lot_item_id?", "pickup_job_id?", "placement_zone_id?", "lifecycle_state?", "inventory_state?", "limit?", "offset?"]
    output: ConsignmentItem[]
    side_effects: []
  - method: POST
    path: "/consignment-items/{id}/screen"
    description: "Screen the piece from its photographs, producing the provisional grade and provisional list price."
    roles: [IntakeAppraiser]
    code: 200
    input: [decision, photo_surface_score, photo_structure_score, photo_completeness_score]
    output: ConsignmentItem
    side_effects:
      - "runs calculations.photo_screening_score variant provisional, then calculations.item_list_price variant provisional (or calculations.lot_bundle_list_price when lot_component_count > 0)"
      - "photo_score, provisional_condition_grade, provisional_list_price_cents, condition_grade, list_price_cents and current_price_cents written"
      - "lifecycle_state := SCREEN_ACCEPTED, or SCREEN_REJECTED when decision is REJECT or the derived grade is REJECTED"
      - "screened_by_user_id := X-User-ID; increments ConsignmentItem.version by 1"
  - method: POST
    path: "/consignment-items/{id}/receive"
    description: "Record the physical receiving inspection, re-grading the piece and cascading the new price upward through any lot parent."
    roles: [FloorOperator]
    code: 200
    input: [photo_surface_score, photo_structure_score, photo_completeness_score]
    output: ConsignmentItem
    side_effects:
      - "runs calculations.photo_screening_score variant final, then calculations.item_list_price variant final"
      - "condition_grade, list_price_cents and current_price_cents overwritten; provisional_condition_grade and provisional_list_price_cents left frozen"
      - "lifecycle_state := AWAITING_PLACEMENT, or RECEIVING_DISPUTE (with election_deadline_at set) on a two-or-more-grade downgrade, measured on the rank ladder A=4, B=3, C=2, D=1, REJECTED=0"
      - "a received grade of REJECTED leaves list_price_cents and current_price_cents null; the piece is not refused here, it is refused later at POST /consignment-items/{id}/place by ERR_GRADE_REJECTED"
      - "when parent_lot_item_id is not null the full cascade runs: lot_bundle_list_price on the parent, then markdown_price on the parent, then clearance_relocation_selector, then floor_zone_utilization on the source and destination zones"
      - "received_by_user_id := X-User-ID; increments ConsignmentItem.version by 1"
  - method: POST
    path: "/consignment-items/{id}/place"
    description: "Place a received piece into a floor zone and print its tag; this starts the days_on_floor clock."
    roles: [FloorOperator]
    code: 200
    input: [placement_zone_id, tag_code]
    output: ConsignmentItem
    side_effects:
      - "lifecycle_state := ON_FLOOR; placement_zone_id and tag_code written; listed_at := clock when it was null"
      - "runs calculations.markdown_price, then calculations.clearance_relocation_selector when current_price_cents is below 50000 and the chosen zone is not CLEARANCE, then calculations.floor_zone_utilization on every zone touched"
      - "increments ConsignmentItem.version by 1"
  - method: POST
    path: "/consignment-items/{id}/elect-disposition"
    description: "Record the consignor's disposition election for an unsold or disputed piece: donate, return or discount."
    roles: [Consignor, GalleryManager]
    code: 200
    input: [election]
    output: ConsignmentItem
    side_effects:
      - "disposition_election := election; election_deadline_at := null"
      - "DISCOUNT from UNSOLD_PENDING_ELECTION: election_round incremented, unsold_trigger_day_effective recomputed, lifecycle_state := MARKED_DOWN and calculations.markdown_price re-run in the discount_elected variant"
      - "DONATE: lifecycle_state := DONATION_SCHEDULED; RETURN: lifecycle_state := RETURN_SCHEDULED"
      - "increments ConsignmentItem.version by 1"
  - method: POST
    path: "/consignment-items/{id}/inventory-flag"
    description: "Flag a piece MISSING during a spot check, or RECOVERED when it turns up again."
    roles: [FloorOperator]
    code: 200
    input: [flag]
    output: ConsignmentItem
    side_effects:
      - "MISSING: inventory_state := SHRINKAGE_MISSING with lifecycle_state deliberately untouched"
      - "RECOVERED from SHRINKAGE_MISSING: inventory_state := IN_CUSTODY and no ledger entry is minted"
      - "RECOVERED from WRITTEN_OFF_INV: inventory_state := IN_CUSTODY, lifecycle_state := AWAITING_PLACEMENT, a SHRINKAGE_RECOVERY_DEBIT unwinding the earlier credit is minted, Consignor.unclaimed_balance_cents recomputed, and calculations.floor_zone_utilization re-run"
      - "increments ConsignmentItem.version by 1"
  - method: POST
    path: "/consignment-items/{id}/write-off"
    description: "Write off a single missing piece, crediting the consignor a fraction of its current price."
    roles: [GalleryManager]
    code: 200
    input: [expected_item_version]
    output: ConsignmentItem
    side_effects:
      - "runs calculations.shrinkage_write_off; inventory_state := WRITTEN_OFF_INV; lifecycle_state := WRITTEN_OFF"
      - "placement_zone_id := null and calculations.floor_zone_utilization re-run on the released zone"
      - "mints one SHRINKAGE_CREDIT PayoutLedgerEntry; Consignor.unclaimed_balance_cents and lifetime_credits_cents recomputed; last_activity_at := clock"
      - "increments ConsignmentItem.version by 1"
  - method: POST
    path: "/consignment-items/{id}/release"
    description: "Release a piece scheduled for return or donation out of the building."
    roles: [FloorOperator]
    code: 200
    input: []
    output: ConsignmentItem
    side_effects:
      - "lifecycle_state := RETURNED or DONATED to match disposition_election; inventory_state := RELEASED"
      - "placement_zone_id := null and calculations.floor_zone_utilization re-run"
      - "on DONATED a DISPOSAL_FEE_DEBIT PayoutLedgerEntry of -3500 is minted and the balance is recomputed; on RETURNED no entry is minted"
      - "increments ConsignmentItem.version by 1"
  - method: GET
    path: "/consignment-items/{id}/ledger-entries"
    description: "Read every ledger entry attributable to this piece, in effective_at ascending order."
    roles: [GalleryManager, Consignor, SystemOperator]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: PayoutLedgerEntry[]
    side_effects: []

  # ---- Truck / WhiteGloveCrew / FloorZone -----------------------------------
  - method: POST
    path: "/trucks"
    description: "Register a truck with its cubic capacity."
    roles: [LogisticsCoordinator]
    code: 201
    input: [name, capacity_volume_cuft]
    output: Truck
    side_effects:
      - "status := AVAILABLE"
  - method: GET
    path: "/trucks/{id}"
    description: "Read one truck."
    roles: [LogisticsCoordinator, GalleryManager]
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: GET
    path: "/trucks"
    description: "List trucks with pagination."
    roles: [LogisticsCoordinator, GalleryManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Truck[]
    side_effects: []
  - method: POST
    path: "/white-glove-crews"
    description: "Register a white-glove crew with its concurrent-job ceiling."
    roles: [LogisticsCoordinator]
    code: 201
    input: [name, max_concurrent_jobs]
    output: WhiteGloveCrew
    side_effects:
      - "status := AVAILABLE"
  - method: GET
    path: "/white-glove-crews/{id}"
    description: "Read one crew."
    roles: [LogisticsCoordinator, GalleryManager]
    code: 200
    input: []
    output: WhiteGloveCrew
    side_effects: []
  - method: GET
    path: "/white-glove-crews"
    description: "List crews with pagination."
    roles: [LogisticsCoordinator, GalleryManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WhiteGloveCrew[]
    side_effects: []
  - method: POST
    path: "/floor-zones"
    description: "Create a floor zone with its usable square footage."
    roles: [FloorOperator, GalleryManager]
    code: 201
    input: [name, zone_type, capacity_sqft]
    output: FloorZone
    side_effects:
      - "occupied_sqft := 0; utilization_state := NORMAL; status := OPEN"
  - method: GET
    path: "/floor-zones/{id}"
    description: "Read one zone with its derived occupancy and utilization band."
    roles: [FloorOperator, GalleryManager, SystemOperator]
    code: 200
    input: []
    output: FloorZone
    side_effects: []
  - method: GET
    path: "/floor-zones"
    description: "List zones filterable by type and status."
    roles: [FloorOperator, GalleryManager, SystemOperator]
    code: 200
    input: ["zone_type?", "status?", "limit?", "offset?"]
    output: FloorZone[]
    side_effects: []
  - method: POST
    path: "/floor-zones/{id}/close"
    description: "Close a zone to new placements and to new counts without moving the pieces already in it."
    roles: [GalleryManager]
    code: 200
    input: []
    output: FloorZone
    side_effects:
      - "status := CLOSED; increments FloorZone.version by 1"
      - "occupied_sqft is unchanged and the items in the zone stay placed"
  - method: GET
    path: "/floor-zones/{id}/shrinkage-audits"
    description: "Read the audit history of a zone, newest last."
    roles: [FloorOperator, GalleryManager, SystemOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ShrinkageAudit[]
    side_effects: []

  # ---- PickupJob -----------------------------------------------------------
  - method: POST
    path: "/pickup-jobs"
    description: "Reserve a truck window for a consignor pickup and quote the surcharge from the consignor's declared access facts."
    roles: [LogisticsCoordinator]
    code: 201
    input: [consignor_id, truck_id, window_start, window_end, crew_size, "item_ids?"]
    output: PickupJob
    side_effects:
      - "status := SCHEDULED; scheduled_by_user_id := X-User-ID"
      - "declared_stair_flights and declared_elevator snapshotted from the Consignor row"
      - "every item in item_ids gets pickup_job_id set and lifecycle_state := SCHEDULED_PICKUP"
      - "item_count and total_volume_cuft recomputed, then calculations.pickup_surcharge variant quoted writes quoted_surcharge_cents"
  - method: GET
    path: "/pickup-jobs/{id}"
    description: "Read one pickup job with both the quote and, once completed, the settled surcharge and variance."
    roles: [LogisticsCoordinator, GalleryManager, Consignor]
    code: 200
    input: []
    output: PickupJob
    side_effects: []
  - method: GET
    path: "/pickup-jobs"
    description: "List pickup jobs filterable by consignor, truck or status."
    roles: [LogisticsCoordinator, GalleryManager]
    code: 200
    input: ["consignor_id?", "truck_id?", "status?", "limit?", "offset?"]
    output: PickupJob[]
    side_effects: []
  - method: POST
    path: "/pickup-jobs/{id}/items"
    description: "Attach one more screened piece to a scheduled job and requote the surcharge."
    roles: [LogisticsCoordinator]
    code: 200
    input: [item_id]
    output: PickupJob
    side_effects:
      - "ConsignmentItem.pickup_job_id := this job; that item's lifecycle_state := SCHEDULED_PICKUP"
      - "item_count and total_volume_cuft recomputed, then calculations.pickup_surcharge variant quoted rewrites quoted_surcharge_cents"
      - "increments PickupJob.version by 1"
  - method: POST
    path: "/pickup-jobs/{id}/complete"
    description: "Settle the pickup from what the crew actually did, taking every attached piece into custody and billing the final surcharge."
    roles: [LogisticsCoordinator]
    code: 200
    input: [actual_stair_flights, actual_elevator_used, actual_crew_size]
    output: PickupJob
    side_effects:
      - "runs calculations.pickup_surcharge variant final, writing final_surcharge_cents and surcharge_variance_cents"
      - "status := COMPLETED, or FAILED when actual_crew_size < crew_size - 1 (in which case nothing below happens)"
      - "every attached item: lifecycle_state SCHEDULED_PICKUP -> RECEIVED and inventory_state PENDING_CUSTODY -> IN_CUSTODY; lot parents' lot_ready recomputed"
      - "mints one PICKUP_SURCHARGE_DEBIT PayoutLedgerEntry of -final_surcharge_cents; Consignor.unclaimed_balance_cents recomputed and, when it falls below -50000, Consignor.status := SUSPENDED; last_activity_at := clock"
      - "increments PickupJob.version by 1"
  - method: POST
    path: "/pickup-jobs/{id}/cancel"
    description: "Cancel a scheduled pickup, releasing the truck window and returning every attached piece to SCREEN_ACCEPTED."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: PickupJob
    side_effects:
      - "status := CANCELLED; every attached item's pickup_job_id := null and lifecycle_state := SCREEN_ACCEPTED"
      - "the window stops participating in truck overlap checks; quoted_surcharge_cents is retained but never billed"
      - "increments PickupJob.version by 1"

  # ---- Sale ----------------------------------------------------------------
  - method: POST
    path: "/sales"
    description: "Sell a piece off the floor, splitting the proceeds by category tier and price band."
    roles: [GalleryManager, FloorOperator]
    code: 201
    input: [item_id, buyer_id, sale_price_cents]
    output: Sale
    side_effects:
      - "runs calculations.consignor_split, writing split_pct_applied, consignor_share_cents and gallery_share_cents"
      - "markdown_sequence_at_sale snapshotted from the item; status := COMPLETED; sold_at := clock; sold_by_user_id := X-User-ID"
      - "item lifecycle_state := SOLD; placement_zone_id retained until delivery so the piece still counts toward zone occupancy"
      - "mints one SALE_CREDIT PayoutLedgerEntry of +consignor_share_cents; Consignor.unclaimed_balance_cents and lifetime_credits_cents recomputed; last_activity_at := clock; when Consignor.status == SUSPENDED and the recomputed balance is >= 0, status := ACTIVE"
  - method: GET
    path: "/sales/{id}"
    description: "Read one sale with its split breakdown and refund accumulator."
    roles: [GalleryManager, FloorOperator, LogisticsCoordinator, Consignor, Buyer]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: GET
    path: "/sales"
    description: "List sales filterable by item, buyer or status."
    roles: [GalleryManager, FloorOperator, LogisticsCoordinator]
    code: 200
    input: ["item_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: POST
    path: "/sales/{id}/reverse"
    description: "Reverse a completed sale, unwinding the consignor credit and putting the piece back on the floor."
    roles: [GalleryManager]
    code: 200
    input: []
    output: Sale
    side_effects:
      - "status := REVERSED; reversed_at := clock"
      - "mints one SALE_REVERSAL_DEBIT PayoutLedgerEntry of exactly -consignor_share_cents; Consignor.unclaimed_balance_cents recomputed; last_activity_at := clock"
      - "item lifecycle_state := ON_FLOOR when markdown_sequence == 1 else MARKED_DOWN; calculations.markdown_price re-run"
      - "any SCHEDULED DeliveryOrder on this sale becomes CANCELLED and its crew window is released"
      - "increments Sale.version by 1"

  # ---- DeliveryOrder -------------------------------------------------------
  - method: POST
    path: "/delivery-orders"
    description: "Schedule white-glove delivery of a sold piece into a crew's half-open window and quote the buyer's fee."
    roles: [LogisticsCoordinator]
    code: 201
    input: [sale_id, crew_id, window_start, window_end]
    output: DeliveryOrder
    side_effects:
      - "stair_flights and elevator_used snapshotted from the Buyer row; runs calculations.delivery_fee"
      - "status := SCHEDULED; scheduled_by_user_id := X-User-ID, which is thereafter barred from adjudicating this order's damage claims"
  - method: GET
    path: "/delivery-orders/{id}"
    description: "Read one delivery order with its fee, outcome and claim window."
    roles: [LogisticsCoordinator, GalleryManager, Buyer]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: GET
    path: "/delivery-orders"
    description: "List delivery orders filterable by sale, crew or status."
    roles: [LogisticsCoordinator, GalleryManager]
    code: 200
    input: ["sale_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: DeliveryOrder[]
    side_effects: []
  - method: POST
    path: "/delivery-orders/{id}/complete"
    description: "Record the delivery outcome; DELIVERED settles the sale and opens the damage-claim window, REFUSED reverses it."
    roles: [LogisticsCoordinator]
    code: 200
    input: [outcome]
    output: DeliveryOrder
    side_effects:
      - "status := DELIVERED or REFUSED to match outcome; outcome_recorded_at := clock"
      - "DELIVERED: claim_window_ends_at := clock + 5 * 86400; Sale.status := SETTLED; item lifecycle_state := SETTLED and inventory_state := RELEASED; placement_zone_id := null and calculations.floor_zone_utilization re-run"
      - "REFUSED: claim_window_ends_at stays null; Sale.status := REVERSED with a SALE_REVERSAL_DEBIT minted and the balance recomputed; the item returns to ON_FLOOR or MARKED_DOWN in its former zone"
      - "increments DeliveryOrder.version by 1"

  # ---- DamageClaim ---------------------------------------------------------
  - method: POST
    path: "/damage-claims"
    description: "File a post-delivery damage claim inside the five-day claim window."
    roles: [Buyer, LogisticsCoordinator]
    code: 201
    input: [delivery_order_id, claim_amount_cents, description, "fault_party?"]
    output: DamageClaim
    side_effects:
      - "status := SUBMITTED; resubmission_count := 0; no ledger effect"
  - method: GET
    path: "/damage-claims/{id}"
    description: "Read one claim with its adjudication breakdown."
    roles: [GalleryManager, LogisticsCoordinator, Buyer, Consignor]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/damage-claims"
    description: "List claims filterable by delivery order or status."
    roles: [GalleryManager, LogisticsCoordinator]
    code: 200
    input: ["delivery_order_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/damage-claims/{id}/request-info"
    description: "Send a submitted claim back to the buyer for more information."
    roles: [GalleryManager]
    code: 200
    input: [info_request_note]
    output: DamageClaim
    side_effects:
      - "status := INFO_REQUESTED; info_request_note stored; resubmission_count unchanged"
      - "increments DamageClaim.version by 1"
  - method: POST
    path: "/damage-claims/{id}/resubmit"
    description: "Resubmit a claim with more detail, or withdraw it outright."
    roles: [Buyer]
    code: 200
    input: [description, "withdraw?"]
    output: DamageClaim
    side_effects:
      - "withdraw true: status := WITHDRAWN and resubmission_count unchanged"
      - "withdraw false or absent: status := SUBMITTED and resubmission_count incremented by 1"
      - "increments DamageClaim.version by 1"
  - method: POST
    path: "/damage-claims/{id}/adjudicate"
    description: "Approve or deny a claim, allocating the approved amount between the gallery deductible and the consignor."
    roles: [GalleryManager]
    code: 200
    input: [approve, fault_party]
    output: DamageClaim
    side_effects:
      - "approve true: runs calculations.damage_allocation, writing adjudicated_amount_cents, gallery_absorbed_cents and consignor_debited_cents; status := APPROVED; Sale.refund_cents increased by adjudicated_amount_cents"
      - "approve true with consignor_debited_cents > 0: mints one DAMAGE_ALLOCATION_DEBIT PayoutLedgerEntry of -consignor_debited_cents, recomputes Consignor.unclaimed_balance_cents, sets Consignor.status := SUSPENDED when the balance falls below -50000, and sets last_activity_at := clock"
      - "approve false: status := DENIED with all three money columns 0 and no ledger entry"
      - "adjudicated_by_user_id := X-User-ID; increments DamageClaim.version by 1"

  # ---- ShrinkageAudit ------------------------------------------------------
  - method: POST
    path: "/shrinkage-audits"
    description: "Submit a physical count of a zone; the variance against the expected set becomes the write-off candidate list."
    roles: [FloorOperator]
    code: 201
    input: [floor_zone_id, counted_item_ids]
    output: ShrinkageAudit
    side_effects:
      - "expected_item_count, counted_item_count, variance_count and missing_item_ids computed; counted_by_user_id := X-User-ID"
      - "every expected item absent from counted_item_ids gets inventory_state := SHRINKAGE_MISSING with its lifecycle_state untouched"
      - "variance_count == 0: status := RECONCILED immediately, write_off_total_cents := 0, approved_by_user_id stays null and no PayoutLedgerEntry is minted"
      - "variance_count > 0: status := COUNTED, awaiting a manager's approval"
      - "any earlier non-terminal audit on the same zone becomes ABANDONED"
  - method: POST
    path: "/shrinkage-audits/{id}/approve-write-off"
    description: "Approve the write-offs a count produced, crediting each consignor for the missing pieces."
    roles: [GalleryManager]
    code: 200
    input: []
    output: ShrinkageAudit
    side_effects:
      - "runs calculations.shrinkage_write_off over missing_item_ids in ConsignmentItem.created_at ascending order"
      - "each missing item: inventory_state := WRITTEN_OFF_INV, lifecycle_state := WRITTEN_OFF, placement_zone_id := null, one SHRINKAGE_CREDIT PayoutLedgerEntry minted, owning Consignor balance recomputed and last_activity_at := clock"
      - "write_off_total_cents finalised; status := RECONCILED; approved_by_user_id := X-User-ID"
      - "calculations.floor_zone_utilization re-run once on the zone after the batch"
      - "increments ShrinkageAudit.version by 1"

  # ---- Ops / test-driving --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; time may only move forward."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock used by every deadline, dormancy and days_on_floor computation is set to current_utc"
      - "no entity is mutated and no ops run is implied"
  - method: POST
    path: "/_ops/markdown-run"
    description: "Run the markdown epoch: step every placed piece down its schedule, flag the ones that have gone unsold, expire lapsed elections and expire lapsed agreements."
    roles: [SystemOperator]
    code: 200
    input: []
    output: null
    side_effects:
      - "for every item with listed_at not null: calculations.markdown_price re-run, markdown_sequence and current_price_cents updated, lifecycle_state advanced ON_FLOOR -> MARKED_DOWN or MARKED_DOWN -> MARKED_DOWN as the step in force changes"
      - "calculations.unsold_election_window flags items whose days_on_floor has reached unsold_trigger_day_effective, setting lifecycle_state := UNSOLD_PENDING_ELECTION and election_deadline_at"
      - "items whose election_deadline_at has lapsed without an election become DONATION_SCHEDULED with disposition_election := DONATE"
      - "ConsignmentAgreement rows whose expires_at has passed become EXPIRED"
      - "items are processed in ConsignmentItem.created_at ascending order; each item's version is incremented only when one of its fields actually changed"
  - method: POST
    path: "/_ops/escheatment-run"
    description: "Run the unclaimed-proceeds epoch: advance every consignor's dormancy posture and escheat balances that have gone stale."
    roles: [SystemOperator]
    code: 200
    input: []
    output: null
    side_effects:
      - "runs calculations.escheatment_dormancy over every Consignor in created_at ascending order"
      - "consignors reaching 545 dormant days with a positive balance become ESCHEATED, get one ESCHEATMENT_DEBIT PayoutLedgerEntry of -unclaimed_balance_cents (balance recomputed to exactly 0, last_activity_at deliberately NOT refreshed), and have every ACTIVE ConsignmentAgreement set to TERMINATED"
      - "consignors reaching 365 dormant days with a positive balance become DORMANT with no ledger effect"
      - "Consignor.version is incremented only for rows whose escheat_state or balance actually changed"
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the presented role is not listed in the target endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same operator that performed the incompatible upstream step (counted the audit, scheduled the delivery, or screened the item)"
  - id: ERR_VALIDATION
    http: 400
    condition: "request body fails the endpoint's input schema: missing required field, wrong type, unknown enum value, or a numeric bound violated"
  - id: ERR_CONSIGNOR_NOT_FOUND
    http: 404
    condition: "no Consignor exists for the supplied path id or consignor_id"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "no Buyer exists for the supplied path id or buyer_id"
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "no PriceSchedule exists for the supplied path id or price_schedule_id / schedule_id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ConsignmentAgreement exists for the supplied path id or agreement_id"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "no ConsignmentItem exists for the supplied path id, item_id, parent_lot_item_id, or an id inside counted_item_ids"
  - id: ERR_TRUCK_NOT_FOUND
    http: 404
    condition: "no Truck exists for the supplied path id or truck_id"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "no WhiteGloveCrew exists for the supplied path id or crew_id"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "no FloorZone exists for the supplied path id, placement_zone_id or floor_zone_id"
  - id: ERR_PICKUP_JOB_NOT_FOUND
    http: 404
    condition: "no PickupJob exists for the supplied path id"
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "no Sale exists for the supplied path id or sale_id"
  - id: ERR_DELIVERY_ORDER_NOT_FOUND
    http: 404
    condition: "no DeliveryOrder exists for the supplied path id or delivery_order_id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no DamageClaim exists for the supplied path id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no ShrinkageAudit exists for the supplied path id"
  - id: ERR_STALE_CONSIGNOR_VERSION
    http: 412
    condition: "expected_consignor_version does not equal the stored Consignor.version on a payout request"
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version does not equal the stored ConsignmentItem.version on a write-off request"
  - id: ERR_ITEM_STATE_INVALID
    http: 409
    condition: "the item's lifecycle_state is not a legal from-state for the requested transition"
  - id: ERR_ITEM_CUSTODY_INVALID
    http: 409
    condition: "the item's inventory_state is not a legal from-state for the requested transition, e.g. selling or delivering a piece that is SHRINKAGE_MISSING"
  - id: ERR_CONSIGNOR_ESCHEATED
    http: 409
    condition: "the consignor's escheat_state is ESCHEATED, so no payout, agreement or intake may proceed"
  - id: ERR_CONSIGNOR_SUSPENDED
    http: 409
    condition: "the consignor's status is SUSPENDED because the ledger balance fell below -50000"
  - id: ERR_BUYER_BLOCKED
    http: 409
    condition: "the buyer's status is BLOCKED, or a block is requested on an already-blocked buyer"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "the governing agreement is DRAFT, EXPIRED or TERMINATED when intake or placement is attempted"
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "activation requested on an agreement that is not in DRAFT"
  - id: ERR_SALE_ALREADY_REVERSED
    http: 409
    condition: "the sale is SETTLED or REVERSED when reversal or delivery scheduling is attempted"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "the claim is not in the from-state the requested claim action needs"
  - id: ERR_CLAIM_RESUBMIT_LIMIT
    http: 409
    condition: "resubmission_count has already reached 2, so the info-request cycle cannot run again"
  - id: ERR_ELECTION_ROUND_EXHAUSTED
    http: 409
    condition: "a third DISCOUNT election is attempted on the same item"
  - id: ERR_PICKUP_JOB_STATE_INVALID
    http: 409
    condition: "the pickup job is COMPLETED, FAILED or CANCELLED when an attach, complete or cancel is attempted"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "write-off approval requested on an audit that is RECONCILED or ABANDONED"
  - id: ERR_ELECTION_DEADLINE_PASSED
    http: 409
    condition: "the logical clock has reached or passed election_deadline_at when a disposition election is attempted"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "the five-day claim window has closed, or never opened because the delivery was REFUSED or is still SCHEDULED"
  - id: ERR_TRUCK_WINDOW_CONFLICT
    http: 409
    condition: "the requested truck window, widened by the 45-minute turnaround buffer, intersects another non-terminal job's closed window on the same truck"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "the crew already has max_concurrent_jobs non-terminal orders whose half-open windows intersect the requested window"
  - id: ERR_WINDOW_ORDER_INVALID
    http: 422
    condition: "window_start is at or after window_end"
  - id: ERR_SCHEDULE_STEP_OVERLAP
    http: 422
    condition: "a step is appended out of sequence, or at a start_day_offset that is not strictly greater than the previous step's"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested logical clock value is earlier than the current one"
  - id: ERR_PHOTOS_INSUFFICIENT
    http: 422
    condition: "fewer than 3 intake photographs, or a missing appraiser sub-score, at screening"
  - id: ERR_GRADE_REJECTED
    http: 422
    condition: "an item whose condition_grade is REJECTED is scheduled for pickup or placed on a floor"
  - id: ERR_LOT_NOT_READY
    http: 409
    condition: "placement attempted on a lot parent while at least one component is not yet IN_CUSTODY"
  - id: ERR_DUPLICATE_TAG_CODE
    http: 409
    condition: "the tag_code is already held by an item whose inventory_state is not WRITTEN_OFF_INV"
  - id: ERR_DISPOSITION_NOT_ELIGIBLE
    http: 422
    condition: "the elected disposition is unavailable for this item, e.g. DONATE on category ART or on a piece still priced above 200000"
  - id: ERR_LOT_NESTING_FORBIDDEN
    http: 422
    condition: "parent_lot_item_id points at an item that is itself a lot component, or at an item under a different agreement"
  - id: ERR_ZONE_CLOSED
    http: 409
    condition: "the target FloorZone status is CLOSED, or a close is requested on an already-closed zone"
  - id: ERR_TRUCK_CAPACITY_EXCEEDED
    http: 409
    condition: "attaching the item would push total_volume_cuft above the truck's capacity_volume_cuft"
  - id: ERR_ZONE_CAPACITY_EXCEEDED
    http: 409
    condition: "placing the item would push occupied_sqft above the zone's capacity_sqft"
  - id: ERR_AUDIT_COUNT_INVALID
    http: 422
    condition: "counted_item_ids contains duplicates, or an id that is not currently placed in the zone being counted"
  - id: ERR_SALE_BELOW_FLOOR
    http: 422
    condition: "sale_price_cents is below 80 percent of the item's current_price_cents"
  - id: ERR_CLAIM_EXCEEDS_SALE
    http: 422
    condition: "claim_amount_cents exceeds the parent sale's sale_price_cents"
  - id: ERR_PAYOUT_BELOW_MINIMUM
    http: 409
    condition: "the consignor's unclaimed_balance_cents is positive but below the 2000-cent payout minimum"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 409
    condition: "the consignor's unclaimed_balance_cents is zero or negative when a payout is requested"
  - id: ERR_SCHEDULE_RETIRED
    http: 409
    condition: "the referenced PriceSchedule is RETIRED, or a retire is requested on an already-retired schedule"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "the submitted email already belongs to another consignor or buyer of the same kind"

roles:
  - name: Consignor
    description: "The owner of the consigned pieces. Reads only their own agreements, items and ledger, and elects the disposition of their own unsold or disputed pieces."
    identity: "entity_backed:Consignor"
    exclusive_operations: []
    shared_operations:
      - "POST /consignment-items/{id}/elect-disposition (shared with GalleryManager; a Consignor may only elect on an item whose consignor_id equals X-User-ID)"
      - "GET /consignors/{id}, GET /consignors/{id}/ledger-entries, GET /consignment-agreements/{id}, GET /consignment-items, GET /consignment-items/{id}, GET /consignment-items/{id}/ledger-entries, GET /pickup-jobs/{id}, GET /sales/{id}, GET /damage-claims/{id} — restricted to rows whose consignor_id resolves to X-User-ID"
  - name: Buyer
    description: "The purchaser of a piece. Files and negotiates damage claims against their own delivery orders."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /damage-claims/{id}/resubmit"
    shared_operations:
      - "POST /damage-claims (shared with LogisticsCoordinator; a Buyer may only file against a delivery order whose sale's buyer_id equals X-User-ID)"
      - "GET /buyers/{id}, GET /sales/{id}, GET /delivery-orders/{id}, GET /damage-claims/{id} — restricted to their own rows"
  - name: IntakeAppraiser
    description: "Screens submitted pieces from photographs, assigns the provisional condition grade and opens the consignor record when a walk-in arrives."
    identity: opaque
    exclusive_operations:
      - "POST /consignment-items"
      - "POST /consignment-items/{id}/screen"
    shared_operations:
      - "POST /consignors (shared with GalleryManager)"
      - "GET /consignors/{id}, GET /consignment-agreements, GET /consignment-agreements/{id}, GET /consignment-items, GET /consignment-items/{id}"
  - name: FloorOperator
    description: "Runs the physical floor: receiving inspection, placement and tagging, spot checks, shrinkage counts, releases and register sales."
    identity: opaque
    exclusive_operations:
      - "POST /consignment-items/{id}/receive"
      - "POST /consignment-items/{id}/place"
      - "POST /consignment-items/{id}/inventory-flag"
      - "POST /consignment-items/{id}/release"
      - "POST /shrinkage-audits"
    shared_operations:
      - "POST /floor-zones (shared with GalleryManager)"
      - "POST /buyers (shared with GalleryManager)"
      - "POST /sales (shared with GalleryManager)"
      - "GET /consignors/{id}, GET /consignment-items, GET /consignment-items/{id}, GET /floor-zones, GET /floor-zones/{id}, GET /floor-zones/{id}/shrinkage-audits, GET /price-schedules/{id}, GET /price-schedules/{id}/steps, GET /sales, GET /sales/{id}, GET /buyers, GET /buyers/{id}"
  - name: LogisticsCoordinator
    description: "Owns the moving fleet and the crews: quotes and settles pickups, schedules white-glove deliveries and records their outcomes."
    identity: opaque
    exclusive_operations:
      - "POST /trucks"
      - "POST /white-glove-crews"
      - "POST /pickup-jobs"
      - "POST /pickup-jobs/{id}/items"
      - "POST /pickup-jobs/{id}/complete"
      - "POST /pickup-jobs/{id}/cancel"
      - "POST /delivery-orders"
      - "POST /delivery-orders/{id}/complete"
    shared_operations:
      - "POST /damage-claims (shared with Buyer, for claims phoned in to the crew)"
      - "GET /consignors/{id}, GET /consignment-items, GET /consignment-items/{id}, GET /trucks, GET /trucks/{id}, GET /white-glove-crews, GET /white-glove-crews/{id}, GET /pickup-jobs, GET /pickup-jobs/{id}, GET /sales, GET /sales/{id}, GET /delivery-orders, GET /delivery-orders/{id}, GET /damage-claims, GET /damage-claims/{id}, GET /buyers, GET /buyers/{id}"
  - name: GalleryManager
    description: "Commercial and financial authority: agreements, price schedules, write-off approvals, sale reversals, claim adjudication and consignor payouts. Segregation of duties bars the manager user id that scheduled a delivery from adjudicating its claim, and the operator that counted an audit from approving its write-offs."
    identity: opaque
    exclusive_operations:
      - "PATCH /consignors/{id}"
      - "POST /consignors/{id}/payouts"
      - "POST /buyers/{id}/block"
      - "POST /price-schedules"
      - "POST /price-schedule-steps"
      - "POST /price-schedules/{id}/retire"
      - "POST /consignment-agreements"
      - "POST /consignment-agreements/{id}/activate"
      - "POST /consignment-items/{id}/write-off"
      - "POST /floor-zones/{id}/close"
      - "POST /sales/{id}/reverse"
      - "POST /damage-claims/{id}/request-info"
      - "POST /damage-claims/{id}/adjudicate"
      - "POST /shrinkage-audits/{id}/approve-write-off"
    shared_operations:
      - "POST /consignors (shared with IntakeAppraiser)"
      - "POST /buyers (shared with FloorOperator)"
      - "POST /floor-zones (shared with FloorOperator)"
      - "POST /sales (shared with FloorOperator)"
      - "POST /consignment-items/{id}/elect-disposition (shared with Consignor, for elections taken over the phone)"
      - "every GET in §1.5 except the Consignor- and Buyer-scoped restrictions"
  - name: SystemOperator
    description: "Drives the logical clock and the two nightly epochs. Holds no commercial authority and cannot create, price or move any piece."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/markdown-run"
      - "POST /_ops/escheatment-run"
    shared_operations:
      - "GET /consignors, GET /consignors/{id}, GET /consignors/{id}/ledger-entries, GET /consignment-agreements, GET /consignment-agreements/{id}, GET /consignment-items, GET /consignment-items/{id}, GET /consignment-items/{id}/ledger-entries, GET /price-schedules, GET /price-schedules/{id}, GET /price-schedules/{id}/steps, GET /floor-zones, GET /floor-zones/{id}, GET /floor-zones/{id}/shrinkage-audits"
