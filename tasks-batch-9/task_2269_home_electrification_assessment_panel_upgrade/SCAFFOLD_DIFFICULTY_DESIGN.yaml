              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "PANEL-200A", measure_name: "200 A panel and service upgrade", category: "ELECTRICAL_INFRASTRUCTURE", unit_incentive_cents: 400000, max_quantity: 1, measure_cap_cents: 400000, combined_cap_group: "ELECTRICAL_GROUP", required_panel_capacity_amps: 0, upgraded_capacity_amps: 200, is_panel_upgrade: true, requires_qualifying_appliance: true, sort_order: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Mo Ellis", email: "mo@example.com", service_address_line1: "14 Maple Ct", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Halted Electric", license_number: "EC-3131", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 100, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 }, { measure_code: "PANEL-200A", proposed_quantity: 1, estimated_cost_cents: 600000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors/${ctr_id}/suspension"
              payload: { action: "SUSPEND", suspension_reason: "ADMIN_ACTION" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 600000, measures: [ { measure_code: "PANEL-200A", planned_quantity: 1, estimated_cost_cents: 600000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
          assert:
            - "The response is 409 with error_id ERR_CONTRACTOR_NOT_ACTIVE"
            - "The response is NOT 422 ERR_PANEL_UPGRADE_ANCHOR_MISSING, even though the anchorless measure set is also invalid"
            - "No RebateProject was created: GET /rebate-projects?household_id=${hh_id} returns total_count 0"
            - "Reinstating the contractor and replaying the identical request then returns 422 ERR_PANEL_UPGRADE_ANCHOR_MISSING — proving the second violation was really present and merely outranked"
            - "Assessment.${asm_id}.qualified_measure_count == 2 and effective_panel_amps == 200, so priority 14 and 15 were satisfied throughout"

      - name: role_gate_beats_malformed_request_body
        grounds:
          - validations.priority_2
          - validations.priority_3
          - roles.ProgramAdmin.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          A third category pair, adjacent at the very top of the table: auth
          (priority 2, 403) vs validation (priority 3, 400). The request is
          BOTH sent by a role with no access to the endpoint AND missing two
          required fields plus carrying an out-of-range state_code, so an
          implementation that validates the body before checking the role
          leaks a 400 where a 403 is required. The counterpart at priority 1
          is included to pin the ordering above it as well.
        test_recipe:
          setup:
            - "No pre-existing data is required: the endpoint under test is POST /programs, which is exclusive to ProgramAdmin."
            - "One household exists purely so an Applicant identity is available to act with."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Pair C", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Nils Aho", email: "nils@example.com", service_address_line1: "2 Nutmeg Rd", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 3, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { state_code: "COLORADO" }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { denied_error_id: $.data.error_id }
          assert:
            - "The response is 403 with error_id ERR_FORBIDDEN_ROLE"
            - "The response is NOT 400 ERR_INVALID_REQUEST, even though name and budget_total_cents are missing and state_code violates its two-uppercase-letter constraint"
            - "No Program was created by the trigger: GET /programs as ProgramAdmin still returns total_count 1"
            - "Replaying the identical body as ProgramAdmin then returns 400 ERR_INVALID_REQUEST — the shape violation was real and merely outranked"
            - "Sending the same trigger with no X-User-ID header at all returns 401 ERR_UNAUTHENTICATED, so priority 1 outranks priority 2 in turn"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: ami_percent_rounds_to_one_decimal_before_tier_comparison
        grounds:
          - calculations.income_tier_assignment
          - calculations.income_tier_assignment.precision
          - calculations.income_tier_assignment.constants.SIZE_ADJUSTMENT
          - entities.IncomeVerification.fields.computed_ami_percent
          - endpoints.POST_/income-verifications/{id}/verify
        distinguishing_aspect: |
          Metric: the AMI PERCENTAGE, a 1-decimal quantity that is rounded
          BEFORE the threshold comparison, tested on POST
          /income-verifications/{id}/verify. Four households straddle the
          80.0% low-tier cut by 4 cents of income at a time: 80.04 rounds
          DOWN to 80.0 and stays LOW, while 80.05 rounds half-UP to 80.1 and
          falls to MODERATE. A fourth household proves the size-adjustment
          factor is applied to the median before the ratio, not to the ratio
          afterwards.
        test_recipe:
          setup:
            - "An OPEN program with ami_low_threshold_pct 80.0, ami_moderate_threshold_pct 150.0, low_tier_cap_cents 1400000 and moderate_tier_cap_cents 800000."
            - "Four households in that program: three of household_size 4 and a fourth of household_size 6 to exercise SIZE_ADJUSTMENT[6] = 1.16."
            - "Each household has exactly one SUBMITTED IncomeVerification with county_median_income_cents 10000000; the incomes are 8000000 (80.0 exactly), 8004000 (80.04), 8005000 (80.05) and, for the size-6 household, 9280000 against the 1.16-adjusted median 11600000 (80.0 exactly)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Tiering", state_code: "CO", budget_total_cents: 50000000, ami_low_threshold_pct: 80.0, ami_moderate_threshold_pct: 150.0, low_tier_cap_cents: 1400000, moderate_tier_cap_cents: 800000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Boundary One", email: "b1@example.com", service_address_line1: "1 Birch St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh1: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Boundary Two", email: "b2@example.com", service_address_line1: "2 Birch St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh2: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Boundary Three", email: "b3@example.com", service_address_line1: "3 Birch St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh3: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Boundary Four", email: "b4@example.com", service_address_line1: "4 Birch St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 6, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh4: $.data.id }
            - call: "POST /households/${hh1}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh1}"
              captures: { iv1: $.data.id }
            - call: "POST /households/${hh2}/income-verifications"
              payload: { annual_household_income_cents: 8004000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh2}"
              captures: { iv2: $.data.id }
            - call: "POST /households/${hh3}/income-verifications"
              payload: { annual_household_income_cents: 8005000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh3}"
              captures: { iv3: $.data.id }
            - call: "POST /households/${hh4}/income-verifications"
              payload: { annual_household_income_cents: 9280000, county_median_income_cents: 10000000, household_size_attested: 6 }
              as: Applicant
              as_user_id: "${hh4}"
              captures: { iv4: $.data.id }
          trigger:
            - call: "POST /income-verifications/${iv1}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /income-verifications/${iv2}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /income-verifications/${iv3}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /income-verifications/${iv4}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "IncomeVerification.${iv1}.computed_ami_percent == 80.0 and assigned_income_tier == LOW with assigned_cap_cents 1400000 — the threshold comparison is inclusive (<=)"
            - "IncomeVerification.${iv2}.computed_ami_percent == 80.0 (raw 80.04 rounded half-up to one decimal) and assigned_income_tier == LOW — the 4000-cent difference is invisible after rounding"
            - "IncomeVerification.${iv3}.computed_ami_percent == 80.1 (raw 80.05 rounds half-UP, not half-even) and assigned_income_tier == MODERATE with assigned_cap_cents 800000"
            - "HH2 and HH3 differ by 1000 cents of income and land in different tiers, a 600000-cent difference in rebate_cap_cents"
            - "IncomeVerification.${iv4}.computed_ami_percent == 80.0 and assigned_income_tier == LOW: 9280000 / (10000000 * 1.16) * 100; dividing by the unadjusted median would give 92.8 and MODERATE"
            - "Household.${hh3}.income_tier == MODERATE, rebate_cap_cents == 800000 and lifetime_cap_remaining_cents == 800000"
            - "Household.${hh1}.lifetime_cap_remaining_cents == 1400000 and encumbered_cents == 0, so household_cap_conservation holds immediately after verification"

      - name: group_cap_strict_inequality_at_one_cent_over
        grounds:
          - calculations.measure_incentive_allocation
          - entities.Program.fields.group_cap_cents
          - endpoints.POST_/rebate-projects
          - endpoints.POST_/rebate-projects/{id}/submit
        distinguishing_aspect: |
          A different metric on different endpoints: the COMBINED-MEASURE CAP
          comparison, which is strictly greater-than, tested one cent either
          side of equality on POST /rebate-projects and then on POST
          /rebate-projects/{id}/submit with a replaced measure set. At a group
          sum of exactly 800000 the lines are left untouched (550000 /
          250000); at 800001 the proration engages and rewrites the first line
          to 550000 while the residual pins the total back to exactly 800000.
          The observable difference is a single cent on one line plus the
          group_cap_applied flag, not the total.
        test_recipe:
          setup:
            - "An OPEN program with group_cap_cents 800000, low_tier_cost_share_pct 1.00 and low_tier_cap_cents 1400000 (so Stage 3 can never bind and the boundary under test is Stage 2 alone)."
