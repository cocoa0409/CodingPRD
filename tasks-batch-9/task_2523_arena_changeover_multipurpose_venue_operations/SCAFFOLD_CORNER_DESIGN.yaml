        distinguishing_aspect: "A turnaround whose from_booking sits in Lakeside Arena and whose to_booking sits in Riverton Coliseum is refused with 409 ERR_VENUE_SCOPE_MISMATCH, so ChangeoverOrder.venue_id can never be ambiguous."
