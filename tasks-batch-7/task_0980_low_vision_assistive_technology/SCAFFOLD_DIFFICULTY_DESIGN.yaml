# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances. All numeric asserts are precomputed
# literals derived by executing the §1.3 formulas against the pinned inputs.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_claim_provisional_vs_final
        grounds:
          - calculations.claim_provisional_total
          - state_machines.Claim.DRAFT_to_SUBMITTED
          - state_machines.Claim.SUBMITTED_to_PAID
        distinguishing_aspect: |
          Billing domain (Claim): identical line data yields provisional_total_cents
          7998 (per-line estimate at factor 0.80) but final_amount_cents 7500
          (remittance), and the delta is reconciled against the authorization.
        test_recipe:
          setup:
            - "ACTIVE client with ACCEPTED referral and FINALIZED CCTV evaluation"
            - "CCTV model (list 100000) with one NEW unit; PURCHASE order allocated"
            - "INSURANCE authorization for 50000 cents, APPROVED, window covering 2026"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Ana Reyes", date_of_birth: "1958-03-04" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "PHYSICIAN", referring_party: "Dr. Kim" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 55, field_loss_pct: 40, recommended_category: "CCTV" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-A1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE", warranty_cents: 0 }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-100", authorized_amount_cents: 50000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
          trigger:
            - call: "POST /api/claims"
              payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 3333, quantity: 1 }, { line_type: "WARRANTY", unit_price_cents: 3333, quantity: 1 }, { line_type: "TRAINING", unit_price_cents: 3333, quantity: 1 } ] }
              as: BillingSpecialist
              captures: { cl_id: $.data.id }
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem_mid: $.data.remaining_amount_cents } }
            - { call: "POST /api/claims/${cl_id}/adjudicate", payload: { decision: "PAY", allowed_amount_cents: 7500 }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "GET /api/claims/${cl_id}", as: BillingSpecialist, captures: { prov: $.data.provisional_total_cents, fin: $.data.final_amount_cents, pp: $.data.payer_pays_cents, cp: $.data.client_pays_cents } }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem_end: $.data.remaining_amount_cents } }
          assert:
            - "Claim.${cl_id}.provisional_total_cents == 7998  # 3 x round_half_up(3333*0.80)=2666"
            - "Claim.${cl_id}.final_amount_cents == 7500  # remittance value, not the estimate"
            - "${prov} != ${fin}"
            - "Claim.${cl_id}.payer_pays_cents == 6000  # round_half_up(7500*0.80)"
            - "Claim.${cl_id}.client_pays_cents == 1500"
            - "${rem_mid} == 42002  # 50000 - 7998 reserved at submit"
            - "${rem_end} == 44000  # 42002 + 7998 - 6000 reconciled at adjudication"

      - name: dvc_outcome_provisional_vs_final
        grounds:
          - calculations.outcome_composite
          - state_machines.OutcomeAssessment.DRAFT_to_SCORED
        distinguishing_aspect: |
          Clinical domain (OutcomeAssessment, a different entity domain than the Claim
          instance): identical scores yield provisional_composite 75 under self-report
          weights but final_composite 68 under clinician weights including acuity_delta.
        test_recipe:
          setup:
            - "Client exists (no referral needed for assessments)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Bob Vance", date_of_birth: "1970-01-15", copay_tier: "STANDARD" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/outcome-assessments", payload: { client_id: "${c_id}", kind: "FOLLOW_UP", task_score: 80, satisfaction_score: 70 }, as: VisionSpecialist, captures: { oa_id: $.data.id, prov_comp: $.data.provisional_composite } }
            - { call: "POST /api/outcome-assessments/${oa_id}/finalize", payload: { acuity_delta: 50 }, as: VisionSpecialist, captures: { fin_comp: $.data.final_composite } }
          assert:
            - "${prov_comp} == 75  # round_half_up(0.5*80 + 0.5*70)"
            - "${fin_comp} == 68  # round_half_up(0.3*50 + 0.4*80 + 0.3*70)"
            - "${prov_comp} != ${fin_comp}"
            - "OutcomeAssessment.${oa_id}.status == SCORED"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_payer_responsibility_min_cap_branch
        grounds:
          - calculations.payer_responsibility
          - state_machines.Claim.SUBMITTED_to_PAID
          - state_machines.FundingAuthorization.APPROVED_to_EXHAUSTED
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — coinsurance base,
          nested min() against the remaining-plus-reservation cap, and a payer_type
          branch. Here the min() binds (base 2400 > available 2000), and zeroing the
          remainder cascades the authorization to EXHAUSTED.
        test_recipe:
          setup:
            - "ACTIVE client, FINALIZED MAGNIFIER evaluation, allocated PURCHASE order"
            - "INSURANCE authorization for only 2000 cents, APPROVED, window covering 2026"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Cara Dee", date_of_birth: "1949-11-02" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 50, contrast_score: 50, field_loss_pct: 30, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-M1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-200", authorized_amount_cents: 2000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 1000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_id: $.data.id } }
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
          trigger:
            - { call: "POST /api/claims/${cl_id}/adjudicate", payload: { decision: "PAY", allowed_amount_cents: 3000 }, as: PayerAdjudicator, as_user_id: "pa-1", captures: { pp: $.data.payer_pays_cents, cp: $.data.client_pays_cents } }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem: $.data.remaining_amount_cents, fa_status: $.data.status } }
          assert:
            - "${pp} == 2000  # min(round_half_up(3000*0.80)=2400, 1200 remaining + 800 reservation) — the min() binds"
            - "${cp} == 1000  # 3000 - 2000, STANDARD tier so no halving"
            - "${rem} == 0  # 1200 + 800 - 2000"
            - "${fa_status} == EXHAUSTED"

      - name: cf_claim_provisional_per_line_rounding
        grounds:
          - calculations.claim_provisional_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum, yielding 2668 for two 1667-cent lines at factor 0.80,
          where sum-then-round would yield 2667. A different mode than instance
          cf_payer_responsibility_min_cap_branch (mode a).
        test_recipe:
          setup:
            - "ACTIVE client, allocated PURCHASE order, APPROVED INSURANCE authorization for 50000 cents"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Dan Ojo", date_of_birth: "1962-07-21" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "VR_AGENCY", referring_party: "State VR" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 70, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 7x", category: "MAGNIFIER", list_price_cents: 30000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-M7", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-300", authorized_amount_cents: 50000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
          trigger:
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-11T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 1667, quantity: 1 }, { line_type: "WARRANTY", unit_price_cents: 1667, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_id: $.data.id, prov: $.data.provisional_total_cents } }
          assert:
            - "${prov} == 2668  # pinned: 2 x round_half_up(1667*0.80)=1334 per line, then summed"
            - "${prov} != 2667  # sum-then-round would give round_half_up(3334*0.80)=2667; that order is rejected"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nsm_evaluation_revision_cycle
        grounds:
          - state_machines.Evaluation.DRAFT_to_FINALIZED
          - state_machines.Evaluation.FINALIZED_to_REVISED
          - state_machines.Evaluation.REVISED_to_FINALIZED
        distinguishing_aspect: |
          Evaluation runs a revision cycle FINALIZED -> REVISED -> FINALIZED (not a
          linear pipeline); after the loop the evaluation is again usable for orders.
        test_recipe:
          setup:
            - "ACTIVE client with ACCEPTED referral; MAGNIFIER model exists"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Eve Pol", date_of_birth: "1955-02-11" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "PHYSICIAN", referring_party: "Dr. Noor" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 45, contrast_score: 50, field_loss_pct: 35, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id, s1: $.data.status } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist, captures: { s2: $.data.status } }
            - { call: "POST /api/evaluations/${e_id}/revise", payload: { acuity_score: 48 }, as: VisionSpecialist, captures: { s3: $.data.status } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist, captures: { s4: $.data.status, v4: $.data.version } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_status: $.data.status } }
          assert:
            - "${s1} == DRAFT"
            - "${s2} == FINALIZED"
            - "${s3} == REVISED  # cycle-back leg"
            - "${s4} == FINALIZED  # loop closes"
            - "${v4} == 4  # one mutation per call"
            - "${o_status} == PLACED  # order accepted after the cycle completes"

      - name: nsm_repair_qa_rework_cycle
        grounds:
          - state_machines.RepairTicket.QA_CHECK_to_IN_REPAIR
          - state_machines.RepairTicket.QA_CHECK_to_RESOLVED
          - entities.RepairTicket.fields.rework_count
        distinguishing_aspect: |
          RepairTicket runs a QA rework cycle QA_CHECK -> IN_REPAIR -> QA_CHECK on the
          repair entity (a different entity than Evaluation); rework_count tracks loops.
        test_recipe:
          setup:
            - "CCTV model with one NEW unit IN_STOCK; repair ticket opened on it"
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-R1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${u_id}", issue_description: "flickering backlight" }, as: RepairTechnician, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "START_REPAIR", needs_loaner: false }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "SUBMIT_QA" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "QA_FAIL" }, as: RepairTechnician, captures: { rw1: $.data.rework_count, st1: $.data.status } }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "SUBMIT_QA" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "QA_PASS" }, as: RepairTechnician, captures: { st2: $.data.status } }
            - { call: "GET /api/device-units/${u_id}", as: RepairTechnician, captures: { u_status: $.data.status } }
          assert:
            - "${rw1} == 1  # exactly one QA_FAIL rework loop"
            - "${st1} == IN_REPAIR  # cycle-back leg"
            - "${st2} == RESOLVED"
            - "${u_status} == IN_STOCK  # unit returned to stock on QA_PASS"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_repair_loaner_cascade
        grounds:
          - state_machines.RepairTicket.DIAGNOSED_to_IN_REPAIR
          - state_machines.DeviceUnit.IN_STOCK_to_ON_LOAN
          - calculations.loaner_unit_selector
          - calculations.unit_pool_counts
        distinguishing_aspect: |
          Depth-3 chain triggered by repair advance: START_REPAIR creates a
          LoanAgreement (link 1); loan creation moves the loaner DeviceUnit
          IN_STOCK -> ON_LOAN (link 2); the unit move recomputes
          DeviceModel.in_stock_count (link 3). Trigger differs from the no-show chain.
        test_recipe:
          setup:
            - "CCTV model with unit SN-BRK (NEW, the broken unit) and unit SN-LNR (LOANER), both IN_STOCK"
            - "Repair ticket DIAGNOSED on SN-BRK"
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-BRK", condition: "NEW" }, as: ClinicAdmin, captures: { u_broken: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-LNR", condition: "LOANER" }, as: ClinicAdmin, captures: { u_loaner: $.data.id } }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${u_broken}", issue_description: "no power" }, as: RepairTechnician, captures: { t_id: $.data.id } }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
          trigger:
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "START_REPAIR", needs_loaner: true }, as: RepairTechnician, captures: { loan_id: $.data.loan_agreement_id } }
            - { call: "GET /api/loan-agreements/${loan_id}", as: RepairTechnician, captures: { loan_status: $.data.status, loan_unit: $.data.device_unit_id, loan_ticket: $.data.repair_ticket_id } }
            - { call: "GET /api/device-units/${u_loaner}", as: RepairTechnician, captures: { loaner_status: $.data.status } }
            - { call: "GET /api/device-models/${m_id}", as: RepairTechnician, captures: { stock: $.data.in_stock_count } }
          assert:
            - "${loan_ticket} == ${t_id}  # link 1: advance created the loan"
            - "${loan_status} == ACTIVE"
            - "${loan_unit} == ${u_loaner}"
            - "${loaner_status} == ON_LOAN  # link 2: loan moved the unit"
            - "${stock} == 0  # link 3: broken unit IN_REPAIR + loaner ON_LOAN, model count recomputed"

      - name: tc_no_show_suspension_cascade
        grounds:
          - state_machines.TrainingSession.SCHEDULED_to_NO_SHOW
          - state_machines.TrainingPlan.ACTIVE_to_SUSPENDED
          - state_machines.TrainingSession.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by session resolve (a different trigger than repair
          advance): NO_SHOW bumps plan.no_show_count (link 1); hitting 2 suspends the
          plan (link 2); suspension cancels the remaining SCHEDULED session (link 3).
        test_recipe:
          setup:
            - "ACTIVE client with FINALIZED evaluation and allocated PURCHASE order"
            - "Training plan (total_sessions 3) with three SCHEDULED sessions s1, s2, s3 for instructor inst-1"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Fay Ito", date_of_birth: "1944-05-30" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "INSURANCE", referring_party: "InsureCo" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
