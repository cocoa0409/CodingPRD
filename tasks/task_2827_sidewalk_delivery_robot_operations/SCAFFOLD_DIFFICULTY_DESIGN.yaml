              as: SafetyOfficer
              as_user_id: "so-1"
          assert:
            - "the first CLOSE call returns 409 with error_id ERR_INVALID_STATE_TRANSITION and leaves IncidentReport.${ir}.report_state == SUBMITTED_MUNICIPAL"
            - "IncidentReport.${ir}.insurer_notification_required == true"
            - "IncidentReport.${ir}.municipal_due_by_utc == 2026-08-06T09:00:00.000Z"
            - "after NOTIFY_INSURER, IncidentReport.${ir}.report_state == INSURER_NOTIFIED and insurer_claim_ref == CLM-88123"
            - "after the second CLOSE, IncidentReport.${ir}.report_state == CLOSED"
