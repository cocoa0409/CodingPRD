      - name: division_band_high_is_exclusive_at_exact_key
        boundary: "band_key_spm exactly equal to rating_band_high is OUTSIDE the band, while a key exactly equal to rating_band_low is INSIDE it"
        grounds:
          - calculations.entry_division_assignment_selection
          - validations.priority_29_ERR_NO_ELIGIBLE_DIVISION
          - endpoints.POST_entries_id_assign_division
          - entities.Division.fields.rating_band_high
          - entities.Entry.fields.division_id
        distinguishing_aspect: |
          A third distinct metric -- an interval endpoint on the band interval, tested from BOTH sides
          with the same certificate -- reached through a third endpoint, the assignment action. Entry A
          carries band_key_spm exactly 171.3. Division NARROW_LOW is banded 150.0 to 171.3, and because
          the upper endpoint is EXCLUSIVE the eligible set is empty and the assignment is refused with
          ERR_NO_ELIGIBLE_DIVISION while division_id stays null. Division NARROW_HIGH is then banded
          171.3 to 200.0 and the SAME key now matches, because the lower endpoint is INCLUSIVE. An
          implementation that uses <= on the upper edge assigns the entry to NARROW_LOW on the first
          call; one that uses < on the lower edge refuses the second call as well.
        test_recipe:
          setup:
            - "Three club members and one ISSUED TOD_PHRF MONOHULL certificate for boat A whose band_key_spm is exactly 171.3."
            - "A regatta in status SI_PUBLISHED holding a single division NARROW_LOW banded 150.0 to 171.3, MONOHULL, min_entries 2, still PROVISIONAL."
            - "Entry A is submitted with a complete one-member crew manifest and left unassigned."
