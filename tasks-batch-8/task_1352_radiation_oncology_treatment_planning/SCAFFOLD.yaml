scenario: |
  Radiation Oncology Treatment Planning & Dosimetry (radiation oncology center): consult-to-simulation scheduling & immobilization device, contouring & plan generation with dose constraints, physics plan check & second check before first fraction, machine schedule & fraction delivery tracking, plan adaptation & re-simulation triggers, treatment interruption & compensation, chart round & peer review, billing by treatment complexity & fraction

domain_name: radiation-oncology
api_prefix: /oncology

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across all patients", constraints: "required; unique (ERR_DUPLICATE_MRN, 422)" }
      - { name: full_name, type: string, source: input, description: "Patient legal name", constraints: "required, non-empty" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD", constraints: "required, valid calendar date" }

  - name: TreatmentCourse
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; owning patient" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10-style diagnosis code", constraints: "required, non-empty" }
      - { name: intent, type: enum, source: input, description: "Treatment intent", constraints: "CURATIVE | PALLIATIVE" }
      - { name: technique, type: enum, source: input, description: "Delivery technique; drives pricing and immobilization rules", constraints: "THREE_DCRT | IMRT | SBRT" }
      - { name: prescribed_total_dose_cGy, type: integer, source: input, description: "Total prescribed dose in centigray", constraints: "integer > 0" }
      - { name: planned_fractions, type: integer, source: input, description: "Planned fraction count; mutated by ADD_FRACTIONS compensation and by adaptation replanning", constraints: "integer > 0 at creation" }
      - { name: dose_per_fraction_cGy, type: integer, source: computed, description: "round_half_up(prescribed_total_dose_cGy / planned_fractions); recomputed by fraction_dose_allocation on plan events and DOSE_PER_FRACTION_INCREASE compensation" }
      - { name: delivered_fractions, type: integer, source: computed, default: 0, description: "Count of FractionSession rows in DELIVERED status for this course" }
      - { name: delivered_dose_cGy, type: integer, source: computed, default: 0, description: "Sum of dose_delivered_cGy over DELIVERED FractionSession rows for this course" }
      - { name: fractions_since_chart_review, type: integer, source: computed, default: 0, description: "Deliveries since the most recent ChartReview with outcome PASS; resets to 0 on PASS; NOT reset by FAIL" }
      - { name: baseline_weight_kg, type: number, source: system, description: "patient_weight_kg recorded at the first COMPLETED simulation appointment; null until then" }
      - { name: weekend_makeup_allowance, type: integer, source: system, default: 0, description: "Remaining weekend booking slots granted by WEEKEND_MAKEUP compensations; decremented when a weekend FractionSession is created" }
      - { name: open_interruption_count, type: integer, source: system, default: 0, description: "Stored counter of TreatmentInterruption rows in OPEN status; incremented on interruption creation, decremented on COMPENSATED" }
      - { name: bed_nominal_gy, type: number, source: computed, description: "Nominal biologically effective dose, no time correction; see bed_nominal calculation" }
      - { name: bed_actual_gy, type: number, source: computed, description: "Delivered biologically effective dose with repopulation correction; see bed_actual calculation" }
      - { name: status, type: enum, source: system, description: "CONSULT | SIMULATION_SCHEDULED | SIMULATED | CONTOURING | PLANNING | PHYSICS_REVIEW | TREATMENT_READY | ON_TREATMENT | ADAPTATION_REQUIRED | REPLANNING | COMPLETED | DISCONTINUED" }

  - name: SimulationAppointment
    parent: TreatmentCourse
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: machine_id, type: string, source: input, description: "FK -> TreatmentMachine.id; must reference a machine with machine_type CT_SIMULATOR" }
      - { name: purpose, type: enum, source: input, default: "INITIAL", description: "INITIAL | ADAPTATION; ADAPTATION bookings only valid while course is ADAPTATION_REQUIRED" }
      - { name: start_time, type: datetime, source: input, description: "Slot start (ISO 8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Slot end (ISO 8601 UTC); must be strictly after start_time" }
      - { name: immobilization_device, type: enum, source: input, description: "NONE | THERMOPLASTIC_MASK | VACUUM_CRADLE | BODY_FRAME; SBRT courses require THERMOPLASTIC_MASK or BODY_FRAME" }
      - { name: patient_weight_kg, type: number, source: input, description: "Weight recorded at completion; null until completed; required input of the complete action" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: ContourSet
    parent: TreatmentCourse
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: set_label, type: string, source: input, description: "Human label, e.g. 'CT1 primary contours'", constraints: "required, non-empty" }
      - { name: target_volumes, type: array, source: input, description: "Array of target volume name strings; length drives the planning-charge multiplier", constraints: "array of >= 1 non-empty strings" }
      - { name: oar_structures, type: array, source: input, description: "Array of organ-at-risk structure name strings", constraints: "array (may be empty)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating RadiationOncologist; used for segregation-of-duties on approve" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the approving oncologist; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RETURNED" }

  - name: TreatmentPlan
    parent: TreatmentCourse
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: contour_set_id, type: string, source: input, description: "FK -> ContourSet.id; must be an APPROVED contour set of the same course" }
      - { name: supersedes_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; null for the initial plan; for adaptation plans must reference the highest plan_version plan of the same course", constraints: "nullable" }
      - { name: plan_version, type: integer, source: system, description: "1 for the first plan of a course; each new plan on the same course increments by 1" }
      - { name: target_total_dose_cGy, type: integer, source: input, description: "Dose this plan intends to deliver; initial plan must equal course.prescribed_total_dose_cGy; adaptation plan must equal prescribed minus already-delivered dose (ERR_REMAINING_DOSE_MISMATCH)", constraints: "integer > 0" }
      - { name: planned_fractions, type: integer, source: input, description: "Fractions this plan will deliver", constraints: "integer > 0" }
      - { name: dose_per_fraction_cGy, type: integer, source: computed, description: "round_half_up(target_total_dose_cGy / planned_fractions); final fraction of the plan carries the remainder per fraction_dose_allocation" }
      - { name: planner_id, type: string, source: system, description: "X-User-ID of the creating MedicalDosimetrist; segregation anchor for physics checks" }
      - { name: pinned_contour_version, type: integer, source: system, description: "ContourSet.version observed at plan creation; submit-for-check rejects when the contour set's current version differs (ERR_STALE_CONTOUR_SET)" }
      - { name: primary_checker_id, type: string, source: system, description: "X-User-ID of the PRIMARY PASS checker; null until then" }
      - { name: secondary_checker_id, type: string, source: system, description: "X-User-ID of the SECOND PASS checker; null until then" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_PRIMARY_CHECK | PENDING_SECOND_CHECK | APPROVED_FOR_DELIVERY | ACTIVE | CHECK_FAILED | SUPERSEDED | COMPLETED" }

  - name: DoseConstraint
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id; owning plan" }
      - { name: structure_name, type: string, source: input, description: "Structure the constraint applies to", constraints: "required, non-empty" }
      - { name: constraint_type, type: enum, source: input, description: "MAX_DOSE | MEAN_DOSE" }
      - { name: limit_cGy, type: integer, source: input, description: "Constraint limit in cGy", constraints: "integer > 0" }
      - { name: evaluated_value_cGy, type: integer, source: input, description: "Dosimetry engine's evaluated value for the structure", constraints: "integer >= 0" }
      - { name: satisfied, type: boolean, source: computed, description: "evaluated_value_cGy <= limit_cGy (equality satisfies)" }

  - name: PhysicsCheck
    parent: TreatmentPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id; checked plan" }
      - { name: check_type, type: enum, source: input, description: "PRIMARY | SECOND" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL" }
      - { name: checker_id, type: string, source: system, description: "X-User-ID of the checking MedicalPhysicist (opaque operator id)" }
      - { name: notes, type: string, source: input, description: "Optional free-text note", constraints: "nullable" }

  - name: TreatmentMachine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Machine name", constraints: "required, non-empty" }
      - { name: machine_type, type: enum, source: input, description: "CT_SIMULATOR | LINAC" }
      - { name: room, type: string, source: input, description: "Room identifier", constraints: "required, non-empty" }
      - { name: status, type: enum, source: system, description: "OPERATIONAL | DOWN; starts OPERATIONAL" }

  - name: FractionSession
    parent: TreatmentCourse
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; plan this session treats under; must belong to the same course and be APPROVED_FOR_DELIVERY or ACTIVE" }
      - { name: machine_id, type: string, source: input, description: "FK -> TreatmentMachine.id; must reference a LINAC" }
      - { name: fraction_number, type: integer, source: system, description: "Per-course sequence: 1 + max(fraction_number) over all existing sessions of the course; never reused after cancellation" }
      - { name: start_time, type: datetime, source: input, description: "Slot start (ISO 8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Slot end (ISO 8601 UTC); must be strictly after start_time" }
      - { name: igrt_planned, type: boolean, source: input, default: false, description: "Whether image guidance is billed for this session" }
      - { name: is_first_fraction, type: boolean, source: computed, description: "fraction_number == 1" }
      - { name: is_weekend, type: boolean, source: computed, description: "True when start_time (UTC) falls on a Saturday or Sunday" }
      - { name: dose_delivered_cGy, type: integer, source: system, description: "Allocated per-fraction dose recorded at delivery; null until DELIVERED" }
      - { name: cancellation_reason, type: enum, source: system, description: "MACHINE_DOWN | PATIENT | ADAPTATION | OTHER; null unless CANCELLED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELIVERED | CANCELLED | NO_SHOW" }

  - name: TreatmentInterruption
    parent: TreatmentCourse
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: reason, type: enum, source: input, description: "MACHINE_DOWN | PATIENT_ILLNESS | OTHER" }
      - { name: missed_count, type: integer, source: input, description: "Number of fractions missed; for machine-down cascade rows this is system-set to the cancelled session count", constraints: "integer >= 1" }
      - { name: start_date, type: string, source: input, description: "First missed day, ISO date", constraints: "required" }
      - { name: end_date, type: string, source: input, description: "Last missed day, ISO date; must be >= start_date", constraints: "required" }
      - { name: gap_days, type: integer, source: computed, description: "Calendar days of interruption = (end_date - start_date) in whole days + 1" }
      - { name: applied_strategy, type: enum, source: system, description: "ADD_FRACTIONS | DOSE_PER_FRACTION_INCREASE | WEEKEND_MAKEUP; null until COMPENSATED" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPENSATED" }

  - name: ChartReview
    parent: TreatmentCourse
    common_fields: false
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the recording MedicalPhysicist (opaque operator id)" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL" }
      - { name: notes, type: string, source: input, description: "Optional free-text note", constraints: "nullable" }
      - { name: delivered_fractions_at_review, type: integer, source: system, description: "Snapshot of course.delivered_fractions at review time; PASS resets course.fractions_since_chart_review to 0" }

  - name: BillingClaim
    parent: TreatmentCourse
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TreatmentCourse.id; owning course" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUBMITTED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Forward-looking estimate; see billing_provisional_total calculation" }
      - { name: gross_total_cents, type: integer, source: computed, default: 0, description: "Sum of ChargeLine.amount_cents; recomputed whenever lines change and on finalize/reopen" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Payer-tier discount; see claim_discount calculation" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "gross_total_cents - discount_cents; computed on finalize and retained verbatim across reopen" }

  - name: ChargeLine
    parent: BillingClaim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> BillingClaim.id; owning claim" }
      - { name: code, type: enum, source: system, description: "SIMULATION | PLANNING | PHYSICS_CHECK | FRACTION_DELIVERY | IGRT | FIRST_FRACTION_SETUP | NO_SHOW_FEE" }
      - { name: description, type: string, source: system, description: "Human-readable line description" }
      - { name: quantity, type: integer, source: system, description: "Units charged; 1 for all system-generated lines" }
      - { name: unit_charge_cents, type: integer, source: system, description: "Per-unit charge from the fee schedule" }
      - { name: amount_cents, type: integer, source: computed, description: "quantity * unit_charge_cents (integer cents; no rounding needed)" }
      - { name: event_ref_id, type: string, source: system, description: "Id of the source entity (simulation/plan/check/session) that generated this line; (claim_id, code, event_ref_id) is unique to prevent double-charging" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TreatmentCourse
    initial_state: CONSULT
    terminal_states: [COMPLETED, DISCONTINUED]
    transitions:
      - from: CONSULT
        to: SIMULATION_SCHEDULED
        trigger: "system (automatic when the first SimulationAppointment is created with status SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIMULATION_SCHEDULED
        to: SIMULATED
        trigger: "system (automatic when any SimulationAppointment of the course completes)"
        actor: system
        preconditions: []
        side_effects:
          - "course.baseline_weight_kg := appointment.patient_weight_kg (first completion only; later completions do not overwrite)"
      - from: SIMULATED
        to: CONTOURING
        trigger: "system (automatic when the first ContourSet is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTOURING
        to: PLANNING
        trigger: "system (automatic when a ContourSet of the course reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNING
        to: PHYSICS_REVIEW
        trigger: "system (automatic when a TreatmentPlan is submitted for check)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PHYSICS_REVIEW
        to: PLANNING
        trigger: "system (automatic when the plan under review reaches CHECK_FAILED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Revision loop: planning resumes after a failed physics check"
      - from: PHYSICS_REVIEW
        to: TREATMENT_READY
        trigger: "system (automatic when the plan under review reaches APPROVED_FOR_DELIVERY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPLANNING
        to: PHYSICS_REVIEW
        trigger: "system (automatic when the adaptation TreatmentPlan is submitted for check)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TREATMENT_READY
        to: ON_TREATMENT
        trigger: "system (automatic on the first DELIVERED FractionSession of the course)"
        actor: system
        preconditions: []
        side_effects:
          - "the session's plan transitions APPROVED_FOR_DELIVERY -> ACTIVE"
      - from: ON_TREATMENT
        to: ADAPTATION_REQUIRED
        trigger: "POST /oncology/treatment-courses/{id}/adaptation-checks with weight loss >= 10.0% of baseline_weight_kg or physician_override = true"
        actor: RadiationOncologist
        preconditions:
          - "course.status == ON_TREATMENT (ERR_COURSE_NOT_ON_TREATMENT)"
          - "course.baseline_weight_kg is set (guaranteed: ON_TREATMENT implies a COMPLETED simulation)"
        side_effects:
          - "the course's ACTIVE plan -> SUPERSEDED"
          - "each SCHEDULED FractionSession of the superseded plan -> CANCELLED with cancellation_reason ADAPTATION (DELIVERED / NO_SHOW / CANCELLED sessions untouched)"
          - "if a BillingClaim of the course is FINALIZED it auto-transitions to DRAFT (totals retained)"
      - from: ADAPTATION_REQUIRED
        to: REPLANNING
        trigger: "system (automatic when a TreatmentPlan is created with supersedes_plan_id set)"
        actor: system
        preconditions: []
        side_effects:
          - "course.planned_fractions := course.delivered_fractions + new_plan.planned_fractions"
          - "course.dose_per_fraction_cGy recomputed by fraction_dose_allocation over the new plan"
      - from: ON_TREATMENT
        to: COMPLETED
        trigger: "POST /oncology/treatment-courses/{id}/complete"
        actor: RadiationOncologist
        preconditions:
          - "course.status == ON_TREATMENT (ERR_COURSE_NOT_ON_TREATMENT); ON_TREATMENT already implies at least one DELIVERED fraction"
          - "no FractionSession of the course in SCHEDULED status (ERR_OPEN_SESSIONS_EXIST)"
        side_effects:
          - "the course's ACTIVE plan -> COMPLETED"
      - from: CONSULT
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions:
          - "course not already terminal (ERR_COURSE_TERMINAL)"
        side_effects:
          - "all SCHEDULED SimulationAppointments -> CANCELLED (reason OTHER)"
          - "all SCHEDULED FractionSessions -> CANCELLED (reason OTHER)"
          - "any plan in DRAFT / PENDING_PRIMARY_CHECK / PENDING_SECOND_CHECK / APPROVED_FOR_DELIVERY / ACTIVE -> SUPERSEDED"
          - "FINALIZED BillingClaim auto-transitions to DRAFT"
      - from: SIMULATION_SCHEDULED
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: SIMULATED
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: CONTOURING
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: PLANNING
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: PHYSICS_REVIEW
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: TREATMENT_READY
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: ADAPTATION_REQUIRED
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]
      - from: REPLANNING
        to: DISCONTINUED
        trigger: "POST /oncology/treatment-courses/{id}/discontinue"
        actor: RadiationOncologist
        preconditions: ["course not already terminal (ERR_COURSE_TERMINAL)"]
        side_effects: ["same cascade as CONSULT -> DISCONTINUED"]

  - entity: SimulationAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /oncology/simulation-appointments/{id}/complete"
        actor: RadiationTherapist
        preconditions:
          - "appointment.status == SCHEDULED (ERR_SIMULATION_NOT_SCHEDULED)"
          - "course not terminal (ERR_COURSE_TERMINAL)"
        side_effects:
          - "appointment.patient_weight_kg recorded from input"
          - "if this is the course's first COMPLETED appointment: course SIMULATION_SCHEDULED -> SIMULATED, baseline_weight_kg set; if course is ADAPTATION_REQUIRED it stays ADAPTATION_REQUIRED"
          - "billing: append a SIMULATION ChargeLine (SIMULATION_FEE_CENTS) to the course's DRAFT claim if one exists"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /oncology/simulation-appointments/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "appointment.status == SCHEDULED (ERR_SIMULATION_NOT_SCHEDULED)"
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /oncology/simulation-appointments/{id}/mark-no-show"
        actor: RadiationTherapist
        preconditions:
          - "appointment.status == SCHEDULED (ERR_SIMULATION_NOT_SCHEDULED)"
        side_effects: []

  - entity: ContourSet
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /oncology/contour-sets/{id}/submit"
        actor: RadiationOncologist
        preconditions:
          - "contour.status == DRAFT or RETURNED (ERR_CONTOUR_NOT_SUBMITTABLE)"
          - "course not terminal (ERR_COURSE_TERMINAL)"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /oncology/contour-sets/{id}/submit"
        actor: RadiationOncologist
        preconditions:
          - "contour.status == DRAFT or RETURNED (ERR_CONTOUR_NOT_SUBMITTABLE)"
          - "course not terminal (ERR_COURSE_TERMINAL)"
        side_effects: []
        note: "Resubmission loop; each mutation bumps version, which can stale pinned plan references"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /oncology/contour-sets/{id}/approve"
        actor: RadiationOncologist
        preconditions:
          - "contour.status == SUBMITTED (ERR_CONTOUR_NOT_SUBMITTED)"
          - "X-User-ID != contour.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "course not terminal (ERR_COURSE_TERMINAL)"
        side_effects:
          - "contour.reviewed_by_user_id := X-User-ID"
          - "if course.status == CONTOURING: course -> PLANNING"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /oncology/contour-sets/{id}/return"
        actor: RadiationOncologist
        preconditions:
          - "contour.status == SUBMITTED or APPROVED (ERR_CONTOUR_NOT_SUBMITTED)"
          - "X-User-ID != contour.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: RETURNED
        trigger: "POST /oncology/contour-sets/{id}/return"
        actor: RadiationOncologist
        preconditions:
          - "contour.status == SUBMITTED or APPROVED (ERR_CONTOUR_NOT_SUBMITTED)"
          - "X-User-ID != contour.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
        note: "Reopening an APPROVED contour set bumps version; plans holding the old pinned_contour_version can no longer be submitted (ERR_STALE_CONTOUR_SET)"

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, COMPLETED]
    transitions:
      - from: DRAFT
        to: PENDING_PRIMARY_CHECK
        trigger: "POST /oncology/treatment-plans/{id}/submit-for-check"
        actor: MedicalDosimetrist
        preconditions:
          - "plan.status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "at least one DoseConstraint exists for the plan (ERR_NO_DOSE_CONSTRAINTS)"
          - "every DoseConstraint of the plan has satisfied == true (ERR_DOSE_CONSTRAINT_VIOLATION)"
          - "contour set still APPROVED and contour.version == plan.pinned_contour_version (ERR_STALE_CONTOUR_SET)"
          - "course not terminal (ERR_COURSE_TERMINAL)"
        side_effects:
          - "course PLANNING or REPLANNING -> PHYSICS_REVIEW"
      - from: PENDING_PRIMARY_CHECK
        to: PENDING_SECOND_CHECK
        trigger: "system (automatic when a PRIMARY PhysicsCheck with outcome PASS is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "plan.primary_checker_id := check.checker_id"
          - "billing: append PHYSICS_CHECK ChargeLine (PHYSICS_CHECK_FEE_CENTS) to the course's DRAFT claim if one exists"
      - from: PENDING_PRIMARY_CHECK
        to: CHECK_FAILED
        trigger: "system (automatic when a PRIMARY PhysicsCheck with outcome FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "course PHYSICS_REVIEW -> PLANNING (or -> REPLANNING when plan.supersedes_plan_id is set)"
      - from: PENDING_SECOND_CHECK
        to: APPROVED_FOR_DELIVERY
        trigger: "system (automatic when a SECOND PhysicsCheck with outcome PASS is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "plan.secondary_checker_id := check.checker_id"
          - "course PHYSICS_REVIEW -> TREATMENT_READY"
          - "billing: append PHYSICS_CHECK ChargeLine to the course's DRAFT claim if one exists"
          - "billing: append PLANNING ChargeLine to the course's DRAFT claim if one exists (full rate for initial plans, half rate when supersedes_plan_id is set; multiplier from the pinned contour set's target_volumes length)"
      - from: PENDING_SECOND_CHECK
        to: CHECK_FAILED
        trigger: "system (automatic when a SECOND PhysicsCheck with outcome FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "course PHYSICS_REVIEW -> PLANNING (or -> REPLANNING when plan.supersedes_plan_id is set)"
      - from: CHECK_FAILED
        to: DRAFT
        trigger: "POST /oncology/treatment-plans/{id}/revise"
        actor: MedicalDosimetrist
        preconditions:
          - "plan.status == CHECK_FAILED (ERR_PLAN_NOT_REVISABLE)"
        side_effects: []
        note: "Revision cycle DRAFT -> ... -> CHECK_FAILED -> DRAFT; dose constraints may then be corrected"
      - from: APPROVED_FOR_DELIVERY
        to: ACTIVE
        trigger: "system (automatic on the course's first DELIVERED FractionSession under this plan)"
        actor: system
        preconditions: []
        side_effects:
          - "course TREATMENT_READY -> ON_TREATMENT"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when the course enters ADAPTATION_REQUIRED or DISCONTINUED)"
        actor: system
        preconditions: []
        side_effects:
          - "the plan's SCHEDULED FractionSessions -> CANCELLED with reason ADAPTATION (or OTHER on discontinue)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when the course completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FractionSession
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /oncology/fraction-sessions/{id}/deliver"
        actor: RadiationTherapist
        preconditions:
          - "session.status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "course.status == TREATMENT_READY or ON_TREATMENT (ERR_COURSE_NOT_ON_TREATMENT); the session's plan is then necessarily APPROVED_FOR_DELIVERY or ACTIVE, because supersession cancels a plan's SCHEDULED sessions"
          - "course.fractions_since_chart_review < CHART_REVIEW_FRACTION_LIMIT (ERR_CHART_REVIEW_OVERDUE)"
          - "session.machine status == OPERATIONAL (ERR_MACHINE_NOT_OPERATIONAL)"
        side_effects:
          - "session.dose_delivered_cGy := plan allocation for this delivery index (see fraction_dose_allocation)"
          - "course.delivered_fractions += 1; course.delivered_dose_cGy += dose_delivered_cGy; course.fractions_since_chart_review += 1"
          - "if this is the course's first DELIVERED session: course TREATMENT_READY -> ON_TREATMENT and plan APPROVED_FOR_DELIVERY -> ACTIVE"
          - "billing: if a claim exists and is FINALIZED it auto-transitions to DRAFT; append FRACTION_DELIVERY line (+ IGRT line when session.igrt_planned, + FIRST_FRACTION_SETUP line when session.is_first_fraction) to the DRAFT claim if one exists"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /oncology/fraction-sessions/{id}/cancel with reason PATIENT | OTHER, or system cascade (MACHINE_DOWN / ADAPTATION)"
        actor: Scheduler | system
        preconditions:
          - "session.status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects:
          - "session.cancellation_reason recorded"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /oncology/fraction-sessions/{id}/mark-no-show"
        actor: RadiationTherapist
        preconditions:
          - "session.status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects:
          - "billing: if a claim exists and is FINALIZED it auto-transitions to DRAFT; append NO_SHOW_FEE line (NO_SHOW_FEE_CENTS) to the DRAFT claim if one exists"

  - entity: TreatmentInterruption
    initial_state: OPEN
    terminal_states: [COMPENSATED]
    transitions:
      - from: OPEN
        to: COMPENSATED
        trigger: "POST /oncology/interruptions/{id}/compensate"
        actor: RadiationOncologist
        preconditions:
          - "interruption.status == OPEN (ERR_INTERRUPTION_NOT_OPEN)"
          - "course.status == ON_TREATMENT (ERR_COURSE_NOT_ON_TREATMENT)"
          - "strategy == DOSE_PER_FRACTION_INCREASE requires remaining fraction count > 0 on the ACTIVE plan (ERR_NO_REMAINING_FRACTIONS)"
        side_effects:
          - "interruption.applied_strategy := input strategy"
          - "course.open_interruption_count -= 1"
          - "ADD_FRACTIONS: course.planned_fractions += missed_count; ACTIVE plan.planned_fractions += missed_count; dose per fraction unchanged"
          - "DOSE_PER_FRACTION_INCREASE: fraction_dose_allocation recomputed over the ACTIVE plan's remaining fractions; planned counts unchanged"
          - "WEEKEND_MAKEUP: course.weekend_makeup_allowance += missed_count"

  - entity: BillingClaim
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /oncology/billing-claims/{id}/finalize"
        actor: BillingCoordinator
        preconditions:
          - "claim.status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
          - "claim has at least one ChargeLine (ERR_EMPTY_CLAIM)"
          - "expected_claim_version == claim.version (ERR_STALE_VERSION)"
        side_effects:
          - "gross_total_cents, discount_cents, final_total_cents computed per claim_discount (evaluation order pinned there)"
          - "increments BillingClaim.version by 1"
      - from: FINALIZED
        to: DRAFT
        trigger: "POST /oncology/billing-claims/{id}/reopen, or system auto-reopen when a charge-affecting clinical event occurs"
        actor: BillingCoordinator | system
        preconditions:
          - "claim.status == FINALIZED (ERR_CLAIM_NOT_FINALIZED)"
        side_effects:
          - "gross_total_cents / discount_cents / final_total_cents are retained verbatim across the round trip; they are only recomputed on the next finalize"
      - from: FINALIZED
        to: SUBMITTED
        trigger: "POST /oncology/billing-claims/{id}/submit"
        actor: BillingCoordinator
        preconditions:
          - "claim.status == FINALIZED (ERR_CLAIM_NOT_FINALIZED)"
          - "course.status == COMPLETED or DISCONTINUED (ERR_COURSE_NOT_TERMINAL)"
        side_effects: []

  - entity: TreatmentMachine
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: DOWN
        trigger: "PUT /oncology/machines/{id}/status with status DOWN"
        actor: SystemAdmin
        preconditions:
          - "machine.status == OPERATIONAL (ERR_MACHINE_ALREADY_DOWN)"
        side_effects:
          - "every FractionSession on this machine with status SCHEDULED and start_time >= current logical time -> CANCELLED with cancellation_reason MACHINE_DOWN"
          - "for each affected course: create a TreatmentInterruption (reason MACHINE_DOWN, missed_count = cancelled sessions for that course, start_date = end_date = date of earliest cancelled session, status OPEN)"
          - "each such interruption creation increments course.open_interruption_count by 1"
      - from: DOWN
        to: OPERATIONAL
        trigger: "PUT /oncology/machines/{id}/status with status OPERATIONAL"
        actor: SystemAdmin
        preconditions:
          - "machine.status == DOWN (ERR_MACHINE_NOT_DOWN)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-course
    parent_entity: TreatmentCourse
    write_endpoint: "POST /oncology/treatment-courses/{id}/treatment-plans"
    occ_field: "expected_course_version"
    description: |
      Creating a TreatmentPlan against a TreatmentCourse whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created an adaptation plan (which
      legitimately supersedes the prior plan and rewrites the course's
      planned-fraction accounting) and the current writer's view of the course
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-finalize-stale-claim
    parent_entity: BillingClaim
    write_endpoint: "POST /oncology/billing-claims/{id}/finalize"
    occ_field: "expected_claim_version"
    description: |
      Finalizing a BillingClaim whose version has advanced since the client
      last observed it is rejected. A prior finalize (or an auto-reopen that
      appended new charge lines) legitimately recomputes the claim's totals, so
      a writer holding an older observed version must re-read before
      finalizing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fraction_dose_allocation
    trigger: "plan creation; DOSE_PER_FRACTION_INCREASE compensation"
    algorithm: aggregation
    formula: |
      Given plan target_total_dose_cGy D and n remaining fractions:
        base = round_half_up(D / n)            # integer cGy
        dose(f_i) = base        for i = 1 .. n-1
        dose(f_n) = D - (n-1) * base           # remainder lands on the LAST fraction
      The plan's dose_per_fraction_cGy field stores `base`.
      For DOSE_PER_FRACTION_INCREASE on an ACTIVE plan:
        D' = plan.target_total_dose_cGy - dose already delivered under this plan
        n' = plan.planned_fractions - delivered-under-plan count
        allocation recomputed over (D', n') with the same rule.
      Rounding order is pinned: per-fraction round_half_up FIRST, remainder
      reconciled on the final fraction SECOND. Summing exact quotients and
      rounding once is FORBIDDEN (5005/4 must yield 1251,1251,1251,1252).
    input_set: "the TreatmentPlan's target_total_dose_cGy, planned_fractions, and DELIVERED sessions under this plan"
    constants: {}
    precision: "integer cGy, round_half_up"

  - name: bed_nominal
    trigger: "recomputed on every TreatmentCourse mutation and on read"
    algorithm: forward_looking
    formula: |
      d = course dose per fraction in Gy = dose_per_fraction_cGy / 100
      n = course.planned_fractions
      bed_nominal_gy = n * d * (1 + d / ALPHA_BETA_GY)
      No time/repopulation correction is applied in this variant.
    input_set: "course.planned_fractions and course.dose_per_fraction_cGy as currently stored"
    constants:
      ALPHA_BETA_GY: 10
    precision: "3 decimal places Gy, round_half_up"
    variants:
      - name: planned_baseline
        when: "always; this is the prescription-side variant"
        difference: "ignores delivery progress and elapsed time entirely"

  - name: bed_actual
    trigger: "recomputed on every TreatmentCourse mutation and on read"
    algorithm: chronological
    formula: |
      For each DELIVERED FractionSession i (in start_time order):
        d_i = session.dose_delivered_cGy / 100  (Gy)
        term_i = d_i * (1 + d_i / ALPHA_BETA_GY)
      T_actual = whole days between the earliest and latest DELIVERED session
                 start_time (0 when fewer than 2 sessions delivered)
      penalty = REPOPULATION_K_GY_PER_DAY * max(0, T_actual - REPOPULATION_KICKOFF_DAY)
      bed_actual_gy = sum(term_i) - penalty
      Floor at 0: if the result would be negative, bed_actual_gy = 0.000.
    input_set: "FractionSession rows of the course with status DELIVERED only (SCHEDULED / CANCELLED / NO_SHOW excluded)"
    constants:
      ALPHA_BETA_GY: 10
      REPOPULATION_K_GY_PER_DAY: 0.6
      REPOPULATION_KICKOFF_DAY: 28
    precision: "3 decimal places Gy, round_half_up"
    variants:
      - name: delivered_with_time_correction
        when: "always; this is the delivery-side variant"
        difference: "uses only delivered fractions and subtracts the repopulation penalty for courses spanning more than 28 days first-to-last fraction"

  - name: adaptation_weight_loss_trigger
    trigger: "POST /oncology/treatment-courses/{id}/adaptation-checks"
    algorithm: threshold
    formula: |
      weight_loss_pct = (baseline_weight_kg - current_weight_kg) / baseline_weight_kg * 100
      computed at full float precision; NO rounding before the comparison
      adaptation_required = (weight_loss_pct >= WEIGHT_LOSS_THRESHOLD_PCT) OR (physician_override == true)
      A current_weight_kg >= baseline_weight_kg yields weight_loss_pct <= 0 and never triggers.
    input_set: "course.baseline_weight_kg, input current_weight_kg, input physician_override"
    constants:
      WEIGHT_LOSS_THRESHOLD_PCT: 10.0
    precision: "threshold compared at >= 10.0 exactly (a 10.00% loss triggers)"

  - name: chart_review_gate
    trigger: "evaluated on every fraction delivery attempt"
    algorithm: threshold
    formula: |
      delivery permitted iff course.fractions_since_chart_review < CHART_REVIEW_FRACTION_LIMIT
      i.e. the (LIMIT)th delivery since the last PASS succeeds and arms the gate;
      the (LIMIT+1)th is rejected with ERR_CHART_REVIEW_OVERDUE.
      A ChartReview with outcome PASS resets fractions_since_chart_review to 0;
      outcome FAIL leaves it unchanged.
    input_set: "course.fractions_since_chart_review"
    constants:
      CHART_REVIEW_FRACTION_LIMIT: 5
    precision: "strict < comparison"

  - name: fraction_delivery_pricing
    trigger: "charge-line generation on fraction delivery"
    algorithm: tiered_pricing
    formula: |
      FRACTION_DELIVERY unit = FRACTION_DELIVERY_RATE_CENTS[course.technique]
      IGRT line added iff session.igrt_planned == true (IGRT_FEE_CENTS)
      FIRST_FRACTION_SETUP line added iff session.is_first_fraction == true (FIRST_FRACTION_SETUP_FEE_CENTS)
      Three interacting inputs (technique tier, igrt flag, first-fraction flag)
      select the line set; quantity is always 1 per line.
    input_set: "course.technique, session.igrt_planned, session.is_first_fraction"
    constants:
      FRACTION_DELIVERY_RATE_CENTS: { THREE_DCRT: 18000, IMRT: 32000, SBRT: 55000 }
      IGRT_FEE_CENTS: 7500
      FIRST_FRACTION_SETUP_FEE_CENTS: 12000
    precision: "integer cents"

  - name: planning_charge
    trigger: "charge-line generation when a plan reaches APPROVED_FOR_DELIVERY"
    algorithm: tiered_pricing
    formula: |
      t = number of target volumes on the plan's pinned contour set
      multiplier = 1 + PLANNING_EXTRA_TARGET_FACTOR * (t - 1)
      full = PLANNING_BASE_CENTS[course.technique] * multiplier
      amount = round_half_up(full)                    # initial plan (supersedes_plan_id null)
      amount = round_half_up(full * ADAPTATION_PLANNING_FACTOR)   # adaptation plan
    input_set: "course.technique, contour_set.target_volumes length, plan.supersedes_plan_id"
    constants:
      PLANNING_BASE_CENTS: { THREE_DCRT: 90000, IMRT: 210000, SBRT: 300000 }
      PLANNING_EXTRA_TARGET_FACTOR: 0.25
      ADAPTATION_PLANNING_FACTOR: 0.5
    precision: "integer cents, round_half_up applied once at the end"

  - name: billing_provisional_total
    trigger: "recomputed whenever the claim is read or its lines change; valid in any claim status"
    algorithm: forward_looking
    formula: |
      incurred = sum of amount_cents over the claim's existing ChargeLines
      remaining = course.planned_fractions - course.delivered_fractions
      projected = max(0, remaining) * FRACTION_DELIVERY_RATE_CENTS[course.technique]
      provisional_total_cents = incurred + projected
      Projection uses the bare delivery rate only: no IGRT, setup, or no-show
      projection, and no discount. Delivered NO_SHOW sessions are NOT subtracted
      from `remaining` (only DELIVERED count reduces it).
    input_set: "claim ChargeLines, course.planned_fractions, course.delivered_fractions, course.technique"
    constants: {}
    precision: "integer cents"
    variants:
      - name: forward_looking_estimate
        when: "DRAFT and FINALIZED alike"
        difference: "includes projected delivery charges for undelivered planned fractions; final_total_cents never includes projections"

  - name: claim_discount
    trigger: "POST /oncology/billing-claims/{id}/finalize"
    algorithm: waterfall_allocation
    formula: |
      Pinned evaluation order (resolves the total <-> discount dependency):
        1. gross_total_cents = sum of amount_cents over ALL ChargeLines
        2. tier_check uses gross_total_cents: discount applies iff gross_total_cents > DISCOUNT_TIER_THRESHOLD_CENTS
        3. discount_base = sum of amount_cents over lines with code in {FRACTION_DELIVERY, IGRT} only
        4. discount_cents = round_half_up(DISCOUNT_RATE * discount_base)  (0 when the tier is not met)
        5. final_total_cents = gross_total_cents - discount_cents
      One-time lines (SIMULATION, PLANNING, PHYSICS_CHECK, FIRST_FRACTION_SETUP,
      NO_SHOW_FEE) are never discounted.
    input_set: "the claim's ChargeLines at finalize time"
    constants:
      DISCOUNT_TIER_THRESHOLD_CENTS: 1500000
      DISCOUNT_RATE: 0.05
    precision: "integer cents, round_half_up for the discount"

  - name: linac_slot_overlap
    trigger: "evaluated when a FractionSession is created"
    algorithm: interval_merge
    formula: |
      A new session [s, e) on a LINAC conflicts with an existing SCHEDULED or
      DELIVERED session [s2, e2) on the SAME machine iff:
          s < e2 + TURNOVER and s2 < e + TURNOVER
      where TURNOVER = LINAC_TURNOVER_MINUTES minutes.
      Back-to-back is NOT permitted on a LINAC: e == s2 conflicts because
      s2 < e + TURNOVER and s < e2 + TURNOVER both hold.
      CANCELLED and NO_SHOW sessions do not occupy the machine.
    input_set: "FractionSession rows on the same machine with status in {SCHEDULED, DELIVERED}"
    constants:
      LINAC_TURNOVER_MINUTES: 10
    precision: "minute-granularity half-open intervals augmented by the turnover buffer"

  - name: simulator_slot_overlap
    trigger: "evaluated when a SimulationAppointment is created"
    algorithm: interval_merge
    formula: |
      A new appointment [s, e) on a CT_SIMULATOR conflicts with an existing
      SCHEDULED appointment [s2, e2) on the SAME simulator iff:
          s < e2 AND s2 < e
      Pure half-open adjacency: e == s2 is ALLOWED (no turnover buffer).
      Additionally, aggregate daily capacity: a simulator accepts at most
      SIM_DAILY_CAPACITY appointments with status SCHEDULED or COMPLETED whose
      start_time falls on the same UTC calendar date; the (capacity+1)th
      booking on that date is rejected with ERR_SIMULATOR_DAILY_CAPACITY.
      CANCELLED and NO_SHOW appointments occupy neither the interval nor the
      daily count.
    input_set: "SimulationAppointment rows on the same machine with status in {SCHEDULED, COMPLETED}"
    constants:
      SIM_DAILY_CAPACITY: 8
    precision: "half-open intervals; capacity counted per UTC calendar date"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be one of the seven declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every id in the path exists, validated left-to-right; body-referenced ids (machine_id, contour_set_id, plan_id, supersedes_plan_id) must also exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: existence
    check: "Request schema: required fields present, types correct, enum values in domain, end_time strictly after start_time, numeric ranges (dose > 0, fractions > 0, missed_count >= 1, weight > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: state
    check: "OCC: expected_course_version / expected_claim_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST treatment-plans; POST billing-claims/{id}/finalize"
  - priority: 6
    category: state
    check: "Target resource state precondition for the operation (course status gate, plan DRAFT / check-pending, session SCHEDULED, claim DRAFT/FINALIZED, interruption OPEN, contour SUBMITTED, simulation SCHEDULED, terminal-course lockout, plan-creation course state)"
    error_id: "ERR_COURSE_NOT_ON_TREATMENT | ERR_COURSE_TERMINAL | ERR_OPEN_SESSIONS_EXIST | ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_AWAITING_CHECK | ERR_PLAN_NOT_REVISABLE | ERR_SESSION_NOT_SCHEDULED | ERR_SIMULATION_NOT_SCHEDULED | ERR_CONTOUR_NOT_SUBMITTED | ERR_CONTOUR_NOT_SUBMITTABLE | ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_FINALIZED | ERR_INTERRUPTION_NOT_OPEN | ERR_MACHINE_ALREADY_DOWN | ERR_MACHINE_NOT_DOWN | ERR_COURSE_NOT_TERMINAL | ERR_COURSE_NOT_PLANNING | ERR_COURSE_NOT_ADAPTING"
    http_status: 409
    applies_to: "action endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: contour approver/returner != creator; physics checker != plan.planner_id; SECOND checker != primary_checker_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST contour-sets/{id}/approve, /return; POST treatment-plans/{id}/physics-checks"
  - priority: 8
    category: business_safety
    check: "Chart-review gate: fractions_since_chart_review < CHART_REVIEW_FRACTION_LIMIT"
    error_id: ERR_CHART_REVIEW_OVERDUE
    http_status: 409
    applies_to: "POST fraction-sessions/{id}/deliver"
  - priority: 9
    category: business_safety
    check: "Dose constraints: at least one constraint exists and every constraint satisfied before plan submission"
    error_id: "ERR_NO_DOSE_CONSTRAINTS | ERR_DOSE_CONSTRAINT_VIOLATION"
    http_status: 422
    applies_to: "POST treatment-plans/{id}/submit-for-check"
  - priority: 10
    category: business_referential
    check: "Cross-references must belong to the same course: plan_id on fraction booking, contour_set_id on plan creation; supersedes_plan_id must reference the highest plan_version plan of the course; contour set APPROVED and pinned version current"
    error_id: "ERR_PLAN_COURSE_MISMATCH | ERR_CONTOUR_NOT_APPROVED | ERR_SUPERSEDES_NOT_LATEST | ERR_REMAINING_DOSE_MISMATCH | ERR_STALE_CONTOUR_SET"
    http_status: 422
    applies_to: "POST fraction-sessions; POST treatment-plans; POST submit-for-check"
  - priority: 11
    category: business_constraint
    check: "Machine constraints: referenced machine OPERATIONAL for new bookings and deliveries; machine_type matches usage (CT_SIMULATOR for simulations, LINAC for fractions); SBRT courses require THERMOPLASTIC_MASK or BODY_FRAME immobilization; weekend bookings require weekend_makeup_allowance > 0; single open claim per course; patient mrn uniqueness"
    error_id: "ERR_MACHINE_NOT_OPERATIONAL | ERR_MACHINE_TYPE_MISMATCH | ERR_IMMOBILIZATION_REQUIRED | ERR_WEEKEND_NOT_PERMITTED | ERR_CLAIM_ALREADY_OPEN | ERR_NO_REMAINING_FRACTIONS | ERR_DUPLICATE_MRN"
    http_status: 422
    applies_to: "booking, delivery, claim, patient, and plan endpoints"
  - priority: 12
    category: business_temporal
    check: "Interval occupation: LINAC turnover-buffered overlap; simulator half-open overlap"
    error_id: "ERR_MACHINE_SLOT_CONFLICT | ERR_SIMULATOR_SLOT_CONFLICT"
    http_status: 409
    applies_to: "POST fraction-sessions; POST simulation-appointments"
  - priority: 13
    category: business_fiscal
    check: "Capacity and fiscal: scheduled+delivered sessions for the plan < plan.planned_fractions; simulator daily capacity; claim non-empty at finalize"
    error_id: "ERR_FRACTION_COUNT_EXCEEDED | ERR_SIMULATOR_DAILY_CAPACITY | ERR_EMPTY_CLAIM"
    http_status: 422
    applies_to: "POST fraction-sessions; POST simulation-appointments; POST billing-claims/{id}/finalize"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Patients ---
  - { method: POST, path: "/oncology/patients", description: "Register a patient", roles: [Scheduler], code: 201, input: [mrn, full_name, date_of_birth], output: Patient, side_effects: [] }
  - { method: GET, path: "/oncology/patients", description: "List patients (paginated)", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "Patient[]", side_effects: [] }
  - { method: GET, path: "/oncology/patients/{id}", description: "Get a patient", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: Patient, side_effects: [] }

  # --- Treatment Courses ---
  - { method: POST, path: "/oncology/patients/{id}/treatment-courses", description: "Open a treatment course (prescription)", roles: [RadiationOncologist], code: 201, input: [diagnosis_code, intent, technique, prescribed_total_dose_cGy, planned_fractions], output: TreatmentCourse, side_effects: ["status CONSULT; dose_per_fraction_cGy computed; delivered counters 0"] }
  - { method: GET, path: "/oncology/patients/{id}/treatment-courses", description: "List a patient's courses", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "TreatmentCourse[]", side_effects: [] }
  - { method: GET, path: "/oncology/treatment-courses/{id}", description: "Get a course (includes computed BED fields)", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: TreatmentCourse, side_effects: [] }
  - { method: POST, path: "/oncology/treatment-courses/{id}/complete", description: "Complete a course", roles: [RadiationOncologist], code: 200, input: [], output: TreatmentCourse, side_effects: ["ACTIVE plan -> COMPLETED"] }
  - { method: POST, path: "/oncology/treatment-courses/{id}/discontinue", description: "Discontinue a course", roles: [RadiationOncologist], code: 200, input: [reason], output: TreatmentCourse, side_effects: ["cancel scheduled appointments/sessions; supersede non-terminal plans; FINALIZED claim auto-DRAFT"] }
  - { method: POST, path: "/oncology/treatment-courses/{id}/adaptation-checks", description: "Evaluate adaptation trigger (weight loss >= 10.0% or physician override)", roles: [RadiationOncologist], code: 200, input: [current_weight_kg, "physician_override?"], output: TreatmentCourse, side_effects: ["on trigger: course ON_TREATMENT -> ADAPTATION_REQUIRED; ACTIVE plan SUPERSEDED; its SCHEDULED sessions CANCELLED(ADAPTATION); FINALIZED claim auto-DRAFT"] }

  # --- Simulation Appointments ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/simulation-appointments", description: "Book a simulation slot with immobilization device", roles: [Scheduler], code: 201, input: [machine_id, start_time, end_time, immobilization_device, "purpose?"], output: SimulationAppointment, side_effects: ["first booking: course CONSULT -> SIMULATION_SCHEDULED"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/simulation-appointments", description: "List a course's simulation appointments", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "SimulationAppointment[]", side_effects: [] }
  - { method: POST, path: "/oncology/simulation-appointments/{id}/complete", description: "Complete a simulation; records patient weight", roles: [RadiationTherapist], code: 200, input: [patient_weight_kg], output: SimulationAppointment, side_effects: ["course -> SIMULATED and baseline_weight_kg set on first completion; SIMULATION charge line appended to DRAFT claim if one exists"] }
  - { method: POST, path: "/oncology/simulation-appointments/{id}/cancel", description: "Cancel a simulation appointment", roles: [Scheduler], code: 200, input: [], output: SimulationAppointment, side_effects: [] }
  - { method: POST, path: "/oncology/simulation-appointments/{id}/mark-no-show", description: "Mark a simulation no-show", roles: [RadiationTherapist], code: 200, input: [], output: SimulationAppointment, side_effects: [] }

  # --- Contour Sets ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/contour-sets", description: "Create a contour set", roles: [RadiationOncologist], code: 201, input: [set_label, target_volumes, oar_structures], output: ContourSet, side_effects: ["first contour set: course SIMULATED -> CONTOURING; created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/contour-sets", description: "List a course's contour sets", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "ContourSet[]", side_effects: [] }
  - { method: GET, path: "/oncology/contour-sets/{id}", description: "Get a contour set", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: ContourSet, side_effects: [] }
  - { method: POST, path: "/oncology/contour-sets/{id}/submit", description: "Submit contours for review (from DRAFT or RETURNED)", roles: [RadiationOncologist], code: 200, input: [], output: ContourSet, side_effects: [] }
  - { method: POST, path: "/oncology/contour-sets/{id}/approve", description: "Approve contours (must be a different oncologist than the creator)", roles: [RadiationOncologist], code: 200, input: [], output: ContourSet, side_effects: ["course CONTOURING -> PLANNING; reviewed_by_user_id := X-User-ID"] }
  - { method: POST, path: "/oncology/contour-sets/{id}/return", description: "Return contours for rework (must be a different oncologist than the creator)", roles: [RadiationOncologist], code: 200, input: [return_notes], output: ContourSet, side_effects: [] }

  # --- Treatment Plans ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/treatment-plans", description: "Create a treatment plan (initial or adaptation via supersedes_plan_id)", roles: [MedicalDosimetrist], code: 201, input: [contour_set_id, target_total_dose_cGy, planned_fractions, "supersedes_plan_id?", expected_course_version], output: TreatmentPlan, side_effects: ["plan_version assigned; planner_id := X-User-ID; pinned_contour_version := contour.version; adaptation: course ADAPTATION_REQUIRED -> REPLANNING and course.planned_fractions := delivered_fractions + plan.planned_fractions; increments TreatmentCourse.version by 1"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/treatment-plans", description: "List a course's plans", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "TreatmentPlan[]", side_effects: [] }
  - { method: GET, path: "/oncology/treatment-plans/{id}", description: "Get a plan", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: TreatmentPlan, side_effects: [] }
  - { method: GET, path: "/oncology/treatment-plans/{id}/successors", description: "List plans whose supersedes_plan_id is this plan", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: "TreatmentPlan[]", side_effects: [] }
  - { method: GET, path: "/oncology/contour-sets/{id}/treatment-plans", description: "List plans built on this contour set", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: "TreatmentPlan[]", side_effects: [] }
  - { method: GET, path: "/oncology/treatment-plans/{id}/fraction-sessions", description: "List fraction sessions scheduled under this plan", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: "FractionSession[]", side_effects: [] }
  - { method: POST, path: "/oncology/treatment-plans/{id}/dose-constraints", description: "Add a dose constraint (plan must be DRAFT)", roles: [MedicalDosimetrist], code: 201, input: [structure_name, constraint_type, limit_cGy, evaluated_value_cGy], output: DoseConstraint, side_effects: [] }
  - { method: GET, path: "/oncology/treatment-plans/{id}/dose-constraints", description: "List a plan's dose constraints", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "DoseConstraint[]", side_effects: [] }
  - { method: POST, path: "/oncology/treatment-plans/{id}/submit-for-check", description: "Submit plan for physics check", roles: [MedicalDosimetrist], code: 200, input: [], output: TreatmentPlan, side_effects: ["course PLANNING/REPLANNING -> PHYSICS_REVIEW"] }
  - { method: POST, path: "/oncology/treatment-plans/{id}/revise", description: "Return a CHECK_FAILED plan to DRAFT for revision", roles: [MedicalDosimetrist], code: 200, input: [], output: TreatmentPlan, side_effects: [] }
  - { method: POST, path: "/oncology/treatment-plans/{id}/physics-checks", description: "Record a physics check (PRIMARY then SECOND; segregation of duties enforced)", roles: [MedicalPhysicist], code: 201, input: [check_type, outcome, "notes?"], output: PhysicsCheck, side_effects: ["plan state transition per outcome; checker ids recorded; PHYSICS_CHECK and (on second PASS) PLANNING charge lines appended to DRAFT claim if one exists"] }
  - { method: GET, path: "/oncology/treatment-plans/{id}/physics-checks", description: "List a plan's physics checks", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: "PhysicsCheck[]", side_effects: [] }

  # --- Fraction Sessions ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/fraction-sessions", description: "Book a fraction on a LINAC", roles: [Scheduler], code: 201, input: [plan_id, machine_id, start_time, end_time, "igrt_planned?"], output: FractionSession, side_effects: ["fraction_number assigned; weekend booking decrements weekend_makeup_allowance"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/fraction-sessions", description: "List a course's fraction sessions", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?", "status?"], output: "FractionSession[]", side_effects: [] }
  - { method: POST, path: "/oncology/fraction-sessions/{id}/deliver", description: "Deliver a fraction (chart gate, machine, and plan checks enforced)", roles: [RadiationTherapist], code: 200, input: [], output: FractionSession, side_effects: ["dose recorded; course counters incremented; first delivery flips course ON_TREATMENT and plan ACTIVE; charge lines appended (auto-reopening a FINALIZED claim)"] }
  - { method: POST, path: "/oncology/fraction-sessions/{id}/cancel", description: "Cancel a scheduled fraction", roles: [Scheduler], code: 200, input: [reason], output: FractionSession, side_effects: ["cancellation_reason recorded"] }
  - { method: POST, path: "/oncology/fraction-sessions/{id}/mark-no-show", description: "Mark a fraction no-show (bills the no-show fee)", roles: [RadiationTherapist], code: 200, input: [], output: FractionSession, side_effects: ["NO_SHOW_FEE charge line appended to DRAFT claim if one exists (auto-reopening a FINALIZED claim)"] }

  # --- Machines ---
  - { method: POST, path: "/oncology/machines", description: "Register a treatment machine", roles: [SystemAdmin], code: 201, input: [name, machine_type, room], output: TreatmentMachine, side_effects: ["status OPERATIONAL"] }
  - { method: GET, path: "/oncology/machines", description: "List machines", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "TreatmentMachine[]", side_effects: [] }
  - { method: GET, path: "/oncology/machines/{id}", description: "Get a machine", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: TreatmentMachine, side_effects: [] }
  - { method: PUT, path: "/oncology/machines/{id}/status", description: "Set machine status; DOWN cascades future scheduled fractions into cancellations and interruptions", roles: [SystemAdmin], code: 200, input: [status], output: TreatmentMachine, side_effects: ["DOWN: future SCHEDULED fractions CANCELLED(MACHINE_DOWN); per-course MACHINE_DOWN interruption created OPEN; open_interruption_count incremented"] }
  - { method: GET, path: "/oncology/machines/{id}/fraction-sessions", description: "List a machine's fraction sessions (schedule view)", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "FractionSession[]", side_effects: [] }
  - { method: GET, path: "/oncology/machines/{id}/simulation-appointments", description: "List a simulator's appointments (schedule view)", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "SimulationAppointment[]", side_effects: [] }

  # --- Interruptions ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/interruptions", description: "Record a treatment interruption", roles: [RadiationOncologist, RadiationTherapist], code: 201, input: [reason, missed_count, start_date, end_date], output: TreatmentInterruption, side_effects: ["course.open_interruption_count += 1; gap_days computed"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/interruptions", description: "List a course's interruptions", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "TreatmentInterruption[]", side_effects: [] }
  - { method: POST, path: "/oncology/interruptions/{id}/compensate", description: "Apply a compensation strategy to an OPEN interruption", roles: [RadiationOncologist], code: 200, input: [strategy], output: TreatmentInterruption, side_effects: ["strategy side effects per state machine; open_interruption_count -= 1"] }

  # --- Chart Reviews ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/chart-reviews", description: "Record a chart-round peer review", roles: [MedicalPhysicist], code: 201, input: [outcome, "notes?"], output: ChartReview, side_effects: ["PASS resets course.fractions_since_chart_review to 0; FAIL leaves it unchanged"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/chart-reviews", description: "List a course's chart reviews", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: "ChartReview[]", side_effects: [] }

  # --- Billing ---
  - { method: POST, path: "/oncology/treatment-courses/{id}/billing-claims", description: "Open a billing claim; backfills charge lines for billable events that already occurred", roles: [BillingCoordinator], code: 201, input: [], output: BillingClaim, side_effects: ["charge lines backfilled; gross/provisional totals computed"] }
  - { method: GET, path: "/oncology/treatment-courses/{id}/billing-claims", description: "List a course's claims", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "BillingClaim[]", side_effects: [] }
  - { method: GET, path: "/oncology/billing-claims/{id}", description: "Get a claim", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: [], output: BillingClaim, side_effects: [] }
  - { method: GET, path: "/oncology/billing-claims/{id}/charge-lines", description: "List a claim's charge lines", roles: [RadiationOncologist, MedicalDosimetrist, MedicalPhysicist, RadiationTherapist, Scheduler, BillingCoordinator, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "ChargeLine[]", side_effects: [] }
  - { method: POST, path: "/oncology/billing-claims/{id}/finalize", description: "Finalize a claim (OCC-guarded; computes gross/discount/final)", roles: [BillingCoordinator], code: 200, input: [expected_claim_version], output: BillingClaim, side_effects: ["claim_discount computed; increments BillingClaim.version by 1"] }
  - { method: POST, path: "/oncology/billing-claims/{id}/submit", description: "Submit a finalized claim (requires terminal course)", roles: [BillingCoordinator], code: 200, input: [], output: BillingClaim, side_effects: [] }
  - { method: POST, path: "/oncology/billing-claims/{id}/reopen", description: "Reopen a finalized claim; monetary fields retained verbatim", roles: [BillingCoordinator], code: 200, input: [], output: BillingClaim, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/oncology/_clock/set_current_utc", description: "Set the server's logical clock (ISO 8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time. Used by the machine-down cascade to decide which SCHEDULED sessions are future.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the seven declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role lacks permission for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum value, end_time <= start_time, non-positive dose/fractions/weight, missed_count < 1" }
  - { id: ERR_DUPLICATE_MRN, http: 422, condition: "A patient with the same mrn already exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_COURSE_NOT_ON_TREATMENT, http: 409, condition: "Operation requires course ON_TREATMENT (deliver, adaptation-check, compensate); complete also requires ON_TREATMENT" }
  - { id: ERR_COURSE_TERMINAL, http: 409, condition: "Operation attempted on a COMPLETED or DISCONTINUED course" }
  - { id: ERR_COURSE_NOT_TERMINAL, http: 409, condition: "Claim submission requires course COMPLETED or DISCONTINUED" }
  - { id: ERR_COURSE_NOT_PLANNING, http: 409, condition: "Initial plan creation requires course PLANNING" }
  - { id: ERR_COURSE_NOT_ADAPTING, http: 409, condition: "Adaptation plan creation (supersedes_plan_id set) requires course ADAPTATION_REQUIRED" }
  - { id: ERR_OPEN_SESSIONS_EXIST, http: 409, condition: "Course completion blocked: FractionSession rows still SCHEDULED" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Dose-constraint creation and submit-for-check require plan DRAFT" }
  - { id: ERR_PLAN_NOT_AWAITING_CHECK, http: 409, condition: "Physics check type does not match plan state: PRIMARY requires PENDING_PRIMARY_CHECK, SECOND requires PENDING_SECOND_CHECK" }
  - { id: ERR_PLAN_NOT_REVISABLE, http: 409, condition: "revise requires plan CHECK_FAILED" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "Deliver/cancel/no-show require session SCHEDULED" }
  - { id: ERR_SIMULATION_NOT_SCHEDULED, http: 409, condition: "Complete/cancel/no-show require appointment SCHEDULED" }
  - { id: ERR_CONTOUR_NOT_SUBMITTED, http: 409, condition: "Approve/return require contour SUBMITTED" }
  - { id: ERR_CONTOUR_NOT_SUBMITTABLE, http: 409, condition: "Submit requires contour DRAFT or RETURNED" }
  - { id: ERR_CLAIM_NOT_DRAFT, http: 409, condition: "Finalize requires claim DRAFT" }
  - { id: ERR_CLAIM_NOT_FINALIZED, http: 409, condition: "Reopen/submit require claim FINALIZED" }
  - { id: ERR_INTERRUPTION_NOT_OPEN, http: 409, condition: "Compensate requires interruption OPEN" }
  - { id: ERR_MACHINE_ALREADY_DOWN, http: 409, condition: "Machine already DOWN" }
  - { id: ERR_MACHINE_NOT_DOWN, http: 409, condition: "Restore requires machine DOWN" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator may not perform both sides of a segregated step (contour create vs approve; plan vs primary check; primary vs second check)" }
  - { id: ERR_CHART_REVIEW_OVERDUE, http: 409, condition: "fractions_since_chart_review has reached CHART_REVIEW_FRACTION_LIMIT (5); a PASS chart review is required before further delivery" }
  - { id: ERR_NO_DOSE_CONSTRAINTS, http: 422, condition: "Submit-for-check requires at least one dose constraint" }
  - { id: ERR_DOSE_CONSTRAINT_VIOLATION, http: 422, condition: "A dose constraint has evaluated_value_cGy > limit_cGy" }
  - { id: ERR_PLAN_COURSE_MISMATCH, http: 422, condition: "plan_id does not belong to the course in the path" }
  - { id: ERR_CONTOUR_NOT_APPROVED, http: 422, condition: "contour_set_id is not APPROVED or belongs to another course" }
  - { id: ERR_SUPERSEDES_NOT_LATEST, http: 422, condition: "supersedes_plan_id is not the highest plan_version plan of the course" }
  - { id: ERR_REMAINING_DOSE_MISMATCH, http: 422, condition: "Initial plan target must equal prescribed_total_dose_cGy; adaptation plan target must equal prescribed minus delivered_dose_cGy" }
  - { id: ERR_STALE_CONTOUR_SET, http: 409, condition: "Contour set version no longer equals plan.pinned_contour_version (contours were returned/resubmitted after plan creation)" }
  - { id: ERR_MACHINE_NOT_OPERATIONAL, http: 422, condition: "Machine is DOWN; booking and delivery require OPERATIONAL" }
  - { id: ERR_MACHINE_TYPE_MISMATCH, http: 422, condition: "Simulation requires CT_SIMULATOR; fraction delivery requires LINAC" }
  - { id: ERR_IMMOBILIZATION_REQUIRED, http: 422, condition: "SBRT courses require THERMOPLASTIC_MASK or BODY_FRAME immobilization" }
  - { id: ERR_WEEKEND_NOT_PERMITTED, http: 422, condition: "Saturday/Sunday fraction booking requires weekend_makeup_allowance > 0" }
  - { id: ERR_CLAIM_ALREADY_OPEN, http: 422, condition: "Course already has a claim in DRAFT or FINALIZED status" }
  - { id: ERR_NO_REMAINING_FRACTIONS, http: 422, condition: "DOSE_PER_FRACTION_INCREASE requires undelivered fractions remaining on the ACTIVE plan" }
  - { id: ERR_MACHINE_SLOT_CONFLICT, http: 409, condition: "LINAC booking collides with an existing session within the 10-minute turnover buffer" }
  - { id: ERR_SIMULATOR_SLOT_CONFLICT, http: 409, condition: "Simulator booking overlaps an existing SCHEDULED appointment (half-open adjacency allowed)" }
  - { id: ERR_FRACTION_COUNT_EXCEEDED, http: 422, condition: "Booking would exceed plan.planned_fractions (SCHEDULED + DELIVERED already at the plan limit)" }
  - { id: ERR_SIMULATOR_DAILY_CAPACITY, http: 422, condition: "Simulator already has 8 booked/completed appointments on that UTC date" }
  - { id: ERR_EMPTY_CLAIM, http: 422, condition: "Finalize requires at least one charge line" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RadiationOncologist
    description: "Attending physician: prescribes courses, contours, approves peer contours, triggers adaptation, compensates interruptions, completes/discontinues courses"
    identity: opaque
    exclusive_operations:
      - "POST /oncology/patients/{id}/treatment-courses"
      - "POST /oncology/treatment-courses/{id}/complete"
      - "POST /oncology/treatment-courses/{id}/discontinue"
      - "POST /oncology/treatment-courses/{id}/adaptation-checks"
      - "POST /oncology/treatment-courses/{id}/contour-sets"
      - "POST /oncology/contour-sets/{id}/submit"
      - "POST /oncology/contour-sets/{id}/approve"
      - "POST /oncology/contour-sets/{id}/return"
