        claim_type: violation_to_error
        grounds: [state_machines.Quote.ISSUED_to_EXPIRED, "errors[ERR_QUOTE_EXPIRED]", "validations[priority=7]"]
        distinguishing_aspect: "Expiry boundary is inclusive: an action at exactly expires_at transitions the quote to EXPIRED and returns ERR_QUOTE_EXPIRED; one second before, approve succeeds."
        test_recipe:
          setup: ["two customers, two ROs each with an ISSUED labor-only quote (issued at default clock 2026-08-01T00:00:00Z, expires_at 2026-08-15T00:00:00Z)"]
          setup_api_calls:
