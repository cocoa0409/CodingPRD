  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_double_booking_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.ClassSession.fields.instructor_id
        distinguishing_aspect: "Instructor overlap uses half-open interval semantics [start,end): a second session whose [start,end) intersects an existing one on the SAME instructor (any room) is rejected; adjacency (new.start == old.end) is allowed. Distinct resource (Instructor) and distinct interval treatment from the room buffer rule."
        test_recipe:
          setup:
            - "Instructor I teaches session in room R1 from 18:00-19:00; a new session in room R2 from 18:30-19:30 overlaps I."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
