            - "trigger call 1 returns 409 ERR_COVERAGE_WINDOW_OVERLAP: the candidate [2027-07-01, 2028-07-01) straddles the retained [2026-08-01, 2027-08-01)"
            - "after trigger call 1: Certification.${c2}.status is still SUBMITTED with activated_at null and fee_charged_cents 0"
