  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "Missing X-User-Role header -> ERR_UNAUTHENTICATED (401) on any endpoint; priority 1 precedes existence checks (a bogus id with no auth still yields 401, not 404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fof/programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (auth beats not-found)"

      - name: error_active_plan_exists
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACTIVE_PLAN_EXISTS]", "validations[priority=20]"]
        distinguishing_aspect: "Approving a second DRAFT plan while one is APPROVED -> ERR_ACTIVE_PLAN_EXISTS; after supersede, the new plan holds APPROVED and a further approve attempt fails again."
        test_recipe:
          setup: ["Program open; plan A APPROVED; plan B DRAFT"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
