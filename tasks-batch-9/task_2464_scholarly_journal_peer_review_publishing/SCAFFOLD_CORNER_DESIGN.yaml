      - name: editor_assignment_with_a_stale_manuscript_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[manuscript]
          - errors[ERR_STALE_MANUSCRIPT_VERSION]
          - endpoints[POST /editor-assignments]
        distinguishing_aspect: |
          The manuscript OCC guard compares against the live version, and any editorial write bumps it: a
          version captured before an integrity screening is stale afterwards, so the assignment attempt
          returns 412 ERR_STALE_MANUSCRIPT_VERSION and creates nothing, while replaying it with the
          re-read version succeeds.
        test_recipe:
          setup:
            - "One journal with a chief editor, a handling editor, an author and one SUBMITTED manuscript."
            - "The manuscript's version is read first, and only then is a PLAGIARISM screening recorded, which bumps the version."
          setup_api_calls:
