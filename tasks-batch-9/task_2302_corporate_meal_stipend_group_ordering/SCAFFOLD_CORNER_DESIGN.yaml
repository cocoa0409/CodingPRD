          setup:
            - "Acme Corp program; Engineering group with an ACTIVE rule (cap 2500, daily_meal_limit 1, allocation 50000, weekdays 1-5, window 660-840, PERSONAL_CARD, EMPLOYEE_PAYS_TIP); HQ Lobby at (0,0); Thai Garden at (3,4) radius 10; Ada with a personal card; an OPEN 2026-08 period."
