  - section: errors
    instances:
      - name: unknown_ids_across_the_action_surface_return_their_own_not_found_codes
        claim_type: error_triggerability
        grounds:
          - validations[priority=4]
          - errors.ERR_NOTIFICATION_NOT_FOUND
          - errors.ERR_SCREENING_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_PLACEMENT_NOT_FOUND
          - errors.ERR_ENROLLMENT_NOT_FOUND
          - errors.ERR_PROPOSAL_NOT_FOUND
          - errors.ERR_VOTE_NOT_FOUND
        distinguishing_aspect: "Each path-templated family returns the 404 code that matches its own failing segment - eight different error_ids from eight endpoints - rather than a single generic 404, and the database is non-empty throughout so the failures are attributable to the ids."
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program and one youth exist, so every collection the triggers address is reachable and the YouthMember identity in the last call resolves to a real Youth"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { nfx_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Vera", legal_last_name: "Solano", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { nfx_youth_id: $.data.id }
          trigger:
            - call: "POST /ryhs/guardian-notifications/44444444-4444-4444-4444-444444444444/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { nfx_gn_err: $.data.error_id }
            - call: "POST /ryhs/safety-screenings/44444444-4444-4444-4444-444444444445/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { nfx_scr_err: $.data.error_id }
            - call: "GET /ryhs/reunification-cases/44444444-4444-4444-4444-444444444446"
              payload: {}
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { nfx_case_err: $.data.error_id }
            - call: "POST /ryhs/mediation-sessions/44444444-4444-4444-4444-444444444447/record-outcome"
              payload: { outcome: "PROGRESS" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { nfx_sess_err: $.data.error_id }
            - call: "GET /ryhs/tlp-placements/44444444-4444-4444-4444-444444444448"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { nfx_plc_err: $.data.error_id }
            - call: "POST /ryhs/education-enrollments/44444444-4444-4444-4444-444444444449/verify-records"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { nfx_enr_err: $.data.error_id }
            - call: "GET /ryhs/governance-proposals/44444444-4444-4444-4444-44444444444a"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { nfx_prop_err: $.data.error_id }
            - call: "POST /ryhs/governance-votes/44444444-4444-4444-4444-44444444444b/retract"
              payload: {}
              as: YouthMember
              as_user_id: "${nfx_youth_id}"
              captures: { nfx_vote_err: $.data.error_id }
          assert:
            - "the attempt call returns HTTP 404 with error_id ERR_NOTIFICATION_NOT_FOUND"
            - "the disposition call returns HTTP 404 with error_id ERR_SCREENING_NOT_FOUND"
            - "the case read returns HTTP 404 with error_id ERR_CASE_NOT_FOUND"
            - "the record-outcome call returns HTTP 404 with error_id ERR_SESSION_NOT_FOUND"
            - "the placement read returns HTTP 404 with error_id ERR_PLACEMENT_NOT_FOUND"
            - "the verify-records call returns HTTP 404 with error_id ERR_ENROLLMENT_NOT_FOUND"
            - "the proposal read returns HTTP 404 with error_id ERR_PROPOSAL_NOT_FOUND"
            - "the retract call returns HTTP 404 with error_id ERR_VOTE_NOT_FOUND, because the priority 3 ownership check cannot be evaluated against a row that does not exist and path resolution therefore wins"

      - name: extend_on_a_pending_screening_admission_returns_not_active
        claim_type: error_triggerability
        grounds:
          - validations[priority=9]
          - errors.ERR_ADMISSION_NOT_ACTIVE
        distinguishing_aspect: "PENDING_SCREENING is non-terminal but not operable for extend, so the request returns 409 ERR_ADMISSION_NOT_ACTIVE - not ERR_ADMISSION_ALREADY_TERMINAL, which priority 10 reserves for DISCHARGED and DENIED rows - and extension_count stays 0."
        test_recipe:
          setup:
            - "an OPEN EMERGENCY_SHELTER program and a youth with no screening, holding a PENDING_SCREENING admission with planned_discharge_at 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { nact_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Gus", legal_last_name: "Marchetti", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { nact_youth_id: $.data.id }
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${nact_youth_id}", program_id: "${nact_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { nact_adm_id: $.data.id }
          trigger:
            - call: "POST /ryhs/admissions/${nact_adm_id}/extend"
              payload: { new_planned_discharge_at: "2026-08-18T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { nact_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 409 with error_id ERR_ADMISSION_NOT_ACTIVE"
            - "the request does NOT return error_id ERR_ADMISSION_ALREADY_TERMINAL"
            - "Admission.${nact_adm_id}.status == PENDING_SCREENING"
            - "Admission.${nact_adm_id}.extension_count == 0"
            - "Admission.${nact_adm_id}.planned_discharge_at == 2026-08-15T00:00:00Z"

      - name: second_admission_at_the_same_program_returns_already_sheltered
        claim_type: error_triggerability
