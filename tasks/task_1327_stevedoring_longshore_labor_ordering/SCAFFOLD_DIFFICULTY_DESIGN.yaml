            - "GangOrder.${g}.status remains COMPLETED and required_headcount remains 1"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: overtime_accrues_above_480_not_at_480
        grounds:
          - calculations.payroll_gross_pay
          - validations[priority=9]
        distinguishing_aspect: |
          Metric: paid minutes at the OT breakpoint, reached via the timesheet-approve
          endpoint. Exactly 480 minutes yields ot_minutes == 0 and gross 32000
          (480 * 4000 / 60); 481 minutes yields ot_minutes == 1 and gross 32100
          ((480 + 1.5) * 4000 / 60). The boundary is strict-greater, not >=.
        test_recipe:
          setup:
            - "Vessel, DAY shift 08:00-16:00, gang G headcount 2 (no equipment) completed by W1 and W2"
            - "W1 timesheet 480 minutes meal taken; W2 timesheet 481 minutes meal taken; rate 4000 cents/hour"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Boundary", voyage_number: "B-201", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
