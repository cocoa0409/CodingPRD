# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2938 — Presort Mail Service Provider Operations
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# All asserted money / piece / index values are pre-computed literals derived
# from the §1.3 formulas over the fixture chain below.
#
# Canonical fixture arithmetic (reused across instances):
#   MARKETING_MAIL base = 32 c/piece; SCF-021 drop_ship_discount_bp = 300
#   Job A 1250 declared, 50 undeliverable -> accepted 1200, quality 98.80
#   Job B 1850 declared, 50 undeliverable -> accepted 1800, quality 98.92
#   Batch total 3000 -> THREE_DIGIT (bp 1500)
#     rate = floor(32*1000*8500*9700/1e8) = 26384 mills
#     batch_postage = round_half_up(3000*26384/1000) = 79152 c
#   Standalone (ship_bp 0, BASIC bp 800): rate = 29440 mills
#     Job A 35328 c, Job B 52992 c  (sum 88320 vs commingled 79152)
#   pro_rata(79152; 1200, 1800): floors 31660 / 47491, remainder 1 -> B
#     => A 31660, B 47492
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: standalone_versus_commingled_rate_divergence
        grounds:
          - calculations.commingled_postage_assessment
          - calculations.presort_tier_qualification
          - entities.CommingleBatch.fields.rate_mills_per_piece
          - entities.BatchMember.fields.allocated_postage_cents
          - state_machines.CommingleBatch.OPEN_to_SORTED
        distinguishing_aspect: |
          This instance lives in the postage-cost domain (MailJob pieces priced into
          CommingleBatch money): the job_standalone variant derives the tier from ONE
          job's accepted_piece_count with ship_bp forced to 0, while batch_commingled
          derives it from the pooled total with the entry facility's drop_ship_discount_bp
          — identical mail, 29440 mills versus 26384 mills.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "Clients ACME and BORE ACTIVE with commingle_opt_in true; each has an ACTIVE permit account whose annual fee is paid through 2027-01-31."
            - "EntryFacility SCF-021 is OPEN, type SCF, drop_ship_discount_bp 300, served_zip3_list [021, 022]."
            - "MailJob A (ACME) accepted_piece_count 1200 and MailJob B (BORE) accepted_piece_count 1800, both MARKETING_MAIL/LETTERS and both HYGIENE_CLEARED."
            - "Both jobs are pooled into one CommingleBatch destined for SCF-021, which is then sorted with two qualifying trays holding 1000 + 2000 = 3000 pieces."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Acme Direct", client_code: "ACME", service_fee_rate_per_thousand_cents: 900 }
              as: BureauAdmin
              captures: { cl_a_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Borealis Mailers", client_code: "BORE", service_fee_rate_per_thousand_cents: 2200 }
              as: BureauAdmin
              captures: { cl_b_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_a_id}", permit_number: "PI-100100", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_a_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_b_id}", permit_number: "PI-200200", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_b_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_a_id}", permit_account_id: "${pa_a_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_a_id: $.data.id }
            - call: "POST /mail-jobs/${job_a_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_b_id}", permit_account_id: "${pa_b_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1850, declared_weight_oz_per_piece: 1.1 }
              as: PresortOperator
              captures: { job_b_id: $.data.id }
            - call: "POST /mail-jobs/${job_b_id}/hygiene-runs"
              payload: { submitted_piece_count: 1850, cass_matched_count: 1830, ncoa_move_updated_count: 55, undeliverable_removed_count: 50, move_update_age_days: 20 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_a_id}" }
              as: PresortOperator
              captures: { mem_a_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_b_id}" }
              as: PresortOperator
              captures: { mem_b_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 1000 }
              as: PresortOperator
              captures: { cont_1_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "941", sort_level: "THREE_DIGIT", piece_count: 2000 }
              as: PresortOperator
              captures: { cont_2_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: PresortOperator
              captures: { batch_v1: $.data.version }
          trigger:
            - call: "GET /mail-jobs/${job_a_id}/postage-estimate"
              payload: {}
              as: PostageManager
            - call: "GET /mail-jobs/${job_b_id}/postage-estimate"
              payload: {}
              as: PostageManager
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PostageManager
            - call: "GET /commingle-batches/${batch_id}/members"
              payload: {}
              as: PostageManager
          assert:
            - "GET /mail-jobs/${job_a_id}/postage-estimate returns piece_count == 1200, standalone_tier == \"BASIC\", standalone_rate_mills_per_piece == 29440, standalone_postage_cents == 35328"
            - "GET /mail-jobs/${job_b_id}/postage-estimate returns piece_count == 1800, standalone_tier == \"BASIC\", standalone_rate_mills_per_piece == 29440, standalone_postage_cents == 52992"
            - "CommingleBatch.${batch_id}.achieved_tier == \"THREE_DIGIT\" and CommingleBatch.${batch_id}.rate_mills_per_piece == 26384 and CommingleBatch.${batch_id}.batch_postage_cents == 79152"
            - "BatchMember.${mem_a_id}.allocated_postage_cents == 31660 and BatchMember.${mem_b_id}.allocated_postage_cents == 47492"
            - "The two variants diverge on identical mail: 35328 + 52992 == 88320 standalone versus 79152 commingled, a 9168-cent difference"
            - "The rate is floored exactly once: 26384, not 26383 (which is what flooring after the 1500 bp tier factor and again after the 300 bp ship factor yields)"

      - name: zone_weighted_versus_piece_weighted_service_index
        grounds:
          - calculations.client_service_level_index
          - calculations.zone_and_service_commitment
          - entities.ServiceLevelRecord.fields.on_time
          - entities.SortContainer.fields.committed_days
        distinguishing_aspect: |
          This instance lives in the service-quality domain on Client, not in the money
          domain: over the SAME two delivery-scanned records the zone_weighted variant
          weights by ZONE_WEIGHT[zone] and yields 28.57, while the piece_weighted variant
          weights by piece_count and yields 33.33 — two different numbers from identical
          inputs, on a different entity and a different metric than the postage variants.
        test_recipe:
          setup:
            - "The canonical two-client, one-batch fixture is sorted, its statement is prepared, submitted and accepted clean, and the batch is deposited at SCF-021 with the clock at 2026-08-12T14:00:00.000Z."
            - "Deposit opened two ServiceLevelRecords: one from the 1000-piece FIVE_DIGIT tray to served ZIP3 021 (zone 2, committed_days 4) and one from the 2000-piece THREE_DIGIT tray to unserved ZIP3 941 (zone 8, committed_days 7)."
            - "The zone-2 record is scanned at 2 delivery days (on time) and the zone-8 record at 9 delivery days (late)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Acme Direct", client_code: "ACME", service_fee_rate_per_thousand_cents: 900 }
              as: BureauAdmin
              captures: { cl_a_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Borealis Mailers", client_code: "BORE", service_fee_rate_per_thousand_cents: 2200 }
              as: BureauAdmin
              captures: { cl_b_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Bureau House Account", client_code: "PSBUREAU", service_fee_rate_per_thousand_cents: 1, commingle_opt_in: false }
              as: BureauAdmin
              captures: { cl_h_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_a_id}", permit_number: "PI-100100", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_a_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_b_id}", permit_number: "PI-200200", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_b_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_h_id}", permit_number: "PI-900900", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_h_id: $.data.id, pa_h_v0: $.data.version }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_a_id}", permit_account_id: "${pa_a_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_a_id: $.data.id }
            - call: "POST /mail-jobs/${job_a_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_b_id}", permit_account_id: "${pa_b_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1850, declared_weight_oz_per_piece: 1.1 }
              as: PresortOperator
              captures: { job_b_id: $.data.id }
            - call: "POST /mail-jobs/${job_b_id}/hygiene-runs"
              payload: { submitted_piece_count: 1850, cass_matched_count: 1830, ncoa_move_updated_count: 55, undeliverable_removed_count: 50, move_update_age_days: 20 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_a_id}" }
              as: PresortOperator
              captures: { mem_a_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_b_id}" }
              as: PresortOperator
              captures: { mem_b_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 1000 }
              as: PresortOperator
              captures: { cont_1_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "941", sort_level: "THREE_DIGIT", piece_count: 2000 }
              as: PresortOperator
              captures: { cont_2_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: PresortOperator
              captures: { batch_v1: $.data.version }
            - call: "POST /permit-accounts/${pa_h_id}/funding"
              payload: { amount_cents: 200000, expected_permit_account_version: "${pa_h_v0}", reference: "WIRE-8811" }
              as: PostageManager
            - call: "POST /postage-statements"
              payload: { commingle_batch_id: "${batch_id}", permit_account_id: "${pa_h_id}", expected_batch_version: "${batch_v1}" }
              as: PostageManager
              as_user_id: "pm-001"
              captures: { stmt_id: $.data.id }
            - call: "POST /postage-statements/${stmt_id}/submit"
              payload: {}
              as: PostageManager
              as_user_id: "pm-001"
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T16:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { ship_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T14:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /drop-shipments/${ship_id}/depart"
              payload: {}
              as: PresortOperator
            - call: "POST /drop-shipments/${ship_id}/deposit"
              payload: {}
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "GET /sort-containers/${cont_1_id}/service-level-records"
              payload: {}
              as: AcceptanceClerk
              captures: { slr_1_id: "$.data[0].id" }
            - call: "GET /sort-containers/${cont_2_id}/service-level-records"
              payload: {}
              as: AcceptanceClerk
              captures: { slr_2_id: "$.data[0].id" }
            - call: "POST /service-level-records/${slr_1_id}/delivery-scan"
              payload: { actual_delivery_days: 2, scanned_at_utc: "2026-08-14T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "POST /service-level-records/${slr_2_id}/delivery-scan"
              payload: { actual_delivery_days: 9, scanned_at_utc: "2026-08-21T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
          trigger:
            - call: "GET /clients/${cl_a_id}/service-level"
              payload: {}
              as: PostageManager
            - call: "GET /clients/${cl_b_id}/service-level"
              payload: {}
              as: PostageManager
          assert:
            - "ServiceLevelRecord.${slr_1_id}.zone == 2, committed_days == 4, piece_count == 1000, on_time == true"
            - "ServiceLevelRecord.${slr_2_id}.zone == 8, committed_days == 7, piece_count == 2000, on_time == false"
            - "GET /clients/${cl_a_id}/service-level returns record_count == 2, on_time_count == 1, zone_weighted_index == 28.57, piece_weighted_index == 33.33"
            - "GET /clients/${cl_b_id}/service-level returns the same two indices 28.57 and 33.33, because both clients have mail in the same commingled batch"
            - "zone_weighted_index != piece_weighted_index for identical input records (2*100/7 = 28.57 versus 1000*100/3000 = 33.33)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a), (b), (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: invoice_service_fee_ceil_tier_and_floor_interaction
        grounds:
          - calculations.client_invoice_charges
          - entities.Client.fields.service_fee_rate_per_thousand_cents
          - entities.ClientInvoice.fields.service_fee_cents
          - entities.ClientInvoice.fields.total_cents
          - validations[priority=43]
        distinguishing_aspect: |
          MODE (a): three inputs — billed_piece_count (through a CEIL to thousands),
          the client's service_fee_rate_per_thousand_cents, and volume_discount_bp —
          interact non-linearly because the ceil precedes the tier factor and the
          MIN_SERVICE_FEE_CENTS floor is a MAX applied AFTER it. Two clients in the same
          piece band and the same thousands bucket land on opposite branches of that max:
          ACME's discounted fee 1800 loses to the 2500 floor while BORE's 4400 wins.
        test_recipe:
          setup:
            - "The canonical two-client, one-batch fixture is sorted, its statement accepted clean, and the batch deposited at 2026-08-12T14:00:00.000Z, so MailJob A (1200 pieces, allocated 31660 c) and MailJob B (1800 pieces, allocated 47492 c) are both MAILED."
            - "Client ACME has service_fee_rate_per_thousand_cents 900 and Client BORE has 2200."
            - "Neither client has any prior invoice, so no billing period is occupied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
