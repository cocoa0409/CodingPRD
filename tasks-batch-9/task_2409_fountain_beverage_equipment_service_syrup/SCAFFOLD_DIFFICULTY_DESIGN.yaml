              as: NetworkAdmin
              captures: { ag16: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o16}", agreement_id: "${ag16}", serial_number: "SN-TO-C-01", model_code: "FREESTYLE_9100", installed_at: "2026-02-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du16: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag16}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du16}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "ICE_FAULT" }
              as: NetworkAdmin
              captures: { sc16a: $.data.id }
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du16}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "OFF_RATIO" }
              as: NetworkAdmin
              captures: { sc16b: $.data.id }
            - call: "POST /fountain-network/service-calls/${sc16a}/dispatch"
              payload: { van_code: "V-99", scheduled_window_start: "2026-08-01T09:00:00Z", scheduled_window_end: "2026-08-01T11:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-040"
          trigger:
            - call: "POST /fountain-network/service-calls/${sc16b}/dispatch"
              payload: { van_code: "V-99", scheduled_window_start: "2026-08-01T11:30:00Z", scheduled_window_end: "2026-08-01T12:30:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-041"
              captures: { err16: $.data.error_id }
            - call: "POST /fountain-network/service-calls/${sc16b}/dispatch"
              payload: { van_code: "V-99", scheduled_window_start: "2026-08-01T11:31:00Z", scheduled_window_end: "2026-08-01T12:31:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-041"
              captures: { sc16b_status: $.data.status }
          assert:
            - "${err16} == ERR_VAN_WINDOW_CONFLICT with HTTP 409 — lo == 11:00 and the existing window ends at exactly 11:00, so the non-strict comparison conflicts"
            - "After trigger[0]: ServiceCall.${sc16b}.status == OPEN, van_code == null, scheduled_window_start == null, version == 1"
            - "After trigger[1]: ${sc16b_status} == DISPATCHED with van_code == V-99, scheduled_window_start == 2026-08-01T11:31:00Z, scheduled_window_end == 2026-08-01T12:31:00Z, assigned_tech_user_id == tech-041"
            - "After trigger[1]: ServiceCall.${sc16b}.version == 2 and reserved_part_stock_id == null"
            - "ServiceCall.${sc16a}.status == DISPATCHED with an unchanged 09:00-11:00 window"
            - "ServiceCall.${sc16a}.severity_score == 25 and severity == ROUTINE; ServiceCall.${sc16b}.severity_score == 40 and severity == ROUTINE"

  - rule_id: compensating_invariant
    instances:

      - name: van_parts_conserved_across_dispatch_escalate_redispatch_resolve
        grounds:
          - calculations.van_parts_ledger
          - entities.VanPartStock.fields.initial_units
          - entities.VanPartStock.fields.restocked_units
          - entities.VanPartStock.fields.consumed_units
          - state_machines.ServiceCall.ON_SITE_to_ESCALATED
          - state_machines.ServiceCall.ON_SITE_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity = physical service-part units on one van: on_van_units + reserved_units +
          consumed_units == initial_units + restocked_units == 8 holds after the restock, after a
          2-unit reservation, after the escalation that fully reverses it, after a 3-unit
          re-reservation and after a resolution that consumes 1 and returns 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R17 with one ACTIVE agreement and one IN_SERVICE unit."
            - "VanPartStock (V-12, PUMP_ASSY_12) created with on_van_units 5, then restocked by 3 → on_van_units 8, initial_units 5, restocked_units 3."
            - "One OPEN service call on the unit."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
