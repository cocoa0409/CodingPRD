            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "RESUME" }, as: Mechanic, as_user_id: "${mech_id}", captures: { ws2: $.data.work_status } }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "HOLD_PARTS" }, as: Mechanic, as_user_id: "${mech_id}", captures: { ws3: $.data.work_status } }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "RESUME" }, as: Mechanic, as_user_id: "${mech_id}", captures: { ws4: $.data.work_status, bs4: $.data.billing_status } }
          assert:
            - "work_status sequence: IN_SERVICE -> ON_HOLD_PARTS -> IN_SERVICE -> ON_HOLD_PARTS -> IN_SERVICE (cycle executed twice)"
            - "billing_status == ESTIMATED after every work_status transition (independent dimension untouched)"

      - name: invoice_dispute_reissue_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          Invoice (different entity from ServiceRequest) runs a revision loop
