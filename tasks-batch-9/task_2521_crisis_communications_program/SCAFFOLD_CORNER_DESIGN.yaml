            - call: "POST /crisis/post-crisis-reviews/${review_id}/score"
              payload: { scoring_method: "ADJUSTED", playbook_update_count: 9 }
              as: ExecSponsor
              as_user_id: "${exec_id}"
          assert:
            - "the first score returns status 200; PostCrisisReview.${review_id}.state == SCORED, scoring_method == RAW, reported_delta == -7.40, playbook_update_count == 3, scored_at == 2026-08-10T13:00:00Z"
            - "the second score returns status 409 with data.error_id ERR_REVIEW_STATE_INVALID"
            - "PostCrisisReview.${review_id}.scoring_method == RAW and playbook_update_count == 3 (the second body was discarded)"
            - "PostCrisisReview.${review_id}.reputation_delta_raw == -7.40 and reputation_delta_adjusted == -7.40 with exposure_factor 0.0000"
