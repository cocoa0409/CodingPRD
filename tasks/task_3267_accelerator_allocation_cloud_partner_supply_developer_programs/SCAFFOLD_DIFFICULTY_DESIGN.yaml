- rule_id: non_linear_state_machine
  instances:
  - name: partner_requalification_rejection_revert_cycle
    grounds:
    - state_machines.PartnerAccount.IN_VALIDATION_to_APPLIED
    - state_machines.PartnerAccount.IN_VALIDATION_to_QUALIFIED
    - state_machines.PartnerAccount.TERMINATED_to_APPLIED
    - entities.PartnerAccount.fields.qualification_attempt_count
    distinguishing_aspect: 'PartnerAccount is cyclic rather than a pipeline: the partner returns from

      IN_VALIDATION to APPLIED on rejection and re-enters the same

      qualification path, so qualification_attempt_count reaches 1 and a second

      round still ends QUALIFIED — a linear machine could not revisit APPLIED.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
