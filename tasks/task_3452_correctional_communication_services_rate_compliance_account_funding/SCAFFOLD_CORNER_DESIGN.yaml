      - name: call_missing_header_beats_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=5]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers AND a nonexistent account id reports the priority-1 header error (400), not the 404 — authentication precedes existence even though the path id is bogus."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /comm-services/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityStaff
              captures: { err: $.data.error_id }
          assert:
            - "when the same request is repeated with the headers stripped, the response is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "with valid headers the same path returns 404 ERR_ACCOUNT_NOT_FOUND (control)"

