      - name: predecessor_not_done_is_reported_instead_of_invalid_state
        claim_type: cascading_validation
        grounds:
          - validations[priority=24]
          - validations[priority=9]
          - errors[ERR_TASK_PREDECESSOR_NOT_DONE]
          - state_machines.TurnaroundTask.PENDING_to_READY
          - state_machines.TurnaroundTask.READY_to_DONE
        distinguishing_aspect: |
          Completing TK-B while TK-A is still READY returns 409 ERR_TASK_PREDECESSOR_NOT_DONE, not the
          priority-9 ERR_INVALID_STATE its PENDING status would otherwise imply: the dependency check is
          the one that speaks for a PENDING task inside an IN_PROGRESS outage. Completing TK-A then
          releases TK-B to READY, so the same call succeeds afterwards.
        test_recipe:
          setup:
            - "One plant, one train, one outage TA-1 over 2026-10-01 -> 2026-10-27 with TK-A (7 days, no predecessor) and TK-B (14 days, after TK-A); critical path 21 days fits the 26-day window."
            - "TA-1 is submitted, ENDORSED by so-reviewer, approved by so-approver, and started with the clock at 2026-10-01, so TK-A is READY and TK-B is PENDING."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-1", scope: "VESSEL_INSPECTION", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-27T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", task_code: "TK-A", duration_days: 7 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_a_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", predecessor_task_id: "${task_a_id}", task_code: "TK-B", duration_days: 14 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_b_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds/{id}/submit"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/{id}/psm-review"
              payload: { decision: "ENDORSED", findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "so-reviewer"
            - call: "POST /nitrogen-ops/turnarounds/{id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/turnarounds/{id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
          trigger:
            - call: "POST /nitrogen-ops/turnaround-tasks/{id}/complete"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnaround-tasks/{id}/complete"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "the first trigger call targets TK-B (${task_b_id}) and returns HTTP status 409"
            - "the first trigger call returns data.error_id == ERR_TASK_PREDECESSOR_NOT_DONE"
            - "TurnaroundTask.${task_b_id}.status == PENDING"
            - "Turnaround.${ta_id}.tasks_done_count == 0"
            - "the second trigger call targets TK-A (${task_a_id}) and returns HTTP status 200"
            - "TurnaroundTask.${task_a_id}.status == DONE"
            - "TurnaroundTask.${task_b_id}.status == READY"
            - "TurnaroundTask.${task_b_id}.earliest_start_day == 7"
            - "Turnaround.${ta_id}.tasks_done_count == 1"
            - "Turnaround.${ta_id}.critical_path_days == 21"
            - "ReformerTrain.${train_id}.status == DOWN_FOR_TURNAROUND"

      - name: issue_a_quote_after_its_expiry_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_QUOTE_EXPIRED]
          - entities.PriceQuote.fields.expires_at
          - endpoints[POST /nitrogen-ops/price-quotes/{id}/issue]
        distinguishing_aspect: |
          The clock, not a background job, decides expiry at issue time: with the logical clock moved to
          2026-08-11 a quote that expired 2026-08-10 is 409 ERR_QUOTE_EXPIRED, stays DRAFT, and has
          neither issued_at nor quoted_price_usd_per_ton written.
        test_recipe:
          setup:
            - "One plant with a non-regulated UREA product line and one DRAFT quote QT-1 expiring 2026-08-10."
            - "The logical clock is then advanced to 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes"
              payload: { plant_id: "${plant_id}", product_line_id: "${line_id}", quote_code: "QT-1", tons: 6000, pass_through_basis: "SPOT_INDEX", expires_at: "2026-08-10T00:00:00Z" }
              as: CommercialManager
              captures: { quote_id: $.data.id }
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "POST /nitrogen-ops/price-quotes/{id}/issue"
              payload: {}
              as: CommercialManager
          assert:
            - "the trigger call returns HTTP status 409"
            - "the trigger call returns data.error_id == ERR_QUOTE_EXPIRED"
            - "PriceQuote.${quote_id}.status == DRAFT"
            - "PriceQuote.${quote_id}.issued_at == null"
            - "PriceQuote.${quote_id}.quoted_price_usd_per_ton == null"
            - "PriceQuote.${quote_id}.gas_basis_usd_per_mmbtu == null"

      - name: produce_reports_the_run_state_error_before_the_tonnage_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=28]
          - errors[ERR_RUN_NOT_COMPLETED]
          - errors[ERR_PRODUCED_EXCEEDS_RESERVED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / run_not_completed_outranks_produced_exceeds_reserved_on_produce
          rationale: "Both rules are violated by one produce call there and the priority-9 error is asserted as the response, with the priority-28 error asserted to appear only after the run is completed."

      - name: order_create_reports_the_security_error_before_the_product_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=16]
          - validations[priority=18]
          - errors[ERR_SECURITY_CLASS_INSUFFICIENT]
          - errors[ERR_PRODUCT_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / security_class_insufficient_outranks_product_mismatch_on_order_create
          rationale: "That instance violates priority 16 and priority 18 with a single create and asserts the 403 from the lower-numbered rule."

      - name: overlapping_bookings_are_judged_as_an_aggregate
        claim_type: aggregate_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_STORAGE_AVAILABILITY_EXCEEDED]
          - calculations.storage_position
        excluded_because:
          difficulty_instance: resource_temporal_overlap / storage_outbound_bookings_overlap_only_within_available_tonnage
          rationale: "Individually-legal bookings whose overlapping peak exceeds the available tonnage are exactly what that instance asserts."

      - name: a_new_run_window_must_not_conflict_with_a_live_one
        claim_type: temporal_validation
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_RUN_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / run_windows_may_touch_but_may_not_overlap_on_one_train
          rationale: "Half-open run windows that touch versus overlap are asserted there, and the closed-interval turnaround buffer is asserted in its sibling instance."

      - name: run_approval_depends_on_another_entity_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_CATALYST_ACTIVITY_TOO_LOW]
          - entities.CatalystCharge.fields.activity_pct
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_approval_blocked_by_low_activity_charge_on_same_train
          rationale: "Approval is asserted to succeed and then fail purely on the catalyst charge's activity_pct, with the run itself unchanged."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: hedge_lot_crud_triple_returns_one_identical_representation
        claim_type: standard_crud
        grounds:
          - endpoints[POST /nitrogen-ops/gas-hedge-lots]
          - endpoints[GET /nitrogen-ops/gas-hedge-lots/{id}]
          - endpoints[GET /nitrogen-ops/gas-hedge-lots]
          - response_envelope
        distinguishing_aspect: |
          The create response, the single read and the list row are the same representation: identical
          id, identical derived consumed_mmbtu / remaining_mmbtu / status, and the list is wrapped in the
          paginated envelope (items, total_count, limit, offset, has_more) while the two single reads are
          wrapped in the bare data envelope.
        test_recipe:
          setup:
            - "One plant and no hedge lots."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-1", mmbtu_volume: 200000.0, strike_price_usd_per_mmbtu: 3.1000, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot_id: $.data.id }
            - call: "GET /nitrogen-ops/gas-hedge-lots/{id}"
              payload: {}
              as: ProcessEngineer
            - call: "GET /nitrogen-ops/gas-hedge-lots?plant_id=${plant_id}"
              payload: {}
              as: ProcessEngineer
          assert:
            - "the first trigger call returns HTTP status 201"
            - "GasHedgeLot.${lot_id}.consumed_mmbtu == 0"
            - "GasHedgeLot.${lot_id}.remaining_mmbtu == 200000.0"
            - "GasHedgeLot.${lot_id}.status == OPEN"
            - "GasHedgeLot.${lot_id}.version == 1"
            - "the second trigger call returns HTTP status 200 and data.id == ${lot_id}"
            - "the second trigger call returns data.remaining_mmbtu == 200000.0 and data.strike_price_usd_per_mmbtu == 3.1000"
            - "the third trigger call returns HTTP status 200, data.total_count == 1, data.limit == 50, data.offset == 0 and data.has_more == false"
            - "the third trigger call returns data.items[0].id == ${lot_id} and data.items[0].remaining_mmbtu == 200000.0"

      - name: turnaround_reject_is_an_action_endpoint_with_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /nitrogen-ops/turnarounds/{id}/reject]
          - state_machines.Turnaround.SUBMITTED_to_REJECTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / turnaround_reject_arm_voids_review_and_blocks_task_graph
          rationale: "That instance calls the reject arm and asserts its full side-effect set — rejection_reason, psm_review_decision VOID and every task BLOCKED."

      - name: expire_due_sweeps_only_the_quotes_the_clock_has_passed
        claim_type: bulk_action
        grounds:
          - endpoints[POST /nitrogen-ops/price-quotes/expire-due]
          - state_machines.PriceQuote.ISSUED_to_EXPIRED
          - entities.PriceQuote.fields.expires_at
        distinguishing_aspect: |
          One bulk call classifies a whole collection: with the clock at 2026-08-11 the sweep expires the
          quote that lapsed on 2026-08-10 and leaves the one lapsing 2026-09-30 ISSUED, returning
          expired_count 1 and exactly one id. A second identical call returns expired_count 0 and an
          empty id list, so the sweep does not re-count what it already moved.
        test_recipe:
          setup:
            - "One plant with a non-regulated UREA line and two ISSUED quotes: QT-1 expiring 2026-08-10 and QT-2 expiring 2026-09-30, both issued with the clock at its 2026-08-01 default."
            - "The clock is then advanced to 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes"
              payload: { plant_id: "${plant_id}", product_line_id: "${line_id}", quote_code: "QT-1", tons: 6000, pass_through_basis: "SPOT_INDEX", expires_at: "2026-08-10T00:00:00Z" }
              as: CommercialManager
              captures: { q1_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes/{id}/issue"
              payload: {}
              as: CommercialManager
            - call: "POST /nitrogen-ops/price-quotes"
              payload: { plant_id: "${plant_id}", product_line_id: "${line_id}", quote_code: "QT-2", tons: 6000, pass_through_basis: "SPOT_INDEX", expires_at: "2026-09-30T00:00:00Z" }
              as: CommercialManager
              captures: { q2_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes/{id}/issue"
              payload: {}
              as: CommercialManager
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "POST /nitrogen-ops/price-quotes/expire-due"
              payload: {}
              as: CommercialManager
            - call: "POST /nitrogen-ops/price-quotes/expire-due"
              payload: {}
              as: CommercialManager
          assert:
            - "the first trigger call returns HTTP status 200"
            - "the first trigger call returns data.expired_count == 1"
            - "the first trigger call returns data.expired_quote_ids == [${q1_id}]"
            - "PriceQuote.${q1_id}.status == EXPIRED"
            - "PriceQuote.${q1_id}.version == 3"
            - "PriceQuote.${q2_id}.status == ISSUED"
            - "PriceQuote.${q2_id}.version == 2"
            - "the second trigger call returns HTTP status 200, data.expired_count == 0 and data.expired_quote_ids == []"
            - "PriceQuote.${q1_id}.version == 3"

      - name: shipment_carries_the_production_order_it_moves
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /nitrogen-ops/shipments]
          - endpoints[GET /nitrogen-ops/shipments]
          - entities.Shipment.fields.production_order_id
        distinguishing_aspect: |
          The optional production_order_id is stored as given and is a usable list filter: filtering on
          the linked order returns the shipment, and the same shipment is absent from the result set for
          a second order on the same run — the link is per-row, not per-run.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge, one APPROVED run PR-1 (target 5000) and a non-regulated UREA line."
            - "Two UREA assets: tank UT-1 (capacity 20000, origin) and terminal UT-2 (capacity 20000, destination)."
            - "Two orders on PR-1: PO-1 and PO-2, both UNALLOCATED."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-1", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-2", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${line_id}", destination_asset_id: "${origin_id}", order_code: "PO-1", requested_tons: 1000 }
              as: CommercialManager
              captures: { order1_id: $.data.id }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${line_id}", destination_asset_id: "${origin_id}", order_code: "PO-2", requested_tons: 1000 }
              as: CommercialManager
              captures: { order2_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", production_order_id: "${order1_id}", shipment_code: "SH-1", mode: "TRUCK", tons: 20, distance_miles: 50, window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-21T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { shipment_id: $.data.id }
            - call: "GET /nitrogen-ops/shipments?production_order_id=${order1_id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /nitrogen-ops/shipments?production_order_id=${order2_id}"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "the first trigger call returns HTTP status 201"
            - "Shipment.${shipment_id}.production_order_id == ${order1_id}"
            - "Shipment.${shipment_id}.status == DRAFT"
            - "Shipment.${shipment_id}.base_freight_usd == null"
            - "the second trigger call returns data.total_count == 1 and data.items[0].id == ${shipment_id}"
            - "the third trigger call returns data.total_count == 0 and data.items == []"

      - name: storage_asset_read_recomputes_its_whole_position
        claim_type: computed_read
        grounds:
          - endpoints[GET /nitrogen-ops/storage-assets/{id}]
          - calculations.storage_position
        excluded_because:
          difficulty_instance: transitive_cascade / outage_start_cascades_five_levels_to_storage_position
          rationale: "The end of that cascade is a storage read asserting every derived position field, which is exactly the computed-read contract."

      - name: run_reopen_is_rejected_once_one_of_its_orders_is_consumed
        claim_type: conditional_action
        grounds:
          - endpoints[POST /nitrogen-ops/production-runs/{id}/reopen]
          - errors[ERR_ORDER_ALREADY_PRODUCED]
          - entities.ProductionOrder.fields.allocation_status
        distinguishing_aspect: |
          The same reopen call on two structurally identical COMPLETED runs goes two ways: the run whose
          order is still RESERVED reopens to RUNNING with its settlement cleared and the catalyst hours
          given back, while the run whose order reached CONSUMED is 409 ERR_ORDER_ALREADY_PRODUCED and
          keeps its FINAL unit cost. The gate is a child's allocation_status, not the run's own state.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge of design_life_hours 40000, and a non-regulated UREA line (0.58 ammonia tons per ton) with a 20000-ton UREA tank."
            - "Two runs on RT-1 with touching windows: PR-1 over 2026-09-01 -> 2026-09-11 and PR-2 over 2026-09-11 -> 2026-09-21, each target_ammonia_tons 5000."
            - "PO-1 on PR-1 and PO-2 on PR-2, each reserving 1000 tons (580.000 ammonia tons)."
            - "Both runs are approved by eng-approver, started, and completed with actual_ammonia_tons 5000 and actual_operating_hours 240 each; PO-1 is then produced for 1000 tons, PO-2 is left RESERVED."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-1", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { tank_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run1_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
              captures: { run1_ver: $.data.version }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run1_id}", product_line_id: "${line_id}", destination_asset_id: "${tank_id}", order_code: "PO-1", requested_tons: 1000 }
              as: CommercialManager
              captures: { order1_id: $.data.id }
            - call: "POST /nitrogen-ops/production-orders/{id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run1_ver}" }
              as: CommercialManager
            - call: "POST /nitrogen-ops/production-runs/{id}/start"
              payload: {}
              as: ProcessEngineer
            - call: "POST /nitrogen-ops/production-runs/{id}/complete"
              payload: { actual_ammonia_tons: 5000, actual_operating_hours: 240 }
              as: ProcessEngineer
            - call: "POST /nitrogen-ops/production-orders/{id}/produce"
              payload: { produced_tons: 1000 }
              as: ProcessEngineer
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-2", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-21T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run2_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
              captures: { run2_ver: $.data.version }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run2_id}", product_line_id: "${line_id}", destination_asset_id: "${tank_id}", order_code: "PO-2", requested_tons: 1000 }
              as: CommercialManager
              captures: { order2_id: $.data.id }
            - call: "POST /nitrogen-ops/production-orders/{id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run2_ver}" }
              as: CommercialManager
            - call: "POST /nitrogen-ops/production-runs/{id}/start"
              payload: {}
              as: ProcessEngineer
            - call: "POST /nitrogen-ops/production-runs/{id}/complete"
              payload: { actual_ammonia_tons: 5000, actual_operating_hours: 240 }
              as: ProcessEngineer
          trigger:
            - call: "POST /nitrogen-ops/production-runs/{id}/reopen"
              payload: { reopen_reason: "RESTATE_METERING" }
              as: ProcessEngineer
            - call: "POST /nitrogen-ops/production-runs/{id}/reopen"
              payload: { reopen_reason: "RESTATE_METERING" }
              as: ProcessEngineer
          assert:
            - "the first trigger call targets PR-2 (${run2_id}) and returns HTTP status 200"
            - "ProductionRun.${run2_id}.status == RUNNING"
            - "ProductionRun.${run2_id}.actual_ammonia_tons == null"
            - "ProductionRun.${run2_id}.actual_operating_hours == null"
            - "ProductionRun.${run2_id}.final_unit_cost_usd_per_ton == null"
            - "ProductionRun.${run2_id}.reopen_reason == RESTATE_METERING"
            - "ProductionRun.${run2_id}.unallocated_ammonia_tons == 4420.000"
            - "ProductionOrder.${order2_id}.allocation_status == RESERVED"
            - "CatalystCharge.${charge_id}.cumulative_operating_hours == 240"
            - "CatalystCharge.${charge_id}.activity_pct == 99.40"
            - "the second trigger call targets PR-1 (${run1_id}) and returns HTTP status 409"
            - "the second trigger call returns data.error_id == ERR_ORDER_ALREADY_PRODUCED"
            - "ProductionRun.${run1_id}.status == COMPLETED"
            - "ProductionRun.${run1_id}.actual_ammonia_tons == 5000"
            - "ProductionRun.${run1_id}.final_unit_cost_usd_per_ton == 181.10"
            - "ProductionRun.${run1_id}.reopen_reason == null"
            - "ProductionOrder.${order1_id}.allocation_status == CONSUMED"
            - "StorageAsset.${tank_id}.on_hand_tons == 1000.000"

  # ===========================================================================
  - section: errors
    instances:
      - name: unknown_ids_are_not_found_on_every_child_resource
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CATALYST_CHARGE_NOT_FOUND]
          - errors[ERR_HEDGE_LOT_NOT_FOUND]
          - errors[ERR_PRODUCT_LINE_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_STORAGE_ASSET_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_QUOTE_NOT_FOUND]
          - errors[ERR_TURNAROUND_NOT_FOUND]
          - errors[ERR_TASK_NOT_FOUND]
          - errors[ERR_EMISSIONS_READING_NOT_FOUND]
        distinguishing_aspect: |
          Each resource family reports its own 404 code rather than a shared generic one: eleven reads of
          the same syntactically valid but unknown UUID against eleven different collections return eleven
          distinct error_id values, all at HTTP 404.
        test_recipe:
          setup:
            - "An empty database except for the mandatory startup clock default; the id 00000000-0000-4000-8000-0000000000ff is used for every read and belongs to no row."
          setup_api_calls: []
          trigger:
            - call: "GET /nitrogen-ops/catalyst-charges/{id}"
              payload: {}
              as: ProcessEngineer
            - call: "GET /nitrogen-ops/gas-hedge-lots/{id}"
              payload: {}
              as: CommercialManager
            - call: "GET /nitrogen-ops/product-lines/{id}"
              payload: {}
              as: CommercialManager
            - call: "GET /nitrogen-ops/production-runs/{id}"
              payload: {}
              as: ProcessEngineer
            - call: "GET /nitrogen-ops/production-orders/{id}"
              payload: {}
              as: CommercialManager
            - call: "GET /nitrogen-ops/storage-assets/{id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /nitrogen-ops/shipments/{id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /nitrogen-ops/price-quotes/{id}"
              payload: {}
              as: CommercialManager
            - call: "GET /nitrogen-ops/turnarounds/{id}"
              payload: {}
              as: SafetyOfficer
            - call: "GET /nitrogen-ops/turnaround-tasks/{id}"
              payload: {}
              as: SafetyOfficer
            - call: "GET /nitrogen-ops/emissions-readings/{id}"
              payload: {}
              as: RegulatoryAdmin
          assert:
            - "every trigger call returns HTTP status 404"
            - "the catalyst-charges read returns data.error_id == ERR_CATALYST_CHARGE_NOT_FOUND"
            - "the gas-hedge-lots read returns data.error_id == ERR_HEDGE_LOT_NOT_FOUND"
            - "the product-lines read returns data.error_id == ERR_PRODUCT_LINE_NOT_FOUND"
            - "the production-runs read returns data.error_id == ERR_RUN_NOT_FOUND"
            - "the production-orders read returns data.error_id == ERR_ORDER_NOT_FOUND"
            - "the storage-assets read returns data.error_id == ERR_STORAGE_ASSET_NOT_FOUND"
            - "the shipments read returns data.error_id == ERR_SHIPMENT_NOT_FOUND"
            - "the price-quotes read returns data.error_id == ERR_QUOTE_NOT_FOUND"
            - "the turnarounds read returns data.error_id == ERR_TURNAROUND_NOT_FOUND"
            - "the turnaround-tasks read returns data.error_id == ERR_TASK_NOT_FOUND"
            - "the emissions-readings read returns data.error_id == ERR_EMISSIONS_READING_NOT_FOUND"

      - name: an_empty_x_user_id_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          An X-User-ID header that is present but empty (the zero-length string, not a whitespace run) is
          401 ERR_UNAUTHENTICATED on a plain list read, so authentication is judged before role
          permission and before any resource lookup.
        test_recipe:
          setup:
            - "No fixtures are needed; the read would otherwise succeed for this role."
          setup_api_calls: []
          trigger:
            - call: "GET /nitrogen-ops/plants"
              payload: {}
              as: RegulatoryAdmin
              as_user_id: ""
          assert:
            - "the trigger call returns HTTP status 401"
            - "the trigger call returns data.error_id == ERR_UNAUTHENTICATED"
            - "the response body carries no items key"

      - name: an_undeclared_role_header_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNKNOWN_ROLE]
          - validations[priority=2]
          - roles
        distinguishing_aspect: |
          A syntactically well-formed role name that is not one of the six declared roles is 401
          ERR_UNKNOWN_ROLE, not 403 ERR_ROLE_NOT_PERMITTED: an unrecognised role is an authentication
          failure, while a recognised role doing something it may not do is an authorisation failure.
        test_recipe:
          setup:
            - "No fixtures are needed."
          setup_api_calls: []
          trigger:
            - call: "GET /nitrogen-ops/plants"
              payload: {}
              as: PlantJanitor
              as_user_id: "janitor-1"
          assert:
            - "the trigger call returns HTTP status 401"
            - "the trigger call returns data.error_id == ERR_UNKNOWN_ROLE"

      - name: an_emissions_reading_ahead_of_the_clock_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EMISSIONS_READING_IN_FUTURE]
          - validations[priority=21]
          - endpoints[POST /nitrogen-ops/emissions-readings]
        distinguishing_aspect: |
          With the clock at its 2026-08-01 startup default a reading stamped 2026-09-01 is 422
          ERR_EMISSIONS_READING_IN_FUTURE and nothing is ingested: the plant's rolling aggregate, its
          exceeded_pollutants list and its version are all unchanged.
        test_recipe:
          setup:
            - "One plant with permit_limit_tons_30d 12.00 and no readings; the clock is left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "NOX", rate_lb_per_hour: 5.0, interval_hours: 24, reading_at: "2026-09-01T00:00:00Z" }
              as: RegulatoryAdmin
          assert:
            - "the trigger call returns HTTP status 422"
            - "the trigger call returns data.error_id == ERR_EMISSIONS_READING_IN_FUTURE"
            - "GET /nitrogen-ops/emissions-readings?plant_id=${plant_id} returns total_count == 0"
            - "Plant.${plant_id}.exceeded_pollutants == []"
            - "Plant.${plant_id}.operating_posture == NORMAL"
            - "Plant.${plant_id}.version == 1"

      - name: a_predecessor_in_another_outage_is_rejected_as_a_cycle
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TASK_CYCLE_DETECTED]
          - validations[priority=22]
          - endpoints[POST /nitrogen-ops/turnaround-tasks]
        distinguishing_aspect: |
          The dependency graph is confined to one outage: naming a task of TA-2 as the predecessor of a
          task in TA-1 is 409 ERR_TASK_CYCLE_DETECTED even though no cycle exists in either graph, and
          TA-1's task counters and critical path stay where they were.
        test_recipe:
          setup:
            - "One plant with two trains, one DRAFT outage per train: TA-1 on RT-1 with task TK-A1 (7 days) and TA-2 on RT-2 with task TK-B1 (5 days)."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train1_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-2", rated_ammonia_tpd: 900 }
              as: ProcessEngineer
              captures: { train2_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train1_id}", turnaround_code: "TA-1", scope: "VESSEL_INSPECTION", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-27T00:00:00Z" }
              as: ProcessEngineer
              captures: { ta1_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train2_id}", turnaround_code: "TA-2", scope: "CATALYST_CHANGE", window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-27T00:00:00Z" }
              as: ProcessEngineer
              captures: { ta2_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta1_id}", task_code: "TK-A1", duration_days: 7 }
              as: ProcessEngineer
              captures: { task_a1_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta2_id}", task_code: "TK-B1", duration_days: 5 }
              as: ProcessEngineer
              captures: { task_b1_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta1_id}", predecessor_task_id: "${task_b1_id}", task_code: "TK-A2", duration_days: 3 }
              as: ProcessEngineer
          assert:
            - "the trigger call returns HTTP status 409"
            - "the trigger call returns data.error_id == ERR_TASK_CYCLE_DETECTED"
            - "Turnaround.${ta1_id}.tasks_total_count == 1"
            - "Turnaround.${ta1_id}.critical_path_days == 7"
            - "Turnaround.${ta2_id}.tasks_total_count == 1"
            - "GET /nitrogen-ops/turnaround-tasks?turnaround_id=${ta1_id} returns total_count == 1"

      - name: scheduling_a_run_on_a_train_in_outage_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRAIN_UNAVAILABLE]
          - validations[priority=14]
          - state_machines.ReformerTrain.IDLE_to_DOWN_FOR_TURNAROUND
        distinguishing_aspect: |
          Once the outage is started the train is DOWN_FOR_TURNAROUND and even a campaign scheduled two
          months clear of the outage window is 409 ERR_TRAIN_UNAVAILABLE — the availability gate reads the
          train's present status, not the proposed window, so it fires ahead of the buffer-conflict rule.
        test_recipe:
          setup:
            - "One plant and one train RT-1 whose outage TA-1 (2026-10-01 -> 2026-10-27, one 7-day task) has been submitted, ENDORSED, approved and started with the clock at 2026-10-01, leaving RT-1 DOWN_FOR_TURNAROUND."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-1", scope: "VESSEL_INSPECTION", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-27T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", task_code: "TK-A", duration_days: 7 }
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/{id}/submit"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/{id}/psm-review"
              payload: { decision: "ENDORSED", findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "so-reviewer"
            - call: "POST /nitrogen-ops/turnarounds/{id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/turnarounds/{id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
          trigger:
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-12-01T00:00:00Z", window_end: "2026-12-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "the trigger call returns HTTP status 409"
            - "the trigger call returns data.error_id == ERR_TRAIN_UNAVAILABLE"
            - "ReformerTrain.${train_id}.status == DOWN_FOR_TURNAROUND"
            - "GET /nitrogen-ops/production-runs?train_id=${train_id} returns total_count == 0"

      - name: producing_a_regulated_order_before_clearance_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SECURITY_CHECK_NOT_CLEARED]
          - validations[priority=17]
          - endpoints[POST /nitrogen-ops/production-orders/{id}/security-check]
          - endpoints[POST /nitrogen-ops/production-orders/{id}/produce]
        distinguishing_aspect: |
          A regulated order can be reserved and its run settled while security_status is still PENDING —
          only produce is gated. The first produce is 409 ERR_SECURITY_CHECK_NOT_CLEARED with nothing
          written to the dome; after a SafetyOfficer other than the author records CLEARED, the identical
          produce succeeds and the tons land.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge, a REGULATED AMMONIUM_NITRATE line (0.213 ammonia tons per ton) and a CONTROLLED 20000-ton AMMONIUM_NITRATE dome."
            - "Run PR-1 (target 5000) is approved by eng-approver; order PO-1 for 1000 tons is created (security_status PENDING), reserved for 1000 tons, and PR-1 is started and completed with actual_ammonia_tons 5000 and actual_operating_hours 240."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "AMMONIUM_NITRATE", ammonia_tons_per_product_ton: 0.213, conversion_cost_usd_per_ton: 46.255, regulated: true, priority_rank: 2 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "AN-DOME-1", asset_kind: "DOME", product_code: "AMMONIUM_NITRATE", capacity_tons: 20000, security_class: "CONTROLLED", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dome_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
              captures: { run_ver: $.data.version }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${line_id}", destination_asset_id: "${dome_id}", order_code: "PO-1", requested_tons: 1000 }
              as: CommercialManager
              as_user_id: "cm-author"
              captures: { order_id: $.data.id }
            - call: "POST /nitrogen-ops/production-orders/{id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run_ver}" }
              as: CommercialManager
              as_user_id: "cm-author"
            - call: "POST /nitrogen-ops/production-runs/{id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/production-runs/{id}/complete"
              payload: { actual_ammonia_tons: 5000, actual_operating_hours: 240 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          trigger:
            - call: "POST /nitrogen-ops/production-orders/{id}/produce"
              payload: { produced_tons: 1000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/production-orders/{id}/security-check"
              payload: { decision: "CLEARED" }
              as: SafetyOfficer
              as_user_id: "so-clearer"
            - call: "POST /nitrogen-ops/production-orders/{id}/produce"
              payload: { produced_tons: 1000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "the first trigger call returns HTTP status 409"
            - "the first trigger call returns data.error_id == ERR_SECURITY_CHECK_NOT_CLEARED"
            - "ProductionOrder.${order_id}.allocation_status == RESERVED"
            - "ProductionOrder.${order_id}.produced_tons == null"
            - "StorageAsset.${dome_id}.on_hand_tons == 0.000"
            - "the second trigger call returns HTTP status 200 and ProductionOrder.${order_id}.security_status == CLEARED"
            - "ProductionOrder.${order_id}.security_checked_by_user_id == so-clearer"
            - "the third trigger call returns HTTP status 200"
            - "ProductionOrder.${order_id}.allocation_status == CONSUMED"
            - "ProductionOrder.${order_id}.produced_tons == 1000"
            - "StorageAsset.${dome_id}.on_hand_tons == 1000.000"

      - name: outage_approval_reports_its_two_window_errors
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TURNAROUND_BUFFER_CONFLICT]
          - errors[ERR_OUTAGE_WINDOW_TOO_SHORT]
          - endpoints[POST /nitrogen-ops/turnarounds/{id}/approve]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / turnaround_buffer_conflict_outranks_outage_window_too_short_on_approve
          rationale: "Both codes are triggered there — the buffer conflict as the reported error while both rules are violated, and the window-too-short error once the buffer conflict is removed."

      - name: a_frozen_plant_blocks_the_commercial_write
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLANT_FROZEN]
          - validations[priority=10]
          - entities.Plant.fields.operating_posture
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / shipment_booking_blocked_by_frozen_plant_posture
          rationale: "That instance books the shipment successfully, degrades the plant to FROZEN through emissions ingestion, and asserts the identical booking then returns ERR_PLANT_FROZEN."

  # ===========================================================================
  - section: rbac
    instances:
      - name: each_opaque_role_performs_its_own_exclusive_write
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.RegulatoryAdmin.exclusive_operations
          - roles.ProcessEngineer.exclusive_operations
          - roles.SafetyOfficer.exclusive_operations
          - roles.CommercialManager.exclusive_operations
          - roles.LogisticsCoordinator.exclusive_operations
        distinguishing_aspect: |
          Five writes, one per opaque role, each on that role's own exclusive operation, all succeed with
          no cross-role borrowing: the permit authority registers the plant, the engineer registers the
          train, the safety officer moves the PSM standing, the commercial manager opens the product line
          and the logistics coordinator registers the tank.
        test_recipe:
          setup:
            - "An empty database; each call in the trigger list is made by the role that owns it."
          setup_api_calls: []
          trigger:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
