                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-FLAG", description: "certified flagger roster", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s28_id: $.data.id }
            - call: "POST /procurement/solicitations/${c_s28_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
