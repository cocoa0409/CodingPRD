    roles: [ClinicAdmin, Clinician, FrontDeskAgent]
    code: 200
    input: ["visit_id?", "destination_kind?", "status?", "limit?", "offset?"]
    output: VisitSummary[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog (62 codes — every one triggerable by a declared endpoint)
# =============================================================================
errors:
  # --- authentication / authorization
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Id or X-User-Role header missing, empty, or not one of the five declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the caller's role is not in the endpoint's roles list, or an entity_backed role's X-User-Id does not resolve to a row of its backing entity" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "the caller is not the owner the operation requires — a patient reading another patient's visit, a clinician submitting another clinician's assessment, a physician acting on a review they do not own, or a clinician calling next without an ACTIVE assignment at that clinic" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the physician attesting a ChartReview is the same physician who cosigned its Assessment" }

  # --- request shape
  - { id: ERR_VALIDATION, http: 400, condition: "unknown field, missing required field, wrong type, invalid enum member, negative amount, limit outside 1..100, or offset below 0" }

  # --- existence
  - { id: ERR_STATE_RULE_NOT_FOUND, http: 404, condition: "no StateRule exists for the clinic's state_code when a state-dependent rule must be evaluated" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "protocolId path parameter does not resolve" }
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "clinicId path parameter or clinic_id / home_clinic_id body reference does not resolve" }
  - { id: ERR_PHYSICIAN_NOT_FOUND, http: 404, condition: "physicianId path parameter or supervising_physician_id / pinned_supervising_physician_id body reference does not resolve" }
  - { id: ERR_CLINICIAN_NOT_FOUND, http: 404, condition: "clinicianId path parameter or clinician_id body reference does not resolve" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patientId path parameter or patient_id body reference does not resolve" }
  - { id: ERR_STAFFING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId path parameter or covers_assignment_id body reference does not resolve" }
  - { id: ERR_QUEUE_ENTRY_NOT_FOUND, http: 404, condition: "queueEntryId path parameter or queue_entry_id body reference does not resolve" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "visitId path parameter or visit_id body reference does not resolve" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "assessmentId path parameter does not resolve" }
  - { id: ERR_PRESCRIPTION_NOT_FOUND, http: 404, condition: "prescriptionId path parameter or supersedes_prescription_id body reference does not resolve" }
  - { id: ERR_CHART_REVIEW_NOT_FOUND, http: 404, condition: "chartReviewId path parameter does not resolve" }
  - { id: ERR_VISIT_SUMMARY_NOT_FOUND, http: 404, condition: "visitSummaryId path parameter does not resolve" }

  # --- state preconditions
  - { id: ERR_STAFFING_ASSIGNMENT_INVALID_STATE, http: 409, condition: "cancelling an assignment that is already COMPLETED or CANCELLED" }
  - { id: ERR_QUEUE_ENTRY_INVALID_STATE, http: 409, condition: "arriving a queue entry that is not SCHEDULED, or arriving a WALK_IN entry that is already WAITING / SERVED / ABANDONED / DEFERRED_CLOSURE" }
  - { id: ERR_VISIT_INVALID_STATE, http: 409, condition: "starting an assessment on a visit that is not SCREENING, re-running eligibility on a visit whose billing_status has left UNBILLED, accepting self-pay on a visit that is not SELF_PAY_QUOTED, or checking out a visit that is not TREATED or REFERRED" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "submitting an assessment that is not DRAFT, or cosigning one that is already COSIGNED" }
  - { id: ERR_PRESCRIPTION_INVALID_STATE, http: 409, condition: "routing a prescription that is not DRAFT, or cancelling one that is already CANCELLED" }
  - { id: ERR_CHART_REVIEW_INVALID_STATE, http: 409, condition: "requesting changes / attesting / reassigning a review that is not PENDING, or resubmitting one that is not CHANGES_REQUESTED" }
  - { id: ERR_SUMMARY_INVALID_STATE, http: 409, condition: "transmitting a summary that is not QUEUED, or retrying one that is not FAILED (including a retry from the terminal UNDELIVERABLE state)" }

  # --- optimistic concurrency
  - { id: ERR_STALE_VISIT_VERSION, http: 412, condition: "expected_visit_version on POST /prescriptions does not equal the visit's current version" }
  - { id: ERR_STALE_CLINIC_VERSION, http: 412, condition: "expected_clinic_version on POST /clinics/{clinicId}/float-coverages does not equal the clinic's current version" }

  # --- clinic posture / safety
  - { id: ERR_CLINIC_CLOSED, http: 409, condition: "any intake, call-next or visit operation while Clinic.open_status == CLOSED" }
  - { id: ERR_WALK_IN_SUSPENDED, http: 409, condition: "queueing a WALK_IN entry while Clinic.open_status == LIMITED (appointments are still admitted)" }
  - { id: ERR_SCOPE_HOLD_ACTIVE, http: 422, condition: "a clinician whose scope_hold is true attempts to be staffed, open a visit, assess, or prescribe" }
  - { id: ERR_PROTOCOL_NOT_OFFERED_IN_STATE, http: 422, condition: "no Protocol matches the presenting complaint with the clinic's state_code in allowed_state_codes" }
  - { id: ERR_OUT_OF_PROTOCOL_SCOPE, http: 422, condition: "patient age in whole months is below max(Protocol.min_age_months, StateRule.min_independent_practice_age_months) or above Protocol.max_age_months" }
  - { id: ERR_REFERRAL_REQUIRED, http: 422, condition: "drafting or routing a prescription for a visit whose assessment produced a mandatory referral (Visit.referral_required == true)" }
  - { id: ERR_COSIGN_REQUIRED, http: 422, condition: "checkout of a TREATED visit whose Protocol.requires_cosign is true while the Assessment is still TREATMENT_AUTHORIZED rather than COSIGNED" }
  - { id: ERR_COSIGN_NOT_REQUIRED, http: 422, condition: "cosigning an assessment whose Protocol.requires_cosign is false" }
  - { id: ERR_VISIT_NOT_TREATABLE, http: 409, condition: "routing a prescription whose visit is not in clinical_status TREATED (e.g. already CLOSED)" }

  # --- prescribing
  - { id: ERR_CONTROLLED_RX_NOT_PERMITTED, http: 422, condition: "therapy_class CONTROLLED_OPIOID in a state whose StateRule.controlled_rx_allowed is false" }
  - { id: ERR_DUPLICATE_THERAPY, http: 422, condition: "the patient already holds a ROUTED prescription in the same therapy_class and the new prescription does not supersede it" }

  # --- licensing / supervision
  - { id: ERR_CLINICIAN_NOT_LICENSED_IN_STATE, http: 422, condition: "the clinician's license_state_code differs from the clinic's state_code" }
  - { id: ERR_PHYSICIAN_NOT_LICENSED_IN_STATE, http: 422, condition: "the physician is INACTIVE or the clinic's state_code is absent from licensed_state_codes" }
  - { id: ERR_SUPERVISION_REQUIRED, http: 422, condition: "StateRule.collaborating_physician_required is true but pinned_supervising_physician_id is missing or differs from the clinician's supervising_physician_id" }
  - { id: ERR_SUPERVISION_CAPACITY_EXCEEDED, http: 409, condition: "adding a new distinct supervised clinician would push the physician past min(Physician.max_supervised_clinicians, StateRule.max_supervised_clinicians_per_physician)" }
  - { id: ERR_NO_ELIGIBLE_REVIEWER, http: 409, condition: "reviewer_reassignment_selection finds no ACTIVE, licensed, under-cap physician other than the incumbent and the assessment's cosigner" }
  - { id: ERR_NO_FLOAT_COVERAGE_AVAILABLE, http: 409, condition: "float_coverage_selection finds no float-eligible, licensed, hold-free, non-overlapping clinician" }

  # --- queue / temporal
  - { id: ERR_QUEUE_EMPTY, http: 409, condition: "call-next with no WAITING entry at the clinic" }
  - { id: ERR_QUEUE_ENTRY_NOT_CALLABLE, http: 409, condition: "opening a visit against a queue entry that is not CALLED, belongs to another clinic, or already has a Visit" }
  - { id: ERR_QUEUE_CAPACITY_REACHED, http: 409, condition: "queueing a WALK_IN when the clinic's WAITING walk-in count already equals walk_in_queue_capacity" }
  - { id: ERR_HOURLY_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "booking an appointment when that clock hour already holds appointment_slots_per_hour appointments at the clinic" }
  - { id: ERR_APPOINTMENT_SLOT_CONFLICT, http: 409, condition: "the requested scheduled_at is less than 30 minutes from another SCHEDULED or WAITING appointment at the clinic (exactly 30 minutes is legal)" }
  - { id: ERR_APPOINTMENT_WINDOW_CLOSED, http: 422, condition: "arrival outside [scheduled_at - 15 min, scheduled_at + 10 min]" }
  - { id: ERR_CLINICIAN_DOUBLE_BOOKED, http: 409, condition: "the clinician already has a SCHEDULED or ACTIVE assignment overlapping [starts_at, ends_at); exact adjacency is legal" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "starts_at is not strictly before ends_at, window_start is not strictly before window_end, or scheduled_at is earlier than the logical clock" }
  - { id: ERR_COVERAGE_ALREADY_EXISTS, http: 409, condition: "the named cancelled assignment is not CANCELLED, or a FLOAT assignment already covers it" }

  # --- uniqueness / cycle limits
  - { id: ERR_DUPLICATE_STATE_RULE, http: 409, condition: "a StateRule already exists for that state_code" }
  - { id: ERR_DUPLICATE_PROTOCOL_OFFERING, http: 409, condition: "an existing Protocol already offers that complaint_code in one of the requested allowed_state_codes" }
  - { id: ERR_REVIEW_CYCLE_LIMIT, http: 409, condition: "requesting changes when changes_requested_count already equals MAX_CHANGE_CYCLES (2)" }

  # --- money
  - { id: ERR_QUOTE_REQUIRED, http: 409, condition: "checkout while billing_status is still UNBILLED — no eligibility check has been recorded" }
  - { id: ERR_QUOTE_MISMATCH, http: 422, condition: "acknowledged_price_cents differs from Visit.quoted_price_cents" }
  - { id: ERR_PAYMENT_METHOD_REQUIRED, http: 402, condition: "eligibility check claims ACTIVE coverage for a patient with no payer_name, or checkout of a self-pay visit whose quote has not been accepted (billing_status SELF_PAY_QUOTED)" }
  - { id: ERR_OUTSTANDING_BALANCE_BLOCK, http: 402, condition: "opening a further self-pay visit for a patient whose outstanding_balance_cents exceeds 50000" }
  - { id: ERR_CHARGE_NOT_VOIDABLE, http: 409, condition: "charge-void on a visit whose billing_status is not INVOICED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Regional operations administrator: reference data, staffing, float coverage, sampling runs, reviewer reassignment, PCP transmission and charge voids. Holds no clinical authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /state-rules"
      - "POST /protocols"
      - "POST /clinics"
      - "POST /physicians"
      - "POST /clinicians"
      - "POST /staffing-assignments"
      - "POST /staffing-assignments/{assignmentId}/cancel"
      - "POST /clinics/{clinicId}/float-coverages"
      - "POST /chart-reviews/{chartReviewId}/reassign"
      - "POST /visits/{visitId}/charge-void"
      - "POST /visit-summaries/{visitSummaryId}/transmit"
      - "POST /visit-summaries/{visitSummaryId}/retry"
    shared_operations:
      - "POST /patients (with FrontDeskAgent)"
      - "POST /queue-entries (with FrontDeskAgent)"
      - "POST /clinics/{clinicId}/chart-review-samplings (with CollaboratingPhysician)"
      - "every GET endpoint"

  - name: Clinician
    description: "The NP or PA delivering care: calls patients, opens visits, assesses, prescribes, checks out, and answers chart-review change requests. Identified by X-User-Id matching a Clinician row."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /clinics/{clinicId}/call-next"
      - "POST /visits"
      - "POST /visits/{visitId}/checkout"
      - "POST /assessments"
      - "POST /assessments/{assessmentId}/submit"
      - "POST /prescriptions"
      - "POST /prescriptions/{prescriptionId}/route"
      - "POST /prescriptions/{prescriptionId}/cancel"
      - "POST /chart-reviews/{chartReviewId}/resubmit"
    shared_operations:
      - "GET /clinics/{clinicId}, /clinicians/{clinicianId}, /patients/{patientId}, /staffing-assignments*, /queue-entries*, /visits*, /assessments*, /prescriptions*, /chart-reviews*, /visit-summaries*, /protocols*"

  - name: CollaboratingPhysician
    description: "The supervising physician: cosigns assessments, runs and completes chart review, and can place a clinician on scope hold through a SCOPE_DEVIATION attestation. Identified by X-User-Id matching a Physician row."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /assessments/{assessmentId}/cosign"
      - "POST /chart-reviews/{chartReviewId}/request-changes"
      - "POST /chart-reviews/{chartReviewId}/attest"
    shared_operations:
      - "POST /clinics/{clinicId}/chart-review-samplings (with ClinicAdmin)"
      - "GET /clinics/{clinicId}, /physicians/{physicianId}, /clinicians*, /staffing-assignments*, /visits*, /assessments*, /prescriptions*, /chart-reviews*, /protocols*"

  - name: FrontDeskAgent
    description: "Store-level front desk: registers patients, books and checks in queue entries, and runs insurance eligibility. No clinical authority and no ability to price a closed visit."
    identity: "opaque"
    exclusive_operations:
      - "POST /queue-entries/{queueEntryId}/arrive"
      - "POST /visits/{visitId}/eligibility-check"
    shared_operations:
      - "POST /patients (with ClinicAdmin)"
      - "POST /queue-entries (with ClinicAdmin)"
      - "POST /visits/{visitId}/accept-self-pay (with Patient)"
      - "GET /clinics/{clinicId}, /patients/{patientId}, /queue-entries*, /visits*, /visit-summaries*, /protocols*"

  - name: Patient
    description: "The patient acting on their own record: accepts a transparent self-pay quote and reads only their own visit, summary and patient row. Identified by X-User-Id matching a Patient row."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /visits/{visitId}/accept-self-pay (with FrontDeskAgent)"
      - "GET /patients/{patientId}, GET /visits/{visitId}, GET /visit-summaries/{visitSummaryId}, GET /clinics/{clinicId} — restricted to rows whose patient_id equals the caller (ERR_FORBIDDEN_OWNERSHIP otherwise)"
