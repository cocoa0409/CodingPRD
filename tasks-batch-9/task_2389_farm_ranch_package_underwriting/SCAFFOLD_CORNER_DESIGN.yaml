              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_draft_end: $.data.error_id }
            - *k_rate
            - call: "GET /farm-policies/${pol_id}"
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_v_r: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v_r}", form_code: "AGRITOURISM_LIABILITY", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { end_rated: $.data.id, end_rated_ri: $.data.requires_inspection }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_r}" }
              as: Underwriter
              captures: { bound_status: $.data.uw_status }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v_b: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v_b}", form_code: "PEAK_SEASON_INCREASE", sublimit_cents: 12000000, requested_effective_date: "2026-09-15" }
              as: Underwriter
              captures: { end_bound: $.data.id }
          assert:
            - "the DRAFT attempt returns HTTP 409 ERR_POLICY_NOT_RATED and creates nothing"
            - "the RATED attempt creates a REQUESTED endorsement with premium_cents 0 and requires_inspection false"
            - "FarmPolicy.version was 2 after rating and is still 2 immediately after the endorsement creation, which is why the very same value binds successfully on the next call"
            - "the BOUND attempt also succeeds, so the gate is uw_status IN {RATED, BOUND} rather than 'RATED only'"
            - "total_premium_cents is 269200 throughout: a REQUESTED endorsement never prices"

      - name: corner_inspection_links_an_existing_policy_and_inspector
        claim_type: cross_reference_link
        grounds: ["endpoints.POST_/inspections", "entities.Inspection.fields.policy_id", "entities.Inspection.fields.inspector_id", "complexity_profile.entity_topology"]
        distinguishing_aspect: "Both foreign keys are validated in §1.5 declaration order — an unknown policy_id wins over an unknown inspector_id — and the accepted row is reachable from both sides through the filtered list endpoints."
        test_recipe:
          setup:
