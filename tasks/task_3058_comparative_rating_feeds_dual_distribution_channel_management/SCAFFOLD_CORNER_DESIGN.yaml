            - "Agent.${agent_a}.status remains APPOINTED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_commission_schedule_stale_agent_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[commission-schedule-create-stale-agent]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After schedule S1 creation bumps Agent.version, a second schedule create carrying the pre-S1 version fails 412 ERR_STALE_VERSION; no schedule is created and no supersede occurs."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Agent APPOINTED (TX, AUTO); current Agent.version captured."
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_appt_tx
            - *k_appoint
            - call: "GET /agents/${agent_a}"
              payload: {}
              as: CarrierAdmin
              captures: { agent_v_now: $.data.version }
            - call: "POST /agents/${agent_a}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: null, rate_pct: 0.10 }], contingent_bonus_eligible: false, expected_agent_version: "${agent_v_now}" }
              as: CarrierAdmin
              captures: { sched1: $.data.id }
          trigger:
            - call: "POST /agents/${agent_a}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: null, rate_pct: 0.12 }], contingent_bonus_eligible: false, expected_agent_version: "${agent_v_now}" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION (the first create advanced Agent.version beyond the captured value)"
            - "GET /agents/${agent_a}/commission-schedules returns exactly 1 ACTIVE schedule (${sched1})"

      - name: occ_rate_feed_create_stale_rater_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[rate-feed-publication-create-stale-rater]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Same OCC mechanism on a different parent: after F1 creation bumps ComparativeRater.version, F2 carrying the stale expected_rater_version fails 412 — and a refreshed version then succeeds, proving the check is version-based, not a blanket rejection."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Rater R with one publication F1 created (rater version advanced once)."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_rater
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-07-01T00:00:00Z", rate_table_payload: { t: "f1" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_f1: $.data.id }
          trigger:
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f2" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { err: $.data.error_id }
            - call: "GET /raters/${rater_id}"
              payload: {}
              as: RatingManager
              captures: { rater_v_now: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f2" }, expected_rater_version: "${rater_v_now}" }
              as: RatingManager
              captures: { feed_f2: $.data.id }
          assert:
            - "stale create fails 412 ERR_STALE_VERSION"
            - "refreshed create succeeds: RateFeedPublication.${feed_f2}.status == DRAFT"
            - "the rater version advanced exactly once per successful create (rejected creates do not bump it)"

      - name: version_increments_on_every_agent_mutation
        claim_type: occ_stale_version
        grounds:
          - entities.Agent
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Every mutation advances version by exactly 1: create -> v1, appoint -> v2, suspend -> v3, reinstate -> v4; GETs never advance it."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Agent created."
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_appt_tx
            - *k_appoint
            - call: "POST /agents/${agent_a}/suspend"
              payload: {}
              as: UnderwritingReviewer
            - call: "GET /agents/${agent_a}"
              payload: {}
              as: CarrierAdmin
          trigger:
            - call: "POST /agents/${agent_a}/reinstate"
              payload: {}
              as: UnderwritingReviewer
            - call: "GET /agents/${agent_a}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Agent.${agent_a}.version == ${agent_v} + 3 (appoint, suspend, reinstate)"
            - "the intermediate GET did not change version"

      - name: policy_earned_premium_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.earned_premium_proration
          - entities.Policy.fields.earned_premium_cents
        distinguishing_aspect: "While IN_FORCE the policy reports earned == written (730000) and unearned == 0; after cancel at day 100 the derived fields reconcile to earned 200000 / unearned 530000 — the derived pair stays consistent with the cancellation."
        test_recipe:
          setup:
            - "P-FLAT ACTIVE (TIER_D 730000; factors 0). Feed published. Agent APPOINTED (TX, AUTO). One AGENT policy bound at 2026-01-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - call: "POST /products"
              payload: { product_code: "P-FLAT", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { FLAT: { TIER_D: 730000 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_flat: $.data.id }
            - call: "POST /products/${p_flat}/activate"
              payload: {}
              as: RatingManager
            - *k_rater
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_flat}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_flat: $.data.id }
            - call: "POST /rate-feed-publications/${feed_flat}/publish"
              payload: {}
              as: RatingManager
            - *k_agent
            - *k_appt_tx
            - *k_appoint
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "FLAT", tier: "TIER_D" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q1}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /policies/${pol1}/cancel"
              payload: {}
              as: CarrierAdmin
            - call: "GET /policies/${pol1}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "before cancel: earned_premium_cents == 730000 and unearned_premium_cents == 0"
            - "after cancel at day 100: earned_premium_cents == 200000 and unearned_premium_cents == 530000"
            - "Policy.${pol1}.status == CANCELLED and cancelled_at == \"2026-04-11T00:00:00.000Z\""

      - name: pagination_filter_sort_interaction_on_quotes
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/quotes
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter + paginate interact: channel=DIRECT&status=DRAFT over five quotes (three DIRECT DRAFT, two QUOTED) paginates only the filtered set; total_count reflects the filter, not the table."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with 5 DIRECT quotes; 2 submitted (QUOTED), 3 left DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q1: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q2: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q2}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "GET /quotes"
              payload: { channel: "DIRECT", status: "DRAFT", limit: 2, offset: 0 }
              as: CarrierAdmin
          assert:
            - "the filtered page returns 2 rows with total_count == 3 and has_more == true"
            - "offset 2 returns 1 row with has_more == false"
            - "filtering by status QUOTED returns total_count == 2"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: bind_side_effects_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Quote.QUOTED_to_BOUND
        distinguishing_aspect: "Consistency is immediate: the bind response carries the full Policy, and a GET issued right after (same clock instant) sees the quote BOUND and the policy IN_FORCE — no lag, no reconciliation pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with one QUOTED DIRECT quote."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - *k_quote_draft
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /quotes/${q_id}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol_id: $.data.id }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: CarrierAdmin
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "the bind response itself carries Policy.${pol_id} with status IN_FORCE"
            - "the immediately-following GETs show Quote.${q_id}.status == BOUND and Policy.${pol_id}.status == IN_FORCE"

  # ===========================================================================
  # Stubs for corners already exercised by §1.8 difficulty instances
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: feed_gap_boundary_exactly_24h
        claim_type: rate_threshold_triggers
        grounds:
          - errors.ERR_FEED_WINDOW_GAP_VIOLATION
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rate_feed_windows_require_24h_buffer_touching_rejected
          rationale: "Touching (gap 0), 23h, exactly-24h, and strict-overlap cases are all asserted in the named §1.8 instance."

  - section: calculations
    instances:
      - name: loss_ratio_threshold_boundary_6999_vs_7000
        claim_type: threshold
        grounds:
          - calculations.contingent_bonus_settlement
        excluded_because:
          difficulty_instance: boundary_precision_check / loss_ratio_strict_threshold_boundary_on_bonus_gate
          rationale: "The 0.6999 vs 0.7000 gate boundary is asserted in the named §1.8 instance."

      - name: quote_expiry_exact_boundary
        claim_type: threshold
        grounds:
          - entities.Quote.fields.expires_at
        excluded_because:
          difficulty_instance: boundary_precision_check / quote_bind_at_exact_expiry_timestamp_rejected
          rationale: "The at-expiry and one-second-early bind outcomes are asserted in the named §1.8 instance."

      - name: quote_rerate_cycle_corner
        claim_type: cyclic
        grounds:
          - state_machines.Quote
        excluded_because:
          difficulty_instance: non_linear_state_machine / quote_rerate_cycle_and_referral_loop_on_quote
          rationale: "The DRAFT->QUOTED->DRAFT and AGENT_QUOTED->REFERRED_TO_AGENT loops are asserted in the named §1.8 instance."

      - name: feed_supersede_stale_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RateFeedPublication.DRAFT_to_PUBLISHED
        excluded_because:
          difficulty_instance: transitive_cascade / rate_feed_publish_supersede_marks_dependent_quotes_stale
          rationale: "The publish -> supersede -> rate_stale chain and the ERR_RATE_STALE bind block are asserted in the named §1.8 instance."

      - name: agent_termination_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Agent.APPOINTED_to_TERMINATED
        excluded_because:
          difficulty_instance: transitive_cascade / portfolio_review_termination_cascade_agent_to_appointments_to_schedules_to_statements
          rationale: "The four-hop termination cascade (agent -> appointments -> schedules -> statements) is asserted in the named §1.8 instance."

      - name: telematics_channel_variant_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.telematics_discount_realization
        excluded_because:
          difficulty_instance: dual_variant_calc / telematics_discount_realization_differs_by_channel_on_policy_domain
          rationale: "Both realization variants with literal written premiums and adjustments are asserted in the named §1.8 instance."

      - name: aor_transfer_invariant_corner
        claim_type: waterfall_allocation
        grounds:
