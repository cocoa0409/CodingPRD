          - entities.SubscriberReport.fields.measurement_method_snapshot
        distinguishing_aspect: "WEIGHTED_STREAMING_DEVICES divides by 25/10 and FLOORS: 250004 devices give 100001 households, not the 100002 a round-half-up of 100001.6 would produce."
