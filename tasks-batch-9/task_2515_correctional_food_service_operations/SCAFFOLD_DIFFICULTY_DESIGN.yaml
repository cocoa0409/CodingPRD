            - "ProductionBatch.${batch_id}.qa_status == QA_PASSED and qa_reason == 'Rehabilitated by in-range CHILL_FINAL at 13:00Z'"
            - "ProductionBatch.${batch_id}.production_stage == STAGED"
            - "ProductionBatch.${batch_id}.produced_trays == 10"

  # ===========================================================================
  # Rule 4 - transitive cascades (depth >= 3 and depth >= 2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: unaccounted_sharp_cascades_facility_lockdown_batch_discard_worker_unassignment
        grounds:
          - state_machines.ToolIssuance.ISSUED_to_UNACCOUNTED
          - calculations.facility_kitchen_posture
          - state_machines.ProductionBatch.PLANNED_to_DISCARDED
          - state_machines.InmateWorker.ASSIGNED_to_UNASSIGNED
          - endpoints[POST /cfs/tool-issuances/{id}/declare-unaccounted].side_effects
        distinguishing_aspect: |
          One declare-unaccounted call produces a four-hop chain in which each hop exists only
          because the previous hop happened: hop 1 the Facility sharps counters move
          (open_sharps_discrepancy_count 0 -> 1), hop 2 that non-zero discrepancy count is what
          drives calculations.facility_kitchen_posture to LOCKDOWN, hop 3 the LOCKDOWN posture is
          what discards the in-flight PLANNED batch, and hop 4 the discarded batch is what
          unassigns the COOK_CHILL worker. The auto-created ContrabandIncident is a FAN-OUT of
          hop 1 (a sibling, not a link in the chain) and is asserted separately to prove the
          test distinguishes depth from breadth.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-TC1 ACTIVE with Facility FAC-TC1 (sharps_authorized_count 12, blast_chiller_capacity 2, kitchen_posture OPEN) and an ACTIVE 1-day MenuCycle."
            - "A LOCKED MealForecast for 2026-08-02 BREAKFAST (total_forecast_trays 22) and one ProductionBatch of 10 planned trays still in production_stage PLANNED / qa_status QA_PENDING."
            - "One CLEARED, sharps_eligible InmateWorker ASSIGNED to work_area COOK_CHILL."
            - "One ISSUED SHARP_KNIFE ToolIssuance held by that worker, so Facility.sharps_issued_count is 1 and sharps_on_board_count is 11."
