              captures: { open_t4: $.data.open_journeyworker_slots, accepted_t4: $.data.accepted_journeyworker_count, status_t4: $.data.status }
          assert:
            - "${requested} == 2 and ${ref_hal_reg} == ${reg_hal_id} and ${ref_ivy_reg} == ${reg_ivy_id} and ${issued_first_status} == ISSUED"
            - "CHECKPOINT 0: ${open_t0} == 2 with 0 ISSUED/ACCEPTED journeyworker referrals — 2 + 0 == 2"
            - "CHECKPOINT 1: ${open_t1} == 1 with 1 ISSUED referral — 1 + 1 == 2"
            - "CHECKPOINT 2: ${open_t2} == 0 with 2 ISSUED referrals — 0 + 2 == 2"
            - "CHECKPOINT 3: after the withdrawal ${ref_hal_status} == WITHDRAWN and ${open_t3} == 1 with 1 ISSUED referral remaining — 1 + 1 == 2; the compensation released exactly one slot, not zero and not two"
            - "CHECKPOINT 4: re-issuing to the restored registration gives ${ref_hal2_reg} == ${reg_hal_id} and ${open_t4} == 0 with 2 ISSUED referrals — 0 + 2 == 2"
            - "${accepted_t0} == ${accepted_t2} == ${accepted_t4} == 0 and ${status_t0} == ${status_t1} == ${status_t2} == ${status_t3} == ${status_t4} == OPEN — reservations never touch the acceptance-derived status"
            - "${list_count_t3} == 1 — the withdrawal returns Hal to the list at the same moment it returns the slot to the request, so neither ledger drifts"
      - name: list_ordinal_block_conserved_across_demotion
        grounds:
          - entities.Registration.fields.position_number
          - entities.OutOfWorkList.fields.registered_count
          - state_machines.Registration.REFERRED_to_REGISTERED
          - calculations.dispatch_order_ranking
        distinguishing_aspect: |
          CONSERVED QUANTITY: the LIST ORDINAL BLOCK — the multiset of position_number
          values over REGISTERED rows is always exactly {1..registered_count}, with no
          gap and no duplicate, before a referral, while one row is REFERRED (block
          shrinks to {1,2} and its sum to 3), and after a no-cause refusal permutes the
          assignment back to {1,2,3} with sum 6. Slot counters are irrelevant here, unlike
          the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; home Local 512; GROUP_1 (SENIORITY, requires_local_hours 4000); ACTIVE ratio policy."
            - "Jo Park (9000 h), Kai Lin (8000 h) and Lex Ruiz (7000 h) register in that order, so the initial ordinals are 1, 2, 3 and sum to 6."
            - "One signatory contractor with a LONG_CALL request for one journeyworker."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/ratio-policies"
              payload: { policy_code: "STD-2026", first_apprentice_at_jw_count: 1, then_every_n_jw: 4, effective_from: "2026-01-01T00:00:00.000Z" }
              as: HallAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Jo Park", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_jo_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Kai Lin", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 8000 }
              as: HallAdmin
              captures: { m_kai_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Lex Ruiz", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 7000 }
              as: HallAdmin
              captures: { m_lex_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_jo_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_jo_id: $.data.id, jo_pos0: $.data.position_number }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_kai_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_kai_id: $.data.id, kai_pos0: $.data.position_number }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_lex_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_lex_id: $.data.id, lex_pos0: $.data.position_number }
            - call: "GET /hiring-hall/out-of-work-lists/${g1_id}"
              payload: {}
              as: Dispatcher
              captures: { count0: $.data.registered_count }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Ridgeway Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { ridge_id: $.data.id }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${ridge_id}", job_site: "Transit Yard", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 25, report_at: "2026-09-28T07:00:00.000Z", hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${ridge_id}"
              captures: { jr_id: $.data.id, jr_v1: $.data.version }
          trigger:
            - call: "POST /hiring-hall/job-requests/${jr_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", expected_job_request_version: "${jr_v1}" }
              as: Dispatcher
              as_user_id: "disp-01"
              captures: { ref_id: $.data.id, ref_reg: $.data.registration_id, ref_pos: $.data.list_position_at_issue }
            - call: "GET /hiring-hall/registrations/${reg_jo_id}"
              payload: {}
              as: Dispatcher
              captures: { jo_pos1: $.data.position_number, jo_status1: $.data.status }
            - call: "GET /hiring-hall/registrations/${reg_kai_id}"
              payload: {}
              as: Dispatcher
              captures: { kai_pos1: $.data.position_number }
            - call: "GET /hiring-hall/registrations/${reg_lex_id}"
              payload: {}
              as: Dispatcher
              captures: { lex_pos1: $.data.position_number }
            - call: "GET /hiring-hall/out-of-work-lists/${g1_id}"
              payload: {}
              as: Dispatcher
              captures: { count1: $.data.registered_count }
            - call: "POST /hiring-hall/referrals/${ref_id}/refuse"
              payload: {}
              as: Member
              as_user_id: "${m_jo_id}"
              captures: { ref_status: $.data.status }
            - call: "GET /hiring-hall/registrations/${reg_jo_id}"
              payload: {}
              as: Dispatcher
              captures: { jo_pos2: $.data.position_number, jo_status2: $.data.status, jo_dem2: $.data.demotion_count }
            - call: "GET /hiring-hall/registrations/${reg_kai_id}"
              payload: {}
              as: Dispatcher
              captures: { kai_pos2: $.data.position_number }
            - call: "GET /hiring-hall/registrations/${reg_lex_id}"
              payload: {}
              as: Dispatcher
              captures: { lex_pos2: $.data.position_number }
            - call: "GET /hiring-hall/out-of-work-lists/${g1_id}"
              payload: {}
              as: Dispatcher
              captures: { count2: $.data.registered_count }
          assert:
            - "BEFORE: ${jo_pos0} == 1, ${kai_pos0} == 2, ${lex_pos0} == 3, ${count0} == 3 — the block is {1,2,3}, sum 6, contiguous from 1 to registered_count"
            - "${ref_reg} == ${reg_jo_id} and ${ref_pos} == 1"
            - "WHILE REFERRED: ${jo_status1} == REFERRED with ${jo_pos1} == null, ${kai_pos1} == 1, ${lex_pos1} == 2 and ${count1} == 2 — the block CONTRACTS to {1,2}, sum 3, leaving no hole where ordinal 1 used to sit"
            - "AFTER THE NO-CAUSE REFUSAL: ${ref_status} == REFUSED, ${jo_status2} == REGISTERED, ${jo_dem2} == 1, and ${kai_pos2} == 1, ${lex_pos2} == 2, ${jo_pos2} == 3 with ${count2} == 3 — the block is {1,2,3} again, sum 6, but PERMUTED: the demoted row takes the tail ordinal"
            - "At all three checkpoints the ordinals are exactly the integers 1..registered_count with no duplicate and no gap: {1,2,3} then {1,2} then {1,2,3}"
            - "${jo_pos2} != ${jo_pos0} — conservation of the block does not mean conservation of each row's position"
