# =============================================================================
# Medical Spa & Aesthetics (Botox/filler) — benchmark seed tables (Expert tier)
# =============================================================================

scenario: |
  Medical Spa & Aesthetics (Botox/filler): provider & MD-oversight, consultation
  & treatment plan, injectable lot/unit tracking & expiration, package/membership
  & loyalty (Allē/Aspire), before/after & consent photo, good-faith exam &
  standing order, deposit & series, touch-up/complication

domain_name: medical-spa-aesthetics
api_prefix: /aesthetics

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a top-level collection under /aesthetics; relationships are
  # foreign keys carried in request bodies. Reverse reachability is provided by
  # filtered-list GETs (each child collection accepts its FK fields as filters).

  state_machine_shape: branching
  # TreatmentSession forks at outcome: COMMITTED -> {RESOLVED, COMPLICATION_OPEN}
  # with divergent side-effect sets; ComplicationCase loops via touch-up rounds
  # (OPEN -> IN_TOUCHUP -> OPEN), a cycle.

  relationship_patterns:
    - one_to_many        # Patient -> Consultations / TreatmentPlans; Plan -> Sessions
    - flat_with_references  # FK peers: InjectableLot, StandingOrder, Provider, Membership
    - cross_aggregate    # TreatmentSession consumes InjectableLot units across aggregate boundary

  role_model: segregation_of_duties
  # The Provider who signs the StandingOrder (MEDICAL_DIRECTOR) may NOT be the
  # injector who performs the authorized session.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Provider/injector legal name" }
      - { name: license_number, type: string, source: input, description: "State professional license number" }
      - { name: role_kind, type: enum, source: input, description: "INJECTOR | MEDICAL_DIRECTOR — INJECTOR performs exams and injections; MEDICAL_DIRECTOR signs standing orders", constraints: "one of {INJECTOR, MEDICAL_DIRECTOR}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED providers cannot perform new clinical actions", constraints: "one of {ACTIVE, SUSPENDED}" }
      - { name: open_complication_count, type: integer, source: computed, default: 0, description: "Count of ComplicationCase rows in {OPEN, IN_TOUCHUP} whose injector_provider_id == this Provider.id" }
      - { name: resolved_complication_count, type: integer, source: computed, default: 0, description: "Count of ComplicationCase rows in {RESOLVED} whose injector_provider_id == this Provider.id" }
      - { name: committed_session_count, type: integer, source: computed, default: 0, description: "Count of TreatmentSession rows in {COMMITTED, RESOLVED, COMPLICATION_OPEN} whose injector_provider_id == this Provider.id" }

  - name: MembershipPackage
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | VIP — drives member discount and loyalty program", constraints: "one of {BASIC, PLUS, VIP}" }
      - { name: member_discount_pct, type: number, source: input, description: "Per-line discount fraction applied to each treatment line (e.g. 0.15); 0 <= value < 1" }
      - { name: loyalty_program, type: enum, source: input, description: "ALLE | ASPIRE — branded loyalty program funding redemptions", constraints: "one of {ALLE, ASPIRE}" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Membership fee in cents (informational)" }

  - name: InjectableLot
    parent: null
    common_fields: true
    fields:
      - { name: product, type: enum, source: input, description: "BOTOX | DYSPORT | JUVEDERM | RESTYLANE — injectable product family", constraints: "one of {BOTOX, DYSPORT, JUVEDERM, RESTYLANE}" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number" }
      - { name: expiration_date, type: datetime, source: input, description: "Lot expiry instant (ISO 8601 UTC); a lot is expired when logical clock >= this value" }
      - { name: total_units, type: integer, source: input, description: "Units in the lot at intake (immutable after creation; > 0)" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Units reserved by BOOKED-but-not-COMMITTED TreatmentSessions" }
      - { name: consumed_units, type: integer, source: computed, default: 0, description: "Units consumed by COMMITTED TreatmentSessions" }
      - { name: remaining_units, type: integer, source: computed, description: "= total_units - reserved_units - consumed_units (conserved-quantity invariant)" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED — QUARANTINED lots cannot back new reservations", constraints: "one of {AVAILABLE, QUARANTINED}" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (ISO 8601 UTC)" }
      - { name: membership_id, type: string, source: input, required: false, description: "FK -> MembershipPackage.id; null for non-members (BASIC pricing, no discount)" }
      - { name: photo_consent_on_file, type: boolean, source: computed, default: false, description: "True once a ConsentPhoto with kind==CONSENT and signed==true exists for this Patient" }

  - name: LoyaltyAccount
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the owning patient (1:1)" }
      - { name: program, type: enum, source: input, description: "ALLE | ASPIRE — must equal the patient's MembershipPackage.loyalty_program", constraints: "one of {ALLE, ASPIRE}" }
      - { name: points_earned, type: integer, source: computed, default: 0, description: "Lifetime points earned across committed sessions" }
      - { name: points_redeemed, type: integer, source: computed, default: 0, description: "Lifetime points redeemed at booking" }
      - { name: points_balance, type: integer, source: computed, default: 0, description: "= points_earned - points_redeemed (conserved-quantity invariant); 1 point == 1 cent of redemption value" }

  - name: Consultation
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject patient" }
      - { name: exam_provider_id, type: string, source: input, description: "FK -> Provider.id; injector who performs the good-faith exam (must be role_kind==INJECTOR, status==ACTIVE)" }
      - { name: chief_complaint, type: string, source: input, description: "Patient-stated concern" }
      - { name: exam_clock_utc, type: datetime, source: system, description: "Logical-clock instant when the exam was finalized; sets the good-faith-exam validity window" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | EXAM_COMPLETE | VOID — EXAM_COMPLETE means a good-faith exam is on record", constraints: "one of {DRAFT, EXAM_COMPLETE, VOID}" }

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - { name: consultation_id, type: string, source: input, description: "FK -> Consultation.id; the good-faith exam this order authorizes treatment against" }
      - { name: director_provider_id, type: string, source: input, description: "FK -> Provider.id; MedicalDirector who signed (must be role_kind==MEDICAL_DIRECTOR, status==ACTIVE, and != consultation.exam_provider_id)" }
      - { name: product, type: enum, source: input, description: "BOTOX | DYSPORT | JUVEDERM | RESTYLANE — product the order authorizes", constraints: "one of {BOTOX, DYSPORT, JUVEDERM, RESTYLANE}" }
      - { name: max_units_authorized, type: integer, source: input, description: "Per-session ceiling on units of `product` this order permits (> 0)" }
      - { name: valid_until_utc, type: datetime, source: input, description: "Order expiry instant (ISO 8601 UTC); order is active only while logical clock < this value" }
      - { name: status, type: enum, source: system, default: SIGNED, description: "SIGNED | REVOKED — REVOKED orders cannot authorize new sessions", constraints: "one of {SIGNED, REVOKED}" }

  - name: TreatmentPlan
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject patient" }
      - { name: consultation_id, type: string, source: input, description: "FK -> Consultation.id; the EXAM_COMPLETE good-faith exam this plan is built on" }
      - { name: product, type: enum, source: input, description: "BOTOX | DYSPORT | JUVEDERM | RESTYLANE — product for the series", constraints: "one of {BOTOX, DYSPORT, JUVEDERM, RESTYLANE}" }
      - { name: planned_sessions, type: integer, source: input, description: "Number of sessions in the series (>= 1)" }
      - { name: planned_units_per_session, type: integer, source: input, description: "Estimated units per session, used for provisional series cost (> 0)" }
      - { name: list_price_per_unit_cents, type: integer, source: input, description: "List (pre-discount) price per unit in cents, snapshotted at plan creation (> 0)" }
      - { name: required_deposit_cents, type: integer, source: input, description: "Deposit required before the plan can be activated (>= 0)" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over POSTED Deposit rows for this plan" }
      - { name: provisional_series_cost_cents, type: integer, source: computed, description: "Forward-looking estimate over remaining (not-yet-COMMITTED) sessions; see calculations" }
      - { name: finalized_series_cost_cents, type: integer, source: computed, default: 0, description: "Chronological running sum of final_charge_cents over COMMITTED sessions (net of refund compensations)" }
      - { name: sessions_committed, type: integer, source: computed, default: 0, description: "Count of TreatmentSession in {COMMITTED, RESOLVED, COMPLICATION_OPEN} for this plan" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> ACTIVE -> COMPLETED / CANCELLED", constraints: "one of {PROPOSED, ACTIVE, COMPLETED, CANCELLED}" }

  - name: Deposit
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; the plan this deposit funds" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount in cents (> 0)" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | REFUNDED — REFUNDED when plan cancelled before first commit", constraints: "one of {POSTED, REFUNDED}" }

  - name: TreatmentSession
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; parent plan" }
      - { name: standing_order_id, type: string, source: input, description: "FK -> StandingOrder.id; the active MD order authorizing this session" }
      - { name: injector_provider_id, type: string, source: input, description: "FK -> Provider.id; injector performing the session (role_kind==INJECTOR, status==ACTIVE)" }
      - { name: injectable_lot_id, type: string, source: input, description: "FK -> InjectableLot.id; the FEFO entry lot recorded on the session (cross-lot straddle is resolved server-side over all eligible lots)" }
      - { name: planned_units, type: integer, source: input, description: "Units requested at booking; drives FEFO reservation (> 0)" }
      - { name: actual_units, type: integer, source: input, required: false, description: "Units actually injected, supplied at commit; defaults to planned_units when omitted" }
      - { name: loyalty_points_redeemed, type: integer, source: input, required: false, default: 0, description: "Points redeemed at booking (1 point == 1 cent off final charge; >= 0)" }
      - { name: final_charge_cents, type: integer, source: computed, default: 0, description: "Computed at COMMIT: member-discounted line total minus loyalty redemption, floored at 0" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "= max(0, final_charge_cents - deposit_allocated_cents) at COMMIT" }
      - { name: points_earned_cents_basis, type: integer, source: computed, default: 0, description: "Loyalty points earned at COMMIT = floor(final_charge_cents / 100)" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED -> COMMITTED -> {RESOLVED | COMPLICATION_OPEN}; BOOKED -> CANCELLED / NO_SHOW", constraints: "one of {BOOKED, COMMITTED, RESOLVED, COMPLICATION_OPEN, CANCELLED, NO_SHOW}" }

  - name: ConsentPhoto
    parent: Patient
    common_fields: false   # immutable event record: id + created_at only
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject patient" }
      - { name: treatment_session_id, type: string, source: input, required: false, description: "FK -> TreatmentSession.id; session the photo documents (null for standalone consent capture)" }
      - { name: kind, type: enum, source: input, description: "CONSENT | BEFORE | AFTER — CONSENT records signed consent; BEFORE/AFTER are clinical photos", constraints: "one of {CONSENT, BEFORE, AFTER}" }
      - { name: signed, type: boolean, source: input, required: false, default: false, description: "True only for kind==CONSENT signed consent records" }
      - { name: storage_uri, type: string, source: input, description: "Opaque pointer to stored image/consent artifact" }

  - name: ComplicationCase
    parent: TreatmentSession
    common_fields: true
    fields:
      - { name: treatment_session_id, type: string, source: input, description: "FK -> TreatmentSession.id; the session that triggered the complication" }
      - { name: injector_provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the originating session for provider risk scoring" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE — drives whether a touch-up is permitted vs refund-only", constraints: "one of {MINOR, MODERATE, SEVERE}" }
      - { name: touchup_rounds, type: integer, source: computed, default: 0, description: "Number of touch-up rounds opened for this case" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Cents refunded when the case is RESOLVED via REFUND (compensation path)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> IN_TOUCHUP -> OPEN (loop) ; OPEN/IN_TOUCHUP -> RESOLVED", constraints: "one of {OPEN, IN_TOUCHUP, RESOLVED}" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Consultation
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: EXAM_COMPLETE
        trigger: "POST /aesthetics/consultations/{id}/complete-exam"
        actor: Provider
        preconditions:
          - "Consultation.status == DRAFT (else ERR_CONSULTATION_NOT_DRAFT)"
          - "exam_provider is role_kind==INJECTOR and status==ACTIVE (else ERR_PROVIDER_NOT_ELIGIBLE)"
        side_effects:
          - "Set exam_clock_utc = current logical clock (good-faith-exam validity window starts now)"
      - from: EXAM_COMPLETE
        to: VOID
        trigger: "POST /aesthetics/consultations/{id}/void"
        actor: ClinicAdmin
        preconditions:
          - "Consultation.status == EXAM_COMPLETE (else ERR_CONSULTATION_NOT_DRAFT)"
          - "No TreatmentPlan in {PROPOSED, ACTIVE} references this consultation (else ERR_CONSULTATION_IN_USE)"
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "POST /aesthetics/consultations/{id}/void"
        actor: ClinicAdmin
        preconditions:
          - "Consultation.status == DRAFT"
        side_effects: []

  - entity: TreatmentPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /aesthetics/treatment-plans/{id}/activate"
        actor: Provider
        preconditions:
          - "TreatmentPlan.status == PROPOSED (else ERR_PLAN_NOT_PROPOSED)"
          - "expected_treatment_plan_version matches TreatmentPlan.version (else ERR_STALE_PLAN_VERSION)"
          - "Referenced Consultation.status == EXAM_COMPLETE (else ERR_NO_GOOD_FAITH_EXAM)"
          - "deposit_paid_cents >= required_deposit_cents (else ERR_DEPOSIT_REQUIRED)"
        side_effects:
          - "Recompute provisional_series_cost_cents over all planned sessions (none committed yet)"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /aesthetics/treatment-plans/{id}/complete"
        actor: Provider
        preconditions:
          - "TreatmentPlan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
          - "expected_treatment_plan_version matches TreatmentPlan.version (else ERR_STALE_PLAN_VERSION)"
          - "No TreatmentSession in {BOOKED, COMMITTED, COMPLICATION_OPEN} for this plan (else ERR_OPEN_SESSIONS_EXIST)"
        side_effects:
          - "Recompute provisional_series_cost_cents = 0 (no remaining sessions)"
          - "increments TreatmentPlan.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /aesthetics/treatment-plans/{id}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "TreatmentPlan.status in {PROPOSED, ACTIVE} (else ERR_PLAN_NOT_CANCELLABLE)"
          - "expected_treatment_plan_version matches TreatmentPlan.version (else ERR_STALE_PLAN_VERSION)"
          - "sessions_committed == 0 (else ERR_PLAN_HAS_COMMITTED_SESSIONS)"
        side_effects:
          - "Cascade (compensation): set every POSTED Deposit on this plan to REFUNDED; deposit_paid_cents recomputes to 0"
          - "Cascade: set every BOOKED TreatmentSession on this plan to CANCELLED, which releases its reserved lot units (see TreatmentSession BOOKED->CANCELLED)"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /aesthetics/treatment-plans/{id}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "TreatmentPlan.status in {PROPOSED, ACTIVE} (else ERR_PLAN_NOT_CANCELLABLE)"
          - "expected_treatment_plan_version matches TreatmentPlan.version (else ERR_STALE_PLAN_VERSION)"
          - "sessions_committed == 0 (else ERR_PLAN_HAS_COMMITTED_SESSIONS)"
        side_effects:
          - "Cascade (compensation): set every POSTED Deposit on this plan to REFUNDED; deposit_paid_cents recomputes to 0"
          - "Cascade: set every BOOKED TreatmentSession on this plan to CANCELLED, releasing reserved lot units"
          - "increments TreatmentPlan.version by 1"

  - entity: TreatmentSession
    initial_state: BOOKED
    terminal_states: [RESOLVED, CANCELLED, NO_SHOW]
    transitions:
      - from: null
        to: BOOKED
        trigger: "POST /aesthetics/treatment-sessions"
        actor: Provider
        preconditions:
          - "TreatmentPlan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
          - "expected_treatment_plan_version matches TreatmentPlan.version (else ERR_STALE_PLAN_VERSION)"
          - "StandingOrder.status == SIGNED and StandingOrder.valid_until_utc > current clock (else ERR_STANDING_ORDER_INACTIVE)"
          - "Consultation referenced by the plan is EXAM_COMPLETE and exam_clock_utc + GOOD_FAITH_EXAM_VALIDITY_DAYS > current clock (else ERR_NO_GOOD_FAITH_EXAM / ERR_GOOD_FAITH_EXAM_EXPIRED)"
          - "StandingOrder.product == TreatmentPlan.product == InjectableLot.product (else ERR_PRODUCT_MISMATCH)"
          - "planned_units <= StandingOrder.max_units_authorized (else ERR_UNITS_EXCEED_ORDER)"
          - "injector role_kind==INJECTOR, status==ACTIVE (else ERR_PROVIDER_NOT_ELIGIBLE)"
          - "injector_provider_id != StandingOrder.director_provider_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Patient.photo_consent_on_file == true (else ERR_CONSENT_PHOTO_REQUIRED)"
          - "Sum of remaining_units over AVAILABLE non-expired lots of TreatmentPlan.product >= planned_units (else ERR_INSUFFICIENT_LOT_UNITS)"
        side_effects:
          - "FEFO-reserve planned_units across AVAILABLE non-expired lots of TreatmentPlan.product ordered by (expiration_date ASC, created_at ASC): increment each lot's reserved_units and recompute remaining_units"
          - "increments TreatmentPlan.version by 1"
          - "Recompute TreatmentPlan.provisional_series_cost_cents over remaining (not-yet-COMMITTED) sessions"
      - from: BOOKED
        to: COMMITTED
        trigger: "POST /aesthetics/treatment-sessions/{id}/commit"
        actor: Provider
        preconditions:
          - "TreatmentSession.status == BOOKED (else ERR_SESSION_NOT_BOOKED)"
          - "actual_units (or planned_units if omitted) <= StandingOrder.max_units_authorized (else ERR_UNITS_EXCEED_ORDER)"
          - "A ConsentPhoto with kind==BEFORE exists for this session (else ERR_BEFORE_PHOTO_REQUIRED)"
        side_effects:
          - "Convert reserved->consumed for actual_units across the session's FEFO-reserved lots in the same (expiration_date ASC, created_at ASC) order; release leftover reserved (planned_units - actual_units) back to remaining_units"
          - "Compute final_charge_cents via session_charge calculation (member-discounted per-line total minus loyalty redemption, floor 0)"
          - "deposit_allocated = min(final_charge_cents, plan.deposit_paid_cents); balance_due_cents = final_charge_cents - deposit_allocated"
          - "points_earned_cents_basis = floor(final_charge_cents / 100); LoyaltyAccount.points_earned += points_earned_cents_basis, points_redeemed += loyalty_points_redeemed, recompute points_balance"
          - "Cascade (ledger sync): TreatmentPlan.finalized_series_cost_cents += final_charge_cents; sessions_committed += 1; recompute provisional_series_cost_cents over remaining sessions; increments TreatmentPlan.version by 1"
          - "Cascade: Provider.committed_session_count recomputed"
      - from: COMMITTED
        to: RESOLVED
        trigger: "POST /aesthetics/treatment-sessions/{id}/resolve"
        actor: Provider
        preconditions:
          - "TreatmentSession.status == COMMITTED (else ERR_SESSION_NOT_COMMITTED)"
          - "A ConsentPhoto with kind==AFTER exists for this session (else ERR_AFTER_PHOTO_REQUIRED)"
          - "No ComplicationCase in {OPEN, IN_TOUCHUP} for this session (else ERR_COMPLICATION_OPEN)"
        side_effects:
          - "No ledger change; session reaches happy-path terminal state"
      - from: COMMITTED
        to: COMPLICATION_OPEN
        trigger: "POST /aesthetics/complication-cases"
        actor: Provider
        preconditions:
          - "TreatmentSession.status == COMMITTED (else ERR_SESSION_NOT_COMMITTED)"
        side_effects:
          - "Create ComplicationCase (status=OPEN, injector_provider_id copied from session)"
          - "Cascade: Provider.open_complication_count recomputed (raises provisional complication rate)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /aesthetics/treatment-sessions/{id}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "TreatmentSession.status == BOOKED (else ERR_SESSION_NOT_BOOKED)"
        side_effects:
          - "Release all reserved_units this session holds across its FEFO lots; recompute each lot's remaining_units"
          - "Recompute TreatmentPlan.provisional_series_cost_cents"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /aesthetics/treatment-sessions/{id}/no-show"
        actor: ClinicAdmin
        preconditions:
          - "TreatmentSession.status == BOOKED (else ERR_SESSION_NOT_BOOKED)"
        side_effects:
          - "Release all reserved_units this session holds; recompute each lot's remaining_units"
          - "Recompute TreatmentPlan.provisional_series_cost_cents"

  - entity: ComplicationCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_TOUCHUP
        trigger: "POST /aesthetics/complication-cases/{id}/open-touchup"
        actor: Provider
        preconditions:
          - "ComplicationCase.status == OPEN (else ERR_CASE_NOT_OPEN)"
          - "severity in {MINOR, MODERATE} (SEVERE is refund-only) (else ERR_SEVERE_NO_TOUCHUP)"
          - "touchup_rounds < MAX_TOUCHUP_ROUNDS (else ERR_TOUCHUP_LIMIT_REACHED)"
          - "The originating session's StandingOrder.status==SIGNED and valid_until_utc > clock (else ERR_STANDING_ORDER_INACTIVE)"
        side_effects:
          - "Increment touchup_rounds by 1"
      - from: IN_TOUCHUP
        to: OPEN
        trigger: "POST /aesthetics/complication-cases/{id}/touchup-failed"
        actor: Provider
        preconditions:
          - "ComplicationCase.status == IN_TOUCHUP (else ERR_CASE_NOT_IN_TOUCHUP)"
        side_effects:
          - "Case loops back to OPEN, eligible for another touch-up round (until MAX_TOUCHUP_ROUNDS) or refund resolution"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /aesthetics/complication-cases/{id}/resolve"
        actor: Provider
        preconditions:
          - "ComplicationCase.status == OPEN (else ERR_CASE_NOT_OPEN)"
        side_effects:
          - "If resolution_mode == REFUND: compensation — refund_cents = originating session.final_charge_cents; reverse loyalty points (LoyaltyAccount.points_earned -= session.points_earned_cents_basis, points_redeemed -= session.loyalty_points_redeemed; recompute points_balance); subtract session.final_charge_cents from TreatmentPlan.finalized_series_cost_cents"
          - "If resolution_mode == CLINICAL: refund_cents stays 0; no ledger change"
          - "Cascade: Provider.open_complication_count and resolved_complication_count recomputed"
      - from: IN_TOUCHUP
        to: RESOLVED
        trigger: "POST /aesthetics/complication-cases/{id}/resolve"
        actor: Provider
        preconditions:
          - "ComplicationCase.status == IN_TOUCHUP (else ERR_CASE_NOT_OPEN)"
        side_effects:
          - "If resolution_mode == REFUND: same compensation as OPEN->RESOLVED"
          - "If resolution_mode == CLINICAL: refund_cents stays 0; no ledger change"
          - "Cascade: Provider.open_complication_count and resolved_complication_count recomputed"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: session-book-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /aesthetics/treatment-sessions"
    occ_field: "expected_treatment_plan_version"
    description: |
      Booking a TreatmentSession against a TreatmentPlan whose version has
      advanced since the client last observed it is rejected. A prior booking
      already FEFO-reserved lot units and bumped the plan version (which
      legitimately changes provisional_series_cost_cents and the remaining
      reservable capacity), so the current booker's view of the plan — and of
      how many units remain reservable — is stale and must be refreshed before
      retrying.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: session_charge
    trigger: "TreatmentSession BOOKED->COMMITTED (commit)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): round PER LINE, then sum. Order is pinned and
      # load-bearing.
      member_discount_pct = Patient.membership ? MembershipPackage.member_discount_pct : 0
      # The committed session has one product line (TreatmentPlan.product), but
      # the per-line rounding rule is the same rule a multi-line estimate uses:
      # discount the line, round the line to whole cents (round_half_up), THEN
      # sum lines, THEN subtract loyalty redemption.
      line_cents = round_half_up(actual_units * TreatmentPlan.list_price_per_unit_cents * (1 - member_discount_pct))
      subtotal_cents = sum(line_cents over all product lines)   # one line here
      loyalty_redemption_cents = loyalty_points_redeemed * POINT_VALUE_CENTS
      final_charge_cents = max(0, subtotal_cents - loyalty_redemption_cents)
    input_set: "The committed session's product line; actual_units (defaults to planned_units); patient membership discount (0 if no membership); loyalty_points_redeemed."
    constants:
      POINT_VALUE_CENTS: 1
    precision: "whole cents, round_half_up applied PER LINE before summing (never sum-then-round)"
    note: "Rounding order is load-bearing: round-per-line-then-sum and sum-then-round diverge by cents for fractional-cent lines; this scaffold pins round-per-line-then-sum."

  - name: provisional_series_cost
    trigger: "TreatmentPlan activate; TreatmentSession book/commit/cancel/no-show"
    algorithm: forward_looking
    formula: |
      # Forward-looking estimate over sessions NOT yet COMMITTED.
      remaining_sessions = TreatmentPlan.planned_sessions - sessions_committed
      if remaining_sessions < 0: remaining_sessions = 0
      # Provisional uses LIST price (no member discount, no loyalty) — an estimate.
      provisional_series_cost_cents = remaining_sessions
                                      * TreatmentPlan.planned_units_per_session
                                      * TreatmentPlan.list_price_per_unit_cents
    input_set: "planned_sessions and sessions_committed on the plan; planned_units_per_session; list_price_per_unit_cents."
    constants: {}
    precision: "whole cents (all integer inputs; no rounding needed)"
    variants:
      - name: provisional
        when: "before each session is COMMITTED"
        difference: "Estimate over remaining sessions at LIST price — no member discount, no loyalty."
      - name: finalized
        when: "as sessions COMMIT, finalized_series_cost_cents accumulates actual member-discounted final_charge_cents"
        difference: "Chronological running sum of session_charge outputs — applies member discount and loyalty, so the finalized total diverges from the naive provisional estimate for identical planned inputs."

  - name: provider_complication_rate
    trigger: "GET /aesthetics/providers/{id} (computed-read); recomputed on complication open/resolve"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant RISK score on the Provider domain (distinct from cost calcs).
      committed = Provider.committed_session_count
      open = Provider.open_complication_count
      resolved = Provider.resolved_complication_count
      if committed == 0:
        rate_bps = 0   # boundary: zero committed sessions -> 0, no division
      else:
        rate_bps = round_half_up( numerator * RATE_SCALE_BPS / committed )
    input_set: "Provider.committed_session_count, open_complication_count, resolved_complication_count."
    constants:
      RATE_SCALE_BPS: 10000
    precision: "integer basis points, round_half_up"
    variants:
      - name: provisional_rate
        when: "live risk view (e.g. before authorizing a new session)"
        difference: "numerator = open_complication_count + resolved_complication_count (counts still-OPEN/IN_TOUCHUP complications as adverse pending outcomes)."
      - name: settled_rate
        when: "settled/credentialing view"
        difference: "numerator = resolved_complication_count only (excludes still-open complications); same inputs, different inclusion set -> different rate."

  - name: lot_fefo_allocation
    trigger: "TreatmentSession booking (reserve) and commit (consume)"
    algorithm: waterfall_allocation
    formula: |
      # First-Expiry-First-Out waterfall across AVAILABLE non-expired lots of the
      # TreatmentPlan.product. Ordering is pinned; id is NEVER used.
      candidates = lots where product==plan.product
                        and status==AVAILABLE
                        and expiration_date > current_clock
      sort candidates by (expiration_date ASC, created_at ASC)   # created_at tie-break
      need = planned_units (reserve) or actual_units (consume)
      for lot in candidates:
        take = min(need, lot.remaining_units)
        reserve/consume `take` from lot; need -= take
        if need == 0: break
      if need > 0 after exhausting candidates: reject ERR_INSUFFICIENT_LOT_UNITS (reserve path)
    input_set: "AVAILABLE, non-expired lots of the plan's product; their remaining_units; the FEFO sort key."
    constants: {}
    precision: "integer units; no rounding"
    note: "Conserved-quantity invariant per lot: total_units == remaining_units + reserved_units + consumed_units at all times."

  - name: loyalty_points_ledger
    trigger: "TreatmentSession commit (earn+redeem); ComplicationCase REFUND resolve (compensation)"
    algorithm: aggregation
    formula: |
      # Conserved across forward + compensating actions.
      on COMMIT:
        points_earned   += floor(session.final_charge_cents / 100)   # 1 pt per dollar
        points_redeemed += session.loyalty_points_redeemed
      on REFUND resolution (compensation):
        points_earned   -= session.points_earned_cents_basis
        points_redeemed -= session.loyalty_points_redeemed
      points_balance = points_earned - points_redeemed   # invariant after every op
    input_set: "Committed sessions for the patient's LoyaltyAccount; refund compensations."
    constants:
      POINT_VALUE_CENTS: 1
    precision: "integer points; floor on earn"
    note: "Invariant: points_balance == points_earned - points_redeemed; a forward commit followed by its REFUND compensation leaves all three back at their pre-commit values."

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource id exists (providerId/patientId/lotId/consultationId/orderId/planId/sessionId/caseId)"
    error_id: "ERR_PROVIDER_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_LOT_NOT_FOUND / ERR_CONSULTATION_NOT_FOUND / ERR_STANDING_ORDER_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: all single-resource and action endpoints

  - priority: 4
    category: existence
    check: "Body FK references resolve (membership_id, patient_id, consultation_id, treatment_plan_id, standing_order_id, injectable_lot_id, injector_provider_id, director_provider_id, exam_provider_id, treatment_session_id)"
    error_id: "ERR_MEMBERSHIP_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_CONSULTATION_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_STANDING_ORDER_NOT_FOUND / ERR_LOT_NOT_FOUND / ERR_PROVIDER_NOT_FOUND / ERR_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "POST creating Patient / Consultation / StandingOrder / TreatmentPlan / Deposit / TreatmentSession / ConsentPhoto / ComplicationCase / LoyaltyAccount"

  - priority: 5
    category: business_constraint
    check: "Loyalty program agreement: LoyaltyAccount.program == patient's MembershipPackage.loyalty_program"
    error_id: ERR_LOYALTY_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /aesthetics/loyalty-accounts"

  - priority: 6
    category: state
    check: "OCC: the supplied expected_<parent>_version equals the parent's current version. TreatmentPlan on plan activate/complete/cancel, deposit post, session booking; InjectableLot on quarantine; Provider on suspend; StandingOrder on revoke."
    error_id: "ERR_STALE_PLAN_VERSION / ERR_STALE_LOT_VERSION / ERR_STALE_PROVIDER_VERSION / ERR_STALE_STANDING_ORDER_VERSION"
    http_status: 412
    applies_to: "POST treatment-plans/{id}/activate|complete|cancel ; POST /aesthetics/deposits ; POST /aesthetics/treatment-sessions ; POST /aesthetics/injectable-lots/{id}/quarantine ; POST /aesthetics/providers/{id}/suspend ; POST /aesthetics/standing-orders/{id}/revoke"

  - priority: 7
    category: state
    check: "Target resource in correct source state for the requested transition"
    error_id: "ERR_PLAN_NOT_PROPOSED / ERR_PLAN_NOT_ACTIVE / ERR_PLAN_NOT_CANCELLABLE / ERR_SESSION_NOT_BOOKED / ERR_SESSION_NOT_COMMITTED / ERR_CONSULTATION_NOT_DRAFT / ERR_CASE_NOT_OPEN / ERR_CASE_NOT_IN_TOUCHUP"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 8
    category: business_safety
    check: "Good-faith exam exists and unexpired: Consultation.status==EXAM_COMPLETE and exam_clock_utc + GOOD_FAITH_EXAM_VALIDITY_DAYS > current clock"
    error_id: "ERR_NO_GOOD_FAITH_EXAM / ERR_GOOD_FAITH_EXAM_EXPIRED"
    http_status: 409
    applies_to: "POST treatment-plans/{id}/activate (existence); POST /aesthetics/treatment-sessions (existence + freshness)"

  - priority: 9
    category: business_safety
    check: "StandingOrder active: status==SIGNED and valid_until_utc > current clock"
    error_id: ERR_STANDING_ORDER_INACTIVE
    http_status: 409
    applies_to: "POST /aesthetics/treatment-sessions ; POST /aesthetics/complication-cases/{id}/open-touchup"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: session injector_provider_id != StandingOrder.director_provider_id (same person cannot both sign the order and inject)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /aesthetics/treatment-sessions"

  - priority: 11
    category: business_safety
    check: "Provider eligible: role_kind==INJECTOR and status==ACTIVE for exams/injections; role_kind==MEDICAL_DIRECTOR and ACTIVE for standing orders"
    error_id: ERR_PROVIDER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST consultations/{id}/complete-exam ; POST /aesthetics/treatment-sessions ; POST /aesthetics/standing-orders"

  - priority: 12
    category: business_safety
    check: "Photo gating: signed CONSENT on file before booking; BEFORE photo before commit; AFTER photo before resolve"
    error_id: "ERR_CONSENT_PHOTO_REQUIRED / ERR_BEFORE_PHOTO_REQUIRED / ERR_AFTER_PHOTO_REQUIRED"
    http_status: 409
    applies_to: "POST /aesthetics/treatment-sessions ; .../commit ; .../resolve"

  - priority: 13
    category: business_constraint
    check: "Product agreement: StandingOrder.product == TreatmentPlan.product == InjectableLot.product"
    error_id: ERR_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /aesthetics/treatment-sessions"

  - priority: 14
    category: business_constraint
    check: "Units authorized: planned_units (book) / actual_units (commit) <= StandingOrder.max_units_authorized"
    error_id: ERR_UNITS_EXCEED_ORDER
    http_status: 422
    applies_to: "POST /aesthetics/treatment-sessions ; .../commit"

  - priority: 15
    category: business_constraint
    check: "Severity gate: only MINOR/MODERATE complications may open a touch-up; SEVERE is refund-only"
    error_id: ERR_SEVERE_NO_TOUCHUP
    http_status: 409
    applies_to: "POST /aesthetics/complication-cases/{id}/open-touchup"

  - priority: 16
    category: business_constraint
    check: "Touch-up round cap: touchup_rounds < MAX_TOUCHUP_ROUNDS before opening another round"
    error_id: ERR_TOUCHUP_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /aesthetics/complication-cases/{id}/open-touchup"

  - priority: 17
    category: business_fiscal
    check: "Deposit satisfied: deposit_paid_cents >= required_deposit_cents before plan activation"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 402
    applies_to: "POST /aesthetics/treatment-plans/{id}/activate"

  - priority: 18
    category: business_fiscal
    check: "Lot capacity: sum of remaining_units over AVAILABLE non-expired lots of the product >= planned_units"
    error_id: ERR_INSUFFICIENT_LOT_UNITS
    http_status: 409
    applies_to: "POST /aesthetics/treatment-sessions"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Provider ---
  - method: POST
    path: "/aesthetics/providers"
    description: "Register a Provider (injector or medical director)"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, license_number, role_kind]
    output: Provider
    side_effects: ["status=ACTIVE; complication/session counts initialized to 0"]
  - method: GET
    path: "/aesthetics/providers"
    description: "List providers, filterable by role_kind/status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["role_kind?", "status?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: GET
    path: "/aesthetics/providers/{id}"
    description: "Get a provider with computed complication-rate variants"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: ["recompute provider_complication_rate (provisional_rate + settled_rate)"]
  - method: POST
    path: "/aesthetics/providers/{id}/suspend"
    description: "Suspend a provider (blocks new clinical actions)"
    roles: [ClinicAdmin]
    code: 200
    input: [expected_provider_version]
    output: Provider
    side_effects: ["status=SUSPENDED; increments Provider.version by 1"]

  # --- MembershipPackage ---
  - method: POST
    path: "/aesthetics/membership-packages"
    description: "Create a membership tier"
    roles: [ClinicAdmin]
    code: 201
    input: [tier, member_discount_pct, loyalty_program, monthly_fee_cents]
    output: MembershipPackage
    side_effects: []
  - method: GET
    path: "/aesthetics/membership-packages"
    description: "List membership packages"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: MembershipPackage[]
    side_effects: []
  - method: GET
    path: "/aesthetics/membership-packages/{id}"
    description: "Get a membership package"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: MembershipPackage
    side_effects: []

  # --- InjectableLot ---
  - method: POST
    path: "/aesthetics/injectable-lots"
    description: "Intake an injectable lot"
    roles: [ClinicAdmin]
    code: 201
    input: [product, lot_number, expiration_date, total_units]
    output: InjectableLot
    side_effects: ["reserved_units=0, consumed_units=0, remaining_units=total_units, status=AVAILABLE"]
  - method: GET
    path: "/aesthetics/injectable-lots"
    description: "List lots, filterable by product/status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["product?", "status?", "limit?", "offset?"]
    output: InjectableLot[]
    side_effects: []
  - method: GET
    path: "/aesthetics/injectable-lots/{id}"
    description: "Get a lot with its current unit ledger"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: InjectableLot
    side_effects: []
  - method: POST
    path: "/aesthetics/injectable-lots/{id}/quarantine"
    description: "Quarantine a lot (removes it from new reservations)"
    roles: [ClinicAdmin]
    code: 200
    input: [expected_lot_version]
    output: InjectableLot
    side_effects: ["status=QUARANTINED; increments InjectableLot.version by 1"]

  # --- Patient ---
  - method: POST
    path: "/aesthetics/patients"
    description: "Register a patient (optionally with membership)"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, date_of_birth, "membership_id?"]
    output: Patient
    side_effects: ["photo_consent_on_file=false"]
  - method: GET
    path: "/aesthetics/patients"
    description: "List patients, filterable by membership_id"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["membership_id?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: GET
    path: "/aesthetics/patients/{id}"
    description: "Get a patient"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- LoyaltyAccount ---
  - method: POST
    path: "/aesthetics/loyalty-accounts"
    description: "Open a patient's loyalty account (program must match membership)"
    roles: [ClinicAdmin]
    code: 201
    input: [patient_id, program]
    output: LoyaltyAccount
    side_effects: ["points_earned=0, points_redeemed=0, points_balance=0"]
  - method: GET
    path: "/aesthetics/loyalty-accounts"
    description: "List loyalty accounts, filterable by patient_id (0 or 1)"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: LoyaltyAccount[]
    side_effects: []
  - method: GET
    path: "/aesthetics/loyalty-accounts/{id}"
    description: "Get a loyalty account with its points ledger"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  # --- Consultation ---
  - method: POST
    path: "/aesthetics/consultations"
    description: "Open a consultation (good-faith exam draft)"
    roles: [Provider]
    code: 201
    input: [patient_id, exam_provider_id, chief_complaint]
    output: Consultation
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/aesthetics/consultations"
    description: "List consultations, filterable by patient_id / exam_provider_id / status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["patient_id?", "exam_provider_id?", "status?", "limit?", "offset?"]
    output: Consultation[]
    side_effects: []
  - method: GET
    path: "/aesthetics/consultations/{id}"
    description: "Get a consultation"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: Consultation
    side_effects: []
  - method: POST
    path: "/aesthetics/consultations/{id}/complete-exam"
    description: "Finalize the good-faith exam"
    roles: [Provider]
    code: 200
    input: []
    output: Consultation
    side_effects: ["status=EXAM_COMPLETE; exam_clock_utc=current clock"]
  - method: POST
    path: "/aesthetics/consultations/{id}/void"
    description: "Void a consultation"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Consultation
    side_effects: ["status=VOID"]

  # --- StandingOrder ---
  - method: POST
    path: "/aesthetics/standing-orders"
    description: "MedicalDirector signs a standing order against a completed exam"
    roles: [Provider]
    code: 201
    input: [consultation_id, director_provider_id, product, max_units_authorized, valid_until_utc]
    output: StandingOrder
    side_effects: ["status=SIGNED"]
  - method: GET
    path: "/aesthetics/standing-orders"
    description: "List standing orders, filterable by consultation_id / director_provider_id / status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["consultation_id?", "director_provider_id?", "status?", "limit?", "offset?"]
    output: StandingOrder[]
    side_effects: []
  - method: GET
    path: "/aesthetics/standing-orders/{id}"
    description: "Get a standing order"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []
  - method: POST
    path: "/aesthetics/standing-orders/{id}/revoke"
    description: "Revoke a standing order"
    roles: [Provider]
    code: 200
    input: [expected_standing_order_version]
    output: StandingOrder
    side_effects: ["status=REVOKED; increments StandingOrder.version by 1"]

  # --- ConsentPhoto ---
  - method: POST
    path: "/aesthetics/consent-photos"
    description: "Record a consent/before/after photo"
    roles: [Provider]
    code: 201
    input: [patient_id, kind, storage_uri, "treatment_session_id?", "signed?"]
    output: ConsentPhoto
    side_effects: ["if kind==CONSENT and signed==true: Patient.photo_consent_on_file=true"]
  - method: GET
    path: "/aesthetics/consent-photos"
    description: "List photos, filterable by patient_id / treatment_session_id / kind"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["patient_id?", "treatment_session_id?", "kind?", "limit?", "offset?"]
    output: ConsentPhoto[]
    side_effects: []
  - method: GET
    path: "/aesthetics/consent-photos/{id}"
    description: "Get a single consent/before/after photo record"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: ConsentPhoto
    side_effects: []

  # --- TreatmentPlan ---
  - method: POST
    path: "/aesthetics/treatment-plans"
    description: "Propose a treatment plan/series from a completed exam"
    roles: [Provider]
    code: 201
    input: [patient_id, consultation_id, product, planned_sessions, planned_units_per_session, list_price_per_unit_cents, required_deposit_cents]
    output: TreatmentPlan
    side_effects: ["status=PROPOSED; deposit_paid_cents=0; finalized_series_cost_cents=0; recompute provisional_series_cost_cents"]
  - method: GET
    path: "/aesthetics/treatment-plans"
    description: "List treatment plans, filterable by patient_id / consultation_id / status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["patient_id?", "consultation_id?", "status?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []
  - method: GET
    path: "/aesthetics/treatment-plans/{id}"
    description: "Get a treatment plan with its cost ledger"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []
  - method: POST
    path: "/aesthetics/treatment-plans/{id}/activate"
    description: "Activate a plan once deposit and good-faith exam are satisfied"
    roles: [Provider]
    code: 200
    input: [expected_treatment_plan_version]
    output: TreatmentPlan
    side_effects: ["status=ACTIVE; recompute provisional_series_cost_cents; increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/aesthetics/treatment-plans/{id}/complete"
    description: "Complete a plan when no open sessions remain"
    roles: [Provider]
    code: 200
    input: [expected_treatment_plan_version]
    output: TreatmentPlan
    side_effects: ["status=COMPLETED; provisional_series_cost_cents=0; increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/aesthetics/treatment-plans/{id}/cancel"
    description: "Cancel a plan (cascade refund POSTED deposits + cancel BOOKED sessions)"
    roles: [ClinicAdmin]
    code: 200
    input: [expected_treatment_plan_version]
    output: TreatmentPlan
    side_effects: ["status=CANCELLED; cascade refund POSTED deposits; cascade cancel BOOKED sessions releasing reserved units; increments TreatmentPlan.version by 1"]

  # --- Deposit ---
  - method: POST
    path: "/aesthetics/deposits"
    description: "Post a deposit against a plan (OCC on plan)"
    roles: [ClinicAdmin]
    code: 201
    input: [treatment_plan_id, amount_cents, expected_treatment_plan_version]
    output: Deposit
    side_effects: ["status=POSTED; plan.deposit_paid_cents += amount_cents; increments TreatmentPlan.version by 1"]
  - method: GET
    path: "/aesthetics/deposits"
    description: "List deposits, filterable by treatment_plan_id / status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["treatment_plan_id?", "status?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []
  - method: GET
    path: "/aesthetics/deposits/{id}"
    description: "Get a deposit"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: Deposit
    side_effects: []

  # --- TreatmentSession ---
  - method: POST
    path: "/aesthetics/treatment-sessions"
    description: "Book a session (OCC on plan; FEFO-reserves lot units)"
    roles: [Provider]
    code: 201
    input: [treatment_plan_id, standing_order_id, injector_provider_id, injectable_lot_id, planned_units, "loyalty_points_redeemed?", expected_treatment_plan_version]
    output: TreatmentSession
    side_effects: ["status=BOOKED; FEFO-reserve planned_units across eligible lots; recompute provisional_series_cost_cents; increments TreatmentPlan.version by 1"]
  - method: GET
    path: "/aesthetics/treatment-sessions"
    description: "List sessions, filterable by treatment_plan_id / standing_order_id / injector_provider_id / injectable_lot_id / status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["treatment_plan_id?", "standing_order_id?", "injector_provider_id?", "injectable_lot_id?", "status?", "limit?", "offset?"]
    output: TreatmentSession[]
    side_effects: []
  - method: GET
    path: "/aesthetics/treatment-sessions/{id}"
    description: "Get a session"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: TreatmentSession
    side_effects: []
  - method: POST
    path: "/aesthetics/treatment-sessions/{id}/commit"
    description: "Commit a session (consume units, compute charge, earn/redeem loyalty)"
    roles: [Provider]
    code: 200
    input: ["actual_units?"]
    output: TreatmentSession
    side_effects: ["status=COMMITTED; convert reserve->consume, release leftover; compute final_charge_cents/balance_due_cents; loyalty earn/redeem; ledger sync to plan; recompute provider counts; increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/aesthetics/treatment-sessions/{id}/resolve"
    description: "Resolve a committed session (happy-path terminal)"
    roles: [Provider]
    code: 200
    input: []
    output: TreatmentSession
    side_effects: ["status=RESOLVED"]
  - method: POST
    path: "/aesthetics/treatment-sessions/{id}/cancel"
    description: "Cancel a booked session (release reserved units)"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: TreatmentSession
    side_effects: ["status=CANCELLED; release reserved units; recompute provisional_series_cost_cents"]
  - method: POST
    path: "/aesthetics/treatment-sessions/{id}/no-show"
    description: "Mark a booked session no-show (release reserved units)"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: TreatmentSession
    side_effects: ["status=NO_SHOW; release reserved units; recompute provisional_series_cost_cents"]

  # --- ComplicationCase ---
  - method: POST
    path: "/aesthetics/complication-cases"
    description: "Open a complication on a committed session"
    roles: [Provider]
    code: 201
    input: [treatment_session_id, severity]
    output: ComplicationCase
    side_effects: ["session->COMPLICATION_OPEN; ComplicationCase status=OPEN; injector_provider_id copied from session; recompute Provider.open_complication_count"]
  - method: GET
    path: "/aesthetics/complication-cases"
    description: "List complications, filterable by treatment_session_id / injector_provider_id / status"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: ["treatment_session_id?", "injector_provider_id?", "status?", "limit?", "offset?"]
    output: ComplicationCase[]
    side_effects: []
  - method: GET
    path: "/aesthetics/complication-cases/{id}"
    description: "Get a complication case"
    roles: [ClinicAdmin, Provider]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: []
  - method: POST
    path: "/aesthetics/complication-cases/{id}/open-touchup"
    description: "Open a touch-up round (MINOR/MODERATE only, under round cap)"
    roles: [Provider]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: ["status=IN_TOUCHUP; touchup_rounds += 1"]
  - method: POST
    path: "/aesthetics/complication-cases/{id}/touchup-failed"
    description: "Touch-up unsuccessful; loop case back to OPEN"
    roles: [Provider]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: ["status=OPEN (loop)"]
  - method: POST
    path: "/aesthetics/complication-cases/{id}/resolve"
    description: "Resolve a complication (REFUND compensation reverses charge + loyalty; CLINICAL leaves ledger unchanged)"
    roles: [Provider]
    code: 200
    input: [resolution_mode]
    output: ComplicationCase
    side_effects: ["status=RESOLVED; if REFUND: refund_cents set, reverse loyalty, subtract from plan.finalized_series_cost_cents; recompute Provider counts"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601 for all expiry/window checks"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type mismatch, invalid enum, or non-positive amount/units" }
  # --- Not found ---
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "MembershipPackage id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InjectableLot id does not exist" }
  - { id: ERR_CONSULTATION_NOT_FOUND, http: 404, condition: "Consultation id does not exist" }
  - { id: ERR_STANDING_ORDER_NOT_FOUND, http: 404, condition: "StandingOrder id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "TreatmentPlan id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "TreatmentSession id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "ComplicationCase id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_treatment_plan_version does not match current TreatmentPlan.version" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match current InjectableLot.version" }
  - { id: ERR_STALE_PROVIDER_VERSION, http: 412, condition: "expected_provider_version does not match current Provider.version" }
  - { id: ERR_STALE_STANDING_ORDER_VERSION, http: 412, condition: "expected_standing_order_version does not match current StandingOrder.version" }
  # --- State preconditions ---
  - { id: ERR_CONSULTATION_NOT_DRAFT, http: 409, condition: "Consultation not in the required state for this transition" }
  - { id: ERR_CONSULTATION_IN_USE, http: 409, condition: "Cannot void a consultation referenced by a PROPOSED/ACTIVE plan" }
  - { id: ERR_PLAN_NOT_PROPOSED, http: 409, condition: "Plan must be PROPOSED for this operation" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Plan must be ACTIVE for this operation" }
  - { id: ERR_PLAN_NOT_CANCELLABLE, http: 409, condition: "Plan not in a cancellable state (PROPOSED or ACTIVE)" }
  - { id: ERR_PLAN_HAS_COMMITTED_SESSIONS, http: 409, condition: "Plan has committed sessions and cannot be cancelled" }
  - { id: ERR_OPEN_SESSIONS_EXIST, http: 409, condition: "Plan has BOOKED/COMMITTED/COMPLICATION_OPEN sessions; cannot complete" }
  - { id: ERR_SESSION_NOT_BOOKED, http: 409, condition: "Session must be BOOKED for this operation" }
  - { id: ERR_SESSION_NOT_COMMITTED, http: 409, condition: "Session must be COMMITTED for this operation" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Complication case must be OPEN for this operation" }
  - { id: ERR_CASE_NOT_IN_TOUCHUP, http: 409, condition: "Complication case must be IN_TOUCHUP for this operation" }
  - { id: ERR_COMPLICATION_OPEN, http: 409, condition: "Session has an OPEN/IN_TOUCHUP complication and cannot be resolved" }
  # --- Business safety / compliance ---
  - { id: ERR_NO_GOOD_FAITH_EXAM, http: 409, condition: "Referenced consultation is not EXAM_COMPLETE (no good-faith exam)" }
  - { id: ERR_GOOD_FAITH_EXAM_EXPIRED, http: 409, condition: "Good-faith exam older than GOOD_FAITH_EXAM_VALIDITY_DAYS at booking time" }
  - { id: ERR_STANDING_ORDER_INACTIVE, http: 409, condition: "StandingOrder REVOKED or past valid_until_utc" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Session injector equals the standing order's signing director" }
  - { id: ERR_PROVIDER_NOT_ELIGIBLE, http: 409, condition: "Provider role_kind/status not eligible for the requested clinical action" }
  - { id: ERR_CONSENT_PHOTO_REQUIRED, http: 409, condition: "No signed CONSENT photo on file for patient before booking" }
  - { id: ERR_BEFORE_PHOTO_REQUIRED, http: 409, condition: "No BEFORE photo for session before commit" }
  - { id: ERR_AFTER_PHOTO_REQUIRED, http: 409, condition: "No AFTER photo for session before resolve" }
  # --- Business constraints ---
  - { id: ERR_PRODUCT_MISMATCH, http: 422, condition: "StandingOrder/TreatmentPlan/InjectableLot products disagree" }
  - { id: ERR_UNITS_EXCEED_ORDER, http: 422, condition: "Requested units exceed StandingOrder.max_units_authorized" }
  - { id: ERR_SEVERE_NO_TOUCHUP, http: 409, condition: "SEVERE complication cannot open a touch-up (refund-only)" }
  - { id: ERR_TOUCHUP_LIMIT_REACHED, http: 409, condition: "touchup_rounds already at MAX_TOUCHUP_ROUNDS" }
  - { id: ERR_LOYALTY_PROGRAM_MISMATCH, http: 422, condition: "Loyalty account program does not match patient's membership loyalty_program" }
  # --- Business fiscal / capacity ---
  - { id: ERR_DEPOSIT_REQUIRED, http: 402, condition: "deposit_paid_cents below required_deposit_cents at activation" }
  - { id: ERR_INSUFFICIENT_LOT_UNITS, http: 409, condition: "Available non-expired lot units below planned_units at booking" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Front-office/operations: patient & catalog setup, deposits, cancellations, lot intake/quarantine, clock control. Cannot perform clinical injections or sign orders. X-User-ID is an opaque operator id."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/providers — register provider"
      - "POST /aesthetics/providers/{id}/suspend — suspend provider"
      - "POST /aesthetics/membership-packages — create membership tier"
      - "POST /aesthetics/injectable-lots — intake lot"
      - "POST /aesthetics/injectable-lots/{id}/quarantine — quarantine lot"
      - "POST /aesthetics/patients — register patient"
      - "POST /aesthetics/loyalty-accounts — open loyalty account"
      - "POST /aesthetics/consultations/{id}/void — void consultation"
      - "POST /aesthetics/deposits — post deposit"
      - "POST /aesthetics/treatment-plans/{id}/cancel — cancel plan"
      - "POST /aesthetics/treatment-sessions/{id}/cancel — cancel session"
      - "POST /aesthetics/treatment-sessions/{id}/no-show — mark no-show"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET (all read/list endpoints)"
  - name: Provider
    description: "Licensed clinical staff (INJECTOR or MEDICAL_DIRECTOR). Performs exams, signs standing orders (MD), books/commits/resolves sessions and injects, manages complications and photos. X-User-ID is the acting Provider.id; segregation-of-duties is enforced on injector != director."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /aesthetics/standing-orders — sign standing order (MD)"
      - "POST /aesthetics/standing-orders/{id}/revoke — revoke order"
      - "POST /aesthetics/consultations — open consultation"
      - "POST /aesthetics/consultations/{id}/complete-exam — finalize good-faith exam"
      - "POST /aesthetics/consent-photos — record consent/before/after photo"
      - "POST /aesthetics/treatment-plans — propose plan"
      - "POST /aesthetics/treatment-plans/{id}/activate — activate plan"
      - "POST /aesthetics/treatment-plans/{id}/complete — complete plan"
      - "POST /aesthetics/treatment-sessions — book session"
      - "POST /aesthetics/treatment-sessions/{id}/commit — commit session"
      - "POST /aesthetics/treatment-sessions/{id}/resolve — resolve session"
      - "POST /aesthetics/complication-cases — open complication"
      - "POST /aesthetics/complication-cases/{id}/open-touchup — open touch-up"
      - "POST /aesthetics/complication-cases/{id}/touchup-failed — touch-up failed"
      - "POST /aesthetics/complication-cases/{id}/resolve — resolve complication"
    shared_operations:
      - "GET (all read/list endpoints)"

# =============================================================================
# Domain constants (referenced by calculations / validations)
# =============================================================================
domain_constants:
  GOOD_FAITH_EXAM_VALIDITY_DAYS: 365
  MAX_TOUCHUP_ROUNDS: 2
  POINT_VALUE_CENTS: 1
