            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id" }
            - call: "POST /fee-invoices/${fee1}/pay"
              payload: {}
