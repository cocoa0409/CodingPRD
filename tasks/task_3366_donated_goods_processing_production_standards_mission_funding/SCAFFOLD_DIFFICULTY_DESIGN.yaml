            - "the 1-lb ticket drives total_disposed_lbs to 101 and diversion_rate_bps to 7481 (floor(3000000/401))"
            - "diversion_compliant flips to false with no direct write to that field (derived link 3)"
            - "the lot creation is rejected with ERR_DIVERSION_BREACH (${breach_err})"

      - name: allocation_disburse_margin_health_gate
        grounds:
          - state_machines.FundingAllocation.APPROVED_to_DISBURSED
          - calculations.margin_health
          - calculations.margin_accrual
          - errors.ERR_MARGIN_RESERVE_BREACH
        distinguishing_aspect: |
          Depth-2 cascade triggered by disbursement (different trigger from instance 1):
          disburse debits retail_margin_pool_cents (link 1) and that pool mutation
          itself recomputes margin_health to LOW (link 2), which rejects the NEXT
          allocation create with ERR_MARGIN_RESERVE_BREACH.
        test_recipe:
          setup:
            - "Clock default (2026-09-01, inside the program window). Org (reserve_floor 1000) whose pool holds exactly 1940 from selling two grade-A items (margin 970 each: price 1000 - STANDARD cost 30). Program window 2026-01-01..2026-12-31. Allocation of 1500 created and approved."
