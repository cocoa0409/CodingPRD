      - name: active_loan_blocks_deaccession_decide
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_OBJECT_ON_ACTIVE_LOAN]
        distinguishing_aspect: "With the cultural-property gate satisfied (review completed), the referential gate is isolated: deciding APPROVE on a deaccession while the object sits OUT_ON_LOAN under an ACTIVE loan fails 409 ERR_OBJECT_ON_ACTIVE_LOAN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cultural-property object with an ACTIVE loan (declared 600000000, INSURANCE, courier true; OUTBOUND report ACCEPTED; activated)."
            - "DEACCESSION review (REPATRIATION, cultural_property_review_completed true) submitted by 'cur-d'."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "1979.0201", title: "Ceremonial Robe", declared_value_cents: 600000000, is_cultural_property: true }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Ethnological Museum", loan_start_date: "2026-10-01", loan_end_date: "2027-06-01", declared_value_cents: 600000000, coverage_type: "INSURANCE", courier_required: true }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Stable.", damage_noted: false }
              as: LoansOfficer
              captures: { cr_id: $.data.id }
            - call: "POST /campus/condition-reports/${cr_id}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan_id}/activate"
              payload: {}
              as: LoansOfficer
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "DEACCESSION", object_id: "${obj_id}", disposal_method: "REPATRIATION", cultural_property_review_completed: true }
              as: Curator
              as_user_id: "cur-d"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-d"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "chair-d"
              captures: { err: $.data.error_id }
          assert:
            - "decide fails err == ERR_OBJECT_ON_ACTIVE_LOAN (409) — the safety gate passed (review completed true), isolating the referential rule"
            - "CollectionReview.${rev_id}.status remains SUBMITTED; CollectionObject.${obj_id}.status remains OUT_ON_LOAN"

