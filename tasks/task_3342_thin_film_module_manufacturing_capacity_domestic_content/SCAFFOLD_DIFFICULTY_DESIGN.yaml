# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3342_thin_film_module_manufacturing_capacity_domestic_content
# Single top-level key: scaffold_difficulty_design
# Every grounds/endpoint/role/error resolves to SCAFFOLD.yaml §1.1–§1.7.
# Logical clock default: 2026-09-01T00:00:00Z (no set call needed for that base).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (>=2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: bin_energy_nominal_ignores_realized_yield
        grounds:
          - calculations.bin_energy_wh
          - entities.ModuleSeries.fields.bin_profile
          - entities.ProductionRun.fields.run_yield_rate
        distinguishing_aspect: |
          Entity domain = module energy modeling (ModuleSeries/ProductionRun).
          The nominal variant is computed from the declared bin_profile fractions
          and MUST NOT move when a ProductionRun with a divergent realized bin mix
          and sub-1.0 run yield is posted, while the actual-yield variant input
          (run_yield_rate == 0.8000) observably differs from 1.0 — so the two
          variants produce different energy figures for the same series.
        test_recipe:
          setup:
            - "ModuleSeries S6 with bin_profile fractions 0.4/0.6 and nominal_wattage 480.0 exists"
            - "A ProductionLine exists (COMMISSIONING, ramp_quarter_index 0) so a ProductionRun can be posted"
            - "No ProductionRun posted yet when the first energy-model read is taken"
          setup_api_calls:
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "HP", wattage: 480.0, fraction: 0.4 }, { bin_code: "ST", wattage: 475.0, fraction: 0.6 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /v1/module-series/${series_id}/energy-model"
              payload: {}
              as: PlantManager
              captures: { em_before: $.data.nominal_kwh_per_kw }
          trigger:
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 125, good_modules: 100, bin_counts: [{ bin_code: "HP", count: 30 }, { bin_code: "ST", count: 70 }] }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "GET /v1/module-series/${series_id}/energy-model"
              payload: {}
              as: PlantManager
              captures: { em_after: $.data.nominal_kwh_per_kw }
          assert:
            - "ProductionRun.${run_id}.run_yield_rate == 0.8000"
            - "energy-model nominal variant unchanged by realized run: ${em_after} == ${em_before}"
            - "energy-model response variant field == nominal (actual-yield variant never leaks into the financing read)"

      - name: printed_vs_adjusted_content_pct
        grounds:
          - calculations.domestic_content_qualification
          - entities.ComplianceAttestation.fields.printed_content_pct
          - entities.ComplianceAttestation.fields.adjusted_content_pct
          - entities.ComplianceAttestation.fields.manufactured_products_pct
          - state_machines.ComplianceAttestation.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity domain = domestic-content compliance (ComplianceAttestation), a
          different domain than module energy modeling. Printed and adjusted cost
          variants are both frozen at submit and MUST differ by exactly the
          ADJUSTMENT_USD (4.0) additive term: printed 210/500 == 0.4200 vs
          adjusted 214/504 == 0.4246. manufactured_products_pct must exclude the
          PENDING_INSPECTION lot (400/1000 == 0.4000, not 1400/2000).
        test_recipe:
          setup:
            - "ProductionLine OH-L3 (site_country US) exists"
            - "ComponentLot L1 US VERIFIED cost 400.0; L2 CN VERIFIED cost 600.0; L3 US PENDING_INSPECTION cost 1000.0 (must be excluded from manufactured_products_pct)"
            - "Attestation with domestic costs summing to 210 and total_manufactured_cost_usd 500.0 in DRAFT"
          setup_api_calls:
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "SupCo", lot_code: "LOT-US-400", component_type: "SEMICONDUCTOR_FEEDSTOCK", country_of_origin: "US", lot_cost_usd: 400.0 }
              as: SupplyChainAuditor
              captures: { lot_us: $.data.id }
            - call: "POST /v1/component-lots/${lot_us}/verify"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "GlassCo", lot_code: "LOT-CN-600", component_type: "GLASS", country_of_origin: "CN", lot_cost_usd: 600.0 }
              as: SupplyChainAuditor
              captures: { lot_cn: $.data.id }
            - call: "POST /v1/component-lots/${lot_cn}/verify"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "FrameCo", lot_code: "LOT-US-PEND", component_type: "FRAME", country_of_origin: "US", lot_cost_usd: 1000.0 }
              as: SupplyChainAuditor
            - call: "POST /v1/compliance-attestations"
              payload: { line_id: "${line_id}", period_year: 2026, labor_cost_usd: 100.0, feedstock_cost_usd: 50.0, glass_cost_usd: 30.0, balance_of_system_cost_usd: 20.0, overhead_cost_usd: 10.0, total_manufactured_cost_usd: 500.0 }
              as: ComplianceOfficer
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /v1/compliance-attestations/${att_id}/submit"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "ComplianceAttestation.${att_id}.status == SUBMITTED"
            - "ComplianceAttestation.${att_id}.printed_content_pct == 0.4200"
            - "ComplianceAttestation.${att_id}.adjusted_content_pct == 0.4246"
            - "ComplianceAttestation.${att_id}.adjusted_content_pct != ComplianceAttestation.${att_id}.printed_content_pct"
            - "ComplianceAttestation.${att_id}.manufactured_products_pct == 0.4000"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (>=2 instances in DIFFERENT modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: ramp_exit_requires_yield_and_quarter_gate
        grounds:
          - calculations.ramp_yield_rate
          - state_machines.ProductionLine.RAMPING_to_AT_CAPACITY
          - entities.ProductionLine.fields.actual_yield_rate
        distinguishing_aspect: |
          Mode (a) — >=3 inputs (ramp_quarter_index, actual_yield_rate, ramp
          constants) with non-linear conditional interaction: a quarter with
          actual yield 0.9000 >= RAMP_EXIT (0.85) does NOT promote the line while
          ramp_quarter_index (before increment) < 2; the identical yield promotes
          it once the gate quarter is reached.
        test_recipe:
          setup:
            - "ProductionLine OH-L3 RAMPING after first-article run (quarter 0, yield 0.9000)"
            - "Each subsequent quarter posts a run with identical 0.9000 yield"
          setup_api_calls:
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 90, bin_counts: [{ bin_code: "B1", count: 45 }, { bin_code: "B2", count: 45 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 1, input_modules: 100, good_modules: 90, bin_counts: [{ bin_code: "B1", count: 45 }, { bin_code: "B2", count: 45 }] }
              as: PlantManager
          trigger:
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
              captures: { close2_promoted: $.data.lines_promoted }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_status_q1: $.data.status, line_yield_q1: $.data.actual_yield_rate }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 2, input_modules: 100, good_modules: 90, bin_counts: [{ bin_code: "B1", count: 45 }, { bin_code: "B2", count: 45 }] }
              as: PlantManager
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
              captures: { close3_promoted: $.data.lines_promoted }
          assert:
            - "second close (quarter index 1 before increment, yield 0.9000 >= 0.85): lines_promoted == 0 (${close2_promoted} == 0)"
            - "ProductionLine.${line_id}.status after second close == RAMPING (${line_status_q1} == RAMPING)"
            - "ProductionLine.${line_id}.actual_yield_rate == 0.9000 (${line_yield_q1} == 0.9000)"
            - "third close (quarter index 2 before increment, yield 0.9000): lines_promoted == 1 (${close3_promoted} == 1)"
            - "ProductionLine.${line_id}.status after third close == AT_CAPACITY"

      - name: performance_liquidation_pinned_rounding
        grounds:
          - calculations.warranty_liquidated_amount
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - entities.WarrantyClaim.fields.claim_amount_usd
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: guaranteed_energy_kwh is
          rounded per-claim first (round(claimed_mw * 1000 * 1700.0, 2) ==
          3400000.00), then the shortfall is subtracted (400000.00), then
          multiplied by the liquidated rate and rounded once
          (round(400000.00 * 0.05, 2) == 20000.00) — never sum unrounded
          components.
        test_recipe:
          setup:
            - "Customer C (TIER_A, tax_credit_flag false) with ACTIVE reservation R: contracted_mw 10.0, price_usd_per_w 0.25, deposit_usd 200000.0, term_years 1, delivery_year 2027, on line OH-L3 (100 MW) running series S6"
            - "Line commissioned via first-article run then RAMPING"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/warranty-claims"
              payload: { reservation_id: "${res_id}", claim_type: "PERFORMANCE_SHORTFALL", claimed_mw: 2.0, measured_energy_kwh: 3000000.0 }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /v1/warranty-claims/${claim_id}/review"
              payload: {}
              as: WarrantyAdministrator
          trigger:
            - call: "POST /v1/warranty-claims/${claim_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: WarrantyAdministrator
          assert:
            - "WarrantyClaim.${claim_id}.status == APPROVED"
            - "WarrantyClaim.${claim_id}.claim_amount_usd == 20000.00"

      - name: forfeiture_pinned_evaluation_order
        grounds:
          - calculations.deposit_forfeiture
          - entities.CapacityReservation.fields.deposit_forfeited_usd
          - state_machines.CapacityReservation.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Mode (c) — circular-looking deposit refund dependency resolved by the
          pinned evaluation order: delivered_value (5 MW * 1e6 * 0.25 ==
          1250000.00) < PERFORMANCE_FLOOR * contract_value (0.80 * 2500000.00 ==
          2000000.00), so forfeit = MIN(200000.00, 0.15 * (2500000.00 -
          1250000.00)) = 187500.00 and only then refund = deposit - forfeit.
        test_recipe:
          setup:
            - "Customer C (TIER_A) reservation R ACTIVE: contracted_mw 10.0, price_usd_per_w 0.25, deposit_usd 200000.0, delivery_year 2027, term_years 1"
            - "One delivery of 5.0 MW confirmed DELIVERED (delivered_mw == 5.0) with VERIFIED lot"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "GlassCo", lot_code: "LOT-US-1", component_type: "GLASS", country_of_origin: "US", lot_cost_usd: 400.0 }
              as: SupplyChainAuditor
              captures: { lot_id: $.data.id }
            - call: "POST /v1/component-lots/${lot_id}/verify"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/deliveries"
              payload: { reservation_id: "${res_id}", scheduled_window_start: "2027-03-01T00:00:00Z", scheduled_window_end: "2027-04-01T00:00:00Z", volume_mw: 5.0, lot_ids: ["${lot_id}"] }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { del_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-15T00:00:00Z" }
              as: PlantManager
            - call: "POST /v1/deliveries/${del_id}/confirm"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /v1/capacity-reservations/${res_id}/cancel"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "CapacityReservation.${res_id}.status == CANCELLED"
            - "CapacityReservation.${res_id}.delivered_mw == 5.0"
            - "CapacityReservation.${res_id}.deposit_forfeited_usd == 187500.00"
            - "CapacityReservation.${res_id}.deposit_usd == 200000.00"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (>=2 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: line_capacity_to_ramping_reintroduce_cycle
        grounds:
          - state_machines.ProductionLine.AT_CAPACITY_to_RAMPING
          - entities.ProductionLine.fields.ramp_quarter_index
          - entities.ProductionLine.fields.actual_yield_rate
        distinguishing_aspect: |
          Entity = ProductionLine, cyclic shape: after promotion to AT_CAPACITY,
          reintroduce with a different ACTIVE series loops the line back to
          RAMPING and resets ramp_quarter_index to 0 and actual_yield_rate to
          null — a state cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "ProductionLine OH-L3 promoted to AT_CAPACITY (three closed quarters, last-quarter yield 0.9000, quarter index gate met)"
            - "Second ModuleSeries S7 (ACTIVE, different from the line's most recent run series S6)"
          setup_api_calls:
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 90, bin_counts: [{ bin_code: "B1", count: 45 }, { bin_code: "B2", count: 45 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 1, input_modules: 100, good_modules: 90, bin_counts: [{ bin_code: "B1", count: 45 }, { bin_code: "B2", count: 45 }] }
              as: PlantManager
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 2, input_modules: 100, good_modules: 90, bin_counts: [{ bin_code: "B1", count: 45 }, { bin_code: "B2", count: 45 }] }
              as: PlantManager
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
            - call: "POST /v1/module-series"
              payload: { series_code: "S7", technology: "CDTE_THIN_FILM_CUTE", nominal_wattage: 490.0, bin_profile: [{ bin_code: "C1", wattage: 490.0, fraction: 0.6 }, { bin_code: "C2", wattage: 480.0, fraction: 0.4 }], temp_coefficient: -0.0026 }
              as: PlantManager
              captures: { series7_id: $.data.id }
          trigger:
            - call: "POST /v1/production-lines/${line_id}/reintroduce"
              payload: { series_id: "${series7_id}" }
              as: PlantManager
          assert:
            - "ProductionLine.${line_id}.status == RAMPING (cycled back from AT_CAPACITY)"
            - "ProductionLine.${line_id}.ramp_quarter_index == 0"
            - "ProductionLine.${line_id}.actual_yield_rate == null"

      - name: delivery_parallel_schedule_content_dims
        grounds:
          - state_machines.Delivery.SCHEDULED_to_RESCHEDULED
          - state_machines.ComplianceAttestation.SUBMITTED_to_QUALIFIED
          - entities.Delivery.fields.schedule_status
          - entities.Delivery.fields.content_status
        distinguishing_aspect: |
          Entity = Delivery, parallel state dimensions: attestation adjudication
          flips content_status UNEVALUATED -> QUALIFIED_DOMESTIC while
          schedule_status stays SCHEDULED; a later window PATCH flips
          schedule_status SCHEDULED -> RESCHEDULED while content_status stays
          QUALIFIED_DOMESTIC — the two dimensions evolve independently on one row.
        test_recipe:
          setup:
            - "Customer C (TIER_A, tax_credit_flag TRUE) with ACTIVE reservation R on line OH-L3 (site_country US)"
            - "VERIFIED US lot (400.0) on delivery D (SCHEDULED); VERIFIED CN lot (600.0) makes manufactured_products_pct == 0.4000"
            - "Attestation for the line with domestic sum 210 / total 500 (printed 0.4200) SUBMITTED"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: true }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
