              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { ua: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "102", square_feet: 800 }
              as: PropertyManager
              captures: { ub: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${ua}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { ta: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${ta}", category: "REPAIR", description: "base A", estimated_cost_cents: 100000 }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${ta}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${ub}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { tb: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${tb}", category: "REPAIR", description: "base B", estimated_cost_cents: 100000 }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${tb}/finalize-scope"
              payload: {}
              as: TurnCoordinator
          trigger:
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${ta}", category: "CLEAN", description: "at threshold", estimated_cost_cents: 10000 }
              as: TurnCoordinator
