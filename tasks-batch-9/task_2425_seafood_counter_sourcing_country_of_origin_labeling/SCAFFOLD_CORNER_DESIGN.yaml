      - name: terminal_states_reject_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SimpDocument.terminal_states
          - state_machines.SustainabilityCertification.terminal_states
          - state_machines.AdvertisedItem.status.terminal_states
          - state_machines.ShrinkEvent.terminal_states
          - state_machines.ComplianceViolation.terminal_states
          - errors.ERR_SIMP_STATE_INVALID
          - errors.ERR_CERTIFICATION_STATE_INVALID
          - errors.ERR_SHRINK_STATE_INVALID
          - errors.ERR_VIOLATION_STATE_INVALID
        distinguishing_aspect: |
          Five terminal states must be absorbing: an ACCEPTED import document cannot be
          resubmitted, a REVOKED certification cannot be enforced again, a CLOSED
          advertisement cannot be retracted, a REVERSED shrink event cannot be re-posted and
          an EXPUNGED violation cannot be cured -- each answering with its own machine's code.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z, advanced to 2026-08-01T11:00:00Z and then to 2026-08-01T14:00:00Z"
            - "Atlantic Cod SupplierLot cased into slot 1 with a PUBLISHED CaseLabel, which the publish precondition requires"
            - "SimpDocument driven DRAFT -> SUBMITTED -> ACCEPTED"
            - "SustainabilityCertification driven PENDING_REVIEW -> REVOKED by a REJECT review"
            - "AdvertisedItem driven DRAFT -> APPROVED -> PUBLISHED -> CLOSED while the counter is still OPEN"
            - "ShrinkEvent driven VALUED -> POSTED -> REVERSED"
            - "ColdChainExcursion on slot 1 resolved DISPOSE, which creates the COLD_CHAIN ComplianceViolation, which is then EXPUNGED"
