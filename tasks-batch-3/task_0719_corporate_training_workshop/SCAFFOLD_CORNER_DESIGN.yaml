# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Corporate Training & Workshop Delivery
# Single top-level key: scaffold_corner_design
# Breadth probe; sections/claim_types from references/claim-extraction-guide.md.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Program
          - endpoints."POST /training/programs"
        distinguishing_aspect: "POST /training/programs with required fields returns 201, status=DRAFT, active_version_id=null, ceu_credits default 0, is_custom default false."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /training/programs"
              payload: { title: "Intro", category: "LEADERSHIP", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id, st: $.data.status, ceu: $.data.ceu_credits, custom: $.data.is_custom, av: $.data.active_version_id }
          assert:
            - "Response status == 201"
            - "Program.status == DRAFT"
            - "Program.ceu_credits == 0 and Program.is_custom == false"
            - "Program.active_version_id == null"

      - name: get_program_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Program
          - endpoints."GET /training/programs/{id}"
        distinguishing_aspect: "GET /training/programs/{id} returns the entity stored at creation with matching title and category."
        test_recipe:
          setup:
            - "One program created"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Stored Prog", category: "TECHNICAL", delivery_mode: "HYBRID" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /training/programs/${prog_id}"
              payload: {}
              as: ProgramDesigner
              captures: { t: $.data.title, c: $.data.category }
          assert:
            - "Program.title == 'Stored Prog'"
            - "Program.category == TECHNICAL"

      - name: list_programs_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Program
          - endpoints."GET /training/programs"
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /training/programs returns a paginated array envelope carrying total_count and has_more."
        test_recipe:
          setup:
            - "Two programs created"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "P1", category: "SALES", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
            - call: "POST /training/programs"
              payload: { title: "P2", category: "SALES", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
          trigger:
            - call: "GET /training/programs"
              payload: { limit: 1, offset: 0 }
              as: ProgramDesigner
              captures: { rows: $.data }
          assert:
            - "response envelope includes total_count == 2 and has_more == true with limit 1"

      - name: get_program_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Program
          - endpoints."GET /training/programs/{id}"
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /training/programs/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /training/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramDesigner
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_program_version_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.ProgramVersion.fields.pricing_model
          - endpoints."POST /training/program-versions"
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /training/program-versions omitting required pricing_model returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A program exists"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Req Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 4 }
              as: ProgramDesigner
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST (pricing_model missing)"

      - name: create_facilitator_default_status_active
        claim_type: Defaults
        grounds:
          - entities.Facilitator.fields.status
          - entities.Facilitator.fields.travel_base_cents
          - endpoints."POST /training/facilitators"
        distinguishing_aspect: "Creating a facilitator without travel_base_cents applies default 0 and status defaults to ACTIVE."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /training/facilitators"
              payload: { full_name: "Def Fac", email: "deffac@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { st: $.data.status, tb: $.data.travel_base_cents }
          assert:
            - "Facilitator.status == ACTIVE"
            - "Facilitator.travel_base_cents == 0"

      - name: assessment_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Assessment.fields.percent_score
          - entities.Assessment.fields.outcome
          - endpoints."POST /training/registrations/{id}/assessments"
        distinguishing_aspect: "percent_score and outcome are server-computed from raw/max; only raw_score and max_score are accepted inputs (percent_score is not a settable field)."
        test_recipe:
          setup:
            - "RUNNING ONSITE cohort with one ATTENDED-eligible CONFIRMED registration, pass_threshold_pct=70"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Comp Prog", category: "TECHNICAL", delivery_mode: "ONSITE" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 4, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1, pass_threshold_pct: 70 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac C", email: "facc@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 2, delivery_mode: "ONSITE", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T13:00:00Z", enroll_deadline: "2026-06-30T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "cc@x.com", learner_name: "CC" }
              as: SchedulingCoordinator
              captures: { reg1: $.data.id }
            - call: "POST /training/registrations/${reg1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "cc@x.com"
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/start"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/registrations/${reg1}/mark-attendance"
              payload: {}
              as: Facilitator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /training/registrations/${reg1}/assessments"
              payload: { raw_score: 90, max_score: 100 }
              as: Facilitator
              as_user_id: "${fac_id}"
              captures: { pct: $.data.percent_score, out: $.data.outcome }
          assert:
            - "Assessment.percent_score == 90.00 (computed, not supplied)"
            - "Assessment.outcome == PASS"

      - name: evaluation_immutable_entity_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Evaluation
          - endpoints."POST /training/registrations/{id}/evaluation"
        distinguishing_aspect: "Evaluation has common_fields:false — it is append-only with only id/created_at, no update endpoint and no version field on its read shape."
        test_recipe:
          setup:
            - "A DELIVERED cohort with one ATTENDED registration eligible to submit an evaluation"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Eval Prog", category: "SALES", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 2, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac EV", email: "facev@x.com", certified_categories: ["SALES"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 2, delivery_mode: "VIRTUAL", starts_at: "2026-07-02T09:00:00Z", ends_at: "2026-07-02T11:00:00Z", enroll_deadline: "2026-07-01T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "ev@x.com", learner_name: "EV" }
              as: SchedulingCoordinator
              captures: { reg1: $.data.id }
            - call: "POST /training/registrations/${reg1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "ev@x.com"
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/start"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/registrations/${reg1}/mark-attendance"
              payload: {}
              as: Facilitator
              as_user_id: "${fac_id}"
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T11:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /training/registrations/${reg1}/evaluation"
              payload: { nps_rating: 9, comment: "great" }
              as: Learner
              as_user_id: "ev@x.com"
              captures: { eid: $.data.id }
          assert:
            - "Evaluation created with status 201 and an id and created_at; nps_rating == 9"
            - "No POST/PUT update endpoint exists for Evaluation (append-only)"

      - name: cohort_create_invalid_reference_program_not_version
        claim_type: Parent Relationships
        grounds:
          - entities.Cohort.fields.program_version_id
          - validations[priority=4]
          - errors[ERR_INVALID_REFERENCE]
          - endpoints."POST /training/cohorts"
        distinguishing_aspect: "Passing a Program id where program_version_id (a ProgramVersion FK) is expected returns ERR_INVALID_REFERENCE (422) — wrong-type FK."
        test_recipe:
          setup:
            - "A program and a facilitator exist; no program version created"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Ref Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac Ref", email: "facref@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${prog_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 3, delivery_mode: "VIRTUAL", starts_at: "2026-07-03T09:00:00Z", ends_at: "2026-07-03T11:00:00Z", enroll_deadline: "2026-07-02T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REFERENCE (program_version_id points at a Program)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cohort_initial_state_is_scheduled
        claim_type: Initial State
        grounds:
          - state_machines.Cohort
          - endpoints."POST /training/cohorts"
        distinguishing_aspect: "A newly created Cohort starts in SCHEDULED with seat counters all 0 and version 1."
        test_recipe:
          setup:
            - "APPROVED version and facilitator exist"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Init Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 2, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac In", email: "facin@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 3, delivery_mode: "VIRTUAL", starts_at: "2026-07-04T09:00:00Z", ends_at: "2026-07-04T11:00:00Z", enroll_deadline: "2026-07-03T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { st: $.data.status, sr: $.data.seats_reserved, sc: $.data.seats_confirmed, ver: $.data.version }
          assert:
            - "Cohort.status == SCHEDULED"
            - "Cohort.seats_reserved == 0 and seats_confirmed == 0 and seats_waitlisted == 0"
            - "Cohort.version == 1"

      - name: cohort_start_before_starts_at_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Cohort.LOCKED_to_RUNNING
          - errors[ERR_BEFORE_START]
        distinguishing_aspect: "Starting a LOCKED cohort while clock < starts_at returns ERR_BEFORE_START (409)."
        test_recipe:
          setup:
            - "LOCKED cohort, clock still at default 2026-03-01 (before starts_at 2026-07-05)"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Early Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 2, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac Er", email: "facer@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 2, delivery_mode: "VIRTUAL", starts_at: "2026-07-05T09:00:00Z", ends_at: "2026-07-05T11:00:00Z", enroll_deadline: "2026-07-04T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "er@x.com", learner_name: "ER" }
              as: SchedulingCoordinator
              captures: { reg1: $.data.id }
            - call: "POST /training/registrations/${reg1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "er@x.com"
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
          trigger:
            - call: "POST /training/cohorts/${coh_id}/start"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_BEFORE_START"

      - name: cohort_lock_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Cohort.OPEN_to_LOCKED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Locking a SCHEDULED (not yet OPEN) cohort is not a defined transition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "SCHEDULED cohort (never opened)"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Inv Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 2, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac IV", email: "faciv@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 2, delivery_mode: "VIRTUAL", starts_at: "2026-07-06T09:00:00Z", ends_at: "2026-07-06T11:00:00Z", enroll_deadline: "2026-07-05T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
          trigger:
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE (lock only defined from OPEN)"

      - name: contract_close_from_closed_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EnterpriseContract.ACTIVE_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An already-CLOSED contract (terminal) rejects a second close with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A contract created then closed (no cohorts referencing it)"
          setup_api_calls:
            - call: "POST /training/contracts"
              payload: { client_name: "Term Co", budget_cents: 1000 }
              as: FinanceManager
              captures: { ctr_id: $.data.id }
            - call: "POST /training/contracts/${ctr_id}/close"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /training/contracts/${ctr_id}/close"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE (CLOSED is terminal)"

      - name: program_version_double_submit_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ProgramVersion.DRAFT_to_IN_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting an already IN_REVIEW version a second time returns ERR_INVALID_STATE (409) — submit is not idempotent."
        test_recipe:
          setup:
            - "A DRAFT version with complete pricing, submitted once (now IN_REVIEW)"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Idem Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 2, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
          trigger:
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: approve_supersedes_prior_version_crossentity
        claim_type: Cross-entity
        grounds:
          - state_machines.ProgramVersion.IN_REVIEW_to_APPROVED
          - state_machines.ProgramVersion.APPROVED_to_SUPERSEDED
          - entities.Program.fields.active_version_id
          - entities.Program.fields.status
        distinguishing_aspect: "Approving a second version of a program supersedes the prior APPROVED version (SUPERSEDED), repoints Program.active_version_id, and Program is PUBLISHED."
        test_recipe:
          setup:
            - "Program with version v1 already APPROVED (Program PUBLISHED, active_version_id=v1); a second DRAFT v2 submitted to IN_REVIEW"
          setup_api_calls:
