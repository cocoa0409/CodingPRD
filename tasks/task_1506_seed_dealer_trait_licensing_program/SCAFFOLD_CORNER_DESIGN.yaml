      - name: plot_publish_blocked_until_min_replications_harvested
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_PLOT_REPLICATIONS]", state_machines.PlotTrial.HARVESTED_to_PUBLISHED]
        distinguishing_aspect: "min_plot_replications = 2: with only one HARVESTED trial the publish fails; harvesting a second trial (on another field, avoiding the overlap rule) unlocks it."
        test_recipe:
          setup: ["program OPEN (min_plot_replications 2); grower; fields F1 F2; variety SOY-V2; plot1 on F1 HARVESTED"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
