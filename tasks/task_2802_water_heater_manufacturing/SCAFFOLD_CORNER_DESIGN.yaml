      - name: warranty_filing_and_reserve_guards_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 34]
          - validations[priority 30]
          - errors[ERR_UNIT_NOT_IN_SERVICE]
          - errors[ERR_WARRANTY_RESERVE_INSUFFICIENT]
