        distinguishing_aspect: "The candidate pool is provably empty - no volunteer exists at all - yet matching a DRAFT request answers 409 ERR_INVALID_REQUEST_STATE at priority 20, not 422 ERR_NO_ELIGIBLE_VOLUNTEER at priority 57, and crucially failed_match_rounds stays 0 because the round never ran."
        test_recipe:
          setup: ["One partner, one cycle and one DRAFT request; no volunteers in the system."]
