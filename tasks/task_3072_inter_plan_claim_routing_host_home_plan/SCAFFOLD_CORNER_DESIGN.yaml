# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3072_inter_plan_claim_routing_host_home_plan
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: plan_create_returns_defaults_pending_and_version_one
        claim_type: Creation
        grounds:
          - entities.Plan
          - endpoints.POST_/v1/plans
        distinguishing_aspect: "A plan created with plan_code, legal_name, service_area_states comes back 201 with brand_license_status PENDING (never client-supplied), version 1, computed balances 0, and system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - &c_plan_h
              call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Plan.${h_id}.brand_license_status == PENDING"
            - "Plan.${h_id}.version == 1"
            - "Plan.${h_id}.claims_paid_balance_cents == 0 and fees_receivable_balance_cents == 0"
            - "response data carries non-null id, created_at, updated_at"

      - name: member_create_defaults_active_and_links_home_plan
        claim_type: Defaults
        grounds:
          - entities.Member
          - endpoints.POST_/v1/members
        distinguishing_aspect: "Member creation defaults eligibility_status to ACTIVE and persists home_plan_id; national_account_id may be null."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Plan H exists."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
          trigger:
            - &c_member
              call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
          assert:
            - "response status 201"
            - "Member.${m_id}.eligibility_status == ACTIVE"
            - "Member.${m_id}.home_plan_id == ${h_id}"
            - "Member.${m_id}.national_account_id is null"

      - name: claim_create_copies_home_plan_from_member
        claim_type: Computed Fields
        grounds:
          - entities.Claim.fields.home_plan_id
          - entities.Claim.fields.status
          - endpoints.POST_/v1/claims
        distinguishing_aspect: "Claim.home_plan_id is system-copied from Member.home_plan_id at submission — a client cannot set it; claim starts in RECEIVED."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - &c_plan_t
              call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - &c_act_h
              call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - &c_act_t
              call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - *c_member
          trigger:
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
          assert:
            - "response status 201"
            - "Claim.${c_id}.status == RECEIVED"
            - "Claim.${c_id}.home_plan_id == ${h_id} (copied from Member, not from request)"
            - "Claim.${c_id}.provisional_allowed_cents == 20000 (no rate schedule exists -> fallback to billed amount)"

      - name: plan_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/v1/plans/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated plan id produces ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /v1/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: claims_list_paginates_and_filters_by_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/claims
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two claims (one RECEIVED, one PRICED), status filter returns exactly the matching subset and limit/offset paginate with total_count and has_more."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Members M1, M2 home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). Claim C1 left RECEIVED; claim C2 priced to PRICED."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M2", full_name: "Pat Two", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m2_id: $.data.id }
            - &c_rate
              call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { member_id: "${m2_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-11", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /v1/claims/${c2_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /v1/claims"
              payload: { status: "RECEIVED" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "GET /v1/claims"
              payload: { host_plan_id: "${t_id}", limit: 1, offset: 0 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "status=RECEIVED filter returns exactly 1 row (claim ${c1_id}) with total_count == 1"
            - "host_plan_id filter with limit=1&offset=0 returns 1 row, total_count == 2, has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: claim_pricing_provisional_fallback_to_billed_amount
        claim_type: Valid Transition
        grounds:
          - state_machines.Claim.RECEIVED_to_PRICED
          - calculations.claim_pricing
          - errors.ERR_RATE_SCHEDULE_MISSING
        distinguishing_aspect: "Two-step behavior on one claim: submission without any matching rate window falls back to billed_amount_cents for provisional; pricing with no window covering the pricing date fails with ERR_RATE_SCHEDULE_MISSING; after a window covering the pricing date is added, pricing succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. No rate schedule for NPI 1234567890 proc 99213 at claim submission. Claim billed 20000 service 2026-08-10."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
            - *c_rate
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "first price call returns ERR_RATE_SCHEDULE_MISSING with HTTP 422 (final variant hard-fails)"
            - "Claim.${c_id}.provisional_allowed_cents == 20000 (provisional variant fell back to billed)"
            - "after adding the rate window, second price call succeeds: status PRICED, priced_allowed_cents == 20000 (min(20000, 30000))"

      - name: pay_on_routed_claim_rejected_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Claim.BENEFIT_DETERMINED_to_PAID
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Pay is only defined from BENEFIT_DETERMINED; calling pay on a ROUTED claim is rejected with ERR_INVALID_STATE and no balances change."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). Fee schedule H->T [2026-01-01,2026-12-31] cap 10000 fee 150 rate 0.02 discount 0. Claim billed 20000 service 2026-08-10 routed."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - &c_fee
              call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - &c_claim
              call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - &c_price
              call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - &c_route
              call: "POST /v1/claims/${c_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /v1/claims/${c_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "Claim.${c_id}.status remains ROUTED"
            - "host Plan.${t_id}.claims_paid_balance_cents == 0"

      - name: deny_from_routed_is_terminal_and_blocks_pay
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim.ROUTED_to_DENIED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A denied claim reaches the DENIED terminal state; every further transition (pay, price, route) is rejected and no settlement line ever includes it."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 routed, then denied by the home plan."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - call: "POST /v1/claims/${c_id}/deny"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /v1/claims/${c_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Claim.${c_id}.status == DENIED after the deny"
            - "pay on the DENIED claim returns ERR_INVALID_STATE with HTTP 409"
            - "host Plan.${t_id}.claims_paid_balance_cents == 0 and fees_receivable_balance_cents == 0"

      - name: revoked_plan_cascades_controlled_accounts_to_terminated
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Plan.LICENSED_to_REVOKED
          - state_machines.NationalAccount.ACTIVE_to_TERMINATED
        distinguishing_aspect: "Revoking a LICENSED plan cascades every NationalAccount it controls from ACTIVE to TERMINATED in the same request."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Plan H LICENSED. NationalAccount NA controlled by H, ACTIVE. No open claims reference H."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_act_h
            - call: "POST /v1/national-accounts"
              payload: { controlling_plan_id: "${h_id}", account_name: "Acme Corp", employer_group_id: "ACME-1", territory_states: ["TX"], effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
              captures: { na_id: $.data.id }
            - call: "POST /v1/national-accounts/${na_id}/activate"
              payload: {}
              as: AssociationAdmin
          trigger:
            - call: "POST /v1/plans/${h_id}/revoke-license"
              payload: {}
              as: AssociationAdmin
          assert:
            - "Plan.${h_id}.brand_license_status == REVOKED"
            - "NationalAccount.${na_id}.status == TERMINATED (cascaded by the revoke)"

      - name: adjustment_reject_reverts_claim_to_paid_without_balance_change
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Adjustment.INITIATED_to_REJECTED
          - state_machines.Claim.PAID_to_ADJUSTMENT_PENDING
        distinguishing_aspect: "Rejecting an INITIATED adjustment reverts the claim ADJUSTMENT_PENDING -> PAID with zero balance movement — the compensation path leaves no drift."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 PAID; adjustment delta -5000 created (claim now ADJUSTMENT_PENDING)."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - &c_db
              call: "POST /v1/claims/${c_id}/determine-benefit"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - &c_pay
              call: "POST /v1/claims/${c_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_ver_paid: $.data.version }
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "disputed", delta_allowed_cents: -5000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /v1/adjustments/${a_id}/reject"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
          assert:
            - "Adjustment.${a_id}.status == REJECTED"
            - "Claim.${c_id}.status == PAID and current_allowed_cents == 20000 (unchanged)"
            - "host Plan.${t_id}.claims_paid_balance_cents == 20000 (no recovery applied on reject)"

      - name: eligibility_inquiry_answered_with_member_status
        claim_type: Valid Transition
        grounds:
          - state_machines.EligibilityInquiry.ROUTED_to_ANSWERED
        distinguishing_aspect: "An inquiry answered by the home plan reports the member's current eligibility_status; answering a second time is rejected as invalid state."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H with member_number M1, eligibility ACTIVE. Inquiry filed by T to H for member_number M1."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/eligibility-inquiries"
              payload: { inquiring_plan_id: "${t_id}", home_plan_id: "${h_id}", member_number: "M1" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /v1/eligibility-inquiries/${q_id}/answer"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/eligibility-inquiries/${q_id}/answer"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first answer succeeds: EligibilityInquiry.${q_id}.status == ANSWERED and answer_eligibility_status == ACTIVE"
            - "second answer returns ERR_INVALID_STATE with HTTP 409 (idempotency via terminal-state lockdown)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: access_fee_tier1_flat_below_cap
        claim_type: Correct Result
        grounds:
          - calculations.access_fee_computation
        distinguishing_aspect: "Allowed amount strictly below the tier1 cap takes the flat fee exactly — tier selection on the low side of the boundary."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 8000 proc 99213 T [2026-01-01,2027-01-01). Fee schedule H->T [2026-01-01,2026-12-31] cap 10000 fee 150 rate 0.02 discount 0. Claim billed 50000 service 2026-08-10 -> allowed 8000 (< cap)."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 8000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - *c_fee
            - *c_claim
            - *c_price
          trigger:
            - *c_route
          assert:
            - "Claim.${c_id}.access_fee_cents == 150 (flat tier)"
            - "Claim.${c_id}.admin_charge_cents == 400 (single bracket: round_half_up(8000 * 0.05) = 400)"

      - name: settlement_sweep_input_set_excludes_unpaid_and_out_of_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.settlement_sweep
        distinguishing_aspect: "The sweep includes only PAID claims with service_date inside the closed batch window: a ROUTED claim and a PAID claim one day outside the window are both excluded."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Members M1, M2, M3 home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). Fee schedule H->T [2026-01-01,2026-12-31] cap 10000 fee 150 rate 0.02 discount 0. C1 service 2026-08-10 fully PAID (allowed 20000). C2 service 2026-08-11 ROUTED only. C3 service 2026-07-31 fully PAID (outside window [2026-08-01,2026-08-31])."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M2", full_name: "Pat Two", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M3", full_name: "Pat Three", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m3_id: $.data.id }
            - *c_rate
            - *c_fee
            - *c_claim
            - call: "POST /v1/claims"
              payload: { member_id: "${m2_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-11", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { member_id: "${m3_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-07-31", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c3_id: $.data.id }
            - *c_price
            - *c_route
            - *c_db
            - *c_pay
            - call: "POST /v1/claims/${c2_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c2_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c3_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c3_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c3_id}/determine-benefit"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/claims/${c3_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/settlement-batches"
              payload: { debtor_plan_id: "${h_id}", creditor_plan_id: "${t_id}", period_start: "2026-08-01", period_end: "2026-08-31", settlement_variant: "NET" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /v1/settlement-batches/${b_id}/finalize"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "SettlementBatch.${b_id}.gross_claims_total_cents == 20000 (only the in-window PAID claim ${c_id} counted; ROUTED claim ${c2_id} and out-of-window PAID claim ${c3_id} excluded)"
            - "SettlementBatch.${b_id}.fees_total_cents == 1200 (400 access + 800 admin on the single swept claim)"
            - "SettlementBatch.${b_id}.net_settlement_cents == 18800"

      - name: national_account_discount_lost_when_account_suspended
        claim_type: Variant Selection
        grounds:
          - calculations.access_fee_computation
          - state_machines.NationalAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "The discount applies only while the national account is ACTIVE; suspending the account before routing yields the undiscounted fee for an otherwise identical claim."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. NationalAccount NA controlled by H, ACTIVE then SUSPENDED, window [2026-01-01,2026-12-31]. Member M home=H under NA. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). Fee schedule H->T [2026-01-01,2026-12-31] cap 10000 fee 150 rate 0.02 discount 0.25. Claim billed 20000 service 2026-08-10 priced."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - call: "POST /v1/national-accounts"
              payload: { controlling_plan_id: "${h_id}", account_name: "Acme Corp", employer_group_id: "ACME-1", territory_states: ["TX"], effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
              captures: { na_id: $.data.id }
            - call: "POST /v1/national-accounts/${na_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: "${na_id}" }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
            - *c_rate
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0.25, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - *c_claim
            - *c_price
            - call: "POST /v1/national-accounts/${na_id}/suspend"
              payload: {}
              as: AssociationAdmin
          trigger:
            - *c_route
          assert:
            - "Claim.${c_id}.access_fee_cents == 400 (account SUSPENDED at routing -> discount not applied; base fee round_half_up(20000 * 0.02) = 400)"

  # ===========================================================================
  - section: validations
    instances:

      - name: claim_with_host_equal_to_home_plan_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_SAME_PLAN_CLAIM
        distinguishing_aspect: "A claim whose host_plan_id equals the member's home plan is rejected as a non-inter-plan claim."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Plan H LICENSED with service area [CA, TX]. Member M home=H."
          setup_api_calls:
            - *c_clock
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA", "TX"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - *c_act_h
            - *c_member
          trigger:
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${h_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SAME_PLAN_CLAIM with HTTP 422"

      - name: route_without_fee_schedule_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_FEE_SCHEDULE_MISSING
          - state_machines.Claim.PRICED_to_ROUTED
        distinguishing_aspect: "Routing fails with ERR_FEE_SCHEDULE_MISSING when no AccessFeeSchedule covers the (home, host) pair and service_date."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). NO fee schedule exists for H->T. Claim billed 20000 service 2026-08-10 priced."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_claim
            - *c_price
          trigger:
            - call: "POST /v1/claims/${c_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FEE_SCHEDULE_MISSING with HTTP 422"
            - "Claim.${c_id}.status remains PRICED"

      - name: claim_submission_to_suspended_plan_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors.ERR_PLAN_LICENSE_SUSPENDED
        distinguishing_aspect: "Submitting a claim where the home plan's brand license is SUSPENDED is rejected with ERR_PLAN_LICENSE_SUSPENDED."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H LICENSED then SUSPENDED, host T LICENSED. Member M home=H."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/plans/${h_id}/suspend-license"
              payload: {}
              as: AssociationAdmin
          trigger:
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_LICENSE_SUSPENDED with HTTP 409"

      - name: zero_delta_adjustment_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_AMOUNT
        distinguishing_aspect: "An adjustment with delta_allowed_cents == 0 is rejected with ERR_INVALID_AMOUNT; the claim stays PAID."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 PAID."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - *c_db
            - *c_pay
          trigger:
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "no-op", delta_allowed_cents: 0, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_AMOUNT with HTTP 422"
            - "Claim.${c_id}.status remains PAID"

      - name: adjustment_driving_allowed_negative_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=13]
          - errors.ERR_NEGATIVE_ALLOWED
        distinguishing_aspect: "Applying an adjustment whose downward delta exceeds current_allowed_cents is rejected with ERR_NEGATIVE_ALLOWED at apply time."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 PAID (allowed 20000). Adjustment delta -25000 created, validated, propagated."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - *c_db
            - *c_pay
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "over-recovery", delta_allowed_cents: -25000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { a_id: $.data.id }
            - call: "POST /v1/adjustments/${a_id}/validate"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/adjustments/${a_id}/propagate"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /v1/adjustments/${a_id}/apply"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NEGATIVE_ALLOWED with HTTP 422"
            - "Adjustment.${a_id}.status remains PROPAGATED"
            - "host Plan.${t_id}.claims_paid_balance_cents == 20000 (unchanged)"

      - name: duplicate_member_number_within_home_plan_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=11]
          - errors.ERR_DUPLICATE_MEMBER_NUMBER
        distinguishing_aspect: "member_number uniqueness is scoped to home_plan_id: duplicate under the same home plan fails, but the same member_number under a different home plan succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Plans H and H2 both LICENSED. Member M1 with member_number DUP under H."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - call: "POST /v1/plans"
              payload: { plan_code: "HNY", legal_name: "Home Plan NY", service_area_states: ["NY"] }
              as: AssociationAdmin
              captures: { h2_id: $.data.id }
            - *c_act_h
            - call: "POST /v1/plans/${h2_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "DUP", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "DUP", full_name: "Pat Two", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h2_id}", member_number: "DUP", full_name: "Pat Three", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h2_id}"
          assert:
            - "duplicate under the same home plan returns ERR_DUPLICATE_MEMBER_NUMBER with HTTP 409"
            - "same member_number under a different home plan succeeds with 201"

      - name: revoke_with_open_claims_rejected
        claim_type: Violation -> Error
        grounds:
          - state_machines.Plan.LICENSED_to_REVOKED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Revoking a license while the plan hosts or owns non-terminal claims is rejected; revoking after the claim reaches a terminal state succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 routed, then denied (terminal)."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
          trigger:
            - call: "POST /v1/plans/${t_id}/revoke-license"
              payload: {}
              as: AssociationAdmin
              captures: { err: $.data.error_id }
            - call: "POST /v1/claims/${c_id}/deny"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/plans/${t_id}/revoke-license"
              payload: {}
              as: AssociationAdmin
          assert:
            - "first revoke returns ERR_INVALID_STATE with HTTP 409 (claim still ROUTED, non-terminal)"
            - "after the claim is DENIED (terminal), revoke succeeds and Plan.${t_id}.brand_license_status == REVOKED"

      - name: national_account_closed_window_overlap_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors.ERR_ACCOUNT_WINDOW_OVERLAP
        distinguishing_aspect: "NationalAccount closed windows for the same (controlling_plan_id, employer_group_id) reject touching endpoints as overlap; a window for a different employer_group_id is unaffected."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Plan H registered. NationalAccount NA1 (ACME-1) window [2026-01-01, 2026-06-30]."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - call: "POST /v1/national-accounts"
              payload: { controlling_plan_id: "${h_id}", account_name: "Acme Corp", employer_group_id: "ACME-1", territory_states: ["TX"], effective_start: "2026-01-01", effective_end: "2026-06-30" }
              as: AssociationAdmin
          trigger:
            - call: "POST /v1/national-accounts"
              payload: { controlling_plan_id: "${h_id}", account_name: "Acme Corp West", employer_group_id: "ACME-1", territory_states: ["TX"], effective_start: "2026-06-30", effective_end: "2026-12-31" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
            - call: "POST /v1/national-accounts"
              payload: { controlling_plan_id: "${h_id}", account_name: "Other Co", employer_group_id: "OTHER-1", territory_states: ["TX"], effective_start: "2026-06-30", effective_end: "2026-12-31" }
              as: AssociationAdmin
          assert:
            - "same employer_group_id with touching closed windows returns ERR_ACCOUNT_WINDOW_OVERLAP with HTTP 422"
            - "different employer_group_id with the same window succeeds with 201"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 before any other check."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with HTTP 401"

      - name: create_plan_missing_plan_code_returns_validation_failed
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_VALIDATION_FAILED
        distinguishing_aspect: "Omitting a required input field produces ERR_VALIDATION_FAILED with HTTP 400."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /v1/plans"
              payload: { legal_name: "No Code Plan", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_FAILED with HTTP 400"

      - name: claims_list_fk_reverse_reachability_by_member
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/v1/claims
          - entities.Claim.fields.member_id
        distinguishing_aspect: "GET /v1/claims?member_id=<id> returns exactly the claims filed for that member — FK reverse reachability from Member."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Members M1, M2 home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). One claim for M1, one for M2, both RECEIVED."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M2", full_name: "Pat Two", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m2_id: $.data.id }
            - *c_rate
            - *c_claim
            - call: "POST /v1/claims"
              payload: { member_id: "${m2_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-11", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c2_id: $.data.id }
          trigger:
            - call: "GET /v1/claims"
              payload: { member_id: "${m2_id}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "response returns exactly 1 row with total_count == 1 and the single row is claim ${c2_id}"

  # ===========================================================================
  - section: errors
    instances:

      - name: eligibility_answer_for_unknown_member_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_MEMBER_NOT_FOUND
          - state_machines.EligibilityInquiry.ROUTED_to_ANSWERED
        distinguishing_aspect: "Answering an inquiry for a member_number that does not exist under the home plan fails with ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. No member with number GHOST under H. Inquiry filed by T to H for member_number GHOST."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - call: "POST /v1/eligibility-inquiries"
              payload: { inquiring_plan_id: "${t_id}", home_plan_id: "${h_id}", member_number: "GHOST" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /v1/eligibility-inquiries/${q_id}/answer"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND with HTTP 404"

      - name: duplicate_plan_code_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_DUPLICATE_PLAN_CODE
          - validations[priority=14]
        distinguishing_aspect: "A second plan with an already-registered plan_code is rejected with ERR_DUPLICATE_PLAN_CODE (409)."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Plan HCA registered."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
          trigger:
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Another Plan", service_area_states: ["NV"] }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_PLAN_CODE with HTTP 409"

      - name: stale_batch_version_on_refinalize_returns_412
        claim_type: Violation -> Error
        grounds:
          - concurrency_rules[refinalize-stale-batch]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on SettlementBatch.version: refinalize carrying the version observed before a prior refinalize is rejected 412; the fresh version succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. One claim billed 20000 service 2026-08-10 PAID. NET batch B window [2026-08-01,2026-08-31] FINALIZED then DISPUTED (version captured at dispute)."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - *c_db
            - *c_pay
            - call: "POST /v1/settlement-batches"
              payload: { debtor_plan_id: "${h_id}", creditor_plan_id: "${t_id}", period_start: "2026-08-01", period_end: "2026-08-31", settlement_variant: "NET" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
            - call: "POST /v1/settlement-batches/${b_id}/finalize"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/settlement-batches/${b_id}/dispute"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { b_ver: $.data.version }
            - call: "POST /v1/settlement-batches/${b_id}/refinalize"
              payload: { expected_settlement_batch_version: "${b_ver}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/settlement-batches/${b_id}/dispute"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /v1/settlement-batches/${b_id}/refinalize"
              payload: { expected_settlement_batch_version: "${b_ver}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (batch version advanced through the first refinalize and re-dispute)"

  # ===========================================================================
  - section: rbac
    instances:

      - name: home_plan_operator_cannot_price_claim
        claim_type: Violation -> Error
        grounds:
          - endpoints.POST_/v1/claims/{id}/price
          - roles.HomePlanOperator
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The price transition is HostPlanOperator-exclusive; a HomePlanOperator caller is rejected 403 even for a claim owned by its own plan."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Claim billed 20000 service 2026-08-10 submitted (RECEIVED)."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_claim
          trigger:
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED with HTTP 403"

      - name: host_plan_operator_cannot_determine_benefit
        claim_type: Violation -> Error
        grounds:
          - endpoints.POST_/v1/claims/{id}/determine-benefit
          - roles.HostPlanOperator
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Benefit determination is HomePlanOperator-exclusive; the host plan that priced and routed the claim cannot determine benefits on it."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 routed."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
          trigger:
            - call: "POST /v1/claims/${c_id}/determine-benefit"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED with HTTP 403"

      - name: association_admin_cannot_submit_claim
        claim_type: Violation -> Error
        grounds:
          - endpoints.POST_/v1/claims
          - roles.AssociationAdmin
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Claim submission is HostPlanOperator-exclusive; the AssociationAdmin (who governs licensing) has no claim-submission permission."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
          trigger:
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED with HTTP 403"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: superseding_adjustment_rejects_prior_initiated_adjustment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Claim.PAID_to_ADJUSTMENT_PENDING
          - entities.Adjustment.fields.supersedes_adjustment_id
        distinguishing_aspect: "Creating a second adjustment while the claim is ADJUSTMENT_PENDING marks the prior INITIATED adjustment REJECTED and records it in supersedes_adjustment_id — optimistic supersede semantics."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 PAID. Adjustment A1 delta -1000 created (claim ADJUSTMENT_PENDING)."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - *c_db
            - *c_pay
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "first", delta_allowed_cents: -1000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { a1_id: $.data.id }
            - call: "GET /v1/claims/${c_id}"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_ver_pending: $.data.version }
          trigger:
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "second supersedes first", delta_allowed_cents: -2000, expected_claim_version: "${c_ver_pending}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { a2_id: $.data.id }
          assert:
            - "Adjustment.${a1_id}.status == REJECTED (superseded)"
            - "Adjustment.${a2_id}.supersedes_adjustment_id == ${a1_id}"
            - "Adjustment.${a2_id}.status == INITIATED and Claim.${c_id}.status == ADJUSTMENT_PENDING"

      - name: plan_derived_balances_track_pay_and_recovery
        claim_type: Computed Fields
        grounds:
          - entities.Plan.fields.claims_paid_balance_cents
          - entities.Plan.fields.fees_receivable_balance_cents
          - calculations.plan_balance_reconciliation
        distinguishing_aspect: "Derived plan balances stay consistent across pay (credit both ledgers) and a partial applied recovery (debit only claims_paid)."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Fee schedule H->T. Claim billed 20000 service 2026-08-10 PAID. Adjustment delta -5000 fully propagated."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_fee
            - *c_claim
            - *c_price
            - *c_route
            - *c_db
            - *c_pay
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "partial recovery", delta_allowed_cents: -5000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { a_id: $.data.id }
            - call: "POST /v1/adjustments/${a_id}/validate"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/adjustments/${a_id}/propagate"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /v1/adjustments/${a_id}/apply"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "after pay: claims_paid_balance_cents == 20000 and fees_receivable_balance_cents == 1200 (observed pre-trigger state)"
            - "after apply: host Plan.${t_id}.claims_paid_balance_cents == 15000"
            - "after apply: host Plan.${t_id}.fees_receivable_balance_cents == 1200 (recoveries debit only claims_paid_balance_cents; the receivables ledger is untouched and is netted at batch finalize per settlement_sweep)"

      - name: version_increments_on_every_mutation
        claim_type: System Fields
        grounds:
          - entities.Claim
          - concurrency_rules[adjustment-create-stale-claim]
        distinguishing_aspect: "Claim.version starts at 1 and increments by exactly 1 on each transition; the version observed in the create response is stale after pricing."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213. Claim billed 20000 service 2026-08-10 created."
          setup_api_calls:
            - *c_clock
            - *c_plan_h
            - *c_plan_t
            - *c_act_h
            - *c_act_t
            - *c_member
            - *c_rate
            - *c_claim
          trigger:
            - *c_price
          assert:
            - "Claim.${c_id}.version == 1 at creation"
            - "Claim.${c_id}.version == 2 after the price transition"
