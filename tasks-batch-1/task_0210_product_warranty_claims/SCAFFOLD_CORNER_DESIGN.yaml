              as_user_id: "${o1_id}"
              captures: { reg_v: $.data.version }
          trigger:
            - call: "POST /registrations/${reg_id}/transfer"
              payload: { to_owner_user_id: "${o2_id}", expected_registration_version: "${reg_v}" }
              as: Owner
              as_user_id: "${o1_id}"
          assert:
            - "response.status == 201"
            - "Registration.${reg_id}.status == TRANSFER_PENDING"

      - name: derived_field_remaining_coverage_reconciled_after_debit
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Registration.fields.remaining_coverage_cents
          - calculations.remaining_coverage_reconciliation
          - endpoints.GET_/registrations/{id}/ledger
        distinguishing_aspect: |
          remaining_coverage_cents on a freshly read Registration equals cap minus net DEBITs: after a single
          REPAIR debit of 5000 against a 40000 cap, GET reports 35000 (derived-field reconciled from ledger).
        test_recipe:
          setup:
            - "Owner O1 ACTIVE validated registration cap 40000; MANUFACTURING claim RMA_ISSUED then REPAIR-adjudicated for 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
