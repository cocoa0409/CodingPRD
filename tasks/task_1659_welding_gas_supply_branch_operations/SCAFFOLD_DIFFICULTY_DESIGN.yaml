# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task 1659 Welding Gas & Supply Branch Ops
# §1.8 Test Targeting Index: 9 rules × 2 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and replays from empty-DB via §1.5 endpoints only.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rental_accrual_provisional_ceil_vs_billed_floor
        grounds:
          - calculations.rental_accrual
          - entities.RentalAgreement.fields.accrued_unbilled_cents
          - state_machines.RentalAgreement.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Same agreement, same dates: the provisional read rounds the partial
          period UP (ceil → 1200 then 2400 cents) while the billing run posts
          COMPLETE periods only (floor → 0 then 1200 cents). Entity domain:
          RentalAgreement — distinct from the Customer-exposure instance.
        test_recipe:
          setup:
            - "CASH customer exists; cylinder CYL-1 (ARGON) is FULL"
            - "DEMURRAGE rental on CYL-1, start 2026-08-01, grace_days 5, rate DEMURRAGE_MONTHLY_CENTS=1200/30d"
            - "Logical clock walks 2026-08-01 → 2026-08-20 → 2026-09-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-RA1", name: "Accrual Co", terms: "CASH" }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-RA1", gas_grade: "ARGON", size: "MEDIUM" }
              as: BranchManager
              captures: { asset_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", item_type: "CYLINDER", cylinder_asset_id: "${asset_id}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
              captures: { ra_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: BranchManager
            - call: "GET /rental-agreements/${ra_id}"
              as: CounterRep
              captures: { accrued_aug20: $.data.accrued_unbilled_cents }
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { run1_invoices: $.data.invoices_created, run1_total: $.data.total_billed_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BranchManager
            - call: "GET /rental-agreements/${ra_id}"
              as: CounterRep
              captures: { accrued_sep15: $.data.accrued_unbilled_cents }
          trigger:
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { run2_invoices: $.data.invoices_created, run2_total: $.data.total_billed_cents }
            - call: "GET /rental-agreements/${ra_id}"
              as: CounterRep
              captures: { billed_lifetime: $.data.lifetime_billed_cents, accrued_after: $.data.accrued_unbilled_cents, billed_through: $.data.billed_through_date }
          assert:
            - "accrued_aug20 == 1200  (provisional ceil: max(0, 19-5)=14 days -> ceil(14/30)=1 period x 1200)"
            - "run1_invoices == 0 and run1_total == 0  (billed floor: floor(14/30)=0 periods — identical data, smaller number)"
            - "accrued_sep15 == 2400  (chargeable 40 days -> ceil(40/30)=2 x 1200)"
            - "run2_invoices == 1 and run2_total == 1200  (floor(40/30)=1 period)"
            - "billed_lifetime == 1200 and accrued_after == 1200 and billed_through == '2026-09-15'"

      - name: customer_exposure_projected_vs_posted
        grounds:
          - calculations.customer_exposure
          - entities.Customer.fields.projected_exposure_cents
          - entities.Customer.fields.posted_exposure_cents
        distinguishing_aspect: |
          Same customer, same instant: posted_exposure (ledger-only) is 0 while
          projected_exposure (forward-looking) is 20000 — they differ by exactly
          the CONFIRMED-order total. Entity domain: Customer credit — distinct
          from the RentalAgreement accrual instance.
        test_recipe:
          setup:
            - "NET30 customer, credit_limit 1000000; product HG at 10000 cents, stock 100"
            - "Order of qty 2 confirmed (total 20000), not yet staged/fulfilled"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-EX1", name: "Exposure Co", terms: "NET30", credit_limit_cents: 1000000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-EX1", name: "Welding Gloves", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 100 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 2 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { posted_mid: $.data.posted_exposure_cents, projected_mid: $.data.projected_exposure_cents }
            - call: "POST /orders/${order_id}/stage"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: CounterRep
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { posted_end: $.data.posted_exposure_cents, projected_end: $.data.projected_exposure_cents, outstanding_end: $.data.outstanding_balance_cents }
          assert:
            - "posted_mid == 0 and projected_mid == 20000  (divergence == CONFIRMED order total)"
            - "posted_end == 20000 and projected_end == 20000  (invoice replaces the order commitment; variants reconverge)"
            - "outstanding_end == 20000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: contract_tiered_unit_price_resolution
        grounds:
          - calculations.contract_price_resolution
          - entities.PriceBook.fields.volume_tiers
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — retail price,
          default discount, and a qty-selected tier; the tier branch changes the
          result at qty 5 (9000), 12 (8550), 60 (8100) for identical list price.
        test_recipe:
          setup:
            - "CASH customer with an ACTIVE CONTRACT book (window 2026-01-01..2027-01-01, default 0.10, tiers 10->0.05 / 50->0.10)"
            - "HARDGOOD product retail 10000, stock 100"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-CT1", name: "Contract Co", terms: "CASH" }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /price-books"
              payload: { name: "CT1 Book", scope: "CONTRACT", customer_id: "${cust_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", default_discount_pct: 0.10, volume_tiers: [{ min_qty: 10, extra_discount_pct: 0.05 }, { min_qty: 50, extra_discount_pct: 0.10 }] }
              as: BranchManager
              captures: { book_id: $.data.id }
            - call: "POST /price-books/${book_id}/activate"
              payload: {}
              as: BranchManager
            - call: "PATCH /customers/${cust_id}"
              payload: { price_book_id: "${book_id}" }
              as: CounterRep
            - call: "POST /products"
              payload: { sku: "HG-CT1", name: "Electrode 10lb", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 100 }
              as: BranchManager
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 5 }] }
              as: CounterRep
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/confirm"
              payload: {}
              as: CounterRep
              captures: { o1_total: $.data.total_cents }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 12 }] }
              as: CounterRep
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/confirm"
              payload: {}
              as: CounterRep
              captures: { o2_total: $.data.total_cents }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 60 }] }
              as: CounterRep
              captures: { o3: $.data.id }
            - call: "POST /orders/${o3}/confirm"
              payload: {}
              as: CounterRep
              captures: { o3_total: $.data.total_cents }
          assert:
            - "Order.${o1}: lines[0].unit_price_cents == 9000 and total_cents == 45000  (qty 5: no tier; 10000 x 0.90)"
            - "Order.${o2}: lines[0].unit_price_cents == 8550 and total_cents == 102600  (qty 12: tier 10 -> x 0.95)"
            - "Order.${o3}: lines[0].unit_price_cents == 8100 and total_cents == 486000  (qty 60: tier 50 -> x 0.90)"

      - name: line_rounding_order_pinned_single_round_at_end
        grounds:
          - calculations.contract_price_resolution
          - calculations.order_total_aggregation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins a
          single round_half_up at the end of the unit-price formula, then
          integer-multiplies per line and sums. retail 1095 x 0.90 x 0.95 =
          936.225 -> 936 (not 937 from rounding base first); qty 3 totals 2808
          (not 2809 from sum-then-round). Different mode than instance (a).
        test_recipe:
          setup:
            - "CASH customer with ACTIVE CONTRACT book (default 0.10, single tier min_qty 1 -> 0.05)"
            - "HARDGOOD product retail 1095, stock 10"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-CT2", name: "Rounding Co", terms: "CASH" }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /price-books"
              payload: { name: "CT2 Book", scope: "CONTRACT", customer_id: "${cust_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", default_discount_pct: 0.10, volume_tiers: [{ min_qty: 1, extra_discount_pct: 0.05 }] }
              as: BranchManager
              captures: { book_id: $.data.id }
            - call: "POST /price-books/${book_id}/activate"
              payload: {}
              as: BranchManager
            - call: "PATCH /customers/${cust_id}"
              payload: { price_book_id: "${book_id}" }
              as: CounterRep
            - call: "POST /products"
              payload: { sku: "HG-CT2", name: "Nozzle Tip", category: "HARDGOOD", retail_price_cents: 1095 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 10 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 3 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
              captures: { total: $.data.total_cents, subtotal: $.data.subtotal_cents }
          assert:
            - "Order.${order_id}: lines[0].unit_price_cents == 936  (single round_half_up of 936.225; a base-first double round yields 937)"
            - "lines[0].line_total_cents == 2808 and subtotal == 2808 and total == 2808  (3 x 936; sum-then-round of 2808.675 would give 2809)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_quote_revision_cycle
        grounds:
          - state_machines.RepairTicket.QUOTED_to_REJECTED
          - state_machines.RepairTicket.REJECTED_to_DIAGNOSING
        distinguishing_aspect: |
          Cyclic shape on RepairTicket: QUOTED -> REJECTED -> DIAGNOSING ->
          QUOTED is a re-quote loop; revision_no increments per loop and
          quote_cents is cleared then re-quoted. Paired with a parallel-dims
          machine on a different entity (Order).
        test_recipe:
          setup:
            - "CASH customer; repair ticket at INTAKE"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-RP1", name: "Repair Co", terms: "CASH" }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", machine_desc: "Miller 252 (customer-owned)", issue_desc: "Wire feed erratic" }
              as: ServiceTech
              captures: { ticket_id: $.data.id }
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "DIAGNOSING" }
              as: ServiceTech
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "QUOTED", quote_cents: 50000 }
              as: ServiceTech
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "REJECTED" }
              as: BranchManager
          trigger:
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "DIAGNOSING" }
              as: ServiceTech
              captures: { rev_after: $.data.revision_no, quote_after: $.data.quote_cents }
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "QUOTED", quote_cents: 45000 }
              as: ServiceTech
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "APPROVED" }
              as: BranchManager
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "IN_REPAIR" }
              as: ServiceTech
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "READY_FOR_PICKUP" }
              as: ServiceTech
            - call: "POST /repair-tickets/${ticket_id}/advance"
              payload: { to: "CLOSED" }
              as: ServiceTech
              captures: { charged: $.data.charged_cents, final_status: $.data.status }
          assert:
            - "rev_after == 1 and quote_after == null  (loop back to DIAGNOSING bumps revision, clears quote)"
            - "final_status == CLOSED and charged == 45000  (second quote, not the rejected 50000, is charged)"

      - name: order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on Order: a CASH order reaches payment PAID
          while fulfillment is still CONFIRMED (payment moves, fulfillment does
          not); a NET30 order reaches fulfillment FULFILLED while payment sits
          INVOICED until the waterfall settles it. Different entity and
          different non-linear shape than the RepairTicket cycle.
        test_recipe:
          setup:
            - "CASH customer C1 and NET30 customer C2 (limit 1000000); product 10000 cents stock 100"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-PD1", name: "Cash Co", terms: "CASH" }
              as: CounterRep
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { account_no: "ACC-PD2", name: "Terms Co", terms: "NET30", credit_limit_cents: 1000000 }
              as: CounterRep
              captures: { c2: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-PD1", name: "Helmet", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 100 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${c1}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 1 }] }
              as: CounterRep
              captures: { o_cash: $.data.id }
            - call: "POST /orders/${o_cash}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${o_cash}/pay"
              payload: { amount_cents: 10000 }
              as: CounterRep
              captures: { cash_pay_status: $.data.payment_status, cash_ful_status: $.data.fulfillment_status }
            - call: "POST /orders"
              payload: { customer_id: "${c2}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 1 }] }
              as: CounterRep
              captures: { o_net: $.data.id }
            - call: "POST /orders/${o_net}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${o_net}/stage"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${o_net}/fulfill"
              payload: {}
              as: CounterRep
              captures: { net_ful: $.data.fulfillment_status, net_pay: $.data.payment_status, net_inv: $.data.invoice_id }
            - call: "GET /customers/${c2}"
              as: CounterRep
              captures: { c2_v: $.data.version }
            - call: "POST /customers/${c2}/payments"
              payload: { amount_cents: 10000, expected_customer_version: "${c2_v}" }
              as: CounterRep
            - call: "GET /orders/${o_net}"
              as: CounterRep
              captures: { net_pay_final: $.data.payment_status, net_ful_final: $.data.fulfillment_status }
          assert:
            - "cash_pay_status == PAID and cash_ful_status == CONFIRMED  (payment dimension moved alone)"
            - "net_ful == FULFILLED and net_pay == INVOICED  (fulfillment dimension moved alone)"
            - "net_pay_final == SETTLED and net_ful_final == FULFILLED  (waterfall settled payment; fulfillment untouched)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_invoice_exposure_hold_chain
        grounds:
          - state_machines.Order.STAGED_to_FULFILLED
          - state_machines.Customer.ACTIVE_to_CREDIT_HOLD
          - calculations.customer_exposure
        distinguishing_aspect: |
          Depth-3 cascade from POST /orders/{id}/fulfill: fulfill creates the
          Invoice (hop 1), invoice creation recomputes Customer
          posted_exposure_cents (hop 2), the crossing auto-places CREDIT_HOLD
          (hop 3). Trigger differs from the payment-waterfall instance.
        test_recipe:
          setup:
            - "NET30 customer, credit_limit 42000; product 10000 x 10 in stock"
            - "DEMURRAGE rental (grace 5) started 2026-08-01 so a billing run at 2026-11-01 posts a 2400-cent rental invoice first"
            - "Order of 4 x 10000 confirmed at 2026-08-01 (projected 40000 <= 42000 passes)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-TC1", name: "Cascade Co", terms: "NET30", credit_limit_cents: 42000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-TC1", name: "Torch Kit", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 10 }
              as: BranchManager
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-TC1", gas_grade: "ARGON", size: "MEDIUM" }
              as: BranchManager
              captures: { asset_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", item_type: "CYLINDER", cylinder_asset_id: "${asset_id}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 4 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { run_total: $.data.total_billed_cents }
            - call: "POST /orders/${order_id}/stage"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: CounterRep
              captures: { order_inv: $.data.invoice_id, order_pay: $.data.payment_status }
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { cust_status: $.data.status, cust_outstanding: $.data.outstanding_balance_cents }
            - call: "GET /invoices/${order_inv}"
              as: CounterRep
              captures: { inv_amount: $.data.amount_cents, inv_source: $.data.source }
          assert:
            - "run_total == 2400  (floor(87/30)=2 periods x 1200; posted 2400 <= 42000 so no hold yet)"
            - "inv_amount == 40000 and inv_source == ORDER  (hop 1: fulfill posted the invoice)"
            - "cust_outstanding == 42400  (hop 2: exposure recomputed as 2400 + 40000)"
            - "cust_status == CREDIT_HOLD  (hop 3: 42400 > 42000 auto-hold)"
            - "order_pay == INVOICED"

      - name: payment_waterfall_invoice_settle_release_chain
        grounds:
          - calculations.payment_waterfall
          - state_machines.Invoice.OPEN_to_PAID
          - state_machines.Customer.CREDIT_HOLD_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 cascade from POST /customers/{id}/payments (different trigger
          than the fulfill instance): the waterfall mutates two invoices to PAID
          (hop 1), each PAID invoice recomputes Customer exposure (hop 2), and
          the drop to <= limit auto-releases CREDIT_HOLD (hop 3).
        test_recipe:
          setup:
            - "NET30 customer, credit_limit 42000"
            - "Order 4 x 10000 fulfilled at 2026-08-01 -> invoice I1 40000 (posted 40000, no hold)"
            - "DEMURRAGE rental + billing run at 2026-11-01 -> invoice I2 2400 -> posted 42400 > 42000 -> CREDIT_HOLD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-TC2", name: "Release Co", terms: "NET30", credit_limit_cents: 42000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-TC2", name: "Jacket XL", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 10 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 4 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${order_id}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv1: $.data.invoice_id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-TC2", gas_grade: "ARGON", size: "MEDIUM" }
              as: BranchManager
              captures: { asset_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", item_type: "CYLINDER", cylinder_asset_id: "${asset_id}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { inv2_list: $.data.invoice_ids }
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { held_status: $.data.status, cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cust_id}/payments"
              payload: { amount_cents: 42400, expected_customer_version: "${cust_v}" }
              as: CounterRep
              captures: { credit_added: $.data.credit_added_cents, outstanding: $.data.outstanding_balance_cents }
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { final_status: $.data.status }
            - call: "GET /invoices/${inv1}"
              as: CounterRep
              captures: { inv1_status: $.data.status }
            - call: "GET /orders/${order_id}"
              as: CounterRep
              captures: { order_pay: $.data.payment_status }
          assert:
            - "held_status == CREDIT_HOLD  (billing-run invoice pushed posted exposure to 42400 > 42000)"
            - "credit_added == 0 and outstanding == 0  (42400 exactly covers 40000 + 2400)"
            - "inv1_status == PAID  (hop 1)"
            - "order_pay == SETTLED  (hop 1b: invoice PAID cascades to the order's payment dimension)"
            - "final_status == ACTIVE  (hop 3: exposure 0 <= 42000 auto-release)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: the order is CANCELLED
          (state failure) AND the NET30 customer's projected exposure plus order
          total (0 + 20000) exceeds credit_limit 10000 (fiscal failure); the
          higher-priority state check must win with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "NET30 customer, credit_limit 10000; product 10000, stock 10"
            - "Order 2 x 10000 created then cancelled from DRAFT"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-PP1", name: "Conflict Co", terms: "NET30", credit_limit_cents: 10000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-PP1", name: "Clamp Set", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 10 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 2 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE  (state check, priority 6, beats the fiscal credit failure at priority 11 — both conditions were planted)"

      - name: referential_beats_constraint_on_enrollment
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_CLASS_NOT_SCHEDULED]
          - errors[ERR_CLASS_FULL]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_constraint} —
          different pair than {state, business_fiscal}: the class is CANCELLED
          (referential failure) AND full (seats_booked 1 == capacity 1, because
          a NO_SHOW keeps its seat and class-cancel only cascades ENROLLED);
          the referential check must win with ERR_CLASS_NOT_SCHEDULED.
        test_recipe:
          setup:
            - "Class cap 1, ROOM_A, 2026-09-01 09:00-11:00; e1 enrolled then marked NO_SHOW (seat stays consumed)"
            - "Class then CANCELLED (cascade touches only ENROLLED enrollments, so seats_booked stays 1)"
            - "Second customer ready to enroll attendee Bo"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-PP2", name: "First Co", terms: "CASH" }
              as: CounterRep
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { account_no: "ACC-PP3", name: "Second Co", terms: "CASH" }
              as: CounterRep
              captures: { c2: $.data.id }
            - call: "POST /training-classes"
              payload: { title: "Oxy-Fuel Safety", room: "ROOM_A", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T11:00:00Z", capacity: 1, price_cents: 15000 }
              as: Trainer
              captures: { class_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${class_id}", customer_id: "${c1}", attendee_name: "Al" }
              as: Trainer
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: BranchManager
            - call: "POST /enrollments/${e1}/advance"
              payload: { to: "NO_SHOW" }
              as: Trainer
            - call: "POST /training-classes/${class_id}/advance"
              payload: { to: "CANCELLED" }
              as: Trainer
          trigger:
            - call: "POST /enrollments"
              payload: { class_id: "${class_id}", customer_id: "${c2}", attendee_name: "Bo" }
              as: Trainer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLASS_NOT_SCHEDULED  (referential failure, priority 8, beats ERR_CLASS_FULL at priority 10 — both conditions were planted)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_equality_passes_then_one_order_over
        grounds:
          - calculations.customer_exposure
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a cents metric via POST /orders/{id}/confirm: projected +
          total == credit_limit (50000 == 50000) passes because the rule is
          strict >; the next order (60000 > 50000) fails. Distinct metric and
          endpoint from the seat-count instance.
        test_recipe:
          setup:
            - "NET30 customer, credit_limit 50000; product 10000, stock 10"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-BP1", name: "Boundary Co", terms: "NET30", credit_limit_cents: 50000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-BP1", name: "Regulator", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 10 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 5 }] }
              as: CounterRep
              captures: { o1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 1 }] }
              as: CounterRep
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /orders/${o1}/confirm"
              payload: {}
              as: CounterRep
              captures: { o1_status: $.data.fulfillment_status, o1_total: $.data.total_cents }
            - call: "POST /orders/${o2}/confirm"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "o1_status == CONFIRMED and o1_total == 50000  (equality passes: 50000 > 50000 is false)"
            - "err == ERR_CREDIT_LIMIT_EXCEEDED  (projected 50000 + 10000 = 60000 > 50000)"

      - name: class_capacity_exact_fill_then_full
        grounds:
          - entities.TrainingClass.fields.seats_booked
          - errors[ERR_CLASS_FULL]
        distinguishing_aspect: |
          Boundary on a seat-count metric via POST /enrollments: seats_booked ==
          capacity is already full (>= semantics), so the 2nd enrollment into a
          cap-2 class succeeds and the 3rd fails. Different metric (count vs
          cents) and different endpoint than the credit-limit instance.
        test_recipe:
          setup:
            - "Class cap 2, ROOM_B, 2026-09-05 09:00-10:00; one CASH customer"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-BP2", name: "Seats Co", terms: "CASH" }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /training-classes"
              payload: { title: "Plasma Cutting Safety", room: "ROOM_B", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T10:00:00Z", capacity: 2, price_cents: 9000 }
              as: Trainer
              captures: { class_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { class_id: "${class_id}", customer_id: "${cust_id}", attendee_name: "A One" }
              as: CounterRep
              captures: { e1: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${class_id}", customer_id: "${cust_id}", attendee_name: "A Two" }
              as: CounterRep
              captures: { e2: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${class_id}", customer_id: "${cust_id}", attendee_name: "A Three" }
              as: CounterRep
              captures: { err: $.data.error_id }
            - call: "GET /training-classes/${class_id}"
              as: Trainer
              captures: { seats: $.data.seats_booked }
          assert:
            - "e1 and e2 both created (HTTP 201) — seats 0->1->2, and seats == capacity only AFTER the 2nd"
            - "err == ERR_CLASS_FULL  (seats_booked 2 >= capacity 2)"
            - "seats == 2"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_blocked_by_customer_credit_hold
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Customer.ACTIVE_to_CREDIT_HOLD
          - errors[ERR_ACCOUNT_ON_HOLD]
        distinguishing_aspect: |
          Entity pair Order -> Customer: the order's own state is a valid DRAFT,
          but the linked Customer.status CREDIT_HOLD vetoes the transition.
          Paired with an Order -> DeliveryRoute dependency (different pair).
        test_recipe:
          setup:
            - "NET30 customer placed on manual CREDIT_HOLD; product 10000 stock 5"
            - "Order created (create is allowed; only confirm is gated)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-XD1", name: "Held Co", terms: "NET30", credit_limit_cents: 1000000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/credit-hold"
              payload: { action: "PLACE_HOLD" }
              as: BranchManager
            - call: "POST /products"
              payload: { sku: "HG-XD1", name: "Brush", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${prod_id}", qty: 1 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_ON_HOLD  (Customer CREDIT_HOLD vetoes Order DRAFT->CONFIRMED)"

      - name: route_order_fulfill_blocked_until_route_dispatched
        grounds:
          - state_machines.Order.STAGED_to_FULFILLED
          - state_machines.DeliveryRoute.PLANNED_to_DISPATCHED
          - errors[ERR_ROUTE_NOT_DISPATCHED]
        distinguishing_aspect: |
          Entity pair Order -> DeliveryRoute (different pair than Order ->
          Customer): the STAGED route order cannot fulfill while its route is
          PLANNED; after dispatch the identical fulfill succeeds.
        test_recipe:
          setup:
            - "CASH customer; product 10000 stock 5; route 2026-08-02 capacity 10 PLANNED"
            - "ROUTE order qty 1 confirmed (total 10000 + 2500 delivery = 12500), paid, STAGED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-XD2", name: "Route Co", terms: "CASH" }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-XD2", name: "Tip Cleaner", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-08-02", truck_capacity_units: 10 }
              as: CounterRep
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${route_id}", lines: [{ product_id: "${prod_id}", qty: 1 }] }
              as: CounterRep
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: CounterRep
              captures: { order_total: $.data.total_cents }
            - call: "POST /orders/${order_id}/pay"
              payload: { amount_cents: 12500 }
              as: CounterRep
            - call: "POST /orders/${order_id}/stage"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: RouteDriver
              captures: { err: $.data.error_id }
            - call: "POST /delivery-routes/${route_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: RouteDriver
              captures: { final_status: $.data.fulfillment_status }
          assert:
            - "order_total == 12500  (subtotal 10000 < 20000 threshold so 2500 delivery fee applies)"
            - "err == ERR_ROUTE_NOT_DISPATCHED  (route PLANNED gates the order transition)"
            - "final_status == FULFILLED  (same call succeeds after dispatch)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_turnaround_buffer_blocks_next_day_rental
        grounds:
          - state_machines.Machine.RENTED_to_AVAILABLE
          - validations[priority=9]
          - errors[ERR_RENTAL_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED interval + 1-day turnaround buffer on
          Machine — a rental closed at date D blocks any new rental with
          start_date <= D+1 (2026-08-11 rejected, 2026-08-12 accepted).
          Different semantics and different resource than the half-open room
          booking instance.
        test_recipe:
          setup:
            - "NET30 customer (limit 1000000); machine M (daily 5000 / weekly 20000 / monthly 60000)"
            - "Rental R1 on M, DAILY, start 2026-08-01, closed at clock 2026-08-10 (final invoice 9 x 5000 = 45000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-OV1", name: "Rent Co", terms: "NET30", credit_limit_cents: 1000000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /machines"
              payload: { model: "Miller 252", serial_no: "M-OV1", daily_rate_cents: 5000, weekly_rate_cents: 20000, monthly_rate_cents: 60000 }
              as: BranchManager
              captures: { mach_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", item_type: "MACHINE", machine_id: "${mach_id}", rate_plan: "DAILY", start_date: "2026-08-01" }
              as: CounterRep
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: BranchManager
            - call: "POST /rental-agreements/${r1}/close"
              payload: {}
              as: CounterRep
              captures: { r1_status: $.data.status, r1_billed: $.data.lifetime_billed_cents }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", item_type: "MACHINE", machine_id: "${mach_id}", rate_plan: "DAILY", start_date: "2026-08-11" }
              as: CounterRep
              captures: { err: $.data.error_id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", item_type: "MACHINE", machine_id: "${mach_id}", rate_plan: "DAILY", start_date: "2026-08-12" }
              as: CounterRep
              captures: { r2: $.data.id }
          assert:
            - "r1_status == CLOSED and r1_billed == 45000  (close-out ceil: 9 chargeable days x 5000)"
            - "err == ERR_RENTAL_OVERLAP  (2026-08-11 is not > closed date 2026-08-10 + 1 buffer day)"
            - "r2 created (HTTP 201) — 2026-08-12 clears the buffer"

      - name: room_halfopen_interval_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - entities.TrainingClass.fields.room
        distinguishing_aspect: |
          Interval semantics: half-open [start_at, end_at) on TrainingClass.room
          — a class starting exactly when another ends (11:00 == 11:00) is
          allowed, while true overlap (10:30-11:30) is rejected. Different
          semantics (adjacency-legal, no buffer) and different resource than
          the machine turnaround instance.
        test_recipe:
          setup:
            - "No classes exist; room grid 2026-09-01"
          setup_api_calls: []
          trigger:
            - call: "POST /training-classes"
              payload: { title: "A", room: "ROOM_A", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T11:00:00Z", capacity: 5, price_cents: 1000 }
              as: Trainer
              captures: { class_a: $.data.id }
            - call: "POST /training-classes"
              payload: { title: "B", room: "ROOM_A", start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T12:00:00Z", capacity: 5, price_cents: 1000 }
              as: Trainer
              captures: { class_b: $.data.id }
            - call: "POST /training-classes"
              payload: { title: "C", room: "ROOM_A", start_at: "2026-09-01T10:30:00Z", end_at: "2026-09-01T11:30:00Z", capacity: 5, price_cents: 1000 }
              as: Trainer
              captures: { err: $.data.error_id }
            - call: "POST /training-classes"
              payload: { title: "D", room: "ROOM_B", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T11:00:00Z", capacity: 5, price_cents: 1000 }
              as: Trainer
              captures: { class_d: $.data.id }
          assert:
            - "class_a and class_b both created (HTTP 201) — B.start == A.end is adjacency, allowed under half-open semantics"
            - "err == ERR_ROOM_DOUBLE_BOOKED  (10:30-11:30 intersects both A and B)"
            - "class_d created (HTTP 201) — same clock window but a different room is not a collision"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: exchange_float_conservation_per_grade
        grounds:
          - calculations.float_reconciliation
          - state_machines.CylinderAsset.FULL_to_OUT
          - state_machines.CylinderAsset.OUT_to_EMPTY
        distinguishing_aspect: |
          Conserved quantity: per-grade cylinder count. A balanced EXCHANGE
          (2 returned, 2 issued) paired with its compensating return leaves
          total_ARGON == 4 and out_ARGON == 2 unchanged; only the full/empty
          split moves (2/0 -> 0/2). Different conserved quantity than the
          cash-allocation instance.
        test_recipe:
          setup:
            - "Four ARGON cylinders A1..A4 registered FULL; GAS product G-ARG (ARGON) retail 3000"
            - "CASH customer; RETAIL order of 2 fulfilled first so the customer holds A1, A2 (OUT)"
