          trigger:
            - call: "POST /api/enrollments/${enr_id}/defer"
              payload: { to_state: "DEFERRED" }
              as: RegistrarAdmin
              captures: { st1: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
