        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[membership-create-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create-with-supersede race reduced to OCC: member observed at version 1, waiver-sign bumps to 2, then a membership create still carrying expected_member_version 1 is rejected 412; re-reading and retrying with 2 succeeds."
        test_recipe:
          setup: ["member M created (version 1); waiver signed (version 2)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
          trigger:
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v}" }, as: Member, as_user_id: "${mM_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}", captures: { ms_st: "$.data.status" } }
          assert:
            - "stale expected_member_version (1, observed before waiver-sign): ERR_STALE_VERSION, http 412"
            - "current version (2): 201, membership ACTIVE — OCC rejects only the stale view, not the operation"
            - "Member.version == 3 after the successful purchase"
