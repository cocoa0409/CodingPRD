  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_incident_cap_applied_before_the_single_clamp
        grounds:
          - calculations.guest_risk_score
          - entities.Guest.fields.risk_score
          - entities.Guest.fields.escalated_incident_count
          - state_machines.Incident.ACKNOWLEDGED_to_ESCALATED_LAW_ENFORCEMENT
          - entities.BlocklistEntry.fields.auto_generated
        distinguishing_aspect: |
          MODE (a) — nested min/max/clamp with a pinned evaluation order: the
          incident+escalation subtotal 9*3 + 25*1 = 52 is capped by INCIDENT_PENALTY_CAP to
          40 BEFORE the chargeback and claim terms join the sum, and the 0..100 clamp is
          applied exactly once to the finished sum, so raw 130 lands on risk_score 100
          while the intermediate score reads exactly 75, never 87.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z then 2026-08-11T02:00:00Z."
            - "One host, one jurisdiction rule, one ACTIVE WAIVER listing (max_occupancy 6)."
            - "One UNVERIFIED guest with payment_risk_signal CLEAN and chargeback_count 0, so risk_score is BASE_RISK 35 in tier ELEVATED."
            - "One 3-night reservation for 2 guests, CLEARED (clause 6 needs guest_count >= max_occupancy, and 2 < 6), confirmed and IN_STAY."
            - "Three incidents against that stay: one SAFETY_THREAT (HIGH) and two PROPERTY_DAMAGE, all three acknowledged, and the SAFETY_THREAT one escalated to law enforcement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Bayview Stays LLC", email: "host1@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
