  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_submit_requires_active_account
        grounds:
          - validations[priority=12]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - state_machines.ServiceAccount.transitions
        distinguishing_aspect: |
          Entity pair InterconnectionApplication -> ServiceAccount: submit is gated on the
          ACCOUNT's account_status (a different entity than the one being transitioned);
          SUSPENDED blocks with ERR_ACCOUNT_NOT_ACTIVE and reactivation restores the path.
        test_recipe:
          setup:
            - "Program cap 1000000 (MONETARY_CREDIT, AVOIDED_COST_PAYOUT, tum 4, COMMITTED); feeder peak 10000000 pre 0; transformer nameplate 10000000 pre 0; COMMERCIAL account (usage 20000000) SUSPENDED after creation; application 10000 W in DRAFT."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "CES", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "CES-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-CES", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-CES", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Ces Cust", email: "ces@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-CES", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /service-accounts/${acct}/suspend", payload: {}, as: ProgramAdministrator }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}", captures: { err: $.data.error_id } }
            - { call: "POST /service-accounts/${acct}/reactivate", payload: {}, as: ProgramAdministrator }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
          assert:
            - "err == ERR_ACCOUNT_NOT_ACTIVE with HTTP 422 (application stayed DRAFT)"
            - "After reactivate + resubmit: InterconnectionApplication.${app}.application_status == PENDING_COMPLETENESS and submission_round == 1"

      - name: cesd_pto_requires_exchange_and_passed_inspection
        grounds:
          - state_machines.InterconnectionApplication.SCREEN_PASSED_to_PTO_GRANTED
          - errors[ERR_METER_EXCHANGE_NOT_COMPLETED]
          - errors[ERR_INSPECTION_NOT_PASSED]
        distinguishing_aspect: |
          Entity pairs InterconnectionApplication -> MeterExchange and
          InterconnectionApplication -> Inspection (both distinct from the account pair of the
          sibling instance): PTO checks (1) a COMPLETED exchange exists and (2) the LATEST
          inspection is PASSED, in that order — app1 (no exchange) yields
          ERR_METER_EXCHANGE_NOT_COMPLETED; app2 (exchange COMPLETED, latest inspection FAILED)
          yields ERR_INSPECTION_NOT_PASSED.
        test_recipe:
          setup:
            - "Program cap 1000000 (MONETARY_CREDIT, AVOIDED_COST_PAYOUT, tum 4, COMMITTED); feeder peak 10000000 pre 0; transformer nameplate 10000000 pre 0; two COMMERCIAL accounts (usage 20000000; production 15000000); both applications 10000 W in SCREEN_PASSED."
            - "App2 additionally has a COMPLETED meter exchange and a SCHEDULED-then-FAILED inspection (defects recorded)."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "PTO", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "PTO-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-PTO", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-PTO", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "PTO Cust", email: "pto@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "PTO-1", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct1: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct1}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app1}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app1}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc1b: $.data.id } }
            - { call: "POST /documents/${doc1a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc1b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app1}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app1}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app1}" }, as: DistributionEngineer }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "PTO-2", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct2: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct2}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app2: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app2}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc2a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app2}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2b: $.data.id } }
            - { call: "POST /documents/${doc2a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app2}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app2}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app2}" }, as: DistributionEngineer }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app2}", crew_id: "crew-2", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: MeterTechnician, captures: { ex2: $.data.id } }
            - { call: "POST /meter-exchanges/${ex2}/complete", payload: { installed_meter_serial: "MTR-2" }, as: MeterTechnician, as_user_id: "tech-2" }
            - { call: "POST /inspections", payload: { application_id: "${app2}", scheduled_date: "2026-08-05T09:00:00Z" }, as: Applicant, as_user_id: "${cust}", captures: { insp2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /inspections/${insp2}/record-result", payload: { outcome: FAILED, occurred_at: "2026-08-05T10:00:00Z", defects: "missing rapid shutdown label" }, as: Inspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /applications/${app1}/grant-pto", payload: {}, as: InterconnectionCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /applications/${app2}/grant-pto", payload: {}, as: InterconnectionCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_METER_EXCHANGE_NOT_COMPLETED (exchange gate evaluated before inspection gate)"
            - "err2 == ERR_INSPECTION_NOT_PASSED (latest inspection RESULT_RECORDED with outcome FAILED)"
            - "InterconnectionApplication.${app1}.application_status == SCREEN_PASSED and InterconnectionApplication.${app2}.application_status == SCREEN_PASSED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_tariff_window_half_open_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_TARIFF_WINDOW_OVERLAP]
          - entities.TariffSchedule.fields.effective_from
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) on the TariffSchedule
          resource (per program) — a window starting inside an existing window is rejected, but
          a window starting exactly at the other's effective_to (touching, zero-gap adjacency)
          is accepted. Distinct semantics from the crew-buffer instance.
        test_recipe:
          setup:
            - "Program with tariff T1 [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "TOV", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "T1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "T2", effective_from: "2026-12-01T00:00:00Z", import_rate_millicents_per_kwh: 31000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator, captures: { err: $.data.error_id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "T3", effective_from: "2027-01-01T00:00:00Z", import_rate_millicents_per_kwh: 31000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator, captures: { t3: $.data.id } }
          assert:
            - "err == ERR_TARIFF_WINDOW_OVERLAP with HTTP 422 (2026-12-01 falls inside T1's window)"
            - "T3 created with HTTP 201: TariffSchedule.${t3}.effective_from == 2027-01-01T00:00:00Z (boundary touch allowed under half-open semantics)"
            - "GET /tariff-schedules?program_id=${prog} returns exactly 2 schedules (T1, T3)"

      - name: rto_exchange_crew_buffer_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_EXCHANGE_WINDOW_OVERLAP]
          - entities.MeterExchange.fields.crew_id
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity-with-buffer on the MeterExchange crew resource —
          occupation is [window_start - 30m, window_end + 30m), so a follow-up window must start
          at least 60 minutes after the previous window's end (11:30 start rejected, 12:00 start
          accepted); the buffer and per-crew scoping differ from the tariff's exact half-open
          adjacency.
        test_recipe:
          setup:
            - "Program cap 1000000 (MONETARY_CREDIT, AVOIDED_COST_PAYOUT, tum 4, COMMITTED); feeder peak 10000000 pre 0; transformer nameplate 10000000 pre 0; two COMMERCIAL accounts (usage 20000000, production 15000000) with 10000 W applications both in SCREEN_PASSED."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "XOV", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "XOV-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-XOV", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-XOV", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Xov Cust", email: "xov@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "XOV-1", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct1: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct1}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app1}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app1}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc1b: $.data.id } }
            - { call: "POST /documents/${doc1a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc1b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app1}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app1}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app1}" }, as: DistributionEngineer }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "XOV-2", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct2: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct2}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app2: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app2}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc2a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app2}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2b: $.data.id } }
            - { call: "POST /documents/${doc2a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app2}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app2}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app2}" }, as: DistributionEngineer }
          trigger:
            - { call: "POST /meter-exchanges", payload: { application_id: "${app1}", crew_id: "crew-9", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z" }, as: MeterTechnician, captures: { ex1: $.data.id } }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app2}", crew_id: "crew-9", window_start: "2026-08-10T11:30:00Z", window_end: "2026-08-10T13:00:00Z" }, as: MeterTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app2}", crew_id: "crew-9", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T13:30:00Z" }, as: MeterTechnician, captures: { ex2: $.data.id } }
          assert:
            - "MeterExchange.${ex1}.exchange_status == SCHEDULED (first window created)"
            - "err == ERR_EXCHANGE_WINDOW_OVERLAP with HTTP 422 (buffered [11:00, 13:30) intersects existing buffered [08:30, 11:30))"
            - "MeterExchange.${ex2}.exchange_status == SCHEDULED (12:00 start leaves the pinned 60-minute end-to-start gap; buffered intervals touch but do not intersect)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_reserve_withdraw_capacity_conservation
        grounds:
          - calculations.program_capacity_ledger
          - state_machines.InterconnectionApplication.PENDING_COMPLETENESS_to_CAPACITY_RESERVED
          - entities.Program.fields.available_capacity_watts
        distinguishing_aspect: |
          Conserved quantity: program capacity watts. The forward action (capacity reservation at
          completeness pass) paired with its compensating action (withdrawal before PTO) restores
          available_capacity_watts exactly: interconnected + reserved + available == 1000000 at
          every observation, with zero drift.
        test_recipe:
          setup:
            - "Program cap 1000000 (MONETARY_CREDIT, AVOIDED_COST_PAYOUT, tum 4, COMMITTED); feeder peak 10000000 pre 0; transformer nameplate 10000000 pre 0; COMMERCIAL account (usage 20000000, production 15000000); application 10000 W submitted with docs accepted."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "INV", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
