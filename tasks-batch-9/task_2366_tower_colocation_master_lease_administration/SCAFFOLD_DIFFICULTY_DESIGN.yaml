            - "Tower.${t2_id}.open_review_count == 1"

      - name: site_amendment_parallel_execution_and_billing_axes
        entity: SiteAmendment
        shape: parallel
        grounds:
          - state_machines.SiteAmendment.axis_billing_status.BILLING_to_SUSPENDED
          - state_machines.SiteAmendment.axis_execution_status.EXECUTED_to_TERMINATION_NOTICED
          - endpoints.POST_/tower-colo/site-amendments/{id}/billing-status
        distinguishing_aspect: |
          Non-linearity of SiteAmendment is PARALLELISM across two independent axes on the same
          row: the billing axis moves BILLING->SUSPENDED->BILLING while the execution axis moves
          EXECUTED->TERMINATION_NOTICED, and neither axis constrains the other's position. The
