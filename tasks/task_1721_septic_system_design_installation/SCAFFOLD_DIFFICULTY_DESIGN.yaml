  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: absorption_area_single_terminal_ceil_vs_per_step_ceil
        grounds:
          - calculations.required_absorption_area_sqft
          - calculations.design_daily_flow_gpd
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. With flow 225
          (ONE bedroom on a high-water-table site: 1 * 150 * 1.5), LOAM rate
          0.80, and a shallow limiting layer (20in), the pinned order
          (surcharge -> divide -> multiplier -> ceil exactly once at the end)
          yields ceil(281.25 * 1.25) = ceil(351.5625) = 352 sqft; rounding the
          quotient first yields ceil(281.25) * 1.25 = 352.5 -> 353 sqft. The
          scaffold pins the single-terminal-ceil order. (Note: 2+ bedrooms on
          the same site yield 450/0.80 = 562.5 where the two orders agree —
          the 1-bedroom case is the discriminating fixture.)
        test_recipe:
          setup:
            - "Company/county WH; designer D1, scientist SS1, manager M1"
            - "Site S2 with high_water_table=true (drives the 1.5 surcharge on 1 bedroom -> flow 225)"
            - "Soil evaluation E2: LOAM, limiting_layer_inches 20 (< 24 -> shallow multiplier 1.25); perc PT2 recorded"
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/system-designers"
              payload: { full_name: "Dana Designer", license_number: "DSGN-1" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/soil-scientists"
              payload: { full_name: "Sam Scientist", license_number: "SS-1" }
              as: PlatformAdmin
              captures: { ss1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-2", address_line: "9 Bluff Rd", county_code: "WH", high_water_table: true }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s2: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s2}/soil-evaluations"
              payload: { evaluator_id: "${ss1}", soil_class: "LOAM", limiting_layer_inches: 20 }
              as: SoilScientist
