              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
