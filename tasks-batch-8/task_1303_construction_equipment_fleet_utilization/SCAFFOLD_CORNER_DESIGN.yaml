            - "on-duty -> AVAILABLE; subsequent dispatch succeeds -> W203 DISPATCHED"

      - name: mechanic_off_duty_with_active_work_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Mechanic.AVAILABLE_to_OFF_DUTY, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "off-duty precondition active_work_order_count == 0: a mechanic holding one DISPATCHED order cannot go off duty -> 409 ERR_INVALID_STATE."
        test_recipe:
