        claim_type: unauthenticated
        grounds: ["validations.ERR_UNAUTHENTICATED", "errors.ERR_UNAUTHENTICATED"]
        distinguishing_aspect: "Authentication is checked at priority 10 on EVERY endpoint including the clock and the public listings: a header-less request is 401 ERR_UNAUTHENTICATED and never reaches the 403 role check or the 400 shape check — so a caller cannot probe the model or the pagination bounds anonymously."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z with one segment (Maple St)."
            - "The anonymous caller sends neither X-User-ID nor X-Role."
            - "The first anonymous call is the clock endpoint, whose role list contains all six roles — it is still refused."
            - "The second anonymous call is a listing with limit=101, which would be a 400 if authentication were skipped."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
          trigger:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: Anonymous
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/segments"
              payload: { limit: 101 }
              as: Anonymous
              captures: { e_id2: "$.data.error_id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { pci: "$.data.condition_index" }
          assert:
            - "Both anonymous calls return HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED'."
            - "The second is 401 and NOT 400 ERR_INVALID_REQUEST even though limit=101 is out of bounds — priority 10 precedes priority 30."
            - "Neither is 403 ERR_UNAUTHORIZED."
            - "The clock did not move: an authenticated read still reports condition_index 76.0 (age 10 at 2026-08-01), not the 2027 value."

