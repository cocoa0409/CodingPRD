            - call: "POST /jobs/${ja}/scope-items"
              payload: { kind: "BOARD", opening_count: 1, width_in: 48, height_in: 36, door_count: 0, expected_job_version: "${jva}" }
              as: Dispatcher
              captures: { sia: $.data.id }
            - call: "POST /scope-items/${sia}/install"
              payload: { opening_count: 1, width_in: 48, height_in: 36, door_count: 0 }
              as: Subcontractor
              as_user_id: "${sc}"
            - call: "POST /jobs/${ja}/complete-securing"
              payload: {}
              as: Subcontractor
              as_user_id: "${sc}"
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { jb: $.data.id }
            - call: "POST /jobs/${jb}/dispatch"
