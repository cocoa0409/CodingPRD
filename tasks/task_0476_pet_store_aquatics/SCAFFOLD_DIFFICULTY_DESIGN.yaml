# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pet Store & Aquatics Supply — 9 rules × ≥2 instances (20 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Numeric asserts are pre-computed literals (round_half_up, banker-free).
# Common setup note: the logical clock starts at 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: auto_ship_vs_special_order_rounding_diverge
        grounds:
          - calculations.auto_ship_charge
          - calculations.special_order_total
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - state_machines.SpecialOrder.REQUESTED_to_ALLOCATED
          - entities.Shipment.fields.net_cents
          - entities.SpecialOrder.fields.deposit_cents
        distinguishing_aspect: |
          On identical price/qty/tier inputs (unit_price=1990, qty=3, SILVER tier,
          base_disc=0) auto_ship_charge sums-then-rounds → Shipment.net_cents=5672,
          while special_order_total rounds-per-unit-then-sums → gross_net=5673;
          the two calcs operate on different entity domains (Subscription/Shipment
          vs SpecialOrder) and yield a 1-cent divergence.
        test_recipe:
          setup:
            - "Store S (CA, loyalty_point_value_cents=1), Product P (unit_price_cents=1990, FOOD)."
            - "Customer C at SILVER tier (lifetime_spend_cents=5050000 via one big livestock sale)."
            - "Lot of P at S with 100 on hand; a healthy ON_FLOOR batch B (head 100, price 50500) sold to C to reach SILVER."
            - "A subscription for P (qty_per_cycle=3, discount_pct=0, due now) and a special order for P (qty=3, deposit_pct=0.25)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", loyalty_point_value_cents: 1 }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-FOOD-1", name: "Premium Food", category: "FOOD", unit_price_cents: 1990 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "betta", animal_class: "FISH", head_count: 100, unit_price_cents: 50500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-sales"
              payload: { batch_id: "${b_id}", customer_id: "${c_id}" }
              as: StoreClerk
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 100, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 3, cycle_days: 30, discount_pct: 0, next_ship_at: "2026-01-10T00:00:00Z" }
              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity: 3, deposit_pct: 0.25 }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
              captures: { ship_id: $.data.id }
          assert:
            - "Shipment.${ship_id}.gross_cents == 5970"
            - "Shipment.${ship_id}.net_cents == 5672"
            - "SpecialOrder.${so_id}.deposit_cents == 1418"
            - "SpecialOrder.${so_id}.balance_cents == 4255"
            - "Shipment.${ship_id}.net_cents != (SpecialOrder.${so_id}.deposit_cents + SpecialOrder.${so_id}.balance_cents)"

      - name: tier_timing_frozen_vs_runtime_diverge
        grounds:
          - calculations.special_order_total
          - calculations.auto_ship_charge
          - state_machines.SpecialOrder.REQUESTED_to_ALLOCATED
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          special_order_total freezes tier_disc at REQUEST time (Customer was BRONZE → 0%),
          whereas auto_ship_charge reads tier_disc at RUN time (Customer is now SILVER → 5%);
          the same Customer entity drives two different charges across the SpecialOrder vs
          Subscription domains — SpecialOrder deposit reflects BRONZE, Shipment net reflects SILVER.
        test_recipe:
          setup:
            - "Store S, Product P (unit_price_cents=2000)."
            - "Customer C currently BRONZE; special order for P (qty=2, deposit_pct=1.0) created while BRONZE."
            - "C is then pushed to SILVER via a big livestock sale, then an auto-ship cycle is run."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-2000", name: "Food2k", category: "FOOD", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity: 2, deposit_pct: 1.0 }
              as: StoreClerk
              captures: { so_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "koi", animal_class: "FISH", head_count: 100, unit_price_cents: 50500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-sales"
              payload: { batch_id: "${b_id}", customer_id: "${c_id}" }
              as: StoreClerk
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 50, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 2, cycle_days: 30, discount_pct: 0, next_ship_at: "2026-01-10T00:00:00Z" }
              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
              captures: { ship_id: $.data.id }
          assert:
            - "SpecialOrder.${so_id}.deposit_cents == 4000"
            - "SpecialOrder.${so_id}.balance_cents == 0"
            - "Shipment.${ship_id}.gross_cents == 4000"
            - "Shipment.${ship_id}.net_cents == 3800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: auto_ship_pinned_order_base_then_tier_single_round
        grounds:
          - calculations.auto_ship_charge
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Shipment.fields.net_cents
        distinguishing_aspect: |
          Mode (c): the circular-looking compose of base_disc and tier_disc is pinned to
          base-first-then-tier on the gross SUM with a single final round_half_up — for
          GOLD customer, unit_price=1999, qty=3, base_disc=0.10 the pinned order yields
          net_cents=4858 (4857.57 rounded once), distinct from any per-unit rounding.
        test_recipe:
          setup:
            - "Store S, Product P (unit_price_cents=1999)."
            - "Customer C at GOLD tier (lifetime_spend_cents >= 20000000 via two big livestock sales)."
            - "Subscription for P (qty=3, discount_pct=0.10, due now); lot with 100 units."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-1999", name: "Food1999", category: "FOOD", unit_price_cents: 1999 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cg@x.com", full_name: "C Gold", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "arowana", animal_class: "FISH", head_count: 200, unit_price_cents: 100000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-sales"
              payload: { batch_id: "${b_id}", customer_id: "${c_id}" }
              as: StoreClerk
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 100, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 3, cycle_days: 30, discount_pct: 0.10, next_ship_at: "2026-01-10T00:00:00Z" }
              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
              captures: { ship_id: $.data.id }
          assert:
            - "Shipment.${ship_id}.gross_cents == 5997"
            - "Shipment.${ship_id}.net_cents == 4858"

      - name: special_order_round_per_line_item_then_sum
        grounds:
          - calculations.special_order_total
          - state_machines.SpecialOrder.REQUESTED_to_ALLOCATED
          - entities.SpecialOrder.fields.deposit_cents
          - entities.SpecialOrder.fields.balance_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — special_order_total pins
          round-per-unit-then-sum. For SILVER customer, unit_price=1990, qty=3,
          deposit_pct=0.25 the per-unit round gives 1891, summed to gross_net=5673,
          deposit=1418, balance=4255 — different from a sum-then-round (5672) variant.
        test_recipe:
          setup:
            - "Store S, Product P (unit_price_cents=1990)."
            - "Customer C at SILVER tier; special order qty=3 deposit_pct=0.25."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-1990", name: "Food1990", category: "FOOD", unit_price_cents: 1990 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cs@x.com", full_name: "C Silver", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "koi", animal_class: "FISH", head_count: 100, unit_price_cents: 50500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-sales"
              payload: { batch_id: "${b_id}", customer_id: "${c_id}" }
              as: StoreClerk
          trigger:
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity: 3, deposit_pct: 0.25 }
              as: StoreClerk
              captures: { so_id: $.data.id }
          assert:
            - "SpecialOrder.${so_id}.deposit_cents == 1418"
            - "SpecialOrder.${so_id}.balance_cents == 4255"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_active_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Subscription exhibits a true cycle ACTIVE→PAUSED→ACTIVE on the same entity:
          pause then resume returns status to ACTIVE and refreshes next_ship_at, distinct
          from a linear pipeline that can never return to a prior state.
        test_recipe:
          setup:
            - "Store S, Product P (CLEAR), Customer C, subscription SUB ACTIVE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-C", name: "Food", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { resumed_status: $.data.status }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"

      - name: livestock_batch_parallel_health_and_sale_dimensions
        grounds:
          - state_machines.LivestockBatch.health=QUARANTINE_to_health=HEALTHY
          - state_machines.LivestockBatch.sale=HELD_to_sale=ON_FLOOR
          - entities.LivestockBatch.fields.health_state
          - entities.LivestockBatch.fields.sale_state
        distinguishing_aspect: |
          LivestockBatch carries two independent state dimensions on one row: clearing
          quarantine moves health_state QUARANTINE→HEALTHY while sale_state stays HELD,
          and listing-on-floor then moves sale_state HELD→ON_FLOOR while health stays
          HEALTHY — parallel dimensions, not a single linear status.
        test_recipe:
          setup:
            - "Store S, batch B intake 2026-01-01, quarantine_days=5; clock advanced to 2026-01-10."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "gecko", animal_class: "REPTILE", head_count: 6, unit_price_cents: 8000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
              captures: { hs_after_clear: $.data.health_state, ss_after_clear: $.data.sale_state }
          trigger:
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
              captures: { hs_final: $.data.health_state, ss_final: $.data.sale_state }
          assert:
            - "LivestockBatch.${b_id}.health_state == HEALTHY"
            - "LivestockBatch.${b_id}.sale_state == ON_FLOOR"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_three_hop_lot_product_subscription
        grounds:
          - state_machines.Recall.(creation)_to_OPEN
          - state_machines.Subscription.ACTIVE_to_HALTED
          - entities.InventoryLot.fields.status
          - entities.Product.fields.recall_state
          - entities.Subscription.fields.status
          - entities.Recall.fields.affected_lot_count
          - entities.Recall.fields.halted_subscription_count
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /recalls: hop1 quarantines the AVAILABLE
          lot (status→QUARANTINED) which CAUSES hop2 product.recall_state→RECALLED which
          CAUSES hop3 the ACTIVE subscription→HALTED — each link caused by the prior, not
          by the original action directly.
        test_recipe:
          setup:
            - "Store S (CA), Product P, AVAILABLE lot of P, ACTIVE subscription for P."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-R", name: "Recallable", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 50, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 2, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "MANDATORY" }
              as: InventoryManager
              captures: { recall_id: $.data.id }
          assert:
            - "InventoryLot.${lot_id}.status == QUARANTINED"
            - "Product.${p_id}.recall_state == RECALLED"
            - "Subscription.${sub_id}.status == HALTED"
            - "Recall.${recall_id}.affected_lot_count == 1"
            - "Recall.${recall_id}.halted_subscription_count == 1"

      - name: adoption_close_returns_placement_and_frees_batch
        grounds:
          - state_machines.AdoptionEvent.OPEN_to_CLOSED
          - state_machines.LivestockBatch.sale=RESERVED_to_sale=ON_FLOOR
          - entities.AdoptionPlacement.fields.status
          - entities.AdoptionEvent.fields.placed_head
          - entities.LivestockBatch.fields.sale_state
        distinguishing_aspect: |
          Depth-2 cascade from POST /adoption-events/{id}/close: closing the event CAUSES
          each PLACED placement→RETURNED which CAUSES its RESERVED batch→ON_FLOOR — a
          different triggering transition (event close) and propagation pattern than the
          recall cascade.
        test_recipe:
          setup:
            - "Store S, healthy ON_FLOOR batch B (full head placed), OPEN event E with the batch placed (RESERVED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "hamster", animal_class: "SMALL_ANIMAL", head_count: 4, unit_price_cents: 3000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /adoption-events"
              payload: { store_id: "${s_id}", partner_name: "Rescue", event_date: "2026-01-15T00:00:00Z", capacity: 10 }
              as: StoreClerk
              captures: { e_id: $.data.id }
            - call: "POST /adoption-events/${e_id}/open"
              payload: {}
              as: StoreClerk
            - call: "POST /adoption-placements"
              payload: { event_id: "${e_id}", batch_id: "${b_id}", head: 4 }
              as: LivestockKeeper
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /adoption-events/${e_id}/close"
              payload: {}
              as: StoreClerk
          assert:
            - "AdoptionPlacement.${pl_id}.status == RETURNED"
            - "AdoptionEvent.${e_id}.placed_head == 0"
            - "AdoptionEvent.${e_id}.status == CLOSED"
            - "LivestockBatch.${b_id}.sale_state == ON_FLOOR"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: recall_safety_beats_inventory_fiscal_on_run_shipment
        grounds:
          - validations[priority=13]
          - validations[priority=18]
          - state_machines.Subscription.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          A run-shipment that violates BOTH the recall safety gate (priority 13,
          business_safety) AND the inventory fiscal gate (priority 18, business_fiscal)
          must return ERR_PRODUCT_RECALLED, not ERR_INSUFFICIENT_INVENTORY — the
          business_safety category wins over business_fiscal.
        test_recipe:
          setup:
            - "Store S, Product P, ACTIVE subscription due now with qty=5; lot has only 1 free unit; then P is recalled (lot quarantined)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-RS", name: "RecSafe", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 1, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: StoreClerk
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 5, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "MANDATORY" }
              as: InventoryManager
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PRODUCT_RECALLED"

      - name: batch_state_beats_health_safety_on_list_on_floor
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - state_machines.LivestockBatch.sale=HELD_to_sale=ON_FLOOR
        distinguishing_aspect: |
          Listing a batch on the floor that is BOTH already SOLD_OUT (state, priority 8)
          AND CONDEMNED/not-healthy (business_safety, priority 12) must return the state
          error ERR_BATCH_SALE_STATE_INVALID, not ERR_BATCH_NOT_HEALTHY — a different
          error-category pair (state vs business_safety) than the recall/inventory conflict.
        test_recipe:
          setup:
            - "Store S, batch B condemned via 50% mortality → health_state CONDEMNED, sale_state SOLD_OUT."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "guppy", animal_class: "FISH", head_count: 10, unit_price_cents: 500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /livestock-batches/${b_id}/record-mortality"
              payload: { deaths: 5 }
              as: LivestockKeeper
          trigger:
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BATCH_SALE_STATE_INVALID"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_silver_threshold_inclusive
        grounds:
          - calculations.loyalty_tier
          - entities.Customer.fields.loyalty_tier
          - state_machines.LivestockBatch.sale=ON_FLOOR_to_sale=SOLD_OUT
        distinguishing_aspect: |
          A customer whose lifetime_spend_cents lands exactly on SILVER_THRESHOLD
          (5000000) becomes SILVER (>= inclusive), reachable via a single livestock sale
          of head=100 at unit_price=50000 (BRONZE 0% → net 5000000) on POST /livestock-sales.
        test_recipe:
          setup:
            - "Store S, healthy ON_FLOOR batch B (head 100, price 50000), Customer C (BRONZE)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "tetra", animal_class: "FISH", head_count: 100, unit_price_cents: 50000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
          trigger:
            - call: "POST /livestock-sales"
              payload: { batch_id: "${b_id}", customer_id: "${c_id}" }
              as: StoreClerk
          assert:
            - "Customer.${c_id}.lifetime_spend_cents == 5000000"
            - "Customer.${c_id}.loyalty_tier == SILVER"

      - name: mortality_condemn_rate_exactly_half_condemns
        grounds:
          - calculations.mortality_condemn_rate
          - state_machines.LivestockBatch.health=QUARANTINE_to_health=UNDER_TREATMENT
          - entities.LivestockBatch.fields.health_state
        distinguishing_aspect: |
          mortality_count/head_count exactly == 0.5 (deaths=5 of head_count=10) condemns
          the batch (>= inclusive) on POST /livestock-batches/{id}/record-mortality — a
          ratio boundary on a different metric and endpoint than loyalty_tier's spend.
        test_recipe:
          setup:
            - "Store S, batch B head_count=10 in QUARANTINE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "molly", animal_class: "FISH", head_count: 10, unit_price_cents: 500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /livestock-batches/${b_id}/record-mortality"
              payload: { deaths: 5 }
              as: LivestockKeeper
              captures: { hs: $.data.health_state }
          assert:
            - "LivestockBatch.${b_id}.health_state == CONDEMNED"
            - "LivestockBatch.${b_id}.sale_state == SOLD_OUT"
            - "LivestockBatch.${b_id}.mortality_count == 5"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: prescription_issue_requires_completed_vet_exam
        grounds:
          - validations[priority=15]
          - state_machines.ClinicAppointment.CHECKED_IN_to_COMPLETED
          - entities.Prescription.fields.issued_by_appointment_id
        distinguishing_aspect: |
          Prescription creation (Customer↔ClinicAppointment pair) is gated on the
          referenced appointment being a COMPLETED VET_EXAM for the same customer;
          a BOOKED appointment yields ERR_APPOINTMENT_NOT_ELIGIBLE — Prescription's
          validity depends on ClinicAppointment's state.
        test_recipe:
          setup:
            - "Store S, Customer C, a VET_EXAM appointment booked/checked-in/COMPLETED for C."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RX-1", name: "Rx Diet", category: "MEDICATION", unit_price_cents: 4000, is_prescription_diet: true }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /clinic-appointments"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", service_type: "VET_EXAM", room: "R1", start_at: "2026-01-05T09:00:00Z", end_at: "2026-01-05T10:00:00Z", fee_cents: 8000 }
              as: ClinicVet
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T09:30:00Z" }
              as: ClinicVet
            - call: "POST /clinic-appointments/${appt_id}/check-in"
              payload: {}
              as: ClinicVet
            - call: "POST /clinic-appointments/${appt_id}/complete"
