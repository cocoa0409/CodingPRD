        distinguishing_aspect: "The rule is an exact equality, so both a one-cent underpayment (45359) and a one-cent overpayment (45361) are refused on the same 45360 invoice, and only the exact amount settles it; the refused attempts leave paid_amount_cents at 0."
        test_recipe:
          setup:
