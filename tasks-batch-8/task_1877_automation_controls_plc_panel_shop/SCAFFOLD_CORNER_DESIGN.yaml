              captures: { p_dr: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "PS-DR10", component_class: "POWER_SUPPLY", unit_cost_cents: 30000, lead_time_days: 10, sccr_ka: 10, heat_dissipation_w: 40 }
              as: QAManager
              captures: { comp_dr0: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "PS-DR5", component_class: "POWER_SUPPLY", unit_cost_cents: 25000, lead_time_days: 3, sccr_ka: 5, heat_dissipation_w: 40 }
              as: QAManager
              captures: { comp_dr_lo: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "PS-DR22", component_class: "POWER_SUPPLY", unit_cost_cents: 32000, lead_time_days: 12, sccr_ka: 22, heat_dissipation_w: 40 }
              as: QAManager
              captures: { comp_dr_hi: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_dr}/components"
              payload: { component_id: "${comp_dr0}", quantity: 1 }
              as: DesignEngineer
              captures: { line_dr: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_dr}/substitution-requests"
              payload: { original_line_id: "${line_dr}", proposed_component_id: "${comp_dr_lo}", reason: "cheaper" }
              as: DesignEngineer
              as_user_id: "de-dr"
              captures: { sub_dr_lo: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_dr}/substitution-requests"
              payload: { original_line_id: "${line_dr}", proposed_component_id: "${comp_dr_hi}", reason: "higher sccr" }
              as: DesignEngineer
              as_user_id: "de-dr"
              captures: { sub_dr_hi: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/substitution-requests/${sub_dr_lo}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-dr"
              captures: { err_dr: "$.data.error_id" }
            - call: "POST /panel-shop/substitution-requests/${sub_dr_hi}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-dr"
          assert:
            - "low-SCCR approval rejected with ERR_SUBSTITUTION_DOWNRATED http 422"
            - "SubstitutionRequest.${sub_dr_lo}.status remains REQUESTED"
            - "high-SCCR approval succeeds: SubstitutionRequest.${sub_dr_hi}.status == APPROVED"

      - name: remote_support_requires_remote_access_grant
        claim_type: conditional_validation
        grounds: ["validations[priority=20]", "errors[ERR_REMOTE_ACCESS_REQUIRED]"]
        distinguishing_aspect: "support_mode REMOTE with remote_access_granted false is rejected at creation; the same payload with remote_access_granted true succeeds — behavior conditioned on the flag combination."
