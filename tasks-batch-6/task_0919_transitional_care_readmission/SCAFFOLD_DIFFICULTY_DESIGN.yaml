              captures: { h1_status: $.data.status }
          assert:
            - "Before the trigger Navigator.${nav1_id}.active_episode_count == 2 and Navigator.${nav2_id}.active_episode_count == 0, sum == 2"
            - "HandoffRequest.${h1_id}.status == ACCEPTED and responded_at == 2026-05-01T16:00:00.000Z"
            - "After the trigger Navigator.${nav1_id}.active_episode_count == 1 and Navigator.${nav2_id}.active_episode_count == 1, sum == 2"
            - "Navigator.${nav1_id}.workload_score == 1 with availability_status AVAILABLE; Navigator.${nav2_id}.workload_score == 1 with availability_status AVAILABLE"
            - "CareEpisode.${ep1_id}.navigator_id == ${nav2_id} and CareEpisode.${ep2_id}.navigator_id == ${nav1_id}"
            - "The sum of active_episode_count across both navigators equals the 2 episodes whose status is in {INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED}"
