      - name: net_service_fee_pinned_circular_tier_evaluation_on_session
        grounds:
          - calculations.net_service_fee
          - entities.Appointment.fields.governing_screening_id
          - state_machines.Appointment.SCREENED_to_REFUSED
        distinguishing_aspect: |
          Mode (c): the tier rate is selected from pre_discount_subtotal_cents BEFORE the re-pierce
          discount is subtracted, so the pinned evaluation order makes the value well-defined. An
          evaluation order that instead selects the tier after subtracting the re-pierce discount
          yields 7480 rather than the pinned 9520 for identical inputs.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Jurisdiction IL (permitted_sites includes LOBE). Store S1 with 2 rooms. Piercer P1 VALID. Customer C1 (age 30), consent ACTIVE. Cycle Y1 PASSED, lot L1 bound with 50 units. Appointment A2 CONFIRMED but SCREENED to REFUSED."
