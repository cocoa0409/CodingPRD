  - rule_id: transitive_cascade
    instances:
      - name: baseline_approval_three_hop_cascade
        grounds:
          - state_machines.Baseline.PROPOSED_to_APPROVED
          - state_machines.Enrollment.ACCEPTED_to_ACTIVE
          - state_machines.Field.MAPPED_to_ENROLLED
          - entities.Grower.fields.total_enrolled_acres
          - endpoints[POST /baselines/{baseline_id}/approve]
        distinguishing_aspect: |
          One approval walks three entities the caller never names: Baseline -> Enrollment
          (status ACTIVE plus permanence_status IN_COMPLIANCE) -> Field (MAPPED -> ENROLLED) ->
          Grower.total_enrolled_acres. The grower aggregate is deliberately fed by
          Field.mapped_acres (1000.00) and NOT by Enrollment.enrolled_acres (900.00), so an
          implementation that stops at hop 2, or that reaches hop 3 with the wrong operand,
          is caught by a single number.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1."
            - "Grower G6 ACTIVE with total_enrolled_acres 0.00; field F6 (0,0)-(2000,2000) MAPPED with mapped_acres 1000.00."
            - "Standard 2021-2025 practice history on F6 (2021 FARM_RECORD 200.00 adopted, 2022 REMOTE_SENSING 500.00 adopted, non-adopted 2023 FARM_RECORD / 2024 EQUIPMENT_TELEMETRY / 2025 FARM_RECORD)."
            - "Enrollment E6 on F6 with enrolled_acres 900.00 (deliberately BELOW mapped_acres), screened ACCEPT by admin-screener-01, so status is ACCEPTED and permanence_status is PENDING."
            - "Baseline B6 (HISTORICAL_DATA) on E6 is PROPOSED, created by admin-baseline-01."
