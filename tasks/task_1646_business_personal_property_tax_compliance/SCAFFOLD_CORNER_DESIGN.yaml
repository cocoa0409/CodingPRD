  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: envelope_shape
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id + meta.api_request_timestamp + response_type 'object' + data; errors have response_type 'error' + data.error_id + data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /bpp/clients"
              payload: { legal_name: "EnvCo", contact_email: "env@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "GET /bpp/clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Create response: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.legal_name == EnvCo, HTTP 201"
            - "Error response: response_type == error, err == ERR_NOT_FOUND, data.message present, HTTP 404"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_unclassified_assets_covered
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_UNCLASSIFIED_ASSETS]"
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / file_blocked_by_unclassified_asset"
          rationale: "Triggered and asserted in the named §1.8 instance."

      - name: err_notice_not_appealable_covered
        claim_type: error_triggerable
