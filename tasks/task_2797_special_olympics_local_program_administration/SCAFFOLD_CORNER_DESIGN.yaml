            - call: "POST /unified-teams/${team}/members"
              payload: { member_type: "PARTNER", member_id: "${p1}", expected_team_version: "${tv2}" }
              as: CompetitionDirector
              captures: { tv3: $.data.version }
            - call: "POST /unified-teams/${team}/members"
              payload: { member_type: "ATHLETE", member_id: "${a2}", expected_team_version: "${tv3}" }
              as: CompetitionDirector
              captures: { tv4: $.data.version }
          trigger:
            - call: "POST /unified-teams/${team}/members"
              payload: { member_type: "PARTNER", member_id: "${p2}", expected_team_version: "${tv4}" }
              as: CompetitionDirector
          assert:
            - "HTTP 200 and UnifiedTeam.${team}.athlete_count == 2 and partner_count == 2"
            - "UnifiedTeam.${team}.age_span_years == 5 (27 - 22, measured at 2026-10-05)"
            - "UnifiedTeam.${team}.roster_status == COMPLIANT"
            - "UnifiedTeam.${team}.version == 5 - one increment per member add on top of creation"
            - "UnifiedTeam.${team}.athlete_ids == [${a1}, ${a2}] and partner_volunteer_ids == [${p1}, ${p2}] in insertion order"
            - "the response after the first add showed roster_status FORMING and the response after the third add showed NON_COMPLIANT"

      - name: attendance_threshold_at_boundary_minutes
        claim_type: threshold
        grounds:
          - calculations.attendance_counting_threshold
        excluded_because:
          difficulty_instance: boundary_precision_check / attendance_counted_minutes_threshold_boundary
          rationale: "required_minutes - 1, required_minutes and required_minutes + 1 are all asserted there against the ceil()ed 0.75 fraction on two different session durations."

      - name: practice_minute_running_total_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.program_practice_minute_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / session_cancel_conserves_practice_minute_ledger
          rationale: "That instance asserts the running total after the add and again after the cancellation reversal, at athlete and program level."

      - name: in_kind_recognition_tier_selection
        claim_type: tiered_pricing
        grounds:
          - calculations.contribution_recognized_value
        excluded_because:
          difficulty_instance: dual_variant_calc / contribution_in_kind_recognition_variants
          rationale: "The cap tier and the discount tier are computed from one identical stated value there, which is exactly this row's boundary claim."

      - name: merge_pass_reaches_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.undersized_division_merge
        excluded_because:
          difficulty_instance: combinatorial_formula / undersized_division_merge_order
          rationale: "Propagation through the source list, the snapshot pinning and the no-second-merge fixed point are all asserted there."

      - name: performance_ratio_direction_weighting
        claim_type: weighted_scoring
        grounds:
          - calculations.entry_performance_ratio
        excluded_because:
          difficulty_instance: dual_variant_calc / entry_performance_ratio_direction_variants
          rationale: "Identical skill_score and result_value pairs are scored under both directions there and the two ratios are asserted to differ."

      - name: contribution_variant_divergence_on_identical_input
        claim_type: Variant Divergence
        grounds:
          - calculations.contribution_recognized_value.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / contribution_in_kind_recognition_variants
          rationale: "Same stated_value_cents, two contribution types, two different recognised values plus the asserted delta - the divergence claim in full."

