            - call: "POST /roster-slots"
              payload: { team_id: "${tm_id}", student_id: "${st_id}", slot_role: "SUB" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { sl_again_id: $.data.id }
          assert:
            - "trigger 1 returns 409 with data.error_id == ERR_DUPLICATE_NCES_CODE"
            - "trigger 2 returns 201 — the same nces_code in a DIFFERENT district is legal"
            - "trigger 3 returns 409 with data.error_id == ERR_DUPLICATE_TITLE_NAME (title names are global)"
            - "trigger 4 returns 409 with data.error_id == ERR_DUPLICATE_TEAM_NAME"
            - "trigger 5 returns 201 — the same team name in a DIFFERENT season is legal"
            - "trigger 6 returns 409 with data.error_id == ERR_DUPLICATE_TITLE_APPROVAL (the incumbent is still PENDING)"
            - "trigger 7 returns 409 with data.error_id == ERR_DUPLICATE_ROSTER_SLOT even though the requested slot_role differs"
            - "trigger 8 returns 200 with data.participation_status == RELEASED and data.released_at == 2026-08-01T00:00:00.000Z"
            - "trigger 9 returns 201 — the (team, student) pair is free again once the incumbent slot is RELEASED"
            - "Team.${tm_id}.starter_slots_used == 0 and starter_slots_available == 3 after the release, and the new SUB slot leaves both unchanged"
            - "exactly one School row exists in district ${d1_id} and exactly one in district ${d2_id}"

      - name: enrollment_verification_gate_ladder_refuses_each_precondition_in_priority_order
        claim_type: cascading_validation
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - validations[priority=28]
          - validations[priority=30]
          - errors[ERR_STUDENT_NOT_ENROLLED]
          - errors[ERR_ENROLLMENT_CERTIFICATION_LAPSED]
          - errors[ERR_BIRTHDATE_DOCUMENT_MISMATCH]
          - errors[ERR_STUDENT_OVER_AGE_LIMIT]
          - state_machines.RosterSlot.UNVERIFIED_to_ENROLLMENT_VERIFIED.preconditions
        distinguishing_aspect: |
          The age checks CANNOT run before the document check, because age_at_cutoff is
          derived from verified_birthdate: the mismatch probe deliberately supplies a
          document birthdate of 2001-01-01, which would make the student 25 at the cutoff
          and trip the over-age ceiling. The only correct answer is
          ERR_BIRTHDATE_DOCUMENT_MISMATCH — an implementation that computes the age first
          returns ERR_STUDENT_OVER_AGE_LIMIT and fails. The over-age probe is the ceiling
          side of the same derived value: max_age is EXCLUSIVE, so an age of exactly 19
          against max_age 19 is over-age.
        test_recipe:
          setup:
            - "One district; school A has the default enrollment_verified_through 2027-06-30, school B has a LAPSED 2026-07-31 (the clock sits at 2026-08-01T00:00:00.000Z)"
            - "Both schools have a CERTIFIED coach and a DRAFT team; season defaults apply (age_cutoff_date 2026-09-01, max_age 19, max_starters 3) and the title's min_player_age is 13"
            - "Four students: one WITHDRAWN, one enrolled at the lapsed school, one for the document-mismatch probe, one born 2007-08-31 who is exactly 19 at the cutoff, and one clean student"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
