          assert:
            - "${cov_1} == WEB_ONLY and ${cnt_1} == 1"
            - "${cov_2} == PARTIAL and ${cnt_2} == 2"
            - "${and_status} == SHIPPED"
            - "${cov_3} == FULL and ${cnt_3} == 3"
            - "${gov_3} == 75.00 (all three shipped rows score 75.00, so the MIN roll-up is 75.00)"

      - name: governance_rollup_excludes_planned_implementations_from_the_minimum
        claim_type: Input Set Filtering
        grounds:
          - calculations.a11y_conformance_score
          - entities.Component.fields.governance_conformance_score
          - entities.PlatformImplementation.fields.status
        distinguishing_aspect: |
          The component roll-up is a MIN over implementations whose status is SHIPPED or BLOCKED
          only. Filing a catastrophic audit (3 criticals, defect_load 30, implementation score
          63.00) against a PLANNED implementation must leave the component's governance score at
          the shipped implementation's 75.00 — an implementation that is not in production does
          not drag the component down.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge`"
            - "WEB implementation with one clean AUTOMATED AA audit, already shipped (score 75.00)"
            - "IOS implementation still PLANNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { web_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${web_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/web-clean" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${web_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { web_score: $.data.conformance_score }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "IOS", package_name: "DSBadge", package_version: "0.9.0", token_compliance_ratio: 0.60 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { ios_id: $.data.id, ios_status: $.data.status }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { gov_before: $.data.governance_conformance_score }
          trigger:
            - call: "POST /design-system/platform-implementations/${ios_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 3, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/ios-bad" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { bad_load: $.data.defect_load }
            - call: "GET /design-system/platform-implementations/${ios_id}"
              payload: {}
              as: DesignSystemLead
              captures: { ios_score: $.data.conformance_score }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { gov_after: $.data.governance_conformance_score }
          assert:
            - "${web_score} == 75.00 and ${ios_status} == PLANNED"
            - "${gov_before} == 75.00"
            - "${bad_load} == 30"
            - "${ios_score} == 63.00"
            - "${gov_after} == 75.00"

      - name: adoption_ratio_and_index_round_half_up_at_each_of_the_two_stages
        claim_type: Precision
        grounds:
          - calculations.team_adoption_index
          - entities.AdoptionScan.fields.adoption_ratio
          - entities.Team.fields.adoption_index_latest
          - entities.Team.fields.adoption_index_trailing
        distinguishing_aspect: |
          2 of 3 instances is 66.666...; the per-scan ratio must be stored as 66.67 (round_half_up
          at 2 dp, not truncated to 66.66), and the weighted index must then be computed from that
          stored value: 0.70 * 66.67 + 0.30 * 0.00 = 46.669 which must round to 46.67, not 46.66
          and not the 46.67 an unrounded 46.6666 would coincidentally also give.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` with no scans yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id, idx0_latest: $.data.adoption_index_latest }
          trigger:
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-07-01T00:00:00.000Z", window_end_at: "2026-07-31T00:00:00.000Z", system_instance_count: 2, legacy_instance_count: 1, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { scan_id: $.data.id, ratio: $.data.adoption_ratio, scanned: $.data.scanned_at }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { idx_latest: $.data.adoption_index_latest, idx_trailing: $.data.adoption_index_trailing }
          assert:
            - "${idx0_latest} == 0.00"
            - "HTTP status == 201 on the scan"
            - "${ratio} == 66.67"
            - "${scanned} == 2026-08-01T00:00:00.000Z"
            - "${idx_latest} == 46.67 and ${idx_trailing} == 46.67"

      - name: missing_method_penalty_disappears_when_the_manual_pass_is_filed
        claim_type: weighted_scoring
        grounds:
          - calculations.a11y_conformance_score
          - entities.AccessibilityAudit.fields.defect_load
          - entities.PlatformImplementation.fields.conformance_score
        distinguishing_aspect: |
          The two method weights (0.4 AUTOMATED, 0.6 MANUAL) and the 25.00 missing-method penalty
          must compose exactly: with only an AUTOMATED audit of defect_load 5 the score is
          100 - 0.4*5 - 25 = 73.00, and filing a MANUAL audit of defect_load 2 must both remove
          the penalty and add its own weighted load, giving 100 - 2.00 - 1.20 = 96.80 — a score
          that rises on new evidence, which only the latest_evidence variant does.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge`; PLANNED WEB implementation"
            - "one AUTOMATED AA audit with 1 serious and 1 moderate violation (defect_load 5)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 1, violations_moderate: 1, evidence_url: "https://ds.example.com/a11y/auto" }
