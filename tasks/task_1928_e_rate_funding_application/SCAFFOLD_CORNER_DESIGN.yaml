              as_user_id: "usac-emp-9"
            - call: "POST /erate/funding-requests/${rq}/request-info"
              payload: { info_request_text: "Provide contract pages 4-7" }
              as: PIAReviewer
              as_user_id: "usac-emp-9"
              captures: { rq_v4: $.data.version }
          trigger:
            - call: "POST /erate/funding-requests/${rq}/decide"
              payload: { outcome: "COMMITTED" }
              as: CommitmentOfficer
              as_user_id: "usac-emp-7"
              captures: { err: $.data.error_id }
            - call: "POST /erate/funding-requests/${rq}/pia-responses"
              payload: { response_text: "Pages attached", expected_request_version: "${rq_v4}" }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (decide forbidden while INFORMATION_REQUESTED)"
            - "st == PIA_REVIEW after the applicant response unblocks review"

      - name: appeal_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Appeal.UNDER_REVIEW_to_DENIED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A DENIED appeal is terminal: a second decide fails ERR_INVALID_STATE_TRANSITION and the request stays DENIED."
        test_recipe:
          setup: ["FY2027; request DENIED on 2027-04-15; appeal decided DENIED on 2027-05-10"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/eligible-services"
              payload: { funding_cycle_id: "${cyc}", service_description: "Dedicated Internet Access 1Gbps", category: "CATEGORY_ONE", service_type: "INTERNET_ACCESS" }
