        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pto1: $.data.id
      trigger:
      - call: POST /gse/llpa-matrices
        payload:
          effective_from: '2026-09-01T00:00:00Z'
          effective_until: '2027-03-01T00:00:00Z'
          rows:
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 25
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
        as: GseAdmin
        captures:
          m2: $.data.id
      - call: GET /gse/pipelines/${pto1}
        payload: {}
        as: GseAdmin
      assert:
      - creating M2 with effective_from == M1.effective_until succeeds (adjacent half-open windows, no overlap error)
      - LlpaMatrix.${m1}.status == SUPERSEDED and exactly one grid is ACTIVE afterwards
      - 'Pipeline.${pto1}.projected_value_cents == 399000000 (repriced under M2 at 25 bps: 400,000,000 - 1,000,000)'
  - name: servicing_transfer_strictly_future_effective_date
    grounds:
