      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "any request without X-User-ID / X-User-Role fails 400 before role, existence, or business checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /golf-shop/component-items"
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "when sent without the X-User-* headers the response is 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: customer_role_cannot_create_component_item
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Customer is not in the roles list for POST /component-items -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["customer C exists"]
          setup_api_calls:
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Pat Plain", email: "pat@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/component-items"
              payload: { sku: "HD-X", component_type: "HEAD", unit_cost_cents: 100, msrp_cents: 200, initial_stock: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with error_id == ERR_FORBIDDEN_ROLE; no ComponentItem created"

