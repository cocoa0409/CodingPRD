      - name: feed_source_share_round_per_placement_then_sum
        grounds:
          - calculations.referral_attributed_share_cents
          - entities.FeedSource.fields.accrued_share_cents
          - state_machines.ReferralPlacement.ACCEPTED_to_CONVERTED
          - entities.ReferralPlacement.fields.feed_source_share_cents
        distinguishing_aspect: |
          Mode (b) nested rounding whose order is observable: each placement's commission is rounded
          (3715 * 0.30 * 0.90 = 1003.05 -> 1003), then its feed share is rounded on that rounded value
          (1003 * 0.175 = 175.525 -> 176), and only then are the two placements summed, so
