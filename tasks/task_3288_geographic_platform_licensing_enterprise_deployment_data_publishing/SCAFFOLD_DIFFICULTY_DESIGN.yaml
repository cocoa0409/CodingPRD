# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3288_geographic_platform_licensing_enterprise_deployment_data_publishing
# Nine Difficulty Rules × 2 instances each = 18 instances. Every instance is
# grounded in SCAFFOLD.yaml §1.1–§1.7 and reproducible from empty-DB via its
# setup_api_calls chain. Shared bootstrap chains are anchored (&boot_*).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: credit_settle_late_fee_diverges_from_provisional
        grounds:
          - calculations.credit_consumption
        distinguishing_aspect: "Same batch, two variants of credit_consumption: provisional (round per tier, charged at creation) vs chronological (single rounding + 10% per-period late fee at settle) — settling one period later charges exactly 1.1x the provisional amount, so the variants diverge on the CreditBatch entity domain."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z (period 0). Org ACTIVE with CreditPool capacity 100000. ACTIVE NAMED_USER grant; one ACTIVE NamedUser with an ApiKey allowing GEOCODE."
            - "A GEOCODE batch of 100 units created at period 0: provisional = 100*4 = 400."
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &mk_org
              call: "POST /geo-orgs"
              payload: { name: "Meridian GIS Co", org_kind: "COMMERCIAL", home_region: "US" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - &mk_pool
              call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org_id}", capacity_credits: 100000 }
              as: BillingAdmin
              captures: { pool_id: $.data.id }
            - &mk_prod_named
              call: "POST /geo-orgs/license-products"
              payload: { product_code: "DESKTOP-PRO-11", license_kind: "NAMED_USER", edition: "ADVANCED", major_version: 11, base_seat_count: 50, supports_offline: true, allows_derivative_works: true }
              as: PlatformAdmin
              captures: { prod_named_id: $.data.id }
            - &mk_grant_named
              call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 10, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_named_id: $.data.id }
            - &act_org
              call: "POST /geo-orgs/${org_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: PlatformAdmin
            - &act_grant_named
              call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - &mk_user
              call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "ada", email: "ada@meridian.example", named_user_level: "PROFESSIONAL", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
              captures: { user_id: $.data.id }
            - &accept_user
              call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${user_id}"
            - &mk_key
              call: "POST /geo-orgs/api-keys"
              payload: { named_user_id: "${user_id}", organization_id: "${org_id}", label: "geocode-key", allowed_service_kinds: ["GEOCODE", "ANALYSIS", "STORAGE", "TILE_QUERY", "ROUTING"], per_key_credit_cap: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { key_id: $.data.id }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 100, idempotency_key: "idem-gc-100" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version" }
          trigger:
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
          assert:
            - "CreditBatch.${batch_id}.provisional_credits == 400"
            - "CreditBatch.${batch_id}.settled_credits == 440 (round_half_up(400 * 1.1) — one full period pending)"
            - "CreditBatch.${batch_id}.settled_credits != CreditBatch.${batch_id}.provisional_credits"
            - "CreditPool.consumed_credits == 440 and reserved_credits == 0 and Organization.${org_id}.credit_balance == 99560"

      - name: credit_projection_forward_vs_chronological
        grounds:
          - calculations.credit_burn_projection
        distinguishing_aspect: "Same org state, two projection variants over different input domains than per-batch charging: forward (live seats × per-seat burn × N + consumed + reserved) vs chronological (settled-batch history replay scaled by periods_alive) — with 1 seat in use and one settled 400-credit batch at period 2, forward gives 4420 while chronological gives 1200."
        test_recipe:
          setup:
            - "Base setup as above; one GEOCODE batch of 100 units created and settled within period 0 (settled = 400); clock then advanced to period 2; grant has seats_in_use = 1 (ada ACTIVE on a NAMED_USER grant)."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - *mk_key
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 100, idempotency_key: "idem-gc-100" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_id: $.data.id }
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version" }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /geo-orgs/${org_id}/credit-pool-projection"
              payload: { periods: 10, mode: "forward" }
              as: BillingAdmin
              captures: { proj_fwd: $.data.projected_credits }
            - call: "GET /geo-orgs/${org_id}/credit-pool-projection"
              payload: { periods: 10, mode: "chronological" }
              as: BillingAdmin
              captures: { proj_chr: $.data.projected_credits }
          assert:
            - "proj_fwd == 4420 (consumed 400 + reserved 0 + 10 periods * (1 seat * 2 per-seat burn))"
            - "proj_chr == 2000 (round_half_up(400 * 10 / max(1, 2 - 0)) = 400 * 5)"
            - "proj_fwd != proj_chr — the forward variant reads live seats while the chronological variant replays settled-batch history"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: geocode_tier_straddle_with_extension_uplift
        grounds:
          - calculations.credit_consumption
        distinguishing_aspect: "Mode (a): ≥3 inputs with non-linear interaction — requested_units straddling two GEOCODE tiers (101 units = 100×4 + 1×3), plus an extension uplift that applies ONLY when service_kind == ANALYSIS, so an identical 101-unit batch with extension_code set on GEOCODE is rejected rather than uplifted."
        test_recipe:
          setup:
            - "Base setup: org ACTIVE, pool 100000, ACTIVE user + key allowing GEOCODE and ANALYSIS. An ANALYSIS product with an extension SPATIAL_ANALYST (rate 3/op), grant ACTIVE, ExtensionGrant ACTIVE for SPATIAL_ANALYST."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - *mk_key
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "ANALYTICS-SUITE-11", license_kind: "CONCURRENT_USE", edition: "ADVANCED", major_version: 11, base_seat_count: 20, supports_offline: false, allows_derivative_works: true, extension_modules: [{ extension_code: "SPATIAL_ANALYST", additional_credit_rate_per_op: 3, required_min_edition: "STANDARD" }] }
              as: PlatformAdmin
              captures: { prod_an_id: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_an_id}", grant_kind: "STANDARD", seats_allocated: 5, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_an_id: $.data.id }
            - call: "GET /geo-orgs/${org_id}"
              payload: {}
              as: LicenseAdmin
              captures: { org_v1: $.data.version }
            - call: "POST /geo-orgs/license-grants/${grant_an_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v1}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/extension-grants"
              payload: { license_grant_id: "${grant_an_id}", extension_code: "SPATIAL_ANALYST", seats_allocated: 5 }
              as: LicenseAdmin
          trigger:
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 101, idempotency_key: "idem-gc-101" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_gc: $.data.id, prov_gc: $.data.provisional_credits }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "ANALYSIS", requested_units: 11, extension_code: "SPATIAL_ANALYST", idempotency_key: "idem-an-11" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_an: $.data.id, prov_an: $.data.provisional_credits }
          assert:
            - "prov_gc == 403 (tier1: round_half_up(100*4)=400; tier2: round_half_up(1*3)=3; sum 403 — NOT 101*3=303 and NOT 404)"
            - "prov_an == 463 (tier1: round_half_up(10*(40+3)) = 430; tier2: round_half_up(1*(30+3)) = 33; 430 + 33 = 463 — extension uplift applied per tier inside the rate, not appended after rounding)"
            - "CreditPool.reserved_credits == 403 + 463 == 866"

      - name: overage_marginal_at_checkout_vs_sustained_at_period
        grounds:
          - calculations.concurrent_seat_overage_fee
        distinguishing_aspect: "Mode (c): the same tier table feeds a circular-looking pair — checkout accrues the MARGINAL fee for the newly occupied overage seat while the period advance re-charges the AVERAGE form over ALL sustained seats; evaluation order (checkout first, then period sweep) is pinned so the accrued total is well-defined and differs from either single interpretation."
        test_recipe:
          setup:
            - "Org ACTIVE with a CONCURRENT_USE grant (seats_allocated 1). Two users home on that grant, both ACTIVE — the second accept pushes seats_in_use to 2 (1 overage seat, marginal fee 250)."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "DESKTOP-CC-11", license_kind: "CONCURRENT_USE", edition: "STANDARD", major_version: 11, base_seat_count: 5, supports_offline: false, allows_derivative_works: false }
              as: PlatformAdmin
              captures: { prod_cc_id: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_cc_id}", grant_kind: "STANDARD", seats_allocated: 1, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_cc_id: $.data.id }
            - *act_org
            - call: "POST /geo-orgs/license-grants/${grant_cc_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "u1", email: "u1@meridian.example", named_user_level: "VIEWER", home_license_grant_id: "${grant_cc_id}" }
              as: LicenseAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "u2", email: "u2@meridian.example", named_user_level: "VIEWER", home_license_grant_id: "${grant_cc_id}" }
              as: LicenseAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /geo-orgs/named-users/${u1_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /geo-orgs/named-users/${u2_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${u2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "After u2 accept: LicenseGrant.${grant_cc_id}.seats_in_use == 2 (overage metered, not blocked)"
            - "After u2 accept: Organization.${org_id}.seat_overage_fee_accrued_cents == 250 (marginal fee for overage seat 1)"
            - "After the one-day clock advance: seat_overage_fee_accrued_cents == 500 (sustained average-form re-charge of 1 seat × 250 added)"
            - "500 != 250 and 500 != 750 — the two variants of the same tier table applied in the pinned order produce exactly 250 + 250"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sharing_level_cyclic_single_step
        grounds:
          - state_machines.ContentItemSharingLevel
        distinguishing_aspect: "ContentItem.sharing_level is a cyclic machine (PRIVATE→ORGANIZATION→PUBLIC→ORGANIZATION→PRIVATE) that rejects the direct PUBLIC→PRIVATE jump — the cycle and the single-step constraint are both exercised on the sharing dimension, independent of the item's status dimension."
        test_recipe:
          setup:
            - "Base setup: org ACTIVE, owner ada ACTIVE (PROFESSIONAL level) on an ADVANCED NAMED_USER grant; item published (storage 0 bytes)."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Trailheads", item_kind: "FEATURE_LAYER", storage_bytes: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
          trigger:
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "ORGANIZATION", expected_content_item_version: "${item_v0}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_v1: $.data.version }
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "PUBLIC", expected_content_item_version: "${item_v1}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_v2: $.data.version }
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "PRIVATE", expected_content_item_version: "${item_v2}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err_jump: $.data.error_id }
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "ORGANIZATION", expected_content_item_version: "${item_v2}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_v3: $.data.version }
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "PRIVATE", expected_content_item_version: "${item_v3}" }
              as: NamedUser
              as_user_id: "${user_id}"
          assert:
            - "the PUBLIC→PRIVATE share returns 409 and err_jump == ERR_INVALID_SHARING_TRANSITION"
            - "the cycle PRIVATE→ORGANIZATION→PUBLIC→ORGANIZATION→PRIVATE completes; final sharing_level == PRIVATE"
            - "ContentItem.${item_id}.version == ${item_v0} + 4 (only successful shares increment)"

      - name: eligibility_verification_renewal_loop
        grounds:
          - state_machines.EligibilityVerification
        distinguishing_aspect: "EligibilityVerification is a cyclic machine (UNDER_REVIEW→APPROVED→RENEWAL_REQUIRED→UNDER_REVIEW) whose loop is driven by the logical clock — approval at period 0 flips to RENEWAL_REQUIRED at period 12 and a resubmit with fresh evidence closes the loop back to UNDER_REVIEW, distinct from the linear SUBMITTED start."
        test_recipe:
          setup:
            - "Org ACTIVE (EDUCATION kind). EV submitted by ada at period 0, reviewed and APPROVED by a different ComplianceOfficer (valid_through_period = 12)."
          setup_api_calls:
            - *clock0
            - call: "POST /geo-orgs"
              payload: { name: "State College GIS", org_kind: "EDUCATION", home_region: "US" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - *mk_pool
            - *mk_prod_named
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "EDUCATION_PROGRAM", seats_allocated: 10, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_named_id: $.data.id }
            - *act_org
            - *mk_user
            - *accept_user
            - call: "POST /geo-orgs/eligibility-verifications"
              payload: { organization_id: "${org_id}", program_kind: "EDUCATION_PROGRAM", evidence_document_ref: "doc-v1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "APPROVED", decision_rationale: "Accredited institution verified" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /geo-orgs/eligibility-verifications"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "UNDER_REVIEW", evidence_document_ref: "doc-v2" }
              as: NamedUser
              as_user_id: "${user_id}"
          assert:
            - "at period 11 the EV is still APPROVED (check before advancing past 12 — the >= boundary flips at exactly 12)"
            - "after advancing to 2026-09-12 (period 11) the EV is APPROVED; advancing to 2026-09-13 (period 12) flips it to RENEWAL_REQUIRED"
            - "resubmit with evidence_document_ref 'doc-v2' succeeds and status returns to UNDER_REVIEW"
            - "EligibilityVerification.${ev_id}.valid_through_period == 12 after the first approval"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_overdraw_suspends_org_and_cascades
        grounds:
          - state_machines.CreditBatch.PENDING_to_SETTLED
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - state_machines.LicenseGrant.ACTIVE_to_SUSPENDED
          - calculations.credit_pool_posture
        distinguishing_aspect: "Depth-3 cascade from a settle trigger: batch SETTLED → CreditPool posture flips OVERDRAWN (link 1: caused by the settled_credits debit) → Organization SUSPENDED (link 2: caused by the posture flip) → every ACTIVE LicenseGrant SUSPENDED with its ExtensionGrants REVOKED, every ACTIVE NamedUser DISABLED releasing its seat, every ApiKey REVOKED (link 3: caused by the org suspension, not by the settle)."
        test_recipe:
          setup:
            - "Org ACTIVE, pool capacity 1000 (threshold default 500). ACTIVE NAMED_USER grant with ada ACTIVE (seats_in_use 1) and an ApiKey. An ADVANCED CONCURRENT_USE grant with an ACTIVE ExtensionGrant for SPATIAL_ANALYST."
            - "A ROUTING batch of 100 units created at period 0: provisional = 50*8 + 50*5 = 650. Clock advanced one day so the settle charges round(650*1.1) = 715; available after settle = 1000 - 715 = 285 — NOT overdrawn. A second ROUTING batch of 100 units would need available >= 650 at creation: 1000 - 650 = 350 >= 650 is false, so instead capacity is 1300: batch1 provisional 650, created day 0; batch2 provisional 650 created day 0 (available 1300-650=650 >= 650 OK); settle batch1 on day 1: consumed 715, reserved 650, available = 1300-715-650 = -65 → OVERDRAWN → cascade."
          setup_api_calls:
            - *clock0
            - *mk_org
            - call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org_id}", capacity_credits: 1300 }
              as: BillingAdmin
              captures: { pool_id: $.data.id }
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "ANALYTICS-SUITE-11", license_kind: "CONCURRENT_USE", edition: "ADVANCED", major_version: 11, base_seat_count: 20, supports_offline: false, allows_derivative_works: true, extension_modules: [{ extension_code: "SPATIAL_ANALYST", additional_credit_rate_per_op: 3, required_min_edition: "STANDARD" }] }
              as: PlatformAdmin
              captures: { prod_an_id: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_an_id}", grant_kind: "STANDARD", seats_allocated: 5, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_an_id: $.data.id }
            - call: "GET /geo-orgs/${org_id}"
              payload: {}
              as: LicenseAdmin
              captures: { org_v1: $.data.version }
            - call: "POST /geo-orgs/license-grants/${grant_an_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v1}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/extension-grants"
              payload: { license_grant_id: "${grant_an_id}", extension_code: "SPATIAL_ANALYST", seats_allocated: 5 }
              as: LicenseAdmin
              captures: { eg_id: $.data.id }
            - *mk_user
            - *accept_user
            - *mk_key
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "ROUTING", requested_units: 100, idempotency_key: "rt-1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b1: $.data.id }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "ROUTING", requested_units: 100, idempotency_key: "rt-2" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v1: "$.data[0].version" }
          trigger:
            - call: "POST /geo-orgs/credit-batches/${b1}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v1}" }
              as: BillingAdmin
          assert:
            - "CreditBatch.${b1}.settled_credits == 715 and CreditPool.consumed_credits == 715"
            - "available = 1300 - 715 - 650 = -65 → CreditPool.posture == OVERDRAWN"
            - "Organization.${org_id}.status == SUSPENDED (link 2 fired from the posture flip, not from a direct call)"
            - "LicenseGrant.${grant_named_id}.status == SUSPENDED and LicenseGrant.${grant_an_id}.status == SUSPENDED (link 3)"
            - "ExtensionGrant.${eg_id}.status == REVOKED (link 3's own cascade)"
            - "NamedUser.${user_id}.status == DISABLED and grant seats_in_use == 0 and ApiKey.${key_id}.status == REVOKED"
            - "CreditBatch.${b2} remains PENDING"

      - name: ev_renewal_lapse_suspends_program_grants
        grounds:
          - state_machines.EligibilityVerification.APPROVED_to_RENEWAL_REQUIRED
          - state_machines.LicenseGrant.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Depth-2 cascade from a clock trigger: period advance → EV APPROVED flips to RENEWAL_REQUIRED (link 1: caused by the window calculation) → every ACTIVE program-kind LicenseGrant of the org SUSPENDED with ExtensionGrants REVOKED (link 2: caused by the EV flip, not by the clock directly) — a different trigger (clock) and a different chain shape than the settle cascade."
        test_recipe:
          setup:
            - "EDUCATION org ACTIVE; EDUCATION_PROGRAM grant ACTIVE (via approved EV at period 0, valid_through_period 12) with an ACTIVE ExtensionGrant; clock advances to period 12."
          setup_api_calls:
            - *clock0
            - call: "POST /geo-orgs"
              payload: { name: "State College GIS", org_kind: "EDUCATION", home_region: "US" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - *mk_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "EDU-DESKTOP-11", license_kind: "NAMED_USER", edition: "ADVANCED", major_version: 11, base_seat_count: 100, supports_offline: true, allows_derivative_works: true, extension_modules: [{ extension_code: "GEOSTAT", additional_credit_rate_per_op: 2, required_min_edition: "STANDARD" }] }
              as: PlatformAdmin
              captures: { prod_edu_id: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_edu_id}", grant_kind: "EDUCATION_PROGRAM", seats_allocated: 10, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_edu_id: $.data.id }
            - *act_org
            - *mk_user
            - *accept_user
            - call: "POST /geo-orgs/eligibility-verifications"
              payload: { organization_id: "${org_id}", program_kind: "EDUCATION_PROGRAM", evidence_document_ref: "doc-v1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "APPROVED", decision_rationale: "Accredited institution verified" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /geo-orgs/license-grants/${grant_edu_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/extension-grants"
              payload: { license_grant_id: "${grant_edu_id}", extension_code: "GEOSTAT", seats_allocated: 10 }
              as: LicenseAdmin
              captures: { eg_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /geo-orgs/eligibility-verifications"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "at period 11 (2026-09-12) the EV is still APPROVED and the grant still ACTIVE"
            - "at period 12 (2026-09-13) the EV flips to RENEWAL_REQUIRED (>= boundary)"
            - "LicenseGrant.${grant_edu_id}.status == SUSPENDED (link 2 caused by the EV flip)"
            - "ExtensionGrant.${eg_id}.status == REVOKED (link 2's cascade)"
            - "NamedUser.${user_id}.status remains ACTIVE — the EV cascade touches grants only, not users"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_beats_business_safety_on_grant_activate
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - concurrency_rules[grant-activate-stale-org]
        distinguishing_aspect: "Category pair state(412 OCC) vs business_safety(403 eligibility): an EDUCATION_PROGRAM grant activated with a stale expected_organization_version AND no approved EV must return ERR_STALE_VERSION (priority 5) — not ERR_ELIGIBILITY_NOT_APPROVED (priority 10)."
        test_recipe:
          setup:
            - "EDUCATION org ACTIVE (org version bumped twice: once by org activate, once by the named-grant activation); EDUCATION_PROGRAM grant PENDING_ACTIVATION; no EV submitted."
          setup_api_calls:
            - *clock0
            - call: "POST /geo-orgs"
              payload: { name: "State College GIS", org_kind: "EDUCATION", home_region: "US" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - *mk_pool
            - *mk_prod_named
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 5, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_std_id: $.data.id }
            - *act_org
            - call: "POST /geo-orgs/license-grants/${grant_std_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "EDUCATION_PROGRAM", seats_allocated: 5, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_edu_id: $.data.id }
          trigger:
            - call: "POST /geo-orgs/license-grants/${grant_edu_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION"
            - "err != ERR_ELIGIBILITY_NOT_APPROVED even though no APPROVED EV exists"
            - "LicenseGrant.${grant_edu_id}.status remains PENDING_ACTIVATION"

      - name: eligibility_gate_beats_seat_capacity_on_user_accept
        grounds:
          - validations[priority=6]
          - validations[priority=17]
        distinguishing_aspect: "Category pair state(409 grant-not-active) vs business_fiscal(409 no-seats): accepting onto a NAMED_USER grant that is SUSPENDED AND full must return ERR_GRANT_NOT_ACTIVE (priority 6) — not ERR_NO_SEATS_AVAILABLE (priority 17)."
        test_recipe:
          setup:
            - "Org ACTIVE; NAMED_USER grant seats_allocated 1, ACTIVE; bob INVITED onto it. The grant is then SUSPENDED by LicenseAdmin (seats_in_use forced to 0 — so the seat check would PASS, but the state check fires first)."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 1, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_named_id: $.data.id }
            - *act_org
            - *act_grant_named
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "bob", email: "bob@meridian.example", named_user_level: "VIEWER", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
              captures: { bob_id: $.data.id }
            - call: "GET /geo-orgs/${org_id}"
              payload: {}
              as: LicenseAdmin
              captures: { org_v_now: $.data.version }
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "SUSPENDED", expected_organization_version: "${org_v_now}" }
              as: LicenseAdmin
          trigger:
            - call: "POST /geo-orgs/named-users/${bob_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${bob_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_GRANT_NOT_ACTIVE"
            - "err != ERR_NO_SEATS_AVAILABLE even though the grant's capacity is 1"
            - "NamedUser.${bob_id}.status remains INVITED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: posture_threshold_exact_equality_is_ok
        grounds:
          - calculations.credit_pool_posture
        distinguishing_aspect: "Numeric threshold: available == low_credit_threshold_credits exactly yields OK (strict < for LOW_CREDIT) — tested at available 500 (OK), 499 (LOW_CREDIT), 0 (EXHAUSTED), on the CreditPool metric via the credit-pool GET."
        test_recipe:
          setup:
            - "Org ACTIVE, pool capacity 1500 with low_credit_threshold_credits 500; user+key. A GEOCODE batch of 250 units (provisional 100*4 + 150*3 = 850) reserved → available = 1500-850 = 650. Not at boundary yet; use capacity 1350 instead so available = 500 exactly after the reservation."
          setup_api_calls:
            - *clock0
            - *mk_org
            - call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org_id}", capacity_credits: 1350, low_credit_threshold_credits: 500 }
              as: BillingAdmin
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - *mk_key
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 250, idempotency_key: "gc-250" }
              as: NamedUser
              as_user_id: "${user_id}"
          trigger:
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { posture_500: "$.data[0].posture" }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "STORAGE", requested_units: 1, idempotency_key: "st-1" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { posture_499: "$.data[0].posture" }
          assert:
            - "posture_500 == OK (available == 500 == threshold exactly → OK, not LOW_CREDIT)"
            - "posture_499 == LOW_CREDIT (available == 499 < 500)"
            - "Organization.${org_id}.credit_balance == 499 after the second batch"

      - name: storage_unit_ceiling_boundaries
        grounds:
          - calculations.storage_credit_billing
        distinguishing_aspect: "Zero-quantity and ceiling boundary on the storage-bytes metric via the publish endpoint: 0 bytes → a 0-unit batch (provisional 0), exactly 104857600 bytes → 1 unit, 104857601 bytes → 2 units."
        test_recipe:
          setup:
            - "Base setup with ada ACTIVE; three DRAFT items with storage_bytes 0, 104857600, 104857601."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "empty", item_kind: "WEB_MAP", storage_bytes: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_zero: $.data.id }
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "exact", item_kind: "FEATURE_LAYER", storage_bytes: 104857600 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_exact: $.data.id }
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "over", item_kind: "FEATURE_LAYER", storage_bytes: 104857601 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_over: $.data.id }
          trigger:
            - call: "POST /geo-orgs/content-items/${item_zero}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items/${item_exact}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items/${item_over}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "GET /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", service_kind: "STORAGE" }
              as: BillingAdmin
          assert:
            - "three STORAGE batches exist with requested_units 0, 1, 2 respectively"
            - "provisional_credits are 0, 1, 2 respectively"
            - "CreditPool.reserved_credits == 3"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: server_authorize_gated_by_grant_and_org
        grounds:
          - state_machines.DeploymentServer.REGISTERED_to_AUTHORIZED
          - validations[priority=8]
        distinguishing_aspect: "DeploymentServer → LicenseGrant + Organization pair: authorize requires the grant ACTIVE with kind DEPLOYMENT_SERVER, matching major version, and enough cores — a NAMED_USER-kind grant (kind mismatch) rejects with ERR_GRANT_KIND_MISMATCH even when seats are free."
        test_recipe:
          setup:
            - "Org ACTIVE; NAMED_USER grant ACTIVE with seats free. A server registered against that grant."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "gis1.meridian.example", role: "GIS_SERVER", installed_major_version: 11, auth_mode: "SAML", license_grant_id: "${grant_named_id}", cores_allocated: 4 }
              as: DeploymentAdmin
              captures: { err_reg: $.data.error_id }
          trigger:
            - call: "GET /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}" }
              as: DeploymentAdmin
          assert:
            - "server registration itself is rejected with 409 err_reg == ERR_GRANT_KIND_MISMATCH (the kind check runs at creation, priority 8)"
            - "the list returns 0 rows — no server row exists to authorize"

      - name: basemap_public_share_gated_by_advanced_grant
        grounds:
          - state_machines.ContentItemSharingLevel.ORGANIZATION_to_PUBLIC
          - validations[priority=15]
        distinguishing_aspect: "ContentItem → LicenseGrant pair: PUBLIC sharing of a basemap-containing item requires the org to hold an ACTIVE ADVANCED-edition grant — with only a STANDARD-edition grant ACTIVE the share fails with ERR_BASEMAP_PUBLIC_REQUIRES_ADVANCED, and adding the ADVANCED grant (a different entity's state change) unblocks the same request."
        test_recipe:
          setup:
            - "Org ACTIVE; ada ACTIVE (PROFESSIONAL) on a STANDARD-edition NAMED_USER grant; published item with contains_licensed_basemap=true, currently at sharing_level ORGANIZATION."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "DESKTOP-STD-11", license_kind: "NAMED_USER", edition: "STANDARD", major_version: 11, base_seat_count: 50, supports_offline: true, allows_derivative_works: true }
              as: PlatformAdmin
              captures: { prod_std_id: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_std_id}", grant_kind: "STANDARD", seats_allocated: 10, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_named_id: $.data.id }
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Basemap Mash", item_kind: "WEB_MAP", storage_bytes: 0, contains_licensed_basemap: true }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "ORGANIZATION", expected_content_item_version: "${item_v0}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_v1: $.data.version }
          trigger:
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "PUBLIC", expected_content_item_version: "${item_v1}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err_share: $.data.error_id }
            - *mk_prod_named
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 10, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_adv_id: $.data.id }
            - call: "POST /geo-orgs/license-grants/${grant_adv_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "PUBLIC", expected_content_item_version: "${item_v1}" }
              as: NamedUser
              as_user_id: "${user_id}"
          assert:
            - "first PUBLIC share returns 403 err_share == ERR_BASEMAP_PUBLIC_REQUIRES_ADVANCED"
            - "after activating an ADVANCED-edition grant, the identical share succeeds and sharing_level == PUBLIC"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: grant_validity_window_brackets_period
        grounds:
          - state_machines.LicenseGrant
          - validations[priority=9]
          - calculations.eligibility_renewal_window
        distinguishing_aspect: "Half-open interval semantics [valid_from_period, valid_to_period): activation at period == valid_from_period succeeds, at valid_from_period - 1 fails (ERR_GRANT_NOT_YET_VALID), at valid_to_period - 1 succeeds, and the auto-expiry sweep flips the grant at exactly valid_to_period — the window is inclusive-left, exclusive-right on the LicenseGrant resource."
        test_recipe:
          setup:
            - "Org ACTIVE; grant with valid_from_period 5, valid_to_period 8 (PENDING_ACTIVATION)."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 5, valid_from_period: 5, valid_to_period: 8 }
              as: LicenseAdmin
              captures: { grant_w_id: $.data.id }
            - *act_org
          trigger:
            - call: "POST /geo-orgs/license-grants/${grant_w_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /geo-orgs/license-grants/${grant_w_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /geo-orgs/license-grants/${grant_w_id}"
              payload: {}
              as: LicenseAdmin
              captures: { status_p7: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /geo-orgs/license-grants/${grant_w_id}"
              payload: {}
              as: LicenseAdmin
              captures: { status_p8: $.data.status }
          assert:
            - "period 0 activation returns 409 err_early == ERR_GRANT_NOT_YET_VALID"
            - "period 5 (== valid_from_period) activation succeeds — inclusive left boundary"
            - "status_p7 == ACTIVE at period 7 (valid_to_period - 1)"
            - "status_p8 == EXPIRED at period 8 (== valid_to_period) — exclusive right boundary"

      - name: eligibility_window_closes_at_exact_period
        grounds:
          - calculations.eligibility_renewal_window
        distinguishing_aspect: "Aggregate capacity semantics rather than interval adjacency: the EV approval window is a capacity of 12 periods measured from the decision period — APPROVED through period decision+11, RENEWAL_REQUIRED at decision+12 exactly (>= comparison), and re-activation of a program grant at decision+11 still passes the eligibility gate while decision+12 fails with ERR_ELIGIBILITY_NOT_APPROVED."
        test_recipe:
          setup:
            - "EDUCATION org ACTIVE; EV approved at period 0 (valid_through 12); EDUCATION_PROGRAM grant PENDING_ACTIVATION."
          setup_api_calls:
            - *clock0
            - call: "POST /geo-orgs"
              payload: { name: "State College GIS", org_kind: "EDUCATION", home_region: "US" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - *mk_pool
            - *mk_prod_named
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "EDUCATION_PROGRAM", seats_allocated: 5, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_edu_id: $.data.id }
            - *act_org
            - *mk_user
            - *accept_user
            - call: "POST /geo-orgs/eligibility-verifications"
              payload: { organization_id: "${org_id}", program_kind: "EDUCATION_PROGRAM", evidence_document_ref: "doc-v1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "APPROVED", decision_rationale: "Accredited institution verified" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /geo-orgs/license-grants/${grant_edu_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { g_status_11: $.data.status }
            - call: "POST /geo-orgs/license-grants/${grant_edu_id}/transition"
              payload: { target_status: "SUSPENDED", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /geo-orgs/license-grants/${grant_edu_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err_p12: $.data.error_id }
          assert:
            - "activation at period 11 succeeds (g_status_11 == ACTIVE) — valid_through_period 12 > 11"
            - "re-activation at period 12 returns 403 err_p12 == ERR_ELIGIBILITY_NOT_APPROVED — the EV flipped to RENEWAL_REQUIRED at exactly period 12"
            - "the suspend between the two activations proves the failure is the eligibility window, not the state machine"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: batch_create_then_reverse_conserves_pool
        grounds:
          - state_machines.CreditBatch.PENDING_to_REVERSED
          - calculations.credit_pool_posture
        distinguishing_aspect: "Conserved quantity: CreditPool.reserved_credits and consumed_credits. A create followed by its reverse leaves BOTH fields equal to their pre-create values — the forward reservation is exactly compensated, and Organization.credit_balance returns to its prior value."
        test_recipe:
          setup:
            - "Base setup with pool capacity 100000; consumed 0, reserved 0."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
            - *accept_user
            - *mk_key
          trigger:
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 250, idempotency_key: "gc-inv" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_id: $.data.id }
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version" }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "REVERSED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
          assert:
            - "after create: reserved_credits == 850 (100*4 + 150*3)"
            - "after reverse: reserved_credits == 0 AND consumed_credits == 0 — bit-identical to the pre-create pool"
            - "Organization.${org_id}.credit_balance == 100000 again"
            - "CreditBatch.${batch_id}.status == REVERSED and a second reverse returns 409 ERR_BATCH_NOT_PENDING"

      - name: seat_consume_release_cycle_conserves_seats
        grounds:
          - state_machines.NamedUser
        distinguishing_aspect: "Conserved quantity: LicenseGrant.seats_in_use. Accept (+1), disable (−1), re-enable (+1), deactivate (−1) is a full consume/release cycle that returns seats_in_use to 0 — a different conserved quantity (seats, not credits) with four compensating pairs."
        test_recipe:
          setup:
            - "Base setup; grant seats_allocated 2; ada INVITED."
          setup_api_calls:
            - *clock0
            - *mk_org
            - *mk_pool
            - *mk_prod_named
            - *mk_grant_named
            - *act_org
            - *act_grant_named
            - *mk_user
          trigger:
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "DISABLED" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "DEACTIVATED" }
              as: LicenseAdmin
            - call: "GET /geo-orgs/license-grants/${grant_named_id}"
              payload: {}
              as: LicenseAdmin
          assert:
            - "seats_in_use after accept == 1, after disable == 0, after re-enable == 1, after deactivate == 0"
            - "LicenseGrant.${grant_named_id}.seats_in_use == 0 at the end — the cycle conserves the seat pool exactly"
            - "NamedUser.${user_id}.status == DEACTIVATED (terminal)"
