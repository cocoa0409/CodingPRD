          - state_machines.WarrantyClaim.FULFILLED_to_REVOKED
          - entities.ToolSku.fields.units_received_total
          - entities.ToolSku.fields.units_on_hand
          - entities.ToolSku.fields.units_reserved
          - entities.ToolSku.fields.units_shipped
