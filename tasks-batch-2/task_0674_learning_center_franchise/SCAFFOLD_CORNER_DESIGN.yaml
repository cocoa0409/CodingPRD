              as: CenterDirector
            - call: "POST /invoices/${inv1}/pay"
              payload: { amount_cents: 20000 }
              as: CenterDirector
            - call: "GET /families/${fam_id}"
              payload: {}
              as: CenterDirector
              captures: { fam_v2: $.data.version }
          trigger:
            - call: "POST /invoices"
              payload: { family_id: "${fam_id}", center_id: "${c_id}", period_month: "2026-06", expected_family_version: "${fam_v2}" }
              as: CenterDirector
              captures: { inv2: $.data.id }
          assert:
            - "Invoice.${inv2}.enrollment_fee_component_cents == 0"
            - "Invoice.${inv2}.tuition_component_cents == 15000"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: place_response_reflects_all_cascades_immediately
        claim_type: immediate
        grounds:
          - state_machines.Enrollment.PLACEMENT_PENDING_to_ACTIVE
          - entities.Enrollment.fields.monthly_rate_cents
          - entities.Family.fields.sibling_count
        distinguishing_aspect: "Immediate consistency: the place response and an immediate GET both reflect the recomputed sibling_count and monthly_rate_cents within the same request lifecycle (no lag)."
        test_recipe:
          setup: ["Center OPERATING; family two students; student-1 ACTIVE (rate 15000); student-2 PLACEMENT_PENDING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CIM", territory_code: "TER-IM", monthly_tuition_cents: 15000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fim@x.com", contact_name: "FIM" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "S1", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st1: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "S2", birthdate: "2017-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st2: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st1}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en1: $.data.id }
            - call: "POST /enrollments/${en1}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st2}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en2: $.data.id }
            - call: "POST /enrollments/${en2}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
          trigger:
            - call: "GET /enrollments/${en1}"
              payload: {}
              as: CenterDirector
              captures: { e1_rate: $.data.monthly_rate_cents }
            - call: "GET /families/${fam_id}"
              payload: {}
              as: CenterDirector
              captures: { sib: $.data.sibling_count }
          assert:
            - "Enrollment.${en1}.monthly_rate_cents == 14250"
            - "Family.${fam_id}.sibling_count == 2"

  # ===========================================================================
  # excluded_because stubs — corners already exercised by §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: worksheet_grade_pass_to_mastered_already_covered
        claim_type: Valid Transition
        grounds:
          - state_machines.Worksheet.GRADED_to_MASTERED
        excluded_because:
          difficulty_instance: boundary_precision_check / mastery_threshold_ge_boundary_80_passes_79_retries
          rationale: "The GRADED->MASTERED valid transition at score==threshold is asserted by the boundary difficulty instance."
      - name: worksheet_retry_cycle_already_covered
        claim_type: cyclic
        grounds:
          - state_machines.Worksheet.RETRY_to_ASSIGNED
        excluded_because:
          difficulty_instance: non_linear_state_machine / worksheet_retry_cycle_graded_back_to_assigned
          rationale: "The full GRADED->RETRY->ASSIGNED->GRADED loop is exercised by the cyclic difficulty instance."
      - name: session_close_resolves_booked_absent_already_covered
        claim_type: Bubble up
        grounds:
          - state_machines.Session.OPEN_to_CLOSED
          - state_machines.AttendanceRecord.BOOKED_to_ABSENT
        excluded_because:
          difficulty_instance: non_linear_state_machine / session_attendance_fork_join_close_resolves_booked_to_absent
          rationale: "Close-time auto-resolution of remaining BOOKED records to ABSENT is asserted by the fork-join difficulty instance."

  - section: calculations
    instances:
      - name: tuition_multiplicative_discount_order_already_covered
        claim_type: Constants Applied
        grounds:
          - calculations.tuition_rate
        excluded_because:
          difficulty_instance: combinatorial_formula / tuition_rate_multi_subject_then_sibling_nested_discount
          rationale: "Multi-subject and sibling discount constants and pinned application order are asserted by the combinatorial difficulty instance."
      - name: invoice_wallet_sum_then_apply_already_covered
        claim_type: Precision
        grounds:
          - calculations.invoice_total
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_total_sum_lines_then_apply_wallet_order_pinned
          rationale: "Sum-lines-then-apply-wallet ordering is asserted by the invoice_total combinatorial instance."
      - name: placement_variant_divergence_already_covered
        claim_type: Variant Divergence
        grounds:
          - calculations.diagnostic_placement
        excluded_because:
          difficulty_instance: dual_variant_calc / placement_strict_vs_supportive_diverge_on_same_diagnostic
          rationale: "STRICT vs SUPPORTIVE divergence for identical diagnostic score is the dual-variant difficulty instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: mastery_cascade_to_completed_already_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Worksheet.GRADED_to_MASTERED
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade / worksheet_mastery_advances_level_then_completes_enrollment_depth3
          rationale: "The mastery->advancement->completion cascade is the depth-3 transitive cascade difficulty instance."
      - name: invoice_void_wallet_refund_already_covered
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Family.fields.wallet_credit_cents
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_void_after_issue_restores_wallet_credit
          rationale: "Wallet credit refund on void (conserved-quantity invariant) is the compensating-invariant difficulty instance."
