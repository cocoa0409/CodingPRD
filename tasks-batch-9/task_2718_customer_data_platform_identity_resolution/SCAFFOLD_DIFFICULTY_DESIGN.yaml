              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v_after_approve: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_a_id}"
