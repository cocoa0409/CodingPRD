              payload: { meter_id: "${mt58_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-09T23:50:00Z", end_iso: "2026-08-10T00:20:00Z", station_code: "WAAA", tuning_minutes: 30 }
              as: MethodologyStatistician
