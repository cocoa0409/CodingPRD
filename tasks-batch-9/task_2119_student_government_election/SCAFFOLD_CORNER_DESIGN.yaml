            - "Election.${e_id}.version == ${e_v_stale} + 1"

      - name: slate_membership_with_stale_candidacy_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slate-membership-stale-candidacy]
          - validations[priority=12]
          - errors[ERR_STALE_CANDIDACY_VERSION]
          - endpoints[POST /candidacies/{candidacy_id}/slate-membership]
        distinguishing_aspect: "The OCC guard is on a different parent entity: after one successful slate-membership call advances Candidacy.version, a second call still carrying the earlier version is rejected with ERR_STALE_CANDIDACY_VERSION and HTTP 412 and the recorded leader is unchanged."
        test_recipe:
          setup:
            - "One election in PETITIONING with a Senate office (seat_count 3) and three DRAFT candidacies: two possible leaders c_l1 and c_l2, plus c_m."
            - "c_m has already been pointed at c_l1 using the version the client read, which advanced c_m.version by one."
          setup_api_calls:
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 500000, poster_cap: 100, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_id: $.data.id }
            - call: "POST /offices"
              payload: { election_id: "${e_id}", name: "Student Senate", eligible_class_years: ["JUNIOR", "SENIOR"], required_signature_count: 0, term_start_date: "2026-10-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z", seat_count: 3 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Lena Ortiz", student_number: "S-9801", class_year: "SENIOR", gpa: 3.40, credits_completed: 90 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_l1_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Omar Diaz", student_number: "S-9802", class_year: "SENIOR", gpa: 3.30, credits_completed: 88 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_l2_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Marco Reyes", student_number: "S-9803", class_year: "JUNIOR", gpa: 3.10, credits_completed: 62 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_m_id: $.data.id }
            - call: "POST /elections/${e_id}/open-petitioning"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_l1_id}" }
              as: Candidate
              as_user_id: "${s_l1_id}"
              captures: { c_l1_id: $.data.id }
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_l2_id}" }
              as: Candidate
              as_user_id: "${s_l2_id}"
              captures: { c_l2_id: $.data.id }
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_m_id}" }
              as: Candidate
              as_user_id: "${s_m_id}"
              captures: { c_m_id: $.data.id }
            - call: "GET /candidacies/${c_m_id}"
              payload: {}
              as: Candidate
              as_user_id: "${s_m_id}"
              captures: { c_m_v_stale: $.data.version }
            - call: "POST /candidacies/${c_m_id}/slate-membership"
              payload: { slate_leader_candidacy_id: "${c_l1_id}", expected_candidacy_version: "${c_m_v_stale}" }
              as: Candidate
              as_user_id: "${s_m_id}"
          trigger:
            - call: "POST /candidacies/${c_m_id}/slate-membership"
              payload: { slate_leader_candidacy_id: "${c_l2_id}", expected_candidacy_version: "${c_m_v_stale}" }
              as: Candidate
              as_user_id: "${s_m_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response data.error_id == ERR_STALE_CANDIDACY_VERSION"
            - "Candidacy.${c_m_id}.slate_leader_candidacy_id == ${c_l1_id}"
            - "Candidacy.${c_m_id}.version == ${c_m_v_stale} + 1"
            - "GET /candidacies?slate_leader_candidacy_id=${c_l2_id} returns total_count == 0"

      - name: election_version_increments_on_each_declared_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Election.common_fields
          - endpoints[POST /elections/{election_id}/open-petitioning]
          - endpoints[POST /ballots]
        distinguishing_aspect: "Election.version reads 1 at creation, 2 after open-petitioning and 3 after the ballot create; POST /offices is not declared to touch the election, so it does not move the counter."
        test_recipe:
          setup:
            - "One election created, one office added, petitioning opened and a round-1 ballot created past the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 50000, poster_cap: 50, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_id: $.data.id, e_v_create: $.data.version }
            - call: "POST /offices"
              payload: { election_id: "${e_id}", name: "President", eligible_class_years: ["SENIOR"], required_signature_count: 0, term_start_date: "2026-10-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "GET /elections/${e_id}"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_v_after_office: $.data.version }
            - call: "POST /elections/${e_id}/open-petitioning"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_v_after_open: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /ballots"
              payload: { election_id: "${e_id}", round: 1, expected_election_version: "${e_v_after_open}" }
