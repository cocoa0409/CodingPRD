          SHIPMENT_EXCEPTION_CAP is 2 and the guard is exception_count < CAP evaluated BEFORE the increment, so
          the first exception is legal at count 0 and the re-dispatch is legal at count 1, but once count reaches
          2 the EXCEPTION -> IN_TRANSIT edge is refused with 409 ERR_SHIPMENT_EXCEPTION_CAP_REACHED. EXCEPTION is
          not a terminal state, so ERR_RESOURCE_TERMINAL is the wrong answer, and the shipment must stay in
          EXCEPTION with exception_count pinned at 2.
