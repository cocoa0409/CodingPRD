            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-05", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-06", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-07", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-08", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-09", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-10", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-11", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-12", quarterly_capacity_units: 1000 }, as: PortfolioManager }
          trigger:
            - { call: "GET /portfolio/plants?limit=10", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/plants?limit=10&offset=10", payload: {}, as: PortfolioManager }
          assert:
            - "page 1: len(data) == 10, envelope total_count == 12, has_more == true"
            - "page 2: len(data) == 2, total_count == 12, has_more == false"
      - name: response_envelope_shape_on_create_and_list
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Success envelopes carry meta.api_request_id and meta.api_request_timestamp; response_type is 'object' for single-entity endpoints and 'array' for list endpoints."
        test_recipe:
          setup: ["One brand created"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-EP2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/brands", payload: { name: "B-EP2-B", category_name: "tools", core_flag: false, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager }
