              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "BLOCKER", summary: "Primary navigation is unreachable by keyboard", effort_points: 2, target_remediation_date: "2026-08-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
