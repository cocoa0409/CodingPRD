            - { call: "POST /api/shipments/${sh1_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh1_id}/purchase-orders", payload: { purchase_order_id: "${po1_id}" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p1_id}", category: "FURNITURE", description: "Coat hook", brand_standard_ref: "MS-CH", quantity_per_room: 1, room_count: 1, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { s2_id: $.data.id } }
            - { call: "POST /api/spec-items/${s2_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s2_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s2_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 3 }, as: Vendor, captures: { b2_id: $.data.id } }
            - { call: "POST /api/bids/${b2_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b2_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p1_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po2_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po2_id}/lines", payload: { spec_item_id: "${s2_id}", quantity_ordered: 1, declared_cube_m3: 1 }, as: PurchasingAgent, captures: { l2_id: $.data.id } }
            - { call: "POST /api/shipments/${sh1_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh1_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh1_id}", lines: [ { po_line_id: "${l2_id}", qty_received: 1, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { err2: $.data.error_id } }
          assert:
            - "Attach of P1's PO to P2's shipment: 409 ERR_CROSS_PROJECT_REFERENCE"
            - "Receiving event on S1 naming L2 (PO2 never attached): 409 ERR_LINE_NOT_ON_SHIPMENT"
            - "No ReceivingEvent is persisted for the rejected call (GET /api/shipments/${sh1_id}/receiving-events returns 0 rows)"

      - name: reconcile_guards
        claim_type: violation_to_error
        grounds: ["state_machines.POLine", "errors[ERR_LINE_NOT_RECEIVED]", "errors[ERR_LINE_SHORTFALL_OPEN]", "errors[ERR_CLAIMS_OPEN]"]
        distinguishing_aspect: "The reconcile endpoint exposes all three guards in sequence: nothing received -> ERR_LINE_NOT_RECEIVED; partial receipt with shortfall not final -> ERR_LINE_SHORTFALL_OPEN; fully received but claim OPEN -> ERR_CLAIMS_OPEN."
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 10 x 10000c cube 5 awarded/ordered; PO line exists (nothing received)"
            - "Then: shipment IN_TRANSIT, event1 POSTED with 5 received / 1 damaged; then event2 POSTED with 5 received / 0 damaged (line FULLY_RECEIVED); one DAMAGE claim OPEN"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R3", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Lamp", brand_standard_ref: "MS-L", quantity_per_room: 1, room_count: 10, unit_budget_cents: 10000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 10, declared_cube_m3: 5 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /api/po-lines/${l_id}/reconcile", as: PurchasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 5, qty_damaged: 1 } ] }, as: WarehouseReceiver, captures: { ev1_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev1_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/po-lines/${l_id}/reconcile", as: PurchasingAgent, captures: { err2: $.data.error_id } }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 5, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev2_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev2_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 1, claimed_credit_cents: 5000 }, as: PurchasingAgent, captures: { cl_id: $.data.id } }
            - { call: "POST /api/po-lines/${l_id}/reconcile", as: PurchasingAgent, captures: { err3: $.data.error_id } }
          assert:
            - "Reconcile with zero receipts: 409 ERR_LINE_NOT_RECEIVED"
            - "Reconcile while PARTIALLY_RECEIVED with shipment still IN_TRANSIT: 409 ERR_LINE_SHORTFALL_OPEN"
            - "Reconcile while FULLY_RECEIVED but claim OPEN: 409 ERR_CLAIMS_OPEN"
            - "Line remains unreconciled throughout (status != RECONCILED)"

      - name: receiving_reverse_blocked_by_submitted_claim
        claim_type: violation_to_error
        grounds: ["state_machines.ReceivingEvent.POSTED_to_REVERSED", "errors[ERR_CLAIMS_BLOCK_REVERSAL]"]
        distinguishing_aspect: "A POSTED event cannot be reversed once a claim on a covered line has left OPEN (SUBMITTED); the event stays POSTED and the claim stays SUBMITTED."
        test_recipe:
          setup: ["Full receive pipeline: line 10 x 10000c cube 5, shipment IN_TRANSIT, event POSTED with 10 received / 2 damaged; DAMAGE claim qty 1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R4", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Lamp", brand_standard_ref: "MS-L", quantity_per_room: 1, room_count: 10, unit_budget_cents: 10000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 10, declared_cube_m3: 5 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 10, qty_damaged: 2 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 1, claimed_credit_cents: 5000 }, as: PurchasingAgent, captures: { cl_id: $.data.id } }
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "SUBMITTED" }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "REVERSED" }, as: WarehouseReceiver, captures: { err: $.data.error_id } }
          assert:
            - "Reversal rejected 409 with error_id == ERR_CLAIMS_BLOCK_REVERSAL"
            - "ReceivingEvent.${ev_id} remains POSTED; DamageClaim.${cl_id} remains SUBMITTED; line pools unchanged (qty_received == 10)"

      - name: window_invalid_dates_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_WINDOW_DATES]", "validations[priority=10]"]
        distinguishing_aspect: "end_date == start_date (empty half-open interval) is rejected at creation."
        test_recipe:
          setup: ["Project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R5", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 1, start_date: "2026-07-01", end_date: "2026-07-01", crew_count: 1 }, as: InstallationManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_WINDOW_DATES; no window is created"

      - name: change_order_unfunded_and_below_obligations
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHANGE_ORDER_UNFUNDED]", "errors[ERR_BUDGET_BELOW_OBLIGATIONS]", calculations.contingency_draw_fee]
        distinguishing_aspect: "Two fiscal rejection arms at approval: a draw exceeding unallocated contingency (incl. fee) fails ERR_CHANGE_ORDER_UNFUNDED; a negative delta that would push a line below its committed obligations fails ERR_BUDGET_BELOW_OBLIGATIONS. Failed approvals mutate nothing."
        test_recipe:
          setup:
            - "Project total 500000c, unallocated 5000c, in PROCUREMENT; FURNITURE budgeted 100000c with 80000c committed (PO line 2 x 40000c)"
            - "CO-A (+50000c draw, fee tier 5%: u = (80000+50000)/500000 = 0.26 -> fee 2500c; needs 52500c > 5000c unallocated) proposed by pa-1"
            - "CO-B (-50000c on FURNITURE: 100000 - 50000 = 50000 < 80000 committed) proposed by pa-1"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R6", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 500000, unallocated_contingency_cents: 5000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 100000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Bed", brand_standard_ref: "MS-B", quantity_per_room: 1, room_count: 2, unit_budget_cents: 40000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 40000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 2, declared_cube_m3: 4 }, as: PurchasingAgent }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO-A unfunded", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 50000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { coa_id: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO-B below obligations", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: -50000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { cob_id: $.data.id } }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /api/change-orders/${coa_id}/apply", payload: {expected_project_version: "${p_v}" }, as: OwnerRep, as_user_id: "owner-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/change-orders/${cob_id}/apply", payload: {expected_project_version: "${p_v}" }, as: OwnerRep, as_user_id: "owner-1", captures: { err2: $.data.error_id } }
          assert:
            - "CO-A: 402 ERR_CHANGE_ORDER_UNFUNDED (50000 + 2500 fee > 5000 unallocated)"
            - "CO-B: 402 ERR_BUDGET_BELOW_OBLIGATIONS (50000 would be < 80000 committed)"
            - "Both change orders remain PROPOSED; BudgetLine.${bl_id}.budgeted_cents remains 100000; unallocated remains 5000; project.version unchanged by the failed approvals"

      - name: claim_residual_boundary_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_QTY_EXCEEDS_RESIDUAL]"]
        excluded_because:
          difficulty_instance: claim_residual_equality_boundary
          rationale: "Residual equality (allowed) and residual+1 (rejected) are asserted in the named difficulty instance."

  # ------------------------------------------------------------------ roles ---
  - section: roles
    instances:
      - name: rbac_role_denials
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]", "validations[priority=2]"]
        distinguishing_aspect: "Each exclusive operation rejects a wrong role with 403 ERR_UNAUTHORIZED_ROLE: Vendor creating a project, PurchasingAgent running brand-review, Vendor creating a spec, PurchasingAgent deciding a change order."
        test_recipe:
          setup: ["Project with budget line; spec created and SUBMITTED; change order PROPOSED (proposer pa-1)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-B1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 1000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO rbac", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 10000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { co_id: $.data.id } }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /api/projects", payload: { name: "P-BAD", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 1000 }, as: Vendor, captures: { err1: $.data.error_id } }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: PurchasingAgent, captures: { err2: $.data.error_id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "DECOR", description: "Art", brand_standard_ref: "X", quantity_per_room: 1, room_count: 1, unit_budget_cents: 100 }, as: Vendor, captures: { err3: $.data.error_id } }
            - { call: "POST /api/change-orders/${co_id}/apply", payload: {expected_project_version: "${p_v}" }, as: PurchasingAgent, as_user_id: "owner-1", captures: { err4: $.data.error_id } }
          assert:
            - "All four calls rejected 403 with error_id == ERR_UNAUTHORIZED_ROLE"
            - "Spec remains SUBMITTED; change order remains PROPOSED"

      - name: sod_self_approval_blocked
        claim_type: segregation_of_duties
        grounds: ["state_machines.ChangeOrder.PROPOSED_to_APPLIED", "errors[ERR_CHANGE_ORDER_SELF_APPROVAL]"]
        distinguishing_aspect: "Segregation of duties by X-User-ID: the OwnerRep who proposed a change order cannot apply it (same user id), while a different OwnerRep can."
        test_recipe:
          setup: ["Project (unallocated 100000c) with FURNITURE budget line 1000000c; CO (+10000c) proposed by OwnerRep owner-9"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-B2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 1000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "Owner CO", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 10000 } ] }, as: OwnerRep, as_user_id: "owner-9", captures: { co_id: $.data.id } }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /api/change-orders/${co_id}/apply", payload: {expected_project_version: "${p_v}" }, as: OwnerRep, as_user_id: "owner-9", captures: { err: $.data.error_id } }
            - { call: "POST /api/change-orders/${co_id}/apply", payload: {expected_project_version: "${p_v}" }, as: OwnerRep, as_user_id: "owner-10", captures: { fin: $.data.status, fee: $.data.fee_cents } }
          assert:
            - "Self-approval: 403 ERR_CHANGE_ORDER_SELF_APPROVAL (SoD beats the funding checks)"
            - "Different OwnerRep: 200, status APPLIED, fee_cents == 500 (u = 10000/5000000 -> 5% tier), BudgetLine.${bl_id}.budgeted_cents == 1010000"

  # ------------------------------------- cross-cutting complexity layers ---
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_project_version_on_second_apply
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[co-apply-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "OCC on FFEProject.version: after CO-A applies (project version advances), applying CO-B with the pre-A version is rejected 412; re-reading the version and retrying succeeds."
        test_recipe:
          setup: ["Project (unallocated 100000c) with FURNITURE budget line 1000000c; CO-A and CO-B (+10000c each) both PROPOSED by pa-1; project version captured before either approval"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-X1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 1000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO-A", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 10000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { coa_id: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO-B", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 10000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { cob_id: $.data.id } }
