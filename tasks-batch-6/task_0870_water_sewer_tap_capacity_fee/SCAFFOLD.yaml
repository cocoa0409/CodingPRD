    side_effects: []
  - method: GET
    path: "/meter-sets"
    description: List meter-sets (filter by application or crew).
    roles: [Applicant, FieldInspector, UtilityAdmin]
    code: 200
    input: ["application_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: MeterSet[]
    side_effects: []
  - method: GET
    path: "/meter-sets/{id}"
    description: Fetch one meter-set.
    roles: [Applicant, FieldInspector, UtilityAdmin]
    code: 200
    input: []
    output: MeterSet
    side_effects: []
  - method: POST
    path: "/meter-sets/{id}/schedule"
