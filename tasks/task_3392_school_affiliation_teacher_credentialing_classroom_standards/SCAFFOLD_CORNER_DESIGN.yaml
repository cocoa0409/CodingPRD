        distinguishing_aspect: "A POST /society/schools call with no X-User-Role/X-User-ID headers at all is rejected 401 ERR_UNAUTHENTICATED before any role or payload check runs (the harness omits both headers; the as marker below only documents intent)."
        test_recipe:
