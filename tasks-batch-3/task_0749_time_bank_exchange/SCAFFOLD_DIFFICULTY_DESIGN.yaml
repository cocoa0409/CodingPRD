  # =====================================================================
  # RULE 5 — priority_pair_validation_conflict (>= 2 instances, different pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_and_insufficient_returns_suspended
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_MEMBER_SUSPENDED]
          - errors[ERR_INSUFFICIENT_BALANCE]
        distinguishing_aspect: |
          Priority-7 (business_safety, ERR_MEMBER_SUSPENDED) beats priority-8
          (business_fiscal, ERR_INSUFFICIENT_BALANCE) when both are violated
          on POST /exchanges — the requester is BOTH suspended AND has
          insufficient balance; the response is ERR_MEMBER_SUSPENDED (403),
          not ERR_INSUFFICIENT_BALANCE (402). Category pair: safety vs
          fiscal.
        test_recipe:
          setup:
            - "Member M (requester) has 3 NO_SHOW strikes in the last 90 days (is_suspended=true) AND chronological_balance_minutes=0 (never seeded)."
            - "SkillOffer o1 (from provider P) minutes_per_session=60 required_trust_tier=UNVERIFIED. SkillRequest r1 (M) needed_minutes=60."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "susp@x.com", display_name: "Susp", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /members"
              payload: { email: "org-sp@x.com", display_name: "OrgSP", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { o: $.data.id }
            - call: "POST /members"
              payload: { email: "prov-sp@x.com", display_name: "ProvSP", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { p: $.data.id }
            - call: "POST /group-projects"
              payload: { organizer_member_id: "${o}", title: "SP", window_start_utc: "2026-03-02T09:00:00Z", window_end_utc: "2026-03-04T17:00:00Z" }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { gp: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-02T09:00:00Z", duration_minutes: 60, capacity: 1 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh1: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-03T09:00:00Z", duration_minutes: 60, capacity: 1 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh2: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-04T09:00:00Z", duration_minutes: 60, capacity: 1 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh3: $.data.id }
            - call: "POST /group-projects/${gp}/publish"
              payload: {}
              as: ProjectOrganizer
              as_user_id: "${o}"
            - call: "POST /shifts/${sh1}/assignments"
              payload: { member_id: "${m}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /shifts/${sh2}/assignments"
              payload: { member_id: "${m}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /shifts/${sh3}/assignments"
              payload: { member_id: "${m}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${p}", skill_code: "GARDENING", title: "Gardening", minutes_per_session: 60 }
              as: Member
              as_user_id: "${p}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m}", skill_code: "GARDENING", needed_minutes: 60, earliest_start_utc: "2026-03-06T09:00:00Z", latest_start_utc: "2026-03-06T18:00:00Z" }
              as: Member
              as_user_id: "${m}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-06T09:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_MEMBER_SUSPENDED"
            - "NOT ERR_INSUFFICIENT_BALANCE (priority 8 loses to priority 7)"

      - name: stale_version_and_ownership_returns_stale
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_STALE_MEMBER_VERSION]
          - errors[ERR_OWNERSHIP_VIOLATION]
          - concurrency_rules[redemption-stale-member-version]
        distinguishing_aspect: |
          Priority-5 (state — ERR_STALE_MEMBER_VERSION at 412) beats priority-6
          (business_referential — ERR_OWNERSHIP_VIOLATION at 403) when the
          caller passes BOTH a stale expected_member_version AND a member_id
          that doesn't match X-User-ID. Different pair from Rule 5 instance
          #1 (safety vs fiscal).
        test_recipe:
          setup:
            - "Members M1 and M2 exist. M1 has version=2 after one /_ledger/admin-adjust seed of +600 minutes."
            - "Caller acts as M1 (X-User-ID=M1) but posts member_id=M2 in payload — ownership violation."
            - "Caller ALSO passes expected_member_version=1 while M1.version is 2 — stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "sv1@x.com", display_name: "SV1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "sv2@x.com", display_name: "SV2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 600, memo: "seed m1" }
              as: PlatformAdmin
              captures: { m1_v_after_seed: $.data.version }
            - call: "GET /members/${m1}"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { m1_v_pre: $.data.version }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 15, memo: "bump m1 version past m1_v_pre" }
              as: PlatformAdmin
              captures: { m1_v_now: $.data.version }
          trigger:
            - call: "POST /redemptions"
              payload: { member_id: "${m2}", reward_code: "FARMERS_MARKET_15", expected_member_version: "${m1_v_pre}" }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_MEMBER_VERSION"
            - "NOT ERR_OWNERSHIP_VIOLATION (priority 6 loses to priority 5)"

  # =====================================================================
  # RULE 6 — boundary_precision_check (>= 2 instances, different metrics)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: insufficient_balance_boundary_exact_gte_on_exchange_create
        grounds:
          - validations[priority=8]
          - errors[ERR_INSUFFICIENT_BALANCE]
          - entities.Member.fields.forward_looking_balance_minutes
        distinguishing_aspect: |
          Boundary on the fiscal balance check at POST /exchanges: with
          forward_looking_balance_minutes=60 EXACTLY equal to committed_minutes=60,
          the exchange is ACCEPTED (`>=` semantics, not `>`); with balance=45 the
          same request is REJECTED with ERR_INSUFFICIENT_BALANCE. Metric: integer
          balance minutes on Member (fiscal boundary). Endpoint: POST /exchanges.
        test_recipe:
          setup:
            - "Clock 2026-03-01T09:00:00Z."
            - "Member M1 seeded with exactly 60 minutes; provider M2 offer o1 (60 min); SkillRequest r1 60 min."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "b1-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "b1-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 60, memo: "seed exact 60" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "G", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-05T10:00:00Z", latest_start_utc: "2026-03-05T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-05T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id, e1_status: $.data.status }
          assert:
            - "HTTP status == 201 (balance 60 == committed 60 satisfies `>=` boundary)"
            - "Exchange.${e1}.status == SCHEDULED"
            - "Member.${m1}.forward_looking_balance_minutes drops to 0 (pending debit of 60)"

      - name: project_completion_ratio_boundary_exactly_meets
        grounds:
          - calculations.project_completion_ratio
          - calculations.project_aggregate_state
          - state_machines.GroupProject.IN_PROGRESS_to_COMPLETED
          - entities.GroupProject.fields.minimum_completed_ratio
        distinguishing_aspect: |
          Boundary on a RATIO (fractional) metric on GroupProject.aggregate_state
          — different metric type from Rule 6 instance #1 (integer balance
          minutes on Member) and reachable through a DIFFERENT endpoint
          (POST /_clock/set_current_utc past window_end vs Rule 6 #1's POST
          /exchanges). With 5 shifts, 3 COMPLETED yields ratio=0.60 which is
