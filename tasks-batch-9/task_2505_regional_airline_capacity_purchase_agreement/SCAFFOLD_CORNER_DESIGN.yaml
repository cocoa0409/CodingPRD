            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM7302", origin: "ORD", destination: "MKE", scheduled_departure_utc: "2026-09-04T08:00:00Z", scheduled_arrival_utc: "2026-09-04T09:00:00Z", planned_block_hours: 1.000 }
