              payload: {}
              as: ArtistRep
              as_user_id: "${cy_ar_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${cy_sh_id}", category: "PRODUCTION", description: "Backline rental", budgeted_cents: 100000, is_artist_deductible: false }
              as: TourAccountant
              captures: { cy_bl_id: $.data.id }
