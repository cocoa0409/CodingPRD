            - "Vendor.${c_v63_id}.eligibility_status == ELIGIBLE and debarment_strike_count == 0"

      - name: corner_interim_suspension_below_the_threshold_is_rejected
        claim_type: Triggerability
        grounds:
          - validations[priority=28]
          - errors[ERR_INTERIM_SUSPENSION_THRESHOLD_NOT_MET]
          - calculations.debarment_severity_score.variants
        distinguishing_aspect: "aggravating [ADMINISTRATIVE_DEFAULT] scores 5 under the interim_suspension_basis variant, below INTERIM_THRESHOLD 35, so interim_suspension true is refused with HTTP 422 and no proceeding row is created at all."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one ELIGIBLE Vendor"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Jasper Hollow Supply", tax_id: "100000064", contact_email: "v64@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v64_id: $.data.id }
          trigger:
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${c_v64_id}", cause_code: "ADMINISTRATIVE_DEFAULT", aggravating_factor_codes: ["ADMINISTRATIVE_DEFAULT"], mitigating_factor_codes: [], interim_suspension: true }
