        distinguishing_aspect: "The body foreign key step_id is resolved at priority 5, so a well-formed chart definition pointing at a random UUID yields ERR_PROCESS_STEP_NOT_FOUND 404 and no SpcChart row."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no ProcessStep exists with id 11111111-1111-4111-8111-111111111111."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
