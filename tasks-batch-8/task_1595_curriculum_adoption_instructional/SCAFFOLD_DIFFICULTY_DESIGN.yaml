            - call: "POST /purchase-orders/${po_id}/issue"
              as: ProcurementOfficer
          trigger:
            - call: "POST /purchase-orders/${po_id}/issue"
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "second issue violates state (not DRAFT) AND fiscal (900.00 > available 100.00): error_id == ERR_INVALID_STATE (state p5 outranks fiscal p12)"
            - "ledger unchanged by the rejected call: encumbered_total == 900.00, expended_total == 0.00, available_balance == 100.00"

      - name: do_approve_frozen_outranks_inventory
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.DistributionOrder.transitions
        distinguishing_aspect: |
          Error-category pair business_safety (p9) vs business_constraint (p10): approving a
          distribution order whose material is UNDER_CHALLENGE with insufficient inventory violates
          both ERR_MATERIAL_FROZEN and ERR_INSUFFICIENT_INVENTORY — the safety error must win.
          Distinct category pair from po_issue_state_error_outranks_fiscal (state vs fiscal).
