        distinguishing_aspect: "CANCELLED is terminal on both exits: a redeem on the cancelled contract returns ERR_CONTRACT_NOT_REDEEMABLE (409) and a second cancel returns ERR_CONTRACT_NOT_CANCELLABLE (409), while the cancel itself already zeroed remaining_fx_minor_units and liability_usd_cents and released the origin transaction's buyback_contract_id."
        test_recipe:
          setup:
            - "Canonical BR-LHR / EUR base with a PUBLISHED card and a 20 x 10000 EUR position."
            - "Customer with one SETTLED SELL deal of 2 x 10000 EUR (fx 20000, sell rate 878600) used as the buy-back origin."
