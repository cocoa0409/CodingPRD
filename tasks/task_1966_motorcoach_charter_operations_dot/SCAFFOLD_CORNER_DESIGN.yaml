scaffold_corner_design:
  # ==========================================================================
  # Section: entities — Creation, retrieval, defaults, computed fields
  # ==========================================================================
  - section: entities
    instances:
      - name: create_customer_with_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.CustomerAccount
          - endpoints: "POST /api/v1/customers"
        distinguishing_aspect: "POST with all required fields creates CustomerAccount with 201 and returns all fields including defaults"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/customers"
              payload: { company_name: "New Corp", contact_email: "new@x.com", contact_phone: "555-2000", billing_address: "2000 Main St" }
              as: QuoteAgent
              captures: { nc_id: $.data.id }
          assert:
            - "CustomerAccount.${nc_id}.company_name == 'New Corp'"
            - "CustomerAccount.${nc_id}.credit_status == ACTIVE"
            - "CustomerAccount.${nc_id}.tax_exempt == false"
            - "CustomerAccount.${nc_id}.total_completed_trips == 0"
            - "CustomerAccount.${nc_id}.lifetime_revenue_cents == 0"
            - "CustomerAccount.${nc_id}.version == 1"

      - name: create_vehicle_with_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Vehicle
          - endpoints: "POST /api/v1/vehicles"
        distinguishing_aspect: "Omitting optional fields ada_accessible and vehicle_class applies defaults false and STANDARD"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-100", make_model: "Prevost H3-45", year: 2024, seating_capacity: 56, dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-100", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { nv_id: $.data.id }
          assert:
            - "Vehicle.${nv_id}.ada_accessible == false"
            - "Vehicle.${nv_id}.vehicle_class == STANDARD"
            - "Vehicle.${nv_id}.status == AVAILABLE"
            - "Vehicle.${nv_id}.odometer_miles == 0"

      - name: create_driver_defaults_hos_cycle
        claim_type: defaults
        grounds:
          - entities.Driver
          - endpoints: "POST /api/v1/drivers"
        distinguishing_aspect: "Omitting hos_cycle_type defaults to CYCLE_70_8; computed HOS fields initialize to 0"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Test Driver", cdl_number: "CDL-100", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2023-01-01T00:00:00Z" }
              as: FleetManager
              captures: { nd_id: $.data.id }
          assert:
            - "Driver.${nd_id}.hos_cycle_type == CYCLE_70_8"
            - "Driver.${nd_id}.status == AVAILABLE"
            - "Driver.${nd_id}.current_driving_hours_today == 0.0"
            - "Driver.${nd_id}.safety_score == 100.0"

      - name: get_nonexistent_customer_returns_404
        claim_type: not_found
        grounds:
          - entities.CustomerAccount
          - endpoints: "GET /api/v1/customers/{id}"
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND 404"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QuoteAgent
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: get_nonexistent_vehicle_returns_404
        claim_type: not_found
        grounds:
          - entities.Vehicle
          - endpoints: "GET /api/v1/vehicles/{id}"
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with non-existent UUID for vehicle returns 404"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/vehicles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FleetManager
              captures: { err_nf2: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: customer_safety_audit_score_computed_field
        claim_type: computed_fields
        grounds:
          - entities.CustomerAccount.fields.safety_audit_score
          - calculations.calc_customer_safety_audit_score
        distinguishing_aspect: "safety_audit_score is computed from incident/breakdown history; for a new customer with no completed trips it should be 100.0"
        test_recipe:
          setup: ["Customer with no orders"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Fresh Co", contact_email: "fresh@x.com", contact_phone: "555-2100", billing_address: "2100 Main St" }
              as: QuoteAgent
              captures: { fc_id: $.data.id }
          trigger:
            - call: "GET /api/v1/customers/${fc_id}"
              payload: {}
              as: QuoteAgent
          assert:
            - "CustomerAccount.${fc_id}.safety_audit_score == 100.0"

  # ==========================================================================
  # Section: state_machines — Valid/invalid transitions, initial states, terminal lockdown
  # ==========================================================================
  - section: state_machines
    instances:
      - name: quote_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.CharterQuote
          - entities.CharterQuote.fields.status
        distinguishing_aspect: "Newly created CharterQuote starts in DRAFT status"
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Init Test", contact_email: "init@x.com", contact_phone: "555-2200", billing_address: "2200 Main St" }
              as: QuoteAgent
              captures: { ic_id: $.data.id }
          trigger:
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${ic_id}", trip_date: "2026-09-01T08:00:00Z", return_date: "2026-09-01T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 5, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { iq_id: $.data.id }
          assert:
            - "CharterQuote.${iq_id}.status == DRAFT"

      - name: quote_cancel_from_accepted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CharterQuote
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a quote that is already ACCEPTED (order created) must fail with ERR_INVALID_STATE; cancel is only valid from DRAFT or QUOTED"
        test_recipe:
          setup: ["Quote in ACCEPTED status (order already created)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Cancel Test", contact_email: "cancel@x.com", contact_phone: "555-2300", billing_address: "2300 Main St" }
              as: QuoteAgent
              captures: { cc_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cc_id}", trip_date: "2026-09-01T08:00:00Z", return_date: "2026-09-01T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 5, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { cq_id: $.data.id }
            - call: "POST /api/v1/quotes/${cq_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { cq_v: $.data.version }
            - call: "POST /api/v1/quotes/${cq_id}/accept"
              payload: { expected_quote_version: "${cq_v}" }
              as: Customer
              as_user_id: "${cc_id}"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /api/v1/quotes/${cq_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cc_id}"
              captures: { err_ci: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: order_cancel_from_completed_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CharterOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a COMPLETED order (terminal state) must fail; no transitions out of COMPLETED"
        test_recipe:
          setup: ["Order in COMPLETED status"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Terminal Test", contact_email: "term@x.com", contact_phone: "555-2400", billing_address: "2400 Main St" }
              as: QuoteAgent
              captures: { tc_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-T1", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-T1", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { tv_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Term Driver", cdl_number: "CDL-T1", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-01-01T00:00:00Z" }
              as: FleetManager
              captures: { td_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${tc_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T14:00:00Z", origin: "Dallas TX", destination: "Fort Worth TX", passenger_count: 40, estimated_miles: 100, estimated_hours: 4, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { tq_id: $.data.id }
            - call: "POST /api/v1/quotes/${tq_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { tq_v: $.data.version }
            - call: "POST /api/v1/quotes/${tq_id}/accept"
              payload: { expected_quote_version: "${tq_v}" }
              as: Customer
              as_user_id: "${tc_id}"
              captures: { to_id: $.data.id }
            - call: "POST /api/v1/orders/${to_id}/pay-deposit"
              payload: { amount_cents: 20000 }
              as: Customer
              as_user_id: "${tc_id}"
            - call: "GET /api/v1/orders/${to_id}"
              payload: {}
              as: DispatchManager
              captures: { to_v: $.data.version }
            - call: "POST /api/v1/orders/${to_id}/assign"
              payload: { vehicle_id: "${tv_id}", driver_id: "${td_id}", expected_order_version: "${to_v}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${to_id}/start-trip"
              payload: {}
              as: DispatchManager
            - call: "POST /api/v1/orders/${to_id}/complete-trip"
              payload: { actual_miles: 100, actual_hours: 4 }
              as: DispatchManager
          trigger:
            - call: "POST /api/v1/orders/${to_id}/cancel"
              payload: { reason: "Too late" }
              as: Customer
              as_user_id: "${tc_id}"
              captures: { err_term: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: vehicle_decommission_from_in_trip_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Vehicle
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Decommissioning a vehicle that is IN_TRIP must fail; decommission is only valid from AVAILABLE or IN_MAINTENANCE"
        test_recipe:
          setup: ["Vehicle assigned to an in-progress trip (status IN_TRIP)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Decomm Test", contact_email: "dec@x.com", contact_phone: "555-2500", billing_address: "2500 Main St" }
              as: QuoteAgent
              captures: { dc_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-D1", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-D1", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { dv_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Decomm Driver", cdl_number: "CDL-D1", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-01-01T00:00:00Z" }
              as: FleetManager
              captures: { dd_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${dc_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T14:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 5, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { dq_id: $.data.id }
            - call: "POST /api/v1/quotes/${dq_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { dq_v: $.data.version }
            - call: "POST /api/v1/quotes/${dq_id}/accept"
              payload: { expected_quote_version: "${dq_v}" }
              as: Customer
              as_user_id: "${dc_id}"
              captures: { do_id: $.data.id }
            - call: "POST /api/v1/orders/${do_id}/pay-deposit"
              payload: { amount_cents: 30000 }
              as: Customer
              as_user_id: "${dc_id}"
            - call: "GET /api/v1/orders/${do_id}"
              payload: {}
              as: DispatchManager
              captures: { do_v: $.data.version }
            - call: "POST /api/v1/orders/${do_id}/assign"
              payload: { vehicle_id: "${dv_id}", driver_id: "${dd_id}", expected_order_version: "${do_v}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${do_id}/start-trip"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /api/v1/vehicles/${dv_id}/decommission"
              payload: { reason: "End of life" }
              as: FleetManager
              captures: { err_dec: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: breakdown_cancel_dispatch_from_reported_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.BreakdownEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "cancel-dispatch is only valid from DISPATCHED; calling it from REPORTED must fail"
        test_recipe:
          setup: ["BreakdownEvent in REPORTED status"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "BrkInv Test", contact_email: "brki@x.com", contact_phone: "555-2600", billing_address: "2600 Main St" }
              as: QuoteAgent
              captures: { bic_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-BI1", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-BI1", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { biv_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Brk Driver", cdl_number: "CDL-BI1", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-01-01T00:00:00Z" }
              as: FleetManager
              captures: { bid_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${bic_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T14:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 5, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { biq_id: $.data.id }
            - call: "POST /api/v1/quotes/${biq_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { biq_v: $.data.version }
            - call: "POST /api/v1/quotes/${biq_id}/accept"
              payload: { expected_quote_version: "${biq_v}" }
              as: Customer
              as_user_id: "${bic_id}"
              captures: { bio_id: $.data.id }
            - call: "POST /api/v1/orders/${bio_id}/pay-deposit"
              payload: { amount_cents: 30000 }
              as: Customer
              as_user_id: "${bic_id}"
            - call: "GET /api/v1/orders/${bio_id}"
              payload: {}
              as: DispatchManager
              captures: { bio_v: $.data.version }
            - call: "POST /api/v1/orders/${bio_id}/assign"
              payload: { vehicle_id: "${biv_id}", driver_id: "${bid_id}", expected_order_version: "${bio_v}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${bio_id}/start-trip"
              payload: {}
              as: DispatchManager
            - call: "POST /api/v1/orders/${bio_id}/breakdowns"
              payload: { vehicle_id: "${biv_id}", driver_id: "${bid_id}", location: "I-35 Mile 50", description: "AC failure" }
              as: DispatchManager
              captures: { bibrk_id: $.data.id }
          trigger:
            - call: "POST /api/v1/breakdowns/${bibrk_id}/cancel-dispatch"
              payload: {}
              as: DispatchManager
              captures: { err_bci: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: maintenance_record_start_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.MaintenanceRecord
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Starting an already-COMPLETED maintenance record must fail; start is only valid from SCHEDULED"
        test_recipe:
          setup: ["Vehicle in IN_MAINTENANCE with a completed maintenance record"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-MR1", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-MR1", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { mrv_id: $.data.id }
            - call: "POST /api/v1/vehicles/${mrv_id}/send-to-maintenance"
              payload: {}
              as: FleetManager
            - call: "POST /api/v1/vehicles/${mrv_id}/maintenance-records"
              payload: { maintenance_type: "PREVENTIVE", scheduled_date: "2026-08-01T00:00:00Z", description: "Oil change", technician: "Tech A", cost_cents: 50000, odometer_at_service: 10000 }
              as: FleetManager
              captures: { mrec_id: $.data.id }
            - call: "POST /api/v1/maintenance-records/${mrec_id}/start"
              payload: {}
              as: FleetManager
            - call: "POST /api/v1/maintenance-records/${mrec_id}/complete"
              payload: { odometer_at_service: 10000 }
              as: FleetManager
          trigger:
            - call: "POST /api/v1/maintenance-records/${mrec_id}/start"
              payload: {}
              as: FleetManager
              captures: { err_mri: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: cancellation_fee_at_exactly_72_hours
        claim_type: correct_result
        grounds:
          - calculations.calc_cancellation_fee
          - entities.CharterOrder.fields.cancellation_fee_cents
        distinguishing_aspect: "At exactly 72 hours before trip, cancellation fee is 50% of deposit; at 71 hours, fee jumps to 75%"
        test_recipe:
          setup:
            - "Order CONFIRMED with deposit_paid=46683"
            - "Clock set to exactly 72 hours before trip_date"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Fee Bound", contact_email: "feeb@x.com", contact_phone: "555-2700", billing_address: "2700 Main St" }
              as: QuoteAgent
              captures: { fbc_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${fbc_id}", trip_date: "2026-08-04T00:00:00Z", return_date: "2026-08-04T08:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 600, estimated_hours: 8, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { fbq_id: $.data.id }
            - call: "POST /api/v1/quotes/${fbq_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { fbq_v: $.data.version }
            - call: "POST /api/v1/quotes/${fbq_id}/accept"
              payload: { expected_quote_version: "${fbq_v}" }
              as: Customer
