      - name: close_is_refused_on_state_before_it_is_refused_on_payability
        claim_type: priority_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_APPLICATION_STATE_INVALID]
          - errors[ERR_CONTRACTOR_NOT_PAYABLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / close_state_priority_9_beats_contractor_payable_priority_14
          rationale: "The difficulty instance already closes the loan, expires the contractor's licence and then attempts a second close, asserting ERR_APPLICATION_STATE_INVALID rather than ERR_CONTRACTOR_NOT_PAYABLE; a separate corner test would re-run the same two-row ordering with the same fixture."
      - name: the_headroom_and_regression_gates_are_ordered_against_each_other
        claim_type: aggregate_validation
        grounds:
          - validations[priority=16]
          - validations[priority=26]
          - errors[ERR_WAIVER_HEADROOM_EXCEEDED]
          - errors[ERR_PERCENT_COMPLETE_REGRESSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / waiver_headroom_priority_16_beats_percent_regression_priority_26
          rationale: "That instance builds a single review that simultaneously exceeds c1's open_waiver_headroom_cents and regresses l2 below its released percent, asserting ERR_WAIVER_HEADROOM_EXCEEDED; both codes and both aggregate computations are exercised there."
      - name: a_disputed_waiver_blocks_the_next_draw_review
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - endpoints[POST /lending/lien-waivers/{id}/dispute]
          - errors[ERR_LIEN_WAIVER_DISPUTED]
        excluded_because:
          difficulty_instance: compensating_invariant / waiver_dispute_and_resolution_restore_headroom_to_the_cent
          rationale: "The dispute-then-resolve instance already drives a COLLECTED waiver to DISPUTED, shows the review refused with ERR_LIEN_WAIVER_DISPUTED and negative headroom, and then restores coverage to the cent."
      - name: an_inspector_may_not_be_double_booked_inside_the_travel_buffer
        claim_type: temporal_validation
        grounds:
          - validations[priority=18]
          - validations[priority=22]
          - errors[ERR_INSPECTOR_WINDOW_CONFLICT]
          - errors[ERR_VISIT_ALREADY_SCHEDULED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / inspector_conflict_priority_18_beats_visit_already_scheduled_priority_22
          rationale: "That instance schedules across two loans at the buffered minute boundary and asserts ERR_INSPECTOR_WINDOW_CONFLICT wins over ERR_VISIT_ALREADY_SCHEDULED on a request that already holds a SCHEDULED visit."
      - name: accrual_periods_must_be_contiguous_and_non_overlapping
        claim_type: temporal_validation
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_ACCRUAL_PERIOD_OVERLAP]
          - errors[ERR_ACCRUAL_PERIOD_GAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / accrual_periods_are_inclusive_closed_and_gapless
          rationale: "The difficulty instance walks the closed-interval arithmetic directly: last_accrual_through, last_accrual_through + 1 and last_accrual_through + 2 as period_start, asserting overlap, acceptance and gap in that order."
      - name: a_revalued_property_makes_a_prior_sizing_stale
        claim_type: conditional_validation
        grounds:
          - validations[priority=28]
          - endpoints[PATCH /lending/properties/{id}/valuation]
          - errors[ERR_SIZING_STALE]
        excluded_because:
          difficulty_instance: transitive_cascade / valuation_revision_cascades_to_stale_sizing_and_blocks_decision
          rationale: "That instance revalues the ARV after sizing, asserts sizing_stale true on every application of the property, shows the decision refused with ERR_SIZING_STALE and re-sizes to a lower commitment."
      - name: a_line_may_not_be_revised_more_than_three_times
        claim_type: cascading_validation
        grounds:
          - validations[priority=24]
          - endpoints[PATCH /lending/rehab-line-items/{id}]
          - errors[ERR_REVISION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / rehab_line_revision_cycle_reenters_proposed_then_deapproves
          rationale: "The revision-cycle instance takes the same line through three REQUEST_REVISION / PATCH rounds and asserts the fourth PATCH is refused with ERR_REVISION_LIMIT_REACHED at revision_round 3."
      - name: an_extension_is_blocked_while_the_exit_watch_flag_is_raised
        claim_type: conditional_validation
        grounds:
          - validations[priority=25]
          - endpoints[POST /lending/loans/{id}/extensions]
          - errors[ERR_EXTENSION_BLOCKED_BY_EXIT_WATCH]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / extension_gate_reads_exit_watch_flag_derived_from_child_milestones
          rationale: "That instance derives exit_watch_flag from the ExitMilestone history, shows the extension refused with ERR_EXTENSION_BLOCKED_BY_EXIT_WATCH, and then clears the flag with a PRICE_REDUCED milestone so the extension succeeds."
  - section: endpoints
