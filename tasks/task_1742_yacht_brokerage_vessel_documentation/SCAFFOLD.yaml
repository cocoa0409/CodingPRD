    input: [kind, full_name, residency_state_code, tax_id_last4, 'is_entity_buyer?']
    output: Client
    side_effects: []
  - method: GET
    path: "/yacht/clients/{id}"
    description: "Fetch one client"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/yacht/vessels"
    description: "Register a vessel with documentation mode (USCG or STATE)"
    roles: [PlatformAdmin, ListingAgent]
