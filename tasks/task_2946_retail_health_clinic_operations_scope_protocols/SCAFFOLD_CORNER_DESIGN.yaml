            - "GET /prescriptions?visit_id=${v77_id} returns total_count == 2   # the two 412s persisted nothing"

      - name: corner_the_cancel_cascade_makes_the_clinic_version_stale_before_the_coverage_guard
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[float-cover-stale-clinic]
          - validations[priority=12]
          - validations[priority=61]
          - errors[ERR_STALE_CLINIC_VERSION]
        distinguishing_aspect: "The clinic version read BEFORE the cancellation is exactly the version an operator would hold, and it is refused with ERR_STALE_CLINIC_VERSION (412) because the four-hop cascade bumped the clinic. Replaying the accepted version after the coverage lands returns ERR_STALE_CLINIC_VERSION again — priority 12 masks the priority 61 ERR_COVERAGE_ALREADY_EXISTS that a same-version retry would otherwise hit."
        test_recipe:
          setup:
            - "A CA StateRule; an OPEN CA clinic (min_clinicians_required 1) with a PRIMARY ACTIVE assignment and one float-eligible CA clinician."
            - "The clinic version is read while the assignment is still ACTIVE."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 78", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c78_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Sorrel", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p78_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Sorrel Primary", credential: "NP", license_state_code: "CA", home_clinic_id: "${c78_id}", supervising_physician_id: "${p78_id}" }
              as: ClinicAdmin
              captures: { cl78_primary_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Sorrel Float", credential: "NP", license_state_code: "CA", home_clinic_id: "${c78_id}", supervising_physician_id: "${p78_id}", float_eligible: true }
              as: ClinicAdmin
              captures: { cl78_float_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c78_id}", clinician_id: "${cl78_primary_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p78_id}" }
              as: ClinicAdmin
              captures: { sa78_id: $.data.id }
            - call: "GET /clinics/${c78_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c78_version_before: $.data.version, c78_posture_before: $.data.open_status }
          trigger:
            - call: "POST /staffing-assignments/${sa78_id}/cancel"
              payload: { cancel_reason: "Ill" }
              as: ClinicAdmin
              captures: { sa78_status: $.data.status }
            - call: "POST /clinics/${c78_id}/float-coverages"
              payload: { covers_assignment_id: "${sa78_id}", expected_clinic_version: "${c78_version_before}", pinned_supervising_physician_id: "${p78_id}" }
              as: ClinicAdmin
              captures: { stale_cover_err: $.data.error_id }
            - call: "GET /clinics/${c78_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c78_version_after_cancel: $.data.version, c78_posture_after_cancel: $.data.open_status }
            - call: "POST /clinics/${c78_id}/float-coverages"
              payload: { covers_assignment_id: "${sa78_id}", expected_clinic_version: "${c78_version_after_cancel} - 1", pinned_supervising_physician_id: "${p78_id}" }
              as: ClinicAdmin
              captures: { off_by_one_err: $.data.error_id }
            - call: "POST /clinics/${c78_id}/float-coverages"
              payload: { covers_assignment_id: "${sa78_id}", expected_clinic_version: "${c78_version_after_cancel}", pinned_supervising_physician_id: "${p78_id}" }
              as: ClinicAdmin
              captures: { cover78_id: $.data.id, cover78_clinician: $.data.clinician_id, cover78_role: $.data.role_kind }
            - call: "POST /clinics/${c78_id}/float-coverages"
              payload: { covers_assignment_id: "${sa78_id}", expected_clinic_version: "${c78_version_after_cancel}", pinned_supervising_physician_id: "${p78_id}" }
              as: ClinicAdmin
              captures: { replay_err: $.data.error_id }
            - call: "GET /clinics/${c78_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c78_version_end: $.data.version, c78_posture_end: $.data.open_status, c78_on_duty_end: $.data.on_duty_clinician_count }
          assert:
            - "${c78_posture_before} == OPEN and ${sa78_status} == CANCELLED"
            - "${stale_cover_err} == ERR_STALE_CLINIC_VERSION with HTTP status 412   # the cascade bumped the clinic the operator had read"
            - "${c78_version_after_cancel} != ${c78_version_before} and ${c78_posture_after_cancel} == CLOSED"
            - "${off_by_one_err} == ERR_STALE_CLINIC_VERSION with HTTP status 412"
            - "${cover78_clinician} == ${cl78_float_id} and ${cover78_role} == FLOAT with HTTP status 201"
            - "${replay_err} == ERR_STALE_CLINIC_VERSION with HTTP status 412   # priority 12 fires before priority 61's ERR_COVERAGE_ALREADY_EXISTS"
            - "${c78_version_end} != ${c78_version_after_cancel} and ${c78_posture_end} == OPEN and ${c78_on_duty_end} == 1"
            - "GET /staffing-assignments?clinic_id=${c78_id}&role_kind=FLOAT returns total_count == 1"

