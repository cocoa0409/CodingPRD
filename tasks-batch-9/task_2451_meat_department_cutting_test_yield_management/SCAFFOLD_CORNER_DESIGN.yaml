              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /meat-ops/departments/00000000-0000-4000-8000-0000000000c1/case-plans"
              payload: { limit: 10, offset: 0 }
              as: MeatManager
