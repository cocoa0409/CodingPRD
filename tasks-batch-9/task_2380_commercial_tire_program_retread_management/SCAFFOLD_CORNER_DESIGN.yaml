              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-114", vehicle_type: "TRAILER", current_odometer_miles: 3000 }
