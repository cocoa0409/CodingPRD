              as: TrafficManager
              captures: { unit_id: "$.data.id",  unit_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 5000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot_id}/preempt"
              payload: { preempt_reason: "OVERSOLD" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot_id}/offer-make-good"
              payload: {}
              as: TrafficManager
              captures: { mg_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/spots/${spot_id}/offer-make-good"
              payload: {}
              as: TrafficManager
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_AVAIL_OVERFLOW — a make-good is already outstanding for this preempted spot"
            - "exactly one make-good exists: GET /traffic/spots/${spot_id}/make-goods returns 1 row (${mg_id})"
      - name: logday_finalize_past_date_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.LogDay.DRAFT_to_FINALIZED, "errors[ERR_DATE_WINDOW]"]
        distinguishing_aspect: "with the logical clock at its default 2026-08-01T00:00:00Z, finalizing a log dated 2026-07-30 is rejected as a past log."
        test_recipe:
          setup: ["week W (2026-07-27) and log day 2026-07-30 exist; clock never set, so it reads the startup default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-07-27" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week_id}/log-days"
              payload: { log_date: "2026-07-30" }
              as: TrafficManager
              captures: { log_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/log-days/${log_id}/finalize"
              payload: {}
              as: TrafficManager
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_DATE_WINDOW — log_date 2026-07-30 < clock date 2026-08-01"
            - "LogDay.${log_id}.status stays DRAFT"

  # ======================================================================
  # Section: calculations
  # ======================================================================
  - section: calculations
    instances:
      - name: copy_rotation_weighted_least_used_wins
        claim_type: correct_result
        grounds: [calculations.copy_rotation_select]
        distinguishing_aspect: "with copy A (weight 1, used once) and copy B (weight 1, never used), the next finalize assigns B — score times_used/weight minimized; weights bias rotation."
        test_recipe:
          setup:
            - "advertiser with TWO 30s copies Ca (created first) and Cb, both RECEIVED weight 1"
            - "program weekday 1 (Monday 2026-08-03), week W, unit U1 (2026-08-03, 120s) and unit U2 (2026-08-03, break 2, 120s)"
            - "approved order line 30s x 2 (guarantee 0); spots s_a placed in U1, s_b placed in U2; log day finalized once -> s_a gets Ca (tie broken by created_at ASC), s_b also gets Ca? NO — both spots finalize in the same run; rotation is evaluated per spot with times_used counting assignments made BEFORE the current finalize run, so both get Ca in run 1... pinned: first finalize assigns Ca to both spots (times_used evaluated before the run). Then a second log date: to observe rotation we need a second finalize run where Cb must win. Setup therefore: TWO weeks — week1 finalizes with Ca assigned (count 2); week2's finalize must assign Cb (score Ca=2/1=2, Cb=0/1=0)."
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "Rot", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Mon Rot", daypart_code: "DAYTIME", airs_weekday: 1, start_time_local: "13:00", duration_minutes: 60, rating_estimate: 2.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { w1_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${w1_id}/avail-units"
