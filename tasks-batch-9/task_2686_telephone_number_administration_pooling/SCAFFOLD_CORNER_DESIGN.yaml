            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "INITIAL", requested_block_count: 1, justification: "First block in Columbus", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
