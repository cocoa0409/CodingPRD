      - name: listing_disclosure_tokens_checked_on_create_and_on_syndicate
        claim_type: violation_to_error
        grounds:
          - validations.priority_24
          - validations.priority_25
          - errors.ERR_MARKETING_STANDARD_VIOLATION
          - errors.ERR_DUPLICATE_RESOURCE
        distinguishing_aspect: |
          The disclosure superset test runs on BOTH listing endpoints against the LIVE
          ProgramConfig, not against the pinned certification generation: a listing drafted legally
          becomes unsyndicatable the moment the program adds a required token, and syndicatable again
          when the token is withdrawn - with no change to the listing row itself. Extra tokens beyond
          the required set are always allowed, and the one-live-listing-per-channel uniqueness rule
          rejects a second DRAFT on the same channel.
        test_recipe:
          setup:
            - "Dealer D1, technician T1, published MPI-172, canonical vehicle V1, certification C1 ACTIVE at 2026-08-01."
