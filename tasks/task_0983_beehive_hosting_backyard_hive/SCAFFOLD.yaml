# =============================================================================
# Task 983 — Beehive Hosting & Backyard-Hive Service
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  983. Beehive Hosting & Backyard-Hive Service: hive placement & host agreement,
  inspection & health/mite check, honey-share allocation, swarm/removal,
  seasonal & overwinter, subscription, education, liability

domain_name: beehive-hosting
api_prefix: /api

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating      # hive posture (derived from inspections/mites) gates harvest, split, swarm capture
  secondary_archetype: quota_allocation          # season honey pool split host/operator/reserve
  complexity_layers:
    - optimistic_concurrency                     # OCC on Agreement.version and Subscription.version
    - cascading_side_effects                     # inspection verify -> hive posture -> harvest void -> allocation recompute
    - rate_threshold_triggers                    # mite load thresholds 2.00/3.00/9.00 per 100 bees
    - scheduled_actions                          # removal notice windows, cooling-off, lazy expiry
  entity_topology: flat                          # peer entities, FK references, no nested URL paths
  state_machine_shape: posture_driven            # Hive lifecycle x derived posture; Agreement amendment cycle; Inspection revision loop
  relationship_patterns:
    - one_to_many
    - self_referential                           # Hive.parent_hive_id (colony splits)
    - cross_aggregate                            # Harvest -> Agreement gating; RemovalJob -> Incident gating
  role_model: segregation_of_duties              # inspection recorder cannot verify own inspection; harvest recorder cannot approve
  consistency_model: immediate                   # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology)
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season display name" }
      - { name: frost_date, type: datetime, source: input, description: "First frost date; overwinter survival is evaluated against this date" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "exactly one OPEN season exists at any time" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp when the season opened" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when rollover closed it; null while OPEN" }

  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Host legal name" }
      - { name: email, type: string, source: input, description: "Host email", constraints: "unique across all hosts" }
      - { name: status, type: enum, source: system, description: "APPLICANT | ACTIVE | LIMITED | SUSPENDED" }
      - { name: waiver_signed_at, type: datetime, source: system, description: "Logical-clock time of latest liability waiver signature; null until first waiver" }
      - { name: waiver_version, type: string, source: input, description: "Waiver document version supplied at signing" }
      - { name: reputation_score, type: integer, source: computed, default: 100, description: "Starts 100; incident outcomes decrement; floor 0", constraints: "0..100" }
      - { name: honey_credit_kg, type: number, source: computed, default: 0, description: "Cumulative honey kilograms credited to host from distributed allocations" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over invoices with status OPEN or OVERDUE across the host's subscriptions" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; owning host" }
      - { name: address, type: string, source: input, description: "Street address of the yard" }
      - { name: base_capacity_hives, type: integer, source: input, default: 2, description: "Base hive capacity before bonuses", constraints: ">= 1" }
      - { name: effective_capacity_hives, type: integer, source: computed, description: "base + 1 if host subscription plan is PREMIUM + 1 if host completed ADV-201" }
      - { name: status, type: enum, source: system, description: "CLEAR | BLOCKED" }
      - { name: water_source, type: boolean, source: input, description: "Whether a water source is within 50 feet" }
      - { name: setback_feet, type: integer, source: input, description: "Distance from property line", constraints: ">= 0" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: term_start_date, type: datetime, source: input, description: "Inclusive term start (date)" }
      - { name: term_end_date, type: datetime, source: input, description: "Inclusive term end (date); must be after term_start_date" }
      - { name: host_share_base_bps, type: integer, source: input, description: "Host base share of net honey in basis points", constraints: "0..6000" }
      - { name: pending_host_share_base_bps, type: integer, source: system, description: "Proposed amended share; null unless status AMENDMENT_PENDING" }
      - { name: liability_clause_version, type: string, source: system, description: "Host's waiver_version pinned at signing" }
      - { name: status, type: enum, source: system, description: "PENDING_SIGNATURE | ACTIVE | AMENDMENT_PENDING | TERMINATED | EXPIRED" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock time the host signed; null until signed" }

  - name: Hive
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; agreement under which the hive is placed" }
      - { name: parent_hive_id, type: string, source: system, description: "FK -> Hive.id; set when created by a split, null otherwise" }
      - { name: source_swarm_event_id, type: string, source: system, description: "FK -> SwarmEvent.id; set when created by swarm capture, null otherwise" }
      - { name: installed_at, type: datetime, source: system, description: "Logical-clock install time" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | QUARANTINED | DEAD | REMOVED" }
      - { name: posture, type: enum, source: computed, description: "THRIVING | STABLE | WATCH | TREATMENT_REQUIRED | QUARANTINED — authoritative variant: VERIFIED inspections only" }
      - { name: provisional_posture, type: enum, source: computed, description: "Same enum as posture but the provisional variant: VERIFIED + SUBMITTED inspections" }
      - { name: last_verified_inspection_at, type: datetime, source: system, description: "inspected_at of latest VERIFIED inspection; null if none" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: hive_id, type: string, source: input, description: "FK -> Hive.id" }
      - { name: recorded_by_id, type: string, source: system, description: "X-User-ID of the recording Beekeeper (opaque operator id)" }
      - { name: inspected_at, type: datetime, source: input, description: "When the inspection physically happened" }
      - { name: mites_counted, type: integer, source: input, description: "Mites found in the wash sample", constraints: ">= 0" }
      - { name: bees_sampled, type: integer, source: input, description: "Bees in the wash sample", constraints: ">= 1" }
      - { name: mite_load_per_100, type: number, source: computed, description: "round_half_up(mites_counted / bees_sampled * 100, 2)" }
      - { name: disease_flag, type: boolean, source: input, description: "True if foulbrood or other notifiable disease observed" }
      - { name: brood_score, type: integer, source: input, description: "Brood pattern score", constraints: "0..10" }
      - { name: queen_seen, type: boolean, source: input, description: "Whether the queen (or fresh eggs) was observed" }
      - { name: stores_kg, type: number, source: input, description: "Honey stores on frame, kg", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | VERIFIED" }
      - { name: return_reason, type: string, source: input, description: "Why the verifier returned it; null unless RETURNED" }
      - { name: verified_by_id, type: string, source: system, description: "X-User-ID of the verifying ApiaryManager; null until VERIFIED" }

  - name: Treatment
    parent: null
    common_fields: true
    fields:
      - { name: hive_id, type: string, source: input, description: "FK -> Hive.id" }
      - { name: product, type: enum, source: input, description: "OXALIC_ACID | APIVAR | FORMIC_ACID" }
      - { name: start_date, type: datetime, source: input, description: "Planned treatment start (date)" }
      - { name: end_date, type: datetime, source: input, description: "Planned treatment end (date); half-open window [start_date, end_date); must be after start_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED" }
      - { name: withdrawal_end_date, type: datetime, source: computed, description: "end_date + 14 days; harvest embargo window is [start_date, withdrawal_end_date)" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock time of start; null until IN_PROGRESS" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time of completion; null until COMPLETED" }

  - name: Harvest
    parent: null
    common_fields: true
    fields:
      - { name: hive_id, type: string, source: input, description: "FK -> Hive.id" }
      - { name: collected_on, type: datetime, source: input, description: "Date the supers were pulled" }
      - { name: gross_kg, type: number, source: input, description: "Gross extracted honey kg", constraints: "> 0, max 3 decimal places" }
      - { name: moisture_pct, type: number, source: input, description: "Refractometer moisture percent", constraints: "0..100, max 2 decimal places" }
      - { name: net_kg, type: number, source: computed, description: "gross minus moisture penalty (see calculations.net_harvest_kg), round_half_up to 3 decimals" }
      - { name: status, type: enum, source: system, description: "RECORDED | APPROVED | VOIDED | SETTLED" }
      - { name: recorded_by_id, type: string, source: system, description: "X-User-ID of the recording Beekeeper" }
      - { name: approved_by_id, type: string, source: system, description: "X-User-ID of the approving ApiaryManager; null until APPROVED" }

  - name: HoneyAllocation
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; the season OPEN when the first harvest was approved" }
      - { name: hive_id, type: string, source: system, description: "FK -> Hive.id" }
      - { name: status, type: enum, source: system, description: "PROJECTED | FINALIZED | DISTRIBUTED" }
      - { name: projected_pool_net_kg, type: number, source: computed, description: "Sum of net_kg over RECORDED + APPROVED harvests for (season, hive)" }
      - { name: projected_host_kg, type: number, source: computed, description: "Projected variant of host share (per-harvest rounding over RECORDED + APPROVED, current bps inputs)" }
      - { name: pool_net_kg, type: number, source: computed, description: "Final pool: sum of net_kg over APPROVED harvests only; set at finalization" }
      - { name: effective_bps, type: integer, source: computed, description: "min(base + tier_bonus + edu_bonus, 6000); set at finalization" }
      - { name: host_kg, type: number, source: computed, description: "Final host share; per-harvest rounded sum at finalization" }
      - { name: reserve_kg, type: number, source: computed, description: "round3(pool * reserve_pct) + edu portion top-up; set at finalization" }
      - { name: operator_kg, type: number, source: computed, description: "pool_net_kg - host_kg - reserve_kg; set at finalization" }
      - { name: edu_bonus_kg, type: number, source: computed, description: "round3(pool * 200 / 10000) when education bonus applied, else 0" }
      - { name: finalized_at, type: datetime, source: system, description: "Rollover timestamp of finalization; null until FINALIZED" }
      - { name: distributed_at, type: datetime, source: system, description: "Distribution timestamp; null until DISTRIBUTED" }

  - name: SwarmEvent
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site where the swarm was spotted" }
      - { name: source_hive_id, type: string, source: input, description: "FK -> Hive.id; suspected parent hive; optional (absent when null)" }
      - { name: reported_by_host_id, type: string, source: system, description: "Host id taken from X-User-ID of the reporting Host" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock report time" }
      - { name: status, type: enum, source: system, description: "REPORTED | DISPATCHED | CAPTURED | LOST | EXPIRED" }
      - { name: assigned_beekeeper_id, type: string, source: system, description: "X-User-ID of dispatching Beekeeper; null until DISPATCHED" }
      - { name: captured_hive_id, type: string, source: system, description: "Hive created on capture; null until CAPTURED" }

  - name: RemovalJob
    parent: null
    common_fields: true
    fields:
      - { name: hive_id, type: string, source: input, description: "FK -> Hive.id" }
      - { name: requested_by_host_id, type: string, source: system, description: "Host id taken from X-User-ID" }
      - { name: reason, type: enum, source: input, description: "RELOCATION | NUISANCE | HEALTH | EXIT" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock request time" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | SCHEDULED | COMPLETED | CANCELLED | REJECTED" }
      - { name: decision_reason, type: string, source: input, description: "Manager note recorded at approve/reject; optional" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled job start; set by schedule call" }
      - { name: crew_id, type: string, source: input, description: "Opaque crew identifier; set by schedule call" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "0 if cancelled within 24h of requested_at (inclusive) or if REJECTED; else 7500; null until CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion time; null until COMPLETED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id" }
      - { name: plan, type: enum, source: input, description: "BASIC | PLUS | PREMIUM" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "BASIC 2999 | PLUS 4999 | PREMIUM 7999, pinned at creation/plan-change application" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAST_DUE | SUSPENDED | CANCELLED" }
      - { name: pending_plan, type: enum, source: system, description: "Plan scheduled by change-plan, applied at next rollover; null otherwise" }
      - { name: projected_overwinter_credit_cents, type: integer, source: computed, description: "Provisional variant: 4000 x count(host hives with installed_at <= OPEN season frost_date and lifecycle in {ACTIVE, QUARANTINED} right now)" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock activation time" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: period_label, type: string, source: system, description: "Billing period label, e.g. 2026-05" }
      - { name: fee_cents, type: integer, source: computed, description: "Subscription monthly_fee_cents for the period" }
      - { name: carried_balance_cents, type: integer, source: computed, description: "Sum of total_cents of unpaid prior invoices (OPEN/OVERDUE) at issuance; 0 for the first invoice" }
      - { name: late_fee_cents, type: integer, source: computed, description: "3% per full week overdue on carried_balance_cents (see calculations.invoice_total)" }
      - { name: overwinter_credit_cents, type: integer, source: computed, description: "Realized overwinter survival credit (positive amount subtracted); 0 except on rollover-issued invoices" }
      - { name: total_cents, type: integer, source: computed, description: "max(0, fee + carried + late - overwinter_credit); per-line rounded then summed" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERDUE | PAID | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issuance time" }
      - { name: due_at, type: datetime, source: system, description: "issued_at + 7 days" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock payment time; null until PAID" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id" }
      - { name: course_code, type: enum, source: input, description: "HOST-101 | ADV-201 | QUEEN-301" }
      - { name: status, type: enum, source: system, description: "ENROLLED | COMPLETED | FAILED" }
      - { name: quiz_score, type: integer, source: input, description: "Final quiz score 0..100; set at completion; >= 80 passes", constraints: "0..100" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion time; null until terminal" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: host_id, type: string, source: system, description: "FK -> Host.id; copied from site.host_id at report time" }
      - { name: reporter_id, type: string, source: system, description: "X-User-ID of the reporter" }
      - { name: severity, type: enum, source: input, description: "MINOR | SEVERE" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident happened" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: status, type: enum, source: system, description: "REPORTED | RESOLVED_AT_FAULT | RESOLVED_NO_FAULT | DISMISSED" }
      - { name: liability_cents, type: integer, source: input, description: "Liability claim amount recorded at resolution; default 0" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock resolution time; null until terminal" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/seasons/{id}/rollover"
        actor: PlatformOps
        preconditions:
          - "Season is OPEN"
        side_effects:
          - "closed_at := logical clock now; successor Season created OPEN"
          - "Finalize all HoneyAllocations of the closing season (final variant per calculations.honey_share_allocation; status PROJECTED -> FINALIZED)"
          - "Overwinter evaluation: for each host, count hives with installed_at <= closing season frost_date and lifecycle_status in {ACTIVE, QUARANTINED}; realized credit = 4000 cents x count"
          - "Agreement sweep: agreements in ACTIVE or AMENDMENT_PENDING with term_end_date < rollover date -> EXPIRED (pending amendment discarded)"
          - "Swarm sweep: SwarmEvents in REPORTED or DISPATCHED with reported_at older than 72h -> EXPIRED"
          - "Billing sweep per Subscription in ACTIVE or PAST_DUE: unpaid invoices with due_at < now -> OVERDUE; issue next-period Invoice (fee + carried + late - realized overwinter credit, floor 0); ACTIVE -> PAST_DUE when any invoice is OVERDUE after aging; PAST_DUE -> SUSPENDED when the subscription was already PAST_DUE entering this rollover and any invoice remains unpaid"
          - "Host standing: host of each subscription entering PAST_DUE or SUSPENDED -> LIMITED"

  - entity: Host
    field: status
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /api/hosts/{id}/sign-waiver"
        actor: Host
        preconditions:
          - "Host is APPLICANT"
          - "waiver_version supplied"
        side_effects:
          - "waiver_signed_at := logical clock now; waiver_version stored"
      - from: [ACTIVE, LIMITED, SUSPENDED]
        to: ACTIVE
        trigger: "POST /api/hosts/{id}/sign-waiver (waiver renewal)"
        actor: Host
        preconditions:
          - "Host is not APPLICANT"
        side_effects:
          - "waiver_signed_at := logical clock now; waiver_version stored; status -> ACTIVE (renewal clears SUSPENDED/LIMITED only when no unpaid invoices remain)"
        note: "Renewal does not cure billing-derived LIMITED while unpaid invoices exist; LIMITED -> ACTIVE only via invoice cure."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/hosts/{id}/suspend"
        actor: PlatformOps
        preconditions:
          - "Host is ACTIVE"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/hosts/{id}/reactivate"
        actor: PlatformOps
        preconditions:
          - "Host is SUSPENDED"
          - "No unpaid invoices (balance_due_cents == 0)"
        side_effects: []
      - from: ACTIVE
        to: LIMITED
        trigger: "system (season rollover: host's subscription enters PAST_DUE or SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIMITED
        to: ACTIVE
        trigger: "system (all invoices on host's subscriptions PAID or VOID)"
        actor: system
        preconditions:
          - "balance_due_cents == 0"
        side_effects: []

  - entity: Site
    field: status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: BLOCKED
        trigger: "system (SEVERE Incident reported on the site, or count of REPORTED incidents on the site reaches 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Hive installs, splits, swarm captures on the site are blocked while BLOCKED"
      - from: BLOCKED
        to: CLEAR
        trigger: "POST /api/sites/{id}/unblock"
        actor: ApiaryManager
        preconditions:
          - "Site is BLOCKED"
          - "No Incident on the site is in REPORTED status"
        side_effects: []

  - entity: Agreement
    field: status
    initial_state: PENDING_SIGNATURE
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/sign"
        actor: Host
        preconditions:
          - "Acting host owns the agreement (agreement.host_id == X-User-ID)"
          - "Host status is ACTIVE"
          - "Host waiver is current: waiver_signed_at is not null and now <= waiver_signed_at + 365 days"
          - "Site status is CLEAR"
          - "No other agreement on the same site in PENDING_SIGNATURE, ACTIVE, or AMENDMENT_PENDING whose [term_start_date, term_end_date] (closed interval) overlaps this agreement's term"
        side_effects:
          - "liability_clause_version := host.waiver_version; signed_at := now; increments Agreement.version by 1"
      - from: [ACTIVE, AMENDMENT_PENDING]
        to: AMENDMENT_PENDING
        trigger: "POST /api/agreements/{id}/propose-amendment"
        actor: PlatformOps
        preconditions:
          - "expected_agreement_version == current Agreement.version (OCC)"
        side_effects:
          - "pending_host_share_base_bps := proposed value; increments Agreement.version by 1"
        note: "From AMENDMENT_PENDING a new proposal legitimately supersedes the pending one; the OCC version check is the only guard."
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/accept-amendment"
        actor: Host
        preconditions:
          - "Acting host owns the agreement"
        side_effects:
          - "host_share_base_bps := pending_host_share_base_bps; pending_host_share_base_bps := null; increments Agreement.version by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/reject-amendment"
        actor: Host
        preconditions:
          - "Acting host owns the agreement"
        side_effects:
          - "pending_host_share_base_bps := null (terms unchanged); increments Agreement.version by 1"
      - from: [ACTIVE, AMENDMENT_PENDING]
        to: TERMINATED
        trigger: "POST /api/agreements/{id}/terminate"
        actor: "PlatformOps or owning Host"
        preconditions:
          - "No hive under this agreement in lifecycle_status ACTIVE or QUARANTINED"
          - "No RemovalJob for any hive of this agreement in REQUESTED, APPROVED, or SCHEDULED"
          - "Host balance_due_cents == 0"
        side_effects:
          - "pending_host_share_base_bps := null; increments Agreement.version by 1"
      - from: [ACTIVE, AMENDMENT_PENDING]
        to: EXPIRED
        trigger: "system (lazy: evaluated on any access when current logical date > term_end_date; also swept at season rollover)"
        actor: system
        preconditions:
          - "current logical date > term_end_date"
        side_effects:
          - "pending_host_share_base_bps := null"

  - entity: Hive
    field: lifecycle_status
    initial_state: ACTIVE
    terminal_states: [DEAD, REMOVED]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system (an Inspection for this hive is VERIFIED whose authoritative posture evaluates to QUARANTINED)"
        actor: system
        preconditions: []
        side_effects:
          - "posture := QUARANTINED"
          - "All Harvests of this hive in RECORDED status -> VOIDED"
          - "The (season, hive) HoneyAllocation, if it exists, is recomputed (projected variant) excluding the voided harvests"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "system (a later VERIFIED inspection's authoritative posture is not QUARANTINED)"
        actor: system
        preconditions: []
        side_effects:
          - "posture := newly derived posture"
      - from: [ACTIVE, QUARANTINED]
        to: DEAD
        trigger: "POST /api/hives/{id}/mark-dead"
        actor: ApiaryManager
        preconditions:
          - "Hive is ACTIVE or QUARANTINED"
        side_effects:
          - "Frees one unit of site occupancy"
      - from: [ACTIVE, QUARANTINED]
        to: REMOVED
        trigger: "system (RemovalJob for this hive is COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "Frees one unit of site occupancy"

  - entity: Inspection
    field: status
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/inspections/{id}/submit"
        actor: Beekeeper
        preconditions:
          - "recorded_by_id == X-User-ID (only the recorder may submit)"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/inspections/{id}/submit (resubmission)"
        actor: Beekeeper
        preconditions:
          - "recorded_by_id == X-User-ID"
        side_effects:
          - "return_reason retained for audit"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/inspections/{id}/verify"
        actor: ApiaryManager
        preconditions:
          - "verified_by (X-User-ID) != recorded_by_id (segregation of duties)"
          - "Hive is not DEAD and not REMOVED"
        side_effects:
          - "verified_by_id := X-User-ID"
          - "Hive.last_verified_inspection_at := inspected_at"
          - "Hive posture and provisional_posture recomputed; if authoritative posture is QUARANTINED the hive lifecycle ACTIVE -> QUARANTINED cascade fires; if it clears QUARANTINED the reverse cascade fires"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/inspections/{id}/return"
        actor: ApiaryManager
        preconditions:
          - "X-User-ID != recorded_by_id (segregation of duties)"
        side_effects:
          - "return_reason := supplied reason"

  - entity: Treatment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/treatments/{id}/start"
        actor: Beekeeper
        preconditions:
          - "Hive is ACTIVE or QUARANTINED"
        side_effects:
          - "started_at := now"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/treatments/{id}/complete"
        actor: Beekeeper
        preconditions: []
        side_effects:
          - "completed_at := now"

  - entity: Harvest
    field: status
    initial_state: RECORDED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: RECORDED
        to: APPROVED
        trigger: "POST /api/harvests/{id}/approve"
        actor: ApiaryManager
        preconditions:
          - "approved_by (X-User-ID) != recorded_by_id (segregation of duties)"
          - "Hive lifecycle_status is ACTIVE or QUARANTINED"
          - "The (season, hive) allocation is not FINALIZED or DISTRIBUTED"
        side_effects:
          - "approved_by_id := X-User-ID"
          - "HoneyAllocation for (current OPEN season, hive) is created if absent, else recomputed (projected variant includes this harvest)"
      - from: [RECORDED, APPROVED]
        to: VOIDED
        trigger: "POST /api/harvests/{id}/void"
        actor: ApiaryManager
        preconditions:
          - "The (season, hive) allocation is not FINALIZED or DISTRIBUTED"
        side_effects:
          - "HoneyAllocation, if it exists, is recomputed excluding this harvest (projected variant)"
      - from: APPROVED
        to: SETTLED
        trigger: "system (HoneyAllocation for (season, hive) is DISTRIBUTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HoneyAllocation
    field: status
    initial_state: PROJECTED
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: PROJECTED
        to: FINALIZED
        trigger: "system (season rollover finalization)"
        actor: system
        preconditions: []
        side_effects:
          - "Final variant computed: pool_net_kg, effective_bps, host_kg, reserve_kg, operator_kg, edu_bonus_kg; finalized_at := now"
      - from: FINALIZED
        to: DISTRIBUTED
        trigger: "POST /api/allocations/{id}/distribute"
        actor: PlatformOps
        preconditions:
          - "Allocation is FINALIZED"
        side_effects:
          - "Host.honey_credit_kg += host_kg"
          - "All APPROVED harvests of (season, hive) -> SETTLED"
          - "distributed_at := now"

  - entity: SwarmEvent
    field: status
    initial_state: REPORTED
    terminal_states: [CAPTURED, LOST, EXPIRED]
    transitions:
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /api/swarm-events/{id}/dispatch"
        actor: Beekeeper
        preconditions:
          - "Event not expired (lazy expiry evaluated first: now <= reported_at + 72h)"
        side_effects:
          - "assigned_beekeeper_id := X-User-ID"
      - from: DISPATCHED
        to: CAPTURED
        trigger: "POST /api/swarm-events/{id}/capture"
        actor: Beekeeper
        preconditions:
          - "assigned_beekeeper_id == X-User-ID"
          - "Event not expired"
          - "Site status is CLEAR"
          - "An ACTIVE agreement exists covering the site"
          - "Site occupancy below effective_capacity_hives"
        side_effects:
          - "A new Hive is created on the site under that agreement with source_swarm_event_id := this event, lifecycle ACTIVE, posture STABLE; captured_hive_id set"
      - from: DISPATCHED
        to: LOST
        trigger: "POST /api/swarm-events/{id}/mark-lost"
        actor: Beekeeper
        preconditions:
          - "assigned_beekeeper_id == X-User-ID"
        side_effects: []
      - from: [REPORTED, DISPATCHED]
        to: EXPIRED
        trigger: "system (lazy: evaluated on any access when now > reported_at + 72h; also swept at rollover)"
        actor: system
        preconditions:
          - "now > reported_at + 72 hours"
        side_effects: []

  - entity: RemovalJob
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/removal-jobs/{id}/approve with decision=APPROVE"
        actor: ApiaryManager
        preconditions:
          - "No Incident on the hive's site is in REPORTED status"
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/removal-jobs/{id}/approve with decision=REJECT"
        actor: ApiaryManager
        preconditions: []
        side_effects:
          - "cancellation_fee_cents := 0"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /api/removal-jobs/{id}/schedule"
        actor: ApiaryManager
        preconditions:
          - "scheduled_start >= now + 48 hours (inclusive)"
          - "Crew buffer: no other SCHEDULED RemovalJob with the same crew_id whose [scheduled_start, scheduled_start + 2h) window ends less than 2h before this start, or starts less than 2h after this window's end (a gap of >= 2h between job windows is required; a gap of exactly 2h is allowed)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/removal-jobs/{id}/complete"
        actor: Beekeeper
        preconditions: []
        side_effects:
          - "Hive lifecycle_status -> REMOVED; completed_at := now"
      - from: [REQUESTED, APPROVED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /api/removal-jobs/{id}/cancel"
        actor: "PlatformOps or owning Host"
        preconditions: []
        side_effects:
          - "cancellation_fee_cents := 0 when now <= requested_at + 24h, else 7500; when fee > 0 it is added to the host's balance via a stand-alone adjustment invoice at the next rollover (carried balance)"

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/change-plan"
        actor: Host
        preconditions:
          - "Acting host owns the subscription (subscription.host_id == X-User-ID)"
          - "expected_subscription_version == current Subscription.version (OCC)"
          - "If plan == PREMIUM: host holds a COMPLETED HOST-101 enrollment"
        side_effects:
          - "pending_plan := plan (supersedes any existing pending_plan); increments Subscription.version by 1"
        note: "Self-loop: a second change-plan legitimately supersedes the pending one; OCC on Subscription.version is the only guard."
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (rollover: an invoice of this subscription is OVERDUE after aging)"
        actor: system
        preconditions: []
        side_effects:
          - "Host status -> LIMITED"
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "system (rollover: subscription was already PAST_DUE and still has unpaid invoices)"
        actor: system
        preconditions: []
        side_effects:
          - "Host remains LIMITED"
      - from: [PAST_DUE, SUSPENDED]
        to: ACTIVE
        trigger: "system (invoice payment leaves no OPEN or OVERDUE invoices on the subscription)"
        actor: system
        preconditions:
          - "No invoice of this subscription is OPEN or OVERDUE"
        side_effects:
          - "Host LIMITED -> ACTIVE (when no other blocking condition)"
      - from: [ACTIVE, PAST_DUE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Host
        preconditions:
          - "Acting host owns the subscription"
          - "balance_due_cents == 0 for the host"
        side_effects:
          - "pending_plan := null"

  - entity: Invoice
    field: status
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /api/invoices/{id}/pay"
        actor: "Host (owner) or PlatformOps"
        preconditions:
          - "Invoice is OPEN"
        side_effects:
          - "paid_at := now; if no OPEN/OVERDUE invoices remain on the subscription, subscription PAST_DUE/SUSPENDED -> ACTIVE and host LIMITED -> ACTIVE"
      - from: OVERDUE
        to: PAID
        trigger: "POST /api/invoices/{id}/pay"
        actor: "Host (owner) or PlatformOps"
        preconditions:
          - "Invoice is OVERDUE"
        side_effects:
          - "paid_at := now; same cure cascade as above"
      - from: OPEN
        to: OVERDUE
        trigger: "system (rollover aging: due_at < rollover time and invoice unpaid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [OPEN, OVERDUE]
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: PlatformOps
        preconditions:
          - "Invoice is OPEN or OVERDUE"
        side_effects:
          - "Invoice excluded from host balance_due_cents; cure cascade re-evaluated"

  - entity: Enrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /api/enrollments/{id}/complete with quiz_score >= 80"
        actor: PlatformOps
        preconditions:
          - "quiz_score >= 80"
        side_effects:
          - "completed_at := now"
      - from: ENROLLED
        to: FAILED
        trigger: "POST /api/enrollments/{id}/complete with quiz_score < 80"
        actor: PlatformOps
        preconditions:
          - "quiz_score < 80"
        side_effects: []
        note: "Retakes create a new Enrollment row."

  - entity: Incident
    field: status
    initial_state: REPORTED
    terminal_states: [RESOLVED_AT_FAULT, RESOLVED_NO_FAULT, DISMISSED]
    transitions:
      - from: REPORTED
        to: RESOLVED_AT_FAULT
        trigger: "POST /api/incidents/{id}/resolve with outcome=AT_FAULT"
        actor: ApiaryManager
        preconditions: []
        side_effects:
          - "Host reputation_score -= 15 when severity SEVERE, -= 5 when MINOR (floor 0); resolved_at := now; liability_cents recorded"
      - from: REPORTED
        to: RESOLVED_NO_FAULT
        trigger: "POST /api/incidents/{id}/resolve with outcome=NO_FAULT"
        actor: ApiaryManager
        preconditions: []
        side_effects:
          - "resolved_at := now"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /api/incidents/{id}/resolve with outcome=DISMISSED"
        actor: ApiaryManager
        preconditions: []
        side_effects:
          - "resolved_at := now"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amendment-occ
    parent_entity: Agreement
    write_endpoint: "POST /api/agreements/{id}/propose-amendment"
    occ_field: expected_agreement_version
    description: |
      Proposing an amendment against an Agreement whose version has advanced
      since the client last observed it is rejected. A newer proposal may
      legitimately supersede a pending one (AMENDMENT_PENDING -> AMENDMENT_PENDING
      is an allowed transition), so the stale-version check is the only guard
      against a writer acting on an out-of-date agreement view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-change-plan-occ
    parent_entity: Subscription
    write_endpoint: "POST /api/subscriptions/{id}/change-plan"
    occ_field: expected_subscription_version
    description: |
      Scheduling a plan change against a Subscription whose version has advanced
      since the client last observed it is rejected. A newer change-plan request
      legitimately supersedes the pending one (ACTIVE -> ACTIVE self-loop), so
      the stale-version check is the only guard.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: mite_load_per_100
    trigger: "Inspection creation (computed and stored at POST /api/inspections)"
    algorithm: aggregation
    formula: |
      mite_load_per_100 = round_half_up(mites_counted / bees_sampled * 100, 2)
      Implementations MUST use decimal arithmetic (no binary floating point).
    input_set: "the Inspection being created"
    precision: "2 decimal places, round_half_up, decimal arithmetic"

  - name: hive_posture_derivation
    trigger: "Inspection verify; also recomputed lazily on Hive read"
    algorithm: threshold
    formula: |
      Candidate set: inspections of the hive, ordered by (inspected_at DESC, created_at DESC).
      AUTHORITATIVE variant (field `posture`, used for all gating): only status VERIFIED.
      PROVISIONAL variant (field `provisional_posture`, display only): status VERIFIED or SUBMITTED.
      Take the latest inspection in the candidate set; if none, posture = STABLE.
      From that inspection:
        disease_flag == true                      -> QUARANTINED
        mite_load_per_100 >= 9.00                 -> QUARANTINED
        mite_load_per_100 >= 3.00                 -> TREATMENT_REQUIRED
        mite_load_per_100 >= 2.00                 -> WATCH
        brood_score < 6 or stores_kg < 8          -> WATCH
        queen_seen and brood_score >= 8 and mite_load_per_100 < 1.00 -> THRIVING
        otherwise                                 -> STABLE
    input_set: "Inspections of one hive; variant-specific status filter as above"
    constants:
      MITE_WATCH_THRESHOLD: 2.00
      MITE_TREATMENT_THRESHOLD: 3.00
      MITE_QUARANTINE_THRESHOLD: 9.00
    variants:
      - name: authoritative
        when: "field posture; drives harvest gating, lifecycle QUARANTINED cascade, split eligibility"
        difference: "candidate set restricted to VERIFIED inspections"
      - name: provisional
        when: "field provisional_posture; informational only, never gates"
        difference: "candidate set includes SUBMITTED inspections, so an unverified bad report moves provisional_posture while posture is unchanged"

  - name: net_harvest_kg
    trigger: "Harvest creation (computed and stored at POST /api/harvests)"
    algorithm: threshold
    formula: |
      excess_pct = max(0, moisture_pct - 18.6)        # strictly greater than 18.6 is penalized; exactly 18.6 is not
      moisture_penalty_kg = gross_kg * (excess_pct / 100) * 2.0
      net_kg = round_half_up(gross_kg - moisture_penalty_kg, 3)
      Decimal arithmetic mandatory.
    input_set: "the Harvest being created"
    constants:
      MOISTURE_LIMIT_PCT: 18.6
      MOISTURE_PENALTY_FACTOR: 2.0
    precision: "3 decimal places, round_half_up, decimal arithmetic"

  - name: honey_share_allocation
    trigger: "projected variant: harvest approve/void and hive quarantine cascade; final variant: season rollover finalization"
    algorithm: tiered_pricing
    formula: |
      Shared inputs:
        base_bps   = agreement.host_share_base_bps of the hive's agreement
        tier_bonus = 0 (BASIC) | 250 (PLUS) | 500 (PREMIUM), from the host's subscription plan
        edu_bonus  = 200 if the host holds a COMPLETED HOST-101 enrollment, else 0
        effective_bps = min(base_bps + tier_bonus + edu_bonus, 6000)
      Per-harvest rounding (PINNED ORDER — round each harvest first, then sum):
        host_kg = SUM over included harvests h of round_half_up(h.net_kg * effective_bps / 10000, 3)
      PROJECTED variant (field projected_host_kg / projected_pool_net_kg):
        included harvests = status in {RECORDED, APPROVED}
        bps inputs read at computation time (current agreement value, current plan, current enrollment state)
      FINAL variant (fields host_kg / pool_net_kg, at rollover):
        included harvests = status APPROVED only
        bps inputs pinned at season close: agreement value as of close, plan as of close
          (a pending_plan does NOT apply to the closing season), edu requires completed_at <= close time
    input_set: "Harvests of one (season, hive) pair; variant-specific status filter as above"
    constants:
      TIER_BONUS_BPS: { BASIC: 0, PLUS: 250, PREMIUM: 500 }
      EDU_BONUS_BPS: 200
      SHARE_CAP_BPS: 6000
    precision: "3 decimal places per harvest, round_half_up, decimal arithmetic"
    variants:
      - name: projected
        when: "recomputed on every harvest approve/void and on the quarantine cascade"
        difference: "includes RECORDED harvests and reads bps inputs live; diverges from final whenever a RECORDED harvest exists or inputs change mid-season"
      - name: final
        when: "season rollover"
        difference: "APPROVED harvests only; inputs pinned at close"

  - name: season_pool_and_reserve
    trigger: "season rollover finalization (after honey_share_allocation final variant per hive)"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (the dependency is circular-looking and must be resolved in this order):
        (1) pool_net_kg(hive) = SUM of net_kg over APPROVED harvests of the (season, hive) pair
        (2) host_kg(hive) per honey_share_allocation final variant (uses effective_bps including edu_bonus)
        (3) edu_bonus_kg(hive) = round_half_up(pool_net_kg * 200 / 10000, 3) when edu applied, else 0
        (4) reserve_pct = 0.06 if pool_net_kg >= 100.000 else 0.03
        (5) reserve_kg(hive) = round_half_up(pool_net_kg * reserve_pct, 3) + edu_bonus_kg(hive)
        (6) operator_kg(hive) = pool_net_kg - host_kg - reserve_kg   (remainder; makes the conservation identity exact)
      Invariant (see compensating invariant honey_mass_conservation):
        host_kg + reserve_kg + operator_kg == pool_net_kg for every finalized allocation.
    input_set: "all FINALIZED-eligible (season, hive) pairs of the closing season"
    constants:
      RESERVE_POOL_TIER_KG: 100.000
      RESERVE_PCT_LOW: 0.03
      RESERVE_PCT_HIGH: 0.06
    precision: "3 decimal places, round_half_up, decimal arithmetic"

  - name: invoice_total
    trigger: "invoice issuance at subscription creation and at each season rollover"
    algorithm: chronological
    formula: |
      Lines are computed and rounded individually, THEN summed (PINNED ORDER: per-line round, then sum):
        fee_cents      = subscription.monthly_fee_cents
        carried_cents  = SUM of total_cents over the subscription's unpaid (OPEN or OVERDUE) invoices; 0 for the first invoice
        weeks_overdue  = for each unpaid prior invoice, floor((now - due_at) / 7 days); summed per invoice
        late_fee_cents = SUM per unpaid prior invoice of weeks_overdue_i * round_half_up(total_i * 0.03, 0)
                         (accrues on the entire unpaid total including prior late fees — compounding is intended)
        overwinter_credit_cents = realized credit at rollover (see overwinter_credit), else 0
        total_cents    = max(0, fee_cents + carried_cents + late_fee_cents - overwinter_credit_cents)
      due_at = issued_at + 7 days.
    input_set: "one subscription's invoices in issuance order"
    constants:
      LATE_FEE_PCT_PER_WEEK: 0.03
      DUE_DAYS: 7
    precision: "integer cents, round_half_up per line, then sum"

  - name: overwinter_credit
    trigger: "projected variant: computed live on Subscription read; realized variant: season rollover"
    algorithm: threshold
    formula: |
      credit_cents = 4000 * count(hives of the host with installed_at <= closing season.frost_date
                                   AND lifecycle_status in {ACTIVE, QUARANTINED})
      PROJECTED variant (field Subscription.projected_overwinter_credit_cents):
        evaluated against the currently OPEN season's frost_date and the hive set as of right now.
      REALIZED variant (Invoice.overwinter_credit_cents on the rollover-issued invoice):
        evaluated at rollover time against the closing season's frost_date and hive lifecycles at close.
    input_set: "all hives across all sites of the host"
    constants:
      OVERWINTER_CREDIT_PER_HIVE_CENTS: 4000
    variants:
      - name: projected
        when: "Subscription read before season close"
        difference: "counts hives alive now; a hive that dies between the read and the close is still counted here"
      - name: realized
        when: "rollover"
        difference: "counts only hives still ACTIVE/QUARANTINED at close"

  - name: site_effective_capacity
    trigger: "recomputed on hive install/split/capture, subscription change application, enrollment completion"
    algorithm: aggregation
    formula: |
      effective_capacity_hives = base_capacity_hives
        + 1 if the host's non-CANCELLED subscription plan is PREMIUM else 0
        + 1 if the host holds a COMPLETED ADV-201 enrollment else 0
      occupancy = count of hives on the site with lifecycle_status in {ACTIVE, QUARANTINED}
      A new hive (install, split child, swarm capture) requires occupancy < effective_capacity_hives
      (occupancy == capacity blocks; boundary is inclusive-reject).
    input_set: "one site, its host's subscription and enrollments"
    precision: "integer"

  - name: host_reputation
    trigger: "incident resolution"
    algorithm: decay_function
    formula: |
      reputation_score starts at 100.
      RESOLVED_AT_FAULT: SEVERE -15, MINOR -5. Floor 0.
      Gate: host reputation_score < 50 blocks POST /api/agreements (new agreements).
    input_set: "one host's resolved incidents"
    constants:
      REPUTATION_START: 100
      REPUTATION_SEVERE_PENALTY: 15
      REPUTATION_MINOR_PENALTY: 5
      REPUTATION_AGREEMENT_GATE: 50
    precision: "integer"

  - name: cancellation_fee
    trigger: "RemovalJob cancellation"
    algorithm: threshold
    formula: |
      cancellation_fee_cents = 0  when now <= requested_at + 24 hours (boundary inclusive: exactly 24h is free)
                             = 7500 otherwise
      REJECTED jobs always have fee 0.
    input_set: "the RemovalJob being cancelled"
    constants:
      COOLING_OFF_HOURS: 24
      CANCELLATION_FEE_CENTS: 7500
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Host-role ownership: the target resource's host_id == X-User-ID (agreements, sites, subscriptions, invoices, enrollments, removal jobs, swarm reports)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "host-scoped mutating endpoints when called as Host"
  - priority: 4
    category: existence
    check: "Path ids exist (left to right); body FK ids (host_id, site_id, agreement_id, hive_id, source_hive_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, enum values valid, ranges valid (bees_sampled >= 1, quiz_score 0..100, term_end_date > term_start_date, end_date > start_date, gross_kg > 0, email unique)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: state
    check: "Target resource is in a state that allows the operation (per state machines); OCC expected_*_version match is evaluated here"
    error_id: "ERR_INVALID_STATE | ERR_HIVE_NOT_OPERABLE | ERR_AGREEMENT_NOT_ACTIVE | ERR_INSPECTION_NOT_SUBMITTED | ERR_SUBSCRIPTION_NOT_ACTIVE | ERR_INVOICE_NOT_PAYABLE | ERR_INVOICE_NOT_VOIDABLE | ERR_SWARM_NOT_ACTIONABLE | ERR_REMOVAL_NOT_ACTIONABLE | ERR_ALLOCATION_NOT_DISTRIBUTABLE | ERR_SEASON_NOT_CLOSABLE | ERR_ENROLLMENT_NOT_COMPLETABLE | ERR_STALE_VERSION (412)"
    http_status: 400
    applies_to: "state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Safety: waiver current where required (agreement sign, hive install, removal request, enrollment); segregation of duties (verifier/approver != recorder); hive not quarantined for harvest; no withdrawal window covers collected_on"
    error_id: "ERR_WAIVER_CURRENT_REQUIRED | ERR_SEGREGATION_OF_DUTIES | ERR_HIVE_QUARANTINED | ERR_WITHDRAWAL_WINDOW_ACTIVE"
    http_status: 400
    applies_to: "safety-gated endpoints (sign, hives install, inspections verify/return, harvests create/approve, removal-jobs create, enrollments create)"
  - priority: 8
    category: business_constraint
    check: "Constraint: site CLEAR for install/split/capture; occupancy < effective_capacity_hives; agreement window overlap (closed interval); treatment window overlap (half-open); crew buffer conflict; single non-terminal subscription per host; course prerequisites"
    error_id: "ERR_SITE_BLOCKED | ERR_SITE_CAPACITY_EXCEEDED | ERR_AGREEMENT_WINDOW_OVERLAP | ERR_TREATMENT_WINDOW_OVERLAP | ERR_CREW_SCHEDULE_CONFLICT | ERR_DUPLICATE_SUBSCRIPTION | ERR_COURSE_PREREQUISITE_NOT_MET"
    http_status: 409
    applies_to: "hives create/split, swarm capture, agreements create, treatments create, removal schedule, subscriptions create/change-plan, enrollments create"
  - priority: 9
    category: business_referential
    check: "Referential: no REPORTED incident on the site when approving a removal; no live hives or in-flight removal jobs when terminating an agreement; at most one non-terminal RemovalJob per hive"
    error_id: "ERR_SITE_HAS_OPEN_INCIDENTS | ERR_AGREEMENT_HAS_LIVE_HIVES | ERR_REMOVAL_NOT_ACTIONABLE"
    http_status: 409
    applies_to: "removal-jobs approve/create, agreements terminate"
  - priority: 10
    category: business_temporal
    check: "Temporal: harvest requires a VERIFIED inspection with inspected_at within [collected_on - 30 days, collected_on]; removal schedule requires scheduled_start >= now + 48h; swarm dispatch/capture before reported_at + 72h; swarm capture/install requires the current date within the agreement term"
    error_id: "ERR_INSPECTION_STALE | ERR_REMOVAL_NOTICE_TOO_SHORT | ERR_SWARM_NOT_ACTIONABLE | ERR_AGREEMENT_NOT_ACTIVE"
    http_status: 400
    applies_to: "harvests create, removal schedule, swarm dispatch/capture, hives create/split"
  - priority: 11
    category: business_fiscal
    check: "Fiscal/standing: host status ACTIVE where required (agreement create, hive install, enrollment); balance_due_cents == 0 for removal request, agreement terminate, subscription cancel, host reactivate; reputation_score >= 50 for agreement create"
    error_id: "ERR_HOST_NOT_ACTIVE | ERR_OUTSTANDING_BALANCE | ERR_HOST_REPUTATION_TOO_LOW"
    http_status: 400
    applies_to: "agreements create/terminate, hives create, removal-jobs create, subscriptions cancel, hosts reactivate, enrollments create"

# =============================================================================
# §1.5 API Endpoint Table (75 endpoints)
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Default before any call is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlatformOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["All lazy time-derived transitions (agreement expiry, swarm expiry) are evaluated against the new value on subsequent accesses"]

  # --- Seasons ---
  - method: POST
    path: "/api/seasons"
    description: "Create the genesis season (only when no season exists)"
    roles: [PlatformOps]
    code: 201
    input: [name, frost_date]
    output: Season
    side_effects: ["status OPEN; opened_at := logical clock now"]
  - method: GET
    path: "/api/seasons/{id}"
    description: "Read a season"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: "/api/seasons/{id}/rollover"
    description: "Close the OPEN season and open its successor; runs the full checkpoint sweep (allocation finalization, overwinter credit, agreement/swarm expiry, invoice aging and issuance, subscription and host standing cascades)"
    roles: [PlatformOps]
    code: 201
    input: [name, frost_date]
    output: Season
    side_effects: ["All side effects of the Season OPEN -> CLOSED transition; response is the successor Season (OPEN)"]

  # --- Hosts ---
  - method: POST
    path: "/api/hosts"
    description: "Register a host (self-service)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: Host
    side_effects: ["status APPLICANT; reputation_score 100"]
  - method: GET
    path: "/api/hosts/{id}"
    description: "Read a host (computed fields balance_due_cents, honey_credit_kg, reputation_score are current)"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Host
    side_effects: []
  - method: POST
    path: "/api/hosts/{id}/sign-waiver"
    description: "Sign or renew the liability waiver; APPLICANT -> ACTIVE on first signature"
    roles: [Host]
    code: 200
    input: [waiver_version]
    output: Host
    side_effects: ["waiver_signed_at := now; waiver_version stored; APPLICANT -> ACTIVE"]
  - method: POST
    path: "/api/hosts/{id}/suspend"
    description: "Suspend a host (ops action)"
    roles: [PlatformOps]
    code: 200
    input: []
    output: Host
    side_effects: ["ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/api/hosts/{id}/reactivate"
    description: "Reactivate a suspended host; requires zero balance"
    roles: [PlatformOps]
    code: 200
    input: []
    output: Host
    side_effects: ["SUSPENDED -> ACTIVE"]

  # --- Sites ---
  - method: POST
    path: "/api/sites"
    description: "Create a site for a host; host_id must equal X-User-ID when called as Host"
    roles: [Host]
    code: 201
    input: [host_id, address, "base_capacity_hives?", water_source, setback_feet]
    output: Site
    side_effects: ["status CLEAR"]
  - method: GET
    path: "/api/sites/{id}"
    description: "Read a site"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/api/sites"
    description: "List sites, optionally filtered by host; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["host_id?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: POST
    path: "/api/sites/{id}/unblock"
    description: "Clear a BLOCKED site after all its incidents are resolved"
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Site
    side_effects: ["BLOCKED -> CLEAR"]

  # --- Agreements ---
  - method: POST
    path: "/api/agreements"
    description: "Create a host agreement (PENDING_SIGNATURE)"
    roles: [PlatformOps]
    code: 201
    input: [host_id, site_id, term_start_date, term_end_date, host_share_base_bps]
    output: Agreement
    side_effects: ["Closed-interval overlap with existing PENDING_SIGNATURE/ACTIVE/AMENDMENT_PENDING agreements on the same site is rejected"]
  - method: GET
    path: "/api/agreements/{id}"
    description: "Read an agreement (lazy expiry applied)"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Agreement
    side_effects: []
  - method: GET
    path: "/api/agreements"
    description: "List agreements, optionally filtered; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["host_id?", "site_id?", "limit?", "offset?"]
    output: Agreement[]
    side_effects: []
  - method: POST
    path: "/api/agreements/{id}/sign"
    description: "Host signs the agreement; pins liability clause version"
    roles: [Host]
    code: 200
    input: []
    output: Agreement
    side_effects: ["PENDING_SIGNATURE -> ACTIVE; liability_clause_version pinned; increments Agreement.version by 1"]
  - method: POST
    path: "/api/agreements/{id}/propose-amendment"
    description: "Propose a share amendment (OCC-guarded; supersedes any pending proposal)"
    roles: [PlatformOps]
    code: 200
    input: [proposed_host_share_base_bps, expected_agreement_version]
    output: Agreement
    side_effects: ["ACTIVE/AMENDMENT_PENDING -> AMENDMENT_PENDING; pending_host_share_base_bps set; increments Agreement.version by 1"]
  - method: POST
    path: "/api/agreements/{id}/accept-amendment"
    description: "Host accepts the pending amendment"
    roles: [Host]
    code: 200
    input: []
    output: Agreement
    side_effects: ["AMENDMENT_PENDING -> ACTIVE; new base bps applied; increments Agreement.version by 1"]
  - method: POST
    path: "/api/agreements/{id}/reject-amendment"
    description: "Host rejects the pending amendment"
    roles: [Host]
    code: 200
    input: []
    output: Agreement
    side_effects: ["AMENDMENT_PENDING -> ACTIVE; pending proposal discarded; increments Agreement.version by 1"]
  - method: POST
    path: "/api/agreements/{id}/terminate"
    description: "Terminate an agreement; requires no live hives, no in-flight removals, zero balance"
    roles: [Host, PlatformOps]
    code: 200
    input: []
    output: Agreement
    side_effects: ["ACTIVE/AMENDMENT_PENDING -> TERMINATED; increments Agreement.version by 1"]

  # --- Hives ---
  - method: POST
    path: "/api/hives"
    description: "Install a hive on a site under an agreement"
    roles: [ApiaryManager]
    code: 201
    input: [site_id, agreement_id]
    output: Hive
    side_effects: ["occupancy +1; posture STABLE until first verified inspection"]
  - method: GET
    path: "/api/hives/{id}"
    description: "Read a hive (posture and provisional_posture current)"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Hive
    side_effects: []
  - method: GET
    path: "/api/hives"
    description: "List hives with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["site_id?", "agreement_id?", "parent_hive_id?", "source_swarm_event_id?", "limit?", "offset?"]
    output: Hive[]
    side_effects: []
  - method: POST
    path: "/api/hives/{id}/split"
    description: "Split a strong hive; creates a child hive on the same site under the same agreement"
    roles: [ApiaryManager]
    code: 201
    input: []
    output: Hive
    side_effects: ["Child created with parent_hive_id := path id, lifecycle ACTIVE, posture STABLE; occupancy +1"]
  - method: POST
    path: "/api/hives/{id}/mark-dead"
    description: "Record colony death (overwinter loss, collapse)"
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Hive
    side_effects: ["ACTIVE/QUARANTINED -> DEAD; occupancy -1"]

  # --- Inspections ---
  - method: POST
    path: "/api/inspections"
    description: "Record a field inspection (DRAFT); recorded_by_id taken from X-User-ID"
    roles: [Beekeeper]
    code: 201
    input: [hive_id, inspected_at, mites_counted, bees_sampled, disease_flag, brood_score, queen_seen, stores_kg]
    output: Inspection
    side_effects: ["mite_load_per_100 computed and stored"]
  - method: GET
    path: "/api/inspections/{id}"
    description: "Read an inspection"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/api/inspections"
    description: "List inspections with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["hive_id?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/api/inspections/{id}/submit"
    description: "Submit (or resubmit) an inspection for verification; recorder only"
    roles: [Beekeeper]
    code: 200
    input: []
    output: Inspection
    side_effects: ["DRAFT/RETURNED -> SUBMITTED"]
  - method: POST
    path: "/api/inspections/{id}/verify"
    description: "Verify a submitted inspection (segregation of duties: verifier != recorder)"
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["SUBMITTED -> VERIFIED; hive posture recomputed; quarantine cascade may fire (hive lifecycle, harvest voids, allocation recompute)"]
  - method: POST
    path: "/api/inspections/{id}/return"
    description: "Return a submitted inspection for correction (segregation of duties)"
    roles: [ApiaryManager]
    code: 200
    input: [return_reason]
    output: Inspection
    side_effects: ["SUBMITTED -> RETURNED"]

  # --- Treatments ---
  - method: POST
    path: "/api/treatments"
    description: "Schedule a mite treatment; half-open window overlap with existing treatments on the hive is rejected"
    roles: [ApiaryManager]
    code: 201
    input: [hive_id, product, start_date, end_date]
    output: Treatment
    side_effects: ["withdrawal_end_date := end_date + 14 days"]
  - method: GET
    path: "/api/treatments/{id}"
    description: "Read a treatment"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Treatment
    side_effects: []
  - method: GET
    path: "/api/treatments"
    description: "List treatments with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["hive_id?", "limit?", "offset?"]
    output: Treatment[]
    side_effects: []
  - method: POST
    path: "/api/treatments/{id}/start"
    description: "Start a scheduled treatment"
    roles: [Beekeeper]
    code: 200
    input: []
    output: Treatment
    side_effects: ["SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/api/treatments/{id}/complete"
    description: "Complete an in-progress treatment"
    roles: [Beekeeper]
    code: 200
    input: []
    output: Treatment
    side_effects: ["IN_PROGRESS -> COMPLETED"]

  # --- Harvests ---
  - method: POST
    path: "/api/harvests"
    description: "Record a honey harvest (RECORDED); net_kg computed immediately"
    roles: [Beekeeper]
    code: 201
    input: [hive_id, collected_on, gross_kg, moisture_pct]
    output: Harvest
    side_effects: ["net_kg computed per calculations.net_harvest_kg"]
  - method: GET
    path: "/api/harvests/{id}"
    description: "Read a harvest"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Harvest
    side_effects: []
  - method: GET
    path: "/api/harvests"
    description: "List harvests with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["hive_id?", "limit?", "offset?"]
    output: Harvest[]
    side_effects: []
  - method: POST
    path: "/api/harvests/{id}/approve"
    description: "Approve a recorded harvest (segregation of duties: approver != recorder)"
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Harvest
    side_effects: ["RECORDED -> APPROVED; HoneyAllocation for (OPEN season, hive) created if absent, else recomputed (projected)"]
  - method: POST
    path: "/api/harvests/{id}/void"
    description: "Void a recorded or approved harvest before finalization"
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Harvest
    side_effects: ["RECORDED/APPROVED -> VOIDED; HoneyAllocation recomputed excluding this harvest"]

  # --- Honey allocations ---
  - method: GET
    path: "/api/allocations/{id}"
    description: "Read an allocation (projected and final variants visible by status)"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: HoneyAllocation
    side_effects: []
  - method: GET
    path: "/api/allocations"
    description: "List allocations with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["season_id?", "hive_id?", "limit?", "offset?"]
    output: HoneyAllocation[]
    side_effects: []
  - method: POST
    path: "/api/allocations/{id}/distribute"
    description: "Distribute a finalized allocation: credit host honey balance and settle harvests"
    roles: [PlatformOps]
    code: 200
    input: []
    output: HoneyAllocation
    side_effects: ["FINALIZED -> DISTRIBUTED; Host.honey_credit_kg += host_kg; APPROVED harvests of (season, hive) -> SETTLED"]

  # --- Swarm events ---
  - method: POST
    path: "/api/swarm-events"
    description: "Host reports a swarm on a site they own"
    roles: [Host]
    code: 201
    input: [site_id, "source_hive_id?"]
    output: SwarmEvent
    side_effects: ["status REPORTED; reported_at := now"]
  - method: GET
    path: "/api/swarm-events/{id}"
    description: "Read a swarm event (lazy expiry applied)"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: SwarmEvent
    side_effects: []
  - method: GET
    path: "/api/swarm-events"
    description: "List swarm events with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["site_id?", "source_hive_id?", "limit?", "offset?"]
    output: SwarmEvent[]
    side_effects: []
  - method: POST
    path: "/api/swarm-events/{id}/dispatch"
    description: "Dispatch the calling beekeeper to a reported swarm"
    roles: [Beekeeper]
    code: 200
    input: []
    output: SwarmEvent
    side_effects: ["REPORTED -> DISPATCHED; assigned_beekeeper_id := X-User-ID"]
  - method: POST
    path: "/api/swarm-events/{id}/capture"
    description: "Capture the swarm: creates a new hive on the site under its ACTIVE agreement"
    roles: [Beekeeper]
    code: 200
    input: []
    output: SwarmEvent
    side_effects: ["DISPATCHED -> CAPTURED; new Hive created (source_swarm_event_id set, posture STABLE); occupancy +1"]
  - method: POST
    path: "/api/swarm-events/{id}/mark-lost"
    description: "Mark a dispatched swarm as lost"
    roles: [Beekeeper]
    code: 200
    input: []
    output: SwarmEvent
    side_effects: ["DISPATCHED -> LOST"]

  # --- Removal jobs ---
  - method: POST
    path: "/api/removal-jobs"
    description: "Host requests removal of a hive"
    roles: [Host]
    code: 201
    input: [hive_id, reason]
    output: RemovalJob
    side_effects: ["status REQUESTED; requested_at := now"]
  - method: GET
    path: "/api/removal-jobs/{id}"
    description: "Read a removal job"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: RemovalJob
    side_effects: []
  - method: GET
    path: "/api/removal-jobs"
    description: "List removal jobs with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["hive_id?", "limit?", "offset?"]
    output: RemovalJob[]
    side_effects: []
  - method: POST
    path: "/api/removal-jobs/{id}/approve"
    description: "Manager decision on a requested removal (decision=APPROVE|REJECT)"
    roles: [ApiaryManager]
    code: 200
    input: [decision, "decision_reason?"]
    output: RemovalJob
    side_effects: ["REQUESTED -> APPROVED or REJECTED"]
  - method: POST
    path: "/api/removal-jobs/{id}/schedule"
    description: "Schedule an approved removal; 48h minimum notice and 2h crew buffer enforced"
    roles: [ApiaryManager]
    code: 200
    input: [scheduled_start, crew_id]
    output: RemovalJob
    side_effects: ["APPROVED -> SCHEDULED"]
  - method: POST
    path: "/api/removal-jobs/{id}/complete"
    description: "Complete a scheduled removal; the hive becomes REMOVED"
    roles: [Beekeeper]
    code: 200
    input: []
    output: RemovalJob
    side_effects: ["SCHEDULED -> COMPLETED; Hive -> REMOVED; occupancy -1"]
  - method: POST
    path: "/api/removal-jobs/{id}/cancel"
    description: "Cancel a non-terminal removal; cooling-off fee rules apply"
    roles: [Host, PlatformOps]
    code: 200
    input: []
    output: RemovalJob
    side_effects: ["REQUESTED/APPROVED/SCHEDULED -> CANCELLED; cancellation_fee_cents computed"]

  # --- Subscriptions ---
  - method: POST
    path: "/api/subscriptions"
    description: "Create a host subscription and issue the first invoice; PREMIUM requires COMPLETED HOST-101"
    roles: [PlatformOps]
    code: 201
    input: [host_id, plan]
    output: Subscription
    side_effects: ["status ACTIVE; monthly_fee_cents pinned by plan; first Invoice issued (carried 0, late 0, credit 0)"]
  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Read a subscription (projected_overwinter_credit_cents computed live)"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["host_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/api/subscriptions/{id}/change-plan"
    description: "Schedule a plan change effective next rollover (OCC-guarded; supersedes pending change)"
    roles: [Host]
    code: 200
    input: [plan, expected_subscription_version]
    output: Subscription
    side_effects: ["pending_plan set; increments Subscription.version by 1"]
  - method: POST
    path: "/api/subscriptions/{id}/cancel"
    description: "Cancel a subscription; requires zero balance"
    roles: [Host]
    code: 200
    input: []
    output: Subscription
    side_effects: ["-> CANCELLED"]

  # --- Invoices ---
  - method: GET
    path: "/api/invoices/{id}"
    description: "Read an invoice"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/api/invoices"
    description: "List invoices with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["subscription_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/pay"
    description: "Pay an OPEN or OVERDUE invoice; cures subscription/host standing when nothing remains unpaid"
    roles: [Host, PlatformOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["OPEN/OVERDUE -> PAID; subscription cure cascade when applicable"]
  - method: POST
    path: "/api/invoices/{id}/void"
    description: "Void an unpaid invoice (ops correction)"
    roles: [PlatformOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["OPEN/OVERDUE -> VOID; excluded from balance_due_cents; cure cascade re-evaluated"]

  # --- Enrollments ---
  - method: POST
    path: "/api/enrollments"
    description: "Enroll a host in an education course; ADV-201 requires COMPLETED HOST-101, QUEEN-301 requires COMPLETED ADV-201"
    roles: [Host]
    code: 201
    input: [host_id, course_code]
    output: Enrollment
    side_effects: ["status ENROLLED"]
  - method: GET
    path: "/api/enrollments/{id}"
    description: "Read an enrollment"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/api/enrollments"
    description: "List enrollments with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["host_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/api/enrollments/{id}/complete"
    description: "Record the quiz result; >= 80 completes, else fails"
    roles: [PlatformOps]
    code: 200
    input: [quiz_score]
    output: Enrollment
    side_effects: ["ENROLLED -> COMPLETED or FAILED"]

  # --- Incidents ---
  - method: POST
    path: "/api/incidents"
    description: "Report a sting/liability incident on a site; SEVERE reports block the site immediately"
    roles: [Host, Beekeeper, ApiaryManager]
    code: 201
    input: [site_id, severity, occurred_at, description]
    output: Incident
    side_effects: ["status REPORTED; host_id copied from site; site CLEAR -> BLOCKED when severity SEVERE or REPORTED count reaches 3"]
  - method: GET
    path: "/api/incidents/{id}"
    description: "Read an incident"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/api/incidents"
    description: "List incidents with filters; sorted created_at ASC"
    roles: [Host, Beekeeper, ApiaryManager, PlatformOps]
    code: 200
    input: ["site_id?", "host_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/api/incidents/{id}/resolve"
    description: "Resolve an incident (outcome=AT_FAULT|NO_FAULT|DISMISSED); AT_FAULT decrements host reputation"
    roles: [ApiaryManager]
    code: 200
    input: [outcome, "liability_cents?"]
    output: Incident
    side_effects: ["REPORTED -> terminal per outcome; reputation adjustment when AT_FAULT"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Host-role caller does not own the target resource" }
  # --- Request / existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range value, duplicate email, or malformed date window" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 400, condition: "Generic invalid lifecycle transition for the target's current state" }
  - { id: ERR_HIVE_NOT_OPERABLE, http: 400, condition: "Hive is DEAD or REMOVED; no harvests, inspections, treatments, or splits allowed" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 400, condition: "Agreement is not ACTIVE (unsigned, terminated, or expired) where an active agreement is required" }
  - { id: ERR_INSPECTION_NOT_SUBMITTED, http: 400, condition: "Verify/return attempted on an inspection not in SUBMITTED" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 400, condition: "Operation requires an ACTIVE subscription" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 400, condition: "Invoice is PAID or VOID" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 400, condition: "Void attempted on a PAID invoice" }
  - { id: ERR_SWARM_NOT_ACTIONABLE, http: 400, condition: "Swarm event not in the required state (including lazily expired after 72h)" }
  - { id: ERR_REMOVAL_NOT_ACTIONABLE, http: 400, condition: "Removal job not in the required state, or another non-terminal job exists for the hive" }
  - { id: ERR_ALLOCATION_NOT_DISTRIBUTABLE, http: 400, condition: "Allocation not FINALIZED (or harvest void attempted after finalization)" }
  - { id: ERR_SEASON_NOT_CLOSABLE, http: 409, condition: "Rollover attempted on a CLOSED season, or genesis season creation when one already exists OPEN" }
  - { id: ERR_ENROLLMENT_NOT_COMPLETABLE, http: 400, condition: "Completion attempted on a terminal enrollment" }
  # --- Safety ---
  - { id: ERR_WAIVER_CURRENT_REQUIRED, http: 400, condition: "Host waiver missing or older than 365 days for a waiver-gated operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Verifier/approver X-User-ID equals the recorder's id" }
  - { id: ERR_HIVE_QUARANTINED, http: 400, condition: "Harvest or split attempted while the hive lifecycle is QUARANTINED" }
  - { id: ERR_WITHDRAWAL_WINDOW_ACTIVE, http: 400, condition: "Harvest collected_on falls inside [start_date, withdrawal_end_date) of an IN_PROGRESS or COMPLETED treatment on the hive" }
  # --- Constraint ---
  - { id: ERR_SITE_BLOCKED, http: 400, condition: "Site is BLOCKED; installs, splits, and captures rejected" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "occupancy == effective_capacity_hives; no further hive may be added" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Closed-interval term overlap with another live agreement on the same site" }
  - { id: ERR_TREATMENT_WINDOW_OVERLAP, http: 409, condition: "Half-open treatment window overlaps an existing treatment on the hive" }
  - { id: ERR_CREW_SCHEDULE_CONFLICT, http: 409, condition: "Crew has another SCHEDULED job with less than the required 2h gap" }
  - { id: ERR_DUPLICATE_SUBSCRIPTION, http: 409, condition: "Host already has a non-CANCELLED subscription" }
  - { id: ERR_COURSE_PREREQUISITE_NOT_MET, http: 400, condition: "ADV-201 requires COMPLETED HOST-101; QUEEN-301 requires COMPLETED ADV-201; PREMIUM plan requires COMPLETED HOST-101" }
  # --- Referential ---
  - { id: ERR_SITE_HAS_OPEN_INCIDENTS, http: 409, condition: "Removal approval blocked: a REPORTED incident exists on the hive's site" }
  - { id: ERR_AGREEMENT_HAS_LIVE_HIVES, http: 409, condition: "Agreement termination blocked: live hives or in-flight removal jobs remain" }
  # --- Temporal ---
  - { id: ERR_INSPECTION_STALE, http: 400, condition: "No VERIFIED inspection with inspected_at within [collected_on - 30 days, collected_on] for a harvest" }
  - { id: ERR_REMOVAL_NOTICE_TOO_SHORT, http: 400, condition: "scheduled_start < now + 48h" }
  # --- Fiscal / standing ---
  - { id: ERR_HOST_NOT_ACTIVE, http: 400, condition: "Host status is not ACTIVE where required" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 400, condition: "Host balance_due_cents > 0 blocks the operation" }
  - { id: ERR_HOST_REPUTATION_TOO_LOW, http: 400, condition: "Host reputation_score < 50 blocks new agreement creation" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as a host"
    identity: opaque
    exclusive_operations:
      - "POST /api/hosts"
    shared_operations: []

  - name: Host
    description: "Backyard owner; signs agreements and waivers, reports swarms and incidents, requests removals, manages own subscription and courses"
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /api/hosts/{id}/sign-waiver"
      - "POST /api/sites"
      - "POST /api/agreements/{id}/sign"
      - "POST /api/agreements/{id}/accept-amendment"
      - "POST /api/agreements/{id}/reject-amendment"
      - "POST /api/swarm-events"
      - "POST /api/removal-jobs"
      - "POST /api/subscriptions/{id}/change-plan"
      - "POST /api/subscriptions/{id}/cancel"
      - "POST /api/enrollments"
    shared_operations:
      - "POST /api/agreements/{id}/terminate (with PlatformOps)"
      - "POST /api/removal-jobs/{id}/cancel (with PlatformOps)"
      - "POST /api/invoices/{id}/pay (with PlatformOps)"
      - "POST /api/incidents (with Beekeeper, ApiaryManager)"
      - "All GET endpoints (with all authenticated roles)"

  - name: Beekeeper
    description: "Field technician; records inspections and harvests, runs treatments, answers swarm calls, completes removals. X-User-ID is an opaque operator id stored on records (recorded_by_id, assigned_beekeeper_id)."
    identity: opaque
    exclusive_operations:
      - "POST /api/inspections"
      - "POST /api/inspections/{id}/submit"
      - "POST /api/treatments/{id}/start"
      - "POST /api/treatments/{id}/complete"
      - "POST /api/harvests"
      - "POST /api/swarm-events/{id}/dispatch"
      - "POST /api/swarm-events/{id}/capture"
      - "POST /api/swarm-events/{id}/mark-lost"
      - "POST /api/removal-jobs/{id}/complete"
    shared_operations:
      - "POST /api/incidents (with Host, ApiaryManager)"
      - "All GET endpoints (with all authenticated roles)"

  - name: ApiaryManager
    description: "Regional manager; verifies inspections (never own-recorded), approves harvests and removals, installs hives, schedules crews, resolves incidents, unblocks sites. X-User-ID is an opaque operator id."
    identity: opaque
    exclusive_operations:
      - "POST /api/hives"
      - "POST /api/hives/{id}/split"
      - "POST /api/hives/{id}/mark-dead"
      - "POST /api/inspections/{id}/verify"
      - "POST /api/inspections/{id}/return"
      - "POST /api/treatments"
      - "POST /api/harvests/{id}/approve"
      - "POST /api/harvests/{id}/void"
      - "POST /api/sites/{id}/unblock"
      - "POST /api/removal-jobs/{id}/approve"
      - "POST /api/removal-jobs/{id}/schedule"
      - "POST /api/incidents/{id}/resolve"
    shared_operations:
      - "POST /api/incidents (with Host, Beekeeper)"
      - "All GET endpoints (with all authenticated roles)"

  - name: PlatformOps
    description: "Platform operator; runs seasons and rollovers, creates agreements and subscriptions, proposes amendments, manages billing corrections, grades courses, distributes allocations, sets the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/seasons"
      - "POST /api/seasons/{id}/rollover"
      - "POST /api/hosts/{id}/suspend"
      - "POST /api/hosts/{id}/reactivate"
      - "POST /api/agreements"
      - "POST /api/agreements/{id}/propose-amendment"
      - "POST /api/subscriptions"
      - "POST /api/invoices/{id}/void"
      - "POST /api/enrollments/{id}/complete"
      - "POST /api/allocations/{id}/distribute"
    shared_operations:
      - "POST /api/agreements/{id}/terminate (with Host)"
      - "POST /api/removal-jobs/{id}/cancel (with Host)"
      - "POST /api/invoices/{id}/pay (with Host)"
      - "All GET endpoints (with all authenticated roles)"
