  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_double_booked_half_open_overlap
        grounds:
          - state_machines.Vehicle.AVAILABLE_to_RESERVED
          - validations[priority=19]
          - entities.Reservation.fields.pickup_at
        distinguishing_aspect: |
          Pairwise half-open overlap on a Vehicle: holding a vehicle whose current active commitment (an
          ON_RENT agreement for R1 [Jul1,Jul5)) overlaps the target reservation R2 [Jul3,Jul8) is rejected
          with ERR_VEHICLE_DOUBLE_BOOKED, checked before the availability check. A shared boundary instant
          (prev.dropoff_at == new.pickup_at) would NOT collide; this instance drives the overlapping case.
        test_recipe:
          setup:
            - "Two ECON vehicles at LAX. veh1 is ON_RENT for reservation R1 [Jul 1 10:00, Jul 5 10:00). R2 [Jul 3 10:00, Jul 8 10:00) is CONFIRMED (capacity allowed by veh2)."
          setup_api_calls:
