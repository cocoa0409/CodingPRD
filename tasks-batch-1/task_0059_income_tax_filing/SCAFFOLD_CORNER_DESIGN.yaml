scaffold_corner_design:
  # -----------------------------------------------------------------
  # Entities
  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: create_taxreturn_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.TaxReturn, endpoints]
        distinguishing_aspect: "POST /tax-returns with required fields returns 201; status defaults to DRAFT, deduction_method defaults to STANDARD, version starts at 1."
        test_recipe:
          setup: ["Taxpayer exists."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce1@x.com", full_name: "CE1", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "TaxReturn.${ret_id}.status == DRAFT"
            - "TaxReturn.${ret_id}.deduction_method == STANDARD"
            - "TaxReturn.${ret_id}.version == 1"

      - name: get_taxreturn_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.TaxReturn, endpoints]
        distinguishing_aspect: "GET /tax-returns/{id} returns the stored return with its taxpayer_id and tax_year matching creation input."
        test_recipe:
          setup: ["Taxpayer + TaxReturn exist."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce2@x.com", full_name: "CE2", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.tax_year == 2025"
            - "TaxReturn.${ret_id}.taxpayer_id == ${tp_id}"

      - name: list_taxreturns_paginated_envelope
        claim_type: Listing
        grounds: [entities.TaxReturn, endpoints]
        distinguishing_aspect: "GET /tax-returns returns a paginated array envelope with total_count and has_more present."
        test_recipe:
          setup: ["Taxpayer + one TaxReturn exist."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce3@x.com", full_name: "CE3", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "GET /tax-returns"
              payload: { taxpayer_id: "${tp_id}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "response_type == array"
            - "meta.total_count >= 1"
            - "has_more == false"

      - name: get_taxreturn_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_RETURN_NOT_FOUND]"]
        distinguishing_aspect: "GET /tax-returns/{id} with a random UUID returns ERR_RETURN_NOT_FOUND (404)."
        test_recipe:
          setup: ["Taxpayer exists."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce4@x.com", full_name: "CE4", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "GET /tax-returns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_taxreturn_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.TaxReturn.fields.tax_year"]
        distinguishing_aspect: "POST /tax-returns omitting required tax_year returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Taxpayer exists."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce5@x.com", full_name: "CE5", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_income_document_negative_amount_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.IncomeDocument.fields.box_amount_cents"]
        distinguishing_aspect: "POST income-document with box_amount_cents < 0 violates the >=0 constraint and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn exist."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce6@x.com", full_name: "CE6", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: -100 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_taxreturn_invalid_enum_filing_status
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.TaxReturn.fields.filing_status"]
        distinguishing_aspect: "POST /tax-returns with filing_status not in the enum set returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Taxpayer exists."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce7@x.com", full_name: "CE7", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "WIDOW_PENGUIN" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: computed_fields_ignored_on_input
        claim_type: Computed Fields
        grounds: [entities.TaxReturn.fields.balance_due_cents]
        distinguishing_aspect: "Computed fields like balance_due_cents are server-derived; the create response shows the default 0, not any client-supplied value (no such input field is accepted)."
        test_recipe:
          setup: ["Taxpayer exists."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce8@x.com", full_name: "CE8", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          assert:
            - "TaxReturn.${ret_id}.balance_due_cents == 0"
            - "TaxReturn.${ret_id}.agi_cents == 0"

      - name: dependent_qualifies_ctc_computed_on_compute
        claim_type: Computed Fields
        grounds: [entities.Dependent.fields.qualifies_ctc, calculations.compute_credit_allowance]
        distinguishing_aspect: "Dependent.qualifies_ctc is computed true when age_years < 17 after compute; a 19-year-old yields qualifies_ctc=false."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn with one W-2 and one dependent age 10."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce9@x.com", full_name: "CE9", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 5000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/dependents"
              payload: { full_name: "Kid", age_years: 10 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "Dependent.${dep_id}.qualifies_ctc == true"

      - name: create_taxreturn_unknown_taxpayer_fk_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_FK_NOT_FOUND]", "entities.TaxReturn.fields.taxpayer_id"]
        distinguishing_aspect: "POST /tax-returns with a taxpayer_id that resolves to nothing returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["A registered taxpayer exists to act, but the body FK points elsewhere."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ce10@x.com", full_name: "CE10", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "11111111-1111-4111-8111-111111111111", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FK_NOT_FOUND"
            - "HTTP status == 404"

  # -----------------------------------------------------------------
  # State Machines
  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: newly_created_return_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.TaxReturn, entities.TaxReturn.fields.status]
        distinguishing_aspect: "A freshly created TaxReturn is in DRAFT (the declared initial_state)."
        test_recipe:
          setup: ["Taxpayer exists."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "sm1@x.com", full_name: "SM1", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          assert:
            - "TaxReturn.${ret_id}.status == DRAFT"

      - name: efile_from_draft_rejected_not_computed
        claim_type: invalid_transition
        grounds: ["validations[priority=11]", "errors[ERR_RETURN_NOT_COMPUTED]"]
        distinguishing_aspect: "Calling efile while the return is still DRAFT (never computed) is rejected with ERR_RETURN_NOT_COMPUTED (409); no EFilingSubmission is created."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn with one W-2, not yet computed."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "sm2@x.com", full_name: "SM2", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v0}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_NOT_COMPUTED"
            - "HTTP status == 409"

      - name: acknowledge_already_accepted_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.EFilingSubmission.TRANSMITTED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Acknowledging an EFilingSubmission already in ACCEPTED (a terminal state) again returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A return computed, e-filed, and ACCEPTED (submission terminal)."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "sm3@x.com", full_name: "SM3", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
          trigger:
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: reopen_draft_return_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.TaxReturn.REJECTED_to_DRAFT", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PATCH with reopen=true on a DRAFT return (not REJECTED) is an undefined reopen transition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "sm4@x.com", full_name: "SM4", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "PATCH /tax-returns/${ret_id}"
              payload: { reopen: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: child_edit_on_ready_return_resets_to_draft
        claim_type: side_effect
        grounds: [state_machines.TaxReturn.READY_to_DRAFT, endpoints]
        distinguishing_aspect: "Adding an IncomeDocument to a READY return resets its status to DRAFT (invalidating the prior compute)."
        test_recipe:
          setup: ["Taxpayer + TaxReturn computed to READY."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "sm5@x.com", full_name: "SM5", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "1099_INT", payer_name: "Bank", box_amount_cents: 50000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { st: $.data.status }
          assert:
            - "TaxReturn.${ret_id}.status == DRAFT"

      - name: amend_file_when_original_already_amended_invalid
        claim_type: invalid_transition
        grounds: ["validations[priority=14]", "errors[ERR_ORIGINAL_NOT_FILED]"]
        distinguishing_aspect: "Creating a second 1040X against a return already in AMENDED returns ERR_ORIGINAL_NOT_FILED (409) because the original is no longer FILED."
        test_recipe:
          setup: ["A return FILED then AMENDED by a first filed 1040X."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "sm6@x.com", full_name: "SM6", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_f1: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 40000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-06-30T00:00:00Z", expected_return_version: "${v_f1}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { amd1: $.data.id }
            - call: "POST /amended-returns/${amd1}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_amended: $.data.version }
          trigger:
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 30000, correction_period_start: "2025-07-01T00:00:00Z", correction_period_end: "2025-12-31T00:00:00Z", expected_return_version: "${v_amended}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORIGINAL_NOT_FILED"
            - "HTTP status == 409"

      - name: efile_accept_drives_return_filed
        claim_type: cross_entity_side_effect
        grounds: [state_machines.TaxReturn.READY_to_FILED, state_machines.EFilingSubmission.TRANSMITTED_to_ACCEPTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / return_filed_requires_efiling_accepted
          rationale: "The ACCEPTED-drives-FILED cross-entity side effect is asserted by the named §1.8 instance."

  # -----------------------------------------------------------------
  # Calculations
  # -----------------------------------------------------------------
  - section: calculations
    instances:
      - name: standard_deduction_married_joint_correct
        claim_type: Correct Result
        grounds: [calculations.compute_return_tax, entities.TaxReturn.fields.taxable_income_cents]
        distinguishing_aspect: "MARRIED_JOINT STANDARD deduction is 3,000,000: wages 8,000,000 yield taxable_income 5,000,000 and tax_before_credits 553,600 = 232,000(10%) + (5,000,000-2,320,000)*12%=321,600."
        test_recipe:
          setup: ["Taxpayer MARRIED_JOINT; TaxReturn MARRIED_JOINT STANDARD; one W-2 wages 8,000,000."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ca1@x.com", full_name: "CA1", filing_status: "MARRIED_JOINT" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "MARRIED_JOINT", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.taxable_income_cents == 5000000"
            - "TaxReturn.${ret_id}.tax_before_credits_cents == 553600"

      - name: capital_gain_positive_added_to_income
        claim_type: Correct Result
        grounds: [calculations.compute_capital_gain, entities.Schedule.fields.net_amount_cents]
        distinguishing_aspect: "A 1099-B with proceeds 5,000,000 cost 2,000,000 yields Schedule D net +3,000,000 added to total_income."
        test_recipe:
          setup: ["Taxpayer SINGLE; W-2 wages 4,000,000; 1099-B proceeds 5,000,000 cost 2,000,000."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "ca2@x.com", full_name: "CA2", filing_status: "SINGLE" }
              as: Taxpayer
