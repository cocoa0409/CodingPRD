          assert:
            - "est_n1 == 111000 (NON_MEMBER branch: round_half_up(120000 * 1.00) = 120000, then round_half_up(120000 * 0.925))"
            - "est_m1 == 67063 (72500 * 1.00 -> 72500, * 0.925 -> 67062.5 -> round_half_up 67063 — the .5 rounding step is observable)"
            - "est_m2 == 60356 (rank1: 72500 * 0.90 = 65250, * 0.925 = 60356.25 -> 60356)"
            - "est_m3 == 53650 (rank2: 72500 * 0.80 = 58000, * 0.925 = 53650)"

      - name: late_fee_pre_fee_snapshot_no_same_run_compounding
        grounds:
          - calculations.late_fee_accrual
          - entities.TuitionInvoice.fields.late_fees_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the late fee raises the balance that
          would feed the fee. The scaffold pins the evaluation order: the fee is
          computed on the PRE-FEE snapshot, appended once per accrual run, and never
          feeds its own base within a run; a second run starts from the post-run balance.
        test_recipe:
