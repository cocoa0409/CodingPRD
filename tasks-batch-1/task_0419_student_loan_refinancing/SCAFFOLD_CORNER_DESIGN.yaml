  # ===========================================================================
  # SECTION 6 — Errors (every error code triggerable; the remaining ones not
  # already covered by validations/state sections above)
  # ===========================================================================
  - section: errors
    instances:
      - name: err_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A protected endpoint (POST /applications/{id}/approve) called with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "Empty DB; the request supplies no auth headers."
          setup_api_calls: []
          trigger:
            - call: "POST /applications/00000000-0000-4000-8000-0000000000dd/approve"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: err_offer_expired_on_lock
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_EXPIRED]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / offer_expiry_half_open_window_on_lock
          rationale: "The half-open offer-expiry window boundary on lock (clock >= expires_at -> ERR_OFFER_EXPIRED) is the named §1.8 instance."

      - name: err_stale_application_version_on_lock
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_APPLICATION_VERSION]
          - concurrency_rules[offer-lock-stale-application]
        distinguishing_aspect: "Locking an Offer with expected_application_version one below the current Application.version returns ERR_STALE_APPLICATION_VERSION (412)."
        test_recipe:
          setup:
            - "A prequalified application (version observed) with two PRESENTED offers; one offer is locked, advancing the application version, then a stale-version lock is attempted on the second offer."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "PRIME", base_apr_bps: 600, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b40@x.com", full_name: "Corner B40", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb40_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb40_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb40_id}"
              captures: { capp40_id: $.data.id, capp40_ver: $.data.version }
            - call: "POST /applications/${capp40_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb40_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp40_id}" }
              as: Borrower
              as_user_id: "${cb40_id}"
              captures: { coffer40a_id: "$.data[0].id", coffer40b_id: "$.data[1].id" }
            - call: "POST /offers/${coffer40a_id}/lock"
              payload: { expected_application_version: "${capp40_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb40_id}"
          trigger:
            - call: "POST /offers/${coffer40b_id}/lock"
              payload: { expected_application_version: "${capp40_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb40_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_APPLICATION_VERSION (the observed version is now stale after the first lock)"
            - "HTTP status == 412"

