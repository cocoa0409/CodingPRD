        claim_type: precondition_enforcement
        grounds: [state_machines.PropertyManager.ACTIVE_to_TERMINATED, "errors[ERR_MANAGER_IN_USE]"]
        distinguishing_aspect: "terminate=true on a manager still referenced by an OWNED asset fails; plain suspend (no terminate) succeeds."
        test_recipe:
