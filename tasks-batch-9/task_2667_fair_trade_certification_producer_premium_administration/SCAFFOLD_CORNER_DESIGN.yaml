            - "TradeTransaction.${t1_id}.premium_cents == 123457, round_half_up of 123456.7 at the organic-uplifted rate of 100 cents per kg"
            - "TradeTransaction.${t1_id}.premium_volume_kg == 1234.567 and premium_basis == PHYSICAL_TRACEABILITY"
            - "SupplyChainNode.${sell_node_id}.reserved_output_kg == 1234.567 and available_credit_kg == 48765.433, both carrying 3 decimals"

