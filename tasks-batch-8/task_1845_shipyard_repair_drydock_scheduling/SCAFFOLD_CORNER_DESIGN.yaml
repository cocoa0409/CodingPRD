      - name: oversized_vessel_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_VESSEL_EXCEEDS_DOCK_LIMITS]"]
        distinguishing_aspect: "Violation side of the fit rule: length 231.0m against a 230.0m dock fails with ERR_VESSEL_EXCEEDS_DOCK_LIMITS (the boundary instance in §1.8 covered the inclusive pass side)."
        test_recipe:
