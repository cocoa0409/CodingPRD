            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", priority_tier: "A" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /studio/samples"
