              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { pact_id: $.data.id, pact_v1: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a1_id}", committed_units: 4, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v1}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c1_id: $.data.id }
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
