      - name: clock_endpoint_default_reads_2026_08_01_before_any_set_call
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /_clock/set_current_utc"
          - validations[priority=50]
          - errors[ERR_SECURITY_CREDENTIAL_EXPIRED]
        distinguishing_aspect: |
          With no clock call ever made, the logical clock reads exactly 2026-08-01T00:00:00Z and
          MUST NOT fall back to wall-clock time: a verify carrying credential_expires_at
          2026-07-31T23:59:59Z is refused as expired while 2026-08-01T00:00:01Z is accepted, and a
          later explicit set call echoes the same default value back.
        test_recipe:
          setup:
            - "Empty database and NO call to POST /_clock/set_current_utc at any point in the setup"
            - "Shop 'Bay Auto' with two UNVERIFIED technicians"
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
