      - name: segregation_of_duties_outranks_the_state_check_on_referral_close
        claim_type: priority_ordering
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A close attempted by the requesting clinician on an OPEN referral violates both rung 13 (business_safety) and rung 17 (state) and returns ERR_SEGREGATION_OF_DUTIES; the same close attempted by a care coordinator violates only the state rung and returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE enrollment."
            - "One clinician-raised Referral still in status OPEN."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
