              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs12_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs12_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m12_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m12_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m12_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${cell_m_id}", population_households: 120000, population_persons: 300000 }], expected_market_version: "${m12_v_before_universe}" }
              as: MethodologyStatistician
              captures: { ue12_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue12_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
