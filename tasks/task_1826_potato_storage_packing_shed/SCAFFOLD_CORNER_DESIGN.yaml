        test_recipe:
          setup: ["grower with one BINNED lot (no assessment); ACTIVE contracts C1 100@2000 and C2 300@4000; C3 1000@9999 with window ending 2026-08-10 auto-SHORTFALLED by clock advance before settlement creation"]
