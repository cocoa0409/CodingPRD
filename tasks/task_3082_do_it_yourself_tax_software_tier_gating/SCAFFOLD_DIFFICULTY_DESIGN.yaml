            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: 1000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/accounts/${acct_id}/suspend"
