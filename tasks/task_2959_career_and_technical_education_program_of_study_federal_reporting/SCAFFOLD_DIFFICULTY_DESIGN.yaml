      - name: accept_improvement_plan_cascades_monitoring_reinstatement_and_expenditure_unblock
        grounds:
          - state_machines.ImprovementPlan.SUBMITTED_to_ACCEPTED
          - state_machines.PerformanceIndicator.IMPROVEMENT_REQUIRED_to_MONITORING
          - state_machines.ProgramOfStudy.SUSPENDED_to_CHANGES_REQUESTED
          - state_machines.Expenditure.BLOCKED_to_REQUESTED
          - entities.ImprovementPlan.fields.accepted_at
        distinguishing_aspect: |
          This instance is the UPWARD four-link chain that compensates the downward one: accepting the plan resets
          consecutive_miss_count to 0 and moves the indicator IMPROVEMENT_REQUIRED -> MONITORING (not back to NOT_MET),
          un-suspends the program into CHANGES_REQUESTED (not back to STATE_APPROVED), and returns the BLOCKED
          Expenditure to REQUESTED — so each link lands on a different state than the one the downward chain left.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "The exact end state of close_reporting_year_cascades_miss_count_to_program_suspension_and_expenditure_block: PerformanceIndicator in IMPROVEMENT_REQUIRED with consecutive_miss_count 2, ProgramOfStudy in SUSPENDED, one Expenditure in BLOCKED."
            - "One ImprovementPlan on that indicator in status SUBMITTED with three milestones and revision_round 0."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "47.0303", title: "Industrial Maintenance", cluster: "ADVANCED_MANUFACTURING", labor_market_data_asof: "2026-03-01" }
