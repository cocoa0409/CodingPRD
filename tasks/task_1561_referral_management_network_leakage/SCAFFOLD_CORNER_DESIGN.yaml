  - section: rbac
    instances:
      - name: role_denial_matrix
        claim_type: role_permission
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Each role is denied another role's exclusive operation with ERR_UNAUTHORIZED_ROLE (403): provider cannot accept, specialist cannot mark-no-show, auditor cannot create referrals, admin cannot triage, coordinator cannot verify closures."
        test_recipe:
          setup: ["full bootstrap; one referral in PENDING_TRIAGE and a second one carried to PENDING_VERIFICATION (for the coordinator-cannot-verify probe)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
