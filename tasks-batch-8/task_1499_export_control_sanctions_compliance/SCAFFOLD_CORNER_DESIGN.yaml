              payload: { legal_name: "Vulcan Industries SA", country_code: "ESP", city: "Bilbao", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "ESP", end_use: "CIVILIAN", quantity: 4 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
