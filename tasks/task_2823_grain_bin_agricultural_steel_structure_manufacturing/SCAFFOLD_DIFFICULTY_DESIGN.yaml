              captures: { committed0: $.data.credit_committed_cents, available0: $.data.credit_available_cents }
          trigger:
            - call: "POST /dealer-orders/${o2_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o2_prod: $.data.production_status, o2_fin: $.data.financial_status, o2_hold_after: $.data.credit_hold_cents }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { committed1: $.data.credit_committed_cents, available1: $.data.credit_available_cents, dlr_status1: $.data.status }
            - call: "POST /dealer-orders/${o4_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o4_prod: $.data.production_status, o4_hold_after: $.data.credit_hold_cents }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { committed2: $.data.credit_committed_cents, available2: $.data.credit_available_cents }
            - call: "POST /dealer-orders/${o2_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { err_double_cancel: $.data.error_id }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { committed3: $.data.credit_committed_cents, available3: $.data.credit_available_cents }
          assert:
            - "checkpoint 0 (before the trigger): every order reports credit_hold_cents == 1999734, and Dealer.${dlr_a_id}.credit_committed_cents == 5999202 with credit_available_cents == 894000798 - three confirmed orders, not four"
            - "checkpoint 0: DealerOrder.${o4_id}.production_status == DRAFT with credit_hold_cents == 1999734 - priced but not committed, so 4 x 1999734 == 7998936 is the wrong committed figure"
            - "checkpoint 1 (cancel of the confirmed O2): DealerOrder.${o2_id}.production_status == CANCELLED, financial_status == VOIDED and credit_hold_cents == 0"
            - "checkpoint 1: Dealer.${dlr_a_id}.credit_committed_cents == 3999468 and credit_available_cents == 896000532; the sum over the surviving QUEUED rows O1 and O3 is exactly 3999468, so the zeroing and the re-derivation agree - no double release"
            - "checkpoint 1: Dealer.${dlr_a_id}.status == ACTIVE throughout; the generous limit keeps this instance about conservation and not about the CREDIT_HOLD cascade"
            - "checkpoint 2 (cancel of the DRAFT O4): DealerOrder.${o4_id}.production_status == CANCELLED with credit_hold_cents == 0, and Dealer.${dlr_a_id}.credit_committed_cents is UNCHANGED at 3999468 with credit_available_cents 896000532 - compensating a never-committed hold moves the ledger by exactly 0"
            - "the second cancel of DealerOrder.${o2_id} returns HTTP 409 with error_id ERR_ORDER_STATE_INVALID"
            - "checkpoint 3: Dealer.${dlr_a_id}.credit_committed_cents is still 3999468 and credit_available_cents still 896000532 - a rejected repeat compensation releases nothing a second time, so credit_available_cents never exceeds credit_limit_cents"
            - "at every checkpoint credit_limit_cents == credit_committed_cents + credit_available_cents holds exactly, with 900000000 == 5999202 + 894000798 at checkpoint 0 and 900000000 == 3999468 + 896000532 afterwards"
            - "DealerOrder.${o1_id} and DealerOrder.${o3_id} keep credit_hold_cents == 1999734 and production_status QUEUED - the compensation touched only the cancelled rows"
