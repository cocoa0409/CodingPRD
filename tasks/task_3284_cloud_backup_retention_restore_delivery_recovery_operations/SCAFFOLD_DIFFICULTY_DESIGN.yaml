  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: retention_cooling_off_window_blocks_early_apply
        grounds:
          - state_machines.RetentionChangeRequest.COOLING_OFF_to_APPLIED
          - errors.ERR_COOLING_OFF_ACTIVE
          - entities.RetentionChangeRequest.fields.cooling_off_until_utc
          - calculations.effective_retention_days
        distinguishing_aspect: "The cooling-off interval is half-open at its end bound: applying at exactly cooling_off_until_utc - 1 second is refused with ERR_COOLING_OFF_ACTIVE, while applying at exactly cooling_off_until_utc succeeds — the clock reaching the boundary is enough."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account whose group policy sets min_retention_days 10 and max_extended_history_days 800."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - *grp_p
            - *pol_p
            - call: "GET /backup-provider/backup-groups/${grp_p_id}"
              payload: {}
              as: RetentionOfficer
              captures: { grp_v_c: $.data.version }
            - call: "POST /backup-provider/retention-change-requests"
              payload: { account_id: "${acct_p_id}", group_id: "${grp_p_id}", requested_retention_days: 120, reason_code: "DOWNGRADE", expected_group_version: "${grp_v_c}" }
