  - rule_id: compensating_invariant
    instances:
      - name: assign_supersede_then_cancel_restores_contract_accrual_ledger
        grounds:
          - state_machines.BypassCase.STAFFED_to_CANCELLED
          - state_machines.BypassCase.SCHEDULED_to_STAFFED
          - calculations.case_fee_settlement
          - entities.HospitalContract.fields.accrued_case_fee_cents
          - entities.HospitalContract.fields.accrued_case_count
          - entities.BypassCase.fields.accrued_fee_cents
          - concurrency_rules[rule_id=case-staffing-supersede]
        distinguishing_aspect: |
          The invariant is the money ledger: contract.accrued_case_fee_cents must always equal the
          sum of accrued_fee_cents over its own accrued cases, and accrued_case_count must equal how
          many those are. The forward path deliberately touches it three times - accrue, supersede
          (withdraw then re-add while the count stays fixed) and cancel (full withdrawal) - and the
          test pins an unrelated sibling case's accrual throughout, so a naive implementation that
          recomputes the contract total by zeroing or that decrements the count on a supersede is
          caught. Compensation must land on the exact pre-case value, not merely near it.
        test_recipe:
          setup:
            - "Shared fixture: contract c1 (per_case_fee_cents 400000, monthly_case_cap 5), surgeon s1 with an ACTIVE CABG card, chief, p1 (career 150, CCP requirement 45, SUBMITTED 20-hour CE claim) and p2 (career 90, CCP requirement 45, SUBMITTED 30-hour CE claim)."
            - "p1 holds a PRIMARY_CALL slot [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z) and p2 a BACKUP_CALL slot [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z), so c1 is COVERED."
            - "Two ELECTIVE cases with disjoint windows: case1 [2026-08-02T06:00:00Z, 12:00:00Z) and case2 [2026-08-03T06:00:00Z, 12:00:00Z). case2 is staffed with p1 up front and is never touched again - it is the control accrual."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
