      - name: the_submitter_of_a_package_may_not_review_it_but_any_other_manager_may
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_12
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.DocumentationPackage.SUBMITTED_to_APPROVED
          - roles.QualityManager
          - roles.ProcessTechnician
          - calculations.documentation_completeness
        distinguishing_aspect: |
          Submitting is shared between QualityManager and ProcessTechnician while reviewing is
          QualityManager-exclusive, so the SoD pair is submitter versus reviewer, not role versus role:
          qm-001 cannot review the package qm-001 submitted (403, and the package stays SUBMITTED so a
          second manager can still act), whereas a package submitted by the technician pt-001 is
          reviewable by qm-001. The REJECTED loop and the APPROVED decision are both exercised through
          that lens.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Two KITTED assemblies AS-2540-1 and AS-2540-2 on the same design, each with no components at all, so neither a coating run nor a licence nor a waiver adds a required document."
            - "required_document_types is therefore exactly the three BASE_DOCUMENT_TYPES for both packages: CERTIFICATE_OF_CONFORMANCE, INTERFEROGRAM_REPORT, MELT_CERTIFICATE."
            - "Package p1 (for AS-2540-1) holds all three documents and was submitted by qm-001; package p2 (for AS-2540-2) holds all three and was submitted by ProcessTechnician pt-001."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-1" }
              as: ProcessTechnician
              captures: { a1: $.data.id, a1v: $.data.version }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-2" }
              as: ProcessTechnician
              captures: { a2: $.data.id, a2v: $.data.version }
            - call: "POST /optics/documentation-packages"
