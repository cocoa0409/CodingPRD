      - name: corner_fmv_uses_a_single_half_up_rounding_after_the_full_product
        claim_type: precision
        grounds:
          - calculations.vehicle_fmv_estimate
          - entities.Vehicle.fields.fmv_estimate_cents
        distinguishing_aspect: "For base 123457 with condition FAIR (0.65) and odometer 100000 (0.85) the exact product is 68209.9925, which rounds half-up once to 68210; rounding to whole cents after the condition factor first (80247 x 0.85 = 68209.95 -> 68210) versus after the odometer factor (104938 x 0.65 = 68209.7 -> 68210) can drift, so the single-rounding rule is pinned and observable."
        test_recipe:
          setup:
            - "donation dpr is PENDING_REVIEW with declared_condition EXCELLENT"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Precision Trust", ein: "80-0000025", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
