          period's certified totals and rebate accrual. Different trigger and
          different propagation path than the vendor-suspension cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN"
            - "T1 RECYCLING net 2000 VALIDATED (no contamination_pct -> estimate 10000c); T2 LANDFILL net 1000 VALIDATED"
            - "Before: certified 3000/2000 -> 66.67; rebate_estimate_cents == 10000"
