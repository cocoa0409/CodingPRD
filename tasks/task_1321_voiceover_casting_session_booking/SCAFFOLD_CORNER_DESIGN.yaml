      - name: invoice_issue_from_pending_to_issued
        claim_type: valid_transition
        grounds: [state_machines.Invoice.PENDING_to_ISSUED]
        distinguishing_aspect: "POST /invoices/{id}/issue transitions PENDING → ISSUED and sets issued_at"
