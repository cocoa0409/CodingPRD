            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - *k_planA
            - *k_ctlA
            - *k_planAsub
            - *k_planAtech
            - *k_planApcc
            - *k_planAapp
            - *k_clock_2701
            - *k_ctlA_pass1
            - *k_me_g1a
            - *k_me_g1b
            - *k_me_g1c
            - *k_me_g1d
            - *k_clock_2706
            - *k_res_g1a
            - *k_res_g1b
            - *k_res_g1c
          trigger:
            - &k_decom_fail
              call: "POST /site-controls/${ctlA_id}/decommission"
              payload: { decommission_note: "Slab depressurisation no longer required." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { decom_err: $.data.error_id }
            - *k_res_g1d
            - &k_decom_ok
              call: "POST /site-controls/${ctlA_id}/decommission"
              payload: { decommission_note: "Slab depressurisation no longer required." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "before the trigger: CleanupGoal.${g1_id}.compliant_streak == 3 and attainment_status == NOT_ATTAINED, SiteControl.${ctlA_id}.status == OPERATING"
            - "the first decommission returns HTTP 422 with error_id == 'ERR_CONTROL_STILL_REQUIRED'"
            - "after the refusal: SiteControl.${ctlA_id}.status == OPERATING (unchanged)"
            - "the fourth result moves CleanupGoal.${g1_id}.compliant_streak to 4 and attainment_status to ATTAINED"
            - "the second, byte-identical decommission succeeds: SiteControl.${ctlA_id}.status == DECOMMISSIONED"
            - "CleanupGoal.${g2_id}.attainment_status == NOT_ATTAINED throughout, and it never gated the decommission because its basis is UNRESTRICTED with no control_credit_type"
            - "Site.${site_id}.impaired_control_count == 0 and cleanup_posture == OPEN (DECOMMISSIONED is not an impairment)"

  # ===========================================================================
  # Rule 8 — Resource/temporal overlap on two different resource entities with
  #          two different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: engineering_control_coverage_buffer_rejects_thirty_day_gap
        grounds:
          - validations[27].ERR_CONTROL_COVERAGE_CONFLICT
          - entities.SiteControl.fields.coverage_from
          - entities.SiteControl.fields.coverage_to
          - entities.SiteControl.fields.control_class
          - endpoints[POST /site-controls]
        distinguishing_aspect: |
          Resource entity = SiteControl coverage on (site_id, sub_area_code).
          Interval semantics = CLOSED INCLUSIVE intervals widened by a symmetric
          30-day changeover buffer, so non-overlapping coverage still conflicts:
          against an existing 2027-01-01..2027-06-30 engineering control, a new
          window starting 2027-07-01 (a 1-day gap) and one starting 2027-07-30
          (exactly 30 days) are both refused, and 2027-07-31 is the first
          accepted start. The class exemption is part of the semantics: an
          INSTITUTIONAL control may fully overlap the same sub-area.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment; clock 2026-12-10."
            - "One DRAFT plan with the six pinned cost lines to host the controls."
            - "One ENGINEERING control (VAPOR_MITIGATION, control_class ENGINEERING) on sub_area_code BLDG-B-SLAB covering 2027-01-01..2027-06-30."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - *k_planD
            - &k_ctl_b1
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${planD_id}"
                control_type: VAPOR_MITIGATION
                sub_area_code: "BLDG-B-SLAB"
                coverage_from: "2027-01-01"
                coverage_to: "2027-06-30"
                inspection_interval_days: 90
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { ctl_b1_id: $.data.id }
          trigger:
            - &k_ctl_b2
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${planD_id}"
                control_type: VAPOR_MITIGATION
                sub_area_code: "BLDG-B-SLAB"
                coverage_from: "2027-07-01"
                coverage_to: "2027-12-31"
                inspection_interval_days: 90
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { b2_err: $.data.error_id }
            - &k_ctl_b3
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${planD_id}"
                control_type: VAPOR_MITIGATION
                sub_area_code: "BLDG-B-SLAB"
                coverage_from: "2027-07-30"
                coverage_to: "2027-12-31"
                inspection_interval_days: 90
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { b3_err: $.data.error_id }
            - &k_ctl_b4
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${planD_id}"
                control_type: VAPOR_MITIGATION
                sub_area_code: "BLDG-B-SLAB"
                coverage_from: "2027-07-31"
                coverage_to: "2027-12-31"
                inspection_interval_days: 90
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { ctl_b4_id: $.data.id }
            - &k_ctl_b5
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${planD_id}"
                control_type: DEED_RESTRICTION
                sub_area_code: "BLDG-B-SLAB"
                coverage_from: "2027-01-01"
                coverage_to: "2027-12-31"
                inspection_interval_days: 365
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { ctl_b5_id: $.data.id }
          assert:
            - "SiteControl.${ctl_b1_id}.control_class == ENGINEERING"
            - "the 2027-07-01 create returns HTTP 409 with error_id == 'ERR_CONTROL_COVERAGE_CONFLICT' even though the intervals do not overlap"
            - "the 2027-07-30 create returns HTTP 409 with error_id == 'ERR_CONTROL_COVERAGE_CONFLICT' (exactly at the 30-day buffer edge)"
            - "the 2027-07-31 create succeeds: SiteControl.${ctl_b4_id}.status == PROPOSED with coverage_from == '2027-07-31' (a 31-day gap is the first accepted separation)"
            - "the DEED_RESTRICTION create succeeds with SiteControl.${ctl_b5_id}.control_class == INSTITUTIONAL, coverage_from == '2027-01-01' and coverage_to == '2027-12-31', fully overlapping the engineering control on the same sub_area_code"
            - "GET /site-controls?site_id=${site_id}&sub_area_code=BLDG-B-SLAB returns exactly 3 rows (${ctl_b1_id}, ${ctl_b4_id}, ${ctl_b5_id}) with total_count 3"

      - name: laboratory_half_open_window_capacity_counts_touching_as_free
        grounds:
          - validations[28].ERR_LAB_CAPACITY_EXCEEDED
          - entities.Laboratory.fields.concurrent_capacity
          - entities.MonitoringEvent.fields.window_start
          - entities.MonitoringEvent.fields.window_end
          - endpoints[POST /monitoring-events]
        distinguishing_aspect: |
          Resource entity = Laboratory analysis slots. Interval semantics =
          HALF-OPEN [window_start, window_end) with an AGGREGATE capacity test,
          the opposite convention to the closed-inclusive buffered coverage rule:
          here a window that starts exactly where another ends does NOT conflict,
          and no single reservation is illegal — only the count of intersecting
          reservations against concurrent_capacity 2 is. The count is also scoped
