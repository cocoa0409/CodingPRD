# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Custom Apparel & Embroidery / Screen-Print Shop — EXPERT band.
# 9 Difficulty Rules x >= 2 instances each = 18 instances.
# Every setup_api_calls chain drives empty-DB -> setup state using only §1.5
# endpoints; every ${var} is bound by an earlier captures: line.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_price_estimate_vs_final_on_order_domain
        grounds:
          - calculations.order_price
          - calculations.order_price.variants.ESTIMATE
          - calculations.order_price.variants.FINAL
          - entities.Quote.fields.grand_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: "On the Order domain, ESTIMATE prices blanks on ordered line_qty (72 -> 25200c) while FINAL prices blanks on consumed units (good 72 + spoiled 2 = 74 -> 25900c), so Quote.grand_total_cents (119400) != Order.final_total_cents (120100)."
        test_recipe:
          setup:
            - "Shop with defaults (spoilage_pct 0.05, rush_threshold_days 7); clock 2026-06-01T00:00:00.000Z."
            - "GarmentStyle blank_cost_cents 350, colors [BLACK], sizes [L]; BlankSku BLACK/L total_stock 200."
            - "SCREEN_PRINT method (screen_fee 2500, extra_color_run 75)."
            - "Order (NOT rush: ship 2026-06-20) with one line size_run {L:72}, num_colors 3, num_locations 2; proof approved; order CONFIRMED; run started then completed with good_units 72 (spoiled 2)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { shop_id: "${shop_id}", to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol", screen_fee_cents: 2500, extra_color_run_cents: 75 }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 2, num_colors: 3, size_run: { L: 72 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front logo", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "POST /presses"
              payload: { shop_id: "${shop_id}", name: "P1" }
              as: ShopManager
              captures: { press_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z" }
              as: ShopManager
              captures: { run_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs/${run_id}/start"
              payload: {}
              as: ShopManager
            - call: "POST /orders/${order_id}/production-runs/${run_id}/complete"
              payload: { good_units: 72, spoiled_units: 2 }
              as: ShopManager
          trigger:
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: ShopManager
              captures: { final_total: $.data.final_total_cents }
            - call: "GET /orders/${order_id}/quote"
              payload: {}
              as: ShopManager
          assert:
            - "Quote.grand_total_cents == 119400 (blank 25200 + setup 15000 + decoration 79200 + rush 0)"
            - "Order.final_total_cents == 120100 (consumed blanks 74*350=25900 + setup 15000 + decoration 79200)"
            - "Quote.grand_total_cents != Order.final_total_cents"

      - name: blank_cost_reserved_vs_consumed_on_blanksku_domain
        grounds:
          - calculations.blank_consumption_cost
          - calculations.blank_consumption_cost.variants.RESERVED
          - calculations.blank_consumption_cost.variants.CONSUMED
          - entities.BlankReservation.fields.reserved_qty
          - entities.ProductionRun.fields.good_units
        distinguishing_aspect: "On the BlankSku/BlankReservation domain (distinct from order_price's Order domain), RESERVED counts reserved_qty 76 (ordered 72 + allowance 4) while CONSUMED counts good 72 + spoiled 2 = 74; the 2 unused allowance units are returned, so the reservation status becomes CONSUMED and the BlankSku on_hand returns to 200 - 74 = 126 with reserved_qty 0."
        test_recipe:
          setup:
            - "Same shop/style/sku/method as above; one line {L:72}; order CONFIRMED creating one BlankReservation ordered_qty 72, allowance 4, reserved_qty 76 (BlankSku on_hand 200->124)."
            - "Run started (blanks_pulled 76) then completed with good_units 72, spoiled_units 2."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 2, num_colors: 3, size_run: { L: 72 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "GET /orders/${order_id}/reservations"
              payload: {}
              as: ShopManager
              captures: { res_id: "$.data[0].id" }
            - call: "POST /presses"
              payload: { shop_id: "${shop_id}", name: "P1" }
              as: ShopManager
              captures: { press_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z" }
              as: ShopManager
              captures: { run_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs/${run_id}/start"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /orders/${order_id}/production-runs/${run_id}/complete"
              payload: { good_units: 72, spoiled_units: 2 }
              as: ShopManager
              captures: { consumed: $.data.consumed_units, released: $.data.released_units }
          assert:
            - "ProductionRun.blanks_pulled == 76, consumed_units == 74 (good 72 + spoiled 2), released_units == 2"
            - "BlankReservation.${res_id}.status == CONSUMED (order produced; leftover 2 returned)"
            - "BlankSku.${sku_id}.on_hand_qty == 126 (200 - 76 pulled + 2 released)"
            - "BlankSku.${sku_id}.reserved_qty == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: decoration_run_cost_tier_color_location_mode_a
        grounds:
          - calculations.decoration_run_cost
          - entities.OrderLine.fields.line_qty
          - entities.DecorationMethod.fields.extra_color_run_cents
          - entities.Quote.fields.decoration_subtotal_cents
        distinguishing_aspect: "Mode (a): per_unit_line = (tier_rate(line_qty=72)=400 + (num_colors 3 - 1)*75) * num_locations 2 = 550*2 = 1100; three inputs (line_qty tier, num_colors, num_locations) interact non-linearly so decoration_subtotal = 1100*72 = 79200."
        test_recipe:
          setup:
            - "Shop defaults; SCREEN_PRINT method (extra_color_run 75); style blank 350 colors [BLACK] sizes [L]; sku stock 200."
            - "Order with one line {L:72}, num_colors 3, num_locations 2; proof approved; order CONFIRMED."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol", extra_color_run_cents: 75 }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 2, num_colors: 3, size_run: { L: 72 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "GET /orders/${order_id}/quote"
              payload: {}
              as: ShopManager
          assert:
            - "Quote.decoration_subtotal_cents == 79200"
            - "Quote.setup_subtotal_cents == 15000 (num_colors 3 * num_locations 2 * screen_fee 2500)"

      - name: decoration_subtotal_round_per_line_then_sum_mode_b
        grounds:
          - calculations.decoration_subtotal
          - calculations.decoration_run_cost
          - entities.Quote.fields.decoration_subtotal_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned 'round each line's per-unit run cost into integer cents, multiply by line_qty, THEN sum lines'; with two screen-print lines line A {L:30} 1-color/1-loc (rate 550, 550*30=16500) and line B {L:50} 2-color/1-loc ((550+75)*50=31250) the per-line-then-sum total is 16500+31250=47750."
        test_recipe:
          setup:
            - "Shop defaults; SCREEN_PRINT method; style blank 350 colors [BLACK] sizes [L]; sku stock 300."
            - "Order with TWO lines: A {L:30} num_colors 1 num_locations 1; B {L:50} num_colors 2 num_locations 1; proof approved; order CONFIRMED."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol", extra_color_run_cents: 75 }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 300 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 1, size_run: { L: 30 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 2, size_run: { L: 50 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "GET /orders/${order_id}/quote"
              payload: {}
              as: ShopManager
          assert:
            - "Quote.decoration_subtotal_cents == 47750 (line A 550*30=16500 + line B 625*50=31250)"
            - "Quote.setup_subtotal_cents == 7500 (line A 1*1*2500 + line B 2*1*2500)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: artproof_revision_loop_cyclic
        grounds:
          - state_machines.ArtProof.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.ArtProof.CHANGES_REQUESTED_to_SUBMITTED
          - entities.ArtProof.fields.revision_round
        distinguishing_aspect: "ArtProof is cyclic: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED returns to a prior state and the resubmit edge increments revision_round to 1, proving a non-linear loop on the ArtProof entity."
        test_recipe:
          setup:
            - "Shop; customer; order DRAFT with a DRAFT proof submitted (round 0)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
              captures: { round_after: $.data.revision_round, status_after: $.data.status }
          assert:
            - "ArtProof.${proof_id}.status == SUBMITTED (looped back from CHANGES_REQUESTED)"
            - "ArtProof.${proof_id}.revision_round == 1"

      - name: order_parallel_fulfillment_and_billing_dimensions
        grounds:
          - state_machines.Order.CONFIRMED_to_IN_PRODUCTION
          - state_machines.Order.UNBILLED_to_INVOICED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.billing_status
        distinguishing_aspect: "Order carries two independent state axes: fulfillment_status advances DRAFT->CONFIRMED->IN_PRODUCTION->FULFILLED while billing_status stays UNBILLED throughout, only moving to INVOICED after FULFILLED — two dimensions evolve independently on the same Order entity (distinct from the ArtProof cycle)."
        test_recipe:
          setup:
            - "Shop/style/sku/method; order with line {L:72} approved and CONFIRMED; press created; run scheduled+started+completed good 72 -> Order FULFILLED; billing still UNBILLED."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 2, num_colors: 3, size_run: { L: 72 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "POST /presses"
              payload: { shop_id: "${shop_id}", name: "P1" }
              as: ShopManager
              captures: { press_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z" }
              as: ShopManager
              captures: { run_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs/${run_id}/start"
              payload: {}
              as: ShopManager
            - call: "POST /orders/${order_id}/production-runs/${run_id}/complete"
              payload: { good_units: 72, spoiled_units: 0 }
              as: ShopManager
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: ShopManager
              captures: { ff: $.data.fulfillment_status, bill: $.data.billing_status }
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: ShopManager
          assert:
            - "Before invoice: Order.fulfillment_status == FULFILLED while Order.billing_status == UNBILLED (axes independent)"
            - "After invoice: Order.billing_status == INVOICED while Order.fulfillment_status remains FULFILLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_fulfill_release_stock_depth3
        grounds:
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - state_machines.Order.IN_PRODUCTION_to_FULFILLED
          - entities.BlankReservation.fields.status
          - entities.BlankSku.fields.on_hand_qty
        distinguishing_aspect: "Depth-3 cascade from ProductionRun.complete: completing the run (A) mutates Order to FULFILLED (B); that Order transition (B) mutates each ACTIVE BlankReservation to CONSUMED (C); the reservation transition (C) mutates BlankSku reserved_qty/on_hand (D). Each link is caused by the previous, not by the original complete call."
        test_recipe:
          setup:
            - "Order with line {L:50} (ordered 50, allowance 3, reserved 53) approved+CONFIRMED; BlankSku stock 200 -> on_hand 147 reserved 53; run started (blanks_pulled 53)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
