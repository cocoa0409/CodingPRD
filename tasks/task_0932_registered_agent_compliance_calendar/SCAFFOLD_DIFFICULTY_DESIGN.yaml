  - rule_id: resource_temporal_overlap
    instances:
      - name: registration_occupancy_interval_is_half_open_per_state
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_REGISTRATION]
          - entities.Registration.fields.qualified_on
          - entities.Registration.fields.closed_on
          - state_machines.Registration.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          A Registration occupies the half-open interval [qualified_on, closed_on) on
          the resource (legal_entity_id, state_code): a second TX qualification while
          the first is ACTIVE is rejected, but a third qualification starting exactly
          on the withdrawn row's closed_on is accepted because adjacency at the closing
          boundary is not overlap. The resource is Registration and the semantics are
