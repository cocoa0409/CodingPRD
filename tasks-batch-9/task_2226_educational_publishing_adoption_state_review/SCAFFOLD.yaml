scenario: |
  2226. Educational Publishing Adoption & State Review (kindergarten through twelfth grade publisher): state adoption cycle calendar with subject rotation and submission requirements by state, correlation documentation mapping content to state standards with evidence citations, review committee presentation, sampling requirements and public comment response, content editing for state-specific requirements including required topics and prohibited content, pricing submission with contract terms, ancillary bundling and multi-year commitments, sales representation to districts within adopted lists and open territory states, digital platform provisioning with rostering, accessibility and data privacy commitments, revision cycle planning against adoption calendars and inventory management of print editions

domain_name: "adoption-review-press"
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus          # above the §0.4 Expert band: 14 entities, 57 endpoints, 8 state machines, 7 calculations
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: flat
  # flat: StateProfile, AdoptionCycle, Title, ContentEdit, Submission, CommitteePanel,
  # PresentationSlot, PricingProposal and DistrictOrder are peer top-level collections
  # linked by foreign keys in request bodies; only genuinely owned collections
  # (standards, correlations, bundles, votes, public comments, slots-of-a-panel) are
  # addressed as sub-resources. No entity nests more than one level under a parent.

  state_machine_shape: parallel
  # Submission carries two independent dimensions (review_status x pricing_status);
  # ContentEdit and Title are cyclic; PresentationSlot is branching fork-join;
  # AdoptionCycle is an ops-run/phase-epoch pipeline that cascades into children.

  relationship_patterns:
    - one_to_many        # StateProfile -> StateStandard, AdoptionCycle -> Submission, CommitteePanel -> PresentationSlot
    - cross_aggregate    # Submission (cycle aggregate) <-> Title (catalog aggregate) <-> PricingProposal (contract aggregate)
    - many_to_many       # Title <-> StateProfile realized through ContentEdit and through Submission

  role_model: segregation_of_duties
  # ContentEdit review requires a different X-User-ID than the proposer; DistrictOrder
  # confirmation requires a different SalesRep than the order's creator. Layered on top
  # of peer ownership: StateAdoptionOfficer is entity_backed to StateProfile and may only
  # act inside its own state.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StateProfile
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-character USPS state code identifying the adopting state"
        constraints: "exactly 2 uppercase letters; globally unique"
      - name: adoption_model
        type: enum
        source: input
        description: "ADOPTION_LIST states publish an adopted list; OPEN_TERRITORY states buy directly"
        constraints: "one of {ADOPTION_LIST, OPEN_TERRITORY}"
      - name: sampling_copies_required
        type: integer
        source: input
        description: "Number of print sample copies that must reach the state before a submission may be filed"
        default: 0
        constraints: ">= 0 and <= 50"
      - name: comment_response_days
        type: integer
        source: input
        description: "Calendar days the publisher has to answer a public comment before it escalates"
        default: 10
        constraints: ">= 1 and <= 60"
      - name: required_topics
        type: array
        source: input
        description: "Topic codes that must be present in submitted content for this state"
        default: []
        constraints: "array of uppercase snake_case topic codes; max 20 entries"
      - name: prohibited_content_tags
        type: array
        source: input
        description: "Content tags this state forbids in adopted instructional materials"
        default: []
        constraints: "array of uppercase snake_case tags; max 20 entries"
      - name: multi_year_max_years
        type: integer
        source: input
        description: "Maximum contract term in years a pricing proposal may commit to in this state"
        default: 6
        constraints: ">= 1 and <= 10"
      - name: price_cap_cents
        type: integer
        source: input
        description: "Maximum net_state_price_cents the state accepts per copy across the whole term; null means uncapped"
        default: null
        constraints: "null or >= 1"
      - name: min_verified_coverage_pct
        type: number
        source: input
        description: "Minimum correlation coverage percentage; self-reported gate at filing, committee-verified gate at adoption"
        default: 85.00
        constraints: ">= 0.00 and <= 100.00, two decimals"
      - name: accessibility_standard
        type: enum
        source: input
        description: "Accessibility conformance the state demands of the digital platform"
        default: WCAG_2_1_AA
        constraints: "one of {WCAG_2_1_AA, WCAG_2_2_AA}"
      - name: rostering_standard
        type: enum
        source: input
        description: "Rostering interoperability standard the state requires for digital provisioning"
        default: ONEROSTER_1_2
        constraints: "one of {ONEROSTER_1_1, ONEROSTER_1_2, CSV_MANUAL}"
      - name: data_privacy_addendum_required
        type: boolean
        source: input
        description: "Whether a signed student data privacy addendum is required before a bundle may be priced"
        default: true

  - name: StateStandard
    parent: StateProfile
    common_fields: false
    fields:
      - name: state_id
        type: string
        source: input
        description: "FK -> StateProfile.id; the state whose academic framework declares this standard"
      - name: subject
        type: enum
        source: input
        description: "Subject rotation slot this standard belongs to"
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES}"
      - name: standard_code
        type: string
        source: input
        description: "Framework code cited by correlation entries"
        constraints: "1..40 chars; unique per (state_id, subject)"
      - name: grade_low
        type: integer
        source: input
        description: "Lowest grade the standard applies to (0 = kindergarten)"
        constraints: ">= 0 and <= 12 and <= grade_high"
      - name: grade_high
        type: integer
        source: input
        description: "Highest grade the standard applies to"
        constraints: ">= grade_low and <= 12"
      - name: weight
        type: integer
        source: input
        description: "Framework weight of this standard inside the coverage denominator"
        constraints: ">= 1 and <= 5"
      - name: is_focus
        type: boolean
        source: input
        description: "Focus standards must be cited at PRACTICE depth or deeper before a submission may be filed"
        default: false

  - name: AdoptionCycle
    parent: null
    common_fields: true
    fields:
      - name: state_id
        type: string
        source: input
        description: "FK -> StateProfile.id; the state running this adoption cycle"
      - name: subject
        type: enum
        source: input
        description: "Subject up for adoption in this rotation slot"
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES}"
      - name: cycle_year
        type: integer
        source: input
        description: "Adoption year label of the cycle"
        constraints: ">= 2020 and <= 2100"
      - name: submission_open_at
        type: datetime
        source: input
        description: "Instant the submission window opens (inclusive)"
      - name: submission_deadline_at
        type: datetime
        source: input
        description: "Instant the submission window closes (exclusive)"
        constraints: "> submission_open_at"
      - name: committee_review_at
        type: datetime
        source: input
        description: "Instant committee review may begin"
        constraints: ">= submission_deadline_at"
      - name: public_comment_start_at
        type: datetime
        source: input
        description: "Instant the public comment phase begins"
        constraints: ">= committee_review_at"
      - name: public_comment_end_at
        type: datetime
        source: input
        description: "Instant the public comment phase ends"
        constraints: "> public_comment_start_at"
      - name: adoption_decision_at
        type: datetime
        source: input
        description: "Instant the state publishes its adoption decision"
        constraints: ">= public_comment_end_at"
      - name: contract_term_years
        type: integer
        source: input
        description: "Maximum contract term this cycle allows, further capped by StateProfile.multi_year_max_years"
        constraints: ">= 1 and <= 10"
      - name: status
        type: enum
        source: computed
        description: "Phase of the adoption calendar, advanced one step per phase-advance run"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, CLOSED_FOR_SUBMISSION, IN_REVIEW, PUBLIC_COMMENT, DECIDED, ARCHIVED}"
      - name: phase_epoch
        type: integer
        source: computed
        description: "Count of successful phase-advance runs on this cycle"
        default: 0
      - name: submission_count
        type: integer
        source: computed
        description: "Number of submissions on this cycle whose review_status is in {FILED, SCHEDULED, PRESENTED}"
        default: 0
      - name: scheduled_submission_count
        type: integer
        source: computed
        description: "Number of submissions on this cycle whose review_status is SCHEDULED"
        default: 0
      - name: adopted_count
        type: integer
        source: computed
        description: "Number of submissions on this cycle whose review_status is in {ADOPTED, ADOPTED_WITH_CONDITIONS}"
        default: 0

  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: isbn_base
        type: string
        source: input
        description: "Base ISBN of the print edition"
        constraints: "13 chars; globally unique"
      - name: subject
        type: enum
        source: input
        description: "Subject of the program"
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES}"
      - name: grade_low
        type: integer
        source: input
        description: "Lowest grade served (0 = kindergarten)"
        constraints: ">= 0 and <= 12 and <= grade_high"
      - name: grade_high
        type: integer
        source: input
        description: "Highest grade served"
        constraints: ">= grade_low and <= 12"
      - name: edition_number
        type: integer
        source: input
        description: "Edition number of the print program"
        default: 1
        constraints: ">= 1"
      - name: copyright_year
        type: integer
        source: input
        description: "Copyright year printed on the edition"
        constraints: ">= 2015 and <= 2100"
      - name: content_tags
        type: array
        source: computed
        description: "Topic and content tags present in the edition; seeded from the create payload then mutated only by ContentEdit apply/revert"
        constraints: "array of uppercase snake_case tags; max 40 entries"
      - name: page_count
        type: integer
        source: computed
        description: "Current page count; seeded from the create payload then mutated only by ContentEdit apply/revert"
        constraints: ">= 1"
      - name: signature_page_capacity
        type: integer
        source: input
        description: "Immutable press signature capacity in pages; page_count + page_budget_remaining always equals this value"
        constraints: ">= page_count at creation"
      - name: page_budget_remaining
        type: integer
        source: computed
        description: "signature_page_capacity - page_count; conserved quantity for ContentEdit apply/revert"
      - name: content_revision
        type: integer
        source: computed
        description: "Increments by 1 on every ContentEdit apply and on every ContentEdit revert; submissions pin this value at filing"
        default: 1
      - name: list_price_cents
        type: integer
        source: input
        description: "Publisher list price per print copy in cents"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Catalog lifecycle of the edition"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, REVISION_PLANNED, SUNSET}"
      - name: revision_target_cycle_year
        type: integer
        source: computed
        description: "Adoption year the next edition is being planned against; null unless status is REVISION_PLANNED"
        default: null
      - name: adopted_state_codes
        type: array
        source: computed
        description: "State codes where a submission of this title reached ADOPTED or ADOPTED_WITH_CONDITIONS"
        default: []
      - name: total_received_units
        type: integer
        source: computed
        description: "Lifetime print units received into the warehouse"
        default: 0
      - name: on_hand_units
        type: integer
        source: computed
        description: "Unencumbered print units available for sampling or district allocation"
        default: 0
      - name: committed_units
        type: integer
        source: computed
        description: "Print units allocated to CONFIRMED district orders"
        default: 0
      - name: sample_reserved_units
        type: integer
        source: computed
        description: "Print units consumed by state sampling shipments"
        default: 0
      - name: fulfilled_units
        type: integer
        source: computed
        description: "Print units shipped against FULFILLED district orders"
        default: 0
      - name: written_off_units
        type: integer
        source: computed
        description: "Print units written off by inventory adjustment or by sunset"
        default: 0

  - name: AncillaryBundle
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the core program this bundle wraps"
      - name: bundle_code
        type: string
        source: input
        description: "Publisher code of the ancillary bundle"
        constraints: "1..30 chars; unique per title_id"
      - name: component_count
        type: integer
        source: input
        description: "Number of ancillary components in the bundle; drives the bundle discount tier"
        constraints: ">= 1 and <= 12"
      - name: component_list_total_cents
        type: integer
        source: input
        description: "Sum of the components' list prices in cents"
        constraints: ">= 1"
      - name: digital_seat_price_cents
        type: integer
        source: input
        description: "List price per digital student seat in cents"
        constraints: ">= 1"
      - name: rostering_standard
        type: enum
        source: input
        description: "Rostering interoperability standard the digital platform provisions with"
        constraints: "one of {ONEROSTER_1_1, ONEROSTER_1_2, CSV_MANUAL}"
      - name: accessibility_conformance
        type: enum
        source: input
        description: "Accessibility conformance level the platform commits to"
        constraints: "one of {WCAG_2_1_AA, WCAG_2_2_AA, NONE}"
      - name: privacy_addendum_signed
        type: boolean
        source: input
        description: "Whether the student data privacy addendum has been signed for this bundle"
        default: false

  - name: ContentEdit
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the edition being edited for a state requirement"
      - name: state_id
        type: string
        source: input
        description: "FK -> StateProfile.id; the state whose requirement motivates the edit"
      - name: edit_type
        type: enum
        source: input
        description: "Kind of state-specific content change"
        constraints: "one of {ADD_REQUIRED_TOPIC, REMOVE_PROHIBITED_TAG, REGIONAL_SUBSTITUTION}"
      - name: topic_code
        type: string
        source: input
        description: "Required topic code added, or prohibited content tag removed, by this edit"
        constraints: "uppercase snake_case, 1..40 chars"
      - name: pages_delta
        type: integer
        source: input
        description: "Signed change in Title.page_count when this edit is applied"
        constraints: ">= -80 and <= 80"
      - name: rationale
        type: string
        source: input
        description: "Editorial justification recorded for the state review file"
        constraints: "10..500 chars"
      - name: status
        type: enum
        source: computed
        description: "Editorial workflow state of the edit"
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, REJECTED, APPLIED, REVERTED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this edit has been proposed; incremented on resubmit"
        default: 1
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PublisherEditor who proposed or last resubmitted the edit"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EditorialDirector who last reviewed the edit; null before first review"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason captured when the review verdict is REJECT; null otherwise"
        default: null

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> AdoptionCycle.id; the state adoption cycle this submission competes in"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the edition being submitted"
      - name: review_status
        type: enum
        source: computed
        description: "Review dimension of the submission lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, FILED, SCHEDULED, PRESENTED, ADOPTED, ADOPTED_WITH_CONDITIONS, NOT_ADOPTED, WITHDRAWN}"
      - name: pricing_status
        type: enum
        source: computed
        description: "Pricing dimension of the submission lifecycle, advancing independently of review_status"
        default: UNPRICED
        constraints: "one of {UNPRICED, PRICE_FILED, PRICE_APPROVED, PRICE_REJECTED}"
      - name: sampling_status
        type: enum
        source: computed
        description: "Fulfilment of the state's sampling requirement, recomputed by sampling_fulfilment"
        default: PENDING
        constraints: "one of {NOT_REQUIRED, PENDING, PARTIAL, SHIPPED}"
      - name: sample_copies_shipped
        type: integer
        source: computed
        description: "Cumulative sample copies shipped for this submission"
        default: 0
      - name: pinned_content_revision
        type: integer
        source: computed
        description: "Title.content_revision captured at filing; null while DRAFT"
        default: null
      - name: content_pin_stale
        type: boolean
        source: computed
        description: "True when Title.content_revision has moved past pinned_content_revision"
        default: false
      - name: self_reported_coverage_pct
        type: number
        source: computed
        description: "Coverage percentage counting correlation entries whose reviewer_verdict is in {PENDING, ACCEPTED}"
        default: 0.00
      - name: verified_coverage_pct
        type: number
        source: computed
        description: "Coverage percentage counting only correlation entries whose reviewer_verdict is ACCEPTED"
        default: 0.00
      - name: prohibited_hit_count
        type: integer
        source: computed
        description: "Count of the state's prohibited tags still present in the title's content"
        default: 0
      - name: missing_required_topic_count
        type: integer
        source: computed
        description: "Count of the state's required topics still absent from the title's content"
        default: 0
      - name: unresolved_critical_count
        type: integer
        source: computed
        description: "Count of CRITICAL public comments whose status is in {OPEN, ESCALATED}"
        default: 0
      - name: overdue_response_count
        type: integer
        source: computed
        description: "Count of public comments that escalated or were answered after response_due_at"
        default: 0
      - name: compliance_score
        type: integer
        source: computed
        description: "Content and comment compliance score, 0..100, produced by compliance_score"
        default: 100
      - name: adoption_blocked
        type: boolean
        source: computed
        description: "True when compliance_score < 70, prohibited_hit_count > 0, or content_pin_stale is true"
        default: false
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock instant of the successful file call; null while DRAFT"
        default: null

  - name: CorrelationEntry
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission this correlation documents"
      - name: standard_code
        type: string
        source: input
        description: "StateStandard.standard_code cited by this entry; validated against the cycle's state and subject framework"
        constraints: "1..40 chars"
      - name: depth_level
        type: enum
        source: input
        description: "Instructional depth claimed for the cited standard"
        constraints: "one of {MENTION, PRACTICE, MASTERY}"
      - name: page_reference
        type: string
        source: input
        description: "Page or lesson locator in the submitted edition"
        constraints: "1..40 chars"
      - name: evidence_citation
        type: string
        source: input
        description: "Verbatim evidence text supporting the claimed depth"
        constraints: ">= 20 and <= 500 chars"
      - name: reviewer_verdict
        type: enum
        source: computed
        description: "Committee verdict on the cited evidence"
        default: PENDING
        constraints: "one of {PENDING, ACCEPTED, INSUFFICIENT}"
      - name: verdict_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ReviewCommitteeMember who recorded the verdict; null while PENDING"
        default: null
      - name: effective_weight
        type: number
        source: computed
        description: "StateStandard.weight multiplied by the depth multiplier of depth_level"
        default: 0.00

  - name: CommitteePanel
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> AdoptionCycle.id; the cycle whose review committee sits on this panel"
      - name: panel_label
        type: string
        source: input
        description: "Human label of the panel sitting"
        constraints: "1..60 chars"
      - name: session_start_at
        type: datetime
        source: input
        description: "Instant the panel session opens; presentation slots must start at or after this instant"
      - name: session_end_at
        type: datetime
        source: input
        description: "Instant the panel session ends; presentation slots must end at or before this instant"
        constraints: "> session_start_at"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Mandatory turnover gap in minutes required between two presentation slots on this panel"
        default: 10
        constraints: ">= 0 and <= 60"
      - name: slot_minutes_capacity
        type: integer
        source: input
        description: "Policy cap in whole minutes on the total presentation time this panel will seat; defaults to the whole minutes between session_start_at and session_end_at when omitted, and may be set lower to reserve deliberation time"
        default: "the whole minutes between session_start_at and session_end_at"
        constraints: ">= 1 and <= the whole minutes between session_start_at and session_end_at, else ERR_INVALID_REQUEST"
      - name: reserved_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over this panel's slots whose status is in {RESERVED, PRESENTED, TALLIED, NO_SHOW}"
        default: 0
      - name: member_count
        type: integer
        source: input
        description: "Number of seated committee members"
        constraints: ">= 1 and <= 25"
      - name: quorum_required
        type: integer
        source: input
        description: "Minimum counted votes required before a slot may be tallied"
        constraints: ">= 1 and <= member_count"
      - name: status
        type: enum
        source: computed
        description: "Session state of the panel"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_SESSION, CLOSED}"

  - name: PresentationSlot
    parent: CommitteePanel
    common_fields: true
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> CommitteePanel.id; the panel sitting that hosts this presentation"
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission being presented"
      - name: start_at
        type: datetime
        source: input
        description: "Slot start instant, inclusive"
      - name: end_at
        type: datetime
        source: input
        description: "Slot end instant, inclusive for buffer arithmetic"
        constraints: "> start_at"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_at and end_at"
      - name: status
        type: enum
        source: computed
        description: "Slot lifecycle state"
        default: RESERVED
        constraints: "one of {RESERVED, PRESENTED, TALLIED, NO_SHOW, CANCELLED}"
      - name: tally_outcome
        type: enum
        source: computed
        description: "Committee recommendation produced by committee_tally"
        default: PENDING
        constraints: "one of {PENDING, RECOMMEND, RECOMMEND_WITH_CONDITIONS, REJECT}"
      - name: recommend_ratio
        type: number
        source: computed
        description: "Weighted recommendation ratio rounded to 4 decimals; null before tally"
        default: null
      - name: counted_vote_count
        type: integer
        source: computed
        description: "Number of members whose latest vote counted in the tally, abstentions included"
        default: 0

  - name: CommitteeVote
    parent: PresentationSlot
    common_fields: false
    fields:
      - name: slot_id
        type: string
        source: input
        description: "FK -> PresentationSlot.id; the presentation being voted on"
      - name: member_user_id
        type: string
        source: system
        description: "X-User-ID of the ReviewCommitteeMember casting the vote"
      - name: vote
        type: enum
        source: input
        description: "Ballot cast by the member"
        constraints: "one of {RECOMMEND, RECOMMEND_WITH_CONDITIONS, REJECT, ABSTAIN}"
      - name: rationale
        type: string
        source: input
        description: "Member's written rationale for the public record"
        constraints: "5..500 chars"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-slot ballot sequence starting at 1; breaks created_at ties when selecting a member's latest vote"
      - name: superseded
        type: boolean
        source: computed
        description: "True when the same member has a later ballot on this slot"
        default: false

  - name: PublicComment
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission the comment targets"
      - name: commenter_ref
        type: string
        source: input
        description: "Public identifier of the commenter for the state record"
        constraints: "1..60 chars"
      - name: category
        type: enum
        source: input
        description: "Comment category used by the state record"
        constraints: "one of {ERROR_OF_FACT, BIAS_CONCERN, PROHIBITED_CONTENT, OTHER}"
      - name: severity
        type: enum
        source: input
        description: "Severity assigned by the commenter; CRITICAL blocks adoption while unresolved"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: body
        type: string
        source: input
        description: "Comment text"
        constraints: "10..2000 chars"
      - name: status
        type: enum
        source: computed
        description: "Response lifecycle of the comment"
        default: OPEN
        constraints: "one of {OPEN, ESCALATED, RESPONDED}"
      - name: response_due_at
        type: datetime
        source: computed
        description: "created_at plus StateProfile.comment_response_days days"
      - name: responded_at
        type: datetime
        source: system
        description: "Logical clock instant of the publisher response; null until answered"
        default: null
      - name: response_body
        type: string
        source: input
        description: "Publisher response text; null until answered"
        default: null
      - name: was_overdue_at_response
        type: boolean
        source: computed
        description: "True when the comment escalated, or when the response landed at or after response_due_at"
        default: false

  - name: PricingProposal
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission this price filing belongs to"
      - name: bundle_id
        type: string
        source: input
        description: "FK -> AncillaryBundle.id; the ancillary bundle committed with the program, or null for core-only pricing"
        default: null
      - name: base_price_cents
        type: integer
        source: input
        description: "Year-one list price per print copy offered to the state in cents"
        constraints: ">= 1"
      - name: term_years
        type: integer
        source: input
        description: "Committed contract term in years"
        constraints: ">= 1 and <= 10"
      - name: annual_escalator_bps
        type: integer
        source: input
        description: "Annual price escalator in basis points applied year over year"
        constraints: ">= 0 and <= 500"
      - name: projected_adoption_units
        type: integer
        source: input
        description: "Units the publisher projects for the state; drives the volume discount tier"
        constraints: ">= 0"
      - name: digital_seat_price_cents
        type: integer
        source: input
        description: "Committed price per digital student seat in cents"
        constraints: ">= 1"
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Volume tier discount selected from VOLUME_TIERS"
        default: 0.00
      - name: term_discount_pct
        type: number
        source: computed
        description: "Multi-year commitment discount selected from TERM_TIERS"
        default: 0.00
      - name: bundle_discount_pct
        type: number
        source: computed
        description: "Ancillary bundling discount selected from BUNDLE_TIERS; 0.00 when bundle_id is null"
        default: 0.00
      - name: total_discount_pct
        type: number
        source: computed
        description: "min(MAX_TOTAL_DISCOUNT_PCT, volume_discount_pct + term_discount_pct + bundle_discount_pct)"
        default: 0.00
      - name: net_state_price_cents
        type: integer
        source: computed
        description: "Sum over the term of the per-year discounted price, each year rounded to whole cents before summing"
        default: 0
      - name: avg_annual_price_cents
        type: integer
        source: computed
        description: "net_state_price_cents divided by term_years, round_half_up; the contracted per-copy price districts pay"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "State review state of the price filing"
        default: FILED
        constraints: "one of {FILED, APPROVED, REJECTED, SUPERSEDED}"
      - name: contract_locked
        type: boolean
        source: computed
        description: "True once the filing is contractually frozen: either a district order was confirmed against this APPROVED proposal, or the submission reached ADOPTED or ADOPTED_WITH_CONDITIONS with this proposal APPROVED. A locked filing can never be superseded and a later order cancellation does not release the lock"
        default: false
      - name: decision_officer_ref
        type: string
        source: system
        description: "X-User-ID of the StateAdoptionOfficer who decided the filing; null while FILED"
        default: null

  - name: DistrictOrder
    parent: null
    common_fields: true
    fields:
      - name: district_ref
        type: string
        source: input
        description: "District identifier used by the sales organization"
        constraints: "1..60 chars"
      - name: state_id
        type: string
        source: input
        description: "FK -> StateProfile.id; the state the ordering district sits in"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the edition ordered"
      - name: pricing_proposal_id
        type: string
        source: input
        description: "FK -> PricingProposal.id; the approved state price filing the order draws on, or null in OPEN_TERRITORY states"
        default: null
      - name: print_units
        type: integer
        source: input
        description: "Print copies ordered"
        constraints: ">= 0"
      - name: digital_seats
        type: integer
        source: input
        description: "Digital student seats ordered"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle state"
        default: QUOTED
        constraints: "one of {QUOTED, CONFIRMED, FULFILLED, CANCELLED}"
      - name: quoted_tcv_cents
        type: integer
        source: computed
        description: "List-price total contract value computed at order creation by order_total_value variant quoted"
        default: 0
      - name: contracted_tcv_cents
        type: integer
        source: computed
        description: "State-approved total contract value computed at confirmation by order_total_value variant contracted; null while QUOTED"
        default: null
      - name: freight_surcharge_cents
        type: integer
        source: computed
        description: "Freight surcharge included in the most recently computed total contract value"
        default: 0
      - name: allocated_units
        type: integer
        source: computed
        description: "Print units currently committed out of Title inventory for this order"
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesRep who entered the order"
      - name: confirmed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesRep who confirmed the order; must differ from created_by_user_id"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AdoptionCycle
    initial_state: SCHEDULED
    terminal_states: [ARCHIVED]
    note: |
      Ops-run pipeline. Every call to POST /adoption-cycles/{id}/phase-advance advances at
      most ONE phase and only when the logical clock has reached that phase's timestamp.
      Every successful advance also runs the shared epoch sweep, in this fixed order:
      (S1) each PublicComment on a submission of this cycle whose status is OPEN and whose
      response_due_at <= clock_now becomes ESCALATED; (S2) each Submission of this cycle
      recomputes unresolved_critical_count, overdue_response_count, compliance_score and
      adoption_blocked; (S3) for each Submission that is now adoption_blocked, every one of
      its PresentationSlot rows with status RESERVED becomes CANCELLED (its panel's
      reserved_minutes decremented by that slot's duration_minutes) and, when the submission
      keeps no slot in {RESERVED, PRESENTED, TALLIED}, its review_status moves SCHEDULED to
      FILED with scheduled_submission_count decremented.
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /adoption-cycles/{id}/phase-advance"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals AdoptionCycle.state_id"
          - "clock_now >= submission_open_at, else ERR_PHASE_NOT_DUE"
        side_effects:
          - "phase_epoch incremented by 1"
          - "shared epoch sweep S1-S3 runs"
      - from: OPEN
        to: CLOSED_FOR_SUBMISSION
        trigger: "POST /adoption-cycles/{id}/phase-advance"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals AdoptionCycle.state_id"
          - "clock_now >= submission_deadline_at, else ERR_PHASE_NOT_DUE"
        side_effects:
          - "every Submission of this cycle whose review_status is DRAFT moves to WITHDRAWN"
          - "phase_epoch incremented by 1"
          - "shared epoch sweep S1-S3 runs"
      - from: CLOSED_FOR_SUBMISSION
        to: IN_REVIEW
        trigger: "POST /adoption-cycles/{id}/phase-advance"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals AdoptionCycle.state_id"
          - "clock_now >= committee_review_at, else ERR_PHASE_NOT_DUE"
        side_effects:
          - "panels of this cycle become eligible for open-session"
          - "phase_epoch incremented by 1"
          - "shared epoch sweep S1-S3 runs"
      - from: IN_REVIEW
        to: PUBLIC_COMMENT
        trigger: "POST /adoption-cycles/{id}/phase-advance"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals AdoptionCycle.state_id"
          - "clock_now >= public_comment_start_at, else ERR_PHASE_NOT_DUE"
          - "no CommitteePanel of this cycle has status IN_SESSION, else ERR_COMMITTEE_PANEL_STATE_INVALID"
        side_effects:
          - "phase_epoch incremented by 1"
          - "shared epoch sweep S1-S3 runs"
      - from: PUBLIC_COMMENT
        to: DECIDED
        trigger: "POST /adoption-cycles/{id}/phase-advance"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals AdoptionCycle.state_id"
          - "clock_now >= adoption_decision_at, else ERR_PHASE_NOT_DUE"
        side_effects:
          - "shared epoch sweep S1-S3 runs first"
          - "every Submission of this cycle whose review_status is in {FILED, SCHEDULED, PRESENTED} moves to NOT_ADOPTED"
          - "each such submission's PresentationSlot rows with status RESERVED move to CANCELLED and their panels' reserved_minutes decrease by the slot duration_minutes"
          - "submission_count and scheduled_submission_count recomputed to 0"
          - "phase_epoch incremented by 1"
      - from: DECIDED
        to: ARCHIVED
        trigger: "POST /adoption-cycles/{id}/phase-advance"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals AdoptionCycle.state_id"
          - "clock_now >= adoption_decision_at + ARCHIVE_DELAY_DAYS days, else ERR_PHASE_NOT_DUE"
        side_effects:
          - "phase_epoch incremented by 1"
          - "cycle becomes read-only; every further phase-advance fails with ERR_ADOPTION_CYCLE_STATE_INVALID"

  - entity: Submission
    initial_state: "DRAFT (review_status) x UNPRICED (pricing_status)"
    terminal_states: [ADOPTED, ADOPTED_WITH_CONDITIONS, NOT_ADOPTED, WITHDRAWN]
    note: |
      Two independent dimensions live on the same row. review_status walks the state review
      pipeline and may cycle FILED -> DRAFT; pricing_status walks the price-filing pipeline
      and may cycle PRICE_APPROVED/PRICE_REJECTED -> PRICE_FILED. Neither dimension gates the
      other's transitions, but the tally branch reads pricing_status, so the pair decides the
      terminal review_status. The terminal_states list names review_status members only;
      pricing_status has no terminal member.
    transitions:
      - from: "review_status=DRAFT"
        to: "review_status=FILED"
        trigger: "POST /submissions/{id}/file"
        actor: PublisherEditor
        preconditions:
          - "cycle.status == OPEN, else ERR_CYCLE_NOT_OPEN_FOR_SUBMISSION"
          - "submission_open_at <= clock_now < submission_deadline_at, else ERR_SUBMISSION_WINDOW_CLOSED"
          - "title.status is in {ACTIVE, REVISION_PLANNED}, else ERR_TITLE_NOT_RELEASED"
          - "at least one CorrelationEntry exists, else ERR_CORRELATION_SET_EMPTY"
          - "prohibited_hit_count == 0, else ERR_PROHIBITED_CONTENT_PRESENT"
          - "missing_required_topic_count == 0, else ERR_REQUIRED_TOPIC_MISSING"
          - "every StateStandard with is_focus true in the coverage input set has at least one CorrelationEntry with depth_level in {PRACTICE, MASTERY} and reviewer_verdict in {PENDING, ACCEPTED}, else ERR_FOCUS_STANDARD_UNCOVERED"
          - "self_reported_coverage_pct >= state.min_verified_coverage_pct, else ERR_COVERAGE_BELOW_MINIMUM"
          - "sampling_status is in {NOT_REQUIRED, SHIPPED}, else ERR_SAMPLING_INCOMPLETE"
        side_effects:
          - "pinned_content_revision set to title.content_revision (version pinning)"
          - "content_pin_stale set to false"
          - "filed_at set to clock_now"
          - "cycle.submission_count incremented by 1"
          - "compliance_score and adoption_blocked recomputed"
      - from: "review_status=FILED"
        to: "review_status=DRAFT"
        trigger: "POST /submissions/{id}/withdraw with reason REVISE"
        actor: PublisherEditor
        preconditions:
          - "cycle.status is in {OPEN, CLOSED_FOR_SUBMISSION, IN_REVIEW}, else ERR_ADOPTION_CYCLE_STATE_INVALID"
        side_effects:
          - "cycle.submission_count decremented by 1"
          - "pinned_content_revision reset to null and content_pin_stale reset to false"
      - from: "review_status=DRAFT"
        to: "review_status=WITHDRAWN"
        trigger: "POST /submissions/{id}/withdraw with reason ABANDON, or AdoptionCycle OPEN->CLOSED_FOR_SUBMISSION sweep"
        actor: PublisherEditor | system
        preconditions:
          - "review_status == DRAFT, else ERR_SUBMISSION_STATE_INVALID"
        side_effects:
          - "submission becomes read-only; correlations, sampling shipments and filing all fail with ERR_SUBMISSION_STATE_INVALID"
      - from: "review_status=FILED"
        to: "review_status=SCHEDULED"
        trigger: "POST /committee-panels/{id}/slots"
        actor: StateAdoptionOfficer
        preconditions:
          - "review_status == FILED, else ERR_SUBMISSION_STATE_INVALID"
          - "content_pin_stale == false, else ERR_CONTENT_PIN_STALE"
        side_effects:
          - "cycle.scheduled_submission_count incremented by 1"
      - from: "review_status=SCHEDULED"
        to: "review_status=FILED"
        trigger: "system: the submission's last slot in {RESERVED, PRESENTED, TALLIED} left that set (slot CANCELLED by the content-edit apply cascade, or NO_SHOW at panel close)"
        actor: system
        preconditions:
          - "no remaining PresentationSlot of this submission has status in {RESERVED, PRESENTED, TALLIED}"
        side_effects:
          - "cycle.scheduled_submission_count decremented by 1"
      - from: "review_status=SCHEDULED"
        to: "review_status=PRESENTED"
        trigger: "POST /presentation-slots/{id}/present"
        actor: StateAdoptionOfficer
        preconditions:
          - "panel.status == IN_SESSION, else ERR_COMMITTEE_PANEL_STATE_INVALID"
          - "content_pin_stale == false, else ERR_CONTENT_PIN_STALE"
        side_effects:
          - "slot.status moves RESERVED -> PRESENTED"
      - from: "review_status=PRESENTED"
        to: "review_status=ADOPTED"
        trigger: "POST /presentation-slots/{id}/tally producing tally_outcome RECOMMEND"
        actor: StateAdoptionOfficer
        preconditions:
          - "tally_outcome == RECOMMEND"
          - "pricing_status == PRICE_APPROVED"
          - "verified_coverage_pct >= state.min_verified_coverage_pct"
          - "adoption_blocked == false"
          - "unresolved_critical_count == 0"
        side_effects:
          - "title.adopted_state_codes gains state.state_code and title.status moves DRAFT -> ACTIVE when still DRAFT"
          - "the submission's APPROVED PricingProposal sets contract_locked true"
          - "cycle.adopted_count incremented by 1 and cycle.submission_count decremented by 1"
      - from: "review_status=PRESENTED"
        to: "review_status=ADOPTED_WITH_CONDITIONS"
        trigger: "POST /presentation-slots/{id}/tally producing tally_outcome RECOMMEND_WITH_CONDITIONS"
        actor: StateAdoptionOfficer
        preconditions:
          - "tally_outcome == RECOMMEND_WITH_CONDITIONS"
          - "pricing_status == PRICE_APPROVED"
          - "verified_coverage_pct >= state.min_verified_coverage_pct"
          - "adoption_blocked == false"
          - "unresolved_critical_count == 0"
        side_effects:
          - "title.adopted_state_codes gains state.state_code and title.status moves DRAFT -> ACTIVE when still DRAFT"
          - "the submission's APPROVED PricingProposal sets contract_locked true"
          - "cycle.adopted_count incremented by 1 and cycle.submission_count decremented by 1"
      - from: "review_status=PRESENTED"
        to: "review_status=NOT_ADOPTED"
        trigger: "POST /presentation-slots/{id}/tally producing tally_outcome REJECT, or any adoption gate unmet, or AdoptionCycle PUBLIC_COMMENT->DECIDED sweep"
        actor: StateAdoptionOfficer | system
        preconditions:
          - "tally_outcome == REJECT, or one of {pricing_status != PRICE_APPROVED, verified_coverage_pct < state.min_verified_coverage_pct, adoption_blocked == true, unresolved_critical_count > 0} holds"
        side_effects:
          - "title.adopted_state_codes unchanged"
          - "the submission's PricingProposal rows keep contract_locked false"
          - "cycle.submission_count decremented by 1"
      - from: "pricing_status=UNPRICED"
        to: "pricing_status=PRICE_FILED"
        trigger: "POST /pricing-proposals"
        actor: PricingManager
        preconditions:
          - "review_status is in {FILED, SCHEDULED, PRESENTED}, else ERR_SUBMISSION_STATE_INVALID"
          - "cycle.status is in {OPEN, CLOSED_FOR_SUBMISSION, IN_REVIEW}, else ERR_ADOPTION_CYCLE_STATE_INVALID"
          - "expected_submission_version equals Submission.version, else ERR_STALE_SUBMISSION_VERSION"
        side_effects:
          - "PricingProposal created with status FILED and net_state_price_cents computed"
          - "Submission.version incremented by 1"
      - from: "pricing_status=PRICE_FILED"
        to: "pricing_status=PRICE_APPROVED"
        trigger: "POST /pricing-proposals/{id}/decision with verdict APPROVE"
        actor: StateAdoptionOfficer
        preconditions:
          - "proposal.status == FILED, else ERR_PRICING_PROPOSAL_STATE_INVALID"
          - "X-User-ID equals the cycle's state_id, else ERR_STATE_SCOPE_VIOLATION"
        side_effects:
          - "proposal.status moves FILED -> APPROVED and decision_officer_ref recorded"
      - from: "pricing_status=PRICE_FILED"
        to: "pricing_status=PRICE_REJECTED"
        trigger: "POST /pricing-proposals/{id}/decision with verdict REJECT"
        actor: StateAdoptionOfficer
        preconditions:
          - "proposal.status == FILED, else ERR_PRICING_PROPOSAL_STATE_INVALID"
          - "X-User-ID equals the cycle's state_id, else ERR_STATE_SCOPE_VIOLATION"
        side_effects:
          - "proposal.status moves FILED -> REJECTED and decision_officer_ref recorded"
      - from: "pricing_status in {PRICE_APPROVED, PRICE_REJECTED}"
        to: "pricing_status=PRICE_FILED"
        trigger: "POST /pricing-proposals (create-with-supersede)"
        actor: PricingManager
        preconditions:
          - "review_status is in {FILED, SCHEDULED, PRESENTED}, else ERR_SUBMISSION_STATE_INVALID"
          - "expected_submission_version equals Submission.version, else ERR_STALE_SUBMISSION_VERSION"
        side_effects:
          - "any prior PricingProposal of this submission whose status is in {FILED, APPROVED} and whose contract_locked is false moves to SUPERSEDED"
          - "the new PricingProposal is created with status FILED"
          - "Submission.version incremented by 1"
        note: "A proposal whose contract_locked is true cannot be superseded; the create fails with ERR_CONTRACT_LOCKED."

  - entity: ContentEdit
    initial_state: PROPOSED
    terminal_states: [REVERTED]
    note: "Cyclic review loop PROPOSED -> REJECTED -> PROPOSED bounded by MAX_REVISION_ROUNDS, then a compensating APPLIED -> REVERTED arc."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /content-edits/{id}/review with verdict APPROVE"
        actor: EditorialDirector
        preconditions:
          - "X-User-ID differs from proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "reviewed_by_user_id recorded; rejection_reason cleared to null"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /content-edits/{id}/review with verdict REJECT"
        actor: EditorialDirector
        preconditions:
          - "X-User-ID differs from proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "rejection_reason present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "reviewed_by_user_id and rejection_reason recorded"
      - from: REJECTED
        to: PROPOSED
        trigger: "POST /content-edits/{id}/resubmit"
        actor: PublisherEditor
        preconditions:
          - "revision_round < MAX_REVISION_ROUNDS, else ERR_EDIT_REVISION_LIMIT_REACHED"
        side_effects:
          - "revision_round incremented by 1"
          - "proposed_by_user_id overwritten with the resubmitting X-User-ID"
          - "topic_code and pages_delta overwritten when supplied"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /content-edits/{id}/apply"
        actor: EditorialDirector
        preconditions:
          - "title.status is in {DRAFT, ACTIVE, REVISION_PLANNED}, else ERR_TITLE_SUNSET"
          - "title.page_count + pages_delta <= title.signature_page_capacity, else ERR_PAGE_BUDGET_EXCEEDED"
          - "title.page_count + pages_delta >= 1, else ERR_PAGE_BUDGET_EXCEEDED"
        side_effects:
          - "HOP 1: title.page_count += pages_delta; title.page_budget_remaining -= pages_delta; title.content_revision += 1; for ADD_REQUIRED_TOPIC topic_code is added to title.content_tags, for REMOVE_PROHIBITED_TAG topic_code is removed from title.content_tags, for REGIONAL_SUBSTITUTION content_tags are unchanged"
          - "HOP 2: caused by HOP 1's content_revision bump - every Submission whose title_id is this title and whose review_status is in {FILED, SCHEDULED, PRESENTED} and whose pinned_content_revision < title.content_revision sets content_pin_stale true, recomputes prohibited_hit_count, missing_required_topic_count and compliance_score, and sets adoption_blocked true"
          - "HOP 3: caused by HOP 2's content_pin_stale flag - every PresentationSlot of those submissions whose status is RESERVED moves to CANCELLED and its panel's reserved_minutes decreases by the slot's duration_minutes"
          - "HOP 4: caused by HOP 3's cancellation - each affected submission that keeps no slot in {RESERVED, PRESENTED, TALLIED} moves review_status SCHEDULED -> FILED and its cycle's scheduled_submission_count decreases by 1"
      - from: APPLIED
        to: REVERTED
        trigger: "POST /content-edits/{id}/revert"
        actor: EditorialDirector
        preconditions:
          - "no Submission whose title_id is this title has review_status in {ADOPTED, ADOPTED_WITH_CONDITIONS} with pinned_content_revision >= the revision produced by this edit's apply, else ERR_EDIT_REVERT_BLOCKED"
        side_effects:
          - "title.page_count -= pages_delta; title.page_budget_remaining += pages_delta, restoring page_count + page_budget_remaining == signature_page_capacity"
          - "content_tags change of the apply is undone"
          - "title.content_revision += 1 (revision numbers are monotonic; a revert does not un-stale a submission pinned before the apply)"
          - "every Submission of this title in {FILED, SCHEDULED, PRESENTED} recomputes prohibited_hit_count, missing_required_topic_count, compliance_score and adoption_blocked"

  - entity: Title
    initial_state: DRAFT
    terminal_states: [SUNSET]
    note: "Cyclic revision planning: ACTIVE -> REVISION_PLANNED -> ACTIVE is allowed any number of times before SUNSET."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /titles/{id}/release"
        actor: PublisherEditor
        preconditions:
          - "content_tags is non-empty, else ERR_TITLE_NOT_RELEASABLE"
          - "page_count <= signature_page_capacity, else ERR_PAGE_BUDGET_EXCEEDED"
        side_effects:
          - "title becomes eligible for submissions, bundles pricing and district orders"
      - from: ACTIVE
        to: REVISION_PLANNED
        trigger: "POST /titles/{id}/revision-plan with action PLAN"
        actor: EditorialDirector
        preconditions:
          - "revision_target_cycle_year present, else ERR_INVALID_REQUEST"
          - "no Submission of this title has review_status in {FILED, SCHEDULED, PRESENTED} inside a cycle whose cycle_year >= revision_target_cycle_year, else ERR_REVISION_CONFLICTS_WITH_OPEN_ADOPTION"
        side_effects:
          - "revision_target_cycle_year recorded"
      - from: REVISION_PLANNED
        to: ACTIVE
        trigger: "POST /titles/{id}/revision-plan with action CANCEL_PLAN"
        actor: EditorialDirector
        preconditions:
          - "status == REVISION_PLANNED, else ERR_TITLE_STATE_INVALID"
        side_effects:
          - "revision_target_cycle_year reset to null"
      - from: REVISION_PLANNED
        to: SUNSET
        trigger: "POST /titles/{id}/revision-plan with action SUNSET"
        actor: EditorialDirector
        preconditions:
          - "status == REVISION_PLANNED, else ERR_TITLE_STATE_INVALID"
          - "no DistrictOrder of this title has status CONFIRMED, else ERR_DISTRICT_ORDER_STATE_INVALID"
        side_effects:
          - "written_off_units += on_hand_units and on_hand_units set to 0, preserving total_received_units == on_hand_units + committed_units + sample_reserved_units + fulfilled_units + written_off_units"
          - "further district orders and content-edit applies on this title fail with ERR_TITLE_SUNSET"

  - entity: CommitteePanel
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /committee-panels/{id}/open-session"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals the cycle's state_id, else ERR_STATE_SCOPE_VIOLATION"
          - "cycle.status == IN_REVIEW, else ERR_ADOPTION_CYCLE_STATE_INVALID"
          - "clock_now >= session_start_at, else ERR_PANEL_SESSION_NOT_DUE"
        side_effects:
          - "slots of this panel become presentable; new slot reservations are refused with ERR_COMMITTEE_PANEL_STATE_INVALID"
      - from: IN_SESSION
        to: CLOSED
        trigger: "POST /committee-panels/{id}/close-session"
        actor: StateAdoptionOfficer
        preconditions:
          - "no slot of this panel has status PRESENTED, else ERR_PRESENTATION_SLOT_STATE_INVALID"
        side_effects:
          - "every slot with status RESERVED moves to NO_SHOW"
          - "each NO_SHOW slot's submission moves review_status SCHEDULED -> FILED when it keeps no slot in {RESERVED, PRESENTED, TALLIED}, decrementing cycle.scheduled_submission_count"
          - "reserved_minutes unchanged (NO_SHOW slots keep occupying the session record)"

  - entity: PresentationSlot
    initial_state: RESERVED
    terminal_states: [TALLIED, NO_SHOW, CANCELLED]
    note: "Branching fork-join: the single TALLIED arc carries three mutually exclusive side-effect sets selected by committee_tally's tally_outcome."
    transitions:
      - from: RESERVED
        to: PRESENTED
        trigger: "POST /presentation-slots/{id}/present"
        actor: StateAdoptionOfficer
        preconditions:
          - "panel.status == IN_SESSION, else ERR_COMMITTEE_PANEL_STATE_INVALID"
          - "clock_now >= start_at, else ERR_SLOT_NOT_STARTED"
          - "submission.content_pin_stale == false, else ERR_CONTENT_PIN_STALE"
        side_effects:
          - "submission.review_status moves SCHEDULED -> PRESENTED"
      - from: RESERVED
        to: CANCELLED
        trigger: "system: content-edit apply cascade HOP 3, submission withdraw with reason REVISE, or AdoptionCycle PUBLIC_COMMENT->DECIDED sweep"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "panel.reserved_minutes decreased by duration_minutes"
          - "submission.review_status moves SCHEDULED -> FILED when no slot in {RESERVED, PRESENTED, TALLIED} remains"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /committee-panels/{id}/close-session"
        actor: StateAdoptionOfficer
        preconditions:
          - "panel transition IN_SESSION -> CLOSED is executing"
        side_effects:
          - "submission.review_status moves SCHEDULED -> FILED when no slot in {RESERVED, PRESENTED, TALLIED} remains"
      - from: PRESENTED
        to: TALLIED
        trigger: "POST /presentation-slots/{id}/tally"
        actor: StateAdoptionOfficer
        preconditions:
          - "X-User-ID equals the cycle's state_id, else ERR_STATE_SCOPE_VIOLATION"
          - "panel.status == IN_SESSION, else ERR_COMMITTEE_PANEL_STATE_INVALID"
          - "counted_vote_count >= panel.quorum_required, else ERR_QUORUM_NOT_MET"
          - "at least one counted vote is not ABSTAIN, else ERR_NO_COUNTABLE_VOTES"
        side_effects:
          - "recommend_ratio, counted_vote_count and tally_outcome written by committee_tally"
          - "BRANCH RECOMMEND: HOP 1 slot TALLIED with tally_outcome RECOMMEND; HOP 2 caused by HOP 1 - submission.review_status PRESENTED -> ADOPTED (all adoption gates met) or -> NOT_ADOPTED (any gate unmet), title.adopted_state_codes and title.status updated on adoption; HOP 3 caused by HOP 2's adoption - the submission's APPROVED PricingProposal sets contract_locked true and cycle.adopted_count increments"
          - "BRANCH RECOMMEND_WITH_CONDITIONS: same three hops but review_status PRESENTED -> ADOPTED_WITH_CONDITIONS"
          - "BRANCH REJECT: submission.review_status PRESENTED -> NOT_ADOPTED, no title or proposal mutation, cycle.submission_count decremented"

  - entity: PublicComment
    initial_state: OPEN
    terminal_states: [RESPONDED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "AdoptionCycle phase-advance shared epoch sweep step S1"
        actor: system
        preconditions:
          - "status == OPEN and clock_now >= response_due_at"
        side_effects:
          - "was_overdue_at_response set to true"
          - "submission.overdue_response_count and, for CRITICAL severity, unresolved_critical_count recomputed"
          - "submission.compliance_score recomputed and adoption_blocked re-derived, which may cancel RESERVED slots via sweep step S3"
      - from: OPEN
        to: RESPONDED
        trigger: "POST /public-comments/{id}/response"
        actor: PublisherEditor
        preconditions:
          - "submission.review_status is in {FILED, SCHEDULED, PRESENTED}, else ERR_SUBMISSION_STATE_INVALID"
        side_effects:
          - "responded_at set to clock_now; response_body stored"
          - "was_overdue_at_response set to (clock_now >= response_due_at)"
          - "submission.unresolved_critical_count, overdue_response_count, compliance_score and adoption_blocked recomputed"
      - from: ESCALATED
        to: RESPONDED
        trigger: "POST /public-comments/{id}/response"
        actor: PublisherEditor
        preconditions:
          - "submission.review_status is in {FILED, SCHEDULED, PRESENTED}, else ERR_SUBMISSION_STATE_INVALID"
        side_effects:
          - "responded_at set to clock_now; response_body stored; was_overdue_at_response stays true"
          - "submission.unresolved_critical_count decremented for CRITICAL severity; overdue_response_count unchanged; compliance_score and adoption_blocked recomputed"

  - entity: DistrictOrder
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /district-orders/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "X-User-ID differs from created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "title.status is in {ACTIVE, REVISION_PLANNED}, else ERR_TITLE_SUNSET"
          - "when state.adoption_model == ADOPTION_LIST: pricing_proposal_id is not null, else ERR_PRICING_PROPOSAL_REQUIRED"
          - "when state.adoption_model == ADOPTION_LIST: proposal.status == APPROVED, else ERR_PRICING_PROPOSAL_STATE_INVALID"
          - "when state.adoption_model == ADOPTION_LIST: state.state_code is in title.adopted_state_codes, else ERR_TITLE_NOT_ON_ADOPTED_LIST"
          - "title.on_hand_units >= print_units, else ERR_INSUFFICIENT_PRINT_INVENTORY"
        side_effects:
          - "contracted_tcv_cents and freight_surcharge_cents written by order_total_value variant contracted"
          - "allocated_units set to print_units; title.on_hand_units -= print_units; title.committed_units += print_units"
          - "confirmed_by_user_id recorded"
          - "when pricing_proposal_id is not null and that proposal's status is APPROVED, the proposal sets contract_locked true - the signed district contract freezes the price filing, and a later cancel does not release it"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /district-orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "status == QUOTED"
        side_effects:
          - "no inventory movement (allocated_units is already 0)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /district-orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "title.committed_units -= allocated_units; title.on_hand_units += allocated_units; allocated_units set to 0"
          - "contracted_tcv_cents and freight_surcharge_cents reset to null and 0, leaving total_received_units == on_hand_units + committed_units + sample_reserved_units + fulfilled_units + written_off_units unchanged"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /district-orders/{id}/fulfill"
        actor: SalesRep
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "title.committed_units -= allocated_units; title.fulfilled_units += allocated_units"
          - "allocated_units unchanged; order becomes read-only"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pricing-proposal-create-stale-submission
    parent_entity: Submission
    write_endpoint: "POST /pricing-proposals"
    occ_field: "expected_submission_version"
    description: |
      Filing a PricingProposal against a Submission whose version has advanced since the
      client last observed it is rejected. This captures the case where another price filing
      has already been accepted on the same submission and legitimately superseded the prior
      proposal under the create-with-supersede arc, so the current filer's view of the
      submission - including which proposal is live - is stale.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
  - rule_id: slot-reserve-stale-panel
    parent_entity: CommitteePanel
    write_endpoint: "POST /committee-panels/{id}/slots"
    occ_field: "expected_panel_version"
    description: |
      Reserving a PresentationSlot against a CommitteePanel whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      reservation has already consumed part of the panel's reserved_minutes budget, so the
      current reserver's view of the remaining session capacity is stale even when the
      requested window itself is free.
    error_id: ERR_STALE_PANEL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: correlation_coverage
    trigger: "POST /submissions/{id}/correlations, POST /submissions/{id}/correlations/{entryId}/verdict, POST /submissions/{id}/file, ContentEdit apply/revert recompute, AdoptionCycle phase-advance sweep step S2"
    algorithm: weighted_scoring
    formula: |
      DENOMINATOR_SET = { s in StateStandard :
                            s.state_id == cycle.state_id
                        AND s.subject  == cycle.subject
                        AND s.grade_high >= title.grade_low
                        AND s.grade_low  <= title.grade_high }
      denominator = sum(s.weight for s in DENOMINATOR_SET)
      if denominator == 0: self_reported_coverage_pct = 0.00 and verified_coverage_pct = 0.00 (both variants)

      for each variant V with accepted verdict set VERDICTS(V):
        numerator = 0
        for s in DENOMINATOR_SET:
          candidates = { e in CorrelationEntry :
                            e.submission_id == submission.id
                        AND e.standard_code == s.standard_code
                        AND e.reviewer_verdict in VERDICTS(V) }
          if candidates is empty: contribute 0
          else:
            # order-sensitive selection, pinned: highest depth multiplier wins;
            # ties on the multiplier resolve to the earliest created_at (never id)
            best = max(candidates, key = (DEPTH_MULTIPLIERS[e.depth_level], -epoch(e.created_at)))
            numerator += s.weight * DEPTH_MULTIPLIERS[best.depth_level]
        coverage(V) = min(100.00, round_half_up(100 * numerator / denominator, 2))

      self_reported_coverage_pct = coverage(variant self_reported)
      verified_coverage_pct      = coverage(variant committee_verified)
      CorrelationEntry.effective_weight = round_half_up(standard.weight * DEPTH_MULTIPLIERS[entry.depth_level], 2)
    input_set: "StateStandard rows of the cycle's state and subject whose grade band overlaps the title's grade band; CorrelationEntry rows of this submission filtered by reviewer_verdict per variant. Entries citing a framework code outside the grade-band overlap are stored but contribute nothing."
    constants:
      DEPTH_MULTIPLIERS: { MENTION: 0.40, PRACTICE: 0.70, MASTERY: 1.00 }
    precision: "2 decimal places, round_half_up; percentage capped at 100.00"
    variants:
      - name: self_reported
        when: "gate for POST /submissions/{id}/file and the value stored in Submission.self_reported_coverage_pct"
        difference: "VERDICTS = {PENDING, ACCEPTED} - the publisher's own claim counts unreviewed evidence"
      - name: committee_verified
        when: "gate for the adoption branch of POST /presentation-slots/{id}/tally and the value stored in Submission.verified_coverage_pct"
        difference: "VERDICTS = {ACCEPTED} only - PENDING and INSUFFICIENT evidence is discarded, so the same rows yield a strictly lower or equal percentage"

  - name: state_net_price
    trigger: "POST /pricing-proposals"
    algorithm: tiered_pricing
    formula: |
      volume_discount_pct = 0.12 if projected_adoption_units >= 20000
                       else 0.07 if projected_adoption_units >= 5000
                       else 0.00
      term_discount_pct   = 0.06 if term_years >= 5
                       else 0.03 if term_years >= 3
                       else 0.00
      bundle_discount_pct = 0.00 if bundle_id is null
                       else 0.09 if bundle.component_count >= 4
                       else 0.05 if bundle.component_count >= 2
                       else 0.00
      total_discount_pct  = min(MAX_TOTAL_DISCOUNT_PCT,
                                volume_discount_pct + term_discount_pct + bundle_discount_pct)

      # PINNED ROUNDING ORDER: round each contract year to whole cents FIRST, then sum.
      # Summing the exact per-year decimals and rounding once at the end is WRONG and
      # differs by up to term_years - 1 cents.
      m = 1 + annual_escalator_bps / 10000            # exact decimal, no intermediate rounding
      year_price(y) = round_half_up(base_price_cents * m**(y-1) * (1 - total_discount_pct))
      net_state_price_cents  = sum(year_price(y) for y in 1..term_years)
      avg_annual_price_cents = round_half_up(net_state_price_cents / term_years)
    input_set: "The single PricingProposal being created plus its optional AncillaryBundle; no other proposal of the submission participates."
    constants:
      VOLUME_TIERS: { "20000+": 0.12, "5000-19999": 0.07, "0-4999": 0.00 }
      TERM_TIERS: { "5+": 0.06, "3-4": 0.03, "1-2": 0.00 }
      BUNDLE_TIERS: { "4+": 0.09, "2-3": 0.05, "1": 0.00, none: 0.00 }
      MAX_TOTAL_DISCOUNT_PCT: 0.20
    precision: "whole cents per contract year, round_half_up, before summing; total_discount_pct carried at 2 decimals"
    variants: []

  - name: order_total_value
    trigger: "POST /district-orders (variant quoted) and POST /district-orders/{id}/confirm (variant contracted)"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER - the freight waiver is decided on the PRE-freight
      # total t0, never on the final total, even though freight is part of the final
      # total. Testing the waiver against the post-freight total would flip orders
      # whose t0 sits just below the threshold.
      unit_price  = <per variant>
      seat_price  = proposal.digital_seat_price_cents if pricing_proposal_id is not null
                    else DEFAULT_OPEN_TERRITORY_SEAT_CENTS
      print_subtotal   = unit_price * print_units
      digital_subtotal = seat_price * digital_seats
      t0               = print_subtotal + digital_subtotal
      freight_surcharge_cents = 0 if t0 >= FREIGHT_WAIVER_THRESHOLD_CENTS
                                else round_half_up(print_subtotal * FREIGHT_RATE)
      rebate = round_half_up(print_subtotal * ADOPTED_LIST_REBATE_PCT)
                 if (variant == contracted and state.adoption_model == ADOPTION_LIST)
                 else 0
      total = t0 + freight_surcharge_cents - rebate
    input_set: "The order's own print_units and digital_seats, its Title, its StateProfile and, when present, its APPROVED PricingProposal. No other order participates."
    constants:
      FREIGHT_WAIVER_THRESHOLD_CENTS: 2500000
      FREIGHT_RATE: 0.015
      ADOPTED_LIST_REBATE_PCT: 0.02
      DEFAULT_OPEN_TERRITORY_SEAT_CENTS: 1200
    precision: "whole cents, round_half_up on freight and rebate independently"
    variants:
      - name: quoted
        when: "computed at POST /district-orders and stored in DistrictOrder.quoted_tcv_cents"
        difference: "unit_price = title.list_price_cents and rebate = 0 - the sales quote ignores the state-approved price and the adopted-list rebate"
      - name: contracted
        when: "computed at POST /district-orders/{id}/confirm and stored in DistrictOrder.contracted_tcv_cents"
        difference: "unit_price = proposal.avg_annual_price_cents when a proposal is attached (else title.list_price_cents) and the adopted-list rebate applies in ADOPTION_LIST states - identical inputs therefore produce a different total than the quote"

  - name: committee_tally
    trigger: "POST /presentation-slots/{id}/tally"
    algorithm: projection
    formula: |
      # Ballots are an append-only log; a member may re-vote. Project the log to one
      # ballot per member: latest created_at wins, and ties on created_at resolve by
      # the higher sequence_no (never by id).
      latest(member) = max(votes of member on this slot, key = (created_at, sequence_no))
      every other ballot of that member sets superseded = true
      counted            = { latest(member) for each distinct member_user_id }
      counted_vote_count = |counted|
      non_abstain        = { v in counted : v.vote != ABSTAIN }
      if counted_vote_count < panel.quorum_required: ERR_QUORUM_NOT_MET
      if |non_abstain| == 0: ERR_NO_COUNTABLE_VOTES

      weighted = count(v.vote == RECOMMEND)
               + CONDITIONS_WEIGHT * count(v.vote == RECOMMEND_WITH_CONDITIONS)
      recommend_ratio = round_half_up(weighted / |non_abstain|, 4)
      if recommend_ratio >= RECOMMEND_RATIO_THRESHOLD:
        tally_outcome = RECOMMEND_WITH_CONDITIONS if count(v.vote == RECOMMEND_WITH_CONDITIONS) > 0
                        else RECOMMEND
      else:
        tally_outcome = REJECT
    input_set: "Non-superseded CommitteeVote rows on this slot only; abstentions count toward quorum but are excluded from the ratio denominator."
    constants:
      CONDITIONS_WEIGHT: 0.5
      RECOMMEND_RATIO_THRESHOLD: 0.6667
    precision: "recommend_ratio at 4 decimals, round_half_up; comparison is >= (a ratio of exactly 2/3 rounds to 0.6667 and therefore recommends)"
    variants: []

  - name: comment_response_obligation
    trigger: "POST /submissions/{id}/public-comments (sets response_due_at), POST /public-comments/{id}/response, AdoptionCycle phase-advance sweep step S1"
    algorithm: threshold
    formula: |
      response_due_at = comment.created_at + state.comment_response_days * 86400 seconds
      overdue(comment) = clock_now >= response_due_at            # inclusive boundary
      on sweep S1: status OPEN and overdue -> ESCALATED, was_overdue_at_response = true
      on response: was_overdue_at_response = (status == ESCALATED) or overdue(comment)
      submission.unresolved_critical_count =
        count(c : c.submission_id == submission.id
                  and c.severity == CRITICAL
                  and c.status in {OPEN, ESCALATED})
      submission.overdue_response_count =
        count(c : c.submission_id == submission.id
                  and (c.status == ESCALATED
                       or (c.status == RESPONDED and c.was_overdue_at_response)))
    input_set: "All PublicComment rows of the submission regardless of category; severity filters only the critical counter."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "whole seconds; the overdue test is inclusive (>=), so a response landing exactly at response_due_at is overdue"
    variants: []

  - name: compliance_score
    trigger: "POST /submissions, POST /submissions/{id}/file, ContentEdit apply and revert, POST /public-comments/{id}/response, AdoptionCycle phase-advance sweep step S2"
    algorithm: aggregation
    formula: |
      neutralised_prohibited = { e.topic_code : e in ContentEdit
                                   where e.title_id == submission.title_id
                                     and e.state_id == cycle.state_id
                                     and e.edit_type == REMOVE_PROHIBITED_TAG
                                     and e.status == APPLIED }
      supplied_topics        = title.content_tags
                               UNION { e.topic_code : e in ContentEdit
                                         where e.title_id == submission.title_id
                                           and e.state_id == cycle.state_id
                                           and e.edit_type == ADD_REQUIRED_TOPIC
                                           and e.status == APPLIED }
      prohibited_hit_count = |{ t in state.prohibited_content_tags :
                                  t in title.content_tags and t not in neutralised_prohibited }|
      missing_required_topic_count = |{ t in state.required_topics : t not in supplied_topics }|
      compliance_score = max(0,
          100 - PENALTY_PROHIBITED   * prohibited_hit_count
              - PENALTY_MISSING_TOPIC* missing_required_topic_count
              - PENALTY_CRITICAL     * unresolved_critical_count
              - PENALTY_OVERDUE      * overdue_response_count)
      adoption_blocked = (compliance_score < BLOCK_THRESHOLD)
                         or (prohibited_hit_count > 0)
                         or (content_pin_stale == true)
    input_set: "The submission's StateProfile, its Title's current content_tags, ContentEdit rows for that (title, state) pair with status APPLIED only, and the submission's own comment counters."
    constants:
      PENALTY_PROHIBITED: 25
      PENALTY_MISSING_TOPIC: 10
      PENALTY_CRITICAL: 15
      PENALTY_OVERDUE: 5
      BLOCK_THRESHOLD: 70
    precision: "integer score, floored at 0; the block test is strict (< 70 blocks, exactly 70 does not)"
    variants: []

  - name: sampling_fulfilment
    trigger: "POST /submissions, POST /submissions/{id}/sampling-shipments"
    algorithm: aggregation
    formula: |
      required = state.sampling_copies_required
      sample_copies_shipped = sum(units of every accepted sampling shipment on this submission)
      sampling_status = NOT_REQUIRED if required == 0
                   else SHIPPED      if sample_copies_shipped >= required
                   else PARTIAL      if sample_copies_shipped > 0
                   else PENDING
      each shipment also moves title.on_hand_units -= units and title.sample_reserved_units += units
    input_set: "Accepted sampling shipments of this submission only; shipments never roll over between submissions."
    constants: {}
    precision: "whole units; the SHIPPED test is inclusive (>=)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body and query shape: required fields present, types correct, enum members valid, numeric ranges honored, ISO-8601 datetimes parseable, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "{id} of a /state-profiles path resolves to a StateProfile"
    error_id: ERR_STATE_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /state-profiles/{id}, POST /state-profiles/{id}/standards, GET /state-profiles/{id}/standards"
  - priority: 5
    category: existence
    check: "{id} of an /adoption-cycles path resolves to an AdoptionCycle"
    error_id: ERR_ADOPTION_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /adoption-cycles/{id}, POST /adoption-cycles/{id}/phase-advance, GET /adoption-cycles/{id}/panels"
  - priority: 6
    category: existence
    check: "{id} of a /titles path resolves to a Title"
    error_id: ERR_TITLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /titles/{id}, POST /titles/{id}/release, POST /titles/{id}/inventory-adjustments, POST /titles/{id}/revision-plan, POST|GET /titles/{id}/ancillary-bundles"
  - priority: 7
    category: existence
    check: "{id} of a /content-edits path resolves to a ContentEdit"
    error_id: ERR_CONTENT_EDIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /content-edits/{id}, POST /content-edits/{id}/review, POST /content-edits/{id}/resubmit, POST /content-edits/{id}/apply, POST /content-edits/{id}/revert"
  - priority: 8
    category: existence
    check: "{id} of a /submissions path resolves to a Submission"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /submissions/{id} and every /submissions/{id}/... sub-resource"
  - priority: 9
    category: existence
    check: "{entryId} resolves to a CorrelationEntry whose submission_id equals the path {id}"
    error_id: ERR_CORRELATION_ENTRY_NOT_FOUND
    http_status: 404
