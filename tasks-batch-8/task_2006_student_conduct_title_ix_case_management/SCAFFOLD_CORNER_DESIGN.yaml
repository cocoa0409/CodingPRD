          trigger:
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "COMPLAINANT", response_text: "first" }, as: Party, as_user_id: "${comp_id}", captures: { st1: $.data.status } }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "RESPONDENT", response_text: "second" }, as: Party, as_user_id: "${resp_id}", captures: { st2: $.data.status } }
          assert:
