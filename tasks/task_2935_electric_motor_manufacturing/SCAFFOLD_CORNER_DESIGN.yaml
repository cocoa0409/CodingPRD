              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o1_id: $.data.id }
            - call: "POST /customer-orders/${o1_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /work-orders"
              payload: { order_id: "${o1_id}", design_id: "${d1_id}", unit_count: 12, expected_design_version: "${d1_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id }
            - call: "POST /stator-builds"
              payload: { work_order_id: "${wo1_id}", insulation_system: "CLASS_F_POLYESTERIMIDE", slot_fill_pct: 82.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { sb1_id: $.data.id }
            - call: "POST /stator-builds/${sb1_id}/impregnate"
              payload: { oven_id: "${oven_a_id}", impregnation_window_start: "2026-08-01T02:00:00.000Z", impregnation_window_end: "2026-08-01T06:00:00.000Z", varnish_process: "VPI", varnish_cycles: 2, cure_temp_c: 165.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "POST /stator-builds/${sb1_id}/surge-test"
              payload: { surge_test_kv: 2.40 }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /stator-builds/${sb1_id}/disposition"
              payload: { disposition: "ACCEPTED" }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /rotor-builds"
              payload: { work_order_id: "${wo1_id}" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb1_id: $.data.id }
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "DIE_CAST", melt_temp_c: 700.0, die_preheat_c: 250.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "POST /rotor-builds/${rb1_id}/machine"
              payload: { measured_rotor_od_mm: 134.500, rotor_mass_kg: 18.6 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "POST /rotor-builds/${rb1_id}/balance-disposition"
              payload: { disposition: "ACCEPTED", balance_grade: "G2_5", initial_unbalance_g_mm: 1200.0, residual_unbalance_g_mm: 296.0 }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /assembly-records"
              payload: { work_order_id: "${wo1_id}", stator_build_id: "${sb1_id}", rotor_build_id: "${rb1_id}", de_bearing_lot: "DE-2026-0431", nde_bearing_lot: "NDE-2026-0177", bearing_install_method: "INDUCTION_HEAT", shaft_measured_diameter_mm: 38.010, grease_fill_pct: 50.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "GET /work-orders/${wo1_id}"
              payload: {}
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { wo1_v: $.data.version }
          trigger:
            - call: "POST /performance-tests"
              payload: { work_order_id: "${wo1_id}", test_cell_id: "${cell_1_id}", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-01T12:00:00.000Z", dyno_draw_kw: 8.0, test_method: "IEC_60034_2_1_SUMMATION", expected_work_order_version: "${wo1_v} - 1" }
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { e_one_behind: $.data.error_id }
            - call: "POST /performance-tests"
              payload: { work_order_id: "${wo1_id}", test_cell_id: "${cell_1_id}", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-01T12:00:00.000Z", dyno_draw_kw: 8.0, test_method: "IEC_60034_2_1_SUMMATION", expected_work_order_version: "${wo1_v}" }
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { pt1_id: $.data.id }
            - call: "POST /performance-tests"
              payload: { work_order_id: "${wo1_id}", test_cell_id: "${cell_1_id}", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-01T12:00:00.000Z", dyno_draw_kw: 8.0, test_method: "IEEE_112_B_DYNAMOMETER", expected_work_order_version: "${wo1_v}" }
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { e_replayed: $.data.error_id }
            - call: "GET /work-orders/${wo1_id}"
              payload: {}
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { wo1_v2: $.data.version }
            - call: "POST /performance-tests"
              payload: { work_order_id: "${wo1_id}", test_cell_id: "${cell_1_id}", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-01T12:00:00.000Z", dyno_draw_kw: 8.0, test_method: "IEEE_112_B_DYNAMOMETER", expected_work_order_version: "${wo1_v2}" }
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { pt2_id: $.data.id }
          assert:
            - "${e_one_behind} == ERR_STALE_WORK_ORDER_VERSION with HTTP 412 and GET /performance-tests returns total_count == 0"
            - "trigger 2 returns HTTP 201 with PerformanceTest.${pt1_id}.status == SCHEDULED, requires_requalification == false and TestCell.${cell_1_id}.peak_reserved_kw == 8.0"
            - "WorkOrder.${wo1_id}.version == ${wo1_v} + 1 after trigger 2"
            - "${e_replayed} == ERR_STALE_WORK_ORDER_VERSION with HTTP 412 — the same value that worked one call earlier is now stale, and PerformanceTest.${pt1_id}.status is still SCHEDULED"
            - "${wo1_v2} == ${wo1_v} + 1"
            - "trigger 5 returns HTTP 201 with PerformanceTest.${pt2_id}.status == SCHEDULED and test_method == IEEE_112_B_DYNAMOMETER"
            - "PerformanceTest.${pt1_id}.status == SUPERSEDED and TestCell.${cell_1_id}.peak_reserved_kw == 8.0 (the superseded row leaves the counted set)"
            - "GET /performance-tests with work_order_id == ${wo1_id} returns total_count == 2"

      - name: work_order_creation_guard_on_the_pinned_design_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[work-order-create-stale-design]
          - errors[ERR_STALE_DESIGN_VERSION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / work_order_creation_blocked_while_pinned_design_sits_in_review
          rationale: "That §1.8 instance covers the other §1.2.1 rule end to end: stale version refused, current version accepted."

      - name: order_cancellation_propagates_through_every_declared_hop
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CustomerOrder.transitions.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / order_cancel_cascades_to_workorder_stator_and_oven_ledger
          rationale: "That §1.8 instance verifies the full three-hop chain and the ledger reconciliation it triggers."

      - name: the_two_efficiency_determination_methods_disagree_on_one_measurement_set
        claim_type: dual_variant_calculation
        grounds:
          - calculations.test_measured_efficiency
        excluded_because:
          difficulty_instance: dual_variant_calc / test_summation_vs_direct_efficiency_divergence_at_40c
          rationale: "That §1.8 instance records the same bench numbers under both test_method variants and asserts the divergent efficiencies and classes."

      - name: cumulative_dynamometer_draw_crosses_the_cell_ceiling_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.test_cell_capacity_ledger
          - errors[ERR_TEST_CELL_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / test_cell_aggregate_draw_over_half_open_windows_at_exact_capacity
          rationale: "That §1.8 instance tests the aggregate at exactly the ceiling and one tenth of a kilowatt beyond it."

  # ===========================================================================
  # Consistency model — immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_mutation_is_visible_in_its_own_response_and_in_an_immediate_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.order_lead_time
          - calculations.distributor_allowance_ledger
          - calculations.work_order_cost
        distinguishing_aspect: |
          Under immediate consistency a write's own response and a read issued straight afterwards
          must agree field for field, including values the write only derived indirectly: the
          confirm response carries the recomputed 29-day promise, and the distributor row shows the
          debited allowance in the very next call with no settling period; likewise the work-order
          creation response already carries the full 2351712-cent standard cost roll-up.
        test_recipe:
          setup:
            - "Distributor GOLD/EU enrolled with committed_annual_units 500 and design D1 RELEASED; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { dist_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o1_id: $.data.id }
          trigger:
            - call: "POST /customer-orders/${o1_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { confirm_days: $.data.promised_lead_time_days, confirm_date: $.data.promised_ship_date }
            - call: "GET /customer-orders/${o1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { read_days: $.data.promised_lead_time_days, read_date: $.data.promised_ship_date }
            - call: "GET /distributors/${dist_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { read_outstanding: $.data.units_outstanding, read_allowance: $.data.stock_allowance_remaining_units }
            - call: "POST /work-orders"
              payload: { order_id: "${o1_id}", design_id: "${d1_id}", unit_count: 12, expected_design_version: "${d1_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id, create_standard: $.data.standard_cost_cents }
            - call: "GET /work-orders/${wo1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { read_standard: $.data.standard_cost_cents }
            - call: "GET /work-orders/${wo1_id}/cost-summary"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { summary_standard: $.data.standard_cost_cents }
          assert:
            - "${confirm_days} == 29 and ${confirm_date} == 2026-08-30 in the confirm response itself"
            - "${read_days} == ${confirm_days} == 29 and ${read_date} == ${confirm_date} == 2026-08-30 in the immediately following read"
            - "${read_outstanding} == 12 and ${read_allowance} == 488 — the allowance debit is visible in the next call with no settling period"
            - "${create_standard} == 2351712 in the work-order creation response, with direct_cost_cents == 1795200, overhead_band == COMPLEX and actual_cost_cents == 2351712"
            - "${read_standard} == ${create_standard} == 2351712 and ${summary_standard} == 2351712 — all three surfaces agree in the same request sequence"
            - "CustomerOrder.${o1_id}.status == CONFIRMED with confirmed_at non-null, and WorkOrder.${wo1_id}.build_status == RELEASED with certification_status == PENDING and design_pin_stale == false"
