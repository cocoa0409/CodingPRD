scenario: "2832. Inland Marine & Equipment Floater Underwriting (inland marine underwriting unit): scheduled versus blanket equipment coverage with valuation basis choices, contractors equipment rate development from equipment age, type and territory, rented and leased equipment coverage limits and loss-of-use extensions, installation floater coverage terminating at acceptance or occupancy, theft controls, geo-tracking credits and jobsite security requirements, transit coverage across owned and hired vehicles with catastrophe limits, inventory reporting forms with periodic value reporting and penalty for underreporting, claim adjustment on total loss versus repair and salvage recovery"
domain_name: inland-marine-equipment-floater-underwriting
api_prefix: "/inland-marine"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: hybrid
  # Policy -> CoveragePart -> {EquipmentItem, InstallationFloater, TransitShipment, ValueReport}
  # is a strict ownership tree, but Jobsite, Vehicle and RateRule are policy-independent
  # peers referenced across the tree, Claim is a cross-aggregate child that points at a
  # Policy plus exactly one polymorphic loss subject, and ValueReport points at itself
  # (supersede chain).

  state_machine_shape: parallel
  # Claim carries two independent axes (adjustment_status x salvage_status) that join at
  # CLOSED; Policy is cyclic (QUOTED->REFERRED->QUOTED and IN_FORCE->SUSPENDED->IN_FORCE);
  # InstallationFloater is branching (ACTIVE -> ACCEPTANCE | OCCUPANCY | EXPIRED | VOIDED
  # with divergent side-effect sets per branch).

  relationship_patterns:
    - one_to_many          # Policy -> CoveragePart -> EquipmentItem
    - self_referential     # ValueReport.superseded_by_report_id -> ValueReport.id
    - polymorphic          # Claim points at exactly one of EquipmentItem / TransitShipment / InstallationFloater
    - cross_aggregate      # EquipmentItem.assigned_jobsite_id and TransitShipment.vehicle_id leave the Policy tree

  role_model: segregation_of_duties
  # The Underwriter who refers a policy cannot decide the referral; the ClaimsAdjuster who
  # declares a total loss cannot authorize its settlement. Both are enforced on X-User-ID.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: policyholder_name
        type: string
        source: input
        description: "Named insured on the inland marine policy."
        constraints: "1-120 characters, non-blank"
      - name: territory_code
        type: enum
        source: input
        description: "Rating territory of the policy garaging address; used as the rate-development territory for every EquipmentItem that has no assigned jobsite."
        constraints: "one of T1_COASTAL, T2_URBAN, T3_INLAND, T4_REMOTE"
      - name: effective_date
        type: string
        source: input
        description: "First day of the policy term, ISO 8601 calendar date (YYYY-MM-DD)."
      - name: expiration_date
        type: string
        source: input
        description: "Day the policy term ends, ISO 8601 calendar date (YYYY-MM-DD); exclusive, so term_days = expiration_date - effective_date in whole days."
        constraints: "strictly greater than effective_date"
      - name: term_days
        type: integer
        source: computed
        description: "(expiration_date - effective_date) in whole days; the pro-rata denominator for every endorsement and cancellation calculation."
      - name: minimum_premium_cents
        type: integer
        source: input
        description: "Policy minimum premium floor applied at the very end of policy_written_premium."
        default: 250000
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Policy lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, QUOTED, REFERRED, DECLINED, BOUND, IN_FORCE, SUSPENDED, CANCELLED, EXPIRED"
      - name: referral_required
        type: boolean
        source: computed
        description: "True when written_premium_cents >= REFERRAL_PREMIUM_THRESHOLD_CENTS (5000000) OR total_insured_value_cents > REFERRAL_TIV_THRESHOLD_CENTS (50000000); recomputed on every quote."
        default: false
      - name: referral_status
        type: enum
        source: system
        description: "Referral disposition; NOT_REQUIRED until refer is called, PENDING while awaiting the UnderwritingManager decision."
        default: NOT_REQUIRED
        constraints: "one of NOT_REQUIRED, PENDING, APPROVED, DECLINED"
      - name: referred_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Underwriter who called refer; null before referral. Compared against the deciding UnderwritingManager for segregation of duties."
        default: null
      - name: referral_decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UnderwritingManager who decided the referral; null before the decision."
        default: null
      - name: sum_of_part_premiums_cents
        type: integer
        source: computed
        description: "Sum of rated_premium_cents over CoveragePart rows with status ACTIVE; the pre-load subtotal pinned by policy_written_premium."
        default: 0
      - name: scheduled_basis_premium_cents
        type: integer
        source: computed
        description: "Policy-level roll-up of the SCHEDULED variant of coverage_part_equipment_premium for every equipment coverage part, loaded and floored exactly like written_premium_cents."
        default: 0
      - name: blanket_basis_premium_cents
        type: integer
        source: computed
        description: "Policy-level roll-up of the BLANKET variant of coverage_part_equipment_premium for every equipment coverage part, loaded and floored exactly like written_premium_cents."
        default: 0
      - name: written_premium_cents
        type: integer
        source: computed
        description: "Annual written premium actually charged: the loaded, minimum-floored roll-up produced by policy_written_premium using each part's own rating_basis."
        default: 0
      - name: premium_balance_cents
        type: integer
        source: computed
        description: "Conserved premium quantity: SUM(LedgerEntry.amount_cents) over entries with this policy_id and ledger == PREMIUM."
        default: 0
      - name: incurred_loss_cents
        type: integer
        source: computed
        description: "Conserved loss quantity: SUM(LedgerEntry.amount_cents) over entries with this policy_id and ledger == LOSS."
        default: 0
      - name: total_insured_value_cents
        type: integer
        source: computed
        description: "SUM(EquipmentItem.insured_value_cents) over items whose coverage part belongs to this policy and whose status IN {RATED, ACTIVE}."
        default: 0
      - name: occupancy_termination_count
        type: integer
        source: system
        description: "Count of InstallationFloater rows on this policy terminated with reason OCCUPANCY; incremented by the OCCUPANCY branch only."
        default: 0
      - name: cancellation_reason
        type: enum
        source: system
        description: "Reason recorded by the cancel action; null while the policy is not CANCELLED."
        default: null
        constraints: "one of INSURED_REQUEST, NON_REPORTING, UNDERWRITING"
      - name: cancel_effective_date
        type: string
        source: system
        description: "ISO 8601 calendar date the cancellation takes effect; null while the policy is not CANCELLED."
        default: null
      - name: quoted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent successful quote; ISO 8601 UTC with three fractional digits."
        default: null
      - name: bound_at
        type: datetime
        source: system
        description: "Logical-clock instant of bind."
        default: null
      - name: in_force_at
        type: datetime
        source: system
        description: "Logical-clock instant of activate."
        default: null

  - name: CoveragePart
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; supplied by the path on creation."
      - name: part_type
        type: enum
        source: input
        description: "Which inland marine coverage this part provides. Determines which rating calculation runs and which child rows may be attached."
        constraints: "one of SCHEDULED_EQUIPMENT, BLANKET_EQUIPMENT, RENTED_LEASED, INSTALLATION_FLOATER, TRANSIT, REPORTING_FORM"
      - name: valuation_basis
        type: enum
        source: input
        description: "Default loss-valuation basis for the part; every EquipmentItem inherits it unless the item overrides it."
        constraints: "one of ACV, REPLACEMENT_COST, AGREED_VALUE, STATED_AMOUNT"
      - name: rating_basis
        type: enum
        source: input
        description: "Selects the variant of coverage_part_equipment_premium that sets rated_premium_cents. Ignored by part types other than SCHEDULED_EQUIPMENT and BLANKET_EQUIPMENT."
        default: SCHEDULED
        constraints: "one of SCHEDULED, BLANKET"
      - name: deductible_cents
        type: integer
        source: input
        description: "Per-occurrence deductible subtracted inside claim_settlement_amount."
        default: 100000
        constraints: ">= 0"
      - name: blanket_limit_cents
        type: integer
        source: input
        description: "Single blanket limit applying to all items on the part; required when rating_basis == BLANKET and used as the applicable limit for BLANKET_EQUIPMENT claims."
        default: null
      - name: coinsurance_pct_bp
        type: integer
        source: input
        description: "Coinsurance percentage in basis points (9000 == 90%); gates the BLANKET_COINSURANCE_CREDIT_BP credit at exactly 9000."
        default: null
        constraints: "null or 5000..10000"
      - name: per_item_limit_cents
        type: integer
        source: input
        description: "Maximum insured value allowed for any single RENTED or LEASED item on this part and the applicable claim limit for RENTED_LEASED losses; required when part_type == RENTED_LEASED."
        default: null
      - name: aggregate_limit_cents
        type: integer
        source: input
        description: "Conserved capacity quantity for the part: aggregate_limit_cents == aggregate_available_cents + aggregate_paid_net_cents at all times."
        constraints: "> 0"
      - name: aggregate_available_cents
        type: integer
        source: computed
        description: "Remaining aggregate capacity; initialised to aggregate_limit_cents, debited on claim settlement and credited back by salvage recovery."
      - name: aggregate_paid_net_cents
        type: integer
        source: computed
        description: "SUM(Claim.settlement_paid_cents) minus SUM(Claim.salvage_proceeds_cents credited) for claims on this part."
        default: 0
      - name: loss_of_use_daily_limit_cents
        type: integer
        source: input
        description: "Daily loss-of-use benefit for RENTED or LEASED equipment; required when part_type == RENTED_LEASED."
        default: null
      - name: loss_of_use_max_days
        type: integer
        source: input
        description: "Maximum number of loss-of-use days payable on one occurrence; required when part_type == RENTED_LEASED."
        default: null
        constraints: "null or >= 1"
      - name: transit_owned_limit_cents
        type: integer
        source: input
        description: "Transit limit for conveyances on Vehicle rows with ownership OWNED; required when part_type == TRANSIT."
        default: null
      - name: transit_hired_limit_cents
        type: integer
        source: input
        description: "Transit limit for conveyances on Vehicle rows with ownership HIRED; required when part_type == TRANSIT."
        default: null
      - name: catastrophe_limit_cents
        type: integer
        source: input
        description: "Catastrophe sub-limit that caps recovery for shipments flagged catastrophe_zone and drives the transit catastrophe surcharge; required when part_type == TRANSIT."
        default: null
      - name: reporting_frequency
        type: enum
        source: input
        description: "Cadence of the inventory reporting form; required when part_type == REPORTING_FORM."
        default: null
        constraints: "one of MONTHLY, QUARTERLY"
      - name: reporting_annual_rate_bp
        type: integer
        source: input
        description: "Annual rate in basis points applied to each period's reported values; required when part_type == REPORTING_FORM."
        default: null
      - name: reporting_limit_cents
        type: integer
        source: input
        description: "Limit of insurance on reported values and the applicable claim limit for REPORTING_FORM losses; required when part_type == REPORTING_FORM."
        default: null
      - name: deposit_premium_cents
        type: integer
        source: computed
        description: "Deposit premium held for a REPORTING_FORM part. Set by POST /inland-marine/policies/{id}/quote to the part's freshly computed rated_premium_cents when part_type == REPORTING_FORM; remains null for every other part_type and for any REPORTING_FORM part that has never been quoted."
        default: null
      - name: earned_reported_premium_cents
        type: integer
        source: computed
        description: "Running total of period_earned_premium_cents over ValueReport rows on this part with status IN {ACCEPTED, PENALIZED}."
        default: 0
      - name: latest_report_period_end_date
        type: string
        source: computed
        description: "period_end_date of the ValueReport on this part with the greatest period_end_date among status IN {SUBMITTED, ACCEPTED, PENALIZED, DELINQUENT}; ties broken by greatest created_at. Null when the part has no such report."
        default: null
      - name: rated_premium_cents
        type: integer
        source: computed
        description: "Annual premium for this part, produced by whichever part-type calculation applies."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the part contributes premium; VOID after the policy is declined or cancelled."
        default: ACTIVE
        constraints: "one of ACTIVE, VOID"

  - name: RateRule
    parent: null
    common_fields: true
    fields:
      - name: equipment_type
        type: enum
        source: input
        description: "Contractors equipment class this rule prices."
        constraints: "one of EXCAVATOR, CRANE, LOADER, DOZER, GENERATOR, COMPRESSOR, SCAFFOLDING, SURVEY_INSTRUMENT"
      - name: territory_code
        type: enum
        source: input
        description: "Territory this rule prices."
        constraints: "one of T1_COASTAL, T2_URBAN, T3_INLAND, T4_REMOTE"
      - name: age_band_min_years
        type: integer
        source: input
        description: "Inclusive lower bound of the equipment age band, in whole years."
        constraints: ">= 0"
      - name: age_band_max_years
        type: integer
        source: input
        description: "Inclusive upper bound of the equipment age band, in whole years."
        constraints: ">= age_band_min_years"
      - name: base_rate_bp
        type: integer
        source: input
        description: "Base rate in basis points of insured value (185 == 1.85% == $1.85 per $100 of insured value)."
        constraints: "> 0"
      - name: theft_hazard_grade
        type: enum
        source: input
        description: "Theft hazard grade for this class/territory; selects THEFT_FACTOR_BP and decides whether a geo-tracker earns the high or low geo-tracking credit."
        constraints: "one of A, B, C, D"
      - name: replacement_cost_index_bp
        type: integer
        source: input
        description: "Replacement-cost index in basis points applied to original_cost_cents when the valuation basis is REPLACEMENT_COST."
        default: 11000
        constraints: ">= 10000"
      - name: status
        type: enum
        source: system
        description: "Only PUBLISHED rules may be selected by equipment rate development."
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, RETIRED"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publish; null while DRAFT."
        default: null

  - name: EquipmentItem
    parent: CoveragePart
    common_fields: true
    fields:
      - name: coverage_part_id
        type: string
        source: input
        description: "FK -> CoveragePart.id; supplied by the path on creation."
      - name: assigned_jobsite_id
        type: string
        source: input
        description: "FK -> Jobsite.id; null until assign-jobsite runs. When set, the jobsite's territory_code replaces the policy territory in rate development and the jobsite's security_tier earns the jobsite security credit."
        default: null
      - name: applied_rate_rule_id
        type: string
        source: computed
        description: "FK -> RateRule.id; the PUBLISHED rule selected by the rate_rule_selection rule at the most recent rating of this item."
      - name: description
        type: string
        source: input
        description: "Free-text unit description shown on the schedule."
        constraints: "1-160 characters, non-blank"
      - name: equipment_type
        type: enum
        source: input
        description: "Equipment class; must match a PUBLISHED RateRule together with the effective territory and age."
        constraints: "one of EXCAVATOR, CRANE, LOADER, DOZER, GENERATOR, COMPRESSOR, SCAFFOLDING, SURVEY_INSTRUMENT"
      - name: model_year
        type: integer
        source: input
        description: "Model year of the unit; age_years_at_rating is derived from it and the logical clock."
        constraints: "1950..2100"
      - name: original_cost_cents
        type: integer
        source: input
        description: "Original cost new, in cents; the depreciation and replacement-cost bases."
        constraints: "> 0"
      - name: stated_value_cents
        type: integer
        source: input
        description: "Agreed or stated amount in cents; required when the effective valuation basis is AGREED_VALUE or STATED_AMOUNT, ignored otherwise."
        default: null
      - name: ownership
        type: enum
        source: input
        description: "OWNED units may sit on any equipment part; RENTED and LEASED units are only permitted on a RENTED_LEASED part and are the only units eligible for the loss-of-use extension."
        default: OWNED
        constraints: "one of OWNED, RENTED, LEASED"
      - name: geo_tracker_installed
        type: boolean
        source: input
        description: "True when a telematics geo-tracking unit is fitted; earns GEO_CREDIT_BP_HIGH_HAZARD on theft grades A and B, GEO_CREDIT_BP_LOW_HAZARD on grades C and D."
        default: false
      - name: valuation_basis
        type: enum
        source: input
        description: "Item-level override of the parent CoveragePart.valuation_basis; when omitted the parent part's basis is copied onto the item at creation."
        default: null
        constraints: "one of ACV, REPLACEMENT_COST, AGREED_VALUE, STATED_AMOUNT"
      - name: age_years_at_rating
        type: integer
        source: computed
        description: "calendar_year(logical clock at rating) - model_year, floored at 0."
      - name: insured_value_cents
        type: integer
        source: computed
        description: "Output of equipment_insured_value for the effective valuation basis; the schedule value and the SCHEDULED_EQUIPMENT applicable claim limit."
      - name: applied_base_rate_bp
        type: integer
        source: computed
        description: "base_rate_bp copied from the selected RateRule at the most recent rating; the weighting input of the BLANKET variant."
      - name: applied_credit_bp
        type: integer
        source: computed
        description: "Capped theft-control credit actually applied: min(CREDIT_CAP_BP, geo credit + jobsite security credit)."
        default: 0
      - name: rated_premium_cents
        type: integer
        source: computed
        description: "Output of equipment_item_premium, rounded to whole cents; the per-item summand of the SCHEDULED variant."
      - name: status
        type: enum
        source: system
        description: "RATED on creation, ACTIVE once the item is put on risk, REMOVED when endorsed off, TOTALED when a total-loss claim on it settles."
        default: RATED
        constraints: "one of RATED, ACTIVE, REMOVED, TOTALED"
      - name: removed_at
        type: datetime
        source: system
        description: "Logical-clock instant the item left the schedule (REMOVED or TOTALED)."
        default: null

  - name: Jobsite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Jobsite label."
        constraints: "1-120 characters, non-blank"
      - name: territory_code
        type: enum
        source: input
        description: "Territory of the jobsite; overrides the policy territory in rate development for every item assigned here."
        constraints: "one of T1_COASTAL, T2_URBAN, T3_INLAND, T4_REMOTE"
      - name: fenced
        type: boolean
        source: input
        description: "Perimeter fencing present; recorded by security-survey. Worth JOBSITE_SCORE_FENCED (1) in the security score."
        default: false
      - name: lighting
        type: boolean
        source: input
        description: "Night lighting present; recorded by security-survey. Worth JOBSITE_SCORE_LIGHTING (1)."
        default: false
      - name: alarm_monitored
        type: boolean
        source: input
        description: "Central-station alarm monitoring present; recorded by security-survey. Worth JOBSITE_SCORE_ALARM (1)."
        default: false
      - name: guarded_24h
        type: boolean
        source: input
        description: "24-hour guard service present; recorded by security-survey. Worth JOBSITE_SCORE_GUARDED (2)."
        default: false
      - name: security_score
        type: integer
        source: computed
        description: "Sum of the four survey weights; the input of jobsite_security_tier."
        default: 0
      - name: security_tier
        type: enum
        source: computed
        description: "Output of jobsite_security_tier; drives the jobsite security credit, the installation floater security factor, and the TIER_0 activation bar."
        default: TIER_0
        constraints: "one of TIER_0, TIER_1, TIER_2, TIER_3"
      - name: status
        type: enum
        source: system
        description: "UNSURVEYED until security-survey runs, SURVEYED while at least one non-terminal floater is attached or none has been attached yet, RELEASED once active_floater_count falls back to 0 from a positive value."
        default: UNSURVEYED
        constraints: "one of UNSURVEYED, SURVEYED, RELEASED"
      - name: active_floater_count
        type: integer
        source: computed
        description: "COUNT(InstallationFloater rows with this jobsite_id and status IN {PENDING, ACTIVE})."
        default: 0
      - name: surveyed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent security-survey."
        default: null

  - name: InstallationFloater
    parent: CoveragePart
    common_fields: true
    fields:
      - name: coverage_part_id
        type: string
        source: input
        description: "FK -> CoveragePart.id; supplied by the path on creation. The part_type must be INSTALLATION_FLOATER."
      - name: jobsite_id
        type: string
        source: input
        description: "FK -> Jobsite.id; the site whose closed coverage-date intervals this floater must not collide with."
      - name: project_name
        type: string
        source: input
        description: "Installation project label."
        constraints: "1-120 characters, non-blank"
      - name: installed_value_limit_cents
        type: integer
        source: input
        description: "Limit of insurance on the installed property; the applicable claim limit for INSTALLATION_FLOATER losses."
        constraints: "> 0"
      - name: coverage_start_date
        type: string
        source: input
        description: "First covered day, ISO 8601 calendar date. Jobsite overlap treats [coverage_start_date, coverage_end_date] as a CLOSED interval."
      - name: coverage_end_date
        type: string
        source: input
        description: "Last covered day, ISO 8601 calendar date, inclusive for overlap purposes. term_days for premium is (coverage_end_date - coverage_start_date) in whole days."
        constraints: "strictly greater than coverage_start_date"
      - name: term_days
        type: integer
        source: computed
        description: "(coverage_end_date - coverage_start_date) in whole days; the pro-rata numerator of installation_floater_premium."
      - name: rated_premium_cents
        type: integer
        source: computed
        description: "Output of installation_floater_premium at creation, using the jobsite's security_tier at that instant."
      - name: earned_premium_cents
        type: integer
        source: computed
        description: "Premium retained at termination; the ACCEPTANCE branch earns pro rata to termination_date while the OCCUPANCY branch earns the whole rated_premium_cents."
        default: 0
      - name: unearned_return_cents
        type: integer
        source: computed
        description: "rated_premium_cents - earned_premium_cents; the absolute value of the ENDORSEMENT_RETURN ledger entry written by termination."
        default: 0
      - name: termination_trigger
        type: enum
        source: system
        description: "Which branch terminated the floater; null while PENDING or ACTIVE."
        default: null
        constraints: "one of ACCEPTANCE, OCCUPANCY, EXPIRY, CANCELLATION"
      - name: termination_date
        type: string
        source: system
        description: "ISO 8601 calendar date the coverage ceased; null while PENDING or ACTIVE."
        default: null
      - name: status
        type: enum
        source: system
        description: "Floater lifecycle state."
        default: PENDING
        constraints: "one of PENDING, ACTIVE, TERMINATED_ACCEPTANCE, TERMINATED_OCCUPANCY, EXPIRED, VOIDED"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: unit_label
        type: string
        source: input
        description: "Conveyance label."
        constraints: "1-60 characters, non-blank"
      - name: ownership
        type: enum
        source: input
        description: "OWNED conveyances draw the part's transit_owned_limit_cents and the owned transit rate; HIRED conveyances draw transit_hired_limit_cents, the hired rate, and require a carrier approval expiry."
        constraints: "one of OWNED, HIRED"
      - name: carrier_name
        type: string
        source: input
        description: "Motor carrier name; required when ownership == HIRED."
        default: null
      - name: per_conveyance_limit_cents
        type: integer
        source: input
        description: "Maximum aggregate declared value this conveyance may carry on one UTC calendar date."
        constraints: "> 0"
      - name: approval_expires_on
        type: string
        source: input
        description: "ISO 8601 calendar date the carrier approval lapses; required when ownership == HIRED. A shipment may not depart on or after this date."
        default: null
      - name: status
        type: enum
        source: system
        description: "PENDING_APPROVAL on creation; APPROVED after approve; SUSPENDED after a carrier approval lapse is detected at departure."
        default: PENDING_APPROVAL
        constraints: "one of PENDING_APPROVAL, APPROVED, SUSPENDED"
      - name: in_transit_value_cents
        type: integer
        source: computed
        description: "SUM(TransitShipment.declared_value_cents) over shipments on this vehicle with status == IN_TRANSIT."
        default: 0
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of approve."
        default: null

  - name: TransitShipment
    parent: CoveragePart
    common_fields: true
    fields:
      - name: coverage_part_id
        type: string
        source: input
        description: "FK -> CoveragePart.id; supplied by the path on creation. The part_type must be TRANSIT."
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the conveyance whose half-open [departure_at, arrival_at) windows plus TURNAROUND_BUFFER_HOURS this shipment must not collide with."
      - name: origin_territory_code
        type: enum
        source: input
        description: "Territory the shipment leaves from."
        constraints: "one of T1_COASTAL, T2_URBAN, T3_INLAND, T4_REMOTE"
      - name: destination_territory_code
        type: enum
        source: input
        description: "Territory the shipment is bound for."
        constraints: "one of T1_COASTAL, T2_URBAN, T3_INLAND, T4_REMOTE"
      - name: departure_at
        type: datetime
        source: input
        description: "Scheduled departure instant, ISO 8601 UTC. Window arithmetic treats [departure_at, arrival_at) as HALF-OPEN."
      - name: arrival_at
        type: datetime
        source: input
        description: "Scheduled arrival instant, ISO 8601 UTC; exclusive end of the occupation window. TURNAROUND_BUFFER_HOURS is added after it before the conveyance is free again."
        constraints: "strictly greater than departure_at"
      - name: declared_value_cents
        type: integer
        source: input
        description: "Declared value in transit; summed per UTC calendar date of departure_at against the vehicle's per_conveyance_limit_cents."
        constraints: "> 0"
      - name: catastrophe_zone
        type: boolean
        source: computed
        description: "First output of transit_applicable_limit: true when origin_territory_code == T1_COASTAL OR destination_territory_code == T1_COASTAL. When true, applicable_limit_cents is additionally capped at the part's catastrophe_limit_cents."
      - name: applicable_limit_cents
        type: integer
        source: computed
        description: "Output of transit_applicable_limit: the ownership-keyed transit limit, further capped by catastrophe_limit_cents when catastrophe_zone is true."
      - name: status
        type: enum
        source: system
        description: "Shipment lifecycle state."
        default: PLANNED
        constraints: "one of PLANNED, IN_TRANSIT, DELIVERED, LOST, CANCELLED"
      - name: departed_at
        type: datetime
        source: system
        description: "Logical-clock instant of depart."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of deliver."
        default: null

  - name: ValueReport
    parent: CoveragePart
    common_fields: true
    fields:
      - name: coverage_part_id
        type: string
        source: input
        description: "FK -> CoveragePart.id; supplied by the path on creation. The part_type must be REPORTING_FORM."
      - name: superseded_by_report_id
        type: string
        source: system
        description: "FK -> ValueReport.id; set on the older report when a newer report for the same period is filed. Null unless status == SUPERSEDED."
        default: null
      - name: period_start_date
        type: string
        source: input
        description: "First day of the reported period, ISO 8601 calendar date."
      - name: period_end_date
        type: string
        source: input
        description: "Last day of the reported period, ISO 8601 calendar date, inclusive; period_days counts both endpoints."
        constraints: "strictly greater than period_start_date"
      - name: period_days
        type: integer
        source: computed
        description: "(period_end_date - period_start_date) in whole days, plus 1 (both endpoints inclusive)."
      - name: reported_value_cents
        type: integer
        source: input
        description: "Values at risk the insured reports for the period; 0 when the row was created by the reporting sweep."
        constraints: ">= 0"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the report was filed; compared against due_date to decide lateness."
      - name: due_date
        type: string
        source: computed
        description: "period_end_date + REPORTING_GRACE_DAYS (15), ISO 8601 calendar date. A report whose submitted_at date is strictly after due_date is late."
      - name: period_earned_premium_cents
        type: integer
        source: computed
        description: "Output of reporting_period_earned_premium; written at adjudication and added to the part's earned_reported_premium_cents."
        default: 0
      - name: late_penalty_cents
        type: integer
        source: computed
        description: "LATE_REPORTING_PENALTY_BP of period_earned_premium_cents; non-zero only on the PENALIZED branch."
        default: 0
      - name: status
        type: enum
        source: system
        description: "SUBMITTED on insured filing, DELINQUENT when minted by the reporting sweep, ACCEPTED or PENALIZED after adjudication, SUPERSEDED once a newer report covers the same period."
        default: SUBMITTED
        constraints: "one of SUBMITTED, ACCEPTED, PENALIZED, DELINQUENT, SUPERSEDED"

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; supplied by the path on creation."
      - name: coverage_part_id
        type: string
        source: input
        description: "FK -> CoveragePart.id; the part answering the loss. Must belong to the same policy as the path and must match the supplied loss subject."
      - name: equipment_item_id
        type: string
        source: input
        description: "FK -> EquipmentItem.id; the damaged unit. Exactly one of equipment_item_id, transit_shipment_id, installation_floater_id is non-null unless the part_type is REPORTING_FORM, in which case all three are null."
        default: null
      - name: transit_shipment_id
        type: string
        source: input
        description: "FK -> TransitShipment.id; the shipment in which the loss occurred."
        default: null
      - name: installation_floater_id
        type: string
        source: input
        description: "FK -> InstallationFloater.id; the installation project at which the loss occurred."
        default: null
      - name: loss_date
        type: string
        source: input
        description: "ISO 8601 calendar date of loss; must fall inside [Policy.effective_date, Policy.expiration_date)."
      - name: loss_type
        type: enum
        source: input
        description: "Peril; THEFT losses are the ones the geo-tracking and jobsite security controls are priced for."
        constraints: "one of THEFT, COLLISION, FIRE, WINDSTORM, VANDALISM"
      - name: repair_estimate_cents
        type: integer
        source: system
        description: "Repair or damage estimate recorded by inspect; null while OPEN."
        default: null
      - name: actual_value_at_loss_cents
        type: integer
        source: system
        description: "Actual values at risk at the loss date recorded by inspect; the denominator of the underreporting ratio on REPORTING_FORM claims."
        default: null
      - name: valuation_at_loss_cents
        type: integer
        source: computed
        description: "Output of claim_loss_valuation for the subject's effective valuation basis; the total-loss gross amount and the constructive-total-loss base."
        default: null
      - name: constructive_total_loss_threshold_cents
        type: integer
        source: computed
        description: "round_half_up(valuation_at_loss_cents * CONSTRUCTIVE_TOTAL_LOSS_BP / 10000); a repair-basis adjustment is barred once repair_estimate_cents reaches it."
        default: null
      - name: underreporting_factor_bp
        type: integer
        source: computed
        description: "Output of underreporting_penalty_factor; 10000 for every part_type other than REPORTING_FORM."
        default: 10000
      - name: loss_of_use_days_claimed
        type: integer
        source: input
        description: "Loss-of-use days claimed, supplied to adjust; truncated at the part's loss_of_use_max_days."
        default: 0
        constraints: ">= 0"
      - name: loss_of_use_paid_cents
        type: integer
        source: computed
        description: "min(loss_of_use_days_claimed, part.loss_of_use_max_days) * part.loss_of_use_daily_limit_cents; zero on every basis other than REPAIR and every ownership other than RENTED or LEASED."
        default: 0
      - name: repair_basis_settlement_cents
        type: integer
        source: computed
        description: "The REPAIR variant of claim_settlement_amount for this claim's pinned inputs; always computed so the worksheet can show both variants."
        default: null
      - name: total_loss_basis_settlement_cents
        type: integer
        source: computed
        description: "The TOTAL_LOSS variant of claim_settlement_amount for this claim's pinned inputs; always computed so the worksheet can show both variants."
        default: null
      - name: adjustment_basis
        type: enum
        source: input
        description: "Basis chosen at adjust; selects which variant becomes settlement_amount_cents."
        default: null
        constraints: "one of REPAIR, TOTAL_LOSS"
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: "The variant selected by adjustment_basis; the amount settle pays and debits from the part's aggregate_available_cents."
        default: null
      - name: settlement_paid_cents
        type: integer
        source: system
        description: "Amount actually paid by settle; null until SETTLED."
        default: null
      - name: salvage_proceeds_cents
        type: integer
        source: system
        description: "Gross salvage proceeds recorded by salvage-recovery; null until recorded."
        default: null
      - name: salvage_credit_cents
        type: integer
        source: computed
        description: "min(salvage_proceeds_cents, settlement_paid_cents); credited back to the part's aggregate_available_cents on the RECOVERED branch."
        default: 0
      - name: adjustment_status
        type: enum
        source: system
        description: "Adjustment axis of the claim; independent of salvage_status until both reach a joinable state."
        default: OPEN
        constraints: "one of OPEN, INSPECTED, REPAIR_APPROVED, TOTAL_LOSS_DECLARED, SETTLED, CLOSED"
      - name: salvage_status
        type: enum
        source: system
        description: "Salvage axis of the claim; NOT_APPLICABLE until a total loss is declared, then PENDING, then RECOVERED or WAIVED."
        default: NOT_APPLICABLE
        constraints: "one of NOT_APPLICABLE, PENDING, RECOVERED, WAIVED"
      - name: inspected_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who inspected."
        default: null
      - name: declared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who ran adjust; compared against the settling UnderwritingManager for segregation of duties."
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UnderwritingManager who settled."
        default: null

  - name: LedgerEntry
    parent: Policy
    common_fields: false
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> Policy.id; the policy whose conserved quantities this entry moves."
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; set only on CLAIM_SETTLEMENT and SALVAGE_RECOVERY entries."
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "What produced the entry."
        constraints: "one of INITIAL_PREMIUM, ENDORSEMENT_PREMIUM, ENDORSEMENT_RETURN, REPORTING_ADJUSTMENT, LATE_REPORTING_PENALTY, CANCELLATION_RETURN, CLAIM_SETTLEMENT, SALVAGE_RECOVERY"
      - name: ledger
        type: enum
        source: system
        description: "PREMIUM for INITIAL_PREMIUM, ENDORSEMENT_PREMIUM, ENDORSEMENT_RETURN, REPORTING_ADJUSTMENT, LATE_REPORTING_PENALTY and CANCELLATION_RETURN; LOSS for CLAIM_SETTLEMENT and SALVAGE_RECOVERY."
        constraints: "one of PREMIUM, LOSS"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount; debits to the insured are positive, returns and recoveries are negative."
      - name: memo
        type: string
        source: system
        description: "Human-readable explanation naming the triggering action and subject id."
      - name: effective_date
        type: string
        source: system
        description: "ISO 8601 calendar date the entry is effective, taken from the logical clock unless the triggering action supplies its own effective date."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Policy
    initial_state: DRAFT
    terminal_states: [DECLINED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /inland-marine/policies/{id}/quote"
        actor: Underwriter
        preconditions:
          - "COUNT(CoveragePart with this policy_id and status == ACTIVE) >= 1, else ERR_NO_RATABLE_COVERAGE"
          - "every CoveragePart with status == ACTIVE has rated_premium_cents set (non-null)"
        side_effects:
          - "recompute each ACTIVE CoveragePart.rated_premium_cents from its own part-type calculation"
          - "recompute Policy.sum_of_part_premiums_cents, Policy.written_premium_cents, Policy.scheduled_basis_premium_cents and Policy.blanket_basis_premium_cents per policy_written_premium"
          - "recompute Policy.total_insured_value_cents"
          - "set Policy.referral_required per its computed definition"
          - "set Policy.quoted_at to the logical clock"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /inland-marine/policies/{id}/quote (re-quote after a schedule or limit endorsement)"
        actor: Underwriter
        preconditions:
          - "COUNT(CoveragePart with this policy_id and status == ACTIVE) >= 1, else ERR_NO_RATABLE_COVERAGE"
        side_effects:
          - "same recomputation set as DRAFT_to_QUOTED"
          - "Policy.referral_status is left untouched by a re-quote even when referral_required flips"
        note: "Self-loop; this is the cyclic leg that lets a QUOTED policy be re-priced without leaving QUOTED."
      - from: QUOTED
        to: REFERRED
        trigger: "POST /inland-marine/policies/{id}/refer"
        actor: Underwriter
        preconditions:
          - "Policy.referral_required == true, else ERR_POLICY_NOT_REFERRABLE"
          - "Policy.referral_status IN {NOT_REQUIRED, DECLINED}, else ERR_POLICY_NOT_REFERRABLE"
        side_effects:
          - "set Policy.referral_status = PENDING"
          - "set Policy.referred_by_user_id = X-User-ID of the calling Underwriter"
      - from: REFERRED
        to: QUOTED
        trigger: "POST /inland-marine/policies/{id}/referral-decision with decision == APPROVE"
        actor: UnderwritingManager
        preconditions:
          - "X-User-ID != Policy.referred_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set Policy.referral_status = APPROVED"
          - "set Policy.referral_decided_by_user_id = X-User-ID"
        note: "Closes the QUOTED -> REFERRED -> QUOTED cycle."
      - from: REFERRED
        to: DECLINED
        trigger: "POST /inland-marine/policies/{id}/referral-decision with decision == DECLINE"
        actor: UnderwritingManager
        preconditions:
          - "X-User-ID != Policy.referred_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set Policy.referral_status = DECLINED and Policy.referral_decided_by_user_id = X-User-ID"
          - "cascade down: every CoveragePart with this policy_id and status == ACTIVE becomes status VOID"
          - "cascade down: every InstallationFloater on those parts with status IN {PENDING, ACTIVE} becomes VOIDED with termination_trigger CANCELLATION"
      - from: QUOTED
        to: BOUND
        trigger: "POST /inland-marine/policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "Policy.written_premium_cents > 0"
          - "Policy.referral_required == false OR Policy.referral_status == APPROVED, else ERR_REFERRAL_REQUIRED"
        side_effects:
          - "append LedgerEntry {entry_type: INITIAL_PREMIUM, ledger: PREMIUM, amount_cents: +Policy.written_premium_cents, effective_date: Policy.effective_date}"
          - "recompute Policy.premium_balance_cents from the PREMIUM ledger"
          - "set Policy.bound_at to the logical clock"
      - from: BOUND
        to: IN_FORCE
        trigger: "POST /inland-marine/policies/{id}/activate"
        actor: Underwriter
        preconditions:
          - "logical clock date >= Policy.effective_date (inclusive; activation on the effective date itself is permitted), else ERR_POLICY_NOT_ACTIVATABLE"
          - "logical clock date < Policy.expiration_date, else ERR_POLICY_NOT_ACTIVATABLE"
        side_effects:
          - "set Policy.in_force_at to the logical clock"
      - from: IN_FORCE
        to: SUSPENDED
        trigger: "system, inside POST /inland-marine/coverage-parts/{id}/reporting-sweep when the sweep mints at least one DELINQUENT ValueReport"
        actor: system
        preconditions:
          - "at least one ValueReport with status == DELINQUENT exists on a CoveragePart of this policy"
        side_effects:
          - "hop 2 of the reporting-sweep cascade: the policy stops accepting new coverage and new claims (every guarded transition tests Policy.status == IN_FORCE)"
      - from: SUSPENDED
        to: IN_FORCE
        trigger: "system, inside POST /inland-marine/value-reports/{id}/adjudicate when the adjudicated report's supersede hop clears the last DELINQUENT report on the policy"
        actor: system
        preconditions:
          - "COUNT(ValueReport with status == DELINQUENT on any CoveragePart of this policy) == 0 after the supersede hop"
        side_effects:
          - "hop 3 of the delinquency-cure cascade: coverage resumes"
        note: "Closes the IN_FORCE -> SUSPENDED -> IN_FORCE cycle."
      - from: BOUND
        to: CANCELLED
        trigger: "POST /inland-marine/policies/{id}/cancel"
        actor: UnderwritingManager
        preconditions:
          - "cancel_effective_date IN [Policy.effective_date, Policy.expiration_date), else ERR_CANCEL_DATE_OUTSIDE_TERM"
        side_effects:
          - "run policy_cancellation_return and append LedgerEntry {entry_type: CANCELLATION_RETURN, ledger: PREMIUM, amount_cents: -return_cents}"
          - "recompute Policy.premium_balance_cents"
          - "set Policy.cancellation_reason and Policy.cancel_effective_date"
          - "cascade down: EquipmentItem rows with status IN {RATED, ACTIVE} on this policy become REMOVED with removed_at = logical clock (no further premium return; the cancellation return already covers them)"
          - "cascade down: InstallationFloater rows with status IN {PENDING, ACTIVE} become VOIDED with termination_trigger CANCELLATION; each decrements its Jobsite.active_floater_count"
          - "cascade down: TransitShipment rows with status == PLANNED become CANCELLED"
          - "cascade down: every CoveragePart with status == ACTIVE becomes VOID"
      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /inland-marine/policies/{id}/cancel"
        actor: UnderwritingManager
        preconditions:
          - "cancel_effective_date IN [Policy.effective_date, Policy.expiration_date), else ERR_CANCEL_DATE_OUTSIDE_TERM"
        side_effects:
          - "identical side-effect set to BOUND_to_CANCELLED"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /inland-marine/policies/{id}/cancel with cancellation_reason == NON_REPORTING"
        actor: UnderwritingManager
        preconditions:
          - "cancel_effective_date IN [Policy.effective_date, Policy.expiration_date), else ERR_CANCEL_DATE_OUTSIDE_TERM"
        side_effects:
          - "identical side-effect set to BOUND_to_CANCELLED"
      - from: IN_FORCE
        to: EXPIRED
        trigger: "system, inside POST /_clock/set_current_utc when the new clock date >= Policy.expiration_date"
        actor: system
        preconditions:
          - "Policy.status == IN_FORCE and new logical clock date >= Policy.expiration_date"
        side_effects:
          - "cascade down: InstallationFloater rows with status IN {PENDING, ACTIVE} on this policy become EXPIRED with termination_trigger EXPIRY and termination_date = Policy.expiration_date; each decrements its Jobsite.active_floater_count"
          - "the expired policy id is returned in the clock response's expired_policy_ids array"

  - entity: EquipmentItem
    initial_state: RATED
    terminal_states: [REMOVED, TOTALED]
    transitions:
      - from: RATED
        to: RATED
        trigger: "POST /inland-marine/equipment-items/{id}/assign-jobsite (or a jobsite-driven re-rate cascade)"
        actor: Underwriter
        preconditions:
          - "Jobsite exists, else ERR_JOBSITE_NOT_FOUND"
          - "NOT (RateRule selected for the jobsite territory has theft_hazard_grade == A AND Jobsite.security_tier IN {TIER_0, TIER_1} AND EquipmentItem.geo_tracker_installed == false), else ERR_GEO_TRACKING_REQUIRED"
        side_effects:
          - "set assigned_jobsite_id, then re-run rate_rule_selection with the jobsite's territory_code and re-run equipment_insured_value and equipment_item_premium"
          - "cross-entity: recompute the parent CoveragePart.rated_premium_cents"
          - "cross-entity: recompute Policy.total_insured_value_cents; when Policy.status == IN_FORCE also append the prorated ENDORSEMENT_PREMIUM or ENDORSEMENT_RETURN entry for the premium delta and recompute Policy.premium_balance_cents and Policy.written_premium_cents"
        note: "Self-loop re-rating leg; also the shape used by the jobsite-release cascade hop 3."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /inland-marine/equipment-items/{id}/assign-jobsite (or a jobsite-driven re-rate cascade) on an item already on risk"
        actor: Underwriter
        preconditions:
          - "Jobsite exists, else ERR_JOBSITE_NOT_FOUND"
          - "NOT (RateRule selected for the jobsite territory has theft_hazard_grade == A AND Jobsite.security_tier IN {TIER_0, TIER_1} AND EquipmentItem.geo_tracker_installed == false), else ERR_GEO_TRACKING_REQUIRED"
        side_effects:
          - "identical side-effect set to RATED_to_RATED"
      - from: RATED
        to: ACTIVE
        trigger: "POST /inland-marine/equipment-items/{id}/activate"
        actor: Underwriter
        preconditions:
          - "Policy.status == IN_FORCE, else ERR_POLICY_NOT_IN_FORCE"
          - "parent CoveragePart.status == ACTIVE, else ERR_PART_VOID"
        side_effects:
          - "guarded cross-entity transition: the item goes on risk only while its policy is IN_FORCE"
      - from: RATED
        to: REMOVED
        trigger: "DELETE /inland-marine/equipment-items/{id}"
        actor: Underwriter
        preconditions:
          - "Policy.status IN {DRAFT, QUOTED, REFERRED, BOUND, IN_FORCE, SUSPENDED}, else ERR_POLICY_NOT_MUTABLE"
        side_effects:
          - "set status REMOVED and removed_at = logical clock"
          - "recompute the parent CoveragePart.rated_premium_cents over the remaining {RATED, ACTIVE} items"
          - "recompute Policy.total_insured_value_cents and Policy.written_premium_cents"
          - "when Policy.status IN {IN_FORCE, SUSPENDED}: append LedgerEntry {entry_type: ENDORSEMENT_RETURN, ledger: PREMIUM, amount_cents: -endorsement_prorated_premium(item)} and recompute Policy.premium_balance_cents"
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /inland-marine/equipment-items/{id}"
        actor: Underwriter
        preconditions:
          - "Policy.status IN {BOUND, IN_FORCE, SUSPENDED}, else ERR_POLICY_NOT_MUTABLE"
        side_effects:
          - "identical side-effect set to RATED_to_REMOVED"
      - from: ACTIVE
        to: TOTALED
        trigger: "system, hop 2 of the total-loss settlement cascade inside POST /inland-marine/claims/{id}/settle"
        actor: system
        preconditions:
          - "the settling Claim has adjustment_basis == TOTAL_LOSS and equipment_item_id == this item's id"
        side_effects:
          - "set status TOTALED and removed_at = logical clock"
          - "hop 3: recompute the parent CoveragePart.rated_premium_cents over the remaining {RATED, ACTIVE} items and append LedgerEntry {entry_type: ENDORSEMENT_RETURN, ledger: PREMIUM, amount_cents: -endorsement_prorated_premium(item)}"
          - "hop 4: recompute Policy.total_insured_value_cents, Policy.written_premium_cents and Policy.premium_balance_cents"
      - from: RATED
        to: TOTALED
        trigger: "system, hop 2 of the total-loss settlement cascade inside POST /inland-marine/claims/{id}/settle"
        actor: system
        preconditions:
          - "the settling Claim has adjustment_basis == TOTAL_LOSS and equipment_item_id == this item's id"
        side_effects:
          - "identical side-effect set to ACTIVE_to_TOTALED"

  - entity: Jobsite
    initial_state: UNSURVEYED
    terminal_states: []
    transitions:
      - from: UNSURVEYED
        to: SURVEYED
        trigger: "POST /inland-marine/jobsites/{id}/security-survey"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "recompute security_score and security_tier per jobsite_security_tier; set surveyed_at"
          - "cross-entity: every EquipmentItem with assigned_jobsite_id == this jobsite and status IN {RATED, ACTIVE} is re-rated (the jobsite security credit changes), which recomputes each parent CoveragePart.rated_premium_cents and then Policy.written_premium_cents"
      - from: SURVEYED
        to: SURVEYED
        trigger: "POST /inland-marine/jobsites/{id}/security-survey (re-survey)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "identical side-effect set to UNSURVEYED_to_SURVEYED"
      - from: SURVEYED
        to: RELEASED
        trigger: "system, hop 2 of the floater-termination cascade when active_floater_count falls from 1 to 0"
        actor: system
        preconditions:
          - "active_floater_count == 0 after the decrement AND at least one InstallationFloater has ever been attached to this jobsite"
        side_effects:
          - "hop 3: every EquipmentItem with assigned_jobsite_id == this jobsite and status IN {RATED, ACTIVE} loses the jobsite security credit (the released site is no longer secured), is re-rated with jobsite security credit 0, and keeps assigned_jobsite_id"
          - "hop 4: each affected item's parent CoveragePart.rated_premium_cents is recomputed, then Policy.written_premium_cents and Policy.premium_balance_cents (via an ENDORSEMENT_PREMIUM entry for the increase when Policy.status IN {IN_FORCE, SUSPENDED})"
      - from: RELEASED
        to: SURVEYED
        trigger: "POST /inland-marine/jobsites/{id}/security-survey (re-survey of a released site)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "identical side-effect set to UNSURVEYED_to_SURVEYED"

  - entity: InstallationFloater
    initial_state: PENDING
    terminal_states: [TERMINATED_ACCEPTANCE, TERMINATED_OCCUPANCY, EXPIRED, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /inland-marine/installation-floaters/{id}/activate"
        actor: Underwriter
        preconditions:
          - "Policy.status == IN_FORCE, else ERR_POLICY_NOT_IN_FORCE"
          - "Jobsite.security_tier != TIER_0, else ERR_JOBSITE_SECURITY_INSUFFICIENT"
          - "installed_value_limit_cents <= parent CoveragePart.aggregate_available_cents, else ERR_FLOATER_LIMIT_EXCEEDS_PART_AGGREGATE"
        side_effects:
          - "guarded cross-entity transition: the floater goes on risk only while its jobsite is surveyed above TIER_0"
      - from: ACTIVE
        to: TERMINATED_ACCEPTANCE
        trigger: "POST /inland-marine/installation-floaters/{id}/terminate with termination_reason == ACCEPTANCE"
        actor: Underwriter
        preconditions:
          - "termination_date IN [coverage_start_date, coverage_end_date], else ERR_TERMINATION_DATE_OUTSIDE_COVERAGE"
        side_effects:
          - "hop 1: set termination_trigger ACCEPTANCE, termination_date, earned_premium_cents = pro-rata to termination_date per installation_floater_termination, unearned_return_cents = rated_premium_cents - earned_premium_cents, and append LedgerEntry {entry_type: ENDORSEMENT_RETURN, ledger: PREMIUM, amount_cents: -unearned_return_cents}; recompute the parent CoveragePart.rated_premium_cents and Policy.premium_balance_cents"
          - "hop 2 (caused by hop 1 removing this floater from {PENDING, ACTIVE}): Jobsite.active_floater_count -= 1, and when it reaches 0 the Jobsite transitions SURVEYED -> RELEASED"
          - "hop 3 (caused by hop 2): every EquipmentItem assigned to that jobsite with status IN {RATED, ACTIVE} is re-rated with jobsite security credit 0"
          - "hop 4 (caused by hop 3): each affected parent CoveragePart.rated_premium_cents and then Policy.written_premium_cents / Policy.premium_balance_cents are recomputed"
        note: "ACCEPTANCE branch returns unearned premium; contrast the OCCUPANCY branch."
      - from: ACTIVE
        to: TERMINATED_OCCUPANCY
        trigger: "POST /inland-marine/installation-floaters/{id}/terminate with termination_reason == OCCUPANCY"
        actor: Underwriter
        preconditions:
          - "termination_date IN [coverage_start_date, coverage_end_date], else ERR_TERMINATION_DATE_OUTSIDE_COVERAGE"
        side_effects:
          - "hop 1: set termination_trigger OCCUPANCY, termination_date, earned_premium_cents = rated_premium_cents (occupancy earns the full term per installation_floater_termination), unearned_return_cents = 0, and write NO ledger entry; increment Policy.occupancy_termination_count by 1"
          - "hop 2 (caused by hop 1): Jobsite.active_floater_count -= 1, and when it reaches 0 the Jobsite transitions SURVEYED -> RELEASED"
          - "hop 3 and hop 4: identical to the ACCEPTANCE branch's jobsite-release cascade"
        note: "Divergent branch: no premium return, and a policy-level occupancy counter is bumped."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, inside POST /_clock/set_current_utc when the new clock date > coverage_end_date, or when the owning Policy expires"
        actor: system
        preconditions:
          - "new logical clock date > coverage_end_date OR Policy.status transitions to EXPIRED in the same call"
        side_effects:
          - "set termination_trigger EXPIRY, termination_date = coverage_end_date, earned_premium_cents = rated_premium_cents, unearned_return_cents = 0; write NO ledger entry"
          - "Jobsite.active_floater_count -= 1 with the same SURVEYED -> RELEASED consequence"
          - "the floater id is returned in the clock response's expired_floater_ids array"
      - from: PENDING
        to: VOIDED
        trigger: "system, cascade from POST /inland-marine/policies/{id}/cancel or a DECLINE referral decision"
        actor: system
        preconditions:
          - "owning Policy transitions to CANCELLED or DECLINED in the same call"
        side_effects:
          - "set termination_trigger CANCELLATION, unearned_return_cents = 0 (the policy-level cancellation return already covers the floater premium)"
          - "Jobsite.active_floater_count -= 1 with the same SURVEYED -> RELEASED consequence"
      - from: ACTIVE
        to: VOIDED
        trigger: "system, cascade from POST /inland-marine/policies/{id}/cancel"
        actor: system
        preconditions:
          - "owning Policy transitions to CANCELLED in the same call"
        side_effects:
          - "identical side-effect set to PENDING_to_VOIDED"

  - entity: Vehicle
    initial_state: PENDING_APPROVAL
    terminal_states: []
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /inland-marine/vehicles/{id}/approve"
        actor: Underwriter
        preconditions:
          - "ownership == OWNED, OR (ownership == HIRED AND approval_expires_on is non-null), else ERR_CARRIER_APPROVAL_MISSING"
        side_effects:
          - "set approved_at to the logical clock; overwrite approval_expires_on when the request supplies one"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system, inside POST /inland-marine/transit-shipments/{id}/depart when the vehicle's carrier approval has lapsed"
        actor: system
        preconditions:
          - "ownership == HIRED AND logical clock date >= approval_expires_on"
        side_effects:
          - "set status SUSPENDED; the departure that detected the lapse is itself rejected with ERR_VEHICLE_APPROVAL_EXPIRED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /inland-marine/vehicles/{id}/approve with a fresh approval_expires_on"
        actor: Underwriter
        preconditions:
          - "request supplies approval_expires_on strictly after the logical clock date, else ERR_CARRIER_APPROVAL_MISSING"
        side_effects:
          - "set approval_expires_on and approved_at"

  - entity: TransitShipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, LOST, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /inland-marine/transit-shipments/{id}/depart"
        actor: Underwriter
        preconditions:
          - "Policy.status == IN_FORCE, else ERR_POLICY_NOT_IN_FORCE"
          - "Vehicle.status == APPROVED, else ERR_VEHICLE_NOT_APPROVED"
          - "Vehicle.ownership == OWNED OR logical clock date < Vehicle.approval_expires_on, else ERR_VEHICLE_APPROVAL_EXPIRED (and the vehicle is suspended)"
        side_effects:
          - "set departed_at = logical clock; recompute Vehicle.in_transit_value_cents"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /inland-marine/transit-shipments/{id}/deliver"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "set delivered_at = logical clock; recompute Vehicle.in_transit_value_cents (the conveyance frees its declared value)"
      - from: IN_TRANSIT
        to: LOST
        trigger: "system, hop 2 of the total-loss settlement cascade inside POST /inland-marine/claims/{id}/settle"
        actor: system
        preconditions:
          - "the settling Claim has adjustment_basis == TOTAL_LOSS and transit_shipment_id == this shipment's id"
        side_effects:
          - "set status LOST; recompute Vehicle.in_transit_value_cents"
      - from: PLANNED
        to: CANCELLED
        trigger: "system, cascade from POST /inland-marine/policies/{id}/cancel"
        actor: system
        preconditions:
          - "owning Policy transitions to CANCELLED in the same call"
        side_effects:
          - "set status CANCELLED; the conveyance window is released"

  - entity: ValueReport
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /inland-marine/value-reports/{id}/adjudicate on a report filed on or before due_date"
        actor: Underwriter
        preconditions:
          - "date(submitted_at) <= due_date"
        side_effects:
          - "hop 1: set period_earned_premium_cents per reporting_period_earned_premium, late_penalty_cents = 0; append LedgerEntry {entry_type: REPORTING_ADJUSTMENT, ledger: PREMIUM, amount_cents: +period_earned_premium_cents}; add it to CoveragePart.earned_reported_premium_cents and recompute Policy.premium_balance_cents"
          - "hop 2 (caused by hop 1): any other ValueReport on the same part with the same period_start_date and period_end_date and status IN {SUBMITTED, DELINQUENT} becomes SUPERSEDED with superseded_by_report_id = this report's id"
          - "hop 3 (caused by hop 2): when no ValueReport with status == DELINQUENT remains on any CoveragePart of the policy and Policy.status == SUSPENDED, the Policy transitions SUSPENDED -> IN_FORCE"
      - from: SUBMITTED
        to: PENALIZED
        trigger: "POST /inland-marine/value-reports/{id}/adjudicate on a report filed after due_date"
        actor: Underwriter
        preconditions:
          - "date(submitted_at) > due_date"
        side_effects:
          - "hop 1: set period_earned_premium_cents per reporting_period_earned_premium and late_penalty_cents = round_half_up(period_earned_premium_cents * LATE_REPORTING_PENALTY_BP / 10000); append BOTH LedgerEntry {entry_type: REPORTING_ADJUSTMENT, ledger: PREMIUM, amount_cents: +period_earned_premium_cents} and LedgerEntry {entry_type: LATE_REPORTING_PENALTY, ledger: PREMIUM, amount_cents: +late_penalty_cents}; add period_earned_premium_cents to CoveragePart.earned_reported_premium_cents and recompute Policy.premium_balance_cents"
          - "hop 2 and hop 3: identical supersede-and-cure cascade to the ACCEPTED branch"
        note: "Divergent branch: one extra ledger entry and a non-zero late_penalty_cents."
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, when a newer ValueReport for the same period is filed on the same part"
        actor: system
        preconditions:
          - "a newer ValueReport with identical period_start_date and period_end_date was created on this part"
        side_effects:
          - "set superseded_by_report_id to the newer report's id; the superseded report contributes nothing to earned_reported_premium_cents"
      - from: DELINQUENT
        to: SUPERSEDED
        trigger: "system, when the insured files the missing report for the period, or when that report is adjudicated"
        actor: system
        preconditions:
          - "a newer ValueReport with identical period_start_date and period_end_date was created on this part"
        side_effects:
          - "set superseded_by_report_id to the newer report's id; this is the hop that can clear the policy's last delinquency"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system, when a corrected ValueReport for the same period is filed on the same part"
        actor: system
        preconditions:
          - "a newer ValueReport with identical period_start_date and period_end_date was created on this part"
        side_effects:
          - "set superseded_by_report_id to the newer report's id; CoveragePart.earned_reported_premium_cents is reduced by this report's period_earned_premium_cents and a compensating LedgerEntry {entry_type: REPORTING_ADJUSTMENT, ledger: PREMIUM, amount_cents: -period_earned_premium_cents} is appended"
      - from: PENALIZED
        to: SUPERSEDED
        trigger: "system, when a corrected ValueReport for the same period is filed on the same part"
        actor: system
        preconditions:
          - "a newer ValueReport with identical period_start_date and period_end_date was created on this part"
        side_effects:
          - "identical side-effect set to ACCEPTED_to_SUPERSEDED; the LATE_REPORTING_PENALTY entry is NOT reversed"

  - entity: Claim
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: INSPECTED
        trigger: "POST /inland-marine/claims/{id}/inspect"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy.status IN {IN_FORCE, SUSPENDED, EXPIRED, CANCELLED} (a loss inside the term stays adjustable after the term ends)"
        side_effects:
          - "store repair_estimate_cents and actual_value_at_loss_cents; set inspected_by_user_id = X-User-ID"
          - "run claim_loss_valuation to set valuation_at_loss_cents and constructive_total_loss_threshold_cents"
          - "run underreporting_penalty_factor to set underreporting_factor_bp"
          - "run BOTH variants of claim_settlement_amount to set repair_basis_settlement_cents and total_loss_basis_settlement_cents (loss_of_use_days_claimed is still 0 at this point)"
      - from: INSPECTED
        to: REPAIR_APPROVED
        trigger: "POST /inland-marine/claims/{id}/adjust with adjustment_basis == REPAIR"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.equipment_item_id IS NULL OR repair_estimate_cents < constructive_total_loss_threshold_cents, else ERR_CONSTRUCTIVE_TOTAL_LOSS"
          - "loss_of_use_days_claimed == 0 OR the parent CoveragePart.part_type == RENTED_LEASED AND the subject item's ownership IN {RENTED, LEASED}, else ERR_LOSS_OF_USE_NOT_COVERED"
        side_effects:
          - "store loss_of_use_days_claimed; recompute loss_of_use_paid_cents and both settlement variants; set settlement_amount_cents = repair_basis_settlement_cents"
          - "set adjustment_basis = REPAIR and declared_by_user_id = X-User-ID"
          - "salvage_status stays NOT_APPLICABLE (the repair branch keeps the salvage axis dormant)"
      - from: INSPECTED
        to: TOTAL_LOSS_DECLARED
        trigger: "POST /inland-marine/claims/{id}/adjust with adjustment_basis == TOTAL_LOSS"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "recompute both settlement variants; set settlement_amount_cents = total_loss_basis_settlement_cents and loss_of_use_paid_cents = 0"
          - "set adjustment_basis = TOTAL_LOSS and declared_by_user_id = X-User-ID"
          - "parallel axis: salvage_status NOT_APPLICABLE -> PENDING"
        note: "Fork point: the two adjust branches diverge in settlement amount, in loss-of-use payability, and in whether the salvage axis is armed."
      - from: REPAIR_APPROVED
        to: SETTLED
        trigger: "POST /inland-marine/claims/{id}/settle"
        actor: UnderwritingManager
        preconditions:
          - "X-User-ID != Claim.declared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the CoveragePart's governing ValueReport (when part_type == REPORTING_FORM) is not DELINQUENT, else ERR_REPORTING_DELINQUENT"
          - "settlement_amount_cents <= parent CoveragePart.aggregate_available_cents, else ERR_AGGREGATE_LIMIT_EXHAUSTED"
        side_effects:
          - "set settlement_paid_cents = settlement_amount_cents and settled_by_user_id = X-User-ID"
          - "append LedgerEntry {entry_type: CLAIM_SETTLEMENT, ledger: LOSS, amount_cents: +settlement_paid_cents, claim_id: this claim}; recompute Policy.incurred_loss_cents"
          - "CoveragePart.aggregate_paid_net_cents += settlement_paid_cents and aggregate_available_cents -= settlement_paid_cents (the conserved-capacity identity holds)"
          - "join: because salvage_status == NOT_APPLICABLE on the repair branch, adjustment_status advances straight through SETTLED to CLOSED in the same call"
      - from: TOTAL_LOSS_DECLARED
        to: SETTLED
        trigger: "POST /inland-marine/claims/{id}/settle"
        actor: UnderwritingManager
        preconditions:
          - "X-User-ID != Claim.declared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the CoveragePart's governing ValueReport (when part_type == REPORTING_FORM) is not DELINQUENT, else ERR_REPORTING_DELINQUENT"
          - "settlement_amount_cents <= parent CoveragePart.aggregate_available_cents, else ERR_AGGREGATE_LIMIT_EXHAUSTED"
        side_effects:
          - "hop 1: set settlement_paid_cents, settled_by_user_id, append the CLAIM_SETTLEMENT LedgerEntry, recompute Policy.incurred_loss_cents, and move CoveragePart.aggregate_paid_net_cents / aggregate_available_cents"
          - "hop 2 (caused by hop 1): the loss subject leaves risk - EquipmentItem -> TOTALED, or TransitShipment IN_TRANSIT -> LOST"
          - "hop 3 (caused by hop 2, equipment subjects only): the parent CoveragePart.rated_premium_cents is recomputed over the remaining {RATED, ACTIVE} items and an ENDORSEMENT_RETURN LedgerEntry for the removed item's prorated premium is appended"
          - "hop 4 (caused by hop 3): Policy.total_insured_value_cents, Policy.written_premium_cents and Policy.premium_balance_cents are recomputed"
          - "join: salvage_status == PENDING keeps adjustment_status at SETTLED; the claim does NOT close in this call"
      - from: SETTLED
        to: CLOSED
        trigger: "system, whenever the salvage axis is not PENDING: immediately inside POST /inland-marine/claims/{id}/settle on the repair branch (salvage_status == NOT_APPLICABLE), or inside POST /inland-marine/claims/{id}/salvage-recovery when the axis leaves PENDING on the total-loss branch"
        actor: system
        preconditions:
          - "salvage_status IN {NOT_APPLICABLE, RECOVERED, WAIVED} once the settling or salvage call has run"
        side_effects:
          - "the claim's two parallel axes have joined; no further transition is possible"

  - entity: Claim
    initial_state: NOT_APPLICABLE
    terminal_states: [RECOVERED, WAIVED]
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING
        trigger: "POST /inland-marine/claims/{id}/adjust with adjustment_basis == TOTAL_LOSS"
        actor: ClaimsAdjuster
        preconditions:
          - "adjustment_status transitions INSPECTED -> TOTAL_LOSS_DECLARED in the same call"
        side_effects:
          - "arms the salvage axis; the claim can no longer reach CLOSED on settle alone"
      - from: PENDING
        to: RECOVERED
        trigger: "POST /inland-marine/claims/{id}/salvage-recovery with salvage_proceeds_cents > 0"
        actor: ClaimsAdjuster
        preconditions:
          - "adjustment_status == SETTLED, else ERR_CLAIM_NOT_SETTLED"
        side_effects:
          - "set salvage_proceeds_cents and salvage_credit_cents = min(salvage_proceeds_cents, settlement_paid_cents)"
          - "append LedgerEntry {entry_type: SALVAGE_RECOVERY, ledger: LOSS, amount_cents: -salvage_credit_cents, claim_id: this claim}; recompute Policy.incurred_loss_cents"
          - "compensating move on the conserved capacity: CoveragePart.aggregate_paid_net_cents -= salvage_credit_cents and aggregate_available_cents += salvage_credit_cents"
          - "join: adjustment_status SETTLED -> CLOSED"
      - from: PENDING
        to: WAIVED
        trigger: "POST /inland-marine/claims/{id}/salvage-recovery with salvage_proceeds_cents == 0"
        actor: ClaimsAdjuster
        preconditions:
          - "adjustment_status == SETTLED, else ERR_CLAIM_NOT_SETTLED"
        side_effects:
          - "set salvage_proceeds_cents = 0 and salvage_credit_cents = 0; write NO ledger entry and leave both conserved quantities untouched"
          - "join: adjustment_status SETTLED -> CLOSED"
        note: "Divergent branch: the capacity credit and the LOSS ledger entry are both absent."
    note: "Second, independent state axis on the same Claim row: the salvage dimension (field salvage_status). It evolves independently of adjustment_status until the two axes join at CLOSED."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: equipment-item-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /inland-marine/coverage-parts/{id}/equipment-items"
    occ_field: "expected_policy_version"
    description: |
      Scheduling a new EquipmentItem onto a coverage part re-develops the
      part's rated premium and therefore rewrites the owning Policy's
      sum_of_part_premiums_cents, written_premium_cents,
      total_insured_value_cents and referral_required. A create that carries
      an expected_policy_version older than the Policy's current version is
      rejected: the writer's view of the policy premium and TIV predates an
      earlier accepted schedule change, so the referral threshold it believes
      it is under may already have been crossed. Adding an item is a
      legitimate repeat operation under the product spec, so the stale-version
      check is the only thing that distinguishes an informed writer from an
      uninformed one.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: value-report-supersede-stale-part
    parent_entity: CoveragePart
    write_endpoint: "POST /inland-marine/coverage-parts/{id}/value-reports"
    occ_field: "expected_coverage_part_version"
    description: |
      Filing a ValueReport for a period that already has a report on the part
      legitimately supersedes the prior report, so the operation cannot be
      barred by a state precondition. It is instead guarded by OCC on the
      CoveragePart: a filing whose expected_coverage_part_version is older
      than the part's current version is rejected, because the reporter's
      view of latest_report_period_end_date and earned_reported_premium_cents
      predates an already-accepted filing and its declared value would restate
      a period the part has since moved past.
    error_id: ERR_STALE_COVERAGE_PART_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
#
# Money: integer cents. Rates, factors and credits: basis points (bp), where
# 10000 bp == 1.0000. Every formula below is evaluated in exact rational
# arithmetic end to end and rounded EXACTLY ONCE, with round_half_up, at the
# point marked `round_half_up(...)`. No intermediate value is ever truncated.
# ---------------------------------------------------------------------------
calculations:
  - name: jobsite_security_tier
    trigger: "POST /inland-marine/jobsites/{id}/security-survey (both the first survey and any re-survey)"
    algorithm: weighted_scoring
    formula: |
      security_score = (1 if fenced else 0)
                     + (1 if lighting else 0)
                     + (1 if alarm_monitored else 0)
                     + (2 if guarded_24h else 0)     # a live guard is worth two controls

      security_tier = TIER_3 if security_score >= 5
                 else TIER_2 if security_score >= 3
                 else TIER_1 if security_score >= 1
                 else TIER_0
    input_set: "The four boolean theft controls supplied on the survey request; no other entity participates."
    constants:
      WEIGHT_FENCED: 1
      WEIGHT_LIGHTING: 1
      WEIGHT_ALARM_MONITORED: 1
      WEIGHT_GUARDED_24H: 2
      TIER_3_MIN_SCORE: 5
      TIER_2_MIN_SCORE: 3
      TIER_1_MIN_SCORE: 1
    precision: "Integer score; no rounding. All three tier cutoffs are inclusive (>=)."
    note: |
      Only the full set {fenced, lighting, alarm_monitored, guarded_24h} reaches
      TIER_3; the maximum score is 5 and TIER_3_MIN_SCORE is 5, so TIER_3 is the
      unique perfect-score tier. Dropping any single unweighted control from a
      perfect site lands on score 4 -> TIER_2; dropping only the guard lands on
      score 3 -> TIER_2 as well, which is the boundary pair worth testing.

  - name: rate_rule_selection
    trigger: "Whenever an EquipmentItem is rated: on POST /inland-marine/coverage-parts/{id}/equipment-items, on POST /inland-marine/equipment-items/{id}/assign-jobsite, and on any jobsite-driven re-rate cascade"
    algorithm: chronological
    formula: |
      rating_territory = Jobsite.territory_code            if EquipmentItem.assigned_jobsite_id IS NOT NULL
                         else owning Policy.territory_code

      age_years_at_rating = (calendar year of the logical clock) - EquipmentItem.model_year

      candidates = [ r IN RateRule
                     WHERE r.status == PUBLISHED
                       AND r.equipment_type == EquipmentItem.equipment_type
                       AND r.territory_code == rating_territory
                       AND r.age_band_min_years <= age_years_at_rating
                       AND age_years_at_rating <= r.age_band_max_years ]

      if candidates is empty: reject with ERR_NO_PUBLISHED_RATE_RULE

      # deterministic pick: newest publication first, then oldest row first
      order candidates by published_at DESC, then created_at ASC
      applied_rate_rule = candidates[0]

      applied_base_rate_bp = applied_rate_rule.base_rate_bp
      theft_hazard_grade   = applied_rate_rule.theft_hazard_grade
    input_set: "RateRule rows with status == PUBLISHED only. DRAFT and RETIRED rules are invisible to rating even when their band matches."
    constants: {}
    precision: "Age is whole calendar years (clock year minus model_year); both age-band bounds are INCLUSIVE."
    note: |
      Selection is a pure function of published rate rules plus the item's
      rating territory, so re-assigning an item to a jobsite in a different
      territory can swap in a different RateRule with a different base rate AND
      a different theft_hazard_grade, which in turn changes both the item's
      premium and the geo-tracking credit band it qualifies for. Ordering never
      consults `id`.

  - name: equipment_insured_value
    trigger: "Every time an EquipmentItem is rated or re-rated"
    algorithm: decay_function
    formula: |
      effective_valuation_basis = EquipmentItem.valuation_basis
                                  if EquipmentItem.valuation_basis IS NOT NULL
                                  else parent CoveragePart.valuation_basis

      switch effective_valuation_basis:
        case ACV:
          depreciation_bp = age_years_at_rating * ANNUAL_DEPRECIATION_BP
          retained_bp     = max(DEPRECIATION_FLOOR_BP, 10000 - depreciation_bp)
          insured_value_cents = round_half_up(original_cost_cents * retained_bp / 10000)
        case REPLACEMENT_COST:
          insured_value_cents = round_half_up(original_cost_cents
                                              * applied_rate_rule.replacement_cost_index_bp / 10000)
        case AGREED_VALUE:
          insured_value_cents = stated_value_cents        # no depreciation, no indexing
        case STATED_AMOUNT:
          insured_value_cents = min(stated_value_cents,
                                    round_half_up(original_cost_cents
                                                  * applied_rate_rule.replacement_cost_index_bp / 10000))
    input_set: "The single EquipmentItem being rated, its effective valuation basis, and the RateRule chosen by rate_rule_selection."
    constants:
      ANNUAL_DEPRECIATION_BP: 800
      DEPRECIATION_FLOOR_BP: 2000
    precision: "Integer cents, round_half_up, applied once per branch."
    note: |
      Four branches with genuinely different inputs: ACV consumes age, both
      REPLACEMENT_COST and STATED_AMOUNT consume the rate rule's index, and
      AGREED_VALUE consumes neither (it is the only basis where the insured
      value is immune to both age and the rate rule). The ACV floor bites at
      exactly age 10 (10 * 800 == 8000 -> retained 2000) and stays at 2000 bp
      for every older age.

  - name: equipment_item_premium
    trigger: "Every time an EquipmentItem is rated or re-rated (item create, assign-jobsite, jobsite-driven cascade)"
    algorithm: weighted_scoring
    formula: |
      valuation_factor_bp = VALUATION_FACTOR_BP[effective_valuation_basis]
      theft_factor_bp     = THEFT_FACTOR_BP[applied_rate_rule.theft_hazard_grade]

      geo_credit_bp = 0
      if EquipmentItem.geo_tracker_installed:
        geo_credit_bp = GEO_CREDIT_BP_HIGH_HAZARD if theft_hazard_grade IN {A, B}
                        else GEO_CREDIT_BP_LOW_HAZARD

      security_credit_bp = SECURITY_CREDIT_BP[Jobsite.security_tier]
                           if assigned_jobsite_id IS NOT NULL else 0

      applied_credit_bp = min(CREDIT_CAP_BP, geo_credit_bp + security_credit_bp)

      # ONE rounding, at the very end, over the exact rational product
      rated_premium_cents = round_half_up(
          insured_value_cents
          * applied_base_rate_bp
          * valuation_factor_bp
          * theft_factor_bp
          * (10000 - applied_credit_bp)
          / 10000^4 )
    input_set: "The single EquipmentItem, its insured_value_cents from equipment_insured_value, its RateRule, and (only when assigned) its Jobsite's security_tier."
    constants:
      VALUATION_FACTOR_BP: { ACV: 10000, REPLACEMENT_COST: 11500, AGREED_VALUE: 12500, STATED_AMOUNT: 10800 }
      THEFT_FACTOR_BP: { A: 11800, B: 11000, C: 10400, D: 10000 }
      GEO_CREDIT_BP_HIGH_HAZARD: 1500
      GEO_CREDIT_BP_LOW_HAZARD: 500
      SECURITY_CREDIT_BP: { TIER_0: 0, TIER_1: 300, TIER_2: 700, TIER_3: 1200 }
      CREDIT_CAP_BP: 2500
    precision: "Integer cents; exact rational product divided by 10000^4, then a single round_half_up."
    note: |
      Combinatorial: five independent multiplicative dimensions (base rate from
      {type x territory x age band}, valuation basis, theft grade, geo credit,
      jobsite security credit) whose product is rounded once. The geo credit is
      itself grade-dependent, so the theft grade enters the formula twice with
      opposite signs - a grade-A item is surcharged 18% but earns the larger
      1500 bp tracker credit. The credit cap binds at exactly
      geo 1500 + security 1200 == 2700 -> 2500.

  - name: coverage_part_equipment_premium
    trigger: "POST /inland-marine/policies/{id}/quote, and on every schedule change to an equipment coverage part (item create, item delete, assign-jobsite, jobsite-driven cascade)"
    algorithm: aggregation
    formula: |
      # Base (SCHEDULED) form: every item is rated on its own and the item
      # premiums are summed.
      rated_premium_cents = SUM( item.rated_premium_cents
                                 FOR item IN part.equipment_items
                                 WHERE item.status IN {RATED, ACTIVE} )
    input_set: "EquipmentItem rows on the part with status IN {RATED, ACTIVE}. REMOVED and TOTALED items are excluded from the moment they leave risk."
    constants:
      BLANKET_LOAD_BP: 10600
      BLANKET_COINSURANCE_CREDIT_BP: 500
      BLANKET_COINSURANCE_MIN_BP: 9000
    precision: "SCHEDULED variant: pure integer-cent sum, no additional rounding (each addend was already rounded once by equipment_item_premium). BLANKET variant: two roundings, one for the weighted rate and one for the premium."
    variants:
      - name: SCHEDULED
        when: "CoveragePart.rating_basis == SCHEDULED (the default), for part_type IN {SCHEDULED_EQUIPMENT, RENTED_LEASED}"
        difference: |
          rated_premium_cents = SUM(item.rated_premium_cents) over items in
          {RATED, ACTIVE}. The insured value, valuation factor, theft factor and
          credits of EVERY item are honoured individually, so a single
          high-hazard item drags the whole part up. blanket_limit_cents and
          coinsurance_pct_bp are ignored entirely.
      - name: BLANKET
        when: "CoveragePart.rating_basis == BLANKET, for part_type == BLANKET_EQUIPMENT"
        difference: |
          The schedule collapses into ONE insured-value-weighted rate applied to
          the declared blanket limit, and per-item theft grades and credits
          disappear:

            weighted_rate_bp = round_half_up(
                SUM(item.insured_value_cents * item.applied_base_rate_bp)
                / SUM(item.insured_value_cents) )

            coins_credit_bp = BLANKET_COINSURANCE_CREDIT_BP
                              if part.coinsurance_pct_bp >= BLANKET_COINSURANCE_MIN_BP else 0

            rated_premium_cents = round_half_up(
                part.blanket_limit_cents
                * weighted_rate_bp
                * VALUATION_FACTOR_BP[part.valuation_basis]
                * BLANKET_LOAD_BP
                * (10000 - coins_credit_bp)
                / 10000^4 )

          Same items, same insured values, materially different premium: the
          blanket form charges the declared limit rather than the schedule, adds
          a 6% blanket load, drops every theft factor and every geo/security
          credit, and hands back 500 bp once the insured co-insures at 90% or
          better. When SUM(insured_value_cents) == 0 the weighted rate is 0 and
          so is the blanket premium.
    note: |
      Both variants are ALWAYS computed at quote time and rolled up into
      Policy.scheduled_basis_premium_cents and Policy.blanket_basis_premium_cents
      so the two bases are directly comparable, but only the variant named by
      each part's own rating_basis feeds Policy.written_premium_cents.

  - name: policy_written_premium
    trigger: "POST /inland-marine/policies/{id}/quote, and after any endorsement, item removal, floater termination or jobsite-driven re-rate that changes a part's rated_premium_cents"
    algorithm: aggregation
    formula: |
      sum_of_part_premiums_cents = SUM( part.rated_premium_cents
                                        FOR part IN policy.coverage_parts
                                        WHERE part.status == ACTIVE )

      # The expense load is applied ONCE, to the SUM - never per part.
      loaded_cents = round_half_up( sum_of_part_premiums_cents
                                    * EXPENSE_LOAD_BP[policy.territory_code] / 10000 )

      written_premium_cents = max(loaded_cents, policy.minimum_premium_cents)

      # the two comparison roll-ups use the identical load-then-floor pipeline
      scheduled_basis_premium_cents = max(policy.minimum_premium_cents,
          round_half_up(SUM(part.SCHEDULED_variant_premium) * EXPENSE_LOAD_BP[territory] / 10000))
      blanket_basis_premium_cents = max(policy.minimum_premium_cents,
          round_half_up(SUM(part.BLANKET_variant_premium) * EXPENSE_LOAD_BP[territory] / 10000))

      referral_required = (written_premium_cents >= REFERRAL_PREMIUM_THRESHOLD_CENTS)
                          OR (total_insured_value_cents > REFERRAL_TIV_THRESHOLD_CENTS)
    input_set: "CoveragePart rows with status == ACTIVE. VOID parts contribute nothing."
    constants:
      EXPENSE_LOAD_BP: { T1_COASTAL: 10800, T2_URBAN: 10400, T3_INLAND: 10200, T4_REMOTE: 11200 }
      REFERRAL_PREMIUM_THRESHOLD_CENTS: 5000000
      REFERRAL_TIV_THRESHOLD_CENTS: 50000000
    precision: |
      Integer cents. Rounding ORDER IS PINNED: sum the unloaded part premiums
      exactly, apply the territory expense load to that single sum, then round
      once. Loading each part and rounding per part is WRONG and observably
      diverges - two identical T2_URBAN parts of 173318 give 360501 under the
      pinned order and 360502 under per-part rounding.
    note: |
      The minimum-premium floor is applied strictly AFTER the load, and the two
      referral thresholds deliberately differ in strictness: premium uses >= and
      TIV uses >. Only parts with part_type IN {SCHEDULED_EQUIPMENT,
      BLANKET_EQUIPMENT, RENTED_LEASED, REPORTING_FORM} have two variants; a
      TRANSIT or INSTALLATION_FLOATER part contributes its single
      rated_premium_cents identically to BOTH comparison roll-ups.

  - name: transit_applicable_limit
    trigger: "POST /inland-marine/coverage-parts/{id}/transit-shipments, and re-evaluated on POST /inland-marine/transit-shipments/{id}/depart"
    algorithm: waterfall_allocation
    formula: |
      catastrophe_zone = (origin_territory_code == T1_COASTAL)
                         OR (destination_territory_code == T1_COASTAL)

      conveyance_limit_cents = part.transit_owned_limit_cents  if Vehicle.ownership == OWNED
                               else part.transit_hired_limit_cents

      applicable_limit_cents = min( conveyance_limit_cents,
                                    Vehicle.per_conveyance_limit_cents,
                                    part.catastrophe_limit_cents if catastrophe_zone else conveyance_limit_cents )
    input_set: "The shipment being created, its Vehicle, and the TRANSIT CoveragePart's three limit fields."
    constants: {}
    precision: "Integer cents; a pure minimum, no rounding."
    note: |
      Three limits compete and the tightest wins. Coastal origin OR coastal
      destination is enough to pull the catastrophe limit into the minimum, so a
      T3_INLAND -> T1_COASTAL run is capped even though its origin is inland,
      and a hired conveyance is capped by BOTH the hired-equipment limit and the
      carrier's own per-conveyance limit.

  - name: transit_coverage_premium
    trigger: "POST /inland-marine/policies/{id}/quote for a CoveragePart with part_type == TRANSIT"
    algorithm: tiered_pricing
    formula: |
      owned_component_cents = round_half_up(part.transit_owned_limit_cents
                                            * TRANSIT_OWNED_RATE_BP / 10000)
      hired_component_cents = round_half_up(part.transit_hired_limit_cents
                                            * TRANSIT_HIRED_RATE_BP / 10000)

      base_transit_premium_cents = owned_component_cents + hired_component_cents

      # the tier is keyed on the BASE premium, BEFORE the surcharge is added
      cat_tier = CAT_TIER_1 if base_transit_premium_cents < CAT_TIER_2_MIN_CENTS
            else CAT_TIER_2 if base_transit_premium_cents < CAT_TIER_3_MIN_CENTS
            else CAT_TIER_3

      catastrophe_surcharge_cents = round_half_up(part.catastrophe_limit_cents
                                                  * CAT_SURCHARGE_BP[cat_tier] / 10000)

      rated_premium_cents = base_transit_premium_cents + catastrophe_surcharge_cents
    input_set: "The TRANSIT CoveragePart's own limit fields only. Individual TransitShipment rows do not affect the premium - they consume the limits."
    constants:
      TRANSIT_OWNED_RATE_BP: 65
      TRANSIT_HIRED_RATE_BP: 95
      CAT_TIER_2_MIN_CENTS: 65000
      CAT_TIER_3_MIN_CENTS: 300000
      CAT_SURCHARGE_BP: { CAT_TIER_1: 400, CAT_TIER_2: 900, CAT_TIER_3: 1400 }
    precision: |
      Integer cents. Each of the two rate components is rounded on its own
      BEFORE they are summed, and the tier lookup reads that summed, rounded,
      pre-surcharge base. The tier cutoffs are inclusive on the lower side:
      base 64999 is CAT_TIER_1 and base 65000 is CAT_TIER_2.
    note: |
      Hired conveyances are rated at 95 bp against 65 bp for owned, so shifting
      limit from owned to hired can jump the tier. The self-reference is the
      trap: the surcharge is a function of the tier, the tier is a function of
      the base, and the base must NOT include the surcharge.

  - name: installation_floater_premium
    trigger: "POST /inland-marine/coverage-parts/{id}/installation-floaters"
    algorithm: weighted_scoring
    formula: |
      term_days = (coverage_end_date - coverage_start_date) in whole days + 1   # CLOSED interval

      rated_premium_cents = round_half_up(
          installed_value_limit_cents
          * INSTALLATION_RATE_BP
          * INSTALLATION_SECURITY_FACTOR_BP[Jobsite.security_tier]
          * term_days
          / (10000 * 10000 * DAYS_PER_YEAR) )
    input_set: "The floater being created plus the security_tier of the Jobsite named on it. Equipment items on the same jobsite do not participate."
    constants:
      INSTALLATION_RATE_BP: 140
      INSTALLATION_SECURITY_FACTOR_BP: { TIER_0: 12500, TIER_1: 11000, TIER_2: 10000, TIER_3: 9500 }
      DAYS_PER_YEAR: 365
    precision: "Integer cents; the whole expression is evaluated as one exact rational and rounded once. term_days counts BOTH endpoints (a 2026-09-01..2026-12-01 floater is 92 days of exposure only if the end date is exclusive - here it is inclusive, so use +1 consistently with the overlap rule)."
    note: |
      The jobsite security tier is a MULTIPLIER here (TIER_0 is a 25% surcharge)
      whereas on equipment it is a CREDIT in basis points - the same jobsite
      attribute is monetised in two structurally different ways. TIER_0 sites
      can be priced but cannot be activated, so the surcharge branch is only
      ever observable on a PENDING floater.

  - name: installation_floater_termination
    trigger: "POST /inland-marine/installation-floaters/{id}/terminate, and the system EXPIRED / VOIDED transitions"
    algorithm: threshold
    formula: |
      elapsed_days = (termination_date - coverage_start_date) in whole days + 1

      switch termination_trigger:
        case ACCEPTANCE:
          earned_premium_cents = round_half_up(rated_premium_cents * elapsed_days / term_days)
          unearned_return_cents = rated_premium_cents - earned_premium_cents
        case OCCUPANCY:
          earned_premium_cents = rated_premium_cents        # occupancy earns the FULL term
          unearned_return_cents = 0
        case EXPIRY:
          earned_premium_cents = rated_premium_cents
          unearned_return_cents = 0
        case CANCELLATION:
          earned_premium_cents = round_half_up(rated_premium_cents * elapsed_days / term_days)
          unearned_return_cents = 0                        # returned by policy_cancellation_return instead
    input_set: "The single InstallationFloater and its termination_date."
    constants: {}
    precision: "Integer cents, one round_half_up on the pro-rata branch; unearned_return_cents is then exact by subtraction so earned + unearned == rated with no drift."
    note: |
      Coverage terminating at ACCEPTANCE and coverage terminating at OCCUPANCY
      are the same API call with the same date and produce different money: the
      acceptance branch refunds the unexpired portion via an ENDORSEMENT_RETURN
      ledger entry, the occupancy branch keeps 100% of the premium, writes no
      ledger entry, and bumps Policy.occupancy_termination_count. The two
      branches are otherwise side-effect identical, including the jobsite
      release cascade.

  - name: coverage_part_floater_premium
    trigger: "POST /inland-marine/policies/{id}/quote for a CoveragePart with part_type == INSTALLATION_FLOATER, and after any floater creation, termination, expiry or voiding"
    algorithm: aggregation
    formula: |
      rated_premium_cents = SUM( floater.rated_premium_cents - floater.unearned_return_cents
                                 FOR floater IN part.installation_floaters )
    input_set: |
      EVERY InstallationFloater on the part, in any status. A PENDING, ACTIVE,
      OCCUPANCY-terminated, EXPIRED or VOIDED floater has
      unearned_return_cents == 0 and therefore contributes its FULL
      rated_premium_cents; only an ACCEPTANCE-terminated floater contributes
      just its earned_premium_cents, because that is the only branch that ever
      returns premium.
    constants: {}
    precision: "Integer-cent sum, no additional rounding: both addends were already rounded by installation_floater_premium and installation_floater_termination."
    note: |
      This is the only part-level roll-up whose input set is NOT filtered by
      status - filtering out terminated floaters would silently give back
      premium the occupancy branch is supposed to keep. The subtraction of
      unearned_return_cents is what makes acceptance and occupancy diverge at
      the POLICY level, not just on the floater row.

  - name: reporting_period_earned_premium
    trigger: "POST /inland-marine/value-reports/{id}/adjudicate"
    algorithm: chronological
    formula: |
      period_days = (period_end_date - period_start_date) in whole days + 1   # INCLUSIVE both ends
      due_date    = period_end_date + REPORTING_GRACE_DAYS

      period_earned_premium_cents = round_half_up(
          reported_value_cents * part.reporting_annual_rate_bp * period_days
          / (10000 * DAYS_PER_YEAR) )

      if date(submitted_at) > due_date:
        late_penalty_cents = round_half_up(period_earned_premium_cents
                                           * LATE_REPORTING_PENALTY_BP / 10000)
      else:
        late_penalty_cents = 0
    input_set: "The single ValueReport being adjudicated plus its part's reporting_annual_rate_bp. SUPERSEDED reports never contribute to CoveragePart.earned_reported_premium_cents."
    constants:
      REPORTING_GRACE_DAYS: 15
      LATE_REPORTING_PENALTY_BP: 1000
      DAYS_PER_YEAR: 365
    precision: "Integer cents. TWO roundings, in this pinned order: round the period premium first, then compute the penalty as 10% of the ALREADY-ROUNDED period premium."
    note: |
      The premium is earned per reporting period on the value the insured
      declares, so a month with more days earns more on the same declared value.
      The late test is on the calendar date of submitted_at versus due_date, with
      submission exactly ON the due date being timely.

  - name: underreporting_penalty_factor
    trigger: "POST /inland-marine/claims/{id}/inspect (stored on the claim), and re-read by claim_settlement_amount"
    algorithm: threshold
    formula: |
      if parent CoveragePart.part_type != REPORTING_FORM:
        underreporting_factor_bp = 10000            # the penalty only exists on reporting forms
      else:
        governing_report = the ValueReport on this part with status IN {ACCEPTED, PENALIZED}
                           whose [period_start_date, period_end_date] contains claim.loss_date,
                           ordered by created_at ASC, last one wins
        if governing_report IS NULL:
          underreporting_factor_bp = 10000          # settlement is separately barred while a report is DELINQUENT
        else:
          reported_ratio_bp = round_half_up(governing_report.reported_value_cents * 10000
                                            / claim.actual_value_at_loss_cents)
          underreporting_factor_bp = 10000 if reported_ratio_bp >= FULL_REPORTING_THRESHOLD_BP
                                     else reported_ratio_bp
    input_set: "ValueReport rows on the claim's CoveragePart with status IN {ACCEPTED, PENALIZED} covering the loss date; SUBMITTED, DELINQUENT and SUPERSEDED reports are ignored."
    constants:
      FULL_REPORTING_THRESHOLD_BP: 9000
    precision: "Basis points, one round_half_up on the ratio. The threshold is INCLUSIVE: a ratio of exactly 9000 bp is treated as full reporting and the factor snaps to 10000."
    note: |
      Report 90% or more of the true value at risk and the insurer pays in full;
      report one basis point less and the claim is cut by the FULL shortfall
      ratio, not by the 1 bp difference. Reported 9000000 against an actual
      10000000 pays 100%; reported 8999000 pays 89.99% - a 1000-cent
      under-declaration costs 400400 cents of recovery on a 4000000 repair.

  - name: claim_loss_valuation
    trigger: "POST /inland-marine/claims/{id}/inspect"
    algorithm: threshold
    formula: |
      switch the claim's loss subject:
        case equipment_item_id IS NOT NULL:
          valuation_at_loss_cents = EquipmentItem.insured_value_cents
        case transit_shipment_id IS NOT NULL:
          valuation_at_loss_cents = TransitShipment.declared_value_cents
        case installation_floater_id IS NOT NULL:
          valuation_at_loss_cents = InstallationFloater.installed_value_limit_cents

      constructive_total_loss_threshold_cents =
          round_half_up(valuation_at_loss_cents * CONSTRUCTIVE_TOTAL_LOSS_BP / 10000)

      claim_limit_cents =
          part.per_item_limit_cents            if part_type IN {SCHEDULED_EQUIPMENT, RENTED_LEASED}
          part.blanket_limit_cents             if part_type == BLANKET_EQUIPMENT
          part.reporting_limit_cents           if part_type == REPORTING_FORM
          TransitShipment.applicable_limit_cents      if part_type == TRANSIT
          InstallationFloater.installed_value_limit_cents if part_type == INSTALLATION_FLOATER
    input_set: "Exactly one loss subject per claim (polymorphic), plus the governing CoveragePart's limit field for that part_type."
    constants:
      CONSTRUCTIVE_TOTAL_LOSS_BP: 7500
    precision: "Integer cents, one round_half_up on the threshold."
    note: |
      The valuation carried into the claim is the insured value the item was
      RATED on, not its original cost - so an ACV item that depreciated at
      underwriting is also settled on the depreciated figure. The constructive
      total loss threshold is 75% of that figure and is compared with >=.

  - name: claim_settlement_amount
    trigger: "POST /inland-marine/claims/{id}/inspect (both variants pre-computed) and POST /inland-marine/claims/{id}/adjust (the chosen variant becomes settlement_amount_cents)"
    algorithm: waterfall_allocation
    formula: |
      loss_of_use_paid_cents = 0
      if part.part_type == RENTED_LEASED AND subject item ownership IN {RENTED, LEASED}:
        payable_days = min(loss_of_use_days_claimed, part.loss_of_use_max_days)
        loss_of_use_paid_cents = payable_days * part.loss_of_use_daily_limit_cents

      # variant REPAIR
      repair_loss_cents = min( round_half_up(repair_estimate_cents
                                            * underreporting_factor_bp / 10000),
                               claim_limit_cents )
      repair_basis_settlement_cents = max(0, repair_loss_cents - part.deductible_cents)
                                     + loss_of_use_paid_cents

      # variant TOTAL_LOSS
      total_loss_cents = min( round_half_up(valuation_at_loss_cents
                                           * underreporting_factor_bp / 10000),
                              claim_limit_cents )
      total_loss_basis_settlement_cents = max(0, total_loss_cents - part.deductible_cents)
    input_set: "The single Claim, its loss subject, its governing CoveragePart, and the underreporting factor derived from that part's accepted value reports."
    constants: {}
    precision: |
      Integer cents. Pinned order per variant: apply the underreporting factor
      to the gross loss and round ONCE, then cap at the claim limit, then
      subtract the deductible, then floor at zero, and only then add
      loss-of-use. Subtracting the deductible before the limit cap, or applying
      the factor after the cap, both diverge.
    variants:
      - name: REPAIR
        when: "adjustment_basis == REPAIR, chosen on POST /claims/{id}/adjust; only selectable while repair_estimate_cents < constructive_total_loss_threshold_cents for equipment subjects"
        difference: |
          Pays the repair estimate, not the value: the gross loss is
          repair_estimate_cents. Loss-of-use IS payable on top (rented/leased
          equipment only), the salvage axis stays NOT_APPLICABLE, the item stays
          on risk, and the part's premium is untouched.
      - name: TOTAL_LOSS
        when: "adjustment_basis == TOTAL_LOSS, chosen on POST /claims/{id}/adjust; always selectable"
        difference: |
          Pays the full insured valuation: the gross loss is
          valuation_at_loss_cents. Loss-of-use is NOT payable and
          loss_of_use_paid_cents is forced to 0 even when days were claimed. The
          salvage axis is armed, the item leaves risk (TOTALED / LOST), and the
          part and policy premiums are re-derived over the survivors. For the
          same claim these two variants differ by both the gross loss AND the
          loss-of-use term, so the delta is never a simple ratio.
    note: |
      The constructive-total-loss rule makes the two variants non-symmetric: once
      the repair estimate reaches 75% of the valuation the REPAIR variant is
      still computable (and is returned on the settlement worksheet) but is no
      longer SELECTABLE - POST /claims/{id}/adjust rejects it with
      ERR_CONSTRUCTIVE_TOTAL_LOSS.

  - name: endorsement_prorated_premium
    trigger: "POST /inland-marine/coverage-parts/{id}/equipment-items and DELETE /inland-marine/equipment-items/{id} while the owning Policy.status IN {IN_FORCE, SUSPENDED}"
    algorithm: threshold
    formula: |
      remaining_days = (policy.expiration_date - date(logical clock)) in whole days
      if remaining_days <= 0: amount_cents = 0

      amount_cents = round_half_up(item.rated_premium_cents * remaining_days / policy.term_days)

      on ADD:    LedgerEntry {entry_type: ENDORSEMENT_PREMIUM, ledger: PREMIUM, amount_cents: +amount_cents}
      on REMOVE: LedgerEntry {entry_type: ENDORSEMENT_RETURN,  ledger: PREMIUM, amount_cents: -amount_cents}
    input_set: "The single EquipmentItem being added or removed and the owning Policy's term. No endorsement entry is written while the policy is still DRAFT, QUOTED, REFERRED or BOUND - the item is simply folded into the quote."
    constants: {}
    precision: |
      Integer cents, one round_half_up. The territory expense load is
      deliberately NOT re-applied to a mid-term endorsement: the ledger records
      the unloaded prorated item premium, while Policy.written_premium_cents is
      independently re-derived by policy_written_premium (loaded and floored).
      The two views therefore move by different amounts on the same call, and
      only premium_balance_cents must reconcile against the ledger.
    note: |
      Adding an item and then removing it on the same logical day is a
      compensating pair: +amount then -amount with the identical
      remaining_days, so premium_balance_cents returns to its exact prior value
      and written_premium_cents returns to its exact prior value.

  - name: policy_cancellation_return
    trigger: "POST /inland-marine/policies/{id}/cancel"
    algorithm: threshold
    formula: |
      unearned_days = (policy.expiration_date - cancel_effective_date) in whole days
      pro_rata_return_cents = round_half_up(policy.written_premium_cents
                                            * unearned_days / policy.term_days)

      if cancellation_reason == INSURED_REQUEST:
        return_cents = round_half_up(pro_rata_return_cents * SHORT_RATE_BP / 10000)
      else:                                  # NON_REPORTING or UNDERWRITING
        return_cents = pro_rata_return_cents

      LedgerEntry {entry_type: CANCELLATION_RETURN, ledger: PREMIUM, amount_cents: -return_cents}
    input_set: "The Policy's written_premium_cents as of cancellation and its own term. Individual parts and items are not re-rated."
    constants:
      SHORT_RATE_BP: 9000
    precision: |
      Integer cents. TWO roundings in this pinned order: round the pro-rata
      return first, then apply the 90% short-rate penalty to the ALREADY-ROUNDED
      pro-rata figure.
    note: |
      Insurer-initiated cancellation (NON_REPORTING after a delinquency sweep, or
      UNDERWRITING) returns the full pro-rata unearned premium; a cancellation at
      the insured's own request keeps a 10% short-rate penalty. Same date, same
      written premium, different return - and the reason also decides whether the
      policy's delinquent value reports are treated as cured.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing rule decides the response and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-blank."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 11
    category: auth
    check: "X-User-Role is one of Underwriter, UnderwritingManager, ClaimsAdjuster, Actuary, Policyholder."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The caller's role appears in the endpoint's declared roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 21
    category: auth
    check: "When X-User-Role == Policyholder, X-User-ID equals the id of the Policy that owns the target resource (directly, or transitively through CoveragePart)."
    error_id: ERR_NOT_POLICY_OWNER
    http_status: 403
    applies_to: "POST /inland-marine/coverage-parts/{id}/value-reports, POST /inland-marine/policies/{id}/claims, GET /inland-marine/policies/{id}, GET /inland-marine/policies/{id}/premium-summary, GET /inland-marine/policies/{id}/coverage-parts, GET /inland-marine/policies/{id}/ledger-entries, GET /inland-marine/claims/{id}"

  - priority: 22
    category: auth
    check: "On a referral decision, X-User-ID != Policy.referred_by_user_id - the manager deciding a referral cannot be the underwriter who raised it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inland-marine/policies/{id}/referral-decision"

  - priority: 23
    category: auth
    check: "On settlement, X-User-ID != Claim.declared_by_user_id - the manager authorising payment cannot be the adjuster who declared the basis."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inland-marine/claims/{id}/settle"

  - priority: 30
    category: existence
    check: "The {id} in a /policies/{id} path resolves to a Policy."
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "all /inland-marine/policies/{id}... endpoints"

  - priority: 30
    category: existence
    check: "The {id} in a /coverage-parts/{id} path resolves to a CoveragePart."
    error_id: ERR_COVERAGE_PART_NOT_FOUND
    http_status: 404
    applies_to: "all /inland-marine/coverage-parts/{id}... endpoints"

  - priority: 30
    category: existence
    check: "The {id} in a /rate-rules/{id} path resolves to a RateRule."
    error_id: ERR_RATE_RULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /inland-marine/rate-rules/{id}, POST /inland-marine/rate-rules/{id}/publish"

  - priority: 30
    category: existence
    check: "The {id} in an /equipment-items/{id} path resolves to an EquipmentItem."
    error_id: ERR_EQUIPMENT_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all /inland-marine/equipment-items/{id}... endpoints"

  - priority: 30
    category: existence
    check: "The {id} in a /jobsites/{id} path resolves to a Jobsite."
    error_id: ERR_JOBSITE_NOT_FOUND
    http_status: 404
    applies_to: "GET /inland-marine/jobsites/{id}, POST /inland-marine/jobsites/{id}/security-survey"

  - priority: 30
    category: existence
    check: "The {id} in an /installation-floaters/{id} path resolves to an InstallationFloater."
    error_id: ERR_INSTALLATION_FLOATER_NOT_FOUND
    http_status: 404
    applies_to: "all /inland-marine/installation-floaters/{id}... endpoints"

  - priority: 30
    category: existence
    check: "The {id} in a /vehicles/{id} path resolves to a Vehicle."
    error_id: ERR_VEHICLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /inland-marine/vehicles/{id}, POST /inland-marine/vehicles/{id}/approve"

  - priority: 30
    category: existence
    check: "The {id} in a /transit-shipments/{id} path resolves to a TransitShipment."
    error_id: ERR_TRANSIT_SHIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /inland-marine/transit-shipments/{id}... endpoints"

  - priority: 30
    category: existence
    check: "The {id} in a /value-reports/{id} path resolves to a ValueReport."
    error_id: ERR_VALUE_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "GET /inland-marine/value-reports/{id}, GET /inland-marine/value-reports/{id}/superseded-reports, POST /inland-marine/value-reports/{id}/adjudicate"

  - priority: 30
    category: existence
    check: "The {id} in a /claims/{id} path resolves to a Claim."
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "all /inland-marine/claims/{id}... endpoints"

  - priority: 31
    category: existence
    check: "A jobsite_id supplied in a request body resolves to a Jobsite."
    error_id: ERR_JOBSITE_NOT_FOUND
    http_status: 404
    applies_to: "POST /inland-marine/coverage-parts/{id}/equipment-items, POST /inland-marine/coverage-parts/{id}/installation-floaters, POST /inland-marine/equipment-items/{id}/assign-jobsite"

  - priority: 31
    category: existence
    check: "A vehicle_id supplied in a request body resolves to a Vehicle."
    error_id: ERR_VEHICLE_NOT_FOUND
    http_status: 404
    applies_to: "POST /inland-marine/coverage-parts/{id}/transit-shipments"

  - priority: 31
    category: existence
    check: "The coverage_part_id and the single loss-subject id supplied on claim creation resolve to existing rows."
    error_id: ERR_LOSS_SUBJECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /inland-marine/policies/{id}/claims"

  - priority: 35
    category: business_constraint
    check: "Request body shape: every required field present; integers are integers; money and limit fields >= 0; rate/factor fields in basis points >= 0; enum fields carry a declared member; dates are ISO 8601 YYYY-MM-DD and instants are ISO 8601 UTC; expiration_date > effective_date; age_band_min_years <= age_band_max_years; coverage_end_date >= coverage_start_date; period_end_date >= period_start_date; arrival_at > departure_at; a claim names EXACTLY ONE of equipment_item_id / transit_shipment_id / installation_floater_id."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 36
    category: business_constraint
    check: "Pagination: limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 40
    category: state
    check: "Quote requires Policy.status IN {DRAFT, QUOTED}."
    error_id: ERR_POLICY_NOT_QUOTABLE
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/quote"

  - priority: 40
    category: state
    check: "Refer requires Policy.status == QUOTED, Policy.referral_required == true, and referral_status IN {NOT_REQUIRED, DECLINED}."
    error_id: ERR_POLICY_NOT_REFERRABLE
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/refer"

  - priority: 40
    category: state
    check: "A referral decision requires Policy.status == REFERRED and referral_status == PENDING."
    error_id: ERR_REFERRAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/referral-decision"

  - priority: 40
    category: state
    check: "Bind requires Policy.status == QUOTED."
    error_id: ERR_POLICY_NOT_BINDABLE
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/bind"

  - priority: 40
    category: state
    check: "Activate requires Policy.status == BOUND."
    error_id: ERR_POLICY_NOT_ACTIVATABLE
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/activate"

  - priority: 40
    category: state
    check: "Cancel requires Policy.status IN {BOUND, IN_FORCE, SUSPENDED}."
    error_id: ERR_POLICY_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/cancel"

  - priority: 40
    category: state
    check: "Publishing a rate rule requires RateRule.status == DRAFT."
    error_id: ERR_RATE_RULE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /inland-marine/rate-rules/{id}/publish"

  - priority: 40
    category: state
    check: "Activating an item requires EquipmentItem.status == RATED; removing one requires status IN {RATED, ACTIVE}; assign-jobsite requires status IN {RATED, ACTIVE}."
    error_id: ERR_ITEM_ALREADY_OFF_RISK
    http_status: 409
    applies_to: "POST /inland-marine/equipment-items/{id}/activate, POST /inland-marine/equipment-items/{id}/assign-jobsite, DELETE /inland-marine/equipment-items/{id}"

  - priority: 40
    category: state
    check: "Activating a floater requires InstallationFloater.status == PENDING; terminating one requires status == ACTIVE."
    error_id: ERR_FLOATER_NOT_IN_REQUIRED_STATE
    http_status: 409
    applies_to: "POST /inland-marine/installation-floaters/{id}/activate, POST /inland-marine/installation-floaters/{id}/terminate"

  - priority: 40
    category: state
    check: "Approving a vehicle requires Vehicle.status IN {PENDING_APPROVAL, SUSPENDED}."
    error_id: ERR_VEHICLE_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /inland-marine/vehicles/{id}/approve"

  - priority: 40
    category: state
    check: "Depart requires TransitShipment.status == PLANNED; deliver requires status == IN_TRANSIT."
    error_id: ERR_SHIPMENT_NOT_IN_REQUIRED_STATE
    http_status: 409
    applies_to: "POST /inland-marine/transit-shipments/{id}/depart, POST /inland-marine/transit-shipments/{id}/deliver"

  - priority: 40
    category: state
    check: "Adjudicating requires ValueReport.status == SUBMITTED."
    error_id: ERR_REPORT_ALREADY_ADJUDICATED
    http_status: 409
    applies_to: "POST /inland-marine/value-reports/{id}/adjudicate"

  - priority: 40
    category: state
    check: "Inspect requires Claim.adjustment_status == OPEN; adjust requires INSPECTED; settle requires IN {REPAIR_APPROVED, TOTAL_LOSS_DECLARED}."
    error_id: ERR_CLAIM_NOT_IN_REQUIRED_STATE
    http_status: 409
    applies_to: "POST /inland-marine/claims/{id}/inspect, POST /inland-marine/claims/{id}/adjust, POST /inland-marine/claims/{id}/settle"

  - priority: 40
    category: state
    check: "Salvage recovery requires Claim.adjustment_status == SETTLED and salvage_status == PENDING (only a declared total loss ever arms the salvage axis)."
    error_id: ERR_CLAIM_NOT_SETTLED
    http_status: 409
    applies_to: "POST /inland-marine/claims/{id}/salvage-recovery"

  - priority: 41
    category: state
    check: "Adding a coverage part, an equipment item, a floater, a shipment or a value report - or endorsing one off the schedule - requires the owning Policy.status IN {DRAFT, QUOTED, REFERRED, BOUND, IN_FORCE, SUSPENDED}; a DECLINED, CANCELLED or EXPIRED policy accepts no new exposure and no endorsement. PATCH of a coverage part carries the same requirement. Because cancellation and a DECLINE referral decision both VOID every part, the part-scoped paths of this rule are observable on an EXPIRED policy (whose parts stay ACTIVE); a CANCELLED or DECLINED policy's part fails the priority 40 ERR_PART_VOID check first. The policy-scoped path POST /policies/{id}/coverage-parts has no part target, so it yields ERR_POLICY_NOT_MUTABLE on all three terminal statuses."
    error_id: ERR_POLICY_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /inland-marine/policies/{id}/coverage-parts, PATCH /inland-marine/coverage-parts/{id}, POST /inland-marine/coverage-parts/{id}/equipment-items, POST /inland-marine/coverage-parts/{id}/installation-floaters, POST /inland-marine/coverage-parts/{id}/transit-shipments, POST /inland-marine/coverage-parts/{id}/value-reports, DELETE /inland-marine/equipment-items/{id}"

  - priority: 41
    category: state
    check: "Putting exposure on risk requires the owning Policy.status == IN_FORCE: item activation, floater activation, shipment departure and the reporting sweep all refuse on any other status."
    error_id: ERR_POLICY_NOT_IN_FORCE
    http_status: 409
    applies_to: "POST /inland-marine/equipment-items/{id}/activate, POST /inland-marine/installation-floaters/{id}/activate, POST /inland-marine/transit-shipments/{id}/depart, POST /inland-marine/coverage-parts/{id}/reporting-sweep"

  - priority: 40
    category: state
    check: "The target CoveragePart.status == ACTIVE; a VOID part accepts no children and contributes no premium. This is a check on the TARGET entity, so it is evaluated before the priority 41 ancestor-state rules: a child create or PATCH against the VOID part of a CANCELLED or DECLINED policy returns ERR_PART_VOID, while the still-ACTIVE part of an EXPIRED policy returns ERR_POLICY_NOT_MUTABLE."
    error_id: ERR_PART_VOID
    http_status: 409
    applies_to: "PATCH /inland-marine/coverage-parts/{id}, POST /inland-marine/coverage-parts/{id}/equipment-items, POST /inland-marine/coverage-parts/{id}/installation-floaters, POST /inland-marine/coverage-parts/{id}/transit-shipments, POST /inland-marine/coverage-parts/{id}/value-reports"

  - priority: 41
    category: state
    check: "Departing requires Vehicle.status == APPROVED."
    error_id: ERR_VEHICLE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /inland-marine/transit-shipments/{id}/depart"

  - priority: 45
    category: business_constraint
    check: "expected_policy_version equals the owning Policy's current version (see §1.2.1 equipment-item-create-stale-policy)."
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /inland-marine/coverage-parts/{id}/equipment-items"

  - priority: 45
    category: business_constraint
    check: "expected_coverage_part_version equals the target CoveragePart's current version (see §1.2.1 value-report-supersede-stale-part)."
    error_id: ERR_STALE_COVERAGE_PART_VERSION
    http_status: 412
    applies_to: "POST /inland-marine/coverage-parts/{id}/value-reports"

  - priority: 50
    category: business_safety
    check: "A floater may only be activated on a Jobsite whose status == SURVEYED and whose security_tier != TIER_0."
    error_id: ERR_JOBSITE_SECURITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /inland-marine/installation-floaters/{id}/activate"

  - priority: 51
    category: business_safety
    check: "Theft control: an item whose selected RateRule has theft_hazard_grade == A may not sit on a jobsite with security_tier IN {TIER_0, TIER_1} unless geo_tracker_installed == true."
    error_id: ERR_GEO_TRACKING_REQUIRED
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/equipment-items, POST /inland-marine/equipment-items/{id}/assign-jobsite, POST /inland-marine/jobsites/{id}/security-survey"

  - priority: 52
    category: business_safety
    check: "A HIRED vehicle's carrier approval must still be current: logical clock date < Vehicle.approval_expires_on. Detecting a lapse also suspends the vehicle."
    error_id: ERR_VEHICLE_APPROVAL_EXPIRED
    http_status: 422
    applies_to: "POST /inland-marine/transit-shipments/{id}/depart"

  - priority: 53
    category: business_safety
    check: "Approving a HIRED vehicle requires a carrier_name and an approval_expires_on strictly after the logical clock date; re-approving a SUSPENDED vehicle requires a fresh approval_expires_on."
    error_id: ERR_CARRIER_APPROVAL_MISSING
    http_status: 422
    applies_to: "POST /inland-marine/vehicles/{id}/approve"

  - priority: 55
    category: business_temporal
    check: "An installation floater's [coverage_start_date, coverage_end_date] must lie inside [Policy.effective_date, Policy.expiration_date]."
    error_id: ERR_FLOATER_OUTSIDE_POLICY_TERM
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/installation-floaters"

  - priority: 55
    category: business_temporal
    check: "termination_date must lie inside the floater's own [coverage_start_date, coverage_end_date]."
    error_id: ERR_TERMINATION_DATE_OUTSIDE_COVERAGE
    http_status: 422
    applies_to: "POST /inland-marine/installation-floaters/{id}/terminate"

  - priority: 55
    category: business_temporal
    check: "A claim's loss_date must lie inside [Policy.effective_date, Policy.expiration_date] and, for a cancelled policy, at or before cancel_effective_date."
    error_id: ERR_LOSS_DATE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /inland-marine/policies/{id}/claims"

  - priority: 56
    category: business_temporal
    check: "A value report's [period_start_date, period_end_date] must lie inside the policy term."
    error_id: ERR_REPORT_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/value-reports"

  - priority: 57
    category: business_temporal
    check: "A value report either restates a period already on the part (identical period_start_date AND period_end_date - the supersede case) or starts strictly after CoveragePart.latest_report_period_end_date. Any other period placement is misaligned."
    error_id: ERR_REPORT_PERIOD_MISALIGNED
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/value-reports"

  - priority: 57
    category: business_temporal
    check: "cancel_effective_date must lie inside [Policy.effective_date, Policy.expiration_date]."
    error_id: ERR_CANCEL_DATE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /inland-marine/policies/{id}/cancel"

  - priority: 60
    category: business_referential
    check: "Child type must match the parent part_type: equipment items only on {SCHEDULED_EQUIPMENT, BLANKET_EQUIPMENT, RENTED_LEASED, REPORTING_FORM}; installation floaters only on INSTALLATION_FLOATER; transit shipments only on TRANSIT; value reports and the reporting sweep only on REPORTING_FORM."
    error_id: ERR_PART_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/equipment-items, POST /inland-marine/coverage-parts/{id}/installation-floaters, POST /inland-marine/coverage-parts/{id}/transit-shipments, POST /inland-marine/coverage-parts/{id}/value-reports, POST /inland-marine/coverage-parts/{id}/reporting-sweep"

  - priority: 61
    category: business_referential
    check: "A claim's coverage_part_id must belong to the claim's policy, and the named loss subject must belong to that same coverage part."
    error_id: ERR_LOSS_SUBJECT_NOT_ON_PART
    http_status: 422
    applies_to: "POST /inland-marine/policies/{id}/claims"

  - priority: 61
    category: business_referential
    check: "loss_of_use_days_claimed > 0 is only accepted when the governing CoveragePart.part_type == RENTED_LEASED and the subject EquipmentItem.ownership IN {RENTED, LEASED}."
    error_id: ERR_LOSS_OF_USE_NOT_COVERED
    http_status: 422
    applies_to: "POST /inland-marine/claims/{id}/adjust"

  - priority: 62
    category: business_constraint
    check: "A PUBLISHED RateRule must exist for the item's {equipment_type, rating territory, age band}."
    error_id: ERR_NO_PUBLISHED_RATE_RULE
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/equipment-items, POST /inland-marine/equipment-items/{id}/assign-jobsite"

  - priority: 63
    category: business_constraint
    check: "A jobsite carries at most one non-terminal InstallationFloater at a time: the new floater's CLOSED date interval [coverage_start_date, coverage_end_date] must not intersect that of any floater on the same jobsite with status IN {PENDING, ACTIVE}. Shared endpoints count as an intersection."
    error_id: ERR_JOBSITE_FLOATER_OVERLAP
    http_status: 409
    applies_to: "POST /inland-marine/coverage-parts/{id}/installation-floaters"

  - priority: 64
    category: business_constraint
    check: "A vehicle cannot be double-booked: the new shipment's HALF-OPEN instant window [departure_at, arrival_at) extended by TURNAROUND_BUFFER_HOURS (4) at its trailing edge must not intersect the buffered window of any shipment on the same vehicle with status IN {PLANNED, IN_TRANSIT}."
    error_id: ERR_VEHICLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inland-marine/coverage-parts/{id}/transit-shipments"

  - priority: 65
    category: business_constraint
    check: "Aggregate daily exposure per conveyance: SUM(declared_value_cents) over shipments on the same Vehicle with status IN {PLANNED, IN_TRANSIT} whose departure_at falls on the SAME UTC calendar date, including the new one, must not exceed Vehicle.per_conveyance_limit_cents."
    error_id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/transit-shipments"

  - priority: 66
    category: business_constraint
    check: "Quote requires something ratable: the policy must have at least one ACTIVE CoveragePart."
    error_id: ERR_NO_RATABLE_COVERAGE
    http_status: 422
    applies_to: "POST /inland-marine/policies/{id}/quote"

  - priority: 67
    category: business_constraint
    check: "REPAIR may not be chosen once repair_estimate_cents >= constructive_total_loss_threshold_cents for an equipment loss subject."
    error_id: ERR_CONSTRUCTIVE_TOTAL_LOSS
    http_status: 409
    applies_to: "POST /inland-marine/claims/{id}/adjust"

  - priority: 68
    category: business_constraint
    check: "Settlement is barred while any ValueReport on the claim's CoveragePart has status == DELINQUENT."
    error_id: ERR_REPORTING_DELINQUENT
    http_status: 409
    applies_to: "POST /inland-marine/claims/{id}/settle"

  - priority: 70
    category: business_fiscal
    check: "Bind requires referral clearance: if referral_required then referral_status == APPROVED."
    error_id: ERR_REFERRAL_REQUIRED
    http_status: 422
    applies_to: "POST /inland-marine/policies/{id}/bind"

  - priority: 71
    category: business_fiscal
    check: "An EquipmentItem's insured_value_cents must not exceed the part's per_item_limit_cents when that limit is set."
    error_id: ERR_ITEM_VALUE_EXCEEDS_PER_ITEM_LIMIT
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/equipment-items"

  - priority: 72
    category: business_fiscal
    check: "A floater's installed_value_limit_cents must not exceed the part's aggregate_available_cents at activation."
    error_id: ERR_FLOATER_LIMIT_EXCEEDS_PART_AGGREGATE
    http_status: 422
    applies_to: "POST /inland-marine/installation-floaters/{id}/activate"

  - priority: 73
    category: business_fiscal
    check: "A shipment's declared_value_cents must not exceed its computed applicable_limit_cents."
    error_id: ERR_TRANSIT_VALUE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/transit-shipments"

  - priority: 74
    category: business_fiscal
    check: "A value report's reported_value_cents must not exceed the part's reporting_limit_cents."
    error_id: ERR_REPORTED_VALUE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /inland-marine/coverage-parts/{id}/value-reports"

  - priority: 75
    category: business_fiscal
    check: "settlement_amount_cents must not exceed the governing CoveragePart.aggregate_available_cents."
    error_id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http_status: 422
    applies_to: "POST /inland-marine/claims/{id}/settle"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- RateRule (actuarial rate development) ------------------------------
  - method: POST
    path: "/inland-marine/rate-rules"
    description: "Draft a contractors-equipment rate cell for one {equipment_type, territory, age band}."
    roles: [Actuary]
    code: 201
    input: [equipment_type, territory_code, age_band_min_years, age_band_max_years, base_rate_bp, theft_hazard_grade, "replacement_cost_index_bp?"]
    output: RateRule
    side_effects:
      - "creates the rule in status DRAFT; DRAFT rules are invisible to rate_rule_selection"

  - method: POST
    path: "/inland-marine/rate-rules/{id}/publish"
    description: "Publish a draft rate cell so rating can select it."
    roles: [Actuary]
    code: 200
    input: []
    output: RateRule
    side_effects:
      - "status DRAFT -> PUBLISHED; stamps published_at from the logical clock"
      - "any other PUBLISHED rule with the identical {equipment_type, territory_code, age_band_min_years, age_band_max_years} is RETIRED"

  - method: GET
    path: "/inland-marine/rate-rules/{id}"
    description: "Read one rate rule."
    roles: [Actuary, Underwriter, UnderwritingManager]
    code: 200
    input: []
    output: RateRule
    side_effects: []

  # ---- Policy -------------------------------------------------------------
  - method: POST
    path: "/inland-marine/policies"
    description: "Open a new inland marine policy in DRAFT."
    roles: [Underwriter]
    code: 201
    input: [policyholder_name, territory_code, effective_date, expiration_date, "minimum_premium_cents?"]
    output: Policy
    side_effects:
      - "computes term_days = expiration_date - effective_date in whole days"
      - "status DRAFT, referral_status NOT_REQUIRED, every money roll-up 0"

  - method: GET
    path: "/inland-marine/policies/{id}"
    description: "Read one policy, including its premium roll-ups, referral fields and current version (the source of expected_policy_version)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/inland-marine/policies/{id}/premium-summary"
    description: "Computed read: the scheduled-versus-blanket premium comparison and the conserved premium/loss balances, all derived on the fly."
    roles: [Underwriter, UnderwritingManager, Policyholder]
    code: 200
    input: []
    output: "{ sum_of_part_premiums_cents: integer, expense_load_bp: integer, written_premium_cents: integer, scheduled_basis_premium_cents: integer, blanket_basis_premium_cents: integer, minimum_premium_applied: boolean, total_insured_value_cents: integer, premium_balance_cents: integer, incurred_loss_cents: integer, referral_required: boolean }"
    side_effects: []

  - method: GET
    path: "/inland-marine/policies/{id}/coverage-parts"
    description: "List the coverage parts on a policy (reverse reachability for CoveragePart.policy_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["part_type?", "limit?", "offset?"]
    output: CoveragePart[]
    side_effects: []

  - method: GET
    path: "/inland-marine/policies/{id}/ledger-entries"
    description: "List the immutable premium and loss ledger entries of a policy (reverse reachability for LedgerEntry.policy_id)."
    roles: [Underwriter, UnderwritingManager, Policyholder]
    code: 200
    input: ["ledger?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/inland-marine/policies/{id}/quote"
    description: "Rate every coverage part on both bases and roll the policy up to a quoted premium."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "re-runs rate_rule_selection, equipment_insured_value and equipment_item_premium for every EquipmentItem in {RATED, ACTIVE}"
      - "runs BOTH variants of coverage_part_equipment_premium per part and stores each part's rated_premium_cents from its own rating_basis"
      - "runs transit_coverage_premium for TRANSIT parts and sets deposit_premium_cents = rated_premium_cents for REPORTING_FORM parts"
      - "runs coverage_part_floater_premium for INSTALLATION_FLOATER parts"
      - "runs policy_written_premium: sets sum_of_part_premiums_cents, scheduled_basis_premium_cents, blanket_basis_premium_cents, written_premium_cents, total_insured_value_cents and referral_required"
      - "status DRAFT -> QUOTED, or QUOTED -> QUOTED on a re-quote; stamps quoted_at"

  - method: POST
    path: "/inland-marine/policies/{id}/refer"
    description: "Refer a quoted policy to underwriting management."
    roles: [Underwriter]
    code: 200
    input: ["referral_note?"]
    output: Policy
    side_effects:
      - "status QUOTED -> REFERRED, referral_status -> PENDING, referred_by_user_id = X-User-ID"

  - method: POST
    path: "/inland-marine/policies/{id}/referral-decision"
    description: "Approve or decline a pending referral. The deciding manager may not be the referring underwriter."
    roles: [UnderwritingManager]
    code: 200
    input: [decision]
    output: Policy
    side_effects:
      - "decision APPROVE: referral_status -> APPROVED, status REFERRED -> QUOTED"
      - "decision DECLINE: referral_status -> DECLINED, status REFERRED -> DECLINED, and every PENDING InstallationFloater on the policy is VOIDED"
      - "sets referral_decided_by_user_id = X-User-ID"

  - method: POST
    path: "/inland-marine/policies/{id}/bind"
    description: "Bind a quoted policy; requires referral clearance when the referral thresholds were crossed."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "status QUOTED -> BOUND; stamps bound_at"
      - "appends LedgerEntry {entry_type: INITIAL_PREMIUM, ledger: PREMIUM, amount_cents: +written_premium_cents} and sets premium_balance_cents"

  - method: POST
    path: "/inland-marine/policies/{id}/activate"
    description: "Put a bound policy on risk once the logical clock has reached its effective date."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "requires logical clock date >= effective_date, else ERR_POLICY_NOT_ACTIVATABLE"
      - "status BOUND -> IN_FORCE; stamps in_force_at"

  - method: POST
    path: "/inland-marine/policies/{id}/cancel"
    description: "Cancel a policy mid-term and return the unearned premium, pro-rata or short-rate depending on who asked."
    roles: [UnderwritingManager]
    code: 200
    input: [cancellation_reason, cancel_effective_date]
    output: Policy
    side_effects:
      - "runs policy_cancellation_return and appends LedgerEntry {entry_type: CANCELLATION_RETURN, ledger: PREMIUM, amount_cents: -return_cents}; updates premium_balance_cents"
      - "status BOUND | IN_FORCE | SUSPENDED -> CANCELLED; stores cancellation_reason and cancel_effective_date"
      - "cascade: every EquipmentItem in {RATED, ACTIVE} -> REMOVED (no per-item endorsement entry, the cancellation return covers them), every InstallationFloater in {PENDING, ACTIVE} -> VOIDED, every TransitShipment in PLANNED -> CANCELLED, every CoveragePart -> VOID"
      - "cascade: each voided floater decrements Jobsite.active_floater_count, releasing jobsites that reach 0"

  - method: POST
    path: "/inland-marine/policies/{id}/coverage-parts"
    description: "Add a coverage part to a policy. Does NOT bump Policy.version."
    roles: [Underwriter]
    code: 201
    input: [part_type, valuation_basis, "rating_basis?", "deductible_cents?", "blanket_limit_cents?", "coinsurance_pct_bp?", "per_item_limit_cents?", aggregate_limit_cents, "loss_of_use_daily_limit_cents?", "loss_of_use_max_days?", "transit_owned_limit_cents?", "transit_hired_limit_cents?", "catastrophe_limit_cents?", "reporting_frequency?", "reporting_annual_rate_bp?", "reporting_limit_cents?"]
    output: CoveragePart
    side_effects:
      - "status ACTIVE; aggregate_available_cents = aggregate_limit_cents and aggregate_paid_net_cents = 0"

  - method: POST
    path: "/inland-marine/policies/{id}/claims"
    description: "Report a loss against exactly one insured subject on one coverage part."
    roles: [Underwriter, Policyholder]
    code: 201
    input: [coverage_part_id, loss_date, loss_type, "equipment_item_id?", "transit_shipment_id?", "installation_floater_id?"]
    output: Claim
    side_effects:
      - "adjustment_status OPEN, salvage_status NOT_APPLICABLE, every money field 0"

  # ---- CoveragePart -------------------------------------------------------
  - method: GET
    path: "/inland-marine/coverage-parts/{id}"
    description: "Read one coverage part, including its aggregate capacity split and current version (the source of expected_coverage_part_version)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: CoveragePart
    side_effects: []

  - method: PATCH
    path: "/inland-marine/coverage-parts/{id}"
    description: "Endorse the terms of a coverage part: switch rating basis or valuation basis, move limits, retune the reporting rate."
    roles: [Underwriter]
    code: 200
    input: ["rating_basis?", "valuation_basis?", "deductible_cents?", "blanket_limit_cents?", "coinsurance_pct_bp?", "per_item_limit_cents?", "loss_of_use_daily_limit_cents?", "loss_of_use_max_days?", "transit_owned_limit_cents?", "transit_hired_limit_cents?", "catastrophe_limit_cents?", "reporting_annual_rate_bp?", "reporting_limit_cents?"]
    output: CoveragePart
    side_effects:
      - "changing rating_basis or valuation_basis re-derives rated_premium_cents on the next quote from the other variant of coverage_part_equipment_premium"
      - "raising aggregate-relevant limits does NOT retroactively restore aggregate_available_cents already consumed by paid claims"
      - "increments CoveragePart.version by 1"

  - method: GET
    path: "/inland-marine/coverage-parts/{id}/equipment-items"
    description: "List the scheduled equipment on a coverage part (reverse reachability for EquipmentItem.coverage_part_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentItem[]
    side_effects: []

  - method: GET
    path: "/inland-marine/coverage-parts/{id}/value-reports"
    description: "List the periodic value reports filed on a reporting-form part (reverse reachability for ValueReport.coverage_part_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ValueReport[]
    side_effects: []

  - method: POST
    path: "/inland-marine/coverage-parts/{id}/equipment-items"
    description: "Schedule a piece of contractors equipment onto a coverage part; the item is rated in the same call. Guarded by OCC on the owning Policy."
    roles: [Underwriter]
    code: 201
    input: [description, equipment_type, model_year, original_cost_cents, ownership, expected_policy_version, "stated_value_cents?", "geo_tracker_installed?", "valuation_basis?", "assigned_jobsite_id?"]
    output: EquipmentItem
    side_effects:
      - "runs rate_rule_selection, equipment_insured_value and equipment_item_premium; stores age_years_at_rating, insured_value_cents, applied_rate_rule_id, applied_base_rate_bp, applied_credit_bp, rated_premium_cents; status RATED"
      - "re-runs coverage_part_equipment_premium for the part and policy_written_premium for the policy, refreshing total_insured_value_cents and referral_required"
      - "when the owning Policy.status IN {IN_FORCE, SUSPENDED}, runs endorsement_prorated_premium and appends LedgerEntry {entry_type: ENDORSEMENT_PREMIUM, ledger: PREMIUM}"
      - "increments Policy.version by 1"

  - method: POST
    path: "/inland-marine/coverage-parts/{id}/installation-floaters"
    description: "Open an installation floater for one project on one jobsite; coverage runs on a closed date interval and no jobsite may carry two live floaters."
    roles: [Underwriter]
    code: 201
    input: [jobsite_id, project_name, installed_value_limit_cents, coverage_start_date, coverage_end_date]
    output: InstallationFloater
    side_effects:
      - "computes term_days over the CLOSED interval and runs installation_floater_premium using the jobsite's security tier"
      - "status PENDING; increments Jobsite.active_floater_count by 1"
      - "re-runs policy_written_premium on the next quote"

  - method: POST
    path: "/inland-marine/coverage-parts/{id}/transit-shipments"
    description: "Plan a transit movement on an owned or hired conveyance; the applicable limit is derived from the tightest of the part, the vehicle and the catastrophe limit."
    roles: [Underwriter]
    code: 201
    input: [vehicle_id, origin_territory_code, destination_territory_code, departure_at, arrival_at, declared_value_cents]
    output: TransitShipment
    side_effects:
      - "derives catastrophe_zone and runs transit_applicable_limit to set applicable_limit_cents"
      - "status PLANNED"

  - method: POST
    path: "/inland-marine/coverage-parts/{id}/value-reports"
    description: "File the periodic declared value for one reporting period. A filing for a period already reported legitimately supersedes it, so the call is guarded by OCC on the CoveragePart."
    roles: [Underwriter, Policyholder]
    code: 201
    input: [period_start_date, period_end_date, reported_value_cents, expected_coverage_part_version]
    output: ValueReport
    side_effects:
      - "computes period_days over the INCLUSIVE period and due_date = period_end_date + 15 days; status SUBMITTED; stamps submitted_at from the logical clock"
      - "any prior ValueReport on the same part for the identical period whose status is NOT already SUPERSEDED moves to SUPERSEDED with superseded_by_report_id set to the new report, so a restatement chain stays a chain rather than being re-pointed; an ACCEPTED or PENALIZED predecessor also has its period premium backed out of CoveragePart.earned_reported_premium_cents via a compensating REPORTING_ADJUSTMENT ledger entry"
      - "when the superseded predecessor was the policy's last DELINQUENT report and the Policy is SUSPENDED, the Policy returns to IN_FORCE"
      - "increments CoveragePart.version by 1"

  - method: POST
    path: "/inland-marine/coverage-parts/{id}/reporting-sweep"
    description: "Run the delinquency sweep on a reporting-form part: every fully elapsed period past its grace date with no report on file becomes a DELINQUENT zero-value report and suspends the policy."
    roles: [Underwriter]
    code: 200
    input: []
    output: "{ swept_period_count: integer, delinquent_report_ids: string[], policy_status: string, part_id: string }"
    side_effects:
      - "for each reporting period of the part (per reporting_frequency) whose due_date < logical clock date and which has no ValueReport in {SUBMITTED, ACCEPTED, PENALIZED}, creates a ValueReport with reported_value_cents 0 and status DELINQUENT"
      - "when at least one DELINQUENT report was created and Policy.status == IN_FORCE, the Policy transitions IN_FORCE -> SUSPENDED"
      - "increments CoveragePart.version by 1 and sets latest_report_period_end_date to the last swept period end"

  # ---- EquipmentItem ------------------------------------------------------
  - method: GET
    path: "/inland-marine/equipment-items/{id}"
    description: "Read one scheduled equipment item with its rating trace."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []

  - method: GET
    path: "/inland-marine/equipment-items"
    description: "Filtered list of equipment items (reverse reachability for assigned_jobsite_id and applied_rate_rule_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Actuary]
    code: 200
    input: ["coverage_part_id?", "assigned_jobsite_id?", "applied_rate_rule_id?", "status?", "limit?", "offset?"]
    output: EquipmentItem[]
    side_effects: []

  - method: POST
    path: "/inland-marine/equipment-items/{id}/assign-jobsite"
    description: "Move an item to a jobsite. Re-develops the rate from the jobsite's territory and re-prices the geo-tracking and jobsite-security credits."
    roles: [Underwriter]
    code: 200
    input: [jobsite_id]
    output: EquipmentItem
    side_effects:
      - "re-runs rate_rule_selection against the jobsite's territory_code, then equipment_insured_value and equipment_item_premium with the jobsite's security credit"
      - "enforces the grade-A theft control: a high-theft item on a TIER_0 or TIER_1 site must carry a geo tracker"
      - "re-runs coverage_part_equipment_premium and policy_written_premium"

  - method: POST
    path: "/inland-marine/equipment-items/{id}/activate"
    description: "Put a rated item on risk. Only possible while the owning policy is IN_FORCE."
    roles: [Underwriter]
    code: 200
    input: []
    output: EquipmentItem
    side_effects:
      - "status RATED -> ACTIVE"

  - method: DELETE
    path: "/inland-marine/equipment-items/{id}"
    description: "Remove an item from the schedule mid-term and return the unearned portion of its premium."
    roles: [Underwriter]
    code: 200
    input: []
    output: EquipmentItem
    side_effects:
      - "status RATED | ACTIVE -> REMOVED; stamps removed_at"
      - "when the owning Policy.status IN {IN_FORCE, SUSPENDED}, runs endorsement_prorated_premium and appends LedgerEntry {entry_type: ENDORSEMENT_RETURN, ledger: PREMIUM, amount_cents: negative}"
      - "re-runs coverage_part_equipment_premium and policy_written_premium over the survivors"

  # ---- Jobsite ------------------------------------------------------------
  - method: POST
    path: "/inland-marine/jobsites"
    description: "Register a jobsite. Jobsites are shared across policies and start UNSURVEYED at TIER_0."
    roles: [Underwriter]
    code: 201
    input: [name, territory_code]
    output: Jobsite
    side_effects:
      - "status UNSURVEYED, security_score 0, security_tier TIER_0, active_floater_count 0"

  - method: GET
    path: "/inland-marine/jobsites/{id}"
    description: "Read one jobsite with its theft controls and derived security tier."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: []
    output: Jobsite
    side_effects: []

  - method: POST
    path: "/inland-marine/jobsites/{id}/security-survey"
    description: "Record the jobsite security survey; re-scores the site and re-prices every item standing on it."
    roles: [Underwriter]
    code: 200
    input: [fenced, lighting, alarm_monitored, guarded_24h]
    output: Jobsite
    side_effects:
      - "runs jobsite_security_tier to set security_score and security_tier; status UNSURVEYED | RELEASED -> SURVEYED, or SURVEYED -> SURVEYED on a re-survey; stamps surveyed_at"
      - "cascade: every EquipmentItem assigned to this jobsite with status IN {RATED, ACTIVE} is re-rated with the new security credit, then each affected CoveragePart and Policy premium is recomputed"
      - "a re-survey that drops the tier can make a standing grade-A item violate the geo-tracking control; the survey is then rejected with ERR_GEO_TRACKING_REQUIRED and nothing changes"

  # ---- InstallationFloater ------------------------------------------------
  - method: GET
    path: "/inland-marine/installation-floaters/{id}"
    description: "Read one installation floater with its earned/unearned split."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: InstallationFloater
    side_effects: []

  - method: GET
    path: "/inland-marine/installation-floaters"
    description: "Filtered list of installation floaters (reverse reachability for coverage_part_id and jobsite_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: ["coverage_part_id?", "jobsite_id?", "status?", "limit?", "offset?"]
    output: InstallationFloater[]
    side_effects: []

  - method: POST
    path: "/inland-marine/installation-floaters/{id}/activate"
    description: "Put an installation floater on risk. Requires a surveyed jobsite above TIER_0 and enough part aggregate."
    roles: [Underwriter]
    code: 200
    input: []
    output: InstallationFloater
    side_effects:
      - "status PENDING -> ACTIVE"

  - method: POST
    path: "/inland-marine/installation-floaters/{id}/terminate"
    description: "Terminate installation coverage at acceptance of the work or at occupancy of the structure. The two reasons earn premium differently."
    roles: [Underwriter]
    code: 200
    input: [termination_reason, termination_date]
    output: InstallationFloater
    side_effects:
      - "runs installation_floater_termination; ACCEPTANCE returns the unearned premium via an ENDORSEMENT_RETURN ledger entry, OCCUPANCY earns the full term, writes no ledger entry and increments Policy.occupancy_termination_count"
      - "status ACTIVE -> TERMINATED_ACCEPTANCE | TERMINATED_OCCUPANCY; decrements Jobsite.active_floater_count"
      - "cascade: a jobsite whose active_floater_count reaches 0 is RELEASED, which re-rates every item standing on it with zero security credit and re-rolls the affected parts and policies"

  # ---- Vehicle ------------------------------------------------------------
  - method: POST
    path: "/inland-marine/vehicles"
    description: "Register an owned or hired conveyance. Hired conveyances need a carrier and an approval expiry."
    roles: [Underwriter]
    code: 201
    input: [unit_label, ownership, per_conveyance_limit_cents, "carrier_name?", "approval_expires_on?"]
    output: Vehicle
    side_effects:
      - "status PENDING_APPROVAL, in_transit_value_cents 0"

  - method: GET
    path: "/inland-marine/vehicles/{id}"
    description: "Read one conveyance with its approval state and value currently in transit."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/inland-marine/vehicles/{id}/approve"
    description: "Approve a conveyance for transit, or re-approve a suspended one with a fresh carrier approval date."
    roles: [Underwriter]
    code: 200
    input: ["approval_expires_on?"]
    output: Vehicle
    side_effects:
      - "status PENDING_APPROVAL | SUSPENDED -> APPROVED; stamps approved_at and stores approval_expires_on when supplied"

  # ---- TransitShipment ----------------------------------------------------
  - method: GET
    path: "/inland-marine/transit-shipments/{id}"
    description: "Read one transit movement with its derived applicable limit."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: TransitShipment
    side_effects: []

  - method: GET
    path: "/inland-marine/transit-shipments"
    description: "Filtered list of transit movements (reverse reachability for coverage_part_id and vehicle_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: ["coverage_part_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: TransitShipment[]
    side_effects: []

  - method: POST
    path: "/inland-marine/transit-shipments/{id}/depart"
    description: "Dispatch a planned movement. Re-checks the conveyance's approval currency at the logical clock."
    roles: [Underwriter]
    code: 200
    input: []
    output: TransitShipment
    side_effects:
      - "status PLANNED -> IN_TRANSIT; stamps departed_at from the logical clock; adds declared_value_cents to Vehicle.in_transit_value_cents"
      - "a HIRED conveyance whose approval_expires_on has been reached is SUSPENDED and the departure is rejected with ERR_VEHICLE_APPROVAL_EXPIRED"

  - method: POST
    path: "/inland-marine/transit-shipments/{id}/deliver"
    description: "Complete a movement and free the conveyance's in-transit value."
    roles: [Underwriter]
    code: 200
    input: []
    output: TransitShipment
    side_effects:
      - "status IN_TRANSIT -> DELIVERED; stamps delivered_at; subtracts declared_value_cents from Vehicle.in_transit_value_cents"

  # ---- ValueReport --------------------------------------------------------
  - method: GET
    path: "/inland-marine/value-reports/{id}"
    description: "Read one periodic value report with its earned premium and any late penalty."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: ValueReport
    side_effects: []

  - method: GET
    path: "/inland-marine/value-reports/{id}/superseded-reports"
    description: "List the reports this report superseded (reverse reachability for the self-referential ValueReport.superseded_by_report_id)."
    roles: [Underwriter, UnderwritingManager, Policyholder]
    code: 200
    input: ["limit?", "offset?"]
    output: ValueReport[]
    side_effects: []

  - method: POST
    path: "/inland-marine/value-reports/{id}/adjudicate"
    description: "Accept a value report and earn its period premium; a filing past the grace date is accepted but penalised."
    roles: [Underwriter]
    code: 200
    input: []
    output: ValueReport
    side_effects:
      - "runs reporting_period_earned_premium; status SUBMITTED -> ACCEPTED when timely, SUBMITTED -> PENALIZED when submitted_at is past due_date"
      - "appends LedgerEntry {entry_type: REPORTING_ADJUSTMENT, ledger: PREMIUM, amount_cents: +period_earned_premium_cents}, plus LedgerEntry {entry_type: LATE_REPORTING_PENALTY, ledger: PREMIUM, amount_cents: +late_penalty_cents} on the penalised branch"
      - "adds the period premium to CoveragePart.earned_reported_premium_cents and refreshes Policy.premium_balance_cents"
      - "cascade: any SUBMITTED or DELINQUENT sibling report for the identical period becomes SUPERSEDED, and clearing the policy's last delinquency returns a SUSPENDED policy to IN_FORCE"

  # ---- Claim --------------------------------------------------------------
  - method: GET
    path: "/inland-marine/claims/{id}"
    description: "Read one claim with both of its state axes and both settlement variants."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/inland-marine/claims"
    description: "Filtered list of claims (reverse reachability for policy_id, coverage_part_id and all three polymorphic loss-subject FKs)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: ["policy_id?", "coverage_part_id?", "equipment_item_id?", "transit_shipment_id?", "installation_floater_id?", "adjustment_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/inland-marine/claims/{id}/ledger-entries"
    description: "List the loss-ledger entries attached to a claim (reverse reachability for LedgerEntry.claim_id)."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/inland-marine/claims/{id}/settlement-worksheet"
    description: "Computed read: the full adjustment worksheet showing BOTH settlement bases side by side, the constructive-total-loss test, the underreporting factor and the remaining part aggregate."
    roles: [Underwriter, UnderwritingManager, ClaimsAdjuster]
    code: 200
    input: []
    output: "{ valuation_at_loss_cents: integer, constructive_total_loss_threshold_cents: integer, constructive_total_loss_reached: boolean, underreporting_factor_bp: integer, claim_limit_cents: integer, deductible_cents: integer, loss_of_use_paid_cents: integer, repair_basis_settlement_cents: integer, total_loss_basis_settlement_cents: integer, repair_basis_selectable: boolean, aggregate_available_cents: integer }"
    side_effects: []

  - method: POST
    path: "/inland-marine/claims/{id}/inspect"
    description: "Record the inspection: the repair estimate and the actual value at risk at the time of loss. Pre-computes both settlement bases."
    roles: [ClaimsAdjuster]
    code: 200
    input: [repair_estimate_cents, actual_value_at_loss_cents]
    output: Claim
    side_effects:
      - "runs claim_loss_valuation, underreporting_penalty_factor and BOTH variants of claim_settlement_amount"
      - "adjustment_status OPEN -> INSPECTED; sets inspected_by_user_id = X-User-ID"

  - method: POST
    path: "/inland-marine/claims/{id}/adjust"
    description: "Choose the adjustment basis. REPAIR is barred once the estimate reaches the constructive-total-loss threshold; TOTAL_LOSS arms the salvage axis."
    roles: [ClaimsAdjuster]
    code: 200
    input: [adjustment_basis, "loss_of_use_days_claimed?"]
    output: Claim
    side_effects:
      - "REPAIR: settlement_amount_cents = repair_basis_settlement_cents including any loss-of-use extension; adjustment_status INSPECTED -> REPAIR_APPROVED; salvage_status stays NOT_APPLICABLE"
      - "TOTAL_LOSS: settlement_amount_cents = total_loss_basis_settlement_cents, loss_of_use_paid_cents forced to 0; adjustment_status INSPECTED -> TOTAL_LOSS_DECLARED and salvage_status NOT_APPLICABLE -> PENDING"
      - "sets declared_by_user_id = X-User-ID"

  - method: POST
    path: "/inland-marine/claims/{id}/settle"
    description: "Authorise payment. The manager settling may not be the adjuster who declared the basis."
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "sets settlement_paid_cents and settled_by_user_id; appends LedgerEntry {entry_type: CLAIM_SETTLEMENT, ledger: LOSS, amount_cents: +settlement_paid_cents}; refreshes Policy.incurred_loss_cents"
      - "moves the part's conserved capacity: aggregate_paid_net_cents += paid, aggregate_available_cents -= paid"
      - "REPAIR branch: adjustment_status REPAIR_APPROVED -> SETTLED -> CLOSED in the same call, because the salvage axis is NOT_APPLICABLE"
      - "TOTAL_LOSS branch: adjustment_status TOTAL_LOSS_DECLARED -> SETTLED only; cascade takes the loss subject off risk (EquipmentItem -> TOTALED or TransitShipment -> LOST), re-rolls the part premium with an ENDORSEMENT_RETURN entry for a removed item, then re-rolls the policy premium and TIV"

  - method: POST
    path: "/inland-marine/claims/{id}/salvage-recovery"
    description: "Record the salvage outcome on a settled total loss. Proceeds credit the loss ledger and restore part aggregate; zero proceeds waive the recovery."
    roles: [ClaimsAdjuster]
    code: 200
    input: [salvage_proceeds_cents]
    output: Claim
    side_effects:
      - "proceeds > 0: salvage_status PENDING -> RECOVERED, salvage_credit_cents = min(proceeds, settlement_paid_cents), appends LedgerEntry {entry_type: SALVAGE_RECOVERY, ledger: LOSS, amount_cents: -salvage_credit_cents}, restores aggregate_available_cents and reduces aggregate_paid_net_cents"
      - "proceeds == 0: salvage_status PENDING -> WAIVED, no ledger entry, no capacity restoration"
      - "join: adjustment_status SETTLED -> CLOSED on either branch"

  # ---- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every date and instant comparison in this domain reads. The server starts at exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [UnderwritingManager]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, expired_policy_ids: string[], expired_floater_ids: string[] }"
    side_effects:
      - "advancing the clock past a Policy.expiration_date transitions that policy IN_FORCE | SUSPENDED -> EXPIRED"
      - "advancing the clock past an ACTIVE InstallationFloater.coverage_end_date transitions it to EXPIRED, earning the full premium and decrementing Jobsite.active_floater_count"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, blank, or naming a role outside the five declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
  - id: ERR_NOT_POLICY_OWNER
    http: 403
    condition: "A Policyholder acted on a resource belonging to a Policy other than the one whose id equals X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The manager deciding a referral is the underwriter who raised it, or the manager settling a claim is the adjuster who declared its basis."

  # --- existence ---
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "No Policy with the given id."
  - id: ERR_COVERAGE_PART_NOT_FOUND
    http: 404
    condition: "No CoveragePart with the given id."
  - id: ERR_RATE_RULE_NOT_FOUND
    http: 404
    condition: "No RateRule with the given id."
  - id: ERR_EQUIPMENT_ITEM_NOT_FOUND
    http: 404
    condition: "No EquipmentItem with the given id."
  - id: ERR_JOBSITE_NOT_FOUND
    http: 404
    condition: "No Jobsite with the given id, in the path or in a request body."
  - id: ERR_INSTALLATION_FLOATER_NOT_FOUND
    http: 404
    condition: "No InstallationFloater with the given id."
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "No Vehicle with the given id, in the path or in a request body."
  - id: ERR_TRANSIT_SHIPMENT_NOT_FOUND
    http: 404
    condition: "No TransitShipment with the given id."
  - id: ERR_VALUE_REPORT_NOT_FOUND
    http: 404
    condition: "No ValueReport with the given id."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No Claim with the given id."
  - id: ERR_LOSS_SUBJECT_NOT_FOUND
    http: 404
    condition: "The coverage_part_id or the named loss-subject id on claim creation does not resolve."

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, negative money or rate, undeclared enum member, malformed date or instant, inverted date range, or a claim naming zero or more than one loss subject."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative or non-integer."

  # --- state preconditions ---
  - id: ERR_POLICY_NOT_QUOTABLE
    http: 409
    condition: "Quote attempted on a Policy whose status is not DRAFT or QUOTED."
  - id: ERR_POLICY_NOT_REFERRABLE
    http: 409
    condition: "Refer attempted on a Policy that is not QUOTED, on a Policy whose referral_required is false, or on one whose referral is already PENDING or APPROVED."
  - id: ERR_REFERRAL_NOT_PENDING
    http: 409
    condition: "Referral decision attempted when the Policy is not REFERRED with referral_status PENDING."
  - id: ERR_POLICY_NOT_BINDABLE
    http: 409
    condition: "Bind attempted on a Policy that is not QUOTED."
  - id: ERR_POLICY_NOT_ACTIVATABLE
    http: 409
    condition: "Activate attempted on a Policy that is not BOUND, or while the logical clock date is still before effective_date."
  - id: ERR_POLICY_ALREADY_TERMINAL
    http: 409
    condition: "Cancel attempted on a Policy that is DRAFT, QUOTED, REFERRED, DECLINED, CANCELLED or EXPIRED."
  - id: ERR_POLICY_NOT_MUTABLE
    http: 409
    condition: "New exposure or an endorsement was submitted against a DECLINED, CANCELLED or EXPIRED Policy."
  - id: ERR_POLICY_NOT_IN_FORCE
    http: 409
    condition: "Item activation, floater activation, shipment departure or the reporting sweep was attempted while the owning Policy is not IN_FORCE."
  - id: ERR_PART_VOID
    http: 409
    condition: "The target CoveragePart.status is VOID."
  - id: ERR_RATE_RULE_NOT_DRAFT
    http: 409
    condition: "Publish attempted on a RateRule that is already PUBLISHED or RETIRED."
  - id: ERR_ITEM_ALREADY_OFF_RISK
    http: 409
    condition: "Activate, assign-jobsite or delete attempted on an EquipmentItem that is REMOVED or TOTALED, or activate attempted on an item that is already ACTIVE."
  - id: ERR_FLOATER_NOT_IN_REQUIRED_STATE
    http: 409
    condition: "Activate attempted on a floater that is not PENDING, or terminate attempted on a floater that is not ACTIVE."
  - id: ERR_VEHICLE_ALREADY_APPROVED
    http: 409
    condition: "Approve attempted on a Vehicle that is already APPROVED."
  - id: ERR_VEHICLE_NOT_APPROVED
    http: 409
    condition: "Departure attempted on a conveyance whose status is PENDING_APPROVAL or SUSPENDED."
  - id: ERR_SHIPMENT_NOT_IN_REQUIRED_STATE
    http: 409
    condition: "Depart attempted on a shipment that is not PLANNED, or deliver attempted on a shipment that is not IN_TRANSIT."
  - id: ERR_REPORT_ALREADY_ADJUDICATED
    http: 409
    condition: "Adjudicate attempted on a ValueReport that is not SUBMITTED."
  - id: ERR_CLAIM_NOT_IN_REQUIRED_STATE
    http: 409
    condition: "Inspect on a claim that is not OPEN, adjust on a claim that is not INSPECTED, or settle on a claim that is neither REPAIR_APPROVED nor TOTAL_LOSS_DECLARED."
  - id: ERR_CLAIM_NOT_SETTLED
    http: 409
    condition: "Salvage recovery attempted before settlement, or on a claim whose salvage axis is NOT_APPLICABLE, RECOVERED or WAIVED."

  # --- optimistic concurrency ---
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version on equipment-item creation does not match the owning Policy's current version."
  - id: ERR_STALE_COVERAGE_PART_VERSION
    http: 412
    condition: "expected_coverage_part_version on value-report filing does not match the CoveragePart's current version."

  # --- safety / theft control ---
  - id: ERR_JOBSITE_SECURITY_INSUFFICIENT
    http: 422
    condition: "Floater activation on a Jobsite that is not SURVEYED, or whose security_tier is TIER_0."
  - id: ERR_GEO_TRACKING_REQUIRED
    http: 422
    condition: "An item rated on a grade-A theft-hazard rule stands on a TIER_0 or TIER_1 jobsite without a geo tracker; also raised when a re-survey would create that condition."
  - id: ERR_VEHICLE_APPROVAL_EXPIRED
    http: 422
    condition: "Departure on a HIRED conveyance whose approval_expires_on has been reached at the logical clock; the conveyance is suspended as a side effect."
  - id: ERR_CARRIER_APPROVAL_MISSING
    http: 422
    condition: "Approval of a HIRED conveyance without carrier_name, or without an approval_expires_on strictly after the logical clock date."

  # --- temporal ---
  - id: ERR_FLOATER_OUTSIDE_POLICY_TERM
    http: 422
    condition: "An installation floater's coverage interval leaves the policy term."
  - id: ERR_TERMINATION_DATE_OUTSIDE_COVERAGE
    http: 422
    condition: "termination_date is outside the floater's own closed coverage interval."
  - id: ERR_LOSS_DATE_OUTSIDE_TERM
    http: 422
    condition: "A claim's loss_date is outside the policy term, or after cancel_effective_date on a cancelled policy."
  - id: ERR_REPORT_PERIOD_OUTSIDE_TERM
    http: 422
    condition: "A value report's period leaves the policy term."
  - id: ERR_REPORT_PERIOD_MISALIGNED
    http: 422
    condition: "A value report neither restates an existing period exactly nor starts strictly after latest_report_period_end_date."
  - id: ERR_CANCEL_DATE_OUTSIDE_TERM
    http: 422
    condition: "cancel_effective_date is outside the policy term."

  # --- referential ---
  - id: ERR_PART_TYPE_MISMATCH
    http: 422
    condition: "A child was created on a CoveragePart whose part_type does not admit it, or the reporting sweep was run on a non-reporting part."
  - id: ERR_LOSS_SUBJECT_NOT_ON_PART
    http: 422
    condition: "The claim's coverage part does not belong to the claim's policy, or the loss subject does not belong to that coverage part."
  - id: ERR_LOSS_OF_USE_NOT_COVERED
    http: 422
    condition: "loss_of_use_days_claimed > 0 on a part that is not RENTED_LEASED, or on an OWNED item."

  # --- constraint ---
  - id: ERR_NO_PUBLISHED_RATE_RULE
    http: 422
    condition: "No PUBLISHED RateRule covers the item's equipment_type, rating territory and age."
  - id: ERR_JOBSITE_FLOATER_OVERLAP
    http: 409
    condition: "The new floater's closed coverage interval intersects that of another PENDING or ACTIVE floater on the same jobsite, shared endpoints included."
  - id: ERR_VEHICLE_WINDOW_CONFLICT
    http: 409
    condition: "The new shipment's half-open transit window plus the 4-hour turnaround buffer intersects that of another PLANNED or IN_TRANSIT shipment on the same conveyance."
  - id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http: 422
    condition: "Total declared value of PLANNED and IN_TRANSIT shipments departing on the same UTC calendar date on one conveyance would exceed its per_conveyance_limit_cents."
  - id: ERR_NO_RATABLE_COVERAGE
    http: 422
    condition: "Quote attempted on a policy with no ACTIVE CoveragePart."
  - id: ERR_CONSTRUCTIVE_TOTAL_LOSS
    http: 409
    condition: "REPAIR basis chosen while repair_estimate_cents >= constructive_total_loss_threshold_cents on an equipment loss."
  - id: ERR_REPORTING_DELINQUENT
    http: 409
    condition: "Settlement attempted while a DELINQUENT ValueReport stands on the claim's coverage part."

  # --- fiscal ---
  - id: ERR_REFERRAL_REQUIRED
    http: 422
    condition: "Bind attempted while referral_required is true and referral_status is not APPROVED."
  - id: ERR_ITEM_VALUE_EXCEEDS_PER_ITEM_LIMIT
    http: 422
    condition: "A scheduled item's insured_value_cents exceeds the part's per_item_limit_cents."
  - id: ERR_FLOATER_LIMIT_EXCEEDS_PART_AGGREGATE
    http: 422
    condition: "A floater's installed_value_limit_cents exceeds the part's aggregate_available_cents at activation."
  - id: ERR_TRANSIT_VALUE_EXCEEDS_LIMIT
    http: 422
    condition: "A shipment's declared_value_cents exceeds its computed applicable_limit_cents."
  - id: ERR_REPORTED_VALUE_EXCEEDS_LIMIT
    http: 422
    condition: "A value report's reported_value_cents exceeds the part's reporting_limit_cents."
  - id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http: 422
    condition: "settlement_amount_cents exceeds the governing CoveragePart.aggregate_available_cents."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Actuary
    description: "Owns rate development: builds and publishes the contractors-equipment rate cells that rating selects from."
    identity: opaque
    exclusive_operations:
      - "POST /inland-marine/rate-rules"
      - "POST /inland-marine/rate-rules/{id}/publish"
    shared_operations:
      - "GET /inland-marine/rate-rules/{id}"
      - "GET /inland-marine/equipment-items"

  - name: Underwriter
    description: "Builds and prices the policy: coverage parts, schedules, floaters, conveyances, shipments and jobsite surveys; quotes, refers, binds and activates."
    identity: opaque
    exclusive_operations:
      - "POST /inland-marine/policies"
      - "POST /inland-marine/policies/{id}/quote"
      - "POST /inland-marine/policies/{id}/refer"
      - "POST /inland-marine/policies/{id}/bind"
      - "POST /inland-marine/policies/{id}/activate"
      - "POST /inland-marine/policies/{id}/coverage-parts"
      - "PATCH /inland-marine/coverage-parts/{id}"
      - "POST /inland-marine/coverage-parts/{id}/equipment-items"
      - "POST /inland-marine/coverage-parts/{id}/installation-floaters"
      - "POST /inland-marine/coverage-parts/{id}/transit-shipments"
      - "POST /inland-marine/coverage-parts/{id}/reporting-sweep"
      - "POST /inland-marine/equipment-items/{id}/assign-jobsite"
      - "POST /inland-marine/equipment-items/{id}/activate"
      - "DELETE /inland-marine/equipment-items/{id}"
      - "POST /inland-marine/jobsites"
      - "POST /inland-marine/jobsites/{id}/security-survey"
      - "POST /inland-marine/installation-floaters/{id}/activate"
      - "POST /inland-marine/installation-floaters/{id}/terminate"
      - "POST /inland-marine/vehicles"
      - "POST /inland-marine/vehicles/{id}/approve"
      - "POST /inland-marine/transit-shipments/{id}/depart"
      - "POST /inland-marine/transit-shipments/{id}/deliver"
      - "POST /inland-marine/value-reports/{id}/adjudicate"
    shared_operations:
      - "POST /inland-marine/coverage-parts/{id}/value-reports"
      - "POST /inland-marine/policies/{id}/claims"
      - "all GET reads on policies, coverage parts, equipment items, jobsites, floaters, vehicles, shipments, value reports and claims"

  - name: UnderwritingManager
    description: "Referral authority, cancellation authority, claim payment authority, and owner of the logical clock. Never rates or adjusts."
    identity: opaque
    exclusive_operations:
      - "POST /inland-marine/policies/{id}/referral-decision"
      - "POST /inland-marine/policies/{id}/cancel"
      - "POST /inland-marine/claims/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads on policies, coverage parts, equipment items, jobsites, floaters, vehicles, shipments, value reports and claims"

  - name: ClaimsAdjuster
    description: "Owns loss adjustment: inspection, choice of repair versus total loss, and salvage disposition. Cannot authorise the payment it recommends."
    identity: opaque
    exclusive_operations:
      - "POST /inland-marine/claims/{id}/inspect"
      - "POST /inland-marine/claims/{id}/adjust"
      - "POST /inland-marine/claims/{id}/salvage-recovery"
    shared_operations:
      - "GET /inland-marine/claims/{id}"
      - "GET /inland-marine/claims"
      - "GET /inland-marine/claims/{id}/ledger-entries"
      - "GET /inland-marine/claims/{id}/settlement-worksheet"
      - "reads on the policy, coverage part, equipment items, jobsites, floaters, vehicles and shipments behind a loss"

  - name: Policyholder
    description: "The named insured, acting as its own Policy row. Files periodic value reports and reports losses on its own policy, and reads its own premium picture."
    identity: "entity_backed:Policy"
    exclusive_operations: []
    shared_operations:
      - "POST /inland-marine/coverage-parts/{id}/value-reports"
      - "POST /inland-marine/policies/{id}/claims"
      - "GET /inland-marine/policies/{id}"
      - "GET /inland-marine/policies/{id}/premium-summary"
      - "GET /inland-marine/policies/{id}/coverage-parts"
      - "GET /inland-marine/policies/{id}/ledger-entries"
      - "GET /inland-marine/coverage-parts/{id}"
      - "GET /inland-marine/coverage-parts/{id}/equipment-items"
      - "GET /inland-marine/coverage-parts/{id}/value-reports"
      - "GET /inland-marine/equipment-items/{id}"
      - "GET /inland-marine/installation-floaters/{id}"
      - "GET /inland-marine/transit-shipments/{id}"
      - "GET /inland-marine/value-reports/{id}"
      - "GET /inland-marine/value-reports/{id}/superseded-reports"
      - "GET /inland-marine/claims/{id}"
