# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Charitable Gaming License — 9 rules x 2 instances = 18 instances
# Clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: occasion_net_provisional_vs_final
        grounds:
          - calculations.occasion_net_proceeds
          - state_machines.Occasion.SCHEDULED_to_HELD
          - state_machines.Occasion.HELD_to_REPORTED
          - entities.Occasion.fields.net_proceeds_cents
        distinguishing_aspect: |
          The provisional net (planned) 130000 written at HELD diverges from the final net
          (actual) 115000 written at REPORTED on the SAME Occasion — dual variants on the Occasion domain.
        test_recipe:
          setup:
            - "Eligible 501C3 org (incorporated 2020-01-01) with an ACTIVE BINGO license"
            - "One SCHEDULED occasion: planned_gross 200000, planned_prize_pool 50000, planned_expenses 20000; then HELD (net_proceeds_cents=130000)"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Elks Lodge", ein: "11-1111111", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "a@x.org", venue_name: "Main Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Main Hall", planned_gross_cents: 200000, planned_prize_pool_cents: 50000, planned_expenses_cents: 20000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "GET /occasions/${occ_id}", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { prov_net: "$.data.net_proceeds_cents" } }
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 180000, prizes_paid_cents: 40000, expenses_cents: 25000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          assert:
            - "provisional read: Occasion.${occ_id}.net_proceeds_cents == 130000"
            - "after report: Occasion.${occ_id}.net_proceeds_cents == 115000"
            - "Occasion.${occ_id}.status == REPORTED"

      - name: license_prize_committed_vs_settled
        grounds:
          - calculations.license_prize_consumption
          - entities.License.fields.prize_committed_cents
          - entities.License.fields.prize_settled_cents
          - state_machines.Occasion.HELD_to_REPORTED
        distinguishing_aspect: |
          The committed view (planned pool over SCHEDULED/HELD) 50000 differs from the settled view
          (actual prizes over REPORTED) 40000 on the License domain — dual variants on a different entity than instance 1.
        test_recipe:
          setup:
            - "Eligible org with ACTIVE BINGO license"
            - "One occasion planned_prize_pool 50000, HELD (License.prize_committed_cents=50000, prize_settled_cents=0)"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Lions Club", ein: "22-2222222", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "b@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 200000, planned_prize_pool_cents: 50000, planned_expenses_cents: 20000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "GET /licenses/${lic_id}", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { committed_pre: "$.data.prize_committed_cents" } }
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 180000, prizes_paid_cents: 40000, expenses_cents: 25000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          assert:
            - "before report: License.${lic_id}.prize_committed_cents == 50000 and License.${lic_id}.prize_settled_cents == 0"
            - "after report: License.${lic_id}.prize_committed_cents == 0 and License.${lic_id}.prize_settled_cents == 40000"
            - "after report: License.${lic_id}.prize_allowance_remaining_cents == 960000"

  - rule_id: combinatorial_formula
    instances:
      - name: prize_allowance_nested_min_annual_arm_binds
        grounds:
          - calculations.occasion_prize_allowance
          - state_machines.Occasion.HELD_to_REPORTED
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a): allowance = min(per_occasion_cap 800000, annual_remaining 300000) selects the annual arm 300000,
          so a report of 300001 is rejected though it is below the per-occasion cap — a nested-min with a
          type-selected tier over 3 inputs.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license (annual 1000000, per-occasion cap 800000)"
            - "occasion1 HELD then REPORTED with prizes 700000 (settled 700000)"
            - "occasion2 (non-overlapping time) HELD, planned_prize_pool 300000 (committed_other for occ2 == 0)"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "VFW Post", ein: "33-3333333", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "c@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 1000000, planned_prize_pool_cents: 700000, planned_expenses_cents: 50000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ1_id: "$.data.id" } }
            - { call: "POST /occasions/${occ1_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /occasions/${occ1_id}/report", payload: { gross_receipts_cents: 1000000, prizes_paid_cents: 700000, expenses_cents: 50000 }, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-08T18:00:00Z", scheduled_end: "2026-06-08T22:00:00Z", venue_name: "Hall", planned_gross_cents: 500000, planned_prize_pool_cents: 300000, planned_expenses_cents: 20000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ2_id: "$.data.id" } }
            - { call: "POST /occasions/${occ2_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /occasions/${occ2_id}/report", payload: { gross_receipts_cents: 400000, prizes_paid_cents: 300001, expenses_cents: 10000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          assert:
            - "$.data.error_id == ERR_PRIZE_LIMIT_EXCEEDED"
            - "Occasion.${occ2_id}.status == HELD (unchanged)"

      - name: proceeds_distribution_rounding_order
        grounds:
          - calculations.proceeds_distribution
          - entities.FinancialReport.fields.charitable_minimum_cents
          - entities.FinancialReport.fields.net_proceeds_cents
        distinguishing_aspect: |
          Mode (b): with net 100003, charitable_minimum = 100003 - round(15000.45) - round(5000.15) = 80003 under the
          pinned round-components-then-subtract order, NOT 80002 that round(100003*0.80) would yield.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license"
            - "One occasion REPORTED with gross 200003, prizes 70000, expenses 30000 (occasion net 100003), scheduled 2026-06-05 within report period"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Kiwanis", ein: "44-4444444", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "d@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-05T18:00:00Z", scheduled_end: "2026-06-05T22:00:00Z", venue_name: "Hall", planned_gross_cents: 200003, planned_prize_pool_cents: 70000, planned_expenses_cents: 30000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 200003, prizes_paid_cents: 70000, expenses_cents: 30000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /financial-reports", payload: { license_id: "${lic_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", charitable_use_cents: 80003 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { fr_id: "$.data.id" } }
          assert:
            - "FinancialReport.${fr_id}.net_proceeds_cents == 100003"
            - "FinancialReport.${fr_id}.admin_allowance_cents == 15000"
            - "FinancialReport.${fr_id}.regulatory_fee_cents == 5000"
            - "FinancialReport.${fr_id}.charitable_minimum_cents == 80003"

  - rule_id: non_linear_state_machine
    instances:
      - name: license_active_suspended_active_cycle
        grounds:
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.License.SUSPENDED_to_ACTIVE
          - entities.License.fields.status
        distinguishing_aspect: |
          License traverses ACTIVE -> SUSPENDED -> ACTIVE (A->B->A cycle) on the License entity — not a linear pipeline.
        test_recipe:
          setup:
            - "Eligible org with ACTIVE BINGO license, no violations"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Rotary", ein: "55-5555555", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "e@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
          trigger:
            - { call: "POST /licenses/${lic_id}/suspend", payload: {}, as: Regulator }
            - { call: "POST /licenses/${lic_id}/reinstate", payload: {}, as: Regulator }
          assert:
            - "after suspend: License.${lic_id}.status == SUSPENDED"
            - "after reinstate: License.${lic_id}.status == ACTIVE"

      - name: financial_report_reject_revise_resubmit_cycle
        grounds:
          - state_machines.FinancialReport.SUBMITTED_to_REJECTED
          - state_machines.FinancialReport.REJECTED_to_DRAFT
          - state_machines.FinancialReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          FinancialReport traverses SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED (revision loop) on the
          FinancialReport entity — a different non-linear entity than the License cycle.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license; occasion REPORTED (gross 1000000, prizes 300000, expenses 100000 -> net 600000)"
            - "FinancialReport created (charitable_use 480000 == charitable_minimum) and SUBMITTED"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Moose", ein: "66-6666666", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "f@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-05T18:00:00Z", scheduled_end: "2026-06-05T22:00:00Z", venue_name: "Hall", planned_gross_cents: 1000000, planned_prize_pool_cents: 300000, planned_expenses_cents: 100000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 1000000, prizes_paid_cents: 300000, expenses_cents: 100000 }, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /financial-reports", payload: { license_id: "${lic_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", charitable_use_cents: 480000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { fr_id: "$.data.id" } }
            - { call: "POST /financial-reports/${fr_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /financial-reports/${fr_id}/reject", payload: {}, as: Regulator }
            - { call: "POST /financial-reports/${fr_id}/revise", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /financial-reports/${fr_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          assert:
            - "after reject: FinancialReport.${fr_id}.status == REJECTED"
            - "after revise: FinancialReport.${fr_id}.status == DRAFT"
            - "after resubmit: FinancialReport.${fr_id}.status == SUBMITTED"

  - rule_id: transitive_cascade
    instances:
      - name: violation_suspend_cancel_release_depth3
        grounds:
          - calculations.violation_points_rollup
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.Occasion.SCHEDULED_to_CANCELLED
          - state_machines.EquipmentAllocation.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          POST /violations (PROCEEDS_MISUSE, 10 pts) -> License SUSPENDED -> its SCHEDULED Occasion CANCELLED ->
          that occasion's ACTIVE EquipmentAllocation RELEASED — a 3-hop chain where each hop is caused by the prior.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license"
            - "One SCHEDULED occasion (planned_prize 50000), a REGISTERED supplier+equipment, and one ACTIVE allocation on that occasion"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Eagles", ein: "77-7777777", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "g@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 200000, planned_prize_pool_cents: 50000, planned_expenses_cents: 20000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { business_name: "GameCo", state_code: "CA" }, as: Regulator, captures: { sup_id: "$.data.id" } }
            - { call: "POST /suppliers/${sup_id}/register", payload: {}, as: Regulator }
            - { call: "POST /equipment", payload: { supplier_id: "${sup_id}", equipment_type: "BINGO_BLOWER", serial_number: "SN-1" }, as: Supplier, as_user_id: "${sup_id}", captures: { eq_id: "$.data.id" } }
            - { call: "POST /equipment-allocations", payload: { equipment_id: "${eq_id}", occasion_id: "${occ_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /violations", payload: { license_id: "${lic_id}", violation_type: "PROCEEDS_MISUSE" }, as: Regulator, captures: { vio_id: "$.data.id" } }
          assert:
            - "License.${lic_id}.status == SUSPENDED"
            - "License.${lic_id}.total_violation_points_active == 10"
            - "Occasion.${occ_id}.status == CANCELLED"
            - "EquipmentAllocation.${alloc_id}.status == RELEASED"
            - "License.${lic_id}.prize_committed_cents == 0"

      - name: late_report_autoviolation_depth2
        grounds:
          - state_machines.Occasion.HELD_to_REPORTED
          - calculations.violation_points_rollup
          - entities.Violation.fields.source
        distinguishing_aspect: |
          A report filed after scheduled_end + REPORT_GRACE_DAYS (7) auto-creates a Violation{source:AUTO,
          violation_type:LATE_REPORT} which raises License.total_violation_points_active to 3 — a 2-hop chain
          (report -> auto violation -> license rollup) from a different trigger than the suspend cascade.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license; occasion scheduled 2026-06-01 18:00-22:00 and HELD"
            - "Clock advanced to 2026-06-20 (past scheduled_end + 7 days, still before expiration 2027-05-01)"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Grange", ein: "88-8888888", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "h@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 200000, planned_prize_pool_cents: 50000, planned_expenses_cents: 20000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: Regulator }
          trigger:
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 180000, prizes_paid_cents: 40000, expenses_cents: 25000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          assert:
            - "Occasion.${occ_id}.status == REPORTED"
            - "License.${lic_id}.total_violation_points_active == 3"
            - "License.${lic_id}.status == ACTIVE (3 < suspension threshold 10)"
            - "GET /licenses/${lic_id}/violations contains a Violation with source == AUTO, violation_type == LATE_REPORT, status == OPEN"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: report_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - state_machines.Occasion.HELD_to_REPORTED
        distinguishing_aspect: |
          A report on a SCHEDULED (not HELD) occasion with prizes_paid 900000 (over the 800000 cap) violates both the
          state precondition (priority 7) and the fiscal cap (priority 11); the response is ERR_INVALID_STATE, proving
          state outranks business_fiscal.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license; one occasion still SCHEDULED (never held), planned_prize 50000"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Shriners", ein: "99-9999999", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "i@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
