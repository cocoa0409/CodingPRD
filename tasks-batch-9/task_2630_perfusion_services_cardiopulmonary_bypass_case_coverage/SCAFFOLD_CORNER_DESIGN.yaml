  - section: rbac
    instances:
      - name: each_role_is_denied_the_other_roles_exclusive_operations
        claim_type: role_denial
        grounds:
          - validations[priority=3]
          - errors.ERR_UNAUTHORIZED
          - roles.ContractAdmin.exclusive_operations
          - roles.ChiefPerfusionist.exclusive_operations
          - roles.BiomedTech.exclusive_operations
          - roles.Surgeon.exclusive_operations
        distinguishing_aspect: |
          Priority 3 is evaluated before any identity resolution, so a Perfusionist calling a
          ContractAdmin-exclusive endpoint answers ERR_UNAUTHORIZED even when its X-User-ID is a value no
          Perfusionist row carries - the role/endpoint check cannot be reached through the actor check.
        test_recipe:
          setup:
            - "Contract c1, perfusionist p1 (is_chief false), chief (is_chief true), surgeon s1 and machine d1."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
