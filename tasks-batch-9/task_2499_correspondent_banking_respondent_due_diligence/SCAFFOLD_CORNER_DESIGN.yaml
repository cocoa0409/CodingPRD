      - name: a_nested_chain_that_revisits_a_respondent_is_a_cycle
        claim_type: error_triggerable
        grounds:
          - calculations.nested_chain_depth
          - calculations.nested_prohibition_precedence
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/nested-relationships]
          - errors[ERR_NESTED_CYCLE_DETECTED]
        distinguishing_aspect: "The only cycle the API can actually construct: two known respondents each naming the other through downstream_respondent_bank_id. The first leg is lawful because the far side has no live row yet, so the walk terminates at depth 1; the second leg closes the loop. It also splits the two creation behaviours of one endpoint - a RespondentContact declaration is REJECTED outright, while the identical configuration discovered by an analyst is CREATED in state PROHIBITED - and shows CYCLE outranking PAYABLE_THROUGH_NOT_PERMITTED in the ladder."
        test_recipe:
          setup: ["Two DD_IN_PROGRESS respondents A and B, neither permitting nested activity. A already discloses a DOWNSTREAM_CORRESPONDENT row whose downstream_respondent_bank_id is B; B has no rows yet."]
