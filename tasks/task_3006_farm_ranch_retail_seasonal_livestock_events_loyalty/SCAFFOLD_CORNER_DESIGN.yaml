# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3006_farm_ranch_retail_seasonal_livestock_events_loyalty
#
# Breadth probe: every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. §1.8-covered
# corners appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_create_returns_computed_offseason_posture_and_version_1
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/stores
        distinguishing_aspect: "A store created with only store_name and region_code returns 201 with posture OFFSEASON (computed, never client-supplied), active_campaign_id null, hazmat_gallons_used_today 0, and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at default 2026-09-01T00:00:00Z (no set_current_utc call needed)."
          setup_api_calls: []
          trigger:
            - &k_store_create
              call: "POST /stores"
              payload: { store_name: "Abilene Farm & Ranch", region_code: "TX-WEST" }
              as: RegionalAdmin
              captures: { c_store_id: $.data.id, c_store_v0: $.data.version, c_posture: $.data.posture }
          assert:
            - "response status 201, response_type object"
            - "Store.${c_store_id}.posture == OFFSEASON and active_campaign_id is null and hazmat_gallons_used_today == 0"
            - "Store.${c_store_id}.version == 1 and id / created_at / updated_at are non-null"
            - "GET /stores/${c_store_id} returns the same version == 1 (the value campaign activation OCC keys off)"

      - name: loyalty_account_create_defaults_and_phone_uniqueness
        claim_type: Defaults
        grounds:
          - entities.LoyaltyAccount
          - endpoints.POST_/loyalty-accounts
        distinguishing_aspect: "Registration without email stores null, tier NEIGHBOR, points_balance 0, status ACTIVE; a second registration with the same phone fails ERR_PHONE_ALREADY_REGISTERED while a different phone succeeds."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - &k_account_create
              call: "POST /loyalty-accounts"
              payload: { full_name: "Rue Carter", phone: "555-0200" }
              as: Anonymous
              captures: { c_acct_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Rue Carter Jr", phone: "555-0200" }
              as: Anonymous
              captures: { dup_err: $.data.error_id }
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Rue Carter Jr", phone: "555-0201" }
              as: Anonymous
              captures: { c_acct2: $.data.id }
          assert:
            - "LoyaltyAccount.${c_acct_id}.tier == NEIGHBOR and points_balance == 0 and status == ACTIVE and email is null"
            - "dup_err == ERR_PHONE_ALREADY_REGISTERED"
            - "LoyaltyAccount.${c_acct2}.status == ACTIVE (same name, different phone is fine)"

      - name: chick_order_get_returns_stored_snapshot_fields
        claim_type: Retrieval
        grounds:
          - entities.ChickOrder
          - endpoints.GET_/chick-orders/{id}
        distinguishing_aspect: "GET returns the price snapshot taken at reservation: unit_price_cents 349 stays 349 even after the schedule's base price is conceptually irrelevant post-create; every stored field round-trips."
        test_recipe:
          setup:
            - "Spring store; schedule (window 2026-03-01..2026-04-30, min 6, 349c); lot 100 ON_SALE; account; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - &k_clock_mar10
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T10:00:00Z" }
              as: RegionalAdmin
            - &k_spring_store
              call: "POST /stores"
              payload: { store_name: "Waxahachie Farm & Ranch", region_code: "TX-NORTH" }
              as: RegionalAdmin
              captures: { k_store_id: $.data.id, k_store_v0: $.data.version }
            - &k_spring_campaign
              call: "POST /season-campaigns"
              payload: { store_id: "${k_store_id}", season: "SPRING_PLANTING", planogram_map: "spring-v1", aisle_count: 2 }
              as: RegionalAdmin
              captures: { k_camp_id: $.data.id }
            - &k_spring_teardown
              call: "POST /season-campaigns/${k_camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - &k_spring_reset
              call: "POST /season-campaigns/${k_camp_id}/complete-reset"
              payload: { aisles_reset_count: 2 }
              as: StoreManager
            - &k_spring_verify
              call: "POST /season-campaigns/${k_camp_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - &k_spring_activate
              call: "POST /season-campaigns/${k_camp_id}/activate"
              payload: { expected_store_version: "${k_store_v0}" }
              as: RegionalAdmin
            - &k_spring_schedule
              call: "POST /hatchery-schedules"
              payload: { store_id: "${k_store_id}", species: "CHICKEN_LAYER", breed: "Rhode Island Red", hatch_date: "2026-02-25T00:00:00Z", sale_window_start: "2026-03-01T00:00:00Z", sale_window_end: "2026-04-30T23:59:59Z", daily_capacity: 500, min_purchase_qty: 6, base_price_cents_per_bird: 349 }
              as: StoreManager
              captures: { k_sched_id: $.data.id }
            - &k_spring_publish
              call: "POST /hatchery-schedules/${k_sched_id}/publish"
              payload: {}
              as: StoreManager
            - &k_spring_lot
              call: "POST /livestock-lots"
              payload: { store_id: "${k_store_id}", hatchery_schedule_id: "${k_sched_id}", quantity_received: 100, received_at: "2026-03-02T08:00:00Z" }
              as: StoreManager
              captures: { k_lot_id: $.data.id }
            - &k_spring_open_sale
              call: "POST /livestock-lots/${k_lot_id}/open-sale"
              payload: {}
              as: StoreManager
              captures: { k_lot_v: $.data.version }
            - &k_spring_account
              call: "POST /loyalty-accounts"
              payload: { full_name: "Jesse Pruitt", phone: "555-0110" }
              as: Anonymous
              captures: { k_acct_id: $.data.id }
            - &k_spring_order6
              call: "POST /chick-orders"
              payload: { store_id: "${k_store_id}", livestock_lot_id: "${k_lot_id}", loyalty_account_id: "${k_acct_id}", quantity: 6, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${k_lot_v}" }
              as: Customer
              as_user_id: "${k_acct_id}"
              captures: { k_order_id: $.data.id }
          trigger:
            - call: "GET /chick-orders/${k_order_id}"
              payload: {}
              as: StoreAssociate
          assert:
            - "ChickOrder.${k_order_id}.unit_price_cents == 349 and discount_pct == 0.0 and total_cents == 2094"
            - "ChickOrder.${k_order_id}.status == RESERVED and claim_status == NONE and brooder_verified_at is null and fulfilled_at is null"
            - "ChickOrder.${k_order_id}.livestock_lot_id == ${k_lot_id} and loyalty_account_id == ${k_acct_id}"

      - name: event_bookings_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/event-bookings
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three bookings on one event, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; no params defaults to limit 10 / offset 0."
        test_recipe:
          setup:
            - "Store; PUBLISHED PET_WASH event (wash-bay-1, 2026-09-15 09:00-12:00, slot 30, capacity 3, buffer 0); three accounts each with a booking at 09:00, 09:30, 10:00."
          setup_api_calls:
            - &k_clock_sep10
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: RegionalAdmin
            - *k_store_create
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${c_store_v0}" }
              as: RegionalAdmin
            - call: "POST /service-events"
              payload: { store_id: "${c_store_id}", event_kind: "PET_WASH", resource_name: "wash-bay-1", event_date: "2026-09-15T00:00:00Z", slot_window_start: "2026-09-15T09:00:00Z", slot_window_end: "2026-09-15T12:00:00Z", slot_length_minutes: 30, cleanup_buffer_minutes: 0, capacity_per_slot: 3, requires_vaccine_record: false }
              as: StoreManager
              captures: { pg_event_id: $.data.id }
            - call: "POST /service-events/${pg_event_id}/publish"
              payload: {}
              as: StoreManager
            - *k_account_create
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Bob Pager", phone: "555-0210" }
              as: Anonymous
              captures: { pg_acct2: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Cyd Pager", phone: "555-0211" }
              as: Anonymous
              captures: { pg_acct3: $.data.id }
            - call: "POST /event-bookings"
              payload: { service_event_id: "${pg_event_id}", loyalty_account_id: "${c_acct_id}", slot_start: "2026-09-15T09:00:00Z" }
              as: Customer
              as_user_id: "${c_acct_id}"
            - call: "POST /event-bookings"
              payload: { service_event_id: "${pg_event_id}", loyalty_account_id: "${pg_acct2}", slot_start: "2026-09-15T09:30:00Z" }
              as: Customer
              as_user_id: "${pg_acct2}"
            - call: "POST /event-bookings"
              payload: { service_event_id: "${pg_event_id}", loyalty_account_id: "${pg_acct3}", slot_start: "2026-09-15T10:00:00Z" }
              as: Customer
              as_user_id: "${pg_acct3}"
          trigger:
            - call: "GET /event-bookings"
              payload: { service_event_id: "${pg_event_id}", limit: 2, offset: 0 }
              as: StoreAssociate
            - call: "GET /event-bookings"
              payload: { service_event_id: "${pg_event_id}", limit: 2, offset: 2 }
              as: StoreAssociate
            - call: "GET /event-bookings"
              payload: { service_event_id: "${pg_event_id}" }
              as: StoreAssociate
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, total_count == 3, has_more == false"
            - "no params: 3 rows with limit defaulting to 10 and offset to 0"

      - name: weighted_sale_get_unknown_id_returns_sale_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/weighted-sales/{id}
          - errors.ERR_SALE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated id yields the entity-specific ERR_SALE_NOT_FOUND 404, not a generic error."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /weighted-sales/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: StoreAssociate
              captures: { nf_err: $.data.error_id }
          assert:
            - "nf_err == ERR_SALE_NOT_FOUND with http status 404"

      - name: chick_order_missing_required_quantity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/chick-orders
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required quantity field fails with ERR_INVALID_REQUEST before any state or business check runs (priority 0)."
        test_recipe:
          setup:
            - "Spring store; schedule; lot ON_SALE; account (same chain as retrieval corner)."
          setup_api_calls:
            - *k_clock_mar10
            - *k_spring_store
            - *k_spring_campaign
            - *k_spring_teardown
            - *k_spring_reset
            - *k_spring_verify
            - *k_spring_activate
            - *k_spring_schedule
            - *k_spring_publish
            - *k_spring_lot
            - *k_spring_open_sale
            - *k_spring_account
          trigger:
            - call: "POST /chick-orders"
              payload: { store_id: "${k_store_id}", livestock_lot_id: "${k_lot_id}", loyalty_account_id: "${k_acct_id}", pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${k_lot_v}" }
              as: Customer
              as_user_id: "${k_acct_id}"
              captures: { req_err: $.data.error_id }
          assert:
            - "req_err == ERR_INVALID_REQUEST (400)"

      - name: pickup_order_computed_bay_and_deadline_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.PickupOrder.fields.staging_bay_id
          - entities.PickupOrder.fields.pickup_deadline
        distinguishing_aspect: "staging_bay_id is assigned by the selector at stage time and pickup_deadline is ready_at + 5 days — both computed; neither is settable at creation (order starts with staging_bay_id null)."
        test_recipe:
          setup:
            - "Store; bay 3 size M; account; order item M without loadout; clock 2026-09-10T09:00:00Z. Store posture may be OFFSEASON (no floor gate on staging/pickup)."
          setup_api_calls:
            - *k_clock_sep10
            - *k_store_create
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${c_store_v0}" }
              as: RegionalAdmin
            - call: "POST /staging-bays"
              payload: { store_id: "${c_store_id}", bay_no: 3, size_class: "M" }
              as: StoreManager
              captures: { cp_bay_id: $.data.id }
            - *k_account_create
            - call: "POST /pickup-orders"
              payload: { store_id: "${c_store_id}", loyalty_account_id: "${c_acct_id}", item_sku: "GENERATOR-9K", item_size_class: "M", requires_loadout_assistance: false }
              as: Customer
              as_user_id: "${c_acct_id}"
              captures: { cp_po_id: $.data.id, cp_po_bay0: $.data.staging_bay_id }
          trigger:
            - call: "POST /pickup-orders/${cp_po_id}/stage"
              payload: {}
              as: StoreAssociate
              captures: { cp_po_bay1: $.data.staging_bay_id }
            - call: "POST /pickup-orders/${cp_po_id}/mark-ready"
              payload: {}
              as: StoreAssociate
              captures: { cp_ready: $.data.ready_at, cp_deadline: $.data.pickup_deadline }
          assert:
            - "cp_po_bay0 is null at creation (computed fields not client-settable)"
            - "cp_po_bay1 == ${cp_bay_id} (selector-assigned at stage)"
            - "cp_ready == 2026-09-10T09:00:00Z and cp_deadline == 2026-09-15T09:00:00Z (ready_at + 5 days exactly)"

      - name: care_log_entry_has_no_version_and_no_update_path
        claim_type: Immutability
        grounds:
          - entities.CareLogEntry
        distinguishing_aspect: "CareLogEntry is common_fields:false: it carries id and created_at but no version/updated_at, and the API exposes no update or delete endpoint for it — the log is append-only."
        test_recipe:
          setup:
            - "Spring store; lot 100 ON_SALE (no order needed); clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *k_clock_mar10
            - *k_spring_store
            - *k_spring_campaign
            - *k_spring_teardown
            - *k_spring_reset
            - *k_spring_verify
            - *k_spring_activate
            - *k_spring_schedule
            - *k_spring_publish
            - *k_spring_lot
            - *k_spring_open_sale
          trigger:
            - call: "POST /livestock-lots/${k_lot_id}/care-logs"
              payload: { entry_type: "TEMPERATURE", measured_temp_f: 95.5, note: "brooder check" }
              as: StoreAssociate
              captures: { cle_id: $.data.id }
            - call: "GET /livestock-lots/${k_lot_id}/care-logs"
              payload: {}
              as: StoreAssociate
          assert:
            - "CareLogEntry.${cle_id} response carries id and created_at and no version field"
            - "the list returns exactly 1 entry with entry_type == TEMPERATURE and measured_temp_f == 95.5"
            - "PUT/PATCH/DELETE on /livestock-lots/{id}/care-logs/{entryId} do not exist (405/404)"

      - name: service_event_invalid_enum_kind_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceEvent.fields.event_kind
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "event_kind outside {PET_WASH, VET_CLINIC} is rejected with ERR_INVALID_REQUEST at priority 0 before any store state matters."
        test_recipe:
          setup:
            - "Store exists; clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *k_clock_sep10
            - *k_store_create
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${c_store_v0}" }
              as: RegionalAdmin
          trigger:
            - call: "POST /service-events"
              payload: { store_id: "${c_store_id}", event_kind: "GOAT_YOGA", resource_name: "barn-1", event_date: "2026-09-15T00:00:00Z", slot_window_start: "2026-09-15T09:00:00Z", slot_window_end: "2026-09-15T12:00:00Z", slot_length_minutes: 30, cleanup_buffer_minutes: 0, capacity_per_slot: 1, requires_vaccine_record: false }
              as: StoreManager
              captures: { enum_err: $.data.error_id }
          assert:
            - "enum_err == ERR_INVALID_REQUEST (400)"

      - name: ledger_entry_reversal_requires_existing_related_entry
        claim_type: Parent Relationships
        grounds:
          - entities.LoyaltyLedgerEntry.fields.related_entry_id
          - errors.ERR_ENTRY_NOT_FOUND
        distinguishing_aspect: "A REVERSAL referencing a non-existent entry id fails ERR_ENTRY_NOT_FOUND; the self-referential FK is enforced on write."
        test_recipe:
          setup:
            - "Account exists."
          setup_api_calls:
            - *k_account_create
          trigger:
            - call: "POST /loyalty-accounts/${c_acct_id}/ledger-entries"
              payload: { entry_type: "REVERSAL", related_entry_id: "11111111-2222-4333-8444-555555555555", points_delta: -50 }
              as: StoreAssociate
              captures: { rev_err: $.data.error_id }
          assert:
            - "rev_err == ERR_ENTRY_NOT_FOUND (404)"
            - "LoyaltyAccount.${c_acct_id}.points_balance == 0 (nothing posted)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: campaign_full_happy_path_draft_to_active
        claim_type: Valid Transition
        grounds:
          - state_machines.SeasonCampaign
        distinguishing_aspect: "DRAFT -> TEARDOWN -> VERIFY_PENDING -> READY -> ACTIVE walks end-to-end; activation flips the store posture to the campaign season and bumps Store.version by exactly 1."
        test_recipe:
          setup:
            - "Store exists (version 1); clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *k_clock_sep10
            - *k_store_create
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "WINTER_HEATING", planogram_map: "winter-v1", aisle_count: 4 }
              as: RegionalAdmin
              captures: { hp_camp_id: $.data.id }
          trigger:
            - call: "POST /season-campaigns/${hp_camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
              captures: { hp_s1: $.data.status }
            - call: "POST /season-campaigns/${hp_camp_id}/complete-reset"
              payload: { aisles_reset_count: 4 }
              as: StoreManager
              captures: { hp_s2: $.data.status }
            - call: "POST /season-campaigns/${hp_camp_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
              captures: { hp_s3: $.data.status }
            - call: "POST /season-campaigns/${hp_camp_id}/activate"
              payload: { expected_store_version: "${c_store_v0}" }
              as: RegionalAdmin
              captures: { hp_s4: $.data.status }
            - call: "GET /stores/${c_store_id}"
              payload: {}
              as: RegionalAdmin
              captures: { hp_posture: $.data.posture, hp_ver: $.data.version, hp_ac: $.data.active_campaign_id }
          assert:
            - "hp_s1 == TEARDOWN, hp_s2 == VERIFY_PENDING, hp_s3 == READY, hp_s4 == ACTIVE"
            - "hp_posture == WINTER_HEATING and hp_ac == ${hp_camp_id} and hp_ver == 2 (exactly one bump)"
            - "SeasonCampaign.${hp_camp_id}.activated_at == 2026-09-10T09:00:00Z (logical clock)"

      - name: campaign_verify_failure_cycles_back_to_teardown
        claim_type: Valid Transition
        grounds:
          - state_machines.SeasonCampaign.VERIFY_PENDING_to_TEARDOWN
        distinguishing_aspect: "A failed audit (audit_passed=false) sends VERIFY_PENDING back to TEARDOWN and zeroes aisles_reset_count; the campaign can then re-run the reset and pass on the second cycle — the cyclic branch is reachable and repeatable."
        test_recipe:
          setup:
            - "Store; campaign aisle_count 2 in VERIFY_PENDING; clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *k_clock_sep10
            - *k_store_create
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "FALL_FEED", planogram_map: "fall-v1", aisle_count: 2 }
              as: RegionalAdmin
              captures: { cyc_camp_id: $.data.id }
            - call: "POST /season-campaigns/${cyc_camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${cyc_camp_id}/complete-reset"
              payload: { aisles_reset_count: 2 }
              as: StoreManager
          trigger:
            - call: "POST /season-campaigns/${cyc_camp_id}/verify"
              payload: { audit_passed: false }
              as: RegionalAdmin
              captures: { cyc_s1: $.data.status, cyc_aisles: $.data.aisles_reset_count }
            - call: "POST /season-campaigns/${cyc_camp_id}/complete-reset"
              payload: { aisles_reset_count: 2 }
              as: StoreManager
              captures: { cyc_s2: $.data.status }
            - call: "POST /season-campaigns/${cyc_camp_id}/verify"
