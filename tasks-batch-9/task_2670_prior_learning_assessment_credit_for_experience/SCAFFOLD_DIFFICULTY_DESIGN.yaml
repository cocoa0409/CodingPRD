            - "The touch is the only intersection: the new window starts at exactly 2026-08-12T00:00:00Z, which is the closed right endpoint of the buffered window"
            - "No AssessorAssignment row exists for ${claim_2} and FacultyAssessor.${asr1_id}.active_assignment_count is still 1"
            - "Setting the clock to 2026-08-12T00:00:00.001Z and repeating the identical request returns 201 with status ASSIGNED, sla_hours 240 and due_at 2026-08-22T00:00:00.001Z"
            - "Alternatively, declining ${asg_1} releases its window immediately and the assignment succeeds even at 2026-08-12T00:00:00Z, since only {ASSIGNED, ACCEPTED} rows are counted"

      - name: articulation_half_open_adjacency_is_legal_while_one_ms_overlap_is_rejected
        grounds:
          - calculations.articulation_window_overlap_check
          - validations[priority=29 ERR_ARTICULATION_WINDOW_OVERLAP]
          - state_machines.ArticulationRule.UNDER_REVIEW_to_APPROVED
          - entities.ArticulationRule.fields.effective_from
          - entities.ArticulationRule.fields.effective_to
          - endpoints[POST /articulation-rules/{rule_id}/approve]
        distinguishing_aspect: |
          The crosswalk geometry is HALF-OPEN [from, to) — deliberately the
          opposite of the assessor buffered window in the sibling instance. A rule
          starting exactly at 2027-01-01T00:00:00Z, the instant the incumbent ends,
          is legal and approves; a rule starting 2026-12-31T23:59:59.999Z overlaps
          the incumbent by one millisecond and is rejected. Reusing the closed
          semantics here rejects the legal adjacency, and reusing half-open
          semantics in the assessor calculation accepts the illegal touch.
        test_recipe:
          setup:
            - "Course CS150 (6 credits, LOWER) with one outcome."
            - "CredentialRecommendation CLEP-CS PUBLISHED."
            - "Incumbent rule R1 -> CS150 APPROVED with window [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)."
            - "R2 -> the same (recommendation, course) pair, effective_from exactly 2027-01-01T00:00:00Z, effective_to null, left UNDER_REVIEW."
            - "R3 -> the same pair, window [2026-12-31T23:59:59.999Z, 2027-01-01T00:00:00Z), left UNDER_REVIEW; it can only overlap R1, never R2."
            - "Reviewer and approver are distinct X-User-IDs to satisfy the segregation-of-duties rule."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /credential-recommendations"
              payload: { source_type: "CREDIT_BY_EXAM", credential_code: "CLEP-CS", title: "CLEP Computing", issuing_body: "College Board", recommended_credits: 6, recommended_level: "LOWER", effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_id: "$.data.id" }
            - call: "POST /credential-recommendations/${rec_id}/publish"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { r1_id: "$.data.id" }
            - call: "POST /articulation-rules/${r1_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v1: "$.data.version" }
            - call: "POST /articulation-rules/${r1_id}/approve"
              payload: { expected_recommendation_version: "${rec_v1}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2027-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { r2_id: "$.data.id" }
            - call: "POST /articulation-rules/${r2_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 5, effective_from: "2026-12-31T23:59:59.999Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { r3_id: "$.data.id" }
            - call: "POST /articulation-rules/${r3_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v2: "$.data.version" }
          trigger:
            - call: "POST /articulation-rules/${r2_id}/approve"
              payload: { expected_recommendation_version: "${rec_v2}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { r2_status: "$.data.status", r2_pin: "$.data.pinned_recommendation_version" }
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v3: "$.data.version" }
            - call: "POST /articulation-rules/${r3_id}/approve"
              payload: { expected_recommendation_version: "${rec_v3}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
          assert:
            - "Adjacency is legal: the first approve returns 200 with ArticulationRule.${r2_id}.status == APPROVED, because R2.effective_from 2027-01-01T00:00:00Z is NOT < R1.effective_to 2027-01-01T00:00:00Z"
            - "CredentialRecommendation.${rec_id}.approved_rule_count == 2 after the adjacency approval"
            - "One millisecond of overlap is fatal: the second approve returns 409 with data.error_id == ERR_ARTICULATION_WINDOW_OVERLAP, because R3.effective_from 2026-12-31T23:59:59.999Z < R1.effective_to 2027-01-01T00:00:00Z AND R1.effective_from < R3.effective_to"
            - "R3 does NOT overlap R2 (R2.effective_from 2027-01-01T00:00:00Z is not < R3.effective_to 2027-01-01T00:00:00Z), so R1 is the sole conflicting sibling"
            - "ArticulationRule.${r3_id}.status is still UNDER_REVIEW, pinned_recommendation_version is still null, and approved_rule_count is still 2"
            - "Suspending ${r1_id} removes it from the APPROVED input_set, and the identical ${r3_id} approval then succeeds with status APPROVED"

  - rule_id: compensating_invariant
    instances:
      - name: transcript_reversal_restores_ledger_exactly_and_unblocks_only_the_upper_division_hold
        grounds:
          - state_machines.PlaClaim.credit_status.POSTED_to_REVERSED
          - state_machines.PlaClaim.credit_status.REVERSED_to_POSTED
          - calculations.cap_unblock_waterfall
          - calculations.program_pla_credit_capacity
          - entities.Student.fields.pla_upper_division_committed
          - endpoints[POST /pla-claims/{claim_id}/transcript-posting/reversal]
        distinguishing_aspect: |
          The reversal is an exact inverse on the four ledger counters
          (posted 6 -> 0, awarded 0 -> 6, upper_division_committed 6 -> 0,
          posted_credits 6 -> 0) yet is deliberately NOT an inverse downstream:
          because reserved_inclusive consumption is unchanged by a reversal, the
          waterfall can only release the UPPER_DIVISION_CAP hold (3 credits) and
          must leave the PLA_CAP hold (9 credits) blocked. Restoring the ledger
          and then unblocking both claims — or neither — are the two natural wrong
          answers.
        test_recipe:
          setup:
            - "Program BSCS-REV: total_credits_required 120, residency_min_credits 30, pla_max_credits 12, pla_max_pct_bp 2500, pla_upper_division_max_credits 6 -> effective_pla_cap_credits 12."
