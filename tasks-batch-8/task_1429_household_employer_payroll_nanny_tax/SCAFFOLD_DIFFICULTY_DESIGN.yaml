          assert:
            - "L2 [03-04, 03-05] succeeds with 201: back-to-back after L1's inclusive end 03-03 is allowed under closed-interval semantics"
            - "L3 [03-05, 03-06] fails with ERR_LEAVE_OVERLAP: shares the single day 03-05 with L2"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: paycheck_void_conserves_payrun_totals
        grounds:
          - state_machines.Paycheck.ISSUED_to_VOIDED
          - entities.PayRun.fields.total_net_cents
        distinguishing_aspect: |
          Conserved quantity: money. After voiding one of two ISSUED paychecks,
          PayRun.total_net_cents == 120000 == the single surviving paycheck's
          net (invariant: totals == sum over status != VOIDED), worker cash
          wages return to 0, and FUTA accrual halves 1440 -> 720.
        test_recipe:
          setup:
            - "Employer BB (sit 0.0, suta 0.02), fully registered, ACTIVE"
            - "W1 (timesheet 4 x 600 = 2400 min) and W2 (guarantee 2400, no timesheet), both ACTIVE @3000/h"
            - "Pay run 2026-01-05..01-12 CALCULATED and FINALIZED: two ISSUED paychecks of gross/net 120000 each"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "BB", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.0, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam P", primary_state_code: "BB", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "BB", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "BB", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "BB", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Pam One", ssn: "123456789", work_state_code: "BB", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w1_id: "$.data.id", w1_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w1_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w1_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w1_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w1_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w1_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Pam Two", ssn: "123456789", work_state_code: "BB", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w2_id: "$.data.id", w2_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w2_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w2_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w2_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w2_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w2_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w1_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 600 }, { work_date: "2026-01-06", worked_minutes: 600 }, { work_date: "2026-01-07", worked_minutes: 600 }, { work_date: "2026-01-08", worked_minutes: 600 } ] }, as: Worker, as_user_id: "${w1_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w1_id}" }
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/finalize", as: PayrollAdmin }
            - { call: "GET /household-payroll/pay-runs/${pr_id}/paychecks", as: PayrollAdmin, captures: { pc1_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /household-payroll/paychecks/${pc1_id}/void", as: PayrollAdmin, captures: { pc1_st: "$.data.status", pc1_dep: "$.data.deposit_status" } }
            - { call: "GET /household-payroll/pay-runs/${pr_id}", as: PayrollAdmin, captures: { pr_net: "$.data.total_net_cents", pr_gross: "$.data.total_gross_cents", pr_tax: "$.data.total_employer_tax_cents" } }
            - { call: "GET /household-payroll/workers/${w1_id}", as: PayrollAdmin, captures: { w1_cash: "$.data.cash_wages_ytd_cents" } }
            - { call: "GET /household-payroll/employers/${e_id}/tax-accounts", as: PayrollAdmin, captures: { futa_acc: "$.data[2].accrued_cents", suta_acc: "$.data[4].accrued_cents" } }
          assert:
            - "voided paycheck status == VOIDED and deposit_status == REVERSAL_PENDING (was SENT)"
            - "PayRun.total_net_cents == 120000 == sum over non-VOIDED paychecks (invariant holds after compensation)"
            - "PayRun.total_gross_cents == 120000 and total_employer_tax_cents == 3120 (FUTA 720 + SUTA 2400)"
            - "DomesticWorker.${w1_id}.cash_wages_ytd_cents == 0 (full reversal)"
            - "TaxLiabilityAccount[FUTA_ER].accrued_cents == 720 and [SUTA_ER].accrued_cents == 2400 (halved from 1440 / 4800)"
      - name: leave_approve_cancel_restores_balance
        grounds:
          - state_machines.LeaveRequest.APPROVED_to_CANCELLED
          - entities.DomesticWorker.fields.used_leave_minutes
        distinguishing_aspect: |
          Conserved quantity: accrued leave minutes (different quantity from
          the money invariant). Approve consumes 60 of 90 accrued; the
          compensating cancel restores used to 0 and available to 90 while
          accrued_leave_minutes never moves from 90.
        test_recipe:
          setup:
            - "Employer AA, worker ACTIVE; one approved timesheet of 2700 minutes -> accrued_leave_minutes 90"
            - "Leave request L1 [2026-03-02, 2026-03-03] 60 minutes, REQUESTED"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam M", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Mona M", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 540 }, { work_date: "2026-01-06", worked_minutes: 540 }, { work_date: "2026-01-07", worked_minutes: 540 }, { work_date: "2026-01-08", worked_minutes: 540 }, { work_date: "2026-01-09", worked_minutes: 540 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}" }
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/leave-requests", payload: { start_date: "2026-03-02", end_date: "2026-03-03", requested_minutes: 60 }, as: Worker, as_user_id: "${w_id}", captures: { l1_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/leave-requests/${l1_id}/approve", as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "GET /household-payroll/workers/${w_id}", as: PayrollAdmin, captures: { used_mid: "$.data.used_leave_minutes", avail_mid: "$.data.available_leave_minutes", accr_mid: "$.data.accrued_leave_minutes" } }
            - { call: "POST /household-payroll/leave-requests/${l1_id}/cancel", as: Worker, as_user_id: "${w_id}" }
            - { call: "GET /household-payroll/workers/${w_id}", as: PayrollAdmin, captures: { used_end: "$.data.used_leave_minutes", avail_end: "$.data.available_leave_minutes", accr_end: "$.data.accrued_leave_minutes" } }
          assert:
            - "after approve: used_leave_minutes == 60, available_leave_minutes == 30, accrued_leave_minutes == 90"
            - "after cancel: used_leave_minutes == 0, available_leave_minutes == 90 (fully restored)"
            - "accrued_leave_minutes == 90 across both operations (conserved quantity: accrual untouched by approve/cancel)"
