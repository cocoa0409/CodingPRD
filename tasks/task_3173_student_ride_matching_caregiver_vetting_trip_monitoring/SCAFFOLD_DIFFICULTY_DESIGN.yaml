      - name: inspection_attestation_gated_by_the_driver_roster_state
        grounds:
          - state_machines.VehicleInspection.PENDING_to_PASSED
          - state_machines.Driver.BACKGROUND_CHECK_to_INSPECTION
          - state_machines.Driver.PENDING_to_BACKGROUND_CHECK
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The VehicleInspection → Driver pair, the opposite direction from the Trip pair: the inspection entity reaches its own terminal PASSED only when the driver roster entity happens to sit in INSPECTION, so opening an unrelated clearance on the same driver silently withdraws the attestation route for a perfectly valid inspection."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "Driver fully vetted once, then a second inspection batch opened and attested, then a third inspection batch opened so the driver sits in INSPECTION with one PENDING inspection."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - *A_driver
            - *A_bc1
            - *A_bc1c
            - *A_ins1
            - *A_ins1a
