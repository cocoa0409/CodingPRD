# =============================================================================
# SCAFFOLD — Global Payroll Aggregation & In-Country Provider Management
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  2909. Global Payroll Aggregation & In-Country Provider Management (multinational payroll operations): country-by-country provider selection with service scope, statutory filing responsibility and data residency terms, payroll calendar consolidation across pay frequencies, cutoff dates and local holidays, input file standardization from the human resources system with country-specific data elements, gross-to-net validation with variance analysis against prior periods and materiality thresholds, funding and treasury coordination with currency conversion and local bank account requirements, statutory filing confirmation and penalty ownership when a provider errs, service level monitoring, escalation and provider transition planning, global controls, audit evidence and payroll data privacy compliance

domain_name: global-payroll-aggregation
api_prefix: /payroll

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections under /payroll/<collection> linked purely by foreign keys.
  # No entity is addressed through another entity's path except for the two
  # reverse-reachability sub-resource reads (bank-accounts, input-files,
  # audit-evidence) and cycle-scoped ops actions.

  state_machine_shape: cyclic
  # Cyclic on four entities (Engagement transition abort → prior state,
  # InputFile REJECTED → RECEIVED, GrossToNetRun RETURNED → SUBMITTED,
  # StatutoryFiling.penalty_status DISPUTED → ASSESSED, PayrollCycle
  # FUNDED → RESULTS_APPROVED on recall), plus parallel state dimensions on
  # StatutoryFiling (status × penalty_status) and a branching fork-join on
  # GrossToNetRun (SUBMITTED → {CLEARED, ESCALATED} → APPROVED).

  relationship_patterns:
    - one_to_many          # Engagement → PayrollCycle → InputFile / GrossToNetRun / StatutoryFiling
    - many_to_many         # Engagement is the CountryProfile × Provider junction
    - self_referential     # PayrollCycle.prior_cycle_id → PayrollCycle.id (variance baseline)
    - cross_aggregate      # SlaIncident → Provider.service_score → Engagement → PayrollCycle

  role_model: segregation_of_duties
  # Gross-to-net approval must not be performed by the user who submitted the
  # cycle's input file; funding release must not be performed by the user who
  # approved the same funding instruction. PlatformAdmin is NOT an override
  # role — it cannot approve payroll results or move money.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CountryProfile
    parent: null
    common_fields: true
    fields:
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 code of the payroll country.
        constraints: "exactly 2 uppercase letters; unique across all CountryProfile rows"
      - name: local_currency
        type: string
        source: input
        description: ISO 4217 code of the currency in which local payroll is denominated.
        constraints: "exactly 3 uppercase letters"
      - name: data_residency_region
        type: enum
        source: input
        description: Region in which payroll personal data for this country must reside.
        constraints: "one of EU, UK, US, APAC, LATAM"
      - name: statutory_filing_deadline_days
        type: integer
        source: input
        description: Whole days after a cycle's pay_date at which each statutory filing becomes due.
        constraints: "1..90"
      - name: materiality_pct
        type: number
        source: input
        description: Gross-to-net variance materiality threshold in percent (2 decimal places).
        constraints: "0.01..50.00; compared with >= (see calculations.gross_to_net_variance)"
      - name: materiality_floor_minor
        type: integer
        source: input
        description: Absolute gross-delta floor in local minor units; a variance below this floor is never material.
        constraints: ">= 0"
      - name: penalty_daily_rate_minor
        type: integer
        source: input
        description: Statutory late-filing penalty accrual per late day, in local minor units.
        constraints: "> 0"
      - name: required_filing_types
        type: array
        source: input
        description: Filing obligations minted for every cycle of every engagement in this country.
        constraints: "1..3 distinct members of {INCOME_TAX_WITHHOLDING, SOCIAL_INSURANCE, YEAR_END}"
      - name: local_holidays
        type: array
        source: input
        default: []
        description: ISO-8601 calendar dates (YYYY-MM-DD) that are not working days for cutoff arithmetic.
        constraints: "0..40 distinct dates"
      - name: open_filing_obligation_count
        type: integer
        source: computed
        default: 0
        description: "Conserved quantity: count of StatutoryFiling rows with status IN {PENDING, LATE} across every PayrollCycle of every Engagement whose country_profile_id equals this row's id."

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the in-country payroll provider.
        constraints: "1..120 characters"
      - name: service_scope
        type: array
        source: input
        description: Services this provider is contracted to be able to deliver.
        constraints: "1..4 distinct members of {GROSS_TO_NET, STATUTORY_FILING, PAYMENT_DISBURSEMENT, ADVISORY}"
      - name: data_residency_regions
        type: array
        source: input
        description: Regions in which this provider is certified to host payroll personal data.
        constraints: "1..5 distinct members of {EU, UK, US, APAC, LATAM}"
      - name: annual_fee_minor
        type: integer
        source: input
        description: Contracted annual fee in EUR minor units; base of the penalty indemnity cap.
        constraints: "> 0"
      - name: indemnity_cap_pct
        type: number
        source: input
        description: Percent of annual_fee_minor that caps the provider's cumulative penalty share (2 decimal places).
        constraints: "0.00..100.00"
      - name: statutory_filing_capable
        type: boolean
        source: computed
        description: True exactly when service_scope contains STATUTORY_FILING.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Provider standing derived from service_score and offboarding.
        constraints: "one of ACTIVE, PROBATION, SUSPENDED, OFFBOARDED"
      - name: service_score
        type: number
        source: computed
        default: 100.00
        description: Weighted service-level score per calculations.provider_service_score (2 decimal places, 0.00..100.00).
      - name: score_variant_applied
        type: enum
        source: computed
        default: ENGAGEMENT_TO_DATE
        description: Which variant of calculations.provider_service_score produced service_score.
        constraints: "one of ROLLING_WINDOW, ENGAGEMENT_TO_DATE"
      - name: open_penalty_minor
        type: integer
        source: computed
        default: 0
        description: Sum of provider_share_minor over StatutoryFiling rows with penalty_status IN {ASSESSED, DISPUTED} for cycles of this provider's engagements, in local minor units.

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: country_profile_id
        type: string
        source: input
        description: FK -> CountryProfile.id; the payroll country this engagement serves.
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; the currently engaged in-country provider (reassigned on transition completion).
      - name: transition_incoming_provider_id
        type: string
        source: system
        default: null
        description: FK -> Provider.id; provider named by the pending transition plan, null when no plan is pending.
      - name: service_scope
        type: array
        source: input
        description: Services in scope for this country engagement.
        constraints: "1..4 distinct members of {GROSS_TO_NET, STATUTORY_FILING, PAYMENT_DISBURSEMENT, ADVISORY}; must be a subset of Provider.service_scope"
      - name: filing_responsibility
        type: enum
        source: input
        description: Party that must lodge statutory filings for cycles of this engagement.
        constraints: "one of PROVIDER, CLIENT; PROVIDER requires Provider.statutory_filing_capable == true"
      - name: data_residency_region
        type: enum
        source: input
        description: Contracted data residency region for this engagement.
        constraints: "one of EU, UK, US, APAC, LATAM; must equal CountryProfile.data_residency_region and be a member of Provider.data_residency_regions"
      - name: pay_frequency
        type: enum
        source: input
        description: Contracted pay frequency; constrains every PayrollCycle period length.
        constraints: "one of WEEKLY, BIWEEKLY, SEMI_MONTHLY, MONTHLY"
      - name: residency_terms_ref
        type: string
        source: system
        default: null
        description: Data-processing-agreement reference recorded by the residency decision that activated the engagement.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Engagement lifecycle state.
        constraints: "one of DRAFT, ACTIVE, REJECTED, REMEDIATION_REQUIRED, TRANSITION_PLANNED, TRANSITION_IN_PROGRESS"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the residency decision approved this engagement.
      - name: treasury_committed_minor
        type: integer
        source: computed
        default: 0
        description: "Conserved quantity: sum of FundingInstruction.funded_source_minor over instructions with status == RELEASED whose cycle belongs to this engagement."
      - name: transition_required
        type: boolean
        source: computed
        default: false
        description: Set true when the engaged provider entered PROBATION or SUSPENDED; cleared on provider recovery or transition completion.
      - name: closed_cycle_count
        type: integer
        source: computed
        default: 0
        description: Count of this engagement's PayrollCycle rows with status == CLOSED; selects the provider score variant.
      - name: transition_cutover_start_date
        type: string
        source: system
        default: null
        description: Inclusive first date of the pending transition cutover window (YYYY-MM-DD).
      - name: transition_cutover_end_date
        type: string
        source: system
        default: null
        description: Exclusive last date of the pending transition cutover window (YYYY-MM-DD).
      - name: transition_parallel_run_cycles
        type: integer
        source: system
        default: null
        description: Number of parallel-run cycles agreed in the pending transition plan (0..3).

  - name: PayrollCycle
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; owning country engagement.
      - name: prior_cycle_id
        type: string
        source: input
        default: null
        description: FK -> PayrollCycle.id; self-referential variance baseline, null for a first cycle.
      - name: period_label
        type: string
        source: input
        description: Human label of the pay period (e.g. "2026-09").
        constraints: "1..20 characters; unique per engagement_id"
      - name: period_start_date
        type: string
        source: input
        description: Inclusive first date of the pay period (YYYY-MM-DD).
      - name: period_end_date
        type: string
        source: input
        description: Exclusive upper bound of the pay period (YYYY-MM-DD); periods are half-open [start, end).
      - name: pay_date
        type: string
        source: input
        description: Local pay date (YYYY-MM-DD); base of cutoff and statutory due-date arithmetic.
      - name: cutoff_lead_working_days
        type: integer
        source: input
        description: Working days before pay_date at which the HR input cutoff falls.
        constraints: "1..15"
      - name: input_cutoff_at
        type: datetime
        source: computed
        description: Instant after which no InputFile may be submitted for this cycle, per calculations.input_cutoff_resolution.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Cycle consolidation state.
        constraints: "one of DRAFT, ON_HOLD, INPUTS_LOCKED, RESULTS_APPROVED, FUNDED, CLOSED, CANCELLED"
      - name: hold_reason
        type: enum
        source: system
        default: null
        description: Why the cycle was placed ON_HOLD; null whenever status != ON_HOLD.
        constraints: "one of PROVIDER_PROBATION, PROVIDER_SUSPENSION or null"
      - name: gross_total_minor
        type: integer
        source: computed
        default: 0
        description: gross_minor of the APPROVED GrossToNetRun of this cycle, in local minor units.
      - name: funded_total_minor
        type: integer
        source: computed
        default: 0
        description: Sum of funded_source_minor over this cycle's FundingInstruction rows with status == RELEASED, in funding-currency minor units.
      - name: input_submitter_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that submitted the most recently created InputFile of this cycle; basis of the gross-to-net segregation-of-duties check.
      - name: filings_confirmed_count
        type: integer
        source: computed
        default: 0
        description: Count of this cycle's StatutoryFiling rows with status == CONFIRMED.

  - name: InputFile
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PayrollCycle.id; cycle this HR extract feeds.
      - name: source_system
        type: enum
        source: input
        description: Originating HR system of the extract.
        constraints: "one of HRIS_CORE, HRIS_LEGACY, MANUAL"
      - name: record_count
        type: integer
        source: input
        description: Number of employee records in the extract.
        constraints: ">= 1 (0 is rejected with ERR_EMPTY_INPUT_FILE)"
      - name: gross_declared_minor
        type: integer
        source: input
        description: Gross pay declared by the HR system, in local minor units.
        constraints: "> 0"
      - name: country_elements
        type: object
        source: input
        description: Map of country-specific data element keys to string values (e.g. tax_id, social_insurance_no, iban).
        constraints: "keys checked against the region element set in calculations.input_validation_outcome"
      - name: residency_region_of_transfer
        type: enum
        source: input
        description: Region from which this extract is transferred and in which it will be stored.
        constraints: "one of EU, UK, US, APAC, LATAM; must equal Engagement.data_residency_region"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission or of the latest resubmission.
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: Standardization state of the extract.
        constraints: "one of RECEIVED, VALIDATED, REJECTED, SUPERSEDED"
      - name: rejection_code
        type: enum
        source: system
        default: null
        description: Why validation rejected the extract; null unless status == REJECTED.
        constraints: "one of MISSING_ELEMENTS, RECORD_COUNT_DRIFT or null"
      - name: validated_record_count
        type: integer
        source: computed
        default: 0
        description: record_count frozen at the moment the extract reached VALIDATED; 0 otherwise.

  - name: GrossToNetRun
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PayrollCycle.id; cycle whose results these are.
      - name: input_file_id
        type: string
        source: input
        description: FK -> InputFile.id; the VALIDATED extract these results were computed from.
      - name: gross_minor
        type: integer
        source: input
        description: Employee gross pay returned by the provider, in local minor units.
        constraints: "> 0"
      - name: net_minor
        type: integer
        source: input
        description: Employee net pay, in local minor units.
        constraints: "> 0 and <= gross_minor"
      - name: employer_cost_minor
        type: integer
        source: input
        description: Employer-borne contributions and taxes, in local minor units.
        constraints: ">= 0"
      - name: provider_fee_minor
        type: integer
        source: input
        description: Provider service fee for this run, in local minor units.
        constraints: ">= 0"
      - name: employee_count
        type: integer
        source: input
        description: Paid headcount in this run.
        constraints: ">= 1 (0 is rejected with ERR_INVALID_REQUEST)"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Review state of the run.
        constraints: "one of SUBMITTED, CLEARED, ESCALATED, RETURNED, APPROVED, SUPERSEDED"
      - name: variance_pct
        type: number
        source: computed
        default: null
        description: Signed variance against the prior cycle's APPROVED run in percent (2 decimal places); null when variance_basis == NO_PRIOR_BASELINE.
      - name: variance_basis
        type: enum
        source: computed
        description: Which variant of calculations.gross_to_net_variance produced variance_pct.
        constraints: "one of HEADCOUNT_NORMALIZED, ABSOLUTE_TOTAL, NO_PRIOR_BASELINE"
      - name: headcount_drift_pct
        type: number
        source: computed
        default: null
        description: Absolute headcount drift against the baseline run in percent (2 decimal places); null when there is no baseline.
      - name: variance_material
        type: boolean
        source: computed
        default: false
        description: True when the variance crosses both the percentage threshold and the absolute floor of the country profile.
      - name: variance_justification
        type: string
        source: system
        default: null
        description: Justification recorded when an ESCALATED run was approved.
      - name: return_reason
        type: string
        source: system
        default: null
        description: Reason recorded when the run was returned to the provider.

  - name: LocalBankAccount
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; engagement whose local disbursements settle through this account.
      - name: account_ref
        type: string
        source: input
        description: Bank-side account reference.
        constraints: "1..40 characters; unique per engagement_id"
      - name: account_currency
        type: string
        source: input
        description: ISO 4217 currency of the account.
        constraints: "exactly 3 uppercase letters; must equal CountryProfile.local_currency"
      - name: residency_region
        type: enum
        source: input
        description: Region in which the account's payment data resides.
        constraints: "one of EU, UK, US, APAC, LATAM; must equal Engagement.data_residency_region"
      - name: daily_cap_minor
        type: integer
        source: input
        description: Maximum aggregate requested_local_minor released against this account for a single value_date, in local minor units.
        constraints: "> 0"
      - name: settlement_window_hours
        type: integer
        source: input
        description: Length in hours of the settlement window a released instruction occupies on this account.
        constraints: "1..96"
      - name: buffer_hours
        type: integer
        source: input
        description: Mandatory idle gap in hours that must separate two settlement windows on this account.
        constraints: "0..48"
      - name: status
        type: enum
        source: system
        default: PENDING_VERIFICATION
        description: Bank verification state; funding may only be released from a VERIFIED account.
        constraints: "one of PENDING_VERIFICATION, VERIFIED"

  - name: FundingInstruction
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PayrollCycle.id; cycle being funded.
      - name: bank_account_id
        type: string
        source: input
        description: FK -> LocalBankAccount.id; destination local account.
      - name: value_date
        type: string
        source: input
        description: Value date of the transfer (YYYY-MM-DD); anchors the settlement window and the daily cap bucket.
      - name: funding_currency
        type: string
        source: input
        description: ISO 4217 currency the treasury funds from.
        constraints: "exactly 3 uppercase letters; must differ from LocalBankAccount.account_currency"
      - name: fx_rate
        type: number
        source: input
        description: Local minor units obtained per one funding-currency minor unit (6 decimal places).
        constraints: "> 0"
      - name: requested_local_minor
        type: integer
        source: computed
        description: net_minor + employer_cost_minor + provider_fee_minor of the cycle's APPROVED run, in local minor units.
      - name: component_source_minor
        type: object
        source: computed
        description: Per-component converted amounts in funding-currency minor units, keyed net, employer_cost, provider_fee.
      - name: funded_source_minor
        type: integer
        source: computed
        description: Total funding-currency minor units to move, per calculations.funding_requirement_conversion.
      - name: window_start_at
        type: datetime
        source: computed
        description: value_date at 00:00:00.000Z; inclusive start of the settlement window.
      - name: window_end_at
        type: datetime
        source: computed
        description: window_start_at plus LocalBankAccount.settlement_window_hours; inclusive end of the settlement window.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Treasury state of the instruction.
        constraints: "one of DRAFT, APPROVED, RELEASED, RECALLED, VOIDED"
      - name: approver_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the TreasuryOfficer that approved the instruction.
      - name: releaser_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the TreasuryOfficer that released the instruction; must differ from approver_user_id.
      - name: recall_reason
        type: string
        source: system
        default: null
        description: Reason recorded when a released instruction was recalled.

  - name: StatutoryFiling
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PayrollCycle.id; cycle this obligation belongs to.
      - name: filing_type
        type: enum
        source: system
        description: Obligation minted from CountryProfile.required_filing_types at input lock.
        constraints: "one of INCOME_TAX_WITHHOLDING, SOCIAL_INSURANCE, YEAR_END; unique per cycle_id"
      - name: responsibility
        type: enum
        source: computed
        description: Party obliged to lodge, copied from Engagement.filing_responsibility when the obligation is minted.
        constraints: "one of PROVIDER, CLIENT"
      - name: due_at
        type: datetime
        source: computed
        description: PayrollCycle.pay_date plus CountryProfile.statutory_filing_deadline_days, at 23:59:59.999Z.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Lodgement dimension of the filing.
        constraints: "one of PENDING, LATE, FILED, FILED_LATE, CONFIRMED, VOIDED"
      - name: filed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of lodgement.
      - name: submission_ref
        type: string
        source: system
        default: null
        description: Authority submission reference captured at lodgement.
      - name: confirmation_ref
        type: string
        source: system
        default: null
        description: Authority confirmation reference captured at confirmation.
      - name: late_days
        type: integer
        source: computed
        default: 0
        description: Whole late days used to accrue the penalty, per calculations.filing_penalty_allocation.
      - name: penalty_status
        type: enum
        source: system
        default: NONE
        description: Penalty dimension of the filing; evolves independently of status.
        constraints: "one of NONE, ASSESSED, DISPUTED, WAIVED"
      - name: base_penalty_minor
        type: integer
        source: computed
        default: 0
        description: Statutory base plus daily accrual, in local minor units.
      - name: surcharge_minor
        type: integer
        source: computed
        default: 0
        description: Tier surcharge selected from base_penalty_minor, in local minor units.
      - name: total_penalty_minor
        type: integer
        source: computed
        default: 0
        description: base_penalty_minor + surcharge_minor, in local minor units.
      - name: provider_share_minor
        type: integer
        source: computed
        default: 0
        description: Share borne by the provider after the indemnity cap, in local minor units.
      - name: client_share_minor
        type: integer
        source: computed
        default: 0
        description: total_penalty_minor - provider_share_minor, in local minor units.
      - name: penalty_owner
        type: enum
        source: system
        default: NONE
        description: Who owns the penalty after allocation.
        constraints: "one of NONE, PROVIDER, CLIENT, SHARED"
      - name: dispute_round
        type: integer
        source: computed
        default: 0
        description: Number of rejected dispute rounds already consumed (max 2).
      - name: dispute_reason
        type: string
        source: system
        default: null
        description: Reason recorded by the provider on the current dispute.

  - name: SlaIncident
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; engagement the service failure occurred on.
      - name: cycle_id
        type: string
        source: input
        default: null
        description: FK -> PayrollCycle.id; cycle the failure relates to, null for engagement-level failures.
      - name: incident_type
        type: enum
        source: input
        description: Nature of the service-level failure.
        constraints: "one of LATE_GTN_DELIVERY, VARIANCE_ESCALATION, FILING_MISS, FUNDING_MISS, DATA_INCIDENT"
      - name: severity
        type: enum
        source: input
        description: Severity band driving the score deduction.
        constraints: "one of SEV1, SEV2, SEV3"
      - name: occurred_at
        type: datetime
        source: input
        description: Instant the failure occurred; must not be after the logical clock.
      - name: note
        type: string
        source: input
        default: null
        description: Free-text detail captured when the incident was raised.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Incident lifecycle state; only CONFIRMED and ESCALATED incidents deduct score.
        constraints: "one of OPEN, CONFIRMED, ESCALATED, REMEDIATED"
      - name: escalation_level
        type: integer
        source: computed
        default: 0
        description: 0 while OPEN/CONFIRMED, 1 once escalated.
      - name: weight_points
        type: number
        source: computed
        default: 0.00
        description: Score points this incident currently deducts (2 decimal places); 0.00 while OPEN or once REMEDIATED.
      - name: remediation_ref
        type: string
        source: system
        default: null
        description: Remediation evidence reference captured on remediation.

  - name: AuditEvidenceItem
    parent: null
    common_fields: false
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PayrollCycle.id; cycle the control evidence belongs to.
      - name: control_ref
        type: enum
        source: input
        description: Global control this item evidences.
        constraints: "one of CTRL_INPUT_INTEGRITY, CTRL_VARIANCE_REVIEW, CTRL_FUNDING_DUAL_AUTH, CTRL_FILING_CONFIRMATION, CTRL_RESIDENCY_ATTESTATION; unique per cycle_id"
      - name: evidence_type
        type: enum
        source: input
        description: Form of the evidence.
        constraints: "one of SYSTEM_ATTESTATION, DOCUMENT_HASH"
      - name: payload_hash
        type: string
        source: input
        description: Hash of the evidenced artefact.
        constraints: "1..80 characters"
      - name: recorded_by_role
        type: string
        source: system
        description: X-User-Role that recorded the item, or "SYSTEM" for items minted by a cascade.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the item, or "system" for items minted by a cascade.
      - name: sequence_no
        type: integer
        source: computed
        description: 1-based append order of this item within its cycle, assigned by created_at ASC.

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Engagement
    state_field: status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /payroll/engagements/{id}/residency-decision with decision == APPROVE"
        actor: ComplianceAuditor
        preconditions:
          - "status == DRAFT"
          - "residency_terms_ref supplied in the request body (1..60 characters)"
        side_effects:
          - "residency_terms_ref := request residency_terms_ref"
          - "activated_at := current logical clock instant"
          - "Provider.service_score of provider_id recomputed (score_variant_applied stays ENGAGEMENT_TO_DATE because closed_cycle_count == 0)"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /payroll/engagements/{id}/residency-decision with decision == REJECT"
        actor: ComplianceAuditor
        preconditions:
          - "status == DRAFT"
          - "rejection_note supplied in the request body (1..200 characters)"
        side_effects:
          - "activated_at stays null; no PayrollCycle may ever be created for this engagement"
      - from: ACTIVE
        to: REMEDIATION_REQUIRED
        trigger: "system: Provider.status of provider_id becomes PROBATION or SUSPENDED"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "transition_required := true"
          - "every PayrollCycle of this engagement with status == DRAFT becomes ON_HOLD with hold_reason PROVIDER_PROBATION (provider PROBATION) or PROVIDER_SUSPENSION (provider SUSPENDED)"
      - from: REMEDIATION_REQUIRED
        to: ACTIVE
        trigger: "system: Provider.status of provider_id returns to ACTIVE"
        actor: system
        preconditions:
          - "status == REMEDIATION_REQUIRED"
          - "no SlaIncident of this engagement has status IN {CONFIRMED, ESCALATED}"
        side_effects:
          - "transition_required := false"
          - "PayrollCycle rows already ON_HOLD are NOT auto-released; they require POST /payroll/cycles/{id}/release-hold"
      - from: ACTIVE
        to: TRANSITION_PLANNED
        trigger: "POST /payroll/engagements/{id}/transition-plan"
        actor: PayrollController
        preconditions:
          - "status IN {ACTIVE, REMEDIATION_REQUIRED}"
          - "expected_engagement_version equals the current version"
          - "incoming_provider_id differs from provider_id and names a Provider with status == ACTIVE"
        side_effects:
          - "transition_incoming_provider_id, transition_cutover_start_date, transition_cutover_end_date, transition_parallel_run_cycles set from the request"
          - "version incremented by 1"
      - from: REMEDIATION_REQUIRED
        to: TRANSITION_PLANNED
        trigger: "POST /payroll/engagements/{id}/transition-plan"
        actor: PayrollController
        preconditions:
          - "status IN {ACTIVE, REMEDIATION_REQUIRED}"
          - "expected_engagement_version equals the current version"
          - "incoming_provider_id differs from provider_id and names a Provider with status == ACTIVE"
        side_effects:
          - "transition_incoming_provider_id, transition_cutover_start_date, transition_cutover_end_date, transition_parallel_run_cycles set from the request"
          - "transition_required stays true"
          - "version incremented by 1"
      - from: TRANSITION_PLANNED
        to: TRANSITION_IN_PROGRESS
        trigger: "POST /payroll/engagements/{id}/transition-decision with decision == APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "status == TRANSITION_PLANNED"
        side_effects:
          - "no field other than status changes; the plan fields are frozen from here"
      - from: TRANSITION_PLANNED
        to: ACTIVE
        trigger: "POST /payroll/engagements/{id}/transition-decision with decision == ABORT and transition_required == false"
        actor: PlatformAdmin
        preconditions:
          - "status IN {TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
        side_effects:
          - "transition_incoming_provider_id, transition_cutover_start_date, transition_cutover_end_date, transition_parallel_run_cycles reset to null"
      - from: TRANSITION_PLANNED
        to: REMEDIATION_REQUIRED
        trigger: "POST /payroll/engagements/{id}/transition-decision with decision == ABORT and transition_required == true"
        actor: PlatformAdmin
        preconditions:
          - "status IN {TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
        side_effects:
          - "all four transition_* plan fields reset to null; the engagement falls back to the remediation state it came from"
      - from: TRANSITION_IN_PROGRESS
        to: ACTIVE
        trigger: "POST /payroll/engagements/{id}/transition-decision with decision == COMPLETE"
        actor: PlatformAdmin
        preconditions:
          - "status == TRANSITION_IN_PROGRESS"
          - "knowledge_transfer_confirmed == true in the request body"
          - "no PayrollCycle of this engagement has status IN {INPUTS_LOCKED, RESULTS_APPROVED, FUNDED}"
        side_effects:
          - "outgoing provider recorded, then provider_id := transition_incoming_provider_id"
          - "all four transition_* plan fields reset to null; transition_required := false"
          - "outgoing Provider becomes OFFBOARDED when it has no other Engagement with status IN {ACTIVE, REMEDIATION_REQUIRED, TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
          - "incoming Provider.service_score recomputed for its new engagement portfolio"
      - from: TRANSITION_IN_PROGRESS
        to: REMEDIATION_REQUIRED
        trigger: "POST /payroll/engagements/{id}/transition-decision with decision == ABORT and transition_required == true"
        actor: PlatformAdmin
        preconditions:
          - "status IN {TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
        side_effects:
          - "all four transition_* plan fields reset to null; provider_id unchanged"

  - entity: Provider
    state_field: status
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: service_score recomputed to a value in [40.00, 55.00)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "every Engagement of this provider with status == ACTIVE becomes REMEDIATION_REQUIRED with transition_required := true"
          - "every PayrollCycle in status DRAFT of those engagements becomes ON_HOLD with hold_reason PROVIDER_PROBATION"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: service_score recomputed to a value below 40.00"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "every Engagement of this provider with status == ACTIVE becomes REMEDIATION_REQUIRED with transition_required := true"
          - "every PayrollCycle in status DRAFT of those engagements becomes ON_HOLD with hold_reason PROVIDER_SUSPENSION"
          - "no new GrossToNetRun may be created for any cycle of this provider (ERR_PROVIDER_SUSPENDED)"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: service_score recomputed to a value below 40.00"
        actor: system
        preconditions:
          - "status == PROBATION"
        side_effects:
          - "hold_reason of cycles already ON_HOLD is upgraded to PROVIDER_SUSPENSION"
      - from: ACTIVE
        to: PROBATION
        trigger: "system: open_penalty_minor rose above 100000 when a late-filing penalty was assessed"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "open_penalty_minor > 100000 after the assessment"
        side_effects:
          - "every Engagement of this provider with status == ACTIVE becomes REMEDIATION_REQUIRED with transition_required := true"
          - "every PayrollCycle in status DRAFT of those engagements becomes ON_HOLD with hold_reason PROVIDER_PROBATION"
          - "service_score is NOT changed by this path: penalty exposure and service score are independent grounds for probation"
      - from: PROBATION
        to: ACTIVE
        trigger: "system: service_score recomputed to a value >= 55.00, or open_penalty_minor fell back to at most 100000"
        actor: system
        preconditions:
          - "status == PROBATION"
          - "service_score >= 55.00"
          - "open_penalty_minor <= 100000"
        side_effects:
          - "every Engagement of this provider in REMEDIATION_REQUIRED with no remaining SlaIncident in {CONFIRMED, ESCALATED} becomes ACTIVE with transition_required := false"
      - from: SUSPENDED
        to: PROBATION
        trigger: "system: service_score recomputed to a value in [40.00, 55.00)"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "hold_reason of cycles still ON_HOLD is downgraded to PROVIDER_PROBATION"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: service_score recomputed to a value >= 55.00"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "service_score >= 55.00"
          - "open_penalty_minor <= 100000"
        side_effects:
          - "every Engagement of this provider in REMEDIATION_REQUIRED with no remaining SlaIncident in {CONFIRMED, ESCALATED} becomes ACTIVE with transition_required := false"
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "system: an Engagement transition completes and moves its last engagement to another provider"
        actor: system
        preconditions:
          - "status IN {ACTIVE, PROBATION, SUSPENDED}"
          - "no Engagement of this provider has status IN {ACTIVE, REMEDIATION_REQUIRED, TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
        side_effects:
          - "service_score frozen at its last computed value; the provider can no longer be named as an incoming transition provider"
      - from: PROBATION
        to: OFFBOARDED
        trigger: "system: an Engagement transition completes and moves its last engagement to another provider"
        actor: system
        preconditions:
          - "status IN {ACTIVE, PROBATION, SUSPENDED}"
          - "no Engagement of this provider has status IN {ACTIVE, REMEDIATION_REQUIRED, TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
        side_effects:
          - "service_score frozen at its last computed value"
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "system: an Engagement transition completes and moves its last engagement to another provider"
        actor: system
        preconditions:
          - "status IN {ACTIVE, PROBATION, SUSPENDED}"
          - "no Engagement of this provider has status IN {ACTIVE, REMEDIATION_REQUIRED, TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
        side_effects:
          - "service_score frozen at its last computed value"

  - entity: PayrollCycle
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ON_HOLD
        trigger: "system: the engaged Provider entered PROBATION or SUSPENDED"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "hold_reason := PROVIDER_PROBATION or PROVIDER_SUSPENSION"
          - "no InputFile may be created or validated while ON_HOLD"
      - from: ON_HOLD
        to: DRAFT
        trigger: "POST /payroll/cycles/{id}/release-hold"
        actor: GlobalPayrollOps
        preconditions:
          - "status == ON_HOLD"
          - "the engaged Provider.status == ACTIVE"
          - "Engagement.status == ACTIVE"
        side_effects:
          - "hold_reason := null"
      - from: DRAFT
        to: INPUTS_LOCKED
        trigger: "POST /payroll/cycles/{id}/lock-inputs"
        actor: GlobalPayrollOps
        preconditions:
          - "status == DRAFT"
          - "Engagement.status == ACTIVE"
          - "exactly one InputFile of this cycle has status == VALIDATED"
        side_effects:
          - "one StatutoryFiling minted per member of CountryProfile.required_filing_types, each PENDING with responsibility := Engagement.filing_responsibility and due_at from calculations.statutory_due_date"
          - "CountryProfile.open_filing_obligation_count increased by the number of minted filings"
          - "every InputFile of this cycle still in RECEIVED becomes SUPERSEDED"
      - from: INPUTS_LOCKED
        to: RESULTS_APPROVED
        trigger: "system: the cycle's GrossToNetRun reached APPROVED"
        actor: system
        preconditions:
          - "status == INPUTS_LOCKED"
        side_effects:
          - "gross_total_minor := the approved run's gross_minor"
          - "AuditEvidenceItem minted with control_ref CTRL_VARIANCE_REVIEW, evidence_type SYSTEM_ATTESTATION, recorded_by_role SYSTEM"
      - from: RESULTS_APPROVED
        to: FUNDED
        trigger: "system: a FundingInstruction of this cycle reached RELEASED"
        actor: system
        preconditions:
          - "status == RESULTS_APPROVED"
        side_effects:
          - "funded_total_minor increased by the released instruction's funded_source_minor"
      - from: FUNDED
        to: RESULTS_APPROVED
        trigger: "system: the released FundingInstruction of this cycle was recalled"
        actor: system
        preconditions:
          - "status == FUNDED"
          - "no other FundingInstruction of this cycle has status == RELEASED"
        side_effects:
          - "funded_total_minor decreased by the recalled instruction's funded_source_minor (back to 0 when it was the only release)"
      - from: FUNDED
        to: CLOSED
        trigger: "POST /payroll/cycles/{id}/close"
        actor: PayrollController
        preconditions:
          - "status == FUNDED"
          - "at least one StatutoryFiling exists and every non-VOIDED StatutoryFiling of this cycle has status == CONFIRMED"
          - "AuditEvidenceItem rows exist for all of CTRL_INPUT_INTEGRITY, CTRL_VARIANCE_REVIEW, CTRL_FUNDING_DUAL_AUTH, CTRL_FILING_CONFIRMATION"
        side_effects:
          - "Engagement.closed_cycle_count increased by 1"
          - "Provider.service_score recomputed; score_variant_applied flips to ROLLING_WINDOW once closed_cycle_count >= 1, which can change service_score and therefore Provider.status"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /payroll/cycles/{id}/cancel"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {DRAFT, ON_HOLD, INPUTS_LOCKED}"
          - "no FundingInstruction of this cycle has status == RELEASED"
          - "no StatutoryFiling of this cycle has status IN {FILED, FILED_LATE, CONFIRMED}"
        side_effects:
          - "every StatutoryFiling of this cycle in {PENDING, LATE} becomes VOIDED and CountryProfile.open_filing_obligation_count is decreased by that count"
          - "every FundingInstruction of this cycle in {DRAFT, APPROVED} becomes VOIDED"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /payroll/cycles/{id}/cancel"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {DRAFT, ON_HOLD, INPUTS_LOCKED}"
          - "no FundingInstruction of this cycle has status == RELEASED"
          - "no StatutoryFiling of this cycle has status IN {FILED, FILED_LATE, CONFIRMED}"
        side_effects:
          - "hold_reason := null"
          - "every StatutoryFiling in {PENDING, LATE} becomes VOIDED with the country obligation count decreased accordingly"
      - from: INPUTS_LOCKED
        to: CANCELLED
        trigger: "POST /payroll/cycles/{id}/cancel"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {DRAFT, ON_HOLD, INPUTS_LOCKED}"
          - "no FundingInstruction of this cycle has status == RELEASED"
          - "no StatutoryFiling of this cycle has status IN {FILED, FILED_LATE, CONFIRMED}"
        side_effects:
          - "every StatutoryFiling of this cycle in {PENDING, LATE} becomes VOIDED and CountryProfile.open_filing_obligation_count is decreased by that count, restoring the conserved quantity"
          - "every GrossToNetRun of this cycle in {SUBMITTED, CLEARED, ESCALATED, RETURNED} becomes SUPERSEDED"

  - entity: InputFile
    state_field: status
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /payroll/input-files/{id}/validate where calculations.input_validation_outcome yields PASS"
        actor: GlobalPayrollOps
        preconditions:
          - "status == RECEIVED"
          - "PayrollCycle.status == DRAFT"
        side_effects:
          - "validated_record_count := record_count; rejection_code := null"
          - "any other InputFile of the same cycle in status VALIDATED becomes SUPERSEDED"
          - "AuditEvidenceItem minted with control_ref CTRL_INPUT_INTEGRITY when the cycle has no such item yet"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /payroll/input-files/{id}/validate where calculations.input_validation_outcome yields FAIL"
        actor: GlobalPayrollOps
        preconditions:
          - "status == RECEIVED"
          - "PayrollCycle.status == DRAFT"
        side_effects:
          - "rejection_code := MISSING_ELEMENTS or RECORD_COUNT_DRIFT per the calculation"
          - "validated_record_count stays 0; no AuditEvidenceItem is minted"
      - from: REJECTED
        to: RECEIVED
        trigger: "POST /payroll/input-files/{id}/resubmit"
        actor: GlobalPayrollOps
        preconditions:
          - "status == REJECTED"
          - "PayrollCycle.status == DRAFT"
          - "current logical clock <= PayrollCycle.input_cutoff_at"
        side_effects:
          - "record_count, gross_declared_minor and country_elements replaced from the request"
          - "rejection_code := null; submitted_at := current logical clock instant"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system: another InputFile of the same cycle reached VALIDATED"
        actor: system
        preconditions:
          - "status == VALIDATED"
        side_effects:
          - "validated_record_count frozen; the file can no longer back a GrossToNetRun"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "system: the cycle locked its inputs while this file was still unvalidated"
        actor: system
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "the file can no longer be validated or resubmitted"

  - entity: GrossToNetRun
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "system: variance evaluated in the same request as creation or resubmission and variance_material == false"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "variance_pct, variance_basis, headcount_drift_pct and variance_material persisted"
          - "no SlaIncident is created on this branch"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "system: variance evaluated in the same request as creation or resubmission and variance_material == true"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "variance_pct, variance_basis, headcount_drift_pct and variance_material persisted"
          - "when the absolute value of variance_pct is >= 2 x CountryProfile.materiality_pct a SlaIncident is created with incident_type VARIANCE_ESCALATION, severity SEV3, status OPEN, occurred_at := current logical clock"
      - from: CLEARED
        to: APPROVED
        trigger: "POST /payroll/gross-to-net-runs/{id}/review with decision == APPROVE"
        actor: PayrollController
        preconditions:
          - "status IN {CLEARED, ESCALATED}"
          - "the acting X-User-ID differs from PayrollCycle.input_submitter_user_id"
        side_effects:
          - "PayrollCycle moves INPUTS_LOCKED -> RESULTS_APPROVED with gross_total_minor := gross_minor"
          - "AuditEvidenceItem CTRL_VARIANCE_REVIEW minted for the cycle"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /payroll/gross-to-net-runs/{id}/review with decision == APPROVE"
        actor: PayrollController
        preconditions:
          - "status IN {CLEARED, ESCALATED}"
          - "the acting X-User-ID differs from PayrollCycle.input_submitter_user_id"
          - "variance_justification of at least 10 characters supplied because the run is ESCALATED"
        side_effects:
          - "variance_justification persisted"
          - "PayrollCycle moves INPUTS_LOCKED -> RESULTS_APPROVED with gross_total_minor := gross_minor"
          - "AuditEvidenceItem CTRL_VARIANCE_REVIEW minted for the cycle"
      - from: ESCALATED
        to: RETURNED
        trigger: "POST /payroll/gross-to-net-runs/{id}/review with decision == RETURN"
        actor: PayrollController
        preconditions:
          - "status IN {CLEARED, ESCALATED}"
          - "return_reason of at least 10 characters supplied"
        side_effects:
          - "return_reason persisted"
          - "SlaIncident created with incident_type LATE_GTN_DELIVERY, severity SEV2, status OPEN for the cycle's engagement"
          - "PayrollCycle stays INPUTS_LOCKED"
      - from: CLEARED
        to: RETURNED
        trigger: "POST /payroll/gross-to-net-runs/{id}/review with decision == RETURN"
        actor: PayrollController
        preconditions:
          - "status IN {CLEARED, ESCALATED}"
          - "return_reason of at least 10 characters supplied"
        side_effects:
          - "return_reason persisted"
          - "SlaIncident created with incident_type LATE_GTN_DELIVERY, severity SEV2, status OPEN for the cycle's engagement"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /payroll/gross-to-net-runs/{id}/resubmit"
        actor: ProviderUser
        preconditions:
          - "status == RETURNED"
          - "expected_cycle_version equals the cycle's current version"
          - "PayrollCycle.status == INPUTS_LOCKED"
        side_effects:
          - "gross_minor, net_minor, employer_cost_minor, employee_count and provider_fee_minor replaced from the request"
          - "return_reason := null; variance recomputed, so the run immediately re-branches to CLEARED or ESCALATED"
          - "PayrollCycle.version incremented by 1"
      - from: CLEARED
        to: SUPERSEDED
        trigger: "system: a new GrossToNetRun was created for the same cycle"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, CLEARED, ESCALATED, RETURNED}"
        side_effects:
          - "the run can no longer be reviewed or resubmitted"
      - from: ESCALATED
        to: SUPERSEDED
        trigger: "system: a new GrossToNetRun was created for the same cycle"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, CLEARED, ESCALATED, RETURNED}"
        side_effects:
          - "the run can no longer be reviewed or resubmitted"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system: a new GrossToNetRun was created for the same cycle"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, CLEARED, ESCALATED, RETURNED}"
        side_effects:
          - "the run can no longer be reviewed or resubmitted"

  - entity: FundingInstruction
    state_field: status
    initial_state: DRAFT
    terminal_states: [RECALLED, VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /payroll/funding-instructions/{id}/approve"
        actor: TreasuryOfficer
        preconditions:
          - "status == DRAFT"
          - "PayrollCycle.status == RESULTS_APPROVED"
        side_effects:
          - "approver_user_id := acting X-User-ID"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /payroll/funding-instructions/{id}/release"
        actor: TreasuryOfficer
        preconditions:
          - "status == APPROVED"
          - "PayrollCycle.status == RESULTS_APPROVED"
          - "LocalBankAccount.status == VERIFIED"
          - "acting X-User-ID differs from approver_user_id"
          - "aggregate requested_local_minor already RELEASED on the same bank_account_id and value_date plus this instruction's requested_local_minor does not exceed LocalBankAccount.daily_cap_minor"
          - "the settlement window does not conflict with another RELEASED instruction's window on the same account per validations.funding-window-conflict"
        side_effects:
          - "releaser_user_id := acting X-User-ID"
          - "Engagement.treasury_committed_minor increased by funded_source_minor"
          - "PayrollCycle.funded_total_minor increased by funded_source_minor and the cycle moves RESULTS_APPROVED -> FUNDED"
          - "AuditEvidenceItem CTRL_FUNDING_DUAL_AUTH minted for the cycle"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /payroll/funding-instructions/{id}/recall"
        actor: TreasuryOfficer
        preconditions:
          - "status == RELEASED"
          - "PayrollCycle.status == FUNDED"
          - "recall_reason of at least 10 characters supplied"
        side_effects:
          - "recall_reason persisted"
          - "Engagement.treasury_committed_minor decreased by funded_source_minor, restoring the conserved quantity"
          - "PayrollCycle.funded_total_minor decreased by funded_source_minor and the cycle moves FUNDED -> RESULTS_APPROVED"
          - "the released settlement window and the daily cap bucket are freed for other instructions"
      - from: DRAFT
        to: VOIDED
        trigger: "system: the funded PayrollCycle was cancelled"
        actor: system
        preconditions:
          - "status IN {DRAFT, APPROVED}"
        side_effects:
          - "the instruction can no longer be approved or released"
      - from: APPROVED
        to: VOIDED
        trigger: "system: the funded PayrollCycle was cancelled"
        actor: system
        preconditions:
          - "status IN {DRAFT, APPROVED}"
        side_effects:
          - "approver_user_id retained for audit; the instruction can no longer be released"

  - entity: StatutoryFiling
    state_field: status
    initial_state: PENDING
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /payroll/filings/{id}/file"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {PENDING, LATE}"
          - "PayrollCycle.status IN {RESULTS_APPROVED, FUNDED}"
          - "current logical clock <= due_at"
          - "the acting role matches responsibility (ProviderUser of the engaged provider when PROVIDER, GlobalPayrollOps when CLIENT)"
        side_effects:
          - "filed_at := current logical clock instant; submission_ref persisted"
          - "CountryProfile.open_filing_obligation_count decreased by 1"
      - from: PENDING
        to: LATE
        trigger: "POST /payroll/cycles/{id}/filing-sweep with current logical clock > due_at"
        actor: GlobalPayrollOps
        preconditions:
          - "status == PENDING"
          - "current logical clock > due_at"
        side_effects:
          - "late_days, base_penalty_minor, surcharge_minor, total_penalty_minor, provider_share_minor and client_share_minor computed per calculations.filing_penalty_allocation"
          - "penalty_status NONE -> ASSESSED and penalty_owner set to PROVIDER, CLIENT or SHARED"
          - "Provider.open_penalty_minor increased by provider_share_minor; when it exceeds 100000 the provider drops ACTIVE -> PROBATION, cascading to its engagements and their DRAFT cycles"
          - "SlaIncident created with incident_type FILING_MISS, severity SEV2, status OPEN when responsibility == PROVIDER"
      - from: LATE
        to: FILED_LATE
        trigger: "POST /payroll/filings/{id}/file"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {PENDING, LATE}"
          - "PayrollCycle.status IN {RESULTS_APPROVED, FUNDED}"
          - "the acting role matches responsibility"
        side_effects:
          - "filed_at := current logical clock instant; submission_ref persisted"
          - "CountryProfile.open_filing_obligation_count decreased by 1"
          - "penalty_status is untouched: the penalty dimension keeps its own state"
      - from: FILED
        to: CONFIRMED
        trigger: "POST /payroll/filings/{id}/confirm"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {FILED, FILED_LATE}"
          - "confirmation_ref supplied (1..60 characters)"
        side_effects:
          - "confirmation_ref persisted; PayrollCycle.filings_confirmed_count increased by 1"
          - "AuditEvidenceItem CTRL_FILING_CONFIRMATION minted once every non-VOIDED filing of the cycle is CONFIRMED"
      - from: FILED_LATE
        to: CONFIRMED
        trigger: "POST /payroll/filings/{id}/confirm"
        actor: GlobalPayrollOps
        preconditions:
          - "status IN {FILED, FILED_LATE}"
          - "confirmation_ref supplied (1..60 characters)"
        side_effects:
          - "confirmation_ref persisted; PayrollCycle.filings_confirmed_count increased by 1"
          - "AuditEvidenceItem CTRL_FILING_CONFIRMATION minted once every non-VOIDED filing of the cycle is CONFIRMED"
      - from: PENDING
        to: VOIDED
        trigger: "system: the owning PayrollCycle was cancelled"
        actor: system
        preconditions:
          - "status IN {PENDING, LATE}"
        side_effects:
          - "CountryProfile.open_filing_obligation_count decreased by 1"
      - from: LATE
        to: VOIDED
        trigger: "system: the owning PayrollCycle was cancelled"
        actor: system
        preconditions:
          - "status IN {PENDING, LATE}"
        side_effects:
          - "CountryProfile.open_filing_obligation_count decreased by 1"
          - "penalty_status and all penalty amounts are retained; Provider.open_penalty_minor is not reduced by voiding"

  - entity: StatutoryFiling
    state_field: penalty_status
    initial_state: NONE
    terminal_states: [WAIVED]
    transitions:
      - from: NONE
        to: ASSESSED
        trigger: "system: the filing's status dimension moved PENDING -> LATE"
        actor: system
        preconditions:
          - "penalty_status == NONE"
        side_effects:
          - "penalty amounts and penalty_owner set; Provider.open_penalty_minor increased by provider_share_minor"
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /payroll/filings/{id}/penalty-dispute"
        actor: ProviderUser
        preconditions:
          - "penalty_status == ASSESSED"
          - "provider_share_minor > 0"
          - "dispute_round < 2"
          - "the acting ProviderUser belongs to the engaged provider"
        side_effects:
          - "dispute_reason persisted; amounts unchanged; the status dimension is unaffected"
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /payroll/filings/{id}/penalty-dispute-decision with decision == REJECT"
        actor: PayrollController
        preconditions:
          - "penalty_status == DISPUTED"
        side_effects:
          - "dispute_round increased by 1; dispute_reason := null; the provider may dispute again only while dispute_round < 2"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /payroll/filings/{id}/penalty-dispute-decision with decision == UPHOLD"
        actor: PayrollController
        preconditions:
          - "penalty_status == DISPUTED"
        side_effects:
          - "provider_share_minor moved to client_share_minor so total_penalty_minor is preserved; penalty_owner := CLIENT"
          - "Provider.open_penalty_minor decreased by the waived provider_share_minor, which can recover the provider PROBATION -> ACTIVE"

  - entity: SlaIncident
    state_field: status
    initial_state: OPEN
    terminal_states: [REMEDIATED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /payroll/sla-incidents/{id}/confirm"
        actor: PayrollController
        preconditions:
          - "status == OPEN"
        side_effects:
          - "weight_points := severity base points (SEV1 25.00, SEV2 15.00, SEV3 5.00)"
          - "Provider.service_score recomputed, which can move the provider ACTIVE -> PROBATION or SUSPENDED and cascade to engagements and their DRAFT cycles"
      - from: CONFIRMED
        to: ESCALATED
        trigger: "POST /payroll/sla-incidents/{id}/escalate"
        actor: PayrollController
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "escalation_level := 1; weight_points := severity base points x 1.5, rounded half-up to 2 decimals"
          - "Provider.service_score recomputed with the heavier weight"
      - from: CONFIRMED
        to: REMEDIATED
        trigger: "POST /payroll/sla-incidents/{id}/remediate"
        actor: PayrollController
        preconditions:
          - "status IN {CONFIRMED, ESCALATED}"
          - "remediation_ref supplied (1..60 characters)"
        side_effects:
          - "weight_points := 0.00; remediation_ref persisted"
          - "Provider.service_score recomputed, which can recover the provider and bubble ACTIVE back to its engagements"
      - from: ESCALATED
        to: REMEDIATED
        trigger: "POST /payroll/sla-incidents/{id}/remediate"
        actor: PayrollController
        preconditions:
          - "status IN {CONFIRMED, ESCALATED}"
          - "remediation_ref supplied (1..60 characters)"
        side_effects:
          - "weight_points := 0.00; escalation_level retained for audit"
          - "Provider.service_score recomputed, which can recover the provider and bubble ACTIVE back to its engagements"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - rule_id: gtn-run-create-stale-cycle
    parent_entity: PayrollCycle
    write_endpoint: "POST /payroll/gross-to-net-runs"
    occ_field: expected_cycle_version
    error_id: ERR_STALE_CYCLE_VERSION
    status_code: 412
    description: >
      Creating a GrossToNetRun supersedes every earlier run of the cycle and rewrites the
      cycle's result totals, so the caller must present the cycle version it read.
      POST /payroll/gross-to-net-runs/{id}/resubmit is guarded by the same field and the
      same error. A request whose expected_cycle_version does not equal the stored
      PayrollCycle.version is rejected with ERR_STALE_CYCLE_VERSION (412) and nothing is
      written; a matching request succeeds and increments PayrollCycle.version by 1, which
      invalidates any other in-flight request that read the older version.

  - rule_id: transition-plan-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /payroll/engagements/{id}/transition-plan"
    occ_field: expected_engagement_version
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    status_code: 412
    description: >
      A transition plan overwrites the four transition_* fields of the engagement, so the
      caller must present the engagement version it read. A request whose
      expected_engagement_version does not equal the stored Engagement.version is rejected
      with ERR_STALE_ENGAGEMENT_VERSION (412) and no plan field changes; a matching request
      succeeds and increments Engagement.version by 1 so a later request built on the
      pre-plan read is rejected.

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: input_cutoff_resolution
    algorithm_type: chronological
    description: >
      Resolves PayrollCycle.input_cutoff_at by walking backwards from pay_date over working
      days, skipping weekends and the country's local holidays.
    inputs:
      - "PayrollCycle.pay_date"
      - "PayrollCycle.cutoff_lead_working_days"
      - "CountryProfile.local_holidays"
    formula: |
      d := pay_date
      counted := 0
      while counted < cutoff_lead_working_days:
          d := d - 1 calendar day
          if ISO weekday of d is Monday..Friday AND d is not a member of CountryProfile.local_holidays:
              counted := counted + 1
      input_cutoff_at := d at 17:00:00.000Z
      # pay_date itself is never counted, even when it is a working day.
      # local_holidays is consulted on every candidate day, so a holiday inside the
      # walk pushes the cutoff one further working day into the past.
    constants:
      CUTOFF_TIME_OF_DAY_UTC: "17:00:00.000Z"
      WORKING_WEEKDAYS: "Monday..Friday"
    precision: "cutoff instant carries millisecond precision and is always 17:00:00.000Z on the resolved date"
    worked_example: |
      pay_date 2026-08-31 (Monday), cutoff_lead_working_days 3, local_holidays ["2026-09-25"]:
        2026-08-30 Sunday  -> skipped
        2026-08-28 Friday  -> counted 1     (2026-08-29 Saturday skipped)
        2026-08-27 Thursday-> counted 2
        2026-08-26 Wednesday -> counted 3   => input_cutoff_at = 2026-08-26T17:00:00.000Z

      pay_date 2026-09-30 (Wednesday), cutoff_lead_working_days 3, local_holidays ["2026-09-25"]:
        2026-09-29 Tuesday -> counted 1
        2026-09-28 Monday  -> counted 2
        2026-09-27 Sunday / 2026-09-26 Saturday -> skipped
        2026-09-25 Friday  -> skipped (local holiday)
        2026-09-24 Thursday-> counted 3     => input_cutoff_at = 2026-09-24T17:00:00.000Z
      With an empty local_holidays list the same cycle resolves to 2026-09-25T17:00:00.000Z,
      a full working day later.

  - name: statutory_due_date
    algorithm_type: chronological
    description: Resolves StatutoryFiling.due_at when the obligation is minted at input lock.
    inputs:
      - "PayrollCycle.pay_date"
      - "CountryProfile.statutory_filing_deadline_days"
    formula: |
      due_at := (pay_date + statutory_filing_deadline_days calendar days) at 23:59:59.999Z
      # Calendar days, not working days: statutory deadlines do not roll for weekends
      # or local holidays. Every filing of a cycle shares the same due_at.
    constants:
      DUE_TIME_OF_DAY_UTC: "23:59:59.999Z"
    precision: "millisecond precision; the instant is inclusive, so filing exactly at due_at is on time"
    worked_example: |
      pay_date 2026-08-31, statutory_filing_deadline_days 10 => due_at 2026-09-10T23:59:59.999Z
      pay_date 2026-09-30, statutory_filing_deadline_days 10 => due_at 2026-10-10T23:59:59.999Z

  - name: input_validation_outcome
    algorithm_type: threshold
    description: >
      Decides whether an InputFile validates, and when it fails, which rejection_code applies.
      The element check runs strictly before the drift check.
    inputs:
      - "InputFile.country_elements"
      - "InputFile.record_count"
      - "Engagement.data_residency_region (selects the required element key set)"
      - "employee_count of the APPROVED GrossToNetRun of PayrollCycle.prior_cycle_id, when one exists"
    formula: |
      required_keys := REGION_ELEMENT_SETS[Engagement.data_residency_region]
      if any key in required_keys is absent from country_elements
         or maps to an empty string:
          return (FAIL, MISSING_ELEMENTS)
      baseline := APPROVED GrossToNetRun of PayrollCycle.prior_cycle_id  # may be absent
      if baseline is absent:
          return (PASS, null)
      drift_pct := round_half_up(abs(record_count - baseline.employee_count)
                                 / baseline.employee_count * 100, 2)
      if drift_pct > MAX_RECORD_DRIFT_PCT:
          return (FAIL, RECORD_COUNT_DRIFT)
      return (PASS, null)
    constants:
      REGION_ELEMENT_SETS: |
        EU    -> {tax_id, social_insurance_no, iban}
        UK    -> {tax_id, ni_number, sort_code, account_number}
        US    -> {tax_id, ssn_last4, routing_number}
        APAC  -> {tax_id, national_id}
        LATAM -> {tax_id, national_id, clabe}
      MAX_RECORD_DRIFT_PCT: 20.00
    precision: "drift_pct rounded half-up to 2 decimals before the strict > comparison"
    worked_example: |
      EU cycle, country_elements {tax_id, social_insurance_no, iban} all non-empty,
      record_count 210, baseline employee_count 200:
        drift_pct = round(10 / 200 * 100, 2) = 5.00 ; 5.00 > 20.00 is false => PASS
      Same file with country_elements missing "iban" => FAIL / MISSING_ELEMENTS, and the
      drift check never runs.
      record_count 240 against baseline 200 => drift_pct 20.00, not > 20.00 => PASS.
      record_count 241 against baseline 200 => drift_pct 20.50 => FAIL / RECORD_COUNT_DRIFT.

  - name: gross_to_net_variance
    algorithm_type: threshold
    description: >
      Scores a GrossToNetRun against the prior cycle's approved run and decides materiality.
      Two variants exist because a moderate headcount movement must be normalized away while
      a structural population change must be judged on absolute cash.
    inputs:
      - "GrossToNetRun.gross_minor"
      - "GrossToNetRun.employee_count"
      - "baseline = the GrossToNetRun with status APPROVED whose cycle_id == PayrollCycle.prior_cycle_id"
      - "CountryProfile.materiality_pct"
      - "CountryProfile.materiality_floor_minor"
    formula: |
      if PayrollCycle.prior_cycle_id is null
         or no GrossToNetRun with status APPROVED exists for it:
          variance_basis      := NO_PRIOR_BASELINE
          variance_pct        := null
          headcount_drift_pct := null
          variance_material   := false
          return
      headcount_drift_pct := round_half_up(abs(employee_count - baseline.employee_count)
                                           / baseline.employee_count * 100, 2)
      # ---- variant selection (see variants) ----
      variance_pct := per the selected variant, rounded half-up to 2 decimals
      gross_delta_minor := abs(gross_minor - baseline.gross_minor)
      variance_material := abs(variance_pct) >= CountryProfile.materiality_pct
                           AND gross_delta_minor >= CountryProfile.materiality_floor_minor
    variants:
      - name: HEADCOUNT_NORMALIZED
        when: "MIN_NORMALIZATION_DRIFT_PCT <= headcount_drift_pct <= MAX_NORMALIZATION_DRIFT_PCT"
        formula: |
          per_head      := gross_minor / employee_count                    # exact rational
          base_per_head := baseline.gross_minor / baseline.employee_count  # exact rational
          variance_pct  := round_half_up((per_head - base_per_head) / base_per_head * 100, 2)
      - name: ABSOLUTE_TOTAL
        when: "headcount_drift_pct < MIN_NORMALIZATION_DRIFT_PCT or headcount_drift_pct > MAX_NORMALIZATION_DRIFT_PCT"
        formula: |
          variance_pct := round_half_up((gross_minor - baseline.gross_minor)
                                        / baseline.gross_minor * 100, 2)
    constants:
      MIN_NORMALIZATION_DRIFT_PCT: 3.00
      MAX_NORMALIZATION_DRIFT_PCT: 10.00
    precision: >
      per-head amounts are exact rationals with no intermediate rounding; only variance_pct
      and headcount_drift_pct are rounded, half-up, to 2 decimals. Materiality uses >= on
      both the rounded percentage and the unrounded absolute gross delta.
    worked_example: |
      Baseline (prior cycle, APPROVED): gross_minor 10000000, employee_count 200.
      Country: materiality_pct 5.00, materiality_floor_minor 100000.

      (a) run gross_minor 10500000, employee_count 210
          headcount_drift_pct = round(10/200*100,2) = 5.00 -> inside [3.00, 10.00]
          => variance_basis HEADCOUNT_NORMALIZED
          per_head 10500000/210 = 50000 ; base_per_head 10000000/200 = 50000
          variance_pct = 0.00 ; gross_delta_minor = 500000
          variance_material = (0.00 >= 5.00) AND (500000 >= 100000) = false
          The ABSOLUTE_TOTAL reading of the very same run would be 5.00 and material:
          the two variants disagree on the outcome, not merely on the number.

      (b) run gross_minor 10500000, employee_count 230
          headcount_drift_pct = round(30/200*100,2) = 15.00 -> above 10.00
          => variance_basis ABSOLUTE_TOTAL
          variance_pct = round(500000/10000000*100,2) = 5.00
          variance_material = (5.00 >= 5.00) AND (500000 >= 100000) = true (exact boundary)

      (c) run gross_minor 1060000, employee_count 20 against baseline 1000000 / 20
          headcount_drift_pct 0.00 -> below 3.00 => ABSOLUTE_TOTAL, variance_pct 6.00
          gross_delta_minor 60000 < materiality_floor_minor 100000
          => variance_material false: the percentage alone never carries materiality.

  - name: provider_service_score
    algorithm_type: weighted_scoring
    description: >
      Weighted service-level score that drives Provider.status. Two variants exist because a
      provider with delivery history is judged on a rolling window while a provider with no
      closed cycle is judged on its entire engagement history.
    inputs:
      - "SlaIncident rows of every Engagement of the provider with status IN {CONFIRMED, ESCALATED}"
      - "StatutoryFiling rows of those engagements' cycles with late_days > 0"
      - "Engagement.closed_cycle_count of every Engagement of the provider"
      - "current logical clock"
    formula: |
      qualifying_incidents := SlaIncident rows of this provider's engagements with
                              status IN {CONFIRMED, ESCALATED}, filtered by the variant window
      qualifying_late_filings := StatutoryFiling rows of those engagements' cycles with
                              late_days > 0, filtered by the variant window
      deduction := sum(weight_points of qualifying_incidents)
                   + LATE_FILING_DEDUCTION * count(qualifying_late_filings)
      service_score := max(0.00, round_half_up(100.00 - deduction, 2))
      # weight_points are maintained by the SlaIncident machine:
      #   SEV1 25.00, SEV2 15.00, SEV3 5.00, multiplied by ESCALATION_MULTIPLIER once
      #   escalated, and reset to 0.00 on remediation.
      # status re-derivation, applied immediately after every recompute:
      #   service_score <  SUSPENSION_FLOOR -> SUSPENDED
      #   SUSPENSION_FLOOR <= score < PROBATION_FLOOR -> PROBATION
      #   service_score >= PROBATION_FLOOR AND
      #     open_penalty_minor <= PENALTY_PROBATION_THRESHOLD_MINOR -> ACTIVE
      #   service_score >= PROBATION_FLOOR AND
      #     open_penalty_minor >  PENALTY_PROBATION_THRESHOLD_MINOR -> PROBATION
      # Penalty exposure is an independent ground for probation: a provider with a
      # perfect 100.00 score and more than PENALTY_PROBATION_THRESHOLD_MINOR of
      # unresolved penalty share is on probation, and waiving the share recovers it.
      # OFFBOARDED is never entered or left by score.
    variants:
      - name: ROLLING_WINDOW
        when: "at least one Engagement of this provider has closed_cycle_count >= MIN_CLOSED_CYCLES_FOR_ROLLING"
        formula: |
          window_start := current logical clock - ROLLING_WINDOW_DAYS calendar days
          keep an incident when occurred_at >= window_start
          keep a late filing when due_at    >= window_start
      - name: ENGAGEMENT_TO_DATE
        when: "no Engagement of this provider has closed_cycle_count >= MIN_CLOSED_CYCLES_FOR_ROLLING"
        formula: |
          no time filter at all: every qualifying incident and late filing counts,
          including ones that occurred before Engagement.activated_at
    constants:
      SEV1_POINTS: 25.00
      SEV2_POINTS: 15.00
      SEV3_POINTS: 5.00
      ESCALATION_MULTIPLIER: 1.5
      LATE_FILING_DEDUCTION: 5.00
      ROLLING_WINDOW_DAYS: 90
      MIN_CLOSED_CYCLES_FOR_ROLLING: 1
      PROBATION_FLOOR: 55.00
      SUSPENSION_FLOOR: 40.00
      PENALTY_PROBATION_THRESHOLD_MINOR: 100000
    precision: >
      weight_points rounded half-up to 2 decimals when the escalation multiplier is applied
      (SEV1 escalated 37.50, SEV2 escalated 22.50, SEV3 escalated 7.50); the deduction is
      summed at 2 decimals and the score clamped to [0.00, 100.00].
    worked_example: |
      Clock 2026-08-01T00:00:00Z, provider with one engagement, no closed cycle
      (=> ENGAGEMENT_TO_DATE).
        one CONFIRMED SEV1                       -> 100.00 - 25.00 = 75.00  -> ACTIVE
        two CONFIRMED SEV1                       -> 100.00 - 50.00 = 50.00  -> PROBATION
        three CONFIRMED SEV1                     -> 100.00 - 75.00 = 25.00  -> SUSPENDED
        CONFIRMED SEV1 + CONFIRMED SEV2          -> 100.00 - 40.00 = 60.00  -> ACTIVE
        the same pair with the SEV2 escalated    -> 100.00 - 25.00 - 22.50 = 52.50 -> PROBATION
        CONFIRMED SEV1 + SEV2 + SEV3             -> 100.00 - 45.00 = 55.00  -> ACTIVE (boundary)
        the same three plus one more CONFIRMED SEV3 -> 50.00 -> PROBATION
      Variant divergence, clock 2026-08-01T00:00:00Z, window_start 2026-05-03T00:00:00Z:
        a CONFIRMED SEV1 with occurred_at 2026-04-01T00:00:00Z scores 75.00 under
        ENGAGEMENT_TO_DATE and 100.00 under ROLLING_WINDOW; an incident with occurred_at
        exactly 2026-05-03T00:00:00Z is inside the window under both variants.

  - name: funding_requirement_conversion
    algorithm_type: aggregation
    description: >
      Converts the approved local payroll requirement into funding-currency minor units and
      adds the FX buffer. Each component is converted and rounded on its own before the
      components are summed.
    inputs:
      - "net_minor, employer_cost_minor, provider_fee_minor of the APPROVED GrossToNetRun of the cycle"
      - "FundingInstruction.fx_rate"
    formula: |
      requested_local_minor := net_minor + employer_cost_minor + provider_fee_minor
      # mandatory evaluation order: convert each component, round each component,
      # then sum the rounded components. Summing first and converting once is wrong.
      component_source_minor.net           := round_half_up(net_minor / fx_rate)
      component_source_minor.employer_cost := round_half_up(employer_cost_minor / fx_rate)
      component_source_minor.provider_fee  := round_half_up(provider_fee_minor / fx_rate)
      subtotal_source_minor := component_source_minor.net
                             + component_source_minor.employer_cost
                             + component_source_minor.provider_fee
      buffer_source_minor := round_half_up(subtotal_source_minor * FX_BUFFER_PCT / 100)
      funded_source_minor := subtotal_source_minor + buffer_source_minor
    constants:
      FX_BUFFER_PCT: 1.50
    precision: >
      fx_rate carries 6 decimals; each component quotient is rounded half-up to a whole
      funding-currency minor unit before summation; the buffer is computed on the sum of the
      rounded components and rounded half-up to a whole minor unit.
    worked_example: |
      Approved run: net_minor 6500000, employer_cost_minor 2000000, provider_fee_minor 150000
      => requested_local_minor 8650000. fx_rate 0.920000 (local minor per source minor).
        net           6500000 / 0.92 = 7065217.391... -> 7065217
        employer_cost 2000000 / 0.92 = 2173913.043... -> 2173913
        provider_fee   150000 / 0.92 =  163043.478... ->  163043
        subtotal_source_minor = 9402173
        buffer = round_half_up(9402173 * 1.50 / 100) = round_half_up(141032.595) = 141033
        funded_source_minor = 9543206
      Converting the aggregate first would give round(8650000/0.92) = 9402174, a buffer of
      141033 and a total of 9543207 - one minor unit too much. 9543206 is the required answer.

  - name: filing_penalty_allocation
    algorithm_type: tiered_pricing
    description: >
      Accrues the statutory late-filing penalty and splits it between provider and client.
      The surcharge tier is selected from the uncapped base; the indemnity cap is applied
      only afterwards.
    inputs:
      - "StatutoryFiling.due_at"
      - "current logical clock at the sweep"
      - "CountryProfile.penalty_daily_rate_minor"
      - "StatutoryFiling.responsibility"
      - "Provider.annual_fee_minor, Provider.indemnity_cap_pct, Provider.open_penalty_minor"
    formula: |
      # step 1 - late days, whole days rounded up
      late_days := ceil((clock_now - due_at) in seconds / 86400)
      # step 2 - base accrual
      base_penalty_minor := STATUTORY_BASE_MINOR + late_days * penalty_daily_rate_minor
      # step 3 - tier chosen from the UNCAPPED base
      if   base_penalty_minor <= TIER1_CEILING_MINOR: tier_pct := 0.00
      elif base_penalty_minor <= TIER2_CEILING_MINOR: tier_pct := 10.00
      else:                                          tier_pct := 20.00
      surcharge_minor := round_half_up(base_penalty_minor * tier_pct / 100)
      # step 4 - total
      total_penalty_minor := base_penalty_minor + surcharge_minor
      # step 5 - remaining indemnity headroom
      cap_minor := round_half_up(Provider.annual_fee_minor * Provider.indemnity_cap_pct / 100)
      remaining_cap_minor := max(0, cap_minor - Provider.open_penalty_minor)
      # step 6 - split
      if responsibility == PROVIDER:
          provider_share_minor := min(total_penalty_minor, remaining_cap_minor)
      else:
          provider_share_minor := 0
      client_share_minor := total_penalty_minor - provider_share_minor
      # step 7 - ownership label
      if total_penalty_minor == 0:                        penalty_owner := NONE
      elif provider_share_minor == total_penalty_minor:   penalty_owner := PROVIDER
      elif provider_share_minor == 0:                     penalty_owner := CLIENT
      else:                                               penalty_owner := SHARED
    constants:
      STATUTORY_BASE_MINOR: 25000
      TIER1_CEILING_MINOR: 50000
      TIER2_CEILING_MINOR: 100000
      TIER1_PCT: 0.00
      TIER2_PCT: 10.00
      TIER3_PCT: 20.00
    precision: >
      late_days is a whole number rounded up from any positive remainder; surcharge and cap
      are rounded half-up to whole local minor units; shares are whole minor units and always
      sum exactly to total_penalty_minor.
    worked_example: |
      due_at 2026-10-10T23:59:59.999Z, sweep at clock 2026-10-13T12:00:00Z,
      penalty_daily_rate_minor 15000, responsibility PROVIDER.
        elapsed = 2 days 12:00:00.001 -> late_days = 3
        base_penalty_minor = 25000 + 3 * 15000 = 70000
        70000 > 50000 and <= 100000 -> tier_pct 10.00 -> surcharge_minor 7000
        total_penalty_minor = 77000
        Provider annual_fee_minor 6000000, indemnity_cap_pct 25.00 -> cap_minor 1500000,
        open_penalty_minor 0 -> remaining_cap_minor 1500000
        provider_share_minor 77000, client_share_minor 0, penalty_owner PROVIDER
      Same filing against a small provider (annual_fee_minor 200000, indemnity_cap_pct 25.00):
        cap_minor 50000 -> provider_share_minor 50000, client_share_minor 27000,
        penalty_owner SHARED. Note the surcharge is still 7000, computed from the uncapped
        base of 70000; tiering the capped 50000 would have produced 0 surcharge.

  - name: treasury_commitment_reconciliation
    algorithm_type: aggregation
    description: >
      Keeps Engagement.treasury_committed_minor equal to the money actually in flight, so a
      recall must return the field to its pre-release value with no drift.
    inputs:
      - "FundingInstruction.funded_source_minor and status over every PayrollCycle of the engagement"
    formula: |
      Engagement.treasury_committed_minor
        == sum(funded_source_minor of FundingInstruction rows whose cycle_id belongs to this
               engagement and whose status == RELEASED)
      # RELEASED adds, RECALLED removes, DRAFT / APPROVED / VOIDED never contribute.
    constants: {}
    precision: "whole funding-currency minor units; no rounding takes place in the aggregate"
    worked_example: |
      Engagement with one cycle. treasury_committed_minor starts at 0.
      Release an instruction with funded_source_minor 9543206 -> 9543206.
      Recall that instruction -> 0, exactly the opening value, and PayrollCycle
      funded_total_minor returns to 0 in the same request.

  - name: country_obligation_reconciliation
    algorithm_type: aggregation
    description: >
      Keeps CountryProfile.open_filing_obligation_count equal to the number of live statutory
      obligations, so lodging or voiding every obligation must return it to its opening value.
    inputs:
      - "StatutoryFiling.status over every PayrollCycle of every Engagement of the country"
    formula: |
      CountryProfile.open_filing_obligation_count
        == count(StatutoryFiling rows whose cycle belongs to an Engagement of this country and
                 whose status IN {PENDING, LATE})
      # minting at input lock increments, PENDING -> LATE is count-neutral,
      # FILED / FILED_LATE / VOIDED decrement.
    constants: {}
    precision: "whole count; never negative"
    worked_example: |
      Country with materiality and two required_filing_types. open_filing_obligation_count 0.
      Lock a cycle's inputs -> 2 obligations minted -> 2.
      File one obligation before its due_at -> 1.
      Cancel the cycle while the other is still PENDING -> it becomes VOIDED -> 0.

# =============================================================================
# §1.4 Validation Rules
#
# Priority ladder (lower number is evaluated first; the first violated rule is
# the only error returned):
#   10  existence of every referenced entity
#   15  authorization and segregation of duties
#   20  data-residency and service-scope safety
#   30  entity state and cross-entity state
#   40  temporal windows and cutoffs
#   50  referential coherence between two existing rows
#   60  fiscal caps and aggregate limits
#   70  uniqueness and shape constraints
# Request-shape failures (unknown enum member, missing required field, wrong
# type) are rejected with ERR_INVALID_REQUEST (422) before any rule below runs.
# =============================================================================
validations:
  - rule_id: engagement-residency-region-alignment
    scope: "POST /payroll/engagements"
    category: safety
    priority: 20
    condition: "data_residency_region differs from CountryProfile.data_residency_region, or is not a member of Provider.data_residency_regions"
    error_id: ERR_DATA_RESIDENCY_VIOLATION
    status_code: 422

  - rule_id: engagement-scope-subset
    scope: "POST /payroll/engagements"
    category: safety
    priority: 20
    condition: "service_scope contains a member that is not in Provider.service_scope"
    error_id: ERR_SERVICE_SCOPE_NOT_COVERED
    status_code: 422

  - rule_id: engagement-filing-capability
    scope: "POST /payroll/engagements"
    category: safety
    priority: 20
    condition: "filing_responsibility == PROVIDER while Provider.statutory_filing_capable is false"
    error_id: ERR_FILING_CAPABILITY_MISSING
    status_code: 422

  - rule_id: engagement-provider-offboarded
    scope: "POST /payroll/engagements"
    category: state
