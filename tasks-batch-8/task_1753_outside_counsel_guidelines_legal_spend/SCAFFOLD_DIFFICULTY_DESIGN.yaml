scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_payable
        grounds:
          - calculations.invoice_payable_amount
          - state_machines.Invoice.PARTIALLY_APPROVED_to_PAID
          - state_machines.InvoiceLineItem.REJECTED_to_REINSTATED
        distinguishing_aspect: |
          Invoice entity domain: the provisional variant (approved_total_cents
          while an appeal is pending) and the final variant (final_payable_cents
          frozen at PAID, after appeal grant reinstates the rejected line) MUST
          differ by exactly the reinstated line's amount_cents for identical
          underlying line-item data.
        test_recipe:
          setup:
            - "LegalDepartment with annual_rate_increase_cap_pct=5.00, partner_ratio_min_pct=10, partner_ratio_max_pct=90, guideline_notice_days=30, acknowledgment_window_days=14"
            - "PanelFirm ACTIVE; no published guideline (so no ack precondition on engage)"
            - "Matter ENGAGED, budget_cents=100000000, billed_to_date_cents=0"
            - "One QUALIFIED PARTNER timekeeper on the firm; APPROVED rate card for 2026 with approved_rate_cents=100000"
            - "Invoice submitted with two clean lines (hours 10.00 and 5.00, rate_cents 100000 each) — line1 amount 1000000, line2 amount 500000"
            - "Auto-review approves line1; line2 is manually rejected by reviewer with reason RATE_EXCEEDS_APPROVED (forced via manual reject to construct a PARTIALLY_APPROVED invoice)"
            - "Invoice in PARTIALLY_APPROVED, approved_total_cents=1000000 (provisional)"
            - "Firm appeals line2's rejection; reviewer claims and grants the appeal"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "Acme Legal", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "Firm Alpha" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "Pat Partner", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "Matter M1", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-001"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "Review motion L110", hours: 10.00, rate_cents: 100000 }
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L120", narrative: "Draft brief L120", hours: 5.00, rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { invoice_id: $.data.id }
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items"
              payload: {}
              as: LegalOpsReviewer
              captures: { line1_id: "$.data[0].id", line2_id: "$.data[1].id" }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/reject"
              payload: { rejection_reason_code: "RATE_EXCEEDS_APPROVED" }
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/appeals"
              payload: { rationale: "Rate matches approved card" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/appeals/${appeal_id}/claim"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/appeals/${appeal_id}/grant"
              payload: { resolution_note: "Rate verified" }
              as: LegalOpsReviewer
          trigger:
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { inv_approved_total: $.data.approved_total_cents, inv_status: $.data.status }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/pay"
              payload: {}
              as: LegalOpsReviewer
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { inv_final: $.data.final_payable_cents }
          assert:
            - "pre-appeal provisional approved_total_cents was 1000000 (only line1)"
            - "post-grant approved_total_cents == 1500000 (both lines reinstated)"
            - "final_payable_cents == 1500000 (frozen post-appeal value)"
            - "Invoice.status == PAID"

      - name: staffing_ratio_billed_vs_headcount_basis
        grounds:
          - calculations.staffing_ratio_compliance
          - entities.MatterForecast
          - endpoints: "GET /legal-departments/{deptId}/matters/{matterId}/staffing-ratio"
        distinguishing_aspect: |
          Matter/Timekeeper entity domain (distinct from the Invoice domain of
          the sibling instance): the billed_hours basis uses hours from approved
          line items; the headcount basis uses counts of QUALIFIED timekeepers —
          identical underlying data yields different ratio_pct values.
        test_recipe:
          setup:
            - "LegalDepartment with partner_ratio_min_pct=10, partner_ratio_max_pct=90"
            - "PanelFirm ACTIVE with 1 PARTNER (QUALIFIED) and 3 ASSOCIATEs (all QUALIFIED) — headcount partner share = 25%"
            - "Approved rate card 2026: partner rate 100000, associate rate 50000"
            - "Matter ENGAGED; invoice with partner 50.00 hours + associate 10.00 hours total across all associates (billed partner share = 50/60 = 83.33%)"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "Beta Legal", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "Firm Beta" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "Partner1", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_p: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "Assoc1", tk_class: "ASSOCIATE" }
