      - name: horse_status_cycles_in_service_lame_rehab_back_to_in_service
        grounds:
          - state_machines.Horse.horse_status
          - state_machines.Horse.IN_SERVICE_to_LAME
          - state_machines.Horse.LAME_to_REHAB
          - state_machines.Horse.REHAB_to_IN_SERVICE
          - entities.HorseHealthEvent
          - calculations.horse_duty_day_run
        distinguishing_aspect: |
          A different non-linearity from the Booking pair: Horse.horse_status is cyclic, so
          IN_SERVICE is reachable a second time by a different route than initial creation, and the
          only legal way back is LAME -> REHAB -> IN_SERVICE. A forward-only enum ladder, or one
          that allows VET_CLEARANCE straight from LAME, gets a different final state. The immutable
          HorseHealthEvent log must also retain all three rows with their resulting statuses.
        test_recipe:
          setup:
            - "one horse created IN_SERVICE with consecutive_duty_days 0"
            - "clock walked forward across the three health events so each observed_on is on or before the clock date"
          setup_api_calls:
            - call: "POST /horses"
              payload: { name: "Comet", min_rider_ability: "BEGINNER", max_rider_ability: "ADVANCED", weight_limit_lb: 240 }
