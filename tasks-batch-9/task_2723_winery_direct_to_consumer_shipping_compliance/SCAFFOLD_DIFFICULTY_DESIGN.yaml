            - "Winery Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Consumer Ada is ID-verified. Clock 2026-08-01."
            - "A MANUAL_ADJUSTMENT of 22.500 L dated 2026-07-15 sits inside the ROLLING_12_MONTHS window (f3 = floor(30*22.500/27.000) = 25)."
            - "Order A (12 x 750 ml @ 4200 c, 9.000 L) breached the 27.000 L consumer limit, went OVERRIDE_PENDING, and its exception was DENIED (denied_exception_count 1, f2 = 15)."
