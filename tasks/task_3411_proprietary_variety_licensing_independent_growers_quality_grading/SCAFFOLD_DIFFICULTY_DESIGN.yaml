            - "marketing_fee_cents != 111390 (which is what round_half_up(1856500 x 0.06) would give if the fee were wrongly computed from net revenue)"
            - "provisional_pool_rate == 450.3335 == round_half_up(1856500 / 4122.5, 4) — rate derived FROM net_pool_revenue_cents after the fee carve-out"
            - "provisional_pool_rate != 479.0782 (which is what round_half_up(1975000 / 4122.5, 4) would give if the rate were wrongly derived from gross revenue)"
            - "after settle: marketing_fee_cents == 123240 == round_half_up(2054000 x 0.06) and final_pool_rate == 468.3469 == round_half_up(1930760 / 4122.5, 4)"

      - name: per_lot_rounding_then_sum_mode_b
        grounds:
