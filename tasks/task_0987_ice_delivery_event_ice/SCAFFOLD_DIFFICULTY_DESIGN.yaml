  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_gated_by_customer_standing
        grounds:
          - validations[priority=26]
          - errors[ERR_CREDIT_HOLD]
          - state_machines.Invoice.transitions.ISSUED_to_OVERDUE
        distinguishing_aspect: |
          Entity pair (Order, Customer): Order.QUOTED -> CONFIRMED is gated on
          the Customer aggregate's derived standing field — while any invoice
          is OVERDUE (standing HOLD) confirm fails with ERR_CREDIT_HOLD (402);
