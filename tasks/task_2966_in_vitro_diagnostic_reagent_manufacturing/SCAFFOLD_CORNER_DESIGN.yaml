          setup:
            - "Clock at 2026-08-12T00:00:00Z. One PLANNED ReagentLot RB-LOT-P of the uncleared product IVD-RB-P, opened by the role that is allowed to open it, so the component denial can quote that lot's observed version and cannot be dismissed as an OCC failure."
