                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { o1_id: $.data.id }
            - call: "POST /api/assembly-orders/${o1_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${o1_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${o1_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${o1_id}/tag"
              payload: { tag_serial: "DUP-1" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders"
