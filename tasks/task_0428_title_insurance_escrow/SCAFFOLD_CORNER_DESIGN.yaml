              payload: { exception_type: "SPECIAL", description: "Boundary encroachment", curative_required: true }
              as: TitleOfficer
              captures: { ex_id: $.data.id }
            - call: "POST /title/exceptions/${ex_id}/transitions"
              payload: { to_status: "CURATIVE_PENDING" }
              as: TitleOfficer
          trigger:
            - call: "POST /title/orders/${o_id}/curative-actions"
              payload: { subject_type: "EXCEPTION", subject_id: "${ex_id}", action_type: "RELEASE_FILED" }
              as: TitleOfficer
              captures: { ca_id: $.data.id }
            - call: "GET /title/orders/${o_id}/curative-actions"
              as: TitleOfficer
          assert:
            - "CurativeAction.${ca_id}.status == OPEN; it appears in the order's curative-actions list with subject_id == ${ex_id}"

      - name: exception_clear_after_resolved_curative_succeeds
        claim_type: conditional_action
        grounds: [state_machines.Exception.CURATIVE_PENDING_to_CLEARED, state_machines.CurativeAction.OPEN_to_RESOLVED]
        distinguishing_aspect: "With a RESOLVED CurativeAction(subject=EXCEPTION), the exception CURATIVE_PENDING->CLEARED succeeds and parent open_exception_count drops to 0."
        test_recipe:
          setup: ["A commitment with one CURATIVE_PENDING exception and a RESOLVED CurativeAction on it."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C34", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/exceptions"
              payload: { exception_type: "SUBORDINATE_LIEN", description: "Second mortgage", curative_required: true }
              as: TitleOfficer
              captures: { ex_id: $.data.id }
            - call: "POST /title/exceptions/${ex_id}/transitions"
              payload: { to_status: "CURATIVE_PENDING" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/curative-actions"
              payload: { subject_type: "EXCEPTION", subject_id: "${ex_id}", action_type: "PAYOFF" }
              as: TitleOfficer
              captures: { ca_id: $.data.id }
            - call: "POST /title/curative-actions/${ca_id}/transitions"
              payload: { to_status: "RESOLVED" }
              as: TitleOfficer
          trigger:
            - call: "POST /title/exceptions/${ex_id}/transitions"
              payload: { to_status: "CLEARED" }
              as: TitleOfficer
            - call: "GET /title/commitments/${c_id}"
              as: TitleOfficer
              captures: { oec: $.data.open_exception_count }
          assert:
            - "Exception.${ex_id}.status == CLEARED"
            - "Commitment.${c_id}.open_exception_count == 0"

