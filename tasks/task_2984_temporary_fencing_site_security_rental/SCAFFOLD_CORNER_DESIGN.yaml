            - "First trigger: the error is the capacity one, not ERR_CREW_WINDOW_CONFLICT, because 14:00 is clear of the first order's buffered end 13:45"
            - "WorkOrder.${wo2_id}.status is still \"PLANNED\" and crew_id is null"
            - "Second trigger: HTTP 200 (4.25 + 3.75 == 8.0 exactly, and equality is admitted)"
            - "WorkOrder.${wo3_id}.estimated_labor_hours == 3.75 and scheduled_end_utc == \"2026-08-03T17:45:00Z\""
            - "WorkOrder.${wo3_id}.reserved_unit_counts == [{ product_code: \"PANEL-CL-10\", unit_count: 45 }]"

      - name: solid_screen_allowed_by_one_municipality_and_refused_by_another
        claim_type: conditional_validation
        grounds:
          - validations.priority_11_ERR_WIND_LOAD_NOT_PERMITTED
          - errors.ERR_WIND_LOAD_NOT_PERMITTED
          - entities.Municipality.fields.allows_solid_wind_screen
        distinguishing_aspect: |
          The rule is gated purely on the jurisdiction flag reached through the
          jobsite: byte-identical SOLID_130 quote payloads produce a priced quote
          with monthly_recurring_cents 49450 under a municipality that allows
          solid screens and a 409 ERR_WIND_LOAD_NOT_PERMITTED under one that does
          not — and the refusal happens before any pricing arithmetic, so no
          quote row is created at all.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01 with allows_solid_wind_screen true and municipality WSTB-02 with allows_solid_wind_screen false."
            - "Account A, product PANEL-CL-10, jobsite J1 (SOIL) under HRB-01 and jobsite J2 (SOIL) under WSTB-02."
