scenario: "Investigational Drug Service & Randomization (research pharmacy): study drug receipt, quarantine & temperature log, randomization/blinding & emergency unblinding procedure, dispensing per protocol & accountability log, drug return/destruction documentation, temperature excursion & product quarantine, pharmacy protocol review & fee schedule, monitor visit drug accountability reconciliation, expiry/re-supply management"

domain_name: investigational-drug-randomization
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK links in bodies)
# =============================================================================
entities:
  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: protocol_number, type: string, source: input, description: "Sponsor protocol identifier; unique across all studies", constraints: "unique; non-empty" }
      - { name: title, type: string, source: input, description: "Study title" }
      - { name: phase, type: enum, source: input, description: "Trial phase", constraints: "one of {PHASE_I, PHASE_II, PHASE_III, PHASE_IV}" }
      - { name: blinding_model, type: enum, source: input, description: "Blinding model of the trial", constraints: "one of {DOUBLE_BLIND, SINGLE_BLIND, OPEN_LABEL}" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "one of {DRAFT, ACTIVE, SUSPENDED, CLOSED}" }
      - { name: max_dose_per_visit_mg, type: integer, source: input, description: "Protocol maximum total dose per dispensing visit, in milligrams; dose check is quantity_dispensed * Lot.strength_mg <= max_dose_per_visit_mg" }
      - { name: unblinding_suspension_threshold_pct, type: integer, source: input, description: "Integrity threshold: when unblinded_subject_count * 100 >= threshold * randomized_subject_count and randomized_subject_count > 0, the study auto-suspends", default: 10 }
      - { name: randomized_subject_count, type: integer, source: computed, description: "Count of Subjects whose enrollment_status flipped to RANDOMIZED under this study (never decremented)", default: 0 }
      - { name: unblinded_subject_count, type: integer, source: computed, description: "Count of Subjects under this study whose blinded_status == UNBLINDED", default: 0 }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; owning study" }
      - { name: site_number, type: string, source: input, description: "Site identifier within the study", constraints: "unique per study" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: principal_investigator, type: string, source: input, description: "Principal investigator full name" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: INITIATED, constraints: "one of {INITIATED, ACTIVE, ON_HOLD, CLOSED}" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of the INITIATED->ACTIVE transition; null until first activation; used by the invoice setup-fee line" }

  - name: PharmacyStaff
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; home site of the staff member" }
      - { name: full_name, type: string, source: input, description: "Staff full name" }
      - { name: license_number, type: string, source: input, description: "Pharmacist license number", constraints: "unique across all staff" }
      - { name: is_unblinded, type: boolean, source: input, description: "True = unblinded staff (may decide/execute unblinding and see arm codes); false = blinded staff", default: false }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; owning study" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number", constraints: "unique per study" }
      - { name: product_name, type: string, source: input, description: "Investigational product name" }
      - { name: strength_mg, type: integer, source: input, description: "Strength per unit, milligrams" }
      - { name: dosage_form, type: string, source: input, description: "Dosage form, e.g. VIAL, TABLET" }
      - { name: expiry_date, type: datetime, source: input, description: "Lot expiry instant (UTC). A lot is expired when current logical clock >= expiry_date." }
      - { name: storage_temp_min_celsius, type: number, source: input, description: "Inclusive lower bound of allowed storage range; a reading == min is IN RANGE" }
      - { name: storage_temp_max_celsius, type: number, source: input, description: "Inclusive upper bound of allowed storage range; a reading == max is IN RANGE" }
      - { name: stability_budget_minutes, type: integer, source: input, description: "Cumulative excursion severity budget; lot is stability-exhausted when stability_minutes_consumed >= this budget" }
      - { name: stability_minutes_consumed, type: integer, source: computed, description: "Sum of excursion severity_minutes charged to this lot (charged on assess, reversed on void)", default: 0 }
      - { name: status, type: enum, source: system, description: "Lot lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, DEPLETED, EXPIRED, CLOSED}" }

  - name: Kit
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; source lot" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site where the kit is currently stored" }
      - { name: kit_number, type: string, source: input, description: "Kit label number", constraints: "unique per study (resolved via lot.study_id)" }
      - { name: status, type: enum, source: system, description: "Kit lifecycle status", default: IN_TRANSIT, constraints: "one of {IN_TRANSIT, QUARANTINED_RECEIPT, AVAILABLE, QUARANTINED_EXCURSION, ALLOCATED, DISPENSED, RETURNED, DESTRUCTION_PENDING, EXPIRED, DESTROYED}" }
      - { name: pre_quarantine_status, type: enum, source: system, description: "Status the kit held (AVAILABLE or ALLOCATED) before an excursion forced it into QUARANTINED_EXCURSION; used to restore on ACCEPTABLE assessment; null otherwise" }
      - { name: excursion_id, type: string, source: system, description: "FK -> TemperatureExcursion.id; excursion that quarantined this kit; null when not excursion-quarantined" }
      - { name: allocated_subject_id, type: string, source: system, description: "FK -> Subject.id; subject this kit is allocated to via randomization; null unless ALLOCATED" }
      - { name: units_received, type: integer, source: input, description: "Units shipped in this kit (from shipment units_per_kit)" }
      - { name: units_dispensed, type: integer, source: computed, description: "Cumulative units dispensed from this kit", default: 0 }
      - { name: units_returned, type: integer, source: computed, description: "Cumulative units returned against this kit", default: 0 }
      - { name: units_destroyed, type: integer, source: computed, description: "Units destroyed at destruction finalize", default: 0 }
      - { name: units_lost, type: integer, source: computed, description: "Signed discrepancy units booked at monitor-visit close (positive = missing, negative = overage)", default: 0 }
      - { name: on_hand_units, type: integer, source: computed, description: "Book on-hand balance: units_received - units_dispensed + units_returned - units_destroyed - units_lost" }

  - name: TemperatureLog
    parent: null
    common_fields: false
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; storage location read" }
      - { name: celsius, type: number, source: input, description: "Observed temperature" }
      - { name: source, type: enum, source: input, description: "Reading source", constraints: "one of {MANUAL, DATALOGGER}" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of the reading; set by the server, never client-supplied" }
      - { name: excursion_id, type: string, source: system, description: "FK -> TemperatureExcursion.id; set when this reading was out of range and opened/extended an excursion; null for in-range readings" }

  - name: TemperatureExcursion
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site whose storage went out of range" }
      - { name: status, type: enum, source: system, description: "Assessment lifecycle", default: OPEN, constraints: "one of {OPEN, RESOLVED_ACCEPTABLE, RESOLVED_UNACCEPTABLE, VOIDED}" }
      - { name: window_start, type: datetime, source: system, description: "Timestamp of the first out-of-range reading in this excursion" }
      - { name: window_end, type: datetime, source: system, description: "Timestamp of the most recent out-of-range reading linked to this excursion (extended while OPEN)" }
      - { name: min_observed_celsius, type: number, source: computed, description: "Minimum celsius across linked out-of-range readings" }
      - { name: max_observed_celsius, type: number, source: computed, description: "Maximum celsius across linked out-of-range readings" }
      - { name: severity_minutes_charged, type: integer, source: computed, description: "Severity minutes computed and charged to affected lots at assessment (see excursion_severity_minutes calculation)", default: 0 }
      - { name: resolution_rationale, type: string, source: input, description: "Assessor rationale; required on assess" }
      - { name: reference_temp_min_celsius, type: number, source: system, description: "Storage-range snapshot used for severity math: min over the affected kits' lots" }
      - { name: reference_temp_max_celsius, type: number, source: system, description: "Storage-range snapshot used for severity math: max over the affected kits' lots" }

  - name: Subject
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; enrolling site" }
      - { name: subject_number, type: string, source: input, description: "Subject identifier within the site", constraints: "unique per site" }
      - { name: stratum, type: enum, source: input, description: "Randomization stratum", constraints: "one of {STANDARD, HIGH_RISK}" }
      - { name: enrollment_status, type: enum, source: system, description: "Enrollment axis (parallel dimension 1)", default: SCREENING, constraints: "one of {SCREENING, SCREEN_FAILED, RANDOMIZED, COMPLETED, WITHDRAWN}" }
      - { name: blinded_status, type: enum, source: system, description: "Blinding axis (parallel dimension 2)", default: BLINDED, constraints: "one of {BLINDED, UNBLINDED}" }
      - { name: rescreen_count, type: integer, source: system, description: "Number of SCREEN_FAILED->SCREENING rescreens performed; hard cap 1", default: 0 }
      - { name: randomized_at, type: datetime, source: system, description: "Logical-clock timestamp of randomization; null until RANDOMIZED; basis of visit windows" }

  - name: RandomizationSlot
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; owning study" }
      - { name: sequence_number, type: integer, source: input, description: "Allocation order within the stratum; selection is lowest sequence_number first, tie-break created_at ASC" }
      - { name: stratum, type: enum, source: input, description: "Stratum this slot serves", constraints: "one of {STANDARD, HIGH_RISK}" }
      - { name: kit_number, type: string, source: input, description: "Kit label number this slot assigns; resolved at randomize time to a Kit at the subject's site with status AVAILABLE" }
      - { name: arm_code, type: string, source: input, description: "Masked treatment arm code (e.g. TRT-A); visible only in responses to SponsorAdmin / UnblindedPharmacist; null-masked for other roles" }
      - { name: status, type: enum, source: system, description: "Slot lifecycle", default: UNASSIGNED, constraints: "one of {UNASSIGNED, ASSIGNED, RELEASED}" }
      - { name: assigned_subject_id, type: string, source: system, description: "FK -> Subject.id; subject that consumed this slot; null while UNASSIGNED" }

  - name: DispensingRecord
    parent: null
    common_fields: true
    fields:
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; recipient subject" }
      - { name: kit_id, type: string, source: input, description: "FK -> Kit.id; kit dispensed (must be ALLOCATED to this subject)" }
      - { name: visit_number, type: integer, source: input, description: "Protocol visit index; must equal (count of this subject's existing DispensingRecords) + 1" }
      - { name: quantity_dispensed, type: integer, source: input, description: "Units dispensed; >= 1" }
      - { name: dose_mg, type: integer, source: computed, description: "quantity_dispensed * Lot.strength_mg of the dispensed kit's lot" }
      - { name: dispensed_at, type: datetime, source: system, description: "Logical-clock timestamp of dispensing" }
      - { name: status, type: enum, source: system, description: "Accountability lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, RETURNED, RECONCILED}" }

  - name: DrugReturn
    parent: null
    common_fields: true
    fields:
      - { name: dispensing_record_id, type: string, source: input, description: "FK -> DispensingRecord.id; the dispensing being returned against (at most one DrugReturn per dispensing record)" }
      - { name: quantity_returned, type: integer, source: input, description: "Units returned; 1 <= quantity_returned <= DispensingRecord.quantity_dispensed" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", default: RECORDED, constraints: "one of {RECORDED, VERIFIED}" }
      - { name: recorded_by_staff_id, type: string, source: system, description: "X-User-ID of the recording Pharmacist (segregation-of-duties anchor; not an FK)" }
      - { name: verified_by_staff_id, type: string, source: system, description: "X-User-ID of the verifying Pharmacist; null until VERIFIED; must differ from recorded_by_staff_id" }

  - name: DestructionRecord
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> Kit.id; kit being destroyed (must be RETURNED or EXPIRED)" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; must equal the kit's site_id" }
      - { name: method, type: enum, source: input, description: "Destruction method", constraints: "one of {INCINERATION, CHEMICAL_NEUTRALIZATION, RETURN_TO_SPONSOR}" }
      - { name: facility_window_start, type: datetime, source: input, description: "Booked destruction-facility window start (closed interval)" }
      - { name: facility_window_end, type: datetime, source: input, description: "Booked destruction-facility window end (closed interval); must be > start" }
      - { name: quantity_destroyed, type: integer, source: input, description: "Units destroyed; MUST equal the kit's current on-hand book balance units_received - units_dispensed + units_returned" }
      - { name: witness_staff_id, type: string, source: input, description: "FK -> PharmacyStaff.id; designated witness; must be a staff member at the same site" }
      - { name: created_by_staff_id, type: string, source: system, description: "X-User-ID of the creating Pharmacist (segregation anchor; not an FK)" }
      - { name: kit_prior_status, type: enum, source: system, description: "Kit status before DESTRUCTION_PENDING (RETURNED or EXPIRED); restored on VOID" }
      - { name: status, type: enum, source: system, description: "Destruction lifecycle", default: DRAFT, constraints: "one of {DRAFT, WITNESSED, FINALIZED, VOIDED}" }

  - name: UnblindingRequest
    parent: null
    common_fields: true
    fields:
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; subject to unblind (must be RANDOMIZED and BLINDED)" }
      - { name: reason, type: string, source: input, description: "Clinical justification for emergency unblinding" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requesting Investigator (opaque; segregation anchor)" }
      - { name: status, type: enum, source: system, description: "Approval lifecycle", default: REQUESTED, constraints: "one of {REQUESTED, APPROVED, REJECTED, EXECUTED}" }
      - { name: decided_by_staff_id, type: string, source: system, description: "X-User-ID of the deciding UnblindedPharmacist; null until decided" }
      - { name: revealed_arm_code, type: string, source: system, description: "Arm code revealed at EXECUTED; null before; visible only to SponsorAdmin / UnblindedPharmacist (masked null for others)" }

  - name: MonitorVisit
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; visited site" }
      - { name: monitor_name, type: string, source: input, description: "CRA full name (free text; Monitor role is opaque)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Visit window start (half-open interval [start, end))" }
      - { name: scheduled_end, type: datetime, source: input, description: "Visit window end; must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "Visit lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, IN_PROGRESS, CLOSED_RECONCILED, CLOSED_DISCREPANCY}" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp of start; null until IN_PROGRESS" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close; null until closed" }
      - { name: actual_minutes, type: integer, source: computed, description: "closed_at - started_at in whole minutes; null until closed; feeds invoice monitoring line (FINAL variant)" }
      - { name: discrepancy_count, type: integer, source: computed, description: "Number of counted kits whose physical count differed from book balance at close", default: 0 }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; study this fee schedule prices" }
      - { name: status, type: enum, source: system, description: "Approval lifecycle", default: DRAFT, constraints: "one of {DRAFT, APPROVED, SUPERSEDED}" }
      - { name: setup_fee_cents, type: integer, source: input, description: "One-time site setup fee, charged in the period containing Site.activated_at" }
      - { name: dispensing_fee_cents, type: integer, source: input, description: "Per-dispensing fee while the subject's cumulative dispensing index <= dispensing_tier_threshold" }
      - { name: dispensing_tier_threshold, type: integer, source: input, description: "Cumulative per-subject dispensing index at/under which dispensing_fee_cents applies; above it dispensing_tier_fee_cents applies" }
      - { name: dispensing_tier_fee_cents, type: integer, source: input, description: "Per-dispensing fee above the tier threshold" }
      - { name: monitoring_fee_cents_per_hour, type: integer, source: input, description: "Hourly CRA monitoring rate" }
      - { name: storage_fee_cents_per_kit_month, type: integer, source: input, description: "Storage fee per kit per invoiced period" }
      - { name: unblinding_fee_cents, type: integer, source: input, description: "Fee per emergency unblinding request counted by variant rules" }
      - { name: overhead_pct, type: number, source: input, description: "Percentage overhead applied to the rounded line subtotal" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Study
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/studies/{id}/transition {to: ACTIVE}"
        actor: SponsorAdmin
        preconditions:
          - "At least one FeeSchedule for this study has status APPROVED (else ERR_NO_APPROVED_FEE_SCHEDULE)"
        side_effects:
          - "increments Study.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/studies/{id}/transition {to: SUSPENDED} OR system auto-suspension when unblinded_subject_count * 100 >= unblinding_suspension_threshold_pct * randomized_subject_count and randomized_subject_count > 0"
        actor: SponsorAdmin | system
        preconditions: []
        side_effects:
          - "every Site of this study with status ACTIVE transitions to ON_HOLD"
          - "increments Study.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/studies/{id}/transition {to: ACTIVE}"
        actor: SponsorAdmin
        preconditions:
          - "At least one FeeSchedule for this study has status APPROVED (else ERR_NO_APPROVED_FEE_SCHEDULE)"
        side_effects:
          - "increments Study.version by 1"
          - "note: sites are NOT auto-reactivated; each ON_HOLD site is resumed individually"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/studies/{id}/transition {to: CLOSED}"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["increments Study.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/studies/{id}/transition {to: CLOSED}"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["increments Study.version by 1"]

  - entity: Site
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: ACTIVE
        trigger: "POST /api/sites/{id}/transition {to: ACTIVE}"
        actor: SponsorAdmin
        preconditions:
          - "Site.study_id's Study.status == ACTIVE (else ERR_STUDY_NOT_ACTIVE)"
        side_effects:
          - "sets Site.activated_at to the current logical clock on the FIRST activation only (subsequent ON_HOLD->ACTIVE resumes do not overwrite it)"
          - "increments Site.version by 1"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /api/sites/{id}/transition {to: ON_HOLD} OR cascade from Study ACTIVE->SUSPENDED"
        actor: SponsorAdmin | system
        preconditions: []
        side_effects: ["increments Site.version by 1"]
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /api/sites/{id}/transition {to: ACTIVE}"
        actor: SponsorAdmin
        preconditions:
          - "Site.study_id's Study.status == ACTIVE (else ERR_STUDY_NOT_ACTIVE)"
        side_effects: ["increments Site.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/sites/{id}/transition {to: CLOSED}"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["increments Site.version by 1"]
      - from: ON_HOLD
        to: CLOSED
        trigger: "POST /api/sites/{id}/transition {to: CLOSED}"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["increments Site.version by 1"]

  - entity: Lot
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system recompute after any kit status mutation: when zero kits of this lot remain in usable states {QUARANTINED_RECEIPT, AVAILABLE, QUARANTINED_EXCURSION, ALLOCATED}"
        actor: system
        preconditions: []
        side_effects:
          - "if the lot's Study.status == ACTIVE and the affected site's Site.status == ACTIVE: auto-create a resupply of replacement Kits in status IN_TRANSIT for this lot at the affected site; replacement count == the number of kits that just left usable states in the triggering mutation; replacement kit_number = 'RS-' + lot_number + '-' + N where N is the 1-based count of resupply kits ever created for this lot"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/_ops/expiry_sweep when current logical clock >= Lot.expiry_date"
        actor: system
        preconditions: []
        side_effects:
          - "kits of this lot in {QUARANTINED_RECEIPT, AVAILABLE, QUARANTINED_EXCURSION, ALLOCATED} transition to EXPIRED"
      - from: DEPLETED
        to: CLOSED
        trigger: "POST /api/_ops/expiry_sweep when current logical clock >= Lot.expiry_date"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Kit
    initial_state: IN_TRANSIT
    terminal_states: [DESTROYED]
    transitions:
      - from: IN_TRANSIT
        to: QUARANTINED_RECEIPT
        trigger: "POST /api/kits/{id}/receive"
        actor: Pharmacist
        preconditions:
          - "Kit.site_id's Site.status in {INITIATED, ACTIVE, ON_HOLD} (else ERR_SITE_NOT_ACTIVE)"
          - "receipt storage_temp_celsius is within [lot.storage_temp_min_celsius, lot.storage_temp_max_celsius] inclusive"
        side_effects:
          - "creates a TemperatureLog for the kit's site with celsius = payload storage_temp_celsius, source = MANUAL"
          - "increments Kit.version by 1"
      - from: IN_TRANSIT
        to: QUARANTINED_EXCURSION
        trigger: "POST /api/kits/{id}/receive when receipt storage_temp_celsius is OUTSIDE the lot's inclusive range"
        actor: Pharmacist
        preconditions: []
        side_effects:
          - "creates the receipt TemperatureLog, which opens/extends an OPEN TemperatureExcursion for the site (see TemperatureLog trigger rules)"
          - "sets Kit.pre_quarantine_status = QUARANTINED_RECEIPT (a receipt-excursion kit was never released; on RESOLVED_ACCEPTABLE it returns to QUARANTINED_RECEIPT, not AVAILABLE)"
          - "sets Kit.excursion_id to the excursion id"
          - "increments Kit.version by 1"
      - from: QUARANTINED_RECEIPT
        to: AVAILABLE
        trigger: "POST /api/kits/{id}/release"
        actor: Pharmacist
        preconditions:
          - "Kit.lot_id's Lot.status == ACTIVE (else ERR_LOT_EXPIRED when EXPIRED, else ERR_INVALID_STATE)"
          - "current logical clock < Lot.expiry_date (else ERR_LOT_EXPIRED)"
          - "Lot.stability_minutes_consumed < Lot.stability_budget_minutes (else ERR_LOT_STABILITY_EXHAUSTED)"
          - "Kit.lot_id's Lot.study_id's Study.status == ACTIVE (else ERR_STUDY_NOT_ACTIVE)"
        side_effects: ["increments Kit.version by 1"]
      - from: AVAILABLE
        to: ALLOCATED
        trigger: "POST /api/subjects/{id}/randomize or POST /api/subjects/{id}/allocate-kit (slot-driven allocation)"
        actor: Pharmacist
        preconditions:
          - "see RandomizationSlot selection rules on the randomize endpoint"
        side_effects:
          - "sets Kit.allocated_subject_id to the randomized subject"
          - "increments Kit.version by 1"
      - from: ALLOCATED
        to: DISPENSED
        trigger: "POST /api/dispensing-records"
        actor: Pharmacist
        preconditions:
          - "see dispensing validations (kit allocated to subject, dose cap, visit window, lot not expired)"
        side_effects:
          - "Kit.units_dispensed += DispensingRecord.quantity_dispensed"
          - "recomputes Kit.on_hand_units"
          - "increments Kit.version by 1"
      - from: DISPENSED
        to: RETURNED
        trigger: "POST /api/returns"
        actor: Pharmacist
        preconditions: []
        side_effects:
          - "Kit.units_returned += DrugReturn.quantity_returned"
          - "recomputes Kit.on_hand_units"
          - "increments Kit.version by 1"
      - from: AVAILABLE
        to: QUARANTINED_EXCURSION
        trigger: "system cascade when a TemperatureLog for this kit's site is out of range for this kit's lot"
        actor: system
        preconditions: []
        side_effects:
          - "sets Kit.pre_quarantine_status = AVAILABLE"
          - "sets Kit.excursion_id to the opened/extended excursion id"
          - "increments Kit.version by 1"
      - from: ALLOCATED
        to: QUARANTINED_EXCURSION
        trigger: "system cascade when a TemperatureLog for this kit's site is out of range for this kit's lot"
        actor: system
        preconditions: []
        side_effects:
          - "sets Kit.pre_quarantine_status = ALLOCATED (subject allocation is PRESERVED through the excursion)"
          - "sets Kit.excursion_id to the opened/extended excursion id"
          - "increments Kit.version by 1"
      - from: QUARANTINED_EXCURSION
        to: AVAILABLE
        trigger: "system cascade on TemperatureExcursion RESOLVED_ACCEPTABLE when Kit.pre_quarantine_status == AVAILABLE"
        actor: system
        preconditions:
          - "Kit.lot_id's Lot.stability_minutes_consumed (after charging this excursion's severity) < Lot.stability_budget_minutes; if the charge makes consumed >= budget the kit is NOT restored and remains QUARANTINED_EXCURSION"
        side_effects:
          - "clears Kit.excursion_id and Kit.pre_quarantine_status"
          - "increments Kit.version by 1"
      - from: QUARANTINED_EXCURSION
        to: ALLOCATED
        trigger: "system cascade on TemperatureExcursion RESOLVED_ACCEPTABLE when Kit.pre_quarantine_status == ALLOCATED"
        actor: system
        preconditions:
          - "same stability-budget gate as the AVAILABLE restore"
        side_effects:
          - "clears Kit.excursion_id and Kit.pre_quarantine_status (allocated_subject_id retained)"
          - "increments Kit.version by 1"
      - from: QUARANTINED_EXCURSION
        to: QUARANTINED_RECEIPT
        trigger: "system cascade on TemperatureExcursion RESOLVED_ACCEPTABLE when Kit.pre_quarantine_status == QUARANTINED_RECEIPT (receipt-excursion kits)"
        actor: system
        preconditions:
          - "same stability-budget gate as the AVAILABLE restore"
        side_effects:
          - "clears Kit.excursion_id and Kit.pre_quarantine_status"
          - "increments Kit.version by 1"
      - from: QUARANTINED_EXCURSION
        to: DESTRUCTION_PENDING
        trigger: "system cascade on TemperatureExcursion RESOLVED_UNACCEPTABLE"
        actor: system
        preconditions: []
        side_effects:
          - "sets Kit.kit_prior_status equivalent via DestructionRecord-free flag: records pre_quarantine_status cleared, excursion_id retained for audit"
          - "triggers Lot usable-count recompute (may flip Lot ACTIVE->DEPLETED and auto-create resupply)"
          - "increments Kit.version by 1"
      - from: RETURNED
        to: DESTRUCTION_PENDING
        trigger: "POST /api/destruction-records"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: EXPIRED
        to: DESTRUCTION_PENDING
        trigger: "POST /api/destruction-records"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: DESTRUCTION_PENDING
        to: RETURNED
        trigger: "system cascade on DestructionRecord DRAFT->VOIDED when kit_prior_status == RETURNED"
        actor: system
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: DESTRUCTION_PENDING
        to: EXPIRED
        trigger: "system cascade on DestructionRecord DRAFT->VOIDED when kit_prior_status == EXPIRED"
        actor: system
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: DESTRUCTION_PENDING
        to: DESTROYED
        trigger: "system cascade on DestructionRecord WITNESSED->FINALIZED"
        actor: system
        preconditions: []
        side_effects:
          - "Kit.units_destroyed = DestructionRecord.quantity_destroyed"
          - "recomputes Kit.on_hand_units (must reach 0)"
          - "triggers Lot usable-count recompute (DEPLETED check)"
          - "increments Kit.version by 1"
      - from: QUARANTINED_RECEIPT
        to: EXPIRED
        trigger: "system cascade on POST /api/_ops/expiry_sweep when clock >= lot expiry"
        actor: system
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system cascade on POST /api/_ops/expiry_sweep when clock >= lot expiry"
        actor: system
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: QUARANTINED_EXCURSION
        to: EXPIRED
        trigger: "system cascade on POST /api/_ops/expiry_sweep when clock >= lot expiry"
        actor: system
        preconditions: []
        side_effects: ["increments Kit.version by 1"]
      - from: ALLOCATED
        to: EXPIRED
        trigger: "system cascade on POST /api/_ops/expiry_sweep when clock >= lot expiry"
        actor: system
        preconditions: []
        side_effects: ["increments Kit.version by 1"]

  - entity: TemperatureExcursion
    initial_state: OPEN
    terminal_states: [RESOLVED_ACCEPTABLE, RESOLVED_UNACCEPTABLE, VOIDED]
    transitions:
      - from: OPEN
        to: RESOLVED_ACCEPTABLE
        trigger: "POST /api/temperature-excursions/{id}/assess {outcome: ACCEPTABLE}"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "computes excursion_severity_minutes and sets severity_minutes_charged"
          - "for every DISTINCT lot among linked kits AND among kits at the site quarantined by this excursion: Lot.stability_minutes_consumed += severity_minutes_charged"
          - "linked kits restore per pre_quarantine_status (AVAILABLE/ALLOCATED/QUARANTINED_RECEIPT) EXCEPT kits whose lot is stability-exhausted after the charge (consumed >= budget) — those remain QUARANTINED_EXCURSION"
          - "triggers Lot usable-count recompute"
          - "increments TemperatureExcursion.version by 1"
      - from: OPEN
        to: RESOLVED_UNACCEPTABLE
        trigger: "POST /api/temperature-excursions/{id}/assess {outcome: UNACCEPTABLE}"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "computes and charges severity minutes exactly as RESOLVED_ACCEPTABLE"
          - "every linked Kit transitions QUARANTINED_EXCURSION -> DESTRUCTION_PENDING"
          - "each such kit's Lot recomputes usable count; a lot reaching zero usable kits flips ACTIVE->DEPLETED and auto-creates the resupply shipment (see Lot machine)"
          - "increments TemperatureExcursion.version by 1"
      - from: RESOLVED_ACCEPTABLE
        to: VOIDED
        trigger: "POST /api/temperature-excursions/{id}/assess {outcome: VOID} (sponsor reversal of an acceptable assessment)"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "reverses the budget charge: each charged Lot.stability_minutes_consumed -= severity_minutes_charged (compensating invariant on stability minutes)"
          - "kits already restored stay restored (audit-preserving; no retroactive kit mutation)"
          - "increments TemperatureExcursion.version by 1"

  - entity: Subject
    initial_state: SCREENING
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      # --- enrollment axis ---
      - from: SCREENING
        to: SCREEN_FAILED
        trigger: "POST /api/subjects/{id}/transition {to: SCREEN_FAILED, reason}"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Subject.version by 1"]
      - from: SCREEN_FAILED
        to: SCREENING
        trigger: "POST /api/subjects/{id}/transition {to: SCREENING} (rescreen)"
        actor: Pharmacist
        preconditions:
          - "Subject.rescreen_count < 1 (else ERR_RESCREEN_LIMIT_EXCEEDED)"
        side_effects:
          - "Subject.rescreen_count += 1"
          - "increments Subject.version by 1"
      - from: SCREENING
        to: RANDOMIZED
        trigger: "POST /api/subjects/{id}/randomize"
        actor: Pharmacist
        preconditions:
          - "Subject.site_id's Site.status == ACTIVE (else ERR_SITE_NOT_ACTIVE)"
          - "site's Study.status == ACTIVE (else ERR_STUDY_NOT_ACTIVE)"
          - "an UNASSIGNED RandomizationSlot exists for this study with stratum == Subject.stratum (else ERR_NO_RANDOMIZATION_SLOT); selector: lowest sequence_number, tie-break created_at ASC"
          - "the selected slot's kit_number resolves to a Kit at the subject's site with status AVAILABLE; if the kit resolves but is QUARANTINED_EXCURSION the error is ERR_KIT_QUARANTINED_EXCURSION (safety, priority 7), any other non-AVAILABLE status gives ERR_SLOT_KIT_UNAVAILABLE (constraint, priority 9)"
          - "that kit's Lot is not expired at the current logical clock (else ERR_LOT_EXPIRED)"
        side_effects:
          - "sets Subject.randomized_at to the current logical clock"
          - "selected RandomizationSlot -> ASSIGNED with assigned_subject_id = subject"
          - "selected Kit AVAILABLE -> ALLOCATED with allocated_subject_id = subject"
          - "Study.randomized_subject_count += 1"
          - "increments Subject.version by 1"
      - from: RANDOMIZED
        to: COMPLETED
        trigger: "POST /api/subjects/{id}/transition {to: COMPLETED}"
        actor: Pharmacist
        preconditions:
          - "no DispensingRecord for this subject has status ACTIVE (else ERR_ACTIVE_DISPENSING_EXISTS)"
        side_effects: ["increments Subject.version by 1"]
      - from: RANDOMIZED
        to: WITHDRAWN
        trigger: "POST /api/subjects/{id}/transition {to: WITHDRAWN}"
        actor: Pharmacist
        preconditions:
          - "no DispensingRecord for this subject has status ACTIVE (else ERR_ACTIVE_DISPENSING_EXISTS)"
        side_effects: ["increments Subject.version by 1"]
      # --- blinding axis (parallel, independent of enrollment) ---
      - from: BLINDED
        to: UNBLINDED
        trigger: "system cascade on UnblindingRequest APPROVED->EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Study.unblinded_subject_count recomputed"
          - "if unblinded_subject_count * 100 >= Study.unblinding_suspension_threshold_pct * Study.randomized_subject_count and randomized_subject_count > 0: Study ACTIVE -> SUSPENDED, which cascades every ACTIVE Site -> ON_HOLD"
          - "increments Subject.version by 1"

  - entity: RandomizationSlot
    initial_state: UNASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "system cascade on successful POST /api/subjects/{id}/randomize or POST /api/subjects/{id}/allocate-kit"
        actor: system
        preconditions: []
        side_effects:
          - "sets assigned_subject_id"
          - "increments RandomizationSlot.version by 1"
      - from: UNASSIGNED
        to: RELEASED
        trigger: "system cascade on POST /api/studies/{id}/randomization-slots/replace (prior UNASSIGNED slots are retired)"
        actor: system
        preconditions: []
        side_effects: ["increments RandomizationSlot.version by 1"]

  - entity: DispensingRecord
    initial_state: ACTIVE
    terminal_states: [RECONCILED]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "system cascade on POST /api/returns for this record"
        actor: system
        preconditions: []
        side_effects: ["increments DispensingRecord.version by 1"]
      - from: RETURNED
        to: RECONCILED
        trigger: "system cascade on POST /api/monitor-visits/{id}/close for a visit at this record's site, when the linked DrugReturn status == VERIFIED"
        actor: system
        preconditions: []
        side_effects: ["increments DispensingRecord.version by 1"]

  - entity: DrugReturn
    initial_state: RECORDED
    terminal_states: [VERIFIED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /api/returns/{id}/verify"
        actor: Pharmacist
        preconditions:
          - "X-User-ID != DrugReturn.recorded_by_staff_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets verified_by_staff_id = X-User-ID"
          - "increments DrugReturn.version by 1"

  - entity: DestructionRecord
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: WITNESSED
        trigger: "POST /api/destruction-records/{id}/attest"
        actor: Pharmacist
        preconditions:
          - "X-User-ID == DestructionRecord.witness_staff_id (else ERR_UNAUTHORIZED_ROLE)"
          - "X-User-ID != DestructionRecord.created_by_staff_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["increments DestructionRecord.version by 1"]
      - from: WITNESSED
        to: FINALIZED
        trigger: "POST /api/destruction-records/{id}/finalize"
        actor: Pharmacist
        preconditions: []
        side_effects:
          - "Kit DESTRUCTION_PENDING -> DESTROYED with units_destroyed = quantity_destroyed (see Kit machine; triggers Lot usable-count recompute)"
          - "increments DestructionRecord.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/destruction-records/{id}/attest {void: true} — sponsorless void by the creating pharmacist"
        actor: Pharmacist
        preconditions:
          - "X-User-ID == created_by_staff_id (only the creator may void a DRAFT; else ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "Kit DESTRUCTION_PENDING -> kit_prior_status"
          - "increments DestructionRecord.version by 1"

  - entity: UnblindingRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/unblinding-requests/{id}/decide {decision: APPROVED}"
        actor: UnblindedPharmacist
        preconditions:
          - "X-User-ID != requested_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets decided_by_staff_id = X-User-ID"
          - "increments UnblindingRequest.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/unblinding-requests/{id}/decide {decision: REJECTED}"
        actor: UnblindedPharmacist
        preconditions:
          - "X-User-ID != requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets decided_by_staff_id = X-User-ID"
          - "increments UnblindingRequest.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/unblinding-requests/{id}/execute"
        actor: UnblindedPharmacist
        preconditions:
          - "X-User-ID != decided_by_staff_id (approver may not execute — three-person rule; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets revealed_arm_code = the subject's ASSIGNED RandomizationSlot.arm_code"
          - "Subject.blinded_status BLINDED -> UNBLINDED (which recomputes Study.unblinded_subject_count and may auto-suspend the study, cascading ACTIVE sites to ON_HOLD)"
          - "increments UnblindingRequest.version by 1"

  - entity: MonitorVisit
    initial_state: SCHEDULED
    terminal_states: [CLOSED_RECONCILED, CLOSED_DISCREPANCY]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/monitor-visits/{id}/start"
        actor: Monitor
        preconditions:
          - "current logical clock within [scheduled_start, scheduled_end] inclusive (else ERR_OUTSIDE_VISIT_WINDOW)"
        side_effects:
          - "sets started_at to current logical clock"
          - "increments MonitorVisit.version by 1"
      - from: IN_PROGRESS
        to: CLOSED_RECONCILED
        trigger: "POST /api/monitor-visits/{id}/close when every counted kit's physical count equals its book balance"
        actor: Monitor
        preconditions:
          - "every DrugReturn for dispensing records at this site has status VERIFIED (else ERR_UNVERIFIED_RETURN_PENDING)"
          - "payload counts cover EVERY kit at this site in on-hand states {AVAILABLE, ALLOCATED, QUARANTINED_EXCURSION, EXPIRED, RETURNED, DESTRUCTION_PENDING} exactly once (else ERR_COUNT_INCOMPLETE)"
        side_effects:
          - "sets closed_at, actual_minutes = closed_at - started_at in whole minutes"
          - "for each counted kit: adjustment = book_on_hand - physical_units; if adjustment != 0, Kit.units_lost += adjustment and on_hand_units recomputed; discrepancy_count = number of nonzero adjustments (0 here)"
          - "all DispensingRecords at this site in RETURNED whose DrugReturn is VERIFIED -> RECONCILED"
          - "increments MonitorVisit.version by 1"
      - from: IN_PROGRESS
        to: CLOSED_DISCREPANCY
        trigger: "POST /api/monitor-visits/{id}/close when at least one counted kit's physical count differs from book balance"
        actor: Monitor
        preconditions:
          - "same as CLOSED_RECONCILED"
        side_effects:
          - "same adjustments as CLOSED_RECONCILED; discrepancy_count >= 1"
          - "increments MonitorVisit.version by 1"

  - entity: FeeSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/fee-schedules/{id}/approve {expected_study_version}"
        actor: SponsorAdmin
        preconditions:
          - "expected_study_version == current Study.version (OCC; else ERR_STALE_VERSION)"
        side_effects:
          - "any other FeeSchedule of the same study in APPROVED -> SUPERSEDED"
          - "increments Study.version by 1"
          - "increments FeeSchedule.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade when another FeeSchedule of the same study is approved"
        actor: system
        preconditions: []
        side_effects: ["increments FeeSchedule.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; serial-observable true races)
# =============================================================================
concurrency_rules:
  - rule_id: fee-schedule-approve-stale-study
    parent_entity: Study
    write_endpoint: "POST /api/fee-schedules/{id}/approve"
    occ_field: expected_study_version
    description: |
      Approving a FeeSchedule supersedes the currently APPROVED schedule of the
      study — a legitimate create-with-supersede. If the approving client carries
      an expected_study_version that no longer matches Study.version (e.g. another
      schedule was approved or the study transitioned since the client last read
      it), the approval is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slot-list-replace-stale-study
    parent_entity: Study
    write_endpoint: "POST /api/studies/{id}/randomization-slots/replace"
    occ_field: expected_study_version
    description: |
      Replacing a study's randomization slot list retires every UNASSIGNED slot
      and installs a new list — a legitimate supersede of the prior list. If the
      uploader's expected_study_version no longer matches Study.version, the
      replace is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kit_accountability_balance
    trigger: "on every mutation of Kit.units_dispensed / units_returned / units_destroyed / units_lost, and at monitor-visit close for every counted kit"
    algorithm: projection
    formula: |
      book_on_hand(kit) = kit.units_received
                          - kit.units_dispensed
                          + kit.units_returned
                          - kit.units_destroyed
                          - kit.units_lost
      At monitor-visit close, for each counted kit:
        adjustment = book_on_hand(kit) - physical_units_from_payload
        if adjustment != 0: kit.units_lost += adjustment   (signed; negative = overage)
      Conservation invariant: dispense(q) followed by return(q) leaves book_on_hand
      unchanged (units_dispensed += q then units_returned += q cancel exactly).
    input_set: "the single Kit's own counter fields; counters only ever mutate via the dispensing / return / destruction-finalize / monitor-close transitions"
    constants:
      DISCREPANCY_EPSILON: 0
    precision: "integer units; no rounding"
    variants:
      - name: book_balance
        when: "any read of Kit.on_hand_units outside a monitor visit"
        difference: "derived purely by replaying the kit's dispense/return/destruction/loss counters (projection over the event stream)"
      - name: physical_reconciliation
        when: "monitor-visit close with a counts[] payload"
        difference: "the monitor-supplied physical_units replaces the projected balance; the signed delta is booked into units_lost so the two variants agree after close — for identical counter data the two variants produce DIFFERENT on-hand numbers whenever a discrepancy exists"

  - name: excursion_severity_minutes
    trigger: "on TemperatureExcursion assessment (both ACCEPTABLE and UNACCEPTABLE outcomes charge the budget; VOID of RESOLVED_ACCEPTABLE reverses)"
    algorithm: threshold
    formula: |
      duration_minutes = (excursion.window_end - excursion.window_start) in whole minutes
      capped_duration    = min(duration_minutes, MAX_CREDITABLE_MINUTES)        # 1440
      below = excursion.min_observed_celsius < excursion.reference_temp_min_celsius
      above = excursion.max_observed_celsius > excursion.reference_temp_max_celsius
      side_multiplier = 4 if below and above else (3 if below else (2 if above else 0))
      peak_deviation_degrees = max(reference_min - min_observed if below else 0,
                                   max_observed - reference_max if above else 0)
      degree_band = max(1, ceil(peak_deviation_degrees / DEGREE_STEP))          # DEGREE_STEP = 2
      severity_minutes = capped_duration * side_multiplier * degree_band
      per affected lot: lot.stability_minutes_consumed += severity_minutes
      lot stability-exhausted iff lot.stability_minutes_consumed >= lot.stability_budget_minutes
    input_set: "the excursion's linked out-of-range TemperatureLogs (min/max/window) plus the reference storage range snapshot; the charge applies to every DISTINCT lot owning a kit linked to this excursion"
    constants:
      MAX_CREDITABLE_MINUTES: 1440
      DEGREE_STEP: 2
      MULT_BOTH_SIDES: 4
      MULT_BELOW_ONLY: 3
      MULT_ABOVE_ONLY: 2
    precision: "integer minutes; ceil is exact integer ceiling"
    variants: []

  - name: site_invoice_compute
    trigger: "GET /api/sites/{id}/invoice?period_start&period_end&variant"
    algorithm: tiered_pricing
    formula: |
      # Period is the half-open interval [period_start, period_end).
      fs = the study's FeeSchedule with status APPROVED (else ERR_NO_APPROVED_FEE_SCHEDULE)
      # Line 1 — setup:
      setup_cents = fs.setup_fee_cents if site.activated_at in [period_start, period_end) else 0
      # Line 2 — dispensing (per-subject chronological tiering):
      #   Take every DispensingRecord whose kit's site == site and dispensed_at in period.
      #   Per subject, order records by dispensed_at ASC, tie-break created_at ASC.
      #   The subject's n-th record (1-based) costs fs.dispensing_fee_cents if
      #   n <= fs.dispensing_tier_threshold else fs.dispensing_tier_fee_cents.
      dispensing_cents = sum over all such per-record fees
      # Line 3 — monitoring (ROUNDING ORDER PINNED: round each visit line, THEN sum):
      #   FINAL variant: visits with status in {CLOSED_RECONCILED, CLOSED_DISCREPANCY}
      #     and closed_at in period; minutes = visit.actual_minutes.
      #   PROVISIONAL variant: visits with status in {SCHEDULED, IN_PROGRESS,
      #     CLOSED_RECONCILED, CLOSED_DISCREPANCY} whose window overlaps the period;
      #     minutes = actual_minutes for closed visits, else
      #     (scheduled_end - scheduled_start) in whole minutes.
      #   per_visit_cents = round_half_up(fs.monitoring_fee_cents_per_hour * minutes / 60)
      monitoring_cents = sum of per_visit_cents          # per-line rounding, then sum
      # Line 4 — storage:
      #   kits in status {AVAILABLE, ALLOCATED, QUARANTINED_EXCURSION} at this site
      #   with kit.created_at < period_end (evaluated at read time; identical for
      #   both variants)
      storage_cents = fs.storage_fee_cents_per_kit_month * count(such kits)
      # Line 5 — unblinding:
      #   FINAL: UnblindingRequests of subjects at this site with status EXECUTED and
      #     updated_at (execution time) in period.
      #   PROVISIONAL: status in {APPROVED, EXECUTED} with updated_at in period.
      unblinding_cents = fs.unblinding_fee_cents * count(such requests)
      # Total (EVALUATION ORDER PINNED): lines are integer cents; overhead is
      # computed on the line subtotal, rounded half-up, then added.
      subtotal_cents = setup_cents + dispensing_cents + monitoring_cents + storage_cents + unblinding_cents
      overhead_cents = round_half_up(subtotal_cents * fs.overhead_pct / 100)
      total_cents    = subtotal_cents + overhead_cents
    input_set: "site, period bounds, variant; entity sets filtered exactly as per the per-line comments above (status filters are explicit enums)"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer cents; round_half_up; per-line rounding for monitoring fees is pinned BEFORE summation; overhead rounded half-up once on the subtotal"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL query param"
        difference: "monitoring line includes SCHEDULED/IN_PROGRESS visits at scheduled minutes; unblinding line includes APPROVED (not yet executed) requests"
      - name: FINAL
        when: "variant=FINAL query param"
        difference: "monitoring line counts only CLOSED_* visits at actual_minutes; unblinding line counts only EXECUTED requests — for identical site data the two variants differ whenever pipeline visits or approved-but-unexecuted unblindings exist"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the five declared roles; for entity_backed roles (Pharmacist/UnblindedPharmacist) X-User-ID MUST be the id of an existing PharmacyStaff, and the staff's is_unblinded flag MUST match the role (Pharmacist requires false, UnblindedPharmacist requires true)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the caller's role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body schema: required fields present, types correct, enum values in their declared sets, datetime strings parseable; window fields satisfy start < end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "path-template ids and body FK references resolve to existing entities, validated left-to-right (ERR_STUDY_NOT_FOUND / ERR_SITE_NOT_FOUND / ERR_KIT_NOT_FOUND / ERR_SUBJECT_NOT_FOUND for those four; ERR_NOT_FOUND for all other entity types)"
    error_id: ERR_STUDY_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target entity is in a state that permits the requested transition/action per its state machine (ERR_STUDY_NOT_ACTIVE, ERR_SITE_NOT_ACTIVE, ERR_KIT_NOT_RELEASABLE, ERR_KIT_NOT_DISPENSABLE, ERR_SUBJECT_NOT_RANDOMIZABLE, ERR_SUBJECT_NOT_RANDOMIZED, ERR_ALREADY_TERMINAL, ERR_EXCURSION_ALREADY_RESOLVED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_study_version == Study.version on fee-schedule approve and randomization-slots replace"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /api/fee-schedules/{id}/approve", "POST /api/studies/{id}/randomization-slots/replace"]
  - priority: 7
    category: business_safety
    check: "pharmaceutical safety gates: dispense dose cap (quantity * lot.strength_mg <= study.max_dose_per_visit_mg else ERR_DOSE_EXCEEDS_PROTOCOL_MAX); lot not expired at clock (ERR_LOT_EXPIRED); randomize/allocate whose selected slot kit is excursion-quarantined (ERR_KIT_QUARANTINED_EXCURSION); lot stability budget not exhausted on release (ERR_LOT_STABILITY_EXHAUSTED); unblinding only on blinded studies (ERR_STUDY_OPEN_LABEL)"
    error_id: ERR_DOSE_EXCEEDS_PROTOCOL_MAX
    http_status: 422
    applies_to: ["POST /api/dispensing-records", "POST /api/kits/{id}/release", "POST /api/subjects/{id}/randomize", "POST /api/unblinding-requests"]
  - priority: 8
    category: business_temporal
    check: "temporal gates: dispense clock within visit window [randomized_at + 28*(visit_number-1) - 3d, + 3d] (ERR_VISIT_WINDOW_VIOLATION); monitor-visit start within scheduled window (ERR_OUTSIDE_VISIT_WINDOW); monitor-visit half-open overlap at site (ERR_MONITOR_VISIT_OVERLAP); destruction facility windows closed-interval + 30-minute buffer at site (ERR_DESTRUCTION_WINDOW_CONFLICT)"
    error_id: ERR_VISIT_WINDOW_VIOLATION
    http_status: 422
    applies_to: ["POST /api/dispensing-records", "POST /api/monitor-visits/{id}/start", "POST /api/monitor-visits", "POST /api/destruction-records"]
  - priority: 9
    category: business_constraint
    check: "uniqueness and capacity: Study.protocol_number unique (ERR_DUPLICATE_PROTOCOL_NUMBER); kit_number unique per study within a shipment and against existing kits (ERR_DUPLICATE_KIT_NUMBER); site_number unique per study and subject_number unique per site and license_number unique (ERR_INVALID_REQUEST); rescreen cap rescreen_count < 1 (ERR_RESCREEN_LIMIT_EXCEEDED); randomization slot availability (ERR_NO_RANDOMIZATION_SLOT); slot kit resolvable & AVAILABLE (ERR_SLOT_KIT_UNAVAILABLE); visit_number sequential (ERR_VISIT_OUT_OF_SEQUENCE)"
    error_id: ERR_DUPLICATE_PROTOCOL_NUMBER
    http_status: 409
    applies_to: ["POST /api/studies", "POST /api/shipments", "POST /api/sites", "POST /api/subjects", "POST /api/staff", "POST /api/subjects/{id}/transition", "POST /api/subjects/{id}/randomize", "POST /api/dispensing-records"]
  - priority: 10
    category: business_referential
    check: "referential/segregation gates: dispense kit must be ALLOCATED to the subject (ERR_KIT_NOT_DISPENSABLE); return quantity 1..quantity_dispensed and one return per dispensing record (ERR_QUANTITY_MISMATCH); verify/attest/decide/execute segregation-of-duties actor checks (ERR_SEGREGATION_OF_DUTIES); destruction site matches kit site and witness is staff of that site (ERR_INVALID_REQUEST); destruction quantity_destroyed equals kit book on-hand (ERR_QUANTITY_MISMATCH); subject completion/withdrawal blocked while a dispensing is ACTIVE (ERR_ACTIVE_DISPENSING_EXISTS); monitor close requires all site returns VERIFIED (ERR_UNVERIFIED_RETURN_PENDING) and complete kit counts (ERR_COUNT_INCOMPLETE); study activation requires an APPROVED FeeSchedule (ERR_NO_APPROVED_FEE_SCHEDULE)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /api/dispensing-records", "POST /api/returns", "POST /api/returns/{id}/verify", "POST /api/destruction-records", "POST /api/destruction-records/{id}/attest", "POST /api/unblinding-requests/{id}/decide", "POST /api/unblinding-requests/{id}/execute", "POST /api/subjects/{id}/transition", "POST /api/monitor-visits/{id}/close", "POST /api/studies/{id}/transition"]
  - priority: 11
    category: business_fiscal
    check: "fiscal gates: invoice compute requires an APPROVED FeeSchedule for the site's study (ERR_NO_APPROVED_FEE_SCHEDULE)"
    error_id: ERR_NO_APPROVED_FEE_SCHEDULE
    http_status: 422
    applies_to: ["GET /api/sites/{id}/invoice"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Study ---
  - { method: POST, path: "/api/studies", description: "Create a study in DRAFT", roles: [SponsorAdmin], code: 201, input: [protocol_number, title, phase, blinding_model, max_dose_per_visit_mg, "unblinding_suspension_threshold_pct?"], output: Study, side_effects: ["Study created with status DRAFT, version 1"] }
  - { method: GET, path: "/api/studies", description: "List studies", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: ["status?", "limit?", "offset?"], output: "Study[]", side_effects: [] }
  - { method: GET, path: "/api/studies/{id}", description: "Get a study", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: [], output: Study, side_effects: [] }
  - { method: POST, path: "/api/studies/{id}/transition", description: "Study lifecycle transition {to: ACTIVE|SUSPENDED|CLOSED} per Study machine", roles: [SponsorAdmin], code: 200, input: [to], output: Study, side_effects: ["state transition per Study machine; suspend cascades ACTIVE sites to ON_HOLD; increments Study.version"] }
  # --- Site ---
  - { method: POST, path: "/api/sites", description: "Create a site in INITIATED", roles: [SponsorAdmin], code: 201, input: [study_id, site_number, name, principal_investigator], output: Site, side_effects: [] }
  - { method: GET, path: "/api/sites", description: "List sites (reverse-reachability for Site.study_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: ["study_id?", "status?", "limit?", "offset?"], output: "Site[]", side_effects: [] }
  - { method: GET, path: "/api/sites/{id}", description: "Get a site", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: [], output: Site, side_effects: [] }
  - { method: POST, path: "/api/sites/{id}/transition", description: "Site lifecycle transition {to: ACTIVE|ON_HOLD|CLOSED} per Site machine", roles: [SponsorAdmin], code: 200, input: [to], output: Site, side_effects: ["state transition per Site machine; first activation sets activated_at; increments Site.version"] }
  # --- PharmacyStaff ---
  - { method: POST, path: "/api/staff", description: "Create a pharmacy staff member", roles: [SponsorAdmin], code: 201, input: [site_id, full_name, license_number, "is_unblinded?"], output: PharmacyStaff, side_effects: [] }
  - { method: GET, path: "/api/staff", description: "List staff (reverse-reachability for PharmacyStaff.site_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist], code: 200, input: ["site_id?", "is_unblinded?", "limit?", "offset?"], output: "PharmacyStaff[]", side_effects: [] }
  - { method: GET, path: "/api/staff/{id}", description: "Get a staff member", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist], code: 200, input: [], output: PharmacyStaff, side_effects: [] }
  # --- Lot ---
  - { method: POST, path: "/api/lots", description: "Register a drug lot", roles: [SponsorAdmin], code: 201, input: [study_id, lot_number, product_name, strength_mg, dosage_form, expiry_date, storage_temp_min_celsius, storage_temp_max_celsius, stability_budget_minutes], output: Lot, side_effects: [] }
  - { method: GET, path: "/api/lots", description: "List lots (reverse-reachability for Lot.study_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["study_id?", "status?", "limit?", "offset?"], output: "Lot[]", side_effects: [] }
  - { method: GET, path: "/api/lots/{id}", description: "Get a lot", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: Lot, side_effects: [] }
  # --- Shipment / Kit ---
  - { method: POST, path: "/api/shipments", description: "Sponsor ships kits: creates one Kit per kit_number in IN_TRANSIT at the site (bulk; all-or-nothing on duplicate kit_number within the study)", roles: [SponsorAdmin], code: 201, input: [lot_id, site_id, kit_numbers, units_per_kit], output: "Kit[]", side_effects: ["creates Kits with units_received = units_per_kit; response array preserves the order of kit_numbers in the request payload"] }
  - { method: GET, path: "/api/kits", description: "List kits (reverse-reachability for Kit.lot_id / site_id / allocated_subject_id / excursion_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["lot_id?", "site_id?", "status?", "allocated_subject_id?", "excursion_id?", "limit?", "offset?"], output: "Kit[]", side_effects: [] }
  - { method: GET, path: "/api/kits/{id}", description: "Get a kit", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: Kit, side_effects: [] }
  - { method: POST, path: "/api/kits/{id}/receive", description: "Receive an IN_TRANSIT kit into receipt quarantine; records a receipt TemperatureLog; out-of-range receipt temperature routes the kit to QUARANTINED_EXCURSION instead", roles: [Pharmacist], code: 200, input: [storage_temp_celsius], output: Kit, side_effects: ["Kit IN_TRANSIT -> QUARANTINED_RECEIPT (or QUARANTINED_EXCURSION on out-of-range); creates TemperatureLog; may open/extend TemperatureExcursion"] }
  - { method: POST, path: "/api/kits/{id}/release", description: "Release a QUARANTINED_RECEIPT kit to AVAILABLE after review", roles: [Pharmacist], code: 200, input: [], output: Kit, side_effects: ["Kit QUARANTINED_RECEIPT -> AVAILABLE"] }
  # --- Temperature ---
  - { method: POST, path: "/api/temperature-logs", description: "Record a storage temperature reading; out-of-range readings open a new OPEN excursion (or extend the site's existing OPEN one) and cascade-quarantine affected kits", roles: [Pharmacist], code: 201, input: [site_id, celsius, source], output: TemperatureLog, side_effects: ["if celsius outside any stored lot's inclusive range at that site: create/extend TemperatureExcursion and quarantine kits per Kit machine"] }
  - { method: GET, path: "/api/temperature-logs", description: "List temperature logs (reverse-reachability for TemperatureLog.site_id / excursion_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["site_id?", "excursion_id?", "limit?", "offset?"], output: "TemperatureLog[]", side_effects: [] }
  - { method: GET, path: "/api/temperature-logs/{id}", description: "Get a temperature log", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: TemperatureLog, side_effects: [] }
  - { method: GET, path: "/api/temperature-excursions", description: "List excursions (reverse-reachability for TemperatureExcursion.site_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "TemperatureExcursion[]", side_effects: [] }
  - { method: GET, path: "/api/temperature-excursions/{id}", description: "Get an excursion", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: TemperatureExcursion, side_effects: [] }
  - { method: POST, path: "/api/temperature-excursions/{id}/assess", description: "Assess an excursion {outcome: ACCEPTABLE|UNACCEPTABLE|VOID}: charges stability budget, restores or dispositions kits per the TemperatureExcursion machine", roles: [SponsorAdmin], code: 200, input: [outcome, resolution_rationale], output: TemperatureExcursion, side_effects: ["severity charge to affected lots; kit restore or DESTRUCTION_PENDING cascade; Lot DEPLETED recompute + auto-resupply; VOID reverses the charge"] }
  # --- Subject & Randomization ---
  - { method: POST, path: "/api/subjects", description: "Register a subject in SCREENING / BLINDED", roles: [Pharmacist], code: 201, input: [site_id, subject_number, stratum], output: Subject, side_effects: [] }
  - { method: GET, path: "/api/subjects", description: "List subjects (reverse-reachability for Subject.site_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: ["site_id?", "enrollment_status?", "blinded_status?", "limit?", "offset?"], output: "Subject[]", side_effects: [] }
  - { method: GET, path: "/api/subjects/{id}", description: "Get a subject", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: [], output: Subject, side_effects: [] }
  - { method: POST, path: "/api/subjects/{id}/transition", description: "Subject enrollment transitions {to: SCREEN_FAILED|SCREENING|COMPLETED|WITHDRAWN, reason?} per Subject machine", roles: [Pharmacist], code: 200, input: [to, "reason?"], output: Subject, side_effects: ["rescreen increments rescreen_count; terminal transitions blocked while ACTIVE dispensings exist"] }
  - { method: POST, path: "/api/subjects/{id}/randomize", description: "Randomize a SCREENING subject: selects the lowest-sequence UNASSIGNED slot for the subject's stratum (tie-break created_at ASC), assigns it, and allocates the slot's kit", roles: [Pharmacist], code: 200, input: [], output: Subject, side_effects: ["Subject SCREENING -> RANDOMIZED; RandomizationSlot -> ASSIGNED; Kit AVAILABLE -> ALLOCATED; Study.randomized_subject_count += 1"] }
  - { method: POST, path: "/api/subjects/{id}/allocate-kit", description: "Allocate the next kit to a RANDOMIZED subject for a subsequent visit: selects the lowest-sequence UNASSIGNED slot for the subject's stratum (tie-break created_at ASC), assigns it, allocates its AVAILABLE kit at the subject's site", roles: [Pharmacist], code: 200, input: [], output: Subject, side_effects: ["RandomizationSlot UNASSIGNED -> ASSIGNED; Kit AVAILABLE -> ALLOCATED with allocated_subject_id"] }
  - { method: POST, path: "/api/studies/{id}/randomization-slots/replace", description: "Replace a study's randomization list (OCC on expected_study_version): retires all UNASSIGNED slots to RELEASED and inserts the payload slots as UNASSIGNED; ASSIGNED slots untouched", roles: [SponsorAdmin], code: 200, input: [slots, expected_study_version], output: "RandomizationSlot[]", side_effects: ["prior UNASSIGNED slots -> RELEASED; increments Study.version by 1"] }
  - { method: GET, path: "/api/randomization-slots", description: "List slots (reverse-reachability for RandomizationSlot.study_id / kit linkage by kit_number / assigned_subject_id). arm_code is masked to null for roles other than SponsorAdmin and UnblindedPharmacist", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: ["study_id?", "status?", "stratum?", "assigned_subject_id?", "kit_number?", "limit?", "offset?"], output: "RandomizationSlot[]", side_effects: [] }
  - { method: GET, path: "/api/randomization-slots/{id}", description: "Get a slot (arm_code masked for blinded roles)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor, Investigator], code: 200, input: [], output: RandomizationSlot, side_effects: [] }
  # --- Dispensing / Return ---
  - { method: POST, path: "/api/dispensing-records", description: "Dispense an ALLOCATED kit to its subject at the current protocol visit", roles: [Pharmacist], code: 201, input: [subject_id, kit_id, visit_number, quantity_dispensed], output: DispensingRecord, side_effects: ["Kit ALLOCATED -> DISPENSED; Kit.units_dispensed += quantity_dispensed; record ACTIVE"] }
  - { method: GET, path: "/api/dispensing-records", description: "List dispensing records (reverse-reachability for DispensingRecord.subject_id / kit_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["subject_id?", "kit_id?", "status?", "limit?", "offset?"], output: "DispensingRecord[]", side_effects: [] }
  - { method: GET, path: "/api/dispensing-records/{id}", description: "Get a dispensing record", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: DispensingRecord, side_effects: [] }
  - { method: POST, path: "/api/returns", description: "Record a subject drug return against an ACTIVE dispensing record (one return per record)", roles: [Pharmacist], code: 201, input: [dispensing_record_id, quantity_returned], output: DrugReturn, side_effects: ["Kit DISPENSED -> RETURNED; Kit.units_returned += quantity_returned; DispensingRecord ACTIVE -> RETURNED; sets recorded_by_staff_id"] }
  - { method: GET, path: "/api/returns", description: "List returns (reverse-reachability for DrugReturn.dispensing_record_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["dispensing_record_id?", "status?", "limit?", "offset?"], output: "DrugReturn[]", side_effects: [] }
  - { method: GET, path: "/api/returns/{id}", description: "Get a return", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: DrugReturn, side_effects: [] }
  - { method: POST, path: "/api/returns/{id}/verify", description: "Verify a RECORDED return; verifier must differ from recorder (SoD)", roles: [Pharmacist], code: 200, input: [], output: DrugReturn, side_effects: ["DrugReturn RECORDED -> VERIFIED; sets verified_by_staff_id"] }
  # --- Destruction ---
  - { method: POST, path: "/api/destruction-records", description: "Book destruction of a RETURNED or EXPIRED kit into a facility window (closed-interval + 30-minute buffer conflict rule per site); quantity_destroyed must equal kit book on-hand", roles: [Pharmacist], code: 201, input: [kit_id, site_id, method, facility_window_start, facility_window_end, quantity_destroyed, witness_staff_id], output: DestructionRecord, side_effects: ["Kit -> DESTRUCTION_PENDING with kit_prior_status captured"] }
  - { method: GET, path: "/api/destruction-records", description: "List destruction records (reverse-reachability for DestructionRecord.kit_id / site_id / witness_staff_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["kit_id?", "site_id?", "witness_staff_id?", "status?", "limit?", "offset?"], output: "DestructionRecord[]", side_effects: [] }
  - { method: GET, path: "/api/destruction-records/{id}", description: "Get a destruction record", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: DestructionRecord, side_effects: [] }
  - { method: POST, path: "/api/destruction-records/{id}/attest", description: "Witness attestation {void: false} or creator void of a DRAFT {void: true}", roles: [Pharmacist], code: 200, input: ["void?"], output: DestructionRecord, side_effects: ["attest: DRAFT -> WITNESSED (witness only, != creator); void: DRAFT -> VOIDED (creator only), kit restored to kit_prior_status"] }
  - { method: POST, path: "/api/destruction-records/{id}/finalize", description: "Finalize a WITNESSED destruction: kit -> DESTROYED, units_destroyed booked, lot depletion recompute", roles: [Pharmacist], code: 200, input: [], output: DestructionRecord, side_effects: ["Kit DESTRUCTION_PENDING -> DESTROYED; Kit.units_destroyed set; Lot usable-count recompute may flip DEPLETED + auto-resupply"] }
  # --- Unblinding ---
  - { method: POST, path: "/api/unblinding-requests", description: "Investigator requests emergency unblinding of a RANDOMIZED, BLINDED subject", roles: [Investigator], code: 201, input: [subject_id, reason], output: UnblindingRequest, side_effects: ["sets requested_by_user_id"] }
  - { method: GET, path: "/api/unblinding-requests", description: "List unblinding requests (reverse-reachability for UnblindingRequest.subject_id); revealed_arm_code masked for blinded roles", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Investigator], code: 200, input: ["subject_id?", "status?", "limit?", "offset?"], output: "UnblindingRequest[]", side_effects: [] }
  - { method: GET, path: "/api/unblinding-requests/{id}", description: "Get an unblinding request (revealed_arm_code masked for blinded roles)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Investigator], code: 200, input: [], output: UnblindingRequest, side_effects: [] }
  - { method: POST, path: "/api/unblinding-requests/{id}/decide", description: "Unblinded pharmacist approves or rejects {decision: APPROVED|REJECTED}; decider != requester (SoD)", roles: [UnblindedPharmacist], code: 200, input: [decision], output: UnblindingRequest, side_effects: ["REQUESTED -> APPROVED/REJECTED; sets decided_by_staff_id"] }
  - { method: POST, path: "/api/unblinding-requests/{id}/execute", description: "Execute an APPROVED unblinding; executor != decider (three-person rule); reveals arm and cascades subject/study/site", roles: [UnblindedPharmacist], code: 200, input: [], output: UnblindingRequest, side_effects: ["APPROVED -> EXECUTED; reveals arm_code; Subject BLINDED -> UNBLINDED; possible Study auto-suspension -> Site ON_HOLD cascade"] }
  # --- Monitor visits ---
  - { method: POST, path: "/api/monitor-visits", description: "Schedule a monitor visit at a site (half-open interval; adjacency permitted; overlap rejected)", roles: [Monitor], code: 201, input: [site_id, monitor_name, scheduled_start, scheduled_end], output: MonitorVisit, side_effects: [] }
  - { method: GET, path: "/api/monitor-visits", description: "List monitor visits (reverse-reachability for MonitorVisit.site_id)", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "MonitorVisit[]", side_effects: [] }
  - { method: GET, path: "/api/monitor-visits/{id}", description: "Get a monitor visit", roles: [SponsorAdmin, Pharmacist, UnblindedPharmacist, Monitor], code: 200, input: [], output: MonitorVisit, side_effects: [] }
  - { method: POST, path: "/api/monitor-visits/{id}/start", description: "Start a SCHEDULED visit; logical clock must be within the scheduled window", roles: [Monitor], code: 200, input: [], output: MonitorVisit, side_effects: ["SCHEDULED -> IN_PROGRESS; sets started_at"] }
  - { method: POST, path: "/api/monitor-visits/{id}/close", description: "Close with physical counts [{kit_id, physical_units}]; reconciles book vs physical, books units_lost, reconciles verified dispensing records", roles: [Monitor], code: 200, input: [counts], output: MonitorVisit, side_effects: ["IN_PROGRESS -> CLOSED_RECONCILED | CLOSED_DISCREPANCY; units_lost adjustments; RETURNED+VERIFIED dispensing records -> RECONCILED"] }
  # --- Fee schedule & invoice ---
  - { method: POST, path: "/api/fee-schedules", description: "Create a fee schedule in DRAFT for a study", roles: [SponsorAdmin], code: 201, input: [study_id, setup_fee_cents, dispensing_fee_cents, dispensing_tier_threshold, dispensing_tier_fee_cents, monitoring_fee_cents_per_hour, storage_fee_cents_per_kit_month, unblinding_fee_cents, overhead_pct], output: FeeSchedule, side_effects: [] }
  - { method: GET, path: "/api/fee-schedules", description: "List fee schedules (reverse-reachability for FeeSchedule.study_id)", roles: [SponsorAdmin], code: 200, input: ["study_id?", "status?", "limit?", "offset?"], output: "FeeSchedule[]", side_effects: [] }
  - { method: GET, path: "/api/fee-schedules/{id}", description: "Get a fee schedule", roles: [SponsorAdmin], code: 200, input: [], output: FeeSchedule, side_effects: [] }
  - { method: POST, path: "/api/fee-schedules/{id}/approve", description: "Approve a DRAFT fee schedule (OCC on expected_study_version); supersedes the study's currently APPROVED schedule", roles: [SponsorAdmin], code: 200, input: [expected_study_version], output: FeeSchedule, side_effects: ["DRAFT -> APPROVED; prior APPROVED -> SUPERSEDED; increments Study.version by 1"] }
  - { method: GET, path: "/api/sites/{id}/invoice", description: "Computed pharmacy-services invoice for a period; variant=PROVISIONAL|FINAL per site_invoice_compute", roles: [SponsorAdmin], code: 200, input: [period_start, period_end, variant], output: "{ setup_fee_cents: integer, dispensing_fees_cents: integer, monitoring_fees_cents: integer, storage_fees_cents: integer, unblinding_fees_cents: integer, subtotal_cents: integer, overhead_cents: integer, total_cents: integer, variant: string }", side_effects: [] }
  # --- Test-driving / ops ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [SponsorAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["advances the logical clock used by expiry checks, visit windows, recorded_at/dispensed_at/started_at/closed_at stamps, and invoice windows"] }
  - { method: POST, path: "/api/_ops/expiry_sweep", description: "Ops checkpoint: expire kits/lots whose expiry_date <= logical clock; cascades per Lot/Kit machines including DEPLETED resupply", roles: [SponsorAdmin], code: 200, input: [], output: "{ kits_expired: integer, lots_expired: integer, resupply_kits_created: integer }", side_effects: ["kits in {QUARANTINED_RECEIPT, AVAILABLE, QUARANTINED_EXCURSION, ALLOCATED} whose lot's expiry_date <= clock -> EXPIRED; then each lot with expiry_date <= clock transitions ACTIVE -> EXPIRED; finally, for each lot left with zero kits in usable states {QUARANTINED_RECEIPT, AVAILABLE, QUARANTINED_EXCURSION, ALLOCATED} whose Study.status == ACTIVE and affected Site.status == ACTIVE: auto-create a resupply of replacement kits in IN_TRANSIT (count == kits of that lot/site expired by this sweep; kit_number = 'RS-' + lot_number + '-' + N continuing the lot's resupply sequence)"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, unknown role, or entity_backed role whose X-User-ID does not resolve to a PharmacyStaff with a matching is_unblinded flag" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list; also attestation by a non-witness or void by a non-creator" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, unparseable datetime, window start >= end, or duplicate site_number/subject_number/license_number" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "Study id in path or study_id FK does not exist" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "Site id in path or site_id FK does not exist" }
  - { id: ERR_KIT_NOT_FOUND, http: 404, condition: "Kit id in path or kit_id FK does not exist" }
  - { id: ERR_SUBJECT_NOT_FOUND, http: 404, condition: "Subject id in path or subject_id FK does not exist" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any other referenced entity (lot, staff, record, excursion, visit, fee schedule, slot) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition failure not covered by a domain-specific error" }
  - { id: ERR_STUDY_NOT_ACTIVE, http: 409, condition: "Operation requires Study.status == ACTIVE (kit release, randomize, site activation/resume, dispensing)" }
  - { id: ERR_SITE_NOT_ACTIVE, http: 409, condition: "Operation requires Site.status == ACTIVE (randomize) or a non-CLOSED site (receive)" }
  - { id: ERR_KIT_NOT_RELEASABLE, http: 409, condition: "Release attempted on a kit not in QUARANTINED_RECEIPT" }
  - { id: ERR_KIT_NOT_DISPENSABLE, http: 409, condition: "Dispense attempted on a kit not ALLOCATED to the given subject (wrong state or wrong subject)" }
  - { id: ERR_SUBJECT_NOT_RANDOMIZABLE, http: 409, condition: "Randomize attempted on a subject not in SCREENING" }
  - { id: ERR_SUBJECT_NOT_RANDOMIZED, http: 409, condition: "Dispense or unblinding attempted on a subject not in RANDOMIZED" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted on an entity in a terminal state (DESTROYED kit, CLOSED study/site, COMPLETED/WITHDRAWN subject, FINALIZED/VOIDED destruction, terminal visit)" }
  - { id: ERR_EXCURSION_ALREADY_RESOLVED, http: 409, condition: "Assess attempted on an excursion not in OPEN (except VOID from RESOLVED_ACCEPTABLE)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_study_version does not match the study's current version (OCC)" }
  - { id: ERR_LOT_EXPIRED, http: 422, condition: "Logical clock >= lot.expiry_date at release, randomize, or dispense time; or release of a kit whose lot is EXPIRED" }
  - { id: ERR_KIT_QUARANTINED_EXCURSION, http: 422, condition: "Dispense/randomize-use of a kit in QUARANTINED_EXCURSION" }
  - { id: ERR_LOT_STABILITY_EXHAUSTED, http: 422, condition: "Release of a receipt-quarantined kit whose lot's stability_minutes_consumed >= stability_budget_minutes" }
  - { id: ERR_DOSE_EXCEEDS_PROTOCOL_MAX, http: 422, condition: "quantity_dispensed * lot.strength_mg > study.max_dose_per_visit_mg" }
  - { id: ERR_STUDY_OPEN_LABEL, http: 422, condition: "Unblinding requested on an OPEN_LABEL study (nothing to unblind)" }
  - { id: ERR_VISIT_WINDOW_VIOLATION, http: 422, condition: "Dispense clock outside [randomized_at + 28*(visit_number-1) - 3 days, + 3 days]" }
  - { id: ERR_VISIT_OUT_OF_SEQUENCE, http: 422, condition: "visit_number != (existing dispensing count for the subject) + 1" }
  - { id: ERR_OUTSIDE_VISIT_WINDOW, http: 422, condition: "Monitor-visit start attempted with logical clock outside [scheduled_start, scheduled_end]" }
  - { id: ERR_MONITOR_VISIT_OVERLAP, http: 409, condition: "New visit's half-open [start, end) intersects an existing non-terminal visit at the same site; adjacency (start == other end) is allowed" }
  - { id: ERR_DESTRUCTION_WINDOW_CONFLICT, http: 409, condition: "New destruction window (closed interval) intersects, or falls within 30 minutes after, another non-VOIDED destruction window at the same site" }
  - { id: ERR_NO_RANDOMIZATION_SLOT, http: 422, condition: "No UNASSIGNED slot exists for the subject's stratum at randomize time" }
  - { id: ERR_SLOT_KIT_UNAVAILABLE, http: 422, condition: "Selected slot's kit_number does not resolve to an AVAILABLE kit at the subject's site" }
  - { id: ERR_DUPLICATE_PROTOCOL_NUMBER, http: 409, condition: "Study creation with an existing protocol_number" }
  - { id: ERR_DUPLICATE_KIT_NUMBER, http: 409, condition: "Shipment contains a kit_number already existing in the study or duplicated within the payload (all-or-nothing)" }
  - { id: ERR_RESCREEN_LIMIT_EXCEEDED, http: 422, condition: "Second rescreen attempt (rescreen_count already 1)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same actor attempted two segregated steps: return verify by recorder; destruction attest by creator; unblinding decide by requester; unblinding execute by decider" }
  - { id: ERR_QUANTITY_MISMATCH, http: 422, condition: "Return quantity out of 1..quantity_dispensed, second return for one dispensing record, or destruction quantity_destroyed != kit book on-hand" }
  - { id: ERR_UNVERIFIED_RETURN_PENDING, http: 422, condition: "Monitor-visit close while any DrugReturn at the site is still RECORDED" }
  - { id: ERR_COUNT_INCOMPLETE, http: 422, condition: "Monitor-visit close counts do not cover every on-hand kit at the site exactly once" }
  - { id: ERR_NO_APPROVED_FEE_SCHEDULE, http: 422, condition: "Study activation or invoice computation without an APPROVED fee schedule" }
  - { id: ERR_ACTIVE_DISPENSING_EXISTS, http: 422, condition: "Subject completion/withdrawal while a DispensingRecord is still ACTIVE" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SponsorAdmin
    description: "Sponsor-side operations: study/site/lot/staff administration, slot-list management, fee schedules, excursion assessment, clock and expiry ops, invoice reads"
    identity: opaque
    exclusive_operations: ["study/site/lot/staff/fee-schedule create + transitions", "shipments", "randomization-slots replace", "fee-schedule approve", "excursion assess", "invoice read", "clock set", "expiry sweep"]
    shared_operations: ["read access to all resources; arm codes unmasked"]
  - name: Pharmacist
    description: "Blinded investigational pharmacist at a site: receipt/release, temperature logs, subject registration and enrollment transitions, randomization, dispensing, returns, destruction"
    identity: "entity_backed:PharmacyStaff"
    exclusive_operations: ["kit receive/release", "temperature log creation", "subject create/transition/randomize", "dispense", "return create/verify", "destruction create/attest/finalize"]
    shared_operations: ["read access to site resources; arm codes masked"]
  - name: UnblindedPharmacist
    description: "Unblinded pharmacy staff: decides and executes emergency unblinding; the only operational role besides SponsorAdmin that can see arm codes"
    identity: "entity_backed:PharmacyStaff"
    exclusive_operations: ["unblinding decide", "unblinding execute"]
    shared_operations: ["read access to site resources; arm codes unmasked"]
  - name: Monitor
    description: "Clinical research associate performing drug-accountability reconciliation visits"
    identity: opaque
    exclusive_operations: ["monitor-visit create/start/close"]
    shared_operations: ["read access to site resources; arm codes masked"]
  - name: Investigator
    description: "Site investigator requesting emergency unblinding"
    identity: opaque
    exclusive_operations: ["unblinding-request create"]
    shared_operations: ["read access to subjects and unblinding requests; arm codes masked"]
