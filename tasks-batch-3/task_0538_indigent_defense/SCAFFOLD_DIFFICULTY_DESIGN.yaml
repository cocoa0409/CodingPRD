# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: case_weight_provisional_vs_actual
        grounds:
          - calculations.case_weight
          - state_machines.Case.SCREENED_to_ASSIGNED
          - state_machines.Case.ASSIGNED_to_ASSIGNED
          - entities.Case.fields.weight_basis
          - entities.Assignment.fields.assigned_weight
        distinguishing_aspect: "Identical MISDEMEANOR case yields provisional weight 1.0 at assignment but actual weight 2.0 after adjust-weight (COMPLEX x2 co-defendants) — dual-variant weighted_scoring on the Case domain."
        test_recipe:
          setup:
            - "Office; attorney (max_weighted_caseload 10.0); MISDEMEANOR case; eligible screening decided; CLEAR conflict check; case ASSIGNED with provisional case_weight 1.0."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-A", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Ada", attorney_type: "STAFF", bar_number: "B1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Dan", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 1000000, household_size: 2, asset_value_cents: 100000 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /cases/${c}/adjust-weight", payload: { complexity_tier: "COMPLEX", co_defendant_count: 2 }, as: AssignmentCoordinator, captures: { cw: $.data.case_weight } }
          assert:
            - "Assignment.${asg}.assigned_weight was 1.0 immediately after assignment (provisional variant)"
            - "Case.${c}.case_weight == 2.0 after adjust-weight (actual variant: 1.0*1.5 + 0.25*2)"
            - "Case.${c}.weight_basis == ACTUAL"
            - "Attorney.${att}.current_weighted_load == 2.0"

      - name: recoupment_schedule_vs_actual
        grounds:
          - calculations.recoupment_assessed
          - entities.DefenderOffice.fields.recoupment_basis
          - entities.RecoupmentOrder.fields.assessed_amount_cents
          - state_machines.Case.ASSIGNED_to_DISPOSED
        distinguishing_aspect: "Same PARTIAL case data disposed under a SCHEDULE office assesses 15000 (statutory flat) versus 50000 (means-based contribution) under an ACTUAL office — dual-variant aggregation on the RecoupmentOrder domain, a different entity than case_weight."
        test_recipe:
          setup:
            - "Two offices (SCHEDULE, ACTUAL); one MISDEMEANOR PARTIAL case each (income 3000000, size 2, asset 500000 -> contribution 50000); both assigned; SCHEDULE case already disposed."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-S", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { offS: $.data.id } }
            - { call: "POST /defender-offices", payload: { name: "PD-C", annual_voucher_budget_cents: 100000000, recoupment_basis: "ACTUAL" }, as: SupervisingAttorney, captures: { offA: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${offS}", name: "Sam", attorney_type: "PANEL", bar_number: "S1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { attS: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${offA}", name: "Cal", attorney_type: "PANEL", bar_number: "C1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { attA: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${offS}", defendant_name: "Sue", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cS: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${offA}", defendant_name: "Cid", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cA: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cS}", household_income_cents: 3000000, household_size: 2, asset_value_cents: 500000 }, as: IntakeClerk, captures: { scrS: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cA}", household_income_cents: 3000000, household_size: 2, asset_value_cents: 500000 }, as: IntakeClerk, captures: { scrA: $.data.id } }
            - { call: "POST /financial-screenings/${scrS}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /financial-screenings/${scrA}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${cS}", attorney_id: "${attS}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /conflict-checks", payload: { case_id: "${cA}", attorney_id: "${attA}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${cS}", attorney_id: "${attS}" }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${cA}", attorney_id: "${attA}" }, as: AssignmentCoordinator }
            - { call: "POST /cases/${cS}/dispose", payload: { disposition_type: "PLEA" }, as: AssignmentCoordinator }
          trigger:
            - { call: "POST /cases/${cA}/dispose", payload: { disposition_type: "PLEA" }, as: AssignmentCoordinator }
            - { call: "GET /recoupment-orders?case_id=${cS}", payload: {}, as: SupervisingAttorney, captures: { ro_s: "$.data[0].assessed_amount_cents" } }
            - { call: "GET /recoupment-orders?case_id=${cA}", payload: {}, as: SupervisingAttorney, captures: { ro_a: "$.data[0].assessed_amount_cents" } }
          assert:
            - "RecoupmentOrder for cS has assessed_amount_cents == 15000 (SCHEDULE: RECOUP_SCHEDULE[MISDEMEANOR])"
            - "RecoupmentOrder for cA has assessed_amount_cents == 50000 (ACTUAL: FinancialScreening.contribution_amount_cents)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: voucher_approved_amount_min_cap_branch
        grounds:
          - calculations.voucher_approved_amount
          - entities.Voucher.fields.approved_amount_cents
          - state_machines.Voucher.SUBMITTED_to_APPROVED
        distinguishing_aspect: "approved = min(round_half_up(claimed_hours*hourly_rate), CASE_FEE_CAP[charge_class] - prior) branches on voucher_type over >=3 inputs; 20h*15000=300000 is clamped to the 200000 MISDEMEANOR cap — mode (a) nested min/max."
        test_recipe:
          setup:
            - "Disposed MISDEMEANOR case; panel attorney (rate 15000); a PANEL_FEE voucher DRAFT with claimed_hours 20 then submitted."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-V", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Pat", attorney_type: "PANEL", bar_number: "P1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Dot", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 1000000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /cases/${c}/dispose", payload: { disposition_type: "CONVICTION" }, as: AssignmentCoordinator }
            - { call: "POST /vouchers", payload: { case_id: "${c}", attorney_id: "${att}", voucher_type: "PANEL_FEE", claimed_hours: 20 }, as: Attorney, as_user_id: "${att}", captures: { v: $.data.id } }
            - { call: "POST /vouchers/${v}/submit", payload: {}, as: Attorney, as_user_id: "${att}" }
          trigger:
            - { call: "POST /vouchers/${v}/approve", payload: {}, as: SupervisingAttorney, captures: { amt: $.data.approved_amount_cents } }
          assert:
            - "Voucher.${v}.approved_amount_cents == 200000 (min(300000 gross, 200000 cap))"
            - "Voucher.${v}.status == APPROVED"

      - name: financial_contribution_per_component_rounding
        grounds:
          - calculations.financial_contribution
          - entities.FinancialScreening.fields.contribution_amount_cents
          - state_machines.FinancialScreening.SUBMITTED_to_DECIDED
        distinguishing_aspect: "contribution = round_half_up(income_excess*0.10) + round_half_up(asset_excess*0.05) with per-component rounding pinned BEFORE summing yields 108333, not the sum-then-round 108334 — mode (b) rounding-order sensitivity, a different mode than the min/max voucher formula."
        test_recipe:
          setup:
            - "MISDEMEANOR case; screening size 2, income 3333333, asset 1000007 (PARTIAL: income_excess 833333, asset_excess 500007)."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-F", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Fin", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 3333333, household_size: 2, asset_value_cents: 1000007 }, as: IntakeClerk, captures: { scr: $.data.id } }
          trigger:
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1", captures: { contrib: $.data.contribution_amount_cents } }
          assert:
            - "FinancialScreening.${scr}.result == PARTIAL"
            - "FinancialScreening.${scr}.contribution_amount_cents == 108333 (83333 + 25000, each rounded first), NOT 108334"
            - "Case.${c}.status == SCREENED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: voucher_reject_revise_resubmit_cycle
        grounds:
          - state_machines.Voucher.SUBMITTED_to_REJECTED
          - state_machines.Voucher.REJECTED_to_DRAFT
          - state_machines.Voucher.DRAFT_to_SUBMITTED
          - state_machines.Voucher.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Voucher cycles REJECTED -> DRAFT -> SUBMITTED -> APPROVED, revisiting DRAFT/SUBMITTED after rejection — a genuine cycle on the Voucher entity, not a linear pipeline."
        test_recipe:
          setup:
            - "Disposed case; panel voucher SUBMITTED."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-R", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Rex", attorney_type: "PANEL", bar_number: "R1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Ray", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 1000000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /cases/${c}/dispose", payload: { disposition_type: "PLEA" }, as: AssignmentCoordinator }
            - { call: "POST /vouchers", payload: { case_id: "${c}", attorney_id: "${att}", voucher_type: "PANEL_FEE", claimed_hours: 5 }, as: Attorney, as_user_id: "${att}", captures: { v: $.data.id } }
            - { call: "POST /vouchers/${v}/submit", payload: {}, as: Attorney, as_user_id: "${att}" }
          trigger:
            - { call: "POST /vouchers/${v}/reject", payload: {}, as: SupervisingAttorney }
            - { call: "POST /vouchers/${v}/revise", payload: {}, as: Attorney, as_user_id: "${att}" }
            - { call: "POST /vouchers/${v}/submit", payload: {}, as: Attorney, as_user_id: "${att}" }
            - { call: "POST /vouchers/${v}/approve", payload: {}, as: SupervisingAttorney, captures: { st: $.data.status } }
          assert:
            - "After reject Voucher.${v}.status == REJECTED"
            - "After revise Voucher.${v}.status == DRAFT (approved_amount_cents reset to 0)"
            - "After re-submit Voucher.${v}.status == SUBMITTED"
            - "After approve Voucher.${v}.status == APPROVED (cycle re-entered SUBMITTED and terminated)"

      - name: case_eligibility_branch_screened_vs_denied
        grounds:
          - state_machines.Case.REFERRED_to_SCREENED
          - state_machines.Case.REFERRED_to_DENIED
          - calculations.eligibility_determination
          - entities.Case.fields.eligibility_status
        distinguishing_aspect: "The same decide trigger forks Case REFERRED -> SCREENED (eligible: counsel path, eligibility set) vs REFERRED -> DENIED (ineligible: terminal, no counsel) with disjoint side effects — branching on the Case entity, distinct from the Voucher cycle."
        test_recipe:
          setup:
            - "Two MISDEMEANOR cases; one screening eligible (income 800000), one ineligible (asset 5000000 > cap)."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-B", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Eli", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cE: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Ivy", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cD: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cE}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scrE: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cD}", household_income_cents: 800000, household_size: 2, asset_value_cents: 5000000 }, as: IntakeClerk, captures: { scrD: $.data.id } }
          trigger:
            - { call: "POST /financial-screenings/${scrE}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1", captures: { rE: $.data.result } }
            - { call: "POST /financial-screenings/${scrD}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1", captures: { rD: $.data.result } }
          assert:
            - "FinancialScreening.${scrE}.result == ELIGIBLE and Case.${cE}.status == SCREENED, eligibility_status == ELIGIBLE"
            - "FinancialScreening.${scrD}.result == INELIGIBLE and Case.${cD}.status == DENIED, eligibility_status == INELIGIBLE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispose_cascade_assignment_load_status_depth3
        grounds:
          - state_machines.Case.ASSIGNED_to_DISPOSED
          - state_machines.Assignment.ACTIVE_to_CLOSED
          - state_machines.Attorney.AT_CAPACITY_to_ACTIVE
          - calculations.attorney_weighted_load
        distinguishing_aspect: "One dispose chains three caused-by links: dispose -> Assignment CLOSED -> Attorney load decremented -> Attorney AT_CAPACITY reverts to ACTIVE (depth 3)."
        test_recipe:
          setup:
            - "Attorney max_weighted_caseload 4.0; one FELONY_A case (weight 4.0) assigned -> load 4.0, attorney status AT_CAPACITY."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-D", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Cap", attorney_type: "STAFF", bar_number: "D1", hourly_rate_cents: 15000, max_weighted_caseload: 4.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Fel", charge_class: "FELONY_A" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 500000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /cases/${c}/dispose", payload: { disposition_type: "DISMISSED" }, as: AssignmentCoordinator }
          assert:
            - "Before dispose: Attorney.${att}.current_weighted_load == 4.0, status == AT_CAPACITY"
            - "Assignment.${asg}.status == CLOSED (link1)"
            - "Attorney.${att}.current_weighted_load == 0.0 (link2)"
            - "Attorney.${att}.status == ACTIVE (link3)"

      - name: voucher_approve_cascade_budget_restricted_depth2
        grounds:
          - state_machines.Voucher.SUBMITTED_to_APPROVED
          - state_machines.DefenderOffice.OPEN_to_RESTRICTED
          - calculations.office_voucher_spent
          - entities.DefenderOffice.fields.budget_status
        distinguishing_aspect: "One voucher approve chains two caused-by links: approve -> office voucher_spent_cents += 187500 -> because spent exceeds 0.90*budget the office budget_status flips OPEN -> RESTRICTED (depth 2); a different originating trigger than dispose."
        test_recipe:
          setup:
            - "Office with small budget 200000; disposed case; panel voucher (12.5h @ 15000 -> 187500) SUBMITTED."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-T", annual_voucher_budget_cents: 200000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Ted", attorney_type: "PANEL", bar_number: "T1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Tom", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /cases/${c}/dispose", payload: { disposition_type: "PLEA" }, as: AssignmentCoordinator }
            - { call: "POST /vouchers", payload: { case_id: "${c}", attorney_id: "${att}", voucher_type: "PANEL_FEE", claimed_hours: 12.5 }, as: Attorney, as_user_id: "${att}", captures: { v: $.data.id } }
            - { call: "POST /vouchers/${v}/submit", payload: {}, as: Attorney, as_user_id: "${att}" }
          trigger:
            - { call: "POST /vouchers/${v}/approve", payload: {}, as: SupervisingAttorney }
          assert:
            - "Voucher.${v}.approved_amount_cents == 187500"
            - "DefenderOffice.${off}.voucher_spent_cents == 187500 (link1)"
            - "DefenderOffice.${off}.budget_status == RESTRICTED (link2: 187500 > 180000)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_state_beats_safety
        grounds:
          - "validations[priority=5]"
          - "validations[priority=7]"
          - "errors[ERR_CASE_NOT_SCREENED]"
          - "errors[ERR_CONFLICT_NOT_CLEARED]"
        distinguishing_aspect: "A POST /assignments where the case is REFERRED (not SCREENED, state, priority 5) AND no CLEAR ConflictCheck exists (business_safety, priority 7) returns ERR_CASE_NOT_SCREENED — state category wins over business_safety."
        test_recipe:
          setup:
            - "Referred case with NO decided screening (still REFERRED) and NO conflict check; ACTIVE attorney."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-P1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Ann", attorney_type: "STAFF", bar_number: "PP1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Pre", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_CASE_NOT_SCREENED (state priority 5 beats business_safety priority 7)"
            - "No Assignment is created for case ${c}"

      - name: courtevent_referential_beats_temporal
        grounds:
          - "validations[priority=6]"
          - "validations[priority=11]"
          - "errors[ERR_CASE_NOT_ASSIGNED]"
          - "errors[ERR_COURTROOM_DOUBLE_BOOKED]"
        distinguishing_aspect: "A POST /court-events for a case that is only SCREENED (not ASSIGNED, business_referential, priority 6) into a courtroom already booked for an overlapping interval (business_temporal, priority 11) returns ERR_CASE_NOT_ASSIGNED — a different category pair (referential vs temporal) than instance one."
        test_recipe:
          setup:
            - "caseA ASSIGNED with a SCHEDULED court event in room1 2026-06-10T09:00Z-10:00Z; caseB only SCREENED (never assigned)."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-P2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
