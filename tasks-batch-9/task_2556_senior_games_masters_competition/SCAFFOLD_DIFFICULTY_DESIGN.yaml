          DEPTH 4 ON THE REGISTRATION SPINE, triggered by POST /athletes/{athlete_id}/withdraw (a
          different trigger and a different chain than the venue-close cascade): link 1 sets
          Athlete.registration_status = WITHDRAWN, link 2 is caused by link 1 (SportEntry ACCEPTED
          -> WITHDRAWN), link 3 is caused by link 2 (SportEvent.accepted_entry_count 2 -> 1 drops
          below min_entries_to_stage 2 so the event moves OPEN -> UNDERSUBSCRIBED), link 4 is
          caused by link 3 (SessionSlot SCHEDULED -> RELEASED), and a parallel two-link branch
          cancels the athlete's VillageStay and rebates 5 bed-nights to the block ledger — while
