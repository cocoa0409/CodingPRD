              as: PermitSpecialist
          assert:
            - "before the trigger the assessment reads status PROVISIONAL, variant_applied PROVISIONAL_PER_REPORT, reported_agr_cents 1600050 and assessed_fee_cents 48002 — R2 is invisible to the money while SUBMITTED, which is exactly what makes the premature finalize look safe"
            - "the trigger returns ERR_USE_REPORTS_PENDING with HTTP 409 because ${r2_id} is still SUBMITTED for the same permit and season_year 2027"
            - "the refused finalize leaves the assessment in PROVISIONAL with finalized_at null and assessed_fee_cents unchanged at 48002, and leaves Permit.fee_delinquent as it was"
            - "after POST /osup/trip-use-reports/${r2_id}/accept the assessment recomputes under PROVISIONAL_PER_REPORT to reported_agr_cents 3000050 and assessed_fee_cents 90002 (48002 + 42000)"
