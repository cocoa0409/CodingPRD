  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_dimensions_independent
        grounds:
          - state_machines.Subscription.service_status
          - state_machines.Subscription.billing_status
        distinguishing_aspect: |
          Parallel state dimensions on Subscription (distinct entity from the cyclic
          WashBatch/Customer/Invoice machines): billing_status drifts CURRENT -> PAST_DUE ->
          CURRENT while service_status independently goes ACTIVE -> PAUSED, and each
          combination (ACTIVE/PAST_DUE, PAUSED/PAST_DUE, PAUSED/CURRENT) is observable.
        test_recipe:
          setup:
            - "ACTIVE STANDARD subscription in Z-NORTH; one invoice for 2026-08-03..2026-08-10 ISSUED at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Par Dim", email: "pd@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/invoices/generate", payload: { subscription_id: "${sub_id}", period_start: "2026-08-03", period_end: "2026-08-10" }, as: BillingAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /api/invoices/${inv_id}/events", payload: { event_type: "ISSUE" }, as: BillingAdmin }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/invoices/${inv_id}/events", payload: { event_type: "MARK_PAST_DUE" }, as: BillingAdmin, captures: { inv_status_1: $.data.status } }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { svc_1: $.data.service_status, bil_1: $.data.billing_status, sub_v: $.data.version } }
            - { call: "POST /api/service-pauses", payload: { subscription_id: "${sub_id}", start_date: "2026-08-18", end_date: "2026-08-22", expected_subscription_version: "${sub_v}" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T08:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { svc_2: $.data.service_status, bil_2: $.data.billing_status } }
            - { call: "POST /api/invoices/${inv_id}/events", payload: { event_type: "PAY" }, as: BillingAdmin }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { svc_3: $.data.service_status, bil_3: $.data.billing_status } }
          assert:
            - "after MARK_PAST_DUE at exactly issued_at + 14 days: service_status == ACTIVE and billing_status == PAST_DUE"
            - "after pause activation: service_status == PAUSED and billing_status == PAST_DUE (axes evolve independently)"
            - "after PAY: service_status == PAUSED and billing_status == CURRENT (payment axis moved; service axis untouched)"

      - name: washbatch_rewash_cycle
        grounds:
          - state_machines.WashBatch.WASHING_to_VALIDATING
          - state_machines.WashBatch.VALIDATING_to_WASHING
          - validations[priority=12]
        distinguishing_aspect: |
          Cyclic machine on WashBatch (distinct entity from Subscription): the
          WASHING -> VALIDATING -> WASHING rewash loop runs until rewash_count reaches the
          pinned formula.max_rewash_count (2), where the next REWASH is rejected with
          ERR_REWASH_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "RECONCILED intake (clean 80, scale 8000 g) loaded into a HEAVY/HARD batch on formula F-SANI (max_rewash_count 2); batch in WASHING started by op-1"
