              as_user_id: "${op_a}"
              captures: { x1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AALX2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:40:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { x2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AALX3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:50:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { x3: $.data.id }
            - call: "POST /atfm/facilities/${fac}/tmis"
