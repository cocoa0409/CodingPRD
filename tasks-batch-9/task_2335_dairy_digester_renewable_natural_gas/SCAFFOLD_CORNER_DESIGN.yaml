          rationale: "The 100-before-140 ordering with a payload that violates both rules is exactly the named §1.8 priority-precedence instance."

      - name: validation_biological_safety_outranks_the_hydraulic_ceiling
        claim_type: priority_ordering
        grounds:
          - validations[priority=130]
          - validations[priority=200]
        excluded_because:
          difficulty_instance: ppv_business_safety_facility_upset_wins_over_business_fiscal_hydraulic_capacity
          rationale: "The named §1.8 instance already pins ERR_FACILITY_UPSET ahead of ERR_HYDRAULIC_CAPACITY_EXCEEDED on a payload that breaches both."

