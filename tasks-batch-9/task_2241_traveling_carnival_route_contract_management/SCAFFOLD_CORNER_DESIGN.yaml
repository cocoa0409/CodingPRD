              captures: { route_c5: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_c5}", venue_id: "${ven_c5}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
