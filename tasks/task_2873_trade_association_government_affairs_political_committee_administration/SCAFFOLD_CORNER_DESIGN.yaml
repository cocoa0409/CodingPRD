      - name: state_gate_outranks_the_balance_gate_on_board_approval
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / board_approve_state_gate_beats_fund_balance_gate_rejected
          rationale: "That instance constructs a single call that violates priority 8 and priority 30 at once and asserts the 409 ERR_CONTRIBUTION_NOT_PENDING answer, together with the swap that yields the 422 when only the balance rule is broken."
      - name: registration_gate_outranks_the_position_gate_on_activity_logging
        claim_type: Priority Ordering
        grounds:
          - validations[priority=11]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / log_activity_registration_gate_beats_position_gate_rejected
          rationale: "That instance logs against a DRAFT registration and a non-ADOPTED position simultaneously and asserts ERR_REGISTRATION_NOT_ACTIVE, plus the single-violation control that yields ERR_POSITION_NOT_ADOPTED."
  - section: Endpoints
    instances:
      - name: registration_create_read_and_subresource_lists_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /advocacy/lobbying-registrations"]
          - endpoints["GET /advocacy/lobbying-registrations/{id}"]
          - endpoints["GET /advocacy/lobbying-registrations/{id}/activities"]
          - endpoints["GET /advocacy/lobbying-registrations/{id}/expenditure-reports"]
        distinguishing_aspect: "The registration aggregate has no update endpoint - the write surface is create plus four named transitions - so the CRUD claim is create, read-back, and two sub-resource lists that must return well-formed empty pages (total_count 0, has_more false) rather than 404 for a registration that simply has no children yet."
        test_recipe:
          setup:
            - "Empty database at the default logical clock 2026-08-01T00:00:00Z; no other registration exists for (FEDERAL, National Metals Association), so the priority-20 coverage-overlap rule cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Metals Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
            - call: "GET /advocacy/lobbying-registrations/${reg_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /advocacy/lobbying-registrations/${reg_id}/activities"
              payload: { limit: 50, offset: 0 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "GET /advocacy/lobbying-registrations/${reg_id}/expenditure-reports"
              payload: { limit: 50, offset: 0 }
              as: BoardTrustee
              as_user_id: "bt-1"
          assert:
            - "Create returns HTTP 201 with the success envelope and data.id a bare UUID; the four input fields echo back verbatim"
            - "Create response carries the declared defaults: status DRAFT, filed_at null, terminated_at null, amendment_round 0, ytd_reportable_cents 0, ytd_reportable_hours 0, version 1"
            - "GET /advocacy/lobbying-registrations/${reg_id} returns HTTP 200 with a payload byte-equal to the create response (no field drifted and updated_at did not move)"
            - "GET .../activities returns HTTP 200 with data == [] and total_count == 0 and has_more == false"
            - "GET .../expenditure-reports returns HTTP 200 with data == [] and total_count == 0 and has_more == false"
      - name: candidate_pac_contributions_lists_rows_from_every_fund
        claim_type: Cross-reference link
        grounds:
          - endpoints["GET /advocacy/candidates/{id}/pac-contributions"]
          - endpoints["GET /advocacy/segregated-funds/{id}/pac-contributions"]
          - entities.PacContribution
        distinguishing_aspect: "PacContribution links a fund to a candidate, and the same rows are reachable from both ends: the candidate list spans every fund that supported it, while each fund list shows only its own row - and the status filter narrows both without changing total_count semantics."
        test_recipe:
          setup:
            - "Two FEDERAL 2026 funds with min_reserve_cents 0 (posture OPEN, no receipts needed because the balance test only runs at board approval) and one FEDERAL INCUMBENT candidate with voting_alignment_pct 90.00 and committee_relevance_score 80, giving support_score 80.50 and max_allowed_cents 250000."
          setup_api_calls:
            - call: "POST /advocacy/segregated-funds"
              payload: { name: "NMA Federal PAC", fund_year: 2026, jurisdiction_code: "FEDERAL", min_reserve_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fund_a: $.data.id }
            - call: "POST /advocacy/segregated-funds"
              payload: { name: "NMA Federal PAC II", fund_year: 2026, jurisdiction_code: "FEDERAL", min_reserve_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fund_b: $.data.id }
            - call: "POST /advocacy/candidates"
              payload: { name: "Rep. Jane Alvarez", office: "US_HOUSE", jurisdiction_code: "FEDERAL", district_code: "CA-12", election_cycle: "2026-GENERAL", incumbency: "INCUMBENT", voting_alignment_pct: 90.00, committee_relevance_score: 80 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_a}", candidate_id: "${cand_id}", amount_cents: 50000, memo: "Committee-aligned incumbent, fund A" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib_a: $.data.id }
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_b}", candidate_id: "${cand_id}", amount_cents: 50000, memo: "Committee-aligned incumbent, fund B" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib_b: $.data.id }
            - call: "GET /advocacy/candidates/${cand_id}/pac-contributions"
              payload: { limit: 50, offset: 0 }
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "GET /advocacy/candidates/${cand_id}/pac-contributions"
              payload: { limit: 50, offset: 0, status: "DISBURSED" }
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "GET /advocacy/segregated-funds/${fund_a}/pac-contributions"
              payload: { limit: 50, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Both creates return HTTP 201 with support_score 80.50, max_allowed_cents 250000 and status PENDING_BOARD; memo is stored verbatim"
            - "GET /advocacy/candidates/${cand_id}/pac-contributions returns total_count == 2 with ids [${contrib_a}, ${contrib_b}] in created_at ASC order, spanning both funds"
            - "The same list filtered by status DISBURSED returns data == [] with total_count == 0 (the filter narrows the count, it does not report the unfiltered 2)"
            - "GET /advocacy/segregated-funds/${fund_a}/pac-contributions returns total_count == 1 with only ${contrib_a}, proving the link is scoped from the fund side"
            - "GET /advocacy/candidates/${cand_id}: pending_support_cents == 100000, aggregated across both funds, still under max_allowed_cents 250000"
      - name: filing_cycle_action_endpoint_charges_the_calendar_fee
