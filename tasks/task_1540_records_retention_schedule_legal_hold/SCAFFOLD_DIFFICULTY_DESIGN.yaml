  - rule_id: boundary_precision_check
    instances:
      - name: eligibility_at_exact_due_date
        grounds:
          - calculations.retention_due_date
          - calculations.disposition_posture
          - entities.Record.fields.disposition_posture
        distinguishing_aspect: |
          Timestamp boundary: at current_utc == retention_due_date exactly, the
          record is ELIGIBLE (inclusive >=); one second before it is RETAINED. The
          same boundary then drives a real destruction via the auto-delete sweep.
        test_recipe:
          setup:
            - "Clock pinned to 2026-07-31T23:59:59Z before any fixture"
            - "Program; class; jurisdiction; rule EVENT_DATE 1 month ACTIVE; record event 2026-07-01 -> due 2026-08-01T00:00:00Z; auto_delete_enabled default true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /ig/programs"
              payload: { name: "Boundary Program", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
