  - rule_id: transitive_cascade
    instances:
      - name: publication_cascade_determination_to_agreement_to_publisher
        grounds:
          - calculations.apc_coverage_determination
          - state_machines.TransformativeAgreement.ACTIVE_to_EXHAUSTED
          - state_machines.TransformativeAgreement.EXHAUSTED_to_ACTIVE
          - entities.TransformativeAgreement.fields.articles_used
          - entities.Publisher.fields.active_agreement_count
          - endpoints[POST /articles/{id}/publication]
        distinguishing_aspect: |
          One publication call propagates four hops on distinct entities — a new FINAL
          EligibilityDetermination row, TransformativeAgreement.articles_used 1 -> 0,
          TransformativeAgreement.status EXHAUSTED -> ACTIVE, and
          Publisher.active_agreement_count 0 -> 1 with Publisher.version incremented by
          exactly 1 — none of which the caller addressed directly.
        test_recipe:
          setup:
            - "logical clock at 2026-09-20T00:00:00Z"
            - "publisher MERID with one HYBRID journal at list_apc_cents 380000"
            - "ACTIVE agreement over [2026-07-01, 2026-12-01), article_quota 1, discount 0.25, covering HYBRID"
            - "FULL_APC coverage on the journal, closed window 2026-07-01..2026-09-30"
            - "article accepted 2026-09-15 whose PROVISIONAL determination consumed the single quota token, so the agreement is EXHAUSTED and active_agreement_count is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
