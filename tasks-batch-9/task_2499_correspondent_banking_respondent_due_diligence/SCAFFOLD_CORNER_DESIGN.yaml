      - name: assessing_a_draft_questionnaire_is_a_child_state_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - validations[priority=33]
          - state_machines.DueDiligenceQuestionnaire.state
        distinguishing_aspect: "ASSESS is declared only from UNDER_ASSESSMENT. A brand-new questionnaire is DRAFT and has zero ControlAssessment rows, so it violates both the child-state rule at priority 12 and the eight-domain completeness rule at priority 33; the lower priority number must win, returning 409 ERR_INVALID_QUESTIONNAIRE_STATE rather than 422 ERR_CONTROL_DOMAINS_INCOMPLETE."
        test_recipe:
          setup: ["A DD_IN_PROGRESS respondent with one freshly created questionnaire still in DRAFT and no control assessments."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
