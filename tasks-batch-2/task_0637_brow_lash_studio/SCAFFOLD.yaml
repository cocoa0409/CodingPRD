    input: []
    output: Membership
    side_effects: ["status->CANCELLED; linked ACTIVE RecurringFillSchedule -> ENDED; increments Membership.version by 1"]

  # ---- ConsentPatchTest (FK member_id) ----
  - method: POST
    path: "/patch-tests"
    description: "Record a patch test + consent"
    roles: [StudioManager, FrontDesk]
    code: 201
    input: [member_id, administered_utc, consent_signed]
    output: ConsentPatchTest
    side_effects: ["valid_through_utc = administered_utc + 365 days; status=VALID (requires consent_signed=true)"]

  - method: GET
    path: "/patch-tests"
    description: "List patch tests (filter by member_id) — filtered-list reverse-reachability for ConsentPatchTest.member_id"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "ConsentPatchTest[]"
    side_effects: []

  - method: GET
    path: "/patch-tests/{id}"
    description: "Get a patch test (status reflects auto-expiry vs current clock)"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: ConsentPatchTest
    side_effects: []

  - method: POST
    path: "/patch-tests/{id}/revoke"
    description: "Revoke consent"
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: ConsentPatchTest
    side_effects: ["status VALID->REVOKED"]

  # ---- Appointment (FK studio_id, member_id, service_type_id, membership_id, lash_tech_id, recurring_schedule_id) ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment (runs patch-test, fill-window, sanitation, overlap, membership, credit, OCC pipeline; assigns a tech). studio_id is taken from the referenced member."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, service_type_id, start_utc, "pay_with_credits?", "membership_id?", "expected_membership_version?"]
    output: Appointment
    side_effects:
      - "lash_tech_id assigned via calculations.lash_tech_assignment"
      - "end_utc = start_utc + duration_minutes; deposit_cents computed (0 if credits)"
      - "If pay_with_credits: OCC check, credit gate, CONSUME ledger entry, credits_charged set; increments Membership.version by 1"
      - "status=BOOKED"

  - method: GET
    path: "/appointments"
    description: "List appointments (filter by studio_id, member_id, lash_tech_id, service_type_id, membership_id, recurring_schedule_id) — FK reverse-reachability for all Appointment FKs"
    roles: [StudioManager, FrontDesk, LashTech, Member]
    code: 200
    input: ["studio_id?", "member_id?", "lash_tech_id?", "service_type_id?", "membership_id?", "recurring_schedule_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [StudioManager, FrontDesk, LashTech, Member]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/complete"
    description: "Mark an appointment COMPLETED"
    roles: [LashTech, StudioManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED->COMPLETED; member.last_premium_completed_utc recomputed if PREMIUM"]

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel an appointment (timely -> CANCELLED, within cutoff -> LATE_CANCELLED)"
    roles: [Member, FrontDesk, StudioManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["deposit_forfeiture; credit REFUND if credit-paid; recurring slot reclaim if timely cancel of a spawned fill"]

  - method: POST
    path: "/appointments/{id}/mark-no-show"
    description: "Mark an appointment NO_SHOW"
    roles: [FrontDesk, StudioManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["deposit_forfeited_cents=deposit_cents; no credit refund; member.noshow_strike_count recomputed; may cascade Membership->SUSPENDED"]

  - method: GET
    path: "/appointments/{id}/retail-orders"
    description: "List retail orders attached to an appointment (sub-resource) — FK reverse-reachability for RetailOrder.appointment_id"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "RetailOrder[]"
    side_effects: []

  # ---- RetailOrder (FK member_id, appointment_id) ----
  - method: POST
    path: "/retail-orders"
    description: "Create a retail/add-on order attached to a BOOKED appointment"
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, appointment_id, lines]
    output: RetailOrder
    side_effects: ["calculations.retail_order_total: subtotal (per-line discount+round then sum), peak_surcharge, total; status=PAID"]

  - method: GET
    path: "/retail-orders"
    description: "List retail orders (filter by member_id or appointment_id) — FK reverse-reachability for RetailOrder.member_id"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "appointment_id?", "limit?", "offset?"]
    output: "RetailOrder[]"
    side_effects: []

  - method: GET
    path: "/retail-orders/{id}"
    description: "Get a retail order"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: RetailOrder
    side_effects: []

  - method: POST
    path: "/retail-orders/{id}/void"
    description: "Void a retail order"
    roles: [StudioManager, FrontDesk]
    code: 200
    input: []
    output: RetailOrder
    side_effects: ["status PAID->VOIDED"]

  # ---- RecurringFillSchedule (FK member_id, service_type_id) ----
  - method: POST
    path: "/recurring-schedules"
    description: "Create a recurring fill schedule"
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, service_type_id, cadence_days, first_start_utc]
    output: RecurringFillSchedule
    side_effects: ["status=ACTIVE; next_due_utc=first_start_utc; spawned_count=0"]

  - method: GET
    path: "/recurring-schedules"
    description: "List recurring schedules (filter by member_id or service_type_id) — FK reverse-reachability for RecurringFillSchedule.member_id and .service_type_id"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "service_type_id?", "limit?", "offset?"]
    output: "RecurringFillSchedule[]"
    side_effects: []

  - method: GET
    path: "/recurring-schedules/{id}"
    description: "Get a recurring schedule"
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: RecurringFillSchedule
    side_effects: []

  - method: POST
    path: "/recurring-schedules/{id}/spawn-next"
    description: "Spawn the next FILL appointment in the series (full booking pipeline)"
    roles: [FrontDesk, StudioManager]
    code: 201
    input: [expected_membership_version]
    output: Appointment
    side_effects: ["new BOOKED FILL Appointment with recurring_schedule_id; CONSUME ledger entry; next_due_utc+=cadence_days; spawned_count+=1; increments Membership.version by 1"]

  - method: POST
    path: "/recurring-schedules/{id}/pause"
    description: "Pause a recurring schedule"
    roles: [Member, FrontDesk, StudioManager]
    code: 200
    input: []
    output: RecurringFillSchedule
    side_effects: ["status ACTIVE->PAUSED"]

  - method: POST
    path: "/recurring-schedules/{id}/resume"
    description: "Resume a paused schedule"
    roles: [Member, FrontDesk, StudioManager]
    code: 200
    input: []
    output: RecurringFillSchedule
    side_effects: ["status PAUSED->ACTIVE"]

  - method: POST
    path: "/recurring-schedules/{id}/end"
    description: "End a recurring schedule"
    roles: [Member, FrontDesk, StudioManager]
    code: 200
    input: []
    output: RecurringFillSchedule
    side_effects: ["status->ENDED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All fill-window, sanitation, deposit-cutoff, no-show-window, and patch-test-expiry rules read this clock."
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID/X-User-Role missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the operation, or entity-backed role acting on a resource it does not own" }
  # --- not found ---
  - { id: ERR_STUDIO_NOT_FOUND, http: 404, condition: "Studio in path does not exist" }
  - { id: ERR_SERVICE_TYPE_NOT_FOUND, http: 404, condition: "ServiceType referenced does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member referenced does not exist" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "Membership referenced does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment referenced does not exist" }
  - { id: ERR_TECH_NOT_FOUND, http: 404, condition: "LashTech referenced does not exist" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "RecurringFillSchedule referenced does not exist" }
  - { id: ERR_PATCH_TEST_NOT_FOUND, http: 404, condition: "ConsentPatchTest referenced does not exist" }
  # --- state ---
  - { id: ERR_APPOINTMENT_NOT_BOOKED, http: 409, condition: "complete/cancel/no-show on an appointment not in BOOKED" }
  - { id: ERR_APPOINTMENT_NOT_STARTED, http: 409, condition: "complete/no-show before current clock reaches start_utc" }
  - { id: ERR_INVALID_MEMBERSHIP_STATE, http: 409, condition: "Membership transition requested from a state that does not allow it" }
  - { id: ERR_PATCH_TEST_NOT_VALID, http: 409, condition: "revoke on a patch test not in VALID" }
  - { id: ERR_INVALID_SCHEDULE_STATE, http: 409, condition: "schedule transition from a state that does not allow it" }
  - { id: ERR_STRIKES_STILL_ACTIVE, http: 409, condition: "reactivate while noshow_strike_count still >= threshold (strikes not aged out)" }
  # --- referential / constraint ---
  - { id: ERR_SERVICE_TYPE_RETIRED, http: 409, condition: "Booking a ServiceType whose active == false" }
  - { id: ERR_SCHEDULE_NOT_FILL_SERVICE, http: 409, condition: "Recurring schedule's service_type.code is not FILL" }
  - { id: ERR_ORDER_APPOINTMENT_MISMATCH, http: 409, condition: "Retail order's appointment_id is not a BOOKED appointment of the same member" }
  - { id: ERR_NO_TECH_AVAILABLE, http: 409, condition: "Lash-tech selector candidate set is empty (no eligible/non-overlapping tech)" }
  - { id: ERR_MEMBERSHIP_NOT_BOOKABLE, http: 409, condition: "Credit booking against a Membership not in ACTIVE" }
  # --- safety / temporal (422) ---
  - { id: ERR_NO_VALID_PATCH_TEST, http: 422, condition: "Service requires patch test but member has no VALID, unexpired, consent-signed patch test" }
  - { id: ERR_FILL_REQUIRES_PRIOR_FULL_SET, http: 422, condition: "FILL booked but member has no prior COMPLETED PREMIUM appointment (anchor null)" }
  - { id: ERR_FILL_TOO_SOON, http: 422, condition: "FILL gap_days < MIN_FILL_GAP_DAYS (5)" }
  - { id: ERR_FILL_WINDOW_EXPIRED, http: 422, condition: "FILL gap_days > MAX_FILL_WINDOW_DAYS (21)" }
  - { id: ERR_STATION_NOT_SANITIZED, http: 422, condition: "Assigned tech's station_sanitized_through_utc null or < appointment.start_utc" }
  # --- fiscal / concurrency ---
  - { id: ERR_INSUFFICIENT_CREDITS, http: 402, condition: "credit_balance < service_type.credit_cost before consuming append" }
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version != current Membership.version on credit booking or close-cycle" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, non-positive duration/quantity, empty lines, deposit_rate_pct out of [0,1], unparseable timestamp" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: StudioManager
    description: "Studio operator; manages config (studios, service types, plans, techs), membership lifecycle, billing cycles, retirement, voids."
    identity: "opaque"
    exclusive_operations:
      - "POST /studios — create studio"
      - "POST /service-types — create service type"
      - "POST /service-types/{id}/retire — retire service type"
      - "POST /membership-plans — create plan"
      - "POST /lash-techs — create tech"
      - "POST /lash-techs/{id}/set-status — set tech status"
      - "POST /sanitation-logs/{id}/void — void sanitation log"
      - "POST /memberships/{id}/close-cycle — close billing cycle"
      - "POST /memberships/{id}/flag-past-due — flag past due"
      - "POST /memberships/{id}/settle-dues — settle dues"
      - "POST /memberships/{id}/reactivate — reactivate"
      - "POST /memberships/{id}/cancel-membership — cancel membership"
    shared_operations:
      - "create members, memberships, patch-tests, appointments, retail-orders, recurring-schedules, sanitation-logs (with FrontDesk)"
      - "complete/cancel/no-show appointments; spawn/pause/resume/end schedules; void retail orders"
      - "all GET reads"

  - name: FrontDesk
    description: "Operational staff at the desk; books and manages appointments, members, schedules, retail, sanitation. Cannot create studio config or run billing lifecycle."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /members — create member"
      - "POST /memberships — enroll membership"
      - "POST /patch-tests — record patch test"
      - "POST /sanitation-logs — record sanitation"
      - "POST /appointments — book appointment"
      - "POST /appointments/{id}/cancel — cancel"
      - "POST /appointments/{id}/mark-no-show — no-show"
      - "POST /retail-orders — create retail order"
      - "POST /recurring-schedules — create schedule"
      - "POST /recurring-schedules/{id}/spawn-next — spawn fill"
      - "POST /recurring-schedules/{id}/{pause,resume,end} — manage schedule"
      - "POST /retail-orders/{id}/void — void retail"
      - "all GET reads"

  - name: LashTech
    description: "Technician; completes appointments and records own station sanitation. Entity-backed: X-User-ID == LashTech.id."
    identity: "entity_backed:LashTech"
    exclusive_operations: []
    shared_operations:
      - "POST /appointments/{id}/complete — complete an appointment"
      - "POST /sanitation-logs — record sanitation"
      - "GET reads on studios, service-types, plans, lash-techs, appointments, sanitation-logs"

  - name: Member
    description: "Customer; books own appointments, cancels them, manages own patch-test consent, retail and recurring schedules. Entity-backed: X-User-ID == Member.id; ownership enforced against member_id FKs."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /appointments — book own appointment (member_id must == X-User-ID)"
      - "POST /appointments/{id}/cancel — cancel own appointment"
      - "POST /patch-tests/{id}/revoke — revoke own consent"
      - "POST /retail-orders — buy retail on own appointment"
      - "POST /recurring-schedules — create own schedule"
      - "POST /recurring-schedules/{id}/{pause,resume,end} — manage own schedule"
      - "GET reads scoped to own Member / memberships / appointments / patch-tests / retail / schedules"
