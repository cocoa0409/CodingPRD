      - name: pro_forma_ratio_correct_result_for_known_inputs
        claim_type: Correct Result
        grounds:
          - calculations.pro_forma_capital_ratios
        excluded_because:
          difficulty_instance: pro_forma_capital_dual_basis_diverges_on_identical_transaction_inputs
          rationale: "that §1.8 instance files both bases over identical inputs and pins 7.74/6.52/WELL_CAPITALIZED against 5.77/5.02/ADEQUATELY_CAPITALIZED, which is the correct-result claim for this calculation"

      - name: fulfillment_variants_diverge_on_the_same_report
        claim_type: Variant Divergence
        grounds:
          - calculations.commitment_fulfillment.variants
        excluded_because:
          difficulty_instance: commitment_fulfillment_dual_basis_flips_review_outcome
          rationale: "that §1.8 instance drives the same credited dollars through both bases and shows 61.22 versus 68.88 flipping the review outcome, so the delta is already asserted"

      - name: screen_threshold_boundary_values
        claim_type: threshold
        grounds:
          - calculations.hhi_competitive_screen.constants.HHI_DELTA_SAFE_HARBOR
        excluded_because:
          difficulty_instance: hhi_delta_exactly_at_safe_harbor_passes_the_screen
          rationale: "that §1.8 instance sits exactly on delta 200 and contrasts it with 400 and 1200, covering threshold-1 / threshold / threshold+1 for this screen"

      - name: ledger_running_total_correct_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.commitment_fulfillment
          - entities.CommunityBenefitsPlan.fields.credited_to_date_usd
        excluded_because:
          difficulty_instance: report_reopen_restores_the_commitment_ledger_partition
          rationale: "that §1.8 instance adds credit at review and reverses it at reopen while asserting the conserved partition, which is exactly the aggregation add/reversal claim"

      - name: weights_sum_and_rounding_does_not_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.management_composite_score
        excluded_because:
          difficulty_instance: management_composite_per_product_rounding_order
          rationale: "that §1.8 instance contrasts the per-product rounding result 70.11 with the naive 70.10 and shows the SATISFACTORY_FLOOR verdict turning on it"

      - name: comment_window_interval_semantics
        claim_type: interval_merge
        grounds:
          - calculations.comment_window_semantics
        excluded_because:
          difficulty_instance: adjacent_comment_period_allowed_overlapping_period_rejected
          rationale: "that §1.8 instance accepts the gap-zero adjacent period and rejects the intersecting one under the half-open convention"

      - name: ledger_delta_on_variant_switch
        claim_type: Reconciliation
        grounds:
          - calculations.commitment_fulfillment
        excluded_because:
          difficulty_instance: performance_report_review_reopen_review_cycle_on_commitment_ledger
          rationale: "that §1.8 instance re-reviews a reopened report and asserts the ledger lands on the value implied by the second review, so the reconciliation delta is already pinned"

  - section: validations
    instances:
      - name: needs_to_improve_cra_record_blocks_submission
        claim_type: Violation -> Error
