# ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: cadence_window_boundary_moves_with_one_day_of_blackout_start
        grounds:
          - validations[priority=17]
          - state_machines.AutoshipItem.ACTIVE_to_ACTIVE
          - entities.AutoshipPlan.fields.blackout_start_date
        distinguishing_aspect: "Interval semantics differ from the transit rule by the absent buffer: the identical 28-day window ending on 2026-09-30 is accepted against a blackout starting on 2026-09-30 and refused against one starting on 2026-09-29, so adjacency at the blackout's start is non-conflicting under half-open arithmetic."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-02T00:00:00Z. Two plans, one with blackout_start_date 2026-09-30 and one with 2026-09-29, both ending 2026-10-06, each carrying a single 28-day item."
