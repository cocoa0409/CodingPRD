# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not a declared role" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Role not in endpoint roles, or payment direction-role split violated" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path/body reference does not resolve, or Customer-role access to a resource outside their ownership" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Invoice void attempted by the same user who created the invoice" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type/enum, non-positive qty/amount, inverted windows, photo parent/tag mismatch" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger invoked from a state with no such declared edge" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "Payment creation while claim in DENIED/WITHDRAWN/CLOSED (or otherwise non-payable) state" }
  - { id: ERR_SUPPLEMENT_NOT_PERMITTED, http: 409, condition: "Supplement creation while claim not IN_PROGRESS" }
  - { id: ERR_ESTIMATE_NOT_EDITABLE, http: 409, condition: "Line mutation or record-actuals against an estimate not in an editable state" }
  - { id: ERR_INVOICE_NOT_ISSUABLE, http: 409, condition: "Invoice issue from non-DRAFT state or while claim not COMPLETE" }
  - { id: ERR_ROUND_NOT_OPEN, http: 409, condition: "Disposition add/respond against a RESOLVED/EXPIRED round" }
  - { id: ERR_AUTHORIZATION_MISSING, http: 409, condition: "start-work or carrier payment approval without a SIGNED, deductible-acknowledged WorkAuthorization" }
  - { id: ERR_CONTAINMENT_REQUIRED, http: 422, condition: "MOLD claim start-work without a CONTAINMENT-trade line in an approved estimate" }
  - { id: ERR_MOISTURE_GATE_FAILED, http: 422, condition: "WATER/MOLD complete-work while a wet (area, material) group's latest reading exceeds dry_standard + 2" }
  - { id: ERR_INSPECTION_INCOMPLETE, http: 422, condition: "Estimate submit without any COMPLETED inspection on the claim" }
  - { id: ERR_INSPECTION_EVIDENCE_INSUFFICIENT, http: 422, condition: "Inspection completion without >= 3 tagged photos or (WATER/MOLD) without a moisture reading" }
  - { id: ERR_SUPPLEMENT_EVIDENCE_INSUFFICIENT, http: 422, condition: "Supplement submit with empty narrative or fewer than 2 SUPPLEMENT_EVIDENCE photos" }
  - { id: ERR_DUPLICATE_INITIAL_ESTIMATE, http: 409, condition: "Second INITIAL estimate on the same claim" }
  - { id: ERR_DUPLICATE_ACTIVE_INVOICE, http: 409, condition: "Second non-VOIDED invoice on the same claim" }
  - { id: ERR_INSPECTION_SCHEDULE_CONFLICT, http: 409, condition: "Same-assignee inspection windows overlapping within the 30-minute travel buffer" }
  - { id: ERR_DISPOSITION_LINE_MISMATCH, http: 422, condition: "Disposition targets a line that does not belong to the round's estimate" }
  - { id: ERR_CODE_UPGRADES_PENDING, http: 409, condition: "complete-work while any CodeUpgrade is still IDENTIFIED" }
  - { id: ERR_PRICE_WINDOW_OVERLAP, http: 409, condition: "New price entry's half-open window overlaps an existing entry for the same carrier + category_code" }
  - { id: ERR_POLICY_WINDOW_VIOLATION, http: 422, condition: "date_of_loss outside the policy period (closed interval check)" }
  - { id: ERR_PRICE_WINDOW_VIOLATION, http: 422, condition: "At submit, a line's price entry window does not cover date_of_loss" }
  - { id: ERR_AUTHORIZATION_EXPIRED, http: 422, condition: "start-work after the signed WA's expires_at" }
  - { id: ERR_ORDINANCE_NOT_COVERED, http: 422, condition: "Code-upgrade approval on a policy with ordinance_limit_cents == 0" }
  - { id: ERR_ORDINANCE_CAP_EXHAUSTED, http: 422, condition: "Code-upgrade approval when the ordinance bucket remaining is 0" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "CUSTOMER_BALANCE payment exceeding active invoice outstanding_cents" }
  - { id: ERR_DEDUCTIBLE_OVERPAID, http: 422, condition: "DEDUCTIBLE payment pushing collected+pending deductible above claim.deductible_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractorAdmin
    description: "Restoration contractor back office: configures carriers/price lists, onboards customers/policies/claims, drives work execution, invoices, and handles money clearing"
    identity: opaque
    exclusive_operations: ["carrier/price-list/customer/policy/claim creation", "claim transition (contractor edges)", "start-work / complete-work", "invoice create/issue/void", "payment clear/return/requeue", "customer-direction payment approve/issue", "logical clock control"]
    shared_operations: ["claim/estimate/invoice/payment reads", "financial summary"]
  - name: Estimator
    description: "Contractor estimator: builds and negotiates estimates, files supplements and code upgrades"
    identity: opaque
    exclusive_operations: ["estimate create/lines/submit/revise/concede/record-actuals", "disposition respond", "supplement create/submit", "code-upgrade create/withdraw"]
    shared_operations: ["claim/policy/carrier reads", "photo attach"]
  - name: FieldTechnician
    description: "Field inspector: performs loss assessments, moisture readings, photo documentation"
    identity: opaque
    exclusive_operations: ["inspection schedule/complete/cancel", "moisture reading capture"]
    shared_operations: ["photo attach", "inspection/reading reads"]
  - name: Adjuster
    description: "Carrier adjuster: reviews and negotiates estimates, approves supplements/code upgrades, approves and issues carrier-direction payments"
    identity: opaque
    exclusive_operations: ["estimate approve/deny", "negotiation-round and disposition creation", "supplement approve/deny", "code-upgrade approve/deny", "carrier-direction payment approve/issue", "claim DENIED edge"]
    shared_operations: ["claim/estimate/inspection/invoice/payment reads"]
  - name: Customer
    description: "Insured property owner: signs work authorizations and pays the deductible; reads own claim data"
    identity: entity_backed:Customer
    exclusive_operations: ["work-authorization sign", "DEDUCTIBLE payment creation"]
    shared_operations: ["own claim/estimate/invoice/payment/financial-summary reads"]
