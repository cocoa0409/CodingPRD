          assert:
            - "BondReleaseApplication.${app16a_id}.notice_start_date == 2026-08-01 and notice_end_date == 2026-08-31"
            - "The 2026-09-14 publish returns HTTP 409 with ${rt2_err} == ERR_NOTICE_WINDOW_CONFLICT (14 days after 2026-08-31, inside the 15-day buffer) and BondReleaseApplication.${app16b_id}.status remains SUBMITTED with notice_start_date null"
            - "The 2026-09-15 publish returns 200 with BondReleaseApplication.${app16b_id}.status == PUBLIC_NOTICE, notice_start_date 2026-09-15 and notice_end_date 2026-10-15"
            - "Permit.${permit16_id}.last_notice_end_date == 2026-10-15 after the accepted publish"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: release_rescission_restores_permit_bond_money_ledger
        grounds:
          - state_machines.BondReleaseApplication.APPROVED_to_RESCINDED
          - endpoints[POST /mining/bond-release-applications/{id}/rescind]
          - calculations.bond_release_amount
          - calculations.permit_compliance_posture
          - entities.Permit.fields.bond_released_to_date
        distinguishing_aspect: |
          Conserved quantity 1 — the permit's bond money ledger, where
          bond_held_amount plus bond_released_to_date must equal the 900000.00
          credited to accepted instruments: approving a 129899.70 PHASE_I
          release moves value across that identity and rescinding moves the exact
          same amount back, leaving no residue in phase1_released_acres or
          approved_amount.
        test_recipe:
          setup:
            - "An ISSUED permit, 120 disturbed acres, one ACCEPTED CASH instrument credited 900000.00, bond_required 865998.00."
            - "A PHASE_I release application for 30.00 acres approved at clock 2026-09-20 for 129899.70, leaving bond_held 770100.30 and bond_released_to_date 129899.70."
            - "The clock stays at 2026-09-20, inside the 60-day rescission window."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Antler Creek Mining", tangible_net_worth: 20000000.00, fixed_assets_in_state: 10000000.00, total_liabilities: 7000000.00, net_income_prior_year: 1200000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op17_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Antler Creek Mine", county: "Fremont", total_acres: 460.00 }
              as: ProgramDirector
              captures: { site17_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site17_id}", operator_id: "${op17_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op17_id}"
              captures: { permit17_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit17_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op17_id}"
              captures: { est17_id: $.data.id }
            - call: "GET /mining/permits/${permit17_id}"
              as: PermitReviewer
              captures: { p17v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est17_id}/accept"
              payload: { expected_permit_version: "${p17v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit17_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op17_id}"
              captures: { inst17_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst17_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit17_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${permit17_id}/disturbance"
              payload: { disturbed_acres: 120.00 }
              as: Operator
              as_user_id: "${op17_id}"
            - call: "POST /mining/bond-release-applications"
              payload: { permit_id: "${permit17_id}", phase: "PHASE_I", acres_requested: 30.00 }
              as: Operator
              as_user_id: "${op17_id}"
              captures: { app17_id: $.data.id }
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Perry Danforth", certification_level: "CERT_III", region: "CENTRAL" }
              as: ProgramDirector
              captures: { insp17_id: $.data.id }
            - call: "POST /mining/inspections"
              payload: { permit_id: "${permit17_id}", inspector_id: "${insp17_id}", inspection_type: "RELEASE", scheduled_start: "2026-08-16T09:00:00Z", duration_hours: 4 }
              as: ProgramDirector
              captures: { ins17_id: $.data.id }
            - call: "POST /mining/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /mining/bond-release-applications/${app17_id}/publish-notice"
              as: BondSpecialist
              as_user_id: "bs-002"
            - call: "POST /mining/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /mining/inspections/${ins17_id}/record-result"
              payload: { result: "PASS", findings_note: "Phase I reclamation complete on 30 acres." }
              as: Inspector
              as_user_id: "${insp17_id}"
            - call: "POST /mining/bond-release-applications/${app17_id}/decide"
              payload: { decision: "APPROVE", inspection_id: "${ins17_id}" }
              as: BondSpecialist
              as_user_id: "bs-002"
          trigger:
            - call: "POST /mining/bond-release-applications/${app17_id}/rescind"
              payload: { rescission_reason: "Post-release audit found the Phase I revegetation stand density was misreported." }
              as: ProgramDirector
          assert:
            - "Before the rescission the ledger reads bond_held_amount 770100.30 plus bond_released_to_date 129899.70 == 900000.00"
            - "BondReleaseApplication.${app17_id}.status == RESCINDED with approved_amount == 0.00 and rescission_reason stored"
            - "Permit.${permit17_id}.bond_released_to_date == 0.00 and bond_held_amount == 900000.00 — the identity holds with the released term back at zero"
            - "Permit.${permit17_id}.phase1_released_acres == 0.00 and bond_deficiency_amount == 0.00"
            - "Permit.${permit17_id}.compliance_posture == COMPLIANT and status == ISSUED"
            - "BondInstrument.${inst17_id}.status remains ACCEPTED with credited_amount 900000.00 — the compensation never rewrites instrument history"

      - name: notice_vacatur_restores_operator_penalty_and_points_ledgers
        grounds:
          - state_machines.ViolationNotice.notice_status.ISSUED_to_VACATED
          - state_machines.ViolationNotice.penalty_status.ASSESSED_to_VACATED
          - calculations.penalty_assessment_amount
          - calculations.permit_compliance_posture
          - entities.Operator.fields.outstanding_penalty_balance
          - entities.Operator.fields.violation_points_total
        distinguishing_aspect: |
          Conserved quantities 2 and 3 — the operator's outstanding penalty
          balance and violation points counters, which are ledgers over
          enforcement rather than over bond money: vacatur must drive a 3960.00
          assessed penalty and 85 accumulated points back to 0.00 and 0 and
          return the permit to COMPLIANT, while the bond ledger is untouched
          throughout.
        test_recipe:
          setup:
            - "An ISSUED permit with an ACCEPTED CASH instrument credited 900000.00."
            - "A COMPLETED ROUTINE inspection with result FAIL."
            - "An IMMINENT_HARM violation notice with severity 40, negligence 30, duration 15 and no prior history, so total_points is 85."
            - "A penalty assessed at good_faith_level RAPID: base 85 x 60.00 = 5100.00, good-faith credit capped at 1500.00, subtotal 3600.00, imminent-harm surcharge 10 percent of the subtotal = 360.00, penalty_amount 3960.00."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Slate Hollow Extraction", tangible_net_worth: 17000000.00, fixed_assets_in_state: 8500000.00, total_liabilities: 6000000.00, net_income_prior_year: 800000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op18_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Slate Hollow Mine", county: "Wise", total_acres: 300.00 }
              as: ProgramDirector
              captures: { site18_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site18_id}", operator_id: "${op18_id}", mining_plan_acres: 120.00, post_mining_land_use: "FORESTLAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op18_id}"
              captures: { permit18_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit18_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op18_id}"
              captures: { est18_id: $.data.id }
            - call: "GET /mining/permits/${permit18_id}"
              as: PermitReviewer
              captures: { p18v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est18_id}/accept"
              payload: { expected_permit_version: "${p18v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit18_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op18_id}"
              captures: { inst18_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst18_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit18_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Rhea Castellan", certification_level: "CERT_II", region: "SOUTH" }
              as: ProgramDirector
              captures: { insp18_id: $.data.id }
            - call: "POST /mining/inspections"
              payload: { permit_id: "${permit18_id}", inspector_id: "${insp18_id}", inspection_type: "ROUTINE", scheduled_start: "2026-08-05T09:00:00Z", duration_hours: 3 }
              as: ProgramDirector
              captures: { ins18_id: $.data.id }
            - call: "POST /mining/inspections/${ins18_id}/record-result"
              payload: { result: "VIOLATIONS_FOUND", findings_note: "Sediment pond embankment breached above an occupied dwelling." }
              as: Inspector
              as_user_id: "${insp18_id}"
            - call: "POST /mining/violation-notices"
              payload: { inspection_id: "${ins18_id}", violation_class: "IMMINENT_HARM", severity_points: 40, negligence_points: 30, duration_points: 15, abatement_days: 15 }
              as: Inspector
              as_user_id: "${insp18_id}"
              captures: { vn18_id: $.data.id }
            - call: "POST /mining/violation-notices/${vn18_id}/assess-penalty"
              payload: { good_faith_level: "RAPID" }
              as: ProgramDirector
          trigger:
            - call: "POST /mining/violation-notices/${vn18_id}/vacate"
              payload: { vacate_reason: "Formal review found the cited embankment was outside the permit boundary." }
              as: ProgramDirector
          assert:
            - "Before vacatur ViolationNotice.${vn18_id}.total_points == 85, penalty_amount == 3960.00, penalty_status == ASSESSED, Operator.${op18_id}.outstanding_penalty_balance == 3960.00 and violation_points_total == 85"
            - "ViolationNotice.${vn18_id}.notice_status == VACATED with vacate_reason stored and vacated_at stamped"
            - "ViolationNotice.${vn18_id}.penalty_status == VACATED and penalty_amount == 0.00, with penalty_paid_amount still 0.00"
            - "Operator.${op18_id}.outstanding_penalty_balance == 0.00 and violation_points_total == 0"
            - "Permit.${permit18_id}.compliance_posture == COMPLIANT (back from NOTICE_ACTIVE) and status == ISSUED"
            - "Permit.${permit18_id}.bond_held_amount == 900000.00 and bond_released_to_date == 0.00 — the money ledger never moved"
