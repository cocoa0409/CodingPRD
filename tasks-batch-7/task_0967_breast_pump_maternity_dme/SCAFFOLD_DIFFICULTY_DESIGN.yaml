              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_a: $.data.id }
          trigger:
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerY", plan_type: "MEDICAID", benefit_period_start: "2026-06-01", benefit_period_end: "2027-06-01" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerY", plan_type: "MEDICAID", benefit_period_start: "2027-01-01", benefit_period_end: "2028-01-01" }
              as: PlatformAdmin
              captures: { pol_b: $.data.id }
          assert:
            - "overlapping policy returns error_id == ERR_POLICY_PERIOD_OVERLAP"
            - "adjacent policy [2027-01-01, 2028-01-01) is created with 201 and id ${pol_b}"
            - "GET /dme/policies?member_id=${m_id} returns exactly 2 policies"

      - name: resupply_minimum_gap_buffer
        grounds:
          - calculations.resupply_next_eligible_date
          - "validations[priority=8]"
        distinguishing_aspect: |
          Resource: the ResupplySchedule fulfillment timeline; semantics differ from the
          policy-overlap rule — this is a minimum-gap buffer between discrete fulfillment
          events (a second order one instant after the 2026-07-30 fulfillment collides
          with the buffer (2026-07-30, 2026-10-28) and is rejected), not an intersection
          of two continuous half-open intervals.
