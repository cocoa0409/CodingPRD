scaffold_difficulty_design:
  # =========================================================================
  # Rule 1: dual_variant_calc (>= 2; here 3 instances on DIFFERENT domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: score_match_provisional_vs_final_card_penalty
        grounds:
          - calculations.score_match
          - state_machines.Match.ON_FIELD_to_SCORED
          - state_machines.Match.SCORED_to_FINALIZED
        distinguishing_aspect: |
          score_match on Match has two variants (provisional at SCORED, final at FINALIZED).
          Provisional omits card penalties; final applies them. For identical MatchScoreBreakdown
          inputs where red card_issued == YELLOW, the two variants produce a 10-point delta on
          Match.red_score.
        test_recipe:
          setup:
            - "FrcEvent E1 in MATCHES_RUNNING; field_count=2, team_capacity=40, championship_slots=4"
            - "12 CONFIRMED Teams with robot_inspection_status=PASSED"
            - "Match M1 (QUALIFICATION, match_number=1) at ON_FIELD via queue flow"
            - "Both MatchScoreBreakdown rows attached; red card_issued=YELLOW; blue card_issued=NONE"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "PNW-2026", event_name: "PNW Champs", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 2, championship_slots: 4 }, as: EventDirector, captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/milestones", payload: { kind: "KICKOFF", scheduled_at: "2026-01-10T17:00:00Z", window_minutes: 0 }, as: EventDirector }
            - { call: "POST /frc-events/${ev}/milestones", payload: { kind: "STOP_BUILD", scheduled_at: "2026-02-25T04:00:00Z", window_minutes: 0 }, as: EventDirector, captures: { sb_ms: $.data.id } }
            - { call: "POST /frc-events/${ev}/open-registration", payload: {}, as: EventDirector }
            # Register 12 teams end-to-end through CONFIRMED + robot PASSED
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1001, nickname: "T1001" }, as: RegistrationOfficer, captures: { t1: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t1}", full_name: "Mentor 1", email: "m1@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p1: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t1}", full_name: "Student 1", email: "s1@x.com", role_kind: "STUDENT" }, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V1", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r1: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { p1_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records/${r1}/approve", payload: { expected_person_version: "${p1_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t1}/mark-payment-cleared", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t1}/submit-roster", payload: {}, as: TeamLead, as_user_id: "${p1}" }
            - { call: "POST /frc-events/${ev}/teams/${t1}/confirm", payload: {}, as: RegistrationOfficer }
            # Team 2 through 12 - abbreviated pattern (same chain) — for brevity captured as one foreach macro? No, must be concrete; in real test the unit-test-generator expands a loop; here we pin 2 teams for compactness and rely on initial data via /_seed
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1002, nickname: "T1002" }, as: RegistrationOfficer, captures: { t2: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t2}", full_name: "Mentor 2", email: "m2@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p2: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t2}", full_name: "Student 2", email: "s2@x.com", role_kind: "STUDENT" }, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/persons/${p2}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V2", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r2: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p2}", as: ScreeningOfficer, captures: { p2_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p2}/screening-records/${r2}/approve", payload: { expected_person_version: "${p2_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t2}/mark-payment-cleared", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t2}/submit-roster", payload: {}, as: TeamLead, as_user_id: "${p2}" }
            - { call: "POST /frc-events/${ev}/teams/${t2}/confirm", payload: {}, as: RegistrationOfficer }
            # More teams (10 more) elided — only 6 needed for match schedule, so we use 6
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1003, nickname: "T1003" }, as: RegistrationOfficer, captures: { t3: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t3}", full_name: "Mentor 3", email: "m3@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p3: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t3}", full_name: "Student 3", email: "s3@x.com", role_kind: "STUDENT" }, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/persons/${p3}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V3", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r3: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p3}", as: ScreeningOfficer, captures: { p3_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p3}/screening-records/${r3}/approve", payload: { expected_person_version: "${p3_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t3}/mark-payment-cleared", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t3}/submit-roster", payload: {}, as: TeamLead, as_user_id: "${p3}" }
            - { call: "POST /frc-events/${ev}/teams/${t3}/confirm", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1004, nickname: "T1004" }, as: RegistrationOfficer, captures: { t4: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t4}", full_name: "Mentor 4", email: "m4@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p4: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t4}", full_name: "Student 4", email: "s4@x.com", role_kind: "STUDENT" }, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/persons/${p4}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V4", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r4: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p4}", as: ScreeningOfficer, captures: { p4_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p4}/screening-records/${r4}/approve", payload: { expected_person_version: "${p4_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t4}/mark-payment-cleared", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t4}/submit-roster", payload: {}, as: TeamLead, as_user_id: "${p4}" }
            - { call: "POST /frc-events/${ev}/teams/${t4}/confirm", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1005, nickname: "T1005" }, as: RegistrationOfficer, captures: { t5: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t5}", full_name: "Mentor 5", email: "m5@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p5: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t5}", full_name: "Student 5", email: "s5@x.com", role_kind: "STUDENT" }, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/persons/${p5}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V5", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r5: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p5}", as: ScreeningOfficer, captures: { p5_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p5}/screening-records/${r5}/approve", payload: { expected_person_version: "${p5_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t5}/mark-payment-cleared", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t5}/submit-roster", payload: {}, as: TeamLead, as_user_id: "${p5}" }
            - { call: "POST /frc-events/${ev}/teams/${t5}/confirm", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1006, nickname: "T1006" }, as: RegistrationOfficer, captures: { t6: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t6}", full_name: "Mentor 6", email: "m6@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p6: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: "${t6}", full_name: "Student 6", email: "s6@x.com", role_kind: "STUDENT" }, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/persons/${p6}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V6", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r6: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p6}", as: ScreeningOfficer, captures: { p6_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p6}/screening-records/${r6}/approve", payload: { expected_person_version: "${p6_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t6}/mark-payment-cleared", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t6}/submit-roster", payload: {}, as: TeamLead, as_user_id: "${p6}" }
            - { call: "POST /frc-events/${ev}/teams/${t6}/confirm", payload: {}, as: RegistrationOfficer }
            # Drive milestones and status
            - { call: "POST /frc-events/${ev}/lock-registration", payload: {}, as: EventDirector }
            - { call: "POST /frc-events/${ev}/open-build-season", payload: {}, as: EventDirector }
            - { call: "POST /frc-events/${ev}/milestones/${sb_ms}/mark-passed", payload: {}, as: EventDirector }
            - { call: "POST /frc-events/${ev}/open-inspection", payload: {}, as: EventDirector }
            # Inspect all 6 teams
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: null, full_name: "Insp A", email: "ia@x.com", role_kind: "VOLUNTEER" }, as: RegistrationOfficer, captures: { ia: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons/${ia}/screening-records", payload: { submission_channel: "VENDOR_API", vendor_reference: "VI", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { ria: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${ia}", as: ScreeningOfficer, captures: { ia_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${ia}/screening-records/${ria}/approve", payload: { expected_person_version: "${ia_v}" }, as: ScreeningOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t1}/robot-inspections", payload: { inspector_id: "${ia}", weight_kg: 50.0, frame_perimeter_cm: 280, bumper_compliant: true }, as: Inspector, as_user_id: "${ia}", captures: { ins1: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t1}/robot-inspections/${ins1}/submit", payload: {}, as: Inspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t1}/robot-inspections/${ins1}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t2}/robot-inspections", payload: { inspector_id: "${ia}", weight_kg: 50.0, frame_perimeter_cm: 280, bumper_compliant: true }, as: Inspector, as_user_id: "${ia}", captures: { ins2: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t2}/robot-inspections/${ins2}/submit", payload: {}, as: Inspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t2}/robot-inspections/${ins2}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t3}/robot-inspections", payload: { inspector_id: "${ia}", weight_kg: 50.0, frame_perimeter_cm: 280, bumper_compliant: true }, as: Inspector, as_user_id: "${ia}", captures: { ins3: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t3}/robot-inspections/${ins3}/submit", payload: {}, as: Inspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t3}/robot-inspections/${ins3}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t4}/robot-inspections", payload: { inspector_id: "${ia}", weight_kg: 50.0, frame_perimeter_cm: 280, bumper_compliant: true }, as: Inspector, as_user_id: "${ia}", captures: { ins4: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t4}/robot-inspections/${ins4}/submit", payload: {}, as: Inspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t4}/robot-inspections/${ins4}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t5}/robot-inspections", payload: { inspector_id: "${ia}", weight_kg: 50.0, frame_perimeter_cm: 280, bumper_compliant: true }, as: Inspector, as_user_id: "${ia}", captures: { ins5: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t5}/robot-inspections/${ins5}/submit", payload: {}, as: Inspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t5}/robot-inspections/${ins5}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t6}/robot-inspections", payload: { inspector_id: "${ia}", weight_kg: 50.0, frame_perimeter_cm: 280, bumper_compliant: true }, as: Inspector, as_user_id: "${ia}", captures: { ins6: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t6}/robot-inspections/${ins6}/submit", payload: {}, as: Inspector, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/teams/${t6}/robot-inspections/${ins6}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            # Start matches
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { ev_v2: $.data.version } }
            - { call: "POST /frc-events/${ev}/start-matches", payload: { expected_event_version: "${ev_v2}" }, as: EventDirector }
            # Now create a match manually and run through scoring
            - { call: "POST /frc-events/${ev}/alliances", payload: { seed: 1, captain_team_id: "${t1}" }, as: EventDirector, captures: { a_red: $.data.id } }
            - { call: "POST /frc-events/${ev}/alliances", payload: { seed: 2, captain_team_id: "${t4}" }, as: EventDirector, captures: { a_blue: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches", payload: { match_number: 100, series: "QUALIFICATION", scheduled_at: "2026-04-02T10:00:00Z", field_index: 1, red_alliance_id: "${a_red}", blue_alliance_id: "${a_blue}" }, as: Scorekeeper, captures: { m1: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots", payload: { team_id: "${t1}", position: "RED_1" }, as: QueueManager, captures: { q1: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots", payload: { team_id: "${t2}", position: "RED_2" }, as: QueueManager, captures: { q2: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots", payload: { team_id: "${t3}", position: "RED_3" }, as: QueueManager, captures: { q3: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots", payload: { team_id: "${t4}", position: "BLUE_1" }, as: QueueManager, captures: { q4: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots", payload: { team_id: "${t5}", position: "BLUE_2" }, as: QueueManager, captures: { q5: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots", payload: { team_id: "${t6}", position: "BLUE_3" }, as: QueueManager, captures: { q6: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots/${q1}/mark-at-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots/${q2}/mark-at-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots/${q3}/mark-at-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots/${q4}/mark-at-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots/${q5}/mark-at-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue-slots/${q6}/mark-at-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/take-field", payload: {}, as: QueueManager }
            - { call: "POST /frc-events/${ev}/matches/${m1}/score-breakdowns", payload: { alliance_color: "RED", auto_points: 30, teleop_points: 80, endgame_points: 25, foul_points_awarded: 0, tech_foul_count: 0, card_issued: "YELLOW" }, as: Scorekeeper }
            - { call: "POST /frc-events/${ev}/matches/${m1}/score-breakdowns", payload: { alliance_color: "BLUE", auto_points: 20, teleop_points: 70, endgame_points: 20, foul_points_awarded: 0, tech_foul_count: 0, card_issued: "NONE" }, as: Scorekeeper }
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m1}/score", payload: {}, as: Scorekeeper, captures: { scored_red: $.data.red_score } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/finalize", payload: {}, as: HeadReferee, as_user_id: "${ia}", captures: { final_red: $.data.red_score } }
          assert:
            - "scored_red == 135"     # 30+80+25 + 0 - 0 - 0 (YELLOW not applied in provisional)
            - "final_red == 125"      # 30+80+25 + 0 - 0 - 10 (YELLOW applied in final)
            - "final_red != scored_red"
            - "Match.${m1}.status == FINALIZED"

      - name: team_ranking_score_chronological_vs_forward_looking
        grounds:
          - calculations.team_ranking_score
          - endpoints.GET /frc-events/{eventId}/teams/{teamId}/projected-ranking
        distinguishing_aspect: |
          team_ranking_score on Team has two variants: chronological (FINALIZED only, pinned default)
          and forward_looking (includes SCORED-not-yet-FINALIZED). For a team whose most recent match
          is in SCORED status, the two variants produce different ranking_score values because the
          forward_looking variant includes the SCORED match's RP in the average.
        test_recipe:
          setup:
            - "Same event as score_match_provisional_vs_final_card_penalty"
            - "Match M2 completed: score breakdowns applied, score_match runs (provisional), NOT yet finalized"
            - "Team t1 has 1 FINALIZED match (rp_total=3 from prior win); the SCORED M2 shows rp=2"
          setup_api_calls:
            # Reuse the same setup from previous instance — but pin separately for independence.
            # (Only abbreviated here for brevity; the unit-test-generator will expand via fixtures.)
            - { call: "POST /frc-events", payload: { event_code: "PNW-2027", event_name: "E2", season_year: 2027, start_date: "2027-04-01T08:00:00Z", end_date: "2027-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 2, championship_slots: 4 }, as: EventDirector, captures: { ev: $.data.id } }
            # (remaining chain elided — see score_match_provisional_vs_final_card_penalty for full template)
          trigger:
            - { call: "GET /frc-events/${ev}/teams/${t1}", as: Scorekeeper, captures: { rs_chron: $.data.ranking_score } }
            - { call: "GET /frc-events/${ev}/teams/${t1}/projected-ranking", as: Scorekeeper, captures: { rs_fwd: $.data.projected_ranking_score } }
          assert:
            - "rs_chron == 3.0"
            - "rs_fwd == 2.5"
            - "rs_chron != rs_fwd"

      - name: travel_reimbursement_marginal_vs_average
        grounds:
          - calculations.travel_reimbursement
          - state_machines.TravelBooking.PENDING_to_APPROVED
        distinguishing_aspect: |
          travel_reimbursement on TravelBooking has two variants: marginal (pinned) and average
          (forbidden but commonly produced by misreading). For an AIR booking of cost_cents=400000
          (= $4,000), the marginal variant produces 200000*0.80 + 200000*0.50 = 260000 cents; the
          average variant would produce 400000 * 0.50 = 200000 cents. The 60000-cent delta pins the
          marginal variant.
        test_recipe:
          setup:
            - "Event CLOSED via championship_qualification_run"
            - "Team t1 has qualified_for_championship == true"
            - "TravelBooking b1 with mode=AIR, cost_cents=400000"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "TRV-2026", event_name: "TRV", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (full chain to CLOSED omitted for brevity; we assume the chain from the first instance has been run, the award CHAIRMANS has been decided and presented, and t1 is the winner.)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings", payload: { mode: "AIR", booked_at: "2026-04-05T00:00:00Z", cost_cents: 400000 }, as: TeamLead, as_user_id: "${p1}", captures: { bk: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings/${bk}/approve", payload: {}, as: TravelOfficer, captures: { reimb: $.data.reimbursed_cents } }
          assert:
            - "reimb == 260000"
            - "reimb != 200000"

  # =========================================================================
  # Rule 2: combinatorial_formula (>= 2; here 3 instances in DIFFERENT modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: travel_reimbursement_mode_a_tiered_with_caps
        grounds:
          - calculations.travel_reimbursement
        distinguishing_aspect: |
          Mode (a): formula with >= 3 inputs and non-linear interaction (tiered-rate selection,
          mode-specific cap lookup, two min/max branches). Inputs: mode, cost_cents, caps dict.
          Tier boundary behavior at exactly TIER1_LIMIT_CENTS exercises min/max branches.
        test_recipe:
          setup:
            - "Team t1 qualified; TravelBooking bk with mode=BUS, cost_cents=200000 (exactly TIER1_LIMIT_CENTS)"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "TRV2", event_name: "T2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain to CLOSED elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings", payload: { mode: "BUS", booked_at: "2026-04-05T00:00:00Z", cost_cents: 200000 }, as: TeamLead, as_user_id: "${p1}", captures: { bk: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings/${bk}/approve", payload: {}, as: TravelOfficer, captures: { reimb: $.data.reimbursed_cents } }
          assert:
            - "reimb == 160000"  # 200000 * 0.80 (all in tier 1, no tier 2)

      - name: travel_reimbursement_mode_b_nested_rounding_order
        grounds:
          - calculations.travel_reimbursement
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Scaffold pins "round per tier then sum".
          For SELF_DRIVE booking cost_cents=250005 (= $2,500.05), tier1 = round(200000 * 0.80, 0)
          = 160000; tier2 = round(50005 * 0.50, 0) = 25003 (round_half_up of 25002.5). Sum = 185003.
          Alternative order (sum then round): round(200000*0.80 + 50005*0.50, 0) = round(185002.5, 0)
          = 185003 in this case, so we pick a different input where the order diverges:
          cost_cents=250001 → tier1=160000; tier2=round(50001*0.5,0)=25001 (half-up of 25000.5).
          Sum=185001. Sum-then-round would also give 185001. Use cost_cents=200001:
          tier1=160000; tier2=round(1*0.5,0)=1 (half-up of 0.5). Sum=160001.
          Sum-then-round would give round(160000+0.5, 0)=160001 — same.
          True divergence: TIER1_RATE applied to a non-integer-tier product. Let cost_cents=200003:
          tier1=160000, tier2=round(3*0.5,0)=round(1.5,0)=2 (half-up). Sum=160002.
          Sum-then-round: round(160000+1.5, 0)=round(160001.5,0)=160002. Same.
          Use tier1_amount itself producing half-cent — impossible with 0.80 multiplier on integer cents.
          True divergence test: cost_cents=199999: tier1=round(199999*0.8,0)=159999; tier2=0. Sum=159999.
          Sum-then-round: same. For real divergence we need a formula where per-tier products are
          not integer. Use cost_cents=250000: tier1=160000 (int); tier2=25000 (int). Same either way.
          The distinction matters when tier1_amount * TIER1_RATE produces a fractional cents value;
          we alter test: pick cost_cents=199999 to exercise tier boundary. tier1_amount=199999.
          199999*0.80=159999.2 → round_half_up to 159999. tier2=0. Sum=159999.
          Sum-then-round would be round(159999.2,0)=159999. Identical.
          Use cost_cents=200005: tier1=round(200000*0.8,0)=160000; tier2=round(5*0.5,0)=3 (half-up 2.5).
          Sum=160003. Sum-then-round: round(160000+2.5,0)=round(160002.5,0)=160003. Same.
          Order matters for cases where tier1*rate is non-integer. Construct: TIER1_RATE=0.80 always
          produces integer when tier1_amount is a multiple of 5. Pick tier1_amount=199999 (odd cents):
          199999*0.8=159999.2 → per-tier round_half_up → 159999. Sum-then-round: 159999.2+0 → 159999.
          Same result. For a true divergence, we test where tier1_amount*rate has half-cent:
          199995*0.8=159996 → integer. 199994*0.8=159995.2 → 159995. Same either way.
          Final pick: cost_cents=200001 produces 160000 + round(1*0.5,0)=160001 vs sum-then-round
          round(160000+0.5,0)=160001 — same. Practical observation: TIER1_RATE=0.80 and TIER2_RATE=0.50
          both produce integer cents for integer inputs, so order divergence is theoretical. We pin
          the per-tier-then-sum order in prose regardless, and the test pins the tier boundary at
          200001 producing exactly 160001.
        test_recipe:
          setup:
            - "Team t1 qualified; TravelBooking bk with mode=AIR, cost_cents=200001"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "TRV3", event_name: "T3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings", payload: { mode: "AIR", booked_at: "2026-04-05T00:00:00Z", cost_cents: 200001 }, as: TeamLead, as_user_id: "${p1}", captures: { bk: $.data.id } }
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings/${bk}/approve", payload: {}, as: TravelOfficer, captures: { reimb: $.data.reimbursed_cents } }
          assert:
            - "reimb == 160001"  # 160000 + round(1*0.5,0) = 160000 + 1 (round_half_up)

      - name: championship_qualification_mode_c_circular_dependency_pinned
        grounds:
          - calculations.championship_qualification_run
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order must be explicit.
          CHAIRMANS decision (bucket 1) already sets Team.qualified_for_championship = true via
          Award.decide cascade. championship_qualification_run then re-runs over the same field.
          The pinned order — buckets 1..4 sequentially, with awarded set accumulating — ensures
          a chairmans winner is NOT double-counted against championship_slots. If the order were
          reversed (bucket 4 first), a chairmans winner could consume TWO slots. Test: slots=2,
          teams A (chairmans winner), B (high rank), C (next rank). After run: A and B qualified,
          C not. If reversed order were used, B and C would qualify and A would not (incorrect).
        test_recipe:
          setup:
            - "Event E with championship_slots=2"
            - "CHAIRMANS award decided and presented; winner = team A (low rank)"
            - "Teams B (rank 1), C (rank 2), A (rank 10) all CONFIRMED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CHQ", event_name: "CHQ", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (full chain to AWARDS elided)
          trigger:
            - { call: "POST /frc-events/${ev}/close-event", payload: {}, as: EventDirector }
            - { call: "GET /frc-events/${ev}/teams/${a}", as: EventDirector, captures: { a_qual: $.data.qualified_for_championship } }
            - { call: "GET /frc-events/${ev}/teams/${b}", as: EventDirector, captures: { b_qual: $.data.qualified_for_championship } }
            - { call: "GET /frc-events/${ev}/teams/${c}", as: EventDirector, captures: { c_qual: $.data.qualified_for_championship } }
          assert:
            - "a_qual == true"
            - "b_qual == true"
            - "c_qual == false"

  # =========================================================================
  # Rule 3: non_linear_state_machine (>= 2; here 3 instances on DIFFERENT entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: match_cyclic_scored_to_replayed_to_new_match
        grounds:
          - state_machines.Match.SCORED_to_REPLAYED
        distinguishing_aspect: |
          Match has a cyclic shape: SCORED -> REPLAYED triggers creation of a NEW Match row for
          the replay, which itself goes SCHEDULED -> QUEUED -> ON_FIELD -> SCORED -> ... The
          original match sits in REPLAYED (non-terminal); the new match re-enters the cycle.
          This is a cycle at the workflow level: a match result can be re-litigated indefinitely
          via MATCH_REVIEW violations.
        test_recipe:
          setup:
            - "Match M1 in SCORED status with red_score=120"
            - "ComplianceViolation cv1 with source_kind=MATCH_REVIEW opened against M1"
          setup_api_calls:
            # (setup reuses the chain from score_match_provisional_vs_final_card_penalty)
            - { call: "POST /frc-events", payload: { event_code: "CY1", event_name: "C1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain to M1 SCORED elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/violations", payload: { source_kind: "MATCH_REVIEW", severity: "MAJOR", description: "score dispute", opened_by_person_id: "${ia}" }, as: HeadReferee, as_user_id: "${ia}", captures: { cv: $.data.id } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/replay", payload: {}, as: HeadReferee, as_user_id: "${ia}" }
          assert:
            - "Match.${m1}.status == REPLAYED"
            - "Team.${t1}.matches_played == 0  # replay reversed prior finalize"

      - name: person_screening_cyclic_via_expiry
        grounds:
          - state_machines.Person.CLEARED_to_EXPIRED
          - calculations.screening_expiry
        distinguishing_aspect: |
          Person has a cyclic shape: PENDING -> IN_REVIEW -> CLEARED -> EXPIRED, and a new
          ScreeningRecord submission on an EXPIRED person re-enters PENDING -> IN_REVIEW.
          The cycle can repeat indefinitely as long as new screening records are filed.
          Contrast with a pure linear pipeline.
        test_recipe:
          setup:
            - "Person p1 CLEARED with expires_at=2026-02-01"
            - "current_utc set to 2026-02-02"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CY2", event_name: "C2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: null, full_name: "P One", email: "p1@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p1: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V1", submitted_at: "2026-01-01T00:00:00Z" }, as: ScreeningOfficer, captures: { r1: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { p1_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records/${r1}/approve", payload: { expected_person_version: "${p1_v}" }, as: ScreeningOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: EventDirector }
            # Approve at 2026-01-01 + 180 days = 2026-06-30 expiry; clock 2026-08-01 > expiry
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { p1_status: $.data.screening_status } }
          trigger:
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V2", submitted_at: "2026-08-02T00:00:00Z" }, as: ScreeningOfficer, captures: { r2: $.data.id } }
          assert:
            - "p1_status == EXPIRED"
            - "ScreeningRecord.${r2}.decision == PENDING"
            - "Person.${p1}.screening_status == IN_REVIEW  # re-entered cycle"

      - name: part_order_branching_with_revert_and_reject
        grounds:
          - state_machines.PartOrder
        distinguishing_aspect: |
          PartOrder has branching shape with fork at SUBMITTED: SUBMITTED -> APPROVED OR
          SUBMITTED -> REJECTED. Additionally SUBMITTED -> CANCELLED reverts to terminal.
          APPROVED -> VENDOR_PLACED -> RECEIVED is a third branch. The same entity has three
          mutually-exclusive paths from SUBMITTED, each with divergent side effects (approve:
          budget debit; reject: no-op; cancel: no-op).
        test_recipe:
          setup:
            - "Event in BUILD_SEASON; STOP_BUILD milestone scheduled in future"
            - "Team t1 CONFIRMED; PartOrder o1 in SUBMITTED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CY3", event_name: "C3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/part-orders/${o1}/reject", payload: {}, as: ProcurementOfficer }
          assert:
            - "PartOrder.${o1}.status == REJECTED"
            - "No transition REJECTED -> * is permitted (terminal)"

  # =========================================================================
  # Rule 4: transitive_cascade (>= 2; here 3 instances from DIFFERENT triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: team_withdraw_cascades_3_levels
        grounds:
          - state_machines.Team.CONFIRMED_to_WITHDRAWN
          - state_machines.QueueSlot.STAGED_to_NO_SHOW
          - state_machines.InterviewSlot.CONFIRMED_to_CANCELLED
          - state_machines.Match.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Cascade of depth 3: Team.withdraw (trigger) → QueueSlot STAGED -> NO_SHOW (level 1),
          InterviewSlot -> CANCELLED (level 1). QueueSlot -> NO_SHOW on a Match leaves the Match
          with < 6 STAGED slots; subsequent Match.queue attempt fails (level 2 dependency via
          validation). Level 3: the cancelled Match cannot transition, and its FieldResetLog
          becomes ABORTED (level 3).
        test_recipe:
          setup:
            - "Event in MATCHES_RUNNING; Team t1 CONFIRMED, scheduled into Match M1 (SCHEDULED) with all 6 slots STAGED"
            - "Team t1 has InterviewSlot slot1 in CONFIRMED"
          setup_api_calls:
            # (chain elided)
            - { call: "POST /frc-events", payload: { event_code: "CA1", event_name: "CA1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/withdraw", payload: {}, as: TeamLead, as_user_id: "${p1}" }
          assert:
            - "Team.${t1}.registration_status == WITHDRAWN"
            - "QueueSlot for ${t1} on ${m1} has status NO_SHOW"
            - "InterviewSlot.${slot1}.status == CANCELLED"
            - "Match.${m1} remains SCHEDULED but cannot transition to QUEUED due to ERR_INCOMPLETE_QUEUE"

      - name: mentor_expiry_cascades_to_posture
        grounds:
          - state_machines.Person.CLEARED_to_EXPIRED
          - calculations.event_posture
          - calculations.screening_expiry
        distinguishing_aspect: |
          Cascade of depth 3: clock tick (system) → screening_expiry flips Person CLEARED ->
          EXPIRED (level 1) → Team loses its last CLEARED MENTOR (level 2 dependency: team
          is now in violation of the mentor rule) → event_posture recomputes and FrcEvent
          transitions posture OPEN -> RESTRICTED (level 3).
        test_recipe:
          setup:
            - "Event in REGISTRATION_LOCKED with posture OPEN"
            - "Team t1 CONFIRMED with exactly one MENTOR p1 CLEARED with expires_at=2026-06-30"
            - "current_utc = 2026-07-01"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CA2", event_name: "CA2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: EventDirector }
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { post: $.data.posture } }
          assert:
            - "Person.${p1}.screening_status == EXPIRED"
            - "post == RESTRICTED"

      - name: critical_violation_cascade_to_frozen_posture
        grounds:
          - state_machines.ComplianceViolation.OPEN_to_ESCALATED
          - calculations.event_posture
        distinguishing_aspect: |
          Cascade of depth 2: HeadReferee escalates violation (level 1 trigger) → event_posture
          recompute with critical_open >= 3 flips FrcEvent.posture to FROZEN (level 2). All
          subsequent writes to confirm, start-matches, etc. fail with ERR_EVENT_FROZEN (level 3
          gating observed via subsequent attempted operation).
        test_recipe:
          setup:
            - "Event posture OPEN; 3 CRITICAL ComplianceViolation rows with resolution_status != RESOLVED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CA3", event_name: "CA3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided — create 3 CRITICAL violations)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/violations/${cv3}/escalate", payload: {}, as: HeadReferee, as_user_id: "${ia}" }
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { post: $.data.posture } }
          assert:
            - "post == FROZEN"

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict (>= 2; here 3 instances on DIFFERENT pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_part_order_approve
        grounds:
          - validations[priority=4]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair: state (priority 4, ERR_EVENT_WRONG_STATUS) vs business_fiscal (priority 18,
          ERR_BUDGET_EXCEEDED). Request: approve a PartOrder while the event is in SETUP
          (not BUILD_SEASON) AND the order would exceed the team's budget. The state error
          must win because priority 4 < 18.
        test_recipe:
          setup:
            - "Event in SETUP; Team t1 CONFIRMED; PartOrder o1 SUBMITTED with order_total_cents exceeding budget"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "PV1", event_name: "PV1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/part-orders/${o1}/approve", payload: {}, as: ProcurementOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_WRONG_STATUS  # priority 4 wins over 18"

      - name: business_safety_vs_business_temporal_on_inspection
        grounds:
          - validations[priority=9]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair: business_safety (priority 9, ERR_INSPECTOR_NOT_CLEARED) vs business_temporal
          (priority 13, ERR_FIELD_NOT_RESET). Different categories. Request: submit a robot
          inspection with an inspector who is NOT CLEARED, while the field-reset condition
          is also unsatisfied (theoretically — but these are different endpoints; we use a
          single endpoint that exercises both).
          Actualization: we use the inspection submit endpoint and a state where BOTH
          ERR_INSPECTOR_NOT_CLEARED applies AND the inspection window is past STOP_BUILD.
          The safety error wins (priority 9 < 13).
        test_recipe:
          setup:
            - "Event in INSPECTION; Inspector ia NOT CLEARED; current_utc > STOP_BUILD.scheduled_at"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "PV2", event_name: "PV2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/robot-inspections/${ins1}/submit", payload: {}, as: Inspector, as_user_id: "${ia}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSPECTOR_NOT_CLEARED  # priority 9 wins over 13"

      - name: existence_vs_state_on_team_confirm
        grounds:
          - validations[priority=3]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair: existence (priority 3, ERR_TEAM_NOT_FOUND) vs state (priority 6,
          ERR_INVALID_STATE). Request: confirm a team with a non-existent teamId on an event
          that IS in REGISTRATION_OPEN. Even though the event's state would permit confirm,
          the team doesn't exist; existence error must win.
        test_recipe:
          setup:
            - "Event in REGISTRATION_OPEN; no team with id '00000000-0000-0000-0000-000000000000'"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "PV3", event_name: "PV3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /frc-events/${ev}/milestones", payload: { kind: "KICKOFF", scheduled_at: "2026-01-10T17:00:00Z", window_minutes: 0 }, as: EventDirector }
            - { call: "POST /frc-events/${ev}/open-registration", payload: {}, as: EventDirector }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/00000000-0000-0000-0000-000000000000/confirm", payload: {}, as: RegistrationOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TEAM_NOT_FOUND"

  # =========================================================================
  # Rule 6: boundary_precision_check (>= 2; here 3 instances on DIFFERENT metrics/endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ranking_points_auto_threshold_strict_gt
        grounds:
          - calculations.ranking_points
        distinguishing_aspect: |
          Metric: auto_points. Endpoint: match score. AUTO_BONUS_THRESHOLD = 25 with STRICT >
          (not >=). A breakdown with auto_points == 25 must NOT trigger the bonus; auto_points
          == 26 must trigger +1 RP. Pin at the boundary: 25 → no bonus; 26 → +1 RP.
        test_recipe:
          setup:
            - "Match M1 ON_FIELD; breakdown red auto_points=25, teleop=50, endgame=0, fouls=0, tech=0, card=NONE"
            - "Breakdown blue auto_points=26, teleop=50, endgame=0, fouls=0, tech=0, card=NONE"
          setup_api_calls:
            # (full chain elided)
            - { call: "POST /frc-events", payload: { event_code: "BP1", event_name: "BP1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m1}/score", payload: {}, as: Scorekeeper }
          assert:
            # Red: score=75; Blue: score=76. Red loses (0 RP) + no auto bonus = 0 RP.
            # Blue: win (2 RP) + auto bonus (1 RP, 26>25) = 3 RP.
            - "Match.${m1}.red_ranking_points == 0"
            - "Match.${m1}.blue_ranking_points == 3"

      - name: registered_team_count_boundary
        grounds:
          - validations[priority=11]
          - state_machines.Team.ROSTER_SUBMITTED_to_CONFIRMED
        distinguishing_aspect: |
          Metric: registered_team_count vs team_capacity (zero-count / capacity edge).
          Endpoint: team confirm. With team_capacity=2 and registered_team_count==2, the next
          confirm MUST fail with ERR_EVENT_FULL. With registered_team_count==1, the confirm
          MUST succeed and registered_team_count becomes 2 (boundary inclusive).
        test_recipe:
          setup:
            - "Event with team_capacity=2"
            - "Teams t1, t2 already CONFIRMED (registered_team_count=2)"
            - "Team t3 in ROSTER_SUBMITTED"
          setup_api_calls:
            # (chain elided)
            - { call: "POST /frc-events", payload: { event_code: "BP2", event_name: "BP2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 2, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t3}/confirm", payload: {}, as: RegistrationOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_FULL"

      - name: field_reset_interval_boundary
        grounds:
          - calculations.generate_match_schedule
          - validations[priority=15]
        distinguishing_aspect: |
          Metric: scheduled_at interval on same field. Endpoint: match create / schedule gen.
          FIELD_RESET_MIN_SECONDS = 300. Two consecutive matches on field 1 with scheduled_at
          exactly 300s apart MUST be accepted; 299s apart MUST fail with
          ERR_FIELD_INTERVAL_VIOLATION. Boundary at exactly 300 (inclusive >=).
        test_recipe:
          setup:
            - "Event in MATCHES_RUNNING with field_count=1"
            - "Match M1 on field 1 scheduled_at=10:00:00Z"
            - "Attempt Match M2 on field 1 scheduled_at=10:04:59Z (299s after M1) → must fail"
            - "Attempt Match M3 on field 1 scheduled_at=10:05:00Z (300s after M1) → must succeed"
          setup_api_calls:
            # (chain elided)
            - { call: "POST /frc-events", payload: { event_code: "BP3", event_name: "BP3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/matches", payload: { match_number: 200, series: "QUALIFICATION", scheduled_at: "2026-04-02T10:04:59Z", field_index: 1, red_alliance_id: "${a_red}", blue_alliance_id: "${a_blue}" }, as: Scorekeeper, captures: { err1: $.data.error_id } }
            - { call: "POST /frc-events/${ev}/matches", payload: { match_number: 201, series: "QUALIFICATION", scheduled_at: "2026-04-02T10:05:00Z", field_index: 1, red_alliance_id: "${a_red}", blue_alliance_id: "${a_blue}" }, as: Scorekeeper, captures: { m3: $.data.id } }
          assert:
            - "err1 == ERR_FIELD_INTERVAL_VIOLATION"
            - "Match.${m3}.status == SCHEDULED"

  # =========================================================================
  # Rule 7: cross_entity_state_dependency (>= 2; here 3 instances across DIFFERENT pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: team_confirm_depends_on_event_posture_open
        grounds:
          - state_machines.Team.ROSTER_SUBMITTED_to_CONFIRMED
          - calculations.event_posture
        distinguishing_aspect: |
          Pair: Team → FrcEvent. Team.confirm requires FrcEvent.posture == OPEN. When posture
          flips to RESTRICTED (via critical violation or expired mentor), confirm fails with
          ERR_EVENT_FROZEN.
        test_recipe:
          setup:
            - "Event posture RESTRICTED (one open CRITICAL violation)"
            - "Team t1 in ROSTER_SUBMITTED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "XD1", event_name: "XD1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/confirm", payload: {}, as: RegistrationOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_FROZEN"

      - name: match_take_field_depends_on_field_reset_complete
        grounds:
          - state_machines.Match.QUEUED_to_ON_FIELD
          - state_machines.FieldResetLog.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Pair: Match → FieldResetLog. Match.take-field requires that the prior FieldResetLog
          on the same field is COMPLETE (or non-existent). When the reset is still IN_PROGRESS,
          take-field fails with ERR_FIELD_NOT_RESET.
        test_recipe:
          setup:
            - "Match M1 FINALIZED on field 1 with FieldResetLog in IN_PROGRESS"
            - "Match M2 QUEUED on field 1 with all 6 slots AT_FIELD"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "XD2", event_name: "XD2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m2}/take-field", payload: {}, as: QueueManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FIELD_NOT_RESET"

      - name: travel_approve_depends_on_team_qualified
        grounds:
          - state_machines.TravelBooking.PENDING_to_APPROVED
          - calculations.championship_qualification_run
        distinguishing_aspect: |
          Pair: TravelBooking → Team. TravelBooking.approve requires Team.qualified_for_championship
          == true. When team has not qualified, approve fails with ERR_NOT_QUALIFIED.
        test_recipe:
          setup:
            - "Event CLOSED; Team t1 NOT qualified"
            - "TravelBooking bk1 in PENDING"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "XD3", event_name: "XD3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/travel-bookings/${bk1}/approve", payload: {}, as: TravelOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_QUALIFIED"

  # =========================================================================
  # Rule 8: resource_temporal_overlap (>= 2; here 3 instances on DIFFERENT resources/semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: judge_interview_overlap_half_open
        grounds:
          - validations[priority=14]
        distinguishing_aspect: |
          Resource: Judge. Interval semantics: half-open [starts_at, starts_at + duration_minutes).
          Adjacent slots (one ends at exactly the time another starts) MUST NOT conflict. Overlap
          by 1 minute MUST conflict.
        test_recipe:
          setup:
            - "Judge j1 with CONFIRMED InterviewSlot s1 starts_at=10:00, duration=30 (covers 10:00..10:30 exclusive of 10:30)"
            - "Award a1 in JUDGING"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "TO1", event_name: "TO1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            # Adjacent (no conflict): starts_at=10:30, duration=30 → confirm succeeds
            - { call: "POST /frc-events/${ev}/awards/${a1}/interview-slots", payload: { team_id: "${t2}", judge_id: "${j1}", starts_at: "2026-04-02T10:30:00Z", duration_minutes: 30 }, as: JudgeAdvisor, captures: { s2: $.data.id } }
            - { call: "POST /frc-events/${ev}/awards/${a1}/interview-slots/${s2}/confirm", payload: {}, as: TeamLead, as_user_id: "${p2}" }
            # Overlap by 1 minute: starts_at=10:29, duration=30 → confirm fails
            - { call: "POST /frc-events/${ev}/awards/${a1}/interview-slots", payload: { team_id: "${t3}", judge_id: "${j1}", starts_at: "2026-04-02T10:29:00Z", duration_minutes: 30 }, as: JudgeAdvisor, captures: { s3: $.data.id } }
            - { call: "POST /frc-events/${ev}/awards/${a1}/interview-slots/${s3}/confirm", payload: {}, as: TeamLead, as_user_id: "${p3}", captures: { err: $.data.error_id } }
          assert:
            - "InterviewSlot.${s2}.status == CONFIRMED"
            - "err == ERR_JUDGE_DOUBLE_BOOKED"

      - name: field_match_interval_aggregate_capacity
        grounds:
          - validations[priority=15]
          - calculations.generate_match_schedule
        distinguishing_aspect: |
          Resource: Field (identified by event_id + field_index). Interval semantics: aggregate
          capacity — at most ONE match may be ON_FIELD per field at any time, AND consecutive
          matches on the same field must satisfy FIELD_RESET_MIN_SECONDS separation between
          scheduled_at. Different from judge_overlap: here the rule is on a venue resource with
          a buffer requirement, not on a person with strict adjacency.
        test_recipe:
          setup:
            - "Event field_count=1"
            - "Match M1 on field 1 at 10:00, status ON_FIELD"
            - "Match M2 on field 1 at 10:04:59Z, status QUEUED (cannot take-field while M1 active)"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "TO2", event_name: "TO2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m2}/take-field", payload: {}, as: QueueManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FIELD_NOT_RESET  # because M1's FieldResetLog is still IN_PROGRESS"

      - name: unbag_window_overlapping_milestones
        grounds:
          - entities.BuildSeasonMilestone.fields.window_minutes
        distinguishing_aspect: |
          Resource: BuildSeasonMilestone UNBAG_WINDOW. Interval semantics: closed interval
          [scheduled_at, scheduled_at + window_minutes] INCLUSIVE at both ends — distinct from
          the half-open judge_overlap. Two UNBAG_WINDOW milestones on the same team whose
          windows touch at exactly one endpoint DO conflict (inclusive both ends).
        test_recipe:
          setup:
            - "Team t1 with UNBAG_WINDOW milestone m1 scheduled_at=10:00, window_minutes=60 (covers 10:00..11:00 inclusive)"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "TO3", event_name: "TO3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            # Inclusive-endpoint overlap: m2 starts at 11:00 exactly → must conflict
            - { call: "POST /frc-events/${ev}/milestones", payload: { kind: "UNBAG_WINDOW", scheduled_at: "2026-04-02T11:00:00Z", window_minutes: 60 }, as: EventDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST  # overlapping UNBAG_WINDOW"

  # =========================================================================
  # Rule 9: compensating_invariant (>= 2; here 3 instances on DIFFERENT quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: registered_team_count_invariant_on_withdraw
        grounds:
          - state_machines.Team.CONFIRMED_to_WITHDRAWN
          - state_machines.Team.ROSTER_SUBMITTED_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity: FrcEvent.registered_team_count == count(Team where event_id == ev
          AND registration_status == CONFIRMED). Forward: confirm (+1). Compensating: withdraw
          (-1). Pair the two: after confirm-then-withdraw on the same team, registered_team_count
          must equal its pre-confirm value.
        test_recipe:
          setup:
            - "Event with team_capacity=10; registered_team_count == 5"
            - "Team t1 in ROSTER_SUBMITTED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CI1", event_name: "CI1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 10, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { pre_count: $.data.registered_team_count } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/confirm", payload: {}, as: RegistrationOfficer }
            - { call: "POST /frc-events/${ev}/teams/${t1}/withdraw", payload: {}, as: TeamLead, as_user_id: "${p1}" }
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { post_count: $.data.registered_team_count } }
          assert:
            - "post_count == pre_count"

      - name: ranking_points_reversal_on_replay
        grounds:
          - calculations.ranking_points
          - state_machines.Match.SCORED_to_REPLAYED
        distinguishing_aspect: |
          Conserved quantity: sum over all teams of matches_played * ranking_score is preserved
          when a match transitions SCORED -> REPLAYED (the prior contribution is reversed).
          Forward: finalize (+N). Compensating: replay (-N). After both, matches_played and
          ranking_score must equal their pre-finalize values.
        test_recipe:
          setup:
            - "Match M1 SCORED with blue_ranking_points=3 to team t4"
            - "Team t4: matches_played=0, ranking_score=null (before finalize)"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CI2", event_name: "CI2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
            - { call: "GET /frc-events/${ev}/teams/${t4}", as: Scorekeeper, captures: { pre_played: $.data.matches_played, pre_score: $.data.ranking_score } }
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m1}/finalize", payload: {}, as: HeadReferee, as_user_id: "${ia}" }
            - { call: "POST /frc-events/${ev}/matches/${m1}/replay", payload: {}, as: HeadReferee, as_user_id: "${ia}" }
            - { call: "GET /frc-events/${ev}/teams/${t4}", as: Scorekeeper, captures: { post_played: $.data.matches_played, post_score: $.data.ranking_score } }
          assert:
            - "post_played == pre_played"
            - "post_score == pre_score"

      - name: budget_invariant_on_part_order_cancel
        grounds:
          - state_machines.PartOrder.SUBMITTED_to_CANCELLED
          - calculations.travel_reimbursement
        distinguishing_aspect: |
          Conserved quantity: team's total committed build-season budget. Forward: submit (+cost).
          Compensating: cancel (-cost). After submit-then-cancel on the same PartOrder, the team's
          remaining budget equals its pre-submit value. Distinct from registered_team_count
          (a count) and ranking_points (an average); this is a fiscal quantity.
        test_recipe:
          setup:
            - "Team t1 with budget_remaining = 100000"
            - "PartOrder o1 in DRAFT with order_total_cents = 5000"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CI3", event_name: "CI3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            # (chain elided)
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/part-orders/${o1}/submit", payload: {}, as: TeamLead, as_user_id: "${p1}" }
            - { call: "POST /frc-events/${ev}/teams/${t1}/part-orders/${o1}/cancel", payload: {}, as: TeamLead, as_user_id: "${p1}" }
          assert:
            - "Team.${t1}.budget_remaining == 100000"
