# =====================================================================================
# §1.9  SCAFFOLD CORNER DESIGN - task_2529 Artist Residency Program Administration
#
# Breadth probe over the §1.1-§1.7 surface. Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; nothing outside that taxonomy is
# invented here. Corners already asserted by a §1.8 instance appear as `excluded_because:`
# stubs naming that instance.
#
# Walk summary:
#   entities                         9 instances  (creation / required_fields / defaults /
#                                    computed_fields / system_fields / not_found / immutability /
#                                    listing / flat-topology FK integrity)
#   state_machines                   7 instances  (2 stubs)
#   calculations                    12 instances  (5 stubs)
#   validations                      6 instances  (1 stub)
#   endpoints                        4 instances
#   errors                           4 instances
#   rbac                             4 instances
#   cross_cutting_complexity_layers  6 instances  (2 stubs)
#   consistency_model                1 instance
#   ----------------------------------------------------------------------------------
#   TOTAL                           53 instances  (10 excluded_because stubs)
#
# Conventions (identical to §1.8):
#   * The logical clock reads 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it.
#   * Roles travel as X-User-Role (`as:`) and actor identity as X-User-ID (`as_user_id:`).
#   * CHAIN-SHORT = clock -> POST /cycles -> POST /disciplines -> POST /applicants
#     -> POST /cycles/{id}/stage OPEN -> POST /residencies -> POST /residencies/{id}/schedule
#     (an invited residency; needs no application, panel or slate).
#   * Every asserted number is pre-computed from the §1.3 formulas and written as a literal.
# =====================================================================================
scaffold_corner_design:

  # ===================================================================================
  # From Table 1 (Entities)
  # ===================================================================================
  - section: entities
    instances:

      - name: cycle_creation_persists_every_declared_input_field
        claim_type: creation
        grounds: ["entities.Cycle", "endpoints[POST /cycles]"]
        distinguishing_aspect: "All eleven required inputs supplied -> 201 and every one of them is echoed unchanged in $.data, with the two ledger fields initialised by the endpoint's declared side effect rather than by the caller."
        test_recipe:
          setup: ["Empty database; the logical clock is untouched, so it reads the mandatory startup default 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
          assert:
            - "response code 201 with response_type == 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "every input is stored verbatim: code == 'CY-2027', open_at == '2026-08-01T00:00:00Z', close_at == '2026-09-30T00:00:00Z', application_fee_cents == 5000, panel_quorum == 2, cohort_target_size == 10, alumni_reserve_pct == 0.25, stipend_pool_cents == 20000000, slate_min_score == 60.00, stipend_weekly_rate_cents == 70000, session_length_options_weeks == [4, 5, 8, 9]"
            - "the declared side effect ran: stipend_committed_cents == 0 and stipend_uncommitted_cents == 20000000 (equal to stipend_pool_cents)"
            - "status == 'DRAFT' (the Cycle machine's initial_state), and the remaining computed fields take their declared defaults: slots_filled_count 0, slots_open_count 10, slate_ready_count 0, alumni_reserved_slots 0, panel_review_complete false"
            - "GET /cycles/${cyc} returns a byte-identical body for every field above (consistency_model immediate)"

      - name: cycle_creation_missing_panel_quorum_rejected
        claim_type: required_fields
        grounds: ["entities.Cycle.panel_quorum", "endpoints[POST /cycles]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "panel_quorum has source: input with NO default, so omitting it is a request-shape failure (ERR_VALIDATION 400) and NOT a business rejection; the constraint '>= 2' is separately falsifiable by sending 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code 400 with error_id == 'ERR_VALIDATION' and response_type == 'error'"
            - "no Cycle row is created: GET /cycles returns total_count == 0"
            - "the same omission of any other no-default input (code, open_at, close_at, application_fee_cents, cohort_target_size, alumni_reserve_pct, stipend_pool_cents, slate_min_score, stipend_weekly_rate_cents, session_length_options_weeks) also yields 400 ERR_VALIDATION"
            - "range violations map to the SAME error rather than to a business code: panel_quorum 1 (below the declared '>= 2'), alumni_reserve_pct 1.5 (outside [0,1]), slate_min_score 100.01 and an empty session_length_options_weeks each return 400 ERR_VALIDATION"
            - "close_at '2026-07-01T00:00:00Z' (not strictly after open_at) is also 400 ERR_VALIDATION, because the ordering is declared as a field constraint and not as a §1.4 row"

      - name: discipline_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds: ["entities.Discipline.requires_hazmat_review", "entities.Discipline.required_ventilation_class", "endpoints[POST /disciplines]"]
        distinguishing_aspect: "requires_hazmat_review (default false) and required_ventilation_class (default NONE) are the only two optional inputs on Discipline; omitting them must yield those exact values, not null - and the NONE default is what makes VENTILATION_RANK[NONE] == 0 the floor for the P37 ventilation comparison."
        test_recipe:
          setup: ["One DRAFT cycle, since POST /disciplines requires the cycle to be in DRAFT."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
          trigger:
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "TEXTILE", name: "Textile", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"],
                         cohort_min_slots: 1, cohort_max_slots: 4, required_capability_tags: ["CLEAN_ONLY"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
          assert:
            - "response code 201 with requires_hazmat_review == false and required_ventilation_class == 'NONE' - the declared defaults, not null and not omitted from the body"
            - "an explicitly supplied value overrides the default: the same payload with required_ventilation_class 'FUME_HOOD' and requires_hazmat_review true stores exactly those values"
            - "Discipline has common_fields: false, so the response carries NO version field and there is no PATCH /disciplines/{id} in §1.5 - the row is immutable once created, as its endpoint description states"
            - "the default is load-bearing downstream: a residency in TEXTILE may be hosted by a studio with ventilation_class 'NONE' because VENTILATION_RANK['NONE'] 0 >= VENTILATION_RANK['NONE'] 0, whereas the FUME_HOOD variant would need rank 2"

      - name: applicant_is_international_computed_and_client_value_ignored
        claim_type: computed_fields
        grounds: ["entities.Applicant.is_international", "entities.Applicant.completed_residency_count", "endpoints[POST /applicants]", "constants.HOST_COUNTRY"]
        distinguishing_aspect: "is_international is source: computed as citizenship_country != HOST_COUNTRY ('US'); it is not in POST /applicants' input list, so a client-sent value is not merely overridden - it is an unknown field. The pair US/FR proves both branches from otherwise identical payloads."
        test_recipe:
          setup: ["Empty database. HOST_COUNTRY is the constant 'US'."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_us: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_fr: "$.data.id" }
          assert:
            - "the US applicant has is_international == false ('US' != 'US' is false)"
            - "the FR applicant has is_international == true ('FR' != 'US' is true)"
            - "both have completed_residency_count == 0, its declared default, because no Residency of theirs is COMPLETED yet"
            - "treaty_country IS an input (default false) and is stored as sent: false for the US applicant, true for the FR applicant - it is not derived from citizenship_country"
            - "is_international is not a client-writable field: sending is_international false alongside citizenship_country 'FR' is an unknown body key and returns 400 ERR_VALIDATION"
            - "the flag drives real behaviour rather than being cosmetic: an invited residency for ${art_fr} gets visa_required true and an auto-created VisaCase, while one for ${art_us} gets visa_required false and no VisaCase (GET /visa-cases returns total_count 0 for it)"
            - "the derivation reads citizenship_country only: a lowercase 'us' is rejected as 400 ERR_VALIDATION by the 'exactly 2 uppercase letters' constraint rather than being normalised into a domestic applicant"

      - name: cycle_system_fields_are_server_generated_and_client_values_ignored
        claim_type: system_fields
        grounds: ["entities.Cycle.status", "entities.Cycle", "endpoints[POST /cycles]", "endpoints[PATCH /cycles/{id}]"]
        distinguishing_aspect: "id, created_at, updated_at and version are common_fields on Cycle and status is source: system with default DRAFT. None appears in POST /cycles' input:, so all five are server-owned; version must start at a stable value and increment on the FIRST write, which PATCH provides."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id", v0: "$.data.version" }
          trigger:
            - call: "PATCH /cycles/${cyc}"
              payload: { cohort_target_size: 12, stipend_pool_cents: 24000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.version" }
          assert:
            - "on creation the server minted id, created_at, updated_at and version, and none of them was accepted from the caller: adding id, created_at or version to the POST body returns 400 ERR_VALIDATION"
            - "status == 'DRAFT' on creation even though status is not an input - it is source: system with default DRAFT and is only ever moved by POST /cycles/{id}/stage"
            - "sending status 'OPEN' in the POST body returns 400 ERR_VALIDATION rather than creating an OPEN cycle"
            - "the PATCH returns 200 and version increments by exactly 1 (${v1} == ${v0} + 1), while created_at is unchanged and updated_at has advanced"
            - "the PATCH's declared side effect ran: cohort_target_size 12 and stipend_pool_cents 24000000 give stipend_uncommitted_cents == 24000000 and slots_open_count == 12, both recomputed and neither supplied by the caller"
            - "PATCH is DRAFT-only per its description: after POST /cycles/${cyc}/stage to OPEN, the same PATCH returns 409 ERR_CYCLE_NOT_OPEN and version does not move"

      - name: get_residency_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESIDENCY_NOT_FOUND]", "endpoints[GET /residencies/{id}]"]
        distinguishing_aspect: "A syntactically valid but non-existent id must yield the entity's OWN 404 code, not a generic 400 and not an empty 200 body; and the per-entity codes must not be conflated - the same unknown id on a different collection returns that collection's code."
        test_recipe:
          setup: ["Empty database - no lookup target is needed to observe a 404."]
          setup_api_calls: []
          trigger:
            - call: "GET /residencies/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code 404 with error_id == 'ERR_RESIDENCY_NOT_FOUND' and response_type == 'error'"
            - "the code is entity-specific, not shared: GET /cycles/{same id} returns 'ERR_CYCLE_NOT_FOUND', GET /applications/{same id} 'ERR_APPLICATION_NOT_FOUND', GET /studios/{same id} 'ERR_STUDIO_NOT_FOUND', GET /housing-units/{same id} 'ERR_HOUSING_UNIT_NOT_FOUND', GET /visa-cases/{same id} 'ERR_VISA_CASE_NOT_FOUND', GET /stipend-disbursements/{same id} 'ERR_DISBURSEMENT_NOT_FOUND' and GET /obligations/{same id} 'ERR_OBLIGATION_NOT_FOUND'"
            - "existence outranks everything else on the ladder: POST /residencies/{unknown id}/lifecycle with action 'CHECK_IN' also returns 404 ERR_RESIDENCY_NOT_FOUND rather than any state or safety error"
            - "the 404 is about the path id, not the body: a POST /studio-assignments naming an unknown residency_id returns 404 ERR_RESIDENCY_NOT_FOUND too, since the FK target must exist before any state rule is evaluated"
            - "list endpoints do NOT 404 on an unmatched filter: GET /residencies with cycle_id set to the unknown id returns 200 with total_count == 0 and an empty data array"

      - name: portfolio_item_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.PortfolioItem", "endpoints[POST /portfolio-items]", "endpoints[DELETE /portfolio-items/{id}]"]
        distinguishing_aspect: "PortfolioItem declares common_fields: false, so the row carries id but NO version / created_at / updated_at, and §1.5 offers create, read, list and delete but deliberately no PATCH. Correction is therefore delete-then-recreate, and each of those two writes must move the PARENT Application's version because that is where the derived counters live."
        test_recipe:
          setup: ["A DRAFT application in an OPEN cycle, which is the only status from which portfolio items may be attached or removed."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art}"
              captures: { app: "$.data.id", app_v0: "$.data.version" }
          trigger:
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate I", file_size_mb: 12.5 }
              as: Applicant
              as_user_id: "${art}"
              captures: { pi: "$.data.id" }
            - call: "DELETE /portfolio-items/${pi}"
              payload: {}
              as: Applicant
              as_user_id: "${art}"
          assert:
            - "the created item returns 201 and its body carries id, application_id, media_type 'IMAGE', title 'Plate I', file_size_mb 12.5 and hazardous_materials_declared false (its declared default) - and NO version, created_at or updated_at field, because common_fields is false"
            - "there is no PATCH /portfolio-items/{id} anywhere in §1.5, so the row cannot be edited in place; PATCH against the path is not a declared endpoint"
            - "the create moved the PARENT instead: Application.portfolio_item_count == 1, portfolio_media_types == ['IMAGE'], hazardous_materials_declared false, and Application.version == ${app_v0} + 1"
            - "the delete returns 204 with an empty body and reverses the derived state: portfolio_item_count == 0, portfolio_media_types == [] and Application.version == ${app_v0} + 2 (the counter is restored, the version keeps climbing)"
            - "deleting the same item twice returns 404 ERR_PORTFOLIO_ITEM_NOT_FOUND rather than a second 204, so the delete is not silently idempotent"
            - "immutability is scoped by parent state, per the endpoint description: after POST /applications/${app}/submit the same DELETE returns 409 ERR_APPLICATION_STATE_INVALID, because items may only be removed from an unsubmitted application"

      - name: applications_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults", "endpoints[GET /applications]"]
        distinguishing_aspect: "The declared pagination contract is limit default 10 / min 1 / max 100 and offset default 0, with total_count reporting the FILTERED population and has_more derived from offset + returned < total_count. Three applications with limit 2 make every one of those four fields separately observable, and the filter must narrow total_count rather than only the page."
        test_recipe:
          setup: ["One OPEN cycle with two disciplines and three applicants, each holding one DRAFT application: two in SCULPT and one in PRINT."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc_s: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "PRINT", name: "Printmaking", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 4, required_capability_tags: ["PRINT_PRESS"],
                         required_ventilation_class: "NONE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc_p: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Tomas Bek", email: "tomas.bek@example.org",
                         affiliation_org: "Foundry Lane", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2100000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art3: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc_s}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art1}"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc_s}",
                         requested_session_length_weeks: 8, project_statement: "Cast bronze reliefs",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art2}"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art3}", discipline_id: "${disc_p}",
                         requested_session_length_weeks: 4, project_statement: "Relief prints",
                         fee_waiver_requested: false }
              as: Applicant
              as_user_id: "${art3}"
          trigger:
            - call: "GET /applications"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "the unfiltered list returns 200 with response_type == 'array', total_count == 3, has_more == false, and 3 rows (limit defaults to 10, offset to 0)"
            - "GET /applications?limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true"
            - "GET /applications?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false - the LAST page reports has_more false even though limit was not exhausted"
            - "total_count reports the FILTERED population, not the table: GET /applications?discipline_id=${disc_p} returns total_count == 1, and ?status=SUBMITTED returns total_count == 0 with an empty array and has_more false"
            - "filters compose: GET /applications?cycle_id=${cyc}&discipline_id=${disc_s}&limit=1&offset=0 returns 1 row with total_count == 2 and has_more == true"
            - "out-of-bounds pagination is a request-shape error, not a clamp: limit=0, limit=101 and offset=-1 each return 400 ERR_VALIDATION per the declared bounds min 1 / max 100"
            - "offset beyond the population is legal and empty: ?offset=99 returns 200 with 0 rows, total_count == 3 and has_more == false"

      - name: application_naming_a_discipline_from_another_cycle_rejected
        claim_type: flat
        grounds: ["errors[ERR_DISCIPLINE_CYCLE_MISMATCH]", "entities.Application.discipline_id", "endpoints[POST /applications]"]
        distinguishing_aspect: "entity_topology is flat, so ownership lives only in FK fields and NOT in the URL - POST /applications carries cycle_id and discipline_id as peers, which makes an inconsistent PAIR expressible. Both ids exist, so this is neither a 404 nor a plain ERR_VALIDATION: it is the cross-reference integrity check ERR_DISCIPLINE_CYCLE_MISMATCH (422)."
        test_recipe:
          setup: ["TWO cycles, each with its own discipline. Cycle A is OPEN (so applications may be created against it); cycle B stays in DRAFT and owns discipline B. One applicant."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027A", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
