              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /commission/consent-agreements/${ca_id}/respondent-response"
              payload: { action: "COUNTER", counter_fine_cents: 50000, counter_suspension_days: 0 }
              as: Respondent
              as_user_id: "${sp_id}"
            - call: "POST /commission/consent-agreements/${ca_id}/commission-action"
              payload: { action: "REVISE", proposed_fine_cents: 150000, proposed_suspension_days: 20 }
              as: CommissionCounsel
              as_user_id: "counsel-01"
            - call: "POST /commission/consent-agreements/${ca_id}/respondent-response"
              payload: { action: "COUNTER", counter_fine_cents: 75000, counter_suspension_days: 5 }
              as: Respondent
              as_user_id: "${sp_id}"
            - call: "POST /commission/consent-agreements/${ca_id}/commission-action"
              payload: { action: "REVISE", proposed_fine_cents: 120000, proposed_suspension_days: 15 }
