  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "response_envelope"]
        distinguishing_aspect: "Immediate consistency: the activate response body itself carries enrollment_status ACTIVE and a non-null activated_at (no re-read), and a portfolio read right after its ACCEPTED evaluation shows ACCEPTED with decided_at set."
        test_recipe:
          setup: ["year OPEN; family; grade-4 student; enrollment REGISTERED with ACKNOWLEDGED notice and APPROVED plan"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Im", district_code: "D-85" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Im", date_of_birth: "2016-01-01" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-85" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/portfolios", payload: {}, as: Parent, as_user_id: "${fam}", captures: { por: $.data.id } }
          trigger:
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar, captures: { est: $.data.enrollment_status, eact: $.data.activated_at } }
            - { call: "POST /portfolios/${por}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /portfolios/${por}/evaluations", payload: { overall_outcome: "ACCEPTED", subject_scores: [ { subject: "READING", score: 4 }, { subject: "WRITING", score: 4 }, { subject: "MATH", score: 4 }, { subject: "SCIENCE", score: 4 }, { subject: "SOCIAL_STUDIES", score: 4 } ] }, as: Reviewer, as_user_id: "rev-1", captures: { ev_out: $.data.overall_outcome, ev_att: $.data.attempt_number } }
            - { call: "GET /portfolios/${por}", payload: {}, as: Registrar, captures: { pst: $.data.status, pdec: $.data.decided_at } }
          assert:
            - "activate response body: enrollment_status == ACTIVE, activated_at != null (visible in the same response, no re-read)"
            - "evaluation response: overall_outcome == ACCEPTED, attempt_number == 1"
            - "immediate GET /portfolios/${por}: status == ACCEPTED and decided_at != null"
