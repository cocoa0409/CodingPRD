# =============================================================================
# Co-Signer & Lease-Guarantor Service — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Co-Signer & Lease-Guarantor Service: applicant & income/credit, guarantee
  approval & fee, landlord agreement & coverage, claim & recovery from renter,
  renewal, default, portfolio risk, compliance

domain_name: cosigner-lease-guarantor
api_prefix: ""   # flat topology: all resources are top-level peers linked by foreign keys

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency          # OCC on Guarantee.version at claim creation
    - dual_variant_calculation        # guarantee fee (provisional vs final), claim payout (chronological vs accelerated)
    - cascading_side_effects          # claim payout → coverage debit → recovery plan → applicant; default → applicant → compliance review
    - contagion_risk_propagation      # portfolio risk-weighted exposure recompute + posture gate

  entity_topology: flat               # peer entities linked by FK references; no nested ownership URLs
  state_machine_shape: cyclic         # Guarantee ACTIVE⇄RENEWAL_PENDING loop; Claim branching fork
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # underwriter ≠ claims-adjuster on same guarantee; compliance opener ≠ clearer
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Guarantor book / program name" }
      - { name: exposure_cap_cents, type: integer, source: input, description: "Maximum risk-weighted exposure the portfolio may carry", constraints: "> 0" }
      - { name: total_active_coverage_cents, type: integer, source: computed, default: 0, description: "Incrementally maintained sum of total_coverage_cents over guarantees in {ACTIVE, RENEWAL_PENDING}" }
      - { name: total_outstanding_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding_cents over recovery plans in status ACTIVE" }
      - { name: risk_weighted_exposure_cents, type: integer, source: computed, default: 0, description: "round(sum of remaining_coverage_cents * TIER_WEIGHT[risk_tier]) over guarantees in {ACTIVE, RENEWAL_PENDING}" }
      - { name: posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED — RESTRICTED (soft warning) when risk_weighted_exposure_cents >= round(POSTURE_WARN_FRACTION * exposure_cap_cents); distinct from the hard approve gate at > exposure_cap_cents" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prospective renter legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported gross annual income in cents", constraints: "> 0" }
      - { name: credit_score, type: integer, source: input, description: "Pulled credit score", constraints: "300..850" }
      - { name: monthly_obligations_cents, type: integer, source: input, description: "Existing monthly debt obligations in cents", constraints: ">= 0" }
      - { name: employment_type, type: enum, source: input, description: "SALARIED | SELF_EMPLOYED | RETIRED | UNEMPLOYED" }
      - { name: risk_tier, type: enum, source: computed, default: null, description: "A | B | C | D — set by verify from credit_score + debt-to-income; null until VERIFIED" }
      - { name: debt_to_income, type: number, source: computed, default: null, description: "monthly_obligations_cents / (annual_income_cents / 12); set by verify" }
      - { name: default_count, type: integer, source: computed, default: 0, description: "Number of guarantees on this applicant that reached DEFAULTED" }
      - { name: open_recovery_count, type: integer, source: computed, default: 0, description: "Number of RecoveryPlans in status ACTIVE attributed to this applicant" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | VERIFIED | DECLINED" }

  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Landlord / property manager legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (landlords have no suspension workflow in v1; the field is a stable ACTIVE marker for forward compatibility)" }

  - name: Guarantee
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: input, description: "FK -> Portfolio.id; the book this guarantee is underwritten into" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the renter being guaranteed" }
      - { name: landlord_id, type: string, source: computed, default: null, description: "FK -> Landlord.id; null until an agreement is countersigned, then bound to that landlord" }
      - { name: unit_id, type: string, source: input, description: "Opaque identifier of the leased unit" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Contract monthly rent in cents", constraints: "> 0" }
      - { name: coverage_months, type: integer, source: input, description: "Months of rent the guarantee will cover", constraints: "1..MAX_COVERAGE_MONTHS (12)" }
      - { name: term_months, type: integer, source: input, description: "Lease term length in months, used for fee term factor", constraints: "> 0" }
      - { name: lease_start_date, type: datetime, source: input, description: "Lease coverage start (ISO 8601 UTC)" }
      - { name: lease_end_date, type: datetime, source: input, description: "Lease coverage end (ISO 8601 UTC); must be after lease_start_date" }
      - { name: per_month_coverage_cents, type: integer, source: computed, description: "round(monthly_rent_cents * COVERED_FRACTION) — whole cents, half-up" }
      - { name: total_coverage_cents, type: integer, source: computed, description: "per_month_coverage_cents * coverage_months" }
      - { name: remaining_coverage_cents, type: integer, source: computed, default: null, description: "Available coverage; set to total_coverage_cents at activation, debited by claim payouts, reset on renewal" }
      - { name: paid_out_cents, type: integer, source: computed, default: 0, description: "Cumulative claim payouts against this guarantee in the current term" }
      - { name: risk_tier, type: enum, source: computed, default: null, description: "Copied from applicant.risk_tier at approve; drives final fee and portfolio weight" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee quoted at creation using PROVISIONAL_TIER rate (C)" }
      - { name: final_fee_cents, type: integer, source: computed, default: null, description: "Fee locked at approve using verified risk_tier" }
      - { name: rent_to_income_ratio, type: number, source: computed, default: null, description: "monthly_rent_cents / (applicant.annual_income_cents / 12); computed at approve" }
      - { name: fee_paid, type: boolean, source: computed, default: false, description: "True once the final fee has been paid" }
      - { name: underwritten_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Underwriter that approved this guarantee; used for claim-approval segregation of duties" }
      - { name: renewal_count, type: integer, source: computed, default: 0, description: "Number of completed renewals" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "QUOTED | APPROVED | ACTIVE | RENEWAL_PENDING | EXHAUSTED | DEFAULTED | CANCELLED" }

  - name: LandlordAgreement
    parent: null
    common_fields: true
    fields:
      - { name: guarantee_id, type: string, source: input, description: "FK -> Guarantee.id; the guarantee this agreement covers" }
      - { name: landlord_id, type: string, source: input, description: "FK -> Landlord.id; must equal the acting Landlord's X-User-ID" }
      - { name: unit_id, type: string, source: input, description: "Unit the coverage applies to (must match the guarantee's unit_id)" }
      - { name: coverage_start_date, type: datetime, source: input, description: "Coverage window start (ISO 8601 UTC)" }
      - { name: coverage_end_date, type: datetime, source: input, description: "Coverage window end (ISO 8601 UTC); must be after coverage_start_date" }
      - { name: max_coverage_cents, type: integer, source: input, description: "Landlord-requested coverage ceiling; informational cap", constraints: ">= 0" }
      - { name: notice_period_days, type: integer, source: input, description: "Days after a renter default within which a claim must be filed", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SIGNED | ACTIVE | TERMINATED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: guarantee_id, type: string, source: input, description: "FK -> Guarantee.id; the guarantee claimed against" }
      - { name: landlord_id, type: string, source: computed, default: null, description: "FK -> Landlord.id; copied from the guarantee's bound landlord at creation" }
      - { name: default_date, type: datetime, source: input, description: "Date the renter first defaulted (ISO 8601 UTC)" }
      - { name: missed_months, type: integer, source: input, description: "Number of already-missed rent months claimed", constraints: "> 0" }
      - { name: acceleration_requested, type: boolean, source: input, default: false, description: "When true, payout uses the forward-looking (accelerated full-term) variant instead of chronological" }
      - { name: payout_variant, type: enum, source: computed, default: null, description: "CHRONOLOGICAL | ACCELERATED — selected from acceleration_requested at approve" }
      - { name: payout_amount_cents, type: integer, source: computed, default: null, description: "Approved payout, computed at approve and capped at guarantee.remaining_coverage_cents" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | APPROVED | PAID | DENIED | WITHDRAWN" }

  - name: RecoveryPlan
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: computed, description: "FK -> Claim.id; the paid claim this plan recovers" }
      - { name: applicant_id, type: string, source: computed, description: "FK -> Applicant.id; the renter the debt is recovered from" }
      - { name: principal_cents, type: integer, source: computed, description: "= originating claim.payout_amount_cents; fixed at creation" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over installments in status POSTED" }
      - { name: outstanding_cents, type: integer, source: computed, description: "principal_cents - recovered_cents; invariant outstanding + recovered == principal" }
      - { name: monthly_installment_cents, type: integer, source: input, description: "Agreed monthly repayment amount from the renter", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SETTLED | WRITTEN_OFF" }

  - name: RecoveryInstallment
    parent: null
    common_fields: true
    fields:
      - { name: recovery_plan_id, type: string, source: input, description: "FK -> RecoveryPlan.id; the plan this installment pays down" }
      - { name: amount_cents, type: integer, source: input, description: "Installment amount received in cents", constraints: "> 0" }
      - { name: received_date, type: datetime, source: system, description: "Logical-clock timestamp when the installment was recorded" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: guarantee_id, type: string, source: input, description: "FK -> Guarantee.id; the guarantee placed under review" }
      - { name: reason, type: enum, source: input, description: "KYC_MISMATCH | SANCTIONS_HIT | FRAUD_SUSPECTED | AUTO_DEFAULT_TRIGGER" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer that opened the review; used for clear segregation of duties" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Free-text note recorded at clear/uphold" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLEARED | UPHELD" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: guarantee_id, type: string, source: system, description: "FK -> Guarantee.id; the guarantee this money movement belongs to" }
      - { name: entry_type, type: enum, source: system, description: "FEE_CHARGED | CLAIM_PAYOUT | COVERAGE_RESET" }
      - { name: amount_cents, type: integer, source: system, description: "Signed magnitude of the movement in cents" }
      - { name: direction, type: enum, source: system, description: "DEBIT | CREDIT" }
      - { name: balance_after_cents, type: integer, source: system, description: "guarantee.remaining_coverage_cents immediately after this entry (null for FEE_CHARGED)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Applicant
    initial_state: DRAFT
    terminal_states: [DECLINED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /applicants/{id}/verify"
        actor: Underwriter
        preconditions:
          - "credit_score >= CREDIT_FLOOR (580) AND employment_type != UNEMPLOYED, else the transition goes to DECLINED"
        side_effects:
          - "Compute debt_to_income = monthly_obligations_cents / (annual_income_cents / 12)"
          - "Compute risk_tier via applicant_risk_tier calculation"
      - from: DRAFT
        to: DECLINED
        trigger: "POST /applicants/{id}/verify"
        actor: Underwriter
        preconditions:
          - "credit_score < CREDIT_FLOOR (580) OR employment_type == UNEMPLOYED"
        side_effects:
          - "risk_tier stays null"
        note: "DECLINED is terminal; a declined applicant cannot back new guarantees."

  - entity: Guarantee
    initial_state: QUOTED
    terminal_states: [EXHAUSTED, DEFAULTED, CANCELLED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /guarantees/{id}/approve"
        actor: Underwriter
        preconditions:
          - "applicant.status == VERIFIED (business_referential, ERR_APPLICANT_NOT_VERIFIED)"
          - "rent_to_income_ratio < RENT_INCOME_MAX (0.40), else ERR_RENT_TO_INCOME_EXCEEDED"
          - "projected risk-weighted exposure <= portfolio.exposure_cap_cents (business_fiscal, ERR_EXPOSURE_CAP_EXCEEDED)"
        side_effects:
          - "Copy risk_tier from applicant.risk_tier"
          - "Compute rent_to_income_ratio"
          - "Compute final_fee_cents via guarantee_fee (final variant)"
          - "Set underwritten_by_user_id = acting X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /guarantees/{id}/activate"
        actor: Underwriter
        preconditions:
          - "fee_paid == true (business_fiscal, ERR_FEE_NOT_PAID)"
          - "an agreement in status ACTIVE exists for this guarantee (business_referential, ERR_AGREEMENT_NOT_ACTIVE)"
          - "no ComplianceReview in status OPEN references this guarantee (business_safety, ERR_COMPLIANCE_HOLD)"
          - "applicant has no other guarantee in {ACTIVE, RENEWAL_PENDING} whose [lease_start_date, lease_end_date) overlaps this one (business_temporal, ERR_APPLICANT_COVERAGE_OVERLAP)"
        side_effects:
          - "remaining_coverage_cents = total_coverage_cents; paid_out_cents = 0"
          - "portfolio.total_active_coverage_cents += total_coverage_cents (compensating_invariant: active-coverage conservation)"
          - "Portfolio risk_weighted_exposure_cents recomputed"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /guarantees/{id}/renew"
        actor: Underwriter
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "fee_paid = false (renewal fee must be re-collected)"
        note: "Cyclic: RENEWAL_PENDING returns to ACTIVE via confirm-renewal."
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /guarantees/{id}/confirm-renewal"
        actor: Underwriter
        preconditions:
          - "fee_paid == true (renewal fee collected, ERR_FEE_NOT_PAID)"
        side_effects:
          - "renewal_count += 1"
          - "lease_end_date extended by term_months"
          - "remaining_coverage_cents reset to total_coverage_cents; paid_out_cents = 0"
          - "Append LedgerEntry(entry_type=COVERAGE_RESET, direction=CREDIT, balance_after_cents=total_coverage_cents)"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /guarantees/{id}/declare-default"
        actor: Underwriter | ClaimsAdjuster
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "applicant.default_count += 1 (cascade link 1)"
          - "If applicant.default_count >= 1 a ComplianceReview(status=OPEN, reason=AUTO_DEFAULT_TRIGGER) is auto-created on this guarantee (cascade link 2, caused by the applicant mutation)"
          - "portfolio.total_active_coverage_cents -= total_coverage_cents (compensating_invariant: active-coverage conservation)"
          - "Any ACTIVE LandlordAgreement for this guarantee → TERMINATED"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when remaining_coverage_cents reaches 0 after a claim payout)"
        actor: system
        preconditions:
          - "remaining_coverage_cents == 0"
        side_effects:
          - "portfolio.total_active_coverage_cents -= total_coverage_cents"
          - "Any ACTIVE LandlordAgreement for this guarantee → TERMINATED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /guarantees/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /guarantees/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Any SIGNED or ACTIVE LandlordAgreement for this guarantee → TERMINATED"

  - entity: LandlordAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /agreements/{id}/sign"
        actor: Landlord
        preconditions:
          - "acting Landlord owns the agreement (landlord_id == X-User-ID)"
        side_effects: []
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /agreements/{id}/countersign"
        actor: Underwriter
        preconditions:
          - "referenced guarantee.status == APPROVED (cross_entity_state_dependency, ERR_GUARANTEE_NOT_APPROVED)"
        side_effects:
          - "guarantee.landlord_id = agreement.landlord_id (binds the guarantee to this landlord)"
      - from: DRAFT
        to: TERMINATED
        trigger: "system (cascade when the guarantee is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: TERMINATED
        trigger: "system (cascade when the guarantee is CANCELLED/DEFAULTED/EXHAUSTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (cascade when the guarantee leaves ACTIVE via DEFAULTED/EXHAUSTED/CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "acting X-User-ID != guarantee.underwritten_by_user_id (segregation_of_duties, ERR_SEGREGATION_OF_DUTIES)"
          - "guarantee.remaining_coverage_cents > 0 (business_fiscal, ERR_COVERAGE_EXHAUSTED)"
        side_effects:
          - "payout_variant = ACCELERATED if acceleration_requested else CHRONOLOGICAL"
          - "Compute payout_amount_cents via claim_payout, capped at guarantee.remaining_coverage_cents"
          - "guarantee.remaining_coverage_cents -= payout_amount_cents; guarantee.paid_out_cents += payout_amount_cents (cascade link 1)"
          - "Append LedgerEntry(entry_type=CLAIM_PAYOUT, direction=DEBIT, amount_cents=payout_amount_cents, balance_after_cents=guarantee.remaining_coverage_cents)"
          - "Create RecoveryPlan(status=ACTIVE, principal_cents=payout_amount_cents, applicant_id=guarantee.applicant_id) (cascade link 2, caused by the payout)"
          - "applicant.open_recovery_count += 1 (cascade link 3, caused by the RecoveryPlan creation)"
          - "Portfolio risk_weighted_exposure_cents recomputed"
      - from: APPROVED
        to: PAID
        trigger: "system (automatic disbursement immediately after approve)"
        actor: system
        preconditions: []
        side_effects:
          - "If guarantee.remaining_coverage_cents == 0 → guarantee auto-transitions ACTIVE→EXHAUSTED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "No coverage debit; no recovery plan"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: Landlord
        preconditions:
          - "acting Landlord owns the claim (landlord_id == X-User-ID)"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: Landlord
        preconditions:
          - "acting Landlord owns the claim (landlord_id == X-User-ID)"
        side_effects: []

  - entity: RecoveryPlan
    initial_state: ACTIVE
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: ACTIVE
        to: SETTLED
        trigger: "system (automatic when outstanding_cents reaches 0 after a posted installment)"
        actor: system
        preconditions:
          - "outstanding_cents == 0"
        side_effects:
          - "applicant.open_recovery_count -= 1"
      - from: ACTIVE
        to: WRITTEN_OFF
        trigger: "POST /recovery-plans/{id}/write-off"
        actor: RecoveryAgent | ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "applicant.open_recovery_count -= 1"

  - entity: RecoveryInstallment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /recovery-installments/{id}/reverse"
        actor: RecoveryAgent
        preconditions:
          - "status == POSTED"
          - "parent RecoveryPlan.status == ACTIVE (cannot reverse into a settled/written-off plan; ERR_INVALID_STATE)"
        side_effects:
          - "recovery_plan.recovered_cents -= amount_cents; recovery_plan.outstanding_cents += amount_cents (compensating_invariant: recovery-principal conservation)"

  - entity: ComplianceReview
    initial_state: OPEN
    terminal_states: [CLEARED, UPHELD]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /compliance-reviews/{id}/clear"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != opened_by_user_id (segregation_of_duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: OPEN
        to: UPHELD
        trigger: "POST /compliance-reviews/{id}/uphold"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != opened_by_user_id (segregation_of_duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If the referenced guarantee is in {QUOTED, APPROVED} it is cascaded to CANCELLED (which in turn terminates its agreements)"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-guarantee
    parent_entity: Guarantee
    write_endpoint: "POST /guarantees/{id}/claims"
    occ_field: "expected_guarantee_version"
    description: |
      Filing a Claim against a Guarantee whose version has advanced since the
      client last observed it is rejected. A guarantee legitimately accepts
      multiple claims over its coverage window, so a second filing would
      normally succeed; this rule captures the case where another writer has
      already filed a claim that consumed coverage (advancing the guarantee's
      version), leaving the current filer's view of remaining_coverage_cents
      stale.
    error_id: ERR_STALE_GUARANTEE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: applicant_risk_tier
    trigger: "POST /applicants/{id}/verify (Applicant DRAFT→VERIFIED)"
    algorithm: threshold
    formula: |
      dti = monthly_obligations_cents / (annual_income_cents / 12)   # rounded to 4 dp for tier comparison
      if credit_score < CREDIT_FLOOR or employment_type == "UNEMPLOYED":
        outcome = DECLINED (risk_tier stays null)
      elif credit_score >= 720 and dti <= 0.35: risk_tier = "A"
      elif credit_score >= 660 and dti <= 0.45: risk_tier = "B"
      elif credit_score >= 600 and dti <= 0.55: risk_tier = "C"
      else:                                      risk_tier = "D"
    input_set: "single Applicant in DRAFT"
    constants:
      CREDIT_FLOOR: 580
      A_CREDIT: 720
      A_DTI: 0.35
      B_CREDIT: 660
      B_DTI: 0.45
      C_CREDIT: 600
      C_DTI: 0.55
    precision: "debt_to_income to 4 decimal places, round_half_up; tier comparison uses the rounded value"

  - name: guarantee_fee
    trigger: "POST /guarantees (provisional variant) and POST /guarantees/{id}/approve (final variant)"
    algorithm: tiered_pricing
    formula: |
      per_month_coverage_cents = round_half_up(monthly_rent_cents * COVERED_FRACTION)
      total_coverage_cents     = per_month_coverage_cents * coverage_months
      base_rate = TIER_RATE[tier]                      # tier depends on variant (see variants)
      term_factor = term_months / 12
      raw_fee = base_rate * total_coverage_cents * term_factor
      fee_cents = min(max(round_half_up(raw_fee), MIN_FEE_CENTS), MAX_FEE_CENTS)
    input_set: "single Guarantee; coverage_months capped at MAX_COVERAGE_MONTHS at creation"
    constants:
      COVERED_FRACTION: 0.90
      MAX_COVERAGE_MONTHS: 12
      MIN_FEE_CENTS: 15000
      MAX_FEE_CENTS: 500000
      TIER_RATE: { A: 0.05, B: 0.08, C: 0.12, D: 0.18 }
      PROVISIONAL_TIER: "C"
    precision: "whole cents, round_half_up applied once to raw_fee before min/max clamp"
    variants:
      - name: provisional
        when: "at POST /guarantees, before the applicant is verified"
        difference: "tier is fixed to PROVISIONAL_TIER (C, rate 0.12) regardless of the applicant; stored in provisional_fee_cents"
      - name: final
        when: "at POST /guarantees/{id}/approve, after the applicant is VERIFIED"
        difference: "tier is the verified applicant.risk_tier; stored in final_fee_cents — differs from provisional whenever the verified tier is not C"

  - name: rent_to_income_ratio
    trigger: "POST /guarantees/{id}/approve"
    algorithm: threshold
    formula: |
      rent_to_income_ratio = monthly_rent_cents / (applicant.annual_income_cents / 12)
      if rent_to_income_ratio >= RENT_INCOME_MAX:   # boundary is inclusive: exactly 0.40 is rejected
        reject approve with ERR_RENT_TO_INCOME_EXCEEDED
    input_set: "the Guarantee under approval plus its Applicant"
    constants:
      RENT_INCOME_MAX: 0.40
    precision: "ratio compared exactly; 0.40 rejects, 0.399999 passes"

  - name: claim_payout
    trigger: "POST /claims/{id}/approve (Claim UNDER_REVIEW→APPROVED)"
    algorithm: forward_looking
    formula: |
      months = missed_months            if payout_variant == CHRONOLOGICAL
      months = guarantee.coverage_months if payout_variant == ACCELERATED   # full remaining term accelerated
      # ROUND PER COVERED MONTH THEN SUM (pinned order):
      gross_cents = guarantee.per_month_coverage_cents * months
      payout_amount_cents = min(gross_cents, guarantee.remaining_coverage_cents)
    input_set: "the Claim under approval plus its Guarantee; guarantee.per_month_coverage_cents was rounded once at guarantee creation"
    constants: {}
    precision: |
      Per-covered-month coverage is rounded to whole cents ONCE at guarantee creation
      (per_month_coverage_cents), THEN multiplied by the month count and summed. This is
      the pinned 'round-per-month-then-sum' order; the alternative 'sum-then-round'
      (round(monthly_rent_cents * COVERED_FRACTION * months)) may differ by one cent and
      is NOT used.
    variants:
      - name: chronological
        when: "acceleration_requested == false"
        difference: "months = missed_months (only already-missed rent)"
      - name: accelerated
        when: "acceleration_requested == true"
        difference: "months = guarantee.coverage_months (entire covered term), typically capped to remaining_coverage_cents"

  - name: portfolio_exposure
    trigger: "POST /portfolios/{id}/recompute-risk; also refreshed as a side effect of guarantee activate, claim approve, declare-default"
    algorithm: aggregation
    formula: |
      total_active_coverage_cents = sum(g.total_coverage_cents
                                        for g in guarantees where g.status in {ACTIVE, RENEWAL_PENDING})
      total_outstanding_recovery_cents = sum(rp.outstanding_cents
                                        for rp in recovery_plans where rp.status == ACTIVE)
      risk_weighted_exposure_cents = round_half_up(
          sum(g.remaining_coverage_cents * TIER_WEIGHT[g.risk_tier]
              for g in guarantees where g.status in {ACTIVE, RENEWAL_PENDING}))
      warn_threshold = round_half_up(POSTURE_WARN_FRACTION * exposure_cap_cents)
      posture = RESTRICTED if risk_weighted_exposure_cents >= warn_threshold else OPEN
    input_set: "all guarantees in {ACTIVE, RENEWAL_PENDING} and all recovery plans in ACTIVE for the portfolio"
    constants:
      TIER_WEIGHT: { A: 0.5, B: 0.8, C: 1.2, D: 2.0 }
      POSTURE_WARN_FRACTION: 0.80
    precision: |
      risk_weighted_exposure_cents rounded once (half-up) after the weighted sum. posture is a
      SOFT warning band: RESTRICTED once the weighted exposure reaches POSTURE_WARN_FRACTION (0.80)
      of the cap (inclusive >=). This is intentionally distinct from the HARD approve gate
      (approve_exposure_check), which only blocks when projected exposure would exceed the cap
      (> exposure_cap_cents) — so an approved book can sit in the RESTRICTED warning band
      (0.80·cap .. cap) without any single approval having been blocked.

  - name: approve_exposure_check
    trigger: "POST /guarantees/{id}/approve"
    algorithm: threshold
    formula: |
      projected = portfolio.risk_weighted_exposure_cents
                + round_half_up(guarantee.total_coverage_cents * TIER_WEIGHT[applicant.risk_tier])
      if projected > portfolio.exposure_cap_cents:
        reject approve with ERR_EXPOSURE_CAP_EXCEEDED
    input_set: "the portfolio's current risk_weighted_exposure_cents plus the new guarantee's weighted coverage"
    constants:
      TIER_WEIGHT: { A: 0.5, B: 0.8, C: 1.2, D: 2.0 }
    precision: "projected weighted coverage rounded half-up; strictly greater-than the cap rejects"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve to existing resources (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Entity-backed caller owns the target resource (Landlord.id == X-User-ID for agreement/claim actions; Applicant.id == guarantee.applicant_id for pay-fee)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "agreement sign, claim create, claim withdraw, guarantee pay-fee"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: acting X-User-ID must differ from a recorded actor id (claim approve vs guarantee.underwritten_by_user_id; compliance clear/uphold vs opened_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "claim approve, compliance-review clear, compliance-review uphold"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts/counts > 0 where required, dates ordered"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 7
    category: state
    check: "Target resource is in a state from which this transition is allowed (includes Claim-create requiring Guarantee.status == ACTIVE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
    note: "Claim-create uses the specific ERR_GUARANTEE_NOT_ACTIVE at this same priority; both are category:state."

  - priority: 8
    category: business_referential
    check: "Cross-entity preconditions: applicant VERIFIED for approve; an ACTIVE agreement exists for activate; guarantee APPROVED for countersign"
    error_id: ERR_APPLICANT_NOT_VERIFIED
    http_status: 409
    applies_to: "guarantee approve, guarantee activate, agreement countersign"
    note: "Sibling error_ids at this priority: ERR_AGREEMENT_NOT_ACTIVE (activate), ERR_GUARANTEE_NOT_APPROVED (countersign)."

  - priority: 9
    category: business_safety
    check: "No ComplianceReview in status OPEN references the guarantee being activated"
    error_id: ERR_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "guarantee activate"

  - priority: 10
    category: business_temporal
    check: "Temporal-window rules: claim filed within notice_period_days of default_date; guarantee coverage window does not overlap an existing ACTIVE guarantee for the same applicant (half-open, adjacency allowed)"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    applies_to: "claim create, guarantee activate"
    note: "Sibling error_id at this priority: ERR_APPLICANT_COVERAGE_OVERLAP (guarantee activate)."

  - priority: 11
    category: business_constraint
    check: "Landlord-unit agreement coverage windows for the same unit_id must be >= UNIT_BUFFER_DAYS apart (closed intervals + buffer gap)"
    error_id: ERR_UNIT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "agreement create"

  - priority: 12
    category: business_fiscal
    check: "Fiscal gates: projected risk-weighted exposure <= exposure_cap; fee_paid before activate/confirm-renewal; remaining_coverage > 0 for claim approve"
    error_id: ERR_EXPOSURE_CAP_EXCEEDED
    http_status: 409
    applies_to: "guarantee approve, guarantee activate, guarantee confirm-renewal, claim approve"
    note: "Sibling error_ids at this priority: ERR_FEE_NOT_PAID, ERR_COVERAGE_EXHAUSTED, ERR_RENT_TO_INCOME_EXCEEDED."

  - priority: 13
    category: business_constraint
    check: "OCC: expected_guarantee_version must equal the guarantee's current version at claim creation"
    error_id: ERR_STALE_GUARANTEE_VERSION
    http_status: 412
    applies_to: "claim create"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set to to_iso8601"]

  # --- Portfolio ---
  - method: POST
    path: "/portfolios"
    description: "Create a portfolio (guarantor book)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, exposure_cap_cents]
    output: Portfolio
    side_effects: ["posture=OPEN; all aggregate fields=0"]

  - method: GET
    path: "/portfolios/{id}"
    description: "Get a portfolio"
    roles: [PlatformAdmin, ComplianceOfficer, Underwriter]
    code: 200
    input: []
    output: Portfolio
    side_effects: []

  - method: POST
    path: "/portfolios/{id}/recompute-risk"
    description: "Recompute portfolio exposure aggregates and posture"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["recompute total_active_coverage_cents, total_outstanding_recovery_cents, risk_weighted_exposure_cents, posture"]

  # --- Applicant ---
  - method: POST
    path: "/applicants"
    description: "Create an applicant (renter)"
    roles: [Underwriter, PlatformAdmin]
    code: 201
    input: [full_name, email, annual_income_cents, credit_score, monthly_obligations_cents, employment_type]
    output: Applicant
    side_effects: ["status=DRAFT; risk_tier=null"]

  - method: GET
    path: "/applicants/{id}"
    description: "Get an applicant"
    roles: [Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/applicants/{id}/verify"
    description: "Underwrite the applicant: pull credit/income, compute risk tier, set VERIFIED or DECLINED"
    roles: [Underwriter]
    code: 200
    input: []
    output: Applicant
    side_effects: ["compute debt_to_income and risk_tier; status→VERIFIED or DECLINED"]

  # --- Landlord ---
  - method: POST
    path: "/landlords"
    description: "Create a landlord"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, email]
    output: Landlord
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/landlords/{id}"
    description: "Get a landlord"
    roles: [PlatformAdmin, Underwriter, Landlord]
    code: 200
    input: []
    output: Landlord
    side_effects: []

  # --- Guarantee ---
  - method: POST
    path: "/guarantees"
    description: "Create a guarantee quote (QUOTED); computes provisional fee and coverage"
    roles: [Underwriter]
    code: 201
    input: [portfolio_id, applicant_id, unit_id, monthly_rent_cents, coverage_months, term_months, lease_start_date, lease_end_date]
    output: Guarantee
    side_effects: ["compute per_month_coverage_cents, total_coverage_cents, provisional_fee_cents; status=QUOTED"]

  - method: GET
    path: "/guarantees/{id}"
    description: "Get a guarantee"
    roles: [Underwriter, ClaimsAdjuster, ComplianceOfficer, PlatformAdmin, Landlord]
    code: 200
    input: []
    output: Guarantee
    side_effects: []

  - method: GET
    path: "/guarantees"
    description: "List guarantees (filtered)"
    roles: [Underwriter, ClaimsAdjuster, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["applicant_id?", "landlord_id?", "portfolio_id?", "status?", "limit?", "offset?"]
    output: "Guarantee[]"
    side_effects: []

  - method: POST
    path: "/guarantees/{id}/approve"
    description: "Approve a quoted guarantee: lock final fee, check affordability and exposure"
    roles: [Underwriter]
    code: 200
    input: []
    output: Guarantee
    side_effects: ["copy risk_tier; compute rent_to_income_ratio, final_fee_cents; set underwritten_by_user_id; status→APPROVED"]

  - method: POST
    path: "/guarantees/{id}/pay-fee"
    description: "Pay the guarantee's current (final or renewal) fee"
    roles: [Applicant, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: Guarantee
    side_effects: ["fee_paid=true; append LedgerEntry(FEE_CHARGED, CREDIT)"]

  - method: POST
    path: "/guarantees/{id}/activate"
    description: "Activate an approved guarantee once fee is paid and an agreement is ACTIVE"
    roles: [Underwriter]
    code: 200
    input: []
    output: Guarantee
    side_effects: ["remaining_coverage_cents=total_coverage_cents; portfolio.total_active_coverage_cents += total_coverage_cents; recompute portfolio risk; status→ACTIVE"]

  - method: POST
    path: "/guarantees/{id}/renew"
    description: "Open a renewal on an active guarantee"
    roles: [Underwriter]
    code: 200
    input: []
    output: Guarantee
    side_effects: ["fee_paid=false; status→RENEWAL_PENDING"]

  - method: POST
    path: "/guarantees/{id}/confirm-renewal"
    description: "Confirm a renewal after the renewal fee is paid"
    roles: [Underwriter]
    code: 200
    input: []
    output: Guarantee
    side_effects: ["renewal_count += 1; extend lease_end_date; reset remaining_coverage_cents & paid_out_cents; append LedgerEntry(COVERAGE_RESET, CREDIT); status→ACTIVE"]

  - method: POST
    path: "/guarantees/{id}/declare-default"
    description: "Declare renter default on an active guarantee"
    roles: [Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: Guarantee
    side_effects: ["applicant.default_count += 1; auto-create ComplianceReview(AUTO_DEFAULT_TRIGGER); portfolio.total_active_coverage_cents -= total_coverage_cents; terminate ACTIVE agreements; status→DEFAULTED"]

  - method: POST
    path: "/guarantees/{id}/cancel"
    description: "Cancel a quoted or approved guarantee"
    roles: [Underwriter]
    code: 200
    input: []
    output: Guarantee
    side_effects: ["status→CANCELLED; terminate SIGNED/ACTIVE agreements"]

  - method: GET
    path: "/guarantees/{id}/ledger-entries"
    description: "List money-movement ledger entries for a guarantee (append-only)"
    roles: [Underwriter, ClaimsAdjuster, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/guarantees/{id}/claims"
    description: "File a claim against an active guarantee (OCC-guarded on guarantee.version)"
    roles: [Landlord]
    code: 201
    input: ["expected_guarantee_version", "default_date", "missed_months", "acceleration_requested?"]
    output: Claim
    side_effects: ["copy landlord_id from guarantee; status=SUBMITTED; increments Guarantee.version by 1"]

  # --- LandlordAgreement ---
  - method: POST
    path: "/agreements"
    description: "Create a landlord agreement (DRAFT) proposing coverage for a guarantee/unit"
    roles: [Landlord]
    code: 201
    input: [guarantee_id, landlord_id, unit_id, coverage_start_date, coverage_end_date, max_coverage_cents, notice_period_days]
    output: LandlordAgreement
    side_effects: ["status=DRAFT; reject if same unit_id overlaps within UNIT_BUFFER_DAYS of an existing ACTIVE agreement"]

  - method: GET
    path: "/agreements/{id}"
    description: "Get an agreement"
    roles: [Landlord, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: LandlordAgreement
    side_effects: []

  - method: GET
    path: "/agreements"
    description: "List agreements (filtered)"
    roles: [Landlord, Underwriter, PlatformAdmin]
    code: 200
    input: ["guarantee_id?", "landlord_id?", "status?", "limit?", "offset?"]
    output: "LandlordAgreement[]"
    side_effects: []

  - method: POST
    path: "/agreements/{id}/sign"
    description: "Landlord signs the agreement"
    roles: [Landlord]
    code: 200
    input: []
    output: LandlordAgreement
    side_effects: ["status→SIGNED"]

  - method: POST
    path: "/agreements/{id}/countersign"
    description: "Underwriter countersigns; binds the guarantee to the landlord"
    roles: [Underwriter]
    code: 200
    input: []
    output: LandlordAgreement
    side_effects: ["guarantee.landlord_id = landlord_id; status→ACTIVE"]

  # --- Claim ---
  - method: GET
    path: "/claims/{id}"
    description: "Get a claim"
    roles: [Landlord, ClaimsAdjuster, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims (filtered)"
    roles: [ClaimsAdjuster, Underwriter, PlatformAdmin, Landlord]
    code: 200
    input: ["guarantee_id?", "landlord_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/claims/{id}/review"
    description: "Move a submitted claim into review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status→UNDER_REVIEW"]

  - method: POST
    path: "/claims/{id}/approve"
    description: "Approve and disburse a claim (SoD: adjuster != guarantee underwriter)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["compute payout; debit guarantee coverage; create RecoveryPlan; bump applicant.open_recovery_count; recompute portfolio risk; status→APPROVED then system→PAID"]

  - method: POST
    path: "/claims/{id}/deny"
    description: "Deny a claim under review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status→DENIED; no coverage debit"]

  - method: POST
    path: "/claims/{id}/withdraw"
    description: "Landlord withdraws a submitted or in-review claim"
    roles: [Landlord]
    code: 200
    input: []
    output: Claim
    side_effects: ["status→WITHDRAWN"]

  # --- RecoveryPlan / RecoveryInstallment ---
  - method: GET
    path: "/recovery-plans/{id}"
    description: "Get a recovery plan"
    roles: [RecoveryAgent, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RecoveryPlan
    side_effects: []

  - method: GET
    path: "/recovery-plans"
    description: "List recovery plans (filtered)"
    roles: [RecoveryAgent, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["claim_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: "RecoveryPlan[]"
    side_effects: []

  - method: POST
    path: "/recovery-plans/{id}/installments"
    description: "Record a recovery installment from the renter"
    roles: [RecoveryAgent]
    code: 201
    input: [amount_cents]
    output: RecoveryInstallment
    side_effects: ["recovered_cents += amount; outstanding_cents -= amount; auto-SETTLE plan when outstanding reaches 0"]

  - method: GET
    path: "/recovery-plans/{id}/installments"
    description: "List installments for a recovery plan (append-only)"
    roles: [RecoveryAgent, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecoveryInstallment[]"
    side_effects: []

  - method: POST
    path: "/recovery-installments/{id}/reverse"
    description: "Reverse a posted installment (compensating action)"
    roles: [RecoveryAgent]
    code: 200
    input: []
    output: RecoveryInstallment
    side_effects: ["status→REVERSED; recovered_cents -= amount; outstanding_cents += amount"]

  - method: POST
    path: "/recovery-plans/{id}/write-off"
    description: "Write off an active recovery plan"
    roles: [RecoveryAgent, ComplianceOfficer]
    code: 200
    input: []
    output: RecoveryPlan
    side_effects: ["status→WRITTEN_OFF; applicant.open_recovery_count -= 1"]

  # --- ComplianceReview ---
  - method: POST
    path: "/compliance-reviews"
    description: "Open a compliance review / hold on a guarantee"
    roles: [ComplianceOfficer]
    code: 201
    input: [guarantee_id, reason]
    output: ComplianceReview
    side_effects: ["status=OPEN; opened_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/compliance-reviews/{id}"
    description: "Get a compliance review"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ComplianceReview
    side_effects: []

  - method: GET
    path: "/compliance-reviews"
    description: "List compliance reviews (filtered)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["guarantee_id?", "status?", "limit?", "offset?"]
    output: "ComplianceReview[]"
    side_effects: []

  - method: POST
    path: "/compliance-reviews/{id}/clear"
    description: "Clear a compliance review (SoD: clearer != opener)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: ComplianceReview
    side_effects: ["status→CLEARED"]

  - method: POST
    path: "/compliance-reviews/{id}/uphold"
    description: "Uphold a compliance review (SoD: upholder != opener); cascades to cancel a not-yet-active guarantee"
    roles: [ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: ComplianceReview
    side_effects: ["status→UPHELD; if guarantee in {QUOTED, APPROVED} cascade guarantee→CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role valid but not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (landlord/applicant id mismatch)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting X-User-ID equals a recorded actor that must differ (claim approver vs underwriter; compliance clearer/upholder vs opener)" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, non-positive amount/count, or unordered dates" }

  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which this transition is allowed" }
  - { id: ERR_GUARANTEE_NOT_ACTIVE, http: 409, condition: "Claim filed against a guarantee whose status is not ACTIVE" }

  # --- cross-entity referential ---
  - { id: ERR_APPLICANT_NOT_VERIFIED, http: 409, condition: "Guarantee approve attempted while applicant.status != VERIFIED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Guarantee activate attempted with no ACTIVE agreement for the guarantee" }
  - { id: ERR_GUARANTEE_NOT_APPROVED, http: 409, condition: "Agreement countersign attempted while guarantee.status != APPROVED" }

  # --- compliance / temporal / overlap ---
  - { id: ERR_COMPLIANCE_HOLD, http: 409, condition: "Guarantee activate blocked by an OPEN ComplianceReview" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 409, condition: "Claim filed more than notice_period_days after default_date" }
  - { id: ERR_APPLICANT_COVERAGE_OVERLAP, http: 409, condition: "Applicant already has an ACTIVE/RENEWAL_PENDING guarantee whose half-open lease window overlaps the one being activated" }
  - { id: ERR_UNIT_COVERAGE_OVERLAP, http: 409, condition: "Same unit_id already has an ACTIVE agreement whose closed coverage window is within UNIT_BUFFER_DAYS of the new one" }

  # --- fiscal ---
  - { id: ERR_RENT_TO_INCOME_EXCEEDED, http: 409, condition: "rent_to_income_ratio >= RENT_INCOME_MAX (0.40) at approve" }
  - { id: ERR_EXPOSURE_CAP_EXCEEDED, http: 409, condition: "Projected risk-weighted exposure would exceed portfolio.exposure_cap_cents" }
  - { id: ERR_FEE_NOT_PAID, http: 409, condition: "Activate/confirm-renewal attempted before the current fee is paid" }
  - { id: ERR_COVERAGE_EXHAUSTED, http: 409, condition: "Claim approve attempted while guarantee.remaining_coverage_cents == 0" }

  # --- concurrency ---
  - { id: ERR_STALE_GUARANTEE_VERSION, http: 412, condition: "expected_guarantee_version != guarantee.version at claim creation" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superuser: bootstraps portfolios, landlords, applicants; drives the logical clock; may pay fees on behalf of applicants"
    identity: opaque
    exclusive_operations:
      - "POST /portfolios — Create portfolio"
      - "POST /landlords — Create landlord"
      - "POST /_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "POST /applicants — Create applicant (with Underwriter)"
      - "POST /portfolios/{id}/recompute-risk — Recompute portfolio (with ComplianceOfficer)"
      - "POST /guarantees/{id}/pay-fee — Pay fee (with Applicant)"
      - "GET endpoints (read access)"

  - name: Underwriter
    description: "Risk desk: creates/verifies applicants, quotes/approves/activates/renews guarantees, countersigns agreements, may declare default"
    identity: opaque
    exclusive_operations:
      - "POST /applicants/{id}/verify — Verify applicant"
      - "POST /guarantees — Create guarantee"
      - "POST /guarantees/{id}/approve — Approve guarantee"
      - "POST /guarantees/{id}/activate — Activate guarantee"
      - "POST /guarantees/{id}/renew — Open renewal"
      - "POST /guarantees/{id}/confirm-renewal — Confirm renewal"
      - "POST /guarantees/{id}/cancel — Cancel guarantee"
      - "POST /agreements/{id}/countersign — Countersign agreement"
    shared_operations:
      - "POST /applicants — Create applicant (with PlatformAdmin)"
      - "POST /guarantees/{id}/declare-default — Declare default (with ClaimsAdjuster)"

  - name: ClaimsAdjuster
    description: "Claims desk: reviews, approves/disburses, and denies claims; may declare default. Cannot approve a claim on a guarantee it underwrote (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/review — Start claim review"
      - "POST /claims/{id}/approve — Approve and disburse claim"
      - "POST /claims/{id}/deny — Deny claim"
    shared_operations:
      - "POST /guarantees/{id}/declare-default — Declare default (with Underwriter)"

  - name: RecoveryAgent
    description: "Recovery desk: records renter installments, reverses them, writes off plans"
    identity: opaque
    exclusive_operations:
      - "POST /recovery-plans/{id}/installments — Record installment"
      - "POST /recovery-installments/{id}/reverse — Reverse installment"
    shared_operations:
      - "POST /recovery-plans/{id}/write-off — Write off plan (with ComplianceOfficer)"

  - name: ComplianceOfficer
    description: "Compliance desk: opens/clears/upholds reviews, recomputes portfolio risk. Cannot clear/uphold a review it opened (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /compliance-reviews — Open review"
      - "POST /compliance-reviews/{id}/clear — Clear review"
      - "POST /compliance-reviews/{id}/uphold — Uphold review"
    shared_operations:
      - "POST /portfolios/{id}/recompute-risk — Recompute portfolio (with PlatformAdmin)"
      - "POST /recovery-plans/{id}/write-off — Write off plan (with RecoveryAgent)"

  - name: Landlord
    description: "Property counterparty: proposes and signs agreements, files and withdraws claims on guarantees bound to it"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /agreements — Create agreement"
      - "POST /agreements/{id}/sign — Sign agreement"
      - "POST /guarantees/{id}/claims — File claim"
      - "POST /claims/{id}/withdraw — Withdraw claim"
    shared_operations:
      - "GET /guarantees/{id}, GET /agreements, GET /claims (own resources)"

  - name: Applicant
    description: "Renter: pays the guarantee fee on their own guarantee (ownership: guarantee.applicant_id == X-User-ID)"
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "POST /guarantees/{id}/pay-fee — Pay fee (with PlatformAdmin)"

  - name: System
    description: "Automation actor for auto-transitions (claim disbursement PAID, coverage-exhaustion EXHAUSTED, recovery auto-SETTLE, cascade agreement TERMINATED). Not an API caller."
    identity: opaque
    exclusive_operations: []
    shared_operations: []

