      - name: cascade_session_cancel_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Session.SCHEDULED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / session_cancel_cascade_depth3_to_enrollment
          rationale: "The depth-3 session-cancel cascade is the named §1.8 transitive_cascade instance."

      - name: dual_variant_excluded
        claim_type: dual_variant_calculation
        grounds: [calculations.rental_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / rental_charge_estimated_vs_actual_diverge
          rationale: "Estimated-vs-actual rental divergence is the named §1.8 dual_variant_calc instance."

      - name: threshold_ratio_boundary_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.instructor_ratio_capacity]
        excluded_because:
          difficulty_instance: boundary_precision_check / session_capacity_at_max_then_over
          rationale: "The ratio-cap boundary (4 ok, 5 rejected) is the named §1.8 boundary_precision_check instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_on_create
        claim_type: immediate
        grounds: [entities.Enrollment.fields.completion_pct]
        distinguishing_aspect: "completion_pct is present and consistent in the same response that creates an enrollment (immediate consistency); a fresh OPEN_WATER enrollment (required_pool 1, required_ow 1) with e-learning 0 and no attendance reads completion_pct == 0."
        test_recipe:
          setup: ["A course (required_pool 1, required_ow 1) and a diver."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { title: "OW Cert Full", course_type: "OPEN_WATER", required_pool_sessions: 1, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Imm Ivy", email: "ivy@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.completion_pct == 0"
            - "Enrollment.${enr_id}.status == ACTIVE"
