            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/publish-notice", payload: { comment_period_days: 30 }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/applications/${app_id}/advance-to-decision", payload: {}, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /wetland-permits/applications/${app_id}/render-decision", payload: { outcome: "ISSUE" }, as: DistrictEngineer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (business_safety, priority 14) — NOT ERR_MITIGATION_NOT_SECURED (business_fiscal, priority 30), even though the plan is not secured"

  - rule_id: boundary_precision_check
    instances:
      - name: appeal_window_exactly_sixty_days
        grounds:
          - validations[priority=10]
          - errors[ERR_APPEAL_WINDOW_CLOSED]
          - entities.Appeal.fields.filed_date
        distinguishing_aspect: |
          Metric = elapsed days. The window is inclusive: filing exactly 60 days after
          issuance (2026-10-31) succeeds; 61 days (2026-11-01) fails with
          ERR_APPEAL_WINDOW_CLOSED. Endpoint: POST /wetland-permits/appeals.
        test_recipe:
          setup:
            - "Two sites, each with its own APPROVED JURISDICTIONAL JD issued at the default clock 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site1: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site1}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd1: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd1}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Cedar Run Lot", state_code: "VA", watershed_code: "18020102", total_acres: 18.0, resource_types_present: ["STREAM"] }, as: SystemAdmin, captures: { site2: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site2}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd2: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd2}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /wetland-permits/appeals", payload: { jd_id: "${jd1}", grounds_text: "Filed on day 60" }, as: Applicant, as_user_id: "${ap_id}", captures: { appeal_ok: "$.data.id", st_ok: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/appeals", payload: { jd_id: "${jd2}", grounds_text: "Filed on day 61" }, as: Applicant, as_user_id: "${ap_id}", captures: { err_late: "$.data.error_id" } }
          assert:
            - "appeal at exactly 60 days succeeds: st_ok == FILED (201)"
            - "appeal at 61 days rejected: err_late == ERR_APPEAL_WINDOW_CLOSED"

      - name: credit_inventory_exact_availability
        grounds:
          - validations[priority=27]
          - calculations.bank_credit_inventory
          - errors[ERR_INSUFFICIENT_CREDIT_INVENTORY]
        distinguishing_aspect: |
          Metric = credit count. A reservation of exactly the available inventory
