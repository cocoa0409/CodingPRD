              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fid}", occurred_at: "2026-07-05T10:00:00Z", injury_level: "NONE", reported_property_damage_cents: 100000, narrative: "Landing gear leg bent on touchdown; no third party involved." }
              as: InvestigationOfficer
              captures: { rid: $.data.id, rpolicy: $.data.policy_id, reserved: $.data.reserved_cents }
            - call: "GET /drone-ops/accident-reports?policy_id=${phigh}"
              payload: {}
              as: ComplianceOfficer
              captures: { rep_first: "$.data[0].id" }
            - call: "GET /drone-ops/insurance-policies/${phigh}"
              payload: {}
              as: ComplianceOfficer
              captures: { high_status: $.data.coverage_status, high_remaining: $.data.remaining_coverage_cents }
          assert:
            - "${covering} == \"${phigh}\" - the client sent no policy field at all, and the higher remaining coverage wins the ranking"
            - "GET /drone-ops/flights?covering_policy_id=${phigh} returns total_count 1 with ${high_first} == \"${fid}\", while the same filter on ${plow} returns total_count 0 - the declared covering_policy_id filter resolves the link in both directions"
            - "${rpolicy} == \"${phigh}\" - the report copies the flight's covering_policy_id rather than re-selecting, and ${reserved} == 125000 == round_half_up(100000 * 1.25) + 0"
            - "the policy_id filter returns total_count 1 with ${rep_first} == \"${rid}\" - the propagated FK is queryable on the report list too"
            - "${high_status} == \"ACTIVE\" and ${high_remaining} == 1875000 == 2000000 - 125000 - the reserve is small enough that no coverage cascade fires"
            - "P_LOW is untouched: GET /drone-ops/insurance-policies/${plow} still shows remaining_coverage_cents 1500000 and no report points at it"

      - name: clearing_a_safety_case_is_conditional_on_its_sail_level
        claim_type: conditional_action
        grounds:
          - validations.priority_31
          - errors.ERR_SAIL_LEVEL_UNACCEPTABLE
          - endpoints.POST_/drone-ops/waivers/{id}/clear-safety-case
          - calculations.safety_case_sail_level
        distinguishing_aspect: |
          The same action endpoint is refused or performed purely on a computed property of a
          child row, probed at the MAX_APPROVABLE_SAIL boundary: a BVLOS case whose raw sum 7 is
          clamped to 6 can never be cleared, while a NIGHT case landing on exactly 5 clears. The
          refusal must be inert - the waiver stays UNDER_REVIEW, the safety case stays PENDING and
          cleared_by_user_id stays null - so a partial write is visible.
        test_recipe:
          setup:
            - "Logical clock at 2026-12-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-12-01T00:00:00Z (submission requires CERTIFIED) owning one airframe."
            - "Waiver A: BVLOS with a safety case at ground_risk_class 4 and ARC_C, so sail_level 6."
            - "Waiver B: NIGHT with a safety case at ground_risk_class 3 and ARC_C, so sail_level 5."
            - "Both waivers are carried to UNDER_REVIEW before the clear attempt."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Gio Baraldi", email: "gio.baraldi@example.com", operator_category: "COMMERCIAL" }
