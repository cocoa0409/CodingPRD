# =============================================================================
# task_2124 — Contract Shuttle Service (hotel / campus / corporate)
# Seed tables §1.0 – §1.7
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2124. Contract Shuttle Service (hotel/campus/corporate): route & headway design vs demand, vehicle & driver scheduling with layovers, on-demand request integration & wait time, ridership counting & client reporting, service-level penalty & missed-trip credit, fleet branding & maintenance, ADA-accessible vehicle availability, contract renewal & rate escalation

domain_name: contract-shuttle-service

# Flat/graph topology: peer collections joined by foreign keys in request bodies,
# no business resource is nested under a top-level prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Peer collections (ServiceContract, Route, Vehicle, Driver, Trip, …) linked by
  # foreign keys; Trip is a three-way junction (Route x Vehicle x Driver);
  # ServiceContract is self-referential through predecessor_contract_id.

  state_machine_shape: parallel
  # Trip carries two independent axes: dispatch_status (operational) and
  # settlement_status (financial). ServicePeriodReport and RenewalOffer are
  # cyclic; MaintenanceOrder close is a branching fork.

  relationship_patterns:
    - one_to_many          # ServiceContract -> Route, Route -> Trip
    - many_to_many         # Trip binds Vehicle and Driver; OnDemandRequest binds Trip
    - self_referential     # ServiceContract.predecessor_contract_id -> ServiceContract
    - cross_aggregate      # CreditMemo spans Trip, ServiceContract and ServicePeriodReport

  role_model: segregation_of_duties
  # The X-User-ID that submits a ServicePeriodReport may never be the X-User-ID
  # that approves it, even when both act under a role permitted to do both.

  consistency_model: immediate

difficulty_level: expert

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: client_name, type: string, source: input, description: "Client site name, e.g. 'Harborview Hotel'", constraints: "1..120 chars" }
      - { name: site_type, type: enum, source: input, description: "Kind of contract site", constraints: "HOTEL | CAMPUS | CORPORATE" }
      - { name: base_rate_cents_per_service_hour, type: integer, source: input, description: "Contracted rate in cents for one billable service hour", constraints: ">= 1" }
      - { name: term_start_date, type: string, source: input, description: "First calendar date covered by the contract (YYYY-MM-DD, UTC)" }
      - { name: term_end_date, type: string, source: input, description: "Last calendar date covered by the contract (YYYY-MM-DD, UTC)", constraints: ">= term_start_date" }
      - { name: escalation_index_pct, type: number, source: input, description: "Base annual escalation index used by renewal_proposed_rate", constraints: "0.00 .. 10.00, 2 decimals" }
      - { name: sla_on_time_threshold_pct, type: number, source: input, description: "Minimum on-time percentage the operator promises per reporting period", constraints: "0.00 .. 100.00, 2 decimals" }
      - { name: penalty_rate_cents_per_missed_trip, type: integer, source: input, description: "Flat penalty and missed-trip credit amount in cents", constraints: ">= 0" }
      - { name: ada_min_accessible_pct, type: number, source: input, description: "Minimum share of the branded fleet that must be ADA accessible", constraints: "0.00 .. 100.00, 2 decimals" }
      - { name: predecessor_contract_id, type: string, source: input, description: "FK -> ServiceContract.id; null on an original contract, set by the renewal cascade on the successor contract it creates", default: null }
      - { name: status, type: enum, source: system, description: "Contract lifecycle state", default: "DRAFT", constraints: "DRAFT | ACTIVE | RENEWAL_PENDING | RENEWED | TERMINATED" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Outstanding client credit; see calculations.contract_credit_balance", default: 0 }
      - { name: branded_vehicle_count, type: integer, source: computed, description: "Count of Vehicle rows whose branding_contract_id equals this contract id and whose status is in {AVAILABLE, IN_MAINTENANCE}", default: 0 }
      - { name: branded_ada_vehicle_count, type: integer, source: computed, description: "Count of the branded_vehicle_count subset whose is_ada_accessible is true", default: 0 }

  - name: Route
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; owning contract" }
      - { name: name, type: string, source: input, description: "Route label, e.g. 'Airport Loop'", constraints: "1..120 chars" }
      - { name: loop_minutes, type: integer, source: input, description: "Minutes one full loop takes from departure to return", constraints: "1 .. 1440" }
      - { name: headway_minutes, type: integer, source: input, description: "Planned gap in minutes between consecutive departures", constraints: "1 .. 720" }
      - { name: service_window_start_min, type: integer, source: input, description: "First departure, minutes after local midnight", constraints: "0 .. 1439" }
      - { name: service_window_end_min, type: integer, source: input, description: "Last departure, minutes after local midnight", constraints: "0 .. 1439, >= service_window_start_min" }
      - { name: demand_forecast_pax_per_hour, type: integer, source: input, description: "Forecast boardings per hour used by route_fleet_requirement", constraints: ">= 0" }
      - { name: reference_seat_capacity, type: integer, source: input, description: "Seat capacity assumed for an unassigned trip and for the demand fleet formula", constraints: ">= 1" }
      - { name: required_vehicle_count, type: integer, source: computed, description: "See calculations.route_fleet_requirement", default: 0 }
      - { name: ada_required_count, type: integer, source: computed, description: "See calculations.route_fleet_requirement", default: 0 }
      - { name: status, type: enum, source: system, description: "Route lifecycle state", default: "DRAFT", constraints: "DRAFT | PUBLISHED | DEGRADED | RETIRED" }
      - { name: published_service_date, type: string, source: system, description: "Service date whose trips were most recently generated (YYYY-MM-DD); null while DRAFT", default: null }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: fleet_code, type: string, source: input, description: "Operator-wide unique fleet code, e.g. 'SHV-101'", constraints: "unique across all Vehicle rows, 1..40 chars" }
      - { name: seat_capacity, type: integer, source: input, description: "Seats available for on-demand matching", constraints: ">= 1" }
      - { name: is_ada_accessible, type: boolean, source: input, description: "True when the vehicle has a wheelchair lift and securement" }
      - { name: odometer_km, type: integer, source: input, description: "Current odometer reading in kilometres", constraints: ">= 0" }
      - { name: service_interval_km, type: integer, source: input, description: "Preventive maintenance interval in kilometres", constraints: ">= 1" }
      - { name: branding_contract_id, type: string, source: input, description: "FK -> ServiceContract.id; null while the vehicle carries no client livery", default: null }
      - { name: status, type: enum, source: system, description: "Fleet availability state", default: "AVAILABLE", constraints: "AVAILABLE | IN_MAINTENANCE | RETIRED" }
      - { name: committed_block_minutes, type: integer, source: computed, description: "See calculations.vehicle_committed_block_minutes", default: 0 }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver name", constraints: "1..120 chars" }
      - { name: license_class, type: enum, source: input, description: "Commercial licence class held", constraints: "CDL_B | CDL_C" }
      - { name: ada_certified, type: boolean, source: input, description: "True when the driver is certified to operate ADA-accessible equipment" }
      - { name: max_duty_minutes_per_day, type: integer, source: input, description: "Hard daily driving-duty cap in minutes", constraints: "1 .. 1440" }
      - { name: assigned_duty_minutes_current_date, type: integer, source: computed, description: "See calculations.driver_assigned_duty_minutes, evaluated for the logical clock's current UTC date", default: 0 }

  - name: Trip
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; route whose publish/republish generated this trip" }
      - { name: contract_id, type: string, source: system, description: "FK -> ServiceContract.id; denormalised from Route.contract_id at generation time and never changed afterwards" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; null until assigned, cleared again by unassign and by the maintenance displacement cascade", default: null }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; null until assigned, cleared again by unassign and by the maintenance displacement cascade", default: null }
      - { name: service_date, type: string, source: system, description: "Calendar date this trip operates on (YYYY-MM-DD, UTC)" }
      - { name: scheduled_departure_min, type: integer, source: system, description: "Planned departure, minutes after local midnight", constraints: "0 .. 1439" }
      - { name: scheduled_arrival_min, type: integer, source: system, description: "scheduled_departure_min + route.loop_minutes at generation time" }
      - { name: actual_departure_min, type: integer, source: input, description: "Minute the driver actually pulled out; set by POST /trips/{id}/start", default: null }
      - { name: actual_completion_min, type: integer, source: input, description: "Minute the loop actually closed; set by POST /trips/{id}/complete", default: null }
      - { name: dispatch_status, type: enum, source: system, description: "Operational axis of the parallel state machine", default: "SCHEDULED", constraints: "SCHEDULED | ASSIGNED | IN_SERVICE | COMPLETED | MISSED | CANCELLED" }
      - { name: settlement_status, type: enum, source: system, description: "Financial axis of the parallel state machine; evolves independently of dispatch_status", default: "UNBILLED", constraints: "UNBILLED | BILLED | CREDITED | WAIVED" }
      - { name: missed_reason, type: enum, source: system, description: "Reason recorded by mark-missed; null unless dispatch_status is MISSED", default: null, constraints: "OPERATOR_FAULT | CLIENT_REQUEST | WEATHER" }
      - { name: counted_boardings, type: integer, source: computed, description: "See calculations.ridership_counted_boardings", default: 0 }
      - { name: counted_ada_boardings, type: integer, source: computed, description: "ada_boardings of the same RidershipCount row selected by calculations.ridership_counted_boardings", default: 0 }
      - { name: matched_party_seats, type: integer, source: computed, description: "Sum of party_size over OnDemandRequest rows whose matched_trip_id equals this trip id and whose status is in {MATCHED, SERVED}", default: 0 }

  - name: RidershipCount
    parent: Trip
    common_fields: false
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; trip this tally belongs to" }
      - { name: boarded, type: integer, source: input, description: "Passengers boarded on the trip", constraints: ">= 0" }
      - { name: alighted, type: integer, source: input, description: "Passengers alighted on the trip", constraints: ">= 0" }
      - { name: ada_boardings, type: integer, source: input, description: "Subset of boarded that used the ADA lift", constraints: "0 .. boarded" }
      - { name: source, type: enum, source: input, description: "Where the number came from", constraints: "DRIVER_TALLY | APC_SENSOR" }
      - { name: sequence_no, type: integer, source: system, description: "Per-trip monotonic counter starting at 1, incremented by one for every RidershipCount row appended to the same trip; the sole ranking key of ridership_counted_boardings" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the caller that appended the row" }

  - name: OnDemandRequest
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; contract the rider travels under" }
      - { name: matched_trip_id, type: string, source: system, description: "FK -> Trip.id; null until matched, cleared again when the match is undone", default: null }
      - { name: service_date, type: string, source: input, description: "Calendar date of travel (YYYY-MM-DD, UTC)" }
      - { name: requested_pickup_min, type: integer, source: input, description: "Earliest acceptable pickup, minutes after local midnight", constraints: "0 .. 1439" }
      - { name: party_size, type: integer, source: input, description: "Seats needed", constraints: ">= 1" }
      - { name: requires_ada, type: boolean, source: input, description: "True when the party needs an ADA-accessible vehicle" }
      - { name: promised_headway_minutes, type: integer, source: system, description: "headway_minutes of the Route selected by on_demand_wait_estimate at creation time; frozen thereafter" }
      - { name: promised_wait_minutes, type: integer, source: computed, description: "PROMISED variant of calculations.on_demand_wait_estimate" }
      - { name: actual_wait_minutes, type: integer, source: computed, description: "REALIZED variant of calculations.on_demand_wait_estimate; null until served", default: null }
      - { name: wait_overage_minutes, type: integer, source: computed, description: "max(0, actual_wait_minutes - promised_wait_minutes); null until served", default: null }
      - { name: status, type: enum, source: system, description: "Request lifecycle state", default: "PENDING", constraints: "PENDING | MATCHED | SERVED | DENIED | EXPIRED" }

  - name: MaintenanceOrder
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle taken out of service" }
      - { name: kind, type: enum, source: input, description: "Kind of shop visit", constraints: "PREVENTIVE | CORRECTIVE | BRANDING_WRAP" }
      - { name: service_date, type: string, source: input, description: "Calendar date the shop visit occupies (YYYY-MM-DD, UTC)" }
      - { name: window_start_min, type: integer, source: input, description: "Shop window opens, minutes after local midnight", constraints: "0 .. 1439" }
      - { name: window_end_min, type: integer, source: input, description: "Shop window closes, minutes after local midnight", constraints: "0 .. 1439, >= window_start_min" }
      - { name: odometer_at_open, type: integer, source: system, description: "Snapshot of vehicle.odometer_km taken when the order was created" }
      - { name: status, type: enum, source: system, description: "Order state", default: "OPEN", constraints: "OPEN | CLOSED" }
      - { name: outcome, type: enum, source: input, description: "Branch chosen at close; null while OPEN", default: null, constraints: "RETURN_TO_SERVICE | RETIRE" }
      - { name: displaced_trip_count, type: integer, source: computed, description: "Number of Trip rows the creation cascade pushed back from ASSIGNED to SCHEDULED", default: 0 }

  - name: ServicePeriodReport
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; contract being reported" }
      - { name: period_start_date, type: string, source: input, description: "First service date in the period (YYYY-MM-DD, UTC)" }
      - { name: period_end_date, type: string, source: input, description: "Last service date in the period (YYYY-MM-DD, UTC)", constraints: ">= period_start_date" }
      - { name: status, type: enum, source: system, description: "Report lifecycle state", default: "DRAFT", constraints: "DRAFT | SUBMITTED | DISPUTED | APPROVED" }
      - { name: settlement_variant, type: enum, source: system, description: "Which variant of the settlement calculations produced the currently stored figures", default: "NONE", constraints: "NONE | PROVISIONAL | FINAL" }
      - { name: revision_round, type: integer, source: system, description: "Starts at 0; incremented by one each time the report is submitted out of DISPUTED", default: 0 }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID stamped by every submit call, overwriting whatever the previous submit stored", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approve call", default: null }
      - { name: dispute_reason, type: string, source: input, description: "Free text captured by dispute; null until disputed", default: null }
      - { name: effective_rate_cents_per_service_hour, type: integer, source: system, description: "contract.base_rate_cents_per_service_hour copied by every submit call, overwriting whatever the previous submit froze", default: 0 }
      - { name: scheduled_trip_count, type: integer, source: computed, description: "Count of the settlement input set for the stored variant", default: 0 }
      - { name: completed_trip_count, type: integer, source: computed, description: "Trips in the period with dispatch_status COMPLETED", default: 0 }
      - { name: missed_trip_count, type: integer, source: computed, description: "Trips in the period with dispatch_status MISSED and settlement_status != WAIVED", default: 0 }
      - { name: waived_trip_count, type: integer, source: computed, description: "Trips in the period with dispatch_status MISSED and settlement_status == WAIVED", default: 0 }
      - { name: countable_trip_count, type: integer, source: computed, description: "Denominator of on_time_pct; see calculations.period_sla_penalty", default: 0 }
      - { name: on_time_trip_count, type: integer, source: computed, description: "Numerator of on_time_pct; see calculations.period_sla_penalty", default: 0 }
      - { name: on_time_pct, type: number, source: computed, description: "See calculations.period_sla_penalty; 100.00 when countable_trip_count is 0", default: 0 }
      - { name: total_boardings, type: integer, source: computed, description: "Sum of Trip.counted_boardings over the settlement input set", default: 0 }
      - { name: total_ada_boardings, type: integer, source: computed, description: "Sum of Trip.counted_ada_boardings over the settlement input set", default: 0 }
      - { name: total_billable_minutes, type: integer, source: computed, description: "Integer minute sum before any rounding; see calculations.period_gross_amount", default: 0 }
      - { name: billable_service_hours, type: number, source: computed, description: "The single rounding step of period_gross_amount, 2 decimals", default: 0 }
      - { name: gross_amount_cents, type: integer, source: computed, description: "See calculations.period_gross_amount", default: 0 }
      - { name: penalty_tier_pct, type: number, source: computed, description: "SLA tier percentage selected by calculations.period_sla_penalty", default: 0 }
      - { name: sla_penalty_cents, type: integer, source: computed, description: "See calculations.period_sla_penalty", default: 0 }
      - { name: missed_trip_penalty_cents, type: integer, source: computed, description: "missed_trip_count * contract.penalty_rate_cents_per_missed_trip", default: 0 }
      - { name: penalty_amount_cents, type: integer, source: computed, description: "sla_penalty_cents + missed_trip_penalty_cents", default: 0 }
      - { name: credit_amount_cents, type: integer, source: computed, description: "See calculations.period_net_settlement", default: 0 }
      - { name: net_amount_cents, type: integer, source: computed, description: "See calculations.period_net_settlement", default: 0 }

  - name: CreditMemo
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; contract whose balance the memo moves" }
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; the trip that caused the credit, null only for GOODWILL memos", default: null }
      - { name: applied_report_id, type: string, source: system, description: "FK -> ServicePeriodReport.id; set when an approve call consumes the memo, null while ISSUED or VOIDED", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Credit amount in cents", constraints: ">= 1" }
      - { name: reason, type: enum, source: input, description: "Why the credit was raised", constraints: "MISSED_TRIP | WAIT_SLA_BREACH | GOODWILL" }
      - { name: status, type: enum, source: system, description: "Memo lifecycle state", default: "ISSUED", constraints: "ISSUED | APPLIED | VOIDED" }
      - { name: voided_reason, type: string, source: input, description: "Free text captured by void; null until voided", default: null }

  - name: RenewalOffer
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; contract being renewed" }
      - { name: basis_report_id, type: string, source: system, description: "FK -> ServicePeriodReport.id; the frozen APPROVED report the escalation was keyed on, null when the contract has no APPROVED report", default: null }
      - { name: successor_contract_id, type: string, source: system, description: "FK -> ServiceContract.id; the DRAFT contract minted by the accept cascade, null until ACCEPTED", default: null }
      - { name: proposed_term_months, type: integer, source: input, description: "Length of the renewal term in whole months", constraints: "1 .. 60" }
      - { name: proposed_rate_cents_per_service_hour, type: integer, source: computed, description: "See calculations.renewal_proposed_rate" }
      - { name: counter_rate_cents_per_service_hour, type: integer, source: input, description: "Client counter offer; null until countered", default: null }
      - { name: agreed_rate_cents_per_service_hour, type: integer, source: system, description: "Rate written into the successor contract; null until ACCEPTED", default: null }
      - { name: volume_pct, type: number, source: computed, description: "Volume tier component of renewal_proposed_rate", default: 0 }
      - { name: clawback_pct, type: number, source: computed, description: "Performance clawback component of renewal_proposed_rate", default: 0 }
      - { name: applied_escalation_pct, type: number, source: computed, description: "Capped percentage actually applied by renewal_proposed_rate", default: 0 }
      - { name: round_index, type: integer, source: system, description: "Negotiation round, starts at 1 and increments by one on every COUNTERED -> OPEN reopen", default: 1 }
      - { name: status, type: enum, source: system, description: "Offer lifecycle state", default: "OPEN", constraints: "OPEN | COUNTERED | ACCEPTED | DECLINED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Contract
  - entity: ServiceContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [RENEWED, TERMINATED]
    shape: "cyclic (ACTIVE -> RENEWAL_PENDING -> ACTIVE) with two terminal exits"
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-contracts/{id}/activate"
        actor: ContractAdmin
        preconditions:
          - "contract.status == DRAFT"
        side_effects:
          - "increments ServiceContract.version by 1"
          - "refreshes ServiceContract.updated_at"

      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /renewal-offers (creating an offer for this contract)"
        actor: ContractAdmin
        preconditions:
          - "contract.status == ACTIVE"
          - "clock_service_date >= term_end_date - RENEWAL_WINDOW_DAYS and clock_service_date <= term_end_date"
          - "payload expected_contract_version == contract.version"
        side_effects:
          - "any existing RenewalOffer for this contract with status IN {OPEN, COUNTERED} moves to SUPERSEDED"
          - "increments ServiceContract.version by 1"

      - from: RENEWAL_PENDING
        to: RENEWAL_PENDING
        trigger: "POST /renewal-offers (a further offer superseding the standing one)"
        actor: ContractAdmin
        preconditions:
          - "contract.status == RENEWAL_PENDING"
          - "payload expected_contract_version == contract.version"
        side_effects:
          - "the standing RenewalOffer with status IN {OPEN, COUNTERED} moves to SUPERSEDED"
          - "increments ServiceContract.version by 1"

      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /renewal-offers/{id}/respond with decision DECLINE"
        actor: ContractAdmin
        preconditions:
          - "offer.status == COUNTERED"
          - "contract.status == RENEWAL_PENDING"
        side_effects:
          - "the offer moves to DECLINED"
          - "increments ServiceContract.version by 1"
        note: "Cycle back to ACTIVE; the contract may be re-offered later inside the same renewal window."

      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /renewal-offers/{id}/respond with decision ACCEPT"
        actor: ContractAdmin
        preconditions:
          - "offer.status == COUNTERED"
          - "contract.status == RENEWAL_PENDING"
        side_effects:
          - "RENEWAL CASCADE link 1: the offer moves to COUNTERED -> ACCEPTED and agreed_rate_cents_per_service_hour is set to offer.counter_rate_cents_per_service_hour"
          - "RENEWAL CASCADE link 2: because the offer became ACCEPTED, this contract moves to RENEWED"
          - "RENEWAL CASCADE link 3: because this contract became RENEWED, a successor ServiceContract is minted in DRAFT with predecessor_contract_id = this contract id, base_rate_cents_per_service_hour = offer.agreed_rate_cents_per_service_hour, term_start_date = this contract's term_end_date plus one day, term_end_date = term_start_date plus proposed_term_months months minus one day, and every other input field copied from this contract; offer.successor_contract_id is set to the new contract id"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /service-contracts/{id}/terminate"
        actor: ContractAdmin
        preconditions:
          - "contract.status IN {ACTIVE, RENEWAL_PENDING}"
        side_effects:
          - "every Route of this contract with status IN {DRAFT, PUBLISHED, DEGRADED} moves to RETIRED"
          - "because those routes became RETIRED, every Trip of those routes with dispatch_status IN {SCHEDULED, ASSIGNED} moves to CANCELLED, vehicle_id and driver_id are cleared, and Vehicle.committed_block_minutes plus Driver.assigned_duty_minutes_current_date are recomputed"
          - "because those trips became CANCELLED, every OnDemandRequest of this contract with status IN {PENDING, MATCHED} moves to EXPIRED and matched_trip_id is cleared"
          - "increments ServiceContract.version by 1"

      - from: RENEWAL_PENDING
        to: TERMINATED
        trigger: "POST /service-contracts/{id}/terminate"
        actor: ContractAdmin
        preconditions:
          - "contract.status IN {ACTIVE, RENEWAL_PENDING}"
        side_effects:
          - "the standing RenewalOffer with status IN {OPEN, COUNTERED} moves to SUPERSEDED"
          - "the same route / trip / on-demand cascade as ACTIVE -> TERMINATED runs"
          - "increments ServiceContract.version by 1"

  # ------------------------------------------------------------------- Route
  - entity: Route
    state_field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: "cyclic (PUBLISHED -> DEGRADED -> PUBLISHED via republish)"
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /routes/{id}/publish"
        actor: OpsPlanner
        preconditions:
          - "route.status == DRAFT"
          - "contract.status IN {ACTIVE, RENEWAL_PENDING}"
          - "payload service_date is within [contract.term_start_date, contract.term_end_date]"
        side_effects:
          - "generates Trip rows per calculations.trip_generation for payload service_date"
          - "sets route.published_service_date to payload service_date"
          - "recomputes route.required_vehicle_count and route.ada_required_count per calculations.route_fleet_requirement"
          - "increments Route.version by 1"

      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /routes/{id}/republish"
        actor: OpsPlanner
        preconditions:
          - "route.status IN {PUBLISHED, DEGRADED}"
          - "contract.status IN {ACTIVE, RENEWAL_PENDING}"
          - "payload expected_route_version == route.version"
          - "payload service_date is within [contract.term_start_date, contract.term_end_date]"
        side_effects:
          - "every Trip of this route on payload service_date with dispatch_status IN {SCHEDULED, ASSIGNED} moves to CANCELLED and has vehicle_id / driver_id cleared; trips already IN_SERVICE, COMPLETED, MISSED or CANCELLED are left untouched"
          - "because those trips were cancelled, Vehicle.committed_block_minutes and Driver.assigned_duty_minutes_current_date are recomputed, and every OnDemandRequest whose matched_trip_id pointed at a cancelled trip moves back to PENDING with matched_trip_id cleared"
          - "route.headway_minutes is replaced by payload headway_minutes"
          - "regenerates Trip rows per calculations.trip_generation with the new headway"
          - "recomputes route.required_vehicle_count and route.ada_required_count"
          - "increments Route.version by 1"

      - from: DEGRADED
        to: PUBLISHED
        trigger: "POST /routes/{id}/republish"
        actor: OpsPlanner
        preconditions:
          - "route.status IN {PUBLISHED, DEGRADED}"
          - "payload expected_route_version == route.version"
        side_effects:
          - "the same cancel-and-regenerate cascade as PUBLISHED -> PUBLISHED runs"
          - "route.status returns to PUBLISHED"
          - "increments Route.version by 1"
        note: "Recovery leg of the route cycle."

      - from: PUBLISHED
        to: DEGRADED
        trigger: "system: maintenance displacement cascade (POST /maintenance-orders)"
        actor: system
        preconditions:
          - "route.status == PUBLISHED"
          - "after the displacement, the count of distinct vehicle_id values over this route's trips on the affected service_date with dispatch_status IN {ASSIGNED, IN_SERVICE} is strictly less than route.required_vehicle_count"
        side_effects:
          - "increments Route.version by 1"

      - from: PUBLISHED
        to: RETIRED
        trigger: "system: ServiceContract terminate or renewal-accept cascade"
        actor: system
        preconditions:
          - "route.status IN {DRAFT, PUBLISHED, DEGRADED}"
        side_effects:
          - "every Trip of this route with dispatch_status IN {SCHEDULED, ASSIGNED} moves to CANCELLED"
          - "increments Route.version by 1"

      - from: DEGRADED
        to: RETIRED
        trigger: "system: ServiceContract terminate or renewal-accept cascade"
        actor: system
        preconditions:
          - "route.status IN {DRAFT, PUBLISHED, DEGRADED}"
        side_effects:
          - "every Trip of this route with dispatch_status IN {SCHEDULED, ASSIGNED} moves to CANCELLED"
          - "increments Route.version by 1"

      - from: DRAFT
        to: RETIRED
        trigger: "system: ServiceContract terminate cascade"
        actor: system
        preconditions:
          - "route.status == DRAFT"
        side_effects:
          - "increments Route.version by 1"

  # ----------------------------------------------------------------- Vehicle
  - entity: Vehicle
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    shape: "cyclic (AVAILABLE -> IN_MAINTENANCE -> AVAILABLE) with a branching exit at close"
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /maintenance-orders whose service_date equals the logical clock's current UTC date"
        actor: FleetManager
        preconditions:
          - "vehicle.status == AVAILABLE"
          - "order.service_date == clock_service_date"
        side_effects:
          - "MAINTENANCE CASCADE link 2 (link 1 is the MaintenanceOrder OPEN row itself)"
          - "MAINTENANCE CASCADE link 3: because this vehicle became IN_MAINTENANCE, every Trip with vehicle_id == vehicle.id, service_date == order.service_date, dispatch_status == ASSIGNED and whose closed interval [scheduled_departure_min, scheduled_arrival_min] intersects the closed window [window_start_min, window_end_min] is displaced: dispatch_status returns to SCHEDULED, vehicle_id and driver_id are cleared, and MaintenanceOrder.displaced_trip_count is set to the number of trips displaced"
          - "MAINTENANCE CASCADE link 4: because each displaced trip lost its vehicle, every OnDemandRequest with matched_trip_id == that trip id and status == MATCHED returns to PENDING, matched_trip_id is cleared and promised_wait_minutes is recomputed by the PROMISED variant of on_demand_wait_estimate"
          - "MAINTENANCE CASCADE branch: because the displaced trips left the route's assigned set, every affected Route with status == PUBLISHED whose distinct assigned-vehicle count on that service_date is now below required_vehicle_count moves to DEGRADED"
          - "recomputes Vehicle.committed_block_minutes and Driver.assigned_duty_minutes_current_date for every driver freed"
          - "increments Vehicle.version by 1"

      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /maintenance-orders/{id}/close with outcome RETURN_TO_SERVICE"
        actor: FleetManager
        preconditions:
          - "order.status == OPEN"
          - "vehicle.status == IN_MAINTENANCE"
        side_effects:
          - "order.status moves to CLOSED and order.outcome is set to RETURN_TO_SERVICE"
          - "increments Vehicle.version by 1"

      - from: IN_MAINTENANCE
        to: RETIRED
        trigger: "POST /maintenance-orders/{id}/close with outcome RETIRE"
        actor: FleetManager
        preconditions:
          - "order.status == OPEN"
          - "vehicle.status == IN_MAINTENANCE"
        side_effects:
          - "order.status moves to CLOSED and order.outcome is set to RETIRE"
          - "vehicle.branding_contract_id is cleared and, if it was set, ServiceContract.branded_vehicle_count and branded_ada_vehicle_count on that contract are recomputed"
          - "increments Vehicle.version by 1"
        note: "Branching fork: the same close endpoint produces two different terminal side-effect sets."

  # -------------------------------------------------------- MaintenanceOrder
  - entity: MaintenanceOrder
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: "branching fork at close (RETURN_TO_SERVICE vs RETIRE)"
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /maintenance-orders/{id}/close"
        actor: FleetManager
        preconditions:
          - "order.status == OPEN"
        side_effects:
          - "drives the Vehicle IN_MAINTENANCE -> AVAILABLE or IN_MAINTENANCE -> RETIRED transition according to payload outcome; when the vehicle is still AVAILABLE (future-dated order) only order.status and order.outcome change"
          - "increments MaintenanceOrder.version by 1"

  # ------------------------------------------- Trip, axis 1: dispatch_status
  - entity: Trip
    state_field: dispatch_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    shape: "parallel dimension 1 of 2 on Trip; evolves independently of settlement_status"
    transitions:
      - from: SCHEDULED
        to: ASSIGNED
        trigger: "POST /trips/{id}/assign"
        actor: OpsPlanner
        preconditions:
          - "trip.dispatch_status == SCHEDULED"
          - "route.status IN {PUBLISHED, DEGRADED}"
          - "vehicle.status == AVAILABLE"
          - "vehicle.branding_contract_id is null or equals trip.contract_id"
          - "no OPEN MaintenanceOrder for the vehicle on trip.service_date whose closed window intersects the trip's closed interval"
          - "driver.ada_certified is true whenever vehicle.is_ada_accessible is true"
          - "no vehicle block conflict per validations priority 100"
          - "no driver block conflict per validations priority 102"
          - "driver duty cap not exceeded per validations priority 104"
        side_effects:
          - "sets trip.vehicle_id and trip.driver_id"
          - "recomputes Vehicle.committed_block_minutes per calculations.vehicle_committed_block_minutes"
          - "recomputes Driver.assigned_duty_minutes_current_date per calculations.driver_assigned_duty_minutes"
          - "increments Trip.version by 1"

      - from: ASSIGNED
        to: SCHEDULED
        trigger: "POST /trips/{id}/unassign"
        actor: OpsPlanner
        preconditions:
          - "trip.dispatch_status == ASSIGNED"
        side_effects:
          - "clears trip.vehicle_id and trip.driver_id"
          - "recomputes Vehicle.committed_block_minutes on the released vehicle, restoring it to its pre-assign value"
          - "recomputes Driver.assigned_duty_minutes_current_date on the released driver"
          - "every OnDemandRequest with matched_trip_id == trip.id and status == MATCHED returns to PENDING with matched_trip_id cleared, and trip.matched_party_seats is recomputed"
          - "increments Trip.version by 1"
        note: "Compensating action of assign; see calculations.vehicle_committed_block_minutes for the conserved quantity."

      - from: ASSIGNED
        to: IN_SERVICE
        trigger: "POST /trips/{id}/start"
        actor: DriverUser
        preconditions:
          - "trip.dispatch_status == ASSIGNED"
          - "X-User-ID equals trip.driver_id"
        side_effects:
          - "sets trip.actual_departure_min from the payload"
          - "increments Trip.version by 1"

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /trips/{id}/complete"
        actor: DriverUser
        preconditions:
          - "trip.dispatch_status == IN_SERVICE"
          - "X-User-ID equals trip.driver_id"
          - "payload actual_completion_min >= trip.actual_departure_min"
        side_effects:
          - "sets trip.actual_completion_min from the payload"
          - "appends a RidershipCount row with source DRIVER_TALLY and the next sequence_no for this trip"
          - "recomputes trip.counted_boardings and trip.counted_ada_boardings per calculations.ridership_counted_boardings"
          - "increments Trip.version by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /trips/{id}/mark-missed"
        actor: OpsPlanner
        preconditions:
          - "trip.dispatch_status IN {SCHEDULED, ASSIGNED}"
        side_effects:
          - "sets trip.missed_reason from the payload"
          - "drives the settlement axis per the Trip settlement_status machine (OPERATOR_FAULT -> CREDITED, CLIENT_REQUEST -> WAIVED, WEATHER -> settlement_status unchanged)"
          - "every OnDemandRequest with matched_trip_id == trip.id and status == MATCHED moves to DENIED with matched_trip_id cleared"
          - "increments Trip.version by 1"

      - from: ASSIGNED
        to: MISSED
        trigger: "POST /trips/{id}/mark-missed"
        actor: OpsPlanner
        preconditions:
          - "trip.dispatch_status IN {SCHEDULED, ASSIGNED}"
        side_effects:
          - "clears trip.vehicle_id and trip.driver_id and recomputes Vehicle.committed_block_minutes and Driver.assigned_duty_minutes_current_date"
          - "the same settlement-axis and on-demand side effects as SCHEDULED -> MISSED"
          - "increments Trip.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: route republish, route retire or contract terminate cascade"
        actor: system
        preconditions:
          - "trip.dispatch_status IN {SCHEDULED, ASSIGNED}"
        side_effects:
          - "increments Trip.version by 1"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "system: route republish, route retire or contract terminate cascade"
        actor: system
        preconditions:
          - "trip.dispatch_status IN {SCHEDULED, ASSIGNED}"
        side_effects:
          - "clears trip.vehicle_id and trip.driver_id and recomputes Vehicle.committed_block_minutes and Driver.assigned_duty_minutes_current_date"
          - "increments Trip.version by 1"

  # ----------------------------------------- Trip, axis 2: settlement_status
  - entity: Trip
    state_field: settlement_status
    initial_state: UNBILLED
    terminal_states: [BILLED, WAIVED]
    shape: "parallel dimension 2 of 2 on Trip; a COMPLETED trip stays UNBILLED until a report is approved, and a CREDITED trip can be walked back to UNBILLED"
    transitions:
      - from: UNBILLED
        to: CREDITED
        trigger: "POST /trips/{id}/mark-missed with reason OPERATOR_FAULT"
        actor: OpsPlanner
        preconditions:
          - "trip.settlement_status == UNBILLED"
        side_effects:
          - "MISSED-TRIP CASCADE link 2: because the settlement axis moved to CREDITED, a CreditMemo is minted with contract_id = trip.contract_id, trip_id = trip.id, reason MISSED_TRIP, status ISSUED and amount_cents = contract.penalty_rate_cents_per_missed_trip"
          - "MISSED-TRIP CASCADE link 3: because a CreditMemo became ISSUED, ServiceContract.credit_balance_cents is recomputed per calculations.contract_credit_balance and ServiceContract.version increments by 1"

      - from: UNBILLED
        to: WAIVED
        trigger: "POST /trips/{id}/mark-missed with reason CLIENT_REQUEST"
        actor: OpsPlanner
        preconditions:
          - "trip.settlement_status == UNBILLED"
        side_effects:
          - "no CreditMemo is minted and ServiceContract.credit_balance_cents is unchanged"
        note: "Divergent branch of the same trigger: WAIVED trips leave both the on-time denominator and missed_trip_count."

      - from: CREDITED
        to: UNBILLED
        trigger: "POST /credit-memos/{id}/void"
        actor: ContractAdmin
        preconditions:
          - "memo.status == ISSUED"
          - "memo.trip_id is not null and memo.reason == MISSED_TRIP"
        side_effects:
          - "memo.status moves to VOIDED"
          - "because the memo left ISSUED, ServiceContract.credit_balance_cents is recomputed and returns to its pre-issue value"
          - "increments Trip.version by 1"
        note: "Compensating action of the missed-trip cascade."

      - from: UNBILLED
        to: BILLED
        trigger: "system: POST /service-period-reports/{id}/approve"
        actor: system
        preconditions:
          - "trip.dispatch_status == COMPLETED"
          - "trip.settlement_status == UNBILLED"
          - "trip.service_date is within [report.period_start_date, report.period_end_date]"
        side_effects:
          - "increments Trip.version by 1"

  # -------------------------------------------------------- OnDemandRequest
  - entity: OnDemandRequest
    state_field: status
    initial_state: PENDING
    terminal_states: [SERVED, DENIED, EXPIRED]
    shape: "branching with revert (PENDING -> MATCHED -> PENDING on displacement)"
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "POST /on-demand-requests/{id}/match"
        actor: OpsPlanner
        preconditions:
          - "request.status == PENDING"
          - "the resolved trip satisfies the eligibility filter of calculations.trip_match_selector"
          - "the resolved trip's route.status == PUBLISHED"
        side_effects:
          - "sets request.matched_trip_id"
          - "recomputes Trip.matched_party_seats"
          - "increments OnDemandRequest.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /on-demand-requests/{id}/match with an empty candidate pool"
        actor: OpsPlanner
        preconditions:
          - "request.status == PENDING"
          - "payload trip_id omitted and calculations.trip_match_selector yields an empty candidate set"
        side_effects:
          - "increments OnDemandRequest.version by 1"
        note: "Empty-pool fallback of the selector policy; responds 200 with the DENIED request, not an error."

      - from: MATCHED
        to: PENDING
        trigger: "system: trip unassign, maintenance displacement or route republish cascade"
        actor: system
        preconditions:
          - "request.status == MATCHED"
        side_effects:
          - "clears matched_trip_id, recomputes promised_wait_minutes with the PROMISED variant and recomputes Trip.matched_party_seats"
          - "increments OnDemandRequest.version by 1"

      - from: MATCHED
        to: DENIED
        trigger: "system: POST /trips/{id}/mark-missed on the matched trip"
        actor: system
        preconditions:
          - "request.status == MATCHED"
        side_effects:
          - "clears matched_trip_id"
          - "increments OnDemandRequest.version by 1"

      - from: MATCHED
        to: SERVED
        trigger: "POST /on-demand-requests/{id}/serve"
        actor: DriverUser
        preconditions:
          - "request.status == MATCHED"
          - "the matched trip's dispatch_status IN {IN_SERVICE, COMPLETED}"
          - "X-User-ID equals the matched trip's driver_id"
        side_effects:
          - "computes actual_wait_minutes and wait_overage_minutes with the REALIZED variant of calculations.on_demand_wait_estimate"
          - "when wait_overage_minutes > WAIT_SLA_GRACE_MINUTES a CreditMemo is minted with reason WAIT_SLA_BREACH, trip_id = request.matched_trip_id, status ISSUED and amount_cents = min(wait_overage_minutes * WAIT_CREDIT_CENTS_PER_MINUTE, contract.penalty_rate_cents_per_missed_trip); because that memo became ISSUED, ServiceContract.credit_balance_cents is recomputed and ServiceContract.version increments by 1"
          - "increments OnDemandRequest.version by 1"

      - from: PENDING
        to: EXPIRED
        trigger: "system: ServiceContract terminate cascade"
        actor: system
        preconditions:
          - "request.status IN {PENDING, MATCHED}"
        side_effects:
          - "increments OnDemandRequest.version by 1"

      - from: MATCHED
        to: EXPIRED
        trigger: "system: ServiceContract terminate cascade"
        actor: system
        preconditions:
          - "request.status IN {PENDING, MATCHED}"
        side_effects:
          - "clears matched_trip_id and recomputes Trip.matched_party_seats"
          - "increments OnDemandRequest.version by 1"

  # ----------------------------------------------------- ServicePeriodReport
  - entity: ServicePeriodReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    shape: "cyclic (SUBMITTED -> DISPUTED -> SUBMITTED revision loop)"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /service-period-reports/{id}/submit"
        actor: ClientLiaison
        preconditions:
          - "report.status IN {DRAFT, DISPUTED}"
        side_effects:
          - "freezes effective_rate_cents_per_service_hour from contract.base_rate_cents_per_service_hour"
          - "computes every settlement field with the PROVISIONAL variant of period_gross_amount, period_sla_penalty and period_net_settlement and sets settlement_variant to PROVISIONAL"
          - "sets submitted_by_user_id to the caller's X-User-ID"
          - "increments ServicePeriodReport.version by 1"

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /service-period-reports/{id}/submit"
        actor: ClientLiaison
        preconditions:
          - "report.status IN {DRAFT, DISPUTED}"
        side_effects:
          - "increments revision_round by 1"
          - "re-freezes effective_rate_cents_per_service_hour and recomputes every settlement field with the PROVISIONAL variant"
          - "sets submitted_by_user_id to the caller's X-User-ID"
          - "increments ServicePeriodReport.version by 1"
        note: "Return leg of the report cycle."

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /service-period-reports/{id}/dispute"
        actor: ClientLiaison
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "stores dispute_reason, resets settlement_variant to NONE and zeroes scheduled_trip_count, completed_trip_count, missed_trip_count, waived_trip_count, countable_trip_count, on_time_trip_count, on_time_pct, total_boardings, total_ada_boardings, total_billable_minutes, billable_service_hours, gross_amount_cents, penalty_tier_pct, sla_penalty_cents, missed_trip_penalty_cents, penalty_amount_cents, credit_amount_cents and net_amount_cents"
          - "increments ServicePeriodReport.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /service-period-reports/{id}/approve"
        actor: ContractAdmin
        preconditions:
          - "report.status == SUBMITTED"
          - "contract.status IN {ACTIVE, RENEWAL_PENDING}"
          - "X-User-ID != report.submitted_by_user_id"
        side_effects:
          - "recomputes every settlement field with the FINAL variant and sets settlement_variant to FINAL"
          - "sets approved_by_user_id to the caller's X-User-ID"
          - "after credit_amount_cents has been computed, every CreditMemo of this contract with status ISSUED whose trip's service_date lies inside the period moves to APPLIED with applied_report_id set to this report"
          - "because those memos left ISSUED, ServiceContract.credit_balance_cents is recomputed and ServiceContract.version increments by 1"
          - "every Trip in the FINAL input set with settlement_status UNBILLED moves to BILLED"
          - "increments ServicePeriodReport.version by 1"

  # ------------------------------------------------------------ RenewalOffer
  - entity: RenewalOffer
    state_field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    shape: "cyclic negotiation (OPEN -> COUNTERED -> OPEN, round_index increments each lap)"
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /renewal-offers/{id}/counter"
        actor: ClientLiaison
        preconditions:
          - "offer.status == OPEN"
          - "contract.status == RENEWAL_PENDING"
          - "contract.base_rate_cents_per_service_hour <= payload counter_rate_cents_per_service_hour <= offer.proposed_rate_cents_per_service_hour"
        side_effects:
          - "stores counter_rate_cents_per_service_hour"
          - "increments RenewalOffer.version by 1"

      - from: COUNTERED
        to: OPEN
        trigger: "POST /renewal-offers/{id}/respond with decision REOPEN"
        actor: ContractAdmin
        preconditions:
          - "offer.status == COUNTERED"
        side_effects:
          - "increments round_index by 1"
          - "clears counter_rate_cents_per_service_hour"
          - "increments RenewalOffer.version by 1"
        note: "Return leg of the negotiation cycle."

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /renewal-offers/{id}/respond with decision ACCEPT"
        actor: ContractAdmin
        preconditions:
          - "offer.status == COUNTERED"
          - "contract.status == RENEWAL_PENDING"
        side_effects:
          - "sets agreed_rate_cents_per_service_hour to counter_rate_cents_per_service_hour"
          - "drives the ServiceContract RENEWAL_PENDING -> RENEWED cascade, whose link 3 mints the successor contract and writes successor_contract_id back onto this offer"
          - "increments RenewalOffer.version by 1"

      - from: COUNTERED
        to: DECLINED
        trigger: "POST /renewal-offers/{id}/respond with decision DECLINE"
        actor: ContractAdmin
        preconditions:
          - "offer.status == COUNTERED"
          - "contract.status == RENEWAL_PENDING"
        side_effects:
          - "drives the ServiceContract RENEWAL_PENDING -> ACTIVE transition"
          - "increments RenewalOffer.version by 1"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system: POST /renewal-offers creating a newer offer for the same contract"
        actor: system
        preconditions:
          - "offer.status IN {OPEN, COUNTERED}"
        side_effects:
          - "increments RenewalOffer.version by 1"

      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system: POST /renewal-offers creating a newer offer, or the contract terminate cascade"
        actor: system
        preconditions:
          - "offer.status IN {OPEN, COUNTERED}"
        side_effects:
          - "increments RenewalOffer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on a parent entity's version — only sanctioned
#         mechanism; both entries pass the serial-observability filter because
#         the loser's request would legitimately succeed against fresh state)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-offer-create-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /renewal-offers"
    occ_field: "expected_contract_version"
    description: |
      Creating a RenewalOffer against a ServiceContract whose version has
      advanced since the client last read it is rejected. A second create is
      legitimate product behaviour on its own terms — it supersedes the
      standing offer — so the only thing separating an intentional supersede
      from a write made against a stale view of the contract is the version
      the caller carries.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: route-republish-stale-route
    parent_entity: Route
    write_endpoint: "POST /routes/{id}/republish"
    occ_field: "expected_route_version"
    description: |
      Republishing a Route with a new headway against a version that has since
      advanced is rejected. Republish is idempotent-looking but destructive: it
      cancels the day's SCHEDULED and ASSIGNED trips and regenerates them, so a
      caller working from a stale headway or a stale trip list would silently
      discard work another writer already committed.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: route_fleet_requirement
    trigger: "POST /routes, POST /routes/{id}/publish, POST /routes/{id}/republish"
    algorithm: threshold
    formula: |
      headway_vehicles = ceil(route.loop_minutes / route.headway_minutes)
      demand_vehicles  = ceil( (route.demand_forecast_pax_per_hour * route.loop_minutes)
                               / (60 * route.reference_seat_capacity) )
      route.required_vehicle_count = max(headway_vehicles, demand_vehicles)
      route.ada_required_count     = ceil( route.required_vehicle_count
                                           * contract.ada_min_accessible_pct / 100 )
      # ceil() is applied to the exact rational value, never to a pre-rounded float.
    input_set: "The route row itself plus its owning ServiceContract's ada_min_accessible_pct. No Trip or Vehicle row participates."
    constants: {}
    precision: "All four intermediate values are integers; ceil is exact-rational ceiling."
    difficulty_mode: "combinatorial mode (a) — four inputs (loop_minutes, headway_minutes, demand_forecast_pax_per_hour, reference_seat_capacity) interacting non-linearly through two independent ceilings feeding a max(), then a third ceiling keyed on a contract-level percentage."

  - name: trip_generation
    trigger: "POST /routes/{id}/publish and POST /routes/{id}/republish"
    algorithm: interval_merge
    formula: |
      n = floor( (route.service_window_end_min - route.service_window_start_min)
                 / route.headway_minutes ) + 1
      for k in 0 .. n-1:                       # ascending k, no other ordering
        departure_k = route.service_window_start_min + k * route.headway_minutes
        arrival_k   = departure_k + route.loop_minutes
        emit Trip(route_id = route.id,
                  contract_id = route.contract_id,
                  service_date = payload.service_date,
                  scheduled_departure_min = departure_k,
                  scheduled_arrival_min   = arrival_k,
                  dispatch_status = SCHEDULED,
                  settlement_status = UNBILLED)
      # Trips are persisted in ascending k, so created_at ascends with departure.
    input_set: "Only the route's own window and headway. Republish first cancels the day's SCHEDULED and ASSIGNED trips, then regenerates from k = 0 with the new headway; IN_SERVICE, COMPLETED, MISSED and CANCELLED trips are never touched or duplicated."
    constants: {}
    precision: "Integer minutes; floor is exact-rational floor."
    note: "GET /trips returns trips ordered by service_date ASC, then scheduled_departure_min ASC, then created_at ASC."

  - name: vehicle_committed_block_minutes
    trigger: "POST /trips/{id}/assign, POST /trips/{id}/unassign, POST /trips/{id}/mark-missed, POST /maintenance-orders, POST /routes/{id}/republish, POST /service-contracts/{id}/terminate"
    algorithm: aggregation
    formula: |
      Vehicle.committed_block_minutes =
        SUM over Trip t where t.vehicle_id == vehicle.id
                          and t.dispatch_status IN {ASSIGNED, IN_SERVICE, COMPLETED}
            ( (t.scheduled_arrival_min - t.scheduled_departure_min) + LAYOVER_BUFFER_MIN )
      # Full recompute from the trip table on every trigger; never an incremental delta.
    input_set: "Every Trip row pointing at this vehicle whose dispatch_status is ASSIGNED, IN_SERVICE or COMPLETED, across all service dates. SCHEDULED, MISSED and CANCELLED trips are excluded."
    constants:
      LAYOVER_BUFFER_MIN: 12
    precision: "Integer minutes."
    conserved_quantity: "Vehicle.committed_block_minutes is the conserved quantity of the assign / unassign compensating pair."

  - name: driver_assigned_duty_minutes
    trigger: "POST /trips/{id}/assign, POST /trips/{id}/unassign, POST /trips/{id}/mark-missed, POST /maintenance-orders, POST /routes/{id}/republish, POST /service-contracts/{id}/terminate, POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      D = the logical clock's current UTC calendar date (YYYY-MM-DD)
      Driver.assigned_duty_minutes_current_date =
        SUM over Trip t where t.driver_id == driver.id
                          and t.service_date == D
                          and t.dispatch_status IN {ASSIGNED, IN_SERVICE, COMPLETED}
            (t.scheduled_arrival_min - t.scheduled_departure_min)
      # No layover buffer: a driver's duty is measured by wheels-turning minutes only.
    input_set: "Trips of this driver on the clock's current UTC date with dispatch_status ASSIGNED, IN_SERVICE or COMPLETED."
    constants: {}
    precision: "Integer minutes."
    note: "The duty cap check at validations priority 104 evaluates the same sum for the candidate trip's service_date, which is not necessarily the clock date."

  - name: ridership_counted_boardings
    trigger: "POST /trips/{id}/complete and POST /ridership-counts"
    algorithm: projection
    formula: |
      rows = RidershipCount rows with trip_id == trip.id
      apc  = rows filtered to source == APC_SENSOR
      if apc is non-empty:
        chosen = the apc row with the greatest sequence_no
      else:
        tally = rows filtered to source == DRIVER_TALLY
        chosen = the tally row with the greatest sequence_no, or none when tally is empty
      trip.counted_boardings     = 0 if chosen is none else chosen.boarded
      trip.counted_ada_boardings = 0 if chosen is none else chosen.ada_boardings
    input_set: "All RidershipCount rows for the trip. sequence_no is a per-trip monotonic integer starting at 1; it is the only ranking key, so no created_at or id tie-break is ever needed."
    constants: {}
    precision: "Integers."
    note: "A single APC_SENSOR row outranks any number of DRIVER_TALLY rows regardless of insertion order."

  - name: contract_credit_balance
    trigger: "CreditMemo creation (manual, missed-trip cascade, wait-SLA cascade), POST /credit-memos/{id}/void, POST /service-period-reports/{id}/approve"
    algorithm: aggregation
    formula: |
      ServiceContract.credit_balance_cents =
        SUM over CreditMemo m where m.contract_id == contract.id
                                and m.status == ISSUED
            (m.amount_cents)
      # APPLIED and VOIDED memos are excluded, so the balance is always the
      # outstanding, not-yet-settled credit.
    input_set: "CreditMemo rows of this contract with status ISSUED only."
    constants: {}
    precision: "Integer cents."
    conserved_quantity: "ServiceContract.credit_balance_cents is the conserved quantity of the issue / void compensating pair."

  - name: on_demand_wait_estimate
    trigger: "POST /on-demand-requests (PROMISED) and POST /on-demand-requests/{id}/serve (REALIZED)"
    algorithm: forward_looking
    formula: |
      # --- PROMISED, evaluated once at creation and then frozen -------------
      candidates = Route r where r.contract_id == request.contract_id
                              and r.status == PUBLISHED
                              and r.published_service_date == request.service_date
                              and r.service_window_start_min <= request.requested_pickup_min
                              and request.requested_pickup_min <= r.service_window_end_min
      rank by r.headway_minutes ASC; tie-break r.created_at ASC
      if candidates is empty -> reject the create with ERR_NO_ELIGIBLE_ROUTE (422)
      chosen = first candidate
      request.promised_headway_minutes = chosen.headway_minutes
      request.promised_wait_minutes    = ceil(chosen.headway_minutes / 2) + BOARDING_LEAD_MINUTES

      # --- REALIZED, evaluated at serve ------------------------------------
      request.actual_wait_minutes   = max(0, payload.actual_pickup_min - request.requested_pickup_min)
      request.wait_overage_minutes  = max(0, request.actual_wait_minutes - request.promised_wait_minutes)
      if request.wait_overage_minutes > WAIT_SLA_GRACE_MINUTES:
        mint CreditMemo(contract_id = request.contract_id,
                        trip_id     = request.matched_trip_id,
                        reason      = WAIT_SLA_BREACH,
                        status      = ISSUED,
                        amount_cents = min(request.wait_overage_minutes * WAIT_CREDIT_CENTS_PER_MINUTE,
                                           contract.penalty_rate_cents_per_missed_trip))
    input_set: "PROMISED reads only PUBLISHED Route rows of the request's contract whose published_service_date equals the request's service_date. REALIZED reads only the request's own frozen promised_wait_minutes and the served pickup minute; it never re-reads the route."
    constants:
      BOARDING_LEAD_MINUTES: 3
      WAIT_SLA_GRACE_MINUTES: 2
      WAIT_CREDIT_CENTS_PER_MINUTE: 150
    precision: "Integer minutes and integer cents; ceil is exact-rational ceiling."
    variants:
      - name: PROMISED
        when: "At POST /on-demand-requests, before any trip is matched."
        difference: "Derives the wait from half the selected route's planned headway plus a fixed boarding lead. It never looks at a Trip row, so it is blind to displacement, missed trips and actual departure times."
      - name: REALIZED
        when: "At POST /on-demand-requests/{id}/serve."
        difference: "Derives the wait from the observed pickup minute against the rider's requested pickup minute, and converts any overage beyond the grace into money. For the same request the two variants routinely disagree, and only the REALIZED variant can create a CreditMemo."

  - name: trip_match_selector
    trigger: "POST /on-demand-requests/{id}/match"
    algorithm: constraint_propagation
    formula: |
      # Eligibility filter — the candidate set, over entity fields only
      eligible(t) :=
            t.contract_id == request.contract_id
        and t.service_date == request.service_date
        and t.dispatch_status IN {SCHEDULED, ASSIGNED}
        and t.scheduled_departure_min >= request.requested_pickup_min
        and route_of(t).status == PUBLISHED
        and ( request.requires_ada == false
              or ( t.vehicle_id is not null
                   and vehicle_of(t).is_ada_accessible == true ) )
        and remaining_seats(t) >= request.party_size

      remaining_seats(t) := ( vehicle_of(t).seat_capacity if t.vehicle_id is not null
                              else route_of(t).reference_seat_capacity )
                            - t.matched_party_seats

      # Ranking expression
      rank by t.scheduled_departure_min ASC
      tie-break 1: route_of(t).headway_minutes ASC
      tie-break 2: t.created_at ASC

      # Empty-pool fallback
      if the candidate set is empty:
         request.status = DENIED and the endpoint responds 200 with the DENIED request

      # Explicit trip_id form
      if payload.trip_id is supplied, the selector is skipped but eligible(t)
      is still enforced on that single trip; a failure raises the corresponding
      validation error instead of DENIED.
    input_set: "Trip rows of the request's contract on the request's service date whose dispatch_status is SCHEDULED or ASSIGNED. COMPLETED, IN_SERVICE, MISSED and CANCELLED trips are never candidates."
    constants: {}
    precision: "Integers."
    note: "No random property, and in particular no id, participates in eligibility, ranking or tie-break."

  - name: period_gross_amount
    trigger: "POST /service-period-reports/{id}/submit (PROVISIONAL) and POST /service-period-reports/{id}/approve (FINAL)"
    algorithm: aggregation
    formula: |
      # STEP 1 — input set, variant dependent (see variants below)
      # STEP 2 — per-trip billable minutes, integers, NEVER rounded here
      PROVISIONAL: billable_minutes(t) = t.scheduled_arrival_min - t.scheduled_departure_min
      FINAL:       billable_minutes(t) = t.actual_completion_min - t.actual_departure_min
      # STEP 3 — sum first
      report.total_billable_minutes = SUM over the input set of billable_minutes(t)
      # STEP 4 — round exactly ONCE, on the period total, never per trip
      report.billable_service_hours = round_half_up(report.total_billable_minutes / 60, 2)
      # STEP 5 — money
      report.gross_amount_cents = round_half_up(
          report.billable_service_hours * report.effective_rate_cents_per_service_hour, 0)
      # The rounding ORDER is pinned: sum-then-round. Rounding each trip's hours
      # to two decimals and then summing is explicitly NOT this system's rule and
      # produces different cents.
    input_set: |
      PROVISIONAL: Trip rows with contract_id == report.contract_id, service_date inside the
                   closed date range [period_start_date, period_end_date], and dispatch_status
                   IN {SCHEDULED, ASSIGNED, IN_SERVICE, COMPLETED}.
      FINAL:       the same date and contract filter, but dispatch_status == COMPLETED only.
      Both variants exclude MISSED and CANCELLED trips from the billable set.
    constants: {}
    precision: "billable_service_hours: 2 decimals, round_half_up. gross_amount_cents: integer cents, round_half_up."
    difficulty_mode: "combinatorial mode (b) — nested rounding whose order is pinned to sum-then-round."
    variants:
      - name: PROVISIONAL
        when: "Computed by submit, stored with settlement_variant PROVISIONAL."
        difference: "Bills the schedule: every non-missed trip in the period counts at its planned duration, including trips that were never assigned and never ran."
      - name: FINAL
        when: "Computed by approve, stored with settlement_variant FINAL."
        difference: "Bills the operation: only COMPLETED trips count, and each at its actual wheels-turning duration. For identical data the two variants produce different total_billable_minutes, different billable_service_hours and different gross_amount_cents."

  - name: period_sla_penalty
    trigger: "POST /service-period-reports/{id}/submit and POST /service-period-reports/{id}/approve, immediately after period_gross_amount"
    algorithm: threshold
    formula: |
      # The on-time population is variant independent: it is the same for
      # PROVISIONAL and FINAL, so only gross_amount_cents moves the penalty.
      countable = Trip t with contract_id == report.contract_id
                        and service_date inside the closed period range
                        and t.dispatch_status IN {COMPLETED, MISSED}
                        and t.settlement_status != WAIVED
      report.countable_trip_count = count(countable)
      report.on_time_trip_count   = count of t in countable where
                                      t.dispatch_status == COMPLETED
                                      and (t.actual_departure_min - t.scheduled_departure_min)
                                          <= ON_TIME_GRACE_MINUTES
      report.on_time_pct = 100.00 if report.countable_trip_count == 0
                           else round_half_up(100 * report.on_time_trip_count
                                              / report.countable_trip_count, 2)
      shortfall = contract.sla_on_time_threshold_pct - report.on_time_pct
      report.penalty_tier_pct =
          0  if shortfall <= 0
          2  if 0 < shortfall <= SLA_TIER_1_MAX_SHORTFALL
          5  if SLA_TIER_1_MAX_SHORTFALL < shortfall <= SLA_TIER_2_MAX_SHORTFALL
          10 if shortfall > SLA_TIER_2_MAX_SHORTFALL
      report.sla_penalty_cents = round_half_up(report.gross_amount_cents
                                               * report.penalty_tier_pct / 100, 0)
      report.missed_trip_count = count of t in the period with dispatch_status == MISSED
                                 and settlement_status != WAIVED
      report.waived_trip_count = count of t in the period with dispatch_status == MISSED
                                 and settlement_status == WAIVED
      report.missed_trip_penalty_cents = report.missed_trip_count
                                         * contract.penalty_rate_cents_per_missed_trip
      report.penalty_amount_cents = report.sla_penalty_cents + report.missed_trip_penalty_cents
    input_set: "Trips of the contract inside the closed period date range whose dispatch_status is COMPLETED or MISSED. WAIVED trips are removed from both the numerator and the denominator, and from missed_trip_count."
    constants:
      ON_TIME_GRACE_MINUTES: 5
      SLA_TIER_1_MAX_SHORTFALL: 5.00
      SLA_TIER_2_MAX_SHORTFALL: 15.00
    precision: "on_time_pct and penalty_tier_pct: 2 decimals, round_half_up. Cent amounts: integer, round_half_up."
    note: "Boundary is inclusive on the grace side: a departure delay of exactly ON_TIME_GRACE_MINUTES is on time, one minute more is late. Boundary is exclusive on the penalty side: shortfall of exactly 0 attracts no penalty."

  - name: period_net_settlement
    trigger: "POST /service-period-reports/{id}/submit and POST /service-period-reports/{id}/approve, immediately after period_sla_penalty"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned and single pass:
      #   1. gross_amount_cents           (period_gross_amount)
      #   2. penalty_amount_cents         (period_sla_penalty, reads gross)
      #   3. credit_amount_cents          (below, reads neither)
      #   4. net_amount_cents             (below, reads 1..3)
      # The floor at step 4 is never fed back into steps 1..3, which is what
      # makes the apparent circularity (net depends on penalty, penalty depends
      # on gross, and a zero net would otherwise re-open the tier choice)
      # well defined.
      report.credit_amount_cents =
        SUM over CreditMemo m where m.contract_id == report.contract_id
                                and m.status == ISSUED
                                and m.trip_id is not null
                                and trip_of(m).service_date inside the closed period range
            (m.amount_cents)
      report.net_amount_cents = max(0, report.gross_amount_cents
                                       - report.penalty_amount_cents
                                       - report.credit_amount_cents)
      report.total_boardings     = SUM over the settlement input set of t.counted_boardings
      report.total_ada_boardings = SUM over the settlement input set of t.counted_ada_boardings
      report.scheduled_trip_count = count of the settlement input set
      report.completed_trip_count = count of period trips with dispatch_status == COMPLETED
    input_set: "CreditMemo rows of the contract with status ISSUED whose trip's service_date falls inside the closed period range. GOODWILL memos with a null trip_id never enter a period and are therefore never settled by approve."
    constants: {}
    precision: "Integer cents; the floor clamps at exactly 0."
    difficulty_mode: "combinatorial mode (c) — a circular-looking dependency (net -> penalty -> gross, with a floor that could re-open the tier) resolved by a pinned single-pass evaluation order."
    variants:
      - name: PROVISIONAL
        when: "submit"
        difference: "Reads the PROVISIONAL gross and penalty; memos are read but left ISSUED."
      - name: FINAL
        when: "approve"
        difference: "Reads the FINAL gross and penalty, and only after net_amount_cents is stored does it flip the same memos to APPLIED. The two variants therefore report different net_amount_cents for identical underlying data."

  - name: renewal_proposed_rate
    trigger: "POST /renewal-offers"
    algorithm: tiered_pricing
    formula: |
      basis = the ServicePeriodReport of this contract with status == APPROVED and the
              greatest period_end_date; tie-break greatest created_at; none when the
              contract has no APPROVED report
      offer.basis_report_id = null if basis is none else basis.id
      offer.volume_pct =
          0.0 if basis is none
          0.0 if basis.total_boardings < VOLUME_TIER_1_BOARDINGS
          1.5 if VOLUME_TIER_1_BOARDINGS <= basis.total_boardings < VOLUME_TIER_2_BOARDINGS
          3.0 if basis.total_boardings >= VOLUME_TIER_2_BOARDINGS
      offer.clawback_pct =
          0.0 if basis is none
          CLAWBACK_PCT if basis.on_time_pct < contract.sla_on_time_threshold_pct
          0.0 otherwise
      raw_pct = contract.escalation_index_pct + offer.volume_pct - offer.clawback_pct
      offer.applied_escalation_pct = min(max(raw_pct, MIN_ESCALATION_PCT), MAX_ESCALATION_PCT)
      offer.proposed_rate_cents_per_service_hour =
          round_half_up(contract.base_rate_cents_per_service_hour
                        * (1 + offer.applied_escalation_pct / 100), 0)
      # Evaluation order pinned: the escalation is keyed on a FROZEN APPROVED
      # report, whose own effective_rate_cents_per_service_hour was itself
      # snapshotted at submit time. The new rate never feeds back into the
      # basis report, so "rate depends on report, report depends on rate" is
      # broken at the freeze.
    input_set: "Exactly one ServicePeriodReport — the contract's APPROVED report with the greatest period_end_date. SUBMITTED, DISPUTED and DRAFT reports are invisible to this calculation."
    constants:
      VOLUME_TIER_1_BOARDINGS: 2000
      VOLUME_TIER_2_BOARDINGS: 5000
      CLAWBACK_PCT: 2.0
      MIN_ESCALATION_PCT: 0.0
      MAX_ESCALATION_PCT: 6.0
      RENEWAL_WINDOW_DAYS: 60
    precision: "Percentages carry 2 decimals; the rate is integer cents, round_half_up."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 30
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 35
    category: auth
    check: "when the caller's role is DriverUser, X-User-ID equals the driver_id of the trip being acted on (for serve, the driver_id of request.matched_trip_id)"
    error_id: ERR_DRIVER_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /trips/{id}/start, POST /trips/{id}/complete, POST /on-demand-requests/{id}/serve, POST /ridership-counts"

  - priority: 40
    category: business_constraint
    check: "every required body field is present, types match, enum values are members of the declared set, integers are within their declared ranges, dates parse as YYYY-MM-DD and minute-of-day values are within 0..1439"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 45
    category: business_constraint
    check: "limit is an integer within 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 50
    category: existence
    check: "every resource named in the URL path exists, validated left to right"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_TRIP_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_MAINTENANCE_ORDER_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_MEMO_NOT_FOUND | ERR_OFFER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 55
    category: existence
    check: "every foreign key supplied in the body resolves to an existing row (contract_id, route_id, vehicle_id, driver_id, trip_id, branding_contract_id, predecessor_contract_id)"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_TRIP_NOT_FOUND"
    http_status: 404
    applies_to: "POST /service-contracts, POST /routes, POST /vehicles, POST /vehicles/{id}/brand, POST /trips/{id}/assign, POST /maintenance-orders, POST /on-demand-requests, POST /on-demand-requests/{id}/match, POST /ridership-counts, POST /service-period-reports, POST /credit-memos, POST /renewal-offers"

  - priority: 58
    category: state
    check: "the OCC version carried in the body equals the current version of the parent entity named by the matching §1.2.1 rule"
    error_id: "ERR_STALE_CONTRACT_VERSION | ERR_STALE_ROUTE_VERSION"
    http_status: 412
    applies_to: "POST /renewal-offers, POST /routes/{id}/republish"

  - priority: 60
    category: state
    check: "the target resource is in a state from which this operation is declared in §1.2"
    error_id: "ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_NOT_ACTIVE | ERR_ROUTE_NOT_DRAFT | ERR_ROUTE_NOT_PUBLISHED | ERR_TRIP_NOT_SCHEDULABLE | ERR_TRIP_NOT_ASSIGNED | ERR_TRIP_NOT_IN_SERVICE | ERR_REQUEST_NOT_PENDING | ERR_REQUEST_NOT_MATCHED | ERR_REPORT_NOT_SUBMITTABLE | ERR_REPORT_NOT_SUBMITTED | ERR_MEMO_NOT_ISSUED | ERR_OFFER_NOT_OPEN | ERR_OFFER_NOT_COUNTERED | ERR_MAINTENANCE_ORDER_NOT_OPEN"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 65
    category: state
    check: "the cross-entity state precondition holds: assign requires vehicle.status == AVAILABLE; approve requires contract.status IN {ACTIVE, RENEWAL_PENDING}; match requires the resolved trip's route.status == PUBLISHED; publish and republish require contract.status IN {ACTIVE, RENEWAL_PENDING}"
    error_id: "ERR_VEHICLE_UNAVAILABLE | ERR_CONTRACT_NOT_ACTIVE | ERR_ROUTE_NOT_PUBLISHED"
    http_status: 409
    applies_to: "POST /trips/{id}/assign, POST /service-period-reports/{id}/approve, POST /on-demand-requests/{id}/match, POST /routes/{id}/publish, POST /routes/{id}/republish"

  - priority: 70
    category: auth
    check: "the approving X-User-ID differs from report.submitted_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /service-period-reports/{id}/approve"

  - priority: 80
    category: business_safety
    check: "no OPEN MaintenanceOrder exists for the vehicle on the trip's service_date whose closed window [window_start_min, window_end_min] intersects the trip's closed interval [scheduled_departure_min, scheduled_arrival_min]"
    error_id: ERR_VEHICLE_IN_MAINTENANCE_WINDOW
    http_status: 422
    applies_to: "POST /trips/{id}/assign"

  - priority: 82
    category: business_safety
    check: "when the vehicle is ADA accessible, the driver is ada_certified"
    error_id: ERR_DRIVER_NOT_ADA_CERTIFIED
    http_status: 422
    applies_to: "POST /trips/{id}/assign"

  - priority: 84
    category: business_safety
    check: "when request.requires_ada is true, the resolved trip has a vehicle assigned and that vehicle is_ada_accessible"
    error_id: ERR_ADA_VEHICLE_REQUIRED
    http_status: 422
    applies_to: "POST /on-demand-requests/{id}/match with an explicit trip_id"

  - priority: 86
    category: business_safety
    check: "after the brand takes effect, round_half_up(100 * branded_ada_vehicle_count / branded_vehicle_count, 2) >= contract.ada_min_accessible_pct; equality passes"
    error_id: ERR_ADA_FLEET_SHORTFALL
    http_status: 422
    applies_to: "POST /vehicles/{id}/brand, POST /vehicles (when branding_contract_id is supplied)"

  - priority: 90
    category: business_constraint
    check: "fleet_code is not already used by another Vehicle row"
    error_id: ERR_FLEET_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /vehicles"

  - priority: 100
    category: business_constraint
    check: "no other Trip already assigned to this vehicle has a buffered block that intersects the candidate's; the buffered block of trip t is the half-open interval [t.scheduled_departure_min, t.scheduled_arrival_min + LAYOVER_BUFFER_MIN) on t.service_date, so two trips need a gap of at least LAYOVER_BUFFER_MIN minutes and a gap of exactly LAYOVER_BUFFER_MIN passes"
    error_id: ERR_VEHICLE_BLOCK_CONFLICT
    http_status: 409
    applies_to: "POST /trips/{id}/assign"

  - priority: 102
    category: business_constraint
    check: "no other Trip already assigned to this driver has a half-open interval [scheduled_departure_min, scheduled_arrival_min) on the same service_date that intersects the candidate's; drivers carry NO layover buffer, so touching endpoints (one trip's arrival equal to the next trip's departure) are permitted"
    error_id: ERR_DRIVER_BLOCK_CONFLICT
    http_status: 409
    applies_to: "POST /trips/{id}/assign"

  - priority: 104
    category: business_constraint
    check: "the driver's total assigned duty minutes on the candidate trip's service_date, including the candidate, is <= driver.max_duty_minutes_per_day; equality passes"
    error_id: ERR_DRIVER_DUTY_EXCEEDED
    http_status: 422
    applies_to: "POST /trips/{id}/assign"

  - priority: 106
    category: business_constraint
    check: "the resolved trip's remaining_seats per calculations.trip_match_selector is >= request.party_size"
    error_id: ERR_TRIP_SEATS_EXHAUSTED
    http_status: 409
    applies_to: "POST /on-demand-requests/{id}/match with an explicit trip_id"

  - priority: 110
    category: business_temporal
    check: "the payload service_date lies inside the closed range [contract.term_start_date, contract.term_end_date]"
    error_id: ERR_DATE_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /routes/{id}/publish, POST /routes/{id}/republish, POST /on-demand-requests"

  - priority: 112
    category: business_temporal
    check: "period_start_date <= period_end_date and both lie inside the closed range [contract.term_start_date, contract.term_end_date]"
    error_id: ERR_PERIOD_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /service-period-reports"

  - priority: 114
    category: business_temporal
    check: "the new period does not overlap any existing ServicePeriodReport of the same contract; two closed date ranges overlap when new_start <= existing_end and existing_start <= new_end"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /service-period-reports"

  - priority: 116
    category: business_temporal
    check: "at least one Route satisfies the PROMISED eligibility filter of calculations.on_demand_wait_estimate"
    error_id: ERR_NO_ELIGIBLE_ROUTE
    http_status: 422
    applies_to: "POST /on-demand-requests"

  - priority: 118
    category: business_temporal
    check: "the logical clock's current UTC date is inside the closed range [term_end_date minus RENEWAL_WINDOW_DAYS days, term_end_date]; the opening day itself passes"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /renewal-offers"

  - priority: 120
    category: business_temporal
    check: "the explicitly supplied trip's scheduled_departure_min is >= request.requested_pickup_min and its service_date equals request.service_date"
    error_id: ERR_TRIP_DEPARTURE_TOO_EARLY
    http_status: 422
    applies_to: "POST /on-demand-requests/{id}/match with an explicit trip_id"

  - priority: 130
    category: business_referential
    check: "vehicle.branding_contract_id is null or equals trip.contract_id"
    error_id: ERR_VEHICLE_BRANDING_MISMATCH
    http_status: 422
    applies_to: "POST /trips/{id}/assign"

  - priority: 132
    category: business_referential
    check: "when trip_id is supplied, that trip's contract_id equals the body contract_id (for a memo) or the request's contract_id (for a match)"
    error_id: ERR_TRIP_CONTRACT_MISMATCH
    http_status: 422
    applies_to: "POST /credit-memos, POST /on-demand-requests/{id}/match with an explicit trip_id"

  - priority: 140
    category: business_fiscal
    check: "1 <= amount_cents <= contract.penalty_rate_cents_per_missed_trip * MEMO_CAP_MULTIPLIER, with MEMO_CAP_MULTIPLIER = 3"
    error_id: ERR_MEMO_AMOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /credit-memos"

  - priority: 142
    category: business_fiscal
    check: "contract.base_rate_cents_per_service_hour <= counter_rate_cents_per_service_hour <= offer.proposed_rate_cents_per_service_hour"
    error_id: ERR_COUNTER_RATE_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /renewal-offers/{id}/counter"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------- ServiceContract
  - method: POST
    path: "/service-contracts"
    description: "Register a new contract in DRAFT."
    roles: [ContractAdmin]
    code: 201
    input: [client_name, site_type, base_rate_cents_per_service_hour, term_start_date, term_end_date, escalation_index_pct, sla_on_time_threshold_pct, penalty_rate_cents_per_missed_trip, ada_min_accessible_pct, "predecessor_contract_id?"]
    output: ServiceContract
    side_effects: ["status set to DRAFT", "credit_balance_cents, branded_vehicle_count and branded_ada_vehicle_count initialised to 0"]

  - method: GET
    path: "/service-contracts/{id}"
    description: "Read one contract including its derived credit and branded-fleet counters."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/service-contracts"
    description: "List contracts; predecessor_contract_id resolves the self-referential renewal chain forward."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["status?", "predecessor_contract_id?", "site_type?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/service-contracts/{id}/activate"
    description: "DRAFT -> ACTIVE."
    roles: [ContractAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["increments ServiceContract.version by 1"]

  - method: POST
    path: "/service-contracts/{id}/terminate"
    description: "ACTIVE or RENEWAL_PENDING -> TERMINATED with the full route / trip / on-demand cascade."
    roles: [ContractAdmin]
    code: 200
    input: [termination_reason]
    output: ServiceContract
    side_effects: ["routes RETIRED", "their SCHEDULED and ASSIGNED trips CANCELLED", "PENDING and MATCHED on-demand requests EXPIRED", "standing RenewalOffer SUPERSEDED", "increments ServiceContract.version by 1"]

  # ------------------------------------------------------------------ Route
  - method: POST
    path: "/routes"
    description: "Design a route in DRAFT and compute its fleet requirement."
    roles: [OpsPlanner]
    code: 201
    input: [contract_id, name, loop_minutes, headway_minutes, service_window_start_min, service_window_end_min, demand_forecast_pax_per_hour, reference_seat_capacity]
    output: Route
    side_effects: ["computes required_vehicle_count and ada_required_count per calculations.route_fleet_requirement"]

  - method: GET
    path: "/routes/{id}"
    description: "Read one route."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: GET
    path: "/routes"
    description: "List routes, optionally filtered to one contract."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: POST
    path: "/routes/{id}/publish"
    description: "DRAFT -> PUBLISHED and generate the day's trips."
    roles: [OpsPlanner]
    code: 200
    input: [service_date]
    output: Route
    side_effects: ["generates Trip rows per calculations.trip_generation", "sets published_service_date", "recomputes required_vehicle_count and ada_required_count", "increments Route.version by 1"]

  - method: POST
    path: "/routes/{id}/republish"
    description: "Re-cut the day's headway. Cancels the SCHEDULED and ASSIGNED trips of that service date and regenerates them; recovers a DEGRADED route to PUBLISHED. Guarded by OCC on Route.version."
    roles: [OpsPlanner]
    code: 200
    input: [service_date, headway_minutes, expected_route_version]
    output: Route
    side_effects: ["cancels SCHEDULED and ASSIGNED trips of that service date", "reverts their MATCHED on-demand requests to PENDING", "recomputes Vehicle.committed_block_minutes and Driver.assigned_duty_minutes_current_date", "regenerates trips with the new headway", "increments Route.version by 1"]

  # ---------------------------------------------------------------- Vehicle
  - method: POST
    path: "/vehicles"
    description: "Add a vehicle to the fleet, optionally already wrapped in a client's livery."
    roles: [FleetManager]
    code: 201
    input: [fleet_code, seat_capacity, is_ada_accessible, odometer_km, service_interval_km, "branding_contract_id?"]
    output: Vehicle
    side_effects: ["status set to AVAILABLE", "when branding_contract_id is supplied, recomputes that contract's branded_vehicle_count and branded_ada_vehicle_count"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Read one vehicle including its committed block minutes."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles; branding_contract_id resolves a contract's branded fleet."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["branding_contract_id?", "status?", "is_ada_accessible?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/brand"
    description: "Wrap or unwrap a vehicle in a client's livery, subject to the branded-fleet ADA floor."
    roles: [FleetManager]
    code: 200
    input: [branding_contract_id]
    output: Vehicle
    side_effects: ["recomputes branded_vehicle_count and branded_ada_vehicle_count on the affected contracts", "increments Vehicle.version by 1"]

  - method: GET
    path: "/vehicles/{id}/maintenance-orders"
    description: "List every shop order raised against this vehicle, newest first by created_at DESC."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MaintenanceOrder[]
    side_effects: []

  # ----------------------------------------------------------------- Driver
  - method: POST
    path: "/drivers"
    description: "Register a driver with a daily duty cap."
    roles: [OpsPlanner]
    code: 201
    input: [full_name, license_class, ada_certified, max_duty_minutes_per_day]
    output: Driver
    side_effects: ["assigned_duty_minutes_current_date initialised to 0"]

  - method: GET
    path: "/drivers/{id}"
    description: "Read one driver including the duty minutes already committed on the clock's current date."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: Driver
    side_effects: []

  # ------------------------------------------------------------------- Trip
  - method: GET
    path: "/trips/{id}"
    description: "Read one trip with both status axes."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: GET
    path: "/trips"
    description: "List trips ordered by service_date ASC, scheduled_departure_min ASC, created_at ASC."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["route_id?", "contract_id?", "vehicle_id?", "driver_id?", "service_date?", "dispatch_status?", "settlement_status?", "limit?", "offset?"]
    output: Trip[]
    side_effects: []

  - method: GET
    path: "/trips/{id}/ridership-counts"
    description: "List the append-only ridership rows of this trip, ordered by sequence_no ASC."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["source?", "limit?", "offset?"]
    output: RidershipCount[]
    side_effects: []

  - method: POST
    path: "/trips/{id}/assign"
    description: "SCHEDULED -> ASSIGNED. Enforces branding, maintenance windows, ADA certification, the vehicle layover buffer, driver overlap and the driver duty cap."
    roles: [OpsPlanner]
    code: 200
    input: [vehicle_id, driver_id]
    output: Trip
    side_effects: ["recomputes Vehicle.committed_block_minutes", "recomputes Driver.assigned_duty_minutes_current_date", "increments Trip.version by 1"]

  - method: POST
    path: "/trips/{id}/unassign"
    description: "ASSIGNED -> SCHEDULED, the compensating action of assign."
    roles: [OpsPlanner]
    code: 200
    input: []
    output: Trip
    side_effects: ["clears vehicle_id and driver_id", "restores Vehicle.committed_block_minutes to its pre-assign value", "reverts MATCHED on-demand requests to PENDING", "increments Trip.version by 1"]

  - method: POST
    path: "/trips/{id}/start"
    description: "ASSIGNED -> IN_SERVICE, recording the real departure minute."
    roles: [DriverUser]
    code: 200
    input: [actual_departure_min]
    output: Trip
    side_effects: ["stores actual_departure_min, which the on-time test later reads", "increments Trip.version by 1"]

  - method: POST
    path: "/trips/{id}/complete"
    description: "IN_SERVICE -> COMPLETED, recording the real completion minute and the driver's tally."
    roles: [DriverUser]
    code: 200
    input: [actual_completion_min, boarded, alighted, ada_boardings]
    output: Trip
    side_effects: ["appends a RidershipCount row with source DRIVER_TALLY", "recomputes counted_boardings and counted_ada_boardings", "increments Trip.version by 1"]

  - method: POST
    path: "/trips/{id}/mark-missed"
    description: "SCHEDULED or ASSIGNED -> MISSED. The reason chooses the settlement branch."
    roles: [OpsPlanner]
    code: 200
    input: [reason]
    output: Trip
    side_effects: ["OPERATOR_FAULT mints a MISSED_TRIP CreditMemo and moves settlement_status to CREDITED", "CLIENT_REQUEST moves settlement_status to WAIVED with no memo", "WEATHER leaves settlement_status UNBILLED", "MATCHED on-demand requests move to DENIED", "increments Trip.version by 1"]

  # --------------------------------------------------------- RidershipCount
  - method: POST
    path: "/ridership-counts"
    description: "Append a ridership row. APC_SENSOR rows outrank DRIVER_TALLY rows for the trip's counted boardings."
    roles: [OpsPlanner, DriverUser]
    code: 201
    input: [trip_id, boarded, alighted, ada_boardings, source]
    output: RidershipCount
    side_effects: ["assigns the next per-trip sequence_no", "recomputes Trip.counted_boardings and Trip.counted_ada_boardings"]

  # -------------------------------------------------------- OnDemandRequest
  - method: POST
    path: "/on-demand-requests"
    description: "Log a rider's on-demand request and quote the PROMISED wait from the selected route's headway."
    roles: [ClientLiaison]
    code: 201
    input: [contract_id, service_date, requested_pickup_min, party_size, requires_ada]
    output: OnDemandRequest
    side_effects: ["selects the eligible route and freezes promised_headway_minutes and promised_wait_minutes"]

  - method: GET
    path: "/on-demand-requests/{id}"
    description: "Read one on-demand request with both wait figures."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: OnDemandRequest
    side_effects: []

  - method: GET
    path: "/on-demand-requests"
    description: "List on-demand requests; matched_trip_id resolves the requests riding a given trip."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["contract_id?", "matched_trip_id?", "status?", "service_date?", "limit?", "offset?"]
    output: OnDemandRequest[]
    side_effects: []

  - method: POST
    path: "/on-demand-requests/{id}/match"
    description: "PENDING -> MATCHED. Omitting trip_id runs the selector policy of calculations.trip_match_selector; an empty candidate pool yields a DENIED request rather than an error."
    roles: [OpsPlanner]
    code: 200
    input: ["trip_id?"]
    output: OnDemandRequest
    side_effects: ["sets matched_trip_id", "recomputes Trip.matched_party_seats", "increments OnDemandRequest.version by 1"]

  - method: POST
    path: "/on-demand-requests/{id}/serve"
    description: "MATCHED -> SERVED, computing the REALIZED wait and any wait-SLA credit."
    roles: [DriverUser]
    code: 200
    input: [actual_pickup_min]
    output: OnDemandRequest
    side_effects: ["computes actual_wait_minutes and wait_overage_minutes", "mints a WAIT_SLA_BREACH CreditMemo when the overage exceeds the grace", "increments OnDemandRequest.version by 1"]

  # -------------------------------------------------------- MaintenanceOrder
  - method: POST
    path: "/maintenance-orders"
    description: "Take a vehicle into the shop. When service_date equals the logical clock's current UTC date the displacement cascade runs immediately; a future-dated order only blocks assignment inside its window."
    roles: [FleetManager]
    code: 201
    input: [vehicle_id, kind, service_date, window_start_min, window_end_min]
    output: MaintenanceOrder
    side_effects: ["same-day orders move the vehicle to IN_MAINTENANCE", "displaces intersecting ASSIGNED trips back to SCHEDULED and records displaced_trip_count", "reverts their MATCHED on-demand requests to PENDING", "degrades routes that fall below required_vehicle_count"]

  - method: POST
    path: "/maintenance-orders/{id}/close"
    description: "OPEN -> CLOSED, branching on outcome: RETURN_TO_SERVICE puts the vehicle back to AVAILABLE, RETIRE moves it to RETIRED and strips its branding."
    roles: [FleetManager]
    code: 200
    input: [outcome]
    output: MaintenanceOrder
    side_effects: ["drives the Vehicle transition selected by outcome", "increments MaintenanceOrder.version by 1"]

  # ----------------------------------------------------- ServicePeriodReport
  - method: POST
    path: "/service-period-reports"
    description: "Open a DRAFT reporting period for a contract."
    roles: [ClientLiaison, ContractAdmin]
    code: 201
    input: [contract_id, period_start_date, period_end_date]
    output: ServicePeriodReport
    side_effects: ["status set to DRAFT and settlement_variant set to NONE with every settlement figure at 0"]

  - method: GET
    path: "/service-period-reports/{id}"
    description: "Read one report with the settlement figures of its current variant."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: ServicePeriodReport
    side_effects: []

  - method: GET
    path: "/service-period-reports"
    description: "List reports, optionally filtered to one contract."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: ServicePeriodReport[]
    side_effects: []

  - method: POST
    path: "/service-period-reports/{id}/submit"
    description: "DRAFT or DISPUTED -> SUBMITTED, computing the PROVISIONAL settlement."
    roles: [ClientLiaison, ContractAdmin]
    code: 200
    input: []
    output: ServicePeriodReport
    side_effects: ["freezes effective_rate_cents_per_service_hour", "computes the PROVISIONAL settlement", "stores submitted_by_user_id", "increments revision_round when arriving from DISPUTED", "increments ServicePeriodReport.version by 1"]

  - method: POST
    path: "/service-period-reports/{id}/approve"
    description: "SUBMITTED -> APPROVED, recomputing the FINAL settlement and applying the period's credit memos. The approver's X-User-ID may not equal the submitter's."
    roles: [ContractAdmin]
    code: 200
    input: []
    output: ServicePeriodReport
    side_effects: ["computes the FINAL settlement", "flips the period's ISSUED memos to APPLIED and recomputes ServiceContract.credit_balance_cents", "flips COMPLETED trips to BILLED", "increments ServicePeriodReport.version by 1"]

  - method: POST
    path: "/service-period-reports/{id}/dispute"
    description: "SUBMITTED -> DISPUTED, zeroing the stored settlement so the next submit must recompute it."
    roles: [ClientLiaison]
    code: 200
    input: [dispute_reason]
    output: ServicePeriodReport
    side_effects: ["stores dispute_reason", "resets settlement_variant to NONE and zeroes every settlement figure", "increments ServicePeriodReport.version by 1"]

  # ------------------------------------------------------------- CreditMemo
  - method: POST
    path: "/credit-memos"
    description: "Raise a credit against a contract, optionally tied to a trip."
    roles: [ClientLiaison]
    code: 201
    input: [contract_id, amount_cents, reason, "trip_id?"]
    output: CreditMemo
    side_effects: ["status set to ISSUED", "recomputes ServiceContract.credit_balance_cents", "increments ServiceContract.version by 1"]

  - method: GET
    path: "/credit-memos/{id}"
    description: "Read one credit memo."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: CreditMemo
    side_effects: []

  - method: GET
    path: "/credit-memos"
    description: "List credit memos; trip_id and applied_report_id resolve the memos raised for a trip and consumed by a report."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["contract_id?", "trip_id?", "applied_report_id?", "status?", "reason?", "limit?", "offset?"]
    output: CreditMemo[]
    side_effects: []

  - method: POST
    path: "/credit-memos/{id}/void"
    description: "ISSUED -> VOIDED, the compensating action of every credit-issuing cascade."
    roles: [ContractAdmin]
    code: 200
    input: [voided_reason]
    output: CreditMemo
    side_effects: ["recomputes ServiceContract.credit_balance_cents back to its pre-issue value", "returns a MISSED_TRIP memo's trip from settlement_status CREDITED to UNBILLED", "increments ServiceContract.version by 1"]

  # ------------------------------------------------------------ RenewalOffer
  - method: POST
    path: "/renewal-offers"
    description: "Open a renewal round. Guarded by OCC on ServiceContract.version because a second create legitimately supersedes the standing offer."
    roles: [ContractAdmin]
    code: 201
    input: [contract_id, proposed_term_months, expected_contract_version]
    output: RenewalOffer
    side_effects: ["computes proposed_rate_cents_per_service_hour per calculations.renewal_proposed_rate", "supersedes any standing OPEN or COUNTERED offer", "moves the contract to RENEWAL_PENDING", "increments ServiceContract.version by 1"]

  - method: GET
    path: "/renewal-offers/{id}"
    description: "Read one renewal offer including its escalation breakdown."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []

  - method: GET
    path: "/renewal-offers"
    description: "List renewal offers; basis_report_id and successor_contract_id resolve the report an offer was keyed on and the contract an accepted offer minted."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: ["contract_id?", "basis_report_id?", "successor_contract_id?", "status?", "limit?", "offset?"]
    output: RenewalOffer[]
    side_effects: []

  - method: POST
    path: "/renewal-offers/{id}/counter"
    description: "OPEN -> COUNTERED with the client's counter rate."
    roles: [ClientLiaison]
    code: 200
    input: [counter_rate_cents_per_service_hour]
    output: RenewalOffer
    side_effects: ["stores counter_rate_cents_per_service_hour", "increments RenewalOffer.version by 1"]

  - method: POST
    path: "/renewal-offers/{id}/respond"
    description: "COUNTERED -> OPEN (REOPEN, another negotiation lap), ACCEPTED (mints the successor contract) or DECLINED (contract returns to ACTIVE)."
    roles: [ContractAdmin]
    code: 200
    input: [decision]
    output: RenewalOffer
    side_effects: ["REOPEN increments round_index and clears the counter rate", "ACCEPT mints the successor ServiceContract and writes successor_contract_id", "DECLINE returns the contract to ACTIVE", "increments RenewalOffer.version by 1"]

  # ------------------------------------------------------------ logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ContractAdmin, ClientLiaison, OpsPlanner, FleetManager, DriverUser]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, current_service_date: string }"
    side_effects: ["recomputes Driver.assigned_duty_minutes_current_date for every driver against the new current UTC date"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, empty, or naming a role outside the five declared in §1.7" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the caller's role is not listed in the endpoint's roles" }
  - { id: ERR_DRIVER_NOT_ASSIGNED, http: 403, condition: "a DriverUser acts on a trip whose driver_id is not the caller's X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the approving X-User-ID equals report.submitted_by_user_id" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required body field is missing, a type is wrong, an enum value is not a declared member, or a numeric value falls outside its declared range" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or offset below 0" }

  # --- existence ---
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "no ServiceContract with the given id" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "no Route with the given id" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "no Vehicle with the given id" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "no Driver with the given id" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "no Trip with the given id" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "no OnDemandRequest with the given id" }
  - { id: ERR_MAINTENANCE_ORDER_NOT_FOUND, http: 404, condition: "no MaintenanceOrder with the given id" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "no ServicePeriodReport with the given id" }
  - { id: ERR_MEMO_NOT_FOUND, http: 404, condition: "no CreditMemo with the given id" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "no RenewalOffer with the given id" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not equal the contract's current version on POST /renewal-offers" }
  - { id: ERR_STALE_ROUTE_VERSION, http: 412, condition: "expected_route_version does not equal the route's current version on POST /routes/{id}/republish" }

  # --- state preconditions ---
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "activate called on a contract whose status is not DRAFT" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "an operation requiring contract.status IN {ACTIVE, RENEWAL_PENDING} is attempted on a DRAFT, RENEWED or TERMINATED contract" }
  - { id: ERR_ROUTE_NOT_DRAFT, http: 409, condition: "publish called on a route whose status is not DRAFT" }
  - { id: ERR_ROUTE_NOT_PUBLISHED, http: 409, condition: "republish called on a route outside {PUBLISHED, DEGRADED}, or a match resolves a trip whose route is not PUBLISHED" }
  - { id: ERR_TRIP_NOT_SCHEDULABLE, http: 409, condition: "assign called on a trip whose dispatch_status is not SCHEDULED, or mark-missed on a trip outside {SCHEDULED, ASSIGNED}" }
  - { id: ERR_TRIP_NOT_ASSIGNED, http: 409, condition: "unassign or start called on a trip whose dispatch_status is not ASSIGNED" }
  - { id: ERR_TRIP_NOT_IN_SERVICE, http: 409, condition: "complete called on a trip that is not IN_SERVICE, or serve called while the matched trip is neither IN_SERVICE nor COMPLETED" }
  - { id: ERR_REQUEST_NOT_PENDING, http: 409, condition: "match called on an OnDemandRequest whose status is not PENDING" }
  - { id: ERR_REQUEST_NOT_MATCHED, http: 409, condition: "serve called on an OnDemandRequest whose status is not MATCHED" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "submit called on a report outside {DRAFT, DISPUTED}" }
  - { id: ERR_REPORT_NOT_SUBMITTED, http: 409, condition: "approve or dispute called on a report whose status is not SUBMITTED" }
  - { id: ERR_MEMO_NOT_ISSUED, http: 409, condition: "void called on a CreditMemo whose status is not ISSUED" }
  - { id: ERR_OFFER_NOT_OPEN, http: 409, condition: "counter called on a RenewalOffer whose status is not OPEN" }
  - { id: ERR_OFFER_NOT_COUNTERED, http: 409, condition: "respond called on a RenewalOffer whose status is not COUNTERED" }
  - { id: ERR_MAINTENANCE_ORDER_NOT_OPEN, http: 409, condition: "close called on a MaintenanceOrder whose status is not OPEN" }
  - { id: ERR_VEHICLE_UNAVAILABLE, http: 409, condition: "assign names a vehicle whose status is IN_MAINTENANCE or RETIRED" }

  # --- safety / compliance ---
  - { id: ERR_VEHICLE_IN_MAINTENANCE_WINDOW, http: 422, condition: "an OPEN MaintenanceOrder for the vehicle on the trip's service_date has a closed window intersecting the trip's closed interval" }
  - { id: ERR_DRIVER_NOT_ADA_CERTIFIED, http: 422, condition: "an ADA-accessible vehicle is assigned to a driver whose ada_certified is false" }
  - { id: ERR_ADA_VEHICLE_REQUIRED, http: 422, condition: "a request with requires_ada true is matched to a trip with no vehicle or a non-ADA vehicle" }
  - { id: ERR_ADA_FLEET_SHORTFALL, http: 422, condition: "branding would push the contract's branded ADA share below ada_min_accessible_pct" }

  # --- scheduling constraints ---
  - { id: ERR_FLEET_CODE_DUPLICATE, http: 409, condition: "fleet_code already exists on another Vehicle" }
  - { id: ERR_VEHICLE_BLOCK_CONFLICT, http: 409, condition: "the candidate trip's buffered block intersects another trip already assigned to the same vehicle on that service_date" }
  - { id: ERR_DRIVER_BLOCK_CONFLICT, http: 409, condition: "the candidate trip's unbuffered interval intersects another trip already assigned to the same driver on that service_date" }
  - { id: ERR_DRIVER_DUTY_EXCEEDED, http: 422, condition: "the candidate assignment would push the driver's duty minutes for that service_date above max_duty_minutes_per_day" }
  - { id: ERR_TRIP_SEATS_EXHAUSTED, http: 409, condition: "the explicitly named trip has fewer remaining seats than the request's party_size" }

  # --- temporal ---
  - { id: ERR_DATE_OUT_OF_TERM, http: 422, condition: "a service_date falls outside the contract's term" }
  - { id: ERR_PERIOD_OUT_OF_TERM, http: 422, condition: "period_start_date is after period_end_date, or either endpoint falls outside the contract's term" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "the new reporting period overlaps an existing report of the same contract" }
  - { id: ERR_NO_ELIGIBLE_ROUTE, http: 422, condition: "no PUBLISHED route of the contract published for that service_date covers the requested pickup minute" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "the logical clock sits outside the 60-day renewal window that closes on term_end_date" }
  - { id: ERR_TRIP_DEPARTURE_TOO_EARLY, http: 422, condition: "the explicitly named trip departs before the requested pickup minute or runs on a different service_date" }

  # --- referential / fiscal ---
  - { id: ERR_VEHICLE_BRANDING_MISMATCH, http: 422, condition: "a vehicle branded for one contract is assigned to a trip of another contract" }
  - { id: ERR_TRIP_CONTRACT_MISMATCH, http: 422, condition: "the named trip belongs to a different contract than the memo or the on-demand request" }
  - { id: ERR_MEMO_AMOUNT_EXCEEDS_CAP, http: 422, condition: "amount_cents is below 1 or above three times the contract's penalty_rate_cents_per_missed_trip" }
  - { id: ERR_COUNTER_RATE_OUT_OF_BOUNDS, http: 422, condition: "the counter rate is below the contract's base rate or above the offer's proposed rate" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractAdmin
    description: "Owns the commercial relationship: contract lifecycle, report approval, renewal negotiation from the operator side, and credit reversal."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-contracts"
      - "POST /service-contracts/{id}/activate"
      - "POST /service-contracts/{id}/terminate"
      - "POST /service-period-reports/{id}/approve"
      - "POST /credit-memos/{id}/void"
      - "POST /renewal-offers"
      - "POST /renewal-offers/{id}/respond"
    shared_operations:
      - "POST /service-period-reports (with ClientLiaison)"
      - "POST /service-period-reports/{id}/submit (with ClientLiaison)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: a ContractAdmin who submits a report may not approve that same report, because approve compares X-User-ID against submitted_by_user_id."

  - name: ClientLiaison
    description: "Speaks for the client site: raises on-demand requests, opens and submits reporting periods, disputes settlements, raises credits and counters renewal offers."
    identity: "opaque"
    exclusive_operations:
      - "POST /on-demand-requests"
      - "POST /service-period-reports/{id}/dispute"
      - "POST /credit-memos"
      - "POST /renewal-offers/{id}/counter"
    shared_operations:
      - "POST /service-period-reports (with ContractAdmin)"
      - "POST /service-period-reports/{id}/submit (with ContractAdmin)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: OpsPlanner
    description: "Designs routes and headways, publishes the day's schedule, binds vehicles and drivers to trips, matches on-demand requests and declares missed trips."
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/publish"
      - "POST /routes/{id}/republish"
      - "POST /drivers"
      - "POST /trips/{id}/assign"
      - "POST /trips/{id}/unassign"
      - "POST /trips/{id}/mark-missed"
      - "POST /on-demand-requests/{id}/match"
    shared_operations:
      - "POST /ridership-counts (with DriverUser)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: FleetManager
    description: "Owns the physical fleet: vehicle registration, client livery, and shop orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles"
      - "POST /vehicles/{id}/brand"
      - "POST /maintenance-orders"
      - "POST /maintenance-orders/{id}/close"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: DriverUser
    description: "A person behind the wheel. X-User-ID is the id of a Driver row, and every driving action is checked against the trip's driver_id."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /trips/{id}/start"
      - "POST /trips/{id}/complete"
      - "POST /on-demand-requests/{id}/serve"
    shared_operations:
      - "POST /ridership-counts (with OpsPlanner)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
