scenario: |
  253. Marriage License & Vital Records: application/eligibility (age/waiting period),
  license issuance & expiration, officiant return filing, certified-copy request,
  amendment/correction, fee & fee waiver, confidential-record access, apostille.

  A county Vital Records office issues marriage licenses and maintains the registered
  marriage record. Two applicants file a MarriageApplication; the clerk screens
  eligibility (minimum age, judicial consent for minors, waiting period, prior-marriage
  dissolution). An approved application becomes a MarriageLicense with a statutory
  waiting period before it is valid and a hard expiration. After the ceremony the
  Officiant files an OfficiantReturn within a statutory deadline; an accepted return
  registers a MarriageRecord. Anyone may request a CertifiedCopy of a public record,
  but confidential (private) records require an authorized requester. Records may be
  amended/corrected; certified copies may be apostilled for foreign use. Fees are
  charged per action and may be waived on an approved indigency FeeWaiver. Every
  monetary movement is captured in an append-only FeeLedger and the office's collected
  balance must always reconcile against charges minus refunds minus waived amounts.

domain_name: marriage-license-vital-records
api_prefix: ""   # flat multi-collection topology rooted at "/" — peer collections
                 # (/applicants, /officiants, /applications, /licenses, /returns,
                 # /records, /certified-copies, /amendments, /apostilles, /fee-waivers)
                 # are not nested under a single resource prefix.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: flat
  # Peer top-level entities (Applicant, Officiant, MarriageApplication, MarriageLicense,
  # OfficiantReturn, MarriageRecord, CertifiedCopyRequest, AmendmentRequest,
  # ApostilleRequest, FeeWaiver, FeeLedgerEntry) linked by foreign keys, not URL nesting.

  state_machine_shape: branching
  # MarriageApplication forks DRAFT -> {APPROVED, DENIED}; AmendmentRequest is a
  # cyclic review loop (SUBMITTED <-> RETURNED_FOR_INFO); CertifiedCopyRequest and
  # FeeWaiver carry branching approve/deny shapes with divergent side-effect sets.

  relationship_patterns:
    - one_to_many   # MarriageApplication has two applicant links; MarriageRecord has many CertifiedCopyRequests
    - cross_aggregate  # OfficiantReturn references both MarriageLicense and Officiant; ApostilleRequest references CertifiedCopyRequest

  role_model: segregation_of_duties
  # The clerk who APPROVES an application cannot be the registrar who ACCEPTS its
  # officiant return; the staff who ADJUDICATES a fee waiver cannot APPROVE the
  # certified-copy request that consumes it. Plus entity-backed Applicant/Officiant.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal full name of the applicant" }
      - { name: date_of_birth, type: datetime, source: input, description: "Birth date (ISO 8601 date); drives age computation", constraints: "must be a past date relative to system clock" }
      - { name: prior_marriage_status, type: enum, source: input, description: "NEVER_MARRIED | DIVORCED | WIDOWED | MARRIED", default: NEVER_MARRIED, constraints: "MARRIED is ineligible to apply" }
      - { name: prior_dissolution_date, type: datetime, source: input, description: "Date a prior marriage was dissolved (divorce final / spouse death); required when prior_marriage_status is DIVORCED or WIDOWED", default: null }
      - { name: has_judicial_consent, type: boolean, source: input, description: "Whether a court order authorizes marriage for a minor applicant", default: false }

  - name: Officiant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Officiant legal name" }
      - { name: credential_type, type: enum, source: input, description: "CLERGY | JUDGE | NOTARY | DEPUTY_COMMISSIONER" }
      - { name: registration_expires_on, type: datetime, source: input, description: "Date the officiant's authority to solemnize expires (ISO 8601 date)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | SUSPENDED — gates ability to file returns", default: REGISTERED, constraints: "REGISTERED | SUSPENDED" }
      - { name: returns_filed_count, type: integer, source: computed, description: "Count of OfficiantReturn rows in ACCEPTED state attributed to this officiant", default: 0 }

  - name: MarriageApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_a_id, type: string, source: input, description: "FK -> Applicant.id; the first party to the marriage" }
      - { name: applicant_b_id, type: string, source: input, description: "FK -> Applicant.id; the second party to the marriage" }
      - { name: ceremony_county, type: string, source: input, description: "County where the ceremony will occur" }
      - { name: is_confidential, type: boolean, source: input, description: "Whether the resulting license and record are confidential (private)", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | DENIED | EXPIRED", default: DRAFT, constraints: "DRAFT | UNDER_REVIEW | APPROVED | DENIED | EXPIRED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the Clerk who approved this application; recorded for segregation-of-duties checks", default: null }
      - { name: denial_reason_code, type: string, source: system, description: "Error code captured when the application was DENIED", default: null }
      - { name: total_charged_cents, type: integer, source: computed, description: "Sum of FeeLedgerEntry.amount_cents for kind=CHARGE attributed to this application chain", default: 0 }

  - name: MarriageLicense
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> MarriageApplication.id; the approved application that produced this license" }
      - { name: is_confidential, type: boolean, source: system, description: "Copied from the application at issuance; confidential licenses gate downstream access" }
      - { name: issued_at, type: datetime, source: system, description: "Server timestamp the license was issued (= application approval time)" }
      - { name: valid_from, type: datetime, source: computed, description: "issued_at + WAITING_PERIOD_HOURS; ceremony before this instant is invalid" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + VALIDITY_WINDOW_DAYS (date arithmetic); license cannot be used after this instant" }
      - { name: status, type: enum, source: system, description: "ISSUED | USED | EXPIRED | VOID", default: ISSUED, constraints: "ISSUED | USED | EXPIRED | VOID" }

  - name: OfficiantReturn
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> MarriageLicense.id; the license the ceremony was performed under" }
      - { name: officiant_id, type: string, source: input, description: "FK -> Officiant.id; the officiant who solemnized" }
      - { name: ceremony_date, type: datetime, source: input, description: "Instant the ceremony occurred (ISO 8601 datetime)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED", default: SUBMITTED, constraints: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID of the Registrar who accepted this return", default: null }
      - { name: filing_deadline, type: datetime, source: computed, description: "ceremony_date + RETURN_FILING_DAYS; a return submitted after this is late but may still be accepted with a late surcharge" }
      - { name: rejection_reason_code, type: string, source: system, description: "Error code captured when the return was REJECTED", default: null }

  - name: MarriageRecord
    parent: null
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> OfficiantReturn.id; the accepted return that registered this record" }
      - { name: license_id, type: string, source: system, description: "FK -> MarriageLicense.id; the underlying license" }
      - { name: is_confidential, type: boolean, source: system, description: "Copied from the license; confidential records require an authorized requester for copies" }
      - { name: registered_at, type: datetime, source: system, description: "Server timestamp the record was registered (= return acceptance time)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | AMENDED | SEALED", default: REGISTERED, constraints: "REGISTERED | AMENDED | SEALED" }
      - { name: amendment_count, type: integer, source: computed, description: "Count of AmendmentRequest rows in APPLIED state for this record", default: 0 }
      - { name: certified_copies_issued, type: integer, source: computed, description: "Count of CertifiedCopyRequest rows in ISSUED state for this record", default: 0 }

  - name: CertifiedCopyRequest
    parent: null
    common_fields: true
    fields:
      - { name: record_id, type: string, source: input, description: "FK -> MarriageRecord.id; the record to copy" }
      - { name: requester_kind, type: enum, source: input, description: "PARTY | GOVERNMENT | PUBLIC — PARTY is an applicant on the record, GOVERNMENT an agency, PUBLIC any member", constraints: "confidential records require requester_kind IN {PARTY, GOVERNMENT}" }
      - { name: copies_requested, type: integer, source: input, description: "Number of certified copies requested", constraints: "must be >= 1" }
      - { name: fee_waiver_id, type: string, source: input, description: "FK -> FeeWaiver.id; optional approved waiver applied to this request", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | DENIED | REFUNDED", default: PENDING, constraints: "PENDING | ISSUED | DENIED | REFUNDED" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the Clerk who issued this copy request", default: null }
      - { name: fee_cents, type: integer, source: computed, description: "Net fee charged for this request after per-copy tiering and waiver", default: 0 }

  - name: AmendmentRequest
    parent: null
    common_fields: true
    fields:
      - { name: record_id, type: string, source: input, description: "FK -> MarriageRecord.id; the record to amend" }
      - { name: amendment_type, type: enum, source: input, description: "CLERICAL | SUBSTANTIVE — CLERICAL is a typo fix; SUBSTANTIVE changes legal facts and needs registrar sign-off" }
      - { name: field_path, type: string, source: input, description: "Dot path of the record field being corrected" }
      - { name: new_value, type: string, source: input, description: "Proposed corrected value" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | RETURNED_FOR_INFO | APPLIED | REJECTED", default: SUBMITTED, constraints: "SUBMITTED | RETURNED_FOR_INFO | APPLIED | REJECTED" }
      - { name: resubmit_count, type: integer, source: computed, description: "Number of times this amendment cycled back from RETURNED_FOR_INFO to SUBMITTED", default: 0 }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the Registrar who applied or rejected this amendment", default: null }

  - name: ApostilleRequest
    parent: null
    common_fields: true
    fields:
      - { name: copy_request_id, type: string, source: input, description: "FK -> CertifiedCopyRequest.id; the issued certified copy to authenticate" }
      - { name: destination_country, type: string, source: input, description: "ISO country name for which the apostille is requested" }
      - { name: status, type: enum, source: system, description: "REQUESTED | AUTHENTICATED | REJECTED", default: REQUESTED, constraints: "REQUESTED | AUTHENTICATED | REJECTED" }
      - { name: fee_cents, type: integer, source: computed, description: "Apostille authentication fee charged", default: 0 }

  - name: FeeWaiver
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the indigent party requesting the waiver" }
      - { name: declared_monthly_income_cents, type: integer, source: input, description: "Self-declared monthly income in cents; compared against the poverty threshold", constraints: "must be >= 0" }
      - { name: household_size, type: integer, source: input, description: "Number of people in the household; scales the income threshold", constraints: "must be >= 1" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | DENIED | CONSUMED", default: REQUESTED, constraints: "REQUESTED | GRANTED | DENIED | CONSUMED" }
      - { name: max_waivable_cents, type: integer, source: computed, description: "Cap of fee dollars this waiver may absorb when GRANTED", default: 0 }
      - { name: consumed_cents, type: integer, source: computed, description: "Amount of fees this waiver has already absorbed", default: 0 }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the staff who granted/denied this waiver", default: null }

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> MarriageApplication.id; the application chain this monetary movement belongs to", default: null }
      - { name: kind, type: enum, source: system, description: "CHARGE | REFUND | WAIVE — CHARGE adds to collected, REFUND subtracts, WAIVE records waived (non-collected) amount", constraints: "CHARGE | REFUND | WAIVE" }
      - { name: amount_cents, type: integer, source: system, description: "Positive magnitude of the movement in cents" }
      - { name: source_entity, type: string, source: system, description: "Entity type that triggered the movement (LICENSE | CERTIFIED_COPY | AMENDMENT | APOSTILLE | RETURN)" }
      - { name: source_entity_id, type: string, source: system, description: "Id of the triggering entity" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MarriageApplication
    initial_state: DRAFT
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Both applicant_a_id and applicant_b_id resolve to existing Applicants"
          - "applicant_a_id != applicant_b_id (ERR_DUPLICATE_APPLICANT)"
          - "Neither applicant has prior_marriage_status == MARRIED (ERR_APPLICANT_ALREADY_MARRIED)"
        side_effects:
          - "status -> UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/decide with decision=APPROVE"
        actor: Clerk
        preconditions:
          - "Each applicant's age in whole years at system clock >= MIN_AGE_NO_CONSENT, OR (age >= MIN_AGE_WITH_CONSENT AND has_judicial_consent == true) (ERR_AGE_INELIGIBLE / ERR_JUDICIAL_CONSENT_REQUIRED)"
          - "For each applicant with prior_marriage_status IN {DIVORCED, WIDOWED}: clock >= prior_dissolution_date + REMARRIAGE_WAIT_DAYS (ERR_REMARRIAGE_WAIT_NOT_MET)"
          - "Neither applicant already holds an ISSUED license whose [valid_from, expires_at) window overlaps the prospective new window (ERR_APPLICANT_LICENSE_OVERLAP) — see applicant_license_window_overlap"
        side_effects:
          - "status -> APPROVED; approved_by_user_id = acting Clerk X-User-ID"
          - "create MarriageLicense (status ISSUED, issued_at = now, valid_from = run waiting_period_window, expires_at = run validity_window)"
          - "append FeeLedgerEntry kind=CHARGE amount_cents=run license_fee_calc source_entity=LICENSE for the new license"
          - "recompute MarriageApplication.total_charged_cents"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/decide with decision=DENY"
        actor: Clerk
        preconditions:
          - "At least one eligibility precondition for APPROVE fails, OR decision=DENY explicitly supplied"
        side_effects:
          - "status -> DENIED; denial_reason_code = supplied/derived reason; approved_by_user_id stays null"
        note: "No license is created; no charge is appended."

      - from: APPROVED
        to: EXPIRED
        trigger: "system sweep at POST /_clock/advance, or POST /licenses/{id}/expire-check"
        actor: system
        preconditions:
          - "The application's MarriageLicense.status == ISSUED AND clock > MarriageLicense.expires_at AND no ACCEPTED OfficiantReturn exists for the license"
        side_effects:
          - "MarriageLicense.status -> EXPIRED (bubble from license expiry, see MarriageLicense machine)"
          - "MarriageApplication.status -> EXPIRED"

  - entity: MarriageLicense
    initial_state: ISSUED
    terminal_states: [USED, EXPIRED, VOID]
    transitions:
      - from: ISSUED
        to: USED
        trigger: "POST /returns/{id}/accept (Registrar accepts the officiant return)"
        actor: Registrar
        preconditions:
          - "An OfficiantReturn references this license and is transitioning SUBMITTED -> ACCEPTED"
        side_effects:
          - "status -> USED"
          - "create MarriageRecord (status REGISTERED, registered_at = now, copies is_confidential from license)"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /licenses/{id}/expire-check or POST /_clock/advance sweep"
        actor: system
        preconditions:
          - "clock > expires_at (ERR_LICENSE_NOT_EXPIRED if not past expiry)"
          - "No ACCEPTED OfficiantReturn references this license"
        side_effects:
          - "status -> EXPIRED"
          - "owning MarriageApplication.status -> EXPIRED (bubble up)"
          - "any OfficiantReturn in SUBMITTED for this license is left untouched (still individually rejectable)"

      - from: ISSUED
        to: VOID
        trigger: "POST /licenses/{id}/void"
        actor: Registrar
        preconditions:
          - "No ACCEPTED OfficiantReturn references this license (ERR_LICENSE_ALREADY_USED)"
        side_effects:
          - "status -> VOID"
          - "append FeeLedgerEntry kind=REFUND amount_cents=(license CHARGE amount) source_entity=LICENSE"
          - "recompute MarriageApplication.total_charged_cents"

  - entity: OfficiantReturn
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /returns/{id}/accept"
        actor: Registrar
        preconditions:
          - "Referenced MarriageLicense.status == ISSUED (ERR_LICENSE_NOT_USABLE)"
          - "ceremony_date >= license.valid_from (ERR_CEREMONY_BEFORE_VALID)"
          - "ceremony_date <= license.expires_at (ERR_CEREMONY_AFTER_EXPIRY)"
          - "Referenced Officiant.status == REGISTERED AND ceremony_date <= officiant.registration_expires_on (ERR_OFFICIANT_NOT_AUTHORIZED)"
          - "No other ACCEPTED return for this officiant has ceremony_date within OFFICIANT_BUFFER_MINUTES (ERR_OFFICIANT_DOUBLE_BOOKED) — see officiant_ceremony_overlap"
          - "acting Registrar X-User-ID != owning application.approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> ACCEPTED; accepted_by_user_id = acting Registrar"
          - "MarriageLicense ISSUED -> USED (cross-entity)"
          - "MarriageLicense.USED creates MarriageRecord REGISTERED (transitive cascade)"
          - "Officiant.returns_filed_count recomputed (+1)"
          - "if submitted after filing_deadline: append FeeLedgerEntry kind=CHARGE amount_cents=LATE_RETURN_SURCHARGE_CENTS source_entity=RETURN; recompute application.total_charged_cents"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: Registrar
        preconditions:
          - "Return is in SUBMITTED"
        side_effects:
          - "status -> REJECTED; rejection_reason_code recorded"
          - "License is left in ISSUED (a corrected return may be filed later while license still valid)"

  - entity: MarriageRecord
    initial_state: REGISTERED
    terminal_states: [SEALED]
    transitions:
      - from: REGISTERED
        to: AMENDED
        trigger: "POST /amendments/{id}/decide with decision=APPLY (auto on first APPLIED amendment)"
        actor: Registrar
        preconditions:
          - "At least one AmendmentRequest for this record transitions to APPLIED"
        side_effects:
          - "status -> AMENDED"
          - "amendment_count recomputed"

      - from: AMENDED
        to: AMENDED
        trigger: "POST /amendments/{id}/decide with decision=APPLY (subsequent amendments)"
        actor: Registrar
        preconditions:
          - "Another AmendmentRequest reaches APPLIED"
        side_effects:
          - "amendment_count recomputed"

      - from: REGISTERED
        to: SEALED
        trigger: "POST /records/{id}/seal"
        actor: Registrar
        preconditions:
          - "No CertifiedCopyRequest for this record is in PENDING (ERR_RECORD_HAS_PENDING_COPIES)"
        side_effects:
          - "status -> SEALED; is_confidential forced true"
          - "all CertifiedCopyRequest in PENDING -> remain (blocked by precondition above)"

      - from: AMENDED
        to: SEALED
        trigger: "POST /records/{id}/seal"
        actor: Registrar
        preconditions:
          - "No CertifiedCopyRequest for this record is in PENDING (ERR_RECORD_HAS_PENDING_COPIES)"
        side_effects:
          - "status -> SEALED; is_confidential forced true"

  - entity: CertifiedCopyRequest
    initial_state: PENDING
    terminal_states: [DENIED, REFUNDED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /certified-copies/{id}/decide with decision=ISSUE"
        actor: Clerk
        preconditions:
          - "Record.status != SEALED OR requester_kind == GOVERNMENT (ERR_RECORD_SEALED)"
          - "If record.is_confidential: requester_kind IN {PARTY, GOVERNMENT} (ERR_CONFIDENTIAL_ACCESS_DENIED)"
          - "If fee_waiver_id present: that FeeWaiver.status == GRANTED and its applicant_id is a party of the record (ERR_WAIVER_NOT_GRANTED)"
          - "acting Clerk X-User-ID != waiver.adjudicated_by_user_id when a waiver is applied (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> ISSUED; issued_by_user_id = acting Clerk"
          - "compute fee_cents via certified_copy_fee_calc (tiered per copy, minus waiver absorption)"
          - "append FeeLedgerEntry kind=CHARGE amount_cents=fee_cents source_entity=CERTIFIED_COPY"
          - "if a waiver absorbed any amount: append FeeLedgerEntry kind=WAIVE amount_cents=absorbed; FeeWaiver.consumed_cents += absorbed; if consumed >= max_waivable_cents -> FeeWaiver.status=CONSUMED"
          - "MarriageRecord.certified_copies_issued recomputed"

      - from: PENDING
        to: DENIED
        trigger: "POST /certified-copies/{id}/decide with decision=DENY"
        actor: Clerk
        preconditions:
          - "Request is in PENDING"
        side_effects:
          - "status -> DENIED; no charge appended"

      - from: ISSUED
        to: REFUNDED
        trigger: "POST /certified-copies/{id}/refund"
        actor: Clerk
        preconditions:
          - "Request is in ISSUED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "status -> REFUNDED"
          - "append FeeLedgerEntry kind=REFUND amount_cents=fee_cents source_entity=CERTIFIED_COPY"
          - "if this request consumed a waiver: append FeeLedgerEntry kind=WAIVE amount_cents=-(absorbed) to reverse; FeeWaiver.consumed_cents -= absorbed; if waiver was CONSUMED restore to GRANTED"
          - "MarriageRecord.certified_copies_issued recomputed (-1)"

  - entity: AmendmentRequest
    initial_state: SUBMITTED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /amendments/{id}/decide with decision=RETURN"
        actor: Registrar
        preconditions:
          - "Request is in SUBMITTED"
        side_effects:
          - "status -> RETURNED_FOR_INFO"

      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /amendments/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "Request is in RETURNED_FOR_INFO"
          - "resubmit_count < MAX_AMENDMENT_RESUBMITS (ERR_RESUBMIT_LIMIT_REACHED)"
        side_effects:
          - "status -> SUBMITTED; resubmit_count += 1"

      - from: SUBMITTED
        to: APPLIED
        trigger: "POST /amendments/{id}/decide with decision=APPLY"
        actor: Registrar
        preconditions:
          - "Record.status != SEALED (ERR_RECORD_SEALED)"
          - "If amendment_type == SUBSTANTIVE: acting Registrar X-User-ID != record's owning application approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> APPLIED; adjudicated_by_user_id = acting Registrar"
          - "append FeeLedgerEntry kind=CHARGE amount_cents=run amendment_fee_calc source_entity=AMENDMENT"
          - "MarriageRecord -> AMENDED (cross-entity); amendment_count recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /amendments/{id}/decide with decision=REJECT"
        actor: Registrar
        preconditions:
          - "Request is in SUBMITTED"
        side_effects:
          - "status -> REJECTED; adjudicated_by_user_id recorded; no charge"

  - entity: ApostilleRequest
    initial_state: REQUESTED
    terminal_states: [AUTHENTICATED, REJECTED]
    transitions:
      - from: REQUESTED
        to: AUTHENTICATED
        trigger: "POST /apostilles/{id}/decide with decision=AUTHENTICATE"
        actor: Registrar
        preconditions:
          - "Referenced CertifiedCopyRequest.status == ISSUED (ERR_COPY_NOT_ISSUED)"
          - "The CertifiedCopyRequest's record is not SEALED (ERR_RECORD_SEALED)"
        side_effects:
          - "status -> AUTHENTICATED"
          - "compute fee_cents = APOSTILLE_FEE_CENTS"
          - "append FeeLedgerEntry kind=CHARGE amount_cents=APOSTILLE_FEE_CENTS source_entity=APOSTILLE"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /apostilles/{id}/decide with decision=REJECT"
        actor: Registrar
        preconditions:
          - "Request is in REQUESTED"
        side_effects:
          - "status -> REJECTED; no charge"

  - entity: FeeWaiver
    initial_state: REQUESTED
    terminal_states: [DENIED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /fee-waivers/{id}/decide with decision=GRANT"
        actor: WaiverOfficer
        preconditions:
          - "declared_monthly_income_cents <= poverty_threshold_for(household_size) (ERR_INCOME_ABOVE_THRESHOLD)"
        side_effects:
          - "status -> GRANTED; adjudicated_by_user_id = acting WaiverOfficer"
          - "max_waivable_cents = run waiver_cap_calc"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /fee-waivers/{id}/decide with decision=DENY"
        actor: WaiverOfficer
        preconditions:
          - "Request is in REQUESTED"
        side_effects:
          - "status -> DENIED; adjudicated_by_user_id recorded"

      - from: GRANTED
        to: CONSUMED
        trigger: "system, when consumed_cents reaches max_waivable_cents during a certified-copy issuance"
        actor: system
        preconditions:
          - "consumed_cents >= max_waivable_cents"
        side_effects:
          - "status -> CONSUMED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: copy-issue-stale-record
    parent_entity: MarriageRecord
    write_endpoint: "POST /certified-copies/{id}/decide"
    occ_field: "expected_record_version"
    description: |
      Issuing a certified copy against a MarriageRecord whose version has advanced
      since the client last observed it is rejected. The canonical case: a writer
      reads the record, another writer applies an amendment (legitimately bumping
      the record's version and possibly flipping it toward SEALED/AMENDED), and the
      first writer's issue decision now rests on a stale view of the record's
      confidentiality/seal posture. The stale-version check forces a re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: waiver-consume-stale-waiver
    parent_entity: FeeWaiver
    write_endpoint: "POST /certified-copies/{id}/decide"
    occ_field: "expected_waiver_version"
    description: |
      When a certified-copy issuance applies a FeeWaiver, the request must carry the
      waiver version the client last observed. A GRANTED waiver's version advances
      every time it absorbs fees on another issuance (consumed_cents changes); a copy
      issuance keyed to a stale waiver view — which may already be CONSUMED — is
      rejected so the absorption is recomputed against the current remaining cap.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: waiting_period_window
    trigger: "MarriageLicense creation on application APPROVE"
    algorithm: threshold
    formula: |
      # valid_from is an HOUR-precision offset (statutory cooling-off in hours)
      valid_from = issued_at + WAITING_PERIOD_HOURS hours
      # A ceremony is invalid if ceremony_date < valid_from (strict <).
      # Boundary: ceremony_date == valid_from is VALID (>= comparison at accept time).
    input_set: "single license; issued_at is the approval instant"
    constants:
      WAITING_PERIOD_HOURS: 72
    precision: "instant arithmetic to the second; comparison is ceremony_date >= valid_from"

  - name: validity_window
    trigger: "MarriageLicense creation on application APPROVE"
    algorithm: threshold
    formula: |
      # expires_at is a DAY-precision offset (calendar days, not hours).
      expires_at = issued_at + VALIDITY_WINDOW_DAYS days
      # A license is expired if clock > expires_at (strict >).
      # Boundary: clock == expires_at is NOT expired; clock == expires_at + 1 second IS expired.
      # NOTE different boundary operator and different time unit from waiting_period_window.
    input_set: "single license"
    constants:
      VALIDITY_WINDOW_DAYS: 90
    precision: "day arithmetic; comparison clock > expires_at (strict)"

  - name: certified_copy_fee_calc
    trigger: "CertifiedCopyRequest PENDING -> ISSUED"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs (copies_requested, requester_kind, waiver) with
      # tiered per-copy rate AND a conditional surcharge AND waiver absorption.
      # Step 1 — gross per-copy tiered total:
      #   first FIRST_TIER_COPIES copies @ FIRST_TIER_CENTS each,
      #   each additional copy @ ADDITIONAL_COPY_CENTS each.
      #   gross = FIRST_TIER_CENTS*min(copies, FIRST_TIER_COPIES)
      #         + ADDITIONAL_COPY_CENTS*max(0, copies - FIRST_TIER_COPIES)
      # Step 2 — confidential surcharge:
      #   if record.is_confidential: gross += CONFIDENTIAL_SURCHARGE_CENTS (flat, once per request)
      # Step 3 — GOVERNMENT exemption applies AFTER surcharge, BEFORE waiver:
      #   if requester_kind == GOVERNMENT: gross = 0
      # Step 4 — waiver absorption (only if fee_waiver_id present and GRANTED):
      #   absorbed = min(gross, waiver.max_waivable_cents - waiver.consumed_cents)
      #   fee_cents = gross - absorbed
      # Evaluation order is fixed: tier -> surcharge -> gov-exempt -> waiver. (mode-c style
      # pinned evaluation order: waiver absorption depends on the post-surcharge gross.)
    input_set: "single CertifiedCopyRequest; reads its record.is_confidential and optional waiver"
    constants:
      FIRST_TIER_COPIES: 3
      FIRST_TIER_CENTS: 1500
      ADDITIONAL_COPY_CENTS: 900
      CONFIDENTIAL_SURCHARGE_CENTS: 2500
    precision: "integer cents; no rounding (all constants integral)"

  - name: amendment_fee_calc
    trigger: "AmendmentRequest SUBMITTED -> APPLIED"
    algorithm: threshold
    formula: |
      # Combinatorial mode (b): rounding order matters. The base fee gets a percentage
      # expedite uplift and a resubmit penalty; the spec pins ROUND-PER-COMPONENT-THEN-SUM.
      #   base = CLERICAL_BASE_CENTS if amendment_type==CLERICAL else SUBSTANTIVE_BASE_CENTS
      #   expedite_component = round_half_up(base * EXPEDITE_PCT)        # rounded to whole cents FIRST
      #   penalty_component  = round_half_up(base * RESUBMIT_PENALTY_PCT * resubmit_count)  # rounded FIRST
      #   fee_cents = base + expedite_component + penalty_component      # THEN summed
      # Pinned order: round each percentage component to whole cents, THEN sum.
      # (Summing the two percentages first then rounding once would differ by a cent in some cases.)
    input_set: "single AmendmentRequest; resubmit_count read at APPLY time"
    constants:
      CLERICAL_BASE_CENTS: 2000
      SUBSTANTIVE_BASE_CENTS: 5000
      EXPEDITE_PCT: 0.15
      RESUBMIT_PENALTY_PCT: 0.10
      MAX_AMENDMENT_RESUBMITS: 2
    precision: "round_half_up each component to whole cents, then sum"

  - name: waiver_cap_calc
    trigger: "FeeWaiver REQUESTED -> GRANTED"
    algorithm: tiered_pricing
    formula: |
      # The cap scales with how far below the poverty threshold the applicant is.
      #   threshold = poverty_threshold_for(household_size)
      #   shortfall_ratio = (threshold - declared_monthly_income_cents) / threshold   # in [0,1]
      #   if shortfall_ratio >= DEEP_NEED_RATIO: max_waivable_cents = FULL_WAIVER_CAP_CENTS
      #   else: max_waivable_cents = PARTIAL_WAIVER_CAP_CENTS
      # poverty_threshold_for(n) = BASE_POVERTY_CENTS + (n-1)*PER_PERSON_POVERTY_CENTS
    input_set: "single FeeWaiver"
    constants:
      BASE_POVERTY_CENTS: 130000
      PER_PERSON_POVERTY_CENTS: 45000
      DEEP_NEED_RATIO: 0.50
      FULL_WAIVER_CAP_CENTS: 6000
      PARTIAL_WAIVER_CAP_CENTS: 3000
    precision: "integer cents; shortfall_ratio kept as float for the >= 0.50 comparison only"

  - name: applicant_age_years
    trigger: "MarriageApplication UNDER_REVIEW -> APPROVED eligibility screen"
    algorithm: threshold
    formula: |
      # Whole completed years between date_of_birth and the system clock.
      # age = number of full years elapsed (birthday must have occurred this year).
      #   age >= MIN_AGE_NO_CONSENT          -> eligible (no consent needed)
      #   MIN_AGE_WITH_CONSENT <= age < MIN_AGE_NO_CONSENT AND has_judicial_consent -> eligible
      #   age < MIN_AGE_WITH_CONSENT         -> ineligible regardless of consent (ERR_AGE_INELIGIBLE)
      # Boundary: an applicant who turns 18 exactly ON the clock date is eligible (>=).
    input_set: "each applicant on the application"
    constants:
      MIN_AGE_NO_CONSENT: 18
      MIN_AGE_WITH_CONSENT: 16
    precision: "whole completed years"

  - name: remarriage_wait_check
    trigger: "MarriageApplication UNDER_REVIEW -> APPROVED eligibility screen"
    algorithm: threshold
    formula: |
      # For each applicant with prior_marriage_status IN {DIVORCED, WIDOWED}:
      #   eligible_from = prior_dissolution_date + REMARRIAGE_WAIT_DAYS days
      #   eligible if clock >= eligible_from (>=, day-precision).
      #   clock < eligible_from -> ERR_REMARRIAGE_WAIT_NOT_MET
      # NEVER_MARRIED / null prior_dissolution_date applicants skip this check.
      # Boundary: clock == eligible_from is eligible (>=); contrast with validity_window's strict >.
    input_set: "each prior-married applicant on the application"
    constants:
      REMARRIAGE_WAIT_DAYS: 30
    precision: "day arithmetic; comparison clock >= eligible_from"

  - name: return_filing_window
    trigger: "OfficiantReturn creation (computes filing_deadline) and acceptance (late test)"
    algorithm: threshold
    formula: |
      filing_deadline = ceremony_date + RETURN_FILING_DAYS days
      # A return is LATE if, at the instant it was SUBMITTED (its created_at), created_at > filing_deadline (strict >).
      # Boundary: created_at == filing_deadline is on-time (no surcharge); created_at == filing_deadline + 1s is late.
      # Lateness is decided from the return's created_at, NOT the acceptance clock, so a return can be
      # created on-time and accepted later without a surcharge.
    input_set: "single OfficiantReturn"
    constants:
      RETURN_FILING_DAYS: 10
    precision: "day arithmetic; comparison created_at > filing_deadline (strict)"

  - name: fixed_action_fees
    trigger: "license issuance (CHARGE), late return acceptance (CHARGE), apostille authentication (CHARGE)"
    algorithm: aggregation
    formula: |
      # Flat fees pinned by the office schedule, appended as FeeLedgerEntry CHARGE rows:
      #   on license issuance:                amount_cents = LICENSE_FEE_CENTS, source_entity=LICENSE
      #   on accepting a late return:         amount_cents = LATE_RETURN_SURCHARGE_CENTS, source_entity=RETURN
      #   on apostille AUTHENTICATE:          amount_cents = APOSTILLE_FEE_CENTS, source_entity=APOSTILLE
      # On license void the LICENSE_FEE_CENTS charge is reversed with a matching REFUND.
    input_set: "single triggering entity"
    constants:
      LICENSE_FEE_CENTS: 9000
      LATE_RETURN_SURCHARGE_CENTS: 2000
      APOSTILLE_FEE_CENTS: 4000
    precision: "integer cents"

  - name: officiant_ceremony_overlap
    trigger: "OfficiantReturn SUBMITTED -> ACCEPTED"
    algorithm: interval_merge
    formula: |
      # An officiant cannot solemnize two ceremonies whose instants sit within a
      # symmetric travel buffer of each other. Treat each ACCEPTED return's
      # ceremony_date as a point with a +/- OFFICIANT_BUFFER_MINUTES guard:
      #   conflict if |this.ceremony_date - other.ceremony_date| < OFFICIANT_BUFFER_MINUTES
      # Interval semantics: CLOSED-adjacency on a point event — exactly
      # OFFICIANT_BUFFER_MINUTES apart is allowed (strict <), so back-to-back at the
      # buffer edge is fine. Candidate set: other.status == ACCEPTED for same officiant_id,
      # excluding this return. Tie-break is irrelevant (any single conflict rejects).
    input_set: "all OfficiantReturn rows with status ACCEPTED and same officiant_id"
    constants:
      OFFICIANT_BUFFER_MINUTES: 60
    precision: "minute arithmetic; strict < on the absolute gap"

  - name: applicant_license_window_overlap
    trigger: "MarriageApplication UNDER_REVIEW -> APPROVED (before issuing the license)"
    algorithm: interval_merge
    formula: |
      # Neither applicant may already hold a live license window that overlaps the
      # window the new license would occupy. The new window is the HALF-OPEN interval
      #   [valid_from, expires_at)  with valid_from = now + WAITING_PERIOD_HOURS,
      #                                  expires_at  = now + VALIDITY_WINDOW_DAYS.
      # Existing windows come from MarriageLicense rows in status ISSUED whose
      # application names the same applicant on either side.
      # Overlap test (half-open): new.valid_from < existing.expires_at AND
      #                           existing.valid_from < new.expires_at
      # Half-open means touching endpoints do NOT overlap (existing.expires_at ==
      # new.valid_from is allowed). Contrast with officiant_ceremony_overlap's
      # symmetric-buffer point semantics. Aggregate capacity per applicant = 1.
    input_set: "MarriageLicense rows in status ISSUED whose application lists this applicant"
    constants: {}
    precision: "instant arithmetic; half-open overlap test"

  - name: office_collected_balance
    trigger: "any FeeLedgerEntry append (derived/read)"
    algorithm: aggregation
    formula: |
      # The office's net collected cash. Conserved-quantity anchor for §1.9 invariants.
      collected = sum(amount_cents for kind=CHARGE)
                - sum(amount_cents for kind=REFUND)
      # WAIVE entries do NOT affect collected (they record forgone revenue only).
      # Invariant: collected == sum over all entities of fees actually charged and not refunded.
    input_set: "all FeeLedgerEntry rows, no status filter (ledger is append-only)"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource references exist, validated left-to-right (path id before body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range (copies_requested>=1, household_size>=1, declared_monthly_income_cents>=0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: when expected_record_version / expected_waiver_version is supplied it must equal the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /certified-copies/{id}/decide"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity preconditions hold: certified copy on a SEALED record requires GOVERNMENT requester; apostille requires its CertifiedCopyRequest ISSUED; record seal requires no PENDING copy requests"
    error_id: ERR_RECORD_SEALED
    http_status: 409
    applies_to: "POST /certified-copies/{id}/decide, POST /apostilles/{id}/decide, POST /amendments/{id}/decide, POST /records/{id}/seal"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the user accepting an officiant return must differ from the clerk who approved the application; the clerk issuing a copy that applies a waiver must differ from the waiver's adjudicator; a SUBSTANTIVE amendment's adjudicator must differ from the approving clerk"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /returns/{id}/accept, POST /certified-copies/{id}/decide, POST /amendments/{id}/decide"

  - priority: 9
    category: business_temporal
    check: "Time-window rules: ceremony_date within [valid_from, expires_at]; remarriage wait satisfied; license not past expiry on expire-check"
    error_id: ERR_CEREMONY_BEFORE_VALID
    http_status: 409
    applies_to: "POST /returns/{id}/accept, POST /applications/{id}/decide, POST /licenses/{id}/expire-check"

  - priority: 9.5
    category: business_temporal
    check: "Officiant double-booking: accepting a return whose ceremony_date is within OFFICIANT_BUFFER_MINUTES of another ACCEPTED return for the same officiant is rejected (symmetric-buffer point overlap, strict <)"
    error_id: ERR_OFFICIANT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /returns/{id}/accept"

  - priority: 9.7
    category: business_temporal
    check: "Applicant concurrent-license overlap: approving an application whose prospective license window [valid_from, expires_at) half-open-overlaps an existing ISSUED license window for either applicant is rejected"
    error_id: ERR_APPLICANT_LICENSE_OVERLAP
    http_status: 409
    applies_to: "POST /applications/{id}/decide"

  - priority: 10
    category: business_constraint
    check: "Eligibility & access rules: age/consent, prior-married bar, confidential-record access, officiant authorization, waiver income threshold, resubmit limit"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 409
    applies_to: "POST /applications/{id}/decide, POST /certified-copies/{id}/decide, POST /returns/{id}/accept, POST /fee-waivers/{id}/decide, POST /amendments/{id}/resubmit"

  - priority: 11
    category: business_fiscal
    check: "Fiscal rules: a waiver applied to a copy must be GRANTED and belong to a record party; absorbed amount cannot exceed remaining cap"
    error_id: ERR_WAIVER_NOT_GRANTED
    http_status: 409
    applies_to: "POST /certified-copies/{id}/decide"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Applicant -----
  - method: POST
    path: "/applicants"
    description: "Register an applicant (party to a marriage)"
    roles: [Clerk, Applicant]
    code: 201
    input: [full_name, date_of_birth, "prior_marriage_status?", "prior_dissolution_date?", "has_judicial_consent?"]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Get an applicant"
    roles: [Clerk, Registrar, Applicant, WaiverOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ----- Officiant -----
  - method: POST
    path: "/officiants"
    description: "Register an officiant"
    roles: [Clerk, Registrar]
    code: 201
    input: [full_name, credential_type, registration_expires_on]
    output: Officiant
    side_effects: []

  - method: GET
    path: "/officiants/{id}"
    description: "Get an officiant (returns_filed_count is recomputed)"
    roles: [Clerk, Registrar, Officiant]
    code: 200
    input: []
    output: Officiant
    side_effects: []

  - method: POST
    path: "/officiants/{id}/suspend"
    description: "Suspend an officiant's authority to solemnize"
    roles: [Registrar]
    code: 200
    input: []
    output: Officiant
    side_effects: ["Officiant.status -> SUSPENDED"]

  - method: GET
    path: "/officiants/{id}/returns"
    description: "List officiant returns filed by this officiant (reverse lookup for OfficiantReturn.officiant_id)"
    roles: [Clerk, Registrar, Officiant]
    code: 200
    input: []
    output: OfficiantReturn[]
    side_effects: []

  # ----- MarriageApplication -----
  - method: POST
    path: "/applications"
    description: "Create a marriage application in DRAFT"
    roles: [Clerk, Applicant]
    code: 201
    input: [applicant_a_id, applicant_b_id, ceremony_county, "is_confidential?"]
    output: MarriageApplication
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/applications/{id}"
    description: "Get a marriage application"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: MarriageApplication
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List marriage applications; filterable by applicant id"
    roles: [Clerk, Registrar]
    code: 200
    input: ["applicant_a_id?", "applicant_b_id?", "limit?", "offset?"]
    output: MarriageApplication[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application for review"
    roles: [Applicant, Clerk]
    code: 200
    input: []
    output: MarriageApplication
    side_effects: ["status DRAFT -> UNDER_REVIEW"]

  - method: POST
    path: "/applications/{id}/decide"
    description: "Clerk approves or denies an application under review"
    roles: [Clerk]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: MarriageApplication
    side_effects:
      - "APPROVE: status -> APPROVED; create MarriageLicense; append CHARGE ledger entry; recompute total_charged_cents"
      - "DENY: status -> DENIED; record denial_reason_code"

  - method: GET
    path: "/applications/{id}/licenses"
    description: "List licenses produced by this application (reverse lookup for MarriageLicense.application_id)"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: MarriageLicense[]
    side_effects: []

  - method: GET
    path: "/applications/{id}/ledger"
    description: "List FeeLedgerEntry rows for this application chain (reverse lookup for FeeLedgerEntry.application_id)"
    roles: [Clerk, Registrar]
    code: 200
    input: []
    output: FeeLedgerEntry[]
    side_effects: []

  # ----- MarriageLicense -----
  - method: GET
    path: "/licenses/{id}"
    description: "Get a license (status, valid_from, expires_at)"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: MarriageLicense
    side_effects: []

  - method: POST
    path: "/licenses/{id}/expire-check"
    description: "Evaluate a single license against the clock and expire it if past expires_at with no accepted return"
    roles: [Clerk, Registrar]
    code: 200
    input: []
    output: MarriageLicense
    side_effects: ["if expired: status -> EXPIRED; owning application -> EXPIRED (bubble up)"]

  - method: POST
    path: "/licenses/{id}/void"
    description: "Void an unused license and refund its fee"
    roles: [Registrar]
    code: 200
    input: []
    output: MarriageLicense
    side_effects: ["status -> VOID; append REFUND ledger entry; recompute total_charged_cents"]

  # ----- OfficiantReturn -----
  - method: POST
    path: "/returns"
    description: "Officiant files a return after a ceremony (SUBMITTED)"
    roles: [Officiant, Clerk]
    code: 201
    input: [license_id, officiant_id, ceremony_date]
    output: OfficiantReturn
    side_effects: ["status=SUBMITTED; compute filing_deadline"]

  - method: GET
    path: "/returns/{id}"
    description: "Get an officiant return"
    roles: [Clerk, Registrar, Officiant]
    code: 200
    input: []
    output: OfficiantReturn
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List officiant returns; filterable by license id"
    roles: [Clerk, Registrar]
    code: 200
    input: ["license_id?", "limit?", "offset?"]
    output: OfficiantReturn[]
    side_effects: []

  - method: POST
    path: "/returns/{id}/accept"
    description: "Registrar accepts a return: marks license USED, registers a MarriageRecord (cascade)"
    roles: [Registrar]
    code: 200
    input: []
    output: OfficiantReturn
    side_effects:
      - "status -> ACCEPTED; license ISSUED -> USED; create MarriageRecord REGISTERED"
      - "Officiant.returns_filed_count recomputed"
      - "if late: append LATE_RETURN_SURCHARGE CHARGE; recompute total_charged_cents"

  - method: POST
    path: "/returns/{id}/reject"
    description: "Registrar rejects a return"
    roles: [Registrar]
    code: 200
    input: ["rejection_reason_code?"]
    output: OfficiantReturn
    side_effects: ["status -> REJECTED; license stays ISSUED"]

  # ----- MarriageRecord -----
  - method: GET
    path: "/records/{id}"
    description: "Get a marriage record (amendment_count, certified_copies_issued recomputed)"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: MarriageRecord
    side_effects: []

  - method: GET
    path: "/records"
    description: "List marriage records; filterable by license id and return id"
    roles: [Clerk, Registrar]
    code: 200
    input: ["license_id?", "return_id?", "limit?", "offset?"]
    output: MarriageRecord[]
    side_effects: []

  - method: POST
    path: "/records/{id}/seal"
    description: "Seal a record (forces confidential)"
    roles: [Registrar]
    code: 200
    input: []
    output: MarriageRecord
    side_effects: ["status -> SEALED; is_confidential=true"]

  - method: GET
    path: "/records/{id}/certified-copies"
    description: "List certified-copy requests for a record (reverse lookup for CertifiedCopyRequest.record_id)"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: CertifiedCopyRequest[]
    side_effects: []

  - method: GET
    path: "/records/{id}/amendments"
    description: "List amendment requests for a record (reverse lookup for AmendmentRequest.record_id)"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: AmendmentRequest[]
    side_effects: []

  # ----- CertifiedCopyRequest -----
  - method: POST
    path: "/certified-copies"
    description: "Create a certified-copy request (PENDING)"
    roles: [Clerk, Applicant]
    code: 201
    input: [record_id, requester_kind, copies_requested, "fee_waiver_id?"]
    output: CertifiedCopyRequest
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/certified-copies"
    description: "List certified-copy requests; filterable by record id and applied fee-waiver id (reverse lookup for CertifiedCopyRequest.fee_waiver_id)"
    roles: [Clerk, Registrar]
    code: 200
    input: ["record_id?", "fee_waiver_id?", "limit?", "offset?"]
    output: CertifiedCopyRequest[]
    side_effects: []

  - method: GET
    path: "/certified-copies/{id}"
    description: "Get a certified-copy request"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: CertifiedCopyRequest
    side_effects: []

  - method: POST
    path: "/certified-copies/{id}/decide"
    description: "Clerk issues or denies a certified-copy request; ISSUE computes fee and applies any waiver"
    roles: [Clerk]
    code: 200
    input: [decision, "expected_record_version?", "expected_waiver_version?"]
    output: CertifiedCopyRequest
    side_effects:
      - "ISSUE: status -> ISSUED; compute fee_cents; append CHARGE; apply+consume waiver (append WAIVE); recompute record.certified_copies_issued"
      - "DENY: status -> DENIED"

  - method: POST
    path: "/certified-copies/{id}/refund"
    description: "Refund an issued certified copy (reverses charge and any waiver absorption)"
    roles: [Clerk]
    code: 200
    input: []
    output: CertifiedCopyRequest
    side_effects: ["status -> REFUNDED; append REFUND; reverse WAIVE; restore waiver; recompute record.certified_copies_issued"]

  - method: GET
    path: "/certified-copies/{id}/apostilles"
    description: "List apostille requests for a certified copy (reverse lookup for ApostilleRequest.copy_request_id)"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: ApostilleRequest[]
    side_effects: []

  # ----- AmendmentRequest -----
  - method: POST
    path: "/amendments"
    description: "Submit an amendment/correction request for a record (SUBMITTED)"
    roles: [Clerk, Applicant]
    code: 201
    input: [record_id, amendment_type, field_path, new_value]
    output: AmendmentRequest
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/amendments/{id}"
    description: "Get an amendment request"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: AmendmentRequest
    side_effects: []

  - method: POST
    path: "/amendments/{id}/decide"
    description: "Registrar applies, returns-for-info, or rejects an amendment"
    roles: [Registrar]
    code: 200
    input: [decision]
    output: AmendmentRequest
    side_effects:
      - "APPLY: status -> APPLIED; append amendment CHARGE; record -> AMENDED; amendment_count recomputed"
      - "RETURN: status -> RETURNED_FOR_INFO"
      - "REJECT: status -> REJECTED"

  - method: POST
    path: "/amendments/{id}/resubmit"
    description: "Applicant resubmits an amendment returned for info"
    roles: [Applicant, Clerk]
    code: 200
    input: []
    output: AmendmentRequest
    side_effects: ["status RETURNED_FOR_INFO -> SUBMITTED; resubmit_count += 1"]

  # ----- ApostilleRequest -----
  - method: POST
    path: "/apostilles"
    description: "Request an apostille on an issued certified copy (REQUESTED)"
    roles: [Clerk, Applicant]
    code: 201
    input: [copy_request_id, destination_country]
    output: ApostilleRequest
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/apostilles/{id}"
    description: "Get an apostille request"
    roles: [Clerk, Registrar, Applicant]
    code: 200
    input: []
    output: ApostilleRequest
    side_effects: []

  - method: POST
    path: "/apostilles/{id}/decide"
    description: "Registrar authenticates or rejects an apostille request"
    roles: [Registrar]
    code: 200
    input: [decision]
    output: ApostilleRequest
    side_effects: ["AUTHENTICATE: status -> AUTHENTICATED; compute fee; append CHARGE", "REJECT: status -> REJECTED"]

  # ----- FeeWaiver -----
  - method: POST
    path: "/fee-waivers"
    description: "Request a fee waiver (REQUESTED)"
    roles: [Clerk, Applicant]
    code: 201
    input: [applicant_id, declared_monthly_income_cents, household_size]
    output: FeeWaiver
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/fee-waivers/{id}"
    description: "Get a fee waiver"
    roles: [Clerk, Registrar, Applicant, WaiverOfficer]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: []

  - method: GET
    path: "/fee-waivers"
    description: "List fee waivers; filterable by applicant id"
    roles: [Clerk, Registrar, WaiverOfficer]
    code: 200
    input: ["applicant_id?", "limit?", "offset?"]
    output: FeeWaiver[]
    side_effects: []

  - method: POST
    path: "/fee-waivers/{id}/decide"
    description: "WaiverOfficer grants or denies a fee waiver; GRANT computes max_waivable_cents"
    roles: [WaiverOfficer]
    code: 200
    input: [decision]
    output: FeeWaiver
    side_effects: ["GRANT: status -> GRANTED; compute max_waivable_cents", "DENY: status -> DENIED"]

  # ----- Clock / system -----
  - method: POST
    path: "/_clock/set"
    description: "Test-driving endpoint: set the system clock to an absolute instant"
    roles: [Clerk, Registrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["system clock set to to_iso8601"]

  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: advance clock and run the license-expiry sweep"
    roles: [Clerk, Registrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock advanced; every ISSUED license past expires_at with no ACCEPTED return -> EXPIRED; owning applications -> EXPIRED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range integer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_record_version / expected_waiver_version does not match current parent version" }
  - { id: ERR_DUPLICATE_APPLICANT, http: 409, condition: "applicant_a_id equals applicant_b_id on submit" }
  - { id: ERR_APPLICANT_ALREADY_MARRIED, http: 409, condition: "An applicant has prior_marriage_status MARRIED" }
  - { id: ERR_AGE_INELIGIBLE, http: 409, condition: "Applicant younger than MIN_AGE_WITH_CONSENT, or younger than MIN_AGE_NO_CONSENT without judicial consent" }
  - { id: ERR_JUDICIAL_CONSENT_REQUIRED, http: 409, condition: "Applicant between MIN_AGE_WITH_CONSENT and MIN_AGE_NO_CONSENT lacks has_judicial_consent" }
  - { id: ERR_REMARRIAGE_WAIT_NOT_MET, http: 409, condition: "Prior-married applicant's dissolution + REMARRIAGE_WAIT_DAYS not yet reached" }
  - { id: ERR_CEREMONY_BEFORE_VALID, http: 409, condition: "ceremony_date earlier than license.valid_from (waiting period not elapsed)" }
  - { id: ERR_CEREMONY_AFTER_EXPIRY, http: 409, condition: "ceremony_date later than license.expires_at" }
  - { id: ERR_LICENSE_NOT_USABLE, http: 409, condition: "Return acceptance attempted against a license not in ISSUED" }
  - { id: ERR_LICENSE_ALREADY_USED, http: 409, condition: "Void attempted on a license with an ACCEPTED return" }
  - { id: ERR_LICENSE_NOT_EXPIRED, http: 409, condition: "expire-check on a license whose clock has not passed expires_at" }
  - { id: ERR_OFFICIANT_NOT_AUTHORIZED, http: 409, condition: "Officiant SUSPENDED or ceremony_date after registration_expires_on" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same user attempts two duties that must be separated" }
  - { id: ERR_CONFIDENTIAL_ACCESS_DENIED, http: 409, condition: "PUBLIC requester sought a certified copy of a confidential record" }
  - { id: ERR_RECORD_SEALED, http: 409, condition: "Operation blocked because the record is SEALED (non-GOVERNMENT copy, apostille, or amendment)" }
  - { id: ERR_RECORD_HAS_PENDING_COPIES, http: 409, condition: "Seal attempted while a certified-copy request is PENDING" }
  - { id: ERR_COPY_NOT_ISSUED, http: 409, condition: "Apostille requested/authenticated for a copy not in ISSUED" }
  - { id: ERR_WAIVER_NOT_GRANTED, http: 409, condition: "Applied fee_waiver is not GRANTED, not a record party's, or over cap" }
  - { id: ERR_INCOME_ABOVE_THRESHOLD, http: 409, condition: "Waiver grant attempted but declared income exceeds the poverty threshold" }
  - { id: ERR_RESUBMIT_LIMIT_REACHED, http: 409, condition: "Amendment resubmitted more than MAX_AMENDMENT_RESUBMITS times" }
  - { id: ERR_OFFICIANT_DOUBLE_BOOKED, http: 409, condition: "Accepting a return whose ceremony is within OFFICIANT_BUFFER_MINUTES of another ACCEPTED return for the same officiant" }
  - { id: ERR_APPLICANT_LICENSE_OVERLAP, http: 409, condition: "Approving an application whose prospective license window overlaps an existing ISSUED license window for an applicant" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "A party to a marriage; entity-backed. Creates/submits applications, requests copies/amendments/apostilles/waivers, resubmits amendments. Can act only on resources where they are a party."
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "POST /applicants"
      - "GET /applicants/{id}"
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /amendments/{id}/resubmit"
      - "POST /certified-copies"
      - "POST /amendments"
      - "POST /apostilles"
      - "POST /fee-waivers"
      - "GET reads on own application/license/record/copy/amendment/apostille/waiver"

  - name: Officiant
    description: "A registered officiant; entity-backed. Files officiant returns after ceremonies and reads own returns."
    identity: "entity_backed:Officiant"
    exclusive_operations: []
    shared_operations:
      - "POST /returns"
      - "GET /returns/{id}"
      - "GET /officiants/{id}"
      - "GET /officiants/{id}/returns"

  - name: Clerk
    description: "Front-counter operator; opaque. Screens and decides applications, issues/denies/refunds certified copies, registers people and intakes filings."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/decide"
      - "POST /certified-copies/{id}/decide"
      - "POST /certified-copies/{id}/refund"
    shared_operations:
      - "POST /applicants"
      - "POST /officiants"
      - "POST /applications"
      - "POST /returns"
      - "GET list/read endpoints"
      - "POST /licenses/{id}/expire-check"
      - "POST /_clock/set"
      - "POST /_clock/advance"

  - name: Registrar
    description: "Records authority; opaque. Accepts/rejects returns, voids licenses, adjudicates amendments, seals records, authenticates apostilles, suspends officiants. Segregated from the approving Clerk on return acceptance and substantive amendments."
    identity: "opaque"
    exclusive_operations:
      - "POST /returns/{id}/accept"
      - "POST /returns/{id}/reject"
      - "POST /licenses/{id}/void"
      - "POST /amendments/{id}/decide"
      - "POST /apostilles/{id}/decide"
      - "POST /records/{id}/seal"
      - "POST /officiants/{id}/suspend"
    shared_operations:
      - "GET list/read endpoints"
      - "POST /licenses/{id}/expire-check"
      - "POST /_clock/set"
      - "POST /_clock/advance"

  - name: WaiverOfficer
    description: "Means-test adjudicator; opaque. Grants or denies fee waivers. Segregated from the Clerk who applies a granted waiver to a certified copy."
    identity: "opaque"
    exclusive_operations:
      - "POST /fee-waivers/{id}/decide"
    shared_operations:
      - "GET /fee-waivers/{id}"
      - "GET /fee-waivers"
      - "GET /applicants/{id}"
