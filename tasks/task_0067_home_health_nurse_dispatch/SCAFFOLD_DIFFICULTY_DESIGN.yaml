              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN Q", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
