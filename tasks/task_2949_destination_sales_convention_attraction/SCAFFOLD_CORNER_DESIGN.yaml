              payload: {}
              as: SalesManager
          trigger:
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { attrition: $.data.attrition_settlement_amount }
            - call: "GET /room-block-commitments/${c_a_id}"
              payload: {}
              as: SalesManager
              captures: { nights_a: $.data.committed_room_nights, picked_a: $.data.picked_up_room_nights, short_a: $.data.attrition_shortfall_nights, dmg_a: $.data.attrition_damages_amount }
            - call: "GET /room-block-commitments/${c_c_id}"
              payload: {}
              as: SalesManager
              captures: { nights_c: $.data.committed_room_nights, picked_c: $.data.picked_up_room_nights, short_c: $.data.attrition_shortfall_nights, dmg_c: $.data.attrition_damages_amount }
          assert:
            - "the Cityline pickup list has total_count == 0"
            - "${nights_a} == 1000 (500 peak * 2 nights), ${picked_a} == 650, ${short_a} == 150 (floor(1000 * 0.80) == 800 minus 650), ${dmg_a} == 24112.13"
            - "${nights_c} == 200 and ${picked_c} == 0, yet ${short_c} == 0 and ${dmg_c} == 0.00 - no pickup means no assessment"
            - "${attrition} == 47711.26 (24112.13 + 23599.13), not 70156.14"

