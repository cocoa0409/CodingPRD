scenario: "526. Surrogacy & Egg-Donation Agency: intended-parent & surrogate intake/screening, matching & psychological clearance, gestational-carrier contract & escrow, compensation schedule & disbursement, medical/cycle coordination, insurance review, milestone tracking (transfer/heartbeat/birth), legal parentage order"
domain_name: surrogacy-egg-donation-agency
api_prefix: ""

# ---------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation      # IP + Carrier + Donor + Attorney must reach a signed, cleared, escrow-funded match
  secondary_archetype: compliance_audit           # milestone-gated escrow disbursement, cooling-off, segregation of duties
  complexity_layers:
    - optimistic_concurrency                       # OCC on Match.version and EscrowAccount.version
    - cascading_side_effects                       # clearance revoke → match un-clears → contract voids → escrow freezes
    - dual_variant_calculation                     # escrow disbursable-now (milestone-gated) vs projected-liability (forward-looking)
    - derived_field_reconciliation                 # EscrowAccount.available_cents kept consistent with deposits − disbursed − reserved

  entity_topology: flat                            # peer entities (Journey, Match, EscrowAccount, Disbursement, ...) linked by FK, not nested trees
  state_machine_shape: cyclic                      # screening revision loops + matching offer→counter→accept cycle
  relationship_patterns:
    - one_to_many                                  # Journey → Milestones, Journey → Disbursements
    - many_to_many                                 # Match links IntendedParent × GestationalCarrier (× optional EggDonor)
    - cross_aggregate                              # Disbursement (under Journey) reserves against EscrowAccount (peer)
  role_model: segregation_of_duties                # the CaseManager who approves a disbursement cannot be the FinanceOfficer who releases it
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: IntendedParent
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal name of the intended parent applicant
      - name: state_code
        type: string
        source: input
        description: two-letter US state of residence; drives legal-parentage eligibility
        constraints: "2-letter uppercase; PARENTAGE_HOSTILE set = {LA, NE} forbids pre-birth orders"
      - name: intake_status
        type: enum
        source: system
        description: intake/screening lifecycle
        default: DRAFT
        constraints: "DRAFT, SUBMITTED, SCREENING, CLEARED, REJECTED"
      - name: psych_clearance
        type: enum
        source: system
        description: psychological clearance outcome for this party
        default: PENDING
        constraints: "PENDING, PASSED, FAILED"
      - name: budget_cents
        type: integer
        source: input
        description: total funds the IP will deposit into escrow for this arrangement (integer cents)
        constraints: ">= 0"

  - name: GestationalCarrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal name of the gestational carrier (surrogate) applicant
      - name: state_code
        type: string
        source: input
        description: two-letter US state where the carrier will deliver; drives insurance review
        constraints: "2-letter uppercase"
      - name: intake_status
        type: enum
        source: system
        description: intake/screening lifecycle
        default: DRAFT
        constraints: "DRAFT, SUBMITTED, SCREENING, CLEARED, REJECTED"
      - name: psych_clearance
        type: enum
        source: system
        description: psychological clearance outcome for this carrier
        default: PENDING
        constraints: "PENDING, PASSED, FAILED"
      - name: prior_deliveries
        type: integer
        source: input
        description: number of prior successful deliveries; must be >= 1 to be eligible to screen
        constraints: ">= 0"
      - name: base_compensation_cents
        type: integer
        source: input
        description: agreed base carrier compensation (integer cents), before per-milestone schedule
        constraints: ">= 0"

  - name: EggDonor
    parent: null
    common_fields: true
    fields:
      - name: donor_code
        type: string
        source: input
        description: anonymized donor code; unique across active donors
        constraints: "unique among EggDonor with intake_status IN {SUBMITTED, SCREENING, CLEARED}"
      - name: state_code
        type: string
        source: input
        description: two-letter US state of the donor
        constraints: "2-letter uppercase"
      - name: intake_status
        type: enum
        source: system
        description: intake/screening lifecycle (donors are optional in a Match)
        default: DRAFT
        constraints: "DRAFT, SUBMITTED, SCREENING, CLEARED, REJECTED"
      - name: donor_compensation_cents
        type: integer
        source: input
        description: agreed donor compensation (integer cents)
        constraints: ">= 0"

  - name: Match
    parent: null
    common_fields: true
    fields:
      - name: intended_parent_id
        type: string
        source: input
        description: "FK -> IntendedParent.id; the IP side of the match"
      - name: carrier_id
        type: string
        source: input
        description: "FK -> GestationalCarrier.id; the carrier side of the match"
      - name: donor_id
        type: string
        source: input
        description: "FK -> EggDonor.id; optional egg donor; null when IP uses own gametes"
        default: null
      - name: status
        type: enum
        source: system
        description: matching + psychological clearance lifecycle
        default: PROPOSED
        constraints: "PROPOSED, COUNTERED, ACCEPTED, PSYCH_CLEARED, VOID"
      - name: offer_round
        type: integer
        source: system
        description: negotiation round counter; increments each PROPOSED->COUNTERED->PROPOSED cycle
        default: 0
      - name: proposed_carrier_comp_cents
        type: integer
        source: input
        description: carrier compensation offered in the current round (integer cents)
        constraints: ">= 0"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; the match this gestational-carrier contract covers"
      - name: status
        type: enum
        source: system
        description: contract lifecycle
        default: DRAFTED
        constraints: "DRAFTED, IP_SIGNED, EXECUTED, VOID"
      - name: ip_signed_at
        type: datetime
        source: system
        description: timestamp the IP signed; starts the mandatory 3-day cooling-off before the carrier may counter-sign
        default: null
      - name: cooling_off_days
        type: integer
        source: system
        description: mandatory reflection window (days) between IP signature and carrier counter-signature
        default: 3

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - name: journey_id
        type: string
        source: input
        description: "FK -> Journey.id; the journey whose funds this account holds"
      - name: deposited_cents
        type: integer
        source: system
        description: cumulative funds deposited by the IP (integer cents)
        default: 0
      - name: disbursed_cents
        type: integer
        source: system
        description: cumulative funds actually released to recipients (integer cents)
        default: 0
      - name: reserved_cents
        type: integer
        source: system
        description: funds committed to APPROVED-but-not-yet-RELEASED disbursements (integer cents)
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "derived = deposited_cents - disbursed_cents - reserved_cents; must never go negative"
      - name: status
        type: enum
        source: system
        description: escrow lifecycle
        default: OPEN
        constraints: "OPEN, FROZEN, CLOSED"

  - name: Journey
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; the psych-cleared, executed-contract match this journey runs"
      - name: status
        type: enum
        source: system
        description: overall journey lifecycle, gated by milestones
        default: ACTIVE
        constraints: "ACTIVE, ON_HOLD, COMPLETED, TERMINATED"
      - name: current_phase
        type: enum
        source: computed
        description: "derived from the latest ACHIEVED milestone: PRE_TRANSFER < TRANSFERRED < HEARTBEAT_CONFIRMED < BORN"
        default: PRE_TRANSFER
      - name: parentage_order_status
        type: enum
        source: system
        description: legal parentage order lifecycle
        default: NOT_FILED
        constraints: "NOT_FILED, FILED, GRANTED, DENIED"

  - name: Milestone
    parent: Journey
    common_fields: true
    fields:
      - name: journey_id
        type: string
        source: input
        description: "FK -> Journey.id; the journey this milestone belongs to"
      - name: milestone_type
        type: enum
        source: input
        description: the clinical/legal milestone
        constraints: "EMBRYO_TRANSFER, HEARTBEAT, BIRTH; each type at most once per journey"
      - name: status
        type: enum
        source: system
        description: milestone achievement state
        default: SCHEDULED
        constraints: "SCHEDULED, ACHIEVED, FAILED"
      - name: scheduled_utc
        type: datetime
        source: input
        description: scheduled clinical date/time (ISO 8601 UTC)
      - name: achieved_utc
        type: datetime
        source: system
        description: timestamp the milestone was confirmed ACHIEVED; drives compensation release windows
        default: null

  - name: CompensationSchedule
    parent: Journey
    common_fields: true
    fields:
      - name: journey_id
        type: string
        source: input
        description: "FK -> Journey.id; the journey this schedule line belongs to"
      - name: trigger_milestone_type
        type: enum
        source: input
        description: which achieved milestone unlocks this payment
        constraints: "EMBRYO_TRANSFER, HEARTBEAT, BIRTH"
      - name: recipient
        type: enum
        source: input
        description: who is paid when the trigger milestone is ACHIEVED
        constraints: "CARRIER, DONOR"
      - name: amount_cents
        type: integer
        source: input
        description: scheduled payment amount (integer cents)
        constraints: ">= 0"

  - name: Disbursement
    parent: Journey
    common_fields: true
    fields:
      - name: journey_id
        type: string
        source: input
        description: "FK -> Journey.id; the journey this disbursement draws from"
      - name: schedule_id
        type: string
        source: input
        description: "FK -> CompensationSchedule.id; the schedule line being paid"
      - name: escrow_account_id
        type: string
        source: input
        description: "FK -> EscrowAccount.id; the escrow account funds are drawn from"
      - name: amount_cents
        type: integer
        source: system
        description: copied from the CompensationSchedule line at approval time (integer cents)
      - name: status
        type: enum
        source: system
        description: disbursement approval/release lifecycle
        default: REQUESTED
        constraints: "REQUESTED, APPROVED, RELEASED, REJECTED"
      - name: approved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CaseManager who APPROVED this disbursement (segregation-of-duties record)
        default: null

  - name: InsuranceReview
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> GestationalCarrier.id; the carrier whose maternity coverage is reviewed"
      - name: policy_kind
        type: enum
        source: input
        description: coverage type presented for review
        constraints: "SURROGACY_FRIENDLY, EXCLUSION, NONE"
      - name: status
        type: enum
        source: system
        description: insurance review outcome
        default: PENDING
        constraints: "PENDING, APPROVED, GAP_IDENTIFIED, REJECTED"
      - name: gap_premium_cents
        type: integer
        source: system
        description: computed supplemental-policy premium when a coverage gap is identified (integer cents)
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: IntendedParent
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /intended-parents/{id}/submit"
        actor: CaseManager
        preconditions: ["budget_cents >= 0", "legal_name present"]
        side_effects: ["increments IntendedParent.version by 1"]
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /intended-parents/{id}/start-screening"
        actor: Screener
        preconditions: ["intake_status == SUBMITTED"]
        side_effects: ["increments IntendedParent.version by 1"]
      - from: SCREENING
        to: CLEARED
        trigger: "POST /intended-parents/{id}/clear"
        actor: Screener
        preconditions: ["intake_status == SCREENING", "psych_clearance == PASSED"]
        side_effects: ["increments IntendedParent.version by 1"]
      - from: SCREENING
        to: REJECTED
        trigger: "POST /intended-parents/{id}/reject"
        actor: Screener
        preconditions: ["intake_status == SCREENING"]
        side_effects: ["increments IntendedParent.version by 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /intended-parents/{id}/return-to-draft"
        actor: CaseManager
        preconditions: ["intake_status == SUBMITTED"]
        side_effects: ["increments IntendedParent.version by 1"]
        note: "revision loop — SUBMITTED can bounce back to DRAFT for corrections (cyclic shape)"

  - entity: GestationalCarrier
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /carriers/{id}/submit"
        actor: CaseManager
        preconditions: ["prior_deliveries >= 1", "base_compensation_cents >= 0"]
        side_effects: ["increments GestationalCarrier.version by 1"]
        note: "prior_deliveries < 1 rejected with ERR_CARRIER_INELIGIBLE (boundary: exactly 1 passes)"
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /carriers/{id}/start-screening"
        actor: Screener
        preconditions: ["intake_status == SUBMITTED"]
        side_effects: ["increments GestationalCarrier.version by 1"]
      - from: SCREENING
        to: CLEARED
        trigger: "POST /carriers/{id}/clear"
        actor: Screener
        preconditions:
          - "intake_status == SCREENING"
          - "psych_clearance == PASSED"
          - "an InsuranceReview exists for this carrier with status IN {APPROVED, GAP_IDENTIFIED}"
        side_effects: ["increments GestationalCarrier.version by 1"]
        note: "cross-entity: carrier clearance depends on InsuranceReview state (guarded transition)"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /carriers/{id}/reject"
        actor: Screener
        preconditions: ["intake_status == SCREENING"]
        side_effects: ["increments GestationalCarrier.version by 1"]

  - entity: EggDonor
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /egg-donors/{id}/submit"
        actor: CaseManager
        preconditions: ["donor_code unique among non-terminal donors"]
        side_effects: ["increments EggDonor.version by 1"]
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /egg-donors/{id}/start-screening"
        actor: Screener
        preconditions: ["intake_status == SUBMITTED"]
        side_effects: ["increments EggDonor.version by 1"]
      - from: SCREENING
        to: CLEARED
        trigger: "POST /egg-donors/{id}/clear"
        actor: Screener
        preconditions: ["intake_status == SCREENING"]
        side_effects: ["increments EggDonor.version by 1"]
      - from: SCREENING
        to: REJECTED
        trigger: "POST /egg-donors/{id}/reject"
        actor: Screener
        preconditions: ["intake_status == SCREENING"]
        side_effects: ["increments EggDonor.version by 1"]

  - entity: Match
    initial_state: PROPOSED
    terminal_states: [VOID]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /matches/{id}/counter"
        actor: CaseManager
        preconditions:
          - "status == PROPOSED"
          - "expected_match_version matches current Match.version"
        side_effects:
          - "sets Match.proposed_carrier_comp_cents to the countered amount"
          - "increments Match.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /matches/{id}/re-propose"
        actor: CaseManager
        preconditions: ["status == COUNTERED", "expected_match_version matches current Match.version"]
        side_effects:
          - "increments Match.offer_round by 1"
          - "sets Match.proposed_carrier_comp_cents to the re-proposed amount"
          - "increments Match.version by 1"
        note: "cyclic negotiation: PROPOSED -> COUNTERED -> PROPOSED loops, offer_round climbs each loop"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /matches/{id}/accept"
        actor: CaseManager
        preconditions:
          - "status == PROPOSED"
          - "IntendedParent.intake_status == CLEARED"
          - "GestationalCarrier.intake_status == CLEARED"
          - "if donor_id present, EggDonor.intake_status == CLEARED"
          - "expected_match_version matches current Match.version"
        side_effects:
          - "sets GestationalCarrier.base_compensation_cents to Match.proposed_carrier_comp_cents"
          - "increments Match.version by 1"
        note: "cross-entity precondition: all cleared parties required before ACCEPT"
      - from: ACCEPTED
        to: PSYCH_CLEARED
        trigger: "POST /matches/{id}/psych-clear"
        actor: Screener
        preconditions:
          - "status == ACCEPTED"
          - "IntendedParent.psych_clearance == PASSED"
          - "GestationalCarrier.psych_clearance == PASSED"
        side_effects: ["increments Match.version by 1"]
      - from: PROPOSED
        to: VOID
        trigger: "POST /matches/{id}/void"
        actor: CaseManager
        preconditions: ["status IN {PROPOSED, COUNTERED, ACCEPTED, PSYCH_CLEARED}"]
        side_effects:
          - "if a Contract exists for this match and is not VOID, transitions Contract to VOID (cascade hop 1)"
          - "increments Match.version by 1"
        note: "cascade origin: void match -> void contract -> freeze escrow (see Contract + EscrowAccount)"

  - entity: Contract
    initial_state: DRAFTED
    terminal_states: [VOID]
    transitions:
      - from: DRAFTED
        to: IP_SIGNED
        trigger: "POST /contracts/{id}/ip-sign"
        actor: IntendedParentActor
        preconditions:
          - "status == DRAFTED"
          - "Match.status == PSYCH_CLEARED"
        side_effects:
          - "stamps Contract.ip_signed_at = current clock time"
          - "increments Contract.version by 1"
        note: "starts the 3-day cooling-off window before carrier may counter-sign"
      - from: IP_SIGNED
        to: EXECUTED
        trigger: "POST /contracts/{id}/carrier-sign"
        actor: CarrierActor
        preconditions:
          - "status == IP_SIGNED"
          - "current clock time >= ip_signed_at + cooling_off_days (temporal window)"
        side_effects:
          - "increments Contract.version by 1"
        note: "temporal validation: carrier-sign before cooling-off elapses is rejected"
      - from: DRAFTED
        to: VOID
        trigger: "POST /contracts/{id}/void (or cascaded from Match.void)"
        actor: CaseManager
        preconditions: ["status IN {DRAFTED, IP_SIGNED}"]
        side_effects:
          - "if an EscrowAccount exists for the linked journey and is OPEN, transitions it to FROZEN (cascade hop 2)"
          - "increments Contract.version by 1"
      - from: IP_SIGNED
        to: VOID
        trigger: "POST /contracts/{id}/void (or cascaded from Match.void)"
        actor: CaseManager
        preconditions: ["status IN {DRAFTED, IP_SIGNED}"]
        side_effects:
          - "if an EscrowAccount exists for the linked journey and is OPEN, transitions it to FROZEN (cascade hop 2)"
          - "increments Contract.version by 1"

  - entity: EscrowAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /escrow-accounts/{id}/deposit"
        actor: IntendedParentActor
        preconditions:
          - "status == OPEN"
          - "expected_escrow_version matches current EscrowAccount.version"
          - "deposited_cents + amount_cents <= IntendedParent.budget_cents (aggregate cap)"
        side_effects:
          - "adds amount to deposited_cents"
          - "recomputes available_cents"
          - "increments EscrowAccount.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /escrow-accounts/{id}/freeze (or cascaded from Contract.void)"
        actor: FinanceOfficer
        preconditions: ["status == OPEN"]
        side_effects: ["increments EscrowAccount.version by 1"]
      - from: FROZEN
        to: OPEN
        trigger: "POST /escrow-accounts/{id}/unfreeze"
        actor: FinanceOfficer
        preconditions: ["status == FROZEN", "linked Contract.status != VOID"]
        side_effects: ["increments EscrowAccount.version by 1"]
        note: "compensation-style revert: unfreeze only if the void that froze it has been reversed elsewhere; VOID contract blocks reopen"
      - from: OPEN
        to: CLOSED
        trigger: "POST /escrow-accounts/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "status == OPEN"
          - "reserved_cents == 0"
          - "linked Journey.status == COMPLETED"
        side_effects: ["increments EscrowAccount.version by 1"]

  - entity: Journey
    initial_state: ACTIVE
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /journeys/{id}/hold"
        actor: CaseManager
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments Journey.version by 1"]
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /journeys/{id}/resume"
        actor: CaseManager
        preconditions: ["status == ON_HOLD"]
        side_effects: ["increments Journey.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /journeys/{id}/complete"
        actor: CaseManager
        preconditions:
          - "status == ACTIVE"
          - "a Milestone of type BIRTH exists with status == ACHIEVED"
          - "parentage_order_status == GRANTED"
        side_effects: ["increments Journey.version by 1"]
        note: "cross-entity: journey completion depends on BIRTH milestone ACHIEVED and parentage GRANTED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /journeys/{id}/terminate"
        actor: CaseManager
        preconditions: ["status IN {ACTIVE, ON_HOLD}"]
        side_effects:
          - "freezes the linked EscrowAccount if OPEN"
          - "increments Journey.version by 1"
      - from: ON_HOLD
        to: TERMINATED
        trigger: "POST /journeys/{id}/terminate"
        actor: CaseManager
        preconditions: ["status IN {ACTIVE, ON_HOLD}"]
        side_effects:
          - "freezes the linked EscrowAccount if OPEN"
          - "increments Journey.version by 1"

  - entity: Milestone
    initial_state: SCHEDULED
    terminal_states: [ACHIEVED, FAILED]
    transitions:
      - from: SCHEDULED
        to: ACHIEVED
        trigger: "POST /journeys/{id}/milestones/{mid}/achieve"
        actor: CaseManager
        preconditions:
          - "Milestone.status == SCHEDULED"
          - "Journey.status == ACTIVE"
          - "if milestone_type == HEARTBEAT, a Milestone of type EMBRYO_TRANSFER for this journey is ACHIEVED (ordering)"
          - "if milestone_type == BIRTH, a Milestone of type HEARTBEAT for this journey is ACHIEVED (ordering)"
        side_effects:
          - "stamps achieved_utc = current clock time"
          - "recomputes Journey.current_phase from achieved milestones"
          - "increments Milestone.version by 1"
        note: "milestone ordering enforces EMBRYO_TRANSFER -> HEARTBEAT -> BIRTH"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /journeys/{id}/milestones/{mid}/fail"
        actor: CaseManager
        preconditions: ["Milestone.status == SCHEDULED"]
        side_effects: ["increments Milestone.version by 1"]

  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /journeys/{id}/disbursements/{did}/approve"
        actor: CaseManager
        preconditions:
          - "status == REQUESTED"
          - "the CompensationSchedule.trigger_milestone_type has an ACHIEVED Milestone on this journey"
          - "EscrowAccount.status == OPEN"
          - "amount_cents <= EscrowAccount.available_cents (fiscal check)"
        side_effects:
          - "records approved_by_user_id = acting CaseManager X-User-ID"
          - "adds amount_cents to EscrowAccount.reserved_cents; recomputes available_cents"
          - "increments EscrowAccount.version by 1"
          - "increments Disbursement.version by 1"
        note: "reserve reduces available_cents but not deposited_cents (compensating invariant candidate)"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /journeys/{id}/disbursements/{did}/release"
        actor: FinanceOfficer
        preconditions:
          - "status == APPROVED"
          - "acting FinanceOfficer X-User-ID != Disbursement.approved_by_user_id (segregation of duties)"
          - "EscrowAccount.status == OPEN"
        side_effects:
          - "moves amount_cents from reserved_cents to disbursed_cents on EscrowAccount"
          - "recomputes available_cents"
          - "increments EscrowAccount.version by 1"
          - "increments Disbursement.version by 1"
        note: "invariant: reserved decreases and disbursed increases by the same amount; deposited unchanged"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /journeys/{id}/disbursements/{did}/reject"
        actor: CaseManager
        preconditions: ["status == REQUESTED"]
        side_effects: ["increments Disbursement.version by 1"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /journeys/{id}/disbursements/{did}/reject"
        actor: CaseManager
        preconditions: ["status == APPROVED"]
        side_effects:
          - "releases the reservation: subtracts amount_cents from EscrowAccount.reserved_cents; recomputes available_cents"
          - "increments EscrowAccount.version by 1"
          - "increments Disbursement.version by 1"
        note: "compensation: rejecting an APPROVED disbursement returns reserved funds to available (invariant: reserved back to prior)"

  - entity: InsuranceReview
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /insurance-reviews/{id}/approve"
        actor: Screener
        preconditions: ["status == PENDING", "policy_kind == SURROGACY_FRIENDLY"]
        side_effects: ["increments InsuranceReview.version by 1"]
      - from: PENDING
        to: GAP_IDENTIFIED
        trigger: "POST /insurance-reviews/{id}/identify-gap"
        actor: Screener
        preconditions: ["status == PENDING", "policy_kind == EXCLUSION"]
        side_effects:
          - "computes gap_premium_cents via insurance_gap_premium calculation"
          - "increments InsuranceReview.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /insurance-reviews/{id}/reject"
        actor: Screener
        preconditions: ["status == PENDING", "policy_kind == NONE"]
        side_effects: ["increments InsuranceReview.version by 1"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: match-accept-stale-version
    parent_entity: Match
    write_endpoint: "POST /matches/{id}/accept"
    occ_field: "expected_match_version"
    description: |
      Accepting a Match whose version has advanced since the client last
      observed it is rejected. A counter/re-propose transition between the
      client's read and this accept bumps Match.version and changes the
      compensation being agreed to, so the stale accept is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: escrow-deposit-stale-version
    parent_entity: EscrowAccount
    write_endpoint: "POST /escrow-accounts/{id}/deposit"
    occ_field: "expected_escrow_version"
    description: |
      Depositing into an EscrowAccount whose version has advanced since the
      client last observed it is rejected. A prior deposit or a cascaded
      freeze bumps EscrowAccount.version, so a deposit carrying the old
      version is refused before it can breach the budget cap on stale data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: escrow_available_reconciliation
    trigger: "recomputed on every deposit, disbursement approve/reject/release, on EscrowAccount"
    algorithm: aggregation
    formula: |
      available_cents = deposited_cents - disbursed_cents - reserved_cents
      INVARIANT: available_cents >= 0 at all times (rejected transitions must not breach it)
    input_set: "the single EscrowAccount's own three counters; no cross-row aggregation"
    constants: {}
    precision: "integer cents, exact"

  - name: escrow_disbursable_now
    trigger: "GET /escrow-accounts/{id}/summary and on Disbursement approve precondition"
    algorithm: chronological
    formula: |
      # Milestone-GATED (chronological): only schedule lines whose trigger milestone is
      # already ACHIEVED, processed in Milestone.achieved_utc ASC order (tie-break created_at ASC),
      # summing schedule.amount_cents until the running total would exceed available_cents.
      disbursable_now = 0
      for m in achieved_milestones ordered by (achieved_utc ASC, created_at ASC):
        for line in CompensationSchedule where trigger_milestone_type == m.milestone_type
                    ordered by (created_at ASC):
          if disbursable_now + line.amount_cents <= available_cents:
            disbursable_now += line.amount_cents
          # else skip this line (later lines may still fit smaller amounts — no, strict order stop)
      return disbursable_now
    input_set: "CompensationSchedule lines whose trigger_milestone_type maps to an ACHIEVED Milestone on the journey"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: gated_chronological
        when: "escrow_disbursable_now — what can be paid RIGHT NOW given achieved milestones"
        difference: "includes only ACHIEVED-milestone lines, capped by current available_cents, in achieved_utc order"

  - name: escrow_projected_liability
    trigger: "GET /escrow-accounts/{id}/summary (forward-looking projection field)"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING: sum of ALL CompensationSchedule lines for the journey whose trigger
      # milestone is NOT FAILED (i.e. SCHEDULED or ACHIEVED milestone-types), regardless of
      # current available_cents. Ignores ordering and cap — it is a projection of total obligation.
      projected_liability = sum(line.amount_cents
                                 for line in CompensationSchedule[journey]
                                 if the milestone of line.trigger_milestone_type is NOT FAILED)
      funding_shortfall = max(0, projected_liability - available_cents)
    input_set: "ALL CompensationSchedule lines whose trigger milestone_type is not FAILED — includes not-yet-achieved milestones"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: forward_projection
        when: "escrow_projected_liability — total future obligation vs escrow_disbursable_now's paid-now amount"
        difference: "includes SCHEDULED (future) milestone lines, ignores available_cents cap and ordering; the DUAL of gated_chronological on the same schedule data"

  - name: carrier_total_compensation
    trigger: "GET /matches/{id}/comp-breakdown and on Match.accept"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial (mode a): >=3 inputs with tiered multiplier + conditional add-on.
      # base = Match.proposed_carrier_comp_cents
      # experience_bonus tier on GestationalCarrier.prior_deliveries:
      #   prior_deliveries == 1 -> 0
      #   2 <= prior_deliveries <= 3 -> round_half_up(base * 0.05)
      #   prior_deliveries >= 4     -> round_half_up(base * 0.10)
      # multiples_addon = MULTIPLES_ADDON_CENTS if any Milestone of type HEARTBEAT is ACHIEVED
      #                   AND journey.current_phase >= HEARTBEAT_CONFIRMED else 0
      # EVALUATION ORDER PINNED: experience_bonus computed from base FIRST, THEN summed.
      total = base + experience_bonus + multiples_addon
    input_set: "Match.proposed_carrier_comp_cents, GestationalCarrier.prior_deliveries, journey milestone states"
    constants:
      MULTIPLES_ADDON_CENTS: 500000
      TIER1_PCT: 0.05
      TIER2_PCT: 0.10
    precision: "integer cents, round_half_up on each percentage term BEFORE summing (per-term rounding pinned)"

  - name: insurance_gap_premium
    trigger: "on InsuranceReview.identify-gap transition"
    algorithm: threshold
    formula: |
      # Combinatorial (mode b): nested rounding where order matters.
      # monthly = round_half_up(base_compensation_cents * GAP_RATE_PER_MONTH)   [round per-month first]
      # gap_premium_cents = monthly * GAP_MONTHS                                 [then multiply by months]
      # Pinned order: round the monthly figure BEFORE multiplying by GAP_MONTHS.
      # (sum-then-round would differ by up to GAP_MONTHS-1 cents.)
      monthly = round_half_up(GestationalCarrier.base_compensation_cents * GAP_RATE_PER_MONTH)
      gap_premium_cents = monthly * GAP_MONTHS
    input_set: "the carrier linked to this InsuranceReview via carrier_id"
    constants:
      GAP_RATE_PER_MONTH: 0.015
      GAP_MONTHS: 9
    precision: "integer cents; round_half_up the per-month figure, THEN multiply (nested rounding order pinned)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "target resource is in a valid state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: business_safety
    check: "psychological clearance required: Match cannot ACCEPT unless all party intake_status == CLEARED; cannot PSYCH_CLEAR unless psych_clearance == PASSED on IP and carrier"
    error_id: ERR_PSYCH_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /matches/{id}/accept, POST /matches/{id}/psych-clear"
  - priority: 6
    category: business_safety
    check: "segregation of duties: the FinanceOfficer releasing a disbursement must not equal the CaseManager (X-User-ID) who approved it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /journeys/{id}/disbursements/{did}/release"
  - priority: 7
    category: business_referential
    check: "carrier eligibility: prior_deliveries >= 1 to submit; donor_code unique among non-terminal donors"
    error_id: ERR_CARRIER_INELIGIBLE
    http_status: 422
    applies_to: "POST /carriers/{id}/submit"
  - priority: 8
    category: business_referential
    check: "carrier clearance requires an existing InsuranceReview with status IN {APPROVED, GAP_IDENTIFIED}"
    error_id: ERR_INSURANCE_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /carriers/{id}/clear"
  - priority: 9
    category: business_referential
    check: "legal parentage: pre-birth parentage order cannot be FILED when IntendedParent.state_code IN PARENTAGE_HOSTILE {LA, NE}"
    error_id: ERR_PARENTAGE_JURISDICTION_BLOCKED
    http_status: 422
    applies_to: "POST /journeys/{id}/parentage/file"
  - priority: 10
    category: business_temporal
    check: "cooling-off: carrier-sign only after current clock time >= ip_signed_at + cooling_off_days"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 422
    applies_to: "POST /contracts/{id}/carrier-sign"
  - priority: 11
    category: business_temporal
    check: "milestone ordering: HEARTBEAT requires ACHIEVED EMBRYO_TRANSFER; BIRTH requires ACHIEVED HEARTBEAT"
    error_id: ERR_MILESTONE_ORDER_VIOLATION
    http_status: 422
    applies_to: "POST /journeys/{id}/milestones/{mid}/achieve"
  - priority: 12
    category: business_constraint
    check: "milestone type uniqueness: at most one Milestone of each milestone_type per journey"
    error_id: ERR_DUPLICATE_MILESTONE
    http_status: 409
    applies_to: "POST /journeys/{id}/milestones"
  - priority: 13
    category: business_fiscal
    check: "escrow budget cap: deposited_cents + amount <= IntendedParent.budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /escrow-accounts/{id}/deposit"
  - priority: 14
    category: business_fiscal
    check: "escrow sufficiency: Disbursement amount_cents <= EscrowAccount.available_cents at approve"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 422
    applies_to: "POST /journeys/{id}/disbursements/{did}/approve"
  - priority: 15
    category: state
    check: "OCC: expected_<parent>_version must equal current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /matches/{id}/accept, POST /matches/{id}/counter, POST /matches/{id}/re-propose, POST /escrow-accounts/{id}/deposit"
  - priority: 16
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, integer cents >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

