        grounds:
          - state_machines.DistributionDeal.EXECUTED_to_TERMINATION_NOTICE
          - state_machines.Release.RELEASED_to_REVERSION_PENDING
          - state_machines.ArtistAgreement.ACTIVE_to_POST_TERM
          - state_machines.ArtistStatement.PREPARED_to_VOIDED
          - entities.DistributionDeal.fields.post_term_collection_end_date
          - endpoints[POST /distribution-deals/{id}/terminate]
        distinguishing_aspect: |
          Depth-3 chain rooted at a DEAL termination: hop 1 moves the releases, hop 2 moves only the
          agreements whose release moved in hop 1, hop 3 voids only the statements whose agreement moved
          in hop 2. Every hop is caused by the previous one, and the propagated payload
