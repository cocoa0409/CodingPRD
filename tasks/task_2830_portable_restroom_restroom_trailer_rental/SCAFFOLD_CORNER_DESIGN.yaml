          rationale: "That §1.8 instance triggers ERR_SITE_POSTURE_BLOCKED and ERR_ACCOUNT_BILLING_HOLD both jointly and in isolation, so the violation -> error mapping for those two rules is already asserted; the remaining rules get their own §1.9 instances below."

      - name: schedule_at_exactly_route_capacity_passes_and_the_next_unit_is_refused
