# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe for
# task_2903_student_athlete_academic_support_eligibility_certification
#
# Walks references/claim-extraction-guide.md section by section against §1.1-§1.7
# of SCAFFOLD.yaml. Instances already carried by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# appear as excluded_because stubs citing the §1.8 instance by name.
# Every name here is unique across BOTH design files.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Guide section 1 - Entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_term_returns_created_envelope
        claim_type: creation
        grounds:
          - entities.Term.fields.code
          - entities.Term.fields.apr_status
          - entities.Term.fields.squad_apr
        distinguishing_aspect: "POST /athletics/terms with every required field returns 201, the success envelope (meta.api_request_id, response_type object, data), and the declared computed defaults apr_status OPEN / apr_points_possible 0 / squad_apr null."
        test_recipe:
          setup:
            - "The database is empty and the logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
          assert:
            - "The response is HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.code == 2026FA, data.term_index == 1, data.term_type == FALL, data.catalog_year == 2026"
            - "data.apr_status == OPEN, data.apr_points_possible == 0, data.apr_points_earned == 0 and data.squad_apr is null"
            - "data.id, data.created_at and data.updated_at are server-generated and data.version == 1"

      - name: get_degree_program_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.DegreeProgram.fields.code
          - entities.DegreeProgram.fields.total_required_credits
        distinguishing_aspect: "GET /athletics/degree-programs/{degree_program_id} returns exactly the row POST created, field for field, with no recomputation."
        test_recipe:
          setup:
            - "One DegreeProgram BSKINE (catalog_year 2026, total_required_credits 60.00) exists."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/degree-programs"
              payload: { code: "BSKINE", name: "BS Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /athletics/degree-programs/${prog_id}"
              payload: {}
              as: AcademicAdvisor
          assert:
            - "The response is HTTP 200 with data.id == ${prog_id}"
            - "data.code == BSKINE, data.name == BS Kinesiology, data.catalog_year == 2026, data.total_required_credits == 60.00"
            - "data.min_progress_gpa == 2.0, data.major_declaration_deadline_term_count == 4 and data.max_elective_credits_countable == 12.00"
            - "data.version == 1"

      - name: list_enrollments_paginates_with_limit_and_offset
        claim_type: listing
        grounds:
          - entities.Enrollment.fields.student_athlete_id
          - entities.Enrollment.fields.term_id
        distinguishing_aspect: "GET /athletics/enrollments with student_athlete_id + limit 2 + offset 0 returns total_count 3 with has_more true and exactly 2 rows in created_at ASC order; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Student S30 holds three ENROLLED enrollments in 2026FA, created in the order KINE-101, HIST-210, SOCI-150."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 4.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "HIST", course_number: "210", title: "Modern World History", credit_hours: 4.00, instructor_user_id: "instr_hist_1" }
              as: Registrar
              captures: { hist_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 4.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirty", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s30_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s30_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e30a_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s30_id}", course_id: "${hist_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e30b_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s30_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e30c_id: $.data.id }
          trigger:
            - call: "GET /athletics/enrollments"
              payload: { student_athlete_id: "${s30_id}", limit: 2, offset: 0 }
              as: AcademicAdvisor
            - call: "GET /athletics/enrollments"
              payload: { student_athlete_id: "${s30_id}", limit: 2, offset: 2 }
              as: AcademicAdvisor
          assert:
            - "The first call is HTTP 200 with response_type == \"array\", total_count == 3, has_more == true and exactly 2 data rows"
            - "The first page rows are ${e30a_id} then ${e30b_id} - created_at ASC as declared on the list endpoint"
            - "The second call returns total_count == 3, has_more == false and exactly 1 data row, ${e30c_id}"
            - "Every returned row has status == ENROLLED and credit_source == RESIDENT"

      - name: get_tutor_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_TUTOR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /athletics/tutors/{tutor_id} for an id that was never created returns 404 with the entity-specific ERR_TUTOR_NOT_FOUND, not a generic 404."
        test_recipe:
          setup:
            - "No Tutor rows exist."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LearningSpecialist
          trigger:
            - call: "GET /athletics/tutors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LearningSpecialist
          assert:
            - "The response is HTTP 404 with response_type == \"error\" and data.error_id == ERR_TUTOR_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: create_enrollment_missing_required_term_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
          - entities.Enrollment.fields.term_id
        distinguishing_aspect: "term_id has source input with no default, so omitting it from POST /athletics/enrollments returns 400 ERR_INVALID_REQUEST and no Enrollment row is created."
        test_recipe:
          setup:
            - "Student S31 and course KINE-101 exist in term 2026FA."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirtyone", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s31_id: $.data.id }
          trigger:
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s31_id}", course_id: "${kine_id}" }
              as: Registrar
          assert:
            - "The response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /athletics/enrollments with student_athlete_id = ${s31_id} returns total_count == 0"

      - name: create_student_athlete_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
          - entities.StudentAthlete.fields.sport_code
        distinguishing_aspect: "sport_code is an enum field, so a value outside its declared constraint set is rejected at priority 5 with 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup:
            - "Term 2026FA exists; no StudentAthlete rows exist."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Bogus", sport_code: "CHESS", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
          assert:
            - "The response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /athletics/student-athletes returns total_count == 0"

      - name: create_term_omitted_optionals_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Term.fields.full_time_credit_minimum
          - entities.Term.fields.is_apr_reporting_term
        distinguishing_aspect: "Omitting full_time_credit_minimum and is_apr_reporting_term applies the declared defaults 12 and true rather than null."
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
          assert:
            - "The response is HTTP 201 with data.full_time_credit_minimum == 12 and data.is_apr_reporting_term == true"
            - "data.apr_status == OPEN and data.squad_apr is null"

      - name: new_enrollment_computed_fields_start_at_declared_defaults
        claim_type: computed_fields
        grounds:
          - entities.Enrollment.fields.status
          - entities.Enrollment.fields.earned_credit_hours
          - entities.Enrollment.fields.is_full_time_countable
        distinguishing_aspect: "A freshly created Enrollment carries the computed defaults status ENROLLED, grade null, grade_points null, earned_credit_hours 0.00, degree_applicable_credits_counted 0.00 and is_full_time_countable false - nothing is derived until an outcome is recorded."
        test_recipe:
          setup:
            - "Student S32 and course KINE-101 (12.00 credit hours) exist in the OPEN term 2026FA."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirtytwo", sport_code: "BASE", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s32_id: $.data.id }
          trigger:
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s32_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
          assert:
            - "The response is HTTP 201 with data.status == ENROLLED, data.credit_source == RESIDENT and data.credit_hours == 12.00 inherited from the course"
            - "data.grade is null, data.grade_points is null, data.earned_credit_hours == 0.00, data.degree_applicable_credits_counted == 0.00, data.is_full_time_countable == false and data.outcome_recorded_at is null"
            - "StudentAthlete.${s32_id}.cumulative_gpa == 0.00 and completed_full_time_terms == 0"

      - name: support_session_is_immutable_without_version_field
        claim_type: immutability
        grounds:
          - entities.SupportSession.fields.hours_credited
          - entities.SupportSession.fields.start_at
        distinguishing_aspect: "SupportSession declares common_fields false, so its rows expose id/created_at but no version field and §1.5 offers no status or update endpoint for them - the only writes are POST and reads."
        test_recipe:
          setup:
            - "Student S33 exists and 2026FA is OPEN; one STUDY_HALL session from 14:00:00Z to 15:30:00Z on 2026-09-14 is logged."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirtythree", sport_code: "BASE", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s33_id: $.data.id }
          trigger:
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s33_id}", session_type: "STUDY_HALL", start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:30:00Z" }
              as: LearningSpecialist
              captures: { sess33_id: $.data.id }
          assert:
            - "The response is HTTP 201 with data.hours_credited == 1.50 and data.term_index_of_record == 1"
            - "The response data has no version key and GET /athletics/support-sessions/${sess33_id} also returns no version key"
            - "data.logged_by_user_id records the X-User-ID of the LearningSpecialist that logged it"

      - name: create_tutor_assignment_unknown_enrollment_returns_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - validations[priority=4]
          - entities.TutorAssignment.fields.enrollment_id
        distinguishing_aspect: "Body FKs are existence-checked in the endpoint's declared input order, so a valid tutor_id with a non-existent enrollment_id returns 404 ERR_ENROLLMENT_NOT_FOUND - the graph topology's cross-reference integrity check - and never reaches the priority-11 training rule."
        test_recipe:
          setup:
            - "Tutor T33 exists with status TRAINED in 2026FA; no Enrollment rows exist."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tomas Ghost", subject_codes: ["SOCI"] }
              as: LearningSpecialist
              captures: { t33_id: $.data.id }
            - call: "POST /athletics/tutors/${t33_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
          trigger:
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t33_id}", enrollment_id: "00000000-0000-0000-0000-000000000000", weekly_hours: 2.00 }
              as: LearningSpecialist
          assert:
            - "The response is HTTP 404 with data.error_id == ERR_ENROLLMENT_NOT_FOUND"
            - "data.error_id is not ERR_TUTOR_NOT_TRAINED and not ERR_TUTOR_SUBJECT_MISMATCH: the priority-4 existence check outranks both"
            - "Tutor.${t33_id}.assigned_weekly_hours == 0.00 and GET /athletics/tutor-assignments with tutor_id = ${t33_id} returns total_count == 0"

  # ---------------------------------------------------------------------------
  # Guide section 2 - State Machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_travel_moves_event_to_travel_approved
        claim_type: valid_transition
        grounds:
          - state_machines.CompetitionEvent.transitions.SCHEDULED_to_TRAVEL_APPROVED
          - entities.CompetitionEvent.fields.status
        distinguishing_aspect: "APPROVE_TRAVEL on a SCHEDULED event whose Term is OPEN returns 200 and moves status to TRAVEL_APPROVED while charged_units_total stays 0.00 because no request exists yet."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN and CompetitionEvent EV34 (REGULAR_SEASON) is SCHEDULED for 2026-09-14T08:00:00Z to 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AthleticsOperations
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-15T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev34_id: $.data.id }
          trigger:
            - call: "POST /athletics/competition-events/${ev34_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
          assert:
            - "The response is HTTP 200 with data.status == TRAVEL_APPROVED"
            - "data.missed_class_unit_multiplier == 1.0 for event_type REGULAR_SEASON and data.charged_units_total == 0.00"
            - "data.version == 2 because the transition is a write on the event"

      - name: notify_instructor_six_days_ahead_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MissedClassRequest.transitions.DRAFT_to_PENDING_ACKNOWLEDGEMENT
          - errors[ERR_NOTIFICATION_LEAD_TIME_VIOLATION]
          - validations[priority=13]
        distinguishing_aspect: "The DRAFT -> PENDING_ACKNOWLEDGEMENT precondition requires the clock to be at least NOTIFICATION_LEAD_DAYS (7) days before departure_at; at 6 days 23 hours the transition is refused with 422 ERR_NOTIFICATION_LEAD_TIME_VIOLATION and the request stays DRAFT."
        test_recipe:
          setup:
            - "SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 50 minutes and student S35 is ENROLLED in it."
            - "CompetitionEvent EV35 is TRAVEL_APPROVED with departure_at 2026-09-14T08:00:00Z, so the 7-day boundary instant is 2026-09-07T08:00:00Z."
            - "MissedClassRequest R35 was created while the clock was 2026-09-01T00:00:00Z and is in DRAFT; the clock is then moved to 2026-09-07T09:00:00Z, i.e. 6 days 23 hours before departure."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AcademicAdvisor
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 50 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirtyfive", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s35_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s35_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e35_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-15T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev35_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev35_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev35_id}", enrollment_id: "${e35_id}" }
              as: AcademicAdvisor
              captures: { r35_id: $.data.id }
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T09:00:00Z" }
              as: AcademicAdvisor
          trigger:
            - call: "POST /athletics/missed-class-requests/${r35_id}/status"
              payload: { action: "NOTIFY_INSTRUCTOR" }
              as: AcademicAdvisor
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_NOTIFICATION_LEAD_TIME_VIOLATION"
            - "MissedClassRequest.${r35_id}.status == DRAFT, notified_at is null and acknowledgement_deadline_at is null"
            - "MissedClassRequest.${r35_id}.missed_units == 0.83 is unchanged and StudentAthlete.${s35_id}.missed_class_units_charged == 0.83"

      - name: cancel_already_cancelled_request_returns_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.MissedClassRequest.transitions.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=9]
        distinguishing_aspect: "CANCELLED is a terminal state for MissedClassRequest, so a second CANCEL returns 409 ERR_INVALID_STATE_TRANSITION and does not re-credit the already-released units."
        test_recipe:
          setup:
            - "SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 50 minutes; student S36 is ENROLLED and EV36 is TRAVEL_APPROVED for 2026-09-14T08:00:00Z to 2026-09-15T00:00:00Z."
            - "Request R36 was created (missed_units 0.83) and then CANCELLED once, so the student is back to charged 0.00 and remaining 9.00."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AcademicAdvisor
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 50 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirtysix", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s36_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s36_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e36_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-15T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev36_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev36_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev36_id}", enrollment_id: "${e36_id}" }
              as: AcademicAdvisor
              captures: { r36_id: $.data.id }
            - call: "POST /athletics/missed-class-requests/${r36_id}/status"
              payload: { action: "CANCEL" }
              as: AcademicAdvisor
          trigger:
            - call: "POST /athletics/missed-class-requests/${r36_id}/status"
              payload: { action: "CANCEL" }
              as: AcademicAdvisor
          assert:
            - "The response is HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "MissedClassRequest.${r36_id}.status == CANCELLED (unchanged by the rejected call)"
            - "StudentAthlete.${s36_id}.missed_class_units_charged == 0.00 and missed_class_units_remaining == 9.00 - no double credit"
            - "CompetitionEvent.${ev36_id}.charged_units_total == 0.00"

      - name: new_certification_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.EligibilityCertification.transitions.DRAFT_to_SUBMITTED
          - entities.EligibilityCertification.fields.status
          - concurrency_rules[certification-create-stale-student]
        distinguishing_aspect: "A newly created EligibilityCertification is in the declared initial_state DRAFT with decided_by_user_id and decided_at null; the null-program INITIAL path evaluates the benchmark against PROVISIONAL_MIN_GPA (1.8) and reports FAIL for a student with cumulative_gpa 0.00."
        test_recipe:
          setup:
            - "Student S37 entered at term_index 1 with entry_catalog_year 2026, has declared no major and has no enrollments, so cumulative_gpa == 0.00."
            - "An INITIAL certification is legal with a null declared_program_id and Term 2026FA has term_index == entry_term_index == 1."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
