            - call: "POST /stop-loss/filings/${filing_id}/begin-review"
              payload: {}
              as: CarrierReviewer
            - call: "POST /stop-loss/filings/${filing_id}/approve"
              payload: { approved_amount_cents: 5000000 }
              as: CarrierReviewer
            - call: "POST /stop-loss/reimbursements"
              payload: { filing_id: "${filing_id}", received_amount_cents: 5000000, received_at: "2026-06-01T00:00:00Z" }
              as: PlanAccountant
              captures: { reimb_id: $.data.id }
            - call: "POST /stop-loss/reimbursements/${reimb_id}/post"
              payload: {}
              as: PlanAccountant
            - call: "POST /stop-loss/audits"
              payload: { filing_id: "${filing_id}", reason: "eligibility" }
              as: CarrierAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /stop-loss/audits/${audit_id}/issue-findings"
              payload: {}
              as: CarrierAuditor
          trigger:
            - call: "POST /stop-loss/audits/${audit_id}/resolve"
              payload: { adjustment_cents: -2000000 }
              as: PlanAdministrator
              as_user_id: "admin_y"
          assert:
            - "Filing.approved_amount_cents == 3000000 (5000000 - 2000000)"
            - "Reimbursement ${reimb_id} remains POSTED at 5000000 — the reimbursement record itself is not mutated by the audit"
