            - { call: "POST /lease-buyouts/deals", payload: { portfolio_id: "${pf_id}", lease_stream_id: "${ls_id}", valuation_id: "${val_id}", easement_type: "PERPETUAL_EASEMENT", revenue_share_bps: 2500 }, as: AcquisitionAnalyst, captures: { deal_id: $.data.id } }
            - { call: "POST /lease-buyouts/deals/${deal_id}/outreach", payload: {}, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/deals/${deal_id}/offers", payload: { offer_type: "LUMP_SUM", amount_cents: 36000000, expires_at: "2026-09-30T00:00:00Z" }, as: AcquisitionAnalyst, captures: { offer_id: $.data.id } }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "SEND" }, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "ACCEPT" }, as: Landowner, as_user_id: "${lo_id}" }
          trigger:
            - { call: "GET /lease-buyouts/portfolios/${pf_id}", payload: {}, as: PortfolioManager, captures: { avail_mid: $.data.available_capital_cents, committed_mid: $.data.committed_capital_cents, total_mid: $.data.total_capital_cents } }
