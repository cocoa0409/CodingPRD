          - entities.LetterOfIntent.fields.exclusivity_status
        distinguishing_aspect: |
          The letter carries two independent dimensions on one row. At clock
          2026-09-30 the exclusivity window (which closed 2026-09-29) has elapsed, so
          dimension B must move ACTIVE -> EXPIRED while dimension A stays EXECUTED and
          the deal stays in DILIGENCE. The sweep must report the letter in
          expired_exclusivity_letter_of_intent_ids and NOT in
          lapsed_letter_of_intent_ids: an EXECUTED letter can never lapse, so an
          implementation that keys the sweep off expires_at alone puts the id in the
          wrong list and destroys the executed agreement.
