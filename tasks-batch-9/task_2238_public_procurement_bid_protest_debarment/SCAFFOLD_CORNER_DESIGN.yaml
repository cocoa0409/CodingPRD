            - "GET /procurement/bids?solicitation_id=${c_s30_id} returns total_count 0 and Solicitation.${c_s30_id}.version == ${c_s30_v} (unchanged)"

      - name: corner_repeated_aggravating_factor_code_is_rejected
        claim_type: Triggerability
        grounds:
          - validations[priority=4]
          - errors[ERR_DUPLICATE_FACTOR_CODE]
          - calculations.debarment_severity_score
        distinguishing_aspect: "A repeated member in aggravating_factor_codes is rejected at priority 4 with HTTP 422 ERR_DUPLICATE_FACTOR_CODE rather than being silently deduplicated or double-counted into aggravating_total_points (which would read 80 instead of 40)."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one ELIGIBLE Vendor"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Ivyhurst Contracting", tax_id: "100000063", contact_email: "v63@example.gov" }
