        distinguishing_aspect: |
          Trigger: dispute resolve (third distinct trigger). Depth-4 chain: Dispute
          MEDIATION->RESOLVED_DISMISSED -> linked SittingAssignment DISPUTED->SETTLED
          (caused by the dispute resolution) -> settlement posts paired
          SIT_EARNED/SIT_SPENT ledger entries and recomputes both members'
          credit_balance_hours -> sitter provisional_credit_hours reversed and
          reliability_score +2 (caused by the settlement, not by the resolve call).
        test_recipe:
          setup:
            - "Founders VETTED (F3 mediator); F1 owns pet; canonical sit completed to COMPLETED_PENDING_REVIEW"
            - "F1 opened SITTING_QUALITY dispute against F2 with sitting_assignment_id -> assignment DISPUTED; F3 assigned mediator"
          setup_api_calls:
