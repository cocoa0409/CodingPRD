              captures: { p3_id: $.data.id }
          trigger:
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s2_id}", to_store_id: "${s1_id}", item_id: "${item_id}", units: 6, expected_from_position_version: "${p2_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { t1_id: $.data.id }
          assert:
            - "TransferRecommendation.${t1_id}.size_split == [{S:4},{XL:2}] (only CORE sizes the receiver is out of and the donor holds)"
            - "TransferRecommendation.${t1_id}.benefit_usd == 78.30, NOT 78.29 (unit margin 36.50 x 0.55 x 0.65 = 13.04875; S line 4 x 13.04875 = 52.195 -> 52.20, XL line 2 x 13.04875 = 26.0975 -> 26.10)"
            - "TransferRecommendation.${t1_id}.benefit_ratio_bp == 15536 (78.30 / 50.40 x 10000 = 15535.71 -> 15536); the sum-then-round variant would report 15534"
            - "The RECEIVING store 0101 sell-through 6500 was used, not the donor 0102 sell-through 5800 (which would give 69.87)"
      - name: landed_cost_handling_tier_keyed_on_freight_not_on_landed_total
