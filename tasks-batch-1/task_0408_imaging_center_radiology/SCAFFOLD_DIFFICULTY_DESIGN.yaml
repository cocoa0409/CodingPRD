              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam1_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            # 11 ACCEPTED series (representative — author records 11 capture+finalize pairs)
            - call: "POST /imaging-exams/${exam1_id}/image-series"
