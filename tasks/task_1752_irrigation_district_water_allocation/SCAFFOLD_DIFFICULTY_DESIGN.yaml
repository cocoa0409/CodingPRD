  # ===========================================================================
  # Rule 6 — boundary_precision_check on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: order_quantity_exactly_equals_available
        grounds:
          - validations[priority=10]
          - calculations.available_balance
          - calculations.order_quantity
          - errors[ERR_INSUFFICIENT_ALLOCATION]
        distinguishing_aspect: |
          Water-volume boundary on POST /district/turnout-orders: requested
          quantity exactly equal to available_af (4.13 == 4.13) is APPROVED
          (inclusive >=), while a follow-up request of 0.08 af against the
          remaining 0.00 is rejected with ERR_INSUFFICIENT_ALLOCATION.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 2.065 acres -> base entitlement exactly 4.13; available 4.13"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Edge E", parcel_number: "APN-012", irrigated_acres: 2.065, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach EB", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
          trigger:
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order1_id: "$.data.id", order1_qty: "$.data.requested_quantity_af" }
            - call: "GET /district/water-accounts/${acct_id}"
              as: DistrictAdmin
              captures: { acct_v2: "$.data.version" }
            - call: "GET /district/season-allocations/${alloc_id}"
              as: DistrictAdmin
              captures: { avail_after: "$.data.available_af" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 1.0, requested_start_at: "2026-06-02T08:00:00Z", requested_end_at: "2026-06-02T09:00:00Z", expected_water_account_version: "${acct_v2}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "First create succeeds (201): TurnoutOrder.${order1_id}.requested_quantity_af == 4.13 (5 cfs x 10 h x 0.0826), exactly equal to available"
            - "SeasonAllocation.${alloc_id}.available_af == 0.00 after the boundary-equal order"
            - "Second create (0.08 af) is rejected with ERR_INSUFFICIENT_ALLOCATION (422)"

      - name: delinquency_grace_exact_boundary
        grounds:
          - calculations.delinquency_determination
          - errors[ERR_INVALID_INVOICE_STATE]
          - entities.AssessmentInvoice.fields.due_date
        distinguishing_aspect: |
          Time-metric boundary on POST
          /district/seasons/{id}/run-delinquency-sweep: at clock == due_date +
          GRACE_DAYS exactly the invoice stays ISSUED (strict >), and one second
          later the same sweep flips it to DELINQUENT — a different metric (time)
          and endpoint than the water-volume boundary.
        test_recipe:
          setup:
            - "Season PER_ACRE rate 25.00; account 10.0 acres -> invoice total 250.00; ISSUED with due_date 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Grace G", parcel_number: "APN-013", irrigated_acres: 10.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
            - call: "POST /district/assessment-invoices/${inv_id}/issue"
              payload: { due_date: "2026-08-10T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /district/seasons/${season_id}/run-delinquency-sweep"
              payload: {}
              as: DistrictAdmin
              captures: { swept_at_boundary: "$.data.swept_count" }
            - call: "GET /district/assessment-invoices/${inv_id}"
              as: DistrictAdmin
              captures: { status_at_boundary: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:01Z" }
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/run-delinquency-sweep"
              payload: {}
              as: DistrictAdmin
              captures: { swept_after: "$.data.swept_count" }
            - call: "GET /district/assessment-invoices/${inv_id}"
              as: DistrictAdmin
              captures: { status_after: "$.data.status", total_after: "$.data.total_amount" }
          assert:
            - "At clock == due_date + 10 days exactly: swept_count == 0 and invoice status == ISSUED (strict-greater rule)"
            - "At clock == due_date + 10 days + 1 second: swept_count == 1 and invoice status == DELINQUENT"
            - "After flip: total_amount == 275.00 (250.00 + 25.00 penalty)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_schedule_blocked_by_suspended_account
        grounds:
          - state_machines.TurnoutOrder.REQUESTED_to_SCHEDULED
          - state_machines.WaterAccount.ACTIVE_to_SUSPENDED
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair TurnoutOrder -> WaterAccount: an order that was validly
          REQUESTED cannot be SCHEDULED once its WaterAccount is SUSPENDED by a
          lien; the gate lives on the account's state, not the order's.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 5.0 acres -> entitlement 10.00; order REQUESTED (4.13 af)"
            - "Invoice issued, swept DELINQUENT, lien filed -> account SUSPENDED"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Gate G", parcel_number: "APN-014", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach XE", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
            - call: "POST /district/assessment-invoices/${inv_id}/issue"
              payload: { due_date: "2026-08-05T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/run-delinquency-sweep"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/assessment-invoices/${inv_id}/file-lien"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_ACTIVE (409): scheduling is gated by WaterAccount.status, not by the order's own state"
            - "TurnoutOrder.${order_id}.status remains REQUESTED"

      - name: transfer_blocked_by_effective_drought
        grounds:
          - state_machines.TransferRequest.transitions
          - state_machines.DroughtDeclaration.PROPOSED_to_EFFECTIVE
          - validations[priority=7]
          - errors[ERR_TRANSFER_BLOCKED_DROUGHT]
        distinguishing_aspect: |
          Entity pair TransferRequest -> DroughtDeclaration: with an EFFECTIVE
          declaration on the season, creating a transfer between two ACTIVE,
          sufficiently-funded accounts is rejected with
          ERR_TRANSFER_BLOCKED_DROUGHT — the gate depends solely on the drought
          entity's state, a different pair than TurnoutOrder -> WaterAccount.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account A 5.0 acres SENIOR -> 10.00; account B 5.0 acres JUNIOR (1922-05-01) -> 10.00 curtailed to 8.50"
            - "STAGE_1 drought EFFECTIVE on the season (no orders, so no cascade cancellations)"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Senior S", parcel_number: "APN-015", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_a: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Junior J", parcel_number: "APN-016", irrigated_acres: 5.0, water_right_priority_date: "1922-05-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_b: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_a}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_a: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_b}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_b: "$.data.id" }
            - call: "POST /district/drought-declarations"
              payload: { season_id: "${season_id}", stage: "STAGE_1" }
              as: DistrictAdmin
              captures: { drought_id: "$.data.id" }
            - call: "POST /district/drought-declarations/${drought_id}/effectuate"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/season-allocations/${alloc_a}"
              as: DistrictAdmin
              captures: { alloc_a_v: "$.data.version" }
          trigger:
            - call: "POST /district/transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", season_id: "${season_id}", quantity_af: 1.0, expected_source_allocation_version: "${alloc_a_v}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_TRANSFER_BLOCKED_DROUGHT (409) even though both accounts are ACTIVE and the 1.00 af balance check would pass"
            - "GET /district/transfer-requests?from_account_id=${acct_a} returns an empty list (no transfer persisted)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap with different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_window_half_open_adjacency
        grounds:
          - calculations.window_overlap_check
          - errors[ERR_WINDOW_OVERLAP]
          - state_machines.MaintenanceWindow
        distinguishing_aspect: |
          Resource CanalReach with half-open exclusion semantics: a window
          starting exactly when another ends (14:00 == 14:00) is adjacent, not
          overlapping, and is accepted; a window overlapping by one hour is
          rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Reach exists; window1 PLANNED [2026-08-10T08:00, 2026-08-10T14:00)"
          setup_api_calls:
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach WO", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/maintenance-windows"
              payload: { canal_reach_id: "${reach_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T14:00:00Z", reason: "morning crew" }
              as: DistrictAdmin
              captures: { win1: "$.data.id" }
          trigger:
            - call: "POST /district/maintenance-windows"
              payload: { canal_reach_id: "${reach_id}", start_at: "2026-08-10T14:00:00Z", end_at: "2026-08-10T18:00:00Z", reason: "afternoon crew" }
              as: DistrictAdmin
              captures: { win2: "$.data.id" }
            - call: "POST /district/maintenance-windows"
              payload: { canal_reach_id: "${reach_id}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T15:00:00Z", reason: "overlapping crew" }
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Adjacent window [14:00, 18:00) is created (201) — half-open adjacency is not an overlap"
            - "Overlapping window [13:00, 15:00) is rejected with ERR_WINDOW_OVERLAP (422)"
            - "MaintenanceWindow.${win1}.status remains PLANNED (rejection has no side effects)"

      - name: account_order_turnaround_buffer
        grounds:
          - calculations.turnaround_gap_check
          - errors[ERR_ORDER_TURNAROUND_CONFLICT]
          - state_machines.TurnoutOrder
        distinguishing_aspect: |
          Resource WaterAccount with buffered-gap semantics (different entity and
          different interval arithmetic than the half-open reach rule): a second
          order starting 5 hours after the first ends violates the 6-hour
          turnaround (ERR_ORDER_TURNAROUND_CONFLICT), while exactly 6 hours is
          allowed (inclusive >= boundary).
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 10.0 acres SENIOR -> entitlement 20.00; reach capacity 50 cfs"
            - "Order1 REQUESTED [2026-08-12T06:00, 2026-08-12T10:00) at 5 cfs (1.65 af)"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Turn T", parcel_number: "APN-017", irrigated_acres: 10.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach TB", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-08-12T06:00:00Z", requested_end_at: "2026-08-12T10:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order1_id: "$.data.id" }
            - call: "GET /district/water-accounts/${acct_id}"
              as: DistrictAdmin
              captures: { acct_v2: "$.data.version" }
          trigger:
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-08-12T15:00:00Z", requested_end_at: "2026-08-12T18:00:00Z", expected_water_account_version: "${acct_v2}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-08-12T16:00:00Z", requested_end_at: "2026-08-12T19:00:00Z", expected_water_account_version: "${acct_v2}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order3_id: "$.data.id" }
          assert:
            - "Order starting 5h after order1 ends (gap 5h < 6h) is rejected with ERR_ORDER_TURNAROUND_CONFLICT (422)"
            - "Order starting exactly 6h after order1 ends is created (201) — the gap boundary is inclusive"
            - "SeasonAllocation.${alloc_id}.committed_af == 2.89 (1.65 + 1.24; the rejected order committed nothing)"

  # ===========================================================================
  # Rule 9 — compensating_invariant across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: committed_water_schedule_cancel_conservation
        grounds:
          - calculations.available_balance
          - state_machines.TurnoutOrder.SCHEDULED_to_CANCELLED
          - entities.SeasonAllocation.fields.committed_af
        distinguishing_aspect: |
          Conserved quantity = committed water: committed_af must equal the sum
          of requested_quantity_af over non-terminal orders at all times, so
          create (4.13) + schedule + cancel leaves committed_af == 0.00 and
          available_af == 10.00, exactly the pre-create values — no drift.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 5.0 acres SENIOR -> entitlement 10.00; reach capacity 50"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Conserve C", parcel_number: "APN-018", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach CC", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
          trigger:
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /district/season-allocations/${alloc_id}"
              as: DistrictAdmin
              captures: { committed_mid: "$.data.committed_af", available_mid: "$.data.available_af" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_id}"
              as: DistrictAdmin
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /district/turnout-orders/${order_id}/cancel"
              payload: {}
              as: WaterUser
              as_user_id: "${acct_id}"
            - call: "GET /district/season-allocations/${alloc_id}"
              as: DistrictAdmin
              captures: { committed_end: "$.data.committed_af", available_end: "$.data.available_af" }
            - call: "GET /district/rider-work-orders/${wo_id}"
              as: DistrictAdmin
              captures: { wo_status: "$.data.status" }
          assert:
            - "After create: committed_af == 4.13 and available_af == 5.87"
            - "After schedule + cancel (forward + compensating actions): committed_af == 0.00 and available_af == 10.00 — identical to pre-create"
            - "RiderWorkOrder.${wo_id}.status == CANCELLED (cascade cleaned the child)"
            - "TurnoutOrder.${order_id}.status == CANCELLED"

      - name: transfer_post_and_reverse_volume_conservation
        grounds:
          - state_machines.TransferRequest.APPROVED_to_POSTED
          - entities.SeasonAllocation.fields.transfers_in_af
          - entities.SeasonAllocation.fields.transfers_out_af
        distinguishing_aspect: |
          Conserved quantity = district-wide net transferred volume (sum of
          transfers_in minus sum of transfers_out == 0): posting 3.00 af A->B
          then the compensating 3.00 af B->A returns both accounts' available_af
          to their initial values (10.00 and 2.00) — a different conserved
          quantity than committed water.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account A 5.0 acres SENIOR -> 10.00 available; account B 1.0 acre SENIOR -> 2.00 available"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Alpha A", parcel_number: "APN-019", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_a: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Beta B", parcel_number: "APN-020", irrigated_acres: 1.0, water_right_priority_date: "1890-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_b: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_a}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_a: "$.data.id", alloc_a_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_b}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_b: "$.data.id", alloc_b_v: "$.data.version" }
          trigger:
            - call: "POST /district/transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", season_id: "${season_id}", quantity_af: 3.0, expected_source_allocation_version: "${alloc_a_v}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { t1: "$.data.id" }
            - call: "POST /district/transfer-requests/${t1}/approve"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/transfer-requests/${t1}/post"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/season-allocations/${alloc_a}"
              as: DistrictAdmin
              captures: { a_avail_mid: "$.data.available_af", a_out_mid: "$.data.transfers_out_af" }
            - call: "GET /district/season-allocations/${alloc_b}"
              as: DistrictAdmin
              captures: { b_avail_mid: "$.data.available_af", b_in_mid: "$.data.transfers_in_af", alloc_b_v2: "$.data.version" }
            - call: "POST /district/transfer-requests"
              payload: { from_account_id: "${acct_b}", to_account_id: "${acct_a}", season_id: "${season_id}", quantity_af: 3.0, expected_source_allocation_version: "${alloc_b_v2}" }
              as: WaterUser
              as_user_id: "${acct_b}"
              captures: { t2: "$.data.id" }
            - call: "POST /district/transfer-requests/${t2}/approve"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/transfer-requests/${t2}/post"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/season-allocations/${alloc_a}"
              as: DistrictAdmin
              captures: { a_avail_end: "$.data.available_af", a_in_end: "$.data.transfers_in_af", a_out_end: "$.data.transfers_out_af" }
            - call: "GET /district/season-allocations/${alloc_b}"
              as: DistrictAdmin
              captures: { b_avail_end: "$.data.available_af", b_in_end: "$.data.transfers_in_af", b_out_end: "$.data.transfers_out_af" }
          assert:
            - "After A->B post: A.available_af == 7.00 (transfers_out 3.00) and B.available_af == 5.00 (transfers_in 3.00)"
            - "After compensating B->A post: A.available_af == 10.00 and B.available_af == 2.00 — both restored to initial values"
            - "District invariant holds: (A.transfers_in 3.00 + B.transfers_in 3.00) - (A.transfers_out 3.00 + B.transfers_out 3.00) == 0 at every step"
            - "A.available_af + B.available_af == 12.00 after each posting (no volume created or destroyed)"
