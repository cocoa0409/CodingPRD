  # ==========================================================================
  - section: errors
    instances:
      # Catalog cross-check: every §1.6 error_id is asserted by at least one
      # instance in this file or in §1.8. Mapping (error_id -> covering instance):
      #   ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER -> missing_user_context_header_rejected (this file)
      #   ERR_FORBIDDEN_ROLE -> forbidden_role_on_exclusive_endpoint, role_check_precedes_existence_check (this file)
      #   ERR_INVALID_REQUEST -> model_registration_missing_required_field_rejected, model_registration_invalid_enum_rejected, engagement_with_no_scope_selected_rejected, engagement_period_end_not_after_start_rejected (this file)
      #   ERR_NOT_FOUND -> model_get_unknown_id_returns_not_found, nested_child_creation_under_wrong_parent_returns_not_found, retire_with_unknown_replacement_returns_not_found, not_found_checked_before_occ (this file)
      #   ERR_STALE_VERSION -> occ_stale_version_rejected, stale_version_checked_before_state_rules (this file)
      #   ERR_NOT_MODEL_OWNER -> ownership_check_blocks_non_owner_documentation (this file), breach_event_resolve_requires_owner (rbac section)
      #   ERR_SOD_VALIDATION_INDEPENDENCE -> sod_validator_independence_blocks_owner_validator (this file)
      #   ERR_SOD_DOCUMENTATION_APPROVAL -> sod_documentation_approval_blocks_submitter_deciding (this file)
      #   ERR_MODEL_ALREADY_RETIRED -> child_creation_on_retired_model_returns_already_retired (this file); §1.8 engagement_create_state_beats_window_overlap
      #   ERR_MODEL_NOT_APPROVABLE -> approve_on_approved_model_returns_not_approvable (this file)
      #   ERR_MODEL_NOT_APPROVED_FOR_USE -> metric_creation_on_registered_model_returns_not_approved_for_use (this file)
      #   ERR_MODEL_NOT_RETIRABLE -> retire_terminal_lockdown_blocks_further_transitions (this file)
      #   ERR_DOCUMENTATION_NOT_SUBMITTED -> documentation_decide_twice_returns_not_submitted (this file)
      #   ERR_CHANGE_REQUEST_ALREADY_DECIDED -> change_request_decide_twice_returns_already_decided (this file)
      #   ERR_ENGAGEMENT_NOT_IN_TESTING -> engagement_complete_twice_returns_not_in_testing (this file)
      #   ERR_ENGAGEMENT_NOT_COMPLETED -> engagement_reopen_from_testing_returns_not_completed (this file)
      #   ERR_FINDING_NOT_CLOSABLE -> finding_close_from_closed_returns_not_closable (this file)
      #   ERR_FINDING_NOT_OPEN -> finding_reopen_from_open_returns_not_open (this file)
      #   ERR_BREACH_EVENT_ALREADY_RESOLVED -> breach_event_resolve_twice_returns_already_resolved (this file)
      #   ERR_REPORT_ALREADY_SUBMITTED -> report_submit_twice_returns_already_submitted (this file)
      #   ERR_METRIC_NOT_ACTIVE -> reading_on_paused_metric_returns_metric_not_active (this file)
      #   ERR_OPEN_CRITICAL_FINDINGS -> approve_blocked_by_open_critical_findings (this file)
      #   ERR_VENDOR_ASSESSMENT_NOT_CURRENT -> vendor_approval_requires_current_assessment_above_threshold (this file); §1.8 approve_vendor_gate_beats_validation_overdue
      #   ERR_VALIDATION_OVERDUE -> approve_blocked_by_validation_overdue (this file); §1.8 approve_vendor_gate_beats_validation_overdue
      #   ERR_NO_APPROVED_DOCUMENTATION -> approve_without_approved_documentation_rejected, engagement_creation_requires_approved_documentation, documentation_rejection_leaves_no_approved_doc (this file)
      #   ERR_NO_COMPLETED_VALIDATION -> §1.8 approve_requires_completed_engagement_on_model
      #   ERR_RETEST_REQUIRED -> high_finding_close_requires_later_completed_retest (this file)
      #   ERR_REPLACEMENT_MODEL_NOT_APPROVED -> §1.8 retire_requires_replacement_model_approved
      #   ERR_SELF_REPLACEMENT -> retire_self_replacement_rejected (this file)
      #   ERR_VALIDATION_WINDOW_OVERLAP -> §1.8 engagement_windows_half_open_adjacency_allowed
      #   ERR_REPORT_PERIOD_OVERLAP -> §1.8 report_periods_closed_interval_adjacency_conflicts
      #   ERR_READING_OUT_OF_ORDER -> reading_out_of_order_rejected (this file)
      #   ERR_NOT_A_VENDOR_MODEL -> model_is_vendor_model_default_false, assessment_on_non_vendor_model_rejected (this file)
      #   ERR_DOCUMENTATION_INCOMPLETE -> documentation_missing_evidence_flag_rejected (this file)
      # No additional executable instances are required in this section: the
      # guide's errors row is a triggerability cross-check, satisfied above.
      - name: error_catalog_fully_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_COMPLETED_VALIDATION]"
        distinguishing_aspect: "Spot-check that the error catalog is triggerable end-to-end: approving a model with APPROVED documentation but zero engagements yields ERR_NO_COMPLETED_VALIDATION (the only catalog error not otherwise exercised as a primary assert in this file's setup-light paths beyond §1.8)."
