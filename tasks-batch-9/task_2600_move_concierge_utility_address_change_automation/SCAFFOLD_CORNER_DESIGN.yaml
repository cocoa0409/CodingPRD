      - name: saga_move_cancellation_compensates_every_completed_leg_in_one_call
        claim_type: saga_compensation
        grounds:
          - complexity_profile.consistency_model
          - state_machines.MoveRecord.NON_TERMINAL_to_CANCELLED
          - "endpoints[POST /moves/{id}/cancellation]"
        distinguishing_aspect: |
          The saga's single global compensation, asserted with all five legs still open and
          each in a different position: a scheduled water order, a draft electric order with an open
          credit handoff, a submitted USPS filing, and an accepted referral placement. One request
          must unwind all of them into their four distinct compensated states (CANCELLED, VOIDED,
          CANCELLED, VOIDED) while a sixth leg that is already terminal is left untouched, so an
          implementation that compensates only the orders, or that reuses one terminal state for
          every child, is caught.
        test_recipe:
          setup:
            - "A move in SCHEDULING with every leg of the saga partially completed, plus one placement already declined before the cancellation."
