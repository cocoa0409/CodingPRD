  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: suspension_cascade_promotes_waitlisted_candidate
        grounds:
          - state_machines.Candidate.status_ACTIVE_to_SUSPENDED
          - state_machines.ExamRegistration.REGISTERED_to_CANCELLED
          - state_machines.ExamRegistration.WAITLISTED_to_REGISTERED
          - calculations.waitlist_promotion
          - calculations.refund_cents
        distinguishing_aspect: |
          Trigger = DisciplineBoard sanction (different from the syllabus-activation
          trigger of the sibling instance). Depth 4 chain, each link caused by the
          previous: sanction -> Candidate SUSPENDED -> A's registration CANCELLED
          with full refund -> freed seat on a REGISTRATION_OPEN window -> B's
          WAITLISTED registration promoted to REGISTERED with fee computed at
          promotion time.
        test_recipe:
          setup:
            - "Window P-2026-10 capacity 1; candA REGISTERED early (fee 30450); candB WAITLISTED; discipline case FILED against candA; clock at 2026-09-05"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 1, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "candA@example.com", full_name: "Cand A" }
              as: Anonymous
              captures: { candA_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "candB@example.com", full_name: "Cand B" }
              as: Anonymous
              captures: { candB_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
