            - "Corridor Sun Belt I-10 is ACTIVE with weather_profile HIGH_WIND and weather_risk_score 55."
            - "One run plan priced at posted_per_mile_cents 225, trailer_count 2, window_start_epoch_day 4 while the current epoch day is 5, so late_count is 1."
