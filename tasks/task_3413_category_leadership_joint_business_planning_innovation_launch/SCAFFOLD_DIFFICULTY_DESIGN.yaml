scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fund_accrual_basis_vs_cash_basis
        grounds:
          - calculations.fund_period_accrual
          - entities.TradeFund.fields.edlp_accrued_cents
          - entities.TradeFund.fields.edlp_cash_cents
        distinguishing_aspect: |
          Dual variant on the TradeFund (fiscal ledger domain): one posted period of
          invoiced sales produces TWO different balances for identical inputs —
          ACCRUAL_BASIS credits the full share, CASH_BASIS credits share * 0.92.
        test_recipe:
          setup:
            - "ACTIVATED plan (rate 4%, edlp split 60/40) with its TradeFund at zero balances"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY", "ECOMMERCE"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id "}
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id "}
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id "}
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "GET /jbp/funds?plan_id=${plan_id}"
              as: ManufacturerPlanner
              captures: { fund_id: "$.data[0].id "}
          trigger:
            - call: "POST /jbp/funds/${fund_id}/accruals"
              payload: { period: "2027-01", invoiced_sales_cents: 1000000 }
              as: FinanceAnalyst
          assert:
            - "TradeFund.${fund_id}.edlp_accrued_cents == 24000 (round_half_up(1000000*0.04)=40000; round_half_up(40000*0.6)=24000)"
            - "TradeFund.${fund_id}.event_accrued_cents == 16000 (remainder 40000-24000)"
            - "TradeFund.${fund_id}.edlp_cash_cents == 22080 (round_half_up(24000*0.92))"
            - "TradeFund.${fund_id}.event_cash_cents == 14720 (round_half_up(16000*0.92))"
            - "CASH_BASIS balances (22080/14720) are strictly below ACCRUAL_BASIS balances (24000/16000) for identical inputs"

      - name: launch_distribution_weighted_vs_committed
        grounds:
          - calculations.distribution_projection
          - entities.InnovationLaunch.fields.projected_distribution_weighted_pct
          - entities.InnovationLaunch.fields.projected_distribution_committed_pct
        distinguishing_aspect: |
          Dual variant on the InnovationLaunch (launch-planning domain — different
          entity domain than the TradeFund accrual): identical phase data yields
          COMMITTED_ONLY == 50.0 but WEIGHTED_PIPELINE == 53.75 because a PENDING
          phase contributes 0.25 weight in one variant and 0 in the other.
        test_recipe:
          setup:
            - "ACTIVATED plan; one launch with 4 phases patched to distribution targets 20/30/25/15; phases 1-2 GATE_PASSED, phase 3 GATE_FAILED, phase 4 PENDING"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY", "ECOMMERCE"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id "}
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id "}
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id "}
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "UltraTabs", pack_family: "tabs", launch_date: "2027-03-01T00:00:00Z", total_trade_budget_cents: 1000000 }
              as: ManufacturerPlanner
              captures: { lau_id: "$.data.id "}
            - call: "GET /jbp/launches/${lau_id}/phases"
              as: ManufacturerPlanner
              captures: { ph1: "$.data[0].id", ph2: "$.data[1].id", ph3: "$.data[2].id", ph4: "$.data[3].id "}
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph1}"
              payload: { distribution_target_pct: 20, capacity_cases: 500, trade_spend_cents: 100000 }
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph2}"
              payload: { distribution_target_pct: 30, capacity_cases: 400, trade_spend_cents: 50000 }
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph3}"
              payload: { distribution_target_pct: 25, capacity_cases: 300, trade_spend_cents: 40000 }
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph4}"
              payload: { distribution_target_pct: 15, capacity_cases: 200, trade_spend_cents: 10000 }
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph1}/evaluate"
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph2}/evaluate"
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph3}"
              payload: { distribution_target_pct: 0 }
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph3}/evaluate"
              as: ManufacturerPlanner
          trigger:
            - call: "GET /jbp/launches/${lau_id}"
              as: ManufacturerPlanner
          assert:
            - "phase statuses are GATE_PASSED, GATE_PASSED, GATE_FAILED, PENDING (phase 3 failed because distribution_target_pct == 0)"
            - "InnovationLaunch.${lau_id}.projected_distribution_committed_pct == 50.0 (20*1.0 + 30*1.0 + 25*0.0 + 15*0.0)"
            - "InnovationLaunch.${lau_id}.projected_distribution_weighted_pct == 53.75 (20*1.0 + 30*1.0 + 25*0.0 + 15*0.25)"
            - "the two variants disagree by exactly 3.75 for identical phase data"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_multi_input_threshold
        grounds:
          - calculations.delisting_risk_score
          - entities.PerformanceReview.fields.risk_score
        distinguishing_aspect: |
          Mode (a): a four-input weighted formula with clamps, a bias cap, a
          friction cap, and tiered posture thresholds — raw 52 lands in AT_RISK
          via the >= 50 tier while staying below the >= 75 tier.
        test_recipe:
          setup:
            - "ACTIVATED plan; PUBLISHED+COMMITTED forecast baseline 1000 committed 1300 (bias 30.0); 7 DISPUTED deductions; launch LAUNCHED on 2027-01-15; clock at 2027-04-09 (launch + REVIEW_MIN_DAYS_AFTER_LAUNCH)"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY", "ECOMMERCE"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id "}
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id "}
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id "}
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "GET /jbp/funds?plan_id=${plan_id}"
              as: ManufacturerPlanner
              captures: { fund_id: "$.data[0].id "}
            - call: "POST /jbp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jbp/plans/${plan_id}/forecasts"
              payload: { week_start: "2027-03-01T00:00:00Z", baseline_cases: 1000 }
              as: SupplyChainPlanner
              captures: { fc_id: "$.data.id "}
            - call: "POST /jbp/forecasts/${fc_id}/commit"
              payload: { committed_cases: 1300 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D1", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded1: "$.data.id "}
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D2", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded2: "$.data.id "}
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D3", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded3: "$.data.id "}
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D4", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded4: "$.data.id "}
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D5", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded5: "$.data.id "}
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D6", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded6: "$.data.id "}
            - call: "POST /jbp/funds/${fund_id}/deductions"
              payload: { claim_reference: "D7", bucket: "EDLP", amount_cents: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
              captures: { ded7: "$.data.id "}
            - call: "POST /jbp/deductions/${ded1}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/deductions/${ded2}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/deductions/${ded3}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/deductions/${ded4}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/deductions/${ded5}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/deductions/${ded6}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/deductions/${ded7}/resolve"
              payload: { action: "DISPUTE" }
              as: FinanceAnalyst
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "UltraTabs", pack_family: "tabs", launch_date: "2027-01-15T00:00:00Z", total_trade_budget_cents: 1000000 }
              as: ManufacturerPlanner
              captures: { lau_id: "$.data.id "}
            - call: "GET /jbp/launches/${lau_id}/phases"
              as: ManufacturerPlanner
              captures: { ph1: "$.data[0].id", ph2: "$.data[1].id", ph3: "$.data[2].id", ph4: "$.data[3].id "}
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph1}"
              payload: { distribution_target_pct: 10, capacity_cases: 100, trade_spend_cents: 1000 }
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph1}/evaluate"
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph2}"
              payload: { distribution_target_pct: 10, capacity_cases: 100, trade_spend_cents: 1000 }
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph2}/evaluate"
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph3}"
              payload: { distribution_target_pct: 10, capacity_cases: 100, trade_spend_cents: 1000 }
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph3}/evaluate"
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph4}"
              payload: { distribution_target_pct: 10, capacity_cases: 100, trade_spend_cents: 1000 }
              as: ManufacturerPlanner
            - call: "POST /jbp/launches/${lau_id}/phases/${ph4}/evaluate"
              as: ManufacturerPlanner
            - call: "POST /jbp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jbp/launches/${lau_id}/launch"
              as: ManufacturerPlanner
          trigger:
            - call: "POST /jbp/launches/${lau_id}/performance-reviews"
              payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z", actual_sales_cents: 600000, sales_target_cents: 1000000, target_distribution_pct: 90, distribution_achieved_pct: 70 }
              as: ManufacturerPlanner
              captures: { rev_id: "$.data.id "}
          assert:
            - "PerformanceReview.${rev_id}.sales_attainment_pct == 60.0"
            - "PerformanceReview.${rev_id}.forecast_bias_pct == 30.0"
            - "PerformanceReview.${rev_id}.friction_count == 7 (all seven DISPUTED deductions, created within the window)"
            - "PerformanceReview.${rev_id}.risk_score == 52 (0.4*40 + 0.3*20 + 0.2*min(30,25)*4 + 0.1*min(7,5)*20 = 16+6+20+10)"
            - "PerformanceReview.${rev_id}.risk_posture == AT_RISK (52 >= RISK_AT_RISK_MIN_SCORE 50 but < 75)"

      - name: fund_credit_rounding_per_period_then_sum
        grounds:
          - calculations.fund_period_accrual
        distinguishing_aspect: |
          Mode (b) — different mode than the weighted-formula instance: rounding
          ORDER is pinned (round each period's credit and bucket shares, then
          sum). Two periods chosen so per-period rounding (42788) and
          sum-then-round (42787) diverge by one cent.
        test_recipe:
          setup:
            - "ACTIVATED plan (rate 4%, split 60/40) with zeroed fund"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY", "ECOMMERCE"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id "}
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id "}
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id "}
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "GET /jbp/funds?plan_id=${plan_id}"
              as: ManufacturerPlanner
              captures: { fund_id: "$.data[0].id "}
          trigger:
            - call: "POST /jbp/funds/${fund_id}/accruals"
              payload: { period: "2027-01", invoiced_sales_cents: 1005033 }
              as: FinanceAnalyst
            - call: "POST /jbp/funds/${fund_id}/accruals"
              payload: { period: "2027-02", invoiced_sales_cents: 777777 }
              as: FinanceAnalyst
          assert:
            - "TradeFund.${fund_id}.edlp_accrued_cents == 42788 (per-period: round_half_up(40201*0.6)=24121 plus round_half_up(31111*0.6)=18667)"
            - "TradeFund.${fund_id}.edlp_accrued_cents != 42787 (sum-then-round of the unrounded totals, the FORBIDDEN order, yields 42787)"
            - "TradeFund.${fund_id}.event_accrued_cents == 28524 (remainders 16080 + 12444)"
            - "TradeFund.${fund_id}.total_invoiced_cents == 1782810"

  - rule_id: non_linear_state_machine
    instances:
      - name: plan_negotiation_cycle_rounds
        grounds:
          - state_machines.JointBusinessPlan.PROPOSED_to_COUNTERED
          - state_machines.JointBusinessPlan.COUNTERED_to_PROPOSED
        distinguishing_aspect: |
          Cyclic machine on JointBusinessPlan: PROPOSED -> COUNTERED -> PROPOSED ->
          COUNTERED -> PROPOSED loops back to a previously visited state, with
          negotiation_round and version accumulating across the loop.
        test_recipe:
          setup:
            - "plan freshly created (status PROPOSED, negotiation_round 1, version 1)"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /jbp/plans/${plan_id}/negotiate"
              payload: { growth_target_pct: 10 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/negotiate"
              payload: { growth_target_pct: 9 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/negotiate"
              payload: { growth_target_pct: 11 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/negotiate"
              payload: { growth_target_pct: 10 }
              as: ManufacturerPlanner
          assert:
            - "JointBusinessPlan.${plan_id}.status == PROPOSED (looped back to a visited state)"
            - "JointBusinessPlan.${plan_id}.negotiation_round == 5"
            - "JointBusinessPlan.${plan_id}.growth_target_pct == 10 (latest re-proposal wins)"
            - "JointBusinessPlan.${plan_id}.version == 5 (create + 4 negotiates)"

      - name: forecast_parallel_dimensions
        grounds:
          - state_machines.Forecast.PUBLISHED_to_SUPERSEDED
          - state_machines.Forecast.UNCOMMITTED_to_COMMITTED
        distinguishing_aspect: |
          Parallel state dimensions on Forecast (different entity than the JBP
          cycle): pub_status flips PUBLISHED -> SUPERSEDED on supersession while
          commit_status stays COMMITTED — the two axes evolve independently on
          the same row.
        test_recipe:
          setup:
            - "ACTIVATED plan; forecast f1 for week 2027-03-01 committed by the retailer; forecast f2 for the same week published afterwards, superseding f1"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/forecasts"
              payload: { week_start: "2027-03-01T00:00:00Z", baseline_cases: 1000 }
              as: SupplyChainPlanner
              captures: { f1: "$.data.id" }
            - call: "POST /jbp/forecasts/${f1}/commit"
              payload: { committed_cases: 1100 }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
          trigger:
            - call: "POST /jbp/plans/${plan_id}/forecasts"
              payload: { week_start: "2027-03-01T00:00:00Z", baseline_cases: 1200 }
              as: SupplyChainPlanner
              captures: { f2: "$.data.id" }
            - call: "GET /jbp/plans/${plan_id}/forecasts?week_start=2027-03-01T00:00:00Z"
              as: SupplyChainPlanner
          assert:
            - "Forecast.${f1}.pub_status == SUPERSEDED"
            - "Forecast.${f1}.commit_status == COMMITTED (commitment survives supersession — independent axis)"
            - "Forecast.${f1}.committed_cases == 1100"
            - "Forecast.${f2}.pub_status == PUBLISHED"
            - "Forecast.${f2}.commit_status == UNCOMMITTED"

  - rule_id: transitive_cascade
    instances:
      - name: deduction_settle_cascade_to_review_posture
        grounds:
          - state_machines.Deduction.RECEIVED_to_SETTLED
          - entities.TradeFund.fields.event_settled_cents
          - calculations.delisting_risk_score
        distinguishing_aspect: |
          Depth-3 cascade triggered by deduction settlement: SETTLE mutates the
          TradeFund settled ledger (hop 1), that mutation recomputes the OPEN
          review's friction_count (hop 2 — the short-paid settlement now counts),
          and the friction recompute flips risk_score 24 -> 26 and risk_posture
          HEALTHY -> WATCH (hop 3). Trigger differs from the delist cascade.
        test_recipe:
          setup:
            - "ACTIVATED plan; fund accrued with one small period so the EVENT bucket holds exactly 1600 cents; committed forecast (bias 10.0); launch LAUNCHED 2027-01-15; an EVENT deduction of 5000 cents filed (RECEIVED); OPEN review whose risk_score is 24 / HEALTHY at creation"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
