              captures: { visit_id: $.data.id }
            - call: "POST /rehab/discharge-assessments"
              payload: { plan_of_care_id: "${poc_id}", assessing_therapist_id: "${th_id}", final_functional_score: 70, goals_met_count: 8, total_goals_count: 10, assessed_on: "2026-06-05" }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
