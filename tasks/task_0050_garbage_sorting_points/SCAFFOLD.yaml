scenario: |
  Garbage sorting points system: resident registration with household binding, family-member association, identity verification, community attribution, and account opening; disposal records with disposal time and location, garbage-category recognition (recyclable/hazardous/kitchen/other), classification accuracy scoring (manual/AI/scale-based), single-disposal weight or volume, and disposal-evidence (photo/video) archiving; points calculation with rule-based points (category/weight/accuracy), bonus rules (consecutive days/peak-period/specific category), points cap per period, points adjustment for misjudgment, and points history archiving; points redemption with point-mall item management, redemption order workflow, inventory deduction, redemption-channel (online/community-station) handling, and redemption-record archiving; violation deduction with violation type classification (mis-sorting/littering/no-classification), violation-evidence collection, deduction rules, appeal workflow, and repeat-violation escalation; community ranking with multi-dimensional ranking (household/building/community), ranking-period configuration (weekly/monthly/yearly), ranking-incentive rules, and ranking publication; reward and penalty rules with positive incentives (points/honor/material rewards) and negative incentives (deduction/notification/restricted-service), rule version control, and rule-effectiveness analysis; event-driven synchronization with IM, payment, and community-management systems; audit logging for points adjustments and violation records.

domain_name: "garbage-sorting-points"
api_prefix: "/communities"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the community"
        constraints: "1-80 chars, unique"
      - name: code
        type: string
        source: input
        description: "Short identifier for the community (e.g., CMTY-001)"
        constraints: "matches ^CMTY-[0-9]{3,6}$, unique"
      - name: timezone
        type: string
        source: input
        default: "UTC"
        description: "IANA timezone used for daily/weekly cap windows and ranking periods"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Lifecycle state of the community"
        constraints: "values: ACTIVE | ARCHIVED"

  - name: Household
    parent: Community
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "Owning community id"
      - name: address
        type: string
        source: input
        description: "Building/unit address inside the community"
        constraints: "1-200 chars"
      - name: building_code
        type: string
        source: input
        description: "Building identifier used for building-level ranking aggregation"
        constraints: "1-32 chars"
      - name: head_resident_id
        type: string
        source: system
        description: "Resident id of the head-of-household; null until first resident registered"
        default: null
      - name: points_balance
        type: integer
        source: computed
        default: 0
        description: "Current available points for redemption; derived field reconciled from PointsTransaction stream on every mutation"
      - name: lifetime_points_earned
        type: integer
        source: computed
        default: 0
        description: "Cumulative positive points ever credited (excluding deductions, excluding redemptions); reconciled invariant"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Household lifecycle"
        constraints: "values: ACTIVE | SUSPENDED | ARCHIVED"

  - name: Resident
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "Owning household id"
      - name: full_name
        type: string
        source: input
        description: "Legal name"
        constraints: "1-80 chars"
      - name: id_document_hash
        type: string
        source: input
        description: "Hash of the government id document used for identity verification"
        constraints: "64 lowercase hex chars"
      - name: relation
        type: enum
        source: input
        description: "Family relationship to the household head"
        constraints: "values: HEAD | SPOUSE | CHILD | PARENT | OTHER"
      - name: identity_status
        type: enum
        source: system
        default: PENDING
        description: "Identity verification status"
        constraints: "values: PENDING | VERIFIED | REJECTED"
      - name: account_status
        type: enum
        source: system
        default: INACTIVE
        description: "Account openness; only ACTIVE residents can submit disposals or redemptions"
        constraints: "values: INACTIVE | ACTIVE | RESTRICTED"
      - name: restricted_until
        type: datetime
        source: system
        default: null
        description: "When account_status == RESTRICTED, the timestamp at which the restriction lifts (clock-driven)"
      - name: consecutive_disposal_days
        type: integer
        source: computed
        default: 0
        description: "Streak of distinct calendar days (community timezone) ending today on which resident has at least one COMMITTED disposal; resets to 0 when a day passes with no disposal"

  - name: PointRule
    parent: Community
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC"
      - name: community_id
        type: string
        source: input
        description: "Community this rule applies to"
      - name: category
        type: enum
        source: input
        description: "Garbage category this rule scores"
        constraints: "values: RECYCLABLE | HAZARDOUS | KITCHEN | OTHER"
      - name: version
        type: integer
        source: system
        description: "Monotonic version per (community_id, category); starts at 1, increments per published successor"
      - name: base_rate_per_kg
        type: number
        source: input
        description: "Base points earned per 1.0 kg of correctly classified disposal"
        constraints: ">= 0, <= 1000, two decimals"
      - name: bonus_consecutive_threshold_days
        type: integer
        source: input
        default: 7
        description: "Streak length (days) at which consecutive-day bonus activates"
        constraints: ">= 1, <= 365"
      - name: bonus_consecutive_multiplier
        type: number
        source: input
        default: 1.20
        description: "Multiplier applied to base points when consecutive_disposal_days >= bonus_consecutive_threshold_days at disposal commit time"
        constraints: ">= 1.0, <= 5.0, two decimals"
      - name: peak_period_start_hour
        type: integer
        source: input
        default: 7
        description: "Hour-of-day (community timezone, 0-23) at which peak-period bonus window starts"
      - name: peak_period_end_hour
        type: integer
        source: input
        default: 9
        description: "Hour-of-day (community timezone, 0-23) at which peak-period window ends; window is half-open [start, end)"
      - name: peak_period_bonus_flat
        type: integer
        source: input
        default: 5
        description: "Flat integer points added when disposal_time falls in the peak-period window"
      - name: category_bonus_flat
        type: integer
        source: input
        default: 0
        description: "Flat integer points added when this rule's category matches a community-promoted category"
      - name: daily_cap_points
        type: integer
        source: input
        default: 200
        description: "Maximum points that may be CREDITED to a single household per calendar day across all categories scored by any rule version; overflow is dropped, recorded as cap_overflow on the disposal"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Rule lifecycle"
        constraints: "values: DRAFT | ACTIVE | RETIRED"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Timestamp when status flipped DRAFT->ACTIVE (effectivity start, inclusive)"
      - name: retired_at
        type: datetime
        source: system
        default: null
        description: "Timestamp when status flipped ACTIVE->RETIRED (effectivity end, exclusive); effectivity window is [activated_at, retired_at)"

  - name: Disposal
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "Submitting household"
      - name: resident_id
        type: string
        source: input
        description: "Submitting resident; must be ACTIVE"
      - name: community_id
        type: string
        source: computed
        description: "Denormalized from household for ranking aggregation"
      - name: disposal_time
        type: datetime
        source: input
        description: "Wall-clock time at which disposal was performed; MUST be <= server now() at commit time"
      - name: location_code
        type: string
        source: input
        description: "Community bin/station code"
        constraints: "1-32 chars"
      - name: declared_category
        type: enum
        source: input
        description: "Category declared by the resident at submission"
        constraints: "values: RECYCLABLE | HAZARDOUS | KITCHEN | OTHER"
      - name: actual_category
        type: enum
        source: input
        description: "Verified category after scoring; equal to declared_category when scoring agrees"
        constraints: "values: RECYCLABLE | HAZARDOUS | KITCHEN | OTHER"
      - name: scoring_method
        type: enum
        source: input
        description: "Mechanism that produced accuracy_score"
        constraints: "values: MANUAL | AI | SCALE"
      - name: accuracy_score
        type: number
        source: input
        description: "Classification accuracy in [0.0, 1.0]; semantics vary by scoring_method (see §1.3 disposal_points_award)"
        constraints: ">= 0.0, <= 1.0, three decimals"
      - name: weight_kg
        type: number
        source: input
        description: "Net weight in kilograms; mutually exclusive with volume_liters (exactly one MUST be provided)"
        constraints: ">= 0.0, <= 500.0, three decimals; null if volume_liters provided"
      - name: volume_liters
        type: number
        source: input
        description: "Volume in liters; converted to equivalent_weight_kg using VOLUME_TO_WEIGHT_KG_PER_L by category"
        constraints: ">= 0.0, <= 5000.0, three decimals; null if weight_kg provided"
      - name: evidence_uri
        type: string
        source: input
        description: "URI to archived photo or video evidence"
        constraints: "non-empty, max 500 chars"
      - name: applied_rule_id
        type: string
        source: system
        description: "Id of the PointRule version that was ACTIVE at disposal_time for actual_category in this community; pinned at commit"
      - name: awarded_points
        type: integer
        source: computed
        description: "Integer points credited at commit (after cap); == credited_points field on the PointsTransaction"
      - name: cap_overflow_points
        type: integer
        source: computed
        default: 0
        description: "Points dropped because daily_cap_points was reached; raw_points = awarded_points + cap_overflow_points"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Disposal lifecycle"
        constraints: "values: PENDING | COMMITTED | CORRECTED | VOIDED"

  - name: PointsTransaction
    parent: Household
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, append-only"
      - name: household_id
        type: string
        source: input
        description: "Owning household"
      - name: kind
        type: enum
        source: system
        description: "Reason for the transaction"
        constraints: "values: DISPOSAL_CREDIT | REDEMPTION_DEBIT | REDEMPTION_REFUND | VIOLATION_DEBIT | VIOLATION_REVERSAL | MISJUDGMENT_ADJUSTMENT"
      - name: amount
        type: integer
        source: system
        description: "Signed integer; positive for credits, negative for debits"
      - name: balance_after
        type: integer
        source: system
        description: "Household.points_balance immediately after this entry (audit invariant: chronological tail of entries reconciles to current balance)"
      - name: related_entity_kind
        type: enum
        source: system
        description: "Kind of related entity"
        constraints: "values: DISPOSAL | REDEMPTION_ORDER | VIOLATION"
      - name: related_entity_id
        type: string
        source: system
        description: "Id of the related entity"

  - name: MallItem
    parent: Community
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "Owning community (items are community-scoped)"
      - name: name
        type: string
        source: input
        description: "Display name"
        constraints: "1-120 chars"
      - name: cost_points
        type: integer
        source: input
        description: "Points required to redeem one unit"
        constraints: ">= 1, <= 1000000"
      - name: stock
        type: integer
        source: system
        description: "Current available units; decremented on RedemptionOrder confirm, re-credited on REJECTED/RETURNED"
        constraints: ">= 0"
      - name: channel
        type: enum
        source: input
        description: "Fulfillment channel"
        constraints: "values: ONLINE | STATION"
      - name: status
        type: enum
        source: system
        default: LISTED
        description: "Item availability"
        constraints: "values: LISTED | DELISTED"

  - name: RedemptionOrder
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "Redeeming household"
      - name: resident_id
        type: string
        source: input
        description: "Resident submitting the order"
      - name: mall_item_id
        type: string
        source: input
        description: "Item being redeemed"
      - name: quantity
        type: integer
        source: input
        description: "Units to redeem"
        constraints: ">= 1, <= 50"
      - name: unit_cost_points
        type: integer
        source: system
        description: "Snapshot of MallItem.cost_points at submission (version-pinned)"
      - name: total_cost_points
        type: integer
        source: computed
        description: "quantity * unit_cost_points"
      - name: channel
        type: enum
        source: system
        description: "Snapshot of MallItem.channel at submission"
        constraints: "values: ONLINE | STATION"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Order lifecycle"
        constraints: "values: SUBMITTED | CONFIRMED | REJECTED | FULFILLED | DELIVERED | RETURNED"
      - name: confirmed_at
        type: datetime
        source: system
        default: null
        description: "When status flipped SUBMITTED->CONFIRMED; null otherwise"
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: "When status flipped FULFILLED->DELIVERED"

  - name: Violation
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "Resident accused of the violation"
      - name: household_id
        type: string
        source: computed
        description: "Denormalized at creation for fast household-level lookup"
      - name: community_id
        type: string
        source: computed
        description: "Denormalized at creation"
      - name: violation_type
        type: enum
        source: input
        description: "Classification of violation"
        constraints: "values: MIS_SORTING | LITTERING | NO_CLASSIFICATION"
      - name: occurred_at
        type: datetime
        source: input
        description: "When the violation occurred (must be <= server now() at recording)"
      - name: evidence_uri
        type: string
        source: input
        description: "URI to archived evidence"
        constraints: "non-empty, max 500 chars"
      - name: base_deduction_points
        type: integer
        source: computed
        description: "Base deduction per VIOLATION_DEDUCTION_BY_TYPE (see §1.3 violation_deduction)"
      - name: repeat_count_in_window
        type: integer
        source: computed
        description: "Count of UPHELD or NEW violations of the SAME violation_type for this resident in the trailing REPEAT_WINDOW_DAYS window (inclusive of this one)"
      - name: escalation_multiplier
        type: number
        source: computed
        description: "Multiplier from REPEAT_ESCALATION_TIERS based on repeat_count_in_window"
      - name: final_deduction_points
        type: integer
        source: computed
        description: "Final integer deduction = round_half_up(base_deduction_points * escalation_multiplier)"
      - name: status
        type: enum
        source: system
        default: NEW
        description: "Violation/appeal lifecycle"
        constraints: "values: NEW | APPEALED | UNDER_REVIEW | UPHELD | OVERTURNED"
      - name: appeal_filed_at
        type: datetime
        source: system
        default: null
        description: "When status flipped NEW->APPEALED"
      - name: appeal_deadline_at
        type: datetime
        source: system
        description: "Computed at creation as occurred_at + APPEAL_WINDOW_DAYS; appeals submitted after this are rejected"
      - name: appeal_round
        type: integer
        source: system
        default: 0
        description: "0 = never appealed; 1 = first appeal; 2 = second appeal (re-appeal allowed once after UPHELD)"

  - name: RankingPeriod
    parent: Community
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "Owning community"
      - name: granularity
        type: enum
        source: input
        description: "Ranking aggregation granularity"
        constraints: "values: WEEKLY | MONTHLY | YEARLY"
      - name: dimension
        type: enum
        source: input
        description: "Ranking dimension (subject of leaderboard)"
        constraints: "values: HOUSEHOLD | BUILDING | COMMUNITY"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the period (community timezone, aligned to start-of-week/month/year)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the period; window is half-open [window_start, window_end)"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Period lifecycle"
        constraints: "values: OPEN | CLOSED | PUBLISHED"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: "When status flipped CLOSED->PUBLISHED"
      - name: leaderboard
        type: array
        source: computed
        default: []
        description: "Ordered array of {subject_id, subject_kind, score, rank}; recomputed on close, snapshot on publish (never auto-recomputed after publish unless retract action invoked)"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, append-only"
      - name: actor_role
        type: string
        source: system
        description: "Value of X-User-Role on the request that produced this entry"
      - name: actor_id
        type: string
        source: system
        description: "Value of X-User-ID on the request"
      - name: action
        type: enum
        source: system
        description: "Kind of audited action"
        constraints: "values: POINTS_ADJUSTMENT | VIOLATION_RECORDED | VIOLATION_APPEAL_DECISION | RULE_PUBLISHED | RANKING_PUBLISHED"
      - name: subject_kind
        type: enum
        source: system
        description: "Kind of audited subject"
        constraints: "values: DISPOSAL | VIOLATION | POINT_RULE | RANKING_PERIOD | HOUSEHOLD"
      - name: subject_id
        type: string
        source: system
        description: "Id of audited subject"
      - name: before
        type: object
        source: system
        description: "Snapshot of relevant fields prior to action"
      - name: after
        type: object
        source: system
        description: "Snapshot of relevant fields after action"
      - name: reason
        type: string
        source: input
        description: "Human-supplied reason for the action; required for POINTS_ADJUSTMENT and VIOLATION_APPEAL_DECISION"
        constraints: "1-500 chars when required"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Resident
    initial_state: PENDING
    terminal_states: [ARCHIVED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /communities/{community_id}/households/{household_id}/residents/{resident_id}/verify"
        actor: CommunityAdmin
        preconditions:
          - "Resident.identity_status == PENDING"
          - "Resident.id_document_hash is set"
        side_effects:
          - "Set Resident.identity_status = VERIFIED"
          - "Set Resident.account_status = ACTIVE if not already RESTRICTED"
          - "If this resident is the household's first VERIFIED resident, set Household.head_resident_id = resident.id"

      - from: PENDING
        to: REJECTED
        trigger: "POST /communities/{community_id}/households/{household_id}/residents/{resident_id}/verify with decision=REJECT"
        actor: CommunityAdmin
        preconditions:
          - "Resident.identity_status == PENDING"
        side_effects:
          - "Set Resident.identity_status = REJECTED"
          - "Resident.account_status remains INACTIVE"

      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /communities/{community_id}/households/{household_id}/residents/{resident_id}/restrict"
        actor: CommunityAdmin
        preconditions:
          - "Resident.identity_status == VERIFIED"
        side_effects:
          - "Set Resident.account_status = RESTRICTED"
          - "Set Resident.restricted_until = body.until"
        note: "identity_status unchanged; account_status reflects restriction. Reverts automatically when clock advances past restricted_until via POST /_sweep/run."

  - entity: Disposal
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "POST /communities/{community_id}/households/{household_id}/disposals"
        actor: Resident
        preconditions:
          - "Resident.identity_status == VERIFIED and Resident.account_status == ACTIVE"
          - "Exactly one of weight_kg, volume_liters is supplied"
          - "disposal_time <= server now()"
          - "A PointRule with community_id == disposal.community_id, category == disposal.actual_category, and status == ACTIVE at disposal_time exists"
        side_effects:
          - "Pin Disposal.applied_rule_id = id of the ACTIVE PointRule resolved above"
          - "Compute disposal_points_award per §1.3; pin awarded_points and cap_overflow_points"
          - "Append PointsTransaction{kind: DISPOSAL_CREDIT, amount: awarded_points, related_entity_kind: DISPOSAL, related_entity_id: disposal.id}"
          - "Recompute Household.points_balance += awarded_points; Household.lifetime_points_earned += awarded_points"
          - "Recompute Resident.consecutive_disposal_days"
          - "Emit external event GARBAGE_DISPOSAL_COMMITTED to IM and community-management sinks"

      - from: COMMITTED
        to: CORRECTED
        trigger: "POST /communities/{community_id}/households/{household_id}/disposals/{disposal_id}/correct"
        actor: CommunityAdmin
        preconditions:
          - "Disposal.status == COMMITTED"
          - "Body supplies new actual_category and/or new accuracy_score"
          - "Body supplies a non-empty reason"
        side_effects:
          - "Recompute disposal_points_award using the same applied_rule_id but corrected actual_category/accuracy_score; obtain new_awarded_points"
          - "Append PointsTransaction{kind: MISJUDGMENT_ADJUSTMENT, amount: (new_awarded_points - old_awarded_points)}; balance_after recorded chronologically"
          - "Update Disposal.awarded_points = new_awarded_points; update Disposal.cap_overflow_points"
          - "Update Household.points_balance and Household.lifetime_points_earned by the delta (clamped so lifetime_points_earned cannot go below zero contribution from this disposal: if old > new, lifetime decreases by (old-new); if new > old, lifetime increases by (new-old))"
          - "Invalidate any RankingPeriod with status == OPEN whose window contains disposal_time: set RankingPeriod.leaderboard = [] and require re-close"
          - "Append AuditLog{action: POINTS_ADJUSTMENT, subject_kind: DISPOSAL}"

      - from: COMMITTED
        to: VOIDED
        trigger: "POST /communities/{community_id}/households/{household_id}/disposals/{disposal_id}/void"
        actor: CommunityAdmin
        preconditions:
          - "Disposal.status == COMMITTED"
          - "Body supplies a non-empty reason"
        side_effects:
          - "Append PointsTransaction{kind: MISJUDGMENT_ADJUSTMENT, amount: -Disposal.awarded_points}"
          - "Household.points_balance -= Disposal.awarded_points; Household.lifetime_points_earned -= Disposal.awarded_points"
          - "Recompute Resident.consecutive_disposal_days (this disposal no longer contributes)"
          - "Invalidate OPEN RankingPeriod overlapping disposal_time (set leaderboard = [])"
          - "Append AuditLog{action: POINTS_ADJUSTMENT, subject_kind: DISPOSAL}"

      - from: CORRECTED
        to: VOIDED
        trigger: "POST /communities/{community_id}/households/{household_id}/disposals/{disposal_id}/void"
        actor: CommunityAdmin
        preconditions:
          - "Disposal.status == CORRECTED"
          - "Body supplies a non-empty reason"
        side_effects:
          - "Same as COMMITTED -> VOIDED but using current awarded_points (post-correction)"

  - entity: RedemptionOrder
    initial_state: SUBMITTED
    terminal_states: [REJECTED, DELIVERED, RETURNED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /communities/{community_id}/redemption-orders/{order_id}/confirm"
        actor: CommunityAdmin
        preconditions:
          - "RedemptionOrder.status == SUBMITTED"
          - "MallItem.stock >= RedemptionOrder.quantity"
          - "Household.points_balance >= RedemptionOrder.total_cost_points (rechecked at confirm time)"
        side_effects:
          - "MallItem.stock -= quantity"
          - "Append PointsTransaction{kind: REDEMPTION_DEBIT, amount: -total_cost_points}; Household.points_balance -= total_cost_points"
          - "Set RedemptionOrder.confirmed_at = now()"
          - "Emit external event REDEMPTION_CONFIRMED to payment sink"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /communities/{community_id}/redemption-orders/{order_id}/reject"
        actor: CommunityAdmin
        preconditions:
          - "RedemptionOrder.status == SUBMITTED"
        side_effects:
          - "No stock movement (stock was not yet decremented at SUBMITTED)"
          - "No points movement (points were not yet debited at SUBMITTED)"

      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /communities/{community_id}/redemption-orders/{order_id}/fulfill"
        actor: CommunityAdmin
        preconditions:
          - "RedemptionOrder.status == CONFIRMED"
        side_effects:
          - "No further stock or points movement"

      - from: FULFILLED
        to: DELIVERED
        trigger: "POST /communities/{community_id}/redemption-orders/{order_id}/deliver"
        actor: CommunityAdmin
        preconditions:
          - "RedemptionOrder.status == FULFILLED"
        side_effects:
          - "Set RedemptionOrder.delivered_at = now()"

      - from: FULFILLED
        to: RETURNED
        trigger: "POST /communities/{community_id}/redemption-orders/{order_id}/return"
        actor: CommunityAdmin
        preconditions:
          - "RedemptionOrder.status == FULFILLED"
          - "Body supplies a non-empty reason"
        side_effects:
          - "MallItem.stock += quantity (re-credit inventory)"
          - "Append PointsTransaction{kind: REDEMPTION_REFUND, amount: +total_cost_points}; Household.points_balance += total_cost_points"
          - "Compensating invariant: net change in (Household.points_balance + sum over confirmed-but-not-returned RedemptionOrder.total_cost_points) is zero between SUBMITTED->CONFIRMED and FULFILLED->RETURNED for the same order"

  - entity: Violation
    initial_state: NEW
    terminal_states: [OVERTURNED]
    transitions:
      - from: NEW
        to: NEW
        trigger: "POST /communities/{community_id}/violations (creation)"
        actor: CommunityAdmin
        preconditions:
          - "Resident exists and is not ARCHIVED"
          - "occurred_at <= now()"
        side_effects:
          - "Compute repeat_count_in_window over Violation rows of same violation_type and same resident with status IN {NEW, APPEALED, UNDER_REVIEW, UPHELD} in [now() - REPEAT_WINDOW_DAYS, now()]"
          - "Look up escalation_multiplier from REPEAT_ESCALATION_TIERS"
          - "base_deduction_points = VIOLATION_DEDUCTION_BY_TYPE[violation_type]"
          - "final_deduction_points = round_half_up(base_deduction_points * escalation_multiplier)"
          - "Append PointsTransaction{kind: VIOLATION_DEBIT, amount: -final_deduction_points}; Household.points_balance -= final_deduction_points (balance may go negative)"
          - "Set appeal_deadline_at = occurred_at + APPEAL_WINDOW_DAYS"
          - "Append AuditLog{action: VIOLATION_RECORDED, subject_kind: VIOLATION}"
          - "Emit external event VIOLATION_RECORDED to IM and community-management sinks"
        note: "Creation is self-referential NEW->NEW so cascading side-effects belong to this transition rather than to entity birth."

      - from: NEW
        to: APPEALED
        trigger: "POST /communities/{community_id}/violations/{violation_id}/appeal"
        actor: Resident
        preconditions:
          - "Violation.status == NEW"
          - "Violation.resident_id == X-User-ID and X-User-Role == Resident"
          - "now() < Violation.appeal_deadline_at"
          - "Violation.appeal_round < 2"
        side_effects:
          - "Set appeal_filed_at = now()"
          - "Set appeal_round += 1"

      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /communities/{community_id}/violations/{violation_id}/accept-review"
        actor: AppealReviewer
        preconditions:
          - "Violation.status == APPEALED"
        side_effects: []

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /communities/{community_id}/violations/{violation_id}/decide with decision=UPHOLD"
        actor: AppealReviewer
        preconditions:
          - "Violation.status == UNDER_REVIEW"
          - "Body supplies non-empty reason"
        side_effects:
          - "No points movement (deduction already applied at creation)"
          - "Append AuditLog{action: VIOLATION_APPEAL_DECISION, subject_kind: VIOLATION}"

      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /communities/{community_id}/violations/{violation_id}/decide with decision=OVERTURN"
        actor: AppealReviewer
        preconditions:
          - "Violation.status == UNDER_REVIEW"
          - "Body supplies non-empty reason"
        side_effects:
          - "Append PointsTransaction{kind: VIOLATION_REVERSAL, amount: +Violation.final_deduction_points}"
          - "Household.points_balance += Violation.final_deduction_points"
          - "For every subsequent Violation V' (created after THIS one) with same resident_id and same violation_type and status IN {NEW, APPEALED, UNDER_REVIEW, UPHELD}: recompute V'.repeat_count_in_window excluding this overturned violation, then recompute V'.escalation_multiplier and V'.final_deduction_points, append PointsTransaction{kind: MISJUDGMENT_ADJUSTMENT, amount: V'.old_final_deduction_points - V'.new_final_deduction_points}, adjust Household.points_balance by the same delta"
          - "Invalidate OPEN RankingPeriod overlapping Violation.occurred_at"
          - "Append AuditLog{action: VIOLATION_APPEAL_DECISION, subject_kind: VIOLATION}"
          - "Compensating invariant: sum over (DISPOSAL_CREDIT + VIOLATION_REVERSAL) - sum over (VIOLATION_DEBIT + MISJUDGMENT_ADJUSTMENT-cascade) yields Household.lifetime_points_earned unchanged by overturn"

      - from: UPHELD
        to: APPEALED
        trigger: "POST /communities/{community_id}/violations/{violation_id}/appeal"
        actor: Resident
        preconditions:
          - "Violation.status == UPHELD"
          - "Violation.appeal_round == 1"
          - "now() < Violation.appeal_deadline_at"
        side_effects:
          - "Set appeal_round = 2"
          - "Set appeal_filed_at = now()"
        note: "Cycle: UPHELD can re-enter APPEALED exactly once."

  - entity: PointRule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /communities/{community_id}/point-rules/{rule_id}/activate"
        actor: CommunityAdmin
        preconditions:
          - "PointRule.status == DRAFT"
          - "No other PointRule with same (community_id, category) has status == ACTIVE (i.e., predecessor must be retired first OR no predecessor exists)"
          - "Body supplies activated_at >= now() (no backdating)"
        side_effects:
          - "Set activated_at = body.activated_at"
          - "Append AuditLog{action: RULE_PUBLISHED, subject_kind: POINT_RULE}"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /communities/{community_id}/point-rules/{rule_id}/retire"
        actor: CommunityAdmin
        preconditions:
          - "PointRule.status == ACTIVE"
        side_effects:
          - "Set retired_at = now()"

  - entity: RankingPeriod
    initial_state: OPEN
    terminal_states: [PUBLISHED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /communities/{community_id}/ranking-periods/{period_id}/close"
        actor: CommunityAdmin
        preconditions:
          - "RankingPeriod.status == OPEN"
          - "now() >= RankingPeriod.window_end"
        side_effects:
          - "Compute leaderboard per §1.3 ranking_score (filter Disposal.status == COMMITTED with disposal_time in [window_start, window_end), exclude Disposal that is CORRECTED or VOIDED at close time)"
          - "Persist leaderboard array on RankingPeriod"

      - from: CLOSED
        to: OPEN
        trigger: "system: invalidation by Disposal CORRECT/VOID or Violation OVERTURN whose timestamp falls in [window_start, window_end)"
        actor: system
        preconditions:
          - "RankingPeriod.status == CLOSED"
          - "RankingPeriod.published_at IS null"
        side_effects:
          - "Clear leaderboard (set to [])"

      - from: CLOSED
        to: PUBLISHED
        trigger: "POST /communities/{community_id}/ranking-periods/{period_id}/publish"
        actor: CommunityAdmin
        preconditions:
          - "RankingPeriod.status == CLOSED"
          - "RankingPeriod.leaderboard is non-empty"
        side_effects:
          - "Set published_at = now()"
          - "Append AuditLog{action: RANKING_PUBLISHED, subject_kind: RANKING_PERIOD}"
          - "Emit external event RANKING_PUBLISHED to IM and community-management sinks"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two confirm requests target the same RedemptionOrder simultaneously"
    guarantee: "Exactly one confirm succeeds; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RedemptionOrder.status (SUBMITTED -> CONFIRMED)"

  - scenario: "Confirm and reject target the same RedemptionOrder simultaneously"
    guarantee: "Exactly one operation succeeds; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RedemptionOrder.status"

  - scenario: "Two redemption confirms compete for the last stock unit of the same MallItem"
    guarantee: "At most stock units of confirms succeed; subsequent confirms are rejected for insufficient stock"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    serialization: "First-writer-wins on MallItem.stock decrement"

  - scenario: "Two redemption confirms compete for the same household's remaining points balance"
    guarantee: "Confirms that would drive points_balance below zero are rejected; others succeed"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    serialization: "First-writer-wins on Household.points_balance debit"

  - scenario: "Two PointRule activations target the same (community_id, category) simultaneously"
    guarantee: "Exactly one activation succeeds; loser sees rule already active for category"
    error_id: ERR_RULE_ALREADY_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on PointRule.status DRAFT->ACTIVE for (community_id, category)"

  - scenario: "Two appeals on the same Violation submitted simultaneously"
    guarantee: "Exactly one appeal succeeds; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Violation.status"

  - scenario: "Concurrent disposal commit and ranking close on the same window"
    guarantee: "Either the disposal commits before close (counted) or after close (not counted); the close uses a consistent snapshot"
    error_id: ERR_RANKING_PERIOD_CLOSED
    http_status: 409
    serialization: "First-writer-wins on RankingPeriod.status OPEN->CLOSED; subsequent disposals with disposal_time inside that window are rejected"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: disposal_points_award
    trigger: "On Disposal PENDING->COMMITTED and on COMMITTED->CORRECTED"
    algorithm: tiered_pricing
    formula: |
      # Step 1: resolve effective weight
      if weight_kg is not null:
          effective_weight_kg = weight_kg
      else:
          # volume to weight by category
          effective_weight_kg = round_half_up(volume_liters * VOLUME_TO_WEIGHT_KG_PER_L[actual_category], 3)

      # Step 2: accuracy multiplier (variant-dependent — see variants below)
      accuracy_multiplier = ACCURACY_MULTIPLIER_BY_METHOD[scoring_method](accuracy_score)

      # Step 3: base points per disposal (round per-disposal, do NOT defer rounding)
      base_points = round_half_up(rule.base_rate_per_kg * effective_weight_kg * accuracy_multiplier, 0)
      # base_points is now an integer

      # Step 4: bonus additions (all integer)
      bonus = 0
      if resident.consecutive_disposal_days >= rule.bonus_consecutive_threshold_days:
          # Apply consecutive multiplier to base, then take the *delta* as bonus
          consecutive_bonus = round_half_up(base_points * (rule.bonus_consecutive_multiplier - 1.0), 0)
          bonus += consecutive_bonus

      # Peak-period window check, community-timezone, half-open [start, end)
      hour_local = disposal_time_in(community.timezone).hour
      if rule.peak_period_start_hour <= hour_local < rule.peak_period_end_hour:
          bonus += rule.peak_period_bonus_flat

      bonus += rule.category_bonus_flat  # may be 0

      raw_points = base_points + bonus

      # Step 5: daily cap (per Household, per calendar day in community.timezone, across categories)
      already_credited_today = sum of PointsTransaction.amount where:
          kind == DISPOSAL_CREDIT
          household_id == this.household_id
          calendar_day(created_at, community.timezone) == calendar_day(disposal_time, community.timezone)
          excluding any contribution from THIS disposal (it has not been written yet)
      headroom = max(0, rule.daily_cap_points - already_credited_today)
      awarded_points = min(raw_points, headroom)
      cap_overflow_points = raw_points - awarded_points
    input_set: "exactly one Disposal row; PointRule pinned via Disposal.applied_rule_id; PointsTransaction stream for same household, same calendar day"
    constants:
      VOLUME_TO_WEIGHT_KG_PER_L:
        RECYCLABLE: 0.150
        HAZARDOUS: 0.500
        KITCHEN: 0.800
        OTHER: 0.300
      ACCURACY_MULTIPLIER_BY_METHOD:
        # See variants — applied at Step 2
        MANUAL: "lambda s: 0.50 + 0.50 * s"
        AI: "lambda s: 1.00 if s >= 0.80 else (0.70 if s >= 0.50 else 0.40)"
        SCALE: "lambda s: 1.00"
    precision: "round_half_up after each rounding step; base_points rounded to 0 decimals; effective_weight_kg rounded to 3 decimals"
    variants:
      - name: manual_scoring
        when: "scoring_method == MANUAL"
        difference: "accuracy_multiplier = 0.50 + 0.50 * accuracy_score (linear in [0.50, 1.00]); accuracy_score === 1.0 gives multiplier 1.00; accuracy_score === 0.0 gives 0.50"
      - name: ai_scoring
        when: "scoring_method == AI"
        difference: "Stepwise multiplier with hard breakpoints at >= 0.80 and >= 0.50; same accuracy_score that gives multiplier=0.50 under MANUAL (s=0.0) gives multiplier=0.40 under AI; tip: s=0.50 yields 0.75 under MANUAL but 0.70 under AI"
      - name: scale_scoring
        when: "scoring_method == SCALE"
        difference: "accuracy_multiplier is always 1.00 regardless of accuracy_score; accuracy_score is recorded for audit but does not affect points"

  - name: violation_deduction
    trigger: "On Violation NEW (creation) and on every recompute triggered by sibling Violation OVERTURNED"
    algorithm: threshold
    formula: |
      base_deduction_points = VIOLATION_DEDUCTION_BY_TYPE[violation_type]

      # Repeat count: same resident, same violation_type, status IN {NEW, APPEALED, UNDER_REVIEW, UPHELD},
      # occurred_at in (now() - REPEAT_WINDOW_DAYS, now()], inclusive of this one.
      repeat_count_in_window = count(...)

      # Tiered escalation; pick the tier whose lower bound is the largest <= repeat_count_in_window.
      escalation_multiplier = REPEAT_ESCALATION_TIERS lookup
        # 1 -> 1.00
        # 2 -> 1.50
        # 3 -> 2.00
        # 4+ -> 3.00

      final_deduction_points = round_half_up(base_deduction_points * escalation_multiplier, 0)
    input_set: "this Violation plus prior Violation rows for same resident, same violation_type, status not in {OVERTURNED}, occurred_at within REPEAT_WINDOW_DAYS"
    constants:
      VIOLATION_DEDUCTION_BY_TYPE:
        MIS_SORTING: 20
        LITTERING: 50
        NO_CLASSIFICATION: 30
      REPEAT_WINDOW_DAYS: 30
      REPEAT_ESCALATION_TIERS:
        - {min_count: 1, multiplier: 1.00}
        - {min_count: 2, multiplier: 1.50}
        - {min_count: 3, multiplier: 2.00}
        - {min_count: 4, multiplier: 3.00}
    precision: "round_half_up to integer"

  - name: ranking_score
    trigger: "On RankingPeriod OPEN->CLOSED; recomputed on close, never on read"
    algorithm: aggregation
    formula: |
      # Build score per subject for given (dimension, granularity, window).
      # Eligible disposals:
      #   Disposal.community_id == period.community_id
      #   Disposal.status == COMMITTED   (CORRECTED, VOIDED disposals are excluded)
      #   Disposal.disposal_time in [window_start, window_end)
      # Eligible violations (only HOUSEHOLD/BUILDING/COMMUNITY count UPHELD violations):
      #   Violation.community_id == period.community_id
      #   Violation.status == UPHELD       (OVERTURNED violations are excluded; NEW/APPEALED/UNDER_REVIEW included tentatively as if they were UPHELD)
      #   Violation.occurred_at in [window_start, window_end)

      subjects = subjects_for_dimension(period)
      for subject in subjects:
          earned = sum(d.awarded_points for d in eligible_disposals if d.belongs_to(subject))
          deducted = sum(v.final_deduction_points for v in eligible_violations if v.belongs_to(subject))
          raw_score = earned - deducted

          # Granularity-driven normalization (this is the variant axis):
          if granularity == WEEKLY:
              score = raw_score                                # straight sum
          elif granularity == MONTHLY:
              days_in_window = (window_end - window_start).days
              # average daily, scaled by 30 (canonical month length) then rounded
              score = round_half_up(raw_score * 30.0 / days_in_window, 0)
          elif granularity == YEARLY:
              # quality-weighted average: ratio of earned to (earned + |deducted|), scaled
              denom = earned + abs(deducted)
              quality = (earned / denom) if denom > 0 else 0.0
              score = round_half_up(raw_score * (0.5 + 0.5 * quality), 0)

      # Sort descending by score; tie-break by subject_id ascending (lexicographic).
      # Empty subject set (no eligible disposals AND no eligible violations) => leaderboard is the empty array [].
    input_set: "Disposal rows where status==COMMITTED and disposal_time in window; Violation rows where status==UPHELD and occurred_at in window"
    constants:
      MONTHLY_CANONICAL_DAYS: 30
      QUALITY_BASELINE: 0.5
    precision: "round_half_up to integer per subject; sort stable by subject_id ascending on tie"
    variants:
      - name: weekly_window
        when: "RankingPeriod.granularity == WEEKLY"
        difference: "score is raw_score (no normalization)"
      - name: monthly_window
        when: "RankingPeriod.granularity == MONTHLY"
        difference: "score is raw_score * 30 / days_in_window, rounded; identical underlying disposals can produce a different rank vs weekly because of normalization"
      - name: yearly_window
        when: "RankingPeriod.granularity == YEARLY"
        difference: "score is raw_score weighted by quality ratio earned/(earned+|deducted|)"

  - name: rule_effectiveness_score
    trigger: "GET /communities/{community_id}/point-rules/{rule_id}/effectiveness"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order (this calc has a circular-looking dependency: the tier the rule lands in
      # depends on the weighted average, which is computed using tier-weighted terms.
      # We pin the evaluation order explicitly here.)

      # Step A — compute the *unweighted* effectiveness inputs over the rule's effective window
      # [activated_at, retired_at or now()):
      participation = number of distinct households with at least one COMMITTED Disposal applying this rule
      avg_accuracy  = mean(Disposal.accuracy_score for COMMITTED disposals applying this rule)
      misjudgment_ratio = count(disposals with status == CORRECTED applying this rule) / max(1, total_applying_disposals)

      # Step B — pick the participation_tier from participation count.
      participation_tier = (
          "HIGH" if participation >= 50 else
          "MEDIUM" if participation >= 10 else
          "LOW"
      )

      # Step C — pick the weight vector for this tier:
      weights = WEIGHT_VECTOR_BY_TIER[participation_tier]
              # {HIGH:   {accuracy: 0.50, misjudgment: 0.30, participation: 0.20},
              #  MEDIUM: {accuracy: 0.40, misjudgment: 0.40, participation: 0.20},
              #  LOW:    {accuracy: 0.30, misjudgment: 0.50, participation: 0.20}}

      # Step D — compute the weighted score using THE tier picked in Step B (not the tier the result would land in):
      participation_normalized = min(1.0, participation / 100.0)
      score = round_half_up(
          100.0 * (weights.accuracy * avg_accuracy
                   + weights.misjudgment * (1.0 - misjudgment_ratio)
                   + weights.participation * participation_normalized),
          1
      )

      # Step E — emit the tier picked in Step B, the score from Step D.
      # Do NOT re-run Step B based on the result of Step D.
    input_set: "Disposal rows where applied_rule_id == this rule"
    constants:
      WEIGHT_VECTOR_BY_TIER:
        HIGH:   {accuracy: 0.50, misjudgment: 0.30, participation: 0.20}
        MEDIUM: {accuracy: 0.40, misjudgment: 0.40, participation: 0.20}
        LOW:    {accuracy: 0.30, misjudgment: 0.50, participation: 0.20}
      PARTICIPATION_HIGH_MIN: 50
      PARTICIPATION_MEDIUM_MIN: 10
      PARTICIPATION_NORMALIZATION_BASE: 100
    precision: "round_half_up to one decimal place; tier is the categorical determined from raw participation count, computed BEFORE the weighted score"

  - name: consecutive_disposal_days
    trigger: "On Disposal PENDING->COMMITTED, on COMMITTED->VOIDED, and on COMMITTED->CORRECTED"
    algorithm: aggregation
    formula: |
      # Compute resident's longest streak of consecutive calendar days (community.timezone)
      # ending on today's calendar day, where each included day has at least one
      # Disposal with status IN {COMMITTED, CORRECTED} (CORRECTED still counts; VOIDED does not).
      days = sorted distinct calendar_day(disposal_time, community.timezone)
             over Disposal where resident_id == this resident and status IN {COMMITTED, CORRECTED}
      streak = 0
      today = calendar_day(now(), community.timezone)
      d = today
      while d in days:
          streak += 1
          d = d - 1 day
      consecutive_disposal_days = streak
    input_set: "Disposal rows for this resident with status IN {COMMITTED, CORRECTED}"
    constants: {}
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Resident, CommunityAdmin, AppealReviewer, SystemOperator}"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Each path id resolves left-to-right (community -> household -> resident -> disposal/violation/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: auth
    check: "If endpoint requires ownership: Resident's X-User-ID equals the operated resident's id (resident-owned actions); Household membership: X-User-ID's resident.household_id matches path household_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Resident endpoints (disposal create, redemption submit, violation appeal)"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Violation.appeal: now() < Violation.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /communities/{community_id}/violations/{violation_id}/appeal"

  - priority: 8
    category: business_safety
    check: "Resident.identity_status == VERIFIED AND Resident.account_status == ACTIVE for disposal creation and redemption submit"
    error_id: ERR_RESIDENT_INACTIVE
    http_status: 422
    applies_to:
      - "POST /communities/{community_id}/households/{household_id}/disposals"
      - "POST /communities/{community_id}/redemption-orders"

  - priority: 9
    category: business_referential
    check: "For Disposal creation: an ACTIVE PointRule exists for (community_id, actual_category) at disposal_time"
    error_id: ERR_NO_ACTIVE_RULE
    http_status: 422
    applies_to: "POST /communities/{community_id}/households/{household_id}/disposals"

  - priority: 10
    category: business_constraint
    check: "For Disposal creation: exactly one of weight_kg, volume_liters is supplied (both null OR both set is rejected)"
    error_id: ERR_WEIGHT_VOLUME_EXCLUSIVITY
    http_status: 422
    applies_to: "POST /communities/{community_id}/households/{household_id}/disposals"

  - priority: 11
    category: business_temporal
    check: "Disposal.disposal_time <= server now() AND disposal_time >= now() - DISPOSAL_BACKDATE_MAX_HOURS (24h)"
    error_id: ERR_DISPOSAL_TIME_INVALID
    http_status: 422
    applies_to: "POST /communities/{community_id}/households/{household_id}/disposals"

  - priority: 12
    category: business_constraint
    check: "For RedemptionOrder submit: MallItem.status == LISTED AND MallItem.community_id == path community_id"
    error_id: ERR_ITEM_UNAVAILABLE
    http_status: 422
    applies_to: "POST /communities/{community_id}/redemption-orders"

  - priority: 13
    category: business_constraint
    check: "For RedemptionOrder confirm: MallItem.stock >= RedemptionOrder.quantity"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /communities/{community_id}/redemption-orders/{order_id}/confirm"

  - priority: 14
    category: business_fiscal
    check: "For RedemptionOrder confirm: Household.points_balance >= RedemptionOrder.total_cost_points"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /communities/{community_id}/redemption-orders/{order_id}/confirm"

  - priority: 15
    category: business_constraint
    check: "For PointRule activation: no other PointRule with same (community_id, category) has status == ACTIVE"
    error_id: ERR_RULE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /communities/{community_id}/point-rules/{rule_id}/activate"

  - priority: 16
    category: business_temporal
    check: "For PointRule activation: body.activated_at >= now()"
    error_id: ERR_RULE_BACKDATING
    http_status: 422
    applies_to: "POST /communities/{community_id}/point-rules/{rule_id}/activate"

  - priority: 17
    category: business_temporal
    check: "For RankingPeriod close: now() >= window_end"
    error_id: ERR_RANKING_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /communities/{community_id}/ranking-periods/{period_id}/close"

  - priority: 18
    category: business_constraint
    check: "For RankingPeriod create: (community_id, granularity, dimension) periods of same granularity MUST NOT overlap with any existing period of the same (community_id, granularity, dimension) — half-open intervals [window_start, window_end). For WEEKLY/MONTHLY, also MUST be contiguous (window_start == previous.window_end) with prior period if any."
    error_id: ERR_RANKING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /communities/{community_id}/ranking-periods"

  - priority: 19
    category: business_constraint
    check: "For RankingPeriod publish: leaderboard is non-empty (i.e., at least one subject contributed disposals/violations in the window)"
    error_id: ERR_RANKING_EMPTY
    http_status: 422
    applies_to: "POST /communities/{community_id}/ranking-periods/{period_id}/publish"

  - priority: 20
    category: business_constraint
    check: "Body fields conform to declared types and per-field constraints (numeric ranges, string lengths, enum membership)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

  - priority: 21
    category: business_constraint
    check: "If body.version is supplied, it must equal the current entity.version (optimistic concurrency)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and state-transition POSTs"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Community ----
  - method: POST
    path: "/communities"
    description: "Create a community"
    roles: [SystemOperator]
    code: 201
    input: [name, code, timezone]
    output: Community
    side_effects: []

  - method: GET
    path: "/communities/{community_id}"
    description: "Read a community"
    roles: [SystemOperator, CommunityAdmin, AppealReviewer]
    code: 200
    input: []
    output: Community
    side_effects: []

  # ---- Household ----
  - method: POST
    path: "/communities/{community_id}/households"
    description: "Register a new household"
    roles: [CommunityAdmin]
    code: 201
    input: [address, building_code]
    output: Household
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/households/{household_id}"
    description: "Read a household"
    roles: [CommunityAdmin, AppealReviewer, Resident]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/households"
    description: "List households in community"
    roles: [CommunityAdmin]
    code: 200
    input: ["limit?", "offset?", "building_code?", "status?"]
    output: "Household[]"
    side_effects: []

  # ---- Resident ----
  - method: POST
    path: "/communities/{community_id}/households/{household_id}/residents"
    description: "Register a resident under a household"
    roles: [CommunityAdmin]
    code: 201
    input: [full_name, id_document_hash, relation]
    output: Resident
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/households/{household_id}/residents/{resident_id}/verify"
    description: "Verify or reject resident identity"
    roles: [CommunityAdmin]
    code: 200
    input: [decision]
    output: Resident
    side_effects: ["may set Household.head_resident_id on first VERIFIED"]

  - method: POST
    path: "/communities/{community_id}/households/{household_id}/residents/{resident_id}/restrict"
    description: "Restrict a verified resident's account (until clock-driven expiry)"
    roles: [CommunityAdmin]
    code: 200
    input: [until, reason]
    output: Resident
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/households/{household_id}/residents/{resident_id}"
    description: "Read a resident"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []

  # ---- PointRule ----
  - method: POST
    path: "/communities/{community_id}/point-rules"
    description: "Create a draft point rule for a category"
    roles: [CommunityAdmin]
    code: 201
    input: [category, base_rate_per_kg, bonus_consecutive_threshold_days, bonus_consecutive_multiplier, peak_period_start_hour, peak_period_end_hour, peak_period_bonus_flat, category_bonus_flat, daily_cap_points]
    output: PointRule
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/point-rules/{rule_id}/activate"
    description: "Activate a draft rule (replaces predecessor if any after retirement)"
    roles: [CommunityAdmin]
    code: 200
    input: [activated_at]
    output: PointRule
    side_effects: ["AuditLog RULE_PUBLISHED"]

  - method: POST
    path: "/communities/{community_id}/point-rules/{rule_id}/retire"
    description: "Retire an active rule"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: PointRule
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/point-rules/{rule_id}/effectiveness"
    description: "Return rule effectiveness score and tier (rule_effectiveness_score, §1.3)"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: "object {score, participation_tier, participation, avg_accuracy, misjudgment_ratio}"
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/point-rules"
    description: "List rules in community"
    roles: [CommunityAdmin]
    code: 200
    input: ["limit?", "offset?", "category?", "status?"]
    output: "PointRule[]"
    side_effects: []

  # ---- Disposal ----
  - method: POST
    path: "/communities/{community_id}/households/{household_id}/disposals"
    description: "Record a disposal (Resident creates own)"
    roles: [Resident]
    code: 201
    input: ["resident_id", "disposal_time", "location_code", "declared_category", "actual_category", "scoring_method", "accuracy_score", "weight_kg?", "volume_liters?", "evidence_uri"]
    output: Disposal
    side_effects: ["disposal_points_award (§1.3)", "PointsTransaction DISPOSAL_CREDIT", "Household.points_balance update", "Resident.consecutive_disposal_days update", "GARBAGE_DISPOSAL_COMMITTED event"]

  - method: POST
    path: "/communities/{community_id}/households/{household_id}/disposals/{disposal_id}/correct"
    description: "Correct a disposal's category and/or accuracy (misjudgment)"
    roles: [CommunityAdmin]
    code: 200
    input: ["actual_category?", "accuracy_score?", "reason"]
    output: Disposal
    side_effects: ["disposal_points_award recompute", "PointsTransaction MISJUDGMENT_ADJUSTMENT", "ranking invalidation", "AuditLog POINTS_ADJUSTMENT"]

  - method: POST
    path: "/communities/{community_id}/households/{household_id}/disposals/{disposal_id}/void"
    description: "Void a disposal entirely (revoke all points)"
    roles: [CommunityAdmin]
    code: 200
    input: [reason]
    output: Disposal
    side_effects: ["PointsTransaction MISJUDGMENT_ADJUSTMENT (negative)", "ranking invalidation", "AuditLog POINTS_ADJUSTMENT"]

  - method: GET
    path: "/communities/{community_id}/households/{household_id}/disposals"
    description: "List disposals for a household"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: ["limit?", "offset?", "status?", "from?", "to?"]
    output: "Disposal[]"
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/households/{household_id}/disposals/{disposal_id}"
    description: "Read a single disposal"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: []
    output: Disposal
    side_effects: []

  # ---- PointsTransaction (read-only) ----
  - method: GET
    path: "/communities/{community_id}/households/{household_id}/points-transactions"
    description: "Read household points-transaction history (audit archive)"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: ["limit?", "offset?", "kind?", "from?", "to?"]
    output: "PointsTransaction[]"
    side_effects: []

  # ---- MallItem ----
  - method: POST
    path: "/communities/{community_id}/mall-items"
    description: "Create a mall item"
    roles: [CommunityAdmin]
    code: 201
    input: [name, cost_points, stock, channel]
    output: MallItem
    side_effects: []

  - method: PATCH
    path: "/communities/{community_id}/mall-items/{item_id}"
    description: "Adjust mall item stock/status/cost"
    roles: [CommunityAdmin]
    code: 200
    input: ["stock?", "cost_points?", "status?", "version?"]
    output: MallItem
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/mall-items"
    description: "List mall items"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: ["limit?", "offset?", "channel?", "status?"]
    output: "MallItem[]"
    side_effects: []

  # ---- RedemptionOrder ----
  - method: POST
    path: "/communities/{community_id}/redemption-orders"
    description: "Submit a redemption order"
    roles: [Resident]
    code: 201
    input: [mall_item_id, quantity, household_id, resident_id]
    output: RedemptionOrder
    side_effects: ["unit_cost_points snapshot at submit"]

  - method: POST
    path: "/communities/{community_id}/redemption-orders/{order_id}/confirm"
    description: "Confirm a submitted redemption (debit points, decrement stock)"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: ["MallItem.stock decrement", "PointsTransaction REDEMPTION_DEBIT", "REDEMPTION_CONFIRMED event"]

  - method: POST
    path: "/communities/{community_id}/redemption-orders/{order_id}/reject"
    description: "Reject a submitted redemption"
    roles: [CommunityAdmin]
    code: 200
    input: [reason]
    output: RedemptionOrder
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/redemption-orders/{order_id}/fulfill"
    description: "Mark a confirmed redemption as fulfilled"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/redemption-orders/{order_id}/deliver"
    description: "Mark a fulfilled redemption as delivered (terminal)"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/redemption-orders/{order_id}/return"
    description: "Return a fulfilled order (re-credit stock and points)"
    roles: [CommunityAdmin]
    code: 200
    input: [reason]
    output: RedemptionOrder
    side_effects: ["MallItem.stock += quantity", "PointsTransaction REDEMPTION_REFUND"]

  - method: GET
    path: "/communities/{community_id}/redemption-orders/{order_id}"
    description: "Read a redemption order"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/redemption-orders"
    description: "List redemption orders in community"
    roles: [CommunityAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "household_id?"]
    output: "RedemptionOrder[]"
    side_effects: []

  # ---- Violation ----
  - method: POST
    path: "/communities/{community_id}/violations"
    description: "Record a violation (creation; immediate deduction)"
    roles: [CommunityAdmin]
    code: 201
    input: [resident_id, violation_type, occurred_at, evidence_uri]
    output: Violation
    side_effects: ["violation_deduction (§1.3)", "PointsTransaction VIOLATION_DEBIT", "Household.points_balance update", "AuditLog VIOLATION_RECORDED", "VIOLATION_RECORDED event"]

  - method: POST
    path: "/communities/{community_id}/violations/{violation_id}/appeal"
    description: "Resident files an appeal on a NEW or UPHELD violation"
    roles: [Resident]
    code: 200
    input: [reason]
    output: Violation
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/violations/{violation_id}/accept-review"
    description: "Reviewer takes an appealed violation under review"
    roles: [AppealReviewer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/violations/{violation_id}/decide"
    description: "Reviewer decides an appeal (UPHOLD or OVERTURN)"
    roles: [AppealReviewer]
    code: 200
    input: [decision, reason]
    output: Violation
    side_effects: ["if OVERTURN: PointsTransaction VIOLATION_REVERSAL, recompute cascade on subsequent violations, ranking invalidation", "AuditLog VIOLATION_APPEAL_DECISION"]

  - method: GET
    path: "/communities/{community_id}/violations/{violation_id}"
    description: "Read a violation"
    roles: [CommunityAdmin, AppealReviewer, Resident]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/violations"
    description: "List violations in community"
    roles: [CommunityAdmin, AppealReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "violation_type?", "resident_id?"]
    output: "Violation[]"
    side_effects: []

  # ---- RankingPeriod ----
  - method: POST
    path: "/communities/{community_id}/ranking-periods"
    description: "Create a ranking period"
    roles: [CommunityAdmin]
    code: 201
    input: [granularity, dimension, window_start, window_end]
    output: RankingPeriod
    side_effects: []

  - method: POST
    path: "/communities/{community_id}/ranking-periods/{period_id}/close"
    description: "Close a ranking period and compute leaderboard"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: RankingPeriod
    side_effects: ["ranking_score (§1.3)"]

  - method: POST
    path: "/communities/{community_id}/ranking-periods/{period_id}/publish"
    description: "Publish a closed ranking period"
    roles: [CommunityAdmin]
    code: 200
    input: []
    output: RankingPeriod
    side_effects: ["AuditLog RANKING_PUBLISHED", "RANKING_PUBLISHED event"]

  - method: GET
    path: "/communities/{community_id}/ranking-periods/{period_id}"
    description: "Read a ranking period (including leaderboard)"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: []
    output: RankingPeriod
    side_effects: []

  - method: GET
    path: "/communities/{community_id}/ranking-periods"
    description: "List ranking periods"
    roles: [CommunityAdmin, Resident]
    code: 200
    input: ["limit?", "offset?", "granularity?", "dimension?", "status?"]
    output: "RankingPeriod[]"
    side_effects: []

  # ---- AuditLog (read-only) ----
  - method: GET
    path: "/communities/{community_id}/audit-logs"
    description: "Read community audit log entries"
    roles: [CommunityAdmin]
    code: 200
    input: ["limit?", "offset?", "action?", "subject_kind?", "from?", "to?"]
    output: "AuditLog[]"
    side_effects: []

  # ---- Test-driving endpoints (testability completeness) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance server logical clock to a given ISO 8601 UTC time (test-only)"
    roles: [SystemOperator]
    code: 200
    input: [to]
    output: "object {now}"
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run automatic sweep: lift Resident.restricted_until expiries (test-only / scheduled)"
    roles: [SystemOperator]
    code: 200
    input: []
    output: "object {residents_unrestricted: integer}"
    side_effects: ["Resident.account_status RESTRICTED -> ACTIVE when restricted_until <= now()"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"

  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role value is not in the declared role set"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint, or ownership check failed"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Any path id does not resolve to an entity"

  - id: ERR_VALIDATION
    http: 400
    condition: "Body field types/ranges/enums do not conform to the declared schema"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits this transition"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: body.version does not equal the entity's current version"

  - id: ERR_RESIDENT_INACTIVE
    http: 422
    condition: "Resident is not VERIFIED+ACTIVE for an action that requires it (disposal create, redemption submit)"

  - id: ERR_NO_ACTIVE_RULE
    http: 422
    condition: "No PointRule with status==ACTIVE for (community_id, category) at disposal_time"

  - id: ERR_WEIGHT_VOLUME_EXCLUSIVITY
    http: 422
    condition: "Disposal create: neither or both of weight_kg/volume_liters supplied"

  - id: ERR_DISPOSAL_TIME_INVALID
    http: 422
    condition: "Disposal.disposal_time is in the future or earlier than now() - DISPOSAL_BACKDATE_MAX_HOURS"

  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 422
    condition: "Appeal filed at or after Violation.appeal_deadline_at"

  - id: ERR_ITEM_UNAVAILABLE
    http: 422
    condition: "Mall item not LISTED, or belongs to a different community"

  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "MallItem.stock < requested quantity at confirm time"

  - id: ERR_INSUFFICIENT_POINTS
    http: 409
    condition: "Household.points_balance < total_cost_points at confirm time"

  - id: ERR_RULE_ALREADY_ACTIVE
    http: 409
    condition: "Another PointRule with same (community_id, category) is already ACTIVE"

  - id: ERR_RULE_BACKDATING
    http: 422
    condition: "PointRule.activate body.activated_at < now()"

  - id: ERR_RANKING_PERIOD_NOT_ENDED
    http: 422
    condition: "RankingPeriod close attempted before now() >= window_end"

  - id: ERR_RANKING_PERIOD_OVERLAP
    http: 409
    condition: "New RankingPeriod overlaps an existing (community_id, granularity, dimension) period, or is non-contiguous when contiguity required"

  - id: ERR_RANKING_PERIOD_CLOSED
    http: 409
    condition: "Disposal commit attempted with disposal_time falling inside an already-CLOSED-or-PUBLISHED ranking period window for this community"

  - id: ERR_RANKING_EMPTY
    http: 422
    condition: "RankingPeriod publish attempted while leaderboard is empty"

  - id: ERR_DELIVERY_TERMINAL
    http: 409
    condition: "RedemptionOrder action attempted on terminal state (DELIVERED, REJECTED, RETURNED)"

  - id: ERR_VIOLATION_REAPPEAL_LIMIT
    http: 409
    condition: "Violation.appeal attempted with appeal_round >= 2"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemOperator
    description: "Platform operator; bootstraps communities and drives test clock/sweep endpoints"
    identity: opaque
    exclusive_operations:
      - "POST /communities"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET /communities/{community_id}"

  - name: CommunityAdmin
    description: "Community-level operator who manages households, residents, point rules, redemptions, violations (recording), ranking periods"
    identity: opaque
    exclusive_operations:
      - "POST /communities/{community_id}/households"
      - "POST /communities/{community_id}/households/{household_id}/residents"
      - "POST /communities/{community_id}/households/{household_id}/residents/{resident_id}/verify"
      - "POST /communities/{community_id}/households/{household_id}/residents/{resident_id}/restrict"
      - "POST /communities/{community_id}/point-rules"
      - "POST /communities/{community_id}/point-rules/{rule_id}/activate"
      - "POST /communities/{community_id}/point-rules/{rule_id}/retire"
      - "GET /communities/{community_id}/point-rules/{rule_id}/effectiveness"
      - "POST /communities/{community_id}/households/{household_id}/disposals/{disposal_id}/correct"
      - "POST /communities/{community_id}/households/{household_id}/disposals/{disposal_id}/void"
      - "POST /communities/{community_id}/mall-items"
      - "PATCH /communities/{community_id}/mall-items/{item_id}"
      - "POST /communities/{community_id}/redemption-orders/{order_id}/confirm"
      - "POST /communities/{community_id}/redemption-orders/{order_id}/reject"
      - "POST /communities/{community_id}/redemption-orders/{order_id}/fulfill"
      - "POST /communities/{community_id}/redemption-orders/{order_id}/deliver"
      - "POST /communities/{community_id}/redemption-orders/{order_id}/return"
      - "POST /communities/{community_id}/violations"
      - "POST /communities/{community_id}/ranking-periods"
      - "POST /communities/{community_id}/ranking-periods/{period_id}/close"
      - "POST /communities/{community_id}/ranking-periods/{period_id}/publish"
      - "GET /communities/{community_id}/audit-logs"
    shared_operations:
      - "GET /communities/{community_id}"
      - "GET /communities/{community_id}/households"
      - "GET /communities/{community_id}/households/{household_id}"
      - "GET /communities/{community_id}/households/{household_id}/residents/{resident_id}"
      - "GET /communities/{community_id}/households/{household_id}/disposals"
      - "GET /communities/{community_id}/households/{household_id}/disposals/{disposal_id}"
      - "GET /communities/{community_id}/households/{household_id}/points-transactions"
      - "GET /communities/{community_id}/mall-items"
      - "GET /communities/{community_id}/redemption-orders"
      - "GET /communities/{community_id}/redemption-orders/{order_id}"
      - "GET /communities/{community_id}/violations"
      - "GET /communities/{community_id}/violations/{violation_id}"
      - "GET /communities/{community_id}/ranking-periods"
      - "GET /communities/{community_id}/ranking-periods/{period_id}"
      - "GET /communities/{community_id}/point-rules"

  - name: Resident
    description: "Verified resident; submits disposals and redemption orders for their own household, files appeals on their own violations"
    identity: entity_backed:Resident
    exclusive_operations:
      - "POST /communities/{community_id}/households/{household_id}/disposals"
      - "POST /communities/{community_id}/redemption-orders"
      - "POST /communities/{community_id}/violations/{violation_id}/appeal"
    shared_operations:
      - "GET /communities/{community_id}/households/{household_id}"
      - "GET /communities/{community_id}/households/{household_id}/residents/{resident_id}"
      - "GET /communities/{community_id}/households/{household_id}/disposals"
      - "GET /communities/{community_id}/households/{household_id}/disposals/{disposal_id}"
      - "GET /communities/{community_id}/households/{household_id}/points-transactions"
      - "GET /communities/{community_id}/mall-items"
      - "GET /communities/{community_id}/redemption-orders/{order_id}"
      - "GET /communities/{community_id}/violations/{violation_id}"
      - "GET /communities/{community_id}/ranking-periods"
      - "GET /communities/{community_id}/ranking-periods/{period_id}"

  - name: AppealReviewer
    description: "Separate-of-duties appeal handler; takes appeals under review and decides them. May NOT record violations (that is CommunityAdmin exclusive)."
    identity: opaque
    exclusive_operations:
