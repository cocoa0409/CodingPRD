            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /ccps/${ccp_id}/observations", payload: { observed_value_f: 41.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { dev_id: $.data.deviation_id } }
            - { call: "POST /deviations/${dev_id}/log-corrective-action", payload: { corrective_action_note: "Rechilled product" }, as: QAManager, as_user_id: "qa-mgr-1" }
          trigger:
            - { call: "POST /deviations/${dev_id}/verify", payload: {}, as: QAManager, as_user_id: "qa-tech-1", captures: { err: $.data.error_id } }
            - { call: "POST /deviations/${dev_id}/verify", payload: {}, as: QAManager, as_user_id: "qa-mgr-1", captures: { err2: $.data.error_id } }
            - { call: "POST /deviations/${dev_id}/verify", payload: {}, as: QAManager, as_user_id: "qa-mgr-2", captures: { st: $.data.status, ver: $.data.verified_by } }
          assert:
            - "verify by monitor qa-tech-1 rejected: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION and HTTP status == 403"
            - "verify by action logger qa-mgr-1 rejected: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "verify by qa-mgr-2 succeeds: status == VERIFIED, verified_by == qa-mgr-2"

      - name: nr_resolve_by_creator_returns_segregation_error
        claim_type: violation_to_error
        grounds: ["validations[priority=35]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]", state_machines.NoncomplianceRecord.OPEN_to_CLOSED]
        distinguishing_aspect: "The inspector whose audit created the NR cannot resolve it; a different inspector can, and resolving the last CRITICAL NR reactivates the plant."
        test_recipe:
          setup: ["humane audit FAILED by insp-01 -> NR (created_by insp-01), plant SUSPENDED"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-33", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
