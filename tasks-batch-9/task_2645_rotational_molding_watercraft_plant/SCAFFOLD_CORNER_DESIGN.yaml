            - "WarrantyClaim.${claim}.claim_status == 'VOIDED' with denial_reason 'APPROVAL_VOIDED' immediately after the suspension — the cascade is visible without any further call"
            - "${pmr_b} == 500000 and ProductModel.${pm}.warranty_paid_cents == 0: voiding an unapproved claim moves no money in either direction"
            - "the intake attempt while SUSPENDED returns 409 with data.error_id 'ERR_CUSTOMER_NOT_ACTIVE' and creates no row"
            - "the reinstate returns 200 with status 'ACTIVE' and WarrantyClaim.${claim}.claim_status is STILL 'VOIDED' — reinstatement is not a resurrection"
