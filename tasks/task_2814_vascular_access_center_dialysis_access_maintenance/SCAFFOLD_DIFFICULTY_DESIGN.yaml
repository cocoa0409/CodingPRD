            - call: "POST /access-conversion-plans"
              payload: { patient_id: "${pat_id}", from_access_id: "${cath_id}", target_access_type: "AVF", target_conversion_date: "2026-08-15", expected_access_version: "${cath_v}", target_access_id: "${avf_id}" }
              as: AccessCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /access-conversion-plans/${plan_id}/activate"
              payload: {}
              as: AccessCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T12:00:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /access-conversion-plans/${plan_id}/maturation-checks"
              payload: { diameter_mm: 6.0, flow_ml_min: 600, depth_mm: 6.0 }
              as: Interventionalist
              as_user_id: "${op_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /access-conversion-plans/${plan_id}/maturation-checks"
              payload: { diameter_mm: 6.0, flow_ml_min: 600, depth_mm: 6.0 }
              as: Interventionalist
              as_user_id: "${op_id}"
            - call: "POST /access-conversion-plans/${plan_id}/maturation-checks"
              payload: { diameter_mm: 6.0, flow_ml_min: 599, depth_mm: 6.0 }
              as: Interventionalist
              as_user_id: "${op_id}"
          assert:
            - "check 1 at clock 2026-07-31: days_since_placement == 41, readiness_met == false, readiness_failure_reasons == ['MATURATION_DAYS'], status ACTIVE -> MATURATION_HOLD, maturation_check_count == 1"
            - "check 1 proves diameter 6.0, flow 600 and depth 6.0 all pass at their exact limits: MATURATION_DAYS is the ONLY failure reason"
            - "check 2 at clock 2026-08-01 with the identical payload: days_since_placement == 42, readiness_met == true, readiness_failure_reasons == [], status MATURATION_HOLD -> ACTIVE, maturation_check_count == 2"
            - "check 3 at flow 599: readiness_met == false, readiness_failure_reasons == ['FLOW'], status ACTIVE -> MATURATION_HOLD, maturation_check_count == 3"
            - "check 3 records last_flow_ml_min == 599 while last_diameter_mm == 6.0 and last_depth_mm == 6.0 are unchanged"
            - "SURVEILLANCE_COUNT never appears in readiness_failure_reasons: the AVF carries 2 readings against MIN_READINGS 2, itself an inclusive boundary"
            - "VascularAccess.${avf_id}.status stays MATURING throughout - a readiness check never transitions the access"
            - "VascularAccess.${cath_id}.status stays IN_USE and AccessConversionPlan.${plan_id}.converted_at stays null: readiness alone converts nothing"

      - name: device_lot_headroom_is_inclusive_and_a_full_lot_stays_available
        grounds:
          - validations.priority_30_ERR_LOT_DEPLETED
          - entities.DeviceLot.fields.quantity_on_hand
          - entities.DeviceLot.fields.quantity_reserved
          - state_machines.DeviceLot.AVAILABLE_to_DEPLETED
        distinguishing_aspect: |
          Reservation headroom is (quantity_on_hand - quantity_reserved) compared with >= at an
          inclusive boundary, so a 3-unit lot accepts a request for exactly 3 and then rejects a
          request for 1 with ERR_LOT_DEPLETED. The lot nevertheless stays AVAILABLE rather than
          DEPLETED, because DEPLETED is driven by quantity_on_hand reaching 0 through CONSUMPTION,
          not by reservations exhausting the headroom - two quantities that a naive implementation
          conflates.
        test_recipe:
          setup:
            - "one SHEATH lot with received_quantity 3"
            - "one SCHEDULED sedation_level NONE procedure to hang the reservations on"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Riverbend Dialysis", facility_code: "RVB-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
