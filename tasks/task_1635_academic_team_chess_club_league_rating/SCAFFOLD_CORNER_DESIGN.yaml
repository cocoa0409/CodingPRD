  # Section: errors (every catalog error is triggerable)
  # =====================================================================
  - section: errors
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role are rejected ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["Empty DB; the test harness sends this request with both headers REMOVED (the as:/as_user_id: below documents intent only; the implementation must reject header-less calls)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/seasons", as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, HTTP 400 — got ${err}"

      - name: season_complete_without_standings_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.Season.FINALIZING_to_COMPLETED"
          - "errors[ERR_STANDINGS_NOT_FINAL]"
        distinguishing_aspect: "Completing a FINALIZING season without any StandingSnapshot fails ERR_STANDINGS_NOT_FINAL."
        test_recipe:
          setup: ["Season FINALIZING, no snapshots"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/seasons/${sid}/finalize", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/seasons/${sid}/complete", payload: {}, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STANDINGS_NOT_FINAL (409) — got ${err}"

