            - call: "POST /roadshow-events"
              payload: { company_id: "${co_id}", event_type: "NDR", venue_city: "Toronto", window_start: "2026-09-01T13:00:00Z", window_end: "2026-09-01T18:00:00Z", slot_minutes: 30, capacity_slots: 1 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
