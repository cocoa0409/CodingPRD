              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/check-in"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "POST /visits/${v1_id}/score"
              payload: { scoring_instrument: "CDAI", tender_joint_count: 2, swollen_joint_count: 1, patient_global_assessment: 3.0, physician_global_assessment: 3.0 }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
          trigger:
            - call: "GET /patients/${pat1_id}/quality-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-03T14:00:00Z" }
              as: RegistryAdmin
              captures: { err_empty: $.data.error_id }
            - call: "GET /patients/${pat1_id}/quality-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-03T14:00:01Z" }
              as: RegistryAdmin
              captures: { count_included: $.data.qualifying_visit_count }
            - call: "GET /patients/${pat1_id}/quality-report"
              payload: { period_start: "2026-08-03T14:00:00Z", period_end: "2026-08-04T00:00:00Z" }
              as: RegistryAdmin
              captures: { count_lower_bound: $.data.qualifying_visit_count }
          assert:
            - "Visit.${v1_id}.activity_score == 9.00, activity_category == \"LOW\", status == \"SCORED\""
            - "${err_empty} == \"ERR_QUALITY_PERIOD_NO_VISITS\" with HTTP 422 (the visit at exactly period_end is outside the half-open window)"
            - "${count_included} == 1"
            - "second call: scored_visit_count == 1, at_target_visit_count == 1, escalation_indicated_count == 0, escalation_acted_count == 0, administered_dose_count == 0"
            - "second call: completeness_pct == 100.0, treat_to_target_attainment_pct == 100.0, escalation_action_pct == 0.0, biosimilar_uptake_pct == 0.0"
            - "${count_lower_bound} == 1 (period_start is inclusive, so the same instant that was excluded as period_end is included as period_start)"

