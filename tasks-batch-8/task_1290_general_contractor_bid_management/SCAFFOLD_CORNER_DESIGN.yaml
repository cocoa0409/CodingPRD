      - name: close_bidding_before_deadline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_BID_DEADLINE_NOT_REACHED]"]
        distinguishing_aspect: "The mirror temporal gate: close-bidding at 2026-08-09 (before the 2026-08-10 due) fails with ERR_BID_DEADLINE_NOT_REACHED; at exactly the due instant it succeeds (>= is inclusive here, unlike the strict < for submissions)."
        test_recipe:
          setup: ["Package PUBLISHED due 2026-08-10T14:00:00Z"]
