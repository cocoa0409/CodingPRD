scenario: |
  Channel Partner Program & Deal Registration (software channel operations): partner tiering with
  requirements for certification, revenue and marketing commitment, deal registration submission with
  approval criteria, exclusivity windows and conflict resolution against direct sales, margin structure
  by tier and registration status with special pricing request handling, partner enablement,
  certification tracking and portal entitlement management, market development fund allocation, claim
  submission and proof-of-performance validation, channel conflict escalation and account mapping
  agreements, distributor versus reseller stocking and invoicing flows, partner performance review and
  program compliance audits
domain_name: channel-partner-program
api_prefix: "/"

complexity_profile:
  difficulty_level: expert
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by declared foreign keys; no ownership nesting in URL paths.
  # Sub-resource GETs exist only as reverse-reachability read channels, never as the identity of a child.

  state_machine_shape: cyclic
  # DealRegistration revision loop (UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED), AccountMapping
  # negotiation loop (PROPOSED -> COUNTERED -> PROPOSED), MdfClaim proof loop
  # (SUBMITTED -> PROOF_REQUESTED -> SUBMITTED) plus two parallel state dimensions on MdfClaim
  # (validation_state x settlement_state) and branching fork-join on ConflictCase.

  relationship_patterns:
    - one_to_many          # Partner -> CertificationRecord / MdfAllocation / OrderInvoice / PerformanceReview
    - many_to_many         # AccountMapping is the Partner x Account junction with its own lifecycle
    - self_referential     # DealRegistration.supersedes_registration_id -> DealRegistration.id
    - cross_aggregate      # ConflictCase spans Account + two DealRegistrations owned by different Partners

  role_model: segregation_of_duties
  # ChannelOpsAnalyst prepares/validates, ChannelDirector decides; the same X-User-ID may not both
  # validate an MdfClaim and approve its payment, nor prepare a PerformanceReview and decide it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Partner
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: legal name of the channel partner company
        constraints: non-empty, max 160 chars
      - name: partner_type
        type: enum
        source: input
        description: distribution model the partner operates under
        constraints: "one of {DISTRIBUTOR, RESELLER}; DISTRIBUTOR may place STOCKING orders, RESELLER may not"
      - name: tier
        type: enum
        source: system
        description: program tier, only ever written by an approved PerformanceReview decision
        default: REGISTERED
        constraints: "one of {REGISTERED, SILVER, GOLD, PLATINUM}"
      - name: tier_status
        type: enum
        source: system
        description: program standing that gates channel operations
        default: COMPLIANT
        constraints: "one of {COMPLIANT, PROBATION, SUSPENDED}"
      - name: marketing_commitment_cents
        type: integer
        source: input
        description: annual marketing spend the partner contractually commits to
        constraints: ">= 0"
      - name: cert_credit_total
        type: integer
        source: computed
        description: "sum of credit_weight over this partner's CertificationRecord rows with status == ACTIVE (calculations.certification_credit_rollup)"
        default: 0
      - name: trailing_revenue_cents
        type: integer
        source: computed
        description: "sum of OrderInvoice.invoice_amount_cents over this partner's invoices with status IN {INVOICED, CREDITED} (calculations.partner_revenue_rollup)"
        default: 0
      - name: marketing_qualified_spend_cents
        type: integer
        source: computed
        description: "sum of ProofOfPerformance.spend_amount_cents over proofs with verified == true belonging to MdfClaim rows with validation_state == VALIDATED (calculations.marketing_attainment)"
        default: 0
      - name: marketing_attainment_pct
        type: number
        source: computed
        description: "min(1.0, marketing_qualified_spend_cents / marketing_commitment_cents); exactly 1.0 when marketing_commitment_cents == 0"
        default: 0.0
        constraints: 4 decimal places, round_half_up, range [0.0, 1.0]
      - name: portal_entitlement_level
        type: enum
        source: computed
        description: "portal entitlement derived from tier and tier_status (calculations.portal_entitlement)"
        default: BASIC
        constraints: "one of {BASIC, STANDARD, PREMIUM, ELITE}"
      - name: open_conflict_count
        type: integer
        source: computed
        description: "count of ConflictCase rows whose subject_registration_id belongs to this partner and whose status IN {OPEN, ESCALATED_TIER1, ESCALATED_TIER2}"
        default: 0
      - name: standing_reason
        type: string
        source: system
        description: last reason string written when tier_status changed; null while COMPLIANT since creation
        default: null

  - name: CertificationRecord
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; partner whose engineer holds this certification"
      - name: engineer_name
        type: string
        source: input
        description: name of the certified individual
        constraints: non-empty
      - name: track
        type: enum
        source: input
        description: certification track earned
        constraints: "one of {SALES_PRO, TECH_ASSOCIATE, TECH_EXPERT}"
      - name: credit_weight
        type: integer
        source: computed
        description: "enablement credits this record contributes: SALES_PRO 1, TECH_ASSOCIATE 2, TECH_EXPERT 4"
      - name: status
        type: enum
        source: system
        description: certification standing; flipped to EXPIRED only by the PerformanceReview preparation sweep
        default: ACTIVE
        constraints: "one of {ACTIVE, EXPIRED}"
      - name: issued_at
        type: datetime
        source: input
        description: instant the certification was granted (ISO 8601 UTC, three fractional digits)
      - name: expires_at
        type: datetime
        source: input
        description: instant the certification lapses (ISO 8601 UTC, three fractional digits)
        constraints: must be strictly greater than issued_at

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: account_name
        type: string
        source: input
        description: end-customer account name
        constraints: non-empty, max 160 chars
      - name: region_code
        type: enum
        source: input
        description: sales region the account belongs to
        constraints: "one of {NA, EMEA, APAC}"
      - name: coverage_state
        type: enum
        source: system
        description: who currently owns the pursuit of this account
        default: OPEN_CHANNEL
        constraints: "one of {OPEN_CHANNEL, CHANNEL_PROTECTED, NAMED_DIRECT, DIRECT_LOCKED}"
      - name: protected_until
        type: datetime
        source: system
        description: exclusivity_end_at copied from the DealRegistration that most recently protected this account; null unless coverage_state == CHANNEL_PROTECTED
        default: null
      - name: protected_partner_id
        type: string
        source: system
        description: "FK -> Partner.id; partner holding the current exclusivity; null unless coverage_state == CHANNEL_PROTECTED"
        default: null
      - name: protected_product_line
        type: enum
        source: system
        description: product line the current exclusivity covers; null unless coverage_state == CHANNEL_PROTECTED
        default: null
        constraints: "one of {PLATFORM_SUITE, ANALYTICS_ADDON, SUPPORT_SERVICES}"
      - name: direct_pursuit_owner_id
        type: string
        source: system
        description: opaque X-User-ID of the DirectSalesRep who declared direct pursuit; never compared against any entity id
        default: null
      - name: direct_pursuit_declared_at
        type: datetime
        source: system
        description: instant direct pursuit was declared on this account
        default: null

  - name: AccountMapping
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; partner side of the account mapping agreement"
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account side of the account mapping agreement"
      - name: product_line
        type: enum
        source: input
        description: product line the mapping agreement covers
        constraints: "one of {PLATFORM_SUITE, ANALYTICS_ADDON, SUPPORT_SERVICES}"
      - name: exclusivity_scope
        type: enum
        source: input
        description: "FULL blocks every product line on the account; PRODUCT_LINE blocks only product_line"
        constraints: "one of {FULL, PRODUCT_LINE}"
      - name: effective_from
        type: datetime
        source: input
        description: first instant the mapping is in force (inclusive)
      - name: effective_until
        type: datetime
        source: input
        description: last instant the mapping is in force (inclusive; closed interval)
        constraints: must be strictly greater than effective_from
      - name: mapping_status
        type: enum
        source: system
        description: negotiation and lifecycle state of the agreement
        default: PROPOSED
        constraints: "one of {PROPOSED, COUNTERED, ACTIVE, TERMINATED, EXPIRED}"
      - name: counter_round
        type: integer
        source: system
        description: number of COUNTER responses applied; the third COUNTER is rejected
        default: 0
        constraints: "0 <= counter_round <= 2"
      - name: activated_at
        type: datetime
        source: system
        description: instant mapping_status became ACTIVE
        default: null
      - name: closure_reason
        type: string
        source: system
        description: reason recorded when the mapping reached TERMINATED or EXPIRED
        default: null

  - name: DealRegistration
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; registering partner"
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; end-customer account being registered"
      - name: product_line
        type: enum
        source: input
        description: product line being registered
        constraints: "one of {PLATFORM_SUITE, ANALYTICS_ADDON, SUPPORT_SERVICES}"
      - name: expected_amount_cents
        type: integer
        source: input
        description: partner's forecast deal value in cents
        constraints: ">= 100000 (USD 1,000 minimum registration size)"
      - name: expected_close_date
        type: datetime
        source: input
        description: forecast close instant (ISO 8601 UTC, three fractional digits)
      - name: supersedes_registration_id
        type: string
        source: input
        description: "FK -> DealRegistration.id; predecessor registration this renewal supersedes; null for a first-time registration"
        default: null
      - name: status
        type: enum
        source: system
        description: registration lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED, CONFLICT_HELD, REJECTED, EXPIRED, SUPERSEDED, CONVERTED}"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent SUBMITTED entry; used as the chronological key of conflict resolution
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant the ChannelDirector approved the registration
        default: null
      - name: exclusivity_start_at
        type: datetime
        source: computed
        description: "first instant of the protection window (inclusive); see calculations.exclusivity_window"
        default: null
      - name: exclusivity_end_at
        type: datetime
        source: computed
        description: "end of the protection window, EXCLUSIVE: the window is [exclusivity_start_at, exclusivity_end_at)"
        default: null
      - name: protection_days
        type: integer
        source: computed
        description: "window length in days resolved from the partner's tier at approval time; halved on a SPLIT conflict resolution"
        default: null
      - name: registration_margin_uplift_pct
        type: number
        source: computed
        description: "margin uplift this registration confers on OrderInvoice pricing: 0.06 inside the window, 0.02 after it ends, 0.00 while not APPROVED"
        default: 0.0
        constraints: 4 decimal places
      - name: revision_round
        type: integer
        source: system
        description: number of CHANGES_REQUESTED -> SUBMITTED loops completed; the third resubmission is rejected
        default: 0
        constraints: "0 <= revision_round <= 2"
      - name: closure_reason
        type: string
        source: system
        description: reason recorded on REJECTED, EXPIRED, SUPERSEDED or CONFLICT_HELD
        default: null

  - name: ConflictCase
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; contested account, copied from the subject registration"
      - name: subject_registration_id
        type: string
        source: system
        description: "FK -> DealRegistration.id; registration whose claim is contested (the case is always raised on behalf of this registration's partner)"
      - name: counter_registration_id
        type: string
        source: system
        description: "FK -> DealRegistration.id; competing registration; null when conflict_type == PARTNER_VS_DIRECT"
        default: null
      - name: conflict_type
        type: enum
        source: system
        description: what the subject registration is contested by
        constraints: "one of {PARTNER_VS_PARTNER, PARTNER_VS_DIRECT}"
      - name: status
        type: enum
        source: system
        description: escalation and resolution state
        default: OPEN
        constraints: "one of {OPEN, ESCALATED_TIER1, ESCALATED_TIER2, RESOLVED_PARTNER, RESOLVED_DIRECT, RESOLVED_SPLIT}"
      - name: detected_at
        type: datetime
        source: system
        description: logical-clock instant the case was raised; the instant every window containment test in calculations.conflict_recommendation uses
      - name: escalation_level
        type: integer
        source: system
        description: 0 while OPEN, 1 at ESCALATED_TIER1, 2 at ESCALATED_TIER2
        default: 0
        constraints: "0 <= escalation_level <= 2"
      - name: applied_variant
        type: enum
        source: computed
        description: "which variant of calculations.conflict_recommendation produced recommended_resolution"
        constraints: "one of {REGISTRATION_FIRST, COVERAGE_FIRST}"
      - name: recommended_resolution
        type: enum
        source: computed
        description: "advisory claimant recommendation under the applied variant, copied from one of the two variant fields below; it is NOT the resolution vocabulary the ChannelDirector supplies to POST /conflict-cases/{id}/resolve (which is one of PARTNER, DIRECT, SPLIT)"
        constraints: "one of {GRANT_SUBJECT, GRANT_COUNTER, RELEASE_TO_DIRECT, DISMISS} (calculations.conflict_recommendation RECOMMENDATION_LABELS)"
      - name: recommended_resolution_registration_first
        type: enum
        source: computed
        description: recommendation the REGISTRATION_FIRST variant produces for this same data, stored unconditionally
        constraints: "one of {GRANT_SUBJECT, GRANT_COUNTER, RELEASE_TO_DIRECT, DISMISS}"
      - name: recommended_resolution_coverage_first
        type: enum
        source: computed
        description: recommendation the COVERAGE_FIRST variant produces for this same data, stored unconditionally
        constraints: "one of {GRANT_SUBJECT, GRANT_COUNTER, RELEASE_TO_DIRECT, DISMISS}"
      - name: resolution_note
        type: string
        source: system
        description: free-text note supplied at escalation or resolution
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ChannelDirector who resolved the case
        default: null

  - name: SpecialPricingRequest
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> DealRegistration.id; APPROVED registration the special price is requested against"
      - name: requested_extra_margin_pct
        type: number
        source: input
        description: additional margin points requested on top of the resolved tier margin
        constraints: "> 0.0 and <= 0.1000, 4 decimal places"
      - name: justification
        type: string
        source: input
        description: partner's competitive justification
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: decision state of the request
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, PARTIALLY_APPROVED, DENIED, SUPERSEDED}"
      - name: approved_extra_margin_pct
        type: number
        source: computed
        description: "margin points actually granted; equals requested_extra_margin_pct on APPROVED, the director's lower value on PARTIALLY_APPROVED, 0.0 on DENIED"
        default: null
        constraints: 4 decimal places
      - name: expires_at
        type: datetime
        source: computed
        description: copied from the registration's exclusivity_end_at at creation; the request confers no uplift at or after this instant
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the deciding ChannelDirector
        default: null

  - name: MdfAllocation
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; partner the market development fund period belongs to"
      - name: period_start
        type: datetime
        source: input
        description: first instant of the fiscal period (inclusive)
      - name: period_end
        type: datetime
        source: input
        description: last instant of the fiscal period (inclusive; closed interval for intersection tests)
        constraints: must be strictly greater than period_start
      - name: basis_revenue_cents
        type: integer
        source: computed
        description: "sum of OrderInvoice.invoice_amount_cents over the partner's invoices with status IN {INVOICED, CREDITED} and invoiced_at < period_start"
      - name: allocated_cents
        type: integer
        source: computed
        description: "fund size resolved at creation by calculations.mdf_allocation_sizing; never re-derived afterwards"
      - name: committed_cents
        type: integer
        source: system
        description: cents reserved by MdfClaim rows that are neither settled nor rejected
        default: 0
      - name: paid_cents
        type: integer
        source: system
        description: cents actually disbursed to the partner
        default: 0
      - name: expired_cents
        type: integer
        source: system
        description: cents burned by period close or by a written-off claim
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "allocated_cents - committed_cents - paid_cents - expired_cents; recomputed after every counter mutation"
      - name: status
        type: enum
        source: system
        description: period state
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the period was closed
        default: null

  - name: MdfClaim
    parent: null
    common_fields: true
    fields:
      - name: allocation_id
        type: string
        source: input
        description: "FK -> MdfAllocation.id; fund period the claim draws from"
      - name: activity_type
        type: enum
        source: input
        description: marketing activity being claimed
        constraints: "one of {EVENT, DIGITAL_CAMPAIGN, CONTENT_SYNDICATION}"
      - name: requested_cents
        type: integer
        source: input
        description: reimbursement requested by the partner
        constraints: "> 0"
      - name: validation_state
        type: enum
        source: system
        description: proof-of-performance review dimension; evolves independently of settlement_state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, PROOF_REQUESTED, VALIDATED, REJECTED}"
      - name: settlement_state
        type: enum
        source: system
        description: payment dimension; only advances while validation_state == VALIDATED
        default: UNPAID
        constraints: "one of {UNPAID, APPROVED_FOR_PAYMENT, PAID, WRITTEN_OFF}"
      - name: matched_total_cents
        type: integer
        source: computed
        description: "sum of ProofOfPerformance.matched_line_cents over this claim's verified proofs (calculations.mdf_claim_approval)"
        default: null
      - name: approved_cents
        type: integer
        source: computed
        description: "min(requested_cents, matched_total_cents, allocation.available_cents + this claim's own commitment); 0 when the claim is REJECTED"
        default: null
      - name: proof_round
        type: integer
        source: system
        description: number of PROOF_REQUESTED -> SUBMITTED loops completed; the third proof request is rejected
        default: 0
        constraints: "0 <= proof_round <= 2"
      - name: validated_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ChannelOpsAnalyst who validated or rejected the claim
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ChannelDirector who advanced settlement_state; must differ from validated_by_user_id
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded on REJECTED or WRITTEN_OFF
        default: null

  - name: ProofOfPerformance
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> MdfClaim.id; claim this document supports"
      - name: doc_type
        type: enum
        source: input
        description: kind of evidence uploaded
        constraints: "one of {INVOICE, ATTENDEE_LIST, SCREENSHOT, LEAD_REPORT}"
      - name: spend_amount_cents
        type: integer
        source: input
        description: partner spend evidenced by this document
        constraints: "> 0"
      - name: audience_reach
        type: integer
        source: input
        description: audience or lead count evidenced by this document
        constraints: ">= 0"
      - name: verified
        type: boolean
        source: system
        description: true once a ChannelOpsAnalyst has verified the document
        default: false
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of verification
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the verifying ChannelOpsAnalyst
        default: null
      - name: matched_line_cents
        type: integer
        source: computed
        description: "round_half_up(spend_amount_cents * MATCH_RATE_PCT[partner.tier]) written at verification; null while verified == false"
        default: null

  - name: OrderInvoice
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; partner being invoiced"
      - name: registration_id
        type: string
        source: input
        description: "FK -> DealRegistration.id; registration the order is priced against; null for unregistered business"
        default: null
      - name: order_type
        type: enum
        source: input
        description: "STOCKING is distributor inventory purchase (DISTRIBUTOR only); DROP_SHIP ships to the end customer"
        constraints: "one of {STOCKING, DROP_SHIP}"
      - name: list_amount_cents
        type: integer
        source: input
        description: vendor list value of the order
        constraints: "> 0"
      - name: margin_pct
        type: number
        source: computed
        description: "final partner margin resolved by calculations.channel_margin_resolution"
        constraints: 4 decimal places, round_half_up
      - name: volume_band
        type: enum
        source: computed
        description: "band selected from the PRELIMINARY net amount in step 3 of calculations.channel_margin_resolution"
        constraints: "one of {NONE, MID, HIGH}"
      - name: invoice_amount_cents
        type: integer
        source: computed
        description: "round_half_up(list_amount_cents * (1 - margin_pct)) at creation; reduced by credit_memo_cents when a credit memo is issued"
      - name: margin_value_cents
        type: integer
        source: computed
        description: "list_amount_cents - invoice_amount_cents, always derived by subtraction so the conservation identity holds exactly"
      - name: credit_memo_cents
        type: integer
        source: system
        description: cumulative ship-and-debit credit applied to this invoice
        default: 0
      - name: status
        type: enum
        source: system
        description: invoicing state
        default: PENDING
        constraints: "one of {PENDING, INVOICED, CREDITED}"
      - name: invoiced_at
        type: datetime
        source: system
        description: logical-clock instant the order was invoiced and became revenue
        default: null
      - name: credit_reason
        type: string
        source: system
        description: reason recorded with the credit memo
        default: null

  - name: PerformanceReview
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; partner under review"
      - name: period_start
        type: datetime
        source: input
        description: first instant of the review period (inclusive)
      - name: period_end
        type: datetime
        source: input
        description: last instant of the review period (inclusive)
        constraints: must be strictly greater than period_start
      - name: findings_count
        type: integer
        source: input
        description: number of program-compliance audit findings recorded at preparation time
        constraints: ">= 0"
      - name: remediation_due_at
        type: datetime
        source: computed
        description: "logical-clock instant at preparation + REMEDIATION_DAYS days when findings_count > 0; null otherwise"
        default: null
      - name: provisional_cert_credit
        type: integer
        source: computed
        description: "PROVISIONAL variant certification credits (calculations.partner_tier_scoring)"
      - name: provisional_revenue_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant period revenue (includes PENDING invoices)"
      - name: provisional_score
        type: number
        source: computed
        description: "PROVISIONAL variant weighted score, 2 decimal places"
      - name: recommended_tier
        type: enum
        source: computed
        description: tier implied by the PROVISIONAL variant
        constraints: "one of {REGISTERED, SILVER, GOLD, PLATINUM}"
      - name: final_cert_credit
        type: integer
        source: computed
        description: "FINAL variant certification credits (coverage horizon applied); null until the decision"
        default: null
      - name: final_revenue_cents
        type: integer
        source: computed
        description: "FINAL variant period revenue (PENDING invoices excluded); null until the decision"
        default: null
      - name: final_score
        type: number
        source: computed
        description: "FINAL variant weighted score, 2 decimal places; null until the decision"
        default: null
      - name: approved_tier
        type: enum
        source: computed
        description: tier written onto the partner by an APPROVE decision; null until the decision
        default: null
        constraints: "one of {REGISTERED, SILVER, GOLD, PLATINUM}"
      - name: marketing_attainment_pct
        type: number
        source: computed
        description: partner marketing attainment snapshotted at preparation, 4 decimal places
      - name: status
        type: enum
        source: system
        description: review lifecycle state
        default: PREPARED
        constraints: "one of {PREPARED, FINDINGS_OPEN, REMEDIATED, APPROVED, REJECTED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the preparing ChannelOpsAnalyst
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the deciding ChannelDirector; must differ from prepared_by_user_id
        default: null
      - name: remediation_note
        type: string
        source: system
        description: partner's remediation statement
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: DealRegistration
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED, SUPERSEDED, CONVERTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /deal-registrations/{id}/submit"
        actor: Partner
        preconditions:
          - "registration.partner_id == X-User-ID"
          - "partner.tier_status != SUSPENDED (else ERR_PARTNER_SUSPENDED)"
          - "PerformanceReview rows of this partner with status == FINDINGS_OPEN and remediation_due_at <= clock_now do not exist (else ERR_AUDIT_REMEDIATION_OVERDUE)"
          - "partner.cert_credit_total >= CERT_CREDIT_MIN_TO_REGISTER, and >= CERT_CREDIT_MIN_PLATFORM_SUITE with at least one ACTIVE TECH_EXPERT CertificationRecord when product_line == PLATFORM_SUITE (else ERR_CERTIFICATION_REQUIREMENT_NOT_MET)"
          - "account.coverage_state != DIRECT_LOCKED (else ERR_EXCLUSIVITY_CONFLICT)"
          - "after the expiry sweep below, no OTHER DealRegistration with the same (account_id, product_line) has status == APPROVED with exclusivity_start_at <= clock_now < exclusivity_end_at, unless that registration's id == this registration's supersedes_registration_id and its partner_id == this registration's partner_id (else ERR_EXCLUSIVITY_CONFLICT)"
          - "no OTHER DealRegistration with the same (partner_id, account_id, product_line) has status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, CONFLICT_HELD} (else ERR_DUPLICATE_REGISTRATION)"
          - "no AccountMapping with mapping_status == ACTIVE, a different partner_id, the same account_id, exclusivity_scope == FULL or product_line equal to this registration's product_line, and effective_from <= clock_now <= effective_until exists (else ERR_MAPPING_WINDOW_CONFLICT)"
        side_effects:
          - "EXPIRY SWEEP (runs first, before every precondition that inspects windows): every DealRegistration with the same (account_id, product_line) whose status == APPROVED and exclusivity_end_at <= clock_now transitions APPROVED -> EXPIRED, sets closure_reason = 'WINDOW_ELAPSED' and registration_margin_uplift_pct = 0.02"
          - "EXPIRY SWEEP hop 2: when that swept registration was the account's protector (account.coverage_state == CHANNEL_PROTECTED and account.protected_partner_id == swept.partner_id and account.protected_product_line == swept.product_line and account.protected_until <= clock_now), the account transitions CHANNEL_PROTECTED -> OPEN_CHANNEL with protected_until, protected_partner_id and protected_product_line set to null"
          - "registration.submitted_at = clock_now"
          - "increments DealRegistration.version by 1"
        note: "The sweep is the only producer of DealRegistration.EXPIRED and the only path back to Account.OPEN_CHANNEL; it is deterministic because it reads only the logical clock."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /deal-registrations/{id}/submit"
        actor: Partner
        preconditions:
          - "registration.partner_id == X-User-ID"
          - "registration.revision_round < MAX_REVISION_ROUNDS (else ERR_INVALID_STATE_TRANSITION)"
          - "every precondition of the DRAFT -> SUBMITTED transition, evaluated again against current state"
        side_effects:
          - "same EXPIRY SWEEP as DRAFT -> SUBMITTED"
          - "registration.revision_round += 1"
          - "registration.submitted_at = clock_now (the chronological key of conflict resolution therefore moves later on every revision loop)"
          - "increments DealRegistration.version by 1"
        note: "Revision loop: UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED, at most MAX_REVISION_ROUNDS times."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /deal-registrations/{id}/review with action = START_REVIEW"
        actor: ChannelOpsAnalyst
        preconditions: ["registration.status == SUBMITTED"]
        side_effects: ["increments DealRegistration.version by 1"]
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /deal-registrations/{id}/review with action = REQUEST_CHANGES"
        actor: ChannelOpsAnalyst
        preconditions: ["registration.status == UNDER_REVIEW", "reviewer_note is present and non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["registration.closure_reason = reviewer_note", "increments DealRegistration.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /deal-registrations/{id}/decision with decision = APPROVE"
        actor: ChannelDirector
        preconditions:
          - "registration.status == UNDER_REVIEW"
          - "partner.tier_status != SUSPENDED (else ERR_PARTNER_SUSPENDED)"
          - "no OTHER DealRegistration with the same (account_id, product_line) has status == APPROVED with exclusivity_start_at <= clock_now < exclusivity_end_at, unless its id == this registration's supersedes_registration_id (else ERR_EXCLUSIVITY_CONFLICT)"
          - "when supersedes_registration_id is not null, the predecessor's partner_id == this registration's partner_id, its account_id and product_line match, and its status == APPROVED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "registration.approved_at = clock_now; protection_days = PROTECTION_DAYS_BY_TIER[partner.tier]; exclusivity_start_at and exclusivity_end_at per calculations.exclusivity_window; registration_margin_uplift_pct = 0.06"
          - "CASCADE A hop 1: because the registration became APPROVED, account.coverage_state := CHANNEL_PROTECTED, account.protected_until := registration.exclusivity_end_at, account.protected_partner_id := registration.partner_id, account.protected_product_line := registration.product_line (increments Account.version by 1)"
          - "CASCADE A hop 2: because the account is now CHANNEL_PROTECTED for this (account_id, product_line), every OTHER DealRegistration on the same (account_id, product_line) whose status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED} transitions to CONFLICT_HELD with closure_reason = 'ACCOUNT_PROTECTED_BY_OTHER_PARTNER'"
          - "CASCADE A hop 3: because each of those registrations entered CONFLICT_HELD, a ConflictCase is created for each with conflict_type = PARTNER_VS_PARTNER, subject_registration_id = the held registration, counter_registration_id = this approved registration, account_id = the shared account, detected_at = clock_now, status = OPEN, and the three recommendation fields of calculations.conflict_recommendation"
          - "CASCADE A hop 4: because each ConflictCase was created OPEN, the held registration's partner has open_conflict_count recomputed; when the recomputed value >= CONFLICT_PROBATION_THRESHOLD and that partner's tier_status == COMPLIANT, tier_status := PROBATION with standing_reason = 'OPEN_CONFLICT_THRESHOLD' and portal_entitlement_level recomputed (one ladder step down per calculations.portal_entitlement, so a REGISTERED partner stays BASIC and a GOLD partner drops to STANDARD)"
          - "when supersedes_registration_id is not null: the predecessor transitions APPROVED -> SUPERSEDED with closure_reason = 'SUPERSEDED_BY_RENEWAL' (it is exempt from CASCADE A hop 2 because it is not in {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED})"
          - "increments DealRegistration.version by 1"
        note: "Cascade A is depth 4: approval -> account coverage -> sibling registrations held -> conflict cases raised -> partner standing downgraded."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /deal-registrations/{id}/decision with decision = REJECT"
        actor: ChannelDirector
        preconditions: ["registration.status == UNDER_REVIEW", "reject_reason is present and non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["registration.closure_reason = reject_reason", "registration.registration_margin_uplift_pct = 0.0", "increments DealRegistration.version by 1"]
      - from: SUBMITTED
        to: CONFLICT_HELD
        trigger: "system cascade from POST /deal-registrations/{id}/decision (APPROVE) on a competing registration, or from POST /accounts/{id}/direct-pursuit"
        actor: system
        preconditions: ["another registration on the same (account_id, product_line) reached APPROVED, or a DirectSalesRep declared pursuit on a CHANNEL_PROTECTED account"]
        side_effects: ["registration.closure_reason set to the cascade reason", "a ConflictCase is created as described in CASCADE A hop 3 / CASCADE D hop 2", "increments DealRegistration.version by 1"]
      - from: UNDER_REVIEW
        to: CONFLICT_HELD
        trigger: "system cascade from POST /deal-registrations/{id}/decision (APPROVE) on a competing registration"
        actor: system
        preconditions: ["another registration on the same (account_id, product_line) reached APPROVED"]
        side_effects: ["identical to SUBMITTED -> CONFLICT_HELD"]
      - from: CHANGES_REQUESTED
        to: CONFLICT_HELD
        trigger: "system cascade from POST /deal-registrations/{id}/decision (APPROVE) on a competing registration"
        actor: system
        preconditions: ["another registration on the same (account_id, product_line) reached APPROVED"]
        side_effects: ["identical to SUBMITTED -> CONFLICT_HELD"]
      - from: CONFLICT_HELD
        to: SUBMITTED
        trigger: "system cascade from POST /conflict-cases/{id}/resolve with resolution = PARTNER"
        actor: system
        preconditions: ["the case's subject_registration_id is this registration and the director resolved in favour of the partner"]
        side_effects:
          - "registration.closure_reason := null; submitted_at is NOT rewritten (the original chronological key survives resolution)"
          - "increments DealRegistration.version by 1"
      - from: CONFLICT_HELD
        to: APPROVED
        trigger: "system cascade from POST /conflict-cases/{id}/resolve with resolution = SPLIT"
        actor: system
        preconditions: ["the case's subject_registration_id is this registration"]
        side_effects:
          - "registration.approved_at = clock_now; protection_days = floor(PROTECTION_DAYS_BY_TIER[partner.tier] / 2); exclusivity window per calculations.exclusivity_window; registration_margin_uplift_pct = 0.02 (a split award never earns the full uplift)"
          - "account.protected_until := max(account.protected_until, this registration's exclusivity_end_at); account.coverage_state stays CHANNEL_PROTECTED (increments Account.version by 1)"
          - "increments DealRegistration.version by 1"
      - from: CONFLICT_HELD
        to: REJECTED
        trigger: "system cascade from POST /conflict-cases/{id}/resolve with resolution = DIRECT"
        actor: system
        preconditions: ["the case's subject_registration_id is this registration"]
        side_effects: ["registration.closure_reason = 'RESOLVED_DIRECT'", "registration.registration_margin_uplift_pct = 0.0", "increments DealRegistration.version by 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system expiry sweep during POST /deal-registrations/{id}/submit"
        actor: system
        preconditions: ["registration.exclusivity_end_at <= clock_now"]
        side_effects: ["registration.closure_reason = 'WINDOW_ELAPSED'", "registration_margin_uplift_pct = 0.02", "account may transition CHANNEL_PROTECTED -> OPEN_CHANNEL per EXPIRY SWEEP hop 2", "increments DealRegistration.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade from POST /deal-registrations/{id}/decision (APPROVE) on the successor registration"
        actor: system
        preconditions: ["successor.supersedes_registration_id == this registration's id and successor.partner_id == this registration's partner_id"]
        side_effects: ["registration.closure_reason = 'SUPERSEDED_BY_RENEWAL'", "increments DealRegistration.version by 1"]
      - from: APPROVED
        to: CONVERTED
        trigger: "POST /deal-registrations/{id}/convert"
        actor: ChannelOpsAnalyst
        preconditions:
          - "registration.status == APPROVED"
          - "at least one OrderInvoice with registration_id == this registration and status IN {INVOICED, CREDITED} exists (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["registration.closure_reason = 'CONVERTED'", "increments DealRegistration.version by 1"]

  - entity: Account
    initial_state: OPEN_CHANNEL
    terminal_states: [DIRECT_LOCKED]
    transitions:
      - from: OPEN_CHANNEL
        to: CHANNEL_PROTECTED
        trigger: "system cascade from POST /deal-registrations/{id}/decision (APPROVE)"
        actor: system
        preconditions: ["a registration on this account reached APPROVED"]
        side_effects: ["protected_until, protected_partner_id, protected_product_line written per CASCADE A hop 1", "increments Account.version by 1"]
      - from: CHANNEL_PROTECTED
        to: CHANNEL_PROTECTED
        trigger: "system cascade from POST /deal-registrations/{id}/decision (APPROVE) on a renewal that supersedes the current protector, or from POST /conflict-cases/{id}/resolve with resolution = SPLIT"
        actor: system
        preconditions: ["the approving registration's supersedes_registration_id == account.protected_partner_id's current protecting registration, or the resolution is SPLIT"]
        side_effects: ["protected_until := the new window's exclusivity_end_at (renewal) or max(old, new) (split)", "increments Account.version by 1"]
      - from: CHANNEL_PROTECTED
        to: OPEN_CHANNEL
        trigger: "system expiry sweep during POST /deal-registrations/{id}/submit"
        actor: system
        preconditions: ["account.protected_until <= clock_now and the protecting registration was swept APPROVED -> EXPIRED"]
        side_effects: ["protected_until, protected_partner_id, protected_product_line := null", "increments Account.version by 1"]
      - from: OPEN_CHANNEL
        to: NAMED_DIRECT
        trigger: "POST /accounts/{id}/direct-pursuit"
        actor: DirectSalesRep
        preconditions: ["account.coverage_state == OPEN_CHANNEL"]
        side_effects: ["direct_pursuit_owner_id := X-User-ID; direct_pursuit_declared_at := clock_now", "increments Account.version by 1"]
      - from: CHANNEL_PROTECTED
        to: CHANNEL_PROTECTED
        trigger: "POST /accounts/{id}/direct-pursuit"
        actor: DirectSalesRep
        preconditions: ["account.coverage_state == CHANNEL_PROTECTED"]
        side_effects:
          - "direct_pursuit_owner_id := X-User-ID; direct_pursuit_declared_at := clock_now"
          - "CASCADE D hop 1: because direct pursuit was declared while the account was CHANNEL_PROTECTED, a ConflictCase is created with conflict_type = PARTNER_VS_DIRECT, subject_registration_id = the protecting registration (the unique DealRegistration with status == APPROVED, partner_id == account.protected_partner_id and product_line == account.protected_product_line), counter_registration_id = null, account_id = this account, detected_at = clock_now, status = OPEN and the three recommendation fields of calculations.conflict_recommendation"
          - "CASCADE D hop 2: because that case exists, the protecting registration's closure_reason := 'DIRECT_PURSUIT_CONTESTED' while its status stays APPROVED and its window stays intact until the case resolves (increments DealRegistration.version by 1)"
          - "CASCADE D hop 3: because the case was created OPEN, the protecting partner's open_conflict_count is recomputed; when it reaches CONFLICT_PROBATION_THRESHOLD and tier_status == COMPLIANT, tier_status := PROBATION with standing_reason = 'OPEN_CONFLICT_THRESHOLD' and portal_entitlement_level recomputed"
          - "increments Account.version by 1"
      - from: NAMED_DIRECT
        to: DIRECT_LOCKED
        trigger: "system cascade from POST /conflict-cases/{id}/resolve with resolution = DIRECT"
        actor: system
        preconditions: ["a case on this account resolved DIRECT"]
        side_effects: ["protected_until, protected_partner_id, protected_product_line := null", "increments Account.version by 1"]
      - from: CHANNEL_PROTECTED
        to: DIRECT_LOCKED
        trigger: "system cascade from POST /conflict-cases/{id}/resolve with resolution = DIRECT"
        actor: system
        preconditions: ["a case on this account resolved DIRECT"]
        side_effects: ["the subject registration transitions CONFLICT_HELD -> REJECTED or APPROVED -> REJECTED per the ConflictCase machine", "protected_until, protected_partner_id, protected_product_line := null", "increments Account.version by 1"]

  - entity: CertificationRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system certification sweep during POST /performance-reviews"
        actor: system
        preconditions: ["certification.expires_at <= clock_now"]
        side_effects:
          - "CASCADE E hop 1: because the record left ACTIVE, partner.cert_credit_total is recomputed by calculations.certification_credit_rollup"
          - "increments CertificationRecord.version by 1"
        note: "Preparing a PerformanceReview is the program's enablement checkpoint; it is the only producer of CertificationRecord.EXPIRED."

  - entity: AccountMapping
    initial_state: PROPOSED
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /account-mappings/{id}/respond with action = COUNTER"
        actor: Partner
        preconditions:
          - "mapping.partner_id == X-User-ID (else ERR_PARTNER_SCOPE_VIOLATION)"
          - "mapping.mapping_status == PROPOSED"
          - "mapping.counter_round < MAX_COUNTER_ROUNDS (else ERR_INVALID_STATE_TRANSITION)"
          - "effective_from and effective_until are both present, effective_until > effective_from (else ERR_INVALID_REQUEST)"
          - "the countered window passes calculations.mapping_window_conflict against every other mapping with mapping_status IN {PROPOSED, COUNTERED, ACTIVE} on the same (account_id, product_line) scope (else ERR_MAPPING_WINDOW_CONFLICT)"
        side_effects:
          - "mapping.effective_from and effective_until := the countered window"
          - "mapping.counter_round += 1"
          - "increments AccountMapping.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /account-mappings/{id}/respond with action = COUNTER"
        actor: ChannelOpsAnalyst
        preconditions:
          - "mapping.mapping_status == COUNTERED"
          - "mapping.counter_round < MAX_COUNTER_ROUNDS (else ERR_INVALID_STATE_TRANSITION)"
          - "effective_from and effective_until are both present, effective_until > effective_from (else ERR_INVALID_REQUEST)"
          - "the countered window passes calculations.mapping_window_conflict (else ERR_MAPPING_WINDOW_CONFLICT)"
        side_effects:
          - "mapping.effective_from and effective_until := the countered window"
          - "mapping.counter_round += 1"
          - "increments AccountMapping.version by 1"
        note: "Negotiation cycle PROPOSED -> COUNTERED -> PROPOSED; the vendor counters as ChannelOpsAnalyst, the partner counters as Partner, and counter_round is shared by both sides."
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /account-mappings/{id}/respond with action = ACCEPT"
        actor: Partner
        preconditions:
          - "mapping.partner_id == X-User-ID (else ERR_PARTNER_SCOPE_VIOLATION)"
          - "mapping.mapping_status == PROPOSED"
          - "the stored window still passes calculations.mapping_window_conflict against mappings with mapping_status == ACTIVE (else ERR_MAPPING_WINDOW_CONFLICT)"
        side_effects: ["mapping.activated_at := clock_now", "increments AccountMapping.version by 1"]
      - from: COUNTERED
        to: ACTIVE
        trigger: "POST /account-mappings/{id}/respond with action = ACCEPT"
        actor: ChannelOpsAnalyst
        preconditions:
          - "mapping.mapping_status == COUNTERED"
          - "the stored window still passes calculations.mapping_window_conflict against mappings with mapping_status == ACTIVE (else ERR_MAPPING_WINDOW_CONFLICT)"
        side_effects: ["mapping.activated_at := clock_now", "increments AccountMapping.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /account-mappings/{id}/respond with action = TERMINATE"
        actor: ChannelOpsAnalyst
        preconditions: ["mapping.mapping_status == ACTIVE", "terminated_reason present and non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["mapping.closure_reason := terminated_reason", "increments AccountMapping.version by 1"]
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /account-mappings/{id}/respond with action = TERMINATE"
        actor: ChannelOpsAnalyst
        preconditions: ["mapping.mapping_status == PROPOSED", "terminated_reason present and non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["mapping.closure_reason := terminated_reason", "increments AccountMapping.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system mapping sweep during POST /account-mappings"
        actor: system
        preconditions: ["mapping.effective_until < clock_now"]
        side_effects:
          - "mapping.closure_reason := 'WINDOW_ELAPSED'"
          - "increments AccountMapping.version by 1"
        note: "The sweep runs before the cooldown/overlap test of calculations.mapping_window_conflict, and an EXPIRED mapping still contributes its cooldown buffer."

  - entity: ConflictCase
    initial_state: OPEN
    terminal_states: [RESOLVED_PARTNER, RESOLVED_DIRECT, RESOLVED_SPLIT]
    transitions:
      - from: OPEN
        to: ESCALATED_TIER1
        trigger: "POST /conflict-cases/{id}/escalate"
        actor: Partner
        preconditions:
          - "case.status == OPEN"
          - "the acting Partner's X-User-ID == the subject registration's partner_id (else ERR_PARTNER_SCOPE_VIOLATION)"
        side_effects: ["case.escalation_level := 1", "case.resolution_note := escalation_note", "increments ConflictCase.version by 1"]
      - from: ESCALATED_TIER1
        to: ESCALATED_TIER2
        trigger: "POST /conflict-cases/{id}/escalate"
        actor: DirectSalesRep
        preconditions: ["case.status == ESCALATED_TIER1"]
        side_effects: ["case.escalation_level := 2", "case.resolution_note := escalation_note", "increments ConflictCase.version by 1"]
        note: "Escalation ladder is capped at MAX_ESCALATION_LEVEL: escalating a case whose escalation_level is already 2 is rejected with ERR_CONFLICT_ESCALATION_LIMIT and writes nothing (validations priority 46)."
      - from: OPEN
        to: RESOLVED_PARTNER
        trigger: "POST /conflict-cases/{id}/resolve with resolution = PARTNER"
        actor: ChannelDirector
        preconditions:
          - "case.status IN {OPEN, ESCALATED_TIER1, ESCALATED_TIER2}"
          - "resolution_note present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "case.resolved_by_user_id := X-User-ID"
          - "when conflict_type == PARTNER_VS_PARTNER: the subject registration transitions CONFLICT_HELD -> SUBMITTED so the partner can be reviewed again"
          - "when conflict_type == PARTNER_VS_DIRECT: the subject registration keeps status APPROVED with closure_reason := null, and account.direct_pursuit_owner_id := null (increments Account.version by 1)"
          - "the subject registration's partner has open_conflict_count recomputed; when the recomputed value < CONFLICT_PROBATION_THRESHOLD and tier_status == PROBATION with standing_reason == 'OPEN_CONFLICT_THRESHOLD', tier_status := COMPLIANT and portal_entitlement_level recomputed"
          - "increments ConflictCase.version by 1"
      - from: ESCALATED_TIER1
        to: RESOLVED_PARTNER
        trigger: "POST /conflict-cases/{id}/resolve with resolution = PARTNER"
        actor: ChannelDirector
        preconditions: ["case.status == ESCALATED_TIER1", "resolution_note present"]
        side_effects: ["identical to OPEN -> RESOLVED_PARTNER"]
      - from: ESCALATED_TIER2
        to: RESOLVED_PARTNER
        trigger: "POST /conflict-cases/{id}/resolve with resolution = PARTNER"
        actor: ChannelDirector
        preconditions: ["case.status == ESCALATED_TIER2", "resolution_note present"]
        side_effects: ["identical to OPEN -> RESOLVED_PARTNER"]
      - from: OPEN
        to: RESOLVED_DIRECT
        trigger: "POST /conflict-cases/{id}/resolve with resolution = DIRECT"
        actor: ChannelDirector
        preconditions: ["case.status IN {OPEN, ESCALATED_TIER1, ESCALATED_TIER2}", "resolution_note present and non-empty (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "case.resolved_by_user_id := X-User-ID"
          - "the subject registration transitions to REJECTED (from CONFLICT_HELD when PARTNER_VS_PARTNER, from APPROVED when PARTNER_VS_DIRECT) with closure_reason = 'RESOLVED_DIRECT' and registration_margin_uplift_pct := 0.0"
          - "the account transitions to DIRECT_LOCKED with protected_until, protected_partner_id and protected_product_line cleared (increments Account.version by 1)"
          - "the subject registration's partner has open_conflict_count recomputed, with the PROBATION-clearing rule of OPEN -> RESOLVED_PARTNER applied"
          - "increments ConflictCase.version by 1"
      - from: ESCALATED_TIER2
        to: RESOLVED_DIRECT
        trigger: "POST /conflict-cases/{id}/resolve with resolution = DIRECT"
        actor: ChannelDirector
        preconditions: ["case.status == ESCALATED_TIER2", "resolution_note present"]
        side_effects: ["identical to OPEN -> RESOLVED_DIRECT"]
      - from: OPEN
        to: RESOLVED_SPLIT
        trigger: "POST /conflict-cases/{id}/resolve with resolution = SPLIT"
        actor: ChannelDirector
        preconditions:
          - "case.status IN {OPEN, ESCALATED_TIER1, ESCALATED_TIER2}"
          - "case.conflict_type == PARTNER_VS_PARTNER (a direct-sales conflict cannot be split; else ERR_INVALID_STATE_TRANSITION)"
          - "resolution_note present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "case.resolved_by_user_id := X-User-ID"
          - "the subject registration transitions CONFLICT_HELD -> APPROVED with half protection days per the DealRegistration machine"
          - "the account keeps coverage_state == CHANNEL_PROTECTED with protected_until := max(existing, the split window's exclusivity_end_at) (increments Account.version by 1)"
          - "the subject registration's partner has open_conflict_count recomputed, with the PROBATION-clearing rule applied"
          - "increments ConflictCase.version by 1"
      - from: ESCALATED_TIER1
        to: RESOLVED_SPLIT
        trigger: "POST /conflict-cases/{id}/resolve with resolution = SPLIT"
        actor: ChannelDirector
        preconditions: ["case.status == ESCALATED_TIER1", "case.conflict_type == PARTNER_VS_PARTNER", "resolution_note present"]
        side_effects: ["identical to OPEN -> RESOLVED_SPLIT"]

  - entity: SpecialPricingRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /special-pricing-requests/{id}/decision with decision = APPROVE"
        actor: ChannelDirector
        preconditions:
          - "spr.status == SUBMITTED"
          - "clock_now < spr.expires_at (else ERR_EXCLUSIVITY_WINDOW_EXPIRED)"
          - "the resolved margin the grant implies satisfies calculations.channel_margin_resolution's tier ceiling: BASE_MARGIN_PCT[partner.tier] + 0.06 + requested_extra_margin_pct <= TIER_MARGIN_CEILING_PCT[partner.tier] (else ERR_MARGIN_CEILING_EXCEEDED)"
        side_effects:
          - "spr.approved_extra_margin_pct := spr.requested_extra_margin_pct; decided_by_user_id := X-User-ID"
          - "increments SpecialPricingRequest.version by 1"
      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: "POST /special-pricing-requests/{id}/decision with decision = PARTIAL"
        actor: ChannelDirector
        preconditions:
          - "spr.status == SUBMITTED"
          - "clock_now < spr.expires_at (else ERR_EXCLUSIVITY_WINDOW_EXPIRED)"
          - "approved_extra_margin_pct is present, > 0.0 and < spr.requested_extra_margin_pct (else ERR_INVALID_REQUEST)"
          - "BASE_MARGIN_PCT[partner.tier] + 0.06 + approved_extra_margin_pct <= TIER_MARGIN_CEILING_PCT[partner.tier] (else ERR_MARGIN_CEILING_EXCEEDED)"
        side_effects: ["spr.approved_extra_margin_pct := the decided value; decided_by_user_id := X-User-ID", "increments SpecialPricingRequest.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /special-pricing-requests/{id}/decision with decision = DENY"
        actor: ChannelDirector
        preconditions: ["spr.status == SUBMITTED"]
        side_effects: ["spr.approved_extra_margin_pct := 0.0; decided_by_user_id := X-User-ID", "increments SpecialPricingRequest.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system cascade from POST /special-pricing-requests creating a newer request on the same registration"
        actor: system
        preconditions: ["a newer SpecialPricingRequest was created against the same registration_id"]
        side_effects: ["spr.approved_extra_margin_pct := 0.0", "increments SpecialPricingRequest.version by 1"]
        note: "This legitimate supersede is exactly why POST /special-pricing-requests carries expected_registration_version (see concurrency_rules.spr-create-stale-registration)."

  - entity: MdfAllocation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mdf-allocations/{id}/close"
        actor: ChannelOpsAnalyst
        preconditions: ["allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"]
        side_effects:
          - "CASCADE C step 1 (runs first): every MdfClaim of this allocation with validation_state IN {SUBMITTED, PROOF_REQUESTED} transitions to validation_state = REJECTED with approved_cents = 0 and rejection_reason = 'PERIOD_CLOSED', and allocation.committed_cents -= that claim's requested_cents"
          - "CASCADE C step 2 (runs second): every MdfClaim of this allocation with validation_state == VALIDATED and settlement_state IN {UNPAID, APPROVED_FOR_PAYMENT} transitions to settlement_state = WRITTEN_OFF with rejection_reason = 'PERIOD_CLOSED', allocation.committed_cents -= that claim's approved_cents and allocation.expired_cents += that claim's approved_cents"
          - "CASCADE C step 3 (runs third, on the balance the first two steps produced): allocation.expired_cents += allocation.available_cents, then allocation.available_cents := 0"
          - "CASCADE C step 4: allocation.status := CLOSED, closed_at := clock_now"
          - "increments MdfAllocation.version by 1"
        note: "Step order is pinned: running step 3 before steps 1 and 2 would burn a smaller balance and break the conservation identity of calculations.mdf_fund_conservation."

  - entity: MdfClaim
    initial_state: "validation_state = SUBMITTED, settlement_state = UNPAID"
    terminal_states: ["validation_state = REJECTED", "settlement_state = PAID", "settlement_state = WRITTEN_OFF"]
    transitions:
      - from: "validation_state = SUBMITTED"
        to: "validation_state = PROOF_REQUESTED"
        trigger: "POST /mdf-claims/{id}/validate with decision = REQUEST_PROOF"
        actor: ChannelOpsAnalyst
        preconditions:
          - "claim.validation_state == SUBMITTED"
          - "claim.proof_round < MAX_PROOF_ROUNDS (else ERR_INVALID_STATE_TRANSITION)"
          - "allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"
        side_effects: ["claim.proof_round += 1", "increments MdfClaim.version by 1"]
      - from: "validation_state = PROOF_REQUESTED"
        to: "validation_state = SUBMITTED"
        trigger: "POST /mdf-claims/{id}/proofs"
        actor: Partner
        preconditions: ["claim.validation_state == PROOF_REQUESTED", "the acting Partner owns the claim's allocation (else ERR_PARTNER_SCOPE_VIOLATION)", "allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"]
        side_effects: ["a ProofOfPerformance row is created with verified = false and matched_line_cents = null", "increments MdfClaim.version by 1"]
        note: "Proof loop SUBMITTED -> PROOF_REQUESTED -> SUBMITTED, at most MAX_PROOF_ROUNDS times; only the analyst's REQUEST_PROOF consumes a round."
      - from: "validation_state = SUBMITTED"
        to: "validation_state = SUBMITTED"
        trigger: "POST /mdf-claims/{id}/proofs"
        actor: Partner
        preconditions: ["claim.validation_state == SUBMITTED", "the acting Partner owns the claim's allocation (else ERR_PARTNER_SCOPE_VIOLATION)", "allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"]
        side_effects: ["a ProofOfPerformance row is created with verified = false and matched_line_cents = null", "claim.proof_round is NOT incremented", "increments MdfClaim.version by 1"]
        note: "A partner may attach any number of proof documents while the claim is SUBMITTED; this self-loop is what makes a multi-line claim reachable without consuming proof rounds."
      - from: "validation_state = SUBMITTED"
        to: "validation_state = VALIDATED"
        trigger: "POST /mdf-claims/{id}/validate with decision = VALIDATE"
        actor: ChannelOpsAnalyst
        preconditions:
          - "claim.validation_state == SUBMITTED"
          - "allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"
          - "at least one ProofOfPerformance of this claim has verified == true (else ERR_NO_VERIFIED_PROOF)"
        side_effects:
          - "claim.matched_total_cents and claim.approved_cents written per calculations.mdf_claim_approval; validated_by_user_id := X-User-ID"
          - "allocation.committed_cents -= (claim.requested_cents - claim.approved_cents); allocation.available_cents recomputed (the unmatched remainder returns to the pool)"
          - "partner.marketing_qualified_spend_cents and marketing_attainment_pct recomputed per calculations.marketing_attainment; when the recomputed attainment >= MARKETING_COMPLIANCE_MIN_PCT and tier_status == PROBATION with standing_reason == 'MARKETING_ATTAINMENT_SHORTFALL', tier_status := COMPLIANT and portal_entitlement_level recomputed"
          - "increments MdfClaim.version by 1"
      - from: "validation_state = SUBMITTED"
        to: "validation_state = REJECTED"
        trigger: "POST /mdf-claims/{id}/validate with decision = REJECT"
        actor: ChannelOpsAnalyst
        preconditions: ["claim.validation_state == SUBMITTED", "rejection_reason present and non-empty (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "claim.approved_cents := 0; validated_by_user_id := X-User-ID; rejection_reason recorded"
          - "allocation.committed_cents -= claim.requested_cents; allocation.available_cents recomputed"
          - "increments MdfClaim.version by 1"
      - from: "validation_state = PROOF_REQUESTED"
        to: "validation_state = REJECTED"
        trigger: "POST /mdf-claims/{id}/validate with decision = REJECT"
        actor: ChannelOpsAnalyst
        preconditions: ["claim.validation_state == PROOF_REQUESTED", "rejection_reason present and non-empty"]
        side_effects: ["identical to SUBMITTED -> REJECTED"]
      - from: "validation_state = VALIDATED"
        to: "validation_state = REJECTED"
        trigger: "POST /mdf-claims/{id}/validate with decision = REJECT"
        actor: ChannelOpsAnalyst
        preconditions:
          - "claim.validation_state == VALIDATED"
          - "claim.settlement_state == UNPAID (a claim already approved for payment or paid can no longer be clawed back; else ERR_INVALID_STATE_TRANSITION)"
          - "rejection_reason present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "CASCADE B hop 1: claim.validation_state := REJECTED, approved_cents := 0, rejection_reason recorded, validated_by_user_id := X-User-ID"
          - "CASCADE B hop 2: because the claim left VALIDATED, allocation.committed_cents -= the claim's previous approved_cents and allocation.available_cents is recomputed"
          - "CASCADE B hop 3: because the claim is no longer VALIDATED, partner.marketing_qualified_spend_cents drops by the sum of spend_amount_cents over this claim's verified proofs and partner.marketing_attainment_pct is recomputed"
          - "CASCADE B hop 4: because the recomputed attainment fell below MARKETING_COMPLIANCE_MIN_PCT while tier_status == COMPLIANT, partner.tier_status := PROBATION with standing_reason = 'MARKETING_ATTAINMENT_SHORTFALL' and portal_entitlement_level recomputed"
          - "increments MdfClaim.version by 1"
        note: "Cascade B is depth 4 and originates from a different trigger than cascade A: claim claw-back -> fund release -> attainment drop -> partner standing downgrade."
      - from: "settlement_state = UNPAID"
        to: "settlement_state = APPROVED_FOR_PAYMENT"
        trigger: "POST /mdf-claims/{id}/settlement with action = APPROVE_PAYMENT"
        actor: ChannelDirector
        preconditions:
          - "claim.validation_state == VALIDATED (else ERR_CLAIM_NOT_VALIDATED)"
          - "claim.settlement_state == UNPAID"
          - "allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"
          - "X-User-ID != claim.validated_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects: ["claim.settled_by_user_id := X-User-ID", "increments MdfClaim.version by 1"]
        note: "Parallel dimension: settlement_state advances only while validation_state == VALIDATED, but the two dimensions are stored and asserted independently."
      - from: "settlement_state = APPROVED_FOR_PAYMENT"
        to: "settlement_state = PAID"
        trigger: "POST /mdf-claims/{id}/settlement with action = PAY"
        actor: ChannelDirector
        preconditions:
          - "claim.settlement_state == APPROVED_FOR_PAYMENT"
          - "allocation.status == OPEN (else ERR_ALLOCATION_CLOSED)"
          - "X-User-ID != claim.validated_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects:
          - "allocation.committed_cents -= claim.approved_cents; allocation.paid_cents += claim.approved_cents; allocation.available_cents recomputed"
          - "claim.settled_by_user_id := X-User-ID"
          - "increments MdfClaim.version by 1"
      - from: "settlement_state = UNPAID"
        to: "settlement_state = WRITTEN_OFF"
        trigger: "POST /mdf-claims/{id}/settlement with action = WRITE_OFF"
        actor: ChannelDirector
        preconditions:
          - "claim.validation_state == VALIDATED (else ERR_CLAIM_NOT_VALIDATED)"
          - "claim.settlement_state == UNPAID"
          - "X-User-ID != claim.validated_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects:
          - "allocation.committed_cents -= claim.approved_cents; allocation.expired_cents += claim.approved_cents; allocation.available_cents recomputed (the write-off compensates the commitment without returning the money to the pool)"
          - "claim.settled_by_user_id := X-User-ID; rejection_reason := 'WRITTEN_OFF'"
          - "increments MdfClaim.version by 1"
      - from: "settlement_state = APPROVED_FOR_PAYMENT"
        to: "settlement_state = WRITTEN_OFF"
        trigger: "POST /mdf-claims/{id}/settlement with action = WRITE_OFF, or system cascade from POST /mdf-allocations/{id}/close"
        actor: ChannelDirector | system
        preconditions: ["claim.settlement_state == APPROVED_FOR_PAYMENT", "for the direct action: X-User-ID != claim.validated_by_user_id (else ERR_SOD_SAME_ACTOR)"]
        side_effects: ["identical to UNPAID -> WRITTEN_OFF"]

  - entity: OrderInvoice
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /order-invoices/{id}/invoice"
        actor: ChannelOpsAnalyst
        preconditions: ["invoice.status == PENDING", "partner.tier_status != SUSPENDED (else ERR_PARTNER_SUSPENDED)"]
        side_effects:
          - "invoice.invoiced_at := clock_now"
          - "partner.trailing_revenue_cents recomputed per calculations.partner_revenue_rollup"
          - "increments OrderInvoice.version by 1"
      - from: INVOICED
        to: CREDITED
        trigger: "POST /order-invoices/{id}/credit-memo"
        actor: ChannelOpsAnalyst
        preconditions:
          - "invoice.status == INVOICED"
          - "credit_memo_cents > 0 and credit_memo_cents < invoice.invoice_amount_cents (else ERR_CREDIT_EXCEEDS_INVOICE)"
          - "the effective margin after the credit, (list_amount_cents - (invoice_amount_cents - credit_memo_cents)) / list_amount_cents rounded to 4 decimals half-up, must be <= TIER_MARGIN_CEILING_PCT[partner.tier] (else ERR_MARGIN_CEILING_EXCEEDED)"
        side_effects:
          - "invoice.credit_memo_cents := credit_memo_cents; invoice.invoice_amount_cents -= credit_memo_cents; invoice.margin_value_cents := invoice.list_amount_cents - invoice.invoice_amount_cents; invoice.margin_pct := round_half_up(margin_value_cents / list_amount_cents, 4)"
          - "invoice.credit_reason := credit_reason"
          - "partner.trailing_revenue_cents recomputed per calculations.partner_revenue_rollup"
          - "increments OrderInvoice.version by 1"
        note: "Ship-and-debit compensation: margin_value_cents is always re-derived by subtraction so calculations.channel_margin_conservation holds exactly."
      - from: CREDITED
        to: CREDITED
        trigger: "POST /order-invoices/{id}/credit-memo"
        actor: ChannelOpsAnalyst
        preconditions:
          - "invoice.status == CREDITED"
          - "credit_memo_cents > 0 and credit_memo_cents < invoice.invoice_amount_cents (else ERR_CREDIT_EXCEEDS_INVOICE)"
          - "the cumulative effective margin after this credit must be <= TIER_MARGIN_CEILING_PCT[partner.tier] (else ERR_MARGIN_CEILING_EXCEEDED)"
        side_effects:
          - "invoice.credit_memo_cents += credit_memo_cents; the remaining fields are recomputed exactly as in INVOICED -> CREDITED"
          - "increments OrderInvoice.version by 1"
        note: "Repeated ship-and-debit credits accumulate on the same invoice; each one must independently pass the tier margin ceiling."

  - entity: PerformanceReview
    initial_state: PREPARED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PREPARED
        to: FINDINGS_OPEN
        trigger: "POST /performance-reviews (automatic on creation when findings_count > 0)"
        actor: system
        preconditions: ["review.findings_count > 0"]
        side_effects:
          - "review.remediation_due_at := clock_now + REMEDIATION_DAYS days"
          - "review.status := FINDINGS_OPEN in the same response that created the review"
        note: "A review with findings_count == 0 stays PREPARED and is immediately decidable; the initial_state is therefore observable only for clean audits."
      - from: FINDINGS_OPEN
        to: REMEDIATED
        trigger: "POST /performance-reviews/{id}/remediate"
        actor: Partner
        preconditions:
          - "review.status == FINDINGS_OPEN"
          - "review.partner_id == X-User-ID (else ERR_PARTNER_SCOPE_VIOLATION)"
          - "clock_now <= review.remediation_due_at (else ERR_AUDIT_REMEDIATION_OVERDUE)"
          - "remediation_note present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects: ["review.remediation_note := remediation_note", "increments PerformanceReview.version by 1"]
      - from: PREPARED
        to: APPROVED
        trigger: "POST /performance-reviews/{id}/decision with decision = APPROVE"
        actor: ChannelDirector
        preconditions:
          - "review.status == PREPARED (a review in FINDINGS_OPEN must be remediated first; else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != review.prepared_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects:
          - "review.final_cert_credit, final_revenue_cents, final_score and approved_tier written per the FINAL variant of calculations.partner_tier_scoring; decided_by_user_id := X-User-ID"
          - "partner.tier := review.approved_tier; when partner.tier_status == PROBATION with standing_reason == 'MARKETING_ATTAINMENT_SHORTFALL' it is left untouched, otherwise tier_status := COMPLIANT and standing_reason := null"
          - "partner.portal_entitlement_level recomputed per calculations.portal_entitlement"
          - "increments PerformanceReview.version by 1"
      - from: REMEDIATED
        to: APPROVED
        trigger: "POST /performance-reviews/{id}/decision with decision = APPROVE"
        actor: ChannelDirector
        preconditions: ["review.status == REMEDIATED", "X-User-ID != review.prepared_by_user_id (else ERR_SOD_SAME_ACTOR)"]
        side_effects: ["identical to PREPARED -> APPROVED"]
      - from: PREPARED
        to: REJECTED
        trigger: "POST /performance-reviews/{id}/decision with decision = REJECT"
        actor: ChannelDirector
        preconditions: ["review.status == PREPARED", "X-User-ID != review.prepared_by_user_id (else ERR_SOD_SAME_ACTOR)"]
        side_effects:
          - "review.final_cert_credit, final_revenue_cents and final_score written per the FINAL variant; approved_tier stays null; decided_by_user_id := X-User-ID"
          - "partner.tier is left unchanged; partner.tier_status := SUSPENDED with standing_reason = 'PROGRAM_REVIEW_REJECTED'; portal_entitlement_level recomputed (BASIC)"
          - "increments PerformanceReview.version by 1"
      - from: FINDINGS_OPEN
        to: REJECTED
        trigger: "POST /performance-reviews/{id}/decision with decision = REJECT"
        actor: ChannelDirector
        preconditions:
          - "review.status == FINDINGS_OPEN and clock_now > review.remediation_due_at (an un-remediated audit may only be closed by rejection once the deadline passed; else ERR_AUDIT_REMEDIATION_OVERDUE is NOT raised and ERR_INVALID_STATE_TRANSITION applies instead)"
          - "X-User-ID != review.prepared_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects: ["identical to PREPARED -> REJECTED"]
      - from: REMEDIATED
        to: REJECTED
        trigger: "POST /performance-reviews/{id}/decision with decision = REJECT"
        actor: ChannelDirector
        preconditions: ["review.status == REMEDIATED", "X-User-ID != review.prepared_by_user_id (else ERR_SOD_SAME_ACTOR)"]
        side_effects: ["identical to PREPARED -> REJECTED"]

concurrency_rules:
  - rule_id: spr-create-stale-registration
    parent_entity: DealRegistration
    write_endpoint: "POST /special-pricing-requests"
    occ_field: "expected_registration_version"
    description: |
      Creating a SpecialPricingRequest against a DealRegistration whose
      version has advanced since the client last read it is rejected. The
      program deliberately allows a newer request on the same registration
      to supersede the pending one (SpecialPricingRequest SUBMITTED ->
      SUPERSEDED), so a create that carries a stale registration version
      cannot be rejected by any state precondition: the registration is
      still APPROVED and a second create would otherwise succeed and
      silently void the pending request. The OCC check turns that into a
      deterministic stale-version rejection.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
  - rule_id: mapping-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /account-mappings"
    occ_field: "expected_account_version"
    description: |
      Creating an AccountMapping against an Account whose version has
      advanced since the client last read it is rejected. Account coverage
      fields (coverage_state, protected_until, protected_partner_id,
      direct_pursuit_owner_id) are exactly the inputs the mapping window
      test and the account-mapping agreement depend on, and a PROPOSED
      mapping is legitimately allowed to coexist with any coverage state,
      so a create carrying a stale account version would otherwise be
      accepted against a coverage picture the client never saw.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

calculations:
  - name: certification_credit_rollup
    trigger: "on POST /partners/{id}/certifications and on every CertificationRecord ACTIVE -> EXPIRED sweep hop (CASCADE E hop 1) during POST /performance-reviews"
    algorithm: aggregation
    formula: |
      credit_weight(track) = CERT_CREDIT_WEIGHT[track]        # written at creation, never re-derived later
      partner.cert_credit_total = SUM(cert.credit_weight
                                     for cert in CertificationRecord
                                     where cert.partner_id == partner.id
                                       and cert.status == 'ACTIVE')
    input_set: "CertificationRecord rows of the partner with status == ACTIVE only; rows in EXPIRED contribute 0. The rollup is a full recompute, never an incremental delta, so two sweeps over the same record can never double-subtract."
    constants:
      CERT_CREDIT_WEIGHT: {SALES_PRO: 1, TECH_ASSOCIATE: 2, TECH_EXPERT: 4}
      CERT_CREDIT_MIN_TO_REGISTER: 2
      CERT_CREDIT_MIN_PLATFORM_SUITE: 6
    precision: "integer credits, no rounding"
  - name: partner_revenue_rollup
    trigger: "on OrderInvoice PENDING -> INVOICED, on INVOICED -> CREDITED and on CREDITED -> CREDITED"
    algorithm: aggregation
    formula: |
      partner.trailing_revenue_cents =
        SUM(inv.invoice_amount_cents
            for inv in OrderInvoice
            where inv.partner_id == partner.id
              and inv.status in ('INVOICED', 'CREDITED'))
      # invoice_amount_cents is already net of every credit memo applied so far
      # (the credit-memo transition subtracts from it in place), therefore this
      # rollup must NOT subtract credit_memo_cents a second time.
    input_set: "OrderInvoice rows of the partner whose status is INVOICED or CREDITED. PENDING invoices are excluded entirely from the rolling figure (they are included only by the PROVISIONAL variant of partner_tier_scoring)."
    constants: {}
    precision: "integer cents, no rounding"
  - name: marketing_attainment
    trigger: "on MdfClaim validation_state -> VALIDATED, on MdfClaim VALIDATED -> REJECTED (CASCADE B hop 3), on POST /mdf-claims/{id}/proofs/{proof_id}/verify and on PATCH /partners/{id}"
    algorithm: threshold
    formula: |
      partner.marketing_qualified_spend_cents =
        SUM(proof.spend_amount_cents
            for proof in ProofOfPerformance
            where proof.verified == true
              and proof.claim.validation_state == 'VALIDATED'
              and proof.claim.allocation.partner_id == partner.id)

      if partner.marketing_commitment_cents == 0:
          partner.marketing_attainment_pct = 1.0000     # a partner with no commitment is vacuously compliant
      else:
          partner.marketing_attainment_pct = round_half_up(
              MIN(1.0, marketing_qualified_spend_cents / marketing_commitment_cents), 4)
    input_set: "Verified ProofOfPerformance rows whose parent claim is currently VALIDATED. A verified proof on a SUBMITTED, PROOF_REQUESTED or REJECTED claim contributes nothing, so the same proof row can enter and leave the numerator as its claim is validated and clawed back."
    constants:
      MARKETING_COMPLIANCE_MIN_PCT: 0.75
    precision: "attainment as a fraction with 4 decimal places, round_half_up; spend in integer cents"
  - name: portal_entitlement
    trigger: "whenever partner.tier, partner.tier_status or partner.cert_credit_total changes (performance-review decision, CASCADE A hop 4, CASCADE B hop 4, CASCADE D hop 3, CASCADE E hop 1, conflict resolution)"
    algorithm: constraint_propagation
    formula: |
      LADDER = ['BASIC', 'STANDARD', 'PREMIUM', 'ELITE']       # index 0..3
      base_index = TIER_ENTITLEMENT_INDEX[partner.tier]        # REGISTERED 0, SILVER 1, GOLD 2, PLATINUM 3

      if partner.tier_status == 'SUSPENDED':
          partner.portal_entitlement_level = 'BASIC'           # short-circuit, no demotions computed
      else:
          demotions = 0
          if partner.tier_status == 'PROBATION':
              demotions += 1
          if partner.cert_credit_total < CERT_FLOOR_BY_TIER[partner.tier]:
              demotions += 1                                   # certifications lapsed since the last review
          index = MAX(0, base_index - demotions)               # demotions accumulate, floor is BASIC
          partner.portal_entitlement_level = LADDER[index]
    input_set: "The partner's own tier, tier_status and cert_credit_total only; this is a pure derived field with no cross-entity scan."
    constants:
      TIER_ENTITLEMENT_INDEX: {REGISTERED: 0, SILVER: 1, GOLD: 2, PLATINUM: 3}
      CERT_FLOOR_BY_TIER: {REGISTERED: 0, SILVER: 2, GOLD: 6, PLATINUM: 12}
    precision: "enumerated level, no arithmetic"
  - name: partner_tier_scoring
    trigger: "the PROVISIONAL variant runs inside POST /performance-reviews (writing provisional_cert_credit, provisional_revenue_cents, provisional_score, recommended_tier); the FINAL variant runs inside POST /performance-reviews/{id}/decision (writing final_cert_credit, final_revenue_cents, final_score and, on APPROVE, approved_tier which becomes partner.tier)"
    algorithm: weighted_scoring
    formula: |
      # ---- component normalisation (identical in both variants) ----
      cert_component     = MIN(1, cert_credit_basis / CERT_CREDIT_TARGET)
      revenue_component  = MIN(1, period_revenue_cents / REVENUE_TARGET_CENTS)
      marketing_component = partner.marketing_attainment_pct        # already a 0..1 fraction, recomputed by
                                                                    # calculations.marketing_attainment before use
      score = round_half_up(  WEIGHT_CERT      * cert_component
                            + WEIGHT_REVENUE   * revenue_component
                            + WEIGHT_MARKETING * marketing_component, 2)

      # ---- tier gate ladder: evaluated top-down, FIRST match wins ----
      # every gate is a conjunction of the score AND the raw (un-normalised) inputs,
      # so a partner can max out the score and still be blocked by a raw floor.
      if score >= 85 and cert_credit_basis >= 12 and period_revenue_cents >= 50000000: tier = 'PLATINUM'
      elif score >= 70 and cert_credit_basis >= 6:                                     tier = 'GOLD'
      elif score >= 45 and cert_credit_basis >= 2:                                     tier = 'SILVER'
      else:                                                                            tier = 'REGISTERED'

      # ---- variant-specific inputs ----
      # PROVISIONAL:
      #   cert_credit_basis   = SUM(credit_weight) over ACTIVE certifications, whatever their expires_at
      #   period_revenue_cents = SUM(invoice_amount_cents) over OrderInvoice of the partner whose
      #                          status is PENDING, INVOICED or CREDITED and whose window instant
      #                          falls in [period_start, period_end] (inclusive both ends), where the
      #                          window instant is invoiced_at for INVOICED/CREDITED and created_at for PENDING
      # FINAL:
      #   cert_credit_basis   = SUM(credit_weight) over ACTIVE certifications whose
      #                          expires_at >= period_end + COVERAGE_HORIZON_DAYS days
      #   period_revenue_cents = SUM(invoice_amount_cents) over OrderInvoice of the partner whose
      #                          status is INVOICED or CREDITED and whose invoiced_at falls in
      #                          [period_start, period_end] (inclusive both ends); PENDING excluded
    input_set: "CertificationRecord rows with status == ACTIVE, and OrderInvoice rows of the partner filtered by the variant's status set and time window. Rows of other partners never contribute. The two variants read the same database rows and differ only in the two filters above, so identical data yields two different scores and can yield two different tiers."
    constants:
      WEIGHT_CERT: 40
      WEIGHT_REVENUE: 35
      WEIGHT_MARKETING: 25
      CERT_CREDIT_TARGET: 12
      REVENUE_TARGET_CENTS: 50000000
      COVERAGE_HORIZON_DAYS: 90
      PLATINUM_SCORE_MIN: 85
      PLATINUM_CERT_MIN: 12
      PLATINUM_REVENUE_MIN_CENTS: 50000000
      GOLD_SCORE_MIN: 70
      GOLD_CERT_MIN: 6
      SILVER_SCORE_MIN: 45
      SILVER_CERT_MIN: 2
      REMEDIATION_DAYS: 30
    precision: "components as exact rational fractions; the weighted sum rounded once to 2 decimal places, round_half_up. Components are NEVER rounded individually — rounding each component before weighting would drift the score."
    variants:
      - name: PROVISIONAL
        when: "at review preparation (POST /performance-reviews), producing recommended_tier"
        difference: "forward-looking: counts every ACTIVE certification regardless of how soon it lapses, and counts PENDING (not-yet-invoiced) orders as revenue"
      - name: FINAL
        when: "at review decision (POST /performance-reviews/{id}/decision), producing approved_tier and the partner's new tier"
        difference: "coverage-tested: drops any certification lapsing before period_end + COVERAGE_HORIZON_DAYS, and drops PENDING orders, so final_score <= provisional_score whenever those two sets are non-empty"
  - name: channel_margin_resolution
    trigger: "on POST /order-invoices (the resolved margin is frozen onto the invoice at creation and is never re-derived by later tier changes)"
    algorithm: constraint_propagation
    formula: |
      # The six steps are STRICTLY ORDERED. The volume band is a function of the
      # PRELIMINARY net, and the final margin is a function of the band, so the
      # dependency looks circular; the pinned order below is what breaks it.
      # Re-deriving the band from the FINAL net produces a different invoice.

      # step 1 - preliminary margin
      registration_uplift = 0.06 if the linked registration is APPROVED and
                                    exclusivity_start_at <= clock_now < exclusivity_end_at
                            else 0.02 if the linked registration is non-null and its status is
                                    APPROVED, EXPIRED, SUPERSEDED or CONVERTED
                            else 0.00            # registration_id null, REJECTED, or still in flight
      spr_uplift  = approved_extra_margin_pct of the newest SpecialPricingRequest on that
                    registration whose status is APPROVED or PARTIALLY_APPROVED and whose
                    expires_at > clock_now, else 0.00      # newest by created_at
      stocking_uplift = 0.02 if partner.partner_type == 'DISTRIBUTOR' and order_type == 'STOCKING'
                        else 0.00
      prelim_margin_pct = BASE_MARGIN_PCT[partner.tier] + registration_uplift
                          + spr_uplift + stocking_uplift

      # step 2 - preliminary net (the band input)
      prelim_net_cents = round_half_up(list_amount_cents * (1 - prelim_margin_pct), 0)

      # step 3 - volume band, from the PRELIMINARY net only
      volume_band = 'HIGH' if prelim_net_cents >= VOLUME_BAND_HIGH_MIN_CENTS
                    else 'MID' if prelim_net_cents >= VOLUME_BAND_MID_MIN_CENTS
                    else 'NONE'
      volume_uplift = VOLUME_UPLIFT_PCT[volume_band]

      # step 4 - final margin, floored then ceilinged
      margin_pct = round_half_up(
                     MIN(TIER_MARGIN_CEILING_PCT[partner.tier],
                         MAX(MARGIN_FLOOR_PCT, prelim_margin_pct + volume_uplift)), 4)

      # step 5 - invoice amount from the FINAL margin
      invoice_amount_cents = round_half_up(list_amount_cents * (1 - margin_pct), 0)

      # step 6 - margin value by SUBTRACTION, never by multiplication
      margin_value_cents = list_amount_cents - invoice_amount_cents
    input_set: "The invoice's own list_amount_cents and order_type, the partner's tier and partner_type as they stand at creation, the linked DealRegistration's status and exclusivity window, and the newest un-expired approved SpecialPricingRequest on that registration. The volume band never looks at other invoices."
    constants:
      BASE_MARGIN_PCT: {REGISTERED: 0.10, SILVER: 0.14, GOLD: 0.18, PLATINUM: 0.22}
      TIER_MARGIN_CEILING_PCT: {REGISTERED: 0.18, SILVER: 0.24, GOLD: 0.30, PLATINUM: 0.36}
      MARGIN_FLOOR_PCT: 0.05
      REGISTRATION_UPLIFT_IN_WINDOW_PCT: 0.06
      REGISTRATION_UPLIFT_AFTER_WINDOW_PCT: 0.02
      STOCKING_ALLOWANCE_PCT: 0.02
      VOLUME_BAND_HIGH_MIN_CENTS: 20000000
      VOLUME_BAND_MID_MIN_CENTS: 5000000
      VOLUME_UPLIFT_PCT: {HIGH: 0.03, MID: 0.015, NONE: 0.0}
      SPR_VALIDITY_DAYS: 30
    precision: "margin_pct to 4 decimal places round_half_up; all money in integer cents, round_half_up at each of steps 2 and 5; margin_value_cents by exact subtraction so no cent is ever created or destroyed"
  - name: mdf_allocation_sizing
    trigger: "on POST /mdf-allocations, after the period-capacity validation has passed"
    algorithm: threshold
    formula: |
      basis_revenue_cents = SUM(inv.invoice_amount_cents
                                for inv in OrderInvoice
                                where inv.partner_id == allocation.partner_id
                                  and inv.status in ('INVOICED', 'CREDITED')
                                  and inv.invoiced_at < allocation.period_start)   # strictly before the period opens
      accrued_cents  = round_half_up(basis_revenue_cents * MDF_ACCRUAL_RATE[partner.tier], 0)
      allocated_cents = MIN(MDF_PERIOD_CAP_CENTS[partner.tier], accrued_cents)
                        + MDF_BASE_GRANT_CENTS[partner.tier]
      # the base grant is added AFTER the per-period cap, so the cap bounds the accrual only
      committed_cents = 0
      paid_cents      = 0
      expired_cents   = 0
      available_cents = allocated_cents
    input_set: "OrderInvoice rows of the same partner with status INVOICED or CREDITED whose invoiced_at is strictly before period_start; the partner's tier at creation time selects every rate and cap. A REGISTERED partner accrues nothing and receives no base grant, so its allocation is 0 and no claim can ever be submitted against it."
    constants:
      MDF_ACCRUAL_RATE: {REGISTERED: 0.0, SILVER: 0.01, GOLD: 0.02, PLATINUM: 0.03}
      MDF_PERIOD_CAP_CENTS: {REGISTERED: 0, SILVER: 500000, GOLD: 2000000, PLATINUM: 5000000}
      MDF_BASE_GRANT_CENTS: {REGISTERED: 0, SILVER: 50000, GOLD: 100000, PLATINUM: 200000}
      ANNUAL_MDF_CAP_CENTS: {REGISTERED: 0, SILVER: 400000, GOLD: 900000, PLATINUM: 2000000}
    precision: "integer cents; the accrual rounded once, round_half_up"
  - name: mdf_claim_approval
    trigger: "on POST /mdf-claims/{id}/validate with decision = VALIDATE"
    algorithm: waterfall_allocation
    formula: |
      # PER-LINE rounding, then sum. Summing the spend first and rounding once at the
      # end is a DIFFERENT (and wrong) answer whenever two or more proof lines have an
      # odd half-cent product.
      for proof in verified proofs of this claim, in ascending created_at order:
          proof.matched_line_cents = round_half_up(
              proof.spend_amount_cents * MATCH_RATE_PCT[partner.tier], 0)
      matched_total_cents = SUM(proof.matched_line_cents for those proofs)

      approved_cents = MIN(claim.requested_cents, matched_total_cents)
      # requested_cents was already committed against the allocation at claim creation,
      # so no availability term appears here; the unmatched remainder
      # (requested_cents - approved_cents) is released back by the transition's side effect.
    input_set: "ProofOfPerformance rows of this claim with verified == true only. Unverified proofs contribute 0 to matched_total_cents and their matched_line_cents stays null. A claim with zero verified proofs is not validatable at all (ERR_NO_VERIFIED_PROOF)."
    constants:
      MATCH_RATE_PCT: {REGISTERED: 0.25, SILVER: 0.40, GOLD: 0.50, PLATINUM: 0.60}
      MAX_PROOF_ROUNDS: 2
    precision: "each proof line rounded to integer cents, round_half_up, BEFORE summation; the sum is exact"
  - name: exclusivity_window
    trigger: "on DealRegistration UNDER_REVIEW -> APPROVED and on CONFLICT_HELD -> APPROVED (split award)"
    algorithm: interval_merge
    formula: |
      protection_days      = PROTECTION_DAYS_BY_TIER[partner.tier]            # normal approval
      protection_days      = FLOOR(PROTECTION_DAYS_BY_TIER[partner.tier] / 2) # split award
      exclusivity_start_at = clock_now                                        # == approved_at
      exclusivity_end_at   = exclusivity_start_at + protection_days days

      # Occupancy test, HALF-OPEN [start, end):
      #   a registration protects (account_id, product_line) at instant T
      #   iff exclusivity_start_at <= T < exclusivity_end_at
      # At T == exclusivity_end_at the window is over: the expiry sweep flips the
      # registration APPROVED -> EXPIRED and a competing submit at exactly that
      # instant succeeds. At T == exclusivity_end_at - 1ms the submit is rejected
      # with ERR_EXCLUSIVITY_CONFLICT.
      #
      # SINGLE-OCCUPANT: at most one DealRegistration may hold a live window on a
      # given (account_id, product_line). Windows are never merged or unioned - the
      # renewal path (supersedes_registration_id) replaces the incumbent window
      # rather than extending it, and account.protected_until is overwritten with
      # the successor's exclusivity_end_at.
    input_set: "The approving registration itself plus every other DealRegistration with the same (account_id, product_line) whose status == APPROVED; the tier of the approving partner sets the length. Registrations on a different product_line of the same account never interact."
    constants:
      PROTECTION_DAYS_BY_TIER: {REGISTERED: 30, SILVER: 60, GOLD: 90, PLATINUM: 120}
      MAX_REVISION_ROUNDS: 2
    precision: "instants to millisecond precision, ISO 8601 UTC with three fractional digits; day arithmetic is exact 24h multiples"
  - name: mapping_window_conflict
    trigger: "on POST /account-mappings and on every POST /account-mappings/{id}/respond with action IN {COUNTER, ACCEPT}, after the mapping expiry sweep has run"
    algorithm: interval_merge
    formula: |
      # CLOSED interval on both ends, plus a one-sided cooldown buffer AFTER the
      # incumbent's end. Deliberately different geometry from exclusivity_window.
      candidate = [from, until]                      # this mapping's window
      for M in other AccountMapping rows where
               M.id != this.id
           and M.account_id == this.account_id
           and M.mapping_status in ('PROPOSED', 'COUNTERED', 'ACTIVE', 'EXPIRED')
           and (M.exclusivity_scope == 'FULL' or this.exclusivity_scope == 'FULL'
                or M.product_line == this.product_line):
          blocked = [M.effective_from, M.effective_until + MAPPING_COOLDOWN_DAYS days]
          if NOT (from > blocked.end or until < blocked.start):     # inclusive intersection
              raise ERR_MAPPING_WINDOW_CONFLICT
      # Consequences that are exactly testable:
      #  - from == blocked.end            -> conflict (endpoints are inclusive)
      #  - from == blocked.end + 1ms      -> allowed
      #  - until == M.effective_from      -> conflict
      #  - until == M.effective_from - 1ms -> allowed (no cooldown before the start)
      #  - a TERMINATED mapping contributes NO cooldown at all
      #  - an EXPIRED mapping still contributes its full cooldown
    input_set: "AccountMapping rows on the same account whose mapping_status is PROPOSED, COUNTERED, ACTIVE or EXPIRED, restricted to a scope that overlaps this mapping's scope (any FULL scope overlaps every product_line). TERMINATED rows are excluded entirely."
    constants:
      MAPPING_COOLDOWN_DAYS: 14
      MAX_COUNTER_ROUNDS: 2
    precision: "instants to millisecond precision; the cooldown is an exact 14 x 24h offset added to effective_until"
  - name: conflict_recommendation
    trigger: "on ConflictCase creation (CASCADE A hop 3 and CASCADE D hop 1). BOTH variants are always computed and stored - recommended_resolution_registration_first and recommended_resolution_coverage_first - and applied_variant records which one was copied into recommended_resolution."
    algorithm: chronological
    formula: |
      # ---------- variant REGISTRATION_FIRST (chronological claim order) ----------
      claimants = []
      claimants += [('GRANT_SUBJECT', subject.submitted_at, subject.created_at)]
      if case.counter_registration_id is not null:
          claimants += [('GRANT_COUNTER', counter.submitted_at, counter.created_at)]
      if account.direct_pursuit_owner_id is not null:
          claimants += [('RELEASE_TO_DIRECT', account.direct_pursuit_declared_at, account.created_at)]
      # earliest claim wins; ties broken by created_at, never by id
      registration_first = MIN(claimants, key = (claim_instant, created_at)).label

      # ---------- variant COVERAGE_FIRST (account coverage order) ----------
      if account.coverage_state == 'CHANNEL_PROTECTED' and clock_now < account.protected_until:
          if account.protected_partner_id == subject.partner_id:                coverage_first = 'GRANT_SUBJECT'
          elif counter is not null and account.protected_partner_id == counter.partner_id:
                                                                               coverage_first = 'GRANT_COUNTER'
          else:                                                                coverage_first = 'DISMISS'
      elif account.direct_pursuit_owner_id is not null:                         coverage_first = 'RELEASE_TO_DIRECT'
      elif subject.status == 'APPROVED':                                        coverage_first = 'GRANT_SUBJECT'
      else:                                                                    coverage_first = 'DISMISS'

      # ---------- which variant is applied ----------
      applied_variant = 'REGISTRATION_FIRST' if case.conflict_type == 'PARTNER_VS_PARTNER'
                        else 'COVERAGE_FIRST'          # PARTNER_VS_DIRECT
      recommended_resolution = registration_first if applied_variant == 'REGISTRATION_FIRST'
                               else coverage_first
    input_set: "The subject registration, the counter registration when present, and the contested Account's coverage fields as they stand at detection time. The recommendation is advisory: it never moves any state by itself, and a ChannelDirector may resolve against it."
    constants:
      RECOMMENDATION_LABELS: [GRANT_SUBJECT, GRANT_COUNTER, RELEASE_TO_DIRECT, DISMISS]
      CONFLICT_PROBATION_THRESHOLD: 2
      MAX_ESCALATION_LEVEL: 2
    precision: "enumerated label; instant comparisons at millisecond precision"
    variants:
      - name: REGISTRATION_FIRST
        when: "applied to PARTNER_VS_PARTNER cases - the channel's registration-order doctrine"
        difference: "ranks claimants purely by the instant each claim was staked (submitted_at, or direct_pursuit_declared_at for direct sales), ignoring who currently holds the account protection. Because every revision loop rewrites submitted_at, a partner that registered first but revised its deal can lose this ranking."
      - name: COVERAGE_FIRST
        when: "applied to PARTNER_VS_DIRECT cases - the account-coverage doctrine"
        difference: "ranks by who holds the live account protection, ignoring claim order entirely; falls through to the direct-sales owner and then to the subject's own approval state. On the same case data this can name a different winner than REGISTRATION_FIRST."
  - name: channel_margin_conservation
    trigger: "invariant - must hold after POST /order-invoices, POST /order-invoices/{id}/invoice and every POST /order-invoices/{id}/credit-memo"
    algorithm: aggregation
    formula: |
      # per invoice, at every observable instant:
      invoice.list_amount_cents == invoice.invoice_amount_cents + invoice.margin_value_cents
      invoice.margin_pct        == round_half_up(invoice.margin_value_cents / invoice.list_amount_cents, 4)
      invoice.margin_value_cents >= round_half_up(invoice.list_amount_cents * MARGIN_FLOOR_PCT, 0)  # never below the floor
      invoice.margin_pct        <= TIER_MARGIN_CEILING_PCT[partner.tier]                            # never above the ceiling

      # a credit memo is the compensating action for an over-priced order: it moves cents
      # from invoice_amount_cents into margin_value_cents WITHOUT touching list_amount_cents,
      # so the identity above is preserved exactly and no cent is created or destroyed.
      after credit of C:  invoice_amount_cents' = invoice_amount_cents - C
                          margin_value_cents'   = list_amount_cents - invoice_amount_cents'
                          credit_memo_cents'    = credit_memo_cents + C

      # per partner:
      partner.trailing_revenue_cents == SUM(invoice_amount_cents
                                            over that partner's INVOICED and CREDITED invoices)
    input_set: "Every OrderInvoice row, and the partner rollup over its INVOICED and CREDITED invoices."
    constants:
      MARGIN_FLOOR_PCT: 0.05
    precision: "integer cents, exact; margin_pct to 4 decimal places round_half_up"
  - name: mdf_fund_conservation
    trigger: "invariant - must hold after POST /mdf-claims, every POST /mdf-claims/{id}/validate, every POST /mdf-claims/{id}/settlement and POST /mdf-allocations/{id}/close"
    algorithm: aggregation
    formula: |
      # per allocation, at every observable instant:
      allocation.allocated_cents == allocation.available_cents
                                  + allocation.committed_cents
                                  + allocation.paid_cents
                                  + allocation.expired_cents
      allocation.available_cents >= 0
      allocation.committed_cents >= 0
      allocation.available_cents == allocated_cents - committed_cents - paid_cents - expired_cents

      # bucket movements (each one is a pure transfer between two buckets):
      #   claim create     : available -> committed          (requested_cents)
      #   validate VALIDATE: committed -> available          (requested_cents - approved_cents)
      #   validate REJECT  : committed -> available          (approved_cents, or requested_cents if never validated)
      #   settlement PAY   : committed -> paid               (approved_cents)
      #   WRITE_OFF        : committed -> expired            (approved_cents)
      #   allocation close : committed -> available -> expired, in CASCADE C's pinned step order
      #
      # REJECT of an already VALIDATED claim is the compensating action for the
      # validation: the exact cents that entered committed at validation return to
      # available, so a create -> validate -> reject round trip restores
      # available_cents to its pre-claim value with zero drift.
    input_set: "Every MdfAllocation row and its MdfClaim children."
    constants: {}
    precision: "integer cents, exact - no rounding occurs in any bucket transfer"

validations:
  # ---- 1..2 authentication and authorization ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  # ---- 3 existence, validated left-to-right in the path, then body FKs in declaration order ----
  - priority: 3
    category: existence
    check: "the Partner named by the path or by partner_id exists"
    error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    applies_to: "GET/PATCH /partners/{id}, POST /partners/{id}/certifications, GET /partners/{id}/certifications, POST /mdf-allocations, POST /order-invoices, POST /performance-reviews, POST /account-mappings, POST /deal-registrations"
  - priority: 3
    category: existence
    check: "the CertificationRecord named by the path exists"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /certifications/{id}"
  - priority: 3
    category: existence
    check: "the Account named by the path or by account_id exists"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /accounts/{id}, POST /accounts/{id}/direct-pursuit, GET /accounts/{id}/deal-registrations, GET /accounts/{id}/conflict-cases, POST /deal-registrations, POST /account-mappings"
  - priority: 3
    category: existence
    check: "the AccountMapping named by the path exists"
    error_id: ERR_MAPPING_NOT_FOUND
    http_status: 404
    applies_to: "GET /account-mappings/{id}, POST /account-mappings/{id}/respond"
  - priority: 3
    category: existence
    check: "the DealRegistration named by the path, by registration_id or by supersedes_registration_id exists"
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /deal-registrations/{id}, POST /deal-registrations/{id}/submit, POST /deal-registrations/{id}/review, POST /deal-registrations/{id}/decision, POST /deal-registrations/{id}/convert, GET /deal-registrations/{id}/special-pricing-requests, GET /deal-registrations/{id}/order-invoices, POST /deal-registrations, POST /special-pricing-requests, POST /order-invoices"
  - priority: 3
    category: existence
    check: "the ConflictCase named by the path exists"
    error_id: ERR_CONFLICT_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /conflict-cases/{id}, POST /conflict-cases/{id}/escalate, POST /conflict-cases/{id}/resolve"
  - priority: 3
    category: existence
    check: "the SpecialPricingRequest named by the path exists"
    error_id: ERR_SPR_NOT_FOUND
    http_status: 404
    applies_to: "GET /special-pricing-requests/{id}, POST /special-pricing-requests/{id}/decision"
  - priority: 3
    category: existence
    check: "the MdfAllocation named by the path or by allocation_id exists"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /mdf-allocations/{id}, POST /mdf-allocations/{id}/close, GET /mdf-allocations/{id}/mdf-claims, POST /mdf-claims"
  - priority: 3
    category: existence
    check: "the MdfClaim named by the path exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /mdf-claims/{id}, POST /mdf-claims/{id}/validate, POST /mdf-claims/{id}/settlement, POST /mdf-claims/{id}/proofs, GET /mdf-claims/{id}/proofs, POST /mdf-claims/{id}/proofs/{proof_id}/verify"
  - priority: 3
    category: existence
    check: "the ProofOfPerformance named by the path exists and belongs to the claim named earlier in the path"
    error_id: ERR_PROOF_NOT_FOUND
    http_status: 404
    applies_to: "POST /mdf-claims/{id}/proofs/{proof_id}/verify"
  - priority: 3
    category: existence
    check: "the OrderInvoice named by the path exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /order-invoices/{id}, POST /order-invoices/{id}/invoice, POST /order-invoices/{id}/credit-memo"
  - priority: 3
    category: existence
    check: "the PerformanceReview named by the path exists"
    error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "GET /performance-reviews/{id}, POST /performance-reviews/{id}/remediate, POST /performance-reviews/{id}/decision"
  # ---- 4 partner scoping: a Partner role may only act on its own rows ----
  - priority: 4
    category: auth
    check: "when X-User-Role == Partner, X-User-ID equals the partner_id of the target row (registration.partner_id, mapping.partner_id, review.partner_id, claim.allocation.partner_id, or the partner_id in the create body)"
    error_id: ERR_PARTNER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /deal-registrations, POST /deal-registrations/{id}/submit, POST /account-mappings/{id}/respond, POST /conflict-cases/{id}/escalate, POST /special-pricing-requests, POST /mdf-claims, POST /mdf-claims/{id}/proofs, POST /performance-reviews/{id}/remediate"
  # ---- 5..6 request shape and static eligibility ----
  - priority: 5
    category: business_constraint
    check: "every required field is present with the declared type, enums hold declared values, integer money fields are >= 0, percentage fields are in [0, 1], datetime fields are ISO 8601 UTC with three fractional digits, and every declared interval satisfies its end > start rule"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 6
    category: business_constraint
    check: "order_type == STOCKING is only accepted when partner.partner_type == DISTRIBUTOR; a RESELLER may place DROP_SHIP orders only"
    error_id: ERR_PARTNER_TYPE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /order-invoices"
  # ---- 7..8 optimistic concurrency (§1.2.1) ----
  - priority: 7
    category: state
    check: "expected_registration_version equals the current DealRegistration.version"
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
    applies_to: "POST /special-pricing-requests"
  - priority: 8
    category: state
    check: "expected_account_version equals the current Account.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /account-mappings"
  # ---- 10..13 state preconditions ----
  - priority: 10
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2, including the loop caps revision_round < MAX_REVISION_ROUNDS, counter_round < MAX_COUNTER_ROUNDS and proof_round < MAX_PROOF_ROUNDS"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST action endpoint"
  - priority: 11
    category: state
    check: "the MdfAllocation backing the claim has status == OPEN"
    error_id: ERR_ALLOCATION_CLOSED
    http_status: 409
    applies_to: "POST /mdf-claims, POST /mdf-claims/{id}/validate, POST /mdf-claims/{id}/proofs, POST /mdf-claims/{id}/proofs/{proof_id}/verify, POST /mdf-claims/{id}/settlement with action IN {APPROVE_PAYMENT, PAY}, POST /mdf-allocations/{id}/close"
  - priority: 12
    category: state
    check: "the claim's validation_state == VALIDATED before any settlement action"
    error_id: ERR_CLAIM_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /mdf-claims/{id}/settlement"
  - priority: 13
    category: state
    check: "no OTHER DealRegistration with the same (partner_id, account_id, product_line) is in SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED or CONFLICT_HELD"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /deal-registrations/{id}/submit"
  # ---- 20..23 safety / compliance: program standing outranks every temporal and fiscal check ----
  - priority: 20
    category: business_safety
    check: "partner.tier_status != SUSPENDED"
    error_id: ERR_PARTNER_SUSPENDED
    http_status: 403
    applies_to: "POST /deal-registrations/{id}/submit, POST /deal-registrations/{id}/decision with decision = APPROVE, POST /order-invoices, POST /order-invoices/{id}/invoice, POST /mdf-allocations, POST /mdf-claims, POST /special-pricing-requests"
  - priority: 21
    category: business_safety
    check: "the partner has no PerformanceReview with status == FINDINGS_OPEN whose remediation_due_at <= clock_now (an overdue compliance audit freezes the partner's program activity)"
    error_id: ERR_AUDIT_REMEDIATION_OVERDUE
    http_status: 409
    applies_to: "POST /deal-registrations/{id}/submit, POST /mdf-claims, POST /account-mappings/{id}/respond with action = ACCEPT, POST /performance-reviews/{id}/remediate (where the check is against this review's own deadline)"
  - priority: 22
    category: business_safety
    check: "the acting X-User-ID differs from the user who performed the segregated earlier step: claim.validated_by_user_id for a settlement action, review.prepared_by_user_id for a review decision"
    error_id: ERR_SOD_SAME_ACTOR
    http_status: 409
    applies_to: "POST /mdf-claims/{id}/settlement, POST /performance-reviews/{id}/decision"
  - priority: 23
    category: business_safety
    check: "partner.cert_credit_total >= CERT_CREDIT_MIN_TO_REGISTER, and >= CERT_CREDIT_MIN_PLATFORM_SUITE with at least one ACTIVE TECH_EXPERT record when product_line == PLATFORM_SUITE"
    error_id: ERR_CERTIFICATION_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /deal-registrations/{id}/submit"
  # ---- 30..32 temporal / window conflicts ----
  - priority: 30
    category: business_temporal
    check: "no other APPROVED DealRegistration holds a live half-open exclusivity window on the same (account_id, product_line), and account.coverage_state != DIRECT_LOCKED (calculations.exclusivity_window)"
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /deal-registrations/{id}/submit, POST /deal-registrations/{id}/decision with decision = APPROVE"
  - priority: 31
    category: business_temporal
    check: "the mapping window clears every other non-TERMINATED mapping's window plus its MAPPING_COOLDOWN_DAYS buffer on an overlapping scope (calculations.mapping_window_conflict); also applied when a registration collides with a live ACTIVE mapping of another partner"
    error_id: ERR_MAPPING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /account-mappings, POST /account-mappings/{id}/respond, POST /deal-registrations/{id}/submit"
  - priority: 32
    category: business_temporal
    check: "clock_now < spr.expires_at when deciding a SpecialPricingRequest"
    error_id: ERR_EXCLUSIVITY_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /special-pricing-requests/{id}/decision"
  # ---- 40..46 business constraints ----
  - priority: 40
    category: business_constraint
    check: "the resolved margin implied by the grant or by the credit memo stays <= TIER_MARGIN_CEILING_PCT[partner.tier]"
    error_id: ERR_MARGIN_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /special-pricing-requests/{id}/decision, POST /order-invoices/{id}/credit-memo"
  - priority: 41
    category: business_constraint
    check: "0 < credit_memo_cents < invoice.invoice_amount_cents"
    error_id: ERR_CREDIT_EXCEEDS_INVOICE
    http_status: 422
    applies_to: "POST /order-invoices/{id}/credit-memo"
  - priority: 42
    category: business_constraint
    check: "at least one ProofOfPerformance of the claim has verified == true"
    error_id: ERR_NO_VERIFIED_PROOF
    http_status: 409
    applies_to: "POST /mdf-claims/{id}/validate with decision = VALIDATE"
  - priority: 43
    category: business_constraint
    check: "the proof has verified == false (verification is not repeatable, since a second verify would double-count its spend into marketing_qualified_spend_cents)"
    error_id: ERR_PROOF_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /mdf-claims/{id}/proofs/{proof_id}/verify"
  - priority: 44
    category: business_referential
    check: "when supersedes_registration_id is present it names a registration of the same partner_id, account_id and product_line whose status == APPROVED"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /deal-registrations, POST /deal-registrations/{id}/decision with decision = APPROVE"
  - priority: 45
    category: business_referential
    check: "the SpecialPricingRequest targets a DealRegistration whose status == APPROVED and whose exclusivity window is live at clock_now"
    error_id: ERR_REGISTRATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /special-pricing-requests"
  - priority: 46
    category: business_constraint
    check: "case.escalation_level < MAX_ESCALATION_LEVEL"
    error_id: ERR_CONFLICT_ESCALATION_LIMIT
    http_status: 409
    applies_to: "POST /conflict-cases/{id}/escalate"
  # ---- 50..51 fiscal: budget and quota checks run last ----
  - priority: 50
    category: business_fiscal
    check: "requested_cents <= allocation.available_cents"
    error_id: ERR_MDF_ALLOCATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mdf-claims"
  - priority: 51
    category: business_fiscal
    check: "allocated_cents of this new period plus the allocated_cents of every existing allocation of the same partner whose [period_start, period_end] intersects this one (inclusive endpoints) must be <= ANNUAL_MDF_CAP_CENTS[partner.tier]"
    error_id: ERR_MDF_PERIOD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /mdf-allocations"

endpoints:
  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant. The startup default is exactly 2026-08-01T00:00:00Z: before the first call the logical clock reads that instant and MUST NOT fall back to real wall-clock time. Every window, deadline, cooldown and expiry rule in this scaffold reads only this clock."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner, DirectSalesRep]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["no entity is written; subsequent requests observe clock_now == current_utc"]
  # ---------------------------------------------------------------- Partner
  - method: POST
    path: "/partners"
    description: "Enrols a channel partner at the entry tier."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [company_name, partner_type, "marketing_commitment_cents?"]
    output: Partner
    side_effects:
      - "tier := REGISTERED, tier_status := COMPLIANT, portal_entitlement_level := BASIC, cert_credit_total := 0, trailing_revenue_cents := 0, marketing_qualified_spend_cents := 0, open_conflict_count := 0"
      - "marketing_commitment_cents defaults to 0 when omitted, which makes marketing_attainment_pct exactly 1.0000 per calculations.marketing_attainment"
  - method: GET
    path: "/partners"
    description: "Lists partners with paging and program filters."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep]
    code: 200
    input: ["limit?", "offset?", "tier?", "tier_status?", "partner_type?"]
    output: Partner[]
    side_effects: []
  - method: GET
    path: "/partners/{id}"
    description: "Reads one partner including every derived program field."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: []
    output: Partner
    side_effects: []
  - method: PATCH
    path: "/partners/{id}"
    description: "Updates the partner's contractual marketing commitment or legal name."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: ["company_name?", "marketing_commitment_cents?"]
    output: Partner
    side_effects:
      - "marketing_attainment_pct recomputed per calculations.marketing_attainment against the new commitment"
      - "portal_entitlement_level recomputed per calculations.portal_entitlement"
      - "increments Partner.version by 1"
  # ---------------------------------------------------------------- CertificationRecord
  - method: POST
    path: "/partners/{id}/certifications"
    description: "Records a certification earned by one of the partner's engineers."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [engineer_name, track, issued_at, expires_at]
    output: CertificationRecord
    side_effects:
      - "credit_weight := CERT_CREDIT_WEIGHT[track]; status := ACTIVE"
      - "partner.cert_credit_total recomputed per calculations.certification_credit_rollup"
      - "partner.portal_entitlement_level recomputed per calculations.portal_entitlement"
      - "increments Partner.version by 1"
  - method: GET
    path: "/partners/{id}/certifications"
    description: "Lists the certification records held by one partner."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CertificationRecord[]
    side_effects: []
  - method: GET
    path: "/certifications"
    description: "Lists certification records across partners."
    roles: [ChannelOpsAnalyst, ChannelDirector]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "status?", "track?"]
    output: CertificationRecord[]
    side_effects: []
  - method: GET
    path: "/certifications/{id}"
    description: "Reads one certification record."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: CertificationRecord
    side_effects: []
  # ---------------------------------------------------------------- Account
  - method: POST
    path: "/accounts"
    description: "Registers an end-customer account in the channel coverage map."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [account_name, region_code]
    output: Account
    side_effects: ["coverage_state := OPEN_CHANNEL; protected_until, protected_partner_id, protected_product_line, direct_pursuit_owner_id, direct_pursuit_declared_at := null"]
  - method: GET
    path: "/accounts"
    description: "Lists accounts with coverage filters; protected_partner_id finds every account a given partner currently protects."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: ["limit?", "offset?", "region_code?", "coverage_state?", "protected_partner_id?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}"
    description: "Reads one account's coverage state, including the version needed for POST /account-mappings."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/accounts/{id}/direct-pursuit"
    description: "A direct sales representative declares pursuit of the account. On a CHANNEL_PROTECTED account this raises the PARTNER_VS_DIRECT conflict (CASCADE D) instead of taking the account."
    roles: [DirectSalesRep]
    code: 200
    input: ["pursuit_note?"]
    output: Account
    side_effects:
      - "direct_pursuit_owner_id := X-User-ID; direct_pursuit_declared_at := clock_now"
      - "OPEN_CHANNEL -> NAMED_DIRECT, or CHANNEL_PROTECTED -> CHANNEL_PROTECTED with CASCADE D hops 1-3"
      - "increments Account.version by 1"
  - method: GET
    path: "/accounts/{id}/deal-registrations"
    description: "Lists every deal registration filed against one account, whatever its status."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep]
    code: 200
    input: ["limit?", "offset?", "status?", "product_line?"]
    output: DealRegistration[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/conflict-cases"
    description: "Lists every channel conflict case raised on one account."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ConflictCase[]
    side_effects: []
  # ---------------------------------------------------------------- AccountMapping
  - method: POST
    path: "/account-mappings"
    description: "Proposes an account mapping agreement between a partner and an account for a closed date window. Carries the OCC guard on the account (§1.2.1 mapping-create-stale-account)."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [partner_id, account_id, product_line, exclusivity_scope, effective_from, effective_until, expected_account_version]
    output: AccountMapping
    side_effects:
      - "mapping sweep first: every AccountMapping with mapping_status == ACTIVE and effective_until < clock_now transitions ACTIVE -> EXPIRED with closure_reason = 'WINDOW_ELAPSED'"
      - "the proposed window is then tested by calculations.mapping_window_conflict"
      - "mapping_status := PROPOSED, counter_round := 0, activated_at := null"
      - "increments Account.version by 1"
  - method: GET
    path: "/account-mappings"
    description: "Lists account mapping agreements; partner_id and account_id are the reverse-reachability filters for both of the entity's foreign keys."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "account_id?", "mapping_status?", "product_line?"]
    output: AccountMapping[]
    side_effects: []
  - method: GET
    path: "/account-mappings/{id}"
    description: "Reads one account mapping agreement."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: AccountMapping
    side_effects: []
  - method: POST
    path: "/account-mappings/{id}/respond"
    description: "Advances the mapping negotiation: COUNTER re-proposes a window (partner from PROPOSED, vendor from COUNTERED), ACCEPT activates the stored window, TERMINATE abandons the agreement."
    roles: [Partner, ChannelOpsAnalyst]
    code: 200
    input: [action, "effective_from?", "effective_until?", "terminated_reason?"]
    output: AccountMapping
    side_effects:
      - "COUNTER: window overwritten, counter_round += 1 (capped by MAX_COUNTER_ROUNDS), window re-tested by calculations.mapping_window_conflict"
      - "ACCEPT: mapping_status := ACTIVE, activated_at := clock_now, window re-tested against ACTIVE mappings only"
      - "TERMINATE: mapping_status := TERMINATED, closure_reason := terminated_reason, and the terminated window stops contributing any cooldown buffer"
      - "increments AccountMapping.version by 1"
  # ---------------------------------------------------------------- DealRegistration
  - method: POST
    path: "/deal-registrations"
    description: "Drafts a deal registration. Nothing is validated against the coverage map until submit."
    roles: [Partner]
    code: 201
    input: [partner_id, account_id, product_line, expected_amount_cents, expected_close_date, "supersedes_registration_id?"]
    output: DealRegistration
    side_effects:
      - "status := DRAFT, revision_round := 0, registration_margin_uplift_pct := 0.0, submitted_at/approved_at/exclusivity_start_at/exclusivity_end_at/protection_days := null"
      - "when supersedes_registration_id is present it is checked by validations priority 44"
  - method: GET
    path: "/deal-registrations"
    description: "Lists deal registrations; partner_id, account_id and supersedes_registration_id are the reverse-reachability filters for the entity's three foreign keys (the third being self-referential)."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "account_id?", "status?", "product_line?", "supersedes_registration_id?"]
    output: DealRegistration[]
    side_effects: []
  - method: GET
    path: "/deal-registrations/{id}"
    description: "Reads one deal registration including its exclusivity window and the version needed for POST /special-pricing-requests."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: []
    output: DealRegistration
    side_effects: []
  - method: POST
    path: "/deal-registrations/{id}/submit"
    description: "Submits a DRAFT registration, or resubmits one in CHANGES_REQUESTED. Runs the exclusivity expiry sweep before every window precondition."
    roles: [Partner]
    code: 200
    input: []
    output: DealRegistration
    side_effects:
      - "EXPIRY SWEEP: APPROVED registrations on the same (account_id, product_line) whose exclusivity_end_at <= clock_now become EXPIRED, and a swept protector releases its account CHANNEL_PROTECTED -> OPEN_CHANNEL"
      - "submitted_at := clock_now; on the CHANGES_REQUESTED path revision_round += 1"
      - "increments DealRegistration.version by 1"
  - method: POST
    path: "/deal-registrations/{id}/review"
    description: "Channel operations starts the review (START_REVIEW) or sends the deal back to the partner (REQUEST_CHANGES)."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: [action, "reviewer_note?"]
    output: DealRegistration
    side_effects: ["SUBMITTED -> UNDER_REVIEW, or UNDER_REVIEW -> CHANGES_REQUESTED with closure_reason := reviewer_note", "increments DealRegistration.version by 1"]
  - method: POST
    path: "/deal-registrations/{id}/decision"
    description: "The channel director approves or rejects a reviewed registration. APPROVE fires CASCADE A (account protection, sibling registrations held, conflict cases raised, partner standing downgraded)."
    roles: [ChannelDirector]
    code: 200
    input: [decision, "reject_reason?"]
    output: DealRegistration
    side_effects:
      - "APPROVE: approved_at := clock_now, protection_days and the half-open exclusivity window per calculations.exclusivity_window, registration_margin_uplift_pct := 0.06"
      - "APPROVE: CASCADE A hops 1-4, plus the predecessor's APPROVED -> SUPERSEDED when supersedes_registration_id is set"
      - "REJECT: closure_reason := reject_reason, registration_margin_uplift_pct := 0.0"
      - "increments DealRegistration.version by 1"
  - method: POST
    path: "/deal-registrations/{id}/convert"
    description: "Marks an approved registration as converted once at least one of its orders has been invoiced."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: []
    output: DealRegistration
    side_effects: ["status := CONVERTED, closure_reason := 'CONVERTED'", "increments DealRegistration.version by 1"]
  - method: GET
    path: "/deal-registrations/{id}/special-pricing-requests"
    description: "Lists the special pricing requests filed against one registration."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SpecialPricingRequest[]
    side_effects: []
  - method: GET
    path: "/deal-registrations/{id}/order-invoices"
    description: "Lists the orders priced against one registration."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: OrderInvoice[]
    side_effects: []
  # ---------------------------------------------------------------- ConflictCase
  - method: GET
    path: "/conflict-cases"
    description: "Lists channel conflict cases; account_id, subject_registration_id and counter_registration_id are the reverse-reachability filters for the entity's three foreign keys. Cases are only ever created by cascade, so this list and the sub-resource GET are their only discovery channels."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: ["limit?", "offset?", "account_id?", "subject_registration_id?", "counter_registration_id?", "status?", "conflict_type?"]
    output: ConflictCase[]
    side_effects: []
  - method: GET
    path: "/conflict-cases/{id}"
    description: "Reads one conflict case, including both stored recommendation variants and the applied_variant label."
    roles: [ChannelOpsAnalyst, ChannelDirector, DirectSalesRep, Partner]
    code: 200
    input: []
    output: ConflictCase
    side_effects: []
  - method: POST
    path: "/conflict-cases/{id}/escalate"
    description: "Escalates a case one rung up the ladder: the partner escalates to tier 1, direct sales escalates to tier 2. Capped at MAX_ESCALATION_LEVEL."
    roles: [Partner, DirectSalesRep]
    code: 200
    input: [escalation_note]
    output: ConflictCase
    side_effects: ["status := ESCALATED_TIER1 or ESCALATED_TIER2, escalation_level := 1 or 2, resolution_note := escalation_note", "increments ConflictCase.version by 1"]
  - method: POST
    path: "/conflict-cases/{id}/resolve"
    description: "The channel director resolves the case in favour of the partner, of direct sales, or by splitting the account. The stored recommendation is advisory and may be overruled."
    roles: [ChannelDirector]
    code: 200
    input: [resolution, resolution_note]
    output: ConflictCase
    side_effects:
      - "PARTNER: subject registration CONFLICT_HELD -> SUBMITTED (partner-vs-partner) or keeps APPROVED with closure_reason cleared and account.direct_pursuit_owner_id := null (partner-vs-direct)"
      - "DIRECT: subject registration -> REJECTED with closure_reason 'RESOLVED_DIRECT' and uplift 0.0; account -> DIRECT_LOCKED with every protection field cleared"
      - "SPLIT: subject registration CONFLICT_HELD -> APPROVED with floor(PROTECTION_DAYS_BY_TIER/2) days and uplift 0.02; account.protected_until := max(old, new)"
      - "the subject partner's open_conflict_count recomputed, with the PROBATION-clearing rule and portal_entitlement_level recomputation"
      - "increments ConflictCase.version by 1"
  # ---------------------------------------------------------------- SpecialPricingRequest
  - method: POST
    path: "/special-pricing-requests"
    description: "Requests extra margin on an approved, in-window registration. Carries the OCC guard on the registration (§1.2.1 spr-create-stale-registration); a successful create supersedes any still-pending request on the same registration."
    roles: [Partner]
    code: 201
    input: [registration_id, requested_extra_margin_pct, justification, expected_registration_version]
    output: SpecialPricingRequest
    side_effects:
      - "status := SUBMITTED, approved_extra_margin_pct := null, expires_at := MIN(registration.exclusivity_end_at, clock_now + 30 days)"
      - "every other SpecialPricingRequest on the same registration_id with status == SUBMITTED transitions SUBMITTED -> SUPERSEDED with approved_extra_margin_pct := 0.0"
      - "increments DealRegistration.version by 1"
  - method: GET
    path: "/special-pricing-requests"
    description: "Lists special pricing requests; registration_id is the reverse-reachability filter."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "registration_id?", "status?"]
    output: SpecialPricingRequest[]
    side_effects: []
  - method: GET
    path: "/special-pricing-requests/{id}"
    description: "Reads one special pricing request."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: SpecialPricingRequest
    side_effects: []
  - method: POST
    path: "/special-pricing-requests/{id}/decision"
    description: "The channel director grants the full request, grants a smaller uplift (PARTIAL), or denies it. Every grant is capped by the tier margin ceiling."
    roles: [ChannelDirector]
    code: 200
    input: [decision, "approved_extra_margin_pct?"]
    output: SpecialPricingRequest
    side_effects:
      - "APPROVE: approved_extra_margin_pct := requested_extra_margin_pct; PARTIAL: := the decided value; DENY: := 0.0"
      - "decided_by_user_id := X-User-ID"
      - "increments SpecialPricingRequest.version by 1"
  # ---------------------------------------------------------------- MdfAllocation
  - method: POST
    path: "/mdf-allocations"
    description: "Opens a market development fund period for a partner and sizes it from the revenue invoiced strictly before the period opens."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [partner_id, period_start, period_end]
    output: MdfAllocation
    side_effects:
      - "the aggregate period-capacity check of validations priority 51 runs first, over every existing allocation of the partner whose inclusive period intersects this one"
      - "basis_revenue_cents, allocated_cents and available_cents written per calculations.mdf_allocation_sizing; committed_cents, paid_cents, expired_cents := 0"
      - "status := OPEN, closed_at := null"
  - method: GET
    path: "/mdf-allocations"
    description: "Lists fund periods; partner_id is the reverse-reachability filter."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "status?"]
    output: MdfAllocation[]
    side_effects: []
  - method: GET
    path: "/mdf-allocations/{id}"
    description: "Reads one fund period with all four buckets, so the conservation identity of calculations.mdf_fund_conservation is directly observable."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: MdfAllocation
    side_effects: []
  - method: POST
    path: "/mdf-allocations/{id}/close"
    description: "Closes the fund period. Runs CASCADE C in pinned order: reject open claims, write off validated-but-unpaid claims, burn the remaining balance, then close."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: []
    output: MdfAllocation
    side_effects:
      - "CASCADE C step 1: SUBMITTED and PROOF_REQUESTED claims -> validation_state REJECTED, committed_cents released"
      - "CASCADE C step 2: VALIDATED claims with settlement_state UNPAID or APPROVED_FOR_PAYMENT -> settlement_state WRITTEN_OFF, committed_cents moved into expired_cents"
      - "CASCADE C step 3: the remaining available_cents moved into expired_cents"
      - "CASCADE C step 4: status := CLOSED, closed_at := clock_now"
      - "increments MdfAllocation.version by 1"
  - method: GET
    path: "/mdf-allocations/{id}/mdf-claims"
    description: "Lists the claims drawn against one fund period."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "validation_state?", "settlement_state?"]
    output: MdfClaim[]
    side_effects: []
  # ---------------------------------------------------------------- MdfClaim / ProofOfPerformance
  - method: POST
    path: "/mdf-claims"
    description: "Submits a market development fund claim against an open period; the requested amount is committed against the pool immediately."
    roles: [Partner]
    code: 201
    input: [allocation_id, activity_type, requested_cents]
    output: MdfClaim
    side_effects:
      - "validation_state := SUBMITTED, settlement_state := UNPAID, proof_round := 0, matched_total_cents := null, approved_cents := null"
      - "allocation.committed_cents += requested_cents; allocation.available_cents recomputed per calculations.mdf_fund_conservation"
      - "increments MdfAllocation.version by 1"
  - method: GET
    path: "/mdf-claims"
    description: "Lists claims; allocation_id is the reverse-reachability filter."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "allocation_id?", "validation_state?", "settlement_state?", "activity_type?"]
    output: MdfClaim[]
    side_effects: []
  - method: GET
    path: "/mdf-claims/{id}"
    description: "Reads one claim with both of its independent state dimensions."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: MdfClaim
    side_effects: []
  - method: POST
    path: "/mdf-claims/{id}/proofs"
    description: "Attaches a proof-of-performance document to the claim. Allowed while the claim is SUBMITTED (no round consumed) and while it is PROOF_REQUESTED (which returns the claim to SUBMITTED)."
    roles: [Partner]
    code: 201
    input: [doc_type, spend_amount_cents, "audience_reach?"]
    output: ProofOfPerformance
    side_effects:
      - "verified := false, verified_at := null, verified_by_user_id := null, matched_line_cents := null"
      - "from PROOF_REQUESTED the claim's validation_state returns to SUBMITTED"
      - "increments MdfClaim.version by 1"
  - method: GET
    path: "/mdf-claims/{id}/proofs"
    description: "Lists the proof documents attached to one claim."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "verified?"]
    output: ProofOfPerformance[]
    side_effects: []
  - method: GET
    path: "/proofs/{id}"
    description: "Reads one proof-of-performance document, including its matched_line_cents once the claim has been validated."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: ProofOfPerformance
    side_effects: []
  - method: POST
    path: "/mdf-claims/{id}/proofs/{proof_id}/verify"
    description: "Channel operations verifies one proof document. Only verified proofs feed calculations.mdf_claim_approval and calculations.marketing_attainment, and verification is not repeatable."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: []
    output: ProofOfPerformance
    side_effects:
      - "verified := true, verified_at := clock_now, verified_by_user_id := X-User-ID"
      - "when the parent claim is already VALIDATED, partner.marketing_qualified_spend_cents and marketing_attainment_pct are recomputed"
      - "increments ProofOfPerformance.version by 1"
  - method: POST
    path: "/mdf-claims/{id}/validate"
    description: "Channel operations validates the claim (per-proof-line matching), asks for more proof, or rejects it. Rejecting an already VALIDATED and still UNPAID claim fires CASCADE B."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: [decision, "rejection_reason?"]
    output: MdfClaim
    side_effects:
      - "VALIDATE: matched_total_cents and approved_cents per calculations.mdf_claim_approval, each proof's matched_line_cents written, the unmatched remainder released back to available_cents, and the partner's marketing attainment recomputed"
      - "REQUEST_PROOF: proof_round += 1, validation_state := PROOF_REQUESTED"
      - "REJECT: approved_cents := 0, the committed amount released, and on the VALIDATED -> REJECTED path CASCADE B hops 1-4"
      - "increments MdfClaim.version by 1"
  - method: POST
    path: "/mdf-claims/{id}/settlement"
    description: "The channel director advances the independent settlement dimension: APPROVE_PAYMENT, PAY or WRITE_OFF. Segregation of duties forbids the validating user from settling."
    roles: [ChannelDirector]
    code: 200
    input: [action]
    output: MdfClaim
    side_effects:
      - "APPROVE_PAYMENT: settlement_state := APPROVED_FOR_PAYMENT"
      - "PAY: committed_cents -> paid_cents for approved_cents"
      - "WRITE_OFF: committed_cents -> expired_cents for approved_cents"
      - "settled_by_user_id := X-User-ID; increments MdfClaim.version by 1"
  # ---------------------------------------------------------------- OrderInvoice
  - method: POST
    path: "/order-invoices"
    description: "Prices a partner order. The whole margin structure - tier base, registration uplift, special pricing, stocking allowance, volume band, floor and ceiling - is resolved and frozen here in the pinned order of calculations.channel_margin_resolution."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [partner_id, order_type, list_amount_cents, "registration_id?"]
    output: OrderInvoice
    side_effects:
      - "margin_pct, volume_band, invoice_amount_cents and margin_value_cents written per calculations.channel_margin_resolution"
      - "status := PENDING, invoiced_at := null, credit_memo_cents := 0, credit_reason := null"
  - method: GET
    path: "/order-invoices"
    description: "Lists orders; partner_id and registration_id are the reverse-reachability filters for the entity's two foreign keys."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "registration_id?", "status?", "order_type?"]
    output: OrderInvoice[]
    side_effects: []
  - method: GET
    path: "/order-invoices/{id}"
    description: "Reads one order with its frozen margin structure."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: OrderInvoice
    side_effects: []
  - method: POST
    path: "/order-invoices/{id}/invoice"
    description: "Invoices a pending order, which is what turns it into program revenue."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: []
    output: OrderInvoice
    side_effects: ["status := INVOICED, invoiced_at := clock_now", "partner.trailing_revenue_cents recomputed per calculations.partner_revenue_rollup", "increments OrderInvoice.version by 1"]
  - method: POST
    path: "/order-invoices/{id}/credit-memo"
    description: "Issues a ship-and-debit credit memo against an invoiced order: cents move from invoice_amount_cents into margin_value_cents while list_amount_cents is untouched, so the conservation identity holds exactly."
    roles: [ChannelOpsAnalyst]
    code: 200
    input: [credit_memo_cents, credit_reason]
    output: OrderInvoice
    side_effects:
      - "status := CREDITED, credit_memo_cents accumulated, invoice_amount_cents reduced, margin_value_cents re-derived by subtraction, margin_pct re-derived to 4 decimals"
      - "partner.trailing_revenue_cents recomputed per calculations.partner_revenue_rollup"
      - "increments OrderInvoice.version by 1"
  # ---------------------------------------------------------------- PerformanceReview
  - method: POST
    path: "/performance-reviews"
    description: "Prepares a partner performance review and program compliance audit for a period. Runs the certification expiry sweep first (CASCADE E), then scores the partner with the PROVISIONAL variant."
    roles: [ChannelOpsAnalyst]
    code: 201
    input: [partner_id, period_start, period_end, "findings_count?"]
    output: PerformanceReview
    side_effects:
      - "CERTIFICATION SWEEP: every CertificationRecord of the partner with status == ACTIVE and expires_at <= clock_now becomes EXPIRED, then partner.cert_credit_total and portal_entitlement_level are recomputed"
      - "provisional_cert_credit, provisional_revenue_cents, provisional_score and recommended_tier written per the PROVISIONAL variant of calculations.partner_tier_scoring; marketing_attainment_pct snapshotted"
      - "prepared_by_user_id := X-User-ID; findings_count defaults to 0"
      - "status := PREPARED, or FINDINGS_OPEN with remediation_due_at := clock_now + REMEDIATION_DAYS days when findings_count > 0"
  - method: GET
    path: "/performance-reviews"
    description: "Lists performance reviews; partner_id is the reverse-reachability filter."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "status?"]
    output: PerformanceReview[]
    side_effects: []
  - method: GET
    path: "/performance-reviews/{id}"
    description: "Reads one review with both scoring variants side by side."
    roles: [ChannelOpsAnalyst, ChannelDirector, Partner]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: []
  - method: POST
    path: "/performance-reviews/{id}/remediate"
    description: "The partner closes out the audit findings before the remediation deadline."
    roles: [Partner]
    code: 200
    input: [remediation_note]
    output: PerformanceReview
    side_effects: ["status := REMEDIATED, remediation_note recorded", "increments PerformanceReview.version by 1"]
  - method: POST
    path: "/performance-reviews/{id}/decision"
    description: "The channel director approves the review (which is the only writer of Partner.tier) or rejects it (which suspends the partner). Segregation of duties forbids the preparer from deciding."
    roles: [ChannelDirector]
    code: 200
    input: [decision]
    output: PerformanceReview
    side_effects:
      - "final_cert_credit, final_revenue_cents and final_score written per the FINAL variant of calculations.partner_tier_scoring"
      - "APPROVE: approved_tier written and copied into partner.tier; tier_status := COMPLIANT unless a marketing-attainment PROBATION is standing; portal_entitlement_level recomputed"
      - "REJECT: approved_tier stays null; partner.tier_status := SUSPENDED with standing_reason 'PROGRAM_REVIEW_REJECTED'; portal_entitlement_level becomes BASIC"
      - "decided_by_user_id := X-User-ID; increments PerformanceReview.version by 1"

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of Partner, ChannelOpsAnalyst, ChannelDirector, DirectSalesRep"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles (e.g. a Partner calling POST /deal-registrations/{id}/decision, or a ChannelOpsAnalyst calling POST /mdf-claims/{id}/settlement)"
  - id: ERR_PARTNER_SCOPE_VIOLATION
    http: 403
    condition: "a Partner acts on a row belonging to another partner: a foreign registration submit, a foreign mapping response, a foreign claim proof upload, a foreign review remediation, or a create body naming another partner_id"
  # ---- existence ----
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "no Partner with the given path id or partner_id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no CertificationRecord with the given path id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no Account with the given path id or account_id"
  - id: ERR_MAPPING_NOT_FOUND
    http: 404
    condition: "no AccountMapping with the given path id"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "no DealRegistration with the given path id, registration_id or supersedes_registration_id"
  - id: ERR_CONFLICT_CASE_NOT_FOUND
    http: 404
    condition: "no ConflictCase with the given path id"
  - id: ERR_SPR_NOT_FOUND
    http: 404
    condition: "no SpecialPricingRequest with the given path id"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no MdfAllocation with the given path id or allocation_id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no MdfClaim with the given path id"
  - id: ERR_PROOF_NOT_FOUND
    http: 404
    condition: "no ProofOfPerformance with the given proof_id, or the proof exists but belongs to a different claim than the one named earlier in the path"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no OrderInvoice with the given path id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "no PerformanceReview with the given path id"
  # ---- request shape and static eligibility ----
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required field is missing, an enum value is unknown, money is negative, a percentage is outside [0, 1], a datetime is not ISO 8601 UTC with three fractional digits, an interval has end <= start, a required note (reviewer_note, reject_reason, resolution_note, remediation_note, rejection_reason, terminated_reason) is absent or empty, or a PARTIAL special-pricing decision omits approved_extra_margin_pct or sets it outside (0, requested_extra_margin_pct)"
  - id: ERR_PARTNER_TYPE_NOT_ELIGIBLE
    http: 422
    condition: "a RESELLER partner is given an order with order_type == STOCKING"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "expected_registration_version on POST /special-pricing-requests does not equal the DealRegistration's current version"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version on POST /account-mappings does not equal the Account's current version"
  # ---- state ----
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the row's current state, including a terminal row, a repeated action, an exhausted revision/counter/proof round cap, a SPLIT resolution on a PARTNER_VS_DIRECT case, a claw-back of a claim already APPROVED_FOR_PAYMENT or PAID, a convert with no invoiced order, or a decision on a FINDINGS_OPEN review whose remediation deadline has not passed"
  - id: ERR_ALLOCATION_CLOSED
    http: 409
    condition: "the MdfAllocation backing the claim has status == CLOSED"
  - id: ERR_CLAIM_NOT_VALIDATED
    http: 409
    condition: "a settlement action is attempted while validation_state != VALIDATED"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "the same partner already has an in-flight registration (SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED or CONFLICT_HELD) on the same account and product line"
  # ---- safety / compliance ----
  - id: ERR_PARTNER_SUSPENDED
    http: 403
    condition: "partner.tier_status == SUSPENDED blocks registration submits, approvals, order pricing, invoicing, fund allocation, claims and special pricing requests"
  - id: ERR_AUDIT_REMEDIATION_OVERDUE
    http: 409
    condition: "the partner has a PerformanceReview in FINDINGS_OPEN whose remediation_due_at <= clock_now, or the partner tries to remediate after that deadline"
  - id: ERR_SOD_SAME_ACTOR
    http: 409
    condition: "the acting X-User-ID already performed the segregated earlier step: validating the claim it now settles, or preparing the review it now decides"
  - id: ERR_CERTIFICATION_REQUIREMENT_NOT_MET
    http: 422
    condition: "cert_credit_total < CERT_CREDIT_MIN_TO_REGISTER, or a PLATFORM_SUITE registration with cert_credit_total < CERT_CREDIT_MIN_PLATFORM_SUITE or with no ACTIVE TECH_EXPERT record"
  # ---- temporal / window ----
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "another APPROVED registration holds a live half-open exclusivity window on the same (account_id, product_line), or the account is DIRECT_LOCKED. Raised at exclusivity_end_at - 1ms and NOT raised at exactly exclusivity_end_at"
  - id: ERR_MAPPING_WINDOW_CONFLICT
    http: 409
    condition: "a mapping window intersects another non-TERMINATED mapping's window extended by MAPPING_COOLDOWN_DAYS on an overlapping scope, or a registration submit collides with another partner's live ACTIVE mapping"
  - id: ERR_EXCLUSIVITY_WINDOW_EXPIRED
    http: 409
    condition: "a SpecialPricingRequest is decided at or after its expires_at"
  # ---- business constraints ----
  - id: ERR_MARGIN_CEILING_EXCEEDED
    http: 422
    condition: "the margin implied by a special-pricing grant or by a credit memo exceeds TIER_MARGIN_CEILING_PCT for the partner's tier"
  - id: ERR_CREDIT_EXCEEDS_INVOICE
    http: 422
    condition: "credit_memo_cents <= 0 or credit_memo_cents >= the invoice's current invoice_amount_cents"
  - id: ERR_NO_VERIFIED_PROOF
    http: 409
    condition: "a claim is validated while it has zero ProofOfPerformance rows with verified == true"
  - id: ERR_PROOF_ALREADY_VERIFIED
    http: 409
    condition: "the same proof document is verified twice"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_registration_id names a registration of a different partner, account or product line, or one whose status is not APPROVED"
  - id: ERR_REGISTRATION_NOT_APPROVED
    http: 409
    condition: "a SpecialPricingRequest is created against a registration that is not APPROVED or whose exclusivity window is not live at clock_now"
  - id: ERR_CONFLICT_ESCALATION_LIMIT
    http: 409
    condition: "a case whose escalation_level is already MAX_ESCALATION_LEVEL is escalated again"
  # ---- fiscal ----
  - id: ERR_MDF_ALLOCATION_INSUFFICIENT
    http: 422
    condition: "requested_cents exceeds the allocation's available_cents (including the case of a REGISTERED partner whose allocated_cents is 0)"
  - id: ERR_MDF_PERIOD_CAPACITY_EXCEEDED
    http: 422
    condition: "the new allocation's allocated_cents plus the allocated_cents of every intersecting period of the same partner exceeds ANNUAL_MDF_CAP_CENTS for the tier; periods that merely touch at one endpoint DO intersect"

roles:
  - name: Partner
    description: "The channel partner company itself: registers deals, negotiates account mappings, requests special pricing, files market development fund claims with proof documents, escalates conflicts and remediates audit findings."
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /deal-registrations"
      - "POST /deal-registrations/{id}/submit"
      - "POST /special-pricing-requests"
      - "POST /mdf-claims"
      - "POST /mdf-claims/{id}/proofs"
      - "POST /performance-reviews/{id}/remediate"
    shared_operations:
      - "POST /account-mappings/{id}/respond (shared with ChannelOpsAnalyst; the partner side of the negotiation cycle)"
      - "POST /conflict-cases/{id}/escalate (shared with DirectSalesRep; the partner escalates to tier 1)"
      - "every GET listed in §1.5 that includes Partner, always scoped to the partner's own rows"
  - name: ChannelOpsAnalyst
    description: "Channel operations: enrols partners, records certifications, maintains the account coverage map, prices and invoices orders, opens and closes market development fund periods, verifies proof documents and validates claims, and prepares performance reviews. Never decides anything it prepared."
    identity: opaque
    exclusive_operations:
      - "POST /partners"
      - "PATCH /partners/{id}"
      - "POST /partners/{id}/certifications"
      - "POST /accounts"
      - "POST /account-mappings"
      - "POST /deal-registrations/{id}/review"
      - "POST /deal-registrations/{id}/convert"
      - "POST /mdf-allocations"
      - "POST /mdf-allocations/{id}/close"
      - "POST /mdf-claims/{id}/proofs/{proof_id}/verify"
      - "POST /mdf-claims/{id}/validate"
      - "POST /order-invoices"
      - "POST /order-invoices/{id}/invoice"
      - "POST /order-invoices/{id}/credit-memo"
      - "POST /performance-reviews"
    shared_operations:
      - "POST /account-mappings/{id}/respond (shared with Partner; the vendor side of the negotiation cycle)"
      - "every GET listed in §1.5 that includes ChannelOpsAnalyst"
  - name: ChannelDirector
    description: "The approval authority: decides deal registrations, special pricing requests, channel conflict resolutions, claim settlements and performance reviews. Segregation of duties bars the director from settling a claim it validated or deciding a review it prepared."
    identity: opaque
    exclusive_operations:
      - "POST /deal-registrations/{id}/decision"
      - "POST /special-pricing-requests/{id}/decision"
      - "POST /conflict-cases/{id}/resolve"
      - "POST /mdf-claims/{id}/settlement"
      - "POST /performance-reviews/{id}/decision"
    shared_operations:
      - "every GET listed in §1.5 that includes ChannelDirector"
  - name: DirectSalesRep
    description: "The vendor's own field sales representative: declares direct pursuit of accounts, which is what creates channel conflict against a protected partner, and escalates a conflict case to tier 2."
    identity: opaque
    exclusive_operations:
      - "POST /accounts/{id}/direct-pursuit"
    shared_operations:
      - "POST /conflict-cases/{id}/escalate (shared with Partner; direct sales escalates to tier 2)"
      - "every GET listed in §1.5 that includes DirectSalesRep"
