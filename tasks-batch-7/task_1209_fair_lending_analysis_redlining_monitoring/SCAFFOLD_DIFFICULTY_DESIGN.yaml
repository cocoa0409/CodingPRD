  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: (state x business_safety) and
  # (business_referential x business_fiscal). Different category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_exception_create
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OFFICER_SUSPENDED]
        distinguishing_aspect: |
          Category pair (state, business_safety): the request fails BOTH the
          priority-5 state check (referenced application is EXCLUDED, not
          VALIDATED) AND the priority-6 safety check (owning officer is
          SUSPENDED). The scaffold pins state before safety, so the response
          must be ERR_INVALID_STATE — not ERR_OFFICER_SUSPENDED.
        test_recipe:
          setup:
            - "Officer O1 SUSPENDED; application a1 owned by O1 was VALIDATED then EXCLUDED"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { a1: $.data.id } }
            - { call: "POST /fair-lending/applications/${a1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${a1}/exclude", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/loan-officers/${o1}/suspend", payload: {}, as: ComplianceDirector }
          trigger:
            - { call: "POST /fair-lending/pricing-exceptions", payload: { application_id: "${a1}", kind: RATE_ABOVE_CAP, requested_rate_bps: 770, justification: "strategic" }, as: LoanOfficer, as_user_id: "${o1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409) — the priority-5 state failure on the EXCLUDED application wins over the priority-6 ERR_OFFICER_SUSPENDED safety failure"

      - name: referential_vs_fiscal_on_manual_payment
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_PAYEE_NOT_IN_CAP_SCOPE]
          - errors[ERR_CAP_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_referential, business_fiscal): the manual
          payment fails BOTH the priority-9 referential check (payee
          application is not in the finding's harmed_application_ids) AND the
          priority-10 fiscal check (amount 1 cent > remaining_cents 0). The
          scaffold pins referential before fiscal, so the response must be
          ERR_PAYEE_NOT_IN_CAP_SCOPE.
        test_recipe:
          setup:
            - "Run R COMPUTED; manual finding F SUBSTANTIATED with harmed [p1, p2, p3]; outsider VALIDATED app o1x exists but is NOT in the harmed set"
            - "CAP C pool_cents=10000 approved -> EXECUTING with payments [3334, 3333, 3333]; remaining_cents == 0"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 715, dti_pct: 36.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 716, dti_pct: 36.0, application_date: "2026-02-02", decision_date: "2026-02-11" }, as: LendingDataOps, captures: { p2: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 717, dti_pct: 36.0, application_date: "2026-02-03", decision_date: "2026-02-12" }, as: LendingDataOps, captures: { p3: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 718, dti_pct: 36.0, application_date: "2026-02-04", decision_date: "2026-02-13" }, as: LendingDataOps, captures: { o1x: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p2}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p3}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${o1x}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: PRICING_DISPARITY, notes: "manual" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings/${f1}/substantiate", payload: { harmed_application_ids: ["${p1}", "${p2}", "${p3}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { f_v: $.data.version } }
            - { call: "POST /fair-lending/corrective-action-plans", payload: { finding_id: "${f1}", title: "remediation", pool_cents: 10000, due_date: "2026-06-30", expected_finding_version: "${f_v}" }, as: FairLendingAnalyst, captures: { cap1: $.data.id } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/submit", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/approve", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /fair-lending/remediation-payments", payload: { corrective_action_plan_id: "${cap1}", application_id: "${o1x}", amount_cents: 1 }, as: RemediationSpecialist, as_user_id: "specialist-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYEE_NOT_IN_CAP_SCOPE (http 422) — the priority-9 referential failure wins over the priority-10 ERR_CAP_BUDGET_EXCEEDED fiscal failure (1 > remaining_cents 0)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: impact ratio exactly at the four-fifths
  # threshold on POST compute; manual payment exactly equal to remaining budget
  # on POST remediation-payments. Different metrics, different endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: impact_ratio_exactly_four_fifths_no_flag
        grounds:
          - calculations.denial_impact_ratio
          - entities.AnalysisRun.fields.screening_flag
          - errors[ERR_NO_IN_SCOPE_APPLICATIONS]
        distinguishing_aspect: |
          Metric: four-fifths impact ratio; endpoint: POST
          /analysis-runs/{id}/compute. The rule is strictly-below: a ratio of
          exactly 0.8000 (protected 0.8 / control 1.0) classifies MARGINAL and
          does NOT set screening_flag — no auto-finding is created. One
          protected approval fewer would give 0.7000 and flag ADVERSE.
