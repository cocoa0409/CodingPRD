          assert:
            - "trigger fails 422 ERR_SUPPLIER_NOT_QUALIFIABLE (65 < 70)"
            - "Supplier.${sup_id}.qualification_status == PENDING_AUDIT and audit_score is null"

      - name: cn_val_writedown_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.InventoryWriteDown.PROPOSED_to_POSTED"
        distinguishing_aspect: "Segregation of duties: a FinanceController whose X-User-ID equals proposed_by_user_id is rejected 403 even though the ROLE is correct — the check is on the user identity, not the role."
        test_recipe:
          setup: ["Canonical RECALL write-down (1 case) proposed by planner-1, still PROPOSED."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RECALLED" }
              as: QualityManager
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 1, reason: "RECALL" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { wd_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/inventory-write-downs/${wd_id}/decision"
              payload: { decision: "POSTED" }
              as: FinanceController
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 403 ERR_SEGREGATION_OF_DUTIES (decision-maker id == proposed_by_user_id planner-1)"
            - "InventoryWriteDown.${wd_id}.status == PROPOSED"

      - name: cn_val_forecast_not_actualized
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FORECAST_NOT_ACTUALIZED]"
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / cesd_forecast_miss_writedown_requires_actualized"
          rationale: "The §1.8 instance asserts ERR_FORECAST_NOT_ACTUALIZED on a LOCKED forecast as its first trigger leg."

  # ===========================================================================
  - section: validations
    instances:
      - name: cn_val_line_operational_forbidden
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LINE_OPERATIONAL_FORBIDDEN]"
          - "state_machines.ProductionRun.SCHEDULED_to_IN_PROGRESS"
        distinguishing_aspect: "Run start reads the line's operational dimension: a line in DOWN rejects IN_PROGRESS with 422 ERR_LINE_OPERATIONAL_FORBIDDEN even though certification is CERTIFIED."
        test_recipe:
          setup: ["OWNED line; product PROD-K-40 ACTIVE with APPROVED label; run scheduled; line then moved IDLE -> DOWN."]
          setup_api_calls:
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-40", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - call: "POST /protein-ops/production-lines/${line_id}/operational-transitions"
              payload: { target_status: "DOWN" }
              as: PlantManager
          trigger:
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_LINE_OPERATIONAL_FORBIDDEN (line DOWN)"
            - "ProductionRun.${run_id}.status == SCHEDULED"

      - name: cn_val_product_not_producible
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PRODUCT_NOT_PRODUCIBLE]"
        distinguishing_aspect: "A run cannot be scheduled for a product still in DEVELOPMENT (even with an APPROVED label): 422 ERR_PRODUCT_NOT_PRODUCIBLE — only PILOT or ACTIVE products may be extruded."
        test_recipe:
          setup: ["OWNED line; product PROD-K-41 in DEVELOPMENT with an APPROVED label."]
          setup_api_calls:
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-41", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_PRODUCT_NOT_PRODUCIBLE (status DEVELOPMENT)"

      - name: cn_val_reserve_product_mismatch
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PRODUCT_MISMATCH]"
          - "endpoints.POST_/protein-ops/finished-goods-batches/{id}/reserve"
        distinguishing_aspect: "A reservation binds batch to program only when products match: reserving product Y's batch into product X's program fails 422 ERR_PRODUCT_MISMATCH."
        test_recipe:
          setup: ["Canonical FOODSERVICE batch for PROD-K-42A; program PROG-K-42 for a DIFFERENT product PROD-K-42B (also ACTIVE with its own approved label), program ACTIVE."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-42B", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_b: $.data.id, prod_b_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_b}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_b: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_b}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_b}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_b_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_b}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_b}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-42", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K42", product_id: "${prod_b}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/finished-goods-batches/${batch_id}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 2 }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_PRODUCT_MISMATCH (program is for PROD-K-42B, batch is PROD-K-10/42A product)"

      - name: cn_val_batch_not_writable_after_full_writedown
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BATCH_NOT_WRITABLE]"
          - "calculations.batch_derived_status"
        distinguishing_aspect: "Once written_off_cases == quantity_cases the batch derives WRITTEN_OFF and further write-down proposals fail 422 ERR_BATCH_NOT_WRITABLE (this check precedes the quantity bound)."
        test_recipe:
          setup: ["Canonical FROZEN batch of 10 cases, run RECALLED; write-down of all 10 cases POSTED by fin-1."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RECALLED" }
              as: QualityManager
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 10, reason: "RECALL" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { wd1: $.data.id }
            - call: "POST /protein-ops/inventory-write-downs/${wd1}/decision"
              payload: { decision: "POSTED" }
              as: FinanceController
              as_user_id: "fin-1"
          trigger:
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 1, reason: "RECALL" }
              as: DemandPlanner
              captures: { err: $.data.error_id }
          assert:
            - "batch derived_status == WRITTEN_OFF after the full write-down"
            - "trigger fails 422 ERR_BATCH_NOT_WRITABLE (not ERR_WRITEDOWN_EXCEEDS_AVAILABLE — the status gate precedes the quantity bound)"

      - name: cn_val_insufficient_isolate_at_completion
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INSUFFICIENT_ISOLATE]"
          - "calculations.batch_costing"
        distinguishing_aspect: "Completion requires ceil(actual * 0.85) kg of matching RELEASED isolate: with only 50 kg released, a 100 kg completion (needs 85) fails 422 and the run stays IN_PROGRESS with no consumption."
        test_recipe:
          setup: ["Supplier QUALIFIED/ACTIVE with only 50 kg released; OWNED line; product PROD-K-43 ACTIVE with APPROVED label; run IN_PROGRESS."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-43", quantity_kg: 50, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 500, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-43", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
          trigger:
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_INSUFFICIENT_ISOLATE (50 < 85 required)"
            - "ProductionRun.${run_id}.status == IN_PROGRESS and consumed_lot_ids == [] (no partial consumption)"
            - "IngredientLot.${lot_id}.remaining_kg == 50"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: cn_ep_runs_reverse_lookup_by_program
        claim_type: Retrieval
        grounds:
          - "endpoints.GET_/protein-ops/production-runs"
          - "entities.ProductionRun.fields.program_id"
        distinguishing_aspect: "Multi-FK filtered list: GET /production-runs?program_id=P returns exactly the two runs dedicated to P and excludes the non-dedicated run on the same line — the reverse-reachability channel for the Run->Program FK."
        test_recipe:
          setup: ["Canonical chain; LTO program PROG-K-50 ACTIVE (window 2026-09-01..2026-10-31); two dedicated FOODSERVICE runs (2026-09-05, 2026-09-06) plus one non-dedicated RETAIL_FROZEN run (2026-09-07) on the same line."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-50", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K50", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 50, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { r1: $.data.id }
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { lv2: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 50, scheduled_start: "2026-09-06T08:00:00Z", scheduled_end: "2026-09-06T12:00:00Z", expected_line_version: "${lv2}" }
              as: PlantManager
              captures: { r2: $.data.id }
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { lv3: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 50, scheduled_start: "2026-09-07T08:00:00Z", scheduled_end: "2026-09-07T12:00:00Z", expected_line_version: "${lv3}" }
              as: PlantManager
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /protein-ops/production-runs"
              payload: { program_id: "${prog_id}" }
              as: ChannelManager
          assert:
            - "response contains exactly the two dedicated runs ${r1} and ${r2} (total_count == 2)"
            - "the non-dedicated run ${r3} is excluded"

      - name: cn_ep_qa_release_satisfaction
        claim_type: satisfaction_pass
        grounds:
          - "endpoints.POST_/protein-ops/production-runs/{id}/transitions"
          - "state_machines.ProductionRun.COMPLETED_to_RELEASED"
        distinguishing_aspect: "Positive side of the QA gate: QualityManager releases a COMPLETED run and the run lands in terminal RELEASED with its batch untouched (release never mutates batch quantities)."
        test_recipe:
          setup: ["Canonical FROZEN batch of 10 cases; run COMPLETED."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
          trigger:
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RELEASED" }
              as: QualityManager
          assert:
            - "ProductionRun.${run_id}.status == RELEASED"
            - "FinishedGoodsBatch.${batch_id}.available_cases == 10 and recall_flag == false (release is quantity-neutral)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: cn_rbac_plantmanager_cannot_release_run
        claim_type: violation_to_error
        grounds:
          - "roles.PlantManager"
          - "roles.QualityManager"
          - "validations[priority=2]"
        distinguishing_aspect: "Per-target role split on one endpoint: PlantManager may drive IN_PROGRESS/COMPLETED/ABORTED but targeting RELEASED yields 403 ERR_UNAUTHORIZED — only QualityManager decides QA."
        test_recipe:
          setup: ["Canonical FROZEN run COMPLETED."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
          trigger:
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RELEASED" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 403 ERR_UNAUTHORIZED"
            - "ProductionRun.${run_id}.status == COMPLETED (unchanged)"

      - name: cn_rbac_demandplanner_cannot_decide_writedown
        claim_type: violation_to_error
        grounds:
          - "roles.DemandPlanner"
          - "roles.FinanceController"
        distinguishing_aspect: "The proposing role has no access to the decision endpoint at all: DemandPlanner gets 403 ERR_UNAUTHORIZED (role-level), a distinct failure from the 403 ERR_SEGREGATION_OF_DUTIES identity check."
        test_recipe:
          setup: ["Canonical RECALL write-down PROPOSED by planner-1."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RECALLED" }
              as: QualityManager
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 1, reason: "RECALL" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { wd_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/inventory-write-downs/${wd_id}/decision"
              payload: { decision: "POSTED" }
              as: DemandPlanner
              as_user_id: "planner-9"
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 403 ERR_UNAUTHORIZED (wrong role — the segregation check never runs for a non-FinanceController)"
            - "InventoryWriteDown.${wd_id}.status == PROPOSED"

      - name: cn_rbac_get_endpoints_open_to_all_roles
        claim_type: satisfaction_pass
        grounds:
          - "roles (all eight share GET operations)"
        distinguishing_aspect: "Every role — including FinanceController, which owns nothing here — can read shared resources: GET /protein-ops/suppliers returns 200 for FinanceController."
        test_recipe:
          setup: ["Supplier SUP-K-1 exists."]
          setup_api_calls:
            - *k_sup_create
          trigger:
            - call: "GET /protein-ops/suppliers"
              payload: {}
              as: FinanceController
              as_user_id: "fin-1"
          assert:
            - "response 200 with total_count == 1 (read surface is role-agnostic)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: cn_occ_run_create_stale_line_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[run-create-stale-line]"
          - "endpoints.POST_/protein-ops/production-runs"
        distinguishing_aspect: "OCC on ProductionLine.version: after run A advances the line version, a second create carrying the stale expected_line_version fails 412 ERR_STALE_LINE_VERSION; re-reading the line and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["OWNED line (version 1 at creation); product PROD-K-60 ACTIVE with APPROVED label; run A created with expected_line_version 1 (line now version 2)."]
          setup_api_calls:
            - *k_clock_needed
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-60", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 50, scheduled_start: "2026-09-08T08:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_fresh_v: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 50, scheduled_start: "2026-09-08T08:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", expected_line_version: "${line_fresh_v}" }
              as: PlantManager
              captures: { run_b: $.data.id }
          assert:
            - "first retry with stale ${line_v} fails 412 ERR_STALE_LINE_VERSION (run A's creation advanced the line version)"
            - "second retry with the re-read version succeeds 201"
            - "ProductionRun.${run_b}.status == SCHEDULED"

      - name: cn_occ_label_approve_stale_product_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[label-approve-stale-product]"
          - "endpoints.POST_/protein-ops/label-versions/{id}/transitions"
        distinguishing_aspect: "OCC on Product.version at label APPROVED: approving label v2 while holding the pre-v1-approval version fails 412 ERR_STALE_PRODUCT_VERSION; retrying with the current version succeeds and supersedes v1."
        test_recipe:
          setup: ["Product PROD-K-61 (version 1) with label v1 APPROVED (product now version 2); label v2 drafted and submitted."]
          setup_api_calls:
            - *k_clock_needed
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-61", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl1: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl1}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl1}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 2, protein_g: 24, fat_g: 4, sodium_mg: 300, claims: ["HIGH_PROTEIN", "LOW_SATURATED_FAT"], ingredient_statement: "Water, pea protein isolate, cocoa butter" }
              as: ProductManager
              captures: { lbl2: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl2}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
          trigger:
            - call: "POST /protein-ops/label-versions/${lbl2}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
              captures: { err: $.data.error_id }
            - call: "GET /protein-ops/products/${prod_id}"
              payload: {}
              as: ProductManager
              captures: { prod_fresh_v: $.data.version }
            - call: "POST /protein-ops/label-versions/${lbl2}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_fresh_v}" }
              as: ProductManager
          assert:
            - "first approval attempt with the stale version fails 412 ERR_STALE_PRODUCT_VERSION"
            - "retry with the current product.version succeeds; LabelVersion.${lbl2}.status == APPROVED"
            - "LabelVersion.${lbl1}.status == SUPERSEDED and Product.${prod_id}.version == 3"

      - name: cn_xc_immediate_consistency_line_ledger
        claim_type: immediate_visibility
        grounds:
          - "complexity_profile.consistency_model (immediate)"
          - "entities.ProductionLine.fields.reserved_capacity_kg"
        distinguishing_aspect: "Immediate consistency: the run-create response round is not required — a plain GET right after creation already shows reserved_capacity_kg == 100 and version advanced; after abort the same GET shows 0."
        test_recipe:
          setup: ["OWNED line; product PROD-K-62 ACTIVE with APPROVED label; run created (planned 100)."]
          setup_api_calls:
            - *k_clock_needed
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-62", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
          trigger:
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_after: "$.data[0].reserved_capacity_kg" }
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "ABORTED" }
              as: PlantManager
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
          assert:
            - "first GET: ProductionLine.${line_id}.reserved_capacity_kg == 100 and version == 2 (visible immediately)"
            - "after abort, GET: reserved_capacity_kg == 0 (no lag, no async reconciliation)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cn_cons_complete_response_carries_full_run
        claim_type: immediate_readback
        grounds:
          - "complexity_profile.consistency_model (immediate)"
          - "endpoints.POST_/protein-ops/production-runs/{id}/transitions"
        distinguishing_aspect: "The COMPLETED transition's own response carries the fully recomputed run (cases_produced 10, required_isolate_kg 85, non-empty consumed_lot_ids) — no follow-up GET is needed to observe the calculation results."
        test_recipe:
          setup: ["Canonical chain; run IN_PROGRESS."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
          trigger:
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
              captures: { cases: $.data.cases_produced, iso: $.data.required_isolate_kg }
          assert:
            - "transition response: cases_produced == 10 and required_isolate_kg == 85 (computed in-request)"
            - "ProductionRun.${run_id}.status == COMPLETED and unit_cost_cents_per_case == 4548 in the same response"
