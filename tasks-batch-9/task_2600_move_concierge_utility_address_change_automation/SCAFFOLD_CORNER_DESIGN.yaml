      - name: cascading_validation_duplicate_dismissal_unblocks_the_held_move
        claim_type: cascading_validation
        grounds:
          - "validations[priority=27]"
          - "errors[ERR_DUPLICATE_MOVE_UNRESOLVED]"
          - "endpoints[POST /moves/{id}/duplicate-resolution]"
          - state_machines.MoveRecord.NON_TERMINAL_to_DUPLICATE_MERGED
        distinguishing_aspect: |
          The repair half of the duplicate hold, which the §1.8 threshold instance never exercises:
          a DISMISS resolution must clear blocked_reason and flip duplicate_flag to DISMISSED
          without moving lifecycle_status, after which every one of the four operations that
          priority 27 guards becomes available on the same move.
        test_recipe:
