      - WorkPhase.${ph_id}.status == IN_PROGRESS
  - name: optimistic_concurrency_layer
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules
    excluded_because:
      difficulty_instance: endpoints / occ_reconcile_with_stale_contract_version_rejected
      rationale: Both OCC rules asserted in §1.9 endpoints section instances.
  - name: cascading_side_effects_layer
    claim_type: cascading_side_effects
    grounds:
    - state_machines.Baseline.LOCKED_to_RESTATED
    excluded_because:
      difficulty_instance: transitive_cascade / baseline_restatement_cascades_to_reports_and_contract_ledger
      rationale: Covered by the named §1.8 cascade instance.
  - name: derived_field_reconciliation_layer
    claim_type: derived_field_reconciliation
    grounds:
    - entities.PerformanceContract.fields.cumulative_verified_savings_cents
    excluded_because:
      difficulty_instance: transitive_cascade / baseline_restatement_cascades_to_reports_and_contract_ledger
      rationale: Ledger recompute asserted in the named §1.8 instance.
- section: consistency_model
  instances:
  - name: immediate_consistency_visible_in_same_response
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: Bundle approve returns the bundle with blended_payback_years, subsidy_pool_cents, and per-measure subsidy_draw_cents already final in the same 200 response — no re-read needed.
    test_recipe:
      setup:
      - Waterfall fixture bundle PROPOSED (local fixture rebuilt here — anchors do not span files).
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - call: POST /performance-contracts
        payload:
          facility_name: Immediate Consistency School
          contract_term_years: 10
          guarantee_start_date: '2026-10-01T00:00:00Z'
          mv_protocol: IPMVP_C
          guaranteed_annual_savings_cents: 300000
          contract_value_cents: 3000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ic_c_id: $.data.id
      - call: POST /performance-contracts/${ic_c_id}/baselines
        payload:
          baseline_period_start: '2025-09-01T00:00:00Z'
          baseline_period_end: '2026-09-01T00:00:00Z'
          annual_energy_kwh: 120000
          rate_schedule:
          - up_to_kwh: null
            cents_per_kwh: 12
          heating_degree_days: 3000
          cooling_degree_days: 1200
          occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ic_b_id: $.data.id
      - call: POST /performance-contracts/${ic_c_id}/baselines/${ic_b_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - call: POST /performance-contracts/${ic_c_id}/baselines/${ic_b_id}/approve
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - call: POST /performance-contracts/${ic_c_id}/bundles
        payload:
          name: Mixed Payback
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ic_bd_id: $.data.id
      - call: POST /performance-contracts/${ic_c_id}/bundles/${ic_bd_id}/measures
        payload:
          measure_type: LIGHTING
