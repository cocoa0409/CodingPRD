scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pm_next_due_meter_vs_calendar_variant
        grounds:
          - calculations.calc_pm_next_due
          - entities.PMSchedule.fields.next_due_meter
          - entities.PMSchedule.fields.next_due_date
        distinguishing_aspect: |
          calc_pm_next_due on the PMSchedule entity diverges by trigger_type: the METER variant
          sets next_due_meter = anchor_meter + meter_interval and leaves next_due_date null,
          while the CALENDAR variant sets next_due_date = anchor_date + calendar_interval_days
          and leaves next_due_meter null — same conceptual "next due" yields different field
          populations on the same entity.
        test_recipe:
          setup:
            - "one Site and one OPERATIONAL Asset (meter_reading 0)"
            - "two PM schedules on that asset: one METER (interval 500), one CALENDAR (interval 30 days), created at clock 2026-01-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant 1", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Pump A", criticality: "HIGH", meter_unit: "HOURS", acquisition_cost_cents: 5000000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/pm-schedules"
              payload: { trigger_type: "METER", meter_interval: 500, estimated_labor_hours: 4, severity: "MAJOR" }
              as: Planner
              captures: { meter_sched_id: $.data.id }
            - call: "POST /assets/${asset_id}/pm-schedules"
              payload: { trigger_type: "CALENDAR", calendar_interval_days: 30, estimated_labor_hours: 2, severity: "ROUTINE" }
              as: Planner
              captures: { cal_sched_id: $.data.id }
          trigger:
            - call: "GET /pm-schedules/${meter_sched_id}"
              as: Planner
              captures: { meter_next_meter: $.data.next_due_meter, meter_next_date: $.data.next_due_date }
            - call: "GET /pm-schedules/${cal_sched_id}"
              as: Planner
              captures: { cal_next_meter: $.data.next_due_meter, cal_next_date: $.data.next_due_date }
          assert:
            - "PMSchedule.${meter_sched_id}.next_due_meter == 500"
            - "PMSchedule.${meter_sched_id}.next_due_date == null"
            - "PMSchedule.${cal_sched_id}.next_due_date == 2026-01-31T00:00:00Z"
            - "PMSchedule.${cal_sched_id}.next_due_meter == null"

      - name: warranty_payable_replacement_vs_repair_variant
        grounds:
          - calculations.calc_warranty_payable
          - entities.WarrantyClaim.fields.claimed_cost_cents
          - entities.WarrantyClaim.fields.payable_cost_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          calc_warranty_payable on the WarrantyClaim entity (a different entity domain than
          calc_pm_next_due) diverges by claim_type: REPLACEMENT bases claimed_cost_cents on
          asset.acquisition_cost_cents while REPAIR bases it on work_order.actual_cost_cents —
          identical claim shape, different numeric basis.
        test_recipe:
          setup:
            - "Asset with acquisition_cost_cents 5,000,000 and warranty_cost_cap_cents null (uncapped), warranty_expires_at 2027-01-01"
            - "two closed work orders on the asset, each actual_cost_cents 250,000, closed at 2026-02-01"
            - "two SUBMITTED claims: one REPLACEMENT, one REPAIR"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant W", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T1", skill_level: "MASTER", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Compressor", criticality: "HIGH", acquisition_cost_cents: 5000000, warranty_expires_at: "2027-01-01T00:00:00Z" }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo1_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo1_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo1_id}/close"
              payload: { actual_cost_cents: 250000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo2_id: $.data.id }
            - call: "POST /work-orders/${wo2_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo2_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo2_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo2_id}/close"
              payload: { actual_cost_cents: 250000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo1_id}", claim_type: "REPLACEMENT" }
              as: WarrantyAdmin
              captures: { claim_repl_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo2_id}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { claim_repair_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_repl_id}/approve"
              payload: { decision_reason: "covered" }
              as: WarrantyAdmin
              captures: { repl_payable: $.data.payable_cost_cents, repl_claimed: $.data.claimed_cost_cents }
            - call: "POST /warranty-claims/${claim_repair_id}/approve"
              payload: { decision_reason: "covered" }
              as: WarrantyAdmin
              captures: { repair_payable: $.data.payable_cost_cents, repair_claimed: $.data.claimed_cost_cents }
          assert:
            - "WarrantyClaim.${claim_repl_id}.claimed_cost_cents == 5000000"
            - "WarrantyClaim.${claim_repl_id}.payable_cost_cents == 5000000"
            - "WarrantyClaim.${claim_repair_id}.claimed_cost_cents == 250000"
            - "WarrantyClaim.${claim_repair_id}.payable_cost_cents == 250000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_nonlinear_multiplicative_mode_a
        grounds:
          - calculations.calc_priority_score
          - entities.WorkOrder.fields.priority_score
          - entities.Asset.fields.criticality
        distinguishing_aspect: |
          MODE (a): priority_score = crit_weight * sev_weight * overrun (+ corrective bump) is a
          >=3-input formula with non-linear multiplicative interaction and a clamped overrun
          ratio — CRITICAL(8) * MAJOR(3) * clamp(meter/next_due)=1.2 = 28.8, not any linear sum.
        test_recipe:
          setup:
            - "CRITICAL asset whose meter_reading is 600 against a METER PMSchedule with next_due_meter 500 (overrun ratio 1.2)"
            - "a PREVENTIVE MAJOR work order auto-generated by the meter reading that crossed the threshold"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant P", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Critical Pump", criticality: "CRITICAL", meter_unit: "HOURS", acquisition_cost_cents: 1000000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/pm-schedules"
              payload: { trigger_type: "METER", meter_interval: 500, estimated_labor_hours: 4, severity: "MAJOR" }
              as: Planner
              captures: { sched_id: $.data.id }
            - call: "POST /assets/${asset_id}/meter-readings"
              payload: { value: 600, reading_at: "2026-03-01T01:00:00Z" }
              as: Technician
              captures: { reading_triggered: $.data.triggered_pm }
          trigger:
            - call: "GET /work-orders?asset_id=${asset_id}&pm_schedule_id=${sched_id}"
              as: Planner
              captures: { gen_wo_id: "$.data[0].id", gen_priority: "$.data[0].priority_score" }
          assert:
            - "MeterReading reading triggered_pm == true"
            - "WorkOrder generated by the meter PM has wo_type == PREVENTIVE and severity == MAJOR"
            - "WorkOrder.${gen_wo_id}.priority_score == 28.8"

      - name: warranty_payable_pinned_eval_order_mode_c
        grounds:
          - calculations.calc_warranty_payable
          - entities.Asset.fields.warranty_cost_cap_cents
          - entities.WarrantyClaim.fields.payable_cost_cents
        distinguishing_aspect: |
          MODE (c): the evaluation order is pinned — claimed_cost_cents is fixed FIRST from the
          claim basis, THEN payable = min(claimed, cap). With a REPLACEMENT basis of 5,000,000
          and a cap of 3,000,000 the cap binds (payable 3,000,000); reversing the order
          (capping the per-line then summing) is undefined here because the cap only applies
          once the basis is settled.
        test_recipe:
          setup:
            - "Asset with acquisition_cost_cents 5,000,000 AND warranty_cost_cap_cents 3,000,000, warranty_expires_at 2027-01-01"
            - "one closed work order on the asset and a SUBMITTED REPLACEMENT claim"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant C", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tc", skill_level: "MASTER", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Capped Asset", criticality: "HIGH", acquisition_cost_cents: 5000000, warranty_cost_cap_cents: 3000000, warranty_expires_at: "2027-01-01T00:00:00Z" }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/close"
              payload: { actual_cost_cents: 250000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo_id}", claim_type: "REPLACEMENT" }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/approve"
              payload: { decision_reason: "capped" }
              as: WarrantyAdmin
              captures: { payable: $.data.payable_cost_cents, claimed: $.data.claimed_cost_cents }
          assert:
            - "WarrantyClaim.${claim_id}.claimed_cost_cents == 5000000"
            - "WarrantyClaim.${claim_id}.payable_cost_cents == 3000000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_in_progress_hold_resume_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_ON_HOLD
          - state_machines.WorkOrder.ON_HOLD_to_IN_PROGRESS
          - entities.WorkOrder.fields.execution_status
        distinguishing_aspect: |
          WorkOrder.execution_status is cyclic: IN_PROGRESS -> ON_HOLD -> IN_PROGRESS returns to a
          previously-visited state (a true loop, not a forward-only pipeline), and opened_at is
          NOT reset on the second IN_PROGRESS entry.
        test_recipe:
          setup:
            - "an ASSIGNED work order whose assigned technician has started it (IN_PROGRESS, opened_at stamped)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant H", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Th", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Motor", criticality: "MEDIUM", acquisition_cost_cents: 100000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 5 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
              captures: { opened_at_first: $.data.opened_at }
          trigger:
            - call: "POST /work-orders/${wo_id}/hold"
              as: Technician
              as_user_id: "${tech_id}"
              captures: { held_status: $.data.execution_status }
            - call: "POST /work-orders/${wo_id}/resume"
              as: Technician
              as_user_id: "${tech_id}"
              captures: { resumed_status: $.data.execution_status, opened_at_after: $.data.opened_at }
          assert:
            - "WorkOrder.${wo_id}.execution_status == ON_HOLD after hold"
            - "WorkOrder.${wo_id}.execution_status == IN_PROGRESS after resume"
            - "WorkOrder.${wo_id}.opened_at == ${opened_at_first} (unchanged across the hold/resume cycle)"

      - name: warranty_claim_branching_approve_or_deny
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - entities.WarrantyClaim.fields.status
        distinguishing_aspect: |
          WarrantyClaim (a different entity than WorkOrder) is branching: from SUBMITTED the
          machine forks to either APPROVED or DENIED with divergent side-effect sets — APPROVE
          computes payable and reimburses Site.budget_spent_cents, DENY sets payable 0 and
          leaves the budget charged.
        test_recipe:
          setup:
            - "two closed work orders on a warranted asset, each with a SUBMITTED REPAIR claim; site budget already charged 200,000 (2 x 100,000) at close"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant B", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tb", skill_level: "MASTER", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Asset B", criticality: "LOW", acquisition_cost_cents: 800000, warranty_expires_at: "2027-01-01T00:00:00Z" }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo1_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo1_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo1_id}/close"
              payload: { actual_cost_cents: 100000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo2_id: $.data.id }
            - call: "POST /work-orders/${wo2_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo2_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo2_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo2_id}/close"
              payload: { actual_cost_cents: 100000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo1_id}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { claim_a_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo2_id}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { claim_b_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_a_id}/approve"
              payload: { decision_reason: "ok" }
              as: WarrantyAdmin
              captures: { a_status: $.data.status }
            - call: "POST /warranty-claims/${claim_b_id}/deny"
              payload: { decision_reason: "out of scope" }
              as: WarrantyAdmin
              captures: { b_status: $.data.status, b_payable: $.data.payable_cost_cents }
          assert:
            - "WarrantyClaim.${claim_a_id}.status == APPROVED"
            - "WarrantyClaim.${claim_b_id}.status == DENIED"
            - "WarrantyClaim.${claim_b_id}.payable_cost_cents == 0"
            - "Site.${site_id}.budget_spent_cents == 100000 (only the denied claim's 100,000 remains charged; approved one reimbursed)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_cascades_commit_to_release_to_stock_debit_depth3
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_CLOSED
          - state_machines.PartReservation.COMMITTED_to_RELEASED
          - entities.SparePart.fields.on_hand_qty
          - entities.SparePart.fields.reserved_qty
        distinguishing_aspect: |
          Depth-3 chain originating from WorkOrder close: (A) close mutates the WorkOrder ->
          (B) that close transitions each COMMITTED PartReservation to RELEASED -> (C) each
          reservation release debits SparePart.on_hand_qty and recomputes reserved_qty. Link C
          is caused by link B (the reservation transition), not directly by the close action.
        test_recipe:
          setup:
            - "SparePart with on_hand_qty 10, unit_cost_cents 5000; an IN_PROGRESS work order with one COMMITTED reservation of qty 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant D", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Td", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "BRG-001", name: "Bearing", on_hand_qty: 10, unit_cost_cents: 5000 }
              as: InventoryClerk
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Conveyor", criticality: "HIGH", acquisition_cost_cents: 300000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 3 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo_id}/reservations"
              payload: { spare_part_id: "${part_id}", qty: 3, expected_spare_part_version: "${part_v}" }
              as: InventoryClerk
              captures: { resv_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/commit-parts"
              as: InventoryClerk
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: { actual_cost_cents: 15000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_parts_status: $.data.parts_status }
          assert:
            - "PartReservation.${resv_id}.status == RELEASED"
            - "WorkOrder.${wo_id}.parts_status == RELEASED"
            - "SparePart.${part_id}.on_hand_qty == 7"
            - "SparePart.${part_id}.reserved_qty == 0"

      - name: downtime_resolve_cascades_mttr_then_asset_restore_depth2
        grounds:
          - state_machines.DowntimeEvent.OPEN_to_RESOLVED
          - state_machines.Asset.DOWN_to_OPERATIONAL
          - entities.Asset.fields.mttr_hours
          - entities.Asset.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (DowntimeEvent resolve, not WorkOrder close):
          (A) resolve mutates the DowntimeEvent to RESOLVED -> (B) because it was the asset's
          last OPEN downtime, the asset transitions DOWN->OPERATIONAL and mttr_hours is
          recomputed. Link B is caused by the downtime's RESOLVED transition.
        test_recipe:
          setup:
            - "Asset that is DOWN due to a single OPEN MECHANICAL_FAILURE downtime started at 2026-05-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant E", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Press", criticality: "HIGH", acquisition_cost_cents: 900000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-01T00:00:00Z" }
              as: Technician
              captures: { dt_id: $.data.id }
          trigger:
            - call: "POST /downtime-events/${dt_id}/resolve"
              payload: { ended_at: "2026-05-01T04:00:00Z" }
              as: Technician
              captures: { dt_status: $.data.status, dt_dur: $.data.duration_hours }
            - call: "GET /assets/${asset_id}"
              as: MaintenanceManager
              captures: { asset_status: $.data.status, asset_mttr: $.data.mttr_hours }
          assert:
            - "DowntimeEvent.${dt_id}.status == RESOLVED"
            - "DowntimeEvent.${dt_id}.duration_hours == 4"
            - "Asset.${asset_id}.status == OPERATIONAL"
            - "Asset.${asset_id}.mttr_hours == 4"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_state_beats_skill_state_vs_business_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair {state (priority 6) vs business_safety (priority 8)}: a JUNIOR
          technician (skill-insufficient for an OVERHAUL) is assigned to a work order still in
          DRAFT (assign is only defined from UNASSIGNED). Both checks would fail; the lower
          priority STATE check wins -> ERR_INVALID_STATE, NOT ERR_SKILL_INSUFFICIENT.
        test_recipe:
          setup:
            - "a DRAFT OVERHAUL work order (never released to queue) and a JUNIOR technician"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Plant F", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Junior", skill_level: "JUNIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Lathe", criticality: "HIGH", acquisition_cost_cents: 400000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "OVERHAUL", estimated_labor_hours: 8 }
              as: Planner
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_id}.execution_status == DRAFT (unchanged)"

      - name: close_state_beats_downtime_open_state_vs_business_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=17]
        distinguishing_aspect: |
          Error-category pair {state (priority 6) vs business_constraint (priority 17)}: closing
          a work order that is only ASSIGNED (close is defined only from IN_PROGRESS) while it
          also has an OPEN downtime referencing it. The lower-priority STATE check wins ->
          ERR_INVALID_STATE, NOT ERR_DOWNTIME_OPEN.
        test_recipe:
          setup:
            - "an ASSIGNED (not yet started) corrective work order that has an OPEN downtime referencing it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant G", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tg", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Boiler", criticality: "CRITICAL", acquisition_cost_cents: 700000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 4 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /assets/${asset_id}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-10T01:00:00Z", work_order_id: "${wo_id}" }
              as: Technician
              captures: { dt_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: { actual_cost_cents: 5000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_id}.execution_status == ASSIGNED (unchanged)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: meter_pm_due_at_exact_threshold_inclusive
        grounds:
          - calculations.calc_pm_next_due
          - entities.MeterReading.fields.triggered_pm
          - validations[priority=10]
        distinguishing_aspect: |
          Metric = meter threshold crossing on POST /assets/{id}/meter-readings. The METER PM
          uses >= (inclusive): a reading of EXACTLY next_due_meter (500) triggers the PM
          (triggered_pm true), proving the boundary is >= not >.
        test_recipe:
          setup:
            - "Asset with a METER PMSchedule meter_interval 500 (next_due_meter 500), meter_reading currently 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant M", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Gearbox", criticality: "MEDIUM", acquisition_cost_cents: 200000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/pm-schedules"
              payload: { trigger_type: "METER", meter_interval: 500, estimated_labor_hours: 3, severity: "ROUTINE" }
              as: Planner
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /assets/${asset_id}/meter-readings"
              payload: { value: 500, reading_at: "2026-06-01T02:00:00Z" }
              as: Technician
              captures: { triggered: $.data.triggered_pm }
          assert:
            - "MeterReading.triggered_pm == true (>= boundary: exactly 500 is due)"
            - "GET /work-orders?pm_schedule_id=${sched_id} returns exactly one PREVENTIVE work order"

      - name: stock_reservation_at_exact_available_units_boundary
        grounds:
          - validations[priority=13]
          - entities.SparePart.fields.on_hand_qty
          - entities.SparePart.fields.reserved_qty
        distinguishing_aspect: |
          Metric = available-units count on POST /work-orders/{id}/reservations, a DIFFERENT
          endpoint and metric than the meter threshold. Availability uses >= : reserving
          exactly the available count (4 of on_hand 4, reserved 0) SUCCEEDS; the boundary
          rejects only qty strictly greater than available.
        test_recipe:
          setup:
            - "SparePart on_hand_qty 4, reserved_qty 0; an UNASSIGNED work order"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Plant N", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "FLT-009", name: "Filter", on_hand_qty: 4, unit_cost_cents: 1000 }
              as: InventoryClerk
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "HVAC", criticality: "LOW", acquisition_cost_cents: 50000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
          trigger:
            - call: "POST /work-orders/${wo_id}/reservations"
              payload: { spare_part_id: "${part_id}", qty: 4, expected_spare_part_version: "${part_v}" }
              as: InventoryClerk
              captures: { resv_id: $.data.id, resv_status: $.data.status }
          assert:
            - "PartReservation.${resv_id}.status == RESERVED (reserving exactly the 4 available units succeeds)"
            - "SparePart.${part_id}.reserved_qty == 4"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: warranty_approve_requires_work_order_closed
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - validations[priority=6]
          - entities.WorkOrder.fields.execution_status
        distinguishing_aspect: |
          Entity pair WarrantyClaim -> WorkOrder: approving a claim is gated on the referenced
          WorkOrder.execution_status == CLOSED. With the work order still IN_PROGRESS the approve
          is rejected ERR_INVALID_STATE even though the claim itself is SUBMITTED.
        test_recipe:
          setup:
            - "a warranted asset with an IN_PROGRESS (not yet closed) work order and a SUBMITTED REPAIR claim against it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant X", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tx", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Chiller", criticality: "HIGH", acquisition_cost_cents: 600000, warranty_expires_at: "2027-01-01T00:00:00Z" }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 4 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo_id}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/approve"
              payload: { decision_reason: "early" }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WarrantyClaim.${claim_id}.status == SUBMITTED (unchanged)"

      - name: asset_retire_blocked_by_open_downtime
        grounds:
          - state_machines.Asset.OPERATIONAL_to_RETIRED
          - validations[priority=19]
          - entities.Asset.fields.status
        distinguishing_aspect: |
          Entity pair Asset -> DowntimeEvent (a different pair than WarrantyClaim->WorkOrder):
          retire requires asset.status == OPERATIONAL, but an OPEN DowntimeEvent has driven the
          asset DOWN, so retire is rejected ERR_ASSET_BUSY.
        test_recipe:
          setup:
            - "an asset currently DOWN due to one OPEN downtime"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant Y", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Crane", criticality: "MEDIUM", acquisition_cost_cents: 800000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id, asset_v0: $.data.version }
            - call: "POST /assets/${asset_id}/downtime-events"
              payload: { reason_code: "ELECTRICAL_FAILURE", started_at: "2026-05-20T01:00:00Z" }
              as: Technician
              captures: { dt_id: $.data.id }
            - call: "GET /assets/${asset_id}"
              as: MaintenanceManager
              captures: { asset_v: $.data.version }
          trigger:
            - call: "POST /assets/${asset_id}/retire"
              payload: { expected_asset_version: "${asset_v}" }
              as: MaintenanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSET_BUSY"
            - "Asset.${asset_id}.status == DOWN (unchanged, not RETIRED)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: asset_downtime_open_ray_overlap
        grounds:
          - validations[priority=11]
          - state_machines.DowntimeEvent.OPEN_to_RESOLVED
          - entities.DowntimeEvent.fields.status
        distinguishing_aspect: |
          Resource = Asset; interval geometry = half-open ray [started_at, +inf) (an OPEN
          downtime occupies the asset indefinitely until resolved). A second OPEN downtime on
          the same asset is rejected ERR_DOWNTIME_OVERLAP regardless of its started_at, because
          two open-ended rays always intersect.
        test_recipe:
          setup:
            - "an asset already DOWN with one OPEN MECHANICAL_FAILURE downtime"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant Z", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Mixer", criticality: "HIGH", acquisition_cost_cents: 350000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-25T01:00:00Z" }
              as: Technician
              captures: { dt1_id: $.data.id }
          trigger:
            - call: "POST /assets/${asset_id}/downtime-events"
              payload: { reason_code: "ELECTRICAL_FAILURE", started_at: "2026-05-25T05:00:00Z" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DOWNTIME_OVERLAP"
            - "GET /assets/${asset_id}/downtime-events returns exactly one downtime"

      - name: technician_window_closed_interval_overlap
        grounds:
          - validations[priority=20]
          - state_machines.WorkOrder.ASSIGNED_to_ASSIGNED
          - entities.WorkOrder.fields.scheduled_start
          - entities.WorkOrder.fields.scheduled_end
        distinguishing_aspect: |
          Resource = Technician; interval geometry = closed/exclusive-end window
          [scheduled_start, scheduled_end) where touching endpoints DO NOT overlap. A second
          window for the same technician that strictly overlaps the first (10:00-12:00 vs an
          existing 09:00-11:00) is rejected ERR_TECH_DOUBLE_BOOKED, unlike the asset open-ray
          semantics.
        test_recipe:
          setup:
            - "one technician assigned to two work orders; the first has window 2026-06-02T09:00Z..11:00Z booked"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant Sched", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ts", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Asset S1", criticality: "MEDIUM", acquisition_cost_cents: 100000 }
              as: MaintenanceManager
              captures: { asset1_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Asset S2", criticality: "MEDIUM", acquisition_cost_cents: 100000 }
              as: MaintenanceManager
              captures: { asset2_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset1_id}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo1_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo1_id}/schedule-window"
              payload: { scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Planner
            - call: "POST /work-orders"
              payload: { asset_id: "${asset2_id}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo2_id: $.data.id }
            - call: "POST /work-orders/${wo2_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo2_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
          trigger:
            - call: "POST /work-orders/${wo2_id}/schedule-window"
              payload: { scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T12:00:00Z" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TECH_DOUBLE_BOOKED"
            - "WorkOrder.${wo2_id}.scheduled_start == null (window not booked)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_release_conserves_part_availability
        grounds:
          - state_machines.PartReservation.RESERVED_to_RELEASED
          - entities.SparePart.fields.on_hand_qty
          - entities.SparePart.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity = spare-part AVAILABILITY (on_hand_qty - reserved_qty). Forward
          action = reserve qty 5 (availability 8->3); compensating action = release that
          reservation (availability 3->8). The invariant: available units == on_hand_qty -
          reserved_qty == 8 both before the reserve and after the release, with on_hand_qty
          never debited because no commit/close occurred.
        test_recipe:
          setup:
            - "SparePart on_hand_qty 8, reserved_qty 0; an UNASSIGNED work order"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Plant Inv", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "SEAL-100", name: "Seal", on_hand_qty: 8, unit_cost_cents: 2000 }
              as: InventoryClerk
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Valve", criticality: "MEDIUM", acquisition_cost_cents: 120000 }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo_id}/reservations"
              payload: { spare_part_id: "${part_id}", qty: 5, expected_spare_part_version: "${part_v}" }
              as: InventoryClerk
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/release"
              as: InventoryClerk
              captures: { resv_status: $.data.status }
            - call: "GET /spare-parts/${part_id}"
              as: InventoryClerk
              captures: { final_on_hand: $.data.on_hand_qty, final_reserved: $.data.reserved_qty }
          assert:
            - "PartReservation.${resv_id}.status == RELEASED"
            - "SparePart.${part_id}.on_hand_qty == 8 (never debited)"
            - "SparePart.${part_id}.reserved_qty == 0"
            - "available units (on_hand_qty - reserved_qty) == 8, identical to pre-reserve availability"

      - name: warranty_approve_then_deny_path_conserves_site_budget
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - entities.Site.fields.budget_spent_cents
        distinguishing_aspect: |
          Conserved quantity = Site.budget_spent_cents (a DIFFERENT conserved quantity than part
          availability). A closed work order charges the budget 100,000; an APPROVED claim
          reimburses exactly that 100,000 (budget back to 0); a DENIED claim on a second
          identical work order leaves its 100,000 charged. Net invariant: budget_spent_cents ==
          sum of actual_cost_cents over CLOSED work orders NOT covered by an APPROVED claim.
        test_recipe:
          setup:
            - "warranted asset; two closed work orders each actual_cost_cents 100,000 (budget charged 200,000); one claim approved, one denied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Plant Bud", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tbud", skill_level: "MASTER", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tech_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", name: "Asset Bud", criticality: "LOW", acquisition_cost_cents: 500000, warranty_expires_at: "2027-01-01T00:00:00Z" }
              as: MaintenanceManager
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo1_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo1_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo1_id}/close"
              payload: { actual_cost_cents: 100000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wo2_id: $.data.id }
            - call: "POST /work-orders/${wo2_id}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wo2_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Planner
            - call: "POST /work-orders/${wo2_id}/start"
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo2_id}/close"
              payload: { actual_cost_cents: 100000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo1_id}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { claim1_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${asset_id}", work_order_id: "${wo2_id}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { claim2_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim1_id}/approve"
              payload: { decision_reason: "approved" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims/${claim2_id}/deny"
              payload: { decision_reason: "denied" }
              as: WarrantyAdmin
            - call: "GET /sites/${site_id}"
              as: MaintenanceManager
              captures: { final_budget: $.data.budget_spent_cents }
          assert:
            - "Site.${site_id}.budget_spent_cents == 100000 (only the denied work order's charge survives)"
            - "WorkOrder.${wo1_id}.warranty_claim_id == ${claim1_id}"
            - "WorkOrder.${wo2_id}.warranty_claim_id == null"
