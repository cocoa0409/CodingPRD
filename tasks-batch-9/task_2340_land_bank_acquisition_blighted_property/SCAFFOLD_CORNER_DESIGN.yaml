            - "TitleAction.${ta_id}.status == CLEARED and adjudicated_at == 2026-08-01T00:00:00Z (unchanged)"
            - "Property.${p_id}.version == ${p_v_before}  # the rejected replay bumps nothing"

      - name: title_dimension_advances_while_custody_stays_acquired
        claim_type: valid_transition
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Property.title_status
          - state_machines.Property.custody_status
        distinguishing_aspect: "The two Property dimensions are genuinely independent: CLOUDED -> QUIET_TITLE_FILED -> CLEAR all happen while custody_status stays ACQUIRED, and only the later list call moves the custody dimension - the combined state is the pair, not a single status column."
        test_recipe:
          setup:
            - "One ACQUIRED parcel with a still-clouded title (acquired through a closed donation packet)."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Parallel Dimension Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201080", address: "1080 Poplar St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
