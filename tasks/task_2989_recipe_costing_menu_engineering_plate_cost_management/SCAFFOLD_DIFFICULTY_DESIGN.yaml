# §1.8 Scaffold Difficulty Design — task 2989 Recipe Costing, Menu Engineering & Plate Cost Management
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Every numeric assert below was
# computed by executing the §1.3 formulas against the §1.3 constants block.
# Logical clock: every chain starts at the mandatory default 2026-08-01T00:00:00Z unless a
# call to POST /culinary/_clock/set_current_utc moves it forward.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: recipe_cost_rollup_latest_published_versus_weighted_average_on_recipe
        grounds:
          - calculations.recipe_cost_rollup
          - entities.Recipe.fields.cost_basis
          - entities.RecipeComponent.fields.unit_cost_micros_used
          - entities.RecipeComponent.fields.pack_base_units_snapshot
          - entities.IngredientPrice.fields.effective_to
          - endpoints[POST /culinary/recipes/{recipe_id}/cost-rollup]
        distinguishing_aspect: |
          The two variants of recipe_cost_rollup price the SAME single-component Recipe from the
          SAME two published IngredientPrice rows and disagree by 433569 micros: LATEST_PUBLISHED
          reads only the open-ended 25000000 row (batch 5511464) while WEIGHTED_AVG_90D
          duration-weights the 59-day 22000000 row against the 31-day 25000000 row into a
          per_base_unit_micros of 10155790712 (batch 5077895); this instance's variant pair lives
          on the Recipe entity domain, whereas the other dual_variant_calc instance's pair lives on
          the MenuPeriodReview entity domain.
        test_recipe:
          setup:
            - "Ingredient CHEDDAR-BLOCK, base_uom GRAM, pack_base_units 2268, trim_yield_bps 10000, cook_shrink_bps 0 so net_yield_bps == 10000."
            - "Two PUBLISHED IngredientPrice rows for (CHEDDAR-BLOCK, MW): a BOUNDED row [2026-05-01T00:00:00Z, 2026-07-01T00:00:00Z) at pack_cost_micros 22000000, and an open-ended row [2026-07-01T00:00:00Z, null) at 25000000. Because the first row is bounded it is never truncated, so BOTH rows keep status PUBLISHED and both are visible to the weighted variant."
            - "Recipe SUB-CHEESE, recipe_type SUB_RECIPE, base_uom GRAM, batch_yield_base_units 1000, portions_per_batch 10, holding one ACTIVE INGREDIENT component at ep_quantity_base_units 500 (net_yield_bps 10000 so ap_quantity_base_units == 500)."
            - "Logical clock at its default 2026-08-01T00:00:00Z, so the WEIGHTED_AVG_WINDOW_DAYS window is [2026-05-03T00:00:00Z, 2026-08-01T00:00:00Z): 59 whole days of the first row and 31 whole days of the second."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-05-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_a_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed_a_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-05-01T00:00:00.000Z", effective_to: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed_a_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_b_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed_b_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 25000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed_b_id}/publish"
              as: CostAnalyst
              captures: { feed_b_superseded: $.data.superseded_price_count }
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-CHEESE", name: "Cheese Sauce Base", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { sub_id: $.data.id, sub_v0: $.data.version }
            - call: "POST /culinary/recipes/${sub_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${sub_v0}" }
              as: RecipeDeveloper
              captures: { sub_comp_id: $.data.id }
          trigger:
            - call: "POST /culinary/recipes/${sub_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_latest: $.data.batch_cost_micros, portion_latest: $.data.portion_cost_micros, basis_latest: $.data.cost_basis }
            - call: "POST /culinary/recipes/${sub_id}/cost-rollup"
              payload: { basis: "WEIGHTED_AVG_90D" }
              as: CostAnalyst
              captures: { batch_weighted: $.data.batch_cost_micros, portion_weighted: $.data.portion_cost_micros, basis_weighted: $.data.cost_basis }
          assert:
            - "${feed_b_superseded} == 0 — the bounded 2026-05-01 row is adjacent to the new window, not truncated, so both rows remain status PUBLISHED"
            - "${basis_latest} == LATEST_PUBLISHED and ${batch_latest} == 5511464 (ap 500 * 25000000 / 2268 = 5511463.845 rounded half-up)"
            - "${portion_latest} == 551146 (5511464 / 10 = 551146.4)"
            - "${basis_weighted} == WEIGHTED_AVG_90D and ${batch_weighted} == 5077895 (ap 500 * 10155790712 / 1000000 = 5077895.356)"
            - "${portion_weighted} == 507790 (5077895 / 10 = 507789.5, round_half_up goes up)"
            - "${batch_latest} - ${batch_weighted} == 433569 — the same component data yields two different batch costs"
            - "RecipeComponent.${sub_comp_id}.unit_cost_micros_used == 10155790712 and pack_base_units_snapshot == 1000000 after the WEIGHTED_AVG_90D roll-up, versus 25000000 and 2268 after the LATEST_PUBLISHED roll-up"
            - "Recipe.${sub_id}.cost_state == FRESH after each roll-up"

      - name: theoretical_versus_actual_variance_sales_mix_versus_usage_basis_on_period_review
        grounds:
          - calculations.theoretical_vs_actual_variance
          - calculations.count_sheet_expected_usage
          - entities.MenuPeriodReview.fields.basis
          - entities.MenuPeriodReview.fields.variance_flag
          - entities.CountSheetLine.fields.valued_usage_micros
          - state_machines.MenuPeriodReview.CLASSIFIED_to_CLOSED
        distinguishing_aspect: |
          Two MenuPeriodReview rows over the identical mix line (50 units, 20000 cents) and the
          identical count line (opening 5300, received 0, counted 41) close with different
          variance_flag values: SALES_MIX_BASED values theory at 50 * plate_cost_cents_snapshot
          100 = 5000 cents and reports variance_bps 202 / WITHIN_TOLERANCE, while USAGE_BASED
          values the exploded 5000 expected base units at today's price = 4850 cents and reports
          variance_bps 518 / OVER_TOLERANCE; the variant pair here is anchored on
          MenuPeriodReview, a different entity domain from the Recipe-anchored roll-up variants.
        test_recipe:
          setup:
            - "Ingredient CHEDDAR-BLOCK (pack_base_units 2268, net_yield_bps 10000) with one PUBLISHED price row 22000000 effective from 2026-07-01T00:00:00Z, region MW."
            - "Recipe PLATE-GRILL, PLATED, batch_yield_base_units 4, portions_per_batch 4, one component at ep 400; rolled up under LATEST_PUBLISHED to batch_cost_micros 3880071 and portion_cost_micros 970018, then ACTIVE."
            - "MenuItem MI-GRILL-MW in region MW at current_price_cents 400 with plate_cost_cents 100 and status ACTIVE."
            - "Two MenuPeriodReview rows for the same unit and the same period, one with basis SALES_MIX_BASED and one with basis USAGE_BASED, each carrying the same single mix line and the same single count line, both already CLASSIFIED."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
              captures: { grill_comp_id: $.data.id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_cents: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/units"
              payload: { code: "UNIT-MW-01", name: "Downtown MW", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_sm_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_sm_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 50, gross_sales_cents: 20000 }
              as: CostAnalyst
              captures: { sm_line_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_sm_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 5300, received_base_units: 0, counted_base_units: 41 }
              as: CostAnalyst
              captures: { sm_count_id: $.data.id, sm_expected: $.data.expected_base_units }
            - call: "POST /culinary/menu-period-reviews/${rev_sm_id}/classify"
              as: CostAnalyst
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "USAGE_BASED" }
              as: CostAnalyst
              captures: { rev_ub_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_ub_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 50, gross_sales_cents: 20000 }
              as: CostAnalyst
            - call: "POST /culinary/menu-period-reviews/${rev_ub_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 5300, received_base_units: 0, counted_base_units: 41 }
              as: CostAnalyst
              captures: { ub_count_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_ub_id}/classify"
              as: CostAnalyst
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_sm_id}/close"
              as: CostAnalyst
              captures: { sm_theo: $.data.theoretical_food_cost_cents, sm_actual: $.data.actual_food_cost_cents, sm_var: $.data.variance_bps, sm_flag: $.data.variance_flag }
            - call: "POST /culinary/menu-period-reviews/${rev_ub_id}/close"
              as: CostAnalyst
              captures: { ub_theo: $.data.theoretical_food_cost_cents, ub_actual: $.data.actual_food_cost_cents, ub_var: $.data.variance_bps, ub_flag: $.data.variance_flag }
          assert:
            - "${plate_cents} == 100 (portion 970018 -> s1 970018 -> s2 989418 -> garnish 14841 -> 1004259 micros)"
            - "${sm_expected} == 5000 — 50 units * 100000000 micro-base-units per portion, floored"
            - "${sm_theo} == 5000 (50 * plate_cost_cents_snapshot 100)"
            - "${ub_theo} == 4850 (expected 5000 base units valued at 22000000/2268 = 48500882 micros -> 4850.0882 cents)"
            - "${sm_actual} == 5101 and ${ub_actual} == 5101 — the actual side is basis-independent: used_base_units 5259 valued at 51013228 micros"
            - "${sm_var} == 202 and ${sm_flag} == WITHIN_TOLERANCE (202 <= VARIANCE_TOLERANCE_BPS 300)"
            - "${ub_var} == 518 and ${ub_flag} == OVER_TOLERANCE (518 > 300)"
            - "CountSheetLine.${sm_count_id}.used_base_units == 5259, expected_base_units == 5000, variance_base_units == 259 and valued_usage_micros == 51013228"
            - "CountSheetLine.${ub_count_id}.valued_usage_micros == 51013228 — identical inputs, identical actual, opposite variance_flag"
            - "MenuMixLine.${sm_line_id}.plate_cost_cents_snapshot == 100"
  - rule_id: combinatorial_formula
    instances:
      - name: component_extended_costs_rounded_then_summed_on_plate_melt_rollup
        grounds:
          - calculations.recipe_cost_rollup
          - calculations.recipe_cost_rollup.combinatorial_note
          - entities.RecipeComponent.fields.extended_cost_micros
          - entities.Recipe.fields.batch_cost_micros
          - endpoints[POST /culinary/recipes/{recipe_id}/cost-rollup]
        distinguishing_aspect: |
          This instance pins the ROUNDING ORDER of an aggregation whose sub-expressions are each
          rounded before summation: three components whose exact extended costs are
          12485339.506..., 970017.637... and exactly 1572078.5 sum to 15027437 when each is
          rounded first and to 15027436 when the exact rational total is rounded once, so a
          one-micro gap distinguishes the two orders. The other combinatorial_formula instance
          pins a STEP ORDER (food-cost-then-relief) rather than a rounding order, and its
          divergence is 13 cents on a cap rather than 1 micro on a sum.
        test_recipe:
          setup:
            - "Four ingredients in region MW with one PUBLISHED price each: TOMATO-SAUCE (pack_base_units 3785, trim_yield_bps 10000, cook_shrink_bps 500 so net_yield_bps 9500, pack_cost_micros 9500000, allergen_mask 0), PEANUT-OIL (pack 946, no trim or shrink, 12000000, allergen_mask 8), BEEF-CHUCK (pack 4536, trim_yield_bps 8500, cook_shrink_bps 2000 so net_yield_bps 6800, 38500000, allergen_mask 0) and CHEDDAR-BLOCK (pack 2268, no trim or shrink, 22000000, allergen_mask 1)."
            - "Sub-recipe SUB-SAUCE (SUB_RECIPE, GRAM, batch_yield_base_units 2000, portions_per_batch 40) with TOMATO-SAUCE at ep 1900 (ap 2000) and PEANUT-OIL at ep 100, rolled up under LATEST_PUBLISHED to batch_cost_micros 6288314, then ACTIVE."
            - "Recipe PLATE-MELT (PLATED, EACH, batch_yield_base_units 5, portions_per_batch 5) in DRAFT holding three ACTIVE components: BEEF-CHUCK at ep 1000, CHEDDAR-BLOCK at ep 100 and a SUB_RECIPE component on SUB-SAUCE at ep 500."
            - "Every component write consumes the recipe version returned by a fresh GET, because each successful component write increments Recipe.version."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "TOMATO-SAUCE", name: "Tomato Sauce", base_uom: "GRAM", pack_base_units: 3785, trim_yield_bps: 10000, cook_shrink_bps: 500, allergen_mask: 0, kcal_per_base_unit_micros: 300000, sodium_mcg_per_base_unit: 4100 }
              as: RecipeDeveloper
              captures: { sauce_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "PEANUT-OIL", name: "Peanut Oil", base_uom: "GRAM", pack_base_units: 946, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 8, kcal_per_base_unit_micros: 8000000, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { oil_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "BEEF-CHUCK", name: "Beef Chuck", base_uom: "GRAM", pack_base_units: 4536, trim_yield_bps: 8500, cook_shrink_bps: 2000, allergen_mask: 0, kcal_per_base_unit_micros: 2500000, sodium_mcg_per_base_unit: 700 }
              as: RecipeDeveloper
              captures: { beef_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${sauce_id}", pack_cost_micros: 9500000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${oil_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${beef_id}", pack_cost_micros: 38500000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
              captures: { feed1_line_count: $.data.line_count }
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-SAUCE", name: "House Sauce", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 2000, portions_per_batch: 40 }
              as: RecipeDeveloper
              captures: { sauce_recipe_id: $.data.id, sauce_v0: $.data.version }
            - call: "POST /culinary/recipes/${sauce_recipe_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${sauce_id}", ep_quantity_base_units: 1900, sequence_no: 1, expected_recipe_version: "${sauce_v0}" }
              as: RecipeDeveloper
              captures: { sauce_comp1_id: $.data.id, sauce_comp1_ap: $.data.ap_quantity_base_units }
            - call: "GET /culinary/recipes/${sauce_recipe_id}"
              as: RecipeDeveloper
              captures: { sauce_v1: $.data.version }
            - call: "POST /culinary/recipes/${sauce_recipe_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${oil_id}", ep_quantity_base_units: 100, sequence_no: 2, expected_recipe_version: "${sauce_v1}" }
              as: RecipeDeveloper
              captures: { sauce_comp2_id: $.data.id }
            - call: "POST /culinary/recipes/${sauce_recipe_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { sauce_batch: $.data.batch_cost_micros, sauce_mask: $.data.allergen_mask }
            - call: "POST /culinary/recipes/${sauce_recipe_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sauce_recipe_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-MELT", name: "Patty Melt", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 5, portions_per_batch: 5 }
              as: RecipeDeveloper
              captures: { melt_id: $.data.id, melt_v0: $.data.version }
            - call: "POST /culinary/recipes/${melt_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${beef_id}", ep_quantity_base_units: 1000, sequence_no: 1, expected_recipe_version: "${melt_v0}" }
              as: RecipeDeveloper
              captures: { melt_comp1_id: $.data.id, melt_comp1_ap: $.data.ap_quantity_base_units }
            - call: "GET /culinary/recipes/${melt_id}"
              as: RecipeDeveloper
              captures: { melt_v1: $.data.version }
            - call: "POST /culinary/recipes/${melt_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 100, sequence_no: 2, expected_recipe_version: "${melt_v1}" }
              as: RecipeDeveloper
              captures: { melt_comp2_id: $.data.id }
            - call: "GET /culinary/recipes/${melt_id}"
              as: RecipeDeveloper
              captures: { melt_v2: $.data.version }
            - call: "POST /culinary/recipes/${melt_id}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sauce_recipe_id}", ep_quantity_base_units: 500, sequence_no: 3, expected_recipe_version: "${melt_v2}" }
              as: RecipeDeveloper
              captures: { melt_comp3_id: $.data.id }
          trigger:
            - call: "POST /culinary/recipes/${melt_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { melt_batch: $.data.batch_cost_micros, melt_portion: $.data.portion_cost_micros, melt_mask: $.data.allergen_mask, melt_depth: $.data.depth, melt_count: $.data.component_count }
          assert:
            - "${feed1_line_count} == 4"
            - "${sauce_comp1_ap} == 2000 — ceil(1900 * 10000 / 9500), the trim-and-shrink yield chain"
            - "${sauce_batch} == 6288314 (5019815 + 1268499; here the two orders happen to agree, which is why the pair alone cannot pin the rounding order)"
            - "${sauce_mask} == 8 — PEANUT only"
            - "${melt_comp1_ap} == 1471 — ceil(1000 * 10000 / 6800) where net_yield_bps = 8500 * (10000 - 2000) / 10000"
            - "RecipeComponent.${melt_comp1_id}.extended_cost_micros == 12485340 (exact 12485339.506)"
            - "RecipeComponent.${melt_comp2_id}.extended_cost_micros == 970018 (exact 970017.637)"
            - "RecipeComponent.${melt_comp3_id}.extended_cost_micros == 1572079 (exactly 1572078.5, so round_half_up goes up) with unit_cost_micros_used == 6288314 and pack_base_units_snapshot == 2000"
            - "${melt_batch} == 15027437 and NOT 15027436 — the round-once-at-the-end total is 15027435.642857, so the two evaluation orders differ by exactly 1 micro"
            - "${melt_portion} == 3005487 (15027437 / 5 = 3005487.4)"
            - "${melt_mask} == 9 — PEANUT arrives only through the sub-recipe, MILK only from the cheddar"
            - "${melt_depth} == 1 and ${melt_count} == 3"

      - name: market_cap_relief_applied_only_after_projected_food_cost_step
        grounds:
          - calculations.price_change_projection
          - calculations.price_change_projection.combinatorial_note
          - constants.CAP_RELIEF_BPS
          - constants.MAX_SINGLE_INCREASE_BPS
          - constants.REGION_CAP_MULTIPLIER_BPS
          - validations[priority 47]
          - state_machines.PriceChangeProposal.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Two menu items differing ONLY in target_food_cost_bps (2000 versus 3000) receive the same
          455-cent proposal against the same 400-cent price and 100-cent plate cost. Because STEP 5
          computes projected_food_cost_bps 2198 from the RAW proposed price and STEP 6 widens the
          cap only afterwards, the 2000-target item gets effective_cap_price_cents 461 and its
          proposal is accepted while the 3000-target item keeps the un-relieved cap 448 and is
          rejected with ERR_MARKET_CAP_EXCEEDED. Evaluating the cap before the food cost, or
          measuring the food cost against the capped price, flips both outcomes. Unlike the other
          combinatorial_formula instance this is a step-ordering divergence inside one formula, not
          a rounding-order divergence in an aggregation.
        test_recipe:
          setup:
            - "Ingredient CHEDDAR-BLOCK priced 22000000 per 2268 base units, PUBLISHED for region MW from 2026-07-01T00:00:00Z."
            - "One ACTIVE recipe PLATE-GRILL (batch_yield 4, portions 4, cheddar ep 400) with portion_cost_micros 970018."
            - "Two ACTIVE MenuItems on that recipe in region MW, both at current_price_cents 400 with plate_cost_cents 100 and last_price_change_at null: MI-GRILL-A with target_food_cost_bps 2000 and MI-GRILL-B with target_food_cost_bps 3000."
            - "No CLOSED MenuPeriodReview exists, so STEP 4 falls back to DEFAULT_BASELINE_UNITS 1000."
            - "Region MW constants: REGION_COMPETITOR_INDEX_CENTS 1500 and REGION_CAP_MULTIPLIER_BPS 11000 give arm A 1650, while MAX_SINGLE_INCREASE_BPS 1200 gives arm B 448, so market_cap_price_cents is 448."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-A", name: "Grilled Cheese A", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 2000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
