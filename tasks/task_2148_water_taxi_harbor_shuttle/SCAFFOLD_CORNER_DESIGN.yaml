        distinguishing_aspect: |
          Each collection answers its own domain-specific 404 rather than a shared generic code: dispatching an
          unknown booking, reading an unknown pass, reading an unknown dock slot, approving an unknown claim and
          filing an inspection against an unknown vessel each name their own entity.
        test_recipe:
          setup:
