  - rule_id: boundary_precision_check
    instances:
      - name: capacity_score_exactly_60_is_adequate
        grounds:
          - calculations.operator_capacity_score
          - entities.Operator.fields.capacity_grade
        distinguishing_aspect: |
          Inclusive-low-edge boundary on the grade band: composite exactly 60
          is ADEQUATE (not WEAK), so approval succeeds at the exact threshold —
          a >= boundary, tested on the CapacityReview numeric metric.
        test_recipe:
          setup:
            - "Clock default. Operator with fy_net_worth 120,000,000, fy_operating_income 8,400,000, no stores, no defaults, no delinquency -> composite exactly 60."
          setup_api_calls:
            - call: "POST /franchise-system/operators"
              payload: { legal_name: "Op Boundary LLC", fy_net_worth_cents: 120000000, fy_operating_income_cents: 8400000 }
              as: FranchisorAdmin
              captures: { opb: $.data.id }
