            - "trigger[1] response HTTP status == 200 with data.status == REJECTED and data.decided_by_user_id == analyst-1 - a self-REJECT is permitted"
            - "Recipe.${r1}.status == DRAFT and revision_round == 1 after trigger[1]"
            - "trigger[3] response HTTP status == 200 with data.status == CERTIFIED and data.decided_by_user_id == analyst-2"
            - "Recipe.${r1}.status == APPROVED and MenuItem.${item}.labeling_status == DECLARED after trigger[3]"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_menu_item_version_blocks_a_new_recipe_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[recipe-create-stale-menu-item]
          - errors[ERR_STALE_MENU_ITEM_VERSION]
          - endpoints[POST /menu-items/{id}/recipes]
        distinguishing_aspect: "The declared OCC rule on POST /menu-items/{id}/recipes: an offer-window append advances MenuItem.version, so the version observed at item creation is stale and replaying it returns ERR_STALE_MENU_ITEM_VERSION (412) with no Recipe created, while the freshly observed version is accepted."
        test_recipe:
          setup:
            - "One brand with one TEST_MARKET item whose version is captured at creation and then advanced by an offer-window append."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Test Market Melt", item_class: "TEST_MARKET", variable_type: "NONE", first_offered_on: "2026-04-01" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/offer-windows"
              payload: { start_date: "2026-04-01", end_date: "2026-04-20" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item_v2: $.data.version }
          trigger:
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Branching from a stale view of the item" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { err_stale: $.data.error_id }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v2}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
          assert:
            - "${item_v2} > ${item_v1} - the offer-window append is a mutation of the item row and increments version"
            - "trigger[0] response HTTP status == 412 and data.error_id == ERR_STALE_MENU_ITEM_VERSION"
            - "GET /recipes with menu_item_id ${item} returns total_count == 0 immediately after trigger[0]"
            - "trigger[1] response HTTP status == 201 with data.version_no == 1, data.revision_round == 0 and data.status == DRAFT"
            - "MenuItem.${item}.cumulative_offered_days == 20 and labeling_exempt == true throughout"

      - name: stale_expected_brand_version_blocks_a_new_disclosure_packet
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[packet-create-stale-brand]
          - errors[ERR_STALE_BRAND_VERSION]
          - endpoints[POST /brands/{id}/disclosure-packets]
          - validations[priority=9]
        distinguishing_aspect: "The second declared OCC rule, and it is evaluated at priority 9 - before the coverage precondition at 20: the brand version observed at 19 units is stale once the twentieth unit flips coverage, so replaying it returns ERR_STALE_BRAND_VERSION (412) rather than any state error, and the refreshed version is accepted."
        test_recipe:
          setup:
            - "Brand with one certified STANDARD item and 19 OPERATING units; the brand version is read at that point and then advanced by a twentieth unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 19, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "ID-B" }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Sandwich as served", role: "BASE", grams: 100, calories_per_100g: 100, sodium_mg_per_100g: 200, added_sugar_g_per_100g: 0, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Database values verified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "GET /brands/${brand}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { brand_v1: $.data.version }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-B-0020", unit_status: "OPERATING", operates_under_brand_name: true }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "GET /brands/${brand}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { brand_v2: $.data.version }
          trigger:
            - call: "POST /brands/${brand}/disclosure-packets"
              payload: { expected_brand_version: "${brand_v1}", cross_contact_statement: "", written_info_channels: ["IN_STORE_BINDER"] }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { err_stale: $.data.error_id }
            - call: "POST /brands/${brand}/disclosure-packets"
              payload: { expected_brand_version: "${brand_v2}", cross_contact_statement: "", written_info_channels: ["IN_STORE_BINDER"] }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { packet: $.data.id }
          assert:
            - "setup_api_calls[9] response data.coverage_status == NOT_COVERED with coverage_reason == BELOW_UNIT_THRESHOLD, and setup_api_calls[11] response data.coverage_status == COVERED - the twentieth unit moved the brand"
            - "${brand_v2} > ${brand_v1}"
            - "trigger[0] response HTTP status == 412 and data.error_id == ERR_STALE_BRAND_VERSION"
            - "GET /brands/${brand}/disclosure-packets returns total_count == 0 immediately after trigger[0]"
            - "trigger[1] response HTTP status == 201 with data.packet_version == 1, data.status == DRAFT, data.covered_item_count == 1 and data.allergen_matrix_complete == true"
            - "trigger[1] response data.cross_contact_statement_required == false - the single component carries cross_contact_risk NONE"

      - name: certification_and_closure_cascades_run_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Recipe
          - state_machines.Establishment
        excluded_because:
          difficulty_instance: transitive_cascade / certification_cascade_recipe_to_item_to_board_to_brand
          rationale: "That instance verifies a four-hop chain hop by hop with an ordering assertion, and its sibling permanent_closure_cascade_unit_to_board_to_item_to_brand does the same for the downward cascade, so both the depth and the ordering-sensitivity claims of this layer are already carried."

      - name: both_calculation_variants_diverge_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.covered_establishment_determination
          - calculations.enforcement_penalty_assessment
        excluded_because:
          difficulty_instance: dual_variant_calc / coverage_basis_divergence_operating_only_vs_registered_all
          rationale: "The coverage instance runs both bases over one estate and asserts the delta, and penalty_basis_divergence_per_board_vs_per_establishment does the same for the penalty variants, including the reconciliation when the automatic re-determination overwrites a manual REGISTERED_ALL result."

      - name: cumulative_and_instantaneous_thresholds_bite_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.temporary_item_exemption_days
          - calculations.covered_establishment_determination
        excluded_because:
          difficulty_instance: boundary_precision_check / reprint_tolerance_band_at_and_below_the_threshold
          rationale: "The at-threshold and one-below-threshold pair is exercised there for the reprint tolerance, and the other two thresholds of this layer already have dedicated §1.9 calculations instances (unit_count_threshold_boundary_at_nineteen_twenty_and_twenty_one for the instantaneous count and temporary_item_offer_windows_merge_then_cross_the_sixty_day_limit for the cumulative day count, including its review-year reset)."

  - section: consistency_model
    instances:
      - name: derived_cross_aggregate_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /brands/{id}/establishment-batches]
          - endpoints[POST /nutrition-analyses/{id}/decision]
          - endpoints[GET /brands/{id}/compliance-summary]
        distinguishing_aspect: "Nothing lags: the certification decision's own response already shows the item declared, the batch response that creates twenty units already reports brand_coverage_status COVERED, and a read issued immediately afterwards agrees field for field with both write responses."
