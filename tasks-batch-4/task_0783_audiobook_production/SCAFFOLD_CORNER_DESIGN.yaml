              as: Author
              as_user_id: "${au}"
          trigger:
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEAL_TYPE_FIELDS"

      - name: full_milestone_zero_finished_hours_returns_invalid_finished_hours
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_FINISHED_HOURS]"]
        distinguishing_aspect: "Submitting a FULL milestone with finished_hours 0 returns ERR_INVALID_FINISHED_HOURS (422)."
        test_recipe:
          setup:
            - "An ACCEPTED contract (title IN_PRODUCTION)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AV3", email: "av3@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NV3", email: "nv3@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "VT3", isbn: "V3", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
