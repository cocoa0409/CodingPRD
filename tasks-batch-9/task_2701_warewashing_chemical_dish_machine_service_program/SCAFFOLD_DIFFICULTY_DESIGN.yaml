          - entities.Dispenser.fields.placement_id
        distinguishing_aspect: |
          Entity pair is Dispenser depending on MachinePlacement: the identical dispenser payload is
          rejected, accepted and rejected again with nothing changing except the PARENT placement's
          placement_status (PENDING_INSTALL -> INSTALLED -> RETRIEVAL_SCHEDULED). The dependency is
          two-sided rather than one-shot: it is not "the parent must exist" but "the parent must be in
          exactly one of its four lifecycle states", and the window closes again on the far side.
