            - "fail lab-result overall_result == FAIL; Package.${pkg_fail_id}.status == FAILED, lab_hold == true, thc_pct == null"

  # =================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >=3 and >=2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: failed_test_destroy_cascade_depth3
        grounds:
          - state_machines.Package.FAILED_to_DESTROYED
          - state_machines.Harvest.CURED_to_FINISHED
          - entities.Harvest.fields.status
          - entities.Package.fields.remaining_grams
        distinguishing_aspect: |
          Depth-3 cascade from a WasteEvent: (1) the POST waste-event mutates the FAILED Package
          (remaining_grams to 0); (2) that full destruction itself flips Package.status FAILED to
          DESTROYED; (3) because the package was the only package of a fully-packaged CURED harvest
          (remaining_weight 0), the DESTROYED transition bubbles up and auto-finishes the Harvest
          CURED to FINISHED (Harvest.version bumps) — each hop caused by the prior hop, not by the
          original waste action.
        test_recipe:
          setup:
            - "A CURED harvest fully packaged into exactly one FLOWER package (dry 600g, package 600g, harvest remaining_weight 0) that then FAILED its lab test."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-7", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-7", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-G", strain: "Skunk", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-G", wet_weight_grams: 1500 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 600 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-G", product_category: "FLOWER", quantity_grams: 600 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: false, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
          trigger:
            - call: "POST /compliance/waste-events"
              payload: { source_type: "PACKAGE", package_id: "${pkg_id}", reason: "FAILED_TEST", destroyed_grams: 600, destroyed_at: "2026-06-05T00:00:00Z" }
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "GET /compliance/packages/${pkg_id}"
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { pkg_status: $.data.status }
            - call: "GET /compliance/harvests/${harv_id}"
              as: Cultivator
              captures: { harv_status: $.data.status }
          assert:
            - "Package.${pkg_id}.remaining_grams == 0 (hop 1)"
            - "Package.${pkg_id}.status == DESTROYED (hop 2, caused by full destruction)"
            - "Harvest.${harv_id}.status == FINISHED (hop 3: bubble-up auto-finish because the only package of the fully-packaged CURED harvest terminalized)"

      - name: sale_finalize_deplete_cascade_depth2
        grounds:
          - state_machines.Sale.OPEN_to_FINALIZED
          - state_machines.Package.ACTIVE_to_DEPLETED
          - entities.Package.fields.remaining_grams
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (sale finalize, not waste): (1) finalize decrements the
          line's Package.remaining_grams to 0; (2) that zero-out itself auto-transitions Package ACTIVE→DEPLETED.
          The second hop is caused by the first hop's resulting remaining_grams, not by finalize directly.
        test_recipe:
          setup:
            - "A RETAIL license; an ACTIVE FLOWER package with remaining_grams exactly 10.0; an OPEN sale with one line dispensing all 10.0 g; customer adult-use under daily limit."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-4", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-8", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-8", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-H", strain: "Mint", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-H", wet_weight_grams: 100 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 50 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-H", product_category: "FLOWER", quantity_grams: 10 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: false }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-06T00:00:00Z" }
              as: Budtender
              captures: { sale_id: $.data.id }
            - call: "POST /compliance/sales/${sale_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 10.0 }
              as: Budtender
          trigger:
            - call: "GET /compliance/sales/${sale_id}"
              as: Budtender
              captures: { sale_v: $.data.version }
            - call: "POST /compliance/sales/${sale_id}/finalize"
              payload: { expected_sale_version: "${sale_v}" }
              as: Budtender
            - call: "GET /compliance/packages/${pkg_id}"
              as: Budtender
              captures: { pkg_status: $.data.status }
          assert:
            - "Package.${pkg_id}.remaining_grams == 0 (hop 1)"
            - "Package.${pkg_id}.status == DEPLETED (hop 2, auto-transition on zero remaining)"
            - "Sale.${sale_id}.status == FINALIZED"

  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_license_active_on_advance
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.PlantBatch.IMMATURE_to_VEGETATIVE
          - state_machines.License.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair state (priority 4, ERR_INVALID_STATE) vs business_safety (priority 5,
          ERR_LICENSE_NOT_ACTIVE): a HARVESTED batch under a SUSPENDED license fails both the
          state check and the license check; priority 4 wins, so ERR_INVALID_STATE is returned,
          NOT ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "A CULTIVATION license that is then SUSPENDED, and a batch that has already been HARVESTED (terminal for advance) under it."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-9", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-I", strain: "Jack", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-I", wet_weight_grams: 1000 }
              as: Cultivator
            - call: "POST /compliance/licenses/${cul_id}/suspend"
              payload: {}
              as: StateRegulator
          trigger:
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
              captures: { err: $.data.error_id }
          assert:
            - "advance returns 409 ERR_INVALID_STATE (state priority 4 beats license priority 5), NOT ERR_LICENSE_NOT_ACTIVE"

      - name: sod_vs_state_on_clear_hold
        grounds:
          - validations[priority=7]
          - validations[priority=4]
          - state_machines.Package.ON_HOLD_to_ACTIVE
        distinguishing_aspect: |
          Category pair business_safety (priority 7, ERR_SEGREGATION_OF_DUTIES) vs state (priority 4,
          ERR_INVALID_STATE), a different pair than the first instance: an ACTIVE (not ON_HOLD) package,
          when the same auditor who would place a hold attempts clear-hold, fails the state check first;
          priority 4 (ERR_INVALID_STATE) wins over the SoD check at priority 7.
        test_recipe:
          setup:
            - "An ACTIVE package (never put ON_HOLD); ComplianceManager attempts clear-hold."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-10", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-10", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-J", strain: "Gelato", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-J", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-J", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /compliance/packages/${pkg_id}/clear-hold"
              payload: {}
