scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: drop_in_price_full_vs_credit_offset_on_enrollment
        grounds:
          - calculations.enrollment_drop_in_price
          - entities.Enrollment.fields.price_cents
          - entities.Enrollment.fields.wallet_applied_cents
          - entities.Guardian.fields.wallet_credit_cents
        distinguishing_aspect: "Same drop-in enrollment inputs (program fee 5000, single week, sibling_index 1) yield price_cents 5000 when guardian wallet is 0 (full_price_no_credit) but price_cents 3000 with wallet_applied_cents 2000 when the guardian wallet holds 2000 (credit_offset) — the dual variant lives on the Enrollment/Guardian-wallet domain."
        test_recipe:
          setup:
            - "One center, one program (drop_in_fee_cents=5000, ages 4-18), rank-1 belt."
            - "Two guardians: G1 wallet 0, G2 wallet 2000 (via admin adjustment); each with one member born 2016-01-01 (age 10 at clock default)."
            - "One AFTER_SCHOOL single-week session OPEN at the center for the program (effective_capacity large)."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10, timezone: "UTC" }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Create Coding", code: "CRE1", min_age: 4, max_age: 18, drop_in_fee_cents: 5000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 2 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G2", email: "g2@x.com" }
              as: CenterAdmin
              captures: { g2: $.data.id }
            - call: "POST /guardians/${g2}/wallet/adjustments"
              payload: { amount_cents: 2000, reason: "promo" }
              as: CenterAdmin
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g2}", program_id: "${prog}", full_name: "M2", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g2}"
              captures: { m2: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 2 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { s1v: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${s1v}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id }
            - call: "GET /sessions/${s1}"
              payload: {}
              as: CenterAdmin
              captures: { s1v_after: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m2}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${s1v_after}" }
              as: Guardian
              as_user_id: "${g2}"
              captures: { e2: $.data.id }
          assert:
            - "Enrollment.${e1}.price_cents == 5000"
            - "Enrollment.${e1}.wallet_applied_cents == 0"
            - "Enrollment.${e2}.price_cents == 3000"
            - "Enrollment.${e2}.wallet_applied_cents == 2000"
            - "Guardian.${g2}.wallet_credit_cents == 0"

      - name: membership_cycle_credit_prorated_vs_flat_on_membership
        grounds:
          - calculations.membership_cycle_unused_credit
          - entities.Membership.fields.sessions_used_this_cycle
          - entities.Membership.fields.cycle_index
          - entities.Guardian.fields.wallet_credit_cents
        distinguishing_aspect: "An ACTIVE membership (monthly_fee 12000, included 10, used 4) credits exactly the prorated unused value 7200 = round_half_up(6 * 1200) on cycle advance — NOT the naive flat 12000 — and this dual variant lives on the Membership domain, distinct from the Enrollment-domain dual variant."
        test_recipe:
          setup:
            - "One program, one guardian, one member; an ACTIVE membership monthly_fee 12000, included 10."
            - "Member has consumed 4 membership-covered enrollments this cycle (sessions_used_this_cycle=4)."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Build", code: "BLD1", min_age: 4, max_age: 18, drop_in_fee_cents: 5000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${m1}", monthly_fee_cents: 12000, included_sessions_per_cycle: 10 }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mem1: $.data.id }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "WEEKLY", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { sa: $.data.id }
            - call: "POST /sessions/${sa}/open"
              payload: {}
              as: CenterAdmin
              captures: { sav: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${sa}", member_id: "${m1}", coverage: "MEMBERSHIP", expected_session_version: "${sav}" }
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "WEEKLY", week_count: 1, starts_at: "2026-05-02T16:00:00Z", ends_at: "2026-05-02T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { sb: $.data.id }
            - call: "POST /sessions/${sb}/open"
              payload: {}
              as: CenterAdmin
              captures: { sbv: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${sb}", member_id: "${m1}", coverage: "MEMBERSHIP", expected_session_version: "${sbv}" }
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "WEEKLY", week_count: 1, starts_at: "2026-05-03T16:00:00Z", ends_at: "2026-05-03T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { sc: $.data.id }
            - call: "POST /sessions/${sc}/open"
              payload: {}
              as: CenterAdmin
              captures: { scv: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${sc}", member_id: "${m1}", coverage: "MEMBERSHIP", expected_session_version: "${scv}" }
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "WEEKLY", week_count: 1, starts_at: "2026-05-04T16:00:00Z", ends_at: "2026-05-04T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { sd: $.data.id }
            - call: "POST /sessions/${sd}/open"
              payload: {}
              as: CenterAdmin
              captures: { sdv: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${sd}", member_id: "${m1}", coverage: "MEMBERSHIP", expected_session_version: "${sdv}" }
              as: Guardian
              as_user_id: "${g1}"
          trigger:
            - call: "POST /_billing/advance-cycle"
              payload: { member_id: "${m1}" }
              as: CenterAdmin
          assert:
            - "Guardian.${g1}.wallet_credit_cents == 7200"
            - "Membership.${mem1}.sessions_used_this_cycle == 0"
            - "Membership.${mem1}.cycle_index == 1"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: drop_in_price_circular_wallet_dependency_mode_c
        grounds:
          - calculations.enrollment_drop_in_price
          - entities.Enrollment.fields.price_cents
          - entities.Enrollment.fields.wallet_applied_cents
          - entities.Guardian.fields.wallet_credit_cents
        distinguishing_aspect: "Mode (c) circular-looking dependency: price_cents depends on wallet, and wallet is then debited by exactly what it covered; for a CAMP 2-week sibling_index=2 enrollment (fee 4000) with guardian wallet 1000 the pinned evaluation order yields discounted 6120, wallet_applied 1000, price 5120, wallet left 0 — well-defined only because discounted is computed before wallet is debited."
        test_recipe:
          setup:
            - "Center, program (fee 4000), two members of the SAME guardian (so sibling_index 1 then 2)."
            - "A CAMP 2-week session OPEN. Sibling A is enrolled at index 1 (full price, wallet still 0), THEN the guardian wallet is credited 1000, so the credit lands on sibling B (index 2) under test — proving the circular wallet dependency on B."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Jr", code: "JR1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "Sib A", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mA: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "Sib B", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mB: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "CAMP", week_count: 2, starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-12T15:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { s1v: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${mA}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${s1v}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { eA: $.data.id }
            - call: "POST /guardians/${g1}/wallet/adjustments"
              payload: { amount_cents: 1000, reason: "promo" }
              as: CenterAdmin
            - call: "GET /sessions/${s1}"
              payload: {}
              as: CenterAdmin
              captures: { s1v2: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${mB}", coverage: "DROP_IN", sibling_index: 2, expected_session_version: "${s1v2}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { eB: $.data.id }
          assert:
            - "Enrollment.${eA}.price_cents == 7200"
            - "Enrollment.${eB}.wallet_applied_cents == 1000"
            - "Enrollment.${eB}.price_cents == 5120"
            - "Guardian.${g1}.wallet_credit_cents == 0"

      - name: camp_block_quote_round_per_seat_then_sum_mode_b
        grounds:
          - calculations.camp_block_quote
          - entities.Session.fields.week_count
          - entities.Program.fields.drop_in_fee_cents
        distinguishing_aspect: "Mode (b) nested-rounding-order: for three siblings into a CAMP 3-week session (fee 3001), round-per-seat-then-sum gives block_total_cents 21879 (8103 + 6888 + 6888), whereas sum-then-round gives 21877 — the scaffold pins round-per-seat-then-sum, a different combinatorial axis than the mode-(c) wallet circularity."
        test_recipe:
          setup:
            - "Center, program (drop_in_fee_cents 3001), one guardian with three members."
            - "A CAMP 3-week session created (need not be OPEN; quote is read-only)."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Jr", code: "JR2", min_age: 4, max_age: 18, drop_in_fee_cents: 3001 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "S1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "S2", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "S3", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m3: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "CAMP", week_count: 3, starts_at: "2026-07-06T09:00:00Z", ends_at: "2026-07-24T15:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /sessions/${s1}/quote"
              payload: { member_ids: ["${m1}", "${m2}", "${m3}"] }
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "response.data.block_total_cents == 21879"
            - "response.data.per_seat[0] == 8103"
            - "response.data.per_seat[1] == 6888"
            - "response.data.per_seat[2] == 6888"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_active_paused_cycle_loop
        grounds:
          - state_machines.Membership.ACTIVE_to_PAUSED
          - state_machines.Membership.PAUSED_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: "Membership exhibits a cycle: ACTIVE->PAUSED->ACTIVE->PAUSED returns to PAUSED with sessions_used_this_cycle preserved across both pauses, proving the loop on the Membership entity (distinct from Enrollment's parallel-dimension non-linearity)."
        test_recipe:
          setup:
            - "Program, guardian, member; an ACTIVE membership."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Build", code: "BLD2", min_age: 4, max_age: 18, drop_in_fee_cents: 5000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${m1}", monthly_fee_cents: 8000, included_sessions_per_cycle: 8 }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mem1: $.data.id }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Guardian
              as_user_id: "${g1}"
          trigger:
            - call: "POST /memberships/${mem1}/pause"
              payload: {}
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /memberships/${mem1}/resume"
              payload: {}
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /memberships/${mem1}/pause"
              payload: {}
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "Membership.${mem1}.status == PAUSED"
            - "Membership.${mem1}.sessions_used_this_cycle == 0"

      - name: enrollment_parallel_attendance_and_billing_dimensions
        grounds:
          - state_machines.Enrollment.RESERVED_to_CHECKED_IN
          - entities.Enrollment.fields.attendance_status
          - entities.Enrollment.fields.billing_status
        distinguishing_aspect: "Enrollment carries two independent axes: a check-in advances attendance_status RESERVED->CHECKED_IN while billing_status remains CHARGED unchanged, demonstrating parallel state dimensions on the Enrollment entity (distinct from Membership's cyclic loop)."
        test_recipe:
          setup:
            - "Center, program, guardian wallet 0, member; an OPEN single-week session whose starts_at has been reached on the clock; one DROP_IN enrollment (billing_status CHARGED)."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Create", code: "CRE2", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { s1v: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${s1v}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:30:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /enrollments/${e1}/check-in"
              payload: {}
              as: Instructor
          assert:
            - "Enrollment.${e1}.attendance_status == CHECKED_IN"
            - "Enrollment.${e1}.billing_status == CHARGED"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: session_cancel_cascade_to_enrollment_to_guardian_wallet_depth3
        grounds:
          - state_machines.Session.OPEN_to_CANCELLED
          - state_machines.Enrollment.RESERVED_to_CANCELLED
          - entities.Guardian.fields.wallet_credit_cents
          - entities.Enrollment.fields.billing_status
        distinguishing_aspect: "Depth-3 chain triggered by session cancel: Session->CANCELLED (HOP1) drives Enrollment->CANCELLED/REFUNDED (HOP2) which credits guardian.wallet_credit_cents += price_cents (HOP3); a DROP_IN enrollment priced 4000 ends with the guardian wallet at 4000, each hop caused by the prior."
        test_recipe:
          setup:
            - "Center, program (fee 4000), guardian wallet 0, member; OPEN session with one DROP_IN enrollment (price 4000, wallet 0 before cancel)."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Create", code: "CRE3", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
