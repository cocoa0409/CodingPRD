              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/booking-series"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", cadence: "WEEKLY", first_occurrence_date: "2026-06-20T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { se_id: $.data.id, se_v0: $.data.version }
            - call: "POST /cleaning/booking-series/${se_id}/generate"
              payload: { expected_series_version: "${se_v0}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cleaning/booking-series/${se_id}/generate"
              payload: { expected_series_version: "${se_v0}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "error_id == ERR_STALE_VERSION (the first generate advanced series.version past ${se_v0})"

      - name: activate_second_plan_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-activate-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Re-activating a plan with the pre-activation version after it was already activated (version bumped) -> ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["A plan activated once (version advanced)."]
          setup_api_calls:
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: archived_address_excluded_from_default_list
        claim_type: soft_delete
        grounds: [entities.Address.fields.archived, endpoints.GET./cleaning/addresses]
        distinguishing_aspect: "After archiving, GET /addresses?customer_id omits the archived address by default but includes it with include_archived=true."
        test_recipe:
          setup: ["A customer with one address that gets archived."]
          setup_api_calls:
            - call: "POST /cleaning/customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/addresses/${ad_id}/archive"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
          trigger:
            - call: "GET /cleaning/addresses"
              payload: { customer_id: "${cu_id}" }
              as: Customer
              as_user_id: "${cu_id}"
          assert:
            - "the default list excludes Address.${ad_id} (meta.total_count == 0)"
            - "GET /cleaning/addresses?customer_id=${cu_id}&include_archived=true would include it (total_count 1)"

