  - rule_id: boundary_precision_check
    instances:
      - name: license_quota_exactly_25_percent_passes
        grounds:
          - validations[priority=8]
          - state_machines.MixPlan.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Boundary metric 1 (license quota ratio): total 40 dozen, LICENSED
          planned exactly 10 dozen -> floor(0.25*40) == 10; `<=` comparison means
          exactly-at-quota PUBLISHES successfully, while 11 LICENSED dozen fails —
          exercised via the mix-plan publish endpoint.
        test_recipe:
          setup:
            - "Network N11, THEATER COMPANY door D11 (region R11)"
            - "Varieties: V11c CORE (window covers 2026-09-01), V11l LICENSED (window covers 2026-09-01)"
