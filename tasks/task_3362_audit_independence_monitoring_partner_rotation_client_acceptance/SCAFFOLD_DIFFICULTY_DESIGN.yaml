              as: AuditCommitteeLiaison
            - call: "POST /audit/non-audit-services/${svc_c2}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: AuditCommitteeLiaison
            - call: "POST /audit/non-audit-services/${svc_c2}/transitions"
              payload: { action: "APPROVE", committee_resolution_ref: "AC-2027-0002" }
              as: AuditCommitteeLiaison
            - call: "POST /audit/non-audit-services/${svc_c3}/transitions"
