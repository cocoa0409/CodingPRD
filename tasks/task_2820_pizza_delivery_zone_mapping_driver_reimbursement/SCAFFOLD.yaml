# =============================================================================
# PRD Benchmark Seed Tables — Pizza Delivery Zone Mapping & Driver Reimbursement
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2820. Pizza Delivery Zone Mapping & Driver Reimbursement (Domino's franchise
  store): delivery area polygon definition and edge-address dispute resolution,
  drive-time modeling and out-of-area order decline or carryout redirect, driver
  dispatch with route stacking and hot-bag capacity, per-delivery reimbursement
  plus mileage under a vehicle cost model, driver qualification, motor-vehicle-
  record checks and insurance verification, delivery fee versus tip disclosure
  and customer complaints, order-to-door time tracking and remake policy,
  cash-on-hand limits and safe-drop procedures.

domain_name: pizza-delivery-zone-reimbursement
api_prefix: /store-ops

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # DispatchStop is a junction entity binding Dispatch x Order (many-to-many over
  # time: an Order may be stacked, released by a recall, then re-stacked).
  # ZoneVersion.supersedes_zone_version_id is self-referential. All collections
  # are peer-level under /store-ops with FK references in request bodies; no
  # creation endpoint nests a child inside a parent path except append-only
  # sub-collections (mvr-checks, insurance-verifications, safe-drops, stops).

  state_machine_shape: parallel
  # Order carries two independent dimensions (fulfillment_status x
  # settlement_status) that advance on different triggers. AddressDispute and
  # Complaint are cyclic (review / reject loops). Dispatch is cyclic
  # (STACKED <-> LOCKED, DRAFT <-> STACKED) with a divergent RECALLED branch.

  relationship_patterns:
    - one_to_many          # Store -> ZoneVersion / ServiceAddress / Driver / Order
    - many_to_many         # Dispatch <-> Order through DispatchStop
    - self_referential     # ZoneVersion.supersedes_zone_version_id -> ZoneVersion.id
    - cross_aggregate      # ReimbursementLine references Dispatch, Driver AND Order

  role_model: segregation_of_duties
  # The ComplianceOfficer who records an MvrCheck may not be the officer who
  # signs the resulting qualification decision (ERR_SEGREGATION_OF_DUTIES).
  # Beyond that the roles are peer-scoped: Dispatcher owns routing, Driver owns
  # door events and cash, StoreManager owns zone/cash/remake/settlement policy,
  # CustomerCareAgent owns disputes and complaints.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities, 61 endpoints, 8 state machines (Order carries two of them),
  # 11 calculations (2 with divergent variants), 41 ordered validations,
  # 2 OCC rules, 64 error codes.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_number
        type: string
        source: input
        description: "Franchise store number; globally unique"
        constraints: "1-8 chars; unique across Store; violation -> ERR_STORE_NUMBER_TAKEN"
      - name: name
        type: string
        source: input
        description: "Store display name"
      - name: latitude_micro
        type: integer
        source: input
        description: "Store origin latitude in micro-degrees (integer arithmetic only)"
        constraints: "-90000000 .. 90000000"
      - name: longitude_micro
        type: integer
        source: input
        description: "Store origin longitude in micro-degrees"
        constraints: "-180000000 .. 180000000"
      - name: promise_minutes
        type: integer
        source: input
        description: "Advertised order-to-door promise in whole minutes"
        default: 30
        constraints: ">= 1"
      - name: delivery_fee_cents
        type: integer
        source: input
        description: "Base customer delivery fee in cents before drive-time tier surcharge"
        default: 399
        constraints: ">= 0"
      - name: cash_limit_cents
        type: integer
        source: input
        description: "Maximum cash a driver may carry; reaching it forces a safe drop"
        default: 5000
        constraints: ">= 0"
      - name: hot_bag_count
        type: integer
        source: input
        description: "Number of insulated hot-bag slots the store owns (aggregate capacity pool)"
        default: 4
        constraints: ">= 1"
      - name: max_stacked_stops
        type: integer
        source: input
        description: "Maximum stops allowed on one Dispatch"
        default: 3
        constraints: ">= 1"
      - name: handoff_minutes_per_stop
        type: integer
        source: input
        description: "Flat curbside handoff allowance added per stop when modelling route duration"
        default: 6
        constraints: ">= 0"
      - name: dispatch_reset_buffer_minutes
        type: integer
        source: input
        description: "Post-return reset buffer appended to a driver's dispatch occupation interval"
        default: 10
        constraints: ">= 0"
      - name: service_posture
        type: enum
        source: input
        description: "Gates order intake"
        default: OPEN
        constraints: "OPEN | CARRYOUT_ONLY | CLOSED"
      - name: cash_collected_total_cents
        type: integer
        source: computed
        description: "Running total of cash collected at doors by this store's drivers"
        default: 0
      - name: safe_deposit_total_cents
        type: integer
        source: computed
        description: "Running total of RECORDED safe drops held in the store safe"
        default: 0
      - name: unassigned_order_count
        type: integer
        source: computed
        description: "Count of this store's Orders with fulfillment_status IN {ZONE_CLEARED, IN_PRODUCTION, READY, REMAKE_QUEUED}; recomputed on every read"
        default: 0
      - name: active_zone_version_number
        type: integer
        source: computed
        description: "version_number of the ZoneVersion with status ACTIVE whose [effective_from, effective_to) contains the logical clock; null when none is in force"

  - name: ZoneVersion
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this delivery-area definition belongs to"
      - name: version_number
        type: integer
        source: system
        description: "1-based sequence within the store: count of pre-existing ZoneVersions for store_id, plus 1"
      - name: polygon
        type: array
        source: input
        description: "Ordered ring of vertices, each an object { latitude_micro: integer, longitude_micro: integer }; the ring closes implicitly from the last vertex back to the first"
        constraints: ">= 3 vertices; violation -> ERR_INVALID_POLYGON"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of this version's window (ISO 8601 UTC)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of this version's window (ISO 8601 UTC)"
        constraints: "> effective_from; violation -> ERR_INVALID_ZONE_WINDOW"
      - name: max_drive_time_minutes
        type: integer
        source: input
        description: "Inclusive drive-time ceiling: an in-polygon address at or under this value is IN_ZONE"
        default: 25
        constraints: ">= 1"
      - name: base_drive_minutes
        type: integer
        source: input
        description: "Fixed oven-out-to-road allowance added to every drive-time estimate"
        default: 6
        constraints: ">= 0"
      - name: minutes_per_mile
        type: integer
        source: input
        description: "Minutes charged per grid mile in the drive-time model"
        default: 3
        constraints: ">= 1"
      - name: peak_surcharge_minutes
        type: integer
        source: input
        description: "Drive-time surcharge applied when the logical clock hour (UTC) is in {17,18,19,20}"
        default: 7
        constraints: ">= 0"
      - name: barrier_surcharge_minutes
        type: integer
        source: input
        description: "Drive-time surcharge applied when the address crosses a barrier (river, rail, limited-access highway)"
        default: 4
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 ZoneVersion"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUPERSEDED"
      - name: supersedes_zone_version_id
        type: string
        source: system
        description: "FK -> ZoneVersion.id; self-reference set on activation to the same store's ACTIVE version with the greatest effective_to among those whose effective_to <= this version's effective_from (tie-break created_at DESC); null when none"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant the version was activated; null while DRAFT"

  - name: ServiceAddress
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store whose zone model evaluated this address"
      - name: line1
        type: string
        source: input
        description: "Street line as taken over the phone or from the web order"
      - name: latitude_micro
        type: integer
        source: input
        description: "Geocoded latitude in micro-degrees"
      - name: longitude_micro
        type: integer
        source: input
        description: "Geocoded longitude in micro-degrees"
      - name: crosses_barrier
        type: boolean
        source: input
        description: "True when the route to this address crosses a mapped barrier; feeds barrier_surcharge_minutes"
        default: false
      - name: grid_miles
        type: number
        source: computed
        description: "Rectilinear grid distance from the store origin; see calculations.grid_distance_miles"
        constraints: "2 decimal places, round_half_up"
      - name: drive_time_estimate_minutes
        type: integer
        source: computed
        description: "Modelled drive time; see calculations.drive_time_estimate"
      - name: zone_state
        type: enum
        source: computed
        description: "Geometric+drive-time classification; see calculations.zone_state_classification"
        constraints: "IN_ZONE | EDGE | OUT_OF_ZONE"
      - name: evaluated_zone_version_number
        type: integer
        source: computed
        description: "version_number of the ZoneVersion in force when this address was evaluated"
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock instant of evaluation"
      - name: override_state
        type: enum
        source: system
        description: "Set to IN_ZONE by a GRANTED AddressDispute; null otherwise"
        constraints: "IN_ZONE | null"
      - name: override_until
        type: datetime
        source: system
        description: "Exclusive expiry of override_state; null when no override"
      - name: effective_zone_state
        type: enum
        source: computed
        description: "override_state when override_state is not null AND override_until > logical clock, else zone_state"
        constraints: "IN_ZONE | EDGE | OUT_OF_ZONE"

  - name: AddressDispute
    parent: ServiceAddress
    common_fields: true
    fields:
      - name: service_address_id
        type: string
        source: input
        description: "FK -> ServiceAddress.id; the edge address under dispute"
      - name: claimed_state
        type: enum
        source: input
        description: "What the customer claims the address is"
        constraints: "IN_ZONE"
      - name: evidence_note
        type: string
        source: input
        description: "Free-text evidence supplied by the customer or agent"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 AddressDispute"
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | GRANTED | DENIED | WITHDRAWN"
      - name: review_round_count
        type: integer
        source: system
        description: "Number of REQUEST_INFO actions taken so far; capped by MAX_REVIEW_ROUNDS"
        default: 0
      - name: resolution
        type: enum
        source: system
        description: "Terminal outcome; null until GRANTED or DENIED"
        constraints: "GRANTED | DENIED | null"
      - name: granted_until
        type: datetime
        source: input
        description: "Exclusive expiry copied onto ServiceAddress.override_until when the dispute is granted; required on the GRANT action only"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of GRANT or DENY"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager who last acted on the review"

  - name: Driver
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; employing franchise store"
      - name: full_name
        type: string
        source: input
        description: "Driver legal name"
      - name: license_number
        type: string
        source: input
        description: "Driver licence number; unique within the store"
        constraints: "unique per (store_id, license_number); violation -> ERR_LICENSE_NUMBER_TAKEN"
      - name: vehicle_class
        type: enum
        source: input
        description: "Vehicle category used to select the VehicleCostModel"
        constraints: "CAR | SUV | SCOOTER"
      - name: qualification_status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 Driver"
        default: APPLICANT
        constraints: "APPLICANT | PENDING_CHECKS | QUALIFIED | SUSPENDED | DISQUALIFIED"
      - name: insurance_status
        type: enum
        source: computed
        description: "VERIFIED when the newest InsuranceVerification for this driver has status VERIFIED, REJECTED when it has status REJECTED, NONE when the driver has none"
        default: NONE
        constraints: "NONE | VERIFIED | REJECTED"
      - name: mvr_points_latest
        type: integer
        source: computed
        description: "violation_points of the newest MvrCheck for this driver (order by created_at DESC, then checked_on DESC); 0 when none"
        default: 0
      - name: cash_on_hand_cents
        type: integer
        source: computed
        description: "Cash collected at doors minus RECORDED safe drops; see calculations.driver_cash_position"
        default: 0
      - name: cash_posture
        type: enum
        source: computed
        description: "DROP_REQUIRED when cash_on_hand_cents >= owning Store.cash_limit_cents, else CLEAR"
        default: CLEAR
        constraints: "CLEAR | DROP_REQUIRED"
      - name: reimbursement_accrued_cents
        type: integer
        source: computed
        description: "Sum of ReimbursementLine.amount_cents for this driver with status == ACCRUED; see calculations.driver_reimbursement_accrual"
        default: 0
      - name: qualified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who last signed a QUALIFY or REINSTATE decision; null before qualification"
      - name: disqualified_reason
        type: string
        source: system
        description: "Reason recorded on the transition into DISQUALIFIED; null otherwise"

  - name: VehicleCostModel
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store that publishes this reimbursement schedule"
      - name: vehicle_class
        type: enum
        source: input
        description: "Vehicle category this schedule prices"
        constraints: "CAR | SUV | SCOOTER"
      - name: per_delivery_cents
        type: integer
        source: input
        description: "Flat per-delivery reimbursement paid for every stop"
        constraints: ">= 0"
      - name: tier1_cap_miles
        type: number
        source: input
        description: "Cumulative dispatch mileage covered by the tier-1 rate; miles beyond this cumulative point price at tier2_per_mile_cents"
        constraints: "> 0; 2 decimal places"
      - name: tier1_per_mile_cents
        type: integer
        source: input
        description: "Cents per mile inside the tier-1 cumulative band"
        constraints: ">= 0"
      - name: tier2_per_mile_cents
        type: integer
        source: input
        description: "Cents per mile beyond the tier-1 cumulative band"
        constraints: ">= 0"
      - name: min_reimbursement_per_stop_cents
        type: integer
        source: input
        description: "Floor applied to each stop's per_delivery + mileage total"
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive instant from which this schedule may be selected"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; RETIRED when a later-effective schedule for the same (store_id, vehicle_class) is published"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"
      - name: retired_at
        type: datetime
        source: system
        description: "Logical-clock instant of retirement; null while ACTIVE"

  - name: MvrCheck
    parent: Driver
    common_fields: false
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver whose motor-vehicle record was pulled"
      - name: result
        type: enum
        source: input
        description: "Outcome of the motor-vehicle-record pull"
        constraints: "CLEAR | MINOR_VIOLATIONS | FAILED"
      - name: violation_points
        type: integer
        source: input
        description: "Points on the record at pull time"
        constraints: "0 .. 20"
      - name: checked_on
        type: datetime
        source: input
        description: "Instant the record was pulled at the vendor (ISO 8601 UTC)"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the pull; consumed by the segregation-of-duties check"

  - name: InsuranceVerification
    parent: Driver
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; insured driver"
      - name: policy_number
        type: string
        source: input
        description: "Carrier policy identifier"
      - name: coverage_from
        type: datetime
        source: input
        description: "Inclusive start of coverage (ISO 8601 UTC)"
      - name: coverage_to
        type: datetime
        source: input
        description: "Exclusive end of coverage (ISO 8601 UTC)"
        constraints: "> coverage_from; violation -> ERR_INVALID_COVERAGE_WINDOW"
      - name: liability_limit_cents
        type: integer
        source: input
        description: "Combined single-limit liability in cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "VERIFIED when liability_limit_cents >= MIN_LIABILITY_CENTS, else REJECTED; SUPERSEDED when a newer verification is filed"
        constraints: "VERIFIED | REJECTED | SUPERSEDED"
      - name: rejected_reason
        type: string
        source: system
        description: "Populated when status is REJECTED; null otherwise"

  - name: Order
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; fulfilling store"
      - name: service_address_id
        type: string
        source: input
        description: "FK -> ServiceAddress.id; delivery destination"
      - name: customer_name
        type: string
        source: input
        description: "Customer name on the ticket"
      - name: customer_phone
        type: string
        source: input
        description: "Callback number"
      - name: food_subtotal_cents
        type: integer
        source: input
        description: "Food and beverage subtotal in cents, taxes excluded"
        constraints: ">= 0"
      - name: tip_cents
        type: integer
        source: input
        description: "Pre-declared driver tip in cents"
        default: 0
        constraints: ">= 0"
      - name: payment_method
        type: enum
        source: input
        description: "How the customer settles at the door"
        constraints: "CASH | CARD"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Production/delivery dimension; see §1.2 Order.fulfillment"
        default: PLACED
        constraints: "PLACED | ZONE_HELD | ZONE_CLEARED | IN_PRODUCTION | READY | ASSIGNED | EN_ROUTE | DELIVERED | REMAKE_QUEUED | CLOSED | DECLINED_OUT_OF_AREA | CARRYOUT_REDIRECTED"
      - name: settlement_status
        type: enum
        source: system
        description: "Money dimension, advancing on its own triggers; see §1.2 Order.settlement"
        default: UNDISCLOSED
        constraints: "UNDISCLOSED | DISCLOSED | CHARGED | ADJUSTED | CLOSED_SETTLED | VOIDED"
      - name: promise_minutes_snapshot
        type: integer
        source: system
        description: "Store.promise_minutes copied at order creation; later Store edits do not move this order's promise"
      - name: fee_tier
        type: enum
        source: computed
        description: "Drive-time band that picks the delivery-fee surcharge; see calculations.customer_delivery_charge"
        constraints: "BASE | MID | FAR"
      - name: base_delivery_fee_cents
        type: integer
        source: computed
        description: "Store.delivery_fee_cents plus the fee_tier surcharge, before the waiver"
      - name: fee_waiver_pct
        type: integer
        source: computed
        description: "Waiver percentage selected from food_subtotal_cents alone"
        constraints: "0 | 50 | 100"
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: "Waived customer delivery fee actually charged; see calculations.customer_delivery_charge"
      - name: total_charge_cents
        type: integer
        source: computed
        description: "food_subtotal_cents + delivery_fee_cents + tip_cents"
      - name: disclosed_fee_cents
        type: integer
        source: input
        description: "Delivery fee the agent quoted to the customer; supplied on the disclose-fee action"
      - name: disclosed_tip_cents
        type: integer
        source: input
        description: "Tip amount the agent quoted to the customer; supplied on the disclose-fee action"
      - name: driver_tip_notice_given
        type: boolean
        source: input
        description: "True when the agent told the customer the delivery fee is not the driver's tip"
        default: false
      - name: fee_disclosure_accurate
        type: boolean
        source: computed
        description: "disclosed_fee_cents == delivery_fee_cents AND disclosed_tip_cents == tip_cents AND driver_tip_notice_given == true; null before disclosure"
      - name: fee_disclosed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the disclose-fee action; null before it"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant of order creation; the order-to-door stopwatch start"
      - name: ready_at
        type: datetime
        source: system
        description: "Logical-clock instant the order was marked READY; null before"
      - name: door_arrival_at
        type: datetime
        source: system
        description: "Logical-clock instant of the door-arrival event; reset to null when a remake is queued"
      - name: zone_held_at
        type: datetime
        source: system
        description: "Logical-clock instant the order entered ZONE_HELD; null when never held"
      - name: zone_hold_minutes
        type: integer
        source: computed
        description: "Accumulated whole minutes spent in ZONE_HELD; see calculations.order_to_door_minutes"
        default: 0
      - name: remake_hold_minutes
        type: integer
        source: computed
        description: "Accumulated whole minutes between a door arrival and the remake that voided it"
        default: 0
      - name: remake_count
        type: integer
        source: system
        description: "Number of remakes queued on this order; capped by MAX_REMAKES"
        default: 0
      - name: order_to_door_gross_minutes
        type: integer
        source: computed
        description: "Wall-clock minutes from placed_at to door_arrival_at; GROSS variant of calculations.order_to_door_minutes"
      - name: order_to_door_net_minutes
        type: integer
        source: computed
        description: "GROSS minus excludable holds; NET variant of calculations.order_to_door_minutes"
      - name: cash_collected_cents
        type: integer
        source: computed
        description: "Cash taken at the door for this order; 0 for CARD orders"
        default: 0
      - name: remedy_issued_cents
        type: integer
        source: computed
        description: "Complaint remedy credited against this order; see calculations.complaint_remedy"
        default: 0
      - name: remake_credit_cents
        type: integer
        source: computed
        description: "Store-absorbed food cost of remakes on this order"
        default: 0
      - name: declined_reason
        type: enum
        source: system
        description: "Populated on DECLINED_OUT_OF_AREA or CARRYOUT_REDIRECTED"
        constraints: "OUT_OF_AREA | DRIVE_TIME_EXCEEDED | STORE_CARRYOUT_ONLY | null"

  - name: Dispatch
    parent: Driver
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver who will run this route"
      - name: planned_depart_at
        type: datetime
        source: input
        description: "Inclusive start of the driver's occupation interval and of the hot-bag reservation window"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 Dispatch"
        default: DRAFT
        constraints: "DRAFT | STACKED | LOCKED | EN_ROUTE | RETURNED | SETTLED | RECALLED | CANCELLED"
      - name: stop_count
        type: integer
        source: computed
        description: "Count of this dispatch's DispatchStops with status IN {PENDING, DELIVERED, REMADE}"
        default: 0
      - name: committed_hot_bag_slots
        type: integer
        source: computed
        description: "Sum of hot_bag_slots over this dispatch's DispatchStops with status IN {PENDING, DELIVERED, REMADE}; released to 0 once status IN {RETURNED, SETTLED, RECALLED, CANCELLED}"
        default: 0
      - name: route_minutes
        type: integer
        source: computed
        description: "Modelled round-trip duration; see calculations.route_duration_model; null before LOCKED"
      - name: expected_return_at
        type: datetime
        source: computed
        description: "planned_depart_at + route_minutes; exclusive end of the hot-bag reservation window; null before LOCKED"
      - name: resolved_cost_model_id
        type: string
        source: system
        description: "FK -> VehicleCostModel.id; schedule snapshotted at lock time by the cost-model selector; null before LOCKED"
      - name: estimated_reimbursement_cents
        type: integer
        source: computed
        description: "ESTIMATED variant of calculations.dispatch_reimbursement over planned_miles; frozen at lock"
      - name: actual_reimbursement_cents
        type: integer
        source: computed
        description: "ACTUAL variant of calculations.dispatch_reimbursement over actual_miles; computed at settle"
      - name: reimbursement_variance_cents
        type: integer
        source: computed
        description: "actual_reimbursement_cents - estimated_reimbursement_cents; null before settle"
      - name: departed_at
        type: datetime
        source: system
        description: "Logical-clock instant of departure; null before EN_ROUTE"
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant of return; null before RETURNED"
      - name: recalled_reason
        type: string
        source: system
        description: "Reason recorded on the transition into RECALLED; null otherwise"

  - name: DispatchStop
    parent: Dispatch
    common_fields: true
    fields:
      - name: dispatch_id
        type: string
        source: input
        description: "FK -> Dispatch.id; route this stop belongs to"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; order carried to this stop"
      - name: sequence
        type: integer
        source: system
        description: "1-based insertion ordinal: the count of ALL DispatchStops ever created on this dispatch, in ANY status, plus 1. Existing stops are never renumbered, and a released stop's ordinal is never reused, so the next insertion after a release receives a FRESH higher number."
      - name: hot_bag_slots
        type: integer
        source: input
        description: "Insulated bag slots this stop occupies"
        default: 1
        constraints: "1 .. 2"
      - name: planned_miles
        type: number
        source: computed
        description: "ServiceAddress.grid_miles of the stop's order, snapshotted at insertion"
        constraints: "2 decimal places"
      - name: planned_drive_minutes
        type: integer
        source: computed
        description: "ceil(planned_miles * in-force ZoneVersion.minutes_per_mile), snapshotted at insertion"
      - name: actual_miles
        type: number
        source: input
        description: "Odometer-derived miles the driver actually covered to reach this stop; supplied on the door-arrival action"
        constraints: ">= 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "PENDING on insertion; DELIVERED on door arrival; RELEASED when removed or recalled; REMADE when the delivered order is remade"
        default: PENDING
        constraints: "PENDING | DELIVERED | RELEASED | REMADE"
      - name: arrived_at
        type: datetime
        source: system
        description: "Logical-clock instant of door arrival; null before"
      - name: cash_collected_cents
        type: integer
        source: input
        description: "Cash taken at this door; supplied on the door-arrival action, required for CASH orders"
        default: 0

  - name: ReimbursementLine
    parent: Dispatch
    common_fields: true
    fields:
      - name: dispatch_id
        type: string
        source: system
        description: "FK -> Dispatch.id; route that produced the line"
      - name: driver_id
        type: string
        source: system
        description: "FK -> Driver.id; payee"
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; order the line is attributable to"
      - name: line_type
        type: enum
        source: system
        description: "PROVISIONAL_STOP written at door arrival on the ESTIMATED basis; ACTUAL_STOP written at settle on the ACTUAL basis; CLAWBACK written when a complaint remedy is charged back to the driver"
        constraints: "PROVISIONAL_STOP | ACTUAL_STOP | CLAWBACK"
      - name: basis
        type: enum
        source: system
        description: "Which variant of calculations.dispatch_reimbursement produced amount_cents"
        constraints: "ESTIMATED | ACTUAL | NONE"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount; negative only for CLAWBACK lines"
      - name: sequence_snapshot
        type: integer
        source: system
        description: "DispatchStop.sequence the line was computed for; 0 for CLAWBACK lines"
      - name: status
        type: enum
        source: system
        description: "PROVISIONAL until settle; ACCRUED once payable; SUPERSEDED when replaced by the ACTUAL_STOP line; VOIDED when the dispatch is recalled"
        constraints: "PROVISIONAL | ACCRUED | SUPERSEDED | VOIDED"

  - name: SafeDrop
    parent: Driver
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver dropping cash into the store safe"
      - name: amount_cents
        type: integer
        source: input
        description: "Cash moved from the driver to the safe"
        constraints: ">= 1"
      - name: envelope_number
        type: string
        source: input
        description: "Pre-printed drop envelope serial"
      - name: status
        type: enum
        source: system
        description: "RECORDED on creation; VOIDED when reversed inside the void window"
        default: RECORDED
        constraints: "RECORDED | VOIDED"
      - name: voided_reason
        type: string
        source: system
        description: "Reason recorded on the void; null while RECORDED"
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the void; null while RECORDED"

  - name: Complaint
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; delivered order the customer complained about"
      - name: category
        type: enum
        source: input
        description: "Complaint category driving the remedy formula"
        constraints: "LATE | FEE_DISCLOSURE | QUALITY | DRIVER_CONDUCT"
      - name: description
        type: string
        source: input
        description: "Verbatim customer statement"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 Complaint"
        default: OPEN
        constraints: "OPEN | REMEDY_PROPOSED | REMEDY_ISSUED | DISMISSED"
      - name: proposed_remedy_cents
        type: integer
        source: computed
        description: "Output of calculations.complaint_remedy; null while OPEN"
      - name: remedy_basis
        type: enum
        source: computed
        description: "Which branch of calculations.complaint_remedy produced proposed_remedy_cents"
        constraints: "LATE_TIER | FEE_REFUND | QUALITY_HALF | CONDUCT_ZERO | null"
      - name: driver_chargeable
        type: boolean
        source: input
        description: "True when the store charges the remedy back to the driver; supplied on the resolve action"
        default: false
      - name: clawback_cents
        type: integer
        source: computed
        description: "Absolute value of the CLAWBACK ReimbursementLine written when driver_chargeable is true; 0 otherwise"
        default: 0
      - name: logged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CustomerCareAgent who opened the complaint"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager who resolved the complaint; null while unresolved"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of resolution; null while unresolved"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ZoneVersion
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /store-ops/zone-versions/{zone_version_id}/activate"
        actor: StoreManager
        preconditions:
          - "zone_version.status == DRAFT"
          - "X-User-ID == zone_version.store_id (StoreManager owns the store)"
          - "polygon has >= 3 vertices"
        side_effects:
          - "sets status = ACTIVE and activated_at = logical clock"
          - "selects, among the same store's ZoneVersions with status == ACTIVE and effective_to <= this version's effective_from, the one with the greatest effective_to (tie-break created_at DESC); sets this version's supersedes_zone_version_id to it and sets that version's status = SUPERSEDED"
          - "when no such version exists, supersedes_zone_version_id stays null and nothing is superseded"
          - "increments Store.version by 1 (Store.active_zone_version_number is re-derived on read)"

  - entity: AddressDispute
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /store-ops/address-disputes/{address_dispute_id}/review with action == START_REVIEW"
        actor: StoreManager
        preconditions:
          - "dispute.status == SUBMITTED"
          - "X-User-ID == ServiceAddress.store_id of dispute.service_address_id"
        side_effects: ["sets reviewer_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /store-ops/address-disputes/{address_dispute_id}/review with action == REQUEST_INFO"
        actor: StoreManager
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "dispute.review_round_count < MAX_REVIEW_ROUNDS (2); otherwise ERR_DISPUTE_ROUND_LIMIT"
        side_effects:
          - "increments review_round_count by 1"
          - "sets reviewer_user_id = X-User-ID"
        note: "Cycle: INFO_REQUESTED returns to UNDER_REVIEW, capped at two rounds."
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /store-ops/address-disputes/{address_dispute_id}/review with action == START_REVIEW"
        actor: StoreManager
        preconditions: ["dispute.status == INFO_REQUESTED"]
        side_effects: ["sets reviewer_user_id = X-User-ID"]
        note: "Closes the revision loop; review_round_count is NOT decremented."
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /store-ops/address-disputes/{address_dispute_id}/review with action == GRANT"
        actor: StoreManager
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "granted_until supplied and granted_until > logical clock; otherwise ERR_INVALID_REQUEST"
        side_effects:
          - "sets status = GRANTED, resolution = GRANTED, decided_at = logical clock"
          - "CASCADE hop 1: sets ServiceAddress.override_state = IN_ZONE and ServiceAddress.override_until = granted_until, which flips ServiceAddress.effective_zone_state to IN_ZONE"
          - "CASCADE hop 2: because that address now reads effective_zone_state == IN_ZONE, every Order on that address with fulfillment_status == ZONE_HELD auto-transitions ZONE_HELD -> ZONE_CLEARED, processed in Order.created_at ASC order, each accruing zone_hold_minutes += floor((logical clock - Order.zone_held_at) / 60 seconds)"
          - "CASCADE hop 3: because those orders left ZONE_HELD they now match the unassigned filter, so Store.unassigned_order_count re-derives upward by the number of orders cleared in hop 2"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /store-ops/address-disputes/{address_dispute_id}/review with action == DENY"
        actor: StoreManager
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects:
          - "sets status = DENIED, resolution = DENIED, decided_at = logical clock"
          - "ServiceAddress.override_state and override_until are left null; held orders stay in ZONE_HELD"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /store-ops/address-disputes/{address_dispute_id}/review with action == WITHDRAW"
        actor: CustomerCareAgent
        preconditions: ["dispute.status == SUBMITTED"]
        side_effects: ["sets status = WITHDRAWN; the address becomes eligible for a fresh dispute"]

  - entity: Driver
    dimension: qualification_status
    initial_state: APPLICANT
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: APPLICANT
        to: PENDING_CHECKS
        trigger: "POST /store-ops/drivers/{driver_id}/mvr-checks with result IN {CLEAR, MINOR_VIOLATIONS}"
        actor: ComplianceOfficer
        preconditions: ["driver.qualification_status == APPLICANT"]
        side_effects:
          - "re-derives mvr_points_latest from the new check"
          - "increments Driver.version by 1"
      - from: PENDING_CHECKS
        to: QUALIFIED
        trigger: "POST /store-ops/drivers/{driver_id}/qualification-decisions with decision == QUALIFY"
        actor: ComplianceOfficer
        preconditions:
          - "driver.qualification_status == PENDING_CHECKS"
          - "newest MvrCheck result IN {CLEAR, MINOR_VIOLATIONS}"
          - "driver.mvr_points_latest <= MAX_MVR_POINTS (5); otherwise ERR_MVR_POINTS_EXCEEDED"
          - "driver.insurance_status == VERIFIED AND the newest VERIFIED InsuranceVerification satisfies coverage_from <= logical clock < coverage_to; otherwise ERR_INSURANCE_NOT_ACTIVE"
          - "X-User-ID != newest MvrCheck.recorded_by_user_id; otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets qualification_status = QUALIFIED and qualified_by_user_id = X-User-ID"
          - "increments Driver.version by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /store-ops/drivers/{driver_id}/qualification-decisions with decision == SUSPEND"
        actor: ComplianceOfficer
        preconditions: ["driver.qualification_status == QUALIFIED"]
        side_effects:
          - "sets qualification_status = SUSPENDED"
          - "increments Driver.version by 1"
          - "existing Dispatches are NOT recalled; the block is enforced at lock and depart time"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /store-ops/drivers/{driver_id}/qualification-decisions with decision == REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "driver.qualification_status == SUSPENDED"
          - "driver.mvr_points_latest <= MAX_MVR_POINTS (5)"
          - "driver.insurance_status == VERIFIED and coverage covers the logical clock"
          - "X-User-ID != newest MvrCheck.recorded_by_user_id"
        side_effects:
          - "sets qualification_status = QUALIFIED and qualified_by_user_id = X-User-ID"
          - "increments Driver.version by 1"
        note: "Cycle QUALIFIED -> SUSPENDED -> QUALIFIED; the driver may loop any number of times."
      - from: PENDING_CHECKS
        to: DISQUALIFIED
        trigger: "POST /store-ops/drivers/{driver_id}/mvr-checks with result == FAILED (system-triggered)"
        actor: system
        preconditions: ["driver.qualification_status IN {APPLICANT, PENDING_CHECKS, QUALIFIED, SUSPENDED}"]
        side_effects:
          - "sets qualification_status = DISQUALIFIED and disqualified_reason = 'MVR_FAILED'"
          - "CASCADE hop 2: because the driver is now DISQUALIFIED, every Dispatch of this driver with status IN {STACKED, LOCKED, EN_ROUTE} transitions to RECALLED with recalled_reason = 'DRIVER_DISQUALIFIED', processed in Dispatch.created_at ASC order"
          - "CASCADE hop 3: because those Dispatches are RECALLED, each of their DispatchStops with status == PENDING becomes RELEASED and the stop's Order transitions fulfillment_status ASSIGNED|EN_ROUTE -> READY, and each PROVISIONAL ReimbursementLine of those dispatches becomes VOIDED"
          - "CASCADE hop 4: because those Orders are back in READY they re-enter the unassigned filter, so Store.unassigned_order_count re-derives upward by the number of orders released in hop 3"
          - "increments Driver.version by 1"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /store-ops/drivers/{driver_id}/qualification-decisions with decision == DISQUALIFY"
        actor: ComplianceOfficer
        preconditions: ["driver.qualification_status IN {PENDING_CHECKS, QUALIFIED, SUSPENDED}"]
        side_effects:
          - "sets qualification_status = DISQUALIFIED and disqualified_reason = the supplied reason"
          - "same three cascade hops as the MVR-failure transition (dispatch recall, stop release plus order revert plus provisional voiding, unassigned-count re-derivation)"
          - "increments Driver.version by 1"

  - entity: Order
    dimension: fulfillment_status
    initial_state: PLACED
    terminal_states: [CLOSED, DECLINED_OUT_OF_AREA, CARRYOUT_REDIRECTED]
    transitions:
      - from: PLACED
        to: CARRYOUT_REDIRECTED
        trigger: "POST /store-ops/orders (system-triggered at creation when Store.service_posture == CARRYOUT_ONLY)"
        actor: system
        preconditions: ["store.service_posture == CARRYOUT_ONLY"]
        side_effects:
          - "sets fulfillment_status = CARRYOUT_REDIRECTED and declined_reason = 'STORE_CARRYOUT_ONLY'"
          - "sets settlement_status = VOIDED"
        note: "Delivery pricing fields are still computed so the ticket shows what the fee would have been."
      - from: PLACED
        to: ZONE_CLEARED
        trigger: "POST /store-ops/orders/{order_id}/zone-decision with action == CLEAR"
        actor: Dispatcher
        preconditions:
          - "order.fulfillment_status == PLACED"
          - "store.service_posture == OPEN; otherwise ERR_STORE_NOT_ACCEPTING_DELIVERY"
          - "a ZoneVersion with status == ACTIVE whose [effective_from, effective_to) contains the logical clock exists for the store; otherwise ERR_NO_ACTIVE_ZONE_VERSION"
          - "ServiceAddress.effective_zone_state == IN_ZONE; otherwise ERR_ADDRESS_OUT_OF_AREA"
        side_effects: ["re-derives Store.unassigned_order_count on read"]
      - from: PLACED
        to: ZONE_HELD
        trigger: "POST /store-ops/orders/{order_id}/zone-decision with action == HOLD"
        actor: Dispatcher
        preconditions:
          - "order.fulfillment_status == PLACED"
          - "ServiceAddress.effective_zone_state IN {EDGE, OUT_OF_ZONE}; otherwise ERR_ZONE_HOLD_NOT_APPLICABLE"
        side_effects: ["sets zone_held_at = logical clock"]
      - from: ZONE_HELD
        to: ZONE_CLEARED
        trigger: "POST /store-ops/orders/{order_id}/zone-decision with action == CLEAR, or the GRANTED-dispute cascade"
        actor: Dispatcher
        preconditions:
          - "order.fulfillment_status == ZONE_HELD"
          - "ServiceAddress.effective_zone_state == IN_ZONE, which for a held edge address requires a GRANTED AddressDispute whose granted_until > logical clock; otherwise ERR_ADDRESS_OUT_OF_AREA"
        side_effects:
          - "accrues zone_hold_minutes += floor((logical clock - zone_held_at) / 60 seconds)"
          - "re-derives Store.unassigned_order_count on read"
      - from: ZONE_HELD
        to: DECLINED_OUT_OF_AREA
        trigger: "POST /store-ops/orders/{order_id}/zone-decision with action == DECLINE"
        actor: Dispatcher
        preconditions:
          - "order.fulfillment_status IN {PLACED, ZONE_HELD}"
          - "ServiceAddress.effective_zone_state IN {EDGE, OUT_OF_ZONE}; otherwise ERR_DECLINE_NOT_APPLICABLE"
        side_effects:
          - "accrues zone_hold_minutes += floor((logical clock - zone_held_at) / 60 seconds) when zone_held_at is not null"
          - "sets declined_reason = 'OUT_OF_AREA' when zone_state == OUT_OF_ZONE, else 'DRIVE_TIME_EXCEEDED'"
          - "sets settlement_status = VOIDED"
      - from: ZONE_HELD
        to: CARRYOUT_REDIRECTED
        trigger: "POST /store-ops/orders/{order_id}/zone-decision with action == REDIRECT_CARRYOUT"
        actor: Dispatcher
        preconditions:
          - "order.fulfillment_status IN {PLACED, ZONE_HELD}"
          - "ServiceAddress.effective_zone_state IN {EDGE, OUT_OF_ZONE}"
        side_effects:
          - "accrues zone_hold_minutes when zone_held_at is not null"
          - "sets declined_reason = 'DRIVE_TIME_EXCEEDED' and settlement_status = VOIDED"
      - from: ZONE_CLEARED
        to: IN_PRODUCTION
        trigger: "POST /store-ops/orders/{order_id}/production with action == START"
        actor: Dispatcher
        preconditions: ["order.fulfillment_status IN {ZONE_CLEARED, REMAKE_QUEUED}"]
        side_effects: []
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /store-ops/orders/{order_id}/production with action == READY"
        actor: Dispatcher
        preconditions: ["order.fulfillment_status == IN_PRODUCTION"]
        side_effects: ["sets ready_at = logical clock"]
      - from: READY
        to: ASSIGNED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/stops (system-triggered by stop insertion)"
        actor: system
        preconditions:
          - "order.fulfillment_status == READY; otherwise ERR_ORDER_NOT_READY"
          - "order.settlement_status != VOIDED"
          - "no DispatchStop with status == PENDING already references this order; otherwise ERR_ORDER_ALREADY_STACKED"
        side_effects: ["the new DispatchStop is created with status PENDING, which raises Dispatch.committed_hot_bag_slots and Dispatch.stop_count"]
      - from: ASSIGNED
        to: READY
        trigger: "DELETE /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}, or the RECALLED cascade (system-triggered)"
        actor: system
        preconditions: ["order.fulfillment_status IN {ASSIGNED, EN_ROUTE}"]
        side_effects:
          - "the DispatchStop becomes RELEASED, which lowers Dispatch.committed_hot_bag_slots and Dispatch.stop_count back to their pre-insertion values"
        note: "Compensating transition for the READY -> ASSIGNED forward action; the hot-bag slot pool must return to its pre-insertion total."
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /store-ops/dispatches/{dispatch_id}/depart (system-triggered)"
        actor: system
        preconditions: ["dispatch.status == LOCKED", "order.fulfillment_status == ASSIGNED"]
        side_effects: []
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival"
        actor: Driver
        preconditions:
          - "dispatch.status == EN_ROUTE"
          - "stop.status == PENDING"
          - "order.fulfillment_status == EN_ROUTE"
        side_effects:
          - "sets door_arrival_at = logical clock and computes order_to_door_gross_minutes and order_to_door_net_minutes"
          - "CASCADE hop 2: because the order reached DELIVERED, its settlement dimension advances DISCLOSED -> CHARGED and cash_collected_cents is fixed"
          - "CASCADE hop 3: because the order became CHARGED with payment_method == CASH, Driver.cash_on_hand_cents and Store.cash_collected_total_cents both rise by total_charge_cents (Driver.version and Store.version each increment by 1)"
          - "CASCADE hop 4: because Driver.cash_on_hand_cents rose, Driver.cash_posture is re-derived and flips to DROP_REQUIRED once cash_on_hand_cents >= Store.cash_limit_cents, which blocks the next depart"
          - "writes one PROVISIONAL_STOP ReimbursementLine with basis ESTIMATED, status PROVISIONAL and amount_cents equal to this stop's ESTIMATED-variant stop total"
      - from: DELIVERED
        to: REMAKE_QUEUED
        trigger: "POST /store-ops/orders/{order_id}/remake"
        actor: StoreManager
        preconditions:
          - "order.fulfillment_status == DELIVERED"
          - "order.remake_count < MAX_REMAKES (1); otherwise ERR_REMAKE_LIMIT_REACHED"
          - "when reason == LATE: order_to_door_gross_minutes > promise_minutes_snapshot + REMAKE_GRACE_MINUTES (5); otherwise ERR_REMAKE_NOT_ELIGIBLE"
        side_effects:
          - "accrues remake_hold_minutes += floor((logical clock - door_arrival_at) / 60 seconds), then sets door_arrival_at = null and clears order_to_door_gross_minutes and order_to_door_net_minutes"
          - "increments remake_count by 1 and sets remake_credit_cents += food_subtotal_cents"
          - "the delivered DispatchStop becomes REMADE"
          - "advances the settlement dimension CHARGED -> ADJUSTED"
        note: "Cycle: REMAKE_QUEUED re-enters IN_PRODUCTION via the production START action."
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/settle (system-triggered)"
        actor: system
        preconditions: ["order.fulfillment_status == DELIVERED", "dispatch.status == RETURNED"]
        side_effects: ["advances the settlement dimension CHARGED|ADJUSTED -> CLOSED_SETTLED"]

  - entity: Order
    dimension: settlement_status
    initial_state: UNDISCLOSED
    terminal_states: [CLOSED_SETTLED, VOIDED]
    transitions:
      - from: UNDISCLOSED
        to: DISCLOSED
        trigger: "POST /store-ops/orders/{order_id}/disclose-fee"
        actor: CustomerCareAgent
        preconditions:
          - "order.settlement_status == UNDISCLOSED"
          - "order.fulfillment_status NOT IN {DECLINED_OUT_OF_AREA, CARRYOUT_REDIRECTED, CLOSED}"
        side_effects:
          - "records disclosed_fee_cents, disclosed_tip_cents, driver_tip_notice_given and sets fee_disclosed_at = logical clock"
          - "computes fee_disclosure_accurate"
        note: "Independent of the fulfillment dimension: disclosure may happen while the order is PLACED, ZONE_CLEARED, IN_PRODUCTION or READY."
      - from: DISCLOSED
        to: CHARGED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival (system-triggered)"
        actor: system
        preconditions: ["order.settlement_status == DISCLOSED"]
        side_effects: ["fixes cash_collected_cents (total_charge_cents for CASH, 0 for CARD)"]
      - from: CHARGED
        to: ADJUSTED
        trigger: "POST /store-ops/orders/{order_id}/remake, or POST /store-ops/complaints/{complaint_id}/resolve with action == APPROVE (system-triggered)"
        actor: system
        preconditions: ["order.settlement_status IN {CHARGED, ADJUSTED, CLOSED_SETTLED}"]
        note: "ADJUSTED -> ADJUSTED is a legal self-loop: a second approved complaint re-adjusts an already-adjusted ticket, drawing down the remaining refundable balance (priority 41)."
        side_effects: ["raises remedy_issued_cents or remake_credit_cents on the order"]
      - from: CHARGED
        to: CLOSED_SETTLED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/settle (system-triggered)"
        actor: system
        preconditions: ["order.settlement_status IN {CHARGED, ADJUSTED}"]
        side_effects: []
      - from: UNDISCLOSED
        to: VOIDED
        trigger: "POST /store-ops/orders/{order_id}/zone-decision with action IN {DECLINE, REDIRECT_CARRYOUT}, or creation under CARRYOUT_ONLY posture (system-triggered)"
        actor: system
        preconditions: ["order.settlement_status IN {UNDISCLOSED, DISCLOSED}"]
        side_effects: ["no money moves; the ticket is closed out unbilled"]

  - entity: Dispatch
    dimension: status
    initial_state: DRAFT
    terminal_states: [SETTLED, RECALLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: STACKED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/stops (first stop inserted)"
        actor: Dispatcher
        preconditions:
          - "dispatch.status IN {DRAFT, STACKED}"
          - "dispatch.stop_count + 1 <= Store.max_stacked_stops of the driver's store; otherwise ERR_STACK_LIMIT_EXCEEDED"
          - "the referenced Order belongs to the driver's store; otherwise ERR_ORDER_STORE_MISMATCH"
          - "the referenced Order has fulfillment_status == READY; otherwise ERR_ORDER_NOT_READY"
        side_effects:
          - "creates a DispatchStop with status PENDING, sequence = (count of ALL stops ever created on this dispatch, any status) + 1, planned_miles and planned_drive_minutes snapshotted from the order's ServiceAddress"
          - "the stop's Order transitions READY -> ASSIGNED"
          - "raises Dispatch.committed_hot_bag_slots by the stop's hot_bag_slots"
      - from: STACKED
        to: DRAFT
        trigger: "DELETE /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id} (last remaining stop removed)"
        actor: Dispatcher
        preconditions:
          - "dispatch.status == STACKED"
          - "stop.status == PENDING"
        side_effects:
          - "the stop becomes RELEASED and its Order transitions ASSIGNED -> READY"
          - "lowers Dispatch.committed_hot_bag_slots by the stop's hot_bag_slots; when stop_count reaches 0 the dispatch returns to DRAFT"
        note: "Compensating transition for DRAFT -> STACKED; slot commitment and order state both return to their pre-insertion values."
      - from: STACKED
        to: LOCKED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/lock"
        actor: Dispatcher
        preconditions:
          - "dispatch.status IN {DRAFT, STACKED}"
          - "dispatch.stop_count >= 1; otherwise ERR_DISPATCH_HAS_NO_STOPS"
          - "driver.qualification_status == QUALIFIED; otherwise ERR_DRIVER_NOT_QUALIFIED"
          - "the driver's newest VERIFIED InsuranceVerification satisfies coverage_from <= planned_depart_at < coverage_to; otherwise ERR_INSURANCE_NOT_ACTIVE"
          - "every stop's Order has settlement_status IN {DISCLOSED, CHARGED}; otherwise ERR_FEE_NOT_DISCLOSED"
          - "the driver's occupation interval [planned_depart_at, expected_return_at + Store.dispatch_reset_buffer_minutes] (CLOSED at both ends) does not intersect the same interval of any other Dispatch of this driver with status IN {LOCKED, EN_ROUTE}; otherwise ERR_DRIVER_WINDOW_CONFLICT"
          - "the sum of committed_hot_bag_slots over the store's Dispatches with status IN {LOCKED, EN_ROUTE} whose HALF-OPEN reservation window [planned_depart_at, expected_return_at) intersects this dispatch's window, plus this dispatch's committed_hot_bag_slots, is <= Store.hot_bag_count; otherwise ERR_HOT_BAG_CAPACITY_EXCEEDED"
          - "the cost-model selector resolves to exactly one VehicleCostModel; otherwise ERR_NO_COST_MODEL"
        side_effects:
          - "computes route_minutes and expected_return_at per calculations.route_duration_model"
          - "snapshots resolved_cost_model_id from calculations.cost_model_selection"
          - "computes estimated_reimbursement_cents via the ESTIMATED variant of calculations.dispatch_reimbursement"
          - "reserves the driver's occupation interval and the store's hot-bag slots"
      - from: LOCKED
        to: STACKED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/unlock"
        actor: Dispatcher
        preconditions: ["dispatch.status == LOCKED"]
        side_effects:
          - "clears route_minutes, expected_return_at, resolved_cost_model_id and estimated_reimbursement_cents back to null"
          - "releases the driver occupation interval and the store hot-bag reservation"
        note: "Cycle STACKED <-> LOCKED; stops may be added or removed again after unlocking."
      - from: LOCKED
        to: EN_ROUTE
        trigger: "POST /store-ops/dispatches/{dispatch_id}/depart"
        actor: Driver
        preconditions:
          - "dispatch.status == LOCKED; otherwise ERR_INVALID_DISPATCH_STATE"
          - "X-User-ID == dispatch.driver_id when acting as Driver"
          - "driver.qualification_status == QUALIFIED; otherwise ERR_DRIVER_NOT_QUALIFIED"
          - "the driver's newest VERIFIED InsuranceVerification covers the logical clock; otherwise ERR_INSURANCE_NOT_ACTIVE"
          - "driver.cash_on_hand_cents < Store.cash_limit_cents (equivalently cash_posture == CLEAR); otherwise ERR_CASH_LIMIT_REACHED"
        side_effects:
          - "sets departed_at = logical clock"
          - "every PENDING stop's Order transitions ASSIGNED -> EN_ROUTE"
      - from: EN_ROUTE
        to: RETURNED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/return"
        actor: Driver
        preconditions:
          - "dispatch.status == EN_ROUTE"
          - "every DispatchStop of this dispatch has status IN {DELIVERED, RELEASED, REMADE}; otherwise ERR_STOPS_OUTSTANDING"
        side_effects:
          - "sets returned_at = logical clock"
          - "releases the store's hot-bag reservation for this dispatch (committed_hot_bag_slots re-derives to 0)"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/settle"
        actor: StoreManager
        preconditions:
          - "dispatch.status == RETURNED; otherwise ERR_INVALID_DISPATCH_STATE"
          - "X-User-ID == the driver's store_id"
          - "every stop's odometer reading is present, i.e. every DELIVERED or REMADE stop has actual_miles not null; otherwise ERR_ODOMETER_MISSING"
        side_effects:
          - "computes actual_reimbursement_cents via the ACTUAL variant of calculations.dispatch_reimbursement and reimbursement_variance_cents = actual - estimated"
          - "every PROVISIONAL_STOP ReimbursementLine of this dispatch becomes SUPERSEDED"
          - "writes one ACTUAL_STOP ReimbursementLine per DELIVERED or REMADE stop with basis ACTUAL and status ACCRUED"
          - "CASCADE: because those ACCRUED lines now exist, Driver.reimbursement_accrued_cents re-derives upward by actual_reimbursement_cents and Driver.version increments by 1"
          - "every DELIVERED Order transitions fulfillment DELIVERED -> CLOSED and settlement CHARGED|ADJUSTED -> CLOSED_SETTLED"
      - from: EN_ROUTE
        to: RECALLED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/recall, or the driver-disqualification cascade (system-triggered)"
        actor: StoreManager
        preconditions:
          - "dispatch.status IN {STACKED, LOCKED, EN_ROUTE}"
        side_effects:
          - "sets recalled_reason and releases the driver occupation interval and hot-bag reservation"
          - "every PENDING DispatchStop becomes RELEASED and its Order transitions ASSIGNED|EN_ROUTE -> READY"
          - "DELIVERED stops keep their status and the cash already collected stays on the driver"
          - "every PROVISIONAL_STOP ReimbursementLine of this dispatch becomes VOIDED; no ACTUAL_STOP line is ever written, so Driver.reimbursement_accrued_cents is unchanged by a recall"
        note: "Divergent branch from EN_ROUTE: RETURNED preserves stop commitments for settlement while RECALLED reverses them and pays nothing."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /store-ops/dispatches/{dispatch_id}/recall on a stop-free draft"
        actor: StoreManager
        preconditions: ["dispatch.status == DRAFT", "dispatch.stop_count == 0"]
        side_effects: ["sets recalled_reason; nothing to release"]

  - entity: Complaint
    dimension: status
    initial_state: OPEN
    terminal_states: [REMEDY_ISSUED, DISMISSED]
    transitions:
      - from: OPEN
        to: REMEDY_PROPOSED
        trigger: "POST /store-ops/complaints/{complaint_id}/propose-remedy"
        actor: CustomerCareAgent
        preconditions:
          - "complaint.status == OPEN"
          - "the order's fulfillment_status IN {DELIVERED, REMAKE_QUEUED, CLOSED}"
        side_effects: ["computes proposed_remedy_cents and remedy_basis per calculations.complaint_remedy"]
      - from: REMEDY_PROPOSED
        to: OPEN
        trigger: "POST /store-ops/complaints/{complaint_id}/resolve with action == REJECT"
        actor: StoreManager
        preconditions: ["complaint.status == REMEDY_PROPOSED"]
        side_effects:
          - "clears proposed_remedy_cents and remedy_basis back to null and sets resolved_by_user_id = null"
        note: "Cycle: the agent may re-propose after a manager rejection, any number of times."
      - from: REMEDY_PROPOSED
        to: REMEDY_ISSUED
        trigger: "POST /store-ops/complaints/{complaint_id}/resolve with action == APPROVE"
        actor: StoreManager
        preconditions:
          - "complaint.status == REMEDY_PROPOSED"
          - "X-User-ID == the order's store_id"
          - "proposed_remedy_cents <= order.total_charge_cents - order.remedy_issued_cents (the remaining refundable balance); otherwise ERR_REMEDY_EXCEEDS_TOTAL"
          - "when driver_chargeable is true, the order's settling Dispatch has status == SETTLED; otherwise ERR_CLAWBACK_NOT_SETTLED"
        side_effects:
          - "sets resolved_at, resolved_by_user_id and raises Order.remedy_issued_cents by proposed_remedy_cents"
          - "advances the order's settlement dimension CHARGED|ADJUSTED|CLOSED_SETTLED -> ADJUSTED"
          - "when driver_chargeable is true: writes a CLAWBACK ReimbursementLine with basis NONE, status ACCRUED, sequence_snapshot 0 and amount_cents = -(the ACTUAL_STOP line amount for this order), sets clawback_cents to its absolute value, and re-derives Driver.reimbursement_accrued_cents downward by the same amount (Driver.version increments by 1)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /store-ops/complaints/{complaint_id}/resolve with action == DISMISS"
        actor: StoreManager
        preconditions: ["complaint.status == OPEN"]
        side_effects: ["sets resolved_at and resolved_by_user_id; no money moves"]

  - entity: SafeDrop
    dimension: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /store-ops/safe-drops/{safe_drop_id}/void"
        actor: StoreManager
        preconditions:
          - "safe_drop.status == RECORDED"
          - "(logical clock - safe_drop.created_at) < SAFE_DROP_VOID_WINDOW_MINUTES (60), measured in whole seconds; otherwise ERR_SAFE_DROP_NOT_VOIDABLE"
        side_effects:
          - "sets voided_reason and voided_at"
          - "raises Driver.cash_on_hand_cents by amount_cents and lowers Store.safe_deposit_total_cents by amount_cents (Driver.version and Store.version each increment by 1)"
        note: "Compensating transition for the safe-drop creation; the cash-conservation identity must hold before and after."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: zone-version-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /store-ops/zone-versions"
    occ_field: "expected_store_version"
    description: |
      Publishing a new delivery-area version against a Store whose version has
      advanced since the client last read it is rejected. A ZoneVersion
      legitimately supersedes the prior one on activation, so a writer holding
      a stale view of the store would silently publish a polygon derived from
      an outdated fee, posture and zone lineage.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412

  - rule_id: insurance-verification-create-stale-driver
    parent_entity: Driver
    write_endpoint: "POST /store-ops/drivers/{driver_id}/insurance-verifications"
    occ_field: "expected_driver_version"
    description: |
      Filing an insurance verification against a Driver whose version has
      advanced since the client last read it is rejected. A new verification
      legitimately supersedes the prior VERIFIED one and rewrites
      Driver.insurance_status, so a writer holding a stale view would supersede
      a policy it never saw.
    error_id: ERR_STALE_DRIVER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# All money is integer cents. All mileage is a number with exactly 2 decimal
# places, produced by round_half_up. Geometry is integer micro-degrees only —
# no floating-point trigonometry appears anywhere, so every geometric decision
# is bit-reproducible. Where a formula composes several steps, the evaluation
# ORDER is pinned in the formula body and is itself observable.
# =============================================================================
calculations:

  - name: grid_distance_miles
    description: |
      Rectilinear ("Manhattan grid") distance from the store origin to a service
      address, in miles. Pizza delivery mileage is reimbursed on street distance,
      and the store models streets as an axis-aligned grid, so the two axis
      deltas are ADDED, never combined by Pythagoras.
    trigger: "POST /store-ops/service-addresses (at address creation, and only then)"
    inputs:
      - "Store.latitude_micro, Store.longitude_micro (origin)"
      - "ServiceAddress.latitude_micro, ServiceAddress.longitude_micro"
    algorithm: aggregation
    formula: |
      d_lat_micro = abs(address.latitude_micro  - store.latitude_micro)
      d_lng_micro = abs(address.longitude_micro - store.longitude_micro)
      raw_miles   = (d_lat_micro + d_lng_micro) / MICRO_PER_MILE
      grid_miles  = round_half_up(raw_miles, 2)
    constants:
      MICRO_PER_MILE: 15000
    precision: "grid_miles: 2 decimal places, round_half_up"
    worked_examples:
      - "store (39000000, -84000000), address (39030000, -84015000): (30000 + 15000) / 15000 = 3.00"
      - "address (39090000, -84045000): (90000 + 45000) / 15000 = 9.00"
      - "address (39094950, -84000000): 94950 / 15000 = 6.33"
      - "address (39095100, -84000000): 95100 / 15000 = 6.34"
      - "address (39400000, -84000000): 400000 / 15000 = 26.6666... -> 26.67"

  - name: drive_time_estimate
    description: |
      Modelled minutes from the oven rack to the customer's door. Composed of a
      fixed base allowance, a per-mile term rounded UP to whole minutes, and a
      single surcharge that is the MAXIMUM of the peak-hour and barrier
      surcharges — the two surcharges do NOT add, because a driver crossing a
      river at dinner rush is delayed once, not twice.
    trigger: "POST /store-ops/service-addresses (evaluated against the ZoneVersion in force at the logical clock)"
    inputs:
      - "ServiceAddress.grid_miles, ServiceAddress.crosses_barrier"
      - "in-force ZoneVersion.base_drive_minutes, .minutes_per_mile, .peak_surcharge_minutes, .barrier_surcharge_minutes"
      - "the logical clock (its UTC hour selects the peak surcharge)"
    algorithm: threshold
    formula: |
      # STEP 1 - surcharge selection (MAX, not SUM)
      peak_applies    = hour_utc(logical_clock) IN PEAK_HOURS_UTC
      peak_component  = peak_surcharge_minutes    if peak_applies            else 0
      barrier_comp    = barrier_surcharge_minutes if address.crosses_barrier else 0
      surcharge       = max(peak_component, barrier_comp)

      # STEP 2 - per-mile term, rounded UP to a whole minute
      mileage_minutes = ceil(grid_miles * minutes_per_mile)

      # STEP 3 - total
      drive_time_estimate_minutes = base_drive_minutes + mileage_minutes + surcharge
    constants:
      PEAK_HOURS_UTC: [17, 18, 19, 20]
    precision: "whole minutes; ceil applied to the mileage term only, never to the total"
    worked_examples:
      - "grid 3.00, base 6, mpm 3, off-peak, no barrier: 6 + ceil(9.00) + 0 = 15"
      - "grid 9.00, same model: 6 + ceil(27.00) + 0 = 33"
      - "grid 6.33: 6 + ceil(18.99) + 0 = 6 + 19 = 25 (exactly at the default ceiling)"
      - "grid 6.34: 6 + ceil(19.02) + 0 = 6 + 20 = 26 (one minute over the ceiling)"
      - "grid 3.00 at 18:00 UTC with crosses_barrier true, peak 7, barrier 4: 6 + 9 + max(7,4) = 22"

  - name: zone_state_classification
    description: |
      Classifies a service address against the in-force delivery-area polygon.
      Geometry first, then drive time: an address outside the ring is
      OUT_OF_ZONE no matter how close it is, an address inside the ring but past
      the drive-time ceiling is EDGE (disputable, carryout-redirectable), and an
      address inside the ring within the ceiling is IN_ZONE.
    trigger: "POST /store-ops/service-addresses"
    inputs:
      - "ServiceAddress.latitude_micro, .longitude_micro"
      - "in-force ZoneVersion.polygon, .max_drive_time_minutes"
      - "ServiceAddress.drive_time_estimate_minutes (from drive_time_estimate)"
    algorithm: threshold
    formula: |
      # STEP 1 - point-in-polygon by integer ray casting.
      #   Treat longitude_micro as x and latitude_micro as y. The ring closes
      #   implicitly from the last vertex back to the first. All arithmetic is
      #   integer; there is no epsilon and no floating point.
      #   A point lying EXACTLY ON an edge or vertex counts as INSIDE.
      inside = false
      for each edge (a, b) in closed_ring(polygon):
          if point lies exactly on segment (a, b):        # collinear and within bbox
              inside = true; break
          if (a.y > p.y) != (b.y > p.y):
              # x of the edge at height p.y, compared without division:
              lhs = (p.x - a.x) * (b.y - a.y)
              rhs = (b.x - a.x) * (p.y - a.y)
              if (b.y > a.y and lhs < rhs) or (b.y < a.y and lhs > rhs):
                  inside = not inside

      # STEP 2 - drive-time ceiling, INCLUSIVE at the boundary
      if not inside:
          zone_state = OUT_OF_ZONE
      elif drive_time_estimate_minutes <= max_drive_time_minutes:
          zone_state = IN_ZONE
      else:
          zone_state = EDGE

      # STEP 3 - effective state, re-derived on every read
      effective_zone_state = override_state
          if (override_state is not null and override_until > logical_clock)
          else zone_state
    constants: {}
    precision: "integer micro-degree arithmetic; no tolerance band"
    worked_examples:
      - "ring [(38900000,-84200000),(39200000,-84200000),(39200000,-83800000),(38900000,-83800000)], point (39030000,-84015000), drive 15, ceiling 25 -> inside, 15 <= 25 -> IN_ZONE"
      - "same ring, point (39094950,-84000000), drive exactly 25, ceiling 25 -> IN_ZONE (the ceiling is inclusive)"
      - "same ring, point (39095100,-84000000), drive 26, ceiling 25 -> EDGE"
      - "same ring, point (38900000,-84000000) lies exactly on the south edge -> counted INSIDE; drive 27 > 25 -> EDGE (never OUT_OF_ZONE)"
      - "same ring, point (39400000,-84000000) is north of the ring -> OUT_OF_ZONE regardless of its drive time of 87"
      - "CEILING 40 VARIANT (the model most design instances use): point (39169950,-84000000) is grid 11.33, drive 6 + ceil(33.99) = 40, exactly at the ceiling -> IN_ZONE"
      - "CEILING 40 VARIANT: point (39170100,-84000000) is grid 11.34, drive 6 + ceil(34.02) = 41, one minute over -> EDGE"

  - name: customer_delivery_charge
    description: |
      Prices the customer-facing delivery fee and the order total. Three
      independent inputs are consulted in a PINNED ORDER, and the order matters:
      the drive-time tier raises the fee, then the food-subtotal waiver reduces
      the RAISED fee. Applying the waiver to the un-surcharged base fee, or
      including the tip in the waiver test, produces different money.
    trigger: "POST /store-ops/orders (at order creation, from the address snapshot)"
    inputs:
      - "ServiceAddress.drive_time_estimate_minutes of the order's address"
      - "Store.delivery_fee_cents"
      - "Order.food_subtotal_cents, Order.tip_cents"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - fee tier from the address drive-time estimate
      if   drive_time_estimate_minutes <= TIER_BASE_MAX_MINUTES: fee_tier = BASE
      elif drive_time_estimate_minutes <= TIER_MID_MAX_MINUTES:  fee_tier = MID
      else:                                                      fee_tier = FAR

      # STEP 2 - surcharge the base fee (BEFORE any waiver)
      base_delivery_fee_cents = store.delivery_fee_cents + TIER_SURCHARGE_CENTS[fee_tier]

      # STEP 3 - waiver percentage, keyed on food_subtotal_cents ALONE
      #          (the tip never counts toward the waiver threshold)
      if   food_subtotal_cents >= WAIVER_FULL_THRESHOLD_CENTS: fee_waiver_pct = 100
      elif food_subtotal_cents >= WAIVER_HALF_THRESHOLD_CENTS: fee_waiver_pct = 50
      else:                                                    fee_waiver_pct = 0

      # STEP 4 - charged fee: waiver applied to the SURCHARGED base
      delivery_fee_cents = round_half_up(
          base_delivery_fee_cents * (100 - fee_waiver_pct) / 100, 0)

      # STEP 5 - ticket total
      total_charge_cents = food_subtotal_cents + delivery_fee_cents + tip_cents
    constants:
      TIER_BASE_MAX_MINUTES: 15
      TIER_MID_MAX_MINUTES: 25
      TIER_SURCHARGE_CENTS: { BASE: 0, MID: 150, FAR: 350 }
      WAIVER_HALF_THRESHOLD_CENTS: 2000
      WAIVER_FULL_THRESHOLD_CENTS: 3000
    precision: "integer cents; round_half_up on STEP 4 only"
    worked_examples:
      - "drive 15, store fee 399, food 2200, tip 500 -> BASE, base 399, pct 50, fee round_half_up(199.5)=200, total 2900"
      - "drive 15, food 1900, tip 0 -> pct 0, fee 399, total 2299"
      - "drive 33, food 2600, tip 300 -> FAR, base 749, pct 50, fee round_half_up(374.5)=375, total 3275"
      - "drive 25, food 3000, tip 700 -> MID, base 549, pct 100, fee 0, total 3700"
      - "drive 25, food 2000, tip 0 -> MID, base 549, pct 50, fee round_half_up(274.5)=275, total 2275"
      - "drive 15, food 100, tip 0 -> BASE, pct 0, fee 399, total 499"

  - name: cost_model_selection
    description: |
      Picks the single VehicleCostModel that prices a dispatch, snapshotted onto
      Dispatch.resolved_cost_model_id at lock time so that later schedule
      publications cannot retro-price a route already on the road.
    trigger: "POST /store-ops/dispatches/{dispatch_id}/lock"
    inputs:
      - "Driver.store_id, Driver.vehicle_class"
      - "Dispatch.planned_depart_at"
      - "all VehicleCostModel rows of the store"
    algorithm: chronological
    formula: |
      eligible = [ m for m in VehicleCostModel
                   if m.store_id      == driver.store_id
                   and m.vehicle_class == driver.vehicle_class
                   and m.status        == ACTIVE
                   and m.effective_from <= dispatch.planned_depart_at ]
      if eligible is empty: raise ERR_NO_COST_MODEL (422)
      rank eligible by effective_from DESC, then created_at DESC
      resolved_cost_model_id = eligible[0].id
    constants: {}
    precision: "exact selection; ties broken by created_at, never by id"

  - name: route_duration_model
    description: |
      Round-trip minutes for a stacked route: the driver drives to each stop in
      sequence, spends a flat handoff allowance at each door, and then drives
      home from the LAST stop. The return leg is modelled as the last stop's
      outbound leg, so removing the final stop shortens the route twice over.
    trigger: "POST /store-ops/dispatches/{dispatch_id}/lock"
    inputs:
      - "every counted DispatchStop's planned_miles, in sequence ASC"
      - "in-force ZoneVersion.minutes_per_mile"
      - "Store.handoff_minutes_per_stop"
      - "Dispatch.stop_count"
    algorithm: aggregation
    formula: |
      counted = stops with status IN {PENDING, DELIVERED, REMADE}, ordered by sequence ASC
      outbound = sum( ceil(s.planned_miles * minutes_per_mile) for s in counted )
      handoff  = store.handoff_minutes_per_stop * len(counted)
      home_leg = ceil( counted[-1].planned_miles * minutes_per_mile )
      route_minutes       = outbound + handoff + home_leg
      expected_return_at  = planned_depart_at + route_minutes minutes
    constants: {}
    precision: "whole minutes; ceil per leg BEFORE summation"
    worked_examples:
      - "1 stop 3.00 mi, mpm 3, handoff 6: 9 + 6 + 9 = 24"
      - "2 stops 3.00 + 3.00: (9+9) + 12 + 9 = 39"
      - "3 stops 3.00 + 3.00 + 9.00: (9+9+27) + 18 + 27 = 90"

  - name: dispatch_reimbursement
    description: |
      What the store owes the driver for a route. Each stop earns a flat
      per-delivery amount plus mileage priced through a CUMULATIVE two-tier
      waterfall: the tier-1 cap is consumed across the whole dispatch in
      sequence order, so the same mile costs a different rate depending on which
      stop it falls on. Each stop's per_delivery + mileage subtotal is rounded
      to whole cents and floored at the per-stop minimum BEFORE the stops are
      summed — rounding the dispatch total once at the end gives different money.
    trigger: |
      ESTIMATED at POST /store-ops/dispatches/{dispatch_id}/lock (frozen onto
      estimated_reimbursement_cents) and per-stop at door-arrival (the
      PROVISIONAL_STOP line); ACTUAL at POST /store-ops/dispatches/{dispatch_id}/settle.
    inputs:
      - "the resolved VehicleCostModel: per_delivery_cents, tier1_cap_miles, tier1_per_mile_cents, tier2_per_mile_cents, min_reimbursement_per_stop_cents"
      - "each DispatchStop's planned_miles (ESTIMATED) or actual_miles (ACTUAL), in sequence ASC"
    algorithm: waterfall_allocation
    formula: |
      # Input set depends on the variant (see `variants` below).
      cumulative = 0.00
      total      = 0
      for s in input_stops ordered by sequence ASC:          # ORDER IS OBSERVABLE
          m            = s.miles_for_variant                 # planned_miles | actual_miles
          tier1_room   = max(0.00, tier1_cap_miles - cumulative)
          tier1_miles  = min(m, tier1_room)
          tier2_miles  = m - tier1_miles
          mileage_raw  = tier1_miles * tier1_per_mile_cents
                       + tier2_miles * tier2_per_mile_cents  # exact, not yet rounded
          stop_raw     = per_delivery_cents + mileage_raw
          stop_cents   = round_half_up(stop_raw, 0)           # ROUND PER STOP ...
          stop_cents   = max(stop_cents, min_reimbursement_per_stop_cents)  # ... THEN FLOOR
          total        = total + stop_cents                   # ... THEN SUM
          cumulative   = cumulative + m
      return total
    constants: {}
    precision: |
      Miles carry 2 decimal places. mileage_raw is computed exactly (cents may be
      fractional at this point). round_half_up to whole cents happens ONCE PER
      STOP, before the per-stop minimum and before summation.
    variants:
      - name: ESTIMATED
        when: "at lock, and for each PROVISIONAL_STOP line written at door arrival"
        difference: |
          Input set = stops with status IN {PENDING, DELIVERED, REMADE}; miles =
          planned_miles (the address grid distance snapshotted at insertion).
          Result lands on Dispatch.estimated_reimbursement_cents and on
          ReimbursementLine rows with basis ESTIMATED / status PROVISIONAL.
      - name: ACTUAL
        when: "at settle"
        difference: |
          Input set = stops with status IN {DELIVERED, REMADE} only (a RELEASED
          stop earns nothing); miles = actual_miles (the odometer reading
          supplied at door arrival). Result lands on
          Dispatch.actual_reimbursement_cents and on ReimbursementLine rows with
          basis ACTUAL / status ACCRUED; the ESTIMATED lines become SUPERSEDED
          and reimbursement_variance_cents = actual - estimated.
    worked_examples:
      - "CAR model (per_delivery 150, cap 5.00, tier1 62c, tier2 41c, min 100), ESTIMATED miles [3.00, 3.00, 9.00]: stop1 tier1 3.00 -> 186 -> 336; stop2 tier1 2.00 + tier2 1.00 -> 124+41=165 -> 315; stop3 tier2 9.00 -> 369 -> 519; total 1170"
      - "same model, ACTUAL miles [3.40, 2.80, 9.60]: stop1 210.8 -> 360.8 -> 361; stop2 tier1 1.60 + tier2 1.20 -> 99.2+49.2=148.4 -> 298.4 -> 298; stop3 tier2 9.60 -> 393.6 -> 543.6 -> 544; total 1203; variance 1203-1170 = +33"
      - "same model, 1 stop 3.00: 336"
      - "same model, 2 stops [3.00, 3.00]: 336 + 315 = 651"
      - "same model, 2 stops [3.00, 9.00]: 336 + (124+287=411 -> 561) = 897"
      - "ROUNDING-ORDER PROOF, same model, 2 stops [0.25, 0.25]: per stop 150 + 15.5 = 165.5 -> 166 each -> total 332. Summing first (331.0) and rounding once would give 331."
      - "SCOOTER model (per_delivery 90, cap 3.00, tier1 35c, tier2 20c, min 250), 1 stop 1.00: mileage 35 -> raw 125 -> floored up to the per-stop minimum 250"

  - name: order_to_door_minutes
    description: |
      The order-to-door stopwatch, reported two ways. GROSS is what the customer
      experienced. NET removes store-caused holds the franchise is not judged
      on. The remake-eligibility test and the LATE complaint tier both read
      GROSS, so the two variants are never interchangeable.
    trigger: "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival"
    inputs:
      - "Order.placed_at, Order.door_arrival_at"
      - "Order.zone_hold_minutes, Order.remake_hold_minutes"
    algorithm: chronological
    formula: |
      gross = floor( (door_arrival_at - placed_at) / 60 seconds )
      net   = max(0, gross - zone_hold_minutes - remake_hold_minutes)
    constants: {}
    precision: "whole minutes, floor (a partially elapsed minute is not yet late)"
    variants:
      - name: GROSS
        when: "always, on every door arrival; stored on order_to_door_gross_minutes"
        difference: "Raw wall-clock elapsed minutes; the ONLY variant consulted by the remake grace test and by the LATE complaint tier."
      - name: NET
        when: "always, alongside GROSS; stored on order_to_door_net_minutes"
        difference: "GROSS minus accumulated zone_hold_minutes and remake_hold_minutes, clamped at 0; used for franchise service reporting only."
    worked_examples:
      - "placed 2026-08-05T12:00:00Z, arrived 12:36:00Z, zone_hold 0, remake_hold 0: gross 36, net 36"
      - "same, zone_hold 8: gross 36, net 28"
      - "placed 12:00:00Z, arrived 12:35:00Z: gross 35 (promise 30 + grace 5 = 35 is NOT exceeded -> ERR_REMAKE_NOT_ELIGIBLE)"
      - "placed 12:00:00Z, arrived 12:36:00Z, zone_hold 40: gross 36, net max(0, -4) = 0"

  - name: complaint_remedy
    description: |
      Sizes the goodwill credit for a customer complaint. Each category reads a
      different basis, the LATE category steps through minutes-over-promise
      tiers and additionally refunds the delivery fee once the order is 20+
      minutes late, and every branch is capped at what the customer actually
      paid — the store never refunds more than the ticket.
    trigger: "POST /store-ops/complaints/{complaint_id}/propose-remedy"
    inputs:
      - "Complaint.category"
      - "Order.food_subtotal_cents, .delivery_fee_cents, .total_charge_cents"
      - "Order.order_to_door_gross_minutes, .promise_minutes_snapshot"
      - "Order.fee_disclosure_accurate"
    algorithm: threshold
    formula: |
      if category == LATE:
          over = order_to_door_gross_minutes - promise_minutes_snapshot
          if   over >= LATE_TIER3_MINUTES: pct = 100; fee_refund = delivery_fee_cents
          elif over >= LATE_TIER2_MINUTES: pct =  50; fee_refund = 0
          elif over >= LATE_TIER1_MINUTES: pct =  20; fee_refund = 0
          else:                            pct =   0; fee_refund = 0
          raw   = round_half_up(food_subtotal_cents * pct / 100, 0) + fee_refund
          basis = LATE_TIER
      elif category == FEE_DISCLOSURE:
          penalty = FEE_DISCLOSURE_PENALTY_CENTS if fee_disclosure_accurate == false else 0
          raw     = delivery_fee_cents + penalty
          basis   = FEE_REFUND
      elif category == QUALITY:
          raw   = round_half_up(food_subtotal_cents * 50 / 100, 0)
          basis = QUALITY_HALF
      else:  # DRIVER_CONDUCT
          raw   = 0
          basis = CONDUCT_ZERO

      proposed_remedy_cents = min(raw, order.total_charge_cents)   # CAP, applied last
      remedy_basis          = basis
    constants:
      LATE_TIER1_MINUTES: 1
      LATE_TIER2_MINUTES: 10
      LATE_TIER3_MINUTES: 20
      FEE_DISCLOSURE_PENALTY_CENTS: 500
    precision: "integer cents; round_half_up on the percentage term, then the cap"
    worked_examples:
      - "LATE, food 2200, gross 36, promise 30 -> over 6 -> pct 20 -> 440 (total 2900, no cap)"
      - "LATE, food 2200, gross 50, promise 30 -> over 20 -> pct 100 + fee 200 -> 2400"
      - "QUALITY, food 2200 -> 1100"
      - "FEE_DISCLOSURE, fee 200, fee_disclosure_accurate false -> 200 + 500 = 700"
      - "FEE_DISCLOSURE, fee 200, fee_disclosure_accurate true -> 200"
      - "DRIVER_CONDUCT -> 0"
      - "CAP CASE: FEE_DISCLOSURE on an order with food 100, fee 399, tip 0 (total 499), inaccurate: raw 899 -> capped to 499"

  - name: driver_cash_position
    description: |
      The conservation identity behind the cash-on-hand limit and the safe-drop
      procedure. Money collected at doors either sits on the driver or sits in
      the store safe; it never exists in both places and never disappears.
    trigger: "re-derived on every read of Driver, Store or the cash-reconciliation endpoint"
    inputs:
      - "DispatchStop.cash_collected_cents for stops with status IN {DELIVERED, REMADE} on the driver's Dispatches"
      - "SafeDrop.amount_cents for the driver's SafeDrops with status == RECORDED"
    algorithm: aggregation
    formula: |
      collected_by_driver = sum( s.cash_collected_cents
                                 for s in the driver's DELIVERED or REMADE stops )
      dropped_by_driver   = sum( d.amount_cents
                                 for d in the driver's RECORDED SafeDrops )
      Driver.cash_on_hand_cents = collected_by_driver - dropped_by_driver
      Driver.cash_posture       = DROP_REQUIRED
                                     if cash_on_hand_cents >= Store.cash_limit_cents
                                     else CLEAR

      Store.cash_collected_total_cents = sum( collected_by_driver over the store's Drivers )
      Store.safe_deposit_total_cents   = sum( dropped_by_driver  over the store's Drivers )

      # INVARIANT, checkable at any instant via GET .../cash-reconciliation:
      #   cash_collected_total_cents
      #     == safe_deposit_total_cents + sum( Driver.cash_on_hand_cents )
    constants: {}
    precision: "integer cents; exact, no rounding"
    worked_examples:
      - "collect 2900 cash at one door: driver 2900, store collected 2900, safe 0; 2900 == 0 + 2900"
      - "then drop 2900: driver 0, safe 2900; 2900 == 2900 + 0"
      - "then void that drop inside the 60-minute window: driver 2900, safe 0; 2900 == 0 + 2900"

  - name: driver_reimbursement_accrual
    description: |
      What the driver is owed on the next payroll run. Only ACCRUED lines count,
      so provisional lines written at door arrival are invisible until the
      dispatch settles, superseded lines drop out, voided lines never counted,
      and a complaint clawback subtracts because its amount is negative.
    trigger: "re-derived on every read of Driver"
    inputs:
      - "ReimbursementLine.amount_cents for the driver's lines with status == ACCRUED"
    algorithm: aggregation
    formula: |
      Driver.reimbursement_accrued_cents =
          sum( l.amount_cents for l in ReimbursementLine
               if l.driver_id == driver.id and l.status == ACCRUED )
      # PROVISIONAL, SUPERSEDED and VOIDED lines contribute nothing.
      # CLAWBACK lines are ACCRUED with a NEGATIVE amount_cents.
    constants: {}
    precision: "integer cents; exact"
    worked_examples:
      - "after lock and 3 door arrivals (all PROVISIONAL): 0"
      - "after settle of a 3-stop route paying 1203: 1203"
      - "after an approved driver-chargeable complaint clawing back the 361 stop line: 1203 - 361 = 842"

# =============================================================================
# §1.4 Validation Rules Table — STRICT PRIORITY ORDER
#
# This table is the SINGLE authority on which error is returned when several
# conditions are violated by one request. The precondition lists inside §1.2 are
# descriptive sets, NOT orderings: when a §1.2 precondition list and this table
# disagree about which of two violations reports first, THIS TABLE WINS.
#
# Every rule is evaluated in ascending `priority`. The first violated rule
# short-circuits the request; no later rule is evaluated and no side effect of
# any kind is applied.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "all"
    description: "Every endpoint, including the logical-clock endpoint and every GET, requires an actor identity."

  - priority: 2
    category: auth
    check: "X-User-Role header present and equal to one of the five §1.7 role names"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"
    description: "An absent, empty or unrecognised role string is an authentication failure, not an authorization failure."

  - priority: 3
    category: authz
    check: "X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role gate. Checked before any resource is loaded, so a role that may not call an endpoint learns nothing about whether the ids in the path exist."

  - priority: 4
    category: authz
    check: "when X-User-Role == StoreManager, X-User-ID equals the Store.id that owns the target resource (transitively: ZoneVersion.store_id, ServiceAddress.store_id, AddressDispute -> ServiceAddress.store_id, Driver.store_id, VehicleCostModel.store_id, Order.store_id, Dispatch -> Driver.store_id, DispatchStop -> Dispatch -> Driver.store_id, SafeDrop -> Driver.store_id, Complaint -> Order.store_id, ReimbursementLine -> Driver.store_id)"
    error_id: ERR_FORBIDDEN_STORE_SCOPE
    http_status: 403
    applies_to: "all StoreManager operations"
    description: "StoreManager is entity_backed:Store — its X-User-ID IS a Store.id. A manager of store A can never read or write store B's resources."

  - priority: 5
    category: authz
    check: "when X-User-Role == Driver, X-User-ID equals the Driver.id that owns the target resource (Dispatch.driver_id, DispatchStop -> Dispatch.driver_id, SafeDrop.driver_id, ReimbursementLine.driver_id, Driver.id)"
    error_id: ERR_FORBIDDEN_DRIVER_SCOPE
    http_status: 403
    applies_to: "all Driver operations"
    description: "Driver is entity_backed:Driver. One driver may not depart, arrive at a door for, or drop cash against another driver's route."

  - priority: 6
    category: existence
    check: "every path-parameter id resolves to a stored entity, verified STRICTLY LEFT TO RIGHT along the path template"
    error_id: "ERR_STORE_NOT_FOUND | ERR_ZONE_VERSION_NOT_FOUND | ERR_SERVICE_ADDRESS_NOT_FOUND | ERR_ADDRESS_DISPUTE_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_VEHICLE_COST_MODEL_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_DISPATCH_STOP_NOT_FOUND | ERR_SAFE_DROP_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_REIMBURSEMENT_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: |
      Left-to-right is observable: DELETE /store-ops/dispatches/{bad}/stops/{bad}
      returns ERR_DISPATCH_NOT_FOUND, never ERR_DISPATCH_STOP_NOT_FOUND. A
      DispatchStop id that exists but belongs to a DIFFERENT dispatch than the
      one named in the path is treated as NOT FOUND under this rule, not as a
      mismatch error.

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored entity"
    error_id: "ERR_STORE_NOT_FOUND | ERR_SERVICE_ADDRESS_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /store-ops/zone-versions, POST /store-ops/service-addresses, POST /store-ops/drivers, POST /store-ops/vehicle-cost-models, POST /store-ops/orders, POST /store-ops/address-disputes, POST /store-ops/dispatches, POST /store-ops/dispatches/{dispatch_id}/stops, POST /store-ops/complaints"
    description: "Body FKs are checked after every path id, so a request with both a bad path id and a bad body FK reports the path id."

  - priority: 8
    category: schema
    check: "required fields present; declared types honoured; enum values in range; integers within their stated constraints; datetimes are ISO 8601 UTC instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: |
      Also covers action-conditional requirements: `granted_until` on the GRANT
      dispute action, `cash_collected_cents` matching the order total on a CASH
      door-arrival, and `reason` on the DISQUALIFY qualification decision.
      `actual_miles` is deliberately OPTIONAL on door-arrival — omitting it is
      legal at the door and is caught later, at settle, by priority 33.

  - priority: 9
    category: schema
    check: "domain-shape rules on freshly supplied structures: polygon has >= 3 vertices; effective_to > effective_from; coverage_to > coverage_from"
    error_id: "ERR_INVALID_POLYGON | ERR_INVALID_ZONE_WINDOW | ERR_INVALID_COVERAGE_WINDOW"
    http_status: 422
    applies_to: "POST /store-ops/zone-versions, POST /store-ops/drivers/{driver_id}/insurance-verifications"
    description: "Shape rules that need no other stored entity, evaluated after generic schema parsing but before any uniqueness or concurrency check."

  - priority: 10
    category: uniqueness
    check: "Store.store_number is globally unique; Driver.license_number is unique within its store"
    error_id: "ERR_STORE_NUMBER_TAKEN | ERR_LICENSE_NUMBER_TAKEN"
    http_status: 409
    applies_to: "POST /store-ops/stores, PATCH /store-ops/stores/{store_id}, POST /store-ops/drivers"
    description: "Uniqueness is checked against stored rows, so it necessarily follows the existence checks."

  - priority: 11
    category: concurrency
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_STORE_VERSION | ERR_STALE_DRIVER_VERSION"
    http_status: 412
    applies_to: "POST /store-ops/zone-versions, POST /store-ops/drivers/{driver_id}/insurance-verifications"
    description: |
      See §1.2.1. OCC is deliberately placed BEFORE every state and business
      check: a client holding a stale parent view is told its view is stale and
      is NOT told anything about the state it was trying to reach.

  - priority: 12
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_ZONE_VERSION_STATE | ERR_INVALID_DISPUTE_STATE | ERR_INVALID_DRIVER_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_DISPATCH_STATE | ERR_INVALID_STOP_STATE | ERR_INVALID_COMPLAINT_STATE | ERR_INVALID_SAFE_DROP_STATE"
    http_status: 409
    applies_to: "every action endpoint"
    description: |
      One rule, one priority, per-entity error ids. The state of the entity named
      by the LAST path parameter is checked first; a violated state check on that
      entity pre-empts every business rule below, including all fiscal rules.

  - priority: 13
    category: business_safety
    check: "the driver is QUALIFIED"
    error_id: ERR_DRIVER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock, POST /store-ops/dispatches/{dispatch_id}/depart"
    description: "A SUSPENDED or DISQUALIFIED driver may not lock or depart. Deliberately ranked ABOVE every business_constraint rule, so a stop-free lock by a suspended driver reports the qualification failure, not the empty route."

  - priority: 14
    category: business_safety
    check: "the driver's newest VERIFIED InsuranceVerification satisfies coverage_from <= T < coverage_to, where T is planned_depart_at at lock and the logical clock at depart / qualification"
    error_id: ERR_INSURANCE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock, POST /store-ops/dispatches/{dispatch_id}/depart, POST /store-ops/drivers/{driver_id}/qualification-decisions"
    description: "Uninsured wheels never turn. The instant tested differs by endpoint, which is itself observable: coverage may cover now yet expire before the planned departure."

  - priority: 15
    category: business_safety
    check: "Driver.mvr_points_latest <= MAX_MVR_POINTS (5)"
    error_id: ERR_MVR_POINTS_EXCEEDED
    http_status: 422
    applies_to: "POST /store-ops/drivers/{driver_id}/qualification-decisions"
    description: "Applies to the QUALIFY and REINSTATE decisions. Exactly 5 points passes; 6 fails."

  - priority: 16
    category: business_safety
    check: "X-User-ID != the recorded_by_user_id of the driver's newest MvrCheck"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /store-ops/drivers/{driver_id}/qualification-decisions"
    description: "The officer who pulled the motor-vehicle record may not sign the QUALIFY or REINSTATE decision that relies on it."

  - priority: 17
    category: business_referential
    check: "a ZoneVersion with status == ACTIVE whose [effective_from, effective_to) contains the logical clock exists for the store"
    error_id: ERR_NO_ACTIVE_ZONE_VERSION
    http_status: 409
    applies_to: "POST /store-ops/service-addresses, POST /store-ops/orders/{order_id}/zone-decision"
    description: "An address cannot be classified and an order cannot be cleared without a delivery area in force at the current instant."

  - priority: 18
    category: business_referential
    check: "the order's ServiceAddress.effective_zone_state == IN_ZONE"
    error_id: ERR_ADDRESS_OUT_OF_AREA
    http_status: 422
    applies_to: "POST /store-ops/orders/{order_id}/zone-decision (action CLEAR)"
    description: "Covers both the geometrically-outside case and the EDGE case whose dispute was denied or whose granted override has expired."

  - priority: 19
    category: business_referential
    check: "the Order named in the stop body belongs to the same Store as the Dispatch's Driver"
    error_id: ERR_ORDER_STORE_MISMATCH
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/stops"
    description: "Both entities exist, so this is not a 404; the association itself is illegal."

  - priority: 20
    category: business_referential
    check: "calculations.cost_model_selection resolves to at least one eligible VehicleCostModel"
    error_id: ERR_NO_COST_MODEL
    http_status: 422
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock"
    description: "No published schedule for the driver's vehicle_class effective at planned_depart_at means the route cannot be priced, so it cannot be locked."

  - priority: 21
    category: business_temporal
    check: "the new ZoneVersion's [effective_from, effective_to) does not intersect the window of any existing ZoneVersion of the same store with status IN {DRAFT, ACTIVE}"
    error_id: ERR_ZONE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /store-ops/zone-versions"
    description: "Half-open comparison: windows that merely touch (previous effective_to == new effective_from) are adjacent, not overlapping, and are accepted. SUPERSEDED versions are historical and are excluded from the test."

  - priority: 22
    category: business_temporal
    check: "the dispatch's driver-occupation interval [planned_depart_at, expected_return_at + Store.dispatch_reset_buffer_minutes], CLOSED at both ends, does not intersect the same interval of any other Dispatch of the SAME driver with status IN {LOCKED, EN_ROUTE}"
    error_id: ERR_DRIVER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock"
    description: "CLOSED at both ends, so back-to-back routes must leave the reset buffer plus one whole minute. Contrast with priority 23, whose window is HALF-OPEN."

  - priority: 23
    category: business_constraint
    check: "over the store's Dispatches with status IN {LOCKED, EN_ROUTE} whose HALF-OPEN reservation window [planned_depart_at, expected_return_at) intersects this dispatch's window, sum(committed_hot_bag_slots) + this dispatch's committed_hot_bag_slots <= Store.hot_bag_count"
    error_id: ERR_HOT_BAG_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock"
    description: "Aggregate, store-wide, across DIFFERENT drivers: each route is individually legal while the collective exceeds the bag pool. Adjacent windows (previous expected_return_at == new planned_depart_at) do NOT overlap and share no bags."

  - priority: 24
    category: business_constraint
    check: "Dispatch.stop_count + 1 <= Store.max_stacked_stops"
    error_id: ERR_STACK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/stops"
    description: "Per-dispatch cap on route stacking, independent of the store-wide hot-bag pool."

  - priority: 25
    category: business_constraint
    check: "Dispatch.stop_count >= 1"
    error_id: ERR_DISPATCH_HAS_NO_STOPS
    http_status: 422
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock"
    description: "The empty-set boundary of the whole reimbursement pipeline: an empty route has no cost model to resolve, no last stop for the home leg and nothing to reimburse, so it may not be locked."

  - priority: 26
    category: business_constraint
    check: "the Order named in the stop body has fulfillment_status == READY"
    error_id: ERR_ORDER_NOT_READY
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/stops"
    description: "Cross-entity state dependency: the DISPATCH's own state is checked at priority 12; the referenced ORDER's state is a business rule and is checked here."

  - priority: 27
    category: business_constraint
    check: "no DispatchStop with status == PENDING already references the Order named in the stop body"
    error_id: ERR_ORDER_ALREADY_STACKED
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/stops"
    description: "An order may be re-stacked after a release or a recall, but it may never occupy two live routes at once."

  - priority: 28
    category: business_constraint
    check: "AddressDispute.review_round_count < MAX_REVIEW_ROUNDS (2)"
    error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /store-ops/address-disputes/{address_dispute_id}/review (action REQUEST_INFO)"
    description: "The review loop terminates: the second REQUEST_INFO is the last one, and the third is rejected."

  - priority: 29
    category: business_constraint
    check: "every counted stop's Order has settlement_status IN {DISCLOSED, CHARGED}"
    error_id: ERR_FEE_NOT_DISCLOSED
    http_status: 422
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/lock"
    description: "Fee-versus-tip disclosure is a consumer-protection gate on dispatch, not on delivery: nothing rolls until every ticket on the route has been quoted to its customer."

  - priority: 30
    category: business_constraint
    check: "Order.remake_count < MAX_REMAKES (1)"
    error_id: ERR_REMAKE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /store-ops/orders/{order_id}/remake"
    description: "One remake per order; the second is refused even when the order is late again."

  - priority: 31
    category: business_constraint
    check: "when reason == LATE, Order.order_to_door_gross_minutes > promise_minutes_snapshot + REMAKE_GRACE_MINUTES (5)"
    error_id: ERR_REMAKE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /store-ops/orders/{order_id}/remake"
    description: "Strictly greater: exactly 35 gross minutes against a 30-minute promise is inside the grace and is refused. Reads the GROSS variant only."

  - priority: 32
    category: business_constraint
    check: "every DispatchStop of the dispatch has status IN {DELIVERED, RELEASED, REMADE}"
    error_id: ERR_STOPS_OUTSTANDING
    http_status: 409
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/return"
    description: "A driver cannot check the route back in while a pizza is still in the bag."

  - priority: 33
    category: business_constraint
    check: "every DELIVERED or REMADE stop of the dispatch has actual_miles not null"
    error_id: ERR_ODOMETER_MISSING
    http_status: 422
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/settle"
    description: "The ACTUAL reimbursement variant is undefined without every odometer reading, so settlement is refused rather than silently falling back to planned miles."

  - priority: 34
    category: business_constraint
    check: "Store.service_posture == OPEN"
    error_id: ERR_STORE_NOT_ACCEPTING_DELIVERY
    http_status: 409
    applies_to: "POST /store-ops/orders/{order_id}/zone-decision (action CLEAR)"
    description: "A CLOSED store clears nothing. A CARRYOUT_ONLY store redirects at order creation, so an order that reaches the CLEAR action under CARRYOUT_ONLY posture is a posture change made after the order was taken."

  - priority: 35
    category: business_constraint
    check: "ServiceAddress.effective_zone_state IN {EDGE, OUT_OF_ZONE}"
    error_id: ERR_ZONE_HOLD_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /store-ops/orders/{order_id}/zone-decision (action HOLD)"
    description: "An address the model already accepts cannot be parked for review; the mirror image of priority 18."

  - priority: 36
    category: business_constraint
    check: "ServiceAddress.effective_zone_state IN {EDGE, OUT_OF_ZONE}"
    error_id: ERR_DECLINE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /store-ops/orders/{order_id}/zone-decision (actions DECLINE and REDIRECT_CARRYOUT)"
    description: "An in-zone address may not be declined or redirected to carryout; the store owes it a delivery."

  - priority: 37
    category: business_constraint
    check: "when driver_chargeable is true, the settling Dispatch of the complaint's order has status == SETTLED"
    error_id: ERR_CLAWBACK_NOT_SETTLED
    http_status: 409
    applies_to: "POST /store-ops/complaints/{complaint_id}/resolve (action APPROVE)"
    description: "There is no ACTUAL_STOP line to claw back until the route settles, so a chargeable remedy cannot be approved earlier."

  - priority: 38
    category: business_fiscal
    check: "Driver.cash_on_hand_cents < Store.cash_limit_cents (STRICT), equivalently Driver.cash_posture == CLEAR"
    error_id: ERR_CASH_LIMIT_REACHED
    http_status: 402
    applies_to: "POST /store-ops/dispatches/{dispatch_id}/depart"
    description: "Reaching the limit EXACTLY already blocks departure: a driver holding exactly the limit must make a safe drop first. Ranked below every state check, so departing an already-RETURNED route reports the state, not the cash."

  - priority: 39
    category: business_fiscal
    check: "SafeDrop.amount_cents <= Driver.cash_on_hand_cents"
    error_id: ERR_SAFE_DROP_EXCEEDS_CASH
    http_status: 422
    applies_to: "POST /store-ops/drivers/{driver_id}/safe-drops"
    description: "A driver cannot drop money the ledger says is not in the pouch; the cash conservation identity must never be broken by a drop."

  - priority: 40
    category: business_fiscal
    check: "(logical clock - SafeDrop.created_at) < SAFE_DROP_VOID_WINDOW_MINUTES (60), measured in whole seconds"
    error_id: ERR_SAFE_DROP_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /store-ops/safe-drops/{safe_drop_id}/void"
    description: "Strictly less than 60 minutes: at exactly 3600 seconds the envelope is in the safe for good."

  - priority: 41
    category: business_fiscal
    check: "Complaint.proposed_remedy_cents <= Order.total_charge_cents - Order.remedy_issued_cents (the REMAINING refundable balance at approval time)"
    error_id: ERR_REMEDY_EXCEEDS_TOTAL
    http_status: 422
    applies_to: "POST /store-ops/complaints/{complaint_id}/resolve (action APPROVE)"
    description: |
      calculations.complaint_remedy caps each PROPOSAL at the full ticket, but
      approvals are cumulative: a second complaint on the same order may only
      draw down what the first one left. The store never refunds more than the
      customer paid, across all complaints on the order taken together.

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix: /store-ops. EVERY collection sits exactly one level below the
# prefix (`/store-ops/<collection>` and `/store-ops/<collection>/{id}`) so that
# each entity has one canonical resource URL. Append-only sub-collections
# (mvr-checks, insurance-verifications, safe-drops, stops) are CREATED under
# their parent but are READ at their canonical flat URL.
#
# `input:` lists request-body fields for POST/PATCH/DELETE and query-string
# fields for GET. A trailing `?` marks the field optional. Path parameters are
# never repeated in `input:`.
# =============================================================================
endpoints:

  # ---- Store -----------------------------------------------------------------
  - method: POST
    path: /store-ops/stores
    description: |
      Registers a franchise store. BOOTSTRAP NOTE: StoreManager is
      entity_backed:Store, so the id returned here becomes the X-User-ID that
      every later StoreManager call must present. The priority-4 store-scope
      check cannot apply to this call because there is no target resource yet,
      so any non-empty X-User-ID is accepted on creation alone.
    roles: [StoreManager]
    input:
      - store_number
      - name
      - latitude_micro
      - longitude_micro
      - promise_minutes?
      - delivery_fee_cents?
      - cash_limit_cents?
      - hot_bag_count?
      - max_stacked_stops?
      - handoff_minutes_per_stop?
      - dispatch_reset_buffer_minutes?
      - service_posture?
    output: Store
    success_code: 201
    side_effects:
      - "all omitted policy fields take their §1.1 defaults; the four computed totals start at 0 and active_zone_version_number starts null"

  - method: PATCH
    path: /store-ops/stores/{store_id}
    description: "Edits store policy. Never retro-changes an existing order: Order.promise_minutes_snapshot is frozen at order creation."
    roles: [StoreManager]
    input:
      - store_number?
      - name?
      - promise_minutes?
      - delivery_fee_cents?
      - cash_limit_cents?
      - hot_bag_count?
      - max_stacked_stops?
      - handoff_minutes_per_stop?
      - dispatch_reset_buffer_minutes?
      - service_posture?
    output: Store
    success_code: 200
    side_effects:
      - "increments Store.version by 1"
      - "lowering cash_limit_cents can flip existing Drivers to cash_posture DROP_REQUIRED on their next read, which blocks their next depart"

  - method: GET
    path: /store-ops/stores/{store_id}
    description: "Reads one store with all four computed totals and active_zone_version_number re-derived at read time."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: Store
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/stores/{store_id}/cash-reconciliation
    description: "Computed read: proves the cash conservation identity of calculations.driver_cash_position at the current instant."
    roles: [StoreManager]
    input: []
    output: "{ store_id: string, cash_collected_total_cents: integer, safe_deposit_total_cents: integer, driver_cash_on_hand_total_cents: integer, reconciled: boolean }"
    success_code: 200
    side_effects:
      - "reconciled is true exactly when cash_collected_total_cents == safe_deposit_total_cents + driver_cash_on_hand_total_cents"

  # ---- ZoneVersion -----------------------------------------------------------
  - method: POST
    path: /store-ops/zone-versions
    description: "Publishes a DRAFT delivery-area version. OCC-guarded on the parent Store (§1.2.1)."
    roles: [StoreManager]
    input:
      - store_id
      - polygon
      - effective_from
      - effective_to
      - expected_store_version
      - max_drive_time_minutes?
      - base_drive_minutes?
      - minutes_per_mile?
      - peak_surcharge_minutes?
      - barrier_surcharge_minutes?
    output: ZoneVersion
    success_code: 201
    side_effects:
      - "assigns version_number = count of the store's existing ZoneVersions + 1"
      - "increments Store.version by 1"

  - method: POST
    path: /store-ops/zone-versions/{zone_version_id}/activate
    description: "Puts a DRAFT version in force and supersedes the newest earlier ACTIVE version of the same store."
    roles: [StoreManager]
    input: []
    output: ZoneVersion
    success_code: 200
    side_effects:
      - "sets status ACTIVE, activated_at, supersedes_zone_version_id"
      - "sets the superseded version's status to SUPERSEDED"
      - "increments Store.version by 1"

  - method: GET
    path: /store-ops/zone-versions/{zone_version_id}
    description: "Reads one delivery-area version including its polygon ring and drive-time model constants."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: ZoneVersion
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/zone-versions
    description: "Lists delivery-area versions. `supersedes_zone_version_id` filters the self-referential lineage."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - store_id?
      - supersedes_zone_version_id?
      - status?
      - limit?
      - offset?
    output: ZoneVersion[]
    success_code: 200
    side_effects: []

  # ---- ServiceAddress --------------------------------------------------------
  - method: POST
    path: /store-ops/service-addresses
    description: "Geocodes and classifies a delivery address against the ZoneVersion in force at the logical clock."
    roles: [Dispatcher, CustomerCareAgent, StoreManager]
    input:
      - store_id
      - line1
      - latitude_micro
      - longitude_micro
      - crosses_barrier?
    output: ServiceAddress
    success_code: 201
    side_effects:
      - "runs calculations.grid_distance_miles, drive_time_estimate and zone_state_classification"
      - "stamps evaluated_zone_version_number and evaluated_at; override_state and override_until start null so effective_zone_state == zone_state"

  - method: GET
    path: /store-ops/service-addresses/{service_address_id}
    description: "Reads one address; effective_zone_state is re-derived against the logical clock on every read."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: ServiceAddress
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/service-addresses
    description: "Lists classified addresses for a store."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - store_id?
      - zone_state?
      - limit?
      - offset?
    output: ServiceAddress[]
    success_code: 200
    side_effects: []

  # ---- AddressDispute --------------------------------------------------------
  - method: POST
    path: /store-ops/address-disputes
    description: "Opens an edge-address dispute on behalf of a customer who insists the address is inside the delivery area."
    roles: [CustomerCareAgent, StoreManager]
    input:
      - service_address_id
      - claimed_state
      - evidence_note
    output: AddressDispute
    success_code: 201
    side_effects:
      - "starts in SUBMITTED with review_round_count 0"

  - method: POST
    path: /store-ops/address-disputes/{address_dispute_id}/review
    description: |
      Single review endpoint driving the whole dispute cycle. Actions
      START_REVIEW, REQUEST_INFO, GRANT and DENY are StoreManager-only; action
      WITHDRAW is CustomerCareAgent-only. A role calling an action reserved for
      the other role gets ERR_UNAUTHORIZED (priority 3).
    roles: [StoreManager, CustomerCareAgent]
    input:
      - action
      - granted_until?
      - note?
    output: AddressDispute
    success_code: 200
    side_effects:
      - "GRANT drives the four-hop cascade in §1.2 (address override, held orders cleared with zone_hold_minutes accrual, store unassigned count re-derived)"

  - method: GET
    path: /store-ops/address-disputes/{address_dispute_id}
    description: "Reads one dispute with its review round count and resolution."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: AddressDispute
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/address-disputes
    description: "Lists disputes, optionally scoped to one service address."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - service_address_id?
      - status?
      - limit?
      - offset?
    output: AddressDispute[]
    success_code: 200
    side_effects: []

  # ---- Driver, MVR, insurance, qualification ---------------------------------
  - method: POST
    path: /store-ops/drivers
    description: "Hires a delivery driver in APPLICANT status with no checks on file."
    roles: [StoreManager]
    input:
      - store_id
      - full_name
      - license_number
      - vehicle_class
    output: Driver
    success_code: 201
    side_effects:
      - "qualification_status APPLICANT, insurance_status NONE, mvr_points_latest 0, cash_on_hand_cents 0, cash_posture CLEAR, reimbursement_accrued_cents 0"

  - method: POST
    path: /store-ops/drivers/{driver_id}/mvr-checks
    description: "Records a motor-vehicle-record pull. Append-only and immutable (common_fields: false — no version, no update endpoint)."
    roles: [ComplianceOfficer]
    input:
      - result
      - violation_points
      - checked_on
    output: MvrCheck
    success_code: 201
    side_effects:
      - "stamps recorded_by_user_id = X-User-ID, which the priority-16 segregation-of-duties check later reads"
      - "re-derives Driver.mvr_points_latest and increments Driver.version by 1"
      - "result CLEAR or MINOR_VIOLATIONS advances an APPLICANT to PENDING_CHECKS; result FAILED drives the four-hop disqualification cascade in §1.2"

  - method: POST
    path: /store-ops/drivers/{driver_id}/insurance-verifications
    description: "Files a certificate of insurance. OCC-guarded on the parent Driver (§1.2.1)."
    roles: [ComplianceOfficer]
    input:
      - policy_number
      - coverage_from
      - coverage_to
      - liability_limit_cents
      - expected_driver_version
    output: InsuranceVerification
    success_code: 201
    side_effects:
      - "status VERIFIED when liability_limit_cents >= MIN_LIABILITY_CENTS (10000000), else REJECTED with rejected_reason"
      - "any previous verification of this driver becomes SUPERSEDED"
      - "re-derives Driver.insurance_status and increments Driver.version by 1"

  - method: POST
    path: /store-ops/drivers/{driver_id}/qualification-decisions
    description: "Signs a QUALIFY, SUSPEND, REINSTATE or DISQUALIFY decision on a driver."
    roles: [ComplianceOfficer]
    input:
      - decision
      - reason?
    output: Driver
    success_code: 200
    side_effects:
      - "QUALIFY and REINSTATE set qualified_by_user_id = X-User-ID"
      - "DISQUALIFY requires reason and drives the four-hop cascade in §1.2"
      - "increments Driver.version by 1"

  - method: GET
    path: /store-ops/drivers/{driver_id}
    description: "Reads one driver with insurance_status, mvr_points_latest, cash_on_hand_cents, cash_posture and reimbursement_accrued_cents all re-derived at read time. This is the endpoint an OCC client reads to obtain a fresh expected_driver_version."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: Driver
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/drivers
    description: "Lists a store's drivers."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - store_id?
      - qualification_status?
      - vehicle_class?
      - limit?
      - offset?
    output: Driver[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/mvr-checks/{mvr_check_id}
    description: "Reads one immutable motor-vehicle-record pull."
    roles: [StoreManager, ComplianceOfficer]
    input: []
    output: MvrCheck
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/mvr-checks
    description: "Lists motor-vehicle-record pulls, newest first by created_at DESC."
    roles: [StoreManager, ComplianceOfficer]
    input:
      - driver_id?
      - result?
      - limit?
      - offset?
    output: MvrCheck[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/insurance-verifications/{insurance_verification_id}
    description: "Reads one insurance verification."
    roles: [StoreManager, ComplianceOfficer]
    input: []
    output: InsuranceVerification
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/insurance-verifications
    description: "Lists insurance verifications for a driver."
    roles: [StoreManager, ComplianceOfficer]
    input:
      - driver_id?
      - status?
      - limit?
      - offset?
    output: InsuranceVerification[]
    success_code: 200
    side_effects: []

  # ---- VehicleCostModel ------------------------------------------------------
  - method: POST
    path: /store-ops/vehicle-cost-models
    description: "Publishes a reimbursement schedule for one vehicle class."
    roles: [StoreManager]
    input:
      - store_id
      - vehicle_class
      - per_delivery_cents
      - tier1_cap_miles
      - tier1_per_mile_cents
      - tier2_per_mile_cents
      - min_reimbursement_per_stop_cents
      - effective_from
    output: VehicleCostModel
    success_code: 201
    side_effects:
      - "any ACTIVE schedule for the same (store_id, vehicle_class) with an EARLIER effective_from becomes RETIRED with retired_at set"
      - "already-locked Dispatches keep their snapshotted resolved_cost_model_id and are NOT re-priced"

  - method: GET
    path: /store-ops/vehicle-cost-models/{vehicle_cost_model_id}
    description: "Reads one reimbursement schedule."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: VehicleCostModel
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/vehicle-cost-models
    description: "Lists reimbursement schedules for a store."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - store_id?
      - vehicle_class?
      - status?
      - limit?
      - offset?
    output: VehicleCostModel[]
    success_code: 200
    side_effects: []

  # ---- SafeDrop --------------------------------------------------------------
  - method: POST
    path: /store-ops/drivers/{driver_id}/safe-drops
    description: "Records cash moved from the driver's pouch into the store safe."
    roles: [Driver, StoreManager]
    input:
      - amount_cents
      - envelope_number
    output: SafeDrop
    success_code: 201
    side_effects:
      - "lowers Driver.cash_on_hand_cents and raises Store.safe_deposit_total_cents by amount_cents"
      - "re-derives Driver.cash_posture, which can flip DROP_REQUIRED back to CLEAR and unblock depart"
      - "increments Driver.version and Store.version by 1 each"

  - method: POST
    path: /store-ops/safe-drops/{safe_drop_id}/void
    description: "Reverses a mis-keyed drop inside the 60-minute void window; the exact compensating inverse of the drop."
    roles: [StoreManager]
    input:
      - voided_reason
    output: SafeDrop
    success_code: 200
    side_effects:
      - "raises Driver.cash_on_hand_cents and lowers Store.safe_deposit_total_cents by amount_cents"
      - "increments Driver.version and Store.version by 1 each"

  - method: GET
    path: /store-ops/safe-drops/{safe_drop_id}
    description: "Reads one safe drop."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer]
    input: []
    output: SafeDrop
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/safe-drops
    description: "Lists safe drops for a driver."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer]
    input:
      - driver_id?
      - status?
      - limit?
      - offset?
    output: SafeDrop[]
    success_code: 200
    side_effects: []

  # ---- Order -----------------------------------------------------------------
  - method: POST
    path: /store-ops/orders
    description: "Takes a delivery order and prices it from the address snapshot. Under CARRYOUT_ONLY posture the order is created already CARRYOUT_REDIRECTED / VOIDED, with the pricing fields still computed."
    roles: [Dispatcher, CustomerCareAgent]
    input:
      - store_id
      - service_address_id
      - customer_name
      - customer_phone
      - food_subtotal_cents
      - payment_method
      - tip_cents?
    output: Order
    success_code: 201
    side_effects:
      - "runs calculations.customer_delivery_charge to set fee_tier, base_delivery_fee_cents, fee_waiver_pct, delivery_fee_cents and total_charge_cents"
      - "snapshots promise_minutes_snapshot from the store and stamps placed_at from the logical clock"
      - "the ServiceAddress must belong to store_id; otherwise ERR_SERVICE_ADDRESS_NOT_FOUND"

  - method: POST
    path: /store-ops/orders/{order_id}/zone-decision
    description: "Dispositions an order against the delivery area: CLEAR, HOLD, DECLINE or REDIRECT_CARRYOUT."
    roles: [Dispatcher, StoreManager]
    input:
      - action
      - note?
    output: Order
    success_code: 200
    side_effects:
      - "CLEAR from ZONE_HELD accrues zone_hold_minutes; DECLINE and REDIRECT_CARRYOUT also accrue it and void the settlement dimension"
      - "re-derives Store.unassigned_order_count on the next store read"

  - method: POST
    path: /store-ops/orders/{order_id}/disclose-fee
    description: "Records the fee-versus-tip disclosure made to the customer. Advances the settlement dimension independently of the fulfillment dimension."
    roles: [CustomerCareAgent, Dispatcher]
    input:
      - disclosed_fee_cents
      - disclosed_tip_cents
      - driver_tip_notice_given
    output: Order
    success_code: 200
    side_effects:
      - "computes fee_disclosure_accurate; a MISMATCH IS RECORDED, NOT REJECTED, so that the FEE_DISCLOSURE complaint penalty stays reachable"
      - "stamps fee_disclosed_at from the logical clock"

  - method: POST
    path: /store-ops/orders/{order_id}/production
    description: "Moves an order through the make line: action START or READY."
    roles: [Dispatcher]
    input:
      - action
    output: Order
    success_code: 200
    side_effects:
      - "READY stamps ready_at from the logical clock"
      - "START also re-enters production from REMAKE_QUEUED, closing the remake cycle"

  - method: POST
    path: /store-ops/orders/{order_id}/remake
    description: "Queues a remake on a delivered order under the remake policy."
    roles: [StoreManager]
    input:
      - reason
    output: Order
    success_code: 200
    side_effects:
      - "accrues remake_hold_minutes, clears door_arrival_at and both order-to-door figures"
      - "increments remake_count, raises remake_credit_cents by food_subtotal_cents, flips the delivered DispatchStop to REMADE and advances settlement CHARGED -> ADJUSTED"

  - method: GET
    path: /store-ops/orders/{order_id}
    description: "Reads one order with both state dimensions and every computed money and timing field."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input: []
    output: Order
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/orders
    description: "Lists orders, filterable on either state dimension and on the address FK."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - store_id?
      - service_address_id?
      - fulfillment_status?
      - settlement_status?
      - limit?
      - offset?
    output: Order[]
    success_code: 200
    side_effects: []

  # ---- Dispatch and DispatchStop --------------------------------------------
  - method: POST
    path: /store-ops/dispatches
    description: "Opens an empty DRAFT route for a driver at a planned departure instant."
    roles: [Dispatcher]
    input:
      - driver_id
      - planned_depart_at
    output: Dispatch
    success_code: 201
    side_effects:
      - "stop_count 0, committed_hot_bag_slots 0, route_minutes / expected_return_at / resolved_cost_model_id / estimated_reimbursement_cents all null"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/stops
    description: "Stacks a READY order onto a DRAFT or STACKED route."
    roles: [Dispatcher]
    input:
      - order_id
      - hot_bag_slots?
    output: DispatchStop
    success_code: 201
    side_effects:
      - "assigns sequence = (count of ALL stops ever created on this dispatch, any status) + 1 and snapshots planned_miles and planned_drive_minutes"
      - "raises Dispatch.stop_count and Dispatch.committed_hot_bag_slots"
      - "advances the order's fulfillment dimension READY -> ASSIGNED"

  - method: DELETE
    path: /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}
    description: "Un-stacks a PENDING stop from a DRAFT or STACKED route. The exact compensating inverse of the insertion."
    roles: [Dispatcher]
    input: []
    output: DispatchStop
    success_code: 200
    side_effects:
      - "stop status becomes RELEASED; sequence numbers of the surviving stops are NEVER renumbered"
      - "lowers Dispatch.stop_count and Dispatch.committed_hot_bag_slots back to their pre-insertion values"
      - "reverts the order's fulfillment dimension ASSIGNED -> READY"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/lock
    description: "Commits the route: prices it, reserves the driver's occupation interval and the store's hot-bag slots."
    roles: [Dispatcher]
    input: []
    output: Dispatch
    success_code: 200
    side_effects:
      - "runs calculations.route_duration_model, cost_model_selection and the ESTIMATED variant of dispatch_reimbursement"
      - "sets route_minutes, expected_return_at, resolved_cost_model_id and estimated_reimbursement_cents"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/unlock
    description: "Releases a LOCKED route back to STACKED so stops can be edited. Clears every field lock computed."
    roles: [Dispatcher]
    input: []
    output: Dispatch
    success_code: 200
    side_effects:
      - "route_minutes, expected_return_at, resolved_cost_model_id and estimated_reimbursement_cents all return to null"
      - "frees the driver occupation interval and the store hot-bag reservation"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/depart
    description: "Sends the driver out of the door. Blocked by the cash-on-hand limit."
    roles: [Driver]
    input: []
    output: Dispatch
    success_code: 200
    side_effects:
      - "stamps departed_at and advances every stop's order ASSIGNED -> EN_ROUTE"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival
    description: "Records the handoff at one door: odometer reading, cash taken, and the order-to-door stopwatch."
    roles: [Driver]
    input:
      - actual_miles?
      - cash_collected_cents?
    output: DispatchStop
    success_code: 200
    side_effects:
      - "drives the four-hop cascade in §1.2 (order DELIVERED, settlement CHARGED, driver and store cash raised, cash_posture re-derived)"
      - "writes the PROVISIONAL_STOP ReimbursementLine on the ESTIMATED basis"
      - "for a CASH order, cash_collected_cents is required and must equal Order.total_charge_cents; for a CARD order it must be omitted or 0"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/return
    description: "Checks the route back in once every stop is terminal; frees the hot-bag reservation."
    roles: [Driver]
    input: []
    output: Dispatch
    success_code: 200
    side_effects:
      - "stamps returned_at and drops committed_hot_bag_slots to 0"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/settle
    description: "Runs payroll on a returned route: the ACTUAL reimbursement variant, the variance, and closure of every delivered order."
    roles: [StoreManager]
    input: []
    output: Dispatch
    success_code: 200
    side_effects:
      - "computes actual_reimbursement_cents and reimbursement_variance_cents"
      - "PROVISIONAL_STOP lines become SUPERSEDED; one ACTUAL_STOP line per delivered or remade stop is written with status ACCRUED"
      - "raises Driver.reimbursement_accrued_cents and increments Driver.version by 1"
      - "closes each delivered order (fulfillment CLOSED, settlement CLOSED_SETTLED)"

  - method: POST
    path: /store-ops/dispatches/{dispatch_id}/recall
    description: "Aborts a route. Pays nothing: provisional lines are VOIDED, never accrued."
    roles: [StoreManager, Dispatcher]
    input:
      - recalled_reason
    output: Dispatch
    success_code: 200
    side_effects:
      - "PENDING stops become RELEASED and their orders revert to READY; DELIVERED stops and the cash already collected are untouched"
      - "every PROVISIONAL_STOP line of the dispatch becomes VOIDED"
      - "frees the driver occupation interval and the hot-bag reservation"
      - "a stop-free DRAFT dispatch goes to CANCELLED instead of RECALLED"

  - method: GET
    path: /store-ops/dispatches/{dispatch_id}
    description: "Reads one route with stop_count, committed_hot_bag_slots and every reimbursement figure."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer]
    input: []
    output: Dispatch
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/dispatches
    description: "Lists routes, filterable by driver and by the snapshotted cost model."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer]
    input:
      - driver_id?
      - resolved_cost_model_id?
      - status?
      - limit?
      - offset?
    output: Dispatch[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/dispatch-stops/{dispatch_stop_id}
    description: "Reads one stop with its sequence, planned and actual miles and cash collected."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer]
    input: []
    output: DispatchStop
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/dispatch-stops
    description: "Lists stops. `dispatch_id` walks a route in sequence ASC; `order_id` walks the many-to-many history of one order across routes."
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer]
    input:
      - dispatch_id?
      - order_id?
      - status?
      - limit?
      - offset?
    output: DispatchStop[]
    success_code: 200
    side_effects: []

  # ---- ReimbursementLine -----------------------------------------------------
  - method: GET
    path: /store-ops/reimbursement-lines/{reimbursement_line_id}
    description: "Reads one reimbursement ledger line."
    roles: [StoreManager, Driver, ComplianceOfficer]
    input: []
    output: ReimbursementLine
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/reimbursement-lines
    description: "Lists reimbursement ledger lines by route, payee or order. Only status ACCRUED lines contribute to Driver.reimbursement_accrued_cents."
    roles: [StoreManager, Driver, ComplianceOfficer]
    input:
      - dispatch_id?
      - driver_id?
      - order_id?
      - line_type?
      - status?
      - limit?
      - offset?
    output: ReimbursementLine[]
    success_code: 200
    side_effects: []

  # ---- Complaint -------------------------------------------------------------
  - method: POST
    path: /store-ops/complaints
    description: "Logs a customer complaint against a delivered order."
    roles: [CustomerCareAgent, StoreManager]
    input:
      - order_id
      - category
      - description
    output: Complaint
    success_code: 201
    side_effects:
      - "stamps logged_by_user_id = X-User-ID; starts OPEN with proposed_remedy_cents null"

  - method: POST
    path: /store-ops/complaints/{complaint_id}/propose-remedy
    description: "Sizes the goodwill credit with calculations.complaint_remedy."
    roles: [CustomerCareAgent]
    input: []
    output: Complaint
    success_code: 200
    side_effects:
      - "sets proposed_remedy_cents and remedy_basis"

  - method: POST
    path: /store-ops/complaints/{complaint_id}/resolve
    description: "Manager decision on a complaint: APPROVE, REJECT (back to OPEN for a fresh proposal) or DISMISS."
    roles: [StoreManager]
    input:
      - action
      - driver_chargeable?
    output: Complaint
    success_code: 200
    side_effects:
      - "APPROVE raises Order.remedy_issued_cents, advances settlement to ADJUSTED, and when driver_chargeable writes a negative CLAWBACK line that lowers Driver.reimbursement_accrued_cents"
      - "REJECT clears proposed_remedy_cents and remedy_basis back to null"

  - method: GET
    path: /store-ops/complaints/{complaint_id}
    description: "Reads one complaint with its proposed and clawback amounts."
    roles: [StoreManager, Dispatcher, CustomerCareAgent]
    input: []
    output: Complaint
    success_code: 200
    side_effects: []

  - method: GET
    path: /store-ops/complaints
    description: "Lists complaints for an order."
    roles: [StoreManager, Dispatcher, CustomerCareAgent]
    input:
      - order_id?
      - status?
      - category?
      - limit?
      - offset?
    output: Complaint[]
    success_code: 200
    side_effects: []

  # ---- Logical clock ---------------------------------------------------------
  - method: POST
    path: /store-ops/_clock/set_current_utc
    description: |
      Test-only logical clock. Every "now" in this system — placed_at, ready_at,
      door_arrival_at, activated_at, evaluated_at, decided_at, departed_at,
      returned_at, voided_at, resolved_at, fee_disclosed_at, the peak-hour
      surcharge test, every coverage-window and effective-window containment
      test, and the safe-drop void window — reads this clock and never the host
      wall clock. AT SERVER STARTUP THE CLOCK DEFAULTS TO 2026-08-01T00:00:00Z.
      Setting it does not retroactively alter any stored timestamp.
    roles: [StoreManager, Dispatcher, Driver, ComplianceOfficer, CustomerCareAgent]
    input:
      - current_utc
    output: "{ current_utc: string }"
    success_code: 200
    side_effects:
      - "moving the clock can flip ServiceAddress.effective_zone_state (override expiry), Driver insurance coverage containment, Store.active_zone_version_number and safe-drop voidability, all of which are re-derived on read"

# =============================================================================
# §1.6 Error Code Catalog
# Every code below is reachable by at least one instance in
# SCAFFOLD_CORNER_DESIGN.yaml or SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
errors:

  # ---- auth / authz ----------------------------------------------------------
  - id: ERR_MISSING_USER_ID
    http_status: 401
    condition: "X-User-ID header absent or empty"
    applies_to: ["all endpoints"]
  - id: ERR_INVALID_ROLE
    http_status: 401
    condition: "X-User-Role header absent, empty or not one of the five §1.7 role names"
    applies_to: ["all endpoints"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the presented role is not listed in the endpoint's roles, or the role is not permitted the specific action supplied to /address-disputes/{id}/review"
    applies_to: ["all endpoints"]
  - id: ERR_FORBIDDEN_STORE_SCOPE
    http_status: 403
    condition: "a StoreManager X-User-ID that is not the Store.id owning the target resource"
    applies_to: ["all StoreManager endpoints except POST /store-ops/stores"]
  - id: ERR_FORBIDDEN_DRIVER_SCOPE
    http_status: 403
    condition: "a Driver X-User-ID that is not the Driver.id owning the target dispatch, stop, safe drop or ledger line"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/depart", "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival", "POST /store-ops/dispatches/{dispatch_id}/return", "POST /store-ops/drivers/{driver_id}/safe-drops"]

  # ---- existence -------------------------------------------------------------
  - id: ERR_STORE_NOT_FOUND
    http_status: 404
    condition: "store_id in the path or body matches no Store"
    applies_to: ["GET /store-ops/stores/{store_id}", "GET /store-ops/stores/{store_id}/cash-reconciliation", "PATCH /store-ops/stores/{store_id}", "POST /store-ops/zone-versions", "POST /store-ops/service-addresses", "POST /store-ops/drivers", "POST /store-ops/vehicle-cost-models", "POST /store-ops/orders"]
  - id: ERR_ZONE_VERSION_NOT_FOUND
    http_status: 404
    condition: "zone_version_id in the path matches no ZoneVersion"
    applies_to: ["GET /store-ops/zone-versions/{zone_version_id}", "POST /store-ops/zone-versions/{zone_version_id}/activate"]
  - id: ERR_SERVICE_ADDRESS_NOT_FOUND
    http_status: 404
    condition: "service_address_id matches no ServiceAddress, or names an address belonging to a different store than the order's store_id"
    applies_to: ["GET /store-ops/service-addresses/{service_address_id}", "POST /store-ops/address-disputes", "POST /store-ops/orders"]
  - id: ERR_ADDRESS_DISPUTE_NOT_FOUND
    http_status: 404
    condition: "address_dispute_id in the path matches no AddressDispute"
    applies_to: ["GET /store-ops/address-disputes/{address_dispute_id}", "POST /store-ops/address-disputes/{address_dispute_id}/review"]
  - id: ERR_DRIVER_NOT_FOUND
    http_status: 404
    condition: "driver_id in the path or body matches no Driver"
    applies_to: ["GET /store-ops/drivers/{driver_id}", "POST /store-ops/drivers/{driver_id}/mvr-checks", "POST /store-ops/drivers/{driver_id}/insurance-verifications", "POST /store-ops/drivers/{driver_id}/qualification-decisions", "POST /store-ops/drivers/{driver_id}/safe-drops", "POST /store-ops/dispatches"]
  - id: ERR_VEHICLE_COST_MODEL_NOT_FOUND
    http_status: 404
    condition: "vehicle_cost_model_id in the path matches no VehicleCostModel"
    applies_to: ["GET /store-ops/vehicle-cost-models/{vehicle_cost_model_id}"]
  - id: ERR_MVR_CHECK_NOT_FOUND
    http_status: 404
    condition: "mvr_check_id in the path matches no MvrCheck"
    applies_to: ["GET /store-ops/mvr-checks/{mvr_check_id}"]
  - id: ERR_INSURANCE_VERIFICATION_NOT_FOUND
    http_status: 404
    condition: "insurance_verification_id in the path matches no InsuranceVerification"
    applies_to: ["GET /store-ops/insurance-verifications/{insurance_verification_id}"]
  - id: ERR_ORDER_NOT_FOUND
    http_status: 404
    condition: "order_id in the path or body matches no Order"
    applies_to: ["GET /store-ops/orders/{order_id}", "POST /store-ops/orders/{order_id}/zone-decision", "POST /store-ops/orders/{order_id}/disclose-fee", "POST /store-ops/orders/{order_id}/production", "POST /store-ops/orders/{order_id}/remake", "POST /store-ops/dispatches/{dispatch_id}/stops", "POST /store-ops/complaints"]
  - id: ERR_DISPATCH_NOT_FOUND
    http_status: 404
    condition: "dispatch_id in the path matches no Dispatch"
    applies_to: ["GET /store-ops/dispatches/{dispatch_id}", "all POST and DELETE endpoints under /store-ops/dispatches/{dispatch_id}"]
  - id: ERR_DISPATCH_STOP_NOT_FOUND
    http_status: 404
    condition: "dispatch_stop_id matches no DispatchStop, or matches a stop belonging to a different Dispatch than the one named earlier in the path"
    applies_to: ["GET /store-ops/dispatch-stops/{dispatch_stop_id}", "DELETE /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}", "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival"]
  - id: ERR_REIMBURSEMENT_LINE_NOT_FOUND
    http_status: 404
    condition: "reimbursement_line_id in the path matches no ReimbursementLine"
    applies_to: ["GET /store-ops/reimbursement-lines/{reimbursement_line_id}"]
  - id: ERR_SAFE_DROP_NOT_FOUND
    http_status: 404
    condition: "safe_drop_id in the path matches no SafeDrop"
    applies_to: ["GET /store-ops/safe-drops/{safe_drop_id}", "POST /store-ops/safe-drops/{safe_drop_id}/void"]
  - id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    condition: "complaint_id in the path matches no Complaint"
    applies_to: ["GET /store-ops/complaints/{complaint_id}", "POST /store-ops/complaints/{complaint_id}/propose-remedy", "POST /store-ops/complaints/{complaint_id}/resolve"]

  # ---- schema / shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, wrong type, out-of-range integer, unknown enum member, malformed ISO 8601 instant, action-conditional field absent (granted_until on GRANT, reason on DISQUALIFY), or a CASH door-arrival whose cash_collected_cents does not equal Order.total_charge_cents"
    applies_to: ["all endpoints with a request body or query string"]
  - id: ERR_INVALID_POLYGON
    http_status: 422
    condition: "polygon has fewer than 3 vertices"
    applies_to: ["POST /store-ops/zone-versions"]
  - id: ERR_INVALID_ZONE_WINDOW
    http_status: 422
    condition: "effective_to <= effective_from"
    applies_to: ["POST /store-ops/zone-versions"]
  - id: ERR_INVALID_COVERAGE_WINDOW
    http_status: 422
    condition: "coverage_to <= coverage_from"
    applies_to: ["POST /store-ops/drivers/{driver_id}/insurance-verifications"]

  # ---- uniqueness ------------------------------------------------------------
  - id: ERR_STORE_NUMBER_TAKEN
    http_status: 409
    condition: "store_number already belongs to another Store"
    applies_to: ["POST /store-ops/stores", "PATCH /store-ops/stores/{store_id}"]
  - id: ERR_LICENSE_NUMBER_TAKEN
    http_status: 409
    condition: "license_number already belongs to another Driver of the same store"
    applies_to: ["POST /store-ops/drivers"]

  # ---- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_STORE_VERSION
    http_status: 412
    condition: "expected_store_version != Store.version"
    applies_to: ["POST /store-ops/zone-versions"]
  - id: ERR_STALE_DRIVER_VERSION
    http_status: 412
    condition: "expected_driver_version != Driver.version"
    applies_to: ["POST /store-ops/drivers/{driver_id}/insurance-verifications"]

  # ---- state -----------------------------------------------------------------
  - id: ERR_INVALID_ZONE_VERSION_STATE
    http_status: 409
    condition: "activating a ZoneVersion that is not DRAFT"
    applies_to: ["POST /store-ops/zone-versions/{zone_version_id}/activate"]
  - id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    condition: "the requested review action is not declared from the dispute's current status"
    applies_to: ["POST /store-ops/address-disputes/{address_dispute_id}/review"]
  - id: ERR_INVALID_DRIVER_STATE
    http_status: 409
    condition: "the requested qualification decision is not declared from the driver's current qualification_status, including any decision on a DISQUALIFIED driver"
    applies_to: ["POST /store-ops/drivers/{driver_id}/qualification-decisions"]
  - id: ERR_INVALID_ORDER_STATE
    http_status: 409
    condition: "the requested zone-decision, disclose-fee, production or remake action is not declared from the order's current fulfillment_status or settlement_status"
    applies_to: ["POST /store-ops/orders/{order_id}/zone-decision", "POST /store-ops/orders/{order_id}/disclose-fee", "POST /store-ops/orders/{order_id}/production", "POST /store-ops/orders/{order_id}/remake"]
  - id: ERR_INVALID_DISPATCH_STATE
    http_status: 409
    condition: "the requested dispatch action is not declared from the dispatch's current status"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/stops", "DELETE /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}", "POST /store-ops/dispatches/{dispatch_id}/lock", "POST /store-ops/dispatches/{dispatch_id}/unlock", "POST /store-ops/dispatches/{dispatch_id}/depart", "POST /store-ops/dispatches/{dispatch_id}/return", "POST /store-ops/dispatches/{dispatch_id}/settle", "POST /store-ops/dispatches/{dispatch_id}/recall"]
  - id: ERR_INVALID_STOP_STATE
    http_status: 409
    condition: "the stop is not PENDING when a door arrival or a removal is attempted"
    applies_to: ["DELETE /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}", "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival"]
  - id: ERR_INVALID_COMPLAINT_STATE
    http_status: 409
    condition: "the requested complaint action is not declared from the complaint's current status"
    applies_to: ["POST /store-ops/complaints/{complaint_id}/propose-remedy", "POST /store-ops/complaints/{complaint_id}/resolve"]
  - id: ERR_INVALID_SAFE_DROP_STATE
    http_status: 409
    condition: "voiding a SafeDrop that is already VOIDED"
    applies_to: ["POST /store-ops/safe-drops/{safe_drop_id}/void"]

  # ---- business_safety -------------------------------------------------------
  - id: ERR_DRIVER_NOT_QUALIFIED
    http_status: 422
    condition: "the driver's qualification_status is not QUALIFIED"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock", "POST /store-ops/dispatches/{dispatch_id}/depart"]
  - id: ERR_INSURANCE_NOT_ACTIVE
    http_status: 422
    condition: "no VERIFIED InsuranceVerification covers the relevant instant (planned_depart_at at lock, the logical clock at depart and at qualification)"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock", "POST /store-ops/dispatches/{dispatch_id}/depart", "POST /store-ops/drivers/{driver_id}/qualification-decisions"]
  - id: ERR_MVR_POINTS_EXCEEDED
    http_status: 422
    condition: "Driver.mvr_points_latest > MAX_MVR_POINTS (5) on a QUALIFY or REINSTATE decision"
    applies_to: ["POST /store-ops/drivers/{driver_id}/qualification-decisions"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "X-User-ID equals the recorded_by_user_id of the driver's newest MvrCheck on a QUALIFY or REINSTATE decision"
    applies_to: ["POST /store-ops/drivers/{driver_id}/qualification-decisions"]

  # ---- business_referential --------------------------------------------------
  - id: ERR_NO_ACTIVE_ZONE_VERSION
    http_status: 409
    condition: "no ACTIVE ZoneVersion of the store contains the logical clock in its [effective_from, effective_to) window"
    applies_to: ["POST /store-ops/service-addresses", "POST /store-ops/orders/{order_id}/zone-decision"]
  - id: ERR_ADDRESS_OUT_OF_AREA
    http_status: 422
    condition: "the order's address has effective_zone_state EDGE or OUT_OF_ZONE when CLEAR is requested"
    applies_to: ["POST /store-ops/orders/{order_id}/zone-decision"]
  - id: ERR_ORDER_STORE_MISMATCH
    http_status: 409
    condition: "the order named in the stop body belongs to a different Store than the dispatch's driver"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/stops"]
  - id: ERR_NO_COST_MODEL
    http_status: 422
    condition: "no ACTIVE VehicleCostModel for the driver's vehicle_class is effective at planned_depart_at"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock"]

  # ---- business_temporal -----------------------------------------------------
  - id: ERR_ZONE_WINDOW_OVERLAP
    http_status: 409
    condition: "the new zone window intersects the window of an existing DRAFT or ACTIVE ZoneVersion of the same store (half-open comparison; adjacency is legal)"
    applies_to: ["POST /store-ops/zone-versions"]
  - id: ERR_DRIVER_WINDOW_CONFLICT
    http_status: 409
    condition: "the driver's closed occupation interval, including the reset buffer, intersects that of another LOCKED or EN_ROUTE dispatch of the same driver"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock"]

  # ---- business_constraint ---------------------------------------------------
  - id: ERR_HOT_BAG_CAPACITY_EXCEEDED
    http_status: 409
    condition: "committed hot-bag slots across the store's window-overlapping LOCKED and EN_ROUTE dispatches would exceed Store.hot_bag_count"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock"]
  - id: ERR_STACK_LIMIT_EXCEEDED
    http_status: 409
    condition: "inserting the stop would push stop_count above Store.max_stacked_stops"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/stops"]
  - id: ERR_DISPATCH_HAS_NO_STOPS
    http_status: 422
    condition: "locking a dispatch whose stop_count is 0"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock"]
  - id: ERR_ORDER_NOT_READY
    http_status: 409
    condition: "the order named in the stop body has fulfillment_status != READY"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/stops"]
  - id: ERR_ORDER_ALREADY_STACKED
    http_status: 409
    condition: "a PENDING DispatchStop already references the order named in the stop body"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/stops"]
  - id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    condition: "a third REQUEST_INFO action on a dispute whose review_round_count is already 2"
    applies_to: ["POST /store-ops/address-disputes/{address_dispute_id}/review"]
  - id: ERR_FEE_NOT_DISCLOSED
    http_status: 422
    condition: "a counted stop's order has settlement_status UNDISCLOSED at lock time"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/lock"]
  - id: ERR_REMAKE_LIMIT_REACHED
    http_status: 409
    condition: "Order.remake_count is already MAX_REMAKES (1)"
    applies_to: ["POST /store-ops/orders/{order_id}/remake"]
  - id: ERR_REMAKE_NOT_ELIGIBLE
    http_status: 422
    condition: "reason == LATE but order_to_door_gross_minutes <= promise_minutes_snapshot + REMAKE_GRACE_MINUTES (5)"
    applies_to: ["POST /store-ops/orders/{order_id}/remake"]
  - id: ERR_STOPS_OUTSTANDING
    http_status: 409
    condition: "a DispatchStop of the dispatch is still PENDING when the route is checked back in"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/return"]
  - id: ERR_ODOMETER_MISSING
    http_status: 422
    condition: "a DELIVERED or REMADE stop has actual_miles null at settle time"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/settle"]
  - id: ERR_STORE_NOT_ACCEPTING_DELIVERY
    http_status: 409
    condition: "Store.service_posture is CARRYOUT_ONLY or CLOSED when CLEAR is requested"
    applies_to: ["POST /store-ops/orders/{order_id}/zone-decision"]
  - id: ERR_ZONE_HOLD_NOT_APPLICABLE
    http_status: 422
    condition: "HOLD requested on an address whose effective_zone_state is IN_ZONE"
    applies_to: ["POST /store-ops/orders/{order_id}/zone-decision"]
  - id: ERR_DECLINE_NOT_APPLICABLE
    http_status: 422
    condition: "DECLINE or REDIRECT_CARRYOUT requested on an address whose effective_zone_state is IN_ZONE"
    applies_to: ["POST /store-ops/orders/{order_id}/zone-decision"]
  - id: ERR_CLAWBACK_NOT_SETTLED
    http_status: 409
    condition: "driver_chargeable is true but the order's settling dispatch has not reached SETTLED"
    applies_to: ["POST /store-ops/complaints/{complaint_id}/resolve"]

  # ---- business_fiscal -------------------------------------------------------
  - id: ERR_CASH_LIMIT_REACHED
    http_status: 402
    condition: "Driver.cash_on_hand_cents >= Store.cash_limit_cents at departure"
    applies_to: ["POST /store-ops/dispatches/{dispatch_id}/depart"]
  - id: ERR_SAFE_DROP_EXCEEDS_CASH
    http_status: 422
    condition: "amount_cents > Driver.cash_on_hand_cents"
    applies_to: ["POST /store-ops/drivers/{driver_id}/safe-drops"]
  - id: ERR_SAFE_DROP_NOT_VOIDABLE
    http_status: 409
    condition: "the logical clock is 60 minutes or more after SafeDrop.created_at"
    applies_to: ["POST /store-ops/safe-drops/{safe_drop_id}/void"]
  - id: ERR_REMEDY_EXCEEDS_TOTAL
    http_status: 422
    condition: "proposed_remedy_cents > Order.total_charge_cents - Order.remedy_issued_cents (the remaining refundable balance) at approval time"
    applies_to: ["POST /store-ops/complaints/{complaint_id}/resolve"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:

  - name: StoreManager
    description: |
      Franchisee or general manager of ONE store. Owns zone policy, cash policy,
      the remake decision, dispatch settlement and complaint resolution.
      Store-scoped: every read and write is confined to the store whose id is the
      manager's own X-User-ID.
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /store-ops/stores"
      - "PATCH /store-ops/stores/{store_id}"
      - "GET /store-ops/stores/{store_id}/cash-reconciliation"
      - "POST /store-ops/zone-versions"
      - "POST /store-ops/zone-versions/{zone_version_id}/activate"
      - "POST /store-ops/drivers"
      - "POST /store-ops/vehicle-cost-models"
      - "POST /store-ops/safe-drops/{safe_drop_id}/void"
      - "POST /store-ops/orders/{order_id}/remake"
      - "POST /store-ops/dispatches/{dispatch_id}/settle"
      - "POST /store-ops/complaints/{complaint_id}/resolve"
      - "POST /store-ops/address-disputes/{address_dispute_id}/review with action IN {START_REVIEW, REQUEST_INFO, GRANT, DENY}"
    shared_operations:
      - "POST /store-ops/service-addresses (with Dispatcher, CustomerCareAgent)"
      - "POST /store-ops/address-disputes (with CustomerCareAgent)"
      - "POST /store-ops/drivers/{driver_id}/safe-drops (with Driver)"
      - "POST /store-ops/orders/{order_id}/zone-decision (with Dispatcher)"
      - "POST /store-ops/dispatches/{dispatch_id}/recall (with Dispatcher)"
      - "POST /store-ops/complaints (with CustomerCareAgent)"
      - "POST /store-ops/_clock/set_current_utc (with every role)"
      - "every GET"

  - name: Dispatcher
    description: |
      Inside expediter who takes orders, dispositions them against the delivery
      area, runs the make line and builds routes. Never touches money policy,
      never signs a qualification decision and never settles payroll.
    identity: "opaque"
    exclusive_operations:
      - "POST /store-ops/orders/{order_id}/production"
      - "POST /store-ops/dispatches"
      - "POST /store-ops/dispatches/{dispatch_id}/stops"
      - "DELETE /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}"
      - "POST /store-ops/dispatches/{dispatch_id}/lock"
      - "POST /store-ops/dispatches/{dispatch_id}/unlock"
    shared_operations:
      - "POST /store-ops/service-addresses (with StoreManager, CustomerCareAgent)"
      - "POST /store-ops/orders (with CustomerCareAgent)"
      - "POST /store-ops/orders/{order_id}/zone-decision (with StoreManager)"
      - "POST /store-ops/orders/{order_id}/disclose-fee (with CustomerCareAgent)"
      - "POST /store-ops/dispatches/{dispatch_id}/recall (with StoreManager)"
      - "POST /store-ops/_clock/set_current_utc (with every role)"
      - "most GETs (not the immutable MVR/insurance reads, not reimbursement-lines)"

  - name: Driver
    description: |
      The delivery driver. Owns exactly the events that only the person in the
      car can attest to: departure, the handoff at each door with its odometer
      reading and cash, the return, and dropping cash into the safe.
      Driver-scoped: may act only on their own routes.
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /store-ops/dispatches/{dispatch_id}/depart"
      - "POST /store-ops/dispatches/{dispatch_id}/stops/{dispatch_stop_id}/door-arrival"
      - "POST /store-ops/dispatches/{dispatch_id}/return"
    shared_operations:
      - "POST /store-ops/drivers/{driver_id}/safe-drops (with StoreManager)"
      - "POST /store-ops/_clock/set_current_utc (with every role)"
      - "GET on stores, zone-versions, service-addresses, address-disputes, drivers, vehicle-cost-models, orders, dispatches, dispatch-stops, safe-drops, reimbursement-lines"

  - name: ComplianceOfficer
    description: |
      Back-office risk function. Pulls motor-vehicle records, files certificates
      of insurance and signs qualification decisions. SEGREGATION OF DUTIES: the
      officer who recorded the driver's newest MvrCheck may not sign the QUALIFY
      or REINSTATE decision that relies on it.
    identity: "opaque"
    exclusive_operations:
      - "POST /store-ops/drivers/{driver_id}/mvr-checks"
      - "POST /store-ops/drivers/{driver_id}/insurance-verifications"
      - "POST /store-ops/drivers/{driver_id}/qualification-decisions"
    shared_operations:
      - "POST /store-ops/_clock/set_current_utc (with every role)"
      - "GET on stores, zone-versions, service-addresses, address-disputes, drivers, mvr-checks, insurance-verifications, vehicle-cost-models, orders, dispatches, dispatch-stops, safe-drops, reimbursement-lines"

  - name: CustomerCareAgent
    description: |
      Phone and web order taker and complaint desk. Owns the fee-versus-tip
      disclosure, the dispute intake and withdrawal, and the remedy proposal —
      but never the remedy approval, which is the manager's alone.
    identity: "opaque"
    exclusive_operations:
      - "POST /store-ops/complaints/{complaint_id}/propose-remedy"
      - "POST /store-ops/address-disputes/{address_dispute_id}/review with action == WITHDRAW"
    shared_operations:
      - "POST /store-ops/service-addresses (with StoreManager, Dispatcher)"
      - "POST /store-ops/address-disputes (with StoreManager)"
      - "POST /store-ops/orders (with Dispatcher)"
      - "POST /store-ops/orders/{order_id}/disclose-fee (with Dispatcher)"
      - "POST /store-ops/complaints (with StoreManager)"
      - "POST /store-ops/_clock/set_current_utc (with every role)"
      - "GET on stores, zone-versions, service-addresses, address-disputes, drivers, vehicle-cost-models, orders, complaints"
