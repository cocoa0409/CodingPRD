              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s_id}/transition"
              payload: { action: "END", peak_viewers: 100, avg_viewers: 90 }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/deliverables/${del_id}/transition"
              payload: { action: "PERFORM", stream_id: "${s_id}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DELIVERABLE_OVERDUE; deliverable stays SCHEDULED with performed_at null"

      - name: perk_fulfill_inventory_exhausted
        claim_type: violation_to_error
        grounds:
          - "validations[priority=21]"
          - "calculations.perk_inventory"
          - "errors[ERR_PERK_INVENTORY_EXHAUSTED]"
        distinguishing_aspect: "FULFILL with perk_inventory_remaining == 0 -> ERR_PERK_INVENTORY_EXHAUSTED; the grant stays PENDING (no negative inventory)."
        test_recipe:
          setup: ["Channel; tier TIER_2 with perk_inventory_total 0; viewer; subscription (MERCH grant PENDING)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "val_perk", display_name: "Val Perk", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/tiers"
              payload: { tier_code: "TIER_2", monthly_price_cents: 10000, revenue_share_bps: 6000, perk_inventory_total: 0 }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { t_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/viewers"
              payload: { handle: "v_perk" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/subscriptions"
              payload: { viewer_id: "${v_id}", tier_id: "${t_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "GET /api/subscriptions/${sub_id}/perk-grants"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { pg_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/perk-grants/${pg_id}/transition"
              payload: { action: "FULFILL" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERK_INVENTORY_EXHAUSTED (409)"
            - "PerkGrant.${pg_id}.perk_status remains PENDING; tier perk_inventory_remaining remains 0"

      - name: ban_cascade_voids_subscription_and_blocks_new
        claim_type: violation_to_error
        grounds:
          - "state_machines.Viewer.GOOD_STANDING_to_BANNED"
          - "state_machines.Subscription"
          - "errors[ERR_VIEWER_BANNED]"
        distinguishing_aspect: "BAN cascade: viewer's ACTIVE subscription -> CANCELLED and its PENDING perk -> VOIDED in the same request; a new subscription for the BANNED viewer -> ERR_VIEWER_BANNED."
        test_recipe:
          setup: ["Channel; tier; viewer with ACTIVE subscription (one PENDING MERCH grant); two creator-issued TIMEOUTs on the viewer"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "val_casc", display_name: "Val Casc", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/tiers"
              payload: { tier_code: "TIER_1", monthly_price_cents: 5000, revenue_share_bps: 5000, perk_inventory_total: 3 }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { t_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/viewers"
              payload: { handle: "v_casc" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/subscriptions"
              payload: { viewer_id: "${v_id}", tier_id: "${t_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "GET /api/subscriptions/${sub_id}/perk-grants"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { pg_id: "$.data[0].id" }
            - call: "POST /api/channels/${ch_id}/moderation-actions"
              payload: { viewer_id: "${v_id}", action_kind: "TIMEOUT", duration_minutes: 30, reason: "t1" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/channels/${ch_id}/moderation-actions"
              payload: { viewer_id: "${v_id}", action_kind: "TIMEOUT", duration_minutes: 30, reason: "t2" }
              as: Creator
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /api/channels/${ch_id}/moderation-actions"
              payload: { viewer_id: "${v_id}", action_kind: "BAN", reason: "ban" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "GET /api/subscriptions/${sub_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { sub_status: $.data.sub_status }
            - call: "POST /api/channels/${ch_id}/subscriptions"
              payload: { viewer_id: "${v_id}", tier_id: "${t_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "After BAN: Subscription.${sub_id}.sub_status == CANCELLED (cascade)"
            - "PerkGrant.${pg_id}.perk_status == VOIDED (cascade); tier inventory untouched (grant never FULFILLED)"
            - "New subscription attempt: err == ERR_VIEWER_BANNED (409)"

  # ============================================================ Endpoints
  - section: endpoints
    instances:
      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List responses carry the envelope pagination fields with declared defaults: limit 10, offset 0, total_count and has_more consistent with the stored set."
        test_recipe:
          setup: ["Channel with exactly 3 strikes issued"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "ep_page", display_name: "EP Page", home_platform: "TWITCH" }
