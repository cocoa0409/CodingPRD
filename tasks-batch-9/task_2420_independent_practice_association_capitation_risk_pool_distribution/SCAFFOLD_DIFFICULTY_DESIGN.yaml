  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: physician_parallel_credential_and_panel_dimensions
        shape: "parallel dimensions (credential_status x panel_status) on PhysicianMember"
        grounds:
          - state_machines.PhysicianMember.credential_status
          - state_machines.PhysicianMember.panel_status
          - entities.PhysicianMember.fields.exit_notice_at
          - entities.PhysicianMember.fields.continuity_of_care_until
          - endpoints.PATCH_/ipa/physicians/{id}/panel-status
        distinguishing_aspect: |
          Non-linearity here is PARALLEL DIMENSIONS on PhysicianMember: two
          independent state variables advance on the same row, and the ACTIVE →
          NOTICE_GIVEN → ACTIVE round trip on the credential dimension is
          asymmetric with respect to the panel dimension — going out it forces
          OPEN to CLOSED_TO_NEW, coming back it explicitly leaves panel_status
          alone. This is a different entity from the cycle instance below and a
          different flavour of non-linearity (two axes, not one loop).
        test_recipe:
          setup:
            - "Agreement AGR_N is ACTIVE with continuity_of_care_days 90 and max_panel_size 10; capitation_posture is CURRENT."
            - "Physician PN has credential_status ACTIVE and panel_status OPEN."
            - "Logical clock is 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Parallel Dimension Health", payer_tax_id: "94-6000006", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 10, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_n: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_n}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_n}/physicians"
              payload: { npi: "6000000001", full_name: "Nina Baptiste", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_n: "$.data.id" }
            - call: "POST /ipa/physicians/${p_n}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_n}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: NetworkManager
          trigger:
            - call: "PATCH /ipa/physicians/${p_n}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_n}/state"
              payload: { to_state: "NOTICE_GIVEN" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_n}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "PATCH /ipa/physicians/${p_n}/panel-status"
              payload: { panel_status: "OPEN" }
              as: NetworkManager
          assert:
            - "after call 1 PhysicianMember.${p_n}.panel_status == \"CLOSED_TO_NEW\" while credential_status is still \"ACTIVE\" — the panel axis moved alone"
            - "after call 2 PhysicianMember.${p_n}.credential_status == \"NOTICE_GIVEN\""
            - "after call 2 PhysicianMember.${p_n}.exit_notice_at == \"2026-03-01T00:00:00Z\""
            - "after call 2 PhysicianMember.${p_n}.continuity_of_care_until == \"2026-05-30T00:00:00Z\" (2026-03-01 plus 90 days)"
            - "after call 2 PhysicianMember.${p_n}.panel_status == \"CLOSED_TO_NEW\" (already closed, so the forced close is a no-op)"
            - "after call 3 PhysicianMember.${p_n}.credential_status == \"ACTIVE\""
            - "after call 3 PhysicianMember.${p_n}.exit_notice_at == null"
            - "after call 3 PhysicianMember.${p_n}.continuity_of_care_until == null"
            - "after call 3 PhysicianMember.${p_n}.panel_status == \"CLOSED_TO_NEW\" — rescinding notice does NOT reopen the panel"
            - "after call 4 PhysicianMember.${p_n}.panel_status == \"OPEN\" and credential_status == \"ACTIVE\""

      - name: downstream_claim_denial_appeal_cycle_and_branch
        shape: "cycle (ADJUDICATED_DENIED -> RECEIVED, capped at 2) plus a branching fork out of RECEIVED"
        grounds:
          - state_machines.DownstreamClaim.ADJUDICATED_DENIED_to_RECEIVED
          - state_machines.DownstreamClaim.RECEIVED_to_ADJUDICATED_APPROVED
          - state_machines.DownstreamClaim.ADJUDICATED_DENIED_to_VOIDED
          - entities.DownstreamClaim.fields.appeal_count
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          Non-linearity here is a CYCLE with a hard loop cap on DownstreamClaim
          (a different entity from the parallel-dimension instance above): the
          denial/appeal loop may be traversed exactly twice, the third appeal is
          refused, and the same RECEIVED state also forks to an approval branch
          that moves the pool ledger while the denial branch never does. What is
          under test is the loop counter and the fork, not two independent axes.
        test_recipe:
          setup:
            - "Agreement AGR_AP is ACTIVE with a PROFESSIONAL RiskPool covering 2026-01-01T00:00:00Z through 2026-12-31T23:59:59Z; one ACTIVE PRIMARY_CARE physician; one ADULT/HMO enrollee assigned from 2026-01-01."
