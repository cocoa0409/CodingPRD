  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: rolling_window_exact_inclusion_boundary
        claim_type: boundary_edge
        grounds: [calculations.usage_rolling_window, "errors[ERR_ISSUANCE_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Rolling window inclusion is age <= window exactly: a vend made 30*24h ago (to the second) still counts against the limit; one second older it drops out."
        test_recipe:
          setup:
            - "GENERAL item CALC-RW base 100; policy limit 2/30d; employee; machine ACTIVE; slot cap 20 par 0 stocked 10"
            - "Vend qty 2 at default clock 2026-05-01T00:00:00Z (uses the whole limit)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RW1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rw: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-RW" }, as: EHSAdministrator, captures: { role_rw: $.data.id } }
            - { call: "POST /items", payload: { sku: "CALC-RW", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_rw: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_rw}", item_id: "${item_rw}", period_limit_qty: 2, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-RW1", full_name: "Tech RW", job_role_id: "${role_rw}", home_cost_center_id: "${cc_rw}" }, as: EHSAdministrator, captures: { emp_rw: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-RW1", site_name: "P13", model: "VM-1" }, as: VendingTechnician, captures: { mach_rw: $.data.id, mach_rw_v: $.data.version } }
            - { call: "POST /machines/${mach_rw}/slots", payload: { slot_code: "A1", item_id: "${item_rw}", capacity: 20, par_level: 0, expected_machine_version: "${mach_rw_v}" }, as: VendingTechnician, captures: { slot_rw: $.data.id } }
            - { call: "PUT /machines/${mach_rw}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rw}", slot_id: "${slot_rw}", qty: 10 }, as: VendingTechnician, captures: { ro_rw: $.data.id } }
            - { call: "POST /restock-orders/${ro_rw}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_rw}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rw}", slot_id: "${slot_rw}", qty: 2, idempotency_key: "rw-1" }, as: Employee, as_user_id: "${emp_rw}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rw}", slot_id: "${slot_rw}", qty: 1, idempotency_key: "rw-2" }, as: Employee, as_user_id: "${emp_rw}", captures: { rw_err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:01Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rw}", slot_id: "${slot_rw}", qty: 1, idempotency_key: "rw-3" }, as: Employee, as_user_id: "${emp_rw}", captures: { rw_ok: $.data.id } }
          assert:
            - "at exactly 30 days of age: prior vend still counted -> error_id == ERR_ISSUANCE_LIMIT_EXCEEDED"
            - "at 30 days + 1 second: prior vend aged out -> vend succeeds (201)"
            - "MachineSlot.${slot_rw}.on_hand_qty == 7 (10 - 2 - 1)"

      - name: contract_price_fallback_to_base_list
        claim_type: correct_result
        grounds: [calculations.contract_price_resolution]
        distinguishing_aspect: "With NO ContractPrice row effective at the vend date, pricing falls back to item.base_list_price_cents (250), and line_total_cents == 250 * qty."
