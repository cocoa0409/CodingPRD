      # Remaining §1.6 codes are triggered elsewhere in this file rather than here:
      #   ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED  -> section validations and section rbac
      #   ERR_INVALID_REQUEST                          -> section entities (required field, bad enum)
      #   ERR_BRIDGE_NOT_FOUND                         -> section entities (not_found) and section validations
      #   ERR_INSPECTION_RECORD_NOT_FOUND              -> section entities (parent_relationships, CRUD delete)
      #   ERR_INSPECTION_DATE_OUT_OF_WINDOW            -> section validations (boundary pair)
      #   ERR_INSPECTION_TYPE_NOT_APPLICABLE           -> section state_machines (dry-structure scour)
      #   ERR_INSPECTION_STATE_INVALID                 -> section state_machines (qa-claim on DRAFT)
      #   ERR_RATING_STATE_INVALID                     -> section state_machines (plan submit from REQUIRED)
      #   ERR_PERMIT_STATE_INVALID, ERR_PERMIT_DECISION_MISMATCH -> section endpoints (analyze, decide)
      #   ERR_PROGRAM_STATE_INVALID                    -> section state_machines (accepted submission is terminal)
      #   ERR_STALE_BRIDGE_VERSION, ERR_STALE_CYCLE_VERSION -> section complexity_layers (optimistic_concurrency)
      - name: submit_with_zero_element_conditions_triggers_no_element_conditions
        excluded_because:
          difficulty_instance: submit_inspection_with_zero_elements_empty_set
          rationale: "ERR_NO_ELEMENT_CONDITIONS is the whole subject of that empty-set instance, which also proves the empty inspection's aggregate fields stay 0.00 rather than dividing by zero."

      - name: load_rating_on_unaccepted_source_triggers_rating_source_not_accepted
        excluded_because:
          difficulty_instance: load_rating_create_requires_accepted_source_inspection
          rationale: "ERR_RATING_SOURCE_NOT_ACCEPTED is triggered there for both a SUBMITTED source inspection and an ACCEPTED inspection belonging to a different bridge."

      - name: submission_with_noncompliant_poa_triggers_scour_critical_poa_missing
        excluded_because:
          difficulty_instance: federal_submission_blocked_by_scour_critical_bridge_without_approved_poa
          rationale: "ERR_SCOUR_CRITICAL_POA_MISSING is triggered there, together with the poa_compliant flip that the scour-critical finalize cascade caused."

      - name: overlapping_team_leader_window_triggers_team_leader_window_conflict
        excluded_because:
          difficulty_instance: team_leader_half_open_window_adjacent_allowed_overlap_rejected
          rationale: "ERR_TEAM_LEADER_WINDOW_CONFLICT is triggered there on the half-open boundary pair - touching windows accepted, one-second overlap rejected."

      - name: window_inside_the_buffer_triggers_bridge_access_buffer_conflict
        excluded_because:
          difficulty_instance: bridge_access_72h_buffer_gap_rejected
          rationale: "ERR_BRIDGE_ACCESS_BUFFER_CONFLICT is triggered there at exactly 72 hours (allowed) and one second inside it (rejected)."

      - name: candidate_cost_over_remaining_triggers_budget_exceeded
        excluded_because:
          difficulty_instance: cycle_state_beats_budget_exceeded
          rationale: "That validation_priority_inversion instance triggers ERR_BUDGET_EXCEEDED after reopening the cycle, and ERR_PROGRAM_STATE_INVALID while it is locked, in one ordered pair."

      - name: unqualified_leader_and_unbalanced_quantities_trigger_their_own_codes
        excluded_because:
          difficulty_instance: team_leader_qualification_beats_element_quantity_mismatch
          rationale: "ERR_TEAM_LEADER_NOT_QUALIFIED and ERR_ELEMENT_QUANTITY_MISMATCH are both triggered there, in the order the ladder mandates, from a single request carrying both faults."

      - name: illegal_finding_transition_triggers_finding_state_invalid
        excluded_because:
          difficulty_instance: critical_finding_independent_status_dimensions
          rationale: "ERR_FINDING_STATE_INVALID is triggered there by resolving before the owner notification and by mitigating a RESOLVED finding."

  # ===========================================================================
  - section: rbac
    instances:
      - name: program_admin_owns_inventory_and_cycle_setup
        claim_type: role_can_perform
        grounds:
          - roles.ProgramAdmin
          - endpoints.POST_personnel
          - endpoints.PATCH_bridges_id
          - endpoints.POST_program_cycles_id_lock
        distinguishing_aspect: "ProgramAdmin is the only opaque-identity role that writes: personnel, inventory, the PATCH that re-derives the inspection intervals, the cycle lifecycle and the logical clock all succeed for it, and every shared GET is open to it too."
        test_recipe:
          setup:
            - "Empty system; the ProgramAdmin caller is opaque (no Personnel row backs it)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "PATCH /bridges/${br_id}"
              payload: { adt: 300, fracture_critical: true }
              as: ProgramAdmin
              captures: { patched_v: $.data.version }
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2027, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED" }
              as: ProgramAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /program-cycles/${pc_id}/lock"
              payload: {}
              as: ProgramAdmin
              captures: { locked_status: $.data.status }
            - call: "POST /program-cycles/${pc_id}/reopen"
              payload: {}
              as: ProgramAdmin
              captures: { reopened_status: $.data.status }
            - call: "GET /personnel/${insp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { read_name: $.data.full_name }
          assert:
            - "All six writes succeed: 201, 201, 200, 201, 200, 200 in that order"
            - "The PATCH returns version 2 and, because fracture_critical became true, Bridge.${br_id}.inspection_interval_months drops to 12 with next_inspection_due_date re-derived from the creation date to 2027-09-01"
            - "ProgramCycle.${pc_id} goes PLANNING -> LOCKED -> PLANNING, ending with status == PLANNING"
            - "The shared GET succeeds for ProgramAdmin, returning Personnel.${insp_id}.full_name == Ivy Inspector"
            - "The ProgramAdmin's X-User-ID never has to name a Personnel row: identity is opaque for this role"

      - name: bridge_inspector_owns_field_capture_and_void
        claim_type: role_can_perform
        grounds:
          - roles.BridgeInspector
          - endpoints.POST_bridges_id_inspections
          - endpoints.PUT_element_conditions_id
          - endpoints.POST_inspections_id_void
        distinguishing_aspect: "The inspector's exclusive set is the whole field-capture surface - open an inspection, add, edit and delete element rows, submit and void it - and its shared grants (critical findings, scour evaluations, plan drafting) work from the same credentials."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector and Cedar Creek Bridge already exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_id: $.data.id }
            - call: "PUT /element-conditions/${ec_id}"
              payload: { total_quantity: 300, cs1_qty: 100, cs2_qty: 100, cs3_qty: 50, cs4_qty: 50, photo_count: 9, defect_notes: "Re-measured after cleaning" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { put_ehi: $.data.element_health_index }
            - call: "POST /critical-findings"
              payload: { bridge_id: "${br_id}", source_inspection_id: "${ins_id}", severity: "IMMEDIATE", description: "Girder web loss threatening collapse", element_condition_id: "${ec_id}" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { cf_id: $.data.id }
            - call: "POST /bridges/${br_id}/scour-evaluations"
              payload: { evaluated_by_id: "${insp_id}", evaluation_method: "FIELD_OBSERVATION", scour_code: 5, foundation_type: "PILE", observed_scour_depth_m: 0.3 }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { se_id: $.data.id }
            - call: "POST /inspections/${ins_id}/void"
              payload: { void_reason: "Access denied by the property owner; re-scope the visit" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { void_status: $.data.status }
          assert:
            - "The inspection create, element create, element PUT, finding create and scour create all succeed for the BridgeInspector role"
            - "The PUT returns element_health_index 66.67, proving the inspector may edit a DRAFT element row"
            - "The shared grants work from inspector credentials: CriticalFinding.${cf_id} exists (a QaReviewer could have filed the same row) and ScourEvaluation.${se_id} is DRAFT (a RatingEngineer could have filed it)"
            - "But the inspector may NOT finalize what it drafted: POST /scour-evaluations/${se_id}/finalize from these credentials is a RatingEngineer-exclusive operation"
            - "The void succeeds with status VOIDED, releasing the 2026-09-02 window for a later inspection"

      - name: qa_reviewer_owns_claim_and_decision
        claim_type: role_can_perform
        grounds:
          - roles.QaReviewer
          - endpoints.POST_inspections_id_qa_claim
          - endpoints.POST_inspections_id_qa_decision
          - endpoints.POST_critical_findings
        distinguishing_aspect: "The QA reviewer's exclusive pair is claim-then-decide, and its RETURN branch pushes the report back to the inspector without touching the Bridge - the reviewer never writes inventory directly, but it does share the critical-finding grant with the inspector."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, advanced to 2026-09-02T12:00:00Z for the submit."
            - "A SUBMITTED three-group ROUTINE inspection of Cedar Creek Bridge led by Ivy Inspector; Quinn Qa is a separate certified reviewer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Qa", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_girder_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
              captures: { claim_status: $.data.status }
            - call: "POST /critical-findings"
              payload: { bridge_id: "${br_id}", source_inspection_id: "${ins_id}", severity: "IMMEDIATE", description: "Reviewer-spotted girder loss requiring immediate action", element_condition_id: "${ec_girder_id}" }
              as: QaReviewer
              as_user_id: "${qa_id}"
              captures: { cf_id: $.data.id }
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "RETURN", return_note: "Quantify the CS4 girder loss by span and re-photograph" }
              as: QaReviewer
              as_user_id: "${qa_id}"
              captures: { decided_status: $.data.status }
          assert:
            - "The claim succeeds with status IN_QA_REVIEW, qa_reviewer_id == ${qa_id} and qa_claimed_at == 2026-09-02T12:00:00Z"
            - "The shared critical-finding grant works from reviewer credentials: CriticalFinding.${cf_id}.severity == IMMEDIATE with Bridge.${br_id}.open_critical_finding_count == 1"
            - "The RETURN decision succeeds with status DRAFT, returned_count == 1 and qa_escalation_required == false (escalation waits for the second return)"
            - "The RETURN wrote nothing to the inventory: Bridge.${br_id}.deck_rating, superstructure_rating and substructure_rating are still the 7/7/7 seeds and last_routine_inspection_date is still null"
            - "The reviewer holds no field-capture grant: adding or editing element rows on ${ins_id} is a BridgeInspector-exclusive operation"

      - name: rating_engineer_owns_scour_finalize_and_rating_creation
        claim_type: role_can_perform
        grounds:
          - roles.RatingEngineer
          - endpoints.POST_bridges_id_scour_evaluations
          - endpoints.POST_scour_evaluations_id_finalize
        distinguishing_aspect: "The rating engineer is the only role that may publish an engineering judgement into the inventory: it shares scour-evaluation drafting with the inspector but holds finalize exclusively, and the finalize is what moves Bridge.scour_status and re-derives the interval."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Rita Rating is licensed (PE-11021); Cedar Creek Bridge spans water."
            - "The engineer's other exclusive operations - load-rating creation and sealing - are driven end to end by the §1.8 instance load_rating_operating_vs_inventory_diverge, which needs an ACCEPTED source inspection this recipe deliberately does not build."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Rita Rating", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", load_rating_engineer_licensed: true, pe_license_number: "PE-11021" }
              as: ProgramAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /bridges/${br_id}/scour-evaluations"
              payload: { evaluated_by_id: "${rita_id}", evaluation_method: "DETAILED_HYDRAULIC", scour_code: 3, foundation_type: "SPREAD_FOOTING", observed_scour_depth_m: 2.1 }
              as: RatingEngineer
              as_user_id: "${rita_id}"
              captures: { se_id: $.data.id }
            - call: "POST /scour-evaluations/${se_id}/finalize"
              payload: {}
              as: RatingEngineer
              as_user_id: "${rita_id}"
              captures: { se_status: $.data.status }
            - call: "GET /bridges/${br_id}"
              payload: {}
              as: RatingEngineer
              captures: { br_v: $.data.version }
          assert:
            - "The scour create succeeds with status DRAFT and derived_scour_status SCOUR_CRITICAL (scour_code 3 is in the <= 3 band)"
            - "The finalize succeeds for RatingEngineer with status FINAL and finalized_at 2026-09-01T00:00:00Z"
            - "Bridge.${br_id}.scour_status becomes SCOUR_CRITICAL, inspection_interval_months is floored at 12 and poa_compliant flips to false"
            - "A PlanOfAction row for ${br_id} now exists in state REQUIRED, created by the cascade rather than by any role"
            - "The engineer reads the bridge through the shared GET, seeing version 2 after its own finalize"

      - name: district_engineer_owns_authority_and_programming_actions
        claim_type: role_can_perform
        grounds:
          - roles.DistrictEngineer
          - endpoints.POST_critical_findings_id_impose_restriction
          - endpoints.POST_critical_findings_id_notify
          - endpoints.POST_critical_findings_id_resolve
        distinguishing_aspect: "The district engineer holds the closure/restriction authority, the notification chain and the whole programming surface: it is the only role that can change a structure's service posture, and its resolve lifts the posture again."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector filed an URGENT finding on Cedar Creek Bridge; Dana District holds the DistrictEngineer role and did not lead the inspection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dana District", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 1, cs3_qty: 3, cs4_qty: 0, photo_count: 2, defect_notes: "Undermined footing face" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_id: $.data.id }
            - call: "POST /critical-findings"
              payload: { bridge_id: "${br_id}", source_inspection_id: "${ins_id}", severity: "URGENT", description: "Abutment undermining after high water", element_condition_id: "${ec_id}" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { cf_id: $.data.id }
          trigger:
            - call: "POST /critical-findings/${cf_id}/impose-restriction"
              payload: { action: "RESTRICT", authorized_by_id: "${dist_id}" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { restricted_action: $.data.restriction_action }
            - call: "POST /critical-findings/${cf_id}/notify"
              payload: { tier: "BRIDGE_OWNER", channel: "PHONE", recipient_label: "County Highway Superintendent" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { note_id: $.data.id }
            - call: "POST /critical-findings/${cf_id}/mitigate"
              payload: { mitigation_note: "Riprap placed and load restricted to 15 tons" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { mitigated_status: $.data.finding_status }
            - call: "POST /critical-findings/${cf_id}/resolve"
              payload: { resolution_note: "Footing underpinned; restriction lifted" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { resolved_status: $.data.finding_status }
          assert:
            - "All four authority actions succeed for DistrictEngineer: restriction_action == RESTRICT, a NotificationLog row ${note_id} is created, then finding_status goes OPEN -> MITIGATED -> RESOLVED"
            - "After the restriction Bridge.${br_id}.service_posture == RESTRICTED and inspection_interval_months is floored at 6"
            - "After the resolve Bridge.${br_id}.open_critical_finding_count == 0, service_posture returns to OPEN and the interval floor is lifted"
            - "The resolve was only legal because the BRIDGE_OWNER tier had been notified - notification_status == OWNER_NOTIFIED at that point"
            - "The engineer's programming grants (candidate creation, program, withdraw, defer) are driven by the errors-section rank-gate recipe and by the §1.8 instance program_then_withdraw_restores_budget_identity from these same credentials"

      - name: permit_officer_owns_the_permit_lifecycle
        claim_type: role_can_perform
        grounds:
          - roles.PermitOfficer
          - endpoints.POST_permit_applications
          - endpoints.POST_permit_applications_id_analyze
          - endpoints.POST_permit_applications_id_decide
