scenario: |
  Legal case management system: case registration with case-type classification
  (civil/criminal/administrative/arbitration), conflict-of-interest check, case number
  assignment, lead-lawyer designation, and intake document archiving; party management
  with multi-role binding (plaintiff/defendant/third-party/witness), identity
  verification, contact information, agency relationship, and party-level access control;
  document templates and approval with template library by case type, variable
  auto-filling, multi-version drafting, multi-level lawyer review, partner sign-off,
  and version locking; court hearing scheduling with court-issued hearing date entry,
  lawyer schedule check, multi-case time-conflict detection, hearing-preparation task
  generation, and rescheduling handling; evidence chain management with evidence
  collection records, evidence-type classification, chain-of-custody tracking, evidence
  cross-reference to case facts, evidence submission to court, and evidence-rebuttal
  records; lawyer time billing with timekeeping by case and task, billable/non-billable
  classification, hourly rate by lawyer role, write-off and adjustment, and bill
  generation; litigation cost calculation with court fee by claim amount and case type,
  attorney fee billing modes (hourly/fixed/contingent), expense reimbursement, cost
  recovery from losing party, and final settlement; event-driven synchronization with
  electronic-court-filing, payment, and document signature systems; audit logging for
  document changes and evidence handling.

domain_name: legal-case-management
api_prefix: /cases

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - temporal_windowing
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lawyer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Lawyer full legal name
        constraints: required, 1..120 chars
      - name: bar_number
        type: string
        source: input
        description: Bar registration number, globally unique
        constraints: required, unique
      - name: role
        type: enum
        source: input
        description: Lawyer rank determining hourly rate and approval authority
        constraints: one of {JUNIOR, SENIOR, PARTNER}
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Default billing rate in cents per hour
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Active or suspended (suspension freezes new case assignments)
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}
      - name: client_history
        type: array
        source: input
        description: Array of prior client_identity_hash values used for conflict checks
        default: []

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: system
        description: Auto-assigned format "<YEAR>-<TYPE_CODE>-<SEQ6>" e.g. "2026-CIV-000123"
        constraints: unique, immutable after creation
      - name: case_type
        type: enum
        source: input
        description: Top-level classification controlling court fee and template library
        constraints: one of {CIVIL, CRIMINAL, ADMINISTRATIVE, ARBITRATION}
      - name: title
        type: string
        source: input
        description: Short case title
        constraints: required, 1..200 chars
      - name: claim_amount_cents
        type: integer
        source: input
        description: Disputed amount in cents (used for court-fee calculation); 0 for criminal/administrative
        default: 0
        constraints: ">= 0"
      - name: lead_lawyer_id
        type: string
        source: input
        description: FK to Lawyer.id; lawyer designated as case lead
        constraints: must reference a Lawyer with status=ACTIVE
      - name: status
        type: enum
        source: system
        description: Case lifecycle state
        default: INTAKE
        constraints: one of {INTAKE, ACTIVE, ON_HOLD, AWAITING_SETTLEMENT, CLOSED, ARCHIVED}
      - name: posture
        type: enum
        source: computed
        description: Derived gate from open evidence-rebuttal and hearing presence
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, FROZEN}
      - name: client_identity_hash
        type: string
        source: input
        description: Stable hash of primary client identity used in conflict-of-interest check
        constraints: required
      - name: opposing_identity_hash
        type: string
        source: input
        description: Stable hash of opposing party identity used in conflict-of-interest check
        constraints: required
      - name: intake_document_id
        type: string
        source: input
        description: Reference to archived intake document (free string id from external archive)
        constraints: required at INTAKE, immutable after first transition
      - name: closed_at
        type: datetime
        source: system
        description: Set when status transitions to CLOSED
        default: null
      - name: settlement_total_cents
        type: integer
        source: computed
        description: Final settlement total computed from FinalSettlement.compute output (see calc final_settlement)
        default: null

  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id; party is bound to one case
        constraints: required
      - name: party_role
        type: enum
        source: input
        description: Role of the party in this case (a single Person can be bound to multiple cases with different roles)
        constraints: one of {PLAINTIFF, DEFENDANT, THIRD_PARTY, WITNESS}
      - name: full_name
        type: string
        source: input
        description: Party legal name
        constraints: required
      - name: id_document_number
        type: string
        source: input
        description: Government-issued identity document number
        constraints: required
      - name: identity_verified
        type: boolean
        source: system
        description: True after POST /parties/{id}/verify-identity succeeds
        default: false
      - name: contact_email
        type: string
        source: input
        description: Primary contact email
        constraints: must match RFC5322 simple email regex
      - name: contact_phone
        type: string
        source: input
        description: Primary contact phone
        constraints: 7..20 chars
      - name: agency_lawyer_id
        type: string
        source: input
        description: Optional FK to Lawyer.id when this party retains representation; null otherwise
        default: null
      - name: access_level
        type: enum
        source: input
        description: Party-level access control determining what case data they can read
        default: STANDARD
        constraints: one of {STANDARD, RESTRICTED, NONE}

  - name: DocumentTemplate
    parent: null
    common_fields: true
    fields:
      - name: template_code
        type: string
        source: input
        description: Stable code, e.g. "CIV-COMPLAINT-V3"
        constraints: unique
      - name: case_type
        type: enum
        source: input
        description: Which case_type the template applies to
        constraints: one of {CIVIL, CRIMINAL, ADMINISTRATIVE, ARBITRATION}
      - name: name
        type: string
        source: input
        description: Human-readable template name
      - name: variables
        type: array
        source: input
        description: Array of variable names auto-filled from Case/Party fields, e.g. ["{{case_number}}","{{plaintiff_name}}"]
        default: []
      - name: body_template
        type: string
        source: input
        description: Template text containing {{variable}} placeholders
      - name: status
        type: enum
        source: system
        description: Template availability
        default: ACTIVE
        constraints: one of {ACTIVE, RETIRED}

  - name: DocumentDraft
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
        constraints: required
      - name: template_id
        type: string
        source: input
        description: FK to DocumentTemplate.id
        constraints: required
      - name: template_version_pinned
        type: integer
        source: system
        description: Template.version copied at draft creation; immutable thereafter
      - name: version_number
        type: integer
        source: system
        description: Sequential per case_id+template_id pair, starts at 1
      - name: rendered_body
        type: string
        source: computed
        description: body_template with variables substituted from Case+Party
      - name: variable_overrides
        type: object
        source: input
        description: Optional map of variable name to override value
        default: {}
      - name: drafter_lawyer_id
        type: string
        source: input
        description: FK to Lawyer.id who created this draft
        constraints: required
      - name: senior_reviewer_lawyer_id
        type: string
        source: system
        description: Lawyer.id of senior who approved at REVIEW step; null until REVIEW pass
        default: null
      - name: partner_signoff_lawyer_id
        type: string
        source: system
        description: Lawyer.id of partner who signed off; null until SIGNED_OFF
        default: null
      - name: signed_off_at
        type: datetime
        source: system
        description: Timestamp partner sign-off occurred
        default: null
      - name: status
        type: enum
        source: system
        description: "Draft lifecycle (cyclic: REVISING can return to DRAFTING)"
        default: DRAFTING
        constraints: one of {DRAFTING, IN_REVIEW, REVISING, SIGNED_OFF, LOCKED, RETIRED}

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
        constraints: required
      - name: court_room
        type: string
        source: input
        description: Court room identifier (resource for overlap detection)
        constraints: required
      - name: scheduled_start
        type: datetime
        source: input
        description: Court-issued hearing start time (UTC ISO 8601)
        constraints: required, must be in future at creation time
      - name: scheduled_end
        type: datetime
        source: input
        description: Court-issued hearing end time
        constraints: required, must be > scheduled_start
      - name: lead_lawyer_id
        type: string
        source: system
        description: Copied from Case.lead_lawyer_id at scheduling; pinned for conflict scope
      - name: status
        type: enum
        source: system
        description: Hearing lifecycle
        default: SCHEDULED
        constraints: one of {SCHEDULED, RESCHEDULED, COMPLETED, CANCELLED}
      - name: prep_tasks_generated
        type: boolean
        source: system
        description: Set true after preparation tasks side-effect runs
        default: false
      - name: previous_hearing_id
        type: string
        source: system
        description: Set on a RESCHEDULED hearing to point at the original it replaces
        default: null

  - name: Evidence
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
        constraints: required
      - name: evidence_type
        type: enum
        source: input
        description: Classification governing chain-of-custody requirements
        constraints: one of {DOCUMENTARY, PHYSICAL, DIGITAL, TESTIMONIAL}
      - name: collected_at
        type: datetime
        source: input
        description: When the evidence was collected
        constraints: required
      - name: collected_by_lawyer_id
        type: string
        source: input
        description: FK to Lawyer.id who collected (or recorded collection of) the evidence
        constraints: required
      - name: case_fact_refs
        type: array
        source: input
        description: Array of free-form case-fact identifiers this evidence supports
        default: []
      - name: status
        type: enum
        source: system
        description: Evidence lifecycle
        default: COLLECTED
        constraints: one of {COLLECTED, SUBMITTED, REBUTTED, EXCLUDED}
      - name: submitted_at
        type: datetime
        source: system
        description: Timestamp of submission to court
        default: null
      - name: rebuttal_count
        type: integer
        source: computed
        description: Count of EvidenceRebuttal rows linked to this evidence
        default: 0

  - name: CustodyEvent
    parent: Evidence
    common_fields: false
    fields:
      - name: evidence_id
        type: string
        source: input
        description: FK to Evidence.id
        constraints: required
      - name: actor_lawyer_id
        type: string
        source: input
        description: FK to Lawyer.id who took custody
        constraints: required
      - name: action
        type: enum
        source: input
        description: Custody event type
        constraints: one of {COLLECTED, TRANSFERRED, EXAMINED, SUBMITTED, RETURNED}
      - name: occurred_at
        type: datetime
        source: input
        description: Wall-clock time of custody event (must be strictly increasing per evidence_id)
        constraints: required
      - name: location
        type: string
        source: input
        description: Physical or logical location of the evidence

  - name: EvidenceRebuttal
    parent: Evidence
    common_fields: false
    fields:
      - name: evidence_id
        type: string
        source: input
        description: FK to Evidence.id being rebutted
        constraints: required
      - name: filed_by_lawyer_id
        type: string
        source: input
        description: FK to Lawyer.id filing the rebuttal
        constraints: required
      - name: ground
        type: string
        source: input
        description: Free-text basis for rebuttal
        constraints: 1..500 chars
      - name: status
        type: enum
        source: system
        description: Rebuttal status
        default: OPEN
        constraints: one of {OPEN, UPHELD, DISMISSED}

  - name: TimeEntry
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
        constraints: required
      - name: lawyer_id
        type: string
        source: input
        description: FK to Lawyer.id who logged the time
        constraints: required
      - name: task_label
        type: string
        source: input
        description: Free-text task description (e.g., "draft motion")
      - name: minutes
        type: integer
        source: input
        description: Time spent in minutes
        constraints: "> 0, <= 1440"
      - name: billable
        type: boolean
        source: input
        description: Billable vs non-billable classification
        default: true
      - name: hourly_rate_cents_pinned
        type: integer
        source: system
        description: Lawyer.hourly_rate_cents copied at entry creation, never recomputed afterwards
      - name: status
        type: enum
        source: system
        description: Entry lifecycle
        default: LOGGED
        constraints: one of {LOGGED, ADJUSTED, WRITTEN_OFF, BILLED}
      - name: adjustment_minutes
        type: integer
        source: system
        description: Signed minute delta applied via PATCH adjust; final billable minutes = minutes + adjustment_minutes (clamped >= 0)
        default: 0

  - name: Bill
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
      - name: billing_mode
        type: enum
        source: input
        description: Attorney-fee mode chosen at bill generation
        constraints: one of {HOURLY, FIXED, CONTINGENT}
      - name: fixed_fee_cents
        type: integer
        source: input
        description: Required when billing_mode=FIXED; ignored otherwise
        default: null
      - name: contingent_rate_bps
        type: integer
        source: input
        description: Required when billing_mode=CONTINGENT; basis points (e.g., 3000 = 30%) of recovered_amount_cents
        default: null
      - name: recovered_amount_cents
        type: integer
        source: input
        description: Amount actually recovered (input for CONTINGENT mode); 0 if loss
        default: 0
      - name: court_fee_cents
        type: integer
        source: computed
        description: Output of calc court_fee (tiered by claim_amount_cents and case_type)
      - name: attorney_fee_cents
        type: integer
        source: computed
        description: Output of calc attorney_fee (depends on billing_mode)
      - name: expense_reimbursement_cents
        type: integer
        source: input
        description: Sum of approved expense reimbursements supplied at bill creation
        default: 0
      - name: cost_recovery_cents
        type: integer
        source: input
        description: Cost recovered from losing party; subtracted from total_due
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: Final total via calc total_due
      - name: status
        type: enum
        source: system
        description: Bill lifecycle
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, PAID, SETTLED, VOIDED}

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: Which entity type the change pertains to (only document and evidence flows are audited)
        constraints: one of {DOCUMENT_DRAFT, EVIDENCE, CUSTODY_EVENT}
      - name: subject_id
        type: string
        source: system
        description: id of the audited entity row
      - name: actor_role
        type: string
        source: system
        description: Acting role from X-User-Role header
      - name: actor_id
        type: string
        source: system
        description: Acting user id from X-User-ID header
      - name: action
        type: string
        source: system
        description: Verb describing what happened (e.g., DRAFT_CREATED, REVIEW_PASSED, EVIDENCE_SUBMITTED)
      - name: payload_snapshot
        type: object
        source: system
        description: Compact JSON snapshot of pre/post field values for the change
      - name: occurred_at
        type: datetime
        source: system
        description: Server-assigned UTC timestamp

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: INTAKE
    terminal_states: [ARCHIVED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /cases/{id}/activate"
        actor: PartnerLawyer
        preconditions:
          - "Case has at least one Party with party_role=PLAINTIFF"
          - "Case has at least one Party with party_role=DEFENDANT"
          - "Case.lead_lawyer_id references a Lawyer with status=ACTIVE"
          - "Conflict-of-interest check passed at registration (recorded on Case)"
        side_effects:
          - "Set Case.posture to OPEN (recompute via calc case_posture)"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /cases/{id}/hold"
        actor: PartnerLawyer
        preconditions:
          - "Case.posture in {OPEN, RESTRICTED}"
        side_effects:
          - "Cancel all Hearing rows with status=SCHEDULED for this case (set status=CANCELLED)"
          - "Reject any future TimeEntry creations until ACTIVE again (validated via state check)"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /cases/{id}/resume"
        actor: PartnerLawyer
        preconditions: ["Case.status == ON_HOLD"]
        side_effects: ["Recompute Case.posture via calc case_posture"]
      - from: ACTIVE
        to: AWAITING_SETTLEMENT
        trigger: "POST /cases/{id}/await-settlement"
        actor: LeadLawyer
        preconditions:
          - "Case.posture == OPEN"
          - "All Hearing rows for case have status in {COMPLETED, CANCELLED}"
        side_effects:
          - "Lock all DocumentDraft rows with status=SIGNED_OFF (transition to LOCKED) for this case"
      - from: AWAITING_SETTLEMENT
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: PartnerLawyer
        preconditions:
          - "Exactly one Bill exists for this case with status in {PAID, SETTLED}"
          - "All Evidence rows have status in {SUBMITTED, EXCLUDED, REBUTTED}"
        side_effects:
          - "Set Case.closed_at = now()"
          - "Compute Case.settlement_total_cents via calc final_settlement"
          - "Transition all OPEN EvidenceRebuttal rows to DISMISSED"
          - "Transition all DocumentDraft rows in {DRAFTING, IN_REVIEW, REVISING} to RETIRED"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /_clock/advance crosses 30 days past Case.closed_at"
        actor: system
        preconditions: ["now() >= Case.closed_at + 30 days"]
        side_effects: ["Case becomes read-only; further mutations rejected with ERR_CASE_ARCHIVED"]

  - entity: DocumentDraft
    initial_state: DRAFTING
    terminal_states: [LOCKED, RETIRED]
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /document-drafts/{id}/submit-for-review"
        actor: DrafterLawyer
        preconditions:
          - "Draft.case_id case is in status ACTIVE"
          - "Draft.rendered_body is non-empty"
        side_effects: ["Audit DOCUMENT_DRAFT REVIEW_SUBMITTED"]
      - from: IN_REVIEW
        to: REVISING
        trigger: "POST /document-drafts/{id}/request-revisions"
        actor: SeniorLawyer
        preconditions:
          - "Acting lawyer.role in {SENIOR, PARTNER}"
          - "Acting lawyer.id != Draft.drafter_lawyer_id"
        side_effects:
          - "Increment DocumentDraft.version_number for the next iteration cycle (creates new revision row on next save)"
          - "Audit DOCUMENT_DRAFT REVIEW_REJECTED"
      - from: REVISING
        to: DRAFTING
        trigger: "POST /document-drafts/{id}/resume-drafting"
        actor: DrafterLawyer
        preconditions: ["Acting lawyer.id == Draft.drafter_lawyer_id"]
        side_effects: ["Audit DOCUMENT_DRAFT REVISION_RESUMED"]
      - from: IN_REVIEW
        to: SIGNED_OFF
        trigger: "POST /document-drafts/{id}/partner-signoff"
        actor: PartnerLawyer
        preconditions:
          - "Acting lawyer.role == PARTNER"
          - "Acting lawyer.id != Draft.drafter_lawyer_id"
          - "Draft.senior_reviewer_lawyer_id is set (review pass occurred)"
        side_effects:
          - "Set Draft.partner_signoff_lawyer_id = acting lawyer"
          - "Set Draft.signed_off_at = now()"
          - "Audit DOCUMENT_DRAFT SIGNED_OFF"
      - from: IN_REVIEW
        to: DRAFTING
        trigger: "POST /document-drafts/{id}/senior-pass"
        actor: SeniorLawyer
        preconditions:
          - "Acting lawyer.role in {SENIOR, PARTNER}"
          - "Acting lawyer.id != Draft.drafter_lawyer_id"
        side_effects:
          - "Set Draft.senior_reviewer_lawyer_id = acting lawyer"
          - "Audit DOCUMENT_DRAFT SENIOR_PASSED"
        note: |
          Senior pass returns to DRAFTING so the drafter can prepare the version for partner-signoff submission.
          A second submit-for-review (still requires senior_reviewer_lawyer_id non-null) routes directly to SIGNED_OFF via partner-signoff.
      - from: SIGNED_OFF
        to: LOCKED
        trigger: "POST /document-drafts/{id}/lock"
        actor: PartnerLawyer
        preconditions: ["Draft.signed_off_at is set"]
        side_effects:
          - "Pin DocumentDraft.template_version_pinned (already set; verified on lock)"
          - "Audit DOCUMENT_DRAFT LOCKED"
          - "Subsequent edits rejected with ERR_DRAFT_LOCKED"
      - from: DRAFTING
        to: RETIRED
        trigger: "Case transitions to CLOSED while draft is non-terminal"
        actor: system
        preconditions: []
        side_effects: ["Audit DOCUMENT_DRAFT RETIRED_BY_CASE_CLOSE"]
      - from: IN_REVIEW
        to: RETIRED
        trigger: "Case transitions to CLOSED while draft is non-terminal"
        actor: system
        preconditions: []
        side_effects: ["Audit DOCUMENT_DRAFT RETIRED_BY_CASE_CLOSE"]
      - from: REVISING
        to: RETIRED
        trigger: "Case transitions to CLOSED while draft is non-terminal"
        actor: system
        preconditions: []
        side_effects: ["Audit DOCUMENT_DRAFT RETIRED_BY_CASE_CLOSE"]

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /hearings/{id}/complete"
        actor: LeadLawyer
        preconditions:
          - "now() >= Hearing.scheduled_end (use POST /_clock/advance to reach)"
          - "Case status in {ACTIVE, AWAITING_SETTLEMENT}"
        side_effects:
          - "Recompute Case.posture via calc case_posture"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /hearings/{id}/reschedule"
        actor: LeadLawyer
        preconditions:
          - "Case status in {ACTIVE, ON_HOLD}"
          - "New (court_room, [scheduled_start, scheduled_end)) does not collide with another SCHEDULED hearing in same court_room"
          - "New (lead_lawyer_id, [scheduled_start, scheduled_end)) does not collide with another SCHEDULED hearing for the same lawyer (multi-case lawyer time-conflict)"
        side_effects:
          - "Create a new Hearing row with status=SCHEDULED, previous_hearing_id=this.id"
          - "Set this.status = RESCHEDULED"
          - "Cascade: regenerate prep tasks on the new hearing (prep_tasks_generated initially false until first GET; system-generated on creation as side effect)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{id}/cancel OR Case transitions ACTIVE→ON_HOLD"
        actor: LeadLawyer | system
        preconditions: []
        side_effects:
          - "Recompute Case.posture via calc case_posture"

  - entity: Evidence
    initial_state: COLLECTED
    terminal_states: [EXCLUDED]
    transitions:
      - from: COLLECTED
        to: SUBMITTED
        trigger: "POST /evidence/{id}/submit"
        actor: LeadLawyer
        preconditions:
          - "Case status == ACTIVE"
          - "Case.posture in {OPEN, RESTRICTED}"
          - "Custody chain is unbroken (every CustodyEvent.occurred_at strictly increasing AND last action != RETURNED)"
          - "Evidence.collected_at <= now()"
        side_effects:
          - "Set Evidence.submitted_at = now()"
          - "Append CustodyEvent (action=SUBMITTED, actor=acting lawyer)"
          - "Audit EVIDENCE EVIDENCE_SUBMITTED"
      - from: SUBMITTED
        to: REBUTTED
        trigger: "First EvidenceRebuttal row created with status=OPEN against this evidence"
        actor: system
        preconditions: ["Evidence.status == SUBMITTED"]
        side_effects:
          - "Increment Evidence.rebuttal_count"
          - "Recompute Case.posture via calc case_posture (may transition OPEN→RESTRICTED)"
          - "Audit EVIDENCE EVIDENCE_REBUTTED"
      - from: REBUTTED
        to: SUBMITTED
        trigger: "All EvidenceRebuttal rows for evidence resolve (status in {UPHELD, DISMISSED})"
        actor: system
        preconditions: []
        side_effects: ["Recompute Case.posture via calc case_posture"]
      - from: SUBMITTED
        to: EXCLUDED
        trigger: "EvidenceRebuttal status transitions OPEN→UPHELD AND it is the latest open rebuttal"
        actor: system
        preconditions: []
        side_effects:
          - "Audit EVIDENCE EVIDENCE_EXCLUDED"
          - "Recompute Case.posture via calc case_posture"
      - from: COLLECTED
        to: EXCLUDED
        trigger: "POST /evidence/{id}/exclude"
        actor: PartnerLawyer
        preconditions: []
        side_effects: ["Audit EVIDENCE EVIDENCE_EXCLUDED"]

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [PAID, SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /bills/{id}/issue"
        actor: PartnerLawyer
        preconditions:
          - "Case.status == AWAITING_SETTLEMENT"
          - "All TimeEntry rows for case have status != LOGGED (must be ADJUSTED, WRITTEN_OFF, or already BILLED)"
        side_effects:
          - "Transition all TimeEntry rows for the case (in status ADJUSTED) to BILLED"
          - "Compute Bill.court_fee_cents, Bill.attorney_fee_cents, Bill.total_due_cents via calcs"
      - from: ISSUED
        to: PAID
        trigger: "POST /_events/payment-received"
        actor: system
        preconditions:
          - "Event.bill_id matches Bill.id"
          - "Event.amount_cents == Bill.total_due_cents"
        side_effects: []
      - from: ISSUED
        to: SETTLED
        trigger: "POST /bills/{id}/mark-settled"
        actor: PartnerLawyer
        preconditions:
          - "Bill.recovered_amount_cents > 0 OR Bill.cost_recovery_cents > 0"
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "POST /bills/{id}/void"
        actor: PartnerLawyer
        preconditions: []
        side_effects:
          - "Revert all BILLED TimeEntry rows back to ADJUSTED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two lawyers simultaneously call partner-signoff on the same DocumentDraft in IN_REVIEW"
    guarantee: "Exactly one signoff succeeds; the second is rejected because draft is no longer IN_REVIEW"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on DocumentDraft.status transition to SIGNED_OFF"

  - scenario: "Two clerks schedule hearings for the same court_room with overlapping time windows"
    guarantee: "First-writer-wins on (court_room, time-window) pair; second receives room conflict"
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Hearing creation against the (court_room, half-open interval) tuple"

  - scenario: "Two clerks schedule hearings for the same lead_lawyer in different rooms with overlapping windows"
    guarantee: "First-writer-wins on (lead_lawyer_id, time-window) pair; second receives lawyer schedule conflict"
    error_id: ERR_LAWYER_SCHEDULE_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Hearing creation against (lead_lawyer_id, half-open interval)"

  - scenario: "Drafter calls senior-pass while another senior calls request-revisions on the same draft simultaneously"
    guarantee: "Exactly one operation wins; the loser sees ERR_INVALID_STATE because the draft already left IN_REVIEW"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on DocumentDraft.status transition out of IN_REVIEW"

  - scenario: "Two payment events arrive for the same bill simultaneously"
    guarantee: "Exactly one payment finalizes Bill.status to PAID; the second is rejected as duplicate"
    error_id: ERR_PAYMENT_DUPLICATE
    http_status: 409
    serialization: "First-writer-wins on Bill.status transition ISSUED→PAID; idempotency key = (bill_id, payment event id)"

  - scenario: "Two CustodyEvent rows posted with the same occurred_at for the same evidence"
    guarantee: "Custody chain requires strictly increasing occurred_at; the second is rejected"
    error_id: ERR_CUSTODY_CHAIN_BROKEN
    http_status: 409
    serialization: "Strict-ordering check on CustodyEvent.occurred_at per evidence_id; ties rejected"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: court_fee
    trigger: "Computed at POST /bills/{id}/issue and recomputed at POST /cases/{id}/close"
    algorithm: tiered_pricing
    formula: |
      # Tiered court fee by case_type and claim_amount_cents.
      # CIVIL/ARBITRATION use a marginal-bracket tier ladder.
      # CRIMINAL/ADMINISTRATIVE use a flat fee independent of claim amount.
      #
      # Evaluation order is FIXED: (1) compute marginal-bracket sum on amount in cents;
      # (2) round the per-bracket subtotal to nearest cent (ROUND_HALF_UP) BEFORE summing;
      # (3) sum the rounded per-bracket subtotals to get the final court fee.
      # Round-each-bracket then sum is the pinned order; sum-then-round is forbidden.
      if case_type == CRIMINAL: return CRIMINAL_FLAT_CENTS
      if case_type == ADMINISTRATIVE: return ADMIN_FLAT_CENTS
      # CIVIL or ARBITRATION:
      remaining = claim_amount_cents
      total = 0
      for (lower, upper, rate_bps) in TIER_LADDER:  # ordered ascending
          slice_cents = max(0, min(remaining, upper - lower))
          if slice_cents == 0: break
          per_bracket = round_half_up(slice_cents * rate_bps / 10000)
          total += per_bracket
          remaining -= slice_cents
      if case_type == ARBITRATION:
          # Arbitration applies a 50% discount to the bracket total, applied AFTER per-bracket rounding
          total = round_half_up(total * 0.5)
      return total
    input_set: "Bill.case_id → Case.case_type and Case.claim_amount_cents"
    constants:
      CRIMINAL_FLAT_CENTS: 50000     # $500
      ADMIN_FLAT_CENTS: 30000        # $300
      TIER_LADDER:                    # (lower_cents, upper_cents, rate_bps)
        - [0, 1000000, 500]           # 0–$10k: 5%
        - [1000000, 10000000, 300]    # $10k–$100k: 3%
        - [10000000, 100000000, 200]  # $100k–$1M: 2%
        - [100000000, 9999999999, 100] # $1M+: 1%
    precision: "round_half_up to nearest cent at each per-bracket step (and once after arbitration discount)"
    variants:
      - name: civil_full
        when: "case_type == CIVIL"
        difference: "Full bracket-ladder result with no discount"
      - name: arbitration_discounted
        when: "case_type == ARBITRATION"
        difference: "Bracket-ladder result is multiplied by 0.5 AFTER per-bracket rounding (different from applying 50% per bracket)"

  - name: attorney_fee
    trigger: "Computed at POST /bills/{id}/issue"
    algorithm: aggregation
    formula: |
      # Three-mode attorney-fee computation:
      if billing_mode == HOURLY:
          # Sum across TimeEntry rows for the case where:
          #   billable == true AND status in {ADJUSTED, BILLED}
          # For each entry, billable_minutes = max(0, minutes + adjustment_minutes)
          # entry_fee = round_half_up(billable_minutes * hourly_rate_cents_pinned / 60)
          # attorney_fee_cents = sum(entry_fee for each entry)  # sum-of-rounded
          # Pinned order: round PER ENTRY first, then sum (NOT sum-then-round).
          return sum_of_per_entry_rounded
      if billing_mode == FIXED:
          return fixed_fee_cents
      if billing_mode == CONTINGENT:
          # round_half_up(recovered_amount_cents * contingent_rate_bps / 10000)
          return round_half_up(recovered_amount_cents * contingent_rate_bps / 10000)
    input_set: "TimeEntry rows where case_id matches AND status in {ADJUSTED, BILLED} AND billable=true (HOURLY only)"
    constants: {}
    precision: "round_half_up per entry then sum (HOURLY); single round_half_up (CONTINGENT); no rounding (FIXED)"
    variants:
      - name: hourly
        when: "billing_mode == HOURLY"
        difference: "Sum of per-entry rounded amounts; rounding-order pinned to per-entry first"
      - name: fixed
        when: "billing_mode == FIXED"
        difference: "Returns fixed_fee_cents verbatim; ignores TimeEntry rows"
      - name: contingent
        when: "billing_mode == CONTINGENT"
        difference: "Single rate-times-recovery with one rounding step"

  - name: total_due
    trigger: "Computed at POST /bills/{id}/issue (and recomputed at issuance retry)"
    algorithm: aggregation
    formula: |
      # Pinned evaluation order:
      # 1) court_fee (already cents-rounded by calc court_fee)
      # 2) attorney_fee (already cents-rounded by calc attorney_fee)
      # 3) expense_reimbursement_cents (input, already in cents, no rounding)
      # 4) cost_recovery_cents (subtracted last)
      # total = court_fee + attorney_fee + expense_reimbursement_cents - cost_recovery_cents
      # If total < 0, clamp to 0.
      return max(0, court_fee_cents + attorney_fee_cents + expense_reimbursement_cents - cost_recovery_cents)
    input_set: "Single Bill row with already-computed court_fee_cents and attorney_fee_cents"
    constants: {}
    precision: "All inputs are already in integer cents; result is exact"
    variants: []

  - name: time_entry_provisional_cost
    trigger: "Returned in GET /cases/{id}/time-entries/summary as provisional running cost"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL view: includes ALL TimeEntry rows where billable=true,
      # regardless of status (LOGGED, ADJUSTED, WRITTEN_OFF, BILLED), using
      # CURRENT Lawyer.hourly_rate_cents (not the pinned rate).
      # This is a forecast for partners' running visibility.
      provisional = 0
      for entry in time_entries(case_id=X, billable=true):
          mins = max(0, entry.minutes + entry.adjustment_minutes)
          rate = Lawyer.hourly_rate_cents (current, NOT entry.hourly_rate_cents_pinned)
          provisional += round_half_up(mins * rate / 60)
      return provisional
    input_set: "All TimeEntry rows for case with billable=true; uses Lawyer.hourly_rate_cents at read time"
    constants: {}
    precision: "round_half_up per entry, then sum"
    variants:
      - name: provisional
        when: "Read via GET summary endpoint"
        difference: "Uses current Lawyer.hourly_rate_cents AND includes WRITTEN_OFF entries"
      - name: final_billed
        when: "Already billed (status=BILLED)"
        difference: "Uses TimeEntry.hourly_rate_cents_pinned AND excludes WRITTEN_OFF entries — see calc attorney_fee"
        # Provisional vs final-billed will diverge when (a) a lawyer's rate has changed
        # since entries were logged, or (b) any entry was written off.

  - name: case_posture
    trigger: "Recomputed on every Evidence/Hearing/Rebuttal mutation that touches the case (auto-derived; not directly settable)"
    algorithm: aggregation
    formula: |
      # case_posture is derived in this priority order:
      # 1) If Case has any Evidence in REBUTTED status → RESTRICTED
      # 2) Else if Case has any SCHEDULED Hearing within 24h of now() → RESTRICTED
      # 3) Else if Case.status == ON_HOLD → FROZEN
      # 4) Else → OPEN
      if exists(Evidence where case_id=C AND status==REBUTTED): return RESTRICTED
      if exists(Hearing where case_id=C AND status==SCHEDULED AND scheduled_start - now() < 24h AND scheduled_start >= now()):
          return RESTRICTED
      if Case.status == ON_HOLD: return FROZEN
      return OPEN
    input_set: "All Evidence and Hearing rows for the case at recompute time"
    constants:
      RESTRICTED_HEARING_WINDOW_HOURS: 24
    precision: "Boolean predicates; no rounding"
    variants: []

  - name: final_settlement
    trigger: "POST /cases/{id}/close"
    algorithm: chronological
    formula: |
      # Final settlement uses CHRONOLOGICAL replay of TimeEntry, expense, and recovery
      # events for the case (TimeEntry.status=BILLED ordered by created_at; then
      # Bill.expense_reimbursement_cents; then Bill.cost_recovery_cents). Each step's
      # running balance is recorded but only the final balance is returned.
      #
      # NOTE: This DIFFERS from total_due (forward_looking aggregation) because:
      #   - chronological: applies cost_recovery at point in time it was recorded,
      #     against the running balance at that time
      #   - aggregation (total_due): subtracts cost_recovery at the end
      # When recoveries change throughout case lifecycle, the chronological replay
      # produces a different final number than the aggregation snapshot.
      balance = 0
      for ev in chronological_events(case_id=C):
          if ev.kind == TIME_ENTRY_BILLED: balance += entry_fee
          elif ev.kind == EXPENSE_ADDED: balance += amount
          elif ev.kind == RECOVERY_RECORDED: balance = max(0, balance - amount)
      balance += court_fee_cents (added at close)
      return balance
    input_set: "Time entries (status=BILLED), expense lines, recovery records, court fee, all ordered by created_at"
    constants: {}
    precision: "Integer cents; chronological clamp on negative interim balance"
    variants:
      - name: chronological_final
        when: "Settlement at POST /cases/{id}/close"
        difference: "Order-sensitive replay; clamps interim negatives to 0 before adding next event"
      - name: forward_looking_total
        when: "Snapshot via Bill.total_due_cents at issuance"
        difference: "Single aggregation: clamps only the final result, not interim balances"

  - name: hearing_prep_tasks
    trigger: "Side effect of POST /hearings (and reschedule); read via GET /hearings/{id}/prep-tasks"
    algorithm: aggregation
    formula: |
      # Generates a deterministic prep-task checklist when a Hearing is created.
      # Tasks are derived from case_type and Evidence count:
      tasks = []
      tasks.append("Confirm court_room and arrival time")
      tasks.append("Brief all Party rows with party_role in {PLAINTIFF, DEFENDANT}")
      if case_type == CIVIL: tasks.append("Prepare civil witness list")
      if case_type == CRIMINAL: tasks.append("Coordinate with prosecution discovery")
      if case_type == ADMINISTRATIVE: tasks.append("File administrative-law brief")
      if case_type == ARBITRATION: tasks.append("Confirm arbitrator panel composition")
      n_submitted = count(Evidence where case_id=C AND status==SUBMITTED)
      tasks.append(f"Re-verify {n_submitted} submitted evidence custody chain")
      return tasks
    input_set: "Case.case_type and Evidence rows with status=SUBMITTED at hearing creation/reschedule time"
    constants: {}
    precision: "Deterministic ordered list"
    variants: []

  - name: case_number_assignment
    trigger: "POST /cases (case registration)"
    algorithm: aggregation
    formula: |
      # case_number = "<YEAR>-<TYPE_CODE>-<SEQ6>"
      # YEAR: current UTC year
      # TYPE_CODE: { CIVIL: "CIV", CRIMINAL: "CRM", ADMINISTRATIVE: "ADM", ARBITRATION: "ARB" }
      # SEQ6: zero-padded sequence per (YEAR, TYPE_CODE) starting at 000001 and monotonically increasing
      # Concurrent inserts MUST serialize on (YEAR, TYPE_CODE) so seq is gap-free
      year = utc_year(now())
      type_code = {CIVIL:"CIV", CRIMINAL:"CRM", ADMINISTRATIVE:"ADM", ARBITRATION:"ARB"}[case_type]
      seq = next_seq_for(year, type_code)  # serialized
      return f"{year}-{type_code}-{seq:06d}"
    input_set: "Case.case_type and current UTC year"
    constants: {}
    precision: "Integer, zero-padded to 6 digits"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced FK ids (lead_lawyer_id, case_id, template_id, etc.) resolve to existing rows"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Conflict-of-interest: at POST /cases, lead_lawyer.client_history must NOT contain Case.opposing_identity_hash"
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: ["POST /cases"]

  - priority: 6
    category: business_referential
    check: "Conflict-of-interest secondary: at POST /cases, Case.client_identity_hash != Case.opposing_identity_hash"
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: ["POST /cases"]

  - priority: 7
    category: state
    check: "Target resource is in correct state for requested transition (e.g., Case.status, DocumentDraft.status, Hearing.status, Evidence.status, Bill.status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all

  - priority: 8
    category: state
    check: "Case is not ARCHIVED"
    error_id: ERR_CASE_ARCHIVED
    http_status: 409
    applies_to: ["all mutations on Case-scoped sub-resources"]

  - priority: 9
    category: business_safety
    check: "Segregation of duties: DocumentDraft drafter cannot perform senior-pass, request-revisions, partner-signoff, or lock on their own draft"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /document-drafts/{id}/senior-pass", "POST /document-drafts/{id}/request-revisions", "POST /document-drafts/{id}/partner-signoff", "POST /document-drafts/{id}/lock"]

  - priority: 10
    category: business_safety
    check: "Custody chain integrity: every CustodyEvent.occurred_at must be strictly greater than the previous CustodyEvent.occurred_at for the same evidence_id"
    error_id: ERR_CUSTODY_CHAIN_BROKEN
    http_status: 409
    applies_to: ["POST /evidence/{id}/custody-events", "POST /evidence/{id}/submit"]

  - priority: 11
    category: business_temporal
    check: "Hearing.scheduled_end > Hearing.scheduled_start"
    error_id: ERR_HEARING_INVALID_INTERVAL
    http_status: 422
    applies_to: ["POST /hearings", "POST /hearings/{id}/reschedule"]

  - priority: 12
    category: business_temporal
    check: "Hearing.scheduled_start > now() at creation/reschedule time"
    error_id: ERR_HEARING_PAST_TIME
    http_status: 422
    applies_to: ["POST /hearings", "POST /hearings/{id}/reschedule"]

  - priority: 13
    category: business_constraint
    check: "Court room overlap: half-open intervals [scheduled_start, scheduled_end) on the same court_room with status=SCHEDULED MUST NOT overlap; same start-time-equals-prev-end (touching) IS allowed"
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    applies_to: ["POST /hearings", "POST /hearings/{id}/reschedule"]

  - priority: 14
    category: business_constraint
    check: "Lead lawyer schedule overlap: half-open intervals [scheduled_start, scheduled_end) on the same lead_lawyer_id MUST be separated by a 30-minute travel buffer (i.e., next.scheduled_start >= prev.scheduled_end + 30 minutes); cross-case detection"
    error_id: ERR_LAWYER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: ["POST /hearings", "POST /hearings/{id}/reschedule"]

  - priority: 15
    category: business_constraint
    check: "Identity verification: Party.identity_verified must be true before Party may be referenced in DocumentDraft.variable_overrides or be a Hearing witness"
    error_id: ERR_PARTY_NOT_VERIFIED
    http_status: 409
    applies_to: ["POST /document-drafts", "POST /hearings"]

  - priority: 16
    category: business_constraint
    check: "Posture gate: Case.posture == FROZEN forbids creating new TimeEntry, Evidence, Hearing, or DocumentDraft"
    error_id: ERR_CASE_POSTURE_FROZEN
    http_status: 409
    applies_to: ["POST /cases/{id}/time-entries", "POST /evidence", "POST /hearings", "POST /document-drafts"]

  - priority: 17
    category: business_constraint
    check: "Template case_type must match Case.case_type at draft creation"
    error_id: ERR_TEMPLATE_CASE_TYPE_MISMATCH
    http_status: 422
    applies_to: ["POST /document-drafts"]

  - priority: 18
    category: business_constraint
    check: "Reviewer rank: senior-pass and request-revisions require acting Lawyer.role in {SENIOR, PARTNER}; partner-signoff requires Lawyer.role == PARTNER"
    error_id: ERR_REVIEWER_RANK_INSUFFICIENT
    http_status: 403
    applies_to: ["POST /document-drafts/{id}/senior-pass", "POST /document-drafts/{id}/request-revisions", "POST /document-drafts/{id}/partner-signoff"]

  - priority: 19
    category: business_fiscal
    check: "Bill creation: billing_mode=FIXED requires fixed_fee_cents > 0; CONTINGENT requires contingent_rate_bps in [1, 5000] (max 50%)"
    error_id: ERR_BILLING_MODE_INVALID
    http_status: 422
    applies_to: ["POST /cases/{id}/bills"]

  - priority: 20
    category: business_fiscal
    check: "TimeEntry adjustment: adjustment_minutes must result in (minutes + adjustment_minutes) >= 0 and <= 1440"
    error_id: ERR_TIME_ENTRY_ADJUSTMENT_INVALID
    http_status: 422
    applies_to: ["PATCH /time-entries/{id}/adjust"]

  - priority: 21
    category: business_fiscal
    check: "Court-fee precondition: claim_amount_cents must be 0 for CRIMINAL and ADMINISTRATIVE, > 0 for CIVIL and ARBITRATION"
    error_id: ERR_CLAIM_AMOUNT_INVALID
    http_status: 422
    applies_to: ["POST /cases"]

  - priority: 22
    category: business_referential
    check: "Document signature event: payload bill_id must match the Bill.id referenced and event signature_kind must be one of {DRAFT_LOCKED, BILL_ISSUED}"
    error_id: ERR_EVENT_PAYLOAD_INVALID
    http_status: 422
    applies_to: ["POST /_events/document-signed"]

  - priority: 23
    category: business_referential
    check: "Payment event: amount_cents must equal Bill.total_due_cents and bill_id must reference a Bill in status=ISSUED"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /_events/payment-received"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Cases -----
  - method: POST
    path: /cases
    description: Register a new case (intake). Triggers conflict-of-interest check and case-number assignment.
    roles: [PartnerLawyer, IntakeClerk]
    code: 201
    input: [case_type, title, claim_amount_cents, lead_lawyer_id, client_identity_hash, opposing_identity_hash, intake_document_id]
    output: Case
    side_effects:
      - "Run conflict-of-interest check (validations 5 and 6)"
      - "Assign case_number via calc case_number_assignment"
      - "Set Case.posture = OPEN (initial)"

  - method: GET
    path: /cases/{id}
    description: Read case
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer, IntakeClerk]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: /cases
    description: List cases with filters (status, case_type, lead_lawyer_id)
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer, IntakeClerk]
    code: 200
    input: ["status?", "case_type?", "lead_lawyer_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: /cases/{id}/activate
    description: Transition INTAKE → ACTIVE
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Case
    side_effects: ["Recompute Case.posture"]

  - method: POST
    path: /cases/{id}/hold
    description: Transition ACTIVE → ON_HOLD
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Case
    side_effects: ["Cancel all SCHEDULED Hearings (cascade)", "Recompute Case.posture"]

  - method: POST
    path: /cases/{id}/resume
    description: Transition ON_HOLD → ACTIVE
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Case
    side_effects: ["Recompute Case.posture"]

  - method: POST
    path: /cases/{id}/await-settlement
    description: Transition ACTIVE → AWAITING_SETTLEMENT; locks signed-off drafts
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: Case
    side_effects: ["Lock all SIGNED_OFF DocumentDraft rows for this case (transition LOCKED)"]

  - method: POST
    path: /cases/{id}/close
    description: Transition AWAITING_SETTLEMENT → CLOSED; computes final settlement
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Compute Case.settlement_total_cents via calc final_settlement"
      - "Retire non-terminal DocumentDrafts (cascade)"
      - "Dismiss OPEN EvidenceRebuttals (cascade)"

  # ----- Parties -----
  - method: POST
    path: /cases/{caseId}/parties
    description: Add a party to a case (multi-role binding)
    roles: [IntakeClerk, PartnerLawyer, SeniorLawyer]
    code: 201
    input: [party_role, full_name, id_document_number, contact_email, contact_phone, "agency_lawyer_id?", "access_level?"]
    output: Party
    side_effects: []

  - method: POST
    path: /parties/{id}/verify-identity
    description: Mark party identity_verified=true after document check
    roles: [IntakeClerk, PartnerLawyer]
    code: 200
    input: []
    output: Party
    side_effects: []

  - method: GET
    path: /cases/{caseId}/parties
    description: List parties on a case
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer, IntakeClerk]
    code: 200
    input: ["party_role?", "limit?", "offset?"]
    output: Party[]
    side_effects: []

  # ----- Document Templates -----
  - method: POST
    path: /document-templates
    description: Register a new template
    roles: [PartnerLawyer]
    code: 201
    input: [template_code, case_type, name, variables, body_template]
    output: DocumentTemplate
    side_effects: []

  - method: GET
    path: /document-templates
    description: List templates
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 200
    input: ["case_type?", "status?", "limit?", "offset?"]
    output: DocumentTemplate[]
    side_effects: []

  # ----- Document Drafts -----
  - method: POST
    path: /document-drafts
    description: Create a new draft (auto-fills variables; pins template version)
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 201
    input: [case_id, template_id, drafter_lawyer_id, "variable_overrides?"]
    output: DocumentDraft
    side_effects:
      - "Pin DocumentDraft.template_version_pinned = DocumentTemplate.version at creation"
      - "Render rendered_body from template + Case + Party + variable_overrides"
      - "Audit DOCUMENT_DRAFT DRAFT_CREATED"

  - method: POST
    path: /document-drafts/{id}/submit-for-review
    description: DRAFTING → IN_REVIEW
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: []

  - method: POST
    path: /document-drafts/{id}/senior-pass
    description: IN_REVIEW → DRAFTING (senior pass; segregation enforced)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: ["Set senior_reviewer_lawyer_id"]

  - method: POST
    path: /document-drafts/{id}/request-revisions
    description: IN_REVIEW → REVISING (cyclic)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: []

  - method: POST
    path: /document-drafts/{id}/resume-drafting
    description: REVISING → DRAFTING (drafter only)
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: []

  - method: POST
    path: /document-drafts/{id}/partner-signoff
    description: IN_REVIEW → SIGNED_OFF (partner only)
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: ["Set partner_signoff_lawyer_id and signed_off_at"]

  - method: POST
    path: /document-drafts/{id}/lock
    description: SIGNED_OFF → LOCKED (immutable)
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: ["Audit DOCUMENT_DRAFT LOCKED"]

  - method: GET
    path: /document-drafts/{id}
    description: Read draft (with rendered_body)
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 200
    input: []
    output: DocumentDraft
    side_effects: []

  # ----- Hearings -----
  - method: POST
    path: /hearings
    description: Schedule a hearing (court-issued date)
    roles: [PartnerLawyer, SeniorLawyer, IntakeClerk]
    code: 201
    input: [case_id, court_room, scheduled_start, scheduled_end]
    output: Hearing
    side_effects:
      - "Pin lead_lawyer_id from Case"
      - "Generate prep tasks via calc hearing_prep_tasks (set prep_tasks_generated=true)"
      - "Recompute Case.posture (may transition OPEN→RESTRICTED if within 24h)"

  - method: POST
    path: /hearings/{id}/reschedule
    description: Reschedule (creates new hearing pointing back via previous_hearing_id)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 201
    input: [court_room, scheduled_start, scheduled_end]
    output: Hearing
    side_effects: ["Set this.status=RESCHEDULED", "Regenerate prep tasks on new hearing"]

  - method: POST
    path: /hearings/{id}/cancel
    description: SCHEDULED → CANCELLED
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: Hearing
    side_effects: ["Recompute Case.posture"]

  - method: POST
    path: /hearings/{id}/complete
    description: SCHEDULED → COMPLETED (after scheduled_end)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: Hearing
    side_effects: ["Recompute Case.posture"]

  - method: GET
    path: /hearings/{id}/prep-tasks
    description: Read prep-task checklist (deterministic from calc hearing_prep_tasks)
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: GET
    path: /cases/{caseId}/hearings
    description: List hearings on a case
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer, IntakeClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []

  # ----- Evidence & Custody -----
  - method: POST
    path: /evidence
    description: Record an evidence collection
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 201
    input: [case_id, evidence_type, collected_at, collected_by_lawyer_id, "case_fact_refs?"]
    output: Evidence
    side_effects:
      - "Append CustodyEvent (action=COLLECTED, actor=collected_by_lawyer_id, occurred_at=collected_at)"
      - "Audit EVIDENCE EVIDENCE_COLLECTED"

  - method: POST
    path: /evidence/{id}/custody-events
    description: Append a custody-chain event
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 201
    input: [actor_lawyer_id, action, occurred_at, location]
    output: CustodyEvent
    side_effects: ["Audit CUSTODY_EVENT CUSTODY_APPENDED"]

  - method: POST
    path: /evidence/{id}/submit
    description: COLLECTED → SUBMITTED (to court)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: Evidence
    side_effects:
      - "Set submitted_at=now()"
      - "Append CustodyEvent (action=SUBMITTED)"
      - "Audit EVIDENCE EVIDENCE_SUBMITTED"

  - method: POST
    path: /evidence/{id}/exclude
    description: COLLECTED → EXCLUDED (partner-only veto)
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Evidence
    side_effects: ["Audit EVIDENCE EVIDENCE_EXCLUDED"]

  - method: POST
    path: /evidence/{id}/rebuttals
    description: File a rebuttal against a SUBMITTED evidence
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 201
    input: [filed_by_lawyer_id, ground]
    output: EvidenceRebuttal
    side_effects:
      - "Increment Evidence.rebuttal_count"
      - "If first rebuttal: Evidence.status SUBMITTED→REBUTTED"
      - "Recompute Case.posture (may go OPEN→RESTRICTED)"

  - method: POST
    path: /rebuttals/{id}/uphold
    description: Mark rebuttal as UPHELD (excludes evidence)
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: EvidenceRebuttal
    side_effects:
      - "If latest open rebuttal: Evidence.status SUBMITTED→EXCLUDED OR REBUTTED→EXCLUDED"
      - "Recompute Case.posture"

  - method: POST
    path: /rebuttals/{id}/dismiss
    description: Mark rebuttal as DISMISSED
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: EvidenceRebuttal
    side_effects:
      - "If all rebuttals resolved AND evidence in REBUTTED: Evidence.status REBUTTED→SUBMITTED"
      - "Recompute Case.posture"

  - method: GET
    path: /evidence/{id}
    description: Read evidence with custody chain
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 200
    input: []
    output: Evidence
    side_effects: []

  # ----- Time Entries & Bills -----
  - method: POST
    path: /cases/{caseId}/time-entries
    description: Log a time entry on a case (rate pinned at creation)
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer]
    code: 201
    input: [lawyer_id, task_label, minutes, billable]
    output: TimeEntry
    side_effects: ["Pin TimeEntry.hourly_rate_cents_pinned = Lawyer.hourly_rate_cents at creation time"]

  - method: PATCH
    path: /time-entries/{id}/adjust
    description: Apply adjustment_minutes (LOGGED→ADJUSTED)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: [adjustment_minutes]
    output: TimeEntry
    side_effects: []

  - method: POST
    path: /time-entries/{id}/write-off
    description: LOGGED|ADJUSTED→WRITTEN_OFF
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: /cases/{caseId}/time-entries/summary
    description: Provisional running cost (calc time_entry_provisional_cost)
    roles: [PartnerLawyer, SeniorLawyer]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: /cases/{caseId}/bills
    description: Create a bill (DRAFT)
    roles: [PartnerLawyer]
    code: 201
    input: [billing_mode, "fixed_fee_cents?", "contingent_rate_bps?", "recovered_amount_cents?", "expense_reimbursement_cents?", "cost_recovery_cents?"]
    output: Bill
    side_effects: []

  - method: POST
    path: /bills/{id}/issue
    description: DRAFT → ISSUED; computes court_fee, attorney_fee, total_due
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Bill
    side_effects:
      - "Compute Bill.court_fee_cents via calc court_fee"
      - "Compute Bill.attorney_fee_cents via calc attorney_fee"
      - "Compute Bill.total_due_cents via calc total_due"
      - "Transition all ADJUSTED TimeEntries on case to BILLED"

  - method: POST
    path: /bills/{id}/mark-settled
    description: ISSUED → SETTLED
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Bill
    side_effects: []

  - method: POST
    path: /bills/{id}/void
    description: DRAFT → VOIDED; reverts BILLED entries
    roles: [PartnerLawyer]
    code: 200
    input: []
    output: Bill
    side_effects: ["Revert all BILLED TimeEntries on case back to ADJUSTED"]

  # ----- Lawyers -----
  - method: POST
    path: /lawyers
    description: Register a lawyer
    roles: [PartnerLawyer]
    code: 201
    input: [full_name, bar_number, role, hourly_rate_cents, "client_history?"]
    output: Lawyer
    side_effects: []

  - method: GET
    path: /lawyers/{id}
    description: Read lawyer
    roles: [PartnerLawyer, SeniorLawyer, JuniorLawyer, IntakeClerk]
    code: 200
    input: []
    output: Lawyer
    side_effects: []

  # ----- External event sync -----
  - method: POST
    path: /_events/payment-received
    description: External payment system event; transitions Bill ISSUED→PAID
    roles: [SystemIntegrator]
    code: 200
    input: [bill_id, amount_cents, external_payment_id]
    output: Bill
    side_effects: ["Transition Bill ISSUED→PAID if amount matches"]

  - method: POST
    path: /_events/document-signed
    description: External signature system event; logs signature against a SIGNED_OFF or LOCKED draft
    roles: [SystemIntegrator]
    code: 200
    input: [draft_id, signature_kind, external_signature_id]
    output: object
    side_effects: ["Audit DOCUMENT_DRAFT EXTERNAL_SIGNATURE_RECORDED"]

  - method: POST
    path: /_events/court-filed
    description: External electronic-court-filing event; records that an evidence submission was acknowledged by the court
    roles: [SystemIntegrator]
    code: 200
    input: [evidence_id, court_filing_id]
    output: object
    side_effects: ["Audit EVIDENCE COURT_FILED"]

  # ----- Audit log -----
  - method: GET
    path: /audit-logs
    description: Read audit log (filter by subject_type, subject_id, actor_id)
    roles: [PartnerLawyer]
    code: 200
    input: ["subject_type?", "subject_id?", "actor_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # ----- Test-driving endpoints (clock + sweep) -----
  - method: POST
    path: /_clock/advance
    description: Advance server clock to a target ISO 8601 timestamp; triggers any time-gated transitions in scope (Case→ARCHIVED after 30 days closed, Hearing.complete eligibility)
    roles: [SystemIntegrator]
    code: 200
    input: [target_timestamp]
    output: object
    side_effects:
      - "Auto-transition Case CLOSED→ARCHIVED for any case where now() >= closed_at + 30 days"
      - "Recompute case_posture for cases with hearings whose 24h window status flipped"

  - method: POST
    path: /_sweep/run
    description: Force-run scheduled sweeps (used by tests instead of waiting; idempotent at any clock time)
    roles: [SystemIntegrator]
    code: 200
    input: []
    output: object
    side_effects: ["Re-run all auto-transition checks: Case archival, evidence-rebuttal resolution cascades, posture recomputation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role and/or X-User-ID headers missing"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not in endpoint's authorized_roles"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource referenced by path id does not exist"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "FK in request body does not resolve to existing row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state permitting this transition"
  - id: ERR_CASE_ARCHIVED
    http: 409
    condition: "Mutation attempted on a Case (or sub-resource) where Case.status == ARCHIVED"
  - id: ERR_CASE_POSTURE_FROZEN
    http: 409
    condition: "Operation forbidden because Case.posture == FROZEN"
  - id: ERR_CONFLICT_OF_INTEREST
    http: 409
    condition: "Lead lawyer has prior representation of opposing identity, or client/opposing identities collide"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Drafter attempted to review/sign-off/lock their own DocumentDraft"
  - id: ERR_REVIEWER_RANK_INSUFFICIENT
    http: 403
    condition: "Acting Lawyer.role does not meet rank requirement (SENIOR for review, PARTNER for signoff)"
  - id: ERR_DRAFT_LOCKED
    http: 409
    condition: "Mutation attempted on a DocumentDraft in LOCKED status"
  - id: ERR_TEMPLATE_CASE_TYPE_MISMATCH
    http: 422
    condition: "DocumentTemplate.case_type does not match Case.case_type at draft creation"
  - id: ERR_HEARING_INVALID_INTERVAL
    http: 422
    condition: "Hearing.scheduled_end <= scheduled_start"
  - id: ERR_HEARING_PAST_TIME
    http: 422
    condition: "Hearing.scheduled_start <= now() at creation/reschedule time"
  - id: ERR_HEARING_ROOM_CONFLICT
    http: 409
    condition: "Half-open interval [start,end) overlaps another SCHEDULED hearing in same court_room"
  - id: ERR_LAWYER_SCHEDULE_CONFLICT
    http: 409
    condition: "Half-open interval [start,end) plus 30-min travel buffer overlaps another SCHEDULED hearing for same lead_lawyer_id (across cases)"
  - id: ERR_PARTY_NOT_VERIFIED
    http: 409
    condition: "Party.identity_verified is false but party referenced in document or hearing"
  - id: ERR_CUSTODY_CHAIN_BROKEN
    http: 409
    condition: "CustodyEvent.occurred_at is not strictly greater than the previous CustodyEvent for same evidence_id"
  - id: ERR_BILLING_MODE_INVALID
    http: 422
    condition: "Bill billing_mode parameters invalid (e.g., FIXED without fixed_fee_cents)"
  - id: ERR_TIME_ENTRY_ADJUSTMENT_INVALID
    http: 422
    condition: "Adjusted minutes (minutes + adjustment_minutes) is < 0 or > 1440"
  - id: ERR_CLAIM_AMOUNT_INVALID
    http: 422
    condition: "Case.claim_amount_cents must be 0 for CRIMINAL/ADMINISTRATIVE; > 0 for CIVIL/ARBITRATION"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "Payment event amount_cents does not equal Bill.total_due_cents or bill not in ISSUED"
  - id: ERR_PAYMENT_DUPLICATE
    http: 409
    condition: "Second payment-received event for same bill_id while bill is no longer ISSUED"
  - id: ERR_EVENT_PAYLOAD_INVALID
    http: 422
    condition: "External event payload missing required fields or signature_kind not in {DRAFT_LOCKED, BILL_ISSUED}"
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "Optimistic concurrency: provided version does not match server-stored version on PUT/PATCH"
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Generic input validation failure (type, length, regex)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PartnerLawyer
    description: Partner-rank lawyer; sole role for partner-signoff, lock, void, mark-settled, exclude-evidence, and case close
    identity: "entity_backed:Lawyer"
    exclusive_operations:
      - "POST /document-drafts/{id}/partner-signoff"
      - "POST /document-drafts/{id}/lock"
      - "POST /bills/{id}/void"
      - "POST /bills/{id}/mark-settled"
      - "POST /evidence/{id}/exclude"
      - "POST /rebuttals/{id}/uphold"
      - "POST /cases/{id}/close"
      - "POST /cases/{id}/activate"
      - "POST /cases/{id}/hold"
      - "POST /cases/{id}/resume"
      - "POST /lawyers"
      - "POST /document-templates"
      - "POST /cases/{caseId}/bills"
      - "POST /bills/{id}/issue"
      - "POST /time-entries/{id}/write-off"
      - "GET /audit-logs"
    shared_operations:
      - "All read endpoints"
      - "POST /cases (with IntakeClerk)"
      - "POST /document-drafts and review actions (with SeniorLawyer/JuniorLawyer per validation 18)"
      - "POST /hearings, /reschedule, /cancel, /complete (with SeniorLawyer/IntakeClerk)"
      - "POST /evidence, /custody-events, /rebuttals (with SeniorLawyer/JuniorLawyer)"
      - "POST /cases/{caseId}/time-entries (with SeniorLawyer/JuniorLawyer)"
      - "PATCH /time-entries/{id}/adjust (with SeniorLawyer)"
      - "POST /parties/{id}/verify-identity (with IntakeClerk)"
      - "POST /cases/{id}/await-settlement (with SeniorLawyer)"

  - name: SeniorLawyer
    description: Senior-rank lawyer; can pass review and request revisions but cannot partner-signoff
    identity: "entity_backed:Lawyer"
    exclusive_operations: []
    shared_operations:
      - "POST /document-drafts/{id}/senior-pass (with PartnerLawyer)"
      - "POST /document-drafts/{id}/request-revisions (with PartnerLawyer)"
      - "POST /rebuttals/{id}/dismiss (with PartnerLawyer)"
      - "POST /document-drafts and /submit-for-review and /resume-drafting"
      - "POST /hearings, /reschedule, /cancel, /complete"
      - "POST /evidence, /custody-events, /rebuttals, /submit"
      - "POST /cases/{caseId}/time-entries"
      - "PATCH /time-entries/{id}/adjust"
      - "POST /cases/{caseId}/parties"
      - "POST /cases/{id}/await-settlement"
      - "GET endpoints across cases, parties, drafts, hearings, evidence, time-entries"

  - name: JuniorLawyer
    description: Junior-rank lawyer; can draft documents, log time, collect evidence, file rebuttals, but cannot review or approve
    identity: "entity_backed:Lawyer"
    exclusive_operations: []
    shared_operations:
      - "POST /document-drafts and /submit-for-review and /resume-drafting"
      - "POST /evidence and /custody-events and /rebuttals"
      - "POST /cases/{caseId}/time-entries"
      - "GET endpoints across cases, parties, drafts, hearings, evidence, time-entries"

  - name: IntakeClerk
    description: Non-lawyer staff who handle case intake and party administration
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cases (with PartnerLawyer)"
      - "POST /cases/{caseId}/parties (with lawyers)"
      - "POST /parties/{id}/verify-identity (with PartnerLawyer)"
      - "POST /hearings (with lawyers)"
      - "GET endpoints across cases, parties, hearings"

  - name: SystemIntegrator
    description: External-system integration role used for event-driven sync (court filings, payments, signatures) and test-driving endpoints
    identity: "opaque"
    exclusive_operations:
      - "POST /_events/payment-received"
      - "POST /_events/document-signed"
      - "POST /_events/court-filed"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations: []
