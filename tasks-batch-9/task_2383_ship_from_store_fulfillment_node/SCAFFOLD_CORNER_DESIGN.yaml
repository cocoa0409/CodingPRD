              payload: { store_id: "${s1}", carrier_code: "ACME" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/carrier-pickups"
              payload: { store_id: "${s3}" }
              as: NetworkPlanner
          assert:
            - "HTTP 201 with CarrierPickup.${pk1}.store_id == ${s1}, carrier_code ACME, parcel_capacity 3, status SCHEDULED, reserved_parcels 0"
            - "${err_store_nf} == ERR_STORE_NOT_FOUND with HTTP 404 and no orphan pickup row is created"
            - "GET /carrier-pickups?store_id=${s1}&carrier_code=ACME returns exactly the 1 row ${pk1} with total_count 1"
            - "GET /carrier-pickups?store_id=${s3} returns 0 rows: the window at S1 is not visible under the sibling node"

      - name: commit_is_refused_by_the_cost_guardrail_unless_overridden
        claim_type: conditional_action
        grounds:
          - validations.priority_50
          - errors.ERR_COST_INDEX_GUARDRAIL
          - endpoints.POST /fulfillment-network/orders/{order_id}/routing-runs
        distinguishing_aspect: "The same run endpoint is conditionally allowed: a projected cost_index of 17506 bps refuses COMMIT with 422 ERR_COST_INDEX_GUARDRAIL, is never blocked in PROVISIONAL mode, and is admitted by override_cost_guardrail true, which persists guardrail_overridden true on the run."
        test_recipe:
          setup:
            - "Clock 09:00; node S2-HARBOR (hazmat_certified true, origin_zone 5, capacity 60, staffed 300) is the only node; SKU-H (1200 g, hazmat) stocked 22 on hand / 2 safety, so ATP is 20."
            - "Order O1 has one line SKU-H x20 to destination zone 1 with service_level EXPEDITED, whose projected store cost 6740 is far above the DC baseline 3850."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S2-HARBOR", region_code: "EAST", origin_zone: 5, daily_unit_capacity: 60, staffed_labor_minutes: 300, labor_standard_minutes_per_order: 15, pick_labor_minutes_per_unit: 4, labor_rate_cents_per_minute: 38, cutoff_utc_minutes: 1080, hazmat_certified: true }
              as: NetworkPlanner
              captures: { s2: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-H", unit_weight_grams: 1200, unit_price_cents: 6900, package_class: "LARGE", hazmat_flag: true }
              as: NetworkPlanner
              captures: { sku_h: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s2}", sku_id: "${sku_h}", on_hand_units: 22, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-C001", customer_ref: "C-401", destination_zone: 1, service_level: "EXPEDITED", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_h}", quantity: 20, unit_price_cents: 6900 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "PROVISIONAL", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v2: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v2}" }
              as: NetworkPlanner
              captures: { err_guardrail: "$.data.error_id" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v2}", override_cost_guardrail: true }
              as: NetworkPlanner
              captures: { run3: "$.data.id" }
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
          assert:
            - "the PROVISIONAL run is never blocked: RoutingRun.${run1}.status == EVALUATED with projected_cost_cents 6740, projected_dc_cost_cents 3850 and projected_cost_index_bps 17506 (6740 * 10000 / 3850 = 17506.49 -> 17506)"
            - "the candidate's cost_estimate_cents == 6544 (95 reserved minutes * 38 = 3610 labour + 490 LARGE_BOX packaging + 2444 expedited freight) and its cost factor is clamped to 0.0000, giving routing_score 61.88"
            - "the unoverridden COMMIT returns HTTP 422 with ${err_guardrail} == ERR_COST_INDEX_GUARDRAIL"
            - "the refused COMMIT is inert: CustomerOrder.${o1}.version is still ${o1_v2}, routing_status is still UNROUTABLE and GET /assignments?order_id=${o1} is empty at that point"
            - "the overridden COMMIT returns HTTP 201 with RoutingRun.${run3}.status == COMMITTED and guardrail_overridden == true"
            - "FulfillmentAssignment.${a1}.assigned_units == 20 with provisional_cost_cents 6544; CustomerOrder.${o1}.provisional_cost_cents == 6740, cost_index_bps == 17506 and the comparison read reports savings_vs_dc_cents -2890"
            - "Store.${s2}.eligibility_score == 38.81 after 20 units and 95 minutes are reserved"

      - name: cost_comparison_computed_read
        claim_type: computed_read
        grounds:
          - endpoints.GET /fulfillment-network/orders/{order_id}/cost-comparison
        excluded_because:
          difficulty_instance: dual_variant_calc / order_cost_tier_flips_between_provisional_and_final_pass
          rationale: "The computed-read claim - that the derived comparison payload matches the calculation rather than a stored snapshot - is asserted at its hardest point by the dual_variant_calc instance of that name in §1.8, where the same read returns a different fee tier before and after the final pass."
      - name: bulk_line_pick_partial_semantics
        claim_type: bulk_action
        grounds:
          - endpoints.POST /fulfillment-network/assignments/{assignment_id}/pick
        excluded_because:
          difficulty_instance: non_linear_state_machine / assignment_short_pick_fork_rejoins_at_packed
          rationale: "The bulk-action claim for the multi-line pick payload - per-line units_picked applied together with all-or-nothing validation - is exercised by the non_linear_state_machine instance of that name in §1.8, which picks fewer units than assigned across the assignment's lines and asserts the resulting SHORT_PICKED fork plus per-line units_picked."

  - section: errors
    instances:
      - name: unknown_child_ids_each_return_their_own_not_found_code
