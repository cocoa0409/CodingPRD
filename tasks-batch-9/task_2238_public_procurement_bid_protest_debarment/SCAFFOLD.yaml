scenario: "2238. Public Procurement Bid Protest & Debarment (state procurement office): solicitation issuance with question periods, addenda and mandatory requirement identification, bid opening, responsiveness determination and responsibility review of the apparent low bidder, protest filing deadlines, standing requirements and automatic stay of award, protest hearing with agency record review and decision issuance, corrective action, cancellation or resolicitation options, suspension and debarment proceedings for cause with notice and hearing rights, debarred vendor list maintenance and subcontractor screening, reinstatement petitions after the debarment period"
domain_name: "public-procurement-protest-debarment"
api_prefix: "/procurement"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Vendor <-> Solicitation are joined through Bid; SubcontractorScreening joins
  # Vendor to Vendor (prime/sub); Bid.superseded_by_bid_id and
  # Solicitation.predecessor_solicitation_id are self-referential edges;
  # Protest / DebarmentProceeding cut across the Solicitation aggregate.

  state_machine_shape: cyclic
  # Solicitation AWARD_PENDING -> EVALUATION -> AWARD_PENDING (corrective action),
  # ProtestHearing SCHEDULED -> CONVENED -> SCHEDULED (continuance),
  # Protest UNDER_REVIEW -> HEARING_SCHEDULED -> UNDER_REVIEW,
  # Vendor ELIGIBLE -> SUSPENDED -> DEBARRED -> ELIGIBLE (reinstatement),
  # plus parallel dimensions on Bid (responsiveness_status x responsibility_status),
  # Protest (status x stay_status) and DebarmentProceeding (status x interim_status).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The HearingOfficer user that decides a protest must not be the user that
  # issued the solicitation; the ResponsibilityReviewer user must not be the
  # user that made the responsiveness determination on the same bid.

  consistency_model: immediate
  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the vendor
        constraints: "1..200 chars"
      - name: tax_id
        type: string
        source: input
        description: state taxpayer identifier
        constraints: "unique across all Vendor rows; exactly 9 digits; duplicate -> ERR_DUPLICATE_TAX_ID"
      - name: contact_email
        type: string
        source: input
        description: notice-of-record email address
      - name: eligibility_status
        type: enum
        source: system
        description: award eligibility posture of the vendor
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, SUSPENDED, DEBARRED}; written only by DebarmentProceeding and ReinstatementPetition transitions"
      - name: protest_fee_balance_cents
        type: integer
        source: system
        description: unencumbered protest-filing-fee balance held for this vendor, in cents
        default: 0
        constraints: ">= 0; credited by POST /procurement/vendors/{id}/fee-deposits, debited on protest filing, re-credited on refund"
      - name: debarment_strike_count
        type: integer
        source: system
        description: number of strikes currently attributed to this vendor by proceedings whose status is DEBARRED or whose interim_status is INTERIM_SUSPENDED
        default: 0
        constraints: ">= 0; MUST equal sum(DebarmentProceeding.strikes_applied) over that vendor's proceedings with status == DEBARRED OR interim_status == INTERIM_SUSPENDED"
      - name: active_debarment_id
        type: string
        source: computed
        description: "FK -> DebarmentProceeding.id; the proceeding whose status == DEBARRED or interim_status == INTERIM_SUSPENDED for this vendor; null when the vendor has none"
        default: null
      - name: reinstatement_earliest_petition_utc
        type: datetime
        source: computed
        description: earliest instant at which a ReinstatementPetition may be filed for this vendor (see calculations.reinstatement_earliest_petition_utc); null when eligibility_status != DEBARRED
        default: null
      - name: suspension_reason_code
        type: string
        source: system
        description: cause_code copied from the proceeding that produced the current SUSPENDED or DEBARRED posture; null when eligibility_status == ELIGIBLE
        default: null

  - name: Solicitation
    parent: null
    common_fields: true
    fields:
      - name: solicitation_number
        type: string
        source: input
        description: publicly advertised solicitation number
        constraints: "unique across all Solicitation rows; duplicate -> ERR_DUPLICATE_SOLICITATION_NUMBER"
      - name: title
        type: string
        source: input
        description: short title of the procurement
      - name: issuing_agency_code
        type: string
        source: input
        description: code of the agency the state procurement office is buying for
      - name: estimated_value_cents
        type: integer
        source: input
        description: agency estimate of contract value in cents; drives responsibility weight profile and protest filing fee tiers
        constraints: "> 0"
      - name: original_bid_due_utc
        type: datetime
        source: input
        description: bid due instant as first advertised; never mutated after creation
      - name: effective_bid_due_utc
        type: datetime
        source: computed
        description: original_bid_due_utc shifted by the cumulative addendum extension (see calculations.solicitation_effective_bid_due_utc)
      - name: original_question_deadline_utc
        type: datetime
        source: input
        description: question-period cutoff as first advertised; never mutated after creation
        constraints: "MUST be strictly before original_bid_due_utc"
      - name: question_deadline_utc
        type: datetime
        source: computed
        description: current question-period cutoff; recomputed from effective_bid_due_utc while status == ISSUED and frozen once status == QUESTION_PERIOD_CLOSED
      - name: status
        type: enum
        source: system
        description: lifecycle state of the solicitation
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, QUESTION_PERIOD_CLOSED, BIDS_OPENED, EVALUATION, AWARD_PENDING, AWARDED, CANCELLED, RESOLICITED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProcurementOfficer that executed POST /procurement/solicitations/{id}/issue; used by the segregation-of-duties check on protest hearings
        default: null
      - name: bids_opened_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which bids were opened; trigger event for EVALUATION_ERROR protest timeliness
        default: null
      - name: cumulative_extension_days
        type: integer
        source: computed
        description: sum of Addendum.extends_bid_due_by_days over all addenda of this solicitation
        default: 0
        constraints: "<= 21 (MAX_CUMULATIVE_EXTENSION_DAYS); an addendum that would exceed the cap -> ERR_EXTENSION_CAP_EXCEEDED"
      - name: addendum_count
        type: integer
        source: computed
        description: count of Addendum rows whose solicitation_id == this solicitation
        default: 0
      - name: apparent_low_bid_id
        type: string
        source: computed
        description: "FK -> Bid.id; winner of calculations.apparent_low_bidder_selection; null when the candidate set is empty"
        default: null
      - name: protest_escrow_cents
        type: integer
        source: system
        description: total protest filing fees currently escrowed on this solicitation, in cents
        default: 0
        constraints: ">= 0"
      - name: predecessor_solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id; set only on a successor created by POST /procurement/solicitations/{id}/resolicit; null on an originally advertised solicitation"
        default: null

  - name: MandatoryRequirement
    parent: Solicitation
    common_fields: false
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: requirement_code
        type: string
        source: input
        description: short code of the mandatory requirement
        constraints: "unique within one solicitation"
      - name: description
        type: string
        source: input
        description: prose statement of the requirement
      - name: materiality
        type: enum
        source: input
        description: whether non-compliance is a material deviation or a waivable informality
        constraints: "one of {MATERIAL, INFORMALITY}"
      - name: is_waivable
        type: boolean
        source: input
        description: whether the procurement officer may waive non-compliance on this requirement
        default: false
      - name: introduced_by_addendum_sequence
        type: integer
        source: system
        description: Addendum.sequence_number within the same solicitation that introduced this requirement; 0 means the requirement was part of the original solicitation
        default: 0

  - name: Addendum
    parent: Solicitation
    common_fields: false
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: sequence_number
        type: integer
        source: system
        description: 1-based issuance order within the solicitation; assigned as solicitation.addendum_count + 1
      - name: summary
        type: string
        source: input
        description: prose summary of what the addendum changes
      - name: extends_bid_due_by_days
        type: integer
        source: input
        description: whole calendar days added to effective_bid_due_utc by this addendum
        default: 0
        constraints: ">= 0 and <= 21"
      - name: acknowledgment_required
        type: boolean
        source: input
        description: whether bidders must list this sequence_number in Bid.acknowledged_addendum_sequences
        default: true
      - name: adds_material_requirement
        type: boolean
        source: computed
        description: true when at least one requirement introduced by this addendum has materiality == MATERIAL
      - name: new_requirement_codes
        type: array
        source: input
        description: requirement definitions introduced by this addendum, each { requirement_code, description, materiality, is_waivable }
        default: []
      - name: issued_at_utc
        type: datetime
        source: system
        description: logical-clock instant of issuance

  - name: QuestionSubmission
    parent: Solicitation
    common_fields: false
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the prospective bidder that asked the question"
      - name: question_text
        type: string
        source: input
        description: text of the question
      - name: submitted_at_utc
        type: datetime
        source: system
        description: logical-clock instant of submission
      - name: status
        type: enum
        source: system
        description: disposition of the question
        default: PENDING
        constraints: "one of {PENDING, ANSWERED, REJECTED_LATE}; REJECTED_LATE is stamped at creation when submitted_at_utc > solicitation.question_deadline_utc while solicitation.status == ISSUED"
      - name: answer_summary
        type: string
        source: system
        description: answer text copied from the addendum that answered this question; null while status != ANSWERED
        default: null
      - name: answered_via_addendum_sequence
        type: integer
        source: system
        description: Addendum.sequence_number within the same solicitation that answered this question; null while status != ANSWERED
        default: null

  - name: Bid
    parent: Solicitation
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; MUST equal X-User-ID of the acting Vendor role"
      - name: total_price_cents
        type: integer
        source: input
        description: as-read bid price in cents
        constraints: "> 0"
      - name: acknowledged_addendum_sequences
        type: array
        source: input
        description: list of Addendum.sequence_number values the bidder acknowledges
        default: []
      - name: submitted_at_utc
        type: datetime
        source: system
        description: logical-clock instant of submission
      - name: responsiveness_status
        type: enum
        source: system
        description: first parallel state dimension of the bid
        default: UNREVIEWED
        constraints: "one of {UNREVIEWED, RESPONSIVE, NONRESPONSIVE, WITHDRAWN}"
      - name: responsibility_status
        type: enum
        source: system
        description: second parallel state dimension of the bid, evolving independently of responsiveness_status
        default: NOT_REVIEWED
        constraints: "one of {NOT_REVIEWED, RESPONSIBLE, NONRESPONSIBLE}"
      - name: evaluated_price_cents
        type: integer
        source: computed
        description: price used for ranking; see calculations.bid_evaluated_price_cents (as_read variant at bid opening, corrected variant at responsiveness determination)
        default: null
      - name: corrected_total_price_cents
        type: integer
        source: system
        description: arithmetically corrected as-read price supplied on the responsiveness determination; null when no correction was made
        default: null
      - name: informality_loading_cents
        type: integer
        source: computed
        description: price loading added for unacknowledged non-material addenda
        default: 0
      - name: nonresponsive_reason_codes
        type: array
        source: system
        description: reason codes recorded when responsiveness_status becomes NONRESPONSIVE; members of {MATERIAL_REQUIREMENT_UNMET, ADDENDUM_NOT_ACKNOWLEDGED, LATE_SUBMISSION, VENDOR_DEBARRED, VENDOR_SUSPENDED, OFFICER_DETERMINATION}
        default: []
      - name: responsiveness_decided_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the responsiveness determination; trigger event for RESPONSIVENESS_DETERMINATION protest timeliness
        default: null
      - name: responsiveness_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProcurementOfficer that made the responsiveness determination; used by the segregation-of-duties check on responsibility reviews
        default: null
      - name: superseded_by_bid_id
        type: string
        source: system
        description: "FK -> Bid.id; the replacement bid that superseded this one; null unless responsiveness_status == WITHDRAWN by supersede"
        default: null

  - name: ResponsibilityReview
    parent: Bid
    common_fields: true
    fields:
      - name: bid_id
        type: string
        source: input
        description: "FK -> Bid.id"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the acting ResponsibilityReviewer
      - name: financial_capacity_score
        type: integer
        source: input
        description: financial capacity factor
        constraints: "0..100"
      - name: past_performance_score
        type: integer
        source: input
        description: past performance factor
        constraints: "0..100"
      - name: integrity_score
        type: integer
        source: input
        description: business integrity factor
        constraints: "0..100"
      - name: weight_profile
        type: enum
        source: computed
        description: weight set selected from the solicitation's estimated_value_cents
        constraints: "one of {STANDARD, HIGH_VALUE}"
      - name: strike_penalty_points
        type: number
        source: computed
        description: penalty subtracted for the vendor's debarment_strike_count
      - name: composite_score
        type: number
        source: computed
        description: weighted responsibility score; see calculations.responsibility_composite_score
        constraints: "0.00..100.00, two decimal places"
      - name: determination
        type: enum
        source: input
        description: reviewer's determination on the apparent low bidder
        constraints: "one of {RESPONSIBLE, NONRESPONSIBLE}"
      - name: decided_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the determination; trigger event for RESPONSIBILITY_DETERMINATION protest timeliness
      - name: notes
        type: string
        source: input
        description: reviewer notes
        default: null
      - name: superseded_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which a corrective-action cascade voided this review because its Bid.responsibility_status reverted to NOT_REVIEWED; null while the review is operative
        default: null

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: protester_vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; MUST equal X-User-ID of the acting Vendor role"
      - name: challenged_bid_id
        type: string
        source: input
        description: "FK -> Bid.id; required for grounds_code in {RESPONSIVENESS_DETERMINATION, RESPONSIBILITY_DETERMINATION}; MUST be null for other grounds"
        default: null
      - name: grounds_code
        type: enum
        source: input
        description: statutory ground of the protest
        constraints: "one of {SOLICITATION_IMPROPRIETY, RESPONSIVENESS_DETERMINATION, RESPONSIBILITY_DETERMINATION, AWARD_IMPROPRIETY, EVALUATION_ERROR}"
      - name: narrative
        type: string
        source: input
        description: statement of the grounds
      - name: filed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of filing
      - name: status
        type: enum
        source: system
        description: first parallel state dimension of the protest
        default: FILED
        constraints: "one of {FILED, UNDER_REVIEW, HEARING_SCHEDULED, SUSTAINED, DENIED, WITHDRAWN}"
      - name: stay_status
        type: enum
        source: system
        description: second parallel state dimension of the protest, controlling whether award may be executed
        default: NONE
        constraints: "one of {NONE, ACTIVE, LIFTED, OVERRIDDEN}"
      - name: filing_fee_cents
        type: integer
        source: computed
        description: fee debited from the protester at filing; see calculations.protest_filing_fee_cents
      - name: timeliness_deadline_utc
        type: datetime
        source: computed
        description: last instant at which this protest could be filed; see calculations.protest_timeliness_deadline_utc
      - name: standing_basis
        type: enum
        source: computed
        description: basis on which the protester has standing
        constraints: "one of {ACTUAL_BIDDER, PROSPECTIVE_BIDDER}"
      - name: decision_outcome
        type: enum
        source: system
        description: outcome recorded by the hearing officer; null before decision
        default: null
        constraints: "one of {SUSTAINED, DENIED}"
      - name: remedy_code
        type: enum
        source: system
        description: remedy ordered with a SUSTAINED decision; NONE is recorded with a DENIED decision
        default: null
        constraints: "one of {CORRECTIVE_ACTION, CANCELLATION, RESOLICITATION, NONE}"
      - name: decided_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the decision
        default: null
      - name: record_item_count
        type: integer
        source: computed
        description: count of AgencyRecordItem rows whose protest_id == this protest
        default: 0
      - name: fee_refunded_cents
        type: integer
        source: system
        description: portion of filing_fee_cents returned to the protester's protest_fee_balance_cents
        default: 0

  - name: ProtestHearing
    parent: Protest
    common_fields: true
    fields:
      - name: protest_id
        type: string
        source: input
        description: "FK -> Protest.id"
      - name: hearing_officer_user_id
        type: string
        source: input
        description: opaque X-User-ID of the HearingOfficer presiding; MUST differ from the solicitation's issued_by_user_id
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: start of the hearing window
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: end of the hearing window
        constraints: "MUST be strictly after scheduled_start_utc"
      - name: room_code
        type: string
        source: input
        description: hearing room resource occupied by this hearing
      - name: status
        type: enum
        source: system
        description: lifecycle state of the hearing
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONVENED, CONCLUDED, CANCELLED}"
      - name: continuance_count
        type: integer
        source: system
        description: number of times this hearing has been continued from CONVENED back to SCHEDULED
        default: 0
        constraints: "<= 2 (MAX_CONTINUANCES); a third continuance -> ERR_CONTINUANCE_LIMIT_EXCEEDED"
      - name: convened_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent convening
        default: null
      - name: concluded_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which the record was closed
        default: null
      - name: record_items_reviewed_count
        type: integer
        source: computed
        description: Protest.record_item_count snapshotted at the moment the hearing was concluded; 0 while status != CONCLUDED
        default: 0

  - name: AgencyRecordItem
    parent: Protest
    common_fields: false
    fields:
      - name: protest_id
        type: string
        source: input
        description: "FK -> Protest.id"
      - name: sequence_number
        type: integer
        source: system
        description: 1-based append order within the protest record; assigned as protest.record_item_count + 1
      - name: item_type
        type: enum
        source: input
        description: kind of document filed into the agency record
        constraints: "one of {SOLICITATION_DOCUMENT, ADDENDUM, BID_ABSTRACT, RESPONSIVENESS_MEMO, RESPONSIBILITY_MEMO, PROTESTER_SUBMISSION, AGENCY_REPORT}"
      - name: document_ref
        type: string
        source: input
        description: opaque reference to the filed document
      - name: submitted_by_role
        type: string
        source: system
        description: X-User-Role of the caller that filed the item
      - name: submitted_at_utc
        type: datetime
        source: system
        description: logical-clock instant of filing

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: winning_bid_id
        type: string
        source: input
        description: "FK -> Bid.id; MUST equal solicitation.apparent_low_bid_id at creation"
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; copied from the winning bid's vendor_id"
      - name: base_obligation_cents
        type: integer
        source: computed
        description: winning bid's evaluated_price_cents at award creation
      - name: administrative_fee_rate
        type: number
        source: computed
        description: rate selected from the base_obligation_cents tier (see calculations.award_total_obligation_cents step 2)
      - name: administrative_fee_cents
        type: integer
        source: computed
        description: rounded administrative fee in cents
      - name: protest_risk_reserve_cents
        type: integer
        source: computed
        description: reserve added when the solicitation carries at least one resolved protest
        default: 0
      - name: award_total_obligation_cents
        type: integer
        source: computed
        description: base_obligation_cents + administrative_fee_cents + protest_risk_reserve_cents
      - name: status
        type: enum
        source: system
        description: lifecycle state of the award
        default: PENDING_STAY
        constraints: "one of {PENDING_STAY, EXECUTED, VOID, RESCINDED}"
      - name: executed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of execution
        default: null
      - name: void_reason_code
        type: string
        source: system
        description: reason the award was voided or rescinded; one of {PROTEST_SUSTAINED, APPARENT_LOW_BIDDER_CHANGED, SOLICITATION_CANCELLED}
        default: null

  - name: DebarmentProceeding
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; respondent vendor"
      - name: source_protest_id
        type: string
        source: input
        description: "FK -> Protest.id; protest whose record supplied the cause; null when the cause arose outside a protest"
        default: null
      - name: cause_code
        type: enum
        source: input
        description: statutory cause for suspension or debarment
        constraints: "one of {FRAUD, BID_RIGGING, REPEATED_NONPERFORMANCE, FALSE_CERTIFICATION, SAFETY_VIOLATION, ADMINISTRATIVE_DEFAULT}"
      - name: aggravating_factor_codes
        type: array
        source: input
        description: distinct members of {FRAUD, BID_RIGGING, FALSE_CERTIFICATION, REPEATED_NONPERFORMANCE, SAFETY_VIOLATION, ADMINISTRATIVE_DEFAULT}; a repeated member -> ERR_DUPLICATE_FACTOR_CODE
        constraints: "non-empty, distinct members"
      - name: mitigating_factor_codes
        type: array
        source: input
        description: distinct members of {SELF_DISCLOSURE, RESTITUTION_PAID, COMPLIANCE_PROGRAM, COOPERATION}; a repeated member -> ERR_DUPLICATE_FACTOR_CODE
        default: []
      - name: notice_issued_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which the notice of proposed debarment was issued
      - name: response_deadline_utc
        type: datetime
        source: computed
        description: notice_issued_at_utc + RESPONSE_WINDOW_DAYS (14) days
      - name: status
        type: enum
        source: system
        description: first parallel state dimension of the proceeding
        default: NOTICE_ISSUED
        constraints: "one of {NOTICE_ISSUED, RESPONSE_RECEIVED, HEARING_HELD, DEBARRED, DISMISSED}"
      - name: interim_status
        type: enum
        source: system
        description: second parallel state dimension, tracking interim suspension independently of the merits track
        default: NONE
        constraints: "one of {NONE, INTERIM_SUSPENDED, INTERIM_LIFTED}"
      - name: aggravating_total_points
        type: number
        source: computed
        description: sum of AGGRAVATING_WEIGHTS over aggravating_factor_codes
      - name: mitigating_credit_points
        type: number
        source: computed
        description: mitigation credit actually applied, capped at 50 percent of aggravating_total_points; 0 under the interim_suspension_basis variant
      - name: severity_score
        type: number
        source: computed
        description: severity under the currently applicable variant; see calculations.debarment_severity_score
      - name: debarment_period_months
        type: integer
        source: computed
        description: debarment length in whole months derived from the final severity tier; 0 until a DEBARRED decision is recorded
        default: 0
      - name: debarment_start_utc
        type: datetime
        source: system
        description: logical-clock instant of the DEBARRED decision
        default: null
      - name: debarment_end_utc
        type: datetime
        source: computed
        description: debarment_start_utc plus debarment_period_months calendar months; null before a DEBARRED decision
        default: null
      - name: strikes_applied
        type: integer
        source: system
        description: strikes this proceeding contributes to Vendor.debarment_strike_count; 1 while interim_status == INTERIM_SUSPENDED, 1 when status == DEBARRED, 0 otherwise
        default: 0
      - name: response_narrative
        type: string
        source: system
        description: respondent's written response; null until POST .../response
        default: null
      - name: decided_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the merits decision
        default: null

  - name: ReinstatementPetition
    parent: DebarmentProceeding
    common_fields: true
    fields:
      - name: proceeding_id
        type: string
        source: input
        description: "FK -> DebarmentProceeding.id"
      - name: remediation_evidence_codes
        type: array
        source: input
        description: distinct members of {RESTITUTION_COMPLETE, MANAGEMENT_REPLACED, COMPLIANCE_AUDIT_PASSED, TRAINING_COMPLETED}
        constraints: "non-empty, distinct members"
      - name: narrative
        type: string
        source: input
        description: petitioner's statement of remediation
      - name: filed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of filing
      - name: status
        type: enum
        source: system
        description: lifecycle state of the petition
        default: FILED
        constraints: "one of {FILED, GRANTED, DENIED}"
      - name: months_served_at_filing
        type: integer
        source: computed
        description: whole calendar months elapsed from proceeding.debarment_start_utc to filed_at_utc
      - name: decided_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the petition decision
        default: null
      - name: decision_rationale
        type: string
        source: system
        description: authority's rationale; null before decision
        default: null

  - name: SubcontractorScreening
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id"
      - name: prime_vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; prime contractor proposing the subcontractor"
      - name: sub_vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; proposed subcontractor being screened"
      - name: tier
        type: integer
        source: input
        description: subcontract tier below the prime
        constraints: "1..3; a value outside the range -> ERR_SUBCONTRACT_TIER_UNSUPPORTED"
      - name: result
        type: enum
        source: system
        description: screening outcome
        default: PENDING
        constraints: "one of {PENDING, CLEARED, BLOCKED_SUSPENDED, BLOCKED_DEBARRED}"
      - name: blocked_reason_code
        type: string
        source: system
        description: cause_code of the sub vendor's active proceeding when result is BLOCKED_SUSPENDED or BLOCKED_DEBARRED; null when CLEARED
        default: null
      - name: screened_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent screening evaluation
      - name: rescreened_count
        type: integer
        source: system
        description: number of times a cascade from the sub vendor's eligibility change re-evaluated this screening
        default: 0

state_machines:
  - entity: Solicitation
    initial_state: DRAFT
    terminal_states: [AWARDED, RESOLICITED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /procurement/solicitations/{id}/issue"
        actor: ProcurementOfficer
        preconditions:
          - "status == DRAFT"
          - "count of MandatoryRequirement rows with solicitation_id == this solicitation is >= 1, else ERR_NO_MANDATORY_REQUIREMENTS"
          - "original_question_deadline_utc > current logical clock instant, else ERR_INVALID_SOLICITATION_STATE"
        side_effects:
          - "sets issued_by_user_id = X-User-ID of the acting ProcurementOfficer"
          - "sets effective_bid_due_utc = original_bid_due_utc and cumulative_extension_days = 0"
          - "sets question_deadline_utc = original_question_deadline_utc"
          - "increments Solicitation.version by 1"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /procurement/solicitations/{id}/addenda"
        actor: ProcurementOfficer
        preconditions:
          - "status == ISSUED"
          - "cumulative_extension_days + addendum.extends_bid_due_by_days <= 21, else ERR_EXTENSION_CAP_EXCEEDED"
        side_effects:
          - "creates Addendum with sequence_number = addendum_count + 1 and issued_at_utc = current clock"
          - "creates one MandatoryRequirement per entry in new_requirement_codes with introduced_by_addendum_sequence = the new sequence_number"
          - "sets Addendum.adds_material_requirement = true when any created requirement has materiality == MATERIAL"
          - "recomputes cumulative_extension_days, addendum_count, effective_bid_due_utc and question_deadline_utc per calculations.solicitation_effective_bid_due_utc"
          - "sets every QuestionSubmission listed in answers_question_ids to status ANSWERED, answer_summary = addendum.summary, answered_via_addendum_sequence = the new sequence_number"
          - "increments Solicitation.version by 1"
      - from: ISSUED
        to: QUESTION_PERIOD_CLOSED
        trigger: "POST /procurement/solicitations/{id}/close-question-period"
        actor: ProcurementOfficer
        preconditions:
          - "status == ISSUED"
          - "current logical clock instant >= question_deadline_utc, else ERR_QUESTION_PERIOD_OPEN"
        side_effects:
          - "freezes question_deadline_utc: later addenda no longer recompute it"
          - "increments Solicitation.version by 1"
      - from: QUESTION_PERIOD_CLOSED
        to: BIDS_OPENED
        trigger: "POST /procurement/solicitations/{id}/open-bids"
        actor: ProcurementOfficer
        preconditions:
          - "status == QUESTION_PERIOD_CLOSED"
          - "current logical clock instant >= effective_bid_due_utc, else ERR_BID_PERIOD_OPEN"
          - "count of Bid rows on this solicitation with responsiveness_status != WITHDRAWN is >= 1, else ERR_NO_BIDS_RECEIVED"
        side_effects:
          - "sets bids_opened_at_utc = current clock"
          - "sets evaluated_price_cents on every Bid with responsiveness_status != WITHDRAWN using calculations.bid_evaluated_price_cents variant as_read"
          - "recomputes apparent_low_bid_id per calculations.apparent_low_bidder_selection"
          - "increments Solicitation.version by 1"
      - from: BIDS_OPENED
        to: EVALUATION
        trigger: "system: first POST /procurement/bids/{id}/responsiveness recorded on this solicitation"
        actor: system
        preconditions:
          - "status == BIDS_OPENED"
        side_effects:
          - "increments Solicitation.version by 1"
        note: "auto-transition fired inside the same request that records the first responsiveness determination"
      - from: EVALUATION
        to: AWARD_PENDING
        trigger: "system: POST /procurement/bids/{id}/responsibility-reviews records determination RESPONSIBLE on the bid whose id == apparent_low_bid_id"
        actor: system
        preconditions:
          - "status == EVALUATION"
          - "bid_id == solicitation.apparent_low_bid_id"
          - "the created ResponsibilityReview has determination == RESPONSIBLE"
        side_effects:
          - "sets that Bid.responsibility_status = RESPONSIBLE"
          - "increments Solicitation.version by 1"
      - from: AWARD_PENDING
        to: AWARDED
        trigger: "POST /procurement/awards/{id}/execute"
        actor: ProcurementOfficer
        preconditions:
          - "status == AWARD_PENDING"
          - "the Award being executed has status == PENDING_STAY"
          - "no Protest with solicitation_id == this solicitation has stay_status == ACTIVE, else ERR_AWARD_STAYED"
        side_effects:
          - "sets Award.status = EXECUTED and Award.executed_at_utc = current clock"
          - "increments Solicitation.version by 1"
      - from: AWARD_PENDING
        to: EVALUATION
        trigger: "system: cascade hop 3 of the corrective-action chain, or cascade hop 3 of the vendor-debarment chain"
        actor: system
        preconditions:
          - "status == AWARD_PENDING"
          - "an Award on this solicitation left PENDING_STAY (to VOID), or apparent_low_bid_id changed value"
        side_effects:
          - "recomputes apparent_low_bid_id per calculations.apparent_low_bidder_selection"
          - "every Bid on this solicitation with responsibility_status IN {RESPONSIBLE, NONRESPONSIBLE} reverts to NOT_REVIEWED (cascade hop 4)"
          - "increments Solicitation.version by 1"
        note: "this edge plus EVALUATION -> AWARD_PENDING makes the Solicitation machine cyclic"
      - from: AWARDED
        to: EVALUATION
        trigger: "system: cascade hop 3 of the corrective-action chain when the award had already been executed"
        actor: system
        preconditions:
          - "status == AWARDED"
          - "the Award on this solicitation left EXECUTED (to RESCINDED)"
        side_effects:
          - "recomputes apparent_low_bid_id"
          - "every Bid with responsibility_status IN {RESPONSIBLE, NONRESPONSIBLE} reverts to NOT_REVIEWED (cascade hop 4)"
          - "increments Solicitation.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /procurement/solicitations/{id}/cancel"
        actor: ProcurementOfficer
        preconditions:
          - "status IN {ISSUED, QUESTION_PERIOD_CLOSED, BIDS_OPENED, EVALUATION, AWARD_PENDING}"
        side_effects:
          - "every Bid on this solicitation with responsiveness_status IN {UNREVIEWED, RESPONSIVE} becomes NONRESPONSIVE with nonresponsive_reason_codes appended OFFICER_DETERMINATION"
          - "every Award on this solicitation with status == PENDING_STAY becomes VOID with void_reason_code SOLICITATION_CANCELLED"
          - "increments Solicitation.version by 1"
      - from: QUESTION_PERIOD_CLOSED
        to: CANCELLED
        trigger: "POST /procurement/solicitations/{id}/cancel"
        actor: ProcurementOfficer
        preconditions: ["status == QUESTION_PERIOD_CLOSED"]
        side_effects: ["increments Solicitation.version by 1"]
      - from: EVALUATION
        to: CANCELLED
        trigger: "POST /procurement/solicitations/{id}/cancel, or system cascade from a SUSTAINED protest with remedy_code == CANCELLATION"
        actor: ProcurementOfficer | system
        preconditions: ["status == EVALUATION"]
        side_effects:
          - "every Bid with responsiveness_status IN {UNREVIEWED, RESPONSIVE} becomes NONRESPONSIVE with reason OFFICER_DETERMINATION"
          - "sets apparent_low_bid_id = null"
          - "increments Solicitation.version by 1"
      - from: AWARD_PENDING
        to: CANCELLED
        trigger: "system cascade from a SUSTAINED protest with remedy_code == CANCELLATION"
        actor: system
        preconditions: ["status == AWARD_PENDING"]
        side_effects:
          - "every Award with status == PENDING_STAY becomes VOID with void_reason_code SOLICITATION_CANCELLED"
          - "sets apparent_low_bid_id = null"
          - "increments Solicitation.version by 1"
      - from: CANCELLED
        to: RESOLICITED
        trigger: "POST /procurement/solicitations/{id}/resolicit"
        actor: ProcurementOfficer
        preconditions:
          - "status == CANCELLED"
          - "no Solicitation already exists whose predecessor_solicitation_id == this solicitation, else ERR_ALREADY_RESOLICITED"
        side_effects:
          - "creates a successor Solicitation in status DRAFT with predecessor_solicitation_id = this solicitation, solicitation_number = <this number>-R<n>, and a copy of every MandatoryRequirement of this solicitation whose introduced_by_addendum_sequence == 0"
          - "increments Solicitation.version by 1"

  - entity: Bid
    initial_state: UNREVIEWED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: UNREVIEWED
        to: RESPONSIVE
        trigger: "POST /procurement/bids/{id}/responsiveness with determination == RESPONSIVE"
        actor: ProcurementOfficer
        preconditions:
          - "bid.responsiveness_status == UNREVIEWED"
          - "solicitation.status IN {BIDS_OPENED, EVALUATION}, else ERR_INVALID_SOLICITATION_STATE"
          - "every MandatoryRequirement of the solicitation with materiality == MATERIAL and introduced_by_addendum_sequence > 0 has its introducing sequence listed in bid.acknowledged_addendum_sequences, else ERR_MATERIAL_REQUIREMENT_UNMET"
        side_effects:
          - "recomputes evaluated_price_cents and informality_loading_cents using calculations.bid_evaluated_price_cents variant corrected"
          - "sets responsiveness_decided_at_utc = current clock and responsiveness_decided_by_user_id = X-User-ID"
          - "fires the Solicitation BIDS_OPENED -> EVALUATION auto-transition when the solicitation is still BIDS_OPENED"
          - "recomputes solicitation.apparent_low_bid_id"
          - "increments Bid.version by 1"
      - from: UNREVIEWED
        to: NONRESPONSIVE
        trigger: "POST /procurement/bids/{id}/responsiveness with determination == NONRESPONSIVE"
        actor: ProcurementOfficer
        preconditions:
          - "bid.responsiveness_status == UNREVIEWED"
          - "solicitation.status IN {BIDS_OPENED, EVALUATION}"
        side_effects:
          - "appends the supplied reason_codes (defaulting to [OFFICER_DETERMINATION]) to nonresponsive_reason_codes"
          - "sets responsiveness_decided_at_utc and responsiveness_decided_by_user_id"
          - "fires the Solicitation BIDS_OPENED -> EVALUATION auto-transition when applicable"
          - "recomputes solicitation.apparent_low_bid_id"
          - "increments Bid.version by 1"
      - from: RESPONSIVE
        to: NONRESPONSIVE
        trigger: "system: cascade hop 2 of the vendor-debarment chain (Vendor.eligibility_status became DEBARRED or SUSPENDED)"
        actor: system
        preconditions:
          - "bid.responsiveness_status IN {UNREVIEWED, RESPONSIVE}"
          - "solicitation.status IN {BIDS_OPENED, EVALUATION, AWARD_PENDING}"
        side_effects:
          - "appends VENDOR_DEBARRED (or VENDOR_SUSPENDED for an interim suspension) to nonresponsive_reason_codes"
          - "triggers cascade hop 3: the owning Solicitation recomputes apparent_low_bid_id"
          - "increments Bid.version by 1"
      - from: UNREVIEWED
        to: WITHDRAWN
        trigger: "system: POST /procurement/bids creating a replacement bid from the same vendor on the same solicitation"
        actor: system
        preconditions:
          - "bid.responsiveness_status IN {UNREVIEWED, RESPONSIVE}"
          - "solicitation.status == ISSUED or QUESTION_PERIOD_CLOSED (bids not yet opened)"
        side_effects:
          - "sets superseded_by_bid_id = id of the replacement bid"
          - "increments Bid.version by 1"
      - from: NOT_REVIEWED
        to: RESPONSIBLE
        trigger: "POST /procurement/bids/{id}/responsibility-reviews with determination == RESPONSIBLE"
        actor: ResponsibilityReviewer
        preconditions:
          - "bid.responsibility_status == NOT_REVIEWED"
          - "bid.responsiveness_status == RESPONSIVE, else ERR_INVALID_BID_STATE"
          - "bid.id == solicitation.apparent_low_bid_id, else ERR_NOT_APPARENT_LOW_BIDDER"
          - "X-User-ID != bid.responsiveness_decided_by_user_id, else ERR_REVIEWER_CONFLICT"
          - "computed composite_score >= 60.00, else ERR_RESPONSIBILITY_SCORE_BELOW_THRESHOLD"
          - "vendor.eligibility_status == ELIGIBLE, else ERR_VENDOR_NOT_ELIGIBLE"
        side_effects:
          - "creates ResponsibilityReview with composite_score per calculations.responsibility_composite_score"
          - "fires the Solicitation EVALUATION -> AWARD_PENDING auto-transition"
          - "increments Bid.version by 1"
        note: "responsibility_status is the second, independent state dimension of Bid; it advances without changing responsiveness_status"
      - from: NOT_REVIEWED
        to: NONRESPONSIBLE
        trigger: "POST /procurement/bids/{id}/responsibility-reviews with determination == NONRESPONSIBLE"
        actor: ResponsibilityReviewer
        preconditions:
          - "bid.responsibility_status == NOT_REVIEWED"
          - "bid.responsiveness_status == RESPONSIVE"
          - "bid.id == solicitation.apparent_low_bid_id"
          - "X-User-ID != bid.responsiveness_decided_by_user_id"
        side_effects:
          - "creates ResponsibilityReview with determination NONRESPONSIBLE"
          - "recomputes solicitation.apparent_low_bid_id, which now excludes this bid"
          - "solicitation remains in EVALUATION"
          - "increments Bid.version by 1"
      - from: RESPONSIBLE
        to: NOT_REVIEWED
        trigger: "system: cascade hop 4 of the corrective-action chain (owning Solicitation re-entered EVALUATION)"
        actor: system
        preconditions:
          - "bid.responsibility_status IN {RESPONSIBLE, NONRESPONSIBLE}"
        side_effects:
          - "triggers cascade hop 5: every ResponsibilityReview whose bid_id == this bid gets superseded_at_utc = current clock"
          - "increments Bid.version by 1"
      - from: NONRESPONSIBLE
        to: NOT_REVIEWED
        trigger: "system: cascade hop 4 of the corrective-action chain"
        actor: system
        preconditions: ["bid.responsibility_status == NONRESPONSIBLE"]
        side_effects:
          - "triggers cascade hop 5: matching ResponsibilityReview rows get superseded_at_utc = current clock"
          - "increments Bid.version by 1"

  - entity: Protest
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED, WITHDRAWN]
    transitions:
      - from: NONE
        to: ACTIVE
        trigger: "system: POST /procurement/protests when the award has not yet been executed"
        actor: system
        preconditions:
          - "solicitation.status IN {ISSUED, QUESTION_PERIOD_CLOSED, BIDS_OPENED, EVALUATION, AWARD_PENDING}"
          - "no Award on the solicitation has status == EXECUTED"
        side_effects:
          - "stay_status = ACTIVE, which blocks POST /procurement/awards and POST /procurement/awards/{id}/execute with ERR_AWARD_STAYED"
        note: "stay_status is the second, independent state dimension of Protest; a protest filed after an award is EXECUTED keeps stay_status == NONE"
      - from: ACTIVE
        to: OVERRIDDEN
        trigger: "POST /procurement/protests/{id}/stay-override"
        actor: ProcurementOfficer
        preconditions:
          - "stay_status == ACTIVE"
          - "protest.status IN {FILED, UNDER_REVIEW, HEARING_SCHEDULED}"
        side_effects:
          - "stay_status = OVERRIDDEN, which re-permits award creation and execution while the merits track continues"
          - "increments Protest.version by 1"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /procurement/protests/{id}/decision or POST /procurement/protests/{id}/withdraw"
        actor: HearingOfficer | Vendor
        preconditions: ["stay_status IN {ACTIVE, OVERRIDDEN}"]
        side_effects: ["stay_status = LIFTED", "increments Protest.version by 1"]
      - from: FILED
        to: UNDER_REVIEW
        trigger: "system: POST /procurement/protests/{id}/record-items filing the first item with item_type == AGENCY_REPORT"
        actor: system
        preconditions:
          - "protest.status == FILED"
          - "the filed item has item_type == AGENCY_REPORT and submitted_by_role == ProcurementOfficer"
        side_effects:
          - "recomputes record_item_count"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: HEARING_SCHEDULED
        trigger: "POST /procurement/protests/{id}/hearings"
        actor: HearingOfficer
        preconditions:
          - "protest.status == UNDER_REVIEW"
          - "record_item_count >= 1"
          - "hearing_officer_user_id != solicitation.issued_by_user_id, else ERR_HEARING_OFFICER_CONFLICT"
        side_effects:
          - "creates ProtestHearing in status SCHEDULED"
          - "increments Protest.version by 1"
      - from: HEARING_SCHEDULED
        to: UNDER_REVIEW
        trigger: "POST /procurement/hearings/{id}/conclude"
        actor: HearingOfficer
        preconditions:
          - "protest.status == HEARING_SCHEDULED"
          - "the hearing status == CONVENED"
        side_effects:
          - "sets hearing status = CONCLUDED, concluded_at_utc, record_items_reviewed_count = protest.record_item_count"
          - "increments Protest.version by 1"
        note: "UNDER_REVIEW -> HEARING_SCHEDULED -> UNDER_REVIEW makes the Protest status dimension cyclic; a second hearing may be scheduled on the same protest"
      - from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /procurement/protests/{id}/decision with outcome == SUSTAINED"
        actor: HearingOfficer
        preconditions:
          - "protest.status == UNDER_REVIEW"
          - "at least one ProtestHearing on this protest has status == CONCLUDED, else ERR_HEARING_NOT_CONCLUDED"
          - "record_item_count >= 2, else ERR_AGENCY_RECORD_INCOMPLETE"
          - "X-User-ID != solicitation.issued_by_user_id, else ERR_HEARING_OFFICER_CONFLICT"
        side_effects:
          - "CASCADE A hop 1: status = SUSTAINED, decision_outcome = SUSTAINED, remedy_code = the supplied remedy, decided_at_utc = current clock, stay_status ACTIVE|OVERRIDDEN -> LIFTED; fee_refunded_cents = filing_fee_cents; solicitation.protest_escrow_cents -= filing_fee_cents; protester Vendor.protest_fee_balance_cents += filing_fee_cents"
          - "CASCADE A hop 2 (caused by hop 1): because this protest became SUSTAINED with remedy_code == CORRECTIVE_ACTION, the Award on the same solicitation transitions PENDING_STAY -> VOID (void_reason_code PROTEST_SUSTAINED) or EXECUTED -> RESCINDED"
          - "CASCADE A hop 3 (caused by hop 2): because that Award left PENDING_STAY or EXECUTED, the Solicitation transitions AWARD_PENDING -> EVALUATION or AWARDED -> EVALUATION and recomputes apparent_low_bid_id"
          - "CASCADE A hop 4 (caused by hop 3): because the Solicitation re-entered EVALUATION, every Bid on it with responsibility_status IN {RESPONSIBLE, NONRESPONSIBLE} reverts to NOT_REVIEWED"
          - "CASCADE A hop 5 (caused by hop 4): because those Bid rows reverted to NOT_REVIEWED, every ResponsibilityReview whose bid_id is one of them gets superseded_at_utc = current clock"
          - "with remedy_code == CANCELLATION hop 3 instead drives the Solicitation to CANCELLED; with remedy_code == RESOLICITATION hop 3 drives it to CANCELLED and leaves it eligible for POST .../resolicit"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /procurement/protests/{id}/decision with outcome == DENIED"
        actor: HearingOfficer
        preconditions:
          - "protest.status == UNDER_REVIEW"
          - "at least one ProtestHearing on this protest has status == CONCLUDED"
          - "record_item_count >= 2"
          - "X-User-ID != solicitation.issued_by_user_id"
        side_effects:
          - "status = DENIED, decision_outcome = DENIED, remedy_code = NONE, decided_at_utc = current clock, stay_status ACTIVE|OVERRIDDEN -> LIFTED"
          - "fee_refunded_cents remains 0: the escrowed filing fee is forfeited to the solicitation and solicitation.protest_escrow_cents is unchanged"
          - "no Award, Bid or ResponsibilityReview row is mutated"
          - "increments Protest.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /procurement/protests/{id}/withdraw"
        actor: Vendor
        preconditions:
          - "protest.status IN {FILED, UNDER_REVIEW, HEARING_SCHEDULED}"
          - "X-User-ID == protester_vendor_id, else ERR_VENDOR_IDENTITY_MISMATCH"
        side_effects:
          - "status = WITHDRAWN, stay_status ACTIVE|OVERRIDDEN -> LIFTED"
          - "compensating action for the filing debit: fee_refunded_cents = filing_fee_cents; solicitation.protest_escrow_cents -= filing_fee_cents; protester Vendor.protest_fee_balance_cents += filing_fee_cents"
          - "every ProtestHearing on this protest with status == SCHEDULED becomes CANCELLED"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /procurement/protests/{id}/withdraw"
        actor: Vendor
        preconditions: ["protest.status == UNDER_REVIEW", "X-User-ID == protester_vendor_id"]
        side_effects:
          - "same compensating refund and hearing cancellation as the FILED -> WITHDRAWN edge"
          - "increments Protest.version by 1"
      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /procurement/protests/{id}/withdraw"
        actor: Vendor
        preconditions: ["protest.status == HEARING_SCHEDULED", "X-User-ID == protester_vendor_id"]
        side_effects:
          - "same compensating refund; the SCHEDULED hearing becomes CANCELLED"
          - "increments Protest.version by 1"

  - entity: ProtestHearing
    initial_state: SCHEDULED
    terminal_states: [CONCLUDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: "POST /procurement/hearings/{id}/convene"
        actor: HearingOfficer
        preconditions:
          - "status == SCHEDULED"
          - "current logical clock instant >= scheduled_start_utc, else ERR_HEARING_NOT_YET_STARTED"
          - "protest.record_item_count >= 1, else ERR_AGENCY_RECORD_INCOMPLETE"
        side_effects:
          - "sets convened_at_utc = current clock"
          - "increments ProtestHearing.version by 1"
      - from: CONVENED
        to: SCHEDULED
        trigger: "POST /procurement/hearings/{id}/continue"
        actor: HearingOfficer
        preconditions:
          - "status == CONVENED"
          - "continuance_count < 2, else ERR_CONTINUANCE_LIMIT_EXCEEDED"
          - "the new window passes the same room and docket overlap checks as scheduling"
        side_effects:
          - "sets scheduled_start_utc / scheduled_end_utc / room_code to the supplied window, increments continuance_count by 1, clears convened_at_utc"
          - "increments ProtestHearing.version by 1"
        note: "SCHEDULED -> CONVENED -> SCHEDULED is the cycle in this machine"
      - from: CONVENED
        to: CONCLUDED
        trigger: "POST /procurement/hearings/{id}/conclude"
        actor: HearingOfficer
        preconditions:
          - "status == CONVENED"
          - "protest.record_item_count >= 2, else ERR_AGENCY_RECORD_INCOMPLETE"
        side_effects:
          - "sets concluded_at_utc = current clock and record_items_reviewed_count = protest.record_item_count"
          - "drives Protest HEARING_SCHEDULED -> UNDER_REVIEW"
          - "increments ProtestHearing.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: protest withdrawal cascade"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["increments ProtestHearing.version by 1"]

  - entity: Award
    initial_state: PENDING_STAY
    terminal_states: [VOID, RESCINDED]
    transitions:
      - from: PENDING_STAY
        to: EXECUTED
        trigger: "POST /procurement/awards/{id}/execute"
        actor: ProcurementOfficer
        preconditions:
          - "status == PENDING_STAY"
          - "solicitation.status == AWARD_PENDING"
          - "no Protest on the solicitation has stay_status == ACTIVE, else ERR_AWARD_STAYED"
        side_effects:
          - "sets executed_at_utc = current clock"
          - "drives Solicitation AWARD_PENDING -> AWARDED"
          - "increments Award.version by 1"
      - from: PENDING_STAY
        to: VOID
        trigger: "system: cascade hop 2 of the corrective-action chain, cascade hop 4 of the vendor-debarment chain, or the solicitation cancellation cascade"
        actor: system
        preconditions: ["status == PENDING_STAY"]
        side_effects:
          - "sets void_reason_code to PROTEST_SUSTAINED, APPARENT_LOW_BIDDER_CHANGED or SOLICITATION_CANCELLED per the originating cascade"
          - "triggers cascade hop 3 of the corrective-action chain: the Solicitation leaves AWARD_PENDING"
          - "increments Award.version by 1"
      - from: EXECUTED
        to: RESCINDED
        trigger: "system: cascade hop 2 of the corrective-action chain when the award had already been executed"
        actor: system
        preconditions: ["status == EXECUTED"]
        side_effects:
          - "sets void_reason_code = PROTEST_SUSTAINED"
          - "triggers cascade hop 3: the Solicitation leaves AWARDED for EVALUATION"
          - "increments Award.version by 1"

  - entity: Vendor
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system: POST /procurement/debarment-proceedings with interim_suspension == true"
        actor: system
        preconditions:
          - "eligibility_status == ELIGIBLE"
          - "the proceeding's interim severity_score >= 35, else ERR_INTERIM_SUSPENSION_THRESHOLD_NOT_MET"
        side_effects:
          - "sets suspension_reason_code = proceeding.cause_code, active_debarment_id = proceeding.id"
          - "proceeding.interim_status = INTERIM_SUSPENDED and proceeding.strikes_applied = 1; debarment_strike_count is recomputed as the sum of strikes_applied over proceedings with status == DEBARRED or interim_status == INTERIM_SUSPENDED"
          - "cascade: every Bid of this vendor on a solicitation in {BIDS_OPENED, EVALUATION, AWARD_PENDING} with responsiveness_status IN {UNREVIEWED, RESPONSIVE} becomes NONRESPONSIVE with reason VENDOR_SUSPENDED, then each affected Solicitation recomputes apparent_low_bid_id"
          - "cascade: every SubcontractorScreening with sub_vendor_id == this vendor and result == CLEARED becomes BLOCKED_SUSPENDED with rescreened_count incremented"
          - "increments Vendor.version by 1"
      - from: SUSPENDED
        to: DEBARRED
        trigger: "system: POST /procurement/debarment-proceedings/{id}/decision with outcome == DEBARRED"
        actor: system
        preconditions: ["eligibility_status == SUSPENDED"]
        side_effects:
          - "CASCADE B hop 1: sets active_debarment_id, suspension_reason_code and reinstatement_earliest_petition_utc from the proceeding; proceeding.interim_status INTERIM_SUSPENDED -> INTERIM_LIFTED while strikes_applied stays 1, so debarment_strike_count is unchanged"
          - "CASCADE B hops 2-4 as documented on the DebarmentProceeding HEARING_HELD -> DEBARRED transition"
          - "increments Vendor.version by 1"
      - from: ELIGIBLE
        to: DEBARRED
        trigger: "system: POST /procurement/debarment-proceedings/{id}/decision with outcome == DEBARRED and no interim suspension in force"
        actor: system
        preconditions: ["eligibility_status == ELIGIBLE"]
        side_effects:
          - "CASCADE B hop 1: proceeding.strikes_applied 0 -> 1, so debarment_strike_count increases by 1; sets active_debarment_id, suspension_reason_code, reinstatement_earliest_petition_utc"
          - "CASCADE B hops 2-4 as documented on the DebarmentProceeding HEARING_HELD -> DEBARRED transition"
          - "increments Vendor.version by 1"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "system: POST /procurement/debarment-proceedings/{id}/decision with outcome == DISMISSED"
        actor: system
        preconditions: ["eligibility_status == SUSPENDED"]
        side_effects:
          - "compensating action for the interim suspension: proceeding.interim_status -> INTERIM_LIFTED, proceeding.strikes_applied 1 -> 0, debarment_strike_count decreases by 1, active_debarment_id = null, suspension_reason_code = null"
          - "cascade: every SubcontractorScreening with sub_vendor_id == this vendor and result == BLOCKED_SUSPENDED returns to CLEARED with rescreened_count incremented"
          - "Bid rows already marked NONRESPONSIVE are NOT restored: nonresponsiveness is final once determined"
          - "increments Vendor.version by 1"
      - from: DEBARRED
        to: ELIGIBLE
        trigger: "system: POST /procurement/reinstatement-petitions/{id}/decision with outcome == GRANTED"
        actor: system
        preconditions: ["eligibility_status == DEBARRED"]
        side_effects:
          - "proceeding.strikes_applied 1 -> 0 and debarment_strike_count decreases by 1"
          - "active_debarment_id = null, suspension_reason_code = null, reinstatement_earliest_petition_utc = null"
          - "cascade: every SubcontractorScreening with sub_vendor_id == this vendor and result == BLOCKED_DEBARRED returns to CLEARED with rescreened_count incremented"
          - "increments Vendor.version by 1"
        note: "ELIGIBLE -> SUSPENDED -> DEBARRED -> ELIGIBLE makes the Vendor machine cyclic"

  - entity: DebarmentProceeding
    initial_state: NOTICE_ISSUED
    terminal_states: [DEBARRED, DISMISSED]
    transitions:
      - from: NOTICE_ISSUED
        to: RESPONSE_RECEIVED
        trigger: "POST /procurement/debarment-proceedings/{id}/response"
        actor: Vendor
        preconditions:
          - "status == NOTICE_ISSUED"
          - "X-User-ID == vendor_id, else ERR_VENDOR_IDENTITY_MISMATCH"
          - "current logical clock instant <= response_deadline_utc, else ERR_RESPONSE_WINDOW_CLOSED"
        side_effects:
          - "stores response_narrative and merges any supplied mitigating_factor_codes into mitigating_factor_codes"
          - "increments DebarmentProceeding.version by 1"
      - from: NOTICE_ISSUED
        to: HEARING_HELD
        trigger: "POST /procurement/debarment-proceedings/{id}/hearing (default branch: respondent did not respond)"
        actor: DebarmentAuthority
        preconditions:
          - "status == NOTICE_ISSUED"
          - "current logical clock instant > response_deadline_utc, else ERR_DEBARMENT_HEARING_RIGHTS_NOT_EXHAUSTED"
        side_effects:
          - "records that hearing rights were exhausted by default"
          - "increments DebarmentProceeding.version by 1"
        note: "fork branch 1 of the branching machine: no-response default"
      - from: RESPONSE_RECEIVED
        to: HEARING_HELD
        trigger: "POST /procurement/debarment-proceedings/{id}/hearing (contested branch)"
        actor: DebarmentAuthority
        preconditions:
          - "status == RESPONSE_RECEIVED"
        side_effects:
          - "records that the respondent was heard on the merits; the response's mitigating_factor_codes now participate in the final severity variant"
          - "increments DebarmentProceeding.version by 1"
        note: "fork branch 2: contested hearing. Both branches join at HEARING_HELD but carry different mitigating_credit_points into the decision."
      - from: HEARING_HELD
        to: DEBARRED
        trigger: "POST /procurement/debarment-proceedings/{id}/decision with outcome == DEBARRED"
        actor: DebarmentAuthority
        preconditions:
          - "status == HEARING_HELD"
          - "final severity_score >= 20, else ERR_SEVERITY_BELOW_DEBARMENT_FLOOR"
        side_effects:
          - "CASCADE B hop 1: recomputes severity_score and mitigating_credit_points under variant final_debarment_basis, sets debarment_period_months from the severity tier, debarment_start_utc = current clock, debarment_end_utc, decided_at_utc, strikes_applied = 1; drives Vendor -> DEBARRED and recomputes Vendor.debarment_strike_count, active_debarment_id, reinstatement_earliest_petition_utc"
          - "CASCADE B hop 2 (caused by hop 1): because Vendor.eligibility_status became DEBARRED, every Bid of that vendor whose solicitation.status IN {BIDS_OPENED, EVALUATION, AWARD_PENDING} and responsiveness_status IN {UNREVIEWED, RESPONSIVE} becomes NONRESPONSIVE with reason VENDOR_DEBARRED"
          - "CASCADE B hop 3 (caused by hop 2): because those Bid rows became NONRESPONSIVE, each affected Solicitation recomputes apparent_low_bid_id; a Solicitation in AWARD_PENDING whose apparent_low_bid_id changed transitions to EVALUATION"
          - "CASCADE B hop 4 (caused by hop 3): because that Solicitation left AWARD_PENDING, its Award with status == PENDING_STAY becomes VOID with void_reason_code APPARENT_LOW_BIDDER_CHANGED"
          - "separate fan-out (not part of the chain): SubcontractorScreening rows with sub_vendor_id == this vendor and result == CLEARED become BLOCKED_DEBARRED"
          - "increments DebarmentProceeding.version by 1"
      - from: HEARING_HELD
        to: DISMISSED
        trigger: "POST /procurement/debarment-proceedings/{id}/decision with outcome == DISMISSED"
        actor: DebarmentAuthority
        preconditions: ["status == HEARING_HELD"]
        side_effects:
          - "sets decided_at_utc, leaves debarment_period_months at 0 and debarment_start_utc null"
          - "compensating action: strikes_applied 1 -> 0 when an interim suspension was in force, interim_status INTERIM_SUSPENDED -> INTERIM_LIFTED, Vendor SUSPENDED -> ELIGIBLE, Vendor.debarment_strike_count recomputed"
          - "increments DebarmentProceeding.version by 1"
        note: "divergent side-effect set versus the DEBARRED branch: no vendor debarment, no bid cascade, strikes returned"
      - from: NONE
        to: INTERIM_SUSPENDED
        trigger: "system: POST /procurement/debarment-proceedings with interim_suspension == true"
        actor: system
        preconditions:
          - "interim_status == NONE"
          - "severity_score computed under variant interim_suspension_basis >= 35"
        side_effects:
          - "strikes_applied = 1 and the Vendor ELIGIBLE -> SUSPENDED cascade fires"
        note: "interim_status is the second, independent state dimension of DebarmentProceeding"
      - from: INTERIM_SUSPENDED
        to: INTERIM_LIFTED
        trigger: "system: any decision on the merits (DEBARRED or DISMISSED)"
        actor: system
        preconditions: ["interim_status == INTERIM_SUSPENDED"]
        side_effects:
          - "on DEBARRED: strikes_applied stays 1 and the vendor's strike count is unchanged"
          - "on DISMISSED: strikes_applied 1 -> 0 and the vendor's strike count decreases by 1"

  - entity: ReinstatementPetition
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /procurement/reinstatement-petitions/{id}/decision with outcome == GRANTED"
        actor: DebarmentAuthority
        preconditions:
          - "status == FILED"
          - "proceeding.status == DEBARRED"
        side_effects:
          - "sets decided_at_utc and decision_rationale"
          - "drives Vendor DEBARRED -> ELIGIBLE with its strike return and screening un-blocking cascade"
          - "increments ReinstatementPetition.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /procurement/reinstatement-petitions/{id}/decision with outcome == DENIED"
        actor: DebarmentAuthority
        preconditions:
          - "status == FILED"
          - "proceeding.status == DEBARRED"
        side_effects:
          - "sets decided_at_utc and decision_rationale; the vendor stays DEBARRED and a further petition may be filed"
          - "increments ReinstatementPetition.version by 1"

  - entity: QuestionSubmission
    initial_state: PENDING
    terminal_states: [ANSWERED, REJECTED_LATE]
    transitions:
      - from: PENDING
        to: ANSWERED
        trigger: "POST /procurement/solicitations/{id}/addenda listing this question in answers_question_ids"
        actor: ProcurementOfficer
        preconditions:
          - "status == PENDING"
          - "the question's solicitation_id equals the addendum's solicitation_id, else ERR_QUESTION_NOT_ON_SOLICITATION"
        side_effects:
          - "sets answer_summary = addendum.summary and answered_via_addendum_sequence = addendum.sequence_number"
      - from: PENDING
        to: REJECTED_LATE
        trigger: "system: POST /procurement/solicitations/{id}/questions submitted after question_deadline_utc while solicitation.status == ISSUED"
        actor: system
        preconditions:
          - "solicitation.status == ISSUED"
          - "current logical clock instant > solicitation.question_deadline_utc"
        side_effects:
          - "the row is created directly in status REJECTED_LATE and can never be answered"
        note: "a question submitted once solicitation.status == QUESTION_PERIOD_CLOSED is rejected outright with ERR_QUESTION_PERIOD_CLOSED and no row is created"

  - entity: SubcontractorScreening
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system: POST /procurement/subcontractor-screenings when the sub vendor is ELIGIBLE"
        actor: system
        preconditions: ["sub vendor eligibility_status == ELIGIBLE"]
        side_effects: ["sets screened_at_utc = current clock and blocked_reason_code = null"]
      - from: PENDING
        to: BLOCKED_SUSPENDED
        trigger: "system: POST /procurement/subcontractor-screenings when the sub vendor is SUSPENDED"
        actor: system
        preconditions: ["sub vendor eligibility_status == SUSPENDED"]
        side_effects: ["sets blocked_reason_code = sub vendor.suspension_reason_code"]
      - from: PENDING
        to: BLOCKED_DEBARRED
        trigger: "system: POST /procurement/subcontractor-screenings when the sub vendor is DEBARRED"
        actor: system
        preconditions: ["sub vendor eligibility_status == DEBARRED"]
        side_effects: ["sets blocked_reason_code = sub vendor.suspension_reason_code"]
      - from: CLEARED
        to: BLOCKED_DEBARRED
        trigger: "system: the sub vendor's eligibility_status became DEBARRED"
        actor: system
        preconditions: ["result == CLEARED"]
        side_effects:
          - "increments rescreened_count by 1, sets screened_at_utc = current clock, blocked_reason_code = sub vendor.suspension_reason_code"
          - "increments SubcontractorScreening.version by 1"
      - from: CLEARED
        to: BLOCKED_SUSPENDED
        trigger: "system: the sub vendor's eligibility_status became SUSPENDED"
        actor: system
        preconditions: ["result == CLEARED"]
        side_effects:
          - "increments rescreened_count by 1 and sets blocked_reason_code"
          - "increments SubcontractorScreening.version by 1"
      - from: BLOCKED_DEBARRED
        to: CLEARED
        trigger: "system: the sub vendor's eligibility_status returned to ELIGIBLE via a GRANTED reinstatement petition"
        actor: system
        preconditions: ["result == BLOCKED_DEBARRED"]
        side_effects:
          - "increments rescreened_count by 1, clears blocked_reason_code"
          - "increments SubcontractorScreening.version by 1"
      - from: BLOCKED_SUSPENDED
        to: CLEARED
        trigger: "system: the sub vendor's eligibility_status returned to ELIGIBLE via a DISMISSED proceeding"
        actor: system
        preconditions: ["result == BLOCKED_SUSPENDED"]
        side_effects:
          - "increments rescreened_count by 1, clears blocked_reason_code"
          - "increments SubcontractorScreening.version by 1"

concurrency_rules:
  - rule_id: bid-submit-stale-solicitation
    parent_entity: Solicitation
    write_endpoint: "POST /procurement/bids"
    occ_field: "expected_solicitation_version"
    description: |
      A vendor may legitimately submit a replacement bid that supersedes its own
      earlier bid on the same solicitation, so a second create against identical
      state would itself succeed. The system therefore requires the client to
      state the Solicitation version it last observed. When that version is
      behind the stored Solicitation.version — because an addendum was issued,
      the question period closed, or another bid create advanced it — the create
      is rejected, since the bidder may not have seen the current mandatory
      requirements or bid due date.
    error_id: ERR_STALE_SOLICITATION_VERSION
    http_status: 412
  - rule_id: reinstatement-petition-stale-proceeding
    parent_entity: DebarmentProceeding
    write_endpoint: "POST /procurement/debarment-proceedings/{id}/reinstatement-petitions"
    occ_field: "expected_proceeding_version"
    description: |
      A vendor may legitimately file a fresh ReinstatementPetition that
      supersedes an earlier DENIED petition on the same proceeding, so a second
      create against identical state would itself succeed. The client must state
      the DebarmentProceeding version it last observed; when that version is
      behind the stored DebarmentProceeding.version — because a prior petition
      decision advanced it — the create is rejected.
    error_id: ERR_STALE_PROCEEDING_VERSION
    http_status: 412

calculations:
  - name: bid_evaluated_price_cents
    trigger: "variant as_read on POST /procurement/solicitations/{id}/open-bids; variant corrected on POST /procurement/bids/{id}/responsiveness"
    algorithm: threshold
    formula: |
      # --- variant as_read (bid opening) ---
      evaluated_price_cents = bid.total_price_cents
      informality_loading_cents = 0

      # --- variant corrected (responsiveness determination) ---
      base = bid.corrected_total_price_cents if the request supplied
             corrected_total_price_cents else bid.total_price_cents
      unacked_informality_count =
        COUNT of Addendum rows a WHERE a.solicitation_id == bid.solicitation_id
          AND a.acknowledgment_required == true
          AND a.adds_material_requirement == false
          AND a.sequence_number NOT IN bid.acknowledged_addendum_sequences
      informality_loading_cents =
        ROUND_HALF_UP(base * INFORMALITY_LOADING_RATE * unacked_informality_count)
      evaluated_price_cents = base + informality_loading_cents
    input_set: |
      Addendum rows are counted over the whole solicitation with no status filter
      (Addendum has no lifecycle). Only addenda with acknowledgment_required == true
      AND adds_material_requirement == false enter the count: an unacknowledged
      MATERIAL addendum makes the bid NONRESPONSIVE (ERR_MATERIAL_REQUIREMENT_UNMET)
      instead of being priced. Bid rows with responsiveness_status == WITHDRAWN are
      never evaluated.
    constants:
      INFORMALITY_LOADING_RATE: 0.0025
    precision: "integer cents; a single ROUND_HALF_UP applied to base * rate * count — NOT one rounding per addendum"
    variants:
      - name: as_read
        when: "bid opening; no officer has yet examined the bid"
        difference: "evaluated_price_cents == total_price_cents exactly; informality loading and arithmetic corrections are ignored, so ranking at opening can name a different apparent low bidder than ranking after determinations"
      - name: corrected
        when: "responsiveness determination on that bid"
        difference: "arithmetic correction replaces the base price and the unacknowledged-informality loading is added, so the same bid row yields a strictly larger evaluated_price_cents whenever unacked_informality_count > 0"

  - name: debarment_severity_score
    trigger: "variant interim_suspension_basis on POST /procurement/debarment-proceedings; variant final_debarment_basis on POST /procurement/debarment-proceedings/{id}/decision"
    algorithm: weighted_scoring
    formula: |
      aggravating_total_points = SUM of AGGRAVATING_WEIGHTS[c] over the distinct
                                 members c of aggravating_factor_codes

      # --- variant interim_suspension_basis ---
      mitigating_credit_points = 0
      severity_score = MIN(100, aggravating_total_points)
      interim suspension is permitted iff severity_score >= INTERIM_THRESHOLD

      # --- variant final_debarment_basis ---
      raw_mitigation = SUM of MITIGATING_WEIGHTS[m] over the distinct members m of
                       mitigating_factor_codes
      mitigating_credit_points = MIN(raw_mitigation,
                                     MITIGATION_CAP_FRACTION * aggravating_total_points)
      prior_strikes = Vendor.debarment_strike_count MINUS this proceeding's own
                      strikes_applied (so an interim suspension by this same
                      proceeding never escalates its own severity)
      severity_score = MIN(100, MAX(0, aggravating_total_points
                                       - mitigating_credit_points
                                       + STRIKE_ESCALATION_POINTS * prior_strikes))
      debarment_period_months =
        60 if severity_score >= 80
        36 if severity_score >= 60
        24 if severity_score >= 40
        12 if severity_score >= 20
        0  otherwise  -> a DEBARRED outcome is refused with
                         ERR_SEVERITY_BELOW_DEBARMENT_FLOOR
    input_set: "aggravating_factor_codes as supplied at creation; mitigating_factor_codes as the union of those supplied at creation and those merged by POST .../response. prior_strikes counts only OTHER proceedings of the same vendor with status == DEBARRED or interim_status == INTERIM_SUSPENDED."
    constants:
      AGGRAVATING_WEIGHTS: { FRAUD: 40, BID_RIGGING: 35, FALSE_CERTIFICATION: 25, REPEATED_NONPERFORMANCE: 20, SAFETY_VIOLATION: 15, ADMINISTRATIVE_DEFAULT: 5 }
      MITIGATING_WEIGHTS: { SELF_DISCLOSURE: 15, RESTITUTION_PAID: 12, COMPLIANCE_PROGRAM: 10, COOPERATION: 8 }
      MITIGATION_CAP_FRACTION: 0.5
      STRIKE_ESCALATION_POINTS: 10
      INTERIM_THRESHOLD: 35
    precision: "severity_score carried as a number with two decimal places, ROUND_HALF_UP; debarment_period_months is an integer read off the tier table"
    variants:
      - name: interim_suspension_basis
        when: "the adequate-evidence standard at notice time (proceeding creation with interim_suspension == true)"
        difference: "mitigation is ignored entirely and prior strikes do not escalate, so severity_score equals the raw aggravating total"
      - name: final_debarment_basis
        when: "the preponderance standard at the merits decision"
        difference: "mitigation credit (capped at 50 percent of the aggravating total) is subtracted and prior strikes add 10 points each, so the same factor codes yield a materially different severity_score and hence a different debarment_period_months"

  - name: responsibility_composite_score
    trigger: "POST /procurement/bids/{id}/responsibility-reviews"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - tier-selected weight profile (>= is inclusive at the boundary)
      weight_profile = HIGH_VALUE if solicitation.estimated_value_cents >= HIGH_VALUE_THRESHOLD_CENTS
                       else STANDARD
      (w_fin, w_perf, w_integ) = WEIGHTS[weight_profile]

      # Step 2 - weighted raw score
      raw = financial_capacity_score * w_fin
          + past_performance_score  * w_perf
          + integrity_score         * w_integ

      # Step 3 - strike penalty, capped
      strike_penalty_points = MIN(STRIKE_PENALTY_CAP,
                                  STRIKE_PENALTY_PER_STRIKE * vendor.debarment_strike_count)

      # Step 4 - clamp
      capped = MAX(0, MIN(100, raw - strike_penalty_points))

      # Step 5 - integrity hard ceiling (conditional branch on an input field)
      composite_score = MIN(capped, INTEGRITY_FAILURE_CEILING)
                        if integrity_score < INTEGRITY_FLOOR else capped
      composite_score = ROUND_HALF_UP(composite_score, 2)

      # Step 6 - gate
      determination RESPONSIBLE requires composite_score >= RESPONSIBLE_THRESHOLD,
      else ERR_RESPONSIBILITY_SCORE_BELOW_THRESHOLD
    input_set: "the three factor scores from the request; vendor.debarment_strike_count as stored when the review is created; solicitation.estimated_value_cents of the bid's solicitation"
    constants:
      HIGH_VALUE_THRESHOLD_CENTS: 500000000
      WEIGHTS: { STANDARD: [0.3, 0.4, 0.3], HIGH_VALUE: [0.5, 0.3, 0.2] }
      STRIKE_PENALTY_PER_STRIKE: 7
      STRIKE_PENALTY_CAP: 20
      INTEGRITY_FLOOR: 40
      INTEGRITY_FAILURE_CEILING: 49
      RESPONSIBLE_THRESHOLD: 60.00
    precision: "two decimal places, ROUND_HALF_UP, applied once at the end of Step 5"

  - name: protest_filing_fee_cents
    trigger: "POST /procurement/protests"
    algorithm: tiered_pricing
    formula: |
      # component 1 - flat statutory base (already integral)
      c1 = BASE_FEE_CENTS

      # component 2 - ad valorem component on a descending rate ladder
      value_rate = 0.00075 if solicitation.estimated_value_cents <= 10000000
                   else 0.00050 if solicitation.estimated_value_cents <= 100000000
                   else 0.00025
      c2 = solicitation.estimated_value_cents * value_rate

      # component 3 - grounds surcharge as a multiple of the base fee
      c3 = BASE_FEE_CENTS * GROUND_MULTIPLIERS[protest.grounds_code]

      # PINNED ROUNDING ORDER: round EACH component to a whole cent with
      # ROUND_HALF_UP, THEN sum the rounded components.
      filing_fee_cents = ROUND_HALF_UP(c1) + ROUND_HALF_UP(c2) + ROUND_HALF_UP(c3)
      # The alternative order (sum the unrounded components, then round once) is
      # explicitly NOT used and yields a different number of cents whenever two
      # or more components carry a fractional part of exactly 0.5.
    input_set: "solicitation.estimated_value_cents of the protested solicitation and the protest's own grounds_code; no other protest on the solicitation affects the fee"
    constants:
      BASE_FEE_CENTS: 25000
      GROUND_MULTIPLIERS: { SOLICITATION_IMPROPRIETY: 0.1255, RESPONSIVENESS_DETERMINATION: 0.3335, RESPONSIBILITY_DETERMINATION: 0.2955, AWARD_IMPROPRIETY: 0.5015, EVALUATION_ERROR: 0.2135 }
    precision: "integer cents; ROUND_HALF_UP per component, then integer addition"

  - name: award_total_obligation_cents
    trigger: "POST /procurement/awards"
    algorithm: waterfall_allocation
    formula: |
      # Step 1
      base_obligation_cents = winning Bid.evaluated_price_cents
      # Step 2 - the administrative fee tier is selected on the PROVISIONAL total,
      #          which is base_obligation_cents ALONE. It is never re-selected on
      #          the final award_total_obligation_cents, even though that total is
      #          larger and may sit in a different tier. This pins what would
      #          otherwise be a circular definition.
      administrative_fee_rate = 0.0150 if base_obligation_cents <= 100000000
                                else 0.0110 if base_obligation_cents <= 500000000
                                else 0.0075
      # Step 3
      administrative_fee_cents = ROUND_HALF_UP(base_obligation_cents * administrative_fee_rate)
      # Step 4 - the reserve is a percentage of base + ALREADY-ROUNDED fee,
      #          never of the unrounded product from Step 3.
      has_resolved_protest = EXISTS a Protest p WHERE p.solicitation_id == award.solicitation_id
                             AND p.status IN {SUSTAINED, DENIED, WITHDRAWN}
      protest_risk_reserve_cents =
        ROUND_HALF_UP((base_obligation_cents + administrative_fee_cents) * PROTEST_RESERVE_RATE)
        if has_resolved_protest else 0
      # Step 5
      award_total_obligation_cents = base_obligation_cents
                                   + administrative_fee_cents
                                   + protest_risk_reserve_cents
    input_set: "the winning bid's evaluated_price_cents under the corrected variant; Protest rows on the same solicitation filtered to status IN {SUSTAINED, DENIED, WITHDRAWN} (protests still in {FILED, UNDER_REVIEW, HEARING_SCHEDULED} do NOT trigger the reserve)"
    constants:
      PROTEST_RESERVE_RATE: 0.0050
    precision: "integer cents; Step 3 and Step 4 each apply one ROUND_HALF_UP in the order shown"

  - name: solicitation_effective_bid_due_utc
    trigger: "POST /procurement/solicitations/{id}/issue and POST /procurement/solicitations/{id}/addenda"
    algorithm: aggregation
    formula: |
      cumulative_extension_days =
        SUM of a.extends_bid_due_by_days over ALL Addendum rows a with
        a.solicitation_id == this solicitation, applied in ascending
        a.sequence_number order (the sum is order-independent, but the cap check
        below is evaluated once per addendum in issuance order)
      if cumulative_extension_days > MAX_CUMULATIVE_EXTENSION_DAYS:
          reject the addendum in full with ERR_EXTENSION_CAP_EXCEEDED; no partial
          extension is applied and addendum_count is NOT incremented
      effective_bid_due_utc = original_bid_due_utc + cumulative_extension_days days
      if solicitation.status == ISSUED and the addendum has extends_bid_due_by_days > 0:
          question_deadline_utc = effective_bid_due_utc - QUESTION_CUTOFF_DAYS days
      else:
          question_deadline_utc is left unchanged (it is frozen once the
          solicitation reaches QUESTION_PERIOD_CLOSED)
    input_set: "every Addendum row of the solicitation, with no status filter; days are whole calendar days added to the UTC instant"
    constants:
      MAX_CUMULATIVE_EXTENSION_DAYS: 21
      QUESTION_CUTOFF_DAYS: 7
    precision: "whole days; the time-of-day component of original_bid_due_utc is preserved"

  - name: protest_timeliness_deadline_utc
    trigger: "POST /procurement/protests, evaluated before the fee debit"
    algorithm: threshold
    formula: |
      trigger_event_utc and window depend on grounds_code:
        SOLICITATION_IMPROPRIETY:
          trigger_event_utc = solicitation.effective_bid_due_utc
          timeliness_deadline_utc = trigger_event_utc - PRE_BID_MARGIN_DAYS days
        RESPONSIVENESS_DETERMINATION:
          trigger_event_utc = challenged Bid.responsiveness_decided_at_utc
          timeliness_deadline_utc = trigger_event_utc + STANDARD_WINDOW_DAYS days
        RESPONSIBILITY_DETERMINATION:
          trigger_event_utc = the ResponsibilityReview of the challenged bid with
                              the greatest decided_at_utc among rows whose
                              superseded_at_utc IS NULL; ties broken by ascending
                              created_at; if no such row exists ->
                              ERR_PROTEST_TRIGGER_EVENT_MISSING
          timeliness_deadline_utc = trigger_event_utc + STANDARD_WINDOW_DAYS days
        AWARD_IMPROPRIETY:
          trigger_event_utc = the Award of the solicitation with the greatest
                              created_at whose status IN {PENDING_STAY, EXECUTED};
                              if none -> ERR_PROTEST_TRIGGER_EVENT_MISSING
          timeliness_deadline_utc = trigger_event_utc + AWARD_WINDOW_DAYS days
        EVALUATION_ERROR:
          trigger_event_utc = solicitation.bids_opened_at_utc
          timeliness_deadline_utc = trigger_event_utc + STANDARD_WINDOW_DAYS days
      timely iff current logical clock instant <= timeliness_deadline_utc
      (inclusive: filing at exactly the deadline instant is TIMELY);
      otherwise ERR_PROTEST_UNTIMELY
    input_set: "one trigger event per grounds_code as pinned above; every selection names its filter, its ordering key and its tie-break"
    constants:
      STANDARD_WINDOW_DAYS: 7
      AWARD_WINDOW_DAYS: 10
      PRE_BID_MARGIN_DAYS: 1
    precision: "millisecond-precision UTC instants; comparison is <= (inclusive)"

  - name: reinstatement_earliest_petition_utc
    trigger: "POST /procurement/debarment-proceedings/{id}/decision with outcome DEBARRED (stamped onto Vendor) and re-evaluated on POST /procurement/debarment-proceedings/{id}/reinstatement-petitions"
    algorithm: threshold
    formula: |
      served_months_required = CEIL(proceeding.debarment_period_months
                                    * MIN_SERVED_FRACTION)
      reinstatement_earliest_petition_utc = proceeding.debarment_start_utc
                                            + served_months_required calendar months
      debarment_end_utc = proceeding.debarment_start_utc
                          + proceeding.debarment_period_months calendar months
      months_served_at_filing = whole calendar months elapsed from
                                debarment_start_utc to filed_at_utc
      a petition is accepted iff current logical clock instant
        >= reinstatement_earliest_petition_utc   (inclusive at the boundary)
      otherwise ERR_PETITION_PREMATURE
      Calendar-month addition preserves the day-of-month; when the target month is
      shorter than the source day-of-month, the result clamps to the last day of
      the target month at the same time of day.
    input_set: "the single proceeding named in the path, which MUST have status == DEBARRED"
    constants:
      MIN_SERVED_FRACTION: 0.5
    precision: "millisecond-precision UTC instants; comparison is >= (inclusive)"

  - name: apparent_low_bidder_selection
    trigger: "POST /procurement/solicitations/{id}/open-bids, POST /procurement/bids/{id}/responsiveness, POST /procurement/bids/{id}/responsibility-reviews, and every cascade that changes a Bid's responsiveness_status or responsibility_status"
    algorithm: chronological
    formula: |
      candidates = Bid rows b WHERE b.solicitation_id == this solicitation
                     AND b.responsiveness_status IN {UNREVIEWED, RESPONSIVE}
                     AND b.responsibility_status != NONRESPONSIBLE
                     AND b.evaluated_price_cents IS NOT NULL
      rank by  b.evaluated_price_cents ASC
      tie-break 1: b.created_at ASC
      tie-break 2: none required - (evaluated_price_cents, created_at) is unique
                   per solicitation because created_at carries millisecond
                   precision; Bid.id is NEVER consulted
      apparent_low_bid_id = candidates[0].id
      empty candidate set -> apparent_low_bid_id = null; a Solicitation in
                             AWARD_PENDING falls back to EVALUATION and
                             POST /procurement/awards fails with
                             ERR_NO_APPARENT_LOW_BIDDER
    input_set: "Bid rows of exactly one solicitation, filtered to the two responsiveness values and the two responsibility values listed above; WITHDRAWN and NONRESPONSIVE bids are excluded permanently"
    constants: {}
    precision: "integer cent comparison; no rounding"

  - name: hearing_officer_daily_docket_minutes
    trigger: "POST /procurement/protests/{id}/hearings and POST /procurement/hearings/{id}/continue"
    algorithm: aggregation
    formula: |
      day_window = [floor_to_utc_midnight(candidate.scheduled_start_utc),
                    floor_to_utc_midnight(candidate.scheduled_start_utc) + 1 day)
                   # half-open on the day boundary
      booked_minutes = SUM over ProtestHearing h WHERE
                         h.hearing_officer_user_id == candidate.hearing_officer_user_id
                         AND h.status IN {SCHEDULED, CONVENED}
                         AND h.scheduled_start_utc IN day_window
                         AND h.id != candidate.id
                       of (h.scheduled_end_utc - h.scheduled_start_utc) in whole minutes
      candidate_minutes = (candidate.scheduled_end_utc - candidate.scheduled_start_utc)
                          in whole minutes
      if booked_minutes + candidate_minutes > OFFICER_DAILY_MINUTE_CAP:
          reject with ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED
      # Exactly OFFICER_DAILY_MINUTE_CAP is permitted (> not >=).
    input_set: "ProtestHearing rows of the same hearing_officer_user_id with status IN {SCHEDULED, CONVENED}; rows in {CONCLUDED, CANCELLED} release their minutes; the candidate row itself is excluded when re-scheduling via continue"
    constants:
      OFFICER_DAILY_MINUTE_CAP: 480
    precision: "whole minutes; a window whose length is not a whole number of minutes is rejected by ERR_INVALID_REQUEST"

  - name: debarred_vendor_list_snapshot
    trigger: "GET /procurement/debarred-vendors"
    algorithm: aggregation
    formula: |
      as_of = as_of_utc query parameter when supplied, else the current logical
              clock instant
      statuses = {DEBARRED} when include_suspended is false or omitted,
                 {DEBARRED, SUSPENDED} when include_suspended is true
      rows = Vendor v WHERE v.eligibility_status IN statuses
               AND v.active_debarment_id IS NOT NULL
               AND ( the referenced DebarmentProceeding has debarment_end_utc IS NULL
                     OR debarment_end_utc > as_of )     # strictly greater: a
                                                        # debarment whose end
                                                        # instant equals as_of has
                                                        # expired and drops off
      order by the referenced proceeding's debarment_end_utc DESC
               (rows whose debarment_end_utc IS NULL sort first),
               then Vendor.created_at ASC
      then apply limit / offset
    input_set: "every Vendor row; the filter is exactly the status set above plus the non-null active_debarment_id and the end-instant window"
    constants: {}
    precision: "instants compared at millisecond precision"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body shape: every required input field present, enum members recognised, integers within their declared ranges, scheduled_end_utc strictly after scheduled_start_utc, hearing windows a whole number of minutes, original_question_deadline_utc strictly before original_bid_due_utc, arrays non-empty where declared non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "aggravating_factor_codes / mitigating_factor_codes / remediation_evidence_codes contain no repeated member"
    error_id: ERR_DUPLICATE_FACTOR_CODE
    http_status: 422
    applies_to: "POST /procurement/debarment-proceedings, POST /procurement/debarment-proceedings/{id}/response, POST /procurement/debarment-proceedings/{id}/reinstatement-petitions"
  - priority: 5
    category: existence
    check: "path resources exist, validated left to right: vendors/{id} -> ERR_VENDOR_NOT_FOUND, solicitations/{id} -> ERR_SOLICITATION_NOT_FOUND, bids/{id} -> ERR_BID_NOT_FOUND, protests/{id} -> ERR_PROTEST_NOT_FOUND, hearings/{id} -> ERR_HEARING_NOT_FOUND, awards/{id} -> ERR_AWARD_NOT_FOUND, debarment-proceedings/{id} -> ERR_PROCEEDING_NOT_FOUND, reinstatement-petitions/{id} -> ERR_PETITION_NOT_FOUND, subcontractor-screenings/{id} -> ERR_SCREENING_NOT_FOUND"
    error_id: ERR_SOLICITATION_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path id"
  - priority: 6
    category: existence
    check: "body foreign keys resolve: solicitation_id -> ERR_SOLICITATION_NOT_FOUND, vendor_id / prime_vendor_id / sub_vendor_id / protester_vendor_id -> ERR_VENDOR_NOT_FOUND, winning_bid_id / challenged_bid_id -> ERR_BID_NOT_FOUND, source_protest_id -> ERR_PROTEST_NOT_FOUND, answers_question_ids members -> ERR_QUESTION_NOT_FOUND"
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with foreign keys in its body"
  - priority: 7
    category: business_constraint
    check: "Vendor.tax_id is unique; Solicitation.solicitation_number is unique; MandatoryRequirement.requirement_code is unique within one solicitation"
    error_id: ERR_DUPLICATE_TAX_ID
    http_status: 409
    applies_to: "POST /procurement/vendors (ERR_DUPLICATE_TAX_ID), POST /procurement/solicitations and POST /procurement/solicitations/{id}/resolicit (ERR_DUPLICATE_SOLICITATION_NUMBER), POST /procurement/solicitations and POST /procurement/solicitations/{id}/addenda (ERR_DUPLICATE_REQUIREMENT_CODE)"
  - priority: 8
    category: auth
    check: "when X-User-Role == Vendor, X-User-ID equals the vendor-owned field of the target resource: bids.vendor_id, questions.vendor_id, protests.protester_vendor_id, proceeding.vendor_id, screening.prime_vendor_id"
    error_id: ERR_VENDOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /procurement/bids, POST /procurement/solicitations/{id}/questions, POST /procurement/protests, POST /procurement/protests/{id}/withdraw, POST /procurement/vendors/{id}/fee-deposits, POST /procurement/debarment-proceedings/{id}/response, POST /procurement/debarment-proceedings/{id}/reinstatement-petitions, POST /procurement/subcontractor-screenings"
  - priority: 9
    category: state
    check: "expected_solicitation_version equals the stored Solicitation.version; expected_proceeding_version equals the stored DebarmentProceeding.version"
    error_id: ERR_STALE_SOLICITATION_VERSION
    http_status: 412
    applies_to: "POST /procurement/bids (ERR_STALE_SOLICITATION_VERSION), POST /procurement/debarment-proceedings/{id}/reinstatement-petitions (ERR_STALE_PROCEEDING_VERSION)"
  - priority: 10
    category: state
    check: "the Solicitation is in a state that permits the requested operation per the Solicitation state machine"
    error_id: ERR_INVALID_SOLICITATION_STATE
    http_status: 409
    applies_to: "POST /procurement/solicitations/{id}/issue, /addenda, /close-question-period, /open-bids, /cancel, /resolicit, POST /procurement/bids, POST /procurement/bids/{id}/responsiveness, POST /procurement/awards"
  - priority: 11
    category: state
    check: "the Solicitation.status IN {ISSUED, QUESTION_PERIOD_CLOSED, BIDS_OPENED, EVALUATION, AWARD_PENDING, AWARDED}; DRAFT, CANCELLED and RESOLICITED solicitations accept no protest"
    error_id: ERR_SOLICITATION_NOT_PROTESTABLE
    http_status: 409
    applies_to: "POST /procurement/protests"
  - priority: 12
    category: state
    check: "the target Bid is in the responsiveness_status / responsibility_status pair the operation requires"
    error_id: ERR_INVALID_BID_STATE
    http_status: 409
    applies_to: "POST /procurement/bids/{id}/responsiveness, POST /procurement/bids/{id}/responsibility-reviews"
  - priority: 13
    category: state
    check: "the target Protest.status permits the operation; the target Protest.stay_status permits the stay override"
    error_id: ERR_INVALID_PROTEST_STATE
    http_status: 409
    applies_to: "POST /procurement/protests/{id}/hearings, /decision, /withdraw, /stay-override, /record-items"
  - priority: 14
    category: state
    check: "the target ProtestHearing.status permits convene / continue / conclude"
    error_id: ERR_INVALID_HEARING_STATE
    http_status: 409
    applies_to: "POST /procurement/hearings/{id}/convene, /continue, /conclude"
  - priority: 15
    category: state
    check: "the target DebarmentProceeding.status permits response / hearing / decision / petition filing; a petition requires status == DEBARRED"
    error_id: ERR_INVALID_PROCEEDING_STATE
    http_status: 409
    applies_to: "POST /procurement/debarment-proceedings/{id}/response, /hearing, /decision, /reinstatement-petitions"
  - priority: 16
    category: state
    check: "the target ReinstatementPetition.status == FILED"
    error_id: ERR_INVALID_PETITION_STATE
    http_status: 409
    applies_to: "POST /procurement/reinstatement-petitions/{id}/decision"
  - priority: 17
    category: state
    check: "a question may not be submitted once Solicitation.status == QUESTION_PERIOD_CLOSED or later; the question period may not be closed while the clock is before question_deadline_utc; bids may not be opened while the clock is before effective_bid_due_utc; a bid may not be submitted once the clock is strictly after effective_bid_due_utc"
    error_id: ERR_QUESTION_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /procurement/solicitations/{id}/questions (ERR_QUESTION_PERIOD_CLOSED), POST /procurement/solicitations/{id}/close-question-period (ERR_QUESTION_PERIOD_OPEN), POST /procurement/solicitations/{id}/open-bids (ERR_BID_PERIOD_OPEN), POST /procurement/bids (ERR_BID_DEADLINE_PASSED)"
  - priority: 18
    category: state
    check: "the acting or referenced Vendor.eligibility_status == ELIGIBLE"
    error_id: ERR_VENDOR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /procurement/bids, POST /procurement/bids/{id}/responsibility-reviews (with determination RESPONSIBLE)"
  - priority: 19
    category: state
    check: "a CANCELLED solicitation has no successor yet"
    error_id: ERR_ALREADY_RESOLICITED
    http_status: 409
    applies_to: "POST /procurement/solicitations/{id}/resolicit"
  - priority: 20
    category: state
    check: "current logical clock instant >= hearing.scheduled_start_utc"
    error_id: ERR_HEARING_NOT_YET_STARTED
    http_status: 409
    applies_to: "POST /procurement/hearings/{id}/convene"
  - priority: 21
    category: business_safety
    check: "segregation of duties: hearing_officer_user_id (on scheduling) and X-User-ID (on the decision) MUST differ from the protested Solicitation.issued_by_user_id"
    error_id: ERR_HEARING_OFFICER_CONFLICT
    http_status: 403
    applies_to: "POST /procurement/protests/{id}/hearings, POST /procurement/protests/{id}/decision"
  - priority: 22
    category: business_safety
    check: "segregation of duties: the acting ResponsibilityReviewer's X-User-ID MUST differ from Bid.responsiveness_decided_by_user_id"
    error_id: ERR_REVIEWER_CONFLICT
    http_status: 403
    applies_to: "POST /procurement/bids/{id}/responsibility-reviews"
  - priority: 23
    category: business_safety
    check: "standing: the protester has a Bid on the solicitation with responsiveness_status IN {UNREVIEWED, RESPONSIVE, NONRESPONSIVE} (standing_basis ACTUAL_BIDDER); or, only for grounds_code == SOLICITATION_IMPROPRIETY, a QuestionSubmission on the solicitation with status IN {PENDING, ANSWERED} (standing_basis PROSPECTIVE_BIDDER). A vendor whose only Bid has responsiveness_status == WITHDRAWN has no standing."
    error_id: ERR_PROTESTER_LACKS_STANDING
    http_status: 403
    applies_to: "POST /procurement/protests"
  - priority: 24
    category: business_safety
    check: "agency record sufficiency: convening requires Protest.record_item_count >= 1; concluding a hearing and issuing a decision require Protest.record_item_count >= 2"
    error_id: ERR_AGENCY_RECORD_INCOMPLETE
    http_status: 409
    applies_to: "POST /procurement/hearings/{id}/convene, POST /procurement/hearings/{id}/conclude, POST /procurement/protests/{id}/decision"
  - priority: 25
    category: business_safety
    check: "a protest decision requires at least one ProtestHearing on the protest with status == CONCLUDED"
    error_id: ERR_HEARING_NOT_CONCLUDED
    http_status: 409
    applies_to: "POST /procurement/protests/{id}/decision"
  - priority: 26
    category: business_safety
    check: "a debarment hearing on a proceeding still in NOTICE_ISSUED requires the response window to have expired (clock > response_deadline_utc)"
    error_id: ERR_DEBARMENT_HEARING_RIGHTS_NOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /procurement/debarment-proceedings/{id}/hearing"
  - priority: 27
    category: business_safety
    check: "a bid may not be found RESPONSIVE while any MandatoryRequirement with materiality == MATERIAL introduced by an addendum is unacknowledged"
    error_id: ERR_MATERIAL_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /procurement/bids/{id}/responsiveness"
  - priority: 28
    category: business_safety
    check: "interim suspension requires severity_score under variant interim_suspension_basis >= 35"
    error_id: ERR_INTERIM_SUSPENSION_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /procurement/debarment-proceedings"
  - priority: 29
    category: business_safety
    check: "a DEBARRED outcome requires final severity_score >= 20 so that debarment_period_months > 0"
    error_id: ERR_SEVERITY_BELOW_DEBARMENT_FLOOR
    http_status: 422
    applies_to: "POST /procurement/debarment-proceedings/{id}/decision"
  - priority: 30
    category: business_safety
    check: "a RESPONSIBLE determination requires composite_score >= 60.00"
    error_id: ERR_RESPONSIBILITY_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /procurement/bids/{id}/responsibility-reviews"
  - priority: 31
    category: business_temporal
    check: "current logical clock instant <= protest_timeliness_deadline_utc for the protest's grounds_code"
    error_id: ERR_PROTEST_UNTIMELY
    http_status: 409
    applies_to: "POST /procurement/protests"
  - priority: 32
    category: business_temporal
    check: "the trigger event required by the protest's grounds_code exists (responsiveness determination, operative responsibility review, or award)"
    error_id: ERR_PROTEST_TRIGGER_EVENT_MISSING
    http_status: 422
    applies_to: "POST /procurement/protests"
  - priority: 33
    category: business_temporal
    check: "current logical clock instant >= vendor.reinstatement_earliest_petition_utc (CEIL(period_months * 0.5) months served, inclusive at the boundary)"
    error_id: ERR_PETITION_PREMATURE
    http_status: 409
    applies_to: "POST /procurement/debarment-proceedings/{id}/reinstatement-petitions"
  - priority: 34
    category: business_temporal
    check: "current logical clock instant <= proceeding.response_deadline_utc"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /procurement/debarment-proceedings/{id}/response"
  - priority: 35
    category: business_constraint
    check: "hearing room occupation: for the same room_code, the candidate half-open interval [scheduled_start_utc, scheduled_end_utc) must not come within CHANGEOVER_BUFFER_MINUTES (30) of any OTHER ProtestHearing interval whose status IN {SCHEDULED, CONVENED} (the candidate row itself is excluded when re-scheduling via continue). Formally a conflict exists iff candidate_start < existing_end + 30min AND existing_start < candidate_end + 30min, so exactly adjacent bookings DO conflict."
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /procurement/protests/{id}/hearings, POST /procurement/hearings/{id}/continue"
  - priority: 36
    category: business_constraint
    check: "hearing officer docket: booked_minutes + candidate_minutes <= 480 within the half-open UTC calendar day containing the candidate's scheduled_start_utc, per calculations.hearing_officer_daily_docket_minutes. Adjacency is permitted for the same officer: no buffer applies on this axis."
    error_id: ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /procurement/protests/{id}/hearings, POST /procurement/hearings/{id}/continue"
  - priority: 37
    category: business_constraint
    check: "respondent-vendor compliance docket: the new notice instant must not fall inside any CLOSED occupancy interval [notice_issued_at_utc, occupancy_end_utc] of another DebarmentProceeding of the same vendor, where occupancy_end_utc = debarment_end_utc when status == DEBARRED, decided_at_utc when status == DISMISSED, and notice_issued_at_utc + 3650 days while status IN {NOTICE_ISSUED, RESPONSE_RECEIVED, HEARING_HELD}. Both endpoints are inclusive, so a notice issued at exactly the prior debarment_end_utc is rejected."
    error_id: ERR_ACTIVE_PROCEEDING_EXISTS
    http_status: 409
    applies_to: "POST /procurement/debarment-proceedings"
  - priority: 38
    category: business_constraint
    check: "cumulative_extension_days + extends_bid_due_by_days <= 21"
    error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /procurement/solicitations/{id}/addenda"
  - priority: 39
    category: business_constraint
    check: "hearing.continuance_count < 2 before a continuance is granted"
    error_id: ERR_CONTINUANCE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /procurement/hearings/{id}/continue"
  - priority: 40
    category: business_constraint
    check: "a solicitation must carry at least one MandatoryRequirement before issuance"
    error_id: ERR_NO_MANDATORY_REQUIREMENTS
    http_status: 422
    applies_to: "POST /procurement/solicitations/{id}/issue"
  - priority: 41
    category: business_constraint
    check: "bid opening requires at least one Bid on the solicitation with responsiveness_status != WITHDRAWN (the empty-collection edge)"
    error_id: ERR_NO_BIDS_RECEIVED
    http_status: 409
    applies_to: "POST /procurement/solicitations/{id}/open-bids"
  - priority: 42
    category: business_constraint
    check: "award creation requires solicitation.apparent_low_bid_id IS NOT NULL"
    error_id: ERR_NO_APPARENT_LOW_BIDDER
    http_status: 409
    applies_to: "POST /procurement/awards"
  - priority: 43
    category: business_constraint
    check: "no Protest on the solicitation has stay_status == ACTIVE"
    error_id: ERR_AWARD_STAYED
    http_status: 409
    applies_to: "POST /procurement/awards, POST /procurement/awards/{id}/execute"
  - priority: 44
    category: business_constraint
    check: "subcontract tier is within 1..3, and prime_vendor_id != sub_vendor_id"
    error_id: ERR_SUBCONTRACT_TIER_UNSUPPORTED
    http_status: 422
    applies_to: "POST /procurement/subcontractor-screenings (ERR_SUBCONTRACT_TIER_UNSUPPORTED, ERR_SELF_SUBCONTRACT)"
  - priority: 45
    category: business_referential
    check: "challenged_bid_id (when supplied) belongs to the protested solicitation; winning_bid_id belongs to the awarded solicitation; answers_question_ids members belong to the addendum's solicitation"
    error_id: ERR_BID_NOT_ON_SOLICITATION
    http_status: 422
    applies_to: "POST /procurement/protests, POST /procurement/awards (ERR_BID_NOT_ON_SOLICITATION), POST /procurement/solicitations/{id}/addenda (ERR_QUESTION_NOT_ON_SOLICITATION)"
  - priority: 46
    category: business_referential
    check: "a responsibility review may only be created against the bid whose id == solicitation.apparent_low_bid_id; an award's winning_bid_id must equal solicitation.apparent_low_bid_id"
    error_id: ERR_NOT_APPARENT_LOW_BIDDER
    http_status: 409
    applies_to: "POST /procurement/bids/{id}/responsibility-reviews, POST /procurement/awards"
  - priority: 47
    category: business_referential
    check: "the respondent vendor is not already DEBARRED when a new proceeding is opened; no ReinstatementPetition with status == FILED already exists on the proceeding"
    error_id: ERR_VENDOR_ALREADY_DEBARRED
    http_status: 409
    applies_to: "POST /procurement/debarment-proceedings (ERR_VENDOR_ALREADY_DEBARRED), POST /procurement/debarment-proceedings/{id}/reinstatement-petitions (ERR_PETITION_ALREADY_PENDING)"
  - priority: 48
    category: business_fiscal
    check: "protester Vendor.protest_fee_balance_cents >= computed filing_fee_cents; fee deposits must have amount_cents > 0"
    error_id: ERR_INSUFFICIENT_FEE_BALANCE
    http_status: 402
    applies_to: "POST /procurement/protests"

endpoints:
  - method: POST
    path: "/procurement/vendors"
    description: "register a vendor in the state vendor file"
    roles: [SystemAdmin]
    code: 201
    input: [legal_name, tax_id, contact_email]
    output: Vendor
    side_effects: ["creates Vendor with eligibility_status ELIGIBLE, protest_fee_balance_cents 0, debarment_strike_count 0, version 1"]
  - method: GET
    path: "/procurement/vendors/{id}"
    description: "read one vendor"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/procurement/vendors"
    description: "list vendors with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["eligibility_status?", "tax_id?", "active_debarment_id?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: POST
    path: "/procurement/vendors/{id}/fee-deposits"
    description: "credit the vendor's protest-filing-fee balance"
    roles: [SystemAdmin, Vendor]
    code: 200
    input: [amount_cents]
    output: Vendor
    side_effects: ["adds amount_cents to protest_fee_balance_cents", "increments Vendor.version by 1"]
  - method: GET
    path: "/procurement/vendors/{id}/questions"
    description: "list the question submissions filed by one vendor across all solicitations"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QuestionSubmission[]
    side_effects: []
  - method: GET
    path: "/procurement/debarred-vendors"
    description: "the maintained debarred-vendor list; see calculations.debarred_vendor_list_snapshot"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["include_suspended?", "as_of_utc?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: POST
    path: "/procurement/solicitations"
    description: "draft a solicitation together with its original mandatory requirements"
    roles: [ProcurementOfficer]
    code: 201
    input: [solicitation_number, title, issuing_agency_code, estimated_value_cents, original_bid_due_utc, original_question_deadline_utc, mandatory_requirements, "predecessor_solicitation_id?"]
    output: Solicitation
    side_effects: ["creates one MandatoryRequirement per mandatory_requirements entry with introduced_by_addendum_sequence 0", "status = DRAFT"]
  - method: GET
    path: "/procurement/solicitations/{id}"
    description: "read one solicitation with its computed fields"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Solicitation
    side_effects: []
  - method: GET
    path: "/procurement/solicitations"
    description: "list solicitations with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["status?", "issuing_agency_code?", "predecessor_solicitation_id?", "apparent_low_bid_id?", "limit?", "offset?"]
    output: Solicitation[]
    side_effects: []
  - method: POST
    path: "/procurement/solicitations/{id}/issue"
    description: "advertise the solicitation, opening the question period"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["DRAFT -> ISSUED", "stamps issued_by_user_id from X-User-ID", "sets effective_bid_due_utc and question_deadline_utc", "increments Solicitation.version by 1"]
  - method: POST
    path: "/procurement/solicitations/{id}/addenda"
    description: "issue an addendum: extend the bid due date, add mandatory requirements, answer questions"
    roles: [ProcurementOfficer]
    code: 201
    input: [summary, "extends_bid_due_by_days?", "acknowledgment_required?", "new_requirement_codes?", "answers_question_ids?"]
    output: Addendum
    side_effects: ["creates Addendum and its MandatoryRequirement rows", "recomputes cumulative_extension_days, addendum_count, effective_bid_due_utc, question_deadline_utc", "sets answered questions to ANSWERED", "increments Solicitation.version by 1"]
  - method: GET
    path: "/procurement/solicitations/{id}/addenda"
    description: "list the addenda of a solicitation in ascending sequence_number"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Addendum[]
    side_effects: []
  - method: GET
    path: "/procurement/solicitations/{id}/requirements"
    description: "list the mandatory requirements of a solicitation"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["materiality?", "limit?", "offset?"]
    output: MandatoryRequirement[]
    side_effects: []
  - method: POST
    path: "/procurement/solicitations/{id}/questions"
    description: "submit a written question during the question period"
    roles: [Vendor]
    code: 201
    input: [vendor_id, question_text]
    output: QuestionSubmission
    side_effects: ["creates QuestionSubmission in PENDING, or directly in REJECTED_LATE when the clock is past question_deadline_utc while status == ISSUED"]
  - method: GET
    path: "/procurement/solicitations/{id}/questions"
    description: "list the questions filed on a solicitation"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QuestionSubmission[]
    side_effects: []
  - method: POST
    path: "/procurement/solicitations/{id}/close-question-period"
    description: "close the question period once the deadline has passed"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["ISSUED -> QUESTION_PERIOD_CLOSED", "freezes question_deadline_utc", "increments Solicitation.version by 1"]
  - method: POST
    path: "/procurement/solicitations/{id}/open-bids"
    description: "publicly open the bids received"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["QUESTION_PERIOD_CLOSED -> BIDS_OPENED", "sets bids_opened_at_utc", "sets evaluated_price_cents on every non-withdrawn Bid under variant as_read", "recomputes apparent_low_bid_id", "increments Solicitation.version by 1"]
  - method: POST
    path: "/procurement/solicitations/{id}/cancel"
    description: "cancel the solicitation"
    roles: [ProcurementOfficer]
    code: 200
    input: [cancellation_reason]
    output: Solicitation
    side_effects: ["-> CANCELLED", "marks non-terminal bids NONRESPONSIVE", "voids any PENDING_STAY Award", "sets apparent_low_bid_id = null", "increments Solicitation.version by 1"]
  - method: POST
    path: "/procurement/solicitations/{id}/resolicit"
    description: "create the successor solicitation of a cancelled procurement"
    roles: [ProcurementOfficer]
    code: 201
    input: [new_solicitation_number, original_bid_due_utc, original_question_deadline_utc]
    output: Solicitation
    side_effects: ["CANCELLED -> RESOLICITED on the predecessor", "creates a DRAFT successor with predecessor_solicitation_id set and copies the original mandatory requirements", "increments the predecessor's Solicitation.version by 1"]
  - method: POST
    path: "/procurement/bids"
    description: "submit or replace a sealed bid"
    roles: [Vendor]
    code: 201
    input: [solicitation_id, vendor_id, total_price_cents, "acknowledged_addendum_sequences?", expected_solicitation_version]
    output: Bid
    side_effects: ["creates Bid in UNREVIEWED / NOT_REVIEWED", "an earlier bid from the same vendor on the same solicitation becomes WITHDRAWN with superseded_by_bid_id set", "increments Solicitation.version by 1"]
  - method: GET
    path: "/procurement/bids/{id}"
    description: "read one bid"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/procurement/bids"
    description: "list bids with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["solicitation_id?", "vendor_id?", "responsiveness_status?", "responsibility_status?", "superseded_by_bid_id?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: POST
    path: "/procurement/bids/{id}/responsiveness"
    description: "record the responsiveness determination on a bid"
    roles: [ProcurementOfficer]
    code: 200
    input: [determination, "reason_codes?", "corrected_total_price_cents?"]
    output: Bid
    side_effects: ["recomputes evaluated_price_cents under variant corrected", "stamps responsiveness_decided_at_utc and responsiveness_decided_by_user_id", "fires Solicitation BIDS_OPENED -> EVALUATION", "recomputes apparent_low_bid_id", "increments Bid.version by 1"]
  - method: POST
    path: "/procurement/bids/{id}/responsibility-reviews"
    description: "record the responsibility review of the apparent low bidder"
    roles: [ResponsibilityReviewer]
    code: 201
    input: [financial_capacity_score, past_performance_score, integrity_score, determination, "notes?"]
    output: ResponsibilityReview
    side_effects: ["computes weight_profile, strike_penalty_points, composite_score", "sets Bid.responsibility_status", "fires Solicitation EVALUATION -> AWARD_PENDING on a RESPONSIBLE determination", "recomputes apparent_low_bid_id on a NONRESPONSIBLE determination", "increments Bid.version by 1"]
  - method: GET
    path: "/procurement/bids/{id}/responsibility-reviews"
    description: "list the responsibility reviews recorded against a bid"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ResponsibilityReview[]
    side_effects: []
  - method: POST
    path: "/procurement/awards"
    description: "issue the notice of award, subject to the statutory stay"
    roles: [ProcurementOfficer]
    code: 201
    input: [solicitation_id, winning_bid_id]
    output: Award
    side_effects: ["creates Award in PENDING_STAY", "computes base_obligation_cents, administrative_fee_rate, administrative_fee_cents, protest_risk_reserve_cents, award_total_obligation_cents", "copies vendor_id from the winning bid"]
  - method: POST
    path: "/procurement/awards/{id}/execute"
    description: "execute the award once no stay is in force"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Award
    side_effects: ["PENDING_STAY -> EXECUTED", "drives Solicitation AWARD_PENDING -> AWARDED", "increments Award.version by 1"]
  - method: GET
    path: "/procurement/awards/{id}"
    description: "read one award"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: GET
    path: "/procurement/awards"
    description: "list awards with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["solicitation_id?", "winning_bid_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: Award[]
    side_effects: []
  - method: POST
    path: "/procurement/protests"
    description: "file a bid protest; computes the filing fee, the timeliness deadline and the automatic stay"
    roles: [Vendor]
    code: 201
    input: [solicitation_id, protester_vendor_id, grounds_code, narrative, "challenged_bid_id?"]
    output: Protest
    side_effects: ["computes timeliness_deadline_utc, standing_basis and filing_fee_cents", "debits the protester's protest_fee_balance_cents and credits solicitation.protest_escrow_cents by filing_fee_cents", "sets stay_status = ACTIVE when no award is EXECUTED", "increments Vendor.version and Solicitation.version by 1"]
  - method: GET
    path: "/procurement/protests/{id}"
    description: "read one protest"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/procurement/protests"
    description: "list protests with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["solicitation_id?", "protester_vendor_id?", "challenged_bid_id?", "status?", "stay_status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []
  - method: POST
    path: "/procurement/protests/{id}/record-items"
    description: "file a document into the agency record of a protest"
    roles: [ProcurementOfficer, HearingOfficer, Vendor]
    code: 201
    input: [item_type, document_ref]
    output: AgencyRecordItem
    side_effects: ["appends the item with sequence_number = record_item_count + 1", "recomputes Protest.record_item_count", "fires Protest FILED -> UNDER_REVIEW when the item is the AGENCY_REPORT filed by a ProcurementOfficer", "increments Protest.version by 1"]
  - method: GET
    path: "/procurement/protests/{id}/record-items"
    description: "read the agency record of a protest in ascending sequence_number"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["item_type?", "limit?", "offset?"]
    output: AgencyRecordItem[]
    side_effects: []
  - method: POST
    path: "/procurement/protests/{id}/hearings"
    description: "schedule a protest hearing in a room on an officer's docket"
    roles: [HearingOfficer]
    code: 201
    input: [hearing_officer_user_id, scheduled_start_utc, scheduled_end_utc, room_code]
    output: ProtestHearing
    side_effects: ["creates ProtestHearing in SCHEDULED", "drives Protest UNDER_REVIEW -> HEARING_SCHEDULED", "increments Protest.version by 1"]
  - method: GET
    path: "/procurement/protests/{id}/hearings"
    description: "list the hearings scheduled on a protest"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProtestHearing[]
    side_effects: []
  - method: GET
    path: "/procurement/hearings/{id}"
    description: "read one protest hearing"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: ProtestHearing
    side_effects: []
  - method: POST
    path: "/procurement/hearings/{id}/convene"
    description: "convene a scheduled hearing"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: ProtestHearing
    side_effects: ["SCHEDULED -> CONVENED", "sets convened_at_utc", "increments ProtestHearing.version by 1"]
  - method: POST
    path: "/procurement/hearings/{id}/continue"
    description: "grant a continuance and re-schedule the convened hearing"
    roles: [HearingOfficer]
    code: 200
    input: [scheduled_start_utc, scheduled_end_utc, room_code, continuance_reason]
    output: ProtestHearing
    side_effects: ["CONVENED -> SCHEDULED", "increments continuance_count by 1", "clears convened_at_utc", "re-runs the room and docket checks", "increments ProtestHearing.version by 1"]
  - method: POST
    path: "/procurement/hearings/{id}/conclude"
    description: "close the hearing record"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: ProtestHearing
    side_effects: ["CONVENED -> CONCLUDED", "sets concluded_at_utc and record_items_reviewed_count", "drives Protest HEARING_SCHEDULED -> UNDER_REVIEW", "increments ProtestHearing.version by 1"]
  - method: POST
    path: "/procurement/protests/{id}/decision"
    description: "issue the protest decision and order the remedy"
    roles: [HearingOfficer]
    code: 200
    input: [outcome, rationale, "remedy_code?"]
    output: Protest
    side_effects: ["UNDER_REVIEW -> SUSTAINED or DENIED", "lifts the stay", "on SUSTAINED refunds filing_fee_cents to the protester and debits solicitation.protest_escrow_cents", "on SUSTAINED with remedy CORRECTIVE_ACTION runs cascade A hops 2-5", "on SUSTAINED with remedy CANCELLATION or RESOLICITATION drives the solicitation to CANCELLED", "increments Protest.version by 1"]
  - method: POST
    path: "/procurement/protests/{id}/withdraw"
    description: "withdraw a pending protest"
    roles: [Vendor]
    code: 200
    input: ["withdrawal_reason?"]
    output: Protest
    side_effects: ["-> WITHDRAWN", "lifts the stay", "refunds filing_fee_cents to the protester and debits solicitation.protest_escrow_cents", "cancels any SCHEDULED hearing", "increments Protest.version by 1"]
  - method: POST
    path: "/procurement/protests/{id}/stay-override"
    description: "override the automatic stay on written urgency findings"
    roles: [ProcurementOfficer]
    code: 200
    input: [urgency_justification]
    output: Protest
    side_effects: ["stay_status ACTIVE -> OVERRIDDEN", "increments Protest.version by 1"]
  - method: POST
    path: "/procurement/debarment-proceedings"
    description: "issue a notice of proposed debarment, optionally with interim suspension"
    roles: [DebarmentAuthority]
    code: 201
    input: [vendor_id, cause_code, aggravating_factor_codes, "mitigating_factor_codes?", "source_protest_id?", "interim_suspension?"]
    output: DebarmentProceeding
    side_effects: ["creates the proceeding in NOTICE_ISSUED with notice_issued_at_utc and response_deadline_utc", "computes aggravating_total_points and severity_score under variant interim_suspension_basis", "with interim_suspension true sets interim_status = INTERIM_SUSPENDED, strikes_applied = 1 and drives Vendor ELIGIBLE -> SUSPENDED with its bid and screening cascades"]
  - method: GET
    path: "/procurement/debarment-proceedings/{id}"
    description: "read one debarment proceeding"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: DebarmentProceeding
    side_effects: []
  - method: GET
    path: "/procurement/debarment-proceedings"
    description: "list debarment proceedings with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["vendor_id?", "source_protest_id?", "status?", "interim_status?", "limit?", "offset?"]
    output: DebarmentProceeding[]
    side_effects: []
  - method: POST
    path: "/procurement/debarment-proceedings/{id}/response"
    description: "file the respondent's written response within the notice window"
    roles: [Vendor]
    code: 200
    input: [response_narrative, "mitigating_factor_codes?"]
    output: DebarmentProceeding
    side_effects: ["NOTICE_ISSUED -> RESPONSE_RECEIVED", "merges the supplied mitigating_factor_codes", "increments DebarmentProceeding.version by 1"]
  - method: POST
    path: "/procurement/debarment-proceedings/{id}/hearing"
    description: "hold the debarment hearing (contested branch) or record the default branch"
    roles: [DebarmentAuthority]
    code: 200
    input: [hearing_summary]
    output: DebarmentProceeding
    side_effects: ["NOTICE_ISSUED or RESPONSE_RECEIVED -> HEARING_HELD", "increments DebarmentProceeding.version by 1"]
  - method: POST
    path: "/procurement/debarment-proceedings/{id}/decision"
    description: "decide the debarment on the merits"
    roles: [DebarmentAuthority]
    code: 200
    input: [outcome, rationale]
    output: DebarmentProceeding
    side_effects: ["HEARING_HELD -> DEBARRED or DISMISSED", "recomputes severity_score under variant final_debarment_basis and sets debarment_period_months, debarment_start_utc, debarment_end_utc", "on DEBARRED runs cascade B hops 1-4 and the screening fan-out", "on DISMISSED returns any interim strike and restores the vendor", "increments DebarmentProceeding.version by 1"]
  - method: POST
    path: "/procurement/debarment-proceedings/{id}/reinstatement-petitions"
    description: "petition for reinstatement after the required portion of the debarment period has been served"
    roles: [Vendor]
    code: 201
    input: [remediation_evidence_codes, narrative, expected_proceeding_version]
    output: ReinstatementPetition
    side_effects: ["creates ReinstatementPetition in FILED with months_served_at_filing", "increments DebarmentProceeding.version by 1"]
  - method: GET
    path: "/procurement/debarment-proceedings/{id}/reinstatement-petitions"
    description: "list the reinstatement petitions filed on a proceeding"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReinstatementPetition[]
    side_effects: []
  - method: GET
    path: "/procurement/reinstatement-petitions/{id}"
    description: "read one reinstatement petition"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: ReinstatementPetition
    side_effects: []
  - method: POST
    path: "/procurement/reinstatement-petitions/{id}/decision"
    description: "grant or deny a reinstatement petition"
    roles: [DebarmentAuthority]
    code: 200
    input: [outcome, decision_rationale]
    output: ReinstatementPetition
    side_effects: ["FILED -> GRANTED or DENIED", "on GRANTED drives Vendor DEBARRED -> ELIGIBLE, returns the strike and un-blocks the vendor's screenings", "increments ReinstatementPetition.version by 1"]
  - method: POST
    path: "/procurement/subcontractor-screenings"
    description: "screen a proposed subcontractor against the debarred-vendor list"
    roles: [ProcurementOfficer, Vendor]
    code: 201
    input: [solicitation_id, prime_vendor_id, sub_vendor_id, tier]
    output: SubcontractorScreening
    side_effects: ["evaluates result from the sub vendor's eligibility_status and sets blocked_reason_code and screened_at_utc in the same request"]
  - method: GET
    path: "/procurement/subcontractor-screenings/{id}"
    description: "read one subcontractor screening"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: []
    output: SubcontractorScreening
    side_effects: []
  - method: GET
    path: "/procurement/subcontractor-screenings"
    description: "list subcontractor screenings with filters"
    roles: [ProcurementOfficer, ResponsibilityReviewer, HearingOfficer, DebarmentAuthority, Vendor, SystemAdmin]
    code: 200
    input: ["solicitation_id?", "prime_vendor_id?", "sub_vendor_id?", "result?", "limit?", "offset?"]
    output: SubcontractorScreening[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: move the server's logical clock to an arbitrary instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent deadline, window and expiry evaluation uses the new instant"]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "authentication headers missing or unrecognised"
    trigger: "X-User-Role or X-User-ID absent, or X-User-Role not one of the six declared roles"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    message: "role not permitted for this operation"
    trigger: "the acting role is absent from the endpoint's roles list"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "request body failed shape validation"
    trigger: "missing required field, unrecognised enum member, out-of-range integer, non-positive interval, question deadline not before bid due date"
  - error_id: ERR_DUPLICATE_FACTOR_CODE
    http_status: 422
    message: "factor or evidence code list contains a repeated member"
    trigger: "aggravating_factor_codes, mitigating_factor_codes or remediation_evidence_codes has a duplicate"
  - error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    message: "vendor not found"
    trigger: "vendors/{id}, vendor_id, prime_vendor_id, sub_vendor_id or protester_vendor_id does not resolve"
  - error_id: ERR_SOLICITATION_NOT_FOUND
    http_status: 404
    message: "solicitation not found"
    trigger: "solicitations/{id} or solicitation_id does not resolve"
  - error_id: ERR_BID_NOT_FOUND
    http_status: 404
    message: "bid not found"
    trigger: "bids/{id}, winning_bid_id or challenged_bid_id does not resolve"
  - error_id: ERR_QUESTION_NOT_FOUND
    http_status: 404
    message: "question submission not found"
    trigger: "a member of answers_question_ids does not resolve"
  - error_id: ERR_PROTEST_NOT_FOUND
    http_status: 404
    message: "protest not found"
    trigger: "protests/{id} or source_protest_id does not resolve"
  - error_id: ERR_HEARING_NOT_FOUND
    http_status: 404
    message: "protest hearing not found"
    trigger: "hearings/{id} does not resolve"
  - error_id: ERR_AWARD_NOT_FOUND
    http_status: 404
    message: "award not found"
    trigger: "awards/{id} does not resolve"
  - error_id: ERR_PROCEEDING_NOT_FOUND
    http_status: 404
    message: "debarment proceeding not found"
    trigger: "debarment-proceedings/{id} does not resolve"
  - error_id: ERR_PETITION_NOT_FOUND
    http_status: 404
    message: "reinstatement petition not found"
    trigger: "reinstatement-petitions/{id} does not resolve"
  - error_id: ERR_SCREENING_NOT_FOUND
    http_status: 404
    message: "subcontractor screening not found"
    trigger: "subcontractor-screenings/{id} does not resolve"
  - error_id: ERR_DUPLICATE_TAX_ID
    http_status: 409
    message: "a vendor with this tax id already exists"
    trigger: "POST /procurement/vendors with an already-registered tax_id"
  - error_id: ERR_DUPLICATE_SOLICITATION_NUMBER
    http_status: 409
    message: "solicitation number already in use"
    trigger: "POST /procurement/solicitations or /resolicit with an existing solicitation_number"
  - error_id: ERR_DUPLICATE_REQUIREMENT_CODE
    http_status: 409
    message: "requirement code already present on this solicitation"
    trigger: "a mandatory_requirements entry or new_requirement_codes member repeats an existing requirement_code"
  - error_id: ERR_VENDOR_IDENTITY_MISMATCH
    http_status: 403
    message: "acting vendor does not own this resource"
    trigger: "X-User-Role == Vendor and X-User-ID differs from the resource's owning vendor id"
  - error_id: ERR_STALE_SOLICITATION_VERSION
    http_status: 412
    message: "solicitation version is stale; re-read and retry"
    trigger: "expected_solicitation_version != Solicitation.version on POST /procurement/bids"
  - error_id: ERR_STALE_PROCEEDING_VERSION
    http_status: 412
    message: "proceeding version is stale; re-read and retry"
    trigger: "expected_proceeding_version != DebarmentProceeding.version on reinstatement petition filing"
  - error_id: ERR_INVALID_SOLICITATION_STATE
    http_status: 409
    message: "solicitation state does not permit this operation"
    trigger: "issue/addenda/close-question-period/open-bids/cancel/resolicit/bid/award attempted from a state with no such transition"
  - error_id: ERR_SOLICITATION_NOT_PROTESTABLE
    http_status: 409
    message: "this solicitation cannot be protested in its current state"
    trigger: "POST /procurement/protests against a DRAFT, CANCELLED or RESOLICITED solicitation"
  - error_id: ERR_INVALID_BID_STATE
    http_status: 409
    message: "bid state does not permit this operation"
    trigger: "responsiveness determination on a WITHDRAWN or already-determined bid; responsibility review on a bid that is not RESPONSIVE / NOT_REVIEWED"
  - error_id: ERR_INVALID_PROTEST_STATE
    http_status: 409
    message: "protest state does not permit this operation"
    trigger: "hearing scheduling, decision, withdrawal, stay override or record filing from a state with no such transition"
  - error_id: ERR_INVALID_HEARING_STATE
    http_status: 409
    message: "hearing state does not permit this operation"
    trigger: "convene on a non-SCHEDULED hearing; continue or conclude on a non-CONVENED hearing"
  - error_id: ERR_INVALID_PROCEEDING_STATE
    http_status: 409
    message: "proceeding state does not permit this operation"
    trigger: "response/hearing/decision/petition attempted from a state with no such transition"
  - error_id: ERR_INVALID_PETITION_STATE
    http_status: 409
    message: "petition has already been decided"
    trigger: "POST /procurement/reinstatement-petitions/{id}/decision on a GRANTED or DENIED petition"
  - error_id: ERR_QUESTION_PERIOD_CLOSED
    http_status: 409
    message: "the question period for this solicitation is closed"
    trigger: "POST /procurement/solicitations/{id}/questions once status is QUESTION_PERIOD_CLOSED or later"
  - error_id: ERR_QUESTION_PERIOD_OPEN
    http_status: 409
    message: "the question period has not expired yet"
    trigger: "close-question-period while the logical clock is before question_deadline_utc"
  - error_id: ERR_BID_PERIOD_OPEN
    http_status: 409
    message: "the bid due date has not passed yet"
    trigger: "open-bids while the logical clock is before effective_bid_due_utc"
  - error_id: ERR_BID_DEADLINE_PASSED
    http_status: 409
    message: "the bid due date has passed"
    trigger: "POST /procurement/bids once the logical clock is past effective_bid_due_utc"
  - error_id: ERR_VENDOR_NOT_ELIGIBLE
    http_status: 409
    message: "vendor is suspended or debarred"
    trigger: "bid submission or RESPONSIBLE determination for a vendor whose eligibility_status != ELIGIBLE"
  - error_id: ERR_ALREADY_RESOLICITED
    http_status: 409
    message: "this solicitation already has a successor"
    trigger: "a second POST /procurement/solicitations/{id}/resolicit"
  - error_id: ERR_HEARING_NOT_YET_STARTED
    http_status: 409
    message: "the hearing cannot be convened before its scheduled start"
    trigger: "convene while the logical clock is before scheduled_start_utc"
  - error_id: ERR_HEARING_OFFICER_CONFLICT
    http_status: 403
    message: "the hearing officer may not be the official who issued the solicitation"
    trigger: "hearing_officer_user_id or the deciding X-User-ID equals Solicitation.issued_by_user_id"
  - error_id: ERR_REVIEWER_CONFLICT
    http_status: 403
    message: "the responsibility reviewer may not be the official who determined responsiveness"
    trigger: "X-User-ID equals Bid.responsiveness_decided_by_user_id"
  - error_id: ERR_PROTESTER_LACKS_STANDING
    http_status: 403
    message: "protester is neither an actual nor a qualifying prospective bidder"
    trigger: "no qualifying Bid, and no qualifying QuestionSubmission for a SOLICITATION_IMPROPRIETY ground"
  - error_id: ERR_AGENCY_RECORD_INCOMPLETE
    http_status: 409
    message: "the agency record does not yet contain enough items for this step"
    trigger: "convene with record_item_count < 1; conclude or decide with record_item_count < 2"
  - error_id: ERR_HEARING_NOT_CONCLUDED
    http_status: 409
    message: "no concluded hearing exists on this protest"
    trigger: "POST /procurement/protests/{id}/decision with no hearing in CONCLUDED"
  - error_id: ERR_DEBARMENT_HEARING_RIGHTS_NOT_EXHAUSTED
    http_status: 409
    message: "the respondent's response window has not expired"
    trigger: "debarment hearing from NOTICE_ISSUED while the clock is at or before response_deadline_utc"
  - error_id: ERR_MATERIAL_REQUIREMENT_UNMET
    http_status: 422
    message: "a material addendum requirement is unacknowledged"
    trigger: "RESPONSIVE determination while a MATERIAL addendum-introduced requirement is not acknowledged by the bid"
  - error_id: ERR_INTERIM_SUSPENSION_THRESHOLD_NOT_MET
    http_status: 422
    message: "severity score too low for interim suspension"
    trigger: "interim_suspension true with severity_score (interim_suspension_basis) < 35"
  - error_id: ERR_SEVERITY_BELOW_DEBARMENT_FLOOR
    http_status: 422
    message: "severity score maps to a zero-month period; debarment cannot be entered"
    trigger: "DEBARRED outcome with final severity_score < 20"
  - error_id: ERR_RESPONSIBILITY_SCORE_BELOW_THRESHOLD
    http_status: 422
    message: "composite responsibility score below the responsible threshold"
    trigger: "determination RESPONSIBLE with composite_score < 60.00"
  - error_id: ERR_PROTEST_UNTIMELY
    http_status: 409
    message: "protest filed after the statutory deadline"
    trigger: "logical clock strictly after protest_timeliness_deadline_utc"
  - error_id: ERR_PROTEST_TRIGGER_EVENT_MISSING
    http_status: 422
    message: "the event this ground protests has not occurred"
    trigger: "RESPONSIVENESS_DETERMINATION / RESPONSIBILITY_DETERMINATION / AWARD_IMPROPRIETY ground with no corresponding determination or award"
  - error_id: ERR_PETITION_PREMATURE
    http_status: 409
    message: "the required portion of the debarment period has not been served"
    trigger: "petition filed before reinstatement_earliest_petition_utc"
  - error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    message: "the response window has closed"
    trigger: "POST /procurement/debarment-proceedings/{id}/response after response_deadline_utc"
  - error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    message: "the room is occupied within the changeover buffer"
    trigger: "the candidate interval, padded by 30 minutes, overlaps another SCHEDULED or CONVENED hearing in the same room_code"
  - error_id: ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED
    http_status: 409
    message: "hearing officer daily docket capacity exceeded"
    trigger: "booked_minutes + candidate_minutes > 480 for that officer on that UTC calendar day"
  - error_id: ERR_ACTIVE_PROCEEDING_EXISTS
    http_status: 409
    message: "the vendor already has an occupying debarment proceeding at this instant"
    trigger: "the notice instant falls inside another proceeding's closed occupancy interval for the same vendor"
  - error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 422
    message: "cumulative bid-due extension cap exceeded"
    trigger: "cumulative_extension_days + extends_bid_due_by_days > 21"
  - error_id: ERR_CONTINUANCE_LIMIT_EXCEEDED
    http_status: 409
    message: "no further continuance may be granted"
    trigger: "POST /procurement/hearings/{id}/continue with continuance_count already 2"
  - error_id: ERR_NO_MANDATORY_REQUIREMENTS
    http_status: 422
    message: "the solicitation identifies no mandatory requirement"
    trigger: "issue with zero MandatoryRequirement rows"
  - error_id: ERR_NO_BIDS_RECEIVED
    http_status: 409
    message: "no bids were received"
    trigger: "open-bids with an empty non-withdrawn bid set"
  - error_id: ERR_NO_APPARENT_LOW_BIDDER
    http_status: 409
    message: "no apparent low bidder is identified"
    trigger: "award creation while apparent_low_bid_id is null, or an AWARD_PENDING solicitation whose candidate set empties"
  - error_id: ERR_AWARD_STAYED
    http_status: 409
    message: "an active protest stay blocks award activity"
    trigger: "award creation or execution while some Protest on the solicitation has stay_status == ACTIVE"
  - error_id: ERR_SUBCONTRACT_TIER_UNSUPPORTED
    http_status: 422
    message: "subcontract tier outside the supported range 1..3"
    trigger: "tier < 1 or tier > 3"
  - error_id: ERR_SELF_SUBCONTRACT
    http_status: 422
    message: "a vendor may not subcontract to itself"
    trigger: "prime_vendor_id == sub_vendor_id"
  - error_id: ERR_BID_NOT_ON_SOLICITATION
    http_status: 422
    message: "the referenced bid belongs to a different solicitation"
    trigger: "challenged_bid_id or winning_bid_id points at a bid on another solicitation"
  - error_id: ERR_QUESTION_NOT_ON_SOLICITATION
    http_status: 422
    message: "the referenced question belongs to a different solicitation"
    trigger: "an answers_question_ids member points at a question on another solicitation"
  - error_id: ERR_NOT_APPARENT_LOW_BIDDER
    http_status: 409
    message: "this bid is not the apparent low bidder"
    trigger: "responsibility review or award against a bid whose id != solicitation.apparent_low_bid_id"
  - error_id: ERR_VENDOR_ALREADY_DEBARRED
    http_status: 409
    message: "the vendor is already debarred"
    trigger: "POST /procurement/debarment-proceedings for a vendor with eligibility_status == DEBARRED"
  - error_id: ERR_PETITION_ALREADY_PENDING
    http_status: 409
    message: "a reinstatement petition is already pending on this proceeding"
    trigger: "a second petition while one is in FILED"
  - error_id: ERR_INSUFFICIENT_FEE_BALANCE
    http_status: 402
    message: "insufficient protest filing fee balance"
    trigger: "protest_fee_balance_cents < computed filing_fee_cents"

roles:
  - role: ProcurementOfficer
    id_semantics: opaque
    description: "state procurement office buyer: drafts, issues, amends, opens, evaluates responsiveness, awards, cancels and resolicits; files the agency report; may override a stay"
    exclusive_operations:
      - "POST /procurement/solicitations"
      - "POST /procurement/solicitations/{id}/issue"
      - "POST /procurement/solicitations/{id}/addenda"
      - "POST /procurement/solicitations/{id}/close-question-period"
      - "POST /procurement/solicitations/{id}/open-bids"
      - "POST /procurement/solicitations/{id}/cancel"
      - "POST /procurement/solicitations/{id}/resolicit"
      - "POST /procurement/bids/{id}/responsiveness"
      - "POST /procurement/awards"
      - "POST /procurement/awards/{id}/execute"
      - "POST /procurement/protests/{id}/stay-override"
    shared_operations:
      - "POST /procurement/protests/{id}/record-items"
      - "POST /procurement/subcontractor-screenings"
      - "all GET endpoints"
  - role: ResponsibilityReviewer
    id_semantics: opaque
    description: "responsibility review unit: scores the apparent low bidder's capacity, performance and integrity. Segregated from the officer who made the responsiveness determination on the same bid."
    exclusive_operations:
      - "POST /procurement/bids/{id}/responsibility-reviews"
    shared_operations:
      - "all GET endpoints"
  - role: HearingOfficer
    id_semantics: opaque
    description: "protest hearing officer: schedules, convenes, continues and concludes hearings and issues the protest decision. Segregated from the official who issued the protested solicitation."
    exclusive_operations:
      - "POST /procurement/protests/{id}/hearings"
      - "POST /procurement/hearings/{id}/convene"
      - "POST /procurement/hearings/{id}/continue"
      - "POST /procurement/hearings/{id}/conclude"
      - "POST /procurement/protests/{id}/decision"
    shared_operations:
      - "POST /procurement/protests/{id}/record-items"
      - "all GET endpoints"
  - role: DebarmentAuthority
    id_semantics: opaque
    description: "suspension and debarment official: issues notices, holds hearings, decides debarments and rules on reinstatement petitions"
    exclusive_operations:
      - "POST /procurement/debarment-proceedings"
      - "POST /procurement/debarment-proceedings/{id}/hearing"
      - "POST /procurement/debarment-proceedings/{id}/decision"
      - "POST /procurement/reinstatement-petitions/{id}/decision"
    shared_operations:
      - "all GET endpoints"
  - role: Vendor
    id_semantics: "entity_backed:Vendor"
    description: "bidder or respondent: X-User-ID is the Vendor.id. Submits questions and bids, files and withdraws protests, responds to debarment notices and petitions for reinstatement, and may only act on its own resources."
    exclusive_operations:
      - "POST /procurement/solicitations/{id}/questions"
      - "POST /procurement/bids"
      - "POST /procurement/protests"
      - "POST /procurement/protests/{id}/withdraw"
      - "POST /procurement/debarment-proceedings/{id}/response"
      - "POST /procurement/debarment-proceedings/{id}/reinstatement-petitions"
    shared_operations:
      - "POST /procurement/vendors/{id}/fee-deposits"
      - "POST /procurement/protests/{id}/record-items"
      - "POST /procurement/subcontractor-screenings"
      - "all GET endpoints"
  - role: SystemAdmin
    id_semantics: opaque
    description: "registry and test-harness administrator: maintains the vendor file, credits fee balances and drives the logical clock. Holds no adjudicative authority."
    exclusive_operations:
      - "POST /procurement/vendors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /procurement/vendors/{id}/fee-deposits"
      - "all GET endpoints"
