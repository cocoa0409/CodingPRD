          - endpoints[GET /rate-programs/{id}]
          - endpoints[GET /rate-programs]
        distinguishing_aspect: "The rate-program catalogue is create-read-list only (there is no update or delete endpoint anywhere in §1.5), so a created program must be byte-identical on read-back and must appear once in the filtered list, with version pinned at 1."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; MccDefinition 5411 present."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
          trigger:
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "GET /rate-programs/${rp_id}"
              payload: {}
              as: AcquirerOps
              as_user_id: "any-acquirer"
              captures: { read_code: $.data.program_code, read_bps: $.data.base_rate_bps, read_fee: $.data.per_item_fee_cents, read_delay: $.data.max_clearing_delay_hours }
            - call: "GET /rate-programs"
              payload: { category: "SMALL_TICKET", limit: 10, offset: 0 }
              as: NetworkAdmin
              captures: { list_first: "$.data[0].id" }
          assert:
            - "the create call returns HTTP status 201"
            - "${rp_v} == 1"
            - "${read_code} == SMALL_TICKET_STD"
            - "${read_bps} == 165"
            - "${read_fee} == 4"
            - "${read_delay} == 48"
            - "${list_first} == ${rp_id}"
            - "the list response reports total_count 1 and has_more false"
            - "no PATCH, PUT or DELETE endpoint exists for /rate-programs in the §1.5 table"

      - name: endpoint_action_implementation_window_start_then_complete_reaches_completed
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /implementation-windows/{id}/start]
          - endpoints[POST /implementation-windows/{id}/complete]
          - state_machines.AcquirerImplementationWindow
        distinguishing_aspect: "The two action endpoints walk SCHEDULED to IN_PROGRESS to the terminal COMPLETED, stamping started_at from the logical clock and leaving the acquirer COMPLIANT with missed_window_count 0 — distinct from the MISSED branch, which reaches COMPLETED_LATE."
        test_recipe:
          setup:
