        claim_type: rbac_denial
        grounds: [roles."ClaimsReviewer", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Approve is ClaimsReviewer-exclusive; the claim-owning Member is denied despite ownership."
        test_recipe:
          setup: ["standard fixture; claim UNDER_REVIEW"]
