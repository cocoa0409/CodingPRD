      - name: finalize_intake_incomplete_missing_pattern
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_INTAKE_INCOMPLETE]
        distinguishing_aspect: "Although tcm_pattern is required at create, an intake whose diagnostic fields are not all present cannot be finalized: ERR_INTAKE_INCOMPLETE (409). (Tested by attempting finalize on an intake where the implementation must verify all three diagnostic fields non-null.)"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_requires_patient_intake_complete
          rationale: "The intake-gate path (PENDING_INTAKE blocks booking) is exercised by the named §1.8 instance; ERR_INTAKE_INCOMPLETE is its sibling guard and is asserted there as part of the finalize precondition chain."

      - name: existence_precedes_state_on_checkin
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
        distinguishing_aspect: "Check-in on a non-existent appointment id returns ERR_APPT_NOT_FOUND (existence, priority 4) rather than any state error — existence is evaluated before state preconditions."
        test_recipe:
          setup: ["Empty DB; the check-in target appointment id is a bogus UUID."]
          setup_api_calls: []
          trigger:
            - call: "POST /appointments/00000000-0000-4000-8000-0000000000cc/check-in"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_APPT_NOT_FOUND"

      - name: priority_state_over_fiscal_stub
        claim_type: Priority conflict
        grounds:
          - validations[priority=7]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_package_booking
          rationale: "The state(7)-vs-fiscal(14) priority conflict is the named §1.8 instance."

