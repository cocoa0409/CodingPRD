  - section: validations
    instances:
      - name: duplicate_agency_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - entities.MemberAgency.fields.agency_code
          - errors.ERR_DUPLICATE_TALKGROUP_ID
        distinguishing_aspect: "agency_code uniqueness is enforced by the same rule that guards tg_decimal_id, so a second agency with agency_code DUP01 returns HTTP 409 ERR_DUPLICATE_TALKGROUP_ID even though the names differ."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one agency already holds agency_code DUP01."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Duplicate Code First", agency_code: "DUP01", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_dup_first: "$.data.id" }
          trigger:
            - call: "POST /radio-system/agencies"
              payload: { name: "Duplicate Code Second", agency_code: "DUP01", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { dup_agency_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_DUPLICATE_TALKGROUP_ID"
            - "GET /radio-system/agencies returns total_count == 1 and the single row's id == ${agency_dup_first}"

      - name: duplicate_radio_id_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - entities.SubscriberUnit.fields.radio_id
          - errors.ERR_DUPLICATE_RADIO_ID
        distinguishing_aspect: "radio_id is unique across the whole SubscriberUnit table, not per agency: reusing radio_id 30001 under a second agency still returns HTTP 409 ERR_DUPLICATE_RADIO_ID."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; two agencies exist and the first already owns a unit with radio_id 30001."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Radio Id First Agency", agency_code: "RID01", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_rid1_id: "$.data.id" }
            - call: "POST /radio-system/agencies"
              payload: { name: "Radio Id Second Agency", agency_code: "RID02", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_rid2_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_rid1_id}", serial_number: "RID0001", radio_id: 30001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_rid1_id}"
              captures: { unit_rid1: "$.data.id" }
          trigger:
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_rid2_id}", serial_number: "RID0002", radio_id: 30001, model: "MOBILE" }
              as: AgencyRadioManager
              as_user_id: "${agency_rid2_id}"
              captures: { dup_radio_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_DUPLICATE_RADIO_ID"
            - "GET /radio-system/units?agency_id=${agency_rid2_id} returns total_count == 0"
            - "A repeat with radio_id 30002 returns HTTP 201 (only the collision was refused)"

      - name: console_config_retention_below_statutory_minimum_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=21]
          - endpoints[PATCH /radio-system/agencies/{agency_id}/console-config]
          - errors.ERR_RECORDER_RETENTION_BELOW_MINIMUM
        distinguishing_aspect: "The statutory floor is conditional on agency_type: 120 days is refused with HTTP 422 ERR_RECORDER_RETENTION_BELOW_MINIMUM for a LAW agency (minimum 180) while the identical value is accepted for a FIRE agency (minimum 90)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one LAW agency and one FIRE agency exist, both with recorder_retention_days 180."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Statutory Law Agency", agency_code: "STA01", agency_type: "LAW", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_sta_law: "$.data.id" }
            - call: "POST /radio-system/agencies"
              payload: { name: "Statutory Fire Agency", agency_code: "STA02", agency_type: "FIRE", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_sta_fire: "$.data.id" }
          trigger:
            - call: "PATCH /radio-system/agencies/${agency_sta_law}/console-config"
              payload: { recorder_retention_days: 120 }
              as: AgencyRadioManager
              as_user_id: "${agency_sta_law}"
              captures: { retention_error_id: "$.data.error_id" }
            - call: "PATCH /radio-system/agencies/${agency_sta_fire}/console-config"
              payload: { recorder_retention_days: 120 }
              as: AgencyRadioManager
              as_user_id: "${agency_sta_fire}"
          assert:
            - "trigger[0] returns HTTP 422 with data.error_id == ERR_RECORDER_RETENTION_BELOW_MINIMUM"
            - "MemberAgency.${agency_sta_law}.recorder_retention_days == 180 (unchanged by the rejected PATCH)"
            - "trigger[1] returns HTTP 200 and MemberAgency.${agency_sta_fire}.recorder_retention_days == 120"

      - name: console_config_retention_at_statutory_minimum_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=21]
          - endpoints[PATCH /radio-system/agencies/{agency_id}/console-config]
          - entities.MemberAgency.fields.console_position_count
        distinguishing_aspect: "The floor comparison is >=, so a LAW agency setting recorder_retention_days to exactly 180 succeeds with HTTP 200, and console_position_count updates in the same call while version increments by 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one LAW agency created with recorder_retention_days 365 and the default console_position_count 1."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Exact Minimum Agency", agency_code: "EXM01", agency_type: "LAW", recorder_retention_days: 365 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_exm_id: "$.data.id", agency_exm_v1: "$.data.version" }
          trigger:
            - call: "PATCH /radio-system/agencies/${agency_exm_id}/console-config"
              payload: { console_position_count: 6, recorder_retention_days: 180 }
              as: AgencyRadioManager
              as_user_id: "${agency_exm_id}"
          assert:
            - "trigger[0] returns HTTP 200"
            - "MemberAgency.${agency_exm_id}.recorder_retention_days == 180 and console_position_count == 6"
            - "MemberAgency.${agency_exm_id}.version == ${agency_exm_v1} + 1"
            - "MemberAgency.${agency_exm_id}.billing_status == CURRENT (console config touches no fiscal field)"

      - name: template_slot_capacity_exceeded_on_assign
        claim_type: aggregate_validation
        grounds:
          - validations[priority=36]
          - state_machines.SubscriberUnit.INVENTORY_to_ASSIGNED
          - errors.ERR_TEMPLATE_SLOT_CAPACITY_EXCEEDED
        distinguishing_aspect: "Each talkgroup creation is individually valid, but the collective count of the agency's ACTIVE talkgroups (3) exceeds the template's talkgroup_slot_count (2), so ASSIGN returns HTTP 422 ERR_TEMPLATE_SLOT_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Agency SLT owns three ACTIVE talkgroups on Site SLT-1; PUBLISHED template SLT-BASE-1 has talkgroup_slot_count 2; one INVENTORY unit is waiting."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Slot Capacity Agency", agency_code: "SLT01", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_slt_id: "$.data.id" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "SLT-1", name: "Slot One", channel_capacity: 6, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_slt_id: "$.data.id" }
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_slt_id}", home_site_id: "${site_slt_id}", alias: "SLT-A", tg_decimal_id: 1401, kind: "DISPATCH", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_slt_id}"
              captures: { tg_slt_a: "$.data.id" }
