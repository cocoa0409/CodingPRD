          setup:
            - "Clock 2026-05-01T00:00:00Z. Customers A, B, C all DNA_READY from a single finalized batch on one ONLINE V5 instrument; all three hold ACTIVE RELATIVE_MATCHING grants and are on PLUS."
            - "genotype_markers: A = [1,2], B = [1,2], C = [1,7]. So A~B share {1,2} -> 8.00 cM (one run); A~C and B~C share {1} -> 4.00 cM."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
