scaffold_corner_design:

  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: facility_create_returns_201_with_echoed_fields
        claim_type: creation
        grounds: [entities.Facility, endpoints.POST /nbs/facilities]
        distinguishing_aspect: "POST /nbs/facilities with all required fields returns 201 and a Facility whose name/facility_type/state_region echo the input and total_booked_minutes defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nbs/facilities"
              payload: { name: "State Lab", facility_type: "LAB", state_region: "CA" }
              as: ProgramAdmin
              captures: { fac_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Facility.${fac_id}.facility_type == LAB"
            - "Facility.${fac_id}.total_booked_minutes == 0"
            - "Facility.${fac_id}.version == 1"

      - name: get_infant_nonexistent_returns_404
        claim_type: not_found
        grounds: [entities.Infant, "errors[ERR_INFANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /nbs/infants/{id} for an unknown UUID returns ERR_INFANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /nbs/infants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_INFANT_NOT_FOUND"

      - name: infant_create_missing_required_birth_datetime_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Infant.fields.birth_datetime, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /nbs/infants without birth_datetime returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A facility exists to own the infant."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: infant_create_invalid_sex_enum_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Infant.fields.sex, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /nbs/infants with sex outside {M,F,U} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "X" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: infant_multiple_birth_defaults_false_and_version_one
        claim_type: defaults
        grounds: [entities.Infant.fields.multiple_birth, entities.Infant.fields.consent_status, entities.Infant.fields.version]
        distinguishing_aspect: "Omitting multiple_birth yields false; a fresh infant has consent_status PENDING, followup_status CLEAR, and version 1 (system/default fields)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id" }
          assert:
            - "Infant.${inf_id}.multiple_birth == false"
            - "Infant.${inf_id}.consent_status == PENDING"
            - "Infant.${inf_id}.followup_status == CLEAR"
            - "Infant.${inf_id}.version == 1"

      - name: specimen_collection_age_hours_computed
        claim_type: computed_fields
        grounds: [entities.Specimen.fields.collection_age_hours, entities.Specimen.fields.transit_time_hours]
        distinguishing_aspect: "For a specimen collected 30h after birth and received 18h later, collection_age_hours == 30.0 and transit_time_hours == 18.0 (computed, 2 decimals)."
        test_recipe:
          setup: ["Term infant born 2026-02-27T06:00:00Z; specimen collected 2026-02-28T12:00:00Z, received 2026-03-01T06:00:00Z with 5 spots."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
          assert:
            - "Specimen.${spec_id}.collection_age_hours == 30.0"
            - "Specimen.${spec_id}.transit_time_hours == 18.0"
            - "Specimen.${spec_id}.acceptability == SATISFACTORY"

  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: receive_twice_second_returns_409
        claim_type: invalid_transitions
        grounds: [state_machines.Specimen.COLLECTED_to_RECEIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A specimen already sorted SATISFACTORY cannot be received again; the second receive returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Specimen received once (SATISFACTORY)."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
          trigger:
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T08:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_assay_run_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AssayRun.SCHEDULED_to_CANCELLED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A CANCELLED assay run is terminal; a second cancel returns ERR_ALREADY_TERMINAL (409) and total_booked_minutes is not double-subtracted."
        test_recipe:
          setup: ["A LAB facility with one assay run cancelled once."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "State Lab", facility_type: "LAB", state_region: "CA" }
              as: ProgramAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /nbs/assay-runs"
              payload: { facility_id: "${lab_id}", instrument_code: "MSMS-1", start_datetime: "2026-03-02T09:00:00Z", end_datetime: "2026-03-02T10:00:00Z" }
              as: LabTechnician
              captures: { run_id: "$.data.id" }
            - call: "POST /nbs/assay-runs/${run_id}/cancel"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /nbs/assay-runs/${run_id}/cancel"
              payload: {}
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALREADY_TERMINAL"

      - name: request_repeat_duplicate_within_window_second_returns_409
        claim_type: idempotency
        grounds: [state_machines.FollowUpCase.OPEN_to_REPEAT_REQUESTED, "errors[ERR_DUPLICATE_REPEAT_PENDING]"]
        distinguishing_aspect: "With the case already REPEAT_REQUESTED and still inside the window, a second request-repeat returns ERR_DUPLICATE_REPEAT_PENDING (409) — no double increment of repeat_count."
        test_recipe:
          setup: ["Case opened via PRESUMPTIVE_POSITIVE, then request-repeat once (REPEAT_REQUESTED, count 1); clock unchanged (still within window)."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "PRESUMPTIVE_POSITIVE", critical_analyte_count: 1 }
              as: LabTechnician
            - call: "GET /nbs/follow-up-cases?screen_id=${screen_id}"
              payload: {}
              as: FollowUpCoordinator
              captures: { case_id: "$.data[0].id" }
            - call: "POST /nbs/follow-up-cases/${case_id}/request-repeat"
              payload: {}
              as: FollowUpCoordinator
          trigger:
            - call: "POST /nbs/follow-up-cases/${case_id}/request-repeat"
              payload: {}
              as: FollowUpCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_REPEAT_PENDING"

  # -----------------------------------------------------------------
  - section: calculations
    instances:
      - name: cchd_retest_at_94_lower_saturation
        claim_type: correct_result
        grounds: [calculations.cchd_interpretation, entities.Screen.fields.cchd_status]
        distinguishing_aspect: "SpO2 94/96 gives lower 94 (in the 90..94 band), so cchd_interpretation returns RETEST — complements the PASS-at-95 boundary."
        test_recipe:
          setup: ["Term infant; satisfactory specimen; screen opened."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/screens/${screen_id}/point-of-care"
              payload: { component: "CCHD", spo2_right_hand: 94, spo2_foot: 96 }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
          assert:
            - "Screen.${screen_id}.cchd_status == RETEST"

      - name: followup_priority_initial_preterm_lowbirth_scores_85
        claim_type: correct_result
        grounds: [calculations.followup_priority_score, entities.FollowUpCase.fields.priority_score]
        distinguishing_aspect: "INITIAL priority for critical_flag_count 1 (50), preterm gest 33 (<34, +20) and birth weight 1400 (<1500, +15) equals 85, exercising all three weights/thresholds."
        test_recipe:
          setup: ["Preterm infant gest 33, bw 1400; satisfactory specimen (collected age 30h so not UNSAT_EARLY); screen reported PRESUMPTIVE_POSITIVE critical_analyte_count 1."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 33, birth_weight_grams: 1400, sex: "M" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "PRESUMPTIVE_POSITIVE", critical_analyte_count: 1 }
              as: LabTechnician
          assert:
            - "FollowUpCase[screen_id=${screen_id}].priority_score == 85"
            - "FollowUpCase[screen_id=${screen_id}].priority_variant == INITIAL"

  # -----------------------------------------------------------------
  - section: validations
    instances:
      - name: referral_resolve_completed_without_completed_appointment_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_APPOINTMENT_NOT_COMPLETED]"]
        distinguishing_aspect: "A SCHEDULED referral whose appointment is still SCHEDULED cannot resolve COMPLETED; it returns ERR_APPOINTMENT_NOT_COMPLETED (409)."
        test_recipe:
          setup: ["Case opened; clinic; referral; appointment booked (SCHEDULED) but not completed."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "PRESUMPTIVE_POSITIVE", critical_analyte_count: 1 }
              as: LabTechnician
            - call: "GET /nbs/follow-up-cases?screen_id=${screen_id}"
              payload: {}
              as: FollowUpCoordinator
              captures: { case_id: "$.data[0].id" }
            - call: "POST /nbs/specialty-clinics"
              payload: { name: "Metab Clinic", specialty: "METABOLIC_GENETICS", concurrent_capacity: 2 }
              as: ProgramAdmin
              captures: { clinic_id: "$.data.id" }
            - call: "POST /nbs/referrals"
              payload: { follow_up_case_id: "${case_id}", specialty_clinic_id: "${clinic_id}", referral_reason: "METABOLIC_GENETICS" }
              as: FollowUpCoordinator
              captures: { ref_id: "$.data.id" }
            - call: "POST /nbs/confirmatory-appointments"
              payload: { referral_id: "${ref_id}", start_datetime: "2026-03-05T09:00:00Z", end_datetime: "2026-03-05T10:00:00Z" }
              as: FollowUpCoordinator
              captures: { appt_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/referrals/${ref_id}/resolve"
              payload: { outcome: "COMPLETED" }
              as: FollowUpCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_COMPLETED"

      - name: appointment_end_before_start_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INTERVAL_END_BEFORE_START]"]
        distinguishing_aspect: "Booking a confirmatory appointment with end_datetime <= start_datetime returns ERR_INTERVAL_END_BEFORE_START (422)."
        test_recipe:
          setup: ["Case opened; clinic; referral (REQUESTED)."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "PRESUMPTIVE_POSITIVE", critical_analyte_count: 1 }
              as: LabTechnician
            - call: "GET /nbs/follow-up-cases?screen_id=${screen_id}"
              payload: {}
              as: FollowUpCoordinator
              captures: { case_id: "$.data[0].id" }
            - call: "POST /nbs/specialty-clinics"
              payload: { name: "Metab Clinic", specialty: "METABOLIC_GENETICS", concurrent_capacity: 2 }
              as: ProgramAdmin
              captures: { clinic_id: "$.data.id" }
            - call: "POST /nbs/referrals"
              payload: { follow_up_case_id: "${case_id}", specialty_clinic_id: "${clinic_id}", referral_reason: "METABOLIC_GENETICS" }
              as: FollowUpCoordinator
              captures: { ref_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/confirmatory-appointments"
              payload: { referral_id: "${ref_id}", start_datetime: "2026-03-05T10:00:00Z", end_datetime: "2026-03-05T09:00:00Z" }
              as: FollowUpCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INTERVAL_END_BEFORE_START"

  # -----------------------------------------------------------------
  - section: rbac
    instances:
      - name: labtech_cannot_report_point_of_care_returns_unauthorized
        claim_type: peer_roles
        grounds: [roles.LabTechnician, roles.BirthFacilityUser, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "point-of-care is exclusive to BirthFacilityUser; a LabTechnician call returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Term infant; satisfactory specimen; screen opened."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/screens/${screen_id}/point-of-care"
              payload: { component: "HEARING", hearing_result: "PASS" }
              as: LabTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: other_facility_cannot_collect_specimen_returns_not_owner
        claim_type: ownership
        grounds: [roles.BirthFacilityUser, "validations[priority=3]", "errors[ERR_NOT_OWNER]"]
        distinguishing_aspect: "BirthFacilityUser acting as a DIFFERENT facility (X-User-ID != infant.facility_id) cannot collect a specimen; returns ERR_NOT_OWNER (403)."
        test_recipe:
          setup: ["Two hospitals; infant registered at Hosp A. Collector acts as Hosp B."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp A", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hospA: "$.data.id" }
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp B", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hospB: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hospA}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hospA}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
          trigger:
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hospB}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_OWNER"

  # -----------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: specimen_create_stale_infant_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[specimen-create-stale-infant]", "errors[ERR_STALE_INFANT_VERSION]"]
        distinguishing_aspect: "After a first specimen create advances Infant.version to 2, a second create still carrying the original expected_infant_version (1) is rejected with ERR_STALE_INFANT_VERSION (412)."
        test_recipe:
          setup: ["Infant read at version 1; one specimen created (version advances to 2)."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "REPEAT", collection_datetime: "2026-02-28T18:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_INFANT_VERSION"

      - name: list_specimens_pagination_envelope
        claim_type: pagination_with_filtering
        grounds: [endpoints.GET /nbs/specimens, response_envelope.pagination_fields]
        distinguishing_aspect: "With two specimens for an infant, GET /nbs/specimens?infant_id&limit=1 returns 1 item, total_count 2, has_more true."
        test_recipe:
          setup: ["One infant with two specimens (second create uses the refreshed infant version)."]
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec1_id: "$.data.id" }
            - call: "GET /nbs/infants/${inf_id}"
              payload: {}
              as: LabTechnician
              captures: { inf_v2: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "REPEAT", collection_datetime: "2026-02-28T18:00:00Z", expected_infant_version: "${inf_v2}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec2_id: "$.data.id" }
          trigger:
            - call: "GET /nbs/specimens?infant_id=${inf_id}&limit=1&offset=0"
              payload: {}
              as: LabTechnician
          assert:
            - "response.total_count == 2"
            - "response.has_more == true"
            - "response.data length == 1"

