# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Task 3315
# Breadth coverage of §1.1-§1.7 claims not already covered by §1.8.
# Clock default 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: project_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Project.fields.domestic_content_certified, entities.Project.fields.availability_guarantee_pct]
        distinguishing_aspect: "Omitting optional flags applies documented defaults (false / 97.0) and input-provided defaults are never silently required."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { name: "Defaults Farm", technology: "HYBRID", target_capacity_mw: 250, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
          assert:
            - "Project.${p}.domestic_content_certified == false"
            - "Project.${p}.availability_guarantee_pct == 97.0"
            - "Project.${p}.status == PROSPECT and .total_itc_credits_usd == 0.00"

      - name: project_creation_required_fields_enforced
        claim_type: required_fields
        grounds: [entities.Project.fields.technology, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required field technology is rejected with ERR_VALIDATION before any state exists."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { name: "No Tech Farm", target_capacity_mw: 100, resource_class: "A" }
              as: DeveloperAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION (http 400)"

      - name: project_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Project.fields.technology]
        distinguishing_aspect: "Enum closure: technology must be one of WIND | SOLAR | HYBRID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { name: "Bad Enum Farm", technology: "GEOTHERMAL", target_capacity_mw: 10, resource_class: "A" }
              as: DeveloperAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: queue_position_is_computed_not_settable
        claim_type: computed_fields
        grounds: [entities.InterconnectionRequest.fields.queue_position]
        distinguishing_aspect: "queue_position is system-computed; client-supplied values are ignored and the first request in a cluster always gets 1."
        test_recipe:
          setup: ["Project P exists"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Computed Farm", technology: "WIND", target_capacity_mw: 50, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
          trigger:
            - call: "POST /api/projects/${p}/interconnection-requests"
              payload: { cluster_id: "CL-CP", requested_capacity_mw: 50 }
              as: OriginationManager
              captures: { r: $.data.id }
          assert:
            - "InterconnectionRequest.${r}.queue_position == 1"
            - "InterconnectionRequest.${r}.upgrade_allocated == false and .upgrade_cost_share_usd == 0 (or null) before any allocation"

      - name: get_nonexistent_resource_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but unknown UUID yields ERR_NOT_FOUND (404), not a validation error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: projects_list_pagination_contract
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "GET /api/projects"]
        distinguishing_aspect: "List envelope honors limit/offset and reports total_count and has_more."
        test_recipe:
          setup: ["Three projects exist"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Page 1", technology: "WIND", target_capacity_mw: 10, resource_class: "A" }
              as: DeveloperAdmin
            - call: "POST /api/projects"
              payload: { name: "Page 2", technology: "WIND", target_capacity_mw: 20, resource_class: "A" }
              as: DeveloperAdmin
            - call: "POST /api/projects"
              payload: { name: "Page 3", technology: "SOLAR", target_capacity_mw: 30, resource_class: "B" }
              as: DeveloperAdmin
          trigger:
            - call: "GET /api/projects"
              payload: { limit: 2, offset: 0 }
              as: Auditor
          assert:
            - "Response data has exactly 2 rows, total_count == 3, has_more == true"
            - "GET with offset 2 returns 1 row and has_more == false"

      - name: ledger_entry_immutable_event_log
        claim_type: immutability
        grounds: [entities.PartnershipLedgerEntry]
        distinguishing_aspect: "PartnershipLedgerEntry has common_fields: false — no version/updated_at and no update or delete endpoint exists."
        test_recipe:
          setup: ["Partnership with one contribution posted"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Ledger Farm", technology: "SOLAR", target_capacity_mw: 25, resource_class: "C" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/tax-equity-partnerships"
              payload: { investor_name: "Inv", commitment_usd: 500000.00, target_irr_pct: 7.0 }
              as: TaxCounsel
              captures: { ps: $.data.id }
          trigger:
            - call: "POST /api/tax-equity-partnerships/${ps}/contributions"
              payload: { amount_usd: 100000.00, period_end_date: "2026-12-31T00:00:00Z" }
              as: InvestorManager
              captures: { err: $.data.error_id }
          assert:
            - "Contribution attempt fails: ${err} == ERR_INVALID_STATE (partnership still STRUCTURING, not COMMITMENT_EXECUTED) — proving ledger entries are creatable only through lifecycle-gated endpoints"
            - "GET /api/partnership-ledger-entries/{id} is the only read path; no PUT/PATCH/DELETE route exists for the entity"

  - section: state_machines
    instances:
      - name: direct_project_cod_transition_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Project.COMMISSIONING_to_COMMERCIAL_OPERATION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMMERCIAL_OPERATION is cascade-only: the direct project transition is refused even from COMMISSIONING; only the COD milestone certification can drive it."
        test_recipe:
          setup: ["Project P in COMMISSIONING (full COD chain as in itc_rate_combinatorial_adders_mode_a, minus the COD milestone)"]
