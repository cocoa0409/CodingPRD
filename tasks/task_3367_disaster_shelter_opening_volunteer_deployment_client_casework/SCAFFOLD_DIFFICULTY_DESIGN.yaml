scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: shelter_cost_provisional_vs_final
        grounds:
          - calculations.shelter_operational_cost
          - entities.ShelterOperation.fields.operational_cost_cents
        distinguishing_aspect: |
          The dual-variant pair runs on ShelterOperation (feeding + travel + assistance cost
          roll-up), a different entity domain from the ClientCase entitlement variant and the
          Region blood-continuity variant; for identical child rows the PROVISIONAL variant
          returns 115831 cents and the FINAL variant returns 11212 cents.
        test_recipe:
          setup:
            - "region GL, operation DR-9101 in MOBILIZATION, shelter site with 8 verified beds APPROVED"
            - "one volunteer credentialed ACTIVE, deployed AIR for 14 days, arrived at the shelter"
            - "shelter opened (posture OPEN, staffing_sufficiency 1.0)"
            - "two feeding-service events on the shelter: meals_planned 60, meals_served 41, unit_cost_cents 100 each"
            - "one client registered at the shelter; one ClientCase with eligibility VERIFIED; one assistance request for 50000 cents against an UNRESTRICTED pool with 500000 cents, approved"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY", "FEMA", "LOCAL_HOUSING"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER", "REGISTRATION", "FEEDING", "HEALTH_SERVICES"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations/${so_id}/feeding-services"
              payload: { meal_type: "DINNER", served_at: "2026-09-03T18:00:00Z", meals_planned: 60, meals_served: 41, unit_cost_cents: 100 }
              as: ShelterManager
            - call: "POST /api/v1/shelter-operations/${so_id}/feeding-services"
              payload: { meal_type: "BREAKFAST", served_at: "2026-09-04T07:00:00Z", meals_planned: 60, meals_served: 41, unit_cost_cents: 100 }
              as: ShelterManager
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 5, region_id: "${reg_gl}" }
              as: ShelterManager
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "${cl_id}", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
            - call: "POST /api/v1/fund-pools"
              payload: { fund_code: "DR-9101-GEN", restriction_type: "UNRESTRICTED", region_id: "${reg_gl}", total_received_cents: 500000 }
              as: FinanceOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /api/v1/client-cases"
              payload: { client_id: "${cl_id}", disaster_relief_operation_id: "${op_id}", assigned_caseworker_id: "cw_1" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/client-cases/${case_id}/verify-eligibility"
              payload: { eligibility_status: "VERIFIED" }
              as: Caseworker
            - call: "POST /api/v1/client-cases/${case_id}/assistance-requests"
              payload: { fund_pool_id: "${pool_id}", assistance_type: "HOUSING", requested_amount_cents: 50000 }
              as: Caseworker
              captures: { ar_id: $.data.id }
            - call: "POST /api/v1/assistance-requests/${ar_id}/approve"
              payload: {}
              as: FinanceOfficer
            - call: "POST /api/v1/assistance-requests/${ar_id}/approve"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "GET /api/v1/shelter-operations/${so_id}"
              payload: { reporting_mode: "PROVISIONAL" }
              as: RegionalCoordinator
              captures: { prov_cost: $.data.operational_cost_cents }
            - call: "GET /api/v1/shelter-operations/${so_id}"
              payload: { reporting_mode: "FINAL" }
              as: RegionalCoordinator
              captures: { final_cost: $.data.operational_cost_cents }
          assert:
            - "ShelterOperation.${so_id}.operational_cost_cents == 115831 when reporting_mode=PROVISIONAL"
            - "ShelterOperation.${so_id}.operational_cost_cents == 11212 when reporting_mode=FINAL"
            - "the two variants differ by 104619 cents on identical child rows"

      - name: case_entitlement_base_vs_expedited
        grounds:
          - calculations.client_assistance_entitlement
          - entities.ClientCase.fields.entitlement_cents
        distinguishing_aspect: |
          The dual-variant pair runs on ClientCase, a different entity domain from the
          ShelterOperation cost variant; two households of size 5 produce 120000 cents under
          base_schedule and 80000 cents under expedited_schedule from identical household data,
          the only difference being the functional_needs_flag on the shelter registration.
        test_recipe:
          setup:
            - "region GL, operation DR-9101, APPROVED shelter site with functional_needs_support true, shelter opened"
            - "client A (household_size 5) registered with functional_needs_flag true; client B (household_size 5) registered with functional_needs_flag false"
            - "one ClientCase per client, both in INTAKE"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY", "FEMA", "LOCAL_HOUSING"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER", "REGISTRATION"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 5, region_id: "${reg_gl}" }
              as: ShelterManager
              captures: { cl_a: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ben Okafor", household_size: 5, region_id: "${reg_gl}" }
              as: ShelterManager
              captures: { cl_b: $.data.id }
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "${cl_a}", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: true }
              as: ShelterManager
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "${cl_b}", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
            - call: "POST /api/v1/client-cases"
              payload: { client_id: "${cl_a}", disaster_relief_operation_id: "${op_id}", assigned_caseworker_id: "cw_1" }
              as: Caseworker
              captures: { case_a: $.data.id }
            - call: "POST /api/v1/client-cases"
              payload: { client_id: "${cl_b}", disaster_relief_operation_id: "${op_id}", assigned_caseworker_id: "cw_1" }
              as: Caseworker
              captures: { case_b: $.data.id }
          trigger:
            - call: "GET /api/v1/client-cases/${case_a}"
              payload: {}
              as: Caseworker
              captures: { ent_a: $.data.entitlement_cents }
            - call: "GET /api/v1/client-cases/${case_b}"
              payload: {}
              as: Caseworker
              captures: { ent_b: $.data.entitlement_cents }
          assert:
            - "ClientCase.${case_a}.entitlement_cents == 80000 (expedited_schedule: functional_needs_flag true)"
            - "ClientCase.${case_b}.entitlement_cents == 120000 (base_schedule: min(120000, 5 * 30000))"
            - "the two variants differ by 40000 cents on identical household_size 5 data"

      - name: region_blood_continuity_trailing_vs_forward
        grounds:
          - calculations.blood_continuity_index
          - entities.Region.fields.blood_continuity_index
          - entities.Region.fields.blood_continuity_status
        distinguishing_aspect: |
          The dual-variant pair runs on Region, a third entity domain distinct from
          ShelterOperation and ClientCase; for identical BloodDrive rows the TRAILING variant
          returns index 0.1163 and the FORWARD_LOOKING variant returns 0.3663.
        test_recipe:
          setup:
            - "region GL with no operations"
            - "blood drive D1 at VFW Hall, window 2026-08-01T08:00Z to 2026-08-02T08:00Z, target_units 100, 100 units collected, COMPLETED"
            - "blood drive D2 at Elks Lodge, window 2026-09-10T08:00Z to 2026-09-11T08:00Z, target_units 200, still PLANNED"
            - "logical clock at 2026-08-05T00:00:00Z so D1 sits inside the 42-day trailing window"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY", "FEMA", "LOCAL_HOUSING"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "VFW Hall", scheduled_start_at: "2026-08-01T08:00:00Z", scheduled_end_at: "2026-08-02T08:00:00Z", target_units: 100 }
              as: BloodServicesCoordinator
              captures: { d1: $.data.id }
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "Elks Lodge", scheduled_start_at: "2026-09-10T08:00:00Z", scheduled_end_at: "2026-09-11T08:00:00Z", target_units: 200 }
              as: BloodServicesCoordinator
              captures: { d2: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/blood-drives/${d1}/collections"
              payload: { units: 100 }
              as: BloodServicesCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: NationalHQAdmin
          trigger:
            - call: "GET /api/v1/regions/${reg_gl}"
              payload: { continuity_mode: "TRAILING" }
              as: BloodServicesCoordinator
              captures: { idx_trailing: $.data.blood_continuity_index, status_trailing: $.data.blood_continuity_status }
            - call: "GET /api/v1/regions/${reg_gl}"
              payload: { continuity_mode: "FORWARD_LOOKING" }
              as: BloodServicesCoordinator
              captures: { idx_forward: $.data.blood_continuity_index }
          assert:
            - "Region.${reg_gl}.blood_continuity_index == 0.1163 when continuity_mode=TRAILING (93 usable units / 800 target units)"
            - "Region.${reg_gl}.blood_continuity_index == 0.3663 when continuity_mode=FORWARD_LOOKING (293 / 800)"
            - "Region.${reg_gl}.blood_continuity_status == CRITICAL in both variants"

  - rule_id: combinatorial_formula
    instances:
      - name: deployment_candidate_weighted_ranking
        grounds:
          - calculations.volunteer_deployment_priority_score
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): the score folds four inputs (credential recency, region distance, year-to-date
          rotation days, role qualification) through nested max/min and a conditional branch, so
          the candidate order is 150 then 142 then 130 rather than any single-input ordering.
        test_recipe:
          setup:
            - "region GL and region NW both exist; operation DR-9101 belongs to GL"
            - "volunteer A: home_region GL, credentialed ACTIVE today, qualified for REGISTRATION, 0 rotation days used"
            - "volunteer B: home_region NW, credentialed ACTIVE today, qualified for REGISTRATION, 0 rotation days used"
            - "volunteer C: home_region GL, credentialed ACTIVE today, NOT qualified for REGISTRATION, 0 rotation days used"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/regions"
              payload: { code: "NW", name: "Northwest", state_codes: ["WA", "OR"], coordinator_user_id: "rc_nw", volunteer_pool_target: 25, authorized_agency_codes: ["FEMA"] }
              as: NationalHQAdmin
              captures: { reg_nw: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["REGISTRATION", "SHELTER_MANAGER"] }
              as: RegionalCoordinator
              captures: { vol_a: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_a}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Eli Nakamura", home_region_id: "${reg_nw}", qualified_role_codes: ["REGISTRATION"] }
              as: RegionalCoordinator
              captures: { vol_b: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_b}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Priya Shah", home_region_id: "${reg_gl}", qualified_role_codes: ["FEEDING"] }
              as: RegionalCoordinator
              captures: { vol_c: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_c}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
          trigger:
            - call: "GET /api/v1/disaster-relief-operations/${op_id}/deployment-candidates"
              payload: { role_code: "REGISTRATION" }
              as: RegionalCoordinator
              captures: { rank0: "$.data[0].id", rank0_name: "$.data[0].full_name", rank1: "$.data[1].id", rank2: "$.data[2].id" }
          assert:
            - "candidate rank 0 is Volunteer.${vol_a} (score 150 = 100 + 30 recency - 0 distance - 0 rotation + 20 role match)"
            - "candidate rank 1 is Volunteer.${vol_b} (score 142 = 100 + 30 - 8 cross-region - 0 + 20)"
            - "candidate rank 2 is Volunteer.${vol_c} (score 130 = 100 + 30 - 0 - 0 + 0 no role match)"
            - "the candidate list is exactly 3 entries long: rank 0 is the GL role-qualified volunteer ${rank0} (${rank0_name})"

      - name: feeding_cost_per_line_rounding_order
        grounds:
          - calculations.feeding_line_cost
          - entities.ShelterOperation.fields.feeding_cost_cents
          - entities.ShelterOperation.fields.meals_served_total
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — rounding each event line before summing
          yields 8712 cents, while summing the raw line costs and rounding once would yield 8713
          cents for the identical pair of feeding events.
        test_recipe:
          setup:
            - "region GL, operation DR-9101, APPROVED shelter site, shelter opened with one arrived volunteer"
            - "no feeding events recorded yet (feeding_cost_cents 0, meals_served_total 0)"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER", "FEEDING"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
          trigger:
            - call: "POST /api/v1/shelter-operations/${so_id}/feeding-services"
              payload: { meal_type: "DINNER", served_at: "2026-09-03T18:00:00Z", meals_planned: 60, meals_served: 41, unit_cost_cents: 100 }
              as: ShelterManager
              captures: { after_first: $.data.feeding_cost_cents }
            - call: "POST /api/v1/shelter-operations/${so_id}/feeding-services"
              payload: { meal_type: "BREAKFAST", served_at: "2026-09-04T07:00:00Z", meals_planned: 60, meals_served: 41, unit_cost_cents: 100 }
              as: ShelterManager
              captures: { after_second: $.data.feeding_cost_cents, meals_total: $.data.meals_served_total }
          assert:
            - "ShelterOperation.feeding_cost_cents == 4356 after the first event (round_half_up(41 * 100 * 1.0625) = round_half_up(4356.25))"
            - "ShelterOperation.feeding_cost_cents == 8712 after the second event, NOT 8713 which is the sum-then-round-once result"
            - "ShelterOperation.meals_served_total == 82"

      - name: duplication_offset_pinned_evaluation_order
        grounds:
          - calculations.duplication_of_benefits_offset
          - entities.AssistanceRequest.fields.duplication_offset_cents
          - entities.AssistanceRequest.fields.approved_amount_cents
          - state_machines.AssistanceRequest.ELIGIBILITY_VERIFIED_to_APPROVED
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency whose evaluation order is pinned — the offset is
          read from the case's referrals BEFORE the award is computed, and the resulting award is
