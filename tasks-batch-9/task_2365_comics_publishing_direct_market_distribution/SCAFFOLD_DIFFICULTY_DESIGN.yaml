          assert:
            - "hop 1: ProductionStage.${st_s}.slip_days == 83, Issue.${i1}.total_slip_days == 83, Issue.${i1}.schedule_health == SLIPPED"
            - "hop 2 (caused by hop 1): Solicitation.${sol1}.status == WITHDRAWN with withdrawn_reason == AUTO_SLIP"
            - "hop 2 (caused by hop 1): Issue.${i1}.commercial_status == UNSOLICITED (fell back from FOC_LOCKED)"
            - "hop 3 (caused by hop 2): Catalog.${cat}.accepted_slot_count == 0 while Catalog.${cat}.status stays PUBLISHED"
            - "hop 3 (caused by hop 2): RetailerOrder.${o1}.status == CANCELLED with cancel_reason == AUTO_SLIP"
            - "hop 4 (caused by hop 3): Retailer.${r1}.cumulative_units_ytd == 2440 and Retailer.${r1}.discount_tier == ENTRY (demoted from BASIC)"
            - "hop 4 (caused by hop 3): Issue.${i1}.total_ordered_units == 0"
            - "chain does not fire when the slip is 21 days (deliver at 2026-09-10 instead): schedule_health == AT_RISK, Solicitation.${sol1}.status == ACCEPTED, RetailerOrder.${o1}.status == FOC_LOCKED, Retailer.${r1}.discount_tier == BASIC"
            - "Issue.${i1}.production_status == SCRIPTING throughout (the cascade never touches the production dimension)"

      - name: title_cancellation_cascades_to_issue_to_invoiced_order_to_retailer_credit
