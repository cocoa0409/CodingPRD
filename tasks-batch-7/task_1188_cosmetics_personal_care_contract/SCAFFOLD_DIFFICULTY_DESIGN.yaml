  # ===================================================================
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_quantity_conservation_reserve_release
        grounds:
          - state_machines.ComponentAllocation.RESERVED_to_RELEASED
          - entities.ComponentLot.fields.quantity_available
          - entities.ComponentLot.fields.quantity_reserved
          - entities.ComponentLot.fields.quantity_consumed
        distinguishing_aspect: |
          Conserved quantity = lot mass: for every lot, quantity_received ==
          quantity_available + quantity_reserved + quantity_consumed; the forward
          reserve (100 of 200) paired with its compensating release leaves the
          partition unchanged (200 == 200 + 0 + 0).
        test_recipe:
          setup:
            - "Customer with ACTIVE formula and CONFIRMED order; lot A1 of 200kg (component Water 1000 c/kg)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
          trigger:
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100 }] }
              as: ProductionPlanner
              captures: { al: "$.data[0].id" }
            - call: "GET /cosmfg/lots/${la}"
              as: ProductionPlanner
              captures: { mid_avail: $.data.quantity_available, mid_rsv: $.data.quantity_reserved, mid_con: $.data.quantity_consumed }
            - call: "POST /cosmfg/allocations/${al}/release"
              as: ProductionPlanner
            - call: "GET /cosmfg/lots/${la}"
              as: ProductionPlanner
              captures: { end_avail: $.data.quantity_available, end_rsv: $.data.quantity_reserved, end_con: $.data.quantity_consumed }
          assert:
            - "After reserve: quantity_available == 100, quantity_reserved == 100, quantity_consumed == 0 (sum == received 200)"
            - "After compensating release: quantity_available == 200, quantity_reserved == 0, quantity_consumed == 0 (sum == 200, zero drift)"

      - name: order_units_conservation_reduce_then_fill
        grounds:
          - state_machines.ShortfallCase.OPEN_to_ESCALATED
          - entities.ProductionOrder.fields.open_units
          - entities.ProductionOrder.fields.forfeited_units
        distinguishing_aspect: |
          Conserved quantity = contracted units: requested_units + forfeited_units
          stays 2000 across the forward fill (500 units) and the compensating
          shortfall reduction (forfeit 1500); open_units == requested - filled at
          every step.
        test_recipe:
          setup:
            - "ACTIVE formula requiring cap x1 (CUSTOMER_SUPPLIED) with LABEL_ARTWORK review APPROVED"
            - "CONFIRMED order of 2000 units; cap lot of 500 fully reserved to the order"
            - "OPEN shortfall for cap (required 2000)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Cap", kind: "SECONDARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { cap: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [{ component_id: "${cap}", units_per_product: 1 }] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "LABEL_ARTWORK" }
              as: FormulationChemist
              captures: { rvl: $.data.id }
            - call: "POST /cosmfg/reviews/${rvl}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rvl}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/components/${cap}/lots"
              payload: { lot_code: "C1", quantity_received: 500, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lc: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${lc}", quantity: 500 }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/production-orders/${ord}/shortfalls"
              payload: { component_id: "${cap}", required_quantity: 2000 }
              as: ProductionPlanner
              captures: { sf: $.data.id }
            - call: "POST /cosmfg/shortfalls/${sf}/escalate"
              payload: { resolution: "REDUCE_ORDER" }
              as: ProductionPlanner
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 25 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 50, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 25, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4000 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "PH", measured_value: 5.5 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${bt}/release"
              as: QAManager
              as_user_id: "qa-2"
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${bt}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T09:00:00Z", planned_units: 500 }
              as: ProductionPlanner
              captures: { rn: $.data.id }
            - call: "POST /cosmfg/filling-runs/${rn}/start"
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/filling-runs/${rn}/complete"
              payload: { filled_units: 500 }
              as: ProductionPlanner
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { o_req: $.data.requested_units, o_forf: $.data.forfeited_units, o_fill: $.data.filled_units, o_open: $.data.open_units, o_st: $.data.status }
          assert:
            - "ProductionOrder.${ord}.requested_units == 500 and forfeited_units == 1500 (sum conserved at 2000)"
            - "ProductionOrder.${ord}.filled_units == 500 and open_units == 0"
            - "ProductionOrder.${ord}.status == COMPLETED (label review APPROVED and filled == requested)"

      - name: customer_outstanding_confirm_cancel_reconciles
