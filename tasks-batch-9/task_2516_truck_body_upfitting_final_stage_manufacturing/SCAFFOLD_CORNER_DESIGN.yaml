          An odd-priced item makes the 8 % TIER_A discount land on a half cent: 1990333 * 0.08 =
          159226.64, which must round HALF UP to 159227 and be subtracted once. Truncation gives
          159226 and a total that is one cent high, and rounding the total instead of the discount
          gives a different answer again. The fee band is then chosen from the DISCOUNTED subtotal
          1831106, which sits in the first band even though the raw subtotal is also under 2000000.
