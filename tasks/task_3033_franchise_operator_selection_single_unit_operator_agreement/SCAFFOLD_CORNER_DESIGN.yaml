      - name: experience_block_spanning_sunday_counts_six_shifts
        claim_type: Valid Transition
        grounds:
          - calculations.experience_required_shifts
          - entities.InRestaurantExperience.fields.required_shift_count
        distinguishing_aspect: "A block from Monday 2026-09-07 through Sunday 2026-09-13 (7 calendar days) yields required_shift_count 6 because the Sunday is excluded."
        test_recipe:
          setup:
            - "Logical clock at default. Application in IN_RESTAURANT stage."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
