  # =========================================================================
  # Rule 8 — resource_temporal_overlap
  #   instance 1: Courier, half-open [start, start+dwell), adjacency PERMITTED
  #   instance 2: RestrictionPolicy, closed-closed dates, adjacency is a COLLISION
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: courier_dwell_interval_is_half_open_so_touching_attempts_are_allowed
        grounds:
          - validations[priority=62]
          - endpoints[POST /delivery-attempts]
          - domain_constants.COURIER_ATTEMPT_DWELL_MINUTES
          - errors.ERR_COURIER_SLOT_CONFLICT
        distinguishing_aspect: |
          Resource entity: Courier. Interval semantics: HALF-OPEN with a zero buffer. A new
          attempt occupies [started_at, started_at + 20 minutes) and collides with any
          non-terminal attempt of the same courier whose half-open interval intersects it.
          An attempt at 16:19 overlaps the resident [16:00, 16:20) interval and is rejected;
          an attempt at exactly 16:20 TOUCHES the resident interval's excluded end and is
          accepted. Adjacency is legal here, which is the exact opposite of the policy-period
          geometry in the sibling instance.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY ALCOHOL policy as in the shared conventions"
            - "customer attested and MATCH-pre-verified; partner OPEN; one courier CERTIFIED for ALCOHOL"
            - "order_1 and order_2 both submitted and dispatched"
            - "the courier already has an INITIATED attempt on order_1 started 2026-08-20T16:00:00Z, occupying [16:00, 16:20)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_1: $.data.id }
            - call: "POST /orders/${order_1}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${order_1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${order_1}/dispatch"
              payload: {}
              as: PartnerManager
              as_user_id: "${partner}"
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T16:30:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_2: $.data.id }
