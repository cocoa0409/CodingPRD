  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          Nothing in this API is deferred: the consent-decision response already
          carries decision GRANTED, and the very next read of the referral shows
          intake EVALUATION_AUTHORIZED, consent GRANTED and the computed
          evaluation_due_date 2026-09-30, with the child at REFERRED. Opening the
          case returns status PLANNED in its own response body while the chair's
          caseload read in the same sequence already counts 1, and the child has
          already moved to IN_EVALUATION.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A chair-eligible provider and one child born 2023-08-01 with a PEDIATRICIAN referral and a PENDING consent notice."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/providers"
              payload: { full_name: "Dana Chair", discipline: "SCHOOL_PSYCHOLOGIST", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { chair_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Ben", last_name: "Ortiz", date_of_birth: "2023-08-01", guardian_full_name: "Lia Ortiz", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent_id: "$.data.id" }
          trigger:
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${child_id}"
            - call: "GET /child-find/referrals/${referral_id}"
              payload: {}
              as: ChildFindCoordinator
            - call: "GET /child-find/children/${child_id}"
              payload: {}
              as: ChildFindCoordinator
            - call: "POST /child-find/referrals/${referral_id}/evaluation-cases"
              payload: { chair_provider_id: "${chair_id}", assessment_protocol: "STANDARDIZED" }
              as: ChildFindCoordinator
              captures: { case_id: "$.data.id" }
            - call: "GET /child-find/providers/${chair_id}/caseload"
              payload: {}
              as: ChildFindCoordinator
            - call: "GET /child-find/children/${child_id}"
              payload: {}
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 200"
            - "first response.data.decision == \"GRANTED\""
            - "first response.data.decided_at == \"2026-08-01T00:00:00Z\""
            - "second response.data.intake_status == \"EVALUATION_AUTHORIZED\""
            - "second response.data.consent_status == \"GRANTED\""
            - "second response.data.evaluation_due_date == \"2026-09-30\""
            - "third response.data.status == \"REFERRED\""
            - "fourth response.status_code == 201"
            - "fourth response.data.status == \"PLANNED\""
            - "fourth response.data.due_date == \"2026-09-30\""
            - "fourth response.data.timeline_compliance == \"ON_TIME\""
            - "fifth response.data.active_evaluation_count == 1"
            - "fifth response.data.evaluation_intake_posture == \"OPEN\""
            - "sixth response.data.status == \"IN_EVALUATION\""
