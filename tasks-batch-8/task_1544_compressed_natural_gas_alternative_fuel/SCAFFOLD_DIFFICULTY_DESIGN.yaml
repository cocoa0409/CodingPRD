# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index (task_1544 CNG station)
# Nine Difficulty Rules x >= 2 instances each (combinatorial carries 3, one per mode).
# All numeric asserts were pre-computed from the §1.3 formulas (GGE_KG = 2.567,
# 3dp round_half_up; integer cents round_half_up).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: session_gge_provisional_vs_settled_divergence
        grounds:
          - calculations.gge_equivalent_conversion
          - calculations.calibration_outcome
          - entities.FuelingSession.fields.provisional_gge
          - entities.FuelingSession.fields.settled_gge
          - entities.Dispenser.fields.correction_factor
        distinguishing_aspect: |
          Metering domain: the SAME 25.0 kg metered mass yields two valid GGE
          readings — provisional 9.739 (raw meter) vs settled 9.690 (calibration
          factor 0.995 applied) — and billing must use settled only
          (total 2800 cents at 289 c/GGE, not the provisional-based 2815).
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL) with compressor CMP-1 ONLINE and dispenser DSP-C CNG; DSP-C has a PASS calibration at +0.50% error so correction_factor == 0.995"
            - "PRIVATE CNG pricing policy at 289 c/GGE effective 2026-01-01..2027-01-01"
            - "Fleet account (credit 1000000) ACTIVE with card FC-1001 (daily 500.0)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Alpha", station_code: "ST-ALPHA", access_mode: "DUAL", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id, st_v: $.data.version } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.50 }, as: StationManager, captures: { cal_res: $.data.result } }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: NetworkOperator, captures: { st_v2: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v2}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Acme Freight", billing_email: "billing@acme.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id, acct_v: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-1001", vehicle_plate: "8ABC123", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-DV1", estimated_gge: 20.0, expected_fleet_account_version: "${acct_v}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { sess_id: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${sess_id}/complete", payload: { metered_mass_kg: 25.0 }, as: FleetDriver, as_user_id: "${card_id}", captures: { prov: $.data.provisional_gge, sett: $.data.settled_gge, tot: $.data.total_amount_cents } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "cal_res == PASS (exactly 0.50% error passes the tolerance)"
            - "FuelingSession.${sess_id}.correction_factor_applied == 0.995"
            - "FuelingSession.${sess_id}.provisional_gge == 9.739"
            - "FuelingSession.${sess_id}.settled_gge == 9.690"
            - "FuelingSession.${sess_id}.unit_price_cents == 289"
            - "FuelingSession.${sess_id}.total_amount_cents == 2800  (settled 9.690 x 289; provisional-based billing would give 2815)"
            - "FleetAccount.${acct_id}.outstanding_balance_cents == 2800  (5780 hold replaced by 2800 actual)"

      - name: claim_provisional_vs_final_divergence
        grounds:
          - calculations.tax_credit_claim_computation
          - entities.TaxCreditClaim.fields.claim_amount_provisional_cents
          - entities.TaxCreditClaim.fields.claim_amount_final_cents
          - state_machines.FuelingSession.COMPLETED_to_SETTLED
        distinguishing_aspect: |
          Fiscal-claims domain (distinct from session metering): over identical
          session data the provisional variant (COMPLETED+SETTLED sessions,
          provisional GGE) yields 1539 cents while the final variant (SETTLED
          only, settled GGE) yields 1283 cents — a 256-cent divergence driven
          by both input-set filtering and calibration correction.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL); DSP-C CNG calibrated +0.50% (factor 0.995); DSP-R RNG uncalibrated (factor 1.0)"
            - "PRIVATE policies: CNG 289, RNG 289; account credit 1000000, card daily 500"
            - "July sessions: C1 = 26.0 kg CNG (prov 10.129 / settled 10.078), R1 = 20.0 kg RNG (7.791 both); clock advances into August so C1/R1 are SETTLED"
            - "August session: C2 = 13.0 kg CNG (prov 5.064 / settled 5.039), still COMPLETED"
            - "Claim over 2026-07-01..2026-09-01 created after C2"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Beta", station_code: "ST-BETA", access_mode: "DUAL", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-R", fuel_type: "RNG" }, as: StationManager, captures: { dsp_r: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.50 }, as: StationManager }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: NetworkOperator, captures: { st_vb: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "RNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_vb}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Bravo Logistics", billing_email: "ap@bravo.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-2001", vehicle_plate: "7XYZ789", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-C1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 26.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av2: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_r}", client_ref: "CR-R1", estimated_gge: 20.0, expected_fleet_account_version: "${av2}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s2: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s2}/complete", payload: { metered_mass_kg: 20.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av3: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-C2", estimated_gge: 20.0, expected_fleet_account_version: "${av3}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s3: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s3}/complete", payload: { metered_mass_kg: 13.0 }, as: FleetDriver, as_user_id: "${card_id}" }
          trigger:
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: StationManager, captures: { claim_id: $.data.id, prov_amt: $.data.claim_amount_provisional_cents } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager, captures: { fin_amt: $.data.claim_amount_final_cents, fin_gge: $.data.eligible_gge_final } }
          assert:
            - "TaxCreditClaim.${claim_id}.claim_amount_provisional_cents == 1539  ((10.129+5.064)*50 + 7.791*100 = 1538.75 -> half-up)"
            - "TaxCreditClaim.${claim_id}.eligible_gge_provisional == 22.984"
            - "TaxCreditClaim.${claim_id}.claim_amount_final_cents == 1283  (10.078*50 + 7.791*100 = 1283.00; COMPLETED session C2 excluded, settled GGE used)"
            - "TaxCreditClaim.${claim_id}.eligible_gge_final == 17.869"
            - "FuelingSession.${s1}.status == SETTLED and FuelingSession.${s2}.status == SETTLED (month-close sweep) while FuelingSession.${s3}.status == COMPLETED"

  - rule_id: combinatorial_formula
    instances:
      - name: shortfall_tiered_penalty_straddling_tier_cap
        grounds:
          - calculations.minimum_volume_settlement
          - state_machines.SupplyContract.DRAFT_to_ACTIVE
          - entities.MonthlySettlement.fields.penalty_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear tiered-rate selection and nested
          min/max: delivered 88.000 vs committed 100.000 leaves shortfall 12.000
          which STRADDLES the 10% tier cap (10.000 GGE), so the penalty mixes
          10.000 x 30c with 2.000 x 55c = 410 cents; an average-rate reading
          would give 360 or 660.
        test_recipe:
          setup:
            - "ACTIVE station ST (PRIVATE), account (credit 1000000), card FC-3001 (daily 500)"
            - "ACTIVE supply contract: committed 100.0 GGE/month, price 275, tier1 30c, tier2 55c, span 2026-07..2026-12"
            - "Two August sessions of 112.948 kg each -> 44.000 GGE settled each (factor 1.0), total delivered 88.000"
            - "Clock advanced to 2026-09-01 so August is closed (sessions swept to SETTLED)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Gamma", station_code: "ST-GAMMA", access_mode: "PRIVATE", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Charlie Haulage", billing_email: "ops@charlie.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-3001", vehicle_plate: "5DEF456", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 100.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-07", end_month: "2026-12" }, as: NetworkOperator, captures: { contract_id: $.data.id } }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-S1", estimated_gge: 50.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 112.948 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av2: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-S2", estimated_gge: 50.0, expected_fleet_account_version: "${av2}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s2: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s2}/complete", payload: { metered_mass_kg: 112.948 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/supply-contracts/${contract_id}/settle-month", payload: { month: "2026-08" }, as: NetworkOperator, captures: { setl_id: $.data.id, pen: $.data.penalty_cents } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "MonthlySettlement.${setl_id}.delivered_gge == 88.000"
            - "MonthlySettlement.${setl_id}.shortfall_gge == 12.000"
            - "MonthlySettlement.${setl_id}.penalty_cents == 410  (min(12,10)*30 + max(0,12-10)*55 = 300 + 110)"
            - "FleetAccount.${acct_id}.outstanding_balance_cents == 24610  (12100 + 12100 session totals at contract price 275, plus 410 penalty)"

      - name: claim_per_session_rounding_order
        grounds:
          - calculations.tax_credit_claim_computation
          - entities.TaxCreditClaim.fields.eligible_gge_provisional
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the claim must sum PER-SESSION
          rounded GGE (3 x 0.390 = 1.170 -> 59 cents at 50 c/GGE after half-up
          of 58.5), NOT sum-then-convert the metered mass (3.0 kg -> 1.169 GGE
          -> 58 cents); the one-cent delta is the falsifiable marker.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), DSP-C CNG uncalibrated (factor 1.0), PRIVATE CNG policy 289"
            - "Account (credit 1000000), card FC-4001; three COMPLETED August sessions of exactly 1.0 kg each (per-session GGE 0.390)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Delta", station_code: "ST-DELTA", access_mode: "DUAL", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Delta Transit", billing_email: "ap@delta.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-4001", vehicle_plate: "4GHI789", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-R1", estimated_gge: 5.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 1.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av2: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-R2", estimated_gge: 5.0, expected_fleet_account_version: "${av2}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s2: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s2}/complete", payload: { metered_mass_kg: 1.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av3: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-R3", estimated_gge: 5.0, expected_fleet_account_version: "${av3}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s3: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s3}/complete", payload: { metered_mass_kg: 1.0 }, as: FleetDriver, as_user_id: "${card_id}" }
          trigger:
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: StationManager, captures: { claim_id: $.data.id } }
          assert:
            - "FuelingSession.${s1}.provisional_gge == 0.390 and likewise s2, s3 (per-session round of 1.0/2.567 = 0.3896)"
            - "TaxCreditClaim.${claim_id}.eligible_gge_provisional == 1.170  (0.390 + 0.390 + 0.390)"
            - "TaxCreditClaim.${claim_id}.claim_amount_provisional_cents == 59  (1.170*50 = 58.5 -> round_half_up; sum-then-convert would yield 58)"

      - name: mtd_tier_threshold_excludes_current_session
        grounds:
          - calculations.fueling_unit_price_resolution
          - entities.PricingPolicy.fields.tier_threshold_gge
          - entities.FuelingSession.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the
          tier test uses the account's station-MTD volume EXCLUDING the session
          being priced, snapshotted at authorize. The session that crosses the
          20.0 GGE threshold is still billed at base 300c; only the NEXT
          session gets 250c.
        test_recipe:
          setup:
            - "ACTIVE station ST (PRIVATE); PRIVATE CNG policy price 300 with tier_threshold_gge 20.0 / tier_price_cents 250"
            - "Account (credit 1000000), card FC-5001; S1 and S2 completed at 20.536 kg (8.000 GGE each) so MTD == 16.000"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Echo", station_code: "ST-ECHO", access_mode: "PRIVATE", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 300, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", tier_threshold_gge: 20.0, tier_price_cents: 250, expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Echo Carriers", billing_email: "ap@echo.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
