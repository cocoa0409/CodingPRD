      - '${e1} == ERR_REPORT_PERIOD_OPEN    # account current_period 2026-08 not yet past the report period'
      - '${e2} == ERR_REPORT_NOT_DRAFT      # second submit'
      - 'After close + submit + attest: SavingsReport.${rep}.status == ATTESTED AND attested_credit_cents == 0 (zero savings, zero credit)'
      - '${e3} == ERR_REPORT_NOT_DRAFT      # ATTESTED is terminal; revise requires REJECTED'
      - '${e4} == ERR_REPORT_PERIOD_FINALIZED   # an ATTESTED report blocks new reports for the period'
  - name: sm_exception_expiry_and_waiver_lapse
    claim_type: temporal_validation
    grounds:
    - state_machines.ComplianceException
    - validations[priority=10]
    - errors[ERR_EXCEPTION_NOT_EXPIRED]
    distinguishing_aspect: A CCT_WAIVER (requested 5000K, valid_until 2026-08-10) is honored at its exact ceiling (5000 == 5000 passes); refresh before expiry fails ERR_EXCEPTION_NOT_EXPIRED; after the
      clock passes valid_until, refresh materializes EXPIRED and the lapsed waiver no longer covers a rework dispatch of the same 5000K spec.
