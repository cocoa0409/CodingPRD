              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr IM", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "imm" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "IM Pat", date_of_birth: "1990-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { vid: $.data.id, cl: $.data.clinical_status, ac: $.data.acuity_at_rooming }
            - call: "GET /exam-rooms/${room}"
              payload: {}
              as: Provider
              captures: { rst: $.data.status, cvid: $.data.current_visit_id }
          assert:
            - "Visit.${vid}.clinical_status == IN_EXAM AND Visit.${vid}.acuity_at_rooming == 3"
            - "ExamRoom.${room}.status == OCCUPIED AND ExamRoom.${room}.current_visit_id == ${vid}"
