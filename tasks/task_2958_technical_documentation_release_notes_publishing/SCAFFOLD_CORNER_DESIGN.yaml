            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-feature-a", title: "Feature A guide" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["logon"], summary: "Draft that still uses the forbidden form" }
              as: Writer
              as_user_id: "${w_id}"
