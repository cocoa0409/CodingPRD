  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trial_reminder_window_inclusive_lower_boundary
        grounds:
          - calculations.savings_report_summary
          - entities.Subscription.fields.reminder_due
          - entities.Subscription.fields.trial_end_utc
          - entities.Subscription.fields.trial_reminder_lead_days
        distinguishing_aspect: |
          Interval semantics: half-open lead-time window with INCLUSIVE lower bound.
          reminder_due becomes true when clock >= (trial_end_utc - lead_days). With
          trial_end 2026-02-10 and lead 3, at clock EXACTLY 2026-02-07T00:00:00Z reminder_due
          is true (boundary included); this is a point-in-window-vs-edge interval treatment.
        test_recipe:
          setup:
            - "An ACTIVE member with a CONFIRMED charge and a free-trial Subscription trial_end 2026-02-10T00:00:00Z lead 3; clock set to exactly the reminder edge."
          setup_api_calls:
