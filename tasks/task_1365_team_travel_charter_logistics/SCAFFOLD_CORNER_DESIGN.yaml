  # =====================================================================
  # Section: errors — every error code triggerable (those not yet covered)
  # =====================================================================
  - section: errors
    instances:
      - name: error_trip_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRIP_NOT_FOUND]"]
        distinguishing_aspect: "GET /travel/teams/{valid}/trips/{random-uuid} -> ERR_TRIP_NOT_FOUND 404"
        test_recipe:
          setup: ["team exists"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "SAS2", display_name: "San Antonio 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
          trigger:
            - call: "GET /travel/teams/${team_id}/trips/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "http status == 404"
            - "error_id == ERR_TRIP_NOT_FOUND"

      - name: error_season_closed
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEASON_CLOSED]"]
        distinguishing_aspect: "Mutating a child resource under a CLOSED season returns ERR_SEASON_CLOSED"
        test_recipe:
          setup: ["season closed (no trips ever -> all zero trips in terminal, close succeeds)"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "MEM2", display_name: "Memphis 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons/${season_id}/close"
              payload: {}
              as: TravelFinanceLead
          trigger:
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "NOLA", game_tipoff_utc: "2027-06-05T00:00:00Z", return_arrival_utc: "2027-06-06T08:00:00Z" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "error_id == ERR_SEASON_CLOSED"

  # =====================================================================
  # Section: rbac — role permission matrix
  # =====================================================================
  - section: rbac
    instances:
      - name: vendor_rep_cannot_execute_contract
        claim_type: role_denial
        grounds: ["roles.VendorRep", "roles.TravelFinanceLead"]
        distinguishing_aspect: "VendorRep attempting FinanceLead-only execute operation -> ERR_INSUFFICIENT_PERMISSIONS"
        test_recipe:
          setup: ["contract VENDOR_COUNTERSIGNED"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "UTA2", display_name: "Utah 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "POR", game_tipoff_utc: "2027-06-10T00:00:00Z", return_arrival_utc: "2027-06-11T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VU", base_price_cents: 5000000, fuel_surcharge_cap_cents: 500000, seat_capacity: 30, cargo_capacity_lb: 10000, penalty_bands: [{days_before: 30, penalty_pct: 10}] }
              as: TravelManager
              captures: { contract_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/countersign"
              payload: {}
              as: VendorRep
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/execute"
              payload: { expected_contract_version: "${contract_v}" }
              as: VendorRep
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403"
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: equipment_manager_cannot_manage_credentials
        claim_type: role_denial
        grounds: ["roles.EquipmentManager", "roles.SecurityOfficer"]
        distinguishing_aspect: "EquipmentManager attempting security-review on a credential is denied (peer_roles: each role owns different resource types)"
        test_recipe:
          setup: ["credential in SUBMITTED"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "CHI2", display_name: "Chicago 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "MKE", game_tipoff_utc: "2027-06-15T00:00:00Z", return_arrival_utc: "2027-06-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "C02", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/credentials"
              payload: { member_id: "${m_id}", venue_code: "MKE", access_level: "FIELD" }
              as: TeamMember
              as_user_id: "${m_id}"
              captures: { cred_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/credentials/${cred_id}/security-review"
              payload: {}
              as: EquipmentManager
              as_user_id: "eq-manager-1"
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403"
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

  # =====================================================================
  # Section: cross_cutting_layers — OCC stale version, idempotency, etc.
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_trip_lock_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[trip-lock-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second lock with stale expected_trip_version (read before a member-add bumped version) -> 412 ERR_STALE_VERSION"
        test_recipe:
          setup: ["trip in DRAFT; client reads version V; another call adds a member bumping version to V+1; client retries lock with stale V"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "IND2", display_name: "Indiana 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "CHI", game_tipoff_utc: "2027-07-01T00:00:00Z", return_arrival_utc: "2027-07-02T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "I01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "IND", destination_code: "CHI", scheduled_depart_utc: "2027-06-30T18:00:00Z", scheduled_arrive_utc: "2027-06-30T19:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HCHI2", room_count: 1, rate_cents_per_night: 20000, check_in_date: "2027-06-30", night_count: 1, cutoff_date: "2027-06-26" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "I02", party_role: "COACH", travel_class: "CHARTER_STANDARD", per_diem_tier: "TIER_B" }
              as: TravelManager
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v0}" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: occ_hotel_block_lock_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[hotel-block-lock-stale-version]"]
        distinguishing_aspect: "Hotel block lock with expected_block_version read before a room assignment was added -> 412"
        test_recipe:
          setup: ["block in NAME_LIST_DUE; client reads version; another call adds a room bumping version; client retries lock"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "WAS2", display_name: "Washington 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "NYC", game_tipoff_utc: "2027-07-05T00:00:00Z", return_arrival_utc: "2027-07-06T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "W02", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A", requires_single_room: true }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HNYC", room_count: 2, rate_cents_per_night: 35000, check_in_date: "2027-07-04", night_count: 1, cutoff_date: "2027-07-01" }
              as: TravelCoordinator
              captures: { block_id: $.data.id, block_v0: $.data.version }
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-25T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/rooms"
              payload: { member_id: "${m_id}", room_label: "801" }
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/lock"
              payload: { expected_block_version: "${block_v0}" }
              as: TravelCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "http status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: version_increments_on_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.Trip.fields.version"]
        distinguishing_aspect: "Every successful mutation on Trip (member add, leg create, lock) increments version by exactly 1"
        test_recipe:
          setup: ["fresh trip"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "MIA2", display_name: "Miami 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "ORL", game_tipoff_utc: "2027-07-10T00:00:00Z", return_arrival_utc: "2027-07-11T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "M03", party_role: "STAFF", travel_class: "COMMERCIAL_COACH", per_diem_tier: "TIER_C" }
              as: TravelManager
            - call: "GET /travel/teams/${team_id}/trips/${trip_id}"
              payload: {}
              as: Any
              captures: { trip_after: $.data }
          assert:
            - "Trip.version == v0 + 1 (member add bumped trip)"
            - "Trip.updated_at > Trip.created_at"

  # =====================================================================
  # Section: consistency_model — immediate
  # =====================================================================
  - section: consistency_model
    instances:
      - name: trip_estimated_visible_immediately_after_charter_execute
        claim_type: immediate_consistency
        grounds: ["calculations.trip_estimated_cost", "state_machines.CharterContract.VENDOR_COUNTERSIGNED_to_TEAM_EXECUTED"]
        distinguishing_aspect: "After charter execute, the trip's estimated_cost_cents reflects base+cap in the SAME response (immediate consistency, not eventual)"
        test_recipe:
          setup: ["trip with contract countersigned"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "TOR2", display_name: "Toronto 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "MTL", game_tipoff_utc: "2027-07-15T00:00:00Z", return_arrival_utc: "2027-07-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VT", base_price_cents: 6000000, fuel_surcharge_cap_cents: 600000, seat_capacity: 30, cargo_capacity_lb: 12000, penalty_bands: [{days_before: 30, penalty_pct: 10}] }
              as: TravelManager
              captures: { contract_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/countersign"
              payload: {}
              as: VendorRep
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/execute"
              payload: { expected_contract_version: "${contract_v}" }
              as: TravelFinanceLead
            - call: "GET /travel/teams/${team_id}/trips/${trip_id}"
              payload: {}
              as: Any
              captures: { trip_after: $.data }
          assert:
            - "Trip.${trip_id}.estimated_cost_cents == 6600000 (base 6000000 + cap 600000)"
            - "CharterContract.${contract_id}.status == TEAM_EXECUTED"
