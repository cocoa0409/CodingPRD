      - name: corner_deduction_draft_and_posted_codes_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DEDUCTION_NO_ALLOCATIONS
          - errors.ERR_DEDUCTION_NOT_POSTED
          - errors.ERR_ALLOCATION_EXCEEDS_OUTSTANDING
          - errors.ERR_DEDUCTION_NOT_DRAFT
          - validations[priority=31]
          - state_machines.Deduction
        distinguishing_aspect: "The DRAFT/POSTED split cuts both ways: an empty DRAFT cannot be posted (422 ERR_DEDUCTION_NO_ALLOCATIONS) and cannot be reversed (409 ERR_DEDUCTION_NOT_POSTED), while a POSTED deduction can no longer take allocations (409 ERR_DEDUCTION_NOT_DRAFT, the state rung at priority 8 beating the now-zero outstanding ceiling at priority 31) - and 38001 against a 38000 outstanding is refused at 422 while exactly 38000 is accepted."
        test_recipe:
          setup:
            - "Vendor V-2062 with a single 38000-cent LBL-01 chargeback assessed at 2026-08-10 and no cash applied, so open_chargeback_cents == 38000."
            - "One DRAFT Deduction against invoice INV-2062 with zero allocations."
