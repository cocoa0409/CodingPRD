# =============================================================================
# Task 0841 — Traffic Signal & Streetlight Maintenance
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: device_creation_returns_all_fields
        claim_type: creation
        grounds: [entities.Device, endpoints]
        distinguishing_aspect: "POST /devices with all required fields returns 201, a system id, version==1, and status IN_SERVICE."
        test_recipe:
          setup: ["One intersection to own the device."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Rose & 16th", district: "D1", latitude: 42.0, longitude: -82.0 }
              as: Admin
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
          assert:
            - "response code == 201"
            - "Device.${dev_id}.status == IN_SERVICE"
            - "Device.${dev_id}.version == 1"
            - "Device.${dev_id}.criticality == STANDARD"

      - name: device_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Device, "errors[ERR_DEVICE_NOT_FOUND]"]
        distinguishing_aspect: "GET /devices/{unknown-uuid} returns ERR_DEVICE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /devices/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEVICE_NOT_FOUND"
            - "response code == 404"

      - name: device_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Device, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /devices omitting the required criticality field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["One intersection."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Sage & 17th", district: "D1", latitude: 42.1, longitude: -82.1 }
              as: Admin
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response code == 422"

      - name: ticket_severity_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.Ticket.fields.reported_severity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /tickets with reported_severity 6 (outside 1..5) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["One intersection and device."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Teak & 18th", district: "D1", latitude: 42.2, longitude: -82.2 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 6, description: "bad severity" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: pole_available_load_computed_on_create
        claim_type: computed_fields
        grounds: [entities.Pole.fields.available_load_units, calculations.pole_load_ledger]
        distinguishing_aspect: "A freshly created pole with load_capacity_units 50 reports committed_load_units 0 and available_load_units 50."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /poles"
              payload: { label: "P50", latitude: 42.3, longitude: -82.3, load_capacity_units: 50 }
              as: Admin
              captures: { pole_id: $.data.id }
          assert:
            - "Pole.${pole_id}.committed_load_units == 0"
            - "Pole.${pole_id}.available_load_units == 50"

      - name: system_fields_generated_on_create
        claim_type: system_fields
        grounds: [entities.Intersection, endpoints]
        distinguishing_aspect: "POST /intersections mints an id, sets version 1, and computes operational_posture NORMAL (no devices)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /intersections"
              payload: { name: "Vine & 19th", district: "D2", latitude: 42.4, longitude: -82.4 }
              as: Admin
              captures: { int_id: $.data.id }
          assert:
            - "Intersection.${int_id}.version == 1"
            - "Intersection.${int_id}.operational_posture == NORMAL"
            - "Intersection.${int_id}.active_plan_revision == 0"

  - section: state_machines
    instances:
      - name: resolve_from_open_invalid_state
        claim_type: invalid_transitions
        grounds: [state_machines.Ticket.IN_PROGRESS_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling resolve on an OPEN (untriaged) ticket returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["One OPEN ticket (created, not triaged)."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Wren & 20th", district: "D1", latitude: 42.5, longitude: -82.5 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "x" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tk_id}/resolve"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Ticket.${tk_id}.status == OPEN"

      - name: reject_terminal_timing_change_locked
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TimingPlanChangeRequest.UNDER_REVIEW_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second reject on an already REJECTED timing change request returns ERR_INVALID_STATE (terminal lock)."
        test_recipe:
          setup: ["A timing change request moved to UNDER_REVIEW then REJECTED."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Yew & 21st", district: "D2", latitude: 42.6, longitude: -82.6 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /timing-change-requests"
              payload: { intersection_id: "${int_id}", proposed_cycle_length_sec: 90, proposed_offset_sec: 5, rationale: "x" }
              as: Dispatcher
              captures: { tcr_id: $.data.id }
            - call: "POST /timing-change-requests/${tcr_id}/start-review"
              payload: {}
              as: TrafficEngineer
            - call: "POST /timing-change-requests/${tcr_id}/reject"
              payload: {}
              as: TrafficEngineer
          trigger:
            - call: "POST /timing-change-requests/${tcr_id}/reject"
              payload: {}
              as: TrafficEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "TimingPlanChangeRequest.${tcr_id}.status == REJECTED"

      - name: triage_twice_idempotency_rejected
        claim_type: idempotency
        grounds: [state_machines.Ticket.OPEN_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Triaging an already TRIAGED ticket returns ERR_INVALID_STATE; priority_score is not recomputed."
        test_recipe:
          setup: ["A triaged ticket."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Zed & 22nd", district: "D1", latitude: 42.7, longitude: -82.7 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "x" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Ticket.${tk_id}.status == TRIAGED"

      - name: locate_mark_then_clear_valid
        claim_type: valid_transition
        grounds: [state_machines.LocateRequest.OPEN_to_MARKED, state_machines.LocateRequest.MARKED_to_CLEARED]
        distinguishing_aspect: "An OPEN locate marked then cleared reaches status CLEARED."
        test_recipe:
          setup: ["One OPEN locate request."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Ada & 23rd", district: "D3", latitude: 42.8, longitude: -82.8 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /locate-requests"
              payload: { intersection_id: "${int_id}", requested_by: "UtilCo" }
              as: UtilityCoordinator
              captures: { loc_id: $.data.id }
            - call: "POST /locate-requests/${loc_id}/mark"
              payload: {}
              as: UtilityCoordinator
          trigger:
            - call: "POST /locate-requests/${loc_id}/clear"
              payload: {}
              as: UtilityCoordinator
          assert:
            - "LocateRequest.${loc_id}.status == CLEARED"

      - name: new_ticket_initial_state_open
        claim_type: initial_state
        grounds: [state_machines.Ticket, entities.Ticket.fields.status]
        distinguishing_aspect: "A freshly created ticket has status OPEN and sla_response_status PENDING."
        test_recipe:
          setup: ["One intersection and device."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Bea & 24th", district: "D1", latitude: 42.9, longitude: -82.9 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "DETECTOR", reported_severity: 2, description: "x" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          assert:
            - "Ticket.${tk_id}.status == OPEN"
            - "Ticket.${tk_id}.sla_response_status == PENDING"

  - section: calculations
    instances:
      - name: priority_band_p3_midrange
        claim_type: correct_result
        grounds: [calculations.ticket_priority_score, entities.Ticket.fields.priority_band]
        distinguishing_aspect: "DETECTOR(15)+STANDARD(20)+severity2*8(16)+no hazard = 51 -> band P3."
        test_recipe:
          setup: ["STANDARD device; DETECTOR severity-2 ticket, no hazard."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Cid & 25th", district: "D2", latitude: 43.0, longitude: -83.0 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "DETECTOR", criticality: "STANDARD", model: "D9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 400.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "DETECTOR", reported_severity: 2, description: "loop fault" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
          assert:
            - "Ticket.${tk_id}.priority_score == 51"
            - "Ticket.${tk_id}.priority_band == P3"

      - name: sla_on_track_one_minute_before_due
        claim_type: boundary
        grounds: [calculations.ticket_sla_windows, entities.Ticket.fields.sla_response_status]
        distinguishing_aspect: "One minute before response_due (clock 00:59, elapsed 59 < 60) sla_response_status is ON_TRACK — the strict lower side of the inclusive breach boundary."
        test_recipe:
          setup: ["Clock 2026-03-01T00:00:00Z; P1 ticket (response_due 01:00); advance clock to 00:59."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Admin
            - call: "POST /intersections"
              payload: { name: "Dot & 26th", district: "D1", latitude: 43.1, longitude: -83.1 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_CONTROLLER", criticality: "CRITICAL", model: "C9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 5000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 4, description: "x", hazard_flag: true }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:59:00Z" }
              as: Admin
          trigger:
            - call: "GET /tickets/${tk_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "Ticket.${tk_id}.sla_response_status == ON_TRACK"

      - name: warranty_expired_rejected
        claim_type: violation_to_error
        grounds: [calculations.warranty_payout, "errors[ERR_WARRANTY_EXPIRED]"]
        distinguishing_aspect: "A device installed 2019-01-01 (age > 60 months at clock 2026-03-01) rejects the warranty claim with ERR_WARRANTY_EXPIRED."
        test_recipe:
          setup: ["Clock default 2026-03-01; device installed 2019-01-01 (86 months old)."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Eli & 27th", district: "D1", latitude: 43.2, longitude: -83.2 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "STREETLIGHT", criticality: "LOW", model: "L9", installed_at: "2019-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims"
              payload: { device_id: "${dev_id}", defect_description: "old failure" }
              as: UtilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WARRANTY_EXPIRED"

  - section: validations
    instances:
      - name: reopen_after_window_expired
        claim_type: temporal_validation
        grounds: [state_machines.Ticket.RESOLVED_to_TRIAGED, "validations[priority=11]", "errors[ERR_REOPEN_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Reopening a ticket 73h after resolved_at (> 72h window) returns ERR_REOPEN_WINDOW_EXPIRED; the ticket stays RESOLVED."
        test_recipe:
          setup: ["Ticket resolved at clock 2026-03-01T00:00:00Z (with a completed WO); clock then advanced to 2026-03-04T01:00:00Z (73h later)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Admin
            - call: "POST /intersections"
              payload: { name: "Fay & 28th", district: "D1", latitude: 43.3, longitude: -83.3 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew G", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "x" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0, ticket_id: "${tk_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 1.0 }
              as: FieldTech
              as_user_id: "${crew_id}"
            - call: "POST /tickets/${tk_id}/resolve"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T01:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /tickets/${tk_id}/reopen"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REOPEN_WINDOW_EXPIRED"
            - "Ticket.${tk_id}.status == RESOLVED"

      - name: ticket_close_blocked_by_open_work
        claim_type: aggregate_validation
        grounds: [state_machines.Ticket.RESOLVED_to_CLOSED, "validations[priority=12]", "errors[ERR_TICKET_HAS_OPEN_WORK]"]
        distinguishing_aspect: "A RESOLVED ticket with a second DRAFT work order linked cannot close: ERR_TICKET_HAS_OPEN_WORK."
        test_recipe:
          setup: ["Ticket resolved via a completed WO1; a second DRAFT WO2 also linked to the ticket."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Gus & 29th", district: "D1", latitude: 43.4, longitude: -83.4 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew H", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "x" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0, ticket_id: "${tk_id}" }
              as: Dispatcher
              captures: { wo1: $.data.id }
            - call: "POST /work-orders/${wo1}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo1}/complete"
              payload: { actual_labor_hours: 1.0 }
              as: FieldTech
              as_user_id: "${crew_id}"
            - call: "POST /tickets/${tk_id}/resolve"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "PM_LAMP", estimated_labor_hours: 1.0, ticket_id: "${tk_id}" }
              as: Dispatcher
              captures: { wo2: $.data.id }
          trigger:
            - call: "POST /tickets/${tk_id}/close"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TICKET_HAS_OPEN_WORK"
            - "Ticket.${tk_id}.status == RESOLVED"

  - section: endpoints
    instances:
      - name: list_devices_pagination
        claim_type: pagination
        grounds: [endpoints, entities.Device]
        distinguishing_aspect: "GET /devices?intersection_id=&limit=1 over two devices returns total_count 2, has_more true, and one item."
        test_recipe:
          setup: ["One intersection with two devices."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Hal & 30th", district: "D1", latitude: 43.5, longitude: -83.5 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "STREETLIGHT", criticality: "LOW", model: "L9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 800.00, warranty_provider: "Acme" }
              as: Admin
          trigger:
            - call: "GET /devices?intersection_id=${int_id}&limit=1&offset=0"
              payload: {}
              as: Admin
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "response data length == 1"

      - name: pole_load_exceeded_over_capacity
        claim_type: conditional_action
        grounds: ["validations[priority=9]", "errors[ERR_POLE_LOAD_EXCEEDED]", calculations.pole_load_ledger]
        distinguishing_aspect: "With 60 units APPROVED on a 100-capacity pole, approving a further 41 (committed+load = 101 > 100) is rejected with ERR_POLE_LOAD_EXCEEDED — the strict-greater side of the load boundary."
        test_recipe:
          setup: ["Pole capacity 100; one APPROVED attachment of 60 (LOW); a REQUESTED attachment of 41 (MID)."]
          setup_api_calls:
            - call: "POST /poles"
