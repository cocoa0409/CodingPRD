            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-OA", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "OA" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
