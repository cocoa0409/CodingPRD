              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "DESTINATION", taxability: "TAXABLE_IF_MANDATORY" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "WIFI_PREMIUM", taxability: "EXEMPT" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /channels"
              payload: { name: "BigOTA", channel_type: "OTA", supports_total_price_display: true, supports_itemization: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_ota: $.data.id }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_resort: $.data.id }
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "DESTINATION", label: "Destination Fee", classification: "MANDATORY", basis: "PER_NIGHT", amount_cents: 1495, avoidable: true, opt_out_window_hours: 48, disclosure_text: "Destination fee of $14.95 per night; avoidable on request." }
              as: RevenueManager
