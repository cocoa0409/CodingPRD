              as: ContractAdmin
              captures: { cdo: $.data.id }
            - call: "POST /service-contracts/${cdo}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cdo}", name: "Overlap Early", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rdo1: $.data.id }
