            - "hop 3: LandApplicationSite.${site_id}.status == RESTRICTED and restriction_reason == CPLR_HEADROOM_LOW"
            - "hop 4: ApplicationEvent.${ev_b}.status == DEFERRED with defer_reason == SITE_RESTRICTED and reserved_dry_tons == 80.000"
            - "ApplicationEvent.${ev_a}.status == COMPLETED, applied_dry_tons == 80.000, applied_wet_tons == 400.00, reserved_dry_tons == 0.000, completed_by_user_id == officer-close-2"
