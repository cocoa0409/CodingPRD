              payload: { loan_id: "${loan_id}", fee_type: "WORKOUT_FEE", collection_amount_usd: 200000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { conflict_error: "$.data.error_id" }
            - call: "POST /special-servicing/fee-accruals/${liq_fee_id}/status"
              payload: { to_status: "WAIVED", waived_reason: "fee rebated to the trust by side agreement" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { waived_status: "$.data.status" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "WORKOUT_FEE", collection_amount_usd: 200000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { post_waiver_error: "$.data.error_id" }
          assert:
            - "The sale mints exactly one LIQUIDATION_FEE accrual, in status ACCRUED, with basis_amount_usd 5000000.00 (gross, not net) and amount_usd 50000.00 = min(1,000,000.00 cap, 1.0% of gross)"
            - "The waterfall left available = 5,000,000.00 - 300,000.00 - 50,000.00 = 4,650,000.00, applied entirely to principal, so Loan.realized_loss_usd == 5350000.00"
            - "The WORKOUT_FEE attempt returns HTTP 409 with error_id ERR_FEE_TYPE_CONFLICT — priority 25 beats the priority 29 workout-fee eligibility check that the same call also violates"
            - "After waiving the liquidation fee the loan carries no non-WAIVED LIQUIDATION_FEE, so rule 25 no longer fires and the SAME body now surfaces the next violation: HTTP 409 ERR_WORKOUT_FEE_NOT_ELIGIBLE"
            - "The two refusals are distinguished only by the conflicting row's status, which is what pins the ordering of the two rules"
            - "No WORKOUT_FEE row was ever created; the fee list for the loan holds exactly the one WAIVED LIQUIDATION_FEE"

  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations_permitted
        grounds:
          - roles.PlatformAdmin
          - roles.MasterServicer
          - roles.SpecialServicerAssetManager
          - roles.SpecialServicingCommitteeOfficer
          - roles.ControllingClassRepresentative
          - roles.Borrower
          - roles.Trustee
        distinguishing_aspect: "One end-to-end pass in which all seven roles act in turn, so the matrix is proved positively and not only by its denials. Both entity_backed roles act with the correct owning key — the borrower with X-User-ID equal to loan_id and the controlling class representative with X-User-ID equal to trust_id — and every opaque role uses its pinned fixture id."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
            - "Pinned ids: ms-001, amgr-001, amgr-002, cmte-001, trustee-001, admin-001; the controlling class representative presents the trust id and the borrower presents the loan id."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V42", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", trust_control: "$.data.control_status" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V42", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "DELINQUENT_60", as_of_date: "2026-07-15T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { payment_status: "$.data.payment_status" }
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { servicing_status: "$.data.servicing_status", loan_version: "$.data.version" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PI_ADVANCE", amount_usd: 60000, advanced_on: "2026-07-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_id: "$.data.id", advance_status: "$.data.status" }
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-06-20T00:00:00Z", appraiser_firm: "Meridian Valuation" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id", orderer: "$.data.ordered_by_user_id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 9000000, as_of_date: "2026-07-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
              captures: { appraisal_status: "$.data.status" }
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_id}", status: "PROVISIONAL" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_id: "$.data[0].id", ara_amount: "$.data[0].ara_amount_usd" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_status: "$.data.status" }
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "ASSUMPTION", processing_fee_deposit_usd: 15000, requested_terms_note: "sale of the property to an affiliate", assumption_buyer_name: "Harborline Realty LP" }
              as: Borrower
