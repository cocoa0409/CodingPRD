# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Every active instance is reachable from empty-DB via §1.5; excluded_because
# stubs point at the §1.8 instance (by name) that already covers the corner.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: entity_create_reservation_minimal_required_fields
        claim_type: Creation
        grounds: [entities.Reservation, endpoints]
        distinguishing_aspect: "POST /reservations with all required fields -> 201, trip_status=DRAFT, settlement_status=UNBILLED, fulfillment_mode=IN_HOUSE, version=1."
        test_recipe:
          setup: ["Account + SEDAN class exist."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-01T12:00:00Z", planned_drop_at: "2026-08-01T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Reservation.${res}.trip_status == DRAFT"
            - "Reservation.${res}.settlement_status == UNBILLED"
            - "Reservation.${res}.fulfillment_mode == IN_HOUSE"
            - "Reservation.${res}.version == 1"

      - name: entity_get_reservation_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Reservation, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /reservations/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-000000000abc"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: entity_create_reservation_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Reservation, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /reservations omitting required trip_type -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Account + SEDAN class exist."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", vehicle_class_id: "${sedan}", pickup_at: "2026-08-02T12:00:00Z", planned_drop_at: "2026-08-02T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: entity_create_account_default_gratuity_applied
        claim_type: Defaults
        grounds: [entities.CorporateAccount.fields.default_gratuity_pct, entities.CorporateAccount.fields.cancellation_grace_minutes]
        distinguishing_aspect: "POST /corporate-accounts omitting default_gratuity_pct/cancellation_grace_minutes -> defaults 20 and 120 applied."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id, g: $.data.default_gratuity_pct, c: $.data.cancellation_grace_minutes }
          assert:
            - "CorporateAccount.${acct}.default_gratuity_pct == 20"
            - "CorporateAccount.${acct}.cancellation_grace_minutes == 120"
            - "CorporateAccount.${acct}.status == ACTIVE"

      - name: entity_account_range_discount_out_of_range_returns_422
        claim_type: Type Constraints
        grounds: [entities.CorporateAccount.fields.negotiated_discount_pct, "errors[ERR_VALIDATION_RANGE]"]
        distinguishing_aspect: "POST /corporate-accounts with negotiated_discount_pct 55 (>40) -> ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 55 }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_RANGE"

      - name: entity_vehicle_duplicate_plate_returns_409
        claim_type: Type Constraints
        grounds: [entities.Vehicle.fields.plate, "errors[ERR_DUPLICATE_PLATE]"]
        distinguishing_aspect: "POST /vehicles with a plate already in use -> ERR_DUPLICATE_PLATE (409)."
        test_recipe:
          setup: ["SEDAN class with one vehicle plate BLK-DUP."]
          setup_api_calls:
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-DUP" }
              as: DispatchAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-DUP" }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_PLATE"

      - name: entity_vehicleclass_duplicate_code_returns_409
        claim_type: Type Constraints
        grounds: [entities.VehicleClass.fields.code, "errors[ERR_DUPLICATE_CLASS_CODE]"]
        distinguishing_aspect: "POST /vehicle-classes with code SEDAN already used -> ERR_DUPLICATE_CLASS_CODE (409)."
        test_recipe:
          setup: ["One SEDAN class exists."]
          setup_api_calls:
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
          trigger:
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 6000, per_mile_cents: 260, hourly_rate_cents: 13000, wait_per_minute_cents: 210 }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_CLASS_CODE"

      - name: entity_vehicle_create_bad_class_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Vehicle.fields.vehicle_class_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /vehicles referencing a non-existent vehicle_class_id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "00000000-0000-4000-8000-0000000000fe", plate: "BLK-Z" }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: entity_computed_outstanding_balance_after_invoice
        claim_type: Computed Fields
        grounds: [entities.CorporateAccount.fields.outstanding_balance_cents, calculations.final_settlement]
        distinguishing_aspect: "After invoicing one completed reservation (final_total 9098, no wait), CorporateAccount.outstanding_balance_cents == 9098."
        test_recipe:
          setup: ["Completed reservation final_total 9098 (discount 10, gratuity 20, tolls 350, 0 wait), invoiced."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DispatchAdmin
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 10, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO" }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-B1" }
              as: DispatchAdmin
              captures: { veh: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-03T12:00:00Z", planned_drop_at: "2026-08-03T13:00:00Z", estimated_miles: 12.4, tolls_cents: 350 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${rv}" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "DISPATCH" }
              as: Dispatcher
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "CHAUFFEUR_ARRIVED", occurred_at: "2026-08-03T12:05:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "PASSENGER_BOARDED", occurred_at: "2026-08-03T12:10:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "COMPLETE" }
              as: Chauffeur
              as_user_id: "${drv}"
          trigger:
            - call: "POST /reservations/${res}/billing-events"
              payload: { action: "INVOICE" }
              as: Dispatcher
            - call: "GET /corporate-accounts/${acct}"
              as: Dispatcher
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "Reservation.${res}.final_total_cents == 9098"
            - "CorporateAccount.${acct}.outstanding_balance_cents == 9098"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_cancel_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.QUOTED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED reservation -> ERR_INVALID_STATE (409); no second CancellationRecord, fee unchanged."
        test_recipe:
          setup: ["QUOTED reservation cancelled once (now CANCELLED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: DispatchAdmin
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", cancellation_grace_minutes: 120 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-04T20:00:00Z", planned_drop_at: "2026-08-04T21:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CANCEL" }
              as: Dispatcher
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CANCEL" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Reservation.${res}.trip_status == CANCELLED"

      - name: sm_complete_from_confirmed_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.PASSENGER_ABOARD_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETE from CONFIRMED (skipping ASSIGNED/EN_ROUTE/boarding) -> ERR_INVALID_STATE; final_total_cents not stamped."
        test_recipe:
          setup: ["CONFIRMED reservation (never dispatched/boarded)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-05T12:00:00Z", planned_drop_at: "2026-08-05T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "COMPLETE" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: sm_settle_unbilled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation.INVOICED_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SETTLE on a reservation whose settlement_status is UNBILLED (not INVOICED) -> ERR_INVALID_STATE; settlement dimension is independent of trip_status."
        test_recipe:
          setup: ["DRAFT reservation, settlement UNBILLED."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-06T12:00:00Z", planned_drop_at: "2026-08-06T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/billing-events"
              payload: { action: "SETTLE" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: sm_parallel_dimensions_complete_then_invoice_independent
        claim_type: parallel
        grounds: [state_machines.Reservation.PASSENGER_ABOARD_to_COMPLETED, state_machines.Reservation.UNBILLED_to_INVOICED, entities.Reservation.fields.trip_status, entities.Reservation.fields.settlement_status]
        distinguishing_aspect: "Parallel dimensions: a COMPLETED reservation keeps trip_status==COMPLETED while settlement_status independently advances UNBILLED->INVOICED on billing-events; the two axes evolve independently on the same row."
        test_recipe:
          setup: ["Completed reservation (in-house, 0 wait)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: DispatchAdmin
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 0, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO" }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-B2" }
              as: DispatchAdmin
              captures: { veh: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-07T12:00:00Z", planned_drop_at: "2026-08-07T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${rv}" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "DISPATCH" }
              as: Dispatcher
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "CHAUFFEUR_ARRIVED", occurred_at: "2026-08-07T12:05:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "PASSENGER_BOARDED", occurred_at: "2026-08-07T12:10:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "COMPLETE" }
              as: Chauffeur
              as_user_id: "${drv}"
          trigger:
            - call: "POST /reservations/${res}/billing-events"
              payload: { action: "INVOICE" }
              as: Dispatcher
              captures: { st: $.data.settlement_status, tr: $.data.trip_status }
          assert:
            - "Reservation.${res}.trip_status == COMPLETED"
            - "Reservation.${res}.settlement_status == INVOICED"

      - name: sm_farmout_reject_keeps_reservation_in_house
        claim_type: Valid Transition
        grounds: [state_machines.FarmOutOrder.OFFERED_to_REJECTED, entities.Reservation.fields.fulfillment_mode]
        distinguishing_aspect: "REJECT a farm-out -> FarmOutOrder REJECTED, reservation stays CONFIRMED & IN_HOUSE, Affiliate.open_farmouts recomputed to 0."
        test_recipe:
          setup: ["OFFERED farm-out on a CONFIRMED reservation."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Bay Black Car", market_code: "SFO", payout_share_pct: 70 }
              as: DispatchAdmin
              captures: { aff: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-08-08T12:00:00Z", planned_drop_at: "2026-08-08T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /farm-out-orders"
              payload: { reservation_id: "${res}", affiliate_id: "${aff}", expected_reservation_version: "${rv}" }
              as: Dispatcher
              captures: { fo: $.data.id }
          trigger:
            - call: "POST /farm-out-orders/${fo}/decision-events"
              payload: { action: "REJECT", decline_reason: "no driver" }
              as: AffiliatePartner
              as_user_id: "${aff}"
          assert:
            - "FarmOutOrder.${fo}.status == REJECTED"
            - "Reservation.${res}.trip_status == CONFIRMED"
            - "Reservation.${res}.fulfillment_mode == IN_HOUSE"

      - name: sm_chauffeur_suspend_then_assign_excluded
        claim_type: guarded transitions
        grounds: [state_machines.Reservation.CONFIRMED_to_ASSIGNED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_assignment_requires_chauffeur_not_suspended
          rationale: "Assignment-gated-by-suspended-chauffeur is asserted as the failure path of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: calc_flight_delay_window_shift_on_assigned_reservation
        claim_type: Correct Result
        grounds: [calculations.flight_delay_propagation, state_machines.FlightTracking.ON_TIME_to_DELAYED, entities.Assignment.fields.window_start_at, entities.Assignment.fields.window_end_at]
        distinguishing_aspect: "AIRPORT reservation ASSIGNED (assignment window [15:30,16:30)); a 40-min delay update (>15 threshold) flips DELAYED and shifts the ACTIVE Assignment window to [16:10,17:10)."
        test_recipe:
          setup: ["AIRPORT reservation assigned in-house; flight scheduled 15:00, assignment window [15:30,16:30)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
