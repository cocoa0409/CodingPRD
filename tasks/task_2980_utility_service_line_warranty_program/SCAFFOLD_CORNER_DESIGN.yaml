          - state_machines.MarketingCampaign
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: "MAX_CAMPAIGN_REVISIONS is 2 and revision_count only advances on a resubmission from REJECTED, so the first submission is free: rejections 1 and 2 may be reworked and the third resubmission is refused with the campaign left in REJECTED."
        test_recipe:
