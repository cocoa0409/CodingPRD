          Shared-operation claim: the production read is the one endpoint every one of the
          six roles may call, and each of them sees the identical rollup payload — including
          the Applicant role, whose access to this endpoint is NOT narrowed to rows it owns
          the way GET /casting/applicants/{id} is. A build that applied the priority-4
          ownership filter uniformly to all Applicant reads would 403 the last call here.
