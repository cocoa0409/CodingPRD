        grounds:
          - state_machines.AnesthesiaPermit.ACTIVE_to_PROBATION
          - state_machines.AnesthesiaPermit.PROBATION_to_ACTIVE
          - calculations.inspection_score
          - entities.AnesthesiaPermit.fields.probation_count
          - entities.AnesthesiaPermit.fields.remediation_deadline_at
        distinguishing_aspect: |
          Entity AnesthesiaPermit, shape cyclic: the permit walks ACTIVE -> PROBATION -> ACTIVE, and
          the return edge is NOT a reset. probation_count keeps climbing, issued_at and expires_at
          are untouched by the loop, and the backward edge is guarded by a window
          (remediation_deadline_at) plus a live drill recomputation, so the same state is reachable
          twice with different surrounding field values.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice, two staff members (drills need at least two participants)"
            - "MODERATE_SEDATION permit with all four required drill types logged inside the 365-day window, none with a deficiency"
            - "first inspection scheduled then scored 0/0/0 -> score 100 -> PASSED -> permit ACTIVE, privilege PERMITTED"
