          The settlement endpoint's three actions have different preconditions: CANCEL is refused with
          409 ERR_WAIVER_NOT_ALLOWED once the manuscript's ProductionJob has left clearance_stage
          LICENSE_PENDING, even though the target invoice itself is a perfectly ordinary ISSUED row, so
          the journal keeps the 180000 receivable from the second invoice.
