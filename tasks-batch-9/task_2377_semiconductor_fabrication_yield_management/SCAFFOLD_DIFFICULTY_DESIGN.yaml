  # =====================================================================
  # R2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recipe_change_risk_saturates_on_both_continuous_terms
        grounds:
          - calculations.recipe_change_risk_score
          - entities.RecipeChangeRequest.fields.risk_score
          - entities.RecipeChangeRequest.fields.requires_full_requal
          - entities.RecipeChangeRequest.fields.impact_lot_count
        distinguishing_aspect: |
          Mode (a) — three inputs interacting non-additively: a discrete CLASS_WEIGHT, a
          delta term clamped at DELTA_NORM 0.10 and an impact term clamped at IMPACT_NORM 20.
          A MINOR change with a 40% target move and a MINOR change with an 80% target move both
          score exactly 35.00 because the delta term saturates, while a CRITICAL change with a
          0.5% move scores 61.25 — so the ranking is not a monotone function of the delta alone.
        test_recipe:
          setup:
            - "Recipe ETCH-100 exists with target_value 100.00, status QUALIFIED, revision 1."
            - "No lots exist at all, so impact_lot_count is 0 for every change notice scored here."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
          trigger:
            - call: "POST /fab/recipes/${r_etch}/change-requests"
              payload: { change_class: "MINOR", proposed_target: 140.00, justification: "Delta term at 4x DELTA_NORM" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr_min40: $.data.id, s_min40: $.data.risk_score, q_min40: $.data.requires_full_requal, i_min40: $.data.impact_lot_count }
            - call: "POST /fab/recipes/${r_etch}/change-requests"
              payload: { change_class: "MINOR", proposed_target: 180.00, justification: "Delta term at 8x DELTA_NORM" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr_min80: $.data.id, s_min80: $.data.risk_score, q_min80: $.data.requires_full_requal }
            - call: "POST /fab/recipes/${r_etch}/change-requests"
              payload: { change_class: "CRITICAL", proposed_target: 100.50, justification: "Half-percent move on a critical parameter" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr_crit05: $.data.id, s_crit05: $.data.risk_score, q_crit05: $.data.requires_full_requal }
            - call: "POST /fab/recipes/${r_etch}/change-requests"
              payload: { change_class: "CRITICAL", proposed_target: 104.00, justification: "Four-percent move on a critical parameter" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr_crit4: $.data.id, s_crit4: $.data.risk_score, q_crit4: $.data.requires_full_requal }
          assert:
            - "${i_min40} == 0"
            - "${s_min40} == 35.00"
            - "${s_min80} == 35.00"
            - "${s_min40} == ${s_min80}"
            - "${q_min40} == false"
            - "${q_min80} == false"
            - "${s_crit05} == 61.25"
            - "${q_crit05} == false"
            - "${s_crit4} == 70.00"
            - "${q_crit4} == true"
            - "${s_crit05} > ${s_min80}"
            - "RecipeChangeRequest.${cr_crit4}.status == SUBMITTED"
            - "RecipeChangeRequest.${cr_crit4}.revision_round == 0"
            - "RecipeChangeRequest.${cr_crit4}.author_user_id == u_pe_1"
            - "Recipe.${r_etch}.status == QUALIFIED"

      - name: capacity_commitment_tier_pinned_to_pre_surcharge_utilisation
        grounds:
          - calculations.wafer_start_capacity_commitment
          - entities.WaferStartPlan.fields.commitment_tier
          - entities.WaferStartPlan.fields.surcharge_hours
          - entities.WaferStartPlan.fields.committed_hours
          - state_machines.WaferStartPlan.DRAFT_to_COMMITTED
        distinguishing_aspect: |
          Mode (b) — pinned evaluation order resolving an apparent circularity, a different mode
          from the saturating-weights instance: the tier is chosen from pre_utilization 0.8680
          (TIER_2, 12%) and the 52.08 h surcharge never re-tiers the plan, so committed_hours is
          486.08 and the commit is accepted; re-tiering off the post-surcharge ratio 0.9722 would
          have produced TIER_3, a 108.50 h surcharge, committed_hours 542.50 and a rejection.
        test_recipe:
          setup:
            - "FLOW-B (LOGIC_N7) RELEASED with three steps of 2.0 h, 3.0 h and 2.0 h, so total_standard_hours is pinned at 7.0 and step_count at 3."
            - "Plan PLAN-B is DRAFT with planned_wafer_starts 62 and capacity_budget_hours 500.0."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
