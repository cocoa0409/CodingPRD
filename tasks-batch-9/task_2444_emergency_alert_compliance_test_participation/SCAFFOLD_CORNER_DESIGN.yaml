              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${tev1}", attestation_note: "blind amendment from a stale read" }
              captures: { e_stale_test: "$.data.error_id" }
            - call: "GET /filing-records/${filing1}"
