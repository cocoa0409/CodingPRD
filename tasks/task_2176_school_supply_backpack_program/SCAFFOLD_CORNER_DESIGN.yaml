        excluded_because:
          difficulty_instance: volunteer_sessions_collide_under_buffered_half_open_intervals
          rationale: "Asserted as the rejection half of the named buffered-interval instance."

      - name: error_school_partnership_inactive_on_teacher_approval
        claim_type: Violation -> Error
        grounds: ["errors[ERR_SCHOOL_PARTNERSHIP_INACTIVE]"]
        excluded_because:
          difficulty_instance: school_partnership_referential_beats_supplemental_cap
          rationale: "Asserted as the winning error of the named priority-conflict instance."

      - name: error_supplemental_cap_exceeded_on_second_approval
        claim_type: Violation -> Error
        grounds: ["errors[ERR_SUPPLEMENTAL_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: supplemental_cap_equality_passes_then_one_more_pack_is_rejected
          rationale: "Asserted as the failing half of the named boundary instance."

      - name: error_cycle_phase_invalid_on_donation_intake
        claim_type: Violation -> Error
        grounds: ["errors[ERR_CYCLE_PHASE_INVALID]"]
        excluded_because:
          difficulty_instance: donation_intake_requires_collecting_drive_cycle
          rationale: "Asserted as the failure path of the named cross-entity instance."

      - name: error_insufficient_inventory_on_teacher_fulfilment
        claim_type: Violation -> Error
        grounds: ["errors[ERR_INSUFFICIENT_INVENTORY]"]
        excluded_because:
          difficulty_instance: teacher_request_fulfilment_requires_covering_inventory_position
          rationale: "Asserted as the failure path of the named cross-entity instance."

      - name: error_school_throughput_exceeded_on_overlapping_events
        claim_type: Violation -> Error
        grounds: ["errors[ERR_SCHOOL_THROUGHPUT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: distribution_events_overlap_on_closed_intervals_with_aggregate_seat_ceiling
          rationale: "Asserted as the rejection half of the named aggregate-capacity instance."

      - name: error_stale_event_version_is_covered_by_occ_corner
        claim_type: Violation -> Error
        grounds: ["errors[ERR_STALE_EVENT_VERSION]"]
        excluded_because:
          difficulty_instance: fill_projection_provisional_vs_final_diverge_on_distribution_event
          rationale: "The OCC field is exercised on every registration transition of that instance; the stale-version rejection itself is covered by the dedicated §1.9 optimistic-concurrency instance."

  - section: rbac
    instances:

      - name: request_without_identity_headers_is_unauthenticated
        claim_type: Role cannot perform
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "The trigger is sent with NO X-User-Role and NO X-User-ID header, so it returns 401 ERR_UNAUTHENTICATED before any authorization or shape check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with both identity headers omitted"
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: site_coordinator_cannot_register_a_school
        claim_type: Role cannot perform
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles"]
        distinguishing_aspect: "POST /schools lists only ProgramDirector, so a SiteCoordinator receives 403 ERR_UNAUTHORIZED and no school is created."
        test_recipe:
          setup: ["A COLLECTING cycle with one site exists so the coordinator has a real identity."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /collection-sites"
              payload: { drive_cycle_id: "${cycle_id}", name: "Northside Depot", site_type: "RETAIL", bin_capacity: 10 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: school_liaison_cannot_open_a_needs_list_for_another_school
        claim_type: Role cannot perform
        grounds: ["validations[priority=6]", "errors[ERR_SCHOOL_SCOPE_VIOLATION]", "roles"]
        distinguishing_aspect: "A SchoolLiaison whose X-User-ID is school A creating a spec for school B returns 403 ERR_SCHOOL_SCOPE_VIOLATION; school B keeps zero specs."
        test_recipe:
          setup: ["Two schools, Lincoln and Garfield, are both ACTIVE."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { s1_id: $.data.id }
            - call: "PATCH /schools/${s1_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${s1_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /schools"
              payload: { name: "Garfield Middle", district_code: "D7", title_i_pct: 0.60, enrollment_count: 500, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { s2_id: $.data.id }
            - call: "PATCH /schools/${s2_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${s2_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /grade-kit-specs"
              payload: { school_id: "${s2_id}", grade_band: "K_2", student_target_count: 80 }
              as: SchoolLiaison
              as_user_id: "${s1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_SCHOOL_SCOPE_VIOLATION"
            - "GET /schools/${s2_id}/grade-kit-specs returns an empty array"

      - name: site_coordinator_cannot_book_donations_at_another_site
        claim_type: Role cannot perform
        grounds: ["validations[priority=7]", "errors[ERR_SITE_SCOPE_VIOLATION]", "roles"]
        distinguishing_aspect: "A SiteCoordinator whose X-User-ID is site A creating a batch at site B returns 403 ERR_SITE_SCOPE_VIOLATION; site B keeps zero batches."
        test_recipe:
          setup: ["Cycle COLLECTING with two ACTIVE sites and one catalog item."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { drive_cycle_id: "${cycle_id}", name: "Northside Depot", site_type: "RETAIL", bin_capacity: 10 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { site1_id: $.data.id }
            - call: "PATCH /collection-sites/${site1_id}/operational-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /collection-sites"
              payload: { drive_cycle_id: "${cycle_id}", name: "Civic Center", site_type: "LIBRARY", bin_capacity: 8 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { site2_id: $.data.id }
            - call: "PATCH /collection-sites/${site2_id}/operational-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /donation-batches"
              payload: { collection_site_id: "${site2_id}", supply_item_id: "${pencil_id}", qty_declared: 10, condition: "NEW", sealed: true }
              as: SiteCoordinator
              as_user_id: "${site1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_SITE_SCOPE_VIOLATION"
            - "GET /donation-batches with collection_site_id=${site2_id} returns an empty array"

      - name: purchase_order_submitter_cannot_approve_their_own_order
        claim_type: Segregation of duties
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.PurchaseOrder.fields.submitted_by_user_id"]
        distinguishing_aspect: "The ProgramDirector pd-1 who submitted the order is refused at APPROVED with 403 ERR_SEGREGATION_OF_DUTIES, while the order stays SUBMITTED and approved_by_user_id stays null."
        test_recipe:
          setup: ["COLLECTING cycle with a 20000-cent UNRESTRICTED gift and a pencil order submitted by ProgramDirector pd-1."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Acme Corp", amount_cents: 20000, restriction_type: "UNRESTRICTED" }
              as: DonorRelations
              as_user_id: "dr-1"
            - call: "POST /purchase-orders"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", requested_unit_gap: 24 }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po_id: $.data.id }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cyc_v1: $.data.version }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { target_status: "SUBMITTED", expected_drive_cycle_version: "${cyc_v1}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { submitter: $.data.submitted_by_user_id }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cyc_v2: $.data.version }
          trigger:
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { target_status: "APPROVED", expected_drive_cycle_version: "${cyc_v2}" }
