      - name: aid_min_award_floor_5000_vs_4999
        grounds:
          - calculations.aid_award_waterfall
          - calculations.aid_need_score
          - entities.TuitionAccount.fields.aid_awarded_cents
          - entities.TuitionAccount.fields.aid_denial_reason
          - entities.Season.fields.aid_committed_cents
          - entities.Season.fields.aid_available_cents
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint: whole cents against the
          MIN_AWARD_CENTS floor of 5000 on POST /seasons/{seasonId}/aid-award-run.
          The clamped grant is tested with >=, so 5000 is funded and 4999 is
          refused with BELOW_MIN_AWARD while the budget is left untouched. Both
          applicants are far below the 30000 per-member ceiling and far below the
          remaining budget, so the floor is provably the only binding constraint.
        test_recipe:
          setup:
            - "One season with aid_budget_cents 100000, so per_member_ceiling == round_half_up(100000 * 0.30) == 30000."
            - "Two seated PHILHARMONIC violinists: member 1 is BAND_A with years_in_org 2 (aid_need_score 49), member 2 is BAND_C with years_in_org 0 (aid_need_score 13), so the queue order is deterministic."
            - "Member 1 requests exactly 5000 and member 2 requests exactly 4999; both accounts are UNDER_REVIEW, reviewed by officer-review-1."
