            - "both responses carry limit, offset, total_count and has_more"

      - name: clock_endpoint_is_open_to_every_role_and_pins_created_at
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Partner.created_at
        distinguishing_aspect: "The logical clock endpoint accepts all four roles and needs no auth check, and every subsequently written created_at equals the instant it was set to - the server never reads wall-clock time."
        test_recipe:
          setup:
            - "A fresh server whose logical clock still holds the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: Partner
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_ck_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00.000Z" }
              as: DirectSalesRep
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_ck_id: $.data.id }
          assert:
            - "Partner.${p_ck_id}.created_at == 2026-03-01T00:00:00.000Z and updated_at == 2026-03-01T00:00:00.000Z"
            - "Account.${acc_ck_id}.created_at == 2027-01-01T00:00:00.000Z"
            - "both clock calls succeed (200/204) even though one was made as Partner and one as DirectSalesRep"
            - "Partner.${p_ck_id}.created_at is unchanged by the clock jump"

      - name: allocation_bucket_read_matches_the_settlement_arithmetic
        claim_type: computed_read
        grounds:
          - endpoints[GET /mdf-allocations/{id}]
          - calculations.mdf_fund_conservation
        excluded_because:
          difficulty_instance: non_linear_state_machine / mdf_claim_settlement_dimension_advances_independently_of_validation
          rationale: "That instance reads the allocation after every settlement hop and asserts all four buckets plus available_cents."

      - name: registration_submit_action_endpoint_enforces_its_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /deal-registrations/{id}/submit]
        excluded_because:
          difficulty_instance: boundary_precision_check / exclusivity_window_end_instant_is_exclusive_on_submit
          rationale: "That instance drives the submit endpoint on both sides of the window boundary and asserts the refusal and the success."

      - name: registration_decision_action_endpoint_applies_every_side_effect
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /deal-registrations/{id}/decision]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_registration_approval_to_partner_probation_depth_four
          rationale: "That instance asserts all four cascade hops of the decision endpoint, including the account, the rival registration, the case and the partner standing."

      - name: conflict_resolve_action_endpoint_locks_the_account_out
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /conflict-cases/{id}/resolve]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / registration_submit_depends_on_account_direct_locked_state
          rationale: "That instance resolves a case DIRECT and asserts the account lockdown and the incumbent rejection that follow."

      - name: allocation_close_action_endpoint_parks_the_remainder
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mdf-allocations/{id}/close]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mdf_claim_create_depends_on_allocation_closed_state
          rationale: "That instance closes the allocation and asserts the CASCADE C bucket moves before proving the closed allocation refuses new claims."

      - name: review_remediation_action_endpoint_is_deadline_bound
        claim_type: conditional_action
        grounds:
          - endpoints[POST /performance-reviews/{id}/remediate]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / audit_remediation_overdue_outranks_mdf_insufficiency_on_claim_create
          rationale: "That instance builds the overdue FINDINGS_OPEN review the remediation deadline governs and asserts the freeze it imposes."

      - name: proof_verification_action_endpoint_gates_claim_validation
        claim_type: conditional_action
        grounds:
          - endpoints[POST /mdf-claims/{id}/proofs/{proof_id}/verify]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_verified_proofs_blocks_claim_validation
          rationale: "That instance validates with zero verified proofs, then verifies one and validates successfully, covering both sides of the gate."

  # =========================================================================
  # Table 6 - Errors (every catalogued error_id must be reachable)
  # Triggered elsewhere in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml:
  #   ERR_UNAUTHORIZED, ERR_ACCOUNT_NOT_FOUND, ERR_PARTNER_NOT_FOUND,
  #   ERR_INVALID_REQUEST, ERR_PARTNER_TYPE_NOT_ELIGIBLE, ERR_DUPLICATE_REGISTRATION,
  #   ERR_CERTIFICATION_REQUIREMENT_NOT_MET, ERR_MAPPING_WINDOW_CONFLICT,
  #   ERR_EXCLUSIVITY_WINDOW_EXPIRED, ERR_CREDIT_EXCEEDS_INVOICE,
  #   ERR_CONFLICT_ESCALATION_LIMIT, ERR_MDF_ALLOCATION_INSUFFICIENT,
  #   ERR_INVALID_STATE_TRANSITION, ERR_STALE_REGISTRATION_VERSION,
  #   ERR_STALE_ACCOUNT_VERSION, ERR_SOD_SAME_ACTOR.
  # =========================================================================
  - section: errors
    instances:
      - name: request_with_missing_x_user_id_header_returns_4xx
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: "The auth check at priority 1 fires before everything else: a GET /partners with the X-User-ID header omitted returns ERR_UNAUTHENTICATED 401 even though the role header is a valid role and the endpoint would otherwise succeed."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one partner exists so the endpoint would return data if the request were authenticated."
            - "The trigger request is sent with X-User-Role: ChannelOpsAnalyst and NO X-User-ID header at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_un_id: $.data.id }
          trigger:
            - call: "GET /partners"
              payload: {}
              as: ChannelOpsAnalyst
          assert:
            - "the response error_id == ERR_UNAUTHENTICATED with http_status 401"
            - "response_type == error and data holds only error_id and message - no partner rows leak"
            - "the same GET sent with both headers present returns total_count == 1 containing ${p_un_id}"

      - name: not_found_envelope_shape_on_an_unknown_partner
        claim_type: envelope_shape
        grounds:
          - errors[ERR_PARTNER_NOT_FOUND]
          - response_envelope.error
          - validations[priority=3]
        distinguishing_aspect: "The error envelope is uniform: meta.api_request_id plus meta.api_request_timestamp, response_type 'error', and data carrying exactly error_id and message - the http status lives in the transport, not in the body."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; no partner with the fabricated id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "GET /partners/ptr_00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "http_status == 404 and data.error_id == ERR_PARTNER_NOT_FOUND"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty"
            - "response_type == error and data.message is a non-empty human-readable string"

      - name: claim_settlement_before_validation_and_repeat_proof_verification_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=12]
          - validations[priority=43]
          - errors[ERR_CLAIM_NOT_VALIDATED]
          - errors[ERR_PROOF_ALREADY_VERIFIED]
          - calculations.marketing_attainment
        distinguishing_aspect: "Two guards on the same claim: a settlement action on a SUBMITTED claim yields ERR_CLAIM_NOT_VALIDATED 409, and re-verifying an already verified proof yields ERR_PROOF_ALREADY_VERIFIED 409 so its spend can never be counted twice."
        test_recipe:
          setup:
            - "The GOLD chain: DISTRIBUTOR partner with marketing_commitment_cents 0, three TECH_EXPERT certifications, one STOCKING order of list 10,000,000 invoiced at 2026-01-05 (invoice 8,650,000), one clean review approved by u_dir_1 -> tier GOLD."
            - "Clock 2026-02-10T00:00:00.000Z, allocation over [2026-02-01T00:00:00.000Z, 2026-06-30T23:59:59.999Z] with allocated_cents 273,000."
            - "One EVENT claim of 20,000 cents with one proof of 12,000 cents; the claim's validation_state is still SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_er_id: $.data.id }
            - call: "POST /partners/${p_er_id}/certifications"
              payload: { engineer_name: "Ada Lin", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p_er_id}/certifications"
              payload: { engineer_name: "Bo Reyes", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p_er_id}/certifications"
              payload: { engineer_name: "Cy Duarte", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_er_id}", order_type: "STOCKING", list_amount_cents: 10000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_er_id: $.data.id }
            - call: "POST /order-invoices/${inv_er_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p_er_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_er_id: $.data.id }
            - call: "POST /performance-reviews/${rev_er_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /mdf-allocations"
              payload: { partner_id: "${p_er_id}", period_start: "2026-02-01T00:00:00.000Z", period_end: "2026-06-30T23:59:59.999Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { alloc_er_id: $.data.id }
            - call: "POST /mdf-claims"
              payload: { allocation_id: "${alloc_er_id}", activity_type: "EVENT", requested_cents: 20000 }
              as: Partner
              as_user_id: "${p_er_id}"
              captures: { claim_er_id: $.data.id }
            - call: "POST /mdf-claims/${claim_er_id}/proofs"
              payload: { doc_type: "ATTENDEE_LIST", spend_amount_cents: 12000, audience_reach: 140 }
              as: Partner
              as_user_id: "${p_er_id}"
              captures: { proof_er_id: $.data.id }
          trigger:
            - call: "POST /mdf-claims/${claim_er_id}/settlement"
              payload: { action: "APPROVE_PAYMENT" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /mdf-claims/${claim_er_id}/proofs/${proof_er_id}/verify"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /mdf-claims/${claim_er_id}/proofs/${proof_er_id}/verify"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "MdfAllocation.${alloc_er_id}.allocated_cents == 273000 and available_cents == 273000"
            - "the settlement call returns error_id == ERR_CLAIM_NOT_VALIDATED with http_status 409 and MdfClaim.${claim_er_id}.settlement_state stays UNPAID"
            - "the first verify succeeds with ProofOfPerformance.${proof_er_id}.verified == true and verified_by_user_id == u_ops_1"
            - "the second verify returns error_id == ERR_PROOF_ALREADY_VERIFIED with http_status 409"
            - "Partner.${p_er_id}.marketing_qualified_spend_cents == 0 (the proof's claim is not VALIDATED, so no spend is counted, let alone counted twice)"
            - "MdfClaim.${claim_er_id}.validation_state == SUBMITTED and approved_cents == 0"

