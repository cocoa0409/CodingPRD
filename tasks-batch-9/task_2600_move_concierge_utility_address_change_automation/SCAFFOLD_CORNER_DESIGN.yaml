        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /moves/{id}/consent-evaluations]"
          - state_machines.ConsentRecord.GRANTED_to_EXPIRED
          - entities.ConsentRecord.fields.expires_at
          - state_machines.UtilityOrder.OPEN_PROVISION_to_SUSPENDED
