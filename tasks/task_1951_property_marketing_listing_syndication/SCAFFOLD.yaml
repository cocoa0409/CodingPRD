scenario: |
  1951. Property Marketing & Listing Syndication (brokerage marketing department): listing data entry with required fields & compliance rules, photo/video/floor plan asset management, syndication feed to portals & error handling, listing status change propagation & delay monitoring, showing feedback aggregation, price change & marketing remarks history, fair housing language review, expired/withdrawn handling & relisting rules

domain_name: property-marketing-listing-syndication
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers: [optimistic_concurrency, cascading_side_effects, derived_field_reconciliation, scheduled_actions]
  entity_topology: flat
  state_machine_shape: parallel   # Listing runs lifecycle_status x syndication_posture; SyndicationJob and FeedSubscription are cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Agent full name" }
      - { name: license_number, type: string, source: input, description: "License number; unique across all agents (ERR_DUPLICATE_LICENSE)" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; owning listing agent" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: postal_code, type: string, source: input, description: "Postal code" }
      - { name: property_type, type: enum, source: input, description: "SINGLE_FAMILY | CONDO | TOWNHOUSE | MULTI_FAMILY | LAND" }
      - { name: list_price_cents, type: integer, source: input, description: "Current list price in cents; changed only via POST /listings/{id}/price-changes or relist" }
      - { name: listing_expires_on, type: datetime, source: input, description: "Listing agreement expiry instant; sweep expires ACTIVE listings at/after this time" }
      - { name: bedrooms, type: integer, source: input, description: "Bedroom count; optional at creation, required before submit-review" }
      - { name: bathrooms, type: number, source: input, description: "Bathroom count; optional at creation, required before submit-review" }
      - { name: square_feet, type: integer, source: input, description: "Living area; optional at creation, required before submit-review" }
      - { name: marketing_remarks, type: string, source: input, description: "Public marketing remarks; scanned against fair-housing phrase list; optional at creation, required before submit-review" }
      - { name: mls_number, type: string, source: input, description: "MLS number; optional at creation, required before submit-review" }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | COMPLIANCE_HOLD | ACTIVE | UNDER_CONTRACT | SOLD | WITHDRAWN | EXPIRED" }
      - { name: syndication_posture, type: enum, source: computed, description: "Derived at read time, never stored, never bumps version: NOT_SYNDICATED | SYNDICATING | SYNDICATED | DEGRADED | SUSPENDED" }
      - { name: relist_count, type: integer, source: system, default: 0, description: "Number of successful relists" }
      - { name: terminal_entered_at, type: datetime, source: system, description: "Instant the listing entered WITHDRAWN/EXPIRED (null until then); cooldown anchor" }
      - { name: terminal_price_cents, type: integer, source: system, description: "list_price_cents frozen at WITHDRAWN/EXPIRED entry; relist discount baseline" }
      - { name: feedback_score_raw, type: number, source: computed, description: "Simple mean of INCLUDED ShowingFeedback.rating; null when none; 3 decimals round_half_up" }
      - { name: feedback_score_weighted, type: number, source: computed, description: "Decay-weighted mean per showing_feedback_scores; null when none; 3 decimals round_half_up" }
      - { name: audited_breach_count, type: integer, source: computed, description: "Count of terminal jobs (ACKED with propagation_delay_seconds > sla_seconds, or DEAD_LETTER) across all subscriptions of this listing" }
      - { name: provisional_breach_count, type: integer, source: computed, description: "audited_breach_count + DISPATCHED jobs where (now - dispatched_at) > portal sla_seconds" }

  - name: MediaAsset
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; from path" }
      - { name: kind, type: enum, source: input, description: "PHOTO | VIDEO | FLOOR_PLAN" }
      - { name: file_url, type: string, source: input, description: "Stored file URL" }
      - { name: file_bytes, type: integer, source: input, description: "File size in bytes; must be > 0" }
      - { name: width_px, type: integer, source: input, description: "Pixel width; required for PHOTO before mark-ready" }
      - { name: height_px, type: integer, source: input, description: "Pixel height; required for PHOTO before mark-ready" }
      - { name: is_primary, type: boolean, source: system, default: false, description: "Exactly one READY PHOTO per listing is primary; auto-assigned and swapped atomically by set-primary/archive" }
      - { name: status, type: enum, source: system, description: "UPLOADED | READY | REJECTED | ARCHIVED" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; from path of submit-review" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: remarks_snapshot, type: string, source: system, description: "marketing_remarks captured at submit time" }
      - { name: flagged_terms, type: array, source: system, description: "Fair-housing phrases found by reviewer; set on REJECTED decision" }
      - { name: notes, type: string, source: system, description: "Reviewer notes from decision payload" }
      - { name: decided_at, type: datetime, source: system, description: "Decision instant (logical clock); null while PENDING" }

  - name: PortalAccount
    parent: null
    common_fields: true
    fields:
      - { name: portal_name, type: string, source: input, description: "Portal display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: sla_seconds, type: integer, source: input, default: 3600, description: "Propagation SLA; breach when delay strictly greater" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Portal-specific price discount fraction, e.g. 0.037" }
      - { name: rounding_increment_cents, type: integer, source: input, default: 100000, description: "Display price increment; must be one of 10000 | 50000 | 100000 | 1000000" }

  - name: BlackoutWindow
    parent: null
    common_fields: false
    fields:
      - { name: portal_account_id, type: string, source: system, description: "FK -> PortalAccount.id; from path" }
      - { name: starts_at, type: datetime, source: input, description: "Blackout start (closed interval)" }
      - { name: ends_at, type: datetime, source: input, description: "Blackout end (closed interval); must be > starts_at" }
      - { name: reason, type: string, source: input, description: "Operator note" }

  - name: FeedSubscription
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; from path" }
      - { name: portal_account_id, type: string, source: input, description: "FK -> PortalAccount.id" }
      - { name: status, type: enum, source: system, description: "SUBSCRIBED | PAUSED | COMPLETED" }

  - name: SyndicationJob
    parent: null
    common_fields: true
    fields:
      - { name: feed_subscription_id, type: string, source: system, description: "FK -> FeedSubscription.id" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; denormalized for feed-events queries" }
      - { name: job_type, type: enum, source: system, description: "FULL_SYNC | PRICE_UPDATE | REMARKS_UPDATE | STATUS_UPDATE | MEDIA_UPDATE | TERMINAL_SYNC" }
      - { name: status, type: enum, source: system, description: "QUEUED | DISPATCHED | ACKED | FAILED | RETRY_QUEUED | SUPERSEDED | CANCELLED | DEAD_LETTER" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Increments by 1 on each dispatch" }
      - { name: scheduled_at, type: datetime, source: system, description: "Earliest dispatch instant; RETRY_QUEUED sets now + 60 * 2^attempt_count seconds" }
      - { name: dispatched_at, type: datetime, source: system, description: "Last dispatch instant (logical clock); null until first dispatch" }
      - { name: completed_at, type: datetime, source: system, description: "ACKED / DEAD_LETTER / CANCELLED / SUPERSEDED instant" }
      - { name: propagation_delay_seconds, type: integer, source: computed, description: "ACKED only: completed_at - dispatched_at in seconds" }
      - { name: payload_display_price_cents, type: integer, source: system, description: "Portal display price snapshot at job creation per portal_display_price calculation" }
      - { name: failure_code, type: string, source: system, description: "Portal-reported error code from last fail callback; null otherwise" }

  - name: ListingEvent
    parent: null
    common_fields: false
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; from path" }
      - { name: seq, type: integer, source: system, description: "Per-listing monotonic sequence starting at 1; selector order is max(seq)" }
      - { name: event_type, type: enum, source: system, description: "PRICE_CHANGE | REMARKS_UPDATE | STATUS_CHANGE" }
      - { name: old_price_cents, type: integer, source: system, description: "PRICE_CHANGE only; null otherwise" }
      - { name: new_price_cents, type: integer, source: system, description: "PRICE_CHANGE only; null otherwise" }
      - { name: old_remarks, type: string, source: system, description: "REMARKS_UPDATE only; null otherwise" }
      - { name: new_remarks, type: string, source: system, description: "REMARKS_UPDATE only; null otherwise" }
      - { name: from_lifecycle, type: string, source: system, description: "STATUS_CHANGE only; null otherwise" }
      - { name: to_lifecycle, type: string, source: system, description: "STATUS_CHANGE only; null otherwise" }

  - name: ShowingWindow
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; from path" }
      - { name: starts_at, type: datetime, source: input, description: "Window start; half-open [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end; must be > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED" }

  - name: ShowingFeedback
    parent: null
    common_fields: true
    fields:
      - { name: showing_window_id, type: string, source: system, description: "FK -> ShowingWindow.id; from path" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; denormalized from the window" }
      - { name: rating, type: integer, source: input, description: "1..5 inclusive" }
      - { name: comment, type: string, source: input, description: "Free text; optional" }
      - { name: status, type: enum, source: system, description: "INCLUDED | EXCLUDED; only INCLUDED feeds the scores" }

  - name: RelistRequest
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; from path" }
      - { name: relist_count_before, type: integer, source: system, description: "Listing.relist_count before this relist" }
      - { name: price_reduction_pct, type: number, source: system, description: "Reduction vs terminal_price_cents, 2 decimals round_half_up" }
      - { name: new_list_price_cents, type: integer, source: system, description: "Price applied by this relist (payload value or current price)" }
      - { name: fee_cents, type: integer, source: system, description: "Computed per relist_fee_calculation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: DRAFT
    terminal_states: [SOLD]
    note: "lifecycle_status dimension; syndication_posture is a separate derived dimension (see posture machine below)"
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: POST /listings/{id}/submit-review
        actor: ListingAgent | MarketingCoordinator
        preconditions:
          - "All of bedrooms, bathrooms, square_feet, marketing_remarks, mls_number non-null (ERR_LISTING_INCOMPLETE)"
          - "marketing_remarks passes fair-housing scan (ERR_FAIR_HOUSING_VIOLATION)"
          - "At least one MediaAsset kind=PHOTO in READY status (ERR_NO_READY_PHOTO)"
          - "No ComplianceReview for this listing in PENDING (ERR_REVIEW_ALREADY_PENDING)"
        side_effects:
          - "Create ComplianceReview PENDING with remarks_snapshot = current marketing_remarks"
          - "Append ListingEvent STATUS_CHANGE (DRAFT -> PENDING_REVIEW); version + 1"

      - from: PENDING_REVIEW
        to: COMPLIANCE_HOLD
        trigger: "system: POST /compliance-reviews/{id}/decision with outcome=REJECTED on the listing's latest review"
        actor: system
        preconditions: []
        side_effects:
          - "Append ListingEvent STATUS_CHANGE; version + 1"
          - "Posture recompute -> SUSPENDED (lifecycle override)"
          - "Cascade: FeedSubscriptions SUBSCRIBED -> PAUSED; their QUEUED/RETRY_QUEUED/DISPATCHED jobs -> CANCELLED"

      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: POST /listings/{id}/activate
        actor: ListingAgent | MarketingCoordinator
        preconditions:
          - "Latest ComplianceReview by created_at for this listing is APPROVED (ERR_COMPLIANCE_NOT_APPROVED)"
          - "now < listing_expires_on (ERR_INVALID_STATE)"
        side_effects:
          - "Append ListingEvent STATUS_CHANGE; version + 1"

      - from: COMPLIANCE_HOLD
        to: DRAFT
        trigger: POST /listings/{id}/revise
        actor: ListingAgent | MarketingCoordinator
        preconditions: []
        side_effects:
          - "Append ListingEvent STATUS_CHANGE; version + 1"
          - "Posture recompute (override lifted; typically NOT_SYNDICATED)"

      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: POST /listings/{id}/mark-under-contract
        actor: ListingAgent | MarketingCoordinator
        preconditions: []
        side_effects:
          - "Append ListingEvent STATUS_CHANGE; version + 1"
          - "Queue STATUS_UPDATE SyndicationJob for every FeedSubscription in SUBSCRIBED"

      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: POST /listings/{id}/reactivate
        actor: ListingAgent | MarketingCoordinator
        preconditions: []
        side_effects:
          - "Append ListingEvent STATUS_CHANGE; version + 1"
          - "Queue STATUS_UPDATE SyndicationJob for every FeedSubscription in SUBSCRIBED"

      - from: UNDER_CONTRACT
        to: SOLD
        trigger: POST /listings/{id}/close-sold
        actor: ListingAgent | MarketingCoordinator
        preconditions: []
        side_effects:
          - "Append ListingEvent STATUS_CHANGE; version + 1"
          - "Cascade: each FeedSubscription SUBSCRIBED -> PAUSED; its QUEUED/RETRY_QUEUED/DISPATCHED jobs -> CANCELLED; one TERMINAL_SYNC job QUEUED per paused subscription"
          - "SCHEDULED ShowingWindows -> CANCELLED"
          - "Posture recompute -> SUSPENDED (lifecycle override includes SOLD)"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: POST /listings/{id}/withdraw
        actor: ListingAgent | MarketingCoordinator
        preconditions: []
        side_effects:
          - "terminal_entered_at = now; terminal_price_cents = list_price_cents; append ListingEvent STATUS_CHANGE; version + 1"
          - "Cascade link 2: every FeedSubscription in SUBSCRIBED -> PAUSED (caused by lifecycle change)"
          - "Cascade link 3: because each subscription paused, its jobs in QUEUED/RETRY_QUEUED/DISPATCHED -> CANCELLED and one TERMINAL_SYNC job is QUEUED per paused subscription"
          - "Cascade: every ShowingWindow in SCHEDULED -> CANCELLED"
          - "Cascade link 4: posture recompute -> SUSPENDED (caused by links 1-3)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_sweeps/run when now >= listing_expires_on"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE and now >= listing_expires_on"
        side_effects:
          - "Same cascade as WITHDRAWN: terminal_entered_at/terminal_price_cents set, STATUS_CHANGE event, subscriptions PAUSED, live jobs CANCELLED + TERMINAL_SYNC queued, windows CANCELLED, posture SUSPENDED; version + 1"

      - from: WITHDRAWN
        to: DRAFT
        trigger: POST /listings/{id}/relist
        actor: ListingAgent | MarketingCoordinator
        preconditions:
          - "now >= terminal_entered_at + 30 days (ERR_RELIST_COOLDOWN_ACTIVE); boundary: exactly 30 days passes"
          - "marketing_remarks (or new_marketing_remarks when provided) passes fair-housing scan (ERR_FAIR_HOUSING_VIOLATION; safety checked before cooldown)"
        side_effects:
          - "Create RelistRequest with computed fee_cents; relist_count + 1"
          - "If new_list_price_cents provided: list_price_cents = new_list_price_cents and append PRICE_CHANGE event"
          - "Append ListingEvent STATUS_CHANGE; version + 1; posture recompute -> NOT_SYNDICATED"

      - from: EXPIRED
        to: DRAFT
        trigger: POST /listings/{id}/relist
        actor: ListingAgent | MarketingCoordinator
        preconditions:
          - "now >= terminal_entered_at + 30 days (ERR_RELIST_COOLDOWN_ACTIVE)"
          - "Fair-housing scan passes (ERR_FAIR_HOUSING_VIOLATION)"
        side_effects:
          - "Same as WITHDRAWN -> DRAFT relist side effects"

  - entity: ListingPosture
    note: "Derived dimension of Listing (syndication_posture), recomputed on every read and after any job/subscription/lifecycle mutation; recompute never increments Listing.version"
    initial_state: NOT_SYNDICATED
    terminal_states: []
    transitions:
      - from: ANY
        to: SUSPENDED
        trigger: "system recompute"
        actor: system
        preconditions:
          - "lifecycle_status IN {COMPLIANCE_HOLD, WITHDRAWN, EXPIRED, SOLD} (override rule; wins over every other rule)"
        side_effects: []
      - from: ANY
        to: DEGRADED
        trigger: "system recompute"
        actor: system
        preconditions:
          - "No lifecycle override AND (audited_breach_count > 0 OR any SyndicationJob of the listing is DEAD_LETTER)"
          - "Sticky: audited_breach_count never decreases, so DEGRADED persists after later clean ACKs"
        side_effects: []
      - from: ANY
        to: SYNDICATING
        trigger: "system recompute"
        actor: system
        preconditions:
          - "No override, no DEGRADED condition, and at least one job in {QUEUED, RETRY_QUEUED, DISPATCHED}"
        side_effects: []
      - from: ANY
        to: SYNDICATED
        trigger: "system recompute"
        actor: system
        preconditions:
          - "No override, no DEGRADED, no live jobs, and at least one FeedSubscription in SUBSCRIBED"
        side_effects: []
      - from: ANY
        to: NOT_SYNDICATED
        trigger: "system recompute"
        actor: system
        preconditions:
          - "None of the above (no SUBSCRIBED subscriptions and no live jobs)"
        side_effects: []

  - entity: SyndicationJob
    initial_state: QUEUED
    terminal_states: [ACKED, SUPERSEDED, CANCELLED, DEAD_LETTER]
    transitions:
      - from: QUEUED
        to: DISPATCHED
        trigger: "system: POST /_sweeps/run"
        actor: system
        preconditions:
          - "scheduled_at <= now"
          - "PortalAccount.status == ACTIVE (jobs of SUSPENDED portals stay queued)"
          - "now NOT in any buffered blackout window of the portal (buffered = [starts_at - 15min, ends_at + 15min], closed); deferred otherwise"
          - "Batch order: scheduled_at ASC, tie-break created_at ASC"
        side_effects:
          - "dispatched_at = now; attempt_count + 1"
      - from: RETRY_QUEUED
        to: DISPATCHED
        trigger: "system: POST /_sweeps/run"
        actor: system
        preconditions: ["Same as QUEUED -> DISPATCHED"]
        side_effects: ["dispatched_at = now; attempt_count + 1"]
      - from: DISPATCHED
        to: ACKED
        trigger: POST /feed-events/{id}/ack
        actor: PortalWebhook
        preconditions:
          - "status == DISPATCHED (ERR_JOB_NOT_DISPATCHED)"
        side_effects:
          - "completed_at = now; propagation_delay_seconds = now - dispatched_at"
          - "audited_breach_count recompute (delay > portal.sla_seconds counts; strictly greater)"
          - "Posture recompute on Listing"
          - "If job_type == TERMINAL_SYNC and its subscription is PAUSED on a terminal listing: subscription -> COMPLETED"
      - from: DISPATCHED
        to: FAILED
        trigger: POST /feed-events/{id}/fail
        actor: PortalWebhook
        preconditions:
          - "status == DISPATCHED (ERR_JOB_NOT_DISPATCHED)"
        side_effects:
          - "failure_code = payload error_code"
          - "If attempt_count < 3: -> RETRY_QUEUED with scheduled_at = now + 60 * 2^attempt_count seconds"
          - "If attempt_count == 3: -> DEAD_LETTER (terminal); audited_breach_count + 1; posture recompute -> DEGRADED"
      - from: FAILED
        to: RETRY_QUEUED
        trigger: "system (part of fail handling when attempt_count < 3)"
        actor: system
        preconditions: ["attempt_count < 3"]
        side_effects: ["scheduled_at = now + 60 * 2^attempt_count seconds"]
      - from: FAILED
        to: DEAD_LETTER
        trigger: "system (part of fail handling when attempt_count == 3)"
        actor: system
        preconditions: ["attempt_count == 3"]
        side_effects: ["completed_at = now; audited_breach_count + 1; posture recompute"]
      - from: QUEUED
        to: SUPERSEDED
        trigger: "system: a newer SyndicationJob of the same job_type is created for the same subscription (price/remarks/media refresh)"
        actor: system
        preconditions: []
        side_effects: ["completed_at = now"]
      - from: ANY_NON_TERMINAL
        to: CANCELLED
        trigger: "system: compliance rejection, withdraw, expire, or close-sold cascade"
        actor: system
        preconditions: []
        side_effects: ["completed_at = now"]

  - entity: FeedSubscription
    initial_state: SUBSCRIBED
    terminal_states: [COMPLETED]
    transitions:
      - from: SUBSCRIBED
        to: PAUSED
        trigger: POST /feed-subscriptions/{id}/pause OR system cascade (compliance hold / withdraw / expire / sold)
        actor: MarketingCoordinator | MarketingDirector | system
        preconditions: []
        side_effects:
          - "Cascade: live jobs of this subscription -> CANCELLED (manual pause cancels QUEUED/RETRY_QUEUED/DISPATCHED)"
      - from: PAUSED
        to: SUBSCRIBED
        trigger: POST /feed-subscriptions/{id}/resume
        actor: MarketingCoordinator | MarketingDirector
        preconditions:
          - "Listing.lifecycle_status == ACTIVE (ERR_LISTING_NOT_ACTIVE)"
          - "PortalAccount.status == ACTIVE (ERR_PORTAL_NOT_ACTIVE)"
        side_effects:
          - "Queue FULL_SYNC SyndicationJob (payload display price recomputed)"
      - from: PAUSED
        to: COMPLETED
        trigger: "system: TERMINAL_SYNC job of this subscription reaches ACKED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComplianceReview
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /compliance-reviews/{id}/decision
        actor: ComplianceOfficer
        preconditions: ["status == PENDING (ERR_REVIEW_DECIDED)"]
        side_effects: ["decided_at = now; notes/flagged_terms stored"]
      - from: PENDING
        to: REJECTED
        trigger: POST /compliance-reviews/{id}/decision
        actor: ComplianceOfficer
        preconditions: ["status == PENDING (ERR_REVIEW_DECIDED)"]
        side_effects:
          - "decided_at = now; flagged_terms stored"
          - "Cascade: Listing PENDING_REVIEW -> COMPLIANCE_HOLD; posture -> SUSPENDED; subscriptions PAUSED; live jobs CANCELLED"

  - entity: MediaAsset
    initial_state: UPLOADED
    terminal_states: [ARCHIVED, REJECTED]
    transitions:
      - from: UPLOADED
        to: READY
        trigger: POST /media-assets/{id}/mark-ready
        actor: ListingAgent | MarketingCoordinator
        preconditions:
          - "Listing.lifecycle_status IN {DRAFT, COMPLIANCE_HOLD, ACTIVE} (ERR_INVALID_STATE) and posture != SUSPENDED (ERR_POSTURE_SUSPENDED)"
          - "kind=PHOTO requires width_px >= 1024 and height_px >= 768 (missing dims: ERR_INVALID_REQUEST; too small: ERR_MEDIA_TOO_SMALL)"
        side_effects:
          - "If kind=PHOTO and no other READY PHOTO of this listing has is_primary=true: set is_primary=true (auto-primary)"
          - "If listing ACTIVE and any subscription SUBSCRIBED: queue MEDIA_UPDATE jobs, superseding QUEUED MEDIA_UPDATE jobs"
      - from: READY
        to: ARCHIVED
        trigger: POST /media-assets/{id}/archive
        actor: ListingAgent | MarketingCoordinator
        preconditions: ["posture != SUSPENDED (ERR_POSTURE_SUSPENDED)"]
        side_effects:
          - "If is_primary was true: reassign is_primary to the remaining READY PHOTO of the listing with earliest created_at (selector: status==READY AND kind==PHOTO, order created_at ASC); none remain -> no primary"
          - "MEDIA_UPDATE jobs queued as in mark-ready"
      - from: REJECTED
        to: ARCHIVED
        trigger: POST /media-assets/{id}/archive
        actor: ListingAgent | MarketingCoordinator
        preconditions: []
        side_effects: []
      - from: UPLOADED
        to: REJECTED
        trigger: "system: reserved for content moderation; not reachable via public endpoints"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShowingWindow
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade: listing COMPLIANCE_HOLD / WITHDRAWN / EXPIRED / SOLD"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShowingFeedback
    initial_state: INCLUDED
    terminal_states: [EXCLUDED]
    transitions:
      - from: INCLUDED
        to: EXCLUDED
        trigger: POST /feedbacks/{id}/exclude
        actor: MarketingCoordinator
        preconditions: ["status == INCLUDED (ERR_INVALID_STATE)"]
        side_effects: ["Listing feedback_score_raw and feedback_score_weighted recompute over remaining INCLUDED feedback"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: listing-patch-stale-version
    parent_entity: Listing
    write_endpoint: "PATCH /listings/{id}"
    occ_field: expected_listing_version
    description: |
      Updating a Listing with an expected_listing_version that no longer matches
      Listing.version is rejected. Another writer has mutated the listing since
      the client last read it, so the client's field values are based on stale data.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: price-change-stale-version
    parent_entity: Listing
    write_endpoint: "POST /listings/{id}/price-changes"
    occ_field: expected_listing_version
    description: |
      Posting a price change with an expected_listing_version that no longer
      matches Listing.version is rejected; the price history head may have moved
      since the client last observed the listing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: showing_feedback_scores
    trigger: "On feedback creation, on feedback exclusion, and on every read of Listing or GET /listings/{id}/summary"
    algorithm: weighted_scoring
    formula: |
      included = ShowingFeedback of listing with status == INCLUDED
      if included is empty: raw = null, weighted = null
      raw = round_half_up(mean(rating), 3)
      age_days(f) = (now - f.created_at) / 86400   # logical clock, exact seconds
      w(f) = 2 ** (-age_days(f) / FEEDBACK_HALF_LIFE_DAYS)
      weighted = round_half_up( sum(rating(f) * w(f)) / sum(w(f)), 3 )
    input_set: "ShowingFeedback rows of the listing with status == INCLUDED only; EXCLUDED rows ignored"
    constants:
      FEEDBACK_HALF_LIFE_DAYS: 14
    precision: "3 decimal places, round_half_up"
    variants:
      - name: raw
        when: "feedback_score_raw field"
        difference: "Unweighted mean of the same input set; ignores age entirely"
      - name: decay_weighted
        when: "feedback_score_weighted field"
        difference: "Age-decayed weights; older feedback contributes less, so identical rows yield a different score than raw whenever ages differ"

  - name: propagation_delay_audit
    trigger: "On job ACK, on job DEAD_LETTER, on sweep, and on every read of Listing or summary"
    algorithm: threshold
    formula: |
      audited = count of jobs of the listing where
                (status == ACKED AND propagation_delay_seconds > portal.sla_seconds)
                OR (status == DEAD_LETTER)
      provisional = audited + count of jobs where
                status == DISPATCHED AND (now - dispatched_at) > portal.sla_seconds
      breach boundary: delay_seconds > sla_seconds is a breach; delay_seconds == sla_seconds is NOT
    input_set: "SyndicationJob rows of the listing; audited considers terminal evidence only (ACKED measured, DEAD_LETTER), provisional adds in-flight DISPATCHED over-age"
    constants:
      DEFAULT_SLA_SECONDS: 3600
    precision: "integer seconds; strict > comparison"
    variants:
      - name: provisional
        when: "provisional_breach_count field"
        difference: "Forward-looking: includes in-flight DISPATCHED jobs already older than the SLA even though they may still ACK cleanly"
      - name: audited
        when: "audited_breach_count field and DEGRADED posture rule"
        difference: "Chronological terminal-only: an over-age in-flight job counts 0 until it ACKs late or dies, so the two variants diverge while jobs are in flight"

  - name: relist_fee_calculation
    trigger: "GET /listings/{id}/relist-quote and POST /listings/{id}/relist"
    algorithm: tiered_pricing
    formula: |
      # evaluation order pinned: tier -> volume -> discount, single final rounding
      tier_mult = 1.0 if relist_count_before == 0
                  1.5 if relist_count_before == 1
                  2.0 if relist_count_before >= 2
      volume_mult = 2.0 if agent_active_listing_count > VOLUME_THRESHOLD else 1.0
      # agent_active_listing_count = Listing rows with agent_id == listing.agent_id AND lifecycle_status == ACTIVE
      base_price = terminal_price_cents
      effective_price = new_list_price_cents if provided else list_price_cents
      price_reduction_pct = round_half_up(100 * (base_price - effective_price) / base_price, 2)
      discount = 0.25 if price_reduction_pct >= DISCOUNT_THRESHOLD_PCT else 0.0
      fee_cents = round_half_up(BASE_RELIST_FEE_CENTS * tier_mult * volume_mult * (1 - discount))
    input_set: "Listing being relisted (must be WITHDRAWN or EXPIRED); the owning Agent's ACTIVE listings for volume_mult"
    constants:
      BASE_RELIST_FEE_CENTS: 20000
      VOLUME_THRESHOLD: 10
      DISCOUNT_THRESHOLD_PCT: 5.0
      RELIST_COOLDOWN_DAYS: 30
    precision: "integer cents, round_half_up once at the end"

  - name: portal_display_price
    trigger: "On SyndicationJob creation (snapshot into payload_display_price_cents) and on GET /listings/{id}/summary (headline)"
    algorithm: nested_rounding
    formula: |
      # rounding order pinned: discount first (exact, unrounded), then ONE round to the portal increment
      discounted = list_price_cents * (1 - portal.discount_pct)          # exact rational, no rounding yet
      display_price_cents = round_half_up(discounted / portal.rounding_increment_cents) * portal.rounding_increment_cents
      headline_display_price_cents = min(display_price_cents) over FeedSubscriptions of the listing with status == SUBSCRIBED; null when none
      # pinned order matters: rounding list_price_cents to the increment BEFORE applying the discount yields different cents
    input_set: "FeedSubscriptions of the listing with status == SUBSCRIBED and their PortalAccounts"
    constants:
      ALLOWED_INCREMENTS_CENTS: [10000, 50000, 100000, 1000000]
    precision: "integer cents; round_half_up at the increment division only"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ListingAgent acting on a listing must satisfy listing.agent_id == X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "Listing-scoped mutations when role == ListingAgent" }
  - { priority: 4, category: existence, check: "Path ids and body FK references (agent_id, portal_account_id) resolve, left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "Required fields present, types valid, enum membership, ranges (rating 1..5, file_bytes > 0, ends_at > starts_at, rounding_increment_cents in allowed set)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource lifecycle/state permits the transition or operation (includes ERR_LISTING_NOT_ACTIVE when an operation requires lifecycle == ACTIVE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-machine endpoints" }
  - { priority: 7, category: state, check: "Marketing mutations forbidden while syndication_posture == SUSPENDED", error_id: ERR_POSTURE_SUSPENDED, http_status: 409, applies_to: "PATCH /listings/{id}, POST price-changes, media create/mark-ready/set-primary/archive, POST showing-windows" }
  - { priority: 8, category: state, check: "expected_listing_version matches Listing.version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /listings/{id}, POST /listings/{id}/price-changes" }
  - { priority: 9, category: business_safety, check: "marketing_remarks (or new_marketing_remarks) contains none of the fair-housing phrases, case-insensitive substring: 'no children', 'adults only', 'not suitable for families', 'christian neighborhood', 'no wheelchairs', 'english speakers only'", error_id: ERR_FAIR_HOUSING_VIOLATION, http_status: 422, applies_to: "POST /listings, PATCH /listings/{id}, POST /listings/{id}/submit-review, POST /listings/{id}/relist" }
  - { priority: 10, category: business_constraint, check: "Agent license_number unique across all agents", error_id: ERR_DUPLICATE_LICENSE, http_status: 409, applies_to: "POST /agents" }
  - { priority: 11, category: business_constraint, check: "Submit-review: bedrooms, bathrooms, square_feet, marketing_remarks, mls_number all non-null", error_id: ERR_LISTING_INCOMPLETE, http_status: 422, applies_to: "POST /listings/{id}/submit-review" }
  - { priority: 12, category: business_constraint, check: "Submit-review: at least one MediaAsset kind=PHOTO in READY status", error_id: ERR_NO_READY_PHOTO, http_status: 422, applies_to: "POST /listings/{id}/submit-review" }
  - { priority: 13, category: business_constraint, check: "Submit-review: no existing ComplianceReview in PENDING for this listing", error_id: ERR_REVIEW_ALREADY_PENDING, http_status: 409, applies_to: "POST /listings/{id}/submit-review" }
  - { priority: 14, category: business_referential, check: "Activate: latest ComplianceReview (by created_at) for the listing is APPROVED", error_id: ERR_COMPLIANCE_NOT_APPROVED, http_status: 409, applies_to: "POST /listings/{id}/activate" }
  - { priority: 15, category: business_constraint, check: "Price change: new_price_cents != current (ERR_PRICE_UNCHANGED); |delta| >= 50000 cents OR |delta_pct| >= 1.0 (delta_pct rounded 2 decimals) else ERR_PRICE_CHANGE_TOO_SMALL; boundary >= passes", error_id: ERR_PRICE_CHANGE_TOO_SMALL, http_status: 422, applies_to: "POST /listings/{id}/price-changes" }
  - { priority: 16, category: business_temporal, check: "Relist: now >= terminal_entered_at + 30 days (exactly 30 days passes)", error_id: ERR_RELIST_COOLDOWN_ACTIVE, http_status: 422, applies_to: "POST /listings/{id}/relist" }
  - { priority: 17, category: business_referential, check: "PortalAccount.status == ACTIVE", error_id: ERR_PORTAL_NOT_ACTIVE, http_status: 409, applies_to: "POST /listings/{id}/feed-subscriptions, POST /feed-subscriptions/{id}/resume" }
  - { priority: 18, category: business_constraint, check: "No other FeedSubscription for the same (listing_id, portal_account_id) in status SUBSCRIBED or PAUSED", error_id: ERR_SUBSCRIPTION_EXISTS, http_status: 409, applies_to: "POST /listings/{id}/feed-subscriptions" }
  - { priority: 19, category: business_temporal, check: "Showing window overlap: half-open [starts_at, ends_at) must not intersect any other SCHEDULED window of the same listing; touching endpoints (a.ends_at == b.starts_at) do NOT overlap", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /listings/{id}/showing-windows" }
  - { priority: 20, category: business_temporal, check: "Feedback: now >= window.ends_at", error_id: ERR_WINDOW_NOT_ENDED, http_status: 422, applies_to: "POST /showing-windows/{id}/feedback" }
  - { priority: 21, category: business_constraint, check: "Feedback: window has no existing ShowingFeedback", error_id: ERR_FEEDBACK_ALREADY_EXISTS, http_status: 409, applies_to: "POST /showing-windows/{id}/feedback" }
  - { priority: 22, category: business_constraint, check: "set-primary: asset kind == PHOTO (ERR_PRIMARY_REQUIRES_PHOTO); status == READY (ERR_MEDIA_NOT_READY); not already primary (ERR_ALREADY_PRIMARY)", error_id: ERR_PRIMARY_REQUIRES_PHOTO, http_status: 422, applies_to: "POST /media-assets/{id}/set-primary" }
  - { priority: 23, category: business_constraint, check: "mark-ready: PHOTO requires width_px >= 1024 and height_px >= 768", error_id: ERR_MEDIA_TOO_SMALL, http_status: 422, applies_to: "POST /media-assets/{id}/mark-ready" }
  - { priority: 24, category: business_referential, check: "Compliance decision: review status == PENDING", error_id: ERR_REVIEW_DECIDED, http_status: 409, applies_to: "POST /compliance-reviews/{id}/decision" }
  - { priority: 25, category: state, check: "ack/fail: job status == DISPATCHED", error_id: ERR_JOB_NOT_DISPATCHED, http_status: 409, applies_to: "POST /feed-events/{id}/ack, POST /feed-events/{id}/fail" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/agents", description: "Create agent", roles: [MarketingDirector], code: 201, input: [full_name, license_number, email], output: Agent, side_effects: [] }
  - { method: GET, path: "/agents", description: "List agents", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "Agent[]", side_effects: [] }

  - { method: POST, path: "/listings", description: "Create listing in DRAFT; fair-housing scan on marketing_remarks when present", roles: [ListingAgent, MarketingCoordinator], code: 201, input: [agent_id, address_line1, city, state_code, postal_code, property_type, list_price_cents, listing_expires_on, "bedrooms?", "bathrooms?", "square_feet?", "marketing_remarks?", "mls_number?"], output: Listing, side_effects: ["lifecycle DRAFT, posture NOT_SYNDICATED, relist_count 0"] }
  - { method: GET, path: "/listings", description: "List listings with filters", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["agent_id?", "lifecycle_status?", "limit?", "offset?"], output: "Listing[]", side_effects: [] }
  - { method: GET, path: "/listings/{id}", description: "Get one listing (posture and scores derived at read)", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: [], output: Listing, side_effects: [] }
  - { method: PATCH, path: "/listings/{id}", description: "Update listing fields; OCC guarded; price never patchable", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [expected_listing_version, "bedrooms?", "bathrooms?", "square_feet?", "marketing_remarks?", "mls_number?", "listing_expires_on?"], output: Listing, side_effects: ["version + 1", "if marketing_remarks changed: append REMARKS_UPDATE ListingEvent; if ACTIVE queue REMARKS_UPDATE jobs superseding QUEUED REMARKS_UPDATE jobs per SUBSCRIBED subscription"] }
  - { method: POST, path: "/listings/{id}/submit-review", description: "DRAFT -> PENDING_REVIEW; creates ComplianceReview", roles: [ListingAgent, MarketingCoordinator], code: 201, input: [], output: ComplianceReview, side_effects: ["see state machine"] }
  - { method: POST, path: "/listings/{id}/activate", description: "PENDING_REVIEW -> ACTIVE (requires APPROVED latest review)", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: Listing, side_effects: ["version + 1"] }
  - { method: POST, path: "/listings/{id}/revise", description: "COMPLIANCE_HOLD -> DRAFT", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: Listing, side_effects: ["version + 1"] }
  - { method: POST, path: "/listings/{id}/mark-under-contract", description: "ACTIVE -> UNDER_CONTRACT; queues STATUS_UPDATE jobs", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: Listing, side_effects: ["version + 1", "STATUS_UPDATE jobs"] }
  - { method: POST, path: "/listings/{id}/reactivate", description: "UNDER_CONTRACT -> ACTIVE (fall-through); queues STATUS_UPDATE jobs", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: Listing, side_effects: ["version + 1", "STATUS_UPDATE jobs"] }
  - { method: POST, path: "/listings/{id}/close-sold", description: "UNDER_CONTRACT -> SOLD with terminal cascade", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: Listing, side_effects: ["see state machine cascade"] }
  - { method: POST, path: "/listings/{id}/withdraw", description: "ACTIVE -> WITHDRAWN with cascade", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: Listing, side_effects: ["see state machine cascade"] }
  - { method: POST, path: "/listings/{id}/relist", description: "WITHDRAWN/EXPIRED -> DRAFT; cooldown + safety scan; computes relist fee", roles: [ListingAgent, MarketingCoordinator], code: 201, input: ["new_list_price_cents?", "new_marketing_remarks?"], output: RelistRequest, side_effects: ["relist_count + 1", "fee computed", "version + 1"] }
  - { method: GET, path: "/listings/{id}/relist-quote", description: "Computed relist quote at current clock", roles: [ListingAgent, MarketingCoordinator, MarketingDirector], code: 200, input: ["new_list_price_cents?"], output: "{ eligible: boolean, fee_cents: integer, cooldown_until: string, relist_count_before: integer, price_reduction_pct: number }", side_effects: [] }
  - { method: GET, path: "/listings/{id}/relist-requests", description: "Relist history", roles: [ListingAgent, MarketingCoordinator, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "RelistRequest[]", side_effects: [] }
  - { method: GET, path: "/listings/{id}/summary", description: "Computed marketing summary", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: [], output: "{ listing_id: string, lifecycle_status: string, syndication_posture: string, feedback_score_raw: number, feedback_score_weighted: number, audited_breach_count: integer, provisional_breach_count: integer, headline_display_price_cents: integer, relist_count: integer }", side_effects: [] }
  - { method: GET, path: "/listings/{id}/events", description: "Append-only price/remarks/status history ordered by seq", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["event_type?", "limit?", "offset?"], output: "ListingEvent[]", side_effects: [] }

  - { method: POST, path: "/listings/{id}/media-assets", description: "Upload media asset (UPLOADED)", roles: [ListingAgent, MarketingCoordinator], code: 201, input: [kind, file_url, file_bytes, "width_px?", "height_px?"], output: MediaAsset, side_effects: [] }
  - { method: GET, path: "/listings/{id}/media-assets", description: "List media of a listing", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["kind?", "status?", "limit?", "offset?"], output: "MediaAsset[]", side_effects: [] }
  - { method: POST, path: "/media-assets/{id}/mark-ready", description: "UPLOADED -> READY with dimension validation; auto-primary", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: MediaAsset, side_effects: ["auto-primary", "MEDIA_UPDATE jobs when ACTIVE"] }
  - { method: POST, path: "/media-assets/{id}/set-primary", description: "Atomic primary swap to this READY PHOTO", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: MediaAsset, side_effects: ["previous primary is_primary -> false", "MEDIA_UPDATE jobs when ACTIVE"] }
  - { method: POST, path: "/media-assets/{id}/archive", description: "READY/REJECTED -> ARCHIVED; primary reassignment", roles: [ListingAgent, MarketingCoordinator], code: 200, input: [], output: MediaAsset, side_effects: ["primary reassignment by created_at ASC", "MEDIA_UPDATE jobs when ACTIVE"] }

  - { method: GET, path: "/listings/{id}/compliance-reviews", description: "List reviews of a listing", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "ComplianceReview[]", side_effects: [] }
  - { method: POST, path: "/compliance-reviews/{id}/decision", description: "Approve or reject a PENDING review; rejection cascades", roles: [ComplianceOfficer], code: 200, input: [outcome, "flagged_terms?", "notes?"], output: ComplianceReview, side_effects: ["REJECTED: listing -> COMPLIANCE_HOLD cascade"] }

  - { method: POST, path: "/portal-accounts", description: "Create portal account (ACTIVE)", roles: [MarketingDirector], code: 201, input: [portal_name, "sla_seconds?", "discount_pct?", "rounding_increment_cents?"], output: PortalAccount, side_effects: [] }
  - { method: GET, path: "/portal-accounts", description: "List portals", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["status?", "limit?", "offset?"], output: "PortalAccount[]", side_effects: [] }
  - { method: GET, path: "/portal-accounts/{id}", description: "Get one portal", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: [], output: PortalAccount, side_effects: [] }
  - { method: POST, path: "/portal-accounts/{id}/suspend", description: "ACTIVE -> SUSPENDED; blocks new subscriptions and job dispatch", roles: [MarketingDirector], code: 200, input: [], output: PortalAccount, side_effects: [] }
  - { method: POST, path: "/portal-accounts/{id}/resume", description: "SUSPENDED -> ACTIVE", roles: [MarketingDirector], code: 200, input: [], output: PortalAccount, side_effects: [] }
  - { method: POST, path: "/portal-accounts/{id}/blackout-windows", description: "Declare a closed dispatch blackout window (15-minute buffer applied each side at dispatch)", roles: [MarketingDirector], code: 201, input: [starts_at, ends_at, "reason?"], output: BlackoutWindow, side_effects: [] }
  - { method: GET, path: "/portal-accounts/{id}/blackout-windows", description: "List blackout windows", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "BlackoutWindow[]", side_effects: [] }
  - { method: GET, path: "/portal-accounts/{id}/feed-subscriptions", description: "List subscriptions of a portal", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "FeedSubscription[]", side_effects: [] }

  - { method: POST, path: "/listings/{id}/feed-subscriptions", description: "Subscribe listing to a portal; queues FULL_SYNC job", roles: [MarketingCoordinator, MarketingDirector], code: 201, input: [portal_account_id], output: FeedSubscription, side_effects: ["FULL_SYNC SyndicationJob QUEUED with display price snapshot"] }
  - { method: GET, path: "/listings/{id}/feed-subscriptions", description: "List subscriptions of a listing", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "FeedSubscription[]", side_effects: [] }
  - { method: GET, path: "/feed-subscriptions/{id}", description: "Get one subscription", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: [], output: FeedSubscription, side_effects: [] }
  - { method: POST, path: "/feed-subscriptions/{id}/pause", description: "SUBSCRIBED -> PAUSED; cancels live jobs", roles: [MarketingCoordinator, MarketingDirector], code: 200, input: [], output: FeedSubscription, side_effects: ["live jobs CANCELLED"] }
  - { method: POST, path: "/feed-subscriptions/{id}/resume", description: "PAUSED -> SUBSCRIBED; queues FULL_SYNC", roles: [MarketingCoordinator, MarketingDirector], code: 200, input: [], output: FeedSubscription, side_effects: ["FULL_SYNC job QUEUED"] }
  - { method: GET, path: "/feed-subscriptions/{id}/jobs", description: "List jobs of a subscription", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector, PortalWebhook], code: 200, input: ["limit?", "offset?"], output: "SyndicationJob[]", side_effects: [] }

  - { method: GET, path: "/listings/{id}/feed-events", description: "List syndication jobs of a listing", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector, PortalWebhook], code: 200, input: ["job_type?", "status?", "limit?", "offset?"], output: "SyndicationJob[]", side_effects: [] }
  - { method: POST, path: "/feed-events/{id}/ack", description: "Portal ACK callback; computes propagation delay", roles: [PortalWebhook], code: 200, input: [], output: SyndicationJob, side_effects: ["delay + breach accounting", "posture recompute", "TERMINAL_SYNC ack completes PAUSED subscription"] }
  - { method: POST, path: "/feed-events/{id}/fail", description: "Portal failure callback; retry with exponential backoff or DEAD_LETTER", roles: [PortalWebhook], code: 200, input: [error_code], output: SyndicationJob, side_effects: ["RETRY_QUEUED with scheduled_at = now + 60*2^attempt_count s, or DEAD_LETTER at attempt 3"] }

  - { method: POST, path: "/listings/{id}/price-changes", description: "Change list price on ACTIVE/UNDER_CONTRACT listing; OCC guarded; appends history and regenerates feed jobs", roles: [ListingAgent, MarketingCoordinator], code: 201, input: [new_price_cents, expected_listing_version, "change_reason?"], output: ListingEvent, side_effects: ["list_price_cents updated", "PRICE_CHANGE event appended", "version + 1", "QUEUED PRICE_UPDATE jobs SUPERSEDED; new PRICE_UPDATE QUEUED per SUBSCRIBED subscription", "posture recompute"] }
  - { method: POST, path: "/listings/{id}/showing-windows", description: "Create showing window; half-open overlap check", roles: [ListingAgent, MarketingCoordinator], code: 201, input: [starts_at, ends_at], output: ShowingWindow, side_effects: [] }
  - { method: GET, path: "/listings/{id}/showing-windows", description: "List showing windows", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["limit?", "offset?"], output: "ShowingWindow[]", side_effects: [] }
  - { method: GET, path: "/showing-windows/{id}", description: "Get one showing window", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: [], output: ShowingWindow, side_effects: [] }
  - { method: POST, path: "/showing-windows/{id}/feedback", description: "Submit feedback for an ended window", roles: [ListingAgent, MarketingCoordinator], code: 201, input: [rating, "comment?"], output: ShowingFeedback, side_effects: ["scores recompute"] }
  - { method: GET, path: "/showing-windows/{id}/feedback", description: "Feedback of a window (0 or 1)", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: [], output: "ShowingFeedback[]", side_effects: [] }
  - { method: GET, path: "/listings/{id}/feedbacks", description: "All feedback of a listing", roles: [ListingAgent, MarketingCoordinator, ComplianceOfficer, MarketingDirector], code: 200, input: ["status?", "limit?", "offset?"], output: "ShowingFeedback[]", side_effects: [] }
  - { method: POST, path: "/feedbacks/{id}/exclude", description: "Moderate feedback out of the aggregate", roles: [MarketingCoordinator], code: 200, input: [], output: ShowingFeedback, side_effects: ["scores recompute over INCLUDED only"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [MarketingDirector], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/_sweeps/run", description: "Ops sweep: expire due ACTIVE listings, dispatch due jobs (portal ACTIVE, outside buffered blackout, order scheduled_at ASC then created_at ASC), recompute postures", roles: [MarketingDirector], code: 200, input: [], output: "{ expired_listing_ids: string[], dispatched_job_ids: string[], deferred_job_ids: string[] }", side_effects: ["expiry cascade", "job dispatch"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "ListingAgent does not own the listing" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum, or range violation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current lifecycle/entity state does not permit the operation" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "Operation requires lifecycle_status == ACTIVE" }
  - { id: ERR_POSTURE_SUSPENDED, http: 409, condition: "Marketing mutation while syndication_posture == SUSPENDED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_listing_version does not match Listing.version" }
  - { id: ERR_FAIR_HOUSING_VIOLATION, http: 422, condition: "Remarks contain a prohibited fair-housing phrase" }
  - { id: ERR_DUPLICATE_LICENSE, http: 409, condition: "Agent license_number already exists" }
  - { id: ERR_LISTING_INCOMPLETE, http: 422, condition: "Submit-review with incomplete required fields" }
  - { id: ERR_NO_READY_PHOTO, http: 422, condition: "Submit-review without any READY PHOTO asset" }
  - { id: ERR_REVIEW_ALREADY_PENDING, http: 409, condition: "A PENDING ComplianceReview already exists for the listing" }
  - { id: ERR_COMPLIANCE_NOT_APPROVED, http: 409, condition: "Latest review is not APPROVED at activation" }
  - { id: ERR_PRICE_UNCHANGED, http: 422, condition: "new_price_cents equals current price" }
  - { id: ERR_PRICE_CHANGE_TOO_SMALL, http: 422, condition: "|delta| < 50000 cents AND |delta_pct| < 1.0" }
  - { id: ERR_RELIST_COOLDOWN_ACTIVE, http: 422, condition: "Fewer than 30 days since terminal entry" }
  - { id: ERR_PORTAL_NOT_ACTIVE, http: 409, condition: "Portal is SUSPENDED for subscribe/resume" }
  - { id: ERR_SUBSCRIPTION_EXISTS, http: 409, condition: "Live subscription for (listing, portal) already exists" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Showing window intersects another SCHEDULED window (half-open)" }
  - { id: ERR_WINDOW_NOT_ENDED, http: 422, condition: "Feedback submitted before window ends_at" }
  - { id: ERR_FEEDBACK_ALREADY_EXISTS, http: 409, condition: "Window already has feedback" }
  - { id: ERR_PRIMARY_REQUIRES_PHOTO, http: 422, condition: "set-primary on non-PHOTO asset" }
  - { id: ERR_MEDIA_NOT_READY, http: 409, condition: "set-primary on asset not in READY" }
  - { id: ERR_ALREADY_PRIMARY, http: 409, condition: "set-primary on the asset that is already primary" }
  - { id: ERR_MEDIA_TOO_SMALL, http: 422, condition: "PHOTO below 1024x768 at mark-ready" }
  - { id: ERR_REVIEW_DECIDED, http: 409, condition: "Decision on a non-PENDING review" }
  - { id: ERR_JOB_NOT_DISPATCHED, http: 409, condition: "ack/fail on a job not in DISPATCHED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ListingAgent
    description: "Licensed agent owning listings; acts only on own listings"
    identity: "entity_backed:Agent"
    exclusive_operations: []
    shared_operations: [create listing, patch own listing, submit-review, activate, revise, mark-under-contract, reactivate, close-sold, withdraw, relist, price-changes, media ops, showing windows, feedback create, reads]
  - name: MarketingCoordinator
    description: "Brokerage marketing staff; operates on any listing without ownership restriction"
    identity: opaque
    exclusive_operations: [feed-subscription create/pause/resume, feedback exclude]
    shared_operations: [all listing marketing mutations, reads]
  - name: ComplianceOfficer
    description: "Fair-housing reviewer; decides ComplianceReviews only"
    identity: opaque
    exclusive_operations: [compliance decision]
    shared_operations: [reads]
  - name: MarketingDirector
    description: "Marketing leadership; administers agents, portals, blackouts, clock, sweeps"
    identity: opaque
    exclusive_operations: [agent create, portal create/suspend/resume, blackout windows, clock set, sweeps]
    shared_operations: [feed-subscription ops, reads]
  - name: PortalWebhook
    description: "External portal callback identity; can only ack/fail feed events and read job state"
    identity: opaque
    exclusive_operations: [feed-events ack, feed-events fail]
    shared_operations: [feed-event reads]
