              as_user_id: "analyst-1"
          assert:
            - "HTTP 200"
            - "TestPurchase.${tp}.status == CLEARED"
            - "SerialUnit.${su1}.status == SHIPPED_TO_DISTRIBUTOR"
            - "SerialUnit.${su1}.traced_at == null"
            - "PriceObservation.${obsg}.unauthorized_seller_confirmed == false"

      # --- DistributorChargeback (3 transitions) ----------------------------
      - name: chargeback_assessed_to_disputed_by_the_owning_distributor
        claim_type: valid_transition
        grounds: ["state_machines.DistributorChargeback.transitions.ASSESSED_to_DISPUTED"]
        distinguishing_aspect: "The distributor named on distributor_id may dispute while dispute_rounds < 2; filing records dispute_reason and leaves the balance and score fully intact."
        test_recipe:
          setup: ["Chargeback ASSESSED for 4 units at 2500/unit (amount 10000, score 10.0, standing PROBATION)."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - *TPCAP1
            - *TPCONF1
            - &GETDISTV
              call: "GET /distributors/${dist}"
              payload: {}
              as: BrandChannelManager
              captures: { dv: $.data.version }
            - &CB4U
              call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${dist}", test_purchase_id: "${tp}", diverted_units: 4, expected_distributor_version: "${dv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { cb: $.data.id }
          trigger:
            - &CBDISPUTE
              call: "POST /distributor-chargebacks/${cb}/dispute"
              payload: { dispute_reason: "Units were stolen in transit, not diverted" }
              as: Distributor
              as_user_id: "${dist}"
          assert:
            - "HTTP 200"
            - "DistributorChargeback.${cb}.status == DISPUTED"
            - "DistributorChargeback.${cb}.dispute_reason == 'Units were stolen in transit, not diverted'"
            - "DistributorChargeback.${cb}.dispute_rounds == 0"
            - "Distributor.${dist}.chargeback_balance_cents == 10000"
            - "Distributor.${dist}.diversion_score == 10.0"
            - "Distributor.${dist}.standing == PROBATION"

      - name: chargeback_disputed_to_upheld_keeps_the_money_and_bumps_rounds
        claim_type: valid_transition
        grounds: ["state_machines.DistributorChargeback.transitions.DISPUTED_to_UPHELD"]
        distinguishing_aspect: "UPHOLD advances dispute_rounds 0 -> 1 and is re-disputable, while amount_cents stays inside chargeback_balance_cents and score_delta_applied stays inside diversion_score."
        test_recipe:
          setup: ["Chargeback DISPUTED for 10000 / score 10.0."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - *TPCAP1
            - *TPCONF1
            - *GETDISTV
            - *CB4U
            - *CBDISPUTE
          trigger:
            - &CBUPHOLD
              call: "POST /distributor-chargebacks/${cb}/dispute-decision"
              payload: { decision: "UPHOLD", decision_reason: "Chain-of-custody records contradict the transit claim" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "DistributorChargeback.${cb}.status == UPHELD"
            - "DistributorChargeback.${cb}.dispute_rounds == 1"
            - "DistributorChargeback.${cb}.decision_reason == 'Chain-of-custody records contradict the transit claim'"
            - "Distributor.${dist}.chargeback_balance_cents == 10000"
            - "Distributor.${dist}.diversion_score == 10.0"
            - "Distributor.${dist}.standing == PROBATION"

      - name: chargeback_disputed_to_reversed_restores_balance_score_and_standing
        claim_type: valid_transition
        grounds: ["state_machines.DistributorChargeback.transitions.DISPUTED_to_REVERSED", "calculations.distributor_chargeback_ledger"]
        distinguishing_aspect: "REVERSE is the conservation test: balance falls 10000 -> 0, score 10.0 -> 0, standing is re-derived PROBATION -> GOOD, and the row keeps its historical amount_cents for audit."
        test_recipe:
          setup: ["Chargeback DISPUTED for 10000 / score 10.0; distributor standing PROBATION."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - *TPCAP1
            - *TPCONF1
            - *GETDISTV
            - *CB4U
            - *CBDISPUTE
          trigger:
            - call: "POST /distributor-chargebacks/${cb}/dispute-decision"
              payload: { decision: "REVERSE", decision_reason: "Police report confirms cargo theft" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "DistributorChargeback.${cb}.status == REVERSED"
            - "DistributorChargeback.${cb}.amount_cents == 10000"
            - "DistributorChargeback.${cb}.score_delta_applied == 10.0"
            - "Distributor.${dist}.chargeback_balance_cents == 0"
            - "Distributor.${dist}.diversion_score == 0"
            - "Distributor.${dist}.standing == GOOD"

      # --- initial_state ----------------------------------------------------
      - name: policy_initial_state_is_draft_at_revision_one
        claim_type: initial_state
        grounds: ["state_machines.PricingPolicy.initial_state"]
        distinguishing_aspect: "A freshly created policy lands in DRAFT with revision_number 1 and every lifecycle stamp still null — no endpoint can choose a different entry state."
        test_recipe:
          setup: ["Clock at 2026-08-01T00:00:00Z; no policies exist."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - *POLNEW
          assert:
            - "HTTP 201"
            - "PricingPolicy.${pol}.status == DRAFT"
            - "PricingPolicy.${pol}.revision_number == 1"
            - "PricingPolicy.${pol}.effective_from == null"
            - "PricingPolicy.${pol}.reviewed_by_user_id == null"
            - "PricingPolicy.${pol}.published_by_user_id == null"
            - "PricingPolicy.${pol}.superseded_by_policy_id == null"

      - name: reseller_initial_state_is_applied_on_both_parallel_axes
        claim_type: initial_state
        grounds: ["state_machines.Reseller.initial_state"]
        distinguishing_aspect: "The parallel machine has a compound entry state: authorization_status APPLIED together with supply_status HOLD and hold_reason PENDING_AUTHORIZATION, so a brand-new reseller can never be shipped to."
        test_recipe:
          setup: ["Policy PUBLISHED; no resellers exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
          trigger:
            - *RESACME
          assert:
            - "HTTP 201"
            - "Reseller.${res}.authorization_status == APPLIED"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == PENDING_AUTHORIZATION"
            - "Reseller.${res}.violation_points_total == 0"
            - "Reseller.${res}.review_required == false"
            - "Reseller.${res}.suspension_ends_at == null"
            - "Reseller.${res}.last_suspension_ended_at == null"

      - name: observation_initial_state_is_captured_with_null_derived_fields
        claim_type: initial_state
        grounds: ["state_machines.PriceObservation.initial_state"]
        distinguishing_aspect: "Capture is inert: the observation enters CAPTURED with every evaluation-derived field (effective price, floor, deviation, cited policy) still null until evaluate runs."
        test_recipe:
          setup: ["Policy PUBLISHED, product SKU-AUDIO-1, clock 2026-08-20T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - *OBSGREY
          assert:
            - "HTTP 201"
            - "PriceObservation.${obsg}.status == CAPTURED"
            - "PriceObservation.${obsg}.effective_advertised_price_cents == null"
            - "PriceObservation.${obsg}.effective_map_floor_cents == null"
            - "PriceObservation.${obsg}.deviation_cents == null"
            - "PriceObservation.${obsg}.cited_policy_id == null"
            - "PriceObservation.${obsg}.unauthorized_seller_confirmed == false"

      # --- terminal_state_lockdown ------------------------------------------
      - name: policy_withdrawn_is_terminal_and_further_publish_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PricingPolicy.terminal_states"]
        distinguishing_aspect: "WITHDRAWN admits no outgoing edge: re-publishing the withdrawn policy is refused with ERR_INVALID_STATE and its status is unchanged."
        test_recipe:
          setup: ["Policy MAP-2026-A in WITHDRAWN."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - call: "POST /pricing-policies/${pol}/withdraw"
              payload: { withdrawn_reason: "Program cancelled" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-05T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_INVALID_STATE'"
            - "PricingPolicy.${pol}.status == WITHDRAWN"

      - name: agreement_declined_is_terminal_and_activate_rejected
        claim_type: terminal_state_lockdown
