      - name: bundle_attach_requires_item_valued
        grounds:
          - state_machines.Item.VALUED_to_BUNDLED
          - errors[ERR_ITEM_NOT_VALUED]
        distinguishing_aspect: |
          Pair Bundle -> Item: attach is rejected because the referenced ITEM is
          RECEIVED (no approved valuation) even though the bundle itself is a valid
          DRAFT in a CATALOGING event — the transition gates on the sibling entity's
          state.
        test_recipe:
          setup:
            - "Event in CATALOGING; item received from a PLEDGED solicitation but never valued (status RECEIVED); empty DRAFT bundle"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala T", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
