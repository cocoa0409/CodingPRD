scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_membership_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.MembershipPlan
          - endpoints
        distinguishing_aspect: "POST /box/membership-plans with all required fields returns 201 and the persisted plan with active=true and a server-minted id."
        test_recipe:
          setup: ["Empty DB; BoxManager creates an UNLIMITED plan."]
          setup_api_calls: []
          trigger:
            - call: "POST /box/membership-plans"
              payload: { name: "Unlimited", plan_type: "UNLIMITED", monthly_fee_cents: 12000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "MembershipPlan.${plan_id}.active == true"
            - "MembershipPlan.${plan_id}.plan_type == UNLIMITED"
            - "MembershipPlan.${plan_id}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Member
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /box/members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /box/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoxManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_member_missing_required_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.email
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /box/members/register without the required email field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /box/members/register"
              payload: { full_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: register_member_default_home_box_member_true
        claim_type: Defaults
        grounds:
          - entities.Member.fields.home_box_member
        distinguishing_aspect: "Omitting home_box_member on register applies the default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /box/members/register"
              payload: { email: "def@x.com", full_name: "Def" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.home_box_member == true"
            - "Member.${m_id}.no_show_strikes == 0"
            - "Member.${m_id}.reservation_suspended == false"

      - name: member_system_fields_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Member.fields.no_show_strikes
          - entities.Member.fields.reservation_suspended
        distinguishing_aspect: "System-source fields no_show_strikes and reservation_suspended are server-controlled; supplied input values are ignored and defaults applied (0 and false)."
        test_recipe:
          setup: ["Empty DB; attempt to register supplying no_show_strikes is rejected as an unknown field OR ignored — register accepts only declared inputs, so verify the system default."]
          setup_api_calls: []
          trigger:
            - call: "POST /box/members/register"
              payload: { email: "sys@x.com", full_name: "Sys" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.no_show_strikes == 0"
            - "Member.${m_id}.reservation_suspended == false"

      - name: create_plan_invalid_enum_plan_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.MembershipPlan.fields.plan_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "plan_type outside {UNLIMITED, PUNCH} is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /box/membership-plans"
              payload: { name: "Bad", plan_type: "GOLD", monthly_fee_cents: 5000 }
              as: BoxManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: punch_plan_missing_punch_count_returns_plan_shape_invalid
        claim_type: Type Constraints
        grounds:
          - entities.MembershipPlan.fields.punch_count
          - validations[priority=6]
          - errors[ERR_PLAN_SHAPE_INVALID]
        distinguishing_aspect: "A PUNCH plan created without punch_count is rejected ERR_PLAN_SHAPE_INVALID (422) — the shape rule (priority 6) distinct from generic required-field (priority 5)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /box/membership-plans"
              payload: { name: "PunchNoCount", plan_type: "PUNCH", monthly_fee_cents: 0 }
              as: BoxManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_PLAN_SHAPE_INVALID"
            - "HTTP status == 422"

      - name: list_membership_plans_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.MembershipPlan
          - endpoints
        distinguishing_aspect: "GET /box/membership-plans returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two plans created."]
          setup_api_calls:
            - call: "POST /box/membership-plans"
              payload: { name: "P1", plan_type: "UNLIMITED", monthly_fee_cents: 10000 }
              as: BoxManager
            - call: "POST /box/membership-plans"
              payload: { name: "P2", plan_type: "UNLIMITED", monthly_fee_cents: 11000 }
              as: BoxManager
          trigger:
            - call: "GET /box/membership-plans"
              payload: { limit: 1, offset: 0 }
              as: Anonymous
          assert:
            - "response_type == array AND data length == 1"
            - "meta.total_count == 2 AND has_more == true"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_payment_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Membership.PENDING_PAYMENT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming payment on an already-ACTIVE membership (no PENDING_PAYMENT->ACTIVE available) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A membership is activated; a second confirm-payment is attempted."]
          setup_api_calls:
            - call: "POST /box/membership-plans"
              payload: { name: "U", plan_type: "UNLIMITED", monthly_fee_cents: 10000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "ip@x.com", full_name: "IP" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${m_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /box/memberships/${ms_id}/confirm-payment"
              payload: {}
              as: BoxManager
          trigger:
            - call: "POST /box/memberships/${ms_id}/confirm-payment"
              payload: {}
              as: BoxManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: freeze_from_pending_payment_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Membership.ACTIVE_to_FROZEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Freezing a PENDING_PAYMENT membership (freeze is only defined from ACTIVE) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING_PAYMENT membership exists (no payment confirmed)."]
          setup_api_calls:
            - call: "POST /box/membership-plans"
              payload: { name: "U2", plan_type: "UNLIMITED", monthly_fee_cents: 10000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "fzp@x.com", full_name: "FZP" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${m_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /box/memberships/${ms_id}/freeze"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_reservation_already_cancelled_returns_invalid_state
        claim_type: idempotency_guard
        grounds:
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a reservation twice — the second cancel sees status=CANCELLED and returns ERR_INVALID_STATE (409); seats_reserved does not double-decrement."
        test_recipe:
          setup: ["A RESERVED MEMBERSHIP reservation is cancelled once (timely), then cancelled again."]
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach R", email: "cr@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-R", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/membership-plans"
              payload: { name: "U-R", plan_type: "UNLIMITED", monthly_fee_cents: 10000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 3 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "rm@x.com", full_name: "RM" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${m_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /box/memberships/${ms_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${m_id}", membership_id: "${ms_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sess_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /box/reservations/${resv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /box/reservations/${resv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "ClassSession.${sess_id}.seats_reserved == 0"

      - name: new_session_starts_in_scheduled_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - entities.ClassSession.fields.status
        distinguishing_aspect: "A newly created ClassSession starts in SCHEDULED with seats_reserved=0 and waitlist_count=0."
        test_recipe:
          setup: ["A track and coach exist."]
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach IS", email: "cis@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-IS", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
          trigger:
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 5 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id }
          assert:
            - "ClassSession.${sess_id}.status == SCHEDULED"
            - "ClassSession.${sess_id}.seats_reserved == 0"
            - "ClassSession.${sess_id}.waitlist_count == 0"

      - name: lock_already_locked_team_returns_invalid_state
        claim_type: terminal_or_repeat_guard
        grounds:
          - state_machines.CompetitionTeam.FORMING_to_LOCKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Locking a team that is already LOCKED returns ERR_INVALID_STATE (409); lock is only defined from FORMING."
        test_recipe:
          setup: ["Captain creates and locks a team, then locks again."]
          setup_api_calls:
            - call: "POST /box/members/register"
              payload: { email: "lcap@x.com", full_name: "LCap" }
              as: Anonymous
              captures: { cap_id: $.data.id }
            - call: "POST /box/teams"
              payload: { name: "Lockers", captain_member_id: "${cap_id}", max_roster_size: 3 }
              as: Member
              as_user_id: "${cap_id}"
              captures: { team_id: $.data.id, team_v0: $.data.version }
            - call: "POST /box/teams/${team_id}/lock"
              payload: { expected_team_version: "${team_v0}" }
              as: Member
              as_user_id: "${cap_id}"
              captures: { team_v1: $.data.version }
          trigger:
            - call: "POST /box/teams/${team_id}/lock"
              payload: { expected_team_version: "${team_v1}" }
              as: Member
              as_user_id: "${cap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: bubble_up_roster_size_on_accept
        claim_type: side_effect_bubble_up
        grounds:
          - state_machines.TeamMember.INVITED_to_ACCEPTED
          - entities.CompetitionTeam.fields.roster_size
        distinguishing_aspect: "Accepting an invite bubbles up: parent team.roster_size increments from 1 (captain) to 2."
        test_recipe:
          setup: ["Captain creates a team (max 4) and invites one member who then accepts."]
          setup_api_calls:
            - call: "POST /box/members/register"
              payload: { email: "bcap@x.com", full_name: "BCap" }
              as: Anonymous
              captures: { cap_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "binv@x.com", full_name: "BInv" }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /box/teams"
              payload: { name: "Bubblers", captain_member_id: "${cap_id}", max_roster_size: 4 }
              as: Member
              as_user_id: "${cap_id}"
              captures: { team_id: $.data.id }
            - call: "POST /box/team-members"
              payload: { team_id: "${team_id}", member_id: "${inv_id}" }
              as: Member
              as_user_id: "${cap_id}"
              captures: { tm_id: $.data.id }
          trigger:
            - call: "POST /box/team-members/${tm_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${inv_id}"
          assert:
            - "TeamMember.${tm_id}.status == ACCEPTED"
            - "CompetitionTeam.${team_id}.roster_size == 2"

      - name: complete_session_terminal_lockdown_no_recancel
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED session is terminal: attempting to cancel it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A session is completed, then cancel is attempted."]
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach TL", email: "ctl@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-TL", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-02T18:00:00Z", duration_minutes: 60, capacity: 3 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T18:30:00Z" }
              as: BoxManager
            - call: "POST /box/sessions/${sess_id}/complete"
              payload: { attendance: {} }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /box/sessions/${sess_id}/cancel"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: error_membership_cancel_cascade_to_waitlist
        claim_type: side_effect_cascade
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCEL_PENDING
          - state_machines.Reservation.WAITLISTED_to_RESERVED
        excluded_because:
          difficulty_instance: transitive_cascade / membership_cancel_cascade_depth3_to_waitlist_promotion
          rationale: "The depth-3 cancel->reservation-cancel->waitlist-promotion cascade is fully asserted by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: pr_determination_first_verified_is_pr
        claim_type: Correct Result
        grounds:
          - calculations.pr_determination
          - entities.BenchmarkResult.fields.is_pr
        distinguishing_aspect: "The first verified result for a member+benchmark is always a PR (is_pr=true), since the prior set is empty."
        test_recipe:
          setup: ["A certified coach verifies a member's first FRAN result (180s)."]
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach PR", email: "cpr@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "prm@x.com", full_name: "PRM" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${m_id}", benchmark_name: "FRAN", metric_kind: "TIME_SECONDS", value: 180, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /box/benchmark-results/${r_id}/verify"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "BenchmarkResult.${r_id}.verified == true"
            - "BenchmarkResult.${r_id}.is_pr == true"

      - name: pr_determination_load_tie_is_not_pr
        claim_type: Precision
        grounds:
          - calculations.pr_determination
          - calculations.pr_determination
        distinguishing_aspect: "For LOAD_KG, an equal value to the prior best is NOT a PR (strict greater-than): verifying a 100kg back squat after a prior verified 100kg yields is_pr=false."
        test_recipe:
          setup: ["Member has one verified BACK_SQUAT_1RM at 100kg; a second 100kg result is then verified."]
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach PR2", email: "cpr2@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "pr2m@x.com", full_name: "PR2M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${m_id}", benchmark_name: "BACK_SQUAT_1RM", metric_kind: "LOAD_KG", value: 100, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /box/benchmark-results/${r1_id}/verify"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${m_id}", benchmark_name: "BACK_SQUAT_1RM", metric_kind: "LOAD_KG", value: 100, recorded_at: "2026-05-08T10:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /box/benchmark-results/${r2_id}/verify"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "BenchmarkResult.${r2_id}.verified == true"
            - "BenchmarkResult.${r2_id}.is_pr == false"

      - name: leaderboard_load_descending_order
        claim_type: Variant Selection
        grounds:
          - calculations.leaderboard_ranking
          - calculations.leaderboard_ranking
        distinguishing_aspect: "LOAD_KG leaderboard variant sorts descending (heaviest first): two members with verified DEADLIFT_1RM of 200kg and 220kg rank [220, 200]."
        test_recipe:
          setup: ["A REGULAR track; member A verified DEADLIFT 200kg, member B verified DEADLIFT 220kg."]
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach LD", email: "cld@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-LD", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "lda@x.com", full_name: "LDA" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "ldb@x.com", full_name: "LDB" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${a_id}", benchmark_name: "DEADLIFT_1RM", metric_kind: "LOAD_KG", value: 200, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${a_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /box/benchmark-results"
