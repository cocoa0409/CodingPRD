              captures: { a_final_state: $.data.review_cycle_state, a_restaged: $.data.restaged_order_set_count }
            - call: "POST /cds/vendor-releases/${vrb_id}/activate"
              payload: { activation_note: "Clinical review arm attempted by pharmacy" }
              as: PharmacyInformaticist
