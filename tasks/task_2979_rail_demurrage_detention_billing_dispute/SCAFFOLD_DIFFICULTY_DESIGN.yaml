  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: placement_cycle_movement_and_billing_axes_advance_independently
        grounds:
          - state_machines.PlacementCycle.movement_status
          - state_machines.PlacementCycle.billing_status
          - entities.PlacementCycle.fields.refusal_count
          - entities.PlacementCycle.fields.clock_basis
          - calculations.demurrage_clock_basis_resolution
        distinguishing_aspect: |
          One entity carries two parallel state machines whose transitions do not
          line up: refuse walks movement_status BACKWARDS from ACTUALLY_PLACED to
          CONSTRUCTIVELY_PLACED, flips clock_basis from ACTUAL back to
          CONSTRUCTIVE and pulls free_time_expires_at two days earlier, while
          billing_status does not move at all; invoice attachment then walks
          billing_status UNBILLED to INVOICED while movement_status stays frozen
