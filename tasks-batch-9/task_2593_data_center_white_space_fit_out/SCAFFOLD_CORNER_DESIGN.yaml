  - section: calculations
    instances:

      - name: rack_chargeable_rollup_excludes_planned_racks
        claim_type: input_set_filtering
        grounds:
          - calculations.rack_chargeable_rollup
          - entities.Hall.fields.chargeable_kw
        distinguishing_aspect: "Only racks in {INSTALLED, POWERED, AT_RISK, RELEASED} roll up: with one INSTALLED and one PLANNED 10.00 kW rack the hall bills 10.45 kW, not 20.90 — while rack_total_count still counts both and both sit in the fit-out custody partition."
        test_recipe:
          setup:
            - "Hall CX42 is in FIT_OUT with racks R-1-1 and R-1-2 (both design_kw 10.00); R-1-1 has been installed with asset_tag AT-0042 and R-1-2 is still PLANNED."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 42", code: "CX42", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 2, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack2_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /racks/${rack1_id}/install"
              payload: { asset_tag: "AT-0042" }
              as: FacilityPlanner
          trigger:
            - call: "GET /halls/${hall_id}/capacity-summary"
              payload: {}
              as: FacilityPlanner
              captures: { chargeable: $.data.chargeable_kw, total: $.data.rack_total_count, fitout: $.data.custody_fitout_count, ops: $.data.custody_ops_count, load: $.data.thermal_load_kw }
          assert:
            - "HTTP status is 200"
            - "${chargeable} == 10.45 (only the INSTALLED rack contributes: round(10.00 * 1.045, 2))"
            - "${total} == 2 and ${fitout} == 2 and ${ops} == 0"
            - "${load} == 0.00 (thermal load counts only POWERED, AT_RISK and RELEASED racks)"
            - "Rack.${rack2_id}.status == PLANNED and Rack.${rack2_id}.chargeable_kw == 10.45 (the per-rack figure exists even while the rack is excluded from the hall roll-up)"

      - name: hall_cooling_model_excludes_commissioned_unit_not_in_service
        claim_type: input_set_filtering
        grounds:
          - calculations.hall_cooling_model
          - state_machines.CoolingUnit.COMMISSIONED_to_IN_SERVICE
        distinguishing_aspect: "The duty set is CoolingUnit.status == IN_SERVICE only: a second unit that is COMMISSIONED with measured airflow already recorded publishes its own airflow_capacity_kw 64.95193 yet contributes nothing to the hall, which stays at 120.00 nameplate and 119.08 airflow."
        test_recipe:
          setup:
            - "Hall CX43 is in FIT_OUT with cooling_redundancy N and containment zone CA-1 at PASS with measured_leakage_pct 5.00."
            - "CU-1 (120.00 kW, 22000 cfm, dT 18.0 F) is IN_SERVICE; CU-2 (80.00 kW, 12000 cfm, dT 18.0 F) is only COMMISSIONED."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 43", code: "CX43", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /cooling-units"
              payload: { hall_id: "${hall_id}", name: "CU-1", rated_sensible_kw: 120.00, design_airflow_cfm: 22000, supply_delta_t_f: 18.0, redundancy_role: "PRIMARY" }
              as: MechanicalContractor
              captures: { cu1_id: $.data.id }
            - call: "POST /cooling-units"
              payload: { hall_id: "${hall_id}", name: "CU-2", rated_sensible_kw: 80.00, design_airflow_cfm: 12000, supply_delta_t_f: 18.0, redundancy_role: "REDUNDANT" }
              as: MechanicalContractor
              captures: { cu2_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 5.00, measured_static_pressure_pa: 20.0 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/commission"
              payload: { measured_airflow_cfm: 22000 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/place-in-service"
              payload: {}
              as: MechanicalContractor
          trigger:
            - call: "POST /cooling-units/${cu2_id}/commission"
              payload: { measured_airflow_cfm: 12000 }
              as: MechanicalContractor
              captures: { cu2_airflow: $.data.airflow_capacity_kw }
            - call: "GET /halls/${hall_id}/capacity-summary"
              payload: {}
              as: MechanicalContractor
              captures: { nameplate: $.data.cooling_capacity_nameplate_kw, airflow: $.data.cooling_capacity_airflow_kw, capacity: $.data.cooling_capacity_kw, leak: $.data.worst_leakage_pct }
          assert:
            - "${cu2_airflow} == 64.95193 (12000 * 0.95 * 18.0 * 1.08 / 3412 at 5 decimal places)"
            - "${nameplate} == 120.00 and ${airflow} == 119.08 and ${capacity} == 119.08"
            - "${leak} == 5.00"
            - "CoolingUnit.${cu2_id}.status == COMMISSIONED and CoolingUnit.${cu1_id}.status == IN_SERVICE"

      - name: hall_cooling_model_n_plus_one_subtracts_largest_duty_unit
        claim_type: correct_result
        grounds:
          - calculations.hall_cooling_model
          - entities.Hall.fields.cooling_redundancy
        distinguishing_aspect: "Under N_PLUS_1 each variant drops its own largest duty member: nameplate becomes 200.00 - 120.00 == 80.00 while airflow becomes 184.03048 - 119.07855 == 64.95, so the airflow variant binds the min() gate at 64.95 even though the nameplate variant reads 80.00."
        test_recipe:
          setup:
            - "Hall CX44 is in FIT_OUT with cooling_redundancy N_PLUS_1 and containment zone CA-1 at PASS with measured_leakage_pct 5.00."
            - "CU-1 (120.00 kW, 22000 cfm, dT 18.0 F) is IN_SERVICE."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 44", code: "CX44", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N_PLUS_1", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
