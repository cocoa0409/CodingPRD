  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_temporal_priority_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          state (priority 5) beats business_temporal (priority 13): approving a
          DRAFT application whose attestation is ALSO older than 366 days must
          surface ERR_INVALID_STATE, not ERR_ATTESTATION_STALE.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Region, and a DRAFT application whose dealer attestation is dated 2025-08-01 (stale by 30 days)."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
