          Resource is the PNM's accepted-invitation interval set; interval
          semantic is POINTWISE half-open overlap [start, start+duration) on
          the PNM. A second ACCEPT whose interval shares any point with an
          existing ACCEPTED interval (not just the boundary) is rejected.
          Different resource entity (PNM) and different geometric treatment
          (pointwise) than instance B (Party as resource, aggregate capacity).
        test_recipe:
          setup:
            - "Two OPEN parties on different chapters with overlapping interior (party A 18:00-19:00, party B 18:30-19:30 — overlap at [18:30,19:00))."
            - "PNM R1 INVITED to both; A already ACCEPTED."
