# =============================================================================
# SCAFFOLD — task_0619_float_sensory_deprivation_spa
# Float / Sensory-Deprivation Spa booking & operations platform
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  619. Float / Sensory-Deprivation Spa: tank/pod inventory & turnover buffer, 60/90-min
  session booking, first-time orientation & waiver, membership & float-credit rollover,
  water-treatment/sanitation log, couples/dual-tank, gift card, no-show/late & deposit

domain_name: float-spa
api_prefix: "/"
# Flat topology: every entity is its own top-level collection (/members, /tanks,
# /bookings, ...). There is no shared parent path segment, so the api_prefix is
# the root "/".

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Membership.version (renew-supersede)
    - dual_variant_calculation      # provisional vs final booking charge; refund variants
    - cascading_side_effects        # complete -> sanitation -> tank gate -> auto-cancel
    - derived_field_reconciliation  # credit_balance == sum(ledger.delta); gift-card balance
    - scheduled_actions             # logical clock; cancellation cutoffs; rollover at renewal

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep nesting in URL paths. Tanks,
  # Members, Memberships, Bookings, Attendants, Orientations, GiftCards,
  # SanitationCycles, Payments, CreditLedgerEntries are all top-level collections
  # cross-referenced by FK fields in their bodies.

  state_machine_shape: cyclic
  # Booking carries a reschedule cycle (CONFIRMED -> RESCHEDULED -> CONFIRMED).
  # Tank carries two independent (parallel) status dimensions.

  relationship_patterns:
    - one_to_many        # Member 1->* Membership/Booking; Tank 1->* Booking/SanitationCycle
    - cross_aggregate    # Booking references Tank, Member, Membership; Payment references Booking/GiftCard

  role_model: hierarchical_override
  # Member (self-service) < FrontDesk (operations) < Admin (config + override).

  consistency_model: immediate
  # All cascades resolve atomically within the triggering request.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ------------------------------------------------------------------ config
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: string, source: input, description: "Plan label, unique among plans (e.g. SOLO, DUO, UNLIMITED)" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly fee in cents", constraints: ">= 0" }
      - { name: included_floats_per_cycle, type: integer, source: input, description: "Float credits granted at the start of each billing cycle", constraints: ">= 0" }
      - { name: rollover_cap, type: integer, source: input, description: "Maximum unused float credits that may carry forward into the next cycle", constraints: ">= 0" }
      - { name: member_discount_pct, type: number, source: input, description: "Fractional discount (0.00-1.00) applied to retail session price for members on this plan", default: 0.0, constraints: "0.0 <= x <= 1.0" }
      - { name: retail_float_cents, type: integer, source: input, description: "Cash value of one float credit / drop-in retail price in cents for this plan tier", constraints: "> 0" }
      - { name: active, type: boolean, source: input, description: "Whether new memberships may be opened on this plan", default: true }

  # ------------------------------------------------------------------ actor
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. Starts ACTIVE; SUSPENDED after no_show_strikes reaches NO_SHOW_SUSPEND_THRESHOLD", default: ACTIVE, constraints: "ACTIVE|SUSPENDED" }
      - { name: orientation_completed, type: boolean, source: computed, description: "True once an Orientation for this member reaches COMPLETED", default: false }
      - { name: waiver_signed_version, type: integer, source: computed, description: "Waiver text version signed at orientation completion; 0 until signed", default: 0 }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of bookings that reached NO_SHOW for this member in the current rolling window", default: 0 }

  # ------------------------------------------------------------------ subscription
  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the owning member" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the subscribed plan" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | PAST_DUE | CANCELLED. Created PENDING, activated on first successful payment", default: PENDING, constraints: "PENDING|ACTIVE|PAST_DUE|CANCELLED" }
      - { name: credit_balance, type: integer, source: computed, description: "Current float-credit balance; equals sum of all CreditLedgerEntry.delta for this membership", default: 0 }
      - { name: cycle_index, type: integer, source: system, description: "Billing cycle counter; starts 0, increments by 1 on each renewal", default: 0 }
      - { name: cycle_start_utc, type: datetime, source: system, description: "Start of the current billing cycle (ISO 8601 UTC)" }
      - { name: cycle_end_utc, type: datetime, source: system, description: "End of the current billing cycle = cycle_start_utc + CYCLE_LENGTH_DAYS days" }
      - { name: monthly_fee_cents_snapshot, type: integer, source: system, description: "MembershipPlan.monthly_fee_cents captured at activation; pinned for proration math" }

  # ------------------------------------------------------------------ pod resource
  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tank/pod display name, unique" }
      - { name: capacity_kind, type: enum, source: input, description: "SINGLE (one floater) | DUAL (couples; two chambers, both occupied by one couples booking)", constraints: "SINGLE|DUAL" }
      - { name: turnover_buffer_minutes, type: integer, source: input, description: "Minutes of sanitation turnover reserved after each session end before the tank may be re-booked", default: 30, constraints: ">= 0" }
      - { name: operational_status, type: enum, source: system, description: "IN_SERVICE | MAINTENANCE | RETIRED. Independent of sanitation_status", default: IN_SERVICE, constraints: "IN_SERVICE|MAINTENANCE|RETIRED" }
      - { name: sanitation_status, type: enum, source: computed, description: "CLEAN | IN_CYCLE. Independent of operational_status; CLEAN initially, IN_CYCLE while an IN_PROGRESS SanitationCycle runs on the tank, back to CLEAN when all cycles complete", default: CLEAN, constraints: "CLEAN|IN_CYCLE" }

  # ------------------------------------------------------------------ sanitation log
  - name: SanitationCycle
    parent: null
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; the tank being treated" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the session that triggered the turnover, null for a manual deep-clean", default: null }
      - { name: kind, type: enum, source: input, description: "TURNOVER (auto, post-session) | DEEP_CLEAN (manual, scheduled)", constraints: "TURNOVER|DEEP_CLEAN" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED. Created IN_PROGRESS", default: IN_PROGRESS, constraints: "IN_PROGRESS|COMPLETED" }
      - { name: started_utc, type: datetime, source: system, description: "Cycle start instant (logical clock at creation)" }
      - { name: ends_utc, type: datetime, source: system, description: "started_utc + duration_minutes; tank stays IN_CYCLE until clock reaches this and a complete call fires" }
      - { name: duration_minutes, type: integer, source: input, description: "Treatment duration; defaults to the tank's turnover_buffer_minutes for TURNOVER cycles", default: null, constraints: ">= 0" }

  # ------------------------------------------------------------------ staff resource
  - name: Attendant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Attendant name" }
      - { name: active, type: boolean, source: input, description: "Whether the attendant may be assigned to new orientations", default: true }

  # ------------------------------------------------------------------ orientation + waiver
  - name: Orientation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the first-time member" }
      - { name: attendant_id, type: string, source: input, description: "FK -> Attendant.id; supervising attendant" }
      - { name: start_utc, type: datetime, source: input, description: "Orientation appointment start (ISO 8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Orientation appointment end (ISO 8601 UTC); must be after start_utc" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED. Created SCHEDULED", default: SCHEDULED, constraints: "SCHEDULED|COMPLETED|CANCELLED" }
      - { name: waiver_version, type: integer, source: input, description: "Version of the waiver text presented; written onto Member.waiver_signed_version on completion", default: 1, constraints: ">= 1" }

  # ------------------------------------------------------------------ booking (core)
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the floater (primary member for couples)" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; the reserved tank" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; membership whose credits pay for the session, null for cash drop-in", default: null }
      - { name: session_minutes, type: enum, source: input, description: "60 | 90 — booked session length", constraints: "60|90" }
      - { name: is_couples, type: boolean, source: input, description: "True for a couples/dual-tank booking; requires a DUAL tank", default: false }
      - { name: start_utc, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: end_utc, type: datetime, source: system, description: "start_utc + session_minutes; the tank is occupied over [start_utc, end_utc + turnover_buffer_minutes)" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | RESCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW. Created RESERVED", default: RESERVED, constraints: "RESERVED|CONFIRMED|RESCHEDULED|CHECKED_IN|COMPLETED|CANCELLED|NO_SHOW" }
      - { name: pay_source, type: enum, source: input, description: "CREDIT (membership float credit) | GIFT_CARD | CASH", constraints: "CREDIT|GIFT_CARD|CASH" }
      - { name: gift_card_id, type: string, source: input, description: "FK -> GiftCard.id; required when pay_source=GIFT_CARD, null otherwise", default: null }
      - { name: deposit_cents, type: integer, source: computed, description: "Deposit held at booking creation = DEPOSIT_FLAT_CENTS, doubled for couples; refundable on timely cancel, forfeited on late cancel / no-show" }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "Estimated session charge computed at creation from plan rate card and booked session_minutes" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Actual session charge computed at completion from realized session_minutes and couples surcharge; 0 until COMPLETED" }
      - { name: credits_consumed, type: integer, source: computed, description: "Float credits drawn for this booking (couples draws 2); 0 until a CREDIT booking is checked in", default: 0 }

  # ------------------------------------------------------------------ gift card
  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique redeemable code" }
      - { name: initial_balance_cents, type: integer, source: input, description: "Face value loaded at issue, in cents", constraints: "> 0" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "initial_balance_cents minus sum of Payment.amount_cents (source=GIFT_CARD) for this card; never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | VOID. ACTIVE on issue; DEPLETED when remaining_balance_cents reaches 0", default: ACTIVE, constraints: "ACTIVE|DEPLETED|VOID" }

  # ------------------------------------------------------------------ float-credit ledger (append-only)
  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; membership whose balance this entry adjusts" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; source booking for CONSUME entries, null for GRANT/FORFEIT/EXPIRE", default: null }
      - { name: reason, type: enum, source: system, description: "GRANT (cycle floats at activate/renew) | CONSUME (booking check-in) | FORFEIT (membership cancel) | EXPIRE (rollover overflow at renewal)", constraints: "GRANT|CONSUME|FORFEIT|EXPIRE" }
      - { name: delta, type: integer, source: system, description: "Signed credit change: positive for GRANT, negative for CONSUME/FORFEIT/EXPIRE" }

  # ------------------------------------------------------------------ payment / deposit / fee ledger (append-only)
  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this payment relates to, null for standalone gift-card loads", default: null }
      - { name: gift_card_id, type: string, source: input, description: "FK -> GiftCard.id; set when source=GIFT_CARD", default: null }
      - { name: kind, type: enum, source: system, description: "DEPOSIT_HOLD | DEPOSIT_REFUND | LATE_FEE | NO_SHOW_FEE | SESSION_CHARGE | SESSION_REFUND", constraints: "DEPOSIT_HOLD|DEPOSIT_REFUND|LATE_FEE|NO_SHOW_FEE|SESSION_CHARGE|SESSION_REFUND" }
      - { name: source, type: enum, source: system, description: "GIFT_CARD | CASH — funding instrument; for booking-linked payments it mirrors the booking's pay_source instrument", constraints: "GIFT_CARD|CASH" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents: positive = money taken from the member/card, negative = money returned" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------------------------ Membership.status
  - entity: Membership
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: FrontDesk
        preconditions:
          - "Membership.status == PENDING"
          - "MembershipPlan.active == true"
        side_effects:
          - "Sets cycle_index = 0, cycle_start_utc = clock_now, cycle_end_utc = clock_now + CYCLE_LENGTH_DAYS days"
          - "Snapshots monthly_fee_cents_snapshot from the plan"
          - "Creates a CreditLedgerEntry {reason: GRANT, delta: +included_floats_per_cycle, booking_id: null}"
          - "Recomputes Membership.credit_balance (= sum of ledger deltas)"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew"
        actor: FrontDesk
        preconditions:
          - "Membership.status == ACTIVE"
          - "expected_membership_version matches Membership.version (OCC)"
        side_effects:
          - "Rollover step (carry within cap): carried = min(credit_balance, rollover_cap); if credit_balance > rollover_cap, create CreditLedgerEntry {reason: EXPIRE, delta: -(credit_balance - rollover_cap)} first so balance == rollover_cap"
          - "Create CreditLedgerEntry {reason: GRANT, delta: +included_floats_per_cycle}"
          - "cycle_index += 1; cycle_start_utc = old cycle_end_utc; cycle_end_utc += CYCLE_LENGTH_DAYS days"
          - "Recomputes Membership.credit_balance; increments Membership.version by 1"

      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /memberships/{id}/mark-past-due"
        actor: FrontDesk
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "Credit balance frozen (no new CONSUME permitted while PAST_DUE)"

      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: FrontDesk
        preconditions:
          - "Membership.status == PAST_DUE"
        side_effects:
          - "Unfreezes credit consumption"

      - from: [PENDING, ACTIVE, PAST_DUE]
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: [Member, FrontDesk]
        preconditions:
          - "Membership.status != CANCELLED"
        side_effects:
          - "CASCADE step 1: if credit_balance > 0, create CreditLedgerEntry {reason: FORFEIT, delta: -credit_balance}"
          - "CASCADE step 2: that ledger insert recomputes Membership.credit_balance -> 0"
          - "computes refund value per refund_valuation calculation; emits Payment {kind: SESSION_REFUND} when applicable"

  # ------------------------------------------------------------------ Tank.operational_status (parallel dimension 1)
  - entity: Tank
    field: operational_status
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    note: "Independent of sanitation_status — the two dimensions evolve separately on the same Tank row."
    transitions:
      - from: IN_SERVICE
        to: MAINTENANCE
        trigger: "POST /tanks/{id}/maintenance"
        actor: Admin
        preconditions:
          - "Tank.operational_status == IN_SERVICE"
        side_effects:
          - "Tank cannot accept new Bookings while MAINTENANCE (independent of sanitation_status)"

      - from: MAINTENANCE
        to: IN_SERVICE
        trigger: "POST /tanks/{id}/return-to-service"
        actor: Admin
        preconditions:
          - "Tank.operational_status == MAINTENANCE"
        side_effects: []

      - from: [IN_SERVICE, MAINTENANCE]
        to: RETIRED
        trigger: "POST /tanks/{id}/retire"
        actor: Admin
        preconditions:
          - "Tank.operational_status != RETIRED"
          - "No Booking on this tank in RESERVED/CONFIRMED/RESCHEDULED/CHECKED_IN"
        side_effects:
          - "Tank permanently unbookable"

  # ------------------------------------------------------------------ Tank.sanitation_status (parallel dimension 2)
  - entity: Tank
    field: sanitation_status
    initial_state: CLEAN
    terminal_states: []
    note: "Independent of operational_status. Driven by SanitationCycle lifecycle and session completion."
    transitions:
      - from: CLEAN
        to: IN_CYCLE
        trigger: "system — SanitationCycle created on this tank (auto on booking completion or manual deep-clean)"
        actor: system
        preconditions:
          - "An IN_PROGRESS SanitationCycle exists for this tank"
        side_effects:
          - "Tank unbookable for check-in while IN_CYCLE"

      - from: IN_CYCLE
        to: CLEAN
        trigger: "POST /sanitation-cycles/{id}/complete"
        actor: FrontDesk
        preconditions:
          - "SanitationCycle.status == IN_PROGRESS"
          - "clock_now >= SanitationCycle.ends_utc"
          - "No other IN_PROGRESS SanitationCycle remains for this tank"
        side_effects:
          - "SanitationCycle.status -> COMPLETED; Tank.sanitation_status -> CLEAN"

  # ------------------------------------------------------------------ Orientation.status
  - entity: Orientation
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /orientations/{id}/complete"
        actor: FrontDesk
        preconditions:
          - "Orientation.status == SCHEDULED"
          - "clock_now >= Orientation.start_utc"
        side_effects:
          - "CROSS-ENTITY: Member.orientation_completed -> true"
          - "CROSS-ENTITY: Member.waiver_signed_version -> Orientation.waiver_version"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /orientations/{id}/cancel"
        actor: [Member, FrontDesk]
        preconditions:
          - "Orientation.status == SCHEDULED"
        side_effects:
          - "Frees the attendant interval"

  # ------------------------------------------------------------------ Booking.status (cyclic core)
  - entity: Booking
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: [Member, FrontDesk]
        preconditions:
          - "Booking.status == RESERVED"
          - "CROSS-ENTITY: Member.orientation_completed == true"
          - "CROSS-ENTITY: Member.waiver_signed_version >= CURRENT_WAIVER_VERSION"
          - "CROSS-ENTITY: Member.status == ACTIVE (not SUSPENDED)"
        side_effects:
          - "Deposit confirmed held (Payment {kind: DEPOSIT_HOLD} already recorded at creation remains)"

      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST /bookings/{id}/reschedule"
        actor: [Member, FrontDesk]
        preconditions:
          - "Booking.status == CONFIRMED"
          - "clock_now <= start_utc - RESCHEDULE_CUTOFF_HOURS hours"
          - "New [new_start_utc, new_end + turnover) does not overlap another active Booking on the tank (resource_temporal_overlap, buffer semantics)"
        side_effects:
          - "Updates start_utc/end_utc to the new window; deposit untouched (money conserved)"

      - from: RESCHEDULED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: [Member, FrontDesk]
        preconditions:
          - "Booking.status == RESCHEDULED"
        side_effects:
          - "Re-confirms the new window (cycle back to CONFIRMED)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Booking.status == CONFIRMED"
          - "clock_now >= start_utc - CHECKIN_LEAD_MINUTES minutes"
          - "CROSS-ENTITY: Tank.operational_status == IN_SERVICE"
          - "CROSS-ENTITY: Tank.sanitation_status == CLEAN"
          - "For pay_source=CREDIT: Membership.status == ACTIVE and credit_balance >= credits_required"
        side_effects:
          - "For pay_source=CREDIT: create CreditLedgerEntry {reason: CONSUME, delta: -(credits_required)}; set credits_consumed; recompute Membership.credit_balance"
          - "For pay_source=GIFT_CARD: create Payment {kind: SESSION_CHARGE, source: GIFT_CARD, amount_cents: +provisional_charge_cents}; recompute GiftCard.remaining_balance_cents"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: FrontDesk
        preconditions:
          - "Booking.status == CHECKED_IN"
        side_effects:
          - "Computes final_charge_cents (final_session_charge calculation)"
          - "CASCADE L1: create SanitationCycle {kind: TURNOVER, tank_id, booking_id, duration_minutes = tank.turnover_buffer_minutes, status: IN_PROGRESS}"
          - "CASCADE L2: that SanitationCycle insert flips Tank.sanitation_status CLEAN -> IN_CYCLE"
          - "CASCADE L3: Tank entering IN_CYCLE auto-cancels every RESERVED Booking on that tank whose start_utc < new SanitationCycle.ends_utc -> status CANCELLED, refund their deposits via Payment {kind: DEPOSIT_REFUND}"
          - "Deposit released: Payment {kind: DEPOSIT_REFUND} for this booking"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /bookings/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Booking.status == CONFIRMED"
          - "clock_now >= start_utc + NO_SHOW_GRACE_MINUTES minutes"
        side_effects:
          - "Deposit forfeited: Payment {kind: NO_SHOW_FEE, amount_cents: +deposit_cents}"
          - "CROSS-ENTITY: Member.no_show_strikes += 1; if no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD, Member.status -> SUSPENDED"

      - from: [RESERVED, CONFIRMED, RESCHEDULED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: [Member, FrontDesk]
        preconditions:
          - "Booking.status in {RESERVED, CONFIRMED, RESCHEDULED}"
        side_effects:
          - "Timely cancel (clock_now <= start_utc - CANCEL_CUTOFF_HOURS hours): refund deposit via Payment {kind: DEPOSIT_REFUND, amount_cents: -deposit_cents, source = booking instrument}"
          - "Late cancel (clock_now > start_utc - CANCEL_CUTOFF_HOURS hours): forfeit deposit via Payment {kind: LATE_FEE, amount_cents: +deposit_cents, source = booking instrument}"
          - "DEPOSIT_REFUND with source=GIFT_CARD restores the gift card balance (compensating invariant: card balance unchanged across hold+refund)"
          - "If a CREDIT booking had been CHECKED_IN, credits would already be consumed; cancel is not allowed from CHECKED_IN (state precondition)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: membership-renew-stale-version
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/renew"
    occ_field: "expected_membership_version"
    description: |
      Renewing a Membership whose version has advanced since the client last
      observed it is rejected. A renewal rolls credits, grants the new cycle's
      floats, and advances the billing window — under the product spec a fresh
      renewal legitimately supersedes the client's stale view of the membership.
      A renewal carrying a version older than the membership's current version is
      rejected as stale rather than double-applying the cycle advance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- DUAL-VARIANT #1 (Booking domain): provisional vs final session charge
  - name: provisional_session_charge
    trigger: "Booking creation (POST /bookings)"
    algorithm: tiered_pricing
    formula: |
      # Estimate at booking time, from the BOOKED session_minutes.
      base = retail_float_cents(plan)                         # one-float retail for the plan tier
      if session_minutes == 90: base = round(base * NINETY_MIN_MULTIPLIER)   # round per the multiplier line
      if is_couples: base = base * 2                          # couples occupies both chambers
      if membership_id is not null and Membership.status == ACTIVE:
          base = round(base * (1 - member_discount_pct(plan)))   # member discount applied AFTER couples doubling
      provisional_charge_cents = base
    input_set: "Booked session_minutes; plan rate card snapshot; couples flag; membership presence/discount."
    constants:
      NINETY_MIN_MULTIPLIER: 1.4
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed once at booking creation from the BOOKED session_minutes"
        difference: "uses booked minutes and plan discount; never recomputed after creation"

  - name: final_session_charge
    trigger: "Booking completion (POST /bookings/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      # Settle at completion from REALIZED minutes (realized_minutes defaults to session_minutes).
      base = retail_float_cents(plan)
      if realized_minutes == 90: base = round(base * NINETY_MIN_MULTIPLIER)
      if is_couples: base = base * 2 + COUPLES_SURCHARGE_CENTS    # couples surcharge applies ONLY at final settle
      if membership_id is not null and Membership.status == ACTIVE:
          base = round(base * (1 - member_discount_pct(plan)))
      final_charge_cents = base
    input_set: "Realized session_minutes at completion; couples surcharge; plan discount."
    constants:
      NINETY_MIN_MULTIPLIER: 1.4
      COUPLES_SURCHARGE_CENTS: 1500
    precision: "integer cents, round_half_up"
    variants:
      - name: final
        when: "computed at completion"
        difference: "adds COUPLES_SURCHARGE_CENTS for couples bookings that the provisional estimate omitted — so provisional_charge_cents != final_charge_cents for any couples booking"

  # ---- DUAL-VARIANT #2 (Membership domain): refund valuation on cancel
  - name: refund_valuation
    trigger: "Membership cancellation (POST /memberships/{id}/cancel)"
    algorithm: dual_variant
    formula: |
      # Two valid valuations of the unused portion of a cancelled membership.
      # The scaffold PINS prorated_value as authoritative; consumed_basis is the
      # alternate the test contrasts against.
      days_total     = CYCLE_LENGTH_DAYS
      days_remaining = max(0, ceil((cycle_end_utc - clock_now) / 1 day))
      VARIANT prorated_value  = round(monthly_fee_cents_snapshot * days_remaining / days_total)   # forward-looking
      floats_taken   = count(CreditLedgerEntry where reason==CONSUME and membership_id==this) within current cycle
      VARIANT consumed_basis  = max(0, monthly_fee_cents_snapshot - floats_taken * retail_float_cents(plan))  # chronological
      refund_cents = prorated_value      # AUTHORITATIVE
    input_set: "Days remaining in current cycle vs floats actually consumed this cycle."
    constants:
      CYCLE_LENGTH_DAYS: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: prorated_value
        when: "AUTHORITATIVE — emitted as the refund"
        difference: "forward-looking days-remaining proration of the monthly fee"
      - name: consumed_basis
        when: "alternate interpretation the test contrasts against (NOT emitted)"
        difference: "chronological: fee minus retail value of floats already consumed; diverges from prorated_value for identical inputs"

  # ---- COMBINATORIAL #2(b): rollover with per-line rounding order pinned
  - name: rollover_credit
    trigger: "Membership renewal (POST /memberships/{id}/renew)"
    algorithm: aggregation
    formula: |
      # Order is PINNED: (1) compute overflow, (2) EXPIRE overflow, (3) GRANT new floats.
      # carried credits are integers (whole floats) — no fractional rounding on the count,
      # but the EXPIRE/GRANT entries MUST be written in this order so credit_balance is
      # well-defined at each step.
      pre_balance   = credit_balance                          # before renewal
      overflow      = max(0, pre_balance - rollover_cap)
      # STEP 1 (if overflow > 0): CreditLedgerEntry {EXPIRE, delta: -overflow}  -> balance = rollover_cap
      # STEP 2: CreditLedgerEntry {GRANT, delta: +included_floats_per_cycle}    -> balance = min(pre_balance, rollover_cap) + included_floats_per_cycle
      post_balance  = min(pre_balance, rollover_cap) + included_floats_per_cycle
    input_set: "Pre-renewal credit_balance, plan rollover_cap, plan included_floats_per_cycle."
    precision: "integer credits"

  # ---- COMBINATORIAL #1(c): no-show / deposit fee with circular-looking dependency
  - name: deposit_and_fee
    trigger: "Booking creation (deposit) and cancel/no-show (fee)"
    algorithm: threshold
    formula: |
      # deposit_cents and the cancel/no-show fee are coupled: the fee is keyed on the
      # deposit which is keyed on the booking's couples flag and the session tier.
      # Evaluation order PINNED: deposit first (depends only on inputs), THEN fee (depends on deposit).
      deposit_cents = DEPOSIT_FLAT_CENTS
      if is_couples: deposit_cents = deposit_cents * 2
      # fee on late-cancel / no-show:
      if late_cancel or no_show: fee_cents = deposit_cents          # full forfeit
      else (timely cancel):      refund_cents = deposit_cents       # full refund
    input_set: "Couples flag; whether the cancel/no-show is timely vs late (clock vs CANCEL_CUTOFF_HOURS / NO_SHOW_GRACE_MINUTES)."
    constants:
      DEPOSIT_FLAT_CENTS: 2000
      CANCEL_CUTOFF_HOURS: 24
      NO_SHOW_GRACE_MINUTES: 15
    precision: "integer cents"

  # ---- credit requirement helper
  - name: credits_required
    trigger: "Booking check-in (CREDIT pay_source)"
    algorithm: aggregation
    formula: |
      credits_required = 2 if is_couples else 1
    input_set: "Couples flag."
    precision: "integer credits"

  # ---- session timing windows (constants referenced by Booking/Orientation preconditions)
  - name: session_timing_windows
    trigger: "Booking/Orientation transition timing checks"
    algorithm: threshold
    formula: |
      check_in_allowed    : clock_now >= start_utc - CHECKIN_LEAD_MINUTES minutes
      reschedule_allowed  : clock_now <= start_utc - RESCHEDULE_CUTOFF_HOURS hours      # inclusive (<=)
      cancel_timely       : clock_now <= start_utc - CANCEL_CUTOFF_HOURS hours          # inclusive (<=) -> DEPOSIT_REFUND
      no_show_allowed     : clock_now >= start_utc + NO_SHOW_GRACE_MINUTES minutes      # inclusive (>=)
      orientation_complete_allowed : clock_now >= Orientation.start_utc
      sanitation_complete_allowed  : clock_now >= SanitationCycle.ends_utc
      member_confirm_waiver: Member.waiver_signed_version >= CURRENT_WAIVER_VERSION
      member_suspend       : Member.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD -> Member.status=SUSPENDED
    input_set: "Logical clock vs each booking/orientation/cycle timestamp; member waiver/strike counters."
    constants:
      CHECKIN_LEAD_MINUTES: 60
      RESCHEDULE_CUTOFF_HOURS: 12
      CANCEL_CUTOFF_HOURS: 24
      NO_SHOW_GRACE_MINUTES: 15
      CURRENT_WAIVER_VERSION: 1
      NO_SHOW_SUSPEND_THRESHOLD: 3
    precision: "n/a (boolean gates)"

  # ---- derived: gift-card remaining balance
  - name: gift_card_balance
    trigger: "Any Payment with source=GIFT_CARD referencing the card"
    algorithm: aggregation
    formula: |
      remaining_balance_cents = initial_balance_cents - sum(Payment.amount_cents
                                  for Payment where source==GIFT_CARD and gift_card_id==this)
      # DEPOSIT_REFUND / SESSION_REFUND carry negative amount_cents, so they ADD back.
      # status -> DEPLETED when remaining_balance_cents == 0.
    input_set: "All GIFT_CARD payments for this card."
    precision: "integer cents, never negative"

  # ---- derived: membership credit balance (ledger reconciliation)
  - name: credit_balance_reconcile
    trigger: "Any CreditLedgerEntry insert for the membership"
    algorithm: aggregation
    formula: |
      credit_balance = sum(CreditLedgerEntry.delta for entries where membership_id == this)
    input_set: "All ledger entries for the membership."
    precision: "integer credits, never negative under valid play"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7; entity_backed Member acting on a resource it does not own is forbidden"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and FK body ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums in range, end_utc > start_utc, session_minutes in {60,90}"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT"

  - priority: 4.5
    category: business_constraint
    check: "Numeric fields within range: monthly_fee_cents >= 0, member_discount_pct in [0,1], retail_float_cents > 0, gift card initial_balance_cents > 0, included_floats_per_cycle >= 0, rollover_cap >= 0"
    error_id: ERR_VALIDATION_RANGE
    http_status: 422
    applies_to: "POST /plans, POST /gift-cards, POST /tanks"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5.5
    category: business_referential
    check: "Activating a membership requires its MembershipPlan.active == true"
    error_id: ERR_PLAN_INACTIVE
    http_status: 409
    applies_to: "POST /memberships/{id}/activate"

  - priority: 5.6
    category: business_referential
    check: "Booking with pay_source=GIFT_CARD requires the gift card status == ACTIVE (not VOID/DEPLETED)"
    error_id: ERR_GIFT_CARD_INACTIVE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 5.7
    category: business_constraint
    check: "Retiring a tank requires no Booking on it in {RESERVED, CONFIRMED, RESCHEDULED, CHECKED_IN}"
    error_id: ERR_TANK_HAS_BOOKINGS
    http_status: 409
    applies_to: "POST /tanks/{id}/retire"

  - priority: 6
    category: business_referential
    check: "Couples booking requires a DUAL tank; GIFT_CARD pay_source requires gift_card_id; CREDIT pay_source requires a membership_id"
    error_id: ERR_TANK_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 7
    category: business_safety
    check: "Tank must be CLEAN (sanitation) and IN_SERVICE (operational) to accept a check-in"
    error_id: ERR_TANK_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/check-in"

  - priority: 8
    category: business_referential
    check: "Confirming a booking requires the member to have completed orientation and signed the current waiver version, and to be ACTIVE (not SUSPENDED)"
    error_id: ERR_MEMBER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 9
    category: business_temporal
    check: "Booking window [start, end + tank.turnover_buffer) must not overlap another active Booking on the same tank"
    error_id: ERR_TANK_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/reschedule"

  - priority: 10
    category: business_temporal
    check: "Orientation window [start, end) must not overlap another SCHEDULED Orientation on the same attendant"
    error_id: ERR_ATTENDANT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /orientations"

  - priority: 11
    category: business_fiscal
    check: "CREDIT check-in requires Membership.credit_balance >= credits_required; GIFT_CARD requires remaining_balance_cents >= provisional_charge_cents"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /bookings/{id}/check-in"

  - priority: 12
    category: business_temporal
    check: "Reschedule allowed only at or before start_utc - RESCHEDULE_CUTOFF_HOURS; no-show allowed only at or after start_utc + NO_SHOW_GRACE_MINUTES; sanitation complete allowed only at or after ends_utc"
    error_id: ERR_TIMING_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /bookings/{id}/reschedule, POST /bookings/{id}/no-show, POST /sanitation-cycles/{id}/complete"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_membership_version must equal Membership.version on renew"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /memberships/{id}/renew"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- test-driving: logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All deadline/cutoff/window rules read this clock."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: datetime }"
    side_effects: ["Sets logical clock to to_iso8601"]

  # ---------- MembershipPlan ----------
  - method: POST
    path: "/plans"
    description: "Create a membership plan (config)"
    roles: [Admin]
    code: 201
    input: [tier, monthly_fee_cents, included_floats_per_cycle, rollover_cap, retail_float_cents, "member_discount_pct?", "active?"]
    output: MembershipPlan
    side_effects: []

  - method: GET
    path: "/plans/{id}"
    description: "Get a plan"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  - method: GET
    path: "/plans"
    description: "List plans"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: MembershipPlan[]
    side_effects: []

  # ---------- Member ----------
  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [Admin, FrontDesk]
    code: 201
    input: [email, full_name]
    output: Member
    side_effects: ["status=ACTIVE, orientation_completed=false, waiver_signed_version=0, no_show_strikes=0"]

  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members"
    roles: [Admin, FrontDesk]
    code: 200
    input: ["limit?", "offset?"]
    output: Member[]
    side_effects: []

  # ---------- Membership ----------
  - method: POST
    path: "/memberships"
    description: "Open a membership (PENDING) for a member on a plan"
    roles: [Admin, FrontDesk]
    code: 201
    input: [member_id, plan_id]
    output: Membership
    side_effects: ["status=PENDING, cycle_index=0, credit_balance=0"]

  - method: GET
    path: "/memberships/{id}"
    description: "Get a membership"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/memberships"
    description: "List memberships, filterable by member or plan"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: ["member_id?", "plan_id?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/memberships/{id}/activate"
    description: "Activate a PENDING/PAST_DUE membership (records first/return payment)"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: Membership
    side_effects: ["PENDING->ACTIVE: grants included floats, sets cycle window, snapshots fee", "PAST_DUE->ACTIVE: unfreezes consumption"]

  - method: POST
    path: "/memberships/{id}/renew"
    description: "Renew (advance one billing cycle) — rolls credits within cap, grants new floats. OCC-guarded."
    roles: [Admin, FrontDesk]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects: ["EXPIRE overflow over rollover_cap; GRANT included floats; cycle_index+1; version+1"]

  - method: POST
    path: "/memberships/{id}/mark-past-due"
    description: "Mark an ACTIVE membership PAST_DUE (freezes credit consumption)"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: Membership
    side_effects: ["ACTIVE->PAST_DUE"]

  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel a membership; forfeits remaining credits and computes refund"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: Membership
    side_effects: ["FORFEIT remaining credits -> balance 0", "refund_valuation computed; Payment SESSION_REFUND when applicable"]

  - method: GET
    path: "/credit-ledger/{id}"
    description: "Get a single float-credit ledger entry"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: CreditLedgerEntry
    side_effects: []

  - method: GET
    path: "/credit-ledger"
    description: "List float-credit ledger entries, filterable by membership or booking"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: ["membership_id?", "booking_id?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []

  # ---------- Tank ----------
  - method: POST
    path: "/tanks"
    description: "Create a tank/pod"
    roles: [Admin]
    code: 201
    input: [name, capacity_kind, "turnover_buffer_minutes?"]
    output: Tank
    side_effects: ["operational_status=IN_SERVICE, sanitation_status=CLEAN"]

  - method: GET
    path: "/tanks/{id}"
