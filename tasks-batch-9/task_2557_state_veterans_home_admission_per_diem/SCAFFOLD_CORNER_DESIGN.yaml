      - name: endpoint_correct_is_conditional_on_paid_or_rejected_target
        claim_type: conditional_action
        grounds:
          - endpoints.POST_svh_per_diem_claims_id_correct
          - validations[priority=60,ERR_CLAIM_STATE_INVALID]
          - state_machines.PerDiemClaim
        distinguishing_aspect: |
          Correction is a conditional action gated on the TARGET's status being PAID or REJECTED: the
          same call with the same correct expected_claim_version is rejected with
          ERR_CLAIM_STATE_INVALID against a DRAFT target and against a SUBMITTED target, succeeds
          against a PAID target, and is rejected again against the DRAFT correction it just produced.
          The gate is therefore on the target's state, not on the caller's version bookkeeping.
        test_recipe:
          setup:
            - "One Resident admitted 2026-07-01 into a CERTIFIED NURSING unit of a RECOGNIZED home; a census run through 2026-07-31 produced 31 RESIDENT_DAY rows."
            - "An AUDITED_BASIS DRAFT claim for 2026-07 exists worth 31 * 11857 = 367567 cents."
            - "The logical clock stands at 2026-08-01T00:00:00Z, so 2026-07 is a closed month."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Fairholm State Veterans Home", state_code: "MN", recognition_effective_date: "2026-06-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Ines Barra", date_of_birth: "1941-08-08", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-07-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 3.00, assessment_date: "2026-07-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { nu_v: "$.data.version" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${nu_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${nu_v}", admission_date: "2026-07-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { res_id: "$.data.id" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-07-31" }
              as: StateProgramAdmin
              captures: { gen: "$.data.generated_census_day_count" }
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-07", basis: "AUDITED_BASIS" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c1_id: "$.data.id", c1_amt: "$.data.claim_amount_cents", c1_status0: "$.data.status", c1_v0: "$.data.version" }
          trigger:
            - call: "POST /svh/per-diem-claims/${c1_id}/correct"
              payload: { expected_claim_version: "${c1_v0}", correction_note: "too early" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { draft_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims/${c1_id}/submit"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c1_status1: "$.data.status", c1_v1: "$.data.version" }
            - call: "POST /svh/per-diem-claims/${c1_id}/correct"
              payload: { expected_claim_version: "${c1_v1}", correction_note: "still too early" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { submitted_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims/${c1_id}/adjudicate"
              payload: { outcome: "PAID", adjudication_note: "clean audit" }
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { c1_status2: "$.data.status", c1_paid: "$.data.paid_amount_cents", c1_v2: "$.data.version" }
            - call: "POST /svh/per-diem-claims/${c1_id}/correct"
              payload: { expected_claim_version: "${c1_v2}", correction_note: "rate audit rerun" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c2_id: "$.data.id", c2_status: "$.data.status", c2_gen: "$.data.correction_generation", c2_target: "$.data.corrects_claim_id", c2_month: "$.data.claim_month", c2_amt: "$.data.claim_amount_cents", c2_basis: "$.data.basis", c2_note: "$.data.adjudication_note", c2_v: "$.data.version" }
            - call: "POST /svh/per-diem-claims/${c2_id}/correct"
              payload: { expected_claim_version: "${c2_v}", correction_note: "correcting the correction" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c2_err: "$.data.error_id" }
            - call: "GET /svh/census-days"
              payload: { per_diem_claim_id: "${c2_id}", limit: 1 }
              as: BusinessOfficeManager
              captures: { c2_days: "$.meta.total_count" }
            - call: "GET /svh/census-days"
              payload: { per_diem_claim_id: "${c1_id}", limit: 1 }
              as: BusinessOfficeManager
              captures: { c1_days: "$.meta.total_count" }
          assert:
            - "gen == 31"
            - "c1_status0 == DRAFT"
            - "c1_amt == 367567"
            - "the correction against the DRAFT target returns HTTP 409"
            - "draft_err == ERR_CLAIM_STATE_INVALID"
            - "c1_status1 == SUBMITTED"
            - "the correction against the SUBMITTED target returns HTTP 409"
            - "submitted_err == ERR_CLAIM_STATE_INVALID"
            - "c1_status2 == PAID"
            - "c1_paid == 367567"
            - "the correction against the PAID target returns HTTP 201"
            - "c2_status == DRAFT"
            - "c2_gen == 1"
            - "c2_target == ${c1_id}"
            - "c2_month == 2026-07"
            - "c2_amt == 367567"
            - "c2_basis == AUDITED_BASIS"
            - "c2_note == rate audit rerun"
            - "the correction against the new DRAFT correction returns HTTP 409"
            - "c2_err == ERR_CLAIM_STATE_INVALID"
            - "c2_days == 31"
            - "c1_days == 0"

      - name: endpoint_discharge_action_cascades_to_posture_and_offers
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_svh_residents_id_discharge
          - endpoints.POST_svh__ops_census_run
        excluded_because:
          difficulty_instance: "transitive_cascade / discharge_cascade_bed_posture_then_waitlist_offer"
          rationale: |
            The §1.8 instance already drives the whole discharge cascade through the endpoint: resident
            to DISCHARGED, occupied_bed_count down, available_bed_count up, operational_posture back to
            OPEN, home active_resident_count down, and the next checkpoint offering the freed bed to the
            top-ranked ACTIVE entry. Every observable this endpoint produces is pinned there.

      - name: endpoint_claim_create_attributes_unattributed_days_only
        claim_type: standard_crud
        grounds:
          - endpoints.POST_svh_per_diem_claims
          - validations[priority=80,ERR_CLAIM_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / one_open_claim_per_care_unit_month"
          rationale: |
            The §1.8 instance pins exactly what creation may and may not do: a second open claim for the
            same (care_unit_id, claim_month) is rejected with ERR_CLAIM_PERIOD_OVERLAP while the same
            month on a different unit and the same unit in a different month both succeed, and the
            attribution of unclaimed CensusDay rows to the new claim is asserted row by row.

      - name: endpoint_trust_fund_reverse_action_conserves_balance
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_svh_trust_fund_transactions_id_reverse
          - calculations.trust_fund_running_balance
        excluded_because:
          difficulty_instance: "compensating_invariant / trust_fund_reversal_conserves_balance_exactly"
          rationale: |
            The §1.8 instance exercises the reverse endpoint end to end - REVERSAL row with the negated
            signed_amount_cents, reverses_transaction_id set, the target's reversed flag flipped, the
            running balance returning to its pre-transaction value to the cent, and the second reverse
            attempt rejected - so the corner section has no unclaimed observable left on this action.

  - section: errors
    instances:
      - name: err_unauthenticated_missing_header_or_unknown_role
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=10,ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Authentication is one rung above authorisation and above shape validation: an absent
          X-User-Role header, an absent X-User-ID header and an X-User-Role outside the seven declared
          roles all answer 401 ERR_UNAUTHENTICATED - not 403 ERR_ROLE_NOT_PERMITTED and not 422
          ERR_INVALID_REQUEST, even when the body is also malformed.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome exists so the addressed collection is non-empty."
            - "The literal sentinels below mean: as __NO_ROLE_HEADER__ = send the request with NO X-User-Role header at all; as_user_id __NO_USER_ID_HEADER__ = send it with NO X-User-ID header."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Gladstone State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
          trigger:
            - call: "GET /svh/veterans-homes"
              payload: { limit: 10 }
              as: "__NO_ROLE_HEADER__"
              as_user_id: "admin-1"
              captures: { no_role_err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes"
              payload: { limit: 10 }
              as: StateProgramAdmin
              as_user_id: "__NO_USER_ID_HEADER__"
              captures: { no_id_err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes"
              payload: { limit: 10 }
              as: "Janitor"
              as_user_id: "janitor-1"
              captures: { bad_role_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes"
              payload: { state_code: "MN" }
              as: "Janitor"
              as_user_id: "janitor-1"
              captures: { both_bad_err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes"
              payload: { limit: 10 }
              as: SurveyAgency
              as_user_id: "survey-1"
              captures: { ok_total: "$.meta.total_count" }
          assert:
            - "the header-less-role read returns HTTP 401"
            - "no_role_err == ERR_UNAUTHENTICATED"
            - "the header-less-user-id read returns HTTP 401"
            - "no_id_err == ERR_UNAUTHENTICATED"
            - "the unknown-role read returns HTTP 401"
            - "bad_role_err == ERR_UNAUTHENTICATED"
            - "the unknown-role write with a malformed body returns HTTP 401"
            - "both_bad_err == ERR_UNAUTHENTICATED"
            - "ok_total == 1"

      - name: err_addressed_row_not_found_ids_are_distinct
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ASSESSMENT_NOT_FOUND
          - errors.ERR_INCOME_RECORD_NOT_FOUND
          - errors.ERR_CARE_PLAN_NOT_FOUND
          - errors.ERR_CENSUS_DAY_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_TRANSACTION_NOT_FOUND
          - validations[priority=40]
        distinguishing_aspect: |
          Each addressable row type carries its OWN 404 id: the six ids below are never collapsed into
          one generic ERR_NOT_FOUND, and a write endpoint addressing a missing row 404s at priority 40
          before any state, ownership or business rule is consulted.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit; no assessments, income records, care plans, census days, claims or trust fund transactions exist."
            - "The ids `as_missing`, `ir_missing`, `cp_missing`, `cd_missing`, `cl_missing` and `tx_missing` are guaranteed absent."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Harlow State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
          trigger:
            - call: "POST /svh/clinical-assessments/as_missing/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { as_err: "$.data.error_id" }
            - call: "POST /svh/income-records/ir_missing/verify"
              payload: { decision: "VERIFIED" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { ir_err: "$.data.error_id" }
            - call: "GET /svh/care-plans/cp_missing"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { cp_err: "$.data.error_id" }
            - call: "GET /svh/census-days/cd_missing"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { cd_err: "$.data.error_id" }
            - call: "GET /svh/per-diem-claims/cl_missing"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { cl_err: "$.data.error_id" }
            - call: "GET /svh/trust-fund-transactions/tx_missing"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { tx_err: "$.data.error_id" }
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { unit_ok: "$.data.certification_status" }
          assert:
            - "every one of the six reads/writes above returns HTTP 404"
            - "as_err == ERR_ASSESSMENT_NOT_FOUND"
            - "ir_err == ERR_INCOME_RECORD_NOT_FOUND"
            - "cp_err == ERR_CARE_PLAN_NOT_FOUND"
            - "cd_err == ERR_CENSUS_DAY_NOT_FOUND"
            - "cl_err == ERR_CLAIM_NOT_FOUND"
            - "tx_err == ERR_TRANSACTION_NOT_FOUND"
            - "unit_ok == CERTIFIED"

      - name: err_role_check_precedes_ownership_and_survey_agency_cannot_admit
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations[priority=20,ERR_ROLE_NOT_PERMITTED]
          - validations[priority=50,ERR_NOT_RESOURCE_OWNER]
          - rbac.ResidentRepresentative
        distinguishing_aspect: |
          Three auth rungs are ordered and must not be conflated: the role rung (20) fires before the
          not-found rung (40) and before the ownership rung (50), so a ResidentRepresentative posting an
          income record for their OWN resident gets ERR_ROLE_NOT_PERMITTED rather than 201 or
          ERR_NOT_RESOURCE_OWNER, a ResidentRepresentative reading a MISSING resident gets
          ERR_RESIDENT_NOT_FOUND rather than ERR_NOT_RESOURCE_OWNER, and only a role-permitted read of
          somebody else's resident reaches ERR_NOT_RESOURCE_OWNER.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home."
            - "A second ELIGIBLE applicant holds an ACTIVE WaitlistEntry on the same unit with a SUBMITTED NURSING assessment, so an admission decision on them is otherwise legal."
            - "For ResidentRepresentative calls, X-User-ID is the addressed Resident.id when the caller is the owner and `outsider-1` when they are not."
