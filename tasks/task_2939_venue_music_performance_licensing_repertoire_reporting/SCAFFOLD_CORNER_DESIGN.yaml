            - "The first reinstate returned HTTP 409 with data.error_id == ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT, not ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL and not ERR_LICENSE_STATE_INVALID"
            - "After the 363761-cent payment Venue.${p1_id}.outstanding_balance_cents == 100000 exactly and the identical reinstate then succeeded"
            - "${back_status} is ACTIVE and ${back_reason} is null, so reinstatement clears the reason"
            - "Venue.${p1_id}.covered_share_bp went 4600 -> 0 on suspension and back to 4600 on reinstatement, while the rejected attempt left it at 0"

      - name: corner_validation_reinstatement_balance_gate_only_for_nonpayment
        claim_type: conditional_validation
        grounds:
          - validations.priority_21_ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT.check
          - entities.License.fields.suspension_reason
