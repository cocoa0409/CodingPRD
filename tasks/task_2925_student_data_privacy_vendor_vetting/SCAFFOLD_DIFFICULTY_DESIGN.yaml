            - "Vendor.${v_id}.privacy_posture == CLEAR"
            - "fourth trigger call: status == 200"
            - "ApplicationRequest.${req_id}.status == SUBMITTED"
            - "ApplicationRequest.${req_id}.priority_score == 60.50"
            - "ApplicationRequest.${req_id}.priority_band == STANDARD"
