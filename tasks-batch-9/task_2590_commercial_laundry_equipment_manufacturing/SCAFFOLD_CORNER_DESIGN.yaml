            - "GET /clm/station-logs?build_order_id=${b1} returns 3 items"

      - name: dossier_rejected_state_is_terminal_and_locks_reviews
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CertificationDossier
          - validations[priority=25]
          - errors[ERR_DOSSIER_STATE_INVALID]
        distinguishing_aspect: "A single REJECT on either dimension drives the dossier to the terminal REJECTED state, after which the still-PENDING second dimension can never be reviewed: the follow-up WATER APPROVE is 409 ERR_DOSSIER_STATE_INVALID and the model stays DRAFT forever on this dossier."
        test_recipe:
          setup: ["OPL-60-A with an IN_REVIEW dossier"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "REJECT", note: "kWh drift beyond tolerance" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
              captures: { err: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 200 and CertificationDossier.${d1}.dossier_state == REJECTED"
            - "CertificationDossier.${d1}.energy_review_state == REJECTED and water_review_state == PENDING"
            - "the second trigger call returns HTTP 409 with ${err} == ERR_DOSSIER_STATE_INVALID"
            - "CertificationDossier.${d1}.water_review_state is still PENDING and water_reviewer_user_id == null"
            - "CertificationDossier.${d1}.certified_at == null"
            - "MachineModel.${m1}.certification_state == DRAFT"

      - name: duplicate_training_completion_rejected_not_idempotent
        claim_type: idempotency
        grounds:
          - validations[priority=52]
          - errors[ERR_TRAINING_RECORD_DUPLICATE]
          - entities.Distributor.fields.completed_training_keys
        distinguishing_aspect: "Replaying the identical training-completion body is NOT a no-op: the second call is rejected 409 ERR_TRAINING_RECORD_DUPLICATE, and completed_training_keys keeps exactly one entry so trained_technician_count cannot be inflated by retries."
        test_recipe:
          setup: ["Distributor D-01 in PENDING_TRAINING with one DISTRIBUTOR-employed technician T-201"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-201", full_name: "Rosa Diaz", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t201: $.data.id }
          trigger:
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { err: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 200 and Distributor.${dist}.distributor_state == PENDING_TRAINING (self-loop, threshold not met)"
            - "Distributor.${dist}.completed_training_keys contains exactly 1 entry"
            - "Distributor.${dist}.installation_training_state == IN_PROGRESS"
            - "the second trigger call returns HTTP 409 with ${err} == ERR_TRAINING_RECORD_DUPLICATE"
            - "Distributor.${dist}.completed_training_keys still contains exactly 1 entry and trained_technician_count == 1"
            - "Distributor.${dist}.version advanced by exactly 1 across both calls"

      - name: clock_advance_expires_technician_and_retires_rebate_program
        claim_type: valid_transition
        grounds:
          - state_machines.Technician
          - state_machines.RebateProgram
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "One clock advance drives two independent time-triggered transitions at once and reports both counts in the same response: an ACTIVE technician whose cert_expires_on is exactly the new instant becomes EXPIRED (the boundary is inclusive) while a program whose effective_to has passed becomes RETIRED."
        test_recipe:
          setup:
            - "Technician T-100 ACTIVE with cert_expires_on 2026-09-01T00:00:00Z"
            - "RebateProgram UTIL-A-W1 ACTIVE with effective_to 2026-08-31T00:00:00Z"
          setup_api_calls:
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-100", full_name: "Ann Ito", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t1: $.data.id }
            - call: "POST /clm/technicians/${t1}/certification-actions"
              payload: { action: "GRANT", scopes: ["DRUM_FAB"], expires_on: "2026-09-01T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/rebate-programs"
              payload: { program_code: "UTIL-A-W1", utility_code: "UTIL-A", program_class: "COMBINED", eligible_product_lines: ["ON_PREMISES"], max_water_gal_per_cwt: 1.10, max_kwh_per_cwt: 0.45, min_capacity_rating_lb: 40, rebate_base_cents: 50000, capacity_bonus_cents_per_10lb: 10000, rebate_cap_cents: 70000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-co-01"
              captures: { rp1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "u-pm-01"
          assert:
            - "the trigger returns HTTP 200"
            - "data.current_utc == 2026-09-01T00:00:00Z"
            - "data.expired_technician_count == 1"
            - "data.retired_program_count == 1"
            - "Technician.${t1}.cert_state == EXPIRED with cert_scopes and cert_expires_on left untouched"
            - "RebateProgram.${rp1}.program_state == RETIRED"

      - name: distributor_probation_then_reinstatement_cycle
        claim_type: cyclic
        grounds:
          - state_machines.Distributor
          - endpoints[POST /clm/distributors/{id}/status-actions]
          - entities.Distributor.fields.probation_reason
        distinguishing_aspect: "AUTHORIZED -> PROBATION -> AUTHORIZED is a true cycle: the second visit to AUTHORIZED is indistinguishable from the first on probation_reason (reset to NONE) yet the version counter proves three mutations, and the training ledger that produced the first authorization is never replayed."
        test_recipe:
          setup: ["Distributor D-01 driven to AUTHORIZED by INSTALLATION for T-201 and PAYMENT_SYSTEMS for T-202"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
