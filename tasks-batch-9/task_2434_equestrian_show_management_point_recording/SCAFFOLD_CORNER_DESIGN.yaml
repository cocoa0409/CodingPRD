        grounds:
          - endpoints.POST_/rings/{id}/footing-maintenance
          - calculations.ring_schedule_layout
          - validations.priority_41
          - validations.priority_42
          - errors.ERR_RING_SLOT_OVERLAP
          - errors.ERR_SLOT_OUTSIDE_SHOW_WINDOW
        distinguishing_aspect: |
          The maintenance cascade is conditional on new_footing_condition_score <
          MIN_FOOTING_SCORE (60). At EXACTLY 60 the ring stays AVAILABLE, the booked
          class slot keeps its SCHEDULED status and the chairing officials keep their
          minutes — only the MAINTENANCE slot is added. The overlap check is itself
          conditional: it is evaluated only on this passing branch, so the 14:05
          request collides with the 14:00 class slot, while the window check applies
          unconditionally on both branches.
