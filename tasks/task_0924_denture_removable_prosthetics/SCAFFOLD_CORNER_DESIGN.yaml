        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request that carries no X-User-Role header is stopped at rung 1 with ERR_UNAUTHENTICATED and HTTP 401, ahead of every authorization, existence and gate check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "GET /prosthetics/patients"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID header"
            - "the trigger returns HTTP 401"
            - "${err} == ERR_UNAUTHENTICATED"

