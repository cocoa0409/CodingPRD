# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Electronics Trade-In & Device Repair Storefront — Expert
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_provisional_vs_final_invoice
        grounds:
          - calculations.repair_estimate_total
          - state_machines.RepairTicket.IN_REPAIR_to_COMPLETED
          - entities.Estimate.fields.final_total_cents
        distinguishing_aspect: "On a RepairTicket, provisional estimate (2 labor hours, reserved part) yields 20000 while the final invoice (3 actual hours, same installed part) yields 25000 — a repair-domain dual-variant divergence."
        test_recipe:
          setup:
            - "STANDARD technician, non-warranty ticket, spend_cap 100000, one part @6000 reserved qty1, estimate labor_hours=2 (provisional 20000), completed with actual_labor_hours=3 (final 25000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z1", serial_number: "SN1", market_value_cents: 40000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tia", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "B1" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P6000", name: "Screen", unit_price_cents: 6000, on_hand_qty: 10 }
              as: StoreManager
              captures: { part: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "cracked", is_under_warranty: false, spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { rtv: $.data.version }
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${part}", quantity: 1 }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 2, expected_repair_ticket_version: "${rtv}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est: $.data.id, prov: $.data.provisional_total_cents }
            - call: "POST /repair-tickets/${tkt}/estimates/${est}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /repair-tickets/${tkt}/complete"
              payload: { actual_labor_hours: 3 }
              as: Technician
              as_user_id: "${tech}"
              captures: { inv: $.data.final_invoice_cents }
          assert:
            - "Estimate.${est}.provisional_total_cents == 20000"
            - "Estimate.${est}.final_total_cents == 25000"
            - "RepairTicket.${tkt}.final_invoice_cents == 25000"
            - "Estimate.${est}.provisional_total_cents != Estimate.${est}.final_total_cents"

      - name: tradein_quoted_vs_final_payout
        grounds:
          - calculations.trade_in_payout
          - state_machines.TradeIn.SUBMITTED_to_OFFER_MADE
          - entities.TradeIn.fields.final_payout_cents
        distinguishing_aspect: "On a TradeIn, quoted payout from declared grade A is 89109 while final payout from assessed grade C is 44555 — a buyback-domain dual-variant divergence on a different entity than the estimate."
        test_recipe:
          setup:
            - "Device market_value 99010; trade-in declared_grade A (quoted 89109); technician offers assessed_grade C, no accessories, no defects (final 44555)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo", email: "bo@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z2", serial_number: "SN2", market_value_cents: 99010 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ty", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust}", device_id: "${dev}", declared_grade: "A" }
              as: ServiceAdvisor
              captures: { ti: $.data.id, quoted: $.data.quoted_payout_cents }
          trigger:
            - call: "POST /trade-ins/${ti}/offer"
              payload: { assessed_grade: "C", has_accessories: false, assessed_cosmetic_defect_count: 0 }
              as: Technician
              as_user_id: "${tech}"
              captures: { fin: $.data.final_payout_cents }
          assert:
            - "TradeIn.${ti}.quoted_payout_cents == 89109"
            - "TradeIn.${ti}.final_payout_cents == 44555"
            - "TradeIn.${ti}.quoted_payout_cents != TradeIn.${ti}.final_payout_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_total_tiered_labor_and_conditional_diagnostic
        grounds:
          - calculations.repair_estimate_total
          - entities.Technician.fields.certification_level
          - entities.RepairTicket.fields.is_under_warranty
        distinguishing_aspect: "Mode (a): total = tiered labor (MASTER 8000/hr x 2 = 16000) + parts (2x6000 + 1x3000 = 15000) + conditional diagnostic fee (0 because is_under_warranty) = 31000; three interacting inputs with a tier selection and a conditional waiver."
        test_recipe:
          setup:
            - "MASTER technician, warranty ticket, two part orders (P1 qty2 @6000, P2 qty1 @3000), estimate labor_hours=2."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy", email: "cy@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "LAPTOP", brand: "Acme", model: "L1", serial_number: "SN3", market_value_cents: 200000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Max", certification_level: "MASTER" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "B2" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P6000", name: "Screen", unit_price_cents: 6000, on_hand_qty: 10 }
              as: StoreManager
              captures: { p1: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P3000", name: "Battery", unit_price_cents: 3000, on_hand_qty: 10 }
              as: StoreManager
              captures: { p2: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "no boot", is_under_warranty: true, spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { rtv: $.data.version }
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${p1}", quantity: 2 }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${p2}", quantity: 1 }
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 2, expected_repair_ticket_version: "${rtv}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est: $.data.id }
          assert:
            - "Estimate.${est}.labor_cost_cents == 16000"
            - "Estimate.${est}.parts_cost_cents == 15000"
            - "Estimate.${est}.diagnostic_fee_cents == 0"
            - "Estimate.${est}.provisional_total_cents == 31000"

      - name: tradein_payout_round_then_sum
        grounds:
          - calculations.trade_in_payout
          - entities.Device.fields.market_value_cents
          - entities.TradeIn.fields.assessed_cosmetic_defect_count
        distinguishing_aspect: "Mode (b): with market_value 99010, grade C, accessories, 1 cosmetic defect, rounding each component first gives 44555 + 4951 - 2970 = 46536, which differs from sum-then-round (46535); the scaffold pins round-then-sum."
        test_recipe:
          setup:
            - "Device market_value 99010; technician offers assessed_grade C, has_accessories true, 1 cosmetic defect."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Di", email: "di@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z3", serial_number: "SN4", market_value_cents: 99010 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tk", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust}", device_id: "${dev}", declared_grade: "C" }
              as: ServiceAdvisor
              captures: { ti: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti}/offer"
              payload: { assessed_grade: "C", has_accessories: true, assessed_cosmetic_defect_count: 1 }
              as: Technician
              as_user_id: "${tech}"
              captures: { fin: $.data.final_payout_cents }
          assert:
            - "TradeIn.${ti}.final_payout_cents == 46536"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_ticket_estimate_reject_revision_cycle
        grounds:
          - state_machines.RepairTicket.AWAITING_APPROVAL_to_DIAGNOSING
          - state_machines.RepairTicket.DIAGNOSING_to_AWAITING_APPROVAL
          - entities.Estimate.fields.status
        distinguishing_aspect: "RepairTicket cycles AWAITING_APPROVAL -> DIAGNOSING (estimate reject) -> AWAITING_APPROVAL (new estimate), a revision loop on the ticket entity; the superseded first estimate is SUPERSEDED."
        test_recipe:
          setup:
            - "Ticket diagnosed, first estimate SENT (ticket AWAITING_APPROVAL)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ed", email: "ed@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z4", serial_number: "SN5", market_value_cents: 40000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Te", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "B3" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "cracked", spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { rtv1: $.data.version }
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 2, expected_repair_ticket_version: "${rtv1}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est1: $.data.id }
          trigger:
            - call: "POST /repair-tickets/${tkt}/estimates/${est1}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { st_after_reject: $.data.status }
            - call: "GET /repair-tickets/${tkt}"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
              captures: { tkt_state_diag: $.data.status, rtv2: $.data.version }
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 3, expected_repair_ticket_version: "${rtv2}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est2: $.data.id }
          assert:
            - "Estimate.${est1}.status == REJECTED after the reject, then SUPERSEDED after est2 is created"
            - "RepairTicket.${tkt}.status == DIAGNOSING immediately after reject"
            - "RepairTicket.${tkt}.status == AWAITING_APPROVAL after est2 creation"
            - "Estimate.${est2}.revision_number == 2"

      - name: tradein_dispute_regrade_cycle
        grounds:
          - state_machines.TradeIn.OFFER_MADE_to_SUBMITTED
          - state_machines.TradeIn.SUBMITTED_to_OFFER_MADE
          - entities.TradeIn.fields.final_payout_cents
        distinguishing_aspect: "TradeIn cycles OFFER_MADE -> SUBMITTED (dispute) -> OFFER_MADE (re-offer), a re-grade loop on a different entity than the ticket; dispute clears final_payout_cents to null."
        test_recipe:
          setup:
            - "Trade-in offered (OFFER_MADE) with assessed_grade B."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fi", email: "fi@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z5", serial_number: "SN6", market_value_cents: 50000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tf", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust}", device_id: "${dev}", declared_grade: "B" }
              as: ServiceAdvisor
              captures: { ti: $.data.id }
            - call: "POST /trade-ins/${ti}/offer"
              payload: { assessed_grade: "B", has_accessories: false, assessed_cosmetic_defect_count: 0 }
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /trade-ins/${ti}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { st_after_dispute: $.data.status }
            - call: "POST /trade-ins/${ti}/offer"
              payload: { assessed_grade: "A", has_accessories: false, assessed_cosmetic_defect_count: 0 }
              as: Technician
              as_user_id: "${tech}"
              captures: { st_after_reoffer: $.data.status }
          assert:
            - "TradeIn.${ti}.status == SUBMITTED immediately after dispute"
            - "TradeIn.${ti}.final_payout_cents == null immediately after dispute"
            - "TradeIn.${ti}.status == OFFER_MADE after re-offer"
            - "TradeIn.${ti}.final_payout_cents == 45000 after re-offer (grade A: round(50000*0.90))"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: complete_cascade_finalize_install_decrement
        grounds:
          - state_machines.RepairTicket.IN_REPAIR_to_COMPLETED
          - state_machines.Estimate.APPROVED_to_FINALIZED
          - state_machines.PartOrder.RESERVED_to_INSTALLED
        distinguishing_aspect: "Depth-4 chain from complete: RepairTicket->COMPLETED causes Estimate->FINALIZED, which causes RESERVED PartOrder->INSTALLED, which causes Part.on_hand_qty 10->8; each link is caused by the previous."
        test_recipe:
          setup:
            - "Ticket IN_REPAIR with an APPROVED estimate and one RESERVED part order qty2 on a part with on_hand 10."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gi", email: "gi@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z6", serial_number: "SN7", market_value_cents: 60000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tg", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "B4" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P6000", name: "Screen", unit_price_cents: 6000, on_hand_qty: 10 }
              as: StoreManager
              captures: { part: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "cracked", spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { rtv: $.data.version }
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${part}", quantity: 2 }
              as: Technician
              as_user_id: "${tech}"
              captures: { po: $.data.id }
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 2, expected_repair_ticket_version: "${rtv}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est: $.data.id }
            - call: "POST /repair-tickets/${tkt}/estimates/${est}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /repair-tickets/${tkt}/complete"
              payload: { actual_labor_hours: 2 }
              as: Technician
              as_user_id: "${tech}"
          assert:
            - "RepairTicket.${tkt}.status == COMPLETED"
            - "Estimate.${est}.status == FINALIZED"
            - "PartOrder.${po}.status == INSTALLED"
            - "Part.${part}.on_hand_qty == 8"
            - "Part.${part}.reserved_qty == 0"
            - "Part.${part}.available_qty == 8"

      - name: cancel_cascade_return_release_inventory
        grounds:
          - state_machines.RepairTicket.DIAGNOSING_to_CANCELLED
          - state_machines.PartOrder.RESERVED_to_RETURNED
          - calculations.part_availability
        distinguishing_aspect: "Depth-3 chain from a different trigger (cancel): RepairTicket->CANCELLED causes RESERVED PartOrder->RETURNED, which causes Part.reserved_qty 2->0; distinct propagation origin from the complete cascade."
        test_recipe:
          setup:
            - "Ticket DIAGNOSING with one RESERVED part order qty2 on a part with on_hand 10 (reserved 2, available 8)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ha", email: "ha@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z7", serial_number: "SN8", market_value_cents: 60000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Th", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "B5" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P6000", name: "Screen", unit_price_cents: 6000, on_hand_qty: 10 }
              as: StoreManager
              captures: { part: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "cracked", spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${part}", quantity: 2 }
              as: Technician
              as_user_id: "${tech}"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /repair-tickets/${tkt}/cancel"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "RepairTicket.${tkt}.status == CANCELLED"
            - "PartOrder.${po}.status == RETURNED"
            - "Part.${part}.reserved_qty == 0"
            - "Part.${part}.on_hand_qty == 10"
            - "Part.${part}.available_qty == 10"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: estimate_approve_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: "state (ERR_ESTIMATE_NOT_SENT, priority 5) outranks business_fiscal (ERR_SPEND_CAP_EXCEEDED, priority 10): approving a REJECTED estimate whose total also exceeds the spend cap returns the state error, not the fiscal one."
        test_recipe:
          setup:
            - "Ticket with an estimate whose provisional_total 20000 exceeds spend_cap 5000; estimate then REJECTED (ticket back to DIAGNOSING)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ir", email: "ir@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z8", serial_number: "SN9", market_value_cents: 40000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ti", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "B6" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "cracked", spend_cap_cents: 5000 }
              as: ServiceAdvisor
