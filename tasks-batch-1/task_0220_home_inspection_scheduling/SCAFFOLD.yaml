# =============================================================================
# Home Inspection Scheduling & Reporting — Seed Tables (§1.0–§1.7)
# Difficulty tier: EXPERT
# =============================================================================

scenario: |
  Home Inspection Scheduling & Reporting: inspection type (buyer/seller/4-point/wind-mit),
  inspector scheduling/territory, fee by square footage, add-on (radon/termite/sewer),
  defect-severity report, re-inspection, agent/client delivery, scheduling conflict

domain_name: home-inspection-scheduling
# Flat/hybrid multi-collection API: top-level resource collections (/territories,
# /fee-schedules, /inspectors, /clients, /agents, /properties, /inspection-orders,
# /reports, /addons) live at the root, so the api_prefix is the root path.
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency       # OCC on InspectionOrder.version for re-inspection create-with-supersede
    - cascading_side_effects       # order delivery / cancellation propagate across report, defects, deliveries
    - dual_variant_calculation     # quoted vs final fee; provisional vs final defect-risk score
    - derived_field_reconciliation # inspector scheduled-minutes ledger, order amount_due ledger

  entity_topology: hybrid
  # Tree: InspectionOrder -> {AddOn, Report -> Defect, Delivery}. Cross-cutting flat
  # FKs to Inspector / Property / Client / Agent / FeeSchedule, plus a self-referential
  # parent_order_id on InspectionOrder for re-inspections.

  state_machine_shape: branching
  # InspectionOrder branches (deliver vs cancel vs reinspect) and Report forks
  # (APPROVED vs REJECTED) with a REJECTED -> DRAFT revision cycle.

  relationship_patterns:
    - one_to_many        # Order -> AddOn / Delivery; Report -> Defect
    - self_referential   # InspectionOrder.parent_order_id -> InspectionOrder.id (re-inspection)
    - cross_aggregate    # Order references Inspector, Property, Client, Agent, FeeSchedule

  role_model: peer_roles
  # Inspector owns report authorship & completion; Client/Agent own ordering & delivery
  # receipt; Scheduler is an opaque operational role that books/cancels/reassigns.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Territory display name" }
      - { name: zip_codes, type: array, source: input, description: "Array of 5-digit ZIP strings served by this territory; each ZIP belongs to exactly one territory" }
      - { name: travel_buffer_minutes, type: integer, source: input, description: "Minutes of travel buffer applied after each appointment in this territory before the next can begin", default: 30, constraints: "0..240" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: label, type: string, source: input, description: "Human label for this pricing version e.g. 2026-Q2" }
      - { name: base_rate_cents, type: integer, source: input, description: "Flat base fee component in cents applied to every order", constraints: ">= 0" }
      - { name: tier1_max_sqft, type: integer, source: input, description: "Upper bound (inclusive) of tier 1 square footage", default: 2000, constraints: "> 0" }
      - { name: tier2_max_sqft, type: integer, source: input, description: "Upper bound (inclusive) of tier 2 square footage", default: 4000, constraints: "> tier1_max_sqft" }
      - { name: tier1_rate_cents_per_sqft, type: integer, source: input, description: "Per-sqft cents for sqft within tier 1 (sqft <= tier1_max_sqft)", constraints: ">= 0" }
      - { name: tier2_rate_cents_per_sqft, type: integer, source: input, description: "Per-sqft cents for sqft within tier 2 (tier1_max_sqft < sqft <= tier2_max_sqft)", constraints: ">= 0" }
      - { name: tier3_rate_cents_per_sqft, type: integer, source: input, description: "Per-sqft cents for sqft above tier2_max_sqft", constraints: ">= 0" }
      - { name: addon_radon_cents, type: integer, source: input, description: "Add-on price in cents for RADON", constraints: ">= 0" }
      - { name: addon_termite_cents, type: integer, source: input, description: "Add-on price in cents for TERMITE", constraints: ">= 0" }
      - { name: addon_sewer_cents, type: integer, source: input, description: "Add-on price in cents for SEWER", constraints: ">= 0" }
      - { name: reinspection_discount_pct, type: number, source: input, description: "Fraction (0..1) of the recomputed fee waived on a re-inspection order", default: 0.5, constraints: "0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED. Only PUBLISHED schedules may be pinned to a new order.", default: "DRAFT", constraints: "DRAFT, PUBLISHED" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Inspector" }
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the single territory this inspector serves" }
      - { name: certifications, type: array, source: input, description: "Array of InspectionType enum values this inspector is certified to perform; subset of {BUYER, SELLER, FOUR_POINT, WIND_MIT}" }
      - { name: daily_capacity_minutes, type: integer, source: input, description: "Maximum bookable on-site minutes per calendar day", default: 480, constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. Suspended inspectors cannot be booked.", default: "ACTIVE", constraints: "ACTIVE, SUSPENDED" }

  - name: Client
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Client" }
      - { name: full_name, type: string, source: input, description: "Client name" }
      - { name: email, type: string, source: input, description: "Client contact email; used for delivery records" }
      - { name: role_in_deal, type: enum, source: input, description: "BUYER | SELLER", constraints: "BUYER, SELLER" }

  - name: Agent
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Agent" }
      - { name: full_name, type: string, source: input, description: "Real estate agent name" }
      - { name: email, type: string, source: input, description: "Agent contact email; used for delivery records" }
      - { name: brokerage, type: string, source: input, description: "Brokerage name" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: zip_code, type: string, source: input, description: "5-digit ZIP; must fall inside some ACTIVE Territory.zip_codes" }
      - { name: square_footage, type: integer, source: input, description: "Recorded living-area square footage used for fee tiering", constraints: "> 0" }
      - { name: year_built, type: integer, source: input, description: "Year the dwelling was built; gates FOUR_POINT eligibility", constraints: "1850..2100" }

  - name: InspectionOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property being inspected" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the ordering client" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; the agent on the deal (delivery recipient)" }
      - { name: fee_schedule_id, type: string, source: input, description: "FK -> FeeSchedule.id; PUBLISHED schedule pinned to this order at creation" }
      - { name: inspector_id, type: string, source: system, description: "FK -> Inspector.id; assigned at scheduling, null while REQUESTED" }
      - { name: parent_order_id, type: string, source: input, description: "FK -> InspectionOrder.id; set only on re-inspection orders, null otherwise" }
      - { name: order_kind, type: enum, source: system, description: "PRIMARY | REINSPECTION. REINSPECTION when parent_order_id is set.", default: "PRIMARY", constraints: "PRIMARY, REINSPECTION" }
      - { name: inspection_type, type: enum, source: input, description: "BUYER | SELLER | FOUR_POINT | WIND_MIT", constraints: "BUYER, SELLER, FOUR_POINT, WIND_MIT" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start of the on-site appointment; null while REQUESTED" }
      - { name: scheduled_date, type: string, source: computed, description: "YYYY-MM-DD calendar date (UTC) derived from scheduled_start; used for per-day capacity and same-property conflict checks" }
      - { name: duration_minutes, type: integer, source: computed, description: "On-site minutes for this order, derived from inspection_type base duration plus per-add-on duration" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | IN_PROGRESS | REPORT_DRAFT | DELIVERED | CANCELLED", default: "REQUESTED", constraints: "REQUESTED, SCHEDULED, IN_PROGRESS, REPORT_DRAFT, DELIVERED, CANCELLED" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Forward-looking fee computed at scheduling from Property.square_footage at that time (see calc inspection_fee, variant=QUOTED)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final fee computed at delivery from Report.measured_square_footage (see calc inspection_fee, variant=FINAL); null until DELIVERED" }
      - { name: amount_paid_cents, type: integer, source: system, description: "Cumulative cents recorded as paid via payment endpoint", default: 0 }
      - { name: amount_refunded_cents, type: integer, source: system, description: "Cumulative cents refunded on cancellation", default: 0 }
      - { name: amount_due_cents, type: integer, source: computed, description: "Outstanding balance: effective_fee - amount_paid_cents + amount_refunded_cents (see calc order_balance)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: AddOn
    parent: InspectionOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; the order this add-on attaches to" }
      - { name: kind, type: enum, source: input, description: "RADON | TERMITE | SEWER; unique per order", constraints: "RADON, TERMITE, SEWER" }
      - { name: price_cents, type: integer, source: computed, description: "Price pinned from the order's FeeSchedule add-on price at add-on creation" }
      - { name: added_duration_minutes, type: integer, source: computed, description: "On-site minutes this add-on contributes (RADON 30, TERMITE 20, SEWER 45)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED. REMOVED add-ons stop contributing to fee and duration.", default: "ACTIVE", constraints: "ACTIVE, REMOVED" }

  - name: Report
    parent: InspectionOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; the order this report documents (1:1)" }
      - { name: measured_square_footage, type: integer, source: input, description: "Square footage measured on site; drives FINAL fee variant", constraints: "> 0" }
      - { name: provisional_risk_score, type: integer, source: computed, description: "Weighted defect-severity score over ALL non-VOIDED defects (see calc defect_risk_score, variant=PROVISIONAL)" }
      - { name: final_risk_score, type: integer, source: computed, description: "Weighted defect-severity score over CONFIRMED defects only (see calc defect_risk_score, variant=FINAL); null until report APPROVED" }
      - { name: severity_band, type: enum, source: computed, description: "PASS | MINOR | MAJOR | CRITICAL derived from final_risk_score at approval; PASS when zero defects", constraints: "PASS, MINOR, MAJOR, CRITICAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED", default: "DRAFT", constraints: "DRAFT, SUBMITTED, APPROVED, REJECTED, VOIDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Defect
    parent: Report
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: report_id, type: string, source: input, description: "FK -> Report.id; the report this defect belongs to" }
      - { name: location, type: string, source: input, description: "Where the defect was found" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL; weights 1/4/10 respectively", constraints: "MINOR, MAJOR, CRITICAL" }
      - { name: status, type: enum, source: system, description: "LOGGED | CONFIRMED | CLEARED | VOIDED. LOGGED at creation; resolved at report approval.", default: "LOGGED", constraints: "LOGGED, CONFIRMED, CLEARED, VOIDED" }

  - name: Delivery
    parent: InspectionOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; the delivered order" }
      - { name: recipient_kind, type: enum, source: system, description: "CLIENT | AGENT", constraints: "CLIENT, AGENT" }
      - { name: recipient_email, type: string, source: system, description: "Email captured from Client/Agent at delivery time" }
      - { name: severity_band_snapshot, type: enum, source: system, description: "Report severity_band copied at delivery", constraints: "PASS, MINOR, MAJOR, CRITICAL" }
      - { name: status, type: enum, source: system, description: "SENT | CANCELLED. CANCELLED when the owning order is cancelled.", default: "SENT", constraints: "SENT, CANCELLED" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  - entity: InspectionOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /inspection-orders/{id}/schedule"
        actor: Scheduler
        preconditions:
          - "Order.status == REQUESTED"
          - "Inspector exists, Inspector.status == ACTIVE (cross-entity: Order->Inspector)"
          - "Order.inspection_type is in Inspector.certifications"
          - "Property.zip_code is in the Inspector's Territory.zip_codes"
          - "If inspection_type == FOUR_POINT: Property.year_built <= FOUR_POINT_MAX_YEAR_BUILT"
          - "scheduled_start does not double-book the inspector under travel-buffer overlap (ERR_INSPECTOR_DOUBLE_BOOKED)"
          - "duration_minutes + inspector's already-booked minutes on scheduled_date <= Inspector.daily_capacity_minutes (ERR_DAILY_CAPACITY_EXCEEDED)"
          - "No other non-terminal InspectionOrder for the same property_id shares scheduled_date (ERR_PROPERTY_SAME_DAY_CONFLICT)"
        side_effects:
          - "Assigns inspector_id, scheduled_start; computes scheduled_date and duration_minutes"
          - "Computes quoted_fee_cents via calc inspection_fee variant=QUOTED (Property.square_footage)"
          - "Debits Inspector daily scheduled-minutes ledger for scheduled_date by duration_minutes (calc inspector_daily_load)"
          - "increments InspectionOrder.version by 1"

      - from: SCHEDULED
        to: REQUESTED
        trigger: "POST /inspection-orders/{id}/unschedule"
        actor: Scheduler
        preconditions:
          - "Order.status == SCHEDULED"
        side_effects:
          - "Clears inspector_id, scheduled_start, scheduled_date, quoted_fee_cents"
          - "Credits the Inspector daily scheduled-minutes ledger for the prior scheduled_date by duration_minutes (calc inspector_daily_load) — compensating action, net load unchanged"
          - "increments InspectionOrder.version by 1"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspection-orders/{id}/start"
        actor: Inspector
        preconditions:
          - "Order.status == SCHEDULED"
          - "Acting Inspector.id == Order.inspector_id"
        side_effects:
          - "increments InspectionOrder.version by 1"

      - from: IN_PROGRESS
        to: REPORT_DRAFT
        trigger: "POST /inspection-orders/{id}/report (creates the Report)"
        actor: Inspector
        preconditions:
          - "Order.status == IN_PROGRESS"
          - "Acting Inspector.id == Order.inspector_id"
          - "No Report already exists for this order"
        side_effects:
          - "Creates Report in DRAFT with measured_square_footage; provisional_risk_score = 0"
          - "increments InspectionOrder.version by 1"

      - from: REPORT_DRAFT
        to: DELIVERED
        trigger: "POST /inspection-orders/{id}/deliver"
        actor: Scheduler
        preconditions:
          - "Order.status == REPORT_DRAFT"
          - "Report.status == APPROVED (cross-entity: Order->Report)"
          - "Order.amount_due_cents <= 0 (order fully paid; business_fiscal)"
        side_effects:
          - "Computes final_fee_cents via calc inspection_fee variant=FINAL (Report.measured_square_footage)"
          - "CASCADE link 1: Report DRAFT/APPROVED record -> Report.status becomes DELIVERED-locked (delivered_marker); APPROVED Report transition to delivered set"
          - "CASCADE link 2: creates two Delivery rows (CLIENT, AGENT) in SENT, snapshotting Report.severity_band"
          - "CASCADE link 3: each Delivery creation stamps Order.amount_due_cents recompute via calc order_balance with final fee"
          - "increments InspectionOrder.version by 1"

      - from: [REQUESTED, SCHEDULED, IN_PROGRESS, REPORT_DRAFT]
        to: CANCELLED
        trigger: "POST /inspection-orders/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "Order.status in {REQUESTED, SCHEDULED, IN_PROGRESS, REPORT_DRAFT}"
        side_effects:
          - "If was SCHEDULED/IN_PROGRESS/REPORT_DRAFT: credits Inspector daily scheduled-minutes ledger by duration_minutes (compensating, net load unchanged)"
          - "Refunds amount_paid_cents: amount_refunded_cents += amount_paid_cents (compensating, money conserved)"
          - "CASCADE link 1: any Report on this order -> VOIDED"
          - "CASCADE link 2 (caused by Report VOIDED): all that Report's non-VOIDED Defects -> VOIDED"
          - "Any SENT Delivery on this order -> CANCELLED"
          - "increments InspectionOrder.version by 1"

      - from: DELIVERED
        to: SCHEDULED
        trigger: "POST /inspection-orders/{parent_id}/reinspect (creates a NEW REINSPECTION order, then schedules it)"
        actor: Scheduler
        note: "This row documents the NEW re-inspection order's lifecycle entry, not a transition of the parent. The new order is created in REQUESTED then immediately SCHEDULED in one call."
        preconditions:
          - "Parent Order.status == DELIVERED"
          - "Parent Report.severity_band in {MAJOR, CRITICAL} (only failing inspections warrant re-inspection)"
          - "expected_order_version matches parent InspectionOrder.version (OCC; ERR_STALE_VERSION on mismatch)"
          - "scheduled_start is at least MIN_REINSPECTION_GAP_HOURS after parent Order.scheduled_start (ERR_REINSPECTION_TOO_SOON)"
          - "All inspector/territory/capacity/same-day checks as a normal schedule"
        side_effects:
          - "Creates new InspectionOrder with order_kind=REINSPECTION, parent_order_id=parent.id, status=SCHEDULED"
          - "Computes quoted_fee_cents via calc inspection_fee variant=QUOTED then applies reinspection_discount_pct (calc reinspection_fee)"
          - "Debits Inspector daily scheduled-minutes ledger for the new scheduled_date"
          - "increments parent InspectionOrder.version by 1 (records the spawned child)"

  - entity: Report
    field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reports/{id}/submit"
        actor: Inspector
        preconditions:
          - "Report.status == DRAFT"
          - "Acting Inspector.id == owning Order.inspector_id"
          - "Owning Order.status == REPORT_DRAFT"
        side_effects:
          - "Recomputes provisional_risk_score over all non-VOIDED defects (calc defect_risk_score variant=PROVISIONAL)"
          - "increments Report.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reports/{id}/approve"
        actor: Scheduler
        preconditions:
          - "Report.status == SUBMITTED"
        side_effects:
          - "Resolves each LOGGED defect: MAJOR/CRITICAL -> CONFIRMED, MINOR -> CLEARED"
          - "Computes final_risk_score over CONFIRMED defects (calc defect_risk_score variant=FINAL)"
          - "Computes severity_band from final_risk_score (calc severity_band)"
          - "increments Report.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reports/{id}/reject"
        actor: Scheduler
        preconditions:
          - "Report.status == SUBMITTED"
        side_effects:
          - "increments Report.version by 1"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /reports/{id}/revise"
        actor: Inspector
        preconditions:
          - "Report.status == REJECTED"
          - "Acting Inspector.id == owning Order.inspector_id"
        note: "Revision cycle: REJECTED -> DRAFT -> SUBMITTED can repeat (cyclic shape)."
        side_effects:
          - "increments Report.version by 1"

      - from: [DRAFT, SUBMITTED, APPROVED, REJECTED]
        to: VOIDED
        trigger: "system (owning InspectionOrder cancelled)"
        actor: system
        preconditions:
          - "Owning InspectionOrder transitioned to CANCELLED"
        side_effects:
          - "All non-VOIDED Defects on this report -> VOIDED (cascade link caused by this VOID)"
          - "increments Report.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reinspect-stale-parent-order
    parent_entity: InspectionOrder
    write_endpoint: "POST /inspection-orders/{id}/reinspect"
    occ_field: "expected_order_version"
    description: |
      Creating a re-inspection against a parent InspectionOrder whose version has
      advanced since the client last observed it is rejected. A prior reinspect call
      against the same DELIVERED parent legitimately spawns a child re-inspection and
      bumps the parent's version (recording the spawn); a second create still carrying
      the pre-spawn version is rejected as stale rather than spawning a duplicate
      re-inspection for the same delivered order.
    error_id: ERR_STALE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:
  - name: inspection_fee
    trigger: "schedule (QUOTED variant), deliver (FINAL variant), reinspect (QUOTED then discounted)"
    algorithm: tiered_pricing
    formula: |
      Let S = the square footage input for the chosen variant.
      Let fs = the order's pinned FeeSchedule.

      # 1) Tiered square-footage component (marginal tiers, NOT average rate):
      sqft_t1 = min(S, fs.tier1_max_sqft)
      sqft_t2 = max(0, min(S, fs.tier2_max_sqft) - fs.tier1_max_sqft)
      sqft_t3 = max(0, S - fs.tier2_max_sqft)
      sqft_component_cents = sqft_t1 * fs.tier1_rate_cents_per_sqft
                           + sqft_t2 * fs.tier2_rate_cents_per_sqft
                           + sqft_t3 * fs.tier3_rate_cents_per_sqft

      # 2) Inspection-type multiplier applied to (base + sqft component):
      type_mult = TYPE_MULTIPLIER[inspection_type]   # BUYER 1.00, SELLER 0.90, FOUR_POINT 0.75, WIND_MIT 0.60
      typed_cents = round_half_up((fs.base_rate_cents + sqft_component_cents) * type_mult)

      # 3) Add-ons are flat and NOT multiplied by type_mult; sum ACTIVE add-on price_cents:
      addon_cents = sum(addon.price_cents for addon in order.addons if addon.status == ACTIVE)

      fee_cents = typed_cents + addon_cents
      # Evaluation order is pinned: tier -> type multiply (rounded) -> add add-ons.
    input_set: "ACTIVE add-ons only; VOIDED/REMOVED excluded."
    constants:
      TYPE_MULTIPLIER: { BUYER: 1.00, SELLER: 0.90, FOUR_POINT: 0.75, WIND_MIT: 0.60 }
    precision: "round_half_up to whole cents at the type-multiply step only; add-ons are integer cents (no further rounding)."
    variants:
      - name: QUOTED
        when: "at scheduling and at reinspect"
        difference: "S = Property.square_footage (the recorded value)."
      - name: FINAL
        when: "at delivery"
        difference: "S = Report.measured_square_footage (the on-site measured value); may differ from QUOTED when measured != recorded."

  - name: reinspection_fee
    trigger: "reinspect (after inspection_fee QUOTED is computed for the new order)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency made explicit:
      #   discounted_fee depends on quoted_fee, but the discount FRACTION is selected
      #   by a tier keyed on the PARENT order's final_fee_cents band. Evaluation order
      #   is pinned so the value is well-defined:
      #     step 1: quoted = inspection_fee(variant=QUOTED) for the new re-inspection order
      #     step 2: select discount fraction from parent.final_fee_cents band:
      #               parent.final_fee_cents <  50000          -> d = fs.reinspection_discount_pct
      #               50000 <= parent.final_fee_cents < 100000  -> d = fs.reinspection_discount_pct + 0.10
      #               parent.final_fee_cents >= 100000          -> d = min(fs.reinspection_discount_pct + 0.20, 0.90)
      #     step 3: reinspect_fee_cents = round_half_up(quoted * (1 - d))
      reinspect_fee_cents = round_half_up(quoted_fee_cents * (1 - d))
    input_set: "Parent order must be DELIVERED with final_fee_cents set."
    constants:
      BAND_LOW_CENTS: 50000
      BAND_HIGH_CENTS: 100000
      MAX_DISCOUNT: 0.90
    precision: "round_half_up to whole cents after multiplying by (1 - d)."

  - name: defect_risk_score
    trigger: "report submit (PROVISIONAL), report approve (FINAL)"
    algorithm: weighted_scoring
    formula: |
      Weights: MINOR=1, MAJOR=4, CRITICAL=10.
      Severity band multiplier applied per defect by location risk is NOT used; weights are flat.

      PROVISIONAL (at submit): over every Defect with status != VOIDED.
      FINAL (at approve): over every Defect with status == CONFIRMED.

      # Nested-rounding order is PINNED (mode b): the per-defect weighted contribution is
      # first scaled by SCORE_SCALE/COUNT_NORM and rounded to an integer PER DEFECT, THEN
      # summed — NOT summed-then-rounded. The two orders diverge whenever fractional parts
      # accumulate.
      #   per_defect_points(d) = round_half_up(WEIGHT[d.severity] * SCORE_SCALE / COUNT_NORM)
      #   risk_score = sum(per_defect_points(d) for d in included_defects)
    input_set: "PROVISIONAL: status != VOIDED. FINAL: status == CONFIRMED."
    constants:
      WEIGHT: { MINOR: 1, MAJOR: 4, CRITICAL: 10 }
      SCORE_SCALE: 100
      COUNT_NORM: 3
    precision: "round_half_up to integer per defect, then sum (per-item-then-sum order pinned)."
    variants:
      - name: PROVISIONAL
        when: "report submit"
        difference: "includes all non-VOIDED defects (LOGGED + any CONFIRMED/CLEARED)."
      - name: FINAL
        when: "report approve"
        difference: "includes only CONFIRMED defects; MINOR defects are CLEARED at approval and excluded."

  - name: severity_band
    trigger: "report approve"
    algorithm: threshold
    formula: |
      Given final_risk_score F (per-defect points: MINOR=33, MAJOR=133, CRITICAL=333):
        F == 0                 -> PASS      # empty/zero-defect boundary
        1   <= F <  133        -> MINOR
        133 <= F <  666        -> MAJOR     # one MAJOR defect (133) lands exactly on the MAJOR floor
        F >= 666               -> CRITICAL  # two CRITICAL defects (666) land exactly on the CRITICAL floor
    input_set: "final_risk_score on the report."
    constants:
      MINOR_FLOOR: 1
      MAJOR_FLOOR: 133
      CRITICAL_FLOOR: 666
    precision: "integer comparison; boundaries are inclusive on the floor (>=)."

  - name: inspector_daily_load
    trigger: "schedule (debit), unschedule/cancel (credit), reinspect (debit)"
    algorithm: aggregation
    formula: |
      For an Inspector and a calendar date D (UTC):
        booked_minutes(inspector, D) = sum(order.duration_minutes
            for order in InspectionOrders
            where order.inspector_id == inspector.id
              and order.scheduled_date == D
              and order.status in {SCHEDULED, IN_PROGRESS, REPORT_DRAFT, DELIVERED})
      Conserved invariant: scheduling debits and unschedule/cancel credits the SAME
      duration_minutes for the SAME date, so booked_minutes is always exactly the sum
      above (no drift). Capacity check at schedule: booked_minutes(after add) must be
      <= Inspector.daily_capacity_minutes.
    input_set: "Orders in {SCHEDULED, IN_PROGRESS, REPORT_DRAFT, DELIVERED} on date D for the inspector."
    precision: "integer minutes; tie-break on equal candidate dates not applicable (keyed by exact date string)."

  - name: order_balance
    trigger: "schedule (sets effective fee = quoted), deliver (effective fee = final), payment, cancel/refund"
    algorithm: aggregation
    formula: |
      effective_fee_cents =
        final_fee_cents      if Order.status == DELIVERED
        quoted_fee_cents     if Order.status in {SCHEDULED, IN_PROGRESS, REPORT_DRAFT}
        0                    if Order.status == REQUESTED
      amount_due_cents = effective_fee_cents - amount_paid_cents + amount_refunded_cents
      Conserved invariant (money): for a cancelled order, amount_refunded_cents ==
      amount_paid_cents (full refund), so net collected (amount_paid - amount_refunded) == 0.
    input_set: "Single order's own fee and payment/refund ledger fields."
    precision: "integer cents."

  - name: order_duration
    trigger: "schedule, reinspect, add-on create, add-on remove"
    algorithm: aggregation
    formula: |
      base = TYPE_BASE_MINUTES[inspection_type]   # BUYER 180, SELLER 150, FOUR_POINT 90, WIND_MIT 60
      addon_minutes = sum(addon.added_duration_minutes for addon in order.addons if addon.status == ACTIVE)
      duration_minutes = base + addon_minutes
    input_set: "ACTIVE add-ons only."
    constants:
      TYPE_BASE_MINUTES: { BUYER: 180, SELLER: 150, FOUR_POINT: 90, WIND_MIT: 60 }
      ADDON_DURATION: { RADON: 30, TERMITE: 20, SEWER: 45 }
    precision: "integer minutes."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "On create: required body fields present and well-typed (enum members valid, integers in range)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST/PUT/PATCH endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Acting Inspector is the order's assigned inspector for inspector-owned transitions (start/report/submit/revise)"
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403
    applies_to: "POST /inspection-orders/{id}/start, /report; POST /reports/{id}/submit, /revise"

  - priority: 7
    category: business_referential
    check: "At schedule: inspector certified for inspection_type AND property zip within inspector's territory AND FOUR_POINT year_built eligibility"
    error_id: ERR_INSPECTOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/schedule, /reinspect"

  - priority: 8
    category: business_referential
    check: "At schedule: property zip_code is inside the assigned inspector's territory zip_codes"
    error_id: ERR_TERRITORY_MISMATCH
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/schedule, /reinspect"

  - priority: 9
    category: business_temporal
    check: "At schedule: scheduled_start does not collide with another appointment of the same inspector under travel-buffer half-open overlap"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/schedule, /reinspect"

  - priority: 10
    category: business_temporal
    check: "At schedule: no other non-terminal order for the same property shares the scheduled calendar date"
    error_id: ERR_PROPERTY_SAME_DAY_CONFLICT
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/schedule, /reinspect"

  - priority: 11
    category: business_temporal
    check: "At reinspect: scheduled_start is at least MIN_REINSPECTION_GAP_HOURS after the parent order's scheduled_start"
    error_id: ERR_REINSPECTION_TOO_SOON
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/reinspect"

  - priority: 12
    category: business_constraint
    check: "At reinspect: parent report severity_band is MAJOR or CRITICAL"
    error_id: ERR_REINSPECTION_NOT_WARRANTED
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/reinspect"

  - priority: 13
    category: business_constraint
    check: "Add-on kind is unique per order; the order is REQUESTED or SCHEDULED (not yet started)"
    error_id: ERR_DUPLICATE_ADDON
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/addons"

  - priority: 14
    category: business_constraint
    check: "At schedule: adding duration_minutes keeps inspector's booked minutes on the date <= daily_capacity_minutes"
    error_id: ERR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/schedule, /reinspect"

  - priority: 15
    category: business_fiscal
    check: "At deliver: order is fully paid (amount_due_cents <= 0)"
    error_id: ERR_ORDER_UNPAID
    http_status: 402
    applies_to: "POST /inspection-orders/{id}/deliver"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_order_version matches the parent order's current version on reinspect"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /inspection-orders/{id}/reinspect"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:
  # --- Territory ---
  - method: POST
    path: "/territories"
    description: "Create a territory"
    roles: [Scheduler]
    code: 201
    input: [name, zip_codes, "travel_buffer_minutes?"]
    output: Territory
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/territories/{id}"
    description: "Get a territory"
    roles: [Scheduler, Inspector]
    code: 200
    input: []
    output: Territory
    side_effects: []

  - method: GET
    path: "/territories"
    description: "List territories"
    roles: [Scheduler, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Territory[]
    side_effects: []

  # --- FeeSchedule ---
  - method: POST
    path: "/fee-schedules"
    description: "Create a fee schedule (DRAFT)"
    roles: [Scheduler]
    code: 201
    input: [label, base_rate_cents, tier1_rate_cents_per_sqft, tier2_rate_cents_per_sqft, tier3_rate_cents_per_sqft, addon_radon_cents, addon_termite_cents, addon_sewer_cents, "tier1_max_sqft?", "tier2_max_sqft?", "reinspection_discount_pct?"]
    output: FeeSchedule
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/fee-schedules/{id}/publish"
    description: "Publish a fee schedule so it can be pinned to orders"
    roles: [Scheduler]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: ["status DRAFT -> PUBLISHED"]

  - method: GET
    path: "/fee-schedules/{id}"
    description: "Get a fee schedule"
    roles: [Scheduler, Inspector]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  # --- Inspector ---
  - method: POST
    path: "/inspectors"
    description: "Create an inspector"
    roles: [Scheduler]
    code: 201
    input: [full_name, territory_id, certifications, "daily_capacity_minutes?"]
    output: Inspector
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/inspectors/{id}"
    description: "Get an inspector"
    roles: [Scheduler, Inspector]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: GET
    path: "/inspectors"
    description: "List inspectors, optionally filtered by territory"
    roles: [Scheduler, Inspector]
    code: 200
    input: ["territory_id?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []

  - method: POST
    path: "/inspectors/{id}/suspend"
    description: "Suspend an inspector (cannot be newly booked)"
    roles: [Scheduler]
    code: 200
    input: []
    output: Inspector
    side_effects: ["status ACTIVE -> SUSPENDED"]

  - method: GET
    path: "/inspectors/{id}/daily-load"
    description: "Read an inspector's booked minutes for a given date"
    roles: [Scheduler, Inspector]
    code: 200
    input: [date]
    output: "{ inspector_id: string, date: string, booked_minutes: integer, daily_capacity_minutes: integer }"
    side_effects: []

  # --- Client / Agent ---
  - method: POST
    path: "/clients"
    description: "Create a client (buyer/seller)"
    roles: [Scheduler]
    code: 201
    input: [full_name, email, role_in_deal]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [Scheduler, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/agents"
    description: "Create an agent"
    roles: [Scheduler]
    code: 201
    input: [full_name, email, brokerage]
    output: Agent
    side_effects: []

  - method: GET
    path: "/agents/{id}"
    description: "Get an agent"
    roles: [Scheduler, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Create a property"
    roles: [Scheduler, Client, Agent]
    code: 201
    input: [address_line, zip_code, square_footage, year_built]
    output: Property
    side_effects: []

  - method: GET
    path: "/properties/{id}"
    description: "Get a property"
    roles: [Scheduler, Client, Agent]
    code: 200
    input: []
    output: Property
    side_effects: []

  # --- InspectionOrder lifecycle ---
  - method: POST
    path: "/inspection-orders"
    description: "Create a primary inspection order (REQUESTED)"
    roles: [Scheduler, Client, Agent]
    code: 201
    input: [property_id, client_id, agent_id, fee_schedule_id, inspection_type]
    output: InspectionOrder
    side_effects: ["status=REQUESTED, order_kind=PRIMARY, amount_paid_cents=0, amount_refunded_cents=0, version=1"]

  - method: GET
    path: "/inspection-orders/{id}"
    description: "Get an inspection order"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: []

  - method: GET
    path: "/inspection-orders"
    description: "List inspection orders, filterable by property/inspector/parent/status"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: ["property_id?", "inspector_id?", "parent_order_id?", "client_id?", "agent_id?", "fee_schedule_id?", "status?", "limit?", "offset?"]
    output: InspectionOrder[]
    side_effects: []

  - method: POST
    path: "/inspection-orders/{id}/schedule"
    description: "Schedule a REQUESTED order to an inspector and start time"
    roles: [Scheduler]
    code: 200
    input: [inspector_id, scheduled_start]
    output: InspectionOrder
    side_effects:
      - "status REQUESTED -> SCHEDULED; assigns inspector_id, scheduled_start, scheduled_date, duration_minutes"
      - "computes quoted_fee_cents (calc inspection_fee QUOTED) and amount_due_cents (calc order_balance)"
      - "debits inspector daily scheduled-minutes ledger"
      - "increments InspectionOrder.version by 1"

  - method: POST
    path: "/inspection-orders/{id}/unschedule"
    description: "Return a SCHEDULED order to REQUESTED, releasing the slot"
    roles: [Scheduler]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "status SCHEDULED -> REQUESTED; clears inspector_id, scheduled_start, scheduled_date, quoted_fee_cents"
      - "credits inspector daily scheduled-minutes ledger (compensating)"
      - "increments InspectionOrder.version by 1"

  - method: POST
    path: "/inspection-orders/{id}/start"
    description: "Inspector begins the on-site inspection"
    roles: [Inspector]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: ["status SCHEDULED -> IN_PROGRESS", "increments InspectionOrder.version by 1"]

  - method: POST
    path: "/inspection-orders/{id}/report"
    description: "Inspector creates the report, recording measured square footage"
    roles: [Inspector]
    code: 201
    input: [measured_square_footage]
    output: Report
    side_effects:
      - "creates Report (DRAFT, provisional_risk_score=0)"
      - "status IN_PROGRESS -> REPORT_DRAFT on the order"
      - "increments InspectionOrder.version by 1"

  - method: POST
    path: "/inspection-orders/{id}/pay"
    description: "Record a payment against the order"
    roles: [Scheduler, Client, Agent]
    code: 200
    input: [amount_cents]
    output: InspectionOrder
    side_effects:
      - "amount_paid_cents += amount_cents; recomputes amount_due_cents (calc order_balance)"
      - "increments InspectionOrder.version by 1"

  - method: POST
    path: "/inspection-orders/{id}/deliver"
    description: "Deliver the approved report to client and agent"
    roles: [Scheduler]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "status REPORT_DRAFT -> DELIVERED; computes final_fee_cents (calc inspection_fee FINAL); recomputes amount_due_cents"
      - "cascade: Report -> DELIVERED-locked; creates CLIENT + AGENT Delivery rows (SENT) snapshotting severity_band"
      - "increments InspectionOrder.version by 1"

  - method: POST
    path: "/inspection-orders/{id}/cancel"
    description: "Cancel a non-terminal order, refunding payment and voiding its report"
    roles: [Scheduler]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "status -> CANCELLED; credits inspector daily ledger if was booked; refunds amount_paid_cents"
      - "cascade: Report -> VOIDED -> its Defects -> VOIDED; SENT Deliveries -> CANCELLED"
      - "increments InspectionOrder.version by 1"

  - method: POST
    path: "/inspection-orders/{id}/reinspect"
    description: "Spawn and schedule a re-inspection order against a DELIVERED parent (OCC-guarded)"
    roles: [Scheduler]
    code: 201
    input: [inspector_id, scheduled_start, expected_order_version]
    output: InspectionOrder
    side_effects:
      - "creates new InspectionOrder (order_kind=REINSPECTION, parent_order_id={id}, status=SCHEDULED)"
      - "computes quoted_fee_cents then applies discount (calc reinspection_fee); debits inspector daily ledger"
      - "increments parent InspectionOrder.version by 1"

  # --- AddOn (child of order) ---
  - method: POST
    path: "/inspection-orders/{id}/addons"
    description: "Attach a RADON/TERMITE/SEWER add-on to a REQUESTED/SCHEDULED order"
    roles: [Scheduler, Client, Agent]
    code: 201
    input: [kind]
    output: AddOn
    side_effects:
      - "pins price_cents and added_duration_minutes from the order's FeeSchedule; status=ACTIVE"
      - "recomputes order duration_minutes (calc order_duration); if SCHEDULED, recomputes quoted_fee_cents"
      - "increments InspectionOrder.version by 1"

  - method: GET
    path: "/inspection-orders/{id}/addons"
    description: "List add-ons for an order"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: ["limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: POST
    path: "/addons/{id}/remove"
    description: "Remove an add-on from a not-yet-started order"
    roles: [Scheduler, Client, Agent]
    code: 200
    input: []
    output: AddOn
    side_effects:
      - "status ACTIVE -> REMOVED; recomputes order duration_minutes and (if SCHEDULED) quoted_fee_cents"
      - "increments InspectionOrder.version by 1"

  # --- Report ---
  - method: GET
    path: "/reports/{id}"
    description: "Get a report"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: GET
    path: "/inspection-orders/{id}/reports"
    description: "List the report(s) for an order (0 or 1)"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: ["limit?", "offset?"]
    output: Report[]
    side_effects: []

  - method: POST
    path: "/reports/{id}/submit"
    description: "Inspector submits the report for approval"
    roles: [Inspector]
    code: 200
    input: []
    output: Report
    side_effects: ["status DRAFT -> SUBMITTED; recomputes provisional_risk_score", "increments Report.version by 1"]

  - method: POST
    path: "/reports/{id}/approve"
    description: "Scheduler approves a submitted report, resolving defects and computing severity"
    roles: [Scheduler]
    code: 200
    input: []
    output: Report
    side_effects:
      - "status SUBMITTED -> APPROVED; resolves LOGGED defects; computes final_risk_score and severity_band"
      - "increments Report.version by 1"

  - method: POST
    path: "/reports/{id}/reject"
    description: "Scheduler rejects a submitted report"
    roles: [Scheduler]
    code: 200
    input: []
    output: Report
    side_effects: ["status SUBMITTED -> REJECTED", "increments Report.version by 1"]

  - method: POST
    path: "/reports/{id}/revise"
    description: "Inspector reopens a rejected report for revision"
    roles: [Inspector]
    code: 200
    input: []
    output: Report
    side_effects: ["status REJECTED -> DRAFT", "increments Report.version by 1"]

  # --- Defect (child of report) ---
  - method: POST
    path: "/reports/{id}/defects"
    description: "Log a defect on a DRAFT report"
    roles: [Inspector]
    code: 201
    input: [location, severity]
    output: Defect
    side_effects: ["status=LOGGED", "increments Report.version by 1"]

  - method: GET
    path: "/reports/{id}/defects"
    description: "List defects on a report"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: ["limit?", "offset?"]
    output: Defect[]
    side_effects: []

  # --- Delivery (child of order) ---
  - method: GET
    path: "/inspection-orders/{id}/deliveries"
    description: "List delivery records for an order"
    roles: [Scheduler, Inspector, Client, Agent]
    code: 200
    input: ["limit?", "offset?"]
    output: Delivery[]
    side_effects: []

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_NOT_ASSIGNED_INSPECTOR
    http: 403
    condition: "Acting inspector is not the order's assigned inspector for an inspector-owned transition"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or FK-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad enum, out-of-range value, or referencing a non-PUBLISHED fee schedule"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a valid state for the requested transition"
  - id: ERR_INSPECTOR_NOT_CERTIFIED
    http: 409
    condition: "Inspector not certified for the order's inspection_type, or FOUR_POINT requested on an ineligible (too-new) property"
  - id: ERR_TERRITORY_MISMATCH
    http: 409
    condition: "Property ZIP is not inside the assigned inspector's territory"
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "scheduled_start collides with the inspector's existing appointment under travel-buffer overlap"
  - id: ERR_PROPERTY_SAME_DAY_CONFLICT
    http: 409
    condition: "Another non-terminal order for the same property already occupies the requested calendar date"
  - id: ERR_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "Booking would push the inspector's booked minutes for the date above daily_capacity_minutes"
  - id: ERR_DUPLICATE_ADDON
    http: 409
    condition: "An ACTIVE add-on of the same kind already exists on the order, or the order has already started"
  - id: ERR_REINSPECTION_NOT_WARRANTED
    http: 409
    condition: "Parent report severity_band is not MAJOR or CRITICAL"
  - id: ERR_REINSPECTION_TOO_SOON
    http: 409
    condition: "Re-inspection scheduled_start is within MIN_REINSPECTION_GAP_HOURS of the parent's scheduled_start"
  - id: ERR_ORDER_UNPAID
    http: 402
    condition: "Deliver attempted while amount_due_cents > 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version does not match the parent order's current version on reinspect"
  - id: ERR_VALIDATION_RANGE
    http: 400
    condition: "Pagination limit/offset out of bounds, or date query param malformed"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: Scheduler
    description: "Operational dispatcher: manages config (territories, fee schedules, inspectors, clients, agents, properties), books/unschedules/cancels orders, approves/rejects reports, delivers, spawns re-inspections."
    identity: "opaque"
    exclusive_operations:
      - "POST /territories"
      - "POST /fee-schedules"
      - "POST /fee-schedules/{id}/publish"
      - "POST /inspectors"
      - "POST /inspectors/{id}/suspend"
      - "POST /clients"
      - "POST /agents"
      - "POST /inspection-orders/{id}/schedule"
      - "POST /inspection-orders/{id}/unschedule"
      - "POST /inspection-orders/{id}/deliver"
      - "POST /inspection-orders/{id}/cancel"
      - "POST /inspection-orders/{id}/reinspect"
      - "POST /reports/{id}/approve"
      - "POST /reports/{id}/reject"
    shared_operations:
      - "POST /properties (with Client, Agent)"
      - "POST /inspection-orders (with Client, Agent)"
      - "POST /inspection-orders/{id}/pay (with Client, Agent)"
      - "POST /inspection-orders/{id}/addons (with Client, Agent)"
      - "POST /addons/{id}/remove (with Client, Agent)"
      - "GET endpoints (with the roles each declares)"

  - name: Inspector
    description: "Field inspector who performs the on-site work and authors the report. Acts only on orders assigned to them."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspection-orders/{id}/start"
      - "POST /inspection-orders/{id}/report"
      - "POST /reports/{id}/submit"
      - "POST /reports/{id}/revise"
      - "POST /reports/{id}/defects"
    shared_operations:
      - "GET endpoints (territories, inspectors, fee-schedules, orders, reports, defects, addons, deliveries)"

  - name: Client
    description: "Buyer or seller who orders the inspection and receives the delivered report."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /properties (with Scheduler, Agent)"
      - "POST /inspection-orders (with Scheduler, Agent)"
      - "POST /inspection-orders/{id}/pay (with Scheduler, Agent)"
      - "POST /inspection-orders/{id}/addons (with Scheduler, Agent)"
      - "POST /addons/{id}/remove (with Scheduler, Agent)"
      - "GET /clients/{id}, /properties, /inspection-orders, /reports, /defects, /addons, /deliveries"

  - name: Agent
    description: "Real estate agent on the deal who can order, pay, and receives the delivered report."
    identity: "entity_backed:Agent"
    exclusive_operations: []
    shared_operations:
      - "POST /properties (with Scheduler, Client)"
      - "POST /inspection-orders (with Scheduler, Client)"
      - "POST /inspection-orders/{id}/pay (with Scheduler, Client)"
      - "POST /inspection-orders/{id}/addons (with Scheduler, Client)"
      - "POST /addons/{id}/remove (with Scheduler, Client)"
      - "GET /agents/{id}, /properties, /inspection-orders, /reports, /defects, /addons, /deliveries"

# -----------------------------------------------------------------------------
# Shared business constants referenced by §1.2/§1.4
# -----------------------------------------------------------------------------
business_constants:
  FOUR_POINT_MAX_YEAR_BUILT: 2000   # FOUR_POINT inspections only valid for dwellings built <= 2000
  MIN_REINSPECTION_GAP_HOURS: 48    # re-inspection must be >= 48h after the parent appointment start
