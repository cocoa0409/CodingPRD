          Priorities 10 and 11 are two halves of one idea and they pull in opposite
          directions: 11 says only the assigned analyst may act, 10 says the
          publisher must not be that analyst. Both are stated against the cycle's
          stored assigned_analyst_user_id, not against the acting role or against
          who happens to have touched the row before. This instance builds a cycle
          that analyst-1 creates but analyst-2 owns, which separates the two
          questions an implementation is tempted to fuse: analyst-1 is refused the
          scoring run it would have been allowed on any cycle of its own, and is then
          allowed to publish - wearing the PublishingReviewer role - precisely
          because it is not the assignee. A guard keyed on "whoever created or last
          wrote the cycle" would invert both outcomes.
