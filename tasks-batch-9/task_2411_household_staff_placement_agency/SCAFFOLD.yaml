    output: ReplacementClaim[]
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_PLACEMENT_NOT_FOUND, ERR_INVALID_ENUM]

  - method: POST
    path: /placements/{id}/payroll-handoffs
    purpose: "Prepare the household-employer payroll and tax guidance handoff."
    roles: [ComplianceOfficer]
    input: [provider_name, guidance_packet_version, "ein_status?"]
    output: PayrollHandoff
    side_effects:
      - "creates the PayrollHandoff in status PREPARED with ein_status defaulting to NOT_APPLIED"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_PLACEMENT_NOT_FOUND, ERR_PAYROLL_HANDOFF_EXISTS]

  - method: GET
    path: /placements/{id}/payroll-handoffs
    purpose: "List the placement's payroll handoff record."
    roles: [AgencyPrincipal, BillingAdministrator, ComplianceOfficer, Client]
    input: ["status?", "limit?", "offset?"]
    output: PayrollHandoff[]
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_PLACEMENT_NOT_FOUND, ERR_INVALID_ENUM]

  # ---- FeeMilestone --------------------------------------------------------
  - method: GET
    path: /fee-milestones/{id}
    purpose: "Read one milestone billing row."
    roles: [AgencyPrincipal, PlacementConsultant, BillingAdministrator, ComplianceOfficer, Client]
    input: []
    output: FeeMilestone
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_FEE_MILESTONE_NOT_FOUND]

  - method: POST
    path: /fee-milestones/{id}/invoice
    purpose: "Invoice a milestone and post the receivable."
    roles: [BillingAdministrator]
    input: ["note?"]
    output: FeeMilestone
    side_effects:
      - "FeeMilestone PENDING -> INVOICED, stamping invoiced_on, due_date = invoiced_on + NET_TERMS_DAYS, invoiced_by_user_id"
      - "appends a LedgerEntry FEE_INVOICED of +amount_cents and recomputes Client.outstanding_balance_cents"
      - "Placement.billing_status UNBILLED -> PARTIALLY_BILLED"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_FEE_MILESTONE_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_INVALID_STATE_TRANSITION, ERR_PLACEMENT_NOT_ACTIVE, ERR_PAYROLL_HANDOFF_NOT_ATTESTED]

  - method: POST
    path: /fee-milestones/{id}/record-payment
    purpose: "Record payment of a milestone in full."
    roles: [BillingAdministrator]
    input: [paid_amount_cents, payment_reference]
    output: FeeMilestone
    side_effects:
      - "FeeMilestone INVOICED / OVERDUE -> PAID, stamping paid_on and payment_reference"
      - "appends a LedgerEntry FEE_PAYMENT of -amount_cents and recomputes Client.outstanding_balance_cents"
      - "Placement.billing_status PARTIALLY_BILLED -> FULLY_BILLED once no PENDING milestone remains"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_RANGE, ERR_FEE_MILESTONE_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_MILESTONE_NOT_INVOICED, ERR_PAYMENT_AMOUNT_MISMATCH]

  - method: POST
    path: /fee-milestones/{id}/reverse
    purpose: "Reverse an invoiced milestone with a compensating ledger entry."
    roles: [BillingAdministrator]
    input: ["reason?"]
    output: FeeMilestone
    side_effects:
      - "FeeMilestone INVOICED / OVERDUE -> REVERSED"
      - "appends a LedgerEntry FEE_REVERSAL of -amount_cents and recomputes Client.outstanding_balance_cents, returning it to its exact pre-invoice value"
      - "Placement.billing_status -> REVERSED once no INVOICED / OVERDUE / PAID milestone remains"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_FEE_MILESTONE_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_MILESTONE_NOT_INVOICED]

  # ---- ReplacementClaim ----------------------------------------------------
  - method: GET
    path: /replacement-claims/{id}
    purpose: "Read one claim, including its prorated refund figures once decided."
    roles: [AgencyPrincipal, PlacementConsultant, BillingAdministrator, ComplianceOfficer, Client]
    input: []
    output: ReplacementClaim
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_REPLACEMENT_CLAIM_NOT_FOUND]

  - method: POST
    path: /replacement-claims/{id}/review
    purpose: "Open review, request more information, or decide the claim."
    roles: [AgencyPrincipal]
    input: [action, "decision_note?"]
    output: ReplacementClaim
    side_effects:
      - "action=OPEN_REVIEW: SUBMITTED -> UNDER_REVIEW"
      - "action=REQUEST_INFO: UNDER_REVIEW -> INFO_REQUESTED and increments info_request_round"
      - "action=APPROVE_REPLACEMENT: -> APPROVED_REPLACEMENT, Placement -> TERMINATED_REPLACED with PENDING milestones VOIDED, RoleRequisition PLACED -> SOURCING"
      - "action=APPROVE_REFUND: -> APPROVED_REFUND, runs calculations.replacement_refund_proration, Placement -> TERMINATED_REFUNDED with billing_status REFUNDED, appends a LedgerEntry REFUND_ISSUED of -net_refund_cents and recomputes Client.outstanding_balance_cents"
      - "action=DENY: -> DENIED with the placement left untouched"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_REPLACEMENT_CLAIM_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_CLAIM_NOT_UNDER_REVIEW, ERR_REMEDY_MISMATCH]

  - method: POST
    path: /replacement-claims/{id}/provide-info
    purpose: "Household answers an information request, returning the claim to review."
    roles: [Client]
    input: [info_note]
    output: ReplacementClaim
    side_effects:
      - "ReplacementClaim INFO_REQUESTED -> UNDER_REVIEW, appending the note to decision_note"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_REPLACEMENT_CLAIM_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_INVALID_STATE_TRANSITION]

  # ---- PayrollHandoff ------------------------------------------------------
  - method: GET
    path: /payroll-handoffs/{id}
    purpose: "Read one payroll and tax guidance handoff."
    roles: [AgencyPrincipal, BillingAdministrator, ComplianceOfficer, Client]
    input: []
    output: PayrollHandoff
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_PAYROLL_HANDOFF_NOT_FOUND]

  - method: POST
    path: /payroll-handoffs/{id}/update-ein
    purpose: "Advance the household employer identification number status."
    roles: [ComplianceOfficer]
    input: [ein_status]
    output: PayrollHandoff
    side_effects:
      - "sets ein_status to APPLIED or ISSUED without changing the handoff status"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_PAYROLL_HANDOFF_NOT_FOUND, ERR_ENTITY_TERMINAL]

  - method: POST
    path: /payroll-handoffs/{id}/attest
    purpose: "Household attests it has received the payroll and tax guidance packet, unblocking the START_DATE milestone."
    roles: [Client, ComplianceOfficer]
    input: [attested_by_name]
    output: PayrollHandoff
    side_effects:
      - "PayrollHandoff PREPARED -> ATTESTED, stamping attested_by_name and attested_at"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAYROLL_HANDOFF_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_EIN_NOT_ISSUED]

  # ---- NonSolicitationCase -------------------------------------------------
  - method: POST
    path: /non-solicitation-cases
    purpose: "Allege that a household solicited or poached a candidate in breach of the non-solicitation term."
    roles: [ComplianceOfficer]
    input: [respondent_client_id, candidate_id, allegation_note, discovered_on, "source_placement_id?"]
    output: NonSolicitationCase
    side_effects:
      - "creates the NonSolicitationCase in status ALLEGED with prior_substantiated_count 0, penalty_cents null, and opened_by_user_id stamped from X-User-ID"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_DATE_FORMAT, ERR_CLIENT_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_ENTITY_RELATIONSHIP_MISMATCH]

  - method: GET
    path: /non-solicitation-cases/{id}
    purpose: "Read one enforcement case, including its computed penalty."
    roles: [AgencyPrincipal, BillingAdministrator, ComplianceOfficer, Client]
    input: []
    output: NonSolicitationCase
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_NON_SOLICITATION_CASE_NOT_FOUND]

  - method: GET
    path: /non-solicitation-cases
    purpose: "List enforcement cases, filtered by respondent household, candidate, source placement or state."
    roles: [AgencyPrincipal, BillingAdministrator, ComplianceOfficer, Client]
    input: ["respondent_client_id?", "candidate_id?", "source_placement_id?", "status?", "limit?", "offset?"]
    output: NonSolicitationCase[]
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_ENUM, ERR_INVALID_RANGE]

  - method: POST
    path: /non-solicitation-cases/{id}/investigate
    purpose: "Open an investigation, which is admissible only while the household's non-solicitation term covers the discovery date."
    roles: [ComplianceOfficer]
    input: ["note?"]
    output: NonSolicitationCase
    side_effects:
      - "NonSolicitationCase ALLEGED -> INVESTIGATING and stamps investigation_opened_at"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_NON_SOLICITATION_CASE_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_INVALID_STATE_TRANSITION, ERR_NON_SOLICITATION_TERM_EXPIRED]

  - method: POST
    path: /non-solicitation-cases/{id}/resolve
    purpose: "Substantiate or dismiss the allegation. The resolver must not be the user who opened the case."
    roles: [ComplianceOfficer]
    input: [disposition, "findings_note?"]
    output: NonSolicitationCase
    side_effects:
      - "disposition=SUBSTANTIATE: freezes prior_substantiated_count, runs calculations.non_solicitation_penalty, stamps penalty_cents and substantiated_at, appends a LedgerEntry PENALTY_ASSESSED of +penalty_cents, recomputes Client.outstanding_balance_cents, drives Client ONBOARDED -> SUSPENDED, cancels that household's SCHEDULED trials with cancel_reason CLIENT_SUSPENDED and demotes its emptied TRIALING requisitions to SOURCING"
      - "disposition=UNSUBSTANTIATE: status -> UNSUBSTANTIATED with no penalty and no ledger movement"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_NON_SOLICITATION_CASE_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_CASE_NOT_INVESTIGATING, ERR_SEGREGATION_OF_DUTIES]

  - method: POST
    path: /non-solicitation-cases/{id}/settle
    purpose: "Settle a substantiated case for an amount no greater than the assessed penalty."
    roles: [BillingAdministrator]
    input: [settlement_amount_cents, "memo?"]
    output: NonSolicitationCase
    side_effects:
      - "NonSolicitationCase SUBSTANTIATED -> SETTLED and stamps settlement_amount_cents"
      - "appends a LedgerEntry PENALTY_SETTLED of -settlement_amount_cents and recomputes Client.outstanding_balance_cents"
      - "Client SUSPENDED -> ONBOARDED once no other SUBSTANTIATED case remains for that household"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_RANGE, ERR_NON_SOLICITATION_CASE_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_INVALID_STATE_TRANSITION, ERR_SETTLEMENT_EXCEEDS_PENALTY]

errors:
  # ---- auth ---------------------------------------------------------------
  - error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    message: "X-User-ID and X-User-Role headers are required."
    raised_by: validations.auth_headers_present
  - error_id: ERR_INVALID_ROLE
    http_status: 401
    message: "X-User-Role is not a recognised role."
    raised_by: validations.role_recognised
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Your role is not permitted to perform this operation."
    raised_by: validations.role_permitted_for_operation
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The user who recorded this item may not be the user who decides it."
    raised_by: validations.segregation_of_duties

  # ---- request shape ------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "A required field is missing or null."
    raised_by: validations.required_fields_present
  - error_id: ERR_INVALID_ENUM
    http_status: 400
    message: "A field carries a value outside its permitted set."
    raised_by: validations.enum_values_recognised
  - error_id: ERR_INVALID_RANGE
    http_status: 400
    message: "A numeric field is outside its permitted range."
    raised_by: validations.numeric_ranges_respected
  - error_id: ERR_INVALID_DATE_FORMAT
    http_status: 400
    message: "A date, timestamp or month key is malformed."
    raised_by: validations.temporal_formats_valid
  - error_id: ERR_INVALID_INTERVAL
    http_status: 400
    message: "The interval end does not follow its start."
    raised_by: validations.interval_ordering
  - error_id: ERR_INVALID_LEDGER_AMOUNT
    http_status: 400
    message: "A ledger movement must be non-zero."
    raised_by: validations.ledger_amount_non_zero

  # ---- referential --------------------------------------------------------
  - error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    message: "No household exists with that id."
    raised_by: validations.path_entity_exists, validations.payload_reference_exists
  - error_id: ERR_FEE_SCHEDULE_NOT_FOUND
    http_status: 404
    message: "No fee schedule exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_REQUISITION_NOT_FOUND
    http_status: 404
    message: "No role requisition exists with that id."
    raised_by: validations.path_entity_exists, validations.payload_reference_exists
  - error_id: ERR_CANDIDATE_NOT_FOUND
    http_status: 404
    message: "No candidate exists with that id."
    raised_by: validations.path_entity_exists, validations.payload_reference_exists
  - error_id: ERR_REFERENCE_CHECK_NOT_FOUND
    http_status: 404
    message: "No reference check exists with that id."
    raised_by: validations.path_entity_exists, validations.payload_reference_exists
  - error_id: ERR_BACKGROUND_VERIFICATION_NOT_FOUND
    http_status: 404
    message: "No background verification exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_TRIAL_NOT_FOUND
    http_status: 404
    message: "No trial engagement exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_ACCOMMODATION_TERM_NOT_FOUND
    http_status: 404
    message: "No accommodation term exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    message: "No placement exists with that id."
    raised_by: validations.path_entity_exists, validations.payload_reference_exists
  - error_id: ERR_FEE_MILESTONE_NOT_FOUND
    http_status: 404
    message: "No fee milestone exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_REPLACEMENT_CLAIM_NOT_FOUND
    http_status: 404
    message: "No replacement claim exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_PAYROLL_HANDOFF_NOT_FOUND
    http_status: 404
    message: "No payroll handoff exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_NON_SOLICITATION_CASE_NOT_FOUND
    http_status: 404
    message: "No non-solicitation case exists with that id."
    raised_by: validations.path_entity_exists
  - error_id: ERR_ENTITY_RELATIONSHIP_MISMATCH
    http_status: 409
    message: "The referenced rows do not belong to the same candidate, requisition or placement."
    raised_by: validations.reference_ownership_consistent

  # ---- concurrency --------------------------------------------------------
  - error_id: ERR_STALE_REQUISITION_VERSION
    http_status: 412
    message: "The requisition has changed since you last read it; re-read and retry."
    raised_by: "concurrency_rules.placement-create-supersedes-offer, concurrency_rules.accommodation-term-supersedes-open-term"
  - error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412
    message: "The placement has changed since you last read it; re-read and retry."
    raised_by: concurrency_rules.claim-create-supersedes-denied-claim
  - error_id: ERR_STALE_CANDIDATE_VERSION
    http_status: 412
    message: "The candidate has changed since you last read it; re-read and retry."
    raised_by: concurrency_rules.background-adjudication-guards-candidate

  # ---- state --------------------------------------------------------------
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    message: "That transition is not available from the row's current state."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_ENTITY_TERMINAL
    http_status: 409
    message: "The row is in a terminal state and accepts no further transitions."
    raised_by: validations.terminal_state_locked
  - error_id: ERR_REQUISITION_NOT_SCOPING
    http_status: 409
    message: "The requisition must be in SCOPING to finalize its scope."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_TRIAL_NOT_SCHEDULED
    http_status: 409
    message: "Only a SCHEDULED trial can be started."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_TRIAL_NOT_IN_PROGRESS
    http_status: 409
    message: "Only an IN_PROGRESS trial can have an outcome recorded."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_BACKGROUND_NOT_FLAGGED
    http_status: 409
    message: "Only a FLAGGED background verification can be adjudicated."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_CLAIM_NOT_UNDER_REVIEW
    http_status: 409
    message: "The claim must be UNDER_REVIEW for that decision."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_MILESTONE_NOT_INVOICED
    http_status: 409
    message: "The milestone must be INVOICED or OVERDUE for that operation."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_PLACEMENT_NOT_ACTIVE
    http_status: 409
    message: "The placement must be ACTIVE for that operation."
    raised_by: validations.transition_legal_from_current_state
  - error_id: ERR_CASE_NOT_INVESTIGATING
    http_status: 409
    message: "The case must be INVESTIGATING before it can be resolved."
    raised_by: validations.transition_legal_from_current_state

  # ---- business -----------------------------------------------------------
  - error_id: ERR_NDA_NOT_COUNTERSIGNED
    http_status: 409
    message: "The household's confidentiality agreement must be countersigned first."
    raised_by: validations.nda_countersigned_before_scoping
  - error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    message: "The household is suspended pending resolution of an enforcement case."
    raised_by: validations.client_not_suspended
  - error_id: ERR_SCOPING_ROUND_LIMIT
    http_status: 409
    message: "The requisition has used all of its scoping rounds."
    raised_by: validations.scoping_round_cap
  - error_id: ERR_REQUISITION_HAS_ACTIVE_TRIALS
    http_status: 409
    message: "Close or cancel the open trials before re-scoping the requisition."
    raised_by: validations.rescope_requires_no_active_trials
  - error_id: ERR_NO_FEE_SCHEDULE_MATCH
    http_status: 422
    message: "No active fee band covers that role type and compensation."
    raised_by: validations.fee_schedule_band_match_exists
  - error_id: ERR_FEE_BAND_OVERLAP
    http_status: 409
    message: "The proposed band overlaps an active band for the same role type."
    raised_by: validations.fee_band_no_overlap
  - error_id: ERR_REFERENCE_CHAIN_MISMATCH
    http_status: 422
    message: "The chained reference does not immediately precede this employment period."
    raised_by: validations.reference_chain_continuity
  - error_id: ERR_REFERENCE_PERIOD_OVERLAP
    http_status: 409
    message: "The employment period overlaps another reference for this candidate."
    raised_by: validations.reference_period_overlap
  - error_id: ERR_REFERENCE_CHAIN_TOO_SHORT
    http_status: 422
    message: "The candidate's contiguous verified history is too short for this role type."
    raised_by: validations.reference_chain_length_by_role
  - error_id: ERR_CANDIDATE_NOT_VETTED
    http_status: 409
    message: "The candidate's vetting status does not permit this operation."
    raised_by: validations.candidate_vetting_gate
  - error_id: ERR_CANDIDATE_UNAVAILABLE
    http_status: 409
    message: "The candidate's availability status does not permit this operation."
    raised_by: validations.candidate_availability_gate
  - error_id: ERR_CANDIDATE_SCORE_BELOW_THRESHOLD
    http_status: 422
    message: "The candidate's vetting score is below the threshold for this step."
    raised_by: validations.candidate_score_threshold
  - error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 409
    message: "The candidate's cooling-off period has not elapsed."
    raised_by: validations.cooling_off_elapsed
  - error_id: ERR_TRIAL_NOT_STARTED
    http_status: 409
    message: "The trial's start time has not been reached."
    raised_by: validations.trial_start_reached
  - error_id: ERR_TRIAL_WINDOW_NOT_ELAPSED
    http_status: 409
    message: "The trial has not finished yet."
    raised_by: validations.trial_window_elapsed
  - error_id: ERR_TRIAL_OVERLAP
    http_status: 409
    message: "The household already has a trial occupying that window, including its changeover buffer."
    raised_by: validations.household_trial_no_overlap
  - error_id: ERR_TRIAL_WEEKLY_CAP_EXCEEDED
    http_status: 409
    message: "The candidate has reached the weekly trial cap."
    raised_by: validations.candidate_weekly_trial_cap
  - error_id: ERR_LIVE_IN_INCOMPATIBLE
    http_status: 409
    message: "The candidate will not accept live-in accommodation."
    raised_by: validations.live_in_compatibility
  - error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    message: "The accommodation negotiation has used all of its rounds."
    raised_by: validations.negotiation_round_cap
  - error_id: ERR_RESPONDER_MUST_ALTERNATE
    http_status: 409
    message: "The other party must respond before you can respond again."
    raised_by: validations.responder_must_alternate
  - error_id: ERR_NO_PASSED_TRIAL
    http_status: 409
    message: "The candidate has no passed trial on this requisition."
    raised_by: validations.passed_trial_required
  - error_id: ERR_ACCOMMODATION_NOT_ACCEPTED
    http_status: 409
    message: "The accommodation and schedule terms have not been accepted."
    raised_by: validations.accepted_accommodation_required
  - error_id: ERR_CLIENT_CREDIT_HOLD
    http_status: 409
    message: "The household's outstanding balance exceeds the credit limit."
    raised_by: validations.client_credit_hold
  - error_id: ERR_PAYROLL_HANDOFF_NOT_ATTESTED
    http_status: 409
    message: "The household has not attested the payroll and tax guidance handoff."
    raised_by: validations.payroll_handoff_attested_for_start_date_milestone
  - error_id: ERR_EIN_NOT_ISSUED
    http_status: 409
    message: "The household employer identification number has not been issued."
    raised_by: validations.ein_issued_before_attest
  - error_id: ERR_PAYROLL_HANDOFF_EXISTS
    http_status: 409
    message: "This placement already has a payroll handoff."
    raised_by: validations.single_payroll_handoff_per_placement
  - error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    message: "A milestone must be paid in full for its exact amount."
    raised_by: validations.milestone_payment_amount_exact
  - error_id: ERR_GUARANTEE_WINDOW_EXPIRED
    http_status: 409
    message: "The replacement guarantee window has closed."
    raised_by: validations.guarantee_window_open
  - error_id: ERR_INVALID_SEPARATION_DATE
    http_status: 422
    message: "The separation date is before the start date or in the future."
    raised_by: validations.separation_date_bounds
  - error_id: ERR_OPEN_CLAIM_EXISTS
    http_status: 409
    message: "An undecided claim already exists on this placement."
    raised_by: validations.single_open_claim_per_placement
  - error_id: ERR_REMEDY_MISMATCH
    http_status: 409
    message: "The decision does not match the remedy the household requested."
    raised_by: validations.remedy_matches_requested
  - error_id: ERR_NON_SOLICITATION_TERM_EXPIRED
    http_status: 422
    message: "The household's non-solicitation term does not cover the discovery date."
    raised_by: validations.non_solicitation_term_active
  - error_id: ERR_SETTLEMENT_EXCEEDS_PENALTY
    http_status: 422
    message: "A settlement cannot exceed the assessed penalty."
    raised_by: validations.settlement_within_penalty
  - error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    message: "The logical clock only moves forward."
    raised_by: validations.clock_monotonic

roles:
  - name: AgencyPrincipal
    identity: opaque
    description: "Agency owner. Countersigns confidentiality agreements, publishes fee bands, adjudicates flagged background results, confirms placement starts and decides replacement claims."
    exclusive_operations:
      - "POST /clients/{id}/confidentiality-agreement with action=COUNTERSIGN"
      - "POST /fee-schedules"
      - "POST /fee-schedules/{id}/retire"
      - "POST /background-verifications/{id}/adjudicate"
      - "POST /placements/{id}/confirm-start"
      - "POST /replacement-claims/{id}/review"
    shared_operations:
      - "POST /clients"
      - "all GET endpoints"

  - name: PlacementConsultant
    identity: opaque
    description: "Search lead. Opens and scopes requisitions, books trials, extends offers and terminates placements."
    exclusive_operations:
      - "POST /role-requisitions/{id}/finalize-scope"
      - "POST /role-requisitions/{id}/trial-engagements"
      - "POST /trial-engagements/{id}/start"
      - "POST /trial-engagements/{id}/record-outcome"
      - "POST /placements"
    shared_operations:
      - "POST /clients"
      - "POST /candidates"
      - "POST /role-requisitions"
      - "POST /role-requisitions/{id}/scope"
      - "POST /role-requisitions/{id}/withdraw"
      - "POST /role-requisitions/{id}/accommodation-terms"
      - "POST /candidates/{id}/release-availability"
      - "POST /trial-engagements/{id}/cancel"
      - "POST /placements/{id}/terminate"
      - "POST /placements/{id}/replacement-claims"
      - "all GET endpoints except /clients/{id}/ledger-entries and /payroll-handoffs/{id}"

  - name: VettingSpecialist
    identity: opaque
    description: "Vetting desk. Records references, verifies them, orders background checks and records provider results. Cannot verify a reference it recorded itself."
    exclusive_operations:
      - "POST /candidates/{id}/reference-checks"
      - "POST /reference-checks/{id}/verify"
      - "POST /candidates/{id}/background-verifications"
      - "POST /background-verifications/{id}/record-result"
    shared_operations:
      - "POST /candidates"
      - "POST /candidates/{id}/release-availability"
      - "GET endpoints over candidates, references, background verifications, requisitions, trials and placements"

  - name: BillingAdministrator
    identity: opaque
    description: "Receivables desk. Invoices, collects and reverses milestones, appends manual ledger adjustments and settles substantiated enforcement cases."
    exclusive_operations:
      - "POST /fee-milestones/{id}/invoice"
      - "POST /fee-milestones/{id}/record-payment"
      - "POST /fee-milestones/{id}/reverse"
      - "POST /clients/{id}/ledger-adjustments"
      - "POST /non-solicitation-cases/{id}/settle"
    shared_operations:
      - "GET /clients/{id}/ledger-entries"
      - "GET endpoints over clients, fee schedules, requisitions, placements, milestones, claims, payroll handoffs and enforcement cases"

  - name: ComplianceOfficer
    identity: opaque
    description: "Compliance desk. Prepares payroll and tax guidance handoffs, and opens, investigates and resolves non-solicitation cases. Cannot resolve a case it opened itself."
    exclusive_operations:
      - "POST /placements/{id}/payroll-handoffs"
      - "POST /payroll-handoffs/{id}/update-ein"
      - "POST /non-solicitation-cases"
      - "POST /non-solicitation-cases/{id}/investigate"
      - "POST /non-solicitation-cases/{id}/resolve"
    shared_operations:
      - "POST /payroll-handoffs/{id}/attest"
      - "GET /clients/{id}/ledger-entries"
      - "all GET endpoints"

  - name: Client
    identity: "entity_backed:Client"
    description: "The household. Signs the confidentiality agreement, participates in scoping and accommodation negotiation, cancels trials, terminates placements, attests the payroll handoff and files claims."
    exclusive_operations:
      - "POST /clients/{id}/confidentiality-agreement with action=SIGN"
      - "POST /replacement-claims/{id}/provide-info"
    shared_operations:
      - "POST /role-requisitions"
      - "POST /role-requisitions/{id}/scope"
      - "POST /role-requisitions/{id}/withdraw"
      - "POST /role-requisitions/{id}/accommodation-terms"
      - "POST /accommodation-terms/{id}/respond"
      - "POST /trial-engagements/{id}/cancel"
      - "POST /placements/{id}/terminate"
      - "POST /placements/{id}/replacement-claims"
      - "POST /payroll-handoffs/{id}/attest"
      - "GET endpoints over its own households, requisitions, candidates on offer, trials, terms, placements, milestones, claims, handoffs, ledger and enforcement cases"

  - name: Candidate
    identity: "entity_backed:Candidate"
    description: "The household-staff candidate. Only participates in the accommodation and schedule negotiation and reads what concerns it."
    exclusive_operations: []
    shared_operations:
      - "POST /accommodation-terms/{id}/respond"
      - "GET /candidates/{id}"
      - "GET /role-requisitions/{id}"
      - "GET /trial-engagements/{id}"
      - "GET /accommodation-terms/{id}"
      - "GET /accommodation-terms"
      - "GET /placements/{id}"
