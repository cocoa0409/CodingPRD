            - "Payment.${pay_id}.net_to_talent_cents == 71502"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_memo_negotiation_cycle
        grounds:
          - state_machines.DealMemo.OFFERED_to_COUNTERED
          - state_machines.DealMemo.COUNTERED_to_OFFERED
          - entities.DealMemo.fields.round_count
          - entities.DealMemo.fields.status
        distinguishing_aspect: |
          DealMemo cycles OFFERED->COUNTERED->OFFERED (a true loop, not a linear
          pipeline); round_count increments on each hop reaching 3 after offer,
          counter, re-offer, and status returns to OFFERED.
        test_recipe:
          setup:
            - "Submission in OFFER_EXTENDED with a DRAFT DealMemo opened."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /casting-directors"
              payload: { display_name: "Dana", studio: "BigPic" }
              as: Agent
              captures: { cd_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess", union_status: "NON_UNION", scale_rate_cents: 80000 }
              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/h.jpg", height_cm: 170, skills: ["act"] }
              as: Agent
              captures: { cc_id: $.data.id }
            - call: "POST /talents/${talent_id}/roster"
              payload: {}
              as: Agent
            - call: "POST /casting-calls"
              payload: { casting_director_id: "${cd_id}", title: "Lead", media_type: "PRINT", usage_term_months: 6, shoot_start_date: "2026-04-01T00:00:00Z", shoot_end_date: "2026-04-02T00:00:00Z", offered_day_rate_cents: 150000 }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub_id: $.data.id }
            - call: "POST /deal-memos"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", submission_id: "${sub_id}" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { dm_id: $.data.id }
            - call: "POST /deal-memos/${dm_id}/offer"
              payload: { offer_day_rate_cents: 150000, offer_usage_term_months: 6 }
              as: CastingDirector
              as_user_id: "${cd_id}"
            - call: "POST /deal-memos/${dm_id}/counter"
              payload: { counter_day_rate_cents: 180000, counter_usage_term_months: 6 }
              as: Talent
              as_user_id: "${talent_id}"
          trigger:
            - call: "POST /deal-memos/${dm_id}/offer"
              payload: { offer_day_rate_cents: 165000, offer_usage_term_months: 6 }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { dm_status: $.data.status, rc: $.data.round_count }
          assert:
            - "DealMemo.${dm_id}.status == OFFERED"
            - "DealMemo.${dm_id}.round_count == 3"
            - "DealMemo.${dm_id}.current_day_rate_cents == 165000"

      - name: booking_parallel_dimensions_independent
        grounds:
          - state_machines.Booking.PENDING_to_CONFIRMED
          - state_machines.Booking_payment_dimension.UNPAID_to_PAID
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Booking carries two independent state axes: booking_status advances
          PENDING->CONFIRMED->COMPLETED while payment_status stays UNPAID, then
          payment_status flips to PAID only after COMPLETED — different entity
          (Booking) from the cyclic DealMemo, parallel-dimension shape.
        test_recipe:
          setup:
            - "Booking CONFIRMED (booking_status=CONFIRMED, payment_status=UNPAID), then COMPLETED."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /casting-directors"
              payload: { display_name: "Dana", studio: "BigPic" }
              as: Agent
              captures: { cd_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/h.jpg", height_cm: 170, skills: ["act"] }
              as: Agent
              captures: { cc_id: $.data.id }
            - call: "POST /talents/${talent_id}/roster"
              payload: {}
              as: Agent
            - call: "POST /casting-calls"
              payload: { casting_director_id: "${cd_id}", title: "Lead", media_type: "CABLE", usage_term_months: 12, shoot_start_date: "2026-03-15T00:00:00Z", shoot_end_date: "2026-03-19T00:00:00Z", offered_day_rate_cents: 200000 }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub_id: $.data.id }
            - call: "POST /deal-memos"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", submission_id: "${sub_id}" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { dm_id: $.data.id }
            - call: "POST /deal-memos/${dm_id}/offer"
              payload: { offer_day_rate_cents: 200000, offer_usage_term_months: 12 }
              as: CastingDirector
              as_user_id: "${cd_id}"
            - call: "POST /deal-memos/${dm_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${talent_id}"
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", hold_kind: "CONFIRMED_BOOKING" }
              as: Agent
              captures: { hold_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
