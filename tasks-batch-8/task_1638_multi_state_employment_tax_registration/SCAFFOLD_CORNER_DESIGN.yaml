            - { call: "POST /etax/employees", payload: { employee_ref: "E-4107", full_name: "AX One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
