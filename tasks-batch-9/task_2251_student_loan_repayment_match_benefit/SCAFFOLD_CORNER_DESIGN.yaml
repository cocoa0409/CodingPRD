              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /loan-certifications/${cert_id}/decision"
              payload: { decision: "ACCEPT" }
              as: BenefitsAdministrator
              as_user_id: "admin-1"
              captures: { elig: $.data.eligible_total_cents, matched: $.data.matched_total_cents, unmatched: $.data.unmatched_eligible_cents, capped: $.data.capped_by_statutory_room }
            - call: "GET /match-allocations"
              payload: { certification_id: "${cert_id}", payroll_period_id: "${pp1_id}" }
              as: BenefitsAdministrator
              captures: { a1_id: "$.data[0].id", a1_amt: "$.data[0].amount_cents", a1_t1: "$.data[0].tier1_applied_cents", a1_t2: "$.data[0].tier2_applied_cents", a1_fs: "$.data[0].funding_status" }
            - call: "GET /match-allocations"
              payload: { certification_id: "${cert_id}", payroll_period_id: "${pp2_id}" }
              as: BenefitsAdministrator
              captures: { a2_id: "$.data[0].id", a2_amt: "$.data[0].amount_cents", a2_t1: "$.data[0].tier1_applied_cents", a2_t2: "$.data[0].tier2_applied_cents", a2_fs: "$.data[0].funding_status" }
          assert:
            - "elig == 40000"
            - "capped == false"
            - "matched == 30000"
            - "unmatched == 0"
            - "a1_amt == 20000"
            - "a1_t1 == 10000"
            - "a1_t2 == 20000"
            - "a1_fs == SCHEDULED"
            - "a2_amt == 10000  # period 2 receives only the 10000 cents that overflowed period 1"
            - "a2_t1 == 10000"
            - "a2_t2 == 0"
            - "a2_fs == SCHEDULED"
            - "exactly two MatchAllocation rows exist with certification_id == ${cert_id}"
            - "FundingBatch.${fb1_id}.total_allocated_cents == 20000"
            - "FundingBatch.${fb2_id}.total_allocated_cents == 10000"
            - "PlanYear.${py_id}.total_qslp_match_funded_cents == 30000"

      - name: corner_vesting_cliff_boundary_at_36_months
        claim_type: threshold
        grounds:
          - calculations.vesting_and_forfeiture
          - entities.Employee.fields.vested_pct
          - endpoints[POST /employees]
        distinguishing_aspect: "The cliff schedule steps at whole-month boundaries: 35 completed vesting months yield vested_pct 0.40 while 36 months yield 0.60, with equality landing on the higher tier."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
          trigger:
            - call: "POST /employees"
              payload: { external_id: "E-V35", hire_date: "2023-09-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 35 }
              as: BenefitsAdministrator
              captures: { e35_id: $.data.id, v35: $.data.vested_pct }
            - call: "POST /employees"
              payload: { external_id: "E-V36", hire_date: "2023-08-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 36 }
              as: BenefitsAdministrator
              captures: { e36_id: $.data.id, v36: $.data.vested_pct }
            - call: "POST /employees"
              payload: { external_id: "E-V23", hire_date: "2024-09-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 23 }
              as: BenefitsAdministrator
              captures: { e23_id: $.data.id, v23: $.data.vested_pct }
          assert:
            - "v23 == 0.00"
            - "v35 == 0.40"
            - "v36 == 0.60"
            - "Employee.${e23_id}.vested_pct == 0.00"
            - "Employee.${e35_id}.vested_pct == 0.40"
            - "Employee.${e36_id}.vested_pct == 0.60"

      - name: corner_acp_compute_without_nhce_population_rejected
        claim_type: Input Set Filtering
        grounds:
          - calculations.acp_test
          - validations[priority=45]
          - errors.ERR_NO_NHCE_POPULATION
          - entities.NondiscriminationTest.fields.nhce_count
        distinguishing_aspect: "The ACP input set splits participants strictly by hce_flag: with the only participant above the 15500000-cent HCE threshold, nhce_count is 0 and compute returns 422 ERR_NO_NHCE_POPULATION instead of dividing by an empty group."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with hce_prior_comp_threshold_cents at its default 15500000."
            - "One Employee whose prior_year_compensation_cents is 20000000, so hce_flag is true, with one payroll line of 1000000 cents compensation and 20000 cents deferral."
            - "One PENDING NondiscriminationTest with test_method CURRENT_YEAR."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "H-ONLY", hire_date: "2015-01-01T00:00:00Z", prior_year_compensation_cents: 20000000, vesting_service_months: 120 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id, hf: $.data.hce_flag }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /nondiscrimination-tests"
              payload: { plan_year_id: "${py_id}", test_method: "CURRENT_YEAR" }
              as: ComplianceAuditor
              captures: { t_id: $.data.id, t_st: $.data.status }
          trigger:
            - call: "POST /nondiscrimination-tests/${t_id}/compute"
              payload: { include_qslp_match: true }
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "hf == true"
            - "t_st == PENDING"
            - "err == ERR_NO_NHCE_POPULATION"
            - "HTTP status == 422"
            - "NondiscriminationTest.${t_id}.status == PENDING"
            - "NondiscriminationTest.${t_id}.computed_at == null"
            - "NondiscriminationTest.${t_id}.nhce_acp == 0.0000"

      - name: corner_unpaid_leave_days_clipped_to_plan_year_window
        claim_type: interval_merge
        grounds:
          - calculations.unpaid_leave_days
          - entities.LeaveEvent.fields.day_count
          - entities.Employee.fields.unpaid_leave_days_ytd
        distinguishing_aspect: "day_count is the raw inclusive span of the LeaveEvent (17 days for 2025-12-20..2026-01-05) while unpaid_leave_days_ytd counts only the part inside the plan-year window (5 days), so the two disjoint leaves total 36 rather than 48."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN covering 2026-01-01..2026-12-31 with leave_merge_buffer_days 14 and unpaid_leave_day_cap 180."
            - "One Employee with one UNPAID LeaveEvent spanning 2026-03-01..2026-03-31."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-CLIP", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "UNPAID", start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-31T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { le1_id: $.data.id, d1: $.data.day_count }
          trigger:
            - call: "POST /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "UNPAID", start_date: "2025-12-20T00:00:00Z", end_date: "2026-01-05T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { le2_id: $.data.id, d2: $.data.day_count }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { ytd: $.data.unpaid_leave_days_ytd, st: $.data.employment_status }
          assert:
            - "d1 == 31"
            - "d2 == 17  # raw inclusive span 2025-12-20..2026-01-05, unclipped"
            - "ytd == 36  # 31 in-window days plus the 5 days of the second leave that fall on or after 2026-01-01"
            - "st == ACTIVE  # the logical clock 2026-08-01T00:00:00Z lies in neither interval"
            - "exactly two LeaveEvent rows exist with employee_id == ${emp_id}"

      - name: corner_variant_divergence_mirror_versus_true_up
        claim_type: Variant Divergence
        grounds:
          - calculations.qslp_match_amount
        excluded_because:
          difficulty_instance: dual_variant_calc / qslp_mirror_vs_annual_true_up_divergence
          rationale: "The named §1.8 instance runs both PAY_PERIOD_MIRROR and ANNUAL_TRUE_UP over identical data and asserts the 10000-cent delta."

      - name: corner_acp_rounding_accumulation_does_not_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.acp_test
        excluded_because:
          difficulty_instance: combinatorial_formula / acp_round_per_participant_then_average
          rationale: "The named §1.8 instance pins per-participant rounding before averaging and asserts 0.0101 rather than 0.0102."

  # =========================================================================
  # Validations (§1.4) — violation to error, satisfaction to pass,
  # aggregate/temporal/conditional patterns
  # =========================================================================
  - section: validations
    instances:
      - name: corner_duplicate_open_certification_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=39]
          - errors.ERR_DUPLICATE_OPEN_CERTIFICATION
          - entities.LoanCertification.fields.supersedes_certification_id
        distinguishing_aspect: "A second DRAFT claim for the same employee and plan year returns 409 ERR_DUPLICATE_OPEN_CERTIFICATION; exactly one LoanCertification row remains."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN, one Employee, and one DRAFT LoanCertification for that employee and plan year."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-DUP-CERT", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v1: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SELF_CERTIFICATION", expected_employee_version: "${emp_v1}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert1_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v2: $.data.version }
          trigger:
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SELF_CERTIFICATION", expected_employee_version: "${emp_v2}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_OPEN_CERTIFICATION"
            - "HTTP status == 409"
            - "exactly one LoanCertification row exists with employee_id == ${emp_id} and plan_year_id == ${py_id}, and its id == ${cert1_id}"
            - "LoanCertification.${cert1_id}.status == DRAFT"

      - name: corner_duplicate_contribution_record_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=40]
          - errors.ERR_DUPLICATE_CONTRIBUTION_RECORD
        distinguishing_aspect: "A second payroll line for the same (employee, payroll period) pair returns 409 ERR_DUPLICATE_CONTRIBUTION_RECORD and leaves the period total at the first line's 20000-cent match."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN, one Employee, one OPEN PayrollPeriod carrying one payroll line of 1000000 cents compensation and 20000 cents deferral."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-DUP-CR", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
              captures: { cr1_id: $.data.id, m1: $.data.deferral_match_cents }
          trigger:
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 500000, elective_deferral_cents: 10000 }
              as: PayrollOperator
              captures: { err: $.data.error_id }
          assert:
            - "m1 == 20000"
            - "err == ERR_DUPLICATE_CONTRIBUTION_RECORD"
            - "HTTP status == 409"
            - "PayrollPeriod.${pp1_id}.total_eligible_compensation_cents == 1000000"
            - "PayrollPeriod.${pp1_id}.total_deferral_match_cents == 20000"
            - "exactly one ContributionRecord row exists with payroll_period_id == ${pp1_id}, and its id == ${cr1_id}"

