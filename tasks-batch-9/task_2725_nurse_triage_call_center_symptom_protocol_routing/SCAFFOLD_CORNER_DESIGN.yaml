              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /practices/${practice_b_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", phone: "+14155550100", mrn: "MRN-0099" }
              as: PlatformAdmin
              captures: { patient_b_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_a_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
          trigger:
