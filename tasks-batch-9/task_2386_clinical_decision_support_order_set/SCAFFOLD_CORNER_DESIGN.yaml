              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: POST /cds/vendor-releases
              payload: { vendor_name: "Medisafe", release_label: "2026.08", content_domain: "DOSING", received_at: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              captures: { vr_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Outage target set", request_type: "ORDER_SET", clinical_domain: "INTERNAL_MEDICINE", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Guideline A", peer_reviewed: true }, { citation: "Guideline B", peer_reviewed: true }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Accepted for build" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { cr_v: $.data.version }
            - call: POST /cds/content-requests/${cr_id}/order-sets
              payload: { expected_content_request_version: "${cr_v}", name: "Outage target v1", specialty: "INTERNAL_MEDICINE", pinned_vendor_release_id: "${vr_id}", built_by_clinician_id: "${builder_id}" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { os_id: $.data.id }
            - call: POST /cds/downtime-events
              payload: { scope: "SYSTEM_WIDE", mode: "FULL_UNAVAILABLE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T04:00:00Z", planned: false, reason: "Total CDS outage" }
              as: SystemAdmin
              captures: { dt_id: $.data.id }
            - call: POST /cds/downtime-events/${dt_id}/activate
              payload: { activation_note: "Outage confirmed" }
              as: SystemAdmin
          trigger:
            - call: GET /cds/order-sets/${os_id}
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/order-sets/${os_id}/items
              payload: { orderable_code: "MED-X", display_name: "Blocked item", item_category: "MEDICATION", sequence_index: 1 }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
            - call: GET /cds/content-requests/${cr_id}
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "call 1 returns HTTP 409 with error_id ERR_CDS_UNAVAILABLE even though it is a pure read"
            - "call 2 returns HTTP 409 with error_id ERR_CDS_UNAVAILABLE, not ERR_CDS_CONTENT_FROZEN, because the mode is FULL_UNAVAILABLE"
            - "call 3 returns HTTP 200: ContentRequest reads are never in scope for the freeze"
            - "GET /cds/downtime-events/${dt_id} shows state ACTIVE and blocked_mutation_count == 1 (only the item write counts as a blocked mutation)"
            - "no OrderSetItem row exists: after the window is closed, GET /cds/order-sets/${os_id}/items returns total_count == 0 and item_count is still 0"

