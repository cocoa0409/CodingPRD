            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /par-levels", payload: { unit_id: "${u2}", stock_id: "${s1}", base_par_quantity: 10, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u2}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
          trigger:
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNIT_OWNERSHIP and http status 403"
            - "CartExchangeRun.${r2}.status == COMPLETED (unchanged)"

      - name: same_user_finalize_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation of duties: the creating LinenManager (lm-1) cannot finalize; a different manager (lm-2) can."
        test_recipe:
          setup: ["facility, unit, stock, par; manifest m1 DISPATCHED; invoice over m1 created by lm-1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES and http status 403"
            - "VendorInvoice.${inv}.status == PROVISIONAL"

      - name: linen_manager_cannot_verify_isolation_breach
        claim_type: violation_to_error
        grounds:
          - state_machines.Complaint.OPEN_to_VERIFIED
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Conditional role rule: LinenManager may verify STAINS but not ISOLATION_BREACH — that type is reserved for InfectionControlOfficer."
        test_recipe:
