            - "ServiceCommitment.${cm_tl}.commitment_status == VOIDED"
            - "ServiceProvider.${prov_tl}.encumbered_capacity_days == 0"
            - "GET /parcels?annexation_case_id=${case_tl}&parcel_status=EXCLUDED returns total_count == 4"

      - name: cyclic_shape_petition_returns_to_circulating_and_can_be_recertified
        claim_type: cyclic_loop_back
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.AnnexationCase.SUFFICIENCY_REVIEW_to_PETITION_CIRCULATING
        distinguishing_aspect: |
          The cyclic shape's loop-back limb — SUFFICIENCY_REVIEW -> PETITION_CIRCULATING ->
          SUFFICIENCY_REVIEW driven by consent withdrawal and re-certification.
        excluded_because:
          difficulty_instance: petition_cure_cycle_revisits_sufficiency_review_after_insufficient
          rationale: |
            That §1.8 instance already runs the whole cure cycle: certify SUFFICIENT, withdraw a
            consent to drop below the threshold (petition INSUFFICIENT, case back to
            PETITION_CIRCULATING), add a replacement consent and re-certify to SUFFICIENT — and it
            additionally pins the re-stamped aggregates on the second pass, which a standalone
            loop-back corner would not.

      - name: cascade_down_effectuation_reaches_parcels_accounts_and_commitments
        claim_type: cascade_down
        grounds:
          - state_machines.AnnexationCase.ORDINANCE_ADOPTED_to_EFFECTIVE
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The six-link cascade-down side-effect pattern of effectuation, verified end to end with
          only non-terminal children affected.
        excluded_because:
          difficulty_instance: effectuate_six_link_cutover_annexes_parcels_accounts_and_plan
          rationale: |
            That §1.8 instance walks all six links in one request — parcels INCORPORATED, accounts
            INSIDE_CITY_PENDING_TRANSITION with the surcharge dropped, activated_account_count
            incremented to FULFILLED, plan readiness READY, accounts INSIDE_CITY_ACTIVE — and it
            also pins an EXCLUDED parcel that the cascade must skip, which is exactly the
            "only non-terminal children affected" half of this claim.

      - name: compensation_voiding_a_commitment_reverses_its_side_effects
        claim_type: compensation
        grounds:
          - state_machines.ServiceCommitment.ACTIVE_to_VOIDED
          - calculations.provider_capacity_encumbrance
        distinguishing_aspect: |
          The compensation side-effect pattern: an undo transition reverses every original side
          effect with no drift in the provider or plan ledgers.
        excluded_because:
          difficulty_instance: commitment_void_releases_exactly_the_encumbrance_and_cost_it_added
          rationale: |
            That §1.8 instance voids one of two commitments and pins the exact residual
            encumbered_capacity_days, committed_cost_cents, covered_service_types and
            service_readiness, proving the release equals what activation added rather than
            zeroing the ledger — a stronger no-drift assertion than a single-commitment corner.

  # =====================================================================================
  # SECTION 3 — Calculations
  # =====================================================================================
  - section: calculations
    instances:
      - name: excluding_a_parcel_drops_it_from_every_territory_aggregate
        claim_type: input_set_filtering
        grounds:
          - calculations.territory_qualification.input_set
          - endpoints[POST /parcels/{parcelId}/exclude]
        distinguishing_aspect: |
          territory_qualification reads only parcels in {PROPOSED, PENDING_ANNEX, INCORPORATED}.
          Excluding the 40,000,000-cent parcel while the case is still DRAFT recomputes the
          aggregates down to 3 parcels / 15.00 acres / 60,000,000 cents in the same request —
          an EXCLUDED parcel is invisible to the territory even though the row still exists and
          is still returned by a status-filtered list.
        test_recipe:
          setup:
            - "One DRAFT case holding the baseline four parcels (40M / 30M / 20M / 10M cents, 5.00 acres each)."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_if: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_if}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_if: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_if: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_if}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
              captures: { case_if: $.data.id }
            - call: "POST /annexation-cases/${case_if}/parcels"
              payload: { primary_owner_id: "${ow_if}", parcel_apn: "IF-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
              captures: { parcel_if1: $.data.id }
            - call: "POST /annexation-cases/${case_if}/parcels"
              payload: { primary_owner_id: "${ow_if}", parcel_apn: "IF-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
            - call: "POST /annexation-cases/${case_if}/parcels"
              payload: { primary_owner_id: "${ow_if}", parcel_apn: "IF-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
            - call: "POST /annexation-cases/${case_if}/parcels"
              payload: { primary_owner_id: "${ow_if}", parcel_apn: "IF-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
          trigger:
            - call: "POST /parcels/${parcel_if1}/exclude"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
              captures: { if_pstatus: $.data.parcel_status }
            - call: "GET /annexation-cases/${case_if}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_if}"
              captures: { if_count: $.data.parcel_count, if_acres: $.data.territory_acreage, if_value: $.data.territory_assessed_value_cents, if_ver: $.data.version }
          assert:
            - "${if_pstatus} == EXCLUDED"
            - "${if_count} == 3"
            - "${if_acres} == 15.00"
            - "${if_value} == 60000000"
            - "${if_ver} == 6"
            - "GET /parcels?annexation_case_id=${case_if}&parcel_status=EXCLUDED returns total_count == 1"
            - "GET /parcels?annexation_case_id=${case_if}&parcel_status=PROPOSED returns total_count == 3"
            - "AnnexationCase.${case_if}.status == DRAFT"

      - name: msd_assessment_is_three_quarters_of_the_adopted_plans_committed_cost
        claim_type: correct_result
        grounds:
          - calculations.msd_assessment
          - state_machines.AnnexationCase.PROTEST_SUSTAINED_to_MSD_ALTERNATIVE_ADOPTED
        distinguishing_aspect: |
          After a sustained protest (one 100%-share filing on the 40,000,000-cent parcel gives
          protest_pct 40.00 against a 20.00 threshold) the MSD alternative assesses
          round_half_up(1,200,000 * 0.75) = 900,000 cents — computed from the ADOPTED plan's
          committed_cost_cents, not from the territory value — while the same request excludes
          all four PENDING_ANNEX parcels because no boundary change occurs.
        test_recipe:
          setup:
            - "One INVOLUNTARY_ORDINANCE case with an ADOPTED plan carrying a single FULFILLED POLICE commitment of 1,200,000 cents, a hearing HELD at 2026-09-10T18:00:00Z, one 100%-share protest filing on the 40,000,000-cent parcel, and the protest period closed at 2026-10-11T09:00:00Z leaving the case PROTEST_SUSTAINED."
