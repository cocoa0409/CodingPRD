              as: Scheduler
            - call: "POST /anesthesia-ops/cases/${k5_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${k5_ver}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "K1..K4 directing assignments all created (201, PROPOSED): peak directed concurrency 4 <= RATIO_MAX 4"
            - "K5 directing assignment rejected 409 ERR_SUPERVISION_RATIO_EXCEEDED: peak would become 5 > 4"
            - "GET /assignments?provider_id=${d_id}&assignment_role=CASE_DIRECTING returns exactly 4 assignments"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stipend_accrue_void_conserves_daily_cap_budget
        grounds:
          - calculations.daily_cap_waterfall
          - state_machines.StipendLedgerEntry.ACCRUED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: the daily capped stipend budget — for bucket
          (provider, occurred_date), sum(applied_amount_cents over ACCRUED
          STANDBY+LATE_STAY) == min(sum(amount_cents over the same), 50000).
          Accrue STANDBY 45000 + LATE_STAY 54000 saturates the cap
          (45000/5000); the compensating void of the STANDBY entry re-runs the
          waterfall and restores the invariant with no drift
          (LATE_STAY applied == min(54000, 50000) == 50000).
        test_recipe:
          setup:
            - "Site S with StipendAgreement covering 2026-08-10 (standby_full 45000, standby_partial 15000, late_stay_rate 300/min, call 12000)"
            - "CRNA P (2027 creds); roster 2026-08-10 (slots 2, day_end 1020) PUBLISHED"
            - "Case X [600,660) primary P CONFIRMED; case Y [700,800) primary P CONFIRMED"
            - "Clock 09:30 -> cancel case X (notice 30 -> STANDBY 45000); clock 11:40 -> start case Y; clock 20:00"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/stipend-agreements"
              payload: { site_id: "${site_id}", effective_from: "2026-08-10", effective_to: "2026-08-10", call_stipend_cents: 12000, late_stay_rate_cents_per_minute: 300, standby_full_cents: 45000, standby_partial_cents: 15000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 2, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 600, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { cx_id: $.data.id, cx_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${cx_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${cx_ver}" }
              as: Scheduler
              captures: { axg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${axg_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${p_id}"
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 700, scheduled_end_minute: 800 }
              as: Scheduler
              captures: { cy_id: $.data.id, cy_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${cy_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${cy_ver}" }
              as: Scheduler
              captures: { ayg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${ayg_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${p_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${cx_id}/cancel"
              payload: { cancellation_reason: "SURGEON_UNAVAILABLE" }
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:40:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${cy_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T20:00:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${cy_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/stipend-entries"
              payload: { provider_id: "${p_id}", entry_type: "STANDBY" }
              as: Scheduler
              captures: { sb_id: "$.data[0].id", sb_applied: "$.data[0].applied_amount_cents" }
            - call: "GET /anesthesia-ops/stipend-entries"
              payload: { provider_id: "${p_id}", entry_type: "LATE_STAY" }
              as: Scheduler
              captures: { ls_id: "$.data[0].id", ls_applied: "$.data[0].applied_amount_cents" }
            - call: "POST /anesthesia-ops/stipend-entries/${sb_id}/void"
              payload: {}
              as: GroupAdministrator
              captures: { sb_status: $.data.status }
            - call: "GET /anesthesia-ops/stipend-entries/${ls_id}"
              as: Scheduler
              captures: { ls_applied_after: $.data.applied_amount_cents }
          assert:
            - "After accrual: STANDBY applied == 45000; LATE_STAY amount == 54000 ((1200-1020) x 300) with applied == 5000; sum == 50000 == min(99000, DAILY_STIPEND_CAP_CENTS)"
            - "After the compensating void: STANDBY.status == VOIDED; waterfall re-run restores LATE_STAY applied to 50000 == min(54000, 50000)"
            - "Invariant holds at both observation points: sum(applied over ACCRUED STANDBY+LATE_STAY for (P, 2026-08-10)) == min(sum(amount over same), 50000) — no drift from the accrue->void round trip"

      - name: claim_denial_resubmission_conserves_fiscal_fields
        grounds:
          - state_machines.BillingClaim.DENIED_to_READY
          - entities.BillingClaim.fields.charge_cents
          - entities.BillingClaim.fields.units_total
          - entities.BillingClaim.fields.modifier_code
        distinguishing_aspect: |
          Conserved quantity: the claim's fiscal triple (units_total,
          modifier_code, charge_cents). The forward record-denial paired with
          the compensating mark-ready resubmission moves only lifecycle fields
          (status, denial_reason set-then-cleared, resubmission_count +1) and
          MUST leave the fiscal triple unchanged — a different conserved
          quantity than the stipend budget of the sibling instance.
        test_recipe:
          setup:
            - "Site S; fee P600 base_units=6, max 1000000; MD physician (2027 creds)"
            - "Roster 2026-08-10 (slots 1, day_end 1200) PUBLISHED; case P600 [540,600); MD primary CONFIRMED"
            - "Case started 09:00, completed 10:15 (actual 75 min -> 5.0 time units -> 11.0 units -> PERSONAL claim 88000 cents, DRAFT); roster LOCKED"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P600", base_units: 6, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Avery", provider_type: "ANESTHESIOLOGIST", npi: "1000000001", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P600", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${md_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${md_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:15:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { claim_id: "$.data[0].id", ch0: "$.data[0].charge_cents", un0: "$.data[0].units_total", mo0: "$.data[0].modifier_code" }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/claims/${claim_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
            - call: "POST /anesthesia-ops/claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /anesthesia-ops/claims/${claim_id}/record-denial"
              payload: { denial_reason: "TIMELY_FILING" }
              as: BillingSpecialist
              captures: { st_den: $.data.status, dr: $.data.denial_reason }
            - call: "POST /anesthesia-ops/claims/${claim_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
              captures: { st_re: $.data.status, ch1: $.data.charge_cents, un1: $.data.units_total, mo1: $.data.modifier_code, rc: $.data.resubmission_count, dr1: $.data.denial_reason }
          assert:
            - "Forward action: status DENIED, denial_reason == 'TIMELY_FILING'"
            - "Compensating resubmission: status READY, denial_reason == null, resubmission_count == 1"
            - "Fiscal invariant: charge_cents == 88000, units_total == 11.0, modifier_code == PERSONAL identical before denial and after resubmission (${ch0} == ${ch1}, ${un0} == ${un1}, ${mo0} == ${mo1})"
