          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "TK-01 started clean (heel 0.0 L, family NONE) and was occupied by B-0001 over [2026-08-02T08:00:00Z, 2026-08-02T12:00:00Z); B-0001 is RELEASED and left a 5.000 L ZDDP_PCMO heel."
