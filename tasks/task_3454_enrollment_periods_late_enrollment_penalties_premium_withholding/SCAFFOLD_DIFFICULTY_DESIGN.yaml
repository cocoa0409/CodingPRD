          assert:
            - "AppealCase path: UNDER_REVIEW -> MORE_INFO_REQUESTED -> UNDER_REVIEW -> APPROVED (the cycle is traversable and re-enters UNDER_REVIEW)"
            - "after APPROVED: old determination ${det_id} is SUPERSEDED; list[0] is the SUPERSEDED row, list[1] is the replacement (created_at ASC)"
            - "replacement FINAL determination: irmaa_tier == 0 (claimed MAGI 9000000), total_premium_cents == 19000, created_by_user_id == \"ao-200\""

  - rule_id: transitive_cascade
    instances:
      - name: employer_coverage_end_cascade
        grounds:
          - state_machines.EmployerCoverageRecord.ACTIVE_COVERAGE_to_ENDED
          - calculations.calc_sep_window
          - calculations.calc_payer_role
          - entities.EnrollmentPeriod.fields.window_type
        distinguishing_aspect: |
          Trigger POST /medicare/employer-coverages/{id}/end: the record's own
          ENDED transition (link 1) causes creation of an 8-month SEP
          EnrollmentPeriod row (link 2, caused by the ending — not by the API
          call directly), with a payer-coordination fan-out (SECONDARY closes
          2026-08, PRIMARY opens 2026-09). Depth >= 2; different trigger from
          the relief-grant cascade.
        test_recipe:
          setup:
            - "Beneficiary DOB 1961-03-10 created at clock 2026-01-05 (initial payer row MEDICARE_PRIMARY / NO_EMPLOYER_COVERAGE from 2026-01)"
            - "EmployerCoverageRecord ACME size 50 from 2024-01, VERIFIED -> payer flips MEDICARE_SECONDARY / LARGE_EMPLOYER retroactively from 2024-01 (degenerate initial row removed)"
            - "Clock advanced to 2026-09-05 so the end months are in the past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Ed Cascade", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 50, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ec_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages/${ec_id}/verify"
              payload: { decision: "VERIFIED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/employer-coverages/${ec_id}/end"
              payload: { coverage_end_month: "2026-08", employment_end_month: "2026-09" }
              as: FieldOfficer
              captures: { ec_status: "$.data.record_status" }
            - call: "GET /medicare/beneficiaries/${b_id}/enrollment-periods"
              as: FieldOfficer
              captures: { sep_type: "$.data[1].window_type", sep_start: "$.data[1].window_start_month", sep_end: "$.data[1].window_end_month", sep_status: "$.data[1].status" }
            - call: "GET /medicare/beneficiaries/${b_id}/payer-coordination"
              as: FieldOfficer
              captures: { pc0_role: "$.data[0].role", pc0_end: "$.data[0].effective_end_month", pc1_role: "$.data[1].role", pc1_start: "$.data[1].effective_start_month", pc1_basis: "$.data[1].basis" }
          assert:
            - "EmployerCoverageRecord.${ec_id}.record_status == ENDED (link 1)"
            - "a new EnrollmentPeriod row exists: window_type == SEP, window_start_month == \"2026-09\", window_end_month == \"2027-04\" (anchor min(2026-09, 2026-08) = 2026-08, +1..+8), status == OPEN at clock 2026-09 (link 2)"
            - "payer intervals (created_at ASC): [0] MEDICARE_SECONDARY start 2024-01 end \"2026-08\"; [1] MEDICARE_PRIMARY start \"2026-09\" end null basis NO_EMPLOYER_COVERAGE (fan-out of link 1)"
      - name: relief_grant_depth4_cascade
        grounds:
          - state_machines.EquitableReliefCase.UNDER_INVESTIGATION_to_GRANTED
          - calculations.calc_relief_repricing
          - state_machines.PenaltyAssessment.ACTIVE_to_VOIDED
          - state_machines.PremiumDetermination.FINAL_to_SUPERSEDED
        distinguishing_aspect: |
          Trigger POST /medicare/equitable-relief-cases/{id}/adjudicate GRANTED
          runs a strictly linear depth-4 chain: enrollment effective_month moved
          earlier (1->2) forces PenaltyAssessment VOIDED (2->3) forces the FINAL
          PremiumDetermination SUPERSEDED + replacement (3->4) forces invoice
          repricing with credit (4). Different trigger than the employer-end
          cascade; each hop is caused by the previous mutation, not fan-out.
        test_recipe:
          setup:
            - "Rate schedules 2026 + 2027; beneficiary DOB 1960-06-10 (IEP end 2025-09)"
            - "PART_B enrolled via GEP at clock 2027-02-10 -> effective 2027-03; gap [2025-10..2027-02] = 17 months -> penalty 10%, assessment ACTIVE"
            - "FINAL determination 2027/PART_B (tax 2025 MAGI 5000000 SINGLE, tier 0): base 19000 + lep 1900 = 20900"
            - "Cycles at 2027-03-05 and 2027-04-05: enrollment ACTIVE; invoices 2027-03 and 2027-04 issued at 20900 each; both PAID (total paid 41800)"
            - "Equitable relief case filed: BOTH, PART_B, requested_effective_month 2026-06"
