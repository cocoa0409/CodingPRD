# =============================================================================
# Scaffold: 2026 Welding & Weldment Contract Shop (AWS D1.1)
# =============================================================================

scenario: |
  2026. Welding & Weldment Contract Shop (AWS D1.1): weld procedure specification & PQR,
  welder continuity & requalification clock, joint mapping & inspection (VT/UT/RT) hold points,
  consumable lot & oven control, distortion rework & repair-rate limit, fixture build & ownership,
  NDT vendor scheduling, traveler sign-off

domain_name: welding-weldment-contract-shop
api_prefix: /weld-shop

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: hybrid
  # tree: ShopOrder → Weldment → Joint; flat cross-cutting: Welder, WelderQualification,
  # ConsumableLot, Oven, NDTVendor, Fixture; graph: Joint → ConsumableLot usage, NDTScheduling.

  state_machine_shape: compound
  # Weldment posture is derived from Joint children + Fixture ownership + Traveler sign-offs;
  # Joint has parallel dimensions (fabrication_status × inspection_status);
  # WPS has a revision cycle (DRAFT→QUALIFIED→SUPERSEDED→DRAFT-of-next-revision).

  relationship_patterns:
    - one_to_many          # ShopOrder → Weldment → Joint
    - many_to_many         # Joint ↔ Welder via WeldPass; Joint ↔ ConsumableLot via WeldPass
    - self_referential     # WPS.superseded_by_id points to a newer WPS
    - cross_aggregate      # Joint references Fixture (outside its aggregate); Weldment references NDTVendor

  role_model: segregation_of_duties
  # CWI cannot inspect welds they personally welded; QCManager approves WPS but cannot
  # also approve the PQR that supports the same WPS (independent-review requirement).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ------------------- Identity / actor entities -------------------
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Contract shop legal name" }
      - { name: aws_d1_1_revision, type: string, source: input, description: "AWS D1.1 code revision enforced, e.g. 'D1.1:2025'" }
      - { name: repair_rate_limit_pct, type: integer, source: input, default: 5, description: "Shop-wide contractual repair-rate limit percent; joints whose weld_pass count marked as repair / total passes on the weldment exceeding this trigger REPAIR_REVIEW posture" }
      - { name: current_utc, type: datetime, source: system, description: "Logical clock; initialized to 2026-08-01T00:00:00Z at startup, advanced via POST /_clock/set_current_utc" }

  - name: Welder
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: stencil, type: string, source: input, description: "Welder stencil / badge ID, unique per shop" }
      - { name: full_name, type: string, source: input, description: "Welder legal name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: NDTVendor
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: vendor_name, type: string, source: input, description: "Third-party NDT vendor name" }
      - { name: supported_methods, type: array, source: input, description: "Subset of [VT, UT, RT]" }
      - { name: hourly_capacity, type: integer, source: input, description: "Concurrent inspection slot count per hour" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Oven
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: oven_code, type: string, source: input, description: "Physical oven identifier" }
      - { name: holding_temp_c, type: integer, source: input, description: "Holding temperature Celsius, must be in [120, 300]" }
      - { name: capacity_electrodes_kg, type: integer, source: input, description: "Max electrode mass the oven can hold (kg)" }
      - { name: status, type: enum, source: system, default: ONLINE, description: "ONLINE | OFFLINE | QUARANTINED" }

  # ------------------- Qualification entities -------------------
  - name: PQR
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: pqr_number, type: string, source: input, description: "PQR document number, unique per shop" }
      - { name: process, type: enum, source: input, description: "SMAW | GMAW | FCAW | GTAW | SAW" }
      - { name: base_metal_spec, type: string, source: input, description: "e.g. ASTM A36 / A572 Gr50" }
      - { name: thickness_range_min_mm, type: number, source: input, description: "Minimum qualified base-metal thickness (mm)" }
      - { name: thickness_range_max_mm, type: number, source: input, description: "Maximum qualified base-metal thickness (mm); must be > thickness_range_min_mm" }
      - { name: test_report_id, type: string, source: input, description: "External mechanical test report reference" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of QCManager who approved; used to enforce segregation vs WPS approver" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → APPROVED | REJECTED; APPROVED PQR is immutable" }

  - name: WPS
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: wps_number, type: string, source: input, description: "WPS document number" }
      - { name: revision, type: integer, source: input, description: "Revision counter within wps_number; (shop_id, wps_number, revision) unique" }
      - { name: pqr_id, type: string, source: input, description: "FK -> PQR.id; supporting PQR (must be APPROVED at WPS approval time, then version-pinned)" }
      - { name: pinned_pqr_version, type: integer, source: computed, description: "PQR.version captured when the WPS is approved; re-approval requires re-pin" }
      - { name: process, type: enum, source: input, description: "SMAW | GMAW | FCAW | GTAW | SAW; must equal PQR.process" }
      - { name: base_metal_spec, type: string, source: input, description: "Must equal PQR.base_metal_spec" }
      - { name: thickness_min_mm, type: number, source: input, description: "Qualified min thickness this WPS covers; must be >= PQR.thickness_range_min_mm" }
      - { name: thickness_max_mm, type: number, source: input, description: "Qualified max thickness this WPS covers; must be <= PQR.thickness_range_max_mm" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> WPS.id; set when a newer revision of same wps_number is approved (self-referential)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of QCManager approving; must differ from PQR.reviewed_by_user_id (segregation)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → APPROVED | REJECTED; APPROVED → SUPERSEDED when newer revision approved" }

  - name: WelderQualification
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: welder_id, type: string, source: input, description: "FK -> Welder.id" }
      - { name: wps_id, type: string, source: input, description: "FK -> WPS.id; qualification tied to specific WPS revision" }
      - { name: process, type: enum, source: input, description: "Qualified process; must match WPS.process" }
      - { name: qualified_at_utc, type: datetime, source: input, description: "Date welder passed performance test" }
      - { name: last_weld_at_utc, type: datetime, source: system, description: "Most recent WeldPass timestamp using this qualification; drives continuity clock" }
      - { name: continuity_expires_at_utc, type: datetime, source: computed, description: "= max(qualified_at_utc, last_weld_at_utc) + 183 days (AWS D1.1 6-month continuity)" }
      - { name: status, type: enum, source: system, default: QUALIFIED, description: "QUALIFIED | LAPSED | REVOKED" }

  # ------------------- Consumable & oven control -------------------
  - name: ConsumableLot
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number" }
      - { name: filler_spec, type: string, source: input, description: "e.g. E7018, ER70S-6" }
      - { name: process, type: enum, source: input, description: "SMAW | GMAW | FCAW | GTAW | SAW" }
      - { name: received_kg, type: number, source: input, description: "Quantity received (kg)" }
      - { name: remaining_kg, type: number, source: computed, description: "= received_kg - sum(WeldPass.consumable_used_kg) - sum(ConsumableIssue.issued_kg not yet returned)" }
      - { name: exposed_minutes_total, type: integer, source: computed, default: 0, description: "Cumulative atmospheric exposure minutes for SMAW low-hydrogen lots; drives 240-min exposure limit" }
      - { name: rebake_count, type: integer, source: computed, default: 0, description: "Times lot has been rebaked; AWS D1.1 allows at most 1 rebake" }
      - { name: status, type: enum, source: system, default: IN_OVEN, description: "IN_OVEN | ISSUED | EXPOSED | QUARANTINED | EXHAUSTED | CONSUMED" }

  - name: ConsumableIssue
    parent: Shop
    common_fields: false
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> ConsumableLot.id" }
      - { name: oven_id, type: string, source: input, description: "FK -> Oven.id" }
      - { name: issued_to_welder_id, type: string, source: input, description: "FK -> Welder.id" }
      - { name: issued_kg, type: number, source: input, description: "Quantity issued (kg)" }
      - { name: issued_at_utc, type: datetime, source: system, description: "Logical clock at issue" }
      - { name: returned_at_utc, type: datetime, source: system, description: "Logical clock at return; null while issued" }
      - { name: exposure_minutes, type: integer, source: computed, description: "= floor((coalesce(returned_at_utc, current_utc) - issued_at_utc) in minutes); added to lot.exposed_minutes_total on return" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RETURNED | VOID" }

  # ------------------- Production entities -------------------
  - name: Fixture
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: fixture_code, type: string, source: input, description: "Shop fixture identifier" }
      - { name: capacity_weldments, type: integer, source: input, description: "Number of weldments fixture can hold simultaneously; >= 1" }
      - { name: owner_party, type: enum, source: input, description: "SHOP | CUSTOMER; who owns tooling — determines disposition rights at weldment close" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | IN_USE | UNDER_REPAIR" }

  - name: ShopOrder
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: po_number, type: string, source: input, description: "Customer PO number; unique per shop" }
      - { name: customer_name, type: string, source: input, description: "Customer legal name" }
      - { name: promised_ship_date_utc, type: datetime, source: input, description: "Contractual ship date" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_PROGRESS | COMPLETE | CANCELLED" }

  - name: Weldment
    parent: ShopOrder
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: shop_order_id, type: string, source: system, description: "FK -> ShopOrder.id" }
      - { name: weldment_serial, type: string, source: input, description: "Unique serial per shop order" }
      - { name: fixture_id, type: string, source: input, description: "FK -> Fixture.id; required before fabrication starts" }
      - { name: drawing_revision, type: string, source: input, description: "Drawing revision this weldment is built to" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | FROZEN | REPAIR_REVIEW | SHIPPED | CANCELLED; derived from children + repair-rate + distortion + fixture" }
      - { name: repair_pass_count, type: integer, source: computed, default: 0, description: "Count of WeldPass rows with is_repair=true on this weldment" }
      - { name: total_pass_count, type: integer, source: computed, default: 0, description: "Count of WeldPass rows on this weldment" }
      - { name: repair_rate_pct, type: number, source: computed, default: 0, description: "= 100.0 * repair_pass_count / NULLIF(total_pass_count, 0); 0 when total_pass_count == 0" }
      - { name: distortion_count, type: integer, source: computed, default: 0, description: "Cumulative distortion reports on this weldment" }
      - { name: signed_off_at_utc, type: datetime, source: system, description: "Timestamp traveler was signed off; null until signed" }
      - { name: version, type: integer, source: system, description: "OCC version for weldment-level mutations" }

  - name: Joint
    parent: Weldment
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: weldment_id, type: string, source: system, description: "FK -> Weldment.id" }
      - { name: joint_number, type: string, source: input, description: "Joint identifier on drawing" }
      - { name: wps_id, type: string, source: input, description: "FK -> WPS.id; must be APPROVED and not SUPERSEDED at first weld_pass" }
      - { name: base_metal_thickness_mm, type: number, source: input, description: "Actual joint thickness; must lie within WPS.thickness range at first weld pass" }
      - { name: required_ndt_methods, type: array, source: input, description: "Subset of [VT, UT, RT]; VT always implicitly required" }
      - { name: fabrication_status, type: enum, source: system, default: PENDING, description: "PENDING | IN_PROGRESS | WELDED_OUT | ON_HOLD | CANCELLED" }
      - { name: inspection_status, type: enum, source: system, default: NOT_READY, description: "NOT_READY | READY_FOR_VT | VT_PASSED | NDT_IN_PROGRESS | NDT_PASSED | NDT_FAILED | REPAIR_REQUIRED | REPAIR_WELDED_OUT" }
      - { name: repair_cycle_count, type: integer, source: computed, default: 0, description: "Number of times this joint has entered REPAIR_REQUIRED; AWS D1.1 repair-cycle hard cap is 2" }
      - { name: version, type: integer, source: system, description: "OCC version for joint-level mutations" }

  - name: WeldPass
    parent: Joint
    common_fields: false
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: joint_id, type: string, source: system, description: "FK -> Joint.id" }
      - { name: welder_id, type: string, source: input, description: "FK -> Welder.id" }
      - { name: qualification_id, type: string, source: input, description: "FK -> WelderQualification.id; must be QUALIFIED with continuity_expires_at_utc > current_utc at pass time" }
      - { name: consumable_lot_id, type: string, source: input, description: "FK -> ConsumableLot.id" }
      - { name: consumable_used_kg, type: number, source: input, description: "kg of filler consumed on this pass" }
      - { name: is_repair, type: boolean, source: input, description: "True when pass is repair of a prior rejected region" }
      - { name: welded_at_utc, type: datetime, source: system, description: "Logical clock at pass" }

  - name: DistortionReport
    parent: Weldment
    common_fields: false
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: weldment_id, type: string, source: system, description: "FK -> Weldment.id" }
      - { name: joint_id, type: string, source: input, description: "FK -> Joint.id; distortion attributed to a specific joint" }
      - { name: measured_deviation_mm, type: number, source: input, description: "Out-of-tolerance deviation in mm" }
      - { name: tolerance_mm, type: number, source: input, description: "Drawing tolerance in mm" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of QualityInspector reporter" }
      - { name: reported_at_utc, type: datetime, source: system, description: "Logical clock at report" }
      - { name: disposition, type: enum, source: system, default: PENDING, description: "PENDING | REWORK | USE_AS_IS | SCRAP" }

  - name: Inspection
    parent: Joint
    common_fields: false
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: joint_id, type: string, source: system, description: "FK -> Joint.id" }
      - { name: method, type: enum, source: input, description: "VT | UT | RT" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of CWI or NDT technician; for VT, must NOT equal any welder who welded this joint (segregation of duties)" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Slot start" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Slot end; must be > start" }
      - { name: vendor_id, type: string, source: input, description: "FK -> NDTVendor.id; required for UT/RT, must be null for VT (VT is in-house)" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL; set at result-recording" }
      - { name: result_code, type: string, source: input, description: "Indication code e.g. POROSITY, SLAG, CRACK" }
      - { name: resulted_at_utc, type: datetime, source: system, description: "Logical clock when result recorded" }
      - { name: hold_point_released, type: boolean, source: system, default: false, description: "True once CWI releases hold; gates downstream joint fabrication" }

  - name: TravelerSignOff
    parent: Weldment
    common_fields: false
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: weldment_id, type: string, source: system, description: "FK -> Weldment.id" }
      - { name: step_code, type: enum, source: input, description: "FIT_UP | WELD_OUT | VT | NDT | FINAL" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID performing sign-off" }
      - { name: signed_at_utc, type: datetime, source: system, description: "Logical clock at sign" }
      - { name: notes, type: string, source: input, description: "Optional sign-off notes" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PQR
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /weld-shop/shops/{id}/pqrs/{pqrId}/approve"
        actor: QCManager
        preconditions:
          - "PQR.status == DRAFT (else ERR_PQR_NOT_DRAFT)"
          - "thickness_range_max_mm > thickness_range_min_mm (else ERR_INVALID_THICKNESS_RANGE)"
        side_effects:
          - "PQR.reviewed_by_user_id := X-User-ID"
          - "PQR.version += 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /weld-shop/shops/{id}/pqrs/{pqrId}/reject"
        actor: QCManager
        preconditions:
          - "PQR.status == DRAFT (else ERR_PQR_NOT_DRAFT)"
        side_effects:
          - "PQR.version += 1"

  - entity: WPS
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    # APPROVED is not terminal: a newer revision can supersede it. Cycle: DRAFT(rev N) → APPROVED → SUPERSEDED when rev N+1 approved; new DRAFT created for rev N+1.
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /weld-shop/shops/{id}/wps/{wpsId}/approve"
        actor: QCManager
        preconditions:
          - "WPS.status == DRAFT (else ERR_WPS_NOT_DRAFT)"
          - "Referenced PQR.status == APPROVED (else ERR_PQR_NOT_APPROVED)"
          - "PQR.process == WPS.process (else ERR_WPS_PQR_PROCESS_MISMATCH)"
          - "PQR.base_metal_spec == WPS.base_metal_spec (else ERR_WPS_PQR_MATERIAL_MISMATCH)"
          - "PQR.thickness_range_min_mm <= WPS.thickness_min_mm AND WPS.thickness_max_mm <= PQR.thickness_range_max_mm (else ERR_WPS_THICKNESS_OUTSIDE_PQR)"
          - "Segregation: WPS.approving X-User-ID != PQR.reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "No other WPS in same shop with same wps_number and revision already APPROVED (else ERR_WPS_REVISION_CONFLICT)"
        side_effects:
          - "WPS.pinned_pqr_version := PQR.version"
          - "WPS.approved_by_user_id := X-User-ID"
          - "Any prior WPS in same shop with same wps_number and revision < this.revision and status == APPROVED transitions to SUPERSEDED; superseded_by_id := this WPS id (cyclic cascade)"
          - "All WelderQualification rows referencing a superseded WPS whose status == QUALIFIED are re-evaluated; those whose welder's last_weld_at_utc is older than 183 days at current_utc are flipped to LAPSED"
          - "WPS.version += 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /weld-shop/shops/{id}/wps/{wpsId}/reject"
        actor: QCManager
        preconditions:
          - "WPS.status == DRAFT"
        side_effects: ["WPS.version += 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade when a higher-revision WPS with same wps_number is approved"
        actor: system
        preconditions:
          - "A newer WPS revision in same shop with same wps_number transitioned DRAFT → APPROVED"
        side_effects:
          - "WPS.superseded_by_id := newer WPS id"
          - "WPS.version += 1"
          - "In-flight Joints referencing this WPS whose fabrication_status == PENDING are flipped to ON_HOLD until their wps_id is rebound to an APPROVED WPS"

  - entity: WelderQualification
    initial_state: QUALIFIED
    terminal_states: [REVOKED]
    transitions:
      - from: QUALIFIED
        to: LAPSED
        trigger: "system on continuity expiry: when current_utc >= continuity_expires_at_utc, OR cascaded by WPS supersession"
        actor: system
        preconditions:
          - "current_utc >= max(qualified_at_utc, last_weld_at_utc) + 183 days"
        side_effects:
          - "WelderQualification.version += 1"
          - "Welder.status recomputed: if no remaining QUALIFIED qualification → SUSPENDED"
      - from: LAPSED
        to: QUALIFIED
        trigger: "POST /weld-shop/shops/{id}/welder-qualifications/{qualId}/requalify"
        actor: QCManager
        preconditions:
          - "Qualification.status == LAPSED (else ERR_QUAL_NOT_LAPSED)"
          - "Welder.status != TERMINATED (else ERR_WELDER_TERMINATED)"
          - "WPS referenced by qual has status == APPROVED (not SUPERSEDED)"
        side_effects:
          - "qualified_at_utc := current_utc"
          - "last_weld_at_utc := current_utc"
          - "continuity_expires_at_utc := current_utc + 183 days"
          - "status := QUALIFIED"
          - "Welder.status recomputed"
      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /weld-shop/shops/{id}/welder-qualifications/{qualId}/revoke"
        actor: QCManager
        preconditions: []
        side_effects: ["Welder.status recomputed"]
      - from: LAPSED
        to: REVOKED
        trigger: "POST /weld-shop/shops/{id}/welder-qualifications/{qualId}/revoke"
        actor: QCManager
        preconditions: []
        side_effects: ["Welder.status recomputed"]

  - entity: ConsumableLot
    initial_state: IN_OVEN
    terminal_states: [EXHAUSTED, CONSUMED, QUARANTINED]
    transitions:
      - from: IN_OVEN
        to: ISSUED
        trigger: "POST /weld-shop/shops/{id}/consumable-issues (creates OPEN ConsumableIssue)"
        actor: MaterialController
        preconditions:
          - "Oven.status == ONLINE (else ERR_OVEN_NOT_ONLINE)"
          - "Lot.process supports the intended WPS process (validation-time check on first weld pass)"
          - "Lot.remaining_kg >= issued_kg (else ERR_INSUFFICIENT_LOT_QUANTITY)"
          - "Lot.status == IN_OVEN (else ERR_LOT_NOT_IN_OVEN)"
        side_effects:
          - "Lot.remaining_kg -= issued_kg"
          - "Lot.status := ISSUED"
      - from: ISSUED
        to: IN_OVEN
        trigger: "POST /weld-shop/shops/{id}/consumable-issues/{issueId}/return"
        actor: MaterialController
        preconditions:
          - "Issue.status == OPEN"
        side_effects:
          - "Issue.status := RETURNED; returned_at_utc := current_utc"
          - "Lot.exposed_minutes_total += Issue.exposure_minutes (computed as floor((returned_at_utc - issued_at_utc) / 60s))"
          - "If Lot.process == SMAW and Lot.exposed_minutes_total >= 240: Lot.status := QUARANTINED; else Lot.status := IN_OVEN if remaining_kg > 0 else EXHAUSTED"
          - "If Lot.status became QUARANTINED and Lot.rebake_count >= 1: Lot remains QUARANTINED permanently (cannot be rebaked again)"
      - from: QUARANTINED
        to: IN_OVEN
        trigger: "POST /weld-shop/shops/{id}/consumable-lots/{lotId}/rebake"
        actor: MaterialController
        preconditions:
          - "Lot.status == QUARANTINED (else ERR_LOT_NOT_QUARANTINED)"
          - "Lot.rebake_count < 1 (else ERR_LOT_REBAKE_LIMIT)"
          - "Oven referenced has status == ONLINE"
        side_effects:
          - "Lot.rebake_count += 1"
          - "Lot.exposed_minutes_total := 0"
          - "Lot.status := IN_OVEN"
      - from: ISSUED
        to: QUARANTINED
        trigger: "system cascade on oven OFFLINE event while issue is OPEN"
        actor: system
        preconditions: ["Oven holding this lot transitioned ONLINE → OFFLINE"]
        side_effects:
          - "Lot.status := QUARANTINED"
          - "All OPEN ConsumableIssues against this lot are voided (status := VOID)"
      - from: IN_OVEN
        to: EXHAUSTED
        trigger: "system when remaining_kg reaches 0 via issue or weld-pass consumption"
        actor: system
        preconditions: ["remaining_kg == 0"]
        side_effects: []

  - entity: Fixture
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /weld-shop/shops/{id}/fixtures/{fixtureId}/reserve"
        actor: ProductionPlanner
        preconditions:
          - "Fixture.status == AVAILABLE"
        side_effects: []
      - from: RESERVED
        to: IN_USE
        trigger: "system when first Weldment referencing this fixture has a Joint move PENDING → IN_PROGRESS"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: AVAILABLE
        trigger: "system when last non-terminal Weldment on this fixture reaches SHIPPED or CANCELLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /weld-shop/shops/{id}/fixtures/{fixtureId}/release"
        actor: ProductionPlanner
        preconditions: ["Fixture.status == RESERVED", "No Weldment in non-terminal posture references this fixture"]
        side_effects: []
      - from: IN_USE
        to: UNDER_REPAIR
        trigger: "POST /weld-shop/shops/{id}/fixtures/{fixtureId}/send-for-repair"
        actor: ProductionPlanner
        preconditions: ["Fixture.status == IN_USE", "All Weldments referencing fixture have posture in {SHIPPED, CANCELLED}"]
        side_effects: []

  - entity: Weldment
    initial_state: OPEN
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system derived posture — at least one Joint.fabrication_status == ON_HOLD OR one DistortionReport.disposition == PENDING exists"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: REPAIR_REVIEW
        trigger: "system derived posture — repair_rate_pct >= Shop.repair_rate_limit_pct (boundary: >=, not >)"
        actor: system
        preconditions: []
        side_effects:
          - "All Joint transitions to IN_PROGRESS are blocked while posture == REPAIR_REVIEW"
      - from: REPAIR_REVIEW
        to: OPEN
        trigger: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/clear-repair-review"
        actor: QCManager
        preconditions:
          - "Weldment.posture == REPAIR_REVIEW"
          - "All DistortionReports on weldment have disposition != PENDING"
        side_effects: ["Weldment.version += 1"]
      - from: RESTRICTED
        to: OPEN
        trigger: "system when the last PENDING DistortionReport is dispositioned AND no Joint is ON_HOLD"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: FROZEN
        trigger: "system when any Joint reaches inspection_status == NDT_FAILED and distortion_count >= 2"
        actor: system
        preconditions: []
        side_effects: ["All in-flight Inspection schedules for this weldment's joints are VOID (vendor slot released)"]
      - from: FROZEN
        to: OPEN
        trigger: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/unfreeze"
        actor: QCManager
        preconditions:
          - "Weldment.posture == FROZEN"
          - "All Joints with inspection_status == NDT_FAILED have been moved to REPAIR_REQUIRED or REPAIR_WELDED_OUT"
        side_effects: ["Weldment.version += 1"]
      - from: OPEN
        to: SHIPPED
        trigger: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/ship"
        actor: ShippingClerk
        preconditions:
          - "posture == OPEN (else ERR_WELDMENT_NOT_OPEN)"
          - "Every Joint.fabrication_status == WELDED_OUT (else ERR_JOINTS_NOT_WELDED_OUT)"
          - "Every Joint.inspection_status == NDT_PASSED (else ERR_JOINTS_NOT_NDT_PASSED)"
          - "All required TravelerSignOff step_codes {FIT_UP, WELD_OUT, VT, NDT, FINAL} present (else ERR_TRAVELER_INCOMPLETE)"
          - "Fixture referenced has been dispositioned: if owner_party == CUSTOMER, a release-to-customer record must exist; if SHOP, fixture must be AVAILABLE or IN_USE (else ERR_FIXTURE_NOT_DISPOSITIONED)"
        side_effects:
          - "signed_off_at_utc := current_utc"
          - "Weldment.version += 1"
          - "If this was the last non-terminal Weldment on its Fixture: Fixture IN_USE → AVAILABLE cascade"
          - "If all Weldments on parent ShopOrder are SHIPPED: ShopOrder IN_PROGRESS → COMPLETE"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "No WeldPass rows exist (else ERR_WELDMENT_HAS_PASSES)"
        side_effects:
          - "All non-terminal Joints on this weldment → CANCELLED"
          - "In-flight Inspections voided"
          - "Fixture cascade as in SHIPPED"

  - entity: Joint
    initial_state: "PENDING / NOT_READY (fabrication × inspection parallel)"
    terminal_states: [CANCELLED]
    transitions:
      - from: "fabrication: PENDING"
        to: "fabrication: IN_PROGRESS"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/start-fabrication"
        actor: WeldLead
        preconditions:
          - "fabrication_status == PENDING"
          - "Parent Weldment.posture ∈ {OPEN} (RESTRICTED, REPAIR_REVIEW, FROZEN all block) — else ERR_WELDMENT_NOT_OPEN"
          - "Joint.wps_id references WPS with status == APPROVED (else ERR_WPS_NOT_APPROVED)"
          - "Joint.base_metal_thickness_mm within [WPS.thickness_min_mm, WPS.thickness_max_mm] (else ERR_JOINT_THICKNESS_OUTSIDE_WPS)"
          - "Fixture of parent Weldment has status ∈ {RESERVED, IN_USE}"
        side_effects:
          - "inspection_status transitions NOT_READY → READY_FOR_VT when first WeldPass is recorded"
          - "If Joint's WPS is later SUPERSEDED while fabrication_status == PENDING, Joint → ON_HOLD (cyclic cascade)"
      - from: "fabrication: IN_PROGRESS"
        to: "fabrication: WELDED_OUT"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/weld-out"
        actor: WeldLead
        preconditions:
          - "fabrication_status == IN_PROGRESS"
          - "At least one WeldPass exists on this joint (else ERR_NO_WELD_PASSES)"
        side_effects:
          - "inspection_status := READY_FOR_VT (if not already further along)"
      - from: "inspection: READY_FOR_VT"
        to: "inspection: VT_PASSED"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/inspections with method=VT and result=PASS"
        actor: CWI
        preconditions:
          - "inspection_status == READY_FOR_VT"
          - "inspector_user_id (X-User-ID) must NOT equal any WeldPass.welder_id on this joint (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If required_ndt_methods ⊆ {VT}: inspection_status := NDT_PASSED; else := VT_PASSED awaiting UT/RT"
      - from: "inspection: VT_PASSED"
        to: "inspection: NDT_IN_PROGRESS"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/inspections with method ∈ {UT, RT} — schedule created"
        actor: CWI
        preconditions:
          - "inspection_status == VT_PASSED"
          - "vendor_id references NDTVendor with status == ACTIVE and method ∈ supported_methods (else ERR_NDT_VENDOR_INVALID)"
          - "Vendor slot available: count of Inspection rows for this vendor with overlapping [scheduled_start, scheduled_end) and result==null < vendor.hourly_capacity (ERR_NDT_VENDOR_SLOT_CONFLICT)"
        side_effects:
          - "inspection_status := NDT_IN_PROGRESS"
      - from: "inspection: NDT_IN_PROGRESS"
        to: "inspection: NDT_PASSED"
        trigger: "POST /weld-shop/shops/{id}/inspections/{inspectionId}/record-result with result=PASS"
        actor: CWI
        preconditions:
          - "Inspection.result is null"
          - "current_utc >= scheduled_end_utc (cannot record before scheduled slot elapses; else ERR_INSPECTION_TOO_EARLY)"
        side_effects:
          - "inspection_status := NDT_PASSED when all required_ndt_methods have a passing Inspection row"
          - "hold_point_released := true on the passing Inspection"
      - from: "inspection: NDT_IN_PROGRESS"
        to: "inspection: NDT_FAILED"
        trigger: "POST /weld-shop/shops/{id}/inspections/{inspectionId}/record-result with result=FAIL"
        actor: CWI
        preconditions: ["Inspection.result is null"]
        side_effects:
          - "inspection_status := NDT_FAILED"
          - "Joint.repair_cycle_count += 1"
          - "If Joint.repair_cycle_count > 2: Joint → CANCELLED (hard cap)"
          - "Parent Weldment.distortion_count recomputed; if >= 2, Weldment → FROZEN cascade"
      - from: "inspection: NDT_FAILED"
        to: "inspection: REPAIR_REQUIRED"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/declare-repair"
        actor: QCManager
        preconditions: ["inspection_status == NDT_FAILED"]
        side_effects:
          - "fabrication_status := IN_PROGRESS (re-open for repair passes)"
      - from: "inspection: REPAIR_REQUIRED"
        to: "inspection: REPAIR_WELDED_OUT"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/weld-out after at least one WeldPass with is_repair=true"
        actor: WeldLead
        preconditions:
          - "At least one WeldPass on this joint with is_repair=true recorded after the most recent NDT_FAILED transition"
        side_effects:
          - "inspection_status := READY_FOR_VT (repair re-inspection loop) — cyclic: VT → NDT flow repeats"
      - from: "fabrication: PENDING"
        to: "fabrication: ON_HOLD"
        trigger: "system cascade — Joint.wps_id referenced WPS transitioned APPROVED → SUPERSEDED"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Weldment posture recomputed (likely → RESTRICTED)"
      - from: "fabrication: ON_HOLD"
        to: "fabrication: PENDING"
        trigger: "POST /weld-shop/shops/{id}/joints/{jointId}/rebind-wps"
        actor: QCManager
        preconditions:
          - "fabrication_status == ON_HOLD"
          - "New wps_id references APPROVED WPS in same shop (else ERR_WPS_NOT_APPROVED)"
          - "Joint.base_metal_thickness_mm within new WPS thickness range (else ERR_JOINT_THICKNESS_OUTSIDE_WPS)"
        side_effects:
          - "Joint.wps_id := new APPROVED WPS id"
          - "Parent Weldment posture recomputed (RESTRICTED → OPEN if no other holds)"

  - entity: Oven
    initial_state: ONLINE
    terminal_states: []
    transitions:
      - from: ONLINE
        to: OFFLINE
        trigger: "POST /weld-shop/shops/{id}/ovens/{ovenId}/take-offline"
        actor: MaterialController
        preconditions: []
        side_effects:
          - "All ConsumableLots in this oven with status == ISSUED and an OPEN ConsumableIssue are cascaded to QUARANTINED; issues voided"
          - "All ConsumableLots in this oven with status == IN_OVEN remain IN_OVEN but cannot issue until oven back ONLINE"
      - from: OFFLINE
        to: ONLINE
        trigger: "POST /weld-shop/shops/{id}/ovens/{ovenId}/bring-online"
        actor: MaterialController
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: weldment-ship-stale-version
    parent_entity: Weldment
    write_endpoint: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/ship"
    occ_field: "expected_weldment_version"
    description: |
      Shipping a Weldment whose version has advanced since the client last
      observed it is rejected. A cascaded side effect (e.g., a Joint flipping
      to NDT_PASSED, or a DistortionReport disposition) bumps Weldment.version;
      a client retrying with the previously-observed version is therefore
      working from stale posture and must re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: joint-start-fab-stale-version
    parent_entity: Joint
    write_endpoint: "POST /weld-shop/shops/{id}/joints/{jointId}/start-fabrication"
    occ_field: "expected_joint_version"
    description: |
      Starting fabrication on a Joint whose version has advanced since the
      client last observed it is rejected. The WPS-supersede cascade mutates
      Joint.fabrication_status (PENDING → ON_HOLD) and bumps Joint.version;
      a subsequent start-fabrication carrying the pre-cascade version must
      fail so the client observes the ON_HOLD state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: wps-approve-stale-version
    parent_entity: WPS
    write_endpoint: "POST /weld-shop/shops/{id}/wps/{wpsId}/approve"
    occ_field: "expected_wps_version"
    description: |
      Approving a WPS whose version has advanced since the client last
      observed it is rejected. Approval mutates WPS state and triggers the
      supersession cascade on prior revisions; a stale client must re-read
      to discover the new revision graph.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: continuity_expiry
    trigger: "WelderQualification creation, WeldPass recording, requalification, and any system re-evaluation sweep"
    algorithm: chronological
    formula: |
      baseline = max(qualified_at_utc, last_weld_at_utc)
      continuity_expires_at_utc = baseline + 183 days
      is_lapsed = (current_utc >= continuity_expires_at_utc)
    input_set: "WelderQualification row + logical Shop.current_utc"
    constants:
      CONTINUITY_WINDOW_DAYS: 183
    precision: "datetime, second-granularity; boundary uses >= (lapsed AT the expiry instant)"
    variants:
      - name: prospective_continuity_check
        when: "Used when recording a WeldPass at welded_at_utc == current_utc"
        difference: "Evaluates is_lapsed at the moment of the weld pass"
      - name: retrospective_continuity_check
        when: "Used by WPS-supersession cascade re-evaluating all QUALIFIED rows"
        difference: "Evaluates is_lapsed against current_utc independent of any new weld activity; same formula, different evaluation trigger"

  - name: repair_rate_pct
    trigger: "WeldPass insert with is_repair flag, WeldPass delete, weldment recompute"
    algorithm: aggregation
    formula: |
      repair_pass_count = count(WeldPass where weldment_id = this AND is_repair = true)
      total_pass_count = count(WeldPass where weldment_id = this)
      repair_rate_pct = if total_pass_count == 0 then 0.0
                        else round_half_up(100.0 * repair_pass_count / total_pass_count, 2)
    input_set: "WeldPass rows scoped to weldment, no time window"
    constants:
      PERCENT_SCALE: 100.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: joint_scoped_repair_rate
        when: "Used to drive Joint.repair_cycle_count display and audit reports"
        difference: "Same formula but restricted to WeldPass rows for a single joint_id; not used for the REPAIR_REVIEW posture gate"
      - name: weldment_scoped_repair_rate
        when: "Used to drive Weldment.posture REPAIR_REVIEW gate"
        difference: "Aggregation across all joints on the weldment; the contractual gate"

  - name: exposure_minutes_on_return
    trigger: "ConsumableIssue return"
    algorithm: chronological
    formula: |
      exposure_minutes = floor((returned_at_utc - issued_at_utc).total_seconds() / 60)
      lot.exposed_minutes_total += exposure_minutes
      if lot.process == SMAW and lot.exposed_minutes_total >= 240 then quarantine
    input_set: "Single ConsumableIssue + its ConsumableLot"
    constants:
      SMAW_EXPOSURE_LIMIT_MINUTES: 240
    precision: "integer minutes, floor division"
    variants:
      - name: per_issue_exposure
        when: "Single issue return"
        difference: "Adds only this issue's exposure to lot.exposed_minutes_total"
      - name: aggregate_exposure_check
        when: "Quarantine evaluation"
        difference: "Compares lot.exposed_minutes_total (cumulative across all issues) against the limit"

  - name: ndt_slot_availability
    trigger: "Inspection scheduling with method ∈ {UT, RT}"
    algorithm: interval_merge
    formula: |
      overlapping = count(Inspection i where i.vendor_id == new.vendor_id
                          AND i.result IS NULL
                          AND i.scheduled_start_utc < new.scheduled_end_utc
                          AND i.scheduled_end_utc > new.scheduled_start_utc)
      slot_available = (overlapping < vendor.hourly_capacity)
    input_set: "Inspections for the vendor with null result (scheduled but not yet resulted)"
    constants: {}
    precision: "Half-open interval [start, end): inspections whose end == new.start do NOT conflict"
    variants:
      - name: vt_inhouse_slot
        when: "method == VT"
        difference: "VT is performed in-house; vendor_id must be null; no capacity check (CWI availability is not modelled)"
      - name: outsourced_slot
        when: "method ∈ {UT, RT}"
        difference: "Vendor capacity check applies"

  - name: wps_thickness_envelope
    trigger: "WPS approval, Joint start-fabrication, Joint rebind-wps"
    algorithm: threshold
    formula: |
      envelope_valid = (PQR.thickness_range_min_mm <= WPS.thickness_min_mm)
                   AND (WPS.thickness_max_mm <= PQR.thickness_range_max_mm)
                   AND (WPS.thickness_min_mm <= Joint.base_metal_thickness_mm)
                   AND (Joint.base_metal_thickness_mm <= WPS.thickness_max_mm)
      All comparisons inclusive (<=).
    input_set: "PQR + WPS + Joint triple"
    constants: {}
    precision: "floating-point mm; inclusive boundaries (<=)"
    variants:
      - name: approval_time_check
        when: "WPS approve"
        difference: "Validates WPS envelope ⊆ PQR envelope; no Joint involved yet"
      - name: joint_binding_check
        when: "Joint start-fabrication / rebind"
        difference: "Validates Joint thickness ∈ WPS envelope"

  - name: oven_load_kg
    trigger: "ConsumableLot creation (initial placement), rebake, lot transfer"
    algorithm: aggregation
    formula: |
      oven_load_kg = sum(remaining_kg for ConsumableLots where oven_id = X AND status IN {IN_OVEN, QUARANTINED})
      capacity_ok = (oven_load_kg + new_lot_kg) <= Oven.capacity_electrodes_kg
    input_set: "Lots currently in the oven; EXHAUSTED and CONSUMED excluded"
    constants: {}
    precision: "kg, 2 decimal places"
    variants:
      - name: capacity_check
        when: "Adding a new lot to oven"
        difference: "Compares projected load against capacity using <="
      - name: rebake_no_capacity_change
        when: "Rebake of existing lot"
        difference: "Lot remains in same oven; no capacity check is performed (it is already inside)"

  - name: repair_review_threshold_gate
    trigger: "Any change to Weldment.repair_rate_pct"
    algorithm: threshold
    formula: |
      posture_flag = (repair_rate_pct >= Shop.repair_rate_limit_pct)
      if posture_flag and posture == OPEN then posture := REPAIR_REVIEW
      The boundary is >=, not >: a weldment whose repair_rate_pct exactly
      equals the shop limit enters REPAIR_REVIEW.
    input_set: "Weldment.repair_rate_pct + Shop.repair_rate_limit_pct"
    constants: {}
    precision: "percentage as 2-decimal round_half_up; boundary uses >="

  - name: frozen_threshold
    trigger: "NDT record-result with result=FAIL, DistortionReport insert"
    algorithm: threshold
    formula: |
      frozen_flag = (weldment has at least one Joint with inspection_status == NDT_FAILED)
                AND (weldment.distortion_count >= 2)
      if frozen_flag and posture == OPEN then posture := FROZEN
    input_set: "Weldment's joints + distortion_count"
    constants:
      FROZEN_DISTORTION_THRESHOLD: 2
    precision: "integer counts; boundary >="

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters resolve to existing resources in declared parent chain"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC expected_<parent>_version matches parent's current version (when supplied)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/ship; POST /weld-shop/shops/{id}/joints/{jointId}/start-fabrication; POST /weld-shop/shops/{id}/wps/{wpsId}/approve"

  - priority: 5
    category: state
    check: "Resource in correct lifecycle state for this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  # --- Business safety / regulatory (welding code compliance) ---
  - priority: 6
    category: business_safety
    check: "Segregation of duties: WPS approver != supporting PQR reviewer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /weld-shop/shops/{id}/wps/{wpsId}/approve"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: VT inspector must not equal any welder who welded the joint"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /weld-shop/shops/{id}/joints/{jointId}/inspections (method=VT)"

  - priority: 8
    category: business_safety
    check: "WPS/PQR process and base-material spec match"
    error_id: ERR_WPS_PQR_PROCESS_MISMATCH
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/wps/{wpsId}/approve"

  - priority: 9
    category: business_safety
    check: "Thickness envelope: Joint thickness ∈ WPS envelope ⊆ PQR envelope (all inclusive)"
    error_id: ERR_JOINT_THICKNESS_OUTSIDE_WPS
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/joints/{jointId}/start-fabrication; POST /weld-shop/shops/{id}/joints/{jointId}/rebind-wps; POST /weld-shop/shops/{id}/wps/{wpsId}/approve"

  - priority: 10
    category: business_safety
    check: "Welder qualification continuity has not lapsed at welded_at_utc"
    error_id: ERR_WELDER_CONTINUITY_LAPSED
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/joints/{jointId}/weld-passes"

  - priority: 11
    category: business_safety
    check: "Consumable lot status usable (IN_OVEN at issue; ISSUED at weld-pass; not QUARANTINED/EXHAUSTED/CONSUMED)"
    error_id: ERR_LOT_NOT_USABLE
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/consumable-issues; POST /weld-shop/shops/{id}/joints/{jointId}/weld-passes"

  # --- Business constraint (graph/temporal/uniqueness) ---
  - priority: 12
    category: business_constraint
    check: "Weldment posture permits the requested action (OPEN for fabrication; not RESTRICTED/REPAIR_REVIEW/FROZEN)"
    error_id: ERR_WELDMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /weld-shop/shops/{id}/joints/{jointId}/start-fabrication; POST /weld-shop/shops/{id}/joints/{jointId}/weld-passes; POST /weld-shop/shops/{id}/joints/{jointId}/weld-out"

  - priority: 13
    category: business_temporal
    check: "NDT vendor slot overlap (half-open interval [start,end)) below vendor.hourly_capacity"
    error_id: ERR_NDT_VENDOR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /weld-shop/shops/{id}/joints/{jointId}/inspections (method ∈ {UT, RT})"

  - priority: 14
    category: business_temporal
    check: "Inspection result cannot be recorded before scheduled_end_utc"
    error_id: ERR_INSPECTION_TOO_EARLY
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/inspections/{inspectionId}/record-result"

  - priority: 15
    category: business_constraint
    check: "Joint repair_cycle_count <= 2 (hard cap)"
    error_id: ERR_REPAIR_CYCLE_LIMIT
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/joints/{jointId}/declare-repair"

  - priority: 16
    category: business_constraint
    check: "Oven capacity check on lot placement"
    error_id: ERR_OVEN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/consumable-lots; POST /weld-shop/shops/{id}/consumable-lots/{lotId}/rebake"

  - priority: 17
    category: business_constraint
    check: "SMAW lot rebake_count < 1"
    error_id: ERR_LOT_REBAKE_LIMIT
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/consumable-lots/{lotId}/rebake"

  # --- Business fiscal ---
  - priority: 18
    category: business_fiscal
    check: "Lot.remaining_kg >= issued_kg at issue time"
    error_id: ERR_INSUFFICIENT_LOT_QUANTITY
    http_status: 422
    applies_to: "POST /weld-shop/shops/{id}/consumable-issues"

  - priority: 19
    category: business_referential
    check: "All required traveler steps signed before SHIPPED"
    error_id: ERR_TRAVELER_INCOMPLETE
    http_status: 409
    applies_to: "POST /weld-shop/shops/{id}/weldments/{weldmentId}/ship"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Clock ----------
  - method: POST
    path: "/weld-shop/_clock/set_current_utc"
    description: "Set logical clock; startup default is 2026-08-01T00:00:00Z"
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: Shop
    side_effects: ["Shop.current_utc := to_iso8601", "Trigger welder-continuity sweep", "Trigger joint/weldment posture recomputation"]

  # ---------- Shop ----------
  - method: POST
    path: "/weld-shop/shops"
    description: "Create a shop"
    roles: [ShopAdmin]
    code: 201
    input: [shop_name, aws_d1_1_revision, "repair_rate_limit_pct?"]
    output: Shop
    side_effects: ["current_utc := 2026-08-01T00:00:00Z"]

  - method: GET
    path: "/weld-shop/shops/{id}"
    description: "Get shop"
    roles: [Any]
    code: 200
    input: []
    output: Shop
    side_effects: []

  # ---------- Welders ----------
  - method: POST
    path: "/weld-shop/shops/{id}/welders"
    description: "Create welder"
    roles: [ShopAdmin]
    code: 201
    input: [stencil, full_name]
    output: Welder
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/welders"
    description: "List welders"
    roles: [Any]
    code: 200
    input: []
    output: "Welder[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/welders/{welderId}"
    description: "Get welder"
    roles: [Any]
    code: 200
    input: []
    output: Welder
    side_effects: []

  # ---------- NDT Vendors ----------
  - method: POST
    path: "/weld-shop/shops/{id}/ndt-vendors"
