      - name: animal_record_put_amends_declared_weight_and_resets_compliance
        claim_type: standard_update
        grounds:
          - endpoints.PUT /animal-records/{id}
          - entities.AnimalRecord.fields.container_compliance_state
        distinguishing_aspect: "A partial amendment carries a targeted side effect: changing declared_weight_kg invalidates the container verdict, so container_compliance_state falls back to UNEVALUATED and deficiency_codes is cleared, while the lifecycle status stays SCREENED and the untouched fields keep their values."
        test_recipe:
          setup:
            - "A CHECKED reservation whose 20 kg Labrador has been screened to COMPLIANT with chargeable_weight_kg 27"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          trigger:
            - { call: "PUT /animal-records/${an1}", payload: { declared_weight_kg: 30 }, as: ReservationsAgent, as_user_id: "agent-01" }
          assert:
            - "response status is 200"
            - "AnimalRecord.${an1}.declared_weight_kg == 30"
            - "AnimalRecord.${an1}.container_compliance_state == UNEVALUATED and deficiency_codes == []"
            - "AnimalRecord.${an1}.status == SCREENED, animal_kind == PET and measured_weight_kg is null"
            - "AnimalRecord.${an1}.version == 3, one higher than after the screen"
            - "an amendment supplying only measured_weight_kg leaves container_compliance_state COMPLIANT, since the reset is keyed to container and declared-weight changes"

