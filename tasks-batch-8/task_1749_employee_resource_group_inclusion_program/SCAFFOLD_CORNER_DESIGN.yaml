          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"
      - name: duplicate_active_membership_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - "errors[ERR_ALREADY_MEMBER]"
        distinguishing_aspect: "A second join for the same (group_id, employee_id) while ACTIVE is rejected; the pair-unique constraint is per active membership."
        test_recipe:
          setup: ["program OPEN; group CHARTER_DRAFT; emp_x joined once"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Dup Member", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l38", captures: { g: $.data.id } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}" }, as: Employee, as_user_id: "emp_x" }
          trigger:
            - { call: "POST /v1/memberships", payload: { group_id: "${g}" }, as: Employee, as_user_id: "emp_x", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_MEMBER (HTTP 409)"
      - name: survey_response_state_window_and_duplicate_gates
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SURVEY_NOT_OPEN]"
          - "errors[ERR_SURVEY_WINDOW_CLOSED]"
          - "errors[ERR_DUPLICATE_RESPONSE]"
        distinguishing_aspect: "Three distinct gates on response submission: DRAFT survey -> ERR_SURVEY_NOT_OPEN; repeat respondent -> ERR_DUPLICATE_RESPONSE; clock past closes_at -> ERR_SURVEY_WINDOW_CLOSED."
        test_recipe:
          setup: ["program OPEN; survey with window 2026-08-01T00:00:00Z (inclusive) to 2026-08-05T00:00:00Z (exclusive)"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/climate-surveys", payload: { program_id: "${pid}", title: "Gates", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-05T00:00:00Z", min_responses: 1 }, as: DeiAdmin, captures: { sv: $.data.id } }
          trigger:
            - { call: "POST /v1/survey-responses", payload: { survey_id: "${sv}", belonging_score: 4, growth_score: 4, fairness_score: 4, safety_score: 4 }, as: Employee, as_user_id: "emp_r1", captures: { e1: $.data.error_id } }
            - { call: "POST /v1/climate-surveys/${sv}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/survey-responses", payload: { survey_id: "${sv}", belonging_score: 4, growth_score: 4, fairness_score: 4, safety_score: 4 }, as: Employee, as_user_id: "emp_r1" }
            - { call: "POST /v1/survey-responses", payload: { survey_id: "${sv}", belonging_score: 3, growth_score: 3, fairness_score: 3, safety_score: 3 }, as: Employee, as_user_id: "emp_r1", captures: { e2: $.data.error_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/survey-responses", payload: { survey_id: "${sv}", belonging_score: 2, growth_score: 2, fairness_score: 2, safety_score: 2 }, as: Employee, as_user_id: "emp_r2", captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_SURVEY_NOT_OPEN (DRAFT rejects responses)"
            - "first emp_r1 response succeeds (201)"
            - "e2 == ERR_DUPLICATE_RESPONSE (one response per respondent per survey)"
            - "e3 == ERR_SURVEY_WINDOW_CLOSED (clock at closes_at is outside the half-open window)"
      - name: survey_close_below_min_responses_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MIN_RESPONSES_NOT_MET]"
        distinguishing_aspect: "The failing side of the §1.8 boundary: response_count 1 < min_responses 2 -> close rejected."
        test_recipe:
          setup: ["program OPEN; survey OPEN with min_responses 2; exactly 1 response"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/climate-surveys", payload: { program_id: "${pid}", title: "Thin", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z", min_responses: 2 }, as: DeiAdmin, captures: { sv: $.data.id } }
            - { call: "POST /v1/climate-surveys/${sv}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/survey-responses", payload: { survey_id: "${sv}", belonging_score: 5, growth_score: 5, fairness_score: 5, safety_score: 5 }, as: Employee, as_user_id: "emp_r1" }
          trigger:
            - { call: "POST /v1/climate-surveys/${sv}/close", payload: {}, as: DeiAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MIN_RESPONSES_NOT_MET (HTTP 409); survey stays OPEN"
      - name: second_survey_open_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SURVEY_ALREADY_OPEN]"
