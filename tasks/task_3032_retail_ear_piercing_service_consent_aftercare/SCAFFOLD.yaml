      - name: follow_up_reminder_due_at
        type: datetime
        source: computed
        description: "Instant the aftercare follow-up reminder becomes due."
      - name: follow_up_acknowledged
        type: boolean
        source: system
        description: "Whether the customer acknowledged the aftercare follow-up."
        default: false
      - name: net_fee_cents
        type: integer
        source: computed
        description: "Fee payable after downgrade proration and any re-pierce discount."
      - name: service_status
        type: enum
        source: system
        description: "Parallel dimension tracking the service itself."
        constraints: "IN_PROGRESS | COMPLETED | ABORTED"
        default: IN_PROGRESS
      - name: healing_status
        type: enum
        source: system
        description: "Parallel dimension tracking wound healing, evolving independently of service_status."
        constraints: "HEALING | HEALED | FAILED | RE_PIERCED"
        default: HEALING

  - name: IncidentReport
