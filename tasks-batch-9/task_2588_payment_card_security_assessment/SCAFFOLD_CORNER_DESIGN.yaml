              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scan-cycles"
              payload: { quarter_label: "2026-Q3", asv_vendor_id: "${vendor_id}", window_start: "2026-07-01T00:00:00Z" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { cycle_id: $.data.id }
            - call: "POST /scan-cycles/${cycle_id}/complete"
              payload: {}
              as: AsvVendor
              as_user_id: "${vendor_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v_before: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { now_1: $.data.current_utc }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { compliant_after_1: $.data.quarterly_scan_compliant, eng_v_after_1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { now_2: $.data.current_utc }
          assert:
            - "Before the first clock move ScanCycle.${cycle_id}.status == PASSING and Engagement.${eng_id}.quarterly_scan_compliant == true"
            - "Both clock calls return HTTP 200 with a body whose only key is current_utc: ${now_1} == 2026-10-01T00:00:00Z and ${now_2} == 2027-07-01T00:00:00Z"
            - "${compliant_after_1} == false - 2026-10-01 is outside [2026-07-01T00:00:00Z, 2026-09-29T00:00:00Z)"
            - "ScanCycle.${cycle_id}.status is still PASSING and its window_start, window_end and effective_high_finding_count == 0 are unchanged - the clock reprojects the engagement flag, not the cycle's stored state"
            - "${eng_v_after_1} == ${eng_v_before} - moving the clock bumps no entity version"
            - "After the second clock move Assessor.${lead_id}.certification_status == EXPIRED while status is still ACTIVE, and Assessor.${qa_id}.certification_status == EXPIRED"
            - "After the second clock move AsvVendor.${vendor_id}.effective_approval == APPROVED - 2027-07-01 precedes 2027-12-31"
            - "GET /assessors?certification_status=EXPIRED returns total_count 2 and GET /asv-vendors?effective_approval=APPROVED returns total_count 1"
            - "GET /engagements/${eng_id}/summary reports quarterly_scan_compliant == false and the same posture OPEN as before"

      - name: endpoint_qa_reviewer_link_is_a_replaceable_cross_reference
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /engagements/{id}/qa-reviewer]
          - endpoints[GET /engagements]
          - entities.Engagement.fields.qa_reviewer_id
        distinguishing_aspect: "The nomination endpoint links an existing Assessor to an existing Engagement rather than creating anything, it returns the Engagement, and it is a replacement rather than an append: nominating a second qualified reviewer overwrites the first, so the qa_reviewer_id filter that made the FK reverse-reachable must now return the engagement under the new reviewer and nothing under the old one."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' was opened without a qa_reviewer_id, so the field is null."
            - "Two qa_qualified assessors exist: Kim Vance and Lena Ortiz, both ACTIVE and certified to 2027-06-30."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_1_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Lena Ortiz", email: "lena.ortiz@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_2_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id, eng_v1: $.data.version }
          trigger:
            - call: "POST /engagements/${eng_id}/qa-reviewer"
              payload: { qa_reviewer_id: "${qa_1_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng_id}/qa-reviewer"
              payload: { qa_reviewer_id: "${qa_2_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v3: $.data.version, linked_qa: $.data.qa_reviewer_id }
          assert:
            - "Immediately after creation Engagement.${eng_id}.qa_reviewer_id is null and GET /engagements?qa_reviewer_id=${qa_1_id} returns total_count 0"
            - "The first nomination returns HTTP 200 with an Engagement body whose qa_reviewer_id == ${qa_1_id} and ${eng_v2} == ${eng_v1} + 1"
            - "The second nomination returns HTTP 200 with ${linked_qa} == ${qa_2_id} and ${eng_v3} == ${eng_v2} + 1"
            - "GET /engagements?qa_reviewer_id=${qa_2_id} returns total_count 1 and GET /engagements?qa_reviewer_id=${qa_1_id} returns total_count 0 after the replacement"
            - "GET /engagements?lead_assessor_id=${lead_id} still returns total_count 1 - the lead link is untouched"
            - "Neither call creates a row anywhere: GET /assessors returns total_count 3 throughout"
            - "Engagement.${eng_id}.status is still SCOPING and posture still OPEN - nomination is not a lifecycle event"

      - name: endpoint_roc_creation_is_conditional_on_engagement_posture
        claim_type: Conditional action
        grounds:
          - endpoints[POST /engagements/{id}/rocs]
          - validations[priority=8]
        excluded_because:
          difficulty_instance: roc_creation_blocked_by_unvalidated_segment_posture
          rationale: "That §1.8 instance drives the conditional arm of this endpoint: with one segment still in a pre-VALIDATED state the engagement is RESTRICTED and report creation answers 409 ERR_ENGAGEMENT_RESTRICTED, and the same call succeeds once the segment reaches VALIDATED - so the action's availability is a function of engagement posture rather than of the request."

  # ---------------------------------------------------------------------------
  # Section 6 — Errors (every §1.6 code not already exercised by another section)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: error_unresolvable_actor_returns_unauthenticated_before_any_other_rule
        claim_type: ERR_UNAUTHENTICATED
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 runs before request-shape and body-existence checks, so a request with no X-User-ID header answers 401 ERR_UNAUTHENTICATED even though the same body would also fail on a missing required field and a non-existent lead_assessor_id. A header that is present but resolves to no assessor, vendor or operator is treated identically."
        test_recipe:
          setup:
            - "No actor is registered beyond the single assessor Dana Reyes; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              note: "sent with no X-User-ID header at all; the body is also short of assessment_year and names an unknown lead"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }
              captures: { err_no_header: $.data.error_id }
            - call: "GET /engagements"
              note: "sent with X-User-ID: ffffffff-ffff-4fff-8fff-ffffffffffff, which resolves to no assessor, vendor or operator"
              payload: {}
              captures: { err_bad_header: $.data.error_id }
          assert:
            - "The first call returns HTTP 401 with ${err_no_header} == ERR_UNAUTHENTICATED - not ERR_INVALID_REQUEST for the absent assessment_year and not ERR_ASSESSOR_NOT_FOUND for the unknown lead"
            - "The second call returns HTTP 401 with ${err_bad_header} == ERR_UNAUTHENTICATED even though a read endpoint is open to every role"
            - "Both responses carry the standard envelope: an error_id and a human-readable message, and no engagement was created"
            - "The same GET /engagements sent with X-User-ID ${lead_id} returns HTTP 200 with total_count 0"

      - name: error_every_path_identifier_answers_its_own_not_found_code
        claim_type: ERR_*_NOT_FOUND
        grounds:
          - validations[priority=4]
          - errors[ERR_ASSESSOR_NOT_FOUND]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_CHANGE_LOG_ENTRY_NOT_FOUND]
        distinguishing_aspect: "Each of the fourteen entities has its own 404 code, so a single generic ERR_NOT_FOUND is wrong: the same fabricated identifier must produce fourteen different error_id values depending on which collection it was addressed to, while the HTTP status stays 404 throughout."
        test_recipe:
          setup:
            - "One assessor exists so the caller can authenticate; no other row of any kind exists."
            - "The identifier ffffffff-ffff-4fff-8fff-ffffffffffff is used everywhere and matches nothing."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
          trigger:
            - call: "GET /assessors/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_assessor: $.data.error_id }
            - call: "GET /asv-vendors/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_vendor: $.data.error_id }
            - call: "GET /engagements/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_engagement: $.data.error_id }
            - call: "GET /network-segments/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_segment: $.data.error_id }
            - call: "GET /system-components/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_component: $.data.error_id }
            - call: "GET /sampling-plans/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_plan: $.data.error_id }
            - call: "GET /requirement-assessments/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_requirement: $.data.error_id }
            - call: "GET /evidence-items/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_evidence: $.data.error_id }
            - call: "GET /ccws/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_ccw: $.data.error_id }
            - call: "GET /remediation-items/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_remediation: $.data.error_id }
            - call: "GET /rocs/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_roc: $.data.error_id }
            - call: "GET /scan-cycles/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_cycle: $.data.error_id }
            - call: "GET /scan-findings/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { e_finding: $.data.error_id }
            - call: "GET /change-log-entries/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: LeadAssessor
