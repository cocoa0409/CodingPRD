# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3187_interagency_toll_reciprocity_image_billing_violation_escalation
# Domain: Interagency toll reciprocity, image billing & violation escalation
# =============================================================================

scenario: |
  Interagency Toll Reciprocity, Image Billing & Violation Escalation (E-ZPass
  Group): transponder account issuance by a home agency with usage across
  member agencies and reciprocal fee settlement, toll transaction processing
  with agency-specific rate schedules, discount plans and vehicle
  classification, image-based billing when a transponder is unread with
  license plate lookup across jurisdictions, violation notice issuance with
  administrative fees, escalation timelines and registration hold referrals,
  disputes over vehicle classification, misread plates and rental vehicle
  assignment, interagency settlement files with reconciliation and exception
  handling, account replenishment, balance thresholds and low-balance
  suspension, out-of-state plate data agreements.

domain_name: interagency-toll-reciprocity
api_prefix: /toll

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # reciprocal fee settlement + reconciliation between agencies
  secondary_archetype: workflow_orchestration     # violation escalation pipeline with branching + timeouts
  complexity_layers:
    - optimistic_concurrency                      # OCC on Account.version for replenishment & dispute-driven adjustments
    - cascading_side_effects                      # toll post -> balance -> replenishment -> account status; violation -> notice -> escalation -> reg hold referral
    - dual_variant_calculation                    # settlement fee per-line vs aggregate; misread-plate rebill net-credit vs void-and-rebill
    - rate_threshold_triggers                     # low-balance threshold, daily discount cap, reg-hold outstanding threshold
    - ops_run_checkpoint                          # nightly settlement file generation + advance_day epoch
    - temporal_windowing                          # dispute windows, escalation timelines, plate-data agreement validity windows
  entity_topology: hybrid                         # agencies root; accounts/transponders hierarchical; settlement files cross-cut agencies
  state_machine_shape: branching                  # violations branch (paid / disputed / escalated), disputes cycle review rounds
  relationship_patterns:
    - one_to_many                                 # Agency -> Account -> Transponder -> TollTransaction
    - many_to_many                                # Agency <-> Agency via SettlementFile; PlateDataAgreement links agency pairs
    - cross_aggregate                             # TollTransaction references RateSchedule of the away agency; Dispute references ImageBill
  role_model: peer_roles                          # AccountHolder, AgencyOperations, SettlementOfficer, ViolationsOfficer, PlateLookupAgent
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: agency_code, type: string, source: input, description: "Unique 2-4 letter agency code (e.g., NYTA, NJTA, ISTHA)" }
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: home_state, type: string, source: input, description: "Two-letter home state code" }
      - { name: reciprocity_fee_bps, type: integer, source: input, description: "Reciprocity fee in basis points charged to home agency on settled away-agency tolls (e.g., 150 = 1.5%)" }
      - { name: settlement_currency, type: string, source: input, default: "USD", description: "Settlement currency code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED; SUSPENDED agencies cannot post new toll transactions or receive lookups" }

  - name: RateSchedule
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning (away) agency" }
      - { name: plaza_code, type: string, source: input, description: "Toll plaza / gantry identifier within the agency" }
      - { name: vehicle_class, type: enum, source: input, description: "CLASS_2 (passenger 2-axle) | CLASS_5 (5-axle truck) | CLASS_7 (7+ axle oversized)", constraints: "CLASS_2 | CLASS_5 | CLASS_7" }
      - { name: base_rate_cents, type: integer, source: input, description: "Base toll for this plaza+class in cents, off-peak" }
      - { name: axle_multiplier, type: number, source: input, description: "Multiplier applied to base_rate_cents by axle class (e.g., 2.50 for CLASS_5)" }
      - { name: peak_multiplier, type: number, source: input, default: 1.0, description: "Peak-hour multiplier applied after axle multiplier (1.25 during peak windows)" }
      - { name: image_fee_cents, type: integer, source: input, default: 100, description: "Administrative surcharge added for image-based (video) tolls, never discounted" }
      - { name: effective_from, type: datetime, source: input, description: "Schedule becomes usable at this UTC instant" }
      - { name: effective_to, type: datetime, source: input, description: "Schedule stops being usable at this UTC instant; half-open [effective_from, effective_to)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "ACTIVE | RETIRED" }

  - name: DiscountPlan
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; issuing (home) agency of the plan" }
      - { name: plan_code, type: string, source: input, description: "Plan identifier unique within the agency" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount on the toll portion only (e.g., 0.20 = 20%)" }
      - { name: daily_discount_cap_cents, type: integer, source: input, description: "Maximum total discount cents an account may receive per UTC calendar day across all trips on this plan; 0 = uncapped" }
      - { name: applies_to_agency_codes, type: array, source: input, description: "List of away agency codes whose tolls this plan discounts; empty array = home agency only" }
      - { name: min_trips_per_month, type: integer, source: input, default: 0, description: "If > 0, discount applies only once the account has at least this many posted transponder trips in the current UTC month" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "ACTIVE | RETIRED" }

  - name: Account
    parent: Agency
    common_fields: true
    fields:
      - { name: home_agency_id, type: string, source: system, description: "FK -> Agency.id; issuing home agency" }
      - { name: holder_name, type: string, source: input, description: "Account holder full name" }
      - { name: holder_email, type: string, source: input, description: "Account holder email" }
      - { name: discount_plan_id, type: string, source: input, description: "FK -> DiscountPlan.id; the account's enrolled discount plan" }
      - { name: balance_cents, type: integer, source: computed, description: "Prepaid balance; debited by tolls, credited by replenishment and dispute credits" }
      - { name: low_balance_threshold_cents, type: integer, source: input, default: 1000, description: "Replenishment triggers when balance drops strictly below this after a toll posts" }
      - { name: replenishment_amount_cents, type: integer, source: input, default: 2500, description: "Amount charged to the payment method on each replenishment" }
      - { name: replenishment_fail_count, type: integer, source: system, default: 0, description: "Consecutive failed replenishment attempts; reset to 0 on any successful replenishment" }
      - { name: discount_used_today_cents, type: integer, source: computed, default: 0, description: "Running total of discount cents granted to this account on the current UTC day; reset by advance_day" }
      - { name: trips_this_month, type: integer, source: computed, default: 0, description: "Count of POSTED transponder toll transactions in the current UTC month; reset by advance_day on month rollover" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: suspended_reason, type: enum, source: system, description: "Null unless SUSPENDED: REPLENISHMENT_FAILED | VIOLATION_ESCALATION", constraints: "null | REPLENISHMENT_FAILED | VIOLATION_ESCALATION" }

  - name: Transponder
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: tag_number, type: string, source: input, description: "Physical tag serial, unique across all agencies" }
      - { name: vehicle_class, type: enum, source: input, description: "CLASS_2 | CLASS_5 | CLASS_7 — declared class of the vehicle the tag is mounted on", constraints: "CLASS_2 | CLASS_5 | CLASS_7" }
      - { name: plate_number, type: string, source: input, description: "License plate of the primary vehicle" }
      - { name: plate_state, type: string, source: input, description: "Issuing state of the primary plate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REPORTED_LOST | RETIRED", constraints: "ACTIVE | REPORTED_LOST | RETIRED" }

  - name: TollTransaction
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; billed account" }
      - { name: transponder_id, type: string, source: system, description: "FK -> Transponder.id; null for image-based transactions" }
      - { name: away_agency_id, type: string, source: system, description: "FK -> Agency.id; agency whose plaza recorded the trip" }
      - { name: rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; schedule used to price the trip" }
      - { name: plaza_code, type: string, source: input, description: "Plaza where the trip occurred" }
      - { name: trip_timestamp, type: datetime, source: input, description: "UTC instant of the trip" }
      - { name: is_peak, type: boolean, source: input, description: "Whether the trip falls in the plaza's peak window" }
      - { name: billed_vehicle_class, type: enum, source: system, description: "Class actually billed; equals transponder class unless a classification dispute reclasses it", constraints: "CLASS_2 | CLASS_5 | CLASS_7" }
      - { name: detection_method, type: enum, source: system, description: "TRANSPONDER | IMAGE", constraints: "TRANSPONDER | IMAGE" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Charged amount BEFORE discount: transponder = round(round(base*axle)*peak); image = same + image_fee_cents" }
      - { name: discount_amount_cents, type: integer, source: computed, description: "Discount applied (0 for IMAGE tolls and after daily cap exhausted)" }
      - { name: charged_amount_cents, type: integer, source: computed, description: "gross_amount_cents - discount_amount_cents; the amount debited from the account" }
      - { name: status, type: enum, source: system, description: "POSTED | SETTLED | VOIDED | DISPUTED", constraints: "POSTED | SETTLED | VOIDED | DISPUTED" }
      - { name: settlement_file_id, type: string, source: system, description: "FK -> SettlementFile.id; set when the transaction is swept into a settlement file; null until then" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied key; duplicate (away_agency_id, plaza_code, trip_timestamp, tag/plate, idempotency_key) rejected" }

  - name: ImageBill
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; null when the plate resolves to no account (unregistered plate -> direct violation path)" }
      - { name: plate_number, type: string, source: input, description: "Plate read from the image" }
      - { name: plate_state, type: string, source: input, description: "State read from the image" }
      - { name: toll_transaction_id, type: string, source: system, description: "FK -> TollTransaction.id; the image transaction this bill covers" }
      - { name: lookup_agency_id, type: string, source: system, description: "FK -> Agency.id; agency that answered the plate lookup" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Amount billed to the account (video rate); equals TollTransaction.charged_amount_cents at creation" }
      - { name: misread_flag, type: boolean, source: system, default: false, description: "Set true when a misread-plate dispute is upheld" }
      - { name: status, type: enum, source: system, description: "PENDING_LOOKUP | BILLED | REBILLED | VOIDED | ESCALATED", constraints: "PENDING_LOOKUP | BILLED | REBILLED | VOIDED | ESCALATED" }

  - name: Violation
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; violating account (null for unregistered-plate violations)" }
      - { name: plate_number, type: string, source: system, description: "Plate on the violation" }
      - { name: plate_state, type: string, source: system, description: "Plate state on the violation" }
      - { name: toll_transaction_id, type: string, source: system, description: "FK -> TollTransaction.id; underlying unpaid transaction" }
      - { name: image_bill_id, type: string, source: system, description: "FK -> ImageBill.id; set when the violation stems from an unpaid image bill; null otherwise" }
      - { name: toll_amount_cents, type: integer, source: computed, description: "Unpaid toll portion carried into the violation" }
      - { name: notice_count, type: integer, source: system, default: 0, description: "Number of notices issued (0..3)" }
      - { name: admin_fees_cents, type: integer, source: computed, default: 0, description: "Cumulative administrative fees from issued notices" }
      - { name: total_outstanding_cents, type: integer, source: computed, description: "toll_amount_cents + admin_fees_cents, reduced by payments" }
      - { name: first_notice_day, type: integer, source: system, description: "Epoch day index when notice 1 was issued (from advance_day counter)" }
      - { name: current_notice_day, type: integer, source: system, description: "Epoch day index of the most recent notice" }
      - { name: registration_hold_referred, type: boolean, source: system, default: false, description: "True once a registration hold referral has been sent to the plate state DMV" }
      - { name: status, type: enum, source: system, description: "OPEN | NOTICED | ESCALATED | HOLD_REFERRED | PAID | DISMISSED", constraints: "OPEN | NOTICED | ESCALATED | HOLD_REFERRED | PAID | DISMISSED" }

  - name: Dispute
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; disputing account (null allowed only for plate-owner disputes on unregistered violations)" }
      - { name: dispute_type, type: enum, source: input, description: "VEHICLE_CLASSIFICATION | MISREAD_PLATE | RENTAL_VEHICLE", constraints: "VEHICLE_CLASSIFICATION | MISREAD_PLATE | RENTAL_VEHICLE" }
      - { name: toll_transaction_id, type: string, source: input, description: "FK -> TollTransaction.id; transaction under dispute (required for VEHICLE_CLASSIFICATION)" }
      - { name: image_bill_id, type: string, source: input, description: "FK -> ImageBill.id; image bill under dispute (required for MISREAD_PLATE and RENTAL_VEHICLE)" }
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id; optional — present when the dispute targets an escalated violation" }
      - { name: claimed_vehicle_class, type: enum, source: input, description: "For VEHICLE_CLASSIFICATION: the class the holder claims (must differ from billed)", constraints: "CLASS_2 | CLASS_5 | CLASS_7 | null" }
      - { name: claimed_plate_number, type: string, source: input, description: "For MISREAD_PLATE: the plate the holder claims was actually present" }
      - { name: rental_agreement_ref, type: string, source: input, description: "For RENTAL_VEHICLE: rental agreement reference reassigning liability" }
      - { name: filed_day, type: integer, source: system, description: "Epoch day index when filed" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHOLD | REJECTED | WITHDRAWN", constraints: "FILED | UNDER_REVIEW | UPHOLD | REJECTED | WITHDRAWN" }

  - name: SettlementFile
    parent: null
    common_fields: true
    fields:
      - { name: from_agency_id, type: string, source: system, description: "FK -> Agency.id; home agency that collected (owes the away agency)" }
      - { name: to_agency_id, type: string, source: system, description: "FK -> Agency.id; away agency that provided the toll facility (is owed)" }
      - { name: settlement_day, type: integer, source: system, description: "Epoch day index this file covers" }
      - { name: line_count, type: integer, source: computed, description: "Number of POSTED transactions swept in" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum of charged_amount_cents across swept lines" }
      - { name: fee_amount_cents, type: integer, source: computed, description: "Sum of per-line reciprocity fees (each line: round_half_up(line_charged * to_agency.reciprocity_fee_bps / 10000))" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_amount_cents - fee_amount_cents; what from_agency owes to_agency" }
      - { name: exception_count, type: integer, source: computed, default: 0, description: "Number of lines flagged as exceptions during reconciliation" }
      - { name: status, type: enum, source: system, description: "GENERATED | TRANSMITTED | ACKNOWLEDGED | RECONCILED | DISPUTED_SETTLEMENT", constraints: "GENERATED | TRANSMITTED | ACKNOWLEDGED | RECONCILED | DISPUTED_SETTLEMENT" }

  - name: PlateDataAgreement
    parent: null
    common_fields: true
    fields:
      - { name: requesting_agency_id, type: string, source: system, description: "FK -> Agency.id; agency that may request plate lookups" }
      - { name: providing_agency_id, type: string, source: system, description: "FK -> Agency.id; agency (DMV proxy) that provides plate data" }
      - { name: effective_from, type: datetime, source: input, description: "Agreement valid from this UTC instant" }
      - { name: effective_to, type: datetime, source: input, description: "Agreement valid until this UTC instant; half-open [effective_from, effective_to)" }
      - { name: covers_states, type: array, source: input, description: "List of state codes whose plates the providing agency will resolve" }
      - { name: per_lookup_fee_cents, type: integer, source: input, default: 25, description: "Fee the requesting agency pays per resolved lookup" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", constraints: "ACTIVE | EXPIRED | REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agency
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /toll/agencies/{agencyId}/suspend"
        actor: SettlementOfficer
        preconditions:
          - "No SettlementFile with this agency as from_agency or to_agency in status GENERATED or TRANSMITTED (ERR_AGENCY_HAS_PENDING_SETTLEMENT)"
        side_effects:
          - "Blocks new TollTransaction posting at this agency's plazas (ERR_AGENCY_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /toll/agencies/{agencyId}/reactivate"
        actor: SettlementOfficer
        preconditions: []
        side_effects: []

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (third consecutive failed replenishment, or violation escalation referral on sole account)"
        actor: system
        preconditions:
          - "replenishment_fail_count reaches 3, OR a Violation on this account transitions to HOLD_REFERRED while total_outstanding_cents > 0"
        side_effects:
          - "suspended_reason set (REPLENISHMENT_FAILED or VIOLATION_ESCALATION)"
          - "All ACTIVE Transponders on the account become ineligible for new toll postings (ERR_ACCOUNT_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /toll/accounts/{accountId}/reinstate"
        actor: AgencyOperations
        preconditions:
          - "balance_cents >= low_balance_threshold_cents (ERR_BALANCE_BELOW_THRESHOLD)"
          - "No Violation on this account in status ESCALATED or HOLD_REFERRED with total_outstanding_cents > 0 (ERR_ACCOUNT_HAS_UNRESOLVED_VIOLATIONS)"
        side_effects:
          - "replenishment_fail_count reset to 0"
          - "suspended_reason cleared to null"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /toll/accounts/{accountId}/close"
        actor: AccountHolder
        preconditions:
          - "No Violation on this account with status in {OPEN, NOTICED, ESCALATED, HOLD_REFERRED} (ERR_ACCOUNT_HAS_UNRESOLVED_VIOLATIONS)"
          - "No TollTransaction on this account in status POSTED (ERR_ACCOUNT_HAS_UNSETTLED_TRANSACTIONS)"
        side_effects:
          - "balance_cents paid out (returned to holder); set to 0"
          - "All Transponders on the account transition ACTIVE -> RETIRED"

  - entity: Transponder
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: REPORTED_LOST
        trigger: "POST /toll/transponders/{transponderId}/report_lost"
        actor: AccountHolder
        preconditions: []
        side_effects:
          - "Trips with trip_timestamp after the report and this tag are routed to image-billing path instead of account debit"
      - from: REPORTED_LOST
        to: ACTIVE
        trigger: "POST /toll/transponders/{transponderId}/report_found"
        actor: AccountHolder
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /toll/transponders/{transponderId}/retire OR system cascade on Account close"
        actor: AccountHolder | system
        preconditions: []
        side_effects: []

  - entity: TollTransaction
    initial_state: POSTED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: POSTED
        to: SETTLED
        trigger: "system (swept by POST /toll/settlement-files/generate)"
        actor: system
        preconditions:
          - "Transaction not already attached to a SettlementFile"
        side_effects:
          - "settlement_file_id set"
          - "SettlementFile.line_count, gross_amount_cents, fee_amount_cents, net_amount_cents recomputed"
      - from: POSTED
        to: DISPUTED
        trigger: "system (VEHICLE_CLASSIFICATION Dispute filed against this transaction)"
        actor: system
        preconditions: []
        side_effects:
          - "Transaction excluded from settlement sweep while DISPUTED"
      - from: DISPUTED
        to: POSTED
        trigger: "system (dispute REJECTED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "If dispute was REJECTED with a corrected class: billed_vehicle_class, gross/discount/charged recomputed and Account.balance_cents adjusted by the delta"
      - from: DISPUTED
        to: VOIDED
        trigger: "system (dispute UPHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Account.balance_cents credited back charged_amount_cents"
      - from: POSTED
        to: VOIDED
        trigger: "POST /toll/toll-transactions/{transactionId}/void"
        actor: AgencyOperations
        preconditions:
          - "Transaction not yet in a SettlementFile (ERR_TRANSACTION_ALREADY_SETTLED)"
        side_effects:
          - "Account.balance_cents credited back charged_amount_cents"

  - entity: ImageBill
    initial_state: PENDING_LOOKUP
    terminal_states: [VOIDED, REBILLED]
    transitions:
      - from: PENDING_LOOKUP
        to: BILLED
        trigger: "system (plate lookup resolves to an account) OR POST /toll/image-bills/{imageBillId}/resolve with resolved_account_id"
        actor: PlateLookupAgent
        preconditions:
          - "A PlateDataAgreement in status ACTIVE exists where requesting_agency is the away agency of the trip, providing_agency covers the plate_state, and the logical clock is inside [effective_from, effective_to) (ERR_PLATE_LOOKUP_NOT_AVAILABLE)"
        side_effects:
          - "Account.balance_cents debited billed_amount_cents"
          - "lookup_agency_id set"
          - "PlateDataAgreement usage fee recorded for settlement"
      - from: PENDING_LOOKUP
        to: ESCALATED
        trigger: "system (lookup resolves to no account OR account suspended at resolve time)"
        actor: system
        preconditions: []
        side_effects:
          - "A Violation is created with toll_amount_cents = billed_amount_cents and image_bill_id pointing here"
      - from: BILLED
        to: REBILLED
        trigger: "system (MISREAD_PLATE or RENTAL_VEHICLE dispute UPHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Original account credited billed_amount_cents (net-credit variant: single credit entry)"
          - "misread_flag set true for MISREAD_PLATE"
          - "A new ImageBill is created for the corrected plate/rental liable party in PENDING_LOOKUP"
      - from: BILLED
        to: VOIDED
        trigger: "POST /toll/image-bills/{imageBillId}/void"
        actor: AgencyOperations
        preconditions:
          - "No Dispute in FILED or UNDER_REVIEW references this image bill (ERR_IMAGE_BILL_HAS_ACTIVE_DISPUTE)"
        side_effects:
          - "Account.balance_cents credited billed_amount_cents"
      - from: PENDING_LOOKUP
        to: VOIDED
        trigger: "POST /toll/image-bills/{imageBillId}/void"
        actor: AgencyOperations
        preconditions: []
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [PAID, DISMISSED]
    transitions:
      - from: OPEN
        to: NOTICED
        trigger: "POST /toll/violations/{violationId}/issue_notice (notice 1)"
        actor: ViolationsOfficer
        preconditions:
          - "notice_count == 0"
        side_effects:
          - "notice_count = 1; admin_fees_cents += 500; total_outstanding_cents recomputed"
          - "first_notice_day = current epoch day; current_notice_day = current epoch day"
      - from: NOTICED
        to: NOTICED
        trigger: "POST /toll/violations/{violationId}/issue_notice (notices 2 and 3)"
        actor: ViolationsOfficer
        preconditions:
          - "notice_count IN {1, 2} (ERR_NOTICE_LIMIT_REACHED at 3)"
          - "current epoch day >= current_notice_day + 30 (ERR_NOTICE_TOO_SOON)"
        side_effects:
          - "notice_count += 1; admin_fees_cents += (notice_count == 2 ? 2500 : 5000); total_outstanding_cents recomputed"
          - "current_notice_day = current epoch day"
      - from: NOTICED
        to: ESCALATED
        trigger: "system (during advance_day: notice 3 issued and current day >= first_notice_day + 60)"
        actor: system
        preconditions:
          - "notice_count == 3"
          - "current epoch day >= first_notice_day + 60"
        side_effects:
          - "If total_outstanding_cents >= 10000: registration_hold_referred = true and status becomes HOLD_REFERRED instead"
      - from: ESCALATED
        to: HOLD_REFERRED
        trigger: "system (during advance_day: total_outstanding_cents >= 10000)"
        actor: system
        preconditions:
          - "total_outstanding_cents >= 10000"
        side_effects:
          - "registration_hold_referred = true"
          - "Account (if any) transitions to SUSPENDED with suspended_reason = VIOLATION_ESCALATION"
      - from: OPEN
        to: PAID
        trigger: "POST /toll/violations/{violationId}/pay"
        actor: AccountHolder | ViolationsOfficer
        preconditions: []
        side_effects:
          - "total_outstanding_cents set to 0; payment recorded"
      - from: NOTICED
        to: PAID
        trigger: "POST /toll/violations/{violationId}/pay"
        actor: AccountHolder | ViolationsOfficer
        preconditions: []
        side_effects:
          - "total_outstanding_cents set to 0"
      - from: ESCALATED
        to: PAID
        trigger: "POST /toll/violations/{violationId}/pay"
        actor: AccountHolder | ViolationsOfficer
        preconditions: []
        side_effects:
          - "total_outstanding_cents set to 0; registration_hold_referred unchanged (hold release is a separate DMV flow)"
      - from: HOLD_REFERRED
        to: PAID
        trigger: "POST /toll/violations/{violationId}/pay"
        actor: AccountHolder | ViolationsOfficer
        preconditions: []
        side_effects:
          - "total_outstanding_cents set to 0"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /toll/violations/{violationId}/dismiss"
        actor: ViolationsOfficer
        preconditions: []
        side_effects: []
      - from: NOTICED
        to: DISMISSED
        trigger: "POST /toll/violations/{violationId}/dismiss OR system (linked dispute UPHOLD)"
        actor: ViolationsOfficer | system
        preconditions: []
        side_effects:
          - "If dismissed via upheld dispute: total_outstanding_cents zeroed and any debited amount credited back"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [UPHOLD, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /toll/disputes/{disputeId}/begin_review"
        actor: ViolationsOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHOLD
        trigger: "POST /toll/disputes/{disputeId}/uphold"
        actor: ViolationsOfficer
        preconditions: []
        side_effects:
          - "VEHICLE_CLASSIFICATION: transaction re-priced at claimed_vehicle_class; Account.balance_cents credited (old charged - new charged); transaction returns to POSTED with corrected billed_vehicle_class"
          - "MISREAD_PLATE / RENTAL_VEHICLE: linked ImageBill transitions BILLED -> REBILLED; linked Violation (if any) -> DISMISSED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /toll/disputes/{disputeId}/reject"
        actor: ViolationsOfficer
        preconditions: []
        side_effects:
          - "VEHICLE_CLASSIFICATION: transaction returns DISPUTED -> POSTED unchanged"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /toll/disputes/{disputeId}/withdraw"
        actor: AccountHolder
        preconditions: []
        side_effects:
          - "VEHICLE_CLASSIFICATION: transaction returns DISPUTED -> POSTED unchanged"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /toll/disputes/{disputeId}/withdraw"
        actor: AccountHolder
        preconditions: []
        side_effects:
          - "VEHICLE_CLASSIFICATION: transaction returns DISPUTED -> POSTED unchanged"
      - from: FILED
        to: REJECTED
        trigger: "system (during advance_day: filed_day + 30 <= current day with no begin_review)"
        actor: system
        preconditions:
          - "current epoch day >= filed_day + 30"
        side_effects:
          - "VEHICLE_CLASSIFICATION: transaction returns DISPUTED -> POSTED unchanged"

  - entity: SettlementFile
    initial_state: GENERATED
    terminal_states: [RECONCILED]
    transitions:
      - from: GENERATED
        to: TRANSMITTED
        trigger: "POST /toll/settlement-files/{settlementFileId}/transmit"
        actor: SettlementOfficer
        preconditions: []
        side_effects: []
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /toll/settlement-files/{settlementFileId}/acknowledge"
        actor: SettlementOfficer
        preconditions:
          - "Actor's agency == to_agency (receiving side acknowledges)"
        side_effects: []
      - from: TRANSMITTED
        to: DISPUTED_SETTLEMENT
        trigger: "POST /toll/settlement-files/{settlementFileId}/flag_exception"
        actor: SettlementOfficer
        preconditions: []
        side_effects:
          - "exception_count incremented per flag"
      - from: ACKNOWLEDGED
        to: RECONCILED
        trigger: "POST /toll/settlement-files/{settlementFileId}/reconcile"
        actor: SettlementOfficer
        preconditions:
          - "exception_count == 0 (ERR_SETTLEMENT_HAS_EXCEPTIONS)"
        side_effects:
          - "net_amount_cents marked as transferred from from_agency to to_agency"
      - from: DISPUTED_SETTLEMENT
        to: ACKNOWLEDGED
        trigger: "POST /toll/settlement-files/{settlementFileId}/resolve_exceptions"
        actor: SettlementOfficer
        preconditions: []
        side_effects:
          - "exception_count reset to 0"

  - entity: PlateDataAgreement
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock passes effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /toll/plate-data-agreements/{agreementId}/revoke"
        actor: SettlementOfficer
        preconditions: []
        side_effects:
          - "Plate lookups relying on this agreement rejected with ERR_PLATE_LOOKUP_NOT_AVAILABLE"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: replenish-stale-account-version
    parent_entity: Account
    write_endpoint: "POST /toll/accounts/{accountId}/replenishments"
    occ_field: "expected_account_version"
    description: |
      Recording a manual replenishment against an Account whose version has
      advanced since the caller last read it is rejected with 412. This
      captures the case where an automatic replenishment (triggered by a toll
      posting crossing the low-balance threshold) has already landed: the
      caller's balance view is stale and double-replenishing must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: account-adjust-stale-version
    parent_entity: Account
    write_endpoint: "POST /toll/accounts/{accountId}/adjustments"
    occ_field: "expected_account_version"
    description: |
      Posting a manual balance adjustment (goodwill credit or fee correction)
      against an Account whose version has advanced since the caller last read
      it is rejected with 412. Any toll posting, dispute uphold credit, or
      replenishment in between legitimately moved the balance, so the stale
      writer's adjustment basis is no longer valid.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: toll_fare
    trigger: "POST /toll/toll-transactions (trip posting)"
    algorithm: tiered_pricing
    formula: |
      Lookup RateSchedule for (away_agency, plaza_code, billed_vehicle_class)
      whose [effective_from, effective_to) contains trip_timestamp; if none,
      ERR_RATE_NOT_FOUND.
      axle_component  = round_half_up(base_rate_cents * axle_multiplier)
      gross_no_fee    = is_peak ? round_half_up(axle_component * peak_multiplier) : axle_component
      if detection_method == TRANSPONDER:
        plan = account.discount_plan (status ACTIVE, away_agency in applies_to_agency_codes)
        eligible = plan exists AND (plan.min_trips_per_month == 0 OR account.trips_this_month >= plan.min_trips_per_month)
        raw_discount = eligible ? round_half_up(gross_no_fee * plan.discount_pct) : 0
        if plan.daily_discount_cap_cents > 0:
          remaining_cap = max(0, plan.daily_discount_cap_cents - account.discount_used_today_cents)
          discount_amount_cents = min(raw_discount, remaining_cap)
        else:
          discount_amount_cents = raw_discount
        gross_amount_cents = gross_no_fee
      else (IMAGE):
        discount_amount_cents = 0
        gross_amount_cents = gross_no_fee + rate.image_fee_cents
      charged_amount_cents = gross_amount_cents - discount_amount_cents
    input_set: "RateSchedule ACTIVE matching (agency, plaza, class, time window); DiscountPlan ACTIVE on account"
    constants:
      ROUNDING: "round_half_up to whole cents at each multiplication step"
    precision: "integer cents; round_half_up per multiplication, never at the end"
    variants:
      - name: transponder_fare
        when: "detection_method == TRANSPONDER and transponder status == ACTIVE at trip time"
        difference: "Discount applies to the toll portion; no image fee"
      - name: video_fare
        when: "detection_method == IMAGE (tag unread)"
        difference: "No discount ever; image_fee_cents added to gross"

  - name: daily_discount_cap_allocation
    trigger: "Each transponder toll posting under a capped plan"
    algorithm: chronological
    formula: |
      Trips within one UTC day are processed in trip_timestamp order
      (tie-break: created_at ASC). Each trip's discount is
      min(raw_discount, remaining_cap) where remaining_cap decreases as
      discounts are granted. Cap is NOT redistributed: earlier trips keep
      their full discount even if a later trip is voided (voiding does not
      restore discount_used_today_cents).
    input_set: "Account's POSTED transponder transactions on the current UTC day"
    constants:
      TIE_BREAK: "trip_timestamp ASC, then created_at ASC"
    precision: "integer cents"

  - name: settlement_net
    trigger: "POST /toll/settlement-files/generate (ops-run checkpoint per agency pair per day)"
    algorithm: waterfall_allocation
    formula: |
      For ordered pair (from_agency = home/collector, to_agency = away/facility):
      lines = all TollTransaction with status POSTED, settlement_file_id null,
              away_agency_id == to_agency, account.home_agency_id == from_agency,
              ordered by trip_timestamp ASC then created_at ASC
      per_line_fee(line) = round_half_up(line.charged_amount_cents * to_agency.reciprocity_fee_bps / 10000)
      gross_amount_cents = sum(line.charged_amount_cents)
      fee_amount_cents   = sum(per_line_fee(line))     # per-line rounding, NOT aggregate
      net_amount_cents   = gross_amount_cents - fee_amount_cents
      Each swept line: status POSTED -> SETTLED, settlement_file_id set.
    input_set: "POSTED, unsettled transactions for the agency pair"
    constants:
      ROUNDING_ORDER: "fee rounded per line, then summed — explicitly NOT round(sum * bps)"
    precision: "integer cents; per-line round_half_up"
    variants:
      - name: per_line_rounding
        when: "normative — the pinned behavior"
        difference: "fee = sum of per-line round_half_up"
      - name: aggregate_rounding
        when: "rejected alternative — produces different totals"
        difference: "fee = round_half_up(gross * bps / 10000); diverges by 1+ cents on many multi-line files"

  - name: replenishment_decision
    trigger: "After any Account.balance_cents debit (toll posting or image bill resolve)"
    algorithm: threshold
    formula: |
      if account.status == ACTIVE and balance_cents < low_balance_threshold_cents:
        attempt automatic replenishment of replenishment_amount_cents
        on success: balance_cents += replenishment_amount_cents; replenishment_fail_count = 0
        on payment failure: replenishment_fail_count += 1
        if replenishment_fail_count reaches 3: account -> SUSPENDED (REPLENISHMENT_FAILED)
      Boundary: balance == threshold exactly does NOT trigger (strictly below).
    input_set: "The account whose balance just changed"
    constants:
      MAX_REPLENISHMENT_FAILURES: 3
      BOUNDARY: "balance < threshold triggers; balance == threshold does not"
    precision: "integer cents"

  - name: violation_admin_fee_schedule
    trigger: "POST /toll/violations/{id}/issue_notice"
    algorithm: threshold
    formula: |
      notice 1: fee = 500;  requires notice_count == 0
      notice 2: fee = 2500; requires current_day >= current_notice_day + 30
      notice 3: fee = 5000; requires current_day >= current_notice_day + 30
      admin_fees_cents accumulates; total_outstanding_cents = toll_amount_cents + admin_fees_cents - payments
      Fees are computed from the prior notice_count BEFORE incrementing —
      no circular reference between the fee and the total it feeds.
    input_set: "The violation"
    constants:
      NOTICE_1_FEE_CENTS: 500
      NOTICE_2_FEE_CENTS: 2500
      NOTICE_3_FEE_CENTS: 5000
      NOTICE_INTERVAL_DAYS: 30
      ESCALATION_DAYS_FROM_FIRST: 60
      REG_HOLD_THRESHOLD_CENTS: 10000
    precision: "integer cents"

  - name: misread_plate_rebill_credit
    trigger: "MISREAD_PLATE or RENTAL_VEHICLE dispute upheld on a BILLED ImageBill"
    algorithm: aggregation
    formula: |
      Pinned variant — net_credit:
        credit original account exactly billed_amount_cents once
        (single compensating entry; the original debit is not separately reversed)
      Rejected variant — void_and_rebill:
        reverse the original debit AND issue a separate credit memo;
        identical net balance but two ledger entries, two version bumps,
        and different audit trail. NOT used.
      New ImageBill for corrected plate starts at PENDING_LOOKUP with its own
      toll transaction priced at the video rate for the corrected plate's
      account (or unregistered -> violation path).
    input_set: "The upheld dispute's ImageBill and its TollTransaction"
    precision: "integer cents"

  - name: reg_hold_eligibility
    trigger: "Violation escalation (advance_day sweep)"
    algorithm: threshold
    formula: |
      registration hold referral requires total_outstanding_cents >= 10000
      (boundary: exactly 10000 IS referred; 9999 is not).
      Evaluated on the ESCALATED transition and re-evaluated each advance_day
      for ESCALATED violations.
    input_set: "Violations in ESCALATED or entering escalation"
    constants:
      REG_HOLD_THRESHOLD_CENTS: 10000
      BOUNDARY: ">= inclusive"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource in a state permitting the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Account not SUSPENDED/CLOSED and transponder ACTIVE before a toll debit; agency not SUSPENDED before posting at its plazas"
    error_id: "ERR_ACCOUNT_SUSPENDED | ERR_ACCOUNT_CLOSED | ERR_TRANSPONDER_NOT_ACTIVE | ERR_AGENCY_SUSPENDED"
    http_status: 409
    applies_to: "POST /toll/toll-transactions"

  - priority: 6
    category: business_referential
    check: "Rate schedule exists for (away agency, plaza, class, trip time); discount plan belongs to account's home agency"
    error_id: "ERR_RATE_NOT_FOUND | ERR_PLAN_NOT_APPLICABLE"
    http_status: 422
    applies_to: "POST /toll/toll-transactions"

  - priority: 7
    category: business_temporal
    check: "Plate lookup only when an ACTIVE PlateDataAgreement covers the plate state at the current logical time"
    error_id: ERR_PLATE_LOOKUP_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /toll/image-bills/{id}/resolve"

  - priority: 8
    category: business_temporal
    check: "Notice spacing: notices 2/3 require >= 30 days since the previous notice; dispute auto-reject at 30 days unreviewed"
    error_id: ERR_NOTICE_TOO_SOON
    http_status: 409
    applies_to: "POST /toll/violations/{id}/issue_notice"

  - priority: 9
    category: business_constraint
    check: "Idempotency and uniqueness: duplicate (away_agency, plaza, trip_timestamp, idempotency_key) rejected; tag_number globally unique; plan_code unique per agency"
    error_id: "ERR_DUPLICATE_TRANSACTION | ERR_DUPLICATE_TAG | ERR_DUPLICATE_PLAN_CODE"
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 10
    category: business_constraint
    check: "Settlement file reconcile requires exception_count == 0; agency suspend requires no pending settlement files"
    error_id: "ERR_SETTLEMENT_HAS_EXCEPTIONS | ERR_AGENCY_HAS_PENDING_SETTLEMENT"
    http_status: 409
    applies_to: "settlement endpoints, agency suspend"

  - priority: 11
    category: business_fiscal
    check: "Reinstate requires balance >= low_balance_threshold_cents; pay/adjustment amounts positive; dispute amount targets exist"
    error_id: "ERR_BALANCE_BELOW_THRESHOLD | ERR_INVALID_AMOUNT"
    http_status: 409
    applies_to: "reinstate, pay, adjustments"

  - priority: 12
    category: business_constraint
    check: "Request body well-formed: required fields present, enums within declared sets, numeric fields non-negative where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all creation and action endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/toll/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-09-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [SettlementOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "string" }
    side_effects: ["PlateDataAgreement expiry re-evaluated"]

  - method: POST
    path: "/toll/_clock/advance_day"
    description: "Advance the logical epoch day counter by N days (ops-run checkpoint): runs violation escalation sweep, dispute auto-reject, discount_used_today_cents reset, trips_this_month reset on month rollover"
    roles: [SettlementOfficer]
    code: 200
    input: [days]
    output: { epoch_day: "integer" }
    side_effects:
      - "Violation NOTICED->ESCALATED / ESCALATED->HOLD_REFERRED sweep"
      - "Dispute FILED auto-reject at 30 days"
      - "discount_used_today_cents reset per account per day rollover"
      - "trips_this_month reset on UTC month rollover"

  # --- Agency ---
  - method: POST
    path: "/toll/agencies"
    description: "Register a member agency"
    roles: [SettlementOfficer]
    code: 201
    input: [agency_code, name, home_state, reciprocity_fee_bps, "settlement_currency?"]
    output: Agency
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/toll/agencies/{agencyId}"
    description: "Get an agency"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: GET
    path: "/toll/agencies"
    description: "List agencies"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Agency[]"
    side_effects: []

  - method: POST
    path: "/toll/agencies/{agencyId}/suspend"
    description: "Suspend an agency (no pending settlement files)"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Agency
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/toll/agencies/{agencyId}/reactivate"
    description: "Reactivate a suspended agency"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Agency
    side_effects: ["status -> ACTIVE"]

  # --- RateSchedule ---
  - method: POST
    path: "/toll/agencies/{agencyId}/rate-schedules"
    description: "Create a rate schedule for a plaza+class window"
    roles: [AgencyOperations]
    code: 201
    input: [plaza_code, vehicle_class, base_rate_cents, axle_multiplier, "peak_multiplier?", "image_fee_cents?", effective_from, effective_to]
    output: RateSchedule
    side_effects: ["status=ACTIVE; ERR_SCHEDULE_OVERLAP if [effective_from, effective_to) overlaps an existing ACTIVE schedule for same agency+plaza+class"]

  - method: GET
    path: "/toll/rate-schedules/{scheduleId}"
    description: "Get a rate schedule"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []

  - method: GET
    path: "/toll/agencies/{agencyId}/rate-schedules"
    description: "List rate schedules for an agency"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: ["plaza_code?", "vehicle_class?", "status?", "limit?", "offset?", "agency_id?"]
    output: "RateSchedule[]"
    side_effects: []

  - method: GET
    path: "/toll/rate-schedules"
    description: "List rate schedules across agencies (filtered-list FK reachability for RateSchedule.agency_id)"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: ["agency_id?", "plaza_code?", "vehicle_class?", "status?", "limit?", "offset?"]
    output: "RateSchedule[]"
    side_effects: []

  # --- DiscountPlan ---
  - method: POST
    path: "/toll/agencies/{agencyId}/discount-plans"
    description: "Create a discount plan issued by the agency"
    roles: [AgencyOperations]
    code: 201
    input: [plan_code, discount_pct, daily_discount_cap_cents, applies_to_agency_codes, "min_trips_per_month?"]
    output: DiscountPlan
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_PLAN_CODE if plan_code reused within agency"]

  - method: GET
    path: "/toll/discount-plans/{planId}"
    description: "Get a discount plan"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: []
    output: DiscountPlan
    side_effects: []

  - method: GET
    path: "/toll/agencies/{agencyId}/discount-plans"
    description: "List an agency's discount plans"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: ["status?", "limit?", "offset?", "agency_id?"]
    output: "DiscountPlan[]"
    side_effects: []

  - method: GET
    path: "/toll/discount-plans"
    description: "List discount plans across agencies (filtered-list FK reachability for DiscountPlan.agency_id)"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "DiscountPlan[]"
    side_effects: []

  # --- Account ---
  - method: POST
    path: "/toll/accounts"
    description: "Open a transponder account at a home agency"
    roles: [AgencyOperations]
    code: 201
    input: [home_agency_id, holder_name, holder_email, discount_plan_id, "low_balance_threshold_cents?", "replenishment_amount_cents?", "opening_balance_cents?"]
    output: Account
    side_effects: ["status=ACTIVE; balance_cents = opening_balance_cents (default 0)"]

  - method: GET
    path: "/toll/accounts/{accountId}"
    description: "Get an account"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/toll/accounts"
    description: "List accounts"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer]
    code: 200
    input: ["home_agency_id?", "status?", "limit?", "offset?", "discount_plan_id?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/toll/accounts/{accountId}/replenishments"
    description: "Record a replenishment (manual or simulated auto) with OCC on account version"
    roles: [AgencyOperations, AccountHolder]
    code: 201
    input: [amount_cents, outcome, expected_account_version]
    output: { balance_cents: "integer", replenishment_fail_count: "integer", status: "string" }
    side_effects:
      - "outcome=SUCCEEDED: balance_cents += amount_cents; replenishment_fail_count=0"
      - "outcome=FAILED: replenishment_fail_count += 1; at 3 -> account SUSPENDED (REPLENISHMENT_FAILED)"
      - "increments Account.version by 1"

  - method: POST
    path: "/toll/accounts/{accountId}/adjustments"
    description: "Manual balance adjustment (goodwill/fee correction) with OCC on account version"
    roles: [AgencyOperations]
    code: 201
    input: [delta_cents, reason, expected_account_version]
    output: { balance_cents: "integer" }
    side_effects:
      - "balance_cents += delta_cents (may be negative; ERR_INVALID_AMOUNT if result < 0)"
      - "increments Account.version by 1"

  - method: POST
    path: "/toll/accounts/{accountId}/reinstate"
    description: "Reinstate a suspended account"
    roles: [AgencyOperations]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> ACTIVE when preconditions met"]

  - method: POST
    path: "/toll/accounts/{accountId}/close"
    description: "Close an account (holder-initiated)"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> CLOSED; transponders retired; balance paid out to 0"]

  # --- Transponder ---
  - method: POST
    path: "/toll/accounts/{accountId}/transponders"
    description: "Issue a transponder on an account"
    roles: [AgencyOperations]
    code: 201
    input: [tag_number, vehicle_class, plate_number, plate_state]
    output: Transponder
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_TAG if tag_number already issued"]

  - method: GET
    path: "/toll/transponders/{transponderId}"
    description: "Get a transponder"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: []
    output: Transponder
    side_effects: []

  - method: GET
    path: "/toll/accounts/{accountId}/transponders"
    description: "List transponders on an account"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: ["status?", "limit?", "offset?", "account_id?"]
    output: "Transponder[]"
    side_effects: []

  - method: POST
    path: "/toll/transponders/{transponderId}/report_lost"
    description: "Report a transponder lost"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Transponder
    side_effects: ["status -> REPORTED_LOST"]

  - method: POST
    path: "/toll/transponders/{transponderId}/report_found"
    description: "Report a transponder found"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Transponder
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/toll/transponders/{transponderId}/retire"
    description: "Retire a transponder"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Transponder
    side_effects: ["status -> RETIRED"]

  - method: GET
    path: "/toll/transponders"
    description: "List transponders across accounts (filtered-list FK reachability for Transponder.account_id)"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "Transponder[]"
    side_effects: []

  # --- TollTransaction ---
  - method: POST
    path: "/toll/toll-transactions"
    description: "Post a toll trip (transponder read or image fallback). Computes fare, debits account, may trigger replenishment check."
    roles: [AgencyOperations]
    code: 201
    input: ["tag_number?", "plate_number?", "plate_state?", away_agency_id, plaza_code, trip_timestamp, is_peak, idempotency_key]
    output: TollTransaction
    side_effects:
      - "If tag_number resolves to ACTIVE transponder: TRANSPONDER fare; else IMAGE fare and an ImageBill is created in PENDING_LOOKUP"
      - "Account.balance_cents debited charged_amount_cents (transponder path)"
      - "discount_used_today_cents += discount granted; trips_this_month += 1"
      - "replenishment_decision evaluated after debit"
      - "increments Account.version by 1 on debit"

  - method: GET
    path: "/toll/toll-transactions/{transactionId}"
    description: "Get a toll transaction"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: []
    output: TollTransaction
    side_effects: []

  - method: GET
    path: "/toll/toll-transactions"
    description: "List toll transactions"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "away_agency_id?", "settlement_file_id?", "status?", "limit?", "offset?", "transponder_id?", "rate_schedule_id?"]
    output: "TollTransaction[]"
    side_effects: []

  - method: POST
    path: "/toll/toll-transactions/{transactionId}/void"
    description: "Void a POSTED transaction (credits account back)"
    roles: [AgencyOperations]
    code: 200
    input: []
    output: TollTransaction
    side_effects: ["status -> VOIDED; Account credited charged_amount_cents"]

  # --- ImageBill ---
  - method: GET
    path: "/toll/image-bills/{imageBillId}"
    description: "Get an image bill"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: []
    output: ImageBill
    side_effects: []

  - method: GET
    path: "/toll/image-bills"
    description: "List image bills"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, PlateLookupAgent, AccountHolder]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?", "toll_transaction_id?", "lookup_agency_id?"]
    output: "ImageBill[]"
    side_effects: []

  - method: POST
    path: "/toll/image-bills/{imageBillId}/resolve"
    description: "Resolve a PENDING_LOOKUP image bill to an account (plate lookup result) and bill it"
    roles: [PlateLookupAgent]
    code: 200
    input: ["resolved_account_id?"]
    output: ImageBill
    side_effects:
      - "With resolved_account_id: status -> BILLED; account debited billed_amount_cents"
      - "Without resolved_account_id (lookup found nothing): status -> ESCALATED and Violation created"
      - "ERR_PLATE_LOOKUP_NOT_AVAILABLE if no ACTIVE covering PlateDataAgreement"

  - method: POST
    path: "/toll/image-bills/{imageBillId}/void"
    description: "Void an image bill (credits account if billed)"
    roles: [AgencyOperations]
    code: 200
    input: []
    output: ImageBill
    side_effects: ["status -> VOIDED; credit if previously BILLED"]

  # --- Violation ---
  - method: GET
    path: "/toll/violations/{violationId}"
    description: "Get a violation"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: GET
    path: "/toll/violations"
    description: "List violations"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?", "toll_transaction_id?", "image_bill_id?"]
    output: "Violation[]"
    side_effects: []

  - method: POST
    path: "/toll/violations/{violationId}/issue_notice"
    description: "Issue the next violation notice (1, 2, or 3) with its admin fee"
    roles: [ViolationsOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["notice_count += 1; admin fee per violation_admin_fee_schedule"]

  - method: POST
    path: "/toll/violations/{violationId}/pay"
    description: "Pay a violation in full"
    roles: [AccountHolder, ViolationsOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["status -> PAID; total_outstanding_cents = 0"]

  - method: POST
    path: "/toll/violations/{violationId}/dismiss"
    description: "Dismiss a violation"
    roles: [ViolationsOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["status -> DISMISSED"]

  # --- Dispute ---
  - method: POST
    path: "/toll/disputes"
    description: "File a dispute (classification, misread plate, or rental vehicle)"
    roles: [AccountHolder]
    code: 201
    input: [account_id, dispute_type, "toll_transaction_id?", "image_bill_id?", "violation_id?", "claimed_vehicle_class?", "claimed_plate_number?", "rental_agreement_ref?"]
    output: Dispute
    side_effects:
      - "status=FILED"
      - "VEHICLE_CLASSIFICATION: transaction POSTED -> DISPUTED"
      - "ERR_DISPUTE_WINDOW_CLOSED if filed > 90 days after trip (epoch days)"

  - method: GET
    path: "/toll/disputes/{disputeId}"
    description: "Get a dispute"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/toll/disputes"
    description: "List disputes"
    roles: [SettlementOfficer, AgencyOperations, ViolationsOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "status?", "dispute_type?", "limit?", "offset?", "toll_transaction_id?", "image_bill_id?", "violation_id?"]
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/toll/disputes/{disputeId}/begin_review"
    description: "Move dispute to UNDER_REVIEW"
    roles: [ViolationsOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/toll/disputes/{disputeId}/uphold"
    description: "Uphold a dispute (applies correction)"
    roles: [ViolationsOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UPHOLD; type-specific corrections per state machine"]

  - method: POST
    path: "/toll/disputes/{disputeId}/reject"
    description: "Reject a dispute"
    roles: [ViolationsOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> REJECTED; transaction returns to POSTED"]

  - method: POST
    path: "/toll/disputes/{disputeId}/withdraw"
    description: "Withdraw a dispute"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> WITHDRAWN; transaction returns to POSTED"]

  # --- SettlementFile ---
  - method: POST
    path: "/toll/settlement-files/generate"
    description: "Generate the settlement file for an agency pair for the current epoch day (sweeps POSTED transactions)"
    roles: [SettlementOfficer]
    code: 201
    input: [from_agency_id, to_agency_id]
    output: SettlementFile
    side_effects: ["settlement_net calculation; swept transactions POSTED -> SETTLED"]

  - method: GET
    path: "/toll/settlement-files/{settlementFileId}"
    description: "Get a settlement file"
    roles: [SettlementOfficer, AgencyOperations]
    code: 200
    input: []
    output: SettlementFile
    side_effects: []

  - method: GET
    path: "/toll/settlement-files"
    description: "List settlement files"
    roles: [SettlementOfficer, AgencyOperations]
    code: 200
    input: ["from_agency_id?", "to_agency_id?", "status?", "limit?", "offset?"]
    output: "SettlementFile[]"
    side_effects: []

  - method: POST
    path: "/toll/settlement-files/{settlementFileId}/transmit"
    description: "Transmit a generated file to the counterparty agency"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementFile
    side_effects: ["status -> TRANSMITTED"]

  - method: POST
    path: "/toll/settlement-files/{settlementFileId}/acknowledge"
    description: "Counterparty acknowledges receipt"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementFile
    side_effects: ["status -> ACKNOWLEDGED"]

  - method: POST
    path: "/toll/settlement-files/{settlementFileId}/flag_exception"
    description: "Flag a reconciliation exception on a transmitted file"
    roles: [SettlementOfficer]
    code: 200
    input: [reason]
    output: SettlementFile
    side_effects: ["status -> DISPUTED_SETTLEMENT; exception_count += 1"]

  - method: POST
    path: "/toll/settlement-files/{settlementFileId}/resolve_exceptions"
    description: "Resolve all exceptions"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementFile
    side_effects: ["status -> ACKNOWLEDGED; exception_count = 0"]

  - method: POST
    path: "/toll/settlement-files/{settlementFileId}/reconcile"
    description: "Reconcile an acknowledged file (exception-free)"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementFile
    side_effects: ["status -> RECONCILED"]

  # --- PlateDataAgreement ---
  - method: POST
    path: "/toll/plate-data-agreements"
    description: "Create an out-of-state plate data agreement between two agencies"
    roles: [SettlementOfficer]
    code: 201
    input: [requesting_agency_id, providing_agency_id, effective_from, effective_to, covers_states, "per_lookup_fee_cents?"]
    output: PlateDataAgreement
    side_effects: ["status=ACTIVE; ERR_AGREEMENT_OVERLAP if an ACTIVE agreement already covers (requesting, providing, any shared state) with overlapping [effective_from, effective_to)"]

  - method: GET
    path: "/toll/plate-data-agreements/{agreementId}"
    description: "Get a plate data agreement"
    roles: [SettlementOfficer, AgencyOperations, PlateLookupAgent]
    code: 200
    input: []
    output: PlateDataAgreement
    side_effects: []

  - method: GET
    path: "/toll/plate-data-agreements"
    description: "List plate data agreements"
    roles: [SettlementOfficer, AgencyOperations, PlateLookupAgent]
    code: 200
    input: ["requesting_agency_id?", "providing_agency_id?", "status?", "limit?", "offset?"]
    output: "PlateDataAgreement[]"
    side_effects: []

  - method: POST
    path: "/toll/plate-data-agreements/{agreementId}/revoke"
    description: "Revoke an agreement"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: PlateDataAgreement
    side_effects: ["status -> REVOKED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not allowed for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version (OCC)" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Toll posting or billing attempted against a SUSPENDED account" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "Operation attempted against a CLOSED account" }
  - { id: ERR_TRANSPONDER_NOT_ACTIVE, http: 409, condition: "Tag resolves to a transponder in REPORTED_LOST or RETIRED" }
  - { id: ERR_AGENCY_SUSPENDED, http: 409, condition: "Toll posting attempted at a plaza of a SUSPENDED agency" }
  - { id: ERR_RATE_NOT_FOUND, http: 422, condition: "No ACTIVE RateSchedule covers (away agency, plaza, class, trip timestamp)" }
  - { id: ERR_PLAN_NOT_APPLICABLE, http: 422, condition: "Discount plan does not belong to the account's home agency or is RETIRED" }
  - { id: ERR_PLATE_LOOKUP_NOT_AVAILABLE, http: 409, condition: "No ACTIVE PlateDataAgreement covers the plate state at the current logical time, or agreement revoked/expired" }
  - { id: ERR_NOTICE_TOO_SOON, http: 409, condition: "Next notice issued before the 30-day spacing elapsed" }
  - { id: ERR_NOTICE_LIMIT_REACHED, http: 409, condition: "Fourth notice attempted (notice_count already 3)" }
  - { id: ERR_DUPLICATE_TRANSACTION, http: 409, condition: "Idempotency key reuse for the same away agency + plaza + trip timestamp" }
  - { id: ERR_DUPLICATE_TAG, http: 409, condition: "tag_number already issued on any account" }
  - { id: ERR_DUPLICATE_PLAN_CODE, http: 409, condition: "plan_code already exists within the issuing agency" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "Rate schedule window overlaps an existing ACTIVE schedule for the same agency+plaza+class" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Plate data agreement window overlaps an existing ACTIVE agreement for the same pair and shared state" }
  - { id: ERR_TRANSACTION_ALREADY_SETTLED, http: 409, condition: "Void attempted on a transaction already swept into a settlement file" }
  - { id: ERR_IMAGE_BILL_HAS_ACTIVE_DISPUTE, http: 409, condition: "Void attempted on an image bill with a FILED or UNDER_REVIEW dispute" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute filed more than 90 epoch days after the trip" }
  - { id: ERR_BALANCE_BELOW_THRESHOLD, http: 409, condition: "Reinstate attempted with balance strictly below low_balance_threshold_cents" }
  - { id: ERR_ACCOUNT_HAS_UNRESOLVED_VIOLATIONS, http: 409, condition: "Close/reinstate blocked by violations in OPEN/NOTICED/ESCALATED/HOLD_REFERRED with outstanding balance" }
  - { id: ERR_ACCOUNT_HAS_UNSETTLED_TRANSACTIONS, http: 409, condition: "Close blocked by POSTED (unsettled) transactions" }
  - { id: ERR_INVALID_AMOUNT, http: 409, condition: "Amount non-positive, or adjustment would drive balance negative" }
  - { id: ERR_SETTLEMENT_HAS_EXCEPTIONS, http: 409, condition: "Reconcile attempted while exception_count > 0" }
  - { id: ERR_AGENCY_HAS_PENDING_SETTLEMENT, http: 409, condition: "Agency suspend attempted with GENERATED/TRANSMITTED settlement files outstanding" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SettlementOfficer
    description: "Interagency settlement operator: manages agencies, settlement files, plate data agreements, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /toll/agencies — register agency"
      - "POST /toll/agencies/{id}/suspend|reactivate"
      - "POST /toll/settlement-files/generate|transmit|acknowledge|flag_exception|resolve_exceptions|reconcile"
      - "POST /toll/plate-data-agreements — create"
      - "POST /toll/plate-data-agreements/{id}/revoke"
      - "POST /toll/_clock/set_current_utc"
      - "POST /toll/_clock/advance_day"
    shared_operations:
      - "GET endpoints shared with other roles"

  - name: AgencyOperations
    description: "Single-agency back office: rate schedules, discount plans, account issuance, toll posting, voids, adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /toll/agencies/{id}/rate-schedules"
      - "POST /toll/agencies/{id}/discount-plans"
      - "POST /toll/accounts — open account"
      - "POST /toll/accounts/{id}/transponders — issue transponder"
      - "POST /toll/toll-transactions — post trip"
      - "POST /toll/toll-transactions/{id}/void"
      - "POST /toll/accounts/{id}/adjustments"
      - "POST /toll/accounts/{id}/reinstate"
      - "POST /toll/image-bills/{id}/void"
    shared_operations:
      - "POST /toll/accounts/{id}/replenishments (shared with AccountHolder)"
      - "GET endpoints"

  - name: AccountHolder
    description: "The account owner; X-User-ID equals the Account.id the holder acts on"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /toll/accounts/{id}/close (own account only)"
      - "POST /toll/transponders/{id}/report_lost|report_found|retire (own account's transponders)"
      - "POST /toll/disputes — file (own account)"
      - "POST /toll/disputes/{id}/withdraw (own disputes)"
    shared_operations:
      - "POST /toll/violations/{id}/pay (shared with ViolationsOfficer)"
      - "POST /toll/accounts/{id}/replenishments (own account)"
      - "GET endpoints scoped to own resources"

  - name: ViolationsOfficer
    description: "Violation and dispute processing: notices, dismissals, dispute review and adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /toll/violations/{id}/issue_notice"
      - "POST /toll/violations/{id}/dismiss"
      - "POST /toll/disputes/{id}/begin_review|uphold|reject"
    shared_operations:
      - "POST /toll/violations/{id}/pay (shared with AccountHolder)"
      - "GET endpoints"

  - name: PlateLookupAgent
    description: "Runs license plate lookups against partner agencies and resolves image bills"
    identity: opaque
    exclusive_operations:
      - "POST /toll/image-bills/{id}/resolve"
    shared_operations:
      - "GET /toll/image-bills, /toll/plate-data-agreements, /toll/agencies"
