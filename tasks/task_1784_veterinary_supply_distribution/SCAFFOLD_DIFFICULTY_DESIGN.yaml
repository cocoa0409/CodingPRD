scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: rebate_provisional_vs_final_quarter_close
    grounds:
    - calculations.rebate_accrual
    - state_machines.RebateAccrual.PROVISIONAL_to_FINALIZED
    - state_machines.BundleProgram.ACTIVE_to_CLOSED
    distinguishing_aspect: "Rebate economics on the Order/RebateAccrual domain: identical order\ndata produces provisional amounts locked at approval-time base rate\n(200bp, QTD-before tier) but final amounts\
      \ recomputed retroactively\nat the quarter-final bonus rate (500bp) once delivered QTD crosses\nthe 1000000-cent threshold \u2014 the two variants MUST differ.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C (credit_limit 5000000, minimum 50000, frequency 5, free_freight_threshold 100000)
      - CONSUMABLE product P (manufacturer ACME-VET, unit 10000c) with one lot of 200 units expiring 2027-06-30
      - ACTIVE BundleProgram (ACME-VET, types [CONSUMABLE], min_distinct_categories 1, discount 0%, base 200bp, bonus 500bp, threshold 1000000c)
      - ACTIVE BundleEnrollment for (C, 2026-Q3)
      - Order O1 qty 50 DELIVERED; Order O2 qty 60 DELIVERED (windows on different days)
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic R
          license_number: LIC-R1
          ship_to_address: 1 Clinic Way
          credit_limit_cents: 5000000
          minimum_order_value_cents: 50000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
          c_v: $.data.version
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
        captures:
          c_v: $.data.version
      - call: POST /vet/products
        payload:
          sku: CONS-R1
          product_name: Bandage Case
          manufacturer_code: ACME-VET
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-R1
          expiry_date: '2027-06-30'
          qty_on_hand: 200
        as: SupplyChainPlanner
      - call: POST /vet/bundle-programs
        payload:
          program_name: ACME Q3
          manufacturer_code: ACME-VET
          qualifying_product_types:
          - CONSUMABLE
          min_distinct_categories: 1
          bundle_discount_pct: 0
          rebate_base_rate_bp: 200
          rebate_bonus_rate_bp: 500
          bonus_threshold_cents: 1000000
        as: AccountManager
        captures:
          prog_id: $.data.id
      - call: POST /vet/bundle-programs/${prog_id}/activate
        as: AccountManager
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${prog_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v}
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          enr_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 1 Clinic Way
          delivery_window_start: '2026-08-05T13:00:00Z'
          delivery_window_end: '2026-08-05T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 50
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o1_id: $.data.id
      - call: POST /vet/orders/${o1_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o1_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o1_id}
          carrier_name: VETEXPRESS
        as: SupplyChainPlanner
        captures:
          s1_id: $.data.id
      - call: POST /vet/shipments/${s1_id}/dispatch
        as: SupplyChainPlanner
      - call: POST /vet/shipments/${s1_id}/deliver
        as: SupplyChainPlanner
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 1 Clinic Way
          delivery_window_start: '2026-08-06T13:00:00Z'
          delivery_window_end: '2026-08-06T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 60
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o2_id: $.data.id
      - call: POST /vet/orders/${o2_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o2_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o2_id}
          carrier_name: VETEXPRESS
        as: SupplyChainPlanner
        captures:
          s2_id: $.data.id
      - call: POST /vet/shipments/${s2_id}/dispatch
        as: SupplyChainPlanner
      - call: POST /vet/shipments/${s2_id}/deliver
        as: SupplyChainPlanner
      trigger:
      - call: POST /vet/bundle-programs/${prog_id}/close
        as: AccountManager
      - call: GET /vet/rebate-accruals?order_id=${o1_id}
        as: AccountManager
        captures:
          acc1_prov: $.data[0].provisional_amount_cents
          acc1_final: $.data[0].final_amount_cents
          acc1_status: $.data[0].status
      - call: GET /vet/rebate-accruals?order_id=${o2_id}
        as: AccountManager
        captures:
          acc2_prov: $.data[0].provisional_amount_cents
          acc2_final: $.data[0].final_amount_cents
          acc2_status: $.data[0].status
      assert:
      - accrual(O1).provisional_amount_cents == 10000  (500000 * 200/10000, base rate, QTD-before 0)
      - accrual(O2).provisional_amount_cents == 12000  (600000 * 200/10000, base rate, QTD-before 500000 < 1000000)
      - accrual(O1).final_amount_cents == 25000 and status == FINALIZED  (final QTD 1100000 >= 1000000 -> retroactive 500bp)
      - accrual(O2).final_amount_cents == 30000 and status == FINALIZED
      - final != provisional for both accruals on identical order data
  - name: short_date_credit_claimed_vs_final
    grounds:
    - calculations.short_date_credit_value
    - state_machines.ShortDateCredit.APPROVED_to_CREDITED
    - entities.ShortDateCredit.fields.claimed_credit_cents
    - entities.ShortDateCredit.fields.final_credit_cents
    distinguishing_aspect: 'Credit valuation on the ShortDateCredit domain (distinct from the

      Order/RebateAccrual domain): the claimed variant tiers by

      days_to_expiry at REQUEST (35 days -> 50%) while the final variant

      re-tiers at the RECEIPT clock date (15 days -> 100%), so the same

      credit settles at a different amount (1500 vs 2997 cents).

      '
    test_recipe:
      setup:
      - ACTIVE clinic C (minimum 5000, credit 5000000, frequency 5, free_freight_threshold 100000)
      - 'CONSUMABLE product P (manufacturer GEN, unit 999c), lot L: 10 units, expiry 2026-10-25'
      - Order O (1 line qty 3, window 2026-08-03T13:00-15:00Z) APPROVED from lot L, shipped and DELIVERED
      - Clock at 2026-09-20 (days_to_expiry 35); credit requested qty 3 and APPROVED
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic S
          license_number: LIC-S1
          ship_to_address: 2 Vet Lane
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-S1
          product_name: Syringe Box
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 999
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-S1
          expiry_date: '2026-10-25'
          qty_on_hand: 10
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 2 Vet Lane
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 3
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o_id}
          carrier_name: VETEXPRESS
        as: SupplyChainPlanner
        captures:
          s_id: $.data.id
      - call: POST /vet/shipments/${s_id}/dispatch
        as: SupplyChainPlanner
      - call: POST /vet/shipments/${s_id}/deliver
        as: SupplyChainPlanner
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          line_id: $.data[0].id
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-20T00:00:00Z'
        as: SystemAdmin
      - call: POST /vet/short-date-credits
        payload:
          order_line_id: ${line_id}
          lot_id: ${lot_id}
          qty: 3
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          sdc_id: $.data.id
          sdc_claimed: $.data.claimed_credit_cents
      - call: POST /vet/short-date-credits/${sdc_id}/approve
        as: ComplianceOfficer
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-10T00:00:00Z'
        as: SystemAdmin
      trigger:
      - call: POST /vet/short-date-credits/${sdc_id}/finalize
        payload:
          received_qty: 3
        as: ComplianceOfficer
        captures:
          sdc_final: $.data.final_credit_cents
          sdc_status: $.data.status
      assert:
      - ShortDateCredit.days_to_expiry_at_request == 35 (2026-10-25 minus 2026-09-20)
      - 'claimed_credit_cents == 1500 (50% tier: round_half_up(999*0.5)=500 per unit, * 3)'
      - 'final_credit_cents == 2997 (100% tier at receipt 2026-10-10: round_half_up(999*1.0)=999 per unit, * 3)'
      - status == CREDITED and final_credit_cents != claimed_credit_cents
- rule_id: combinatorial_formula
  instances:
  - name: rebate_tier_locked_by_qtd_before
    grounds:
    - calculations.rebate_accrual
    - entities.BundleEnrollment.fields.qtd_qualifying_cents
    distinguishing_aspect: "Mode (a) \u2014 tiered-rate selection with >= 3 inputs (qtd_qualifying_cents,\nbonus_threshold_cents, base/bonus rate pair) and a conditional branch:\norder O2 CROSSES the 1000000c\
      \ bonus threshold yet still accrues at the\n200bp base rate because the tier is locked to QTD-BEFORE-the-order;\na cumulative/instantaneous misreading would yield 30000c instead of 12000c.\n"
    test_recipe:
      setup:
      - 'Same fixture family as rebate_provisional_vs_final_quarter_close but nothing is shipped: O1 qty 50 APPROVED (QTD 500000), O2 qty 60 APPROVED (crosses QTD to 1100000)'
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic T
          license_number: LIC-T1
          ship_to_address: 3 Barn Rd
          credit_limit_cents: 5000000
          minimum_order_value_cents: 50000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
          c_v: $.data.version
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
        captures:
          c_v: $.data.version
      - call: POST /vet/products
        payload:
          sku: CONS-T1
          product_name: Gauze Case
          manufacturer_code: ACME-VET
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-T1
          expiry_date: '2027-06-30'
          qty_on_hand: 200
        as: SupplyChainPlanner
      - call: POST /vet/bundle-programs
        payload:
          program_name: ACME Q3 tier
          manufacturer_code: ACME-VET
          qualifying_product_types:
          - CONSUMABLE
          min_distinct_categories: 1
          bundle_discount_pct: 0
          rebate_base_rate_bp: 200
          rebate_bonus_rate_bp: 500
          bonus_threshold_cents: 1000000
        as: AccountManager
        captures:
          prog_id: $.data.id
      - call: POST /vet/bundle-programs/${prog_id}/activate
        as: AccountManager
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${prog_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v}
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          enr_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 3 Barn Rd
          delivery_window_start: '2026-08-05T13:00:00Z'
          delivery_window_end: '2026-08-05T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 50
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o1_id: $.data.id
      - call: POST /vet/orders/${o1_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o1_id}/approve
        as: AccountManager
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 3 Barn Rd
          delivery_window_start: '2026-08-06T13:00:00Z'
          delivery_window_end: '2026-08-06T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 60
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o2_id: $.data.id
      - call: POST /vet/orders/${o2_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o2_id}/approve
        as: AccountManager
      trigger:
      - call: GET /vet/rebate-accruals?order_id=${o2_id}
        as: AccountManager
        captures:
          acc2_prov: $.data[0].provisional_amount_cents
      - call: GET /vet/bundle-enrollments/${enr_id}
        as: AccountManager
        captures:
          enr_qtd: $.data.qtd_qualifying_cents
      assert:
      - "accrual(O2).provisional_amount_cents == 12000 (600000 * 200/10000 \u2014 base rate locked by QTD-before 500000, NOT 500bp)"
      - accrual(O1).provisional_amount_cents == 10000
      - BundleEnrollment.qtd_qualifying_cents == 1100000 after both approvals (threshold crossed only AFTER O2's rate locked)
  - name: order_totals_net_freight_evaluation_order
    grounds:
    - calculations.order_totals
    - entities.Order.fields.freight_fee_cents
    - entities.Order.fields.bundle_discount_cents
    distinguishing_aspect: "Mode (c) \u2014 circular-looking evaluation order: freight depends on\nmerchandise NET (105000 gross - 105000*10% line discounts = 94500),\nwhich is below the 100000c free-freight\
      \ threshold, so freight 2500c\napplies; an implementation that tests the gross subtotal (105000 >=\n100000) waives freight and computes the wrong total (0 vs 2500).\n"
    test_recipe:
      setup:
      - ACTIVE clinic C (minimum 5000, credit 5000000, frequency 5, free_freight_threshold 100000)
      - 'ACTIVE program+enrollment: manufacturer ACME-VET, types [CONSUMABLE, EQUIPMENT], min_distinct_categories 2, discount 10%, rates 0/0, threshold 999999999'
      - CONSUMABLE product C1 (ACME-VET, 65000c) and EQUIPMENT product E1 (ACME-VET, 40000c), each with stock
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic O
          license_number: LIC-O1
          ship_to_address: 4 Farm Ct
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
          c_v: $.data.version
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
        captures:
          c_v: $.data.version
      - call: POST /vet/products
        payload:
          sku: CONS-O1
          product_name: Wrap Case
          manufacturer_code: ACME-VET
          product_type: CONSUMABLE
          unit_price_cents: 65000
        as: SupplyChainPlanner
        captures:
          p1_id: $.data.id
      - call: POST /vet/products
        payload:
          sku: EQ-O1
          product_name: Exam Lamp
          manufacturer_code: ACME-VET
          product_type: EQUIPMENT
          unit_price_cents: 40000
        as: SupplyChainPlanner
        captures:
          p2_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p1_id}
          lot_number: LOT-O1
          expiry_date: '2027-06-30'
          qty_on_hand: 10
        as: SupplyChainPlanner
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p2_id}
          lot_number: LOT-O2
          expiry_date: '2027-06-30'
          qty_on_hand: 5
        as: SupplyChainPlanner
      - call: POST /vet/bundle-programs
        payload:
          program_name: ACME mix
          manufacturer_code: ACME-VET
          qualifying_product_types:
          - CONSUMABLE
          - EQUIPMENT
          min_distinct_categories: 2
          bundle_discount_pct: 10
          rebate_base_rate_bp: 0
          rebate_bonus_rate_bp: 0
          bonus_threshold_cents: 999999999
        as: AccountManager
        captures:
          prog_id: $.data.id
      - call: POST /vet/bundle-programs/${prog_id}/activate
        as: AccountManager
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${prog_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v}
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 4 Farm Ct
          delivery_window_start: '2026-08-05T13:00:00Z'
          delivery_window_end: '2026-08-05T15:00:00Z'
          lines:
          - product_id: ${p1_id}
            qty_requested: 1
          - product_id: ${p2_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      trigger:
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_total: $.data.total_cents
          o_freight: $.data.freight_fee_cents
      assert:
      - Order.merchandise_subtotal_cents == 105000 (gross)
      - Order.bundle_discount_cents == 10500 (6500 + 4000, per-line round_half_up)
      - Order.merchandise_net_cents == 94500
      - Order.equipment_surcharge_cents == 1500 (1 EQUIPMENT unit * 1500, never waived)
      - "Order.freight_fee_cents == 2500 (net 94500 < 100000 \u2014 freight decided on NET, not gross)"
      - Order.total_cents == 98500 (94500 + 1500 + 2500)
  - name: short_date_credit_per_unit_rounding
    grounds:
    - calculations.short_date_credit_value
    distinguishing_aspect: "Mode (b) \u2014 nested rounding order: unit price 999c at the 50% tier\nrounds per-unit FIRST (round_half_up(499.5) = 500) then multiplies by\nqty 3 -> 1500c; the forbidden sum-then-round\
      \ order yields\nround_half_up(1498.5) = 1499c \u2014 one cent apart, pinned by the formula.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C; CONSUMABLE product (GEN, 999c) with lot expiry 2026-10-25; order qty 3 DELIVERED via lot; clock at 2026-09-20 (35 days to expiry -> 50% tier)
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
