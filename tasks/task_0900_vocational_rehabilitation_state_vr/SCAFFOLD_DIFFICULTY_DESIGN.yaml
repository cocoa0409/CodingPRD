              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 500000, comparable_benefit_cents: 100000, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
            - call: "GET /vr/cases/${case_id}"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { case_v: $.data.version }
            - call: "POST /vr/authorizations/${auth_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: Supervisor
              as_user_id: "${supervisor_id}"
          trigger:
            - call: "POST /vr/authorizations/${auth_id}/cancel"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          assert:
            - "Case.${case_id}.funds_committed_cents == 0"
            - "Case.${case_id}.funds_paid_cents == 0"
            - "Case.${case_id}.funds_available_cents == 1000000"
            - "invariant holds: 1000000 == funds_available + funds_committed + funds_paid"

      - name: slots_conserved_reserve_then_close
        grounds:
          - state_machines.Case.APPLICATION_to_PLAN_DEVELOPMENT
          - state_machines.Case.PLAN_DEVELOPMENT_to_CLOSED_OTHER
          - calculations.priority_category_slots
          - entities.PriorityCategory.fields.slot_capacity
        distinguishing_aspect: |
          Conserved quantity = integer slots: slot_capacity (2) == available_slots + slots_used throughout.
          Eligibility reserves (slots_used 0 -> 1); closing the case releases (slots_used 1 -> 0), available
          returns to 2.
        test_recipe:
          setup:
            - "MSD category cap 2; case reaches PLAN_DEVELOPMENT via eligibility reserve (slots_used 1, available 1)."
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 2 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Sal Ray", consumer_dob: "1981-07-19", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "POST /vr/cases/${case_id}/close"
              payload: { closure_reason: "relocated out of state" }
              as: Counselor
              as_user_id: "${counselor_id}"
          assert:
            - "Case.${case_id}.status == CLOSED_OTHER"
            - "PriorityCategory.${cat1_id}.slots_used == 0"
            - "PriorityCategory.${cat1_id}.available_slots == 2"
            - "invariant holds: 2 == available_slots + slots_used"
