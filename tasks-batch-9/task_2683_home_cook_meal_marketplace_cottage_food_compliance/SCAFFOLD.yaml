# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- authentication / authorization / request shape
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles declared in 1.7"
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID absent while acting as Cook, ComplianceReviewer, SafetyOfficer or FinanceOperator"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong JSON type, undeclared enum member, non-integer money or quantity, or malformed ISO-8601 timestamp"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting Cook's X-User-ID is not the cook_id owning the target resource"
  # -- existence
  - id: ERR_STATE_POLICY_NOT_FOUND
    http: 404
    condition: "state_policy_id does not resolve, or no StatePolicy exists for the cook's state_code"
  - id: ERR_COOK_NOT_FOUND
    http: 404
    condition: "cook id in path or body does not resolve"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "onboarding document id in path does not resolve"
  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "menu item id in path or body does not resolve"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "production window id in path or body does not resolve"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "delivery zone id in body does not resolve"
  - id: ERR_HUB_NOT_FOUND
    http: 404
    condition: "pickup hub id in path does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id in path or body does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "safety incident id in path or body does not resolve"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "payout statement id in path does not resolve"
  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "refund event id in path does not resolve"
  # -- optimistic concurrency
  - id: ERR_STALE_COOK_VERSION
    http: 412
    condition: "expected_cook_version does not equal the target Cook's current version on POST /onboarding-documents"
  - id: ERR_STALE_WINDOW_VERSION
    http: 412
    condition: "expected_production_window_version does not equal the target ProductionWindow's current version on POST /payout-statements"
  # -- declared-transition violations
  - id: ERR_INVALID_COOK_TRANSITION
    http: 409
    condition: "requested onboarding_status or compliance_standing transition is not declared from the cook's current state (includes acting on a REJECTED or REVOKED cook)"
  - id: ERR_INVALID_DOCUMENT_TRANSITION
    http: 409
    condition: "review decision does not match the document's doc_type transition set (e.g. VERIFY on a KITCHEN_INSPECTION)"
  - id: ERR_INVALID_MENU_ITEM_TRANSITION
    http: 409
    condition: "submit or review requested from a menu item state that declares no such transition (e.g. submit on APPROVED, review on DRAFT, any action on REJECTED or DELISTED)"
  - id: ERR_INVALID_WINDOW_TRANSITION
    http: 409
    condition: "to_status is not reachable from the window's current status (e.g. OPEN -> CLOSED, or any action on CLOSED or CANCELLED)"
  - id: ERR_INVALID_ORDER_TRANSITION
    http: 409
    condition: "to_status is not reachable from the order's current fulfillment_status (e.g. PLACED -> DELIVERED, route on an already ROUTED order, cancel a DELIVERED order), or the transition's cross-entity precondition fails (ROUTED -> IN_PRODUCTION while the owning ProductionWindow is not IN_PRODUCTION)"
  - id: ERR_INVALID_INCIDENT_TRANSITION
    http: 409
    condition: "triage on a non-INTAKE incident or adjudicate on a DISMISSED / already-adjudicated incident"
  - id: ERR_INVALID_STATEMENT_TRANSITION
    http: 409
    condition: "to_status is not reachable from the statement's current status (e.g. DRAFT -> PAID, any action on SUPERSEDED)"
  # -- state preconditions
  - id: ERR_COOK_NOT_ACTIVE
    http: 409
    condition: "the cook's onboarding_status is not ACTIVE"
  - id: ERR_MENU_ITEM_NOT_APPROVED
    http: 409
    condition: "the ordered menu item's review_status is not APPROVED"
  - id: ERR_WINDOW_CUTOFF_PASSED
    http: 409
    condition: "an order is placed on a window whose status is not OPEN or whose order_cutoff_at has already been reached"
  - id: ERR_DOC_ALREADY_REVIEWED
    http: 409
    condition: "the onboarding document's review_status is not SUBMITTED"
  - id: ERR_INCIDENT_NOT_TRIAGED
    http: 409
    condition: "adjudication attempted on an incident whose status is not TRIAGED"
  - id: ERR_CUTOFF_NOT_REACHED
    http: 409
    condition: "the window is advanced past OPEN, or a consolidation is attempted, before order_cutoff_at"
  - id: ERR_HANDOFF_NOT_STARTED
    http: 409
    condition: "an order is advanced to HANDED_OFF before the window's handoff_start_at"
  - id: ERR_HANDOFF_NOT_FINISHED
    http: 409
    condition: "a window is advanced to CLOSED before its handoff_end_at"
  - id: ERR_ORDER_NOT_REFUNDABLE
    http: 409
    condition: "the order's payment_status is not CAPTURED or PARTIALLY_REFUNDED"
  # -- safety / compliance
  - id: ERR_COOK_SUSPENDED
    http: 409
    condition: "the cook's compliance_standing is SUSPENDED or REVOKED"
  - id: ERR_CERT_EXPIRED
    http: 409
    condition: "the cook has no VERIFIED FOOD_HANDLER_CERT whose expires_on is strictly after the logical clock's date"
  - id: ERR_KITCHEN_TYPE_NOT_ALLOWED
    http: 422
    condition: "the verified kitchen type is not in the state policy's allowed_kitchen_types"
  - id: ERR_TCS_REQUIRES_COMMERCIAL_KITCHEN
    http: 422
    condition: "a TCS menu item is approved for a cook whose verified_kitchen_type is HOME_COTTAGE or HOME_INSPECTED in a state whose policy sets tcs_requires_commercial_kitchen"
  - id: ERR_ALLERGEN_DISCLOSURE_MISSING
    http: 422
    condition: "allergens is empty and allergen_free_attested is false"
  - id: ERR_SOD_SAME_OFFICER
    http: 403
    condition: "the acting officer's X-User-ID equals the user who performed the prior segregated step (incident triage, or the cook's kitchen-inspection review)"
  - id: ERR_COLD_CHAIN_INFEASIBLE
    http: 422
    condition: "on POST /orders/{id}/route: a refrigerated item resolved to routing_mode SAME_DAY_HOT, or a refrigerated BATCH_COOK_AND_CHILL item whose window handoff span exceeds the zone's max_cold_chain_minutes"
  - id: ERR_OPEN_INCIDENT_BLOCKS_PAYOUT
    http: 409
    condition: "a payout statement is finalized while the cook has a safety incident in INTAKE or TRIAGED"
  # -- constraints
  - id: ERR_SHELF_LIFE_EXCEEDS_POLICY
    http: 422
    condition: "a non-refrigerated menu item's shelf_life_days exceeds the state policy's max_shelf_life_days_non_refrigerated"
  - id: ERR_LABEL_FIELDS_INCOMPLETE
    http: 422
    condition: "label_fields omits a key listed in the state policy's label_required_fields"
  - id: ERR_DOC_FIELDS_INVALID_FOR_TYPE
    http: 422
    condition: "the conditional fields supplied do not match the document's doc_type"
  - id: ERR_CERT_VALIDITY_TOO_LONG
    http: 422
    condition: "expires_on is not after issued_on, or the certificate validity span exceeds the state policy's cert_validity_max_days"
  - id: ERR_CUTOFF_AFTER_HANDOFF
    http: 422
    condition: "order_cutoff_at, handoff_start_at and handoff_end_at are not in strictly increasing order"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "the new window's half-open handoff interval overlaps an existing non-terminal window of the same cook"
  - id: ERR_HUB_SLOT_CONFLICT
    http: 409
    condition: "the buffered handoff interval of this order's production window intersects the buffered interval of another production window that already holds slots on the hub selected by calculations.hub_selector"
  - id: ERR_WINDOW_CAPACITY_ABOVE_COOK_LIMIT
    http: 422
    condition: "capacity_meals is below 1 or above the cook's weekly_capacity_meals"
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "order quantity is below 1 or above 20"
  - id: ERR_DUPLICATE_STATE_POLICY
    http: 409
    condition: "a state policy already exists for that state_code"
  - id: ERR_DUPLICATE_ZONE_CODE
    http: 409
    condition: "a delivery zone already uses that zone_code"
  - id: ERR_DUPLICATE_COOK_EMAIL
    http: 409
    condition: "a cook already uses that email, case-insensitively"
  - id: ERR_DUPLICATE_FINALIZED_STATEMENT
    http: 409
    condition: "a FINALIZED or PAID payout statement already exists for that (cook, production window) pair when a new statement is created or another is finalized"
  # -- referential agreement
  - id: ERR_ZONE_STATE_MISMATCH
    http: 422
    condition: "the delivery zone's state_code does not match its state policy at creation, or does not match the cook's state_code at order placement"
  - id: ERR_INCIDENT_SUBJECT_MISMATCH
    http: 422
    condition: "the id set supplied does not match subject_type exactly, or the referenced order or menu item does not belong to the named cook"
  - id: ERR_HUB_ZONE_INELIGIBLE
    http: 422
    condition: "the hub's zone is not HUB_PICKUP, or its state_code differs from the window cook's state_code"
  # -- fiscal / capacity
  - id: ERR_COTTAGE_CAP_EXCEEDED
    http: 422
    condition: "projected cottage-food revenue would exceed the state's cottage_food_annual_cap_cents"
  - id: ERR_WINDOW_CAPACITY_EXCEEDED
    http: 422
    condition: "committed_meals plus the requested quantity would exceed effective_capacity_meals after the spoilage reserve"
  - id: ERR_REFUND_EXCEEDS_REMAINING
    http: 422
    condition: "refund_amount_cents is below 1 or above total_charge_cents minus refunded_cents"
  - id: ERR_PAYOUT_HOLD_ACTIVE
    http: 409
    condition: "a statement is advanced to PAID while the cook's compliance_standing is SUSPENDED or REVOKED"
  - id: ERR_NO_ELIGIBLE_HUB
    http: 422
    condition: "on POST /orders/{id}/route for a HUB_PICKUP zone, no open hub in the order's zone survives the hub_selector eligibility filter"
  - id: ERR_NO_ELIGIBLE_ORDERS
    http: 422
    condition: "no hub-routed order of the named window is in ROUTED or IN_PRODUCTION when a consolidation is requested"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "Unauthenticated visitor. Can self-register as a cook and browse the public catalog of state policies, menu items, zones and hubs. Sends X-User-Role: Anonymous with no X-User-ID."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cooks"
      - "GET /state-policies"
      - "GET /state-policies/{id}"
      - "GET /menu-items"
      - "GET /menu-items/{id}"
      - "GET /delivery-zones"
      - "GET /delivery-zones/{id}"
      - "GET /pickup-hubs"
      - "GET /pickup-hubs/{id}"
  - name: Cook
    description: "A registered home cook. X-User-ID is the Cook.id. May only submit documents for, create menu items for, open windows for, and read the payouts of, its own cook record; may advance its own orders through production and handoff."
    identity: "entity_backed:Cook"
    exclusive_operations: []
    shared_operations:
      - "POST /onboarding-documents"
      - "POST /menu-items"
      - "POST /menu-items/{id}/submit"
      - "POST /production-windows"
      - "POST /production-windows/{id}/advance"
      - "POST /orders/{id}/advance"
      - "POST /orders/{id}/cancel"
      - "GET /cooks/{id}"
      - "GET /cooks/{id}/compliance-summary"
      - "GET /onboarding-documents"
      - "GET /onboarding-documents/{id}"
      - "GET /menu-items"
      - "GET /menu-items/{id}"
      - "GET /production-windows"
      - "GET /production-windows/{id}"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /payout-statements"
      - "GET /payout-statements/{id}"
      - "GET /refund-events"
      - "GET /refund-events/{id}"
      - "GET /state-policies"
      - "GET /state-policies/{id}"
      - "GET /delivery-zones"
      - "GET /delivery-zones/{id}"
      - "GET /pickup-hubs"
      - "GET /pickup-hubs/{id}"
  - name: Diner
    description: "A meal buyer. Places, advances-to-delivered and cancels orders, and files food-safety reports. Never touches compliance, capacity configuration or money."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders"
    shared_operations:
      - "POST /orders/{id}/advance"
      - "POST /orders/{id}/cancel"
      - "POST /safety-incidents"
      - "GET /cooks/{id}"
      - "GET /menu-items"
      - "GET /menu-items/{id}"
      - "GET /production-windows"
      - "GET /production-windows/{id}"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /state-policies"
      - "GET /state-policies/{id}"
      - "GET /delivery-zones"
      - "GET /delivery-zones/{id}"
      - "GET /pickup-hubs"
      - "GET /pickup-hubs/{id}"
  - name: ComplianceReviewer
    description: "Reviews onboarding documents, activates or rejects cooks, and approves or bounces menu items. Cannot adjudicate safety incidents, cannot touch payouts, and cannot approve a menu item for a cook whose kitchen inspection this same X-User-ID reviewed (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /onboarding-documents/{id}/review"
      - "POST /cooks/{id}/onboarding-decision"
      - "POST /menu-items/{id}/review"
    shared_operations:
      - "GET /cooks"
      - "GET /cooks/{id}"
      - "GET /cooks/{id}/compliance-summary"
      - "GET /onboarding-documents"
      - "GET /onboarding-documents/{id}"
      - "GET /menu-items"
      - "GET /menu-items/{id}"
      - "GET /safety-incidents"
      - "GET /safety-incidents/{id}"
      - "GET /state-policies"
      - "GET /state-policies/{id}"
  - name: SafetyOfficer
    description: "Owns food-safety intake, triage, adjudication and cook standing actions. Cannot adjudicate an incident this same X-User-ID triaged (segregation of duties), cannot approve menu items, and cannot pay cooks."
    identity: "opaque"
    exclusive_operations:
      - "POST /safety-incidents/{id}/triage"
      - "POST /safety-incidents/{id}/adjudicate"
      - "POST /cooks/{id}/standing-actions"
    shared_operations:
      - "POST /safety-incidents"
      - "GET /cooks"
      - "GET /cooks/{id}"
      - "GET /cooks/{id}/compliance-summary"
      - "GET /menu-items"
      - "GET /menu-items/{id}"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /safety-incidents"
