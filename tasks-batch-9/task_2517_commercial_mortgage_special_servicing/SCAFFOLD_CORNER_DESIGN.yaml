            - "Alternative D reports discounted_pv_usd == 7823022.88 and npv_usd == 7623022.88"
            - "rank 1 == alternative A (DEED_IN_LIEU, ordinal 2, created first), rank 2 == alternative C (DEED_IN_LIEU, ordinal 2, created third)"
            - "rank 3 == alternative B (NOTE_SALE, ordinal 3) — the type ordinal outranks created_at, so B loses to C despite being created earlier"
            - "rank 4 == alternative D purely on npv, before any tie-break is consulted"
