      - name: compute_capacity_summary_matches_the_snapshot_the_write_gate_uses
        claim_type: Conditional action
        grounds:
          - calculations.dining_order_capacity_snapshot
          - endpoints.GET_/showtimes/{id}/dining-capacity
          - endpoints.POST_/order-slips
        distinguishing_aspect: "The read model and the write gate are two views of one computation, so the band the read reports is exactly the band the next write is judged against at the same instant."
        test_recipe:
          setup:
            - "Auditorium A, kitchen_point_rate 1, E1 prep 1, server S1, showtime X1 starts 2026-09-01T20:00:00Z runtime 60 so the deadline is 20:45. Clock 2026-09-01T20:20:00Z with 26 accepted entree slips of 1x E1, giving a load of 26 points against 25 remaining minutes."
