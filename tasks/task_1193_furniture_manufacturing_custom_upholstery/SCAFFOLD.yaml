# =============================================================================
# Task 1193 — Furniture Manufacturing & Custom Upholstery Plant
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1193. Furniture Manufacturing & Custom Upholstery Plant (North Carolina furniture plant):
  frame/fabric/finish option matrix & COM handling, cutting yield & pattern repeat allowance,
  customer-owned material receiving & shortfall, sewing/upholstery cell scheduling,
  flammability label & compliance, container vs domestic component supply,
  showroom sample program, freight class & white-glove handoff

domain_name: furniture-upholstery-mill
api_prefix: /mill

# =============================================================================
# Complexity profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # fabric yardage pools: reserved / committed / released / consumed
  secondary_archetype: temporal_windowing    # sewing & upholstery cell scheduling
  complexity_layers:
    - dual_variant_calculation               # provisional vs final yardage; LTL vs white-glove freight
    - cascading_side_effects                 # lot recall → allocation release → line shortfall → order hold → booking release
    - optimistic_concurrency                 # OCC on OrderLine.version for cut-plan create-with-supersede
    - selector_policy                        # FEFO lot selector for plant-stock reservation
  entity_topology: flat                      # peer collections, FK links, no URL nesting (cut-plan create is the only nested write)
  state_machine_shape: cyclic                # order hold/rework loops, cut-plan revision loop, line shortfall loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                       # MaterialLot.parent_lot_id via split
  role_model: segregation_of_duties          # lot inspector may not certify flammability for an order that consumed that lot
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links in bodies)
# =============================================================================
entities:
  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique model code (e.g., CAMDEN-SOFA)" }
      - { name: category, type: enum, source: input, description: "SOFA | CHAIR | SECTIONAL | OTTOMAN" }
      - { name: base_fabric_yards, type: number, source: input, description: "Fabric yards per unit at 54in nominal width with no pattern match" }
      - { name: base_price_cents, type: integer, source: input, description: "Dealer net base price per unit in cents" }
      - { name: requires_pattern_match, type: boolean, source: input, default: false, description: "Whether cuts must align at pattern repeat boundaries" }
      - { name: flammability_standard, type: enum, source: input, description: "TB117_2013 | UFAC | TB133 — label standard this model must ship under" }
      - { name: required_component_codes, type: array, source: input, description: "Component codes (e.g., FRAME, LEGS) that must be RECEIVED before a CUT booking" }
      - { name: option_rules, type: array, source: input, description: "Option matrix rows: {fabric_grade, finish_code, allowed, surcharge_pct, lead_time_adder_days}; finish_code ANY is the wildcard row" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED" }

  - name: FabricSpec
    parent: null
    common_fields: true
    fields:
      - { name: fabric_code, type: string, source: input, description: "Unique fabric code" }
      - { name: origin, type: enum, source: input, description: "PLANT | CUSTOMER (CUSTOMER == COM fabric declared by the ordering dealer)" }
      - { name: grade, type: enum, source: input, description: "A | B | C | D | COM" }
      - { name: nominal_width_inches, type: number, source: input, description: "Nominal roll width in inches" }
      - { name: pattern_repeat_v_inches, type: number, source: input, default: 0, description: "Vertical pattern repeat in inches; 0 == solid/no repeat" }
      - { name: pattern_repeat_h_inches, type: number, source: input, default: 0, description: "Horizontal pattern repeat in inches" }
      - { name: match_method, type: enum, source: input, default: NONE, description: "NONE | STRAIGHT | DROP_HALF" }
      - { name: price_per_yard_cents, type: integer, source: input, default: 0, description: "Plant price per yard (PLANT origin)" }
      - { name: com_credit_per_yard_cents, type: integer, source: input, default: 0, description: "Credit granted to the order per usable COM yard accepted" }

  - name: DealerAccount
    parent: null
    common_fields: true
    fields:
      - { name: dealer_code, type: string, source: input, description: "Unique dealer code" }
      - { name: name, type: string, source: input, description: "Dealer display name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open order total in cents" }
      - { name: sample_allowance_cents, type: integer, source: input, description: "Annual showroom-sample loan allowance in cents" }
      - { name: outstanding_sample_value_cents, type: integer, source: computed, default: 0, description: "Read-only = Σ sample_value_cents of this dealer's ShowroomSamples with disposition ON_LOAN" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_number, type: string, source: input, description: "Unique dealer-facing order number" }
      - { name: dealer_id, type: string, source: input, description: "FK -> DealerAccount.id; ordering dealer" }
      - { name: ship_to_state, type: string, source: input, description: "2-letter US state code for the ship-to address" }
      - { name: delivery_method, type: enum, source: input, description: "LTL_FREIGHT | WHITE_GLOVE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFIRMED | MATERIAL_HOLD | IN_PRODUCTION | QUALITY_REVIEW | READY_TO_SHIP | SHIPPED | DELIVERED | CANCELLED" }
      - { name: common_flammability_standard, type: enum, source: computed, description: "Read-only; set at first line add = that line's model flammability_standard; every later line must match" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Read-only; Σ line_total_cents, computed at confirm" }
      - { name: com_credit_cents, type: integer, source: computed, default: 0, description: "Read-only; Σ per-line round_half_up(allocated COM yards × com_credit_per_yard_cents); recomputed on every allocation mutation" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Read-only = subtotal_cents − com_credit_cents" }
      - { name: quality_result, type: enum, source: system, default: NONE, description: "NONE | PASSED | FAILED" }
      - { name: confirmed_at, type: datetime, source: system, description: "Read-only; logical-clock timestamp of confirm" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id; owning order" }
      - { name: model_id, type: string, source: input, description: "FK -> ProductModel.id" }
      - { name: fabric_spec_id, type: string, source: input, description: "FK -> FabricSpec.id" }
      - { name: fabric_source, type: enum, source: input, description: "PLANT_STOCK | COM" }
      - { name: finish_code, type: string, source: input, description: "Finish code, e.g. ESPRESSO; matched against the model option matrix" }
      - { name: quantity, type: integer, source: input, description: "Units ordered (> 0)" }
      - { name: matched_surcharge_pct, type: number, source: computed, description: "Read-only; surcharge_pct of the matched option rule" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only = round_half_up(model.base_price_cents × (1 + matched_surcharge_pct)) — rounded per unit BEFORE multiplying" }
      - { name: line_total_cents, type: integer, source: computed, description: "Read-only = unit_price_cents × quantity" }
      - { name: required_yards_provisional, type: number, source: computed, description: "Read-only; spec-based estimate computed at order confirm (3 decimals)" }
      - { name: required_yards_final, type: number, source: computed, description: "Read-only; marker+measured-width figure computed at cut-plan approve; null until then" }
      - { name: allocated_yards, type: number, source: computed, default: 0, description: "Read-only = Σ yards of ACTIVE MaterialAllocations on this line" }
      - { name: shortfall_yards, type: number, source: computed, default: 0, description: "Read-only = max(0, required_effective − allocated_yards), required_effective = required_yards_final if set else required_yards_provisional" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | MATERIAL_SHORTFALL | ALLOCATED | CUT | SEWN | UPHOLSTERED | COMPLETED | CANCELLED" }

  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: fabric_spec_id, type: string, source: input, description: "FK -> FabricSpec.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; REQUIRED when spec origin is CUSTOMER (COM lot bound to its ordering line), FORBIDDEN when origin is PLANT; null for plant stock" }
      - { name: parent_lot_id, type: string, source: system, description: "FK -> MaterialLot.id; set only on the child created by a split; null otherwise" }
      - { name: ownership, type: enum, source: system, description: "PLANT | CUSTOMER; copied from spec.origin at create" }
      - { name: expected_yards, type: number, source: input, description: "Yards the receiver expects on this lot" }
      - { name: received_yards, type: number, source: system, description: "Yards physically received; set at receive; null until then" }
      - { name: measured_width_inches, type: number, source: system, description: "Usable goods width measured at inspection; null until inspect PASS" }
      - { name: usable_yards, type: number, source: system, description: "Yards passing inspection; set at inspect; null until then" }
      - { name: rejected_yards, type: number, source: system, description: "Yards failed at inspection" }
      - { name: allocated_yards, type: number, source: computed, default: 0, description: "Read-only = Σ yards of ACTIVE MaterialAllocations on this lot" }
      - { name: available_yards, type: number, source: computed, default: 0, description: "Read-only = (usable_yards if set else 0) − allocated_yards − consumed_total, where consumed_total = Σ consumed_yards of this lot's CONSUMED allocations" }
      - { name: status, type: enum, source: system, default: EXPECTED, description: "EXPECTED | RECEIVED | AVAILABLE | REJECTED | DEPLETED | RETURNED" }
      - { name: received_at, type: datetime, source: system, description: "Read-only; logical-clock timestamp of receive" }
      - { name: inspected_by, type: string, source: system, description: "X-User-ID of the QualityInspector who inspected the lot; used by segregation-of-duties" }

  - name: MaterialAllocation
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> MaterialLot.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id" }
      - { name: yards, type: number, source: input, description: "Reserved yards (> 0, 3-decimal precision)" }
      - { name: consumed_yards, type: number, source: system, default: 0, description: "Yards actually consumed at record-cut (≤ yards)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CONSUMED | RELEASED" }

  - name: CutPlan
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; from the nested create path" }
      - { name: marker_length_yards, type: number, source: input, description: "Gross marker length for the whole line at nominal 54in goods; supplied at approve" }
      - { name: required_yards_final, type: number, source: computed, description: "Read-only; computed at approve = round_half_up(marker_length_yards × 52 / (measured_width − 2), 3)" }
      - { name: utilization_pct, type: number, source: computed, description: "Read-only; computed at record-cut = round_half_up(required_yards_final / Σ consumed_yards × 100, 2)" }
      - { name: waste_yards, type: number, source: computed, description: "Read-only; computed at record-cut = Σ consumed_yards − required_yards_final (3 decimals)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED | CUT | SUPERSEDED | VOID" }

  - name: Cell
    parent: null
    common_fields: true
    fields:
      - { name: cell_code, type: string, source: input, description: "Unique cell code" }
      - { name: cell_type, type: enum, source: input, description: "CUTTING | SEWING | UPHOLSTERY" }
      - { name: capacity_slots, type: integer, source: input, default: 1, description: "Max overlapping active bookings; >1 only meaningful for CUTTING tables" }
      - { name: certifications, type: array, source: input, description: "Capability tags, e.g. [COM_HANDLING, TUFTING]" }
      - { name: committed_hours, type: number, source: computed, default: 0, description: "Read-only = Σ duration_hours of this cell's bookings with status BOOKED or IN_PROGRESS" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DOWN" }

  - name: CellBooking
    parent: null
    common_fields: true
    fields:
      - { name: cell_id, type: string, source: input, description: "FK -> Cell.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id" }
      - { name: operation, type: enum, source: input, description: "CUT | SEW | UPHOLSTER" }
      - { name: start_at, type: datetime, source: input, description: "Window start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (ISO8601 UTC); must be > start_at" }
      - { name: duration_hours, type: number, source: computed, description: "Read-only = (end_at − start_at) in hours" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | IN_PROGRESS | COMPLETED | RELEASED" }

  - name: ComplianceCertificate
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id" }
      - { name: standard, type: enum, source: input, description: "TB117_2013 | UFAC | TB133" }
      - { name: label_lot_number, type: string, source: input, description: "Flammability label lot applied on the line" }
      - { name: label_count, type: integer, source: input, description: "Number of law labels applied; must equal Σ quantity of the order's lines at certify" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of creator" }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of certifier; set at certify" }
      - { name: certified_at, type: datetime, source: system, description: "Read-only; logical-clock timestamp of certify" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CERTIFIED | VOID" }

  - name: SupplyRequisition
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id" }
      - { name: component_code, type: string, source: input, description: "Component code, e.g. FRAME or LEGS" }
      - { name: quantity, type: integer, source: input, description: "Units requested" }
      - { name: source_type, type: enum, source: input, description: "CONTAINER | DOMESTIC" }
      - { name: ordered_quantity, type: integer, source: computed, description: "Read-only; CONTAINER rounds up to a multiple of MOQ 50; DOMESTIC = quantity" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "Read-only; CONTAINER 1200, DOMESTIC 2000" }
      - { name: extended_cost_cents, type: integer, source: computed, description: "Read-only = ordered_quantity × unit_cost_cents" }
      - { name: available_date, type: string, source: computed, description: "Read-only; ISO date = date(order.confirmed_at) + lead days (CONTAINER 45, DOMESTIC 7)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PLACED | RECEIVED | CANCELLED" }
      - { name: received_at, type: datetime, source: system, description: "Read-only; logical-clock timestamp of receive" }

  - name: ShowroomSample
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> DealerAccount.id" }
      - { name: model_id, type: string, source: input, description: "FK -> ProductModel.id" }
      - { name: unit_serial, type: string, source: input, description: "Serialized physical sample unit; one active loan per serial" }
      - { name: sample_value_cents, type: integer, source: input, description: "Loan value counted against the dealer allowance" }
      - { name: due_back_days, type: integer, source: input, default: 90, description: "Loan length in days" }
      - { name: loaned_at, type: datetime, source: system, description: "Read-only; logical-clock timestamp of create" }
      - { name: due_back_at, type: datetime, source: computed, description: "Read-only = loaned_at + due_back_days" }
      - { name: returned_at, type: datetime, source: system, description: "Read-only; logical-clock timestamp of return" }
      - { name: disposition, type: enum, source: system, default: ON_LOAN, description: "ON_LOAN | RETURNED | SOLD | WRITTEN_OFF" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id; one shipment per order" }
      - { name: carrier_name, type: string, source: input, description: "Carrier display name" }
      - { name: method, type: enum, source: system, description: "LTL | WHITE_GLOVE; copied from order.delivery_method at create" }
      - { name: weight_lb, type: number, source: input, description: "Total packaged weight in pounds" }
      - { name: length_in, type: number, source: input, description: "Packaged length in inches" }
      - { name: width_in, type: number, source: input, description: "Packaged width in inches" }
      - { name: height_in, type: number, source: input, description: "Packaged height in inches" }
      - { name: declared_value_cents, type: integer, source: input, default: 0, description: "Declared value for carriage" }
      - { name: piece_count, type: integer, source: input, description: "Number of pieces handed to the carrier" }
      - { name: density_lb_per_cuft, type: number, source: computed, description: "Read-only = weight_lb / (length_in × width_in × height_in / 1728), 4 decimals" }
      - { name: freight_class, type: enum, source: computed, description: "CLASS_65 | CLASS_70 | CLASS_85 | CLASS_92_5 | CLASS_100 | CLASS_110 | CLASS_125 | CLASS_150 | CLASS_175 | CLASS_200 | CLASS_250 | CLASS_300 | CLASS_400" }
      - { name: freight_charge_cents, type: integer, source: computed, description: "Read-only; computed at rate per the method variant" }
      - { name: condition_check_passed, type: boolean, source: input, description: "White-glove handoff condition check; required true at pickup when method is WHITE_GLOVE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | RATED | TENDERED | PICKED_UP | DELIVERED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /mill/customer-orders/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "Order in DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "At least one OrderLine exists (ERR_ORDER_HAS_NO_LINES)"
          - "DealerAccount.status == ACTIVE (ERR_DEALER_SUSPENDED)"
          - "total_cents ≤ dealer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Per line: compute matched_surcharge_pct, unit_price_cents, line_total_cents; order.subtotal_cents = Σ line_total_cents"
          - "Per line: compute required_yards_provisional (calculation fabric_requirement_provisional)"
          - "Per PLANT_STOCK line: run lot selector (FEFO) and create RESERVE MaterialAllocations up to the provisional requirement"
          - "Per COM line: no allocation yet (lots arrive later); line → MATERIAL_SHORTFALL"
          - "Each line → ALLOCATED if allocated_yards ≥ required_yards_provisional else MATERIAL_SHORTFALL"
          - "confirmed_at = logical clock"
        note: "If any line lands MATERIAL_SHORTFALL the order lands in MATERIAL_HOLD instead of CONFIRMED."
      - from: DRAFT
        to: MATERIAL_HOLD
        trigger: "POST /mill/customer-orders/{id}/confirm (when at least one line is MATERIAL_SHORTFALL)"
        actor: SalesRep
        preconditions: ["same as DRAFT → CONFIRMED"]
        side_effects: ["same side effects as confirm; order lands MATERIAL_HOLD"]
      - from: MATERIAL_HOLD
        to: CONFIRMED
        trigger: "system (automatic when the last MATERIAL_SHORTFALL line flips to ALLOCATED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: MATERIAL_HOLD
        trigger: "system (automatic when any line flips ALLOCATED → MATERIAL_SHORTFALL)"
        actor: system
        preconditions: []
        side_effects:
          - "All BOOKED CellBookings of the order's lines → RELEASED (cell.committed_hours recomputed — calculation cell_committed_hours)"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system (automatic when the first CellBooking of any line of the order → IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: QUALITY_REVIEW
        trigger: "system (automatic when every line of the order is UPHOLSTERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALITY_REVIEW
        to: READY_TO_SHIP
        trigger: "POST /mill/customer-orders/{id}/pass-quality"
        actor: QualityInspector
        preconditions:
          - "Order in QUALITY_REVIEW (ERR_ORDER_NOT_IN_QUALITY_REVIEW)"
          - "A ComplianceCertificate for the order exists with status CERTIFIED (ERR_COMPLIANCE_NOT_CERTIFIED)"
        side_effects:
          - "quality_result = PASSED"
          - "All lines UPHOLSTERED → COMPLETED"
      - from: QUALITY_REVIEW
        to: IN_PRODUCTION
        trigger: "POST /mill/customer-orders/{id}/fail-quality"
        actor: QualityInspector
        preconditions:
          - "Order in QUALITY_REVIEW (ERR_ORDER_NOT_IN_QUALITY_REVIEW)"
          - "rework_line_ids non-empty and each names a UPHOLSTERED line of this order (ERR_ORDER_LINE_NOT_FOUND / ERR_LINE_STAGE_MISMATCH)"
        side_effects:
          - "quality_result = FAILED"
          - "Each listed line → SEWN (rework loop: needs a fresh UPHOLSTER booking)"
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "system (automatic when the order's Shipment → PICKED_UP)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "system (automatic when the order's Shipment → DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mill/customer-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Order in DRAFT, CONFIRMED, or MATERIAL_HOLD (ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects:
          - "All non-terminal lines → CANCELLED"
          - "Each cancelled line's ACTIVE MaterialAllocations → RELEASED; owning lots' allocated_yards recomputed"
          - "OPEN or PLACED SupplyRequisitions of those lines → CANCELLED"
          - "DRAFT or APPROVED CutPlans of those lines → VOID"
          - "BOOKED CellBookings of those lines → RELEASED"
          - "DRAFT ComplianceCertificates of the order → VOID"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /mill/customer-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Order in DRAFT, CONFIRMED, or MATERIAL_HOLD (ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects: ["same cascade as DRAFT → CANCELLED"]
      - from: MATERIAL_HOLD
        to: CANCELLED
        trigger: "POST /mill/customer-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Order in DRAFT, CONFIRMED, or MATERIAL_HOLD (ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects: ["same cascade as DRAFT → CANCELLED"]

  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "system (during order confirm, when reservation covers required_yards_provisional)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: MATERIAL_SHORTFALL
        trigger: "system (during order confirm, when reservation does not cover the requirement — always the case for COM lines at confirm)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATERIAL_SHORTFALL
        to: ALLOCATED
        trigger: "system (automatic when allocated_yards ≥ required_effective after an allocation is created)"
        actor: system
        preconditions: []
        side_effects:
          - "If this was the order's last MATERIAL_SHORTFALL line and the order is MATERIAL_HOLD → order → CONFIRMED"
      - from: ALLOCATED
        to: MATERIAL_SHORTFALL
        trigger: "system (automatic when allocated_yards < required_effective after an allocation release or lot recall)"
        actor: system
        preconditions: []
        side_effects:
          - "If the order is CONFIRMED → order → MATERIAL_HOLD and its BOOKED CellBookings → RELEASED"
      - from: ALLOCATED
        to: CUT
        trigger: "system (during POST /mill/cut-plans/{id}/record-cut)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CUT
        to: SEWN
        trigger: "system (when the line's SEW CellBooking → COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SEWN
        to: UPHOLSTERED
        trigger: "system (when the line's UPHOLSTER CellBooking → COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "If every line of the order is UPHOLSTERED → order → QUALITY_REVIEW"
      - from: UPHOLSTERED
        to: COMPLETED
        trigger: "system (during order pass-quality)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UPHOLSTERED
        to: SEWN
        trigger: "system (during order fail-quality — rework loop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["ACTIVE MaterialAllocations → RELEASED"]
      - from: MATERIAL_SHORTFALL
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["ACTIVE MaterialAllocations → RELEASED"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["ACTIVE MaterialAllocations → RELEASED"]

  - entity: MaterialLot
    initial_state: EXPECTED
    terminal_states: [DEPLETED, RETURNED]
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /mill/material-lots/{id}/receive"
        actor: MaterialReceiver
        preconditions:
          - "Lot in EXPECTED (ERR_LOT_INVALID_STATE)"
          - "received_yards > 0 and ≤ expected_yards × 1.10 (ERR_OVER_RECEIPT)"
        side_effects:
          - "received_yards set; received_at = logical clock"
      - from: RECEIVED
        to: AVAILABLE
        trigger: "POST /mill/material-lots/{id}/inspect with result PASS"
        actor: QualityInspector
        preconditions:
          - "Lot in RECEIVED (ERR_LOT_INVALID_STATE)"
          - "usable_yards + rejected_yards == received_yards exactly, 3-decimal comparison (ERR_INSPECTION_YARDAGE_MISMATCH)"
          - "usable_yards > 0 (ERR_INSPECTION_YARDAGE_MISMATCH)"
          - "measured_width_inches > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "usable_yards, rejected_yards, measured_width_inches, inspected_by = X-User-ID set"
          - "If ownership == CUSTOMER: auto-create a RESERVE MaterialAllocation to the bound order line for min(usable_yards, line shortfall_yards); recompute line shortfall/status"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /mill/material-lots/{id}/inspect with result FAIL"
        actor: QualityInspector
        preconditions: ["Lot in RECEIVED (ERR_LOT_INVALID_STATE)"]
        side_effects:
          - "usable_yards = 0; rejected_yards = received_yards; inspected_by set"
      - from: AVAILABLE
        to: REJECTED
        trigger: "POST /mill/material-lots/{id}/reject-lot (quality recall after acceptance)"
        actor: QualityInspector
        preconditions: ["Lot in AVAILABLE (ERR_LOT_NOT_AVAILABLE)"]
        side_effects:
          - "All ACTIVE MaterialAllocations on the lot → RELEASED"
          - "Each affected OrderLine recomputes allocated_yards; lines dropping below requirement → MATERIAL_SHORTFALL"
          - "Each such line's order: if CONFIRMED → MATERIAL_HOLD and its BOOKED CellBookings → RELEASED"
          - "usable_yards unchanged but no longer allocatable; lot no longer eligible for the FEFO selector"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic at record-cut when the lot has no ACTIVE allocations and available_yards ≤ 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: RETURNED
        trigger: "POST /mill/material-lots/{id}/return-to-customer"
        actor: MaterialReceiver
        preconditions:
          - "Lot in REJECTED (ERR_LOT_INVALID_STATE)"
          - "ownership == CUSTOMER (ERR_LOT_NOT_RETURNABLE)"
        side_effects: []
      - from: AVAILABLE
        to: RETURNED
        trigger: "not allowed — only REJECTED lots can be returned"
        actor: MaterialReceiver
        preconditions: ["Lot in REJECTED (ERR_LOT_INVALID_STATE)"]
        side_effects: []
        note: "Declared so the invalid-from rejection is explicit for tests."

  - entity: MaterialAllocation
    initial_state: ACTIVE
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /mill/material-allocations/{id}/release, or cascade (lot recall / order cancel / record-cut excess)"
        actor: ProductionPlanner
        preconditions: ["Allocation in ACTIVE (ERR_ALLOCATION_INVALID_STATE)"]
        side_effects:
          - "Lot.allocated_yards recomputed; line.allocated_yards recomputed; shortfall re-evaluated (calculation shortfall_evaluation — may flip line ALLOCATED → MATERIAL_SHORTFALL and order CONFIRMED → MATERIAL_HOLD)"
          - "Order.com_credit_cents recomputed (COM allocations contribute credit only while ACTIVE or CONSUMED)"
      - from: ACTIVE
        to: CONSUMED
        trigger: "system (during record-cut; ALL of the line's ACTIVE allocations are consumed whole, in created_at ASC order)"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_yards set to the allocation's full yards"
          - "Lot → DEPLETED if it has no ACTIVE allocations and available_yards ≤ 0"

  - entity: CutPlan
    initial_state: DRAFT
    terminal_states: [CUT, SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /mill/cut-plans/{id}/approve"
        actor: ProductionPlanner
        preconditions:
          - "Plan in DRAFT (ERR_CUT_PLAN_NOT_DRAFT)"
          - "marker_length_yards > 0 (ERR_INVALID_REQUEST)"
          - "Line status == ALLOCATED (ERR_LINE_STAGE_MISMATCH)"
          - "line.allocated_yards ≥ computed required_yards_final (ERR_INSUFFICIENT_ALLOCATION)"
        side_effects:
          - "required_yards_final computed (calculation fabric_requirement_final) and copied to line.required_yards_final"
          - "line shortfall re-evaluated against the final requirement (calculation shortfall_evaluation)"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /mill/cut-plans/{id}/revise (marker revision loop)"
        actor: ProductionPlanner
        preconditions: ["Plan in APPROVED (ERR_CUT_PLAN_NOT_APPROVED)"]
        side_effects:
          - "line.required_yards_final cleared back to null; shortfall re-evaluated against the provisional requirement (calculation shortfall_evaluation)"
      - from: APPROVED
        to: CUT
        trigger: "POST /mill/cut-plans/{id}/record-cut"
        actor: ProductionPlanner
        preconditions:
          - "Plan in APPROVED (ERR_CUT_PLAN_NOT_APPROVED)"
          - "The line has a COMPLETED CUT CellBooking (ERR_LINE_STAGE_MISMATCH)"
        side_effects:
          - "Consume ALL of the line's ACTIVE allocations whole, in created_at ASC order (each → CONSUMED with consumed_yards = yards)"
          - "utilization_pct = round_half_up(required_yards_final / Σ consumed_yards × 100, 2); waste_yards = Σ consumed_yards − required_yards_final (3 decimals)"
          - "Lots left with no ACTIVE allocations and available_yards ≤ 0 → DEPLETED"
          - "Line → CUT"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when a new CutPlan is created for the same line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (when a new CutPlan is created for the same line)"
        actor: system
        preconditions: []
        side_effects: ["line.required_yards_final cleared back to null"]
      - from: DRAFT
        to: VOID
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOID
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Cell
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DOWN
        trigger: "POST /mill/cells/{id}/set-status with status DOWN"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["Existing bookings are NOT auto-released; they must be released explicitly"]
      - from: DOWN
        to: ACTIVE
        trigger: "POST /mill/cells/{id}/set-status with status ACTIVE"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []

  - entity: CellBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /mill/cell-bookings/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "Booking in BOOKED (ERR_BOOKING_INVALID_STATE)"
          - "Order status ∈ {CONFIRMED, IN_PRODUCTION} (ERR_ORDER_NOT_BOOKABLE)"
          - "Line still in the stage required by the operation (ERR_LINE_STAGE_MISMATCH)"
        side_effects:
          - "If this is the order's first IN_PROGRESS booking → order → IN_PRODUCTION"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /mill/cell-bookings/{id}/complete"
        actor: ProductionPlanner
        preconditions: ["Booking in IN_PROGRESS (ERR_BOOKING_INVALID_STATE)"]
        side_effects:
          - "Operation CUT → line → CUT only via record-cut; operation SEW → line → SEWN; operation UPHOLSTER → line → UPHOLSTERED (and maybe order → QUALITY_REVIEW)"
        note: "CUT completion does not itself advance the line; record-cut does, and requires the completed CUT booking."
      - from: BOOKED
        to: RELEASED
        trigger: "POST /mill/cell-bookings/{id}/release, or cascade (order hold / order cancel)"
        actor: ProductionPlanner
        preconditions: ["Booking in BOOKED (ERR_BOOKING_INVALID_STATE)"]
        side_effects: ["cell.committed_hours recomputed (calculation cell_committed_hours)"]

  - entity: ComplianceCertificate
    initial_state: DRAFT
    terminal_states: [CERTIFIED, VOID]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /mill/compliance-certificates/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "Certificate in DRAFT (ERR_CERTIFICATE_NOT_DRAFT)"
          - "Order status ∈ {IN_PRODUCTION, QUALITY_REVIEW} (ERR_ORDER_NOT_IN_QUALITY_REVIEW)"
          - "standard == order.common_flammability_standard (ERR_FLAMMABILITY_STANDARD_MISMATCH)"
          - "label_count == Σ quantity of the order's lines (ERR_LABEL_COUNT_MISMATCH)"
          - "X-User-ID ≠ inspected_by of every lot that has or had an allocation to any line of this order (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by = X-User-ID; certified_at = logical clock"
      - from: DRAFT
        to: VOID
        trigger: "POST /mill/compliance-certificates/{id}/void, or order cancel cascade"
        actor: ComplianceOfficer
        preconditions: ["Certificate in DRAFT or CERTIFIED (ERR_CERTIFICATE_NOT_DRAFT)"]
        side_effects: []
      - from: CERTIFIED
        to: VOID
        trigger: "POST /mill/compliance-certificates/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "Certificate in DRAFT or CERTIFIED (ERR_CERTIFICATE_NOT_DRAFT)"
          - "Order status ∈ {IN_PRODUCTION, QUALITY_REVIEW} (ERR_ORDER_NOT_IN_QUALITY_REVIEW)"
        side_effects: []

  - entity: SupplyRequisition
    initial_state: OPEN
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: OPEN
        to: PLACED
        trigger: "POST /mill/supply-requisitions/{id}/place"
        actor: ProductionPlanner
        preconditions: ["Requisition in OPEN (ERR_REQUISITION_INVALID_STATE)"]
        side_effects: []
      - from: PLACED
        to: RECEIVED
        trigger: "POST /mill/supply-requisitions/{id}/receive"
        actor: ProductionPlanner
        preconditions:
          - "Requisition in PLACED (ERR_REQUISITION_INVALID_STATE)"
          - "Logical clock date ≥ available_date (ERR_COMPONENT_NOT_YET_AVAILABLE)"
        side_effects: ["received_at = logical clock"]
      - from: OPEN
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShowroomSample
    initial_state: ON_LOAN
    terminal_states: [RETURNED, SOLD, WRITTEN_OFF]
    transitions:
      - from: ON_LOAN
        to: RETURNED
        trigger: "POST /mill/showroom-samples/{id}/return"
        actor: SalesRep
        preconditions: ["Sample ON_LOAN (ERR_SAMPLE_NOT_ON_LOAN)"]
        side_effects:
          - "returned_at = logical clock; dealer.outstanding_sample_value_cents recomputed (calculation sample_allowance_ledger; decremented by sample_value_cents)"
      - from: ON_LOAN
        to: SOLD
        trigger: "POST /mill/showroom-samples/{id}/sell"
        actor: SalesRep
        preconditions: ["Sample ON_LOAN (ERR_SAMPLE_NOT_ON_LOAN)"]
        side_effects: ["dealer.outstanding_sample_value_cents recomputed (calculation sample_allowance_ledger; decremented)"]
      - from: ON_LOAN
        to: WRITTEN_OFF
        trigger: "POST /mill/showroom-samples/{id}/write-off"
        actor: SalesRep
        preconditions: ["Sample ON_LOAN (ERR_SAMPLE_NOT_ON_LOAN)"]
        side_effects: ["dealer.outstanding_sample_value_cents UNCHANGED (written-off value keeps consuming the allowance)"]

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: RATED
        trigger: "POST /mill/shipments/{id}/rate"
        actor: ShippingCoordinator
        preconditions: ["Shipment in DRAFT (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects:
          - "density_lb_per_cuft and freight_class computed (calculation freight_classification)"
          - "freight_charge_cents computed per method variant (calculation freight_charge)"
      - from: RATED
        to: TENDERED
        trigger: "POST /mill/shipments/{id}/tender"
        actor: ShippingCoordinator
        preconditions:
          - "Shipment in RATED (ERR_SHIPMENT_INVALID_STATE)"
          - "Order status == READY_TO_SHIP (ERR_ORDER_NOT_READY_TO_SHIP)"
        side_effects: []
      - from: TENDERED
        to: PICKED_UP
        trigger: "POST /mill/shipments/{id}/record-pickup"
        actor: ShippingCoordinator
        preconditions:
          - "Shipment in TENDERED (ERR_SHIPMENT_INVALID_STATE)"
          - "If method == WHITE_GLOVE: condition_check_passed must be true (ERR_WHITE_GLOVE_CHECK_REQUIRED)"
        side_effects: ["Order → SHIPPED"]
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /mill/shipments/{id}/record-delivery"
        actor: ShippingCoordinator
        preconditions: ["Shipment in PICKED_UP (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects: ["Order → DELIVERED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state-precondition conflicts live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: cutplan-create-stale-line
    parent_entity: OrderLine
    write_endpoint: "POST /mill/order-lines/{lineId}/cut-plans"
    occ_field: expected_order_line_version
    description: |
      Creating a CutPlan against an OrderLine whose version has advanced since the
      client last observed it is rejected. A new CutPlan legitimately supersedes the
      line's existing DRAFT/APPROVED plan (which moves to SUPERSEDED), so a client
      holding a stale OrderLine.version would silently supersede a plan it never saw;
      the stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fabric_requirement_provisional
    trigger: "order confirm (per line); also re-evaluated implicitly when a CutPlan revise clears required_yards_final"
    algorithm: constraint_propagation
    formula: |
      inputs: model.base_fabric_yards B, line.quantity Q, spec.nominal_width_inches W,
              spec.pattern_repeat_v_inches R, spec.match_method M, model.requires_pattern_match PM
      width_factor = max(1.0, 54.0 / (W − SELVAGE_TRIM_IN))
      if PM and R > 0:
          repeat_yards = R / 36.0
          if M == DROP_HALF: repeat_yards = repeat_yards × 1.5
          per_unit = B × width_factor
          repeats = ceil(per_unit / repeat_yards)
          base = repeats × repeat_yards × Q
      else:
          base = B × width_factor × Q
      waste_pct = 0.15 if Q ≤ 5; 0.10 if 6 ≤ Q ≤ 20; 0.07 if Q > 20
      required_yards_provisional = round_half_up(base × (1 + waste_pct), 3)
    input_set: "the single OrderLine being priced at confirm"
    constants:
      NOMINAL_WIDTH_IN: 54
      SELVAGE_TRIM_IN: 2
      WASTE_TIER_LOW_MAX_QTY: 5
      WASTE_TIER_MID_MAX_QTY: 20
      WASTE_LOW: 0.15
      WASTE_MID: 0.10
      WASTE_HIGH: 0.07
    precision: "3 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at order confirm; uses spec-sheet nominal width and pattern-match ceil"
        difference: "uses nominal width; applies tiered waste factor; result stored on line.required_yards_provisional"
      - name: final
        when: "at cut-plan approve; uses the minimum measured width over the line's allocated lots and the marker length (see fabric_requirement_final)"
        difference: "different formula and inputs; for identical line data the two variants differ (e.g. 14.950 provisional vs 14.083 final)"

  - name: fabric_requirement_final
    trigger: "cut-plan approve"
    algorithm: constraint_propagation
    formula: |
      measured_width = min(lot.measured_width_inches over lots holding ACTIVE allocations for the line)
      required_yards_final = round_half_up(marker_length_yards × (NOMINAL_WIDTH_IN − SELVAGE_TRIM_IN) / (measured_width − SELVAGE_TRIM_IN), 3)
      Wider measured goods (measured_width > 54) yield FEWER yards; narrower yield more.
    input_set: "the CutPlan's marker_length_yards plus the measured widths of all lots with ACTIVE allocations to the line at approve time"
    constants:
      NOMINAL_WIDTH_IN: 54
      SELVAGE_TRIM_IN: 2
    precision: "3 decimal places, round_half_up"

  - name: order_pricing
    trigger: "order confirm (subtotal) and every allocation create/release/consume (com_credit recompute)"
    algorithm: aggregation
    formula: |
      Evaluation order is PINNED (rounding order matters — do not reassociate):
      1. Per line, in line.created_at ASC order:
           unit_price_cents = round_half_up(model.base_price_cents × (1 + matched_surcharge_pct), 0)   # round per unit FIRST
           line_total_cents = unit_price_cents × quantity                                            # exact integer multiply
      2. subtotal_cents = Σ line_total_cents
      3. Per line with COM fabric, in line.created_at ASC order:
           line_credit = round_half_up(allocated_com_yards × spec.com_credit_per_yard_cents, 0)      # per-line rounding
         where allocated_com_yards = Σ yards of that line's allocations with status ∈ {ACTIVE, CONSUMED} on CUSTOMER-owned lots
      4. com_credit_cents = Σ line_credit
      5. total_cents = subtotal_cents − com_credit_cents   # derived by subtraction only; never recompute total directly
    input_set: "all lines of the order; allocation statuses as of the trigger moment"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: freight_classification
    trigger: "shipment rate"
    algorithm: threshold
    formula: |
      volume_cuft = (length_in × width_in × height_in) / 1728.0
      density = weight_lb / volume_cuft   # keep 4 decimals internally, round_half_up
      base class by density (>= lower bound): ≥22.5→CLASS_65; ≥15→CLASS_70; ≥12→CLASS_85; ≥9→CLASS_92_5;
        ≥8→CLASS_100; ≥7→CLASS_110; ≥6→CLASS_125; ≥5→CLASS_150; ≥4→CLASS_175; ≥3→CLASS_200;
        ≥2→CLASS_250; ≥1→CLASS_300; <1→CLASS_400
      value override: if declared_value_cents / weight_lb > VALUE_PER_LB_THRESHOLD_CENTS (strictly greater),
        bump the class ONE step toward CLASS_400 in the order 65→70→85→92_5→100→110→125→150→175→200→250→300→400.
    input_set: "the Shipment being rated"
    constants:
      VALUE_PER_LB_THRESHOLD_CENTS: 3000
    precision: "density 4 decimal places, round_half_up"

  - name: freight_charge
    trigger: "shipment rate (after freight_classification)"
    algorithm: tiered_pricing
    formula: |
      Variant LTL (order.delivery_method == LTL_FREIGHT):
        rate_per_lb_cents by class: 65→40; 70→50; 85→65; 92_5→80; 100→95; 110→110; 125→130;
          150→155; 175→190; 200→230; 250→280; 300→340; 400→420
        base_cents = round_half_up(weight_lb × rate_per_lb_cents, 0)
        fuel_cents = round_half_up(base_cents × FUEL_PCT, 0)          # fuel on base ONLY
        freight_charge_cents = base_cents + fuel_cents                # pinned order: base first, fuel second, then add
      Variant WHITE_GLOVE (order.delivery_method == WHITE_GLOVE):
        freight_charge_cents = max(WG_MIN_CENTS, piece_count × WG_PER_PIECE_CENTS) + WG_INSIDE_SURCHARGE_CENTS
        (density/class are still computed and stored, but the charge ignores them)
    input_set: "the Shipment being rated plus its order's delivery_method"
    constants:
      FUEL_PCT: 0.18
      WG_MIN_CENTS: 15000
      WG_PER_PIECE_CENTS: 8500
      WG_INSIDE_SURCHARGE_CENTS: 4500
    precision: "integer cents, round_half_up"
    variants:
      - name: ltl_density
        when: "order delivery_method LTL_FREIGHT"
        difference: "weight × class rate + fuel surcharge"
      - name: white_glove_flat
        when: "order delivery_method WHITE_GLOVE"
        difference: "per-piece flat with minimum and inside-delivery surcharge; identical shipment data prices differently (e.g. 43896 LTL vs 30000 white-glove for the fixture below)"

  - name: shortfall_evaluation
    trigger: "allocation create/release/consume; lot inspect PASS; lot recall; cut-plan approve/revise"
    algorithm: aggregation
    formula: |
      required_effective = line.required_yards_final if set else line.required_yards_provisional
      line.allocated_yards = Σ yards of line's allocations with status == ACTIVE
      line.shortfall_yards = max(0, required_effective − line.allocated_yards)
      line is ALLOCATED iff allocated_yards ≥ required_effective (boundary INCLUSIVE: equality is ALLOCATED),
      else MATERIAL_SHORTFALL (PENDING lines are untouched until confirm).
    input_set: "the single affected OrderLine and its ACTIVE allocations"
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: lot_selector_fefo
    trigger: "order confirm (per PLANT_STOCK line) and manual allocation create is exempt (manual picks its lot explicitly)"
    algorithm: aggregation
    formula: |
      eligible = MaterialLots where fabric_spec_id == line.fabric_spec_id, ownership == PLANT,
                 status == AVAILABLE, available_yards > 0
      order eligible by received_at ASC, tie-break created_at ASC
      walk in order: reserve y = min(lot.available_yards, remaining_requirement) per lot until
      remaining_requirement == 0 or the pool is exhausted (partial satisfaction allowed; the line
      stays MATERIAL_SHORTFALL with the residual)
    input_set: "AVAILABLE PLANT lots of the line's spec at confirm time"
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: requisition_sizing
    trigger: "supply requisition create"
    algorithm: tiered_pricing
    formula: |
      if source_type == CONTAINER:
          ordered_quantity = ceil(quantity / MOQ) × MOQ   # MOQ 50
          unit_cost_cents = 1200
          lead_days = 45
      else:                                                # DOMESTIC
          ordered_quantity = quantity
          unit_cost_cents = 2000
          lead_days = 7
      extended_cost_cents = ordered_quantity × unit_cost_cents
      available_date = date(order.confirmed_at) + lead_days   # date arithmetic on the logical clock
    input_set: "the new SupplyRequisition plus its line's order.confirmed_at"
    constants:
      CONTAINER_MOQ: 50
      CONTAINER_UNIT_COST_CENTS: 1200
      CONTAINER_LEAD_DAYS: 45
      DOMESTIC_UNIT_COST_CENTS: 2000
      DOMESTIC_LEAD_DAYS: 7
    precision: "integer cents"

  - name: cell_committed_hours
    trigger: "cell-booking create/start/complete/release"
    algorithm: aggregation
    formula: |
      cell.committed_hours = Σ duration_hours of the cell's bookings with status ∈ {BOOKED, IN_PROGRESS}
      duration_hours = (end_at − start_at) in hours (2 decimals)
    input_set: "all bookings of the cell in BOOKED or IN_PROGRESS"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: sample_allowance_ledger
    trigger: "sample create/return/sell/write-off"
    algorithm: aggregation
    formula: |
      dealer.outstanding_sample_value_cents = Σ sample_value_cents of the dealer's samples with disposition == ON_LOAN
      New loan gate: outstanding + new sample_value_cents ≤ sample_allowance_cents (boundary INCLUSIVE:
      landing exactly on the allowance is permitted) else ERR_SAMPLE_ALLOWANCE_EXCEEDED.
    input_set: "all ShowroomSamples of the dealer"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "The caller's role is listed on the endpoint (RBAC)", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body is well-formed: required fields present, enum values legal, numeric ranges sane (quantity > 0, yards > 0, end_at > start_at)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 4, category: existence, check: "Path and body referenced ids exist (left-to-right); unique natural keys not duplicated (model_code, fabric_code, dealer_code, cell_code, order_number)", error_id: "ERR_PRODUCT_MODEL_NOT_FOUND | ERR_FABRIC_SPEC_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_MATERIAL_LOT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CUT_PLAN_NOT_FOUND | ERR_CELL_NOT_FOUND | ERR_CELL_BOOKING_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_REQUISITION_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_DUPLICATE_NATURAL_KEY", http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource in a legal state for the operation (per state machine; includes model ACTIVE, dealer ACTIVE, lot AVAILABLE for allocation, certificate DRAFT, pass-quality's CERTIFIED-certificate precondition, etc.)", error_id: "ERR_MODEL_NOT_ACTIVE | ERR_DEALER_SUSPENDED | ERR_ORDER_NOT_DRAFT | ERR_ORDER_NOT_CANCELLABLE | ERR_ORDER_NOT_IN_QUALITY_REVIEW | ERR_ORDER_NOT_BOOKABLE | ERR_ORDER_NOT_READY_TO_SHIP | ERR_COMPLIANCE_NOT_CERTIFIED | ERR_LINE_STAGE_MISMATCH | ERR_LOT_INVALID_STATE | ERR_LOT_NOT_AVAILABLE | ERR_ALLOCATION_INVALID_STATE | ERR_CUT_PLAN_NOT_DRAFT | ERR_CUT_PLAN_NOT_APPROVED | ERR_BOOKING_INVALID_STATE | ERR_CERTIFICATE_NOT_DRAFT | ERR_REQUISITION_INVALID_STATE | ERR_SAMPLE_NOT_ON_LOAN | ERR_SHIPMENT_INVALID_STATE", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Cell carries every certification the operation demands (COM line → COM_HANDLING); cell not DOWN; flammability standard consistent (line add vs order common standard; certify vs common standard); segregation of duties (certifier ≠ inspector of any lot allocated to the order)", error_id: "ERR_CELL_CERTIFICATION_MISSING | ERR_CELL_DOWN | ERR_FLAMMABILITY_STANDARD_MISMATCH | ERR_SEGREGATION_OF_DUTIES", http_status: 422, applies_to: "line create, booking create, certificate create/certify" }
  - { priority: 7, category: business_constraint, check: "Option combo allowed by the model matrix (exact finish row beats ANY row); cell_type matches operation; booking overlap rules per cell capacity; operation sequencing (SEW needs CUT, UPHOLSTER needs SEWN); components RECEIVED before CUT booking; one active certificate per order; one shipment per order; lot binding rules (COM lot needs order_line_id; PLANT lot forbids it); return-to-customer only for CUSTOMER-owned lots; label_count == Σ quantities; over-receipt cap; inspection yardage conservation; unit-serial loan exclusivity and refurb gap", error_id: "ERR_OPTION_COMBO_RESTRICTED | ERR_CELL_TYPE_MISMATCH | ERR_CELL_OVERLAP | ERR_CELL_CAPACITY_EXCEEDED | ERR_COMPONENT_NOT_RECEIVED | ERR_UNIT_SERIAL_UNAVAILABLE | ERR_SAMPLE_IN_REFURB | ERR_CERTIFICATE_EXISTS | ERR_SHIPMENT_EXISTS | ERR_LOT_BINDING_INVALID | ERR_LOT_NOT_RETURNABLE | ERR_ORDER_HAS_NO_LINES | ERR_LABEL_COUNT_MISMATCH | ERR_OVER_RECEIPT | ERR_INSPECTION_YARDAGE_MISMATCH", http_status: 422, applies_to: "line/lot/booking/certificate/shipment/sample creates and actions" }
  - { priority: 8, category: business_temporal, check: "Component receive not before available_date (logical clock)", error_id: ERR_COMPONENT_NOT_YET_AVAILABLE, http_status: 422, applies_to: "POST /mill/supply-requisitions/{id}/receive" }
  - { priority: 9, category: business_fiscal, check: "Order total ≤ dealer credit limit at confirm; allocation yards ≤ lot available_yards; sample loan within allowance; cut-plan approve requires allocated ≥ final requirement", error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_INSUFFICIENT_YARDAGE | ERR_SAMPLE_ALLOWANCE_EXCEEDED | ERR_INSUFFICIENT_ALLOCATION", http_status: 402, applies_to: "order confirm, allocation create, sample create, cut-plan approve" }

