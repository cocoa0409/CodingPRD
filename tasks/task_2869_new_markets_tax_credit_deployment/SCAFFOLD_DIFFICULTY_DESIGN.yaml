  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: voiding_a_qei_restores_allocation_authority_and_fund_capital_exactly
        grounds:
          - calculations.allocation_authority_ledger
          - state_machines.QEI.deployment_status.ISSUED_to_VOIDED
          - endpoints[POST /nmtc/qeis/{id}/void]
          - entities.AllocationAward.fields.remaining_authority_cents
        distinguishing_aspect: |
          Conserved quantity: the award's ALLOCATION AUTHORITY (and the mirror bucket of fund
          capital). Issuing a QEI moves 100,000,000 cents out of remaining_authority_cents and out
          of the fund's capital_available_cents; the void must return both to their exact
          pre-issuance values and decrement issued_qei_count, so that the identical amount can be
          re-issued afterwards. An implementation that forgets the reversal leaks authority
          permanently.
        test_recipe:
          setup:
            - "One ACTIVE award with allocation_amount_cents 5,000,000,000 and remaining_authority_cents 5,000,000,000."
            - "One FUNDED fund with 100,000,000 cents of capital available."
            - "One QEI of 100,000,000 cents issued from that fund, with no QLICI rows (voiding requires an empty QEI)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-016", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS", "LA"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_id: $.data.id }
          trigger:
            - call: "POST /nmtc/qeis/${qei_id}/void"
              payload: { void_reason: "Investor withdrew before closing" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "GET /nmtc/allocation-awards/${award_id}"
              payload: {}
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_after_void: $.data.version }
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_after_void}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_2_id: $.data.id }
          assert:
            - "BEFORE — after the setup issuance, AllocationAward.${award_id}.remaining_authority_cents == 4900000000 and issued_qei_count == 1; InvestmentFund.${fund_id}.capital_available_cents == 0, deployed_to_qei_cents == 100000000, status == QEI_MADE"
            - "COMPENSATION — after the void, AllocationAward.${award_id}.remaining_authority_cents == 5000000000 (exactly the pre-issuance value) and issued_qei_count == 0"
            - "COMPENSATION — InvestmentFund.${fund_id}.capital_available_cents == 100000000, deployed_to_qei_cents == 0 and status == FUNDED"
            - "QEI.${qei_id}.deployment_status == VOIDED, voided_at == \"2026-09-01T00:00:00.000Z\", uninvested_cash_cents == 0 and permitted_fees_cents == 0 (the reserve is unwound too)"
            - "NO DRIFT — the re-issuance succeeds with 201 and QEI.${qei_2_id}.qei_amount_cents == 100000000, permitted_fees_cents == 5000000, uninvested_cash_cents == 95000000"
            - "AllocationAward.${award_id}.remaining_authority_cents == 4900000000 and issued_qei_count == 1 after re-issuance — the ledger returned to the same point, not to 4,800,000,000"
            - "AllocationAward.${award_id}.allocation_amount_cents == 5000000000 is never mutated by any of these operations"
            - "The void bumped the award version, so the stale ${award_v_signed} would have produced ERR_STALE_AWARD_VERSION — the re-read version ${award_v_after_void} is required"

      - name: deploy_then_fully_repay_returns_qei_uninvested_cash_to_its_exact_prior_value
        grounds:
          - calculations.qei_capital_ledger
          - endpoints[POST /nmtc/qlicis/{id}/principal-repayments]
          - state_machines.QLICI.status
          - entities.ReinvestmentObligation.fields.reinvest_by_at
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from allocation authority: the QEI's own capital ledger,
          qei_amount == permitted_fees + uninvested_cash + outstanding principal. A deploy of
          85,000,000 cents followed by a full repayment of the same amount must land
          uninvested_cash_cents back on 95,000,000 with permitted_fees_cents untouched at
          5,000,000 — while leaving behind the non-cash residue the round trip legitimately
          creates: a REPAID QLICI with total_repaid_cents 85,000,000, an OPEN
          ReinvestmentObligation, and an AT_RISK compliance status.
        test_recipe:
          setup:
            - "One ACTIVE award, one QEI of 100,000,000 cents issued 2026-09-01 (permitted_fees 5,000,000, uninvested 95,000,000)."
            - "One QLICI of 85,000,000 cents deployed 2026-12-01 to a CERTIFIED QALICB, leaving uninvested_cash_cents 10,000,000."
            - "Logical clock at 2026-12-01 for the repayment, so the obligation's reinvest_by_at lands on 2027-12-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-017", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS", "LA"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${qalicb_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "A", principal_cents: 85000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_id: $.data.id }
          trigger:
            - call: "POST /nmtc/qlicis/${qlici_id}/principal-repayments"
              payload: { amount_cents: 85000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "GET /nmtc/reinvestment-obligations?source_qlici_id=${qlici_id}"
              payload: {}
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { obligation_id: "$.data[0].id" }
          assert:
            - "BEFORE — after the setup deployment, QEI.${qei_id}.uninvested_cash_cents == 10000000, permitted_fees_cents == 5000000, substantially_all_pct_direct == 89.47, compliance_status == COMPLIANT"
            - "COMPENSATION — after the full repayment, QEI.${qei_id}.uninvested_cash_cents == 95000000, exactly the pre-deployment value"
            - "COMPENSATION — permitted_fees_cents == 5000000 is untouched by the repayment (the fee bucket is invariant for the QEI's whole life)"
            - "INVARIANT — qei_amount_cents 100000000 == permitted_fees_cents 5000000 + uninvested_cash_cents 95000000 + outstanding principal 0"
            - "QLICI.${qlici_id}.status == REPAID, outstanding_principal_cents == 0, total_repaid_cents == 85000000"
            - "LEGITIMATE RESIDUE — ReinvestmentObligation.${obligation_id}.status == OPEN, amount_cents == 85000000, reinvested_cents == 0, arose_at == \"2026-12-01T00:00:00.000Z\", reinvest_by_at == \"2027-12-01T00:00:00.000Z\""
            - "LEGITIMATE RESIDUE — QEI.${qei_id}.deployment_status == REINVESTMENT_PENDING, substantially_all_pct_direct == 0.00, compliance_status == AT_RISK, cure_deadline_at == \"2027-05-30T00:00:00.000Z\""
            - "AllocationAward.${award_id}.at_risk_qei_count == 1, remaining_authority_cents == 4900000000 (repayment never touches allocation authority) and severe_distress_share_pct == 0.00"
            - "A second repayment of 1 cent on the same QLICI returns 422 with error_id == \"ERR_REPAYMENT_EXCEEDS_PRINCIPAL\" — the ledger cannot be over-drained"
