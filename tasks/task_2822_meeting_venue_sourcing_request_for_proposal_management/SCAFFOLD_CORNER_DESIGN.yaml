      grounds:
      - endpoints[PATCH /sourcing/venues/{venue_id}/preferred-status]
      - entities.Venue.fields.preferred_supplier_status
      - entities.VenueShortlistEntry.fields.program_status_at_shortlist
      - validations[priority=60]
      - errors[ERR_VENUE_SUSPENDED]
      distinguishing_aspect: 'The PATCH is a plain master-data update - status SUSPENDED, Venue.version 1 -> 2, nothing else on the row changes - but it does NOT rewrite the already-captured program_status_at_shortlist snapshot on the existing entry, and it immediately blocks forward sourcing: promoting that entry now returns HTTP 422 ERR_VENUE_SUSPENDED.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
        - PREFERRED TIER_1 Venue 'Harborline Grand' (420 rooms, 14000 sqft).
        - MeetingEvent EVT-2822-A requirements locked with that venue added as a CANDIDATE entry carrying program_status_at_shortlist IN_PROGRAM.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 260.0, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156}
          as: ProgramAdmin
          captures: {bm_t1_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {v1_id: $.data.id}
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/events/${ev_id}/shortlist-entries
          payload: {venue_id: '${v1_id}', rank_seq: 1, inspection_required: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {e1_id: $.data.id}
        trigger:
        - call: PATCH /sourcing/venues/${v1_id}/preferred-status
          payload: {preferred_supplier_status: SUSPENDED}
          as: ProgramAdmin
        - call: POST /sourcing/shortlist-entries/${e1_id}/shortlist
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_susp: $.data.error_id}
        - call: GET /sourcing/venues
          payload: {preferred_supplier_status: SUSPENDED}
          as: SourcingManager
          as_user_id: planner-anita
        assert:
        - the patch returns HTTP 200 with Venue.${v1_id}.preferred_supplier_status == SUSPENDED
        - Venue.${v1_id}.version == 2 and updated_at == 2026-08-05T09:00:00.000Z
        - Venue.${v1_id}.guest_rooms_total == 420, largest_space_sqft == 14000, blocked_room_nights == 0 (untouched)
        - VenueShortlistEntry.${e1_id}.program_status_at_shortlist == IN_PROGRAM (snapshot NOT rewritten)
        - the promotion returns HTTP 422 with data.error_id == ERR_VENUE_SUSPENDED
        - VenueShortlistEntry.${e1_id}.status == CANDIDATE and MeetingEvent.${ev_id}.shortlisted_venue_count == 0
        - the filtered list returns exactly 1 row with total_count == 1
