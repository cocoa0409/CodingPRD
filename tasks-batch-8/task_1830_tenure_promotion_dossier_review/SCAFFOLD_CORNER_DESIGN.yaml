            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/cases/${case_ap}/close", as: ProvostOfficer, captures: { err_ap: $.data.error_id } }
            - { call: "POST /api/appeals/${app_ap}/withdraw", as: Candidate, as_user_id: "${cand_ap}", captures: { app_ap_status: $.data.status } }
