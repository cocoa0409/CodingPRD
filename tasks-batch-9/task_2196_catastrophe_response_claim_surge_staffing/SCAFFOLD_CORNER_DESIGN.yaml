          - endpoints.POST /loss-estimates
          - errors.ERR_STALE_EVENT_VERSION
        distinguishing_aspect: "Declaring the event bumped version 1 -> 2, so a POST /loss-estimates carrying expected_event_version 1 is rejected with ERR_STALE_EVENT_VERSION at HTTP 412 and no LossEstimateSnapshot row is created."
        test_recipe:
          setup: ["One DECLARED CatastropheEvent at version 2; the client still holds the pre-declaration version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "mgr-01"
