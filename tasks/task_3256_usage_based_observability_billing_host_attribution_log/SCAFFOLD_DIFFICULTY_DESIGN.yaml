# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3256
# Two instances per Difficulty Rule (§0.5); each grounds into SCAFFOLD.yaml
# §1.1–§1.7 and is executable from empty-DB via setup_api_calls.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual_variant_calc (two different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: host_billable_count_hwm_vs_p99_diverge
        grounds:
          - calculations.host_billable_count_hwm
          - calculations.host_billable_count_p99
          - calculations.host_charged_count_for_period
        distinguishing_aspect: |
          Entity domain: HostHourRecord. For the same hour set, the HWM algorithm
          (max) yields a strictly larger billable count than P99 (rank-based) — both
          are valid billing rules; the charged count is the min, so the two variants
          produce observably different results on identical inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ENTERPRISE BillingAccount with an OPEN BillingPeriod covering September. Five HostHourRecords ingested with hourly host counts [10, 12, 50, 12, 11]; P99 rank = ceil(0.99*5) = 5, so P99 = 12 (5th smallest); HWM = 50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Acme Observability", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/host-hour-records"
              payload: { hour_bucket_utc: "2026-09-01T00:00:00Z", infra_host_count: 8, container_host_count: 2, serverless_invocation_count: 100 }
              as: IngestionAgent
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/host-hour-records"
              payload: { hour_bucket_utc: "2026-09-01T01:00:00Z", infra_host_count: 10, container_host_count: 2, serverless_invocation_count: 100 }
              as: IngestionAgent
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/host-hour-records"
              payload: { hour_bucket_utc: "2026-09-01T02:00:00Z", infra_host_count: 40, container_host_count: 10, serverless_invocation_count: 100 }
              as: IngestionAgent
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/host-hour-records"
              payload: { hour_bucket_utc: "2026-09-01T03:00:00Z", infra_host_count: 10, container_host_count: 2, serverless_invocation_count: 100 }
              as: IngestionAgent
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/host-hour-records"
              payload: { hour_bucket_utc: "2026-09-01T04:00:00Z", infra_host_count: 9, container_host_count: 2, serverless_invocation_count: 100 }
              as: IngestionAgent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          assert:
            - "BillingPeriod.${period_id}.status == CLOSED"
            - "The computed HWM for the period is 50 (the 02:00Z spike)"
            - "The computed P99 for the period is 12 (5th smallest of [10, 11, 12, 12, 50])"
            - "host_billable_count_hwm != host_billable_count_p99"
            - "The charged host count == min(50, 12) == 12"

      - name: log_charge_provisional_vs_final_diverge_on_reindex
        grounds:
          - calculations.log_charged_amount
          - state_machines.LogEvent.EXCLUDED_to_INDEXED
        distinguishing_aspect: |
          Entity domain: LogEvent (different from HostHourRecord in the other instance).
          The provisional variant charges only the ingest leg at event creation; the
          final variant adds the index leg when an EXCLUDED event is later reindexed.
          Identical log bytes produce observably different cumulative charges
          depending on which variant snapshot is consulted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan with log_ingest_rate=10 cents/GB and log_index_rate=170 cents/million. A RetentionTier at 1.0x multiplier. One ExclusionFilter service_tag_pattern='noisy-*' sample_rate_pct=0 priority=1 enabled. One ACTIVE Commitment for meter=LOG_INDEX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Acme Observability", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "hot-30d", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "noisy-*", sample_rate_pct: 0, priority: 1, enabled: true }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "LOG_INDEX", committed_quantity: 1000, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 1, overage_unit_rate_cents: 5, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 1000000000, service_tag: "noisy-batch", ingested_at_utc: "2026-09-05T12:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "unused", sample_rate_pct: 100, priority: 0, enabled: false }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 1000000000, service_tag: "noisy-batch-2", ingested_at_utc: "2026-09-05T13:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { event2_id: $.data.id }
          assert:
            - "LogEvent.${event_id}.exclusion_state == EXCLUDED (provisional: ingest leg only)"
            - "LogEvent.${event2_id}.exclusion_state == EXCLUDED"
            - "LOG_INGEST MeterAccumulator.quantity == 2000000000 (both events charged on ingest)"
            - "LOG_INDEX MeterAccumulator.quantity == 0 (no index charge at provisional time)"
            - "the provisional and final log_charged_amount variants produce different index_charge for identical ingested bytes"

  # =========================================================================
  # RULE 2 — combinatorial_formula (two different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_total_with_nested_rounding
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. Two InvoiceLines whose
          unrounded amounts are 10.4 cents and 10.4 cents total 20 cents under
          per-line rounding (10 + 10), but 21 cents under sum-then-round
          (round_half_up(20.8)). The scaffold PINS per-line rounding then sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan with rates crafted so each meter yields an unrounded X.4 amount. OPEN BillingPeriod; one ACTIVE Commitment per meter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Rounding Test", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 4, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 13, overage_unit_rate_cents: 26, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { commit_host: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_host}/activate"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          assert:
            - "The DRAFT invoice is created with line amounts computed per-line, then summed"
            - "Each line's amount is round_half_up(line_amount) before summation"
            - "invoice.total_amount_cents equals the sum of rounded line amounts, NOT round_half_up(sum(unrounded line amounts))"

      - name: overage_charge_three_input_tiered_selection
        grounds:
          - calculations.overage_charge_with_commitment_tier
        distinguishing_aspect: |
          Mode (a): combinatorial formula with three inputs (quantity, commitment
          remaining, two rates) and non-linear interaction (min/max). When the new
          quantity straddles the commitment boundary, the charge splits into a
          committed portion at one rate and an overage portion at another.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan; OPEN period; Commitment for meter=INFRA_HOST with committed_quantity=10, committed_rate=100c, overage_rate=500c, currently consumed=8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Overage Test", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 10, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "INFRA_HOST", quantity: 8 }
              as: IngestionAgent
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "INFRA_HOST", quantity: 5 }
              as: IngestionAgent
          assert:
            - "MeterAccumulator INFRA_HOST.quantity == 13"
            - "MeterAccumulator INFRA_HOST.committed_consumed_quantity == 10"
            - "MeterAccumulator INFRA_HOST.on_demand_quantity == 3"
            - "The 5-unit straddling charge splits as committed_portion=2 (rate 100) + overage_portion=3 (rate 500)"
            - "Commitment.${commit_id}.status == EXHAUSTED"

  # =========================================================================
  # RULE 3 — non_linear_state_machine (two different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cardinality_incident_recurrence_loop
        grounds:
          - state_machines.CardinalityIncident
          - state_machines.CardinalityIncident.VERIFIED_to_OPEN
        distinguishing_aspect: |
          Entity: CardinalityIncident. Cyclic shape — VERIFIED -> OPEN on recurrence
          when the next rollup crosses the threshold again. This is a true cycle
          (not a one-way pipeline); the incident can oscillate.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan with included_custom_metrics=200 (so threshold=10200). OPEN BillingPeriod. CustomMetricSeries ACTIVE. One CardinalityIncident that has gone OPEN -> TRIAGED -> REMEDIATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Cycle Test", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/teams"
              payload: { name: "Platform", cost_center: "CC-100" }
              as: BillingAdmin
              captures: { team_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series"
              payload: { metric_name: "api.latency", team_id: "${team_id}" }
              as: BillingAdmin
              captures: { series_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series/${series_id}/rollup"
              payload: { cardinality_estimate: 20000 }
              as: IngestionAgent
            - call: "GET /api/billing-accounts/${acct_id}/cardinality-incidents"
              payload: {}
              as: BillingAdmin
              captures: { incident_id: "$.data[0].id" }
            - call: "POST /api/billing-accounts/${acct_id}/cardinality-incidents/${incident_id}/triage"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/cardinality-incidents/${incident_id}/remediate"
              payload: { remediation_note: "Dropped high-cardinality tag" }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series/${series_id}/rollup"
              payload: { cardinality_estimate: 5000 }
              as: IngestionAgent
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series/${series_id}/rollup"
              payload: { cardinality_estimate: 4000 }
              as: IngestionAgent
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series/${series_id}/rollup"
              payload: { cardinality_estimate: 25000 }
              as: IngestionAgent
          assert:
            - "CardinalityIncident.${incident_id}.status == OPEN (recurrence cycle VERIFIED -> OPEN)"
            - "CustomMetricSeries.${series_id}.status == QUARANTINED"

      - name: commitment_exhausted_top_up_cycle
        grounds:
          - state_machines.Commitment
          - state_machines.Commitment.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: |
          Entity: Commitment (different from CardinalityIncident). Cyclic shape —
          ACTIVE -> EXHAUSTED -> ACTIVE on top-up. The cycle is observable via the
          status field, and the consumed_quantity is preserved across the cycle.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan tier ENTERPRISE. OPEN period. Commitment INFRA_HOST committed_quantity=10 in ACTIVE. 10 units consumed, status -> EXHAUSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Commitment Cycle", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 10, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "INFRA_HOST", quantity: 10 }
              as: IngestionAgent
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/top-up"
              payload: { top_up_quantity: 5 }
              as: BillingAdmin
          assert:
            - "Commitment.${commit_id}.status == ACTIVE"
            - "Commitment.${commit_id}.committed_quantity == 15"
            - "Commitment.${commit_id}.consumed_quantity == 10"
            - "Cycle path ACTIVE -> EXHAUSTED -> ACTIVE is observable"

  # =========================================================================
  # RULE 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reindex_cascade_depth_3
        grounds:
          - state_machines.LogEvent.EXCLUDED_to_INDEXED
          - calculations.overage_charge_with_commitment_tier
        distinguishing_aspect: |
          Depth-3 cascade originating from POST reindex: (1) LogEvent transitions
          EXCLUDED -> INDEXED, (2) LOG_INDEX MeterAccumulator.quantity increments,
          (3) ACTIVE LOG_INDEX Commitment consumed_quantity debited; if it reaches
          committed_quantity, (4) Commitment status -> EXHAUSTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan with LOG_INDEX. Account with retention tier, exclusion filter that catches 'noisy-*', and an ACTIVE LOG_INDEX Commitment with committed_quantity=1 (so the first reindex exhausts it)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Cascade Test", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "hot", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "noisy-*", sample_rate_pct: 0, priority: 1, enabled: true }
              as: BillingAdmin
              captures: { filter_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "LOG_INDEX", committed_quantity: 1, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 1, overage_unit_rate_cents: 5, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 500, service_tag: "noisy-worker", ingested_at_utc: "2026-09-05T00:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { event_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters/${filter_id}/disable"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/log-events/${event_id}/reindex"
              payload: {}
              as: BillingAdmin
          assert:
            - "LogEvent.${event_id}.exclusion_state == INDEXED"
            - "MeterAccumulator LOG_INDEX.quantity == 1 (link 1->2 fired)"
            - "Commitment.${commit_id}.consumed_quantity == 1 (link 2->3 fired)"
            - "Commitment.${commit_id}.status == EXHAUSTED (link 3->4 fired)"

      - name: remediate_cascade_quarantines_series
        grounds:
          - state_machines.CardinalityIncident.TRIAGED_to_REMEDIATED
        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger (POST remediate):
          (1) CardinalityIncident -> REMEDIATED, (2) CustomMetricSeries.status ->
          QUARANTINED, (3) CUSTOM_METRIC MeterAccumulator stops counting this
          series on subsequent rollups. Different trigger from the reindex cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. OPEN period. Series in ACTIVE, cardinality above threshold, incident OPEN then TRIAGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Remediate Cascade", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/teams"
              payload: { name: "Infra", cost_center: "CC-200" }
              as: BillingAdmin
              captures: { team_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series"
              payload: { metric_name: "api.req", team_id: "${team_id}" }
              as: BillingAdmin
              captures: { series_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series/${series_id}/rollup"
              payload: { cardinality_estimate: 20000 }
              as: IngestionAgent
            - call: "GET /api/billing-accounts/${acct_id}/cardinality-incidents"
              payload: {}
              as: BillingAdmin
              captures: { incident_id: "$.data[0].id" }
            - call: "POST /api/billing-accounts/${acct_id}/cardinality-incidents/${incident_id}/triage"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/cardinality-incidents/${incident_id}/remediate"
              payload: { remediation_note: "Quarantined" }
              as: BillingAdmin
          assert:
            - "CardinalityIncident.${incident_id}.status == REMEDIATED"
            - "CustomMetricSeries.${series_id}.status == QUARANTINED"
            - "Subsequent rollup on the quarantined series does NOT increment the CUSTOM_METRIC MeterAccumulator's billable quantity"

  # =========================================================================
  # RULE 5 — priority_pair_validation_conflict (different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_commitment_create
        grounds:
          - validations.priority_5_state
          - validations.priority_8_business_temporal
          - errors.ERR_PERIOD_CLOSED
          - errors.ERR_COMMITMENT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Category pair: state (period closed) vs business_temporal (commitment
          window overlap). A request that violates BOTH must surface ERR_PERIOD_CLOSED
          (state, priority 5) before ERR_COMMITMENT_WINDOW_OVERLAP (priority 8).
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z (period ended). Existing Commitment for meter=INFRA_HOST window [2026-09-01, 2026-09-30]. Period already CLOSED. A new Commitment creation would overlap the existing window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Conflict A", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-15T00:00:00Z", window_end_utc: "2026-10-15T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "err == ERR_COMMITMENT_WINDOW_OVERLAP (priority 8 fires when state is not directly violated — commitment creation is not period-scoped, but window overlap is)"
            - "if both ERR_PERIOD_CLOSED and ERR_COMMITMENT_WINDOW_OVERLAP were theoretically eligible, the higher-priority state error wins"

      - name: business_temporal_vs_business_referential_on_tier_create
        grounds:
          - validations.priority_7_business_temporal
          - validations.priority_11_business_referential
          - errors.ERR_TIER_WINDOW_OVERLAP
          - errors.ERR_TAG_POLICY_VIOLATION
        distinguishing_aspect: |
          Category pair: business_temporal (tier window overlap) vs business_referential
          (tag policy violation). Different category pair from the other instance —
          when a RetentionTier create overlaps an existing tier window AND another
          invariant is violated, ERR_TIER_WINDOW_OVERLAP (priority 7) wins over any
          priority-11 referential check.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Account with existing RetentionTier [2026-09-01, 2026-10-01). TagPolicy enforcement=BLOCK exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Conflict B", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "first", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/tag-policies"
              payload: { required_tag_key: "team", allowed_values: ["a"], enforcement: "BLOCK" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "overlap", retention_days: 15, effective_from_utc: "2026-09-15T00:00:00Z", effective_to_utc: "2026-11-01T00:00:00Z", index_rate_multiplier_bp: 15000, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "err == ERR_TIER_WINDOW_OVERLAP (business_temporal, priority 7) wins over any business_referential violation"

  # =========================================================================
  # RULE 6 — boundary_precision_check (different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: plan_monitor_cap_at_exactly_max
        grounds:
          - validations.priority_9_business_constraint
          - errors.ERR_PLAN_LIMIT
        distinguishing_aspect: |
          Metric: ACTIVE monitor count. Boundary: when active_count == max_monitors,
          the next create is rejected (>= semantics — at-cap rejected). When
          active_count == max_monitors - 1, the next create SUCCEEDS. Endpoint:
          POST /monitors.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. FREE plan with max_monitors=5. Five ACTIVE monitors already exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "FREE", max_monitors: 5, included_custom_metrics: 10, host_overage_rate_cents: 2000, log_ingest_rate_cents_per_gb: 20, log_index_rate_cents_per_million: 200, custom_metric_rate_cents_per_unit: 10 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Cap Test", plan_tier: "FREE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/monitors"
              payload: { name: "m1", monitor_kind: "METRIC" }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/monitors"
              payload: { name: "m2", monitor_kind: "METRIC" }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/monitors"
              payload: { name: "m3", monitor_kind: "METRIC" }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/monitors"
              payload: { name: "m4", monitor_kind: "METRIC" }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/monitors"
              payload: { name: "m5", monitor_kind: "METRIC" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/monitors"
              payload: { name: "m6", monitor_kind: "METRIC" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_PLAN_LIMIT"
            - "active_count == max_monitors (5) means the next create is rejected (>= semantics, NOT > semantics)"

      - name: hwm_empty_hour_set_yields_zero
        grounds:
          - calculations.host_billable_count_hwm
          - calculations.host_billable_count_p99
        distinguishing_aspect: |
          Metric: HostHourRecord count for the period. Boundary: when the period
          has ZERO HostHourRecords (empty set), both HWM and P99 yield 0 — the
          empty-collection edge. Endpoint: POST billing-periods/{id}/close.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan; OPEN BillingPeriod; NO HostHourRecords ingested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Empty Set Test", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          assert:
            - "host_billable_count_hwm == 0 (empty set -> 0, NOT null and NOT an error)"
            - "host_billable_count_p99 == 0"
            - "host_charged_count_for_period == 0"

  # =========================================================================
  # RULE 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: commitment_activate_requires_account_good_standing
        grounds:
          - state_machines.Commitment.DRAFT_to_ACTIVE
          - validations.priority_10_business_fiscal
        distinguishing_aspect: |
          Pair: Commitment -> BillingAccount. A Commitment can only transition
          DRAFT -> ACTIVE when its parent BillingAccount.standing == GOOD. Different
          entity pair from the period-close gate below.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Account standing=GOOD initially; a DRAFT Commitment exists. Account's standing is then flipped to DELINQUENT (by external means; for the test we re-create a new account already delinquent via setup)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Standing Test", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
          assert:
            - "with BillingAccount.standing == GOOD, activate succeeds"
            - "had standing been DELINQUENT, the same call would have returned ERR_ACCOUNT_DELINQUENT"

      - name: log_reindex_requires_period_open
        grounds:
          - state_machines.LogEvent.EXCLUDED_to_INDEXED
          - validations.priority_5_state
        distinguishing_aspect: |
          Pair: LogEvent -> BillingPeriod (different entity pair from the
          Commitment/BillingAccount pair above). Reindex is rejected with
          ERR_PERIOD_CLOSED when the parent BillingPeriod is CLOSED.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Period CLOSED. One EXCLUDED LogEvent from September."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Period Gate", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "hot", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "noisy-*", sample_rate_pct: 0, priority: 1, enabled: true }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 100, service_tag: "noisy-x", ingested_at_utc: "2026-09-05T00:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { event_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/log-events/${event_id}/reindex"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "err == ERR_PERIOD_CLOSED"
            - "LogEvent.${event_id}.exclusion_state is still EXCLUDED"

  # =========================================================================
  # RULE 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: commitment_window_closed_interval_overlap
        grounds:
          - validations.priority_8_business_temporal
          - errors.ERR_COMMITMENT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics: CLOSED [start, end] — two Commitments on the same
          account+meter whose windows merely TOUCH at a single endpoint (one ends
          2026-09-30T23:59:59Z, another starts 2026-09-30T23:59:59Z) DO overlap.
          Resource: Commitment (meter dimension).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Existing Commitment INFRA_HOST with window [2026-09-01, 2026-09-30T23:59:59Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Overlap Closed", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-30T23:59:59Z", window_end_utc: "2026-10-31T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_COMMITMENT_WINDOW_OVERLAP"
            - "closed-interval semantics: endpoint equality (start == other's end) counts as overlap"

      - name: retention_tier_half_open_window_adjacency
        grounds:
          - validations.priority_7_business_temporal
          - errors.ERR_TIER_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [from, to) — two RetentionTiers whose
          windows merely touch at a boundary (one ends 2026-10-01T00:00:00Z, another
          starts 2026-10-01T00:00:00Z) do NOT overlap. Different interval semantics
          from the commitment case; different resource entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Existing RetentionTier with window [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Half Open", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "sept", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "oct", retention_days: 30, effective_from_utc: "2026-10-01T00:00:00Z", effective_to_utc: "2026-11-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { new_tier_id: $.data.id }
          assert:
            - "the response status is 201 (boundary adjacency is NOT an overlap under half-open semantics)"
            - "RetentionTier.${new_tier_id} exists"
            - "contrast with the closed-interval commitment rule which DOES treat touching endpoints as overlap"

  # =========================================================================
  # RULE 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: log_ingest_equals_indexed_plus_excluded_invariant
        grounds:
          - calculations.log_charged_amount
          - state_machines.LogEvent
        distinguishing_aspect: |
          Conserved quantity: total ingested bytes. After any combination of
          ingest and reindex actions, LOG_INGEST accumulator (bytes) ==
          (bytes of INDEXED events) + (bytes of EXCLUDED events). Reindex moves
          bytes between buckets without changing the sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan tier ENTERPRISE. Period OPEN. Exclusion filter catches 'noisy-*'. Two events: 100 bytes noisy, 200 bytes quiet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Invariant Log", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "hot", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "noisy-*", sample_rate_pct: 0, priority: 1, enabled: true }
              as: BillingAdmin
              captures: { filter_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "LOG_INDEX", committed_quantity: 100, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 1, overage_unit_rate_cents: 5, expected_billing_account_version: "${acct_v0} + 1" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 100, service_tag: "noisy-a", ingested_at_utc: "2026-09-05T00:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { ev_a: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 200, service_tag: "quiet-b", ingested_at_utc: "2026-09-05T01:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters/${filter_id}/disable"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/log-events/${ev_a}/reindex"
              payload: {}
              as: BillingAdmin
          assert:
            - "LOG_INGEST accumulator == 300 (100 + 200)"
            - "bytes of INDEXED events == 300 (200 from initial + 100 from reindexed)"
            - "bytes of EXCLUDED events == 0"
            - "LOG_INGEST == INDEXED + EXCLUDED holds at every step (invariant preserved through reindex)"

      - name: commitment_quantity_conservation_across_topup
        grounds:
          - state_machines.Commitment
          - calculations.overage_charge_with_commitment_tier
        distinguishing_aspect: |
          Conserved quantity: committed_quantity accounting. consumed + remaining +
          expired == committed_total (which itself grows on top-up). Different
          quantity from the byte invariant — this one is about unit counts on a
          Commitment.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan tier ENTERPRISE. Period OPEN. Commitment LOG_INDEX committed=10, consumed=4. Top-up adds 5 -> committed=15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Invariant Commit", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "LOG_INDEX", committed_quantity: 10, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 1, overage_unit_rate_cents: 5, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { commit_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/activate"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "LOG_INDEX", quantity: 10 }
              as: IngestionAgent
            - call: "POST /api/billing-accounts/${acct_id}/commitments/${commit_id}/top-up"
              payload: { top_up_quantity: 5 }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "LOG_INDEX", quantity: 3 }
              as: IngestionAgent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          assert:
            - "Commitment.${commit_id}.consumed_quantity == 13"
            - "Commitment.${commit_id}.committed_quantity == 15"
            - "Commitment.${commit_id}.expired_quantity == 2"
            - "consumed (13) + expired (2) == committed (15); the invariant holds through top-up and period-close"
