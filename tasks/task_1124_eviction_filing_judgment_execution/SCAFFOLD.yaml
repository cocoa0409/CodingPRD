scenario: "1124. Eviction Filing & Judgment Execution (landlord side): notice type selection & statutory cure period, filing package preparation & court fee, service of process & hearing calendar, tenant answer/defense & mediation referral, judgment for possession & money damages, writ issuance & sheriff lockout scheduling, personal property storage obligations, post-judgment collection & rental history reporting"

domain_name: eviction-judgment-execution
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Landlord legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: RentalUnit
    parent: null
    common_fields: true
    fields:
      - { name: landlord_id, type: string, source: input, description: "FK -> Landlord.id; owning landlord" }
      - { name: jurisdiction_code, type: enum, source: input, description: "Statute profile; constraints: CA | TX | OH" }
      - { name: street_address, type: string, source: input, description: "Street address" }
      - { name: unit_label, type: string, source: input, description: "Unit designator, e.g. '4B'" }
      - { name: status, type: enum, source: computed, description: "VACANT | OCCUPIED; VACANT at creation, OCCUPIED while a Tenancy is ACTIVE, back to VACANT when tenancy ENDS via lockout execution cascade", default: VACANT }

  - name: Tenancy
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> RentalUnit.id; rented unit" }
      - { name: tenant_full_name, type: string, source: input, description: "Tenant legal name (landlord-side system; tenant is not an API role)" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Monthly rent in cents; constraints: > 0" }
      - { name: lease_start_date, type: string, source: input, description: "Lease start, YYYY-MM-DD" }
      - { name: lease_end_date, type: string, source: input, description: "Lease end, YYYY-MM-DD; optional (month-to-month)", default: null }
      - { name: status, type: enum, source: computed, description: "ACTIVE | ENDED; ACTIVE at creation, ENDED only via lockout-execution cascade", default: ACTIVE }
      - { name: ended_at, type: datetime, source: system, description: "Set when tenancy ENDED", default: null }

  - name: EvictionCase
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id; tenancy being evicted" }
      - { name: landlord_id, type: string, source: computed, description: "Denormalized from Tenancy.unit_id -> RentalUnit.landlord_id at creation; immutable" }
      - { name: case_reason, type: enum, source: input, description: "NONPAYMENT | LEASE_VIOLATION | SEVERE" }
      - { name: status, type: enum, source: computed, description: "DRAFT | NOTICE_ACTIVE | NOTICE_EXPIRED | FILING_REJECTED | FILED | SERVICE_COMPLETE | HEARING_SCHEDULED | ANSWERED | MEDIATION_PENDING | HEARING_CONCLUDED | JUDGMENT_ENTERED | WRIT_ISSUED | LOCKOUT_SCHEDULED | EXECUTED | SETTLED | DISMISSED | CURED", default: DRAFT }
      - { name: case_number, type: string, source: system, description: "Server-minted EV-<year>-<zero-padded seq>" }
      - { name: served_defendant_names, type: array, source: system, description: "Distinct defendant names with a SERVED ServiceAttempt; drives SERVICE_COMPLETE" }
      - { name: service_completed_at, type: datetime, source: system, description: "When the last named defendant was served", default: null }
      - { name: dismiss_reason, type: string, source: input, description: "Optional reason recorded on voluntary dismissal", default: null }

  - name: Notice
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> EvictionCase.id" }
      - { name: notice_type, type: enum, source: input, description: "PAY_OR_QUIT | CURE_OR_QUIT | UNCONDITIONAL_QUIT" }
      - { name: served_on, type: string, source: input, description: "Date notice was served on tenant, YYYY-MM-DD; must not be in the future" }
      - { name: claimed_rent_owed_cents, type: integer, source: input, description: "Required iff notice_type == PAY_OR_QUIT; constraints: > 0", default: null }
      - { name: violation_description, type: string, source: input, description: "Required iff notice_type == CURE_OR_QUIT", default: null }
      - { name: statutory_cure_days, type: integer, source: computed, description: "From notice_type x jurisdiction table (see calculations.notice_cure_schedule)" }
      - { name: cure_deadline, type: datetime, source: computed, description: "served_on + statutory_cure_days, at 23:59:59Z of that date" }
      - { name: status, type: enum, source: computed, description: "PENDING | CURED | EXPIRED | SUPERSEDED", default: PENDING }
      - { name: cured_at, type: datetime, source: system, description: "When a full cure was recorded", default: null }

  - name: FilingPackage
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> EvictionCase.id" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Total amount claimed in the complaint; constraints: > 0" }
      - { name: defendant_names, type: array, source: input, description: "Named defendants; constraints: 1..5 unique non-empty names" }
      - { name: jury_demanded, type: boolean, source: input, description: "Whether jury trial is demanded" }
      - { name: efiled, type: boolean, source: input, description: "true = ELECTRONIC fee variant, false = STANDARD (paper) variant" }
      - { name: filing_fee_cents, type: integer, source: computed, description: "Computed at creation by calculations.filing_fee; immutable thereafter" }
      - { name: fee_paid_cents, type: integer, source: system, description: "Accumulated fee payments", default: 0 }
      - { name: fee_status, type: enum, source: computed, description: "UNPAID | PARTIAL | PAID", default: UNPAID }
      - { name: status, type: enum, source: computed, description: "DRAFT | ACCEPTED | REJECTED", default: DRAFT }
      - { name: accepted_by_clerk_id, type: string, source: system, description: "X-User-ID of accepting CourtClerk; feeds segregation-of-duties check on judgment entry", default: null }
      - { name: accepted_at, type: datetime, source: system, description: "Acceptance timestamp; FILING rental-history report window anchors here", default: null }
      - { name: rejection_reason, type: string, source: input, description: "Recorded when clerk rejects", default: null }

  - name: ServiceAttempt
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> EvictionCase.id" }
      - { name: defendant_name, type: string, source: input, description: "Must be one of the ACCEPTED FilingPackage.defendant_names" }
      - { name: method, type: enum, source: input, description: "PERSONAL | SUBSTITUTED | POST_AND_MAIL" }
      - { name: result, type: enum, source: input, description: "SERVED | FAILED" }
      - { name: served_at, type: datetime, source: input, description: "When the attempt occurred; must not be in the future" }
      - { name: server_user_id, type: string, source: system, description: "X-User-ID header of recorder; must differ from case landlord (segregation of duties)" }
      - { name: server_role, type: string, source: system, description: "X-User-Role header of recorder" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> EvictionCase.id" }
      - { name: courtroom, type: string, source: input, description: "Courtroom identifier; half-open-interval overlap is enforced per courtroom" }
      - { name: start_at, type: datetime, source: input, description: "Hearing start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Hearing end (UTC); must be > start_at" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | CONTINUED | STAYED | CANCELLED | HELD", default: SCHEDULED }
      - { name: clerk_user_id, type: string, source: system, description: "Scheduling clerk" }

  - name: TenantAnswer
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> EvictionCase.id" }
      - { name: defense_codes, type: array, source: input, description: "Enum members: PAYMENT_TENDERED | HABITABILITY | RETALIATION | PROCEDURAL; at least 1" }
      - { name: mediation_requested, type: boolean, source: input, description: "Whether tenant requested mediation" }
      - { name: status, type: enum, source: computed, description: "FILED | REFERRED | RETURNED | RESOLVED", default: FILED }
      - { name: filed_by_clerk_id, type: string, source: system, description: "Recording clerk" }

  - name: MediationReferral
    parent: null
    common_fields: true
    fields:
      - { name: answer_id, type: string, source: input, description: "FK -> TenantAnswer.id" }
      - { name: mediator_id, type: string, source: input, description: "Opaque mediator identifier" }
      - { name: session_date, type: string, source: input, description: "Mediation session date, YYYY-MM-DD" }
      - { name: status, type: enum, source: computed, description: "PENDING | SETTLED | FAILED", default: PENDING }
      - { name: outcome_notes, type: string, source: input, description: "Recorded with outcome", default: null }
      - { name: outcome_recorded_at, type: datetime, source: system, description: "When outcome was recorded", default: null }

  - name: Judgment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> EvictionCase.id; at most one Judgment per case" }
      - { name: possession_granted, type: boolean, source: input, description: "Whether possession is awarded to landlord" }
      - { name: rent_awarded_cents, type: integer, source: input, description: "Rent awarded; constraints: >= 0" }
      - { name: damages_cents, type: integer, source: input, description: "Damages awarded; constraints: >= 0" }
      - { name: late_fee_cents, type: integer, source: input, description: "Late fees awarded; constraints: >= 0" }
      - { name: court_costs_cents, type: integer, source: input, description: "Court costs awarded; constraints: >= 0" }
      - { name: oldest_unpaid_due_date, type: string, source: input, description: "Oldest unpaid rent due date YYYY-MM-DD; prejudgment interest anchor" }
      - { name: interest_cents, type: integer, source: computed, description: "Prejudgment interest per calculations.judgment_money (per-diem rounding, then multiply)" }
      - { name: total_awarded_cents, type: integer, source: computed, description: "rent + damages + late_fee + court_costs + interest, summed in that order (integer cents)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "total_awarded_cents - sum(PAYMENT) + sum(REVERSAL) - sum(WRITE_OFF) over non-reversed CollectionEntry rows; starts at total_awarded_cents" }
      - { name: status, type: enum, source: computed, description: "ENTERED | FINAL | SATISFIED", default: ENTERED }
      - { name: entered_by_clerk_id, type: string, source: system, description: "Clerk who entered judgment; must differ from FilingPackage.accepted_by_clerk_id" }
      - { name: entered_at, type: datetime, source: system, description: "Entry timestamp; JUDGMENT report window anchors here" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "entered_at + appeal_days(jurisdiction); writs require FINAL (ops-run flips at now >= appeal_deadline)" }
      - { name: satisfied_at, type: datetime, source: system, description: "When outstanding first reached 0; SATISFACTION report window anchors here", default: null }

  - name: Writ
    parent: null
    common_fields: true
    fields:
      - { name: judgment_id, type: string, source: input, description: "FK -> Judgment.id" }
      - { name: case_id, type: string, source: computed, description: "Denormalized from Judgment.case_id at creation; immutable" }
      - { name: unit_id, type: string, source: computed, description: "Denormalized via Judgment.case_id -> EvictionCase.tenancy_id -> Tenancy.unit_id at creation; identifies the premises being executed on" }
      - { name: status, type: enum, source: computed, description: "REQUESTED | ISSUED | SCHEDULED | EXECUTED | EXPIRED", default: REQUESTED }
      - { name: writ_fee_paid_cents, type: integer, source: input, description: "Must equal writ fee for the unit's jurisdiction (calculations.writ_fee)" }
      - { name: issued_at, type: datetime, source: system, description: "When clerk issued the writ", default: null }
      - { name: expires_on, type: datetime, source: computed, description: "issued_at + writ_valid_days(jurisdiction)", default: null }
      - { name: deputy_id, type: string, source: input, description: "Sheriff deputy assigned at lockout scheduling", default: null }
      - { name: window_start, type: datetime, source: input, description: "Lockout window start (UTC)", default: null }
      - { name: window_end, type: datetime, source: input, description: "Lockout window end (UTC)", default: null }
      - { name: executed_at, type: datetime, source: system, description: "Lockout execution timestamp", default: null }

  - name: PropertyStorageRecord
    parent: null
    common_fields: true
    fields:
      - { name: writ_id, type: string, source: computed, description: "FK -> Writ.id; created as a side effect of writ execution" }
      - { name: case_id, type: string, source: computed, description: "Denormalized from Writ.case_id at creation" }
      - { name: items_summary, type: string, source: input, description: "Description of stored personal property (from execute payload)" }
      - { name: status, type: enum, source: computed, description: "STORED | DISPOSABLE | RECLAIMED | DISPOSED", default: STORED }
      - { name: stored_at, type: datetime, source: system, description: "Execution timestamp" }
      - { name: daily_fee_cents, type: integer, source: computed, description: "Storage daily fee by jurisdiction: CA 1500, TX 1000, OH 800" }
      - { name: billing_mode, type: enum, source: computed, description: "CALENDAR_INCLUSIVE (CA) | ELAPSED_24H (TX, OH); selects calculations.storage_charge variant" }
      - { name: disposal_eligible_on, type: datetime, source: computed, description: "stored_at + storage_days(jurisdiction): CA 15, TX 14, OH 30" }
      - { name: accrued_charge_cents, type: integer, source: computed, description: "Charge if reclaimed at current logical clock; per calculations.storage_charge; 0 once RECLAIMED/DISPOSED" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Charge locked in at reclaim", default: null }

  - name: CollectionEntry
    parent: null
    common_fields: false
    fields:
      - { name: judgment_id, type: string, source: input, description: "FK -> Judgment.id" }
      - { name: entry_type, type: enum, source: input, description: "PAYMENT | REVERSAL | WRITE_OFF" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount; REVERSAL must equal the target PAYMENT amount; constraints: > 0" }
      - { name: reversal_of_id, type: string, source: input, description: "FK -> CollectionEntry.id; required iff entry_type == REVERSAL, must reference a PAYMENT on the same judgment not already reversed", default: null }
      - { name: allocation, type: object, source: computed, description: "Waterfall breakdown {court_costs, late_fees, damages, interest, rent} per calculations.collection_waterfall; zero-filled for REVERSAL/WRITE_OFF" }
      - { name: resulting_outstanding_cents, type: integer, source: computed, description: "Judgment outstanding immediately after this entry" }
      - { name: reversed_by_id, type: string, source: system, description: "Set on a PAYMENT entry when a REVERSAL targets it", default: null }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of recorder" }

  - name: RentalHistoryReport
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id" }
      - { name: landlord_id, type: string, source: computed, description: "Denormalized from Tenancy.unit_id -> RentalUnit.landlord_id at creation" }
      - { name: report_type, type: enum, source: input, description: "FILING | JUDGMENT | SATISFACTION | CORRECTION" }
      - { name: reference_report_id, type: string, source: input, description: "FK -> RentalHistoryReport.id; required iff report_type == CORRECTION; must belong to same tenancy and not already be superseded", default: null }
      - { name: event_at, type: datetime, source: computed, description: "Anchor event timestamp: FILING -> accepted_at of first ACCEPTED package; JUDGMENT -> judgment.entered_at; SATISFACTION -> judgment.satisfied_at; CORRECTION -> referenced report's event_at" }
      - { name: superseded, type: boolean, source: computed, description: "true once a CORRECTION report references this report", default: false }
      - { name: bureau_reference, type: string, source: system, description: "Server-minted bureau filing reference RHR-<seq>" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EvictionCase
    initial_state: DRAFT
    terminal_states: [EXECUTED, SETTLED, DISMISSED, CURED]
    transitions:
      - from: DRAFT
        to: NOTICE_ACTIVE
        trigger: "POST /api/cases/{id}/notices"
        actor: Landlord
        preconditions: ["case.status == DRAFT", "expected_case_version matches case.version (OCC)"]
        side_effects: ["Notice created PENDING", "case.version increments by 1"]
      - from: NOTICE_ACTIVE
        to: NOTICE_ACTIVE
        trigger: "POST /api/cases/{id}/notices (supersede)"
        actor: Landlord
        preconditions: ["case.status == NOTICE_ACTIVE", "expected_case_version matches case.version (OCC)"]
        side_effects: ["existing PENDING Notice -> SUPERSEDED", "new Notice created PENDING", "case.version increments by 1"]
      - from: NOTICE_ACTIVE
        to: CURED
        trigger: "POST /api/notices/{id}/record-cure (success)"
        actor: Landlord
        preconditions: ["notice.status == PENDING", "now <= notice.cure_deadline", "cure consideration sufficient (see validations)"]
        side_effects: ["Notice -> CURED, cured_at = now"]
      - from: NOTICE_ACTIVE
        to: NOTICE_EXPIRED
        trigger: "POST /api/ops/runs (system sweep)"
        actor: system
        preconditions: ["linked PENDING notice has now > cure_deadline"]
        side_effects: ["Notice -> EXPIRED"]
      - from: [NOTICE_ACTIVE, NOTICE_EXPIRED, FILING_REJECTED, FILED, SERVICE_COMPLETE, HEARING_SCHEDULED, ANSWERED, HEARING_CONCLUDED, DRAFT]
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: Landlord
        preconditions: ["case.status not in {JUDGMENT_ENTERED, WRIT_ISSUED, LOCKOUT_SCHEDULED, EXECUTED, SETTLED, DISMISSED, CURED}"]
        side_effects: ["dismiss_reason recorded"]
      - from: NOTICE_EXPIRED
        to: FILED
        trigger: "POST /api/filing-packages/{id}/review with decision=ACCEPT"
        actor: CourtClerk
        preconditions: ["package.status == DRAFT", "package.fee_status == PAID"]
        side_effects: ["package -> ACCEPTED, accepted_by_clerk_id, accepted_at set"]
      - from: NOTICE_EXPIRED
        to: FILING_REJECTED
        trigger: "POST /api/filing-packages/{id}/review with decision=REJECT"
        actor: CourtClerk
        preconditions: ["package.status == DRAFT", "package.fee_status == PAID"]
        side_effects: ["package -> REJECTED, rejection_reason stored"]
      - from: FILING_REJECTED
        to: FILED
        trigger: "POST /api/filing-packages/{id}/review with decision=ACCEPT (on a new package)"
        actor: CourtClerk
        preconditions: ["package.status == DRAFT", "package.fee_status == PAID"]
        side_effects: ["package -> ACCEPTED, accepted_by_clerk_id, accepted_at set"]
      - from: FILING_REJECTED
        to: FILING_REJECTED
        trigger: "POST /api/filing-packages/{id}/review with decision=REJECT (on a new package)"
        actor: CourtClerk
        preconditions: ["package.status == DRAFT", "package.fee_status == PAID"]
        side_effects: ["package -> REJECTED; case remains FILING_REJECTED (refile cycle)"]
      - from: FILED
        to: SERVICE_COMPLETE
        trigger: "POST /api/cases/{id}/service-attempts with result=SERVED completing the defendant set"
        actor: ProcessServer
        preconditions: ["case.status == FILED", "defendant_name in ACCEPTED package.defendant_names", "after this attempt, every name in defendant_names has a SERVED attempt"]
        side_effects: ["defendant appended to case.served_defendant_names", "case.service_completed_at = served_at of completing attempt"]
        note: "A SERVED attempt that does NOT complete the set leaves the case in FILED; FAILED attempts never add names."
      - from: SERVICE_COMPLETE
        to: HEARING_SCHEDULED
        trigger: "POST /api/cases/{id}/hearings"
        actor: CourtClerk
        preconditions: ["case.status in {SERVICE_COMPLETE, HEARING_SCHEDULED}", "no other SCHEDULED hearing exists for the case", "start_at >= service_completed_at + hearing_lead_days(jurisdiction) (date granularity)", "courtroom half-open interval [start_at, end_at) does not overlap any SCHEDULED hearing in the same courtroom"]
        side_effects: ["Hearing created SCHEDULED"]
      - from: HEARING_SCHEDULED
        to: HEARING_SCHEDULED
        trigger: "POST /api/hearings/{id}/continuance (replacement hearing) or POST /api/cases/{id}/hearings after prior hearing CANCELLED"
        actor: CourtClerk
        preconditions: ["per hearing-creation validations"]
        side_effects: ["prior hearing -> CONTINUED (continuance) or stays CANCELLED", "new Hearing SCHEDULED; case remains HEARING_SCHEDULED"]
      - from: HEARING_SCHEDULED
        to: ANSWERED
        trigger: "POST /api/cases/{id}/answers"
        actor: CourtClerk
        preconditions: ["case.status == HEARING_SCHEDULED"]
        side_effects: ["TenantAnswer created FILED"]
      - from: ANSWERED
        to: MEDIATION_PENDING
        trigger: "POST /api/answers/{id}/mediation-referrals"
        actor: CourtClerk
        preconditions: ["answer.status == FILED", "answer.mediation_requested == true"]
        side_effects: ["MediationReferral created PENDING", "answer -> REFERRED", "the case's SCHEDULED hearing (if any) -> STAYED"]
      - from: MEDIATION_PENDING
        to: HEARING_SCHEDULED
        trigger: "POST /api/referrals/{id}/outcome with outcome=FAILED"
        actor: Mediator
        preconditions: ["referral.status == PENDING"]
        side_effects: ["referral -> FAILED", "answer -> RETURNED", "the case's STAYED hearing (if any) -> CANCELLED"]
        note: "cycle: HEARING_SCHEDULED -> ANSWERED -> MEDIATION_PENDING -> HEARING_SCHEDULED"
      - from: MEDIATION_PENDING
        to: SETTLED
        trigger: "POST /api/referrals/{id}/outcome with outcome=SETTLED"
        actor: Mediator
        preconditions: ["referral.status == PENDING"]
        side_effects: ["referral -> SETTLED", "answer -> RESOLVED", "cascade: this case transition itself moves the case's STAYED/SCHEDULED hearing -> CANCELLED"]
      - from: HEARING_SCHEDULED
        to: HEARING_CONCLUDED
        trigger: "POST /api/hearings/{id}/conclude"
        actor: CourtClerk
        preconditions: ["hearing.status == SCHEDULED", "case.status in {HEARING_SCHEDULED, ANSWERED}"]
        side_effects: ["hearing -> HELD"]
      - from: ANSWERED
        to: HEARING_CONCLUDED
        trigger: "POST /api/hearings/{id}/conclude"
        actor: CourtClerk
        preconditions: ["hearing.status == SCHEDULED", "case.status in {HEARING_SCHEDULED, ANSWERED}"]
        side_effects: ["hearing -> HELD"]
      - from: HEARING_CONCLUDED
        to: JUDGMENT_ENTERED
        trigger: "POST /api/cases/{id}/judgment"
        actor: CourtClerk
        preconditions: ["no Judgment exists for the case", "entering clerk != accepted_by_clerk_id of the ACCEPTED package (segregation of duties)"]
        side_effects: ["Judgment created ENTERED with computed interest/total/outstanding/appeal_deadline"]
      - from: JUDGMENT_ENTERED
        to: WRIT_ISSUED
        trigger: "POST /api/writs/{id}/issue"
        actor: CourtClerk
        preconditions: ["writ.status == REQUESTED", "judgment.status == FINAL"]
        side_effects: ["writ -> ISSUED, issued_at, expires_on computed"]
      - from: WRIT_ISSUED
        to: LOCKOUT_SCHEDULED
        trigger: "POST /api/writs/{id}/schedule-lockout"
        actor: SheriffDeputy
        preconditions: ["writ.status == ISSUED", "window valid and conflict-free (see validations)"]
        side_effects: ["writ -> SCHEDULED with deputy_id, window_start, window_end"]
      - from: LOCKOUT_SCHEDULED
        to: WRIT_ISSUED
        trigger: "POST /api/writs/{id}/cancel-lockout or ops-run window lapse"
        actor: SheriffDeputy
        preconditions: ["writ.status == SCHEDULED (cancel) or now > window_end without execution (ops)"]
        side_effects: ["writ -> ISSUED, deputy_id/window cleared; deputy day-slot freed"]
        note: "cycle: WRIT_ISSUED -> LOCKOUT_SCHEDULED -> WRIT_ISSUED"
      - from: LOCKOUT_SCHEDULED
        to: EXECUTED
        trigger: "POST /api/writs/{id}/execute"
        actor: SheriffDeputy
        preconditions: ["writ.status == SCHEDULED", "window_start <= now <= window_end", "now <= writ.expires_on"]
        side_effects:
          - "writ -> EXECUTED, executed_at = now"
          - "PropertyStorageRecord created STORED (stored_at = now, jurisdiction fees/deadline computed)"
          - "cascade link 1: EvictionCase LOCKOUT_SCHEDULED -> EXECUTED"

  - entity: Tenancy
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "system cascade: owning EvictionCase reaches EXECUTED"
        actor: system
        preconditions: ["case.status becomes EXECUTED", "tenancy_id == case.tenancy_id"]
        side_effects: ["ended_at = now", "cascade link 2: this Tenancy transition itself moves RentalUnit OCCUPIED -> VACANT"]

  - entity: RentalUnit
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: OCCUPIED
        trigger: "POST /api/tenancies"
        actor: Landlord
        preconditions: ["no other ACTIVE tenancy exists for the unit"]
        side_effects: []
      - from: OCCUPIED
        to: VACANT
        trigger: "system cascade: unit's ACTIVE tenancy reaches ENDED"
        actor: system
        preconditions: ["tenancy.unit_id == unit.id"]
        side_effects: []
        note: "cascade link 3 of lockout execution: execute -> case EXECUTED -> tenancy ENDED -> unit VACANT"

  - entity: Notice
    initial_state: PENDING
    terminal_states: [CURED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: CURED
        trigger: "POST /api/notices/{id}/record-cure"
        actor: Landlord
        preconditions: ["notice.status == PENDING", "now <= cure_deadline", "PAY_OR_QUIT: paid_amount_cents >= claimed_rent_owed_cents", "CURE_OR_QUIT: violation_cured == true", "UNCONDITIONAL_QUIT: never curable"]
        side_effects: ["cured_at = now", "EvictionCase NOTICE_ACTIVE -> CURED"]
      - from: PENDING
        to: EXPIRED
        trigger: "POST /api/ops/runs (system sweep)"
        actor: system
        preconditions: ["now > cure_deadline"]
        side_effects: ["EvictionCase NOTICE_ACTIVE -> NOTICE_EXPIRED"]
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /api/cases/{id}/notices (replacement notice)"
        actor: Landlord
        preconditions: ["case.status == NOTICE_ACTIVE", "OCC expected_case_version matches"]
        side_effects: []

  - entity: FilingPackage
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /api/filing-packages/{id}/review decision=ACCEPT"
        actor: CourtClerk
        preconditions: ["package.status == DRAFT", "fee_status == PAID", "case.status in {NOTICE_EXPIRED, FILING_REJECTED}"]
        side_effects: ["accepted_by_clerk_id / accepted_at set", "case -> FILED"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /api/filing-packages/{id}/review decision=REJECT"
        actor: CourtClerk
        preconditions: ["package.status == DRAFT", "fee_status == PAID"]
        side_effects: ["rejection_reason stored", "case -> FILING_REJECTED"]

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [CONTINUED, CANCELLED, HELD]
    transitions:
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /api/hearings/{id}/continuance"
        actor: CourtClerk
        preconditions: ["hearing.status == SCHEDULED", "replacement window valid (same lead/overlap rules)"]
        side_effects: ["replacement Hearing created SCHEDULED for the same case"]
      - from: SCHEDULED
        to: STAYED
        trigger: "system: mediation referral created for the case"
        actor: system
        preconditions: ["case ANSWERED -> MEDIATION_PENDING"]
        side_effects: []
      - from: SCHEDULED
        to: HELD
        trigger: "POST /api/hearings/{id}/conclude"
        actor: CourtClerk
        preconditions: ["hearing.status == SCHEDULED"]
        side_effects: ["case -> HEARING_CONCLUDED"]
      - from: STAYED
        to: CANCELLED
        trigger: "system: mediation outcome recorded (SETTLED or FAILED)"
        actor: system
        preconditions: ["referral outcome recorded for the case"]
        side_effects: []

  - entity: TenantAnswer
    initial_state: FILED
    terminal_states: [RESOLVED, RETURNED]
    transitions:
      - from: FILED
        to: REFERRED
        trigger: "POST /api/answers/{id}/mediation-referrals"
        actor: CourtClerk
        preconditions: ["answer.status == FILED", "mediation_requested == true"]
        side_effects: ["case -> MEDIATION_PENDING", "case's SCHEDULED hearing -> STAYED"]
      - from: REFERRED
        to: RETURNED
        trigger: "POST /api/referrals/{id}/outcome outcome=FAILED"
        actor: Mediator
        preconditions: ["referral.status == PENDING"]
        side_effects: ["case -> HEARING_SCHEDULED"]
      - from: REFERRED
        to: RESOLVED
        trigger: "POST /api/referrals/{id}/outcome outcome=SETTLED"
        actor: Mediator
        preconditions: ["referral.status == PENDING"]
        side_effects: ["case -> SETTLED"]

  - entity: MediationReferral
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /api/referrals/{id}/outcome outcome=SETTLED"
        actor: Mediator
        preconditions: ["referral.status == PENDING", "recording mediator's X-User-ID == referral.mediator_id"]
        side_effects: ["answer -> RESOLVED", "case MEDIATION_PENDING -> SETTLED", "case's STAYED hearing -> CANCELLED"]
      - from: PENDING
        to: FAILED
        trigger: "POST /api/referrals/{id}/outcome outcome=FAILED"
        actor: Mediator
        preconditions: ["referral.status == PENDING", "recording mediator's X-User-ID == referral.mediator_id"]
        side_effects: ["answer -> RETURNED", "case MEDIATION_PENDING -> HEARING_SCHEDULED", "case's STAYED hearing -> CANCELLED"]

  - entity: Judgment
    initial_state: ENTERED
    terminal_states: [SATISFIED]
    transitions:
      - from: ENTERED
        to: FINAL
        trigger: "POST /api/ops/runs (system sweep)"
        actor: system
        preconditions: ["now >= appeal_deadline"]
        side_effects: []
      - from: ENTERED
        to: SATISFIED
        trigger: "POST /api/judgments/{id}/collection-entries driving outstanding_balance_cents to 0"
        actor: system
        preconditions: ["resulting outstanding_balance_cents == 0"]
        side_effects: ["satisfied_at = now"]
      - from: FINAL
        to: SATISFIED
        trigger: "POST /api/judgments/{id}/collection-entries driving outstanding_balance_cents to 0"
        actor: system
        preconditions: ["resulting outstanding_balance_cents == 0"]
        side_effects: ["satisfied_at = now"]

  - entity: Writ
    initial_state: REQUESTED
    terminal_states: [EXECUTED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /api/writs/{id}/issue"
        actor: CourtClerk
        preconditions: ["writ.status == REQUESTED", "judgment.status == FINAL"]
        side_effects: ["issued_at = now", "expires_on = issued_at + writ_valid_days", "case JUDGMENT_ENTERED -> WRIT_ISSUED"]
      - from: ISSUED
        to: SCHEDULED
        trigger: "POST /api/writs/{id}/schedule-lockout"
        actor: SheriffDeputy
        preconditions: ["writ.status == ISSUED", "window_start >= now", "window_end > window_start", "window_end <= expires_on", "fewer than 3 SCHEDULED writs for deputy_id on the calendar date of window_start"]
        side_effects: ["case WRIT_ISSUED -> LOCKOUT_SCHEDULED"]
      - from: SCHEDULED
        to: ISSUED
        trigger: "POST /api/writs/{id}/cancel-lockout, or ops-run when now > window_end"
        actor: SheriffDeputy
        preconditions: ["writ.status == SCHEDULED"]
        side_effects: ["deputy_id/window_start/window_end cleared", "case LOCKOUT_SCHEDULED -> WRIT_ISSUED"]
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /api/writs/{id}/execute"
        actor: SheriffDeputy
        preconditions: ["writ.status == SCHEDULED", "window_start <= now <= window_end", "now <= expires_on", "recording deputy's X-User-ID == writ.deputy_id"]
        side_effects: ["executed_at = now", "PropertyStorageRecord created STORED", "case LOCKOUT_SCHEDULED -> EXECUTED", "cascade: tenancy -> ENDED", "cascade: unit -> VACANT"]
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /api/ops/runs (system sweep)"
        actor: system
        preconditions: ["now > expires_on"]
        side_effects: ["case WRIT_ISSUED -> JUDGMENT_ENTERED"]

  - entity: PropertyStorageRecord
    initial_state: STORED
    terminal_states: [RECLAIMED, DISPOSED]
    transitions:
      - from: STORED
        to: DISPOSABLE
        trigger: "POST /api/ops/runs (system sweep)"
        actor: system
        preconditions: ["now > disposal_eligible_on"]
        side_effects: []
      - from: STORED
        to: RECLAIMED
        trigger: "POST /api/storage-records/{id}/reclaim"
        actor: SheriffDeputy
        preconditions: ["record.status in {STORED, DISPOSABLE}", "charge_paid_cents == accrued_charge_cents at current clock"]
        side_effects: ["final_charge_cents locked", "accrued_charge_cents frozen to final_charge_cents"]
      - from: DISPOSABLE
        to: RECLAIMED
        trigger: "POST /api/storage-records/{id}/reclaim"
        actor: SheriffDeputy
        preconditions: ["charge_paid_cents == accrued_charge_cents at current clock"]
        side_effects: ["final_charge_cents locked"]
      - from: DISPOSABLE
        to: DISPOSED
        trigger: "POST /api/storage-records/{id}/dispose"
        actor: SheriffDeputy
        preconditions: ["record.status == DISPOSABLE (statutory storage period elapsed; disposal before eligibility is a compliance violation)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: notice-supersede-stale-case
    parent_entity: EvictionCase
    write_endpoint: "POST /api/cases/{id}/notices"
    occ_field: expected_case_version
    description: |
      Creating a Notice against an EvictionCase whose version has advanced since
      the client last observed it is rejected. This covers the case where another
      writer has just created a notice (legitimately superseding the prior one and
      bumping the case version) and the current writer's view of the case is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: notice_cure_schedule
    trigger: "Notice creation (POST /api/cases/{id}/notices)"
    algorithm: threshold
    formula: |
      statutory_cure_days = CURE_DAYS[jurisdiction_code][notice_type]
      cure_deadline = date(served_on) + statutory_cure_days days, at 23:59:59Z
      expiry (ops run): notice expires iff now > cure_deadline  (strictly greater;
      at now == cure_deadline the notice is still curable)
    input_set: "The new Notice's notice_type and served_on, and the unit's jurisdiction_code (via case -> tenancy -> unit)"
    constants:
      CURE_DAYS: { CA: { PAY_OR_QUIT: 3, CURE_OR_QUIT: 3, UNCONDITIONAL_QUIT: 0 },
                   TX: { PAY_OR_QUIT: 3, CURE_OR_QUIT: 5, UNCONDITIONAL_QUIT: 0 },
                   OH: { PAY_OR_QUIT: 5, CURE_OR_QUIT: 7, UNCONDITIONAL_QUIT: 0 } }
    precision: "date arithmetic on UTC dates; deadline fixed at 23:59:59Z"

  - name: filing_fee
    trigger: "FilingPackage creation (POST /api/cases/{id}/filing-packages); result frozen on the package"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE[jurisdiction] where:
        CA: claimed_amount_cents <= 250000 -> 24000; <= 1000000 -> 32000; else 43500
        TX: claimed_amount_cents <= 200000 -> 18500; <= 800000 -> 26000; else 35000
        OH: claimed_amount_cents <= 150000 -> 15000; <= 500000 -> 21000; else 30000
      fee = base
            + DEFENDANT_SURCHARGE_CENTS * len(defendant_names)
            + (JURY_FEE_CENTS if jury_demanded else 0)
            + VARIANT_ADJ[efiled ? ELECTRONIC : STANDARD]
      fee = max(0, fee)
      Tier comparison uses <= : a claim exactly at a tier ceiling prices at that tier.
    input_set: "package.claimed_amount_cents, package.defendant_names, package.jury_demanded, package.efiled, unit jurisdiction"
    constants:
      DEFENDANT_SURCHARGE_CENTS: 2500
      JURY_FEE_CENTS: 15000
      VARIANT_ADJ: { STANDARD: 750, ELECTRONIC: -1000 }
    precision: "integer cents; no rounding needed"
    variants:
      - name: STANDARD
        when: "efiled == false (paper filing)"
        difference: "adds a 750-cent counter-service surcharge"
      - name: ELECTRONIC
        when: "efiled == true"
        difference: "subtracts a 1000-cent e-filing discount (floor 0)"

  - name: judgment_money
    trigger: "Judgment entry (POST /api/cases/{id}/judgment)"
    algorithm: tiered_pricing
    formula: |
      principal_cents = rent_awarded_cents + damages_cents
      days_overdue = max(0, date(entered_at) - oldest_unpaid_due_date)   # calendar days
      # ROUNDING ORDER IS PINNED: round the per-diem amount FIRST, then multiply.
      daily_interest_cents = round_half_up(principal_cents * ANNUAL_RATE[jurisdiction] / 365)
      interest_cents = daily_interest_cents * days_overdue
      total_awarded_cents = rent_awarded_cents + damages_cents + late_fee_cents
                            + court_costs_cents + interest_cents   # summed in this order
      outstanding_balance_cents = total_awarded_cents
      appeal_deadline = entered_at + APPEAL_DAYS[jurisdiction] days
      # (rounding principal * rate * days in one shot is the rejected alternative
      #  order and yields different cents; implementations must follow the order above)
    input_set: "judgment input amounts, oldest_unpaid_due_date, logical clock at entry, unit jurisdiction"
    constants:
      ANNUAL_RATE: { CA: 0.10, TX: 0.06, OH: 0.08 }
      APPEAL_DAYS: { CA: 5, TX: 5, OH: 10 }
    precision: "integer cents; round_half_up applied exactly once, at the per-diem step"

  - name: writ_fee
    trigger: "Writ request (POST /api/judgments/{id}/writs)"
    algorithm: threshold
    formula: |
      required_fee = WRIT_FEE[jurisdiction]
      request valid iff writ_fee_paid_cents == required_fee (exact equality)
    input_set: "writ_fee_paid_cents, unit jurisdiction"
    constants:
      WRIT_FEE: { CA: 4000, TX: 3500, OH: 2500 }
    precision: "integer cents"

  - name: storage_charge
    trigger: "read of PropertyStorageRecord.accrued_charge_cents, and reclaim (locks final_charge_cents)"
    algorithm: decay_function
    formula: |
      elapsed_seconds = max(0, now - stored_at)
      if billing_mode == CALENDAR_INCLUSIVE:
          chargeable_days = (date(now) - date(stored_at)).days + 1   # both endpoints inclusive
      else:  # ELAPSED_24H
          chargeable_days = ceil(elapsed_seconds / 86400)
      accrued_charge_cents = chargeable_days * daily_fee_cents
    input_set: "record.stored_at, logical clock, record.daily_fee_cents, record.billing_mode (from jurisdiction)"
    constants:
      DAILY_FEE: { CA: 1500, TX: 1000, OH: 800 }
      BILLING_MODE: { CA: CALENDAR_INCLUSIVE, TX: ELAPSED_24H, OH: ELAPSED_24H }
      STORAGE_DAYS: { CA: 15, TX: 14, OH: 30 }
    precision: "integer cents; day counts are integers"
    variants:
      - name: CALENDAR_INCLUSIVE
        when: "jurisdiction == CA"
        difference: "counts calendar dates touched, inclusive of both stored and current date — partial first and last days each count as full days"
      - name: ELAPSED_24H
        when: "jurisdiction in {TX, OH}"
        difference: "counts elapsed 24-hour periods (ceil); a 23-hour-old record charges 1 day where CALENDAR_INCLUSIVE would charge 2"

  - name: collection_waterfall
    trigger: "POST /api/judgments/{id}/collection-entries"
    algorithm: waterfall_allocation
    formula: |
      Buckets in fixed priority order: court_costs -> late_fees -> damages -> interest -> rent.
      Remaining per bucket starts at the awarded amount and shrinks as PAYMENTs apply.
      PAYMENT(amount): walk buckets in order; applied_i = min(remaining_i, amount_left);
      amount_left -= applied_i. allocation object records the five applied_i values.
      PAYMENT rejected if amount_cents > outstanding_balance_cents (exact payoff allowed).
      REVERSAL(amount, reversal_of_id): must equal target PAYMENT's amount_cents; adds the
      amount back to outstanding (re-crediting the same buckets in REVERSE priority order:
      rent first, ..., court_costs last); marks target reversed_by_id.
      WRITE_OFF(amount): reduces outstanding without touching buckets; rejected if
      amount_cents > outstanding_balance_cents.
      outstanding_balance_cents = total_awarded_cents - sum(PAYMENT) + sum(REVERSAL) - sum(WRITE_OFF)
      When outstanding reaches 0 -> judgment.status = SATISFIED, satisfied_at = now.
    input_set: "all non-reversed CollectionEntry rows of the judgment, processed in created_at ASC order (chronological); ties impossible (one writer per request)"
    constants: {}
    precision: "integer cents"

  - name: service_completion
    trigger: "POST /api/cases/{id}/service-attempts with result=SERVED"
    algorithm: aggregation
    formula: |
      served_set = distinct defendant_name over SERVED attempts for the case (chronological
      accumulation; FAILED attempts add nothing; duplicate SERVED for the same name rejected).
      case transitions FILED -> SERVICE_COMPLETE at the moment served_set covers every name
      in the ACCEPTED package's defendant_names (cardinality equality).
      service_completed_at = served_at of the completing attempt.
    input_set: "SERVED ServiceAttempt rows of the case vs ACCEPTED package defendant_names"
    constants: {}
    precision: "set cardinality comparison"

  - name: deputy_day_capacity
    trigger: "POST /api/writs/{id}/schedule-lockout"
    algorithm: threshold
    formula: |
      day_load(deputy_id, D) = count of Writs with status == SCHEDULED,
        deputy_id == deputy_id, and date(window_start) == D
      scheduling onto date D rejected iff day_load >= MAX_LOCKOUTS_PER_DEPUTY_DAY
      (so the 3rd booking on a day succeeds; the 4th fails).
    input_set: "SCHEDULED writs grouped by (deputy_id, calendar date of window_start)"
    constants:
      MAX_LOCKOUTS_PER_DEPUTY_DAY: 3
    precision: "integer count; calendar dates in UTC"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per endpoint roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-referenced resources exist, validated left-to-right (unit/tenancy/case/notice/package/hearing/answer/referral/judgment/writ/storage/entry/report/landlord)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: auth, check: "Landlord ownership: X-User-ID equals the landlord_id of the aggregate chain (case/notice/package/judgment/tenancy/unit) being mutated", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "Landlord-role write endpoints" }
  - { priority: 4, category: auth, check: "Actor binding: mediation outcome recorder's X-User-ID must equal referral.mediator_id", error_id: ERR_NOT_ASSIGNED_MEDIATOR, http_status: 403, applies_to: "POST /api/referrals/{id}/outcome" }
  - { priority: 4, category: auth, check: "Actor binding: lockout execute/cancel recorder's X-User-ID must equal writ.deputy_id", error_id: ERR_NOT_ASSIGNED_DEPUTY, http_status: 403, applies_to: "POST /api/writs/{id}/execute, POST /api/writs/{id}/cancel-lockout" }
  - { priority: 5, category: business_constraint, check: "Request body shape: required fields present, types correct, enum members valid, conditional requirements met (claimed_rent_owed_cents required iff PAY_OR_QUIT; violation_description required iff CURE_OR_QUIT; reversal_of_id required iff REVERSAL; reference_report_id required iff CORRECTION)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_case_version equals current case.version on notice create/supersede", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/cases/{id}/notices" }
  - { priority: 7, category: state, check: "Target entity in a status that permits the operation (case status gate per transition; notice PENDING; package DRAFT; hearing SCHEDULED; referral PENDING; writ ISSUED/SCHEDULED as applicable; storage STORED/DISPOSABLE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: service-attempt recorder's X-User-ID must not equal the case's landlord_id (a party may not serve process)", error_id: ERR_SOD_PARTY_CANNOT_SERVE, http_status: 403, applies_to: "POST /api/cases/{id}/service-attempts" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: clerk entering judgment must differ from accepted_by_clerk_id of the case's ACCEPTED package", error_id: ERR_SOD_FEE_JUDGMENT, http_status: 409, applies_to: "POST /api/cases/{id}/judgment" }
  - { priority: 10, category: business_safety, check: "Appeal window closed: judgment.status == FINAL before writ request or issue", error_id: ERR_APPEAL_WINDOW_OPEN, http_status: 409, applies_to: "POST /api/judgments/{id}/writs, POST /api/writs/{id}/issue" }
  - { priority: 11, category: business_safety, check: "Judgment must grant possession before a writ may be requested", error_id: ERR_NO_POSSESSION_GRANTED, http_status: 422, applies_to: "POST /api/judgments/{id}/writs" }
  - { priority: 12, category: business_safety, check: "Statutory storage period must have elapsed (record DISPOSABLE) before disposal", error_id: ERR_DISPOSAL_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /api/storage-records/{id}/dispose" }
  - { priority: 13, category: business_constraint, check: "No other non-terminal EvictionCase exists for the same tenancy (non-terminal = not in {EXECUTED, SETTLED, DISMISSED, CURED})", error_id: ERR_CASE_ALREADY_OPEN, http_status: 409, applies_to: "POST /api/cases" }
  - { priority: 14, category: business_constraint, check: "No other ACTIVE tenancy exists for the unit", error_id: ERR_UNIT_OCCUPIED, http_status: 409, applies_to: "POST /api/tenancies" }
  - { priority: 15, category: business_constraint, check: "notice_type compatible with case_reason: PAY_OR_QUIT requires NONPAYMENT; CURE_OR_QUIT requires LEASE_VIOLATION; UNCONDITIONAL_QUIT requires SEVERE", error_id: ERR_NOTICE_TYPE_MISMATCH, http_status: 422, applies_to: "POST /api/cases/{id}/notices" }
  - { priority: 16, category: business_constraint, check: "No other SCHEDULED hearing exists for the case", error_id: ERR_HEARING_ALREADY_SCHEDULED, http_status: 409, applies_to: "POST /api/cases/{id}/hearings, POST /api/hearings/{id}/continuance" }
  - { priority: 17, category: business_constraint, check: "defendant_name must be a member of the ACCEPTED package's defendant_names", error_id: ERR_DEFENDANT_UNKNOWN, http_status: 422, applies_to: "POST /api/cases/{id}/service-attempts" }
  - { priority: 18, category: business_constraint, check: "defendant_name must not already have a SERVED attempt on this case", error_id: ERR_DEFENDANT_ALREADY_SERVED, http_status: 409, applies_to: "POST /api/cases/{id}/service-attempts" }
  - { priority: 19, category: business_constraint, check: "No writ in {REQUESTED, ISSUED, SCHEDULED} already exists for the judgment", error_id: ERR_WRIT_ACTIVE_EXISTS, http_status: 409, applies_to: "POST /api/judgments/{id}/writs" }
  - { priority: 20, category: business_constraint, check: "Deputy day capacity: fewer than 3 SCHEDULED writs for deputy_id on date(window_start)", error_id: ERR_DEPUTY_DAY_CAPACITY, http_status: 409, applies_to: "POST /api/writs/{id}/schedule-lockout" }
  - { priority: 21, category: business_constraint, check: "Judgment uniqueness: no Judgment exists for the case", error_id: ERR_JUDGMENT_EXISTS, http_status: 409, applies_to: "POST /api/cases/{id}/judgment" }
  - { priority: 22, category: business_temporal, check: "served_on / served_at must not be in the future relative to the logical clock", error_id: ERR_DATE_IN_FUTURE, http_status: 422, applies_to: "POST /api/cases/{id}/notices, POST /api/cases/{id}/service-attempts" }
  - { priority: 23, category: business_temporal, check: "Cure window: record-cure requires now <= cure_deadline and notice UNCONDITIONAL_QUIT is never curable", error_id: ERR_CURE_WINDOW_CLOSED, http_status: 409, applies_to: "POST /api/notices/{id}/record-cure" }
  - { priority: 24, category: business_temporal, check: "Hearing window: end_at > start_at", error_id: ERR_HEARING_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/cases/{id}/hearings, POST /api/hearings/{id}/continuance" }
  - { priority: 25, category: business_temporal, check: "Hearing lead time: date(start_at) >= date(service_completed_at) + hearing_lead_days(jurisdiction) — CA 10, TX 8, OH 12", error_id: ERR_HEARING_LEAD_TIME, http_status: 422, applies_to: "POST /api/cases/{id}/hearings, POST /api/hearings/{id}/continuance" }
  - { priority: 26, category: business_temporal, check: "Courtroom overlap: half-open [start_at, end_at) must not intersect any SCHEDULED hearing in the same courtroom; touching endpoints allowed", error_id: ERR_COURTROOM_OVERLAP, http_status: 409, applies_to: "POST /api/cases/{id}/hearings, POST /api/hearings/{id}/continuance" }
  - { priority: 27, category: business_temporal, check: "Lockout window: window_start >= now, window_end > window_start, window_end <= expires_on", error_id: ERR_WRIT_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/writs/{id}/schedule-lockout" }
  - { priority: 28, category: business_temporal, check: "Execution window: window_start <= now <= window_end and now <= expires_on", error_id: ERR_LOCKOUT_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /api/writs/{id}/execute" }
  - { priority: 30, category: business_temporal, check: "Rental-history report window: now <= event_at + 30 days for FILING/JUDGMENT/SATISFACTION reports (CORRECTION exempt)", error_id: ERR_REPORT_WINDOW_LAPSED, http_status: 422, applies_to: "POST /api/tenancies/{id}/rental-history-reports" }
  - { priority: 31, category: business_referential, check: "Report trigger event must exist for the tenancy: FILING requires an ACCEPTED package on a case of this tenancy; JUDGMENT requires a Judgment; SATISFACTION requires judgment.status == SATISFIED", error_id: ERR_REPORT_EVENT_MISSING, http_status: 422, applies_to: "POST /api/tenancies/{id}/rental-history-reports" }
  - { priority: 32, category: business_referential, check: "CORRECTION reference: reference_report_id exists, belongs to same tenancy, is not itself a CORRECTION, and is not already superseded", error_id: ERR_CORRECTION_TARGET_INVALID, http_status: 422, applies_to: "POST /api/tenancies/{id}/rental-history-reports" }
  - { priority: 33, category: business_referential, check: "REVERSAL target: reversal_of_id references a PAYMENT entry on the same judgment that is not already reversed", error_id: ERR_REVERSAL_TARGET_INVALID, http_status: 422, applies_to: "POST /api/judgments/{id}/collection-entries" }
  - { priority: 34, category: business_fiscal, check: "Cure sufficiency: PAY_OR_QUIT cure requires paid_amount_cents >= claimed_rent_owed_cents", error_id: ERR_CURE_AMOUNT_INSUFFICIENT, http_status: 422, applies_to: "POST /api/notices/{id}/record-cure" }
  - { priority: 35, category: business_fiscal, check: "Fee payment must not overpay: fee_paid_cents + amount_cents <= filing_fee_cents", error_id: ERR_FEE_OVERPAYMENT, http_status: 422, applies_to: "POST /api/filing-packages/{id}/fee-payments" }
  - { priority: 36, category: business_fiscal, check: "Review requires fee_status == PAID", error_id: ERR_FEE_UNPAID, http_status: 422, applies_to: "POST /api/filing-packages/{id}/review" }
  - { priority: 37, category: business_fiscal, check: "Writ fee exact: writ_fee_paid_cents == writ fee for jurisdiction", error_id: ERR_WRIT_FEE_MISMATCH, http_status: 422, applies_to: "POST /api/judgments/{id}/writs" }
  - { priority: 38, category: business_fiscal, check: "Reclaim charge exact: charge_paid_cents == accrued_charge_cents at current clock", error_id: ERR_STORAGE_CHARGE_MISMATCH, http_status: 422, applies_to: "POST /api/storage-records/{id}/reclaim" }
  - { priority: 39, category: business_fiscal, check: "PAYMENT/WRITE_OFF amount must not exceed outstanding_balance_cents (exact payoff allowed); REVERSAL amount must equal target payment amount", error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http_status: 422, applies_to: "POST /api/judgments/{id}/collection-entries" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: /api/landlords, description: "Register a landlord", roles: [PlatformAdmin], code: 201, input: [legal_name, contact_email], output: Landlord, side_effects: [] }
  - { method: GET, path: "/api/landlords/{id}", description: "Read a landlord", roles: [PlatformAdmin, Landlord, CourtClerk], code: 200, input: [], output: Landlord, side_effects: [] }
  - { method: GET, path: /api/landlords, description: "List landlords (paginated)", roles: [PlatformAdmin, CourtClerk], code: 200, input: ["limit?", "offset?"], output: "Landlord[]", side_effects: [] }

  - { method: POST, path: /api/units, description: "Create a rental unit for a landlord", roles: [Landlord], code: 201, input: [landlord_id, jurisdiction_code, street_address, unit_label], output: RentalUnit, side_effects: ["unit.status = VACANT"] }
  - { method: GET, path: "/api/units/{id}", description: "Read a unit", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: RentalUnit, side_effects: [] }
  - { method: GET, path: "/api/landlords/{id}/units", description: "List a landlord's units", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "RentalUnit[]", side_effects: [] }

  - { method: POST, path: /api/tenancies, description: "Create a tenancy on a VACANT unit (unit must have no other ACTIVE tenancy); unit -> OCCUPIED", roles: [Landlord], code: 201, input: [unit_id, tenant_full_name, monthly_rent_cents, lease_start_date, "lease_end_date?"], output: Tenancy, side_effects: ["RentalUnit VACANT -> OCCUPIED"] }
  - { method: GET, path: "/api/tenancies/{id}", description: "Read a tenancy", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: Tenancy, side_effects: [] }
  - { method: GET, path: "/api/units/{id}/tenancies", description: "List tenancies of a unit", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Tenancy[]", side_effects: [] }

  - { method: POST, path: /api/cases, description: "Open an eviction case (DRAFT) on an ACTIVE tenancy; landlord_id denormalized from unit", roles: [Landlord], code: 201, input: [tenancy_id, case_reason], output: EvictionCase, side_effects: ["case_number minted"] }
  - { method: GET, path: "/api/cases/{id}", description: "Read a case (includes version for OCC)", roles: [Landlord, CourtClerk, ProcessServer, SheriffDeputy, Mediator, PlatformAdmin], code: 200, input: [], output: EvictionCase, side_effects: [] }
  - { method: GET, path: /api/cases, description: "List cases with filters", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["landlord_id?", "tenancy_id?", "status?", "limit?", "offset?"], output: "EvictionCase[]", side_effects: [] }
  - { method: GET, path: "/api/tenancies/{id}/cases", description: "List cases of a tenancy", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "EvictionCase[]", side_effects: [] }
  - { method: POST, path: "/api/cases/{id}/dismiss", description: "Voluntary dismissal; forbidden once judgment entered", roles: [Landlord], code: 200, input: ["reason?"], output: EvictionCase, side_effects: ["case -> DISMISSED"] }

  - { method: POST, path: "/api/cases/{id}/notices", description: "Create (or supersede) the statutory notice; OCC via expected_case_version; computes statutory_cure_days and cure_deadline; increments case.version by 1", roles: [Landlord], code: 201, input: [notice_type, served_on, expected_case_version, "claimed_rent_owed_cents?", "violation_description?"], output: Notice, side_effects: ["case DRAFT/NOTICE_ACTIVE -> NOTICE_ACTIVE", "prior PENDING notice -> SUPERSEDED", "increments EvictionCase.version by 1"] }
  - { method: GET, path: "/api/notices/{id}", description: "Read a notice", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: [], output: Notice, side_effects: [] }
  - { method: GET, path: "/api/cases/{id}/notices", description: "List notices of a case", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Notice[]", side_effects: [] }
  - { method: POST, path: "/api/notices/{id}/record-cure", description: "Record tenant cure within the cure window; PAY_OR_QUIT requires paid_amount_cents >= claimed; CURE_OR_QUIT requires violation_cured=true", roles: [Landlord], code: 200, input: ["paid_amount_cents?", "violation_cured?"], output: Notice, side_effects: ["notice -> CURED", "case NOTICE_ACTIVE -> CURED"] }

  - { method: POST, path: "/api/cases/{id}/filing-packages", description: "Prepare filing package; computes and freezes filing_fee_cents (jurisdiction tier + defendant surcharge + jury fee + STANDARD/ELECTRONIC variant)", roles: [Landlord], code: 201, input: [claimed_amount_cents, defendant_names, jury_demanded, efiled], output: FilingPackage, side_effects: ["filing_fee_cents computed"] }
  - { method: GET, path: "/api/filing-packages/{id}", description: "Read a filing package", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: [], output: FilingPackage, side_effects: [] }
  - { method: GET, path: "/api/cases/{id}/filing-packages", description: "List packages of a case", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "FilingPackage[]", side_effects: [] }
  - { method: POST, path: "/api/filing-packages/{id}/fee-payments", description: "Record a court-fee payment; overpayment rejected; fee_status recomputed", roles: [Landlord], code: 200, input: [amount_cents], output: FilingPackage, side_effects: ["fee_paid_cents += amount", "fee_status recomputed (UNPAID/PARTIAL/PAID)"] }
  - { method: POST, path: "/api/filing-packages/{id}/review", description: "Clerk review; ACCEPT requires fee PAID and moves case to FILED; REJECT moves case to FILING_REJECTED", roles: [CourtClerk], code: 200, input: [decision, "rejection_reason?"], output: FilingPackage, side_effects: ["package -> ACCEPTED or REJECTED", "case -> FILED or FILING_REJECTED"] }

  - { method: POST, path: "/api/cases/{id}/service-attempts", description: "Record a service-of-process attempt by a non-party; completing all named defendants moves case to SERVICE_COMPLETE", roles: [ProcessServer, SheriffDeputy], code: 201, input: [defendant_name, method, result, served_at], output: ServiceAttempt, side_effects: ["SERVED appends to case.served_defendant_names", "case -> SERVICE_COMPLETE when defendant set complete"] }
  - { method: GET, path: "/api/cases/{id}/service-attempts", description: "List service attempts of a case", roles: [Landlord, CourtClerk, ProcessServer, SheriffDeputy, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "ServiceAttempt[]", side_effects: [] }

  - { method: POST, path: "/api/cases/{id}/hearings", description: "Schedule hearing; enforces service lead time and courtroom half-open overlap", roles: [CourtClerk], code: 201, input: [courtroom, start_at, end_at], output: Hearing, side_effects: ["case -> HEARING_SCHEDULED"] }
  - { method: GET, path: "/api/hearings/{id}", description: "Read a hearing", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: [], output: Hearing, side_effects: [] }
  - { method: GET, path: "/api/cases/{id}/hearings", description: "List hearings of a case", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Hearing[]", side_effects: [] }
  - { method: POST, path: "/api/hearings/{id}/continuance", description: "Continue a SCHEDULED hearing; creates replacement hearing with a new window (same lead/overlap rules)", roles: [CourtClerk], code: 201, input: [courtroom, start_at, end_at, "reason?"], output: Hearing, side_effects: ["original hearing -> CONTINUED", "replacement hearing created SCHEDULED"] }
  - { method: POST, path: "/api/hearings/{id}/conclude", description: "Mark hearing HELD; case -> HEARING_CONCLUDED", roles: [CourtClerk], code: 200, input: ["notes?"], output: Hearing, side_effects: ["hearing -> HELD", "case -> HEARING_CONCLUDED"] }

  - { method: POST, path: "/api/cases/{id}/answers", description: "Record tenant answer/defenses; case -> ANSWERED", roles: [CourtClerk], code: 201, input: [defense_codes, mediation_requested], output: TenantAnswer, side_effects: ["case HEARING_SCHEDULED -> ANSWERED"] }
  - { method: GET, path: "/api/answers/{id}", description: "Read an answer", roles: [Landlord, CourtClerk, Mediator, PlatformAdmin], code: 200, input: [], output: TenantAnswer, side_effects: [] }
  - { method: GET, path: "/api/cases/{id}/answers", description: "List answers of a case", roles: [Landlord, CourtClerk, Mediator, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "TenantAnswer[]", side_effects: [] }

  - { method: POST, path: "/api/answers/{id}/mediation-referrals", description: "Refer an answer (with mediation_requested) to mediation; stays the scheduled hearing", roles: [CourtClerk], code: 201, input: [mediator_id, session_date], output: MediationReferral, side_effects: ["answer -> REFERRED", "case -> MEDIATION_PENDING", "SCHEDULED hearing -> STAYED"] }
  - { method: GET, path: "/api/referrals/{id}", description: "Read a referral", roles: [Landlord, CourtClerk, Mediator, PlatformAdmin], code: 200, input: [], output: MediationReferral, side_effects: [] }
  - { method: GET, path: "/api/answers/{id}/mediation-referrals", description: "List referrals of an answer", roles: [Landlord, CourtClerk, Mediator, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "MediationReferral[]", side_effects: [] }
  - { method: POST, path: "/api/referrals/{id}/outcome", description: "Mediator records SETTLED or FAILED; SETTLED settles case, FAILED loops case back to HEARING_SCHEDULED", roles: [Mediator], code: 200, input: [outcome, "notes?"], output: MediationReferral, side_effects: ["referral -> SETTLED/FAILED", "answer -> RESOLVED/RETURNED", "case -> SETTLED or HEARING_SCHEDULED", "STAYED hearing -> CANCELLED"] }

  - { method: POST, path: "/api/cases/{id}/judgment", description: "Enter judgment (possession + money); computes interest (per-diem rounding), total, outstanding, appeal_deadline; entering clerk must differ from fee-accepting clerk", roles: [CourtClerk], code: 201, input: [possession_granted, rent_awarded_cents, damages_cents, late_fee_cents, court_costs_cents, oldest_unpaid_due_date], output: Judgment, side_effects: ["case -> JUDGMENT_ENTERED"] }
  - { method: GET, path: "/api/judgments/{id}", description: "Read a judgment", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: Judgment, side_effects: [] }
  - { method: GET, path: "/api/cases/{id}/judgment", description: "Read the case's judgment (array of 0 or 1)", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: "Judgment[]", side_effects: [] }

  - { method: POST, path: "/api/judgments/{id}/writs", description: "Request a writ of possession; requires judgment FINAL and possession granted; exact writ fee", roles: [Landlord], code: 201, input: [writ_fee_paid_cents], output: Writ, side_effects: ["writ created REQUESTED; case_id/unit_id denormalized"] }
  - { method: GET, path: "/api/writs/{id}", description: "Read a writ", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: Writ, side_effects: [] }
  - { method: GET, path: "/api/judgments/{id}/writs", description: "List writs of a judgment", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Writ[]", side_effects: [] }
  - { method: POST, path: "/api/writs/{id}/issue", description: "Clerk issues writ; sets issued_at and expires_on; case -> WRIT_ISSUED", roles: [CourtClerk], code: 200, input: [], output: Writ, side_effects: ["writ -> ISSUED", "case -> WRIT_ISSUED"] }
  - { method: POST, path: "/api/writs/{id}/schedule-lockout", description: "Deputy schedules lockout window; enforces window validity and deputy day capacity (max 3 SCHEDULED per deputy per calendar date)", roles: [SheriffDeputy], code: 200, input: [deputy_id, window_start, window_end], output: Writ, side_effects: ["writ -> SCHEDULED", "case -> LOCKOUT_SCHEDULED"] }
  - { method: POST, path: "/api/writs/{id}/cancel-lockout", description: "Cancel a scheduled lockout; writ back to ISSUED, deputy slot freed; case -> WRIT_ISSUED", roles: [SheriffDeputy], code: 200, input: ["reason?"], output: Writ, side_effects: ["writ -> ISSUED, window cleared", "case -> WRIT_ISSUED"] }
  - { method: POST, path: "/api/writs/{id}/execute", description: "Execute lockout inside the window; creates storage record; cascades case -> EXECUTED -> tenancy ENDED -> unit VACANT", roles: [SheriffDeputy], code: 200, input: ["items_summary?"], output: Writ, side_effects: ["writ -> EXECUTED", "PropertyStorageRecord created STORED", "case -> EXECUTED", "tenancy -> ENDED", "unit -> VACANT"] }

  - { method: GET, path: "/api/writs/{id}/storage-records", description: "List storage records created by a writ (0 or 1)", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: "PropertyStorageRecord[]", side_effects: [] }
  - { method: GET, path: "/api/storage-records/{id}", description: "Read a storage record (accrued_charge_cents computed at current clock)", roles: [Landlord, CourtClerk, SheriffDeputy, PlatformAdmin], code: 200, input: [], output: PropertyStorageRecord, side_effects: [] }
  - { method: POST, path: "/api/storage-records/{id}/reclaim", description: "Tenant reclaims property; charge_paid_cents must equal accrued charge at current clock; locks final_charge_cents", roles: [SheriffDeputy], code: 200, input: [charge_paid_cents], output: PropertyStorageRecord, side_effects: ["record -> RECLAIMED"] }
  - { method: POST, path: "/api/storage-records/{id}/dispose", description: "Dispose of unclaimed property; requires DISPOSABLE (statutory period elapsed)", roles: [SheriffDeputy], code: 200, input: [], output: PropertyStorageRecord, side_effects: ["record -> DISPOSED"] }

  - { method: POST, path: "/api/judgments/{id}/collection-entries", description: "Record post-judgment collection entry (PAYMENT waterfall / REVERSAL / WRITE_OFF); recomputes outstanding; may satisfy judgment", roles: [Landlord], code: 201, input: [entry_type, amount_cents, "reversal_of_id?"], output: CollectionEntry, side_effects: ["judgment.outstanding_balance_cents recomputed", "judgment -> SATISFIED when outstanding hits 0"] }
  - { method: GET, path: "/api/judgments/{id}/collection-entries", description: "List collection entries of a judgment", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "CollectionEntry[]", side_effects: [] }
  - { method: GET, path: "/api/collection-entries/{id}", description: "Read a collection entry", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: [], output: CollectionEntry, side_effects: [] }
  - { method: GET, path: "/api/collection-entries/{id}/reversals", description: "List reversal entries targeting this entry", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "CollectionEntry[]", side_effects: [] }

  - { method: POST, path: "/api/tenancies/{id}/rental-history-reports", description: "File a rental-history report (FILING/JUDGMENT/SATISFACTION/CORRECTION); 30-day window from trigger event; CORRECTION supersedes its reference", roles: [Landlord], code: 201, input: [report_type, "reference_report_id?"], output: RentalHistoryReport, side_effects: ["CORRECTION sets reference report superseded = true", "bureau_reference minted"] }
  - { method: GET, path: "/api/rental-history-reports/{id}", description: "Read a report", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: [], output: RentalHistoryReport, side_effects: [] }
  - { method: GET, path: "/api/tenancies/{id}/rental-history-reports", description: "List reports of a tenancy", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "RentalHistoryReport[]", side_effects: [] }
  - { method: GET, path: "/api/rental-history-reports/{id}/corrections", description: "List corrections referencing this report", roles: [Landlord, CourtClerk, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "RentalHistoryReport[]", side_effects: [] }

  - { method: POST, path: /api/ops/runs, description: "Ops-run checkpoint sweep (in order): (1) expire PENDING notices past cure_deadline and advance their cases to NOTICE_EXPIRED; (2) finalize ENTERED judgments at/past appeal_deadline; (3) expire ISSUED writs past expires_on (case back to JUDGMENT_ENTERED); (4) unschedule SCHEDULED writs whose window_end has passed (back to ISSUED, case to WRIT_ISSUED); (5) mark STORED storage records past disposal_eligible_on as DISPOSABLE", roles: [CourtClerk], code: 200, input: [], output: { notices_expired: integer, judgments_finalized: integer, writs_expired: integer, writs_unscheduled: integer, storage_records_disposable: integer }, side_effects: ["per-sweep transitions as listed"] }
  - { method: POST, path: /api/_clock/set_current_utc, description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Landlord does not own the aggregate chain being mutated" }
  - { id: ERR_NOT_ASSIGNED_MEDIATOR, http: 403, condition: "Outcome recorder is not the referral's mediator_id" }
  - { id: ERR_NOT_ASSIGNED_DEPUTY, http: 403, condition: "Execute/cancel recorder is not the writ's assigned deputy_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Body shape/type/enum/conditional-required violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current case.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity status does not permit the operation" }
  - { id: ERR_SOD_PARTY_CANNOT_SERVE, http: 403, condition: "Service recorder is the case landlord (party may not serve process)" }
  - { id: ERR_SOD_FEE_JUDGMENT, http: 409, condition: "Judgment-entering clerk equals the fee-accepting clerk" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "Judgment not yet FINAL (appeal window open) on writ request/issue" }
  - { id: ERR_NO_POSSESSION_GRANTED, http: 422, condition: "Writ requested on a judgment without possession_granted" }
  - { id: ERR_DISPOSAL_NOT_ELIGIBLE, http: 409, condition: "Storage disposal before statutory period elapsed" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "Non-terminal case already exists for the tenancy" }
  - { id: ERR_UNIT_OCCUPIED, http: 409, condition: "Unit already has an ACTIVE tenancy" }
  - { id: ERR_NOTICE_TYPE_MISMATCH, http: 422, condition: "notice_type incompatible with case_reason" }
  - { id: ERR_HEARING_ALREADY_SCHEDULED, http: 409, condition: "Case already has a SCHEDULED hearing" }
  - { id: ERR_DEFENDANT_UNKNOWN, http: 422, condition: "defendant_name not in the ACCEPTED package's defendant_names" }
  - { id: ERR_DEFENDANT_ALREADY_SERVED, http: 409, condition: "Defendant already has a SERVED attempt on the case" }
  - { id: ERR_WRIT_ACTIVE_EXISTS, http: 409, condition: "An active (REQUESTED/ISSUED/SCHEDULED) writ already exists for the judgment" }
  - { id: ERR_DEPUTY_DAY_CAPACITY, http: 409, condition: "Deputy already has 3 SCHEDULED lockouts on that calendar date" }
  - { id: ERR_JUDGMENT_EXISTS, http: 409, condition: "Case already has a Judgment" }
  - { id: ERR_DATE_IN_FUTURE, http: 422, condition: "served_on/served_at is in the future vs the logical clock" }
  - { id: ERR_CURE_WINDOW_CLOSED, http: 409, condition: "Cure attempted after cure_deadline or on an UNCONDITIONAL_QUIT notice" }
  - { id: ERR_HEARING_WINDOW_INVALID, http: 422, condition: "end_at <= start_at" }
  - { id: ERR_HEARING_LEAD_TIME, http: 422, condition: "Hearing date before service_completed_at + jurisdictional lead days" }
  - { id: ERR_COURTROOM_OVERLAP, http: 409, condition: "Half-open hearing window intersects another SCHEDULED hearing in the same courtroom" }
  - { id: ERR_WRIT_WINDOW_INVALID, http: 422, condition: "window_start in past, window_end <= window_start, or window_end > expires_on" }
  - { id: ERR_LOCKOUT_WINDOW_NOT_OPEN, http: 409, condition: "Execute outside [window_start, window_end] or after expires_on" }
  - { id: ERR_REPORT_WINDOW_LAPSED, http: 422, condition: "Report filed more than 30 days after its trigger event" }
  - { id: ERR_REPORT_EVENT_MISSING, http: 422, condition: "Trigger event (filing/judgment/satisfaction) does not exist for the tenancy" }
  - { id: ERR_CORRECTION_TARGET_INVALID, http: 422, condition: "Correction reference missing, cross-tenancy, itself a correction, or already superseded" }
  - { id: ERR_REVERSAL_TARGET_INVALID, http: 422, condition: "Reversal target missing, not a PAYMENT, cross-judgment, or already reversed" }
  - { id: ERR_CURE_AMOUNT_INSUFFICIENT, http: 422, condition: "PAY_OR_QUIT cure payment below claimed_rent_owed_cents" }
  - { id: ERR_FEE_OVERPAYMENT, http: 422, condition: "Fee payment would exceed computed filing_fee_cents" }
  - { id: ERR_FEE_UNPAID, http: 422, condition: "Review attempted before fee_status == PAID" }
  - { id: ERR_WRIT_FEE_MISMATCH, http: 422, condition: "writ_fee_paid_cents != jurisdictional writ fee" }
  - { id: ERR_STORAGE_CHARGE_MISMATCH, http: 422, condition: "charge_paid_cents != accrued charge at current clock" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "PAYMENT/WRITE_OFF exceeds outstanding balance, or REVERSAL amount != target payment amount" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; seeds landlords and drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /api/landlords", "POST /api/_clock/set_current_utc"]
    shared_operations: ["read endpoints"]
  - name: Landlord
    description: "Property owner/manager initiating and managing eviction workflow; may NOT serve process on own cases"
    identity: "entity_backed:Landlord"
    exclusive_operations: ["POST /api/units", "POST /api/tenancies", "POST /api/cases", "POST /api/cases/{id}/dismiss", "POST /api/cases/{id}/notices", "POST /api/notices/{id}/record-cure", "POST /api/cases/{id}/filing-packages", "POST /api/filing-packages/{id}/fee-payments", "POST /api/judgments/{id}/writs", "POST /api/judgments/{id}/collection-entries", "POST /api/tenancies/{id}/rental-history-reports"]
    shared_operations: ["read endpoints"]
  - name: CourtClerk
    description: "Court clerk; reviews filings, schedules hearings, records answers, enters judgments, issues writs, runs ops sweeps"
    identity: opaque
    exclusive_operations: ["POST /api/filing-packages/{id}/review", "POST /api/cases/{id}/hearings", "POST /api/hearings/{id}/continuance", "POST /api/hearings/{id}/conclude", "POST /api/cases/{id}/answers", "POST /api/answers/{id}/mediation-referrals", "POST /api/cases/{id}/judgment", "POST /api/writs/{id}/issue", "POST /api/ops/runs"]
    shared_operations: ["read endpoints"]
  - name: ProcessServer
    description: "Licensed process server (non-party); records service attempts"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /api/cases/{id}/service-attempts", "read endpoints"]
  - name: SheriffDeputy
    description: "Sheriff's deputy; may serve process, schedules/executes lockouts, handles storage reclaim/disposal"
    identity: opaque
    exclusive_operations: ["POST /api/writs/{id}/schedule-lockout", "POST /api/writs/{id}/cancel-lockout", "POST /api/writs/{id}/execute", "POST /api/storage-records/{id}/reclaim", "POST /api/storage-records/{id}/dispose"]
    shared_operations: ["POST /api/cases/{id}/service-attempts", "read endpoints"]
  - name: Mediator
    description: "Court-appointed mediator; records mediation outcomes (must be the referral's mediator_id)"
    identity: opaque
    exclusive_operations: ["POST /api/referrals/{id}/outcome"]
    shared_operations: ["read endpoints"]
