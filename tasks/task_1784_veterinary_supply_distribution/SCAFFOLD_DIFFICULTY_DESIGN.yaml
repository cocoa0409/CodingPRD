          lot_number: LOT-V1
          expiry_date: '2027-06-30'
          qty_on_hand: 10
        as: SupplyChainPlanner
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 14 Bit Blvd
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 2
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o_id}
          carrier_name: CHILLCARE
          carrier_cold_chain_certified: true
        as: SupplyChainPlanner
        captures:
          s_id: $.data.id
          s_cold: $.data.requires_cold_chain
      - call: POST /vet/shipments/${s_id}/dispatch
        as: SupplyChainPlanner
      trigger:
      - call: POST /vet/shipments/${s_id}/temperature-readings
        payload:
          recorded_at: '2026-08-03T14:00:00Z'
          temperature_celsius: 2.0
        as: SupplyChainPlanner
        captures:
          st1: $.data.status
          ex1: $.data.has_unresolved_excursion
      - call: POST /vet/shipments/${s_id}/temperature-readings
        payload:
          recorded_at: '2026-08-03T15:00:00Z'
          temperature_celsius: 8.0
        as: SupplyChainPlanner
        captures:
          st2: $.data.status
          ex2: $.data.has_unresolved_excursion
      - call: POST /vet/shipments/${s_id}/temperature-readings
        payload:
          recorded_at: '2026-08-03T16:00:00Z'
          temperature_celsius: 8.1
        as: SupplyChainPlanner
        captures:
          st3: $.data.status
          ex3: $.data.has_unresolved_excursion
      assert:
      - Shipment.requires_cold_chain == true (computed from VACCINE line; input would be ignored)
      - Reading 2.0 -> status IN_TRANSIT, has_unresolved_excursion false (lower bound inclusive)
      - Reading 8.0 -> status IN_TRANSIT, has_unresolved_excursion false (upper bound inclusive)
      - Reading 8.1 -> status QUARANTINED, has_unresolved_excursion true
      - temperature_log holds all 3 readings in posted order
- rule_id: cross_entity_state_dependency
  instances:
  - name: order_submit_requires_active_clinic
    grounds:
    - validations[priority=4.5]
    - state_machines.Order.DRAFT_to_SUBMITTED
    - state_machines.Clinic.ACTIVE_to_SUSPENDED
    distinguishing_aspect: 'Entity pair Order -> Clinic: an order whose clinic is SUSPENDED

