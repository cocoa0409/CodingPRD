scaffold_corner_design:

  # =========================================================================
  # Entities — creation, required fields, defaults, computed/system, not-found, enums
  # =========================================================================
  - section: entities
    instances:
      - name: create_agency_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints.POST_/agencies
        distinguishing_aspect: "POST /agencies with name+discipline+response_sla_seconds returns 201, status defaults to ONLINE, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Metro PD", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ag_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Agency.${ag_id}.status == ONLINE"
            - "Agency.${ag_id}.version == 1"
            - "Agency.${ag_id}.discipline == POLICE"

      - name: create_incident_required_field_missing_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Incident.fields.incident_type
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /incidents missing incident_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Clock set; empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559001", ali_grid_x: 10, ali_grid_y: 10 }
              as: Calltaker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: incident_ani_not_ten_digits_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Incident.fields.ani
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "ani with fewer than 10 digits is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T01:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "12345", ali_grid_x: 10, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: incident_grid_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Incident.fields.ali_grid_x
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "ali_grid_x > 1000 is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T02:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559002", ali_grid_x: 5000, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: incident_invalid_enum_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Incident.fields.incident_type
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Unknown incident_type enum value rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T03:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559003", ali_grid_x: 10, ali_grid_y: 10, incident_type: "CAT_IN_TREE" }
              as: Calltaker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: incident_default_ali_confidence_high
        claim_type: Defaults
        grounds:
          - entities.Incident.fields.ali_confidence
        distinguishing_aspect: "Omitting ali_confidence applies default HIGH (no priority-2 confidence clamp)."
        test_recipe:
          setup: ["Clock set; no premise alert at grid."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T04:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559004", ali_grid_x: 200, ali_grid_y: 200, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          assert:
            - "Incident.${inc_id}.ali_confidence == HIGH"
            - "Incident.${inc_id}.priority_level == 5"

      - name: incident_computed_required_disciplines_and_number_minted
        claim_type: Computed Fields
        grounds:
          - entities.Incident.fields.required_disciplines
          - entities.Incident.fields.incident_number
          - calculations.effective_priority_at_intake
        distinguishing_aspect: "STRUCTURE_FIRE intake computes required_disciplines==[FIRE,EMS], base_priority_level==1, and a CFS incident_number."
        test_recipe:
          setup: ["Clock set; no premise alert."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T05:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559005", ali_grid_x: 100, ali_grid_y: 100, incident_type: "STRUCTURE_FIRE" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_num: $.data.incident_number }
          assert:
            - "Incident.${inc_id}.required_disciplines == [FIRE, EMS]"
            - "Incident.${inc_id}.base_priority_level == 1"
            - "Incident.${inc_id}.priority_level == 1"
            - "Incident.${inc_id}.incident_number is a non-empty CFS string"

      - name: incident_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Incident.fields.lifecycle_status
          - entities.Incident.fields.priority_level
        distinguishing_aspect: "Client-supplied lifecycle_status/priority_level in body are ignored; server sets lifecycle_status=PENDING and computes priority."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T06:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559006", ali_grid_x: 100, ali_grid_y: 100, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          assert:
            - "Incident.${inc_id}.lifecycle_status == PENDING"
            - "Incident.${inc_id}.priority_level == 5"

      - name: get_agency_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/agencies/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /agencies/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /agencies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: cfsreport_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.CfsReport
        distinguishing_aspect: "CfsReport (common_fields:false) exposes id+created_at only; no version field and no update endpoint exists."
        test_recipe:
          setup: ["A CLOSED MEDICAL incident with one CLEARED assignment exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS Rep", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "ERep", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MR1", capability: "MEDIC_ALS", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559007", ali_grid_x: 10, ali_grid_y: 10, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "CLEAR" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "POST /incidents/${inc_id}/dispositions"
              payload: { disposition_code: "TRANSPORT", narrative: "done" }
              as: Supervisor
          trigger:
            - call: "POST /incidents/${inc_id}/reports"
              payload: { report_standard: "NENA" }
              as: Records
              captures: { rep_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CfsReport.${rep_id}.id is present and created_at is present"
            - "CfsReport.${rep_id} has no version field"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, initial state, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: escalate_below_priority_one_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.priority_level.N_to_Nminus1
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A STRUCTURE_FIRE incident already at priority_level 1 cannot escalate further; escalate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["STRUCTURE_FIRE incident, base priority 1, no premise alert (priority_level==1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T01:00:00Z" }
              as: SystemClock
            - call: "POST /incidents"
              payload: { ani: "5125559008", ali_grid_x: 500, ali_grid_y: 500, incident_type: "STRUCTURE_FIRE" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/escalate"
              payload: { reason: "x" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: resume_non_held_incident_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.lifecycle_status.HELD_to_ACTIVE
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST resume on a PENDING (not HELD) incident returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING incident, never held."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T02:00:00Z" }
              as: SystemClock
            - call: "POST /incidents"
              payload: { ani: "5125559009", ali_grid_x: 10, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/resume"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: assignment_onscene_from_dispatched_skips_enroute_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Assignment.ENROUTE_to_ONSCENE
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Marking ONSCENE directly from DISPATCHED (without ENROUTE) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["POLICE agency + PATROL unit; ASSAULT incident with one DISPATCHED assignment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T03:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Sk", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PSk", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PSk1", capability: "PATROL", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559010", ali_grid_x: 10, ali_grid_y: 10, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
          trigger:
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_dispatched_incident_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.lifecycle_status.PENDING_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST cancel on a DISPATCHED incident (already has an assignment) returns ERR_INVALID_STATE; cancel is only for PENDING."
        test_recipe:
          setup: ["POLICE agency + PATROL unit; ASSAULT incident DISPATCHED (one assignment)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T04:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Cn", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PCn", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PCn1", capability: "PATROL", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559011", ali_grid_x: 10, ali_grid_y: 10, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/cancel"
              payload: { reason: "false_alarm" }
              as: Calltaker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: terminal_cancelled_incident_rejects_escalate
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Incident.lifecycle_status
          - state_machines.Incident.priority_level.N_to_Nminus1
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CANCELLED incident is terminal; escalate is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING incident cancelled (terminal CANCELLED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T05:00:00Z" }
              as: SystemClock
            - call: "POST /incidents"
              payload: { ani: "5125559012", ali_grid_x: 10, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/cancel"
              payload: { reason: "resolved_by_phone" }
              as: Calltaker
          trigger:
            - call: "POST /incidents/${inc_id}/escalate"
              payload: { reason: "x" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: new_unit_starts_available_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Unit.status
          - entities.Unit.fields.status
        distinguishing_aspect: "A newly created Unit starts in initial_state AVAILABLE with active_incident_id null and grid defaulted to its station."
        test_recipe:
          setup: ["One agency + station at grid (88,88)."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "PD Init", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PInit", grid_x: 88, grid_y: 88 }
              as: Supervisor
              captures: { stn_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PInit1", capability: "PATROL" }
              as: Supervisor
              captures: { unit_id: $.data.id }
          assert:
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Unit.${unit_id}.active_incident_id == null"
            - "Unit.${unit_id}.grid_x == 88"
            - "Unit.${unit_id}.grid_y == 88"

      - name: hold_pending_incident_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.lifecycle_status.ACTIVE_to_HELD
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST hold on a PENDING (not ACTIVE) incident returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING incident."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T06:00:00Z" }
              as: SystemClock
            - call: "POST /incidents"
              payload: { ani: "5125559013", ali_grid_x: 10, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/hold"
              payload: { reason: "x" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # =========================================================================
  # Calculations — constants, precision, distance, premise clamp
  # =========================================================================
  - section: calculations
    instances:
      - name: premise_alert_clamps_priority_up
        claim_type: Constants Applied
        grounds:
          - calculations.effective_priority_at_intake
          - entities.PremiseAlert.fields.min_priority_floor
          - entities.Incident.fields.premise_alert_id
        distinguishing_aspect: "A WELFARE_CHECK (base 5) at a grid with an active premise alert floor 3 yields priority_level==3 and links premise_alert_id."
        test_recipe:
          setup: ["Active premise alert at (250,250) floor 3."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T07:00:00Z" }
              as: SystemClock
            - call: "POST /premise-alerts"
              payload: { grid_x: 250, grid_y: 250, hazard_class: "COMBATIVE_SUBJECT", min_priority_floor: 3 }
              as: Supervisor
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125559014", ali_grid_x: 250, ali_grid_y: 250, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          assert:
            - "Incident.${inc_id}.base_priority_level == 5"
            - "Incident.${inc_id}.priority_level == 3"
            - "Incident.${inc_id}.premise_alert_id == ${pa_id}"

      - name: recommendation_manhattan_distance_and_candidate_count
        claim_type: Correct Result
        grounds:
          - calculations.nearest_unit_recommendation
          - "endpoints.GET_/incidents/{id}/recommendation"
        distinguishing_aspect: "With two AVAILABLE PATROL units at distances 3 and 5 from ALI, recommendation returns the distance-3 unit, travel_distance==3, candidate_count==2."
        test_recipe:
          setup: ["One POLICE agency, two PATROL units at (12,11) and (10,15); ASSAULT incident at (10,10)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T08:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Dist", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PDist", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PDa1", capability: "PATROL", grid_x: 12, grid_y: 11 }
              as: Supervisor
              captures: { near_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PDa2", capability: "PATROL", grid_x: 10, grid_y: 15 }
              as: Supervisor
              captures: { far_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559015", ali_grid_x: 10, ali_grid_y: 10, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          trigger:
            - call: "GET /incidents/${inc_id}/recommendation"
              payload: { discipline: "POLICE" }
              as: Dispatcher
              captures: { rec: $.data.recommended_unit_id, dist: $.data.travel_distance, cc: $.data.candidate_count }
          assert:
            - "rec == ${near_id}"
