            - "DepositAccount.${acct_id}.assigned_collateral_value_cents == 19600000 and coverage_ratio_bps == floor(19600000*10000/78750000) == 2488 after both accepted allocations"

      - name: occ_stale_depository_version_rejected_on_second_mtm_run
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.mtm-run-create-stale-depository, "endpoints.POST_/depositories/{id}/mtm-runs", "errors[ERR_STALE_DEPOSITORY_VERSION]"]
        distinguishing_aspect: "The first MTM run itself bumps Depository.version (counter, posture, risk grade), so a client that legitimately wants a second non-overlapping run MUST re-read: replaying the version captured before run 1 returns 412 ERR_STALE_DEPOSITORY_VERSION and does NOT create a MarkToMarketRun row, leaving mtm_run_index at 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T05:00:00Z; APPROVED depository with a funded DEDICATED account (required 78,750,000) and no collateral, so every run is deficient."
