        claim_type: role_denied
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A protected GET /accounts call with no X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED (Anonymous not permitted on GET /accounts; treated as missing valid auth)"

