          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-9001", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2019 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { unit_id: id }
          - call: "POST /facilities/capacity-studies"
            payload: { school_id: "${study_school_id}", class_size_policy_id: "${policy_id}", school_year: "2027-28", method: "DISTRICT_POLICY", expected_school_version: "${study_school_version}" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
