# =============================================================================
# §1.9 Scaffold Corner Design — task_0992 Document Digitization Bureau
# Breadth coverage of every testable claim §1.8 does not already cover.
# All chains replay from empty DB against §1.5 of the sibling SCAFFOLD.yaml.
# Canonical pricing: STANDARD 0.45 USD/page (100p -> 4500c); clock default
# 2026-05-01T00:00:00Z; MIN_OCR_CONFIDENCE 70; RUSH_ADMISSION_LIMIT 3.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "A created client starts ACTIVE with server-minted id and version 1; created_at follows the logical clock default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Acme", hipaa_covered: true }, as: PlatformAdmin, captures: { cid: $.data.id, cstat: $.data.status, cver: $.data.version } }
          trigger: []
          assert:
            - "${cstat} == ACTIVE"
            - "${cver} == 1"
            - "Client.${cid}.created_at == 2026-05-01T00:00:00Z (logical clock default, not wall clock)"

      - name: get_nonexistent_batch_returns_not_found
        claim_type: not_found
        grounds: [entities.Batch, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but absent UUID yields the 404 envelope, not a 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /batches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "http status == 404 and response_type == error"

      - name: create_document_missing_required_pages_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Document, "validations[priority=3.5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field pages is a 400 shape error, raised before any state or business check."
        test_recipe:
          setup: ["client + agreement + INTAKE batch with one box"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Req Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
          trigger:
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "http status == 400; no Document created (GET /boxes/${box1}/documents returns an empty array)"

      - name: create_batch_with_computed_field_extra_field_rejected
        claim_type: computed_fields
        grounds: [entities.Batch.fields.scanned_pages, "validations[priority=3.5]"]
        distinguishing_aspect: "Client-supplied computed/server fields (scanned_pages) in a create payload are rejected as shape violations, never silently accepted."
        test_recipe:
          setup: ["client + agreement"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Xtra Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD", scanned_pages: 999 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "no batch carries scanned_pages 999 (computed fields start at 0)"

      - name: page_log_append_only_immutability
        claim_type: immutability
        grounds: [entities.PageLog]
        distinguishing_aspect: "PageLog is an event entity (common_fields false): it carries id + created_at but no version/updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["client + agreement + SCANNING batch with one 50-page document and an OPEN session with one page log"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "PL Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1", captures: { pl: $.data.id } }
          trigger:
            - { call: "GET /page-logs/${pl}", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
          assert:
            - "PageLog.${pl} response contains id and created_at but no version and no updated_at key"
            - "PageLog.${pl}.pages == 50 and PageLog.${pl}.document_id == ${d1}"

      - name: document_enum_type_constraint_rejected
        claim_type: type_constraints
        grounds: [entities.Document.fields.doc_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "doc_type outside the declared enum set is a 400, distinct from missing-field 400s."
        test_recipe:
          setup: ["client + agreement + INTAKE batch with one box"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Enum Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
          trigger:
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "BLUEPRINT", pages: 10, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (BLUEPRINT is not in MEDICAL_RECORD|INVOICE|CONTRACT|CORRESPONDENCE|OTHER)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_initial_state_and_invalid_transition_from_intake
        claim_type: invalid_transition
        grounds: [state_machines.Batch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A new batch starts INTAKE; skipping ahead (pass-qa from INTAKE) is rejected and leaves the state untouched."
        test_recipe:
          setup: ["client + agreement + fresh batch"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Init Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id, bstat: $.data.status } }
          trigger:
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1", captures: { err: $.data.error_id } }
          assert:
            - "${bstat} == INTAKE (initial state)"
            - "${err} == ERR_INVALID_STATE"
            - "Batch.${bid}.status remains INTAKE and version remains 1 (no side effects fired)"

      - name: batch_terminal_lockdown_closed_rejects_all_actions
        claim_type: terminal_lockdown
        grounds: [state_machines.Batch.DISPOSITION_PENDING_to_CLOSED]
        distinguishing_aspect: "From terminal CLOSED no transition is possible; even a well-formed start-prep is ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "full lifecycle: client + agreement (retention 5); batch with one shelved box + one 100-page document delivered at 2026-05-10; clock swept to 2026-05-15; box destroyed; batch CLOSED"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Term Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 5, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-T", zone: "GENERAL", capacity_grams: 2000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T1", record_date: "2026-01-01", subject: "S1" }, ocr_text_ref: "ocr://t1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /boxes/${box1}/begin-destruction", payload: {}, as: DestructionSpecialist, as_user_id: "ds-1" }
            - { call: "POST /boxes/${box1}/destruction-certificates", payload: { witness_user_id: "wit-1", method: "INCINERATE" }, as: DestructionSpecialist, as_user_id: "ds-1" }
            - { call: "POST /batches/${bid}/close", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1", captures: { err2: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE and ${err2} == ERR_INVALID_STATE"
            - "Batch.${bid}.status remains CLOSED"

      - name: index_records_on_unscanned_document_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Document.SCANNED_to_INDEXED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Index submission requires the document SCANNED and the batch INDEXING; a REGISTERED document in an INTAKE batch fails on state before metadata checks."
        test_recipe:
          setup: ["client + agreement + INTAKE batch + box + REGISTERED document"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Pre Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 10, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://x" }, as: Indexer, as_user_id: "idx-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (batch INTAKE, document REGISTERED)"
            - "Document.${d1}.status remains REGISTERED; no IndexRecord created"

      - name: session_void_then_commit_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.ScanSession.OPEN_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOIDED is terminal: committing a voided session fails even with a fresh correct batch version."
        test_recipe:
          setup: ["client + agreement + SCANNING batch + document + OPEN session (no pages needed for void)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Void Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/void", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
          trigger:
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (VOIDED is terminal; OCC version is irrelevant once the session is closed)"
            - "ScanSession.${ss}.status remains VOIDED; Batch.scanned_pages == 0 (voided pages excluded from aggregates)"

      - name: invoice_void_then_issue_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Invoice.DRAFT_to_VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOID is terminal for invoices; a voided DRAFT can never be issued."
        test_recipe:
          setup: ["client + agreement + batch (auto-created DRAFT invoice), then voided"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "VoidInv Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "GET /batches/${bid}/invoices", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { inv: "$.data[0].id" } }
            - { call: "POST /invoices/${inv}/void", payload: { void_reason: "duplicate batch" }, as: BillingClerk, as_user_id: "bill-1" }
          trigger:
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Invoice.${inv}.status remains VOID with void_reason recorded"

      - name: qa_review_side_effect_flips_only_target_document
        claim_type: side_effect_execution
        grounds: [state_machines.Document.SCANNED_to_QA_FAILED]
        distinguishing_aspect: "POST qa-reviews flips exactly the named document SCANNED -> QA_FAILED and leaves sibling documents SCANNED."
        test_recipe:
          setup: ["client + agreement + batch with two documents (50p each), both scanned and committed; batch SCANNING"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "SideFx Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d2: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d2}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
          trigger:
            - { call: "POST /batches/${bid}/qa-reviews", payload: { document_id: "${d1}" }, as: QAReviewer, as_user_id: "qa-1" }
          assert:
            - "Document.${d1}.status == QA_FAILED"
            - "Document.${d2}.status == SCANNED (sibling untouched)"
            - "Batch.${bid}.scanned_pages == 100 and billable_scanned_pages == 100 (QA_FAILED stays in both ledgers)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: indexability_allowance_exceeded_blocks_deliver
        claim_type: correct_result
        grounds: [calculations.batch_indexability, "errors[ERR_BATCH_NOT_INDEXABLE]"]
