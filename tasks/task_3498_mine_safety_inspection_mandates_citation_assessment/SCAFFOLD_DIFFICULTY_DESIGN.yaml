              as: MSHAAdmin
              captures: { i2: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-03-10T08:00:00Z", planned_end_at: "2026-03-10T17:00:00Z" }
