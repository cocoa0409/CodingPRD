  - method: POST
    path: "/curb/citations"
    description: "Issue a citation"
    roles: [EnforcementOfficer]
    code: 201
    input: [zone_id, permittee_id, violation_type, "occupancy_session_id?", "reservation_id?"]
    output: Citation
    side_effects: ["status=ISSUED, issued_at=clock_now, due_at=issued_at+GRACE_DAYS, compute fine_due_cents (base)"]

  - method: GET
    path: "/curb/citations/{id}"
    description: "Get a citation"
    roles: [EnforcementOfficer, Permittee, CurbPlanner]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: GET
    path: "/curb/citations"
    description: "List citations (filterable)"
    roles: [EnforcementOfficer, Permittee, CurbPlanner]
    code: 200
    input: ["zone_id?", "reservation_id?", "occupancy_session_id?", "permittee_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []

  - method: POST
    path: "/curb/citations/{id}/pay"
    description: "Pay a citation"
    roles: [Permittee]
    code: 200
    input: []
    output: Citation
    side_effects: ["status -> PAID", "append LedgerEntry FINE (+fine_due_cents)", "increments Citation.version by 1"]

  - method: POST
    path: "/curb/citations/{id}/dispute"
    description: "Dispute a citation"
    roles: [Permittee]
    code: 200
    input: [reason]
    output: Citation
    side_effects: ["status ISSUED -> DISPUTED", "increments Citation.version by 1"]

  - method: POST
    path: "/curb/citations/{id}/adjudicate"
    description: "Adjudicate a disputed citation (UPHELD or DISMISSED)"
    roles: [EnforcementOfficer]
    code: 200
    input: [decision]
    output: Citation
    side_effects:
      - "decision=UPHELD: status -> UPHELD, recompute fine_due_cents (late penalty if past due_at)"
      - "decision=DISMISSED: status -> DISMISSED, outstanding_fines_cents recomputes"
      - "increments Citation.version by 1"

  # ---- CurbEvent ----
  - method: POST
    path: "/curb/events"
    description: "Create a curb event (PLANNED)"
    roles: [CurbPlanner]
    code: 201
    input: [name, start_utc, end_utc, zone_ids]
    output: CurbEvent
    side_effects: ["status=PLANNED, total_refund_cents=0, version=1"]

  - method: GET
    path: "/curb/events/{id}"
    description: "Get a curb event"
    roles: [CurbPlanner, Permittee]
    code: 200
    input: []
    output: CurbEvent
    side_effects: []

  - method: POST
    path: "/curb/events/{id}/activate"
    description: "Activate an event: reallocate zones, cancel + refund overlapping reservations"
    roles: [CurbPlanner]
    code: 200
    input: []
    output: CurbEvent
    side_effects:
      - "status PLANNED -> ACTIVE"
      - "cascade: zones -> SUSPENDED; overlapping CONFIRMED reservations -> CANCELLED_BY_EVENT; per-reservation LedgerEntry REFUND"
      - "compute total_refund_cents"
      - "increments CurbEvent.version by 1"

  - method: POST
    path: "/curb/events/{id}/close"
    description: "Close an active event: restore suspended zones"
    roles: [CurbPlanner]
    code: 200
    input: []
    output: CurbEvent
    side_effects: ["status ACTIVE -> CLOSED", "zones suspended by this event -> ACTIVE", "increments CurbEvent.version by 1"]

  - method: POST
    path: "/curb/events/{id}/cancel"
    description: "Cancel a planned event"
    roles: [CurbPlanner]
    code: 200
    input: []
    output: CurbEvent
    side_effects: ["status PLANNED -> CANCELLED", "increments CurbEvent.version by 1"]

  # ---- LedgerEntry / Revenue ----
  - method: GET
    path: "/curb/ledger-entries/{id}"
    description: "Get a ledger entry"
    roles: [CurbPlanner]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

