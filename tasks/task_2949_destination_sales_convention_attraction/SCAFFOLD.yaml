scenario: |
  2949. Destination Sales & Convention Attraction (convention and visitors bureau): citywide convention lead generation with meeting planner relationship management, date and space hold coordination between the convention center and hotel community, room block commitment assembly across multiple hotels with rate ceilings and cutoff alignment, bid package preparation with incentives, service commitments and community support letters, economic impact estimation used to justify incentive spend, definite booking conversion tracking and lost business analysis by reason, servicing during the event with housing, transportation and volunteer coordination, funding from lodging tax with board reporting on room night production
domain_name: destination-sales-convention-attraction
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  # Opportunity, Hotel and CenterHall are peers joined by two junction entities
  # (RoomBlockCommitment = Opportunity x Hotel, SpaceHold = Opportunity x CenterHall);
  # Opportunity and SpaceHold are additionally self-referential.
  state_machine_shape: cyclic
  # BidPackage revision rounds (SUBMITTED -> DRAFT -> ... ), IncentiveFund posture
  # oscillation (OPEN <-> CONSTRAINED <-> EXHAUSTED), RoomBlockCommitment re-offer
  # self-loop, plus two parallel state dimensions on Opportunity
  # (sales_stage x hold_posture).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The SalesManager user id that prepared / requested an incentive on a BidPackage
  # can never be the IncentiveApprover user id that decides it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MIN_LEAD_DAYS: 180
  FIRST_HOLD_DAYS: 90
  PROMOTION_HOLD_DAYS: 30
  CHALLENGE_RESPONSE_DAYS: 14
  MAX_HELD_HOLDS_PER_BUFFERED_WINDOW: 2
  CUTOFF_ALIGNMENT_TOLERANCE_DAYS: 2
  MIN_BLOCK_COVERAGE_PCT: "85.00"
  MIN_DISTINCT_SUPPORT_LETTER_TYPES: 2
  MAX_BID_ROUNDS: 3
  ROLLING_WINDOW_DAYS: 730
  DELEGATE_DAILY_SPEND: "285.00"
  EXHIBITOR_SQFT_SPEND: "4.75"
  INDIRECT_MULTIPLIER: "1.65"
  LODGING_TAX_RATE: "0.15"
  OCCUPANCY_PERSONS_PER_ROOM: "1.6"
  ATTRITION_ALLOWANCE_PCT: "80.00"
  ATTRITION_DAMAGE_RATE: "0.75"
  MIN_TAX_PAYBACK_RATIO: "3.00"
  FUND_CONSTRAINED_PCT: "10.00"
  TIER_A_SCORE_FLOOR: 60
  TIER_B_SCORE_FLOOR: 30

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: MeetingPlanner
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: legal name of the planner organization holding the convention
        constraints: 1..120 chars, required
      - name: contact_email
        type: string
        source: input
        description: primary contact email used by the bureau sales team
        constraints: must contain '@', 5..120 chars
      - name: legacy_definite_count
        type: integer
        source: input
        description: definite conventions migrated from the pre-API bureau CRM; counts in the LIFETIME relationship-score variant only
        default: 0
        constraints: ">= 0"
      - name: legacy_definite_room_nights
        type: integer
        source: input
        description: room nights migrated from the pre-API bureau CRM; counts in the LIFETIME relationship-score variant only
        default: 0
        constraints: ">= 0"
      - name: definite_count
        type: integer
        source: computed
        description: count of Opportunity rows with planner_id = this.id AND sales_stage IN {DEFINITE, SERVICED}
        default: 0
      - name: lost_count
        type: integer
        source: computed
        description: count of Opportunity rows with planner_id = this.id AND sales_stage = LOST
        default: 0
      - name: lifetime_definite_room_nights
        type: integer
        source: computed
        description: legacy_definite_room_nights + sum of Opportunity.definite_room_nights over Opportunity rows with planner_id = this.id AND sales_stage IN {DEFINITE, SERVICED}
        default: 0
      - name: relationship_score_lifetime
        type: integer
        source: computed
        description: output of calculations.planner_relationship_score variant LIFETIME (0..100)
        default: 0
      - name: relationship_score_rolling_24m
        type: integer
        source: computed
        description: output of calculations.planner_relationship_score variant ROLLING_24M (0..100)
        default: 0
      - name: tier
        type: enum
        source: computed
        description: incentive tier derived from relationship_score_lifetime only (never from the rolling variant)
        default: TIER_C
        constraints: "TIER_A (score >= 60) | TIER_B (score >= 30) | TIER_C (otherwise)"
      - name: engagement_status
        type: enum
        source: computed
        description: PROSPECT at creation; flips to ENGAGED when any owned Opportunity is qualified
        default: PROSPECT
        constraints: "PROSPECT | ENGAGED"
      - name: last_touch_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent qualify / submit / planner-response touch on any owned Opportunity
        default: null

  - name: Hotel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: hotel property name in the citywide package
        constraints: 1..120 chars, required
      - name: committable_rooms
        type: integer
        source: input
        description: maximum rooms this property may hold for citywide blocks on any single night
        constraints: ">= 1"
      - name: walk_distance_blocks
        type: integer
        source: input
        description: walking blocks from the convention center; reported in bid packages
        constraints: ">= 0"
      - name: participation_status
        type: enum
        source: input
        description: whether the property currently participates in citywide block assembly
        default: PARTICIPATING
        constraints: "PARTICIPATING | SUSPENDED"
      - name: committed_peak_rooms
        type: integer
        source: computed
        description: maximum over every night date of the sum of rooms_peak_committed across this hotel's RoomBlockCommitment rows with status = COMMITTED occupying that night
        default: 0
      - name: committed_room_nights
        type: integer
        source: computed
        description: sum of RoomBlockCommitment.committed_room_nights across this hotel's rows with status = COMMITTED
        default: 0
      - name: pickup_room_nights
        type: integer
        source: computed
        description: sum of PickupRecord.rooms_picked_up across every PickupRecord whose RoomBlockCommitment.hotel_id = this.id
        default: 0

  - name: CenterHall
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: convention center exhibit hall name
        constraints: 1..120 chars, required
      - name: exhibit_sqft
        type: integer
        source: input
        description: rentable exhibit square footage of the hall
        constraints: ">= 1"
      - name: capacity_persons
        type: integer
        source: input
        description: maximum persons the hall may host; compared against Opportunity.attendance_estimate
        constraints: ">= 1"
      - name: turnaround_hours
        type: integer
        source: input
        description: move-out to next move-in turnaround the hall requires; used as the buffer T in calculations.hall_occupation_conflict
        default: 48
        constraints: ">= 0"
      - name: hall_status
        type: enum
        source: input
        description: AVAILABLE halls accept holds; UNDER_RENOVATION halls reject every new hold
        default: AVAILABLE
        constraints: "AVAILABLE | UNDER_RENOVATION"
      - name: confirmed_hold_count
        type: integer
        source: computed
        description: count of SpaceHold rows with center_hall_id = this.id AND status = CONFIRMED
        default: 0

  - name: Opportunity
    parent: null
    common_fields: true
    fields:
      - name: planner_id
        type: string
        source: input
        description: FK -> MeetingPlanner.id; the planner organization this citywide lead belongs to
      - name: supersedes_opportunity_id
        type: string
        source: input
        description: FK -> Opportunity.id; set when this lead is a re-bid of an earlier LOST lead, null otherwise
        default: null
      - name: event_name
        type: string
        source: input
        description: convention name as marketed
        constraints: 1..160 chars, required
      - name: arrival_date
        type: string
        source: input
        description: first occupied night of the citywide room block, ISO date (YYYY-MM-DD)
      - name: departure_date
        type: string
        source: input
        description: departure date, ISO date; the block occupies nights [arrival_date, departure_date) so this date is NOT an occupied night
      - name: event_nights
        type: integer
        source: computed
        description: departure_date - arrival_date in whole days (half-open night count)
      - name: peak_rooms_requested
        type: integer
        source: input
        description: planner's requested peak-night room count for the whole city
        constraints: ">= 1"
      - name: total_room_nights_requested
        type: integer
        source: input
        description: planner's requested citywide room-night total, used by the PROVISIONAL impact variant and the incentive band ladder
        constraints: ">= 1"
      - name: attendance_estimate
        type: integer
        source: input
        description: planner's delegate attendance estimate, used by the PROVISIONAL impact variant and the hall capacity check
        constraints: ">= 1"
      - name: exhibit_sqft_requested
        type: integer
        source: input
        description: requested exhibit square footage, used by both impact variants
        constraints: ">= 0"
      - name: rate_ceiling_amount
        type: number
        source: input
        description: maximum nightly rate any hotel may offer for this block, currency amount with 2 decimals
        constraints: "> 0"
      - name: sales_stage
        type: enum
        source: computed
        description: pipeline dimension of the parallel state machine; see state_machines.Opportunity
        default: LEAD
        constraints: "LEAD | QUALIFIED | BIDDING | DEFINITE | SERVICED | LOST"
      - name: hold_posture
        type: enum
        source: computed
        description: space dimension of the parallel state machine, driven only by SpaceHold side effects; evolves independently of sales_stage
        default: NONE
        constraints: "NONE | TENTATIVE | CHALLENGED | CONFIRMED | RELEASED"
      - name: committed_peak_rooms
        type: integer
        source: computed
        description: sum of rooms_peak_committed across this opportunity's RoomBlockCommitment rows with status = COMMITTED
        default: 0
      - name: block_coverage_pct
        type: number
        source: computed
        description: output of calculations.citywide_block_readiness; committed_peak_rooms / peak_rooms_requested * 100, 2 decimals
        default: 0
      - name: citywide_cutoff_days_before_arrival
        type: integer
        source: computed
        description: maximum cutoff_days_before_arrival across COMMITTED commitments; the citywide cutoff the bid advertises
        default: 0
      - name: cutoff_alignment_spread_days
        type: integer
        source: computed
        description: max minus min cutoff_days_before_arrival across COMMITTED commitments; 0 when fewer than two are committed
        default: 0
      - name: definite_room_nights
        type: integer
        source: computed
        description: committed_peak_rooms * event_nights frozen at the moment sales_stage becomes DEFINITE; 0 before that
        default: 0
      - name: definite_at
        type: datetime
        source: system
        description: logical-clock instant sales_stage became DEFINITE; null otherwise
        default: null
      - name: lost_reason
        type: enum
        source: computed
        description: reason recorded when sales_stage becomes LOST, from the manual lose call or from a cascade
        default: null
        constraints: "RATE_TOO_HIGH | DATES_UNAVAILABLE | SPACE_UNAVAILABLE | LOST_TO_COMPETITOR | PLANNER_DECLINED_BID | INSUFFICIENT_INCENTIVE | REVISION_LIMIT_REACHED"
      - name: attrition_settlement_amount
        type: number
        source: computed
        description: output of calculations.attrition_settlement; 0.00 until at least one PickupRecord exists
        default: 0

  - name: SpaceHold
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: FK -> Opportunity.id; the lead this date-and-space hold protects
      - name: center_hall_id
        type: string
        source: input
        description: FK -> CenterHall.id; the exhibit hall being held
      - name: challenged_by_space_hold_id
        type: string
        source: computed
        description: FK -> SpaceHold.id; the SECOND-rank hold that issued the live challenge against this hold, null otherwise
        default: null
      - name: move_in_start
        type: datetime
        source: input
        description: first instant the hall is occupied for move-in, ISO 8601 UTC with three fractional digits
      - name: move_out_end
        type: datetime
        source: input
        description: instant the hall is released after move-out (exclusive end of the occupation)
      - name: hold_rank
        type: enum
        source: computed
        description: FIRST when no other blocking hold conflicts at creation, SECOND when exactly one does; promotion can raise SECOND to FIRST
        constraints: "FIRST | SECOND"
      - name: status
        type: enum
        source: computed
        description: hold lifecycle; see state_machines.SpaceHold
        default: HELD
        constraints: "HELD | CHALLENGED | CONFIRMED | RELEASED | EXPIRED"
      - name: expires_at
        type: datetime
        source: system
        description: clock + FIRST_HOLD_DAYS (90) at creation of a FIRST hold; a SECOND hold copies the blocking FIRST hold's expires_at; a promoted hold is re-stamped clock + PROMOTION_HOLD_DAYS (30)
      - name: challenge_deadline
        type: datetime
        source: system
        description: clock + CHALLENGE_RESPONSE_DAYS (14) stamped on the FIRST hold when it is challenged; null when no challenge is live
        default: null
      - name: release_reason
        type: enum
        source: computed
        description: why the hold left the active set
        default: null
        constraints: "SCHEDULER_RELEASE | CHALLENGE_LAPSED | OPPORTUNITY_LOST | SUPERSEDED_BY_CONFIRMED | HOLD_EXPIRED | EVENT_SERVICED"

  - name: RoomBlockCommitment
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: FK -> Opportunity.id; the citywide block being assembled
      - name: hotel_id
        type: string
        source: input
        description: FK -> Hotel.id; the property invited into the block
      - name: rooms_peak_invited
        type: integer
        source: input
        description: peak-night rooms the bureau asked this property for
        constraints: ">= 1"
      - name: rooms_peak_offered
        type: integer
        source: input
        description: peak-night rooms the property offered in its latest offer; null before the first offer
        default: null
      - name: rooms_peak_committed
        type: integer
        source: computed
        description: rooms_peak_offered frozen when status becomes COMMITTED; 0 otherwise
        default: 0
      - name: rate_offered_amount
        type: number
        source: input
        description: nightly rate in the property's latest offer; must never exceed Opportunity.rate_ceiling_amount at commit time
        default: null
      - name: cutoff_days_before_arrival
        type: integer
        source: input
        description: days before Opportunity.arrival_date at which the property releases unsold block rooms
        default: null
        constraints: ">= 0"
      - name: cutoff_date
        type: string
        source: computed
        description: Opportunity.arrival_date minus cutoff_days_before_arrival, ISO date; recomputed on every offer
        default: null
      - name: offer_round
        type: integer
        source: computed
        description: number of offers the property has submitted on this commitment (the OFFERED self-loop counter)
        default: 0
      - name: status
        type: enum
        source: computed
        description: commitment lifecycle; see state_machines.RoomBlockCommitment
        default: INVITED
        constraints: "INVITED | OFFERED | COMMITTED | WITHDRAWN | RELEASED"
      - name: committed_room_nights
        type: integer
        source: computed
        description: rooms_peak_committed * Opportunity.event_nights while status = COMMITTED, else 0
        default: 0
      - name: picked_up_room_nights
        type: integer
        source: computed
        description: sum of PickupRecord.rooms_picked_up across PickupRecord rows with room_block_commitment_id = this.id
        default: 0
      - name: attrition_shortfall_nights
        type: integer
        source: computed
        description: max(0, floor(committed_room_nights * 0.80) - picked_up_room_nights); 0 until at least one PickupRecord exists
        default: 0
      - name: attrition_damages_amount
        type: number
        source: computed
        description: per-commitment attrition damages rounded to 2 decimals BEFORE the opportunity-level sum; see calculations.attrition_settlement
        default: 0
      - name: withdraw_reason
        type: enum
        source: computed
        description: why the property left the block
        default: null
        constraints: "PROPERTY_SOLD_OUT | RATE_DISPUTE | INVITE_DECLINED | OPPORTUNITY_LOST | EVENT_SERVICED"

  - name: BidPackage
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: FK -> Opportunity.id; the lead this bid is prepared for
      - name: round_number
        type: integer
        source: computed
        description: negotiation round; starts at 1 and increments by 1 on every planner-requested revision
        default: 1
      - name: status
        type: enum
        source: computed
        description: bid lifecycle; see state_machines.BidPackage
        default: DRAFT
        constraints: "DRAFT | INCENTIVE_PENDING | APPROVED | SUBMITTED | ACCEPTED | DECLINED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesManager that created this bid package; the segregation-of-duties left operand
      - name: incentive_requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesManager that requested the incentive on the current round; the segregation-of-duties right operand
        default: null
      - name: incentive_request_amount
        type: number
        source: input
        description: incentive cash the bureau is asked to pledge for this round
        default: null
      - name: incentive_cap_amount
        type: number
        source: computed
        description: output of calculations.incentive_cap, recomputed on every request-incentive call
        default: null
      - name: service_commitment_codes
        type: array
        source: input
        description: bureau service pledges attached to the bid, e.g. ["HOUSING_BUREAU", "SHUTTLE_NETWORK", "VOLUNTEER_CORPS", "WELCOME_SIGNAGE"]
        default: []
      - name: support_letter_type_count
        type: integer
        source: computed
        description: count of DISTINCT SupportLetter.letter_type values attached to this bid package
        default: 0
      - name: approved_incentive_amount
        type: number
        source: computed
        description: approved_amount of the latest IncentiveDecision on the current round; null while no decision exists
        default: null
      - name: admin_fee_amount
        type: number
        source: computed
        description: administrative fee on the approved incentive; see calculations.fund_charge_composition
        default: null
      - name: total_fund_charge_amount
        type: number
        source: computed
        description: approved_incentive_amount + admin_fee_amount; the amount committed against the IncentiveFund
        default: null
      - name: tax_payback_ratio
        type: number
        source: computed
        description: PROVISIONAL lodging_tax_yield_amount / total_fund_charge_amount, 2 decimals; gates the fund charge
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant status became SUBMITTED on the current round
        default: null
      - name: response_due_at
        type: datetime
        source: input
        description: instant after which the planner may no longer respond to the submitted bid
        default: null
      - name: planner_response
        type: enum
        source: computed
        description: latest planner verdict on a submitted round
        default: null
        constraints: "ACCEPTED | DECLINED | REVISION_REQUESTED"
      - name: decline_reason
        type: enum
        source: computed
        description: reason captured when the planner declines or the round limit is reached
        default: null
        constraints: "RATE_TOO_HIGH | INSUFFICIENT_INCENTIVE | LOST_TO_COMPETITOR | REVISION_LIMIT_REACHED"

  - name: SupportLetter
    parent: BidPackage
    common_fields: false
    fields:
      - name: bid_package_id
        type: string
        source: input
        description: FK -> BidPackage.id; the bid package this community support letter backs
      - name: organization_name
        type: string
        source: input
        description: community organization that signed the letter
        constraints: 1..120 chars, required
      - name: letter_type
        type: enum
        source: input
        description: which community constituency the letter represents; only DISTINCT types count toward the submission gate
        constraints: "MAYOR | CHAMBER | UNIVERSITY | INDUSTRY_PARTNER | CONVENTION_CENTER"
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant the letter was attached

  - name: IncentiveFund
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: bureau fiscal year the fund belongs to
        constraints: ">= 2020"
      - name: budget_amount
        type: number
        source: input
        description: lodging-tax funded incentive budget; grows by every posted lodging tax receipt
        constraints: "> 0"
      - name: lodging_tax_receipts_total
        type: number
        source: computed
        description: sum of every lodging tax receipt amount posted to this fund
        default: 0
      - name: committed_amount
        type: number
        source: computed
        description: sum of total_charge_amount across live fund charges (bids in status APPROVED, SUBMITTED or ACCEPTED whose opportunity has not yet been SERVICED)
        default: 0
      - name: disbursed_amount
        type: number
        source: computed
        description: sum of total_charge_amount moved out of committed_amount when the funded Opportunity reached SERVICED
        default: 0
      - name: uncommitted_amount
        type: number
        source: computed
        description: budget_amount - committed_amount - disbursed_amount; the conserved-quantity residual
        default: 0
      - name: posture
        type: enum
        source: computed
        description: EXHAUSTED when uncommitted_amount == 0, CONSTRAINED when 0 < uncommitted_amount < budget_amount * 0.10, OPEN otherwise
        default: OPEN
        constraints: "OPEN | CONSTRAINED | EXHAUSTED"

  - name: IncentiveDecision
    parent: BidPackage
    common_fields: false
    fields:
      - name: bid_package_id
        type: string
        source: input
        description: FK -> BidPackage.id; the bid round being decided
      - name: fund_id
        type: string
        source: input
        description: FK -> IncentiveFund.id; the lodging-tax fund charged for this decision
      - name: decision
        type: enum
        source: input
        description: approver verdict on the requested incentive
        constraints: "APPROVED | REDUCED | REJECTED"
      - name: requested_amount
        type: number
        source: system
        description: snapshot of BidPackage.incentive_request_amount at decision time
      - name: approved_amount
        type: number
        source: input
        description: cash pledged; must equal requested_amount when decision = APPROVED, be strictly between 0 and requested_amount when REDUCED, and be 0 when REJECTED
        default: 0
      - name: admin_fee_amount
        type: number
        source: computed
        description: fee selected from the gross approved_amount band; see calculations.fund_charge_composition
        default: 0
      - name: total_charge_amount
        type: number
        source: computed
        description: approved_amount + admin_fee_amount charged against the fund
        default: 0
      - name: tax_payback_ratio
        type: number
        source: computed
        description: PROVISIONAL lodging_tax_yield_amount / total_charge_amount, 2 decimals
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the IncentiveApprover; must differ from both BidPackage.prepared_by_user_id and BidPackage.incentive_requested_by_user_id
      - name: rationale
        type: string
        source: input
        description: written justification recorded for board audit
        constraints: 1..500 chars, required

  - name: EconomicImpactEstimate
    parent: Opportunity
    common_fields: false
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: FK -> Opportunity.id; the lead being valued
      - name: variant
        type: enum
        source: input
        description: which algorithm produced this snapshot
        constraints: "PROVISIONAL | FINAL"
      - name: room_nights_basis
        type: integer
        source: computed
        description: total_room_nights_requested for PROVISIONAL; summed PickupRecord.rooms_picked_up for FINAL
      - name: lodging_spend_amount
        type: number
        source: computed
        description: lodging spend component, 2 decimals
      - name: delegate_spend_amount
        type: number
        source: computed
        description: delegate spend component, 2 decimals
      - name: exhibitor_spend_amount
        type: number
        source: computed
        description: exhibitor spend component, 2 decimals
      - name: direct_spend_amount
        type: number
        source: computed
        description: sum of the three rounded components
      - name: total_impact_amount
        type: number
        source: computed
        description: direct_spend_amount * INDIRECT_MULTIPLIER, rounded to 2 decimals
      - name: lodging_tax_yield_amount
        type: number
        source: computed
        description: lodging_spend_amount * LODGING_TAX_RATE, rounded to 2 decimals; the figure that justifies incentive spend
      - name: computed_at
        type: datetime
        source: system
        description: logical-clock instant the snapshot was produced

  - name: ServicingOrder
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: FK -> Opportunity.id; the definite convention being serviced
      - name: category
        type: enum
        source: input
        description: which servicing workstream this order covers
        constraints: "HOUSING | TRANSPORTATION | VOLUNTEER"
      - name: requested_units
        type: integer
        source: input
        description: housing-bureau seats, shuttle vehicles or volunteer shifts requested
        constraints: ">= 1"
      - name: assigned_units
        type: integer
        source: input
        description: units actually scheduled; set at schedule time
        default: null
      - name: delivered_units
        type: integer
        source: input
        description: units actually delivered on site; set at deliver time
        default: null
      - name: window_start
        type: datetime
        source: input
        description: first instant of the servicing window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end instant of the servicing window
      - name: status
        type: enum
        source: computed
        description: servicing lifecycle; see state_machines.ServicingOrder
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | DELIVERED | CANCELLED"

  - name: PickupRecord
    parent: RoomBlockCommitment
    common_fields: false
    fields:
      - name: room_block_commitment_id
        type: string
        source: input
        description: FK -> RoomBlockCommitment.id; the property block this night's pickup belongs to
      - name: night_date
        type: string
        source: input
        description: occupied night, ISO date; must lie in [Opportunity.arrival_date, Opportunity.departure_date)
      - name: rooms_picked_up
        type: integer
        source: input
        description: rooms actually occupied by the convention on that night
        constraints: ">= 0"
      - name: rate_charged_amount
        type: number
        source: input
        description: nightly rate actually charged, 2 decimals
        constraints: "> 0"
      - name: room_night_revenue_amount
        type: number
        source: computed
        description: rooms_picked_up * rate_charged_amount rounded to 2 decimals

  - name: BoardReport
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: string
        source: input
        description: inclusive first date of the reporting period, ISO date
      - name: period_end
        type: string
        source: input
        description: exclusive last date of the reporting period, ISO date
      - name: definite_opportunity_count
        type: integer
        source: computed
        description: count of Opportunity rows with sales_stage IN {DEFINITE, SERVICED} AND definite_at in [period_start T00:00:00Z, period_end T00:00:00Z)
        default: 0
      - name: definite_room_nights
        type: integer
        source: computed
        description: sum of Opportunity.definite_room_nights over the same in-window definite set
        default: 0
      - name: lost_opportunity_count
        type: integer
        source: computed
        description: count of Opportunity rows with sales_stage = LOST AND updated_at in the same half-open window
        default: 0
      - name: lost_room_nights_by_reason
        type: object
        source: computed
        description: map from Opportunity.lost_reason to summed total_room_nights_requested over the in-window LOST set; keys with zero total are omitted
        default: {}
      - name: incentive_spend_committed_amount
        type: number
        source: computed
        description: sum of IncentiveDecision.total_charge_amount whose created_at falls in the window AND whose decision IN {APPROVED, REDUCED}
        default: 0
      - name: lodging_tax_recognized_amount
        type: number
        source: computed
        description: sum of lodging tax receipt amounts whose received_at falls in the window
        default: 0
      - name: cost_per_definite_room_night
        type: number
        source: computed
        description: incentive_spend_committed_amount / definite_room_nights rounded to 2 decimals; null when definite_room_nights == 0
        default: null
      - name: attrition_recovered_amount
        type: number
        source: computed
        description: sum of Opportunity.attrition_settlement_amount over opportunities whose sales_stage became SERVICED inside the window
        default: 0
      - name: status
        type: enum
        source: computed
        description: report lifecycle; see state_machines.BoardReport
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant the report was published
        default: null

  - name: LodgingTaxReceipt
    description: "an immutable lodging-tax remittance line credited to an IncentiveFund; the fund's spendable balance and the board report's recognized-revenue figure are both derived from these rows"
    common_fields: false
    parent: IncentiveFund
    fields:
      - name: id
        type: string
        source: system
        description: server-minted identifier
      - name: fund_id
        type: string
        source: input
        description: FK -> IncentiveFund.id; the fund this remittance is credited to
      - name: amount
        type: number
        source: input
        description: remitted lodging-tax amount in dollars
        constraints: "> 0, at most 2 fraction digits"
      - name: received_at
        type: datetime
        source: input
        description: ISO-8601 UTC instant the treasury recognized the remittance; drives the board report's half-open window filter
      - name: created_at
        type: datetime
        source: system
        description: logical-clock instant the row was recorded

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# Opportunity carries TWO independent state dimensions on the same row
# (sales_stage and hold_posture); they are declared as two entries whose
# `dimension:` keys distinguish them, and they advance independently.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Opportunity
    dimension: sales_stage
    initial_state: LEAD
    terminal_states: [SERVICED, LOST]
    transitions:
      - from: LEAD
        to: QUALIFIED
        trigger: "POST /opportunities/{id}/qualify"
        actor: SalesManager
        preconditions:
          - "sales_stage == LEAD"
          - "arrival_date >= clock date + MIN_LEAD_DAYS (180 days)"
        side_effects:
          - "MeetingPlanner.engagement_status set to ENGAGED for planner_id"
          - "MeetingPlanner.last_touch_at set to the current logical clock"
          - "increments Opportunity.version by 1"
        note: "hold_posture is untouched by this transition"
      - from: QUALIFIED
        to: BIDDING
        trigger: "system: BidPackage for this opportunity becomes SUBMITTED via POST /bid-packages/{id}/submit"
        actor: system
        preconditions:
          - "sales_stage == QUALIFIED"
          - "the submitting BidPackage.opportunity_id == this.id"
        side_effects:
          - "MeetingPlanner.last_touch_at set to the current logical clock"
          - "increments Opportunity.version by 1"
      - from: BIDDING
        to: QUALIFIED
        trigger: "system: planner requests a revision via POST /bid-packages/{id}/planner-response with response = REVISION_REQUESTED and BidPackage.round_number < MAX_BID_ROUNDS (3)"
        actor: system
        preconditions:
          - "sales_stage == BIDDING"
          - "BidPackage.status == SUBMITTED"
        side_effects:
          - "the negotiation returns to bid preparation; see state_machines.BidPackage SUBMITTED_to_DRAFT for the fund decommit hop"
          - "increments Opportunity.version by 1"
        note: "cyclic: QUALIFIED -> BIDDING -> QUALIFIED can repeat up to MAX_BID_ROUNDS rounds"
      - from: BIDDING
        to: DEFINITE
        trigger: "system: BidPackage becomes ACCEPTED via POST /bid-packages/{id}/planner-response with response = ACCEPTED"
        actor: system
        preconditions:
          - "sales_stage == BIDDING"
          - "BidPackage.status == SUBMITTED and clock <= BidPackage.response_due_at"
        side_effects:
          - "definite_at stamped with the current logical clock"
          - "definite_room_nights frozen at committed_peak_rooms * event_nights"
          - "CASCADE HOP 2 (hop 1 was BidPackage SUBMITTED->ACCEPTED): because this opportunity became DEFINITE, its FIRST-rank SpaceHold in status HELD or CHALLENGED transitions to CONFIRMED (state_machines.SpaceHold HELD_to_CONFIRMED) and hold_posture becomes CONFIRMED"
          - "CASCADE HOP 3: because that SpaceHold became CONFIRMED, every other SpaceHold on the same center_hall_id in status HELD or CHALLENGED whose buffered window conflicts with it transitions to RELEASED with release_reason = SUPERSEDED_BY_CONFIRMED"
          - "CASCADE HOP 4: because those sibling holds were RELEASED, each of their opportunities' hold_posture becomes RELEASED (dimension hold_posture) once no HELD or CHALLENGED hold of theirs remains; a superseded sibling is always a SECOND-rank hold, and because POST /bid-packages/{id}/submit requires a FIRST-rank hold, such an opportunity is never in sales_stage BIDDING - it stays QUALIFIED and must re-hold space (the BIDDING case of losing the last active hold is covered by POST /space-holds/{id}/release and POST /space-hold-expiry-runs, which set lost_reason = SPACE_UNAVAILABLE)"
          - "CASCADE HOP 3': because this opportunity became DEFINITE, MeetingPlanner.definite_count and MeetingPlanner.lifetime_definite_room_nights are re-derived, then relationship_score_lifetime, relationship_score_rolling_24m and tier are recomputed by calculations.planner_relationship_score"
          - "increments Opportunity.version by 1"
      - from: BIDDING
        to: LOST
        trigger: "system: planner declines via POST /bid-packages/{id}/planner-response with response = DECLINED, or the revision round limit is reached"
        actor: system
        preconditions:
          - "sales_stage == BIDDING"
        side_effects:
          - "lost_reason set to PLANNER_DECLINED_BID for a decline, or REVISION_LIMIT_REACHED when round_number == MAX_BID_ROUNDS and the planner asks for another revision"
          - "CASCADE: every SpaceHold of this opportunity in status HELD or CHALLENGED becomes RELEASED with release_reason = OPPORTUNITY_LOST, which promotes an eligible SECOND hold per calculations.second_hold_promotion_selection"
          - "CASCADE: every RoomBlockCommitment of this opportunity in status INVITED, OFFERED or COMMITTED becomes WITHDRAWN with withdraw_reason = OPPORTUNITY_LOST, which decrements Hotel.committed_peak_rooms and Hotel.committed_room_nights"
          - "CASCADE: the live fund charge is decommitted - IncentiveFund.committed_amount decreases by BidPackage.total_fund_charge_amount and posture is recomputed"
          - "CASCADE: because MeetingPlanner.lost_count changed, relationship_score_lifetime, relationship_score_rolling_24m and tier are recomputed"
          - "hold_posture becomes RELEASED once no non-terminal hold remains"
          - "increments Opportunity.version by 1"
      - from: QUALIFIED
        to: LOST
        trigger: "POST /opportunities/{id}/lose"
        actor: SalesManager
        preconditions:
          - "sales_stage IN {QUALIFIED, BIDDING}"
          - "lost_reason is one of the declared enum members"
        side_effects:
          - "lost_reason set from the request body"
          - "same cascade set as the BIDDING_to_LOST transition (holds released, commitments withdrawn, fund decommitted, planner scores recomputed)"
          - "increments Opportunity.version by 1"
        note: "the same endpoint drives BIDDING -> LOST when a bid is already out"
      - from: BIDDING
        to: LOST
        trigger: "POST /opportunities/{id}/lose"
        actor: SalesManager
        preconditions:
          - "sales_stage == BIDDING"
        side_effects:
          - "the live BidPackage in status DRAFT, INCENTIVE_PENDING, APPROVED or SUBMITTED becomes DECLINED with decline_reason mapped from lost_reason (RATE_TOO_HIGH, INSUFFICIENT_INCENTIVE and LOST_TO_COMPETITOR map through unchanged, every other reason maps to LOST_TO_COMPETITOR)"
          - "same cascade set as the system BIDDING_to_LOST transition"
          - "increments Opportunity.version by 1"
      - from: DEFINITE
        to: SERVICED
        trigger: "system: bubble-up when the last non-terminal ServicingOrder of this opportunity leaves REQUESTED/SCHEDULED via POST /servicing-orders/{id}/deliver or POST /servicing-orders/{id}/cancel, provided at least one order is DELIVERED"
        actor: system
        preconditions:
          - "sales_stage == DEFINITE"
          - "at least one ServicingOrder exists for this opportunity"
          - "every ServicingOrder of this opportunity has status IN {DELIVERED, CANCELLED} and at least one is DELIVERED"
        side_effects:
          - "attrition_settlement_amount recomputed by calculations.attrition_settlement over every COMMITTED commitment"
          - "every RoomBlockCommitment of this opportunity in status COMMITTED becomes RELEASED with withdraw_reason = EVENT_SERVICED, which decrements Hotel.committed_peak_rooms and Hotel.committed_room_nights"
          - "IncentiveFund.committed_amount decreases and disbursed_amount increases by BidPackage.total_fund_charge_amount (the conserved fund identity is preserved), then posture is recomputed"
          - "the opportunity's CONFIRMED SpaceHold becomes RELEASED with release_reason = EVENT_SERVICED and CenterHall.confirmed_hold_count is decremented (state_machines.SpaceHold CONFIRMED -> RELEASED)"
          - "increments Opportunity.version by 1"

  - entity: Opportunity
    dimension: hold_posture
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: TENTATIVE
        trigger: "system: a SpaceHold for this opportunity is created with hold_rank = FIRST, or a SECOND hold of this opportunity is promoted to FIRST"
        actor: system
        preconditions:
          - "the created or promoted hold has status == HELD and hold_rank == FIRST"
        side_effects:
          - "increments Opportunity.version by 1"
        note: "a SECOND-rank hold created for this opportunity leaves hold_posture at its current value; only a FIRST-rank hold makes the posture TENTATIVE"
      - from: TENTATIVE
        to: CHALLENGED
        trigger: "system: another opportunity's SECOND hold challenges this opportunity's FIRST hold via POST /space-holds/{id}/challenge"
        actor: system
        preconditions:
          - "the challenged hold belongs to this opportunity, is hold_rank FIRST and status HELD"
        side_effects:
          - "increments Opportunity.version by 1"
      - from: CHALLENGED
        to: CONFIRMED
        trigger: "system: this opportunity becomes DEFINITE before the challenge_deadline"
        actor: system
        preconditions:
          - "sales_stage transition BIDDING -> DEFINITE fired"
          - "clock <= the FIRST hold's challenge_deadline"
        side_effects:
          - "increments Opportunity.version by 1"
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "system: this opportunity becomes DEFINITE with an unchallenged FIRST hold"
        actor: system
        preconditions:
          - "sales_stage transition BIDDING -> DEFINITE fired"
        side_effects:
          - "increments Opportunity.version by 1"
      - from: CHALLENGED
        to: RELEASED
        trigger: "system: the challenge lapses during POST /space-hold-expiry-runs (clock > challenge_deadline)"
        actor: system
        preconditions:
          - "the FIRST hold of this opportunity has status CHALLENGED and clock > challenge_deadline"
        side_effects:
          - "increments Opportunity.version by 1"
      - from: TENTATIVE
        to: RELEASED
        trigger: "POST /space-holds/{id}/release, POST /space-hold-expiry-runs (clock >= expires_at), or the hold being superseded by a CONFIRMED sibling"
        actor: CenterScheduler | system
        preconditions:
          - "no SpaceHold of this opportunity remains in status HELD or CHALLENGED after the release"
        side_effects:
          - "increments Opportunity.version by 1"
        note: "sales_stage is NOT changed by this transition unless the opportunity was in BIDDING, in which case the sales_stage cascade sets LOST with lost_reason = SPACE_UNAVAILABLE"
      - from: RELEASED
        to: TENTATIVE
        trigger: "system: a replacement SpaceHold with hold_rank = FIRST is created for this opportunity"
        actor: system
        preconditions:
          - "sales_stage IN {QUALIFIED, BIDDING}"
        side_effects:
          - "increments Opportunity.version by 1"
        note: "cyclic: posture can return to TENTATIVE after a release"

  - entity: SpaceHold
    initial_state: HELD
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: null
        to: HELD
        trigger: "POST /space-holds"
        actor: CenterScheduler
        preconditions:
          - "Opportunity.sales_stage IN {QUALIFIED, BIDDING}"
          - "CenterHall.hall_status == AVAILABLE"
          - "move_in_start < move_out_end"
          - "Opportunity.attendance_estimate <= CenterHall.capacity_persons"
          - "no blocking hold on this hall in status CONFIRMED per calculations.hall_occupation_conflict"
          - "fewer than MAX_HELD_HOLDS_PER_BUFFERED_WINDOW (2) blocking holds in status HELD or CHALLENGED"
        side_effects:
          - "hold_rank set to FIRST when the blocking count is 0, SECOND when it is exactly 1"
          - "expires_at stamped clock + FIRST_HOLD_DAYS (90 days) for a FIRST hold, or copied from the single blocking FIRST hold's expires_at for a SECOND hold"
          - "Opportunity.hold_posture becomes TENTATIVE when hold_rank == FIRST"
          - "increments Opportunity.version by 1"
      - from: HELD
        to: CHALLENGED
        trigger: "POST /space-holds/{id}/challenge - the acting SECOND hold challenges the blocking FIRST hold"
        actor: CenterScheduler
        preconditions:
          - "the path hold has hold_rank == SECOND and status == HELD"
          - "a blocking FIRST hold on the same center_hall_id exists in status HELD"
          - "the blocking FIRST hold has challenge_deadline == null"
        side_effects:
          - "the blocking FIRST hold's status becomes CHALLENGED, challenge_deadline stamped clock + CHALLENGE_RESPONSE_DAYS (14 days), challenged_by_space_hold_id set to the acting SECOND hold's id"
          - "the FIRST hold's opportunity hold_posture becomes CHALLENGED"
          - "increments CenterHall.version by 1"
        note: "the acting SECOND hold itself stays HELD; the state change lands on the challenged FIRST hold"
      - from: HELD
        to: CONFIRMED
        trigger: "system: the owning opportunity reaches sales_stage DEFINITE"
        actor: system
        preconditions:
          - "hold_rank == FIRST"
          - "status IN {HELD, CHALLENGED}"
        side_effects:
          - "challenge_deadline cleared to null and challenged_by_space_hold_id cleared to null"
          - "CenterHall.confirmed_hold_count incremented"
          - "every other hold on the same hall in status HELD or CHALLENGED whose buffered window conflicts becomes RELEASED with release_reason = SUPERSEDED_BY_CONFIRMED"
          - "increments CenterHall.version by 1"
      - from: CHALLENGED
        to: CONFIRMED
        trigger: "system: the owning opportunity reaches sales_stage DEFINITE before challenge_deadline"
        actor: system
        preconditions:
          - "hold_rank == FIRST"
          - "clock <= challenge_deadline"
        side_effects:
          - "same side effects as HELD -> CONFIRMED"
          - "increments CenterHall.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /space-holds/{id}/release"
        actor: CenterScheduler
        preconditions:
          - "status IN {HELD, CHALLENGED}"
        side_effects:
          - "release_reason set to SCHEDULER_RELEASE"
          - "CASCADE HOP 2: because a FIRST hold left the active set, calculations.second_hold_promotion_selection picks at most one eligible SECOND hold on the same hall and promotes it to hold_rank FIRST with expires_at re-stamped clock + PROMOTION_HOLD_DAYS (30 days)"
          - "CASCADE HOP 3: because that hold became FIRST and HELD, its opportunity's hold_posture becomes TENTATIVE"
          - "CASCADE HOP 2': because this hold left the active set, the releasing opportunity's hold_posture becomes RELEASED when no HELD or CHALLENGED hold remains for it"
          - "CASCADE HOP 3': because the releasing opportunity lost its last active hold while in sales_stage BIDDING, its sales_stage becomes LOST with lost_reason = SPACE_UNAVAILABLE, which withdraws its commitments and decommits its fund charge"
          - "increments CenterHall.version by 1"
      - from: CHALLENGED
        to: RELEASED
        trigger: "system: POST /space-hold-expiry-runs observes clock > challenge_deadline"
        actor: system
        preconditions:
          - "status == CHALLENGED"
          - "clock > challenge_deadline"
        side_effects:
          - "release_reason set to CHALLENGE_LAPSED"
          - "same promotion and posture cascade as HELD -> RELEASED, so the challenger is promoted to FIRST"
          - "increments CenterHall.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "system: POST /space-hold-expiry-runs observes clock >= expires_at"
        actor: system
        preconditions:
          - "status == HELD"
          - "clock >= expires_at"
        side_effects:
          - "release_reason set to HOLD_EXPIRED"
          - "same promotion and posture cascade as HELD -> RELEASED"
          - "increments CenterHall.version by 1"
        note: "boundary is inclusive: a hold whose expires_at equals the clock expires in that run"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system: the owning opportunity reaches sales_stage SERVICED (bubble-up from the last DELIVERED ServicingOrder) - the event is over, so the hall is handed back"
        actor: system
        preconditions:
          - "status == CONFIRMED"
          - "Opportunity.sales_stage == SERVICED"
        side_effects:
          - "release_reason set to EVENT_SERVICED"
          - "Opportunity.hold_posture stays CONFIRMED - the posture dimension records that citywide space was confirmed for the event and is never rewound by servicing"
          - "CenterHall.confirmed_hold_count decremented"
          - "increments CenterHall.version by 1"
        note: "a CONFIRMED hold is never released by POST /space-holds/{id}/release (that path rejects with ERR_INVALID_HOLD_STATE); the only exit is this bubble-up"

  - entity: RoomBlockCommitment
    initial_state: INVITED
    terminal_states: [WITHDRAWN, RELEASED]
    transitions:
      - from: null
        to: INVITED
        trigger: "POST /room-block-commitments"
        actor: SalesManager
        preconditions:
          - "Opportunity.sales_stage IN {QUALIFIED, BIDDING}"
          - "Hotel.participation_status == PARTICIPATING"
          - "no existing RoomBlockCommitment for the same (opportunity_id, hotel_id) in status INVITED, OFFERED or COMMITTED"
          - "expected_opportunity_version equals the current Opportunity.version"
        side_effects:
          - "increments Opportunity.version by 1"
      - from: INVITED
        to: OFFERED
        trigger: "POST /room-block-commitments/{id}/offer"
        actor: HotelPartner
        preconditions:
          - "status IN {INVITED, OFFERED}"
          - "Hotel.participation_status == PARTICIPATING"
          - "X-User-ID == hotel_id"
        side_effects:
          - "rooms_peak_offered, rate_offered_amount and cutoff_days_before_arrival set from the request"
          - "cutoff_date recomputed as Opportunity.arrival_date - cutoff_days_before_arrival"
          - "offer_round incremented by 1"
      - from: OFFERED
        to: OFFERED
        trigger: "POST /room-block-commitments/{id}/offer (re-offer)"
        actor: HotelPartner
        preconditions:
          - "status == OFFERED"
          - "X-User-ID == hotel_id"
        side_effects:
          - "offer fields overwritten and offer_round incremented by 1"
        note: "self-loop: the property may re-offer any number of times while the bureau has not committed the block"
      - from: OFFERED
        to: COMMITTED
        trigger: "POST /room-block-commitments/{id}/commit"
        actor: SalesManager
        preconditions:
          - "status == OFFERED"
          - "Opportunity.sales_stage IN {QUALIFIED, BIDDING}"
          - "Hotel.participation_status == PARTICIPATING"
          - "rate_offered_amount <= Opportunity.rate_ceiling_amount"
          - "the hotel's nightly aggregate stays within committable_rooms per calculations.hotel_nightly_block_capacity"
        side_effects:
          - "rooms_peak_committed frozen at rooms_peak_offered and committed_room_nights set to rooms_peak_committed * Opportunity.event_nights"
          - "Hotel.committed_peak_rooms and Hotel.committed_room_nights recomputed"
          - "Opportunity.committed_peak_rooms, block_coverage_pct, citywide_cutoff_days_before_arrival and cutoff_alignment_spread_days recomputed by calculations.citywide_block_readiness"
          - "increments Opportunity.version by 1"
      - from: INVITED
        to: WITHDRAWN
        trigger: "POST /room-block-commitments/{id}/withdraw"
        actor: HotelPartner
        preconditions:
          - "status == INVITED"
          - "X-User-ID == hotel_id"
          - "Opportunity.sales_stage != SERVICED"
        side_effects:
          - "withdraw_reason set from the request body; INVITE_DECLINED is the only reason a property may give while the commitment is still INVITED"
          - "no room counters move because rooms_peak_committed was already 0"
          - "increments Opportunity.version by 1"
        note: "declining an invitation never touches Hotel.committed_peak_rooms - this is the short arm of the withdraw path and produces none of the COMMITTED cascade hops"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /room-block-commitments/{id}/withdraw"
        actor: HotelPartner
        preconditions:
          - "status == OFFERED"
          - "X-User-ID == hotel_id"
          - "Opportunity.sales_stage != SERVICED"
        side_effects:
          - "withdraw_reason set from the request body IN {PROPERTY_SOLD_OUT, RATE_DISPUTE}"
          - "no room counters move because rooms_peak_committed was still 0; Opportunity.block_coverage_pct is unchanged"
          - "increments Opportunity.version by 1"
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /room-block-commitments/{id}/withdraw"
        actor: HotelPartner
        preconditions:
          - "status == COMMITTED"
          - "X-User-ID == hotel_id"
          - "Opportunity.sales_stage != SERVICED"
        side_effects:
          - "withdraw_reason set from the request body IN {PROPERTY_SOLD_OUT, RATE_DISPUTE}"
          - "rooms_peak_committed reset to 0 and committed_room_nights reset to 0"
          - "CASCADE HOP 2: because rooms left the block, Hotel.committed_peak_rooms and Hotel.committed_room_nights are recomputed and Opportunity.committed_peak_rooms / block_coverage_pct / cutoff_alignment_spread_days are recomputed"
          - "CASCADE HOP 3: because block_coverage_pct fell below MIN_BLOCK_COVERAGE_PCT (85.00) while a BidPackage of this opportunity is SUBMITTED, that bid returns to DRAFT with round_number incremented and Opportunity.sales_stage returns to QUALIFIED"
          - "CASCADE HOP 4: because that bid left SUBMITTED, its live fund charge is decommitted - IncentiveFund.committed_amount decreases by total_fund_charge_amount, uncommitted_amount rises by the same amount and posture is recomputed"
          - "increments Opportunity.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "system: the owning opportunity reaches SERVICED, or becomes LOST"
        actor: system
        preconditions:
          - "status == COMMITTED"
          - "Opportunity.sales_stage IN {SERVICED, LOST}"
        side_effects:
          - "withdraw_reason set to EVENT_SERVICED or OPPORTUNITY_LOST"
          - "Hotel.committed_peak_rooms and Hotel.committed_room_nights recomputed"
          - "attrition_shortfall_nights and attrition_damages_amount frozen at the values computed by calculations.attrition_settlement"

  - entity: BidPackage
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /bid-packages"
        actor: SalesManager
        preconditions:
          - "Opportunity.sales_stage == QUALIFIED"
          - "no other BidPackage of this opportunity has status IN {DRAFT, INCENTIVE_PENDING, APPROVED, SUBMITTED}"
          - "expected_opportunity_version equals the current Opportunity.version"
        side_effects:
          - "round_number set to 1 and prepared_by_user_id set to the acting X-User-ID"
          - "increments Opportunity.version by 1"
        note: "a new bid package may legitimately supersede a DECLINED one, which is why this create is OCC-guarded on Opportunity.version"
      - from: DRAFT
        to: INCENTIVE_PENDING
        trigger: "POST /bid-packages/{id}/request-incentive"
        actor: SalesManager
        preconditions:
          - "status == DRAFT"
          - "Opportunity.sales_stage == QUALIFIED"
          - "incentive_request_amount > 0"
        side_effects:
          - "incentive_request_amount and service_commitment_codes stored, incentive_requested_by_user_id set to the acting X-User-ID"
          - "a PROVISIONAL EconomicImpactEstimate is created for the opportunity by calculations.economic_impact_estimate"
          - "incentive_cap_amount recomputed by calculations.incentive_cap from that PROVISIONAL snapshot"
        note: "the cap is NOT enforced here - it is enforced against approved_amount at decision time, so a request above the cap reaches the approver and is rejected there"
      - from: INCENTIVE_PENDING
        to: APPROVED
        trigger: "POST /bid-packages/{id}/incentive-decisions with decision IN {APPROVED, REDUCED}"
        actor: IncentiveApprover
        preconditions:
          - "status == INCENTIVE_PENDING"
          - "decided_by_user_id differs from prepared_by_user_id AND from incentive_requested_by_user_id"
          - "IncentiveFund.posture != EXHAUSTED"
          - "approved_amount <= incentive_cap_amount recomputed at decision time"
          - "tax_payback_ratio >= MIN_TAX_PAYBACK_RATIO (3.00)"
          - "total_charge_amount <= IncentiveFund.uncommitted_amount"
        side_effects:
          - "approved_incentive_amount, admin_fee_amount, total_fund_charge_amount and tax_payback_ratio stored on the bid package"
          - "IncentiveFund.committed_amount increases by total_charge_amount, uncommitted_amount falls by the same amount and posture is recomputed"
          - "increments IncentiveFund.version by 1"
      - from: INCENTIVE_PENDING
        to: DRAFT
        trigger: "POST /bid-packages/{id}/incentive-decisions with decision = REJECTED"
        actor: IncentiveApprover
        preconditions:
          - "status == INCENTIVE_PENDING"
          - "decided_by_user_id differs from prepared_by_user_id AND from incentive_requested_by_user_id"
          - "approved_amount == 0"
        side_effects:
          - "incentive_request_amount cleared to null, approved_incentive_amount, admin_fee_amount, total_fund_charge_amount and tax_payback_ratio remain null; no fund charge is created"
          - "increments IncentiveFund.version by 1"
        note: "compensating revert - the bid returns to preparation and may request a smaller incentive without consuming a negotiation round"
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /bid-packages/{id}/submit"
        actor: SalesManager
        preconditions:
          - "status == APPROVED"
          - "Opportunity.sales_stage == QUALIFIED"
          - "Opportunity.block_coverage_pct >= MIN_BLOCK_COVERAGE_PCT (85.00)"
          - "Opportunity.cutoff_alignment_spread_days <= CUTOFF_ALIGNMENT_TOLERANCE_DAYS (2)"
          - "support_letter_type_count >= MIN_DISTINCT_SUPPORT_LETTER_TYPES (2)"
          - "the opportunity has a SpaceHold with hold_rank == FIRST and status IN {HELD, CHALLENGED}"
          - "response_due_at > clock"
        side_effects:
          - "submitted_at stamped with the current logical clock and response_due_at stored"
          - "CASCADE HOP 2: because the bid became SUBMITTED, Opportunity.sales_stage moves QUALIFIED -> BIDDING"
          - "CASCADE HOP 3: because the opportunity was touched, MeetingPlanner.last_touch_at is refreshed"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /bid-packages/{id}/planner-response with response = ACCEPTED"
        actor: MeetingPlanner
        preconditions:
          - "status == SUBMITTED"
          - "clock <= response_due_at"
          - "X-User-ID == Opportunity.planner_id"
        side_effects:
          - "planner_response set to ACCEPTED"
          - "CASCADE HOP 2: because the bid was accepted, Opportunity.sales_stage moves BIDDING -> DEFINITE (see that transition for hops 3 and 4)"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /bid-packages/{id}/planner-response with response = DECLINED"
        actor: MeetingPlanner
        preconditions:
          - "status == SUBMITTED"
          - "clock <= response_due_at"
          - "X-User-ID == Opportunity.planner_id"
        side_effects:
          - "planner_response set to DECLINED and decline_reason stored from the request body"
          - "CASCADE HOP 2: because the bid was declined, Opportunity.sales_stage moves BIDDING -> LOST with lost_reason = PLANNER_DECLINED_BID"
          - "CASCADE HOP 3: because the opportunity became LOST, its holds are released, its commitments are withdrawn and its fund charge is decommitted"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /bid-packages/{id}/planner-response with response = REVISION_REQUESTED and round_number < MAX_BID_ROUNDS (3)"
        actor: MeetingPlanner
        preconditions:
          - "status == SUBMITTED"
          - "clock <= response_due_at"
          - "round_number < MAX_BID_ROUNDS (3)"
        side_effects:
          - "round_number incremented by 1, planner_response set to REVISION_REQUESTED, submitted_at and response_due_at cleared to null"
          - "incentive_request_amount, approved_incentive_amount, admin_fee_amount, total_fund_charge_amount, tax_payback_ratio and incentive_requested_by_user_id cleared to null"
          - "CASCADE HOP 2: because the bid left the committed set, IncentiveFund.committed_amount decreases by the previous total_fund_charge_amount, uncommitted_amount rises by the same amount and posture is recomputed"
          - "CASCADE HOP 3: because the bid returned to preparation, Opportunity.sales_stage moves BIDDING -> QUALIFIED"
        note: "cyclic revision loop; the fund identity budget = uncommitted + committed + disbursed is preserved across the decommit"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /bid-packages/{id}/planner-response with response = REVISION_REQUESTED and round_number == MAX_BID_ROUNDS (3)"
        actor: MeetingPlanner
        preconditions:
          - "status == SUBMITTED"
          - "round_number == MAX_BID_ROUNDS (3)"
        side_effects:
          - "decline_reason set to REVISION_LIMIT_REACHED"
          - "CASCADE: Opportunity.sales_stage moves BIDDING -> LOST with lost_reason = REVISION_LIMIT_REACHED plus the standard lost cascade (holds released, commitments withdrawn, fund decommitted, planner scores recomputed)"
        note: "termination condition of the cycle"
      - from: SUBMITTED
        to: DRAFT
        trigger: "system: a COMMITTED RoomBlockCommitment is withdrawn and block_coverage_pct falls below 85.00"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "Opportunity.block_coverage_pct < MIN_BLOCK_COVERAGE_PCT (85.00) after the withdrawal"
        side_effects:
          - "round_number incremented by 1, submitted_at and response_due_at cleared, fund charge decommitted, Opportunity.sales_stage returns to QUALIFIED"
      - from: DRAFT
        to: DECLINED
        trigger: "system: the owning opportunity becomes LOST via POST /opportunities/{id}/lose"
        actor: system
        preconditions:
          - "status IN {DRAFT, INCENTIVE_PENDING, APPROVED, SUBMITTED}"
          - "Opportunity.sales_stage == LOST"
        side_effects:
          - "decline_reason mapped from Opportunity.lost_reason"
          - "any live fund charge is decommitted"

  - entity: IncentiveFund
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CONSTRAINED
        trigger: "system: recomputed after any change to committed_amount, disbursed_amount or budget_amount"
        actor: system
        preconditions:
          - "0 < uncommitted_amount < budget_amount * FUND_CONSTRAINED_PCT / 100"
        side_effects:
          - "posture stored as CONSTRAINED; approvals remain possible but are bounded by uncommitted_amount"
          - "increments IncentiveFund.version by 1"
        note: "boundary is strict: uncommitted_amount exactly equal to 10.00% of budget_amount keeps posture OPEN"
      - from: CONSTRAINED
        to: EXHAUSTED
        trigger: "system: recomputed after a fund charge is committed"
        actor: system
        preconditions:
          - "uncommitted_amount == 0"
        side_effects:
          - "posture stored as EXHAUSTED; every further incentive decision on any bid package is rejected"
          - "increments IncentiveFund.version by 1"
      - from: EXHAUSTED
        to: CONSTRAINED
        trigger: "system: recomputed after a decommit or a lodging tax receipt"
        actor: system
        preconditions:
          - "0 < uncommitted_amount < budget_amount * FUND_CONSTRAINED_PCT / 100"
        side_effects:
          - "posture stored as CONSTRAINED"
          - "increments IncentiveFund.version by 1"
        note: "cyclic: posture oscillates as charges are committed, decommitted and disbursed"
      - from: CONSTRAINED
        to: OPEN
        trigger: "system: recomputed after a decommit or a lodging tax receipt raises budget_amount"
        actor: system
        preconditions:
          - "uncommitted_amount >= budget_amount * FUND_CONSTRAINED_PCT / 100"
        side_effects:
          - "posture stored as OPEN"
          - "increments IncentiveFund.version by 1"
      - from: OPEN
        to: EXHAUSTED
        trigger: "system: a single fund charge consumes the entire remaining balance"
        actor: system
        preconditions:
          - "uncommitted_amount == 0"
        side_effects:
          - "posture stored as EXHAUSTED"
          - "increments IncentiveFund.version by 1"
      - from: EXHAUSTED
        to: OPEN
        trigger: "system: a decommit or lodging tax receipt restores at least 10.00% of budget_amount"
        actor: system
        preconditions:
          - "uncommitted_amount >= budget_amount * FUND_CONSTRAINED_PCT / 100"
        side_effects:
          - "posture stored as OPEN"
          - "increments IncentiveFund.version by 1"

  - entity: ServicingOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /servicing-orders"
        actor: ServicesManager
        preconditions:
          - "Opportunity.sales_stage == DEFINITE"
          - "window_start < window_end"
          - "requested_units >= 1"
        side_effects: ["none beyond creation"]
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /servicing-orders/{id}/schedule"
        actor: ServicesManager
        preconditions:
          - "status == REQUESTED"
          - "Opportunity.sales_stage == DEFINITE"
          - "1 <= assigned_units <= requested_units"
        side_effects: ["assigned_units stored"]
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /servicing-orders/{id}/deliver"
        actor: ServicesManager
        preconditions:
          - "status == SCHEDULED"
          - "0 <= delivered_units <= assigned_units"
        side_effects:
          - "delivered_units stored"
          - "CASCADE HOP 2: because this was the last non-terminal ServicingOrder of the opportunity, Opportunity.sales_stage moves DEFINITE -> SERVICED (bubble-up)"
          - "CASCADE HOP 3: because the opportunity became SERVICED, every COMMITTED RoomBlockCommitment becomes RELEASED, freeing Hotel.committed_peak_rooms, and attrition_settlement_amount is computed"
          - "CASCADE HOP 4: because the opportunity became SERVICED, the fund charge moves from IncentiveFund.committed_amount to disbursed_amount and posture is recomputed"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /servicing-orders/{id}/cancel"
        actor: ServicesManager
        preconditions:
          - "status IN {REQUESTED, SCHEDULED}"
          - "Opportunity.sales_stage == DEFINITE"
        side_effects:
          - "assigned_units and delivered_units are left as they stand; a CANCELLED order contributes nothing to servicing coverage"
          - "BUBBLE-UP: when this cancellation leaves no ServicingOrder of the opportunity in REQUESTED or SCHEDULED and at least one sibling is DELIVERED, Opportunity moves DEFINITE -> SERVICED with the full SERVICED cascade"
          - "conditional cascade - a DELIVERED order is never cancelled (ERR_INVALID_SERVICING_STATE), so an all-CANCELLED opportunity never bubbles up"

  - entity: BoardReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /board-reports"
        actor: BoardAnalyst
        preconditions:
          - "period_start < period_end"
        side_effects:
          - "every rollup field computed by calculations.board_report_rollup at creation time"
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /board-reports/{id}/publish"
        actor: BoardAnalyst
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "published_at stamped with the current logical clock; rollup figures are frozen and never recomputed again"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned
# mechanism). Each rule is a CREATE-with-supersede where a strictly later
# request would legitimately succeed under the product semantics.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: bid-package-create-stale-opportunity
    parent_entity: Opportunity
    write_endpoint: "POST /bid-packages"
    occ_field: "expected_opportunity_version"
    description: |
      Creating a BidPackage against an Opportunity whose version has advanced
      since the client last read it is rejected. A new bid package may
      legitimately supersede a DECLINED one and every block commitment,
      commit, withdrawal or stage change bumps Opportunity.version, so a
      client preparing a bid from a stale read would price the package against
      a block that no longer exists.
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412
  - rule_id: commitment-invite-stale-opportunity
    parent_entity: Opportunity
    write_endpoint: "POST /room-block-commitments"
    occ_field: "expected_opportunity_version"
    description: |
      Inviting another property into a citywide block requires the client to
      carry the Opportunity.version it last observed. A second invitation is a
      legitimate operation in its own right, so the only deterministic guard
      against assembling a block from a stale coverage view is the version
      check.
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412
  - rule_id: incentive-decision-stale-fund
    parent_entity: IncentiveFund
    write_endpoint: "POST /bid-packages/{id}/incentive-decisions"
    occ_field: "expected_fund_version"
    description: |
      An incentive decision is justified by the fund balance the approver read.
      Decisions on other bid packages, lodging tax receipts and decommits all
      bump IncentiveFund.version, so a decision carrying an outdated fund
      version is rejected rather than charged against a balance that has
      already moved.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: economic_impact_estimate
    trigger: "POST /economic-impact-estimates (explicit recompute), and automatically as a side effect of BidPackage DRAFT -> INCENTIVE_PENDING which always produces the PROVISIONAL variant"
    algorithm: forward_looking | chronological
    formula: |
      # every component is rounded to 2 decimals BEFORE the components are summed
      # (component-level rounding, pinned; do NOT sum raw products then round once)
      PROVISIONAL (forward_looking, planner's own claims):
        room_nights_basis   = Opportunity.total_room_nights_requested
        lodging_spend       = round(room_nights_basis * Opportunity.rate_ceiling_amount, 2)
        delegate_spend      = round(Opportunity.attendance_estimate * Opportunity.event_nights * DELEGATE_DAILY_SPEND, 2)
        exhibitor_spend     = round(Opportunity.exhibit_sqft_requested * EXHIBITOR_SQFT_SPEND, 2)
      FINAL (chronological, what the city actually observed):
        room_nights_basis   = sum(PickupRecord.rooms_picked_up) over the input_set below
        lodging_spend       = sum over PickupRecord of round(rooms_picked_up * rate_charged_amount, 2)
        delegate_person_nights = round(room_nights_basis * OCCUPANCY_PERSONS_PER_ROOM, 0)   # round_half_up to whole persons
        delegate_spend      = round(delegate_person_nights * DELEGATE_DAILY_SPEND, 2)
        confirmed_sqft      = min( sum(CenterHall.exhibit_sqft for SpaceHold of this opportunity with status == CONFIRMED),
                                   Opportunity.exhibit_sqft_requested )
        exhibitor_spend     = round(confirmed_sqft * EXHIBITOR_SQFT_SPEND, 2)
      # shared tail for both variants
      direct_spend_amount     = lodging_spend + delegate_spend + exhibitor_spend
      total_impact_amount     = round(direct_spend_amount * INDIRECT_MULTIPLIER, 2)
      lodging_tax_yield_amount = round(lodging_spend * LODGING_TAX_RATE, 2)
    input_set: |
      PROVISIONAL reads only input fields on the Opportunity row and is valid from sales_stage QUALIFIED onward.
      FINAL reads PickupRecord rows whose room_block_commitment_id belongs to a RoomBlockCommitment of this
      opportunity with status IN {COMMITTED, RELEASED} (WITHDRAWN commitments and their pickup rows are excluded),
      ordered by (night_date ASC, PickupRecord.created_at ASC) for the summation, and SpaceHold rows with
      status == CONFIRMED for the exhibit square footage.
    constants:
      DELEGATE_DAILY_SPEND: "285.00"
      EXHIBITOR_SQFT_SPEND: "4.75"
      INDIRECT_MULTIPLIER: "1.65"
      LODGING_TAX_RATE: "0.15"
      OCCUPANCY_PERSONS_PER_ROOM: "1.6"
    precision: "2 decimal places, round_half_up; delegate_person_nights rounded to 0 decimals round_half_up"
    variants:
      - name: PROVISIONAL
        when: "requested with variant = PROVISIONAL, and always at BidPackage request-incentive time; this is the snapshot that justifies incentive spend"
        difference: "uses the planner's requested room nights valued at the rate ceiling, the planner's attendance estimate over event_nights, and the full requested exhibit square footage"
      - name: FINAL
        when: "requested with variant = FINAL after the event, used for board reporting"
        difference: "uses actual PickupRecord room nights valued at rates actually charged, derives delegates from actual room nights times OCCUPANCY_PERSONS_PER_ROOM instead of the planner's attendance estimate, and caps exhibit square footage at the CONFIRMED hall's rentable area"

  - name: planner_relationship_score
    trigger: "recomputed on MeetingPlanner whenever an owned Opportunity enters DEFINITE, SERVICED or LOST; read through GET /meeting-planners/{id}"
    algorithm: weighted_scoring
    formula: |
      raw = (definite_count_in_scope * 12)
          + min(40, floor(room_nights_in_scope / 500))
          - (lost_count_in_scope * 5)
      score = max(0, min(100, raw))            # integer, no decimals
      tier  = TIER_A if relationship_score_lifetime >= 60
              else TIER_B if relationship_score_lifetime >= 30
              else TIER_C
    input_set: |
      LIFETIME scope: definite_count_in_scope = legacy_definite_count + count(Opportunity with planner_id = P and
      sales_stage IN {DEFINITE, SERVICED}); room_nights_in_scope = legacy_definite_room_nights + sum of
      Opportunity.definite_room_nights over that same set; lost_count_in_scope = count(Opportunity with
      planner_id = P and sales_stage = LOST).
      ROLLING_24M scope: legacy_definite_count and legacy_definite_room_nights are EXCLUDED, and only
      opportunities whose definite_at >= clock - ROLLING_WINDOW_DAYS (730 days) are counted (inclusive lower
      bound); lost_count_in_scope counts LOST opportunities whose updated_at >= clock - 730 days.
    constants:
      ROLLING_WINDOW_DAYS: 730
      TIER_A_SCORE_FLOOR: 60
      TIER_B_SCORE_FLOOR: 30
    precision: "integer score, floor on the room-night term, clamped to [0, 100]"
    variants:
      - name: LIFETIME
        when: "stored in relationship_score_lifetime and is the ONLY variant that derives tier (and therefore the incentive tier rate)"
        difference: "includes migrated legacy CRM counters and every definite ever booked, with no time window"
      - name: ROLLING_24M
        when: "stored in relationship_score_rolling_24m and reported to the board as recent production"
        difference: "drops the legacy counters entirely and only counts definites inside the trailing 730-day window, so identical stored data yields a different number from LIFETIME"

  - name: incentive_cap
    trigger: "side effect of BidPackage DRAFT -> INCENTIVE_PENDING (POST /bid-packages/{id}/request-incentive), stored in BidPackage.incentive_cap_amount, and recomputed at decision time to validate approved_amount"
    algorithm: tiered_pricing
    formula: |
      # (1) marginal room-night band ladder over the REQUESTED room nights
      n = Opportunity.total_room_nights_requested
      band_cap = round( min(n, 5000) * 12.00
                      + max(0, min(n, 15000) - 5000) * 8.00
                      + max(0, n - 15000) * 5.00 , 2)
      # (2) lodging-tax yield ceiling, keyed on the planner's LIFETIME tier
      tier_rate = 0.35 if MeetingPlanner.tier == TIER_A
                  else 0.25 if MeetingPlanner.tier == TIER_B
                  else 0.15
      yield_cap = round(PROVISIONAL EconomicImpactEstimate.lodging_tax_yield_amount * tier_rate, 2)
      # (3) block-coverage factor - a conditional branch on derived block state
      coverage_factor = 1.00 if Opportunity.block_coverage_pct >= 95.00
                        else 0.90 if Opportunity.block_coverage_pct >= 85.00
                        else 0.75
      # (4) nested min/max, then the live fund residual clamp
      incentive_cap_amount = min( round(min(band_cap, yield_cap) * coverage_factor, 2),
                                  IncentiveFund.uncommitted_amount )
    input_set: "the newest PROVISIONAL EconomicImpactEstimate of this opportunity (highest created_at, ties broken by variant ordering PROVISIONAL first), the planner's current tier, the opportunity's current block_coverage_pct, and the uncommitted_amount of the fund named in the decision request; at request-incentive time the fund clamp is skipped because no fund is named yet"
    constants:
      BAND_1_NIGHTS: 5000
      BAND_1_RATE: "12.00"
      BAND_2_NIGHTS: 10000
      BAND_2_RATE: "8.00"
      BAND_3_RATE: "5.00"
      TIER_A_RATE: "0.35"
      TIER_B_RATE: "0.25"
      TIER_C_RATE: "0.15"
      COVERAGE_FULL_PCT: "95.00"
      COVERAGE_PARTIAL_PCT: "85.00"
    precision: "2 decimal places, round_half_up; the coverage factor multiplies the already-rounded min(band_cap, yield_cap)"

  - name: fund_charge_composition
    trigger: "side effect of BidPackage INCENTIVE_PENDING -> APPROVED (POST /bid-packages/{id}/incentive-decisions), stored in IncentiveDecision.admin_fee_amount / total_charge_amount and mirrored onto BidPackage.admin_fee_amount / total_fund_charge_amount"
    algorithm: threshold
    formula: |
      gross = IncentiveDecision.approved_amount
      # EVALUATION ORDER IS PINNED: the fee band is selected from `gross` ONLY.
      fee_rate = 0.05 if gross < 100000.00
                 else 0.04 if gross < 250000.00
                 else 0.03
      admin_fee_amount   = round(gross * fee_rate, 2)
      total_charge_amount = gross + admin_fee_amount
      # The band is NEVER re-derived from total_charge_amount even when adding the
      # fee pushes the total across a band boundary (gross 96000.00 -> fee 4800.00
      # -> total 100800.00; the fee stays 4800.00, it is NOT recomputed as 3840.00).
      tax_payback_ratio = round(PROVISIONAL EconomicImpactEstimate.lodging_tax_yield_amount / total_charge_amount, 2)
    input_set: "the approved_amount on this decision and the newest PROVISIONAL EconomicImpactEstimate of the bid package's opportunity"
    constants:
      FEE_BAND_1_CEILING: "100000.00"
      FEE_BAND_1_RATE: "0.05"
      FEE_BAND_2_CEILING: "250000.00"
      FEE_BAND_2_RATE: "0.04"
      FEE_BAND_3_RATE: "0.03"
      MIN_TAX_PAYBACK_RATIO: "3.00"
    precision: "2 decimal places, round_half_up on both the fee and the payback ratio"

  - name: attrition_settlement
    trigger: "recomputed on every POST /room-block-commitments/{id}/pickup-records and frozen by the Opportunity DEFINITE -> SERVICED transition; stored in RoomBlockCommitment.attrition_damages_amount and Opportunity.attrition_settlement_amount"
    algorithm: aggregation
    formula: |
      per commitment c with status IN {COMMITTED, RELEASED}:
        allowed_nights_c   = floor(c.committed_room_nights * ATTRITION_ALLOWANCE_PCT / 100)
        shortfall_nights_c = max(0, allowed_nights_c - c.picked_up_room_nights)
        damages_c          = round(shortfall_nights_c * c.rate_offered_amount * ATTRITION_DAMAGE_RATE, 2)
      # ROUNDING ORDER IS PINNED: round each commitment's damages to 2 decimals
      # FIRST, then sum the rounded values. Summing raw products and rounding once
      # at the end is WRONG and can differ by cents.
      Opportunity.attrition_settlement_amount = sum over commitments, in (Hotel.name ASC, RoomBlockCommitment.created_at ASC)
                                                order, of damages_c
    input_set: "RoomBlockCommitment rows of the opportunity with status IN {COMMITTED, RELEASED} that have at least one PickupRecord; commitments in INVITED, OFFERED or WITHDRAWN contribute 0.00 and commitments with zero PickupRecord rows are skipped entirely (no shortfall is assessed before any pickup is reported)"
    constants:
      ATTRITION_ALLOWANCE_PCT: "80.00"
      ATTRITION_DAMAGE_RATE: "0.75"
    precision: "2 decimal places, round_half_up per commitment BEFORE the sum; allowed_nights uses floor"

  - name: citywide_block_readiness
    trigger: "recomputed as a side effect of RoomBlockCommitment OFFERED -> COMMITTED, COMMITTED -> WITHDRAWN and COMMITTED -> RELEASED; stored in Opportunity.committed_peak_rooms, block_coverage_pct, citywide_cutoff_days_before_arrival and cutoff_alignment_spread_days"
    algorithm: aggregation
    formula: |
      committed = [c for c in RoomBlockCommitment of this opportunity if c.status == COMMITTED]
      committed_peak_rooms = sum(c.rooms_peak_committed for c in committed)
      block_coverage_pct   = round(committed_peak_rooms * 100 / Opportunity.peak_rooms_requested, 2)
      citywide_cutoff_days_before_arrival = max(c.cutoff_days_before_arrival for c in committed) if committed else 0
      cutoff_alignment_spread_days        = (max(...) - min(c.cutoff_days_before_arrival for c in committed)) if len(committed) >= 2 else 0
    input_set: "only commitments in status COMMITTED; INVITED, OFFERED, WITHDRAWN and RELEASED rows are excluded, so a withdrawal immediately lowers coverage"
    constants:
      MIN_BLOCK_COVERAGE_PCT: "85.00"
      CUTOFF_ALIGNMENT_TOLERANCE_DAYS: 2
    precision: "block_coverage_pct to 2 decimal places, round_half_up; the two cutoff fields are whole days"

  - name: hall_occupation_conflict
    trigger: "evaluated on POST /space-holds before a hold is created, and re-evaluated when a hold becomes CONFIRMED to decide which sibling holds are superseded"
    algorithm: interval_merge
    formula: |
      T = CenterHall.turnaround_hours (hours, from the hall row)
      conflict(a, b) is TRUE iff
        (a.move_in_start - T hours) < b.move_out_end  AND  (b.move_in_start - T hours) < a.move_out_end
      # Single-sided buffer, strict comparisons: two holds on the same hall must be
      # separated by AT LEAST T hours between one hold's move_out_end and the next
      # hold's move_in_start. A candidate whose move_in_start is exactly
      # (existing.move_out_end + T hours) does NOT conflict.
      blocking = [h for h in SpaceHold of this hall if h.status IN {HELD, CHALLENGED, CONFIRMED} and conflict(h, candidate)]
      if any(h.status == CONFIRMED for h in blocking): reject ERR_HALL_WINDOW_CONFLICT
      elif len(blocking) >= 2:                         reject ERR_HALL_HOLD_LIMIT_REACHED
      else: hold_rank = FIRST if len(blocking) == 0 else SECOND
    input_set: "SpaceHold rows on the same center_hall_id in status HELD, CHALLENGED or CONFIRMED; RELEASED and EXPIRED holds never block"
    constants:
      MAX_HELD_HOLDS_PER_BUFFERED_WINDOW: 2
    precision: "instant comparison at millisecond resolution; the buffered comparison is strict (<), so exact adjacency at the buffer edge is allowed"

  - name: hotel_nightly_block_capacity
    trigger: "evaluated on POST /room-block-commitments/{id}/commit"
    algorithm: aggregation
    formula: |
      nights(o) = every date d with arrival_date <= d < departure_date          # half-open, departure night NOT occupied
      for each night d in nights(this commitment's opportunity):
        occupied_d = sum(c.rooms_peak_committed for c in RoomBlockCommitment
                         where c.hotel_id == this.hotel_id and c.status == COMMITTED and d in nights(c.opportunity))
        if occupied_d + this.rooms_peak_offered > Hotel.committable_rooms: reject ERR_HOTEL_CAPACITY_EXCEEDED
      Hotel.committed_peak_rooms = max over all nights d of occupied_d          # aggregate, not a sum across dates
    input_set: "COMMITTED commitments of the same hotel only; two opportunities whose windows merely touch (one's departure_date equals the other's arrival_date) share no occupied night and therefore never contend"
    constants: {}
    precision: "whole rooms; the comparison is `occupied + requested > committable_rooms`, so exact equality with committable_rooms is allowed"

  - name: second_hold_promotion_selection
    trigger: "runs whenever a hold leaves the active set - SpaceHold HELD -> RELEASED, CHALLENGED -> RELEASED, HELD -> EXPIRED - and inside POST /space-hold-expiry-runs"
    algorithm: constraint_propagation
    formula: |
      candidates = [h for h in SpaceHold
                    where h.center_hall_id == released.center_hall_id
                      and h.status == HELD
                      and h.hold_rank == SECOND
                      and conflict(h, released) per calculations.hall_occupation_conflict]
      if candidates is empty: no promotion happens (promoted_count contribution 0)
      winner = sort candidates by (Opportunity.peak_rooms_requested DESC, SpaceHold.created_at ASC)[0]
      winner.hold_rank = FIRST
      winner.expires_at = clock + PROMOTION_HOLD_DAYS (30 days)
      winner.opportunity.hold_posture = TENTATIVE
    input_set: "only HELD SECOND-rank holds on the same hall that conflict with the released hold's buffered window; CHALLENGED, CONFIRMED, RELEASED and EXPIRED holds are never promoted"
    constants:
      PROMOTION_HOLD_DAYS: 30
    precision: "ranking is over entity fields only - peak_rooms_requested then created_at ASC; the resource id is never a decision input"

  - name: board_report_rollup
    trigger: "side effect of POST /board-reports; frozen forever by POST /board-reports/{id}/publish"
    algorithm: aggregation
    formula: |
      window = [period_start T00:00:00.000Z, period_end T00:00:00.000Z)          # half-open
      definite_set = Opportunity where sales_stage IN {DEFINITE, SERVICED} and definite_at in window
      definite_opportunity_count = count(definite_set)
      definite_room_nights       = sum(o.definite_room_nights for o in definite_set)
      lost_set = Opportunity where sales_stage == LOST and updated_at in window
      lost_opportunity_count     = count(lost_set)
      lost_room_nights_by_reason = { reason: sum(o.total_room_nights_requested for o in lost_set with o.lost_reason == reason) }
      incentive_spend_committed_amount = sum(d.total_charge_amount for IncentiveDecision d
                                            where d.created_at in window and d.decision IN {APPROVED, REDUCED})
      lodging_tax_recognized_amount    = sum(r.amount for LodgingTaxReceipt r where r.received_at in window)
      cost_per_definite_room_night = round(incentive_spend_committed_amount / definite_room_nights, 2)
                                     if definite_room_nights > 0 else null
      attrition_recovered_amount   = sum(o.attrition_settlement_amount for o in Opportunity
                                        where sales_stage == SERVICED and updated_at in window)
    input_set: "half-open date window on definite_at for production, on updated_at for lost and serviced sets, and on created_at / received_at for money; rows outside the window are excluded even when their opportunity is in scope"
    constants: {}
    precision: "2 decimal places round_half_up on every money field; cost_per_definite_room_night is null (not 0.00) when definite_room_nights == 0"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority - lowest number wins when
# a single request violates several rules)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present, non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID owns the target resource: HotelPartner's X-User-ID equals RoomBlockCommitment.hotel_id (and PickupRecord's parent commitment's hotel_id); MeetingPlanner's X-User-ID equals the Opportunity.planner_id behind the BidPackage or Opportunity being acted on"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /room-block-commitments/{id}/offer, POST /room-block-commitments/{id}/withdraw, POST /room-block-commitments/{id}/pickup-records, POST /bid-packages/{id}/planner-response"

  - priority: 4
    category: business_referential
    check: "request body conforms to the endpoint's input schema: every required field present, enums are declared members, dates are YYYY-MM-DD, instants are ISO-8601 UTC with a trailing Z, money is a decimal with at most 2 fraction digits and > 0 where the field requires it, integers are within their declared ranges, arrival_date < departure_date, move_in_start < move_out_end, window_start < window_end, period_start < period_end, pagination limit IN [1, 100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every id in the path resolves, validated left-to-right, before any body field is examined"
    error_id: "ERR_PLANNER_NOT_FOUND | ERR_HOTEL_NOT_FOUND | ERR_HALL_NOT_FOUND | ERR_OPPORTUNITY_NOT_FOUND | ERR_SPACE_HOLD_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_BID_PACKAGE_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_SERVICING_ORDER_NOT_FOUND | ERR_BOARD_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "every path containing {id}"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the body resolves: planner_id, supersedes_opportunity_id, opportunity_id, center_hall_id, hotel_id, bid_package_id, fund_id, challenging_space_hold_id, room_block_commitment_id"
    error_id: "ERR_PLANNER_NOT_FOUND | ERR_OPPORTUNITY_NOT_FOUND | ERR_HALL_NOT_FOUND | ERR_HOTEL_NOT_FOUND | ERR_BID_PACKAGE_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_SPACE_HOLD_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every POST carrying an FK in its body"

  - priority: 7
    category: state
    check: "expected_opportunity_version equals the target Opportunity.version (per concurrency_rules bid-package-create-stale-opportunity and commitment-invite-stale-opportunity)"
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412
    applies_to: "POST /bid-packages, POST /room-block-commitments"

  - priority: 8
    category: state
    check: "expected_fund_version equals the target IncentiveFund.version (per concurrency_rule incentive-decision-stale-fund)"
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
    applies_to: "POST /bid-packages/{id}/incentive-decisions"

  - priority: 9
    category: state
    check: "Opportunity.sales_stage is one of the stages the called transition declares in §1.2 (qualify requires LEAD; bid-package create, invite, commit and hold create require QUALIFIED or BIDDING as declared; lose requires QUALIFIED or BIDDING; servicing create requires DEFINITE)"
    error_id: ERR_INVALID_OPPORTUNITY_STAGE
    http_status: 409
    applies_to: "POST /opportunities/{id}/qualify, POST /opportunities/{id}/lose, POST /space-holds, POST /room-block-commitments, POST /room-block-commitments/{id}/commit, POST /bid-packages, POST /servicing-orders"

  - priority: 10
    category: state
    check: "SpaceHold.status is the from-state the called transition declares (challenge requires HELD on the target; release requires HELD or CHALLENGED)"
    error_id: ERR_INVALID_HOLD_STATE
    http_status: 409
    applies_to: "POST /space-holds/{id}/challenge, POST /space-holds/{id}/release"

  - priority: 11
    category: state
    check: "RoomBlockCommitment.status is the from-state the called transition declares (offer requires INVITED or OFFERED; commit requires OFFERED; withdraw requires INVITED, OFFERED or COMMITTED; pickup-records require COMMITTED or RELEASED)"
    error_id: ERR_INVALID_COMMITMENT_STATE
    http_status: 409
    applies_to: "POST /room-block-commitments/{id}/offer, POST /room-block-commitments/{id}/commit, POST /room-block-commitments/{id}/withdraw, POST /room-block-commitments/{id}/pickup-records"

  - priority: 12
    category: state
    check: "BidPackage.status is the from-state the called transition declares (support-letters and request-incentive require DRAFT; incentive-decisions require INCENTIVE_PENDING; submit requires APPROVED; planner-response requires SUBMITTED)"
    error_id: ERR_INVALID_BID_STATE
    http_status: 409
    applies_to: "POST /bid-packages/{id}/support-letters, POST /bid-packages/{id}/request-incentive, POST /bid-packages/{id}/incentive-decisions, POST /bid-packages/{id}/submit, POST /bid-packages/{id}/planner-response"

  - priority: 13
    category: state
    check: "ServicingOrder.status is the from-state the called transition declares (schedule requires REQUESTED; deliver requires SCHEDULED; cancel requires REQUESTED or SCHEDULED)"
    error_id: ERR_INVALID_SERVICING_STATE
    http_status: 409
    applies_to: "POST /servicing-orders/{id}/schedule, POST /servicing-orders/{id}/deliver, POST /servicing-orders/{id}/cancel"

  - priority: 14
    category: state
    check: "BoardReport.status == DRAFT - a PUBLISHED report is frozen and can neither be re-published nor recomputed"
    error_id: ERR_BOARD_REPORT_PUBLISHED
    http_status: 409
    applies_to: "POST /board-reports/{id}/publish"

  - priority: 15
    category: business_safety
    check: "the acting IncentiveApprover's X-User-ID differs from BidPackage.prepared_by_user_id AND from BidPackage.incentive_requested_by_user_id - the officer who assembled or requested the incentive may never decide it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bid-packages/{id}/incentive-decisions"

  - priority: 16
    category: business_safety
    check: "CenterHall.hall_status == AVAILABLE - a hall under renovation accepts no new hold, whatever its capacity or free window"
    error_id: ERR_HALL_UNAVAILABLE
    http_status: 409
    applies_to: "POST /space-holds"

  - priority: 17
    category: business_safety
    check: "Hotel.participation_status == PARTICIPATING - a SUSPENDED property may neither be invited, nor re-offer, nor have an offer committed"
    error_id: ERR_HOTEL_NOT_PARTICIPATING
    http_status: 409
    applies_to: "POST /room-block-commitments, POST /room-block-commitments/{id}/offer, POST /room-block-commitments/{id}/commit"

  - priority: 18
    category: business_temporal
    check: "(Opportunity.arrival_date at 00:00:00Z) - current logical clock >= MIN_LEAD_DAYS (180 days) at qualify time"
    error_id: ERR_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /opportunities/{id}/qualify"

  - priority: 19
    category: business_temporal
    check: "the target SpaceHold has not lapsed: current logical clock < expires_at when it is challenged or released, and clock <= challenge_deadline when a CHALLENGED hold is confirmed"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /space-holds/{id}/challenge, POST /space-holds/{id}/release"

  - priority: 20
    category: business_temporal
    check: "a BidPackage submitted to the planner is answered on time: current logical clock <= BidPackage.response_due_at"
    error_id: ERR_CHALLENGE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bid-packages/{id}/planner-response"

  - priority: 21
    category: business_temporal
    check: "no CONFIRMED SpaceHold on the same center_hall_id conflicts with the candidate's buffered window per calculations.hall_occupation_conflict"
    error_id: ERR_HALL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /space-holds"

  - priority: 22
    category: business_temporal
    check: "fewer than MAX_HELD_HOLDS_PER_BUFFERED_WINDOW (2) holds in status HELD or CHALLENGED already conflict with the candidate's buffered window - the hall sells a FIRST and a SECOND option and nothing beyond"
    error_id: ERR_HALL_HOLD_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /space-holds"

  - priority: 23
    category: business_temporal
    check: "PickupRecord.night_date lies in the half-open range [Opportunity.arrival_date, Opportunity.departure_date) and no PickupRecord already exists for the same (room_block_commitment_id, night_date)"
    error_id: "ERR_PICKUP_NIGHT_OUT_OF_RANGE | ERR_DUPLICATE_PICKUP_NIGHT"
    http_status: 422
    applies_to: "POST /room-block-commitments/{id}/pickup-records"

  - priority: 24
    category: business_constraint
    check: "the challenge is well-formed: challenging_space_hold_id names a SpaceHold in status HELD with hold_rank SECOND, the path hold is HELD with hold_rank FIRST on the same center_hall_id, the two holds' buffered windows conflict per calculations.hall_occupation_conflict, and the two holds belong to different opportunities"
    error_id: ERR_CHALLENGE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /space-holds/{id}/challenge"

  - priority: 25
    category: business_constraint
    check: "Opportunity.attendance_estimate <= CenterHall.capacity_persons AND Opportunity.exhibit_sqft_requested <= CenterHall.exhibit_sqft"
    error_id: ERR_HALL_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /space-holds"

  - priority: 26
    category: business_constraint
    check: "no RoomBlockCommitment for the same (opportunity_id, hotel_id) is already in status INVITED, OFFERED or COMMITTED"
    error_id: ERR_DUPLICATE_COMMITMENT
    http_status: 409
    applies_to: "POST /room-block-commitments"

  - priority: 27
    category: business_constraint
    check: "RoomBlockCommitment.rate_offered_amount <= Opportunity.rate_ceiling_amount and rooms_peak_offered <= Hotel.committable_rooms"
    error_id: ERR_RATE_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /room-block-commitments/{id}/offer, POST /room-block-commitments/{id}/commit"

  - priority: 28
    category: business_constraint
    check: "every night in [arrival_date, departure_date) keeps the hotel's COMMITTED aggregate within Hotel.committable_rooms per calculations.hotel_nightly_block_capacity"
    error_id: ERR_HOTEL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /room-block-commitments/{id}/commit"

  - priority: 29
    category: business_constraint
    check: "the opportunity holds at least one SpaceHold in status HELD, CHALLENGED or CONFIRMED at submit time"
    error_id: ERR_NO_ACTIVE_SPACE_HOLD
    http_status: 422
    applies_to: "POST /bid-packages/{id}/submit"

  - priority: 30
    category: business_constraint
    check: "the bid package carries SupportLetter rows spanning at least MIN_DISTINCT_SUPPORT_LETTER_TYPES (2) distinct letter_type values - two letters of the same type do not satisfy the community-support requirement"
    error_id: ERR_SUPPORT_LETTERS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /bid-packages/{id}/submit"

  - priority: 31
    category: business_constraint
    check: "Opportunity.block_coverage_pct >= MIN_BLOCK_COVERAGE_PCT (85.00) AND Opportunity.cutoff_alignment_spread_days <= CUTOFF_ALIGNMENT_TOLERANCE_DAYS (2)"
    error_id: "ERR_BLOCK_COVERAGE_INSUFFICIENT | ERR_CUTOFF_MISALIGNED"
    http_status: 422
    applies_to: "POST /bid-packages/{id}/submit"

  - priority: 32
    category: business_constraint
    check: "at most one live BidPackage per opportunity - POST /bid-packages is refused while a package of that opportunity is still in DRAFT, INCENTIVE_PENDING, APPROVED or SUBMITTED, which is also how the MAX_BID_ROUNDS (3) ladder is enforced: a revision at round_number 3 declines the existing package instead of opening a fresh one"
    error_id: ERR_BID_ROUND_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /bid-packages"

  - priority: 33
    category: business_constraint
    check: "a FINAL EconomicImpactEstimate requires at least one PickupRecord on a RoomBlockCommitment of the opportunity in status COMMITTED or RELEASED"
    error_id: ERR_ESTIMATE_VARIANT_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /economic-impact-estimates"

  - priority: 34
    category: business_fiscal
    check: "IncentiveFund.posture != EXHAUSTED - an exhausted fund refuses every new charge regardless of amount"
    error_id: ERR_FUND_EXHAUSTED
    http_status: 409
    applies_to: "POST /bid-packages/{id}/incentive-decisions"

  - priority: 35
    category: business_fiscal
    check: "IncentiveDecision.approved_amount <= BidPackage.incentive_cap_amount recomputed at decision time by calculations.incentive_cap"
    error_id: ERR_INCENTIVE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /bid-packages/{id}/incentive-decisions"

  - priority: 36
    category: business_fiscal
    check: "total_charge_amount (approved_amount plus the admin fee from calculations.fund_charge_composition) <= IncentiveFund.uncommitted_amount"
    error_id: ERR_FUND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /bid-packages/{id}/incentive-decisions"

  - priority: 37
    category: business_fiscal
    check: "tax_payback_ratio (PROVISIONAL lodging_tax_yield_amount / total_charge_amount) >= MIN_TAX_PAYBACK_RATIO (3.00)"
    error_id: ERR_TAX_PAYBACK_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /bid-packages/{id}/incentive-decisions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Flat top-level collections (api_prefix "/"): every entity is addressable at
# its own collection, and child rows are read through sub-resource lists.
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the server reads that default and MUST NOT fall back to wall-clock time. Every deadline, expiry, lead-time and window rule in this scaffold reads this logical clock."
    roles: [BureauAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent reads of expires_at / challenge_deadline / window filters are evaluated against the new instant"]

  # --- meeting planners -----------------------------------------------------
  - method: POST
    path: "/meeting-planners"
    description: "Registers a meeting planner (the relationship-management record). Legacy CRM counters may be migrated in at creation time and are visible only to the LIFETIME score variant."
    roles: [BureauAdmin]
    code: 201
    input: ["org_name", "contact_email", "legacy_definite_count?", "legacy_definite_room_nights?"]
    output: MeetingPlanner
    side_effects: ["relationship_score_lifetime, relationship_score_rolling_24m and tier computed by calculations.planner_relationship_score from the legacy counters alone", "engagement_status set to PROSPECT"]

  - method: GET
    path: "/meeting-planners/{id}"
    description: "Reads one planner including both score variants and the derived tier."
    roles: [BureauAdmin, SalesManager, IncentiveApprover, BoardAnalyst]
    code: 200
    input: []
    output: MeetingPlanner
    side_effects: []

  - method: GET
    path: "/meeting-planners"
    description: "Lists planners with optional tier / engagement filters and offset pagination."
    roles: [BureauAdmin, SalesManager, BoardAnalyst]
    code: 200
    input: ["tier?", "engagement_status?", "limit?", "offset?"]
    output: MeetingPlanner[]
    side_effects: []

  # --- hotel community -----------------------------------------------------
  - method: POST
    path: "/hotels"
    description: "Registers a participating hotel with its committable room inventory."
    roles: [BureauAdmin]
    code: 201
    input: ["name", "committable_rooms", "walk_distance_blocks?", "participation_status?"]
    output: Hotel
    side_effects: ["committed_peak_rooms, committed_room_nights and pickup_room_nights initialized to 0"]

  - method: GET
    path: "/hotels/{id}"
    description: "Reads one hotel including its live committed and picked-up aggregates."
    roles: [BureauAdmin, SalesManager, HotelPartner, BoardAnalyst]
    code: 200
    input: []
    output: Hotel
    side_effects: []

  - method: GET
    path: "/hotels"
    description: "Lists hotels with an optional participation filter and offset pagination."
    roles: [BureauAdmin, SalesManager]
    code: 200
    input: ["participation_status?", "limit?", "offset?"]
    output: Hotel[]
