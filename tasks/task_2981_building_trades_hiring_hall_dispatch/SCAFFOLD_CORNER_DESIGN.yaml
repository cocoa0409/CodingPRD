      - name: acceptance_window_closed_is_already_pinned_at_its_boundary
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ACCEPTANCE_WINDOW_CLOSED
          - validations[priority=27]
        excluded_because:
          difficulty_instance: acceptance_deadline_exact_instant_is_inclusive
          rationale: "That §1.8 instance already accepts at exactly issued_at + ACCEPTANCE_WINDOW_HOURS and takes ERR_ACCEPTANCE_WINDOW_CLOSED one millisecond later on the sibling referral, which is the strongest possible trigger for this code; a second looser trigger would only re-test the inequality direction."
      - name: apprentice_ratio_exceeded_is_already_pinned_at_the_cap
        claim_type: violation_to_error
        grounds:
          - errors.ERR_APPRENTICE_RATIO_EXCEEDED
          - validations[priority=36]
        excluded_because:
          difficulty_instance: apprentice_ratio_cap_zero_before_first_journeyworker_accept
          rationale: "The ratio cap's own boundary instance triggers this code while max_apprentices_allowed is still 0 and again once the cap is consumed, so the error is exercised at both edges of the threshold; an extra instance would duplicate the same computation."
      - name: contractor_not_signatory_is_already_covered_by_the_intake_dependency
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CONTRACTOR_NOT_SIGNATORY
          - validations[priority=16]
        excluded_because:
          difficulty_instance: job_request_intake_depends_on_contractor_signatory_state
          rationale: "Intake is refused for DELINQUENT_TRUST_FUNDS and TERMINATED and accepted after reinstatement inside that §1.8 instance, which covers every signatory_status value this code can key on."
      - name: job_request_suspended_is_already_covered_by_the_suspend_resume_cycle
        claim_type: violation_to_error
        grounds:
          - errors.ERR_JOB_REQUEST_SUSPENDED
          - validations[priority=8]
        excluded_because:
          difficulty_instance: job_request_suspend_resume_cycle
          rationale: "That cycle suspends the request through contractor delinquency, takes ERR_JOB_REQUEST_SUSPENDED on issuance, resumes it and issues successfully — the code is triggered and then cleared, which a standalone negative instance cannot show."
      - name: member_not_in_good_standing_is_already_covered_by_the_standing_dependency
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MEMBER_NOT_IN_GOOD_STANDING
          - validations[priority=17]
        excluded_because:
          difficulty_instance: referral_issue_depends_on_member_standing_state
          rationale: "Issuance is refused for a DELINQUENT member and honoured after the standing PATCH restores GOOD_STANDING in that §1.8 instance, so both polarities of priority 17 are already asserted."
      - name: named_call_and_special_skill_allowance_errors_are_already_pinned_at_their_caps
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NAMED_CALL_ALLOWANCE_EXCEEDED
          - errors.ERR_SPECIAL_SKILL_ALLOWANCE_EXCEEDED
          - validations[priority=33]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: named_call_and_skill_allowance_nested_min_max
          rationale: "Both allowance codes are triggered at allowance + 1 and cleared at exactly the allowance inside the nested min/max instance, including the NAMED_CALL_HARD_CAP arm; repeating them here would test the same two comparisons with weaker inputs."
      - name: overlapping_dispatch_is_already_covered_by_the_half_open_interval_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVERLAPPING_DISPATCH
          - validations[priority=31]
        excluded_because:
          difficulty_instance: member_employment_interval_half_open_allows_adjacency
          rationale: "That instance accepts the adjacent acceptance at report_at == the prior dispatch's ended_at and takes ERR_OVERLAPPING_DISPATCH one millisecond earlier, which is exactly the boundary this code exists to defend."
      - name: referral_already_outstanding_is_already_covered_by_the_priority_conflict
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REFERRAL_ALREADY_OUTSTANDING
          - validations[priority=11]
        excluded_because:
          difficulty_instance: outstanding_referral_constraint_beats_registration_state
          rationale: "The code is asserted there in its hardest form — it must win over ERR_REGISTRATION_NOT_ACTIVE for a member whose registration is simultaneously non-REGISTERED — and again at the deadline edge in registration_outstanding_referral_slot_closed_at_deadline."
      - name: reregistration_predecessor_and_window_errors_are_already_covered
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REREGISTRATION_PREDECESSOR_MISMATCH
          - errors.ERR_REREGISTRATION_WINDOW_EXPIRED
          - validations[priority=22]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: reregistration_predecessor_referential_beats_window_temporal
          rationale: "Both codes are triggered in the same §1.8 instance, which additionally pins their relative order when a wrong-member predecessor is supplied outside the LAYOFF_REREG_WINDOW_DAYS window; separate instances would lose that ordering claim."
      - name: reregistration_too_early_is_already_covered_by_the_three_strike_cascade
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REREGISTRATION_TOO_EARLY
          - validations[priority=25]
        excluded_because:
          difficulty_instance: three_strike_refusal_cascade_depth_four
          rationale: "The cooldown that this code enforces is created by the third-strike removal in that cascade, so the instance both sets re_registration_eligible_at and then takes ERR_REREGISTRATION_TOO_EARLY against it — a self-contained trigger here would have to fabricate the same cascade."
      - name: stale_job_request_version_is_covered_by_the_concurrency_layer_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_JOB_REQUEST_VERSION
          - validations[priority=15]
          - concurrency_rules[0]
        excluded_because:
          difficulty_instance: journeyworker_slot_commitment_conserved_across_withdrawal
          rationale: "The §1.2.1 rule's own stale-version trigger is authored in this file's cross_cutting_complexity_layers section (optimistic_concurrency), and the version-churn that makes a stale value inevitable is already produced by the slot-conservation instance; a duplicate 412 trigger in the errors section would add no new claim."
