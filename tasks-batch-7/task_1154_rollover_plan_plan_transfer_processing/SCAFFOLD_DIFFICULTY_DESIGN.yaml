            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1", captures: { st_acc: "$.data.status" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c1}/execute-transfer", payload: {}, as: RolloverProcessor, as_user_id: "proc-2", captures: { err_loans: "$.data.error_id" } }
            - { call: "POST /v1/loans/${loan1}/transfer", payload: { receiving_account_id: "${a1b}" }, as: RolloverProcessor, as_user_id: "proc-1", captures: { loan_status: "$.data.status", loan_acct: "$.data.account_id" } }
            - { call: "POST /v1/rollover-cases/${c1}/execute-transfer", payload: {}, as: RolloverProcessor, as_user_id: "proc-2", captures: { case_done: "$.data.status" } }
          assert:
            - "APPROVE routed the PLAN_TRANSFER case to ACCEPTANCE_PENDING (${st_acc})"
            - "with ACTIVE loan present: execute-transfer -> ERR_LOANS_OUTSTANDING (${err_loans})"
            - "after loan transfer: Loan.${loan1}.status == TRANSFERRED (${loan_status}) and account_id == ${a1b} (${loan_acct})"
            - "identical execute-transfer now succeeds: RolloverCase.${c1}.status == COMPLETED (${case_done})"

      - name: redeposit_credit_requires_active_account
        grounds:
          - state_machines.Redeposit.PENDING_VERIFICATION_to_CREDITED
