            - "Alternative.${alt_st}.levelized_cost_cents_per_mw == 250000000.00"
            - "Alternative.${alt_dr}.levelized_cost_cents_per_mw == 150000000.00"
            - "PlanningStudy.${study}.selected_nta_alternative_id == ${alt_hy}"
            - "PlanningStudy.${study}.need_margin_ratio == 1.1500"
            - "PlanningStudy.${study}.alternatives_screened_in_count == 3"
            - "PlanningStudy.${study}.status == CERTIFIED_SUFFICIENT"
            - "Project.${proj}.stage == ROUTING"

      - name: empty_selector_pool_falls_back_to_rejection
        claim_type: selector_policy
        grounds:
          - calculations.need_case_margin.selector_policy.empty_pool_fallback
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / application_filing_blocked_by_uncertified_study_state
          rationale: "The empty-candidate-pool fallback (ERR_NO_NONTRANSMISSION_ALTERNATIVE leaving the study in ALTERNATIVES_ANALYZED) and its downstream effect on filing are asserted by the named §1.8 instance and by the certification_without_a_non_transmission_candidate_rejected instance in the validations section."

      - name: severe_finding_cascade_depth_four
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Certificate.ACTIVE_to_STOP_WORK
          - calculations.certificate_compliance_index
        excluded_because:
          difficulty_instance: transitive_cascade / severe_finding_cascades_condition_to_posture_to_activity_to_segment
          rationale: "The condition -> index -> posture -> activity -> segment chain is verified end-to-end by the named §1.8 instance."

      - name: intervention_ruling_cascade_into_the_right_of_way_hold
        claim_type: cascading_side_effects
