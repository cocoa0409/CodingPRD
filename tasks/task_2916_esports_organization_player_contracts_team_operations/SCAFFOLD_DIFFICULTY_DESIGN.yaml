# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2916 — Esports Organization Player Contracts & Team Operations
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in an assert: line was computed by executing the
# corresponding §1.3 formula in code (workspace/scratch_scaffold/verify2916.py).
#
# Shared fixture constants used by the chains below:
#   logical clock default            2026-08-01T00:00:00Z
#   league season                    2026-08-01T00:00:00Z .. 2027-07-31T00:00:00Z
#   roster_lock_at                   2026-09-15T00:00:00Z
#   transfer window                  2026-08-05T00:00:00Z .. 2026-08-31T00:00:00Z
#   contract effective_at            2026-08-05T00:00:00Z  (remaining_season_days = 360)
#   PlayerContract.ends_at           2027-07-31T00:00:00Z  (effective_at + 12 * 30 days)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: salary_cap_charge_prorated_vs_full_season_on_organization_budget
        grounds:
          - calculations.salary_cap_charge
          - calculations.org_salary_commitment
          - entities.PlayerContract.fields.provisional_cap_charge_cents
          - entities.PlayerContract.fields.final_cap_charge_cents
          - entities.Organization.fields.uncommitted_salary_cents
          - validations[priority=13]
        distinguishing_aspect: |
          This dual variant lives on the Organization money domain: the same contract charges
          12328767 cents under PRORATED_REMAINING_TERM at acceptance and 12500000 cents under
          FULL_SEASON_EQUIVALENT at league decision, so an organization with a 12400000-cent
          budget passes the acceptance gate and is refused by the SIGN decision gate.
        test_recipe:
          setup:
            - "One league whose season runs 2026-08-01 -> 2027-07-31 with roster_lock_at 2026-09-15"
            - "One organization with annual_salary_budget_cents 12400000 and no contracts yet"
            - "One adult player holding a SENT offer of 12500000 cents for 12 months"
            - "Logical clock at 2026-08-05T00:00:00Z, inside the season and before the roster lock"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7, offer_response_window_hours: 72, max_negotiation_rounds: 3, player_association_levy_bp: 250, association_min_prize_split_bp: 4000, association_max_streaming_hours_per_week: 20, minor_max_weekly_minutes: 1200, adult_max_weekly_minutes: 2700, education_reserved_minutes: 600, minor_age_threshold_years: 18, free_agency_cooldown_days: 14, tryout_required_before_offer: false }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 12400000, org_prize_share_bp: 3500 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "JP", association_member: true, education_enrollment_status: "NOT_ENROLLED" }
              as: Scout
              captures: { p1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 10, tax_residency_code: "US-CA", signing_bonus_cents: 0, buyout_multiplier_bp: 5000 }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /contract-offers/${o1_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "GET /organizations/${org_id}/cap-summary"
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "GET /organizations/${org_id}"
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { org_v: $.data.version }
            - call: "POST /roster-moves"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", move_type: "SIGN", contract_id: "${c1_id}", expected_organization_version: "${org_v}" }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /roster-moves/${m1_id}/decision"
              payload: { decision: "APPROVE", decision_note: "league review" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          assert:
            - "PlayerContract.${c1_id}.provisional_cap_charge_cents == 12328767"
            - "PlayerContract.${c1_id}.final_cap_charge_cents == 12500000"
            - "PlayerContract.${c1_id}.ends_at == 2027-07-31T00:00:00Z"
            - "cap-summary.provisional_committed_cents == 12328767 and cap-summary.final_committed_cents == 12500000 (delta 171233)"
            - "Organization.${org_id}.committed_salary_cents == 12328767 and Organization.${org_id}.uncommitted_salary_cents == 71233"
            - "The accept call returned 201 (PRORATED_REMAINING_TERM 12328767 <= 12400000)"
            - "The decision call returned 422 ERR_SALARY_CAP_EXCEEDED (FULL_SEASON_EQUIVALENT 12500000 > 12400000)"
            - "RosterMove.${m1_id}.move_status == PENDING (the refused decision did not advance it)"

      - name: burnout_score_rolling_7day_vs_season_cumulative_on_player_wellness
        grounds:
          - calculations.burnout_score
          - entities.PlayerContract.fields.burnout_score
          - entities.PlayerContract.fields.season_practice_minutes
          - state_machines.PlayerContract.COMPLIANT_to_WARNED
        distinguishing_aspect: |
          This dual variant lives on the player-wellness domain, not on money: with 1080 held
          practice minutes banked on 2026-08-10..2026-08-12 and the clock moved to
          2026-08-25T00:00:00Z, ROLLING_7DAY scores 50 (its window is empty) while
          SEASON_CUMULATIVE scores 57 (1080 minutes spread over 3 elapsed weeks = 360 per week).
        test_recipe:
          setup:
            - "One league and organization; one adult player under an ACTIVE contract effective 2026-08-05"
            - "One team house with the default 60-minute turnaround buffer and 10 seats"
            - "Three 360-minute blocks on 2026-08-10, 2026-08-11 and 2026-08-12 all completed as HELD"
            - "A wellness report of load 10 and 600 reported streaming minutes against a 10 h/week obligation"
            - "Logical clock finally at 2026-08-25T00:00:00Z, 12 days after the last held block"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7, offer_response_window_hours: 72, max_negotiation_rounds: 3, minor_max_weekly_minutes: 1200, adult_max_weekly_minutes: 2700, education_reserved_minutes: 600, free_agency_cooldown_days: 14, tryout_required_before_offer: false }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000, org_prize_share_bp: 3500 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /organizations/${org_id}/team-houses"
              payload: { name: "Vanguard House", timezone: "UTC", turnaround_buffer_minutes: 60, concurrent_seat_capacity: 10 }
              as: OpsManager
              as_user_id: "${org_id}"
              captures: { house_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "JP", association_member: true, education_enrollment_status: "NOT_ENROLLED" }
              as: Scout
              captures: { p1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 10, tax_residency_code: "US-CA", signing_bonus_cents: 0, buyout_multiplier_bp: 5000 }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers/${o1_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "SCRIM", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T16:00:00Z", participant_player_ids: ["${p1_id}"] }
              as: CoachingStaff
              captures: { b1_id: $.data.id }
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "SCRIM", starts_at: "2026-08-11T10:00:00Z", ends_at: "2026-08-11T16:00:00Z", participant_player_ids: ["${p1_id}"] }
              as: CoachingStaff
              captures: { b2_id: $.data.id }
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "SCRIM", starts_at: "2026-08-12T10:00:00Z", ends_at: "2026-08-12T16:00:00Z", participant_player_ids: ["${p1_id}"] }
              as: CoachingStaff
              captures: { b3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /practice-blocks/${b1_id}/complete"
              as: CoachingStaff
            - call: "POST /practice-blocks/${b2_id}/complete"
              as: CoachingStaff
            - call: "POST /contracts/${c1_id}/wellness-report"
              payload: { last_self_reported_load: 10, reported_streaming_minutes_7d: 600 }
              as: PerformanceSupport
            - call: "POST /practice-blocks/${b3_id}/complete"
              as: CoachingStaff
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /contracts/${c1_id}/obligation-summary"
              as: PerformanceSupport
          assert:
            - "obligation-summary.burnout_score == 50 (ROLLING_7DAY over an empty 2026-08-18..2026-08-25 window)"
            - "obligation-summary.season_burnout_score == 57 (SEASON_CUMULATIVE: 1080 minutes / 3 weeks = 360)"
            - "obligation-summary.season_burnout_score - obligation-summary.burnout_score == 7"
            - "PlayerContract.${c1_id}.season_practice_minutes == 1080"
            - "PlayerContract.${c1_id}.burnout_score == 70 (the value persisted by the last write, not recomputed by the read)"
            - "PlayerContract.${c1_id}.obligation_status == WARNED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: weekly_hour_cap_nested_min_with_minor_and_education_branches
        grounds:
          - calculations.weekly_hour_cap
          - calculations.player_minor_status
          - entities.Player.fields.guardian_weekly_cap_minutes
          - entities.Player.fields.education_enrollment_status
          - entities.League.fields.education_reserved_minutes
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): cap_minutes is a four-input non-linear formula —
          min(League.minor_max_weekly_minutes=1200, guardian_weekly_cap_minutes=1080) minus a
          conditional 600-minute education reserve, then compared against scheduled plus
          streaming minutes — so the same 181-minute request is refused at cap 480 and admitted
          at cap 1080 after only education_enrollment_status changes.
        test_recipe:
          setup:
            - "One league with minor_max_weekly_minutes 1200, education_reserved_minutes 600, minor_age_threshold_years 18"
            - "A 16-year-old player with GRANTED guardian consent and guardian_weekly_cap_minutes 1080"
            - "That player is ENROLLED_FULL_TIME and holds an ACTIVE contract with streaming_hours_per_week 5 (300 committed minutes)"
            - "One team house with 10 seats; the ISO week starting Monday 2026-08-10 has no blocks yet"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7, offer_response_window_hours: 72, minor_max_weekly_minutes: 1200, adult_max_weekly_minutes: 2700, education_reserved_minutes: 600, minor_age_threshold_years: 18, tryout_required_before_offer: false }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000, org_prize_share_bp: 3500 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /organizations/${org_id}/team-houses"
              payload: { name: "Vanguard House", timezone: "UTC", turnaround_buffer_minutes: 60, concurrent_seat_capacity: 10 }
              as: OpsManager
              as_user_id: "${org_id}"
              captures: { house_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ilya Novak", birth_date: "2010-02-20", region_code: "US", association_member: false, education_enrollment_status: "ENROLLED_FULL_TIME" }
              as: Scout
              captures: { p3_id: $.data.id }
            - call: "POST /players/${p3_id}/guardian-consent"
              payload: { guardian_name: "Vera Novak", guardian_email: "vera@example.com", guardian_weekly_cap_minutes: 1080 }
              as: GuardianRepresentative
              as_user_id: "${p3_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${p3_id}", base_salary_cents: 4000000, term_months: 12, prize_split_player_pct_bp: 4200, streaming_hours_per_week: 5, tax_residency_code: "US-CA", signing_bonus_cents: 0, buyout_multiplier_bp: 5000 }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers/${o3_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p3_id}"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "INDIVIDUAL", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T13:01:00Z", participant_player_ids: ["${p3_id}"] }
              as: CoachingStaff
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "INDIVIDUAL", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T13:00:00Z", participant_player_ids: ["${p3_id}"] }
              as: CoachingStaff
              captures: { b1_id: $.data.id }
            - call: "PATCH /players/${p3_id}"
              payload: { education_enrollment_status: "NOT_ENROLLED" }
              as: GuardianRepresentative
              as_user_id: "${p3_id}"
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "INDIVIDUAL", starts_at: "2026-08-11T10:00:00Z", ends_at: "2026-08-11T15:00:00Z", participant_player_ids: ["${p3_id}"] }
              as: CoachingStaff
              captures: { b2_id: $.data.id }
          assert:
            - "Player.${p3_id}.is_minor == true and Player.${p3_id}.age_years == 16"
            - "The 181-minute request returned 422 ERR_EDUCATION_HOURS_RESERVED (181 + 300 = 481 > cap 480, and it would have passed at cap 1080)"
            - "The 180-minute request returned 201 (180 + 300 = 480 == cap 480 is admitted)"
            - "PracticeBlock.${b1_id}.duration_minutes == 180 and PracticeBlock.${b1_id}.block_status == SCHEDULED"
            - "After education_enrollment_status becomes NOT_ENROLLED the 300-minute request returned 201"
            - "PracticeBlock.${b2_id}.duration_minutes == 300 (scheduled 480 + streaming 300 = 780 <= cap 1080)"

      - name: prize_allocation_floor_per_row_then_remainder_rounding_order
        grounds:
          - calculations.prize_allocation
          - entities.PrizeAllocation.fields.gross_share_cents
          - entities.PrizeAllocation.fields.withholding_cents
          - entities.PrizeAllocation.fields.escrow_holdback_cents
          - state_machines.PrizeDistribution.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Mode (b): the scaffold pins floor-per-row-then-remainder-to-the-largest-row, so the
          4000/4500/4200 basis-point split of a 6337500-cent pool is 1996062 / 2245572 / 2095866;
          rounding each row half-up instead would produce 1996063 / 2245571 / 2095866, and the
          per-row withholding is computed from the post-remainder gross_share_cents, never from
          the pre-remainder floor.
        test_recipe:
          setup:
            - "One league with player_association_levy_bp 250; one organization in US-CA with org_prize_share_bp 3500"
            - "Three ACTIVE contracts effective 2026-08-05 with prize_split_player_pct_bp 4000, 4500 and 4200"
            - "The 4500 contract belongs to a KR tax resident; the 4200 contract belongs to a 16-year-old minor with granted consent"
