            - { call: "POST /payment-integrity/claims/${cadj_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 5000 }, as: Provider, as_user_id: "${padj_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${cadj_id}/run-edits", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); claim stays RECEIVED"

      - name: reviewer_cannot_assign_tasks
        claim_type: role_denied
        grounds:
          - errors[ERR_UNAUTHORIZED_ROLE]
          - roles.SeniorReviewer
        distinguishing_aspect: "assign is SeniorReviewer-exclusive; a Reviewer caller gets ERR_UNAUTHORIZED_ROLE even when the assignee is themselves."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim 10000 with a PENDING task"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-AS", name: "Assign Prov" }, as: PlanAdmin, captures: { pas_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "AS-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { ras_id: $.data.id, ras_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${ras_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vas_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vas_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vas_id}/approve", payload: { expected_edit_rule_version: "${ras_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "AS1", provider_id: "${pas_id}", member_id: "M-AS1", claim_type: PROFESSIONAL, total_billed_cents: 10000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pas_id}", captures: { cas_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cas_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000 }, as: Provider, as_user_id: "${pas_id}" }
            - { call: "POST /payment-integrity/claims/${cas_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cas_id}" }, as: Any, captures: { tas_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /payment-integrity/review-tasks/${tas_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: Reviewer, as_user_id: rev-1, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); task stays PENDING"
  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_rule_version_on_approve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[edit-approve-stale-rule-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The approve OCC rule: after one approve advances EditRule.version to 2, a second approve still carrying the observed version 1 is rejected with ERR_STALE_VERSION (412) — deterministically, by two strictly sequential requests."
        test_recipe:
          setup: ["edit rule RO; version A approved (rule version now 2); version B submitted, still PENDING_APPROVAL"]
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "OCC-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { ro_id: $.data.id, ro_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${ro_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny A", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vo_a_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vo_a_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vo_a_id}/approve", payload: { expected_edit_rule_version: "${ro_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/edit-rules/${ro_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny B", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vo_b_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vo_b_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${vo_b_id}/approve", payload: { expected_edit_rule_version: "${ro_v}" }, as: EditApprover, as_user_id: approver-1, captures: { err_id: $.data.error_id } }
            - { call: "GET /payment-integrity/edit-rules/${ro_id}", payload: {}, as: Any, captures: { ro_v2: $.data.version } }
            - { call: "POST /payment-integrity/edit-versions/${vo_b_id}/approve", payload: { expected_edit_rule_version: "${ro_v2}" }, as: EditApprover, as_user_id: approver-1, captures: { ob_err: $.data.error_id } }
          assert:
            - "approve of B with the stale version (${ro_v} observed before A's approve) fails with ERR_STALE_VERSION (412)"
            - "re-reading the rule (version 2) and retrying does NOT 412; it fails instead with ERR_EDIT_WINDOW_OVERLAP (409) — proving the 412 was the OCC check, not the overlap check"

      - name: occ_stale_claim_version_on_dispute_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispute-create-stale-claim-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The dispute-create OCC rule: a claim with two CONFIRMED hits accepts a dispute on hit 1 (bumping Claim.version), then rejects a dispute on hit 2 carrying the pre-first-dispute version with ERR_STALE_VERSION (412) — the hit is valid, the claim state is valid, only the version is stale."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim with two lines (30000 each) -> two hits, both tasks upheld -> claim DENIED"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-OC2", name: "Occ Prov" }, as: PlanAdmin, captures: { poc2_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "OCC-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { roc_id: $.data.id, roc_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${roc_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { voc_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${voc_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${voc_id}/approve", payload: { expected_edit_rule_version: "${roc_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "OC2", provider_id: "${poc2_id}", member_id: "M-OC2", claim_type: PROFESSIONAL, total_billed_cents: 60000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${poc2_id}", captures: { coc2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${coc2_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${poc2_id}" }
            - { call: "POST /payment-integrity/claims/${coc2_id}/lines", payload: { line_number: 2, procedure_code: "99214", billed_cents: 30000 }, as: Provider, as_user_id: "${poc2_id}" }
            - { call: "POST /payment-integrity/claims/${coc2_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${coc2_id}" }, as: Any, captures: { toc_a_id: "$.data[0].id", toc_b_id: "$.data[1].id" } }
            - { call: "POST /payment-integrity/review-tasks/${toc_a_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${toc_a_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/review-tasks/${toc_b_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${toc_b_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${coc2_id}", payload: {}, as: Any, captures: { coc2_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${coc2_id}/edit-hits", payload: {}, as: Any, captures: { hoc_a_id: "$.data[0].id", hoc_b_id: "$.data[1].id" } }
          trigger:
            - { call: "POST /payment-integrity/claims/${coc2_id}/disputes", payload: { edit_hit_id: "${hoc_a_id}", reason: "first dispute", expected_claim_version: "${coc2_v}" }, as: Provider, as_user_id: "${poc2_id}", captures: { doc_a_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${coc2_id}/disputes", payload: { edit_hit_id: "${hoc_b_id}", reason: "second dispute with stale version", expected_claim_version: "${coc2_v}" }, as: Provider, as_user_id: "${poc2_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "first dispute created (201) — it legitimately opens and bumps Claim.version"
            - "second create with the same observed version fails with error_id == ERR_STALE_VERSION (412)"

      - name: version_pinning_keeps_original_edit_version
        claim_type: version_pinning_on_approval
        grounds:
          - entities.EditHit.fields.edit_version_id
          - state_machines.EditVersion.ACTIVE_to_RETIRED
        distinguishing_aspect: "A hit stays pinned to the version that fired it: after the hit resolves and version A is RETIRED while version B becomes ACTIVE, the historical hit's edit_version_id still equals A — mid-flight library changes never rewrite screening history."
        test_recipe:
          setup: ["provider; rule RP; version A ACTIVE; claim 30000 screened (hit pinned to A) and upheld; A retired; version B approved ACTIVE"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-VP", name: "Pin Prov" }, as: PlanAdmin, captures: { pvp_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "PIN-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rvp_id: $.data.id, rvp_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rvp_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny A", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vvp_a_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vvp_a_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vvp_a_id}/approve", payload: { expected_edit_rule_version: "${rvp_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "VP1", provider_id: "${pvp_id}", member_id: "M-VP1", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pvp_id}", captures: { cvp_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cvp_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${pvp_id}" }
            - { call: "POST /payment-integrity/claims/${cvp_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cvp_id}" }, as: Any, captures: { tvp_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tvp_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tvp_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/edit-versions/${vvp_a_id}/retire", payload: {}, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/edit-rules/${rvp_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny B", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vvp_b_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vvp_b_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "GET /payment-integrity/edit-rules/${rvp_id}", payload: {}, as: Any, captures: { rvp_v2: $.data.version } }
            - { call: "POST /payment-integrity/edit-versions/${vvp_b_id}/approve", payload: { expected_edit_rule_version: "${rvp_v2}" }, as: EditApprover, as_user_id: approver-1 }
          trigger:
            - { call: "GET /payment-integrity/claims/${cvp_id}/edit-hits", payload: {}, as: Any, captures: { hvp_pin: "$.data[0].edit_version_id", hvp_st: "$.data[0].status" } }
          assert:
            - "EditHit.edit_version_id == ${vvp_a_id} (the RETIRED version), NOT ${vvp_b_id}"
            - "EditHit.status == CONFIRMED and its attributed_savings_cents == 30000 are unchanged by the library transition"

      - name: claims_filter_pagination_interaction
        claim_type: pagination_with_filtering
        grounds:
          - entities.Claim.fields.status
          - entities.Claim.fields.provider_id
        distinguishing_aspect: "Filter + default pagination interact correctly: status=PENDED returns exactly the one pended claim with total_count 1 and has_more false at the default limit 10; the unfiltered provider list reports total_count 2."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim P1 (30000, hit -> PENDED); claim P2 (5000, clean -> READY_TO_PAY)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-PG", name: "Page Prov" }, as: PlanAdmin, captures: { ppg_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "PG-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rpg_id: $.data.id, rpg_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rpg_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vpg_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vpg_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vpg_id}/approve", payload: { expected_edit_rule_version: "${rpg_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "PG1", provider_id: "${ppg_id}", member_id: "M-PG1", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${ppg_id}", captures: { cpg1_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cpg1_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${ppg_id}" }
            - { call: "POST /payment-integrity/claims/${cpg1_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "PG2", provider_id: "${ppg_id}", member_id: "M-PG2", claim_type: PROFESSIONAL, total_billed_cents: 5000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${ppg_id}", captures: { cpg2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cpg2_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 5000 }, as: Provider, as_user_id: "${ppg_id}" }
            - { call: "POST /payment-integrity/claims/${cpg2_id}/run-edits", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "GET /payment-integrity/claims", payload: { provider_id: "${ppg_id}", status: PENDED }, as: Any, captures: { pg_first: "$.data[0].id" } }
            - { call: "GET /payment-integrity/claims", payload: { provider_id: "${ppg_id}" }, as: Any }
          assert:
            - "filtered list: total_count == 1, has_more == false, data[0].id == ${cpg1_id} (the PENDED claim), default limit 10 applied"
            - "unfiltered provider list: total_count == 2"
  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: run_edits_response_immediately_reflects_screening
        claim_type: immediate_consistency
        grounds:
          - state_machines.Claim.RECEIVED_to_PENDED
          - entities.Claim.fields.denied_amount_cents
        distinguishing_aspect: "Immediate consistency: the run-edits 200 response body itself carries the post-screening status and dollar fields (PENDED, allowed 0, denied 40000) — no re-read is needed to observe the mutation."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim with one 40000 line"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-IM", name: "Imm Prov" }, as: PlanAdmin, captures: { pim_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "IM-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rim_id: $.data.id, rim_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rim_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vim_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vim_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vim_id}/approve", payload: { expected_edit_rule_version: "${rim_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "IM1", provider_id: "${pim_id}", member_id: "M-IM1", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pim_id}", captures: { cim_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cim_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pim_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${cim_id}/run-edits", payload: {}, as: PlanAdmin, captures: { im_st: $.data.status, im_al: $.data.allowed_amount_cents, im_dn: $.data.denied_amount_cents, im_ver: $.data.version } }
          assert:
            - "run-edits response data: status == PENDED, allowed_amount_cents == 0, denied_amount_cents == 40000, version incremented by exactly 1 from creation"

  # =========================================================================
  # Stubs — corners already exercised by §1.8 difficulty instances
  # =========================================================================
  - section: state_machines
    instances:
      - name: auto_ibr_creation_on_high_dollar_claim
        claim_type: side_effect_execution
        grounds: [state_machines.ItemizedBillReview.initial_state, calculations.high_dollar_evaluation]
        excluded_because:
          difficulty_instance: run_edits_high_dollar_ibr_chain
          rationale: "Auto-creation, REQUESTED initial state, due_at = now + 30 days, and the open_ibr_count increment are asserted as hops 2-3 of the named §1.8 instance."
      - name: edit_auto_suspension_on_fp_breach
        claim_type: side_effect_execution
        grounds: [state_machines.EditVersion.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: dispute_overturn_cascades_to_edit_suspension
          rationale: "The system-actor auto-suspension transition (and its task-cancellation side effect) is the asserted outcome of the named §1.8 cascade instance."
  - section: calculations
    instances:
      - name: savings_dual_variant_correct_results
        claim_type: correct_result
        grounds: [calculations.savings_measurement]
        excluded_because:
          difficulty_instance: savings_provisional_vs_finalized
          rationale: "Both variants' exact values (180000 vs 90000) are asserted by the named §1.8 instance."
      - name: drg_transfer_proration_branch
        claim_type: correct_result
        grounds: [calculations.drg_base_payment]
        excluded_because:
          difficulty_instance: drg_payment_outlier_and_transfer
          rationale: "The TRANSFER per-diem min() branch (600000) is asserted by the named §1.8 instance; this corner adds only the outlier-cap branch, kept as drg_outlier_cap_binds_at_twenty_percent."
      - name: abrasion_medium_tier_semantics
        claim_type: constants_applied
        grounds: [calculations.provider_abrasion_index]
        excluded_because:
          difficulty_instance: abrasion_standard_vs_regulatory
          rationale: "Tier thresholds (MEDIUM at 0.4000, tier keyed on standard_index only) are asserted by the named §1.8 instance."
  - section: validations
    instances:
      - name: dispute_decide_state_temporal_dual_failure
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: decided_dispute_past_deadline_state_beats_temporal
          rationale: "The state-vs-temporal priority conflict is the named §1.8 instance itself."
