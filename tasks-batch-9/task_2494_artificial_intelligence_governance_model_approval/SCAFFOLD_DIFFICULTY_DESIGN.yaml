      - name: sev1_incident_cascades_posture_to_suspension_to_stale_binding
        grounds: "Reporting one SEV1 incident re-derives calculations.monitoring_posture_derivation to IMPAIRED (hop 1), the IMPAIRED posture fires SM UseCase's APPROVED -> SUSPENDED row (hop 2), and that suspension fires SM ModelBinding's PINNED -> STALE row with superseded_reason APPROVAL_SUSPENDED (hop 3). None of the three writes is requested by the caller, who only filed an incident report."
        distinguishing_aspect: "depth 3 from a DIFFERENT trigger family - a monitoring event on an already-approved system rather than a governance decision - and the cascade is driven by a DERIVED field (posture) rather than by a counter reaching zero. It also demonstrates cascade asymmetry: the same chain does NOT move the inventory reach total, because SUSPENDED is inside INVENTORY_STATUSES, whereas the revoke cascade removes the reach."
        test_recipe:
          setup: "Approve a LIMITED-tier use case over a first-party asset with the short chain: no vendor assessment (is_third_party false), no jurisdictions (so no notices), gates [PRIVACY, BUSINESS], one PASSED BIAS evaluation. After approval final_risk_tier is LIMITED, so TIER_SPEED_FACTOR is 1.0."
