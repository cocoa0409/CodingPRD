              as: ScholarshipCoordinator
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles"
              payload: { program_id: "${p_id}", label: "I1C", starts_on: "2026-09-16", ends_on: "2026-10-15", quorum_count: 1, selection_quota: 1 }
              as: ScholarshipCoordinator
