            - call: "POST /mi/financial-filings/${d11_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - *d1_approve
            - *c_case
            - *c_appraisal
            - *c_appraisal_accept
            - *c_submit
            - *c_endorse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mi/loan-cases/${c_case_id}/post-endorsement-reviews"
              payload: { scope_codes: ["UNDERWRITING"] }
              as: FhaReviewer
              as_user_id: "rev-alpha"
              captures: { d11_error: $.data.error_id }
          assert:
            - "captured ${d11_error} == ERR_REVIEWER_CONFLICT (not ERR_REVIEW_WINDOW_PASSED)"
            - "no PostEndorsementReview row exists for the case"

  - rule_id: boundary_precision_check
    instances:
      - name: net_worth_exactly_at_floor_passes_approval
        grounds:
          - calculations.required_net_worth
          - validations[priority=12]
          - state_machines.Lender.FIELD_REVIEW_to_APPROVED
        distinguishing_aspect: "Numeric threshold boundary on the APPROVE endpoint: adjusted_net_worth_cents exactly equal to required_net_worth_cents (100000000) passes with >=, and the liquidity boundary liquid*5 == floor also binds exactly (20000000*5 == 100000000) — one cent less in either would fail with distinct errors."
