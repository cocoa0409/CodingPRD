        grounds:
          - validations.priority_19
          - errors.ERR_FACILITY_SANITATION_NOT_VALIDATED
          - state_machines.Facility.sanitation_dimension.VALIDATED_to_EXPIRED
          - entities.Facility.fields.sanitation_expires_on
          - entities.Certificate.fields.issued_on
          - endpoints."POST /gfco/surveillance-runs"
          - endpoints."POST /gfco/certificates"
        distinguishing_aspect: |
          Certificate issuance depends on the state of an entity two hops away that the caller never
          names: the Product's Facility sanitation dimension. Everything about the product is
          perfect - formula CLEARED, testing plan active, label APPROVED at the requested tier, the
          facility's last closed audit CLOSED_PASS, posture 100, the OCC version exact - yet the
          write must fail because a surveillance sweep at 2027-08-04 observed sanitation_expires_on
          2027-08-03 and moved the facility to EXPIRED. Nothing may be persisted: no certificate
          row, no fee, no cycle start, no product version bump.
        test_recipe:
          setup:
            - "One applicant, one facility with shared equipment whose sanitation validation was recorded on 2026-08-03 (so sanitation_expires_on is 2027-08-03), one approved INHERENTLY_GF ingredient whose ALLERGEN_STATEMENT expires 2029-07-01."
