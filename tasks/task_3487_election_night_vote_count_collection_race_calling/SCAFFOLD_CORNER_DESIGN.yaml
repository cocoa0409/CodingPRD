              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 2, candidate_votes: [{ candidate_id: "${cand_w}", votes: 1000 }, { candidate_id: "${cand_t}", votes: 800 }], expected_contest_version: "${cv_b}" }
