  - name: after_action_metrics_exclude_unfounded_incidents_and_tentative_rows
    claim_type: aggregation
    grounds:
    - calculations.after_action_metrics
    - calculations.after_action_metrics.input_set
    - entities.AfterActionReview.fields.no_show_rate
    - entities.AfterActionReview.fields.coverage_shortfall_minutes
    distinguishing_aspect: |
      after_action_metrics is the widest aggregation in §1.3 and the only one that must EXCLUDE rows rather than include them: CLOSED_UNFOUNDED incidents drop out of both incident counters, and the shortfall numerator counts only duty_status IN {ON_POST, RELIEVED} so that a post covered by a BRIEFED-but-never-checked-in guard and a post covered by a NO_SHOW guard both contribute their full 450-minute window — while that same NO_SHOW row stays in the no_show_rate DENOMINATOR because it is still CONFIRMED.
    test_recipe:
      setup:
      - logical clock at 2026-09-12T22:30:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - StaffingPlan ACTIVATED with budget_cents 500000 and six posts S1/P1/I1/I2/F1/E1 over 2026-09-12T15:00:00Z..22:30:00Z, one guard each (required_total_staff 6)
      - 'two ScreeningLane rows on the event: BAG_CHECK (nominal 195 pph) and EXPRESS_NO_BAG (nominal 455 pph), operator_capacity 1 each, created in that order'
      - 'six VERIFIED guards at base_hourly_rate_cents 2200, all six assignments CONFIRMED and BRIEFED: committed_cost_cents 99000, committed_guard_hours 45.00, coverage_ratio 1.00, readiness_posture READY'
      - clock advanced to 2026-09-12T16:30:00Z, then a_s1/a_i1/a_i2/a_e1 checked in, both lanes OPEN and the event moved to DOORS_OPEN; a_p1 stayed BRIEFED and a_f1 was marked NO_SHOW
      - 'at 18:00 two DensityReading rows: ZF observed_occupancy 100 (0.500 GREEN) and ZI observed_occupancy 350 (3.500 RED)'
      - 'three Incident rows: a MEDICAL/MODERATE reported 18:00 and triaged 18:12 (response_minutes 12.00, sla_breached true) then MEDICAL_HANDOFF and RESOLVED; a CROWD_SURGE/MINOR reported and triaged
        at 18:12 (response_minutes 0.00, sla_breached false) then RESOLVED; a PROHIBITED_ITEM row CLOSED_UNFOUNDED'
      - event STARTED at 18:30 and CLOSED at 22:30, which relieved the four ON_POST assignments (billed_hours 6.00 and billed_cost_cents 13200 each, billed_cost_cents 52800 on the plan)
