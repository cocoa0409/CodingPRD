        grounds:
          - state_machines.CorrectiveAction.SUBMITTED_to_REOPENED
          - state_machines.CorrectiveAction.REOPENED_to_SUBMITTED
        distinguishing_aspect: |
          CorrectiveAction cycles SUBMITTED -> REOPENED -> SUBMITTED -> VERIFIED; reopen_count
          increments on each loop and the cycle terminates at VERIFIED only under segregation of
          duties (verifier differs from the completing inspector).
        test_recipe:
          setup:
