          The selector's empty-pool fallback: a sealed batch past its bid
          deadline with ZERO submitted bids fails award with
          ERR_NO_ELIGIBLE_BIDS (422) after the temporal and forestry gates pass.
        test_recipe:
          setup:
            - "DELINQUENT notice swept; batch NB-T13 sealed with one item; no bids; clock 2026-09-23 (> bid_deadline)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Bea Betony", mailing_address: "109 Betony St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-T13", owner_id: "${owner_id}", street_address: "109 Betony St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-T13-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-T13", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-23T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NO_ELIGIBLE_BIDS (empty eligible set fallback)"

      - name: reimburse_with_unrequired_ramp_receipt_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.final_award
          - errors[ERR_INVALID_REQUEST]
          - entities.CostShareApplication.fields.ramp_upgrade_required
        distinguishing_aspect: |
          Conditional field validity: a nonzero ramp_receipt_cents on an
          application whose ramp_upgrade_required is false fails with
          ERR_INVALID_REQUEST (400); the same reimburse without the receipt
          succeeds with final_award 50000 (round_half_up(100000 * 50/100)).
        test_recipe:
          setup:
            - "cycle 10000000; application qty 100 (non-corner segment, ramp false) APPROVED then OBLIGATED; notice PASS-inspected -> COMPLIANT"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Cy Cypress", mailing_address: "110 Cypress St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-T14", owner_id: "${owner_id}", street_address: "110 Cypress St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-T14-1", length_ft: 20, width_ft: 5, is_corner_segment: false }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id", ramp: "$.data.ramp_upgrade_required" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/reimburse", payload: { final_repair_cost_cents: 100000, ramp_receipt_cents: 5000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /cost-share-applications/${app_id}/reimburse", payload: { final_repair_cost_cents: 100000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { final_award: "$.data.final_award_cents", r_status: "$.data.review_status" } }
          assert:
            - "ramp == false"
            - "err == ERR_INVALID_REQUEST (ramp_receipt_cents without ramp_upgrade_required)"
            - "final_award == 50000 and r_status == REIMBURSED on the clean retry"

      - name: error_cycle_not_open_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_NOT_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / obligate_requires_cycle_open
          rationale: "Asserted as the failure of obligate after the cycle is LOCKED."

      - name: error_notice_not_compliant_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOTICE_NOT_COMPLIANT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reimburse_requires_notice_compliant
          rationale: "Asserted as the failure of reimburse while the source notice is ISSUED."

      - name: error_forestry_not_cleared_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORESTRY_NOT_CLEARED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / award_blocked_until_forestry_cleared
          rationale: "Asserted twice (PENDING and DECIDED reviews) as the award blocker."

      - name: error_cycle_window_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cycle_window_closed_interval_overlap
          rationale: "Asserted for a closed-interval window sharing the 2026-12-31 endpoint."

      - name: error_cure_window_violation_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CURE_WINDOW_VIOLATION]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / forestry_cure_buffer_boundary
          rationale: "Asserted for a seal whose work_window_start is 6 days after forestry clearing."

      - name: error_bid_deadline_passed_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BID_DEADLINE_PASSED]
        excluded_because:
          difficulty_instance: boundary_precision_check / bid_deadline_inclusive_boundary
          rationale: "Asserted one second past bid_deadline; the same-day acceptance is also pinned there."

      - name: error_program_cap_exceeded_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROGRAM_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / program_cap_equality_boundary
          rationale: "Asserted for the application exceeding the zero remaining balance; also the losing error in state_beats_fiscal_on_obligate."

  # ===========================================================================
  # Section: rbac (Table 7 claims)
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_exclusive_ops_denied_for_other_roles
        claim_type: role_exclusive_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles[ProgramCoordinator]
          - roles[Inspector]
          - roles[PropertyOwner]
          - roles[Contractor]
          - roles[ForestryOfficer]
          - roles[FinanceOfficer]
          - roles[HearingOfficer]
        distinguishing_aspect: |
          Every role is denied at least one other role's exclusive operation with
          ERR_FORBIDDEN_ROLE (403) — priority 2 fires before existence, so bogus
          path/body ids do not mask the denial: PropertyOwner creating a cycle,
          Contractor creating a defect, ProgramCoordinator submitting a bid,
          ForestryOfficer obligating an application, FinanceOfficer deciding an
          appeal, HearingOfficer creating a lien, Inspector setting the clock.
        test_recipe:
          setup:
            - "one owner and one contractor registered (valid entity-backed ids); one batch exists (its version feeds the coordinator-bids payload shape)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Dee Dock", mailing_address: "111 Dock St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-R1", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
          trigger:
            - { call: "POST /program-cycles", payload: { cycle_year: 2027, window_start_date: "2027-01-01", window_end_date: "2027-12-31", appropriation_cents: 1000000 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { err_owner: "$.data.error_id" } }
            - { call: "POST /defects", payload: { segment_id: "00000000-0000-0000-0000-000000000000", defect_type: "SPALLING", area_sqft: 10 }, as: Contractor, as_user_id: "${contractor_id}", captures: { err_contractor: "$.data.error_id" } }
            - { call: "POST /bids", payload: { batch_id: "00000000-0000-0000-0000-000000000000", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: ProgramCoordinator, captures: { err_coord: "$.data.error_id" } }
            - { call: "POST /cost-share-applications/00000000-0000-0000-0000-000000000000/obligate", as: ForestryOfficer, as_user_id: "for-1", captures: { err_forestry: "$.data.error_id" } }
            - { call: "POST /repair-notices/00000000-0000-0000-0000-000000000000/appeal-decision", payload: { decision: "UPHELD" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err_finance: "$.data.error_id" } }
            - { call: "POST /lien-cases", payload: { notice_id: "00000000-0000-0000-0000-000000000000", actual_repair_cost_cents: 1000 }, as: HearingOfficer, as_user_id: "hear-1", captures: { err_hearing: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: Inspector, as_user_id: "insp-1", captures: { err_inspector: "$.data.error_id" } }
          assert:
            - "err_owner == ERR_FORBIDDEN_ROLE (PropertyOwner not in [ProgramCoordinator])"
            - "err_contractor == ERR_FORBIDDEN_ROLE (Contractor not in [Inspector])"
            - "err_coord == ERR_FORBIDDEN_ROLE (ProgramCoordinator not in [Contractor])"
            - "err_forestry == ERR_FORBIDDEN_ROLE (ForestryOfficer not in [FinanceOfficer])"
            - "err_finance == ERR_FORBIDDEN_ROLE (FinanceOfficer not in [HearingOfficer])"
            - "err_hearing == ERR_FORBIDDEN_ROLE (HearingOfficer not in [FinanceOfficer])"
            - "err_inspector == ERR_FORBIDDEN_ROLE (Inspector not in [ProgramCoordinator])"

      - name: rbac_shared_get_cycle_all_roles
        claim_type: shared_operation_allowed
        grounds:
          - "endpoints.GET /program-cycles/{id}"
          - roles[ProgramCoordinator]
          - roles[Inspector]
          - roles[PropertyOwner]
          - roles[Contractor]
          - roles[ForestryOfficer]
          - roles[FinanceOfficer]
          - roles[HearingOfficer]
        distinguishing_aspect: |
          Shared operations reach every role: all seven roles (opaque and
          entity-backed alike) can GET the same cycle and read status OPEN.
        test_recipe:
          setup:
            - "one cycle, one owner, one contractor"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 1000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Eli Eel", mailing_address: "112 Eel St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
          trigger:
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { st_pc: "$.data.status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: Inspector, as_user_id: "insp-1", captures: { st_in: "$.data.status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: PropertyOwner, as_user_id: "${owner_id}", captures: { st_po: "$.data.status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: Contractor, as_user_id: "${contractor_id}", captures: { st_co: "$.data.status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ForestryOfficer, as_user_id: "for-1", captures: { st_fo: "$.data.status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: FinanceOfficer, as_user_id: "fin-1", captures: { st_fi: "$.data.status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: HearingOfficer, as_user_id: "hear-1", captures: { st_ho: "$.data.status" } }
          assert:
            - "st_pc == OPEN and st_in == OPEN and st_po == OPEN and st_co == OPEN"
            - "st_fo == OPEN and st_fi == OPEN and st_ho == OPEN (all seven roles share GET access)"

      - name: segregation_appeal_decider_is_issuer
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.RepairNotice.UNDER_APPEAL_to_ISSUED
          - entities.RepairNotice.fields.issued_by_user_id
        distinguishing_aspect: |
          The appeal-decision gate compares X-User-ID to the notice's
          issued_by_user_id: a HearingOfficer whose operator id equals the
          issuing coordinator's (coord-1) is rejected with
          ERR_SEGREGATION_OF_DUTIES (403), while a different hearing officer
          (hear-1) decides the same appeal successfully.
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice issued by coord-1; owner appealed (UNDER_APPEAL, appeal PENDING)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Fay Fern", mailing_address: "113 Fern St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-RB1", owner_id: "${owner_id}", street_address: "113 Fern St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-RB1-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1", captures: { issuer: "$.data.issued_by_user_id" } }
            - { call: "POST /repair-notices/${notice_id}/appeal", payload: { grounds: "dispute" }, as: PropertyOwner, as_user_id: "${owner_id}" }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/appeal-decision", payload: { decision: "UPHELD" }, as: HearingOfficer, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /repair-notices/${notice_id}/appeal-decision", payload: { decision: "UPHELD" }, as: HearingOfficer, as_user_id: "hear-1", captures: { n_status: "$.data.status", ap: "$.data.appeal_status", decider: "$.data.appeal_decided_by_user_id" } }
          assert:
            - "issuer == coord-1"
            - "err == ERR_SEGREGATION_OF_DUTIES (decider id == issuer id)"
            - "n_status == ISSUED and ap == UPHELD and decider == hear-1 (different officer succeeds)"

      - name: segregation_inspection_by_defect_recorder
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.RepairNotice.ISSUED_to_COMPLIANT
          - entities.Defect.fields.recorded_by_inspector_id
        distinguishing_aspect: |
          The compliance-inspection gate excludes the recorder of any covered
          defect: insp-1 recorded the defect, so insp-1's PASS is rejected with
          ERR_SEGREGATION_OF_DUTIES (403); insp-2's PASS on the same notice
          succeeds (COMPLIANT).
        test_recipe:
          setup:
            - "owner/parcel/segment; defect recorded by insp-1; notice issued"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Gus Gale", mailing_address: "114 Gale St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-RB2", owner_id: "${owner_id}", street_address: "114 Gale St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-RB2-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id", recorder: "$.data.recorded_by_inspector_id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2", captures: { rec_id: "$.data.id" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status: "$.data.status" } }
          assert:
            - "recorder == insp-1"
            - "err == ERR_SEGREGATION_OF_DUTIES (inspector recorded a covered defect)"
            - "n_status == COMPLIANT after insp-2's PASS"

      - name: segregation_verify_by_defect_recorder
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.BatchWorkItem.WORK_COMPLETED_to_VERIFIED
        distinguishing_aspect: |
          The work-item verification gate mirrors the inspection gate on the
          city-repair path: the inspector who recorded the notice's defects
          (insp-1) cannot verify the completed item (ERR_SEGREGATION_OF_DUTIES,
          403); insp-2 verifies, which cascades notice -> CITY_REPAIR_COMPLETED
          and batch -> COMPLETED.
        test_recipe:
          setup:
            - "lien-style chain short of lien: notice swept, batch awarded to contractor, item completed by the awarded contractor at clock 2026-09-22"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Her Heath", mailing_address: "115 Heath St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-RB3", owner_id: "${owner_id}", street_address: "115 Heath St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-RB3-1", length_ft: 10, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-RB3", work_window_start: "2026-09-21", work_window_end: "2026-10-05", bid_deadline: "2026-09-21T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item_id: "$.data.id" } }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1100, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/start-work", as: ProgramCoordinator }
            - { call: "POST /batch-work-items/${item_id}/complete", as: Contractor, as_user_id: "${contractor_id}", captures: { i_status: "$.data.status" } }
          trigger:
            - { call: "POST /batch-work-items/${item_id}/verify", as: Inspector, as_user_id: "insp-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /batch-work-items/${item_id}/verify", as: Inspector, as_user_id: "insp-2", captures: { i_status2: "$.data.status" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status: "$.data.status" } }
            - { call: "GET /bid-batches/${batch_id}", as: ProgramCoordinator, captures: { b_status: "$.data.status" } }
          assert:
            - "i_status == WORK_COMPLETED"
            - "err == ERR_SEGREGATION_OF_DUTIES (verifier recorded the notice's defect)"
            - "i_status2 == VERIFIED, n_status == CITY_REPAIR_COMPLETED, b_status == COMPLETED (bubble-up on the clean verify)"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers (active layers from §0.2)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_notice_extension_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[notice-extension-stale-version]
          - errors[ERR_STALE_NOTICE_VERSION]
          - entities.RepairNotice.fields.version
        distinguishing_aspect: |
          notice-extension-stale-version: the first extension carrying the
          notice's current version (2 after issue) succeeds and moves the
          deadline 2026-09-15 -> 2026-09-25 while bumping version to 3; a second
          extension replaying the SAME observed version is rejected with
          ERR_STALE_NOTICE_VERSION (412).
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice issued at default clock (deadline 2026-09-15T00:00:00Z); version captured from the issue response"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ian Ivy", mailing_address: "116 Ivy St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-X1", owner_id: "${owner_id}", street_address: "116 Ivy St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-X1-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_v: "$.data.version", dl0: "$.data.compliance_deadline" } }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/extensions", payload: { extra_days: 10, expected_notice_version: "${notice_v}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { dl1: "$.data.compliance_deadline", v1: "$.data.version" } }
            - { call: "POST /repair-notices/${notice_id}/extensions", payload: { extra_days: 10, expected_notice_version: "${notice_v}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "dl0 == 2026-09-15T00:00:00Z"
            - "dl1 == 2026-09-25T00:00:00Z and v1 == 3 (extension applied, version incremented)"
            - "err == ERR_STALE_NOTICE_VERSION (the replayed version is stale after the first extension)"

      - name: occ_bid_stale_batch_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bid-create-stale-batch-version]
          - errors[ERR_STALE_BATCH_VERSION]
          - entities.BidBatch.fields.version
        distinguishing_aspect: |
          bid-create-stale-batch-version: contractor 1's bid against the sealed
          batch's current version succeeds and increments BidBatch.version;
          contractor 2's bid carrying the pre-bid version is rejected with
          ERR_STALE_BATCH_VERSION (412) — both bids are otherwise valid and the
          clock is within the bid window.
        test_recipe:
          setup:
            - "DELINQUENT notice swept; batch NB-X2 sealed (version captured); two eligible contractors; clock 2026-09-16 (<= bid_deadline)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Jen Juniper", mailing_address: "117 Juniper St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-X2", owner_id: "${owner_id}", street_address: "117 Juniper St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-X2-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-X2", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor1_id: "$.data.id" } }
            - { call: "POST /contractors", payload: { company_name: "Best Builders", license_number: "L-002", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor2_id: "$.data.id" } }
          trigger:
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor1_id}", captures: { b1_status: "$.data.status" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "b1_status == SUBMITTED (current version accepted; batch version incremented)"
            - "err == ERR_STALE_BATCH_VERSION (contractor 2's observed version is now stale)"

      - name: occ_cycle_adjustment_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cycle-adjustment-stale-version]
          - errors[ERR_STALE_CYCLE_VERSION]
          - entities.ProgramCycle.fields.version
        distinguishing_aspect: |
          cycle-adjustment-stale-version: a +50000 adjustment carrying the
          cycle's creation version succeeds (appropriation 1000000 -> 1050000,
          version 1 -> 2); replaying the same observed version on a second
          adjustment is rejected with ERR_STALE_CYCLE_VERSION (412).
        test_recipe:
          setup:
            - "one OPEN cycle, version captured from the create response"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 1000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id", cycle_v: "$.data.version" } }
          trigger:
            - { call: "POST /program-cycles/${cycle_id}/appropriation-adjustments", payload: { delta_cents: 50000, expected_program_cycle_version: "${cycle_v}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { ap: "$.data.appropriation_cents", v: "$.data.version" } }
            - { call: "POST /program-cycles/${cycle_id}/appropriation-adjustments", payload: { delta_cents: 50000, expected_program_cycle_version: "${cycle_v}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "ap == 1050000 and v == 2 (first adjustment applied)"
            - "err == ERR_STALE_CYCLE_VERSION (replayed version rejected)"

      - name: sweep_expires_approved_applications
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CostShareApplication.APPROVED_to_EXPIRED
          - "endpoints.POST /delinquency-sweeps"
          - entities.CostShareApplication.fields.approval_expires_at
        distinguishing_aspect: |
          The sweep's second cascade (distinct from notice delinquency): with
          the notice already COMPLIANT (so nothing is swept on the notice axis),
          advancing the clock past approval_expires_at and sweeping moves the
          APPROVED application to EXPIRED and reports
          expired_application_count 1 with swept_notice_count 0.
        test_recipe:
          setup:
            - "cycle; application qty 100 APPROVED at default clock (expires 2026-09-30T00:00:00Z); notice PASS-inspected -> COMPLIANT; clock then set to 2026-10-01"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Kat Katsura", mailing_address: "118 Katsura St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-X3", owner_id: "${owner_id}", street_address: "118 Katsura St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-X3-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator, captures: { swept: "$.data.swept_notice_count", expired: "$.data.expired_application_count", expired_ids: "$.data.expired_application_ids" } }
            - { call: "GET /cost-share-applications/${app_id}", as: ProgramCoordinator, captures: { r_status: "$.data.review_status" } }
          assert:
            - "swept == 0 (the COMPLIANT notice is not sweepable)"
            - "expired == 1 and app_id is in expired_ids"
            - "r_status == EXPIRED (APPROVED past approval_expires_at)"

      - name: delinquency_sweep_strict_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.compliance_deadline
          - state_machines.RepairNotice.ISSUED_to_DELINQUENT
          - "endpoints.POST /delinquency-sweeps"
        distinguishing_aspect: |
          Delinquency fires only when clock > compliance_deadline (strict): a
          sweep at exactly the deadline (2026-09-15T00:00:00Z) sweeps 0 notices
          and leaves the notice ISSUED; one day later the same sweep sweeps it
          (count 1, status DELINQUENT, parcel delinquency_flag true).
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice issued at default clock (deadline 2026-09-15T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Leo Locust", mailing_address: "119 Locust St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-X4", owner_id: "${owner_id}", street_address: "119 Locust St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-X4-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator, captures: { swept1: "$.data.swept_notice_count" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status1: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator, captures: { swept2: "$.data.swept_notice_count", ids2: "$.data.swept_notice_ids" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status2: "$.data.status" } }
            - { call: "GET /parcels/${parcel_id}", as: ProgramCoordinator, captures: { flag: "$.data.delinquency_flag" } }
          assert:
            - "swept1 == 0 and n_status1 == ISSUED (equality with the deadline is still compliant)"
            - "swept2 == 1 and notice_id is in ids2 and n_status2 == DELINQUENT"
            - "flag == true (delinquency fan-out)"

      - name: obligate_at_exact_expiry_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.CostShareApplication.APPROVED_to_OBLIGATED
          - entities.CostShareApplication.fields.approval_expires_at
          - errors[ERR_APPLICATION_EXPIRED]
        distinguishing_aspect: |
          The obligate window is inclusive: at clock exactly equal to
          approval_expires_at (2026-09-30T00:00:00Z) the obligation succeeds
          (review_status OBLIGATED, payment RESERVED, committed 60000) — the
          complement boundary to obligate_after_approval_expiry_rejected.
        test_recipe:
          setup:
            - "cycle 10000000; application qty 100 APPROVED at default clock; clock set to exactly 2026-09-30T00:00:00Z (== approval_expires_at); notice left ISSUED (obligate has no notice-state gate)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Mimosa Mo", mailing_address: "120 Mimosa St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-X5", owner_id: "${owner_id}", street_address: "120 Mimosa St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-X5-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { expires: "$.data.approval_expires_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { r_status: "$.data.review_status", p_status: "$.data.payment_status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed: "$.data.committed_cents" } }
          assert:
            - "expires == 2026-09-30T00:00:00Z"
            - "r_status == OBLIGATED and p_status == RESERVED (clock <= expiry is inclusive)"
            - "committed == 60000"

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_issue
        claim_type: immediate_consistency
        grounds:
          - "endpoints.POST /repair-notices/{id}/issue"
          - state_machines.RepairNotice.DRAFT_to_ISSUED
          - entities.RepairNotice.fields.version
        distinguishing_aspect: |
          Immediate consistency: the issue response itself carries the new state
          (ISSUED, computed deadline, version 2), and back-to-back reads of the
          linked defect and segment reflect the cascade (UNDER_REPAIR,
          UNDER_NOTICE) with no delay or reconciliation window.
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; DRAFT notice"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Nia Nutsedge", mailing_address: "121 Nutsedge St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-X6", owner_id: "${owner_id}", street_address: "121 Nutsedge St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-X6-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1", captures: { n_status: "$.data.status", n_dl: "$.data.compliance_deadline", n_v: "$.data.version" } }
            - { call: "GET /defects/${defect_id}", as: ProgramCoordinator, captures: { d_status: "$.data.status" } }
            - { call: "GET /segments/${segment_id}", as: ProgramCoordinator, captures: { s_status: "$.data.status" } }
          assert:
            - "n_status == ISSUED and n_dl == 2026-09-15T00:00:00Z and n_v == 2 in the mutation response itself"
            - "d_status == UNDER_REPAIR and s_status == UNDER_NOTICE on immediate reads"
