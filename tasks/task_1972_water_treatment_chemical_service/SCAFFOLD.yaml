    path: "/wt/water-test-results/{resultId}/confirm"
    description: "RECORDED -> CONFIRMED with lab TDS; computes LSI finalized variant"
    roles: [WaterChemist]
    code: 200
    input: [lab_tds_ppm]
    output: WaterTestResult
    side_effects: ["lsi_final computed", "classification recomputed"]

  - method: POST
    path: "/wt/water-test-results/{resultId}/void"
    description: "RECORDED -> VOIDED; compensates escalation counter and declines pending corrective action"
    roles: [WaterChemist]
    code: 200
    input: []
    output: WaterTestResult
    side_effects: ["counter decrement (floor 0); posture recompute; pending CorrectiveAction -> DECLINED"]

  # --- CorrectiveAction ---
  - method: GET
    path: "/wt/corrective-actions"
    description: "List corrective actions; optional asset_id/status/triggering_result_id filters"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "asset_id?", "status?", "triggering_result_id?"]
    output: CorrectiveAction[]
    side_effects: []

  - method: GET
    path: "/wt/corrective-actions/{actionId}"
    description: "Get a corrective action"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []

  - method: POST
    path: "/wt/corrective-actions/{actionId}/approve"
    description: "PENDING -> APPROVED; segregation-of-duties and OCC guarded"
    roles: [WaterChemist]
    code: 200
    input: [setpoint_delta_ml_per_min, rationale, expected_feed_station_version]
    output: CorrectiveAction
    side_effects: []

  - method: POST
    path: "/wt/corrective-actions/{actionId}/apply"
    description: "APPROVED -> APPLIED; applies setpoint delta, resets counter, may auto-draft delivery"
    roles: [WaterChemist]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects:
      - "station.setpoint_ml_per_min := clamp(setpoint + delta, 0, capacity_cap)"
      - "station rate/projection recomputed"
      - "asset.consecutive_out_of_range_count := 0; posture recomputed"
      - "auto-draft DeliveryOrder when depletion within 14 days"

  - method: POST
    path: "/wt/corrective-actions/{actionId}/decline"
    description: "PENDING -> DECLINED; segregation-of-duties guarded"
    roles: [WaterChemist]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []

  # --- CouponRack / CorrosionCoupon ---
  - method: POST
    path: "/wt/racks"
    description: "Install a coupon rack on an asset"
    roles: [WaterChemist]
    code: 201
    input: [asset_id, rack_code, position_count]
    output: CouponRack
    side_effects: ["status = INSTALLED"]

  - method: GET
    path: "/wt/racks"
    description: "List racks; optional asset_id filter"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "asset_id?"]
    output: CouponRack[]
    side_effects: []

  - method: GET
    path: "/wt/racks/{rackId}"
    description: "Get a rack"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: []
    output: CouponRack
    side_effects: []

  - method: POST
    path: "/wt/racks/{rackId}/archive"
    description: "INSTALLED -> ARCHIVED; blocks new coupons"
    roles: [WaterChemist]
    code: 200
    input: []
    output: CouponRack
    side_effects: []

  - method: POST
    path: "/wt/racks/{id}/coupons"
    description: "Install a coupon on a rack position; closed-interval + 7-day buffer conflict check"
    roles: [WaterChemist]
    code: 201
    input: [position_index, alloy, density_g_cm3, area_in2, pre_weight_g, installed_at]
    output: CorrosionCoupon
    side_effects: ["status = INSTALLED", "ERR_COUPON_INTERVAL_CONFLICT on buffer/overlap violation; ERR_RACK_ARCHIVED if rack archived"]

  - method: GET
    path: "/wt/racks/{id}/coupons"
    description: "List coupons of a rack"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CorrosionCoupon[]
    side_effects: []

  - method: POST
    path: "/wt/coupons/{couponId}/remove"
    description: "INSTALLED -> REMOVED; computes exposure_days, corrosion_rate_mpy, rating"
    roles: [WaterChemist]
    code: 200
    input: [post_weight_g]
    output: CorrosionCoupon
    side_effects: ["removed_at := now", "exposure_days, corrosion_rate_mpy, rating computed"]

  # --- LegionellaRiskPlan ---
  - method: POST
    path: "/wt/legionella-plans"
    description: "Create a Legionella risk plan for an asset (DRAFT)"
    roles: [WaterChemist]
    code: 201
    input: [asset_id, plan_text, validation_interval_days]
    output: LegionellaRiskPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/wt/legionella-plans"
    description: "List plans; optional asset_id/status filters"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "asset_id?", "status?"]
    output: LegionellaRiskPlan[]
    side_effects: []

  - method: GET
    path: "/wt/legionella-plans/{planId}"
    description: "Get a plan"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: []
    output: LegionellaRiskPlan
    side_effects: []

  - method: POST
    path: "/wt/legionella-plans/{planId}/activate"
    description: "DRAFT -> ACTIVE; sets validation_due_at"
    roles: [WaterChemist]
    code: 200
    input: []
    output: LegionellaRiskPlan
    side_effects: ["validation_due_at := now + interval"]

  - method: POST
    path: "/wt/legionella-plans/{planId}/validate"
    description: "VALIDATION_DUE|DELINQUENT -> ACTIVE; refreshes due date, recomputes posture"
    roles: [WaterChemist]
    code: 200
    input: []
    output: LegionellaRiskPlan
    side_effects: ["last_validated_at := now", "validation_due_at refreshed", "posture recomputed"]

  - method: POST
    path: "/wt/legionella-plans/{planId}/declare-delinquent"
    description: "VALIDATION_DUE -> DELINQUENT after 14-day grace; posture -> NON_COMPLIANT"
    roles: [WaterChemist]
    code: 200
    input: []
    output: LegionellaRiskPlan
    side_effects: ["asset.posture := NON_COMPLIANT"]

  - method: POST
    path: "/wt/legionella-plans/{planId}/suspend"
    description: "ACTIVE|VALIDATION_DUE|DELINQUENT -> SUSPENDED; posture -> FROZEN"
    roles: [AccountManager]
    code: 200
    input: []
    output: LegionellaRiskPlan
    side_effects: ["asset.posture := FROZEN"]

  - method: POST
    path: "/wt/legionella-plans/{planId}/return-to-draft"
    description: "SUSPENDED -> DRAFT (cycle); posture recomputed"
    roles: [WaterChemist]
    code: 200
    input: []
    output: LegionellaRiskPlan
    side_effects: ["asset.posture recomputed"]

  # --- BlowdownEvent ---
  - method: POST
    path: "/wt/assets/{id}/blowdown-events"
    description: "Log a blowdown event; computes evaporation allocation, achieved CoC, balance residual, saved gallons"
    roles: [WaterChemist]
    code: 201
    input: [occurred_at, blowdown_gal, makeup_gal]
    output: BlowdownEvent
    side_effects: ["evaporation_gal and balance_residual_gal computed; ERR_NON_MONOTONIC_EVENT when occurred_at <= previous event's occurred_at"]

  - method: GET
    path: "/wt/assets/{id}/blowdown-events"
    description: "List blowdown events of an asset ordered occurred_at ASC"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BlowdownEvent[]
    side_effects: []

  # --- DeliveryOrder ---
  - method: POST
    path: "/wt/delivery-orders"
    description: "Create a delivery order (DRAFT) for a station"
    roles: [AccountManager]
    code: 201
    input: [account_id, station_id, quantity_gal]
    output: DeliveryOrder
    side_effects: ["status = DRAFT", "ERR_QUANTITY_NOT_CONTAINER_MULTIPLE; ERR_PRODUCT_DELISTED; ERR_STATION_LOCKED_OUT"]

  - method: GET
    path: "/wt/delivery-orders"
    description: "List delivery orders; optional account_id/station_id/status filters"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "account_id?", "station_id?", "status?"]
    output: DeliveryOrder[]
    side_effects: []

  - method: GET
    path: "/wt/delivery-orders/{orderId}"
    description: "Get a delivery order"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/wt/delivery-orders/{orderId}/submit"
    description: "DRAFT -> PENDING"
    roles: [AccountManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/wt/delivery-orders/{orderId}/schedule"
    description: "PENDING|FAILED_DELIVERY -> SCHEDULED; program-accepted + credit-hold gates; OCC guarded"
    roles: [AccountManager]
    code: 200
    input: [scheduled_for, expected_delivery_order_version]
    output: DeliveryOrder
    side_effects: ["increments DeliveryOrder.version by 1"]

  - method: POST
    path: "/wt/delivery-orders/{orderId}/dispatch"
    description: "SCHEDULED -> IN_TRANSIT; not before scheduled_for"
    roles: [AccountManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/wt/delivery-orders/{orderId}/confirm-delivery"
    description: "IN_TRANSIT -> DELIVERED; credits station inventory"
    roles: [WaterChemist]
    code: 200
    input: [delivered_gal]
    output: DeliveryOrder
    side_effects: ["station.inventory_gal += delivered_gal", "projection recomputed"]

  - method: POST
    path: "/wt/delivery-orders/{orderId}/fail"
    description: "IN_TRANSIT -> FAILED_DELIVERY"
    roles: [WaterChemist]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/wt/delivery-orders/{orderId}/close"
    description: "DELIVERED -> CLOSED; tote exchange residual debited from inventory"
    roles: [WaterChemist]
    code: 200
    input: [returned_residual_gal]
    output: DeliveryOrder
    side_effects: ["station.inventory_gal -= returned_residual_gal", "tote mass invariant reconciled"]

  - method: POST
    path: "/wt/delivery-orders/{orderId}/cancel"
    description: "DRAFT|PENDING|SCHEDULED -> CANCELLED; releases tote allocation (compensation)"
    roles: [AccountManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["tote allocation released"]

  # --- Invoice ---
  - method: POST
    path: "/wt/invoices"
    description: "Create a DRAFT invoice for an account and period"
    roles: [AccountManager]
    code: 201
    input: [account_id, period_start, period_end]
    output: Invoice
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/wt/invoices"
    description: "List invoices; optional account_id/status filters"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/wt/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [AccountManager, WaterChemist, CustomerContact, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/wt/invoices/{invoiceId}/issue"
    description: "DRAFT -> ISSUED; snapshots pricing variant, computes totals (per-line round_half_up then sum), debits account open_balance"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["pricing_variant snapshot", "invoice_total_cents computed", "account.open_balance_cents += total"]

  - method: POST
    path: "/wt/invoices/{invoiceId}/pay"
    description: "ISSUED|OVERDUE -> PAID; credits account open_balance"
    roles: [CustomerContact]
    code: 200
    input: []
    output: Invoice
    side_effects: ["account.open_balance_cents -= invoice_total_cents"]

  - method: POST
    path: "/wt/invoices/{invoiceId}/void"
    description: "DRAFT -> VOID"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed caller does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or non-member enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }
  - { id: ERR_ROUTE_NOT_PUBLISHED, http: 409, condition: "Arrive requires the owning route to be PUBLISHED" }
  - { id: ERR_PROGRAM_NOT_ACCEPTED, http: 409, condition: "Delivery scheduling requires an ACCEPTED ProgramDesign on the destination asset" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Delivery scheduling requires account status ACTIVE" }
  - { id: ERR_ASSET_NOT_IN_SERVICE, http: 409, condition: "Operation requires asset status IN_SERVICE" }
  - { id: ERR_ASSET_FROZEN, http: 409, condition: "Asset posture FROZEN gates this operation" }
  - { id: ERR_LEGIONELLA_PLAN_SUSPENDED, http: 409, condition: "Corrective-action approval blocked while the asset's Legionella plan is SUSPENDED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/decliner must differ from recorded_by_user_id" }
  - { id: ERR_FIELD_CONSTRAINT, http: 422, condition: "Scalar range/shape constraint violated (CoC band, pH band, active_pct, price ordering, uniqueness)" }
  - { id: ERR_QUANTITY_NOT_CONTAINER_MULTIPLE, http: 422, condition: "quantity_gal not a positive whole multiple of the product's container_size_gal" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "RouteStop window overlaps another SCHEDULED/ARRIVED stop on the same asset (half-open semantics)" }
  - { id: ERR_COUPON_INTERVAL_CONFLICT, http: 409, condition: "Coupon install conflicts with existing coupon on same rack position (closed interval + 7-day buffer)" }
  - { id: ERR_OUTSIDE_VISIT_WINDOW, http: 422, condition: "Arrive attempted outside [window_start, window_end)" }
  - { id: ERR_WINDOW_NOT_ELAPSED, http: 422, condition: "mark-missed attempted before window_end" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "scheduled_for not strictly in the future" }
  - { id: ERR_TOO_EARLY_TO_DISPATCH, http: 422, condition: "dispatch attempted before scheduled_for" }
  - { id: ERR_TELEMETRY_FUTURE, http: 422, condition: "Telemetry recorded_at is in the future" }
  - { id: ERR_NON_MONOTONIC_EVENT, http: 422, condition: "Blowdown occurred_at not strictly after the previous event on the same asset" }
  - { id: ERR_GRACE_NOT_ELAPSED, http: 422, condition: "Delinquency declaration before validation_due_at + 14 days" }
  - { id: ERR_EXPOSURE_TOO_SHORT, http: 422, condition: "Coupon exposure_days < 1" }
  - { id: ERR_COUPON_WEIGHT_GAIN, http: 422, condition: "post_weight_g > pre_weight_g + 2.0 deposit allowance" }
  - { id: ERR_DELIVERY_QUANTITY, http: 422, condition: "delivered_gal <= 0 or > quantity_gal" }
  - { id: ERR_RESIDUAL_EXCEEDS_CONTAINER, http: 422, condition: "returned_residual_gal > container_size_gal or < 0" }
  - { id: ERR_ASSET_MISMATCH, http: 409, condition: "WaterTestResult.asset_id != stop.asset_id" }
  - { id: ERR_RACK_ARCHIVED, http: 409, condition: "Coupon install on an ARCHIVED rack" }
  - { id: ERR_STATION_LOCKED_OUT, http: 409, condition: "Delivery order references a LOCKED_OUT station" }
  - { id: ERR_PRODUCT_DELISTED, http: 409, condition: "Station/order references a DELISTED product" }
  - { id: ERR_CREDIT_HOLD, http: 409, condition: "Account credit_hold blocks delivery scheduling" }
  - { id: ERR_UNPAID_BALANCE, http: 409, condition: "Account close blocked by non-zero open_balance_cents" }
  - { id: ERR_NO_ACCEPTED_PROGRAM, http: 409, condition: "Commission requires an ACCEPTED ProgramDesign" }
  - { id: ERR_NO_ONLINE_FEED_STATION, http: 409, condition: "Commission requires an ONLINE FeedStation" }
  - { id: ERR_INCOMPLETE_DESIGN, http: 422, condition: "Draft transition missing required design parameters" }
  - { id: ERR_EMPTY_ROUTE, http: 409, condition: "Publish requires at least one SCHEDULED stop" }
  - { id: ERR_COUPONS_STILL_INSTALLED, http: 409, condition: "Decommission blocked by INSTALLED coupons" }
  - { id: ERR_OPEN_ROUTE_STOPS, http: 409, condition: "Decommission blocked by SCHEDULED/ARRIVED stops" }
  - { id: ERR_LAB_TDS_REQUIRED, http: 422, condition: "Confirm requires lab_tds_ppm" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the service platform; owns the product catalog and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /wt/products, POST /wt/products/{id}/delist"
      - "POST /wt/_clock/set_current_utc"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: AccountManager
    description: "Commercial owner of customer accounts; owns account lifecycle, delivery orders, and invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /wt/accounts and account lifecycle actions (suspend/reactivate/close)"
      - "POST /wt/delivery-orders and order commercial actions (submit/schedule/dispatch/cancel)"
      - "POST /wt/invoices and invoice issue/void"
      - "POST /wt/legionella-plans/{id}/suspend"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: WaterChemist
    description: "Field service chemist; owns surveys, designs, routes, results, coupons, plans, telemetry, delivery execution"
    identity: opaque
    exclusive_operations:
      - "POST /wt/assets and asset commission/decommission"
      - "ProgramDesign survey/draft/propose/reopen/withdraw"
      - "FeedStation create/bring-online/lockout and telemetry posting"
      - "TestRoute/stop management and arrive/mark-missed"
      - "WaterTestResult record/confirm/void"
      - "CorrectiveAction approve/apply/decline (subject to segregation of duties)"
      - "CouponRack/CorrosionCoupon install/remove/archive"
      - "LegionellaRiskPlan create/activate/validate/declare-delinquent/return-to-draft"
      - "BlowdownEvent logging"
      - "DeliveryOrder confirm-delivery/fail/close"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: CustomerContact
    description: "The industrial customer acting on its own account; approves program designs and pays invoices"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /wt/program-designs/{id}/accept, POST /wt/program-designs/{id}/request-revision"
      - "POST /wt/invoices/{id}/pay"
    shared_operations:
      - "GET endpoints scoped to its own account subtree"
