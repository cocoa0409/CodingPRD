            - "the second create returns HTTP 409 with error.id == ERR_MEMBER_REST_BUFFER_VIOLATION, because 2026-09-14 is only 4 days after 2026-09-10"
            - "exactly two ScheduleGame rows exist for the conference after both attempts"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: posting_final_run_depends_on_issued_audit_report
        grounds:
          - validations[priority=56]
          - state_machines.AuditReport.DRAFT_to_ISSUED
          - state_machines.DistributionRun.COMPUTED_to_POSTED
          - calculations.pool_reconciliation_identity
        distinguishing_aspect: |
          The write target is a DistributionRun but the gating state lives on a different
          entity, AuditReport: the run cannot leave COMPUTED while its report sits in
          DRAFT, and issuing the report - which changes nothing on the run - is what
          unblocks the post.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "A FY2026 EQUAL_SHARE pool with 600000000 gross cents and 4000000 audited expense cents has a FINAL_AUDITED run in COMPUTED, computed by u_fin_1."
            - "An AuditReport for that run exists in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - *k_p26
            - *k_p26_open
            - *k_p26_cb
            - *k_p26_read
            - *k_r26
            - *k_ar26
          trigger:
            - call: "POST /distribution-runs/${r26_id}/post"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
            - call: "POST /audit-reports/${ar26_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "POST /distribution-runs/${r26_id}/post"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
          assert:
            - "the first post returns HTTP 409 with error.id == ERR_AUDIT_REPORT_NOT_ISSUED and DistributionRun.${r26_id}.status stays COMPUTED"
            - "AuditReport.${ar26_id}.reconciliation_delta_cents == 0 and AuditReport.${ar26_id}.status == ISSUED"
            - "the second post returns HTTP 200 and DistributionRun.${r26_id}.status == POSTED with posted_by_user_id == u_trs_1"
            - "each of the four members has last_full_annual_distribution_cents == 147500000"
            - "Conference.reserve_balance_cents == 18000000, Conference.funded_ratio_bps == 10000 and Conference.reserve_posture == OPEN"

      - name: admit_action_depends_on_approved_budget_for_current_year
        grounds:
          - validations[priority=52]
          - state_machines.BudgetProposal.VOTING_to_APPROVED
          - state_machines.Conference.FORMING_to_OPERATING
          - entities.Conference.fields.approved_operating_expense_cents
        distinguishing_aspect: |
          The write target is a MembershipAction but the gating state lives on
          BudgetProposal: an ADMIT proposal is refused while no APPROVED FY2027 budget
          exists, and approving the budget - which touches neither the petitioner nor any
          action - is what makes the identical request succeed. This is a
          governance-to-fiscal dependency, unlike the run-to-report dependency.
        test_recipe:
          setup:
            - "The conference is FORMING with current_fiscal_year 2027 and no budget proposal of any status."
            - "Four charter members are FULL_SHARE and Central sits in PETITIONED with 0 voting weight and a 0 entry fee."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_mc
          trigger:
            - call: "POST /membership-actions"
              payload: { conference_id: "${conf_id}", member_id: "${m_c_id}", action_type: "ADMIT", effective_fiscal_year: 2028, entry_fee_cents: 0, rationale: "Footprint expansion" }
              as: Commissioner
              as_user_id: "u_com_1"
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - call: "POST /membership-actions"
              payload: { conference_id: "${conf_id}", member_id: "${m_c_id}", action_type: "ADMIT", effective_fiscal_year: 2028, entry_fee_cents: 0, rationale: "Footprint expansion" }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_retry_id: $.data.id }
          assert:
            - "the first proposal returns HTTP 409 with error.id == ERR_NO_APPROVED_BUDGET and creates no MembershipAction row"
            - "BudgetProposal.${bp_id}.status == APPROVED with approval_ratio_bps == 10000 and required_approval_bps == 6670"
            - "Conference.governance_status == OPERATING, Conference.approved_operating_expense_cents == 120000000 and Conference.reserve_target_cents == 18000000"
            - "Conference.reserve_balance_cents == 0 and Conference.reserve_posture == FROZEN, so the budget approval alone does not fund the reserve"
            - "the second proposal returns HTTP 201 and MembershipAction.${ma_retry_id}.status == PROPOSED with amend_count == 0"

      - name: close_books_depends_on_terminal_bowl_reviews
        grounds:
          - validations[priority=54]
          - state_machines.BowlAppearance.SUBMITTED_to_VOIDED
          - state_machines.RevenuePool.OPEN_to_BOOKS_CLOSED
          - entities.RevenuePool.fields.audited_expense_cents
        distinguishing_aspect: |
          The write target is a RevenuePool but the gating state lives on a sibling
          collection: a single BowlAppearance still in SUBMITTED for the same fiscal year
          blocks close-books, and voiding that appearance - a write on a different entity
          that never mentions the pool - is what lets the books close. This is a
          pool-to-appearance dependency across a collection rather than a one-to-one link.
        test_recipe:
          setup:
            - "The full FY2027 media fixture is in place with an OPEN pool holding 500000000 gross cents."
            - "North's FY2027 appearance is APPROVED, but West's FY2027 appearance is still in SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - *k_g1
            - *k_g2
            - *k_g3
            - *k_g4
            - *k_g1_play
            - *k_g2_play
            - *k_g4_play
            - *k_ba_n
            - *k_ba_n_rev
            - *k_ba_n_app
            - *k_ba_w
            - *k_pool
            - *k_pool_open
          trigger:
            - call: "POST /revenue-pools/${rp_id}/close-books"
              payload: { audited_expense_cents: 26500000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /bowl-appearances/${ba_w_id}/void"
              payload: { reason: "Appearance withdrawn by the institution" }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /revenue-pools/${rp_id}/close-books"
              payload: { audited_expense_cents: 26500000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          assert:
            - "the first close-books returns HTTP 409 with error.id == ERR_BOWL_REVIEW_PENDING and RevenuePool.${rp_id}.status stays OPEN with audited_expense_cents == null"
            - "BowlAppearance.${ba_w_id}.status == VOIDED"
            - "the second close-books returns HTTP 200, RevenuePool.${rp_id}.status == BOOKS_CLOSED and RevenuePool.${rp_id}.audited_expense_cents == 26500000"
            - "Conference.validated_postseason_unit_count == 2 and Conference.escrow_balance_cents == 4800000, unchanged by the void because West's appearance was never approved"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: member_rest_buffer_is_per_member_point_date_capacity
        grounds:
          - validations[priority=38]
          - entities.ScheduleGame.fields.game_date
          - entities.ScheduleGame.fields.home_member_id
          - entities.ScheduleGame.fields.away_member_id
        distinguishing_aspect: |
          The contended resource is the member, not the venue, and the interval is a
          point date with a symmetric five-day buffer and a capacity of one: a game on
          2026-09-08 is refused for North, who plays on 2026-09-05, yet the very same
          date is accepted for East and West at a different venue, proving the constraint
          keys on participants rather than on the facility.
        test_recipe:
          setup:
            - "The conference exists with current_fiscal_year 2027 and four charter members; North and South play at the Northfield Dome, East and West at the Eastport Arena."
            - "A FY2027 game with North at home against South is SCHEDULED for 2026-09-05T19:00:00Z at the Northfield Dome, and East and West have no games at all."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_g1
          trigger:
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v1_id}", game_date: "2026-09-08T19:00:00Z", fiscal_year: 2027, media_designated: false }
              as: ScheduleCoordinator
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_e_id}", away_member_id: "${m_w_id}", venue_id: "${v2_id}", game_date: "2026-09-08T19:00:00Z", fiscal_year: 2027, media_designated: false }
              as: ScheduleCoordinator
              captures: { gy_id: $.data.id }
          assert:
            - "the first create returns HTTP 409 with error.id == ERR_MEMBER_REST_BUFFER_VIOLATION because North plays 3 days earlier"
            - "the second create returns HTTP 201 with the identical game_date and ScheduleGame.${gy_id}.status == SCHEDULED"
            - "exactly two ScheduleGame rows exist for the conference after both attempts"

      - name: championship_venue_capacity_uses_half_open_windows
        grounds:
          - validations[priority=39]
          - entities.Venue.fields.concurrent_event_capacity
          - entities.ChampionshipEvent.fields.window_start
          - entities.ChampionshipEvent.fields.window_end
        distinguishing_aspect: |
          The contended resource is a Venue with an aggregate capacity of 2 over
          half-open [window_start, window_end) intervals, so an event beginning at the
          exact instant another ends does not intersect it and is admitted, while the
          same event moved one second earlier intersects and is refused - a
          duration-interval aggregate capacity distinct from the per-member point-date
          capacity of one.
        test_recipe:
          setup:
            - "The conference exists with current_fiscal_year 2027, no approved budget (so reserve_target_cents is 0 and reserve_posture is OPEN), and member South seated as a charter member with a schedule compliance score of 100."
            - "A FY2027 MEDIA_RIGHTS pool exists in DRAFT to link the events to."
            - "The Eastport Arena has concurrent_event_capacity 2 and already holds two SCHEDULED events: 2027-03-01T00:00:00Z to 2027-03-05T00:00:00Z and 2027-03-03T00:00:00Z to 2027-03-07T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_ms
            - *k_pool
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "SWIMMING", fiscal_year: 2027, window_start: "2027-03-03T00:00:00Z", window_end: "2027-03-07T00:00:00Z" }
              as: ScheduleCoordinator
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "GYMNASTICS", fiscal_year: 2027, window_start: "2027-03-04T00:00:00Z", window_end: "2027-03-06T00:00:00Z" }
              as: ScheduleCoordinator
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "TENNIS", fiscal_year: 2027, window_start: "2027-03-07T00:00:00Z", window_end: "2027-03-09T00:00:00Z" }
              as: ScheduleCoordinator
              captures: { e4_id: $.data.id }
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "GOLF", fiscal_year: 2027, window_start: "2027-03-06T23:59:59Z", window_end: "2027-03-09T00:00:00Z" }
              as: ScheduleCoordinator
          assert:
            - "the GYMNASTICS create returns HTTP 409 with error.id == ERR_VENUE_CAPACITY_EXCEEDED because its window intersects both existing events"
            - "the TENNIS create returns HTTP 201 and ChampionshipEvent.${e4_id}.status == SCHEDULED, because a window starting exactly at 2027-03-07T00:00:00Z does not intersect the half-open window ending at 2027-03-07T00:00:00Z"
            - "the GOLF create returns HTTP 409 with error.id == ERR_VENUE_CAPACITY_EXCEEDED, because starting one second earlier intersects both the SWIMMING and the TENNIS windows"
            - "exactly three ChampionshipEvent rows exist at venue ${v2_id} after all attempts"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:

      - name: distribution_run_conserves_every_cent_of_the_net_pool
        grounds:
          - calculations.pool_reconciliation_identity
          - calculations.distribution_share_allocation
          - calculations.distribution_line_offsets
          - validations[priority=59]
        distinguishing_aspect: |
          The conserved quantity is DistributionRun.net_pool_cents: the reserve draw plus
          every line's net payable, withholding, governance fee and grant-of-rights
          offset must re-sum to exactly 480000000 with a reconciliation_delta_cents of 0,
          which is only achievable because the pinned remainder pass hands out the single
          leftover cent instead of discarding it.
        test_recipe:
          setup:
            - "The full FY2027 media fixture is in place with an OPEN pool holding 500000000 gross cents and 20000000 estimated expense cents, and a reserve of 12000000 cents against an 18000000 cent target."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - *k_g1
            - *k_g2
            - *k_g3
            - *k_g4
            - *k_g1_play
            - *k_g2_play
            - *k_g4_play
            - *k_ba_n
            - *k_ba_n_rev
            - *k_ba_n_app
            - *k_ba_w
            - *k_pool
            - *k_pool_open
            - *k_pool_read
          trigger:
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v}", memo: "conservation probe" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { run_i_id: $.data.id }
            - call: "GET /distribution-runs/${run_i_id}/reconciliation"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "the reconciliation response has net_pool_cents == 480000000 and reserve_draw_cents == 6000000"
            - "the reconciliation response has total_net_payable_cents == 421599997, total_withheld_cents == 47400003, total_governance_fee_cents == 5000000 and total_gor_offset_cents == 0"
            - "6000000 + 421599997 + 47400003 + 5000000 == 480000000, so reconciliation_delta_cents == 0"
            - "the four DistributionLine gross_share_cents values sum to exactly 474000000, the distributable amount"
            - "exactly one line has remainder_cent_awarded == 1, so the single leftover cent is neither dropped nor double-counted"

      - name: bowl_void_restores_conference_unit_and_escrow_counters
        grounds:
          - state_machines.BowlAppearance.APPROVED_to_VOIDED
          - state_machines.PostseasonUnit.VALIDATED_to_VOIDED
          - entities.Conference.fields.validated_postseason_unit_count
          - entities.Conference.fields.escrow_balance_cents
          - validations[priority=35]
        distinguishing_aspect: |
          Two independent conference-level counters are conserved across an
          approve-then-void pair: validated_postseason_unit_count returns from 2 to 0 and
          escrow_balance_cents returns from 4800000 to 0, so the void is an exact
          compensating write rather than a status flag - a different conserved quantity
          from the per-run cent identity.
        test_recipe:
          setup:
            - "The conference exists with current_fiscal_year 2027 and member North seated as a charter member."
            - "North's FY2027 TOURNAMENT appearance claiming 2 units has been APPROVED, so Conference.validated_postseason_unit_count is 2 and Conference.escrow_balance_cents is 4800000."
            - "No distribution run has been posted, so the minted units are not yet distributed."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_mn
            - *k_ba_n
            - *k_ba_n_rev
            - *k_ba_n_app
          trigger:
            - call: "GET /conference"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "POST /bowl-appearances/${ba_n_id}/void"
              payload: { reason: "Payout rescinded by the bowl organiser" }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "GET /conference"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /bowl-appearances/${ba_n_id}/postseason-units"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "the pre-void conference response has validated_postseason_unit_count == 2 and escrow_balance_cents == 4800000"
            - "the post-void conference response has validated_postseason_unit_count == 0 and escrow_balance_cents == 0"
            - "BowlAppearance.${ba_n_id}.status == VOIDED"
            - "the postseason-units response contains 2 rows and both have status == VOIDED"
            - "BowlAppearance.${ba_n_id}.residual_to_pool_cents is still 4800000, so the historical computation is retained even though the escrow contribution has been reversed"
            - "GET /members/${m_n_id}/postseason-unit-valuation returns validated_unit_count == 0 and valuation_cents == 0"
