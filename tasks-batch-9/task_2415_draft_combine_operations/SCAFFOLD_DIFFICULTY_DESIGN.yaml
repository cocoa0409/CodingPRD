  - rule_id: compensating_invariant
    instances:
      - name: trade_rescind_restores_both_capital_ledgers_with_no_inventory_drift
        grounds:
          - state_machines.PickTrade.ACCEPTED_to_RESCINDED
          - entities.Club.fields.draft_capital_points
          - entities.Club.fields.trade_authorization_tier
          - entities.DraftCycle.fields.pick_inventory_chart_points
        distinguishing_aspect: |
          Accepting the trade moves ELM to 1360.0 and HAR to 1394.8; RESCIND must return them
          to exactly 1420.0 and 1334.8, restore each pick's original owner, and leave the cycle
          ledger at 2754.8 points over 4 picks — the same value it held before the trade, since
          a rescission moves ownership without minting or burning chart points. Recomputing
          only the rescinding club leaves the counterparty 60.0 points off.
        test_recipe:
          setup:
            - "DraftCycle 2027 rounds_count 2 in ORDER_FINAL with clubs ELM (draft_order_index 1) and HAR (draft_order_index 2)"
            - "Pre-trade capital: ELM 1420.0 FULL (overall 1 at 1000.0 plus overall 3 at 420.0), HAR 1334.8 FULL (overall 2 at 940.0 plus overall 4 at 394.8); cycle inventory 2754.8 over 4 picks"
            - "ELM offered overall 1 for HAR's overall 2 (chart_balance_points -60.0, imbalance_ratio 0.0600) and HAR accepted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
