  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1: a call with neither X-User-ID nor X-User-Role header is rejected ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role, existence or state check. The `as: Anonymous` marker instructs the harness to omit both headers."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/trays", payload: { template_id: "00000000-0000-0000-0000-000000000000", label: "X" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"]

      - name: role_gate_beats_existence_gate
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
        distinguishing_aspect: "Priority order 2 before 3: an OrScheduler calling release on a NONEXISTENT load id gets ERR_FORBIDDEN_ROLE (role first), not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/sterilization-loads/00000000-0000-0000-0000-000000000000/release", as: OrScheduler, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: existence_gate_beats_state_gate
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=6]"
        distinguishing_aspect: "Priority order 3 before 6: decontamination/start on a NONEXISTENT tray id by a properly-roled technician yields ERR_NOT_FOUND, not a state error."
        test_recipe:
          setup: ["technician A exists"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
          trigger:
            - { call: "POST /spd/trays/00000000-0000-0000-0000-000000000000/decontamination/start", as: SpdTechnician, as_user_id: "${ta}", captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_NOT_FOUND (http 404)"]

      - name: repair_override_requires_justification_then_succeeds
        claim_type: conditional_validation
        grounds:
          - "errors[ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED]"
          - "calculations.repair_vs_replace_recommendation"
        distinguishing_aspect: "Conditional validation: outcome FIXED against a CONDEMNED recommendation (adjusted_ratio 0.625 >= 0.6) is rejected without justification and accepted with a >= 20-char override_justification, recording outcome_overridden == true."
        test_recipe:
          setup: ["technician A; instrument io (SN-O1, usage 5/max 50, replacement 100000, ROUTINE) with repair_count 1 after a first FIXED repair; flagged again and RO2 SENT"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-O1", max_cycles: 50, usage_cycles: 5, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { io: "$.data.id" } }
            - { call: "POST /spd/instruments/${io}/flag-for-repair", as: SpdTechnician, as_user_id: "${ta}", captures: { r1: "$.data.id" } }
            - { call: "POST /spd/repair-orders/${r1}/send", payload: { vendor: "VendorCo", quoted_cost_cents: 50000 }, as: FacilityAdmin }
            - { call: "POST /spd/repair-orders/${r1}/receive", payload: { actual_cost_cents: 50000, outcome: "FIXED" }, as: FacilityAdmin }
            - { call: "POST /spd/instruments/${io}/flag-for-repair", as: SpdTechnician, as_user_id: "${ta}", captures: { r2: "$.data.id" } }
            - { call: "POST /spd/repair-orders/${r2}/send", payload: { vendor: "VendorCo", quoted_cost_cents: 50000 }, as: FacilityAdmin }
          trigger:
            - { call: "POST /spd/repair-orders/${r2}/receive", payload: { actual_cost_cents: 50000, outcome: "FIXED" }, as: FacilityAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /spd/repair-orders/${r2}/receive", payload: { actual_cost_cents: 50000, outcome: "FIXED", override_justification: "Surgeon-critical set; replacement backordered" }, as: FacilityAdmin, captures: { ovr: "$.data.outcome_overridden", ost: "$.data.status" } }
          assert:
            - "err == ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED (outcome FIXED vs recommended CONDEMNED, no justification)"
            - "With justification: ost == CLOSED_FIXED and ovr == true"
            - "The rejected first attempt did not close the order (second receive still legal)"

  - section: endpoints
