  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_refund_money_conservation
        grounds:
          - calculations.invoice_outstanding_cents
          - state_machines.Payment.SUCCEEDED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity = money cents: amount_paid_cents == sum(SUCCEEDED) -
          sum(REFUNDED); the pay-then-refund pair restores amount_paid_cents to its
          pre-payment value 0, and the event summary's collected_cents returns to 0
          while refunded_cents records 50000.
        test_recipe:
          setup:
            - "Event closed; PHYSICAL bundle (FMV 40000) sold for 50000; invoice fully paid (collected 50000)"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala Y", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor S", email: "ds@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Piano", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Piano", description: "Upright", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Piano" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 50000, method: "CARD" }, as: Bidder, as_user_id: "${br}", captures: { pay: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { payment_id: "${pay}", outcome: "SUCCEEDED" }, as: GalaAdmin }
            - { call: "GET /gala-events/${ev}/summary", payload: {}, as: FinanceOfficer, captures: { col1: "$.data.collected_cents", rev1: "$.data.recognized_revenue_cents", con1: "$.data.recognized_contribution_cents" } }
          trigger:
            - { call: "POST /invoices/${inv}/refund", payload: {}, as: FinanceOfficer }
            - { call: "GET /invoices/${inv}", payload: {}, as: FinanceOfficer, captures: { paid2: "$.data.amount_paid_cents" } }
            - { call: "GET /gala-events/${ev}/summary", payload: {}, as: FinanceOfficer, captures: { col2: "$.data.collected_cents", ref2: "$.data.refunded_cents", rev2: "$.data.recognized_revenue_cents", con2: "$.data.recognized_contribution_cents" } }
          assert:
            - "before refund: collected_cents == 50000, recognized_revenue_cents == 40000, recognized_contribution_cents == 10000"
            - "after refund: Invoice.${inv}.amount_paid_cents == 0 (pre-payment value restored)"
            - "after refund: collected_cents == 0 and refunded_cents == 50000"
            - "after refund: recognized_revenue_cents == 0 and recognized_contribution_cents == 0 (REFUNDED excluded from PAID-only aggregates)"

      - name: attach_detach_bundle_fmv_conservation
        grounds:
          - calculations.minimum_bid_cents
          - state_machines.Item.BUNDLED_to_VALUED
        distinguishing_aspect: |
          Conserved quantity = aggregate FMV cents: bundle_fmv_cents == sum of
          member items' current_fmv_cents; attach(15000-item) then detach it then
          re-attach it returns bundle_fmv_cents to exactly 40000 and the bundle
          version advances 1 -> 5 with no drift.
        test_recipe:
          setup:
            - "Event in CATALOGING; items iA (25000) and iB (15000) both VALUED; bundle bd created (fmv 0)"
          setup_api_calls:
