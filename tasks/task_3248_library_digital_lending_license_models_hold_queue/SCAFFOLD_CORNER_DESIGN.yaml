  # ===========================================================================
  # Corners already exercised by §1.8 instances — stubs only.
  - section: state_machines_covered_by_difficulty
    instances:
      - name: covered_wait_dual_variant_and_fund_dual_variant
        claim_type: variant_divergence
        grounds:
          - calculations.wait_estimate
          - calculations.fund_availability
        excluded_because:
          difficulty_instance: dual_variant_calc / wait_estimate_optimistic_vs_pessimistic_queue_cycles + fund_availability_committed_vs_actual_gap
          rationale: "Both dual-variant calcs are asserted with literal divergence in §1.8."
      - name: covered_hold_cycle_and_invoice_cycle
        claim_type: invalid_transition
        grounds:
          - state_machines.Hold
          - state_machines.ConsortiumInvoice
        excluded_because:
          difficulty_instance: non_linear_state_machine / hold_suspend_resume_cycle_preserves_queue_rank + invoice_dispute_reissue_cycle_recomputes_lines
          rationale: "Both cyclic machines exercised end-to-end in §1.8."
      - name: covered_cascades_return_and_epoch
        claim_type: cascade
        grounds:
          - state_machines.Loan
          - state_machines.License
        excluded_because:
          difficulty_instance: transitive_cascade / early_return_copy_hold_ready_wait_cascade + epoch_license_expiry_autopurchase_fulfill_promotion_cascade
          rationale: "Depth-3 and depth-4 cascades asserted hop-by-hop in §1.8."
      - name: covered_priority_conflicts
        claim_type: priority_conflict
        grounds:
          - validations
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / renew_patron_suspended_state_beats_hold_constraint + order_approve_temporal_beats_fiscal
          rationale: "Two distinct error-category pairs pinned in §1.8."
      - name: covered_boundaries
        claim_type: boundary
        grounds:
          - calculations.auto_purchase_decision
          - calculations.checkout_charge_cpc
        excluded_because:
          difficulty_instance: boundary_precision_check / autopurchase_ratio_exact_boundary_geq + cpc_balance_exact_charge_boundary
          rationale: ">= ratio and exact-cents boundaries asserted in §1.8."
      - name: covered_cross_entity_and_temporal_and_invariants
        claim_type: cross_entity
        grounds:
          - state_machines.Loan
          - state_machines.AcquisitionOrder
          - entities.BudgetFund
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / renew_blocked_by_other_patrons_hold + approve_blocked_by_closed_fund; resource_temporal_overlap / ocou_copy_occupancy_until_due_boundary + fund_period_half_open_overlap_vs_adjacency; compensating_invariant / approve_then_cancel_restores_available_committed + circ_checkout_then_grace_return_restores_circs
          rationale: "Rules 7, 8 and 9 each carry two differentiated instances in §1.8."
      - name: covered_allocation_and_rounding_modes
        claim_type: correct_result
        grounds:
          - calculations.consortium_allocation
          - calculations.checkout_charge_cpc
        excluded_because:
          difficulty_instance: combinatorial_formula / cpc_per_event_rounding_beats_sum_then_round + consortium_allocation_host_floor_prorata_remainder
          rationale: "Mode (b) rounding and mode (a) floor/pro-rata formulas asserted with literals in §1.8."
