    output: EscrowAnalysisCycle
    side_effects: ["status DRAFT; window_end_date = projection_start_date + 364 days; any existing DRAFT cycle of the account -> SUPERSEDED; increments EscrowAccount.version by 1; ERR_ANALYSIS_WINDOW_OVERLAP when the closed window overlaps a non-terminal, non-DRAFT-superseded cycle of the account"]
