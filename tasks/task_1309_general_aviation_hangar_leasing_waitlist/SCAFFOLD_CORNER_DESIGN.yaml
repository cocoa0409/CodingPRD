        test_recipe:
          setup:
            - "Airport ACTIVE; hangar AVAILABLE; T_HANGAR schedule"
            - "App A (non-transfer) created 2026-08-01T00:00Z; App B (transfer) created 2026-08-11T00:00Z; ranking at 2026-08-20T00:00Z: A=100+19=119, B=100+9+30=139 → B next despite newer"
