              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl2_id}/receipts"
              payload: { units: 20 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl3_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "lf1@example.com", display_name: "LF One", address_hash: "H-LF1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /panelists"
