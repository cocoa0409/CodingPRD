  - section: consistency_model
    instances:
      - name: accept_credit_hold_visible_immediately
        claim_type: immediate
        grounds: [entities.ContractorAccount.fields.credit_used_cents, state_machines.Quote.SENT_to_ORDERED]
        distinguishing_aspect: "Immediately after accept, GET on the account shows credit_used_cents updated in the same request cycle (no lag)."
        test_recipe:
