            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
          trigger:
            - call: "POST /conflicts-screenings/${sa_id}/decision"
              payload: { outcome: "BLOCKED", decision_note: "late-declared adverse party surfaced in re-screening" }
              as: StaffingCoordinator
          assert:
            - "LINK 1 — ConflictsScreening.${sa_id}.status == BLOCKED with screened_at stamped"
            - "LINK 2 — ConfidentialityAgreement.${caa_id}.status == REVOKED with revocation_reason CONFLICTS_BLOCKED"
            - "LINK 3 — SecureEnvironmentSession.${sesa_id}.status == REVOKED with closed_at stamped"
            - "LINK 3 — Matter.${m_id}.staffed_reviewer_count == 0 and Matter.${m_id}.status == STAFFING"
            - "LINK 4 — Assignment.${a1_id}.status == VOIDED with void_reason CONFLICTS_BLOCKED"
            - "LINK 4 — GET /matters/${m_id}/budget-ledger returns exactly 2 rows: COMMITMENT +85200 then REVERSAL -85200"
            - "LINK 4 — Matter.${m_id}.committed_spend_cents == 0"
            - "LINK 4 — Batch.${b1_id}.status == CREATED"
            - "LINK 4 — Reviewer.${ra_id}.engagement_status == SOURCED (not REMOVED) and scorecard_strikes == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: protocol_gate_precedes_budget_gate
        grounds:
          - validations[priority=15]
          - validations[priority=43]
          - errors[ERR_PROTOCOL_NOT_APPROVED]
          - errors[ERR_BUDGET_WOULD_EXCEED]
        distinguishing_aspect: "Category pair STATE (15) beats BUSINESS_FISCAL (43): one request violates both the approved-protocol gate and the budget-cap gate, and the 409 protocol error must be returned rather than the 402 budget error."
        test_recipe:
          setup:
            - "a Matter identical to the core fixture except budget_cap_cents is 50000, so a 400-document assignment at 85200 cannot fit"
            - "Protocol revision 1 was APPROVED and Reviewer A is VERIFIED, CLEARED and EXECUTED, so the matter reached IN_REVIEW"
            - "Batch 1 (400 documents) exists in CREATED and unassigned"
            - "Protocol revision 2 was then minted, which superseded revision 1 and pushed the Matter back to PROTOCOL_PENDING"
          setup_api_calls:
            - *k_clock
            - *k_client
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Capped Tranche"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "COMPLEX"
                required_languages: ["EN", "JA"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                hourly_rate_cents: 6500
                budget_cap_cents: 50000
                min_staffed_reviewers: 1
                onsite_seat_count: 2
                remote_work_permitted: true
              as: EngagementManager
              captures: { m_id: $.data.id, m_v1: $.data.version }
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_batch1
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { m_v2: $.data.version }
            - call: "POST /matters/${m_id}/protocols"
              payload:
                expected_matter_version: "${m_v2}"
                issue_codes: ["RESPONSIVE", "NOT_RESPONSIVE", "PRIVILEGED", "HOT", "FOREIGN_LANGUAGE"]
                privilege_criteria: ["ATTORNEY_CLIENT", "WORK_PRODUCT", "COMMON_INTEREST"]
                qc_sample_pct: 0.10
                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: true
              as: EngagementManager
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and response.data.error_id == \"ERR_PROTOCOL_NOT_APPROVED\""
            - "the response is NOT 402 / ERR_BUDGET_WOULD_EXCEED even though 85200 > the 50000 cap"
            - "no Assignment row exists: GET /assignments?batch_id=${b1_id} returns an empty list"
            - "Matter.${m_id}.committed_spend_cents == 0 and Matter.${m_id}.status == PROTOCOL_PENDING"
            - "ReviewProtocol.${p_id}.status == SUPERSEDED and ReviewProtocol.${p2_id}.status == DRAFT"
            - "Batch.${b1_id}.status == CREATED and Batch.${b1_id}.version == ${b1_v}"

      - name: remote_authorization_gate_precedes_coverage_window_gate
        grounds:
          - validations[priority=22]
          - validations[priority=29]
          - errors[ERR_REMOTE_WORK_NOT_AUTHORIZED]
          - errors[ERR_SESSION_OUTSIDE_COVERAGE]
        distinguishing_aspect: "A different category pair on a different entity: BUSINESS_SAFETY (22, 403) beats BUSINESS_TEMPORAL (29, 422) on POST /sessions, and the contrast call proves 29 is live by re-issuing the identical out-of-coverage window as ONSITE_SECURE."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW core matter with remote_work_permitted true"
            - "Reviewer A has remote_work_authorized false and an EXECUTED agreement covering [2026-08-01, 2026-10-31]"
            - "the logical clock is 2026-08-01T00:00:00Z, which is inside coverage, so the agreement gate at priority 18 is satisfied"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
          trigger:
            - call: "POST /sessions"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                workstation_class: "REMOTE_VDI"
                starts_at_utc: "2026-11-05T00:00:00Z"
                ends_at_utc: "2026-11-06T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err_remote: $.data.error_id }
            - call: "POST /sessions"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                workstation_class: "ONSITE_SECURE"
                starts_at_utc: "2026-11-05T00:00:00Z"
                ends_at_utc: "2026-11-06T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err_coverage: $.data.error_id }
          assert:
            - "first trigger call: HTTP 403 with response.data.error_id == \"ERR_REMOTE_WORK_NOT_AUTHORIZED\", NOT 422 / ERR_SESSION_OUTSIDE_COVERAGE"
            - "second trigger call: HTTP 422 with response.data.error_id == \"ERR_SESSION_OUTSIDE_COVERAGE\" — the same window is rejected by the lower-priority rule once the safety rule no longer applies"
            - "GET /sessions?reviewer_id=${ra_id} returns an empty list: neither call created a row"
            - "ConfidentialityAgreement.${caa_id}.status == EXECUTED — the clock never moved, so no lazy expiry occurred"

      - name: credential_gate_precedes_capacity_gate
        grounds:
          - validations[priority=19]
          - validations[priority=33]
          - state_machines.Reviewer.VERIFIED_to_LAPSED
          - errors[ERR_CREDENTIAL_NOT_VERIFIED]
        distinguishing_aspect: "A third category pair, BUSINESS_SAFETY (19) beating BUSINESS_CONSTRAINT (33), with both violations live at once: Reviewer A is at max_concurrent_batches 1 AND LAPSED, and Reviewer B keeps the matter at min_staffed_reviewers 1 so the intermediate staffing rule at priority 16 stays satisfied."
