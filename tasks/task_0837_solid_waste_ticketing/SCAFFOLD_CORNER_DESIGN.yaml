        claim_type: violation_to_error
        grounds: ["errors[ERR_HAULER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / manifest_submit_requires_hauler_active
          rationale: "Manifest submit under a SUSPENDED hauler already asserts ERR_HAULER_SUSPENDED in §1.8."

      - name: error_facility_closed_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_FACILITY_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ticket_post_requires_facility_not_closed
          rationale: "Posting into a CLOSED facility already asserts ERR_FACILITY_CLOSED in §1.8."

