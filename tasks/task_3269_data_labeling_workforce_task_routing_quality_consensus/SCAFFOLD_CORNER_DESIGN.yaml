# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3269 data-labeling-workforce-task-routing-quality-consensus
#
# Breadth probe. Walks the claim-extraction guide section by section against
# this scaffold's §1.1–§1.7 surface. Corners already exercised by a §1.8
# instance appear as `excluded_because:` stubs carrying no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: worker_registration_returns_every_declared_field_at_zero_balance
        claim_type: Creation
        grounds:
          - entities.WorkerIdentity
          - endpoints.POST_/api/workers
        distinguishing_aspect: "A worker registered with only a handle comes back 201 with the default USD payout currency, a settlement minimum of 1000 cents and zeroed receivable fields; the handle is never revisable."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/workers"
              payload: { handle: "mira-vega" }
              as: Anonymous
              captures: { w_id: "$.data.id", w_v: "$.data.version" }
          assert:
            - "the response status is 201 and response_type is object"
            - "WorkerIdentity.${w_id}.handle == \"mira-vega\" and payout_currency == USD"
            - "WorkerIdentity.${w_id}.settlement_min_cents == 1000"
            - "WorkerIdentity.${w_id}.worker_receivable_cents == 0 and lifetime_earned_cents == 0"
            - "WorkerIdentity.${w_id}.restricted == false and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are both present"

      - name: program_get_round_trips_the_full_engagement_configuration
        claim_type: Retrieval
        grounds:
          - entities.CustomerProgram
          - endpoints.GET_/api/programs/{id}
        distinguishing_aspect: "Every declared engagement field round-trips through GET unchanged, including the two blackout instants and the null-free derived capacity fields at a cold start."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "SPAN_EXTRACTION", sensitivity_class: "SENSITIVE", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", min_consensus_agreement: 0.75, commitment_quorum: 4, patience_seconds: 900, capacity_points: 50000 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "GET /api/programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "CustomerProgram.${prog_id}.program_code == \"AX-4410\" and instruction_model == SPAN_EXTRACTION"
            - "CustomerProgram.${prog_id}.sensitivity_class == SENSITIVE and min_consensus_agreement == 0.75"
            - "CustomerProgram.${prog_id}.commitment_quorum == 4 and patience_seconds == 900"
            - "CustomerProgram.${prog_id}.blackout_start_utc == \"2026-09-20T00:00:00Z\" and blackout_end_utc == \"2026-09-25T00:00:00Z\""
            - "CustomerProgram.${prog_id}.demand_points == 0 because the engagement holds no spec units yet"
            - "CustomerProgram.${prog_id}.status == DRAFT and operational_restricted == false"

      - name: item_listing_filters_by_spec_unit_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/items
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three pieces across two units, a unit filter returns only its own two rows and the pagination counters describe the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "One es-MX engagement with two published units: U-1 holding two attached pieces and U-2 holding one."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-2", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u2_id: "$.data.id" }
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0002", payload_uri: "s3://ax/0002" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u2_id}/items"
              payload: { item_key: "i-0003", payload_uri: "s3://ax/0003" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/items"
              payload: { spec_unit_id: "${u1_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { first_key: "$.data[0].item_key", first_seq: "$.data[0].item_seq" }
          assert:
            - "the filtered list returns 2 rows in total and the page carries only 1 of them because limit is 1"
            - "the {\"total_count\"} field reads 2 and {\"has_more\"} reads true, so the counters describe the filtered set rather than the whole table"
            - "the first returned piece is i-0001, because rows are ordered by item_seq ASC"
            - "a request with limit 0 is rejected because the pagination minimum is 1"
            - "a request with limit 101 is rejected because the pagination maximum is 100"

      - name: get_item_with_unknown_id_returns_item_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ITEM_NOT_FOUND]
          - endpoints.GET_/api/items/{id}
        distinguishing_aspect: "A read of a well formed but unknown item id returns ERR_ITEM_NOT_FOUND at 404 rather than an empty object or a 500."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "GET /api/items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          trigger:
            - call: "GET /api/commits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err2: "$.data.error_id" }
          assert:
            - "the item read returns ERR_ITEM_NOT_FOUND at status 404"
            - "the commit read returns ERR_COMMIT_NOT_FOUND at status 404"
            - "both error bodies carry response_type error and a non-empty message"

      - name: create_worker_without_a_handle_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=1]
          - errors[ERR_INVALID_REQUEST]
          - entities.WorkerIdentity.handle
        distinguishing_aspect: "Omitting the only required worker field is rejected at the envelope gate with ERR_INVALID_REQUEST at 400, before any existence or business check runs."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/workers"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "the registration returns ERR_INVALID_REQUEST at status 400"
            - "no WorkerIdentity row is created, so a follow up GET on any id returns ERR_WORKER_NOT_FOUND"
            - "the error id is the envelope gate rather than ERR_UNAUTHENTICATED, because the endpoint is open and the missing field is checked at priority 1"

      - name: worker_creation_applies_every_declared_default
        claim_type: Defaults
        grounds:
          - entities.WorkerIdentity.settlement_min_cents
          - entities.WorkerIdentity.payout_currency
        distinguishing_aspect: "Omitting the optional worker fields stamps the declared defaults rather than nulls, and an explicit override replaces the default exactly."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/workers"
              payload: { handle: "linh-tran", payout_currency: "VND", settlement_min_cents: 5000 }
              as: Anonymous
              captures: { w_id: "$.data.id" }
          assert:
            - "WorkerIdentity.${w_id}.payout_currency == VND rather than the USD default"
            - "WorkerIdentity.${w_id}.settlement_min_cents == 5000 rather than the 1000 default"
            - "WorkerIdentity.${w_id}.display_name is absent or null, because no default is declared for it"
            - "WorkerIdentity.${w_id}.worker_receivable_cents == 0 and lifetime_earned_cents == 0"

      - name: qualification_score_is_deterministic_and_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.WorkerQualification.qualification_score
          - entities.WorkerQualification.tier_min_score
          - endpoints.POST_/api/workers/{id}/qualifications
        distinguishing_aspect: "The qualification score is a pure function of the worker handle and language code, so two calls with identical inputs agree exactly and any client-supplied score is ignored."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "tomas-ibarra" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
              captures: { q_id: "$.data.id", q_score: "$.data.qualification_score" }
          assert:
            - "WorkerQualification.${q_id}.qualification_score == 6724, being 5000 + ((9 * 977 + 1166 * 31 + 366 * 17) mod 5000)"
            - "the tier minimum is 6500 for PROFICIENT, so the score of 6724 leaves the qualification above its gate"
            - "the same handle enrolled in hi-IN yields 6367 instead, which is below the PROFICIENT minimum of 6500"
            - "the score is unaffected by the order in which qualifications are created"
            - "a client-supplied score field is not read; only the handle and language code feed the formula"

      - name: worker_system_fields_are_server_generated_and_immutable
        claim_type: System Fields
        grounds:
          - entities.WorkerIdentity
          - endpoints.POST_/api/workers
        distinguishing_aspect: "A brand new worker carries a server-minted UUID with no type prefix, an ISO 8601 UTC timestamp with three fractional digits and version 1, and the caller cannot supply any of them."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/workers"
              payload: { handle: "priya-nair" }
              as: Anonymous
              captures: { w_id: "$.data.id", w_created: "$.data.created_at", w_version: "$.data.version" }
          assert:
            - "the minted id matches the UUID shape with five hyphen separated groups and no entity type prefix"
            - "WorkerIdentity.${w_id}.created_at is an ISO 8601 UTC instant carrying three fractional digits"
            - "WorkerIdentity.${w_id}.version == 1 on creation"
            - "the read-back created_at equals the creation response created_at, so the timestamp is stable across reads"
            - "updated_at equals created_at until the first mutation"

      - name: sensitivity_class_enum_rejects_an_unknown_value
        claim_type: Type Constraints
        grounds:
          - entities.CustomerProgram.sensitivity_class
          - validations[priority=1]
        distinguishing_aspect: "An unknown enum member is rejected at the envelope gate with ERR_INVALID_REQUEST at 400 rather than being coerced to a default."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "TOP_SECRET", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the create returns ERR_INVALID_REQUEST at status 400"
            - "TOP_SECRET is not one of STANDARD, SENSITIVE or RESTRICTED, so no engagement row is written"
            - "the same payload with sensitivity_class omitted succeeds at 201 and takes the STANDARD default"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: frozen_program_rejects_further_dispatch_with_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CustomerProgram.ACTIVE_to_FROZEN
          - state_machines.LabelingItem.PENDING_to_ROUTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After the terminal freeze, an otherwise well formed dispatch against a surviving piece is rejected by the program state gate and no assignment row appears."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit holding one released piece, then frozen terminally."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "kevin-lum" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "FREEZE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the dispatch returns ERR_INVALID_STATE at status 409, because the ancestor engagement is FROZEN"
            - "the piece consensus_status stays PENDING and no Commit row is created"
            - "the spec unit created before the freeze has status REJECTED, so the freeze cascade reached it"
            - "a reopen attempt on the frozen engagement is also rejected, because FROZEN is terminal"

      - name: newly_created_piece_starts_in_the_declared_initial_state
        claim_type: Initial State
        grounds:
          - entities.LabelingItem.item_status
          - entities.LabelingItem.consensus_status
          - endpoints.POST_/api/spec-units/{id}/items
        distinguishing_aspect: "A freshly attached piece is PENDING on both its container state and its consensus dimension before any release, routing or panel work."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "One es-MX engagement with a published unit in DRAFT."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
          trigger:
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
          assert:
            - "LabelingItem.${it1_id}.item_status == PENDING and consensus_status == PENDING"
            - "LabelingItem.${it1_id}.status == DRAFT and rework_cycles == 0"
            - "LabelingItem.${it1_id}.gold_audits_this_week == 0 and gold_rotation == false"
            - "LabelingItem.${it1_id}.instruction_revision == 1, copied from the owning unit"
            - "LabelingItem.${it1_id}.item_seq == 1 and SpecUnit.item_count == 1"

      - name: revoked_qualification_is_terminal_and_blocks_dispatch
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WorkerQualification.IN_TRAINING_to_REVOKED
          - calculations.worker_selection
          - errors[ERR_NO_ELIGIBLE_WORKER]
        distinguishing_aspect: "REVOKED is terminal: a qualification whose deterministic score sits below its tier minimum cannot be verified, and once revoked it never returns to the eligible pool."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit at panel_size 1 and one released piece; the only pool member's es-MX score is 6390, below the PROFICIENT minimum of 6500."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "sara-kowalski" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
              captures: { q_id: "$.data.id" }
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
          trigger:
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the verification returns ERR_QUALIFICATION_SCORE_BELOW_TIER at status 422, because 6390 is strictly below the PROFICIENT minimum of 6500"
            - "the qualification stays IN_TRAINING and is never routable"
            - "a dispatch against the piece then returns ERR_NO_ELIGIBLE_WORKER at status 422, because the pool holds no eligible member"
            - "the same worker enrolled at NOVICE has a minimum of 5000 and verifies successfully, showing the tier is what the gate reads"

      - name: abstaining_commit_leaves_the_agreement_denominator
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Commit.DISPATCHED_to_ABSTAINED
          - calculations.consensus_value_groups
          - entities.LabelingItem.non_abstaining_commit_count
        distinguishing_aspect: "An abstention moves the assignment to ABSTAINED, nulls its committed value and leaves the agreement denominator untouched, so the abstainer can never dilute or inflate the ratio."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit at panel_size 2 holding one released piece and two pooled es-MX workers."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "mira-vega" }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /api/workers"
              payload: { handle: "linh-tran" }
              as: Anonymous
              captures: { b_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 2, min_consensus_agreement: 0.6 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 2 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
