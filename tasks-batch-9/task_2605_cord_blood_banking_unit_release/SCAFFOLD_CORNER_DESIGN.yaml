      - name: corner_second_hold_built_on_a_stale_unit_read_is_rejected_then_accepted
        claim_type: optimistic_concurrency
        grounds: "§1.2.1 concurrency_rules rule_id reservation-create-stale-unit: write_endpoint POST /cbb/reservations, occ_field expected_unit_version, error_id ERR_STALE_UNIT_VERSION, http_status 412; §1.5 POST /cbb/reservations side effect 'unit version += 1'."
        distinguishing_aspect: "Exactly the race the rule was written for: a hold does NOT move availability_status, so the second centre's view of the unit looks perfectly current in every business field and only the version counter reveals that another hold was attached in between. The retry with a re-read version and the identical hold window then succeeds, proving the refusal was purely a version mismatch."
        test_recipe:
          setup:
            - "The canonical private intake through cryopreservation; unit CRYOPRESERVED / PRIVATE_STORED / ELIGIBLE."
            - "Centre tc-001 reads the unit at version V and places a hold for 2026-09-01 to 2026-09-05, which bumps the unit to V+1."
            - "Centre tc-002 is still holding the stale value V from the same read."
            - "The clock stands at 2026-08-11T00:00:00Z."
