  - rule_id: transitive_cascade
    instances:
      - name: supplier_suspension_propagates_five_hops_to_certificate_and_posture
        grounds:
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.Ingredient.APPROVED_to_BLOCKED
          - state_machines.Product.formula_dimension.CLEARED_to_BLOCKED
          - state_machines.Certificate.ISSUED_to_SUSPENDED
          - state_machines.Product.label_dimension.APPROVED_to_FROZEN
          - entities.Ingredient.fields.parent_ingredient_id
          - entities.Ingredient.fields.blocked_reason
          - calculations.applicant_compliance_posture
          - endpoints."POST /gfco/suppliers/{supplierId}/status"
        distinguishing_aspect: |
          One supplier status write must travel five hops through four entity types: the suspended
          supplier's own ingredient (blocked_reason SUPPLIER_SUSPENDED), the self-referential
          compound parent that merely contains it and belongs to a DIFFERENT, still-active supplier
          (blocked_reason SUB_COMPONENT_BLOCKED), the product that links only the parent, the
          issued certificate of that product, and finally the product label plus the applicant's
          posture counters. Stopping at hop 1 leaves the parent APPROVED; stopping at hop 2 leaves
          a certified product whose formula is blocked; stopping at hop 4 leaves an unfrozen label
          and a posture of 100 instead of 95.
        test_recipe:
          setup:
            - "Two suppliers: sup_a (Prairie Mills) supplies the sub-component, sup_b (Cascade Blending) supplies the compound blend and stays ACTIVE throughout."
            - "A compound GF_PROCESSED ingredient from sup_b with ALLERGEN_STATEMENT and PROCESS_FLOW verified, and an INHERENTLY_GF sub-component from sup_a whose parent_ingredient_id points at that compound ingredient; both are APPROVED."
            - "One product links ONLY the compound parent at inclusion_pct 40, so threshold_ppm is 10, sampling_lots_per_year is 3 and sampling_exclusion_days is 121; it is CLEARED with an APPROVED STANDARD label."
            - "A facility audit closed CLOSED_PASS on 2026-08-10 and a certificate issued at 2026-08-11T00:00:00Z with base_fee_cents 149000 and total_fee_cents 178800."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
