# =============================================================================
# PRD Benchmark Scaffold — Insurance Premium Finance
# Sections §1.0 – §1.7 (difficulty design and corner design live in siblings)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2638. Insurance Premium Finance (insurance premium finance company): premium finance agreement
  origination with down payment, term and finance charge by state rules, power of attorney to cancel
  the underlying policies on default, insurer and agent verification of premium amounts and policy
  effective dates, payment posting, late fee assessment and notice-of-intent-to-cancel timelines,
  cancellation request to carriers and unearned premium return calculation, deficiency balance
  collection and agent chargeback for uncollected amounts, multi-policy account restructuring and
  additional premium endorsements, licensing and rate compliance by state

domain_name: insurance-premium-finance
api_prefix: ""          # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional-vs-final quote; commission-vs-reserve chargeback
    - cascading_side_effects        # return posting -> deficiency -> chargeback -> agent suspension
    - rate_threshold_triggers       # tiered finance-charge rate, grace days, late-fee caps, liability cap
    - optimistic_concurrency        # OCC on PremiumFinanceAgreement.version and AgentChargeback.version

  entity_topology: flat
  # Fifteen peer entities linked by explicit foreign keys. No entity is addressed through a
  # nested ownership path except for creation/sub-resource reads; every resource has a
  # top-level `/collection/{id}` identity.

  state_machine_shape: parallel
  # PremiumFinanceAgreement carries two independent state dimensions on the same row
  # (`status` for the financing lifecycle, `delinquency_stage` for the collection lifecycle),
  # each with its own transition table. FinancedPolicy adds a fork (VERIFIED | DISPUTED) with
  # divergent side-effect sets plus a revision cycle (DISPUTED -> PENDING_VERIFICATION).
  # CancellationNotice forks three ways (CURED | EXECUTED | SUPERSEDED).

  relationship_patterns:
    - one_to_many          # agreement -> policies / installments / payments / late fees / notices
    - self_referential     # PremiumFinanceAgreement.restructured_from_agreement_id -> PremiumFinanceAgreement.id
    - cross_aggregate      # AgentChargeback spans ProducerAgent and PremiumFinanceAgreement
    - polymorphic_actor    # PremiumVerification.party is INSURER or PRODUCER_AGENT on one table

  role_model: segregation_of_duties
  # Two mandated two-person controls: the analyst who originated an agreement may not approve its
  # rate exception, and the analyst who issued a notice of intent to cancel may not exercise the
  # power of attorney that executes it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 46 endpoints / 53 error codes / 7 calculations / 12 state-machine tables.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StateRateRule
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: two-letter USPS state code this rate regime governs
        constraints: "exactly 2 uppercase letters; unique across StateRateRule"
      - name: finance_charge_method
        type: enum
        source: input
        description: statutory finance-charge computation method for this state
        constraints: "one of {ADD_ON, SIMPLE_INTEREST}"
      - name: max_annual_rate_bps
        type: integer
        source: input
        description: statutory ceiling on the annual finance-charge rate in basis points
        constraints: ">= 1 and <= 3000"
      - name: max_service_fee_cents
        type: integer
        source: input
        description: statutory ceiling on the one-time service fee that may be financed
        constraints: ">= 0"
      - name: min_down_payment_bps
        type: integer
        source: input
        description: statutory minimum down payment as basis points of total premium
        constraints: ">= 0 and <= 10000"
      - name: max_term_months
        type: integer
        source: input
        description: statutory maximum number of monthly installments
        constraints: ">= 2 and <= 36"
      - name: late_fee_bps
        type: integer
        source: input
        description: late fee as basis points of the past-due installment amount
        constraints: ">= 0 and <= 2000"
      - name: late_fee_min_cents
        type: integer
        source: input
        description: statutory floor applied to a computed late fee
        constraints: ">= 0"
      - name: late_fee_max_cents
        type: integer
        source: input
        description: statutory ceiling applied to a computed late fee
        constraints: ">= late_fee_min_cents"
      - name: grace_period_days
        type: integer
        source: input
        description: days after an installment due date before a late fee may be assessed
        constraints: ">= 0 and <= 30"
      - name: noic_notice_days
        type: integer
        source: input
        description: statutory days of notice that must elapse between issuing a notice of intent to cancel and exercising the power of attorney
        constraints: ">= 5 and <= 30"
      - name: unearned_premium_method
        type: enum
        source: input
        description: method the finance company uses to estimate the carrier's unearned premium return
        constraints: "one of {PRO_RATA, SHORT_RATE}"
      - name: short_rate_penalty_bps
        type: integer
        source: input
        description: basis points withheld from the pro-rata return under the SHORT_RATE method
        constraints: ">= 0 and <= 5000"
      - name: rebate_method
        type: enum
        source: input
        description: method for rebating the unearned finance charge on payoff or cancellation
        constraints: "one of {RULE_OF_78, ACTUARIAL}"
      - name: max_late_fees_per_agreement
        type: integer
        source: input
        description: statutory cap on the number of late fees assessable over the life of one agreement
        constraints: ">= 1 and <= 12"
      - name: license_required
        type: boolean
        source: input
        description: whether an effective premium finance license is required to originate in this state
        default: true
      - name: active_agreement_count
        type: integer
        source: computed
        description: count of PremiumFinanceAgreement rows referencing this rule whose status IN {PENDING_VERIFICATION, ACTIVE}
        default: 0

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: state_rule_id
        type: string
        source: input
        description: "FK -> StateRateRule.id; the state licensing regime this license satisfies"
      - name: license_number
        type: string
        source: input
        description: regulator-issued premium finance license number
        constraints: "non-empty; unique per state_rule_id"
      - name: status
        type: enum
        source: system
        description: administrative status of the license
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED produced by POST /licenses/{id}/suspend"
      - name: effective_date
        type: string
        source: input
        description: first day the license authorises origination
        constraints: "ISO 8601 calendar date (YYYY-MM-DD)"
      - name: expiration_date
        type: string
        source: input
        description: last day the license authorises origination
        constraints: "ISO 8601 calendar date; strictly after effective_date"
      - name: is_effective
        type: boolean
        source: computed
        description: "true when status == ACTIVE AND effective_date <= clock_date <= expiration_date (both bounds inclusive), where clock_date is the date part of the logical clock"

  - name: Insured
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: borrower's legal name as it appears on the agreement
        constraints: non-empty
      - name: mailing_state_code
        type: string
        source: input
        description: borrower's mailing state, used for notice addressing
        constraints: "exactly 2 uppercase letters"
      - name: email
        type: string
        source: input
        description: borrower contact address for statutory notices
        constraints: "must contain '@'"

  - name: ProducerAgent
    parent: null
    common_fields: true
    fields:
      - name: agency_name
        type: string
        source: input
        description: producing agency's business name
        constraints: non-empty
      - name: state_code
        type: string
        source: input
        description: state in which the agency is appointed
        constraints: "exactly 2 uppercase letters"
      - name: agent_commission_bps
        type: integer
        source: input
        description: agency commission as basis points of financed premium, used by the COMMISSION_CAPPED chargeback basis
        constraints: ">= 0 and <= 3000"
      - name: chargeback_basis
        type: enum
        source: input
        description: which chargeback variant applies to this agency's uncollected deficiencies
        constraints: "one of {COMMISSION_CAPPED, RESERVE_CAPPED}"
      - name: chargeback_liability_cap_cents
        type: integer
        source: input
        description: lifetime ceiling on outstanding chargeback exposure for this agency
        constraints: ">= 0"
      - name: chargeback_reserve_balance_cents
        type: integer
        source: computed
        description: reserve funds available to offset chargebacks; seeded from initial_reserve_balance_cents at creation and reduced by each offset
        default: 0
      - name: outstanding_chargeback_cents
        type: integer
        source: computed
        description: "sum of (AgentChargeback.amount_cents - AgentChargeback.offset_applied_cents) over rows for this agency whose status IN {PENDING, PARTIALLY_OFFSET}"
        default: 0
      - name: status
        type: enum
        source: system
        description: whether this agency may be named on new agreements
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED_FOR_CHARGEBACKS, SUSPENDED_BY_COMPLIANCE}; SUSPENDED_FOR_CHARGEBACKS produced by the chargeback cascade, SUSPENDED_BY_COMPLIANCE by POST /agents/{id}/suspend"

  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - name: carrier_name
        type: string
        source: input
        description: carrier's business name
        constraints: non-empty
      - name: naic_code
        type: string
        source: input
        description: carrier NAIC identifier
        constraints: "non-empty; unique across Insurer"
      - name: status
        type: enum
        source: input
        description: whether the carrier is admitted for new financing
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}; set at creation"

  - name: PremiumFinanceAgreement
    parent: null
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        description: "FK -> Insured.id; the borrower obligated on the note"
      - name: producer_agent_id
        type: string
        source: input
        description: "FK -> ProducerAgent.id; the producing agency answerable for chargebacks"
      - name: state_rule_id
        type: string
        source: input
        description: "FK -> StateRateRule.id; the governing state rate regime, fixed at creation"
      - name: restructured_from_agreement_id
        type: string
        source: system
        description: "FK -> PremiumFinanceAgreement.id; predecessor agreement when this row was minted by POST /agreements/{id}/restructure; null for originally originated agreements"
        default: null
      - name: originated_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceAnalyst who created the agreement; frozen at creation and used by the rate-exception segregation-of-duties check
      - name: status
        type: enum
        source: system
        description: financing lifecycle dimension
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_VERIFICATION, ACTIVE, PAID_IN_FULL, RESTRUCTURED, CANCELLED_DEFICIENT, CLOSED_ZERO, VOID}"
      - name: delinquency_stage
        type: enum
        source: system
        description: collection lifecycle dimension, advanced independently of status
        default: CURRENT
        constraints: "one of {CURRENT, LATE, NOIC_ISSUED, CANCELLATION_REQUESTED, CANCELLED}"
      - name: down_payment_cents
        type: integer
        source: input
        description: cash collected from the insured before financing
        constraints: ">= 0"
      - name: service_fee_cents
        type: integer
        source: input
        description: one-time service fee added to the amount financed
        constraints: ">= 0"
      - name: installment_count
        type: integer
        source: input
        description: number of monthly installments in the note
        constraints: ">= 2"
      - name: first_installment_due_date
        type: string
        source: input
        description: due date of installment number 1
        constraints: "ISO 8601 calendar date (YYYY-MM-DD)"
      - name: rate_exception_approved
        type: boolean
        source: system
        description: true once a ComplianceOfficer has approved a rate/fee exception on this agreement
        default: false
      - name: rate_exception_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approving ComplianceOfficer
        default: null
      - name: approved_service_fee_cap_cents
        type: integer
        source: system
        description: service-fee ceiling granted by the rate exception; overrides StateRateRule.max_service_fee_cents while set
        default: null
      - name: approved_annual_rate_bps
        type: integer
        source: system
        description: annual rate granted by the rate exception; replaces the tiered rate when set
        default: null
      - name: total_premium_cents
        type: integer
        source: computed
        description: sum of financed premium across this agreement's policies; PROVISIONAL basis sums FinancedPolicy.gross_premium_cents, FINAL basis sums FinancedPolicy.financed_premium_cents
        default: 0
      - name: amount_financed_cents
        type: integer
        source: computed
        description: total_premium_cents - down_payment_cents + service_fee_cents
        default: 0
      - name: effective_annual_rate_bps
        type: integer
        source: computed
        description: rate actually applied after tier selection and statutory capping
        default: 0
      - name: finance_charge_cents
        type: integer
        source: computed
        description: total finance charge over the term under the state's finance_charge_method
        default: 0
      - name: total_of_payments_cents
        type: integer
        source: computed
        description: amount_financed_cents + finance_charge_cents
        default: 0
      - name: quote_basis
        type: enum
        source: computed
        description: which variant of calculations.finance_charge_and_amount_financed produced the current money fields
        default: null
        constraints: "one of {PROVISIONAL, FINAL}; PROVISIONAL set by submit, FINAL by activate / endorsement financing / restructure"
      - name: principal_balance_cents
        type: integer
        source: computed
        description: unpaid principal portion of the note
        default: 0
      - name: unpaid_finance_charge_cents
        type: integer
        source: computed
        description: unpaid finance-charge portion of the note, net of any rebate already granted
        default: 0
      - name: late_fee_balance_cents
        type: integer
        source: computed
        description: "sum of LateFeeAssessment.amount_cents for this agreement where status == OUTSTANDING"
        default: 0
      - name: late_fee_count
        type: integer
        source: computed
        description: lifetime count of LateFeeAssessment rows ever created for this agreement; never decremented by waiver or payment reversal
        default: 0
      - name: unapplied_credit_cents
        type: integer
        source: computed
        description: suspense balance holding payment remainders that no obligation absorbed
        default: 0
      - name: unearned_premium_received_cents
        type: integer
        source: computed
        description: "sum of CarrierCancellationRequest.carrier_returned_cents for this agreement where status == RETURN_POSTED"
        default: 0
      - name: deficiency_balance_cents
        type: integer
        source: computed
        description: amount still owed by the insured after all carrier returns were applied, inclusive of the cancellation fee
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: surplus owed back to the insured when carrier returns exceeded the gross balance
        default: 0
      - name: agent_chargeback_cents
        type: integer
        source: computed
        description: portion of deficiency_balance_cents charged back to the producing agency
        default: 0
      - name: policy_count
        type: integer
        source: computed
        description: "count of FinancedPolicy rows for this agreement whose status != CANCELLED"
        default: 0
      - name: verified_policy_count
        type: integer
        source: computed
        description: "count of FinancedPolicy rows for this agreement whose status == VERIFIED"
        default: 0
      - name: carried_over_balance_cents
        type: integer
        source: computed
        description: receivable carried in from the predecessor agreement at restructure; 0 for originally originated agreements
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant at which the agreement became ACTIVE
        default: null

  - name: FinancedPolicy
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the agreement financing this policy; re-pointed to the successor agreement on restructure"
      - name: insurer_id
        type: string
        source: input
        description: "FK -> Insurer.id; the carrier that issued the policy and owes any unearned premium"
      - name: policy_number
        type: string
        source: input
        description: carrier's policy number
        constraints: non-empty
      - name: gross_premium_cents
        type: integer
        source: input
        description: premium quoted by the producing agency at origination
        constraints: "> 0"
      - name: effective_date
        type: string
        source: input
        description: first day of coverage as quoted
        constraints: "ISO 8601 calendar date"
      - name: expiration_date
        type: string
        source: input
        description: last day of coverage (exclusive upper bound of the coverage interval)
        constraints: "ISO 8601 calendar date; strictly after effective_date and at most 730 days later"
      - name: min_earned_days
        type: integer
        source: input
        description: carrier's minimum earned days; a cancellation inside this window earns the carrier premium for exactly min_earned_days
        default: 0
        constraints: ">= 0"
      - name: fully_earned
        type: boolean
        source: input
        description: true when the premium is non-refundable, so no unearned premium is ever returned
        default: false
      - name: carried_over
        type: boolean
        source: system
        description: true when this policy was re-pointed to a successor agreement by a restructure; carried-over policies are excluded from the successor's premium basis because their unpaid balance already arrives through carried_over_balance_cents
        default: false
      - name: status
        type: enum
        source: system
        description: verification/coverage lifecycle
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, DISPUTED, CANCELLED}"
      - name: verified_premium_cents
        type: integer
        source: computed
        description: premium both parties agreed on; set when the policy reaches VERIFIED
        default: null
      - name: verified_effective_date
        type: string
        source: computed
        description: effective date both parties agreed on; set when the policy reaches VERIFIED
        default: null
      - name: dispute_reason
        type: enum
        source: computed
        description: why the two verifications failed to agree
        default: null
        constraints: "one of {PREMIUM_MISMATCH, EFFECTIVE_DATE_MISMATCH, PARTY_REJECTED}"
      - name: endorsed_premium_cents
        type: integer
        source: computed
        description: "sum of PremiumEndorsement.signed_amount_cents for this policy where status == FINANCED"
        default: 0
      - name: financed_premium_cents
        type: integer
        source: computed
        description: verified_premium_cents + endorsed_premium_cents; the premium figure the FINAL quote variant sums
        default: 0
      - name: cancellation_effective_date
        type: string
        source: computed
        description: date the power of attorney cancelled coverage
        default: null
      - name: earned_days
        type: integer
        source: computed
        description: "max(min_earned_days, days from verified_effective_date to cancellation_effective_date), capped at the full term"
        default: null
      - name: unearned_premium_estimate_cents
        type: integer
        source: computed
        description: the finance company's estimate of the carrier's return, per calculations.unearned_premium_return_estimate
        default: null
      - name: unearned_premium_returned_cents
        type: integer
        source: computed
        description: amount the carrier actually posted back for this policy
        default: 0

  - name: PremiumVerification
    parent: null
    common_fields: false
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> FinancedPolicy.id; the policy whose premium and effective date are attested"
      - name: party
        type: enum
        source: system
        description: which side of the transaction attested, derived from X-User-Role
        constraints: "one of {INSURER, PRODUCER_AGENT}"
      - name: party_user_id
        type: string
        source: system
        description: X-User-ID of the attesting party; equals FinancedPolicy.insurer_id for INSURER and PremiumFinanceAgreement.producer_agent_id for PRODUCER_AGENT
      - name: decision
        type: enum
        source: input
        description: the party's attestation
        constraints: "one of {CONFIRMED, CORRECTED, REJECTED}"
      - name: corrected_premium_cents
        type: integer
        source: input
        description: premium the party asserts; required when decision == CORRECTED, forbidden otherwise
        default: null
        constraints: "> 0 when present"
      - name: corrected_effective_date
        type: string
        source: input
        description: effective date the party asserts; required when decision == CORRECTED, forbidden otherwise
        default: null
        constraints: "ISO 8601 calendar date"
      - name: effective_premium_cents
        type: integer
        source: computed
        description: "CONFIRMED -> FinancedPolicy.gross_premium_cents; CORRECTED -> corrected_premium_cents; REJECTED -> null"
        default: null
      - name: effective_date_asserted
        type: string
        source: computed
        description: "CONFIRMED -> FinancedPolicy.effective_date; CORRECTED -> corrected_effective_date; REJECTED -> null"
        default: null
      - name: note
        type: string
        source: input
        description: free-text remark retained for audit
        default: null
      - name: superseded
        type: boolean
        source: system
        description: set true when POST /policies/{id}/reopen-verification retires this record from the agreement evaluation
        default: false

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the note this installment belongs to"
      - name: installment_number
        type: integer
        source: system
        description: 1-based position in the schedule
        constraints: ">= 1 and <= PremiumFinanceAgreement.installment_count"
      - name: due_date
        type: string
        source: system
        description: "first_installment_due_date advanced by (installment_number - 1) calendar months; when the target month has no such day, the last day of that month is used"
      - name: amount_cents
        type: integer
        source: computed
        description: total amount due on this installment
      - name: principal_component_cents
        type: integer
        source: computed
        description: portion of amount_cents that retires principal
      - name: finance_charge_component_cents
        type: integer
        source: computed
        description: portion of amount_cents that retires finance charge
      - name: paid_cents
        type: integer
        source: computed
        description: cumulative amount applied to this installment by POSTED payments
        default: 0
      - name: status
        type: enum
        source: system
        description: installment lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PAST_DUE, PAID, VOIDED}"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the note credited"
      - name: amount_cents
        type: integer
        source: input
        description: gross amount tendered
        constraints: "> 0"
      - name: received_date
        type: string
        source: input
        description: date funds were received
        constraints: "ISO 8601 calendar date; must not be after the logical clock_date"
      - name: method
        type: enum
        source: input
        description: tender type
        constraints: "one of {ACH, CHECK, CARD}"
      - name: status
        type: enum
        source: system
        description: posting lifecycle
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"
      - name: applied_late_fee_cents
        type: integer
        source: computed
        description: portion of amount_cents absorbed by OUTSTANDING late fees in bucket 1 of the waterfall
        default: 0
      - name: applied_finance_charge_cents
        type: integer
        source: computed
        description: portion absorbed by finance-charge components of installments
        default: 0
      - name: applied_principal_cents
        type: integer
        source: computed
        description: portion absorbed by principal components of installments
        default: 0
      - name: applied_unapplied_cents
        type: integer
        source: computed
        description: remainder parked in the agreement's suspense balance
        default: 0
      - name: rebate_applied_cents
        type: integer
        source: computed
        description: unearned finance charge rebated when the PAYOFF allocation variant applied
        default: 0
      - name: allocation_variant
        type: enum
        source: computed
        description: which variant of calculations.payment_waterfall_allocation ran
        constraints: "one of {STANDARD, PAYOFF}"
      - name: reversal_reason
        type: enum
        source: system
        description: why the posting was reversed
        default: null
        constraints: "one of {NSF, BANK_ERROR}"
      - name: reversed_at
        type: datetime
        source: system
        description: logical-clock instant of reversal
        default: null

  - name: LateFeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the note charged"
      - name: installment_number
        type: integer
        source: system
        description: the past-due installment that triggered the fee (plain integer, not a foreign key)
      - name: assessed_date
        type: string
        source: system
        description: clock_date of the servicing run that assessed the fee
      - name: amount_cents
        type: integer
        source: computed
        description: fee amount per calculations.late_fee_assessment
      - name: status
        type: enum
        source: system
        description: fee lifecycle
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, PAID, WAIVED, REVERSED}; REVERSED is produced only when a restructure rolls the fee into the successor note"
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who waived the fee
        default: null

  - name: CancellationNotice
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the delinquent note noticed"
      - name: issued_date
        type: string
        source: system
        description: clock_date at issuance
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the issuing FinanceAnalyst; used by the power-of-attorney segregation-of-duties check
      - name: notice_days
        type: integer
        source: system
        description: StateRateRule.noic_notice_days snapshotted at issuance
      - name: effective_cancel_date
        type: string
        source: computed
        description: issued_date advanced by notice_days calendar days
      - name: past_due_amount_cents
        type: integer
        source: computed
        description: "sum of (Installment.amount_cents - Installment.paid_cents) over installments with status == PAST_DUE plus late_fee_balance_cents, snapshotted at issuance"
      - name: status
        type: enum
        source: system
        description: notice lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, CURED, EXECUTED, SUPERSEDED}"
      - name: cured_date
        type: string
        source: computed
        description: clock_date on which a payment cured the delinquency
        default: null
      - name: executed_date
        type: string
        source: computed
        description: clock_date on which the power of attorney was exercised
        default: null

  - name: CarrierCancellationRequest
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the note whose power of attorney was exercised"
      - name: policy_id
        type: string
        source: input
        description: "FK -> FinancedPolicy.id; the policy the carrier is asked to cancel"
      - name: requested_date
        type: string
        source: system
        description: clock_date on which the request was transmitted
      - name: cancellation_effective_date
        type: string
        source: system
        description: CancellationNotice.effective_cancel_date of the executed notice
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceAnalyst who exercised the power of attorney
      - name: computed_unearned_premium_cents
        type: integer
        source: computed
        description: the finance company's estimate of the return, per calculations.unearned_premium_return_estimate
      - name: estimate_method
        type: enum
        source: computed
        description: StateRateRule.unearned_premium_method snapshotted at request time
        constraints: "one of {PRO_RATA, SHORT_RATE}"
      - name: carrier_returned_cents
        type: integer
        source: input
        description: amount the carrier actually returned, supplied on the return posting
        default: null
        constraints: ">= 0"
      - name: variance_cents
        type: integer
        source: computed
        description: carrier_returned_cents - computed_unearned_premium_cents (negative when the carrier returned less than estimated)
        default: null
      - name: status
        type: enum
        source: system
        description: request lifecycle
        default: REQUESTED
        constraints: "one of {REQUESTED, RETURN_POSTED, CLOSED_NO_RETURN}"

  - name: PremiumEndorsement
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> FinancedPolicy.id; the policy being endorsed"
      - name: endorsement_type
        type: enum
        source: input
        description: direction of the premium change
        constraints: "one of {ADDITIONAL_PREMIUM, RETURN_PREMIUM}"
      - name: amount_cents
        type: integer
        source: input
        description: magnitude of the premium change
        constraints: "> 0"
      - name: effective_date
        type: string
        source: input
        description: date the endorsement takes effect
        constraints: "ISO 8601 calendar date; on or after FinancedPolicy.verified_effective_date"
      - name: status
        type: enum
        source: system
        description: endorsement lifecycle
        default: PENDING
        constraints: "one of {PENDING, FINANCED, DECLINED}"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents for ADDITIONAL_PREMIUM, -amount_cents for RETURN_PREMIUM"
      - name: financed_at
        type: datetime
        source: system
        description: logical-clock instant at which the endorsement was folded into the note
        default: null

  - name: AgentChargeback
    parent: null
    common_fields: true
    fields:
      - name: producer_agent_id
        type: string
        source: input
        description: "FK -> ProducerAgent.id; the agency answerable for the uncollected deficiency"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PremiumFinanceAgreement.id; the cancelled note that produced the deficiency"
      - name: amount_cents
        type: integer
        source: computed
        description: chargeback amount per calculations.deficiency_and_agent_chargeback
      - name: basis
        type: enum
        source: computed
        description: ProducerAgent.chargeback_basis snapshotted at creation
        constraints: "one of {COMMISSION_CAPPED, RESERVE_CAPPED}"
      - name: offset_applied_cents
        type: integer
        source: computed
        description: cumulative amount offset against the agency's reserve
        default: 0
      - name: status
        type: enum
        source: system
        description: chargeback lifecycle
        default: PENDING
        constraints: "one of {PENDING, PARTIALLY_OFFSET, OFFSET}"
      - name: reason
        type: string
        source: system
        description: human-readable origin of the chargeback, always "CANCELLATION_DEFICIENCY" in this release

# =============================================================================
# §1.2 State Machine Table
# Twelve tables. PremiumFinanceAgreement carries two independent state dimensions
# (`status` and `delinquency_stage`) that advance on their own transition tables.
# =============================================================================
state_machines:

  - entity: PremiumFinanceAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOID, RESTRUCTURED, CANCELLED_DEFICIENT, CLOSED_ZERO]
    transitions:
      - from: DRAFT
        to: PENDING_VERIFICATION
        trigger: "POST /agreements/{id}/submit"
        actor: FinanceAnalyst
        preconditions:
          - "policy_count >= 1 (at least one FinancedPolicy row references this agreement)"
          - "every FinancedPolicy for this agreement has status == PENDING_VERIFICATION"
          - "StateRateRule.license_required == false OR at least one License with state_rule_id == agreement.state_rule_id has is_effective == true"
          - "ProducerAgent.status == ACTIVE"
          - "down_payment_cents * 10000 >= sum(FinancedPolicy.gross_premium_cents) * StateRateRule.min_down_payment_bps"
          - "service_fee_cents <= StateRateRule.max_service_fee_cents OR (rate_exception_approved == true AND service_fee_cents <= approved_service_fee_cap_cents)"
          - "2 <= installment_count <= StateRateRule.max_term_months"
          - "clock_date < first_installment_due_date <= clock_date + 60 days"
        side_effects:
          - "runs calculations.finance_charge_and_amount_financed variant provisional_on_submit and writes total_premium_cents, amount_financed_cents, effective_annual_rate_bps, finance_charge_cents, total_of_payments_cents"
          - "sets quote_basis = PROVISIONAL"
          - "increments StateRateRule.active_agreement_count by 1"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: PENDING_VERIFICATION
        to: DRAFT
        trigger: "system: any FinancedPolicy of this agreement transitions PENDING_VERIFICATION -> DISPUTED (POST /policies/{id}/verifications)"
        actor: system
        preconditions:
          - "agreement.status == PENDING_VERIFICATION"
        side_effects:
          - "the attested policy transitions PENDING_VERIFICATION -> DISPUTED with dispute_reason = PARTY_REJECTED, PREMIUM_MISMATCH or EFFECTIVE_DATE_MISMATCH"
          - "resets total_premium_cents, amount_financed_cents, effective_annual_rate_bps, finance_charge_cents, total_of_payments_cents to 0 and quote_basis to null"
          - "decrements StateRateRule.active_agreement_count by 1"
          - "increments PremiumFinanceAgreement.version by 1"
        note: "cycle: the analyst fixes the quote, calls reopen-verification on the disputed policy, and submits again"
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: FinanceAnalyst
        preconditions:
          - "policy_count >= 1 AND verified_policy_count == policy_count"
          - "StateRateRule.license_required == false OR at least one License with state_rule_id == agreement.state_rule_id has is_effective == true"
          - "down_payment_cents * 10000 >= sum(FinancedPolicy.financed_premium_cents) * StateRateRule.min_down_payment_bps (re-checked against verified premium)"
          - "service_fee_cents <= StateRateRule.max_service_fee_cents OR (rate_exception_approved == true AND service_fee_cents <= approved_service_fee_cap_cents)"
        side_effects:
          - "runs calculations.finance_charge_and_amount_financed variant final_on_activation over FinancedPolicy.financed_premium_cents and rewrites total_premium_cents, amount_financed_cents, effective_annual_rate_bps, finance_charge_cents, total_of_payments_cents"
          - "sets quote_basis = FINAL"
          - "runs calculations.installment_schedule_generation and inserts installment_count Installment rows in SCHEDULED status"
          - "sets principal_balance_cents = amount_financed_cents and unpaid_finance_charge_cents = finance_charge_cents"
          - "sets activated_at = logical clock instant"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: ACTIVE
        to: PAID_IN_FULL
        trigger: "system: POST /agreements/{id}/payments drives the receivable to zero"
        actor: system
        preconditions:
          - "after allocation, principal_balance_cents == 0 AND unpaid_finance_charge_cents == 0 AND late_fee_balance_cents == 0"
        side_effects:
          - "every Installment with status IN {SCHEDULED, PAST_DUE} transitions to PAID"
          - "delinquency_stage returns to CURRENT if it was LATE or NOIC_ISSUED, and any CancellationNotice with status == ISSUED transitions to CURED"
          - "sets refund_due_cents = unapplied_credit_cents"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: PAID_IN_FULL
        to: ACTIVE
        trigger: "POST /payments/{id}/reverse"
        actor: FinanceAnalyst
        preconditions:
          - "payment.status == POSTED"
          - "payment.agreement_id == this agreement"
        side_effects:
          - "reverses the payment's allocation per calculations.payment_waterfall_allocation compensation clause: principal_balance_cents += applied_principal_cents, unpaid_finance_charge_cents += applied_finance_charge_cents + rebate_applied_cents, unapplied_credit_cents -= applied_unapplied_cents"
          - "every Installment the payment touched has paid_cents reduced and returns to PAST_DUE when due_date < clock_date, else SCHEDULED"
          - "every LateFeeAssessment the payment settled returns from PAID to OUTSTANDING and late_fee_balance_cents is restored; late_fee_count is NOT decremented"
          - "sets refund_due_cents = 0"
          - "increments PremiumFinanceAgreement.version by 1"
        note: "cycle PAID_IN_FULL -> ACTIVE -> PAID_IN_FULL; the compensating-invariant rule pins that total receivable returns exactly to its pre-payment value"
      - from: ACTIVE
        to: RESTRUCTURED
        trigger: "POST /agreements/{id}/restructure"
        actor: FinanceAnalyst
        preconditions:
          - "delinquency_stage IN {CURRENT, LATE, NOIC_ISSUED}"
          - "at least one FinancedPolicy of this agreement has status == VERIFIED"
          - "expected_agreement_version is not required here; the successor is minted from the predecessor snapshot"
        side_effects:
          - "mints a successor PremiumFinanceAgreement in DRAFT with restructured_from_agreement_id = this agreement's id and carried_over_balance_cents = net payoff of this agreement per calculations.unearned_finance_charge_rebate"
          - "re-points every FinancedPolicy with status == VERIFIED to the successor agreement_id"
          - "every Installment with status IN {SCHEDULED, PAST_DUE} transitions to VOIDED"
          - "every LateFeeAssessment with status == OUTSTANDING transitions to REVERSED and its amount is folded into the successor's carried_over_balance_cents"
          - "any CancellationNotice with status == ISSUED transitions to SUPERSEDED"
          - "sets principal_balance_cents = 0, unpaid_finance_charge_cents = 0, late_fee_balance_cents = 0, delinquency_stage = CURRENT"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: ACTIVE
        to: CANCELLED_DEFICIENT
        trigger: "system: the last CarrierCancellationRequest of this agreement reaches a terminal status via POST /carrier-cancellation-requests/{id}/return-posting and a deficiency remains"
        actor: system
        preconditions:
          - "delinquency_stage == CANCELLATION_REQUESTED"
          - "every CarrierCancellationRequest for this agreement has status IN {RETURN_POSTED, CLOSED_NO_RETURN}"
          - "calculations.deficiency_and_agent_chargeback yields deficiency_before_fee_cents > 0"
        side_effects:
          - "writes deficiency_balance_cents and agent_chargeback_cents per calculations.deficiency_and_agent_chargeback"
          - "creates one AgentChargeback row in PENDING status for producer_agent_id with amount_cents = agent_chargeback_cents (cascade hop 3)"
          - "delinquency_stage transitions CANCELLATION_REQUESTED -> CANCELLED"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: ACTIVE
        to: CLOSED_ZERO
        trigger: "system: the last CarrierCancellationRequest of this agreement reaches a terminal status via POST /carrier-cancellation-requests/{id}/return-posting and no deficiency remains"
        actor: system
        preconditions:
          - "delinquency_stage == CANCELLATION_REQUESTED"
          - "every CarrierCancellationRequest for this agreement has status IN {RETURN_POSTED, CLOSED_NO_RETURN}"
          - "calculations.deficiency_and_agent_chargeback yields deficiency_before_fee_cents <= 0"
        side_effects:
          - "sets deficiency_balance_cents = 0, agent_chargeback_cents = 0 and refund_due_cents = -deficiency_before_fee_cents"
          - "no AgentChargeback row is created"
          - "delinquency_stage transitions CANCELLATION_REQUESTED -> CANCELLED"
          - "increments PremiumFinanceAgreement.version by 1"
        note: "branch divergence against ACTIVE -> CANCELLED_DEFICIENT: identical trigger, opposite sign of the same formula, disjoint side-effect sets"
      - from: DRAFT
        to: VOID
        trigger: "POST /agreements/{id}/void"
        actor: FinanceAnalyst
        preconditions:
          - "no Payment row exists for this agreement"
        side_effects:
          - "every FinancedPolicy of this agreement transitions to CANCELLED with cancellation_effective_date = null"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: PENDING_VERIFICATION
        to: VOID
        trigger: "POST /agreements/{id}/void"
        actor: FinanceAnalyst
        preconditions:
          - "no Payment row exists for this agreement"
        side_effects:
          - "every FinancedPolicy of this agreement transitions to CANCELLED"
          - "decrements StateRateRule.active_agreement_count by 1"
          - "increments PremiumFinanceAgreement.version by 1"

  - entity: PremiumFinanceAgreement
    state_field: delinquency_stage
    initial_state: CURRENT
    terminal_states: [CANCELLED]
    transitions:
      - from: CURRENT
        to: LATE
        trigger: "POST /servicing-runs"
        actor: ComplianceOfficer
        preconditions:
          - "agreement.status == ACTIVE"
          - "at least one Installment with status == SCHEDULED has due_date < clock_date"
        side_effects:
          - "each such Installment transitions SCHEDULED -> PAST_DUE"
          - "a LateFeeAssessment is created for each installment whose clock_date > due_date + StateRateRule.grace_period_days, subject to the max_late_fees_per_agreement cap (calculations.late_fee_assessment)"
          - "late_fee_balance_cents and late_fee_count are recomputed"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: LATE
        to: CURRENT
        trigger: "system: POST /agreements/{id}/payments clears every past-due obligation"
        actor: system
        preconditions:
          - "after allocation, no Installment has status == PAST_DUE AND late_fee_balance_cents == 0"
        side_effects:
          - "increments PremiumFinanceAgreement.version by 1"
      - from: CURRENT
        to: LATE
        trigger: "POST /payments/{id}/reverse"
        actor: FinanceAnalyst
        preconditions:
          - "agreement.status == ACTIVE"
          - "after the reversal at least one Installment has status == PAST_DUE OR late_fee_balance_cents > 0"
        side_effects:
          - "the account is re-delinquenced by the returned item; a CancellationNotice already in CURED stays CURED (terminal) and its blackout window keeps running"
          - "increments PremiumFinanceAgreement.version by 1"
        note: "second entry into LATE, from a different trigger than the servicing run; this is the compensating half of the payment cure cascade"
      - from: LATE
        to: NOIC_ISSUED
        trigger: "POST /agreements/{id}/cancellation-notices"
        actor: FinanceAnalyst
        preconditions:
          - "agreement.status == ACTIVE AND delinquency_stage == LATE"
          - "at least one LateFeeAssessment for this agreement has status == OUTSTANDING"
          - "no CancellationNotice for this agreement has status == ISSUED (open notice window)"
          - "no CancellationNotice for this agreement has status == CURED with cured_date + StateRateRule.noic_notice_days >= clock_date (re-notice blackout)"
        side_effects:
          - "creates a CancellationNotice in ISSUED with notice_days snapshotted, effective_cancel_date = clock_date + notice_days, past_due_amount_cents snapshotted"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: NOIC_ISSUED
        to: CURRENT
        trigger: "system: POST /agreements/{id}/payments clears every past-due obligation"
        actor: system
        preconditions:
          - "after allocation, no Installment has status == PAST_DUE AND late_fee_balance_cents == 0"
        side_effects:
          - "the CancellationNotice with status == ISSUED transitions to CURED with cured_date = clock_date (cascade hop 3)"
          - "increments PremiumFinanceAgreement.version by 1"
        note: "cycle CURRENT -> LATE -> NOIC_ISSUED -> CURRENT; a later servicing run can drive the same row back to LATE"
      - from: NOIC_ISSUED
        to: CANCELLATION_REQUESTED
        trigger: "POST /agreements/{id}/cancellation-executions"
        actor: FinanceAnalyst
        preconditions:
          - "agreement.status == ACTIVE"
          - "a CancellationNotice for this agreement has status == ISSUED"
          - "clock_date >= that notice's effective_cancel_date"
          - "X-User-ID != that notice's issued_by_user_id (segregation of duties on the power of attorney)"
          - "at least one FinancedPolicy of this agreement has status == VERIFIED"
        side_effects:
          - "the notice transitions ISSUED -> EXECUTED with executed_date = clock_date"
          - "every FinancedPolicy with status == VERIFIED transitions to CANCELLED with cancellation_effective_date = notice.effective_cancel_date, and earned_days / unearned_premium_estimate_cents are computed"
          - "creates one CarrierCancellationRequest in REQUESTED per cancelled policy, carrying computed_unearned_premium_cents and estimate_method"
          - "grants the unearned finance charge rebate per calculations.unearned_finance_charge_rebate and reduces unpaid_finance_charge_cents by it"
          - "every Installment with status == SCHEDULED transitions to VOIDED (PAST_DUE installments stay past due)"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: CANCELLATION_REQUESTED
        to: CANCELLED
        trigger: "system: every CarrierCancellationRequest of this agreement has reached a terminal status via POST /carrier-cancellation-requests/{id}/return-posting"
        actor: system
        preconditions:
          - "every CarrierCancellationRequest for this agreement has status IN {RETURN_POSTED, CLOSED_NO_RETURN}"
        side_effects:
          - "agreement.status transitions ACTIVE -> CANCELLED_DEFICIENT or ACTIVE -> CLOSED_ZERO depending on the sign of deficiency_before_fee_cents"
          - "increments PremiumFinanceAgreement.version by 1"

  - entity: FinancedPolicy
    state_field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /policies/{id}/verifications"
        actor: Insurer | ProducerAgent
        preconditions:
          - "after recording this verification, exactly one non-superseded PremiumVerification exists for party == INSURER and one for party == PRODUCER_AGENT"
          - "both records have decision IN {CONFIRMED, CORRECTED}"
          - "their effective_premium_cents are equal AND their effective_date_asserted are equal"
        side_effects:
          - "sets verified_premium_cents and verified_effective_date from the agreed records"
          - "sets financed_premium_cents = verified_premium_cents + endorsed_premium_cents"
          - "increments PremiumFinanceAgreement.verified_policy_count by 1"
          - "increments FinancedPolicy.version by 1"
      - from: PENDING_VERIFICATION
        to: DISPUTED
        trigger: "POST /policies/{id}/verifications"
        actor: Insurer | ProducerAgent
        preconditions:
          - "after recording this verification, both parties have a non-superseded record AND (either record has decision == REJECTED OR their effective_premium_cents differ OR their effective_date_asserted differ)"
        side_effects:
          - "sets dispute_reason = PARTY_REJECTED when either record is REJECTED, else PREMIUM_MISMATCH when the premiums differ, else EFFECTIVE_DATE_MISMATCH"
          - "leaves verified_premium_cents and verified_effective_date null"
          - "when the parent agreement's status == PENDING_VERIFICATION it reverts to DRAFT and the agreement's money fields reset"
          - "increments FinancedPolicy.version by 1"
        note: "fork against PENDING_VERIFICATION -> VERIFIED: same trigger, disjoint side-effect sets"
      - from: DISPUTED
        to: PENDING_VERIFICATION
        trigger: "POST /policies/{id}/reopen-verification"
        actor: FinanceAnalyst
        preconditions:
          - "policy.status == DISPUTED"
          - "the parent agreement's status IN {DRAFT, PENDING_VERIFICATION}"
        side_effects:
          - "sets superseded = true on every PremiumVerification for this policy"
          - "clears dispute_reason"
          - "increments FinancedPolicy.version by 1"
        note: "revision cycle: PENDING_VERIFICATION -> DISPUTED -> PENDING_VERIFICATION, repeatable without bound"
      - from: VERIFIED
        to: CANCELLED
        trigger: "POST /agreements/{id}/cancellation-executions"
        actor: FinanceAnalyst
        preconditions:
          - "the parent agreement's delinquency_stage == NOIC_ISSUED and the notice period has elapsed"
        side_effects:
          - "sets cancellation_effective_date, earned_days and unearned_premium_estimate_cents"
          - "increments FinancedPolicy.version by 1"
      - from: PENDING_VERIFICATION
        to: CANCELLED
        trigger: "POST /agreements/{id}/void"
        actor: FinanceAnalyst
        preconditions:
          - "the parent agreement's status IN {DRAFT, PENDING_VERIFICATION}"
        side_effects:
          - "increments FinancedPolicy.version by 1"
      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /agreements/{id}/void"
        actor: FinanceAnalyst
        preconditions:
          - "the parent agreement's status IN {DRAFT, PENDING_VERIFICATION}"
        side_effects:
          - "increments FinancedPolicy.version by 1"

  - entity: Installment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: PAST_DUE
        trigger: "POST /servicing-runs"
        actor: ComplianceOfficer
        preconditions:
          - "due_date < clock_date AND paid_cents < amount_cents"
          - "parent agreement status == ACTIVE"
        side_effects:
          - "may create a LateFeeAssessment (see the delinquency_stage table)"
          - "increments Installment.version by 1"
      - from: SCHEDULED
        to: PAID
        trigger: "system: POST /agreements/{id}/payments allocates paid_cents == amount_cents"
        actor: system
        preconditions:
          - "paid_cents == amount_cents after allocation"
        side_effects:
          - "increments Installment.version by 1"
      - from: PAST_DUE
        to: PAID
        trigger: "system: POST /agreements/{id}/payments allocates paid_cents == amount_cents"
        actor: system
        preconditions:
          - "paid_cents == amount_cents after allocation"
        side_effects:
          - "when this was the only PAST_DUE installment and late_fee_balance_cents reaches 0, the agreement's delinquency_stage advances to CURRENT (cascade hop 2)"
          - "increments Installment.version by 1"
      - from: PAID
        to: PAST_DUE
        trigger: "POST /payments/{id}/reverse"
        actor: FinanceAnalyst
        preconditions:
          - "the reversed payment contributed to this installment's paid_cents"
          - "due_date < clock_date"
        side_effects:
          - "paid_cents is reduced by the reversed contribution"
          - "increments Installment.version by 1"
      - from: PAID
        to: SCHEDULED
        trigger: "POST /payments/{id}/reverse"
        actor: FinanceAnalyst
        preconditions:
          - "the reversed payment contributed to this installment's paid_cents"
          - "due_date >= clock_date"
        side_effects:
          - "paid_cents is reduced by the reversed contribution"
          - "increments Installment.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /agreements/{id}/restructure or POST /agreements/{id}/cancellation-executions"
        actor: FinanceAnalyst
        preconditions:
          - "paid_cents == 0"
        side_effects:
          - "increments Installment.version by 1"
      - from: PAST_DUE
        to: VOIDED
        trigger: "POST /agreements/{id}/restructure"
        actor: FinanceAnalyst
        preconditions:
          - "the parent agreement is being restructured"
        side_effects:
          - "the unpaid remainder is folded into the successor's carried_over_balance_cents"
          - "increments Installment.version by 1"

  - entity: Payment
    state_field: status
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: FinanceAnalyst
        preconditions:
          - "payment.status == POSTED"
          - "the parent agreement's status IN {ACTIVE, PAID_IN_FULL}"
        side_effects:
          - "sets reversal_reason and reversed_at"
          - "unwinds the entire allocation on the agreement, its installments and its late fees (see the compensating-invariant clause of calculations.payment_waterfall_allocation)"
          - "increments Payment.version by 1"

  - entity: LateFeeAssessment
    state_field: status
    initial_state: OUTSTANDING
    terminal_states: [WAIVED, REVERSED]
    transitions:
      - from: OUTSTANDING
        to: PAID
        trigger: "system: POST /agreements/{id}/payments absorbs the fee in bucket 1 of the waterfall"
        actor: system
        preconditions:
          - "the payment's unallocated remainder >= amount_cents at the time bucket 1 reaches this row"
        side_effects:
          - "decrements PremiumFinanceAgreement.late_fee_balance_cents by amount_cents"
          - "increments LateFeeAssessment.version by 1"
        note: "bucket 1 settles fees whole; a remainder smaller than amount_cents leaves the fee OUTSTANDING and flows to bucket 2"
      - from: PAID
        to: OUTSTANDING
        trigger: "POST /payments/{id}/reverse"
        actor: FinanceAnalyst
        preconditions:
          - "the reversed payment settled this fee"
        side_effects:
          - "increments PremiumFinanceAgreement.late_fee_balance_cents by amount_cents; late_fee_count is NOT changed"
          - "increments LateFeeAssessment.version by 1"
      - from: OUTSTANDING
        to: WAIVED
        trigger: "POST /late-fees/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "status == OUTSTANDING"
        side_effects:
          - "sets waived_by_user_id from X-User-ID"
          - "decrements PremiumFinanceAgreement.late_fee_balance_cents by amount_cents; late_fee_count is NOT decremented, so the statutory cap is not refreshed"
          - "when no OUTSTANDING fee and no PAST_DUE installment remains, the agreement's delinquency_stage advances to CURRENT and any ISSUED CancellationNotice transitions to CURED"
          - "increments LateFeeAssessment.version by 1"
      - from: OUTSTANDING
        to: REVERSED
        trigger: "POST /agreements/{id}/restructure"
        actor: FinanceAnalyst
        preconditions:
          - "the parent agreement is being restructured"
        side_effects:
          - "amount_cents is folded into the successor agreement's carried_over_balance_cents"
          - "increments LateFeeAssessment.version by 1"

  - entity: CancellationNotice
    state_field: status
    initial_state: ISSUED
    terminal_states: [CURED, EXECUTED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "system: a payment or a late-fee waiver clears every past-due obligation on the agreement"
        actor: system
        preconditions:
          - "no Installment of the agreement has status == PAST_DUE AND agreement.late_fee_balance_cents == 0"
        side_effects:
          - "sets cured_date = clock_date, which opens the re-notice blackout window [cured_date, cured_date + StateRateRule.noic_notice_days]"
          - "increments CancellationNotice.version by 1"
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /agreements/{id}/cancellation-executions"
        actor: FinanceAnalyst
        preconditions:
          - "clock_date >= effective_cancel_date"
          - "X-User-ID != issued_by_user_id"
        side_effects:
          - "sets executed_date = clock_date"
          - "increments CancellationNotice.version by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /agreements/{id}/restructure"
        actor: FinanceAnalyst
        preconditions:
          - "the parent agreement is being restructured"
        side_effects:
          - "increments CancellationNotice.version by 1"
        note: "three-way fork out of ISSUED with disjoint side-effect sets; SUPERSEDED does NOT open a blackout window"

  - entity: CarrierCancellationRequest
    state_field: status
    initial_state: REQUESTED
    terminal_states: [RETURN_POSTED, CLOSED_NO_RETURN]
    transitions:
      - from: REQUESTED
        to: RETURN_POSTED
        trigger: "POST /carrier-cancellation-requests/{id}/return-posting"
        actor: Insurer
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID == the policy's insurer_id"
          - "carrier_returned_cents > 0"
        side_effects:
          - "sets carrier_returned_cents and variance_cents = carrier_returned_cents - computed_unearned_premium_cents"
          - "sets FinancedPolicy.unearned_premium_returned_cents = carrier_returned_cents"
          - "credits the agreement: unearned_premium_received_cents += carrier_returned_cents, then principal_balance_cents / unpaid_finance_charge_cents are reduced in that order (cascade hop 2)"
          - "when this was the last non-terminal request of the agreement, the agreement's status advances to CANCELLED_DEFICIENT or CLOSED_ZERO and delinquency_stage advances to CANCELLED"
          - "increments CarrierCancellationRequest.version by 1"
      - from: REQUESTED
        to: CLOSED_NO_RETURN
        trigger: "POST /carrier-cancellation-requests/{id}/return-posting"
        actor: Insurer
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID == the policy's insurer_id"
          - "carrier_returned_cents == 0"
        side_effects:
          - "sets variance_cents = 0 - computed_unearned_premium_cents"
          - "leaves FinancedPolicy.unearned_premium_returned_cents at 0 and credits nothing to the agreement"
          - "when this was the last non-terminal request of the agreement, the agreement's status advances to CANCELLED_DEFICIENT or CLOSED_ZERO and delinquency_stage advances to CANCELLED"
          - "increments CarrierCancellationRequest.version by 1"
        note: "fork on the posted amount: zero return (fully earned premium) takes a different terminal state and skips the ledger credit"

  - entity: PremiumEndorsement
    state_field: status
    initial_state: PENDING
    terminal_states: [FINANCED, DECLINED]
    transitions:
      - from: PENDING
        to: FINANCED
        trigger: "POST /agreements/{id}/endorsement-financings"
        actor: FinanceAnalyst
        preconditions:
          - "the endorsement's policy has status == VERIFIED and belongs to the agreement in the path"
          - "the agreement's status == ACTIVE AND delinquency_stage == CURRENT"
          - "expected_agreement_version == the agreement's current version"
        side_effects:
          - "sets financed_at = logical clock instant"
          - "FinancedPolicy.endorsed_premium_cents and financed_premium_cents are recomputed"
          - "the agreement re-runs calculations.finance_charge_and_amount_financed variant final_on_activation and calculations.installment_schedule_generation over the remaining unpaid installments"
          - "increments PremiumFinanceAgreement.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /endorsements/{id}/decline"
        actor: FinanceAnalyst
        preconditions:
          - "status == PENDING"
        side_effects:
          - "increments PremiumEndorsement.version by 1"

  - entity: License
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licenses/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets is_effective = false, which blocks submit and activate in the licensed state"
          - "increments License.version by 1"

  - entity: AgentChargeback
    state_field: status
    initial_state: PENDING
    terminal_states: [OFFSET]
    transitions:
      - from: PENDING
        to: PARTIALLY_OFFSET
        trigger: "POST /agent-chargebacks/{id}/offset"
        actor: ComplianceOfficer
        preconditions:
          - "expected_chargeback_version == the chargeback's current version"
          - "0 < offset_amount_cents < amount_cents - offset_applied_cents"
          - "offset_amount_cents <= ProducerAgent.chargeback_reserve_balance_cents"
        side_effects:
          - "offset_applied_cents += offset_amount_cents"
          - "ProducerAgent.chargeback_reserve_balance_cents -= offset_amount_cents and outstanding_chargeback_cents is recomputed"
          - "increments AgentChargeback.version by 1"
      - from: PARTIALLY_OFFSET
        to: PARTIALLY_OFFSET
        trigger: "POST /agent-chargebacks/{id}/offset"
        actor: ComplianceOfficer
        preconditions:
          - "expected_chargeback_version == the chargeback's current version"
          - "0 < offset_amount_cents < amount_cents - offset_applied_cents"
          - "offset_amount_cents <= ProducerAgent.chargeback_reserve_balance_cents"
        side_effects:
          - "offset_applied_cents += offset_amount_cents"
          - "ProducerAgent.chargeback_reserve_balance_cents -= offset_amount_cents and outstanding_chargeback_cents is recomputed"
          - "increments AgentChargeback.version by 1"
        note: "self-loop; repeated partial offsets are legitimate, which is why this write is guarded by OCC rather than by a state precondition"
      - from: PENDING
        to: OFFSET
        trigger: "POST /agent-chargebacks/{id}/offset"
        actor: ComplianceOfficer
        preconditions:
          - "expected_chargeback_version == the chargeback's current version"
          - "offset_amount_cents == amount_cents - offset_applied_cents (settles the remainder)"
          - "offset_amount_cents <= ProducerAgent.chargeback_reserve_balance_cents"
        side_effects:
          - "offset_applied_cents = amount_cents"
          - "ProducerAgent.chargeback_reserve_balance_cents -= offset_amount_cents; outstanding_chargeback_cents drops by the settled amount"
          - "when outstanding_chargeback_cents falls below ProducerAgent.chargeback_liability_cap_cents and status == SUSPENDED_FOR_CHARGEBACKS, the agency returns to ACTIVE"
          - "increments AgentChargeback.version by 1"
      - from: PARTIALLY_OFFSET
        to: OFFSET
        trigger: "POST /agent-chargebacks/{id}/offset"
        actor: ComplianceOfficer
        preconditions:
          - "expected_chargeback_version == the chargeback's current version"
          - "offset_amount_cents == amount_cents - offset_applied_cents (settles the remainder)"
          - "offset_amount_cents <= ProducerAgent.chargeback_reserve_balance_cents"
        side_effects:
          - "offset_applied_cents = amount_cents"
          - "ProducerAgent.chargeback_reserve_balance_cents -= offset_amount_cents; outstanding_chargeback_cents drops by the settled amount"
          - "when outstanding_chargeback_cents falls below ProducerAgent.chargeback_liability_cap_cents and status == SUSPENDED_FOR_CHARGEBACKS, the agency returns to ACTIVE"
          - "increments AgentChargeback.version by 1"

  - entity: ProducerAgent
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED_FOR_CHARGEBACKS
        trigger: "system: an AgentChargeback row is created by the CANCELLED_DEFICIENT cascade and pushes outstanding_chargeback_cents to or above the cap"
        actor: system
        preconditions:
          - "outstanding_chargeback_cents >= chargeback_liability_cap_cents after the new row is counted"
        side_effects:
          - "blocks POST /agreements/{id}/submit for any agreement naming this agency (cascade hop 5)"
          - "increments ProducerAgent.version by 1"
      - from: SUSPENDED_FOR_CHARGEBACKS
        to: ACTIVE
        trigger: "POST /agent-chargebacks/{id}/offset"
        actor: ComplianceOfficer
        preconditions:
          - "outstanding_chargeback_cents < chargeback_liability_cap_cents after the offset"
        side_effects:
          - "increments ProducerAgent.version by 1"
      - from: ACTIVE
        to: SUSPENDED_BY_COMPLIANCE
        trigger: "POST /agents/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "blocks POST /agreements/{id}/submit for any agreement naming this agency"
          - "increments ProducerAgent.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent `version` only
# =============================================================================
concurrency_rules:
  - rule_id: endorsement-financing-stale-agreement
    parent_entity: PremiumFinanceAgreement
    write_endpoint: "POST /agreements/{id}/endorsement-financings"
    occ_field: "expected_agreement_version"
    description: |
      Folding pending endorsements into the note rebuilds the remaining installment schedule from
      the agreement's current money fields. A request whose expected_agreement_version is older
      than the agreement's stored version is rejected, because the schedule it intends to supersede
      is not the schedule the server now holds. Financing endorsements is legitimately repeatable
      (each new endorsement is financed by its own call), so the stale-version check — not a state
      precondition — is what protects the ledger.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: chargeback-offset-stale-chargeback
    parent_entity: AgentChargeback
    write_endpoint: "POST /agent-chargebacks/{id}/offset"
    occ_field: "expected_chargeback_version"
    description: |
      A partial offset is computed against the remainder the client last observed. A request whose
      expected_chargeback_version is older than the chargeback's stored version is rejected, since
      an offset already recorded has moved the remainder and the agency's reserve. Partial offsets
      are legitimately repeatable, so this cannot be reduced to a state precondition.
    error_id: ERR_STALE_CHARGEBACK_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# `A` = the PremiumFinanceAgreement, `R` = its StateRateRule, `I` = an Installment,
# `p` = a FinancedPolicy. clock_date is the date part of the logical clock.
# =============================================================================
calculations:

  - name: finance_charge_and_amount_financed
    trigger: "POST /agreements/{id}/submit (variant provisional_on_submit); POST /agreements/{id}/activate, POST /agreements/{id}/endorsement-financings and the successor minted by POST /agreements/{id}/restructure (variant final_on_activation)"
    algorithm: tiered_pricing
    formula: |
      # step 1 — premium basis (the variant decides the input set)
      if variant == provisional_on_submit:
          total_premium_cents = sum(p.gross_premium_cents for p in FinancedPolicy
                                    where p.agreement_id == A.id
                                      and p.status == PENDING_VERIFICATION
                                      and p.carried_over == false)
      else:  # final_on_activation
          total_premium_cents = sum(p.financed_premium_cents for p in FinancedPolicy
                                    where p.agreement_id == A.id
                                      and p.status == VERIFIED
                                      and p.carried_over == false)

      # step 2 — amount financed
      amount_financed_cents = total_premium_cents - A.down_payment_cents
                              + A.service_fee_cents + A.carried_over_balance_cents

      # step 3 — volume tier on the amount financed (three-way branch)
      if   amount_financed_cents <= TIER1_MAX_AMOUNT_FINANCED_CENTS: tier_rate_bps = TIER1_RATE_BPS
      elif amount_financed_cents <= TIER2_MAX_AMOUNT_FINANCED_CENTS: tier_rate_bps = TIER2_RATE_BPS
      else:                                                          tier_rate_bps = TIER3_RATE_BPS

      # step 4 — statutory cap, then the approved exception (the cap always wins)
      if A.rate_exception_approved and A.approved_annual_rate_bps is not null:
          effective_annual_rate_bps = min(A.approved_annual_rate_bps, R.max_annual_rate_bps)
      else:
          effective_annual_rate_bps = min(tier_rate_bps, R.max_annual_rate_bps)

      # step 5 — method branch
      if R.finance_charge_method == ADD_ON:
          finance_charge_cents = round_half_up(amount_financed_cents * effective_annual_rate_bps
                                               * A.installment_count / (10000 * 12))
      else:  # SIMPLE_INTEREST — declining balance over equal principal slices
          base_principal = floor(amount_financed_cents / A.installment_count)
          outstanding    = amount_financed_cents
          finance_charge_cents = 0
          for k in 1..A.installment_count:
              principal_k = base_principal if k < A.installment_count else outstanding
              interest_k  = round_half_up(outstanding * effective_annual_rate_bps / (10000 * 12))
              finance_charge_cents += interest_k      # round EVERY period, then sum
              outstanding -= principal_k

      total_of_payments_cents = amount_financed_cents + finance_charge_cents
    input_set: "policies of this agreement only; PENDING_VERIFICATION with carried_over == false for the provisional basis, VERIFIED with carried_over == false for the final basis. DISPUTED and CANCELLED policies are excluded from both, and carried-over policies never enter the premium basis because their unpaid balance arrives via carried_over_balance_cents."
    constants:
      TIER1_MAX_AMOUNT_FINANCED_CENTS: 500000
      TIER1_RATE_BPS: 1800
      TIER2_MAX_AMOUNT_FINANCED_CENTS: 2000000
      TIER2_RATE_BPS: 1500
      TIER3_RATE_BPS: 1200
    precision: "integer cents; round_half_up at each step named above. Under SIMPLE_INTEREST the per-period interest is rounded BEFORE summation — summing exact products and rounding once is a different (forbidden) result."
    variants:
      - name: provisional_on_submit
        when: "POST /agreements/{id}/submit, before the insurer and the agent have attested anything"
        difference: "sums FinancedPolicy.gross_premium_cents (agency-quoted) over PENDING_VERIFICATION policies and stamps quote_basis = PROVISIONAL"
      - name: final_on_activation
        when: "POST /agreements/{id}/activate, endorsement financing, and successor creation"
        difference: "sums FinancedPolicy.financed_premium_cents (attested premium plus financed endorsements) over VERIFIED policies and stamps quote_basis = FINAL; every corrected premium moves total_premium_cents, which can also move the volume tier and therefore the rate"

  - name: installment_schedule_generation
    trigger: "POST /agreements/{id}/activate; re-run over the unpaid tail by POST /agreements/{id}/endorsement-financings"
    algorithm: waterfall_allocation
    formula: |
      n = A.installment_count
      if R.finance_charge_method == ADD_ON:
          # level payments: floor for installments 1..n-1, the ENTIRE remainder on installment n
          base       = floor(A.total_of_payments_cents / n)
          amount_k   = base                                              for k in 1..n-1
          amount_n   = A.total_of_payments_cents - base * (n - 1)
          # finance charge spread straight-line, remainder again on installment n
          fc_base    = round_half_up(A.finance_charge_cents / n)
          fc_k       = fc_base                                           for k in 1..n-1
          fc_n       = A.finance_charge_cents - fc_base * (n - 1)
          principal_k = amount_k - fc_k                                  for k in 1..n
      else:  # SIMPLE_INTEREST — declining installments
          base_principal = floor(A.amount_financed_cents / n)
          outstanding    = A.amount_financed_cents
          for k in 1..n:
              principal_k = base_principal if k < n else outstanding
              fc_k        = round_half_up(outstanding * A.effective_annual_rate_bps / (10000 * 12))
              amount_k    = principal_k + fc_k
              outstanding -= principal_k

      due_date_k = add_calendar_months(A.first_installment_due_date, k - 1)
      # add_calendar_months keeps the day-of-month; when the target month is shorter,
      # the last day of the target month is used (2026-01-31 + 1 month -> 2026-02-28).

      # endorsement re-run: installments with status IN {PAID, VOIDED} are frozen; the new
      # total_of_payments_cents minus already-paid amounts is redistributed over the installments
      # with status IN {SCHEDULED, PAST_DUE}, lowest installment_number first, with the same
      # floor-then-remainder-on-the-last rule applied to that tail.
    input_set: "all installments of the agreement on first generation; only installments with status IN {SCHEDULED, PAST_DUE} on an endorsement re-run"
    constants: {}
    precision: "integer cents. Rounding order is pinned: divide, floor/round each of installments 1..n-1, then give installment n the arithmetic remainder so that sum(amount_k) == total_of_payments_cents and sum(fc_k) == finance_charge_cents exactly. Rounding every installment independently would leave a 1-cent drift against total_of_payments_cents and is wrong."

  - name: payment_waterfall_allocation
    trigger: "POST /agreements/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      remaining = P.amount_cents
      net_payoff_cents = calculations.unearned_finance_charge_rebate.net_payoff_cents(as_of = P.received_date)

      # variant selection happens BEFORE any bucket is touched
      variant = PAYOFF if remaining >= net_payoff_cents else STANDARD

      if variant == PAYOFF:
          rebate_applied_cents         = rebate_cents(as_of = P.received_date)
          A.unpaid_finance_charge_cents -= rebate_applied_cents
          applied_late_fee_cents       = A.late_fee_balance_cents          # every OUTSTANDING fee -> PAID
          applied_finance_charge_cents = A.unpaid_finance_charge_cents     # post-rebate remainder
          applied_principal_cents      = A.principal_balance_cents
          applied_unapplied_cents      = remaining - applied_late_fee_cents
                                         - applied_finance_charge_cents - applied_principal_cents
          # all three balances become 0; every Installment with status IN {SCHEDULED, PAST_DUE} -> PAID
      else:
          # bucket 1 — OUTSTANDING late fees, ordered assessed_date ASC, then installment_number ASC,
          #            then created_at ASC. A fee is settled only if `remaining` covers it whole;
          #            otherwise it stays OUTSTANDING and the money flows on to bucket 2.
          # bucket 2 — installments with status == PAST_DUE, ordered due_date ASC then
          #            installment_number ASC. Inside one installment the finance_charge_component
          #            is retired before the principal_component. Partial application is allowed and
          #            leaves the installment PAST_DUE.
          # bucket 3 — while remaining > 0: the lowest-numbered installment with status == SCHEDULED,
          #            same inner order (finance charge before principal).
          # bucket 4 — whatever is left increases A.unapplied_credit_cents.
          # A.principal_balance_cents, A.unpaid_finance_charge_cents and A.late_fee_balance_cents are
          # decremented by the amounts absorbed in buckets 1-3; Installment.paid_cents accumulates.
    input_set: "LateFeeAssessment rows of this agreement with status == OUTSTANDING, and Installment rows with status IN {PAST_DUE, SCHEDULED}. Rows with status IN {PAID, WAIVED, REVERSED, VOIDED} are excluded."
    constants: {}
    precision: "integer cents; no rounding occurs — the waterfall only moves whole cents between buckets"
    compensation_invariant: |
      Named conserved quantity — total_receivable_cents:
        total_receivable_cents = A.principal_balance_cents + A.unpaid_finance_charge_cents
                                 + A.late_fee_balance_cents - A.unapplied_credit_cents
      Posting a STANDARD payment must satisfy
        total_receivable_after == total_receivable_before - P.amount_cents
      and POST /payments/{id}/reverse must restore
        total_receivable_after_reversal == total_receivable_before_the_payment
      exactly, with Installment.paid_cents, Installment.status and every LateFeeAssessment the
      payment settled restored as well. A.late_fee_count is deliberately NOT part of the invariant:
      it is a lifetime counter and never moves backwards.
    variants:
      - name: standard_allocation
        when: "P.amount_cents < net_payoff_cents"
        difference: "runs the four-bucket waterfall; no rebate is granted, so rebate_applied_cents == 0"
      - name: payoff_allocation
        when: "P.amount_cents >= net_payoff_cents"
        difference: "grants the unearned finance charge rebate first, zeroes all three balances, marks every open installment PAID and parks any surplus in unapplied_credit_cents; the same tendered amount therefore retires a strictly larger obligation than the standard variant would"

  - name: late_fee_assessment
    trigger: "POST /servicing-runs"
    algorithm: threshold
    formula: |
      # per agreement with status == ACTIVE, ordered created_at ASC;
      # per installment of that agreement, ordered installment_number ASC
      if I.status == SCHEDULED and I.due_date < clock_date and I.paid_cents < I.amount_cents:
          I.status = PAST_DUE
      if I.status == PAST_DUE and clock_date > date_add_days(I.due_date, R.grace_period_days)
         and A.late_fee_count < R.max_late_fees_per_agreement
         and no LateFeeAssessment exists for (A.id, I.installment_number) with status != REVERSED:
              raw_fee   = round_half_up(I.amount_cents * R.late_fee_bps / 10000)
              fee_cents = min(max(raw_fee, R.late_fee_min_cents), R.late_fee_max_cents)
              create LateFeeAssessment(amount_cents = fee_cents, status = OUTSTANDING,
                                       assessed_date = clock_date,
                                       installment_number = I.installment_number)
              A.late_fee_count += 1
              A.late_fee_balance_cents += fee_cents
    input_set: "agreements with status == ACTIVE and delinquency_stage IN {CURRENT, LATE, NOIC_ISSUED}; installments with status IN {SCHEDULED, PAST_DUE}. Agreements in DRAFT/PENDING_VERIFICATION/terminal statuses and installments in PAID/VOIDED are skipped."
    constants: {}
    precision: "integer cents, round_half_up before the min/max clamp — clamping first and rounding second can differ by one cent"
    note: "the grace comparison is strictly greater: clock_date == due_date + grace_period_days assesses nothing, clock_date == due_date + grace_period_days + 1 assesses the fee. The cap comparison uses late_fee_count, which waiver and payment reversal never decrement."

  - name: unearned_premium_return_estimate
    trigger: "POST /agreements/{id}/cancellation-executions"
    algorithm: interval_merge
    formula: |
      term_days    = days_between(p.verified_effective_date, p.expiration_date)   # [eff, exp)
      elapsed_days = days_between(p.verified_effective_date, cancellation_effective_date)
      p.earned_days = min(term_days, max(p.min_earned_days, elapsed_days))
      unearned_days = term_days - p.earned_days
      if p.fully_earned:
          p.unearned_premium_estimate_cents = 0
      else:
          pro_rata_cents = round_half_up(p.financed_premium_cents * unearned_days / term_days)
          if R.unearned_premium_method == PRO_RATA:
              p.unearned_premium_estimate_cents = pro_rata_cents
          else:  # SHORT_RATE
              p.unearned_premium_estimate_cents = round_half_up(
                  pro_rata_cents * (10000 - R.short_rate_penalty_bps) / 10000)
      # aggregate reported by the execution endpoint: round PER POLICY, then sum
      estimated_unearned_premium_cents = sum(p.unearned_premium_estimate_cents
                                             for p in policies cancelled by this execution)
    input_set: "FinancedPolicy rows of this agreement whose status was VERIFIED at execution time; PENDING_VERIFICATION, DISPUTED and already-CANCELLED policies are not cancelled and produce no estimate"
    constants: {}
    precision: "integer cents, round_half_up; the SHORT_RATE penalty is applied to the ALREADY ROUNDED pro-rata figure, and the aggregate rounds per policy before summing"
    variants:
      - name: pro_rata
        when: "R.unearned_premium_method == PRO_RATA"
        difference: "returns the full unexpired fraction of the financed premium"
      - name: short_rate
        when: "R.unearned_premium_method == SHORT_RATE"
        difference: "withholds short_rate_penalty_bps of the pro-rata figure, so the same policy on the same cancellation date yields a strictly smaller return and a strictly larger deficiency"
    note: "min_earned_days is inclusive on the earned side: a cancellation whose elapsed_days equals min_earned_days earns exactly min_earned_days, and a cancellation one day earlier still earns min_earned_days"

  - name: unearned_finance_charge_rebate
    trigger: "GET /agreements/{id}/payoff-quote; POST /agreements/{id}/payments (payoff variant); POST /agreements/{id}/cancellation-executions; POST /agreements/{id}/restructure"
    algorithm: decay_function
    formula: |
      r = A.installment_count - count(Installment where agreement_id == A.id and status == PAID)
      if r <= 0:
          rebate_cents = 0
      elif R.rebate_method == RULE_OF_78:
          rebate_cents = round_half_up(A.finance_charge_cents * r * (r + 1)
                                       / (A.installment_count * (A.installment_count + 1)))
      else:  # ACTUARIAL
          rebate_cents = sum(I.finance_charge_component_cents for I in Installment
                             where I.agreement_id == A.id and I.status IN {SCHEDULED, PAST_DUE})
      rebate_cents = min(rebate_cents, A.unpaid_finance_charge_cents)

      net_payoff_cents = A.principal_balance_cents + A.unpaid_finance_charge_cents - rebate_cents
                         + A.late_fee_balance_cents - A.unapplied_credit_cents
    input_set: "installments of this agreement only; PAID installments set r, SCHEDULED and PAST_DUE installments form the actuarial sum, VOIDED installments are excluded from both"
    constants: {}
    precision: "integer cents, round_half_up on the Rule-of-78s quotient; the actuarial branch performs no rounding because it sums already-rounded components"
    variants:
      - name: rule_of_78
        when: "R.rebate_method == RULE_OF_78"
        difference: "rebates on the sum-of-digits curve, which front-loads finance charge and therefore rebates LESS than the straight-line schedule actually allocated to the unpaid tail"
      - name: actuarial
        when: "R.rebate_method == ACTUARIAL"
        difference: "rebates exactly the finance-charge components still sitting on unpaid installments; for an identical ADD_ON schedule this is strictly larger than the Rule-of-78s figure, so the same account has two different payoff numbers"

  - name: deficiency_and_agent_chargeback
    trigger: "system: the last CarrierCancellationRequest of an agreement reaches a terminal status via POST /carrier-cancellation-requests/{id}/return-posting"
    algorithm: constraint_propagation
    formula: |
      # step 1 — residual after every carrier return has been credited
      deficiency_before_fee_cents = A.principal_balance_cents + A.unpaid_finance_charge_cents
                                    + A.late_fee_balance_cents - A.unapplied_credit_cents

      # step 2 — the cancellation fee is a tier keyed on the STEP-1 value. The evaluation order is
      # pinned precisely because the fee is itself part of the final deficiency: the fee never
      # enters its own tier input.
      if   deficiency_before_fee_cents <= 0:                              cancellation_fee_cents = 0
      elif deficiency_before_fee_cents <= DEFICIENCY_FEE_TIER1_MAX_CENTS: cancellation_fee_cents = DEFICIENCY_FEE_TIER1_CENTS
      else:                                                              cancellation_fee_cents = DEFICIENCY_FEE_TIER2_CENTS

      # step 3
      if deficiency_before_fee_cents <= 0:
          A.deficiency_balance_cents = 0
          A.refund_due_cents         = -deficiency_before_fee_cents
          A.agent_chargeback_cents   = 0
          # no AgentChargeback row is created; agreement.status -> CLOSED_ZERO
      else:
          A.deficiency_balance_cents = deficiency_before_fee_cents + cancellation_fee_cents

          # step 4 — chargeback variant, selected by the agency's configured basis
          if agent.chargeback_basis == COMMISSION_CAPPED:
              commission_cents = round_half_up(A.total_premium_cents
                                               * agent.agent_commission_bps / 10000)
              A.agent_chargeback_cents = min(A.deficiency_balance_cents, commission_cents)
          else:  # RESERVE_CAPPED
              headroom_cents = max(0, agent.chargeback_liability_cap_cents
                                      - agent.outstanding_chargeback_cents)
              A.agent_chargeback_cents = min(A.deficiency_balance_cents, headroom_cents)
          # agreement.status -> CANCELLED_DEFICIENT and one AgentChargeback(PENDING) is created
    input_set: "the agreement's own balance fields after every CarrierCancellationRequest of the agreement has reached status IN {RETURN_POSTED, CLOSED_NO_RETURN}; the agency's outstanding_chargeback_cents counted over its AgentChargeback rows with status IN {PENDING, PARTIALLY_OFFSET}"
    constants:
      DEFICIENCY_FEE_TIER1_MAX_CENTS: 25000
      DEFICIENCY_FEE_TIER1_CENTS: 2500
      DEFICIENCY_FEE_TIER2_CENTS: 5000
    precision: "integer cents, round_half_up on the commission product only"
    settlement_invariant: |
      Named conserved quantity — note_settlement_residual_cents, which MUST be exactly 0 once the
      agreement reaches CANCELLED_DEFICIENT or CLOSED_ZERO:
        note_settlement_residual_cents =
            (A.total_of_payments_cents
             + sum(LateFeeAssessment.amount_cents for this agreement where status != WAIVED
                                                                     and status != REVERSED))
          - (sum(Payment.amount_cents for this agreement where status == POSTED)
             + total_rebate_granted_cents
             + A.unearned_premium_received_cents
             + deficiency_before_fee_cents
             + A.unapplied_credit_cents)
      In words: every dollar of the note is either paid by the insured, rebated as unearned finance
      charge, returned by a carrier, or still owed as deficiency. The forward action (exercising the
      power of attorney) and its compensating action (the carrier return postings) must leave this
      residual at zero — a cascade that credits the ledger twice, or forgets the rebate, shows up
      here as a non-zero residual even though every individual balance looks plausible.
    variants:
      - name: commission_capped
        when: "ProducerAgent.chargeback_basis == COMMISSION_CAPPED"
        difference: "the agency eats the deficiency up to the commission it earned on the financed premium, so a large commission means the whole deficiency is charged back"
      - name: reserve_capped
        when: "ProducerAgent.chargeback_basis == RESERVE_CAPPED"
        difference: "the agency eats the deficiency only up to its remaining liability headroom, so an identical deficiency on an identical agreement produces a smaller chargeback and can push outstanding_chargeback_cents onto the cap and suspend the agency"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins when a
# single request violates several rules)
# Ordering rationale: auth before existence, existence before ownership, ownership
# before optimistic concurrency, concurrency before state preconditions, and inside
# the business band the statutory/licensing checks (which can void the transaction
# for the finance company) run before referential, temporal and finally fiscal
# checks. A request that is both unlicensed and mispriced reports the licensing
# failure, because pricing a deal the company may not legally write is moot.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {FinanceAnalyst, ComplianceOfficer, ProducerAgent, Insurer, Insured} and appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the request path exists, validated left-to-right; the leftmost missing segment decides the error (ERR_STATE_RULE_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_AGENT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_PAYMENT_NOT_FOUND, ERR_LATE_FEE_NOT_FOUND, ERR_CANCEL_REQUEST_NOT_FOUND, ERR_ENDORSEMENT_NOT_FOUND, ERR_CHARGEBACK_NOT_FOUND)"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (insured_id, producer_agent_id, state_rule_id, insurer_id); the fields are validated in that declared order"
    error_id: ERR_INSURED_NOT_FOUND
    http_status: 404
    applies_to: "POST /agreements, POST /agreements/{id}/policies"

  - priority: 5
    category: auth
    check: "for a role whose identity is entity_backed, X-User-ID must equal the id of the entity that owns the addressed resource: Insured on its own agreement and its own payments, ProducerAgent on an agreement naming it, Insurer on a policy naming it or a CarrierCancellationRequest for such a policy"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /agreements/{id}, POST /agreements/{id}/payments, POST /policies/{id}/endorsements, POST /carrier-cancellation-requests/{id}/return-posting"

  - priority: 6
    category: business_referential
    check: "an attestation may only be filed by a party with standing on that policy: X-User-Role == Insurer requires X-User-ID == policy.insurer_id; X-User-Role == ProducerAgent requires X-User-ID == the agreement's producer_agent_id"
    error_id: ERR_VERIFIER_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /policies/{id}/verifications"

  - priority: 7
    category: existence
    check: "request body conforms to the endpoint's input schema — required fields present, types correct, enum values in range, cents fields non-negative integers, dates ISO 8601 calendar dates, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 8
    category: business_safety
    check: "segregation of duties on pricing: X-User-ID approving a rate exception must differ from agreement.originated_by_user_id"
    error_id: ERR_SOD_ORIGINATOR_CANNOT_APPROVE
    http_status: 403
    applies_to: "POST /agreements/{id}/rate-exception-approvals"

  - priority: 9
    category: business_safety
    check: "segregation of duties on the power of attorney: X-User-ID exercising the cancellation must differ from the issued_by_user_id of the ISSUED CancellationNotice being executed"
    error_id: ERR_SOD_NOTICE_ISSUER_CANNOT_EXECUTE
    http_status: 403
    applies_to: "POST /agreements/{id}/cancellation-executions"

  - priority: 10
    category: state
    check: "optimistic concurrency: expected_agreement_version must equal PremiumFinanceAgreement.version, and expected_chargeback_version must equal AgentChargeback.version, at the moment the write is applied"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /agreements/{id}/endorsement-financings, POST /agent-chargebacks/{id}/offset"

  - priority: 11
    category: state
    check: "the agreement's status permits the requested operation per the §1.2 status table (DRAFT accepts policies/submit/void/rate-exception approvals; PENDING_VERIFICATION accepts activate/void/rate-exception approvals; ACTIVE accepts payments/notices/executions/endorsement financing/restructure; PAID_IN_FULL accepts nothing but payment reversal; VOID, RESTRUCTURED, CANCELLED_DEFICIENT and CLOSED_ZERO are terminal)"
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /agreements/{id}/policies, POST /agreements/{id}/submit, POST /agreements/{id}/activate, POST /agreements/{id}/void, POST /agreements/{id}/payments, POST /agreements/{id}/cancellation-notices, POST /agreements/{id}/cancellation-executions, POST /agreements/{id}/endorsement-financings, POST /agreements/{id}/restructure, POST /agreements/{id}/rate-exception-approvals"

  - priority: 12
    category: state
    check: "the agreement's delinquency_stage permits the requested operation: issuing a notice requires LATE or NOIC_ISSUED (a stage that already carries an open notice clears this gate and is refused instead by the more specific notice-window rule at priority 34, so the caller learns the actual reason), executing a cancellation requires NOIC_ISSUED, and the CURRENT, CANCELLATION_REQUESTED and CANCELLED stages refuse both"
    error_id: ERR_DELINQUENCY_STATE_INVALID
    http_status: 409
    applies_to: "POST /agreements/{id}/cancellation-notices, POST /agreements/{id}/cancellation-executions"

  - priority: 13
    category: state
    check: "the policy's status permits the requested operation: verifications require PENDING_VERIFICATION, reopen-verification requires DISPUTED, endorsements require PENDING_VERIFICATION or VERIFIED"
    error_id: ERR_POLICY_STATE_INVALID
    http_status: 409
    applies_to: "POST /policies/{id}/verifications, POST /policies/{id}/reopen-verification, POST /policies/{id}/endorsements"

  - priority: 14
    category: state
    check: "the CancellationNotice selected for execution has status == ISSUED; CURED, SUPERSEDED and EXECUTED notices cannot be executed again"
    error_id: ERR_NOTICE_STATE_INVALID
    http_status: 409
    applies_to: "POST /agreements/{id}/cancellation-executions"

  - priority: 15
    category: state
    check: "the carrier cancellation request has status == REQUESTED when a return is posted"
    error_id: ERR_CANCEL_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /carrier-cancellation-requests/{id}/return-posting"

  - priority: 16
    category: state
    check: "the chargeback has status IN {PENDING, PARTIALLY_OFFSET}; an OFFSET chargeback accepts no further offsets"
    error_id: ERR_CHARGEBACK_STATE_INVALID
    http_status: 409
    applies_to: "POST /agent-chargebacks/{id}/offset"

  - priority: 17
    category: state
    check: "the endorsement has status == PENDING when it is declined"
    error_id: ERR_ENDORSEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /endorsements/{id}/decline"

  - priority: 18
    category: state
    check: "the payment has status == POSTED; a payment already in REVERSED cannot be reversed twice"
    error_id: ERR_PAYMENT_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /payments/{id}/reverse"

  - priority: 19
    category: state
    check: "the late fee has status == OUTSTANDING when it is waived; PAID, WAIVED and REVERSED fees are not waivable"
    error_id: ERR_LATE_FEE_NOT_OUTSTANDING
    http_status: 409
    applies_to: "POST /late-fees/{id}/waive"

  - priority: 20
    category: business_referential
    check: "a policy named together with an agreement must belong to that agreement: on POST /policies/{id}/verifications the policy must still hang off the agreement whose verification cycle is open, on POST /carrier-cancellation-requests/{id}/return-posting request.agreement_id must equal request.policy's agreement_id, and on GET /carrier-cancellation-requests an agreement_id and policy_id supplied together must be a coherent pair — the ledger refuses an incoherent query rather than answering it with an empty page"
    error_id: ERR_POLICY_AGREEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /policies/{id}/verifications, POST /carrier-cancellation-requests/{id}/return-posting, GET /carrier-cancellation-requests"

  - priority: 21
    category: business_referential
    check: "each party may file at most one live attestation per policy: no PremiumVerification with the same policy_id and party and superseded == false may already exist"
    error_id: ERR_VERIFICATION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /policies/{id}/verifications"

  - priority: 22
    category: business_safety
    check: "when the agreement's StateRateRule has license_required == true, at least one License for that rule must have is_effective == true at clock_date"
    error_id: ERR_STATE_NOT_LICENSED
    http_status: 422
    applies_to: "POST /agreements, POST /agreements/{id}/submit, POST /agreements/{id}/activate, POST /agreements/{id}/restructure"

  - priority: 23
    category: business_safety
    check: "the named ProducerAgent has status == ACTIVE; SUSPENDED_FOR_CHARGEBACKS and SUSPENDED_BY_COMPLIANCE both block new origination"
    error_id: ERR_AGENT_SUSPENDED
    http_status: 422
    applies_to: "POST /agreements, POST /agreements/{id}/submit, POST /agreements/{id}/restructure"

  - priority: 24
    category: business_safety
    check: "state_code is unique across StateRateRule — one rate regime per state"
    error_id: ERR_DUPLICATE_STATE_RULE
    http_status: 409
    applies_to: "POST /state-rate-rules"

  - priority: 25
    category: business_safety
    check: "installment_count must be <= StateRateRule.max_term_months"
    error_id: ERR_TERM_EXCEEDS_STATE_MAXIMUM
    http_status: 422
    applies_to: "POST /agreements, POST /agreements/{id}/restructure"

  - priority: 26
    category: business_safety
    check: "at submit the down payment must satisfy down_payment_cents * 10000 >= total_premium_cents * StateRateRule.min_down_payment_bps, evaluated against the provisional premium basis; equality passes"
    error_id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /agreements/{id}/submit, POST /agreements/{id}/restructure"

  - priority: 27
    category: business_safety
    check: "service_fee_cents must be <= StateRateRule.max_service_fee_cents, or <= PremiumFinanceAgreement.approved_service_fee_cap_cents when rate_exception_approved == true"
    error_id: ERR_SERVICE_FEE_ABOVE_CAP
    http_status: 422
    applies_to: "POST /agreements, POST /agreements/{id}/rate-exception-approvals"

  - priority: 28
    category: business_safety
    check: "an approved rate exception may never exceed the statutory ceiling: override_annual_rate_bps must be <= StateRateRule.max_annual_rate_bps"
    error_id: ERR_RATE_ABOVE_STATE_MAXIMUM
    http_status: 422
    applies_to: "POST /agreements/{id}/rate-exception-approvals"

  - priority: 29
    category: business_constraint
    check: "an agreement must finance at least one policy: policy_count >= 1 counting FinancedPolicy rows with status != CANCELLED"
    error_id: ERR_NO_FINANCED_POLICIES
    http_status: 422
    applies_to: "POST /agreements/{id}/submit"

  - priority: 30
    category: business_constraint
    check: "every FinancedPolicy of the agreement has status == VERIFIED before the note is activated; a DISPUTED or still-PENDING_VERIFICATION policy blocks activation"
    error_id: ERR_POLICY_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /agreements/{id}/activate"

  - priority: 31
    category: business_temporal
    check: "expiration_date must be strictly after effective_date, and min_earned_days must not exceed the term length in days"
    error_id: ERR_INVALID_POLICY_TERM
    http_status: 422
    applies_to: "POST /agreements/{id}/policies"

  - priority: 32
    category: business_temporal
    check: "no other FinancedPolicy with the same (insurer_id, policy_number) whose status != CANCELLED may have a half-open term [effective_date, expiration_date) that overlaps the new policy's term; terms that merely touch (previous expiration_date == new effective_date) are accepted"
    error_id: ERR_POLICY_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /agreements/{id}/policies"

  - priority: 33
    category: business_temporal
    check: "clock_date < first_installment_due_date <= clock_date + 60 days, re-checked at submit against the clock in force then"
    error_id: ERR_INVALID_FIRST_DUE_DATE
    http_status: 422
    applies_to: "POST /agreements, POST /agreements/{id}/submit, POST /agreements/{id}/restructure"

  - priority: 34
    category: business_temporal
    check: "no CancellationNotice for this agreement may already have status == ISSUED — the statutory notice window is occupied until that notice is cured, executed or superseded"
    error_id: ERR_NOTICE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /agreements/{id}/cancellation-notices"

  - priority: 35
    category: business_temporal
    check: "a fresh notice may not be issued while a cure blackout is running: for the most recently CURED notice of this agreement the closed window [cured_date, cured_date + StateRateRule.noic_notice_days] blocks re-notice, so the request is rejected while cured_date + noic_notice_days >= clock_date and accepted only once clock_date is strictly greater"
    error_id: ERR_NOTICE_BLACKOUT_ACTIVE
    http_status: 409
    applies_to: "POST /agreements/{id}/cancellation-notices"

  - priority: 36
    category: business_temporal
    check: "the power of attorney may only be exercised once the statutory notice has run: clock_date >= notice.effective_cancel_date, where effective_cancel_date == issued_date + StateRateRule.noic_notice_days"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /agreements/{id}/cancellation-executions"

  - priority: 37
    category: business_temporal
    check: "the logical clock is monotonic: to_iso8601 must be greater than or equal to the current clock value"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 38
    category: business_fiscal
    check: "a corrected premium must stay within +/- PREMIUM_VARIANCE_TOLERANCE_BPS (2500) of the agency-quoted gross_premium_cents: abs(corrected_premium_cents - gross_premium_cents) * 10000 <= gross_premium_cents * 2500; equality is accepted"
    error_id: ERR_PREMIUM_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /policies/{id}/verifications"

  - priority: 39
    category: business_fiscal
    check: "a payment may not exceed the net payoff by more than MAX_OVERPAYMENT_CENTS (50000): amount_cents <= net_payoff_cents + 50000"
    error_id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http_status: 422
    applies_to: "POST /agreements/{id}/payments"

  - priority: 40
    category: business_fiscal
    check: "an offset may not exceed the agency's reserve balance nor the chargeback's unsettled remainder: offset_amount_cents <= ProducerAgent.chargeback_reserve_balance_cents and offset_amount_cents <= amount_cents - offset_applied_cents"
    error_id: ERR_OFFSET_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "POST /agent-chargebacks/{id}/offset"

  - priority: 41
    category: business_constraint
    check: "restructuring requires status == ACTIVE, delinquency_stage IN {CURRENT, LATE, NOIC_ISSUED} (CANCELLATION_REQUESTED and CANCELLED refuse it), at least one FinancedPolicy with status == VERIFIED, and principal_balance_cents > 0"
    error_id: ERR_RESTRUCTURE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /agreements/{id}/restructure"

  - priority: 42
    category: business_constraint
    check: "endorsement financing requires at least one PremiumEndorsement with status == PENDING on a VERIFIED policy of this agreement"
    error_id: ERR_NO_PENDING_ENDORSEMENTS
    http_status: 422
    applies_to: "POST /agreements/{id}/endorsement-financings"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "" — every collection is a top-level segment, so every entity has
# a `/<collection>/{id}` identity and every FK has a reverse-reachability GET.
# =============================================================================
endpoints:

  # --- state rate regime and licensing ----------------------------------------
  - method: POST
    path: "/state-rate-rules"
    description: "register the statutory rate regime for one state; the compliance officer owns this surface"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, finance_charge_method, max_annual_rate_bps, max_service_fee_cents, min_down_payment_bps, max_term_months, late_fee_bps, late_fee_min_cents, late_fee_max_cents, grace_period_days, noic_notice_days, unearned_premium_method, short_rate_penalty_bps, rebate_method, max_late_fees_per_agreement, "license_required?"]
    output: StateRateRule
    side_effects: ["sets active_agreement_count = 0"]

  - method: GET
    path: "/state-rate-rules/{id}"
    description: "read one state rate regime including its live active_agreement_count"
    roles: [ComplianceOfficer, FinanceAnalyst]
    code: 200
    input: []
    output: StateRateRule
    side_effects: []

  - method: POST
    path: "/state-rate-rules/{id}/licenses"
    description: "record a premium finance license held in this state"
    roles: [ComplianceOfficer]
    code: 201
    input: [license_number, effective_date, expiration_date]
    output: License
    side_effects: ["computes is_effective from status, the license window and clock_date"]

  - method: GET
    path: "/state-rate-rules/{id}/licenses"
    description: "list the licenses recorded against this state rate regime"
    roles: [ComplianceOfficer, FinanceAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/licenses/{id}/suspend"
    description: "suspend a license after a regulatory action; origination in that state stops immediately"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["License.status ACTIVE -> SUSPENDED", "sets is_effective = false", "increments License.version by 1"]

  # --- counterparties ----------------------------------------------------------
  - method: POST
    path: "/insureds"
    description: "register a borrower who will sign a premium finance agreement"
    roles: [FinanceAnalyst]
    code: 201
    input: [legal_name, mailing_state_code, email]
    output: Insured
    side_effects: []

  - method: POST
    path: "/agents"
    description: "onboard a producing agency and configure its chargeback exposure"
    roles: [ComplianceOfficer]
    code: 201
    input: [agency_name, state_code, agent_commission_bps, chargeback_basis, chargeback_liability_cap_cents, initial_reserve_balance_cents]
    output: ProducerAgent
    side_effects: ["sets chargeback_reserve_balance_cents = initial_reserve_balance_cents", "sets outstanding_chargeback_cents = 0", "sets status = ACTIVE"]

  - method: GET
    path: "/agents/{id}"
    description: "read one producing agency including its live chargeback exposure"
    roles: [ComplianceOfficer, FinanceAnalyst, ProducerAgent]
    code: 200
    input: []
    output: ProducerAgent
    side_effects: []

  - method: POST
    path: "/agents/{id}/suspend"
    description: "suspend a producing agency for a compliance reason, blocking further origination"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ProducerAgent
    side_effects: ["ProducerAgent.status ACTIVE -> SUSPENDED_BY_COMPLIANCE", "increments ProducerAgent.version by 1"]

  - method: POST
    path: "/insurers"
    description: "register a carrier whose policies may be financed"
    roles: [ComplianceOfficer]
    code: 201
    input: [carrier_name, naic_code, "status?"]
    output: Insurer
    side_effects: []

  # --- agreement origination ---------------------------------------------------
  - method: POST
    path: "/agreements"
    description: "open a draft premium finance agreement under one state rate regime"
    roles: [FinanceAnalyst]
    code: 201
    input: [insured_id, producer_agent_id, state_rule_id, down_payment_cents, service_fee_cents, installment_count, first_installment_due_date]
    output: PremiumFinanceAgreement
    side_effects: ["sets status = DRAFT and delinquency_stage = CURRENT", "records originated_by_user_id from X-User-ID for the later segregation-of-duties check", "zeroes every balance and counter field; StateRateRule.active_agreement_count is NOT touched here — submit owns that increment"]

  - method: GET
    path: "/agreements/{id}"
    description: "read one agreement, including both state dimensions and every derived balance"
    roles: [FinanceAnalyst, ComplianceOfficer, Insured, ProducerAgent]
    code: 200
    input: []
    output: PremiumFinanceAgreement
    side_effects: []

  - method: GET
    path: "/agreements"
    description: "list agreements filtered by borrower, agency, state regime, restructure predecessor or either state dimension"
    roles: [FinanceAnalyst, ComplianceOfficer]
    code: 200
    input: ["insured_id?", "producer_agent_id?", "state_rule_id?", "restructured_from_agreement_id?", "status?", "delinquency_stage?", "limit?", "offset?"]
    output: PremiumFinanceAgreement[]
    side_effects: []

  - method: POST
    path: "/agreements/{id}/policies"
    description: "attach an underlying policy to a draft agreement at the agency-quoted premium"
    roles: [FinanceAnalyst]
    code: 201
    input: [insurer_id, policy_number, gross_premium_cents, effective_date, expiration_date, "min_earned_days?", "fully_earned?"]
    output: FinancedPolicy
    side_effects: ["sets status = PENDING_VERIFICATION and carried_over = false", "sets financed_premium_cents = gross_premium_cents provisionally", "increments PremiumFinanceAgreement.policy_count by 1", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/policies/{id}"
    description: "read one financed policy including its attested premium and unearned-premium figures"
    roles: [FinanceAnalyst, ComplianceOfficer, Insurer, ProducerAgent]
    code: 200
    input: []
    output: FinancedPolicy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "list financed policies filtered by agreement, carrier or status"
    roles: [FinanceAnalyst, ComplianceOfficer, Insurer]
    code: 200
    input: ["agreement_id?", "insurer_id?", "status?", "limit?", "offset?"]
    output: FinancedPolicy[]
    side_effects: []

  # --- premium and effective-date verification --------------------------------
  - method: POST
    path: "/policies/{id}/verifications"
    description: "file the carrier's or the agency's attestation of the financed premium and the policy effective date"
    roles: [Insurer, ProducerAgent]
    code: 201
    input: [decision, "corrected_premium_cents?", "corrected_effective_date?", "note?"]
    output: PremiumVerification
    side_effects: ["derives party from X-User-Role (Insurer -> INSURER, ProducerAgent -> PRODUCER_AGENT) and party_user_id from X-User-ID", "sets effective_premium_cents and effective_date_asserted: CONFIRMED takes the policy's quoted gross_premium_cents and effective_date, CORRECTED takes corrected_premium_cents and corrected_effective_date, REJECTED leaves both null", "the policy stays PENDING_VERIFICATION until BOTH parties have a non-superseded record; once both exist, matching non-REJECTED records move FinancedPolicy PENDING_VERIFICATION -> VERIFIED (stamping verified_premium_cents, verified_effective_date and financed_premium_cents = verified_premium_cents + endorsed_premium_cents), while a REJECTED record or any premium/effective-date mismatch moves it to DISPUTED and stamps dispute_reason", "increments PremiumFinanceAgreement.verified_policy_count by 1 on VERIFIED", "increments FinancedPolicy.version by 1"]

  - method: GET
    path: "/policies/{id}/verifications"
    description: "list every attestation filed against this policy, including superseded ones"
    roles: [FinanceAnalyst, ComplianceOfficer, Insurer, ProducerAgent]
    code: 200
    input: ["party?", "limit?", "offset?"]
    output: PremiumVerification[]
    side_effects: []

  - method: POST
    path: "/policies/{id}/reopen-verification"
    description: "return a disputed policy to the verification queue so the carrier can re-attest"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: FinancedPolicy
    side_effects: ["FinancedPolicy.status DISPUTED -> PENDING_VERIFICATION", "clears dispute_reason", "sets superseded = true on every existing PremiumVerification for this policy", "increments FinancedPolicy.version by 1"]

  - method: POST
    path: "/agreements/{id}/submit"
    description: "submit a draft agreement for verification; computes the provisional quote"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: PremiumFinanceAgreement
    side_effects: ["PremiumFinanceAgreement.status DRAFT -> PENDING_VERIFICATION", "runs calculations.finance_charge_and_amount_financed variant provisional_on_submit and stamps total_premium_cents, amount_financed_cents, effective_annual_rate_bps, finance_charge_cents, total_of_payments_cents and quote_basis = PROVISIONAL", "increments PremiumFinanceAgreement.version by 1"]

  - method: POST
    path: "/agreements/{id}/activate"
    description: "activate the note once every policy is verified; recomputes the quote on attested premiums and cuts the installment schedule"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: PremiumFinanceAgreement
    side_effects: ["PremiumFinanceAgreement.status PENDING_VERIFICATION -> ACTIVE", "runs calculations.finance_charge_and_amount_financed variant final_on_activation and re-stamps the quote fields with quote_basis = FINAL", "runs calculations.installment_schedule_generation and creates installment_count Installment rows in SCHEDULED", "sets principal_balance_cents = amount_financed_cents and unpaid_finance_charge_cents = finance_charge_cents", "stamps activated_at from the logical clock", "increments PremiumFinanceAgreement.version by 1"]

  - method: POST
    path: "/agreements/{id}/void"
    description: "void an agreement that will never fund"
    roles: [FinanceAnalyst]
    code: 200
    input: ["reason?"]
    output: PremiumFinanceAgreement
    side_effects: ["PremiumFinanceAgreement.status DRAFT or PENDING_VERIFICATION -> VOID", "decrements StateRateRule.active_agreement_count by 1", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/agreements/{id}/installments"
    description: "list the installment schedule with per-installment principal and finance-charge components"
    roles: [FinanceAnalyst, ComplianceOfficer, Insured]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []

  # --- payment posting ---------------------------------------------------------
  - method: POST
    path: "/agreements/{id}/payments"
    description: "post a payment against the note; the waterfall picks the standard or the payoff variant"
    roles: [FinanceAnalyst, Insured]
    code: 201
    input: [amount_cents, received_date, method]
    output: Payment
    side_effects: ["runs calculations.payment_waterfall_allocation and stamps allocation_variant, applied_late_fee_cents, applied_finance_charge_cents, applied_principal_cents, applied_unapplied_cents and rebate_applied_cents", "settles LateFeeAssessment rows and advances Installment rows to PAID as the buckets fill", "adjusts principal_balance_cents, unpaid_finance_charge_cents, late_fee_balance_cents and unapplied_credit_cents", "when principal_balance_cents, unpaid_finance_charge_cents and late_fee_balance_cents all reach 0 the agreement moves ACTIVE -> PAID_IN_FULL, every remaining installment is marked PAID and refund_due_cents = unapplied_credit_cents", "when the past-due amount is cleared, delinquency_stage returns to CURRENT and any ISSUED CancellationNotice moves to CURED", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/agreements/{id}/payments"
    description: "list payments posted against this note, including reversed ones"
    roles: [FinanceAnalyst, ComplianceOfficer, Insured]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/payments/{id}/reverse"
    description: "reverse a posted payment (returned item) and restore every balance the allocation touched"
    roles: [FinanceAnalyst]
    code: 200
    input: [reversal_reason]
    output: Payment
    side_effects: ["Payment.status POSTED -> REVERSED and stamps reversed_at", "restores principal_balance_cents, unpaid_finance_charge_cents, late_fee_balance_cents and unapplied_credit_cents to their pre-payment values, satisfying the total_receivable_cents compensation invariant", "restores Installment.paid_cents and Installment.status and returns settled LateFeeAssessment rows to OUTSTANDING", "when the reversal leaves a PAST_DUE installment or a positive late_fee_balance_cents behind, delinquency_stage moves CURRENT -> LATE; a CancellationNotice already CURED stays CURED and its re-notice blackout keeps running", "late_fee_count is NOT decremented", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/agreements/{id}/late-fees"
    description: "list late fees assessed against this note"
    roles: [FinanceAnalyst, ComplianceOfficer, Insured]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LateFeeAssessment[]
    side_effects: []

  - method: POST
    path: "/late-fees/{id}/waive"
    description: "waive an outstanding late fee as a compliance concession"
    roles: [ComplianceOfficer]
    code: 200
    input: [justification]
    output: LateFeeAssessment
    side_effects: ["LateFeeAssessment.status OUTSTANDING -> WAIVED and stamps waived_by_user_id from X-User-ID", "decrements PremiumFinanceAgreement.late_fee_balance_cents by amount_cents", "late_fee_count is NOT decremented, so the statutory cap still counts the waived fee", "increments LateFeeAssessment.version by 1"]

  - method: POST
    path: "/servicing-runs"
    description: "run the nightly servicing pass at the current logical clock: marks past-due installments, assesses late fees under the state rule and advances delinquency stages"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: { past_due_marked: integer, late_fees_assessed: integer, agreements_advanced_to_late: integer }
    side_effects: ["Installment.status SCHEDULED -> PAST_DUE for every unpaid installment whose due_date is before clock_date", "runs calculations.late_fee_assessment and creates LateFeeAssessment rows in OUTSTANDING", "increments PremiumFinanceAgreement.late_fee_count and late_fee_balance_cents", "PremiumFinanceAgreement.delinquency_stage CURRENT -> LATE for agreements with a newly past-due installment", "processes agreements in created_at ascending order and installments in installment_number ascending order"]

  # --- notice of intent to cancel and the power of attorney --------------------
  - method: POST
    path: "/agreements/{id}/cancellation-notices"
    description: "issue the statutory notice of intent to cancel on a delinquent note"
    roles: [FinanceAnalyst]
    code: 201
    input: []
    output: CancellationNotice
    side_effects: ["sets status = ISSUED, issued_date = clock_date, issued_by_user_id = X-User-ID, notice_days = StateRateRule.noic_notice_days and effective_cancel_date = issued_date + notice_days", "stamps past_due_amount_cents from the unpaid past-due installments plus outstanding late fees", "PremiumFinanceAgreement.delinquency_stage LATE -> NOIC_ISSUED", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/agreements/{id}/cancellation-notices"
    description: "list every notice of intent to cancel issued on this note"
    roles: [FinanceAnalyst, ComplianceOfficer, Insured]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CancellationNotice[]
    side_effects: []

  - method: POST
    path: "/agreements/{id}/cancellation-executions"
    description: "exercise the power of attorney: cancel every verified policy with its carrier and quantify the expected unearned premium return"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: { requests_created: integer, estimated_unearned_premium_cents: integer, rebate_applied_cents: integer, gross_balance_cents: integer }
    side_effects: ["CancellationNotice.status ISSUED -> EXECUTED and stamps executed_date = clock_date", "PremiumFinanceAgreement.delinquency_stage NOIC_ISSUED -> CANCELLATION_REQUESTED", "every VERIFIED FinancedPolicy moves to CANCELLED with cancellation_effective_date = the notice's effective_cancel_date", "runs calculations.unearned_premium_return_estimate per policy and stamps earned_days and unearned_premium_estimate_cents", "runs calculations.unearned_finance_charge_rebate and reduces unpaid_finance_charge_cents by the rebate", "creates one CarrierCancellationRequest in REQUESTED per cancelled policy, carrying computed_unearned_premium_cents and estimate_method", "every Installment with status == SCHEDULED and paid_cents == 0 moves to VOIDED; PAST_DUE installments stay PAST_DUE and are settled at the balance level", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/carrier-cancellation-requests"
    description: "list carrier cancellation requests filtered by note, policy or status"
    roles: [FinanceAnalyst, ComplianceOfficer, Insurer]
    code: 200
    input: ["agreement_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: CarrierCancellationRequest[]
    side_effects: []

  - method: GET
    path: "/carrier-cancellation-requests/{id}"
    description: "read one carrier cancellation request with its estimate and any posted return"
    roles: [FinanceAnalyst, ComplianceOfficer, Insurer]
    code: 200
    input: []
    output: CarrierCancellationRequest
    side_effects: []

  - method: POST
    path: "/carrier-cancellation-requests/{id}/return-posting"
    description: "the carrier posts the unearned premium it is actually returning; the last posting settles the note"
    roles: [Insurer]
    code: 200
    input: [carrier_returned_cents, posted_date]
    output: CarrierCancellationRequest
    side_effects: ["CarrierCancellationRequest.status REQUESTED -> RETURN_POSTED, or -> CLOSED_NO_RETURN when carrier_returned_cents == 0", "stamps variance_cents = carrier_returned_cents - computed_unearned_premium_cents", "credits FinancedPolicy.unearned_premium_returned_cents and PremiumFinanceAgreement.unearned_premium_received_cents, then applies the credit in the pinned post-cancellation order principal_balance_cents -> unpaid_finance_charge_cents -> late_fee_balance_cents -> unapplied_credit_cents (the installment schedule is no longer the accounting of record once the note is cancelled, so no Installment row is touched)", "when every request of the note is terminal, runs calculations.deficiency_and_agent_chargeback: the agreement moves ACTIVE -> CANCELLED_DEFICIENT (creating one AgentChargeback in PENDING) or ACTIVE -> CLOSED_ZERO", "a new chargeback that pushes ProducerAgent.outstanding_chargeback_cents to or above chargeback_liability_cap_cents moves the agency ACTIVE -> SUSPENDED_FOR_CHARGEBACKS", "increments PremiumFinanceAgreement.version by 1"]

  # --- additional premium endorsements ----------------------------------------
  - method: POST
    path: "/policies/{id}/endorsements"
    description: "record an additional or return premium endorsement on a financed policy"
    roles: [ProducerAgent, FinanceAnalyst]
    code: 201
    input: [endorsement_type, amount_cents, effective_date]
    output: PremiumEndorsement
    side_effects: ["sets status = PENDING", "sets signed_amount_cents = +amount_cents for ADDITIONAL_PREMIUM and -amount_cents for RETURN_PREMIUM", "increments PremiumEndorsement.version by 1 on later transitions only"]

  - method: GET
    path: "/policies/{id}/endorsements"
    description: "list endorsements filed against this policy"
    roles: [FinanceAnalyst, ComplianceOfficer, ProducerAgent, Insurer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PremiumEndorsement[]
    side_effects: []

  - method: POST
    path: "/endorsements/{id}/decline"
    description: "decline a pending endorsement so it never enters the financed premium"
    roles: [FinanceAnalyst]
    code: 200
    input: ["reason?"]
    output: PremiumEndorsement
    side_effects: ["PremiumEndorsement.status PENDING -> DECLINED", "increments PremiumEndorsement.version by 1"]

  - method: POST
    path: "/agreements/{id}/endorsement-financings"
    description: "fold every pending endorsement of this note into the financed premium and redistribute the unpaid installment tail"
    roles: [FinanceAnalyst]
    code: 200
    input: [expected_agreement_version]
    output: PremiumFinanceAgreement
    side_effects: ["every PENDING PremiumEndorsement on a VERIFIED policy of this note moves to FINANCED and stamps financed_at", "FinancedPolicy.endorsed_premium_cents accumulates signed_amount_cents and financed_premium_cents is re-derived", "re-runs calculations.finance_charge_and_amount_financed variant final_on_activation over the new basis", "re-runs calculations.installment_schedule_generation over installments with status IN {SCHEDULED, PAST_DUE}, leaving PAID and VOIDED installments frozen", "adjusts principal_balance_cents and unpaid_finance_charge_cents by the deltas", "increments PremiumFinanceAgreement.version by 1"]

  # --- restructuring and rate exceptions --------------------------------------
  - method: POST
    path: "/agreements/{id}/restructure"
    description: "restructure a delinquent multi-policy account: mint a successor agreement that carries the predecessor's balance and re-points its policies"
    roles: [FinanceAnalyst]
    code: 201
    input: [additional_down_payment_cents, installment_count, first_installment_due_date]
    output: PremiumFinanceAgreement
    side_effects: ["predecessor PremiumFinanceAgreement.status ACTIVE -> RESTRUCTURED and delinquency_stage -> CANCELLED", "runs calculations.unearned_finance_charge_rebate on the predecessor and reduces its unpaid_finance_charge_cents by the rebate", "creates a successor agreement with restructured_from_agreement_id set, carried_over_balance_cents = the predecessor's post-rebate net balance minus additional_down_payment_cents, status = ACTIVE and delinquency_stage = CURRENT", "re-points every non-CANCELLED FinancedPolicy of the predecessor to the successor and sets carried_over = true so their premiums are not double counted", "voids the predecessor's SCHEDULED and PAST_DUE installments and cuts a fresh schedule on the successor", "any ISSUED CancellationNotice on the predecessor moves to SUPERSEDED", "increments PremiumFinanceAgreement.version by 1 on the predecessor"]

  - method: POST
    path: "/agreements/{id}/rate-exception-approvals"
    description: "compliance approves a priced exception on a pending agreement; the statutory ceiling still binds"
    roles: [ComplianceOfficer]
    code: 200
    input: ["override_service_fee_cents?", "override_annual_rate_bps?", justification]
    output: PremiumFinanceAgreement
    side_effects: ["sets rate_exception_approved = true and rate_exception_approved_by_user_id from X-User-ID", "sets approved_service_fee_cap_cents from override_service_fee_cents and approved_annual_rate_bps from override_annual_rate_bps when supplied", "increments PremiumFinanceAgreement.version by 1"]

  - method: GET
    path: "/agreements/{id}/payoff-quote"
    description: "computed read: the net amount needed to pay the note off on a given date, including the unearned finance charge rebate under the state's rebate method"
    roles: [FinanceAnalyst, ComplianceOfficer, Insured]
    code: 200
    input: ["as_of_date?"]
    output: { as_of_date: string, gross_balance_cents: integer, unearned_finance_charge_rebate_cents: integer, outstanding_late_fee_cents: integer, unapplied_credit_cents: integer, net_payoff_cents: integer, rebate_method: string }
    side_effects: ["read-only; runs calculations.unearned_finance_charge_rebate and defaults as_of_date to clock_date"]

  # --- deficiency collection and agent chargeback ------------------------------
  - method: GET
    path: "/agent-chargebacks"
    description: "list agent chargebacks filtered by agency, note or status"
    roles: [ComplianceOfficer, FinanceAnalyst, ProducerAgent]
    code: 200
    input: ["producer_agent_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: AgentChargeback[]
    side_effects: []

  - method: GET
    path: "/agent-chargebacks/{id}"
    description: "read one agent chargeback with its basis and settled amount"
    roles: [ComplianceOfficer, FinanceAnalyst, ProducerAgent]
    code: 200
    input: []
    output: AgentChargeback
    side_effects: []

  - method: POST
    path: "/agent-chargebacks/{id}/offset"
    description: "offset a chargeback against the agency's reserve; settling the remainder can release a chargeback suspension"
    roles: [ComplianceOfficer]
    code: 200
    input: [offset_amount_cents, expected_chargeback_version]
    output: AgentChargeback
    side_effects: ["AgentChargeback.status PENDING -> PARTIALLY_OFFSET on a partial offset, or -> OFFSET when the remainder is settled", "accumulates offset_applied_cents", "decrements ProducerAgent.chargeback_reserve_balance_cents and outstanding_chargeback_cents", "ProducerAgent.status SUSPENDED_FOR_CHARGEBACKS -> ACTIVE once outstanding_chargeback_cents falls below chargeback_liability_cap_cents", "increments AgentChargeback.version by 1"]

  # --- test-driving surface ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock, which every date-sensitive rule reads (grace periods, notice timelines, license effectiveness, earned days). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [ComplianceOfficer, FinanceAnalyst]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances the logical clock; monotonic only, a rewind is rejected", "recomputes License.is_effective for every license on the next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role addresses a resource it does not own (X-User-ID does not match the resource's owning foreign key)"
  - id: ERR_VERIFIER_NOT_AUTHORIZED
    http: 403
    condition: "an attestation is filed by a carrier that did not issue the policy or by an agency that did not produce the agreement"
  - id: ERR_SOD_ORIGINATOR_CANNOT_APPROVE
    http: 403
    condition: "the user approving a rate exception is the same user that originated the agreement"
  - id: ERR_SOD_NOTICE_ISSUER_CANNOT_EXECUTE
    http: 403
    condition: "the user exercising the power of attorney is the same user that issued the notice of intent to cancel"

  # --- request shape -----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum value out of range, negative cents amount, malformed date, or pagination limit/offset out of bounds"

  # --- existence ---------------------------------------------------------------
  - id: ERR_STATE_RULE_NOT_FOUND
    http: 404
    condition: "state_rule_id in the path or body matches no StateRateRule"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "license_id in the path matches no License"
  - id: ERR_INSURED_NOT_FOUND
    http: 404
    condition: "insured_id in the body matches no Insured"
  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "agent_id in the path or producer_agent_id in the body matches no ProducerAgent"
  - id: ERR_INSURER_NOT_FOUND
    http: 404
    condition: "insurer_id in the body matches no Insurer"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id in the path matches no PremiumFinanceAgreement"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id in the path matches no FinancedPolicy"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment_id in the path matches no Payment"
  - id: ERR_LATE_FEE_NOT_FOUND
    http: 404
    condition: "late_fee_id in the path matches no LateFeeAssessment"
  - id: ERR_CANCEL_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id in the path matches no CarrierCancellationRequest"
  - id: ERR_ENDORSEMENT_NOT_FOUND
    http: 404
    condition: "endorsement_id in the path matches no PremiumEndorsement"
  - id: ERR_CHARGEBACK_NOT_FOUND
    http: 404
    condition: "chargeback_id in the path matches no AgentChargeback"

  # --- optimistic concurrency --------------------------------------------------
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the agreement's current version"
  - id: ERR_STALE_CHARGEBACK_VERSION
    http: 412
    condition: "expected_chargeback_version does not equal the chargeback's current version"

  # --- state preconditions -----------------------------------------------------
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "the agreement's status does not permit this operation per the §1.2 status table"
  - id: ERR_DELINQUENCY_STATE_INVALID
    http: 409
    condition: "the agreement's delinquency_stage does not permit this operation (notice requires LATE, execution requires NOIC_ISSUED)"
  - id: ERR_POLICY_STATE_INVALID
    http: 409
    condition: "the policy's status does not permit this operation (verification requires PENDING_VERIFICATION, reopen requires DISPUTED)"
  - id: ERR_NOTICE_STATE_INVALID
    http: 409
    condition: "the notice selected for execution is not ISSUED"
  - id: ERR_CANCEL_REQUEST_STATE_INVALID
    http: 409
    condition: "a return is posted against a carrier cancellation request that is not REQUESTED"
  - id: ERR_CHARGEBACK_STATE_INVALID
    http: 409
    condition: "an offset is applied to a chargeback already in OFFSET"
  - id: ERR_ENDORSEMENT_STATE_INVALID
    http: 409
    condition: "an endorsement that is not PENDING is declined"
  - id: ERR_PAYMENT_ALREADY_REVERSED
    http: 409
    condition: "a payment already in REVERSED is reversed again"
  - id: ERR_LATE_FEE_NOT_OUTSTANDING
    http: 409
    condition: "a late fee that is not OUTSTANDING is waived"

  # --- referential integrity ---------------------------------------------------
  - id: ERR_POLICY_AGREEMENT_MISMATCH
    http: 409
    condition: "a policy is named alongside an agreement it does not belong to — including an agreement_id and policy_id supplied together as an incoherent filter pair on GET /carrier-cancellation-requests"
  - id: ERR_VERIFICATION_ALREADY_RECORDED
    http: 409
    condition: "the same party already has a non-superseded attestation on this policy"

  # --- licensing and statutory rate compliance --------------------------------
  - id: ERR_STATE_NOT_LICENSED
    http: 422
    condition: "the state rate regime requires a license and no License for it is effective at clock_date"
  - id: ERR_AGENT_SUSPENDED
    http: 422
    condition: "the named producing agency is SUSPENDED_FOR_CHARGEBACKS or SUSPENDED_BY_COMPLIANCE"
  - id: ERR_DUPLICATE_STATE_RULE
    http: 409
    condition: "a StateRateRule already exists for this state_code"
  - id: ERR_TERM_EXCEEDS_STATE_MAXIMUM
    http: 422
    condition: "installment_count exceeds StateRateRule.max_term_months"
  - id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http: 422
    condition: "the down payment is below StateRateRule.min_down_payment_bps of the premium basis"
  - id: ERR_SERVICE_FEE_ABOVE_CAP
    http: 422
    condition: "service_fee_cents exceeds the statutory service-fee ceiling or the approved exception cap"
  - id: ERR_RATE_ABOVE_STATE_MAXIMUM
    http: 422
    condition: "an approved rate exception would exceed StateRateRule.max_annual_rate_bps"

  # --- business constraints ----------------------------------------------------
  - id: ERR_NO_FINANCED_POLICIES
    http: 422
    condition: "an agreement is submitted with no non-cancelled financed policy"
  - id: ERR_POLICY_NOT_VERIFIED
    http: 422
    condition: "an agreement is activated while at least one of its policies is not VERIFIED"
  - id: ERR_RESTRUCTURE_NOT_ELIGIBLE
    http: 422
    condition: "restructuring is requested on an agreement that is not ACTIVE with a servicing-eligible delinquency_stage, a VERIFIED policy and a positive principal balance"
  - id: ERR_NO_PENDING_ENDORSEMENTS
    http: 422
    condition: "endorsement financing is requested with no PENDING endorsement on any VERIFIED policy of the note"

  # --- temporal ---------------------------------------------------------------
  - id: ERR_INVALID_POLICY_TERM
    http: 422
    condition: "expiration_date is not strictly after effective_date, or min_earned_days exceeds the term length"
  - id: ERR_POLICY_TERM_OVERLAP
    http: 409
    condition: "another non-cancelled policy with the same carrier and policy number has an overlapping half-open term"
  - id: ERR_INVALID_FIRST_DUE_DATE
    http: 422
    condition: "first_installment_due_date is not strictly after clock_date, or is more than 60 days after it"
  - id: ERR_NOTICE_WINDOW_OPEN
    http: 409
    condition: "an ISSUED notice of intent to cancel already exists on this agreement"
  - id: ERR_NOTICE_BLACKOUT_ACTIVE
    http: 409
    condition: "a new notice is issued while the closed re-notice blackout [cured_date, cured_date + StateRateRule.noic_notice_days] of the most recently CURED notice is still running"
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 422
    condition: "the power of attorney is exercised before the notice's effective_cancel_date"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock value"

  # --- fiscal ------------------------------------------------------------------
  - id: ERR_PREMIUM_VARIANCE_EXCEEDED
    http: 422
    condition: "a corrected premium deviates from the quoted gross premium by more than 2500 basis points"
  - id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http: 422
    condition: "a payment exceeds the net payoff by more than 50000 cents"
  - id: ERR_OFFSET_EXCEEDS_RESERVE
    http: 422
    condition: "an offset exceeds the agency's reserve balance or the chargeback's unsettled remainder"

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
roles:

  - name: FinanceAnalyst
    description: "originates, submits, activates and services premium finance agreements; issues notices of intent to cancel and exercises the power of attorney"
    identity: opaque
    exclusive_operations:
      - "POST /insureds"
      - "POST /agreements"
      - "POST /agreements/{id}/policies"
      - "POST /agreements/{id}/submit"
      - "POST /agreements/{id}/activate"
      - "POST /agreements/{id}/void"
      - "POST /policies/{id}/reopen-verification"
      - "POST /payments/{id}/reverse"
      - "POST /agreements/{id}/cancellation-notices"
      - "POST /agreements/{id}/cancellation-executions"
      - "POST /endorsements/{id}/decline"
      - "POST /agreements/{id}/endorsement-financings"
      - "POST /agreements/{id}/restructure"
    shared_operations:
      - "GET /state-rate-rules/{id}"
      - "GET /state-rate-rules/{id}/licenses"
      - "GET /agents/{id}"
      - "GET /agreements/{id}"
      - "GET /agreements"
      - "GET /policies/{id}"
      - "GET /policies"
      - "GET /policies/{id}/verifications"
      - "GET /agreements/{id}/installments"
      - "POST /agreements/{id}/payments"
      - "GET /agreements/{id}/payments"
      - "GET /agreements/{id}/late-fees"
      - "GET /agreements/{id}/cancellation-notices"
      - "GET /carrier-cancellation-requests"
      - "GET /carrier-cancellation-requests/{id}"
      - "POST /policies/{id}/endorsements"
      - "GET /policies/{id}/endorsements"
      - "GET /agreements/{id}/payoff-quote"
      - "GET /agent-chargebacks"
      - "GET /agent-chargebacks/{id}"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "owns state rate regimes, licensing, agency onboarding and suspension, rate exceptions, late-fee waivers, servicing runs and chargeback offsets; may never originate or activate a note"
    identity: opaque
    exclusive_operations:
      - "POST /state-rate-rules"
      - "POST /state-rate-rules/{id}/licenses"
      - "POST /licenses/{id}/suspend"
      - "POST /agents"
      - "POST /agents/{id}/suspend"
      - "POST /insurers"
      - "POST /late-fees/{id}/waive"
      - "POST /servicing-runs"
      - "POST /agreements/{id}/rate-exception-approvals"
      - "POST /agent-chargebacks/{id}/offset"
    shared_operations:
      - "GET /state-rate-rules/{id}"
      - "GET /state-rate-rules/{id}/licenses"
      - "GET /agents/{id}"
      - "GET /agreements/{id}"
      - "GET /agreements"
      - "GET /policies/{id}"
      - "GET /policies"
      - "GET /policies/{id}/verifications"
      - "GET /agreements/{id}/installments"
      - "GET /agreements/{id}/payments"
      - "GET /agreements/{id}/late-fees"
      - "GET /agreements/{id}/cancellation-notices"
      - "GET /carrier-cancellation-requests"
      - "GET /carrier-cancellation-requests/{id}"
      - "GET /policies/{id}/endorsements"
      - "GET /agreements/{id}/payoff-quote"
      - "GET /agent-chargebacks"
      - "GET /agent-chargebacks/{id}"
      - "POST /_clock/set_current_utc"

  - name: ProducerAgent
    description: "the producing agency: attests premiums on the notes it produced, files endorsements and reads its own chargeback exposure"
    identity: "entity_backed:ProducerAgent"
    exclusive_operations: []
    shared_operations:
      - "GET /agents/{id}"
      - "GET /agreements/{id}"
      - "GET /policies/{id}"
      - "POST /policies/{id}/verifications"
      - "GET /policies/{id}/verifications"
      - "POST /policies/{id}/endorsements"
      - "GET /policies/{id}/endorsements"
      - "GET /agent-chargebacks"
      - "GET /agent-chargebacks/{id}"

  - name: Insurer
    description: "the carrier: attests the premium and effective date on its own policies and posts the unearned premium it returns"
    identity: "entity_backed:Insurer"
    exclusive_operations:
      - "POST /carrier-cancellation-requests/{id}/return-posting"
    shared_operations:
      - "GET /policies/{id}"
      - "GET /policies"
      - "POST /policies/{id}/verifications"
      - "GET /policies/{id}/verifications"
      - "GET /policies/{id}/endorsements"
      - "GET /carrier-cancellation-requests"
      - "GET /carrier-cancellation-requests/{id}"

  - name: Insured
    description: "the borrower: pays the note and reads its own schedule, payments, late fees, notices and payoff quote"
    identity: "entity_backed:Insured"
    exclusive_operations: []
    shared_operations:
      - "GET /agreements/{id}"
      - "GET /agreements/{id}/installments"
      - "POST /agreements/{id}/payments"
      - "GET /agreements/{id}/payments"
      - "GET /agreements/{id}/late-fees"
      - "GET /agreements/{id}/cancellation-notices"
      - "GET /agreements/{id}/payoff-quote"
