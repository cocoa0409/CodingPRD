            - call: "POST /sample-selections/${sel_a}/notice"
              payload: { notice_method: "POSTED_AND_MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T12:00:00.000Z" }
