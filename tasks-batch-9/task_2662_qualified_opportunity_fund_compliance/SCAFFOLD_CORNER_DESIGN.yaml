            - "${v_after} == 4"
            - "no InclusionEvent row exists anywhere (the fund had no elections to include)"
            - "AssetTest.${at_id}.status == CERTIFIED_PASS and result == PASS (already-certified tests are not disturbed)"
            - "Fund.${fund_id}.aggregate_qualified_basis == 1000000.00 (decertification does not touch the asset ledger)"

