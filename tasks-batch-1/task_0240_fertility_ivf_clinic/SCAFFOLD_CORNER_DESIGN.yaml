            - "response.http_status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_store_stale_tank_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[specimen-store-stale-tank]", "errors[ERR_STALE_TANK_VERSION]", state_machines.CryoSpecimen.PENDING_to_STORED]
        distinguishing_aspect: "Storing a specimen with a stale expected_tank_version (one behind, after another store bumped the tank) -> ERR_STALE_TANK_VERSION 412."
        test_recipe:
          setup: ["A FERTILIZATION cycle, a capacity-5 tank, two PENDING specimens. One store advances the tank version; the second store carries the pre-store version."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "OCC Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "OCC Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-OCC", capacity_slots: 5 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 6 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 3 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp1_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp2_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp1_id}/store"
              payload: { expected_tank_version: "${tank_v0}" }
              as: Embryologist
          trigger:
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp2_id}/store"
              payload: { expected_tank_version: "${tank_v0}" }
              as: Embryologist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_TANK_VERSION"
            - "response.http_status == 412"
            - "CryoSpecimen.${sp2_id}.status == PENDING"

      - name: occ_settle_stale_cycle_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cycle-settle-stale-cycle]", "errors[ERR_STALE_CYCLE_VERSION]", state_machines.TreatmentCycle.ESTIMATED_to_SETTLED]
        distinguishing_aspect: "Settling a cycle with an expected_cycle_version captured BEFORE a cancel bumped it -> ERR_STALE_CYCLE_VERSION 412."
