            - "GET /accommodation-requests/${ar} returns data.status == 'INFO_REQUESTED', data.info_request_rounds == 1, data.granted_format == null, data.valid_until == null"

      - name: accommodation_denied_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AccommodationRequest.terminal_states
          - errors[ERR_ACCOMMODATION_NOT_PENDING]
        distinguishing_aspect: |
          DENIED is terminal on both edges leaving it: neither a later APPROVE nor a resubmission is
          accepted, so a denied request cannot be revived - the student must file a new one.
        test_recipe:
          setup:
            - "One DENIED accommodation request."
          setup_api_calls:
