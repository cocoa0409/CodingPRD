  # ===========================================================================
  # From Consistency Model — §1.0 complexity_profile.consistency_model: immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: authorize_response_reflects_all_derived_state_immediately
        claim_type: immediate_consistency
        grounds:
          - endpoints[POST /vendors/{id}/authorize]
          - calculations.reauthorization_and_training_dates
          - calculations.peer_group_member_count
          - calculations.vendor_avg_monthly_redemption
        distinguishing_aspect: |
          Under the immediate model there is no lag anywhere in the write: the authorize
          response already carries every field derived in that same request, and the
          denormalized PeerGroup.member_count is 1 on the very next read with the peer
          group's own version bumped — no second call, no refresh step.
        test_recipe:
          setup:
            - "CHAIN A through the review of the accepted milk submission, so vendor v1 is IN_REVIEW and authorize is about to succeed"
            - "PeerGroup.${pg_a} is captured with member_count 0 and version 1 before the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id, pg_a_v1: $.data.version }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors/${v1}/record-training"
              payload: { training_type: "INITIAL", completed_at: "2026-07-15T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { sub_v1_milk: $.data.id }
            - call: "POST /price-submissions/${sub_v1_milk}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
          trigger:
            - call: "POST /vendors/${v1}/authorize"
              payload: {}
              as: VendorUnitSupervisor
              as_user_id: "sup-001"
            - call: "GET /peer-groups/${pg_a}"
              payload: {}
              as: VendorUnitSupervisor
              as_user_id: "sup-001"
          assert:
            - "Before the trigger, GET /peer-groups/${pg_a} reports member_count == 0 with version == ${pg_a_v1}, even though ${v1} already has peer_group_id == ${pg_a} — membership is counted at authorization, not at assignment"
            - "The authorize response body itself already contains authorization_status == AUTHORIZED, authorized_at == 2026-08-01T00:00:00.000Z, authorization_blocked_reason == null, training_expires_at == 2027-07-15T00:00:00.000Z (TRAINING_VALID_MONTHS 12 from completed_at), reauthorization_due_at == 2029-08-01T00:00:00.000Z (REAUTH_CYCLE_MONTHS 36 from authorized_at) and avg_monthly_redemption_cents == 6000000"
            - "No follow-up read is needed for those values: GET /vendors/${v1} returns exactly the same numbers as the authorize response"
            - "Second trigger call, issued immediately after with no intervening operation: member_count == 1 and version == ${pg_a_v1} + 1 — the cross-entity counter is updated inside the same transaction, so an eventual-consistency implementation that defers it would fail here"
            - "GET /vendors?peer_group_id=${pg_a}&authorization_status=AUTHORIZED returns meta.total_count == 1, agreeing with the denormalized counter"

      - name: delist_cascade_is_visible_without_refresh
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /authorized-food-items/{id}/delist]"
          - "entities.PriceCeiling.fields.superseded_reason"
        excluded_because:
          difficulty_instance: item_delist_cascades_to_ceilings_submissions_and_authorization_block
          rationale: |
            The strongest immediate-consistency claim in this domain is that a single
            delist call leaves ceilings, submissions and vendor completeness flags all
            consistent on the very next read. That §1.8 instance asserts each of those
            four hops directly after the one write, so a separate no-lag check would only
            restate it.

