              payload: { vineyard_id: "${va_id}", block_code: "B-12", variety: "MERLOT", clone: "FPS-06", rootstock: "ROOTSTOCK_SO4", trellis_system: "VSP", planting_year: 2019, vine_spacing_ft: 6.0, row_spacing_ft: 10.0, acres: 4.0 }
              as: VineyardManager
