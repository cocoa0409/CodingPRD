            - call: "GET /vaccine-distribution/storage-sites/${site_id}/usable-doses"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { usable_after: "$.data.usable_doses", admin_after: "$.data.administrative_remaining_doses" }
          assert:
            - "usable_before == 2340 and GET before the dispense reports administrative_remaining_doses 2340"
            - "usable_after == 2223, exactly usable_before minus the 117 administered doses"
            - "admin_after == 2223 and Carton.${c01}.administrative_remaining_doses == 2223"
            - "Carton.${c01}.remaining_doses == 2340 because doses are only removed from the physical count by a puncture or expiry"

      - name: hub_selector_is_deterministic_and_refuses_an_empty_candidate_set
        claim_type: selector_policy
        grounds:
          - entities.DispatchOrder.fields.staging_site_id
          - endpoints.POST_/dispatches
          - errors[ERR_NO_ELIGIBLE_SITE]
        distinguishing_aspect: "With two equally capable family-linked hubs, the staging site is the one with the lower expected_weekly_doses, and the same call against a site with no family links is refused with ERR_NO_ELIGIBLE_SITE rather than defaulting to any candidate."
        test_recipe:
          setup:
            - "The anchored base fixture with the ordering site MI-RIV-01 linked to two hubs: MI-RIV-05 at 1200 expected weekly doses and MI-RIV-07 at 400, both ULTRA_COLD and both certified."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - *x_win
            - *x_open
            - *x_ent
            - *x_site
            - *x_verify
            - *x_order
            - call: "POST /vaccine-distribution/site-orders/${order_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-05", site_name: "Riverside Annex", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 4, refrigerated_capacity_cartons: 4, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 1200 }
              as: DistributionPlanner
              captures: { site5_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site5_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0005", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-07", site_name: "Riverside Hub", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 4, refrigerated_capacity_cartons: 4, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 400 }
              as: DistributionPlanner
              captures: { site7_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site7_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0007", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/carton-families"
              payload: { site_id: "${site_id}", member_site_id: "${site5_id}", linked_at: "2026-09-01T00:00:00Z" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/carton-families"
              payload: { site_id: "${site_id}", member_site_id: "${site7_id}", linked_at: "2026-09-01T00:01:00Z" }
              as: ColdChainReviewer
          trigger:
            - call: "POST /vaccine-distribution/dispatches"
              payload: { site_order_id: "${order_id}", storage_site_id: "${site_id}", entry_route: "THAW_AT_HUB" }
              as: LogisticsOperator
              captures: { chosen_hub: "$.data.staging_site_id" }
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-08", site_name: "Riverside Unlinked", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 4, refrigerated_capacity_cartons: 4, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 100 }
              as: DistributionPlanner
              captures: { site8_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site8_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0008", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/site-orders"
              payload: { allocation_entitlement_id: "${ent_id}", storage_site_id: "${site8_id}", requested_cartons: 1, requested_doses: 0 }
              as: SiteCoordinator
              as_user_id: "${site8_id}"
              captures: { order8_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-orders/${order8_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site8_id}"
            - call: "POST /vaccine-distribution/site-orders/${order8_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
            - call: "POST /vaccine-distribution/dispatches"
              payload: { site_order_id: "${order8_id}", storage_site_id: "${site8_id}", entry_route: "THAW_AT_HUB" }
              as: LogisticsOperator
              captures: { error_id: "$.data.error_id" }
          assert:
            - "chosen_hub == ${site7_id}, the linked hub with the lower expected_weekly_doses of 400 rather than the 1200 one"
            - "the unlinked site's dispatch returns 422 with error_id == ERR_NO_ELIGIBLE_SITE"
            - "DispatchOrder.${disp_id}.staging_site_id == ${site7_id} and freeze_required is true"
            - "GET /vaccine-distribution/carton-families?site_id=${site_id} returns exactly 2 rows"

      - name: family_membership_cascade_and_dual_variants
        claim_type: cascading_side_effects
        grounds:
