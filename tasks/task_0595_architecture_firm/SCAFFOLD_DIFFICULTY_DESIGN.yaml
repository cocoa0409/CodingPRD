          Error-category pair #1 is business_temporal (priority 14) versus business_fiscal
          (priority 15): one POST /time-entries request violates BOTH — its half-open interval
          strictly overlaps an existing APPROVED entry on the same staff member AND the project's
          budget_posture is already OVER_BUDGET — and the server must return
