          - entities.AllotmentTransaction.fields.running_balance_cents
          - entities.AllotmentTransaction.fields.source_ref
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Pins total_count against the FILTER rather than the page, proves the two filters compose as AND, proves offset resumes without overlap on an append-only ledger, and puts the limit ceiling and the empty-result 200 in the same instance - a combination a single unfiltered list read cannot reach."
