# =============================================================================
# §1.9 Scaffold Corner Design — task 2397 Tax Amnesty & Voluntary Disclosure
# Administration.
#
# Walks the claim-extraction guide's nine sections against §1.1-§1.7 of
# SCAFFOLD.yaml. Rows whose claim is already carried by a §1.8 difficulty
# instance are recorded as `excluded_because` stubs that name that instance, so
# the corner suite and the difficulty suite do not duplicate coverage.
#
# Fixture conventions shared by the recipes below (all arithmetic pre-computed):
#   clock                 2026-09-15T00:00:00Z unless a recipe moves it
#   program window        2026-09-01T00:00:00Z .. 2026-12-01T00:00:00Z
#   lookback_months 36 -> earliest agreement lookback_start_date 2023-09-01
#   base waivers          penalty 1.00, interest 0.50
#   SALES_USE term        [2020-01-01, 2026-07-01), min_liability_cents 50000
#   canonical return      2025-01-01..2025-03-31, due 2025-10-27, tax 1000000
#                         -> days_late 400, rate 0.25, penalty 250000,
#                            interest 100000, waived 300000, balance 1050000
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: Table 1 Entities
    instances:
      - name: program_creation_persists_every_declared_field
        claim_type: Creation
        grounds:
          - entities.AmnestyProgram
          - endpoints[POST /amnesty/programs]
        distinguishing_aspect: |
          The happy-path creation claim for the root aggregate: every input field is
          echoed back, the four common fields are minted, and all eight computed or
          system fields start at their declared zero values rather than null.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000, prospective_compliance_months: 48, installment_max_count: 6 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.id is a UUID with no type prefix"
            - "response.data.version == 1"
            - "response.data.created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "AmnestyProgram.${prog_id}.name == \"FY27 Amnesty\""
            - "AmnestyProgram.${prog_id}.lookback_months == 36"
            - "AmnestyProgram.${prog_id}.prospective_compliance_months == 48"
            - "AmnestyProgram.${prog_id}.installment_max_count == 6"
            - "AmnestyProgram.${prog_id}.status == \"DRAFT\""
            - "AmnestyProgram.${prog_id}.closed_at == null"
            - "AmnestyProgram.${prog_id}.collected_cents == 0"
            - "AmnestyProgram.${prog_id}.waived_total_cents == 0"
            - "AmnestyProgram.${prog_id}.reinstated_total_cents == 0"
            - "AmnestyProgram.${prog_id}.participant_count == 0"
            - "AmnestyProgram.${prog_id}.nonparticipant_count == 0"
            - "AmnestyProgram.${prog_id}.final_realization_pct == null"

      - name: program_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /amnesty/programs]
          - response_envelope.pagination
        distinguishing_aspect: |
          Pagination arithmetic on a three-row collection: the window echoes limit and
          offset, total_count counts the whole filtered set rather than the page, and
          has_more is derived from offset + limit < total_count, flipping to false on
          the last page.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z"
            - "Three DRAFT programs exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "Amnesty Alpha", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "Amnesty Bravo", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 24, base_penalty_waiver_pct: 0.80, base_interest_waiver_pct: 0.40, post_program_penalty_multiplier: 1.50, revenue_forecast_cents: 50000000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "Amnesty Charlie", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 12, base_penalty_waiver_pct: 0.50, base_interest_waiver_pct: 0.25, post_program_penalty_multiplier: 3.00, revenue_forecast_cents: 25000000 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /amnesty/programs"
              payload: { limit: 2, offset: 0 }
              as: ComplianceAuditor
            - call: "GET /amnesty/programs"
              payload: { limit: 2, offset: 2 }
              as: ComplianceAuditor
            - call: "GET /amnesty/programs"
              payload: { status: "OPEN" }
              as: ComplianceAuditor
          assert:
            - "the first trigger returns 2 rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second trigger returns 1 row with total_count == 3, limit == 2, offset == 2 and has_more == false"
            - "the third trigger returns 0 rows with total_count == 0 and has_more == false"
            - "omitting limit and offset entirely returns 3 rows with limit == 10 and offset == 0"

      - name: optional_fields_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.AmnestyProgram.fields.prospective_compliance_months
          - entities.AmnestyProgram.fields.installment_max_count
          - entities.ProgramTaxTypeTerm.fields.requires_prior_nonfiler
          - entities.Taxpayer.fields.is_registered
        distinguishing_aspect: |
          Three different default mechanisms in one pass: a numeric program default (36
          and 12), a boolean term default (false), and the term's nullable waiver
          overrides, which default to null so that the program base waiver is inherited
          rather than to 0.00, which would silently waive nothing.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Larkspur Freight LLC", taxpayer_type: "BUSINESS", tin_last4: "3319" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
          assert:
            - "AmnestyProgram.${prog_id}.prospective_compliance_months == 36"
            - "AmnestyProgram.${prog_id}.installment_max_count == 12"
            - "ProgramTaxTypeTerm.${term_id}.requires_prior_nonfiler == false"
            - "ProgramTaxTypeTerm.${term_id}.penalty_waiver_pct == null"
            - "ProgramTaxTypeTerm.${term_id}.interest_waiver_pct == null"
            - "Taxpayer.${tp_id}.is_registered == true"
            - "Taxpayer.${tp_id}.escalation_tier == \"T0\""
            - "Taxpayer.${tp_id}.compliance_behavior_score == 100"
            - "Taxpayer.${tp_id}.nonparticipant_flag == false"
            - "Taxpayer.${tp_id}.open_case_count == 0"
            - "Taxpayer.${tp_id}.open_enforcement_action_count == 0"
            - "Taxpayer.${tp_id}.nonfiler_period_count == 0"

      - name: negotiation_round_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.NegotiationRound.common_fields
          - endpoints[GET /amnesty/negotiation-rounds/{id}]
        distinguishing_aspect: |
          NegotiationRound is the only append-only entity in the scaffold: with
          common_fields false it exposes id and created_at but no version and no
          updated_at, and §1.5 offers no endpoint that mutates or deletes a round —
          the negotiation history is evidence, so a later offer adds a row instead of
          editing one.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Representative Marlowe submitted one pre-clearance which reached UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/representatives"
              payload: { firm_name: "Marlowe & Pike LLP", bar_number: "BAR-33417" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /amnesty/pre-clearances"
              payload: { program_id: "${prog_id}", tax_type: "SALES_USE", anonymous_alias: "CLIENT-07", estimated_liability_cents: 900000, self_reported_under_audit: false, earliest_unfiled_period_start: "2024-04-01" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/begin-review"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v: $.data.version }
          trigger:
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v}", offered_lookback_months: 30, offered_penalty_waiver_pct: 0.60, offered_interest_waiver_pct: 0.30, offer_note: "opening position" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
            - call: "GET /amnesty/pre-clearances/${pc_id}/negotiation-rounds"
              payload: {}
              as: ComplianceAuditor
              captures: { round_id: "$.data[0].id" }
          assert:
            - "GET /amnesty/negotiation-rounds/${round_id} returns 200"
            - "NegotiationRound.${round_id} exposes id and created_at"
            - "NegotiationRound.${round_id} exposes NO version field and NO updated_at field"
            - "NegotiationRound.${round_id}.round_index == 1"
            - "NegotiationRound.${round_id}.proposed_by == \"STATE\""
            - "NegotiationRound.${round_id}.lookback_months == 30"
            - "NegotiationRound.${round_id}.penalty_waiver_pct == 0.60"
            - "NegotiationRound.${round_id}.note == \"opening position\""
            - "NegotiationRound.${round_id}.actor_user_id == \"officer-alpha\""
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for a negotiation round"

      - name: taxpayer_read_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors[ERR_TAXPAYER_NOT_FOUND]
        distinguishing_aspect: |
          Path-id resolution on an empty registry: an id-shaped value that matches no
          row yields the entity-specific 404 rather than a 400 or an empty 200 body.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; no taxpayers are registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /amnesty/taxpayers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == \"ERR_TAXPAYER_NOT_FOUND\""
            - "response.meta and response.response_type == \"error\" are present per §1.0"

      - name: program_creation_missing_required_window_close_at_is_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=8]
          - endpoints[POST /amnesty/programs].input
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Schema validation for a required input with no default: omitting
          window_close_at is a 400 before any window-ordering arithmetic is attempted,
          and no program row is written.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; no programs exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /amnesty/programs returns total_count == 0"

      - name: computed_taxpayer_score_input_ignored_on_creation
        claim_type: Computed Fields
        grounds:
          - entities.Taxpayer.fields.compliance_behavior_score
          - endpoints[POST /amnesty/taxpayers].input
        distinguishing_aspect: |
          A computed field supplied by the client is ignored rather than honoured or
          rejected: the registry mints score 100 and tier T0 from the scoring rule even
          though the request asked for 40 and T2, so no caller can seed an escalation
          tier by hand.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; no taxpayers are registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Sable Creek Mills Inc", taxpayer_type: "BUSINESS", tin_last4: "7781", compliance_behavior_score: 40, escalation_tier: "T2", nonparticipant_flag: true }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Taxpayer.${tp_id}.compliance_behavior_score == 100"
            - "Taxpayer.${tp_id}.escalation_tier == \"T0\""
            - "Taxpayer.${tp_id}.nonparticipant_flag == false"
            - "Taxpayer.${tp_id}.legal_name == \"Sable Creek Mills Inc\""

      - name: term_creation_under_unknown_program_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ProgramTaxTypeTerm.parent
          - validations[priority=5]
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: |
          The nested child route resolves its parent from the path before any schema or
          window-overlap work: an unknown programId is a 404 on the parent entity, not a
          422 about the term's own window.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; no programs exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/programs/00000000-0000-4000-8000-000000000001/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == \"ERR_PROGRAM_NOT_FOUND\""

      - name: invalid_tax_type_enum_member_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ProgramTaxTypeTerm.fields.tax_type
          - validations[priority=8]
        distinguishing_aspect: |
          Enum membership is closed: PROPERTY_TAX is not one of the five declared tax
          types, so the term is refused with a 400 while the same call with SALES_USE
          succeeds, proving the check is on the value and not on the field's presence.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; one DRAFT program with no terms"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "PROPERTY_TAX", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
          assert:
            - "the first trigger returns status 400 with error_id ERR_INVALID_REQUEST"
            - "the second trigger returns status 201"
            - "GET /amnesty/programs/${prog_id}/tax-type-terms returns total_count == 1"

      - name: agreement_body_foreign_keys_are_checked_in_declared_order_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - complexity_profile.entity_topology
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: |
          Flat-topology integrity: body foreign keys are resolved in the order the
          fields are declared, so a request whose program_id AND taxpayer_id are both
          unknown reports ERR_PROGRAM_NOT_FOUND — program_id is declared first — rather
          than whichever lookup the implementation happens to run first.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; no programs and no taxpayers exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/agreements"
              payload: { program_id: "00000000-0000-4000-8000-000000000002", taxpayer_id: "00000000-0000-4000-8000-000000000003", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == \"ERR_PROGRAM_NOT_FOUND\""
            - "GET /amnesty/agreements returns total_count == 0"

  # =========================================================================
  - section: Table 2 State Machines
    instances:
      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines[*].initial_state
          - entities[*].fields.status.default
        distinguishing_aspect: |
          One sweep over all nine state machines' initial states, including the two that
          are counter-intuitive: a Payment is born APPLIED (there is no PENDING stage,
          so the waterfall runs inside the create call) and an EnforcementCase is born
          OPEN (an audit exists the moment it is recorded).
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000, installment_max_count: 12 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Quarry Bend Aggregates LLC", taxpayer_type: "BUSINESS", tin_last4: "1102" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/enforcement-cases"
              payload: { taxpayer_id: "${tp_id}", case_type: "COLLECTION", tax_type: "EXCISE_FUEL", opened_at: "2026-05-04" }
              as: ComplianceAuditor
              as_user_id: "auditor-one"
              captures: { case_id: $.data.id }
            - call: "POST /amnesty/representatives"
              payload: { firm_name: "Ostrand Advisory", bar_number: "BAR-90014" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /amnesty/pre-clearances"
              payload: { program_id: "${prog_id}", tax_type: "SALES_USE", anonymous_alias: "CLIENT-11", estimated_liability_cents: 700000, self_reported_under_audit: false, earliest_unfiled_period_start: "2024-07-01" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
