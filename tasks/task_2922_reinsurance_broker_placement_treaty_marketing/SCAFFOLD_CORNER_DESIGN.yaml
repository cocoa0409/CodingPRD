      - name: every_error_status_class_returns_the_same_envelope_shape
        claim_type: Error triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_VALIDATION
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_DUPLICATE_NAME
          - errors.ERR_TREATY_PERIOD_INVALID
        distinguishing_aspect: |
          The catalog spreads 69 error ids across six HTTP status classes (400, 401, 403, 404, 409,
          412, 422), and the envelope must not vary with the class: `response_type` is the literal
          string "error" for all of them, `data` carries exactly `error_id` and `message` and never
          leaks a partial entity, and the `meta` block with `api_request_id` and
          `api_request_timestamp` is present on failures exactly as it is on successes. The
          shape is what a client parses before it knows which class it got, so one deviation — a
          bare 404 body, a 400 that echoes the rejected payload, a 409 with `response_type:
          "object"` — breaks every consumer.
