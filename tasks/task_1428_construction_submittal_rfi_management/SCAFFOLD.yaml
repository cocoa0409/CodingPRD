    roles: [SubcontractorRep]
    code: 201
    input: [document_ref, "notes?", expected_submittal_version]
    output: SubmittalRevision
    side_effects: ["revision_number = submittal.revision_count, then revision_count += 1", "prior RETURNED(C/D) revision -> SUPERSEDED", "submittal.review_status -> IN_REVIEW", "increments Submittal.version by 1"]

  - method: GET
    path: "/v1/submittals/{submittalId}/revisions"
    description: "List revisions of a submittal (revision_number ASC)"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "SubmittalRevision[]"
    side_effects: []

  - method: GET
    path: "/v1/revisions"
    description: "Filtered list of revisions"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["submittal_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: "SubmittalRevision[]"
    side_effects: []

  - method: GET
    path: "/v1/revisions/{revisionId}"
    description: "Get one revision"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: SubmittalRevision
    side_effects: []

  - method: POST
    path: "/v1/revisions/{revisionId}/route"
    description: "SUBMITTED -> UNDER_REVIEW. reviewer_id optional; omitted -> reviewer_selector with section.required_discipline"
    roles: [ProjectEngineer]
    code: 200
    input: ["reviewer_id?"]
    output: SubmittalRevision
    side_effects: ["review_due_date computed", "reviewer.open_review_count += 1", "increments SubmittalRevision.version by 1"]

  - method: POST
    path: "/v1/revisions/{revisionId}/return"
    description: "UNDER_REVIEW -> RETURNED with action_code; only the assigned reviewer"
    roles: [Reviewer]
    code: 200
    input: [action_code, "comments?"]
    output: SubmittalRevision
    side_effects: ["is_late_return computed", "reviewer.open_review_count -= 1", "submittal.review_status per action code", "increments SubmittalRevision.version by 1", "increments Submittal.version by 1"]

