            - "PreparedMaterial.${mat_id}.readiness_score == 100.00"
            - "PreparedMaterial.${mat_id}.version == ${mat_v} (unchanged)"
            - "PreparedMaterial.${mat_id}.last_reviewed_at == 2026-08-01T00:00:00Z"

