          Entry point POST /quality-reviews/{id}/decide with outcome FAIL, four causal hops deep:
          (1) Engagement work_status SUBMITTED -> TERMINATED with termination_reason QUALITY_FAILURE,
          releasing the cycle slot and the window hours; (2) BECAUSE the engagement terminated holding a
          non-superseded ValuationRecord, valuation_status PROVISIONAL -> RESTATED - the MARKET_RATE
          record is stamped superseded_at and a compensating INDEPENDENT_SECTOR record (variant_label
          RESTATED) is posted from the same 12.00 approved hours; (3) BECAUSE that record was posted,
          Volunteer.lifetime_valued_usd is recomputed to 467.58 and both reliability variants rerun to
          0.0000 (points 0.00 for a QUALITY_FAILURE terminal); (4) BECAUSE 0.0000 < RELIABILITY_FLOOR
          (0.4000), Volunteer.status ACTIVE -> PAUSED with pause_reason RELIABILITY_FLOOR and the
          volunteer's unrelated OFFERED offer on request 2 is WITHDRAWN with withdraw_reason
          VOLUNTEER_PAUSED, releasing a further 20.00 hours and a further reserved slot. Hop 4 is only
