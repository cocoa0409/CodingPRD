              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Ov", last_name: "Lap", birth_date: "2015-03-10", residence_within_boundary: false, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
