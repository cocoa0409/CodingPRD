    output: "TicketSale[]"
    side_effects: []

  - method: POST
    path: "/shows/{id}/ticket-sales"
    description: "Sell tickets (with tier roll-up allocation)"
    roles: [Promoter]
    code: 201
    input: [tier_id, quantity]
    output: TicketSale
    side_effects:
      - "allocate per ticket_scaling_tier_advance; create one TicketSale with composite gross"
