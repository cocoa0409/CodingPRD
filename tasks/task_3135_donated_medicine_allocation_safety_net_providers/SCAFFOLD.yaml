    side_effects: ["total_value_usd and lot_count computed"]

  - method: GET
    path: "/medicine-relief/valuation-snapshots/{snapshot_id}"
    description: "Get a snapshot"
    roles: [DonorReportingOfficer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ValuationSnapshot
    side_effects: []

  - method: GET
    path: "/medicine-relief/valuation-snapshots"
    description: "List snapshots (paginated, filterable)"
    roles: [DonorReportingOfficer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["donor_id?", "snapshot_period?", "method?", "limit?", "offset?"]
    output: ValuationSnapshot[]
