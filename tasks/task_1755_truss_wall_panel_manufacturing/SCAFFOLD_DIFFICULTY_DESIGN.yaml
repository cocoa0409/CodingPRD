            - "Job.${job}.credit_issued_cents == 10661"

  - rule_id: transitive_cascade
    instances:
      - name: change_order_apply_cascade
        grounds:
          - state_machines.DesignChangeOrder.APPROVED_to_APPLIED
          - state_machines.ComponentDesign.SEALED_to_SUPERSEDED
          - state_machines.CutList.RELEASED_to_RECONCILING
          - state_machines.ProductionBatch.STAGED_to_CANCELLED
          - state_machines.Bundle.PACKED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-6 chain where each hop is CAUSED by the previous hop: apply supersedes
          the design (1); the supersede moves its cut list to RECONCILING because one
          line is CUT (2); the list's batch is CANCELLED (4) after reservation states
          shift (3); the batch's PACKED bundle is SUPERSEDED (5); the bundle's load
          reopens to PLANNED and job posture goes BLOCKED (6) — a fan-out where apply
          directly touched all six entities would not reproduce the RECONCILING-vs-
          SUPERSEDED split keyed on the CUT-line condition.
        test_recipe:
          setup:
            - "Mega-chain through change-order approval: two designs sealed and released, both batches STAGED, load1 STAGED with bundles b1/b2, revision WP-01 r2 sealed, change order co1 (supersedes WP-01 r1 -> r2) IMPACT_ASSESSED with impact_lines_scrapped == 1 (cl2's single line is CUT) and APPROVED"
          setup_api_calls:
