        distinguishing_aspect: |
          Palletization is WarehouseOperator's exclusive operation and the role check outranks everything
          downstream: with the lot fully aged (clock 2026-08-04, aged_until_at 2026-08-04T00:00:00Z) the
          BatchHouseTech call is still 403 and pallet_count stays 0, while the WarehouseOperator call
          computes 1667 EURO pallets.
