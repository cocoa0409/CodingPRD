              payload: { student_id: "${s15}", start_utc: "2026-05-01T10:10:00Z", end_utc: "2026-05-01T10:40:00Z", meeting_type: "CHECK_IN" }
              as: Counselor
              as_user_id: "${c15}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_OVERLAP"

      - name: contract_coverage_closed_adjacency_allowed
        grounds:
          - validations[priority=10.5]
          - calculations.contract_coverage_overlap_check
          - entities.EngagementContract.fields.coverage_start_utc
          - errors[ERR_CONTRACT_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          CLOSED + NO-buffer + ADJACENCY-allowed geometry on a DIFFERENT resource (EngagementContract
          coverage timeline): a first contract covering 2026-04-01..2026-12-31 plus a second covering
          2026-12-31..2027-06-30 share exactly one endpoint instant and are ADJACENT, so the second create
          SUCCEEDS (201) — proving distinct interval semantics from the buffered appointment rule.
        test_recipe:
          setup:
            - "s16 of c16 with a DRAFT contract covering 2026-04-01T00:00Z..2026-12-31T00:00Z (non-VOID)"
          setup_api_calls:
