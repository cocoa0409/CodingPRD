              captures: { err_map: $.data.error_id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Auditor Engagement", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: Auditor
              as_user_id: "aud-1"
