              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-1818", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_a: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-09T07:00:00Z", scheduled_end: "2026-06-09T15:00:00Z" }
              as: FacilityScheduler
