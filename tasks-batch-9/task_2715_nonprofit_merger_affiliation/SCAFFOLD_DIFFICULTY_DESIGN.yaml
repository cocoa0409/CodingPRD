      - name: exclusivity_cooling_off_window_boundary_for_a_different_counterparty
        grounds:
          - validations.priority_41_ERR_EXCLUSIVITY_COOLING_OFF
          - state_machines.LetterOfIntent.ISSUED_to_WITHDRAWN
          - entities.LetterOfIntent.fields.exclusivity_end_date
        distinguishing_aspect: |
          Releasing an exclusivity window does not free the party immediately: a
          DIFFERENT counterparty must wait strictly more than
          EXCLUSIVITY_COOLING_OFF_DAYS = 30 days past the released window's
          exclusivity_end_date of 2026-09-29. A start of 2026-10-29 is exactly on the
          30th day and must be refused; 2026-10-30 is the first legal day and must be
          accepted, producing a window that ends 2026-11-28. The temporal reservation
          therefore outlives the entity that created it, which an implementation that
          only inspects ACTIVE windows misses entirely.
