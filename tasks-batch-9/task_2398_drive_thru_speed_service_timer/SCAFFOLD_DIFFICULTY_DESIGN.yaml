              payload: { abort_reason: "Team member pulled to the front counter mid-deployment" }
              as: Operator
              as_user_id: "${r_id}"
          assert:
            - "Before the abort: ${committed_active} == 30, ${available_active} == 90, ${oot_active} == 1, and 120 == 30 + 90"
            - "OrderTakerDeployment.${d1_id}.deployment_state == ABORTED and abort_reason == \"Team member pulled to the front counter mid-deployment\""
            - "OrderTakerDeployment.${d1_id}.labor_minutes_charged == 0 — an aborted deployment is never charged, not even for the 12 minutes it was live"
            - "OrderTakerDeployment.${d1_id}.released_at is null"
            - "Restaurant.${r_id}.labor_minutes_committed == 0 and Restaurant.${r_id}.labor_minutes_available == 120"
            - "INVARIANT restored exactly: 120 == 0 + 120 (labor_minutes_budget == committed + available), identical to the pre-activation state"
            - "StaffMember.${s1_id}.staff_state == AVAILABLE and StaffMember.${s1_id}.deployed_minutes_today == 0 (abort credits no worked minutes)"
            - "Restaurant.${r_id}.deployed_oot_count == 0 and Restaurant.${r_id}.required_oot_count == 0 and Restaurant.${r_id}.service_posture == OPEN"

      - name: remake_cost_ledger_reversed_on_waive
        grounds:
          - state_machines.AccuracyIncident.LOGGED_to_WAIVED
          - entities.Restaurant.fields.remake_cost_accrued_cents
          - entities.Restaurant.fields.open_remake_count
          - calculations.loop_adjusted_total
          - calculations.oot_requirement
        distinguishing_aspect: |
          A different conserved quantity: the store's REMAKE COST ledger in cents together with the
          penalty seconds folded into adjusted_total_seconds. Waiving must reverse both at once —
          remake_cost_accrued_cents back to 0 AND adjusted_total_seconds back to the raw
          total_seconds — and drop the accuracy bump out of required_oot_count.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant; two StaffMembers; one ACTIVE LUNCH DaypartProfile (25/95/40/75)."
            - "One TimerLoop: arrive 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z, window-arrive 11:02:00Z. A WRONG_ITEM AccuracyIncident is logged at the window (severity MAJOR, penalty_seconds 45, remake_cost_cents 750), then the car departs at 11:04:10Z."
            - "Before the waive: total_seconds 250, adjusted_total_seconds 295, accuracy_state REMAKE_OPEN, Restaurant.remake_cost_accrued_cents 750, open_remake_count 1, cars_per_hour_effective 6.0, volume_tier TIER_2, required_oot_count 2 (min_oot_count 1 + accuracy bump 1), service_posture SURGE."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Brookhaven Accuracy Ledger", store_number: "S-2398-W", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Yusuf Adler", oot_certified: true, window_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Mira Cortez", oot_certified: false, window_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:20Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:01:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/order-complete"
              payload: { order_items_count: 4 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:02:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/window-arrive"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/accuracy-incidents"
              payload: { timer_loop_id: "${l1_id}", logged_by_staff_id: "${sl_id}", incident_type: "WRONG_ITEM" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { inc_id: $.data.id, inc_penalty: $.data.penalty_seconds, inc_cost: $.data.remake_cost_cents }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:10Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { adj_before: $.data.adjusted_total_seconds, total_before: $.data.total_seconds }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { cost_before: $.data.remake_cost_accrued_cents, remakes_before: $.data.open_remake_count, oot_before: $.data.required_oot_count }
          trigger:
            - call: "POST /drive-thru/accuracy-incidents/${inc_id}/waive"
              payload: { waiver_reason: "Guest confirmed the item was correct; the complaint was logged against the wrong car" }
              as: AccuracyAuditor
              as_user_id: "auditor-1"
          assert:
            - "Before the waive: ${inc_penalty} == 45, ${inc_cost} == 750, ${total_before} == 250, ${adj_before} == 295, ${cost_before} == 750, ${remakes_before} == 1, ${oot_before} == 2"
            - "AccuracyIncident.${inc_id}.incident_state == WAIVED and AccuracyIncident.${inc_id}.settlement_state == REVERSED"
            - "AccuracyIncident.${inc_id}.penalty_seconds == 45 and remake_cost_cents == 750 — the stored amounts are NOT zeroed, only their ledger effects are reversed"
            - "TimerLoop.${l1_id}.accuracy_state == WAIVED and TimerLoop.${l1_id}.timing_state == CLOSED"
            - "INVARIANT restored exactly: TimerLoop.${l1_id}.adjusted_total_seconds == 250 == TimerLoop.${l1_id}.total_seconds (the 45 penalty seconds left again)"
            - "INVARIANT restored exactly: Restaurant.${r_id}.remake_cost_accrued_cents == 0 (750 accrued, 750 reversed, no residue)"
            - "Restaurant.${r_id}.open_remake_count == 0, so required_oot_count == 1 (TIER_2 min_oot_count 1, accuracy bump gone) and service_posture == SURGE (1 > deployed_oot_count 0)"
            - "Restaurant.${r_id}.cars_closed_trailing == 1 and volume_tier == TIER_2 (the waive does not un-serve the car)"

      - name: merge_slot_capacity_conserved_on_award_then_abandon
        grounds:
          - state_machines.MergeSlot.COMMITTED_to_FORFEITED
          - state_machines.TimerLoop.AT_WINDOW_to_ABANDONED
          - entities.Restaurant.fields.merge_slots_capacity
          - entities.Restaurant.fields.merge_slots_free
          - calculations.restaurant_rollup_recompute
        distinguishing_aspect: |
          A third conserved quantity: merge-lane CAPACITY, where merge_slots_capacity must always
          equal occupied slots plus merge_slots_free. An abandon at the window forfeits the
          COMMITTED slot and returns the capacity without ever counting the car as served, so
          cars_closed_trailing stays 0 and total_seconds stays null.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one DUAL_PARALLEL Restaurant with merge_slots_capacity 2 and labor_minutes_budget 300; one StaffMember; one ACTIVE LUNCH DaypartProfile."
            - "One TimerLoop on LANE_A: create 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z, merge-award (MergeSlot RESERVED, merge_slots_free 1), commit (slot COMMITTED, timing_state MERGED), window-arrive 11:02:00Z."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Lilburn Dual Parallel", store_number: "S-2398-X", lane_config: "DUAL_PARALLEL", merge_slots_capacity: 2, labor_minutes_budget: 300 }
              as: ProgramAdmin
              captures: { r_id: $.data.id, cap: $.data.merge_slots_capacity, free_initial: $.data.merge_slots_free }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Zoe Hartline", oot_certified: true, window_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "LANE_A" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:20Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:01:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/order-complete"
              payload: { order_items_count: 3 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/restaurants/${r_id}/merge-award"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { slot_id: $.data.id, slot_seq: $.data.sequence_index }
            - call: "POST /drive-thru/merge-slots/${slot_id}/commit"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { free_committed: $.data.merge_slots_free }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:02:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/window-arrive"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:10Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /drive-thru/timer-loops/${l1_id}/abandon"
              payload: { abandon_reason: "Guest drove off from the window without collecting the order" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
          assert:
            - "Before the abandon: ${cap} == 2, ${free_initial} == 2, ${slot_seq} == 1, ${free_committed} == 1 (RESERVED and COMMITTED both occupy the slot)"
            - "TimerLoop.${l1_id}.timing_state == ABANDONED and abandon_reason == \"Guest drove off from the window without collecting the order\""
            - "MergeSlot.${slot_id}.slot_state == FORFEITED (not RELEASED — the slot was surrendered, not completed)"
            - "INVARIANT restored exactly: Restaurant.${r_id}.merge_slots_free == 2, so merge_slots_capacity 2 == 0 occupied + 2 free"
            - "TimerLoop.${l1_id}.total_seconds is null and TimerLoop.${l1_id}.adjusted_total_seconds is null and TimerLoop.${l1_id}.depart_at is null"
            - "Restaurant.${r_id}.cars_closed_trailing == 0 and cars_per_hour_observed == 0.0 and cars_per_hour_effective == 0.0 and volume_tier == TIER_1 — an abandoned car is never a served car"
            - "Restaurant.${r_id}.required_oot_count == 0 and Restaurant.${r_id}.service_posture == OPEN (the store returns to the state it held before the award)"
            - "TimerLoop.${l1_id}.accuracy_state == PENDING (abandoning never verifies accuracy)"
