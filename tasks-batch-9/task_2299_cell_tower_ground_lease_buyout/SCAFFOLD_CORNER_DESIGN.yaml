        grounds:
          - state_machines.RofrNotice.transitions.SERVED_to_EXPIRED
          - validations[priority=18]
          - errors[ERR_INVALID_ROFR_STATE]
          - calculations.rofr_window_bounds
        distinguishing_aspect: |
          The window bound is enforced on the response rather than only on the read: at
          2026-08-31T00:00:00Z the notice has lazily lapsed to EXPIRED because window_end is exclusive, so
          the tower company's WAIVE arrives too late and is rejected with 409 ERR_INVALID_ROFR_STATE — yet
          the deal's rofr_state is WAIVED_BY_LAPSE, which is join-satisfying, so the deal is CLEAR_TO_CLOSE
          anyway.
