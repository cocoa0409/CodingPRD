      - name: label_services_month_count_scales_the_monthly_fee_per_period
        claim_type: correct_result
        grounds:
          - calculations.deal_net_receipts.formula
          - entities.DistributionDeal.services_fee_pct
          - entities.DistributionDeal.services_monthly_fee_cents
          - endpoints[POST /dsp-revenue-reports/{id}/submit]
        distinguishing_aspect: |
          The LABEL_SERVICES branch is the only one with an additive term, and that term is
          months_in_period = (y2-y1)*12 + (m2-m1) + 1 — a CALENDAR-MONTH span, inclusive of both
          ends, not a day count and not a difference. Three reports with the same 500000-cent gross
          but spans of three months, six days inside one month and two months give distributor
          shares 125000, 75000 and 100000. A day-based or exclusive month count gets every one of
          the three wrong; a fee-only implementation returns 50000 three times.
