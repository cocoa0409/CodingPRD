            - "Complaint.${c1_id}.status == WITHDRAWN, classification == CLASS_II, allegation_count == 0, purged_at == null and narrative unchanged after all five calls"

      - name: a_replayed_sweep_neither_creates_nor_promotes_a_second_alert
        claim_type: Idempotency
        grounds:
          - endpoints["POST /eis-runs"]
          - state_machines.EarlyInterventionAlert.transitions.OPEN_to_PLAN_REQUIRED
          - calculations.eis_composite_score
        distinguishing_aspect: |
          The sweep is declared to create an alert only for an officer who has no alert already
          open, and to promote an OPEN alert only when the recomputed level reaches ALERT. Both
          guards make the sweep idempotent over unchanged event data: the first run refreshes the
          WATCH-level alert that event ingest had created, promotes it and reports
          alerts_promoted 1, and an immediate replay must report 0 created and 0 promoted while
          leaving the same alert row, the same score and the same open_alert_count in place. Only
          run_sequence moves.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Sergeant Doyle and Officer Bell (assignment_type PATROL)."
            - "Officer Bell has three USE_OF_FORCE LEVEL_3 events at 2026-07-01, 2026-07-10 and 2026-07-20, so eis_score is 55.00 and eis_alert_level is ALERT, and event ingest already opened one WATCH alert at the second event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-041", full_name: "Officer Bell", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 8000000, demographic_code: "DG_A", hire_date: "2020-01-06T00:00:00Z" }
              as: SystemAdmin
              captures: { bell_id: $.data.id }
            - call: "POST /officers/${bell_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T12:00:00Z", source_reference: "UOF-2026-0101" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${bell_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-10T12:00:00Z", source_reference: "UOF-2026-0102" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${bell_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-20T12:00:00Z", source_reference: "UOF-2026-0103" }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /eis-runs"
              payload: { officer_id: "${bell_id}" }
              as: SystemAdmin
              captures: { run1_created: $.data.alerts_created, run1_promoted: $.data.alerts_promoted, run1_seq: $.data.run_sequence }
            - call: "POST /eis-runs"
              payload: { officer_id: "${bell_id}" }
              as: SystemAdmin
              captures: { run2_created: $.data.alerts_created, run2_promoted: $.data.alerts_promoted, run2_seq: $.data.run_sequence }
            - call: "GET /eis-alerts"
              payload: { officer_id: "${bell_id}" }
              as: SystemAdmin
          assert:
            - "after the three ingests: Officer.${bell_id}.eis_score == 55.00 (weighted_total 18.0 times 1.0 times 2.5 plus one 10-point FORCE_COUNT bonus) and eis_alert_level == ALERT and open_alert_count == 1"
            - "run 1: ${run1_created} == 0 (event ingest had already opened the alert), ${run1_promoted} == 1, ${run1_seq} == 1, evaluated_officer_count == 1, checkins_missed == 0, disclosures_expired == 0"
            - "run 2: ${run2_created} == 0 and ${run2_promoted} == 0 and ${run2_seq} == 2"
            - "the list call returns total_count == 1: the replay created no second alert row"
            - "data[0].status == PLAN_REQUIRED, data[0].composite_score == 55.00, data[0].alert_level == ALERT, data[0].score_variant == ROLLING_12M, data[0].breached_indicators == [FORCE_COUNT], data[0].plan_count == 0"
            - "data[0].review_due_at == 2026-08-31T00:00:00Z (the promotion instant plus ALERT_REVIEW_DAYS 30)"
            - "Officer.${bell_id}.open_alert_count == 1 after both runs"

      - name: reclassification_self_loop_stops_at_the_declared_maximum
        claim_type: cyclic
        grounds:
          - state_machines.Complaint.transitions.CLASSIFIED_to_CLASSIFIED
          - calculations.complaint_classification_and_routing
          - validations[priority=12]
        distinguishing_aspect: |
          The CLASSIFIED self-loop is the scaffold's bounded cycle: MAX_RECLASSIFICATIONS is 2,
          and the guard also rejects an override that repeats the stored classification. So the
          loop must turn exactly twice, re-routing the file each turn (CLASS_I goes to internal
          affairs, CLASS_III with a PUBLIC channel goes back to the intake-enabled subject unit),
          and the third turn must fail with ERR_MAX_RECLASSIFICATIONS_REACHED (409) with the
          counter frozen at 2.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit with intake_enabled true and Commander Reyes exist."
            - "A PUBLIC-channel NEGLECT_OF_DUTY complaint is CLASSIFIED as CLASS_II with reclassification_count 0, assigned_unit_id equal to the patrol unit and no Investigation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "Officer ignored a report request.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Dana Ruiz", complainant_contact: "dana@example.org", complainant_demographic_code: "DG_B" }
              as: Complainant
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c1_id}/classify"
              payload: { screening_outcome: "ACCEPT", classification_override: "CLASS_II" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { err_same: "$.data.error_id" }
            - call: "POST /complaints/${c1_id}/classify"
              payload: { screening_outcome: "ACCEPT", classification_override: "CLASS_I" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${c1_id}/classify"
              payload: { screening_outcome: "ACCEPT", classification_override: "CLASS_III" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${c1_id}/classify"
              payload: { screening_outcome: "ACCEPT", classification_override: "CLASS_I" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { err_max: "$.data.error_id" }
          assert:
            - "call 1: HTTP 409 with ${err_same} == ERR_MAX_RECLASSIFICATIONS_REACHED (the override repeats the stored CLASS_II); Complaint.${c1_id}.reclassification_count stays 0"
            - "call 2: HTTP 200; Complaint.${c1_id}.classification == CLASS_I, priority == 1, reclassification_count == 1, assigned_unit_id == ${ia_unit_id} (Step 5(a) re-routes the file to internal affairs)"
            - "call 3: HTTP 200; Complaint.${c1_id}.classification == CLASS_III, priority == 3, reclassification_count == 2, assigned_unit_id == ${patrol_unit_id} (Step 5(b), because screening_required stays false on a PUBLIC channel)"
            - "call 3: Complaint.${c1_id}.screening_required == false and status == CLASSIFIED (the loop returns to the same state)"
            - "call 4: HTTP 409 with ${err_max} == ERR_MAX_RECLASSIFICATIONS_REACHED; classification stays CLASS_III and reclassification_count stays 2"
            - "GET /investigations with complaint_id ${c1_id} returns total_count == 0, so no cascade link fired on either accepted turn"
            - "Complaint.${c1_id}.statute_expires_at == 2027-07-15T20:00:00Z throughout (the filing statute is anchored to incident_datetime, not to the classification)"

      - name: withdrawing_a_complaint_cancels_only_the_non_terminal_children
        claim_type: Cascade down
        grounds:
          - state_machines.Complaint.transitions.UNDER_INVESTIGATION_to_WITHDRAWN
          - state_machines.Investigation.transitions.IN_PROGRESS_to_VOIDED
          - state_machines.InterviewSession.transitions.SCHEDULED_to_CANCELLED
          - state_machines.Allegation.transitions.PENDING_to_WITHDRAWN
        distinguishing_aspect: |
          The withdrawal cascade has three links and each one is state-selective: the
          Investigation is voided, only SCHEDULED or POSTPONED sessions are cancelled while an
          already HELD session keeps its terminal state and its held_at, and only PENDING
          allegations are moved to WITHDRAWN. The caseload ledger is decremented exactly once
          even though two sessions hang off the voided investigation.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-05T09:00:00Z after being advanced from 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes and Investigator Ahn; Patrol North holds Officer Vance; one hearing room has concurrent_capacity 2."
            - "A PUBLIC-channel CLASS_II complaint with one PENDING allegation against Officer Vance is UNDER_INVESTIGATION; its Investigation is IN_PROGRESS with Ahn assigned and interview_held_count 1; session A is HELD and session B is SCHEDULED for 2026-08-05T11:01:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
