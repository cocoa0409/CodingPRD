            - "Participant.${p_id}.termination_date is still \"2026-02-10\" with termination_reason VOLUNTARY"
            - "the second certify returns HTTP 409 with error_id ERR_CYCLE_INVALID_STATE"
            - "PerformanceCycle.${c_id}.status == CERTIFIED with actual_value 100 and payout_multiplier_bps == 10000, not recomputed to 0"

      - name: error_report_invalid_state_filing_twice
