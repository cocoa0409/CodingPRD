          trigger:
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${site_status} == INVENTORIED"
            - "${score} == null"
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_SITE_STATE"
            - "AgencySite.${site_a}.status == INVENTORIED"

