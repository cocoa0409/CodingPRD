# =============================================================================
# PRD-Bench scaffold: Release of Information & Medical Record Request Fulfillment
# task_2704 — seed tables §1.0–§1.7
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2704. Release of Information & Medical Record Request Fulfillment (release of
  information vendor): request intake by requester type with authorization
  validity checks, patient right-of-access versus third-party request fee and
  timeline rules, sensitive record segmentation for behavioral health and other
  protected categories, record compilation across systems including legacy
  archives, delivery format and secure transmission preferences with patient
  direction, invoice generation under per-page and state fee caps, turnaround
  time monitoring and statutory penalty exposure, denial, redaction and
  amendment request handling

domain_name: release-of-information
api_prefix: /roi

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Thirteen peer entities joined by explicit foreign keys. Every business URL is
  # `/roi/<collection>` or `/roi/<collection>/{id}[/<action>]`; no entity is
  # nested inside another entity's path, and no parent id ever appears in a
  # child's URL. Ownership is expressed by FK fields in request bodies only.

  state_machine_shape: cyclic
  # Request re-enters INTAKE_REVIEW from AUTH_DEFECT_PENDING and re-enters
  # COMPILATION from DENIED; RecordSegment re-enters APPLIED from REWORK and
  # re-enters SEGREGATED_PENDING_REVIEW from AUTHORIZED_INCLUDE; Delivery
  # re-enters FAILED from FAILED on a further attempt. Request additionally
  # carries two independent state dimensions (fulfillment_status ×
  # billing_status) and RecordSegment carries three (retrieval_status ×
  # sensitivity_status × redaction_status).

  relationship_patterns:
    - one_to_many          # Request 1—N RecordSegment / Invoice / Delivery / DenialDecision
    - self_referential     # Authorization.supersedes_authorization_id, Request.predecessor_request_id
    - polymorphic          # Requester.requester_type drives which fee/timeline regime applies
    - cross_aggregate      # Invoice reads Facility + StateFeeRule + RecordSegment ledger

  role_model: segregation_of_duties
  # The staff member who took intake on a Request may not be the reviewer who
  # releases it; the analyst who applied a redaction may not be the reviewer who
  # approves it; the privacy officer who issued a denial may not be the officer
  # who reviews it.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:

  - name: StateFeeRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; unique across StateFeeRule", constraints: "^[A-Z]{2}$; unique" }
      - { name: base_retrieval_fee_cents, type: integer, source: input, description: "Flat clerical search/retrieval fee, billable only in the THIRD_PARTY_RETAIL invoice variant", constraints: ">= 0" }
      - { name: tier1_page_limit, type: integer, source: input, description: "Pages 1..tier1_page_limit inclusive are priced at tier1_per_page_millicents", constraints: ">= 1" }
      - { name: tier1_per_page_millicents, type: integer, source: input, description: "Retail per-page rate for tier 1, in millicents (1000 millicents = 1 cent)", constraints: ">= 0" }
      - { name: tier2_per_page_millicents, type: integer, source: input, description: "Retail per-page rate for every page above tier1_page_limit, in millicents", constraints: ">= 0" }
      - { name: patient_access_per_page_millicents, type: integer, source: input, description: "Flat cost-based per-page rate used by the PATIENT_ACCESS_COST_BASED variant (no tiers)", constraints: ">= 0" }
      - { name: certification_fee_cents, type: integer, source: input, description: "Certification-of-records fee, billable only in the THIRD_PARTY_RETAIL variant", constraints: ">= 0" }
      - { name: media_fee_cents, type: integer, source: input, description: "Physical media fee, billable only when delivery_format == CD_ROM", constraints: ">= 0" }
      - { name: postage_per_delivery_cents, type: integer, source: input, description: "Postage, billable only when delivery_format IN {PAPER_MAIL, CD_ROM}", constraints: ">= 0" }
      - { name: electronic_delivery_total_cap_cents, type: integer, source: input, description: "Statutory total cap when delivery_format IN {SECURE_PORTAL, DIRECT_MESSAGE, UNENCRYPTED_EMAIL}", constraints: ">= 0" }
      - { name: total_fee_cap_cents, type: integer, source: input, description: "Statutory total cap for any delivery format", constraints: ">= 0" }
      - { name: patient_access_deadline_days, type: integer, source: input, description: "Whole days allowed for access_basis == PATIENT_RIGHT_OF_ACCESS", constraints: ">= 1" }
      - { name: third_party_deadline_days, type: integer, source: input, description: "Whole days allowed for access_basis == THIRD_PARTY_AUTHORIZATION", constraints: ">= 1" }
      - { name: extension_days, type: integer, source: input, description: "Whole days added by the single permitted statutory extension", constraints: ">= 0" }
      - { name: penalty_per_day_cents, type: integer, source: input, description: "Statutory penalty accrued per late day", constraints: ">= 0" }
      - { name: penalty_cap_cents, type: integer, source: input, description: "Ceiling on accrued penalty for one Request", constraints: ">= 0" }
      - { name: fee_forfeiture_on_late, type: boolean, source: input, description: "When true, a late PATIENT_RIGHT_OF_ACCESS request forfeits copying fees up to the accrued penalty" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Covered-entity facility name", constraints: "1..120 chars" }
      - { name: state_fee_rule_id, type: string, source: input, description: "FK -> StateFeeRule.id; the fee/timeline regime every Request of this facility is priced under" }
      - { name: legacy_archive_enabled, type: boolean, source: input, description: "Whether LEGACY_ARCHIVE RecordSegments may be created for this facility", default: false }
      - { name: legacy_retrieval_surcharge_cents, type: integer, source: input, description: "Once-per-invoice legacy archive surcharge, THIRD_PARTY_RETAIL variant only", default: 0, constraints: ">= 0" }
      - { name: legacy_gateway_job_minutes, type: integer, source: input, description: "Duration of one legacy archive retrieval job on this facility's gateway", default: 30, constraints: ">= 1" }
      - { name: legacy_gateway_buffer_minutes, type: integer, source: input, description: "Buffer added to BOTH ends of a legacy job window before collision testing", default: 10, constraints: ">= 0" }
      - { name: sensitive_categories_requiring_specific_authorization, type: array, source: input, description: "RecordSegment.category values that must be segregated for reviewer decision", default: ["BEHAVIORAL_HEALTH", "SUD_PART2", "HIV", "GENETIC", "REPRODUCTIVE_HEALTH", "MINOR_CONFIDENTIAL", "PSYCHOTHERAPY_NOTES"] }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED blocks new Request intake", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED" }
      - { name: receivable_cents, type: integer, source: computed, description: "Sum of (amount_due_cents - paid_cents) over this facility's Invoices whose status == ISSUED", default: 0 }
      - { name: collected_cents, type: integer, source: computed, description: "Sum of paid_cents over this facility's Invoices whose status == PAID", default: 0 }
      - { name: written_off_cents, type: integer, source: computed, description: "Sum of amount_due_cents over this facility's Invoices whose status == WAIVED", default: 0 }
      - { name: penalty_exposure_cents, type: integer, source: computed, description: "Sum of penalty_exposure_cents over every Request whose facility_id == this Facility.id", default: 0 }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the facility that maintains this patient's designated record set" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique per (facility_id, mrn)", constraints: "1..32 chars; unique with facility_id" }
      - { name: full_name, type: string, source: input, description: "Patient legal name", constraints: "1..120 chars" }
      - { name: date_of_birth, type: string, source: input, description: "Date of birth, YYYY-MM-DD", constraints: "ISO date" }
      - { name: is_minor, type: boolean, source: input, description: "Drives MINOR_CONFIDENTIAL segregation expectations", default: false }
      - { name: deceased, type: boolean, source: input, description: "Deceased patients admit personal-representative access only", default: false }

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - { name: requester_type, type: enum, source: input, description: "PATIENT | PERSONAL_REPRESENTATIVE | ATTORNEY | INSURER | EMPLOYER | RESEARCHER | GOVERNMENT_AGENCY | OTHER_PROVIDER", constraints: "one of the eight listed values" }
      - { name: organization_name, type: string, source: input, description: "Requesting organization; omitted for requester_type == PATIENT", default: null }
      - { name: contact_email, type: string, source: input, description: "Contact address for correspondence", constraints: "contains '@'" }
      - { name: credential_number, type: string, source: input, description: "Bar number, NPI, or agency identifier", default: null }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; REQUIRED when requester_type == PATIENT, otherwise null", default: null }
      - { name: signature_on_file, type: boolean, source: input, description: "Whether a wet or verified electronic signature specimen is on file", default: false }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient whose records the authorization covers" }
      - { name: requester_id, type: string, source: input, description: "FK -> Requester.id; the party the authorization names as recipient" }
      - { name: supersedes_authorization_id, type: string, source: input, description: "FK -> Authorization.id; when present, that Authorization is driven to SUPERSEDED and is exempt from the overlap check", default: null }
      - { name: signed_at, type: datetime, source: input, description: "Instant the authorization was signed; start of the coverage interval", constraints: "ISO 8601 UTC" }
      - { name: expires_at, type: datetime, source: input, description: "Instant the authorization lapses; exclusive end of the coverage interval", constraints: "ISO 8601 UTC; > signed_at" }
      - { name: scope_categories, type: array, source: input, description: "RecordSegment.category values the authorization permits at all", constraints: "non-empty for a VALID authorization" }
      - { name: sensitive_categories_authorized, type: array, source: input, description: "Subset of scope_categories the requester may receive despite segregation", default: [] }
      - { name: part2_redisclosure_prohibition_ack, type: boolean, source: input, description: "Requester acknowledged the 42 CFR Part 2 redisclosure prohibition; gate for SUD_PART2 release", default: false }
      - { name: designated_recipient_endpoint, type: string, source: input, description: "The only transmission endpoint a THIRD_PARTY_AUTHORIZATION delivery may target", constraints: "1..200 chars" }
      - { name: signature_verified, type: boolean, source: input, description: "Intake verified the signature against the specimen on file" }
      - { name: status, type: enum, source: system, description: "VALID | DEFECTIVE | REVOKED | EXPIRED | SUPERSEDED", constraints: "VALID | DEFECTIVE | REVOKED | EXPIRED | SUPERSEDED" }
      - { name: defect_reasons, type: array, source: system, description: "Reason codes recorded when status is set to DEFECTIVE: SIGNATURE_UNVERIFIED | SCOPE_EMPTY", default: [] }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock instant of revocation; null unless status == REVOKED", default: null }

  - name: Request
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; supplies the fee regime and the legacy gateway" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject of the requested record set" }
      - { name: requester_id, type: string, source: input, description: "FK -> Requester.id; the acting party for ownership checks" }
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; REQUIRED when access_basis == THIRD_PARTY_AUTHORIZATION, null for PATIENT_RIGHT_OF_ACCESS", default: null }
      - { name: predecessor_request_id, type: string, source: input, description: "FK -> Request.id; the earlier Request this one re-files after a denial or withdrawal", default: null }
      - { name: access_basis, type: enum, source: input, description: "PATIENT_RIGHT_OF_ACCESS | THIRD_PARTY_AUTHORIZATION — selects both the fee variant and the deadline field", constraints: "PATIENT_RIGHT_OF_ACCESS | THIRD_PARTY_AUTHORIZATION" }
      - { name: requested_categories, type: array, source: input, description: "RecordSegment.category values the requester asked for", constraints: "non-empty" }
      - { name: date_range_start, type: string, source: input, description: "Inclusive first service date requested, YYYY-MM-DD" }
      - { name: date_range_end, type: string, source: input, description: "Inclusive last service date requested, YYYY-MM-DD", constraints: ">= date_range_start" }
      - { name: delivery_format, type: enum, source: input, description: "PAPER_MAIL | CD_ROM | SECURE_PORTAL | DIRECT_MESSAGE | UNENCRYPTED_EMAIL | FAX — drives media, postage and which fee cap applies", constraints: "one of the six listed values" }
      - { name: certification_requested, type: boolean, source: input, description: "Requester asked for a certification of records", default: false }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at creation; the statutory clock anchor" }
      - { name: intake_user_id, type: string, source: system, description: "X-User-ID of the IntakeSpecialist who created the Request; the release reviewer must differ from it" }
      - { name: release_reviewer_user_id, type: string, source: system, description: "X-User-ID of the ReleaseReviewer who released the Request; cleared when the Request leaves RELEASE_READY backwards", default: null }
      - { name: fulfillment_status, type: enum, source: system, description: "INTAKE_REVIEW | AUTH_DEFECT_PENDING | COMPILATION | SENSITIVE_REVIEW | REDACTION | RELEASE_READY | RELEASED | DENIED | CLOSED | CANCELLED", default: "INTAKE_REVIEW" }
      - { name: billing_status, type: enum, source: system, description: "PENDING_INVOICE | INVOICED | PAID | WAIVED | NOT_BILLABLE — evolves independently of fulfillment_status", default: "PENDING_INVOICE" }
      - { name: extension_applied, type: boolean, source: system, description: "The single statutory extension has been noticed", default: false }
      - { name: extension_noticed_at, type: datetime, source: system, description: "Logical clock when the extension notice was recorded", default: null }
      - { name: defect_opened_at, type: datetime, source: system, description: "Logical clock when the current AUTH_DEFECT_PENDING interval opened; null when not tolling", default: null }
      - { name: tolled_seconds, type: integer, source: computed, description: "Whole seconds spent in closed AUTH_DEFECT_PENDING intervals, capped at MAX_TOLL_SECONDS", default: 0 }
      - { name: statutory_due_at, type: datetime, source: computed, description: "Deadline produced by the statutory_due_at calculation" }
      - { name: page_count_total, type: integer, source: computed, description: "GROSS_RETRIEVED variant of request_page_ledger", default: 0 }
      - { name: billable_page_count, type: integer, source: computed, description: "NET_RELEASED variant of request_page_ledger; the only page count an Invoice may price", default: 0 }
      - { name: withheld_page_count, type: integer, source: computed, description: "Pages on RETRIEVED segments whose sensitivity_status == WITHHELD", default: 0 }
      - { name: redacted_page_count_total, type: integer, source: computed, description: "Approved redacted pages on releasable RETRIEVED segments", default: 0 }
      - { name: penalty_exposure_cents, type: integer, source: computed, description: "STATUTORY_STRICT variant of turnaround_penalty", default: 0 }
      - { name: safe_harbor_penalty_cents, type: integer, source: computed, description: "CONTRACTUAL_SAFE_HARBOR variant of turnaround_penalty", default: 0 }
      - { name: amendment_notice_required, type: boolean, source: computed, description: "An accepted AmendmentRequest touched a segment already released under this Request", default: false }
      - { name: released_at, type: datetime, source: system, description: "Logical clock at the RELEASE_READY -> RELEASED transition; cleared on a DENIED re-open", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock at entry into CLOSED or CANCELLED", default: null }

  - name: RecordSegment
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> Request.id; the request this compiled chunk belongs to" }
      - { name: source_system, type: enum, source: input, description: "EHR_CURRENT | LEGACY_ARCHIVE | IMAGING_PACS | SCANNED_PAPER", constraints: "one of the four listed values" }
      - { name: category, type: enum, source: input, description: "GENERAL_MEDICAL | BEHAVIORAL_HEALTH | SUD_PART2 | HIV | GENETIC | REPRODUCTIVE_HEALTH | MINOR_CONFIDENTIAL | PSYCHOTHERAPY_NOTES", constraints: "one of the eight listed values" }
      - { name: legacy_job_start_at, type: datetime, source: input, description: "Start of the legacy gateway job window; REQUIRED when source_system == LEGACY_ARCHIVE, must be null otherwise", default: null }
      - { name: legacy_job_end_at, type: datetime, source: computed, description: "legacy_job_start_at + Facility.legacy_gateway_job_minutes; null when legacy_job_start_at is null", default: null }
      - { name: page_count, type: integer, source: input, description: "Pages retrieved; supplied with disposition == RETRIEVED, 0 otherwise", default: 0, constraints: ">= 0" }
      - { name: retrieval_status, type: enum, source: system, description: "PENDING | RETRIEVED | UNAVAILABLE | WITHDRAWN", default: "PENDING" }
      - { name: sensitivity_status, type: enum, source: system, description: "UNCLASSIFIED | NOT_SENSITIVE | SEGREGATED_PENDING_REVIEW | AUTHORIZED_INCLUDE | WITHHELD", default: "UNCLASSIFIED" }
      - { name: redaction_status, type: enum, source: system, description: "NOT_REQUIRED | OPEN | APPLIED | APPROVED | REWORK", default: "NOT_REQUIRED" }
      - { name: redacted_page_count, type: integer, source: input, description: "Pages blacked out; counted against the page ledger only while redaction_status == APPROVED", default: 0, constraints: "<= page_count" }
      - { name: redaction_applied_by_user_id, type: string, source: system, description: "X-User-ID of the RecordsAnalyst who last applied redactions; the approver must differ from it", default: null }
      - { name: redaction_approved_by_user_id, type: string, source: system, description: "X-User-ID of the ReleaseReviewer who approved the redaction", default: null }
      - { name: retrieved_at, type: datetime, source: system, description: "Logical clock at the PENDING -> RETRIEVED transition", default: null }
      - { name: unavailable_reason, type: string, source: input, description: "Free-text reason recorded with disposition == UNAVAILABLE", default: null }
      - { name: amended, type: boolean, source: computed, description: "An AmendmentRequest against this segment reached ACCEPTED", default: false }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> Request.id; the request being priced" }
      - { name: variant, type: enum, source: computed, description: "PATIENT_ACCESS_COST_BASED when Request.access_basis == PATIENT_RIGHT_OF_ACCESS, else THIRD_PARTY_RETAIL" }
      - { name: billable_page_count_snapshot, type: integer, source: computed, description: "Request.billable_page_count frozen at Invoice creation" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of amount_cents over this Invoice's InvoiceLines excluding CAP_ADJUSTMENT and LATE_FEE_FORFEITURE" }
      - { name: applicable_cap_cents, type: integer, source: computed, description: "The cap selected by invoice_cap_application for this delivery format" }
      - { name: cap_adjustment_cents, type: integer, source: computed, description: "Non-positive amount that pulls subtotal_cents down to applicable_cap_cents; 0 when uncapped", default: 0 }
      - { name: gross_total_cents, type: integer, source: computed, description: "subtotal_cents + cap_adjustment_cents" }
      - { name: penalty_snapshot_cents, type: integer, source: computed, description: "Request.penalty_exposure_cents recomputed at Invoice creation, before forfeiture", default: 0 }
      - { name: forfeiture_cents, type: integer, source: computed, description: "Copying fees surrendered because the request ran late; 0 unless the forfeiture predicate holds", default: 0 }
      - { name: amount_due_cents, type: integer, source: computed, description: "gross_total_cents - forfeiture_cents; the only amount a payment may settle" }
      - { name: paid_cents, type: integer, source: system, description: "Amount received; 0 unless status == PAID", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | WAIVED | VOIDED", default: "DRAFT" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at the DRAFT -> ISSUED transition", default: null }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock at entry into PAID, WAIVED or VOIDED", default: null }
      - { name: void_reason, type: string, source: system, description: "SUPERSEDED_BY_REPRICE | AUTHORIZATION_REVOKED | BILLING_CLERK_VOID", default: null }
      - { name: waiver_reason, type: string, source: input, description: "Reason recorded with settlement action WAIVE", default: null }

  - name: InvoiceLine
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; the invoice this line belongs to" }
      - { name: sequence, type: integer, source: computed, description: "1-based position over the EMITTED lines only, assigned 1..N contiguously in the pinned line order; omitted line types leave no gap. The only ordering key for line output" }
      - { name: line_type, type: enum, source: computed, description: "BASE_RETRIEVAL | PER_PAGE_TIER1 | PER_PAGE_TIER2 | PER_PAGE_FLAT | LEGACY_RETRIEVAL | CERTIFICATION | MEDIA | POSTAGE | CAP_ADJUSTMENT | LATE_FEE_FORFEITURE" }
      - { name: quantity, type: integer, source: computed, description: "Pages for per-page lines, otherwise 1" }
      - { name: unit_millicents, type: integer, source: computed, description: "Signed unit rate in millicents; negative for CAP_ADJUSTMENT and LATE_FEE_FORFEITURE" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_millicents / 1000) evaluated on this line alone" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> Request.id; the request whose released set is being transmitted" }
      - { name: delivery_format, type: enum, source: input, description: "PAPER_MAIL | CD_ROM | SECURE_PORTAL | DIRECT_MESSAGE | UNENCRYPTED_EMAIL | FAX", constraints: "must equal Request.delivery_format" }
      - { name: recipient_endpoint, type: string, source: input, description: "Postal address, portal handle, direct address, email or fax number", constraints: "1..200 chars" }
      - { name: encryption, type: enum, source: input, description: "TLS | AES256_ZIP | NONE", constraints: "TLS | AES256_ZIP | NONE" }
      - { name: patient_direction_ack, type: boolean, source: input, description: "Patient directed transmission to an unsecured endpoint and accepted the risk", default: false }
      - { name: status, type: enum, source: system, description: "PENDING | SENT | FAILED | CONFIRMED | RETURNED", default: "PENDING" }
      - { name: attempt_count, type: integer, source: computed, description: "Transmission attempts recorded; capped at MAX_DELIVERY_ATTEMPTS", default: 0 }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock of the most recent attempt that produced SENT", default: null }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock at entry into CONFIRMED or RETURNED", default: null }
      - { name: failure_reason, type: string, source: input, description: "Reason recorded with transmission outcome FAILED", default: null }

  - name: DenialDecision
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> Request.id; the request being denied in whole or in part" }
      - { name: denial_type, type: enum, source: input, description: "FULL | PARTIAL", constraints: "FULL | PARTIAL" }
      - { name: grounds, type: enum, source: input, description: "NO_VALID_AUTHORIZATION | PSYCHOTHERAPY_NOTES_EXCLUDED | RECORD_NOT_MAINTAINED | HARM_REVIEW_LICENSED_PROFESSIONAL | INMATE_SAFETY | RESEARCH_IN_PROGRESS", constraints: "one of the six listed values" }
      - { name: rationale, type: string, source: input, description: "Narrative supplied to the requester", constraints: "1..500 chars" }
      - { name: reviewable, type: boolean, source: computed, description: "True exactly when grounds IN {HARM_REVIEW_LICENSED_PROFESSIONAL, INMATE_SAFETY}" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the PrivacyOfficer who issued the denial; the reviewer must differ from it" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the PrivacyOfficer conducting the review", default: null }
      - { name: status, type: enum, source: system, description: "ISSUED | UNDER_REVIEW | UPHELD | OVERTURNED", default: "ISSUED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: review_due_at, type: datetime, source: computed, description: "issued_at + REVIEW_WINDOW_DAYS whole days" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at entry into UPHELD or OVERTURNED", default: null }

  - name: AmendmentRequest
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> Request.id; the fulfilled request that disclosed the disputed pages" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; must equal Request.patient_id" }
      - { name: record_segment_id, type: string, source: input, description: "FK -> RecordSegment.id; the segment whose content is disputed" }
      - { name: requested_change, type: string, source: input, description: "Amendment the patient asks for", constraints: "1..500 chars" }
      - { name: additional_information, type: string, source: input, description: "Supplement supplied on resubmission after INFO_REQUESTED", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | ACCEPTED | DENIED", default: "SUBMITTED" }
      - { name: submission_count, type: integer, source: computed, description: "Number of times the amendment entered SUBMITTED", default: 1 }
      - { name: decision_due_at, type: datetime, source: computed, description: "created_at + AMENDMENT_WINDOW_DAYS whole days" }
      - { name: rationale, type: string, source: input, description: "Reviewer narrative recorded with ACCEPT, DENY or REQUEST_INFO", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at entry into ACCEPTED or DENIED", default: null }

  - name: ComplianceEvent
    parent: null
    common_fields: false
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> Request.id; the request the event is recorded against" }
      - { name: event_type, type: enum, source: computed, description: "STATUTORY_DEADLINE_BREACHED | PENALTY_ACCRUED | DENIAL_ISSUED | DENIAL_OVERTURNED | AUTHORIZATION_REVOKED | AUTHORIZATION_EXPIRED | SENSITIVE_WITHHOLD | AMENDMENT_NOTICE_REQUIRED | FEE_CAP_APPLIED | DELIVERY_FAILED" }
      - { name: days_late, type: integer, source: computed, description: "days_late_strict at the moment the event was appended", default: 0 }
      - { name: penalty_delta_cents, type: integer, source: computed, description: "Change in Request.penalty_exposure_cents caused by the triggering action", default: 0 }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor whose call produced the event; 'system' for sweep-generated events" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock when the event was appended" }
      - { name: detail, type: string, source: computed, description: "Short machine-readable detail string, e.g. 'segment_category=HIV'" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Request (1/2)
  - entity: Request
    state_field: fulfillment_status
    states: [INTAKE_REVIEW, AUTH_DEFECT_PENDING, COMPILATION, SENSITIVE_REVIEW, REDACTION, RELEASE_READY, RELEASED, DENIED, CLOSED, CANCELLED]
    initial_state: INTAKE_REVIEW
    terminal_states: [CLOSED, CANCELLED]
    notes: >
      Cyclic on two arcs: AUTH_DEFECT_PENDING -> INTAKE_REVIEW (authorization cured)
      and DENIED -> COMPILATION (denial overturned). Runs as a dimension independent
      of billing_status; neither dimension gates its own transitions on the other
      except at RELEASE_READY -> RELEASED, which reads billing_status.
    transitions:
      - from: INTAKE_REVIEW
        to: COMPILATION
        trigger: "POST /roi/requests/{id}/intake-decision  {decision: ACCEPT}"
        preconditions:
          - "Facility.status == ACTIVE"
          - "when access_basis == THIRD_PARTY_AUTHORIZATION: Authorization.status == VALID and Authorization.expires_at > current logical clock"
          - "when access_basis == PATIENT_RIGHT_OF_ACCESS: authorization_id is null"
        side_effects:
          - "recompute statutory_due_at"
          - "recompute penalty_exposure_cents and safe_harbor_penalty_cents"
          - "increments Request.version by 1"
      - from: INTAKE_REVIEW
        to: AUTH_DEFECT_PENDING
        trigger: "POST /roi/requests/{id}/intake-decision  {decision: DEFECT}"
        preconditions:
          - "access_basis == THIRD_PARTY_AUTHORIZATION"
          - "Authorization.status == DEFECTIVE"
        side_effects:
          - "set defect_opened_at = current logical clock (opens a tolling interval)"
          - "increments Request.version by 1"
      - from: AUTH_DEFECT_PENDING
        to: INTAKE_REVIEW
        trigger: "POST /roi/authorizations/{id}/cure   (cascade onto every Request whose authorization_id == this authorization)"
        preconditions:
          - "Authorization.status == DEFECTIVE"
        side_effects:
          - "close the tolling interval: tolled_seconds += min(clock - defect_opened_at, remaining allowance up to MAX_TOLL_SECONDS); defect_opened_at = null"
          - "recompute statutory_due_at using the new tolled_seconds"
          - "recompute penalty_exposure_cents and safe_harbor_penalty_cents"
          - "increments Request.version by 1"
      - from: COMPILATION
        to: SENSITIVE_REVIEW
        trigger: "POST /roi/requests/{id}/complete-compilation"
        preconditions:
          - "at least one RecordSegment with request_id == this Request"
          - "no RecordSegment of this Request has retrieval_status == PENDING"
        side_effects:
          - "recompute page_count_total, billable_page_count, withheld_page_count, redacted_page_count_total"
          - "recompute penalty_exposure_cents and safe_harbor_penalty_cents"
          - "increments Request.version by 1"
      - from: SENSITIVE_REVIEW
        to: REDACTION
        trigger: "POST /roi/requests/{id}/sensitive-review"
        preconditions:
          - "every RecordSegment of this Request with sensitivity_status == SEGREGATED_PENDING_REVIEW appears exactly once in segment_decisions"
          - "at least one accepted decision carries redaction_required == true"
        side_effects:
          - "apply each decision to its RecordSegment.sensitivity_status (AUTHORIZED_INCLUDE or WITHHELD)"
          - "set redaction_status = OPEN on every segment whose decision carried redaction_required == true"
          - "append ComplianceEvent SENSITIVE_WITHHOLD for each decision that produced WITHHELD"
          - "recompute the four page ledger fields"
          - "increments Request.version by 1"
      - from: SENSITIVE_REVIEW
        to: RELEASE_READY
        trigger: "POST /roi/requests/{id}/sensitive-review"
        preconditions:
          - "every RecordSegment of this Request with sensitivity_status == SEGREGATED_PENDING_REVIEW appears exactly once in segment_decisions"
          - "no accepted decision carries redaction_required == true"
        side_effects:
          - "apply each decision to its RecordSegment.sensitivity_status"
          - "recompute the four page ledger fields"
          - "evaluate the billing_status entry rule for RELEASE_READY"
          - "increments Request.version by 1"
      - from: REDACTION
        to: RELEASE_READY
        trigger: "POST /roi/record-segments/{id}/redaction-decision  {decision: APPROVE}   (bubble up)"
        preconditions:
          - "after applying this decision, no RecordSegment of the Request has redaction_status IN {OPEN, APPLIED, REWORK}"
        side_effects:
          - "recompute redacted_page_count_total and billable_page_count"
          - "evaluate the billing_status entry rule for RELEASE_READY"
          - "increments Request.version by 1"
      - from: RELEASE_READY
        to: RELEASED
        trigger: "POST /roi/requests/{id}/release"
        preconditions:
          - "billing_status IN {PAID, WAIVED, NOT_BILLABLE}"
          - "X-User-ID != intake_user_id  (segregation of duties)"
          - "no RecordSegment of this Request has redaction_status IN {OPEN, APPLIED, REWORK}"
        side_effects:
          - "set released_at = current logical clock and release_reviewer_user_id = X-User-ID"
          - "freeze penalty_exposure_cents and safe_harbor_penalty_cents at effective_completion_at = released_at"
          - "append ComplianceEvent STATUTORY_DEADLINE_BREACHED when released_at > statutory_due_at"
          - "recompute Facility.penalty_exposure_cents"
          - "increments Request.version by 1"
      - from: RELEASED
        to: CLOSED
        trigger: "POST /roi/deliveries/{id}/confirm  {outcome: CONFIRMED}"
        preconditions:
          - "Delivery.status == SENT and Delivery.request_id == this Request.id"
        side_effects:
          - "set closed_at = current logical clock"
          - "recompute Facility.penalty_exposure_cents"
          - "increments Request.version by 1"
      - from: [INTAKE_REVIEW, AUTH_DEFECT_PENDING, COMPILATION, SENSITIVE_REVIEW, REDACTION]
        to: DENIED
        trigger: "POST /roi/denials"
        preconditions:
          - "no DenialDecision of this Request has status IN {ISSUED, UNDER_REVIEW}"
        side_effects:
          - "append ComplianceEvent DENIAL_ISSUED"
          - "keep the statutory clock running: penalty_exposure_cents continues to accrue against the current logical clock"
          - "increments Request.version by 1"
      - from: DENIED
        to: COMPILATION
        trigger: "POST /roi/denials/{id}/review  {action: OVERTURN}"
        preconditions:
          - "DenialDecision.status == UNDER_REVIEW"
          - "X-User-ID != DenialDecision.issued_by_user_id"
        side_effects:
          - "revert every RecordSegment of the Request whose sensitivity_status == WITHHELD back to SEGREGATED_PENDING_REVIEW"
          - "recompute the four page ledger fields"
          - "recompute penalty_exposure_cents and safe_harbor_penalty_cents at the current logical clock"
          - "recompute Facility.penalty_exposure_cents"
          - "append ComplianceEvent DENIAL_OVERTURNED and, when the penalty changed, PENALTY_ACCRUED"
          - "increments Request.version by 1"
      - from: DENIED
        to: CLOSED
        trigger: "POST /roi/denials/{id}/review  {action: UPHOLD}"
        preconditions:
          - "DenialDecision.status IN {ISSUED, UNDER_REVIEW}; when status == ISSUED the denial must have reviewable == false"
          - "X-User-ID != DenialDecision.issued_by_user_id"
        side_effects:
          - "set closed_at = current logical clock and freeze penalty_exposure_cents at effective_completion_at = closed_at"
          - "set billing_status = NOT_BILLABLE when billing_status == PENDING_INVOICE"
          - "recompute Facility.penalty_exposure_cents"
          - "increments Request.version by 1"
      - from: [INTAKE_REVIEW, AUTH_DEFECT_PENDING, COMPILATION, SENSITIVE_REVIEW, REDACTION, RELEASE_READY]
        to: CANCELLED
        trigger: "POST /roi/requests/{id}/withdraw"
        preconditions:
          - "X-User-ID == Request.requester_id  (requester acts on its own request)"
        side_effects:
          - "set closed_at = current logical clock and freeze penalty_exposure_cents at effective_completion_at = closed_at"
          - "void every Invoice of this Request whose status IN {DRAFT, ISSUED} with void_reason = BILLING_CLERK_VOID and set billing_status = NOT_BILLABLE"
          - "recompute Facility.receivable_cents and Facility.penalty_exposure_cents"
          - "increments Request.version by 1"
      - from: [INTAKE_REVIEW, COMPILATION, SENSITIVE_REVIEW, REDACTION, RELEASE_READY]
        to: AUTH_DEFECT_PENDING
        trigger: "POST /roi/authorizations/{id}/revoke   (cascade onto every Request whose authorization_id == this authorization)"
        preconditions:
          - "Request.fulfillment_status NOT IN {RELEASED, DENIED, CLOSED, CANCELLED}"
        side_effects:
          - "set defect_opened_at = current logical clock"
          - "clear release_reviewer_user_id"
          - "revert every RecordSegment whose sensitivity_status IN {AUTHORIZED_INCLUDE, WITHHELD} to SEGREGATED_PENDING_REVIEW and every redaction_status IN {OPEN, APPLIED, APPROVED, REWORK} to OPEN"
          - "recompute the four page ledger fields"
          - "void every Invoice of this Request whose status IN {DRAFT, ISSUED} with void_reason = AUTHORIZATION_REVOKED, set billing_status = PENDING_INVOICE"
          - "recompute Facility.receivable_cents"
          - "append ComplianceEvent AUTHORIZATION_REVOKED"
          - "increments Request.version by 1"

  # ---------------------------------------------------------------- Request (2/2)
  - entity: Request
    state_field: billing_status
    states: [PENDING_INVOICE, INVOICED, PAID, WAIVED, NOT_BILLABLE]
    initial_state: PENDING_INVOICE
    terminal_states: [PAID, NOT_BILLABLE]
    notes: >
      Second dimension of Request. Cyclic on INVOICED -> PENDING_INVOICE, which is
      what a voided invoice produces. WAIVED is not terminal because a waived
      invoice may still be voided, returning the request to PENDING_INVOICE.
    transitions:
      - from: PENDING_INVOICE
        to: NOT_BILLABLE
        trigger: "entry into fulfillment_status RELEASE_READY (from POST /roi/requests/{id}/sensitive-review or POST /roi/record-segments/{id}/redaction-decision)"
        preconditions:
          - "the prospective subtotal for the request's invoice variant is exactly 0 cents"
        side_effects:
          - "no Invoice may be created afterwards: POST /roi/invoices returns ERR_NOTHING_TO_INVOICE"
      - from: PENDING_INVOICE
        to: INVOICED
        trigger: "POST /roi/invoices/{id}/issue"
        preconditions:
          - "Invoice.status == DRAFT and Invoice.amount_due_cents > 0"
        side_effects:
          - "Facility.receivable_cents += Invoice.amount_due_cents"
          - "increments Request.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /roi/invoices/{id}/settlement  {action: PAY}"
        preconditions:
          - "Invoice.status == ISSUED and amount_cents == Invoice.amount_due_cents"
        side_effects:
          - "Facility.receivable_cents -= Invoice.amount_due_cents; Facility.collected_cents += Invoice.amount_due_cents"
          - "increments Request.version by 1"
      - from: INVOICED
        to: WAIVED
        trigger: "POST /roi/invoices/{id}/settlement  {action: WAIVE}"
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "Facility.receivable_cents -= Invoice.amount_due_cents; Facility.written_off_cents += Invoice.amount_due_cents"
          - "increments Request.version by 1"
      - from: [INVOICED, WAIVED]
        to: PENDING_INVOICE
        trigger: "POST /roi/invoices/{id}/settlement  {action: VOID}"
        preconditions:
          - "Invoice.status IN {ISSUED, WAIVED}"
        side_effects:
          - "reverse the ledger postings this invoice made: Facility.receivable_cents and Facility.written_off_cents return to their pre-issue values"
          - "increments Request.version by 1"

  # ---------------------------------------------------------------- Authorization
  - entity: Authorization
    state_field: status
    states: [VALID, DEFECTIVE, REVOKED, EXPIRED, SUPERSEDED]
    initial_state: VALID
    terminal_states: [REVOKED, EXPIRED, SUPERSEDED]
    notes: >
      The initial state is computed at creation: VALID when signature_verified is
      true, scope_categories is non-empty and expires_at is strictly after the
      current logical clock; DEFECTIVE otherwise, with defect_reasons populated.
    transitions:
      - from: DEFECTIVE
        to: VALID
        trigger: "POST /roi/authorizations/{id}/cure"
        preconditions:
          - "the cure payload satisfies every condition that produced the defect"
        side_effects:
          - "clear defect_reasons"
          - "cascade every Request whose authorization_id == this authorization from AUTH_DEFECT_PENDING to INTAKE_REVIEW"
          - "increments Authorization.version by 1"
      - from: [VALID, DEFECTIVE]
        to: REVOKED
        trigger: "POST /roi/authorizations/{id}/revoke"
        preconditions:
          - "status IN {VALID, DEFECTIVE}"
        side_effects:
          - "set revoked_at = current logical clock"
          - "cascade every non-terminal Request whose authorization_id == this authorization to AUTH_DEFECT_PENDING with its full side-effect list"
          - "increments Authorization.version by 1"
      - from: VALID
        to: EXPIRED
        trigger: "POST /roi/compliance-sweeps"
        preconditions:
          - "expires_at <= current logical clock"
        side_effects:
          - "append ComplianceEvent AUTHORIZATION_EXPIRED against every Request whose authorization_id == this authorization and whose fulfillment_status is non-terminal"
          - "increments Authorization.version by 1"
      - from: [VALID, DEFECTIVE]
        to: SUPERSEDED
        trigger: "POST /roi/authorizations   (new authorization carrying supersedes_authorization_id == this id)"
        preconditions:
          - "the new authorization's patient_id equals this authorization's patient_id"
        side_effects:
          - "increments Authorization.version by 1"

  # ---------------------------------------------------------------- RecordSegment (1/3)
  - entity: RecordSegment
    state_field: retrieval_status
    states: [PENDING, RETRIEVED, UNAVAILABLE, WITHDRAWN]
    initial_state: PENDING
    terminal_states: [UNAVAILABLE, WITHDRAWN]
    transitions:
      - from: PENDING
        to: RETRIEVED
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: RETRIEVED, page_count: N}"
        preconditions:
          - "Request.fulfillment_status == COMPILATION"
          - "page_count is supplied and >= 0"
        side_effects:
          - "set retrieved_at = current logical clock"
          - "set sensitivity_status by the segment_sensitivity_classification calculation"
          - "recompute the parent Request's four page ledger fields"
          - "increments RecordSegment.version by 1"
      - from: PENDING
        to: UNAVAILABLE
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: UNAVAILABLE, unavailable_reason: '...'}"
        preconditions:
          - "Request.fulfillment_status == COMPILATION"
        side_effects:
          - "set page_count = 0 and leave sensitivity_status at UNCLASSIFIED"
          - "increments RecordSegment.version by 1"
      - from: [PENDING, RETRIEVED]
        to: WITHDRAWN
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: WITHDRAWN}"
        preconditions:
          - "Request.fulfillment_status IN {COMPILATION, SENSITIVE_REVIEW, REDACTION}"
        side_effects:
          - "reset sensitivity_status = UNCLASSIFIED, redaction_status = NOT_REQUIRED, redacted_page_count = 0"
          - "recompute the parent Request's four page ledger fields (this segment leaves every aggregate)"
          - "re-evaluate the REDACTION -> RELEASE_READY bubble-up for the parent Request"
          - "increments RecordSegment.version by 1"

  # ---------------------------------------------------------------- RecordSegment (2/3)
  - entity: RecordSegment
    state_field: sensitivity_status
    states: [UNCLASSIFIED, NOT_SENSITIVE, SEGREGATED_PENDING_REVIEW, AUTHORIZED_INCLUDE, WITHHELD]
    initial_state: UNCLASSIFIED
    terminal_states: []
    notes: >
      Cyclic: AUTHORIZED_INCLUDE and WITHHELD both return to
      SEGREGATED_PENDING_REVIEW when the governing authorization is revoked or a
      denial is overturned, so the reviewer must decide the same segment again.
    transitions:
      - from: UNCLASSIFIED
        to: NOT_SENSITIVE
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: RETRIEVED}"
        preconditions:
          - "category NOT IN Facility.sensitive_categories_requiring_specific_authorization"
        side_effects: ["no further review is required for this segment"]
      - from: UNCLASSIFIED
        to: SEGREGATED_PENDING_REVIEW
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: RETRIEVED}"
        preconditions:
          - "category IN Facility.sensitive_categories_requiring_specific_authorization"
        side_effects: ["the segment blocks POST /roi/requests/{id}/sensitive-review until a decision names it"]
      - from: SEGREGATED_PENDING_REVIEW
        to: AUTHORIZED_INCLUDE
        trigger: "POST /roi/requests/{id}/sensitive-review  (decision INCLUDE for this segment)"
        preconditions:
          - "category != PSYCHOTHERAPY_NOTES"
          - "when Request.access_basis == THIRD_PARTY_AUTHORIZATION: category IN Authorization.sensitive_categories_authorized"
          - "when category == SUD_PART2: Authorization.part2_redisclosure_prohibition_ack == true, or Request.access_basis == PATIENT_RIGHT_OF_ACCESS"
        side_effects: ["set redaction_status = OPEN when the decision carried redaction_required == true"]
      - from: SEGREGATED_PENDING_REVIEW
        to: WITHHELD
        trigger: "POST /roi/requests/{id}/sensitive-review  (decision WITHHOLD for this segment)"
        preconditions: []
        side_effects:
          - "append ComplianceEvent SENSITIVE_WITHHOLD"
          - "the segment's page_count moves from billable_page_count to withheld_page_count"
      - from: [AUTHORIZED_INCLUDE, WITHHELD]
        to: SEGREGATED_PENDING_REVIEW
        trigger: "POST /roi/authorizations/{id}/revoke  or  POST /roi/denials/{id}/review {action: OVERTURN}   (cascade)"
        preconditions:
          - "the parent Request is not in a terminal fulfillment_status"
        side_effects:
          - "reset redaction_status from {APPLIED, APPROVED, REWORK} back to OPEN and clear redaction_approved_by_user_id"
      - from: [NOT_SENSITIVE, SEGREGATED_PENDING_REVIEW, AUTHORIZED_INCLUDE, WITHHELD]
        to: UNCLASSIFIED
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: WITHDRAWN}"
        preconditions: []
        side_effects: ["the segment leaves every page aggregate of the parent Request"]

  # ---------------------------------------------------------------- RecordSegment (3/3)
  - entity: RecordSegment
    state_field: redaction_status
    states: [NOT_REQUIRED, OPEN, APPLIED, APPROVED, REWORK]
    initial_state: NOT_REQUIRED
    terminal_states: []
    notes: "Cyclic: REWORK -> APPLIED, so a rejected redaction can be reworked without bound."
    transitions:
      - from: NOT_REQUIRED
        to: OPEN
        trigger: "POST /roi/requests/{id}/sensitive-review  (decision INCLUDE with redaction_required true)"
        preconditions: ["sensitivity_status becomes AUTHORIZED_INCLUDE in the same call"]
        side_effects: ["the parent Request enters REDACTION"]
      - from: [OPEN, REWORK]
        to: APPLIED
        trigger: "POST /roi/record-segments/{id}/redaction  {redacted_page_count: N}"
        preconditions:
          - "Request.fulfillment_status == REDACTION"
          - "0 <= redacted_page_count <= page_count"
        side_effects:
          - "set redaction_applied_by_user_id = X-User-ID"
          - "redacted pages are NOT yet counted against the page ledger"
          - "increments RecordSegment.version by 1"
      - from: APPLIED
        to: APPROVED
        trigger: "POST /roi/record-segments/{id}/redaction-decision  {decision: APPROVE}"
        preconditions:
          - "X-User-ID != redaction_applied_by_user_id  (segregation of duties)"
        side_effects:
          - "set redaction_approved_by_user_id = X-User-ID"
          - "redacted_page_count now counts in the parent Request's redacted_page_count_total and is subtracted from billable_page_count"
          - "bubble up: the parent Request leaves REDACTION for RELEASE_READY when no segment remains in {OPEN, APPLIED, REWORK}"
          - "increments RecordSegment.version by 1"
      - from: APPLIED
        to: REWORK
        trigger: "POST /roi/record-segments/{id}/redaction-decision  {decision: REWORK}"
        preconditions:
          - "X-User-ID != redaction_applied_by_user_id  (segregation of duties)"
        side_effects:
          - "clear redaction_applied_by_user_id so the same analyst may apply again"
          - "the parent Request stays in REDACTION"
          - "increments RecordSegment.version by 1"
      - from: [OPEN, APPLIED, APPROVED, REWORK]
        to: NOT_REQUIRED
        trigger: "POST /roi/record-segments/{id}/disposition  {disposition: WITHDRAWN}"
        preconditions: []
        side_effects: ["set redacted_page_count = 0"]

  # ---------------------------------------------------------------- Invoice
  - entity: Invoice
    state_field: status
    states: [DRAFT, ISSUED, PAID, WAIVED, VOIDED]
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /roi/invoices/{id}/issue"
        preconditions:
          - "amount_due_cents > 0"
          - "Request.fulfillment_status IN {RELEASE_READY, RELEASED}"
        side_effects:
          - "set issued_at = current logical clock"
          - "Request.billing_status = INVOICED; Facility.receivable_cents += amount_due_cents"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /roi/invoices/{id}/settlement  {action: PAY, amount_cents: N}"
        preconditions:
          - "amount_cents == amount_due_cents"
        side_effects:
          - "set paid_cents = amount_cents, settled_at = current logical clock"
          - "Request.billing_status = PAID; Facility.receivable_cents -= amount_due_cents; Facility.collected_cents += amount_due_cents"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /roi/invoices/{id}/settlement  {action: WAIVE, reason: '...'}"
        preconditions: []
        side_effects:
          - "set waiver_reason and settled_at"
          - "Request.billing_status = WAIVED; Facility.receivable_cents -= amount_due_cents; Facility.written_off_cents += amount_due_cents"
          - "increments Invoice.version by 1"
      - from: [DRAFT, ISSUED, WAIVED]
        to: VOIDED
        trigger: "POST /roi/invoices/{id}/settlement  {action: VOID, reason: '...'}  or  a cascade that sets void_reason"
        preconditions: []
        side_effects:
          - "set void_reason and settled_at"
          - "Request.billing_status = PENDING_INVOICE"
          - "reverse whichever ledger postings this invoice made, leaving receivable_cents + collected_cents + written_off_cents at its pre-issue value"
          - "increments Invoice.version by 1"

  # ---------------------------------------------------------------- Delivery
  - entity: Delivery
    state_field: status
    states: [PENDING, SENT, FAILED, CONFIRMED, RETURNED]
    initial_state: PENDING
    terminal_states: [CONFIRMED, RETURNED]
    notes: "Cyclic on FAILED -> FAILED: attempts repeat until attempt_count reaches MAX_DELIVERY_ATTEMPTS."
    transitions:
      - from: [PENDING, FAILED]
        to: SENT
        trigger: "POST /roi/deliveries/{id}/transmission  {outcome: SENT}"
        preconditions:
          - "attempt_count < MAX_DELIVERY_ATTEMPTS"
          - "Request.fulfillment_status == RELEASED"
        side_effects:
          - "attempt_count += 1; set sent_at = current logical clock"
          - "increments Delivery.version by 1"
      - from: [PENDING, FAILED]
        to: FAILED
        trigger: "POST /roi/deliveries/{id}/transmission  {outcome: FAILED, failure_reason: '...'}"
        preconditions:
          - "attempt_count < MAX_DELIVERY_ATTEMPTS"
        side_effects:
          - "attempt_count += 1; append ComplianceEvent DELIVERY_FAILED"
          - "increments Delivery.version by 1"
      - from: SENT
        to: CONFIRMED
        trigger: "POST /roi/deliveries/{id}/confirm  {outcome: CONFIRMED}"
        preconditions: []
        side_effects:
          - "set confirmed_at = current logical clock"
          - "cascade the parent Request from RELEASED to CLOSED"
          - "increments Delivery.version by 1"
      - from: SENT
        to: RETURNED
        trigger: "POST /roi/deliveries/{id}/confirm  {outcome: RETURNED}"
        preconditions: []
        side_effects:
          - "set confirmed_at = current logical clock; the parent Request stays in RELEASED"
          - "append ComplianceEvent DELIVERY_FAILED"
          - "increments Delivery.version by 1"

  # ---------------------------------------------------------------- DenialDecision
  - entity: DenialDecision
    state_field: status
    states: [ISSUED, UNDER_REVIEW, UPHELD, OVERTURNED]
    initial_state: ISSUED
    terminal_states: [UPHELD, OVERTURNED]
    notes: "Branching: UNDER_REVIEW forks to UPHELD or OVERTURNED, and the two forks drive the parent Request to different states."
    transitions:
      - from: ISSUED
        to: UNDER_REVIEW
        trigger: "POST /roi/denials/{id}/review  {action: START_REVIEW}"
        preconditions:
          - "reviewable == true"
          - "X-User-ID != issued_by_user_id  (segregation of duties)"
        side_effects:
          - "set reviewer_user_id = X-User-ID"
          - "increments DenialDecision.version by 1"
      - from: [ISSUED, UNDER_REVIEW]
        to: UPHELD
        trigger: "POST /roi/denials/{id}/review  {action: UPHOLD}"
        preconditions:
          - "when status == ISSUED: reviewable == false"
          - "X-User-ID != issued_by_user_id"
        side_effects:
          - "set decided_at = current logical clock"
          - "cascade the parent Request from DENIED to CLOSED"
          - "increments DenialDecision.version by 1"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /roi/denials/{id}/review  {action: OVERTURN}"
        preconditions:
          - "X-User-ID != issued_by_user_id"
        side_effects:
          - "set decided_at = current logical clock"
          - "cascade the parent Request from DENIED to COMPILATION with its full side-effect list"
          - "increments DenialDecision.version by 1"

  # ---------------------------------------------------------------- AmendmentRequest
  - entity: AmendmentRequest
    state_field: status
    states: [SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ACCEPTED, DENIED]
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DENIED]
    notes: "Cyclic on INFO_REQUESTED -> SUBMITTED, which increments submission_count and resets the review."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /roi/amendment-requests/{id}/decision  {decision: START_REVIEW}"
        preconditions: []
        side_effects: ["increments AmendmentRequest.version by 1"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /roi/amendment-requests/{id}/decision  {decision: REQUEST_INFO, rationale: '...'}"
        preconditions: []
        side_effects: ["increments AmendmentRequest.version by 1"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /roi/amendment-requests/{id}/resubmission"
        preconditions:
          - "X-User-ID == the Requester that owns the parent Request"
        side_effects:
          - "submission_count += 1; store additional_information"
          - "increments AmendmentRequest.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /roi/amendment-requests/{id}/decision  {decision: ACCEPT, rationale: '...'}"
        preconditions:
          - "the target RecordSegment has retrieval_status == RETRIEVED"
        side_effects:
          - "set decided_at; set RecordSegment.amended = true"
          - "set Request.amendment_notice_required = true when the parent Request has released_at != null"
          - "append ComplianceEvent AMENDMENT_NOTICE_REQUIRED"
          - "increments AmendmentRequest.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /roi/amendment-requests/{id}/decision  {decision: DENY, rationale: '...'}"
        preconditions: []
        side_effects:
          - "set decided_at"
          - "increments AmendmentRequest.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:

  - rule_id: invoice-create-reprices-request
    parent_entity: Request
    write_endpoint: "POST /roi/invoices"
    occ_field: expected_request_version
    error_id: ERR_STALE_REQUEST_VERSION
    http_code: 412
    justification: >
      Creating an Invoice for a Request that already carries a DRAFT invoice is a
      legitimate re-price: the older DRAFT is voided and superseded. Two clerks who
      each read the Request, then each post an invoice one after the other, both
      succeed under the natural rule, and the first clerk's priced line set is
      silently thrown away even though it was built from the page ledger the second
      clerk never saw. Pricing depends on billable_page_count and
      penalty_exposure_cents, both of which any segment disposition, redaction
      approval or denial overturn can move. The version guard makes the second
      write observe that the ledger it priced against has moved and reject.
    validation_order_position: "priority 8 — after ERR_REQUEST_NOT_FOUND (priority 7), before ERR_REQUEST_NOT_RELEASE_READY (priority 19)"

  - rule_id: authorization-create-supersedes-patient-coverage
    parent_entity: Patient
    write_endpoint: "POST /roi/authorizations"
    occ_field: expected_patient_version
    error_id: ERR_STALE_PATIENT_VERSION
    http_code: 412
    justification: >
      A new Authorization carrying supersedes_authorization_id retires the named
      predecessor and is exempt from the coverage-window overlap check, so two
      intake specialists who each read the Patient and then each post a superseding
      authorization one after the other both succeed: the second retires the first
      one's brand-new authorization, and the coverage window the first specialist
      believed it had installed no longer exists. Guarding on Patient.version makes
      the later write observe that the patient's authorization set changed after it
      was read and reject.
    validation_order_position: "priority 8 — after ERR_PATIENT_NOT_FOUND (priority 7), before ERR_AUTHORIZATION_WINDOW_OVERLAP (priority 30)"

# =============================================================================
# Table 1.3: Calculation Rules
# =============================================================================
calculations:

  - name: statutory_due_at
    entity: Request
    field: statutory_due_at
    algorithm_type: chronological
    description: >
      Composes four independent temporal terms in a pinned order. Reordering any
      two of them changes the answer, so the order is part of the contract.
    constants:
      SECONDS_PER_DAY: 86400
      MAX_TOLL_SECONDS: 864000        # 10 whole days
    formula: |
      # -- term 1: which statutory window applies (polymorphic on access_basis)
      deadline_days = (Request.access_basis == PATIENT_RIGHT_OF_ACCESS)
                        ? StateFeeRule.patient_access_deadline_days
                        : StateFeeRule.third_party_deadline_days

      # -- term 2: the anchor. A third-party authorization signed AFTER the request
      #    arrived moves the anchor forward; a patient right-of-access request has
      #    no authorization and always anchors on arrival.
      clock_start_at = (Request.access_basis == PATIENT_RIGHT_OF_ACCESS)
                        ? Request.received_at
                        : max(Request.received_at, Authorization.signed_at)

      base_due_at = clock_start_at + deadline_days * SECONDS_PER_DAY

      # -- term 3: tolling for authorization defects, capped BEFORE it is added
      toll_seconds = min(Request.tolled_seconds, MAX_TOLL_SECONDS)

      # -- term 4: the single statutory extension
      extension_seconds = Request.extension_applied
                            ? StateFeeRule.extension_days * SECONDS_PER_DAY
                            : 0

      statutory_due_at = base_due_at + toll_seconds + extension_seconds
    evaluation_order_is_load_bearing: |
      1. select deadline_days from access_basis
      2. select the anchor with max(received_at, signed_at)   <-- BEFORE adding days
      3. add deadline_days
      4. cap the toll, THEN add it                            <-- capping after the
         add, or adding the raw toll, produces a different instant
      5. add the extension last
      Adding the toll to the anchor before step 2's max, or applying MAX_TOLL_SECONDS
      to (toll + extension) rather than to the toll alone, both shift the deadline.
    recompute_triggers:
      - "Request creation"
      - "every fulfillment_status transition"
      - "POST /roi/authorizations/{id}/cure (tolled_seconds changed)"
      - "POST /roi/requests/{id}/extension"
    worked_example: |
      StateFeeRule(CA).third_party_deadline_days = 30, extension_days = 15
      received_at   = 2026-08-01T00:00:00Z
      signed_at     = 2026-08-07T12:00:00Z   (cured authorization signature date)
      tolled_seconds= 280800                 (2026-08-05T00:00:00Z .. 2026-08-08T06:00:00Z)
      clock_start_at = max(2026-08-01T00:00:00Z, 2026-08-07T12:00:00Z)
                     = 2026-08-07T12:00:00Z
      base_due_at    = 2026-08-07T12:00:00Z + 2592000s = 2026-09-06T12:00:00Z
      + toll 280800s                                   = 2026-09-09T18:00:00.000Z
      + extension 1296000s (when applied)              = 2026-09-24T18:00:00.000Z

  - name: request_page_ledger
    entity: Request
    field: "page_count_total, billable_page_count, withheld_page_count, redacted_page_count_total"
    algorithm_type: aggregation
    description: >
      Two variants over the same segment set. GROSS_RETRIEVED answers "how many
      pages did we pull"; NET_RELEASED answers "how many pages may we bill and
      disclose". Only NET_RELEASED may reach an Invoice.
    input_set: "RecordSegment where request_id == Request.id AND retrieval_status == RETRIEVED"
    variants:
      - variant: GROSS_RETRIEVED
        applies_when: "always maintained; reported as page_count_total"
        formula: "page_count_total = SUM(s.page_count) over the input set"
      - variant: NET_RELEASED
        applies_when: "always maintained; billable_page_count is the only page count an Invoice may price"
        formula: |
          releasable = { s in input_set : s.sensitivity_status IN {NOT_SENSITIVE, AUTHORIZED_INCLUDE} }
          billable_page_count = SUM over releasable of
              ( s.page_count - (s.redaction_status == APPROVED ? s.redacted_page_count : 0) )
          withheld_page_count = SUM over { s in input_set : s.sensitivity_status == WITHHELD } of s.page_count
          redacted_page_count_total = SUM over { s in releasable : s.redaction_status == APPROVED } of s.redacted_page_count
    notes: >
      Segments whose retrieval_status is PENDING, UNAVAILABLE or WITHDRAWN are in
      no aggregate. Redacted pages count only once the redaction is APPROVED, so an
      APPLIED-but-unapproved redaction leaves billable_page_count untouched.
    ordering: "aggregate segments in ascending created_at; no UUID or insertion identity participates"
    worked_example: |
      seg_a EHR_CURRENT/GENERAL_MEDICAL   page_count 40, NOT_SENSITIVE,       redaction NOT_REQUIRED
      seg_b EHR_CURRENT/BEHAVIORAL_HEALTH page_count 22, AUTHORIZED_INCLUDE,  redaction APPROVED, redacted 5
      GROSS_RETRIEVED page_count_total       = 40 + 22 = 62
      NET_RELEASED    billable_page_count    = 40 + (22 - 5) = 57
                      withheld_page_count    = 0
                      redacted_page_count_total = 5

  - name: invoice_line_build
    entity: Invoice
    field: "InvoiceLine rows, subtotal_cents"
    algorithm_type: tiered_pricing
    description: >
      Builds the priced line set in a pinned sequence, rounds EACH line
      independently, then sums. The retail variant is tiered on pages; the patient
      right-of-access variant is a single flat cost-based rate with no clerical or
      certification fee at all.
    constants:
      MILLICENTS_PER_CENT: 1000
      ROUNDING: "round_half_up, applied per line, never to the subtotal"
    input_set: "StateFeeRule of Request.facility_id's Facility; P = Request.billable_page_count at Invoice creation"
    variants:
      - variant: THIRD_PARTY_RETAIL
        applies_when: "Request.access_basis == THIRD_PARTY_AUTHORIZATION"
        formula: |
          sequence 1  BASE_RETRIEVAL   qty 1                              unit = base_retrieval_fee_cents * 1000
          sequence 2  PER_PAGE_TIER1   qty = min(P, tier1_page_limit)     unit = tier1_per_page_millicents     [omit when qty == 0]
          sequence 3  PER_PAGE_TIER2   qty = max(0, P - tier1_page_limit) unit = tier2_per_page_millicents     [omit when qty == 0]
          sequence 4  LEGACY_RETRIEVAL qty 1                              unit = Facility.legacy_retrieval_surcharge_cents * 1000
                        [emitted only when at least one RETRIEVED segment of the Request
                         has source_system == LEGACY_ARCHIVE and the surcharge > 0;
                         charged once per invoice regardless of how many legacy segments]
          sequence 5  CERTIFICATION    qty 1                              unit = certification_fee_cents * 1000  [only when Request.certification_requested]
          sequence 6  MEDIA            qty 1                              unit = media_fee_cents * 1000          [only when delivery_format == CD_ROM]
          sequence 7  POSTAGE          qty 1                              unit = postage_per_delivery_cents*1000 [only when delivery_format IN {PAPER_MAIL, CD_ROM}]
      - variant: PATIENT_ACCESS_COST_BASED
        applies_when: "Request.access_basis == PATIENT_RIGHT_OF_ACCESS"
        formula: |
          sequence 1  PER_PAGE_FLAT    qty = P   unit = patient_access_per_page_millicents  [omit when P == 0]
          sequence 2  MEDIA            qty 1     unit = media_fee_cents * 1000              [only when delivery_format == CD_ROM]
          sequence 3  POSTAGE          qty 1     unit = postage_per_delivery_cents * 1000   [only when delivery_format IN {PAPER_MAIL, CD_ROM}]
          # no BASE_RETRIEVAL, no CERTIFICATION, no LEGACY_RETRIEVAL, no tiers:
          # a patient exercising the right of access pays copying cost only.
    formula: |
      for each emitted line:
          amount_cents = round_half_up(quantity * unit_millicents / MILLICENTS_PER_CENT)
      subtotal_cents = SUM of amount_cents over the emitted lines
                       (CAP_ADJUSTMENT and LATE_FEE_FORFEITURE are NOT part of the subtotal)
    evaluation_order_is_load_bearing: |
      Rounding happens per line and never to the sum. With CA rates and P = 62:
        per-line : 1500 + round(25*27500/1000)=688 + round(37*12500/1000)=463 + 1000 + 850 = 4501
        sum-then-round would give 1500 + 687.5 + 462.5 + 1000 + 850 = 4500.
      The two answers differ by 1 cent, so the contract pins per-line rounding.
    worked_example: |
      CA rule; THIRD_PARTY_RETAIL; P = 62; PAPER_MAIL; certification_requested true; no legacy segment
        BASE_RETRIEVAL   1  x 1500000 mc -> 1500
        PER_PAGE_TIER1  25  x   27500 mc -> round_half_up(687.5) = 688
        PER_PAGE_TIER2  37  x   12500 mc -> round_half_up(462.5) = 463
        CERTIFICATION    1  x 1000000 mc -> 1000
        POSTAGE          1  x  850000 mc ->  850
        subtotal_cents = 4501
      Same P = 62 under PATIENT_ACCESS_COST_BASED with SECURE_PORTAL:
        PER_PAGE_FLAT   62  x   10000 mc ->  620
        subtotal_cents = 620

  - name: invoice_cap_application
    entity: Invoice
    field: "applicable_cap_cents, cap_adjustment_cents, gross_total_cents"
    algorithm_type: threshold
    description: >
      Selects the tighter of two statutory ceilings and pulls the subtotal down to
      it with an explicit negative line, so the invoice always reconciles.
    formula: |
      electronic = Request.delivery_format IN {SECURE_PORTAL, DIRECT_MESSAGE, UNENCRYPTED_EMAIL}
      applicable_cap_cents = electronic
          ? min(StateFeeRule.electronic_delivery_total_cap_cents, StateFeeRule.total_fee_cap_cents)
          : StateFeeRule.total_fee_cap_cents
      cap_adjustment_cents = min(0, applicable_cap_cents - subtotal_cents)
      gross_total_cents    = subtotal_cents + cap_adjustment_cents
    side_effects:
      - "when cap_adjustment_cents != 0: emit a CAP_ADJUSTMENT InvoiceLine as the next sequence with quantity 1, unit_millicents = cap_adjustment_cents * 1000, amount_cents = cap_adjustment_cents"
      - "when cap_adjustment_cents != 0: append ComplianceEvent FEE_CAP_APPLIED against the Request"
    boundary_semantics: "subtotal_cents == applicable_cap_cents leaves cap_adjustment_cents at 0 and emits no CAP_ADJUSTMENT line; the cap bites only on strict excess"
    worked_example: |
      CA rule (electronic cap 6500, total cap 12000); SECURE_PORTAL; THIRD_PARTY_RETAIL;
      P = 300; legacy surcharge 2000; certification requested
        BASE_RETRIEVAL    1 x 1500000 -> 1500
        PER_PAGE_TIER1   25 x   27500 ->  688
        PER_PAGE_TIER2  275 x   12500 -> 3438   (round_half_up(3437.5))
        LEGACY_RETRIEVAL  1 x 2000000 -> 2000
        CERTIFICATION     1 x 1000000 -> 1000
        subtotal_cents = 8626
      applicable_cap_cents = min(6500, 12000) = 6500
      cap_adjustment_cents = min(0, 6500 - 8626) = -2126
      gross_total_cents    = 6500

  - name: invoice_amount_due
    entity: Invoice
    field: "penalty_snapshot_cents, forfeiture_cents, amount_due_cents"
    algorithm_type: waterfall_allocation
    description: >
      Seven steps that must run in exactly this order. The forfeiture is measured
      against the CAPPED figure, not the raw subtotal, and is itself a nested
      minimum, so swapping the cap and the forfeiture changes the amount owed.
    constants:
      MILLICENTS_PER_CENT: 1000
    formula: |
      step 1  recompute Request.penalty_exposure_cents at the current logical clock
              and store it as penalty_snapshot_cents
      step 2  subtotal_cents        = invoice_line_build (per-line rounding already applied)
      step 3  applicable_cap_cents  = invoice_cap_application
      step 4  cap_adjustment_cents  = min(0, applicable_cap_cents - subtotal_cents)
      step 5  gross_total_cents     = subtotal_cents + cap_adjustment_cents
      step 6  forfeiture_cents =
                ( StateFeeRule.fee_forfeiture_on_late == true
                  AND Request.access_basis == PATIENT_RIGHT_OF_ACCESS
                  AND penalty_snapshot_cents > 0 )
                ? min( gross_total_cents, penalty_snapshot_cents )    # <-- gross, never subtotal
                : 0
      step 7  amount_due_cents      = gross_total_cents - forfeiture_cents
    side_effects:
      - "when forfeiture_cents > 0: emit a LATE_FEE_FORFEITURE InvoiceLine as the final sequence with quantity 1, unit_millicents = -forfeiture_cents * 1000, amount_cents = -forfeiture_cents"
    evaluation_order_is_load_bearing: |
      CA rule; PATIENT_ACCESS_COST_BASED; SECURE_PORTAL; P = 800; penalty_snapshot 2500
        pinned order : subtotal 8000 -> cap 6500 -> adj -1500 -> gross 6500
                       -> forfeiture min(6500, 2500) = 2500 -> amount_due 4000
        reversed     : subtotal 8000 -> forfeiture min(8000, 2500) = 2500 -> 5500
                       -> cap 6500 -> 5500 is already under the cap -> amount_due 5500
      4000 vs 5500 on identical inputs; only the pinned order is correct.
    worked_example: |
      PATIENT_ACCESS_COST_BASED; SECURE_PORTAL; P = 800; penalty_snapshot_cents = 2500
        PER_PAGE_FLAT 800 x 10000 mc -> 8000
        subtotal 8000; applicable_cap 6500; cap_adjustment -1500; gross 6500
        forfeiture min(6500, 2500) = 2500; amount_due_cents = 4000

  - name: turnaround_penalty
    entity: Request
    field: "penalty_exposure_cents, safe_harbor_penalty_cents"
    algorithm_type: rate_threshold_triggers
    description: >
      Two lateness measures over the same interval. The statutory measure counts
      raw elapsed days with no grace; the contractual measure counts UTC business
      days and forgives the first GRACE_BUSINESS_DAYS of them. Both share the same
      per-day rate and the same cap.
    constants:
      SECONDS_PER_DAY: 86400
      GRACE_BUSINESS_DAYS: 2
    formula: |
      effective_completion_at =
            Request.released_at   if released_at is not null
       else Request.closed_at     if closed_at   is not null
       else the current logical clock
      if effective_completion_at <= Request.statutory_due_at:
            both variants are 0 and no ComplianceEvent is appended
    variants:
      - variant: STATUTORY_STRICT
        applies_when: "always maintained; reported as penalty_exposure_cents and snapshotted by an Invoice"
        formula: |
          overrun_seconds  = effective_completion_at - statutory_due_at        # > 0 here
          days_late_strict = ceil(overrun_seconds / SECONDS_PER_DAY)
          penalty_exposure_cents = min(days_late_strict * StateFeeRule.penalty_per_day_cents,
                                       StateFeeRule.penalty_cap_cents)
      - variant: CONTRACTUAL_SAFE_HARBOR
        applies_when: "always maintained; reported as safe_harbor_penalty_cents and by GET /roi/requests/{id}/turnaround"
        formula: |
          days_late_business = count of UTC calendar dates d such that
                                 date(statutory_due_at) < d <= date(effective_completion_at)
                                 and weekday(d) IN {Mon, Tue, Wed, Thu, Fri}
          chargeable_days    = max(0, days_late_business - GRACE_BUSINESS_DAYS)
          safe_harbor_penalty_cents = min(chargeable_days * StateFeeRule.penalty_per_day_cents,
                                          StateFeeRule.penalty_cap_cents)
    recompute_triggers:
      - "every Request fulfillment_status transition"
      - "POST /roi/invoices (step 1 of invoice_amount_due)"
      - "POST /roi/compliance-sweeps"
      - "POST /roi/requests/{id}/extension"
    side_effects:
      - "when penalty_exposure_cents increases: append ComplianceEvent PENALTY_ACCRUED with penalty_delta_cents and days_late"
      - "the first time effective_completion_at exceeds statutory_due_at: append ComplianceEvent STATUTORY_DEADLINE_BREACHED"
      - "recompute Facility.penalty_exposure_cents"
    worked_example: |
      CA rule (penalty_per_day 2500, cap 25000); statutory_due_at 2026-08-31T00:00:00Z (a Monday)
        released 2026-09-05T06:00:00Z:
          STATUTORY_STRICT        ceil(5.25 d) = 6  -> 15000
          CONTRACTUAL_SAFE_HARBOR Sep 1,2,3,4 = 4 business days -> chargeable 2 -> 5000
        released exactly 2026-08-31T00:00:00Z: both 0
        released 2026-10-15T00:00:00Z:
          STATUTORY_STRICT        45 d -> 112500 -> capped 25000
          CONTRACTUAL_SAFE_HARBOR 33 business days -> chargeable 31 -> 77500 -> capped 25000

  - name: facility_money_ledger
    entity: Facility
    field: "receivable_cents, collected_cents, written_off_cents"
    algorithm_type: aggregation
    description: >
      Three mutually exclusive buckets over the facility's invoices. Because a
      payment must settle the full amount_due_cents, paid_cents is always 0 on an
      ISSUED invoice and the three buckets partition the issued money exactly.
    input_set: "Invoice i where the Request of i.request_id has facility_id == Facility.id"
    formula: |
      receivable_cents  = SUM over { i : i.status == ISSUED } of (i.amount_due_cents - i.paid_cents)
      collected_cents   = SUM over { i : i.status == PAID   } of i.paid_cents
      written_off_cents = SUM over { i : i.status == WAIVED } of i.amount_due_cents
      # DRAFT and VOIDED invoices contribute to no bucket.
    invariant: |
      receivable_cents + collected_cents + written_off_cents
        == SUM over { i : i.status IN {ISSUED, PAID, WAIVED} } of i.amount_due_cents
    recompute_triggers:
      - "POST /roi/invoices/{id}/issue"
      - "POST /roi/invoices/{id}/settlement (any action)"
      - "any cascade that voids an Invoice"

  - name: segment_sensitivity_classification
    entity: RecordSegment
    field: sensitivity_status
    algorithm_type: threshold
    description: "Set-membership test evaluated once, at the PENDING -> RETRIEVED transition."
    formula: |
      sensitivity_status =
          (RecordSegment.category IN Facility.sensitive_categories_requiring_specific_authorization)
              ? SEGREGATED_PENDING_REVIEW
              : NOT_SENSITIVE
    notes: >
      The facility's list is configuration, so a facility that omits a category
      from the list classifies that category as NOT_SENSITIVE and never routes it
      to the reviewer. PSYCHOTHERAPY_NOTES is never releasable regardless of how
      the list is configured; the block lives in validation, not classification.

# =============================================================================
# Table 1.4: Validation Rules (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    applies_to: "every endpoint"
    condition: "X-User-ID header is absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_code: 401

  - priority: 2
    category: auth
    applies_to: "every endpoint"
    condition: "the caller's role is not listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_code: 403

  - priority: 3
    category: ownership
    applies_to: "every endpoint whose roles include Requester, when the caller acts as Requester"
    condition: "the addressed Request (directly, or through the addressed Invoice / Delivery / DenialDecision / AmendmentRequest / Authorization) has requester_id != X-User-ID"
    error_id: ERR_NOT_REQUEST_OWNER
    http_code: 403
    notes: "list endpoints are instead silently scoped to the caller's own requester_id rather than erroring"

  - priority: 4
    category: schema
    applies_to: "every write endpoint"
    condition: "a required field is missing, an enum value is outside its declared set, a numeric field is negative where '>= 0' is declared, a string exceeds its length bound, a datetime is not ISO 8601 UTC, or source_system == LEGACY_ARCHIVE arrives without legacy_job_start_at (or a non-legacy source arrives with one)"
    error_id: ERR_INVALID_REQUEST
    http_code: 400

  - priority: 5
    category: schema
    applies_to: "POST /roi/requests, POST /roi/authorizations"
    condition: "date_range_end < date_range_start, or expires_at <= signed_at"
    error_id: ERR_INVALID_DATE_RANGE
    http_code: 400

  - priority: 6
    category: existence
    applies_to: "every endpoint carrying a path id"
    condition: "no entity of the addressed collection has that id"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_REQUESTER_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_DENIAL_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND"
    http_code: 404

  - priority: 7
    category: existence
    applies_to: "every write endpoint carrying a foreign key in its body"
    condition: "the referenced parent does not exist, or a segment named in segment_decisions / record_segment_id does not belong to the addressed Request"
    error_id: "ERR_STATE_FEE_RULE_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_REQUESTER_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_SEGMENT_NOT_FOUND"
    http_code: 404

  - priority: 8
    category: concurrency
    applies_to: "POST /roi/invoices, POST /roi/authorizations"
    condition: "expected_request_version != Request.version, or expected_patient_version != Patient.version"
    error_id: "ERR_STALE_REQUEST_VERSION | ERR_STALE_PATIENT_VERSION"
    http_code: 412

  - priority: 9
    category: business_constraint
    applies_to: "POST /roi/requests/{id}/release, POST /roi/record-segments/{id}/redaction-decision, POST /roi/denials/{id}/review"
    condition: "X-User-ID equals Request.intake_user_id, or RecordSegment.redaction_applied_by_user_id, or DenialDecision.issued_by_user_id respectively"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_code: 403

  - priority: 10
    category: state
    applies_to: "every endpoint that reads or advances Request.fulfillment_status"
    condition: "Request.fulfillment_status is not in the endpoint's declared from-state set"
    error_id: ERR_REQUEST_STATE_INVALID
    http_code: 409

  - priority: 11
    category: state
    applies_to: "POST /roi/record-segments/{id}/disposition, /redaction, /redaction-decision"
    condition: "the segment's retrieval_status, sensitivity_status or redaction_status is not in the transition's from-state set"
    error_id: ERR_SEGMENT_STATE_INVALID
    http_code: 409

  - priority: 12
    category: state
    applies_to: "POST /roi/authorizations/{id}/revoke, POST /roi/authorizations/{id}/cure"
    condition: "Authorization.status is not in the transition's from-state set (revoke needs VALID or DEFECTIVE; cure needs DEFECTIVE)"
    error_id: ERR_AUTHORIZATION_STATE_INVALID
    http_code: 409

  - priority: 13
    category: state
    applies_to: "POST /roi/invoices/{id}/issue, POST /roi/invoices/{id}/settlement"
    condition: "Invoice.status is not in the transition's from-state set"
    error_id: ERR_INVOICE_STATE_INVALID
    http_code: 409

  - priority: 14
    category: state
    applies_to: "POST /roi/deliveries/{id}/transmission, POST /roi/deliveries/{id}/confirm"
    condition: "Delivery.status is not in the transition's from-state set"
    error_id: ERR_DELIVERY_STATE_INVALID
    http_code: 409

  - priority: 15
    category: state
    applies_to: "POST /roi/denials/{id}/review, POST /roi/amendment-requests/{id}/decision, POST /roi/amendment-requests/{id}/resubmission"
    condition: "DenialDecision.status or AmendmentRequest.status is not in the requested action's from-state set"
    error_id: ERR_REVIEW_STATE_INVALID
    http_code: 409

  - priority: 16
    category: cross_entity_state
    applies_to: "POST /roi/requests, POST /roi/requests/{id}/intake-decision"
    condition: "the governing Facility.status == SUSPENDED"
    error_id: ERR_FACILITY_SUSPENDED
    http_code: 409

  - priority: 17
    category: cross_entity_state
    applies_to: "POST /roi/requests/{id}/intake-decision  {decision: ACCEPT}"
    condition: "access_basis == THIRD_PARTY_AUTHORIZATION and Authorization.status != VALID"
    error_id: ERR_AUTHORIZATION_NOT_VALID
    http_code: 409

  - priority: 18
    category: cross_entity_state
    applies_to: "POST /roi/requests/{id}/intake-decision  {decision: ACCEPT}, POST /roi/requests/{id}/sensitive-review"
    condition: "access_basis == THIRD_PARTY_AUTHORIZATION and Authorization.expires_at <= the current logical clock"
    error_id: ERR_AUTHORIZATION_EXPIRED
    http_code: 409
    notes: "the boundary is exclusive at the top: expires_at exactly equal to the clock is already lapsed"

  - priority: 19
    category: cross_entity_state
    applies_to: "POST /roi/invoices, POST /roi/invoices/{id}/issue, POST /roi/deliveries"
    condition: "Request.fulfillment_status NOT IN {RELEASE_READY, RELEASED} for invoicing, or != RELEASED for a Delivery"
    error_id: ERR_REQUEST_NOT_RELEASE_READY
    http_code: 409

  - priority: 20
    category: business_safety
    applies_to: "POST /roi/requests/{id}/sensitive-review"
    condition: "a decision asks to INCLUDE a segment whose category == PSYCHOTHERAPY_NOTES"
    error_id: ERR_PSYCHOTHERAPY_NOTES_NOT_RELEASABLE
    http_code: 422
    notes: "psychotherapy notes are excluded from the right of access outright; no authorization can unlock them"

  - priority: 21
    category: business_safety
    applies_to: "POST /roi/requests/{id}/sensitive-review"
    condition: "a decision asks to INCLUDE a segment whose category is outside Authorization.sensitive_categories_authorized, and access_basis == THIRD_PARTY_AUTHORIZATION"
    error_id: ERR_SENSITIVE_CATEGORY_NOT_AUTHORIZED
    http_code: 422

  - priority: 22
    category: business_safety
    applies_to: "POST /roi/requests/{id}/sensitive-review"
    condition: "a decision asks to INCLUDE a SUD_PART2 segment while access_basis == THIRD_PARTY_AUTHORIZATION and Authorization.part2_redisclosure_prohibition_ack == false"
    error_id: ERR_PART2_ACK_MISSING
    http_code: 422
    notes: "cascading: priority 21 must be satisfied first, so an unauthorized SUD_PART2 category reports 21, not 22"

  - priority: 23
    category: business_safety
    applies_to: "POST /roi/deliveries"
    condition: "delivery_format == UNENCRYPTED_EMAIL or encryption == NONE, and NOT (Request.access_basis == PATIENT_RIGHT_OF_ACCESS and patient_direction_ack == true)"
    error_id: ERR_UNENCRYPTED_DELIVERY_NOT_DIRECTED
    http_code: 422
    notes: "only a patient exercising the right of access may direct records to an unsecured endpoint"

  - priority: 24
    category: business_safety
    applies_to: "POST /roi/deliveries"
    condition: "delivery_format == FAX and any RETRIEVED segment of the Request has sensitivity_status == AUTHORIZED_INCLUDE with category IN {SUD_PART2, HIV, GENETIC}"
    error_id: ERR_FAX_NOT_PERMITTED
    http_code: 422

  - priority: 25
    category: business_referential
    applies_to: "POST /roi/deliveries"
    condition: "Request.access_basis == THIRD_PARTY_AUTHORIZATION and recipient_endpoint != Authorization.designated_recipient_endpoint"
    error_id: ERR_RECIPIENT_NOT_DESIGNATED
    http_code: 422

  - priority: 26
    category: business_referential
    applies_to: "POST /roi/requests, POST /roi/amendment-requests"
    condition: "Requester.requester_type == PATIENT and Requester.patient_id != the body's patient_id, or AmendmentRequest.patient_id != Request.patient_id"
    error_id: ERR_PATIENT_IDENTITY_MISMATCH
    http_code: 422

  - priority: 27
    category: business_referential
    applies_to: "POST /roi/requests"
    condition: "access_basis == PATIENT_RIGHT_OF_ACCESS and Requester.requester_type NOT IN {PATIENT, PERSONAL_REPRESENTATIVE}"
    error_id: ERR_ACCESS_BASIS_REQUESTER_MISMATCH
    http_code: 422

  - priority: 28
    category: business_referential
    applies_to: "POST /roi/requests"
    condition: "access_basis == THIRD_PARTY_AUTHORIZATION and authorization_id is null, or access_basis == PATIENT_RIGHT_OF_ACCESS and authorization_id is not null, or the referenced Authorization's patient_id / requester_id differ from the body's"
    error_id: ERR_AUTHORIZATION_REQUIRED
    http_code: 422

  - priority: 29
    category: business_referential
    applies_to: "POST /roi/amendment-requests"
    condition: "the target RecordSegment's parent Request has released_at == null, or the segment's retrieval_status != RETRIEVED"
    error_id: ERR_AMENDMENT_TARGET_NOT_RELEASED
    http_code: 422

  - priority: 30
    category: business_constraint
    applies_to: "POST /roi/authorizations"
    condition: "an existing Authorization with the same patient_id and requester_id, status IN {VALID, DEFECTIVE}, id != supersedes_authorization_id, and a scope_categories intersection, has a coverage interval [signed_at, expires_at) that overlaps the new one"
    error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http_code: 409
    notes: "half-open interval: an authorization whose signed_at equals the incumbent's expires_at is adjacent, not overlapping, and is accepted"

  - priority: 31
    category: business_constraint
    applies_to: "POST /roi/record-segments"
    condition: "source_system == LEGACY_ARCHIVE and the governing Facility.legacy_archive_enabled == false"
    error_id: ERR_LEGACY_ARCHIVE_DISABLED
    http_code: 422

  - priority: 32
    category: business_constraint
    applies_to: "POST /roi/record-segments"
    condition: "source_system == LEGACY_ARCHIVE and the buffered window of the new job touches or overlaps the buffered window of an existing LEGACY_ARCHIVE segment on the same Facility whose retrieval_status IN {PENDING, RETRIEVED}"
    error_id: ERR_LEGACY_WINDOW_CONTENTION
    http_code: 409
    notes: |
      buffered window of a job = [ legacy_job_start_at - legacy_gateway_buffer_minutes,
                                   legacy_job_start_at + legacy_gateway_job_minutes
                                                        + legacy_gateway_buffer_minutes ]
      closed on BOTH ends: two windows that merely touch at an endpoint collide.

  - priority: 33
    category: business_constraint
    applies_to: "POST /roi/patients"
    condition: "a Patient with the same facility_id and mrn already exists"
    error_id: ERR_DUPLICATE_MRN
    http_code: 409

  - priority: 34
    category: business_constraint
    applies_to: "POST /roi/state-fee-rules"
    condition: "a StateFeeRule with the same state_code already exists"
    error_id: ERR_DUPLICATE_STATE_FEE_RULE
    http_code: 409

  - priority: 35
    category: business_constraint
    applies_to: "POST /roi/requests"
    condition: "another Request with the same facility_id, patient_id, requester_id, date_range_start and date_range_end has fulfillment_status NOT IN {CLOSED, CANCELLED}, and it is not this request's predecessor_request_id"
    error_id: ERR_DUPLICATE_INFLIGHT_REQUEST
    http_code: 409

  - priority: 36
    category: business_constraint
    applies_to: "POST /roi/requests/{id}/extension"
    condition: "extension_applied == true already, or StateFeeRule.extension_days == 0, or the current logical clock is already past statutory_due_at"
    error_id: ERR_EXTENSION_NOT_AVAILABLE
    http_code: 409
    notes: "the extension must be noticed before the deadline lapses; at exactly statutory_due_at it is still available"

  - priority: 37
    category: business_constraint
    applies_to: "POST /roi/requests/{id}/complete-compilation"
    condition: "the Request has no RecordSegment, or at least one RecordSegment has retrieval_status == PENDING"
    error_id: ERR_SEGMENTS_PENDING
    http_code: 409

  - priority: 38
    category: business_constraint
    applies_to: "POST /roi/requests/{id}/sensitive-review"
    condition: "a RecordSegment of the Request with sensitivity_status == SEGREGATED_PENDING_REVIEW is absent from segment_decisions, or a segment appears twice, or a decision names a segment that is not SEGREGATED_PENDING_REVIEW"
    error_id: ERR_SEGREGATION_REVIEW_INCOMPLETE
    http_code: 409

  - priority: 39
    category: business_constraint
    applies_to: "POST /roi/record-segments/{id}/redaction"
    condition: "redacted_page_count > RecordSegment.page_count"
    error_id: ERR_REDACTION_PAGE_COUNT_INVALID
    http_code: 422
    notes: "redacted_page_count exactly equal to page_count is accepted and leaves the segment with 0 billable pages"

  - priority: 40
    category: business_constraint
    applies_to: "POST /roi/requests/{id}/release, POST /roi/invoices"
    condition: "a RecordSegment of the Request has redaction_status IN {OPEN, APPLIED, REWORK}"
    error_id: ERR_REDACTION_NOT_APPROVED
    http_code: 409

  - priority: 41
    category: business_constraint
    applies_to: "POST /roi/deliveries/{id}/transmission"
    condition: "attempt_count >= MAX_DELIVERY_ATTEMPTS (3)"
    error_id: ERR_DELIVERY_ATTEMPT_LIMIT
    http_code: 409

  - priority: 42
    category: business_constraint
    applies_to: "POST /roi/deliveries"
    condition: "a Delivery for the same request_id has status IN {PENDING, SENT, FAILED}"
    error_id: ERR_DELIVERY_ALREADY_EXISTS
    http_code: 409

  - priority: 43
    category: business_constraint
    applies_to: "POST /roi/denials/{id}/review"
    condition: "action == START_REVIEW and DenialDecision.reviewable == false, or action == OVERTURN and reviewable == false"
    error_id: ERR_DENIAL_NOT_REVIEWABLE
    http_code: 422

  - priority: 44
    category: business_fiscal
    applies_to: "POST /roi/invoices"
    condition: "an Invoice for the same request_id has status IN {ISSUED, PAID, WAIVED}"
    error_id: ERR_INVOICE_ALREADY_EXISTS
    http_code: 409
    notes: "a DRAFT invoice does NOT block: it is voided and superseded by the new one, which is why the OCC guard exists"

  - priority: 45
    category: business_fiscal
    applies_to: "POST /roi/invoices"
    condition: "Request.billing_status == NOT_BILLABLE, or the computed subtotal_cents is 0"
    error_id: ERR_NOTHING_TO_INVOICE
    http_code: 422

  - priority: 46
    category: business_fiscal
    applies_to: "POST /roi/invoices/{id}/settlement  {action: PAY}"
    condition: "amount_cents is absent or != Invoice.amount_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_code: 422
    notes: "partial payment is refused outright, which is what keeps the facility money ledger a clean three-way partition"

  - priority: 47
    category: business_fiscal
    applies_to: "POST /roi/requests/{id}/release"
    condition: "Request.billing_status IN {PENDING_INVOICE, INVOICED}"
    error_id: ERR_INVOICE_UNSETTLED
    http_code: 402
    notes: "prepayment is required before records leave the building"

validation_priority_conflicts:
  - pair: "priority 10 (state, ERR_REQUEST_STATE_INVALID) vs priority 47 (business_fiscal, ERR_INVOICE_UNSETTLED)"
    endpoint: "POST /roi/requests/{id}/release"
    both_violated_when: "the Request is still in SENSITIVE_REVIEW and its billing_status is PENDING_INVOICE"
    expected_error: ERR_REQUEST_STATE_INVALID
  - pair: "priority 23 (business_safety, ERR_UNENCRYPTED_DELIVERY_NOT_DIRECTED) vs priority 25 (business_referential, ERR_RECIPIENT_NOT_DESIGNATED)"
    endpoint: "POST /roi/deliveries"
    both_violated_when: "a THIRD_PARTY_AUTHORIZATION request is delivered UNENCRYPTED_EMAIL with encryption NONE to an endpoint that is not the authorization's designated recipient"
    expected_error: ERR_UNENCRYPTED_DELIVERY_NOT_DIRECTED
  - pair: "priority 9 (business_constraint, ERR_SEGREGATION_OF_DUTIES) vs priority 11 (state, ERR_SEGMENT_STATE_INVALID)"
    endpoint: "POST /roi/record-segments/{id}/redaction-decision"
    both_violated_when: "the analyst who applied the redaction decides again on a segment whose redaction_status is already APPROVED"
    expected_error: ERR_SEGREGATION_OF_DUTIES

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
# Path-parameter convention: the FIRST path parameter of every route is spelled
# {id}. Sub-resource routes are therefore /roi/<parent>/{id}/<child>.
endpoints:

  # ------------------------------------------------------------ configuration
  - method: POST
    path: /roi/state-fee-rules
    purpose: "Register a state's fee schedule, statutory deadlines and penalty regime"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, base_retrieval_fee_cents, tier1_page_limit, tier1_per_page_millicents, tier2_per_page_millicents, patient_access_per_page_millicents, certification_fee_cents, media_fee_cents, postage_per_delivery_cents, electronic_delivery_total_cap_cents, total_fee_cap_cents, patient_access_deadline_days, third_party_deadline_days, extension_days, penalty_per_day_cents, penalty_cap_cents, fee_forfeiture_on_late]
    output: StateFeeRule
    side_effects: []

  - method: GET
    path: /roi/state-fee-rules
    purpose: "List registered fee schedules"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: StateFeeRule[]
    side_effects: []

  - method: POST
    path: /roi/facilities
    purpose: "Onboard a covered-entity facility under a state fee rule"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_fee_rule_id, "legacy_archive_enabled?", "legacy_retrieval_surcharge_cents?", "legacy_gateway_job_minutes?", "legacy_gateway_buffer_minutes?", "sensitive_categories_requiring_specific_authorization?"]
    output: Facility
    side_effects: ["initialises receivable_cents, collected_cents, written_off_cents and penalty_exposure_cents to 0"]

  - method: GET
    path: /roi/facilities/{id}
    purpose: "Read one facility with its money and penalty ledgers"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: /roi/facilities
    purpose: "List facilities, optionally by fee rule or status"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: ["state_fee_rule_id?", "status?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: POST
    path: /roi/facilities/{id}/status
    purpose: "Suspend or reactivate a facility"
    roles: [PlatformAdmin]
    code: 200
    input: [status, "reason?"]
    output: Facility
    side_effects: ["a SUSPENDED facility refuses new Request intake and refuses ACCEPT on existing intake decisions", "increments Facility.version by 1"]

  - method: POST
    path: /roi/patients
    purpose: "Register a patient in a facility's designated record set"
    roles: [FacilityAdmin, PlatformAdmin]
    code: 201
    input: [facility_id, mrn, full_name, date_of_birth, "is_minor?", "deceased?"]
    output: Patient
    side_effects: []

  - method: GET
    path: /roi/patients/{id}
    purpose: "Read one patient"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: /roi/patients
    purpose: "List patients, optionally by facility or MRN"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: ["facility_id?", "mrn?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: POST
    path: /roi/requesters
    purpose: "Register a requesting party and its type"
    roles: [IntakeSpecialist, PlatformAdmin]
    code: 201
    input: [requester_type, contact_email, "organization_name?", "credential_number?", "patient_id?", "signature_on_file?"]
    output: Requester
    side_effects: []

  - method: GET
    path: /roi/requesters/{id}
    purpose: "Read one requesting party"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: Requester
    side_effects: []

  - method: GET
    path: /roi/requesters
    purpose: "List requesting parties, optionally by type or linked patient"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: ["requester_type?", "patient_id?", "limit?", "offset?"]
    output: Requester[]
    side_effects: []

  # ------------------------------------------------------------ authorizations
  - method: POST
    path: /roi/authorizations
    purpose: "Record a signed patient authorization, optionally superseding an incumbent one"
    roles: [IntakeSpecialist, PrivacyOfficer]
    code: 201
    input: [patient_id, requester_id, expected_patient_version, signed_at, expires_at, scope_categories, designated_recipient_endpoint, signature_verified, "sensitive_categories_authorized?", "part2_redisclosure_prohibition_ack?", "supersedes_authorization_id?"]
    output: Authorization
    side_effects:
      - "status is computed VALID or DEFECTIVE with defect_reasons"
      - "drives the authorization named by supersedes_authorization_id to SUPERSEDED"
      - "increments Patient.version by 1"

  - method: GET
    path: /roi/authorizations/{id}
    purpose: "Read one authorization"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: /roi/authorizations
    purpose: "List authorizations by patient, requester, superseded predecessor or status"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["patient_id?", "requester_id?", "supersedes_authorization_id?", "status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: POST
    path: /roi/authorizations/{id}/revoke
    purpose: "Revoke an authorization and unwind every request that depended on it"
    roles: [PrivacyOfficer, Requester]
    code: 200
    input: [revocation_reason]
    output: Authorization
    side_effects:
      - "cascade: every non-terminal Request on this authorization moves to AUTH_DEFECT_PENDING"
      - "cascade: AUTHORIZED_INCLUDE and WITHHELD segments revert to SEGREGATED_PENDING_REVIEW and their redactions reopen"
      - "cascade: DRAFT and ISSUED invoices on those requests are VOIDED with void_reason AUTHORIZATION_REVOKED"
      - "cascade: Facility.receivable_cents is recomputed"
      - "appends ComplianceEvent AUTHORIZATION_REVOKED per affected Request"
      - "increments Authorization.version by 1"

  - method: POST
    path: /roi/authorizations/{id}/cure
    purpose: "Cure a defective authorization and restart the tolled requests"
    roles: [IntakeSpecialist]
    code: 200
    input: [signed_at, expires_at, scope_categories, designated_recipient_endpoint, signature_verified, "sensitive_categories_authorized?", "part2_redisclosure_prohibition_ack?"]
    output: Authorization
    side_effects:
      - "status becomes VALID and defect_reasons is cleared"
      - "cascade: every Request in AUTH_DEFECT_PENDING on this authorization returns to INTAKE_REVIEW, closing its tolling interval"
      - "cascade: statutory_due_at is recomputed on those requests"
      - "increments Authorization.version by 1"

  # ------------------------------------------------------------ requests
  - method: POST
    path: /roi/requests
    purpose: "Intake a record request under a patient-access or third-party basis"
    roles: [IntakeSpecialist]
    code: 201
    input: [facility_id, patient_id, requester_id, access_basis, requested_categories, date_range_start, date_range_end, delivery_format, "authorization_id?", "predecessor_request_id?", "certification_requested?"]
    output: Request
    side_effects:
      - "sets received_at to the current logical clock and intake_user_id to X-User-ID"
      - "computes statutory_due_at"
      - "fulfillment_status = INTAKE_REVIEW, billing_status = PENDING_INVOICE"

  - method: GET
    path: /roi/requests/{id}
    purpose: "Read one request with its page ledger, deadline and penalty exposure"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: Request
    side_effects: []

  - method: GET
    path: /roi/requests
    purpose: "List requests by facility, patient, requester, authorization, predecessor or either status dimension"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["facility_id?", "patient_id?", "requester_id?", "authorization_id?", "predecessor_request_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: Request[]
    side_effects: []

  - method: GET
    path: /roi/requests/{id}/turnaround
    purpose: "Computed read of both lateness measures without persisting anything"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: { statutory_due_at: datetime, effective_completion_at: datetime, tolled_seconds: integer, extension_applied: boolean, breached: boolean, days_late_strict: integer, days_late_business: integer, chargeable_days: integer, penalty_exposure_cents: integer, safe_harbor_penalty_cents: integer }
    side_effects: []

  - method: POST
    path: /roi/requests/{id}/intake-decision
    purpose: "Accept the request into compilation or park it on an authorization defect"
    roles: [IntakeSpecialist]
    code: 200
    input: [decision, "defect_reasons?"]
    output: Request
    side_effects:
      - "ACCEPT: INTAKE_REVIEW -> COMPILATION, statutory_due_at and both penalty measures recomputed"
      - "DEFECT: INTAKE_REVIEW -> AUTH_DEFECT_PENDING, opens a tolling interval at defect_opened_at"
      - "increments Request.version by 1"

  - method: POST
    path: /roi/requests/{id}/extension
    purpose: "Notice the single statutory extension"
    roles: [IntakeSpecialist]
    code: 200
    input: [notice_note]
    output: Request
    side_effects:
      - "sets extension_applied = true and extension_noticed_at"
      - "recomputes statutory_due_at and both penalty measures"
      - "increments Request.version by 1"
    notes: "permitted from ANY non-terminal fulfillment_status; it never changes fulfillment_status, so it is the cheapest way to move Request.version without advancing the workflow"

  - method: POST
    path: /roi/requests/{id}/complete-compilation
    purpose: "Declare compilation finished and route to sensitive review"
    roles: [RecordsAnalyst]
    code: 200
    input: []
    output: Request
    side_effects:
      - "COMPILATION -> SENSITIVE_REVIEW"
      - "recomputes the four page ledger fields and both penalty measures"
      - "increments Request.version by 1"

  - method: POST
    path: /roi/requests/{id}/sensitive-review
    purpose: "Decide every segregated segment in one pass"
    roles: [ReleaseReviewer]
    code: 200
    input: [segment_decisions]
    output: Request
    side_effects:
      - "each decision sets its segment to AUTHORIZED_INCLUDE or WITHHELD"
      - "decisions carrying redaction_required true set redaction_status = OPEN"
      - "SENSITIVE_REVIEW -> REDACTION when any redaction opened, otherwise -> RELEASE_READY"
      - "on entry to RELEASE_READY: billing_status becomes NOT_BILLABLE when the prospective subtotal is 0"
      - "appends ComplianceEvent SENSITIVE_WITHHOLD per WITHHELD decision"
      - "increments Request.version by 1"
    notes: "segment_decisions is an array of { record_segment_id, decision: INCLUDE|WITHHOLD, redaction_required?: boolean, note?: string }"

  - method: POST
    path: /roi/requests/{id}/release
    purpose: "Release the compiled set once it is paid for and fully redacted"
    roles: [ReleaseReviewer]
    code: 200
    input: ["release_note?"]
    output: Request
    side_effects:
      - "RELEASE_READY -> RELEASED, sets released_at and release_reviewer_user_id"
      - "freezes both penalty measures at effective_completion_at = released_at"
      - "appends ComplianceEvent STATUTORY_DEADLINE_BREACHED when late"
      - "recomputes Facility.penalty_exposure_cents"
      - "increments Request.version by 1"

  - method: POST
    path: /roi/requests/{id}/withdraw
    purpose: "Requester withdraws its own request"
    roles: [Requester]
    code: 200
    input: [withdrawal_reason]
    output: Request
    side_effects:
      - "moves to CANCELLED, sets closed_at, freezes both penalty measures"
      - "voids DRAFT and ISSUED invoices and sets billing_status = NOT_BILLABLE"
      - "recomputes Facility.receivable_cents and Facility.penalty_exposure_cents"
      - "increments Request.version by 1"

  - method: GET
    path: /roi/requests/{id}/compliance-events
    purpose: "Append-only compliance trail for one request"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: ComplianceEvent[]
    side_effects: []
    notes: "ordered by occurred_at ascending, then by the order of appending; no identifier participates in the ordering"

  # ------------------------------------------------------------ record segments
  - method: POST
    path: /roi/record-segments
    purpose: "Open a compilation task against one source system, reserving a legacy gateway window when needed"
    roles: [RecordsAnalyst]
    code: 201
    input: [request_id, source_system, category, "legacy_job_start_at?"]
    output: RecordSegment
    side_effects:
      - "computes legacy_job_end_at from Facility.legacy_gateway_job_minutes when a legacy window is supplied"
      - "rejects a buffered window that touches or overlaps another live legacy job on the same facility"

  - method: GET
    path: /roi/record-segments/{id}
    purpose: "Read one compiled segment with its three state dimensions"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: []
    output: RecordSegment
    side_effects: []

  - method: GET
    path: /roi/record-segments
    purpose: "List compiled segments by request, source system, category or sensitivity"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer]
    code: 200
    input: ["request_id?", "source_system?", "category?", "sensitivity_status?", "limit?", "offset?"]
    output: RecordSegment[]
    side_effects: []

  - method: POST
    path: /roi/record-segments/{id}/disposition
    purpose: "Record the outcome of a retrieval attempt, or withdraw the segment"
    roles: [RecordsAnalyst]
    code: 200
    input: [disposition, "page_count?", "unavailable_reason?"]
    output: RecordSegment
    side_effects:
      - "RETRIEVED: sets retrieved_at, classifies sensitivity_status, recomputes the parent's four page ledger fields"
      - "UNAVAILABLE: forces page_count to 0"
      - "WITHDRAWN: resets sensitivity_status, redaction_status and redacted_page_count, removes the segment from every page aggregate and re-evaluates the REDACTION bubble-up"
      - "increments Request.version by 1 (the parent page ledger is re-derived on every segment write)"
      - "increments RecordSegment.version by 1"

  - method: POST
    path: /roi/record-segments/{id}/redaction
    purpose: "Apply redactions to an authorized-but-sensitive segment"
    roles: [RecordsAnalyst]
    code: 200
    input: [redacted_page_count, "redaction_note?"]
    output: RecordSegment
    side_effects:
      - "OPEN or REWORK -> APPLIED, records redaction_applied_by_user_id"
      - "the page ledger does NOT move yet: redacted pages count only once APPROVED"
      - "increments Request.version by 1 (the parent page ledger is re-derived on every segment write)"
      - "increments RecordSegment.version by 1"

  - method: POST
    path: /roi/record-segments/{id}/redaction-decision
    purpose: "Second-person review of an applied redaction"
    roles: [ReleaseReviewer]
    code: 200
    input: [decision, "note?"]
    output: RecordSegment
    side_effects:
      - "APPROVE: APPLIED -> APPROVED, redacted pages leave billable_page_count, bubbles the parent Request from REDACTION to RELEASE_READY when nothing remains open"
      - "REWORK: APPLIED -> REWORK and clears redaction_applied_by_user_id"
      - "on the bubble-up to RELEASE_READY: billing_status becomes NOT_BILLABLE when the prospective subtotal is 0"
      - "increments Request.version by 1 (the parent page ledger is re-derived on every segment write)"
      - "increments RecordSegment.version by 1"

  # ------------------------------------------------------------ invoices
  - method: POST
    path: /roi/invoices
    purpose: "Price the released page set under the state fee schedule and caps"
    roles: [BillingClerk]
    code: 201
    input: [request_id, expected_request_version]
    output: Invoice
    side_effects:
      - "step 1: recomputes Request.penalty_exposure_cents at the current logical clock and stores it as penalty_snapshot_cents"
      - "builds the InvoiceLine set for the variant selected by Request.access_basis, rounding each line independently"
      - "applies the delivery-format cap, emitting a CAP_ADJUSTMENT line and a FEE_CAP_APPLIED ComplianceEvent when it bites"
      - "applies the late-fee forfeiture to the capped figure, emitting a LATE_FEE_FORFEITURE line when it bites"
      - "voids any existing DRAFT invoice for the request with void_reason SUPERSEDED_BY_REPRICE"
      - "increments Request.version by 1"

  - method: GET
    path: /roi/invoices/{id}
    purpose: "Read one invoice with its cap, forfeiture and amount due"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: /roi/invoices
    purpose: "List invoices by request or status"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["request_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: /roi/invoices/{id}/lines
    purpose: "Read the priced line set in its pinned sequence"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
    notes: "ordered by sequence ascending; sequence is the only ordering key"

  - method: POST
    path: /roi/invoices/{id}/issue
    purpose: "Issue a draft invoice to the requester"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "DRAFT -> ISSUED, sets issued_at"
      - "Request.billing_status = INVOICED"
      - "Facility.receivable_cents += amount_due_cents"
      - "increments Invoice.version by 1"

  - method: POST
    path: /roi/invoices/{id}/settlement
    purpose: "Pay, waive or void an issued invoice"
    roles: [BillingClerk]
    code: 200
    input: [action, "amount_cents?", "reason?"]
    output: Invoice
    side_effects:
      - "PAY: requires amount_cents == amount_due_cents exactly; moves money from receivable to collected and sets Request.billing_status = PAID"
      - "WAIVE: moves money from receivable to written_off and sets Request.billing_status = WAIVED"
      - "VOID: reverses whichever postings this invoice made and returns Request.billing_status to PENDING_INVOICE"
      - "increments Invoice.version by 1"

  # ------------------------------------------------------------ deliveries
  - method: POST
    path: /roi/deliveries
    purpose: "Open a transmission for a released request under the requested format"
    roles: [ReleaseReviewer]
    code: 201
    input: [request_id, delivery_format, recipient_endpoint, encryption, "patient_direction_ack?"]
    output: Delivery
    side_effects:
      - "refuses an unsecured endpoint unless a patient exercising the right of access directed it"
      - "refuses any endpoint other than the authorization's designated recipient on a third-party request"

  - method: GET
    path: /roi/deliveries/{id}
    purpose: "Read one transmission with its attempt count"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: GET
    path: /roi/deliveries
    purpose: "List transmissions by request or status"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["request_id?", "status?", "limit?", "offset?"]
    output: Delivery[]
    side_effects: []

  - method: POST
    path: /roi/deliveries/{id}/transmission
    purpose: "Record one transmission attempt"
    roles: [ReleaseReviewer]
    code: 200
    input: [outcome, "failure_reason?"]
    output: Delivery
    side_effects:
      - "increments attempt_count; refuses a further attempt once attempt_count reaches 3"
      - "SENT sets sent_at; FAILED appends ComplianceEvent DELIVERY_FAILED"
      - "increments Delivery.version by 1"

  - method: POST
    path: /roi/deliveries/{id}/confirm
    purpose: "Record receipt or return of a sent transmission"
    roles: [ReleaseReviewer, Requester]
    code: 200
    input: [outcome]
    output: Delivery
    side_effects:
      - "CONFIRMED: SENT -> CONFIRMED and cascades the parent Request from RELEASED to CLOSED"
      - "RETURNED: SENT -> RETURNED, appends ComplianceEvent DELIVERY_FAILED, leaves the Request in RELEASED"
      - "increments Delivery.version by 1"

  # ------------------------------------------------------------ denials
  - method: POST
    path: /roi/denials
    purpose: "Deny a request in whole or in part on statutory grounds"
    roles: [PrivacyOfficer]
    code: 201
    input: [request_id, denial_type, grounds, rationale]
    output: DenialDecision
    side_effects:
      - "computes reviewable from grounds and review_due_at from issued_at"
      - "records issued_by_user_id = X-User-ID"
      - "moves the parent Request to DENIED and appends ComplianceEvent DENIAL_ISSUED"
      - "increments Request.version by 1"

  - method: GET
    path: /roi/denials/{id}
    purpose: "Read one denial decision"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: DenialDecision
    side_effects: []

  - method: GET
    path: /roi/denials
    purpose: "List denial decisions by request or status"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["request_id?", "status?", "limit?", "offset?"]
    output: DenialDecision[]
    side_effects: []

  - method: POST
    path: /roi/denials/{id}/review
    purpose: "Second-officer review of a reviewable denial"
    roles: [PrivacyOfficer]
    code: 200
    input: [action, "rationale?"]
    output: DenialDecision
    side_effects:
      - "START_REVIEW: ISSUED -> UNDER_REVIEW, records reviewer_user_id"
      - "UPHOLD: -> UPHELD and cascades the Request from DENIED to CLOSED, freezing both penalty measures"
      - "OVERTURN: -> OVERTURNED and cascades the Request from DENIED back to COMPILATION, reverting WITHHELD segments, recomputing the page ledger and both penalty measures, and refreshing Facility.penalty_exposure_cents"
      - "appends ComplianceEvent DENIAL_OVERTURNED and PENALTY_ACCRUED as applicable"
      - "increments DenialDecision.version by 1"

  # ------------------------------------------------------------ amendments
  - method: POST
    path: /roi/amendment-requests
    purpose: "Patient asks that a disclosed segment be amended"
    roles: [Requester]
    code: 201
    input: [request_id, patient_id, record_segment_id, requested_change]
    output: AmendmentRequest
    side_effects: ["computes decision_due_at from created_at"]

  - method: GET
    path: /roi/amendment-requests/{id}
    purpose: "Read one amendment request"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: []
    output: AmendmentRequest
    side_effects: []

  - method: GET
    path: /roi/amendment-requests
    purpose: "List amendment requests by patient, segment, request or status"
    roles: [PlatformAdmin, FacilityAdmin, IntakeSpecialist, RecordsAnalyst, ReleaseReviewer, BillingClerk, PrivacyOfficer, Requester]
    code: 200
    input: ["patient_id?", "record_segment_id?", "request_id?", "status?", "limit?", "offset?"]
    output: AmendmentRequest[]
    side_effects: []

  - method: POST
    path: /roi/amendment-requests/{id}/decision
    purpose: "Start, park, accept or deny an amendment review"
    roles: [PrivacyOfficer]
    code: 200
    input: [decision, "rationale?"]
    output: AmendmentRequest
    side_effects:
      - "ACCEPT: sets RecordSegment.amended = true, sets Request.amendment_notice_required when the request was already released, appends ComplianceEvent AMENDMENT_NOTICE_REQUIRED"
      - "increments AmendmentRequest.version by 1"

  - method: POST
    path: /roi/amendment-requests/{id}/resubmission
    purpose: "Requester supplies the information the reviewer asked for"
    roles: [Requester]
    code: 200
    input: [additional_information]
    output: AmendmentRequest
    side_effects:
      - "INFO_REQUESTED -> SUBMITTED and increments submission_count"
      - "increments AmendmentRequest.version by 1"

  # ------------------------------------------------------------ compliance sweep
  - method: POST
    path: /roi/compliance-sweeps
    purpose: "Recompute deadlines, lapse expired authorizations and accrue penalties across every live request"
    roles: [PlatformAdmin, PrivacyOfficer]
    code: 200
    input: []
    output: { swept_request_count: integer, breached_request_ids: "string[]", penalized_request_ids: "string[]", total_penalty_delta_cents: integer, expired_authorization_ids: "string[]" }
    side_effects:
      - "every VALID Authorization whose expires_at <= the current logical clock becomes EXPIRED and appends ComplianceEvent AUTHORIZATION_EXPIRED"
      - "recomputes both penalty measures on every Request whose fulfillment_status is non-terminal"
      - "appends ComplianceEvent STATUTORY_DEADLINE_BREACHED and PENALTY_ACCRUED where applicable"
      - "recomputes Facility.penalty_exposure_cents"
      - "id lists are returned in ascending Request.created_at / Authorization.created_at order"

  # ------------------------------------------------------------ test-driving only
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the logical clock that every datetime default and every deadline computation reads"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["no business entity is mutated; the next business call observes the new instant"]
    notes: "default logical clock at process start is 2026-08-01T00:00:00Z"

logical_clock:
  default_current_utc: "2026-08-01T00:00:00Z"
  set_endpoint: "POST /_clock/set_current_utc"
  notes: >
    Every source: system datetime field, every deadline and every penalty measure
    reads this clock rather than the wall clock, so an entire lateness story is
    reproducible from a fixed sequence of calls.

# =============================================================================
# Table 1.6: Error Catalog
# =============================================================================
errors:

  # ---- authentication / authorization
  - { error_id: ERR_UNAUTHENTICATED, http_code: 401, message: "X-User-ID header is required", triggered_by: "any endpoint called without an X-User-ID header" }
  - { error_id: ERR_UNAUTHORIZED_ROLE, http_code: 403, message: "Role is not permitted to perform this operation", triggered_by: "any endpoint called with a role outside its roles list" }
  - { error_id: ERR_NOT_REQUEST_OWNER, http_code: 403, message: "Requester may only act on its own requests", triggered_by: "a Requester addressing a Request, Invoice, Delivery, DenialDecision or AmendmentRequest belonging to another requester" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_code: 403, message: "The acting user may not both perform and approve this step", triggered_by: "release by the intake specialist, redaction-decision by the applying analyst, or denial review by the issuing officer" }

  # ---- schema
  - { error_id: ERR_INVALID_REQUEST, http_code: 400, message: "Request body failed schema validation", triggered_by: "missing required field, bad enum, negative money or page count, over-long string, non-ISO datetime, legacy source without a window or non-legacy source with one" }
  - { error_id: ERR_INVALID_DATE_RANGE, http_code: 400, message: "Interval endpoints are out of order", triggered_by: "date_range_end < date_range_start on POST /roi/requests, or expires_at <= signed_at on POST /roi/authorizations" }

  # ---- existence
  - { error_id: ERR_STATE_FEE_RULE_NOT_FOUND, http_code: 404, message: "State fee rule not found", triggered_by: "POST /roi/facilities with an unknown state_fee_rule_id" }
  - { error_id: ERR_FACILITY_NOT_FOUND, http_code: 404, message: "Facility not found", triggered_by: "GET /roi/facilities/{id} or POST /roi/facilities/{id}/status with an unknown id; POST /roi/patients or POST /roi/requests with an unknown facility_id" }
  - { error_id: ERR_PATIENT_NOT_FOUND, http_code: 404, message: "Patient not found", triggered_by: "GET /roi/patients/{id} with an unknown id; POST /roi/authorizations, POST /roi/requests or POST /roi/amendment-requests with an unknown patient_id" }
  - { error_id: ERR_REQUESTER_NOT_FOUND, http_code: 404, message: "Requester not found", triggered_by: "GET /roi/requesters/{id} with an unknown id; POST /roi/authorizations or POST /roi/requests with an unknown requester_id" }
  - { error_id: ERR_AUTHORIZATION_NOT_FOUND, http_code: 404, message: "Authorization not found", triggered_by: "GET or action route on an unknown authorization id; POST /roi/requests with an unknown authorization_id; POST /roi/authorizations with an unknown supersedes_authorization_id" }
  - { error_id: ERR_REQUEST_NOT_FOUND, http_code: 404, message: "Request not found", triggered_by: "any /roi/requests/{id} route with an unknown id; POST /roi/record-segments, /roi/invoices, /roi/deliveries, /roi/denials or /roi/amendment-requests with an unknown request_id; POST /roi/requests with an unknown predecessor_request_id" }
  - { error_id: ERR_SEGMENT_NOT_FOUND, http_code: 404, message: "Record segment not found for this request", triggered_by: "any /roi/record-segments/{id} route with an unknown id; a segment_decisions entry or an amendment record_segment_id that names a segment of a different request" }
  - { error_id: ERR_INVOICE_NOT_FOUND, http_code: 404, message: "Invoice not found", triggered_by: "any /roi/invoices/{id} route with an unknown id" }
  - { error_id: ERR_DELIVERY_NOT_FOUND, http_code: 404, message: "Delivery not found", triggered_by: "any /roi/deliveries/{id} route with an unknown id" }
  - { error_id: ERR_DENIAL_NOT_FOUND, http_code: 404, message: "Denial decision not found", triggered_by: "any /roi/denials/{id} route with an unknown id" }
  - { error_id: ERR_AMENDMENT_NOT_FOUND, http_code: 404, message: "Amendment request not found", triggered_by: "any /roi/amendment-requests/{id} route with an unknown id" }

  # ---- optimistic concurrency
  - { error_id: ERR_STALE_REQUEST_VERSION, http_code: 412, message: "Request has changed since it was read", triggered_by: "POST /roi/invoices whose expected_request_version does not equal Request.version" }
  - { error_id: ERR_STALE_PATIENT_VERSION, http_code: 412, message: "Patient has changed since it was read", triggered_by: "POST /roi/authorizations whose expected_patient_version does not equal Patient.version" }

  # ---- own-entity state
  - { error_id: ERR_REQUEST_STATE_INVALID, http_code: 409, message: "Request is not in a state that permits this operation", triggered_by: "any request transition attempted from outside its declared from-state set" }
  - { error_id: ERR_SEGMENT_STATE_INVALID, http_code: 409, message: "Record segment is not in a state that permits this operation", triggered_by: "disposition on an already dispositioned segment, redaction on a segment that is not OPEN or REWORK, redaction-decision on a segment that is not APPLIED" }
  - { error_id: ERR_AUTHORIZATION_STATE_INVALID, http_code: 409, message: "Authorization is not in a state that permits this operation", triggered_by: "revoke on a REVOKED, EXPIRED or SUPERSEDED authorization; cure on an authorization that is not DEFECTIVE" }
  - { error_id: ERR_INVOICE_STATE_INVALID, http_code: 409, message: "Invoice is not in a state that permits this operation", triggered_by: "issue on a non-DRAFT invoice; PAY or WAIVE on an invoice that is not ISSUED; any settlement on a PAID or VOIDED invoice" }
  - { error_id: ERR_DELIVERY_STATE_INVALID, http_code: 409, message: "Delivery is not in a state that permits this operation", triggered_by: "transmission on a CONFIRMED, RETURNED or SENT delivery; confirm on a delivery that is not SENT" }
  - { error_id: ERR_REVIEW_STATE_INVALID, http_code: 409, message: "Review is not in a state that permits this action", triggered_by: "denial review or amendment decision requested from outside the action's from-state set; resubmission on an amendment that is not INFO_REQUESTED" }

  # ---- cross-entity state
  - { error_id: ERR_FACILITY_SUSPENDED, http_code: 409, message: "Facility is suspended", triggered_by: "POST /roi/requests or an ACCEPT intake decision while the governing Facility.status == SUSPENDED" }
  - { error_id: ERR_AUTHORIZATION_NOT_VALID, http_code: 409, message: "Governing authorization is not valid", triggered_by: "an ACCEPT intake decision on a third-party request whose Authorization.status != VALID" }
  - { error_id: ERR_AUTHORIZATION_EXPIRED, http_code: 409, message: "Governing authorization has lapsed", triggered_by: "an ACCEPT intake decision or a sensitive review on a third-party request whose Authorization.expires_at <= the current logical clock" }
  - { error_id: ERR_REQUEST_NOT_RELEASE_READY, http_code: 409, message: "Request has not reached the required fulfillment state", triggered_by: "POST /roi/invoices or issue on a request outside {RELEASE_READY, RELEASED}; POST /roi/deliveries on a request that is not RELEASED" }

  # ---- disclosure safety
  - { error_id: ERR_PSYCHOTHERAPY_NOTES_NOT_RELEASABLE, http_code: 422, message: "Psychotherapy notes may not be released", triggered_by: "a sensitive-review decision asking to INCLUDE a PSYCHOTHERAPY_NOTES segment" }
  - { error_id: ERR_SENSITIVE_CATEGORY_NOT_AUTHORIZED, http_code: 422, message: "Authorization does not cover this protected category", triggered_by: "a sensitive-review INCLUDE for a category outside Authorization.sensitive_categories_authorized on a third-party request" }
  - { error_id: ERR_PART2_ACK_MISSING, http_code: 422, message: "Part 2 redisclosure prohibition has not been acknowledged", triggered_by: "a sensitive-review INCLUDE of a SUD_PART2 segment on a third-party request whose authorization lacks the acknowledgement" }
  - { error_id: ERR_UNENCRYPTED_DELIVERY_NOT_DIRECTED, http_code: 422, message: "Unsecured transmission requires patient direction", triggered_by: "POST /roi/deliveries with UNENCRYPTED_EMAIL or encryption NONE without a patient-directed right-of-access request" }
  - { error_id: ERR_FAX_NOT_PERMITTED, http_code: 422, message: "Fax may not carry these protected categories", triggered_by: "POST /roi/deliveries with FAX while an included segment is SUD_PART2, HIV or GENETIC" }

  # ---- referential business rules
  - { error_id: ERR_RECIPIENT_NOT_DESIGNATED, http_code: 422, message: "Recipient endpoint is not the designated recipient", triggered_by: "POST /roi/deliveries on a third-party request to an endpoint other than Authorization.designated_recipient_endpoint" }
  - { error_id: ERR_PATIENT_IDENTITY_MISMATCH, http_code: 422, message: "Requester is not the named patient", triggered_by: "POST /roi/requests where the PATIENT requester's patient_id differs from the body's; POST /roi/amendment-requests where patient_id differs from Request.patient_id" }
  - { error_id: ERR_ACCESS_BASIS_REQUESTER_MISMATCH, http_code: 422, message: "Requester type is incompatible with the access basis", triggered_by: "POST /roi/requests with PATIENT_RIGHT_OF_ACCESS and a requester_type outside {PATIENT, PERSONAL_REPRESENTATIVE}" }
  - { error_id: ERR_AUTHORIZATION_REQUIRED, http_code: 422, message: "Access basis and authorization do not agree", triggered_by: "POST /roi/requests with THIRD_PARTY_AUTHORIZATION and no authorization_id, PATIENT_RIGHT_OF_ACCESS with one, or an authorization naming a different patient or requester" }
  - { error_id: ERR_AMENDMENT_TARGET_NOT_RELEASED, http_code: 422, message: "Amendment target has not been disclosed", triggered_by: "POST /roi/amendment-requests against a segment whose parent request has never been released, or whose retrieval_status is not RETRIEVED" }

  # ---- constraints
  - { error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http_code: 409, message: "Overlapping authorization coverage for this patient and requester", triggered_by: "POST /roi/authorizations whose [signed_at, expires_at) overlaps a live authorization on the same patient, requester and an intersecting scope, and which does not supersede it" }
  - { error_id: ERR_LEGACY_ARCHIVE_DISABLED, http_code: 422, message: "Legacy archive retrieval is not enabled for this facility", triggered_by: "POST /roi/record-segments with source_system LEGACY_ARCHIVE on a facility whose legacy_archive_enabled is false" }
  - { error_id: ERR_LEGACY_WINDOW_CONTENTION, http_code: 409, message: "Legacy gateway window contends with a live job", triggered_by: "POST /roi/record-segments whose buffered legacy window touches or overlaps another live legacy job on the same facility" }
  - { error_id: ERR_DUPLICATE_MRN, http_code: 409, message: "Medical record number already exists at this facility", triggered_by: "POST /roi/patients repeating a (facility_id, mrn) pair" }
  - { error_id: ERR_DUPLICATE_STATE_FEE_RULE, http_code: 409, message: "State fee rule already exists", triggered_by: "POST /roi/state-fee-rules repeating a state_code" }
  - { error_id: ERR_DUPLICATE_INFLIGHT_REQUEST, http_code: 409, message: "An identical request is already in flight", triggered_by: "POST /roi/requests repeating facility, patient, requester and date range while an earlier request is non-terminal and is not named as the predecessor" }
  - { error_id: ERR_EXTENSION_NOT_AVAILABLE, http_code: 409, message: "Statutory extension is not available", triggered_by: "POST /roi/requests/{id}/extension when it was already noticed, when extension_days is 0, or after statutory_due_at has passed" }
  - { error_id: ERR_SEGMENTS_PENDING, http_code: 409, message: "Compilation is incomplete", triggered_by: "POST /roi/requests/{id}/complete-compilation with no segments, or with a segment still PENDING" }
  - { error_id: ERR_SEGREGATION_REVIEW_INCOMPLETE, http_code: 409, message: "Sensitive review must decide every segregated segment exactly once", triggered_by: "POST /roi/requests/{id}/sensitive-review omitting a segregated segment, repeating one, or naming a segment that is not segregated" }
  - { error_id: ERR_REDACTION_PAGE_COUNT_INVALID, http_code: 422, message: "Redacted page count exceeds the segment page count", triggered_by: "POST /roi/record-segments/{id}/redaction with redacted_page_count > page_count" }
  - { error_id: ERR_REDACTION_NOT_APPROVED, http_code: 409, message: "A redaction is still open on this request", triggered_by: "POST /roi/requests/{id}/release or POST /roi/invoices while a segment is OPEN, APPLIED or REWORK" }
  - { error_id: ERR_DELIVERY_ATTEMPT_LIMIT, http_code: 409, message: "Transmission attempt limit reached", triggered_by: "POST /roi/deliveries/{id}/transmission once attempt_count has reached MAX_DELIVERY_ATTEMPTS" }
  - { error_id: ERR_DELIVERY_ALREADY_EXISTS, http_code: 409, message: "A live delivery already exists for this request", triggered_by: "POST /roi/deliveries while another delivery for the request is PENDING, SENT or FAILED" }
  - { error_id: ERR_DENIAL_NOT_REVIEWABLE, http_code: 422, message: "This denial ground is not subject to review", triggered_by: "POST /roi/denials/{id}/review with START_REVIEW or OVERTURN on a denial whose reviewable is false" }

  # ---- fiscal
  - { error_id: ERR_INVOICE_ALREADY_EXISTS, http_code: 409, message: "This request already has a settled or issued invoice", triggered_by: "POST /roi/invoices while an invoice for the request is ISSUED, PAID or WAIVED" }
  - { error_id: ERR_NOTHING_TO_INVOICE, http_code: 422, message: "There is nothing billable on this request", triggered_by: "POST /roi/invoices on a NOT_BILLABLE request, or one whose computed subtotal is 0" }
  - { error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_code: 422, message: "Payment must settle the full amount due", triggered_by: "POST /roi/invoices/{id}/settlement with action PAY and amount_cents != amount_due_cents" }
  - { error_id: ERR_INVOICE_UNSETTLED, http_code: 402, message: "Records may not be released before the invoice is settled", triggered_by: "POST /roi/requests/{id}/release while billing_status is PENDING_INVOICE or INVOICED" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    identity: opaque
    description: "Vendor platform operator: configures fee rules and facilities, drives the compliance sweep and the logical clock"
    exclusive_operations:
      - "POST /roi/state-fee-rules"
      - "POST /roi/facilities"
      - "POST /roi/facilities/{id}/status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /roi/patients (with FacilityAdmin)"
      - "POST /roi/requesters (with IntakeSpecialist)"
      - "POST /roi/compliance-sweeps (with PrivacyOfficer)"
      - "every GET route except the requester-scoped list narrowing"
    forbidden_operations:
      - "every Request lifecycle write: intake-decision, extension, complete-compilation, sensitive-review, release, withdraw"
      - "every RecordSegment, Invoice, Delivery, denial and amendment write"

  - name: FacilityAdmin
    identity: entity_backed:Facility
    description: "Acts for one covered entity; X-User-ID is the Facility.id"
    exclusive_operations: []
    shared_operations:
      - "POST /roi/patients (with PlatformAdmin)"
      - "every staff GET route"
    forbidden_operations:
      - "POST /roi/facilities and POST /roi/facilities/{id}/status"
      - "every Request, Authorization, RecordSegment, Invoice, Delivery, denial and amendment write"

  - name: IntakeSpecialist
    identity: opaque
    description: "Takes requests in, validates authorizations, cures defects, notices extensions"
    exclusive_operations:
      - "POST /roi/requests"
      - "POST /roi/requests/{id}/intake-decision"
      - "POST /roi/requests/{id}/extension"
      - "POST /roi/authorizations/{id}/cure"
    shared_operations:
      - "POST /roi/requesters (with PlatformAdmin)"
      - "POST /roi/authorizations (with PrivacyOfficer)"
      - "every staff GET route"
    forbidden_operations:
      - "POST /roi/requests/{id}/release  (and, by segregation of duties, no user may release a request it took in)"
      - "every RecordSegment, Invoice, Delivery, denial and amendment write"

  - name: RecordsAnalyst
    identity: opaque
    description: "Compiles the record set across source systems and applies redactions"
    exclusive_operations:
      - "POST /roi/record-segments"
      - "POST /roi/record-segments/{id}/disposition"
      - "POST /roi/record-segments/{id}/redaction"
      - "POST /roi/requests/{id}/complete-compilation"
    shared_operations:
      - "every staff GET route"
    forbidden_operations:
      - "POST /roi/record-segments/{id}/redaction-decision  (and no user may approve a redaction it applied)"
      - "POST /roi/requests/{id}/sensitive-review, /release"
      - "every Invoice, Delivery, denial and amendment write"

  - name: ReleaseReviewer
    identity: opaque
    description: "Decides segregated segments, approves redactions, releases and transmits"
    exclusive_operations:
      - "POST /roi/requests/{id}/sensitive-review"
      - "POST /roi/requests/{id}/release"
      - "POST /roi/record-segments/{id}/redaction-decision"
      - "POST /roi/deliveries"
      - "POST /roi/deliveries/{id}/transmission"
    shared_operations:
      - "POST /roi/deliveries/{id}/confirm (with Requester)"
      - "every staff GET route"
    forbidden_operations:
      - "POST /roi/record-segments and its disposition/redaction routes"
      - "every Invoice write, every denial and amendment write"

  - name: BillingClerk
    identity: opaque
    description: "Prices, issues and settles invoices"
    exclusive_operations:
      - "POST /roi/invoices"
      - "POST /roi/invoices/{id}/issue"
      - "POST /roi/invoices/{id}/settlement"
    shared_operations:
      - "every staff GET route"
    forbidden_operations:
      - "every Request lifecycle write, every RecordSegment write, every Delivery write, every denial and amendment write"

  - name: PrivacyOfficer
    identity: opaque
    description: "Issues and reviews denials, revokes authorizations, decides amendments"
    exclusive_operations:
      - "POST /roi/denials"
      - "POST /roi/denials/{id}/review"
      - "POST /roi/amendment-requests/{id}/decision"
    shared_operations:
      - "POST /roi/authorizations (with IntakeSpecialist)"
      - "POST /roi/authorizations/{id}/revoke (with Requester)"
      - "POST /roi/compliance-sweeps (with PlatformAdmin)"
      - "every staff GET route"
    forbidden_operations:
      - "every Request lifecycle write, every RecordSegment write, every Invoice write, every Delivery write"
      - "POST /roi/amendment-requests and /resubmission"

  - name: Requester
    identity: entity_backed:Requester
    description: "The requesting party; X-User-ID is the Requester.id and every read is narrowed to its own requests"
    exclusive_operations:
      - "POST /roi/requests/{id}/withdraw"
      - "POST /roi/amendment-requests"
      - "POST /roi/amendment-requests/{id}/resubmission"
    shared_operations:
      - "POST /roi/authorizations/{id}/revoke (with PrivacyOfficer)"
      - "POST /roi/deliveries/{id}/confirm (with ReleaseReviewer)"
      - "GET on requesters/{id}, authorizations, requests, turnaround, invoices, invoice lines, deliveries, denials and amendment requests — always narrowed to its own"
    forbidden_operations:
      - "every configuration write"
      - "POST /roi/requests, intake-decision, extension, complete-compilation, sensitive-review, release"
      - "every RecordSegment write, every Invoice write, POST /roi/deliveries, /transmission"
      - "POST /roi/denials and /roi/denials/{id}/review, POST /roi/amendment-requests/{id}/decision"
      - "GET /roi/facilities, /roi/patients, /roi/record-segments, /roi/state-fee-rules, /roi/requests/{id}/compliance-events"

segregation_of_duties:
  - step_pair: "intake (POST /roi/requests) and release (POST /roi/requests/{id}/release)"
    tracked_field: "Request.intake_user_id vs X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - step_pair: "apply redaction (POST /roi/record-segments/{id}/redaction) and approve it (POST /roi/record-segments/{id}/redaction-decision)"
    tracked_field: "RecordSegment.redaction_applied_by_user_id vs X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - step_pair: "issue a denial (POST /roi/denials) and review it (POST /roi/denials/{id}/review)"
    tracked_field: "DenialDecision.issued_by_user_id vs X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES

# =============================================================================
# Named constants referenced across the tables
# =============================================================================
constants:
  SECONDS_PER_DAY: 86400
  MAX_TOLL_SECONDS: 864000          # 10 whole days of authorization-defect tolling
  MILLICENTS_PER_CENT: 1000
  GRACE_BUSINESS_DAYS: 2            # forgiven by CONTRACTUAL_SAFE_HARBOR only
  MAX_DELIVERY_ATTEMPTS: 3
  REVIEW_WINDOW_DAYS: 30            # DenialDecision.review_due_at = issued_at + 30 days
  AMENDMENT_WINDOW_DAYS: 60         # AmendmentRequest.decision_due_at = created_at + 60 days
  ROUNDING_MODE: round_half_up      # applied per InvoiceLine, never to a subtotal
