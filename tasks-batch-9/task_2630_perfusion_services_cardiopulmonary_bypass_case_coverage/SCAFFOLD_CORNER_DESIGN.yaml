      - name: case_list_paginates_filters_and_rejects_bad_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /bypass-cases]
          - validations[priority=8]
          - errors.ERR_INVALID_PAGINATION
          - complexity_profile.complexity_layers.pagination_with_filtering
        distinguishing_aspect: |
          The list contract on the busiest collection: limit/offset drive a stable partition of the
          result set with total_count reporting the filtered - not the paged - size, has_more derived
          from offset + returned < total_count, and the declared bounds (limit 1..100, offset >= 0)
          enforced with 400 ERR_INVALID_PAGINATION rather than silent clamping. The filter probe
          additionally proves total_count follows the filter, which is where naive implementations
          leak the unfiltered count.
        test_recipe:
          setup:
            - "Contract c1, surgeon s1 with an ACTIVE CABG card, perfusionist p1 with a PRIMARY_CALL slot across the horizon, and three cases created in order: caseA [08-02 06:00, 12:00) ELECTIVE, caseB [08-02 14:00, 18:00) URGENT, caseC [08-03 06:00, 12:00) ELECTIVE."
