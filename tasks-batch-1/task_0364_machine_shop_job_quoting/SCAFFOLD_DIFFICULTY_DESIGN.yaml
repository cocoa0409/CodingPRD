              captures: { op_status: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == CANCELLED"
            - "MaterialLot.${lot_id}.qty_remaining == 4"
            - "MaterialLot.${lot_id}.status == AVAILABLE"
            - "MachineSlot.${slot_id}.status == RELEASED"
            - "RoutingOp.${op1_id}.status == PLANNED"

      - name: rfq_cancel_cascade_depth2_rejects_quotes
        grounds:
          - state_machines.RFQ.SUBMITTED_to_CANCELLED
          - state_machines.Quote.PRICED_to_REJECTED
          - entities.Quote.fields.status
          - entities.Quote.fields.rejection_reason
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (RFQ cancel, not WO cancel):
          (1) RFQ SUBMITTED->CANCELLED; (2) that cascade rejects every DRAFT/PRICED
          Quote of the RFQ with rejection_reason='RFQ cancelled'. Originates from
