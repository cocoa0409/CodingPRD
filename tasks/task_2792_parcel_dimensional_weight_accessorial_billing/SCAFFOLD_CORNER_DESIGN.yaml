            - "${net1} == 116227 after the first credit and ${net2} == 54012 after the second — both were accepted because 178442 - 62215 and 116227 - 62215 stay non-negative"
            - "The -62216 proposal returns HTTP 422 with ${err_line} == ERR_ADJUSTMENT_EXCEEDS_LINE — priority 54 fires first because the credit exceeds its own 62215 line"
            - "The -62215 proposal returns HTTP 422 with ${err_net} == ERR_CREDIT_EXCEEDS_INVOICE_NET — the line check passes at equality, then the aggregate check fails because 54012 - 62215 == -8203"
            - "Invoice.${inv}.net_amount_cents is still 54012, status ADJUSTED, pending_adjustment_count == 0, and GET /billing-adjustments returns total_count == 2 (both APPLIED)"
            - "ShipperAccount.${sh}.credit_balance_cents == 124430 and open_charges_cents == 54012"
