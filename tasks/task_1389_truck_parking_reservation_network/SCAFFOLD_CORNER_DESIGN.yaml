      - name: stall_out_of_service_reassignment_and_cancellation_fallback
        claim_type: cascade_down
        grounds: [state_machines.Stall.ACTIVE_to_OUT_OF_SERVICE, calculations.stall_assignment_selector]
        distinguishing_aspect: "Future BOOKED bookings on an out-of-service stall are reassigned to the lowest-numbered eligible stall; with no eligible stall the booking is CANCELLED with fee waived."
        test_recipe:
          setup: ["site with 2 reservable stalls R01/R02; B1 (driver X, arrival 2026-08-10) on R01; site2 with 1 reservable stall and B2 (driver Y) on it"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s2: $.data.id } }
            - { call: "POST /sites", payload: { name: "T", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site2_id: $.data.id } }
            - { call: "POST /sites/${site2_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { t1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-RA", full_name: "R Aye" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-RB", full_name: "R Bee" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site2_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id } }
          trigger:
            - { call: "PATCH /sites/${site_id}/stalls/${s1}", payload: { status: "OUT_OF_SERVICE" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "PATCH /sites/${site2_id}/stalls/${t1}", payload: { status: "OUT_OF_SERVICE" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { b1s: $.data.status, b1stall: $.data.stall_id } }
            - { call: "GET /bookings/${b2}", payload: {}, as: NetworkAdmin, captures: { b2s: $.data.status, b2b: $.data.billing_status, b2f: $.data.fee_cents } }
          assert:
            - "B1 reassigned: status stays BOOKED, stall_id == ${s2} (R02, lowest eligible)"
            - "B2 had no eligible stall: status == CANCELLED, billing_status == WAIVED, fee_cents == 0"

