      - name: aggregate_return_count_exactly_at_threshold_rejects_paper
        grounds:
          - calculations.transmission_channel_requirement
          - validations[priority=43]
          - entities.Transmittal.fields.required_channel
          - state_machines.Transmittal.BUILT_to_DRAFT
