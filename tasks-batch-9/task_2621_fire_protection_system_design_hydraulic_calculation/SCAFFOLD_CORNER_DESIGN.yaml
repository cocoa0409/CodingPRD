      - name: missing_and_unrecognised_identity_headers_are_separated_from_each_other
        claim_type: forbidden_operations
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_IDENTITY_NOT_RECOGNIZED
          - complexity_profile.role_model
        distinguishing_aspect: |
          Three different auth failures on the same endpoint return three different codes in priority
          order: no role header at all is 401 ERR_UNAUTHENTICATED, a well-formed DesignEngineer whose
          X-User-ID names no Engineer is 403 ERR_IDENTITY_NOT_RECOGNIZED, and an AhjReviewer header
          carrying a perfectly valid ENGINEER id is also 403 - the identity must exist in the table the
          role is backed by, not merely somewhere in the system. The opaque roles FirmAdmin and
          Contractor are exempt from the priority 3 check entirely, which the successful fourth call
          shows by creating a sheet with no entity-backed identity at all.
        test_recipe:
          setup:
            - "Project FP-2601 with HC-1 SEALED, engineer Dana Ruiz ${e1} and reviewer Marisol Vega ${r1}"
          setup_api_calls:
            - call: "POST /engineers"
