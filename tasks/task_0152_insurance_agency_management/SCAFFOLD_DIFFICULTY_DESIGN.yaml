              as: AgencyAdmin
              captures: { lic1_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-12-15T00:00:00Z", expiration_date: "2026-12-15T00:00:00Z" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LICENSE_OVERLAP (new [2025-12-15,2026-12-15) intersects existing [2025-01-01,2026-01-01))"

      - name: renewal_successor_term_must_be_adjacent
        grounds:
          - validations[priority=23]
          - state_machines.RenewalTask.OFFERED_to_COMPLETED
          - entities.Policy.fields.effective_date
          - errors[ERR_RENEWAL_TERM_NOT_ADJACENT]
        distinguishing_aspect: |
          Adjacency (gap-zero, not intersection) semantics on the Policy resource:
          a successor renewal term whose effective_date (2027-01-02) does not equal
          the expiring policy's expiration_date (2027-01-01) leaves a gap and is
          rejected with ERR_RENEWAL_TERM_NOT_ADJACENT — different interval geometry
          and different entity than the License overlap rule.
        test_recipe:
          setup:
            - "An ACTIVE policy term 2026-01-01..2027-01-01 in renewal window with a RenewalTask in OFFERED; clock 2026-11-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
