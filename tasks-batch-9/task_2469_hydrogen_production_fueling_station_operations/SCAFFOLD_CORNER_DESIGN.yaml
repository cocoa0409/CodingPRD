          - errors.ERR_PRESSURE_CLASS_UNSUPPORTED
          - entities.Station.fields.max_pressure_class
        distinguishing_aspect: |
          The rule is one-directional: an H35 station must refuse an H70 target but still accept an
          H35 one. Both calls hit the same station with the same posture and inventory, so only the
          conditional class comparison can explain the different outcomes.
