# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Public-Meeting & Open-Records Portal — 9 rules x 2 instances = 18
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_estimate_vs_assessed_divergence
        grounds:
          - calculations.estimated_fee
          - calculations.assessed_fee
          - entities.RecordsRequest.fields.estimated_fee_cents
          - entities.RecordsRequest.fields.assessed_fee_cents
        distinguishing_aspect: "Same request yields estimated_fee_cents=7750 (forward-looking, copy over declared 600 pages, no labor) but assessed_fee_cents=2800 (aggregation over actual released docs + labor); the two numbers differ on the RecordsRequest fee domain."
        test_recipe:
          setup:
            - "Requester r1 registered; PublicBody b (seat_count 5, quorum 2)."
            - "RecordsRequest submitted with estimated_page_count=600 -> estimated_fee_cents=7750."
            - "Request UNDER_REVIEW; two docs (30pp/20min, 40pp/50min) both RELEASED."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Rey Q", email: "rey@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "City Council", jurisdiction_state: "TX", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Emails", description: "All emails", estimated_page_count: 600 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id, est_fee: $.data.estimated_fee_cents }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "D1", page_count: 30, review_minutes: 20, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { doc1_id: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${doc1_id}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${doc1_id}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "D2", page_count: 40, review_minutes: 50, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { doc2_id: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${doc2_id}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${doc2_id}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "GET /records-requests/${req_id}"
              payload: {}
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "GRANTED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
          assert:
            - "RecordsRequest.${req_id}.estimated_fee_cents == 7750"
            - "RecordsRequest.${req_id}.assessed_fee_cents == 2800"
            - "RecordsRequest.${req_id}.estimated_fee_cents != RecordsRequest.${req_id}.assessed_fee_cents"

      - name: motion_simple_vs_absolute_majority
        grounds:
          - calculations.vote_tally
          - entities.Motion.fields.vote_threshold
          - entities.Motion.fields.outcome
          - entities.PublicBody.fields.seat_count
        distinguishing_aspect: "Identical ballots (2 YEA, 1 NAY) on a 5-seat body yield outcome=CARRIED under SIMPLE (2>1) but outcome=FAILED under ABSOLUTE (2*2=4 not > seat_count 5); dual-variant on the Motion governance domain."
        test_recipe:
          setup:
            - "Body seat_count 5, quorum 3; members m1(preside),m2,m3; EMERGENCY meeting convened, present [m1,m2,m3]."
            - "ACTION agenda item OPEN; two motions moved on it, one SIMPLE one ABSOLUTE."
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Council A", jurisdiction_state: "CA", seat_count: 5, quorum_size: 3 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Chamber" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M3", seat_number: 3 }
              as: Clerk
              captures: { m3_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Emergency", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}", "${m3_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/agenda-items"
              payload: { title: "Budget", sequence: 1, item_type: "ACTION" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /agenda-items/${item_id}/motions"
              payload: { text: "Adopt budget (simple)", moved_by_member_id: "${m1_id}", seconded_by_member_id: "${m2_id}", vote_threshold: "SIMPLE" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { mo_simple_id: $.data.id }
            - call: "POST /motions/${mo_simple_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_simple_id}/votes"
              payload: { member_id: "${m1_id}", value: "YEA" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_simple_id}/votes"
              payload: { member_id: "${m2_id}", value: "YEA" }
              as: BodyMember
              as_user_id: "${m2_id}"
            - call: "POST /motions/${mo_simple_id}/votes"
              payload: { member_id: "${m3_id}", value: "NAY" }
              as: BodyMember
              as_user_id: "${m3_id}"
            - call: "POST /agenda-items/${item_id}/motions"
              payload: { text: "Adopt budget (absolute)", moved_by_member_id: "${m1_id}", seconded_by_member_id: "${m2_id}", vote_threshold: "ABSOLUTE" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { mo_abs_id: $.data.id }
            - call: "POST /motions/${mo_abs_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_abs_id}/votes"
              payload: { member_id: "${m1_id}", value: "YEA" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_abs_id}/votes"
              payload: { member_id: "${m2_id}", value: "YEA" }
              as: BodyMember
              as_user_id: "${m2_id}"
            - call: "POST /motions/${mo_abs_id}/votes"
              payload: { member_id: "${m3_id}", value: "NAY" }
              as: BodyMember
              as_user_id: "${m3_id}"
          trigger:
            - call: "POST /motions/${mo_simple_id}/transition"
              payload: { to_status: "CLOSED" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_abs_id}/transition"
              payload: { to_status: "CLOSED" }
              as: BodyMember
              as_user_id: "${m1_id}"
          assert:
            - "Motion.${mo_simple_id}.outcome == CARRIED"
            - "Motion.${mo_simple_id}.status == CARRIED"
            - "Motion.${mo_abs_id}.outcome == FAILED"
            - "Motion.${mo_abs_id}.status == FAILED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: copy_fee_tiered_nonlinear
        grounds:
          - calculations.copy_fee
          - calculations.assessed_fee
          - entities.ResponsiveDocument.fields.billable_pages
        distinguishing_aspect: "Mode (a): copy_fee(600 billable pages) = tier1 min(550,450)=450*15 + tier2 100*10 = 6750+1000 = 7750, exercising nested max/min tier selection with >=3 inputs; labor 0."
        test_recipe:
          setup:
            - "Request UNDER_REVIEW; single 600-page doc, 0 review minutes, RELEASED."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Cara", email: "cara@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Board B", jurisdiction_state: "NY", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Big", description: "Large set", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "Big Doc", page_count: 600, review_minutes: 0, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { doc_id: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "GET /records-requests/${req_id}"
              payload: {}
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "GRANTED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
          assert:
            - "RecordsRequest.${req_id}.assessed_fee_cents == 7750"

      - name: labor_fee_increment_rounding_order
        grounds:
          - calculations.labor_fee
          - calculations.assessed_fee
          - entities.ResponsiveDocument.fields.review_minutes
        distinguishing_aspect: "Mode (b): round-per-document-then-sum. Two docs of 20 and 50 min -> ceil to [30,60]=90, minus 30 free = 60 min = 2500 cents; sum-then-round (70->75) would give 1875, so the pinned order is observable. Copy fee 0 (20 total pages < 50 free)."
        test_recipe:
          setup:
            - "Request UNDER_REVIEW; two docs 10pp/20min and 10pp/50min, both RELEASED."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Lee", email: "lee@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Board C", jurisdiction_state: "WA", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Labor", description: "Two docs", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "L1", page_count: 10, review_minutes: 20, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { d1: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${d1}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${d1}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "L2", page_count: 10, review_minutes: 50, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { d2: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${d2}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${d2}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "GET /records-requests/${req_id}"
              payload: {}
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "GRANTED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
          assert:
            - "RecordsRequest.${req_id}.assessed_fee_cents == 2500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: motion_tabled_reconsider_cycle
        grounds:
          - state_machines.Motion.OPEN_to_TABLED
          - state_machines.Motion.TABLED_to_OPEN
        distinguishing_aspect: "Motion cycles OPEN -> TABLED -> OPEN (reconsideration), a non-linear cycle on the Motion entity; existing ballots are retained across the loop."
        test_recipe:
          setup:
            - "EMERGENCY meeting convened present [m1,m2]; ACTION item OPEN; motion moved and OPEN."
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Council D", jurisdiction_state: "OR", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Hall" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "M", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/agenda-items"
              payload: { title: "Item", sequence: 1, item_type: "ACTION" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /agenda-items/${item_id}/motions"
              payload: { text: "Motion X", moved_by_member_id: "${m1_id}", seconded_by_member_id: "${m2_id}" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /motions/${mo_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_id}/transition"
              payload: { to_status: "TABLED" }
              as: BodyMember
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /motions/${mo_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
          assert:
            - "Motion.${mo_id}.status == OPEN"

      - name: appeal_branch_overturned_mutates_request
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED
          - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
          - state_machines.RecordsRequest.DENIED_to_GRANTED
        distinguishing_aspect: "Appeal fork UNDER_REVIEW -> {UPHELD | OVERTURNED | REMANDED}: the OVERTURNED branch mutates the parent request DENIED -> GRANTED, a divergent side-effect the UPHELD branch does not perform."
        test_recipe:
          setup:
            - "Request DENIED by officer-1; appeal FILED then UNDER_REVIEW by appeals-9 (SoD ok)."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Ida", email: "ida@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Board E", jurisdiction_state: "IL", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Deny me", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "DENIED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-requests/${req_id}/appeals"
              payload: { grounds: "Wrongful denial" }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /records-requests/${req_id}/appeals/${appeal_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: AppealsOfficer
              as_user_id: "appeals-9"
          trigger:
            - call: "POST /records-requests/${req_id}/appeals/${appeal_id}/transition"
              payload: { to_status: "OVERTURNED" }
              as: AppealsOfficer
              as_user_id: "appeals-9"
          assert:
            - "Appeal.${appeal_id}.status == OVERTURNED"
            - "Appeal.${appeal_id}.decision == OVERTURNED"
            - "RecordsRequest.${req_id}.status == GRANTED"
            - "RecordsRequest.${req_id}.decision == GRANTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: meeting_cancel_depth3_item_motion
        grounds:
          - state_machines.Meeting.IN_SESSION_to_CANCELLED
          - state_machines.AgendaItem.OPEN_to_CANCELLED
          - state_machines.Motion.DRAFT_to_VOIDED
          - state_machines.SpeakerSlip.QUEUED_to_WITHDRAWN
        distinguishing_aspect: "Depth-3 chain: Meeting CANCELLED -> AgendaItem CANCELLED (link1) -> that item cancellation voids its Motion (link2) and withdraws its SpeakerSlip; each link is caused by the previous entity's transition, not by the meeting cancel directly."
        test_recipe:
          setup:
            - "EMERGENCY meeting IN_SESSION present [m1,m2]; ACTION item OPEN; motion DRAFT under it; speaker slip QUEUED under it."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Pam", email: "pam@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Council F", jurisdiction_state: "CO", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room F" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Cancelme", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/agenda-items"
              payload: { title: "Ordinance", sequence: 1, item_type: "ACTION", public_comment_enabled: true }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /agenda-items/${item_id}/motions"
              payload: { text: "Adopt ordinance", moved_by_member_id: "${m1_id}", seconded_by_member_id: "${m2_id}" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/speaker-slips"
              payload: { requester_id: "${r1_id}", speaker_name: "Pam" }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { slip_id: $.data.id }
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: Clerk
          assert:
            - "Meeting.${meeting_id}.status == CANCELLED"
            - "AgendaItem.${item_id}.status == CANCELLED"
            - "Motion.${mo_id}.status == VOIDED"
            - "SpeakerSlip.${slip_id}.status == WITHDRAWN"

      - name: request_withdraw_depth2_documents
        grounds:
          - state_machines.RecordsRequest.UNDER_REVIEW_to_WITHDRAWN
          - state_machines.ResponsiveDocument.IDENTIFIED_to_CANCELLED
          - entities.RecordsRequest.fields.fee_balance_cents
        distinguishing_aspect: "Depth-2 chain from a different trigger (request withdraw): RecordsRequest WITHDRAWN -> its ResponsiveDocument CANCELLED and assessed/fee_balance reset to 0."
        test_recipe:
          setup:
            - "Request UNDER_REVIEW; one document IDENTIFIED."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Tom", email: "tom@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Board G", jurisdiction_state: "AZ", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Withdraw", description: "x", estimated_page_count: 10 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "DocW", page_count: 10, review_minutes: 5, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: Requester
              as_user_id: "${r1_id}"
          assert:
            - "RecordsRequest.${req_id}.status == WITHDRAWN"
            - "ResponsiveDocument.${doc_id}.status == CANCELLED"
            - "RecordsRequest.${req_id}.fee_balance_cents == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: convene_notice_temporal_before_quorum_constraint
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - state_machines.Meeting.NOTICED_to_IN_SESSION
        distinguishing_aspect: "At convene a meeting fails BOTH notice compliance (business_temporal, priority 10) and quorum (business_constraint, priority 11); the temporal error ERR_NOTICE_NONCOMPLIANT wins over ERR_QUORUM_NOT_MET."
        test_recipe:
          setup:
            - "REGULAR meeting scheduled 2026-06-01T18:00:00Z; notice posted at 2026-05-29T19:00:00Z (lead 71h < 72h)."
            - "Convene attempted with only m1 present (quorum_size 2)."
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Council H", jurisdiction_state: "GA", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room H" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Regular", meeting_type: "REGULAR", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T20:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-29T19:00:00Z" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOTICE_NONCOMPLIANT"
            - "http_status == 409"

      - name: dispose_state_before_retention_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.ResponsiveDocument.RELEASED_to_DISPOSED
        distinguishing_aspect: "Disposing a document that is IDENTIFIED (not a legal from-state) while retention has also not elapsed fails on state (ERR_INVALID_STATE, priority 9) before the temporal retention check (ERR_RETENTION_NOT_ELAPSED, priority 10) — a different category pair than the convene conflict."
        test_recipe:
          setup:
            - "Request UNDER_REVIEW; one document still IDENTIFIED; logical clock at default 2026-05-01 (retention not elapsed)."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Uma", email: "uma@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Board I", jurisdiction_state: "OH", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Ret", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "DocR", page_count: 5, review_minutes: 0, retention_series: "PERMANENT" }
              as: RecordsOfficer
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "DISPOSED" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: notice_lead_exactly_72h_convene_succeeds
        grounds:
          - calculations.notice_lead_hours
