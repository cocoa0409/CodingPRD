              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "after the RECORD_RETEST_RESULT call Finding.${fH_id}.state == RETEST_FAILED and Finding.${fH_id}.retest_failure_count == 1"
            - "Finding.${fH_id}.escalated == false because severity is HIGH, not CRITICAL, even though the threshold arithmetic ran"
            - "after the second ASSIGN call Finding.${fH_id}.state == REMEDIATION_ASSIGNED — a state the row already occupied once"
            - "Finding.${fH_id}.retest_failure_count == 1 after the loop closes, and retest_exercise_id is still ${exG_id}"
            - "RecoveryGroup.${g1_id}.open_finding_count == 1 throughout, since every visited state is non-terminal"
            - "RecoveryGroup.${g1_id}.posture == READY throughout — a non-escalated finding never freezes the group"

  # =====================================================================
  # RULE 4 — transitive cascades from three different triggers
  #   A: re-tiering an application        (depth 6)
  #   B: a failed re-test on a CRITICAL finding (depth 5)
  #   C: suspending a step owner          (depth 4)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_retier_invalidates_step_stales_runbook_restricts_group_reverts_schedule_releases_capacity
        grounds:
          - state_machines.Application.AGREED_to_TIER_PROPOSED
          - state_machines.RunbookStep.VALIDATED_to_INVALIDATED
          - state_machines.Runbook.VALIDATED_to_STALE
          - state_machines.RecoveryGroup.READY_to_RESTRICTED
          - state_machines.Exercise.SCHEDULED_to_SCOPED
          - calculations.site_reserved_capacity_units
        distinguishing_aspect: |
          Trigger: re-proposing a tier on an AGREED application. Depth 6 —
          Application.retier_count -> RunbookStep INVALIDATED -> Runbook STALE ->
          RecoveryGroup RESTRICTED -> Exercise SCHEDULED reverts to SCOPED -> Site
          reserved_capacity_units released. Only the step covering THAT application is
          invalidated, so readiness lands on 75.00 rather than 0.00.
        test_recipe:
          setup:
            - "The standard RG-1 fixture exists at clock 2026-08-01T00:00:00Z: rb1 VALIDATED with readiness 100.00, three steps VALIDATED with weights 10 (covers APP-CORE), 10 (covers AST-DB1) and 20 (covers AST-NET1), group posture READY."
            - "Exercise exA (COMPONENT_FAILOVER, required_capacity_units 2) is scoped on RG-1, impact-approved and SCHEDULED, so SITE-R reserved_capacity_units is 2."
