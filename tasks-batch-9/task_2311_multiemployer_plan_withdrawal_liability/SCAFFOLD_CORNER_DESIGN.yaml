      - name: independent_advance_of_the_three_assessment_dimensions_is_covered_by_the_parallel_depth_probe
        claim_type: Valid Transition
        grounds:
          - "complexity_profile.state_machine_shape"
        distinguishing_aspect: |
          The parallel-shape claim - review_status and collection_status moving without
          either dragging the other - is exactly what the depth probe drives, over five
          ordered hops that no breadth instance would reproduce.
        excluded_because:
          difficulty_instance: assessment_review_and_collection_dimensions_advance_independently
          rationale: "The depth probe already walks the full parallel matrix, asserting REQUESTED/DECIDED/ARBITRATED against NOT_YET_DUE/CURRENT/DELINQUENT on the same row; a breadth restatement would assert a strict subset of its assertions."

      - name: the_remand_loop_returning_to_briefing_is_covered_by_the_cyclic_depth_probe
        claim_type: Valid Transition
        grounds:
          - "complexity_profile.state_machine_shape"
        distinguishing_aspect: |
          The cyclic-shape claim needs a full BRIEFING -> HEARING -> AWARD_ISSUED ->
          REMANDED -> BRIEFING lap with round_number incrementing exactly once, which the
          depth probe drives end to end.
        excluded_because:
          difficulty_instance: arbitration_remand_cycle_returns_to_briefing_and_increments_round
          rationale: "The depth probe already closes one whole lap and pins round_number before and after; the only untested residue was the round CEILING, which is covered here by a_remand_at_the_third_round_is_rejected_by_the_round_limit."

      - name: the_vacate_cascade_down_and_compensation_pattern_is_covered_by_the_depth_five_probe
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.LiabilityAssessment.transitions.ISSUED_to_RESCINDED"
        distinguishing_aspect: |
          Cascade-down, cross-entity and compensation are all the same chain here: the
          vacating award must unwind schedule, installments, employer and controlled group
          and restore the valuation's conserved allocation with no drift.
        excluded_because:
          difficulty_instance: vacate_award_unwinds_schedule_installments_employer_and_group_depth_five
          rationale: "The depth probe asserts all five links plus the conserved PLAN_UVB_ALLOCATION identity before and after; a breadth instance could only re-assert link 1."

      - name: the_conditional_delinquency_cascade_is_covered_by_the_depth_four_sweep_probe
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.PaymentSchedule.transitions.ACTIVE_to_DEFAULT_ELIGIBLE"
        distinguishing_aspect: |
          The conditional-cascade claim is that link 2 fires only once
          consecutive_delinquent_count reaches 2, so one delinquent installment must NOT
          propagate while the second must.
        excluded_because:
          difficulty_instance: collection_sweep_delinquency_propagates_to_employer_credit_watch_depth_four
          rationale: "The depth probe drives both sides of the count-2 condition in one chain; the one-delinquent-installment half is additionally visible in a_pending_review_request_is_deemed_denied_by_the_sweep."

      - name: the_ledger_sync_of_employer_outstanding_liability_is_covered_by_the_invariant_probe
        claim_type: Side Effect Execution
        grounds:
          - "entities.Employer.fields.outstanding_liability_cents"
        distinguishing_aspect: |
          Ledger sync means the employer's derived balance must equal the sum of live
          installment principal after every write, including across a regeneration that
          voids one generation and mints another.
        excluded_because:
          difficulty_instance: employer_outstanding_liability_decomposition_survives_schedule_regeneration
          rationale: "The depth probe reconciles the decomposition before, during and after a regeneration; restating it as a breadth claim would drop the regeneration boundary that makes it interesting."

      - name: guarded_cross_entity_preconditions_on_assessment_creation_are_covered_by_the_ordering_probe
        claim_type: Precondition Enforcement
        grounds:
          - "validations[priority=10]"
        distinguishing_aspect: |
          The guarded-transition claim is that the assessment hop reads the state of five
          OTHER rows (the lookback valuations) and refuses when any one of them is still
          DRAFT.
        excluded_because:
          difficulty_instance: assessment_creation_requires_every_lookback_valuation_certified
          rationale: "The depth probe walks each of the five lookback years in turn, which is a strict superset of a single guarded-precondition instance."

      - name: paying_a_scheduled_installment_is_covered_by_the_state_beats_fiscal_priority_probe
        claim_type: Invalid Transitions
        grounds:
          - "errors[ERR_INSTALLMENT_NOT_PAYABLE]"
        distinguishing_aspect: |
          From SCHEDULED there is no pay transition at all, so the attempt must be refused
          on state even when the amount offered is also wrong.
        excluded_because:
          difficulty_instance: state_beats_fiscal_when_paying_a_scheduled_installment_with_a_wrong_amount
          rationale: "The depth probe stacks the state violation and the amount violation on one call and pins which error wins, which subsumes the plain invalid-transition claim."

  # =======================================================================
  # SECTION: calculations - the fourteen rules, their input-set filters, their
  # pinned constants and their four-decimal precision.
  # =======================================================================
  - section: calculations
    instances:

      - name: the_spread_remainder_of_a_multi_year_record_lands_in_the_earliest_plan_year
        claim_type: Correct Result
        grounds:
          - "calculations.per_year_contribution_index"
          - "calculations.de_minimis_reduction"
          - "complexity_profile.complexity_layers"
        distinguishing_aspect: |
          REMAINDER_ASSIGNMENT is earliest_plan_year_in_interval, and this fixture places
          the earliest year of the record OUTSIDE the five-year ratio window, so the four
          odd cents are excluded from the numerator. That drops the gross share to exactly
          the de minimis phaseout start, where the reduction is still the full base. An
          implementation that parks the remainder in the LAST year instead produces a
          numerator of 10000004, a gross of 10000004, a reduction of 4999996 and a net of
          5000004 - a visible four-cent divergence amplified through the phaseout.
        test_recipe:
          setup:
            - "A plan with the five certified valuations 2021-2025 (uvb_total 10000000000, all_employer_contributions 2000000000 each). One contribution record spans plan years 2020-2025 with 600000 CBU and 12000004 cents, so the spread is 100000 CBU per year and 2000004 cents in 2020 with 2000000 cents in each of 2021-2025. The withdrawal event for plan year 2026 is determined COMPLETE."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
