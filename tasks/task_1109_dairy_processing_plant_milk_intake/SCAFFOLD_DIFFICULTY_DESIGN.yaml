              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${r_b}/lab-tests/${r_b_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/producers/${prod_b}"
              as: PlantController
