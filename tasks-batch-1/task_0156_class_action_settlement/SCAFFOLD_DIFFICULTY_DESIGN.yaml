  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: post_then_reverse_conserves_ledger_balance
        grounds:
          - state_machines.DistributionBatch.COMPUTED_to_POSTED
          - state_machines.DistributionBatch.POSTED_to_REVERSED
          - calculations.fund_reconciliation_balance
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity A — the signed ledger balance sum(LedgerEntry.amount_cents).
          After open-notice the balance is gross-fee-admin = net (50000). A post adds
          PAYMENT_DEBIT -50000 (balance 0); the compensating reverse adds
          PAYMENT_REVERSAL_CREDIT +50000, restoring balance to exactly 50000 with
          zero drift.
        test_recipe:
          setup:
            - "DISTRIBUTING PRO_RATA settlement net=50000, one VALIDATED claim, a POSTED batch (balance currently 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re LedgerInv", gross_fund_cents: 50000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 50000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 50000 }
              as: ClaimsReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
            - call: "GET /settlements/${s_id}"
              payload: {}
              as: FundController
              captures: { s_ver: $.data.version }
            - call: "POST /distribution-batches/${batch_id}/post"
              payload: { expected_settlement_version: "${s_ver}" }
              as: FundController
              as_user_id: "controller-1"
          trigger:
            - call: "POST /distribution-batches/${batch_id}/reverse"
              payload: {}
              as: FundController
              as_user_id: "controller-1"
            - call: "GET /settlements/${s_id}/ledger-balance"
              payload: {}
              as: FundController
              captures: { bal: $.data.balance_cents }
          assert:
            - "balance_cents after reverse == 50000 (PAYMENT_DEBIT -50000 and PAYMENT_REVERSAL_CREDIT +50000 cancel; FUND_OPEN +50000 stands)"
            - "Settlement.${s_id}.allocated_cents == 0"

      - name: post_then_reverse_conserves_validated_claim_count
        grounds:
