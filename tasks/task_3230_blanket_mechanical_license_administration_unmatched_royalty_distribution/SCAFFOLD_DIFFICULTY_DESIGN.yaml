# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# Blanket Mechanical License Administration & Unmatched Royalty Distribution
#
# 9 rule_ids x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries a directly executable test_recipe.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: usage_line_royalty_schedule_window_variants
        grounds:
          - calculations.usage_line_royalty
          - entities.UsageLine.fields.royalties_cents
          - entities.RateSchedule.fields.status
        distinguishing_aspect: |
          Dual variance lives on the UsageLine/UsageReport domain: two line
          sets with identical plays_count and duration_seconds price at 131
          cents vs 120 cents per play depending on whether the reporting
          month falls in the ACTIVE schedule's window or a SUPERSEDED one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z"
            - "OLD schedule (120/240 cents) ACTIVE over [2026-01-01, 2026-07-01) then SUPERSEDED"
            - "NEW schedule (131/252 cents) ACTIVE over [2026-07-01, null)"
            - "DSP 'Duetify' ACTIVE with accepted_rate_schedule_version = NEW schedule version"
            - "Two DRAFT reports: R_old for 2026-06, R_new for 2026-08, each with one identical line (isrc USAA19900001, title 'Kestrel', plays 1000, duration 200s)"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", rate_cents_under_5min: 120, rate_cents_per_minute_over_5min: 240 }
              as: MLCAdministrator
              captures: { rs_old: $.data.id }
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-07-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_new: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_old}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules/${rs_new}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r_old: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-08" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r_new: $.data.id }
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_old}/lines"
              payload: { isrc: "USAA19900001", track_title: "Kestrel", plays_count: 1000, duration_seconds: 200 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { line_old: $.data.id, roy_old: $.data.royalties_cents }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_new}/lines"
              payload: { isrc: "USAA19900001", track_title: "Kestrel", plays_count: 1000, duration_seconds: 200 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { line_new: $.data.id, roy_new: $.data.royalties_cents }
          assert:
            - "UsageLine.${line_old}.royalties_cents == 120000"
            - "UsageLine.${line_new}.royalties_cents == 131000"
            - "roy_old == 1000 * 120 and roy_new == 1000 * 131 (identical plays and duration, different schedule window)"

      - name: historical_market_share_methodology_variants
        grounds:
          - calculations.historical_market_share_allocation
          - entities.CycleRun.fields.methodology
          - entities.DistributionLine.fields.allocated_cents
        distinguishing_aspect: |
          Dual variance lives on the CycleRun/DistributionLine domain (a
          different entity domain than usage pricing): MARKET_SHARE_USAGE
          weights members by fresh distinct-matched-work counts while
          MARKET_SHARE_PRIOR weights them by the frozen prior-epoch
          numerator snapshot; the two runs draw the weight from different
          stored fields over the same membership, and each pool splits by
          its own variant's weights.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "Two schedules: OLD (120/240) ACTIVE over [2026-01-01, 2026-06-01) then SUPERSEDED; NEW (131/252) ACTIVE over [2026-06-01, null) — adjacent half-open windows"
            - "DSP 'Duetify' ACTIVE; Member A (signatory), Member B (non-signatory)"
            - "Report 2026-06 accepted with: matched candidate line 'Merlin' (10 plays -> 1310 cents, unmatched at accept) and unmatched line 'Petrel' (400 plays -> 52400 cents, HELD accrual 1)"
            - "Report 2026-05 (priced in the SUPERSEDED window) accepted with unmatched line 'Gadwall' (1000 plays -> 120000 cents, HELD accrual 2)"
            - "MusicalWork 'Merlin' registered with a 100% share for member A (so the MatchRun selects it and match_run_count becomes 1)"
            - "Both accruals expire 2029-07-01; clock at 2029-08-10"
            - "C1 (cycle 2029-08, window [2026-06,2026-06], MARKET_SHARE_USAGE) closes FIRST, sweeping accrual 1 -> pool 52400, weights A=1 (one matched work) and B=1 (flat): A gets 26200"
            - "C1's close freezes prior numerators: A=1 (its one matched work), B=1 (flat), denominator 1"
            - "C2 (cycle 2029-09, window [2026-05,2026-05], MARKET_SHARE_PRIOR) closes SECOND, sweeping accrual 2 -> pool 120000, weights from frozen priors A=1, B=1: A gets 60000 — the SAME member set and SAME one-matched-work history, read through the two methodologies, price A's weight identically only because priors tie; the methodology switch is what selects WHICH stored field (fresh match_run_count vs frozen prior_market_share_numerator) feeds the weight, so the fixture asserts the field provenance as the variant marker"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", rate_cents_under_5min: 120, rate_cents_per_minute_over_5min: 240 }
              as: MLCAdministrator
              captures: { rs_old: $.data.id }
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-06-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_new: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_old}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules/${rs_new}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101", is_signatory: true }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members"
              payload: { legal_name: "Birch Songs", member_type: "SELF_PUBLISHED_SONGWRITER", ipi_number: "00000000202", is_signatory: false }
              as: MLCAdministrator
              captures: { m_b: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r_jun: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_jun}/lines"
              payload: { isrc: "USAA19900011", track_title: "Merlin", plays_count: 10, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { l_m: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_jun}/lines"
              payload: { isrc: "USAA19900003", track_title: "Petrel", plays_count: 400, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { l_p1: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_jun}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_jun}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-05" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r_may: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_may}/lines"
              payload: { isrc: "USAA19900004", track_title: "Gadwall", plays_count: 1000, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_may}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r_may}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/works"
              payload: { title: "Merlin" }
              as: MLCAdministrator
              captures: { w1: $.data.id, w1_v: $.data.version }
            - call: "POST /mlc/works/${w1}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 100, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w1_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/match-runs"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/members/${m_a}/payees"
              payload: { payee_legal_name: "Alder Publishing LLC", payment_method: "ACH", routing_number: "021000021", account_number: "123456789", tax_id: "123456789" }
              as: MLCAdministrator
            - call: "POST /mlc/members/${m_a}/statements"
              payload: { period_month: "2026-06" }
              as: MLCAdministrator
              captures: { st_a: $.data.id }
            - call: "POST /mlc/members/${m_a}/statements/${st_a}/finalize"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/cycle-runs"
              payload: { cycle_month: "2029-08", pool_from_month: "2026-06", pool_to_month: "2026-06", methodology: "MARKET_SHARE_USAGE" }
              as: MLCAdministrator
              captures: { c1: $.data.id }
            - call: "POST /mlc/cycle-runs"
              payload: { cycle_month: "2029-09", pool_from_month: "2026-05", pool_to_month: "2026-05", methodology: "MARKET_SHARE_PRIOR" }
              as: MLCAdministrator
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /mlc/cycle-runs/${c1}/close"
              payload: {}
              as: MLCAdministrator
            - call: "GET /mlc/cycle-runs/${c1}/distribution-lines"
              payload: {}
              as: MLCAdministrator
              captures: { c1_a: "$.data[0].allocated_cents", c1_aw: "$.data[0].weight_numerator" }
            - call: "POST /mlc/cycle-runs/${c2}/close"
              payload: {}
              as: MLCAdministrator
            - call: "GET /mlc/cycle-runs/${c2}/distribution-lines"
              payload: {}
              as: MLCAdministrator
              captures: { c2_a: "$.data[0].allocated_cents", c2_aw: "$.data[0].weight_numerator" }
          assert:
            - "CycleRun.${c1}.pool_cents == 52400 (400 * 131 — the June Petrel accrual; Merlin was matched and never pooled)"
            - "c1_aw == 1 (MARKET_SHARE_USAGE weight for signatory A = distinct matched works = 1) and c1_a == 26200 (weights 1:1 over the 52400 pool)"
            - "CycleRun.${c2}.pool_cents == 120000 (1000 * 120 — the May Gadwall accrual priced in the SUPERSEDED window)"
            - "c2_aw == Member.${m_a}.prior_market_share_numerator frozen at C1 close (== 1), proving the PRIOR variant reads the frozen snapshot field rather than fresh match evidence; c2_a == 60000 (weights 1:1 over the 120000 pool)"
            - "The two variants select different source fields for identical membership: c1_aw derives from MusicalWork.match_run_count, c2_aw from Member.prior_market_share_numerator — the dual-variant marker"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: market_share_weight_nonlinear_interaction
        grounds:
          - calculations.historical_market_share_allocation
          - entities.Member.fields.is_signatory
          - entities.Member.fields.prior_market_share_numerator
        distinguishing_aspect: |
          Mode (a): the waterfall weight has >= 3 inputs (is_signatory,
          distinct matched-work count, prior denominator) interacting
          non-linearly through a branch (signatory vs flat), a floor
          (max(w,1)), and a W == 0 collapse — this instance pins the
          W == 0 collapse branch: a pool with NO eligible-weight members
          leaves residual_cents == pool_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01; DSP Duetify ACTIVE; schedule 131/252 ACTIVE"
            - "NO members exist in the system (empty membership set M)"
            - "One expired 131000-cent accrual (1000 plays x 131) from reporting month 2026-06, line title 'Petrel' with no matching work; clock advanced past 2029-07-01"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900003", track_title: "Petrel", plays_count: 1000, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/cycle-runs"
              payload: { cycle_month: "2029-08", pool_from_month: "2026-06", pool_to_month: "2026-06", methodology: "MARKET_SHARE_USAGE" }
              as: MLCAdministrator
              captures: { c0: $.data.id }
          trigger:
            - call: "POST /mlc/cycle-runs/${c0}/close"
              payload: {}
              as: MLCAdministrator
          assert:
            - "CycleRun.${c0}.pool_cents == 131000"
            - "CycleRun.${c0}.residual_cents == 131000 (W == 0 collapse: empty membership means every weight branch bottoms out at zero total weight)"
            - "GET /mlc/cycle-runs/${c0}/distribution-lines returns an empty array (total_count == 0)"

      - name: per_share_allocation_rounding_order
        grounds:
          - calculations.per_share_allocation
          - entities.MusicalWork.fields.total_share_percent
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned as
          floor-per-share-then-distribute-remainder in effective_from ASC,
          created_at ASC order. 131000 cents across shares 33.4 / 33.3 / 33.3
          yields 43754 / 43623 / 43623 (first share takes the remainder
          cent); the alternative sum-then-round reading would give a
          different last-share figure.
        test_recipe:
          setup:
            - "Clock 2026-09-01; schedule 131/252 ACTIVE; DSP Duetify ACTIVE"
            - "Work 'Kestrel' with three ACTIVE shares effective 2026-01-01: 33.4 (member A), 33.3 (member B), 33.3 (member C), created in A,B,C order"
            - "Accepted report 2026-06 with one MATCHED line: 1000 plays, 200s, 131000 cents"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101", is_signatory: true }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members"
              payload: { legal_name: "Birch Songs", member_type: "PUBLISHER", ipi_number: "00000000202" }
              as: MLCAdministrator
              captures: { m_b: $.data.id }
            - call: "POST /mlc/members"
              payload: { legal_name: "Cedar Music", member_type: "PUBLISHER", ipi_number: "00000000303" }
              as: MLCAdministrator
              captures: { m_c: $.data.id }
            - call: "POST /mlc/works"
              payload: { title: "Kestrel" }
              as: MLCAdministrator
              captures: { w0: $.data.id, w0_v: $.data.version }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 33.4, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_b}", share_percent: 33.3, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v} + 1" }
              as: MLCAdministrator
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_c}", share_percent: 33.3, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v} + 2" }
              as: MLCAdministrator
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900001", track_title: "Kestrel", plays_count: 1000, duration_seconds: 200 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { l0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/members/${m_a}/statements"
              payload: { period_month: "2026-06" }
              as: MLCAdministrator
              captures: { st_a: $.data.id }
            - call: "POST /mlc/members/${m_b}/statements"
              payload: { period_month: "2026-06" }
              as: MLCAdministrator
              captures: { st_b: $.data.id }
            - call: "POST /mlc/members/${m_c}/statements"
              payload: { period_month: "2026-06" }
              as: MLCAdministrator
              captures: { st_c: $.data.id }
          trigger:
            - call: "GET /mlc/members/${m_a}/statements/${st_a}/lines"
              payload: {}
              as: MLCAdministrator
              captures: { alloc_a: "$.data[0].allocated_cents" }
            - call: "GET /mlc/members/${m_b}/statements/${st_b}/lines"
              payload: {}
              as: MLCAdministrator
              captures: { alloc_b: "$.data[0].allocated_cents" }
            - call: "GET /mlc/members/${m_c}/statements/${st_c}/lines"
              payload: {}
              as: MLCAdministrator
              captures: { alloc_c: "$.data[0].allocated_cents" }
          assert:
            - "alloc_a == 43754 (floor(131000 * 33.4 / 100) == 43754, plus the single remainder cent goes to the earliest share in pinned order)"
            - "alloc_b == 43623"
            - "alloc_c == 43623"
            - "alloc_a + alloc_b + alloc_c == 131000 (conservation across the rounding split)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: usage_report_reject_reopen_cycle
        grounds:
          - state_machines.UsageReport.SUBMITTED_to_REJECTED
          - state_machines.UsageReport.REJECTED_to_DRAFT
          - validations[priority=5]
        distinguishing_aspect: |
          UsageReport exhibits a true cycle DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT -> SUBMITTED: the second SUBMITTED is reachable only after the
          revert transition, and the entity carries its accumulated lines
          through the loop (state is not reset).
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP Duetify ACTIVE"
