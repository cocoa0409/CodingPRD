      - name: min_load_fee_threshold_exact_versus_one_cent_short
        grounds:
          - calculations.order_charge_assembly
          - endpoints[POST /material-orders/{materialOrderId}/confirm]
          - entities.MaterialOrder.fields.min_load_fee_cents
        distinguishing_aspect: |
          The half-open threshold in step 6 (discounted_bulk_cents < MIN_LOAD_SUBTOTAL_CENTS) is
          pinned from both sides inside one account: 12.50 cubic yards at 2000 cents lands exactly
          on 25000 and is fee-EXEMPT, while 12.49 cubic yards lands on 24980 and pays the whole
