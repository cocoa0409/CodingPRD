              as: LeagueAdmin
              captures: { se1_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Spring 2027 Varsity" }
              as: LeagueAdmin
              captures: { se2_id: $.data.id }
            - call: "POST /teams"
