              as: ShopManager
              captures: { sr: $.data.id, srv: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${ar}", hangar_slot_id: "${sr}", opened_by_mechanic_id: "${mr}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${srv}" }
              as: ShopManager
              captures: { wor: $.data.id }
            - call: "POST /api/work-orders/${wor}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wor}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${mr}"
            - call: "POST /api/work-orders/${wor}/checklist-items"
              payload: { item_code: "C-1", description: "i1", flat_rate_cents: 1000 }
              as: Mechanic
              as_user_id: "${mr}"
              captures: { cir1: $.data.id }
            - call: "POST /api/work-orders/${wor}/checklist-items/${cir1}/record"
              payload: { result: "FAIL", inspected_by_mechanic_id: "${mr}" }
              as: Mechanic
              as_user_id: "${mr}"
            - call: "POST /api/work-orders/${wor}/complete-inspection"
              payload: {}
              as: Mechanic
              as_user_id: "${mr}"
            - call: "POST /api/work-orders/${wor}/submit-for-approval"
              payload: {}
              as: Mechanic
              as_user_id: "${mr}"
            - call: "GET /api/work-orders/${wor}/discrepancies"
              payload: {}
              as: Mechanic
              as_user_id: "${mr}"
              captures: { dr1: "$.data[0].id" }
            - call: "POST /api/parts"
