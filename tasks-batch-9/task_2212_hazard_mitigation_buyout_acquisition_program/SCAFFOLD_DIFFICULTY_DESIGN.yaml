              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p5}/demolition-work-orders"
              payload: { parcel_id: "${p5}", contractor_id: "${ctr_e}", asbestos_survey_status: "NOT_PERFORMED", scheduled_start: "2026-11-08T17:00:01Z", scheduled_end: "2026-11-08T20:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { woe3: $.data.id }
          assert:
            - "the first trigger call returns 201 (W2 buffered_start 2026-10-07T09:00:00Z conflicts with W1 alone, and 1 < 2)"
            - "DemolitionWorkOrder.${wo2}.buffered_start == 2026-10-07T09:00:00Z"
            - "DemolitionWorkOrder.${wo2}.buffered_end == 2026-10-09T17:00:00Z"
            - "DemolitionWorkOrder.${wo1}.buffered_start == 2026-10-04T08:00:00Z"
            - "DemolitionWorkOrder.${wo1}.buffered_end == 2026-10-07T17:00:00Z"
            - "the second trigger call returns 409 and data.error_id == ERR_DEMOLITION_WINDOW_CONFLICT (buffered [2026-10-06T10:00:00Z, 2026-10-08T14:00:00Z] conflicts with both W1 and W2, and 2 >= 2)"
            - "DemolitionContractor.${ctr_d}.active_work_order_count == 2"
            - "the third trigger call returns 409 and data.error_id == ERR_DEMOLITION_WINDOW_CONFLICT (buffered_start 2026-11-07T17:00:00Z equals E1.buffered_end 2026-11-07T17:00:00Z and the interval is CLOSED)"
            - "the fourth trigger call returns 201"
            - "DemolitionWorkOrder.${woe3}.buffered_start == 2026-11-07T17:00:01Z"
            - "DemolitionContractor.${ctr_e}.active_work_order_count == 2"
            - "GET /demolition-work-orders?contractor_id=${ctr_d} returns 2 rows"

  - rule_id: compensating_invariant
    instances:

      - name: federal_obligation_returns_to_the_same_literal_after_offer_withdrawal_and_re_presentation
        grounds:
          - calculations.federal_obligation
          - endpoints.POST_purchase-offers_offer_id_withdraw
          - entities.MitigationProject.fields.federal_obligated_cents
          - state_machines.PurchaseOffer.PRESENTED_to_WITHDRAWN
          - state_machines.Parcel.acquisition_status.OFFER_OUTSTANDING_to_VALUE_ESTABLISHED
        distinguishing_aspect: |
          The conserved quantity is MitigationProject.federal_obligated_cents and the compensating
          action is offer withdrawal: presenting adds the rounded item 16050000, withdrawing removes
          exactly that item back to 0, and presenting a fresh offer built from the same ACCEPTED
          REVIEW appraisal restores the identical literal 16050000. A deobligation that re-derived
          the amount from the parcel instead of dropping the stored item would leave residue here.
        test_recipe:
          setup:
            - "The 17-call golden path: APPROVED project, one OWNER_OCCUPIED parcel at pre-event FMV 20000000, VOLUNTARY_CONFIRMED, ACCEPTED INITIAL and ACCEPTED REVIEW appraisals both at 20000000, no DOB records."
            - "PurchaseOffer of1 created from the REVIEW appraisal and PRESENTED, so net_offer_cents 21400000 and the project's federal obligation is 16050000."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "CINV-A", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-CA", site_address: "1001 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/pre-event-value"
              payload: { parcel_id: "${p1}", pre_event_fmv_cents: 20000000, pre_event_value_basis: "ASSESSOR_ROLL" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "INTERESTED" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "CONFIRM_VOLUNTARY", voluntary_acknowledgement_signed_on: "2026-08-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap1: $.data.id }
            - call: "POST /appraisals/${ap1}/submit"
              payload: { appraisal_id: "${ap1}" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /appraisals/${ap1}/review-decision"
              payload: { appraisal_id: "${ap1}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "REVIEW", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-RA-1", effective_date: "2026-07-05", indicated_value_cents: 20000000, reviewed_appraisal_id: "${ap1}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
              captures: { ap1r: $.data.id }
            - call: "POST /appraisals/${ap1r}/submit"
              payload: { appraisal_id: "${ap1r}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /appraisals/${ap1r}/review-decision"
              payload: { appraisal_id: "${ap1r}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-2"
            - call: "GET /parcels/${p1}"
              payload: { parcel_id: "${p1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1v: $.data.version }
            - call: "POST /parcels/${p1}/purchase-offers"
              payload: { parcel_id: "${p1}", source_appraisal_id: "${ap1r}", offer_basis: "PRE_EVENT_FMV", expected_parcel_version: "${p1v}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { of1: $.data.id }
            - call: "POST /purchase-offers/${of1}/present"
              payload: { offer_id: "${of1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
          trigger:
            - call: "POST /purchase-offers/${of1}/withdraw"
              payload: { offer_id: "${of1}", withdrawal_reason: "owner requested more time" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "GET /parcels/${p1}"
              payload: { parcel_id: "${p1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1v2: $.data.version }
            - call: "POST /parcels/${p1}/purchase-offers"
              payload: { parcel_id: "${p1}", source_appraisal_id: "${ap1r}", offer_basis: "PRE_EVENT_FMV", expected_parcel_version: "${p1v2}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { of2: $.data.id }
            - call: "POST /purchase-offers/${of2}/present"
              payload: { offer_id: "${of2}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
          assert:
            - "before the first trigger call MitigationProject.${proj}.federal_obligated_cents == 16050000"
            - "the first trigger call returns 200"
            - "PurchaseOffer.${of1}.status == WITHDRAWN"
            - "PurchaseOffer.${of1}.net_offer_cents == 21400000"
            - "Parcel.${p1}.acquisition_status == VALUE_ESTABLISHED after the first trigger call"
            - "MitigationProject.${proj}.federal_obligated_cents == 0 after the first trigger call"
            - "PurchaseOffer.${of2}.net_offer_cents == 21400000"
            - "PurchaseOffer.${of2}.dob_deduction_cents == 0"
            - "PurchaseOffer.${of2}.status == PRESENTED"
            - "PurchaseOffer.${of1}.status == WITHDRAWN after the fourth trigger call (WITHDRAWN offers are never superseded)"
            - "PurchaseOffer.${of1}.superseded_by_offer_id == null"
            - "MitigationProject.${proj}.federal_obligated_cents == 16050000 after the fourth trigger call"
            - "Parcel.${p1}.acquisition_status == OFFER_OUTSTANDING"

      - name: program_income_balance_returns_to_the_same_literal_after_ledger_entry_reversal
        grounds:
          - calculations.program_income_federal_share
          - endpoints.POST_program-income-entries_entry_id_reverse
          - entities.MitigationProject.fields.program_income_balance_cents
          - entities.ProgramIncomeLedgerEntry.fields.reverses_entry_id
          - concurrency_rules.program-income-stale-project
        distinguishing_aspect: |
          The conserved quantity is program_income_balance_cents and the compensating action is
          ledger reversal, which - unlike the offer withdrawal in
          federal_obligation_returns_to_the_same_literal_after_offer_withdrawal_and_re_presentation -
          leaves an immutable audit row behind: the target and its opposite-signed twin both exit the
          ACTIVE input set. Both amounts end in the half-cent 300002 and 100002, so the balance 300004
          is provably the sum of two per-entry roundings and not round_half_up(400004 * 0.75) = 300003,
          and the post-reversal balance 75002 must be the surviving entry's own rounded share.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject at cost_share_federal_pct 0.75 with one parcel."
            - "ProgramIncomeLedgerEntry A: LEASE_REVENUE 300002 cents posted_on 2026-07-15."
            - "ProgramIncomeLedgerEntry B: SALVAGE_PROCEEDS 100002 cents posted_on 2026-08-01."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "CINV-B", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-CB", site_address: "1002 River Rd", acreage: 0.34, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pv1: $.data.version }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "LEASE_REVENUE", amount_cents: 300002, posted_on: "2026-07-15", expected_project_version: "${pv1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { e_a: $.data.id }
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pv2: $.data.version }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "SALVAGE_PROCEEDS", amount_cents: 100002, posted_on: "2026-08-01", expected_project_version: "${pv2}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { e_b: $.data.id }
          trigger:
            - call: "POST /program-income-entries/${e_a}/reverse"
              payload: { entry_id: "${e_a}", reversal_note: "lease receipt attributed to the wrong project" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_rev: $.data.id }
          assert:
            - "before the trigger call ProgramIncomeLedgerEntry.${e_a}.federal_share_cents == 225002"
            - "before the trigger call ProgramIncomeLedgerEntry.${e_b}.federal_share_cents == 75002"
            - "before the trigger call MitigationProject.${proj}.program_income_balance_cents == 300004"
            - "the trigger call returns 201"
            - "ProgramIncomeLedgerEntry.${e_a}.status == REVERSED"
            - "ProgramIncomeLedgerEntry.${e_rev}.reverses_entry_id == ${e_a}"
            - "ProgramIncomeLedgerEntry.${e_rev}.federal_share_cents == -225002"
            - "ProgramIncomeLedgerEntry.${e_rev}.amount_cents == 300002"
            - "ProgramIncomeLedgerEntry.${e_rev}.status == REVERSED"
            - "ProgramIncomeLedgerEntry.${e_b}.status == ACTIVE"
            - "MitigationProject.${proj}.program_income_balance_cents == 75002"
            - "GET /program-income-entries?project_id=${proj} returns 3 rows"

      - name: dob_reversal_restores_parcel_deduction_total_without_rewriting_the_created_offer
        grounds:
          - calculations.dob_deduction_total
          - calculations.net_offer_amount
          - endpoints.POST_dob-records_dob_record_id_reverse
          - entities.Parcel.fields.dob_deduction_total_cents
          - entities.PurchaseOffer.fields.dob_deduction_cents
        distinguishing_aspect: |
          Two quantities move in opposite directions from one action: reversing the 500001-cent SBA
          record restores Parcel.dob_deduction_total_cents to exactly 1250001 while the offer already
          created keeps its snapshot 1500002 and its net_offer_cents 19794998 unchanged. The
          conservation claim is therefore about a SNAPSHOT boundary rather than about a project-level
          running total as in the other two instances of this rule, and it is provable only because the
          per-record rounding of 250001 is the exact figure removed.
        test_recipe:
          setup:
            - "The golden path through the ACCEPTED REVIEW appraisal at 20000000 on an OWNER_OCCUPIED parcel."
            - "Three ACTIVE DOB records: NFIP_CLAIM 1200000 with repair_documented 300000 received 2026-05-01 (deductible 900000); SBA_LOAN 500001 received 2026-05-10 (deductible 250001); SBA_LOAN 700001 received 2026-05-20 (deductible 350001) - total 1500002."
            - "PurchaseOffer of1 created after all three records, so its snapshot is dob_deduction_cents 1500002 and net_offer_cents 19794998."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "CINV-C", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-CC", site_address: "1003 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/pre-event-value"
              payload: { parcel_id: "${p1}", pre_event_fmv_cents: 20000000, pre_event_value_basis: "ASSESSOR_ROLL" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "INTERESTED" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "CONFIRM_VOLUNTARY", voluntary_acknowledgement_signed_on: "2026-08-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/dob-records"
              payload: { parcel_id: "${p1}", benefit_source: "NFIP_CLAIM", amount_cents: 1200000, repair_documented_cents: 300000, received_on: "2026-05-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dob_nfip: $.data.id }
            - call: "POST /parcels/${p1}/dob-records"
              payload: { parcel_id: "${p1}", benefit_source: "SBA_LOAN", amount_cents: 500001, received_on: "2026-05-10" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dob_sba1: $.data.id }
            - call: "POST /parcels/${p1}/dob-records"
              payload: { parcel_id: "${p1}", benefit_source: "SBA_LOAN", amount_cents: 700001, received_on: "2026-05-20" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dob_sba2: $.data.id }
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap1: $.data.id }
            - call: "POST /appraisals/${ap1}/submit"
              payload: { appraisal_id: "${ap1}" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /appraisals/${ap1}/review-decision"
              payload: { appraisal_id: "${ap1}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "REVIEW", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-RA-1", effective_date: "2026-07-05", indicated_value_cents: 20000000, reviewed_appraisal_id: "${ap1}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
              captures: { ap1r: $.data.id }
            - call: "POST /appraisals/${ap1r}/submit"
              payload: { appraisal_id: "${ap1r}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /appraisals/${ap1r}/review-decision"
              payload: { appraisal_id: "${ap1r}", decision: "ACCEPT" }
