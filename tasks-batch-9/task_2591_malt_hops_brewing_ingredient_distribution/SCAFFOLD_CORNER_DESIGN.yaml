            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Uncertified Brewing", brewery_license_no: "BR-1030", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { uc_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { uc_citra_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { uc_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${uc_prod_id}", lot_code: "LOT-UC-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { uc_lot_id: $.data.id }
            - call: "POST /malt-lots/${uc_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${uc_lot_id}/release"
              payload: { release_note: "COA on file" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${uc_id}", requested_ship_date: "2026-09-05T00:00:00Z" }
              as: Brewer
              as_user_id: "${uc_id}"
              captures: { uc_amb_id: $.data.id }
            - call: "POST /sales-orders/${uc_amb_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${uc_lot_id}" }
              as: Brewer
              as_user_id: "${uc_id}"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${uc_id}", requested_ship_date: "2026-09-06T00:00:00Z" }
              as: Brewer
