              payload: { dealer_id: "${d18}", credit_limit_cents: 100000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 50000000, class_sublimit_cents_demonstrator: 20000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl18: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl18}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl18}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
          trigger:
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${d18}", audit_type: "ANNOUNCED", window_start_date: "2026-08-10", window_end_date: "2026-08-12" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { au18a: "$.data.id" }
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${d18}", audit_type: "ANNOUNCED", window_start_date: "2026-08-12", window_end_date: "2026-08-14" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { err18a: "$.data.error_id" }
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${d18}", audit_type: "ANNOUNCED", window_start_date: "2026-08-05", window_end_date: "2026-08-06" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { err18b: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/audits/${au18a}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "u-fa-1"
            - call: "POST /floorplan/audits/${au18a}/reconcile"
              payload: { notes: "No floored inventory to count" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { au18a_status: "$.data.status" }
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${d18}", audit_type: "UNANNOUNCED", window_start_date: "2026-08-25", window_end_date: "2026-08-25" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { err18c: "$.data.error_id" }
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${d18}", audit_type: "UNANNOUNCED", window_start_date: "2026-08-26", window_end_date: "2026-08-26" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { au18b: "$.data.id", au18b_type: "$.data.audit_type" }
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${d18}", audit_type: "UNANNOUNCED", window_start_date: "2026-09-10", window_end_date: "2026-09-14" }
              as: AuditManager
