            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "VD-1", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
          trigger:
            - { call: "POST /network/unit-sales/${s}/void", payload: {}, as: OemSalesOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SALE_NOT_ACCEPTED"
            - "UnitSale.${s}.status == REPORTED (unchanged)"

      - name: reinstate_with_high_chargeback_balance_blocked
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Dealer.SUSPENDED_to_ACTIVE"
          - "errors[ERR_REINSTATE_BLOCKED]"
        distinguishing_aspect: "Reinstate gate: a dealer auto-suspended at balance 55000 (>= 50000) cannot be reinstated until the balance drops below the threshold."
        test_recipe:
          setup: ["Dealer DL-RB1 ACTIVE; claim parts 55000 PAID -> flagged -> charged back FULL; dealer auto-suspended at balance 55000"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer RB1", dealer_code: "DL-RB1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RB1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RB2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-RB1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "RB-1", parts_cost_cents: 55000, labor_hours: 0, failure_description: "engine rebuild" }, as: DealerUser, as_user_id: "${d}", captures: { cl: $.data.id } }
            - { call: "POST /network/warranty-claims/${cl}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/flag-audit", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/chargeback", payload: { finding: "FULL" }, as: OemAuditor }
          trigger:
            - { call: "POST /network/dealers/${d}/status", payload: { target: "ACTIVE" }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REINSTATE_BLOCKED (balance 55000 >= 50000)"
            - "Dealer.${d}.status == SUSPENDED (unchanged)"

      - name: reinstate_active_dealer_rejected
