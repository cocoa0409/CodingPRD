            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 10000, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            # No activity for the cycle; close the cycle → gross=10000, EC=0, net=10000
            - call: "POST /banks/${b_id}/close_business_day"
              payload: {}
              as: BankOperationsAdmin
            - call: "POST /banks/${b_id}/close_analysis_cycle"
              payload: { customer_id: "${c_id}" }
              as: BillingSpecialist
            - call: "GET /banks/${b_id}/customers/${c_id}/analysis_cycles"
              payload: {}
              as: BillingSpecialist
              captures: { cycle_id: "$.data[0].id", cycle_version: "$.data[0].version" }
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/error_credit_requests"
              payload: { cycle_id: "${cycle_id}", requested_credit_cents: 15000, reason_code: "BILLING_RATE_ERROR" }
              as: CustomerOperator
              as_user_id: "${c_id}"
              captures: { ecr_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/error_credit_requests/${ecr_id}/approve"
              payload: {}
              as: BillingApprover
              as_user_id: "billing-appr-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/analysis_cycles/${cycle_id}/settle"
              payload: { expected_cycle_version: "${cycle_version}" }
              as: BillingSpecialist
              as_user_id: "billing-spec-1"
              captures: { final_net: $.data.net_amount_due_cents }
          assert:
            - "${final_net} == 0  # approved credit of 15000 against net of 10000 floors at 0"
            - "invariant: net_amount_due_cents >= 0 always holds"
