          trigger:
            - { call: "GET /milk-bank/donors/${d1}", payload: {}, as: Donor, as_user_id: "${d1}", captures: { own_code: "$.data.donor_code" } }
            - { call: "GET /milk-bank/donors/${d2}", payload: {}, as: Donor, as_user_id: "${d1}", captures: { e1: "$.data.error_id" } }
            - { call: "GET /milk-bank/shipments/${s2}", payload: {}, as: Donor, as_user_id: "${d1}", captures: { e2: "$.data.error_id" } }
            - { call: "GET /milk-bank/shipments", payload: {}, as: Donor, as_user_id: "${d1}" }
