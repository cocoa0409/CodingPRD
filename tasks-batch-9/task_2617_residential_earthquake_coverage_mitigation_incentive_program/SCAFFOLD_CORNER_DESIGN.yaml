            - call: "POST /eqp/claims"
              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 250000000, cosmetic_damage_cents: 0, contents_damage_cents: 0, loss_of_use_cents: 0, expected_event_version: "${ev_v1}" }
              as: ClaimAdjuster
              as_user_id: "adj-1"
              captures: { cl_id: $.data.id }
            - call: "POST /eqp/claims/${cl_id}/adjust-provisional"
              payload: {}
