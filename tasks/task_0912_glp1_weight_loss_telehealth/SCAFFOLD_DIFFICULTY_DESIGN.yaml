  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: mode_a_nested_allowed_cap_and_out_of_pocket_maximum
        grounds:
          - calculations.cycle_medication_charge
          - entities.BillingCycle.fields.medication_charge_cents
          - entities.Prescription.fields.units_per_cycle
        distinguishing_aspect: |
          Mode (a): the insurance branch is a four-input non-linear expression — units_per_cycle,
          dose_level, the payer allowed cap and the per-cycle out-of-pocket maximum — with a min
          nested inside a max nested inside a min, so doubling units_per_cycle from 1 to 2 moves
          the patient's share only from 7800 to 9000 instead of from 7800 to 15600.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "Two INSURANCE patients in CA, both ELIGIBLE, both prescribed SEMAGLUTIDE at dose_level 1 by the same clinician."
