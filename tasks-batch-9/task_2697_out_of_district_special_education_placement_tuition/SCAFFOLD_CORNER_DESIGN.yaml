          Two distinct priority-10 codes guard attendance periods and must not be conflated. A
          2026-10-05..2026-10-31 period is 27 days, one short of BILLING_CYCLE_DAYS, so its SHAPE
          is wrong -> ERR_BILLING_PERIOD_SHAPE. A 2027-06-08..2027-07-05 period is a perfectly
          shaped 28 days but ends 20 days past the placement's 2027-06-15 end_date ->
