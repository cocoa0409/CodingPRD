scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: nav_rollup_provisional_vs_final_variant
        grounds:
          - calculations.nav_rollup
          - calculations.irr_dual
          - entities.ValuationReport.fields.nav_provisional
          - entities.ValuationReport.fields.nav_final
          - state_machines.HoldingSnapshot.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          NAV/IRR entity domain: for the same quarter and commitment set,
          nav_provisional (PROVISIONAL snapshots only) and nav_final (FINAL
          snapshots reported within LAG_DAYS of quarter end) diverge, and
          nav_reported selects nav_final whenever any FINAL snapshot exists —
          a different selection rule than the provisional fallback. IRR is
          solved twice with different terminal NAVs.
        test_recipe:
          setup:
            - "Program opened, cash 20,000,000, buffer 1,000,000, posture NORMAL"
            - "EXECUTED commitment C1 of 10,000,000 on a BUYOUT 2026 vehicle"
            - "Quarter 2026-Q3: snapshot S1 PROVISIONAL nav 10,500,000; snapshot S2 finalized to FINAL with nav 10,300,000, reported_at within the 90-day lag window"
            - "ValuationReport R for 2026-Q3 in OPEN"
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops One", staff_role: "OPS_ANALYST", email: "ops1@x.com" }
              as: CIO
              captures: { ops1: $.data.id }
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana One", staff_role: "ANALYST", email: "ana1@x.com" }
              as: CIO
              captures: { ana1: $.data.id }
            - call: "POST /fof/staff-users"
              payload: { display_name: "IC One", staff_role: "IC_MEMBER", email: "ic1@x.com" }
              as: CIO
              captures: { ic1: $.data.id }
            - call: "POST /fof/programs"
              payload: { program_name: "P1", base_currency: "USD", total_nav_budget: 100000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 20000000 }
              as: OperationsAnalyst
              as_user_id: "${ops1}"
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: CIO
            - call: "POST /fof/programs/${prog}/pacing-plans"
              payload: { plan_label: "FY26", horizon_years: 4, start_vintage_year: 2026, target_strategy_mix: [{ strategy: "BUYOUT", weight: 0.5 }, { strategy: "VENTURE", weight: 0.3 }, { strategy: "CREDIT", weight: 0.2 }] }
              as: Analyst
              as_user_id: "${ana1}"
              captures: { plan: $.data.id }
            - call: "POST /fof/programs/${prog}/pacing-plans/${plan}/approve"
              payload: {}
              as: CIO
            - call: "POST /fof/managers"
              payload: { legal_name: "AlphaCap", domicile_country: "US", relationship_since_year: 2015 }
              as: Analyst
              as_user_id: "${ana1}"
              captures: { mgr: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles"
              payload: { fund_name: "Alpha V", strategy: "BUYOUT", vintage_year: 2026, fund_size_target: 500000000, mgmt_fee_rate_early: 0.02, mgmt_fee_rate_late: 0.01, investment_period_years: 5, carry_rate: 0.20, hurdle_rate: 0.08 }
              as: Analyst
              as_user_id: "${ana1}"
              captures: { veh: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles/${veh}/begin-diligence"
