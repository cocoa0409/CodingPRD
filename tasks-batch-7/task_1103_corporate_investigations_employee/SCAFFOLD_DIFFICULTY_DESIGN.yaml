            - call: "POST /api/interviews/${int_id}/transition"
              payload: { to_status: NO_SHOW }
              as: Investigator
              captures: { nsc: $.data.no_show_count }
            - { call: "POST /api/interviews/${int_id}/transition", payload: { to_status: SCHEDULED, new_start: "2026-05-04T14:00:00Z", new_end: "2026-05-04T15:00:00Z" }, as: Investigator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T14:30:00Z" }, as: SystemAdmin }
            - call: "POST /api/interviews/${int_id}/transition"
              payload: { to_status: UPJOHN_DELIVERED }
              as: Investigator
              captures: { upj: $.data.upjohn_delivered_at }
            - call: "POST /api/interviews/${int_id}/transition"
              payload: { to_status: COMPLETED, completion_note: "rescheduled memo" }
              as: Investigator
              captures: { st: $.data.status }
          assert:
            - "no_show_count == 1 after the single NO_SHOW entry and survives the reschedule"
            - "upjohn_delivered_at == 2026-05-04T14:30:00Z (delivered on the second pass, after the loop)"
            - "WitnessInterview.${int_id}.status == COMPLETED after the cycle SCHEDULED->NO_SHOW->SCHEDULED->UPJOHN_DELIVERED->COMPLETED"

      - name: finding_challenge_recalibration_cycle
        grounds:
          - state_machines.Finding.FINAL_to_CHALLENGED
          - state_machines.Finding.CHALLENGED_to_CALIBRATED
          - state_machines.DisciplinaryRecommendation.APPROVED_to_RECALLED
        distinguishing_aspect: |
          Finding machine is cyclic: FINAL -> CHALLENGED -> CALIBRATED -> FINAL.
          Entering CHALLENGED recalls the APPROVED disciplinary recommendation;
          recalibration recomputes substantiation_score_final and the finding can
          return to FINAL through the same gates as the first pass.
        test_recipe:
          setup:
            - "Case in FINDINGS with one FINAL SUBSTANTIATED finding (score 0.70) and one APPROVED disciplinary recommendation on it"
