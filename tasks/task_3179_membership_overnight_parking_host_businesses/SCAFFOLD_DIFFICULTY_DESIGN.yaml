              payload: { severity: "MAJOR", resolve_as: "UPHOLD", narrative: "generator curfew" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "mb@x.com", full_name: "Member B", plan_tier: "CLASSIC", home_state_code: "TX" }
