            - "${e_units} == ERR_UNITS_NOT_TERMINAL with HTTP 409 while unit A is SPEC_LOCKED; after cancelling unit A the close returns 200 with status \"CLOSED\" and committed_cents == 0"

      - name: axle_safety_check_before_open_change_orders_on_final_inspection
        claim_type: Priority Ordering
        grounds:
          - validations[priority=31]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / axle_safety_check_preempts_open_change_order_check
          rationale: "The named §1.8 instance drives a unit OVER_REAR_AXLE with an open change order and asserts ERR_AXLE_LOAD_EXCEEDED wins."

      - name: amendability_check_before_the_contract_ceiling_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=13]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_not_amendable_state_check_preempts_contract_ceiling_check
          rationale: "That §1.8 instance approves a ceiling-busting change order against a DELIVERED unit and asserts ERR_UNIT_NOT_AMENDABLE, then proves the ceiling error on an amendable unit."

      - name: release_gate_thresholds_admit_values_exactly_on_the_line
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=45]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: boundary_precision_check / release_gates_admit_values_exactly_on_the_threshold
          rationale: "Exactly 40.00 restrictive ratio and exactly 75.00 strict score are admitted there, with the one-clause-worse variants rejected."

      - name: certification_test_requires_the_mid_construction_trip_state
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=23]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / certification_test_gated_on_mid_construction_trip_state
          rationale: "The named §1.8 instance walks SCHEDULED -> HELD -> CANCELLED on the trip and asserts the test endpoint's admission flips with it."

  - section: endpoints
    instances:

      - name: logical_clock_endpoint_moves_time_without_transitioning_anything
        claim_type: Conditional action
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.ApparatusProgram.fields.created_at
          - state_machines.ChassisReservation.RESERVED_to_EXPIRED
        distinguishing_aspect: |
          Timestamps are stamped from the logical clock, never from wall time, and
          moving the clock past a reservation's expiry_at does NOT expire it: the row
          is still RESERVED until an explicit ops-run, so a server that lazily
          expires on read would diverge here.
        test_recipe:
          setup:
            - "no rows; the logical clock is at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Default clock program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog0_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /programs"
              payload: { name: "Moved clock program", agency_name: "County Fire Authority", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-09-02T00:00:00Z", expected_slot_line_version: "${line_v}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
            - call: "GET /chassis-reservations/${res_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "ApparatusProgram.${prog0_id}.created_at == \"2026-08-01T00:00:00.000Z\" — the startup default, not wall-clock time"
            - "the first clock call returns 200 with current_utc == \"2026-08-05T09:30:00Z\"; every role may call it"
            - "ApparatusProgram.${prog_id}.created_at == \"2026-08-05T09:30:00.000Z\" and updated_at == \"2026-08-05T09:30:00.000Z\" — writes read the logical clock"
            - "ChassisReservation.${res_id}.created_at == \"2026-08-05T09:30:00.000Z\" and expiry_at == \"2026-09-02T00:00:00Z\""
            - "after the clock jumps to 2026-09-10 the reservation read still shows status == \"RESERVED\" and SupplierSlotLine.${line_id}.reserved_slot_count == 1 — clock movement alone transitions nothing"

      - name: ops_run_sweep_expires_reservations_activates_warranties_and_is_idempotent
        claim_type: Bulk action
        grounds:
          - endpoints[POST /programs/{program_id}/ops-run]
          - state_machines.ChassisReservation.RESERVED_to_EXPIRED
          - state_machines.UnitOrder.DELIVERED_to_WARRANTY_ACTIVE
          - state_machines.WarrantyStartup.ACTIVE_to_EXPIRED
          - validations[priority=9]
        distinguishing_aspect: |
          One sweep reports expired_reservation_count 1 and warranty_activated_count
          1, applies the AT_RISK / trip-cancellation cascade to the expired unit and
          the DELIVERED -> WARRANTY_ACTIVE hop to the other, and an immediately
          repeated sweep reports all-zero counters — while a DRAFT program cannot be
          swept at all.
        test_recipe:
          setup:
            - "unit A: RESERVED chassis reservation with expiry_at 2026-09-02 and a SCHEDULED PRE_CONSTRUCTION trip"
            - "unit B: delivered 2026-09-20 with an ACTIVE WarrantyStartup (start 2026-09-20, end 2027-09-20)"
            - "a second ApparatusProgram left in DRAFT"
