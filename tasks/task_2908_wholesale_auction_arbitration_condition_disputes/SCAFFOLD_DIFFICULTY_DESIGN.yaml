              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4471" }
