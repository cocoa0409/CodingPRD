      - name: inventory_and_scenario_lifecycle_error_sweep
        claim_type: error_triggerability
        grounds:
          - errors[ERR_ADOPTED_SCENARIO_PINNED]
          - errors[ERR_SCENARIO_NOT_DRAFT]
          - errors[ERR_INVENTORY_SET_INCOMPLETE]
          - state_machines.InventoryDataset.DRAFT_to_CERTIFIED
          - state_machines.GrowthScenario.DRAFT_to_ADOPTED
        distinguishing_aspect: |
          These three ids are the hardest in the catalogue to reach by accident, because each needs a
          specific *combination* of rows rather than a single bad field.
          ERR_ADOPTED_SCENARIO_PINNED needs a second LAND_USE dataset whose certification would
          supersede a dataset that an ADOPTED scenario depends on - the certify call is otherwise
          perfectly legal, and the refusal exists purely to protect the adopted capacity numbers
          from being invalidated behind the plan's back. ERR_INVENTORY_SET_INCOMPLETE needs a plan
          whose LAND_USE dataset is certified (so the scenario could be created) but whose other
          three inventory types are not (so the scenario may not be adopted) - the check is on the
          SET of four types, not on the one dataset the scenario points at, so an implementation
          that validates only the pinned dataset never raises it. ERR_SCENARIO_NOT_DRAFT is the
          idempotency guard on adoption. Grouping the three shows that the certify path and the
          adopt path guard each other from opposite directions: a certification can be blocked by a
          scenario, and an adoption can be blocked by inventories the scenario never referenced.
        test_recipe:
          setup:
            - "Plan A: all four inventory types certified, one TREND scenario created and adopted."
            - "Plan B: only the LAND_USE inventory certified, so its scenario can be created but not adopted."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
