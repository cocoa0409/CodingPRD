          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 4.5, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DUPLICATE_STEP, http 409; original step-0 reading unchanged (tan_delta_e3 4.0)"]

      - name: step_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_STEP_OUT_OF_RANGE]", "entities.TestSeries.fields.step_count"]
        distinguishing_aspect: "PD_MAPPING derives step_count 1: step_index 1 is out of range."
