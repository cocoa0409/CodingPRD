            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FundController }
            - { call: "POST /distributions/${dist_id}/pay", payload: { reinvest: false }, as: FundController }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: FundController }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-11", price: 101.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px2_id: "$.data.id" } }
