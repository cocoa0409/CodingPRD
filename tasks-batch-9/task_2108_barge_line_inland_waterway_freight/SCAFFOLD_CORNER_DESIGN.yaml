          difficulty_instance: transitive_cascade / lock_clearance_delay_cascades_through_tow_assignment_into_contract_laytime
          rationale: "The DELAYED entry, its 165-minute meter and the downstream hops are asserted by the named §1.8 instance; only the return edge would be new and it is a single-field claim on the same fixture."

