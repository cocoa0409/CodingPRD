            - "the second POST /exam-sessions, identical except for a real candidate_id, returns 404 with error_id == ERR_EXAM_FORM_NOT_FOUND — the next FK to the right"
            - "neither POST /exam-sessions creates an ExamSession: GET /exam-sessions?candidate_id=${cand_id} returns total_count 0"
      - name: list_pagination_outside_bounds_is_rejected_before_any_row_is_read
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_PAGINATION
          - endpoints[GET /exam-forms]
          - endpoints[GET /candidates]
        distinguishing_aspect: |
          limit is validated against the CLOSED range [1,100] and offset against offset >= 0, on every list
          endpoint, before any filtering happens: limit=0, limit=101 and offset=-1 are all 400
          ERR_INVALID_PAGINATION, while limit=1, limit=100 and offset=0 are accepted. An implementation that
          silently clamps out-of-range values to the nearest legal one — a very common shortcut — returns 200
          and fails this instance.
        test_recipe:
          setup:
            - "Two ACTIVE exam forms exist so that a legal page can actually return rows; no other state is needed."
          setup_api_calls:
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120 }
              as: PlatformAdmin
              captures: { form_a: $.data.id }
            - call: "POST /exam-forms"
              payload: { form_code: "FM-ES-01", version_label: "2026.1", language: "ES", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_b: $.data.id }
          trigger:
            - call: "GET /exam-forms?limit=0"
              payload: {}
              as: PlatformAdmin
              captures: { e_zero: $.data.error_id }
            - call: "GET /exam-forms?limit=101"
              payload: {}
              as: PlatformAdmin
              captures: { e_over: $.data.error_id }
            - call: "GET /exam-forms?offset=-1"
              payload: {}
              as: PlatformAdmin
              captures: { e_neg: $.data.error_id }
            - call: "GET /candidates?limit=0&offset=-1"
              payload: {}
              as: PlatformAdmin
              captures: { e_both: $.data.error_id }
            - call: "GET /exam-forms?limit=100&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { ok_total: $.meta.total_count }
            - call: "GET /exam-forms?limit=1&offset=1"
              payload: {}
              as: PlatformAdmin
              captures: { page_total: $.meta.total_count, page_more: $.meta.has_more, page_id: "$.data[0].id" }
          assert:
            - "limit=0 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION — the lower bound is 1, not 0"
            - "limit=101 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION — the upper bound 100 is inclusive, 101 is not"
            - "offset=-1 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION"
            - "limit=0 combined with offset=-1 returns a single HTTP 400 ERR_INVALID_PAGINATION on GET /candidates too — the rule is applies_to: all GET list endpoints"
            - "limit=100&offset=0 returns HTTP 200 with total_count == 2 and has_more == false"
            - "limit=1&offset=1 returns HTTP 200 with total_count == 2, has_more == false and exactly one element in data — total_count counts matches, not the page"
