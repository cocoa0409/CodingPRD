            - "Structure.${struct_id}.cumulative_improvement_pct == 40.00"
            - "Structure.${struct_id}.single_event_improvement_pct == 10.00"

      - name: market_value_correction_does_not_rewrite_historical_snapshots
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints."PATCH /floodplain/structures/{structureId}"
          - calculations.structure_improvement_aggregates
          - entities.ImprovementRecord.fields.market_value_at_event_usd
