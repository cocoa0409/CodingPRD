            - "TrainingRecord.${tr1}.status == EXPIRED (link 1; valid_until 2026-09-19 < 2026-09-20)"
            - "Signup.${sg1}.status == CANCELLED (link 2: training-gated role lost currency)"
            - "Signup.${sg2}.status == APPROVED with origin == WAITLIST_PROMOTION (link 4: promotion, not a direct call)"
            - "Shift.${sh}.confirmed_count == 1 and status == FULL (seat conserved through the cascade)"
            - "TrainingRecord.${tr2} remains PASSED (valid until 2026-10-10) so V2 stayed promotion-eligible"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_beats_safety_on_cancelled_signup
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - state_machines.Signup.CONFIRMED_to_CANCELLED
          - state_machines.TrainingRecord.PASSED_to_EXPIRED
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the signup is CANCELLED
          (state failure) AND the volunteer's required training is EXPIRED (safety
          failure); approve MUST surface ERR_SIGNUP_NOT_APPROVABLE because state
          (priority 4) precedes business_safety (priority 7).
        test_recipe:
          setup:
            - "Role requires SAFETY_BRIEFING; V1 CONFIRMED on shift; then clock past training validity and sweep, which cancels the signup via the expiry cascade"
            - "End state: Signup CANCELLED and TrainingRecord EXPIRED — both error conditions hold at once"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16, required_training_module: SAFETY_BRIEFING }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T08:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v1}", module_code: SAFETY_BRIEFING }, as: VolunteerCoordinator, captures: { tr1: $.data.id } }
            - { call: "POST /volunteer-ops/training-records/${tr1}/pass", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/run-epoch-sweep", payload: {}, as: EventDirector }
            - { call: "GET /volunteer-ops/training-records/${tr1}", as: VolunteerCoordinator, captures: { tr_st: $.data.status } }
            - { call: "GET /volunteer-ops/signups/${sg1}", as: VolunteerCoordinator, captures: { sg_st: $.data.status } }
          trigger:
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
