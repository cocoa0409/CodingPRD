          - calculations.credit_share_determination.variants.provisional_normalized
          - calculations.credit_share_determination.variants.arbitrated_panel_mean
          - entities.Episode.fields.provisional_credit_shares
          - entities.Episode.fields.final_credit_shares
          - entities.CreditSubmission.fields.provisional_share_pct
          - entities.CreditSubmission.fields.arbitrated_share_pct
          - state_machines.CreditArbitration.PANEL_VOTING_to_DETERMINED
        distinguishing_aspect: |
          Dual-variant logic on the credit/authorship domain rather than the money domain: the SAME two
          eligible submissions (claims 60 and 30) yield provisional shares {W1:67, W2:33} from
          provisional_normalized at close and final shares {W1:45, W2:55} from arbitrated_panel_mean on
          determination, so the leading credit flips from W1 to W2 without any submission changing.
