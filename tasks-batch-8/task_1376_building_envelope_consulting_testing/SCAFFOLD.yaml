    side_effects: []
  - method: POST
    path: "/engagements/{id}/remediation-plans/{planId}/issue"
    description: "DRAFT -> ISSUED (OCC-guarded; posture must be OPEN; anomalies VERIFIED); computes ESTIMATE cost"
    roles: [Consultant]
    code: 200
    input: [expected_engagement_version]
    output: RemediationPlan
    side_effects: ["plan_status -> ISSUED", "remediation_cost_estimate ESTIMATE", "recognized_fees_cents += estimated_cost_cents", "increments Engagement.version by 1", "posture_derivation"]
  - method: POST
    path: "/engagements/{id}/remediation-plans/{planId}/complete"
    description: "ISSUED -> COMPLETED; computes ACTUAL cost, reconciles delta, remediates covered anomalies"
    roles: [Principal]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["plan_status -> COMPLETED", "remediation_cost_estimate ACTUAL", "recognized_fees_cents += (actual - estimated)", "covered Anomalies VERIFIED -> REMEDIATED (+10 risk each)", "posture_derivation"]
  - method: POST
    path: "/engagements/{id}/remediation-plans/{planId}/withdraw"
    description: "DRAFT -> WITHDRAWN"
    roles: [Consultant]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["plan_status -> WITHDRAWN"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/engagements/{id}/warranty-claims"
    description: "File a warranty claim against a VERIFIED anomaly"
    roles: [Consultant]
    code: 201
    input: [anomaly_id, manufacturer_name, claimed_amount_cents]
    output: WarrantyClaim
    side_effects: ["claim_status=FILED", "filed_at := logical clock", "response_due_at := filed_at + 30 days"]
  - method: GET
    path: "/engagements/{id}/warranty-claims"
    description: "List warranty claims"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: ["limit?", "offset?", "anomaly_id?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/engagements/{id}/warranty-claims/{claimId}"
    description: "Get a warranty claim"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/engagements/{id}/warranty-claims/{claimId}/manufacturer-acknowledge"
    description: "FILED -> UNDER_MANUFACTURER_REVIEW"
    roles: [ManufacturerRep]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["claim_status -> UNDER_MANUFACTURER_REVIEW"]
  - method: POST
    path: "/engagements/{id}/warranty-claims/{claimId}/manufacturer-decide"
    description: "UNDER_MANUFACTURER_REVIEW|ESCALATED -> ACCEPTED|DENIED per payload decision"
    roles: [ManufacturerRep]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects: ["claim_status -> ACCEPTED|DENIED"]
  - method: POST
    path: "/engagements/{id}/warranty-claims/{claimId}/escalate"
    description: "DENIED -> ESCALATED (only after response_due_at has elapsed)"
    roles: [Consultant]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["claim_status -> ESCALATED"]
  - method: POST
    path: "/engagements/{id}/warranty-claims/{claimId}/resolve"
    description: "ACCEPTED -> RESOLVED; computes recovery share and offsets recognized fees"
    roles: [Consultant]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["claim_status -> RESOLVED", "warranty_recovery_share", "recognized_fees_cents -= recovered (floor 0)", "posture_derivation"]

  # --- LitigationHold ---
  - method: POST
    path: "/engagements/{id}/litigation-holds"
    description: "Apply a litigation hold (posture -> FROZEN)"
    roles: [Principal]
    code: 201
    input: [matter_reference]
    output: LitigationHold
    side_effects: ["hold_status=ACTIVE", "Engagement.litigation_hold_active := true", "posture_derivation (FROZEN)", "increments Engagement.version by 1"]
  - method: GET
    path: "/engagements/{id}/litigation-holds"
    description: "List litigation holds"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "LitigationHold[]"
    side_effects: []
  - method: GET
    path: "/engagements/{id}/litigation-holds/{holdId}"
    description: "Get a litigation hold"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: []
    output: LitigationHold
    side_effects: []
  - method: POST
    path: "/engagements/{id}/litigation-holds/{holdId}/release"
    description: "ACTIVE -> RELEASED; thaws posture"
    roles: [Principal]
    code: 200
    input: []
    output: LitigationHold
    side_effects: ["hold_status -> RELEASED", "Engagement.litigation_hold_active := false", "posture_derivation", "increments Engagement.version by 1"]

  # --- MaintenanceVisit ---
  - method: POST
    path: "/engagements/{id}/maintenance-visits"
    description: "Schedule a maintenance visit (closed window; buffer-expanded overlap check against other SCHEDULED visits)"
    roles: [Consultant]
    code: 201
    input: [visit_label, window_start_date, window_end_date, "buffer_days?"]
    output: MaintenanceVisit
    side_effects: ["visit_status=SCHEDULED"]
  - method: GET
    path: "/engagements/{id}/maintenance-visits"
    description: "List maintenance visits"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "MaintenanceVisit[]"
    side_effects: []
  - method: GET
    path: "/engagements/{id}/maintenance-visits/{visitId}"
    description: "Get a maintenance visit"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: []
    output: MaintenanceVisit
    side_effects: []
  - method: POST
    path: "/engagements/{id}/maintenance-visits/{visitId}/complete"
    description: "SCHEDULED -> COMPLETED (clock must be inside closed window)"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MaintenanceVisit
    side_effects: ["visit_status -> COMPLETED"]
  - method: POST
    path: "/engagements/{id}/maintenance-visits/{visitId}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [Consultant]
    code: 200
    input: []
    output: MaintenanceVisit
    side_effects: ["visit_status -> CANCELLED"]

  # --- Invoice ---
  - method: POST
    path: "/engagements/{id}/invoices"
    description: "Create a draft invoice (invoice_total_calc runs; volume tier discount floor from pre-discount subtotal)"
    roles: [Consultant]
    code: 201
    input: [labor_hours, expense_cents, "discount_pct?"]
    output: Invoice
    side_effects: ["invoice_status=DRAFT", "run invoice_total_calc -> subtotal_cents, total_cents"]
  # --- Flat single-resource GETs (identity lookup; FK reverse-reachability anchors) ---
