            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${t3_id}", assignment_role: "MEMBER", interval_start: "2026-09-05T00:00:00Z", interval_end: "2026-09-20T00:00:00Z", requested_hours: 1, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${ev4}" }
              as: ProgramManager
