              payload: { amount_cents: 50, reason: "seed" }
              as: SiteOps
          trigger:
            - call: "POST /mfc/customers/${cust_f}/wallet/adjustments"
              payload: { amount_cents: -120, reason: "clawback" }
              as: SiteOps
              captures: { wallet_floor: $.data.wallet_credit_cents, v_floor: $.data.version }
          assert:
            - "Customer.${cust_f}.wallet_credit_cents == 0 (floored, not -70)"
            - "Customer version incremented on each adjustment (v_floor == 3: create, +50, -120)"

      - name: clock_set_returns_new_instant_and_defaults_at_startup
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The logical clock's startup default is exactly 2026-09-01T00:00:00Z and set_current_utc echoes the new instant; age/expiry/peak derivations read this clock, never wall time."
        test_recipe:
