  # ==========================================================================
  - section: validations
    instances:

      - name: minor_consent_requires_a_guardian_and_succeeds_once_supplied
        claim_type: Violation → Error
        grounds:
          - validations[priority=25]        # ERR_MINOR_REQUIRES_GUARDIAN_CONSENT
          - endpoints[POST /triage-calls/{id}/consent]
          - entities.TriageCall.fields.consent_type
        distinguishing_aspect: "Age is computed from Patient.dob against the logical clock, not stored: a 14-year-old and a caller who turns 18 tomorrow are both refused PATIENT_SELF consent, while a caller whose eighteenth birthday is today is accepted — the comparison is `full years < 18`, so the birthday itself is already adult."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; one practice with consent_recording_required false."
            - "Three patients: dob 2012-05-01 (age 14), dob 2008-08-04 (turns 18 tomorrow), dob 2008-08-03 (turns 18 today)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Milo Reyes", dob: "2012-05-01", sex: "MALE", phone: "+14155550110", mrn: "MRN-0010" }
              as: PlatformAdmin
              captures: { child_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Ivy Reyes", dob: "2008-08-04", sex: "FEMALE", phone: "+14155550111", mrn: "MRN-0011" }
              as: PlatformAdmin
              captures: { almost_adult_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Owen Reyes", dob: "2008-08-03", sex: "MALE", phone: "+14155550112", mrn: "MRN-0012" }
              as: PlatformAdmin
              captures: { exactly_adult_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Milo's Mother", caller_phone: "+14155550110", caller_state_code: "CA", caller_relationship: "PARENT_GUARDIAN", reason_text: "child with a fever" }
              as: IntakeAgent
              captures: { child_call_id: $.data.id }
            - call: "POST /triage-calls/${child_call_id}/match-patient"
              payload: { patient_id: "${child_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Ivy Reyes", caller_phone: "+14155550111", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat" }
              as: IntakeAgent
              captures: { almost_adult_call_id: $.data.id }
            - call: "POST /triage-calls/${almost_adult_call_id}/match-patient"
              payload: { patient_id: "${almost_adult_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Owen Reyes", caller_phone: "+14155550112", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat" }
              as: IntakeAgent
              captures: { exactly_adult_call_id: $.data.id }
            - call: "POST /triage-calls/${exactly_adult_call_id}/match-patient"
              payload: { patient_id: "${exactly_adult_id}", match_method: "MRN" }
              as: IntakeAgent
          trigger:
            - call: "POST /triage-calls/${child_call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Milo Reyes" }
              as: IntakeAgent
              expect_error: ERR_MINOR_REQUIRES_GUARDIAN_CONSENT
              expect_status: 422
            - call: "POST /triage-calls/${almost_adult_call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Ivy Reyes" }
              as: IntakeAgent
              expect_error: ERR_MINOR_REQUIRES_GUARDIAN_CONSENT
              expect_status: 422
            - call: "POST /triage-calls/${child_call_id}/consent"
              payload: { consent_type: "GUARDIAN", consent_given_by: "Rosa Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${exactly_adult_call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Owen Reyes" }
              as: IntakeAgent
          assert:
            - "the first two trigger responses carry error_id ERR_MINOR_REQUIRES_GUARDIAN_CONSENT with HTTP status 422"
            - "TriageCall.${child_call_id}.status == CONSENTED"
            - "TriageCall.${child_call_id}.consent_type == GUARDIAN"
            - "TriageCall.${child_call_id}.consent_given_by == Rosa Reyes"
            - "TriageCall.${exactly_adult_call_id}.status == CONSENTED"
            - "TriageCall.${exactly_adult_call_id}.consent_type == PATIENT_SELF"
            - "TriageCall.${almost_adult_call_id}.status == IDENTIFIED"
            - "TriageCall.${almost_adult_call_id}.consent_type == null"

      - name: recording_reference_is_required_only_when_the_practice_demands_it
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=26]        # ERR_CONSENT_RECORDING_REQUIRED
          - entities.Practice.fields.consent_recording_required
          - entities.TriageCall.fields.recording_reference
        distinguishing_aspect: "The identical consent payload passes for a practice with consent_recording_required false and is refused for one with the flag true — a conditional rule keyed on a per-practice configuration flag rather than on the request itself."
        test_recipe:
          setup:
            - "Two practices differing only in consent_recording_required; one adult patient and one IDENTIFIED call under each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "No Recording Needed Clinic", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, consent_recording_required: false }
              as: PlatformAdmin
              captures: { practice_lax_id: $.data.id }
            - call: "POST /practices"
              payload: { name: "Recording Mandatory Clinic", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, consent_recording_required: true }
              as: PlatformAdmin
              captures: { practice_strict_id: $.data.id }
            - call: "POST /practices/${practice_lax_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_lax_id: $.data.id }
            - call: "POST /practices/${practice_strict_id}/patients"
              payload: { full_name: "Harold Pike", dob: "1948-09-10", sex: "MALE", phone: "+14155550200", mrn: "MRN-0002" }
              as: PlatformAdmin
              captures: { patient_strict_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_lax_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat" }
              as: IntakeAgent
              captures: { call_lax_id: $.data.id }
            - call: "POST /triage-calls/${call_lax_id}/match-patient"
              payload: { patient_id: "${patient_lax_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_strict_id}", caller_name: "Harold Pike", caller_phone: "+14155550200", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat" }
              as: IntakeAgent
              captures: { call_strict_id: $.data.id }
            - call: "POST /triage-calls/${call_strict_id}/match-patient"
              payload: { patient_id: "${patient_strict_id}", match_method: "MRN" }
              as: IntakeAgent
          trigger:
            - call: "POST /triage-calls/${call_lax_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_strict_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Harold Pike" }
              as: IntakeAgent
              expect_error: ERR_CONSENT_RECORDING_REQUIRED
              expect_status: 422
            - call: "POST /triage-calls/${call_strict_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Harold Pike", recording_reference: "REC-2026-08-03-0001" }
              as: IntakeAgent
          assert:
            - "the second trigger response carries error_id ERR_CONSENT_RECORDING_REQUIRED with HTTP status 422"
            - "TriageCall.${call_lax_id}.status == CONSENTED"
            - "TriageCall.${call_lax_id}.recording_reference == null"
            - "TriageCall.${call_strict_id}.status == CONSENTED"
            - "TriageCall.${call_strict_id}.recording_reference == REC-2026-08-03-0001"
            - "TriageCall.${call_strict_id}.consent_recorded_at == 2026-08-03T14:30:00Z"

      - name: patient_match_requires_mrn_or_eighty_percent_confidence_and_the_right_practice
        claim_type: Violation → Error
        grounds:
          - validations[priority=33]        # ERR_PATIENT_PRACTICE_MISMATCH
          - validations[priority=44]        # ERR_MATCH_CONFIDENCE_TOO_LOW
          - endpoints[POST /triage-calls/{id}/match-patient]
        distinguishing_aspect: "Three attempts on the same call: another practice's patient is a 409 mismatch, a 79 percent phone-and-name match is a 422, and exactly 80 percent is accepted — the threshold is inclusive and only the MRN method bypasses it."
        test_recipe:
          setup:
