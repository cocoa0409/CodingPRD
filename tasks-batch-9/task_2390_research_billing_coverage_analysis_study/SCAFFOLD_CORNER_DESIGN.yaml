            - "GET /research-billing/studies/${study_id} still shows version == 2 and lifecycle_status == \"COVERAGE_PENDING\""
            - "the same refusal is returned while the first analysis is UNDER_REVIEW or RETURNED; it lifts once that analysis is APPROVED"

