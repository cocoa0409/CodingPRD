            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "GET /program-cycles/${partner_id}", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PROGRAM_CYCLE_NOT_FOUND\""
            - "GET /program-cycles/${cycle_id} returns HTTP 200 with posture == \"OPEN\""
      - name: endpoint_recalculate_unknown_cycle_returns_not_found
        claim_type: action_endpoint
        grounds: ["endpoints[POST /program-cycles/{id}/recalculate]", "errors[ERR_PROGRAM_CYCLE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "The checkpoint sweep is per-cycle, so an unresolvable id must not degrade into a global sweep: the answer is 404 ERR_PROGRAM_CYCLE_NOT_FOUND and the real cycle's recalc_epoch stays 0, proving nothing was swept."
