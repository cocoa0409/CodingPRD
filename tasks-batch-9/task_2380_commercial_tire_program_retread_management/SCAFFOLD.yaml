    description: "Lists road service calls. fleet_account_id, vehicle_id, service_location_id, technician_id and cross_location_invoice_id are the reverse-reachability paths from FleetAccount, Vehicle, ServiceLocation, Technician and CrossLocationInvoice."
    roles: [DealerAdmin, DispatchCoordinator, TireTechnician, FleetManager, BillingClerk]
    code: 200
    input: ["fleet_account_id?", "vehicle_id?", "service_location_id?", "technician_id?", "cross_location_invoice_id?", "dispatch_status?", "billing_status?", "priority?", "limit?", "offset?"]
    output: RoadServiceCall[]
    side_effects: []

  # ---------------- ScrapManifest ----------------
  - method: POST
    path: "/service-locations/{location_id}/scrap-manifests"
    description: "Opens a scrap tire manifest for a hauler load leaving this location, with the hauler's permit number and gross weight capacity."
    roles: [ComplianceOfficer]
    code: 201
    input: [hauler_permit_number, hauler_capacity_lbs]
    output: ScrapManifest
    side_effects: ["status = DRAFT, manifest_number minted by the server", "tire_count and total_weight_lbs initialised to 0"]

  - method: POST
    path: "/scrap-manifests/{manifest_id}/lines"
    description: "Adds a condemned casing to a DRAFT manifest. A casing whose weight would push the load strictly above hauler_capacity_lbs is rejected; landing exactly on the capacity is allowed."
    roles: [ComplianceOfficer]
    code: 200
    input: [casing_id]
    output: ScrapManifest
    side_effects: ["sets Casing.scrap_manifest_id", "recomputes tire_count and total_weight_lbs per calculations.scrap_manifest_totals", "increments ScrapManifest.version by 1"]

  - method: POST
    path: "/scrap-manifests/{manifest_id}/sign"
    description: "Signs the manifest for pickup. The location's scrap permit must still be valid on the logical clock date, the manifest must be non-empty, every listed casing must be REJECTED, and segregation of duties forbids the signer from being any listed casing's inspector."
    roles: [ComplianceOfficer]
    code: 200
    input: [signed_at]
    output: ScrapManifest
    side_effects: ["ScrapManifest DRAFT -> SIGNED, sets signed_by_user_id = X-User-ID and signed_at", "increments ScrapManifest.version by 1"]

  - method: POST
    path: "/scrap-manifests/{manifest_id}/transport"
    description: "Records hauler pickup of a signed load."
    roles: [ComplianceOfficer]
    code: 200
    input: [transported_at, hauler_vehicle_id]
    output: ScrapManifest
    side_effects: ["ScrapManifest SIGNED -> TRANSPORTED"]

  - method: POST
    path: "/scrap-manifests/{manifest_id}/certify-destruction"
    description: "Certifies destruction at the processor. Segregation of duties forbids the certifier from being the signer. This is the point at which accrued casing credit is written off the fleet balance."
    roles: [ComplianceOfficer]
    code: 200
    input: [certified_at, destruction_facility_code]
    output: ScrapManifest
    side_effects:
      - "hop 1: ScrapManifest TRANSPORTED -> CERTIFIED_DESTROYED, sets certified_by_user_id and certified_at"
      - "hop 2: every listed Casing REJECTED -> SCRAPPED and every TireAsset on those casings PULLED -> SCRAPPED"
      - "hop 3: per casing carrying non-zero provisional_credit_cents, posts a CasingCreditEntry EXPIRY of the negated amount"
      - "hop 4: recomputes FleetAccount.casing_credit_balance_cents (incrementing FleetAccount.version) and each affected ServiceLocation.casings_in_holding_count"

  - method: POST
    path: "/scrap-manifests/{manifest_id}/void"
    description: "Voids a DRAFT or SIGNED manifest, unlinking every listed casing without changing any casing status."
    roles: [ComplianceOfficer]
    code: 200
    input: [void_reason]
    output: ScrapManifest
    side_effects: ["ScrapManifest DRAFT|SIGNED -> VOIDED", "clears Casing.scrap_manifest_id for every listed casing and drops tire_count and total_weight_lbs to 0", "from SIGNED, also clears signed_by_user_id and signed_at"]

  - method: GET
    path: "/scrap-manifests/{manifest_id}"
    description: "Reads one manifest with its computed tire_count and total_weight_lbs."
    roles: [DealerAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ScrapManifest
    side_effects: []

  - method: GET
    path: "/scrap-manifests"
    description: "Lists manifests; service_location_id is the reverse-reachability path from a ServiceLocation to the loads it generated."
    roles: [DealerAdmin, ComplianceOfficer]
    code: 200
    input: ["service_location_id?", "status?", "limit?", "offset?"]
    output: ScrapManifest[]
    side_effects: []

  # ---------------- CrossLocationInvoice ----------------
  - method: POST
    path: "/cross-location-invoices"
    description: "Rolls every eligible completed road service call across all locations into one national-account invoice for the billing period, applying the agreement's per-line tier discount and then the capped casing credit. Because creation snapshots the fleet's casing credit balance, the request must carry the fleet version the client observed (§1.2.1 invoice-create-stale-fleet)."
    roles: [BillingClerk]
    code: 201
    input: [fleet_account_id, billing_period_start, billing_period_end, expected_fleet_account_version]
    output: CrossLocationInvoice
    side_effects:
      - "resolves the ACTIVE NationalAgreement covering billing_period_start and stores national_agreement_id"
      - "claims every eligible RoadServiceCall (billing_status UNBILLED -> INVOICED, sets cross_location_invoice_id)"
      - "computes subtotal_cents, discount_cents (per-line rounded), net_before_credit_cents, credit_applied_cents and total_cents per calculations.cross_location_invoice_rollup"
      - "increments FleetAccount.version by 1"

  - method: POST
    path: "/cross-location-invoices/{invoice_id}/submit"
    description: "Submits an OPEN invoice to the national account, consuming the applied casing credit from the fleet ledger."
    roles: [BillingClerk]
    code: 200
    input: []
    output: CrossLocationInvoice
    side_effects:
      - "CrossLocationInvoice OPEN -> SUBMITTED"
      - "posts a CasingCreditEntry APPLICATION of -credit_applied_cents when that amount is positive, then recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
      - "cascades every claimed RoadServiceCall billing_status INVOICED -> BILLED_TO_NATIONAL"

  - method: POST
    path: "/cross-location-invoices/{invoice_id}/settle"
    description: "Records payment in full of a submitted invoice; a partial amount is rejected."
    roles: [BillingClerk]
    code: 200
    input: [paid_amount_cents]
    output: CrossLocationInvoice
    side_effects: ["CrossLocationInvoice SUBMITTED -> PAID", "cascades every claimed RoadServiceCall billing_status BILLED_TO_NATIONAL -> SETTLED"]

  - method: POST
    path: "/cross-location-invoices/{invoice_id}/dispute"
    description: "Disputes a submitted invoice. Compensating action for submit: the applied credit is returned to the ledger with zero drift, the credit is zeroed on the invoice, and every claimed line is released back to UNBILLED for re-invoicing."
    roles: [FleetManager, BillingClerk]
    code: 200
    input: [dispute_reason]
    output: CrossLocationInvoice
    side_effects:
      - "CrossLocationInvoice SUBMITTED -> DISPUTED"
      - "posts a CasingCreditEntry REVERSAL of +credit_applied_cents when that amount is positive, then sets credit_applied_cents = 0 and total_cents = net_before_credit_cents"
      - "recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
      - "cascades every claimed RoadServiceCall billing_status BILLED_TO_NATIONAL -> UNBILLED and clears cross_location_invoice_id"

  - method: GET
    path: "/cross-location-invoices/{invoice_id}"
    description: "Reads one invoice with the full rollup breakdown."
    roles: [DealerAdmin, BillingClerk, FleetManager]
    code: 200
    input: []
    output: CrossLocationInvoice
    side_effects: []

  - method: GET
    path: "/cross-location-invoices"
    description: "Lists invoices; fleet_account_id and national_agreement_id are the reverse-reachability paths from FleetAccount and NationalAgreement."
    roles: [DealerAdmin, BillingClerk, FleetManager]
    code: 200
    input: ["fleet_account_id?", "national_agreement_id?", "status?", "limit?", "offset?"]
    output: CrossLocationInvoice[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:

  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_FLEET_SCOPE_VIOLATION
    http: 403
    condition: "a FleetManager acts on a resource belonging to a fleet other than the one its X-User-ID identifies"
  - id: ERR_TECHNICIAN_SCOPE_VIOLATION
    http: 403
    condition: "a TireTechnician arrives at or completes a road service call assigned to a different technician"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, value outside a declared numeric constraint, labor_hours not a multiple of 0.25, malformed ISO 8601 date/datetime, or limit/offset out of range"

  # ---- not found ----
  - id: ERR_SERVICE_LOCATION_NOT_FOUND
    http: 404
    condition: "no ServiceLocation with the given id (path or body)"
  - id: ERR_FLEET_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no FleetAccount with the given id (path or body)"
  - id: ERR_NATIONAL_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no NationalAgreement with the given id"
  - id: ERR_TIRE_POLICY_NOT_FOUND
    http: 404
    condition: "no TirePolicy with the given id"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "no Vehicle with the given id (path or body)"
  - id: ERR_CASING_NOT_FOUND
    http: 404
    condition: "no Casing with the given id (path, manifest line, retread job or replacement casing)"
  - id: ERR_TIRE_ASSET_NOT_FOUND
    http: 404
    condition: "no TireAsset with the given id (path or replaced_tire_asset_id)"
  - id: ERR_TIRE_SURVEY_NOT_FOUND
    http: 404
    condition: "no TireSurvey with the given id"
  - id: ERR_CREDIT_ENTRY_NOT_FOUND
    http: 404
    condition: "no CasingCreditEntry with the given id"
  - id: ERR_RETREAD_LINE_NOT_FOUND
    http: 404
    condition: "no RetreadLine with the given id (path or body)"
  - id: ERR_RETREAD_JOB_NOT_FOUND
    http: 404
    condition: "no RetreadJob with the given id"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "no Technician with the given id (path or dispatch body)"
  - id: ERR_ROAD_SERVICE_CALL_NOT_FOUND
    http: 404
    condition: "no RoadServiceCall with the given id"
  - id: ERR_SCRAP_MANIFEST_NOT_FOUND
    http: 404
    condition: "no ScrapManifest with the given id"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no CrossLocationInvoice with the given id"

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_LOCATION_CODE
    http: 409
    condition: "another ServiceLocation already uses this location_code"
  - id: ERR_DUPLICATE_AGREEMENT_CODE
    http: 409
    condition: "another NationalAgreement already uses this agreement_code"
  - id: ERR_DUPLICATE_CASING_SERIAL
    http: 409
    condition: "another Casing already uses this casing_serial"
  - id: ERR_DUPLICATE_TIRE_POLICY
    http: 409
    condition: "a TirePolicy already exists for this (fleet_account_id, position) pair"
  - id: ERR_DUPLICATE_VEHICLE_UNIT
    http: 409
    condition: "a Vehicle already exists for this (fleet_account_id, unit_number) pair"
  - id: ERR_DUPLICATE_LINE_CODE
    http: 409
    condition: "a RetreadLine already exists for this (service_location_id, line_code) pair"

  # ---- state ----
  - id: ERR_CASING_INVALID_STATE
    http: 409
    condition: "the casing's current status does not permit the requested transition (collect, inspect, re-grade, reject, queue, retread, mount-back or scrap)"
  - id: ERR_TIRE_ASSET_INVALID_STATE
    http: 409
    condition: "the tire asset's current status does not permit mount, pull or scrap"
  - id: ERR_RETREAD_JOB_INVALID_STATE
    http: 409
    condition: "the retread job's current status does not permit start, complete, fail-cure, reschedule or cancel"
  - id: ERR_CALL_INVALID_STATE
    http: 409
    condition: "the call's dispatch_status or billing_status does not permit the requested transition"
  - id: ERR_MANIFEST_INVALID_STATE
    http: 409
    condition: "the manifest's status does not permit adding lines, signing, transport, certification or voiding"
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "the agreement is not DRAFT when activating, or not ACTIVE when terminating"
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "the invoice is not OPEN when submitting, or not SUBMITTED when settling or disputing"
  - id: ERR_FLEET_INVALID_STATE
    http: 409
    condition: "the fleet account is already in the requested status"
  - id: ERR_LINE_INVALID_STATE
    http: 409
    condition: "the retread line is already in the requested status"
  - id: ERR_TECHNICIAN_INVALID_STATE
    http: 409
    condition: "the technician is already in the requested status"

  # ---- optimistic concurrency (§1.2.1) ----
  - id: ERR_STALE_CASING_VERSION
    http: 412
    condition: "expected_casing_version does not equal the Casing's current version on POST /casings/{casing_id}/inspect"
  - id: ERR_STALE_FLEET_VERSION
    http: 412
    condition: "expected_fleet_account_version does not equal the FleetAccount's current version on POST /cross-location-invoices"

  # ---- safety / compliance / segregation of duties ----
  - id: ERR_SCRAP_PERMIT_EXPIRED
    http: 422
    condition: "the signing location's scrap_permit_expires_on is strictly before the logical clock's UTC date"
  - id: ERR_SOD_INSPECTOR_CANNOT_SIGN
    http: 422
    condition: "the signing ComplianceOfficer is also the recorded inspector of at least one casing listed on the manifest"
  - id: ERR_SOD_SIGNER_CANNOT_CERTIFY
    http: 422
    condition: "the certifying ComplianceOfficer is the same user who signed the manifest"
  - id: ERR_TREAD_BELOW_POLICY_MINIMUM
    http: 422
    condition: "tread_depth_at_mount_32nds is not strictly greater than the governing policy's min_tread_depth_32nds"
  - id: ERR_MAX_RETREAD_COUNT_REACHED
    http: 422
    condition: "the casing's retread_count already equals or exceeds the governing policy's max_retread_count"

  # ---- referential / cross-entity ----
  - id: ERR_CASING_NOT_SCRAP_ELIGIBLE
    http: 422
    condition: "a casing added to a manifest, or listed on a manifest being signed, is not in status REJECTED"
  - id: ERR_MANIFEST_EMPTY
    http: 422
    condition: "signing a manifest whose tire_count is 0"
  - id: ERR_CASING_ALREADY_ON_MANIFEST
    http: 409
    condition: "the casing is already listed on another scrap manifest"
  - id: ERR_TIRE_POLICY_MISSING
    http: 422
    condition: "no TirePolicy exists for the (fleet_account_id, position) pair the operation needs"
  - id: ERR_BRAND_NOT_APPROVED
    http: 422
    condition: "the tire brand is absent from the governing policy's approved_brands"
  - id: ERR_CASING_SPEC_MISMATCH
    http: 422
    condition: "the casing's casing_spec_code differs from the policy's required casing_spec_code and the policy value is not the 'ANY' wildcard"
  - id: ERR_FLEET_MISMATCH
    http: 422
    condition: "the casing, vehicle and tire asset named in one request do not all belong to the same fleet"
  - id: ERR_TECHNICIAN_LOCATION_MISMATCH
    http: 422
    condition: "the named technician's home location differs from the call's dispatching location"

  # ---- temporal ----
  - id: ERR_AGREEMENT_WINDOW_OVERLAP
    http: 409
    condition: "the activated agreement's closed date window intersects (including merely touching at one day) another ACTIVE agreement window for the same fleet"
  - id: ERR_RETREAD_SLOT_CONFLICT
    http: 409
    condition: "the requested half-open slot intersects an existing SCHEDULED/IN_PRODUCTION slot on the line extended by cure_cooldown_minutes"
  - id: ERR_INVALID_SLOT_DURATION
    http: 422
    condition: "slot_minutes is not a whole number in [60, 480], or scheduled_end_at is not strictly after scheduled_start_at"
  - id: ERR_JOB_START_TOO_EARLY
    http: 422
    condition: "started_at precedes the job's scheduled_start_at"
  - id: ERR_INVALID_TIMELINE
    http: 422
    condition: "a supplied instant regresses against the previously recorded instant on the same row (dispatch/arrive/complete, sign/transport/certify, schedule/complete)"
  - id: ERR_INVALID_BILLING_PERIOD
    http: 422
    condition: "billing_period_end precedes billing_period_start, or the inclusive period spans more than 92 days"
  - id: ERR_ODOMETER_REGRESSION
    http: 422
    condition: "an odometer reading is lower than the last accepted reading for the vehicle or the asset's mount/survey baseline"

  # ---- capacity / availability constraints ----
  - id: ERR_POSITION_OCCUPIED
    http: 409
    condition: "another tire asset is already MOUNTED or PULL_FLAGGED at that vehicle position"
  - id: ERR_FLEET_SUSPENDED
    http: 409
    condition: "opening a road service call or scheduling a retread for a SUSPENDED fleet account"
  - id: ERR_LINE_DOWN
    http: 409
    condition: "scheduling, rescheduling or starting a job on a line whose status is DOWN"
  - id: ERR_MANIFEST_CAPACITY_EXCEEDED
    http: 409
    condition: "adding a casing would push total_weight_lbs strictly above hauler_capacity_lbs; landing exactly on the capacity is allowed"
  - id: ERR_TECHNICIAN_UNAVAILABLE
    http: 409
    condition: "the explicitly named technician is not AVAILABLE"
  - id: ERR_NO_TECHNICIAN_AVAILABLE
    http: 409
    condition: "technician_id was omitted and the dispatch selector's candidate pool is empty"

  # ---- fiscal ----
  - id: ERR_NO_ACTIVE_AGREEMENT
    http: 422
    condition: "no ACTIVE NationalAgreement covers the invoice's billing_period_start for that fleet"
  - id: ERR_NO_BILLABLE_LINES
    http: 422
    condition: "no eligible completed, unbilled road service call falls inside the billing period"
  - id: ERR_INVOICE_NOT_BILLABLE
    http: 422
    condition: "submitting an invoice whose agreement is no longer ACTIVE, or whose total_cents is 0"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents differs from the invoice's total_cents"
  - id: ERR_CREDIT_BALANCE_NEGATIVE
    http: 409
    condition: "the ledger posting would drive FleetAccount.casing_credit_balance_cents below zero; no entry is written"
  - id: ERR_AGREEMENT_HAS_OPEN_INVOICE
    http: 409
    condition: "terminating an agreement while an invoice it priced is still OPEN or SUBMITTED"

# =====================================================================
# §1.7 RBAC Matrix
# Role model: segregation_of_duties. The inspector who grades a casing, the
# officer who signs its scrap manifest and the officer who certifies its
# destruction must be three distinct users; grading, production and billing
# are likewise held by different roles.
# =====================================================================
roles:

  - name: DealerAdmin
    description: "Dealer-side operations administrator: builds the location network, fleet accounts, tire policies, national agreements, production lines and technician rosters, and controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /service-locations, PATCH /service-locations/{location_id}"
      - "POST /fleet-accounts, POST /fleet-accounts/{fleet_account_id}/status"
      - "POST /national-agreements, POST /national-agreements/{agreement_id}/activate, POST /national-agreements/{agreement_id}/terminate"
      - "POST /fleet-accounts/{fleet_account_id}/tire-policies, PATCH /tire-policies/{policy_id}"
      - "POST /service-locations/{location_id}/retread-lines, POST /retread-lines/{line_id}/status"
      - "POST /service-locations/{location_id}/technicians, POST /technicians/{technician_id}/status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /fleet-accounts/{fleet_account_id}/vehicles, POST /vehicles/{vehicle_id}/odometer (with FleetManager)"
      - "POST /casings, POST /tire-assets (with TireTechnician)"
      - "GET /fleet-accounts/{fleet_account_id}/cost-per-mile (with FleetManager)"
      - "all read endpoints"

  - name: FleetManager
    description: "Customer-side fleet contact. X-User-ID is the FleetAccount id, and every operation is scoped to that fleet."
    identity: "entity_backed:FleetAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /fleet-accounts/{fleet_account_id}/vehicles, POST /vehicles/{vehicle_id}/odometer (with DealerAdmin, TireTechnician)"
      - "POST /road-service-calls (with DispatchCoordinator)"
      - "POST /cross-location-invoices/{invoice_id}/dispute (with BillingClerk)"
      - "GET /fleet-accounts/{fleet_account_id}/cost-per-mile (with DealerAdmin)"
      - "reads of its own fleet's policies, vehicles, casings, assets, surveys, calls, jobs, ledger entries and invoices"

  - name: TireTechnician
    description: "Field and shop technician. X-User-ID is the Technician id, which is why only the assigned technician may arrive at or complete a road service call."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /casings/{casing_id}/collect"
      - "POST /tire-assets/{tire_asset_id}/mount, POST /tire-assets/{tire_asset_id}/pull, POST /tire-assets/{tire_asset_id}/surveys"
      - "POST /road-service-calls/{call_id}/arrive, POST /road-service-calls/{call_id}/complete"
    shared_operations:
      - "POST /casings, POST /tire-assets (with DealerAdmin)"
      - "POST /vehicles/{vehicle_id}/odometer (with DealerAdmin, FleetManager)"
      - "reads of vehicles, tire policies, casings, assets, surveys, technicians and calls"

  - name: CasingInspector
    description: "Casing grading authority. Records inspection grades and condemnations, which is what makes the casing credit accrue — and what disqualifies the inspector from signing the scrap manifest for the casings they graded."
    identity: opaque
    exclusive_operations:
      - "POST /casings/{casing_id}/inspect"
      - "POST /casings/{casing_id}/reject"
    shared_operations:
      - "reads of casings, tire policies, fleet accounts and casing credit entries"

  - name: PlantScheduler
    description: "Retread plant scheduler. Owns the production schedule and every job lifecycle transition, including the completion that mints the retreaded tire and posts the production-verified credit adjustment."
    identity: opaque
    exclusive_operations:
      - "POST /retread-jobs"
      - "POST /retread-jobs/{job_id}/start, /complete, /fail-cure, /reschedule, /cancel"
    shared_operations:
      - "reads of retread lines, retread jobs, casings, tire policies, tire assets and service locations"

  - name: ComplianceOfficer
    description: "Scrap tire disposal compliance officer. Two distinct officers are structurally required per load: one to sign the manifest and a different one to certify destruction."
    identity: opaque
    exclusive_operations:
      - "POST /service-locations/{location_id}/scrap-manifests"
      - "POST /scrap-manifests/{manifest_id}/lines, /sign, /transport, /certify-destruction, /void"
    shared_operations:
      - "reads of scrap manifests, casings and service locations"

  - name: BillingClerk
    description: "National account billing clerk. Creates and drives cross-location invoices; cannot grade casings, so the party that creates the credit is never the party that consumes it."
    identity: opaque
    exclusive_operations:
      - "POST /cross-location-invoices"
      - "POST /cross-location-invoices/{invoice_id}/submit, /settle"
    shared_operations:
      - "POST /cross-location-invoices/{invoice_id}/dispute (with FleetManager)"
      - "reads of invoices, agreements, fleet accounts, road service calls and casing credit entries"

  - name: DispatchCoordinator
    description: "Road service dispatcher. Opens, dispatches and cancels calls but never records arrival or completion, so response times and billable labour are attested by the technician in the field, not by the dispatcher."
    identity: opaque
    exclusive_operations:
      - "POST /road-service-calls/{call_id}/dispatch"
      - "POST /road-service-calls/{call_id}/cancel"
    shared_operations:
      - "POST /road-service-calls (with FleetManager)"
      - "reads of calls, technicians, vehicles and service locations"
