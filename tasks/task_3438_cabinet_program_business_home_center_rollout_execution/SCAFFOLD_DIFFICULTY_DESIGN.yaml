              captures: { o1: $.data.id }
            - { call: "POST /cabinet/accounts/${acct}/status", payload: { to_status: SUSPENDED }, as: PlatformAdmin }
          trigger:
            - call: "POST /cabinet/orders/${o1}/transition"
              payload: { to_status: ACKNOWLEDGED }
              as: ProgramManager
              captures: { err: $.data.error_id }
