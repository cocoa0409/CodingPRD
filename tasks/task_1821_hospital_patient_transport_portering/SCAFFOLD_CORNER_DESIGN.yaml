          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"

      - name: respond_foreign_offer_forbidden_returns_403
        claim_type: rbac_denial
        grounds: [roles.Transporter, state_machines.DispatchOffer.PENDING_to_ACCEPTED]
        distinguishing_aspect: "A transporter cannot respond to an offer addressed to another transporter (ownership via entity_backed identity)."
        test_recipe:
          setup: ["T1 and T2 ON_SHIFT; R1 QUEUED PORTER_ONLY with offer O1 addressed to T1"]
          setup_api_calls:
