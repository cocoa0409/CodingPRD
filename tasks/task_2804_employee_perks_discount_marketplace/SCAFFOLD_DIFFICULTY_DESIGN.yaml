# ============================================================================
# §1.8 Scaffold Difficulty Design — Employee Perks & Discount Marketplace
# Nine Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.6; every numeric assert
# below was computed by executing the §1.3 formula with its constants.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: percent_versus_fixed_discount_variant_divergence_at_identical_gross
        grounds:
          - calculations.redemption_line_economics
          - entities.Offer.fields.discount_type
          - entities.Offer.fields.discount_value_bps
          - entities.Offer.fields.discount_value_cents
          - entities.Redemption.fields.discount_amount_cents
          - entities.Redemption.fields.employer_share_cents
          - state_machines.Redemption.PENDING_to_VERIFIED
        distinguishing_aspect: |
          This pair switches variant on the OFFER PRICING domain (discount_type PERCENT vs
          FIXED) and is observed on the Redemption money columns: at an identical
          gross_amount_cents of 5000 the PERCENT offer yields discount 1000 / commission 480
          / employer_share 120 while the FIXED offer yields discount 800 / commission 504 /
          employer_share 126, so the two variants disagree on every downstream column.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE in DINING/CA with an ACTIVE agreement whose standing terms are commission_rate_bps 1200 and employer_revenue_share_bps 2500."
            - "Employer Northwind Co LIVE (storefront PUBLISHED, integration SYNCED) with revenue_share_enabled true and one ELIGIBLE/ACTIVE membership in CA."
            - "Two ACTIVE offers under the same agreement: offer A discount_type PERCENT discount_value_bps 2000, offer B discount_type FIXED discount_value_cents 800; both min_spend_cents 1000."
            - "One PENDING redemption on each offer for the same membership, both with intended_gross_amount_cents 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 5, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload:
                expected_employer_version: "${employer_v1}"
                effective_from: "2026-08-01T00:00:00Z"
                checksum: "sha-dual-1"
                records:
                  - { external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_id: $.data.id }
            - call: "POST /perks/eligibility-files/${file_id}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file_id}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/employers/${employer_id}/storefront/publish"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { membership_id: "$.data[0].id" }
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", inventory_limit: 10, per_member_limit: 5 }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_pct_id: $.data.id }
            - call: "POST /perks/offers/${offer_pct_id}/submit"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/offers/${offer_pct_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "800 cents off dinner", discount_type: "FIXED", discount_value_cents: 800, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", inventory_limit: 10, per_member_limit: 5 }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_fixed_id: $.data.id }
            - call: "POST /perks/offers/${offer_fixed_id}/submit"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/offers/${offer_fixed_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_pct_id}", membership_id: "${membership_id}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${membership_id}"
              captures: { red_pct_id: $.data.id, tok_pct: $.data.verification_token }
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_fixed_id}", membership_id: "${membership_id}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${membership_id}"
              captures: { red_fixed_id: $.data.id, tok_fixed: $.data.verification_token }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/redemptions/${red_pct_id}/verify"
              payload: { verification_token: "${tok_pct}", gross_amount_cents: 5000 }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/redemptions/${red_fixed_id}/verify"
              payload: { verification_token: "${tok_fixed}", gross_amount_cents: 5000 }
              as: Merchant
              as_user_id: "${merchant_id}"
          assert:
            - "Redemption.${red_pct_id}.gross_amount_cents == 5000 and Redemption.${red_fixed_id}.gross_amount_cents == 5000"
            - "Redemption.${red_pct_id}.discount_amount_cents == 1000"
            - "Redemption.${red_pct_id}.net_charged_cents == 4000"
            - "Redemption.${red_pct_id}.commission_amount_cents == 480"
            - "Redemption.${red_pct_id}.employer_share_cents == 120"
            - "Redemption.${red_pct_id}.provider_net_cents == 360"
            - "Redemption.${red_fixed_id}.discount_amount_cents == 800"
            - "Redemption.${red_fixed_id}.net_charged_cents == 4200"
            - "Redemption.${red_fixed_id}.commission_amount_cents == 504"
            - "Redemption.${red_fixed_id}.employer_share_cents == 126"
            - "Redemption.${red_fixed_id}.provider_net_cents == 378"
            - "Redemption.${red_fixed_id}.commission_amount_cents - Redemption.${red_pct_id}.commission_amount_cents == 24"
            - "Redemption.${red_pct_id}.verification_status == VERIFIED and Redemption.${red_fixed_id}.verification_status == VERIFIED"

      - name: employer_scope_versus_partner_scope_privacy_cohort_variant_divergence
        grounds:
          - calculations.engagement_analytics
          - entities.Employer.fields.privacy_min_cohort_size
          - validations[priority=16]
          - endpoints["GET /perks/employers/{id}/engagement-report"]
          - endpoints["GET /perks/category-demand"]
        distinguishing_aspect: |
          This pair switches variant on the REPORTING-AUDIENCE domain, a different entity
          domain from the Offer/Redemption pricing pair: over one identical set of three
          verified DINING redemptions the EMPLOYER_SCOPE variant reports the row (cohort
          metric distinct_redeemer_count 3 >= privacy_min_cohort_size 3) while the
          PARTNER_SCOPE variant suppresses the same row (cohort metric
          distinct_employer_count 1 < PARTNER_MIN_EMPLOYER_COHORT 2), so suppressed is false
          in one response and true in the other for the same category.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ACTIVE DINING/CA merchant with an ACTIVE agreement (commission 1200 bps, share 2500 bps) and one ACTIVE PERCENT 2000 bps offer."
            - "One employer Northwind Co LIVE with privacy_min_cohort_size 3 and three ELIGIBLE/ACTIVE CA memberships."
            - "Exactly three VERIFIED DINING redemptions, one per membership, each gross 5000 and therefore each discount_amount_cents 1000, all verified at 2026-08-02T00:00:00Z."
            - "No other employer exists, so the whole platform's DINING demand comes from a single employer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 3, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload:
                expected_employer_version: "${employer_v1}"
                effective_from: "2026-08-01T00:00:00Z"
                checksum: "sha-dual-2"
                records:
                  - { external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
                  - { external_employee_ref: "E-002", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
                  - { external_employee_ref: "E-003", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_id: $.data.id }
            - call: "POST /perks/eligibility-files/${file_id}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file_id}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/employers/${employer_id}/storefront/publish"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { mem1_id: "$.data[0].id", mem2_id: "$.data[1].id", mem3_id: "$.data[2].id" }
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", inventory_limit: 10, per_member_limit: 5 }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /perks/offers/${offer_id}/submit"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_id}", membership_id: "${mem1_id}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${mem1_id}"
              captures: { red1_id: $.data.id, tok1: $.data.verification_token }
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_id}", membership_id: "${mem2_id}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${mem2_id}"
              captures: { red2_id: $.data.id, tok2: $.data.verification_token }
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_id}", membership_id: "${mem3_id}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${mem3_id}"
              captures: { red3_id: $.data.id, tok3: $.data.verification_token }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/redemptions/${red1_id}/verify"
              payload: { verification_token: "${tok1}", gross_amount_cents: 5000 }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/redemptions/${red2_id}/verify"
              payload: { verification_token: "${tok2}", gross_amount_cents: 5000 }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/redemptions/${red3_id}/verify"
              payload: { verification_token: "${tok3}", gross_amount_cents: 5000 }
              as: Merchant
              as_user_id: "${merchant_id}"
          trigger:
            - call: "GET /perks/employers/${employer_id}/engagement-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "GET /perks/category-demand"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              as_user_id: "pm-001"
          assert:
            - "engagement-report: privacy_min_cohort_size == 3 and len(category_rows) == 1"
            - "engagement-report: category_rows[0].category == DINING and category_rows[0].suppressed == false"
            - "engagement-report: category_rows[0].redemption_count == 3"
            - "engagement-report: category_rows[0].discount_amount_cents == 3000"
            - "engagement-report: category_rows[0].distinct_redeemer_count == 3"
            - "engagement-report: suppressed_category_count == 0"
            - "engagement-report: total_redemption_count == 3 and total_discount_amount_cents == 3000 and total_distinct_redeemer_count == 3"
            - "category-demand: partner_min_employer_cohort == 2 and len(category_rows) == 1"
            - "category-demand: category_rows[0].category == DINING and category_rows[0].suppressed == true"
            - "category-demand: category_rows[0].redemption_count == null and category_rows[0].discount_amount_cents == null and category_rows[0].distinct_employer_count == null"
            - "category-demand: suppressed_category_count == 1"
            - "category-demand: total_redemption_count == 3, i.e. the suppressed category still contributes to the period total"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: placement_fee_volume_tier_keyed_on_post_surcharge_gross
        grounds:
          - calculations.placement_fee_pricing
          - calculations.employer_eligible_headcount
          - entities.PlacementSlot.fields.reach_surcharge_cents
          - entities.PlacementSlot.fields.gross_fee_cents
          - entities.PlacementSlot.fields.volume_discount_bps
          - entities.PlacementSlot.fields.placement_fee_cents
          - entities.PartnerAgreement.fields.placement_fee_base_cents
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: the step-4 volume tier is keyed on the
          step-3 gross that already contains the step-2 reach surcharge, so a 5-day slot at
          base 36000/day for an employer with eligible_headcount 4 prices at 182160
          (180000 base -> +27000 surcharge -> 207000 gross -> tier-3 1200 bps -> -24840),
          whereas keying the tier on the bare 180000 base or applying the discount before the
          surcharge yields 198000.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant ACTIVE in DINING/CA with an ACTIVE agreement whose placement_fee_base_cents is 36000."
            - "Employer LIVE with a roster of five memberships: three ELIGIBLE/ACTIVE in-window, one ELIGIBLE/LEAVE in-window and one whose employment_status is TERMINATED, so employer_eligible_headcount is 4 and the reach tier is 1500 bps."
            - "One ACTIVE offer under that agreement, no placement slots yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 5, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload:
                expected_employer_version: "${employer_v1}"
                effective_from: "2026-08-01T00:00:00Z"
                checksum: "sha-comb-1"
                records:
                  - { external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
                  - { external_employee_ref: "E-002", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
                  - { external_employee_ref: "E-003", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
                  - { external_employee_ref: "E-004", employment_status: "LEAVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
                  - { external_employee_ref: "E-005", employment_status: "TERMINATED", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_id: $.data.id }
            - call: "POST /perks/eligibility-files/${file_id}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file_id}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/employers/${employer_id}/storefront/publish"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "GET /perks/employers/${employer_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
