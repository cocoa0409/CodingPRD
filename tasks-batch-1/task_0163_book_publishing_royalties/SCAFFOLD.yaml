scenario: "Book Publishing & Royalties: title/edition/format, advance/royalty tier escalator, reserve against returns, subsidiary rights (foreign/audio/film), author statement, returns reserve liquidation, agent commission"
domain_name: book-publishing-royalties
api_prefix: ""
# Flat multi-collection topology: resources live at top-level segments
# (/authors, /agents, /contracts, /titles, /sales-periods, /statements, ...).
# api_prefix is the empty root so every collection segment is addressable.

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  # Contract is the aggregate root (OCC parent). Title->Format is a strict sub-tree.
  # SalesPeriod, AuthorStatement, ReturnsReserve, SubsidiaryRight, StatementLine are
  # flat peers linked by FKs across the Contract aggregate boundary.
  state_machine_shape: branching
  # Statement lifecycle forks: DRAFT -> {FINALIZED -> PAID} with divergent side-effects;
  # ReturnsReserve has a HELD->{LIQUIDATED} branch with release/consume split.
  relationship_patterns:
    - one_to_many        # Contract has many Titles, Title has many Formats, Period has many SalesRecords
    - cross_aggregate    # AuthorStatement aggregates royalties+subsidiary+reserve across Contract
  role_model: peer_roles
  # Publisher operates the house; Author and Agent are entity_backed observers/claimants
  # with scoped read + sign-off rights. Author cannot do Publisher's posting work.
  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Author
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Author legal name printed on statements
      - name: email
        type: string
        source: input
        description: Unique contact email; uniqueness enforced
        constraints: unique across Authors
      - name: tax_withholding_pct
        type: number
        source: input
        description: Fraction (0..1) withheld from net payable on PAID statements
        default: 0
        constraints: 0 <= tax_withholding_pct <= 1

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: agency_name
        type: string
        source: input
        description: Literary agency display name
      - name: email
        type: string
        source: input
        description: Unique contact email; uniqueness enforced
        constraints: unique across Agents

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: author_id
        type: string
        source: input
        description: "FK -> Author.id; the authoring party of this contract"
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; representing agent (nullable for unagented deals)"
        default: null
      - name: advance_cents
        type: integer
        source: input
        description: Total advance against earnings, in cents; non-negative
        constraints: advance_cents >= 0
      - name: unrecouped_advance_cents
        type: integer
        source: computed
        description: Remaining advance balance to recoup; initialized to advance_cents, debited as statements FINALIZE
      - name: agent_commission_pct
        type: number
        source: input
        description: Fraction (0..1) of net-payable taken as agent commission; must be 0 when agent_id is null
        default: 0
        constraints: 0 <= agent_commission_pct <= 1
      - name: reserve_pct
        type: number
        source: input
        description: Fraction (0..1) of period gross royalty withheld as returns reserve
        default: 0.25
        constraints: 0 <= reserve_pct <= 1
      - name: reserve_hold_periods
        type: integer
        source: input
        description: Number of finalized periods a reserve is held before it becomes eligible for liquidation
        default: 2
        constraints: reserve_hold_periods >= 1
      - name: status
        type: enum
        source: system
        description: Contract lifecycle state
        constraints: one of DRAFT, ACTIVE, TERMINATED
        default: DRAFT
      - name: lifetime_net_units
        type: integer
        source: computed
        description: Cumulative net units (sold minus returned) across all FINALIZED periods; baseline for the royalty tier escalator
        default: 0

  - name: Title
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; owning contract"
      - name: name
        type: string
        source: input
        description: Book title
      - name: edition
        type: integer
        source: input
        description: Edition number (1, 2, ...)
        default: 1
        constraints: edition >= 1
      - name: status
        type: enum
        source: system
        description: Title publication state
        constraints: one of DRAFT, PUBLISHED, OUT_OF_PRINT
        default: DRAFT

  - name: Format
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; owning title"
      - name: format_type
        type: enum
        source: input
        description: Physical/digital format
        constraints: one of HARDCOVER, PAPERBACK, EBOOK, AUDIO
      - name: list_price_cents
        type: integer
        source: input
        description: List price per unit in cents; royalty is a rate of this price
        constraints: list_price_cents > 0
      - name: active
        type: boolean
        source: system
        description: Whether the format may receive new sales records
        default: true

  - name: RoyaltyTier
    parent: Contract
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; tiers belong to a contract and apply across all its titles"
      - name: lower_unit
        type: integer
        source: input
        description: Inclusive lower bound (cumulative net unit index, 1-based) where this tier begins
        constraints: lower_unit >= 1
      - name: upper_unit
        type: integer
        source: input
        description: Inclusive upper bound of the tier; null means open-ended top tier
        default: null
        constraints: upper_unit is null or upper_unit >= lower_unit
      - name: rate
        type: number
        source: input
        description: Royalty rate as a fraction of list price for units falling in this tier
        constraints: 0 < rate <= 1

  - name: SalesPeriod
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract this accounting period reports on"
      - name: label
        type: string
        source: input
        description: Human label e.g. 2026-H1
      - name: sequence
        type: integer
        source: input
        description: Monotonic period ordering index within the contract; statements process periods in ascending sequence
        constraints: sequence >= 1; unique within contract
      - name: status
        type: enum
        source: system
        description: Period accounting state
        constraints: one of OPEN, CLOSED, STATEMENTED
        default: OPEN

  - name: SalesRecord
    parent: SalesPeriod
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: input
        description: "FK -> SalesPeriod.id; the period this record posts into"
      - name: format_id
        type: string
        source: input
        description: "FK -> Format.id; the format these units belong to"
      - name: units_sold
        type: integer
        source: input
        description: Gross units sold in this record
        default: 0
        constraints: units_sold >= 0
      - name: units_returned
        type: integer
        source: input
        description: Units returned in this record
        default: 0
        constraints: units_returned >= 0

  - name: ReturnsReserve
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; owning contract"
      - name: origin_statement_id
        type: string
        source: input
        description: "FK -> AuthorStatement.id; the statement that withheld this reserve"
      - name: reserve_units
        type: integer
        source: computed
        description: Net units the reserve was sized against (round_half_up of period net units * reserve_pct)
      - name: reserve_held_cents
        type: integer
        source: computed
        description: Dollar amount (cents) withheld and held against future returns
      - name: reserve_unit_value_cents
        type: number
        source: computed
        description: Per-unit liquidation value = reserve_held_cents / reserve_units (kept at full precision until consumption rounding)
      - name: eligible_sequence
        type: integer
        source: computed
        description: The SalesPeriod.sequence at or after which this reserve may be liquidated (origin sequence + reserve_hold_periods)
      - name: released_cents
        type: integer
        source: computed
        description: Portion released back to author on liquidation; 0 until LIQUIDATED
        default: 0
      - name: consumed_cents
        type: integer
        source: computed
        description: Portion consumed by actual returns on liquidation; 0 until LIQUIDATED
        default: 0
      - name: status
        type: enum
        source: system
        description: Reserve lifecycle state
        constraints: one of HELD, LIQUIDATED
        default: HELD

  - name: SubsidiaryRight
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose work the right derives from"
      - name: right_type
        type: enum
        source: input
        description: Category of subsidiary right sold
        constraints: one of FOREIGN, AUDIO, FILM
      - name: proceeds_cents
        type: integer
        source: input
        description: Gross proceeds received for the right, in cents
        constraints: proceeds_cents > 0
      - name: author_share_pct
        type: number
        source: input
        description: Fraction (0..1) of proceeds credited to the author account; publisher keeps the remainder
        constraints: 0 < author_share_pct <= 1
      - name: author_income_cents
        type: integer
        source: computed
        description: round_half_up(proceeds_cents * author_share_pct); the credit posted to the author account
      - name: status
        type: enum
        source: system
        description: Subsidiary right lifecycle
        constraints: one of REGISTERED, STATEMENTED, VOID
        default: REGISTERED
      - name: statement_id
        type: string
        source: input
        description: "FK -> AuthorStatement.id; the statement that credited this right (null until STATEMENTED)"
        default: null

  - name: AuthorStatement
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract this statement settles"
      - name: period_id
        type: string
        source: input
        description: "FK -> SalesPeriod.id; the primary sales period being statemented"
      - name: gross_royalty_cents
        type: integer
        source: computed
        description: Tiered royalty earned on this period's net units (sum over formats)
      - name: reserve_held_cents
        type: integer
        source: computed
        description: Returns reserve withheld this period = round_half_up(gross_royalty_cents * reserve_pct)
      - name: royalty_credited_cents
        type: integer
        source: computed
        description: gross_royalty_cents - reserve_held_cents
      - name: reserve_released_cents
        type: integer
        source: computed
        description: Sum of released_cents from reserves liquidated into this statement
        default: 0
      - name: subsidiary_income_cents
        type: integer
        source: computed
        description: Sum of author_income_cents over SubsidiaryRights credited on this statement
        default: 0
      - name: period_earnings_cents
        type: integer
        source: computed
        description: royalty_credited_cents + reserve_released_cents + subsidiary_income_cents
      - name: advance_recouped_cents
        type: integer
        source: computed
        description: min(period_earnings_cents, contract.unrecouped_advance_cents at finalize time)
      - name: payable_before_commission_cents
        type: integer
        source: computed
        description: period_earnings_cents - advance_recouped_cents
      - name: agent_commission_cents
        type: integer
        source: computed
        description: round_half_up(payable_before_commission_cents * contract.agent_commission_pct)
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: round_half_up((payable_before_commission_cents - agent_commission_cents) * author.tax_withholding_pct); applied on PAID transition
        default: 0
      - name: net_to_author_cents
        type: integer
        source: computed
        description: payable_before_commission_cents - agent_commission_cents - tax_withheld_cents
      - name: status
        type: enum
        source: system
        description: Statement lifecycle
        constraints: one of DRAFT, FINALIZED, PAID
        default: DRAFT

  - name: StatementLine
    parent: AuthorStatement
    common_fields: false
    fields:
      - name: statement_id
        type: string
        source: input
        description: "FK -> AuthorStatement.id; the statement this immutable line belongs to"
      - name: line_type
        type: enum
        source: system
        description: Category of the ledger line
        constraints: one of ROYALTY, RESERVE_WITHHELD, RESERVE_RELEASED, SUBSIDIARY, ADVANCE_RECOUP, AGENT_COMMISSION, TAX_WITHHELD, NET_PAYABLE
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount for this line (credits positive, deductions negative)
      - name: memo
        type: string
        source: system
        description: Human-readable explanation snapshotted at finalize time

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: Publisher
        preconditions:
          - "Contract has >= 1 RoyaltyTier"
          - "RoyaltyTiers cover a contiguous range starting at lower_unit=1 with exactly one open-ended (upper_unit=null) top tier"
          - "Contract has >= 1 Title with >= 1 Format"
          - "if agent_id is null then agent_commission_pct == 0"
        side_effects:
          - "set status = ACTIVE"
          - "set unrecouped_advance_cents = advance_cents"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: Publisher
        preconditions:
          - "no SalesPeriod in CLOSED status (all periods OPEN or STATEMENTED)"
          - "no AuthorStatement in DRAFT or FINALIZED status (all PAID or none)"
          - "no ReturnsReserve in HELD status"
        side_effects:
          - "set status = TERMINATED"
          - "increments Contract.version by 1"
        note: "terminal; blocks all further posting"

  - entity: Title
    initial_state: DRAFT
    terminal_states: [OUT_OF_PRINT]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /titles/{id}/publish"
        actor: Publisher
        preconditions:
          - "owning Contract.status == ACTIVE"
          - "Title has >= 1 Format"
        side_effects:
          - "set status = PUBLISHED"
      - from: PUBLISHED
        to: OUT_OF_PRINT
        trigger: "POST /titles/{id}/retire"
        actor: Publisher
        preconditions:
          - "owning Contract.status == ACTIVE"
        side_effects:
          - "set status = OUT_OF_PRINT"
          - "set active=false on every Format of this Title (cascade down)"
        note: "guarded by Contract state — cross-entity dependency"

  - entity: SalesPeriod
    initial_state: OPEN
    terminal_states: [STATEMENTED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sales-periods/{id}/close"
        actor: Publisher
        preconditions:
          - "owning Contract.status == ACTIVE"
          - "every lower-sequence SalesPeriod of this contract is STATEMENTED"
        side_effects:
          - "set status = CLOSED"
          - "no further SalesRecords may be posted into this period"
        note: "periods must close in ascending sequence; cross-entity dependency on Contract.status"
      - from: CLOSED
        to: STATEMENTED
        trigger: "system: AuthorStatement for this period transitions DRAFT->FINALIZED"
        actor: system
        preconditions:
          - "an AuthorStatement with period_id == this period exists and is FINALIZED"
        side_effects:
          - "set status = STATEMENTED (bubble up from statement finalize)"

  - entity: AuthorStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: (none)
        to: DRAFT
        trigger: "POST /sales-periods/{id}/generate-statement"
        actor: Publisher
        preconditions:
          - "SalesPeriod.status == CLOSED"
          - "no existing AuthorStatement for this period_id"
        side_effects:
          - "create AuthorStatement in DRAFT"
          - "compute gross_royalty_cents via tiered_royalty using contract.lifetime_net_units as cum_before (forward-looking, not yet committed)"
          - "compute reserve_held_cents, royalty_credited_cents"
          - "identify liquidation-eligible HELD reserves (eligible_sequence <= this period sequence) and sum candidate reserve_released_cents (provisional)"
          - "identify REGISTERED SubsidiaryRights on this contract and sum candidate subsidiary_income_cents (provisional)"
          - "compute period_earnings_cents, advance_recouped_cents, payable_before_commission_cents, agent_commission_cents, net_to_author_cents (provisional snapshot)"
        note: "DRAFT figures are provisional and recomputed at FINALIZE against live state"
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /statements/{id}/finalize"
        actor: Publisher
        preconditions:
          - "statement.status == DRAFT"
          - "owning SalesPeriod.status == CLOSED"
          - "expected_contract_version matches Contract.version (OCC)"
        side_effects:
          - "recompute all monetary fields against live state (committed/final variant)"
          - "debit Contract.unrecouped_advance_cents by advance_recouped_cents (ledger sync)"
          - "increment Contract.lifetime_net_units by this period's net units (resets tier baseline for next period)"
          - "transition every liquidation-eligible HELD ReturnsReserve to LIQUIDATED, setting released_cents/consumed_cents, and add released_cents to reserve_released_cents (cascade: statement finalize -> reserve liquidate -> author credit)"
          - "transition each credited SubsidiaryRight REGISTERED->STATEMENTED and stamp statement_id (cascade: statement finalize -> right statemented)"
          - "create a new ReturnsReserve in HELD for reserve_held_cents withheld this period (cascade: statement finalize -> reserve created)"
          - "transition owning SalesPeriod CLOSED->STATEMENTED (bubble up)"
          - "emit immutable StatementLine rows (one per non-zero ledger component)"
          - "increments Contract.version by 1"
        note: "the reconciliation heart; final variant differs from DRAFT provisional when state changed between generate and finalize"
      - from: FINALIZED
        to: PAID
        trigger: "POST /statements/{id}/pay"
        actor: Publisher
        preconditions:
          - "statement.status == FINALIZED"
          - "expected_contract_version matches Contract.version (OCC)"
        side_effects:
          - "compute tax_withheld_cents = round_half_up((payable_before_commission_cents - agent_commission_cents) * author.tax_withholding_pct)"
          - "recompute net_to_author_cents = payable_before_commission_cents - agent_commission_cents - tax_withheld_cents"
          - "emit TAX_WITHHELD and final NET_PAYABLE StatementLines"
          - "increments Contract.version by 1"
        note: "tax applied only at payment; terminal"

  - entity: ReturnsReserve
    initial_state: HELD
    terminal_states: [LIQUIDATED]
    transitions:
      - from: HELD
        to: LIQUIDATED
        trigger: "system: AuthorStatement finalize where eligible_sequence <= finalizing period sequence"
        actor: system
        preconditions:
          - "reserve.status == HELD"
          - "eligible_sequence <= sequence of the statement's SalesPeriod"
        side_effects:
          - "compute actual_returns_units for the origin cohort from SalesRecords posted in periods after origin (see calc reserve_liquidation)"
          - "set consumed_cents = round_half_up(reserve_unit_value_cents * min(actual_returns_units, reserve_units))"
          - "set released_cents = reserve_held_cents - consumed_cents"
          - "set status = LIQUIDATED"
        note: "released_cents flows up into the finalizing statement (cross-entity credit)"

  - entity: SubsidiaryRight
    initial_state: REGISTERED
    terminal_states: [STATEMENTED, VOID]
    transitions:
      - from: REGISTERED
        to: STATEMENTED
        trigger: "system: AuthorStatement finalize credits this right"
        actor: system
        preconditions:
          - "right.status == REGISTERED"
        side_effects:
          - "stamp statement_id"
          - "set status = STATEMENTED"
      - from: REGISTERED
        to: VOID
        trigger: "POST /subsidiary-rights/{id}/void"
        actor: Publisher
        preconditions:
          - "right.status == REGISTERED (a STATEMENTED right cannot be voided)"
        side_effects:
          - "set status = VOID"
          - "author_income_cents is excluded from all future statements (compensating: the would-be credit never posts)"
        note: "voiding a STATEMENTED right is forbidden — already settled"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: statement-finalize-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /statements/{id}/finalize"
    occ_field: "expected_contract_version"
    description: |
      Finalizing a statement debits the contract's unrecouped advance and bumps
      lifetime_net_units — both fields the client must have observed to know the
      recoupment and tier baseline. If the contract's version has advanced since
      the client last read it (e.g. another statement for an earlier period was
      finalized in between, which legitimately changed unrecouped_advance_cents
      and lifetime_net_units), the finalize is rejected as stale because its
      recoupment math was computed against a superseded baseline.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: statement-pay-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /statements/{id}/pay"
    occ_field: "expected_contract_version"
    description: |
      Paying a statement is gated on the contract version the client observed
      when it decided to disburse. A pay request carrying a contract version
      older than the live one is rejected as stale, capturing the case where a
      different statement finalized against the same contract after this client
      read it.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: tiered_royalty_escalator
    trigger: "AuthorStatement generate (provisional) and finalize (committed)"
    algorithm: tiered_pricing
    formula: |
      net_units(period) = sum over SalesRecords r in period of (r.units_sold - r.units_returned)
                          where r.format.active is irrelevant (returns count regardless).
      # period net_units may be negative if returns exceed sales; clamp per-format contributions are NOT clamped,
      # the period aggregate is used as-is and may reduce gross_royalty (a CREDIT REVERSAL period).
      cum_before = contract.lifetime_net_units            # baseline from prior FINALIZED periods only
      gross_royalty_cents = 0
      remaining = net_units(period)
      pos = cum_before
      FOR each RoyaltyTier t ordered by lower_unit ASC:
        IF remaining <= 0: BREAK
        seg_start = max(pos, t.lower_unit - 1)
        seg_end   = (t.upper_unit if t.upper_unit not null else pos + remaining)
        avail = seg_end - seg_start
        IF avail <= 0: CONTINUE
        take = min(remaining, avail)
        # per-unit royalty in cents = round_half_up(format-independent: each format priced separately, see note)
        gross_royalty_cents += round_half_up(per_unit_value_for_tier(t) * take)
        remaining -= take; pos += take
    input_set: "SalesRecords whose period_id == statement.period_id; tiers from contract; cum_before from contract.lifetime_net_units (FINALIZED periods only — DRAFT/CLOSED siblings excluded)"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round per tiered segment then sum (segment-level rounding is the PINNED order)"
    variants:
      - name: per_format_then_sum
        when: "a period has units across multiple Formats with different list_price_cents"
        difference: "gross royalty is computed per Format (each Format's units run the tier escalator against the shared cum_before window in Format creation order, ASC by created_at), each Format subtotal rounded to cents, THEN Format subtotals summed. This PINNED order can differ by a cent from summing raw then rounding once."
        note: "PINNED: per_format_then_sum is canonical. The alternate 'sum-then-round' is the wrong interpretation and a divergence test pins the delta."

  - name: returns_reserve_sizing
    trigger: "AuthorStatement finalize (DRAFT->FINALIZED) creates a new HELD ReturnsReserve"
    algorithm: aggregation
    formula: |
      period_net_units = sum over SalesRecords in period of (units_sold - units_returned)
      reserve_units = round_half_up(period_net_units * contract.reserve_pct)     # may be 0
      reserve_held_cents = round_half_up(gross_royalty_cents * contract.reserve_pct)
      reserve_unit_value_cents = (reserve_held_cents / reserve_units) if reserve_units > 0 else 0   # full precision, NOT rounded here
      eligible_sequence = (origin SalesPeriod.sequence) + contract.reserve_hold_periods
    input_set: "the finalizing statement's period net units and gross_royalty_cents"
    constants:
      ROUNDING: round_half_up
    precision: "reserve_units and reserve_held_cents are integers; reserve_unit_value_cents kept at full precision until consumption rounding"

  - name: reserve_liquidation
    trigger: "AuthorStatement finalize, for each HELD ReturnsReserve whose eligible_sequence <= finalizing period sequence (HELD->LIQUIDATED)"
    algorithm: chronological
    formula: |
      # actual returns charged against this reserve's cohort = units_returned posted in
      # periods with sequence STRICTLY GREATER than the reserve's origin period sequence
      # and sequence <= the finalizing period sequence, for the same contract.
      actual_returns_units = sum over SalesRecords r where
          r.period.contract_id == reserve.contract_id
          AND r.period.sequence > origin_period.sequence
          AND r.period.sequence <= finalizing_period.sequence
        of r.units_returned
      charged = min(actual_returns_units, reserve.reserve_units)
      consumed_cents = round_half_up(reserve.reserve_unit_value_cents * charged)
      released_cents = reserve.reserve_held_cents - consumed_cents
    input_set: "SalesRecords across the contract in the half-open window (origin_sequence, finalizing_sequence]; ordered by SalesPeriod.sequence ASC then created_at ASC for determinism"
    constants:
      ROUNDING: round_half_up
    precision: "consumed_cents integer; released_cents = held - consumed (exact, conserves the reserve)"
    variants:
      - name: provisional_at_generate
        when: "computed during generate-statement (DRAFT)"
        difference: "uses returns observed up to the CLOSED period at generate time; not committed — reserves stay HELD"
      - name: committed_at_finalize
        when: "computed during finalize (FINALIZED)"
        difference: "recomputed against live SalesRecords and actually flips reserves to LIQUIDATED; released_cents credited to the statement. Diverges from provisional if returns were posted between generate and finalize."

  - name: statement_reconciliation
    trigger: "AuthorStatement finalize (DRAFT->FINALIZED), with tax applied at pay (FINALIZED->PAID)"
    algorithm: waterfall_allocation
    formula: |
      royalty_credited_cents      = gross_royalty_cents - reserve_held_cents
      reserve_released_cents      = sum of released_cents over reserves liquidated into this statement
      subsidiary_income_cents     = sum of author_income_cents over SubsidiaryRights credited this statement
                                    where author_income_cents = round_half_up(proceeds_cents * author_share_pct)
      period_earnings_cents       = royalty_credited_cents + reserve_released_cents + subsidiary_income_cents
      # Waterfall bucket 1: recoup advance
      advance_recouped_cents      = min(period_earnings_cents, contract.unrecouped_advance_cents)   # >= 0; period_earnings clamped at 0 floor for recoupment
      payable_before_commission_cents = period_earnings_cents - advance_recouped_cents
      # Waterfall bucket 2: agent commission on what actually flows to author
      agent_commission_cents      = round_half_up(payable_before_commission_cents * contract.agent_commission_pct)
      # tax computed at PAY only:
      tax_withheld_cents          = round_half_up((payable_before_commission_cents - agent_commission_cents) * author.tax_withholding_pct)
      net_to_author_cents         = payable_before_commission_cents - agent_commission_cents - tax_withheld_cents
    input_set: "this statement's royalty/reserve/subsidiary components; contract.unrecouped_advance_cents read at finalize time; author.tax_withholding_pct read at pay time"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents throughout; evaluation order PINNED: royalty -> reserve_released -> subsidiary -> earnings -> recoup -> commission -> (tax at pay) -> net"
    variants:
      - name: commission_on_net_payable
        when: "agent_commission_pct > 0 and advance partially or fully recoups this period"
        difference: "commission base is payable_before_commission_cents (post-recoupment). PINNED canonical."
      - name: commission_on_gross_earnings_WRONG
        when: "the tempting alternate reading 'commission on all author earnings'"
        difference: "would use period_earnings_cents as base, yielding a larger commission when an advance is being recouped. A divergence test pins that the canonical NET_PAYABLE base is used, not gross."

  - name: subsidiary_author_income
    trigger: "SubsidiaryRight create (REGISTERED); re-read at statement finalize"
    algorithm: aggregation
    formula: |
      author_income_cents = round_half_up(proceeds_cents * author_share_pct)
    input_set: "single SubsidiaryRight; VOID rights contribute 0"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7 RBAC; entity_backed roles must match the resource owner where ownership applies"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path/body resource id resolves to an existing entity, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body present and well-formed; required fields present with correct types; enum values in allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_constraint
    check: "Author.email / Agent.email uniqueness on create"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /authors, POST /agents"

  - priority: 6
    category: business_constraint
    check: "agent_commission_pct must be 0 when agent_id is null on Contract create/activate"
    error_id: ERR_COMMISSION_WITHOUT_AGENT
    http_status: 422
    applies_to: "POST /contracts, POST /contracts/{id}/activate"

  - priority: 7
    category: business_constraint
    check: "RoyaltyTiers form a contiguous cover from lower_unit=1 with exactly one open-ended top tier and no gaps/overlaps (checked at activate). OVERLAP semantics: two tiers collide when their inclusive unit ranges [lower_unit, upper_unit] intersect (a tier's upper_unit >= another tier's lower_unit while that other's upper_unit >= the first's lower_unit); adjacency at upper+1==next.lower is required, not overlap."
    error_id: ERR_TIER_COVERAGE_INVALID
    http_status: 422
    applies_to: "POST /contracts/{id}/activate"

  - priority: 7
    category: business_temporal
    check: "SalesPeriod.sequence must be unique within the owning contract; a new period whose sequence point is already occupied on the contract's accounting timeline collides (zero-width point occupation, distinct from the tier range-overlap semantics)"
    error_id: ERR_DUPLICATE_PERIOD_SEQUENCE
    http_status: 409
    applies_to: "POST /contracts/{id}/sales-periods"

  - priority: 8
    category: state
    check: "target resource is in a state that permits this transition (e.g. statement is DRAFT for finalize, FINALIZED for pay; reserve HELD; right REGISTERED for void)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 9
    category: business_referential
    check: "SalesRecord.format_id must belong to a Title under the same Contract as SalesRecord.period_id's SalesPeriod (no cross-contract sales)"
    error_id: ERR_CROSS_CONTRACT_REFERENCE
    http_status: 422
    applies_to: "POST /sales-periods/{id}/sales-records"

  - priority: 10
    category: state
    check: "SalesRecord may only be posted into an OPEN SalesPeriod whose owning Contract is ACTIVE; the target Format must be active"
    error_id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /sales-periods/{id}/sales-records"

  - priority: 11
    category: business_temporal
    check: "a SalesPeriod may only be CLOSED if every lower-sequence period of the contract is already STATEMENTED (ascending-sequence ordering)"
    error_id: ERR_PERIOD_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /sales-periods/{id}/close"

  - priority: 12
    category: business_constraint
    check: "at most one AuthorStatement may exist per SalesPeriod (generate-statement is idempotent-guarded)"
    error_id: ERR_STATEMENT_EXISTS
    http_status: 409
    applies_to: "POST /sales-periods/{id}/generate-statement"

  - priority: 13
    category: business_referential
    check: "a SubsidiaryRight cannot be voided once STATEMENTED (settled income is immutable)"
    error_id: ERR_RIGHT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /subsidiary-rights/{id}/void"

  - priority: 14
    category: business_fiscal
    check: "Contract cannot TERMINATE while any ReturnsReserve is HELD or any AuthorStatement is unpaid (DRAFT/FINALIZED)"
    error_id: ERR_OPEN_LIABILITIES
    http_status: 409
    applies_to: "POST /contracts/{id}/terminate"

  - priority: 15
    category: state
    check: "OCC: expected_contract_version must equal Contract.version on finalize/pay"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /statements/{id}/finalize, POST /statements/{id}/pay"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Authors ----
  - method: POST
    path: "/authors"
    description: "Register an author"
    roles: [Publisher]
    code: 201
    input: ["full_name", "email", "tax_withholding_pct?"]
    output: Author
    side_effects: ["create Author"]
  - method: GET
    path: "/authors/{id}"
    description: "Fetch an author"
    roles: [Publisher, Author]
    code: 200
    input: []
    output: Author
    side_effects: []
  - method: GET
    path: "/authors"
    description: "List authors (paginated)"
    roles: [Publisher]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: Author[]
    side_effects: []

  # ---- Agents ----
  - method: POST
    path: "/agents"
    description: "Register an agent"
    roles: [Publisher]
    code: 201
    input: [agency_name, email]
    output: Agent
    side_effects: ["create Agent"]
  - method: GET
    path: "/agents/{id}"
    description: "Fetch an agent"
    roles: [Publisher, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []
  - method: GET
    path: "/agents"
    description: "List agents (paginated)"
    roles: [Publisher]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []

  # ---- Contracts ----
  - method: POST
    path: "/contracts"
    description: "Create a contract in DRAFT"
    roles: [Publisher]
    code: 201
    input: ["author_id", "agent_id?", "advance_cents", "agent_commission_pct?", "reserve_pct?", "reserve_hold_periods?"]
    output: Contract
    side_effects: ["create Contract in DRAFT", "set unrecouped_advance_cents=advance_cents", "set lifetime_net_units=0"]
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract incl. computed unrecouped_advance_cents, lifetime_net_units, version"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts (filterable by author_id / agent_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["author_id?", "agent_id?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a DRAFT contract"
    roles: [Publisher]
    code: 200
    input: []
    output: Contract
    side_effects: ["status DRAFT->ACTIVE", "unrecouped_advance_cents=advance_cents", "increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract"
    roles: [Publisher]
    code: 200
    input: []
    output: Contract
    side_effects: ["status ACTIVE->TERMINATED", "increments Contract.version by 1"]

  # ---- Royalty tiers (children of Contract) ----
  - method: POST
    path: "/contracts/{id}/royalty-tiers"
    description: "Add a royalty escalator tier to a DRAFT contract"
    roles: [Publisher]
    code: 201
    input: ["lower_unit", "upper_unit?", "rate"]
    output: RoyaltyTier
    side_effects: ["create RoyaltyTier"]
  - method: GET
    path: "/contracts/{id}/royalty-tiers"
    description: "List a contract's royalty tiers (reverse-reachability for RoyaltyTier.contract_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: RoyaltyTier[]
    side_effects: []

  # ---- Titles (children of Contract) ----
  - method: POST
    path: "/contracts/{id}/titles"
    description: "Create a Title under a contract"
    roles: [Publisher]
    code: 201
    input: ["name", "edition?"]
    output: Title
    side_effects: ["create Title in DRAFT"]
  - method: GET
    path: "/contracts/{id}/titles"
    description: "List a contract's titles (reverse-reachability for Title.contract_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: Title[]
    side_effects: []
  - method: GET
    path: "/titles/{id}"
    description: "Fetch a title"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: Title
    side_effects: []
  - method: POST
    path: "/titles/{id}/publish"
    description: "Publish a DRAFT title"
    roles: [Publisher]
    code: 200
    input: []
    output: Title
    side_effects: ["status DRAFT->PUBLISHED"]
  - method: POST
    path: "/titles/{id}/retire"
    description: "Retire a PUBLISHED title to OUT_OF_PRINT"
    roles: [Publisher]
    code: 200
    input: []
    output: Title
    side_effects: ["status PUBLISHED->OUT_OF_PRINT", "set active=false on all Formats of this title (cascade)"]

  # ---- Formats (children of Title) ----
  - method: POST
    path: "/titles/{id}/formats"
    description: "Add a Format to a Title"
    roles: [Publisher]
    code: 201
    input: [format_type, list_price_cents]
    output: Format
    side_effects: ["create Format with active=true"]
  - method: GET
    path: "/titles/{id}/formats"
    description: "List a title's formats (reverse-reachability for Format.title_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: Format[]
    side_effects: []

  # ---- Sales periods (children of Contract) ----
  - method: POST
    path: "/contracts/{id}/sales-periods"
    description: "Open a new sales period on a contract"
    roles: [Publisher]
    code: 201
    input: [label, sequence]
    output: SalesPeriod
    side_effects: ["create SalesPeriod in OPEN"]
  - method: GET
    path: "/contracts/{id}/sales-periods"
    description: "List a contract's sales periods (reverse-reachability for SalesPeriod.contract_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: SalesPeriod[]
    side_effects: []
  - method: GET
    path: "/sales-periods/{id}"
    description: "Fetch a sales period"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: SalesPeriod
    side_effects: []
  - method: POST
    path: "/sales-periods/{id}/close"
    description: "Close an OPEN sales period"
    roles: [Publisher]
    code: 200
    input: []
    output: SalesPeriod
    side_effects: ["status OPEN->CLOSED"]

  # ---- Sales records (children of SalesPeriod) ----
  - method: POST
    path: "/sales-periods/{id}/sales-records"
    description: "Post a sales record (units sold/returned for a format) into an OPEN period"
    roles: [Publisher]
    code: 201
    input: ["format_id", "units_sold?", "units_returned?"]
    output: SalesRecord
    side_effects: ["create SalesRecord"]
  - method: GET
    path: "/sales-periods/{id}/sales-records"
    description: "List sales records in a period (reverse-reachability for SalesRecord.period_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["format_id?"]
    output: SalesRecord[]
    side_effects: []
  - method: GET
    path: "/sales-records"
    description: "Filtered list of sales records by format_id (reverse-reachability for SalesRecord.format_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["format_id?", "limit?", "offset?"]
    output: SalesRecord[]
    side_effects: []
  - method: GET
    path: "/sales-records/{id}"
    description: "Fetch a single sales record (gives SalesRecord a canonical collection segment)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: SalesRecord
    side_effects: []

  # ---- Subsidiary rights (children of Contract) ----
  - method: POST
    path: "/contracts/{id}/subsidiary-rights"
    description: "Register a subsidiary right sale (foreign/audio/film)"
    roles: [Publisher]
    code: 201
    input: [right_type, proceeds_cents, author_share_pct]
    output: SubsidiaryRight
    side_effects: ["create SubsidiaryRight in REGISTERED", "compute author_income_cents"]
  - method: GET
    path: "/contracts/{id}/subsidiary-rights"
    description: "List a contract's subsidiary rights (reverse-reachability for SubsidiaryRight.contract_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["status?"]
    output: SubsidiaryRight[]
    side_effects: []
  - method: GET
    path: "/subsidiary-rights/{id}"
    description: "Fetch a subsidiary right"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: SubsidiaryRight
    side_effects: []
  - method: POST
    path: "/subsidiary-rights/{id}/void"
    description: "Void a REGISTERED subsidiary right (deal fell through)"
    roles: [Publisher]
    code: 200
    input: []
    output: SubsidiaryRight
    side_effects: ["status REGISTERED->VOID"]

  # ---- Statements ----
  - method: POST
    path: "/sales-periods/{id}/generate-statement"
    description: "Generate a provisional DRAFT statement for a CLOSED period"
    roles: [Publisher]
    code: 201
    input: []
    output: AuthorStatement
    side_effects: ["create AuthorStatement in DRAFT with provisional computed figures"]
  - method: GET
    path: "/statements/{id}"
    description: "Fetch a statement with all computed monetary fields"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: AuthorStatement
    side_effects: []
  - method: GET
    path: "/sales-periods/{id}/statement"
    description: "Reverse-reachability for AuthorStatement.period_id (array of 0-1)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: AuthorStatement[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}/statements"
    description: "List a contract's statements (reverse-reachability for AuthorStatement.contract_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuthorStatement[]
    side_effects: []
  - method: POST
    path: "/statements/{id}/finalize"
    description: "Finalize a DRAFT statement: commit royalty, liquidate eligible reserves, recoup advance, withhold reserve, statement subsidiary rights"
    roles: [Publisher]
    code: 200
    input: [expected_contract_version]
    output: AuthorStatement
    side_effects:
      - "recompute all monetary fields (committed variant)"
      - "debit Contract.unrecouped_advance_cents by advance_recouped_cents"
      - "increment Contract.lifetime_net_units by period net units"
      - "liquidate eligible HELD ReturnsReserves (HELD->LIQUIDATED), credit released_cents"
      - "create a new HELD ReturnsReserve for reserve_held_cents"
      - "transition credited SubsidiaryRights REGISTERED->STATEMENTED"
      - "transition owning SalesPeriod CLOSED->STATEMENTED"
      - "emit immutable StatementLine rows"
      - "increments Contract.version by 1"
  - method: POST
    path: "/statements/{id}/pay"
    description: "Pay a FINALIZED statement: apply tax withholding, emit final ledger lines"
    roles: [Publisher]
    code: 200
    input: [expected_contract_version]
    output: AuthorStatement
    side_effects:
      - "compute tax_withheld_cents and final net_to_author_cents"
      - "status FINALIZED->PAID"
      - "emit TAX_WITHHELD and NET_PAYABLE StatementLines"
      - "increments Contract.version by 1"
  - method: GET
    path: "/statements/{id}/lines"
    description: "List immutable StatementLines for a statement (reverse-reachability for StatementLine.statement_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["line_type?"]
    output: StatementLine[]
    side_effects: []

  # ---- Reserves ----
  - method: GET
    path: "/contracts/{id}/reserves"
    description: "List a contract's returns reserves (reverse-reachability for ReturnsReserve.contract_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: ["status?"]
    output: ReturnsReserve[]
    side_effects: []
  - method: GET
    path: "/reserves/{id}"
    description: "Fetch a returns reserve"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: ReturnsReserve
    side_effects: []
  - method: GET
    path: "/statements/{id}/reserves"
    description: "List reserves originating from a statement (reverse-reachability for ReturnsReserve.origin_statement_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: ReturnsReserve[]
    side_effects: []
  - method: GET
    path: "/statements/{id}/subsidiary-rights"
    description: "List subsidiary rights credited on a statement (reverse-reachability for SubsidiaryRight.statement_id)"
    roles: [Publisher, Author, Agent]
    code: 200
    input: []
    output: SubsidiaryRight[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation, or entity_backed role acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, bad type, or invalid enum value"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Author/Agent email already exists"
  - id: ERR_COMMISSION_WITHOUT_AGENT
    http: 422
    condition: "agent_commission_pct > 0 but agent_id is null"
  - id: ERR_TIER_COVERAGE_INVALID
    http: 422
    condition: "royalty tiers do not form a contiguous cover from 1 with exactly one open-ended top tier (gap, overlap, missing base, or no/multiple open tiers)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource is not in a state that permits the requested transition"
  - id: ERR_CROSS_CONTRACT_REFERENCE
    http: 422
    condition: "SalesRecord.format_id belongs to a different contract than the period"
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "posting a sales record into a non-OPEN period, inactive format, or non-ACTIVE contract"
  - id: ERR_PERIOD_SEQUENCE_VIOLATION
    http: 409
    condition: "closing a period while an earlier-sequence period is not yet STATEMENTED"
  - id: ERR_STATEMENT_EXISTS
    http: 409
    condition: "a statement already exists for this period"
  - id: ERR_RIGHT_ALREADY_SETTLED
    http: 409
    condition: "voiding a SubsidiaryRight that is STATEMENTED (or already VOID)"
  - id: ERR_OPEN_LIABILITIES
    http: 409
    condition: "terminating a contract with HELD reserves or unpaid statements"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match the live Contract.version on finalize/pay"
  - id: ERR_DUPLICATE_PERIOD_SEQUENCE
    http: 409
    condition: "creating a SalesPeriod with a sequence already used on the contract"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "a numeric input violates its declared range (e.g. pct outside [0,1], list_price_cents <= 0, advance_cents < 0)"
  - id: ERR_TITLE_HAS_NO_FORMAT
    http: 409
    condition: "publishing a Title that has zero Formats"
  - id: ERR_CONTRACT_NOT_READY
    http: 409
    condition: "activating a contract that lacks tiers, a title, or a format"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Publisher
    description: "The publishing house operator: owns all posting, accounting, and lifecycle operations"
    identity: opaque
    exclusive_operations:
      - "POST /authors, POST /agents"
      - "POST /contracts and all contract lifecycle (activate, terminate)"
      - "POST royalty-tiers, titles, formats, sales-periods, sales-records, subsidiary-rights"
      - "publish/retire titles, close periods, void rights"
      - "generate-statement, finalize, pay"
    shared_operations:
      - "GET on contracts, titles, formats, sales-periods, statements, reserves, subsidiary-rights, lines (read)"
  - name: Author
    description: "The contracted author: read-only access to their own contracts, statements, reserves, and titles"
    identity: "entity_backed:Author"
    exclusive_operations: []
    shared_operations:
      - "GET /contracts/{id} and children where Contract.author_id == X-User-ID"
      - "GET /statements/{id}, /statements/{id}/lines for own contracts"
      - "GET /authors/{id} where id == X-User-ID"
  - name: Agent
    description: "The representing agent: read-only access to contracts they represent and the commission lines thereon"
    identity: "entity_backed:Agent"
    exclusive_operations: []
    shared_operations:
