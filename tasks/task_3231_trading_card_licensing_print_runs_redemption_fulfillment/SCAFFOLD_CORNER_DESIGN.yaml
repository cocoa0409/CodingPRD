              as: ProductManager
              captures: { p_s1_id: $.data.id, p_s1_v0: $.data.version }
            - call: "POST /api/card-sets/${p_s1_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${p_s1_id}/approve"
              payload: { expected_card_set_version: "${p_s1_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${p_l1_id}", set_name: "Flagship Insert", set_tier: "INSERT", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 0 }
              as: ProductManager
              captures: { p_s2_id: $.data.id, p_s2_v0: $.data.version }
            - call: "POST /api/card-sets/${p_s2_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${p_s2_id}/approve"
              payload: { expected_card_set_version: "${p_s2_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${p_l1_id}", set_name: "Flagship Premium", set_tier: "PREMIUM", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 0 }
              as: ProductManager
              captures: { p_s3_id: $.data.id, p_s3_v0: $.data.version }
            - call: "POST /api/card-sets/${p_s3_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${p_s3_id}/approve"
              payload: { expected_card_set_version: "${p_s3_v0}" }
              as: ProductManager
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${p_s1_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${p_line_v}", demand_multiplier: 1.0, declared_quantity: 1500, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${p_s2_id}", authority: "MARKET_DEMAND", proposed_against_line_version: "${p_line_v}", demand_multiplier: 1.0, declared_quantity: 1300, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${p_s3_id}", authority: "MARKET_DEMAND", proposed_against_line_version: "${p_line_v}", demand_multiplier: 1.0, declared_quantity: 1225, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "GET /api/product-lines/${p_l1_id}"
              payload: {}
              as: ProductManager
              captures: { line_cards: $.data.allocated_cards }
          assert:
            - "the BASE set's projected quantity is 1500 — ceil(1234 / 500) x 500"
            - "the INSERT set's projected quantity is 1300 — ceil(1234 / 100) x 100"
            - "the PREMIUM set's projected quantity is 1225 — ceil(1234 / 25) x 25"
            - "ProductLine.${p_l1_id}.allocated_cards == 4025 as the sum of the three per-set snapped values"
            - "the result is never 3702, which would mean the snap was skipped or applied to the sum"

  # ===========================================================================
  - section: validations
    instances:

      - name: price_checked_after_the_collector_facing_safety_rules
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - errors.ERR_CLAIM_BACKDATE_EXCEEDED
        distinguishing_aspect: "A request that violates both the Priority-8 back-date rule and the Priority-17 deadline rule returns the safety error, so the collector-facing window outranks the fiscal one."
        test_recipe:
          setup:
            - "Logical clock at 2029-01-01T00:00:00Z. License L active, set S approved. One redemption on S with estimated_value_cents 400000 opened 2026-09-01 and deadline_days 730, so its deadline passed. One quality claim back-dated to 2026-01-01, far outside the 30-day window."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-2001", signer_name: "Ken Griffey Jr", estimated_value_cents: 400000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { v_red_id: $.data.id }
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 10, filed_on: "2026-01-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { v_qc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/quality-claims/${v_qc_id}/open-review"
              payload: {}
              as: QualityAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CLAIM_BACKDATE_EXCEEDED"
            - "error_id != ERR_REDEMPTION_DEADLINE_EXCEEDED, so the safety row is evaluated ahead of the fiscal row"
            - "QualityClaim.${v_qc_id}.status is still FILED"
            - "a control call confirms both rows are individually reachable: closing the redemption at the same clock returns ERR_REDEMPTION_DEADLINE_EXCEEDED, proving both rows are individually reachable"

      - name: a_wildcard_free_request_still_passes_every_validation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - validations[priority=4]
          - validations[priority=7]
        distinguishing_aspect: "A fully conforming collector-complaint creation passes all seventeen rows, so the validation stack rejects nothing when it should reject nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, set S approved with print_run_status UNDECIDED."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
          trigger:
            - call: "POST /api/card-sets/${set_id}/complaints"
              payload: { complaint_label: "Replacement policy absent", breach_reason: "NO_REPLACEMENT_POLICY", claim_quantity: 250 }
              as: CollectorSupportSpecialist
              captures: { comp_id: $.data.id }
          assert:
            - "the response status is 201 and CollectorComplaint.${comp_id}.status == OPEN"
            - "error_id is absent from the response body"
            - "CollectorComplaint.${comp_id}.breach_reason == NO_REPLACEMENT_POLICY and claim_quantity == 250"
            - "CardSet.${set_id}.settled_complaint_count == 0 until the complaint is both approved and settled"

      - name: claim_quantity_override_is_checked_after_the_availability_authority
        claim_type: Priority Ordering
        grounds:
          - "state_machines.CollectorComplaint.UNDER_REVIEW_to_APPROVED"
          - validations[priority=7]
          - errors.ERR_REPLACEMENT_POLICY_EXISTS
        distinguishing_aspect: "Against the same complaint both the availability-authority rule and the quantity rule fail, and the authority rule wins because it is the availability gate that speaks to the set's declared truth."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, set S approved and packed out with one existing quality claim filed against it. A NO_REPLACEMENT_POLICY complaint with claim_quantity 0 is created on S and moved into review."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 10, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
            - call: "POST /api/card-sets/${set_id}/complaints"
              payload: { complaint_label: "No replacement policy", breach_reason: "NO_REPLACEMENT_POLICY", claim_quantity: 0 }
              as: CollectorSupportSpecialist
              captures: { w_comp_id: $.data.id }
            - call: "POST /api/collector-complaints/${w_comp_id}/start-review"
              payload: {}
              as: CollectorSupportSpecialist
          trigger:
            - call: "POST /api/collector-complaints/${w_comp_id}/approve"
              payload: {}
              as: CollectorSupportSpecialist
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_REPLACEMENT_POLICY_EXISTS"
            - "error_id != ERR_CLAIM_QUANTITY_INVALID, so the authority rule precedes the quantity rule on the same request"
            - "CollectorComplaint.${w_comp_id}.status stays UNDER_REVIEW"
            - "on a set with no quality claims at all, the same request returns ERR_CLAIM_QUANTITY_INVALID instead"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: card_set_approval_chain_returns_all_three_links_of_the_hierarchy
        claim_type: Computed read
        grounds:
          - "endpoints.GET_/api/card-sets/{cardSetId}/approval-chain"
          - entities.ProductLine
          - entities.License
        distinguishing_aspect: "The approval-chain read composes three entities into one response, so a set, its parent line and that line's license all arrive from a single call with the license reached only through the line."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S approved."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
          trigger:
            - call: "GET /api/card-sets/${set_id}/approval-chain"
              payload: {}
              as: ProductManager
          assert:
            - "the response status is 200 and the payload carries a card_set, a product_line and a license"
            - "the card_set link is CardSet.${set_id} with status APPROVED and rights_pinned_version 1"
            - "the product_line link is ProductLine.${line_id} and the license link is License.${lic_id}"
            - "the license link's grantor_name is the players association, reached without a second call"
            - "the license link's id equals the product_line link's license_id, so the chain is internally consistent"

      - name: creating_a_distribution_allocation_does_not_grow_the_producible_total
        claim_type: Conditional action
        grounds:
          - "endpoints.POST_/api/distribution-allocations"
          - calculations.distribution_share_projection
          - entities.ProductLine.fields.cases_printed
        distinguishing_aspect: "An allocation whose projected channel cases stay within cases_printed is reserved, so creating it changes channel composition without any rejection."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. License L active and line PL with cases_printed 50."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
          trigger:
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 40, effective_price_cents: 72000 }
              as: DistributionManager
              captures: { alloc_hobby: $.data.id }
          assert:
            - "the response status is 201 and DistributionAllocation.${alloc_hobby}.status == RESERVED"
            - "DistributionAllocation.${alloc_hobby}.shipped_quantity == 0"
            - "an allocation landing exactly on capacity is accepted: a second request for 10 more cases also returns 201"
            - "a further request for 1 more case returns 422 with error_id == ERR_ALLOCATION_EXCEEDS_PRINT_RUN, so the bound is strict greater-than"

      - name: recalling_a_shipped_allocation_returns_the_product_line
        claim_type: Action endpoint
        grounds:
          - "state_machines.DistributionAllocation.SHIPPED_to_RECALLED"
          - "endpoints.POST_/api/distribution-allocations/{distributionAllocationId}/recall"
          - entities.ProductLine
        distinguishing_aspect: "The recall action returns the ProductLine rather than the allocation, because its declared side effect unwinds the line and supersedes that line's decisions."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-15T00:00:00Z. License L active, line PL packed out, one HOBBY allocation of 10 cases marked UTF and shipped. One APPROVED quality claim on the line's set with affected_quantity 40."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { set_v1: $.data.version }
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 40, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { re_qc_id: $.data.id }
            - call: "POST /api/quality-claims/${re_qc_id}/open-review"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/quality-claims/${re_qc_id}/approve"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 12000, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { re_dec_id: $.data.id }
            - call: "POST /api/print-run-decisions/${re_dec_id}/approve"
              payload: { expected_card_set_version: "${set_v1}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
            - call: "POST /api/card-sets/${set_id}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/product-lines/${line_id}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/card-sets/${set_id}/pack-out"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/product-lines/${line_id}/pack-out"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 10, effective_price_cents: 72000 }
              as: DistributionManager
              captures: { re_alloc_id: $.data.id }
            - call: "POST /api/distribution-allocations/${re_alloc_id}/mark-utf"
              payload: {}
              as: DistributionManager
            - call: "POST /api/distribution-allocations/${re_alloc_id}/ship"
              payload: {}
              as: DistributionManager
          trigger:
            - call: "POST /api/distribution-allocations/${re_alloc_id}/recall"
              payload: {}
              as: DistributionManager
              captures: { recalled_line_id: $.data.id }
          assert:
            - "the response status is 200 and the returned resource is the ProductLine, not the allocation"
            - "DistributionAllocation.${re_alloc_id}.status == RECALLED and shipped_quantity == 0"
            - "ProductLine.${line_id}.status == PLANNING, unwound by the recall"
            - "CardSet.${set_id}.print_run_status == UNDECIDED and PrintRunDecision.${re_dec_id}.status == SUPERSEDED"
            - "the recall is declined with ERR_PRODUCT_LINE_STATE_BLOCKED when the line is still APPROVED and has not shipped"

  # ===========================================================================
  - section: errors
    instances:
      # --- exclusions: already asserted as a §1.8 failure path ---

      - name: error_catalog_excluded_license_not_in_force
        claim_type: Violation -> Error
        grounds: ["errors.ERR_LICENSE_NOT_IN_FORCE"]
        excluded_because:
          difficulty_instance: out_of_force_license_beats_missing_resource_on_line_activation
          rationale: "Asserted as the failure path of the priority_pair_validation_conflict instance that activates a product line under an out-of-term license."

      - name: error_catalog_excluded_product_line_not_ready
        claim_type: Violation -> Error
        grounds: ["errors.ERR_PRODUCT_LINE_NOT_READY"]
        excluded_because:
          difficulty_instance: card_set_submission_requires_the_parent_line_ready_for_approval
          rationale: "Asserted as the failure path of the cross_entity_state_dependency instance that submits a card set before its parent line is ready."

      - name: error_catalog_excluded_print_run_not_locked
        claim_type: Violation -> Error
        grounds: ["errors.ERR_PRINT_RUN_NOT_LOCKED"]
        excluded_because:
          difficulty_instance: card_production_start_requires_a_locked_print_run
          rationale: "Asserted as the failure path of the cross_entity_state_dependency instance that starts card production before any decision is frozen."

      - name: error_catalog_excluded_signer_double_booked
        claim_type: Violation -> Error
        grounds: ["errors.ERR_SIGNER_DOUBLE_BOOKED"]
        excluded_because:
          difficulty_instance: two_signing_sessions_for_one_signer_on_the_same_day_collide
          rationale: "Asserted as the failure path of the resource_temporal_overlap instance that books one signer twice on the same day."

      - name: error_catalog_excluded_config_ladder_violation
        claim_type: Violation -> Error
        grounds: ["errors.ERR_CONFIG_LADDER_VIOLATION"]
        excluded_because:
          difficulty_instance: config_serial_thirty_is_legal_and_thirty_one_is_not
          rationale: "Asserted as the failure path of the boundary_precision_check instance that publishes pack configuration serial 30 out of order."

      - name: error_catalog_excluded_config_serial_out_of_range
        claim_type: Violation -> Error
        grounds: ["errors.ERR_CONFIG_SERIAL_OUT_OF_RANGE"]
        excluded_because:
          difficulty_instance: config_serial_thirty_is_legal_and_thirty_one_is_not
          rationale: "Asserted as the failure path of the boundary_precision_check instance that publishes pack configuration serial 31."

      - name: error_catalog_excluded_claim_backdate_exceeded
        claim_type: Violation -> Error
        grounds: ["errors.ERR_CLAIM_BACKDATE_EXCEEDED"]
        excluded_because:
          difficulty_instance: claim_backdate_window_opens_at_thirty_days_not_twenty_nine
          rationale: "Asserted as the failure path of the boundary_precision_check instance that opens review on a claim filed exactly thirty days back."

      - name: error_catalog_excluded_claim_quantity_invalid
        claim_type: Violation -> Error
        grounds: ["errors.ERR_CLAIM_QUANTITY_INVALID"]
        excluded_because:
          difficulty_instance: claim_backdate_window_opens_at_thirty_days_not_twenty_nine
          rationale: "Asserted as the failure path of the boundary_precision_check instance that approves a complaint asserting zero cards."

      - name: error_catalog_excluded_channel_already_utf
        claim_type: Violation -> Error
        grounds: ["errors.ERR_CHANNEL_ALREADY_UTF"]
        excluded_because:
          difficulty_instance: two_hobby_allocations_for_one_line_cannot_both_be_utf
          rationale: "Asserted as the failure path of the resource_temporal_overlap instance that marks a second hobby allocation unable-to-fill."

      - name: a_print_run_decision_built_against_a_stale_line_version_is_refused
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_AUTHORITY_OUTDATED
          - entities.PrintRunDecision.fields.proposed_against_line_version
          - "endpoints.POST_/api/print-run-decisions/{printRunDecisionId}/approve"
        distinguishing_aspect: "expected_product_line_version is an observable state field rather than an OCC race: advancing the line's version between the proposal and the approval leaves the CardSet version untouched but still refuses the freeze with 412."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S approved. Decision D proposed against the line version observed at line creation. A PATCH to the line then advances ProductLine.version without touching the set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &ao_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { ao_lic_id: $.data.id }
            - call: "POST /api/licenses/${ao_lic_id}/activate"
              payload: {}
              as: LicensingManager
            - &ao_line
              call: "POST /api/product-lines"
              payload: { license_id: "${ao_lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { ao_line_id: $.data.id, ao_line_v1: $.data.version }
            - &ao_set
              call: "POST /api/card-sets"
              payload: { product_line_id: "${ao_line_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { ao_set_id: $.data.id, ao_set_v0: $.data.version }
            - call: "POST /api/card-sets/${ao_set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${ao_set_id}/approve"
              payload: { expected_card_set_version: "${ao_set_v0}" }
              as: ProductManager
              captures: { ao_set_v1: $.data.version }
            - &ao_decision
              call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${ao_set_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${ao_line_v1}", demand_multiplier: 1.0, declared_quantity: 12000, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { ao_dec_id: $.data.id }
            - call: "PATCH /api/product-lines/${ao_line_id}"
              payload: { cases_printed: 45 }
              as: ProductManager
              captures: { ao_line_v2: $.data.version }
          trigger:
            - call: "POST /api/print-run-decisions/${ao_dec_id}/approve"
              payload: { expected_card_set_version: "${ao_set_v1}", expected_product_line_version: "${ao_line_v2}" }
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_AUTHORITY_OUTDATED"
            - "error_id != ERR_STALE_VERSION, because the CardSet version the caller holds is the current one"
            - "CardSet.${ao_set_id}.print_run_status == UNDECIDED and print_run_quantity == 500, so no freeze happened"
            - "PrintRunDecision.${ao_dec_id}.status == PROPOSED and its proposed_against_line_version == ${ao_line_v1}, which is now behind the line's ${ao_line_v2}"
            - "the same approval with expected_product_line_version ${ao_line_v1} also fails, since the stored basis is behind the line rather than the request"

      # --- grounded instances ---

      - name: every_entity_not_found_error_is_reachable_from_its_collection
        claim_type: Not Found
        grounds:
          - "validations[priority=4.5]"
          - errors.ERR_PRINT_RUN_DECISION_NOT_FOUND
          - errors.ERR_COLLECTOR_COMPLAINT_NOT_FOUND
        distinguishing_aspect: "Each collection reports its OWN not-found error for an unallocated id, so the twelve entity-specific codes are distinguishable from one another and from ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active so a license id exists while every other collection is empty."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
          trigger:
            - call: "GET /api/print-run-decisions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PRINT_RUN_DECISION_NOT_FOUND"
            - "GET /api/collector-complaints/22222222-2222-4222-8222-222222222222 returns 404 with ERR_COLLECTOR_COMPLAINT_NOT_FOUND"
            - "GET /api/licenses/22222222-2222-4222-8222-222222222222 returns 404 with ERR_LICENSE_NOT_FOUND"
            - "GET /api/licenses/${lic_id} still returns 200, so only the unallocated ids fail"
            - "no path-segment miss returns ERR_REFERENCE_NOT_FOUND, which is reserved for ids supplied in request bodies"

      - name: redemption_code_of_a_universe_series_is_rejected_on_reuse
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_REDEMPTION_CODE_DUPLICATE
          - "endpoints.POST_/api/card-sets/{cardSetId}/redemptions"
          - entities.Redemption.fields.redemption_code
        distinguishing_aspect: "redemption_code is globally unique, so the second issue on a DIFFERENT set with the same code is refused as a duplicate rather than silently creating a second row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL with two approved BASE sets S1 and S2. One redemption with code RDM-4001 exists on S1."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Auto", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 1000 }
              as: ProductManager
              captures: { d_s2_id: $.data.id, d_s2_v0: $.data.version }
            - call: "POST /api/card-sets/${d_s2_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${d_s2_id}/approve"
              payload: { expected_card_set_version: "${d_s2_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-4001", signer_name: "Ken Griffey Jr", estimated_value_cents: 300000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { d_red_first: $.data.id }
          trigger:
            - call: "POST /api/card-sets/${d_s2_id}/redemptions"
              payload: { redemption_code: "RDM-4001", signer_name: "Ken Griffey Jr", estimated_value_cents: 300000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REDEMPTION_CODE_DUPLICATE"
            - "CardSet.${d_s2_id}.autograph_redemptions_outstanding == 0, so the duplicate created nothing"
            - "POST /api/card-sets/${d_s2_id}/redemptions with code RDM-4002 returns 201, proving only the code collided"
            - "the same code on the SAME set is refused identically, so uniqueness is global rather than per-set"

      - name: unknown_redemption_id_returns_redemption_not_found
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_REDEMPTION_NOT_FOUND
          - "endpoints.GET_/api/redemptions/{redemptionId}"
        distinguishing_aspect: "An unallocated id on the redemptions collection produces ERR_REDEMPTION_NOT_FOUND, distinct from the reference error used when an id appears in a request body."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No redemption has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /api/redemptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RedemptionFulfilmentAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_REDEMPTION_NOT_FOUND"
            - "error_id != ERR_REFERENCE_NOT_FOUND, so a path-segment miss is not reported as a body-reference miss"
            - "response_type is error and data.message is non-empty"

      - name: unauthenticated_request_is_rejected_before_any_resource_lookup
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 authentication is evaluated before Priority 4 existence, so an unauthenticated request naming a nonexistent id returns 401 rather than 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /api/licenses/00000000-0000-4000-8000-000000000000?X-User-Role=GhostRole&X-User-ID=ghost"
              payload: {}
              as: GhostRole
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_LICENSE_NOT_FOUND, so authentication precedes existence"
            - "error_id != ERR_FORBIDDEN, which is reserved for a recognised role lacking the operation"

  # ===========================================================================
  - section: rbac
    instances:

      - name: a_licensing_manager_cannot_approve_a_card_set
        claim_type: RBAC
        grounds:
          - roles.ProductManager
          - roles.LicensingManager
          - "endpoints.POST_/api/card-sets/{cardSetId}/approve"
        distinguishing_aspect: "Card-set approval is exclusive to ProductManager, so the licensing manager is refused even though it owns the license the set depends on."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S in UNDER_REVIEW with one approved artwork."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-25T00:00:00Z" }
              as: ProductManager
              captures: { rb_art_id: $.data.id }
            - call: "POST /api/artwork-approvals/${rb_art_id}/decide"
              payload: { decision: "APPROVE", decided_on: "2026-08-26T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${lic_id}"
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
              captures: { rb_set_v: $.data.version }
          trigger:
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${rb_set_v}" }
              as: LicensingManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "CardSet.${set_id}.status == UNDER_REVIEW, unchanged"
            - "the same call as ProductManager returns 200, so the operation is reachable for the owning role"
            - "error_id != ERR_INVALID_STATE, since authorization precedes the state check"

      - name: a_product_manager_cannot_decide_an_artwork_approval
        claim_type: RBAC
        grounds:
          - roles.LicensorApprover
          - "endpoints.POST_/api/artwork-approvals/{artworkApprovalId}/decide"
          - entities.ArtworkApproval.fields.approver_id
        distinguishing_aspect: "Artwork decision is exclusive to the licensor, and the acting user id must equal the License that holds the approval right, so the submitting product manager is refused twice over."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL, set S with one SUBMITTED artwork addressed to L."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-25T00:00:00Z" }
              as: ProductManager
              captures: { rb_art_id: $.data.id }
          trigger:
            - call: "POST /api/artwork-approvals/${rb_art_id}/decide"
              payload: { decision: "APPROVE", decided_on: "2026-08-26T00:00:00Z" }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "ArtworkApproval.${rb_art_id}.status == SUBMITTED, unchanged"
            - "the same call as LicensorApprover returns 200, so the operation exists and only the role was wrong"
            - "ArtworkApproval.${rb_art_id}.approver_id == License.${lic_id}.id, so the licensor identity is entity-backed"

      - name: a_quality_analyst_cannot_settle_a_redemption_substitution
        claim_type: RBAC
        grounds:
          - roles.QualityAnalyst
          - roles.RedemptionFulfilmentAnalyst
          - "endpoints.POST_/api/collector-notifications/{collectorNotificationId}/settle"
        distinguishing_aspect: "Settlement of a substitution notice belongs to the redemption analyst, so the quality analyst is refused despite owning the claim path that can reverse a fulfilment."
        test_recipe:
          setup:
            - "Logical clock at 2029-01-01T00:00:00Z. License L active, set S approved. One redemption on S cancelled after its deadline, with one ISSUED settlement notice served against it."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-3001", signer_name: "Ken Griffey Jr", estimated_value_cents: 400000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { rb_red_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/redemptions/${rb_red_id}/cancel"
              payload: {}
              as: RedemptionFulfilmentAnalyst
            - call: "POST /api/redemptions/${rb_red_id}/notifications"
              payload: { notice_code: "SUBST-90", opened_on: "2029-01-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { rb_notice_id: $.data.id }
          trigger:
            - call: "POST /api/collector-notifications/${rb_notice_id}/settle"
              payload: { redemption_status: "CANCELLED", compensation_value_equals_scratch: true }
              as: QualityAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "CollectorNotification.${rb_notice_id}.status == ISSUED, unchanged"
            - "the same call as RedemptionFulfilmentAnalyst returns 200"
            - "error_id != ERR_INVALID_STATE, so the role check runs before the state check"

      - name: a_distribution_manager_cannot_recall_an_allocation_that_has_not_shipped
        claim_type: RBAC
        grounds:
          - roles.DistributionManager
          - "state_machines.DistributionAllocation.SHIPPED_to_RECALLED"
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Recall is within the distribution manager's own exclusive set, so the refusal here is the state precondition rather than authorization — the retry after shipping succeeds for the same role."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-15T00:00:00Z. License L active, line PL packed out, one HOBBY allocation still RESERVED."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { set_v1: $.data.version }
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 12000, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { rb_dec_id: $.data.id }
            - call: "POST /api/print-run-decisions/${rb_dec_id}/approve"
              payload: { expected_card_set_version: "${set_v1}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
            - call: "POST /api/card-sets/${set_id}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/product-lines/${line_id}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/card-sets/${set_id}/pack-out"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/product-lines/${line_id}/pack-out"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 10, effective_price_cents: 72000 }
              as: DistributionManager
              captures: { rb_alloc_id: $.data.id }
            - call: "POST /api/distribution-allocations/${rb_alloc_id}/mark-utf"
              payload: {}
              as: DistributionManager
          trigger:
            - call: "POST /api/distribution-allocations/${rb_alloc_id}/recall"
              payload: {}
              as: DistributionManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_FORBIDDEN, so the refusal is the state precondition and not the role"
            - "DistributionAllocation.${rb_alloc_id}.status == UTF, unchanged"
            - "after the ship call succeeds the same recall returns 200, proving the role was always permitted"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: patching_a_product_line_bumps_only_its_own_version
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_layers.derived_field_reconciliation
          - entities.ProductLine.fields.sets_per_case
          - "endpoints.PATCH_/api/product-lines/{productLineId}"
        distinguishing_aspect: "Changing packs_per_box recomputes sets_per_case on the same entity and bumps only that entity's version, leaving the parent license and every card set untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL PLANNING with packs_per_box 10, and one DRAFT set S under it."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
          trigger:
            - call: "PATCH /api/product-lines/${line_id}"
              payload: { packs_per_box: 20 }
              as: ProductManager
          assert:
            - "the response status is 200 and ProductLine.${line_id}.packs_per_box == 20"
            - "ProductLine.${line_id}.sets_per_case == 4000, recomputed from the patched field"
            - "ProductLine.${line_id}.version == 2 while License.${lic_id}.version is unchanged by the patch"
            - "CardSet.${set_id}.version == 1 and its product_line_id still resolves, so the patch does not cascade into the children"

      - name: a_superseded_print_run_decision_can_be_replaced_by_a_fresh_proposal
        claim_type: cascading_side_effects
        grounds:
          - complexity_layers.cascading_side_effects
          - "state_machines.PrintRunDecision.PROPOSED_to_APPROVED"
          - "state_machines.PrintRunDecision.APPROVED_to_SUPERSEDED"
        distinguishing_aspect: "Freezing a second decision supersedes the first and reports exactly one APPROVED row per set, so the side effect is observable through a filtered list rather than only through the set's own fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S approved. Decision D1 proposed and approved at 12000; decision D2 proposed at 1500."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { set_v1: $.data.version }
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 12000, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { cc_d1_id: $.data.id }
            - call: "POST /api/print-run-decisions/${cc_d1_id}/approve"
              payload: { expected_card_set_version: "${set_v1}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
              captures: { set_v2: $.data.version }
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 1500, announced: false, proposed_on: "2026-09-06T00:00:00Z" }
              as: ProductionPlanner
              captures: { cc_d2_id: $.data.id }
          trigger:
            - call: "POST /api/print-run-decisions/${cc_d2_id}/approve"
              payload: { expected_card_set_version: "${set_v2}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
          assert:
            - "the response status is 200 and PrintRunDecision.${cc_d2_id}.status == APPROVED"
            - "PrintRunDecision.${cc_d1_id}.status == SUPERSEDED, driven by the second freeze"
            - "GET /api/card-sets/${set_id}/print-run-decisions?status=APPROVED returns exactly 1 row"
            - "CardSet.${set_id}.print_run_quantity == 1500 and announced == false, so the latest freeze wins"
            - "CardSet.${set_id}.print_run_status == LOCKED throughout"

      - name: rejected_transition_carries_no_side_effects
        claim_type: OCC stale version conflict
        grounds:
          - concurrency_rules[card-set-approval-stale-version]
          - errors.ERR_STALE_VERSION
          - "endpoints.POST_/api/card-sets/{cardSetId}/approve"
        distinguishing_aspect: "A stale expected version produces 412 with the set, the license counts and the artwork all unmoved, so the rejection is atomic rather than partially applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S in UNDER_REVIEW with one approved artwork. A stale version snapshot is captured at submit time before a second artwork submission advances the set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &occ_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "National Football League", exclusivity_scope: "NON_EXCLUSIVE", term_starts_on: "2026-02-01T00:00:00Z", term_ends_on: "2030-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { occ_lic_id: $.data.id }
            - call: "POST /api/licenses/${occ_lic_id}/activate"
              payload: {}
              as: LicensingManager
            - &occ_line
              call: "POST /api/product-lines"
              payload: { license_id: "${occ_lic_id}", line_name: "2026 Gridiron Football", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 40, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { occ_line_id: $.data.id }
            - &occ_set
              call: "POST /api/card-sets"
              payload: { product_line_id: "${occ_line_id}", set_name: "Gridiron Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { occ_set_id: $.data.id, occ_set_v0: $.data.version }
            - call: "POST /api/product-lines/${occ_line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${occ_set_id}/artwork-approvals"
              payload: { artwork_code: "ART-GRID-001", approver_id: "${occ_lic_id}", submitted_on: "2026-08-25T00:00:00Z" }
              as: ProductManager
              captures: { occ_art_id: $.data.id }
            - call: "POST /api/artwork-approvals/${occ_art_id}/decide"
              payload: { decision: "APPROVE", decided_on: "2026-08-26T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${occ_lic_id}"
            - call: "POST /api/card-sets/${occ_set_id}/submit"
              payload: {}
              as: ProductManager
              captures: { occ_set_v: $.data.version }
            - call: "POST /api/card-sets/${occ_set_id}/artwork-approvals"
              payload: { artwork_code: "ART-GRID-002", approver_id: "${occ_lic_id}", submitted_on: "2026-08-27T00:00:00Z" }
              as: ProductManager
          trigger:
            - call: "POST /api/card-sets/${occ_set_id}/approve"
              payload: { expected_card_set_version: "${occ_set_v} - 1" }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "CardSet.${occ_set_id}.status == UNDER_REVIEW and rights_pinned_version == 0"
            - "License.${occ_lic_id}.approved_set_count == 0, so the rejected call left no side effect"
            - "the same call with expected_card_set_version ${occ_set_v} returns 200, so only the version was stale"
            - "artwork was not consumed by the rejected call: the second APPROVAL row is still SUBMITTED"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: an_immediate_read_after_a_write_reflects_the_new_state
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints.GET_/api/card-sets/{cardSetId}"
          - entities.CardSet.fields.print_run_status
        distinguishing_aspect: "Every writing call's response and a follow-up read agree in the same logical instant: the approval response already reports APPROVED and the compound print_run_status already reports LOCKED after the freeze."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { cm_set_v1: $.data.version }
          trigger:
            - call: "GET /api/card-sets/${set_id}"
              payload: {}
              as: ProductManager
          assert:
            - "the immediately-following read returns CardSet.${set_id}.status == APPROVED with no delay"
            - "the read's updated_at is not earlier than the approving response's updated_at"
            - "a freeze followed by an immediate read reports print_run_status == LOCKED and print_run_quantity equal to the frozen final_quantity"
            - "no write in this chain exposes a stale value on the very next read"

      - name: license_counts_are_reconciled_by_traversal_not_by_a_running_delta
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.license_set_counts
          - entities.License.fields.approved_set_count
          - "endpoints.GET_/api/licenses/{licenseId}"
        distinguishing_aspect: "The license counters are recomputed by full traversal, so an approve followed by a return-to-draft leaves approved_set_count at 0 rather than drifting upward by one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, sets S1 and S2 both approved under the line."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { cm_s1_v1: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Auto", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 1000 }
              as: ProductManager
              captures: { cm_s2_id: $.data.id, cm_s2_v0: $.data.version }
            - call: "POST /api/card-sets/${cm_s2_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${cm_s2_id}/approve"
              payload: { expected_card_set_version: "${cm_s2_v0}" }
              as: ProductManager
          trigger:
            - call: "POST /api/card-sets/${cm_s2_id}/return-to-draft"
              payload: {}
              as: ProductManager
          assert:
            - "License.${lic_id}.approved_set_count was 2 before the trigger and is 1 after it"
            - "License.${lic_id}.set_count == 2 at both points, since both sets still exist"
            - "the counter was reduced by traversal: re-reading GET /api/licenses/${lic_id} reports the same 1"
            - "CardSet.${cm_s2_id}.status == DRAFT and CardSet.${set_id}.status == APPROVED"
