# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: enumerates testable claims from §1.1–§1.7 not already covered
# by §1.8. Same seven-point per-instance contract as §1.8; setup_api_calls obey
# the same reachability / literal-lock / OCC-placeholder discipline.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_license_class_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.LicenseClass"
          - "endpoints"
        distinguishing_aspect: "POST /license-classes with all required fields -> 201; response echoes code, premise_type, base_fee_cents, renewal_cycle_months, max_servers_per_license and a server-minted id."
        test_recipe:
          setup: ["Empty DB; Director acting."]
          setup_api_calls: []
          trigger:
            - call: "POST /license-classes"
              payload: { code: "OFF_21", premise_type: "OFF_PREMISE", quota_managed: true, base_fee_cents: 80000, renewal_cycle_months: 24, requires_zoning: true, max_servers_per_license: 0 }
              as: Director
              captures: { cls_id: $.data.id, cls_code: $.data.code }
          assert:
            - "response_type == object"
            - "LicenseClass.${cls_id}.code == OFF_21"
            - "LicenseClass.${cls_id}.base_fee_cents == 80000"
            - "LicenseClass.${cls_id}.renewal_cycle_months == 24"

      - name: get_quota_region_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.QuotaRegion"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /quota-regions/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /quota-regions/00000000-0000-0000-0000-000000000000"
              as: Director
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_premise_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Premise.fields.distance_to_school_m"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /premises omitting distance_to_school_m (required, source input, no default) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An applicant and region exist."]
          setup_api_calls:
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: license_class_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - "entities.LicenseClass.fields.quota_managed"
          - "entities.LicenseClass.fields.requires_zoning"
        distinguishing_aspect: "POST /license-classes omitting quota_managed and requires_zoning applies declared defaults (both true)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /license-classes"
              payload: { code: "ON_48", premise_type: "ON_PREMISE", base_fee_cents: 90000, renewal_cycle_months: 12, max_servers_per_license: 3 }
              as: Director
              captures: { cls_id: $.data.id }
          assert:
            - "LicenseClass.${cls_id}.quota_managed == true"
            - "LicenseClass.${cls_id}.requires_zoning == true"

      - name: application_id_is_system_minted_input_id_ignored
        claim_type: System Fields
        grounds:
          - "entities.LicenseApplication.fields.status"
        distinguishing_aspect: "POST /license-applications sets status=DRAFT by the system regardless of any client-supplied value; id/created_at/version are server-minted."
        test_recipe:
          setup: ["Class, region, applicant, premise exist."]
          setup_api_calls:
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
          trigger:
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id, la_status: $.data.status, la_v: $.data.version }
          assert:
            - "LicenseApplication.${la_id}.status == DRAFT"
            - "LicenseApplication.${la_id}.version == 1"
            - "LicenseApplication.${la_id}.fee_paid_cents == 0"

      - name: create_premise_with_invalid_zoning_district_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Premise.fields.zoning_district"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /premises with zoning_district not in {COMMERCIAL, MIXED_USE, RESIDENTIAL, INDUSTRIAL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["An applicant and region exist."]
          setup_api_calls:
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "PARKLAND" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: application_computed_fee_quoted_cents_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - "entities.LicenseApplication.fields.fee_quoted_cents"
          - "calculations.fee_assessment"
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_rounding_order_per_component_vs_sum_then_round
          rationale: "fee_quoted_cents correctness (computed, input ignored) is asserted by the rounding-order §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdraw_application_from_draft_succeeds
        claim_type: Valid Transition
        grounds:
          - "state_machines.LicenseApplication.DRAFT_to_WITHDRAWN"
        distinguishing_aspect: "POST /license-applications/{id}/withdraw on a DRAFT application -> WITHDRAWN; no quota slot was held so none released."
        test_recipe:
          setup: ["A DRAFT application la_id (never submitted)."]
          setup_api_calls:
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /license-applications/${la_id}/withdraw"
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { st: $.data.status }
          assert:
            - "LicenseApplication.${la_id}.status == WITHDRAWN"
            - "LicenseApplication.${la_id}.quota_slot_held == false"

      - name: begin_review_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.LicenseApplication.SUBMITTED_to_UNDER_REVIEW"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "begin-review on a DRAFT (not SUBMITTED) application -> ERR_INVALID_STATE; the SUBMITTED_to_UNDER_REVIEW transition has no DRAFT from-state."
        test_recipe:
          setup: ["A DRAFT application la_id."]
          setup_api_calls:
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: withdraw_already_withdrawn_application_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.LicenseApplication.DRAFT_to_WITHDRAWN"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw on an already-WITHDRAWN application -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A WITHDRAWN application la_id."]
          setup_api_calls:
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/withdraw"
              as: Applicant
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /license-applications/${la_id}/withdraw"
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: background_fail_cascades_applicant_disqualified
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.BackgroundCheck.PENDING_to_FAILED"
          - "entities.Applicant.fields.disqualified"
        distinguishing_aspect: "Resolving a BackgroundCheck FAIL sets Applicant.disqualified=true (cross-entity cascade), observable via GET /applicants/{id}."
        test_recipe:
          setup: ["A SUBMITTED application la_id with a PENDING BackgroundCheck bc_id for applicant owner_id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Risky Bar", felony_flag: true }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
          trigger:
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "FAIL" }
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_result: $.data.result }
            - call: "GET /applicants/${owner_id}"
              as: Director
              as_user_id: "dir-1"
              captures: { disq: $.data.disqualified }
          assert:
            - "BackgroundCheck.${bc_id}.result == FAILED"
            - "Applicant.${owner_id}.disqualified == true"

      - name: overrule_hearing_returns_application_to_protest_period_branch_rejoin
        claim_type: Valid Transition
        grounds:
          - "state_machines.Hearing.PENDING_to_PROTEST_OVERRULED"
          - "state_machines.Protest.SCHEDULED_to_OVERRULED"
          - "state_machines.LicenseApplication.PROTEST_HEARING_to_PROTEST_PERIOD"
        distinguishing_aspect: "Rendering PROTEST_OVERRULED moves Protest -> OVERRULED and the application PROTEST_HEARING -> PROTEST_PERIOD (branch rejoin, quota slot retained)."
        test_recipe:
          setup: ["An application la_id in PROTEST_HEARING (protest pr_id SCHEDULED, hearing hr_id PENDING), clock after hearing starts_at."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /protests"
              payload: { application_id: "${la_id}", protester_name: "P1", grounds: "MORAL_CHARACTER" }
              as: Anonymous
              captures: { pr_id: $.data.id }
            - call: "POST /protests/${pr_id}/schedule-hearing"
              payload: { room_code: "RM-2", starts_at: "2026-01-08T09:00:00Z", ends_at: "2026-01-08T10:00:00Z" }
              as: AdjudicationOfficer
              as_user_id: "adj-1"
              captures: { hr_id: $.data.hearing_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-08T09:30:00Z" }
              as: Director
          trigger:
            - call: "POST /hearings/${hr_id}/render"
              payload: { outcome: "PROTEST_OVERRULED" }
              as: AdjudicationOfficer
              as_user_id: "adj-1"
              captures: { o: $.data.outcome }
          assert:
            - "Hearing.${hr_id}.outcome == PROTEST_OVERRULED"
            - "Protest.${pr_id}.status == OVERRULED"
            - "LicenseApplication.${la_id}.status == PROTEST_PERIOD"
            - "LicenseApplication.${la_id}.quota_slot_held == true"

      - name: server_permit_initial_state_is_pending
        claim_type: Initial State
        grounds:
          - "state_machines.ServerPermit"
          - "entities.ServerPermit.fields.status"
        distinguishing_aspect: "A newly created ServerPermit starts in PENDING with active_server_count unchanged on the parent license."
        test_recipe:
          setup: ["An ISSUED License lic_id (ACTIVE)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
            - call: "POST /license-applications/${la_id}/approve"
              as: Director
              as_user_id: "dir-1"
            - call: "POST /license-applications/${la_id}/pay-fee"
              payload: { amount_cents: 110000 }
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "POST /license-applications/${la_id}/issue"
              as: Director
              as_user_id: "dir-1"
            - call: "GET /licenses"
              payload: { application_id: "${la_id}" }
              as: Director
              as_user_id: "dir-1"
              captures: { lic_id: $.data.0.id }
          trigger:
            - call: "POST /server-permits"
              payload: { license_id: "${lic_id}", holder_name: "New Hire", training_completed: false }
              as: Applicant
              as_user_id: "${owner_id}"
