          - calculations.markup_compliance_ratio.variants.exclusive_snapshot
          - validations[priority=54]
        distinguishing_aspect: "The ACTIVE item under evaluation is subtracted from the facility snapshot before its proposed values are added: snap becomes (0, 0) so the ratio is 540000/300000 = 18000 bp, which clears the 19000 bp limit. Double-counting the live item gives (240000+540000)/(100000+300000) = 19500 bp and would wrongly raise ERR_AGGREGATE_MARKUP_LIMIT. The facility's own stored aggregate_markup_ratio_bp stays 24000 because approval writes nothing to the item."
