              captures: { sl_gnd: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_gnd}", tracking_number: "1Z-PTA-0041", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { pta: $.data.id, pta_v: $.data.version }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_gnd}", tracking_number: "1Z-PTB-0042", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 40, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { ptb: $.data.id, ptb_v: $.data.version }
          trigger:
            - call: "POST /shipments/${pta}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 21, scanned_weight_lbs: 30.0, expected_shipment_version: "${pta_v}" }
              as: CarrierOps
              captures: { scan_edge: $.data.id }
            - call: "POST /shipments/${ptb}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 41, scanned_weight_lbs: 30.0, expected_shipment_version: "${ptb_v}" }
              as: CarrierOps
              captures: { scan_inside: $.data.id }
            - call: "GET /shipments/${ptb}"
              payload: {}
              as: CarrierOps
              captures: { ptb_v2: $.data.version }
            - call: "POST /shipments/${ptb}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 40, scanned_weight_lbs: 30.6, expected_shipment_version: "${ptb_v2}" }
              as: CarrierOps
              captures: { scan_wt_edge: $.data.id }
          assert:
            - "DimensionScan.${scan_edge}.scanned_cube_in3 == 2100 and dim_variance_pct == 5.00 exactly"
            - "DimensionScan.${scan_edge}.weight_variance_lbs == 0.0 and tolerance_status == EXCEEDS_TOLERANCE — 5.00 >= 5.0 breaches; a > comparison would wrongly pass it"
            - "Shipment.${pta}.measurement_status == TOLERANCE_FLAGGED, final_dim_weight_lbs == 16, final_billable_weight_lbs == 30, final_basis == ACTUAL"
            - "DimensionScan.${scan_inside}.scanned_cube_in3 == 4100 and dim_variance_pct == 2.50 exactly, tolerance_status == WITHIN_TOLERANCE"
            - "After the second call Shipment.${ptb}.measurement_status == SCANNED, final_dim_weight_lbs == 30, final_billable_weight_lbs == 30, final_basis == ACTUAL (the 30 lb actual ties the 30 lb dimensional figure and a tie resolves to ACTUAL)"
            - "DimensionScan.${scan_wt_edge}.scanned_cube_in3 == 4000, dim_variance_pct == 0.00 and weight_variance_lbs == 0.6"
            - "DimensionScan.${scan_wt_edge}.tolerance_status == EXCEEDS_TOLERANCE — 0.6 >= the 0.6 allowance, the percentage limb of the allowance (0.6) having beaten the absolute limb (0.5)"
            - "After the third call Shipment.${ptb}.measurement_status == TOLERANCE_FLAGGED, final_billable_weight_lbs == 31 and final_basis == ACTUAL (ceil(30.6) == 31 beats the 29 lb dimensional figure)"
            - "GET /shipments/${ptb}/scans returns exactly 2 rows and GET /shipments/${pta}/scans returns exactly 1 row"
      - name: guarantee_lateness_uses_strict_inequality_at_the_commitment_instant
        grounds:
          - calculations.guarantee_refund
          - validations[priority=53]  # ERR_SHIPMENT_NOT_LATE
          - entities.Shipment.fields.guarantee_deadline_utc
          - entities.GuaranteeClaim.fields.late_by_seconds
        distinguishing_aspect: |
          Two identically priced EXPRESS parcels straddle the commitment instant by one
          second: delivery at exactly 2026-08-02T00:00:00Z is ON TIME and must be refused
          with 422 ERR_SHIPMENT_NOT_LATE, while delivery at 2026-08-02T00:00:01Z yields a
          claim with late_by_seconds == 1. The boundary is a datetime at whole-second
          resolution rather than a percentage, and the refundable amount stops at the
          floored transportation charge.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305); ServiceLevel EXPRESS with guarantee_hours 24 and guaranteed true. No surcharge window of any kind exists, so nothing suspends the guarantee."
            - "Shipments PL and PM are both declared 12 x 10 x 8 in at 6.0 lb, zone 2, non-residential, and are both created at the 2026-08-01T00:00:00Z default clock: cube 960, dim weight 7, billable 7 lb DIMENSIONAL, transportation 2660, line 2660, guarantee_deadline_utc 2026-08-02T00:00:00Z."
            - "PL is delivered at exactly 2026-08-02T00:00:00Z and PM at 2026-08-02T00:00:01Z."
            - "Invoice INV_G over 2026-08-01..2026-08-31 carries both lines and is ISSUED with transportation_subtotal 5320, gross 5320, tier 0 bps, net 5320."
            - "CLAIM_WINDOW_DAYS is 15, so both claim windows run to 2026-08-17 and are wide open."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PL-0051", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pl: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PM-0052", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-02T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${pl}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-02T00:00:01Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${pm}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_g: $.data.id }
            - call: "POST /invoices/${inv_g}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_g}", shipment_id: "${pm}" }
              as: BillingOps
              captures: { line_m: "$.data[0].id" }
          trigger:
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${pl}", claimed_reason: "On the dot" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { err_ontime: $.data.error_id }
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${pm}", claimed_reason: "One second past the commitment" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { clm_m: $.data.id }
          assert:
            - "Shipment.${pl}.picked_up_at == 2026-08-01T00:00:00Z, guarantee_deadline_utc == 2026-08-02T00:00:00Z, delivered_at == 2026-08-02T00:00:00Z"
            - "The first call returns HTTP 422 with error_id ERR_SHIPMENT_NOT_LATE — equality is on time, so a >= comparison would wrongly create a claim"
            - "GET /guarantee-claims with shipment_id ${pl} returns 0 rows"
            - "Shipment.${pm}.delivered_at == 2026-08-02T00:00:01Z and guarantee_deadline_utc == 2026-08-02T00:00:00Z"
            - "GuaranteeClaim.${clm_m}.status == FILED, late_by_seconds == 1, candidate_refund_cents == 2660, invoice_line_id == ${line_m}, refund_cents == 0"
            - "GuaranteeClaim.${clm_m}.filed_by_user_id == 'auditor.one' and GET /guarantee-claims with shipment_id ${pm} returns exactly 1 row"
            - "Invoice.${inv_g}.net_amount_cents is STILL 5320 and pending_adjustment_count == 0 — filing a claim moves no money"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shipment_induction_depends_on_the_contract_being_activated_first
        grounds:
          - calculations.contract_selection
          - validations[priority=41]  # ERR_NO_ACTIVE_CONTRACT
          - state_machines.RateContract.DRAFT_to_ACTIVE
          - entities.Shipment.fields.contract_id
          - concurrency_rules[contract-activate-stale-shipper]
        distinguishing_aspect: |
          The blocking state lives on a THIRD entity: nothing about the ShipperAccount or the
          POST /shipments payload changes between the two attempts, yet the first is refused
          with 422 ERR_NO_ACTIVE_CONTRACT and the second is accepted, purely because a
          RateContract moved DRAFT -> ACTIVE in between. The accepted shipment also has to
          stamp contract_id and divisor_used from that contract, proving the dependency is a
          real read and not a mere existence probe. The other instance in this rule gates a
          Dispute on an Invoice two hops away from the disputed line.
        test_recipe:
          setup:
            - "ShipperAccount SH-1001 is ACTIVE. ServiceLevel GROUND (120 h, not guaranteed) exists."
            - "RateContract C1 covering 2026-01-01..2026-12-31 with dim_divisor 139, min_charge_cents 1195 and zone-2 rows 380/340/305 exists but is still DRAFT."
            - "The logical clock reads 2026-08-01T00:00:00Z, so any pickup_date falls inside C1's period."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
              as: CarrierAdmin
              captures: { sl_gnd: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_gnd}", tracking_number: "1Z-DEP-0061", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { err_nocontract: $.data.error_id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_gnd}", tracking_number: "1Z-DEP-0061", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { dep: $.data.id }
          assert:
            - "The first call returns HTTP 422 with error_id ERR_NO_ACTIVE_CONTRACT while the contract is DRAFT"
            - "After the first call GET /shipments with shipper_id ${sh1} returns 0 rows and ShipperAccount.${sh1}.total_shipment_count == 0 and unbilled_shipment_count == 0 — nothing was persisted"
            - "The reused tracking number 1Z-DEP-0061 is accepted on the third call, which proves no partial Shipment row survived the rejection (it does NOT return ERR_DUPLICATE_KEY)"
            - "RateContract.${c1}.status == ACTIVE with activated_at == 2026-08-01T00:00:00Z after the activate call"
            - "The third call returns HTTP 201 with Shipment.${dep}.contract_id == ${c1} and divisor_used == 139 — the contract was actually read, not merely counted"
            - "Shipment.${dep}.declared_cube_in3 == 2000, preliminary_dim_weight_lbs == 15, preliminary_billable_weight_lbs == 30, preliminary_basis == ACTUAL"
            - "Shipment.${dep}.measurement_status == PENDING_SCAN, movement_status == IN_TRANSIT, billing_status == UNBILLED, pickup_date == 2026-08-01"
            - "ShipperAccount.${sh1}.total_shipment_count == 1 and unbilled_shipment_count == 1 — exactly one shipment exists, not two"
      - name: dispute_admission_depends_on_the_parent_invoice_being_issued
        grounds:
          - validations[priority=29]  # ERR_INVOICE_NOT_DISPUTABLE
          - state_machines.Invoice.OPEN_to_ISSUED
          - entities.Invoice.fields.dispute_deadline_utc
          - entities.Dispute.fields.invoice_line_id
        distinguishing_aspect: |
          The gate sits two hops from the mutated entity: POST /disputes names an
          InvoiceLine, but the admissible-state check reads that line's Invoice. The identical
          request is refused with 409 ERR_INVOICE_NOT_DISPUTABLE while the invoice is OPEN
          and accepted once it is ISSUED, and the accepted dispute inherits the deadline the
          issue transition computed. Unlike the contract instance, the blocking entity is the
          direct parent of the referenced row rather than a separately selected third party.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305, RESIDENTIAL override 540); ServiceLevel EXPRESS (24 h, guaranteed). No surcharge window."
            - "Shipment PD (18.4 x 12.6 x 10.5, 9.2 lb, zone 2, residential) is DELIVERED with one AUTO RESIDENTIAL charge of 540; its priced line is 7220 + 540 = 7760."
            - "Invoice INV_D over 2026-08-01..2026-08-31 already holds PD's line but is still OPEN: dispute_deadline_utc is null."
            - "The clock reads 2026-08-01T00:00:00Z throughout, so no time window can interfere."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PD-0071", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { pd: $.data.id }
            - call: "POST /shipments/${pd}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_d: $.data.id }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_d}", shipment_id: "${pd}" }
              as: BillingOps
              captures: { line_d: "$.data[0].id" }
          trigger:
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_d}", claim_type: "ACCESSORIAL", claimed_reason: "Commercial dock, residential fee wrong", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { err_notdisputable: $.data.error_id }
            - call: "POST /invoices/${inv_d}/issue"
              payload: {}
              as: BillingOps
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_d}", claim_type: "ACCESSORIAL", claimed_reason: "Commercial dock, residential fee wrong", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { dsp_d: $.data.id }
          assert:
            - "While Invoice.${inv_d}.status == OPEN the first call returns HTTP 409 with error_id ERR_INVOICE_NOT_DISPUTABLE"
            - "After the first call GET /disputes with invoice_line_id ${line_d} returns 0 rows — no dispute was created"
            - "Invoice.${inv_d}.status == OPEN, line_count == 1, gross_charges_cents == 7760, net_amount_cents == 7760 and dispute_deadline_utc is null before the issue call"
            - "After the issue call Invoice.${inv_d}.status == ISSUED, issued_at == 2026-08-01T00:00:00Z and dispute_deadline_utc == 2026-10-30T00:00:00Z"
            - "The third call returns HTTP 201 with Dispute.${dsp_d}.status == SUBMITTED, invoice_line_id == ${line_d}, claim_type == ACCESSORIAL, disputed_codes == [RESIDENTIAL], round_count == 0, accepted_evidence_count == 0, granted_credit_cents == 0"
            - "Dispute.${dsp_d}.shipper_user_id == ${sh1} and GET /disputes with invoice_line_id ${line_d} now returns exactly 1 row"
            - "Invoice.${inv_d}.net_amount_cents is STILL 7760 and InvoiceLine.${line_d}.line_total_cents == 7760 — admitting a dispute moves no money"
  - rule_id: resource_temporal_overlap
    instances:
      - name: surcharge_windows_use_half_open_intervals_scoped_by_kind_and_service_level
        grounds:
          - validations[priority=36]  # ERR_SURCHARGE_WINDOW_OVERLAP
          - state_machines.SurchargeWindow
          - entities.SurchargeWindow.fields.kind
          - entities.SurchargeWindow.fields.service_level_id
        distinguishing_aspect: |
          The overlap test is half-open [start_date, end_date), so a window starting exactly
          where an ACTIVE one ends is ADMITTED, while a window straddling the interior is
          refused with 409. The exclusion is further scoped along two orthogonal axes — kind
          and service_level_id — so the same straddling dates are admitted for a DEMAND
          window and for a carrier-wide PEAK_SEASON window, and a CANCELLED window stops
          excluding anything at all. The other instance in this rule uses CLOSED intervals
          on a different resource, so the abutment verdicts are deliberately opposite.
        test_recipe:
          setup:
            - "ServiceLevel EXPRESS (24 h, guaranteed) and GROUND (120 h, not guaranteed) exist."
            - "SurchargeWindow PEAK-A is PEAK_SEASON, scoped to EXPRESS, covers [2026-11-01, 2026-12-01) with per_package_cents 65 and oversize_add_cents 4500, and has been ACTIVATED."
            - "No other surcharge window exists yet."
          setup_api_calls:
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
              as: CarrierAdmin
              captures: { sl_gnd: $.data.id }
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-A", kind: "PEAK_SEASON", service_level_id: "${sl_exp}", start_date: "2026-11-01", end_date: "2026-12-01", per_package_cents: 65, oversize_add_cents: 4500 }
              as: CarrierAdmin
              captures: { peak_a: $.data.id }
            - call: "POST /surcharge-windows/${peak_a}/activate"
              payload: {}
              as: CarrierAdmin
          trigger:
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-B", kind: "PEAK_SEASON", service_level_id: "${sl_exp}", start_date: "2026-12-01", end_date: "2027-01-01", per_package_cents: 80, oversize_add_cents: 4500 }
              as: CarrierAdmin
              captures: { peak_b: $.data.id }
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-C", kind: "PEAK_SEASON", service_level_id: "${sl_exp}", start_date: "2026-11-15", end_date: "2026-12-15", per_package_cents: 90, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-X", kind: "DEMAND", service_level_id: "${sl_exp}", start_date: "2026-11-15", end_date: "2026-12-15", per_package_cents: 150, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { dem_x: $.data.id }
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-G", kind: "PEAK_SEASON", start_date: "2026-11-15", end_date: "2026-12-15", per_package_cents: 45, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { peak_g: $.data.id }
            - call: "POST /surcharge-windows/${peak_a}/cancel"
              payload: {}
              as: CarrierAdmin
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-D", kind: "PEAK_SEASON", service_level_id: "${sl_exp}", start_date: "2026-11-15", end_date: "2026-12-15", per_package_cents: 90, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { peak_d: $.data.id }
          assert:
            - "PEAK-B is created with HTTP 201 and SurchargeWindow.${peak_b}.status == SCHEDULED — start_date 2026-12-01 equals PEAK-A's end_date and half-open intervals do not collide when they touch"
            - "PEAK-C returns HTTP 409 with error_id ERR_SURCHARGE_WINDOW_OVERLAP — [2026-11-15, 2026-12-15) straddles the interior of PEAK-A's [2026-11-01, 2026-12-01)"
            - "After the PEAK-C rejection GET /surcharge-windows with kind PEAK_SEASON returns exactly 2 rows (PEAK-A and PEAK-B); no partial row for code PEAK-C exists, so PEAK-C's code is still free"
            - "DEM-X is created with HTTP 201 over the very dates PEAK-C was refused — the exclusion is scoped by kind, and SurchargeWindow.${dem_x}.status == SCHEDULED"
            - "PEAK-G is created with HTTP 201 over those same dates with service_level_id null — a carrier-wide window does not share the EXPRESS scope"
            - "After the cancel call SurchargeWindow.${peak_a}.status == CANCELLED"
            - "PEAK-D is then created with HTTP 201 over [2026-11-15, 2026-12-15) — a CANCELLED window no longer excludes, and SurchargeWindow.${peak_d}.status == SCHEDULED"
            - "GET /surcharge-windows with kind PEAK_SEASON and status SCHEDULED returns exactly 3 rows: ${peak_b}, ${peak_g} and ${peak_d}"
      - name: rate_contract_periods_are_closed_intervals_so_touching_endpoints_collide
        grounds:
          - validations[priority=35]  # ERR_CONTRACT_PERIOD_OVERLAP
          - state_machines.RateContract
          - entities.RateContract.fields.effective_from
          - entities.RateContract.fields.effective_to
          - calculations.contract_selection
        distinguishing_aspect: |
          RateContract periods are CLOSED [effective_from, effective_to], so a contract
          starting on the incumbent's last effective day IS a collision — the exact opposite
          verdict from the half-open surcharge windows in the sibling instance — while a
          contract starting the next day is admitted. Exclusion also spans DRAFT as well as
          ACTIVE contracts and is partitioned per shipper, so a DRAFT row blocks a later
          request while an identical period for another shipper does not.
        test_recipe:
          setup:
            - "ShipperAccount SH-1001 and SH-2002 are both ACTIVE."
            - "RateContract C1 for SH-1001 covers 2026-01-01..2026-12-31 with dim_divisor 139, min_charge_cents 1195 and zone-2 rows 380/340/305, and has been ACTIVATED."
            - "No other contract exists for either shipper."
          setup_api_calls:
            - call: "POST /shipper-accounts"
