  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: vessel_turnaround_buffer_semantics
        grounds:
          - validations[priority=9]
          - errors[ERR_VESSEL_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: buffer-extended occupation [departure, arrival +
          turnaround). Vessel's first sailing 10:00-10:35 + 15 min buffer blocks
          a second sailing at 10:49 (inside buffer) but allows 10:50 (exactly at
          buffer end — boundary is exclusive at the right edge). Resource: Vessel.
        test_recipe:
          setup:
            - "Route R (crossing 35, turnaround 15); Vessel V"
            - "Sailing S1 on V departing 2026-09-01T10:00:00Z (occupies until 10:50)"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:49:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:50:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s2_id: $.data.id }
          assert:
            - "10:49 departure rejected with ERR_VESSEL_SCHEDULE_CONFLICT (409)"
            - "10:50 departure succeeds 201 (buffer end is exclusive)"

      - name: crew_half_open_interval_with_rest_gap
        grounds:
          - validations[priority=10]
          - errors[ERR_CREW_REST_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics: half-open [shift_start, shift_end) PLUS
          a 480-minute rest rule. Back-to-back shifts (end == next start) do not
          overlap geometrically but violate the rest gap; a shift starting
          exactly 480 minutes later passes. Resource: CrewMember (not Vessel).
        test_recipe:
          setup:
            - "Route R; Vessel V; CrewMember Cap A AVAILABLE"
            - "Two sailings S1 (2026-09-01T10:00) and S2 (2026-09-01T20:00) on different... same vessel OK for sailing-creation? S2 at 20:00 is well past S1's buffer, fine."
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T20:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /ferry/sailings/${s1_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
          trigger:
            - call: "POST /ferry/sailings/${s2_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T16:00:00Z", shift_end: "2026-09-02T00:00:00Z" }
              as: CrewPlanner
              captures: { err: $.data.error_id }
            - call: "POST /ferry/sailings/${s2_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-02T00:00:00Z", shift_end: "2026-09-02T08:00:00Z" }
              as: CrewPlanner
              captures: { ca2_id: $.data.id }
          assert:
            - "adjacent shift (16:00 start) rejected ERR_CREW_REST_CONFLICT (409)  # half-open adjacency OK, rest gap violated"
            - "shift at 2026-09-02T00:00:00Z succeeds 201  # exactly 480 minutes rest"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: deck_feet_conserved_across_confirm_and_cancel
        grounds:
          - entities.Sailing.fields.reserved_vehicle_feet
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: vehicle deck feet. Invariant:
          reserved_vehicle_feet + (reserved_deck_allotment_feet -
          reserved_vehicle_feet) == reserved_deck_allotment_feet, and a
          confirm(+18 ft) followed by its cancel(-18 ft) returns
          reserved_vehicle_feet to exactly its pre-confirm value (0).
        test_recipe:
          setup:
            - "Full base setup; sailing OPEN_FOR_BOOKING (reserved allotment 120, reserved_vehicle_feet 0)"
            - "Customer C STANDARD; Booking B (18 ft vehicle) created and CONFIRMED"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 1, has_vehicle: true, vehicle_length_feet: 18 }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_id: $.data.id }
            - call: "POST /ferry/bookings/${b_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: ${cust_id}
            - call: "GET /ferry/sailings/${s_id}"
              payload: {}
              as: SchedulerAdmin
              captures: { mid_reserved_feet: $.data.reserved_vehicle_feet }
          trigger:
            - call: "POST /ferry/bookings/${b_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: ${cust_id}
            - call: "GET /ferry/sailings/${s_id}"
              payload: {}
              as: SchedulerAdmin
              captures: { end_reserved_feet: $.data.reserved_vehicle_feet }
          assert:
            - "after confirm: Sailing.reserved_vehicle_feet == 18  # ${mid_reserved_feet}"
            - "after cancel: Sailing.reserved_vehicle_feet == 0  # forward+compensating actions conserve deck feet"
            - "${mid_reserved_feet} - ${end_reserved_feet} == 18"

      - name: refund_credit_conserved_across_operator_cancel_and_rebook
        grounds:
          - entities.Customer.fields.refund_credit_cents
