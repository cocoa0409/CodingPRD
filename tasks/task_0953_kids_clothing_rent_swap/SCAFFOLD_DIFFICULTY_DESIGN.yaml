            - "Cycle.${cyc_b1}.status == OPEN"

      - name: assess_late_exactly_at_grace_ends_at_accrues_zero_and_then_rejects
        grounds:
          - calculations.cycle_boundary_inclusivity
          - calculations.late_fee_per_item
          - validations[priority=36]
          - errors[ERR_GRACE_NOT_EXPIRED]
          - entities.Cycle.fields.grace_ends_at
        distinguishing_aspect: |
          METRIC = the late-accrual instant on POST /kidswear/cycles/{id}/assess-late, a
          DIFFERENT endpoint and a DIFFERENT metric from the swap boundary, and with the
          OPPOSITE comparator: accrual requires STRICTLY AFTER grace_ends_at. At exactly
          2026-06-05T00:00:00Z the cycle reaches RETURN_DUE with late_fee_cents 0, and a second
          call at the same instant is rejected with ERR_GRACE_NOT_EXPIRED.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot; one ACTIVE member sized 5."
            - "A cycle starting 2026-05-01, so return_due_at is 2026-05-31 and grace_ends_at is 2026-06-05."
            - "The cycle has been moved to SWAP_CLOSED at clock 2026-05-22."
            - "The clock is then set to exactly grace_ends_at, 2026-06-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, late_fee_mode: "PER_DAY", discount_pct: 0 }
              as: PlatformAdmin
