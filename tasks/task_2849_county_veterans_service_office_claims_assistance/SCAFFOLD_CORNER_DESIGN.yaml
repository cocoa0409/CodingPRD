            - "OutcomeReport.${rpt}.weighting_basis == null"
            - "OutcomeReport.${rpt}.certified_by_representative_id == null"
            - "OutcomeReport.${rpt}.version == 1"

      - name: corner_discharge_verification_applies_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.DischargeDocument[PENDING_VERIFICATION->VERIFIED]
          - calculations.wartime_service_days
        distinguishing_aspect: "One VERIFY call performs all five declared side effects at once: verification_status VERIFIED with verified_by_representative_id set to the acting officer, Veteran.character_of_service copied to HONORABLE, Veteran.discharge_doc_status VERIFIED, Veteran.wartime_service_days recomputed to 1461 for 2001-09-11..2005-09-10, and both versions incremented."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
