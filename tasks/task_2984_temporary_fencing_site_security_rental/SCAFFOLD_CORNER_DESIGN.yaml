          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED_install
        excluded_because:
          difficulty_instance: install_completion_five_hop_cascade
          rationale: |
            The §1.8 instance already drives the full chain from one call —
            work order to COMPLETED, fleet units moved from reserved to
            deployed, contract to ACTIVE with its billing anchor stamped, the
            MOBILIZATION invoice minted with tax, and the account's open balance
            raised — and it asserts the hops in order, including that the
            invoice total depends on values written by earlier hops. Repeating
            the chain here would add no distinct corner.

