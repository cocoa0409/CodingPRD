  - rule_id: resource_temporal_overlap
    instances:
      - name: rack_windows_half_open_adjacency
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_RACK_WINDOW_CONFLICT]"
        distinguishing_aspect: |
          Resource LoadingRack with half-open zero-buffer semantics (distinct
          from the sibling's buffered wash-bay semantics): a second window
          starting exactly at the first window's end is ACCEPTED
          ([10:00,12:00) then [12:00,14:00)), while a straddling window
          ([11:30,13:00)) is rejected with ERR_RACK_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "One rack, three trailers, one shipment (s1) PLANNED with window 10:00-12:00Z"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
