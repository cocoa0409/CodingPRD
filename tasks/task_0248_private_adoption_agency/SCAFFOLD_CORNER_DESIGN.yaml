  # ===========================================================================
  # RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: caseworker_cannot_approve_home_study
        claim_type: forbidden_operation
        grounds: [roles.Caseworker, roles.Supervisor, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Caseworker calling POST /home-studies/{id}/approve (a Supervisor-exclusive op) -> ERR_UNAUTHORIZED (403). Peer/SoD role separation."
        test_recipe:
          setup: ["A HomeStudy in UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "cw-2"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == 'ERR_UNAUTHORIZED'"

      - name: compact_admin_cannot_open_case
        claim_type: forbidden_operation
        grounds: [roles.CompactAdministrator, roles.Supervisor, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A CompactAdministrator calling POST /cases (Supervisor-exclusive) -> ERR_UNAUTHORIZED (403). Confirms peer-role boundary distinct from instance 1's pair."
        test_recipe:
          setup: ["An Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-x", child_state: "CA", family_state: "CA" }
              as: CompactAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == 'ERR_UNAUTHORIZED'"

      - name: missing_user_context_header
        claim_type: forbidden_operation
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "A request to POST /cases with no X-User-Role header -> ERR_MISSING_USER_CONTEXT (400), checked before authorization."
        test_recipe:
          setup: ["An Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-x", child_state: "CA", family_state: "CA" }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_MISSING_USER_CONTEXT'"

  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_case_version_on_consent_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[consent-sign-stale-case]", "validations[priority=19]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "Creating a second ConsentRecord with a stale expected_case_version (the version observed before the first consent create bumped it) -> ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["Case with ACCEPTED Match; one ConsentRecord already created (which bumped AdoptionCase.version)."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-04T08:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Supervisor
              captures: { cv_stale: $.data.version }
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "CALENDAR_DAYS", expected_case_version: "${cv_stale}" }
              as: Caseworker
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "CALENDAR_DAYS", expected_case_version: "${cv_stale}" }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == 'ERR_STALE_CASE_VERSION'"

      - name: occ_version_increments_on_escrow_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[escrow-deposit-stale-case]", entities.AdoptionCase.fields.version]
        distinguishing_aspect: "AdoptionCase.version increments by 1 on a successful escrow-transaction create; a fresh expected_case_version then succeeds (version was 1, becomes 2 after first DEPOSIT)."
        test_recipe:
          setup: ["A fresh Case (version 1)."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "DEPOSIT", amount_cents: 100000, expected_case_version: "${cv0}" }
              as: FinanceOfficer
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceOfficer
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "DEPOSIT", amount_cents: 200000, expected_case_version: "${cv1}" }
              as: FinanceOfficer
              captures: { txn2: $.data.id }
          assert:
            - "AdoptionCase.${case_id}.version == 3"
            - "AdoptionCase.${case_id}.escrow_balance_cents == 300000"

      - name: derived_reimbursable_reconciles_on_approve
        claim_type: derived_field_reconciliation
        grounds: [entities.AdoptionCase.fields.reimbursable_expense_cents, state_machines.ExpenseEntry.LOGGED_to_APPROVED]
        distinguishing_aspect: "AdoptionCase.reimbursable_expense_cents is 0 right after logging an expense and becomes the expense amount after approval (derived field reconciles on the approve transition)."
        test_recipe:
          setup: ["Case with one LOGGED expense of 250000."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "COUNSELING", amount_cents: 250000 }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { exp_id: $.data.id }
          trigger:
            - call: "POST /expense-entries/${exp_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fo-1"
          assert:
            - "ExpenseEntry.${exp_id}.status == 'APPROVED'"
            - "AdoptionCase.${case_id}.reimbursable_expense_cents == 250000"

