  - name: last_known_well_presence_is_dictated_by_the_precision_and_never_follows_the_door
    claim_type: violation_to_error
    grounds:
    - validations priority 56 -> ERR_LKW_REQUIRED (422)
    - entities.CodeStrokeCase.lkw_precision, entities.CodeStrokeCase.last_known_well_at
    distinguishing_aspect: 'One error id guards THREE distinct clauses that pull in opposite directions: EXACT/ESTIMATED must carry an instant, UNKNOWN_WAKE_UP must NOT carry one, and the instant may never be later than door_at. The positive controls pin the inclusive edge — last_known_well_at exactly equal to door_at is accepted, and UNKNOWN_WAKE_UP with the field omitted is accepted.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
