              captures: { furn_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_id}", batch_code: "GLB-001", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T06:00:00Z", firing_end: "2026-08-02T10:00:00Z" }
              as: PlantOperator
              captures: { glb_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches/${glb_id}/fire"
              payload: {}
              as: PlantOperator

            - call: "POST /mfg/tank-lots"
              payload: { product_model_id: "${m1_id}", lot_code: "TL-001", planned_quantity: 120 }
              as: PlantOperator
              captures: { tl_id: $.data.id }
            - call: "POST /mfg/tank-lots/${tl_id}/weld"
              payload: {}
              as: PlantOperator
              as_user_id: "op-weld-1"
            - call: "POST /mfg/tank-lots/${tl_id}/apply-lining"
              payload: { glass_lining_batch_id: "${glb_id}" }
              as: PlantOperator
          trigger:
            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_vb1: $.data.version }
            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "HOLIDAY", sample_size: 100, holiday_count: 49, expected_tank_lot_version: "${tl_vb1}" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_vb2: $.data.version }
            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "HOLIDAY", sample_size: 100, holiday_count: 50, expected_tank_lot_version: "${tl_vb2}" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_vb3: $.data.version }
            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "HOLIDAY", sample_size: 100, holiday_count: 51, scrap_quantity: 5, expected_tank_lot_version: "${tl_vb3}" }
              as: QualityInspector
