            - "count of FabricationOrders for ${proj_id} == 1 (auto-spawned by CUSTOM_FABRICATION item transition)"
            - "FabricationOrder[0].status == PENDING_SHOP_DRAWING"
            - "FabricationOrder[0].equipment_item_id == ${custom_item}"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: layout_not_approved_state_beats_hood_safety_check
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_LAYOUT_NOT_APPROVED]
          - errors[ERR_HOOD_SPEC_INCONSISTENT]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety). A Quote present call
          against a Layout that is both (i) not APPROVED and (ii) would fail the
          hood-spec check fires ERR_LAYOUT_NOT_APPROVED (state, priority 4), not
          ERR_HOOD_SPEC_INCONSISTENT (safety, priority 5). Lower priority number
          wins.
        test_recipe:
          setup:
            - "Customer, Project in DESIGN"
            - "Layout L with hood_required=true but NO items (still DRAFT — never submitted)"
            - "Quote Q created against L is forbidden by validations (must be APPROVED), so we craft the conflict differently: Layout L SUBMITTED (not APPROVED) AND hood_required=true with no requires_hood item"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Pri Cust", contact_email: "p@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cust_id}", project_name: "Pri Proj", site_address: "17 Ash", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /design-build-projects/${proj_id}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-P1", hood_required: true }
              as: KitchenDesigner
              captures: { lay_id: $.data.id }
            - call: "POST /design-build-projects/${proj_id}/layouts/${lay_id}/equipment-items"
              payload: { model_no: "OVEN", item_kind: "STOCK", quantity: 1, unit_price_cents: 50000, lead_time_days: 3, requires_hood: false }
              as: KitchenDesigner
          trigger:
            # Layout still in DRAFT; submit itself would fail with
            # ERR_HOOD_SPEC_INCONSISTENT — but if we try to create a Quote first
            # (which validates layout is APPROVED at priority 4), the state
            # error wins even though the safety rule would also fail later.
            - call: "POST /design-build-projects/${proj_id}/quotes"
              payload: { layout_id: "${lay_id}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LAYOUT_NOT_APPROVED (state priority 4 beats safety priority 5)"

      - name: layout_empty_constraint_beats_credit_fiscal_check
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_LAYOUT_EMPTY]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_constraint vs business_fiscal). A layout
          submit attempt with zero EquipmentItems fires ERR_LAYOUT_EMPTY
          (priority 6), not any fiscal error. Distinct category pair from
          instance 1 (state vs business_safety).
        test_recipe:
          setup:
            - "Customer with credit_limit_cents = 1 (deliberately tiny)"
            - "Project under that Customer in DESIGN"
            - "Layout L with hood_required = false, ZERO EquipmentItems"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Tiny Credit", contact_email: "tc@x.test", credit_limit_cents: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cust_id}", project_name: "Tiny", site_address: "19 Willow", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /design-build-projects/${proj_id}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-T1", hood_required: false }
              as: KitchenDesigner
              captures: { lay_id: $.data.id }
          trigger:
            - call: "POST /design-build-projects/${proj_id}/layouts/${lay_id}/submit"
              payload: {}
              as: KitchenDesigner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LAYOUT_EMPTY (business_constraint priority 6 fires before any fiscal check; the tiny credit limit is irrelevant here)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: freight_tier_boundary_at_ceiling_inclusive
        grounds:
          - calculations.freight_tier_calc
          - endpoints["POST /design-build-projects/{projectId}/quotes"]
        distinguishing_aspect: |
          Metric = equipment_subtotal_cents vs TIER_1_CEILING_CENTS (5000000).
          Endpoint = POST /quotes. At subtotal == 5000000 exactly, the rate is
          inclusive of TIER_1 (<=): freight = 5000000 * 0.06 = 300000. At
          5000001 (one cent over), freight splits: 300000 + round_half_up(1 * 0.045)
          = 300000 + 0 (round_half_up(0.045) rounds to 0) — so 300000 still.
          To force a visible delta we test 5100000: freight = 300000 +
          round_half_up(100000 * 0.045) = 300000 + 4500 = 304500. Assert the
          boundary is inclusive at the ceiling.
        test_recipe:
          setup:
            - "Customer, Project CITY_HEALTH, Layout APPROVED with one STOCK item qty 5 unit_price 1000000 -> subtotal exactly 5000000"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Boundary", contact_email: "b@x.test", credit_limit_cents: 1000000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
