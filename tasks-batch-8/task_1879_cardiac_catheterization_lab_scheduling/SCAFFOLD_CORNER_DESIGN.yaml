  - section: calculations
    instances:
      - name: registry_name_derived_from_procedure_type
        claim_type: correct_result
        grounds: ["entities.RegistrySubmission.fields.registry_name"]
        distinguishing_aspect: "registry_name is computed from procedure_type: DEVICE_IMPLANT -> NCDR_ICD and EP_STUDY -> NCDR_EP (CATHPCI derivation is asserted in the difficulty instance registry_submission_revision_cycle)."
        test_recipe:
          setup:
            - "Two URGENT cases (DEVICE_IMPLANT and EP_STUDY) each COMPLETED with one ACTIVE RADIATION record"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
