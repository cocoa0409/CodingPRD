  - section: calculations
    instances:
      - name: rolling_window_excludes_stale_orders
        claim_type: input_set_filtering
        grounds: [calculations.rolling_agreement_fill_rate, "state_machines.PrimeVendorAgreement.SUSPENDED_to_ACTIVE"]
        distinguishing_aspect: "The trailing 90-day window slides with the logical clock: an order received 96 days ago drops out, so the aggregate recomputes over the surviving orders only (100.00 vs 80.00 if the stale order wrongly counted) and the agreement auto-recovers, un-muting the inventory program."
        test_recipe:
          setup:
            - "Facility F; product P1 price 100 case 1 multiple 1; agreement committed 90.0 window 2026-01-01..2027-08-31"
            - "InventoryProgram IP for F (auto_replenish_enabled true)"
            - "Orders O1 (x100), O2 (x50), O3 (x50) all PLACED before any receipt"
            - "O1 shipped 60, received at clock 2026-09-01 -> rolling 60.00 -> SUSPENDED, IP muted"
            - "O2 shipped 50, received at clock 2026-09-01 -> rolling 73.33 -> still SUSPENDED"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac RW", health_system_name: "HS RW", facility_type: "ACUTE_CARE", ship_to_address: "32 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
