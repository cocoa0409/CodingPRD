            - "TaxReturn.${ret3}.filing_status == FILED"

      - name: ota_agreement_half_open_overlap_adjacency
        grounds:
          - validations[priority=7]
          - state_machines.OTAAgreement.PROPOSED_to_ACTIVE
          - errors[ERR_AGREEMENT_OVERLAP]
        distinguishing_aspect: >
          OTA agreement coverage is half-open [effective, end): activating [2026-03-01,2026-06-01)
          over an existing ACTIVE [2026-01-01,2026-04-01) is rejected, but an adjacent
          [2026-04-01,2026-07-01) (end == next start) activates cleanly — adjacency allowed, unlike
          the closed-interval return rule, on a different resource entity.
        test_recipe:
