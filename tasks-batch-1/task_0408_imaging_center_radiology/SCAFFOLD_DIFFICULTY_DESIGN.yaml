      - name: center_series_counters_conserved_under_exam_cancel
        grounds:
          - calculations.repeat_reject_rate
          - state_machines.ImagingExam.BOOKED_to_CANCELLED
          - entities.ImagingCenter.fields.total_acquired_series
        distinguishing_aspect: |
          Conserved quantity (DIFFERENT type — integer series counters, not RVU): cancelling a
          pre-ACQUIRED exam releases its room/tech intervals but MUST leave
          total_acquired_series and total_repeat_reject_series unchanged (a cancelled exam never
          captured finalized series), so repeat_reject_rate_pct is invariant across the cancel.
        test_recipe:
          setup:
            - "Center with one finalized REPEATED series on exam A (total_acquired_series 1, total_repeat_reject 1, rate 100.0). A second exam B at BOOKED with no series."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 200.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
