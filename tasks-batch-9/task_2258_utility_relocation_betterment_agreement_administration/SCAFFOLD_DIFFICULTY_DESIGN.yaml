  - rule_id: transitive_cascade
    instances:
      - name: second_breach_cascades_commitment_to_owner_to_agreement_to_cost_document
        grounds:
          - state_machines.ScheduleCommitment.COMMITTED_to_BREACHED
          - entities.UtilityOwner.fields.delinquency_strikes
          - entities.UtilityOwner.fields.reimbursement_hold
          - state_machines.ReimbursementAgreement.PENDING_FINAL_INVOICE_to_HELD
          - state_machines.CostDocument.SUBMITTED_to_HELD
        distinguishing_aspect: |
          Depth 4, triggered from POST /uro/commitments/{id}/report-complete: ScheduleCommitment
          -> BREACHED (link 1 strikes 1 -> 2) -> UtilityOwner.reimbursement_hold false -> true
          (link 2) -> ReimbursementAgreement.settlement_status PENDING_FINAL_INVOICE -> HELD
          (link 3) -> CostDocument.review_status SUBMITTED -> HELD (link 4). Link 2 fires only on
          the second breach, so the first breach in the same test must leave links 3 and 4 unfired.
        test_recipe:
          setup:
            - "One project, one private ELECTRIC owner O1, two facilities FA and FB of that owner (two facilities so the mobilization-buffer window rule never fires)."
            - "Conflict CA on FA carried to an APPROVED plan, an EXECUTED agreement A1 opened for final billing, and one LABOR cost document left in review_status SUBMITTED."
            - "Conflict CB on FB carried to an APPROVED plan; one commitment per plan, windows [2027-04-05, 2027-04-20] and [2027-05-05, 2027-05-20]."
            - "The clock is advanced past window A and commitment A is reported complete late, producing the FIRST breach (strikes 1, no hold), then advanced past window B."
