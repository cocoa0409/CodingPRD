scenario: |
  Aquaculture / Fish Farm Management: species & cohort/tank-pond, feed conversion & growth (biomass), water-quality (DO/ammonia) log, stocking & grading/splitting, health & treatment withdrawal, harvest & processing yield, broodstock/hatchery, inventory & sales。

domain_name: aquaculture-fish-farm
api_prefix: ""
# Endpoints are mounted at the server root (no shared top-level prefix); the
# domain spans peer resource collections (/species, /tanks, /cohorts, ...),
# so there is no single nesting root.

# Expert difficulty tier (§0.4): 14 entities, 30 endpoints, 26 error codes,
# 4 dual/threshold calculation variants, 7 state machines (one parallel-dimension,
# two cyclic, several with reverts and auto-transitions).
complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: quota / allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Cohort is the aggregate root (tree of grading splits via self-referential
  # parent_cohort_id) with cross-cutting flat references to Tank, Species,
  # BroodstockBatch and a separate harvest→processing→inventory→sales chain.

  state_machine_shape: parallel
  # Cohort carries two independent dimensions (lifecycle_status × health_status);
  # Tank.posture and ProductLot.status are cyclic; HarvestOrder reverts.

  relationship_patterns:
    - one_to_many        # Cohort -> FeedLog, WaterQualityReading via Tank, etc.
    - self_referential   # Cohort.parent_cohort_id from grading splits
    - cross_aggregate    # HarvestOrder -> Cohort; ProductLot -> ProcessingBatch

  role_model: peer_roles
  # FarmTechnician, Veterinarian, HarvestOperator, SalesAgent each own distinct
  # resource types; FarmManager has hierarchical override on posture & approvals.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Species
    parent: null
    common_fields: true
    fields:
      - name: common_name
        type: string
        source: input
        description: "Display name, e.g. Atlantic Salmon."
      - name: code
        type: string
        source: input
        description: "Unique short code, e.g. SALM."
        constraints: "Unique across all Species; uppercase A-Z/0-9, 2-8 chars."
      - name: target_market_weight_g
        type: number
        source: input
        description: "Target individual weight (grams) at which harvest is recommended."
        constraints: "> 0"
      - name: base_daily_growth_g
        type: number
        source: input
        description: "Baseline per-fish daily weight gain (grams/day) under nominal conditions, used by the biomass growth model."
        constraints: "> 0"
      - name: default_processing_yield_pct
        type: number
        source: input
        description: "Default dressed yield as a fraction of live weight, e.g. 0.62 means 62% of live weight survives processing."
        constraints: "0 < value <= 1"
      - name: min_water_temp_c
        type: number
        source: input
        description: "Lower bound of the species' viable water temperature band (Celsius)."
      - name: max_water_temp_c
        type: number
        source: input
        description: "Upper bound of the species' viable water temperature band (Celsius)."
        constraints: "max_water_temp_c > min_water_temp_c"

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Operator label for the tank/pond."
      - name: kind
        type: enum
        source: input
        description: "Physical water body type."
        constraints: "one of {TANK, POND, RACEWAY, CAGE}"
      - name: volume_liters
        type: number
        source: input
        description: "Water volume in liters."
        constraints: "> 0"
      - name: max_biomass_kg
        type: number
        source: input
        description: "Maximum standing biomass the tank may legally hold (kg)."
        constraints: "> 0"
      - name: posture
        type: enum
        source: computed
        description: "Operational gate derived from latest water-quality reading plus manual overrides. OPEN allows stocking/feeding; RESTRICTED blocks new stocking but allows feeding; FROZEN blocks all cohort operations."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: posture_override
        type: enum
        source: input
        description: "Manual posture floor set by FarmManager; null means posture is purely water-quality-derived."
        default: null
        constraints: "one of {RESTRICTED, FROZEN} or null"
      - name: current_biomass_kg
        type: number
        source: computed
        description: "Sum of estimated_biomass_kg over Cohorts whose current_tank_id == this tank and lifecycle_status IN {STOCKED, GROWING, HARVESTING}."
        default: 0

  - name: BroodstockBatch
    parent: null
    common_fields: true
    fields:
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; species of this broodstock/hatchery batch."
      - name: spawned_at
        type: datetime
        source: input
        description: "Date eggs were spawned/hatched."
      - name: fingerling_count
        type: integer
        source: input
        description: "Number of fingerlings produced and available for stocking into cohorts."
        constraints: ">= 0"
      - name: allocated_count
        type: integer
        source: computed
        description: "Number of fingerlings already drawn into Cohorts from this batch."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE while fingerlings remain; DEPLETED when allocated_count == fingerling_count."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DEPLETED}"

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Operator label for the cohort/lot."
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; species of the fish in this cohort."
      - name: current_tank_id
        type: string
        source: input
        description: "FK -> Tank.id; tank the cohort currently resides in."
      - name: origin_broodstock_id
        type: string
        source: input
        description: "FK -> BroodstockBatch.id; hatchery batch the fingerlings were drawn from. Null for grading-derived child cohorts."
        default: null
      - name: parent_cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; self-reference to the source cohort when this cohort was created by a grading split. Null for original stocked cohorts."
        default: null
      - name: fish_count
        type: integer
        source: input
        description: "Current live fish count in the cohort."
        constraints: ">= 0"
      - name: stocked_avg_weight_g
        type: number
        source: input
        description: "Average individual weight (grams) at stocking, anchor for the growth model."
        constraints: "> 0"
      - name: stocked_at
        type: datetime
        source: input
        description: "Timestamp the cohort was placed into its tank; start of the growth clock."
      - name: cumulative_feed_kg
        type: number
        source: computed
        description: "Sum of FeedLog.amount_kg for this cohort."
        default: 0
      - name: estimated_biomass_kg
        type: number
        source: computed
        description: "Latest biomass estimate from the growth-model calculation (estimate_biomass)."
        default: 0
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Production lifecycle dimension, independent of health_status."
        default: STOCKED
        constraints: "one of {STOCKED, GROWING, HARVESTING, HARVESTED}"
      - name: health_status
        type: enum
        source: computed
        description: "Health dimension, evolves independently of lifecycle_status."
        default: HEALTHY
        constraints: "one of {HEALTHY, UNDER_TREATMENT, WITHDRAWAL}"
      - name: operational_status
        type: enum
        source: computed
        description: "SUSPENDED when the residing tank is FROZEN; ACTIVE otherwise. Blocks feeding/grading/harvest while SUSPENDED."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: withdrawal_until
        type: datetime
        source: computed
        description: "Latest treatment's withdrawal end timestamp; harvest is blocked while current clock < withdrawal_until. Null when no active withdrawal."
        default: null

  - name: StockingEvent
    parent: null
    common_fields: false
    fields:
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; cohort being placed."
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; destination tank."
      - name: fish_count
        type: integer
        source: input
        description: "Number of fish placed in this stocking event."
        constraints: "> 0"
      - name: stocked_at
        type: datetime
        source: input
        description: "Start of the occupancy interval [stocked_at, expected_harvest_at)."
      - name: expected_harvest_at
        type: datetime
        source: input
        description: "End of the occupancy interval (exclusive). Must be strictly after stocked_at."

  - name: FeedLog
    parent: null
    common_fields: false
    fields:
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; cohort that was fed."
      - name: fed_at
        type: datetime
        source: input
        description: "Timestamp of feeding."
      - name: amount_kg
        type: number
        source: input
        description: "Feed delivered (kg) in this event."
        constraints: "> 0"
      - name: feed_type
        type: string
        source: input
        description: "Feed product label."

  - name: WaterQualityReading
    parent: null
    common_fields: false
    fields:
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; tank sampled."
      - name: measured_at
        type: datetime
        source: input
        description: "Timestamp of the sample."
      - name: dissolved_oxygen_mg_l
        type: number
        source: input
        description: "Dissolved oxygen (mg/L)."
        constraints: ">= 0"
      - name: ammonia_mg_l
        type: number
        source: input
        description: "Total ammonia nitrogen (mg/L)."
        constraints: ">= 0"
      - name: water_temp_c
        type: number
        source: input
        description: "Water temperature (Celsius)."
      - name: severity
        type: enum
        source: computed
        description: "Derived from DO/ammonia thresholds (classify_reading): NORMAL, WARNING, or CRITICAL."
        constraints: "one of {NORMAL, WARNING, CRITICAL}"

  - name: GradingEvent
    parent: null
    common_fields: true
    fields:
      - name: source_cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; cohort being graded/split."
      - name: planned_splits
        type: array
        source: input
        description: "Array of split specs, each {label, fish_count, target_tank_id, avg_weight_g}; the split that produces child Cohorts on commit."
      - name: status
        type: enum
        source: computed
        description: "Grading lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, PLANNED, COMMITTED, CANCELLED}"
      - name: child_cohort_ids
        type: array
        source: computed
        description: "Ids of child Cohorts created when status moved to COMMITTED. Empty until commit."
        default: []

  - name: HealthTreatment
    parent: null
    common_fields: true
    fields:
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; cohort treated."
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; tank in which treatment is administered."
      - name: medication
        type: string
        source: input
        description: "Drug/medication name."
      - name: started_at
        type: datetime
        source: input
        description: "Start of the treatment window."
      - name: duration_days
        type: integer
        source: input
        description: "Number of days the medication is dosed."
        constraints: "> 0"
      - name: withdrawal_days
        type: integer
        source: input
        description: "Mandatory withdrawal period (days) AFTER treatment ends, during which harvest is forbidden and the tank cannot be re-treated."
        constraints: ">= 0"
      - name: treatment_end_at
        type: datetime
        source: computed
        description: "started_at + duration_days (computed by compute_treatment_window)."
      - name: withdrawal_end_at
        type: datetime
        source: computed
        description: "treatment_end_at + withdrawal_days (computed by compute_treatment_window); harvest blocked until current clock >= this."
      - name: status
        type: enum
        source: computed
        description: "Treatment lifecycle: ACTIVE (dosing) -> COMPLETED (dosing done) -> CLEARED (withdrawal elapsed)."
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, CLEARED}"

  - name: HarvestOrder
    parent: null
    common_fields: true
    fields:
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; cohort to harvest."
      - name: planned_fish_count
        type: integer
        source: input
        description: "Number of fish planned for harvest from the cohort."
        constraints: "> 0"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Planned harvest timestamp."
      - name: harvested_fish_count
        type: integer
        source: input
        description: "Actual fish harvested, supplied on completion. Null until COMPLETED."
        default: null
      - name: harvested_live_weight_kg
        type: number
        source: input
        description: "Actual live weight (kg) landed, supplied on completion. Null until COMPLETED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Harvest lifecycle. BLOCKED is auto-set by the tank-freeze cascade."
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, BLOCKED, IN_PROGRESS, COMPLETED, CANCELLED}"

  - name: ProcessingBatch
    parent: null
    common_fields: true
    fields:
      - name: harvest_order_id
        type: string
        source: input
        description: "FK -> HarvestOrder.id; the completed harvest feeding this batch."
      - name: input_live_weight_kg
        type: number
        source: computed
        description: "Copied from HarvestOrder.harvested_live_weight_kg at batch creation."
      - name: estimated_yield_kg
        type: number
        source: computed
        description: "Forward-looking processed-weight estimate (estimate_processing_yield) using species default_processing_yield_pct."
        default: 0
      - name: actual_processed_weight_kg
        type: number
        source: input
        description: "Actual dressed weight (kg) produced, supplied on completion. Null until COMPLETED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Processing lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, PROCESSING, COMPLETED, REJECTED}"

  - name: ProductLot
    parent: null
    common_fields: true
    fields:
      - name: processing_batch_id
        type: string
        source: input
        description: "FK -> ProcessingBatch.id; batch that produced this finished-goods lot."
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; species of the finished product."
      - name: total_weight_kg
        type: number
        source: computed
        description: "Finished weight created (= ProcessingBatch.actual_processed_weight_kg). Immutable after creation."
      - name: reserved_weight_kg
        type: number
        source: computed
        description: "Sum of weight_kg over SalesOrderLines that reference this lot and whose owning SalesOrder.status == CONFIRMED."
        default: 0
      - name: available_weight_kg
        type: number
        source: computed
        description: "total_weight_kg - reserved_weight_kg - shipped_weight_kg. Conservation invariant: total == available + reserved + shipped."
        default: 0
      - name: shipped_weight_kg
        type: number
        source: computed
        description: "Sum of weight_kg over SalesOrderLines whose owning SalesOrder.status == FULFILLED."
        default: 0
      - name: price_per_kg
        type: number
        source: input
        description: "List price per kg for this lot."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE while available_weight_kg > 0; DEPLETED when available_weight_kg == 0. Cycles back to AVAILABLE on release."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DEPLETED}"

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_name
        type: string
        source: input
        description: "Buyer name."
      - name: discount_tier
        type: enum
        source: input
        description: "Volume discount tier applied to the whole order."
        default: NONE
        constraints: "one of {NONE, BRONZE, SILVER, GOLD}"
      - name: order_total
        type: number
        source: computed
        description: "Computed order total (compute_order_total): per-line subtotal rounded, then summed, then tier discount applied."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Sales lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, FULFILLED, CANCELLED}"

  - name: SalesOrderLine
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; owning order."
      - name: product_lot_id
        type: string
        source: input
        description: "FK -> ProductLot.id; lot being sold on this line."
      - name: weight_kg
        type: number
        source: input
        description: "Weight (kg) reserved from the lot for this line."
        constraints: "> 0"
      - name: line_subtotal
        type: number
        source: computed
        description: "round(weight_kg * ProductLot.price_per_kg, 2) — per-line rounding pinned BEFORE summation (compute_order_total mode b)."
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tank
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /tanks/{id}/water-quality-readings (severity == WARNING) OR POST /tanks/{id}/posture-override (posture_override = RESTRICTED)"
        actor: FarmTechnician
        preconditions:
          - "Reading severity classifies to WARNING per classify_reading, OR FarmManager sets posture_override = RESTRICTED."
        side_effects:
          - "Tank.posture := RESTRICTED."
          - "increments Tank.version by 1"
        note: "Cyclic posture machine; see recovery transitions below."
      - from: OPEN
        to: FROZEN
        trigger: "POST /tanks/{id}/water-quality-readings (severity == CRITICAL) OR POST /tanks/{id}/posture-override (posture_override = FROZEN)"
        actor: FarmTechnician
        preconditions:
          - "Reading severity classifies to CRITICAL per classify_reading, OR FarmManager sets posture_override = FROZEN."
        side_effects:
          - "Tank.posture := FROZEN."
          - "CASCADE hop 1->2: every Cohort with current_tank_id == this tank and lifecycle_status IN {STOCKED, GROWING, HARVESTING} has operational_status set to SUSPENDED (and Cohort.version bumped)."
          - "increments Tank.version by 1"
        note: "Tank-freeze cascade originates here; the Cohort SUSPENDED side effect itself triggers the HarvestOrder hop in the Cohort machine."
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /tanks/{id}/water-quality-readings (severity == CRITICAL) OR posture-override FROZEN"
        actor: FarmTechnician
        preconditions:
          - "Reading severity CRITICAL, OR posture_override = FROZEN."
        side_effects:
          - "Tank.posture := FROZEN."
          - "CASCADE hop 1->2: residing in-production Cohorts -> operational_status SUSPENDED (Cohort.version bumped)."
          - "increments Tank.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /tanks/{id}/water-quality-readings (severity == NORMAL and posture_override is null)"
        actor: FarmTechnician
        preconditions:
          - "Latest reading classifies NORMAL AND posture_override is null."
        side_effects:
          - "Tank.posture := OPEN."
          - "increments Tank.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /tanks/{id}/water-quality-readings (severity == WARNING and posture_override is null)"
        actor: FarmTechnician
        preconditions:
          - "Latest reading classifies WARNING AND posture_override is null."
        side_effects:
          - "Tank.posture := RESTRICTED."
          - "increments Tank.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /tanks/{id}/water-quality-readings (severity == NORMAL and posture_override is null)"
        actor: FarmTechnician
        preconditions:
          - "Latest reading classifies NORMAL AND posture_override is null."
        side_effects:
          - "Tank.posture := OPEN."
          - "RECOVERY: every Cohort with current_tank_id == this tank and operational_status == SUSPENDED is restored to operational_status ACTIVE (Cohort.version bumped). HarvestOrders that were auto-BLOCKED are NOT auto-restored (require explicit re-schedule)."
          - "increments Tank.version by 1"

  - entity: Cohort
    initial_state: STOCKED
    terminal_states: [HARVESTED]
    transitions:
      - from: STOCKED
        to: GROWING
        trigger: "POST /cohorts/{id}/feed-logs (first feeding) — lifecycle dimension"
        actor: FarmTechnician
        preconditions:
          - "Cohort.operational_status == ACTIVE."
          - "residing Tank.posture IN {OPEN, RESTRICTED}."
        side_effects:
          - "Cohort.lifecycle_status := GROWING."
          - "Cohort.cumulative_feed_kg += FeedLog.amount_kg (recompute aggregation)."
          - "Cohort.estimated_biomass_kg recomputed via estimate_biomass."
          - "increments Cohort.version by 1"
        note: "lifecycle_status and health_status are PARALLEL dimensions — feeding advances lifecycle without touching health_status."
      - from: GROWING
        to: HARVESTING
        trigger: "POST /harvest-orders/{id}/start (cohort enters active harvest) — lifecycle dimension"
        actor: HarvestOperator
        preconditions:
          - "Cohort.operational_status == ACTIVE."
          - "Cohort.health_status == HEALTHY."
          - "current clock >= Cohort.withdrawal_until OR withdrawal_until is null."
        side_effects:
          - "Cohort.lifecycle_status := HARVESTING."
          - "increments Cohort.version by 1"
      - from: HARVESTING
        to: HARVESTED
        trigger: "POST /harvest-orders/{id}/complete depleting the cohort (harvested fish_count == remaining) — lifecycle dimension"
        actor: HarvestOperator
        preconditions:
          - "HarvestOrder.harvested_fish_count == Cohort.fish_count (full harvest)."
        side_effects:
          - "Cohort.lifecycle_status := HARVESTED (terminal)."
          - "Cohort.fish_count := 0."
          - "increments Cohort.version by 1"
      - from: HEALTHY
        to: UNDER_TREATMENT
        trigger: "POST /health-treatments — health dimension"
        actor: Veterinarian
        preconditions:
          - "Cohort.health_status == HEALTHY."
          - "No other ACTIVE HealthTreatment overlaps the requested window on this tank (see resource overlap rules)."
        side_effects:
          - "Cohort.health_status := UNDER_TREATMENT."
          - "Cohort.withdrawal_until := HealthTreatment.withdrawal_end_at (compute_treatment_window)."
          - "increments Cohort.version by 1"
        note: "Parallel to lifecycle_status: a GROWING cohort can also be UNDER_TREATMENT."
      - from: UNDER_TREATMENT
        to: WITHDRAWAL
        trigger: "POST /health-treatments/{id}/complete — health dimension (treatment dosing done)"
        actor: Veterinarian
        preconditions:
          - "HealthTreatment.status == ACTIVE."
          - "current clock >= HealthTreatment.treatment_end_at."
        side_effects:
          - "HealthTreatment.status := COMPLETED."
          - "Cohort.health_status := WITHDRAWAL."
          - "increments Cohort.version by 1"
      - from: WITHDRAWAL
        to: HEALTHY
        trigger: "POST /health-treatments/{id}/clear — health dimension (withdrawal elapsed)"
        actor: Veterinarian
        preconditions:
          - "HealthTreatment.status == COMPLETED."
          - "current clock >= HealthTreatment.withdrawal_end_at."
        side_effects:
          - "HealthTreatment.status := CLEARED."
          - "Cohort.health_status := HEALTHY."
          - "Cohort.withdrawal_until := null."
          - "increments Cohort.version by 1"

  - entity: GradingEvent
    initial_state: DRAFT
    terminal_states: [COMMITTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: "POST /grading-events/{id}/plan"
        actor: FarmTechnician
        preconditions:
          - "sum of planned_splits[].fish_count == source Cohort.fish_count (full conservation)."
          - "each planned_splits[].target_tank_id references a Tank with posture == OPEN."
        side_effects:
          - "GradingEvent.status := PLANNED."
          - "increments GradingEvent.version by 1"
      - from: PLANNED
        to: DRAFT
        trigger: "POST /grading-events/{id}/revise"
        actor: FarmTechnician
        preconditions:
          - "GradingEvent.status == PLANNED."
        side_effects:
          - "GradingEvent.status := DRAFT (cycle back to allow editing planned_splits)."
          - "increments GradingEvent.version by 1"
        note: "Revision loop PLANNED->DRAFT->PLANNED makes this machine cyclic."
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /grading-events/{id}/commit"
        actor: FarmTechnician
        preconditions:
          - "expected_source_cohort_version matches source Cohort.version (OCC)."
          - "source Cohort.operational_status == ACTIVE."
          - "source Cohort.lifecycle_status IN {STOCKED, GROWING}."
          - "sum of planned_splits[].fish_count == source Cohort.fish_count."
        side_effects:
          - "creates one child Cohort per planned_splits entry (parent_cohort_id = source, fish_count from split, current_tank_id = target_tank_id)."
          - "source Cohort.fish_count := 0; source Cohort.lifecycle_status := HARVESTED (consumed by split)."
          - "GradingEvent.child_cohort_ids := created child ids; status := COMMITTED."
          - "INVARIANT (fish conservation): sum(child.fish_count) == pre-split source.fish_count."
          - "increments source Cohort.version by 1"
          - "increments GradingEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /grading-events/{id}/cancel"
        actor: FarmTechnician
        preconditions:
          - "GradingEvent.status == DRAFT."
        side_effects:
          - "GradingEvent.status := CANCELLED (no cohorts created; source untouched)."
          - "increments GradingEvent.version by 1"

  - entity: HarvestOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /harvest-orders/{id}/schedule"
        actor: HarvestOperator
        preconditions:
          - "Cohort.operational_status == ACTIVE (cross-entity: Cohort dependency)."
          - "Cohort.health_status == HEALTHY."
          - "current clock >= Cohort.withdrawal_until OR Cohort.withdrawal_until is null."
          - "planned_fish_count <= Cohort.fish_count."
        side_effects:
          - "HarvestOrder.status := SCHEDULED."
          - "increments HarvestOrder.version by 1"
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system event: residing Tank.posture transitions to FROZEN (cascade hop 2->3)"
        actor: system
        preconditions:
          - "Cohort.operational_status transitioned to SUSPENDED by the tank-freeze cascade."
        side_effects:
          - "HarvestOrder.status := BLOCKED."
          - "increments HarvestOrder.version by 1"
        note: "Third hop of the tank-freeze cascade: Tank FROZEN -> Cohort SUSPENDED -> SCHEDULED HarvestOrder BLOCKED."
      - from: BLOCKED
        to: SCHEDULED
        trigger: "POST /harvest-orders/{id}/schedule (re-schedule after recovery)"
        actor: HarvestOperator
        preconditions:
          - "Cohort.operational_status == ACTIVE (tank recovered to OPEN/RESTRICTED)."
          - "Cohort.health_status == HEALTHY."
        side_effects:
          - "HarvestOrder.status := SCHEDULED."
          - "increments HarvestOrder.version by 1"
        note: "BLOCKED->SCHEDULED makes the harvest machine cyclic."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /harvest-orders/{id}/start"
        actor: HarvestOperator
        preconditions:
          - "Cohort.operational_status == ACTIVE."
          - "Cohort.health_status == HEALTHY."
          - "current clock >= Cohort.withdrawal_until OR withdrawal_until is null."
        side_effects:
          - "HarvestOrder.status := IN_PROGRESS."
          - "Cohort.lifecycle_status := HARVESTING (cross-entity bubble)."
          - "increments HarvestOrder.version by 1"
          - "increments Cohort.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /harvest-orders/{id}/complete"
        actor: HarvestOperator
        preconditions:
          - "harvested_fish_count > 0 AND harvested_fish_count <= Cohort.fish_count."
          - "harvested_live_weight_kg > 0."
        side_effects:
          - "HarvestOrder.status := COMPLETED; stores harvested_fish_count, harvested_live_weight_kg."
          - "Cohort.fish_count -= harvested_fish_count."
          - "if Cohort.fish_count == 0 -> Cohort.lifecycle_status := HARVESTED."
          - "increments HarvestOrder.version by 1"
          - "increments Cohort.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /harvest-orders/{id}/cancel"
        actor: HarvestOperator
        preconditions:
          - "HarvestOrder.status IN {DRAFT, SCHEDULED, BLOCKED}."
        side_effects:
          - "HarvestOrder.status := CANCELLED."
          - "increments HarvestOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /harvest-orders/{id}/cancel"
        actor: HarvestOperator
        preconditions:
          - "HarvestOrder.status IN {DRAFT, SCHEDULED, BLOCKED}."
        side_effects:
          - "HarvestOrder.status := CANCELLED."
          - "increments HarvestOrder.version by 1"

  - entity: ProcessingBatch
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: DRAFT
        to: PROCESSING
        trigger: "POST /processing-batches/{id}/start"
        actor: HarvestOperator
        preconditions:
          - "linked HarvestOrder.status == COMPLETED."
        side_effects:
          - "ProcessingBatch.status := PROCESSING."
          - "ProcessingBatch.estimated_yield_kg recomputed via estimate_processing_yield."
          - "increments ProcessingBatch.version by 1"
      - from: PROCESSING
        to: COMPLETED
        trigger: "POST /processing-batches/{id}/complete"
        actor: HarvestOperator
        preconditions:
          - "actual_processed_weight_kg > 0 AND actual_processed_weight_kg <= input_live_weight_kg."
        side_effects:
          - "ProcessingBatch.status := COMPLETED; stores actual_processed_weight_kg."
          - "creates one ProductLot (total_weight_kg = actual_processed_weight_kg, available_weight_kg = same, status AVAILABLE)."
          - "increments ProcessingBatch.version by 1"
      - from: PROCESSING
        to: REJECTED
        trigger: "POST /processing-batches/{id}/reject"
        actor: HarvestOperator
        preconditions:
          - "ProcessingBatch.status == PROCESSING."
        side_effects:
          - "ProcessingBatch.status := REJECTED (no ProductLot created)."
          - "increments ProcessingBatch.version by 1"

  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /sales-orders/{id}/confirm"
        actor: SalesAgent
        preconditions:
          - "SalesOrder has >= 1 SalesOrderLine."
          - "for every line, line.weight_kg <= referenced ProductLot.available_weight_kg (aggregate availability)."
        side_effects:
          - "SalesOrder.status := CONFIRMED; order_total recomputed via compute_order_total."
          - "for each line: ProductLot.reserved_weight_kg += line.weight_kg; available_weight_kg recomputed; if available == 0 -> ProductLot.status := DEPLETED."
          - "INVARIANT (weight conservation): per lot, total_weight_kg == available_weight_kg + reserved_weight_kg + shipped_weight_kg."
          - "increments SalesOrder.version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /sales-orders/{id}/fulfill"
        actor: SalesAgent
        preconditions:
          - "SalesOrder.status == CONFIRMED."
        side_effects:
          - "SalesOrder.status := FULFILLED."
          - "for each line: ProductLot.reserved_weight_kg -= line.weight_kg; shipped_weight_kg += line.weight_kg (reserved converts to shipped; available unchanged)."
          - "increments SalesOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAgent
        preconditions:
          - "SalesOrder.status == CONFIRMED."
        side_effects:
          - "CASCADE hop 1: SalesOrder.status := CANCELLED."
          - "CASCADE hop 2 (caused by hop 1): for each line, referenced ProductLot.reserved_weight_kg -= line.weight_kg; available_weight_kg recomputed upward (compensation)."
          - "CASCADE hop 2b (caused by lot release): any ProductLot whose status was DEPLETED and now has available_weight_kg > 0 reverts to status AVAILABLE."
          - "INVARIANT (weight conservation) restored: total_weight_kg == available + reserved + shipped."
          - "increments SalesOrder.version by 1"

  - entity: ProductLot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system event: a SalesOrder confirm consumes the lot's last available kg"
        actor: system
        preconditions:
          - "available_weight_kg reaches exactly 0 after a reservation."
        side_effects:
          - "ProductLot.status := DEPLETED."
          - "increments ProductLot.version by 1"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system event: a SalesOrder cancel releases reserved kg back to the lot"
        actor: system
        preconditions:
          - "available_weight_kg becomes > 0 after a release."
        side_effects:
          - "ProductLot.status := AVAILABLE (cyclic recovery)."
          - "increments ProductLot.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: grading-commit-stale-cohort
    parent_entity: Cohort
    write_endpoint: "POST /grading-events/{id}/commit"
    occ_field: "expected_source_cohort_version"
    description: |
      Committing a GradingEvent against a source Cohort whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another grading commit (or a harvest completion) has already mutated the
      source cohort's fish_count/lifecycle_status, so the committing client's plan
      (which still assumes the old fish_count) is stale and would violate the
      fish-count conservation invariant if applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sales-confirm-stale-lot
    parent_entity: ProductLot
    write_endpoint: "POST /sales-orders/{id}/confirm"
    occ_field: "expected_lot_version"
    description: |
      Confirming a SalesOrder while carrying a stale view of a referenced
      ProductLot's version is rejected. expected_lot_version is the version every
      referenced lot must currently equal. This captures the case where another
      SalesOrder confirm has already reserved weight against the same lot
      (legitimately bumping the lot's version and reducing available_weight_kg),
      so the current client's lot snapshot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_biomass
    trigger: "on FeedLog creation, on Cohort read summary (GET /cohorts/{id}/summary), and on grading/harvest mutations"
    algorithm: weighted_scoring
    formula: |
      # Mode (a): >=3 inputs with conditional tier selection and non-linear interaction.
      days_elapsed = floor((current_clock - Cohort.stocked_at) / 1 day)
      # tier selection on age — growth slows as fish mature
      if days_elapsed <= GROWTH_TIER1_DAYS:
          growth_factor = 1.00
      elif days_elapsed <= GROWTH_TIER2_DAYS:
          growth_factor = 0.75
      else:
          growth_factor = 0.50
      est_avg_weight_g = Cohort.stocked_avg_weight_g
                         + days_elapsed * Species.base_daily_growth_g * growth_factor
      # cap at species target; survival applied multiplicatively
      est_avg_weight_g = min(est_avg_weight_g, Species.target_market_weight_g)
      survival = max(SURVIVAL_FLOOR, 1 - SURVIVAL_DECAY_PER_DAY * days_elapsed)
      estimated_biomass_kg = round(Cohort.fish_count * est_avg_weight_g * survival / 1000.0, 2)
    input_set: "Cohort.fish_count (current), Species.base_daily_growth_g, Species.target_market_weight_g, days since stocked_at via logical clock."
    constants:
      GROWTH_TIER1_DAYS: 90
      GROWTH_TIER2_DAYS: 180
      SURVIVAL_DECAY_PER_DAY: 0.0005
      SURVIVAL_FLOOR: 0.80
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: compute_fcr
    trigger: "GET /cohorts/{id}/summary (provisional) and on HarvestOrder complete (final)"
    algorithm: aggregation
    formula: |
      # Feed Conversion Ratio = feed delivered / biomass gain.
      # PROVISIONAL: biomass gain uses the growth-model estimate (estimate_biomass).
      provisional_gain_kg = Cohort.estimated_biomass_kg
                            - (Cohort.fish_count * Cohort.stocked_avg_weight_g / 1000.0)
      provisional_fcr = round(Cohort.cumulative_feed_kg / max(provisional_gain_kg, FCR_GAIN_FLOOR), 2)
      # FINAL: biomass gain uses ACTUAL harvested live weight, not the estimate.
      final_gain_kg = HarvestOrder.harvested_live_weight_kg
                      - (HarvestOrder.harvested_fish_count * Cohort.stocked_avg_weight_g / 1000.0)
      final_fcr = round(Cohort.cumulative_feed_kg / max(final_gain_kg, FCR_GAIN_FLOOR), 2)
    input_set: "cumulative_feed_kg (all FeedLogs), estimated_biomass_kg (provisional) vs harvested_live_weight_kg (final)."
    constants:
      FCR_GAIN_FLOOR: 0.01
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_fcr
        when: "GET /cohorts/{id}/summary before harvest; biomass gain from estimate_biomass."
        difference: "Denominator = estimated_biomass_kg - stocked biomass (growth model)."
      - name: final_fcr
        when: "on HarvestOrder complete; biomass gain from actual landed weight."
        difference: "Denominator = harvested_live_weight_kg - stocked-equivalent weight; diverges from provisional whenever the estimate misses actuals."

  - name: estimate_processing_yield
    trigger: "ProcessingBatch start (estimated) and ProcessingBatch complete (actual)"
    algorithm: forward_looking
    formula: |
      # ESTIMATED (forward-looking): species default yield % applied to harvested live weight.
      estimated_yield_kg = round(ProcessingBatch.input_live_weight_kg
                                 * Species.default_processing_yield_pct, 2)
      # ACTUAL (final): operator-supplied dressed weight at completion.
      actual_yield_kg = ProcessingBatch.actual_processed_weight_kg
      yield_variance_kg = round(actual_yield_kg - estimated_yield_kg, 2)
    input_set: "input_live_weight_kg (copied from HarvestOrder), Species.default_processing_yield_pct vs operator actual."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: estimated_yield
        when: "ProcessingBatch start; uses species default_processing_yield_pct."
        difference: "Forward estimate from a configured percentage."
      - name: actual_yield
        when: "ProcessingBatch complete; uses operator-measured dressed weight."
        difference: "Final measured value; diverges from estimate by yield_variance_kg."

  - name: compute_order_total
    trigger: "on SalesOrder confirm"
    algorithm: tiered_pricing
    formula: |
      # Mode (b): nested rounding order is PINNED — round per line FIRST, then sum, then discount.
      for each SalesOrderLine L:
          L.line_subtotal = round(L.weight_kg * ProductLot.price_per_kg, 2)   # per-line round
      summed = sum(L.line_subtotal for L in lines)                            # sum of rounded lines
      tier_pct = DISCOUNT_TIERS[SalesOrder.discount_tier]
      order_total = round(summed * (1 - tier_pct), 2)                         # discount then final round
    input_set: "all SalesOrderLines on the order, each line's ProductLot.price_per_kg, SalesOrder.discount_tier."
    constants:
      DISCOUNT_TIERS:
        NONE: 0.00
        BRONZE: 0.05
        SILVER: 0.10
        GOLD: 0.15
    precision: "2 decimal places, round_half_up; per-line rounding precedes summation (pinned)."
    variants: []

  - name: compute_treatment_window
    trigger: "on HealthTreatment creation (POST /health-treatments)"
    algorithm: interval_merge
    formula: |
      treatment_end_at  = started_at + duration_days * 1 day
      withdrawal_end_at = treatment_end_at + withdrawal_days * 1 day
      # Overlap check (buffer-extended interval semantics): a NEW treatment N on
      # the same tank is rejected when N.started_at < prior.withdrawal_end_at for
      # ANY prior treatment on that tank whose status IN {ACTIVE, COMPLETED}.
      # Adjacency at exactly prior.withdrawal_end_at is allowed (>=).
    input_set: "started_at, duration_days, withdrawal_days of the new treatment; prior tank treatments' withdrawal_end_at where status IN {ACTIVE, COMPLETED}."
    constants: {}
    precision: "whole days; comparison inclusive of the withdrawal_end_at boundary."
    variants: []

  - name: classify_reading
    trigger: "on WaterQualityReading creation (POST /tanks/{id}/water-quality-readings)"
    algorithm: threshold
    formula: |
      # DO is a lower-bound threshold; ammonia is an upper-bound threshold; both decide posture.
      # Boundary precision PINNED with >= / <= as written.
      if dissolved_oxygen_mg_l < DO_CRITICAL or ammonia_mg_l > NH3_CRITICAL:
          severity = CRITICAL
      elif dissolved_oxygen_mg_l < DO_WARNING or ammonia_mg_l > NH3_WARNING:
          severity = WARNING
      else:
          severity = NORMAL
      # posture floor = max(severity-derived posture, posture_override)
    input_set: "single WaterQualityReading's DO and ammonia values."
    constants:
      DO_CRITICAL: 4.0
      DO_WARNING: 6.0
      NH3_CRITICAL: 1.0
      NH3_WARNING: 0.5
    precision: "exact comparison; DO uses strict < at boundary (4.0 is NOT critical, 3.99 is)."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires headers"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists (validated left-to-right in path, then body FKs)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2 from-state)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /grading-events/{id}/commit, POST /sales-orders/{id}/confirm"

  - priority: 6
    category: business_safety
    check: "Tank posture gate: stocking requires Tank.posture == OPEN; feeding requires Tank.posture IN {OPEN, RESTRICTED}; any cohort op requires Cohort.operational_status == ACTIVE."
    error_id: ERR_TANK_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /stocking-events, POST /cohorts/{id}/feed-logs, POST /grading-events/{id}/commit"

  - priority: 7
    category: business_safety
    check: "Withdrawal gate: harvest schedule/start is forbidden while Cohort.health_status != HEALTHY OR current clock < Cohort.withdrawal_until."
    error_id: ERR_WITHDRAWAL_ACTIVE
    http_status: 409
    applies_to: "POST /harvest-orders/{id}/schedule, POST /harvest-orders/{id}/start"

  - priority: 8
    category: business_temporal
    check: "Tank occupancy overlap: a new StockingEvent's [stocked_at, expected_harvest_at) must not overlap any existing in-production stocking interval on the same tank (half-open; back-to-back at the exact boundary is allowed)."
    error_id: ERR_TANK_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: "POST /stocking-events"

  - priority: 9
    category: business_temporal
    check: "Treatment-window overlap: a new HealthTreatment on a tank must not start before the prior treatment's withdrawal_end_at on that tank (buffer-extended interval — the withdrawal period acts as a mandatory fallow buffer, so adjacency at withdrawal_end_at is allowed but earlier is rejected)."
    error_id: ERR_TREATMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /health-treatments"

  - priority: 10
    category: business_constraint
    check: "Grading conservation: sum(planned_splits[].fish_count) == source Cohort.fish_count exactly (no fish created or destroyed)."
    error_id: ERR_FISH_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /grading-events/{id}/plan, POST /grading-events/{id}/commit"

  - priority: 11
    category: business_referential
    check: "Sales line lot integrity: every SalesOrderLine.product_lot_id references a ProductLot whose status == AVAILABLE at confirm time."
    error_id: ERR_LOT_DEPLETED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/confirm"

  - priority: 12
    category: business_fiscal
    check: "Availability/quota: per line, weight_kg <= ProductLot.available_weight_kg; aggregated per lot across the order's lines must not exceed available_weight_kg."
    error_id: ERR_INSUFFICIENT_LOT_WEIGHT
    http_status: 422
    applies_to: "POST /sales-orders/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "Biomass capacity: a StockingEvent / grading commit must not push Tank.current_biomass_kg above Tank.max_biomass_kg."
    error_id: ERR_TANK_BIOMASS_EXCEEDED
    http_status: 422
    applies_to: "POST /stocking-events, POST /grading-events/{id}/commit"

  - priority: 14
    category: business_constraint
    check: "Broodstock allocation: a Cohort drawing fingerlings from a BroodstockBatch must not exceed (fingerling_count - allocated_count)."
    error_id: ERR_BROODSTOCK_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cohorts"

  - priority: 15
    category: business_constraint
    check: "Required input fields present and well-typed; enum values within declared sets; numeric constraints honored."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 16
    category: business_constraint
    check: "Species.code uniqueness across all Species."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /species"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to a fixed UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time."
    roles: [FarmManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock advanced/rewound to to_iso8601 for all subsequent time-gated rules."]

  # ---- Species ----
  - method: POST
    path: "/species"
    description: "Create a species reference record."
    roles: [FarmManager]
    code: 201
    input: [common_name, code, target_market_weight_g, base_daily_growth_g, default_processing_yield_pct, min_water_temp_c, max_water_temp_c]
    output: Species
    side_effects: ["Validates code uniqueness."]
  - method: GET
    path: "/species"
    description: "List species (paginated)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "code?"]
    output: Species[]
    side_effects: []
  - method: GET
    path: "/species/{id}"
    description: "Get one species."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: Species
    side_effects: []

  # ---- Tank ----
  - method: POST
    path: "/tanks"
    description: "Create a tank/pond."
    roles: [FarmManager]
    code: 201
    input: [name, kind, volume_liters, max_biomass_kg]
    output: Tank
    side_effects: ["posture initialized to OPEN."]
  - method: GET
    path: "/tanks"
    description: "List tanks (paginated)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "posture?"]
    output: Tank[]
    side_effects: []
  - method: GET
    path: "/tanks/{id}"
    description: "Get one tank including computed posture and current_biomass_kg."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: Tank
    side_effects: ["Recomputes current_biomass_kg from residing cohorts."]
  - method: POST
    path: "/tanks/{id}/posture-override"
    description: "FarmManager sets or clears a manual posture floor (RESTRICTED/FROZEN or null)."
    roles: [FarmManager]
    code: 200
    input: [posture_override]
    output: Tank
    side_effects: ["Tank.posture recomputed as max(reading-derived, override); freeze cascade fires when result is FROZEN.", "increments Tank.version by 1"]
  - method: POST
    path: "/tanks/{id}/water-quality-readings"
    description: "Record a water-quality reading; classify severity and drive Tank posture transitions (and freeze cascade)."
    roles: [FarmTechnician]
    code: 201
    input: [measured_at, dissolved_oxygen_mg_l, ammonia_mg_l, water_temp_c]
    output: WaterQualityReading
    side_effects: ["classify_reading sets severity.", "Tank posture transition per §1.2 (cyclic).", "On FROZEN: cascade to residing cohorts (SUSPENDED) and their SCHEDULED harvest orders (BLOCKED).", "increments Tank.version by 1"]
  - method: GET
    path: "/tanks/{id}/water-quality-readings"
    description: "List water-quality readings for a tank (reverse-reachability for WaterQualityReading.tank_id)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: WaterQualityReading[]
    side_effects: []

  # ---- BroodstockBatch ----
  - method: POST
    path: "/broodstock-batches"
    description: "Create a broodstock/hatchery batch."
    roles: [FarmManager]
    code: 201
    input: [species_id, spawned_at, fingerling_count]
    output: BroodstockBatch
    side_effects: ["status initialized to AVAILABLE."]
  - method: GET
    path: "/broodstock-batches"
    description: "List broodstock batches; filter by species_id (reverse-reachability for BroodstockBatch.species_id)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "species_id?"]
    output: BroodstockBatch[]
    side_effects: []
  - method: GET
    path: "/broodstock-batches/{id}"
    description: "Get one broodstock batch."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: BroodstockBatch
    side_effects: []

  # ---- Cohort ---- (api_prefix root collection)
  - method: POST
    path: "/cohorts"
    description: "Create (stock) a cohort, drawing fingerlings from a broodstock batch into a tank."
    roles: [FarmTechnician]
    code: 201
    input: ["label", "species_id", "current_tank_id", "origin_broodstock_id?", "parent_cohort_id?", "fish_count", "stocked_avg_weight_g", "stocked_at"]
    output: Cohort
    side_effects: ["Draws fingerlings: BroodstockBatch.allocated_count += fish_count (when origin_broodstock_id set); status DEPLETED if exhausted.", "lifecycle_status STOCKED, health_status HEALTHY, operational_status ACTIVE."]
  - method: GET
    path: "/cohorts"
    description: "List cohorts; filters provide reverse-reachability for Cohort FKs."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "species_id?", "current_tank_id?", "origin_broodstock_id?", "parent_cohort_id?", "lifecycle_status?", "health_status?"]
    output: Cohort[]
    side_effects: []
  - method: GET
    path: "/cohorts/{id}"
    description: "Get one cohort with both status dimensions and computed fields."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: GET
    path: "/cohorts/{id}/summary"
    description: "Computed summary: estimated_biomass_kg (estimate_biomass) and provisional_fcr (compute_fcr provisional variant)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: "{ cohort_id: string, estimated_biomass_kg: number, provisional_fcr: number, cumulative_feed_kg: number, days_elapsed: integer }"
    side_effects: ["Recomputes estimate_biomass and provisional_fcr against the logical clock."]
  - method: POST
    path: "/cohorts/{id}/feed-logs"
    description: "Record a feeding; advances lifecycle STOCKED->GROWING on first feed and recomputes biomass."
    roles: [FarmTechnician]
    code: 201
    input: [fed_at, amount_kg, feed_type]
    output: FeedLog
    side_effects: ["Cohort.cumulative_feed_kg recomputed.", "estimate_biomass recomputed.", "first feed: lifecycle_status STOCKED->GROWING.", "increments Cohort.version by 1"]
  - method: GET
    path: "/cohorts/{id}/feed-logs"
    description: "List feed logs for a cohort (reverse-reachability for FeedLog.cohort_id)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedLog[]
    side_effects: []

  # ---- StockingEvent ----
  - method: POST
    path: "/stocking-events"
    description: "Record a stocking event placing fish into a tank for an occupancy interval."
    roles: [FarmTechnician]
    code: 201
    input: [cohort_id, tank_id, fish_count, stocked_at, expected_harvest_at]
    output: StockingEvent
    side_effects: ["Tank occupancy overlap check (half-open).", "Tank biomass capacity check.", "Requires Tank.posture == OPEN."]
  - method: GET
    path: "/stocking-events"
    description: "List stocking events; filter by cohort_id/tank_id (reverse-reachability)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "cohort_id?", "tank_id?"]
    output: StockingEvent[]
    side_effects: []
  - method: GET
    path: "/stocking-events/{id}"
    description: "Get one stocking event."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: StockingEvent
    side_effects: []

  # ---- GradingEvent ----
  - method: POST
    path: "/grading-events"
    description: "Create a grading/split plan (DRAFT) against a source cohort."
    roles: [FarmTechnician]
    code: 201
    input: [source_cohort_id, planned_splits]
    output: GradingEvent
    side_effects: ["status DRAFT."]
  - method: GET
    path: "/grading-events"
    description: "List grading events; filter by source_cohort_id (reverse-reachability)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "source_cohort_id?"]
    output: GradingEvent[]
    side_effects: []
  - method: GET
    path: "/grading-events/{id}"
    description: "Get one grading event."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: GradingEvent
    side_effects: []
  - method: POST
    path: "/grading-events/{id}/plan"
    description: "Move a grading event DRAFT->PLANNED after conservation + target-tank checks."
    roles: [FarmTechnician]
    code: 200
    input: []
    output: GradingEvent
    side_effects: ["status PLANNED.", "increments GradingEvent.version by 1"]
  - method: POST
    path: "/grading-events/{id}/revise"
    description: "Move a grading event PLANNED->DRAFT (revision loop)."
    roles: [FarmTechnician]
    code: 200
    input: ["planned_splits?"]
    output: GradingEvent
    side_effects: ["status DRAFT; planned_splits optionally replaced.", "increments GradingEvent.version by 1"]
  - method: POST
    path: "/grading-events/{id}/commit"
    description: "Commit a grading event PLANNED->COMMITTED: create child cohorts and consume the source. OCC on source Cohort.version."
    roles: [FarmTechnician]
    code: 200
    input: [expected_source_cohort_version]
    output: GradingEvent
    side_effects: ["Creates child Cohorts (fish-count conservation).", "Source Cohort fish_count->0, lifecycle_status->HARVESTED.", "Tank biomass capacity re-check per target.", "increments source Cohort.version by 1", "increments GradingEvent.version by 1"]
  - method: POST
    path: "/grading-events/{id}/cancel"
    description: "Cancel a DRAFT grading event."
    roles: [FarmTechnician]
    code: 200
    input: []
    output: GradingEvent
    side_effects: ["status CANCELLED.", "increments GradingEvent.version by 1"]

  # ---- HealthTreatment ----
  - method: POST
    path: "/health-treatments"
    description: "Start a health treatment on a cohort/tank; sets cohort health_status UNDER_TREATMENT and withdrawal window."
    roles: [Veterinarian]
    code: 201
    input: [cohort_id, tank_id, medication, started_at, duration_days, withdrawal_days]
    output: HealthTreatment
    side_effects: ["compute_treatment_window sets treatment_end_at, withdrawal_end_at.", "Treatment-window overlap check (buffer-extended).", "Cohort.health_status HEALTHY->UNDER_TREATMENT; withdrawal_until set.", "increments Cohort.version by 1"]
  - method: GET
    path: "/health-treatments"
    description: "List health treatments; filter by cohort_id/tank_id (reverse-reachability)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "cohort_id?", "tank_id?"]
    output: HealthTreatment[]
    side_effects: []
  - method: GET
    path: "/health-treatments/{id}"
    description: "Get one health treatment with computed windows."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: HealthTreatment
    side_effects: []
  - method: POST
    path: "/health-treatments/{id}/complete"
    description: "Complete dosing (ACTIVE->COMPLETED): cohort health_status UNDER_TREATMENT->WITHDRAWAL."
    roles: [Veterinarian]
    code: 200
    input: []
    output: HealthTreatment
    side_effects: ["status COMPLETED.", "Cohort.health_status WITHDRAWAL.", "increments Cohort.version by 1", "increments HealthTreatment.version by 1"]
  - method: POST
    path: "/health-treatments/{id}/clear"
    description: "Clear withdrawal (COMPLETED->CLEARED) once withdrawal_end_at elapsed: cohort health_status->HEALTHY."
    roles: [Veterinarian]
    code: 200
    input: []
    output: HealthTreatment
    side_effects: ["status CLEARED.", "Cohort.health_status HEALTHY; withdrawal_until null.", "increments Cohort.version by 1", "increments HealthTreatment.version by 1"]

  # ---- HarvestOrder ----
  - method: POST
    path: "/harvest-orders"
    description: "Create a harvest order (DRAFT) for a cohort."
    roles: [HarvestOperator]
    code: 201
    input: [cohort_id, planned_fish_count, scheduled_at]
    output: HarvestOrder
    side_effects: ["status DRAFT."]
  - method: GET
    path: "/harvest-orders"
    description: "List harvest orders; filter by cohort_id (reverse-reachability)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "cohort_id?", "status?"]
    output: HarvestOrder[]
    side_effects: []
  - method: GET
    path: "/harvest-orders/{id}"
    description: "Get one harvest order."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: HarvestOrder
    side_effects: []
  - method: POST
    path: "/harvest-orders/{id}/schedule"
    description: "Schedule a harvest (DRAFT/BLOCKED->SCHEDULED) after cohort health + withdrawal gates."
    roles: [HarvestOperator]
    code: 200
    input: []
    output: HarvestOrder
    side_effects: ["status SCHEDULED.", "increments HarvestOrder.version by 1"]
  - method: POST
    path: "/harvest-orders/{id}/start"
    description: "Start a harvest (SCHEDULED->IN_PROGRESS); cohort lifecycle GROWING->HARVESTING."
    roles: [HarvestOperator]
    code: 200
    input: []
    output: HarvestOrder
    side_effects: ["status IN_PROGRESS.", "Cohort.lifecycle_status HARVESTING.", "increments HarvestOrder.version by 1", "increments Cohort.version by 1"]
  - method: POST
    path: "/harvest-orders/{id}/complete"
    description: "Complete a harvest (IN_PROGRESS->COMPLETED); reduces cohort fish_count, computes final_fcr."
    roles: [HarvestOperator]
    code: 200
    input: [harvested_fish_count, harvested_live_weight_kg]
    output: HarvestOrder
    side_effects: ["status COMPLETED.", "Cohort.fish_count -= harvested_fish_count; HARVESTED if zero.", "compute_fcr final variant computed.", "increments HarvestOrder.version by 1", "increments Cohort.version by 1"]
  - method: POST
    path: "/harvest-orders/{id}/cancel"
    description: "Cancel a non-started harvest (DRAFT/SCHEDULED/BLOCKED->CANCELLED)."
    roles: [HarvestOperator]
    code: 200
    input: []
    output: HarvestOrder
    side_effects: ["status CANCELLED.", "increments HarvestOrder.version by 1"]

  # ---- ProcessingBatch ----
  - method: POST
    path: "/processing-batches"
    description: "Create a processing batch (DRAFT) from a completed harvest order."
    roles: [HarvestOperator]
    code: 201
    input: [harvest_order_id]
    output: ProcessingBatch
    side_effects: ["input_live_weight_kg copied from HarvestOrder.harvested_live_weight_kg.", "status DRAFT."]
  - method: GET
    path: "/processing-batches"
    description: "List processing batches; filter by harvest_order_id (reverse-reachability)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "harvest_order_id?", "status?"]
    output: ProcessingBatch[]
    side_effects: []
  - method: GET
    path: "/processing-batches/{id}"
    description: "Get one processing batch with yield fields."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: []
  - method: POST
    path: "/processing-batches/{id}/start"
    description: "Start processing (DRAFT->PROCESSING); computes estimated_yield_kg."
    roles: [HarvestOperator]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: ["status PROCESSING.", "estimate_processing_yield (estimated variant).", "increments ProcessingBatch.version by 1"]
  - method: POST
    path: "/processing-batches/{id}/complete"
    description: "Complete processing (PROCESSING->COMPLETED); creates a ProductLot from actual dressed weight."
    roles: [HarvestOperator]
    code: 200
    input: [actual_processed_weight_kg, price_per_kg]
    output: ProcessingBatch
    side_effects: ["status COMPLETED; actual_processed_weight_kg stored.", "creates ProductLot (total=available=actual; status AVAILABLE; price_per_kg).", "increments ProcessingBatch.version by 1"]
  - method: POST
    path: "/processing-batches/{id}/reject"
    description: "Reject processing (PROCESSING->REJECTED); no ProductLot created."
    roles: [HarvestOperator]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: ["status REJECTED.", "increments ProcessingBatch.version by 1"]

  # ---- ProductLot ----
  - method: GET
    path: "/product-lots"
    description: "List product lots; filter by processing_batch_id/species_id (reverse-reachability)."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "processing_batch_id?", "species_id?", "status?"]
    output: ProductLot[]
    side_effects: []
  - method: GET
    path: "/product-lots/{id}"
    description: "Get one product lot with weight conservation fields."
    roles: [FarmManager, FarmTechnician, Veterinarian, HarvestOperator, SalesAgent]
    code: 200
    input: []
    output: ProductLot
    side_effects: []

  # ---- SalesOrder & lines ----
  - method: POST
    path: "/sales-orders"
    description: "Create a sales order (DRAFT) with header fields."
    roles: [SalesAgent]
    code: 201
    input: ["customer_name", "discount_tier?"]
    output: SalesOrder
    side_effects: ["status DRAFT; order_total 0."]
  - method: GET
    path: "/sales-orders"
    description: "List sales orders (paginated)."
    roles: [FarmManager, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SalesOrder[]
    side_effects: []
  - method: GET
    path: "/sales-orders/{id}"
    description: "Get one sales order with computed order_total."
    roles: [FarmManager, SalesAgent]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: "/sales-orders/{id}/lines"
    description: "Add a line to a DRAFT sales order."
    roles: [SalesAgent]
    code: 201
    input: [product_lot_id, weight_kg]
    output: SalesOrderLine
    side_effects: ["line_subtotal computed (round per-line).", "no reservation until confirm."]
  - method: GET
    path: "/sales-order-lines"
    description: "List sales order lines; filter by sales_order_id/product_lot_id (reverse-reachability)."
    roles: [FarmManager, SalesAgent]
    code: 200
    input: ["limit?", "offset?", "sales_order_id?", "product_lot_id?"]
    output: SalesOrderLine[]
    side_effects: []
  - method: GET
    path: "/sales-order-lines/{id}"
    description: "Get one sales order line."
    roles: [FarmManager, SalesAgent]
    code: 200
    input: []
    output: SalesOrderLine
    side_effects: []
  - method: POST
    path: "/sales-orders/{id}/confirm"
    description: "Confirm a sales order (DRAFT->CONFIRMED); reserve lot weight, compute order_total. OCC: expected_lot_version is the version EVERY referenced ProductLot must currently equal; if any referenced lot's version differs, the confirm is rejected with ERR_STALE_VERSION (412). Adding a line does NOT bump a lot's version; only confirm/fulfill/cancel do, so two fresh lots referenced by one order are both at version 1 at confirm time."
    roles: [SalesAgent]
    code: 200
    input: [expected_lot_version]
    output: SalesOrder
    side_effects: ["compute_order_total.", "Per lot: reserved += line weight; available recomputed; DEPLETED if available 0.", "increments referenced ProductLot.version by 1", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/sales-orders/{id}/fulfill"
    description: "Fulfill a confirmed order (CONFIRMED->FULFILLED); convert reserved to shipped."
    roles: [SalesAgent]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Per lot: reserved -= line weight; shipped += line weight.", "increments referenced ProductLot.version by 1", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/sales-orders/{id}/cancel"
    description: "Cancel a confirmed order (CONFIRMED->CANCELLED); release reserved weight (compensation cascade)."
    roles: [SalesAgent]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Cascade: release reserved per lot; available recomputed up; DEPLETED lots revert to AVAILABLE.", "increments referenced ProductLot.version by 1", "increments SalesOrder.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this operation per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or body FK) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match the parent's current version."
  - id: ERR_TANK_NOT_OPERATIONAL
    http: 409
    condition: "Tank posture or Cohort.operational_status forbids the operation (stocking needs OPEN, feeding needs OPEN/RESTRICTED, cohort op needs ACTIVE)."
  - id: ERR_WITHDRAWAL_ACTIVE
    http: 409
    condition: "Harvest schedule/start attempted while cohort health_status != HEALTHY or current clock < withdrawal_until."
  - id: ERR_TANK_OCCUPANCY_OVERLAP
    http: 409
    condition: "New stocking interval [stocked_at, expected_harvest_at) overlaps an existing in-production interval on the same tank."
  - id: ERR_TREATMENT_WINDOW_CONFLICT
    http: 409
    condition: "New treatment on a tank starts before the prior treatment's withdrawal_end_at on that tank (buffer-extended overlap)."
  - id: ERR_FISH_COUNT_MISMATCH
    http: 422
    condition: "sum(planned_splits[].fish_count) != source Cohort.fish_count at plan/commit."
  - id: ERR_LOT_DEPLETED
    http: 409
    condition: "A referenced ProductLot has status DEPLETED at confirm time."
  - id: ERR_INSUFFICIENT_LOT_WEIGHT
    http: 422
    condition: "Per-line or aggregated reservation exceeds ProductLot.available_weight_kg."
  - id: ERR_TANK_BIOMASS_EXCEEDED
    http: 422
    condition: "Stocking or grading commit would push Tank.current_biomass_kg above max_biomass_kg."
  - id: ERR_BROODSTOCK_INSUFFICIENT
    http: 422
    condition: "Cohort draw exceeds BroodstockBatch (fingerling_count - allocated_count)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, out-of-range numeric, or invalid enum value."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Species.code already exists."
  - id: ERR_VALIDATION_LIMIT_RANGE
    http: 400
    condition: "Pagination limit/offset out of [min=1,max=100] / [>=0] range."
  - id: ERR_INVALID_SPLIT_TARGET
    http: 409
    condition: "A planned_splits target_tank_id references a Tank whose posture != OPEN at plan/commit."
  - id: ERR_HARVEST_COUNT_EXCEEDS
    http: 422
    condition: "harvested_fish_count or planned_fish_count exceeds Cohort.fish_count."
  - id: ERR_PROCESSING_WEIGHT_EXCEEDS
    http: 422
    condition: "actual_processed_weight_kg exceeds ProcessingBatch.input_live_weight_kg."
  - id: ERR_EMPTY_ORDER
    http: 422
    condition: "Confirm attempted on a SalesOrder with zero lines."
  - id: ERR_TREATMENT_NOT_DUE
    http: 409
    condition: "Treatment complete before treatment_end_at, or clear before withdrawal_end_at (clock too early)."
  - id: ERR_WATER_TEMP_OUT_OF_BAND
    http: 422
    condition: "Reading water_temp_c outside the residing cohorts' species [min_water_temp_c, max_water_temp_c] band when a cohort resides in the tank."
  - id: ERR_DUPLICATE_LINE_LOT
    http: 409
    condition: "Two lines on the same SalesOrder reference the same product_lot_id (aggregate handling requires one line per lot)."
  - id: ERR_POSTURE_OVERRIDE_INVALID
    http: 400
    condition: "posture_override value not in {RESTRICTED, FROZEN, null}."
  - id: ERR_GRADING_SPLIT_EMPTY
    http: 422
    condition: "planned_splits is empty or contains a split with fish_count <= 0."
  - id: ERR_CLOCK_BACKWARDS
    http: 422
    condition: "An event timestamp (fed_at, measured_at, started_at) precedes the cohort/tank creation or is in the future relative to the logical clock when the rule requires past-only."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Operations supervisor; owns reference data (species, tanks, broodstock), manual posture overrides, and full read access."
    identity: opaque
    exclusive_operations:
      - "POST /species"
      - "POST /tanks"
      - "POST /broodstock-batches"
      - "POST /tanks/{id}/posture-override"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"
      - "GET /sales-orders, GET /sales-orders/{id}, GET /sales-order-lines"

  - name: FarmTechnician
    description: "Day-to-day husbandry: stocking, feeding, water-quality readings, grading/splitting."
    identity: opaque
    exclusive_operations:
      - "POST /cohorts"
      - "POST /cohorts/{id}/feed-logs"
      - "POST /stocking-events"
      - "POST /tanks/{id}/water-quality-readings"
      - "POST /grading-events"
      - "POST /grading-events/{id}/plan"
      - "POST /grading-events/{id}/revise"
      - "POST /grading-events/{id}/commit"
      - "POST /grading-events/{id}/cancel"
    shared_operations:
      - "GET (husbandry + reference read endpoints)"

  - name: Veterinarian
    description: "Animal health: applies treatments, completes dosing, clears withdrawal."
    identity: opaque
    exclusive_operations:
      - "POST /health-treatments"
      - "POST /health-treatments/{id}/complete"
      - "POST /health-treatments/{id}/clear"
    shared_operations:
      - "GET (health + reference read endpoints)"

  - name: HarvestOperator
    description: "Harvest and processing: harvest orders, processing batches, product lots."
    identity: opaque
    exclusive_operations:
      - "POST /harvest-orders"
      - "POST /harvest-orders/{id}/schedule"
      - "POST /harvest-orders/{id}/start"
      - "POST /harvest-orders/{id}/complete"
      - "POST /harvest-orders/{id}/cancel"
      - "POST /processing-batches"
      - "POST /processing-batches/{id}/start"
      - "POST /processing-batches/{id}/complete"
      - "POST /processing-batches/{id}/reject"
    shared_operations:
      - "GET (harvest/processing + reference read endpoints)"

  - name: SalesAgent
    description: "Inventory and sales: sales orders, lines, confirm/fulfill/cancel."
    identity: opaque
    exclusive_operations:
      - "POST /sales-orders"
      - "POST /sales-orders/{id}/lines"
      - "POST /sales-orders/{id}/confirm"
      - "POST /sales-orders/{id}/fulfill"
      - "POST /sales-orders/{id}/cancel"
    shared_operations:
      - "GET /product-lots, GET /sales-orders, GET /sales-order-lines + reference read endpoints"
