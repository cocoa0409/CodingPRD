              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_ota_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC557", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "DUP001", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
