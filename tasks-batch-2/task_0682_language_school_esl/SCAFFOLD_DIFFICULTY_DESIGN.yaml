          - errors[ERR_COMPLETION_REQUIREMENTS_UNMET]
        distinguishing_aspect: "Empty-collection boundary on a DIFFERENT endpoint (POST /enrollments/{id}/complete): with term ended and attendance fine but ZERO ProgressReports, completion is rejected — the empty-set edge, distinct from the numeric 18-hour metric."
