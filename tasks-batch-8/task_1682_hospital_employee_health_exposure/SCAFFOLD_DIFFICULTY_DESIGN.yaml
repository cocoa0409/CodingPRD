            - "WorkRestriction.${wr_id}: status == ACTIVE, restriction_type == FULL_EXCLUSION, origin == SEROCONVERSION, start_date == 2026-09-03T10:00:00Z, end_date null (link 2 caused by link 1)"
            - "Employee.${emp_id}: open_restriction_count == 1 and compliance_posture == WORK_EXCLUDED (link 3 caused by link 2)"
            - "BASELINE POSITIVE would NOT seroconvert: verified separately — here BASELINE NEGATIVE leaves case_status REPORTED until WEEK_6 result"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pep_start_state_beats_safety
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.PEPRegimen.RECOMMENDED_to_STARTED
        distinguishing_aspect: |
          Error-category pair state (priority 4) vs business_safety (priority 5): a START
          attempt on a DECLINED PEP regimen with started_at beyond the 72h deadline violates
          both; ERR_INVALID_STATE (state) MUST win over ERR_PEP_WINDOW_EXPIRED (safety).
        test_recipe:
          setup:
            - "Employee E1 ACTIVE; MEDIUM-risk case with PEP auto-created; PEP DECLINED by the employee themself; clock still inside the 72h window so no auto-expiry"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-PP1", full_name: "Pri Ority", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "DECLINED" }
              as: StaffEmployee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-05T12:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 4) — NOT ERR_PEP_WINDOW_EXPIRED (business_safety, priority 5), even though started_at 2026-08-05T12:00:00Z is past the 2026-08-02T10:00:00Z deadline"
            - "PEPRegimen.${pep_id}.status remains DECLINED"

      - name: titer_referential_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 6) vs business_temporal
          (priority 7): one titer POST carries a screening_id owned by ANOTHER employee
          AND a future resulted_at; ERR_SCREENING_EMPLOYEE_MISMATCH MUST win over
          ERR_FUTURE_RESULT_DATE. Distinct category pair from pep_start_state_beats_safety.
        test_recipe:
          setup:
            - "Employee EA with an IN_PROGRESS screening SA; employee EB with no screening; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-PP2A", full_name: "Ref Err", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_a: $.data.id, emp_a_v: $.data.version }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-PP2B", full_name: "Temp Err", job_category: "TECH", department: "LAB", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_b: $.data.id }
            - call: "POST /employee-health/employees/${emp_a}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_a_v}" }
              as: EmployeeHealthNurse
              captures: { scr_a: $.data.id }
          trigger:
            - call: "POST /employee-health/employees/${emp_b}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2027-01-01T00:00:00Z", screening_id: "${scr_a}" }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCREENING_EMPLOYEE_MISMATCH (business_referential, priority 6) — NOT ERR_FUTURE_RESULT_DATE (business_temporal, priority 7), even though resulted_at 2027-01-01 is in the future"
            - "No TiterResult row created for ${emp_b}"

  - rule_id: boundary_precision_check
    instances:
      - name: pep_window_inclusive_start_strict_expiry
        grounds:
          - calculations.pep_window_assessment
          - state_machines.PEPRegimen.RECOMMENDED_to_STARTED
          - state_machines.PEPRegimen.RECOMMENDED_to_WINDOW_EXPIRED
        distinguishing_aspect: |
          Metric: seconds elapsed vs the 72h PEP window, observed on the pep transition
          endpoint and the clock endpoint. STARTED with started_at exactly == window_deadline
          succeeds (inclusive eligibility), while the same regimen flips to WINDOW_EXPIRED
          only when now is STRICTLY greater than the deadline (now == deadline keeps it
          RECOMMENDED).
        test_recipe:
          setup:
            - "Employee E1 with two MEDIUM-risk exposure cases C1 and C2, both exposure_datetime 2026-08-10T09:00:00Z (window_deadline 2026-08-13T09:00:00Z); clock at 2026-08-10T10:00:00Z at intake"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-BP1", full_name: "Win Dow", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-08-10T09:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case1: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-08-10T09:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case2: $.data.id }
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case1}" }
              as: EmployeeHealthPhysician
              captures: { pep1: "$.data[0].id", pep1_deadline: "$.data[0].window_deadline" }
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case2}" }
              as: EmployeeHealthPhysician
              captures: { pep2: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/pep-regimens/${pep1}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-13T09:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { pep1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T09:00:01Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens/${pep2}"
              as: EmployeeHealthPhysician
              captures: { pep2_status: $.data.status }
          assert:
            - "${pep1_deadline} == 2026-08-13T09:00:00Z (exposure + 72h exactly)"
            - "At now == deadline, PEP1 STARTED succeeds: ${pep1_status} == STARTED (inclusive boundary, started_at == deadline == now)"
            - "At now == deadline + 1s, PEP2 auto-transitioned: ${pep2_status} == WINDOW_EXPIRED (strict greater-than expiry)"

      - name: contact_monitoring_strict_end_boundary
        grounds:
          - calculations.contact_monitoring_window
          - state_machines.ExposureContact.MONITORING_to_CLEARED
        distinguishing_aspect: |
          Metric: whole-day monitoring window vs monitoring_end, observed on the clock
          endpoint plus the contacts list — a different metric (14-day COVID window) and
          different endpoints from the PEP 72h window. At now == monitoring_end the contact
          remains MONITORING; at now == monitoring_end + 1 day it is CLEARED.
        test_recipe:
          setup:
            - "Index employee IX and contact employee EC exist; COVID event (onset 2026-08-01T00:00:00Z, infectious_start 2026-07-30T00:00:00Z, window 14 days) in TRACING; clock 2026-08-05T00:00:00Z; contact enrolled with contact_date 2026-08-02T00:00:00Z (monitoring_end 2026-08-16T00:00:00Z)"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-BP2X", full_name: "Index Case", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { ix_id: $.data.id }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-BP2C", full_name: "Con Tact", job_category: "TECH", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { ec_id: $.data.id }
            - call: "POST /employee-health/communicable-events"
              payload: { index_employee_id: "${ix_id}", disease: "COVID", onset_date: "2026-08-01T00:00:00Z" }
              as: SafetyOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /employee-health/communicable-events/${ev_id}/advance"
              payload: { to_state: "TRACING" }
              as: SafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/communicable-events/${ev_id}/contacts"
              payload: { contact_employee_id: "${ec_id}", contact_date: "2026-08-02T00:00:00Z" }
              as: SafetyOfficer
              captures: { ct_id: $.data.id, ct_end: $.data.monitoring_end }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/exposure-contacts/${ct_id}"
              as: SafetyOfficer
              captures: { st_at_end: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/exposure-contacts/${ct_id}"
              as: SafetyOfficer
              captures: { st_after: $.data.status }
          assert:
            - "${ct_end} == 2026-08-16T00:00:00Z (contact_date + 14 days)"
            - "At now == monitoring_end: ${st_at_end} == MONITORING (strict > not yet met)"
            - "At now == monitoring_end + 1 day: ${st_after} == CLEARED (symptom_onset_reported false)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: clearance_decide_requires_restriction_active
        grounds:
          - state_machines.ReturnToWorkClearance.PENDING_to_CLEARED
          - state_machines.WorkRestriction.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Entity pair ReturnToWorkClearance -> WorkRestriction: a PENDING clearance cannot
          be decided once its linked restriction has auto-EXPIRED (end_date reached),
          failing with ERR_RESTRICTION_NOT_ACTIVE even though the clearance itself is in
          a valid from-state.
        test_recipe:
          setup:
            - "Employee E1 exists; restriction R1 MODIFIED_DUTY [2026-08-02T00:00:00Z, 2026-08-10T00:00:00Z) ACTIVE with PENDING clearance CR1; clock advanced to 2026-08-10T00:00:00Z so R1 auto-EXPIRED"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-XD1", full_name: "Xdep One", job_category: "TECH", department: "RAD", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/work-restrictions"
              payload: { restriction_type: "MODIFIED_DUTY", start_date: "2026-08-02T00:00:00Z", end_date: "2026-08-10T00:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { wr_id: $.data.id }
            - call: "POST /employee-health/work-restrictions/${wr_id}/clearances"
              payload: {}
              as: EmployeeHealthNurse
              captures: { clr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /employee-health/return-to-work-clearances/${clr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESTRICTION_NOT_ACTIVE"
            - "WorkRestriction.${wr_id}.status == EXPIRED (auto at now >= end_date) and open_restriction_count back to 0"
            - "ReturnToWorkClearance.${clr_id}.status remains PENDING"

      - name: hold_release_requires_cycle_satisfied
        grounds:
          - state_machines.ComplianceHold.ACTIVE_to_RELEASED
          - state_machines.AnnualRequirementCycle.OVERDUE_to_SATISFIED
        distinguishing_aspect: |
          Entity pair ComplianceHold -> AnnualRequirementCycle (distinct from the
          clearance/restriction pair): releasing a TB_OVERDUE hold fails with
          ERR_UNDERLYING_REQUIREMENT_UNMET while the linked cycle is still OVERDUE, and
          succeeds only after a late completion flips the cycle to SATISFIED.
        test_recipe:
          setup:
            - "Employee E1 ACTIVE; CALENDAR_YEAR 2025 cycle (tb_due_date 2025-12-31T23:59:59Z) OPEN; clock advanced to 2026-08-01T00:00:01Z so cycle is OVERDUE and a TB_OVERDUE hold is ACTIVE (E1 SUSPENDED)"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-XD2", full_name: "Hol Relee", job_category: "NURSE", department: "MED", hire_date: "2024-06-01T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2025, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/compliance-holds"
              payload: { employee_id: "${emp_id}", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { hold_id: "$.data[0].id" }
          trigger:
            - call: "POST /employee-health/compliance-holds/${hold_id}/release"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /employee-health/annual-requirement-cycles/${cyc_id}/completions"
              payload: { requirement_type: "TB_SCREENING", completed_at: "2026-08-01T00:00:01Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/compliance-holds/${hold_id}/release"
              payload: {}
              as: ComplianceOfficer
              captures: { hold_status: $.data.status }
            - call: "GET /employee-health/employees/${emp_id}"
              as: ComplianceOfficer
          assert:
            - "First release attempt: error_id == ERR_UNDERLYING_REQUIREMENT_UNMET (cycle still OVERDUE)"
            - "After TB completion: AnnualRequirementCycle.${cyc_id}.status == SATISFIED (late completion allowed from OVERDUE)"
            - "Second release: ${hold_status} == RELEASED; Employee.${emp_id} status == ACTIVE, active_hold_count == 0, compliance_posture == CLEAR"

  - rule_id: resource_temporal_overlap
    instances:
      - name: work_restriction_half_open_overlap
        grounds:
          - validations[priority=8]
          - entities.WorkRestriction.fields.start_date
          - entities.WorkRestriction.fields.end_date
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start_date, end_date) on WorkRestriction — a new
          restriction starting exactly at the incumbent's end_date is ADJACENT and allowed,
          while one starting one day earlier is rejected with ERR_WORK_RESTRICTION_OVERLAP.
        test_recipe:
          setup:
            - "Employee E1 exists; ACTIVE restriction R1 [2026-08-05T00:00:00Z, 2026-08-20T00:00:00Z)"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-OV1", full_name: "Over Lap", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/work-restrictions"
              payload: { restriction_type: "NO_PROCEDURES", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-20T00:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/work-restrictions"
              payload: { restriction_type: "MODIFIED_DUTY", start_date: "2026-08-20T00:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { r2_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/work-restrictions"
              payload: { restriction_type: "NO_PATIENT_CONTACT", start_date: "2026-08-19T00:00:00Z", end_date: "2026-08-25T00:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent create (start == R1.end_date) succeeded: WorkRestriction.${r2_id} exists ACTIVE with open-ended end_date null (half-open adjacency permitted)"
            - "Overlapping create rejected: error_id == ERR_WORK_RESTRICTION_OVERLAP"
            - "Employee.${emp_id}.open_restriction_count == 2 (R1 + R2 only)"

      - name: campaign_closed_interval_touch_conflict
        grounds:
          - validations[priority=8]
          - entities.VaccinationCampaign.fields.window_start
          - entities.VaccinationCampaign.fields.window_end
        distinguishing_aspect: |
          Interval semantics: CLOSED [window_start, window_end] on VaccinationCampaign per
          vaccine_type — a new INFLUENZA campaign whose window_start equals the incumbent's
          window_end TOUCHES it and is rejected with ERR_CAMPAIGN_WINDOW_OVERLAP, while a
          start one second later is allowed. Opposite adjacency treatment from the
          half-open WorkRestriction rule, on a different resource entity.
        test_recipe:
          setup:
            - "Campaign C1 INFLUENZA window [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z] exists (PLANNED)"
          setup_api_calls:
            - call: "POST /employee-health/vaccination-campaigns"
              payload: { vaccine_type: "INFLUENZA", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z", department_scope: ["ALL"] }
              as: ComplianceOfficer
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /employee-health/vaccination-campaigns"
              payload: { vaccine_type: "INFLUENZA", window_start: "2026-09-30T23:59:59Z", window_end: "2026-10-31T23:59:59Z", department_scope: ["ALL"] }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /employee-health/vaccination-campaigns"
              payload: { vaccine_type: "INFLUENZA", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", department_scope: ["ALL"] }
              as: ComplianceOfficer
              captures: { c3_id: $.data.id }
          assert:
            - "Touching create (start == C1.window_end): error_id == ERR_CAMPAIGN_WINDOW_OVERLAP (closed interval — endpoints belong to both windows)"
            - "Disjoint create one second later succeeded: VaccinationCampaign.${c3_id} exists PLANNED"
            - "VaccinationCampaign.${c1_id}.status remains PLANNED, unaffected"

  - rule_id: compensating_invariant
    instances:
      - name: hold_apply_release_conserves_count
        grounds:
          - calculations.compliance_posture_derivation
          - state_machines.ComplianceHold.ACTIVE_to_RELEASED
          - state_machines.Employee.ACTIVE_to_SUSPENDED
          - state_machines.Employee.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: Employee.active_hold_count, pinned as
          count(ComplianceHold rows of the employee with status ACTIVE). A hold-apply
          (via overdue cascade) paired with its compensating release returns the count to
          its pre-apply value 0 and restores status ACTIVE / posture CLEAR with zero drift.
        test_recipe:
          setup:
            - "Employee E1 ACTIVE with active_hold_count == 0, status ACTIVE, posture CLEAR; CALENDAR_YEAR 2025 cycle created (due 2025-12-31T23:59:59Z)"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CI1", full_name: "Con Serve", job_category: "NURSE", department: "MED", hire_date: "2024-06-01T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2025, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/employees/${emp_id}"
              as: ComplianceOfficer
              captures: { mid_status: $.data.status, mid_holds: $.data.active_hold_count, mid_posture: $.data.compliance_posture }
            - call: "POST /employee-health/annual-requirement-cycles/${cyc_id}/completions"
              payload: { requirement_type: "TB_SCREENING", completed_at: "2026-08-01T00:00:01Z" }
              as: EmployeeHealthNurse
            - call: "GET /employee-health/compliance-holds"
              payload: { employee_id: "${emp_id}", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { hold_id: "$.data[0].id" }
            - call: "POST /employee-health/compliance-holds/${hold_id}/release"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /employee-health/employees/${emp_id}"
              as: ComplianceOfficer
              captures: { end_status: $.data.status, end_holds: $.data.active_hold_count, end_posture: $.data.compliance_posture }
          assert:
            - "Mid-pair: ${mid_holds} == 1, ${mid_status} == SUSPENDED, ${mid_posture} == ON_HOLD (forward action)"
            - "Post-pair: ${end_holds} == 0, ${end_status} == ACTIVE, ${end_posture} == CLEAR (compensating release)"
            - "Invariant: active_hold_count(0 before) == active_hold_count(0 after); ComplianceHold.${hold_id}.status == RELEASED with released_at set"

      - name: restriction_create_lift_conserves_count
        grounds:
          - calculations.compliance_posture_derivation
          - state_machines.WorkRestriction
          - state_machines.ReturnToWorkClearance.PENDING_to_CLEARED
        distinguishing_aspect: |
          Conserved quantity (distinct from hold count): Employee.open_restriction_count,
          pinned as count(WorkRestriction rows of the employee with status ACTIVE). A
          restriction-create paired with its compensating clearance-CLEARED lift returns
          the count to 0 and posture to CLEAR.
        test_recipe:
          setup:
            - "Employee E1 ACTIVE with open_restriction_count == 0 and posture CLEAR"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CI2", full_name: "Lift Pair", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/work-restrictions"
              payload: { restriction_type: "NO_PATIENT_CONTACT", start_date: "2026-08-02T00:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { wr_id: $.data.id }
            - call: "GET /employee-health/employees/${emp_id}"
              as: EmployeeHealthPhysician
              captures: { mid_count: $.data.open_restriction_count, mid_posture: $.data.compliance_posture }
            - call: "POST /employee-health/work-restrictions/${wr_id}/clearances"
              payload: {}
              as: EmployeeHealthNurse
              captures: { clr_id: $.data.id }
            - call: "POST /employee-health/return-to-work-clearances/${clr_id}/decide"
              payload: { outcome: "CLEARED", decision_note: "fit for full duty" }
              as: EmployeeHealthPhysician
            - call: "GET /employee-health/employees/${emp_id}"
              as: EmployeeHealthPhysician
              captures: { end_count: $.data.open_restriction_count, end_posture: $.data.compliance_posture }
          assert:
            - "Mid-pair: ${mid_count} == 1 and ${mid_posture} == RESTRICTED_DUTY (forward action)"
            - "Post-pair: ${end_count} == 0 and ${end_posture} == CLEAR; WorkRestriction.${wr_id}.status == LIFTED"
            - "Invariant: open_restriction_count(0 before) == open_restriction_count(0 after); ReturnToWorkClearance.${clr_id}.status == CLEARED with decided_by_user_id set"
