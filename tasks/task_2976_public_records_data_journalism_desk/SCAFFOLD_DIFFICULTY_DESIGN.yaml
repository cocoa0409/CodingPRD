      - name: analysis_run_parallel_review_and_allocation_dimensions
        grounds:
          - state_machines.AnalysisRun.parallel_dimensions
          - entities.AnalysisRun.fields.code_review_status
          - entities.AnalysisRun.fields.cost_allocation_status
          - entities.AnalysisRun.fields.review_cycle_count
          - calculations.investigation_analysis_readiness
        distinguishing_aspect: |
          AnalysisRun is not a single-token machine: code_review_status and cost_allocation_status are
          independent dimensions on the same row, and code_review_status is itself cyclic
          (PENDING_REVIEW -> CHANGES_REQUESTED -> APPROVED). Driving the review dimension twice leaves
          the allocation dimension untouched (allocated_total_cents still 0) and then allocating leaves
          the review dimension untouched, so neither dimension can be inferred from the other and the
          combined state (APPROVED, ALLOCATED) is only reachable by exercising both.
