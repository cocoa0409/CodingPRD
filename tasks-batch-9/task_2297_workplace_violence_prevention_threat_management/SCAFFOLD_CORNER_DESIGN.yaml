          - errors[ERR_ESCORT_NOT_QUALIFIED]
          - validations[priority=22]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / security_escort_rejected_when_required_training_assignment_expired
          rationale: "The 1.8 instance already triggers ERR_ESCORT_NOT_QUALIFIED by letting the escort-required TrainingAssignment lapse to EXPIRED in the ops run while the escort Employee row itself is untouched, and contrasts it with the accepted call before the lapse."
      - name: adverse_measure_on_a_retaliation_claimant_returns_anti_retaliation_hold
        claim_type: triggerable
        grounds:
          - errors[ERR_ANTI_RETALIATION_HOLD]
          - validations[priority=20]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / anti_retaliation_hold_outranks_protection_window_rule
          rationale: "The 1.8 instance already triggers ERR_ANTI_RETALIATION_HOLD on a SCHEDULE_CHANGE naming the retaliation claimant and shows it winning over the protection-window rule."
      - name: measure_against_a_frozen_plan_returns_plan_posture_frozen
        claim_type: triggerable
        grounds:
          - errors[ERR_PLAN_POSTURE_FROZEN]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_action_rejected_while_governing_prevention_plan_is_frozen
          rationale: "The 1.8 instance already triggers ERR_PLAN_POSTURE_FROZEN from a case in a legal state whose governing plan was pushed to SUPERSEDED, and shows the same call succeeding once a plan with a non-FROZEN posture governs the case."
      - name: overlapping_escort_windows_return_escort_double_booked
        claim_type: triggerable
        grounds:
          - errors[ERR_ESCORT_DOUBLE_BOOKED]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / escort_double_booking_blocked_by_thirty_minute_symmetric_buffer
          rationale: "The 1.8 instance already triggers ERR_ESCORT_DOUBLE_BOOKED across two cases sharing one escort, including the touching-endpoints request that conflicts only because of the 30-minute buffer."
      - name: too_many_overlapping_restrictions_return_area_restriction_capacity
        claim_type: triggerable
        grounds:
          - errors[ERR_AREA_RESTRICTION_CAPACITY]
          - validations[priority=47]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / work_area_restriction_aggregate_cap_with_unbuffered_half_open_overlap
          rationale: "The 1.8 instance already triggers ERR_AREA_RESTRICTION_CAPACITY at the max(1, floor(occupancy_cap * 0.25)) ceiling and shows the half-open adjacent interval being accepted."
