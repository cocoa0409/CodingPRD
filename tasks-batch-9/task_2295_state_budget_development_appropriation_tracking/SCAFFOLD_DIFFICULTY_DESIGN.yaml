  - rule_id: cross_entity_state_dependency
    instances:
      - name: allotment_prepare_gated_by_owning_appropriation_cash_status
        grounds:
          - state_machines.Allotment.DRAFT_to_PREPARED
          - state_machines.Appropriation.CASH_UNRELEASED_to_CASH_FROZEN
