      - call: POST /produce/supply-lots/${b_fd1}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${b3v_fd1}
        as: PlatformAdmin
      - call: POST /produce/supply-lots/${b_fd2}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${b3v_fd2}
        as: PlatformAdmin
      - call: POST /produce/supply-lots/${b_fb1}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${b3v_fb1}
        as: PlatformAdmin
      - call: POST /produce/supply-lots/${b_fb2}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${b3v_fb2}
        as: PlatformAdmin
      - call: POST /produce/supply-lots/${b_lot_neg}/make-ready
        payload:
