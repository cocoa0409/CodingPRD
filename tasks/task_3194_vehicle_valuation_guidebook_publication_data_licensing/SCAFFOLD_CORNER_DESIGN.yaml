          assert:
            - "fund_err == ERR_INVALID_FUNDING_SOURCE"

      - name: duplicate_open_dispute_rejected
        claim_type: aggregate_validation
        grounds: [validations.priority=16, errors.ERR_DUPLICATE_DISPUTE]
        distinguishing_aspect: "Covered as the referential half of the §1.8 priority-pair instance."
        excluded_because:
          difficulty_instance: temporal_before_referential_on_expired_redeemed_offer
          rationale: "The second-dispute rejection (ERR_DUPLICATE_DISPUTE) is the asserted failure there."

      - name: offer_expiry_blocks_inspect
        claim_type: temporal_validation
        grounds: [validations.priority=10, errors.ERR_OFFER_EXPIRED]
        distinguishing_aspect: "Advancing the clock past expires_at auto-transitions the QUOTED offer to EXPIRED; a subsequent inspect is rejected (state EXPIRED -> ERR_INVALID_STATE; a fresh offer inspected at a clock past its own expires_at yields ERR_OFFER_EXPIRED)."
