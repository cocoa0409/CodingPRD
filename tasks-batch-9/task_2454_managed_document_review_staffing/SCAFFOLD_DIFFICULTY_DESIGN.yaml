# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2454 — Managed Document Review Staffing
#
# Fixture conventions shared by every instance below (YAML anchors are defined
# on first use and aliased afterwards; the ladder always starts from empty-DB):
#   clock default / explicit set .... 2026-08-01T00:00:00Z
#   Client ......................... "Northwind Industries, Inc." (NY)
#   Matter ......................... 600 documents, deadline 2026-09-30T00:00:00Z,
#                                    COMPLEX, per_document_rate_cents 150,
#                                    hourly_rate_cents 6500, budget_cap_cents 600000,
#                                    min_staffed_reviewers 1, onsite_seat_count 2,
#                                    remote_work_permitted true
#   Protocol ....................... qc_sample_pct 0.10, privilege_sample_pct 0.20,
#                                    max_discrepancy_pct 0.05, min_pace_dph 55,
#                                    second_level_required false
#   Reviewer A ("Ada Ishikawa") .... NY, ["EN","JA"], ["ANTITRUST"], FIRST_PASS,
#                                    hourly_cost_cents 5200, max_concurrent_batches 2,
#                                    remote_work_authorized false
#   Reviewer A effective FIRST_PASS rate = round_half_up(150 * 1.35 * 1.05) = 213 c/doc
#   Contract-only rate (no language premium) = round_half_up(150 * 1.35) = 203 c/doc
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: spend_projection_remaining_work_vs_ledger_replay
        grounds:
          - calculations.matter_spend_projection
          - entities.Matter.fields.committed_spend_cents
          - entities.BudgetLedgerEntry.fields.entry_type
          - endpoints[GET /matters/{id}/spend-projection]
        distinguishing_aspect: "Divergence is driven by RATE BASIS and WORK DIRECTION: REMAINING_WORK_BASIS prices only uncoded documents at the 203 c/doc contract rate with the reviewer language premium deliberately excluded, while LEDGER_REPLAY_BASIS sums the committed ledger at the reviewer's 213 c/doc effective rate — 71050 vs 85200 on identical data."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Client and one Matter (600 documents, COMPLEX, PER_DOCUMENT at 150 c/doc, budget cap 600000, min_staffed_reviewers 1)"
            - "one APPROVED ReviewProtocol (min_pace_dph 55, second_level_required false)"
            - "Reviewer A VERIFIED, screening CLEARED, agreement EXECUTED, so the Matter is IN_REVIEW with staffed_reviewer_count 1"
            - "Batch 1 holds 400 documents and is IN_PROGRESS with Assignment a1 at documents_coded 250"
            - "Batch 2 holds the remaining 200 documents and is still CREATED, so unbatched_document_count is 0"
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EngagementManager
            - &k_client
              call: "POST /clients"
              payload: { legal_name: "Northwind Industries, Inc.", primary_state: "NY" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - &k_matter
              call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Second Request"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "COMPLEX"
                required_languages: ["EN", "JA"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                hourly_rate_cents: 6500
                budget_cap_cents: 600000
                min_staffed_reviewers: 1
                onsite_seat_count: 2
                remote_work_permitted: true
              as: EngagementManager
              captures: { m_id: $.data.id, m_v1: $.data.version }
            - &k_proto
              call: "POST /matters/${m_id}/protocols"
              payload:
                expected_matter_version: "${m_v1}"
                issue_codes: ["RESPONSIVE", "NOT_RESPONSIVE", "PRIVILEGED", "HOT"]
                privilege_criteria: ["ATTORNEY_CLIENT", "WORK_PRODUCT"]
                qc_sample_pct: 0.10
                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: false
              as: EngagementManager
              captures: { p_id: $.data.id }
            - &k_proto_submit
              call: "POST /protocols/${p_id}/submit"
              payload: {}
              as: EngagementManager
            - &k_proto_approve
              call: "POST /protocols/${p_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientCounsel
              as_user_id: "${cl_id}"
            - &k_rev_a
              call: "POST /reviewers"
              payload:
                full_name: "Ada Ishikawa"
                bar_admissions: ["NY"]
                languages: ["EN", "JA"]
                subject_matter_tags: ["ANTITRUST"]
                tier: "FIRST_PASS"
                hourly_cost_cents: 5200
                max_concurrent_batches: 2
                remote_work_authorized: false
              as: StaffingCoordinator
              captures: { ra_id: $.data.id }
            - &k_rev_a_verify
              call: "POST /reviewers/${ra_id}/credential-status"
              payload: { to_status: "VERIFIED", bar_admissions: ["NY"] }
              as: StaffingCoordinator
            - &k_screen_a
              call: "POST /conflicts-screenings"
              payload: { reviewer_id: "${ra_id}", matter_id: "${m_id}", declared_adverse_parties: [] }
              as: StaffingCoordinator
              captures: { sa_id: $.data.id }
            - &k_screen_a_clear
              call: "POST /conflicts-screenings/${sa_id}/decision"
              payload: { outcome: "CLEARED", decision_note: "no adverse party overlap" }
              as: StaffingCoordinator
            - &k_ca_a
              call: "POST /confidentiality-agreements"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                coverage_start_utc: "2026-08-01T00:00:00Z"
                coverage_end_utc: "2026-10-31T00:00:00Z"
                remote_work_addendum: false
              as: StaffingCoordinator
              captures: { caa_id: $.data.id }
            - &k_ca_a_exec
              call: "POST /confidentiality-agreements/${caa_id}/execute"
              payload: { signature_name: "Ada Ishikawa" }
              as: Reviewer
              as_user_id: "${ra_id}"
            - &k_sess_a
              call: "POST /sessions"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                workstation_class: "ONSITE_SECURE"
                starts_at_utc: "2026-08-01T00:00:00Z"
                ends_at_utc: "2026-08-31T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { sesa_id: $.data.id }
            - &k_sess_a_active
              call: "POST /sessions/${sesa_id}/lifecycle"
              payload: { to_status: "ACTIVE" }
              as: Reviewer
              as_user_id: "${ra_id}"
            - &k_batch1
              call: "POST /matters/${m_id}/batches"
              payload: { document_count: 400, priority_rank: 5 }
              as: EngagementManager
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - &k_assign_a1
              call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a1_id: $.data.id }
            - &k_start_a1
              call: "POST /assignments/${a1_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 250, minutes_logged: 270, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 200, priority_rank: 5 }
              as: EngagementManager
              captures: { b2_id: $.data.id }
          trigger:
            - call: "GET /matters/${m_id}/spend-projection"
              payload: {}
              as: EngagementManager
              captures: { rw: $.data.remaining_work_basis_cents, lr: $.data.ledger_replay_basis_cents }
          assert:
            - "response.data.basis_applied == \"REMAINING_WORK_BASIS\" because the Matter is IN_REVIEW"
            - "response.data.remaining_work_basis_cents == 71050 (203 * (150 uncoded + 200 unassigned + 0 unbatched))"
            - "response.data.ledger_replay_basis_cents == 85200 (the single COMMITMENT row at the reviewer's 213 c/doc effective rate)"
            - "response.data.variance_cents == -14150"
            - "response.data.gross_billable_cents == 0 and response.data.invoice_total_cents == 0 because no Assignment has reached SUBMITTED"
            - "response.data.budget_headroom_cents == 528950 (600000 - 71050, measured against basis_applied)"
            - "Matter.${m_id}.committed_spend_cents == 85200"

      - name: reviewer_accuracy_sample_weighted_vs_assignment_mean
        grounds:
          - calculations.reviewer_accuracy_score
          - calculations.qc_sample_evaluation
          - entities.Reviewer.fields.accuracy_score
          - entities.QCSample.fields.sampled_document_count
        distinguishing_aspect: "Divergence is driven by AGGREGATION WEIGHT over the same two QC samples, not by rate basis: SAMPLE_WEIGHTED pools 1 error over 60 sampled documents (0.9833) while ASSIGNMENT_MEAN averages 0.9750 and 1.0000 per batch (0.9875)."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter of instance spend_projection_remaining_work_vs_ledger_replay"
            - "Batch 1 (400 documents) coded and submitted by Reviewer A, QC sampled at 40 documents with 1 coding error -> PASSED"
            - "Batch 2 (200 documents) coded and submitted by Reviewer A, QC sampled at 20 documents with 0 errors -> PASSED"
            - "Reviewer C exists purely as the QC validator and holds no Assignment on either batch"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
            - *k_start_a1
            - &k_progress_a1_full
              call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 400, minutes_logged: 420, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - &k_submit_a1
              call: "POST /assignments/${a1_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - &k_rev_c
              call: "POST /reviewers"
              payload:
                full_name: "Cleo Marchetti"
                bar_admissions: ["NY"]
                languages: ["EN"]
                subject_matter_tags: ["QC"]
                tier: "SECOND_LEVEL"
                hourly_cost_cents: 8800
                max_concurrent_batches: 1
                remote_work_authorized: false
              as: StaffingCoordinator
              captures: { rc_id: $.data.id }
            - call: "POST /batches/${b1_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { s1_id: $.data.id, s1_size: $.data.sampled_document_count }
            - call: "POST /qc-samples/${s1_id}/validate"
              payload: { coding_error_count: 1, privilege_error_count: 0 }
              as: QCLead
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 200, priority_rank: 5 }
              as: EngagementManager
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /batches/${b2_id}/assignments"
              payload: { expected_batch_version: "${b2_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /assignments/${a2_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a2_id}/progress"
              payload: { documents_coded: 200, minutes_logged: 210, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a2_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /batches/${b2_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { s2_id: $.data.id }
            - call: "POST /qc-samples/${s2_id}/validate"
              payload: { coding_error_count: 0, privilege_error_count: 0 }
              as: QCLead
          trigger:
            - call: "GET /reviewers/${ra_id}/scorecard"
              payload: {}
              as: StaffingCoordinator
              captures: { acc_weighted: $.data.accuracy_score }
            - call: "GET /reviewers/${ra_id}/scorecard"
              payload: { weighting: "ASSIGNMENT_MEAN" }
              as: StaffingCoordinator
              captures: { acc_mean: $.data.accuracy_score }
          assert:
            - "QCSample.${s1_id}.sampled_document_count == 40 and QCSample.${s2_id}.sampled_document_count == 20"
            - "first response: data.weighting_applied == \"SAMPLE_WEIGHTED\" and data.accuracy_score == 0.9833"
            - "second response: data.weighting_applied == \"ASSIGNMENT_MEAN\" and data.accuracy_score == 0.9875"
            - "first response: data.sampled_document_count == 60 and data.total_error_count == 1"
            - "Reviewer.${ra_id}.accuracy_score == 0.9833 — the stored field always uses SAMPLE_WEIGHTED"
            - "Reviewer.${ra_id}.scorecard_strikes == 0 — the zero-error second sample credits -1 but the running total floors at 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_document_rate_rounded_before_multiplication_mode_b
        grounds:
          - calculations.assignment_billable_amount
          - entities.Assignment.fields.effective_per_document_cents
          - entities.Assignment.fields.billable_amount_cents
          - entities.BudgetLedgerEntry.fields.entry_type
        distinguishing_aspect: "MODE B — the pinned operation order is rounding position: rounding the 212.625 c/doc rate to 213 BEFORE multiplying by 400 documents yields 85200, whereas multiplying first and rounding the product yields 85050, a 150-cent divergence."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter with Batch 1 at 400 documents"
            - "Assignment a1 is IN_PROGRESS with documents_coded 400 and minutes_logged 420"
            - "Reviewer A shares exactly one non-English required language (JA) with the matter, so the language factor is 1.05"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
            - *k_start_a1
            - *k_progress_a1_full
          trigger:
            - call: "POST /assignments/${a1_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
          assert:
            - "Assignment.${a1_id}.effective_per_document_cents == 213"
            - "Assignment.${a1_id}.billable_amount_cents == 85200 (NOT 85050, which is the product-then-round order)"
            - "Assignment.${a1_id}.committed_amount_cents == 85200"
            - "Assignment.${a1_id}.pace_dph == 57.14 so no PACE_SHORTFALL ScorecardEvent is appended"
            - "GET /assignments/${a1_id}/budget-ledger returns exactly 3 rows: COMMITMENT +85200, REVERSAL -85200, ACTUAL_PER_DOCUMENT +85200"
            - "Matter.${m_id}.committed_spend_cents == 85200"
            - "Batch.${b1_id}.status == QC_SAMPLING because the APPROVED protocol has second_level_required false"

      - name: invoice_waterfall_band_selected_after_surcharge_mode_c
        grounds:
          - calculations.matter_invoice_total
          - calculations.assignment_billable_amount
          - endpoints[GET /matters/{id}/spend-projection]
        distinguishing_aspect: "MODE C — four pinned steps consumed in order: the 3% volume band is selected from the post-surcharge provisional total 100809, not from the 98832 gross (which bands at 0%) and not re-selected from the 97785 result (which also bands at 0%)."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter"
            - "Batch 1 (400 documents) and Batch 2 (64 documents) both coded and SUBMITTED by Reviewer A at 213 c/doc"
            - "gross billable is 98832, which sits just below the 100000 first discount band"
            - "136 documents remain unbatched"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
            - *k_start_a1
            - *k_progress_a1_full
            - *k_submit_a1
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 64, priority_rank: 5 }
              as: EngagementManager
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /batches/${b2_id}/assignments"
              payload: { expected_batch_version: "${b2_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /assignments/${a2_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a2_id}/progress"
              payload: { documents_coded: 64, minutes_logged: 60, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a2_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
          trigger:
            - call: "GET /matters/${m_id}/spend-projection"
              payload: { basis: "LEDGER_REPLAY_BASIS" }
              as: EngagementManager
              captures: { inv: $.data.invoice_total_cents }
          assert:
            - "response.data.gross_billable_cents == 98832 (85200 + 13632)"
            - "response.data.qc_surcharge_cents == 1977 (round_half_up(98832 * 0.10 * 0.20))"
            - "response.data.provisional_total_cents == 100809"
            - "response.data.volume_discount_pct == 0.03 — selected from 100809, not from the 98832 gross"
            - "response.data.volume_discount_cents == 3024"
            - "response.data.invoice_total_cents == 97785 (NOT 100809, which is what both the band-from-gross and the re-band-after-discount orders produce)"
            - "response.data.basis_applied == \"LEDGER_REPLAY_BASIS\" and response.data.ledger_replay_basis_cents == 98832"
            - "response.data.remaining_work_basis_cents == 27608 (203 * 136 unbatched documents)"
            - "response.data.variance_cents == -71224"

      - name: auto_assign_tie_break_chain_mode_a
        grounds:
          - calculations.reviewer_selection_rank
          - concurrency_rules[auto-assign-stale-batch]
          - entities.Reviewer.fields.hourly_cost_cents
          - validations[priority=36]
        distinguishing_aspect: "MODE A — the combinatorial content is ORDERING, not arithmetic: two reviewers tie at score 0.7000 and at capacity_headroom 2, so the third tie-break key (hourly_cost_cents ASC) decides and 5200 beats 7400; no id or insertion order participates."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter with Batch 1 (400 documents) still CREATED and unassigned"
            - "Reviewer A (hourly_cost_cents 5200) and Reviewer D (hourly_cost_cents 7400) are both VERIFIED, CLEARED and EXECUTED on the matter"
            - "both are FIRST_PASS tier with bar_admissions [NY], languages [EN, JA] and subject_matter_tags [ANTITRUST], accuracy 1.0000, pace 0.00 and 0 strikes"
            - "both have max_concurrent_batches 2 and zero active assignments"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - call: "POST /reviewers"
              payload:
                full_name: "Dana Okafor"
                bar_admissions: ["NY"]
                languages: ["EN", "JA"]
                subject_matter_tags: ["ANTITRUST"]
                tier: "FIRST_PASS"
                hourly_cost_cents: 7400
                max_concurrent_batches: 2
                remote_work_authorized: false
              as: StaffingCoordinator
              captures: { rd_id: $.data.id }
            - call: "POST /reviewers/${rd_id}/credential-status"
              payload: { to_status: "VERIFIED", bar_admissions: ["NY"] }
              as: StaffingCoordinator
            - call: "POST /conflicts-screenings"
              payload: { reviewer_id: "${rd_id}", matter_id: "${m_id}", declared_adverse_parties: [] }
              as: StaffingCoordinator
              captures: { sd_id: $.data.id }
            - call: "POST /conflicts-screenings/${sd_id}/decision"
              payload: { outcome: "CLEARED", decision_note: "no adverse party overlap" }
              as: StaffingCoordinator
            - call: "POST /confidentiality-agreements"
              payload:
                reviewer_id: "${rd_id}"
                matter_id: "${m_id}"
                coverage_start_utc: "2026-08-01T00:00:00Z"
                coverage_end_utc: "2026-10-31T00:00:00Z"
                remote_work_addendum: false
              as: StaffingCoordinator
              captures: { cad_id: $.data.id }
            - call: "POST /confidentiality-agreements/${cad_id}/execute"
              payload: { signature_name: "Dana Okafor" }
              as: Reviewer
              as_user_id: "${rd_id}"
            - *k_batch1
          trigger:
            - call: "GET /batches/${b1_id}"
              payload: {}
              as: StaffingCoordinator
              captures: { b1_v_fresh: $.data.version }
            - call: "POST /batches/${b1_id}/auto-assign"
              payload: { expected_batch_version: "${b1_v_fresh}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { auto_a_id: $.data.id, auto_rev: $.data.reviewer_id }
          assert:
            - "response.data.reviewer_id == ${ra_id} — Reviewer A wins on hourly_cost_cents 5200 < 7400 after the score and headroom keys tie"
            - "both candidates scored 0.7000 = 0.45*1.0000 + 0.30*0 + 0.15*(2/2) + 0.10*(1/1) - 0"
            - "response.data.effective_per_document_cents == 213 and response.data.committed_amount_cents == 85200"
            - "Reviewer.${rd_id}.engagement_status == CLEARED — the loser is not engaged"
            - "Reviewer.${ra_id}.engagement_status == ENGAGED"
            - "Batch.${b1_id}.status == ASSIGNED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_rework_cycle_is_non_billable
        grounds:
          - state_machines.Assignment.SUBMITTED_to_REOPENED
          - state_machines.Assignment.REOPENED_to_IN_PROGRESS
          - state_machines.Batch.QC_FAILED_to_IN_PROGRESS
          - calculations.assignment_billable_amount
        distinguishing_aspect: "This is the CYCLE shape: SUBMITTED -> REOPENED -> IN_PROGRESS -> SUBMITTED returns the row to a state it already occupied, and the second pass through the submit edge deliberately fires a STRICT SUBSET of the first pass's side effects — no ACTUAL_* ledger row is appended."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter with Batch 1 (400 documents) coded and SUBMITTED by Reviewer A, billed at 85200"
            - "the QC sample of 40 documents was validated with 3 coding errors, so discrepancy_rate is 0.0750 and the batch is QC_FAILED"
