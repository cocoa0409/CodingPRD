            - call: "GET /registry/match-candidates/${mc_d5}/typing-requests"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { d5_ct_status: "$.data[0].status", d5_ct_expired: "$.data[0].expired_by_sweep_at" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc0_status: "$.data[0].status", mc0_role: "$.data[0].candidate_role", mc0_attempts: "$.data[0].ct_attempt_count", mc1_status: "$.data[1].status", mc1_role: "$.data[1].candidate_role", mc1_attempts: "$.data[1].ct_attempt_count" }
            - call: "POST /registry/search-requests/${sr_id}/deadline-sweep"
              payload: {}
              as: RegistryOperations
