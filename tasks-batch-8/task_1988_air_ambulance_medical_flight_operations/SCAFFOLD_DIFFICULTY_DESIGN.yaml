        distinguishing_aspect: |
          Depth-3 chain from a different trigger (qa-review, not divert): the
          FLAGGED review adds 5 points to the author (hop 1) -> the rolling
          total reaching exactly 15 flips the author to REMEDIATION_HOLD
          (hop 2, caused by hop 1's accumulation crossing the >= 15 threshold)
          -> the hold releases the author's ASSIGNED CrewAssignment on a
          separate PLANNING mission (hop 3, caused by hop 2).
