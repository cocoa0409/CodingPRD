    input: []
    output: ImpactAssessment
    side_effects: []

  - method: POST
    path: "/v1/impact-assessments/{assessmentId}/price"
    description: "ESTIMATED -> PRICED: tier selection by spent-before, FINAL delta, reserve against contingency"
    roles: [ProjectEngineer]
    code: 200
    input: [sub_quote_cents]
    output: ImpactAssessment
    side_effects: ["contingency_reserved_cents += final_delta_cents", "project.version += 1", "priced_by_user_id recorded", "increments ImpactAssessment.version by 1"]

  - method: POST
    path: "/v1/impact-assessments/{assessmentId}/reprice"
    description: "DISPUTED -> PRICED with a new quote; adjusts reservation by the delta difference"
    roles: [ProjectEngineer]
    code: 200
    input: [sub_quote_cents]
    output: ImpactAssessment
    side_effects: ["reservation adjusted by (new - old) final delta", "project.version += 1", "price_cycle += 1", "increments ImpactAssessment.version by 1"]

  - method: POST
    path: "/v1/impact-assessments/{assessmentId}/accept"
    description: "PRICED -> ACCEPTED (SoD enforced); converts reservation to spent; fires the schedule cascade when the source RFI flags schedule impact"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ImpactAssessment
    side_effects: ["reserved -= delta; spent += delta", "schedule cascade per state machine", "project.version += 1", "increments ImpactAssessment.version by 1"]

  - method: POST
    path: "/v1/impact-assessments/{assessmentId}/waive"
    description: "PRICED -> WAIVED; frees the reservation (compensating action)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ImpactAssessment
    side_effects: ["reserved -= delta", "project.version += 1", "increments ImpactAssessment.version by 1"]

  - method: POST
    path: "/v1/impact-assessments/{assessmentId}/dispute"
    description: "PRICED -> DISPUTED; reservation held"
    roles: [OwnerRep]
    code: 200
    input: []
    output: ImpactAssessment
    side_effects: ["increments ImpactAssessment.version by 1"]

