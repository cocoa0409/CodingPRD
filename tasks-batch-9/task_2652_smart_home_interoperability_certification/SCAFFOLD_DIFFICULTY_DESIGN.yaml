# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2652 - Smart Home Interoperability Certification
# Test targeting index for SCAFFOLD.yaml §1.1-§1.7, cross-referenced against §0.5's nine
# Difficulty Rules. 9 rule_ids x 2 instances = 18 instances.
# Every numeric assert below was executed against the §1.3 formulas and their constants.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: readiness_provisional_vs_final_diverge_on_blocked_lines_and_lateness
        grounds:
          - calculations.certification_readiness_score
          - entities.CertificationSubmission.fields.provisional_readiness_score
          - entities.CertificationSubmission.fields.final_readiness_score
          - entities.TestSession.fields.completed_late
          - endpoints[GET /submissions/{submission_id}/readiness]
        distinguishing_aspect: |
          This dual-variant calculation lives in the CertificationSubmission (certification readiness)
          entity domain, and the two variants diverge on identical stored data because PROVISIONAL
          counts IN_PROGRESS sessions and scores BLOCKED as a pass with timeliness pinned at 1.0000,
          while FINAL counts only COMPLETE sessions and scores BLOCKED as a failure with a lateness
          penalty: 85.00 versus 33.34.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-02T14:00:00Z by the end of setup."
            - "One RATIFIED SB1 specification with three LIGHTING feature sets: CORE_ONOFF (MANDATORY, 20 cases), CORE_DIM (MANDATORY, 10 cases), OPT_SCENE (OPTIONAL, 8 cases)."
            - "One Member in onboarding_state TOOLS_GRANTED with good_standing true and 1000000 cents of purchased credit."
            - "One CertificationSubmission in state IN_REVIEW declaring all three feature codes, certification_fee_cents 165000, plugfest_credit_count 0."
            - "One TestPlan in state IN_EXECUTION with mandatory_case_count 30 and optional_case_count 8."
            - "TestSession A (bench 1) is COMPLETE with completed_late true, carrying CORE_ONOFF=PASS and CORE_DIM=BLOCKED."
            - "TestSession B (bench 2) is IN_PROGRESS, carrying OPT_SCENE=PASS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
              captures: { fs_core_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
              captures: { fs_dim_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "OPT_SCENE", obligation: "OPTIONAL", test_case_count: 8 }
              as: ProgramAdmin
              captures: { fs_scene_id: $.data.id }
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 3, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF", "CORE_DIM", "OPT_SCENE"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:BB:CC:DD" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /submissions/${sub_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
              captures: { sub_v: $.data.version }
            - call: "POST /test-plans"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_v}" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /test-plans/${plan_id}/issue"
              payload: {}
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 2, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /test-laboratories/${lab_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T13:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { sess_a_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 2, window_start: "2026-09-03T09:00:00Z", window_end: "2026-09-03T11:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { sess_b_id: $.data.id }
            - call: "POST /test-sessions/${sess_a_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${sess_a_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_core_id}", outcome: "PASS", evidence_hash: "h-core-1" }, { feature_set_id: "${fs_dim_id}", outcome: "BLOCKED", evidence_hash: "h-dim-1" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T14:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${sess_a_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${sess_b_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${sess_b_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_scene_id}", outcome: "PASS", evidence_hash: "h-scene-1" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
          trigger:
            - call: "GET /submissions/${sub_id}/readiness"
              payload: { variant: "PROVISIONAL" }
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
            - call: "GET /submissions/${sub_id}/readiness"
              payload: { variant: "FINAL" }
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
          assert:
            - "GET /submissions/${sub_id}/readiness with variant PROVISIONAL returns data.score == \"85.00\" (mandatory 50.00 + optional 20.00 + interop 0.00 + timeliness 15.00)"
            - "GET /submissions/${sub_id}/readiness with variant PROVISIONAL returns data.counted_session_count == 2, data.mandatory_passed_cases == 30, data.optional_passed_cases == 8, data.late_session_count == 1"
            - "GET /submissions/${sub_id}/readiness with variant FINAL returns data.score == \"33.34\" (mandatory 33.34 + optional 0.00 + interop 0.00 + timeliness 0.00)"
            - "GET /submissions/${sub_id}/readiness with variant FINAL returns data.counted_session_count == 1, data.mandatory_passed_cases == 20, data.optional_passed_cases == 0, data.late_session_count == 1"
            - "CertificationSubmission.${sub_id}.provisional_readiness_score == 85.00"
            - "CertificationSubmission.${sub_id}.final_readiness_score is null (no conformance decision has been recorded)"
            - "TestSession.${sess_a_id}.completed_late == true and TestSession.${sess_b_id}.state == IN_PROGRESS"

      - name: laboratory_competency_rolling_vs_lifetime_straddle_suspension_threshold
        grounds:
          - calculations.laboratory_competency_score
          - entities.TestLaboratory.fields.competency_score
          - entities.TestLaboratory.fields.competency_variant
          - state_machines.TestLaboratory.AUTHORIZED_to_SUSPENDED
          - endpoints[GET /test-laboratories/{laboratory_id}/competency]
        distinguishing_aspect: |
          This dual-variant calculation lives in the TestLaboratory (accreditation-quality) entity
          domain rather than the submission-readiness domain, and its two variants differ by TIME
          WINDOW rather than by state filtering and outcome grading: on identical stored data
          ROLLING_90D scores 20.00 and suspends the laboratory while LIFETIME scores exactly 70.00 and
          leaves it AUTHORIZED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-30T00:00:00Z at trigger time, so the ROLLING_90D lower bound is 2026-06-01T00:00:00Z."
            - "One RATIFIED SB1 specification with two MANDATORY LIGHTING feature sets (20 and 10 cases)."
            - "One Member in good standing with a CertificationSubmission in state IN_REVIEW and a TestPlan in state ISSUED."
            - "One TestLaboratory with accreditation_status AUTHORIZED and bench_capacity 4."
            - "Three COMPLETE TestSessions of that laboratory: S1 completed 2026-03-01T09:30:00Z on time with 2 result lines and 0 disputed; S2 completed 2026-03-02T09:30:00Z on time with 2 result lines and 0 disputed; S3 completed 2026-08-25T12:00:00Z LATE with 4 result lines of which 2 are disputed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
              captures: { fs_core_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
              captures: { fs_dim_id: $.data.id }
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 3, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF", "CORE_DIM"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:BB:CC:DD" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /submissions/${sub_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
              captures: { sub_v: $.data.version }
            - call: "POST /test-plans"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_v}" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /test-plans/${plan_id}/issue"
              payload: {}
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 4, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /test-laboratories/${lab_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-03-01T09:00:00Z", window_end: "2026-03-01T11:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T11:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-08-25T09:00:00Z", window_end: "2026-08-25T11:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${s1_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s1_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_core_id}", outcome: "PASS", evidence_hash: "s1-core" }, { feature_set_id: "${fs_dim_id}", outcome: "PASS", evidence_hash: "s1-dim" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s1_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${s2_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s2_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_core_id}", outcome: "PASS", evidence_hash: "s2-core" }, { feature_set_id: "${fs_dim_id}", outcome: "PASS", evidence_hash: "s2-dim" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s2_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${s3_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s3_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_core_id}", outcome: "PASS", evidence_hash: "s3-core-a" }, { feature_set_id: "${fs_dim_id}", outcome: "PASS", evidence_hash: "s3-dim-a" }, { feature_set_id: "${fs_core_id}", outcome: "PASS", evidence_hash: "s3-core-b" }, { feature_set_id: "${fs_dim_id}", outcome: "PASS", evidence_hash: "s3-dim-b" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s3_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s3_id}/dispute-line"
              payload: { line_index: 0 }
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
            - call: "POST /test-sessions/${s3_id}/dispute-line"
              payload: { line_index: 1 }
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /test-laboratories/${lab_id}/competency"
              payload: { variant: "ROLLING_90D" }
              as: ProgramAdmin
            - call: "GET /test-laboratories/${lab_id}/competency"
              payload: { variant: "LIFETIME" }
              as: ProgramAdmin
            - call: "POST /test-laboratories/${lab_id}/competency-review"
              payload: { variant: "LIFETIME" }
              as: ProgramAdmin
            - call: "POST /test-laboratories/${lab_id}/competency-review"
              payload: { variant: "ROLLING_90D" }
              as: ProgramAdmin
          assert:
            - "GET /test-laboratories/${lab_id}/competency with variant ROLLING_90D returns data.counted_session_count == 1, data.on_time_ratio == \"0.0000\", data.dispute_free_ratio == \"0.5000\", data.competency_score == \"20.00\""
            - "GET /test-laboratories/${lab_id}/competency with variant LIFETIME returns data.counted_session_count == 3, data.on_time_ratio == \"0.6667\", data.dispute_free_ratio == \"0.7500\", data.competency_score == \"70.00\""
            - "After the LIFETIME competency-review: TestLaboratory.${lab_id}.competency_score == 70.00, competency_variant == LIFETIME, accreditation_status == AUTHORIZED"
            - "After the ROLLING_90D competency-review: TestLaboratory.${lab_id}.competency_score == 20.00, competency_variant == ROLLING_90D, accreditation_status == SUSPENDED"
            - "TestSession.${s3_id}.disputed_line_count == 2 and TestSession.${s3_id}.completed_late == true"
            - "TestSession.${s1_id}.completed_late == false and TestSession.${s2_id}.completed_late == false"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_matrix_five_inputs_interact_multiplicatively_not_additively
        grounds:
          - calculations.submission_certification_fee_cents
          - entities.CertificationSubmission.fields.certification_fee_cents
          - entities.Member.fields.tier
          - endpoints[POST /submissions]
        distinguishing_aspect: |
          MODE (a) - a formula over MORE THAN THREE independent inputs (device_type, declared feature
          count, security_baseline_level, member tier, review_track) whose combination is NON-LINEAR:
          the marginal cost of one extra declared feature is 15750 cents for a PROMOTER-tier submission
          but 21000 cents for an ADOPTER-tier submission on the same specification and track, so the
          five inputs cannot be summed independently.
        test_recipe:
          setup:
            - "One RATIFIED SB3 specification with five THERMOSTAT feature sets: T_CORE (MANDATORY), T_SCHED, T_GEO, T_ECO, T_REMOTE (all OPTIONAL)."
            - "Member M1 with tier PROMOTER and Member M2 with tier ADOPTER; neither needs onboarding because a DRAFT submission does not touch the credit ledger."
            - "Four DRAFT CertificationSubmissions: M1 with 4 codes / EXPEDITED, M1 with 5 codes / EXPEDITED, M2 with 4 codes / EXPEDITED, M2 with 5 codes / EXPEDITED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0-SB3", security_baseline_level: "SB3", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "T_CORE", obligation: "MANDATORY", test_case_count: 12 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "T_SCHED", obligation: "OPTIONAL", test_case_count: 6 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "T_GEO", obligation: "OPTIONAL", test_case_count: 4 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "T_ECO", obligation: "OPTIONAL", test_case_count: 4 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "T_REMOTE", obligation: "OPTIONAL", test_case_count: 8 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Promoter Devices", contact_email: "promoter@acme.test", tier: "PROMOTER" }
              as: ProgramAdmin
              captures: { m_pro_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Adopter Devices", contact_email: "adopter@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m_ado_id: $.data.id }
          trigger:
            - call: "POST /submissions"
              payload: { member_id: "${m_pro_id}", specification_id: "${spec_id}", device_model: "TH-4", device_type: "THERMOSTAT", declared_feature_codes: ["T_CORE", "T_SCHED", "T_GEO", "T_ECO"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "11:11:11:11", review_track: "EXPEDITED" }
              as: Member
              as_user_id: "${m_pro_id}"
              captures: { sub_pro4_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m_pro_id}", specification_id: "${spec_id}", device_model: "TH-5", device_type: "THERMOSTAT", declared_feature_codes: ["T_CORE", "T_SCHED", "T_GEO", "T_ECO", "T_REMOTE"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "11:11:11:12", review_track: "EXPEDITED" }
              as: Member
              as_user_id: "${m_pro_id}"
              captures: { sub_pro5_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m_ado_id}", specification_id: "${spec_id}", device_model: "TH-4A", device_type: "THERMOSTAT", declared_feature_codes: ["T_CORE", "T_SCHED", "T_GEO", "T_ECO"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "22:22:22:21", review_track: "EXPEDITED" }
              as: Member
              as_user_id: "${m_ado_id}"
              captures: { sub_ado4_id: $.data.id }
            - call: "POST /submissions"
