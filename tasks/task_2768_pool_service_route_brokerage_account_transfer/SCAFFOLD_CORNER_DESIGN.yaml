          - "calculations.broker_commission"
          - "calculations.deal_escrow_structure"
          - "calculations.close_disbursement_waterfall"
          - "entities.Deal.fields.commission_cents"
          - "entities.Deal.fields.clawback_cap_cents"
        distinguishing_aspect: "A 2000000 CASH deal lands on the middle commission tier and simultaneously overruns the holdback ceiling, so three constants are pinned in one close: COMMISSION_RATE 0.08 (not the 0.10 the canonical 340000 deal uses and not the 0.06 above 4000000), HOLDBACK_CAP 200000 (15% would be 300000) and MIN_DOWN_PCT[CASH] = 1.0 which forces the whole price down."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; NV StateLicenseProfile (BUSINESS_TAX only, reciprocity [AZ]); ACTIVE seller; APPROVED AZ LICENSED buyer prequalified to 30000000."
            - "NV listing LV-BIG (listed_mrr_cents 20000, asking 2000000) with one account BIG-1 (20000 service, no chemical, no repair, started 2019-03-15), three BANK_VERIFIED months at full collection so it verifies at 20000, and a LISTED_BASIS valuation; the listing is LISTED."
            - "A CASH deal at 2000000 with down_payment_cents 2000000 and note_principal_cents 0 is accepted with retention_guarantee_days 90 -- CASH requires the whole price down."
            - "BUSINESS_TAX is WAIVED on AZ reciprocity, diligence is cleared on the VERIFIED_BASIS valuation, financing is approved for 0 and the escrow is funded to its 2200000 target by escrow-agent-alpha."
