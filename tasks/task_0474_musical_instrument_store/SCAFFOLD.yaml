      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- InventoryUnit.status (allocation quota) --------------------------------
  - entity: InventoryUnit
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: |
      Allocation status. A unit may only be committed to one disposition at a
      time. RESERVED is a soft hold created by POST /units/{id}/reserve and
      consumed by exactly one downstream agreement/layaway. Reserve is the OCC
      guard point (expected_inventory_unit_version).
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /units/{unit_id}/reserve"
        actor: SalesAssociate
        preconditions:
          - "unit.status == AVAILABLE"
          - "payload.expected_inventory_unit_version == unit.version (OCC)"
        side_effects:
          - "Sets reserved_for_customer_id = payload.customer_id (transient hold marker)"
          - "increments InventoryUnit.version by 1"

      - from: RESERVED
        to: ON_RENT
        trigger: "POST /rental-agreements (inventory_unit_id = this unit)"
        actor: SalesAssociate
        preconditions:
          - "unit.status == RESERVED"
          - "unit reserved_for_customer_id == payload.customer_id"
        side_effects:
          - "Snapshots monthly_rate_cents, purchase_price_cents onto the new RentalAgreement"
          - "increments InventoryUnit.version by 1"

      - from: RESERVED
        to: ON_LAYAWAY
        trigger: "POST /layaway-plans (inventory_unit_id = this unit)"
        actor: SalesAssociate
        preconditions:
          - "unit.status == RESERVED"
          - "unit reserved_for_customer_id == payload.customer_id"
        side_effects:
          - "Snapshots total_price_cents onto the new LayawayPlan"
          - "increments InventoryUnit.version by 1"

      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /units/{unit_id}/release"
        actor: SalesAssociate
        preconditions:
          - "unit.status == RESERVED"
        side_effects:
          - "Clears reserved_for_customer_id"
          - "increments InventoryUnit.version by 1"

      - from: ON_RENT
        to: SOLD
        trigger: "system (RentalAgreement BOUGHT_OUT)"
        actor: system
        preconditions:
          - "Triggering RentalAgreement transitioned ACTIVE -> BOUGHT_OUT"
        side_effects:
          - "increments InventoryUnit.version by 1"

      - from: ON_RENT
        to: AVAILABLE
        trigger: "system (RentalAgreement RETURNED)"
        actor: system
        preconditions:
          - "Triggering RentalAgreement transitioned ACTIVE -> RETURNED"
        side_effects:
          - "Clears reserved_for_customer_id"
          - "increments InventoryUnit.version by 1"

      - from: ON_RENT
        to: IN_REPAIR
        trigger: "system (RentalAgreement REPOSSESSED)"
        actor: system
        preconditions:
          - "Triggering RentalAgreement transitioned DEFAULTED -> REPOSSESSED"
        side_effects:
          - "increments InventoryUnit.version by 1"
          - "note: repossessed unit routed to repair/refurbish before resale"

      - from: ON_LAYAWAY
        to: SOLD
        trigger: "system (LayawayPlan COMPLETED)"
        actor: system
        preconditions:
          - "Triggering LayawayPlan transitioned OPEN -> COMPLETED"
        side_effects:
          - "increments InventoryUnit.version by 1"

      - from: ON_LAYAWAY
        to: AVAILABLE
        trigger: "system (LayawayPlan CANCELLED)"
        actor: system
        preconditions:
          - "Triggering LayawayPlan transitioned OPEN -> CANCELLED"
        side_effects:
          - "Clears reserved_for_customer_id"
          - "increments InventoryUnit.version by 1"

      - from: AVAILABLE
        to: IN_REPAIR
        trigger: "POST /repair-tickets (inventory_unit_id = this unit, store-owned)"
        actor: SalesAssociate
        preconditions:
          - "unit.status == AVAILABLE"
        side_effects:
          - "increments InventoryUnit.version by 1"

      - from: IN_REPAIR
        to: AVAILABLE
        trigger: "system (RepairTicket CLOSED or CANCELLED on store-owned unit)"
        actor: system
        preconditions:
          - "Triggering RepairTicket reached CLOSED or CANCELLED and is linked to this unit"
        side_effects:
          - "increments InventoryUnit.version by 1"

      - from: CONSIGNED
        to: SOLD
        trigger: "system (ConsignmentListing SOLD)"
        actor: system
        preconditions:
          - "Triggering ConsignmentListing transitioned LISTED -> SOLD"
        side_effects:
          - "increments InventoryUnit.version by 1"

      - from: CONSIGNED
        to: RETIRED
        trigger: "system (ConsignmentListing WITHDRAWN)"
        actor: system
        preconditions:
          - "Triggering ConsignmentListing transitioned LISTED -> WITHDRAWN"
        side_effects:
          - "increments InventoryUnit.version by 1"
          - "note: instrument returned to consignor, no longer in saleable stock"

  # --- RentalAgreement.status (ledger; branching ACTIVE -> {3 terminals}) -----
  - entity: RentalAgreement
    field: status
    initial_state: ACTIVE
    terminal_states: [BOUGHT_OUT, RETURNED, REPOSSESSED]
    note: |
      Branching fork-join: ACTIVE forks into BOUGHT_OUT (customer pays payoff),
      RETURNED (customer returns unit), or DEFAULTED (missed_streak threshold).
      DEFAULTED is a non-terminal intermediate that converges to REPOSSESSED.
      Each branch carries a distinct side-effect set.
    transitions:
      - from: ACTIVE
        to: BOUGHT_OUT
        trigger: "POST /rental-agreements/{id}/buyout"
        actor: Customer
        preconditions:
          - "agreement.status == ACTIVE"
          - "agreement.plan == RENT_TO_OWN"
          - "payload.expected_agreement_version == agreement.version (OCC)"
          - "payload.amount_cents == agreement.payoff_quote_cents (exact payoff)"
        side_effects:
          - "Appends PaymentRecord{kind=BUYOUT, amount_cents=payoff_quote_cents, status=POSTED}"
          - "InventoryUnit ON_RENT -> SOLD (cascade)"
          - "InventoryUnit.list_price_cents unchanged; unit.version +1"
          - "increments RentalAgreement.version by 1"

      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rental-agreements/{id}/return"
        actor: Customer
        preconditions:
          - "agreement.status == ACTIVE"
          - "no outstanding late_fee_balance_cents > 0 (ERR_OUTSTANDING_LATE_FEES)"
        side_effects:
          - "InventoryUnit ON_RENT -> AVAILABLE (cascade), reserved_for_customer_id cleared"
          - "Accrued equity (RENT_TO_OWN) is forfeited (not refunded)"
          - "increments RentalAgreement.version by 1"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (POST /rental-agreements/{id}/advance-cycle pushes missed_streak >= DEFAULT_THRESHOLD)"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "missed_streak >= DEFAULT_THRESHOLD after the advance"
        side_effects:
          - "Appends PaymentRecord{kind=LATE_FEE, amount_cents=LATE_FEE_CENTS, status=POSTED} for the missed cycle"
          - "increments RentalAgreement.version by 1"

      - from: DEFAULTED
        to: REPOSSESSED
        trigger: "POST /rental-agreements/{id}/repossess"
        actor: StoreManager
        preconditions:
          - "agreement.status == DEFAULTED"
        side_effects:
          - "InventoryUnit ON_RENT -> IN_REPAIR (cascade)"
          - "Accrued equity forfeited; late_fee_balance_cents written off (waived)"
          - "increments RentalAgreement.version by 1"

      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /rental-agreements/{id}/payments (kind RENT clears the streak)"
        actor: Customer
        preconditions:
          - "agreement.status == DEFAULTED"
          - "Payment brings missed_streak below DEFAULT_THRESHOLD"
        side_effects:
          - "Appends PaymentRecord{kind=RENT, status=POSTED}; missed_streak reset to 0"
          - "increments RentalAgreement.version by 1"

  # --- LayawayPlan.status -----------------------------------------------------
  - entity: LayawayPlan
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /layaway-plans/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "plan.status == OPEN"
          - "plan.remaining_cents == 0 (fully paid)"
        side_effects:
          - "InventoryUnit ON_LAYAWAY -> SOLD (cascade)"
          - "increments LayawayPlan.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /layaway-plans/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "plan.status == OPEN"
        side_effects:
          - "InventoryUnit ON_LAYAWAY -> AVAILABLE (cascade)"
          - "Refund = paid_cents - restock_fee; Customer.store_credit_cents += refund (see §1.3 layaway_cancel_refund)"
          - "increments LayawayPlan.version by 1"

  # --- RepairTicket.status ----------------------------------------------------
  - entity: RepairTicket
    field: status
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching: INTAKE forks to IN_PROGRESS or CANCELLED; IN_PROGRESS may detour through AWAITING_PARTS."
    transitions:
      - from: INTAKE
        to: IN_PROGRESS
        trigger: "POST /repair-tickets/{ticket_id}/claim"
        actor: Luthier
        preconditions:
          - "ticket.status == INTAKE"
        side_effects:
          - "Sets assigned_luthier_id = X-User-ID"
          - "increments RepairTicket.version by 1"

      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /repair-tickets/{ticket_id}/await-parts"
        actor: Luthier
        preconditions:
          - "ticket.status == IN_PROGRESS"
          - "X-User-ID == ticket.assigned_luthier_id"
        side_effects:
          - "increments RepairTicket.version by 1"

      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /repair-tickets/{ticket_id}/resume"
        actor: Luthier
        preconditions:
          - "ticket.status == AWAITING_PARTS"
          - "X-User-ID == ticket.assigned_luthier_id"
        side_effects:
          - "increments RepairTicket.version by 1"

      - from: IN_PROGRESS
        to: READY
        trigger: "POST /repair-tickets/{ticket_id}/ready"
        actor: Luthier
        preconditions:
          - "ticket.status == IN_PROGRESS"
          - "X-User-ID == ticket.assigned_luthier_id"
        side_effects:
          - "Freezes quoted_total_cents (final repair invoice)"
          - "increments RepairTicket.version by 1"

      - from: READY
        to: CLOSED
        trigger: "POST /repair-tickets/{ticket_id}/close"
        actor: SalesAssociate
        preconditions:
          - "ticket.status == READY"
        side_effects:
          - "If inventory_unit_id set and store-owned: InventoryUnit IN_REPAIR -> AVAILABLE (cascade)"
          - "increments RepairTicket.version by 1"

      - from: [INTAKE, IN_PROGRESS, AWAITING_PARTS]
        to: CANCELLED
        trigger: "POST /repair-tickets/{ticket_id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "ticket.status in {INTAKE, IN_PROGRESS, AWAITING_PARTS}"
        side_effects:
          - "If inventory_unit_id set and store-owned: InventoryUnit IN_REPAIR -> AVAILABLE (cascade)"
          - "increments RepairTicket.version by 1"

  # --- ConsignmentListing.status ----------------------------------------------
  - entity: ConsignmentListing
    field: status
    initial_state: LISTED
    terminal_states: [SOLD, WITHDRAWN]
    note: |
      Creating a ConsignmentListing mints a CONSIGNED InventoryUnit (1:1 via
      InventoryUnit.consignment_listing_id). Selling triggers a cascade chain:
      listing SOLD -> unit SOLD -> consignor store credit.
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /consignment-listings/{listing_id}/sell"
        actor: SalesAssociate
        preconditions:
          - "listing.status == LISTED"
          - "linked InventoryUnit.status == CONSIGNED"
        side_effects:
          - "Computes consignor_payout_cents (see §1.3 consignment_settlement)"
          - "Consignor (Customer).store_credit_cents += consignor_payout_cents (cascade)"
          - "linked InventoryUnit CONSIGNED -> SOLD (cascade)"
          - "increments ConsignmentListing.version by 1"

      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /consignment-listings/{listing_id}/withdraw"
        actor: SalesAssociate
        preconditions:
          - "listing.status == LISTED"
        side_effects:
          - "linked InventoryUnit CONSIGNED -> RETIRED (cascade)"
          - "increments ConsignmentListing.version by 1"

  # --- TradeIn.status ---------------------------------------------------------
  - entity: TradeIn
    field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /trade-ins/{trade_in_id}/accept"
        actor: StoreManager
        preconditions:
          - "trade_in.status == OFFERED"
        side_effects:
          - "Mints a USED/VINTAGE InventoryUnit (source_kind=TRADE_IN, acquisition_cost_cents=offer_cents, status=AVAILABLE); sets resulting_unit_id"
          - "Customer.store_credit_cents += offer_cents (cascade)"
          - "increments TradeIn.version by 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /trade-ins/{trade_in_id}/decline"
        actor: Customer
        preconditions:
          - "trade_in.status == OFFERED"
        side_effects:
          - "increments TradeIn.version by 1"

  # --- FinancingApplication.status --------------------------------------------
  - entity: FinancingApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, CANCELLED]
    note: "Approval is guarded by the applicant Customer's credit_score (cross-entity dependency)."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{application_id}/approve"
        actor: StoreManager
        preconditions:
          - "application.status == SUBMITTED"
          - "Customer.credit_score >= MIN_FINANCE_SCORE (cross-entity)"
        side_effects:
          - "Computes apr_pct, monthly_payment_cents (see §1.3 financing_terms)"
          - "If special_order_id set: SpecialOrder QUOTED/DEPOSITED -> ORDERED (cascade)"
          - "increments FinancingApplication.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /financing-applications/{application_id}/deny, or system (credit_score < MIN_FINANCE_SCORE on approve attempt)"
        actor: StoreManager
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "increments FinancingApplication.version by 1"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /financing-applications/{application_id}/cancel"
        actor: Customer
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "increments FinancingApplication.version by 1"

  # --- SpecialOrder.status ----------------------------------------------------
  - entity: SpecialOrder
    field: status
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUOTED
        to: DEPOSITED
        trigger: "POST /special-orders/{order_id}/pay-deposit"
        actor: Customer
        preconditions:
          - "order.status == QUOTED"
          - "payload.amount_cents >= required_deposit_cents (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "Sets deposit_paid_cents = payload.amount_cents"
          - "increments SpecialOrder.version by 1"

      - from: DEPOSITED
        to: ORDERED
        trigger: "POST /special-orders/{order_id}/place, or system (financing approved)"
        actor: SalesAssociate
        preconditions:
          - "order.status == DEPOSITED"
        side_effects:
          - "increments SpecialOrder.version by 1"

      - from: ORDERED
        to: ARRIVED
        trigger: "POST /special-orders/{order_id}/receive"
        actor: SalesAssociate
        preconditions:
          - "order.status == ORDERED"
        side_effects:
          - "Mints an InventoryUnit (status=RESERVED, reserved_for_customer_id=customer_id); sets fulfilled_unit_id"
          - "increments SpecialOrder.version by 1"

      - from: ARRIVED
        to: FULFILLED
        trigger: "POST /special-orders/{order_id}/fulfill"
        actor: SalesAssociate
        preconditions:
          - "order.status == ARRIVED"
        side_effects:
          - "fulfilled InventoryUnit RESERVED -> SOLD (cascade)"
          - "increments SpecialOrder.version by 1"

      - from: [QUOTED, DEPOSITED, ORDERED]
        to: CANCELLED
        trigger: "POST /special-orders/{order_id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "order.status in {QUOTED, DEPOSITED, ORDERED}"
        side_effects:
          - "If deposit_paid_cents > 0: Customer.store_credit_cents += deposit_paid_cents (cascade refund)"
          - "increments SpecialOrder.version by 1"

  # --- LessonEnrollment.status ------------------------------------------------
  - entity: LessonEnrollment
    field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    note: "Tuition discount is guarded by the linked RentalAgreement's status (cross-entity dependency)."
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /lesson-enrollments/{enrollment_id}/pause"
        actor: Customer
        preconditions:
          - "enrollment.status == ACTIVE"
        side_effects:
          - "increments LessonEnrollment.version by 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /lesson-enrollments/{enrollment_id}/resume"
        actor: Customer
        preconditions:
          - "enrollment.status == PAUSED"
        side_effects:
          - "Recomputes monthly_tuition_cents (bundle discount may have lapsed if linked agreement no longer ACTIVE)"
          - "increments LessonEnrollment.version by 1"

      - from: [ACTIVE, PAUSED]
        to: ENDED
        trigger: "POST /lesson-enrollments/{enrollment_id}/end"
        actor: Customer
        preconditions:
          - "enrollment.status in {ACTIVE, PAUSED}"
        side_effects:
          - "increments LessonEnrollment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reserve-stale-unit
    parent_entity: InventoryUnit
    write_endpoint: "POST /units/{unit_id}/reserve"
    occ_field: "expected_inventory_unit_version"
    description: |
      Reserving an InventoryUnit whose version has advanced since the client
      last observed it is rejected. This captures the case where the unit was
      already reserved (or otherwise mutated) by another writer after the
      current writer read it; the current writer's view of the unit is stale.
      A second reserve carrying the pre-reserve version is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: buyout-stale-agreement
    parent_entity: RentalAgreement
    write_endpoint: "POST /rental-agreements/{id}/buyout"
    occ_field: "expected_agreement_version"
    description: |
      Buying out a RentalAgreement whose version has advanced since the client
      last computed the payoff quote is rejected. An intervening rent payment or
      late-fee accrual changes accrued_equity_cents (and therefore the payoff),
      so a buyout carrying the pre-payment version operates on a stale quote and
      is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- DUAL-VARIANT pair on RentalAgreement (rule_id: dual_variant_calc #1) ----
  - name: equity_accrual
    trigger: "recomputed on every POSTED RENT PaymentRecord append, on buyout quote read, and on RentalAgreement create"
    algorithm: aggregation
    formula: |
      # Accrued equity = capped running credit from posted rent months.
      raw_equity = round(months_paid * monthly_rate_cents * equity_rate_pct)
      cap = floor(purchase_price_cents * equity_cap_pct)
      accrued_equity_cents = min(raw_equity, cap)
      # months_paid = count(PaymentRecord WHERE kind=RENT AND status=POSTED on agreement)
      # RENTAL plan: equity_rate_pct treated as 0 -> accrued_equity_cents = 0
    input_set: "PaymentRecord rows with kind=RENT and status=POSTED on this agreement only"
    constants: {}
    precision: "integer cents; round_half_up on the per-agreement product, then min() against floor(cap)"

  - name: buyout_payoff
    trigger: "read on GET /rental-agreements/{id}, and validated on POST .../buyout"
    algorithm: forward_looking
    formula: |
      # Early-buyout payoff is a DIFFERENT algorithm over the SAME payment stream
      # than equity_accrual: it is purchase_price minus accrued equity, plus a
      # flat early-buyout fee, plus any unwaived late fees, floored at 0.
      remaining = purchase_price_cents - accrued_equity_cents
      payoff_quote_cents = max(0, remaining + EARLY_BUYOUT_FEE_CENTS + late_fee_balance_cents)
      # RENTAL plan: payoff is undefined (buyout disallowed by state precondition)
    input_set: "accrued_equity_cents (from equity_accrual), late_fee_balance_cents on this agreement"
    constants:
      EARLY_BUYOUT_FEE_CENTS: 5000
    precision: "integer cents; max(0, ...) floor"
    variants:
      - name: equity_view
        when: "GET /rental-agreements/{id} surfaces accrued_equity_cents — equity earned so far"
        difference: "Counts UP from 0 toward the cap; does NOT include the buyout fee or late fees"
      - name: payoff_view
        when: "POST .../buyout requires payload.amount_cents == payoff_quote_cents"
        difference: "Counts DOWN from purchase_price; ADDS EARLY_BUYOUT_FEE_CENTS and late_fee_balance_cents. Same months_paid yields equity != (purchase_price - payoff)."

  # --- DUAL-VARIANT pair on Customer credit (rule_id: dual_variant_calc #2) ----
  - name: tradein_offer
    trigger: "computed on TradeIn create"
    algorithm: tiered_pricing
    formula: |
      # Store-credit offer for a trade-in: condition-tiered fraction of appraised
      # value (store buys low to resell). This is the "trade-in for store credit"
      # algorithm — generous fraction, no resale risk discount.
      pct = TRADEIN_PCT[condition]   # NEW=0.60, USED=0.50, VINTAGE=0.70
      offer_cents = floor(appraised_value_cents * pct)
    input_set: "single TradeIn's appraised_value_cents and condition"
    constants:
      TRADEIN_PCT_NEW: 0.60
      TRADEIN_PCT_USED: 0.50
      TRADEIN_PCT_VINTAGE: 0.70
    precision: "integer cents; floor"

  - name: consignment_settlement
    trigger: "computed on ConsignmentListing LISTED -> SOLD"
    algorithm: aggregation
    formula: |
      # Consignor payout is a DIFFERENT credit algorithm on the SAME Customer
      # store_credit field than tradein_offer: store keeps a commission, consignor
      # gets the remainder of the realized sale price. Counts DOWN from ask_price
      # by commission, where tradein_offer counts UP a fraction of appraised value.
      commission_cents = round(ask_price_cents * commission_pct)
      consignor_payout_cents = ask_price_cents - commission_cents
    input_set: "single ConsignmentListing's ask_price_cents and commission_pct"
    constants: {}
    precision: "integer cents; round_half_up on commission, subtract"
    variants:
      - name: store_credit_via_tradein
        when: "TradeIn ACCEPTED"
        difference: "Customer.store_credit_cents increases by floor(appraised * tier_pct)"
      - name: store_credit_via_consignment
        when: "ConsignmentListing SOLD"
        difference: "Customer.store_credit_cents increases by ask_price - round(ask_price * commission_pct); different conserved-quantity formula on the same field"

  # --- COMBINATORIAL mode (a): >=3 inputs, non-linear ---------------------------
  - name: repair_invoice
    trigger: "recomputed on RepairTicket create and on each field edit; frozen on READY"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (labor_hours, labor_rate_cents, parts_cost_cents) with a
      # non-linear rush branch and a tiered minimum-labor floor.
      labor_cents = round(labor_hours * labor_rate_cents)
      # Minimum bench charge: labor is floored at MIN_BENCH_CENTS regardless of hours
      labor_cents = max(labor_cents, MIN_BENCH_CENTS)
      subtotal = labor_cents + parts_cost_cents
      # Rush surcharge is a percentage of subtotal, NOT of labor alone
      surcharge = RUSH_PCT * subtotal if rush else 0
      quoted_total_cents = round(subtotal + surcharge)
    input_set: "single RepairTicket fields"
    constants:
      MIN_BENCH_CENTS: 4000
      RUSH_PCT: 0.25
    precision: "integer cents; round_half_up on labor product, round_half_up on final total"

  # --- COMBINATORIAL mode (b): nested rounding where order matters --------------
  - name: financing_terms
    trigger: "computed on FinancingApplication SUBMITTED -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      # APR is tiered on the applicant Customer.credit_score. Monthly payment is a
      # standard amortization. ORDER OF ROUNDING IS PINNED: compute the exact
      # monthly_rate as apr_pct/12 (NOT rounded), compute the exact amortized
      # payment, THEN round the FINAL payment to whole cents (round_half_up).
      # Rounding apr_pct/12 first, or rounding an intermediate factor, yields a
      # different cent value — this scaffold pins "round once, at the very end".
      apr_pct = APR_TIER(credit_score)   # >=720 -> 0.0599 ; 660..719 -> 0.1299 ; <660 -> 0.2299
      r = apr_pct / 12.0                 # exact, unrounded
      n = term_months
      if r == 0:
        exact_payment = principal_cents / n
      else:
        exact_payment = principal_cents * r * (1+r)**n / ((1+r)**n - 1)
      monthly_payment_cents = round_half_up(exact_payment)   # round ONCE, at the end
    input_set: "single FinancingApplication.principal_cents, term_months, and applicant Customer.credit_score"
    constants:
      APR_TIER_PRIME: 0.0599
      APR_TIER_NEAR_PRIME: 0.1299
      APR_TIER_SUBPRIME: 0.2299
      SCORE_PRIME_MIN: 720
      SCORE_NEAR_PRIME_MIN: 660
    precision: "round the FINAL amortized payment to whole cents, round_half_up; no intermediate rounding"

  # --- COMBINATORIAL mode (c): explicit evaluation-order dependency -------------
  - name: lesson_tuition
    trigger: "computed on LessonEnrollment create and on resume"
    algorithm: threshold
    formula: |
      # Circular-looking: the bundle discount depends on whether the linked
      # RentalAgreement is ACTIVE, but the tuition tier ALSO depends on
      # sessions_per_month, and the volume discount and bundle discount STACK in
      # a PINNED ORDER: (1) apply volume discount to base monthly first, (2) THEN
      # apply the bundle discount to the volume-discounted amount. Reversing the
      # order changes the cents.
      base_monthly = base_rate_cents * sessions_per_month
      # Step 1 — volume discount tier
      vol_pct = 0.15 if sessions_per_month >= VOLUME_THRESHOLD else 0.0
      after_volume = round(base_monthly * (1 - vol_pct))
      # Step 2 — bundle discount, applied to the already-volume-discounted figure
      bundle_pct = BUNDLE_PCT if (rental_agreement_id is set AND linked RentalAgreement.status == ACTIVE) else 0.0
      monthly_tuition_cents = round(after_volume * (1 - bundle_pct))
    input_set: "single LessonEnrollment fields plus linked RentalAgreement.status"
    constants:
      VOLUME_THRESHOLD: 8
      BUNDLE_PCT: 0.20
    precision: "round_half_up after Step 1, then round_half_up after Step 2 — order pinned: volume THEN bundle"

  # --- Allocation / aggregation helpers ----------------------------------------
  - name: layaway_paid
    trigger: "recomputed on LayawayPayment append and LayawayPlan read"
    algorithm: aggregation
    formula: |
      paid_cents = deposit_cents + sum(LayawayPayment.amount_cents on this plan)
      remaining_cents = max(0, total_price_cents - paid_cents)
    input_set: "all LayawayPayment rows on this plan plus the plan's deposit_cents"
    constants: {}
    precision: "integer cents; remaining floored at 0"

  - name: layaway_cancel_refund
    trigger: "computed on LayawayPlan OPEN -> CANCELLED"
    algorithm: threshold
    formula: |
      restock_fee = round(total_price_cents * restock_fee_pct)
      refund_cents = max(0, paid_cents - restock_fee)
      # refund is credited to Customer.store_credit_cents
    input_set: "this plan's paid_cents, total_price_cents, restock_fee_pct"
    constants: {}
    precision: "integer cents; round_half_up on restock fee; refund floored at 0"

  - name: special_order_deposit
    trigger: "computed on SpecialOrder create"
    algorithm: threshold
    formula: |
      required_deposit_cents = ceil(quoted_price_cents * deposit_pct)
    input_set: "this SpecialOrder.quoted_price_cents and deposit_pct"
    constants: {}
    precision: "integer cents; ceil"

  - name: missed_streak_advance
    trigger: "computed on POST /rental-agreements/{id}/advance-cycle"
    algorithm: chronological
    formula: |
      # Advancing a billing cycle: if the cycle index has no POSTED RENT
      # PaymentRecord, missed_streak increments and a LATE_FEE is posted; if it
      # does, missed_streak resets to 0. Processed strictly by billing_cycle_index
      # ascending; ties broken by PaymentRecord.created_at ascending (never id).
      if exists(PaymentRecord kind=RENT POSTED with billing_cycle_index == cycle):
        missed_streak = 0
      else:
        missed_streak += 1
        append PaymentRecord{kind=LATE_FEE, amount_cents=LATE_FEE_CENTS, status=POSTED}
      late_fee_balance_cents = sum(LATE_FEE amount where status=POSTED) - sum(LATE_FEE amount where status=WAIVED)
    input_set: "PaymentRecord rows on this agreement, ordered by billing_cycle_index ASC then created_at ASC"
    constants:
      LATE_FEE_CENTS: 1500
      DEFAULT_THRESHOLD: 3
    precision: "integer cents; late_fee_balance floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All referenced resources exist (path ids and body FKs), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body FK targets are of the correct entity type and satisfy linkage rules (e.g., reserved_for_customer_id == payload.customer_id on agreement/layaway create)"
    error_id: ERR_RESERVATION_MISMATCH
    http_status: 409
    applies_to: "POST /rental-agreements, POST /layaway-plans"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the resource's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /units/{id}/reserve, POST /rental-agreements/{id}/buyout"

  - priority: 7
    category: business_safety
    check: "Buyout is only valid for RENT_TO_OWN agreements (not plain RENTAL)"
    error_id: ERR_PLAN_NOT_RENT_TO_OWN
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/buyout"

  - priority: 8
    category: business_referential
    check: "Return blocked while late_fee_balance_cents > 0"
    error_id: ERR_OUTSTANDING_LATE_FEES
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/return"

  - priority: 9
    category: business_constraint
    check: "Financing approval requires applicant Customer.credit_score >= MIN_FINANCE_SCORE"
    error_id: ERR_CREDIT_TOO_LOW
    http_status: 422
    applies_to: "POST /financing-applications/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "Special-order deposit payment must be >= required_deposit_cents"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /special-orders/{id}/pay-deposit"

  - priority: 11
    category: business_constraint
    check: "Layaway completion requires remaining_cents == 0"
    error_id: ERR_LAYAWAY_NOT_PAID
    http_status: 422
    applies_to: "POST /layaway-plans/{id}/complete"

  - priority: 12
    category: business_fiscal
    check: "Buyout payment amount must equal the current payoff_quote_cents exactly"
    error_id: ERR_PAYOFF_MISMATCH
    http_status: 422
    applies_to: "POST /rental-agreements/{id}/buyout"

  - priority: 13
    category: business_constraint
    check: "serial_number unique among InventoryUnits sharing the same model_name"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /units"

  - priority: 14
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, numeric ranges satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Test-driving clock ------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets logical clock used for all created_at/updated_at stamps and chronological replay"]

  # --- Customer ----------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [full_name, email, credit_score]
    output: Customer
    side_effects: ["store_credit_cents=0, version=1"]

  - method: GET
    path: "/customers/{customer_id}"
    description: "Get a customer"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers (paginated)"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # --- InventoryUnit -----------------------------------------------------------
  - method: POST
    path: "/units"
    description: "Add an inventory unit to stock"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [model_name, category, condition, serial_number, acquisition_cost_cents, list_price_cents, monthly_rent_cents, "source_kind?"]
    output: InventoryUnit
    side_effects: ["status=AVAILABLE, version=1"]

  - method: GET
    path: "/units/{unit_id}"
    description: "Get an inventory unit"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List inventory units (paginated, filterable by status/category/consignment_listing_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["status?", "category?", "consignment_listing_id?", "limit?", "offset?"]
    output: InventoryUnit[]
    side_effects: []

  - method: POST
    path: "/units/{unit_id}/reserve"
    description: "Reserve an AVAILABLE unit for a customer (OCC guard point)"
    roles: [SalesAssociate]
    code: 200
    input: [customer_id, expected_inventory_unit_version]
    output: InventoryUnit
    side_effects: ["status AVAILABLE -> RESERVED", "sets reserved_for_customer_id", "increments InventoryUnit.version by 1"]

  - method: POST
    path: "/units/{unit_id}/release"
    description: "Release a RESERVED unit back to AVAILABLE"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: ["status RESERVED -> AVAILABLE", "clears reserved_for_customer_id", "increments InventoryUnit.version by 1"]

  # --- RentalAgreement ---------------------------------------------------------
  - method: POST
    path: "/rental-agreements"
    description: "Open a rental or rent-to-own agreement on a reserved unit"
    roles: [SalesAssociate]
    code: 201
    input: [customer_id, inventory_unit_id, plan, "equity_rate_pct?", "equity_cap_pct?"]
    output: RentalAgreement
    side_effects: ["snapshots monthly_rate_cents/purchase_price_cents", "InventoryUnit RESERVED -> ON_RENT", "status=ACTIVE, version=1"]

  - method: GET
    path: "/rental-agreements/{id}"
    description: "Get an agreement (surfaces accrued_equity_cents and payoff_quote_cents)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["recomputes accrued_equity_cents, payoff_quote_cents, late_fee_balance_cents, months_paid, missed_streak"]

  - method: GET
    path: "/rental-agreements"
    description: "List agreements (filter by customer_id or inventory_unit_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["customer_id?", "inventory_unit_id?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: POST
    path: "/rental-agreements/{id}/payments"
    description: "Post a rent payment against an agreement"
    roles: [Customer, SalesAssociate]
    code: 201
    input: [billing_cycle_index]
    output: PaymentRecord
    side_effects: ["appends PaymentRecord{kind=RENT, status=POSTED}", "recomputes months_paid/accrued_equity_cents/missed_streak", "DEFAULTED -> ACTIVE if streak cleared", "increments RentalAgreement.version by 1"]

  - method: GET
    path: "/rental-agreements/{id}/payments"
    description: "List payment records on an agreement (chronological)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentRecord[]
    side_effects: []

  - method: POST
    path: "/rental-agreements/{id}/advance-cycle"
    description: "Advance the agreement to the next billing cycle; posts a late fee and bumps missed_streak if the cycle was unpaid (may trigger DEFAULT)"
    roles: [StoreManager, SalesAssociate]
    code: 200
    input: [billing_cycle_index]
    output: RentalAgreement
    side_effects: ["if cycle unpaid: appends LATE_FEE, missed_streak += 1", "ACTIVE -> DEFAULTED if missed_streak >= DEFAULT_THRESHOLD", "increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-agreements/{id}/buyout"
    description: "Exercise rent-to-own early buyout (OCC + exact-payoff guarded)"
    roles: [Customer, SalesAssociate]
    code: 200
    input: [amount_cents, expected_agreement_version]
    output: RentalAgreement
    side_effects: ["appends PaymentRecord{kind=BUYOUT}", "ACTIVE -> BOUGHT_OUT", "InventoryUnit ON_RENT -> SOLD (cascade)", "increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-agreements/{id}/return"
    description: "Return the rented unit and close the agreement"
    roles: [Customer, SalesAssociate]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["ACTIVE -> RETURNED", "InventoryUnit ON_RENT -> AVAILABLE (cascade)", "forfeits accrued equity", "increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-agreements/{id}/repossess"
    description: "Repossess a defaulted unit"
    roles: [StoreManager]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["DEFAULTED -> REPOSSESSED", "InventoryUnit ON_RENT -> IN_REPAIR (cascade)", "late_fee_balance written off (waived)", "increments RentalAgreement.version by 1"]

  # --- LayawayPlan -------------------------------------------------------------
  - method: POST
    path: "/layaway-plans"
    description: "Open a layaway plan on a reserved unit"
    roles: [SalesAssociate]
    code: 201
    input: [customer_id, inventory_unit_id, deposit_cents, "restock_fee_pct?"]
    output: LayawayPlan
    side_effects: ["snapshots total_price_cents", "InventoryUnit RESERVED -> ON_LAYAWAY", "status=OPEN, version=1"]

  - method: GET
    path: "/layaway-plans/{id}"
    description: "Get a layaway plan (surfaces paid_cents/remaining_cents)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: ["recomputes paid_cents, remaining_cents"]

  - method: GET
    path: "/layaway-plans"
    description: "List layaway plans (filter by customer_id or inventory_unit_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["customer_id?", "inventory_unit_id?", "limit?", "offset?"]
    output: LayawayPlan[]
    side_effects: []

  - method: POST
    path: "/layaway-plans/{id}/payments"
    description: "Record a layaway installment"
    roles: [Customer, SalesAssociate]
    code: 201
    input: [amount_cents]
    output: LayawayPayment
    side_effects: ["appends LayawayPayment", "recomputes paid_cents/remaining_cents", "increments LayawayPlan.version by 1"]

  - method: GET
    path: "/layaway-plans/{id}/payments"
    description: "List installments on a layaway plan"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: LayawayPayment[]
    side_effects: []

  - method: POST
    path: "/layaway-plans/{id}/complete"
    description: "Complete a fully-paid layaway plan"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: ["OPEN -> COMPLETED", "InventoryUnit ON_LAYAWAY -> SOLD (cascade)", "increments LayawayPlan.version by 1"]

  - method: POST
    path: "/layaway-plans/{id}/cancel"
    description: "Cancel a layaway plan; refunds paid minus restock fee as store credit"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: ["OPEN -> CANCELLED", "InventoryUnit ON_LAYAWAY -> AVAILABLE (cascade)", "Customer.store_credit_cents += refund (cascade)", "increments LayawayPlan.version by 1"]

  # --- RepairTicket ------------------------------------------------------------
  - method: POST
    path: "/repair-tickets"
    description: "Open a luthier repair/setup ticket"
    roles: [SalesAssociate]
    code: 201
    input: [customer_id, labor_hours, labor_rate_cents, "inventory_unit_id?", "parts_cost_cents?", "rush?"]
    output: RepairTicket
    side_effects: ["computes quoted_total_cents", "if store-owned unit: InventoryUnit AVAILABLE -> IN_REPAIR", "status=INTAKE, version=1"]

  - method: GET
    path: "/repair-tickets/{ticket_id}"
    description: "Get a repair ticket"
    roles: [SalesAssociate, StoreManager, Luthier, Customer]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: GET
    path: "/repair-tickets"
    description: "List repair tickets (filter by customer_id or inventory_unit_id)"
    roles: [SalesAssociate, StoreManager, Luthier, Customer]
    code: 200
    input: ["customer_id?", "inventory_unit_id?", "status?", "limit?", "offset?"]
    output: RepairTicket[]
    side_effects: []

  - method: POST
    path: "/repair-tickets/{ticket_id}/claim"
    description: "Luthier claims an INTAKE ticket"
    roles: [Luthier]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["INTAKE -> IN_PROGRESS", "sets assigned_luthier_id = X-User-ID", "increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/await-parts"
    description: "Move ticket to AWAITING_PARTS"
    roles: [Luthier]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["IN_PROGRESS -> AWAITING_PARTS", "increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/resume"
    description: "Resume work from AWAITING_PARTS"
    roles: [Luthier]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["AWAITING_PARTS -> IN_PROGRESS", "increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/ready"
    description: "Mark repair complete and freeze the invoice"
    roles: [Luthier]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["IN_PROGRESS -> READY", "freezes quoted_total_cents", "increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/close"
    description: "Close a READY ticket (customer picks up)"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["READY -> CLOSED", "if store-owned unit: InventoryUnit IN_REPAIR -> AVAILABLE (cascade)", "increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/cancel"
    description: "Cancel a ticket before completion"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["{INTAKE,IN_PROGRESS,AWAITING_PARTS} -> CANCELLED", "if store-owned unit: InventoryUnit IN_REPAIR -> AVAILABLE (cascade)", "increments RepairTicket.version by 1"]

  # --- ConsignmentListing ------------------------------------------------------
  - method: POST
    path: "/consignment-listings"
    description: "Create a consignment listing; mints a CONSIGNED inventory unit"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [consignor_id, model_name, ask_price_cents, "commission_pct?"]
    output: ConsignmentListing
    side_effects: ["mints CONSIGNED InventoryUnit linked via consignment_listing_id", "status=LISTED, version=1"]

  - method: GET
    path: "/consignment-listings/{listing_id}"
    description: "Get a consignment listing"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: ConsignmentListing
    side_effects: []

  - method: GET
    path: "/consignment-listings"
    description: "List consignment listings (filter by consignor_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["consignor_id?", "status?", "limit?", "offset?"]
    output: ConsignmentListing[]
    side_effects: []

  - method: POST
    path: "/consignment-listings/{listing_id}/sell"
    description: "Mark a listing sold; pays the consignor and marks the unit sold"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: ConsignmentListing
    side_effects: ["LISTED -> SOLD", "computes consignor_payout_cents", "Customer.store_credit_cents += payout (cascade)", "InventoryUnit CONSIGNED -> SOLD (cascade)", "increments ConsignmentListing.version by 1"]

  - method: POST
    path: "/consignment-listings/{listing_id}/withdraw"
    description: "Withdraw a listing; returns the instrument to the consignor"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: []
    output: ConsignmentListing
    side_effects: ["LISTED -> WITHDRAWN", "InventoryUnit CONSIGNED -> RETIRED (cascade)", "increments ConsignmentListing.version by 1"]

  # --- TradeIn -----------------------------------------------------------------
  - method: POST
    path: "/trade-ins"
    description: "Create a trade-in offer (computes store-credit offer)"
    roles: [StoreManager]
    code: 201
    input: [customer_id, model_name, condition, appraised_value_cents]
    output: TradeIn
    side_effects: ["computes offer_cents", "status=OFFERED, version=1"]

  - method: GET
    path: "/trade-ins/{trade_in_id}"
    description: "Get a trade-in"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: []

  - method: GET
    path: "/trade-ins"
    description: "List trade-ins (filter by customer_id or resulting_unit_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["customer_id?", "resulting_unit_id?", "status?", "limit?", "offset?"]
    output: TradeIn[]
    side_effects: []

  - method: POST
    path: "/trade-ins/{trade_in_id}/accept"
    description: "Accept a trade-in; mints inventory and credits the customer"
    roles: [StoreManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["OFFERED -> ACCEPTED", "mints AVAILABLE InventoryUnit (source_kind=TRADE_IN); sets resulting_unit_id", "Customer.store_credit_cents += offer_cents (cascade)", "increments TradeIn.version by 1"]

  - method: POST
    path: "/trade-ins/{trade_in_id}/decline"
    description: "Decline a trade-in offer"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["OFFERED -> DECLINED", "increments TradeIn.version by 1"]

  # --- FinancingApplication ----------------------------------------------------
  - method: POST
    path: "/financing-applications"
    description: "Submit a financing application"
    roles: [SalesAssociate, Customer]
    code: 201
    input: [customer_id, principal_cents, term_months, "special_order_id?"]
    output: FinancingApplication
    side_effects: ["status=SUBMITTED, version=1"]

  - method: GET
    path: "/financing-applications/{application_id}"
    description: "Get a financing application"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []

  - method: GET
    path: "/financing-applications"
    description: "List financing applications (filter by customer_id or special_order_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["customer_id?", "special_order_id?", "status?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []

  - method: POST
    path: "/financing-applications/{application_id}/approve"
    description: "Approve financing (credit-score guarded; computes terms)"
    roles: [StoreManager]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["SUBMITTED -> APPROVED", "computes apr_pct/monthly_payment_cents", "if special_order_id: SpecialOrder DEPOSITED -> ORDERED (cascade)", "increments FinancingApplication.version by 1"]

  - method: POST
    path: "/financing-applications/{application_id}/deny"
    description: "Deny financing"
    roles: [StoreManager]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["SUBMITTED -> DENIED", "increments FinancingApplication.version by 1"]

  - method: POST
    path: "/financing-applications/{application_id}/cancel"
    description: "Cancel a financing application"
    roles: [Customer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["SUBMITTED -> CANCELLED", "increments FinancingApplication.version by 1"]

  # --- SpecialOrder ------------------------------------------------------------
  - method: POST
    path: "/special-orders"
    description: "Create a special order (computes required deposit)"
    roles: [SalesAssociate, Customer]
    code: 201
    input: [customer_id, model_name, quoted_price_cents, "deposit_pct?"]
    output: SpecialOrder
    side_effects: ["computes required_deposit_cents", "status=QUOTED, version=1"]

  - method: GET
    path: "/special-orders/{order_id}"
    description: "Get a special order"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []

  - method: GET
    path: "/special-orders"
    description: "List special orders (filter by customer_id or fulfilled_unit_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["customer_id?", "fulfilled_unit_id?", "status?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []

  - method: POST
    path: "/special-orders/{order_id}/pay-deposit"
    description: "Pay the required deposit on a special order"
    roles: [Customer, SalesAssociate]
    code: 200
    input: [amount_cents]
    output: SpecialOrder
    side_effects: ["QUOTED -> DEPOSITED", "sets deposit_paid_cents", "increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{order_id}/place"
    description: "Place the order with the manufacturer"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["DEPOSITED -> ORDERED", "increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{order_id}/receive"
    description: "Receive the ordered unit into stock (reserved for the customer)"
    roles: [SalesAssociate]
    code: 200
    input: [serial_number, category]
    output: SpecialOrder
    side_effects: ["ORDERED -> ARRIVED", "mints RESERVED InventoryUnit; sets fulfilled_unit_id", "increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{order_id}/fulfill"
    description: "Hand the arrived unit to the customer (sale)"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["ARRIVED -> FULFILLED", "InventoryUnit RESERVED -> SOLD (cascade)", "increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{order_id}/cancel"
    description: "Cancel a special order (refunds deposit as store credit)"
    roles: [SalesAssociate, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["{QUOTED,DEPOSITED,ORDERED} -> CANCELLED", "if deposit_paid_cents>0: Customer.store_credit_cents += deposit (cascade)", "increments SpecialOrder.version by 1"]

  # --- LessonEnrollment --------------------------------------------------------
  - method: POST
    path: "/lesson-enrollments"
    description: "Enroll a student in lessons (bundle discount if linked to ACTIVE agreement)"
    roles: [SalesAssociate, Customer]
