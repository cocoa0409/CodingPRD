          trigger:
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu}", category: "MINOR", description: "Late to bed check", points_proposed: 1 }, as: Dean, as_user_id: "${dean1}", captures: { case2: "$.data.id" } }
