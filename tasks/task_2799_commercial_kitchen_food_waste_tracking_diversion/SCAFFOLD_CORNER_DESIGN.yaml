              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "the first trigger returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_STATION_CODE\""
            - "the second trigger returns HTTP 201 with status ACTIVE, tare_grams 0 and capture_lock_seconds 30"
            - "GET /tracking-stations?site_id=${site_a_id} returns total_count == 1"

      - name: duplicate_shift_for_the_same_site_date_and_code_is_rejected
        claim_type: violation_to_error
