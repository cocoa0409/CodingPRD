# =============================================================================
# PRD Benchmark Seed Tables — USDA-Inspected Meat Processing & HACCP
# =============================================================================

scenario: |
  USDA-Inspected Meat Processing & HACCP (USDA-inspected packing plant): HACCP plan & critical control point monitoring, inspector presence & production scheduling, carcass yield & cut-out accounting, pathogen sampling & positive-lot hold, labeling approval & claim substantiation, humane handling audit & noncompliance record, cold chain & shelf-life dating, recall readiness & traceability exercise

domain_name: usda-meat-processing-haccp
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: establishment_number, type: string, source: input, description: "USDA establishment number; unique across all plants" }
      - { name: name, type: string, source: input, description: "Plant display name" }
      - { name: district_code, type: string, source: input, description: "FSIS district code" }
      - { name: cooler_capacity_lbs, type: number, source: input, description: "Finished-product cooler capacity in lbs; must be > 0" }
      - { name: cooler_occupied_lbs, type: number, source: computed, default: 0, description: "Sum of total_weight_lbs over FinishedLot with status in {PRODUCED, QUARANTINED, SPOILED}; recomputed on every FinishedLot create/ship/quarantine/spoil" }
      - { name: provisional_compliance_score, type: number, source: computed, default: 100, description: "100 - 2 x count of Deviations for this plant with status in {OPEN, ACTION_LOGGED}; flat per-open-item variant" }
      - { name: official_compliance_score, type: number, source: computed, default: 100, description: "100 - sum of severity weights over VERIFIED Deviations (MINOR=2, MAJOR=5); severity-weighted verified-only variant" }
      - { name: operating_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED while any OPEN CRITICAL NoncomplianceRecord exists for the plant; ACTIVE otherwise" }

  - name: HACCPPlan
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning establishment" }
      - { name: process_type, type: enum, source: input, constraints: "SLAUGHTER | RAW_GROUND | RAW_INTACT | COOKED_RTE", description: "HACCP process category covered by this plan" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | EFFECTIVE | SUPERSEDED", description: "Plan lifecycle state" }
      - { name: revision_number, type: integer, source: system, default: 0, description: "Increments by 1 on each submit from REJECTED (resubmission)" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded by inspector on reject; null otherwise" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving Inspector; null until approved" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last submit; null until submitted" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of approve; null until approved" }

  - name: CriticalControlPoint
    parent: HACCPPlan
    common_fields: true
    fields:
      - { name: haccp_plan_id, type: string, source: system, description: "FK -> HACCPPlan.id; owning plan" }
      - { name: ccp_code, type: string, source: input, description: "Plant-local CCP identifier, unique within the plan (e.g. CCP-1B)" }
      - { name: hazard_category, type: enum, source: input, constraints: "BIOLOGICAL | CHEMICAL | PHYSICAL", description: "Hazard class monitored at this CCP" }
      - { name: description, type: string, source: input, description: "Free-text description of the control point" }
      - { name: critical_limit_min_f, type: number, source: input, description: "Inclusive lower critical limit in deg F; null when not applicable", default: null }
      - { name: critical_limit_max_f, type: number, source: input, description: "Inclusive upper critical limit in deg F; null when not applicable", default: null }
      - { name: monitoring_frequency_minutes, type: integer, source: input, description: "Documented monitoring interval in minutes (>0); informational, not enforced by the server" }
      - { name: deviation_severity, type: enum, source: computed, constraints: "MINOR | MAJOR", description: "MAJOR when hazard_category == BIOLOGICAL, else MINOR" }

  - name: CCPObservation
    parent: CriticalControlPoint
    common_fields: false
    fields:
      - { name: ccp_id, type: string, source: system, description: "FK -> CriticalControlPoint.id; observed CCP" }
      - { name: production_day_id, type: string, source: system, description: "FK -> ProductionDay.id; the plant's OPEN day matching the observation date at record time" }
      - { name: monitor_user_id, type: string, source: system, description: "X-User-ID of the recording QATech" }
      - { name: observed_value_f, type: number, source: input, description: "Observed value in deg F" }
      - { name: within_limit, type: boolean, source: computed, description: "True iff (min is null or observed >= min) AND (max is null or observed <= max); limits are inclusive" }
      - { name: deviation_id, type: string, source: system, description: "Id of the Deviation spawned by this observation when within_limit is false; null when within limits" }

  - name: Deviation
    parent: CriticalControlPoint
    common_fields: true
    fields:
      - { name: ccp_id, type: string, source: system, description: "FK -> CriticalControlPoint.id; CCP whose limit was exceeded" }
      - { name: production_day_id, type: string, source: system, description: "FK -> ProductionDay.id; day the violation occurred on" }
      - { name: observation_id, type: string, source: system, description: "FK -> CCPObservation.id; observation that spawned this deviation" }
      - { name: severity, type: enum, source: computed, constraints: "MINOR | MAJOR", description: "Copied from the CCP's deviation_severity at creation" }
      - { name: corrective_action_note, type: string, source: input, description: "Corrective action narrative recorded at log-corrective-action" }
      - { name: action_logged_by, type: string, source: system, description: "X-User-ID that logged the corrective action" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID that verified the deviation; must differ from monitor_user_id of the source observation and from action_logged_by" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | ACTION_LOGGED | VERIFIED", description: "Deviation lifecycle" }

  - name: InspectorShift
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; plant the inspector covers" }
      - { name: inspector_user_id, type: string, source: input, description: "User id of the Inspector scheduled; check-in requires matching X-User-ID" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled coverage start (ISO8601); must be < scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled coverage end (ISO8601)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | ON_PREMISE | DEPARTED | NO_SHOW", description: "Shift lifecycle; NO_SHOW applied by clock sweep when now > scheduled_end while SCHEDULED" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock check-in timestamp; null until checked in" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock check-out timestamp; null until checked out" }

  - name: ProductionDay
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: production_date, type: string, source: input, description: "Calendar date of operation, YYYY-MM-DD; at most one non-CLOSED day per (plant, production_date)" }
      - { name: process_type, type: enum, source: input, constraints: "SLAUGHTER | RAW_GROUND | RAW_INTACT | COOKED_RTE", description: "Process run on this day; an EFFECTIVE HACCPPlan for (plant, process_type) is required to open" }
      - { name: status, type: enum, source: system, default: PLANNED, constraints: "PLANNED | OPEN | SUSPENDED | CLOSED", description: "Day lifecycle; OPEN <-> SUSPENDED cycle allowed" }
      - { name: posture, type: enum, source: computed, default: CLEAR, constraints: "CLEAR | RESTRICTED", description: "RESTRICTED while any lot of the day is HELD, any finished lot of the day is QUARANTINED, or any deviation of the day is OPEN or ACTION_LOGGED; else CLEAR" }
      - { name: total_cut_weight_lbs, type: number, source: computed, default: 0, description: "Sum of total_cut_weight_lbs over the day's FABRICATED CarcassLots" }
      - { name: total_cold_weight_lbs, type: number, source: computed, default: 0, description: "Sum of cold_carcass_weight_lbs over the day's FABRICATED CarcassLots" }
      - { name: day_yield_pct, type: number, source: computed, description: "Set at close: round_half_up(100 x total_cut_weight_lbs / total_cold_weight_lbs, 2); null until CLOSED" }

  - name: CarcassLot
    parent: ProductionDay
    common_fields: true
    fields:
      - { name: production_day_id, type: string, source: system, description: "FK -> ProductionDay.id; day the lot was received on" }
      - { name: species, type: enum, source: input, constraints: "BOVINE | SWINE | OVINE | POULTRY", description: "Species of the lot" }
      - { name: supplier_name, type: string, source: input, description: "Supplying farm/ranch name" }
      - { name: head_count, type: integer, source: input, description: "Head received; must be > 0" }
      - { name: live_weight_lbs, type: number, source: input, description: "Total live weight in lbs; must be > 0" }
      - { name: hot_carcass_weight_lbs, type: number, source: input, description: "Total hot carcass weight recorded at harvest; > 0" }
      - { name: cold_carcass_weight_lbs, type: number, source: input, description: "Total cold carcass weight recorded at chill-complete; > 0 and <= hot_carcass_weight_lbs" }
      - { name: drip_loss_pct, type: number, source: computed, description: "round_half_up(100 x (hot - cold) / hot, 2) computed at chill-complete" }
      - { name: total_cut_weight_lbs, type: number, source: computed, default: 0, description: "Running sum of CutRecord.weight_lbs for this lot" }
      - { name: trim_waste_lbs, type: number, source: input, description: "Trim/waste weight recorded at complete-fabrication; >= 0" }
      - { name: fabrication_yield_pct, type: number, source: computed, description: "Cold-basis yield: round_half_up(100 x total_cut_weight_lbs / cold_carcass_weight_lbs, 2) at complete-fabrication" }
      - { name: packer_yield_pct, type: number, source: computed, description: "Hot-basis yield: round_half_up(100 x total_cut_weight_lbs / hot_carcass_weight_lbs, 2) at complete-fabrication" }
      - { name: yield_grade, type: enum, source: computed, constraints: "A | B | C", description: "A when fabrication_yield_pct >= 72.0, B when >= 68.0, else C" }
      - { name: status, type: enum, source: system, default: RECEIVED, constraints: "RECEIVED | CLEARED | HARVESTED | CHILLED | FABRICATING | FABRICATED | HELD | RELEASED | CONDEMNED", description: "Lot lifecycle including hold/release cycle" }

  - name: CutRecord
    parent: CarcassLot
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> CarcassLot.id; lot being fabricated" }
      - { name: primal_type, type: enum, source: input, constraints: "CHUCK | RIB | LOIN | ROUND | BRISKET | BELLY | HAM | OTHER", description: "Primal/subprimal category" }
      - { name: weight_lbs, type: number, source: input, description: "Cut weight in lbs; > 0" }
      - { name: pct_of_cold_weight, type: number, source: computed, description: "Per-line share: round_half_up(100 x weight_lbs / lot.cold_carcass_weight_lbs, 2)" }

  - name: PathogenSample
    parent: CarcassLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> CarcassLot.id; sampled lot" }
      - { name: organism, type: enum, source: input, constraints: "ECOLI_O157H7 | SALMONELLA | LISTERIA_MONOCYTOGENES | GENERIC_ECOLI", description: "Target organism" }
      - { name: sample_type, type: enum, source: input, constraints: "CARCASS_SWAB | GROUND_PRODUCT | ENVIRONMENTAL", description: "Sample matrix" }
      - { name: collected_by, type: string, source: system, description: "X-User-ID of the collecting QATech" }
      - { name: result, type: enum, source: system, default: PENDING, constraints: "PENDING | NEGATIVE | POSITIVE", description: "Lab result; PENDING until reported" }
      - { name: is_confirmation, type: boolean, source: computed, description: "True when a POSITIVE sample for the same lot with an earlier created_at exists" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp of result report; null while PENDING" }

  - name: LabelApproval
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: product_name, type: string, source: input, description: "Product name as printed on label" }
      - { name: claims, type: array, source: input, description: "Label claims; members of ORGANIC | GRASS_FED | NO_ANTIBIOTICS_EVER | NATURAL" }
      - { name: substantiation_doc_refs, type: array, source: input, description: "Document references substantiating claims; submit requires at least one ref per claim" }
      - { name: formulation_version, type: integer, source: input, description: "Formulation version declared on this label application; >= 1" }
      - { name: approved_formulation_version, type: integer, source: system, description: "Pinned at approve: equals formulation_version at approval time; null until APPROVED" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED", description: "Label lifecycle; REJECTED -> SUBMITTED resubmission allowed" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on reject; null otherwise" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving Inspector; null until approved" }

  - name: FinishedLot
    parent: ProductionDay
    common_fields: true
    fields:
      - { name: production_day_id, type: string, source: system, description: "FK -> ProductionDay.id; day of packaging" }
      - { name: source_lot_id, type: string, source: input, description: "FK -> CarcassLot.id; fabricated lot the product came from" }
      - { name: label_approval_id, type: string, source: input, description: "FK -> LabelApproval.id; label applied; must be APPROVED and the latest-approved label for its (plant, product_name)" }
      - { name: units_produced, type: integer, source: input, description: "Units packed; > 0" }
      - { name: unit_weight_lbs, type: number, source: input, description: "Weight per unit in lbs; > 0" }
      - { name: total_weight_lbs, type: number, source: computed, description: "round_half_up(units_produced x unit_weight_lbs, 2)" }
      - { name: production_date, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: shelf_life_days, type: integer, source: input, description: "Labeled shelf life in days; > 0" }
      - { name: base_use_by_at, type: datetime, source: computed, description: "production_date + shelf_life_days x 24h" }
      - { name: penalty_hours, type: number, source: computed, default: 0, description: "Accumulated cold-chain penalty hours from temperature_logs (see shelf_life_dating calculation)" }
      - { name: use_by_at, type: datetime, source: computed, description: "max(production_date, base_use_by_at - penalty_hours); recomputed on every log-temperature" }
      - { name: temperature_logs, type: array, source: system, default: [], description: "Append-only array of {recorded_at, temp_f} entries in recorded_at order" }
      - { name: status, type: enum, source: system, default: PRODUCED, constraints: "PRODUCED | SHIPPED | QUARANTINED | SPOILED", description: "Finished lot lifecycle" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock timestamp of ship; null until shipped" }

  - name: HumaneHandlingAudit
    parent: Plant
    common_fields: false
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; audited plant" }
      - { name: production_day_id, type: string, source: input, description: "FK -> ProductionDay.id; day under audit; must be OPEN" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the Inspector performing the audit" }
      - { name: stunning_efficacy_pct, type: number, source: input, description: "Percent of animals rendered insensible on first attempt; 0..100" }
      - { name: slips_falls_pct, type: number, source: input, description: "Percent of animals slipping/falling; 0..100" }
      - { name: vocalization_pct, type: number, source: input, description: "Percent of animals vocalizing; 0..100" }
      - { name: outcome, type: enum, source: computed, constraints: "PASSED | FAILED", description: "PASSED iff stunning_efficacy_pct >= 99.0 AND slips_falls_pct <= 3.0 AND vocalization_pct <= 10.0" }
      - { name: noncompliance_record_id, type: string, source: system, description: "Id of the NoncomplianceRecord created when outcome == FAILED; null when PASSED" }

  - name: NoncomplianceRecord
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; cited plant" }
      - { name: production_day_id, type: string, source: system, description: "FK -> ProductionDay.id; day of the noncompliance; null for recall-exercise origin" }
      - { name: category, type: enum, source: system, constraints: "HUMANE_HANDLING | TRACEABILITY | PATHOGEN_CONTROL | SANITATION", description: "Regulatory category of the noncompliance" }
      - { name: regulation_cite, type: string, source: system, description: "CFR citation; defaulted per category by the server" }
      - { name: description, type: string, source: system, description: "Server-generated narrative of the triggering event" }
      - { name: severity, type: enum, source: system, constraints: "MAJOR | CRITICAL", description: "CRITICAL for humane-handling and traceability origins" }
      - { name: created_by, type: string, source: system, description: "Originator user id: auditor_user_id for humane origin, completing user for recall origin" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | APPEALED | CLOSED", description: "NR lifecycle" }
      - { name: appeal_note, type: string, source: input, description: "Appeal narrative recorded at appeal" }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of resolving Inspector; must differ from created_by" }
      - { name: resolution_note, type: string, source: input, description: "Resolution narrative recorded at resolve" }

  - name: RecallExercise
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; plant running the traceability drill" }
      - { name: target_finished_lot_id, type: string, source: input, description: "FK -> FinishedLot.id; lot being mock-recalled; must belong to this plant" }
      - { name: scope, type: enum, source: input, constraints: "ONE_STEP_BACK | ONE_STEP_FORWARD | FULL", description: "Traceability scope of the drill" }
      - { name: initiated_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: deadline_at, type: datetime, source: computed, description: "initiated_at + 24 hours" }
      - { name: basis_weight_lbs, type: number, source: computed, description: "Target lot's total_weight_lbs at initiation (the 100% recovery basis)" }
      - { name: recovery_pct, type: number, source: computed, description: "Set at complete: round_half_up(100 x min(reconciled_weight_lbs, basis_weight_lbs) / basis_weight_lbs, 2)" }
      - { name: status, type: enum, source: system, default: INITIATED, constraints: "INITIATED | PASSED | FAILED", description: "Drill lifecycle" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null while INITIATED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plant
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: a NoncomplianceRecord with severity CRITICAL is created (humane audit FAILED or recall FAILED) while no other OPEN CRITICAL NR existed"
        actor: system
        preconditions: ["a new OPEN CRITICAL NoncomplianceRecord exists for the plant"]
        side_effects:
          - "every ProductionDay of the plant with status OPEN transitions to SUSPENDED (posture cascade, chain link 3)"
        note: "operating_status is a posture field derived from open CRITICAL NRs"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade: the last OPEN CRITICAL NoncomplianceRecord for the plant transitions to CLOSED"
        actor: system
        preconditions: ["no remaining NoncomplianceRecord for the plant with status OPEN and severity CRITICAL"]
        side_effects:
          - "ProductionDays of the plant remain in their current state; suspended days require an explicit open call to resume"
  - entity: HACCPPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /haccp-plans/{id}/submit"
        actor: QAManager
        preconditions: ["plan has at least one CriticalControlPoint (else ERR_PLAN_HAS_NO_CCP)"]
        side_effects: ["submitted_at := logical clock now"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /haccp-plans/{id}/submit (resubmission loop)"
        actor: QAManager
        preconditions: ["plan has at least one CriticalControlPoint (else ERR_PLAN_HAS_NO_CCP)"]
        side_effects: ["revision_number += 1", "submitted_at := logical clock now", "rejection_reason := null"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /haccp-plans/{id}/approve"
        actor: Inspector
        preconditions: []
        side_effects: ["approved_by := X-User-ID", "approved_at := logical clock now"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /haccp-plans/{id}/reject"
        actor: Inspector
        preconditions: []
        side_effects: ["rejection_reason := payload rejection_reason"]
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /haccp-plans/{id}/activate"
        actor: QAManager
        preconditions: []
        side_effects:
          - "any other HACCPPlan of the same plant with the same process_type and status EFFECTIVE transitions to SUPERSEDED (at most one EFFECTIVE plan per (plant, process_type))"
  - entity: Deviation
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: ACTION_LOGGED
        trigger: "POST /deviations/{id}/log-corrective-action"
        actor: QAManager
        preconditions: []
        side_effects: ["action_logged_by := X-User-ID", "corrective_action_note := payload corrective_action_note"]
      - from: ACTION_LOGGED
        to: VERIFIED
        trigger: "POST /deviations/{id}/verify"
        actor: QAManager
        preconditions:
          - "X-User-ID != monitor_user_id of the spawning CCPObservation (segregation of duties)"
          - "X-User-ID != action_logged_by (segregation of duties)"
        side_effects:
          - "verified_by := X-User-ID"
          - "recompute Plant.official_compliance_score and Plant.provisional_compliance_score for the owning plant"
          - "recompute ProductionDay.posture for the owning day (CLEAR when no OPEN or ACTION_LOGGED deviations remain and no HELD lots or QUARANTINED finished lots)"
  - entity: InspectorShift
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: ON_PREMISE
        trigger: "POST /inspector-shifts/{id}/check-in"
        actor: Inspector
        preconditions:
          - "X-User-ID == shift.inspector_user_id (else ERR_CHECKIN_IDENTITY_MISMATCH)"
          - "logical clock now within [scheduled_start - 15 minutes, scheduled_end] inclusive (else ERR_SHIFT_CHECKIN_OUTSIDE_WINDOW)"
        side_effects: ["checked_in_at := logical clock now"]
      - from: ON_PREMISE
        to: DEPARTED
        trigger: "POST /inspector-shifts/{id}/check-out"
        actor: Inspector
        preconditions: ["X-User-ID == shift.inspector_user_id (else ERR_CHECKIN_IDENTITY_MISMATCH)"]
        side_effects:
          - "checked_out_at := logical clock now"
          - "when no other InspectorShift of the same plant has status ON_PREMISE, every ProductionDay of the plant with status OPEN transitions to SUSPENDED (conditional cascade)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system clock sweep: POST /_clock/set_current_utc advances the logical clock past scheduled_end while the shift is still SCHEDULED"
        actor: system
        preconditions: ["logical clock now > scheduled_end"]
        side_effects: []
        note: "sweep processes shifts ordered by scheduled_end ASC, tie-break created_at ASC"
  - entity: ProductionDay
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /production-days/{id}/open"
        actor: ProductionManager
        preconditions:
          - "plant.operating_status == ACTIVE (else ERR_PLANT_SUSPENDED)"
          - "at least one InspectorShift of the plant has status ON_PREMISE (else ERR_INSPECTOR_NOT_PRESENT)"
          - "logical clock date == production_date (else ERR_DAY_DATE_MISMATCH)"
          - "an EFFECTIVE HACCPPlan exists for (plant, process_type) (else ERR_PLAN_NOT_EFFECTIVE)"
        side_effects: ["recompute posture"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /production-days/{id}/open (resume)"
        actor: ProductionManager
        preconditions:
          - "plant.operating_status == ACTIVE (else ERR_PLANT_SUSPENDED)"
          - "at least one InspectorShift of the plant has status ON_PREMISE (else ERR_INSPECTOR_NOT_PRESENT)"
          - "logical clock date == production_date (else ERR_DAY_DATE_MISMATCH)"
          - "an EFFECTIVE HACCPPlan exists for (plant, process_type) (else ERR_PLAN_NOT_EFFECTIVE)"
        side_effects: ["recompute posture"]
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /production-days/{id}/suspend, or system cascades (inspector check-out of last ON_PREMISE shift; plant suspension)"
        actor: ProductionManager | system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /production-days/{id}/close"
        actor: ProductionManager
        preconditions:
          - "no Deviation of the day with status OPEN or ACTION_LOGGED (else ERR_DAY_INVALID_STATE)"
          - "every CarcassLot of the day has status in {FABRICATED, CONDEMNED} (else ERR_DAY_INVALID_STATE)"
        side_effects:
          - "freeze total_cut_weight_lbs and total_cold_weight_lbs over FABRICATED lots"
          - "day_yield_pct := round_half_up(100 x total_cut_weight_lbs / total_cold_weight_lbs, 2) (null when total_cold_weight_lbs == 0)"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /production-days/{id}/close"
        actor: ProductionManager
        preconditions:
          - "no Deviation of the day with status OPEN or ACTION_LOGGED (else ERR_DAY_INVALID_STATE)"
          - "every CarcassLot of the day has status in {FABRICATED, CONDEMNED} (else ERR_DAY_INVALID_STATE)"
        side_effects:
          - "freeze total_cut_weight_lbs and total_cold_weight_lbs over FABRICATED lots"
          - "day_yield_pct := round_half_up(100 x total_cut_weight_lbs / total_cold_weight_lbs, 2) (null when total_cold_weight_lbs == 0)"
  - entity: CarcassLot
    initial_state: RECEIVED
    terminal_states: [CONDEMNED]
    # FABRICATED is the normal resting state (counts as terminal for day-close
    # purposes) but can still move to HELD by a late POSITIVE pathogen result.
    transitions:
      - from: RECEIVED
        to: CLEARED
        trigger: "POST /lots/{id}/pass-ante-mortem"
        actor: Inspector
        preconditions: ["owning ProductionDay.status == OPEN (else ERR_DAY_NOT_OPEN)"]
        side_effects: []
      - from: CLEARED
        to: HARVESTED
        trigger: "POST /lots/{id}/harvest"
        actor: ProductionManager
        preconditions: ["owning ProductionDay.status == OPEN (else ERR_DAY_NOT_OPEN)"]
        side_effects: ["hot_carcass_weight_lbs := payload hot_carcass_weight_lbs"]
      - from: HARVESTED
        to: CHILLED
        trigger: "POST /lots/{id}/chill-complete"
        actor: ProductionManager
        preconditions:
          - "owning ProductionDay.status == OPEN (else ERR_DAY_NOT_OPEN)"
          - "cold_carcass_weight_lbs <= hot_carcass_weight_lbs (else ERR_INVALID_REQUEST)"
        side_effects: ["drip_loss_pct := drip_loss calculation"]
      - from: CHILLED
        to: FABRICATING
        trigger: "POST /lots/{id}/fabricate"
        actor: ProductionManager
        preconditions: ["owning ProductionDay.status == OPEN (else ERR_DAY_NOT_OPEN)"]
        side_effects: []
      - from: RELEASED
        to: FABRICATING
        trigger: "POST /lots/{id}/fabricate"
        actor: ProductionManager
        preconditions: ["owning ProductionDay.status == OPEN (else ERR_DAY_NOT_OPEN)"]
        side_effects: []
      - from: FABRICATING
        to: FABRICATED
        trigger: "POST /lots/{id}/complete-fabrication"
        actor: ProductionManager
        preconditions:
          - "owning ProductionDay.status == OPEN (else ERR_DAY_NOT_OPEN)"
          - "at least one CutRecord exists for the lot (else ERR_MASS_BALANCE_VIOLATION)"
          - "|total_cut_weight_lbs + trim_waste_lbs - cold_carcass_weight_lbs| <= 0.5 (else ERR_MASS_BALANCE_VIOLATION)"
        side_effects:
          - "fabrication_yield_pct, packer_yield_pct, yield_grade computed per carcass_cutout_yield calculation"
          - "recompute owning ProductionDay total_cut_weight_lbs and total_cold_weight_lbs (ledger sync)"
      - from: HARVESTED
        to: HELD
        trigger: "system cascade: a PathogenSample of this lot transitions to POSITIVE"
        actor: system
        preconditions: []
        side_effects:
          - "every FinishedLot with source_lot_id == this lot and status PRODUCED transitions to QUARANTINED (chain link 2)"
          - "recompute owning ProductionDay.posture (chain link 3 fires from each QUARANTINED finished lot)"
      - from: CHILLED
        to: HELD
        trigger: "system cascade: a PathogenSample of this lot transitions to POSITIVE"
        actor: system
        preconditions: []
        side_effects:
          - "every FinishedLot with source_lot_id == this lot and status PRODUCED transitions to QUARANTINED"
          - "recompute owning ProductionDay.posture"
      - from: FABRICATING
        to: HELD
        trigger: "system cascade: a PathogenSample of this lot transitions to POSITIVE"
        actor: system
        preconditions: []
        side_effects:
          - "every FinishedLot with source_lot_id == this lot and status PRODUCED transitions to QUARANTINED"
          - "recompute owning ProductionDay.posture"
      - from: FABRICATED
        to: HELD
        trigger: "system cascade: a PathogenSample of this lot transitions to POSITIVE"
        actor: system
        preconditions: []
        side_effects:
          - "every FinishedLot with source_lot_id == this lot and status PRODUCED transitions to QUARANTINED"
          - "recompute owning ProductionDay.posture"
      - from: HELD
        to: RELEASED
        trigger: "POST /lots/{id}/release-hold"
        actor: QAManager
        preconditions:
          - "a PathogenSample of this lot with result NEGATIVE exists whose created_at is later than the created_at of the latest POSITIVE sample (confirmation retest; else ERR_POSITIVE_PATHOGEN_UNRESOLVED)"
        side_effects: ["recompute owning ProductionDay.posture"]
      - from: HELD
        to: CONDEMNED
        trigger: "system cascade: a confirmation PathogenSample (is_confirmation == true) of this lot transitions to POSITIVE"
        actor: system
        preconditions: []
        side_effects:
          - "every FinishedLot with source_lot_id == this lot and status PRODUCED transitions to QUARANTINED"
          - "recompute owning ProductionDay.posture"
  - entity: PathogenSample
    initial_state: PENDING
    terminal_states: [NEGATIVE, POSITIVE]
    transitions:
      - from: PENDING
        to: NEGATIVE
        trigger: "POST /pathogen-samples/{id}/report-result with result NEGATIVE"
        actor: LabAnalyst
        preconditions: []
        side_effects: ["reported_at := logical clock now"]
      - from: PENDING
        to: POSITIVE
        trigger: "POST /pathogen-samples/{id}/report-result with result POSITIVE"
        actor: LabAnalyst
        preconditions: []
        side_effects:
          - "reported_at := logical clock now"
          - "cascade link 1: owning CarcassLot transitions to HELD (from HARVESTED/CHILLED/FABRICATING/FABRICATED) or to CONDEMNED (from HELD, i.e. confirmation positive)"
          - "cascade link 2 (caused by the lot's HELD/CONDEMNED transition): every FinishedLot with source_lot_id == lot and status PRODUCED transitions to QUARANTINED"
          - "cascade link 3 (caused by each finished lot's QUARANTINED transition): owning ProductionDay.posture recomputed to RESTRICTED"
  - entity: LabelApproval
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /label-approvals/{id}/submit"
        actor: QAManager
        preconditions: ["substantiation_doc_refs contains at least one entry per member of claims (else ERR_CLAIM_SUBSTANTIATION_MISSING)"]
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /label-approvals/{id}/submit (resubmission loop)"
        actor: QAManager
        preconditions: ["substantiation_doc_refs contains at least one entry per member of claims (else ERR_CLAIM_SUBSTANTIATION_MISSING)"]
        side_effects: ["rejection_reason := null"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /label-approvals/{id}/approve"
        actor: Inspector
        preconditions: []
        side_effects: ["approved_formulation_version := formulation_version (version pinning)", "approved_by := X-User-ID"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /label-approvals/{id}/reject"
        actor: Inspector
        preconditions: []
        side_effects: ["rejection_reason := payload rejection_reason"]
  - entity: FinishedLot
    initial_state: PRODUCED
    terminal_states: [SHIPPED, QUARANTINED, SPOILED]
    transitions:
      - from: PRODUCED
        to: SHIPPED
        trigger: "POST /finished-lots/{id}/ship"
        actor: ProductionManager
        preconditions: ["logical clock now <= use_by_at inclusive (else ERR_SHELF_LIFE_EXPIRED)"]
        side_effects:
          - "shipped_at := logical clock now"
          - "Plant.cooler_occupied_lbs -= total_weight_lbs (compensating release of cooler allocation)"
      - from: PRODUCED
        to: QUARANTINED
        trigger: "system cascade: source CarcassLot transitions to HELD or CONDEMNED"
        actor: system
        preconditions: []
        side_effects: ["recompute owning ProductionDay.posture to RESTRICTED (cascade link 3)"]
      - from: PRODUCED
        to: SPOILED
        trigger: "system auto-transition evaluated on POST /finished-lots/{id}/log-temperature: recomputed use_by_at < logical clock now"
        actor: system
        preconditions: ["use_by_at < logical clock now after penalty recompute"]
        side_effects: []
  - entity: NoncomplianceRecord
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: APPEALED
        trigger: "POST /noncompliance-records/{id}/appeal"
        actor: QAManager
        preconditions: []
        side_effects: ["appeal_note := payload appeal_note"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /noncompliance-records/{id}/resolve"
        actor: Inspector
        preconditions: ["X-User-ID != created_by (segregation of duties, else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"]
        side_effects:
          - "resolved_by := X-User-ID"
          - "resolution_note := payload resolution_note"
          - "recompute Plant.operating_status: when no OPEN CRITICAL NR remains, plant transitions SUSPENDED -> ACTIVE"
      - from: APPEALED
        to: CLOSED
        trigger: "POST /noncompliance-records/{id}/resolve"
        actor: Inspector
        preconditions: ["X-User-ID != created_by (segregation of duties, else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"]
        side_effects:
          - "resolved_by := X-User-ID"
          - "resolution_note := payload resolution_note"
          - "recompute Plant.operating_status: when no OPEN CRITICAL NR remains, plant transitions SUSPENDED -> ACTIVE"
  - entity: RecallExercise
    initial_state: INITIATED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: INITIATED
        to: PASSED
        trigger: "POST /recall-exercises/{id}/complete"
        actor: QAManager
        preconditions: ["logical clock now <= deadline_at", "recovery_pct >= 99.5"]
        side_effects: ["completed_at := logical clock now", "recovery_pct computed per recall_recovery calculation"]
      - from: INITIATED
        to: FAILED
        trigger: "POST /recall-exercises/{id}/complete"
        actor: QAManager
        preconditions: ["logical clock now > deadline_at OR recovery_pct < 99.5"]
        side_effects:
          - "completed_at := logical clock now"
          - "recovery_pct computed per recall_recovery calculation"
          - "cascade link 1: a NoncomplianceRecord (category TRACEABILITY, severity CRITICAL, created_by := X-User-ID) is created for the plant"
          - "cascade link 2 (caused by the NR creation): Plant.operating_status transitions to SUSPENDED"
          - "cascade link 3 (caused by the plant suspension): every OPEN ProductionDay of the plant transitions to SUSPENDED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
# None. Every write-write conflict in this scaffold is decidable from state the
# second sequential request can observe (state preconditions in 1.2 / 1.4), so
# no true races exist and no OCC rules are declared.
concurrency_rules: []

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: carcass_cutout_yield
    trigger: "on CarcassLot FABRICATING -> FABRICATED (POST /lots/{id}/complete-fabrication)"
    algorithm: aggregation
    formula: |
      total_cut = sum(CutRecord.weight_lbs for lot)   # raw stored weights, no per-line pre-rounding
      fabrication_yield_pct = round_half_up(100 * total_cut / cold_carcass_weight_lbs, 2)   # cold basis
      packer_yield_pct      = round_half_up(100 * total_cut / hot_carcass_weight_lbs, 2)    # hot basis
      yield_grade = A when fabrication_yield_pct >= GRADE_A_MIN_PCT
                    else B when fabrication_yield_pct >= GRADE_B_MIN_PCT
                    else C
      Rounding order is pinned: per-line pct_of_cold_weight on each CutRecord is rounded
      per line at cut-record creation; the lot-level yields are computed from the UNROUNDED
      sum of stored weights and rounded once at the end. sum(per-line pct) may therefore
      differ from fabrication_yield_pct; fabrication_yield_pct is authoritative.
    input_set: "all CutRecord rows of the lot (no status filter — records are immutable once created); lot must carry hot_carcass_weight_lbs and cold_carcass_weight_lbs"
    constants:
      GRADE_A_MIN_PCT: 72.0
      GRADE_B_MIN_PCT: 68.0
      MASS_BALANCE_TOLERANCE_LBS: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: cold_basis_fabrication_yield
        when: "authoritative lot yield, yield_grade, and ProductionDay totals"
        difference: "divides by cold_carcass_weight_lbs (post-chill weight)"
      - name: hot_basis_packer_yield
        when: "packer-style yield reported on the lot for settlement comparison"
        difference: "divides by hot_carcass_weight_lbs (pre-chill weight), so cooler shrink counts against yield; strictly lower than cold basis whenever drip_loss_pct > 0"

  - name: drip_loss
    trigger: "on CarcassLot HARVESTED -> CHILLED (POST /lots/{id}/chill-complete)"
    algorithm: aggregation
    formula: |
      drip_loss_pct = round_half_up(100 * (hot_carcass_weight_lbs - cold_carcass_weight_lbs) / hot_carcass_weight_lbs, 2)
    input_set: "the single lot's hot and cold carcass weights"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: shelf_life_dating
    trigger: "on POST /finished-lots/{id}/log-temperature (append + recompute) and evaluated again inside POST /finished-lots/{id}/ship"
    algorithm: chronological
    formula: |
      Process temperature_logs in recorded_at ASC order (tie-break: insertion order).
      For entry i with temp_f > COLD_CHAIN_LIMIT_F:
        interval_h = (recorded_at[i+1] - recorded_at[i]) in hours when a next entry exists,
                     else (logical clock now - recorded_at[i]) in hours.
        tier multiplier m(temp_f):
          COLD_CHAIN_LIMIT_F <  t <= TIER1_MAX_F          -> 1.0
          TIER1_MAX_F        <  t <= TIER2_MAX_F          -> 1.5
          t                  >  TIER2_MAX_F               -> 2.0
        penalty_hours += interval_h * m
      use_by_at = max(production_date, base_use_by_at - penalty_hours)
      where base_use_by_at = production_date + shelf_life_days * 24h.
      If use_by_at < logical clock now, the lot auto-transitions PRODUCED -> SPOILED.
    input_set: "the lot's own temperature_logs array; entries at exactly COLD_CHAIN_LIMIT_F (40.0 F) accrue no abuse"
    constants:
      COLD_CHAIN_LIMIT_F: 40.0
      TIER1_MAX_F: 45.0
      TIER2_MAX_F: 50.0
      TIER1_MULT: 1.0
      TIER2_MULT: 1.5
      TIER3_MULT: 2.0
    precision: "penalty_hours to 2 decimal places; timestamps to the second"

  - name: plant_compliance_score
    trigger: "on Deviation creation (cascade from POST /ccps/{id}/observations), on Deviation -> ACTION_LOGGED, and on Deviation -> VERIFIED"
    algorithm: weighted_scoring
    formula: |
      provisional_compliance_score = 100 - OPEN_ITEM_WEIGHT * count(Deviation of plant with status in {OPEN, ACTION_LOGGED})
      official_compliance_score    = 100 - sum(severity_weight(d) for d in Deviations of plant with status == VERIFIED)
      severity_weight: MINOR -> 2, MAJOR -> 5
      Both scores are floored at 0.
    input_set: "all Deviations whose production_day belongs to the plant; provisional counts only {OPEN, ACTION_LOGGED}, official sums only {VERIFIED}"
    constants:
      OPEN_ITEM_WEIGHT: 2
      MINOR_WEIGHT: 2
      MAJOR_WEIGHT: 5
    precision: "integer scores"
    variants:
      - name: provisional_flat_count
        when: "day-to-day operational posture shown while deviations are still open"
        difference: "flat 2 points per unresolved deviation regardless of severity; ignores VERIFIED deviations entirely"
      - name: official_severity_weighted
        when: "official compliance standing after verification"
        difference: "weights by severity (MINOR=2, MAJOR=5) and counts only VERIFIED deviations; identical data yields a different score than the provisional variant"

  - name: recall_recovery
    trigger: "on POST /recall-exercises/{id}/complete"
    algorithm: threshold
    formula: |
      recovery_pct = round_half_up(100 * min(reconciled_weight_lbs, basis_weight_lbs) / basis_weight_lbs, 2)
      outcome = PASSED when (logical clock now <= deadline_at) AND (recovery_pct >= RECALL_PASS_THRESHOLD_PCT)
                else FAILED
      Basis: basis_weight_lbs is snapshotted from the target FinishedLot.total_weight_lbs at initiation.
    input_set: "the exercise's target FinishedLot and the reconciled_weight_lbs payload"
    constants:
      RECALL_PASS_THRESHOLD_PCT: 99.5
      RECALL_WINDOW_HOURS: 24
    precision: "2 decimal places, round_half_up; threshold comparison uses the unrounded ratio >= 0.995 (equivalently, reconciled/basis >= 0.995 exactly)"

  - name: humane_audit_outcome
    trigger: "on POST /plants/{id}/humane-audits (computed synchronously at creation)"
    algorithm: threshold
    formula: |
      outcome = PASSED when stunning_efficacy_pct >= STUNNING_MIN_PCT
                         AND slips_falls_pct <= SLIPS_MAX_PCT
                         AND vocalization_pct <= VOCAL_MAX_PCT
                else FAILED
    input_set: "the three audit metric payloads"
    constants:
      STUNNING_MIN_PCT: 99.0
      SLIPS_MAX_PCT: 3.0
      VOCAL_MAX_PCT: 10.0
    precision: "inputs compared exactly as provided (no rounding)"

  - name: cooler_occupancy
    trigger: "on FinishedLot creation (PRODUCED), ship (PRODUCED -> SHIPPED), quarantine cascade (PRODUCED -> QUARANTINED), and spoilage (PRODUCED -> SPOILED)"
    algorithm: aggregation
    formula: |
      cooler_occupied_lbs = sum(FinishedLot.total_weight_lbs
                                where FinishedLot.production_day.plant_id == plant.id
                                  and status in {PRODUCED, QUARANTINED, SPOILED})
      Creation gate: rejected when cooler_occupied_lbs + new_total_weight_lbs > cooler_capacity_lbs
      (occupancy exactly equal to capacity is allowed).
      Invariant: cooler_occupied_lbs is always >= 0 and <= cooler_capacity_lbs;
      create adds exactly total_weight_lbs, ship removes exactly total_weight_lbs.
    input_set: "FinishedLots of the plant with status in {PRODUCED, QUARANTINED, SPOILED}; SHIPPED lots are excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: day_yield_reconciliation
    trigger: "on ProductionDay -> CLOSED (POST /production-days/{id}/close)"
    algorithm: aggregation
    formula: |
      total_cut_weight_lbs  = sum(lot.total_cut_weight_lbs  for lots of the day with status == FABRICATED)
      total_cold_weight_lbs = sum(lot.cold_carcass_weight_lbs for lots of the day with status == FABRICATED)
      day_yield_pct = round_half_up(100 * total_cut_weight_lbs / total_cold_weight_lbs, 2)
                      (null when total_cold_weight_lbs == 0)
    input_set: "CarcassLots of the day with status FABRICATED; CONDEMNED lots are excluded from both sums"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; evaluated low-number first)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "for check-in/check-out: X-User-ID equals shift.inspector_user_id", error_id: ERR_CHECKIN_IDENTITY_MISMATCH, http_status: 403, applies_to: ["POST /inspector-shifts/{id}/check-in", "POST /inspector-shifts/{id}/check-out"] }
  - { priority: 4, category: existence, check: "request body schema: required fields present, types/enum members valid, numeric ranges respected (min<max on CCP limits is checked at priority 12)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "every path id exists, validated left-to-right; child whose parent FK does not match the path parent is treated as not found", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "HACCPPlan transition from-state valid (submit: DRAFT|REJECTED; approve/reject: SUBMITTED; activate: APPROVED; CCP create: plan DRAFT)", error_id: ERR_PLAN_INVALID_STATE, http_status: 409, applies_to: ["POST /haccp-plans/{id}/submit", "POST /haccp-plans/{id}/approve", "POST /haccp-plans/{id}/reject", "POST /haccp-plans/{id}/activate", "POST /haccp-plans/{id}/ccps"] }
  - { priority: 7, category: state, check: "ProductionDay transition from-state valid (open: PLANNED|SUSPENDED; suspend: OPEN; close: OPEN|SUSPENDED and no OPEN/ACTION_LOGGED deviations and all lots in {FABRICATED, CONDEMNED})", error_id: ERR_DAY_INVALID_STATE, http_status: 409, applies_to: ["POST /production-days/{id}/open", "POST /production-days/{id}/suspend", "POST /production-days/{id}/close"] }
  - { priority: 8, category: state, check: "owning ProductionDay.status == OPEN for lot receive/processing/packaging/sampling/auditing operations", error_id: ERR_DAY_NOT_OPEN, http_status: 409, applies_to: ["POST /production-days/{id}/lots", "POST /lots/{id}/pass-ante-mortem", "POST /lots/{id}/harvest", "POST /lots/{id}/chill-complete", "POST /lots/{id}/fabricate", "POST /lots/{id}/complete-fabrication", "POST /lots/{id}/cut-records", "POST /lots/{id}/pathogen-samples", "POST /production-days/{id}/finished-lots", "POST /plants/{id}/humane-audits"] }
  - { priority: 9, category: state, check: "CarcassLot transition from-state valid (ante-mortem: RECEIVED; harvest: CLEARED; chill-complete: HARVESTED; fabricate: CHILLED|RELEASED; complete-fabrication: FABRICATING; release-hold: HELD; sample: HARVESTED|CHILLED|FABRICATING|FABRICATED|HELD)", error_id: ERR_LOT_INVALID_STATE, http_status: 409, applies_to: ["POST /lots/{id}/pass-ante-mortem", "POST /lots/{id}/harvest", "POST /lots/{id}/chill-complete", "POST /lots/{id}/fabricate", "POST /lots/{id}/complete-fabrication", "POST /lots/{id}/release-hold", "POST /lots/{id}/pathogen-samples"] }
  - { priority: 10, category: state, check: "PathogenSample still PENDING", error_id: ERR_SAMPLE_ALREADY_REPORTED, http_status: 409, applies_to: ["POST /pathogen-samples/{id}/report-result"] }
  - { priority: 11, category: state, check: "LabelApproval transition from-state valid (submit: DRAFT|REJECTED; approve/reject: SUBMITTED; also finished-lot create requires label APPROVED)", error_id: ERR_LABEL_INVALID_STATE, http_status: 409, applies_to: ["POST /label-approvals/{id}/submit", "POST /label-approvals/{id}/approve", "POST /label-approvals/{id}/reject", "POST /production-days/{id}/finished-lots"] }
  - { priority: 12, category: state, check: "FinishedLot status == PRODUCED for ship; status in {PRODUCED, QUARANTINED} for log-temperature", error_id: ERR_FINISHED_LOT_INVALID_STATE, http_status: 409, applies_to: ["POST /finished-lots/{id}/ship", "POST /finished-lots/{id}/log-temperature"] }
  - { priority: 13, category: state, check: "InspectorShift transition from-state valid (check-in: SCHEDULED; check-out: ON_PREMISE)", error_id: ERR_SHIFT_INVALID_STATE, http_status: 409, applies_to: ["POST /inspector-shifts/{id}/check-in", "POST /inspector-shifts/{id}/check-out"] }
  - { priority: 14, category: state, check: "Deviation transition from-state valid (log-corrective-action: OPEN; verify: ACTION_LOGGED)", error_id: ERR_DEVIATION_INVALID_STATE, http_status: 409, applies_to: ["POST /deviations/{id}/log-corrective-action", "POST /deviations/{id}/verify"] }
  - { priority: 15, category: state, check: "NoncomplianceRecord transition from-state valid (appeal: OPEN; resolve: OPEN|APPEALED)", error_id: ERR_NONCOMPLIANCE_INVALID_STATE, http_status: 409, applies_to: ["POST /noncompliance-records/{id}/appeal", "POST /noncompliance-records/{id}/resolve"] }
  - { priority: 16, category: state, check: "RecallExercise still INITIATED", error_id: ERR_RECALL_ALREADY_COMPLETED, http_status: 409, applies_to: ["POST /recall-exercises/{id}/complete"] }
  - { priority: 17, category: business_safety, check: "plant.operating_status == ACTIVE before opening a production day", error_id: ERR_PLANT_SUSPENDED, http_status: 422, applies_to: ["POST /production-days/{id}/open"] }
  - { priority: 18, category: business_safety, check: "at least one InspectorShift of the plant has status ON_PREMISE before opening a production day", error_id: ERR_INSPECTOR_NOT_PRESENT, http_status: 422, applies_to: ["POST /production-days/{id}/open"] }
  - { priority: 19, category: business_safety, check: "no PathogenSample of the source lot has result PENDING or POSITIVE (finished-lot create); a NEGATIVE confirmation newer than the latest POSITIVE exists (release-hold)", error_id: ERR_POSITIVE_PATHOGEN_UNRESOLVED, http_status: 422, applies_to: ["POST /production-days/{id}/finished-lots", "POST /lots/{id}/release-hold"] }
  - { priority: 20, category: business_temporal, check: "new InspectorShift for the same inspector_user_id must not overlap an existing shift in {SCHEDULED, ON_PREMISE}; intervals are half-open [scheduled_start, scheduled_end) so touching endpoints are allowed", error_id: ERR_SHIFT_WINDOW_CONFLICT, http_status: 422, applies_to: ["POST /plants/{id}/inspector-shifts"] }
  - { priority: 21, category: business_temporal, check: "check-in time within [scheduled_start - 15 minutes, scheduled_end] inclusive", error_id: ERR_SHIFT_CHECKIN_OUTSIDE_WINDOW, http_status: 422, applies_to: ["POST /inspector-shifts/{id}/check-in"] }
  - { priority: 22, category: business_temporal, check: "logical clock now <= use_by_at (inclusive) when shipping", error_id: ERR_SHELF_LIFE_EXPIRED, http_status: 422, applies_to: ["POST /finished-lots/{id}/ship"] }
  - { priority: 23, category: business_temporal, check: "logical clock date == production_date when opening a production day", error_id: ERR_DAY_DATE_MISMATCH, http_status: 422, applies_to: ["POST /production-days/{id}/open"] }
  - { priority: 24, category: business_temporal, check: "an OPEN ProductionDay exists for the plant whose production_date equals the current logical-clock date when recording an observation", error_id: ERR_NO_OPEN_PRODUCTION_DAY, http_status: 422, applies_to: ["POST /ccps/{id}/observations"] }
  - { priority: 25, category: business_referential, check: "CCP's HACCPPlan status == EFFECTIVE when recording an observation; day open requires an EFFECTIVE plan for (plant, process_type)", error_id: ERR_PLAN_NOT_EFFECTIVE, http_status: 422, applies_to: ["POST /ccps/{id}/observations", "POST /production-days/{id}/open"] }
  - { priority: 26, category: business_referential, check: "label approval is the latest-approved LabelApproval for its (plant, product_name): no other APPROVED label for the same product_name whose approve transition executed later", error_id: ERR_LABEL_VERSION_STALE, http_status: 422, applies_to: ["POST /production-days/{id}/finished-lots"] }
  - { priority: 27, category: business_referential, check: "target FinishedLot belongs to the path plant", error_id: ERR_RECALL_TARGET_INVALID, http_status: 422, applies_to: ["POST /plants/{id}/recall-exercises"] }
  - { priority: 28, category: business_constraint, check: "CCP limits: at least one of critical_limit_min_f / critical_limit_max_f present, and min < max when both present", error_id: ERR_CCP_LIMIT_INVALID, http_status: 422, applies_to: ["POST /haccp-plans/{id}/ccps"] }
  - { priority: 29, category: business_constraint, check: "plan submit requires at least one CriticalControlPoint", error_id: ERR_PLAN_HAS_NO_CCP, http_status: 422, applies_to: ["POST /haccp-plans/{id}/submit"] }
  - { priority: 30, category: business_constraint, check: "no other HACCPPlan of the same plant with the same process_type in {DRAFT, SUBMITTED, APPROVED} at plan creation", error_id: ERR_DUPLICATE_ACTIVE_PLAN, http_status: 422, applies_to: ["POST /plants/{id}/haccp-plans"] }
  - { priority: 31, category: business_constraint, check: "at most one non-CLOSED ProductionDay per (plant, production_date)", error_id: ERR_DUPLICATE_PRODUCTION_DAY, http_status: 422, applies_to: ["POST /plants/{id}/production-days"] }
  - { priority: 32, category: business_constraint, check: "mass balance at complete-fabrication: at least one CutRecord and |total_cut_weight_lbs + trim_waste_lbs - cold_carcass_weight_lbs| <= 0.5", error_id: ERR_MASS_BALANCE_VIOLATION, http_status: 422, applies_to: ["POST /lots/{id}/complete-fabrication"] }
  - { priority: 33, category: business_constraint, check: "cooler capacity: cooler_occupied_lbs + new lot total_weight_lbs <= cooler_capacity_lbs (equal is allowed)", error_id: ERR_COOLER_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /production-days/{id}/finished-lots"] }
  - { priority: 34, category: business_constraint, check: "label submit requires at least one substantiation doc ref per claim", error_id: ERR_CLAIM_SUBSTANTIATION_MISSING, http_status: 422, applies_to: ["POST /label-approvals/{id}/submit"] }
  - { priority: 35, category: business_constraint, check: "segregation of duties: deviation verifier differs from the observation's monitor_user_id and from action_logged_by; NR resolver differs from created_by", error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 403, applies_to: ["POST /deviations/{id}/verify", "POST /noncompliance-records/{id}/resolve"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "authenticated role is not in the endpoint's roles list" }
  - { id: ERR_CHECKIN_IDENTITY_MISMATCH, http: 403, condition: "check-in/check-out X-User-ID does not equal the shift's inspector_user_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum member, or numeric range violation in the request body" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id does not exist (validated left-to-right), or child's parent FK does not match the path parent" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "HACCPPlan not in the required from-state for the requested transition (including CCP create on a non-DRAFT plan)" }
  - { id: ERR_DAY_INVALID_STATE, http: 409, condition: "ProductionDay not in the required from-state, or close blocked by unresolved deviations / non-terminal lots" }
  - { id: ERR_DAY_NOT_OPEN, http: 409, condition: "child operation requires the owning ProductionDay to be OPEN" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "CarcassLot not in the required from-state for the requested transition" }
  - { id: ERR_SAMPLE_ALREADY_REPORTED, http: 409, condition: "PathogenSample result already reported (sample not PENDING)" }
  - { id: ERR_LABEL_INVALID_STATE, http: 409, condition: "LabelApproval not in the required from-state, or finished-lot create references a non-APPROVED label" }
  - { id: ERR_FINISHED_LOT_INVALID_STATE, http: 409, condition: "FinishedLot not PRODUCED (ship) or not in {PRODUCED, QUARANTINED} (log-temperature)" }
  - { id: ERR_SHIFT_INVALID_STATE, http: 409, condition: "InspectorShift not SCHEDULED (check-in) or not ON_PREMISE (check-out)" }
  - { id: ERR_DEVIATION_INVALID_STATE, http: 409, condition: "Deviation not OPEN (log-corrective-action) or not ACTION_LOGGED (verify)" }
  - { id: ERR_NONCOMPLIANCE_INVALID_STATE, http: 409, condition: "NoncomplianceRecord not OPEN (appeal) or not in {OPEN, APPEALED} (resolve)" }
  - { id: ERR_RECALL_ALREADY_COMPLETED, http: 409, condition: "RecallExercise already PASSED or FAILED" }
  - { id: ERR_PLANT_SUSPENDED, http: 422, condition: "production day open blocked because plant operating_status is SUSPENDED" }
  - { id: ERR_INSPECTOR_NOT_PRESENT, http: 422, condition: "production day open blocked because no InspectorShift of the plant is ON_PREMISE" }
  - { id: ERR_POSITIVE_PATHOGEN_UNRESOLVED, http: 422, condition: "source lot has a PENDING or POSITIVE PathogenSample (finished-lot create), or no NEGATIVE confirmation newer than the latest POSITIVE exists (release-hold)" }
  - { id: ERR_SHIFT_WINDOW_CONFLICT, http: 422, condition: "new shift overlaps an existing {SCHEDULED, ON_PREMISE} shift of the same inspector; half-open [start, end) intervals, touching endpoints allowed" }
  - { id: ERR_SHIFT_CHECKIN_OUTSIDE_WINDOW, http: 422, condition: "check-in outside [scheduled_start - 15 minutes, scheduled_end]" }
  - { id: ERR_SHELF_LIFE_EXPIRED, http: 422, condition: "ship attempted when logical clock now is strictly after use_by_at" }
  - { id: ERR_DAY_DATE_MISMATCH, http: 422, condition: "production day open attempted when the logical-clock date differs from production_date" }
  - { id: ERR_NO_OPEN_PRODUCTION_DAY, http: 422, condition: "observation recorded while no OPEN ProductionDay exists for the plant on the current logical-clock date" }
  - { id: ERR_PLAN_NOT_EFFECTIVE, http: 422, condition: "observation against a CCP whose plan is not EFFECTIVE, or day open without an EFFECTIVE plan for (plant, process_type)" }
  - { id: ERR_LABEL_VERSION_STALE, http: 422, condition: "label approval is not the latest-approved LabelApproval for its (plant, product_name)" }
  - { id: ERR_RECALL_TARGET_INVALID, http: 422, condition: "target FinishedLot does not belong to the path plant" }
  - { id: ERR_CCP_LIMIT_INVALID, http: 422, condition: "CCP has neither limit set, or critical_limit_min_f >= critical_limit_max_f" }
  - { id: ERR_PLAN_HAS_NO_CCP, http: 422, condition: "plan submit attempted with zero CriticalControlPoints" }
  - { id: ERR_DUPLICATE_ACTIVE_PLAN, http: 422, condition: "another HACCPPlan for the same (plant, process_type) already exists in {DRAFT, SUBMITTED, APPROVED}" }
  - { id: ERR_DUPLICATE_PRODUCTION_DAY, http: 422, condition: "a non-CLOSED ProductionDay for the same (plant, production_date) already exists" }
  - { id: ERR_MASS_BALANCE_VIOLATION, http: 422, condition: "complete-fabrication with zero cut records, or cuts + trim waste deviates from cold carcass weight by more than 0.5 lbs" }
  - { id: ERR_COOLER_CAPACITY_EXCEEDED, http: 422, condition: "finished-lot create would push cooler_occupied_lbs strictly above cooler_capacity_lbs" }
  - { id: ERR_CLAIM_SUBSTANTIATION_MISSING, http: 422, condition: "label submit with fewer substantiation doc refs than claims" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "deviation verifier equals the observation monitor or the action logger; or NR resolver equals created_by" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Plant ---
  - { method: POST, path: "/plants", description: "Register a USDA-inspected plant", roles: [PlantAdmin], code: 201, input: [establishment_number, name, district_code, cooler_capacity_lbs], output: Plant, side_effects: ["operating_status initialized ACTIVE", "compliance scores initialized to 100", "cooler_occupied_lbs initialized 0"] }
  - { method: GET, path: "/plants/{id}", description: "Plant detail including posture and compliance scores", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: Plant, side_effects: [] }

  # --- HACCPPlan ---
  - { method: POST, path: "/plants/{id}/haccp-plans", description: "Create a HACCP plan in DRAFT for a process type", roles: [QAManager], code: 201, input: [process_type], output: HACCPPlan, side_effects: ["status := DRAFT", "revision_number := 0"] }
  - { method: GET, path: "/haccp-plans/{id}", description: "HACCP plan detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: HACCPPlan, side_effects: [] }
  - { method: GET, path: "/haccp-plans", description: "List HACCP plans", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "process_type?", "status?", "limit?", "offset?"], output: "HACCPPlan[]", side_effects: [] }
  - { method: POST, path: "/haccp-plans/{id}/submit", description: "Submit plan for review; also resubmits a REJECTED plan (revision_number += 1)", roles: [QAManager], code: 200, input: [], output: HACCPPlan, side_effects: ["DRAFT|REJECTED -> SUBMITTED", "submitted_at := now"] }
  - { method: POST, path: "/haccp-plans/{id}/approve", description: "Inspector approves a SUBMITTED plan", roles: [Inspector], code: 200, input: [], output: HACCPPlan, side_effects: ["SUBMITTED -> APPROVED", "approved_by := X-User-ID", "approved_at := now"] }
  - { method: POST, path: "/haccp-plans/{id}/reject", description: "Inspector rejects a SUBMITTED plan", roles: [Inspector], code: 200, input: [rejection_reason], output: HACCPPlan, side_effects: ["SUBMITTED -> REJECTED", "rejection_reason recorded"] }
  - { method: POST, path: "/haccp-plans/{id}/activate", description: "Activate an APPROVED plan; supersedes the currently EFFECTIVE plan for the same (plant, process_type)", roles: [QAManager], code: 200, input: [], output: HACCPPlan, side_effects: ["APPROVED -> EFFECTIVE", "prior EFFECTIVE sibling -> SUPERSEDED"] }

  # --- CriticalControlPoint ---
  - { method: POST, path: "/haccp-plans/{id}/ccps", description: "Add a CCP to a DRAFT plan", roles: [QAManager], code: 201, input: [ccp_code, hazard_category, description, monitoring_frequency_minutes, "critical_limit_min_f?", "critical_limit_max_f?"], output: CriticalControlPoint, side_effects: ["deviation_severity computed from hazard_category"] }
  - { method: GET, path: "/ccps/{id}", description: "CCP detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: CriticalControlPoint, side_effects: [] }
  - { method: GET, path: "/ccps", description: "List CCPs", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["haccp_plan_id?", "hazard_category?", "limit?", "offset?"], output: "CriticalControlPoint[]", side_effects: [] }

  # --- CCPObservation ---
  - { method: POST, path: "/ccps/{id}/observations", description: "Record a CCP monitoring observation; attaches to the plant's OPEN production day for the current clock date; spawns a Deviation when out of limits", roles: [QATech], code: 201, input: [observed_value_f], output: CCPObservation, side_effects: ["within_limit computed (inclusive limits)", "monitor_user_id := X-User-ID", "production_day_id := the plant's OPEN day for the current date", "when within_limit == false: create Deviation (OPEN) copying CCP deviation_severity, set deviation_id, recompute plant compliance scores, recompute day posture"] }
  - { method: GET, path: "/observations/{id}", description: "Observation detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: CCPObservation, side_effects: [] }
  - { method: GET, path: "/observations", description: "List observations", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["ccp_id?", "production_day_id?", "within_limit?", "limit?", "offset?"], output: "CCPObservation[]", side_effects: [] }

  # --- Deviation ---
  - { method: GET, path: "/deviations/{id}", description: "Deviation detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: Deviation, side_effects: [] }
  - { method: GET, path: "/deviations", description: "List deviations", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["ccp_id?", "production_day_id?", "observation_id?", "status?", "limit?", "offset?"], output: "Deviation[]", side_effects: [] }
  - { method: POST, path: "/deviations/{id}/log-corrective-action", description: "Record corrective action; OPEN -> ACTION_LOGGED", roles: [QAManager], code: 200, input: [corrective_action_note], output: Deviation, side_effects: ["action_logged_by := X-User-ID", "recompute plant provisional_compliance_score and day posture"] }
  - { method: POST, path: "/deviations/{id}/verify", description: "Verify a corrective action; ACTION_LOGGED -> VERIFIED; verifier must differ from monitor and action logger", roles: [QAManager], code: 200, input: [], output: Deviation, side_effects: ["verified_by := X-User-ID", "recompute plant official/provisional compliance scores", "recompute day posture"] }

  # --- InspectorShift ---
  - { method: POST, path: "/plants/{id}/inspector-shifts", description: "Schedule an inspector coverage shift; half-open overlap check per inspector", roles: [PlantAdmin], code: 201, input: [inspector_user_id, scheduled_start, scheduled_end], output: InspectorShift, side_effects: ["status := SCHEDULED"] }
  - { method: GET, path: "/inspector-shifts/{id}", description: "Shift detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: InspectorShift, side_effects: [] }
  - { method: GET, path: "/inspector-shifts", description: "List shifts", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "inspector_user_id?", "status?", "limit?", "offset?"], output: "InspectorShift[]", side_effects: [] }
  - { method: POST, path: "/inspector-shifts/{id}/check-in", description: "Inspector checks in (identity + window enforced); SCHEDULED -> ON_PREMISE", roles: [Inspector], code: 200, input: [], output: InspectorShift, side_effects: ["checked_in_at := now"] }
  - { method: POST, path: "/inspector-shifts/{id}/check-out", description: "Inspector checks out; when the last ON_PREMISE shift of the plant departs, OPEN production days of the plant are SUSPENDED", roles: [Inspector], code: 200, input: [], output: InspectorShift, side_effects: ["ON_PREMISE -> DEPARTED", "checked_out_at := now", "conditional cascade: no remaining ON_PREMISE shift for plant -> OPEN ProductionDays -> SUSPENDED"] }

  # --- ProductionDay ---
  - { method: POST, path: "/plants/{id}/production-days", description: "Plan a production day", roles: [ProductionManager], code: 201, input: [production_date, process_type], output: ProductionDay, side_effects: ["status := PLANNED", "posture := CLEAR"] }
  - { method: GET, path: "/production-days/{id}", description: "Production day detail including posture and totals", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: ProductionDay, side_effects: [] }
  - { method: GET, path: "/production-days", description: "List production days", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "production_date?", "status?", "limit?", "offset?"], output: "ProductionDay[]", side_effects: [] }
  - { method: POST, path: "/production-days/{id}/open", description: "Open a PLANNED day or resume a SUSPENDED day; requires plant ACTIVE, inspector ON_PREMISE, EFFECTIVE plan, and clock date == production_date", roles: [ProductionManager], code: 200, input: [], output: ProductionDay, side_effects: ["PLANNED|SUSPENDED -> OPEN", "recompute posture"] }
  - { method: POST, path: "/production-days/{id}/suspend", description: "Suspend an OPEN day", roles: [ProductionManager], code: 200, input: [], output: ProductionDay, side_effects: ["OPEN -> SUSPENDED"] }
  - { method: POST, path: "/production-days/{id}/close", description: "Close a day; requires no OPEN/ACTION_LOGGED deviations and all lots terminal; freezes yield reconciliation", roles: [ProductionManager], code: 200, input: [], output: ProductionDay, side_effects: ["OPEN|SUSPENDED -> CLOSED", "day_yield_reconciliation computed"] }

  # --- CarcassLot ---
  - { method: POST, path: "/production-days/{id}/lots", description: "Receive a livestock lot on an OPEN day", roles: [ProductionManager], code: 201, input: [species, supplier_name, head_count, live_weight_lbs], output: CarcassLot, side_effects: ["status := RECEIVED"] }
  - { method: GET, path: "/lots/{id}", description: "Lot detail including yield accounting fields", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: CarcassLot, side_effects: [] }
  - { method: GET, path: "/lots", description: "List lots", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["production_day_id?", "status?", "species?", "limit?", "offset?"], output: "CarcassLot[]", side_effects: [] }
  - { method: POST, path: "/lots/{id}/pass-ante-mortem", description: "Inspector passes ante-mortem inspection; RECEIVED -> CLEARED", roles: [Inspector], code: 200, input: [], output: CarcassLot, side_effects: [] }
  - { method: POST, path: "/lots/{id}/harvest", description: "Record harvest and hot carcass weight; CLEARED -> HARVESTED", roles: [ProductionManager], code: 200, input: [hot_carcass_weight_lbs], output: CarcassLot, side_effects: ["hot_carcass_weight_lbs recorded"] }
  - { method: POST, path: "/lots/{id}/chill-complete", description: "Record cold carcass weight after chill; HARVESTED -> CHILLED; computes drip loss", roles: [ProductionManager], code: 200, input: [cold_carcass_weight_lbs], output: CarcassLot, side_effects: ["drip_loss_pct computed"] }
  - { method: POST, path: "/lots/{id}/fabricate", description: "Begin fabrication; CHILLED|RELEASED -> FABRICATING", roles: [ProductionManager], code: 200, input: [], output: CarcassLot, side_effects: [] }
  - { method: POST, path: "/lots/{id}/complete-fabrication", description: "Close out fabrication with trim waste; enforces mass balance and computes yields and grade; FABRICATING -> FABRICATED", roles: [ProductionManager], code: 200, input: [trim_waste_lbs], output: CarcassLot, side_effects: ["carcass_cutout_yield computed (fabrication_yield_pct, packer_yield_pct, yield_grade)", "day totals recomputed"] }
  - { method: POST, path: "/lots/{id}/release-hold", description: "Release a HELD lot after a confirming NEGATIVE retest; HELD -> RELEASED", roles: [QAManager], code: 200, input: [disposition_note], output: CarcassLot, side_effects: ["recompute day posture"] }

  # --- CutRecord ---
  - { method: POST, path: "/lots/{id}/cut-records", description: "Record a cut against a FABRICATING lot; per-line pct_of_cold_weight rounded per line", roles: [ProductionManager], code: 201, input: [primal_type, weight_lbs], output: CutRecord, side_effects: ["pct_of_cold_weight computed (round_half_up 2dp)", "lot.total_cut_weight_lbs += weight_lbs"] }
  - { method: GET, path: "/cut-records/{id}", description: "Cut record detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: CutRecord, side_effects: [] }
  - { method: GET, path: "/cut-records", description: "List cut records", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["lot_id?", "primal_type?", "limit?", "offset?"], output: "CutRecord[]", side_effects: [] }

  # --- PathogenSample ---
  - { method: POST, path: "/lots/{id}/pathogen-samples", description: "Collect a pathogen sample on a lot (HARVESTED through FABRICATED, or HELD for confirmation)", roles: [QATech], code: 201, input: [organism, sample_type], output: PathogenSample, side_effects: ["result := PENDING", "collected_by := X-User-ID", "is_confirmation computed"] }
  - { method: GET, path: "/pathogen-samples/{id}", description: "Sample detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: PathogenSample, side_effects: [] }
  - { method: GET, path: "/pathogen-samples", description: "List samples", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["lot_id?", "result?", "organism?", "limit?", "offset?"], output: "PathogenSample[]", side_effects: [] }
  - { method: POST, path: "/pathogen-samples/{id}/report-result", description: "Lab reports NEGATIVE or POSITIVE; POSITIVE cascades lot -> HELD (or CONDEMNED on confirmation), finished lots -> QUARANTINED, day posture -> RESTRICTED", roles: [LabAnalyst], code: 200, input: [result], output: PathogenSample, side_effects: ["PENDING -> result", "reported_at := now", "POSITIVE cascade per state machine"] }

  # --- LabelApproval ---
  - { method: POST, path: "/plants/{id}/label-approvals", description: "Draft a label approval application with claims and substantiation", roles: [QAManager], code: 201, input: [product_name, claims, substantiation_doc_refs, formulation_version], output: LabelApproval, side_effects: ["status := DRAFT"] }
  - { method: GET, path: "/label-approvals/{id}", description: "Label approval detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: LabelApproval, side_effects: [] }
  - { method: GET, path: "/label-approvals", description: "List label approvals", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "status?", "product_name?", "limit?", "offset?"], output: "LabelApproval[]", side_effects: [] }
  - { method: POST, path: "/label-approvals/{id}/submit", description: "Submit (or resubmit a REJECTED) label; every claim requires a substantiation ref", roles: [QAManager], code: 200, input: [], output: LabelApproval, side_effects: ["DRAFT|REJECTED -> SUBMITTED"] }
  - { method: POST, path: "/label-approvals/{id}/approve", description: "Inspector approves label; pins approved_formulation_version := formulation_version", roles: [Inspector], code: 200, input: [], output: LabelApproval, side_effects: ["SUBMITTED -> APPROVED", "approved_formulation_version pinned", "approved_by := X-User-ID"] }
  - { method: POST, path: "/label-approvals/{id}/reject", description: "Inspector rejects a SUBMITTED label", roles: [Inspector], code: 200, input: [rejection_reason], output: LabelApproval, side_effects: ["SUBMITTED -> REJECTED", "rejection_reason recorded"] }

  # --- FinishedLot ---
  - { method: POST, path: "/production-days/{id}/finished-lots", description: "Pack finished product from a FABRICATED lot under an APPROVED, latest-version label; computes dating and debits cooler capacity", roles: [ProductionManager], code: 201, input: [source_lot_id, label_approval_id, units_produced, unit_weight_lbs, shelf_life_days], output: FinishedLot, side_effects: ["total_weight_lbs computed", "production_date := now", "base_use_by_at and use_by_at computed", "Plant.cooler_occupied_lbs += total_weight_lbs"] }
  - { method: GET, path: "/finished-lots/{id}", description: "Finished lot detail including dating and temperature log", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: FinishedLot, side_effects: [] }
  - { method: GET, path: "/finished-lots", description: "List finished lots", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["production_day_id?", "source_lot_id?", "label_approval_id?", "status?", "limit?", "offset?"], output: "FinishedLot[]", side_effects: [] }
  - { method: POST, path: "/finished-lots/{id}/ship", description: "Ship a PRODUCED lot; inclusive use_by_at gate; credits cooler capacity", roles: [ProductionManager], code: 200, input: [], output: FinishedLot, side_effects: ["PRODUCED -> SHIPPED", "shipped_at := now", "Plant.cooler_occupied_lbs -= total_weight_lbs"] }
  - { method: POST, path: "/finished-lots/{id}/log-temperature", description: "Append a cold-chain temperature reading at the current logical clock; recomputes abuse penalty, use_by_at, and possible auto-SPOILED", roles: [ProductionManager], code: 200, input: [temp_f], output: FinishedLot, side_effects: ["append {recorded_at: now, temp_f} to temperature_logs", "shelf_life_dating recomputed (penalty_hours, use_by_at)", "auto-transition PRODUCED -> SPOILED when use_by_at < now"] }

  # --- HumaneHandlingAudit ---
  - { method: POST, path: "/plants/{id}/humane-audits", description: "Record a humane-handling audit on an OPEN production day; outcome computed from thresholds; FAILED cascades to NR, plant suspension, day suspension", roles: [Inspector], code: 201, input: [production_day_id, stunning_efficacy_pct, slips_falls_pct, vocalization_pct], output: HumaneHandlingAudit, side_effects: ["outcome computed", "auditor_user_id := X-User-ID", "when FAILED: create NoncomplianceRecord (HUMANE_HANDLING, CRITICAL, created_by := auditor), plant -> SUSPENDED, OPEN days -> SUSPENDED"] }
  - { method: GET, path: "/humane-audits/{id}", description: "Audit detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: HumaneHandlingAudit, side_effects: [] }
  - { method: GET, path: "/humane-audits", description: "List humane handling audits", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "production_day_id?", "outcome?", "limit?", "offset?"], output: "HumaneHandlingAudit[]", side_effects: [] }

  # --- NoncomplianceRecord ---
  - { method: GET, path: "/noncompliance-records/{id}", description: "NR detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: NoncomplianceRecord, side_effects: [] }
  - { method: GET, path: "/noncompliance-records", description: "List noncompliance records", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "production_day_id?", "category?", "status?", "limit?", "offset?"], output: "NoncomplianceRecord[]", side_effects: [] }
  - { method: POST, path: "/noncompliance-records/{id}/appeal", description: "QA appeals an OPEN NR; OPEN -> APPEALED", roles: [QAManager], code: 200, input: [appeal_note], output: NoncomplianceRecord, side_effects: ["appeal_note recorded"] }
  - { method: POST, path: "/noncompliance-records/{id}/resolve", description: "Inspector closes an NR; resolver must differ from created_by; may reactivate the plant", roles: [Inspector], code: 200, input: [resolution_note], output: NoncomplianceRecord, side_effects: ["OPEN|APPEALED -> CLOSED", "resolved_by := X-User-ID", "recompute plant operating_status"] }

  # --- RecallExercise ---
  - { method: POST, path: "/plants/{id}/recall-exercises", description: "Initiate a traceability drill against a finished lot of this plant; deadline = now + 24h; basis weight snapshotted", roles: [PlantAdmin], code: 201, input: [target_finished_lot_id, scope], output: RecallExercise, side_effects: ["status := INITIATED", "initiated_at := now", "deadline_at := now + 24h", "basis_weight_lbs := target lot total_weight_lbs"] }
  - { method: GET, path: "/recall-exercises/{id}", description: "Recall exercise detail", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: [], output: RecallExercise, side_effects: [] }
  - { method: GET, path: "/recall-exercises", description: "List recall exercises", roles: [PlantAdmin, QAManager, QATech, LabAnalyst, Inspector, ProductionManager], code: 200, input: ["plant_id?", "target_finished_lot_id?", "status?", "limit?", "offset?"], output: "RecallExercise[]", side_effects: [] }
  - { method: POST, path: "/recall-exercises/{id}/complete", description: "Complete the drill with reconciled weight; PASSED when within deadline and recovery >= 99.5%; FAILED cascades to a TRACEABILITY NR and plant suspension", roles: [QAManager], code: 200, input: [reconciled_weight_lbs], output: RecallExercise, side_effects: ["recovery_pct computed", "INITIATED -> PASSED|FAILED", "when FAILED: create TRACEABILITY CRITICAL NR (created_by := X-User-ID), plant -> SUSPENDED, OPEN days -> SUSPENDED"] }

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Advancing the clock sweeps SCHEDULED InspectorShifts whose scheduled_end has passed to NO_SHOW (ordered by scheduled_end ASC, tie-break created_at ASC)."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601", "NO_SHOW sweep for expired SCHEDULED shifts"]

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant platform administrator: registers plants, schedules inspector shifts, initiates recall exercises, drives the test clock"
    identity: opaque
    exclusive_operations: ["POST /plants", "POST /plants/{id}/inspector-shifts", "POST /plants/{id}/recall-exercises", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: QAManager
    description: "Quality assurance manager: owns HACCP plans, CCPs, label applications, deviation disposition, hold release, NR appeals, recall completion"
    identity: opaque
    exclusive_operations: ["POST /plants/{id}/haccp-plans", "POST /haccp-plans/{id}/submit", "POST /haccp-plans/{id}/activate", "POST /haccp-plans/{id}/ccps", "POST /deviations/{id}/log-corrective-action", "POST /deviations/{id}/verify", "POST /lots/{id}/release-hold", "POST /plants/{id}/label-approvals", "POST /label-approvals/{id}/submit", "POST /noncompliance-records/{id}/appeal", "POST /recall-exercises/{id}/complete"]
    shared_operations: ["all GET endpoints"]
  - name: QATech
    description: "QA technician: records CCP monitoring observations and collects pathogen samples (the monitoring arm of segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /ccps/{id}/observations", "POST /lots/{id}/pathogen-samples"]
    shared_operations: ["all GET endpoints"]
  - name: LabAnalyst
    description: "Laboratory analyst: reports pathogen sample results"
    identity: opaque
    exclusive_operations: ["POST /pathogen-samples/{id}/report-result"]
    shared_operations: ["all GET endpoints"]
  - name: Inspector
    description: "USDA FSIS inspector: checks in/out of coverage shifts, approves/rejects HACCP plans and labels, passes ante-mortem inspection, performs humane handling audits, resolves noncompliance records"
    identity: opaque
    exclusive_operations: ["POST /inspector-shifts/{id}/check-in", "POST /inspector-shifts/{id}/check-out", "POST /haccp-plans/{id}/approve", "POST /haccp-plans/{id}/reject", "POST /label-approvals/{id}/approve", "POST /label-approvals/{id}/reject", "POST /lots/{id}/pass-ante-mortem", "POST /plants/{id}/humane-audits", "POST /noncompliance-records/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionManager
    description: "Production manager: runs production days, lot processing, fabrication, finished goods, cold-chain logging, shipping"
    identity: opaque
    exclusive_operations: ["POST /plants/{id}/production-days", "POST /production-days/{id}/open", "POST /production-days/{id}/suspend", "POST /production-days/{id}/close", "POST /production-days/{id}/lots", "POST /lots/{id}/harvest", "POST /lots/{id}/chill-complete", "POST /lots/{id}/fabricate", "POST /lots/{id}/complete-fabrication", "POST /lots/{id}/cut-records", "POST /production-days/{id}/finished-lots", "POST /finished-lots/{id}/ship", "POST /finished-lots/{id}/log-temperature"]
    shared_operations: ["all GET endpoints"]
