# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1592 charity thrift store. 9 rules x >=2 instances = 23 instances.
# All recipes drive empty-DB -> target state using only §1.5 endpoints.
# Logical clock default: 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_item_value
        grounds:
          - calculations.calc_provisional_item_value
          - calculations.calc_suggested_price
          - entities.DonationItem.fields.provisional_value_cents
          - entities.DonationItem.fields.base_price_cents
        distinguishing_aspect: |
          Same DonationItem, two sanctioned algorithms on the SAME subject (item value):
          provisional_intake uses the flat CATEGORY_FMV table (800 x 0.7 = 560), while
          final_price uses the ACTIVE guideline matrix (2000 x 0.8 x 1.0 = 1600). The two
          variants MUST coexist on one item and differ; the receipt path consumes the
          provisional value, the floor consumes the final price.
        test_recipe:
          setup:
            - "ACTIVE guideline for CLOTHING: base_cents 2000, demand_multiplier 1.0"
            - "Donor D and batch B with one CLOTHING/GOOD item, triaged SALABLE"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D One", address_line: "1 Main St", city: "Springfield", state: "IL", postal_code: "62701" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/items/${i1}/price"
              as: Pricer
          assert:
            - "DonationItem.${i1}.provisional_value_cents == 560"
            - "DonationItem.${i1}.base_price_cents == 1600"
            - "DonationItem.${i1}.current_price_cents == 1600"
            - "DonationItem.${i1}.provisional_value_cents != DonationItem.${i1}.base_price_cents"
            - "DonationItem.${i1}.status == PRICED"

      - name: bale_estimate_vs_settlement
        grounds:
          - calculations.calc_bale_revenue
          - entities.SalvageBale.fields.estimated_revenue_cents
          - entities.SalvageBale.fields.settled_revenue_cents
        distinguishing_aspect: |
          Same SalvageBale at the same 2500 lbs: the estimate variant applies the single
          achieved-tier rate to the whole weight (2500 lbs -> tier rate 8 -> 20000), while
          the settlement variant walks the marginal brackets (500*12 + 1500*10 + 500*8 =
          25000). Different entity domain from provisional_vs_final_item_value (SalvageBale
          revenue vs DonationItem valuation).
        test_recipe:
          setup:
            - "Vendor V with TEXTILES brackets [0,500)->12c, [500,2000)->10c, [2000,inf)->8c"
            - "Batch with five CLOTHING items of 500.0 lbs each, all triaged RECYCLE/TEXTILES"
            - "Bale sealed with V and shipped; one OPEN WeeklyCycle exists for settlement attribution"
          setup_api_calls:
            - call: "POST /api/salvage-vendors"
              payload: { name: "Textile Co", rates: [ { category: "TEXTILES", brackets: [ { up_to_lbs: 500, rate_cents_per_lb: 12 }, { up_to_lbs: 2000, rate_cents_per_lb: 10 }, { up_to_lbs: null, rate_cents_per_lb: 8 } ] } ] }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Bale" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD", weight_lbs: 500.0 }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "FAIR", weight_lbs: 500.0 }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "POOR", weight_lbs: 500.0 }
              as: IntakeAttendant
              captures: { i3: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD", weight_lbs: 500.0 }
              as: IntakeAttendant
              captures: { i4: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "FAIR", weight_lbs: 500.0 }
              as: IntakeAttendant
              captures: { i5: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "POST /api/items/${i3}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "POST /api/items/${i4}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "POST /api/items/${i5}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "GET /api/salvage-bales"
              payload: { category: "TEXTILES", status: "ACCUMULATING" }
              as: StoreManager
              captures: { bale1: "$.data[0].id" }
            - call: "POST /api/salvage-bales/${bale1}/seal"
              payload: { vendor_id: "${v1}" }
              as: StoreManager
              captures: { est_after_seal: $.data.estimated_revenue_cents }
            - call: "POST /api/salvage-bales/${bale1}/ship"
              as: StoreManager
            - call: "POST /api/cycles"
              as: StoreManager
          trigger:
            - call: "POST /api/salvage-bales/${bale1}/settle"
              payload: { actual_weight_lbs: 2500.0 }
              as: FinanceClerk
          assert:
            - "SalvageBale.${bale1}.weight_lbs == 2500.0"
            - "SalvageBale.${bale1}.estimated_revenue_cents == 20000"
            - "SalvageBale.${bale1}.settled_revenue_cents == 25000"
            - "SalvageBale.${bale1}.estimated_revenue_cents != SalvageBale.${bale1}.settled_revenue_cents"
            - "SalvageBale.${bale1}.status == SETTLED"
            - "all five items (i1..i5) are BALED after the seal"

  - rule_id: combinatorial_formula
    instances:
      - name: suggested_price_branch_and_clamp
        grounds:
          - calculations.calc_suggested_price
          - entities.PricingGuideline.fields.demand_multiplier
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: base_cents x condition
          multiplier x demand_multiplier, plus the COLLECTIBLES conditional branch
          (mult = max(mult, 1.2)) and the nested min/max clamp. COLLECTIBLES/POOR at base
          2000 demand 1.5 takes the collectibles floor (1.2, not 0.35) -> 3600;
          HOUSEWARES/POOR at base 200 demand 1.0 computes 70 and clamps UP to the 100-cent
          floor. One formula, two different non-linear behaviors asserted in one instance.
        test_recipe:
          setup:
            - "ACTIVE guidelines: COLLECTIBLES base 2000 demand 1.5; HOUSEWARES base 200 demand default 1.0"
            - "Batch with items I1 COLLECTIBLES/POOR and I2 HOUSEWARES/POOR, both triaged SALABLE"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "COLLECTIBLES", base_cents: 2000, demand_multiplier: 1.5 }
              as: StoreManager
            - call: "POST /api/pricing-guidelines"
              payload: { category: "HOUSEWARES", base_cents: 200 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Price" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "COLLECTIBLES", condition: "POOR" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "HOUSEWARES", condition: "POOR" }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/items/${i2}/price"
              as: Pricer
          assert:
            - "DonationItem.${i1}.base_price_cents == 3600"
            - "DonationItem.${i2}.base_price_cents == 100"
            - "DonationItem.${i2}.current_price_cents == 100"

      - name: bale_settlement_per_bracket_rounding
        grounds:
          - calculations.calc_bale_revenue
          - validations[priority=2]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, pinned per-bracket-then-sum:
          EWASTE at 101.0 lbs with rates 3.353/2.30 settles as round(100 x 3.353) +
          round(1 x 2.30) = 335 + 2 = 337, NOT round(337.60) = 338. Different mode from
          suggested_price_branch_and_clamp (mode a) and mission_pool_tier_keyed_on_gross
          (mode c).
        test_recipe:
          setup:
            - "Vendor V with EWASTE brackets [0,100)->3.353c, [100,500)->2.30c, [500,inf)->1.10c"
            - "Batch with ELECTRONICS items of 100.0 lbs and 1.0 lbs, triaged RECYCLE/EWASTE"
            - "Bale sealed with V and shipped; one OPEN WeeklyCycle exists"
          setup_api_calls:
            - call: "POST /api/salvage-vendors"
              payload: { name: "EWaste Co", rates: [ { category: "EWASTE", brackets: [ { up_to_lbs: 100, rate_cents_per_lb: 3.353 }, { up_to_lbs: 500, rate_cents_per_lb: 2.30 }, { up_to_lbs: null, rate_cents_per_lb: 1.10 } ] } ] }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Round" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "ELECTRONICS", condition: "FAIR", weight_lbs: 100.0 }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "ELECTRONICS", condition: "POOR", weight_lbs: 1.0 }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "RECYCLE", salvage_category: "EWASTE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "RECYCLE", salvage_category: "EWASTE" }
              as: IntakeAttendant
            - call: "GET /api/salvage-bales"
              payload: { category: "EWASTE", status: "ACCUMULATING" }
              as: StoreManager
              captures: { bale1: "$.data[0].id" }
            - call: "POST /api/salvage-bales/${bale1}/seal"
              payload: { vendor_id: "${v1}" }
              as: StoreManager
            - call: "POST /api/salvage-bales/${bale1}/ship"
              as: StoreManager
            - call: "POST /api/cycles"
              as: StoreManager
          trigger:
            - call: "POST /api/salvage-bales/${bale1}/settle"
              payload: { actual_weight_lbs: 101.0 }
              as: FinanceClerk
          assert:
            - "SalvageBale.${bale1}.weight_lbs == 101.0"
            - "SalvageBale.${bale1}.estimated_revenue_cents == 232"
            - "SalvageBale.${bale1}.settled_revenue_cents == 337"

      - name: mission_pool_tier_keyed_on_gross
        grounds:
          - calculations.calc_mission_pool
          - entities.WeeklyCycle.fields.net_revenue_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the reserve
          tier is keyed on gross_pool, not net_pool. With gross 110000 the tier is 15%
          (gross in [100000,500000)) -> reserve 16500 -> net 93500; an implementation that
          keys the tier on the net computes 10% -> net 99000. Mode distinct from (a) and (b).
        test_recipe:
          setup:
            - "OPEN cycle C created at 2026-08-01; one FURNITURE/NEW_WITH_TAGS item priced at exactly 110000 and sold CASH at 2026-08-03"
            - "Till session counted even (variance 0) and CLOSED; cycle closed at 2026-08-05 with net_revenue_cents == 110000"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "FURNITURE", base_cents: 110000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Pool", address_line: "9 Oak Ave" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "FURNITURE", condition: "NEW_WITH_TAGS" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 0 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: StoreManager
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 110000 }
              as: StoreManager
            - call: "POST /api/till-sessions/${s1}/close"
              as: StoreManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: StoreManager
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
              captures: { c1v: $.data.version }
          trigger:
            - call: "POST /api/cycles/${c1}/mission-transfers"
              payload: { expected_cycle_version: "${c1v}", allocations: [ { program: "JOB_TRAINING", pct: 50.000 }, { program: "YOUTH_SERVICES", pct: 30.000 }, { program: "HOUSING_SUPPORT", pct: 20.000 } ] }
              as: FinanceClerk
              as_user_id: "fin-1"
              captures: { t1: $.data.id }
          assert:
            - "WeeklyCycle.${c1}.net_revenue_cents == 110000"
            - "MissionTransfer.${t1}.gross_pool_cents == 110000"
            - "MissionTransfer.${t1}.reserve_pct == 15"
            - "MissionTransfer.${t1}.reserve_cents == 16500"
            - "MissionTransfer.${t1}.net_pool_cents == 93500"
            - "MissionTransfer.${t1}.allocation_amounts amounts == [46750, 28050, 18700] in request order"
            - "MissionTransfer.${t1}.status == DRAFT"

  - rule_id: non_linear_state_machine
    instances:
      - name: item_hold_cycle_exempts_markdown
        grounds:
          - state_machines.DonationItem.ON_FLOOR_to_ON_HOLD
          - state_machines.DonationItem.ON_HOLD_to_ON_FLOOR
          - calculations.calc_markdown_price
        distinguishing_aspect: |
          Cyclic shape on DonationItem (ON_FLOOR -> ON_HOLD -> ON_FLOOR, re-enterable):
          the held item survives a cycle-close + markdown-run unchanged (ON_HOLD is exempt
          from calc_markdown_price), while its sibling on the floor advances round 0 -> 1
          (1600 -> 1200). Non-linearity on a DIFFERENT entity than the till and route
          instances below.
        test_recipe:
          setup:
            - "Items A and B (CLOTHING/GOOD, base 2000 -> priced 1600) floored in cycle C1 (seq 1)"
            - "A placed ON_HOLD at 2026-08-01 (expires 2026-08-04); C1 closed, C2 auto-spawned"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Hold" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ia: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ib: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ib}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/price"
              as: Pricer
            - call: "POST /api/items/${ib}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/items/${ia}/to-floor"
              as: Pricer
            - call: "POST /api/items/${ib}/to-floor"
              as: Pricer
            - call: "POST /api/items/${ia}/hold"
              as: Pricer
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c2: "$.data[0].id" }
          trigger:
            - call: "POST /api/cycles/${c2}/run-markdown"
              as: StoreManager
            - call: "POST /api/items/${ia}/release-hold"
              as: Pricer
          assert:
            - "DonationItem.${ia}.status == ON_FLOOR after release-hold (cycled back)"
            - "DonationItem.${ia}.markdown_round == 0"
            - "DonationItem.${ia}.current_price_cents == 1600"
            - "DonationItem.${ib}.status == ON_FLOOR"
            - "DonationItem.${ib}.markdown_round == 1"
            - "DonationItem.${ib}.current_price_cents == 1200"
            - "WeeklyCycle.${c2}.markdown_runs_count == 1"

      - name: till_variance_branch_divergence
        grounds:
          - state_machines.TillSession.OPEN_to_RECONCILED
          - state_machines.TillSession.OPEN_to_PENDING_APPROVAL
          - calculations.calc_till_reconciliation
        distinguishing_aspect: |
          Branching fork on TillSession: the SAME count action diverges on a computed
          branch condition — session 1 (+600 over) takes the PENDING_APPROVAL branch and
          can only reach RECONCILED through the FinanceClerk approval hop, while session 2
          (+500 over) takes the direct RECONCILED branch. Branching shape, distinct from
          DonationItem's cycle and PickupRoute's revert loop.
        test_recipe:
          setup:
            - "Item priced 2000 (CLOTHING/GOOD at base 2500) floored; cashier worker W"
            - "Session S1 float 10000 with one CASH sale of 2000"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2500, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Till" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 10000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
          trigger:
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 12600 }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /api/till-sessions/${s1}/approve-variance"
              as: FinanceClerk
              as_user_id: "fin-1"
            - call: "POST /api/till-sessions/${s1}/close"
              as: StoreManager
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 10000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s2: $.data.id }
            - call: "POST /api/till-sessions/${s2}/count"
              payload: { counted_cash_cents: 10500 }
              as: StoreManager
              as_user_id: "mgr-1"
          assert:
            - "TillSession.${s1}.over_short_cents == 600 and took the PENDING_APPROVAL branch before approval"
            - "TillSession.${s1}.status == CLOSED after close"
            - "TillSession.${s1}.variance_approved_by_user_id == fin-1"
            - "TillSession.${s2}.status == RECONCILED directly from count (no approval hop)"
            - "TillSession.${s2}.over_short_cents == 500"
            - "TillSession.${s2}.variance_approved_by_user_id is null"

      - name: route_unpublish_republish_loop
        grounds:
          - state_machines.PickupRoute.DRAFT_to_PUBLISHED
          - state_machines.PickupRoute.PUBLISHED_to_DRAFT
        distinguishing_aspect: |
          Cyclic revert on PickupRoute (DRAFT -> PUBLISHED -> DRAFT -> PUBLISHED), with the
          revert guarded by "all stops still SCHEDULED" and the empty-route publish rejected.
          Distinct entity and distinct non-linear mechanism from the item hold cycle and
          the till branch.
        test_recipe:
          setup:
            - "STAFF driver W; donors D1, D2; route R (2026-08-10, capacity 500)"
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Drive", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D One" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Two" }
              as: IntakeAttendant
              captures: { d2: $.data.id }
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/pickup-routes/${r1}/publish"
              as: StoreManager
              captures: { e1: $.data.error_id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/publish"
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/unpublish"
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d2}", window_start: "2026-08-10T11:00:00Z", window_end: "2026-08-10T12:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/publish"
              as: StoreManager
          assert:
            - "first publish rejected: ${e1} == ERR_ROUTE_EMPTY"
            - "PickupRoute.${r1}.status == PUBLISHED after the loop"
            - "PickupRoute.${r1}.stop_count == 2"
            - "PickupRoute.${r1}.version == 6 (create + stop + publish + unpublish + stop + publish)"

  - rule_id: transitive_cascade
    instances:
      - name: markdown_pull_cascade
        grounds:
          - state_machines.WeeklyCycle.OPEN_to_OPEN
          - state_machines.DonationItem.ON_FLOOR_to_PULLED_TO_SALVAGE
          - calculations.calc_markdown_price
          - calculations.calc_bale_revenue
        distinguishing_aspect: |
          Depth-3 causal chain with each hop CAUSED by the previous one: run-markdown on
          WeeklyCycle mutates the DonationItem (round 3 + older floor cycle ->
          PULLED_TO_SALVAGE, hop 1); the item's pull assigns it to the ACCUMULATING
          SalvageBale and mutates bale.weight_lbs/item_count (hop 2); that weight mutation
          itself triggers the bale's estimated_revenue_cents recompute (hop 3: 25.0 lbs x
          DEFAULT_EST_RATE 12 = 300, pre-seal). Not a fan-out: the cycle never touches the
          bale directly. Companion void_restore_cascade uses a different trigger and
          shorter chain.
        test_recipe:
          setup:
            - "Item A (CLOTHING/GOOD, base 2000 -> 1600, weight 25.0 lbs) floored in cycle C1"
            - "Four close+run cycles executed; A advances round 1 (1200), 2 (800), 3 (400)"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Pull" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD", weight_lbs: 25.0 }
              as: IntakeAttendant
              captures: { ia: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/items/${ia}/to-floor"
              as: Pricer
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c2: "$.data[0].id" }
            - call: "POST /api/cycles/${c2}/run-markdown"
              as: StoreManager
            - call: "POST /api/cycles/${c2}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c3: "$.data[0].id" }
            - call: "POST /api/cycles/${c3}/run-markdown"
              as: StoreManager
            - call: "POST /api/cycles/${c3}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c4: "$.data[0].id" }
            - call: "POST /api/cycles/${c4}/run-markdown"
              as: StoreManager
            - call: "POST /api/cycles/${c4}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c5: "$.data[0].id" }
          trigger:
            - call: "POST /api/cycles/${c5}/run-markdown"
              as: StoreManager
            - call: "GET /api/salvage-bales"
              payload: { category: "TEXTILES", status: "ACCUMULATING" }
              as: StoreManager
              captures: { bale1: "$.data[0].id" }
          assert:
            - "DonationItem.${ia}.status == PULLED_TO_SALVAGE"
            - "DonationItem.${ia}.salvage_category == TEXTILES (CATEGORY_TO_SALVAGE map)"
            - "DonationItem.${ia}.bale_id == ${bale1}"
            - "DonationItem.${ia}.current_price_cents == 400 (round-3 price preserved)"
            - "SalvageBale.${bale1}.item_count == 1"
            - "SalvageBale.${bale1}.weight_lbs == 25.0"
            - "SalvageBale.${bale1}.estimated_revenue_cents == 300"
            - "DonationItem.${ia}.markdown_round == 3 (never advances past MAX_MARKDOWN_ROUND)"

      - name: void_restore_cascade
        grounds:
          - state_machines.SalesTransaction.COMPLETED_to_VOIDED
          - state_machines.DonationItem.SOLD_to_ON_FLOOR
          - entities.DonationBatch.fields.sold_item_count
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (sale void, not cycle run): the void
          mutates each line item SOLD -> ON_FLOOR with price/round restored (hop 1), and
          each item restoration itself mutates its DonationBatch (sold_item_count -= 1,
          version += 1, hop 2). The batch is never touched by the void endpoint directly.
        test_recipe:
          setup:
            - "Item A (CLOTHING/GOOD base 2000 -> 1600) floored; cashier W; session float 5000"
            - "Sale of A (CASH, 1600) COMPLETED"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Void" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ia: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${ia}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${ia}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
          trigger:
            - call: "POST /api/sales/${sale1}/void"
              payload: { reason: "customer return" }
              as: Cashier
              as_user_id: "${w1}"
          assert:
            - "SalesTransaction.${sale1}.status == VOIDED"
            - "DonationItem.${ia}.status == ON_FLOOR"
            - "DonationItem.${ia}.current_price_cents == 1600 and markdown_round == 0 (restored, not reset)"
            - "DonationItem.${ia}.sale_id is null"
            - "DonationBatch.${b1}.sold_item_count == 0 (was 1 after the sale)"
            - "TillSession.${s1}.cash_sales_cents == 0 and expected_cash_cents == 5000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: void_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_SALE_INVALID_STATE]
          - errors[ERR_SALE_VOID_WINDOW_CLOSED]
        distinguishing_aspect: |
          Pair {state(6) vs business_temporal(10)}: the second void of an already-VOIDED
          sale whose session has since CLOSED violates BOTH the state precondition and the
          void-window rule; the state error ERR_SALE_INVALID_STATE (409) MUST win because
          priority 6 sorts before priority 10.
        test_recipe:
          setup:
            - "Item priced 1600 (CLOTHING/GOOD base 2000) floored; cashier W; session float 5000"
            - "Sale completed then voided once; session counted even (5000) and CLOSED"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Pv1" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
            - call: "POST /api/sales/${sale1}/void"
              as: Cashier
              as_user_id: "${w1}"
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 5000 }
              as: StoreManager
            - call: "POST /api/till-sessions/${s1}/close"
              as: StoreManager
          trigger:
            - call: "POST /api/sales/${sale1}/void"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SALE_INVALID_STATE (state priority 6 beats temporal void-window priority 10)"
            - "SalesTransaction.${sale1}.status remains VOIDED (no side effects fired)"

      - name: stop_temporal_beats_referential
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_STOP_WINDOW_CONFLICT]
          - errors[ERR_DONOR_INACTIVE]
        distinguishing_aspect: |
          Pair {business_temporal(10) vs business_referential(11)}: adding a stop whose
          window violates the 30-minute buffer (10:15 vs existing 09:00-10:00) AND whose
          donor is INACTIVE violates both; ERR_STOP_WINDOW_CONFLICT MUST win. Different
          error-category pair from void_state_beats_temporal and bale_constraint_beats_referential.
        test_recipe:
          setup:
            - "STAFF driver W; donor D1 ACTIVE with stop 09:00-10:00 on DRAFT route; donor D2 INACTIVE"
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Drive", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Active" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Inactive" }
              as: IntakeAttendant
              captures: { d2: $.data.id }
            - call: "PATCH /api/donors/${d2}"
              payload: { status: "INACTIVE" }
              as: IntakeAttendant
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
          trigger:
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d2}", window_start: "2026-08-10T10:15:00Z", window_end: "2026-08-10T11:00:00Z", estimated_volume_cuft: 50 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STOP_WINDOW_CONFLICT (temporal priority 10 beats referential donor-active priority 11)"
            - "PickupRoute.${r1}.stop_count == 1 (no stop persisted)"

      - name: bale_constraint_beats_referential
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_BALE_UNDERWEIGHT]
          - errors[ERR_VENDOR_RATE_MISSING]
        distinguishing_aspect: |
          Pair {business_constraint(9) vs business_referential(11)}: sealing a 50-lb bale
          with a vendor that declares no rates for the bale's category violates both;
          ERR_BALE_UNDERWEIGHT MUST win. Third distinct category pair in this rule.
        test_recipe:
          setup:
            - "Vendor V with ONLY PAPER rates; TEXTILES bale holding one 50.0-lb item"
          setup_api_calls:
            - call: "POST /api/salvage-vendors"
              payload: { name: "Paper Only Co", rates: [ { category: "PAPER", brackets: [ { up_to_lbs: null, rate_cents_per_lb: 6 } ] } ] }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Bale" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "POOR", weight_lbs: 50.0 }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "GET /api/salvage-bales"
              payload: { category: "TEXTILES", status: "ACCUMULATING" }
              as: StoreManager
              captures: { bale1: "$.data[0].id" }
          trigger:
            - call: "POST /api/salvage-bales/${bale1}/seal"
              payload: { vendor_id: "${v1}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BALE_UNDERWEIGHT (constraint priority 9 beats referential vendor-rates priority 11)"
            - "SalvageBale.${bale1}.status == ACCUMULATING (no seal side effects)"
            - "DonationItem.${i1}.status == RECYCLE (no BALED cascade fired)"

  - rule_id: boundary_precision_check
    instances:
      - name: variance_boundary_500_vs_501
        grounds:
          - calculations.calc_till_reconciliation
          - state_machines.TillSession.OPEN_to_RECONCILED
          - state_machines.TillSession.OPEN_to_PENDING_APPROVAL
        distinguishing_aspect: |
          Metric: cash variance in cents via POST /till-sessions/{id}/count. The boundary
          is INCLUSIVE at 500 (|x| <= 500 auto-reconciles): +500 lands RECONCILED while
          +501 lands PENDING_APPROVAL. Different metric and endpoint from the bale-weight
          and receipt-total boundaries.
        test_recipe:
          setup:
            - "Two items priced 2000 each (CLOTHING/GOOD at base 2500) floored; cashier W"
            - "Session S1 float 10000 with sale of item 1; S1 closed after an even count would block S2, so S2 is opened only after S1 reconciles+closes"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2500, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Var" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/items/${i2}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/items/${i2}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 10000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
          trigger:
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 12500 }
              as: StoreManager
              captures: { st1: $.data.status }
            - call: "POST /api/till-sessions/${s1}/close"
              as: StoreManager
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 10000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s2: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s2}", item_ids: ["${i2}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
            - call: "POST /api/till-sessions/${s2}/count"
              payload: { counted_cash_cents: 12501 }
              as: StoreManager
              captures: { st2: $.data.status }
          assert:
            - "${st1} == RECONCILED (variance exactly +500 is inside AUTO_RECONCILE_MAX_CENTS)"
            - "${st2} == PENDING_APPROVAL (variance +501 crosses it)"
            - "TillSession.${s1}.over_short_cents == 500"
            - "TillSession.${s2}.over_short_cents == 501"

      - name: bale_seal_weight_boundary
        grounds:
          - validations[priority=9]
          - calculations.calc_bale_revenue
          - errors[ERR_BALE_UNDERWEIGHT]
        distinguishing_aspect: |
          Metric: bale weight in lbs via POST /salvage-bales/{id}/seal. The seal minimum is
          INCLUSIVE at 100.0 (>=): a TEXTILES bale at exactly 100.0 seals while a PAPER bale
          at 99.9 is rejected. Different metric and endpoint from variance and receipt
          boundaries.
        test_recipe:
          setup:
            - "Vendor V with flat TEXTILES (12c) and PAPER (6c) rates"
            - "TEXTILES bale fed by two 50.0-lb items (exactly 100.0); PAPER bale fed by one 99.9-lb item"
          setup_api_calls:
            - call: "POST /api/salvage-vendors"
              payload: { name: "Multi Co", rates: [ { category: "TEXTILES", brackets: [ { up_to_lbs: null, rate_cents_per_lb: 12 } ] }, { category: "PAPER", brackets: [ { up_to_lbs: null, rate_cents_per_lb: 6 } ] } ] }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Weight" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "FAIR", weight_lbs: 50.0 }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "POOR", weight_lbs: 50.0 }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "BOOKS_MEDIA", condition: "GOOD", weight_lbs: 99.9 }
              as: IntakeAttendant
              captures: { i3: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "POST /api/items/${i3}/triage"
              payload: { decision: "RECYCLE", salvage_category: "PAPER" }
              as: IntakeAttendant
            - call: "GET /api/salvage-bales"
              payload: { category: "TEXTILES", status: "ACCUMULATING" }
              as: StoreManager
              captures: { baleT: "$.data[0].id" }
            - call: "GET /api/salvage-bales"
              payload: { category: "PAPER", status: "ACCUMULATING" }
              as: StoreManager
              captures: { baleP: "$.data[0].id" }
          trigger:
            - call: "POST /api/salvage-bales/${baleT}/seal"
              payload: { vendor_id: "${v1}" }
              as: StoreManager
            - call: "POST /api/salvage-bales/${baleP}/seal"
              payload: { vendor_id: "${v1}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "SalvageBale.${baleT}.status == SEALED (100.0 lbs meets the inclusive minimum)"
            - "DonationItem.${i1}.status == BALED and DonationItem.${i2}.status == BALED"
            - "${err} == ERR_BALE_UNDERWEIGHT (99.9 lbs fails)"
            - "SalvageBale.${baleP}.status == ACCUMULATING"

      - name: receipt_itemization_threshold_25000
        grounds:
          - entities.TaxReceipt.fields.itemized_required
          - entities.TaxReceipt.fields.total_value_cents
          - state_machines.DonationBatch.SORTED_to_CLOSED
        distinguishing_aspect: |
          Metric: receipt total in cents via POST /donation-batches/{id}/receipt. The $250
          itemization flag is INCLUSIVE (>= 25000): a batch revalued to exactly 25000 issues
          with itemized_required == true; one at 24999 issues with false. Revalue (OCC) is
          exercised as the happy path en route. Different metric/endpoint from the other
          two boundary instances.
        test_recipe:
          setup:
            - "Donor D with address; two batches (receipt_requested) each holding one item, both SORTED"
            - "Batch totals revalued to exactly 25000 and 24999 cents"
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Receipt", address_line: "7 Elm St" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "FURNITURE", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/complete-sort"
              as: IntakeAttendant
              captures: { bv1: $.data.version }
            - call: "POST /api/donation-batches/${b1}/revalue"
              payload: { expected_batch_version: "${bv1}", adjustments: [ { item_id: "${i1}", provisional_value_cents: 25000 } ] }
              as: IntakeAttendant
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { b2: $.data.id }
            - call: "POST /api/donation-batches/${b2}/items"
              payload: { category: "FURNITURE", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b2}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b2}/complete-sort"
              as: IntakeAttendant
              captures: { bv2: $.data.version }
            - call: "POST /api/donation-batches/${b2}/revalue"
              payload: { expected_batch_version: "${bv2}", adjustments: [ { item_id: "${i2}", provisional_value_cents: 24999 } ] }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { r1: $.data.id }
            - call: "POST /api/donation-batches/${b2}/receipt"
              as: IntakeAttendant
              captures: { r2: $.data.id }
          assert:
            - "TaxReceipt.${r1}.total_value_cents == 25000"
            - "TaxReceipt.${r1}.itemized_required == true"
            - "TaxReceipt.${r1}.form_8283_required == false"
            - "TaxReceipt.${r2}.total_value_cents == 24999"
            - "TaxReceipt.${r2}.itemized_required == false"
            - "TaxReceipt.${r1}.status == ISSUED and TaxReceipt.${r2}.status == ISSUED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: sale_requires_owned_open_session
        grounds:
          - state_machines.TillSession
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_OWNERSHIP]
          - errors[ERR_TILL_INVALID_STATE]
        distinguishing_aspect: |
          Pair (SalesTransaction -> TillSession): a sale's validity is gated by the SESSION's
          state and ownership — another cashier's OPEN session rejects with
          ERR_FORBIDDEN_OWNERSHIP (403), the owner's own session accepts, and the same owner
          on the same session after it left OPEN rejects with ERR_TILL_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Items I1, I2 priced 1600 floored; staff workers W1, W2; W1's session S float 3000"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Xs" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/items/${i2}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/items/${i2}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W One", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w2: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 3000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w2}"
              captures: { err_own: $.data.error_id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 4600 }
              as: StoreManager
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i2}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { err_state: $.data.error_id }
          assert:
            - "${err_own} == ERR_FORBIDDEN_OWNERSHIP (session belongs to W1)"
            - "SalesTransaction.${sale1}.total_cents == 1600 and status == COMPLETED"
            - "${err_state} == ERR_TILL_INVALID_STATE (session RECONCILED, no longer OPEN)"
            - "DonationItem.${i2}.status == ON_FLOOR (rejected sale left the item untouched)"

      - name: stop_depart_requires_earlier_stops_terminal
        grounds:
          - state_machines.PickupStop.SCHEDULED_to_EN_ROUTE
          - state_machines.PickupStop.EN_ROUTE_to_COMPLETED
          - errors[ERR_STOP_OUT_OF_SEQUENCE]
        distinguishing_aspect: |
          Pair (PickupStop -> sibling PickupStop on the same route): stop S2 cannot depart
          while the earlier-windowed S1 is non-terminal; completing S1 (which itself
          cascades a DonationBatch creation) unlocks S2. A SIBLING-state dependency, not a
          parent-child one — different pair from sale->session and receipt->batch.
        test_recipe:
          setup:
            - "STAFF driver W; route PUBLISHED then IN_PROGRESS with stops S1 (09:00-10:00) and S2 (11:00-12:00)"
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Drive", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Early" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Late" }
              as: IntakeAttendant
              captures: { d2: $.data.id }
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { st1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d2}", window_start: "2026-08-10T11:00:00Z", window_end: "2026-08-10T12:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { st2: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/publish"
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/start"
              as: StoreManager
          trigger:
            - call: "POST /api/pickup-stops/${st2}/depart"
              as: Driver
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
            - call: "POST /api/pickup-stops/${st1}/depart"
              as: Driver
              as_user_id: "${w1}"
            - call: "POST /api/pickup-stops/${st1}/complete"
              as: Driver
              as_user_id: "${w1}"
              captures: { cb1: $.data.completed_batch_id }
            - call: "POST /api/pickup-stops/${st2}/depart"
              as: Driver
              as_user_id: "${w1}"
          assert:
            - "first depart of S2 rejected: ${err} == ERR_STOP_OUT_OF_SEQUENCE"
            - "PickupStop.${st1}.status == COMPLETED"
            - "PickupStop.${st1}.completed_batch_id == ${cb1} (non-null)"
            - "DonationBatch.${cb1}.source == PICKUP_STOP and donor_id == ${d1} and receipt_requested == true and status == OPEN"
            - "PickupStop.${st2}.status == EN_ROUTE after S1 became terminal"

      - name: receipt_and_close_gates_on_batch
        grounds:
          - state_machines.DonationBatch
          - state_machines.TaxReceipt
          - errors[ERR_BATCH_INVALID_STATE]
          - errors[ERR_BATCH_RECEIPT_MISSING]
        distinguishing_aspect: |
          Pair (TaxReceipt -> DonationBatch) plus its inverse (DonationBatch close ->
          TaxReceipt existence): receipt issuance requires the batch SORTED (OPEN batch ->
          ERR_BATCH_INVALID_STATE), and closing a receipt_requested batch without an ISSUED
          receipt fails ERR_BATCH_RECEIPT_MISSING — the two gates interlock the two
          lifecycles in opposite directions. Third distinct entity pair.
        test_recipe:
          setup:
            - "Donor D with address; batch B receipt_requested=true holding one item"
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Gates", address_line: "3 Pine St" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { err1: $.data.error_id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/complete-sort"
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/close"
              as: IntakeAttendant
              captures: { err2: $.data.error_id }
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { r1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/close"
              as: IntakeAttendant
          assert:
            - "${err1} == ERR_BATCH_INVALID_STATE (receipt before SORTED)"
            - "${err2} == ERR_BATCH_RECEIPT_MISSING (close before receipt)"
            - "TaxReceipt.${r1}.status == ISSUED"
            - "DonationBatch.${b1}.status == CLOSED after the receipt exists"
            - "Donor.${d1}.lifetime_donation_count == 1 and tier == STANDARD"

  - rule_id: resource_temporal_overlap
    instances:
      - name: stop_windows_buffered_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_STOP_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = PickupRoute; semantics = half-open windows with a 30-minute travel
          BUFFER applied on BOTH sides (gap of exactly 30 minutes legal, 29 illegal; the
          buffer applies symmetrically regardless of which stop comes first). Contrasts
          with worker_overlap_unbuffered_touching_allowed, where touching intervals are
          legal with no buffer.
        test_recipe:
          setup:
            - "STAFF driver W; donors D1..D4; DRAFT route R (2026-08-10, capacity 1000)"
            - "Existing stop S1 09:00-10:00"
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Drive", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D A" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D B" }
              as: IntakeAttendant
              captures: { d2: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D C" }
              as: IntakeAttendant
              captures: { d3: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D D" }
              as: IntakeAttendant
              captures: { d4: $.data.id }
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 1000 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d2}", window_start: "2026-08-10T10:29:00Z", window_end: "2026-08-10T11:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { err_gap29: $.data.error_id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d2}", window_start: "2026-08-10T10:30:00Z", window_end: "2026-08-10T11:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { s2: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d3}", window_start: "2026-08-10T07:30:00Z", window_end: "2026-08-10T08:30:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { s3: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d4}", window_start: "2026-08-10T07:31:00Z", window_end: "2026-08-10T08:31:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
              captures: { err_pre: $.data.error_id }
          assert:
            - "${err_gap29} == ERR_STOP_WINDOW_CONFLICT (29-minute gap after S1 fails)"
            - "stop S2 10:30 created: gap of exactly TRAVEL_BUFFER_MINUTES=30 is legal (>=)"
            - "stop S3 07:30-08:30 created: ends exactly 30 minutes before S1 starts (buffer legal on the early side too)"
            - "${err_pre} == ERR_STOP_WINDOW_CONFLICT (07:31-08:31 leaves only 29 minutes before S1 and overlaps S3)"
            - "PickupRoute.${r1}.stop_count == 3 and total_volume_cuft == 300"

      - name: worker_overlap_unbuffered_touching_allowed
        grounds:
          - validations[priority=10]
          - errors[ERR_SHIFT_OVERLAP]
          - calculations.calc_transitional_hours
        distinguishing_aspect: |
          Resource = Worker; semantics = plain half-open [start, end) overlap with NO
          buffer and TOUCHING endpoints legal: a shift starting 12:00 coexists with one
          ending 12:00, while 11:59-14:00 collides. Different resource entity and
          different interval arithmetic (no buffer; adjacency allowed) from the stop-window
          rule.
        test_recipe:
          setup:
            - "VOLUNTEER worker W; shifts A 09:00-12:00, B 12:00-15:00 (touches A), C 11:59-14:00 (overlaps both)"
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Vol", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-12T09:00:00Z", ends_at: "2026-08-12T12:00:00Z", required_headcount: 2 }
              as: VolunteerCoordinator
              captures: { shA: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "FLOOR", starts_at: "2026-08-12T12:00:00Z", ends_at: "2026-08-12T15:00:00Z", required_headcount: 2 }
              as: VolunteerCoordinator
              captures: { shB: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "INTAKE", starts_at: "2026-08-12T11:59:00Z", ends_at: "2026-08-12T14:00:00Z", required_headcount: 2 }
              as: VolunteerCoordinator
              captures: { shC: $.data.id }
          trigger:
            - call: "POST /api/shifts/${shA}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { asA: $.data.id }
            - call: "POST /api/shifts/${shB}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { asB: $.data.id }
            - call: "POST /api/shifts/${shC}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "ShiftAssignment.${asA}.status == ASSIGNED and ShiftAssignment.${asB}.status == ASSIGNED (touching 12:00 endpoints coexist)"
            - "${err} == ERR_SHIFT_OVERLAP (11:59 start pierces A's 12:00 end)"
            - "Shift.${shC}.assigned_count == 0"

  - rule_id: compensating_invariant
    instances:
      - name: sale_void_conserves_expected_cash
        grounds:
          - calculations.calc_till_reconciliation
          - state_machines.SalesTransaction.COMPLETED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: TillSession.expected_cash_cents, pinned as
          opening_float_cents + sum(total_cents of COMPLETED CASH sales in the session).
          Forward action (CASH sale of 1600) then its compensating action (void of that
          sale) MUST return expected_cash_cents to exactly its pre-sale value 5000 — any
          drift (e.g. refund double-counted) violates the invariant.
        test_recipe:
          setup:
            - "Item priced 1600 (CLOTHING/GOOD base 2000) floored; cashier W; session S float 5000"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Inv1" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
            - call: "POST /api/sales/${sale1}/void"
              as: Cashier
              as_user_id: "${w1}"
          assert:
            - "before the sale: expected_cash_cents == 5000 (float only)"
            - "after the sale: expected_cash_cents == 6600 and cash_sales_cents == 1600"
            - "after the void: expected_cash_cents == 5000 exactly (invariant restored) and cash_sales_cents == 0"
            - "TillSession.${s1}.status remains OPEN throughout"

      - name: sale_void_conserves_floor_inventory
        grounds:
          - state_machines.DonationItem.ON_FLOOR_to_SOLD
          - state_machines.DonationItem.SOLD_to_ON_FLOOR
          - calculations.calc_markdown_price
        distinguishing_aspect: |
          Conserved quantity: on-floor inventory valuation, pinned as
          sum(current_price_cents over items in {ON_FLOOR, ON_HOLD}). Selling a
          markdown-aged item (round 1, price 1200) then voiding MUST restore the SAME
          price and round — the invariant is violated by an implementation that returns
          the item at base price or resets markdown_round. Different conserved quantity
          (inventory value, not cash) from sale_void_conserves_expected_cash.
        test_recipe:
          setup:
            - "Items A, B (CLOTHING/GOOD base 2000 -> 1600) floored in C1; C1 closed; one markdown run in C2 advances both to round 1 at 1200"
            - "Cashier W with OPEN session (float 5000)"
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000, demand_multiplier: 1.0 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Inv2" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ia: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ib: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ib}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/price"
              as: Pricer
            - call: "POST /api/items/${ib}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/items/${ia}/to-floor"
              as: Pricer
            - call: "POST /api/items/${ib}/to-floor"
              as: Pricer
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c2: "$.data[0].id" }
            - call: "POST /api/cycles/${c2}/run-markdown"
              as: StoreManager
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${ia}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
            - call: "POST /api/sales/${sale1}/void"
              as: Cashier
              as_user_id: "${w1}"
          assert:
            - "floor value before sale == 2400 (items at 1200 + 1200 after round 1)"
            - "floor value while A is SOLD == 1200 (only B remains on the floor)"
            - "floor value after void == 2400 exactly (invariant restored)"
            - "DonationItem.${ia}.markdown_round == 1 and current_price_cents == 1200 after the void (NOT reset to 1600/round 0)"
            - "DonationItem.${ia}.status == ON_FLOOR and sale_id is null"
            - "SalesTransaction.${sale1}.total_cents == 1200 (sold at the marked-down price)"
