# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Immigrant Welcome Center & Newcomer Services
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: acuity_rapid_vs_comprehensive_divergence
        grounds:
          - calculations.acuity_index
          - entities.Case.fields.acuity_rapid
          - entities.Case.fields.acuity_verified
        distinguishing_aspect: |
          Two valid variants of the same acuity formula produce different numbers for identical
          inputs: rapid (no multiplier, no bonuses) yields 55.0 while comprehensive (1.25x
          verified multiplier, then bonuses, then clamp) yields 68.8 — and this calculation
          lives in the Case/NeedsAssessment domain, distinct from the BenefitScreening domain
          of the sibling instance.
        test_recipe:
          setup:
            - "Case for a household-of-2 client; one assessment with scores (housing 3, employment 2, education 2, language 2, health 1) submitted by mgr (id distinct from verifier)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ana Client", preferred_language: "es", date_of_birth: "1990-05-01", household_size: 2 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 3, employment_score: 2, education_score: 2, language_score: 2, health_score: 1 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /assessments/${asmt_id}/verify"
              as: CaseManager
              as_user_id: "${mgr2_id}"
            - call: "GET /cases/${case_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { acu_r: $.data.acuity_rapid, acu_v: $.data.acuity_verified }
          assert:
            - "Case.${case_id}.acuity_rapid == 55.0  (0.55 * 100, rapid variant set at submit)"
            - "Case.${case_id}.acuity_verified == 68.8  (round_half_up(0.55*1.25*100, 1) = 68.8; no bonuses: household_size 2 < 5, arrival_date null)"
            - "acuity_rapid != acuity_verified for identical assessment scores"
            - "NeedsAssessment.${asmt_id}.status == VERIFIED"

      - name: benefits_self_reported_vs_verified_program_set
        grounds:
          - calculations.benefits_tiering
          - entities.BenefitScreening.fields.variant_used
          - entities.BenefitScreening.fields.eligible_programs
        distinguishing_aspect: |
          Same income, two variants, different outputs: the self-reported variant strips the
          documentation-gated CASH_ASSIST program while the verified variant (same cents)
          restores it — a BenefitScreening-domain dual variant, distinct from the Case acuity
          domain of the sibling instance.
        test_recipe:
          setup:
            - "Household-size-2 client with case; screening with stated income exactly 2,820,720 cents (== 138% FPL for size 2) already run"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Beto Client", preferred_language: "es", date_of_birth: "1988-03-15", household_size: 2 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /benefit-screenings"
              payload: { case_id: "${case_id}", stated_annual_income_cents: 2820720 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /benefit-screenings/${scr_id}/run"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { tier_pre: $.data.tier, progs_pre: $.data.eligible_programs, var_pre: $.data.variant_used }
          trigger:
            - call: "POST /benefit-screenings/${scr_id}/verify"
              payload: { documented_annual_income_cents: 2820720 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { tier_post: $.data.tier, progs_post: $.data.eligible_programs, var_post: $.data.variant_used }
          assert:
            - "After run: tier == TIER_A and eligible_programs == [SNAP, MEDICAID, ESL_SUBSIDY] (CASH_ASSIST stripped) and variant_used == SELF_REPORTED"
            - "After verify with identical income: tier == TIER_A and eligible_programs == [SNAP, MEDICAID, CASH_ASSIST, ESL_SUBSIDY] and variant_used == VERIFIED"
            - "BenefitScreening.${scr_id}.status remains SCREENED after verify (verify is not a status transition)"

  - rule_id: combinatorial_formula
    instances:
      - name: subsidy_burden_cap_evaluation_order
        grounds:
          - calculations.enrollment_fee_subsidy
          - entities.ProgramEnrollment.fields.subsidized_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the burden cap depends on income, the subsidy
          tier depends on income, and the final fee is min(provisional fee, burden cap) — the
          scaffold pins the 6-step evaluation order, so with base_fee 30000 and documented
          income 600000 the answer is exactly 2500 (cap binds), not 3000 (tier-only).
        test_recipe:
          setup:
            - "Case fully ACTIVE with VERIFIED-variant screening (documented income 600,000 cents, household 2 => TIER_A, 90% base subsidy); program with base_fee_cents 30000; enrollment in APPLIED"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Caro Client", preferred_language: "es", date_of_birth: "1992-07-04", household_size: 2 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 2, employment_score: 2, education_score: 2, language_score: 2, health_score: 2 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /assessments/${asmt_id}/verify"
              as: CaseManager
              as_user_id: "${mgr2_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ASSESSED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "PLANNING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/plans"
              payload: { title: "Plan P", budgeted_hours: 20, expected_case_version: "${case_v2}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /benefit-screenings"
              payload: { case_id: "${case_id}", stated_annual_income_cents: 600000 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /benefit-screenings/${scr_id}/run"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /benefit-screenings/${scr_id}/verify"
              payload: { documented_annual_income_cents: 600000 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /programs"
              payload: { name: "ESOL Level 1", kind: "ESOL", capacity: 10, base_fee_cents: 30000, cost_per_completion_cents: 12000 }
              as: CenterAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /program-enrollments"
              payload: { case_id: "${case_id}", program_id: "${prog_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { fee: $.data.subsidized_fee_cents, pct: $.data.subsidy_pct, fstat: $.data.fee_status }
          assert:
            - "ProgramEnrollment.${enr_id}.subsidy_pct == 0.9  (TIER_A base subsidy)"
            - "ProgramEnrollment.${enr_id}.subsidized_fee_cents == 2500  (provisional 3000, burden cap floor(600000/12)*0.05 = 2500 binds; order pinned)"
            - "ProgramEnrollment.${enr_id}.fee_status == PENDING  (fee > 0 and not yet arranged)"

      - name: funder_allocation_cell_round_then_sum
        grounds:
          - calculations.funder_cost_allocation
          - entities.FunderReport.fields.stream_totals
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-(line x stream)-cell THEN
          sum-per-stream with the residual landing on the largest-share stream — with shares
          33.34/33.33/33.33 over lines 12000/15000/2500 the drift is -2 cents, so stream A
          reads 9834 (9836 - 2), not the round-of-sum 9833 or the unadjusted 9836.
        test_recipe:
          setup:
            - "In window [2026-08-01, 2026-09-01): exactly 1 COMPLETED program enrollment (12,000c), 2 COMPLETED referrals (2 x 7,500c), 1 ATTENDED workshop enrollment (2,500c); enrollment+workshop client holds DATA_REPORTING consent, referral client does not"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Dara Client", preferred_language: "fr", date_of_birth: "1991-01-20", household_size: 3 }
              as: IntakeSpecialist
              captures: { cli1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Elif Client", preferred_language: "ar", date_of_birth: "1985-11-02", household_size: 4 }
              as: IntakeSpecialist
              captures: { cli2_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli1_id}", scope: "DATA_REPORTING" }
              as: CenterAdmin
            - call: "POST /consents"
              payload: { client_id: "${cli2_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
            - call: "POST /cases"
              payload: { client_id: "${cli1_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case1_id: $.data.id, case1_v: $.data.version }
            - call: "POST /cases"
              payload: { client_id: "${cli2_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case2_id: $.data.id }
            - call: "POST /assessments"
              payload: { case_id: "${case1_id}", housing_score: 1, employment_score: 1, education_score: 1, language_score: 1, health_score: 1 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /assessments/${asmt_id}/verify"
              as: CaseManager
              as_user_id: "${mgr2_id}"
            - call: "POST /cases/${case1_id}/transition"
              payload: { to_status: "ASSESSED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case1_id}/transition"
              payload: { to_status: "PLANNING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case1_v2: $.data.version }
            - call: "POST /cases/${case1_id}/plans"
              payload: { title: "Plan F", budgeted_hours: 10, expected_case_version: "${case1_v2}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { plan1_id: $.data.id }
            - call: "POST /plans/${plan1_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case1_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /programs"
              payload: { name: "Workforce Bootcamp", kind: "WORKFORCE", capacity: 5, base_fee_cents: 0, cost_per_completion_cents: 12000 }
              as: CenterAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /program-enrollments"
              payload: { case_id: "${case1_id}", program_id: "${prog_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "ENROLLED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "COMPLETED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /organizations"
              payload: { name: "Org X", service_categories: ["EMPLOYMENT"], referral_capacity: 5, contact_email: "x@org.test" }
              as: CenterAdmin
              captures: { orgx_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org Y", service_categories: ["EMPLOYMENT"], referral_capacity: 5, contact_email: "y@org.test" }
              as: CenterAdmin
              captures: { orgy_id: $.data.id }
            - call: "POST /referrals"
              payload: { case_id: "${case2_id}", organization_id: "${orgx_id}", service_category: "EMPLOYMENT" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /referrals/${ref1_id}/respond"
              payload: { decision: "ACCEPTED", warm_handoff_offered: true }
              as: PartnerOrg
              as_user_id: "${orgx_id}"
            - call: "POST /referrals/${ref1_id}/confirm-handoff"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /referrals/${ref1_id}/complete"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /referrals"
              payload: { case_id: "${case2_id}", organization_id: "${orgy_id}", service_category: "EMPLOYMENT" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /referrals/${ref2_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /referrals/${ref2_id}/respond"
              payload: { decision: "ACCEPTED", warm_handoff_offered: true }
              as: PartnerOrg
              as_user_id: "${orgy_id}"
            - call: "POST /referrals/${ref2_id}/confirm-handoff"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /referrals/${ref2_id}/complete"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /rooms"
              payload: { name: "Room A", capacity: 30 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Orientation", capacity: 10, starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${case1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { wke_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /_sweeps/run"
              as: CenterAdmin
            - call: "POST /workshop-enrollments/${wke_id}/mark-attendance"
              payload: { attended: true }
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /funder-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", funding_streams: [ { stream_name: "A", share_pct: 33.34 }, { stream_name: "B", share_pct: 33.33 }, { stream_name: "C", share_pct: 33.33 } ] }
              as: CenterAdmin
              captures: { rep_id: $.data.id, rep_total: $.data.total_cost_cents }
          assert:
            - "FunderReport.${rep_id}.total_cost_cents == 29500  (12000 + 2*7500 + 2500)"
            - "FunderReport.${rep_id}.lines quantities: enrollment 1, referral 2, workshop 1"
            - "stream_totals: A == 9834, B == 9833, C == 9833  (per-cell round_half_up sums 9836/9833/9833 = 29502; residual -2 lands on largest share A)"
            - "sum(stream_totals) == total_cost_cents == 29500  (no drift after residual assignment)"
            - "aggregate_client_count == 2 and reportable_client_count == 1  (cli2 lacks DATA_REPORTING consent)"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_parallel_dimensions_move_independently
        grounds:
          - state_machines.Case.service_status
          - state_machines.Case.privacy_posture
        distinguishing_aspect: |
          Case carries two parallel state dimensions on one row: moving privacy_posture
          STANDARD->RESTRICTED leaves service_status untouched, and service_status
          ACTIVE->SUSPENDED leaves privacy_posture untouched — a parallel-dimensions machine,
          distinct from the Referral cycle of the sibling instance.
        test_recipe:
          setup:
            - "Case in service_status INTAKE with privacy_posture STANDARD"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Femi Client", preferred_language: "en", date_of_birth: "1995-02-11", household_size: 1 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/privacy"
              payload: { to_posture: "RESTRICTED", reason: "sensitive employer dispute" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { svc1: $.data.service_status, pos1: $.data.privacy_posture }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ASSESSED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "After privacy move: service_status == INTAKE (unchanged) and privacy_posture == RESTRICTED"
            - "Dimensions gate independently: service transition INTAKE->ASSESSED fails with ERR_INVALID_STATE because no VERIFIED assessment exists — privacy move did not unlock it"

      - name: referral_decline_reroute_cycle
        grounds:
          - state_machines.Referral.DECLINED_to_SENT
          - state_machines.Referral.SENT_to_DECLINED
        distinguishing_aspect: |
          Referral is cyclic: SENT -> DECLINED -> SENT via reroute to a different organization,
          with slot accounting released on decline and re-taken on reroute — a cycle on the
          Referral entity, distinct from the Case parallel dimensions of the sibling instance.
        test_recipe:
          setup:
            - "Two ACTIVE orgs X and Y (HOUSING, capacity 5); client with REFERRAL_SHARE consent; case INTAKE; referral to org X sent (org X slots_used == 1)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Gita Client", preferred_language: "hi", date_of_birth: "1993-09-09", household_size: 2 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org X", service_categories: ["HOUSING"], referral_capacity: 5, contact_email: "x@org.test" }
              as: CenterAdmin
              captures: { orgx_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org Y", service_categories: ["HOUSING"], referral_capacity: 5, contact_email: "y@org.test" }
              as: CenterAdmin
              captures: { orgy_id: $.data.id }
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${orgx_id}", service_category: "HOUSING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
