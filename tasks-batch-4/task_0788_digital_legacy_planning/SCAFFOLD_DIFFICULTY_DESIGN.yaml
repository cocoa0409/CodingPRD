              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /legacy/deputies/${d1_id}/revoke"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert:
            - "Plan.${plan_id}.seats_used == 0"
            - "Plan.${plan_id}.seats_available == 5"

      - name: value_conservation_release_then_recall_asset
        grounds:
          - state_machines.VaultItem.RELEASED_to_SEALED
          - state_machines.Beneficiary.VESTED_to_NOMINATED
          - entities.VaultItem.fields.net_value_cents
          - entities.Beneficiary.fields.allocated_value_cents
        distinguishing_aspect: |
          Conserved quantity = the ASSET's distributable net_value_cents (9999): release then recall leaves
          net_value_cents==9999 and the beneficiary's allocation back to 0 (the distributed sum reverts, no
          monetary drift) — a different conserved quantity than subscription seats.
        test_recipe:
          setup:
            - "Deceased plan with a released ASSET (net 9999, one linked beneficiary at 100% now VESTED with allocated_value_cents 9999)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/deputies"
              payload: { plan_id: "${plan_id}", full_name: "Dee One", email: "d1@x.com", deputy_role: "EXECUTOR", access_scope: ["ASSET"], release_trigger: "ON_DEATH", authority_start_at: "2026-06-01T00:00:00Z", authority_end_at: "2027-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "House", secret_ref: "vault://house", gross_value_cents: 10000, liability_cents: 1, distribution_basis: "NET" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child", allocation_pct: 100, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
            - call: "POST /legacy/release-requests"
              payload: { plan_id: "${plan_id}", trigger_type: "ON_DEATH", scope_kinds: ["ASSET"] }
              as: Deputy
              as_user_id: "${d1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /legacy/release-requests/${rr_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /legacy/release-requests/${rr_id}/approve"
              payload: { decision: "APPROVE" }
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/release-requests/${rr_id}/grant"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /legacy/vault-items/${item_id}/recall"
              payload: {}
              as: PlatformAdmin
          assert:
            - "VaultItem.${item_id}.status == SEALED"
            - "VaultItem.${item_id}.net_value_cents == 9999"
            - "Beneficiary.${b1_id}.status == NOMINATED"
            - "Beneficiary.${b1_id}.allocated_value_cents == 0"
