              as: ConferenceAdmin
              captures: { total: "$.meta.total_count" }
          assert:
            - "the on-deadline call → HTTP 201 with blind_code GOS26-B0001"
            - "the late call → HTTP 422 with error_id ERR_CFA_DEADLINE_PASSED"
            - "GET /abstracts reports total_count == 1"
