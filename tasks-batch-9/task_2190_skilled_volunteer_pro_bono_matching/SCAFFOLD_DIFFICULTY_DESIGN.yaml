            - "One INDEPENDENT_SECTOR valuation posted while IN_PROGRESS, so valuation_status is PROVISIONAL and Volunteer.lifetime_valued_usd is 1558.59."
            - "Engagement submitted; a QualityReview opened by QualityReviewer qr-1 and scored at review_score 2 on the sole deliverable, so the review sits in SCORED with outcome FAIL."
