            - call: "POST /homeowners"
              payload: { email: "v1@ex.com", full_name: "V1" }
              as: HOAManager
              captures: { v1_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "v2@ex.com", full_name: "V2" }
              as: HOAManager
