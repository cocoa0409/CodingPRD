# =============================================================================
# task_0788 — Digital-Legacy & End-of-Life Planning (Everplans/Cake style)
# SCAFFOLD.yaml — §1.0–§1.7
# =============================================================================

scenario: |
  788. Digital-Legacy & End-of-Life Planning (Everplans/Cake style): account/asset & document vault,
  deputy/executor designation & release, advance directive & wishes, beneficiary/contact tree,
  subscription & sharing, integration (will/insurance), reminder/review, secure access

domain_name: digital-legacy-planning
api_prefix: /legacy

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions

  entity_topology: flat
  # Peer entities under a single /legacy prefix, linked by foreign keys in the
  # body (plan_id, vault_item_id, ...). No nesting in URL paths.

  state_machine_shape: branching
  # ReleaseRequest forks PENDING→{VERIFIED,DENIED} and VERIFIED→{APPROVED,DENIED}
  # with divergent side-effect sets; Directive and Subscription add cycles.

  relationship_patterns:
    - one_to_many          # Plan → VaultItem/Deputy/Beneficiary/Directive/...
    - self_referential     # Beneficiary.parent_beneficiary_id (contact tree)
    - cross_aggregate      # ReleaseRequest grant releases VaultItems, vests Beneficiaries

  role_model: delegated_authority
  # Owner delegates scoped access to Deputies; on a verified life-trigger the
  # deputies gain read access to released, in-scope vault items (secure access).

  consistency_model: immediate

  entity_count: 10
  state_machine_count: 10
  calculation_count: 6
  endpoint_count: 51
  error_code_count: 27
  role_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: owner_full_name, type: string, source: input, description: "Estate owner's legal name" }
      - { name: owner_email, type: string, source: input, description: "Estate owner's contact email" }
      - { name: life_status, type: enum, source: system, default: ACTIVE, description: "Owner life-event status", constraints: "ACTIVE | INCAPACITATED | DECEASED" }
      - { name: life_evidence_ref, type: string, source: system, default: null, description: "Reference to the verification document that justified the last life_status change; null while ACTIVE" }
      - { name: completeness_pct, type: integer, source: computed, description: "Vault readiness score 0-100 (see calc plan_completeness_pct); recomputed on read" }
      - { name: seats_used, type: integer, source: computed, description: "Seats consumed by active deputies + active shares (see calc seat_accounting)" }
      - { name: seats_available, type: integer, source: computed, description: "seat_limit - seats_used; never negative" }

  - name: VaultItem
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: kind, type: enum, source: input, description: "Item kind", constraints: "ACCOUNT | ASSET | DOCUMENT" }
      - { name: category, type: string, source: input, description: "Free-text sub-category e.g. 'bank', 'will', 'photos'" }
      - { name: title, type: string, source: input, description: "Human label for the item" }
      - { name: secret_ref, type: string, source: input, description: "Opaque pointer to the encrypted payload/credential blob" }
      - { name: sensitivity, type: enum, source: input, default: MEDIUM, description: "Sensitivity tier", constraints: "LOW | MEDIUM | HIGH" }
      - { name: gross_value_cents, type: integer, source: input, default: null, description: "Gross monetary value; required when kind=ASSET, else null", constraints: ">= 0" }
      - { name: liability_cents, type: integer, source: input, default: 0, description: "Debt attached to this asset, deducted under NET distribution basis", constraints: ">= 0" }
      - { name: distribution_basis, type: enum, source: input, default: NET, description: "Which value the beneficiary allocation uses for this ASSET", constraints: "NET | GROSS" }
      - { name: net_value_cents, type: integer, source: computed, description: "max(gross_value_cents - liability_cents, 0); null when kind != ASSET" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle", constraints: "DRAFT | SEALED | RELEASED | ARCHIVED" }

  - name: Deputy
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan this deputy serves" }
      - { name: full_name, type: string, source: input, description: "Deputy's legal name" }
      - { name: email, type: string, source: input, description: "Deputy's contact email" }
      - { name: deputy_role, type: enum, source: input, description: "Kind of authority", constraints: "EXECUTOR | HEALTHCARE_PROXY | GUARDIAN | VIEWER" }
      - { name: access_scope, type: array, source: input, description: "Subset of {ACCOUNT, ASSET, DOCUMENT} the deputy may read once released" }
      - { name: release_trigger, type: enum, source: input, description: "Life event that unlocks this deputy's access", constraints: "ON_DEATH | ON_INCAPACITY | IMMEDIATE" }
      - { name: authority_start_at, type: datetime, source: input, description: "Inclusive start of this deputy's term of authority (ISO 8601 UTC)" }
      - { name: authority_end_at, type: datetime, source: input, description: "Inclusive end of this deputy's term of authority (ISO 8601 UTC)" }
      - { name: consumes_seat, type: boolean, source: input, default: true, description: "Whether this deputy counts against the subscription seat limit" }
      - { name: status, type: enum, source: system, default: INVITED, description: "Lifecycle", constraints: "INVITED | ACCEPTED | REVOKED" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: parent_beneficiary_id, type: string, source: input, default: null, description: "FK -> Beneficiary.id; parent node in the contact tree; null for a root node" }
      - { name: asset_vault_item_id, type: string, source: input, default: null, description: "FK -> VaultItem.id; the ASSET this beneficiary is allocated a share of; null if unlinked" }
      - { name: full_name, type: string, source: input, description: "Beneficiary/contact name" }
      - { name: relationship, type: string, source: input, description: "Relationship to owner e.g. 'spouse', 'child'" }
      - { name: contact_email, type: string, source: input, default: null, description: "Beneficiary contact email" }
      - { name: allocation_pct, type: number, source: input, default: 0, description: "Percentage of the linked asset allocated to this beneficiary", constraints: "0 <= allocation_pct <= 100" }
      - { name: allocated_value_cents, type: integer, source: computed, default: 0, description: "Cents allocated after the linked ASSET is released (see calc beneficiary_allocation); 0 until VESTED" }
      - { name: status, type: enum, source: system, default: NOMINATED, description: "Lifecycle", constraints: "NOMINATED | VESTED | REMOVED" }

  - name: Directive
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: directive_type, type: enum, source: input, description: "Kind of advance directive / wish", constraints: "MEDICAL | FUNERAL | DNR | ORGAN_DONATION" }
      - { name: content, type: string, source: input, description: "The directive text / wishes" }
      - { name: version_number, type: integer, source: system, default: 1, description: "Monotonic revision counter for this directive; increments on each revise" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle", constraints: "DRAFT | ACTIVE | UNDER_REVISION | SUPERSEDED | REVOKED" }

  - name: ReleaseRequest
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: requested_by_deputy_id, type: string, source: input, description: "FK -> Deputy.id; the deputy who filed this request (bound to acting X-User-ID)" }
      - { name: trigger_type, type: enum, source: input, description: "Life event asserted as the basis for release", constraints: "ON_DEATH | ON_INCAPACITY" }
      - { name: scope_kinds, type: array, source: input, description: "Subset of {ACCOUNT, ASSET, DOCUMENT} to release on grant" }
      - { name: required_approvals, type: integer, source: computed, default: 0, description: "Deputy APPROVE votes needed; ceil(accepted_deputy_count * 0.5) min 1, pinned at verify" }
      - { name: approval_count, type: integer, source: computed, default: 0, description: "Distinct ACCEPTED deputies who voted APPROVE" }
      - { name: approver_deputy_ids, type: array, source: system, description: "Deputy ids that have already voted; enforces one vote per deputy" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "Instant after which an un-granted VERIFIED/PENDING request EXPIRES; set to clock + 14 days at verify" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Lifecycle", constraints: "PENDING | VERIFIED | APPROVED | GRANTED | DENIED | EXPIRED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan billed by this subscription" }
      - { name: tier, type: enum, source: input, description: "Plan tier", constraints: "FREE | PLUS | FAMILY" }
      - { name: refund_policy, type: enum, source: input, default: IMMEDIATE_PRORATA, description: "Refund variant applied at cancel", constraints: "IMMEDIATE_PRORATA | FORFEIT" }
      - { name: seat_limit, type: integer, source: computed, description: "Seats granted by tier (FREE=1, PLUS=5, FAMILY=10)" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "Fee by tier (FREE=0, PLUS=1200, FAMILY=2400)" }
      - { name: period_start, type: datetime, source: system, description: "Current billing period start; set to clock at create and advanced on each SUCCEEDED payment" }
      - { name: period_end, type: datetime, source: system, description: "period_start + 30 days" }
      - { name: last_refund_cents, type: integer, source: computed, default: 0, description: "Refund produced by the most recent cancel (see calc subscription_refund)" }
      - { name: status, type: enum, source: system, default: TRIALING, description: "Lifecycle", constraints: "TRIALING | ACTIVE | PAST_DUE | CANCELED" }

  - name: Share
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: vault_item_id, type: string, source: input, default: null, description: "FK -> VaultItem.id; the shared item; null when scope=PLAN" }
      - { name: shared_with_email, type: string, source: input, description: "Recipient email granted read access" }
      - { name: scope, type: enum, source: input, description: "Extent of the share", constraints: "ITEM | PLAN" }
      - { name: effective_at, type: datetime, source: input, description: "Inclusive start of the access window (ISO 8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Exclusive end of the access window (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle", constraints: "ACTIVE | REVOKED | EXPIRED" }

  - name: Integration
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: provider_type, type: enum, source: input, description: "External record kind", constraints: "WILL_REGISTRY | LIFE_INSURANCE" }
      - { name: provider_name, type: string, source: input, description: "External provider display name" }
      - { name: external_ref, type: string, source: input, description: "Policy/registry reference number at the provider" }
      - { name: coverage_cents, type: integer, source: input, default: 0, description: "Declared coverage/benefit amount", constraints: ">= 0" }
      - { name: last_synced_at, type: datetime, source: system, default: null, description: "Clock at the last successful sync; null until first sync" }
      - { name: sync_status, type: enum, source: system, default: LINKED, description: "Lifecycle", constraints: "LINKED | SYNCING" }

  - name: ReviewReminder
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: subject_kind, type: enum, source: input, description: "What area to review", constraints: "VAULT | DIRECTIVE | BENEFICIARY | SUBSCRIPTION" }
      - { name: interval_days, type: integer, source: input, default: 180, description: "Days between reviews", constraints: ">= 1" }
      - { name: last_reviewed_at, type: datetime, source: input, description: "Anchor instant the next due date is computed from (ISO 8601 UTC)" }
      - { name: due_at, type: datetime, source: computed, description: "last_reviewed_at + interval_days (see calc next_review_due)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Lifecycle", constraints: "SCHEDULED | DUE | OVERDUE | COMPLETED | DISMISSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    field: life_status
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: INCAPACITATED
        trigger: "POST /legacy/plans/{plan_id}/life-status (new_status=INCAPACITATED)"
        actor: PlatformAdmin
        preconditions: ["evidence_ref present"]
        side_effects: ["Set life_evidence_ref = evidence_ref", "increments Plan.version by 1"]
      - from: [ACTIVE, INCAPACITATED]
        to: DECEASED
        trigger: "POST /legacy/plans/{plan_id}/life-status (new_status=DECEASED)"
        actor: PlatformAdmin
        preconditions: ["evidence_ref present"]
        side_effects:
          - "Set life_evidence_ref = evidence_ref"
          - "All ReviewReminders in {SCHEDULED, DUE, OVERDUE} on this plan -> DISMISSED"
          - "increments Plan.version by 1"

  - entity: VaultItem
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /legacy/vault-items/{item_id}/seal"
        actor: Owner
        preconditions:
          - "If kind=ASSET: gross_value_cents is present"
          - "If kind=ASSET and beneficiaries are linked: sum(allocation_pct of NOMINATED beneficiaries with asset_vault_item_id=this) <= 100 (else ERR_ALLOCATION_EXCEEDS_100)"
        side_effects: ["Item becomes eligible for release"]
      - from: SEALED
        to: RELEASED
        trigger: "system — cascade link from ReleaseRequest APPROVED->GRANTED grant"
        actor: system
        preconditions: ["A GRANTED ReleaseRequest on the same plan whose scope_kinds includes this item's kind"]
        side_effects:
          - "CASCADE link 2: if kind=ASSET, run beneficiary_allocation; each linked NOMINATED Beneficiary -> VESTED with allocated_value_cents set"
      - from: RELEASED
        to: SEALED
        trigger: "POST /legacy/vault-items/{item_id}/recall"
        actor: "Owner or PlatformAdmin"
        preconditions: []
        side_effects:
          - "COMPENSATION: if kind=ASSET, each linked VESTED Beneficiary -> NOMINATED and allocated_value_cents reset to 0 (leaves the asset's distributable net_value_cents conserved)"
      - from: [DRAFT, SEALED]
        to: ARCHIVED
        trigger: "POST /legacy/vault-items/{item_id}/archive"
        actor: Owner
        preconditions: []
        side_effects: ["Item excluded from default lists"]

  - entity: Deputy
    field: status
    initial_state: INVITED
    terminal_states: [REVOKED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /legacy/deputies/{deputy_id}/accept"
        actor: Deputy
        preconditions: []
        side_effects: ["Deputy becomes an active voter for release quorum"]
      - from: [INVITED, ACCEPTED]
        to: REVOKED
        trigger: "POST /legacy/deputies/{deputy_id}/revoke"
        actor: Owner
        preconditions: []
        side_effects:
          - "Frees the deputy's seat (seat_accounting recomputes)"
          - "CASCADE link 2: every ReleaseRequest in {PENDING, VERIFIED} whose requested_by_deputy_id=this deputy -> DENIED"

  - entity: Beneficiary
    field: status
    initial_state: NOMINATED
    terminal_states: [REMOVED]
    transitions:
      - from: NOMINATED
        to: VESTED
        trigger: "system — cascade link from linked ASSET VaultItem SEALED->RELEASED"
        actor: system
        preconditions: ["Linked asset_vault_item_id is RELEASED"]
        side_effects: ["allocated_value_cents set by beneficiary_allocation"]
      - from: VESTED
        to: NOMINATED
        trigger: "system — compensation from linked ASSET VaultItem RELEASED->SEALED recall"
        actor: system
        preconditions: []
        side_effects: ["allocated_value_cents reset to 0"]
      - from: NOMINATED
        to: REMOVED
        trigger: "POST /legacy/beneficiaries/{beneficiary_id}/remove"
        actor: Owner
        preconditions: []
        side_effects: ["Excluded from future allocations"]

  - entity: Directive
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: [DRAFT, UNDER_REVISION]
        to: ACTIVE
        trigger: "POST /legacy/directives/{directive_id}/activate"
        actor: Owner
        preconditions:
          - "Plan.life_status = ACTIVE (an owner cannot activate a new directive after INCAPACITATED/DECEASED)"
          - "expected_plan_version matches Plan.version (OCC)"
        side_effects:
          - "Any other ACTIVE Directive of the same directive_type on this plan -> SUPERSEDED"
          - "increments Plan.version by 1"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /legacy/directives/{directive_id}/revise"
        actor: Owner
        preconditions: []
        side_effects: ["version_number incremented by 1"]
      - from: [DRAFT, ACTIVE, UNDER_REVISION]
        to: REVOKED
        trigger: "POST /legacy/directives/{directive_id}/revoke"
        actor: Owner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — a newer Directive of the same directive_type is activated"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReleaseRequest
    field: status
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /legacy/release-requests/{release_request_id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "CROSS-ENTITY: Plan.life_status satisfies trigger_type — ON_DEATH requires DECEASED; ON_INCAPACITY requires INCAPACITATED or DECEASED (else ERR_RELEASE_NOT_TRIGGERED)"
        side_effects:
          - "required_approvals = ceil(accepted_deputy_count * 0.5) with a floor of 1 (release_quorum)"
          - "expires_at = current clock + 14 days"
      - from: PENDING
        to: DENIED
        trigger: "POST /legacy/release-requests/{release_request_id}/deny"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: APPROVED
        trigger: "system — approval_count reaches required_approvals via POST .../approve (decision=APPROVE)"
        actor: system
        preconditions: ["approval_count >= required_approvals"]
        side_effects: []
      - from: VERIFIED
        to: DENIED
        trigger: "POST /legacy/release-requests/{release_request_id}/approve (decision=REJECT), or POST .../deny"
        actor: "Deputy or PlatformAdmin"
        preconditions: []
        side_effects: ["A single REJECT vote vetoes the request"]
      - from: APPROVED
        to: GRANTED
        trigger: "POST /legacy/release-requests/{release_request_id}/grant"
        actor: PlatformAdmin
        preconditions:
          - "At least one SEALED VaultItem on the plan whose kind is in scope_kinds (else ERR_NOTHING_TO_RELEASE)"
          - "Plan's Subscription.status != PAST_DUE (else ERR_SUBSCRIPTION_PAST_DUE)"
        side_effects:
          - "CASCADE link 1: every SEALED VaultItem on the plan whose kind is in scope_kinds -> RELEASED"
          - "which (link 2) vests linked Beneficiaries of released ASSET items (see VaultItem SEALED->RELEASED)"
      - from: [PENDING, VERIFIED]
        to: EXPIRED
        trigger: "system — POST /_ops/run-review-sweep when clock >= expires_at"
        actor: system
        preconditions: ["expires_at is set and clock >= expires_at"]
        side_effects: []

  - entity: Subscription
    field: status
    initial_state: TRIALING
    terminal_states: [CANCELED]
    transitions:
      - from: [TRIALING, PAST_DUE]
        to: ACTIVE
        trigger: "POST /legacy/subscriptions/{subscription_id}/record-payment (outcome=SUCCEEDED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["period_start advanced to prior period_end (or clock if later), period_end = period_start + 30 days"]
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /legacy/subscriptions/{subscription_id}/record-payment (outcome=FAILED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [TRIALING, ACTIVE, PAST_DUE]
        to: CANCELED
        trigger: "POST /legacy/subscriptions/{subscription_id}/cancel"
        actor: Owner
        preconditions: []
        side_effects:
          - "last_refund_cents = subscription_refund (variant per refund_policy)"
          - "CASCADE: every ACTIVE Share on this plan -> REVOKED"

  - entity: Share
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /legacy/shares/{share_id}/revoke, or system cascade from Subscription cancel"
        actor: "Owner or system"
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /_ops/run-review-sweep when clock >= expires_at"
        actor: system
        preconditions: ["clock >= expires_at"]
        side_effects: []

  - entity: Integration
    field: sync_status
    initial_state: LINKED
    terminal_states: []
    transitions:
      - from: [LINKED]
        to: SYNCING
        trigger: "POST /legacy/integrations/{integration_id}/sync"
        actor: "Owner or PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: SYNCING
        to: LINKED
        trigger: "system — sync completes within the same request"
        actor: system
        preconditions: []
        side_effects: ["last_synced_at = current clock"]

  - entity: ReviewReminder
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, DISMISSED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system — POST /_ops/run-review-sweep when clock >= due_at and clock < due_at + 30 days"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SCHEDULED, DUE]
        to: OVERDUE
        trigger: "system — POST /_ops/run-review-sweep when clock >= due_at + 30 days"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SCHEDULED, DUE, OVERDUE]
        to: COMPLETED
        trigger: "POST /legacy/review-reminders/{reminder_id}/complete"
        actor: Owner
        preconditions: []
        side_effects: ["last_reviewed_at = current clock; due_at recomputed for the record snapshot"]
      - from: [SCHEDULED, DUE, OVERDUE]
        to: DISMISSED
        trigger: "system — cascade from Plan life_status -> DECEASED"
        actor: system
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: directive-activate-stale-plan
    parent_entity: Plan
    write_endpoint: "POST /legacy/directives/{directive_id}/activate"
    occ_field: "expected_plan_version"
    description: |
      Activating a Directive against a Plan whose version has advanced since the
      client last observed it is rejected. This captures the CREATE-with-supersede
      case: activating a directive of a given directive_type supersedes any prior
      ACTIVE directive of that type and bumps Plan.version. A second activate that
      still carries the previously observed plan version is working from a stale
      view of which directive is currently active and is rejected on the version
      check rather than silently superseding a directive the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plan_completeness_pct
    trigger: "GET /legacy/plans/{plan_id} and GET /legacy/plans/{plan_id}/completeness (recomputed on read)"
    algorithm: weighted_scoring
    formula: |
      # ≥3 inputs, non-linear (min clamps) and tier-conditional weights.
      sealed_item_count      = count(VaultItem status=SEALED or RELEASED on plan)
      active_directive_count = count(Directive status=ACTIVE on plan)
      accepted_deputy_count  = count(Deputy status=ACCEPTED on plan)
      beneficiary_count      = count(Beneficiary status IN {NOMINATED, VESTED} on plan)

      # Weights selected by the plan's Subscription.tier:
      if tier == FAMILY: (W_VAULT, W_DIR, W_DEP, W_BEN) = (30, 20, 20, 30)
      else:              (W_VAULT, W_DIR, W_DEP, W_BEN) = (40, 20, 20, 20)

      raw = W_VAULT * min(sealed_item_count / TARGET_ITEMS, 1)
          + W_DIR   * min(active_directive_count / TARGET_DIRECTIVES, 1)
          + W_DEP   * (1 if accepted_deputy_count >= 1 else 0)
          + W_BEN   * min(beneficiary_count / TARGET_BENEFICIARIES, 1)
      completeness_pct = round_half_up(raw)   # integer 0..100
    input_set: "All non-ARCHIVED VaultItems; ACTIVE Directives; ACCEPTED Deputies; NOMINATED/VESTED Beneficiaries; the plan's single Subscription for tier"
    constants: { TARGET_ITEMS: 5, TARGET_DIRECTIVES: 2, TARGET_BENEFICIARIES: 3 }
    precision: "integer percent, round_half_up"

  - name: subscription_refund
    trigger: "POST /legacy/subscriptions/{subscription_id}/cancel"
    algorithm: forward_looking
    formula: |
      period_days   = 30
      remaining_days = max(0, floor((period_end - current_clock) / 1 day))
      IMMEDIATE_PRORATA: last_refund_cents = round_half_up(monthly_fee_cents * remaining_days / period_days)
      FORFEIT:           last_refund_cents = 0
    input_set: "The subscription being canceled; current logical clock; its monthly_fee_cents (from tier) and period_end"
    constants: { PERIOD_DAYS: 30 }
    precision: "cents, round_half_up"
    variants:
      - { name: IMMEDIATE_PRORATA, when: "refund_policy=IMMEDIATE_PRORATA", difference: "refunds the unused portion of the current period by remaining whole days" }
      - { name: FORFEIT, when: "refund_policy=FORFEIT", difference: "refunds nothing; access continues until period_end" }

  - name: beneficiary_allocation
    trigger: "system — a linked ASSET VaultItem transitions SEALED->RELEASED (cascade from ReleaseRequest grant)"
    algorithm: waterfall_allocation
    formula: |
      # Basis chosen by the ASSET's distribution_basis.
      basis_value = (net_value_cents if item.distribution_basis == NET else gross_value_cents)
      Bset = [Beneficiary b with asset_vault_item_id=item.id and status=NOMINATED], ordered by created_at ASC
      # Rounding order is PINNED: floor each beneficiary first, THEN distribute the remainder.
      for b in Bset: raw_b   = basis_value * (b.allocation_pct / 100)
      for b in Bset: floor_b = floor(raw_b)
      remainder = basis_value_allocated_share - sum(floor_b)
        where basis_value_allocated_share = floor(basis_value * (sum(allocation_pct)/100))
      # Distribute the leftover cents one at a time to beneficiaries in created_at ASC order:
      for i in range(remainder): Bset[i].allocated_value_cents = floor_b(Bset[i]) + 1
      remaining beneficiaries: allocated_value_cents = floor_b
    input_set: "NOMINATED Beneficiaries linked to the released ASSET; the asset's net/gross value per distribution_basis"
    constants: {}
    precision: "cents; floor per beneficiary then waterfall the remainder by created_at ASC (never by id)"
    variants:
      - { name: NET, when: "item.distribution_basis=NET", difference: "distributes net_value_cents = max(gross - liability, 0)" }
      - { name: GROSS, when: "item.distribution_basis=GROSS", difference: "distributes gross_value_cents, ignoring liability_cents" }

  - name: seat_accounting
    trigger: "Deputy create/accept/revoke; Share create/revoke/expire; GET /legacy/plans/{plan_id}"
    algorithm: aggregation
    formula: |
      seats_used      = count(Deputy status IN {INVITED, ACCEPTED} AND consumes_seat=true on plan)
                      + count(Share status=ACTIVE on plan)
      seat_limit      = Subscription.seat_limit (FREE=1, PLUS=5, FAMILY=10; 0 if no subscription)
      seats_available = max(seat_limit - seats_used, 0)
    input_set: "Non-revoked seat-consuming Deputies and ACTIVE Shares on the plan; the plan's Subscription tier"
    constants: { FREE_SEATS: 1, PLUS_SEATS: 5, FAMILY_SEATS: 10 }
    precision: "integer counts"

  - name: release_quorum
    trigger: "POST /legacy/release-requests/{release_request_id}/verify (pins required_approvals); POST .../approve (advances approval_count)"
    algorithm: threshold
    formula: |
      accepted_deputy_count = count(Deputy status=ACCEPTED on plan) at the moment of verify
      required_approvals    = max(1, ceil(accepted_deputy_count * QUORUM_FRACTION))
      # A request becomes APPROVED the instant approval_count >= required_approvals (>=, not >).
    input_set: "ACCEPTED deputies on the plan at verify time; distinct APPROVE voters thereafter"
    constants: { QUORUM_FRACTION: 0.5 }
    precision: "integer counts; boundary is >= (exactly meeting the quorum approves)"

  - name: next_review_due
    trigger: "ReviewReminder create; POST /legacy/review-reminders/{reminder_id}/complete"
    algorithm: decay_function
    formula: |
      due_at = last_reviewed_at + interval_days days
      # Sweep classification against current clock:
      #   clock <  due_at                        -> SCHEDULED
      #   due_at <= clock < due_at + GRACE_DAYS  -> DUE
      #   clock >= due_at + GRACE_DAYS           -> OVERDUE
    input_set: "The reminder's last_reviewed_at and interval_days; current logical clock"
    constants: { GRACE_DAYS: 30 }
    precision: "day-resolution datetimes (ISO 8601 UTC)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body/query is well-formed: required fields present, enums in range, numbers non-negative, allocation_pct in [0,100]"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path id and every FK in the body resolves to an existing resource (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Acting principal owns/serves the target: Owner's X-User-ID equals the resource's plan_id; Deputy's X-User-ID equals a Deputy whose plan_id matches the target's plan"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all mutating endpoints and deputy reads"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Deputy reading a VaultItem: item.status=RELEASED AND item.kind in the deputy's access_scope AND a GRANTED ReleaseRequest by this deputy covers the item's kind"
    error_id: ERR_ACCESS_NOT_RELEASED
    http_status: 403
    applies_to: "GET /legacy/vault-items/{item_id} and GET /legacy/vault-items when acting role is Deputy"

  - priority: 8
    category: business_safety
    check: "ReleaseRequest verify: Plan.life_status satisfies trigger_type (ON_DEATH->DECEASED; ON_INCAPACITY->INCAPACITATED|DECEASED)"
    error_id: ERR_RELEASE_NOT_TRIGGERED
    http_status: 409
    applies_to: "POST /legacy/release-requests/{release_request_id}/verify"

  - priority: 9
    category: business_referential
    check: "A body FK must belong to the same plan as the target (e.g., Share.vault_item_id's plan_id equals Share.plan_id; ReleaseRequest.requested_by_deputy_id's plan_id equals its plan_id)"
    error_id: ERR_CROSS_PLAN_REFERENCE
    http_status: 422
    applies_to: "POST /legacy/shares, POST /legacy/release-requests, POST /legacy/beneficiaries"

  - priority: 10
    category: business_temporal
    check: "Share window overlap: for the same (vault_item_id, shared_with_email) an existing ACTIVE share's [effective_at, expires_at) must not overlap the new half-open window; touching ends (end==start) are allowed"
    error_id: ERR_SHARE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /legacy/shares"

  - priority: 10
    category: business_temporal
    check: "Deputy term overlap: for the same (plan_id, deputy_role) a non-REVOKED deputy's closed [authority_start_at, authority_end_at] plus a BUFFER_DAYS=7 guard must not overlap the new term (gap must exceed 7 days)"
    error_id: ERR_DEPUTY_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /legacy/deputies"

  - priority: 11
    category: business_constraint
    check: "Seat capacity: seats_used < seat_limit before adding a seat-consuming Deputy or an ACTIVE Share (reject when seats_used >= seat_limit)"
    error_id: ERR_SEAT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /legacy/deputies, POST /legacy/shares"

  - priority: 11
    category: business_constraint
    check: "Beneficiary allocation ceiling: sum(allocation_pct of NOMINATED beneficiaries for an ASSET) must not exceed 100 at seal time"
    error_id: ERR_ALLOCATION_EXCEEDS_100
    http_status: 422
    applies_to: "POST /legacy/vault-items/{item_id}/seal"

  - priority: 11
    category: business_constraint
    check: "One vote per deputy: a deputy may not approve/reject the same ReleaseRequest twice"
    error_id: ERR_DUPLICATE_APPROVAL
    http_status: 409
    applies_to: "POST /legacy/release-requests/{release_request_id}/approve"

  - priority: 11
    category: business_constraint
    check: "Grant requires quorum: when the request is VERIFIED but approval_count < required_approvals, grant is rejected (grant from any non-VERIFIED, non-APPROVED state is ERR_INVALID_STATE instead)"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /legacy/release-requests/{release_request_id}/grant"

  - priority: 11
    category: business_constraint
    check: "Grant with empty release set: at least one SEALED VaultItem whose kind is in scope_kinds must exist"
    error_id: ERR_NOTHING_TO_RELEASE
    http_status: 422
    applies_to: "POST /legacy/release-requests/{release_request_id}/grant"

  - priority: 12
    category: business_fiscal
    check: "Secured release: the plan's Subscription must not be PAST_DUE when granting a release"
    error_id: ERR_SUBSCRIPTION_PAST_DUE
    http_status: 402
    applies_to: "POST /legacy/release-requests/{release_request_id}/grant"

  - priority: 12
    category: business_fiscal
    check: "External sharing requires a paid ACTIVE subscription (tier != FREE and status=ACTIVE)"
    error_id: ERR_SUBSCRIPTION_REQUIRED
    http_status: 402
    applies_to: "POST /legacy/shares"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_plan_version must equal Plan.version on directive activate"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /legacy/directives/{directive_id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Plan ----
  - method: POST
    path: "/legacy/plans"
    description: "Create an estate plan"
    roles: [Owner, PlatformAdmin]
    code: 201
    input: [owner_full_name, owner_email]
    output: Plan
    side_effects: ["life_status=ACTIVE", "version=1"]

  - method: GET
    path: "/legacy/plans/{plan_id}"
    description: "Get a plan (includes computed completeness_pct, seats_used, seats_available)"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: []
    output: Plan
    side_effects: ["Recompute completeness_pct (plan_completeness_pct) and seat_accounting"]

  - method: GET
    path: "/legacy/plans/{plan_id}/completeness"
    description: "Computed read of the plan readiness score"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Recompute completeness_pct"]

  - method: POST
    path: "/legacy/plans/{plan_id}/life-status"
    description: "Record a verified owner life event (incapacity/death)"
    roles: [PlatformAdmin]
    code: 200
    input: [new_status, evidence_ref]
    output: Plan
    side_effects:
      - "life_status -> new_status (ACTIVE->INCAPACITATED->DECEASED)"
      - "On DECEASED: cascade SCHEDULED/DUE/OVERDUE ReviewReminders -> DISMISSED"
      - "increments Plan.version by 1"

  # ---- VaultItem ----
  - method: POST
    path: "/legacy/vault-items"
    description: "Create a vault item (account/asset/document)"
    roles: [Owner]
    code: 201
    input: [plan_id, kind, category, title, secret_ref, "sensitivity?", "gross_value_cents?", "liability_cents?", "distribution_basis?"]
    output: VaultItem
    side_effects: ["status=DRAFT", "net_value_cents computed for ASSET"]

  - method: GET
    path: "/legacy/vault-items"
    description: "List vault items (filterable)"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: ["plan_id?", "kind?", "status?", "limit?", "offset?"]
    output: VaultItem[]
    side_effects: []

  - method: GET
    path: "/legacy/vault-items/{item_id}"
    description: "Get a vault item (Deputy access gated by secure-access validation)"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: []
    output: VaultItem
    side_effects: []

  - method: POST
    path: "/legacy/vault-items/{item_id}/seal"
    description: "Seal a vault item"
    roles: [Owner]
    code: 200
    input: []
    output: VaultItem
    side_effects: ["status DRAFT->SEALED"]

  - method: POST
    path: "/legacy/vault-items/{item_id}/recall"
    description: "Recall a released item back to SEALED (compensation)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: VaultItem
    side_effects: ["status RELEASED->SEALED", "linked VESTED Beneficiaries -> NOMINATED, allocated_value_cents reset to 0"]

  - method: POST
    path: "/legacy/vault-items/{item_id}/archive"
    description: "Archive (soft-delete) a vault item"
    roles: [Owner]
    code: 200
    input: []
    output: VaultItem
    side_effects: ["status -> ARCHIVED"]

  # ---- Deputy ----
  - method: POST
    path: "/legacy/deputies"
    description: "Designate a deputy/executor"
    roles: [Owner]
    code: 201
    input: [plan_id, full_name, email, deputy_role, access_scope, release_trigger, authority_start_at, authority_end_at, "consumes_seat?"]
    output: Deputy
    side_effects: ["status=INVITED", "seat_accounting recomputes", "seat capacity + term-overlap checks"]

  - method: GET
    path: "/legacy/deputies"
    description: "List deputies (filterable)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["plan_id?", "deputy_role?", "status?", "limit?", "offset?"]
    output: Deputy[]
    side_effects: []

  - method: GET
    path: "/legacy/deputies/{deputy_id}"
    description: "Get a deputy"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: []
    output: Deputy
    side_effects: []

  - method: POST
    path: "/legacy/deputies/{deputy_id}/accept"
    description: "Deputy accepts the designation"
    roles: [Deputy]
    code: 200
    input: []
    output: Deputy
    side_effects: ["status INVITED->ACCEPTED"]

  - method: POST
    path: "/legacy/deputies/{deputy_id}/revoke"
    description: "Owner revokes a deputy"
    roles: [Owner]
    code: 200
    input: []
    output: Deputy
    side_effects: ["status -> REVOKED", "frees seat", "cascade PENDING/VERIFIED ReleaseRequests by this deputy -> DENIED"]

  # ---- Beneficiary ----
  - method: POST
    path: "/legacy/beneficiaries"
    description: "Add a beneficiary/contact (optionally under a parent node and linked to an ASSET)"
    roles: [Owner]
    code: 201
    input: [plan_id, full_name, relationship, "contact_email?", "allocation_pct?", "parent_beneficiary_id?", "asset_vault_item_id?"]
    output: Beneficiary
    side_effects: ["status=NOMINATED"]

  - method: GET
    path: "/legacy/beneficiaries"
    description: "List beneficiaries (filter by plan, parent node, or linked asset)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["plan_id?", "parent_beneficiary_id?", "asset_vault_item_id?", "status?", "limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []

  - method: GET
    path: "/legacy/beneficiaries/{beneficiary_id}"
    description: "Get a beneficiary"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: POST
    path: "/legacy/beneficiaries/{beneficiary_id}/remove"
    description: "Remove a beneficiary"
    roles: [Owner]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status NOMINATED->REMOVED"]

  # ---- Directive ----
  - method: POST
    path: "/legacy/directives"
    description: "Draft an advance directive / wish"
    roles: [Owner]
    code: 201
    input: [plan_id, directive_type, content]
    output: Directive
    side_effects: ["status=DRAFT", "version_number=1"]

  - method: GET
    path: "/legacy/directives"
    description: "List directives (filterable)"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: ["plan_id?", "directive_type?", "status?", "limit?", "offset?"]
    output: Directive[]
    side_effects: []

  - method: GET
    path: "/legacy/directives/{directive_id}"
    description: "Get a directive"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: []
    output: Directive
    side_effects: []

  - method: POST
    path: "/legacy/directives/{directive_id}/activate"
    description: "Activate a directive (supersedes prior ACTIVE of same type); OCC on Plan.version"
    roles: [Owner]
    code: 200
    input: [expected_plan_version]
    output: Directive
    side_effects:
      - "status DRAFT|UNDER_REVISION -> ACTIVE"
      - "prior ACTIVE Directive of same directive_type -> SUPERSEDED"
      - "increments Plan.version by 1"

  - method: POST
    path: "/legacy/directives/{directive_id}/revise"
    description: "Open a directive for revision"
    roles: [Owner]
    code: 200
    input: []
    output: Directive
    side_effects: ["status ACTIVE->UNDER_REVISION", "version_number incremented"]

  - method: POST
    path: "/legacy/directives/{directive_id}/revoke"
    description: "Revoke a directive"
    roles: [Owner]
    code: 200
    input: []
    output: Directive
    side_effects: ["status -> REVOKED"]

  # ---- ReleaseRequest ----
  - method: POST
    path: "/legacy/release-requests"
    description: "Deputy files a release request"
    roles: [Deputy]
    code: 201
    input: [plan_id, trigger_type, scope_kinds]
    output: ReleaseRequest
    side_effects: ["status=PENDING", "requested_by_deputy_id = acting deputy", "approver_deputy_ids=[]"]

  - method: GET
    path: "/legacy/release-requests"
    description: "List release requests (filterable)"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: ["plan_id?", "requested_by_deputy_id?", "status?", "limit?", "offset?"]
    output: ReleaseRequest[]
    side_effects: []

  - method: GET
    path: "/legacy/release-requests/{release_request_id}"
    description: "Get a release request"
    roles: [Owner, PlatformAdmin, Deputy]
    code: 200
    input: []
    output: ReleaseRequest
    side_effects: []

  - method: POST
    path: "/legacy/release-requests/{release_request_id}/verify"
    description: "Admin verifies the life-trigger; pins quorum and expiry"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReleaseRequest
    side_effects: ["status PENDING->VERIFIED", "required_approvals pinned (release_quorum)", "expires_at = clock + 14 days"]

  - method: POST
    path: "/legacy/release-requests/{release_request_id}/approve"
    description: "Deputy casts an APPROVE or REJECT vote"
    roles: [Deputy]
    code: 200
    input: [decision, "note?"]
    output: ReleaseRequest
    side_effects:
      - "APPROVE: append deputy to approver_deputy_ids, approval_count++, VERIFIED->APPROVED when approval_count >= required_approvals"
      - "REJECT: status VERIFIED->DENIED (veto)"

  - method: POST
    path: "/legacy/release-requests/{release_request_id}/deny"
    description: "Admin denies a release request"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReleaseRequest
    side_effects: ["status PENDING|VERIFIED -> DENIED"]

  - method: POST
    path: "/legacy/release-requests/{release_request_id}/grant"
    description: "Admin grants an approved release; releases in-scope items"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReleaseRequest
    side_effects:
      - "status APPROVED->GRANTED"
      - "CASCADE: SEALED VaultItems whose kind in scope_kinds -> RELEASED -> linked Beneficiaries VESTED (beneficiary_allocation)"

  # ---- Subscription ----
  - method: POST
    path: "/legacy/subscriptions"
    description: "Create a subscription for a plan"
    roles: [Owner]
    code: 201
    input: [plan_id, tier, "refund_policy?"]
    output: Subscription
    side_effects: ["status=TRIALING", "seat_limit + monthly_fee_cents from tier", "period_start=clock, period_end=clock+30d"]

  - method: GET
    path: "/legacy/subscriptions"
    description: "List subscriptions (filterable)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/legacy/subscriptions/{subscription_id}"
    description: "Get a subscription"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/legacy/subscriptions/{subscription_id}/cancel"
    description: "Cancel a subscription (computes refund, revokes shares)"
    roles: [Owner]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> CANCELED", "last_refund_cents = subscription_refund", "cascade ACTIVE Shares -> REVOKED"]

  - method: POST
    path: "/legacy/subscriptions/{subscription_id}/record-payment"
    description: "Record a billing outcome (advances or dunning)"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: Subscription
    side_effects: ["SUCCEEDED: -> ACTIVE, advance period", "FAILED: ACTIVE -> PAST_DUE"]

  # ---- Share ----
  - method: POST
    path: "/legacy/shares"
    description: "Share an item or the whole plan with a contact (paid tiers)"
    roles: [Owner]
    code: 201
    input: [plan_id, "vault_item_id?", shared_with_email, scope, effective_at, expires_at]
    output: Share
    side_effects: ["status=ACTIVE", "seat_accounting recomputes", "subscription + overlap + cross-plan checks"]

  - method: GET
    path: "/legacy/shares"
    description: "List shares (filterable)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["plan_id?", "vault_item_id?", "status?", "limit?", "offset?"]
    output: Share[]
    side_effects: []

  - method: GET
    path: "/legacy/shares/{share_id}"
    description: "Get a share"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Share
    side_effects: []

  - method: POST
    path: "/legacy/shares/{share_id}/revoke"
    description: "Revoke a share"
    roles: [Owner]
    code: 200
    input: []
    output: Share
    side_effects: ["status ACTIVE->REVOKED", "frees seat"]

  # ---- Integration ----
  - method: POST
    path: "/legacy/integrations"
    description: "Link an external will/insurance record"
    roles: [Owner]
    code: 201
    input: [plan_id, provider_type, provider_name, external_ref, "coverage_cents?"]
    output: Integration
    side_effects: ["sync_status=LINKED"]

  - method: GET
    path: "/legacy/integrations"
    description: "List integrations (filterable)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["plan_id?", "provider_type?", "sync_status?", "limit?", "offset?"]
    output: Integration[]
    side_effects: []

  - method: GET
    path: "/legacy/integrations/{integration_id}"
    description: "Get an integration"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Integration
    side_effects: []

  - method: POST
    path: "/legacy/integrations/{integration_id}/sync"
    description: "Sync an external record"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Integration
    side_effects: ["sync_status LINKED/STALE/ERROR -> SYNCING -> LINKED", "last_synced_at = clock"]

  # ---- ReviewReminder ----
  - method: POST
    path: "/legacy/review-reminders"
    description: "Schedule a review reminder"
    roles: [Owner]
    code: 201
    input: [plan_id, subject_kind, "interval_days?", last_reviewed_at]
    output: ReviewReminder
    side_effects: ["status=SCHEDULED", "due_at = last_reviewed_at + interval_days"]

  - method: GET
    path: "/legacy/review-reminders"
    description: "List review reminders (filterable)"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["plan_id?", "subject_kind?", "status?", "limit?", "offset?"]
    output: ReviewReminder[]
    side_effects: []

  - method: GET
    path: "/legacy/review-reminders/{reminder_id}"
    description: "Get a review reminder"
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: ReviewReminder
    side_effects: []

  - method: POST
    path: "/legacy/review-reminders/{reminder_id}/complete"
    description: "Mark a review complete"
    roles: [Owner]
    code: 200
    input: []
    output: ReviewReminder
    side_effects: ["status -> COMPLETED", "last_reviewed_at = clock"]

  # ---- Ops / test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced to to_iso8601"]

  - method: POST
    path: "/_ops/run-review-sweep"
    description: "Advance clock-driven lifecycles for a plan: reminders SCHEDULED->DUE->OVERDUE, ACTIVE Shares past expires_at -> EXPIRED, VERIFIED/PENDING ReleaseRequests past expires_at -> EXPIRED"
    roles: [PlatformAdmin]
    code: 200
    input: [plan_id]
    output: Plan
    side_effects: ["ReviewReminder, Share, ReleaseRequest sweeps against current clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body/query: missing required field, bad enum, negative amount, allocation_pct out of [0,100]" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK does not resolve to an existing resource" }
  - { id: ERR_FORBIDDEN_SCOPE, http: 403, condition: "Acting principal does not own/serve the target plan" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_ACCESS_NOT_RELEASED, http: 403, condition: "Deputy read of a vault item that is not RELEASED, out of access_scope, or not covered by a GRANTED release" }
  - { id: ERR_RELEASE_NOT_TRIGGERED, http: 409, condition: "Verify attempted while Plan.life_status does not satisfy trigger_type" }
  - { id: ERR_CROSS_PLAN_REFERENCE, http: 422, condition: "A body FK belongs to a different plan than the target" }
  - { id: ERR_SHARE_WINDOW_OVERLAP, http: 409, condition: "New share's half-open window overlaps an existing ACTIVE share for the same item+email" }
  - { id: ERR_DEPUTY_TERM_OVERLAP, http: 409, condition: "New deputy term for the same plan+role overlaps (within 7-day buffer) an existing non-revoked term" }
  - { id: ERR_SEAT_LIMIT_REACHED, http: 409, condition: "seats_used >= seat_limit when adding a seat-consuming deputy or active share" }
  - { id: ERR_ALLOCATION_EXCEEDS_100, http: 422, condition: "Sum of allocation_pct for an ASSET's NOMINATED beneficiaries exceeds 100 at seal" }
  - { id: ERR_DUPLICATE_APPROVAL, http: 409, condition: "Deputy votes on the same release request more than once" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Grant attempted on a VERIFIED request whose approval_count < required_approvals" }
  - { id: ERR_NOTHING_TO_RELEASE, http: 422, condition: "Grant with no SEALED in-scope vault items to release" }
  - { id: ERR_SUBSCRIPTION_PAST_DUE, http: 402, condition: "Grant attempted while the plan's subscription is PAST_DUE" }
  - { id: ERR_SUBSCRIPTION_REQUIRED, http: 402, condition: "External share created without an ACTIVE paid (non-FREE) subscription" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_plan_version does not match Plan.version on directive activate" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Referenced plan does not exist" }
  - { id: ERR_VAULT_ITEM_NOT_FOUND, http: 404, condition: "Referenced vault item does not exist" }
  - { id: ERR_DEPUTY_NOT_FOUND, http: 404, condition: "Referenced deputy does not exist" }
  - { id: ERR_RELEASE_REQUEST_NOT_FOUND, http: 404, condition: "Referenced release request does not exist" }
  - { id: ERR_DIRECTIVE_NOT_FOUND, http: 404, condition: "Referenced directive does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Referenced subscription does not exist" }
  - { id: ERR_SHARE_NOT_FOUND, http: 404, condition: "Referenced share does not exist" }
  - { id: ERR_INVALID_LIFE_EVENT, http: 422, condition: "life-status transition is not one of ACTIVE->INCAPACITATED->DECEASED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "The estate owner. Manages the vault, deputies, beneficiaries, directives, subscription, shares, integrations, and reminders on their own plan."
    identity: "entity_backed:Plan"
    exclusive_operations:
      - "POST /legacy/vault-items (+ seal/recall/archive)"
      - "POST /legacy/deputies (+ revoke)"
      - "POST /legacy/beneficiaries (+ remove)"
      - "POST /legacy/directives (+ activate/revise/revoke)"
      - "POST /legacy/subscriptions (+ cancel)"
      - "POST /legacy/shares (+ revoke)"
      - "POST /legacy/integrations (+ sync)"
      - "POST /legacy/review-reminders (+ complete)"
    shared_operations:
      - "POST /legacy/plans"
      - "GET reads on own plan's resources"

  - name: Deputy
    description: "A designated executor/proxy/guardian/viewer. Accepts the designation, files and votes on release requests, and reads released in-scope items (secure access)."
    identity: "entity_backed:Deputy"
    exclusive_operations:
      - "POST /legacy/deputies/{deputy_id}/accept"
      - "POST /legacy/release-requests (file)"
      - "POST /legacy/release-requests/{id}/approve (vote)"
    shared_operations:
      - "GET /legacy/plans/{id}, GET /legacy/vault-items (gated), GET /legacy/directives, GET /legacy/release-requests"

  - name: PlatformAdmin
    description: "Operational role. Verifies life events, verifies/denies/grants release requests, records billing outcomes, runs sweeps, sets the logical clock. Not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /legacy/plans/{id}/life-status"
      - "POST /legacy/release-requests/{id}/verify | /deny | /grant"
      - "POST /legacy/subscriptions/{id}/record-payment"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-review-sweep"
    shared_operations:
      - "POST /legacy/plans, GET reads, POST /legacy/vault-items/{id}/recall, POST /legacy/integrations/{id}/sync"
