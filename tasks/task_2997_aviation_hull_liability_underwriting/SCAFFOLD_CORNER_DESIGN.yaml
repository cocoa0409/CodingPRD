          setup:
            - "Clock at 2026-08-15T00:00:00Z; one FLIGHT_SCHOOL operator; one 2016 airframe with hull_new_value_cents 66000000 (depreciated 39600000 in 2026 giving a cap of 47520000; depreciated 36960000 in 2027 giving a cap of 44352000); one ATPL pilot; one DRAFT FLEET policy 2026-09-01 to 2027-09-01 WORLDWIDE with hull_aggregate_limit_cents 900000000."
