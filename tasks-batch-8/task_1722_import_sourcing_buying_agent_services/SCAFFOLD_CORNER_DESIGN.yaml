        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SOURCING_REQUEST_NOT_FOUND]"]
        distinguishing_aspect: "POST /sourcing/sourcing-requests/{badId}/samples with an unknown SR id fails ERR_SOURCING_REQUEST_NOT_FOUND (404) before any payload or state check."
        test_recipe:
          setup: ["Agent a1 exists"]
