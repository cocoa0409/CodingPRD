            - "GET /pipeline/nominations?cycle_id=${cyc_id} returns total_count == 0"
            - "NominationCycle.${cyc_id}.status == OPEN, nominated_total_bbl == 0, version == ${cyc_v0}"

      - name: injection_blocked_by_shut_segment
        grounds:
          - validations[priority=58]
          - errors[ERR_SEGMENT_UNAVAILABLE]
          - entities.PipelineSegment.fields.operational_status
