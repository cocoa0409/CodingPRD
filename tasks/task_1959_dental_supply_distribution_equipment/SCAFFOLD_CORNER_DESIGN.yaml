          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN; no DispatchJob created"

      - name: manufacturer_agent_cannot_file_claim
        claim_type: rbac_deny
        grounds: ["roles[PracticeManager]", "roles[ManufacturerAgent]"]
        distinguishing_aspect: "Claim filing is exclusive to PracticeManager; the ManufacturerAgent (the settling counterparty) gets 403, enforcing the file/settle role split."
        test_recipe:
          setup: ["Practice P; product C; rebate promotion; delivered order"]
