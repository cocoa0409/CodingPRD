              captures: { lf_id: $.data.id }
            - call: "POST /special-waste-approvals"
              payload: { landfill_id: "${lf_id}", generator_name: "Gen B", waste_code: "IS-0002", profile_stream: "ASBESTOS", approved_tons_cap: 300, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { a2_id: $.data.id }
            - call: "POST /special-waste-approvals/${a2_id}/deny"
              payload: { decision_reason: "Not permitted" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { a2_v: $.data.version }
            - call: "POST /special-waste-approvals"
              payload: { landfill_id: "${lf_id}", generator_name: "Gen C", waste_code: "IS-0003", profile_stream: "CONTAMINATED_SOIL", approved_tons_cap: 200, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { a3_id: $.data.id }
            - call: "POST /special-waste-approvals/${a3_id}/approve"
              payload: { decision_reason: "Accepted" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
            - call: "POST /special-waste-approvals/${a3_id}/revoke"
              payload: { decision_reason: "Permit lost" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
          trigger:
            - call: "POST /special-waste-approvals/${a2_id}/approve"
              payload: { decision_reason: "Change of heart" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { err1: $.data.error_id }
            - call: "POST /special-waste-approvals/${a2_id}/revoke"
              payload: { decision_reason: "Cleanup" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { err2: $.data.error_id }
            - call: "POST /special-waste-approvals/${a3_id}/revoke"
              payload: { decision_reason: "Again" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409 and SpecialWasteApproval.${a2_id}.version is still ${a2_v}"
            - "${err2} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409 — DENIED is not in the revoke edge's source set"
            - "${err3} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409 and SpecialWasteApproval.${a3_id}.decision_reason is still 'Permit lost'"

      - name: dispatching_the_same_shipment_twice_is_rejected_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.LeachateShipment.SCHEDULED_to_DISPATCHED
          - state_machines.LeachateShipment.DISPATCHED_to_ACCEPTED
        distinguishing_aspect: "The action endpoints are not idempotent by design: replaying dispatch after the row has already left SCHEDULED must fail rather than silently re-succeed, and the first call's recorded hauler_ref must survive the replay."
        test_recipe:
          setup:
            - "Landfill LF (OPEN) with an ACTIVE TreatmentAgreement TA and one SCHEDULED shipment S-1 of 8000 gallons in the window [08:00, 12:00) on the clock date 2026-08-01."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", concurrent_slot_capacity: 4 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 8000, window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /leachate-shipments/${s1_id}/dispatch"
              payload: { hauler_ref: "TANKER-77" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s1_state: $.data.status, s1_hauler: $.data.hauler_ref, s1_v: $.data.version }
            - call: "POST /leachate-shipments/${s1_id}/dispatch"
              payload: { hauler_ref: "TANKER-99" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /leachate-shipments/${s1_id}/confirm-acceptance"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s1_state2: $.data.status, s1_total: $.data.invoice_total }
            - call: "POST /leachate-shipments/${s1_id}/confirm-acceptance"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "${s1_state} == 'DISPATCHED', ${s1_hauler} == 'TANKER-77' and ${s1_v} == 2"
            - "${err1} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409, and LeachateShipment.${s1_id}.hauler_ref is still 'TANKER-77' with version still 2"
            - "${s1_state2} == 'ACCEPTED', treatment_fee == 500.00 (8 kgal * 62.50), surcharge_pct == 0.06 (the pre-surcharge subtotal 850.00 sits between the 500.00 and 1200.00 tier ceilings) and ${s1_total} == 901.00"
            - "${err2} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409 and the invoice fields are not recomputed"
            - "TreatmentAgreement.${ta_id}.scheduled_gallons_today == 8000 throughout — DISPATCHED and ACCEPTED both stay inside the counted set"

      - name: fund_assurance_applies_its_whole_declared_side_effect_set
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /closure-cost-estimates/{closure_cost_estimate_id}/fund-assurance]
          - state_machines.ClosureCostEstimate.DRAFT_to_CERTIFIED
          - calculations.closure_and_post_closure_cost
        distinguishing_aspect: "Certifying with no money in the instrument must post SHORTFALL_REVIEW, and the later funding call must clear the shortfall to exactly 0.00 and flip the landfill to FUNDED in the same response — three fields on two entities from one call."
        test_recipe:
          setup:
