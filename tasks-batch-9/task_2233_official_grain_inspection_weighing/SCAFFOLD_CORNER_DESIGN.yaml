          - "entities.Certificate.fields.fee_total_cents"
          - "entities.ServiceArea.fields.open_watch_count"
        distinguishing_aspect: "The model is immediate, so no derived value may lag by even one request: the certificate that charges a fee must already carry the fee and the snapshots it froze, the applicant row read straight afterwards must already show the charge and the recomputed balance, and the area's open_watch_count must move inside the very response that scheduled the watch."
