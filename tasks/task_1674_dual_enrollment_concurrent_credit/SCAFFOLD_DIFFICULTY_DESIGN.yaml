# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Dual Enrollment & Concurrent Credit
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: gpa_college_vs_hs_divergence_same_grades
        grounds:
          - calculations.gpa_recompute
          - entities.Student.fields.college_gpa
          - entities.Student.fields.hs_gpa
          - entities.TranscriptEntry.fields.grade_points
          - state_machines.TranscriptEntry.PENDING_to_POSTED
        distinguishing_aspect: |
          Same student, same two letter grades (A in a 3-credit course, B in a
          4-credit course), posted to both transcripts: the college variant
          (4.0 scale, W excluded) yields 24/7 = 3.429 while the high-school
          variant (5.0 dual-credit weighted scale) yields 9/2 = 4.500 — two
          valid algorithms over the TranscriptEntry domain producing different
          GPAs on the Student domain. This instance is the Student-domain
          dual-variant; the Invoice-domain refund is the sibling instance.
        test_recipe:
          setup:
            - "One HS, one college term (add 2026-09-01, drop 2026-09-15, withdraw 2026-11-01, end 2026-12-15), one HS term (add 2026-09-05, drop 2026-09-10, withdraw 2026-10-25, end 2026-12-20)"
            - "MATH151: 3 college credits, 1.0 HS units, placement MATH >= 70; ENGL101: 4 college credits, 1.0 HS units, no placement"
            - "One instructor credentialed (APPROVED) for both courses; STATE_PROGRAM funding 40000/cr tuition, 30000/cr state, district cap 0"
            - "Two OPEN HS_CAMPUS offerings (one per course), capacity 2 each; one grade-12 student with MATH placement 85"
            - "Student REGISTERED in both offerings; clock advanced to 2026-12-16T00:00:00Z (past college term end); both offerings GRADING; grade A submitted for MATH151 enrollment, B for ENGL101 enrollment; both offerings FINALIZED; all four TranscriptEntries POSTED"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_math: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "ENGL101", title: "Composition I", college_credit_hours: 4, hs_credit_units: 1.0, placement_exam_code: "ENGL", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_eng: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_math}", qualification_summary: "MS Mathematics" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_m: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_m}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications/${cap_m}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_eng}", qualification_summary: "MA English" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_e: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_e}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications/${cap_e}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 0 }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_math}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: HS_CAMPUS }, as: DualCreditAdmin, captures: { off_m: $.data.id } }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_eng}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: HS_CAMPUS }, as: DualCreditAdmin, captures: { off_e: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ht_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_m}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_e}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { stu_id: $.data.id } }
            - { call: "POST /dual-credit/placement-records", payload: { student_id: "${stu_id}", exam_code: "MATH", score: 85, taken_at: "2026-08-01T00:00:00Z" }, as: HsCoordinator }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_m}" }, as: HsCoordinator, captures: { enr_m: $.data.id } }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_e}" }, as: HsCoordinator, captures: { enr_e: $.data.id } }
            - { call: "GET /dual-credit/offerings/${off_m}", as: Any, captures: { v_m1: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_m}/confirm", payload: { expected_offering_version: "${v_m1}" }, as: HsCoordinator }
            - { call: "GET /dual-credit/offerings/${off_e}", as: Any, captures: { v_e1: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_e}/confirm", payload: { expected_offering_version: "${v_e1}" }, as: HsCoordinator }
            - { call: "POST /dual-credit/_clock/set_current_utc", payload: { to_iso8601: "2026-12-16T00:00:00Z" }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_m}/start-session", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_m}/begin-grading", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_e}/start-session", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_e}/begin-grading", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/enrollments/${enr_m}/submit-grade", payload: { grade: A }, as: Instructor, as_user_id: "${ins_id}" }
            - { call: "POST /dual-credit/enrollments/${enr_e}/submit-grade", payload: { grade: B }, as: Instructor, as_user_id: "${ins_id}" }
            - { call: "POST /dual-credit/offerings/${off_m}/finalize", payload: {}, as: CollegeRegistrar }
            - { call: "POST /dual-credit/offerings/${off_e}/finalize", payload: {}, as: CollegeRegistrar }
            - { call: "GET /dual-credit/transcript-entries?enrollment_id=${enr_m}&institution=COLLEGE", as: Any, captures: { te_mc: "$.data[0].id" } }
            - { call: "GET /dual-credit/transcript-entries?enrollment_id=${enr_m}&institution=HIGH_SCHOOL", as: Any, captures: { te_mh: "$.data[0].id" } }
            - { call: "GET /dual-credit/transcript-entries?enrollment_id=${enr_e}&institution=COLLEGE", as: Any, captures: { te_ec: "$.data[0].id" } }
            - { call: "GET /dual-credit/transcript-entries?enrollment_id=${enr_e}&institution=HIGH_SCHOOL", as: Any, captures: { te_eh: "$.data[0].id" } }
            - { call: "POST /dual-credit/transcript-entries/${te_mc}/post", payload: {}, as: CollegeRegistrar }
            - { call: "POST /dual-credit/transcript-entries/${te_mh}/post", payload: {}, as: CollegeRegistrar }
            - { call: "POST /dual-credit/transcript-entries/${te_ec}/post", payload: {}, as: CollegeRegistrar }
            - { call: "POST /dual-credit/transcript-entries/${te_eh}/post", payload: {}, as: CollegeRegistrar }
          trigger:
            - { call: "GET /dual-credit/students/${stu_id}", as: Any }
          assert:
            - "Student.${stu_id}.college_gpa == 3.429  (college variant: (4x3 + 3x4)/7 = 24/7, round_half_up 3 decimals)"
            - "Student.${stu_id}.hs_gpa == 4.500  (HS variant: (5x1.0 + 4x1.0)/2 = 9/2 — same grades, different scale)"
            - "TranscriptEntry.${te_mc}.grade_points == 12 and TranscriptEntry.${te_mh}.grade_points == 5.0 for the identical grade A"

      - name: refund_provisional_vs_settled_divergence
        grounds:
          - calculations.refund_settlement
          - calculations.refund_percentage
          - entities.Invoice.fields.refund_estimate_cents
          - entities.Invoice.fields.refund_paid_cents
          - state_machines.Enrollment.REGISTERED_to_WITHDRAWN
        distinguishing_aspect: |
          Invoice-domain dual-variant (distinct from the Student-domain GPA
          instance): the estimate variant computes the 50 pct refund from
          BILLED payer shares (60000 cents on a 120000-cent invoice) while the
          settled variant computes it from PAID amounts only (family paid
          30000, state paid 0 -> settled refund 15000) — two valid algorithms
          over the same invoice producing different refund figures.
        test_recipe:
          setup:
            - "Standard fixture: STATE_PROGRAM agreement (tuition 40000/cr, state 30000/cr, district cap 0), MATH151 3-credit HS_CAMPUS offering capacity 2, REGISTERED student"
            - "Invoice: tuition_total_cents 120000, state 90000, district 0, family 30000; only the family bucket is paid (30000) -> PARTIALLY_PAID"
            - "Clock at 2026-09-12T00:00:00Z — after the HS drop deadline (09-10) but at/before the college drop deadline (09-15), i.e. inside the mismatch window"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MS Mathematics" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 0 }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: HS_CAMPUS }, as: DualCreditAdmin, captures: { off_id: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ht_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_id}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { stu_id: $.data.id } }
            - { call: "POST /dual-credit/placement-records", payload: { student_id: "${stu_id}", exam_code: "MATH", score: 85, taken_at: "2026-08-01T00:00:00Z" }, as: HsCoordinator }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_id}" }, as: HsCoordinator, captures: { enr_id: $.data.id } }
            - { call: "GET /dual-credit/offerings/${off_id}", as: Any, captures: { off_v: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_id}/confirm", payload: { expected_offering_version: "${off_v}" }, as: HsCoordinator }
            - { call: "GET /dual-credit/invoices?enrollment_id=${enr_id}", as: Any, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /dual-credit/invoices/${inv_id}/payments", payload: { payer: FAMILY, amount_cents: 30000 }, as: Bursar }
            - { call: "POST /dual-credit/_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T00:00:00Z" }, as: DualCreditAdmin }
          trigger:
            - { call: "POST /dual-credit/enrollments/${enr_id}/withdraw", payload: {}, as: HsCoordinator }
            - { call: "POST /dual-credit/invoices/${inv_id}/refund", payload: {}, as: Bursar }
          assert:
            - "Invoice.${inv_id}.refund_pct == 50 (mismatch window: now <= college drop_deadline 2026-09-15)"
            - "Invoice.${inv_id}.refund_estimate_cents == 60000 (estimate variant: billed 120000 x 50 pct)"
            - "Invoice.${inv_id}.est_state_refund_cents == 45000 and Invoice.${inv_id}.est_family_refund_cents == 15000"
            - "Invoice.${inv_id}.refund_paid_cents == 15000 (settled variant: paid_total 30000 x 50 pct — state paid 0 so state refund 0)"
            - "Invoice.${inv_id}.refund_status == PROCESSED and Invoice.${inv_id}.status == PARTIALLY_PAID (50 pct withdraw does not void)"

  - rule_id: combinatorial_formula
    instances:
      - name: tuition_waterfall_delivery_mode_branch
        grounds:
          - calculations.tuition_allocation
          - entities.Invoice.fields.state_amount_cents
          - entities.Invoice.fields.district_amount_cents
          - entities.Invoice.fields.family_amount_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (funding_model, delivery_mode,
          state_rate, district_cap, credit_hours) with non-linear interaction —
          nested min() for the state and district buckets plus a conditional
          branch on delivery_mode. Same course, same agreement: the HS_CAMPUS
          offering allocates 90000/30000/0 while the ONLINE offering allocates
          0/50000/70000 because STATE_PROGRAM covers only HS_CAMPUS delivery.
        test_recipe:
          setup:
            - "STATE_PROGRAM agreement: tuition 40000/cr, state_rate 30000/cr, district_cap 50000; MATH151 3 credits (total 120000)"
            - "Offering A HS_CAMPUS capacity 2; offering B ONLINE capacity 2; same course/terms/instructor (credentialed); one eligible student registered in both"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MS Mathematics" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 50000 }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: HS_CAMPUS }, as: DualCreditAdmin, captures: { off_a: $.data.id } }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: ONLINE }, as: DualCreditAdmin, captures: { off_b: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ht_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_a}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_b}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { stu_id: $.data.id } }
            - { call: "POST /dual-credit/placement-records", payload: { student_id: "${stu_id}", exam_code: "MATH", score: 85, taken_at: "2026-08-01T00:00:00Z" }, as: HsCoordinator }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_a}" }, as: HsCoordinator, captures: { enr_a: $.data.id } }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_b}" }, as: HsCoordinator, captures: { enr_b: $.data.id } }
            - { call: "GET /dual-credit/offerings/${off_a}", as: Any, captures: { v_a: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_a}/confirm", payload: { expected_offering_version: "${v_a}" }, as: HsCoordinator }
            - { call: "GET /dual-credit/offerings/${off_b}", as: Any, captures: { v_b: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_b}/confirm", payload: { expected_offering_version: "${v_b}" }, as: HsCoordinator }
            - { call: "GET /dual-credit/invoices?enrollment_id=${enr_a}", as: Any, captures: { inv_a: "$.data[0].id" } }
            - { call: "GET /dual-credit/invoices?enrollment_id=${enr_b}", as: Any, captures: { inv_b: "$.data[0].id" } }
          trigger:
            - { call: "GET /dual-credit/invoices/${inv_a}", as: Any }
            - { call: "GET /dual-credit/invoices/${inv_b}", as: Any }
          assert:
            - "Invoice.${inv_a}: tuition_total_cents == 120000, state_amount_cents == 90000 (min(120000, 30000x3)), district_amount_cents == 30000 (min(remainder 30000, cap 50000)), family_amount_cents == 0"
            - "Invoice.${inv_b}: tuition_total_cents == 120000, state_amount_cents == 0 (ONLINE delivery closes the state bucket), district_amount_cents == 50000 (min(120000, cap)), family_amount_cents == 70000"
            - "Both invoices conserve: state + district + family == tuition_total_cents"

      - name: refund_per_payer_rounding_order
        grounds:
          - calculations.refund_settlement
          - entities.Invoice.fields.est_family_refund_cents
          - entities.Invoice.fields.refund_paid_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the tuition waterfall's
          mode (a)): nested rounding where order matters. The pinned order is
          'round state and district halves first, family takes the remainder of
          the rounded total'. On a fully paid 33333-cent invoice split
          11111/10001/12221, withdrawing at 50 pct yields family refund 6110
          (16667 - 5556 - 5001); the unpinned 'round every payer half'
          alternative yields family 6111 and total 16668 — one cent apart.
        test_recipe:
          setup:
            - "STATE_PROGRAM agreement: tuition 33333/cr, state_rate 11111/cr, district_cap 10001; 1-credit course (hs_credit_units 0.5, placement waived)"
            - "HS_CAMPUS offering capacity 2; student REGISTERED; invoice 33333 split state 11111 / district 10001 / family 12221; all three buckets paid in full (status PAID)"
            - "Clock at 2026-09-12T00:00:00Z (inside the mismatch window: HS drop 09-10 < now <= college drop 09-15)"
          setup_api_calls:
