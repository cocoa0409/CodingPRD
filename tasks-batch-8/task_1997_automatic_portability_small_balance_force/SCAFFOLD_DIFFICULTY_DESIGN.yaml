            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-b", full_name: "Bob B", date_of_birth: "1981-02-02", mailing_address_line1: "2 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_b: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 50000, processing_date_balance_cents: 50000 }, as: PlanSponsor }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
          trigger:
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_b}", separation_date: "2026-07-16T00:00:00Z", separation_date_balance_cents: 60000, processing_date_balance_cents: 60000 }, as: PlanSponsor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE, http 409 — batch ${b_x} is LOCKED, not OPEN"

      - name: transfer_requires_recordkeeper_active
        grounds:
          - state_machines.SafeHarborIRA.MATCHED_to_TRANSFER_PENDING
          - errors[ERR_RECORDKEEPER_NOT_ACTIVE]
          - entities.Plan.fields.network_reachable
        distinguishing_aspect: |
          Pair Transfer -> Recordkeeper (different pair from case->batch): the prenotice gate is fully
          satisfied (delivered, window elapsed), the IRA is MATCHED, and the ONLY failing condition is
          the destination recordkeeper being SUSPENDED -> ERR_RECORDKEEPER_NOT_ACTIVE/422.
        test_recipe:
          setup:
            - "IRA ${ira} MATCHED to plan Y at RK-B; AUTO_PORTABILITY_PRENOTICE delivered 2026-08-01, clock at 2026-09-01 (window elapsed); RK-B then SUSPENDED"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-B", legal_name: "Recordkeeper B" }, as: ProviderOps, captures: { rk_b: $.data.id } }
