        distinguishing_aspect: "The 72h disbursement window is INCLUSIVE: at exactly approved_at + 72h the disburse succeeds; one second later a second approved application rejects manual disburse with ERR_DISBURSE_WINDOW_LAPSED and the sweep then expires it."
