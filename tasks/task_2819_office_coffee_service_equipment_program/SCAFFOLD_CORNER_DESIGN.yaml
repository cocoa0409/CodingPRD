              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 5 }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err_dup: "$.data.error_id" }
            - call: "POST /ocs/_clock/set_current_utc"
