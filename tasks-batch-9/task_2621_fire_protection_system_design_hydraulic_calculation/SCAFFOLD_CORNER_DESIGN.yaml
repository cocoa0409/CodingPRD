            - "FirePump.${fp1}.state == SUPERSEDED"
            - "Project.${p1}.sealed_calculation_count == 0"
            - "Project.${p1}.governing_hydraulic_calculation_id == null and governing_demand_gpm == 0.0"
            - "Project.${p1}.auxiliary_demand_gpm == 750.0 and total_system_demand_gpm == 750.0"

      - name: terminal_auxiliary_system_refuses_a_second_withdrawal
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=15]
          - state_machines.AuxiliarySystem.terminal_states
          - errors.ERR_TERMINAL_STATE_LOCKED
        excluded_because:
          difficulty_instance: compensating_invariant / auxiliary_withdrawal_returns_the_demand_ledger_to_its_exact_prior_total
          rationale: "That instance withdraws the FOAM_DELUGE system, asserts the ledger round trip, then re-issues the same withdrawal and asserts 409 ERR_TERMINAL_STATE_LOCKED with the ledger unmoved."

      - name: submittal_review_loop_returns_to_under_review_without_a_new_cycle
        claim_type: cyclic
        grounds:
          - state_machines.Submittal.UNDER_REVIEW_to_COMMENTS_ISSUED
          - state_machines.Submittal.COMMENTS_ISSUED_to_RESPONSE_COMPLETE
          - state_machines.Submittal.RESPONSE_COMPLETE_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / submittal_comment_response_review_cycle_keeps_cycle_number_at_one
          rationale: "That instance walks the full comment / respond / reopen loop twice and asserts cycle_number stays 1 and review_fee_usd stays 0.00 across both laps."

      - name: major_comment_cascade_stales_the_sheets_below_the_reopened_seals
        claim_type: cascade_down
        grounds:
          - state_machines.HydraulicCalculation.SEALED_to_REOPENED
          - state_machines.ShopDrawing.COORDINATED_to_STALE
          - state_machines.TradeClearance.CLEARED_to_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / major_comment_cascade_a_depth_four_invalidates_seal_sheet_and_clearances
          rationale: "Cascade A is asserted end-to-end there at depth four - comment, calculation, sheet, clearance - with the sealed counter decremented."

      - name: witness_failure_touches_only_commissioned_auxiliary_systems
        claim_type: conditional_cascade
        grounds:
          - state_machines.AuxiliarySystem.COMMISSIONED_to_DECOMMISSIONED_PENDING_RETEST
          - state_machines.AcceptanceTest.SCHEDULED_to_WITNESSED_FAIL
        excluded_because:
          difficulty_instance: transitive_cascade / witness_failure_cascade_b_freezes_project_and_decommissions_only_commissioned_systems
          rationale: "That instance keeps one PROPOSED and one COMMISSIONED system side by side and asserts only the COMMISSIONED one is decommissioned by cascade B."

      - name: withdrawing_the_comment_reverses_every_cascade_side_effect
        claim_type: compensation
        grounds:
          - state_machines.HydraulicCalculation.REOPENED_to_SEALED
          - state_machines.ShopDrawing.STALE_to_COORDINATED
          - state_machines.TradeClearance.STALE_to_CLEARED
        excluded_because:
          difficulty_instance: compensating_invariant / withdrawing_the_major_comment_reverses_cascade_a_with_no_counter_drift
          rationale: "The compensation leg - reseal with the original sealed_by_engineer_id and sealed_at, sheets back to COORDINATED, counters back to their pre-cascade values - is that instance's whole subject."

      - name: auxiliary_status_change_syncs_the_project_demand_ledger
        claim_type: ledger_sync
        grounds:
          - calculations.project_demand_ledger
          - entities.Project.fields.auxiliary_demand_gpm
          - entities.Project.fields.total_system_demand_gpm
        excluded_because:
          difficulty_instance: compensating_invariant / auxiliary_withdrawal_returns_the_demand_ledger_to_its_exact_prior_total
          rationale: "The before / after ledger reconciliation across a status change (2130.0 -> 2610.0 -> 2130.0) is asserted there to the tenth of a gpm."

  - section: calculations
    instances:
      - name: ceiling_height_density_adder_steps_at_thirty_five_feet_and_caps_at_six_hundredths
        claim_type: threshold
        grounds:
          - calculations.hazard_classification
          - entities.HazardArea.fields.design_density
          - entities.HazardArea.fields.ceiling_height_ft
        distinguishing_aspect: |
          Five ORDINARY_1 / CLASS_III areas differing only in ceiling_height_ft pin every corner of the
          adder: 30.0 ft is not above the trigger so the density stays 0.150, 34.9 ft is above it but
          the floor of 0.98 five-foot steps is still zero so it also stays 0.150, 35.0 ft earns exactly
          one step at 0.170, 45.0 ft earns three steps at 0.210 and 50.0 ft earns four steps but is
          clamped by the 0.06 ceiling back to 0.210. An implementation using round() or a bare division
          instead of floor() breaks the 34.9 ft row; one that omits the clamp breaks the 50.0 ft row.
        test_recipe:
          setup:
            - "One project FP-2601 in TX-AUS with lead engineer Dana Ruiz"
            - "Five hazard areas identical except for ceiling_height_ft: 30.0, 34.9, 35.0, 45.0, 50.0"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
