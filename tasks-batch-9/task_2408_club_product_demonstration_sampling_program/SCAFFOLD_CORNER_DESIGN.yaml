              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "VG-HNG-020", name: "Cedar Hangers", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 900, samples_per_case: 4, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 6, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { confirmed_event_id: "$.data.id" }
            - call: "POST /demo-events/${confirmed_event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${confirmed_event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "AFTERNOON", requested_sample_cases: 2, addon_services: [] }
