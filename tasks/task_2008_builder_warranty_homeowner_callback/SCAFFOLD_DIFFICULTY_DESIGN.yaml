      - name: coverage_term_end_exclusive
        grounds:
          - calculations.coverage_determination
          - validations[priority=17]
          - entities.Home.fields.workmanship_end_date
        distinguishing_aspect: |
          Date-instant metric through POST /service-requests/{id}/assess: the term window is
          half-open — a request reported at exactly the workmanship end instant
          (2027-08-01T00:00:00Z for closing 2026-08-01) is NOT covered, while one reported
          12 hours earlier IS covered.
