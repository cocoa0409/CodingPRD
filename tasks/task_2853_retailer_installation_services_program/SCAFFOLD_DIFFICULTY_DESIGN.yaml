  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Two DIFFERENT resource entities with DIFFERENT interval semantics:
  #   Installer    — HALF-OPEN windows, PAIRWISE conflict, 90-minute travel buffer
  #   Jurisdiction — CLOSED intervals, AGGREGATE concurrency count, no buffer
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: installer_windows_are_half_open_and_padded_by_a_ninety_minute_buffer
        grounds:
          - calculations.installer_capacity_and_overlap.constants.TRAVEL_BUFFER_MINUTES
          - calculations.installer_capacity_and_overlap.formula
          - validations[priority 23].ERR_INSTALLER_WINDOW_CONFLICT
          - entities.Installer.fields.committed_minutes
          - endpoints[POST /installer-assignments]
        distinguishing_aspect: |
          Resource entity: the Installer. Interval semantics: HALF-OPEN
          [window_start, window_end) compared PAIRWISE against every live
          assignment, with TRAVEL_BUFFER_MINUTES 90 added to each end and BOTH
          comparisons strict. A second window starting 2026-08-25T17:29:00.000Z
          conflicts with a live [08:00, 16:00) window because 17:29 < 16:00 + 90
          min, while 2026-08-25T17:30:00.000Z is accepted because 17:30 < 17:30
          is false. Back-to-back windows are therefore legal at exactly the
          buffer edge and illegal one minute inside it.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-DIRECT (measurement_required false, permit_policy NEVER) and Jurisdiction METRO-01 with license_required true."
            - "One Installer ACTIVE with a VERIFIED FLOORING credential for METRO-01."
            - "Two Projects P1 and P2 for the same customer, each estimated_units 420.00 with its 59002 deposit paid."
            - "P1 already carries a CONFIRMED assignment for [2026-08-25T08:00:00.000Z, 2026-08-25T16:00:00.000Z), so the installer's live window ends at 16:00 and its buffered end is 17:30."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /projects/${p1_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { p1_version: $.data.version }
            - call: "POST /installer-assignments"
              payload: { project_id: "${p1_id}", installer_id: "${inst_id}", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T16:00:00.000Z", expected_project_version: "${p1_version}" }
              as: ProjectCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /installer-assignments/${a1_id}/confirm"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "22 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T18:00:00.000Z" }
              as: ProjectCoordinator
              captures: { p2_id: $.data.id }
