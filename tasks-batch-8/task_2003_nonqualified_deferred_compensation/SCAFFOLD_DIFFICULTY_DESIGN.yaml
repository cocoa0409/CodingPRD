          assert:
            - "${window_status0} == SCHEDULED"
            - "${create_err} == ERR_WINDOW_NOT_OPEN (child create gated by window state)"
            - "ElectionWindow.${window_id}.status == OPEN after the clock reaches 2026-10-01"
            - "${election_status} == DRAFT and ${election_id} is a non-null id (create succeeds once the window opens)"
      - name: distribution_verify_gated_by_case_determination
        grounds:
