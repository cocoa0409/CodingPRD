  - rule_id: non_linear_state_machine
    instances:
      - name: farming_plan_revision_loop_terminates_at_two_rounds
        grounds:
          - state_machines.FarmingPlan.DRAFT_to_SUBMITTED
          - state_machines.FarmingPlan.SUBMITTED_to_DRAFT
          - state_machines.FarmingPlan.SUBMITTED_to_APPROVED
          - state_machines.Block.ESTABLISHING_to_BEARING
          - validations[priority=64]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          FarmingPlan carries a genuine cycle SUBMITTED -> DRAFT -> SUBMITTED whose loop counter
          revision_count is bounded by MAX_REVISION_ROUNDS 2, so the third return-for-revision is
          refused with ERR_REVISION_LIMIT_REACHED while the plan stays SUBMITTED and remains
          approvable; each traversal bumps version, so the plan reaches version 6 after three
          submits and two returns.
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 planted 2018 in farming_status ESTABLISHING."
            - "FarmingPlan P1 for B-12 plan_year 2026 in DRAFT, revision_count 0, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "PREMIUM", pruning_budget_per_acre: 420.00, canopy_budget_per_acre: 310.00, irrigation_budget_per_acre: 180.00, pest_budget_per_acre: 265.00, seasonal_water_cap_inches: 9.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "Round 1" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /farming-plans/${p1_id}/return-for-revision"
              payload: { revision_note: "Trim canopy budget" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { rev1_count: $.data.revision_count }
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "Round 2" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /farming-plans/${p1_id}/return-for-revision"
              payload: { revision_note: "Trim pest budget" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { rev2_count: $.data.revision_count }
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "Round 3" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_v_after_third_submit: $.data.version }
            - call: "POST /farming-plans/${p1_id}/return-for-revision"
              payload: { revision_note: "Third round attempt" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { limit_error: $.data.error_id }
            - call: "POST /farming-plans/${p1_id}/approve"
              payload: { approval_note: "Approved at round 3" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { p1_final_status: $.data.plan_status, p1_final_v: $.data.version }
            - call: "GET /blocks/${b1_id}"
              payload: {}
              as: Controller
              captures: { b1_status: $.data.farming_status }
          assert:
            - "after the first return-for-revision: FarmingPlan.${p1_id}.plan_status == DRAFT and revision_count == 1 and submitted_by_user_id is null"
            - "after the second return-for-revision: FarmingPlan.${p1_id}.revision_count == 2"
            - "after the third submit: FarmingPlan.${p1_id}.version == 6"
            - "third return-for-revision: error_id == ERR_REVISION_LIMIT_REACHED with HTTP 409"
            - "after the refused return: FarmingPlan.${p1_id}.plan_status == SUBMITTED and revision_count == 2 and version == 6"
            - "FarmingPlan.${p1_id}.plan_status == APPROVED after approve"
            - "FarmingPlan.${p1_id}.approved_by_user_id == u-ctl-1"
            - "FarmingPlan.${p1_id}.version == 7"
            - "Block.${b1_id}.farming_status == BEARING"
            - "Block.${b1_id}.version == 2"

      - name: work_order_payroll_axis_advances_independently_of_execution_axis
        grounds:
          - state_machines.WorkOrder.NOT_PAYABLE_to_PENDING
          - state_machines.WorkOrder.PENDING_to_APPROVED
          - state_machines.WorkOrder.APPROVED_to_PAID
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - validations[priority=70]
          - errors[ERR_PAYROLL_STATE_INVALID]
        distinguishing_aspect: |
          WorkOrder carries two independent state dimensions: payroll_status walks
          NOT_PAYABLE -> PENDING -> APPROVED -> PAID while execution_status stays frozen at its
          terminal COMPLETED, and PAY out of PENDING is refused with ERR_PAYROLL_STATE_INVALID
          even though the execution axis is already terminal — the two axes never gate each other
          beyond the one system edge that PENDING is entered by completion.
