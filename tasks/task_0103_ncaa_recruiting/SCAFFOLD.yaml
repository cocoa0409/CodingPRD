# =============================================================================
# NCAA Recruiting and NIL Compliance — Scaffold (v1)
# =============================================================================

scenario: |
  NCAA Recruiting and NIL Compliance: student-athlete eligibility (Eligibility
  Center), scholarship slot limits, recruiting calendar (Quiet/Contact/Dead
  periods), NIL endorsement approval, Transfer Portal, Booster violations.

domain_name: ncaa-recruiting
api_prefix: /programs

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - scheduled_deferred_actions

  entity_topology: flat
  # Athlete, Booster, Deal, Violation, PortalEntry are peer entities
  # cross-referencing each other via foreign keys, not nested URLs.

  state_machine_shape: cyclic
  # NILDeal and ComplianceViolation have revision/appeal loops (A->B->A).
  # Athlete has cycle ENROLLED -> TRANSFER_PORTAL -> ENROLLED via re-enrollment.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # Coach (recruiter) cannot also approve NIL deals or close violation cases —
  # ComplianceOfficer must adjudicate; Booster is gated separately.

  consistency_model: immediate

# =============================================================================
# §1.0  Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1  Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: institution_name, type: string, source: input, description: "School name (e.g., 'State University')." }
      - { name: sport, type: enum, source: input, description: "Sport code.", constraints: "FOOTBALL | MENS_BASKETBALL | WOMENS_BASKETBALL | BASEBALL | SOFTBALL" }
      - { name: division, type: enum, source: input, description: "NCAA division.", constraints: "DI | DII | DIII" }
      - { name: scholarship_cap_equivalencies, type: number, source: input, description: "Total scholarship equivalencies allowed for the sport (e.g., 85.0 for FBS football, 13.0 for MBB)." }
      - { name: roster_cap_count, type: integer, source: input, description: "Maximum head-count on active roster." }
      - { name: total_equivalencies_used, type: number, source: computed, description: "Sum of fractional_equivalency over ScholarshipSlot rows with status ACTIVE or SIGNED (see calculation scholarship_slot_usage)." }
      - { name: active_roster_count, type: integer, source: computed, description: "Count of Athlete rows with status ENROLLED and current_program_id == this.id." }
      - { name: compliance_status, type: enum, source: computed, description: "GREEN | YELLOW | RED — derived from program_compliance_posture calculation.", constraints: "GREEN | YELLOW | RED" }
      - { name: penalty_points_total, type: integer, source: computed, description: "Sum of penalty_points across ComplianceViolation rows where outcome == SUSTAINED for this program in the trailing 730 days." }

  - name: RecruitingCalendar
    parent: null
    common_fields: false  # immutable configuration windows; only id + created_at
    fields:
      - { name: program_id, type: string, source: input, description: "Program this window applies to." }
      - { name: period_type, type: enum, source: input, description: "Calendar period classification.", constraints: "QUIET | CONTACT | DEAD | EVALUATION" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive start of the window (UTC, midnight)." }
      - { name: end_date, type: datetime, source: input, description: "Exclusive end of the window (UTC, midnight)." }
      - { name: note, type: string, source: input, description: "Free-text rationale (e.g., 'NCAA spring evaluation window 2026')." }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Athlete legal name." }
      - { name: high_school, type: string, source: input, description: "Last attended high school." }
      - { name: graduation_year, type: integer, source: input, description: "Expected/actual high-school graduation year (YYYY)." }
      - { name: status, type: enum, source: system, description: "Lifecycle status. PROSPECTIVE -> COMMITTED -> ENROLLED; ENROLLED -> TRANSFER_PORTAL -> COMMITTED (cycle); ENROLLED -> INELIGIBLE (suspension).", constraints: "PROSPECTIVE | COMMITTED | ENROLLED | TRANSFER_PORTAL | INELIGIBLE" }
      - { name: current_program_id, type: string, source: system, description: "FK to Program once status == COMMITTED, ENROLLED, or INELIGIBLE; null while PROSPECTIVE; null while TRANSFER_PORTAL after the prior school releases the slot." }
      - { name: eligibility_record_id, type: string, source: system, description: "FK to EligibilityRecord; set when an Eligibility Center decision is posted; null otherwise." }
      - { name: amateur_status, type: enum, source: system, description: "Maintained by NIL/booster reviews.", constraints: "AMATEUR | AT_RISK | FORFEITED" }
      - { name: years_of_eligibility_remaining, type: integer, source: system, description: "Starts at 4 on first ENROLLED transition; decremented by 1 each fall_term_advance event while ENROLLED.", default: 4 }
      - { name: nil_deal_lifetime_value_cents, type: integer, source: computed, description: "Sum of approved_value_cents over NILDeal rows with status APPROVED for this athlete." }

  - name: EligibilityRecord
    parent: null
    common_fields: false  # append-only clearinghouse record
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK to Athlete." }
      - { name: core_gpa, type: number, source: input, description: "Core-course GPA on 4.00 scale, two decimals." }
      - { name: standardized_test_score, type: integer, source: input, description: "SAT-equivalent score (400-1600); -1 means test-optional waiver requested." }
      - { name: core_courses_completed, type: integer, source: input, description: "Count of NCAA-approved core courses completed (must be >= 16)." }
      - { name: decision, type: enum, source: input, description: "Eligibility Center adjudication (immutable after creation).", constraints: "QUALIFIER | PARTIAL_QUALIFIER | NON_QUALIFIER | INCOMPLETE" }
      - { name: decided_at, type: datetime, source: input, description: "Wall-clock timestamp of the Eligibility Center decision." }

  - name: ScholarshipSlot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK to Program — the slot belongs to this program." }
      - { name: athlete_id, type: string, source: input, description: "FK to Athlete holding the offer." }
      - { name: fractional_equivalency, type: number, source: input, description: "Portion of a full scholarship granted (0.00..1.00; equivalency-sport semantics)." }
      - { name: annual_value_cents, type: integer, source: input, description: "Annual stated cash value of the scholarship in USD cents." }
      - { name: status, type: enum, source: system, description: "OFFERED -> SIGNED -> ACTIVE; OFFERED -> WITHDRAWN; ACTIVE -> RELEASED / REVOKED.", constraints: "OFFERED | SIGNED | ACTIVE | WITHDRAWN | RELEASED | REVOKED" }
      - { name: signed_at, type: datetime, source: system, description: "Set when status moves to SIGNED." }
      - { name: activated_at, type: datetime, source: system, description: "Set when status moves to ACTIVE (athlete enrolls)." }

  - name: RecruitingContact
    parent: null
    common_fields: false  # append-only event log
    fields:
      - { name: program_id, type: string, source: input, description: "Recruiting program initiating contact." }
      - { name: athlete_id, type: string, source: input, description: "Prospective athlete contacted." }
      - { name: contact_type, type: enum, source: input, description: "Contact modality.", constraints: "PHONE_CALL | IN_PERSON_OFF_CAMPUS | IN_PERSON_ON_CAMPUS | TEXT_MESSAGE | EVALUATION" }
      - { name: contact_at, type: datetime, source: input, description: "Wall-clock timestamp of contact (UTC)." }
      - { name: contact_period_type, type: enum, source: computed, description: "Resolved RecruitingCalendar.period_type covering contact_at; DEAD if no window contains contact_at.", constraints: "QUIET | CONTACT | DEAD | EVALUATION" }
      - { name: was_permitted, type: boolean, source: computed, description: "Whether this contact is permitted under the resolved period_type and contact_type matrix (see calculation recruiting_contact_permitted)." }

  - name: NILDeal
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK to Athlete receiving payment." }
      - { name: sponsor_name, type: string, source: input, description: "Brand/entity paying the athlete." }
      - { name: sponsor_is_booster, type: boolean, source: input, description: "Whether the sponsor is a registered Booster of athlete's current_program." }
      - { name: deal_category, type: enum, source: input, description: "Activity classification.", constraints: "ENDORSEMENT | APPEARANCE | SOCIAL_MEDIA_POST | AUTOGRAPH_SIGNING | CAMP_INSTRUCTION" }
      - { name: stated_value_cents, type: integer, source: input, description: "Stated contract value in USD cents." }
      - { name: deliverables_hours, type: number, source: input, description: "Hours of athlete time required (used in FMV calc)." }
      - { name: market_rate_cents_per_hour, type: integer, source: input, description: "Independent market rate for comparable services at the athlete's market tier." }
      - { name: fmv_calculated_cents, type: integer, source: computed, description: "Fair-market valuation per calculation nil_deal_fair_market_value." }
      - { name: pay_for_play_flag, type: boolean, source: computed, description: "True if calculation nil_deal_pay_for_play classifies the deal as compensation contingent on athletic performance/enrollment." }
      - { name: approved_value_cents, type: integer, source: system, description: "Pinned at the time of APPROVED transition: equals min(stated_value_cents, fmv_calculated_cents). Null until approved." }
      - { name: status, type: enum, source: system, description: "Lifecycle. SUBMITTED -> UNDER_REVIEW -> APPROVED | REJECTED; APPROVED -> SUSPENDED -> APPROVED (cycle); APPROVED -> REVOKED (terminal).", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SUSPENDED | REVOKED" }
      - { name: review_started_at, type: datetime, source: system, description: "Set when status moves to UNDER_REVIEW; null before." }

  - name: TransferPortalEntry
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK to Athlete entering portal." }
      - { name: origin_program_id, type: string, source: input, description: "Program the athlete is leaving (athlete.current_program_id at time of entry)." }
      - { name: destination_program_id, type: string, source: system, description: "Program the athlete commits to from the portal (set on COMMITTED transition); null otherwise." }
      - { name: entered_at, type: datetime, source: system, description: "Set when status moves to ENTERED." }
      - { name: window_closes_at, type: datetime, source: system, description: "= entered_at + transfer_window_days (see calculation transfer_window_close)." }
      - { name: reason, type: enum, source: input, description: "Athlete-supplied reason category.", constraints: "PLAYING_TIME | COACHING_CHANGE | FAMILY | ACADEMIC | OTHER" }
      - { name: status, type: enum, source: system, description: "Lifecycle. ENTERED -> CONTACT_WINDOW -> COMMITTED | WITHDRAWN | EXPIRED.", constraints: "ENTERED | CONTACT_WINDOW | COMMITTED | WITHDRAWN | EXPIRED" }
      - { name: immediate_eligibility, type: boolean, source: computed, description: "Per calculation transfer_immediate_eligibility; resolved at COMMITTED transition only." }

  - name: ComplianceViolation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "Program implicated." }
      - { name: subject_type, type: enum, source: input, description: "Who committed the violation.", constraints: "BOOSTER | COACH | ATHLETE | PROGRAM_ADMIN" }
      - { name: subject_ref, type: string, source: input, description: "Free-text identifier of the subject (booster name, coach handle, athlete_id, etc.)." }
      - { name: violation_type, type: enum, source: input, description: "Bylaw category.", constraints: "IMPERMISSIBLE_BENEFIT | RECRUITING_CONTACT | NIL_COLLECTIVE_PAYFORPLAY | ACADEMIC_FRAUD | OTHER" }
      - { name: severity, type: enum, source: input, description: "Severity classification per NCAA Level scheme.", constraints: "LEVEL_I | LEVEL_II | LEVEL_III | LEVEL_IV" }
      - { name: related_athlete_id, type: string, source: input, description: "Optional FK to an Athlete impacted by the violation; null when none." }
      - { name: related_deal_id, type: string, source: input, description: "Optional FK to NILDeal that triggered the violation; null when none." }
      - { name: status, type: enum, source: system, description: "REPORTED -> INVESTIGATING -> SUBSTANTIATED | DISMISSED; SUBSTANTIATED -> APPEALED -> SUSTAINED | OVERTURNED. APPEALED is reachable only from SUBSTANTIATED.", constraints: "REPORTED | INVESTIGATING | SUBSTANTIATED | DISMISSED | APPEALED | SUSTAINED | OVERTURNED" }
      - { name: outcome, type: enum, source: computed, description: "Final outcome derived from status: SUSTAINED -> SUSTAINED; OVERTURNED or DISMISSED -> CLEARED; otherwise PENDING.", constraints: "PENDING | SUSTAINED | CLEARED" }
      - { name: penalty_points, type: integer, source: computed, description: "Per calculation violation_penalty_score; 0 while outcome != SUSTAINED." }
      - { name: reviewer_user_id, type: string, source: system, description: "ComplianceOfficer X-User-ID who moved REPORTED -> INVESTIGATING; segregation-of-duties anchor." }

# =============================================================================
# §1.2  State Machine Table
# =============================================================================
state_machines:
  # --- Athlete -----------------------------------------------------------
  - entity: Athlete
    initial_state: PROSPECTIVE
    terminal_states: []  # ENROLLED is not terminal: TRANSFER_PORTAL cycle, INELIGIBLE can be cleared
    transitions:
      - from: PROSPECTIVE
        to: COMMITTED
        trigger: "POST /athletes/{athleteId}/state with to_status=COMMITTED and program_id"
        actor: ComplianceOfficer
        preconditions:
          - "Athlete.eligibility_record_id is set and EligibilityRecord.decision IN {QUALIFIER, PARTIAL_QUALIFIER} (ERR_ELIGIBILITY_NOT_CLEARED)"
          - "Athlete has at least one ScholarshipSlot with status SIGNED for the same program_id (ERR_NO_SIGNED_SLOT)"
        side_effects:
          - "Athlete.current_program_id := program_id from request"
      - from: COMMITTED
        to: ENROLLED
        trigger: "POST /athletes/{athleteId}/state with to_status=ENROLLED"
        actor: ComplianceOfficer
        preconditions:
          - "Athlete.current_program_id is set"
          - "A ScholarshipSlot exists with program_id == current_program_id, athlete_id == this.id, status == SIGNED"
        side_effects:
          - "All ScholarshipSlot rows for this athlete with status==SIGNED for current_program_id transition to ACTIVE (cascade); activated_at := request timestamp"
          - "Athlete.years_of_eligibility_remaining is initialized to 4 if previously null (or remains its current value)"
          - "Program.active_roster_count and Program.total_equivalencies_used are recomputed via scholarship_slot_usage"
      - from: ENROLLED
        to: TRANSFER_PORTAL
        trigger: "POST /transfer-portal-entries (creates a TransferPortalEntry)"
        actor: ComplianceOfficer
        preconditions:
          - "Athlete.status == ENROLLED"
          - "No NILDeal for this athlete with status UNDER_REVIEW (ERR_PENDING_NIL_REVIEW)"
        side_effects:
          - "ScholarshipSlot for current_program_id (status ACTIVE) transitions to RELEASED (cascade) — releases program equivalencies"
          - "Athlete.current_program_id := null"
          - "Recompute origin program's total_equivalencies_used and active_roster_count"
      - from: TRANSFER_PORTAL
        to: COMMITTED
        trigger: "POST /transfer-portal-entries/{entryId}/state with to_status=COMMITTED"
        actor: ComplianceOfficer
        preconditions:
          - "TransferPortalEntry.status == CONTACT_WINDOW"
          - "destination_program_id supplied and at least one SIGNED ScholarshipSlot exists for that program & athlete"
          - "Recipient program's projected total_equivalencies_used + slot.fractional_equivalency <= scholarship_cap_equivalencies (ERR_SCHOLARSHIP_CAP_EXCEEDED)"
        side_effects:
          - "Athlete.current_program_id := destination_program_id"
          - "TransferPortalEntry.immediate_eligibility computed per transfer_immediate_eligibility"
      - from: ENROLLED
        to: INELIGIBLE
        trigger: "Automatic on ComplianceViolation transitioning to SUSTAINED with severity LEVEL_I and related_athlete_id set; OR on EligibilityRecord re-decision to NON_QUALIFIER posted via PATCH (forbidden — EligibilityRecord immutable, so only the violation pathway)"
        actor: system
        preconditions:
          - "ComplianceViolation.outcome flipped to SUSTAINED AND severity == LEVEL_I AND related_athlete_id == athlete.id"
        side_effects:
          - "Athlete.amateur_status := AT_RISK (if severity LEVEL_II) or FORFEITED (if severity LEVEL_I)"
          - "All NILDeal for this athlete with status APPROVED transition to SUSPENDED (cascade)"
      - from: INELIGIBLE
        to: ENROLLED
        trigger: "Automatic when the ComplianceViolation that caused the Athlete's flip to INELIGIBLE transitions to OVERTURNED (i.e., outcome flips SUSTAINED -> CLEARED)"
        actor: system
        preconditions:
          - "The originating ComplianceViolation.outcome == CLEARED"
        side_effects:
          - "Athlete.amateur_status := AMATEUR"
          - "All NILDeal rows for this athlete whose status was changed APPROVED->SUSPENDED as part of the original INELIGIBLE cascade transition back to APPROVED (cascade restores the athlete's full prior approved set; approved_value_cents on each deal is unchanged since it was pinned at original approval time)"

  # --- NILDeal -----------------------------------------------------------
  - entity: NILDeal
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /nil-deals/{dealId}/state with to_status=UNDER_REVIEW"
        actor: ComplianceOfficer
        preconditions:
          - "Acting ComplianceOfficer is not the same X-User-ID who submitted the deal (segregation_of_duties)"
        side_effects:
          - "review_started_at := request timestamp"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /nil-deals/{dealId}/state with to_status=APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "pay_for_play_flag == false (ERR_PAY_FOR_PLAY_DETECTED)"
          - "Athlete.status IN {COMMITTED, ENROLLED} (ERR_ATHLETE_NOT_ENROLLED)"
          - "Athlete.amateur_status == AMATEUR (ERR_AMATEUR_STATUS_LOST)"
        side_effects:
          - "approved_value_cents := min(stated_value_cents, fmv_calculated_cents)"
          - "Recompute Athlete.nil_deal_lifetime_value_cents via aggregation"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /nil-deals/{dealId}/state with to_status=REJECTED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "Automatic when related Athlete transitions ENROLLED -> INELIGIBLE; OR POST /nil-deals/{dealId}/state with to_status=SUSPENDED by ComplianceOfficer"
        actor: system | ComplianceOfficer
        preconditions: []
        side_effects:
          - "approved_value_cents is NOT cleared; remains pinned for audit"
          - "Athlete.nil_deal_lifetime_value_cents recomputed (excludes SUSPENDED)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "Automatic when related Athlete returns to ENROLLED with amateur_status AMATEUR; OR POST /nil-deals/{dealId}/state with to_status=APPROVED by ComplianceOfficer"
        actor: system | ComplianceOfficer
        preconditions:
          - "Athlete.amateur_status == AMATEUR"
          - "Athlete.status IN {COMMITTED, ENROLLED}"
        side_effects:
          - "Athlete.nil_deal_lifetime_value_cents recomputed (re-includes this deal)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /nil-deals/{dealId}/state with to_status=REVOKED"
        actor: ComplianceOfficer
        preconditions:
          - "A linked ComplianceViolation with violation_type == NIL_COLLECTIVE_PAYFORPLAY has outcome SUSTAINED"
        side_effects:
          - "Athlete.nil_deal_lifetime_value_cents recomputed (excludes REVOKED)"
          - "approved_value_cents counted toward the related Booster/Program impermissible-benefit total at the time of revocation"

  # --- ScholarshipSlot ---------------------------------------------------
  - entity: ScholarshipSlot
    initial_state: OFFERED
    terminal_states: [WITHDRAWN, RELEASED, REVOKED]
    transitions:
      - from: OFFERED
        to: SIGNED
        trigger: "POST /scholarship-slots/{slotId}/state with to_status=SIGNED"
        actor: Coach
        preconditions:
          - "Athlete.eligibility_record_id set and EligibilityRecord.decision IN {QUALIFIER, PARTIAL_QUALIFIER} (ERR_ELIGIBILITY_NOT_CLEARED)"
          - "Program.total_equivalencies_used + slot.fractional_equivalency <= Program.scholarship_cap_equivalencies (ERR_SCHOLARSHIP_CAP_EXCEEDED)"
        side_effects:
          - "signed_at := request timestamp"
          - "Program.total_equivalencies_used recomputed"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /scholarship-slots/{slotId}/state with to_status=WITHDRAWN"
        actor: Coach
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: ACTIVE
        trigger: "Automatic on Athlete COMMITTED -> ENROLLED cascade (see Athlete state machine)"
        actor: system
        preconditions: []
        side_effects:
          - "activated_at := request timestamp"
          - "Program.active_roster_count + 1 <= Program.roster_cap_count (ERR_ROSTER_CAP_EXCEEDED, blocks the enclosing Athlete ENROLLED transition)"
      - from: ACTIVE
        to: RELEASED
        trigger: "Automatic on Athlete ENROLLED -> TRANSFER_PORTAL (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Program.total_equivalencies_used and active_roster_count recomputed"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /scholarship-slots/{slotId}/state with to_status=REVOKED"
        actor: ComplianceOfficer
        preconditions:
          - "A ComplianceViolation with related_athlete_id == this.athlete_id and outcome == SUSTAINED exists, severity IN {LEVEL_I, LEVEL_II} (ERR_NO_SUSTAINED_VIOLATION)"
        side_effects:
          - "Program.total_equivalencies_used and active_roster_count recomputed"

  # --- TransferPortalEntry -----------------------------------------------
  - entity: TransferPortalEntry
    initial_state: ENTERED
    terminal_states: [COMMITTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: ENTERED
        to: CONTACT_WINDOW
        trigger: "Automatic at clock T >= entered_at + 24 hours (NCAA notification holding period); driven by POST /_clock/advance"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTACT_WINDOW
        to: COMMITTED
        trigger: "POST /transfer-portal-entries/{entryId}/state with to_status=COMMITTED and destination_program_id"
        actor: ComplianceOfficer
        preconditions:
          - "current clock < window_closes_at (ERR_PORTAL_WINDOW_CLOSED)"
          - "destination_program_id exists"
          - "Recipient program has at least one ScholarshipSlot with athlete_id == this.athlete_id and program_id == destination_program_id and status == SIGNED"
          - "Recipient program's projected total_equivalencies_used <= scholarship_cap_equivalencies (ERR_SCHOLARSHIP_CAP_EXCEEDED)"
        side_effects:
          - "Trigger Athlete TRANSFER_PORTAL -> COMMITTED transition"
          - "Compute immediate_eligibility per calculation transfer_immediate_eligibility"
      - from: CONTACT_WINDOW
        to: WITHDRAWN
        trigger: "POST /transfer-portal-entries/{entryId}/state with to_status=WITHDRAWN"
        actor: Athlete | ComplianceOfficer
        preconditions:
          - "current clock < window_closes_at"
        side_effects:
          - "Athlete.status reverts TRANSFER_PORTAL -> COMMITTED with current_program_id := origin_program_id"
          - "If origin program has not back-filled the released slot (its prior ScholarshipSlot is now RELEASED), Compliance must manually create a new ScholarshipSlot to re-seat — NOT auto-resurrected"
      - from: CONTACT_WINDOW
        to: EXPIRED
        trigger: "Automatic at clock T >= window_closes_at; driven by POST /_clock/advance"
        actor: system
        preconditions: []
        side_effects:
          - "Athlete.status remains TRANSFER_PORTAL but is effectively a free agent for the following year; no cascade to current_program_id"
      - from: ENTERED
        to: WITHDRAWN
        trigger: "POST /transfer-portal-entries/{entryId}/state with to_status=WITHDRAWN before contact window opens"
        actor: Athlete | ComplianceOfficer
        preconditions: []
        side_effects:
          - "Athlete.status reverts TRANSFER_PORTAL -> ENROLLED with current_program_id := origin_program_id"
          - "If origin program's prior slot is RELEASED, Compliance must manually re-create the slot (NOT auto-resurrected)"

  # --- ComplianceViolation -----------------------------------------------
  - entity: ComplianceViolation
    initial_state: REPORTED
    terminal_states: [DISMISSED, SUSTAINED, OVERTURNED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /violations/{violationId}/state with to_status=INVESTIGATING"
        actor: ComplianceOfficer
        preconditions:
          - "Acting ComplianceOfficer is not affiliated with the same program (segregation_of_duties enforced via header check — ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewer_user_id := X-User-ID of caller"
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /violations/{violationId}/state with to_status=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "Caller's X-User-ID == reviewer_user_id (continuity of investigation)"
        side_effects: []
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /violations/{violationId}/state with to_status=DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "Caller's X-User-ID == reviewer_user_id"
        side_effects:
          - "outcome := CLEARED"
      - from: SUBSTANTIATED
        to: APPEALED
        trigger: "POST /violations/{violationId}/state with to_status=APPEALED"
        actor: Coach | ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: SUSTAINED
        trigger: "POST /violations/{violationId}/state with to_status=SUSTAINED"
        actor: ComplianceOfficer
        preconditions:
          - "Caller's X-User-ID != reviewer_user_id (appeal requires a DIFFERENT compliance officer — segregation_of_duties)"
        side_effects:
          - "outcome := SUSTAINED"
          - "Recompute penalty_points via violation_penalty_score"
          - "Program.penalty_points_total recomputed"
          - "If severity == LEVEL_I AND related_athlete_id is set: cascade Athlete ENROLLED -> INELIGIBLE (which itself cascades APPROVED NILDeal -> SUSPENDED)"
          - "If violation_type == NIL_COLLECTIVE_PAYFORPLAY AND related_deal_id set: linked NILDeal becomes eligible for APPROVED -> REVOKED"
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /violations/{violationId}/state with to_status=OVERTURNED"
        actor: ComplianceOfficer
        preconditions:
          - "Caller's X-User-ID != reviewer_user_id"
        side_effects:
          - "outcome := CLEARED"
          - "If the violation previously caused an Athlete to flip to INELIGIBLE, cascade Athlete INELIGIBLE -> ENROLLED (which restores SUSPENDED NILDeal -> APPROVED)"
      - from: SUBSTANTIATED
        to: SUSTAINED
        trigger: "Automatic when appeal window of 14 days expires without an APPEALED transition; driven by POST /_clock/advance"
        actor: system
        preconditions:
          - "clock - (timestamp of SUBSTANTIATED transition) >= 14 days"
        side_effects:
          - "Same cascades as APPEALED -> SUSTAINED"

# =============================================================================
# §1.2.1  Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ComplianceOfficers attempt to start investigating the same ComplianceViolation simultaneously"
    guarantee: "Exactly one officer becomes reviewer_user_id; the loser sees ERR_INVALID_STATE because the violation is no longer in REPORTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ComplianceViolation.status; reviewer_user_id pinned on the winning transition"

  - scenario: "Coach signs a ScholarshipSlot while another concurrent SIGN would push the program over scholarship_cap_equivalencies"
    guarantee: "Cap is never breached; the slot whose serialization order would breach the cap is rejected"
    error_id: ERR_SCHOLARSHIP_CAP_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Program.total_equivalencies_used; subsequent slot evaluates cap with the prior slot's equivalency already counted"

  - scenario: "ComplianceOfficer approves an NIL deal while a concurrent ComplianceViolation transition flips the same athlete to INELIGIBLE"
    guarantee: "Either the NILDeal is approved before the athlete flips ineligible (and is then SUSPENDED by cascade), or the approval is rejected with ERR_AMATEUR_STATUS_LOST. Both states never coexist."
    error_id: ERR_AMATEUR_STATUS_LOST
    http_status: 409
    serialization: "Athlete.amateur_status and Athlete.status are read at the start of the APPROVE transition under a lock on Athlete row; NILDeal APPROVE blocks while a violation cascade is mid-flight on the same athlete"

  - scenario: "Two athletes attempt to commit out of the transfer portal to the same recipient program where only one remaining roster_cap_count slot exists"
    guarantee: "Roster cap is never breached; first-writer wins"
    error_id: ERR_ROSTER_CAP_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Program.active_roster_count; the second COMMITTED transition aborts before mutating Athlete.current_program_id"

  - scenario: "Athlete withdraws from TransferPortalEntry while system clock advance triggers EXPIRED simultaneously"
    guarantee: "Exactly one terminal transition wins; loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TransferPortalEntry.status"

# =============================================================================
# §1.3  Calculation Rules Table
# =============================================================================
calculations:
  - name: scholarship_slot_usage
    trigger: "On every ScholarshipSlot state transition (OFFERED -> SIGNED, SIGNED -> ACTIVE, ACTIVE -> RELEASED|REVOKED, OFFERED -> WITHDRAWN)"
    algorithm: aggregation
    formula: |
      Program.total_equivalencies_used =
        sum(ScholarshipSlot.fractional_equivalency
            for ScholarshipSlot s
            where s.program_id == this.program_id
              and s.status IN {SIGNED, ACTIVE})

      Program.active_roster_count =
        count(Athlete a
              where a.status == ENROLLED
                and a.current_program_id == this.program_id)

      Cap check on slot transition to SIGNED:
        if Program.total_equivalencies_used + s.fractional_equivalency
           > Program.scholarship_cap_equivalencies:
            reject ERR_SCHOLARSHIP_CAP_EXCEEDED
      Cap check on slot transition to ACTIVE (via Athlete ENROLLED cascade):
        if Program.active_roster_count + 1 > Program.roster_cap_count:
            reject ERR_ROSTER_CAP_EXCEEDED  (blocks enclosing Athlete transition)
    input_set: "All ScholarshipSlot rows for the given program_id with status IN {SIGNED, ACTIVE}. WITHDRAWN, RELEASED, REVOKED, OFFERED excluded."
    constants: {}
    precision: "2 decimal places for fractional_equivalency, round_half_up; integer counts for active_roster_count"

  - name: nil_deal_fair_market_value
    trigger: "On NILDeal POST creation, and on every PATCH to deliverables_hours or market_rate_cents_per_hour while status == SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      base = deliverables_hours * market_rate_cents_per_hour

      # Category multiplier (combinatorial: depends on deal_category AND booster flag)
      cat_mult =
        ENDORSEMENT         -> 1.20
        APPEARANCE          -> 1.10
        SOCIAL_MEDIA_POST   -> 1.00
        AUTOGRAPH_SIGNING   -> 0.90
        CAMP_INSTRUCTION    -> 1.05

      # Booster discount: deals where sponsor_is_booster=true are valued more conservatively
      booster_factor = sponsor_is_booster ? 0.80 : 1.00

      # Pinned evaluation order (no rounding inside; final round once at the end):
      raw = base * cat_mult * booster_factor

      fmv_calculated_cents = round_half_up(raw, 0)   # round to whole cents at the end
    input_set: "NILDeal fields: deliverables_hours, market_rate_cents_per_hour, deal_category, sponsor_is_booster"
    constants:
      CAT_MULT_ENDORSEMENT: 1.20
      CAT_MULT_APPEARANCE: 1.10
      CAT_MULT_SOCIAL_MEDIA_POST: 1.00
      CAT_MULT_AUTOGRAPH_SIGNING: 0.90
      CAT_MULT_CAMP_INSTRUCTION: 1.05
      BOOSTER_FACTOR: 0.80
    precision: "Integer cents, round_half_up only at the final step"
    variants:
      - name: stated_value_used
        when: "On APPROVED transition, the value pinned into approved_value_cents is min(stated_value_cents, fmv_calculated_cents)"
        difference: "Stated value is the contract's nominal payment; fmv is the independent valuation. When stated_value < fmv, the athlete's NIL lifetime total is based on stated; when stated_value > fmv, approval still pins to fmv (cap at fair market)."

  - name: nil_deal_pay_for_play
    trigger: "On NILDeal POST creation, and on every PATCH while status == SUBMITTED, and re-evaluated on Athlete current_program_id change"
    algorithm: threshold
    formula: |
      # Distinct from FMV: this is a classification, not a valuation.
      # The same NILDeal can have a high fmv (legitimate market value) AND still
      # be flagged pay_for_play if the structural test trips.

      stated_to_fmv_ratio = stated_value_cents / max(fmv_calculated_cents, 1)
      payforplay = false
      if sponsor_is_booster == true AND stated_to_fmv_ratio >= 3.0:
        payforplay = true   # boosters paying more than 3x fair value
      if sponsor_is_booster == true AND deal_category == CAMP_INSTRUCTION
         AND deliverables_hours <= 1.0
         AND stated_value_cents >= 1_000_000:   # $10,000 in cents
        payforplay = true   # token deliverables for large payment from booster
      if Athlete.current_program_id is null AND stated_value_cents >= 5_000_000:
        payforplay = true   # large payment to uncommitted prospect (inducement)
      pay_for_play_flag = payforplay
    input_set: "NILDeal fields plus Athlete.current_program_id at moment of evaluation"
    constants:
      RATIO_THRESHOLD: 3.0
      TOKEN_HOURS_CEILING: 1.0
      TOKEN_VALUE_FLOOR_CENTS: 1000000          # $10,000.00
      INDUCEMENT_VALUE_FLOOR_CENTS: 5000000     # $50,000.00
    precision: "Boolean; ratio comparison uses double precision floats, threshold treated as >="
    variants:
      - name: athlete_uncommitted_inducement
        when: "Athlete.current_program_id is null (PROSPECTIVE or in portal)"
        difference: "Lower value floor ($50,000) triggers pay_for_play regardless of category — large payments to uncommitted athletes are inducements"
      - name: athlete_committed_token_deliverable
        when: "Athlete.current_program_id is set AND sponsor_is_booster"
        difference: "Token deliverables (<=1h, CAMP_INSTRUCTION, >=$10,000) trip flag even when ratio test passes — structural test catches dressed-up payments"

  - name: violation_penalty_score
    trigger: "On ComplianceViolation transition APPEALED -> SUSTAINED, or SUBSTANTIATED -> SUSTAINED (auto-expire path)"
    algorithm: weighted_scoring
    formula: |
      severity_points =
        LEVEL_I   -> 10
        LEVEL_II  ->  5
        LEVEL_III ->  2
        LEVEL_IV  ->  1

      # Recidivism multiplier: count of prior SUSTAINED violations on same
      # program_id in the trailing 730 days BEFORE this violation's created_at.
      prior_count = count(
        ComplianceViolation v
        where v.program_id == this.program_id
          and v.outcome == SUSTAINED
          and v.id != this.id
          and v.created_at < this.created_at
          and v.created_at >= (this.created_at - 730 days)
      )
      recidivism_mult =
        prior_count == 0 -> 1.0
        prior_count == 1 -> 1.5
        prior_count >= 2 -> 2.0

      # Pinned evaluation order: round AFTER multiplication
      raw = severity_points * recidivism_mult
      penalty_points = round_half_up(raw, 0)

      # Threshold: trip Program.compliance_status RED at >= 20 cumulative trailing-730d points
      # Trip YELLOW at >= 10 and < 20; GREEN otherwise.
      # See program_compliance_posture for the program-level rollup.
    input_set: "This ComplianceViolation plus all prior SUSTAINED violations for same program in trailing 730 days"
    constants:
      SEVERITY_LEVEL_I: 10
      SEVERITY_LEVEL_II: 5
      SEVERITY_LEVEL_III: 2
      SEVERITY_LEVEL_IV: 1
      RECID_MULT_FIRST: 1.0
      RECID_MULT_SECOND: 1.5
      RECID_MULT_THIRD_PLUS: 2.0
      WINDOW_DAYS: 730
    precision: "Integer points, round_half_up after multiplication"

  - name: program_compliance_posture
    trigger: "On every ComplianceViolation outcome change to SUSTAINED or CLEARED"
    algorithm: threshold
    formula: |
      program.penalty_points_total =
        sum(v.penalty_points
            for v in ComplianceViolation
            where v.program_id == program.id
              and v.outcome == SUSTAINED
              and v.created_at >= now() - 730 days)

      program.compliance_status =
        if penalty_points_total >= 20: RED
        else if penalty_points_total >= 10: YELLOW
        else: GREEN
    input_set: "All ComplianceViolation rows for program in trailing 730 days with outcome SUSTAINED"
    constants:
      RED_THRESHOLD: 20
      YELLOW_THRESHOLD: 10
      WINDOW_DAYS: 730
    precision: "Integer points; thresholds use >=; boundary at exactly 20 is RED, exactly 10 is YELLOW"

  - name: recruiting_contact_permitted
    trigger: "On POST /recruiting-contacts creation"
    algorithm: interval_merge
    formula: |
      # Resolve which RecruitingCalendar window contains contact_at for the program
      candidates = [
        c for c in RecruitingCalendar
        where c.program_id == this.program_id
          and c.start_date <= this.contact_at   # inclusive
          and this.contact_at <  c.end_date     # exclusive (half-open intervals)
      ]
      if candidates is empty:
        contact_period_type = DEAD              # default if no window declared
      else if multiple candidates overlap:
        # Tie-break: priority QUIET < EVALUATION < CONTACT < DEAD (most restrictive wins)
        contact_period_type = max-priority window

      # Permission matrix (period_type x contact_type)
      permitted =
        contact_period_type == CONTACT:
          PHONE_CALL: true; IN_PERSON_OFF_CAMPUS: true; IN_PERSON_ON_CAMPUS: true; TEXT_MESSAGE: true; EVALUATION: true
        contact_period_type == QUIET:
          PHONE_CALL: true; IN_PERSON_OFF_CAMPUS: false; IN_PERSON_ON_CAMPUS: true; TEXT_MESSAGE: true; EVALUATION: false
        contact_period_type == DEAD:
          all contact_types: false
        contact_period_type == EVALUATION:
          PHONE_CALL: true; IN_PERSON_OFF_CAMPUS: false; IN_PERSON_ON_CAMPUS: false; TEXT_MESSAGE: true; EVALUATION: true

      was_permitted = permitted[contact_type]
      if not was_permitted:
        reject ERR_CONTACT_NOT_PERMITTED
    input_set: "RecruitingCalendar rows for the program; the new RecruitingContact's contact_at and contact_type"
    constants: {}
    precision: "Boolean outcome; intervals are half-open [start_date, end_date)"
    variants:
      - name: most_restrictive_overlap
        when: "Two RecruitingCalendar windows overlap and both contain contact_at"
        difference: "DEAD > CONTACT > EVALUATION > QUIET — pick the most restrictive."

  - name: transfer_window_close
    trigger: "On POST /transfer-portal-entries creation (computing window_closes_at)"
    algorithm: threshold
    formula: |
      transfer_window_days =
        Athlete.amateur_status == AMATEUR -> 45
        Athlete.amateur_status == AT_RISK -> 30
        Athlete.amateur_status == FORFEITED -> 0   # cannot enter portal (ERR_PORTAL_INELIGIBLE)
      window_closes_at = entered_at + transfer_window_days * 24 hours
    input_set: "Athlete.amateur_status at the moment of portal entry"
    constants:
      WINDOW_DAYS_AMATEUR: 45
      WINDOW_DAYS_AT_RISK: 30
    precision: "Datetime to the second"

  - name: transfer_immediate_eligibility
    trigger: "On TransferPortalEntry CONTACT_WINDOW -> COMMITTED transition"
    algorithm: threshold
    formula: |
      # Prior transfer count: how many SUCCESSFUL TransferPortalEntry rows
      # for this athlete with status == COMMITTED before this one.
      prior_transfers = count(
        TransferPortalEntry e
        where e.athlete_id == this.athlete_id
          and e.status == COMMITTED
          and e.id != this.id
          and e.created_at < this.created_at
      )

      # Years already attended: 4 - Athlete.years_of_eligibility_remaining
      years_attended = 4 - Athlete.years_of_eligibility_remaining

      immediate_eligibility =
        prior_transfers == 0 AND years_attended >= 0:
          true
        prior_transfers == 1 AND years_attended >= 3:
          true     # one-time transfer + graduate transfer
        otherwise:
          false
    input_set: "All prior TransferPortalEntry for athlete; Athlete.years_of_eligibility_remaining"
    constants:
      GRAD_TRANSFER_YEARS: 3
    precision: "Boolean"

# =============================================================================
# §1.4  Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty on all endpoints except GET /_clock and POST /_clock/advance"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except clock-control endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of {ComplianceOfficer, Coach, Athlete, Booster, Auditor}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role permitted for endpoint per RBAC matrix (§1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Referenced path resources exist (Program, Athlete, ScholarshipSlot, NILDeal, etc.) — validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Foreign-key references in request body resolve (athlete_id, program_id, related_athlete_id, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK fields"

  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /{resource}/{id}/state endpoints"

  - priority: 7
    category: state
    check: "Optimistic concurrency: request 'version' (when provided) must equal stored version on PATCH and /state endpoints"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "PATCH and /state endpoints"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: actor X-User-ID is permitted for this specific transition (e.g., NILDeal review cannot be approved by submitter; ComplianceViolation appeal SUSTAINED cannot be the original reviewer)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "NILDeal SUBMITTED->UNDER_REVIEW, NILDeal UNDER_REVIEW->APPROVED, ComplianceViolation APPEALED->SUSTAINED/OVERTURNED"

  - priority: 9
    category: business_safety
    check: "Eligibility cleared: Athlete.eligibility_record_id is set and EligibilityRecord.decision IN {QUALIFIER, PARTIAL_QUALIFIER} for transitions that require eligibility"
    error_id: ERR_ELIGIBILITY_NOT_CLEARED
    http_status: 409
    applies_to: "ScholarshipSlot OFFERED->SIGNED, Athlete PROSPECTIVE->COMMITTED"

  - priority: 10
    category: business_safety
    check: "Amateur status: NILDeal cannot be APPROVED when Athlete.amateur_status != AMATEUR"
    error_id: ERR_AMATEUR_STATUS_LOST
    http_status: 409
    applies_to: "NILDeal UNDER_REVIEW->APPROVED, NILDeal SUSPENDED->APPROVED"

  - priority: 11
    category: business_safety
    check: "Pay-for-play classifier: NILDeal cannot be APPROVED when pay_for_play_flag == true"
    error_id: ERR_PAY_FOR_PLAY_DETECTED
    http_status: 409
    applies_to: "NILDeal UNDER_REVIEW->APPROVED"

  - priority: 12
    category: business_safety
    check: "Recruiting contact permitted: was_permitted must be true given calendar resolution"
    error_id: ERR_CONTACT_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /recruiting-contacts"

  - priority: 13
    category: business_referential
    check: "ScholarshipSlot SIGNED requires that Athlete is not in TRANSFER_PORTAL or INELIGIBLE state"
    error_id: ERR_ATHLETE_NOT_AVAILABLE
    http_status: 409
    applies_to: "ScholarshipSlot OFFERED->SIGNED"

  - priority: 14
    category: business_temporal
    check: "Transfer portal window: COMMITTED/WITHDRAWN transitions blocked when current clock >= window_closes_at"
    error_id: ERR_PORTAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "TransferPortalEntry CONTACT_WINDOW->COMMITTED, CONTACT_WINDOW->WITHDRAWN"

  - priority: 15
    category: business_temporal
    check: "Appeal window: ComplianceViolation SUBSTANTIATED->APPEALED requires (current clock - SUBSTANTIATED transition timestamp) < 14 days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "ComplianceViolation SUBSTANTIATED->APPEALED"

  - priority: 16
    category: business_fiscal
    check: "Scholarship cap not exceeded: Program.total_equivalencies_used + slot.fractional_equivalency <= scholarship_cap_equivalencies"
    error_id: ERR_SCHOLARSHIP_CAP_EXCEEDED
    http_status: 409
    applies_to: "ScholarshipSlot OFFERED->SIGNED, Athlete TRANSFER_PORTAL->COMMITTED (recipient cap check)"

  - priority: 17
    category: business_fiscal
    check: "Roster cap not exceeded: Program.active_roster_count + 1 <= roster_cap_count on enrollment"
    error_id: ERR_ROSTER_CAP_EXCEEDED
    http_status: 409
    applies_to: "Athlete COMMITTED->ENROLLED, TRANSFER_PORTAL->COMMITTED"

  - priority: 18
    category: business_constraint
    check: "fractional_equivalency in [0.01, 1.00], two decimal places; deliverables_hours > 0; stated_value_cents > 0; market_rate_cents_per_hour > 0; core_gpa in [0.00, 4.00]"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "POST/PATCH on ScholarshipSlot, NILDeal, EligibilityRecord"

  - priority: 19
    category: business_constraint
    check: "RecruitingCalendar window: start_date < end_date; no two windows for the same program may overlap in time except where most_restrictive_overlap variant is intended; end_date - start_date >= 1 day"
    error_id: ERR_CALENDAR_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /recruiting-calendars"

  - priority: 20
    category: business_constraint
    check: "Idempotent uniqueness: at most one TransferPortalEntry per athlete with status IN {ENTERED, CONTACT_WINDOW}"
    error_id: ERR_DUPLICATE_PORTAL_ENTRY
    http_status: 409
    applies_to: "POST /transfer-portal-entries"

  - priority: 21
    category: business_constraint
    check: "At most one EligibilityRecord per Athlete (immutable; second POST rejected)"
    error_id: ERR_ELIGIBILITY_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /eligibility-records"

# =============================================================================
# §1.5  API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs (configuration root) ---
  - method: POST
    path: "/programs"
    description: "Create a Program (institution + sport)"
    roles: [ComplianceOfficer]
    code: 201
    input: ["institution_name", "sport", "division", "scholarship_cap_equivalencies", "roster_cap_count"]
    output: Program
    side_effects: ["total_equivalencies_used=0, active_roster_count=0, penalty_points_total=0, compliance_status=GREEN"]
  - method: GET
    path: "/programs/{programId}"
    description: "Get Program (with derived totals)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: [""]
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List Programs (paginated; filter by sport, division, compliance_status)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "sport?", "division?", "compliance_status?"]
    output: "Program[]"
    side_effects: []

  # --- Recruiting Calendar ---
  - method: POST
    path: "/recruiting-calendars"
    description: "Declare a calendar window for a program"
    roles: [ComplianceOfficer]
    code: 201
    input: ["program_id", "period_type", "start_date", "end_date", "note?"]
    output: RecruitingCalendar
    side_effects: []
  - method: GET
    path: "/recruiting-calendars/{calendarId}"
    description: "Get one calendar window"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: [""]
    output: RecruitingCalendar
    side_effects: []
  - method: GET
    path: "/recruiting-calendars"
    description: "List calendar windows (filter by program_id, period_type, contains_date)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "program_id?", "period_type?", "contains_date?"]
    output: "RecruitingCalendar[]"
    side_effects: []

  # --- Athletes ---
  - method: POST
    path: "/athletes"
    description: "Register a prospective athlete"
    roles: [ComplianceOfficer, Coach]
    code: 201
    input: ["full_name", "high_school", "graduation_year"]
    output: Athlete
    side_effects: ["status=PROSPECTIVE, amateur_status=AMATEUR, years_of_eligibility_remaining=4, current_program_id=null"]
  - method: GET
    path: "/athletes/{athleteId}"
    description: "Get an athlete"
    roles: [ComplianceOfficer, Coach, Athlete, Auditor]
    code: 200
    input: [""]
    output: Athlete
    side_effects: []
  - method: GET
    path: "/athletes"
    description: "List athletes (filter by status, current_program_id, amateur_status)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "current_program_id?", "amateur_status?"]
    output: "Athlete[]"
    side_effects: []
  - method: POST
    path: "/athletes/{athleteId}/state"
    description: "Transition athlete (PROSPECTIVE->COMMITTED, COMMITTED->ENROLLED, etc.)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["to_status", "program_id?", "version?"]
    output: Athlete
    side_effects: ["State transition per Athlete state machine, including ScholarshipSlot and NILDeal cascades"]

  # --- Eligibility Records ---
  - method: POST
    path: "/eligibility-records"
    description: "Post an Eligibility Center decision (immutable)"
    roles: [ComplianceOfficer]
    code: 201
    input: ["athlete_id", "core_gpa", "standardized_test_score", "core_courses_completed", "decision", "decided_at"]
    output: EligibilityRecord
    side_effects: ["Athlete.eligibility_record_id := this.id"]
  - method: GET
    path: "/eligibility-records/{recordId}"
    description: "Get an eligibility record"
    roles: [ComplianceOfficer, Auditor]
    code: 200
    input: [""]
    output: EligibilityRecord
    side_effects: []

  # --- Scholarship Slots ---
  - method: POST
    path: "/scholarship-slots"
    description: "Offer a scholarship slot"
    roles: [Coach]
    code: 201
    input: ["program_id", "athlete_id", "fractional_equivalency", "annual_value_cents"]
    output: ScholarshipSlot
    side_effects: ["status=OFFERED"]
  - method: GET
    path: "/scholarship-slots/{slotId}"
    description: "Get a scholarship slot"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: [""]
    output: ScholarshipSlot
    side_effects: []
  - method: GET
    path: "/scholarship-slots"
    description: "List scholarship slots (filter by program_id, athlete_id, status)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "program_id?", "athlete_id?", "status?"]
    output: "ScholarshipSlot[]"
    side_effects: []
  - method: POST
    path: "/scholarship-slots/{slotId}/state"
    description: "Transition a scholarship slot (OFFERED->SIGNED|WITHDRAWN, ACTIVE->REVOKED)"
    roles: [Coach, ComplianceOfficer]
    code: 200
    input: ["to_status", "version?"]
    output: ScholarshipSlot
    side_effects: ["Cap recompute via scholarship_slot_usage; ACTIVE transition occurs via Athlete cascade only (not direct)"]

  # --- Recruiting Contacts ---
  - method: POST
    path: "/recruiting-contacts"
    description: "Log a recruiting contact event (auto-validates against calendar)"
    roles: [Coach]
    code: 201
    input: ["program_id", "athlete_id", "contact_type", "contact_at"]
    output: RecruitingContact
    side_effects: ["Resolve contact_period_type via recruiting_contact_permitted; was_permitted is enforced — impermissible contacts are rejected"]
  - method: GET
    path: "/recruiting-contacts/{contactId}"
    description: "Get a recruiting contact"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: [""]
    output: RecruitingContact
    side_effects: []
  - method: GET
    path: "/recruiting-contacts"
    description: "List recruiting contacts (filter by program_id, athlete_id, contact_period_type)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "program_id?", "athlete_id?", "contact_period_type?", "after?", "before?"]
    output: "RecruitingContact[]"
    side_effects: []

  # --- NIL Deals ---
  - method: POST
    path: "/nil-deals"
    description: "Submit an NIL deal for review"
    roles: [Athlete, Booster, ComplianceOfficer]
    code: 201
    input: ["athlete_id", "sponsor_name", "sponsor_is_booster", "deal_category", "stated_value_cents", "deliverables_hours", "market_rate_cents_per_hour"]
    output: NILDeal
    side_effects: ["status=SUBMITTED; fmv_calculated_cents computed; pay_for_play_flag computed"]
  - method: GET
    path: "/nil-deals/{dealId}"
    description: "Get an NIL deal"
    roles: [ComplianceOfficer, Coach, Athlete, Auditor]
    code: 200
    input: [""]
    output: NILDeal
    side_effects: []
  - method: GET
    path: "/nil-deals"
    description: "List NIL deals (filter by athlete_id, status, pay_for_play_flag)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "athlete_id?", "status?", "pay_for_play_flag?"]
    output: "NILDeal[]"
    side_effects: []
  - method: PATCH
    path: "/nil-deals/{dealId}"
    description: "Edit deliverables_hours, market_rate_cents_per_hour, stated_value_cents (only while SUBMITTED)"
    roles: [Athlete, Booster, ComplianceOfficer]
    code: 200
    input: ["deliverables_hours?", "market_rate_cents_per_hour?", "stated_value_cents?", "version?"]
    output: NILDeal
    side_effects: ["fmv_calculated_cents recomputed; pay_for_play_flag recomputed"]
  - method: POST
    path: "/nil-deals/{dealId}/state"
    description: "Transition an NIL deal (SUBMITTED->UNDER_REVIEW, UNDER_REVIEW->APPROVED|REJECTED, APPROVED->SUSPENDED|REVOKED, SUSPENDED->APPROVED)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["to_status", "version?"]
    output: NILDeal
    side_effects: ["approved_value_cents pinned on APPROVED; Athlete.nil_deal_lifetime_value_cents recomputed"]

  # --- Transfer Portal ---
  - method: POST
    path: "/transfer-portal-entries"
    description: "Athlete enters the transfer portal (creates entry, triggers ScholarshipSlot release cascade)"
    roles: [Athlete, ComplianceOfficer]
    code: 201
    input: ["athlete_id", "reason"]
    output: TransferPortalEntry
    side_effects: ["status=ENTERED; entered_at, window_closes_at computed; Athlete.status -> TRANSFER_PORTAL"]
  - method: GET
    path: "/transfer-portal-entries/{entryId}"
    description: "Get a portal entry"
    roles: [ComplianceOfficer, Coach, Athlete, Auditor]
    code: 200
    input: [""]
    output: TransferPortalEntry
    side_effects: []
  - method: GET
    path: "/transfer-portal-entries"
    description: "List portal entries (filter by status, athlete_id, origin_program_id)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "athlete_id?", "origin_program_id?"]
    output: "TransferPortalEntry[]"
    side_effects: []
  - method: POST
    path: "/transfer-portal-entries/{entryId}/state"
    description: "Transition portal entry (CONTACT_WINDOW->COMMITTED|WITHDRAWN, ENTERED->WITHDRAWN)"
    roles: [ComplianceOfficer, Athlete]
    code: 200
    input: ["to_status", "destination_program_id?", "version?"]
    output: TransferPortalEntry
    side_effects: ["Cascades to Athlete state machine; immediate_eligibility computed on COMMITTED"]

  # --- Compliance Violations ---
  - method: POST
    path: "/violations"
    description: "Report a violation"
    roles: [ComplianceOfficer, Auditor]
    code: 201
    input: ["program_id", "subject_type", "subject_ref", "violation_type", "severity", "related_athlete_id?", "related_deal_id?"]
    output: ComplianceViolation
    side_effects: ["status=REPORTED, outcome=PENDING, penalty_points=0"]
  - method: GET
    path: "/violations/{violationId}"
    description: "Get a violation"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: [""]
    output: ComplianceViolation
    side_effects: []
  - method: GET
    path: "/violations"
    description: "List violations (filter by program_id, status, outcome, severity)"
    roles: [ComplianceOfficer, Coach, Auditor]
    code: 200
    input: ["limit?", "offset?", "program_id?", "status?", "outcome?", "severity?"]
    output: "ComplianceViolation[]"
    side_effects: []
  - method: POST
    path: "/violations/{violationId}/state"
    description: "Transition a violation (REPORTED->INVESTIGATING, INVESTIGATING->SUBSTANTIATED|DISMISSED, SUBSTANTIATED->APPEALED, APPEALED->SUSTAINED|OVERTURNED)"
    roles: [ComplianceOfficer, Coach]
    code: 200
    input: ["to_status", "version?"]
    output: ComplianceViolation
    side_effects: ["penalty_points, outcome, Program.penalty_points_total, Program.compliance_status recomputed; Athlete/NILDeal cascades on SUSTAINED/OVERTURNED"]

  # --- Test-driving system endpoints (per testability-completeness principle) ---
  - method: GET
    path: "/_clock"
    description: "Read the system clock (UTC ISO8601)"
    roles: [ComplianceOfficer, Coach, Athlete, Booster, Auditor]
    code: 200
    input: [""]
    output: "{ now: datetime }"
    side_effects: []
  - method: POST
    path: "/_clock/advance"
    description: "Advance system clock; drives time-gated transitions (ENTERED->CONTACT_WINDOW, CONTACT_WINDOW->EXPIRED, SUBSTANTIATED->SUSTAINED auto-expire)"
    roles: [ComplianceOfficer, Auditor]
    code: 200
    input: ["to_timestamp"]
    output: "{ now: datetime, auto_transitions: [{entity, id, from, to}] }"
    side_effects: ["Evaluate and execute all time-gated automatic transitions whose precondition is now satisfied, in deterministic order: (1) TransferPortalEntry ENTERED->CONTACT_WINDOW, (2) ComplianceViolation SUBSTANTIATED->SUSTAINED (auto-expire), (3) TransferPortalEntry CONTACT_WINDOW->EXPIRED"]

# =============================================================================
# §1.6  Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_AUTH_MISSING,                http: 401, condition: "X-User-Role or X-User-ID header missing/empty on a non-clock endpoint" }
  - { id: ERR_AUTH_INVALID_ROLE,           http: 403, condition: "X-User-Role not in {ComplianceOfficer, Coach, Athlete, Booster, Auditor}" }
  - { id: ERR_FORBIDDEN,                   http: 403, condition: "Role lacks permission for this endpoint per RBAC matrix" }
  - { id: ERR_SEGREGATION_OF_DUTIES,       http: 403, condition: "Same X-User-ID attempting two steps that must be done by different actors (e.g., submitter approving own NILDeal, original reviewer ruling on appeal)" }
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "Path parameter resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND,         http: 404, condition: "Body foreign-key (athlete_id, program_id, related_*) does not resolve" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "Resource is not in a valid from-state for the requested transition" }
  - { id: ERR_VERSION_MISMATCH,            http: 409, condition: "Request 'version' does not match stored version on PATCH or /state" }
  - { id: ERR_VALIDATION_FAILED,           http: 400, condition: "Request body field fails type/range constraint (negative cents, out-of-range GPA, etc.)" }
  - { id: ERR_ELIGIBILITY_NOT_CLEARED,     http: 409, condition: "Athlete has no EligibilityRecord or its decision is NON_QUALIFIER/INCOMPLETE" }
  - { id: ERR_ELIGIBILITY_ALREADY_DECIDED, http: 409, condition: "POST /eligibility-records when one already exists for athlete_id" }
  - { id: ERR_NO_SIGNED_SLOT,              http: 409, condition: "Athlete PROSPECTIVE->COMMITTED requires a SIGNED ScholarshipSlot for the same program" }
  - { id: ERR_ATHLETE_NOT_AVAILABLE,       http: 409, condition: "ScholarshipSlot OFFERED->SIGNED while athlete in TRANSFER_PORTAL or INELIGIBLE" }
  - { id: ERR_ATHLETE_NOT_ENROLLED,        http: 409, condition: "NILDeal APPROVED requires athlete in COMMITTED or ENROLLED" }
  - { id: ERR_AMATEUR_STATUS_LOST,         http: 409, condition: "NILDeal APPROVED while Athlete.amateur_status != AMATEUR" }
  - { id: ERR_PAY_FOR_PLAY_DETECTED,       http: 409, condition: "NILDeal APPROVED while pay_for_play_flag is true" }
  - { id: ERR_PENDING_NIL_REVIEW,          http: 409, condition: "Athlete cannot enter transfer portal while any NILDeal for athlete is UNDER_REVIEW" }
  - { id: ERR_SCHOLARSHIP_CAP_EXCEEDED,    http: 409, condition: "Program.total_equivalencies_used would exceed scholarship_cap_equivalencies after the slot transition" }
  - { id: ERR_ROSTER_CAP_EXCEEDED,         http: 409, condition: "Program.active_roster_count + 1 would exceed roster_cap_count on enrollment" }
  - { id: ERR_CONTACT_NOT_PERMITTED,       http: 409, condition: "Recruiting contact rejected: (period_type, contact_type) is not in the permitted matrix" }
  - { id: ERR_CALENDAR_WINDOW_INVALID,     http: 400, condition: "RecruitingCalendar.start_date >= end_date, or duration < 1 day, or invalid period_type" }
  - { id: ERR_PORTAL_WINDOW_CLOSED,        http: 409, condition: "TransferPortalEntry state transition attempted after window_closes_at" }
  - { id: ERR_PORTAL_INELIGIBLE,           http: 409, condition: "TransferPortalEntry creation when Athlete.amateur_status == FORFEITED (transfer_window_days == 0)" }
  - { id: ERR_DUPLICATE_PORTAL_ENTRY,      http: 409, condition: "Athlete already has an active TransferPortalEntry (status in ENTERED/CONTACT_WINDOW)" }
  - { id: ERR_APPEAL_WINDOW_CLOSED,        http: 409, condition: "ComplianceViolation SUBSTANTIATED->APPEALED requested >= 14 days after SUBSTANTIATED" }
  - { id: ERR_NO_SUSTAINED_VIOLATION,      http: 409, condition: "ScholarshipSlot ACTIVE->REVOKED attempted without a SUSTAINED LEVEL_I/LEVEL_II ComplianceViolation tied to the athlete" }

# =============================================================================
# §1.7  RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Athletic department compliance staff. Adjudicates eligibility, NIL deals, violations. Segregation-of-duties: cannot adjudicate a violation against a program the officer belongs to, and cannot serve as both original reviewer and appellate reviewer on the same violation."
    identity: opaque
    exclusive_operations:
      - "POST /eligibility-records"
      - "POST /athletes/{id}/state"
      - "POST /violations (with Auditor)"
      - "POST /violations/{id}/state (with Coach for APPEALED only)"
      - "POST /nil-deals/{id}/state"
      - "POST /scholarship-slots/{id}/state (ACTIVE->REVOKED only; Coach handles OFFERED transitions)"
      - "POST /recruiting-calendars"
      - "POST /programs"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /athletes (with Coach)"
      - "POST /nil-deals (with Athlete, Booster)"
      - "POST /transfer-portal-entries (with Athlete)"
      - "POST /transfer-portal-entries/{id}/state (with Athlete for WITHDRAWN)"
      - "GET /* (with Coach, Auditor on visible resources)"

  - name: Coach
    description: "Sport-specific recruiter. Manages scholarship slot offers and logs recruiting contacts. Cannot approve NIL deals or adjudicate violations against own program."
    identity: opaque
    exclusive_operations:
      - "POST /scholarship-slots"
      - "POST /scholarship-slots/{id}/state (OFFERED->SIGNED|WITHDRAWN only)"
      - "POST /recruiting-contacts"
    shared_operations:
      - "POST /athletes (with ComplianceOfficer)"
      - "POST /violations/{id}/state (APPEALED only; cannot SUSTAIN/OVERTURN)"
      - "GET /* (program-visible resources)"

  - name: Athlete
    description: "Student-athlete acting on own behalf. Submits NIL deals for own review, enters/withdraws from portal, reads own records."
    identity: entity_backed:Athlete
    exclusive_operations: []
    shared_operations:
      - "POST /nil-deals (with ComplianceOfficer, Booster) — must satisfy athlete_id == X-User-ID"
      - "PATCH /nil-deals/{id} — must own deal (NILDeal.athlete_id == X-User-ID)"
      - "POST /transfer-portal-entries — must satisfy athlete_id == X-User-ID"
      - "POST /transfer-portal-entries/{id}/state — WITHDRAWN only; must own the entry"
      - "GET /athletes/{id} — own record"
      - "GET /nil-deals?athlete_id=<self> — own deals"

  - name: Booster
    description: "Registered supporter of a program. Can submit NIL deals on behalf of an athlete but cannot self-approve them."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /nil-deals (with ComplianceOfficer, Athlete)"
      - "PATCH /nil-deals/{id} (only deals where sponsor_name == X-User-ID's registered booster name and status == SUBMITTED)"
      - "GET /nil-deals (limited to own submissions)"

  - name: Auditor
    description: "Read-only auditor for read-everywhere; can file violation reports for review."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /violations (with ComplianceOfficer)"
      - "GET /* (full read across the system)"
      - "POST /_clock/advance (with ComplianceOfficer)"
