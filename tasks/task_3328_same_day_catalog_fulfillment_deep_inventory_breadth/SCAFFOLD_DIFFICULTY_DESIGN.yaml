            - "GET /stock?dc_id=${dal_dc_id} shows exactly one row, and its positioning_flag == LONG_TAIL_DEFICIT because in_stock_count 1 is below the threshold of 2 and the only in-stock item is long_tail true"
            - "GET /stock?dc_id=${sea_dc_id} shows exactly one row with positioning_flag UNDERSTOCKED and one with positioning_flag unchanged-by-the-zero rule, because the on_hand_units 0 row is excluded from the census"
            - "each rolled DC reports cutoff_sequence_index == 1"

