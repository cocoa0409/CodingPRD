            - { call: "POST /engineers", payload: { full_name: "Rev Eng", email: "rev11@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "10 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
