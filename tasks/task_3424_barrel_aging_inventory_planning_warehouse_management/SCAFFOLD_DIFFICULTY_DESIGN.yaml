      - name: withdraw_requires_covering_report_filed
        grounds:
          - "state_machines.Barrel(custody_status).BONDED_to_WITHDRAWN"
          - "state_machines.BondedPeriodReport.RECONCILED_to_FILED"
          - errors[ERR_COVERING_REPORT_NOT_FILED]
        distinguishing_aspect: |
          Entity pair Barrel -> BondedPeriodReport (different pair than BlendBatch ->
          Label): the barrel is DUMPED and unreserved, so every barrel-local gate passes;
          withdrawal still fails because the report covering the current clock is only
          RECONCILED, not FILED/ACCEPTED.
        test_recipe:
          setup:
            - "Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 (min_maturation_months 0), dumped at 2028-09-02."
            - "Report period [2028-08-01, 2028-12-01) created; at clock 2028-12-01 it is reconciled (clock >= period_end) but NOT filed."
            - "Clock stays at 2028-12-01, which the report period covers (period_start <= now <= period_end)."
