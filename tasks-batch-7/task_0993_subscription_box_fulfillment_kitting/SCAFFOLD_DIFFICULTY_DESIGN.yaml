            - { call: "POST /components/${ci2_cp}/receipts", payload: { quantity: 10, expected_component_version: "${ci2_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${ci2_cl}", name: "CI2 Box", sku: "PL-CI2", price_per_box_cents: 2000, shipping_weight_grams: 1000 }
              as: ClientOps
              as_user_id: "${ci2_cl}"
              captures: { ci2_pl: $.data.id, ci2_pl_v: $.data.version }
            - call: "POST /box-plans/${ci2_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${ci2_pl_v}" }
              as: ClientOps
              as_user_id: "${ci2_cl}"
              captures: { ci2_rv: $.data.id }
            - call: "PUT /kit-revisions/${ci2_rv}/bom-lines"
              payload: { lines: [{ component_id: "${ci2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${ci2_cl}"
            - { call: "POST /kit-revisions/${ci2_rv}/approve", as: ClientOps, as_user_id: "${ci2_cl}" }
            - { call: "POST /box-plans/${ci2_pl}/activate", as: ClientOps, as_user_id: "${ci2_cl}" }
            - call: "POST /box-plans/${ci2_pl}/import-batches"
              payload: { rows: [{ email: "ci2a@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${ci2_cl}"
              captures: { ci2_ib: $.data.id }
            - { call: "POST /import-batches/${ci2_ib}/commit", as: ClientOps, as_user_id: "${ci2_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${ci2_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { ci2_rn: $.data.id }
            - { call: "POST /assembly-runs/${ci2_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${ci2_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${ci2_rn}/complete-kitting", payload: { actual_kitted_count: 1 }, as: WarehouseOps }
            - call: "GET /clients/${ci2_cl}/billing-statements"
              as: BillingAdmin
              captures: { ci2_st: "$.data[0].id" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /billing-statements/${ci2_st}/finalize", as: BillingAdmin }
            - call: "GET /clients/${ci2_cl}"
              as: BillingAdmin
              captures: { ci2_bal_post_finalize: $.data.credit_balance_cents }
          trigger:
            - { call: "POST /billing-statements/${ci2_st}/dispute", as: ClientOps, as_user_id: "${ci2_cl}" }
            - call: "GET /clients/${ci2_cl}"
              as: BillingAdmin
              captures: { ci2_bal_disputed: $.data.credit_balance_cents }
            - { call: "POST /billing-statements/${ci2_st}/resolve-dispute", payload: { adjustment_credit_cents: 0 }, as: BillingAdmin }
            - call: "GET /clients/${ci2_cl}"
              as: BillingAdmin
              captures: { ci2_bal_resolved: $.data.credit_balance_cents }
            - call: "GET /billing-statements/${ci2_st}"
