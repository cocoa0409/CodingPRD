            - call: "POST /state-licenses"
              payload: { therapist_id: "${as_id}", state_code: "CA", license_number: "LA2", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /patients"
              payload: { full_name: "Pt CS", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${as_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-11T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${as_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
