              captures: { c2: $.data.id }
            - call: "POST /studio/projects"
              payload: { client_id: "${c1}", title: "P1", upc: "111111111111", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
