              payload: { inspector_user_id: "fi-9", window_start: "2026-09-03T09:00:00Z", window_end: "2026-09-03T10:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-9"
            - call: "POST /drinkware/dealer-applications/${a_i2}/schedule-inspection"
              payload: { inspector_user_id: "fi-9", window_start: "2026-09-03T08:00:00Z", window_end: "2026-09-03T09:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-9"
              captures: { err_touch: $.data.error_id }
            - call: "POST /drinkware/dealer-applications/${a_i3}/schedule-inspection"
              payload: { inspector_user_id: "fi-9", window_start: "2026-09-03T10:59:00Z", window_end: "2026-09-03T11:30:00Z" }
              as: FieldInspector
              as_user_id: "fi-9"
              captures: { err_gap59: $.data.error_id }
            - call: "POST /drinkware/dealer-applications/${a_i4}/schedule-inspection"
              payload: { inspector_user_id: "fi-9", window_start: "2026-09-03T11:00:00Z", window_end: "2026-09-03T12:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-9"
          assert:
            - "a1 200: [09:00, 10:00] scheduled"
            - "err_touch == ERR_INSPECTOR_SCHEDULE_CONFLICT (409): [08:00, 09:00] SHARES the 09:00 endpoint with a1's window — closed intervals touch-conflict (a print-slot pair would have allowed this)"
            - "err_gap59 == ERR_INSPECTOR_SCHEDULE_CONFLICT (409): 59-minute gap after a1's 10:00 end is below the 60-minute travel buffer"
            - "a4 200: [11:00, 12:00] leaves exactly 60 minutes after 10:00 — buffer boundary is inclusive"
            - "DealerApplication.${a_i2}.inspection_status and .${a_i3}.inspection_status remain UNSCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_release_restores_slot_minutes_exactly
        grounds:
          - calculations.slot_capacity_ledger
          - state_machines.CustomizationOrder.schedule_status
        distinguishing_aspect: |
          Conserved quantity: slot minutes. The forward action (reserve-slot HELD) and its
          compensating action (release-slot) must leave capacity_minutes == booked_minutes +
          available_minutes true at every step and restore available_minutes to exactly the
          pre-reserve value (100), with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line CUP12 (MOQ 1), standard drop, off-peak LASER slot L-8 capacity 100. Submitted order qty 10 LASER (40 minutes)."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Cup 12 oz", category: "DRINKWARE", base_sku: "CUP12", base_custom_price_cents: 2400, map_price_cents: 2899, min_custom_quantity: 1, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_inv: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_inv}", color_name: "Ivory", pantone_code: "PMS 7527", drop_type: "STANDARD", total_units: 3000, dtc_reserved_units: 500, dealer_unit_price_cents: 1600, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_inv: $.data.id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-8", technology: "LASER", window_start: "2026-09-14T09:00:00Z", window_end: "2026-09-14T11:00:00Z", capacity_minutes: 100 }
              as: ProductionLead
              captures: { slot_inv: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-inv", product_line_id: "${pl_inv}", colorway_drop_id: "${drop_inv}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-inv"
              captures: { order_inv: $.data.id }
            - call: "POST /drinkware/customization-orders/${order_inv}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-inv"
          trigger:
            - call: "POST /drinkware/customization-orders/${order_inv}/reserve-slot"
              payload: { slot_id: "${slot_inv}" }
              as: Buyer
              as_user_id: "buyer-inv"
            - call: "GET /drinkware/print-slots/${slot_inv}"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
              captures: { booked_mid: $.data.booked_minutes, avail_mid: $.data.available_minutes }
            - call: "POST /drinkware/customization-orders/${order_inv}/release-slot"
              payload: {}
              as: Buyer
              as_user_id: "buyer-inv"
            - call: "GET /drinkware/print-slots/${slot_inv}"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
              captures: { booked_end: $.data.booked_minutes, avail_end: $.data.available_minutes }
          assert:
            - "booked_mid == 40 and avail_mid == 60 (invariant: 100 == 40 + 60)"
            - "booked_end == 0 and avail_end == 100 — exactly the pre-reserve value, no drift"
            - "invariant holds after release: 100 == 0 + 100"
            - "CustomizationOrder.${order_inv}.reservation_status == RELEASED and schedule_status == UNSCHEDULED"

      - name: lock_then_forfeit_restores_drop_units_exactly
        grounds:
          - calculations.drop_unit_ledger
          - state_machines.LaunchAllocation.ALLOCATED_to_FORFEITED
        distinguishing_aspect: |
          Conserved quantity: drop units (a DIFFERENT quantity than slot minutes).
          total_units == dealer_committed + dtc_reserved + warranty_reserved + unallocated
          across lock (committed 0 -> 30) and forfeit (committed 30 -> 0); the compensating
          forfeit restores unallocated_units to exactly its pre-lock value.
        test_recipe:
          setup:
            - "Dealer authorized (brand 85). Drop INV-DROP: total 100, dtc 20, price 2000c, pool 80; dealer requested 30. Clock 2026-09-11 (past closes)."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Invariant Traders", storefront_address: "8 Ledger Ln", region_code: "AZ-N", sell_through_pct: 50, tenure_years: 5 }
              as: PlatformAdmin
              captures: { dealer_inv: $.data.id }
            - call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${dealer_inv}", has_physical_storefront: true, storefront_sqft: 1700, document_refs: ["doc-inv"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_inv: $.data.id }
            - call: "POST /drinkware/dealer-applications/${app_inv}/schedule-inspection"
              payload: { inspector_user_id: "fi-5", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T11:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-5"
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/dealer-applications/${app_inv}/record-inspection"
              payload: { outcome: "PASSED", brand_presentation_score: 85 }
              as: FieldInspector
              as_user_id: "fi-5"
            - call: "POST /drinkware/dealer-applications/${app_inv}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-docs"
            - call: "POST /drinkware/dealer-applications/${app_inv}/decide"
              payload: { decision: "APPROVE", decision_reason: "ok" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/product-lines"
              payload: { name: "Rambler 36 oz", category: "DRINKWARE", base_sku: "RAM36", base_custom_price_cents: 3400, map_price_cents: 3999, min_custom_quantity: 24, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_inv2: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_inv2}", color_name: "Invariant Teal", pantone_code: "PMS 321", drop_type: "LIMITED_EDITION", total_units: 100, dtc_reserved_units: 20, dealer_unit_price_cents: 2000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-10T00:00:00Z", go_live_at: "2026-12-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_inv2: $.data.id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_inv2}/open-allocation"
              payload: {}
              as: PlatformAdmin
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${dealer_inv}", drop_id: "${drop_inv2}", requested_units: 30 }
              as: Dealer
              as_user_id: "${dealer_inv}"
              captures: { alloc_inv: $.data.id }
            - call: "GET /drinkware/colorway-drops/${drop_inv2}"
              payload: {}
              as: PlatformAdmin
              captures: { drop_inv2_v: $.data.version }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_inv2}/lock-allocation"
              payload: { expected_drop_version: "${drop_inv2_v}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /drinkware/colorway-drops/${drop_inv2}"
              payload: {}
              as: PlatformAdmin
              captures: { committed_mid: $.data.dealer_committed_units, unallocated_mid: $.data.unallocated_units }
            - call: "POST /drinkware/launch-allocations/${alloc_inv}/forfeit"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "GET /drinkware/colorway-drops/${drop_inv2}"
              payload: {}
              as: PlatformAdmin
              captures: { committed_end: $.data.dealer_committed_units, unallocated_end: $.data.unallocated_units }
          assert:
            - "committed_mid == 30 and unallocated_mid == 50 (invariant: 100 == 30 + 20 + 0 + 50)"
            - "LaunchAllocation.${alloc_inv}.status == FORFEITED with forfeit_reason == DEALER_CHOICE"
            - "committed_end == 0 and unallocated_end == 80 — exactly the pre-lock pool composition restored"
            - "invariant holds after forfeit: 100 == 0 + 20 + 0 + 80"
