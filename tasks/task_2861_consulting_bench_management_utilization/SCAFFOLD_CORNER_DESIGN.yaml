            - call: "POST /consultants"
              payload: { full_name: "Seat Two", email: "seat.two@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "POST /reskilling-programs"
              payload: { skill_id: "${sk_id}", target_proficiency_level: 4, cohort_start_on: "2026-09-01", cohort_end_on: "2026-09-30", seat_capacity: 1 }
              as: ResourceManager
              captures: { p1_id: $.data.id, p1_seats: $.data.seats_taken }
            - call: "GET /bench-spells"
              payload: { consultant_id: "${c2_id}" }
              as: ResourceManager
              captures: { bs2_id: "$.data[0].id", bs2_state: "$.data[0].state" }
          trigger:
            - call: "POST /reskilling-programs/${p1_id}/enrollments"
