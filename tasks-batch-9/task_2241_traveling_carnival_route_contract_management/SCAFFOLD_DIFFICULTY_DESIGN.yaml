  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: contract_negotiation_cycle_dead_ends_at_the_round_budget
        grounds:
          - state_machines.Contract.DRAFT_to_SENT
          - state_machines.Contract.SENT_to_COUNTERED
          - state_machines.Contract.COUNTERED_to_SENT
          - validations[priority=84]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
          - entities.Contract.fields.negotiation_round
        distinguishing_aspect: |
          This is the CONTRACT loop and its termination condition is a COUNTER-BUDGET, not a state guard: the row
          travels DRAFT -> SENT -> COUNTERED -> SENT -> COUNTERED, each counter incrementing negotiation_round and
          overwriting the negotiated terms, and the loop dead-ends at COUNTERED with round == 2 where the third send
          answers ERR_NEGOTIATION_ROUNDS_EXHAUSTED (409) while the row stays COUNTERED and non-terminal — nothing is
          voided, so the terms of the last counter (split 70, guarantee 1200000, ride_minimum 5) remain readable.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 with one PLANNED stop, sequenced so that contract send is allowed."
            - "Contract C1 in DRAFT with revenue_split_pct_operator 65, guarantee_cents 900000, ride_minimum_count 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_n: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_n}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { venue_n: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_n: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_n}", venue_id: "${venue_n}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_n: $.data.id }
            - call: "POST /routes/${route_n}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_n}", counterparty_name: "Franklin County Agricultural Society", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 4, exclusivity: "RIDES", settlement_basis: "GREATER_OF" }
              as: ContractNegotiator
              captures: { contract_n: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_n}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /contracts/${contract_n}/counter"
              payload: { revenue_split_pct_operator: 68, guarantee_cents: 1000000 }
              as: ContractNegotiator
            - call: "POST /contracts/${contract_n}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /contracts/${contract_n}/counter"
              payload: { revenue_split_pct_operator: 70, guarantee_cents: 1200000, ride_minimum_count: 5 }
              as: ContractNegotiator
            - call: "POST /contracts/${contract_n}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
              captures: { exhausted_error: $.data.error_id }
          assert:
            - "Contract.${contract_n}.negotiation_round == 0 and Contract.${contract_n}.status == DRAFT before the first trigger call"
            - "After trigger call 1: Contract.${contract_n}.status == SENT and Contract.${contract_n}.negotiation_round == 0 (send never increments the counter)"
            - "After trigger call 2: Contract.${contract_n}.status == COUNTERED, negotiation_round == 1, revenue_split_pct_operator == 68, guarantee_cents == 1000000, ride_minimum_count == 4 (an omitted term is left alone)"
            - "After trigger call 3: Contract.${contract_n}.status == SENT and negotiation_round == 1 (second lap of the same loop)"
            - "After trigger call 4: Contract.${contract_n}.status == COUNTERED, negotiation_round == 2, revenue_split_pct_operator == 70, guarantee_cents == 1200000, ride_minimum_count == 5"
            - "Trigger call 5 returns HTTP 409 with error_id == ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "After the rejected send: Contract.${contract_n}.status is still COUNTERED (not VOID, not TERMINATED) and negotiation_round is still 2"
            - "Contract.${contract_n}.executed_at == null"

      - name: settlement_dispute_reconcile_cycle_recomputes_amounts_and_clears_the_reason
        grounds:
          - state_machines.Settlement.PROVISIONAL_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_PROVISIONAL
          - calculations.stop_settlement
          - entities.Settlement.fields.dispute_reason
          - endpoints["POST /settlements/{id}/reconcile"]
        distinguishing_aspect: |
          This is the SETTLEMENT loop and its termination condition is DATA CONVERGENCE, not a counter: the row returns
          to the state it started in (PROVISIONAL) on the SAME id, and the loop is only observable through the payload —
          reconcile re-runs the PROVISIONAL variant over the ticket rows added while the row sat DISPUTED, moving
          gross 3032300 -> 3082300, tax 197101 -> 200351 and settlement_due_cents 1913759 -> 1945316, and nulls
          dispute_reason. No SUPERSEDED row is created; version increments twice on one row.
        setup_note: "Rebuilds the fixture of stop_settlement_pinned_step_order_resolves_tier_penalty_guarantee_cycle, then rediscovers its ids through filtered list endpoints so the recipe binds every placeholder it uses."
        test_recipe:
          setup:
            - "The end state of instance stop_settlement_pinned_step_order_resolves_tier_penalty_guarantee_cycle: OH stop A OPEN with one PROVISIONAL Settlement whose gross is 3032300, tax 197101, split 1913759, due 1913759."
            - "The stop is still OPEN, so further TicketSale rows can be posted inside [open_date, close_date]."
            - "The only OPEN stop, its only EXECUTED contract and that contract's only PROVISIONAL settlement are located by filtered list reads, not by hard-coded ids."
          setup_api_calls:
            - call: "GET /route-stops?status=OPEN"
              payload: {}
              as: LotBoss
              captures: { stop_c: "$.data[0].id" }
            - call: "GET /contracts?route_stop_id=${stop_c}&status=EXECUTED"
              payload: {}
              as: TicketingAuditor
              captures: { contract_c: "$.data[0].id" }
            - call: "GET /contracts/${contract_c}/settlements?status=PROVISIONAL"
              payload: {}
              as: TicketingAuditor
              captures: { settle_c: "$.data[0].id" }
          trigger:
            - call: "POST /settlements/${settle_c}/dispute"
              payload: { dispute_reason: "Presale scan counts from the west gate were omitted from the provisional draw." }
              as: ContractNegotiator
            - call: "POST /route-stops/${stop_c}/ticket-sales"
              payload: { channel: "PRESALE", units: 100, unit_price_cents: 500, business_date: "2026-09-05T13:00:00Z" }
              as: TicketingAuditor
            - call: "POST /settlements/${settle_c}/reconcile"
              payload: {}
              as: TicketingAuditor
          assert:
            - "After trigger call 1: Settlement.${settle_c}.status == DISPUTED and dispute_reason == \"Presale scan counts from the west gate were omitted from the provisional draw.\""
            - "After trigger call 1: every computed amount is untouched — gross_cents == 3032300, tax_cents == 197101, settlement_due_cents == 1913759"
            - "After trigger call 3: Settlement.${settle_c}.status == PROVISIONAL and Settlement.${settle_c}.variant == PROVISIONAL"
            - "After trigger call 3: Settlement.${settle_c}.dispute_reason == null"
            - "After trigger call 3: Settlement.${settle_c}.gross_cents == 3082300"
            - "After trigger call 3: Settlement.${settle_c}.tax_cents == 200351 (81257 + 47457 + 71637)"
