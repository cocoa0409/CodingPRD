      - name: corner_partner_response_cycle_bounces_the_case_and_counts_every_round
        claim_type: conditional_action
        grounds:
          - endpoints[POST /violation-cases/{id}/request-partner-response]
          - endpoints[POST /violation-cases/{id}/partner-response]
