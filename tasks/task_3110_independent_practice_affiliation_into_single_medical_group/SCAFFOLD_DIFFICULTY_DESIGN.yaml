  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: wave_complete_cascades_practice_then_enrollment_then_provider
        grounds:
          - state_machines.ImplementationWave.IN_CUTOVER_to_COMPLETE
          - state_machines.Practice.ONBOARDING_to_AFFILIATED
          - state_machines.CredentialingEnrollment.APPROVED_to_EFFECTIVE
          - state_machines.Provider.ROSTERED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain: POST wave complete mutates the wave; the wave completion
          flips ONBOARDING practices AFFILIATED (hop 1); each practice flip —
          not the wave event — flips its APPROVED enrollments EFFECTIVE (hop 2);
          each enrollment flip activates its provider (hop 3). Verified by an
          enrollment that stays APPROVED until the wave completes.
        test_recipe:
          setup:
            - "Base setup through wave IN_CUTOVER; practice ONBOARDING (agreement executed); contract ACTIVE; provider ROSTERED; enrollment approved while practice is ONBOARDING so it lands APPROVED with effective_date 2026-11-30 (application 2026-09-01 + 90d STANDARD lag)."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
          trigger:
            - call: "POST /api/implementation-waves/${wave_id}/complete"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
          assert:
            - "Before complete: Practice.${prac_id}.status == ONBOARDING, CredentialingEnrollment.${enr_id}.status == APPROVED, Provider.${prov_id}.status == ROSTERED"
            - "After complete: Practice.${prac_id}.status == AFFILIATED and affiliation_effective_date == \"2026-09-01\""
            - "Hop 2: CredentialingEnrollment.${enr_id}.status == EFFECTIVE with effective_date == \"2026-11-30\""
            - "Hop 3: Provider.${prov_id}.status == ACTIVE and Practice.${prac_id}.active_provider_count == 1"
            - "Practice.${prac_id}.wave_id == ${wave_id}"

      - name: departure_settle_cascades_practice_then_enrollments_and_agreement
        grounds:
          - state_machines.DepartureCase.SETTLEMENT_PENDING_to_SETTLED
          - state_machines.Practice.DEPARTING_to_DEPARTED
          - state_machines.CredentialingEnrollment.EFFECTIVE_to_TERMINATED
          - state_machines.AffiliationAgreement.EXECUTED_to_TERMINATED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (departure settle, not wave
          complete): the settle mutates the case; the case flips the practice
          DEPARTED (hop 1); the practice flip — not the settle itself — terminates
          the practice's enrollments with termination_date = actual_exit_date,
          terminates its EXECUTED agreement, and deactivates its providers (hop 2).
        test_recipe:
          setup:
            - "Base affiliated setup with EFFECTIVE enrollment; clock 2027-06-01; departure case at SETTLEMENT_PENDING with requested_exit_date 2027-12-01; clock then 2027-12-01."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/departure-cases"
              payload: { practice_id: "${prac_id}", requested_exit_date: "2027-12-01" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { dc_id: $.data.id }
            - call: "POST /api/departure-cases/${dc_id}/complete-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/departure-cases/${dc_id}/settle"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          assert:
            - "DepartureCase.${dc_id}.status == SETTLED and actual_exit_date == \"2027-12-01\""
            - "Hop 1: Practice.${prac_id}.status == DEPARTED and departure_effective_date == \"2027-12-01\""
            - "Hop 2: CredentialingEnrollment.${enr_id}.status == TERMINATED with termination_date == \"2027-12-01\" (cascade date, not an input)"
            - "Hop 2: AffiliationAgreement.${ag_id}.status == TERMINATED"
            - "Hop 2: Provider.${prov_id}.status == DEACTIVATED and Practice.${prac_id}.active_provider_count == 0"

