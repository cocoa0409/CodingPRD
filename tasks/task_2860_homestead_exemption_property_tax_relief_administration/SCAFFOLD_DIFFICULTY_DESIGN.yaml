            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "INCOME_DOR", record_effective_date: "2026-02-20", reported_income_cents: 9000000 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "INCOME_DOR" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app1_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { g1_id: $.data.resulting_grant_id }
            - call: "POST /fraud-cases"
              payload: { taxpayer_id: "${t_id}", grant_id: "${g1_id}", improper_start_tax_year: 2024, improper_end_tax_year: 2025, assessment_tax_year: 2026 }
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { case_id: $.data.id }
            - call: "POST /fraud-cases/${case_id}/decide"
              payload: { action: "SUBSTANTIATE", findings: "Address and postal cross-match establish two improper years." }
              as: FraudInvestigator
              as_user_id: "investigator-01"
          trigger:
            - call: "POST /fraud-cases/${case_id}/recovery-actions"
              payload: { action: "PAY", amount_cents: 300000, reason: "Attempted overpayment" }
              as: RecoveryOfficer
              as_user_id: "recovery-01"
              captures: { err: $.data.error_id }
            - call: "POST /fraud-cases/${case_id}/recovery-actions"
              payload: { action: "PAY", amount_cents: 46750, reason: "Partial collection" }
              as: RecoveryOfficer
              as_user_id: "recovery-01"
            - call: "POST /fraud-cases/${case_id}/recovery-actions"
              payload: { action: "ABATE", reason: "Hardship abatement granted by the exemptions board." }
              as: RecoveryOfficer
              as_user_id: "recovery-01"
          assert:
            - "the 300000 payment returns HTTP 422 with ${err} == ERR_PAYMENT_EXCEEDS_BALANCE (outstanding is 246750) and leaves recovery_paid_cents at 0"
            - "after the 46750 payment: FraudCase.${case_id}.recovery_paid_cents == 46750 and recovery_status == PARTIALLY_PAID"
            - "after the 46750 payment: TaxpayerAccount.${t_id}.lifetime_recovery_collected_cents == 46750 and net_relief_cents == -46750"
            - "after the abatement: FraudCase.${case_id}.recovery_status == ABATED and recovery_paid_cents == 0, while total_assessed_cents stays 246750 for audit"
            - "after the abatement: TaxpayerAccount.${t_id}.lifetime_recovery_collected_cents == 0 and net_relief_cents == 0 — exactly the pre-assessment ledger, not merely a smaller number"
            - "FraudCase.${case_id}.investigation_status == SUBSTANTIATED and adjudication_risk_score == 70 (abatement settles money, not guilt)"
            - "ExemptionGrant.${g1_id}.benefit_status == REVOKED and TaxpayerAccount.${t_id}.status == BARRED (the abatement does not undo the revocation on this path)"
