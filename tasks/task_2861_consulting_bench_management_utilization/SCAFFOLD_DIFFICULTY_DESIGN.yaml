            - "HiringForecast.${fc_id}.gap_fte == 0.24"
            - "HiringForecast.${fc_id}.recommended_hires == 1 — ceil(0.24 / 0.85) == 1, not round(0.2824) == 0"

      - name: discount_tier_escalation_single_pass_evaluation_order
        grounds:
          - calculations.discount_tier_and_margin
          - calculations.discount_tier_and_margin.variants.MIX_WEIGHTED
          - entities.DiscountApproval.fields.discount_pct
          - entities.DiscountApproval.fields.provisional_realization_pct
          - entities.DiscountApproval.fields.projected_margin_pct
