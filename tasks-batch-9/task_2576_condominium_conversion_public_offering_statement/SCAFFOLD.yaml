    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "every /warranty-claims/{id}/... path"
  - priority: 13
    category: business_referential
    check: "every referenced entity belongs to the same ConversionProject as the path project or
      path resource: EngineeringReport.conversion_project_id, Unit.conversion_project_id,
      TenantHousehold.conversion_project_id, PurchaseAgreement.conversion_project_id,
      ReserveStudy.conversion_project_id, InitialBudget.conversion_project_id,
      ClosingBatch.conversion_project_id and MajorComponent's report's conversion_project_id must
      all be equal"
