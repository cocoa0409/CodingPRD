  # Section: endpoints
  # ==========================================================================
  - section: endpoints
    instances:
      - name: interest_summary_computed_read_shape
        claim_type: computed_read
        grounds:
          - 'endpoints.GET /margin/accounts/{id}/interest-summary'
        distinguishing_aspect: "Computed read returns all five pinned fields; a no-debit account reads zeros."
        test_recipe:
          setup: ["approved account, no activity"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Sum Mary", email: "summary@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
          trigger:
            - { call: "GET /margin/accounts/${acct_id}/interest-summary", payload: {}, as: MarginSupervisor, captures: { debit: $.data.debit_balance_cents, daily: $.data.current_daily_accrual_cents, mtd: $.data.month_to_date_accrued_cents } }
          assert:
            - "debit_balance_cents == 0 and current_daily_accrual_cents == 0 and month_to_date_accrued_cents == 0"

      - name: monthly_post_debits_cash_and_marks_dailies_posted
        claim_type: side_effect_execution
        grounds:
          - 'endpoints.POST /_sweeps/daily'
          - 'calculations.interest_accrual'
        distinguishing_aspect: "On the first June sweep, a MONTHLY_POST of 3*917=2751 (May 29-31 accruals at tier2) debits cash by 2751 and all May DAILY_ACCRUAL entries flip posted=true."
        test_recipe:
          setup: ["account with constant debit 3000000 from 2026-05-29 through 2026-05-31 (3 accruals of 917)"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Mon Thly", email: "monthly@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "XYZ", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 9500 }, as: MarginSupervisor, captures: { sec_xyz: $.data.id } }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 1, min_balance_cents: 0, annual_rate_bps: 1200, effective_from: "2026-01-01", effective_to: null }, as: MarginSupervisor }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 2, min_balance_cents: 2500000, annual_rate_bps: 1100, effective_from: "2026-01-01", effective_to: null }, as: MarginSupervisor }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 50000000, liquid_net_worth_cents: 90000000, investment_experience_years: 7 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-29T00:00:00Z" }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_xyz}", side: "BUY", quantity: 400 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-30T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps, captures: { posts: $.data.interest_posts_created } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { cash: $.data.cash_balance_cents } }
            - { call: "GET /margin/accounts/${acct_id}/interest-entries?entry_type=MONTHLY_POST", payload: {}, as: MarginSupervisor, captures: { post_amt: "$.data[0].amount_cents" } }
          assert:
            - "interest_posts_created == 1"
            - "MONTHLY_POST amount_cents == 2751  # 3 * 917"
            - "cash_balance_cents == -3002751  # -3000000 debit minus 2751 interest post"

      - name: clock_regression_rejected
        claim_type: conditional_action
        grounds:
          - 'endpoints.POST /_clock/set_current_utc'
          - 'errors[ERR_CLOCK_REGRESSION"]'
        distinguishing_aspect: "Setting the logical clock backwards returns ERR_CLOCK_REGRESSION 400; forward set succeeds."
        test_recipe:
          setup: ["clock advanced to 2026-05-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: MarketDataOps }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T00:00:00Z" }, as: MarketDataOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLOCK_REGRESSION and http == 400"

