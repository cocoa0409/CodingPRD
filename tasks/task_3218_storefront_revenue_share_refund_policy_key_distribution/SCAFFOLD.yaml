# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version mismatch (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, out-of-range value" }
  - { id: ERR_DEVELOPER_NOT_ACTIVE, http: 409, condition: "DeveloperAccount not ACTIVE for the attempted developer operation" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "UserAccount not ACTIVE (RESTRICTED or BANNED)" }
  - { id: ERR_INVALID_SCHEDULE, http: 422, condition: "release_at not strictly in the future; or window end_at <= start_at" }
  - { id: ERR_MISSING_DISCLOSURE, http: 422, condition: "Early-access title scheduled/released without disclosure text" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "Another SUBMITTED StorePageReview exists for the title" }
  - { id: ERR_PRICE_DEVIATION, http: 422, condition: "Regional override deviates > 2500 bps from recommendation" }
  - { id: ERR_OVERRIDE_EXISTS, http: 409, condition: "An ACTIVE override already exists for (title, currency)" }
  - { id: ERR_FREE_KEY_ALLOWANCE_EXCEEDED, http: 422, condition: "Free keys requested exceed allowance snapshot" }
  - { id: ERR_GRAY_MARKET_RISK, http: 422, condition: "Key-batch approval blocked by title refund_abuse_flag" }
  - { id: ERR_REDEEM_VELOCITY, http: 422, condition: "Redemption velocity guard tripped (account >= 3 / 60 min or global >= 50 / 60 min)" }
  - { id: ERR_KEY_NOT_REDEEMABLE, http: 409, condition: "Key not UNUSED, title not RELEASED, or developer not ACTIVE at redemption" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 422, condition: "Purchase older than 14 days at refund request" }
  - { id: ERR_PLAYTIME_EXCEEDED, http: 422, condition: "Purchase playtime >= 120 minutes at refund request" }
  - { id: ERR_REFUND_ABUSE, http: 422, condition: "User refund_restricted" }
  - { id: ERR_REFUND_AMOUNT, http: 422, condition: "Refund amount exceeds remaining gross or purchase fully refunded" }
  - { id: ERR_REFUND_ALREADY_PENDING, http: 409, condition: "Another REQUESTED refund exists for the purchase" }
  - { id: ERR_REVIEW_NOT_OWNED, http: 422, condition: "Reviewer owns no completed purchase or redeemed key for the title" }
  - { id: ERR_NEGATIVE_REVENUE, http: 422, condition: "Adjustment would drive recognized revenue below zero" }
  - { id: ERR_ITEM_NOT_PURCHASABLE, http: 422, condition: "Workshop item not PUBLISHED or host title not RELEASED" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (email, title name per developer, review per user+title)" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformOps
    description: "Platform operations staff; onboarding, key-batch approval, clock, adjustments"
    identity: opaque
    exclusive_operations: ["developer account register/activate/suspend/unsuspend/terminate", "key-batch approve/reject", "title revenue adjustments", "user account registration", "logical clock control"]
    shared_operations: ["read access to all resources", "list endpoints"]
  - name: Developer
    description: "Game developer operating its own account and titles"
    identity: "entity_backed:DeveloperAccount"
    exclusive_operations: ["title create/update/submit/schedule/cancel/release/delist", "regional price create/withdraw", "key-batch request", "payment-info submission"]
    shared_operations: ["read own titles, reviews, key batches, store-page reviews"]
  - name: StoreReviewer
    description: "Store page reviewer; approves or rejects submissions"
    identity: opaque
    exclusive_operations: ["store-page review approve/reject"]
    shared_operations: ["read titles, reviews, pricing"]
  - name: TrustSafety
    description: "Trust & safety; refunds, moderation, abuse control"
    identity: opaque
    exclusive_operations: ["refund approve/deny", "review removal", "review-bomb-window close", "user restrict/unrestrict/ban", "workshop item removal (any)"]
    shared_operations: ["read access to user-facing resources"]
  - name: User
    description: "Player account; purchases, refunds, reviews, keys, workshop"
    identity: "entity_backed:UserAccount"
    exclusive_operations: ["purchase", "refund request", "key redemption", "review posting", "playtime recording", "workshop item create/publish (as creator)", "workshop purchase"]
    shared_operations: ["read titles, reviews, own purchases"]
  - name: Anonymous
    description: "Unauthenticated caller"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
