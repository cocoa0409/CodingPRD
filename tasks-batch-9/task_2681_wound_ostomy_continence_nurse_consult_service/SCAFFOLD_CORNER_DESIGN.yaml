          - endpoints[POST /dressing-protocols].input
          - endpoints[POST /consult-requests/{consult_id}/assign]
        distinguishing_aspect: "When two body foreign keys are both unknown the 404 returned is the one for the field declared FIRST in the endpoint's input list (survey_round_id before patient_id; patient_id before observer_nurse_id; consult_request_id before formulary_product_id), and when a path id and a body FK are both unknown the path wins because priority 4 precedes priority 5 — and the body-FK 404 still outranks the 409 invalid-state check at priority 10."
        test_recipe:
          setup:
            - "Unit U1, ADMITTED Patient P1 on U1 and CANDIDATE WocNurse N1 exist."
            - "SurveyRound R1 (PREVALENCE, participating [U1]) is OPEN."
