          - "entities.DecreeDocket"
          - "endpoints[POST /decree-dockets]"
        distinguishing_aspect: >-
          A new DecreeDocket starts in phase OPEN_FOR_CLAIMS with claim_count 0,
          decreed_claim_count 0 and total_decreed_af 0.00 — and per validations
          priority 49 a docket with zero claims can never leave that phase.
        test_recipe:
          setup:
            - "Empty DB; clock 2026-03-01T00:00:00Z."
          setup_api_calls:
