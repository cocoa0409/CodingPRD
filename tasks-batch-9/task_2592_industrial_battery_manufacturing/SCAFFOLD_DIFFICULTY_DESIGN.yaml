  - rule_id: cross_entity_state_dependency
    instances:
      - name: formation_run_start_requires_open_plant_posture
        grounds:
          - state_machines.FormationRun.run_state.SCHEDULED_to_CHARGING
          - state_machines.Plant.compliance_posture
          - validations[priority 12 -> ERR_PLANT_RESTRICTED]
          - endpoints[POST /formation-runs/{id}/start]
          - endpoints[POST /workers/{id}/medical-clearance]
        distinguishing_aspect: |
          Entity pair FormationRun x Plant: starting a run is gated by a state field that
          lives on neither the run nor its lot but on the PLANT, and that field is itself
          derived from a third entity (Worker.removal_status). Nothing about the run
          changes between the refusal and the success - only a worker's medical clearance
          on a different aggregate flips the gate, which is why RESTRICTED must be read
          live rather than snapshotted at scheduling time.
        test_recipe:
          setup:
            - "Plant, a lot in FORMATION with a SCHEDULED run, and one PRODUCTION worker removed by a BLOOD sample of 45.0 ug/dL so the plant sits at RESTRICTED."
            - "A later BLOOD sample of 15.0 ug/dL gives the clearance evidence the return-to-duty rule demands."
