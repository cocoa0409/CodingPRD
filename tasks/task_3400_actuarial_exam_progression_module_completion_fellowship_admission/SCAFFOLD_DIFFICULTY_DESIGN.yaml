              as: Registrar
              captures: { win_fm_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-B", credit_map: { "P": "P2", "FM": "FM2" } }
              as: Registrar
              captures: { syl2_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P2", title: "Probability (2026)", credit_hours: 10, syllabus_version_id: "${syl2_id}" }
              as: Registrar
              captures: { exam_p2_id: $.data.id }
