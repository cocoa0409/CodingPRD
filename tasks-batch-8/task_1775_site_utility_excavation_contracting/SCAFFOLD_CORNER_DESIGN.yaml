              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "GET /site-utility/projects/${p_id}/audit-events"
              payload: { entity_type: LocateTicket }
              as: SafetyOfficer
          assert:
            - "total_count == 2 (create + submit), both with entity_type == LocateTicket and entity_id == ${t_id}"
            - "first event action == 'POST /site-utility/locate-tickets' with actor_role == ProjectManager; second detail mentions 'DRAFT->SUBMITTED'"

      - name: response_envelope_shape
        claim_type: response_envelope
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Success and error envelopes follow §1.0 exactly: object responses carry meta.api_request_id/meta.api_request_timestamp/response_type/data; errors carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["Project P exists"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-ENV", contract_ref: "C-501", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /site-utility/projects/${p_id}"
              payload: {}
              as: Foreman
            - call: "GET /site-utility/projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Foreman
              captures: { err: $.data.error_id }
          assert:
            - "Success: meta.api_request_id non-empty, response_type == 'object', data holds the Project fields"
            - "Error: response_type == 'error', err == ERR_NOT_FOUND, data.message non-empty, http 404"

