            - "after both rejected creations GET /ca/misissuance-incidents?scope_profile_id=${profile_id} returns total_count == 1"
            - "the third trigger returns HTTP 409 and ${err_not_closeable} == ERR_INCIDENT_NOT_CLOSEABLE"
            - "the fourth trigger returns HTTP 409 and ${err_not_disclosed_revoke} == ERR_INCIDENT_NOT_DISCLOSED"
            - "the fifth trigger returns HTTP 409 and ${err_not_disclosed_comm} == ERR_INCIDENT_NOT_DISCLOSED, and GET /ca/misissuance-incidents/${inc_id}/communications returns total_count == 0"
