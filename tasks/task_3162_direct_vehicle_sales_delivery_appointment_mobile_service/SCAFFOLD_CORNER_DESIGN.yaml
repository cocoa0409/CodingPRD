            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - *c_disp
            - *c_arrive
            - *c_appt
            - *c_confirm
            - *c_complete
            - call: "POST /v1/vehicles/${veh_id}/diagnostic-reports"
              payload: { fault_code: "OTA-1001", severity: "LOW", is_driveable: true }
              as: ServiceTechnician
              captures: { rpt_one_id: $.data.id }
            - call: "POST /v1/vehicles/${veh_id}/diagnostic-reports"
              payload: { fault_code: "OTA-1001", severity: "LOW", is_driveable: true }
              as: ServiceTechnician
              captures: { rpt_repeat_id: $.data.id }
          trigger:
            - call: "POST /v1/service-appointments"
              payload: { vehicle_id: "${veh_id}", diagnostic_report_id: "${rpt_repeat_id}", service_center_id: "${ctr_id}", scheduled_start: "2026-09-28T14:00:00Z", scheduled_end: "2026-09-28T15:00:00Z" }
              as: ServiceTechnician
              captures: { error_id: $.data.error_id }
          assert:
            - "RemoteDiagnosticReport.${rpt_one_id}.triage_outcome == MOBILE_REQUIRED"
            - "RemoteDiagnosticReport.${rpt_repeat_id}.triage_outcome == NO_ACTION"
            - "the response status is 409 and error_id == ERR_TRIAGE_NO_SERVICE_REQUIRED"
            - "GET /v1/service-appointments?vehicle_id=${veh_id} returns 0 rows"
            - "Vehicle.${veh_id}.service_hold_state == NONE"

