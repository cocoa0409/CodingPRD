      - name: staffing_plan_rejected_to_draft_revision_cycle
        shape: cyclic
        grounds:
          - state_machines.StaffingPlan
          - state_machines.StaffingPlan.SUBMITTED_to_REJECTED
          - state_machines.StaffingPlan.REJECTED_to_DRAFT
          - entities.StaffingPlan.fields.revision_number
          - entities.StaffingPlan.fields.rejection_reason_code
        distinguishing_aspect: |
          Non-linearity on the StaffingPlan entity — a different entity from the
          LaneAssignment instance and a different kind of non-linearity: a CYCLIC backward
          edge REJECTED -> DRAFT that a linear machine forbids. Re-entering DRAFT is not a
          plain state assignment: revision_number increments, rejection_reason_code and
          submitted_at_utc are cleared and all nine computed cost fields are reset to null,
          so the second pass through SUBMITTED must recompute them from scratch.
        test_recipe:
          setup:
            - "a SUBMITTED plan for 2026-09-10 prepared by planner-1 with two assignments for officer Ada"
            - "the officer's regular cap of 45 minutes means the submitted plan carries 45 regular and 15 overtime minutes"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_curve_30
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - *k_eq_ai
            - *k_open_l1
            - *k_officer_ada
            - *k_band_1000
            - *k_band_1200
            - *k_flight_1030
            - *k_flight_1230
            - *k_forecast_band1
            - *k_forecast_band2
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
            - *k_asg_band2
            - *k_plan_submit
          trigger:
            - call: "POST /staffing-plans/${plan_id}/decision"
              payload: { decision: "REJECT", rejection_reason_code: "COST" }
              as: DutyManager
              as_user_id: "duty-1"
              captures: { rejected_state: $.data.state, rejected_reason: $.data.rejection_reason_code, rejected_rev: $.data.revision_number }
            - call: "POST /staffing-plans/${plan_id}/revise"
              payload: {}
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { revised_state: $.data.state, revised_rev: $.data.revision_number }
            - call: "POST /staffing-plans/${plan_id}/submit"
              payload: {}
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { resubmitted_state: $.data.state, resubmitted_rev: $.data.revision_number, resub_total: $.data.total_cost_cents }
          assert:
            - "${rejected_state} == REJECTED and ${rejected_reason} == COST and ${rejected_rev} == 1; the cost fields are retained on rejection (total_cost_cents == 7054) and no LaneAssignment changed state"
            - "${revised_state} == DRAFT and ${revised_rev} == 2 — the machine went backwards, which the linear path DRAFT -> SUBMITTED -> APPROVED cannot do"
            - "after revise StaffingPlan.${plan_id}.rejection_reason_code is null, submitted_at_utc is null, and planned_regular_minutes, planned_overtime_minutes, base_cost_cents, overtime_cost_cents, detail_cost_cents, subtotal_cents, admin_fee_rate, admin_fee_cents and total_cost_cents are all null"
            - "${resubmitted_state} == SUBMITTED and ${resubmitted_rev} == 2 — revision_number does NOT increment on submit, only on revise"
            - "${resub_total} == 7054 and StaffingPlan.${plan_id}.subtotal_cents == 6750 and admin_fee_rate == \"0.045\" and admin_fee_cents == 304 — recomputed from scratch after the reset (base 45*100 == 4500, overtime round_half_up(15*100*1.5) == 2250)"
            - "LaneAssignment.${asg1_id}.assignment_state == SCHEDULED and LaneAssignment.${asg2_id}.assignment_state == SCHEDULED throughout the reject/revise/resubmit loop"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: equipment_fault_to_escalation_depth_four
        depth: 4
        grounds:
          - state_machines.EquipmentUnit.SERVICEABLE_to_OUT_OF_SERVICE
          - state_machines.Lane.OPEN_to_PAUSED
          - state_machines.LaneAssignment.CHECKED_IN_to_REASSIGN_PENDING
          - state_machines.Checkpoint.NORMAL_to_ELEVATED
          - calculations.checkpoint_posture
          - endpoints.POST_equipment-units_report-state
        distinguishing_aspect: |
          Depth 4, triggered by an EQUIPMENT serviceability report — a completely different
          entry point from the plan-approval cascade. One request to
          POST /equipment-units/{id}/report-state touches four entity classes in a strict
          causal chain: unit state (link 1) causes the lane's derived equipment_state and its
          forced OPEN -> PAUSED (link 2), which causes the checked-in assignment to flip to
          REASSIGN_PENDING and the checkpoint's position ledger to unwind (link 3), which
          causes posture NORMAL -> ELEVATED and, because the last published standard wait was
          at the threshold, auto-raises a POSTURE_DEGRADATION EscalationTicket (link 4).
          Nothing in the request body mentions the lane, the assignment, the checkpoint or
          the ticket.
        test_recipe:
          setup:
            - "an ACTIVATED plan on OPEN standard lane L1 (required_officer_count 1) with officer Ada checked in at 10:00"
            - "one STANDARD wait observation of 870 seconds so the last publication is exactly at the 15-minute threshold, but consecutive_breach_count_standard is only 1 (no WAIT_THRESHOLD_BREACH ticket yet)"
            - "checkpoint posture NORMAL, available_lane_positions 5, open_lane_count 1"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_curve_30
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - *k_eq_ai
            - *k_open_l1
            - *k_officer_ada
            - *k_band_1000
            - *k_band_1200
            - *k_flight_1030
            - *k_flight_1230
            - *k_forecast_band1
            - *k_forecast_band2
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
            - *k_asg_band2
            - *k_plan_submit
            - *k_plan_approve
            - *k_plan_activate
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 870, measurement_method: "BLE_SENSOR", sample_size: 1 }
              as: DutyManager
              captures: { pre_snapshot: $.data.published_wait_minutes_snapshot }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { pre_posture: $.data.posture, pre_available: $.data.available_lane_positions, pre_open: $.data.open_lane_count, pre_breach: $.data.consecutive_breach_count_standard }
          trigger:
            - call: "POST /equipment-units/${eq_ai_id}/report-state"
              payload: { state: "OUT_OF_SERVICE", note: "AIT panel fault" }
              as: CheckpointManager
              captures: { unit_state: $.data.state }
          verify_calls:
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { lane_state_after: $.data.lane_state, lane_eq_after: $.data.equipment_state, lane_pause_reason: $.data.paused_reason_code }
            - call: "GET /lane-assignments/${asg1_id}"
              payload: {}
              as: CheckpointManager
              captures: { asg_state_after: $.data.assignment_state }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { post_posture: $.data.posture, post_available: $.data.available_lane_positions, post_open: $.data.open_lane_count }
            - call: "GET /escalation-tickets"
              payload: { checkpoint_id: "${cp_id}", state: "RAISED" }
              as: CheckpointManager
              captures: { ticket_reason: "$.data[0].trigger_reason", ticket_state: "$.data[0].state", ticket_scope: "$.data[0].lane_type_scope" }
          assert:
            - "before the trigger ${pre_snapshot} == 15, ${pre_breach} == 1, ${pre_posture} == NORMAL, ${pre_available} == 5, ${pre_open} == 1 and no EscalationTicket exists"
            - "LINK 1: ${unit_state} == OUT_OF_SERVICE and EquipmentUnit.${eq_ai_id}.last_state_note == \"AIT panel fault\""
            - "LINK 2: ${lane_eq_after} == OUT_OF_SERVICE, ${lane_state_after} == PAUSED and ${lane_pause_reason} == EQUIPMENT_FAULT — the request never named the lane"
            - "LINK 3: ${asg_state_after} == REASSIGN_PENDING while LaneAssignment.${asg1_id}.break_minutes_taken and break_state are unchanged, and ${post_available} == 6 with ${post_open} == 0"
            - "LINK 3: Officer.${off_id}.committed_duty_minutes == 60 — REASSIGN_PENDING still counts, so the position ledger moved but the duty ledger did not"
            - "LINK 4: ${post_posture} == ELEVATED and exactly one EscalationTicket exists with ${ticket_reason} == POSTURE_DEGRADATION, ${ticket_state} == RAISED, ${ticket_scope} == ALL and published_wait_minutes_at_raise == 15"
            - "${post_posture} != SURGE — open_escalation_count is 1, below SURGE_OPEN_ESCALATION_THRESHOLD of 2"
            - "the other two units EquipmentUnit.${eq_wtmd_id} and EquipmentUnit.${eq_xray_id} are still SERVICEABLE: only the required-type unit that was reported changed"

      - name: plan_approval_supersede_depth_three
        depth: 3
        grounds:
          - state_machines.StaffingPlan.SUBMITTED_to_APPROVED
          - state_machines.StaffingPlan.ACTIVATED_to_SUPERSEDED
          - state_machines.LaneAssignment.SCHEDULED_to_CANCELLED
          - state_machines.Officer.ON_DUTY_to_OFF_DUTY
          - entities.StaffingPlan.fields.superseded_by_staffing_plan_id
          - entities.Officer.fields.committed_duty_minutes
        distinguishing_aspect: |
          Depth 3, triggered by a PLAN APPROVAL DECISION rather than by an equipment report,
          and it cascades sideways across aggregates instead of down a physical hierarchy:
          approving plan B (link 1) supersedes the unrelated ACTIVATED plan A and stamps its
          superseded_by_staffing_plan_id, which retires plan A's assignments along two
          different edges depending on their current state (link 2: SCHEDULED -> CANCELLED,
          CHECKED_IN -> RELEASED), which drains Ada's committed_duty_minutes to zero and
          therefore transitions the Officer ON_DUTY -> OFF_DUTY (link 3).
        test_recipe:
          setup:
            - "plan A ACTIVATED for 2026-09-10, prepared by planner-1, with Ada SCHEDULED on bands 10:00 and 12:00; asg1 checked in at 10:00 so Ada is ON_DUTY with committed_duty_minutes 60"
            - "a second officer Bea and a third band at 14:00 that has been forecast"
            - "plan B SUBMITTED for the same checkpoint and the same operational_date, prepared by planner-2, staffing Bea on the 14:00 band"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_curve_30
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - *k_eq_ai
            - *k_open_l1
            - *k_officer_ada
            - *k_band_1000
            - *k_band_1200
            - *k_flight_1030
            - *k_flight_1230
            - *k_forecast_band1
            - *k_forecast_band2
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
            - *k_asg_band2
            - *k_plan_submit
            - *k_plan_approve
            - *k_plan_activate
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
            - call: "POST /officers"
              payload: { badge_number: "B-1002", full_name: "Bea Ridge", certifications: ["STANDARD_LANE"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off2_id: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T14:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { band3_id: $.data.id }
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA300", scheduled_departure_utc: "2026-09-10T14:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
            - call: "POST /time-bands/${band3_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: StaffingPlanner
              captures: { cp_v2: $.data.version }
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v2}" }
              as: StaffingPlanner
              as_user_id: "planner-2"
              captures: { plan_b_id: $.data.id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_b_id}", lane_id: "${lane_id}", officer_id: "${off2_id}", time_band_id: "${band3_id}" }
              as: StaffingPlanner
              as_user_id: "planner-2"
              captures: { asg_b1_id: $.data.id }
            - call: "POST /staffing-plans/${plan_b_id}/submit"
              payload: {}
              as: StaffingPlanner
              as_user_id: "planner-2"
          trigger:
            - call: "POST /staffing-plans/${plan_b_id}/decision"
              payload: { decision: "APPROVE" }
              as: DutyManager
              as_user_id: "duty-1"
              captures: { plan_b_state: $.data.state }
          verify_calls:
            - call: "GET /staffing-plans/${plan_id}"
              payload: {}
              as: StaffingPlanner
              captures: { plan_a_state: $.data.state, plan_a_super: $.data.superseded_by_staffing_plan_id }
            - call: "GET /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", assignment_state: "CANCELLED" }
              as: StaffingPlanner
              captures: { cancelled_row_state: "$.data[0].assignment_state" }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { ada_duty: $.data.duty_status, ada_committed: $.data.committed_duty_minutes }
          assert:
            - "LINK 1: ${plan_b_state} == APPROVED with approved_by_user_id == \"duty-1\"; ${plan_a_state} == SUPERSEDED and ${plan_a_super} == ${plan_b_id} — plan A was never named in the request"
            - "LINK 2: LaneAssignment.${asg1_id}.assignment_state == RELEASED with released_at_utc == 2026-09-10T10:00:00Z, and LaneAssignment.${asg2_id}.assignment_state == CANCELLED with ${cancelled_row_state} == CANCELLED — one causal link, two different target states chosen per row"
            - "LINK 3: ${ada_committed} == 0 and ${ada_duty} == OFF_DUTY — the officer transition is caused by the ledger reaching zero, which is itself caused by the assignment retirements"
            - "LaneAssignment.${asg_b1_id}.assignment_state == SCHEDULED and Officer.${off2_id}.committed_duty_minutes == 30 — the winning plan's own rows are untouched"
            - "StaffingPlan.${plan_b_id}.subtotal_cents == 3000 (30 regular minutes at 100 cents), admin_fee_rate == \"0.060\" because 3000 < 5000, admin_fee_cents == 180 and total_cost_cents == 3180"
            - "Checkpoint.${cp_id}.version > ${cp_v2} — the approval bumps the parent version, which is what makes a previously read expected_checkpoint_version stale"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: check_in_plan_not_activated_outranks_calibration_overdue
        categories: [state, business_safety]
        grounds:
          - validations.priority_12_ERR_PLAN_NOT_ACTIVATED
          - validations.priority_17_ERR_CALIBRATION_OVERDUE
          - endpoints.POST_lane-assignments_duty
        distinguishing_aspect: |
          Pairs the STATE category (priority 12) against the BUSINESS_SAFETY category
          (priority 17) on the duty endpoint. Both rules are violated by exactly the same
          request, and the ordering is counter-intuitive: an expired-calibration machine is
          the more alarming condition, yet the lifecycle check wins because it sits four
          priorities higher. The control leg proves the safety rule really is armed.
        test_recipe:
          setup:
            - "checkpoint T1 with standard lane L1 whose ADVANCED_IMAGING unit is calibrated only until 2026-09-10T09:00:00Z"
            - "the lane is opened at 08:00 while that calibration is still valid"
            - "a plan for 2026-09-10 that is APPROVED but deliberately NOT activated"
            - "the logical clock then advanced to 10:00, one hour past the calibration due instant"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_curve_30
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-9", calibration_due_utc: "2026-09-10T09:00:00Z" }
              as: CheckpointManager
              captures: { eq_ai_soon_id: $.data.id }
            - *k_open_l1
            - *k_officer_ada
            - *k_band_1000
            - *k_band_1200
            - *k_flight_1030
            - *k_flight_1230
            - *k_forecast_band1
            - *k_forecast_band2
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
            - *k_asg_band2
            - *k_plan_submit
            - *k_plan_approve
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              expect_status: 409
              captures: { both_violated_error: $.data.error_id }
            - call: "POST /staffing-plans/${plan_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: CheckpointManager
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              expect_status: 422
              captures: { safety_only_error: $.data.error_id }
          assert:
            - "${both_violated_error} == ERR_PLAN_NOT_ACTIVATED with HTTP 409 — priority 12 wins even though priority 17 is also violated by this exact request"
            - "${both_violated_error} != ERR_CALIBRATION_OVERDUE"
            - "after the failed first attempt LaneAssignment.${asg1_id}.assignment_state == SCHEDULED and checked_in_at_utc is null: the rejected request had no partial effect"
            - "${safety_only_error} == ERR_CALIBRATION_OVERDUE with HTTP 422 once the plan is ACTIVATED and only priority 17 remains violated — the lower-priority rule is genuinely armed, so the first assert is not a false positive"
            - "EquipmentUnit.${eq_ai_soon_id}.calibration_due_utc == 2026-09-10T09:00:00Z and state == SERVICEABLE: the unit was never faulted, only its calibration lapsed"
            - "Officer.${off_id}.duty_status == OFF_DUTY after both rejections"

      - name: assignment_certification_outranks_officer_double_booked
        categories: [business_safety, business_temporal]
        grounds:
          - validations.priority_15_ERR_OFFICER_NOT_CERTIFIED
          - validations.priority_22_ERR_OFFICER_DOUBLE_BOOKED
          - endpoints.POST_lane-assignments
        distinguishing_aspect: |
          A different error-category PAIR (business_safety versus business_temporal) on a
          different endpoint (POST /lane-assignments rather than the duty action). Here the
          two rules are only 7 priorities apart and both are business rules, so neither an
          "auth beats business" nor a "state beats business" shortcut resolves it: the
          implementation has to run the certification gate before the overlap scan.
        test_recipe:
          setup:
            - "checkpoint T1 with STANDARD lane L1 (max_concurrent_officers 2) and EXPEDITED lane L2 at position 2"
            - "officer Ada certified STANDARD_LANE + ADVANCED_IMAGING only (no EXPEDITED_LANE)"
            - "officer Bea certified STANDARD_LANE + EXPEDITED_LANE"
            - "a DRAFT plan in which both Ada and Bea already hold a live assignment on L1 for the 10:00 band"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_lane_l1
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "EXPEDITED", position_index: 2, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { lane_exp_id: $.data.id }
            - *k_officer_ada
            - call: "POST /officers"
              payload: { badge_number: "B-1003", full_name: "Bea Ridge", certifications: ["STANDARD_LANE", "EXPEDITED_LANE"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off_bea_id: $.data.id }
            - *k_band_1000
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_bea_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { asg_bea_id: $.data.id }
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_exp_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              expect_status: 422
              captures: { pair_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_exp_id}", officer_id: "${off_bea_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              expect_status: 409
              captures: { temporal_only_error: $.data.error_id }
          assert:
            - "${pair_error} == ERR_OFFICER_NOT_CERTIFIED with HTTP 422 — Ada lacks EXPEDITED_LANE (priority 15) AND is already booked on the 10:00 band (priority 22); the certification error is returned"
            - "${pair_error} != ERR_OFFICER_DOUBLE_BOOKED"
            - "${temporal_only_error} == ERR_OFFICER_DOUBLE_BOOKED with HTTP 409 — Bea IS certified for the expedited lane, so only priority 22 fires and the overlap rule is proven armed"
            - "Officer.${off_id}.committed_duty_minutes == 30 and Officer.${off_bea_id}.committed_duty_minutes == 30 — neither rejected write credited any minutes"
            - "LaneAssignment.${asg1_id}.assignment_state == SCHEDULED and LaneAssignment.${asg_bea_id}.assignment_state == SCHEDULED; a filtered GET /lane-assignments?lane_id=${lane_exp_id} returns an empty list"
            - "StaffingPlan.${plan_id}.subtotal_cents == 6000 and total_cost_cents == 6270 (two officers at 30 regular minutes each: base 3000 + 3000, tier 0.045, fee round_half_up(270.0) == 270)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: published_wait_breach_at_exact_threshold_on_observation_post
        metric: published_wait_minutes_vs_wait_threshold_minutes_standard
        endpoint: "POST /checkpoints/{checkpoint_id}/wait-observations"
        grounds:
          - calculations.published_wait_time
          - entities.WaitTimeObservation.fields.breached_threshold
          - entities.Checkpoint.fields.consecutive_breach_count_standard
          - entities.Checkpoint.fields.wait_threshold_minutes_standard
        distinguishing_aspect: |
          Boundary on the PUBLISHED-MINUTES metric, exercised through the observation POST.
          Two effects stack on a single second of input: 869 seconds rounds to 14 minutes and
          870 seconds rounds to 15 (round_half_up of 14.5, not banker's rounding down to 14),
          and 15 is then compared with >= against the 15-minute threshold, not with >. One
          second of sampled_wait_seconds separates not-breached from breached.
        test_recipe:
          setup:
            - "checkpoint T1 with wait_threshold_minutes_standard 15 and no observations yet"
            - "the logical clock at 2026-09-10T10:00:00Z"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 869, measurement_method: "BLE_SENSOR", sample_size: 1 }
              as: DutyManager
              captures: { below_minutes: $.data.published_wait_minutes_snapshot, below_breached: $.data.breached_threshold }
            - call: "GET /checkpoints/${cp_id}/wait-time"
              payload: { lane_type: "STANDARD" }
              as: DutyManager
              captures: { below_avg: $.data.weighted_average_seconds, below_flag: $.data.breached, below_threshold: $.data.threshold_minutes }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 870, measurement_method: "BLE_SENSOR", sample_size: 1 }
              as: DutyManager
              captures: { at_minutes: $.data.published_wait_minutes_snapshot, at_breached: $.data.breached_threshold }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: DutyManager
              captures: { breach_run: $.data.consecutive_breach_count_standard, posture_after: $.data.posture }
          assert:
            - "${below_minutes} == 14 and ${below_breached} == false — 869 / 60 == 14.4833 and round_half_up gives 14, one minute below the threshold"
            - "${below_avg} == \"869.00\" (two decimals, single-sample fallback because 1 < MIN_SAMPLES_FOR_WEIGHTED_AVERAGE) and ${below_flag} == false and ${below_threshold} == 15"
            - "after the first observation Checkpoint.${cp_id}.consecutive_breach_count_standard == 0"
            - "${at_minutes} == 15 and ${at_breached} == true — 870 / 60 == 14.5 exactly, round_half_up gives 15, and 15 >= 15 breaches on the inclusive comparison"
            - "${at_minutes} != 14 — truncation or banker's rounding of 14.5 would give 14 and would wrongly report no breach"
            - "${breach_run} == 1 and ${posture_after} == NORMAL — one breaching publication is below ESCALATION_BREACH_COUNT_REQUIRED (2), so no EscalationTicket is raised and posture does not move"
            - "GET /escalation-tickets?checkpoint_id=${cp_id} returns an empty list"

      - name: wait_time_window_inclusive_end_and_empty_window
        metric: publication_window_membership_and_sample_count
        endpoint: "GET /checkpoints/{checkpoint_id}/wait-time"
        grounds:
          - calculations.published_wait_time
          - calculations.published_wait_time.constants.PUBLICATION_WINDOW_MINUTES
          - endpoints.GET_checkpoints_wait-time
        distinguishing_aspect: |
          A different metric (window membership and sample_count, not published minutes) read
          through a different endpoint (the computed GET rather than the observation POST).
          The 20-minute publication window is INCLUSIVE at both ends, so an observation whose
          observed_at_utc equals current_utc - 20 minutes is still in scope; one logical
          minute later the same observation drops out and the whole computation must collapse
          to the empty-set branch with nulls rather than to zero.
        test_recipe:
          setup:
            - "checkpoint T1 with a single STANDARD observation of 600 seconds taken at exactly 2026-09-10T10:00:00Z"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 600, measurement_method: "MANUAL_TIMESTAMP", sample_size: 4 }
              as: DutyManager
              captures: { obs_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:20:00Z" }
              as: PlatformAdmin
            - call: "GET /checkpoints/${cp_id}/wait-time"
              payload: { lane_type: "STANDARD" }
              as: DutyManager
              captures: { edge_count: $.data.sample_count, edge_minutes: $.data.published_wait_minutes, edge_avg: $.data.weighted_average_seconds, edge_start: $.data.window_start_utc, edge_end: $.data.window_end_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:21:00Z" }
              as: PlatformAdmin
            - call: "GET /checkpoints/${cp_id}/wait-time"
              payload: { lane_type: "STANDARD" }
              as: DutyManager
              captures: { empty_count: $.data.sample_count, empty_minutes: $.data.published_wait_minutes, empty_avg: $.data.weighted_average_seconds, empty_breached: $.data.breached }
          assert:
            - "at clock 10:20 ${edge_count} == 1, ${edge_avg} == \"600.00\" and ${edge_minutes} == 10 — observed_at_utc 10:00 is exactly current_utc - PUBLICATION_WINDOW_MINUTES and the window is inclusive at that end"
            - "${edge_start} == 2026-09-10T10:00:00Z and ${edge_end} == 2026-09-10T10:20:00Z"
            - "at clock 10:21 ${empty_count} == 0, ${empty_minutes} is null, ${empty_avg} is null and ${empty_breached} == false — the empty window yields nulls, not 0 and not the stale 10"
            - "${empty_minutes} != 0 and ${empty_minutes} != 10 — a half-open window would already have dropped the sample at 10:20, and a stale cache would still report 10 at 10:21"
            - "WaitTimeObservation.${obs_id}.published_wait_minutes_snapshot == 10 and breached_threshold == false throughout: the immutable snapshot never changes as the window slides"
            - "the same read for lane_type EXPEDITED returns sample_count == 0 and published_wait_minutes null at both clocks — STANDARD and EXPEDITED are published independently"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lane_open_depends_on_equipment_unit_state_not_presence
        entity_pair: [Lane, EquipmentUnit]
        grounds:
          - validations.priority_16_ERR_LANE_EQUIPMENT_UNAVAILABLE
          - state_machines.Lane.CLOSED_to_OPEN
          - state_machines.EquipmentUnit
          - calculations.lane_requirement.constants.DEGRADED_EQUIPMENT_FACTOR
        distinguishing_aspect: |
          Entity pair (Lane, EquipmentUnit): the Lane's own transition is gated on the STATE
          of rows in a different entity that the request never mentions. The dependency is
          state-specific rather than existence-specific, which is what makes it non-trivial —
          the very same ADVANCED_IMAGING unit blocks the open while OUT_OF_SERVICE and permits
          it while DEGRADED, so an implementation that merely checks "a unit of each required
          type exists" passes the second leg and fails the first.
        test_recipe:
          setup:
            - "checkpoint T1 with total_lane_positions 6 and standard lane L1 requiring 1 officer"
            - "all three required units installed (WTMD, AT_XRAY, ADVANCED_IMAGING), each calibrated to 2027"
            - "the ADVANCED_IMAGING unit then reported OUT_OF_SERVICE while the lane is still CLOSED (so no pause cascade runs)"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - *k_eq_ai
            - call: "POST /equipment-units/${eq_ai_id}/report-state"
              payload: { state: "OUT_OF_SERVICE", note: "awaiting parts" }
              as: CheckpointManager
          trigger:
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              expect_status: 422
              captures: { blocked_error: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { blocked_available: $.data.available_lane_positions, blocked_open_count: $.data.open_lane_count, blocked_posture: $.data.posture }
            - call: "POST /equipment-units/${eq_ai_id}/report-state"
              payload: { state: "SERVICEABLE" }
              as: CheckpointManager
            - call: "POST /equipment-units/${eq_ai_id}/report-state"
              payload: { state: "DEGRADED" }
              as: CheckpointManager
              captures: { degraded_state: $.data.state }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { opened_state: $.data.lane_state, opened_eq: $.data.equipment_state }
          assert:
            - "${blocked_error} == ERR_LANE_EQUIPMENT_UNAVAILABLE with HTTP 422 — the request body was empty and named no unit, yet a sibling entity's state decided the outcome"
            - "Lane.${lane_id}.lane_state == CLOSED and equipment_state == OUT_OF_SERVICE after the rejected open"
            - "${blocked_available} == 6 and ${blocked_open_count} == 0 — the rejected open did not touch the position ledger"
            - "${blocked_posture} == ELEVATED — oos_lane_count reached 1 when the unit was faulted, which is a separate consequence of the same sibling state"
            - "${degraded_state} == DEGRADED and, after the SERVICEABLE hop, Checkpoint.${cp_id}.posture == NORMAL again"
            - "${opened_state} == OPEN and ${opened_eq} == DEGRADED with HTTP 200 — DEGRADED is permitted by priority 16 while OUT_OF_SERVICE is not, so the gate is on the unit's state and not on its existence"
            - "after the successful open Checkpoint.${cp_id}.available_lane_positions == 5 and open_lane_count == 1"

      - name: lane_close_depends_on_open_screening_referral_state
        entity_pair: [Lane, ScreeningReferral]
        grounds:
          - state_machines.Lane.OPEN_to_CLOSED
          - state_machines.ScreeningReferral.RAISED_to_WITHDRAWN
          - validations.priority_11_ERR_INVALID_STATE_TRANSITION
          - entities.Checkpoint.fields.secondary_slots_in_use
        distinguishing_aspect: |
          A different entity pair (Lane, ScreeningReferral) and the opposite direction of
          travel: here a lane cannot LEAVE service while a child referral is still live,
          whereas the equipment instance was about a lane not being able to ENTER service.
          The guard also depends on a live-set membership ({RAISED, IN_PROGRESS}) rather than
          on one row's state, so resolving the referral to a terminal outcome — not deleting
          it — is what unblocks the lane.
        test_recipe:
          setup:
            - "checkpoint T1 with secondary_slot_capacity 2 and OPEN standard lane L1"
            - "officer Ada (ScreeningOfficer) and officer Cal holding SUPERVISOR"
            - "Ada raises a RANDOM referral on L1, so it sits in state RAISED holding one secondary slot"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - *k_eq_ai
            - *k_open_l1
            - *k_officer_ada
            - call: "POST /officers"
              payload: { badge_number: "B-1004", full_name: "Cal Sharp", certifications: ["STANDARD_LANE", "SUPERVISOR", "ETD_RESOLUTION"], base_rate_cents_per_minute: 120, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off_cal_id: $.data.id }
            - call: "POST /screening-referrals"
              payload: { lane_id: "${lane_id}", referral_reason: "RANDOM", passenger_category: "ADULT", requires_private_screening: false }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              captures: { ref_id: $.data.id, ref_state: $.data.state }
          trigger:
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "CLOSED" }
              as: CheckpointManager
              expect_status: 409
              captures: { blocked_close_error: $.data.error_id }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { lane_still: $.data.lane_state }
            - call: "POST /screening-referrals/${ref_id}/resolve"
              payload: { outcome: "WITHDRAWN", resolution_note: "passenger re-screened at another lane" }
              as: SupervisoryOfficer
              as_user_id: "${off_cal_id}"
              captures: { ref_resolved: $.data.state, slot_held: $.data.secondary_slot_held }
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "CLOSED" }
              as: CheckpointManager
              captures: { lane_closed: $.data.lane_state }
          assert:
            - "${ref_state} == RAISED and Checkpoint.${cp_id}.secondary_slots_in_use == 1 immediately after the referral is raised"
            - "${blocked_close_error} == ERR_INVALID_STATE_TRANSITION with HTTP 409 — the OPEN -> CLOSED edge is guarded by a referral on a different entity that the stand-down body never names"
            - "${lane_still} == OPEN and Checkpoint.${cp_id}.available_lane_positions == 5 and open_lane_count == 1 after the rejected stand-down"
            - "${ref_resolved} == WITHDRAWN, ${slot_held} == false and Checkpoint.${cp_id}.secondary_slots_in_use == 0"
            - "Checkpoint.${cp_id}.cleared_referral_count == 0 and leo_referral_count == 0 and denied_entry_count == 0 — WITHDRAWN increments none of the three outcome counters, so the guard was lifted by a terminal state and not by a cleared screening"
            - "${lane_closed} == CLOSED with HTTP 200 and Checkpoint.${cp_id}.available_lane_positions == 6 and open_lane_count == 0"
            - "ScreeningReferral.${ref_id}.detecting_officer_id == ${off_id} and resolving_officer_id is null — WITHDRAWN never went through /begin, so no resolving officer was nominated"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: officer_band_overlap_half_open_with_conditional_rest_buffer
        resource_entity: Officer
        interval_semantics: half_open
        grounds:
          - validations.priority_22_ERR_OFFICER_DOUBLE_BOOKED
          - validations.priority_23_ERR_OFFICER_REST_BUFFER_REQUIRED
          - entities.TimeBand.fields.band_end_utc
          - calculations.officer_duty_ledger.constants.BAND_MINUTES
        distinguishing_aspect: |
          The contended resource is the OFFICER and the interval semantics are HALF-OPEN:
          [band_start_utc, band_end_utc). A band ending at 10:30 and a band starting at 10:30
          therefore do NOT contend, so back-to-back assignment is legal, while two assignments
          covering the identical interval on two different lanes do contend. Layered on top is
          a CONDITIONAL buffer that only arms once the contiguous run would exceed 60 minutes,
          so the third adjacent band is rejected while the second was accepted and a band
          starting 30 minutes later is accepted again.
        test_recipe:
          setup:
            - "checkpoint T1 with two STANDARD lanes: L1 at position 1 and L2 at position 2, each max_concurrent_officers 2"
            - "officer Ada certified STANDARD_LANE, weekly_regular_minutes_cap 45, weekly_overtime_minutes_cap 600"
            - "four 30-minute bands at 10:00, 10:30, 11:00 and 11:30 on 2026-09-10"
            - "a DRAFT plan in which Ada already holds the 10:00 band on L1"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_lane_l1
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 2, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 1 }
              as: CheckpointManager
              captures: { lane2_id: $.data.id }
            - *k_officer_ada
            - *k_band_1000
            - &k_band_1030
              call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:30:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { band_1030_id: $.data.id }
            - &k_band_1100
              call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T11:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { band_1100_id: $.data.id }
            - &k_band_1130
              call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T11:30:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { band_1130_id: $.data.id }
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${band_1030_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { adjacent_ok_state: $.data.assignment_state, adjacent_ok_id: $.data.id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane2_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              expect_status: 409
              captures: { identical_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane2_id}", officer_id: "${off_id}", time_band_id: "${band_1100_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              expect_status: 409
              captures: { buffer_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane2_id}", officer_id: "${off_id}", time_band_id: "${band_1130_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { after_gap_state: $.data.assignment_state }
          assert:
            - "${adjacent_ok_state} == SCHEDULED with HTTP 201 — the 10:00-10:30 band and the 10:30-11:00 band touch at 10:30 and, under half-open geometry, do not overlap"
            - "${identical_error} == ERR_OFFICER_DOUBLE_BOOKED with HTTP 409 — the second request covers the identical 10:00-10:30 interval on a different lane, which is a genuine overlap for the officer"
            - "${buffer_error} == ERR_OFFICER_REST_BUFFER_REQUIRED with HTTP 409 — adding 11:00-11:30 would extend Ada's contiguous run to 10:00-11:30, i.e. 90 minutes, strictly above MAX_CONSECUTIVE_ON_POSITION_MINUTES (60), and it starts 0 minutes after the run instead of the required 15"
            - "${buffer_error} != ERR_OFFICER_DOUBLE_BOOKED — 11:00-11:30 does not intersect anything Ada holds; only the buffer rule blocks it"
            - "${after_gap_state} == SCHEDULED with HTTP 201 — 11:30 is 30 minutes after the run ends at 11:00, clearing REST_BUFFER_MINUTES (15), so the buffer rule is conditional and not a blanket cap"
            - "Officer.${off_id}.committed_duty_minutes == 90 — exactly the three accepted rows at 30 minutes each; neither rejection credited minutes"
            - "GET /lane-assignments?officer_id=${off_id} returns exactly 3 rows and GET /lane-assignments?lane_id=${lane2_id} returns exactly 1 row"

      - name: lane_position_capacity_closed_interval_rejects_shared_endpoint
        resource_entity: Lane
        interval_semantics: closed_aggregate
        grounds:
          - validations.priority_25_ERR_LANE_POSITION_CAPACITY_EXCEEDED
          - entities.Lane.fields.max_concurrent_officers
          - entities.TimeBand.fields.band_start_utc
        distinguishing_aspect: |
          A different contended resource (the LANE's physical positions rather than the
          officer's time) and deliberately the OPPOSITE interval semantics: the lane side is
          CLOSED, [band_start_utc, band_end_utc], because two officers physically standing at
          the same position at 10:30 do contend for it. The fixture uses exactly the adjacency
          that the officer instance ACCEPTS — a 10:00-10:30 row and a 10:30-11:00 row — and
          requires it to be REJECTED here, so a single shared overlap helper cannot satisfy
          both instances. The check is also aggregate: each row is individually legal and only
          the collective breaches max_concurrent_officers.
        test_recipe:
          setup:
            - "checkpoint T1 with a single STANDARD lane L3 at position 3 whose max_concurrent_officers is 1"
            - "officers Ada and Bea, both certified STANDARD_LANE"
            - "bands at 10:00, 10:30 and 11:00 on 2026-09-10"
            - "a DRAFT plan in which Ada holds the 10:00 band on L3"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 3, required_officer_count: 1, max_concurrent_officers: 1, secondary_positions: 0 }
              as: CheckpointManager
              captures: { lane3_id: $.data.id }
            - *k_officer_ada
            - call: "POST /officers"
              payload: { badge_number: "B-1005", full_name: "Bea Ridge", certifications: ["STANDARD_LANE"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off_bea2_id: $.data.id }
            - *k_band_1000
            - *k_band_1030
            - *k_band_1100
            - *k_read_cp_version
            - *k_plan_create
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane3_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { l3_first_id: $.data.id }
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane3_id}", officer_id: "${off_bea2_id}", time_band_id: "${band_1030_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              expect_status: 409
              captures: { closed_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane3_id}", officer_id: "${off_bea2_id}", time_band_id: "${band_1100_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { disjoint_state: $.data.assignment_state }
          assert:
            - "${closed_error} == ERR_LANE_POSITION_CAPACITY_EXCEEDED with HTTP 409 — [10:00, 10:30] and [10:30, 11:00] share the instant 10:30, so under closed lane geometry two officers would be at the one position that L3 offers"
            - "${closed_error} != ERR_OFFICER_DOUBLE_BOOKED — Bea holds nothing else, so the officer overlap rule is not what fired; and the very same adjacency is accepted in officer_band_overlap_half_open_with_conditional_rest_buffer"
            - "${disjoint_state} == SCHEDULED with HTTP 201 — [11:00, 11:30] does not touch [10:00, 10:30] at any instant, so the closed geometry permits it"
            - "Officer.${off_bea2_id}.committed_duty_minutes == 30 and Officer.${off_id}.committed_duty_minutes == 30"
            - "LaneAssignment.${l3_first_id}.assignment_state == SCHEDULED and GET /lane-assignments?lane_id=${lane3_id} returns exactly 2 rows"
            - "the rejection is aggregate, not per-row: on its own the 10:30 row is legal, as shown by the same officer and band succeeding on a lane with max_concurrent_officers 2 in the officer instance"
            - "StaffingPlan.${plan_id}.planned_regular_minutes == 60 and subtotal_cents == 6000 — only the two accepted rows contribute"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: officer_duty_minute_conservation_across_detail_approve_and_cancel
        conserved_quantity: Officer.committed_duty_minutes
        grounds:
          - entities.Officer.fields.committed_duty_minutes
          - entities.Officer.fields.approved_detail_minutes
          - state_machines.SurgeDetail.REQUESTED_to_APPROVED
          - state_machines.SurgeDetail.APPROVED_to_CANCELLED
          - calculations.staffing_plan_cost
          - concurrency_rules.surge-detail-create-stale-officer
        distinguishing_aspect: |
          The conserved quantity is the officer MINUTE LEDGER
          (committed_duty_minutes / approved_detail_minutes) plus every money field the ledger
          feeds. Approving a surge detail credits 30 minutes and pushes the plan across a
          rounding-sensitive fee computation; cancelling it must restore the pre-approval
          integers EXACTLY — including admin_fee_cents, which is round_half_up of a value
          ending in .75 on both sides, so an implementation that recomputes the fee from a
          stale subtotal or that only subtracts the fee delta lands one cent off.
        test_recipe:
          setup:
            - "an ACTIVATED plan on 2026-09-10 with Ada holding two 30-minute bands, so committed_duty_minutes == 60"
            - "plan money at rest: base 4500, overtime 2250, detail 0, subtotal 6750, rate 0.045, fee 304, total 7054"
            - "the officer's current version read immediately before the detail request"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_curve_30
            - *k_lane_l1
            - *k_eq_wtmd
            - *k_eq_xray
            - *k_eq_ai
            - *k_open_l1
            - *k_officer_ada
            - *k_band_1000
            - *k_band_1200
            - *k_flight_1030
            - *k_flight_1230
            - *k_forecast_band1
            - *k_forecast_band2
            - *k_read_cp_version
            - *k_plan_create
            - *k_asg_band1
            - *k_asg_band2
            - *k_plan_submit
            - *k_plan_approve
            - *k_plan_activate
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { off_v: $.data.version, committed_before: $.data.committed_duty_minutes, detail_minutes_before: $.data.approved_detail_minutes }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { sub_before: $.data.subtotal_cents, fee_before: $.data.admin_fee_cents, total_before: $.data.total_cost_cents }
          trigger:
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "SPORTING_EVENT", window_start_utc: "2026-09-10T14:00:00Z", detail_minutes: 30, expected_officer_version: "${off_v}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { detail_id: $.data.id, detail_state_new: $.data.state, detail_cost_new: $.data.detail_cost_cents }
            - call: "POST /surge-details/${detail_id}/decision"
              payload: { decision: "APPROVE" }
              as: DutyManager
              as_user_id: "duty-1"
              captures: { detail_state_appr: $.data.state, detail_cost_appr: $.data.detail_cost_cents }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { sub_appr: $.data.subtotal_cents, rate_appr: $.data.admin_fee_rate, fee_appr: $.data.admin_fee_cents, total_appr: $.data.total_cost_cents, detail_appr: $.data.detail_cost_cents }
            - call: "POST /surge-details/${detail_id}/cancel"
              payload: {}
              as: DutyManager
              as_user_id: "duty-1"
              captures: { detail_state_canc: $.data.state, detail_cost_canc: $.data.detail_cost_cents }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { committed_after: $.data.committed_duty_minutes, detail_minutes_after: $.data.approved_detail_minutes }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { sub_after: $.data.subtotal_cents, rate_after: $.data.admin_fee_rate, fee_after: $.data.admin_fee_cents, total_after: $.data.total_cost_cents, detail_after: $.data.detail_cost_cents }
          assert:
            - "${committed_before} == 60, ${detail_minutes_before} == 0, ${sub_before} == 6750, ${fee_before} == 304 and ${total_before} == 7054"
            - "${detail_state_new} == REQUESTED and ${detail_cost_new} is null — a REQUESTED detail moves neither ledger, and Officer.${off_id}.committed_duty_minutes is still 60 at this point"
            - "FORWARD LEG: ${detail_state_appr} == APPROVED, ${detail_cost_appr} == 3000, Officer.${off_id}.committed_duty_minutes == 90 and approved_detail_minutes == 30"
            - "FORWARD LEG money: ${detail_appr} == 3000, ${sub_appr} == 9750, ${rate_appr} == \"0.045\", ${fee_appr} == 439 (round_half_up(438.75)) and ${total_appr} == 10189"
            - "COMPENSATING LEG: ${detail_state_canc} == CANCELLED, ${detail_cost_canc} is null and cancelled_at_utc is stamped"
            - "${committed_after} == 60 and ${committed_after} == ${committed_before}; ${detail_minutes_after} == 0 and ${detail_minutes_after} == ${detail_minutes_before} — exact restoration, not approximate"
            - "${detail_after} == 0, ${sub_after} == 6750, ${rate_after} == \"0.045\", ${fee_after} == 304 (round_half_up(303.75)) and ${total_after} == 7054"
            - "${fee_after} == ${fee_before} and ${total_after} == ${total_before} — zero drift; subtracting the fee delta (439 - 304 == 135) from a recomputed total instead of recomputing the fee from the restored subtotal leaves the total one or more cents wrong"
            - "LaneAssignment.${asg1_id}.planned_minutes == 30 and LaneAssignment.${asg2_id}.planned_minutes == 30 are unchanged throughout: only the detail leg moved"
            - "Officer.${off_id}.version is strictly greater after the cancel than ${off_v} — the create, the decision and the cancel each bump it, which is exactly why the OCC field pins the requester's read"

      - name: lane_position_conservation_across_open_and_stand_down
        conserved_quantity: Checkpoint.available_lane_positions
        grounds:
          - entities.Checkpoint.fields.available_lane_positions
          - entities.Checkpoint.fields.open_lane_count
          - state_machines.Lane.CLOSED_to_OPEN
          - state_machines.Lane.OPEN_to_PAUSED
          - validations.priority_26_ERR_LANE_POSITIONS_EXHAUSTED
        distinguishing_aspect: |
          A different conserved quantity in a different domain: the checkpoint's PHYSICAL
          POSITION LEDGER, available_lane_positions, rather than an officer's minutes or any
          money field. The invariant
          available_lane_positions + SUM(required_officer_count of OPEN lanes) == total_lane_positions
          must hold after every single write, and the reserved positions vary per lane (2 and
          3), so a naive plus/minus-one counter drifts immediately. The exhaustion error also
          proves the ledger is actually consulted rather than merely reported.
        test_recipe:
          setup:
            - "checkpoint T1 with total_lane_positions 6"
            - "lane LA at position 1 requiring 2 officers, lane LB at position 2 requiring 3, lane LC at position 4 requiring 2 — all three fully equipped and in calibration"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 2, max_concurrent_officers: 2, secondary_positions: 1 }
              as: CheckpointManager
              captures: { lane_a_id: $.data.id }
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 2, required_officer_count: 3, max_concurrent_officers: 3, secondary_positions: 1 }
              as: CheckpointManager
              captures: { lane_b_id: $.data.id }
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 4, required_officer_count: 2, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { lane_c_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_a_id}", equipment_type: "WTMD", serial_number: "WT-A", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_a_id}", equipment_type: "AT_XRAY", serial_number: "XR-A", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_a_id}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-A", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_b_id}", equipment_type: "WTMD", serial_number: "WT-B", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_b_id}", equipment_type: "AT_XRAY", serial_number: "XR-B", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_b_id}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-B", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_c_id}", equipment_type: "WTMD", serial_number: "WT-C", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_c_id}", equipment_type: "AT_XRAY", serial_number: "XR-C", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${lane_c_id}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-C", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
          trigger:
            - call: "POST /lanes/${lane_a_id}/open"
              payload: {}
              as: CheckpointManager
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { avail_1: $.data.available_lane_positions, open_1: $.data.open_lane_count }
            - call: "POST /lanes/${lane_b_id}/open"
              payload: {}
              as: CheckpointManager
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { avail_2: $.data.available_lane_positions, open_2: $.data.open_lane_count }
            - call: "POST /lanes/${lane_c_id}/open"
              payload: {}
              as: CheckpointManager
              expect_status: 409
              captures: { exhausted_error: $.data.error_id }
            - call: "POST /lanes/${lane_a_id}/stand-down"
              payload: { target_state: "PAUSED", paused_reason_code: "STAFF_SHORTFALL" }
              as: CheckpointManager
              captures: { paused_a: $.data.lane_state }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { avail_3: $.data.available_lane_positions, open_3: $.data.open_lane_count }
            - call: "POST /lanes/${lane_b_id}/stand-down"
              payload: { target_state: "PAUSED", paused_reason_code: "STAFF_SHORTFALL" }
              as: CheckpointManager
              captures: { paused_b: $.data.lane_state }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { avail_4: $.data.available_lane_positions, open_4: $.data.open_lane_count }
          assert:
            - "before any open Checkpoint.${cp_id}.available_lane_positions == 6 and open_lane_count == 0 — creating three lanes reserves nothing"
            - "FORWARD LEG 1: ${avail_1} == 4 and ${open_1} == 1 — LA reserved its own required_officer_count of 2, not 1"
            - "FORWARD LEG 2: ${avail_2} == 1 and ${open_2} == 2 — LB reserved 3 more, and 1 + (2 + 3) == 6 == total_lane_positions"
            - "${exhausted_error} == ERR_LANE_POSITIONS_EXHAUSTED with HTTP 409 — LC needs 2 positions and only 1 remains, so the ledger is consulted and not merely reported"
            - "after the rejected open Lane.${lane_c_id}.lane_state == CLOSED and available_lane_positions is still 1: the failed write left the conserved quantity untouched"
            - "COMPENSATING LEG 1: ${paused_a} == PAUSED, ${avail_3} == 3 and ${open_3} == 1 — exactly the 2 LA had taken came back"
            - "COMPENSATING LEG 2: ${paused_b} == PAUSED, ${avail_4} == 6 and ${open_4} == 0 — the ledger returns to its initial value with zero drift"
            - "${avail_4} == 6 and Checkpoint.${cp_id}.total_lane_positions == 6, and the invariant available_lane_positions + SUM(required_officer_count over OPEN lanes) == 6 holds at every one of the four reads (6+0, 4+2, 1+5, 3+3, 6+0)"
            - "Lane.${lane_a_id}.paused_reason_code == STAFF_SHORTFALL and opened_at_utc is retained — pausing does not erase the open history"
