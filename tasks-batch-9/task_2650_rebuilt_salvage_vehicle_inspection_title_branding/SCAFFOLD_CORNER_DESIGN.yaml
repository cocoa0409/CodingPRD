          - calculations.damage_threshold_evaluation
        distinguishing_aspect: "Priority 79 only bites when the vehicle's brand is FLOOD: with flood_water_depth_cm 60 above FLOOD_DEPTH_BRAND_CM 46 the title brands FLOOD, and scheduling at a station whose supports_flood is false returns ERR_STATION_NOT_FLOOD_CAPABLE (409) even though the bay and the inspector are both free."
        test_recipe:
          setup:
            - "a TRAILER whose insurer report is a FLOOD loss at 60 cm water depth, so the title brands FLOOD"
            - "a funded rebuilder, a DOCS_ACCEPTED application, a free inspector and a station created with supports_flood false"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007305", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
