      - name: fruit_lot_cold_chain_and_disposition_dimensions_advance_independently
        grounds:
          - state_machines.FruitLot.PACKED_to_COOLING
          - state_machines.FruitLot.COOLING_to_COOLED
          - state_machines.FruitLot.UNCOMMITTED_to_RESERVED
          - state_machines.FruitLot.RESERVED_to_DELIVERED
          - entities.FruitLot.fields.cold_chain_status
          - entities.FruitLot.fields.disposition_status
        distinguishing_aspect: |
          PARALLEL shape: the same FruitLot row carries two state fields that
          move on different triggers — an allocation drives
          disposition_status UNCOMMITTED -> RESERVED while cold_chain_status is
          still COOLING, and the later complete-cooling call drives
          cold_chain_status COOLING -> COOLED while disposition_status stays
