  # ===========================================================================
  - section: validations
    instances:
      - name: c_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role fails auth before any other check, even for a read."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /workload-terms", captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"]

      - name: c_duplicate_term_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_TERM_CODE]", "entities.WorkloadTerm.fields.term_code"]
        distinguishing_aspect: "term_code uniqueness is global; the second create with 2026-FA fails 409."
        test_recipe:
          setup: ["one term 2026-FA"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair }
          trigger:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall Again", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 100000 }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_DUPLICATE_TERM_CODE (http 409)"]

      - name: c_duplicate_faculty_email_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_FACULTY_EMAIL]", "entities.FacultyMember.fields.email"]
        distinguishing_aspect: "Faculty email uniqueness; second create with the same email fails 409."
        test_recipe:
          setup: ["one faculty anna@x.edu"]
          setup_api_calls:
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "LECTURER", base_salary_cents: 7000000 }, as: DepartmentChair }
          trigger:
            - { call: "POST /faculty-members", payload: { full_name: "Anna Clone", email: "anna@x.edu", rank: "ADJUNCT", base_salary_cents: 5000000 }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_DUPLICATE_FACULTY_EMAIL (http 409)"]

      - name: c_duplicate_section_number_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_SECTION]", "entities.CourseSection.fields.section_number"]
        distinguishing_aspect: "section_number is unique per (term_id, course_id); reusing 01 for the same course+term fails 409 (a DIFFERENT course may reuse it — not shown here)."
        test_recipe:
          setup: ["Term OPEN; CS-301; section 01 exists"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair }
          trigger:
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "ONLINE", meeting_day: "TUE", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_DUPLICATE_SECTION (http 409)"]

      - name: c_duplicate_active_qualification_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_QUALIFICATION]"]
        distinguishing_aspect: "At most one ACTIVE qualification per (faculty, course); a second create fails 409."
        test_recipe:
          setup: ["Anna qualified for CS-301 (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
