# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1532_historical_society_local_archive
# Breadth probe over every testable claim of SCAFFOLD.yaml §1.1–§1.7 that §1.8
# does not already cover. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: entity_creation_defaults_applied
        claim_type: defaults
        grounds:
          - entities.StorageZone.fields.temp_high_c
          - entities.DeedOfGift.fields.reproduction_restricted
          - entities.VolunteerProject.fields.max_hours_per_volunteer
          - entities.ReadingRoomAppointment.fields.seats
        distinguishing_aspect: "Omitted optional inputs take their declared defaults: zone thresholds 24.0/14.0/60.0/30.0, deed flags false, project cap 40, appointment seats 1."
        test_recipe:
          setup: ["Registrar/Coordinator act; clock default"]
          setup_api_calls:
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
          trigger:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { th: $.data.temp_high_c, tl: $.data.temp_low_c, hh: $.data.humidity_high_pct, hl: $.data.humidity_low_pct, post: $.data.posture } }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { rr: $.data.reproduction_restricted, pl: $.data.publication_license_required, dv: $.data.deed_version } }
            - { call: "POST /volunteer-projects", payload: { name: "P1" }, as: VolunteerCoordinator, captures: { cap: $.data.max_hours_per_volunteer, pst: $.data.status } }
          assert:
            - "zone defaults: temp_high_c == 24.0 (${th}), temp_low_c == 14.0 (${tl}), humidity_high_pct == 60.0 (${hh}), humidity_low_pct == 30.0 (${hl}), posture == OPEN (${post})"
            - "deed defaults: reproduction_restricted == false (${rr}), publication_license_required == false (${pl}), deed_version == 1 (${dv})"
            - "project defaults: max_hours_per_volunteer == 40 (${cap}), status == PLANNED (${pst})"

      - name: computed_and_system_fields_server_controlled
        claim_type: computed_fields
        grounds:
          - entities.Accession.fields.accession_number
          - entities.Collection.fields.item_count
          - entities.Researcher.fields.no_show_strikes
        distinguishing_aspect: "Computed/system fields are server-derived: accession_number mints from the logical clock year + per-year sequence; item_count tracks live items; client-supplied id/version on create are ignored (server id wins, version starts 1)."
        test_recipe:
          setup: ["empty DB; clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id, an: $.data.accession_number } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i1: $.data.id } }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I2" }, as: Archivist }
          trigger:
            - { call: "GET /collections/${c}", as: Registrar, captures: { ic: $.data.item_count, pf: $.data.published_finding_aid_present } }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { ns: $.data.no_show_strikes, tc: $.data.total_charged_cents, rst: $.data.status } }
          assert:
            - "Accession.${a}.accession_number == '2026-001' (${an}) — clock year 2026, first accession of the year"
            - "Collection.${c}.item_count == 2 (${ic}) after two item creates; published_finding_aid_present == false (${pf})"
            - "Researcher initialized: no_show_strikes == 0 (${ns}), total_charged_cents == 0 (${tc}), status == ACTIVE (${rst})"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.StorageZone
        distinguishing_aspect: "Client-supplied id/version/created_at in a create body are ignored; the server mints its own id and sets version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A", id: "11111111-2222-3333-4444-555555555555", version: 99, created_at: "1999-01-01T00:00:00Z" }, as: Registrar, captures: { zid: $.data.id, zv: $.data.version } }
          assert:
            - "returned id != '11111111-2222-3333-4444-555555555555' (${zid} is server-minted)"
            - "returned version == 1 (${zv}) — client version 99 ignored"

      - name: collection_hierarchy_reverse_view
        claim_type: parent_relationships
        grounds:
          - entities.Collection.fields.parent_collection_id
        distinguishing_aspect: "Self-referential hierarchy: GET /collections?parent_collection_id=<id> lists exactly that collection's children."
        test_recipe:
          setup: ["zone Z; parent collection P; two children C1 C2 under P; one unrelated collection U"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Parent", collection_code: "P", storage_zone_id: "${z}" }, as: Registrar, captures: { p: $.data.id } }
            - { call: "POST /collections", payload: { title: "Child1", collection_code: "C1", storage_zone_id: "${z}", parent_collection_id: "${p}" }, as: Registrar, captures: { c1: $.data.id } }
            - { call: "POST /collections", payload: { title: "Child2", collection_code: "C2", storage_zone_id: "${z}", parent_collection_id: "${p}" }, as: Registrar, captures: { c2: $.data.id } }
            - { call: "POST /collections", payload: { title: "Unrelated", collection_code: "U", storage_zone_id: "${z}" }, as: Registrar }
          trigger:
            - { call: "GET /collections", payload: { parent_collection_id: "${p}" }, as: Registrar, captures: { n: $.data } }
          assert:
            - "filtered list returns exactly [${c1}, ${c2}] (total_count == 2); U not included"

      - name: collection_parent_cycle_rejected
        claim_type: type_constraints
        grounds:
          - entities.Collection.fields.parent_collection_id
          - errors[ERR_COLLECTION_CYCLE]
        distinguishing_aspect: "Re-parenting a collection under its own descendant (or itself) is rejected with ERR_COLLECTION_CYCLE; a legal re-parent succeeds."
        test_recipe:
          setup: ["P -> C1 -> C2 chain (C2 child of C1, C1 child of P); third root R"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "P", collection_code: "P", storage_zone_id: "${z}" }, as: Registrar, captures: { p: $.data.id } }
            - { call: "POST /collections", payload: { title: "C1", collection_code: "C1", storage_zone_id: "${z}", parent_collection_id: "${p}" }, as: Registrar, captures: { c1: $.data.id } }
            - { call: "POST /collections", payload: { title: "C2", collection_code: "C2", storage_zone_id: "${z}", parent_collection_id: "${c1}" }, as: Registrar, captures: { c2: $.data.id } }
            - { call: "POST /collections", payload: { title: "R", collection_code: "R", storage_zone_id: "${z}" }, as: Registrar, captures: { r: $.data.id } }
          trigger:
            - { call: "PATCH /collections/${c1}", payload: { parent_collection_id: "${c2}" }, as: Registrar, captures: { e1: $.data.error_id } }
            - { call: "PATCH /collections/${c1}", payload: { parent_collection_id: "${c1}" }, as: Registrar, captures: { e2: $.data.error_id } }
            - { call: "PATCH /collections/${c1}", payload: { parent_collection_id: "${r}" }, as: Registrar, captures: { np: $.data.parent_collection_id } }
          assert:
            - "re-parent under descendant C2: error_id == ERR_COLLECTION_CYCLE (${e1})"
            - "re-parent under self: error_id == ERR_COLLECTION_CYCLE (${e2})"
            - "re-parent under unrelated root R: succeeds, parent_collection_id == ${r} (${np})"

      - name: enum_rejection_on_catalog
        claim_type: type_constraints
        grounds:
          - entities.Item.fields.condition_grade
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An out-of-enum condition_grade on /catalog fails with ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["Item I PENDING_CATALOG under ACCESSIONED accession"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i: $.data.id } }
          trigger:
            - { call: "POST /items/${i}/catalog", payload: { description: "x", condition_grade: "TERRIBLE", appraised_value_cents: 100, format: "MAP" }, as: Archivist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${err}); Item.${i}.status stays PENDING_CATALOG"

      - name: get_nonexistent_resource_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Missing ids yield ERR_NOT_FOUND at top level and nested paths (left-to-right: the missing parent segment fails first)."
        test_recipe:
          setup: ["one accession A exists"]
          setup_api_calls:
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
          trigger:
            - { call: "GET /collections/99999999-9999-4999-8999-999999999999", as: Registrar, captures: { e1: $.data.error_id } }
            - { call: "GET /accessions/99999999-9999-4999-8999-999999999999/deeds", as: Registrar, captures: { e2: $.data.error_id } }
            - { call: "GET /accessions/${a}/deeds", as: Registrar }
          assert:
            - "missing collection: error_id == ERR_NOT_FOUND (${e1}), http 404"
            - "missing parent on nested list: error_id == ERR_NOT_FOUND (${e2})"
            - "existing parent nested list: 200 with empty data array"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: accession_happy_path_and_numbering
        claim_type: valid_transition
        grounds:
          - state_machines.Accession
          - entities.Accession.fields.accession_number
        distinguishing_aspect: "DRAFT initial state, submit and deed-execute transitions move the accession to ACCESSIONED with current_deed_id set."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id, s0: $.data.status } }
          trigger:
            - { call: "POST /accessions/${a}/submit", as: Registrar, captures: { s1: $.data.status } }
            - { call: "POST /accessions/${a}/deeds", payload: { required_citation_text: "Courtesy of the County Historical Society" }, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar, captures: { ds: $.data.status } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { s2: $.data.status, cd: $.data.current_deed_id } }
          assert:
            - "initial state DRAFT (${s0}); after submit PENDING_DEED (${s1})"
            - "after execute: deed EXECUTED (${ds}); accession ACCESSIONED (${s2}); current_deed_id == ${d} (${cd})"

      - name: accession_amendment_cycle_supersedes_deed
        claim_type: side_effect_execution
        grounds:
          - state_machines.Accession
          - state_machines.DeedOfGift
          - errors[ERR_ACCESSION_NOT_ACCESSIONED]
        distinguishing_aspect: "The amendment cycle ACCESSIONED -> AMENDMENT_PENDING -> ACCESSIONED supersedes the old EXECUTED deed, repoints current_deed_id, and while AMENDMENT_PENDING blocks item creation with ERR_ACCESSION_NOT_ACCESSIONED."
        test_recipe:
          setup: ["Accession ACCESSIONED with deed D1 EXECUTED"]
          setup_api_calls:
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: { required_citation_text: "Citation A" }, as: Registrar, captures: { d1: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d1}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /accessions/${a}/amend", as: Registrar, captures: { am: $.data.status } }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { err: $.data.error_id } }
            - { call: "POST /accessions/${a}/deeds", payload: { required_citation_text: "Citation B" }, as: Registrar, captures: { d2: $.data.id, dv2: $.data.deed_version } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av2: $.data.version } }
            - { call: "POST /deeds/${d2}/execute", payload: { expected_accession_version: "${av2}" }, as: Registrar }
            - { call: "GET /accessions/${a}/deeds", as: Registrar, captures: { deeds: $.data } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { s2: $.data.status, cd2: $.data.current_deed_id } }
          assert:
            - "amend moves accession to AMENDMENT_PENDING (${am})"
            - "item create during AMENDMENT_PENDING: error_id == ERR_ACCESSION_NOT_ACCESSIONED (${err})"
            - "second deed has deed_version == 2 (${dv2})"
            - "after executing D2: accession ACCESSIONED (${s2}), current_deed_id == ${d2} (${cd2})"
            - "D1 status == SUPERSEDED in the deeds list; exactly one EXECUTED deed per accession at all times"

      - name: terminal_state_lockdowns
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DeedOfGift
          - state_machines.ReadingRoomAppointment
          - state_machines.Accession
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Terminal states reject every trigger: a VOIDED deed cannot execute; a COMPLETED appointment cannot be cancelled; an ACCESSIONED accession cannot withdraw (WITHDRAWN only from DRAFT/PENDING_DEED)."
        test_recipe:
          setup: ["Accession ACCESSIONED with D1 EXECUTED and D2 VOIDED; appointment APPT driven CONFIRMED -> CHECKED_IN -> COMPLETED"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d1: $.data.id } }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d2: $.data.id } }
            - { call: "POST /deeds/${d2}/void", as: Registrar, captures: { dv: $.data.status } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d1}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "x", condition_grade: "GOOD", appraised_value_cents: 100, format: "MAP" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "t", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq}", room_code: "MAP_ROOM", scheduled_date: "2026-08-10", start_time: "10:00", end_time: "11:00" }, as: Researcher, as_user_id: "${r}", captures: { ap: $.data.id, seats: $.data.seats } }
            - { call: "POST /reading-room-appointments/${ap}/check-in", as: ReadingRoomStaff }
            - { call: "POST /reading-room-appointments/${ap}/complete", as: ReadingRoomStaff, captures: { done: $.data.status } }
          trigger:
            - { call: "POST /deeds/${d2}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar, captures: { e1: $.data.error_id } }
            - { call: "POST /reading-room-appointments/${ap}/cancel", as: Researcher, as_user_id: "${r}", captures: { e2: $.data.error_id } }
            - { call: "POST /accessions/${a}/withdraw", as: Registrar, captures: { e3: $.data.error_id } }
          assert:
            - "voided deed execute: error_id == ERR_INVALID_STATE (${e1})"
            - "completed appointment cancel: error_id == ERR_INVALID_STATE (${e2})"
            - "accessioned accession withdraw: error_id == ERR_INVALID_STATE (${e3})"
            - "appointment seats default applied: seats == 1 (${seats}); final status COMPLETED (${done})"

      - name: invalid_from_transitions_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.FindingAid
          - state_machines.ReadingRoomAppointment
          - state_machines.DeaccessionProposal
        distinguishing_aspect: "Triggers from a state where they are not declared fail: publish a DRAFT finding aid, record-no-show twice on one appointment, approve a DRAFT proposal."
        test_recipe:
          setup: ["FindingAid FA in DRAFT; proposal P in DRAFT; appointment APPT already NO_SHOW"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /deaccession-proposals", payload: { item_ids: ["${i}"], justification: "dup", disposal_method: "DESTRUCTION" }, as: Registrar, as_user_id: "reg_1", captures: { p: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "x", condition_grade: "GOOD", appraised_value_cents: 100, format: "MAP" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "t", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq}", room_code: "MAIN", scheduled_date: "2026-08-02", start_time: "10:00", end_time: "11:00" }, as: Researcher, as_user_id: "${r}", captures: { ap: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reading-room-appointments/${ap}/record-no-show", as: ReadingRoomStaff }
          trigger:
