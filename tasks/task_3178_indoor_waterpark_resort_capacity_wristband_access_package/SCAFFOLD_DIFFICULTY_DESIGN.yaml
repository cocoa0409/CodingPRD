          trigger:
            - call: "POST /resorts/${r15_id}/cabana-bookings"
              payload: { cabana_id: "${cab15_id}", group_booking_id: "${gb15_id}", service_date: "2026-09-03", start_minute: 660, end_minute: 720, member_units: 1, expected_cabana_version: "${cab15_v} - 1" }
              as: Group
