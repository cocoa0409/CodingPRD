# =============================================================================
# Task 2213 — Affiliate Homeownership Program & Sweat Equity
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Depth index: every §0.5 Difficulty Rule the scaffold claims, cross-referenced
# into §1.1–§1.7 of SCAFFOLD.yaml, with worked-example instances whose numbers
# were executed against the declared formulas before being written down.
#
# Fixture conventions used by every chain below:
#   * logical clock starts at 2026-08-01T00:00:00.000Z on a fresh service
#   * opaque-role X-User-IDs are fixed literals: admin-1, fsc-1, officer-1,
#     officer-2, cm-1, committee-alice, committee-bruno
#   * segregation of duties: the officer that submits underwriting (officer-1)
#     is never the officer that approves (officer-2); committee identities never
#     act as ProgramAdmin or MortgageOfficer
#   * every `expected_*_version` is re-read from the parent immediately before
#     the OCC-guarded call, because cascades bump parent versions silently
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: selection_scoring_preliminary_vs_final_income_basis
        grounds:
          - calculations.household_selection_scoring
          - entities.ApplicantHousehold.fields.score_basis
          - entities.ApplicantHousehold.fields.need_score
          - entities.ApplicantHousehold.fields.ami_pct
          - state_machines.ApplicantHousehold.selection_status.COMMITTEE_REVIEW_to_SELECTED
        distinguishing_aspect: |
          Dual variant on the ApplicantHousehold scoring domain: the PRELIMINARY
          variant scores the SELF-REPORTED income/housing pair and the FINAL
          variant scores the VERIFIED pair, so the same row yields need_score 100
          / ami_pct 0.6 at /screen and need_score 90 / ami_pct 0.5 at
          /selection-decision — the stored values are overwritten, never blended.
        test_recipe:
          setup:
            - "One AffiliateProgram (ami_median_income_cents 6000000, committee_quorum 2, sweat_equity_base_hours_required 12, subsidy_pool_cents 5000000, status ACTIVE, program_posture OPEN)."
            - "One ApplicantHousehold in selection_status COMMITTEE_REVIEW, documentation_status VERIFIED, score_basis PRELIMINARY, self-reported income 3600000 / housing 150000, verified income 3000000 / housing 100000."
            - "Six SUBMITTED SelectionReview rows: two distinct reviewers x {NEED, ABILITY, WILLINGNESS}, every score 80.00, every recommendation ADVANCE, so quorum_met is true on all three dimensions and willingness_score aggregates to 80.00."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_app_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Pay stubs and 2025 return verified" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
          trigger:
            - { call: "GET /homeownership/households/${hh_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { prelim_need: $.data.need_score, prelim_ability: $.data.ability_to_pay_score, prelim_ami: $.data.ami_pct, prelim_basis: $.data.score_basis, prelim_composite: $.data.composite_selection_score } }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Committee vote 2026-08-01: advance on all three dimensions" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "${prelim_need} == 100"
            - "${prelim_ability} == 100"
            - "${prelim_ami} == 0.6"
            - "${prelim_basis} == PRELIMINARY"
            - "${prelim_composite} == null"
            - "ApplicantHousehold.${hh_id}.need_score == 90"
            - "ApplicantHousehold.${hh_id}.ability_to_pay_score == 100"
            - "ApplicantHousehold.${hh_id}.ami_pct == 0.5"
            - "ApplicantHousehold.${hh_id}.willingness_score == 80.0"
            - "ApplicantHousehold.${hh_id}.composite_selection_score == 91.0"
            - "ApplicantHousehold.${hh_id}.score_basis == FINAL"
            - "ApplicantHousehold.${hh_id}.selection_status == SELECTED"

      - name: development_cost_cash_basis_vs_full_fmv_basis
        grounds:
          - calculations.development_cost_basis
          - entities.BuildSite.fields.cash_cost_cents
          - entities.BuildSite.fields.total_development_cost_cents
          - entities.AffiliateProgram.fields.donated_material_fmv_cents
          - entities.CostEntry.fields.is_in_kind
        distinguishing_aspect: |
          Second dual variant, on a different entity domain (BuildSite cost
          accounting, not household scoring): the identical RECORDED CostEntry
          set yields cash_cost_cents 5000000 under CASH_BASIS and
          total_development_cost_cents 5750000 under FULL_FMV_BASIS, a 750000
          cent spread created solely by the donated-materials row.
        test_recipe:
          setup:
            - "One AffiliateProgram with donated_material_fmv_cents 0."
            - "One BuildSite in RAW_LAND with acquisition_cost_cents 4000000 and appraised_value_cents 15000000."
            - "One RECORDED cash CostEntry of 1000000 cents (MATERIALS, is_in_kind false), so cash_cost_cents == total_development_cost_cents == 5000000 before the trigger."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: false, amount_cents: 1000000 }, as: ConstructionManager, as_user_id: "cm-1", captures: { ce_cash_id: $.data.id } }
            - { call: "GET /homeownership/build-sites/${site_id}", as: ConstructionManager, as_user_id: "cm-1", captures: { cash_before: $.data.cash_cost_cents, total_before: $.data.total_development_cost_cents } }
          trigger:
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: true, fair_market_value_cents: 750000, donor_name: "Cedar Lumber Co" }, as: ConstructionManager, as_user_id: "cm-1", captures: { ce_kind_id: $.data.id } }
          assert:
            - "${cash_before} == 5000000"
            - "${total_before} == 5000000"
            - "BuildSite.${site_id}.cash_cost_cents == 5000000"
            - "BuildSite.${site_id}.total_development_cost_cents == 5750000"
            - "BuildSite.${site_id}.total_development_cost_cents - BuildSite.${site_id}.cash_cost_cents == 750000"
            - "AffiliateProgram.${prog_id}.donated_material_fmv_cents == 750000"
            - "CostEntry.${ce_kind_id}.status == RECORDED"
            - "CostEntry.${ce_kind_id}.amount_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: affordable_structure_single_forward_pass_term_tier
        mode: "(a) multi-input interaction — five interdependent intermediates (escrow, budget, PI, provisional principal, tier) collapse into one pinned forward pass"
        grounds:
          - calculations.affordable_payment_structure
          - entities.MortgageApplication.fields.term_months
          - entities.MortgageApplication.fields.first_mortgage_principal_cents
          - entities.MortgageApplication.fields.silent_second_amount_cents
          - state_machines.MortgageApplication.status.DRAFT_to_UNDERWRITING
        distinguishing_aspect: |
          Eight steps whose dependency graph LOOKS circular: term_months is chosen
          from the provisional 360-month principal (19575000) while
          first_mortgage_principal_cents is payment * term_months (13050000). The
          pinned single pass yields term 240 / principal 13050000 / silent second
          1950000. An implementation that iterates — re-deriving the tier from the
          FINAL principal — gets 13050000 < 13500000, falls to the 300 tier, and
          reports term 300, principal 15000000 and silent second 0, i.e. no
          subsidy at all. Only the pinned order distinguishes the two.
        test_recipe:
          setup:
            - "AffiliateProgram with ami_median_income_cents 6000000 and subsidy_pool_cents 5000000."
            - "ApplicantHousehold SELECTED with verified_annual_income_cents 3000000 (income_basis snapshot)."
            - "BuildSite READY_TO_BUILD with appraised_value_cents 15000000."
            - "MortgageApplication in DRAFT created by officer-1."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_app_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Docs verified" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Selected 2026-08-01" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "T-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "E-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "U-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: MortgageOfficer, as_user_id: "officer-1", captures: { hh_v: $.data.version } }
            - { call: "POST /homeownership/mortgage-applications", payload: { household_id: "${hh_id}", build_site_id: "${site_id}", expected_household_version: "${hh_v}", term_months: 240 }, as: MortgageOfficer, as_user_id: "officer-1", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/mortgage-applications/${app_id}/submit-underwriting", as: MortgageOfficer, as_user_id: "officer-1" }
          assert:
            - "MortgageApplication.${app_id}.status == UNDERWRITING"
            - "MortgageApplication.${app_id}.income_basis_annual_cents == 3000000"
            - "MortgageApplication.${app_id}.appraised_value_cents == 15000000"
            - "MortgageApplication.${app_id}.escrow_monthly_cents == 20625"
            - "MortgageApplication.${app_id}.affordable_pi_payment_cents == 54375"
            - "MortgageApplication.${app_id}.term_months == 240"
            - "MortgageApplication.${app_id}.first_mortgage_principal_cents == 13050000"
            - "MortgageApplication.${app_id}.silent_second_amount_cents == 1950000"
            - "MortgageApplication.${app_id}.lien_status == NONE"

      - name: sweat_equity_round_per_entry_before_summation
        mode: "(b) rounding-order boundary — identical inputs, per-entry half-up rounding vs sum-then-round differ by 0.01 in the ledger"
        grounds:
          - calculations.sweat_equity_credit_allocation
          - entities.SweatEquityEntry.fields.hours_credited
          - entities.ApplicantHousehold.fields.sweat_equity_credited_hours
          - state_machines.SweatEquityEntry.status.VERIFIED_to_CREDITED
        distinguishing_aspect: |
          Three OTHER_AFFILIATE entries of 1.75 raw hours at credit_weight 0.75:
          the pinned order rounds each entry first (round(1.3125,2) = 1.31) and
          then sums, giving sweat_equity_credited_hours 3.93. Summing the raw
          products first (5.25 * 0.75 = 3.9375) and rounding afterwards gives
          3.94 — a 0.01 hour ledger divergence that also proves the ledger is
          fed from SweatEquityEntry.hours_credited, not recomputed from
          hours_claimed.
        test_recipe:
          setup:
            - "AffiliateProgram with sweat_equity_base_hours_required 12 (so sweat_equity_required_hours is 12.00 for a one-adult household and no satisfaction cascade fires below 12.00)."
            - "ApplicantHousehold SELECTED with one APPLICANT HouseholdMember (family allowance does not apply)."
            - "Logical clock at 2026-08-05T00:00:00.000Z so work_date 2026-08-04 is in range."
            - "Two OTHER_AFFILIATE entries of 1.75 hours already CREDITED (ledger at 2.62)."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_app_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Docs verified" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Selected 2026-08-01" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T00:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", member_id: "${mem_app_id}", category: "OTHER_AFFILIATE", work_date: "2026-08-04T00:00:00.000Z", hours_claimed: 1.75 }, as: Applicant, as_user_id: "${hh_id}", captures: { se1_id: $.data.id } }
            - { call: "POST /homeownership/sweat-equity-entries/${se1_id}/verification", payload: { decision: "VERIFIED" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/sweat-equity-entries/${se1_id}/credit", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", member_id: "${mem_app_id}", category: "OTHER_AFFILIATE", work_date: "2026-08-04T00:00:00.000Z", hours_claimed: 1.75 }, as: Applicant, as_user_id: "${hh_id}", captures: { se2_id: $.data.id } }
            - { call: "POST /homeownership/sweat-equity-entries/${se2_id}/verification", payload: { decision: "VERIFIED" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/sweat-equity-entries/${se2_id}/credit", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", member_id: "${mem_app_id}", category: "OTHER_AFFILIATE", work_date: "2026-08-04T00:00:00.000Z", hours_claimed: 1.75 }, as: Applicant, as_user_id: "${hh_id}", captures: { se3_id: $.data.id } }
            - { call: "POST /homeownership/sweat-equity-entries/${se3_id}/verification", payload: { decision: "VERIFIED" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          trigger:
            - { call: "POST /homeownership/sweat-equity-entries/${se3_id}/credit", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          assert:
            - "SweatEquityEntry.${se3_id}.credit_weight == 0.75"
            - "SweatEquityEntry.${se3_id}.hours_credited == 1.31"
            - "SweatEquityEntry.${se3_id}.capped_hours == 0.0"
            - "SweatEquityEntry.${se3_id}.status == CREDITED"
            - "HouseholdMember.${mem_app_id}.credited_hours_to_date == 3.93"
            - "ApplicantHousehold.${hh_id}.sweat_equity_credited_hours == 3.93"
            - "ApplicantHousehold.${hh_id}.family_member_credited_hours == 0.0"
            - "ApplicantHousehold.${hh_id}.sweat_equity_required_hours == 12.0"
            - "ApplicantHousehold.${hh_id}.sweat_equity_satisfied == false"

      - name: lien_decay_then_shared_appreciation_tier_composition
        mode: "(c) staged composition — a decay result (lien_outstanding_cents) is consumed as an input by the ordered shared-appreciation tier ladder in the same request"
        grounds:
          - calculations.lien_forgiveness_and_recapture
          - entities.MortgageApplication.fields.forgiven_amount_cents
          - entities.MortgageApplication.fields.lien_outstanding_cents
          - entities.MortgageApplication.fields.right_of_first_refusal_expires_on
          - state_machines.MortgageApplication.lien_status.ACTIVE_to_TRANSFER_PENDING
        distinguishing_aspect: |
