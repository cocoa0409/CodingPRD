            - "lifecycle: ${r_s2} == APPROVED, ${r_s3} == SUBMITTED, ${r_s4} == PAID"

      - name: objector_appeal_rebate_cycle
        claim_type: valid_transition
        grounds: [state_machines.ObjectorCase.REBATE_ISSUED_to_APPEALED, state_machines.ObjectorCase.APPEALED_to_RATE_SET]
        distinguishing_aspect: "The appeal loop cycles: REBATE_ISSUED -> APPEALED -> RATE_SET with a new percentage, and the member-visible chargeable_share_pct tracks each hop."
        test_recipe:
          setup: ["FLAT local (flat 1000); member M with FINAL paid assessment 2026-08 (1000); objector case RATE_SET at 80%"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 300", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Appeal Amy", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-09" }, as: SecretaryTreasurer }
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 1000 }, as: Member, as_user_id: "${mem}" }
            - call: "POST /api/members/${mem}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${mem}"
              captures: { case: "$.data.id" }
            - { call: "POST /api/objector-cases/${case}/set-rate", payload: { chargeable_share_pct: 80 }, as: LocalAdmin }
          trigger:
            - call: "POST /api/objector-cases/${case}/issue-rebate"
              payload: {}
              as: SecretaryTreasurer
              captures: { s1: "$.data.status", cum1: "$.data.cumulative_rebate_cents" }
            - call: "POST /api/objector-cases/${case}/appeal"
              payload: {}
              as: Member
              as_user_id: "${mem}"
              captures: { s2: "$.data.status" }
            - call: "POST /api/objector-cases/${case}/set-rate"
              payload: { chargeable_share_pct: 65 }
              as: LocalAdmin
              captures: { s3: "$.data.status", pct3: "$.data.chargeable_share_pct" }
          assert:
            - "${s1} == REBATE_ISSUED with ${cum1} == 200 (1000 - round(1000*0.80))"
            - "${s2} == APPEALED (cycle re-entry)"
            - "${s3} == RATE_SET and ${pct3} == 65 (re-rate after appeal)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: payment_waterfall_oldest_period_first
        claim_type: correct_result
        grounds: [calculations.payment_waterfall, entities.DuesAssessment.fields.paid_cents]
        distinguishing_aspect: "A partial credit fills the oldest period bucket first: paying 7000 against two FINAL 5000 periods leaves 2026-05 fully paid and 2026-06 with exactly 2000 paid / 3000 remaining."
        test_recipe:
          setup: ["FLAT local (flat 5000); member M; runs 2026-05 + 2026-06 (both FINAL after the 06 run) -> two unpaid buckets of 5000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Falls Fred", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
          trigger:
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 7000 }, as: Member, as_user_id: "${mem}" }
            - call: "GET /api/members/${mem}/assessments?period=2026-05"
              as: SecretaryTreasurer
              captures: { paid_05: "$.data[0].paid_cents", amt_05: "$.data[0].assessed_cents" }
            - call: "GET /api/members/${mem}/assessments?period=2026-06"
              as: SecretaryTreasurer
              captures: { paid_06: "$.data[0].paid_cents", amt_06: "$.data[0].assessed_cents" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { arrears: "$.data.arrears_cents" }
          assert:
            - "${amt_05} == 5000 and ${paid_05} == 5000 (oldest bucket filled first)"
            - "${amt_06} == 5000 and ${paid_06} == 2000 (remainder overflows to the next bucket)"
            - "${arrears} == 3000 (10000 charged - 7000 paid)"

      - name: assessment_rate_resolution_inherits_local_defaults
        claim_type: constants_applied
        grounds: [calculations.assessed_dues, entities.DuesAssessment.fields.rate_bp_applied]
        distinguishing_aspect: "A classification without overrides inherits the local's default 200bp; the assessment pins rate_bp_applied 200 and computes 2% of the reported gross."
        test_recipe:
          setup: ["PCT local (default 200bp); class JOURNEYMAN with NO overrides (min 0, uncapped); member M on employer E; 2026-08 run; remittance line (M, 8000, gross 400000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Inherit Irene", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 8000 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 8000, gross_wages_cents: 400000 }
              as: OfficeClerk
          trigger:
            - { call: "POST /api/remittances/${rem}/reconcile", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - call: "GET /api/members/${mem}/assessments"
              as: SecretaryTreasurer
              captures: { amt: "$.data[0].assessed_cents", bp: "$.data[0].rate_bp_applied", st: "$.data[0].status" }
          assert:
            - "${bp} == 200 (inherited from local default; no classification override)"
            - "${amt} == 8000 (400000 * 200 / 10000) and ${st} == FINAL"

      - name: objector_pct_boundaries_zero_and_hundred
        claim_type: precision
        grounds: [calculations.objector_rebate, "errors[ERR_PCT_OUT_OF_RANGE]"]
        distinguishing_aspect: "pct == 100 yields a zero rebate (no error); pct == 0 rebates the full assessment; pct 101 is a 422 — the inclusive range endpoints behave differently from the out-of-range value."
        test_recipe:
          setup: ["FLAT local (flat 1000); members M0 and M1 each with FINAL paid assessment 2026-08 (payment 1000 each) and RATE_SET cases (0 and 100); member M2 with a FILED case (no rate)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 300", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Zero Zach", member_number: "M-000", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m0: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Full Fiona", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m1: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-09" }, as: SecretaryTreasurer }
            - { call: "POST /api/members/${m0}/payments", payload: { amount_cents: 1000 }, as: Member, as_user_id: "${m0}" }
            - { call: "POST /api/members/${m1}/payments", payload: { amount_cents: 1000 }, as: Member, as_user_id: "${m1}" }
            - call: "POST /api/members/${m0}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${m0}"
              captures: { c0: "$.data.id" }
            - call: "POST /api/members/${m1}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { c1: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Range Rex", member_number: "M-002", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m2: "$.data.id" }
            - call: "POST /api/members/${m2}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { c2: "$.data.id" }
            - { call: "POST /api/objector-cases/${c0}/set-rate", payload: { chargeable_share_pct: 0 }, as: LocalAdmin }
            - { call: "POST /api/objector-cases/${c1}/set-rate", payload: { chargeable_share_pct: 100 }, as: LocalAdmin }
          trigger:
            - call: "POST /api/objector-cases/${c0}/issue-rebate"
              payload: {}
              as: SecretaryTreasurer
              captures: { cum0: "$.data.cumulative_rebate_cents" }
            - call: "POST /api/objector-cases/${c1}/issue-rebate"
              payload: {}
