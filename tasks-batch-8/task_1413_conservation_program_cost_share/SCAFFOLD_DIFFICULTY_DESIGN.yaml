            - "Program modulus 2; two contracts C1/C2 each with a FENCE 100 item (30000 each) certified 2026-10-01 by planner-1; R1 on C1 DISBURSED (seq 1); R2 on C2 APPROVED (seq 2 -> sampled); clock advanced to 2027-10-02 (certification stale: > 2026-10-01 + 365d = 2027-10-01)"
