            - "${esc2_error} == ERR_SURGE_THRESHOLD_NOT_MET with HTTP 409"
            - "SurgeEscalation.${esc_2}.census_ratio_at_request == 0.2500 and status == REQUESTED"

      - name: designation_score_multi_factor_with_transport_cap
        grounds:
          - calculations.designation_compliance_score
          - calculations.designation_outcome
          - entities.DesignationReview.fields.compliance_score
          - entities.DesignationStandard.fields.transport_capability_required
          - state_machines.DesignationReview.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — four inputs interacting non-linearly: credential coverage
          multiplied by a min-capped nurse-ratio factor, then a 0.45/0.35/0.20
          weighting, then a conditional hard cap. 3-of-4 credentials with full
          equipment and 80% volume gives 84.75; flipping transport_capable to
          false on identical clinical inputs collapses the same formula to the
          69.99 cap rather than scaling it.
        test_recipe:
          setup:
            - "Prelude as above, plus a LEVEL_IV standard requiring NEO_BOARD, NNP, RN_NICU_CORE and RT_NEO credentials and CONVENTIONAL_VENT, HFOV and INHALED_NO equipment, min_compliance_score 90.00, conditional_floor_score 75.00, transport_capability_required true."
            - "Regional NICU A holds 3 of the 4 required credentials (NEO_BOARD, RN_NICU_CORE, NNP — no RT_NEO) and all 3 required assets, annual volume 400 against a 500 minimum, and an empty census."
            - "A LEVEL_IV review is open in DRAFT with assigned_nurse_count 0."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - &k_std4
              call: "POST /designation-standards"
              payload: { level: "LEVEL_IV", required_credential_codes: ["NEO_BOARD", "NNP", "RN_NICU_CORE", "RT_NEO"], required_equipment_codes: ["CONVENTIONAL_VENT", "HFOV", "INHALED_NO"], nurse_patient_ratio_denominator: 1.0, min_annual_volume: 500, transport_capability_required: true, min_compliance_score: 90.00, conditional_floor_score: 75.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "NNP", holder_reference: "nnp-1", fte: 1.0, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - *k_vent
            - *k_hfov
            - call: "POST /equipment-assets"
              payload: { unit_id: "${unit_a}", equipment_code: "INHALED_NO", asset_tag: "INO-1", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { ino_a: $.data.id }
            - call: "POST /designation-reviews"
              payload: { unit_id: "${unit_a}", requested_level: "LEVEL_IV", assigned_nurse_count: 0 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { rev_1: $.data.id }
          trigger:
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/return"
              payload: { return_reason: "RT_NEO coverage missing — resubmit with the transport attestation corrected" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_tr: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_tr}", transport_capable: false }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
          assert:
            - "After the first submit: DesignationReview.${rev_1}.staffing_subscore == 75.00"
            - "After the first submit: DesignationReview.${rev_1}.equipment_subscore == 100.00"
            - "After the first submit: DesignationReview.${rev_1}.volume_subscore == 80.00"
            - "After the first submit: DesignationReview.${rev_1}.compliance_score == 84.75 and submission_round == 1"
            - "After the second submit: DesignationReview.${rev_1}.compliance_score == 69.99 and submission_round == 2 and status == SUBMITTED"
            - "The three subscores are unchanged by the transport flag (75.00 / 100.00 / 80.00) — only the conditional cap moves the total"
            - "69.99 < DesignationStandard(LEVEL_IV).conditional_floor_score == 75.00, so the capped score cannot be verified"

  - rule_id: non_linear_state_machine
    instances:

      - name: referral_info_request_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.Referral.PENDING_to_INFO_REQUESTED
          - state_machines.Referral.INFO_REQUESTED_to_PENDING
          - state_machines.Referral.divert_info_exhausted
          - entities.Referral.fields.info_request_rounds
          - calculations.referral_required_level
        distinguishing_aspect: |
          Referral is the cyclic machine: PENDING -> INFO_REQUESTED -> PENDING
          twice, and the third request-info takes the DIVERTED branch instead of
          re-entering the loop. Each pass through the loop re-runs the level
          calculation, so the loop is not idempotent — the required_level moves
          from LEVEL_II to LEVEL_III on the second pass.
        test_recipe:
          setup:
            - "Prelude as above."
            - "One PENDING INBOUND_NEONATAL referral to Regional NICU A: 34.0 weeks, 2000 g, ROOM_AIR (required_level LEVEL_II, triage_priority 45.00)."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-L1", gestational_age_weeks: 34.0, birth_weight_grams: 2000, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_l1: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_l1}/request-info"
              payload: { requested_items: ["cord gas", "antenatal steroid course"] }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /referrals/${ref_l1}/provide-info"
              payload: { gestational_age_weeks: 34.0 }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
            - call: "POST /referrals/${ref_l1}/request-info"
              payload: { requested_items: ["current respiratory support"] }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /referrals/${ref_l1}/provide-info"
              payload: { support_modality: "CONVENTIONAL_VENT" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
            - call: "POST /referrals/${ref_l1}/request-info"
              payload: { requested_items: ["blood gas trend"] }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
          assert:
            - "After call 1: Referral.${ref_l1}.status == INFO_REQUESTED and info_request_rounds == 0"
            - "After call 2: Referral.${ref_l1}.status == PENDING and info_request_rounds == 1 and requested_items == null"
            - "After call 3: Referral.${ref_l1}.status == INFO_REQUESTED and info_request_rounds == 1"
            - "After call 4: Referral.${ref_l1}.status == PENDING and info_request_rounds == 2"
            - "After call 4: Referral.${ref_l1}.required_level == LEVEL_III and level_basis == CURRENT_SUPPORT and triage_priority == 55.00"
            - "After call 5: Referral.${ref_l1}.status == DIVERTED and decision_reason == INFO_ROUNDS_EXHAUSTED and info_request_rounds == 2"
            - "The loop is entered exactly twice; the third entry is impossible"

      - name: admission_care_and_infection_dimensions_advance_independently
        grounds:
          - state_machines.Admission.care_status
          - state_machines.Admission.infection_status
          - entities.Admission.fields.care_status
          - entities.Admission.fields.infection_status
          - entities.Admission.fields.infection_confirmed_at
        distinguishing_aspect: |
          A different entity (Admission) carrying the parallel shape: two
          independent dimensions on one row. care_status walks
          ADMITTED -> STABILIZED -> BACK_TRANSFER_READY while infection_status
          walks SURVEILLANCE_CLEAR -> SUSPECTED -> CONFIRMED_CLABSI -> RESOLVED,
          and neither transition moves the other dimension. Unlike the Referral
          instance there is no loop bound here — the infection dimension may
          re-enter SUSPECTED from RESOLVED without limit.
        test_recipe:
          setup:
            - "Prelude as above."
            - "One ADMITTED admission at Regional NICU A from a 29.0-week, 1200 g referral."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-P1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_p1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_p1: $.data.version }
            - call: "POST /referrals/${ref_p1}/accept"
              payload: { expected_unit_version: "${v_p1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_p1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_p1: $.data.id }
          trigger:
            - call: "POST /admissions/${adm_p1}/care-updates"
              payload: { current_weight_grams: 1900, support_modality: "ROOM_AIR", central_line_present: true, ventilated: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_p1}/infection-events"
              payload: { event: "SUSPECT" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_p1}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_p1}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_p1}/back-transfer-ready"
              payload: { back_transfer_attestation_note: "Room air, gaining, line still in situ under surveillance" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions/${adm_p1}/infection-events"
              payload: { event: "CONFIRM_CLABSI" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_p1}/infection-events"
              payload: { event: "RESOLVE" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_p1}/infection-events"
              payload: { event: "SUSPECT" }
              as: BedsideNurse
              as_user_id: "nurse-1"
          assert:
            - "After call 1: care_status == STABILIZED and infection_status == SURVEILLANCE_CLEAR and central_line_days == 1 and current_care_level == LEVEL_I"
            - "After call 2: care_status == STABILIZED (unchanged) and infection_status == SUSPECTED"
            - "After call 5: care_status == BACK_TRANSFER_READY and infection_status == SUSPECTED (unchanged) and developmental_bundle_score == 60.00"
            - "After call 6: care_status == BACK_TRANSFER_READY (unchanged) and infection_status == CONFIRMED_CLABSI and infection_confirmed_at == 2026-08-01T00:00:00Z"
            - "After call 7: care_status == BACK_TRANSFER_READY (unchanged) and infection_status == RESOLVED"
            - "After call 8: care_status == BACK_TRANSFER_READY (unchanged) and infection_status == SUSPECTED again — the infection dimension is unbounded"

      - name: transport_run_mode_fork_joins_at_on_scene
        grounds:
          - state_machines.TransportRun.dispatch_ground
          - state_machines.TransportRun.dispatch_air
          - state_machines.TransportRun.GROUND_ROLLING_to_ON_SCENE
          - calculations.isolette_occupation_interval
          - entities.TransportRun.fields.decontamination_minutes
          - entities.EquipmentAsset.fields.decontamination_ready_at
        distinguishing_aspect: |
          A third entity (TransportRun) with the branching fork-join shape: one
          trigger name, two target states chosen by mode, with different
          preconditions (air adds weather minimums) and different decontamination
          buffers (45 vs 90 minutes) — then both branches join at the single
          ON_SCENE state.
        test_recipe:
          setup:
            - "Prelude as above, plus a TRANSPORT_ISOLETTE asset at Regional NICU A serviced 2026-07-01 on a 365-day interval."
            - "Two referrals are accepted at Regional NICU A, giving two held beds and two reservation ids."
