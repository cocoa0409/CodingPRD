      - name: settle_endpoint_full_side_effect_chain
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /exchange-transactions/{id}/settle"
        excluded_because:
          difficulty_instance: settlement_four_hop_cascade_to_structuring_report_and_customer_hold
          rationale: "Every declared side effect of settle - the SETTLEMENT_FINAL money fields, the inventory debit, the branch revaluation, the customer aggregates, the auto report and the hold - is asserted hop by hop in that §1.8 transitive_cascade instance."

      - name: arrive_endpoint_partial_delivery_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /cash-shipments/{id}/arrive"
        excluded_because:
          difficulty_instance: shipment_arrival_five_hop_cascade_to_auto_repatriation_manifest
          rationale: "The arrival credit, the position and branch revaluation and the auto-repatriation manifest are all pinned there; the exception fork on a short delivery is covered by the §1.9 state-machine instance shipment_exception_fork_and_join_on_reconciled."

      - name: redeem_and_cancel_endpoint_liability_effects
        claim_type: conditional_action
        grounds:
          - endpoints."POST /buyback-contracts/{id}/redeem"
          - endpoints."POST /buyback-contracts/{id}/cancel"
        excluded_because:
          difficulty_instance: buyback_issue_then_cancel_restores_branch_liability
          rationale: "That §1.8 compensating_action instance walks issuance, partial redemption and cancellation against Branch.buyback_liability_usd_cents, which is the only ledger these two endpoints touch."

      - name: reverse_endpoint_restores_inventory_and_aggregates
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /exchange-transactions/{id}/reverse"
        excluded_because:
          difficulty_instance: settlement_then_reversal_restores_position_note_inventory
          rationale: "The full restoration of the denomination mix, the branch vault fields and the customer aggregates - plus the deliberate non-clearing of compliance_hold_active - is that §1.8 compensating_action instance."

      - name: compliance_decision_endpoint_second_axis
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /exchange-transactions/{id}/compliance-decision"
        excluded_because:
          difficulty_instance: exchange_transaction_parallel_axes_settle_while_compliance_flagged
          rationale: "The independence of compliance_status from settlement_status under this endpoint is exactly that §1.8 parallel-axis instance."

      - name: review_endpoint_reject_returns_plan_to_draft
        claim_type: conditional_action
        grounds:
          - endpoints."POST /inventory-plans/{id}/review"
        excluded_because:
          difficulty_instance: inventory_plan_reject_resubmit_cycle_increments_revision_count
          rationale: "The REJECT branch, the return to DRAFT and the revision_count increments across two loops are pinned in that §1.8 cyclic instance."

  - section: errors
    instances:
      - name: non_active_branch_status_rejects_only_its_four_declared_write_paths
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BRANCH_NOT_ACTIVE
          - entities.Branch.fields.status
          - validations[priority 7, Branch.status == ACTIVE]
        distinguishing_aspect: "Branch.status is input-only and never mutated, so a SUSPENDED or CLOSED branch is born unusable for the four listed write paths - yet it still accepts inventory positions and customer on-boarding, because those two endpoints are deliberately outside the rule's applies_to list."
        test_recipe:
          setup:
            - "One SUSPENDED branch BR-SUS and one CLOSED branch BR-CLO, both with a 20,000,000-cent vault limit and region SOUTH."
            - "EUR profile, one EUR wholesale rate (mid 920000) and a corridor LHR-ALPS-WINTER, so every FK in the calls below resolves and priority 3 cannot mask priority 7."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-SUS", name: "Gatwick North (suspended)", region_code: "SOUTH", vault_limit_usd_cents: 20000000, status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { sus_id: "$.data.id", sus_v: "$.data.version" }
            - call: "POST /branches"
              payload: { code: "BR-CLO", name: "Croydon (closed)", region_code: "SOUTH", vault_limit_usd_cents: 20000000, status: "CLOSED" }
              as: PlatformAdmin
              captures: { clo_id: "$.data.id" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /currencies"
              payload: { iso_code: "CHF", display_name: "Swiss Franc", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [1000, 2000, 5000, 20000] }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /travel-corridors"
              payload: { code: "LHR-ALPS-WINTER", origin_country_code: "GB", destination_country_code: "CH", destination_currency_code: "CHF", season: "WINTER", season_start_date: "2026-06-01T00:00:00Z", season_end_date: "2026-09-01T00:00:00Z", demand_index_bps: 12500 }
              as: TreasuryOfficer
              captures: { corr_id: "$.data.id" }
          trigger:
            - call: "POST /rate-cards"
              payload: { branch_id: "${sus_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${sus_v}" }
              as: TreasuryOfficer
              captures: { e_card: "$.data.error_id" }
            - call: "POST /inventory-plans"
              payload: { branch_id: "${clo_id}", travel_corridor_id: "${corr_id}", season_days: 10, target_lines: [{ currency_code: "CHF", baseline_daily_minor_units: 3000 }] }
              as: BranchManager
              as_user_id: mgr-01
              captures: { e_plan: "$.data.error_id" }
            - call: "POST /inventory-positions"
              payload: { branch_id: "${sus_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 10000, note_count: 5 }] }
              as: BranchManager
              captures: { pos_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Nia Adeyemi", nationality_code: "GH", home_branch_id: "${sus_id}" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
          assert:
            - "${e_card} == ERR_BRANCH_NOT_ACTIVE with HTTP 409, not ERR_STALE_BRANCH_VERSION: expected_branch_version ${sus_v} is the branch's current version 1, so the priority-6 OCC gate passes and priority 7 is the first thing that fails"
            - "${e_plan} == ERR_BRANCH_NOT_ACTIVE with HTTP 409: CLOSED fails the same equality check as SUSPENDED - the rule is status == ACTIVE, not status != CLOSED"
            - "no RateCard and no InventoryPlan row exists afterwards: GET /rate-cards?branch_id=${sus_id} and GET /inventory-plans?branch_id=${clo_id} both return total_count 0"
            - "Branch.${sus_id}.version is still 1: a rejected /rate-cards call performs no supersession and no version bump"
            - "InventoryPosition.${pos_id} is created 201 on the SUSPENDED branch with total_minor_units 50000 and usd_equivalent_cents 54348, and Branch.${sus_id} recomputes to vault_usd_equivalent_cents 54348, vault_utilization_bps 27 and posture OPEN with status still SUSPENDED"
            - "Customer.${cust_id} is created 201 with home_branch_id ${sus_id}: on-boarding is outside the applies_to list, so the suspended branch can still register a customer it may never trade with"

      - name: customer_compliance_hold_blocks_authorize_and_buyback_but_not_quoting
