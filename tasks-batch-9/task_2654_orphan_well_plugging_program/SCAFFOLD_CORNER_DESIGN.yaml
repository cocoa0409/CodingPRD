          trigger:
            - call: "GET /wells"
              payload: { operator_id: "${op1_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /wells"
              payload: { operator_id: "${op1_id}", min_screening_score: 59.90 }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "GET /wells"
              payload: { operator_id: "${op1_id}", min_screening_score: 59.91 }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "GET /wells"
              payload: { operator_id: "${op2_id}", min_screening_score: 59.90 }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "GET /wells"
              payload: { status: "INACTIVE", operator_id: "${op1_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "Well.${w_low_id}.screening_score == 11.50, Well.${w_mid_id}.screening_score == 59.90, Well.${w_high_id}.screening_score == 100.00 and Well.${w_other_id}.screening_score == 59.90"
            - "the first call returns HTTP 200 with total_count == 3, has_more == false and exactly the ids ${w_low_id}, ${w_mid_id} and ${w_high_id}"
            - "the first call does NOT include ${w_other_id}, which belongs to the other operator"
            - "the second call returns total_count == 2 and exactly the ids ${w_mid_id} and ${w_high_id}: 59.90 is not below 59.90"
            - "the third call returns total_count == 1 and exactly the id ${w_high_id}: one hundredth above the score drops the mid well"
            - "the fourth call returns total_count == 1 and exactly the id ${w_other_id}, proving the two filters intersect rather than union"
            - "the fifth call returns HTTP 200 with total_count == 0 and an empty data array, not a 404"
            - "every returned row carries the response envelope fields limit, offset, total_count and has_more"

      - name: well_list_pages_without_overlap_and_flags_has_more
        claim_type: Standard CRUD
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count reports the size of the filtered set, not the size of the returned page, and
          has_more is derived from offset plus page length against that total: the first page of two
          rows out of three says has_more true, the second page of one row says false, and an offset
          past the end is a 200 with an empty array. The two pages together contain each id once.
        test_recipe:
          setup:
            - "operator O1 with exactly three PRODUCING wells, created in a known order"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-15001", operator_id: "${op1_id}", spud_year: 1961, total_depth_ft: 1200, casing_strings: 1, methane_scfd: 100, groundwater_depth_ft: 600, population_within_1000ft: 0, surface_disturbance_acres: 0.5 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-15002", operator_id: "${op1_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-15003", operator_id: "${op1_id}", spud_year: 1982, total_depth_ft: 9000, casing_strings: 4, methane_scfd: 500, groundwater_depth_ft: 40, population_within_1000ft: 25, surface_disturbance_acres: 5.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w3_id: $.data.id }
          trigger:
            - call: "GET /wells"
              payload: { operator_id: "${op1_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /wells"
              payload: { operator_id: "${op1_id}", limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { page2_first_id: "$.data[0].id" }
            - call: "GET /wells"
              payload: { operator_id: "${op1_id}", limit: 2, offset: 3 }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "the first call returns HTTP 200 with 2 rows, limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "the second call returns 1 row, limit == 2, offset == 2, total_count == 3 and has_more == false"
            - "the third call returns HTTP 200 with 0 rows, total_count == 3 and has_more == false"
            - "the union of the ids returned by the first two calls is exactly ${w1_id}, ${w2_id}, ${w3_id} with no id appearing twice"
            - "a call with no limit and no offset returns all 3 rows with limit == 10 and offset == 0, the declared defaults"

      - name: nested_production_list_is_scoped_to_its_parent_and_ordered_by_month
        claim_type: Cross-reference link
        grounds:
          - endpoints[GET /wells/{id}/production-records].description
          - entities.ProductionRecord.fields.well_id
        distinguishing_aspect: |
          The nested collection is filtered by the path id, so a sibling well's record never appears,
          and the declared order is month ascending rather than insertion order: the months are
          appended 2026-03, 2026-01, 2026-02 and read back 2026-01, 2026-02, 2026-03.
        test_recipe:
          setup:
            - "one operator with two wells; three production months on the first well appended out of order and one month on the second"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-16001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-16002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/production-records"
              payload: { month: "2026-03", oil_bbl: 3.0, gas_mcf: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells/${w1_id}/production-records"
              payload: { month: "2026-01", oil_bbl: 1.0, gas_mcf: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells/${w1_id}/production-records"
              payload: { month: "2026-02", oil_bbl: 2.0, gas_mcf: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells/${w2_id}/production-records"
              payload: { month: "2026-02", oil_bbl: 99.0, gas_mcf: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "GET /wells/${w1_id}/production-records"
              payload: {}
              as: DeterminationReviewer
              as_user_id: "u_rev"
              captures: { r0_id: "$.data[0].id", r1_id: "$.data[1].id", r2_id: "$.data[2].id" }
            - call: "GET /wells/${w2_id}/production-records"
              payload: { limit: 5, offset: 0 }
              as: DeterminationReviewer
              as_user_id: "u_rev"
          assert:
            - "the first call returns HTTP 200 with total_count == 3"
            - "the returned months are 2026-01, then 2026-02, then 2026-03, which is not the order they were appended in"
            - "ProductionRecord.${r0_id}.oil_bbl == 1.0, ProductionRecord.${r1_id}.oil_bbl == 2.0 and ProductionRecord.${r2_id}.oil_bbl == 3.0"
            - "every row returned by the first call has well_id == ${w1_id}; the 99.0 bbl row of the sibling well is absent"
            - "the second call returns total_count == 1 with the single 99.0 bbl row"
            - "Well.${w1_id}.cumulative_boe_60mo == 6.00 and Well.${w2_id}.cumulative_boe_60mo == 99.00, so the two wells aggregate independently"
            - "Well.${w1_id}.last_production_month == 2026-03: appending the earlier months did not move it backwards"

      - name: enforcement_action_endpoint_returns_the_updated_operator_and_bumps_version
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /operators/{id}/enforcement]
          - errors.ERR_STALE_OPERATOR_VERSION
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          One action endpoint dispatches on the action value, answers 200 with the full Operator
          object rather than 201 or an empty body, and increments version on every success so that
          the version the caller just sent is stale for the next call. An unknown action is a
          priority-30 schema failure, and a stale expected_operator_version is a 412, neither of
          which touches the row.
        test_recipe:
          setup:
            - "one ACTIVE operator at version 1 with no wells"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 400000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id, op_v: $.data.version }
          trigger:
            - call: "POST /operators/${op_id}/enforcement"
              payload: { action: "SUSPEND", expected_operator_version: "${op_v}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e_enum: $.data.error_id }
            - call: "POST /operators/${op_id}/enforcement"
              payload: { action: "DECLARE_INSOLVENT", expected_operator_version: "${op_v}", memo: "receiver appointed" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /operators/${op_id}/enforcement"
              payload: { action: "FORFEIT_BOND", expected_operator_version: "${op_v}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e_stale: $.data.error_id }
          assert:
            - "the first call returns HTTP 422 with error_id ERR_INVALID_REQUEST: SUSPEND is not in the declared action set"
            - "after the first call Operator.${op_id}.status == ACTIVE and version == 1"
            - "the second call returns HTTP 200, not 201, and its data is the Operator object with status == INSOLVENT"
            - "the second call's data.insolvency_declared_at == 2026-08-01T00:00:00Z and data.version == 2"
            - "the second call's data.bond_amount_cents == 400000 and bond_forfeited_at == null: DECLARE_INSOLVENT does not forfeit"
            - "the third call returns HTTP 412 with error_id ERR_STALE_OPERATOR_VERSION because version is now 2 while the payload still says 1"
            - "after the third call Operator.${op_id}.status == INSOLVENT, bond_amount_cents == 400000, bond_forfeited_at == null and version == 2"
            - "GET /funding-sources?kind=FORFEITED_BOND returns total_count == 0: the refused call created nothing"

      - name: operator_read_recomputes_its_aggregates_with_no_write_to_the_operator
        claim_type: Computed read
        grounds:
          - endpoints[GET /operators/{id}].description
          - entities.Operator.fields.required_bond_cents
          - entities.Operator.fields.orphan_candidate_count
        distinguishing_aspect: |
          Nothing in the test ever POSTs to the operator after creation, yet its read reflects two
          wells, a BLANKET requirement of 500000 and an orphan_candidate_count that moves from 0 to 1
          when a determination on a different entity is confirmed. active_well_count counts wells
          that are not PLUGGED or RECLAIMED, so the confirmed orphan is counted by both counters at once.
        test_recipe:
          setup:
            - "one BLANKET operator with a 500000 bond and two 2500 ft wells; the second well is walked to ORPHAN_CONFIRMED"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-17001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-17002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
            - call: "GET /wells/${w2_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_v: $.data.version }
            - call: "POST /wells/${w2_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w2_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "GET /operators/${op_id}"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "GET /operators/${op_id}"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
          assert:
            - "the first read returns HTTP 200 with required_bond_cents == 500000, active_well_count == 2 and orphan_candidate_count == 0"
            - "the first read's status == ACTIVE and version == 1: no enforcement call was ever made"
            - "the second read returns orphan_candidate_count == 1 while active_well_count is still 2"
            - "the second read's required_bond_cents is still 500000: confirming an orphan does not change the blanket requirement"
            - "the second read's version is still 1, so the aggregates are computed on read rather than written into the operator row"
            - "Well.${w2_id}.status == ORPHAN_CONFIRMED and Well.${w1_id}.status == PRODUCING"

      - name: access_resolution_dispatches_on_outcome_and_projects_onto_the_well
        claim_type: Conditional action
        grounds:
          - endpoints[POST /site-accesses/{id}/resolution].side_effects
          - entities.Well.fields.access_status
          - entities.SiteAccess.fields.legal_authority_citation
        distinguishing_aspect: |
          One endpoint with three outcomes writes three different pairs of states, and the citation
          is stored only on the ORDER_ENTRY branch: an EXECUTE_AGREEMENT call that supplies a citation
          leaves legal_authority_citation null. Each branch also projects a different value onto the
          well's access_status dimension while the well's lifecycle status stays PRODUCING.
        test_recipe:
          setup:
            - "one operator with two wells, each carrying one REQUESTED AGREEMENT-mode access request"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-18001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-18002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "AGREEMENT", compensation_cents: 150000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa1_id: $.data.id }
            - call: "POST /wells/${w2_id}/site-accesses"
              payload: { surface_owner_name: "Bar T Grazing Assn", mode: "AGREEMENT" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa2_id: $.data.id }
          trigger:
            - call: "POST /site-accesses/${sa1_id}/resolution"
              payload: { outcome: "EXECUTE_AGREEMENT", legal_authority_citation: "W.S. 30-5-104" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /site-accesses/${sa2_id}/resolution"
              payload: { outcome: "DENY" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "before the triggers Well.${w1_id}.access_status == ACCESS_PENDING and Well.${w2_id}.access_status == ACCESS_PENDING"
            - "SiteAccess.${sa1_id}.waiting_period_days == 0 and window_end_at == 2026-08-01T00:00:00Z: AGREEMENT mode defaults the notice period to 0"
            - "SiteAccess.${sa2_id}.compensation_cents == 0, the declared default"
            - "the first call returns HTTP 200 with data.status == AGREEMENT_EXECUTED and resolved_at == 2026-08-01T00:00:00Z"
            - "SiteAccess.${sa1_id}.legal_authority_citation == null: the citation is stored only on the ORDER_ENTRY branch"
            - "Well.${w1_id}.access_status == AGREEMENT_EXECUTED and status == PRODUCING"
            - "the second call returns HTTP 200 with data.status == DENIED and resolved_at == 2026-08-01T00:00:00Z"
            - "Well.${w2_id}.access_status == ACCESS_DENIED and status == PRODUCING, so the two dimensions move independently"

      - name: clock_endpoint_moves_the_instant_and_returns_no_entity
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.SiteAccess.fields.notice_sent_at
        distinguishing_aspect: |
          This is the only endpoint with a null output: it answers 200 with no entity payload. Its
          effect is observable only through later writes, and the default before any call is exactly
          2026-08-01T00:00:00Z rather than wall-clock time, so a row created before the call and a
          row created after it carry two different stamps that differ by exactly the amount set.
        test_recipe:
          setup:
            - "one operator with one well and one access request created at the default clock"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-19001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells/${w1_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "STATUTORY_ENTRY" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /wells"
              payload: { api_well_number: "49-001-19002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
          assert:
            - "SiteAccess.${sa1_id}.notice_sent_at == 2026-08-01T00:00:00Z and window_end_at == 2026-08-31T00:00:00Z, from the STATUTORY_ENTRY default of 30 days"
            - "the clock call returns HTTP 200 and its data carries no entity: there is no id, no version and no created_at to read"
            - "Well.${w2_id}.created_at == 2026-10-15T00:00:00Z while Well.${w1_id}.created_at == 2026-08-01T00:00:00Z"
            - "Well.${w2_id}.idle_months == 999: a null last_production_month is unaffected by the clock"
            - "SiteAccess.${sa1_id}.notice_sent_at is still 2026-08-01T00:00:00Z: moving the clock does not restamp existing rows"
            - "Well.${w1_id}.access_status == ACCESS_PENDING and SiteAccess.${sa1_id}.status == REQUESTED, both untouched by the clock move"

      - name: commitment_endpoint_writes_every_allocation_in_one_call
        claim_type: Bulk action
        grounds:
          - endpoints[POST /plugging-jobs/{id}/funding-commitments].output
          - endpoints[POST /plugging-jobs/{id}/funding-commitments].side_effects
        excluded_because:
          difficulty_instance: combinatorial_formula / federal_match_cap_single_pass_no_retroactive_match_expansion
          rationale: "That 1.8 instance asserts the array output of a single commitment call, all three allocation rows with their ranks, each source's updated committed_cents and the job's funded_cents, which is exactly the bulk-write claim."

  - section: errors
    instances:
      - name: error_responses_carry_the_error_envelope_and_persist_nothing
        claim_type: Error Triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_WELL_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Every failure answers with response_type error and a data object holding exactly error_id
          and message, never a partially built entity: the refused create leaves no row, so the
          collection count is unchanged and no id was minted.
        test_recipe:
          setup:
            - "one ACTIVE operator with one PRODUCING well"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-20001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /wells/w_does_not_exist"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e_404: $.data.error_id, m_404: $.data.message }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-20002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 0, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e_422: $.data.error_id, m_422: $.data.message }
          assert:
            - "the first call returns HTTP 404 with response_type == 'error' and data.error_id == ERR_WELL_NOT_FOUND"
            - "the first call's data.message is a non-empty string and its data carries no id, no version and no created_at"
            - "the first call's meta.api_request_id and meta.api_request_timestamp are both present, exactly as on a success"
            - "the second call returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST because total_depth_ft must be > 0"
            - "after the second call GET /wells?operator_id=${op_id} returns total_count == 1 and only the id ${w_id}"
            - "no Well row exists with api_well_number 49-001-20002: the refused create minted nothing"

      - name: each_error_family_answers_with_its_declared_http_status
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_WELL_NOT_FOUND
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The catalog assigns different transports to different failure families and they must not
          collapse onto one another: a missing row is 404, an undeclared edge out of the current
          state is 409, and a schema failure is 422. The 401 and 403 families are asserted in the
          rbac section and the 412 family in the concurrency layer.
        test_recipe:
          setup:
            - "one DRAFT solicitation and one PRODUCING well"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-21001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "single orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
          trigger:
            - call: "GET /solicitations/sol_missing"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e_404: $.data.error_id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e_409: $.data.error_id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "ARCHIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e_422: $.data.error_id }
          assert:
            - "the first call returns HTTP 404 with error_id ERR_SOLICITATION_NOT_FOUND"
            - "the second call returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION: CLOSE is not an edge out of DRAFT"
            - "the third call returns HTTP 422 with error_id ERR_INVALID_REQUEST: ARCHIVE is not a declared action value at all"
            - "the 409 and the 422 are different transports for the two different failures on the same endpoint"
            - "Solicitation.${sol_id}.status == DRAFT and version == 1 after all three calls"

  - section: rbac
    instances:
      - name: missing_or_unknown_role_and_missing_user_are_unauthenticated
        claim_type: Role Enforcement
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - roles.Operator.identity
        distinguishing_aspect: |
          Authentication is checked before authorization and before any business rule: an absent
          X-Role, an X-Role naming a role the scaffold never declares, and a missing X-User-ID on an
          endpoint whose rules read the acting user all answer 401, not 403 and not 422.
        test_recipe:
          setup:
            - "one ACTIVE operator with one PRODUCING well"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-22001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /wells/${w_id}"
              payload: {}
              as: "NONE - the request carries no X-Role header at all"
              captures: { e_no_role: $.data.error_id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: "Auditor - a role name the scaffold never declares"
              captures: { e_bad_role: $.data.error_id }
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 1.0, gas_mcf: 0 }
              as: "Operator - the request carries no X-User-ID header"
              captures: { e_no_user: $.data.error_id }
          assert:
            - "the first call returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the second call returns HTTP 401 with error_id ERR_UNAUTHENTICATED, not HTTP 403: an undeclared role fails authentication"
            - "the third call returns HTTP 401 with error_id ERR_UNAUTHENTICATED because the Operator scoping rules need the acting user id"
            - "GET /wells/${w_id}/production-records as ProgramAdmin with X-User-ID u_admin returns total_count == 0: the refused report wrote nothing"
            - "Well.${w_id}.last_production_month == null and cumulative_boe_60mo == 0"

      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: Role Enforcement
        grounds:
          - errors.ERR_UNAUTHORIZED
          - roles.DeterminationReviewer.permissions
          - roles.AwardAuthority.permissions
          - roles.FundingOfficer.permissions
        distinguishing_aspect: |
          Each exclusive operation belongs to exactly one role and the most powerful role is not a
          superset: ProgramAdmin, which may register operators and take enforcement action, is still
          refused the determination decision, and FieldInspector is refused the funding waterfall.
          The refusal is 403 with no state change, and the rightful role then succeeds on the same row.
        test_recipe:
          setup:
            - "one SUBMITTED orphan determination on a PRODUCING well"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-23001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_v: $.data.version }
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e_admin: $.data.error_id }
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e_insp: $.data.error_id }
            - call: "POST /operators"
              payload: { name: "Rogue Registrar Co", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { e_fund: $.data.error_id }
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
          assert:
            - "the first call returns HTTP 403 with error_id ERR_UNAUTHORIZED: ProgramAdmin is not in the decision endpoint's roles"
            - "the second call returns HTTP 403 with error_id ERR_UNAUTHORIZED: the authoring inspector cannot decide either"
            - "the third call returns HTTP 403 with error_id ERR_UNAUTHORIZED: POST /operators lists only ProgramAdmin"
            - "after the three refusals OrphanDetermination.${det_id}.status == SUBMITTED, decided_at == null and Well.${w_id}.status == PRODUCING"
            - "GET /operators returns total_count == 1: no operator named Rogue Registrar Co exists"
            - "the fourth call returns HTTP 200 with data.status == CONFIRMED and Well.${w_id}.status == ORPHAN_CONFIRMED"

      - name: entity_backed_callers_are_scoped_to_their_own_rows
        claim_type: Role Enforcement
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Operator.permissions
          - entities.ProductionRecord.fields.reported_by_user_id
        distinguishing_aspect: |
          The Operator role is entity_backed, so the acting X-User-ID is an Operator.id and every
          read or write is filtered by it: the same GET that returns 200 for the owning operator
          returns 403 ERR_NOT_RESOURCE_OWNER for the other one, and the operator's list read is
          silently narrowed to one well rather than refused. This is 403 with a different error_id
          from the role-membership refusal, because the role IS listed on the endpoint.
        test_recipe:
          setup:
            - "two operators, each holding exactly one PRODUCING well"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op1_id: $.data.id }
            - call: "POST /operators"
              payload: { name: "Shoshone Shell Co", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op2_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-24001", operator_id: "${op1_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-24002", operator_id: "${op2_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
          trigger:
            - call: "GET /wells/${w1_id}"
              payload: {}
              as: Operator
              as_user_id: "${op2_id}"
              captures: { e_read: $.data.error_id }
            - call: "POST /wells/${w1_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 5.0, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op2_id}"
              captures: { e_write: $.data.error_id }
            - call: "GET /wells"
              payload: {}
              as: Operator
              as_user_id: "${op2_id}"
              captures: { own_well_id: "$.data[0].id" }
            - call: "POST /wells/${w2_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 5.0, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op2_id}"
          assert:
            - "the first call returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER, not ERR_UNAUTHORIZED: Operator IS one of the endpoint's roles"
            - "the second call returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER and Well.${w1_id}.last_production_month == null"
            - "the third call returns HTTP 200 with total_count == 1 and exactly the id ${w2_id}: the list is narrowed, not refused"
            - "the fourth call returns HTTP 201 with data.well_id == ${w2_id} and data.reported_by_user_id == ${op2_id}"
            - "Well.${w2_id}.last_production_month == 2026-07 and cumulative_boe_60mo == 5.00"
            - "GET /wells/${w1_id}/production-records as ProgramAdmin returns total_count == 0"

      - name: contractor_callers_cannot_read_another_contractors_bid
        claim_type: Role Enforcement
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Contractor.permissions
        distinguishing_aspect: |
          The second entity_backed role is scoped on a different entity and a different collection:
          a Contractor-role caller holding contractor A's id is refused a read of contractor B's bid
          on the same solicitation, while the solicitation itself stays readable to both because it
          is not owned by either.
        test_recipe:
          setup:
            - "one OPEN solicitation carrying one bid from each of two contractors"
          setup_api_calls:
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-G0001", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c1_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Laramie Well Services", license_number: "P-G0002", bond_amount_cents: 2500000, performance_score: 74 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c2_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "single orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c1_id}", cement_per_sack_cents: 4000, rig_day_rate_cents: 800000, casing_per_ft_cents: 1200, mobilization_fee_cents: 2400000, technical_score: 92 }
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { bid1_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c2_id}", cement_per_sack_cents: 5000, rig_day_rate_cents: 900000, casing_per_ft_cents: 1500, mobilization_fee_cents: 2600000, technical_score: 80 }
              as: Contractor
              as_user_id: "${c2_id}"
              captures: { bid2_id: $.data.id }
          trigger:
            - call: "GET /bids/${bid2_id}"
              payload: {}
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { e_read: $.data.error_id }
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c2_id}", cement_per_sack_cents: 3000, rig_day_rate_cents: 700000, casing_per_ft_cents: 1000, mobilization_fee_cents: 2000000, technical_score: 95 }
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { e_write: $.data.error_id }
            - call: "GET /bids"
              payload: { solicitation_id: "${sol_id}" }
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { own_bid_id: "$.data[0].id" }
          assert:
            - "the first call returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER"
            - "the second call returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER: contractor A cannot bid in contractor B's name"
            - "GET /bids?solicitation_id=${sol_id} as ProcurementOfficer returns total_count == 2, so the refused bid was never created"
            - "the third call returns total_count == 1 and exactly the id ${bid1_id}"
            - "GET /solicitations/${sol_id} as Contractor with X-User-ID ${c1_id} returns HTTP 200: the solicitation is not owned by any contractor"
            - "Bid.${bid1_id}.evaluated_unit_cost_cents == 7040000 and Bid.${bid2_id}.evaluated_unit_cost_cents == 8000000"

      - name: segregation_of_duties_blocks_the_creator_from_awarding_and_the_committer_from_disbursing
        claim_type: Segregation of duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.AwardAuthority.permissions
          - roles.FundingOfficer.permissions
        distinguishing_aspect: |
          Both duty separations compare the acting X-User-ID against a stored actor field rather than
          against a role: the award is refused when the acting user equals the solicitation's
          created_by_user_id even though the acting role is AwardAuthority, and the disbursement is
          refused when the acting user equals the allocation's committed_by_user_id even though the
          acting role is FundingOfficer. A second user in the same role then succeeds on both.
        test_recipe:
          setup:
            - "one ORPHAN_CONFIRMED well, one CLOSED solicitation created by u_proc with one RESPONSIVE bid"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
