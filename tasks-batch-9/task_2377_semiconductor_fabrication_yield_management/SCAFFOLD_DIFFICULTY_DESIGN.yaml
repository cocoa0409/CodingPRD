              as_user_id: "u_pe_1"
              captures: { r_cmp: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-C", product_family: "MEMORY_D1" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_c: $.data.id }
            - call: "POST /fab/process-flows/${flow_c}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { c10: $.data.id }
            - call: "POST /fab/process-flows/${flow_c}/steps"
              payload: { recipe_id: "${r_cmp}", step_seq: 20, step_name: "CMP-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { c20: $.data.id }
            - call: "POST /fab/process-flows/${flow_c}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_c_tsh: $.data.total_standard_hours }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 0.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/operators"
              payload: { badge_id: "OP-001", full_name: "Op One", certified_tool_types: ["LITHO", "ETCH", "CMP"] }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { op1: $.data.id }
            - call: "PATCH /fab/operators/${op1}"
              payload: { gown_state: "GOWNED" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_c}", product_family: "MEMORY_D1", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 10, capacity_budget_hours: 100.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_c: $.data.id }
            - call: "POST /fab/wafer-start-plans/${plan_c}/commit"
              payload: {}
              as: FabPlanner
