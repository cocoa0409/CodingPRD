        grounds:
          - validations[priority=7]
          - state_machines.EggDonor.DRAFT_to_SUBMITTED
          - entities.EggDonor.fields.donor_code
        distinguishing_aspect: "Aggregate-occupancy interval semantics on the EggDonor resource pool: a donor_code may only be occupied by ONE non-terminal donor (intake_status IN {SUBMITTED, SCREENING, CLEARED}); a second submit of the same code collides while that window is occupied — different resource and different (set-membership, not point-slot) interval semantics than instance 1."
