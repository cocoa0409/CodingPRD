      - name: qa_score_and_defect_penalty_boundaries
        grounds:
          - calculations.qa_conformance_score
          - validations[priority=13]
          - state_machines.LinerQaPackage.UNDER_REVIEW_to_APPROVED
          - entities.LinerQaPackage.fields.qa_conformance_score
        distinguishing_aspect: |
          Two independent boundaries live inside one formula and each is exercised on both
          sides. The approval gate is inclusive at exactly 85.00, so 17 of 20 passing tests
          approves while 16 of 20 (80.00) is refused with a 422. The defect allowance is also
          inclusive: 2 defects over 40 panels is a density of exactly 0.05 and attracts no
          penalty, while 3 over 40 attracts exactly 10.00 points, which is only visible because
          the penalty is rounded BEFORE the subtraction. The coverage factor is capped at 1.0
          in every case, so 20 destructive tests against 8 required never inflate the score
          above 100.
        test_recipe:
          setup:
            - "Landfill LF registered."
