        distinguishing_aspect: "Lock reports gross 10000, creator_share 5500, partner_share 4500 and held_cents 0 for a single free routing, and the batch it returns carries status LOCKED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved, one AD routing of 10000 with no claim."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
