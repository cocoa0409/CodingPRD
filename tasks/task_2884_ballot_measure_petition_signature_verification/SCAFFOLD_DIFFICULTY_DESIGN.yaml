  - rule_id: resource_temporal_overlap
    instances:

      - name: cure_period_half_open_adjacency_allowed_on_petition
        grounds:
          - entities.CurePeriod
          - calculations.cure_target_computation
          - validations[priority=14]
          - errors[ERR_CURE_PERIOD_OVERLAP]
          - endpoints[POST /petitions/{petition_id}/cure-periods]
          - state_machines.CurePeriod.OPEN_to_CLOSED_INSUFFICIENT
        distinguishing_aspect: |
          Interval semantics: the resource is the Petition's cure calendar and each CurePeriod
          occupies the HALF-OPEN interval [opened_at, deadline_at). Adjacency is therefore legal — a
          period opened exactly at the previous period's deadline_at must be accepted — while any
          instant strictly inside the earlier interval is refused with ERR_CURE_PERIOD_OVERLAP, and a
          CLOSED_INSUFFICIENT period still occupies its interval. The two accepted/refused instants
          are one boundary apart, so an implementation using a closed interval rejects the adjacent
          period and one that drops closed periods from the check accepts the overlapping one.
