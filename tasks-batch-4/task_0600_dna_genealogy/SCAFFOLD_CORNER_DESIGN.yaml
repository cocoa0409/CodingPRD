      - name: tree_person_self_ancestor_link_returns_tree_cycle
        claim_type: Violation → Error
        grounds: ["validations[priority=21]", "errors[ERR_TREE_CYCLE]", entities.TreePerson.fields.father_id]
        distinguishing_aspect: "A person whose father_id points at a person from a DIFFERENT tree is rejected with ERR_TREE_CYCLE (422) — the same rule that guards self-ancestry in the self-referential parent graph."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer on PLUS owns two trees; tree A has one person P_A, tree B is empty."]
          setup_api_calls:
