          - state_machines.TourStop.initial_PLANNED
          - state_machines.SiteBooking.initial_HELD
          - state_machines.Volunteer.initial_PENDING
          - state_machines.StaffAssignment.initial_PROPOSED
        distinguishing_aspect: "Eight machines are declared and each entity must be born in its own initial state — including the Member's SECOND, parallel medical dimension, which starts CLEARED while membership_status starts APPLICANT."
        test_recipe:
          setup: ["A season, a host school and a SIGNED tour-rehearsal agreement exist so that a SiteBooking can be created."]
          setup_api_calls:
