            - "pricing_variant == PRORATED; naive day-ratio would give 4880 and unrounded-weekly order would give 4909 — both wrong"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: game_score_fork_join_dispute
        grounds:
          - state_machines.Game.SCHEDULED_to_PLAYED_PENDING_CONFIRM
          - state_machines.Game.PLAYED_PENDING_CONFIRM_to_DISPUTED
          - state_machines.Game.DISPUTED_to_FINAL
        distinguishing_aspect: |
          Game machine is a fork-join: the FIRST captain report forks SCHEDULED -> PLAYED_PENDING_CONFIRM; the SECOND
          report joins to FINAL only on exact score match, else diverges to DISPUTED whose side-effect set (no standings,
          both reports retained) differs from the join branch — a non-linear machine on Game (sibling uses Team's cycle).
        test_recipe:
          setup:
            - "2-team league IN_SEASON; game Tue 2026-09-08 18:00-19:30; clock at 2026-09-08T20:00:00Z (after start)"
          setup_api_calls:
