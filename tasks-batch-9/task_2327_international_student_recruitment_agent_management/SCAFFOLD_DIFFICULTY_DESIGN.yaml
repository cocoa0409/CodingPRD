  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fraud_index_flag_boundary_at_exactly_sixty
        grounds:
          - calculations.application_fraud_signal_index
          - state_machines.ApplicationDocument.PENDING_to_FLAGGED
          - entities.ApplicationDocument.fields.fraud_index
          - entities.StudentApplication.fields.integrity_hold
        distinguishing_aspect: |
          Boundary on the integer fraud index at the FLAG_THRESHOLD of 60: a document whose
          signals weigh exactly 25+20+15 = 60 is auto-FLAGGED and sets integrity_hold, while a
          sibling document weighing 25+20+10 = 55 stays PENDING - the inclusive >= comparison
          is what separates them.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED / GOOD_STANDING; application a1 is DRAFT with no documents yet."
            - "No other application of this agency exists, so no content_hash can raise HASH_DUPLICATE."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Sunrise Education Consultants", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
