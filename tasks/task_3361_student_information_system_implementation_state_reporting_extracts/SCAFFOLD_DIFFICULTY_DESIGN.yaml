      - name: roster_capacity_full_rejects_next_add
        grounds:
          - calculations.roster_seat_tracking
          - validations[priority=9]
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: "Boundary on the roster-count metric (integer seat count, a different metric than the absence rate and a different endpoint): the add that would take roster_count from == capacity to capacity+1 is rejected, while the add reaching exactly capacity succeeds."
