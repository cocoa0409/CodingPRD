  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: order_cash_conservation_holds_after_proportional_partial_refund
        grounds:
          - calculations.refund_routing_waterfall
          - entities.Order.fields.net_charged_cents
          - entities.Order.fields.employer_net_cents
          - entities.RefundLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Post-settlement CASH CONSERVATION that must hold across three independent readings:
          gross_total 4363 == net_charged 3363 + employer_refunded 573 + employee_refunded 427;
          employer_covered 2500 == employer_net 1927 + 573; and the two ledger rows sum per direction
          to exactly those refund figures. An implementation that rounds the proportional split
          independently on each side breaks at least one of the three.
        test_recipe:
          setup:
            - "Program / Engineering / HQ dock / Thai Garden / Ada with an OPEN 2026-08 period."
            - "Ada's 3 x 1000 order with tip 200 is DELIVERED: gross_total 4363, employer_covered 2500, employee_card 1863."
            - "A MISSING_ITEM claim of 1000 on line 0 is resolved APPROVE / PROPORTIONAL by ctrl-resolver."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}", captures: { ord1_v: $.data.version } }
            - { call: "POST /credit-claims", payload: { order_id: "${ord1_id}", claim_type: "MISSING_ITEM", claimed_cents: 1000, line_index: 0 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { clm1_id: $.data.id } }
            - { call: "POST /credit-claims/${clm1_id}/resolve", payload: { decision: "APPROVE", approved_cents: 1000, routing_basis: "PROPORTIONAL", expected_order_version: "${ord1_v}" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
          trigger:
            - { call: "POST /credit-claims/${clm1_id}/settle", as: BenefitsController, as_user_id: "ctrl-settler" }
            - { call: "GET /orders/${ord1_id}", as: BenefitsController }
            - { call: "GET /orders/${ord1_id}/refund-entries", as: BenefitsController }
          assert:
            - "Order.${ord1_id}.gross_total_cents 4363 == net_charged_cents 3363 + employer_refunded_cents 573 + employee_refunded_cents 427"
            - "Order.${ord1_id}.employer_covered_cents 2500 == employer_net_cents 1927 + employer_refunded_cents 573"
            - "employee_card_cents 1863 - employee_refunded_cents 427 == 1436, and net_charged_cents 3363 == 1927 + 1436"
            - "the EMPLOYER_CREDIT ledger rows for ${ord1_id} sum to exactly 573 and the EMPLOYEE_CARD_REFUND rows to exactly 427"
            - "CreditClaim.${clm1_id}.employer_credit_cents 573 + employee_refund_cents 427 == approved_cents 1000"

