            - { call: "POST /talent/sessions/${s2}/cancel", as: HiringManager, as_user_id: hm-1 }
            - { call: "GET /talent/interviewers/${iv1}", as: TalentAssessmentAdmin, captures: { m4: $.data.committed_minutes_total } }
          assert:
            - "m0 == 0; after booking 60 min: m1 == 60; after booking 90 min: m2 == 150 (invariant holds at each step)"
            - "cancel s1: m3 == 90; cancel s2: m4 == 0 — forward+compensating pair returns the conserved quantity to its exact initial value"

      - name: vendor_content_ledger_distribute_destroy_compensation
        grounds:
          - calculations.vendor_content_ledger
          - entities.AssessmentVendor.fields.content_copies_outstanding
          - errors[ERR_CONTENT_LEDGER_NEGATIVE]
          - errors[ERR_CONTENT_COPIES_OUTSTANDING]
        distinguishing_aspect: |
          Different conserved quantity: vendor content copies. INVARIANT:
          content_copies_outstanding == sum(DISTRIBUTE.copies) - sum(DESTROY.copies);
          DISTRIBUTE 10 then DESTROY 10 returns it to 0; a DESTROY beyond the balance is
          rejected (ERR_CONTENT_LEDGER_NEGATIVE) and terminate is blocked while outstanding > 0.
        test_recipe:
          setup: ["Vendor v ACTIVE, content_copies_outstanding == 0"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "GET /talent/vendors/${v}", as: TalentAssessmentAdmin, captures: { l0: $.data.content_copies_outstanding } }
          trigger:
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DISTRIBUTE", copies: 10, note: "Shipped workbooks to client site." }, as: TalentAssessmentAdmin, captures: { ev1: $.data.id } }
            - { call: "GET /talent/vendors/${v}", as: TalentAssessmentAdmin, captures: { l1: $.data.content_copies_outstanding } }
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DESTROY", copies: 4, note: "Certified destruction batch one." }, as: VendorRepresentative, as_user_id: "${v}", captures: { ev2: $.data.id } }
            - { call: "GET /talent/vendors/${v}", as: TalentAssessmentAdmin, captures: { l2: $.data.content_copies_outstanding } }
            - { call: "POST /talent/vendors/${v}/terminate", as: TalentAssessmentAdmin, captures: { err_term: $.data.error_id } }
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DESTROY", copies: 6, note: "Certified destruction batch two." }, as: VendorRepresentative, as_user_id: "${v}" }
            - { call: "GET /talent/vendors/${v}", as: TalentAssessmentAdmin, captures: { l3: $.data.content_copies_outstanding } }
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DESTROY", copies: 1, note: "One copy too many." }, as: VendorRepresentative, as_user_id: "${v}", captures: { err_neg: $.data.error_id } }
            - { call: "POST /talent/vendors/${v}/terminate", as: TalentAssessmentAdmin, captures: { vst: $.data.status } }
          assert:
            - "l0 == 0; after DISTRIBUTE 10: l1 == 10; after DESTROY 4: l2 == 6 (invariant: 10 - 4)"
            - "terminate at outstanding 6 rejected: err_term == ERR_CONTENT_COPIES_OUTSTANDING"
