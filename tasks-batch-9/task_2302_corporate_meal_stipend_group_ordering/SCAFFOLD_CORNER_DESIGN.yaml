      - name: fee_constants_apply_at_the_free_delivery_threshold_and_the_service_fee_floor
        claim_type: constants_applied
        grounds:
          - calculations.order_fee_assessment
          - calculations.order_fee_assessment.constants.FREE_DELIVERY_THRESHOLD_CENTS
          - calculations.order_fee_assessment.constants.SERVICE_FEE_MIN_CENTS
        distinguishing_aspect: "Three orders in the same period pin the declared constants: subtotal 1000 pays DELIVERY_FEE_BASE_CENTS 599 with a 100 service fee, subtotal 4000 pays 0 delivery because it reaches FREE_DELIVERY_THRESHOLD_CENTS 3500, and subtotal 500 has its 50-cent raw service fee lifted to the SERVICE_FEE_MIN_CENTS floor of 99."
