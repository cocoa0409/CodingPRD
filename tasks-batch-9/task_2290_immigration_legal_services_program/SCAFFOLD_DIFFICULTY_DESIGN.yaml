          assert:
            - "step 1 returns HTTP 200; InterpretationSession ${s1_id}.billed_minutes == 30 (max(30, ceil(22/15)*15) == max(30, 30)) and billable_cents == 5463 (9500 * 30/60 * 1.15 == 5462.5, round_half_up)."
