# =============================================================================
# Task 1476 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 claims not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Names are unique across both design files. All times are logical-clock times
# (server default 2026-08-01T00:00:00Z before any /api/_clock/set_current_utc call).
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: creation_applies_defaults_and_computed_minor_flag
        claim_type: creation_defaults
        grounds: [entities.Volunteer]
        distinguishing_aspect: "New volunteers start PENDING / UNSIGNED / GOOD with version 1; is_minor is computed against the logical clock (adult DOB false, youth DOB true); client input cannot set system fields."
        test_recipe:
          setup: ["empty database, default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/volunteers", payload: { full_name: "Adult", email: "a@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { va: $.data.id, va_minor: $.data.is_minor, va_orient: $.data.orientation_status, va_waiver: $.data.waiver_status, va_stand: $.data.standing, va_v: $.data.version } }
            - { call: "POST /api/volunteers", payload: { full_name: "Teen", email: "t@x.com", date_of_birth: "2012-03-01" }, as: GardenAdmin, captures: { vt_minor: $.data.is_minor } }
          assert:
            - "va_orient == PENDING and va_waiver == UNSIGNED and va_stand == GOOD and va_v == 1"
            - "va_minor == false (age 36 at clock) and vt_minor == true (age 14 at clock)"
            - "va service counters: total_service_minutes == 0, no_show_count == 0, held_key_count == 0"

      - name: minor_flag_flips_on_eighteenth_birthday
        claim_type: computed_field
        grounds: [entities.Volunteer.fields.is_minor]
        distinguishing_aspect: "is_minor is derived from the logical clock, not stored: at 2026-08-13 a volunteer born 2008-08-14 is still a minor; at 2026-08-14 (the 18th birthday) the same record reads false without any write."
        test_recipe:
          setup: ["volunteer with date_of_birth 2008-08-14"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/volunteers", payload: { full_name: "Bday", email: "b@x.com", date_of_birth: "2008-08-14" }, as: GardenAdmin, captures: { v_id: $.data.id, m_before: $.data.is_minor } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: GardenAdmin }
            - { call: "GET /api/volunteers/${v_id}", as: GardenAdmin, captures: { m_after: $.data.is_minor } }
          assert:
            - "m_before == true (17y364d at 2026-08-13)"
            - "m_after == false (exactly 18 at 2026-08-14 — the '<' boundary flips on the birthday)"

      - name: create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input 'email' on volunteer create fails shape validation (priority 5) before any business rule."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/volunteers", payload: { full_name: "No Email", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"

      - name: create_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=5]", entities.GardenBed.fields.sun_exposure]
        distinguishing_aspect: "sun_exposure 'BRIGHT' is not in {FULL, PARTIAL, SHADE} — enum membership is a priority-5 shape check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/beds", payload: { bed_code: "B-X", size_sq_ft: 50, sun_exposure: "BRIGHT", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"

      - name: system_fields_input_ignored_on_create
        claim_type: system_fields
        grounds: [entities.Volunteer]
        distinguishing_aspect: "Client-supplied id/version/total_service_minutes in a create payload are ignored: server mints a fresh UUID id and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/volunteers", payload: { id: "00000000-0000-0000-0000-000000000000", version: 99, full_name: "Fake Id", email: "fake@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { rid: $.data.id, rv: $.data.version } }
          assert:
            - "rid != '00000000-0000-0000-0000-000000000000' (server-minted)"
            - "rv == 1"

      - name: get_by_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_BED_NOT_FOUND]", "errors[ERR_VOLUNTEER_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Existence (priority 3) fires for path ids before any state or business logic; each entity family reports its own error id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/beds/11111111-2222-3333-4444-555555555555", as: GardenAdmin, captures: { err_bed: $.data.error_id } }
            - { call: "GET /api/volunteers/11111111-2222-3333-4444-555555555555", as: GardenAdmin, captures: { err_vol: $.data.error_id } }
          assert:
            - "err_bed == ERR_BED_NOT_FOUND (HTTP 404)"
            - "err_vol == ERR_VOLUNTEER_NOT_FOUND (HTTP 404)"

      - name: body_fk_must_exist_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=3]", "errors[ERR_SHIFT_SLOT_NOT_FOUND]", "errors[ERR_BED_NOT_FOUND]"]
        distinguishing_aspect: "Body FK references are validated after path ids: a signup against a non-existent slot and a crop plan against a non-existent bed both 404 with the referenced entity's error."
        test_recipe:
          setup: ["volunteer V1 exists (oriented+signed so later gates would pass — isolating existence)"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
          trigger:
            - { call: "POST /api/shift-signups", payload: { slot_id: "11111111-2222-3333-4444-555555555555", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err_slot: $.data.error_id } }
            - { call: "POST /api/crop-plans", payload: { season_id: "11111111-2222-3333-4444-555555555555", bed_id: "${v1_id}", proposer_volunteer_id: "${v1_id}", crop_type: "X", plant_family: "Y", requested_sq_ft: 5, planned_start_date: "2026-08-01", planned_end_date: "2026-08-10" }, as: GardenAdmin, captures: { err_season: $.data.error_id } }
          assert:
            - "err_slot == ERR_SHIFT_SLOT_NOT_FOUND"
            - "err_season == ERR_SEASON_NOT_FOUND (body FKs validated left-to-right: season_id before bed_id)"

      - name: list_pagination_limit_offset_and_filter
        claim_type: listing
        grounds: [response_envelope, entities.Volunteer]
        distinguishing_aspect: "Pagination envelope carries total_count and has_more; limit pages deterministically; a standing filter scopes the result set."
        test_recipe:
          setup: ["three volunteers exist; V3 moved to PROBATION"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V Two", email: "v2@x.com", date_of_birth: "1990-05-21" }, as: GardenAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V Three", email: "v3@x.com", date_of_birth: "1990-05-22" }, as: GardenAdmin, captures: { v3_id: $.data.id } }
            - { call: "POST /api/volunteers/${v3_id}/standing", payload: { to_state: "PROBATION" }, as: GardenAdmin }
          trigger:
            - { call: "GET /api/volunteers", payload: { limit: 2, offset: 0 }, as: GardenAdmin, captures: { page1: $.data } }
            - { call: "GET /api/volunteers", payload: { limit: 2, offset: 2 }, as: GardenAdmin, captures: { page2: $.data } }
            - { call: "GET /api/volunteers", payload: { standing: "PROBATION" }, as: GardenAdmin, captures: { filt: $.data } }
          assert:
            - "page1 returns exactly 2 items with total_count == 3 and has_more == true"
            - "page2 returns exactly 1 item with total_count == 3 and has_more == false"
            - "filt returns exactly 1 item (V3) with total_count == 1"
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: season_open_enrollment_guard_and_invalid_skip_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.DRAFT_to_OPEN_ENROLLMENT, "errors[ERR_SEASON_GUARD_ACTIVE_BED_REQUIRED]", "errors[ERR_INVALID_SEASON_STATE]"]
        distinguishing_aspect: "New seasons start DRAFT; DRAFT->OPEN_ENROLLMENT requires a serviceable bed; a skip to GROWING from DRAFT is an invalid-transition error."
        test_recipe:
          setup: ["one season, no beds yet"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin, captures: { err_guard: $.data.error_id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin, captures: { err_skip: $.data.error_id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin, captures: { st1: $.data.status } }
          assert:
            - "st0 == DRAFT (initial state)"
            - "err_guard == ERR_SEASON_GUARD_ACTIVE_BED_REQUIRED (no bed exists)"
            - "err_skip == ERR_INVALID_SEASON_STATE (DRAFT -> GROWING is not a declared transition)"
            - "after bed creation: st1 == OPEN_ENROLLMENT"

      - name: season_revert_blocked_after_activity
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.OPEN_ENROLLMENT_to_DRAFT, "errors[ERR_SEASON_REVERT_BLOCKED]"]
        distinguishing_aspect: "OPEN_ENROLLMENT -> DRAFT is the only revert on Season and is guarded: any referencing slot blocks it; with zero children it succeeds (cyclic edge exercised both ways)."
        test_recipe:
          setup: ["season OPEN_ENROLLMENT with bed present; one DRAFT slot referencing the season"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
          trigger:
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "DRAFT" }, as: GardenAdmin, captures: { err_blocked: $.data.error_id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "CANCELLED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "DRAFT" }, as: GardenAdmin, captures: { st_revert: $.data.status } }
          assert:
            - "err_blocked == ERR_SEASON_REVERT_BLOCKED while a slot references the season"
            - "after cancelling the slot: st_revert == DRAFT (CANCELLED slots no longer block)"

      - name: season_planting_and_growing_plan_guards
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.OPEN_ENROLLMENT_to_PLANTING, state_machines.Season.PLANTING_to_GROWING, "errors[ERR_CROP_PLANS_UNRESOLVED]"]
        distinguishing_aspect: "Two distinct plan-related guards: PLANTING needs >= 1 plan in {APPROVED, PLANTED}; GROWING needs zero plans left in {PROPOSED, APPROVED}. The same APPROVED plan that unlocks PLANTING blocks GROWING until planted."
        test_recipe:
          setup: ["season OPEN_ENROLLMENT; bed B-01; plan APPROVED (60 sqft)"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin, captures: { err_skip: $.data.error_id } }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin, captures: { err_grow: $.data.error_id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin, captures: { st_plant: $.data.status } }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin, captures: { st_grow: $.data.status } }
          assert:
            - "err_skip == ERR_INVALID_SEASON_STATE (OPEN_ENROLLMENT -> GROWING skips PLANTING)"
            - "err_grow == ERR_CROP_PLANS_UNRESOLVED (an APPROVED-but-not-planted plan blocks GROWING)"
            - "st_plant == PLANTING (the APPROVED plan satisfies the PLANTING guard)"
            - "after planting the plan: st_grow == GROWING"

      - name: season_harvesting_blocked_by_missed_irrigation
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.GROWING_to_HARVESTING, state_machines.IrrigationSchedule.SCHEDULED_to_MISSED, "errors[ERR_IRRIGATION_UNRESOLVED]"]
        distinguishing_aspect: "An irrigation window that passed without a meter log flips to MISSED at the scheduler epoch and blocks GROWING -> HARVESTING; a late log-meter clears the guard."
        test_recipe:
          setup: ["season GROWING (plan planted); irrigation S1 Z1 [2026-08-20 10:00-11:00] planned 50 SCHEDULED; clock advanced past the window and epoch run so S1 is MISSED"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:00:00Z", planned_end_at: "2026-08-20T11:00:00Z", planned_gallons: 50, expected_season_version: "${sv}" }, as: GardenAdmin, captures: { irr_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/_scheduler/run_epoch", as: GardenAdmin }
          trigger:
            - { call: "GET /api/irrigation-schedules/${irr_id}", as: GardenAdmin, captures: { irr_st: $.data.status } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin, captures: { err_harv: $.data.error_id } }
            - { call: "POST /api/irrigation-schedules/${irr_id}/log-meter", payload: { gallons_actual: 45 }, as: GardenAdmin, captures: { irr_st2: $.data.status } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin, captures: { st_harv: $.data.status } }
          assert:
            - "irr_st == MISSED (epoch after planned_end_at with no meter log)"
            - "err_harv == ERR_IRRIGATION_UNRESOLVED"
            - "irr_st2 == LOGGED (late log from MISSED is allowed)"
            - "st_harv == HARVESTING after the late log clears the guard"

      - name: season_reconciliation_blocked_by_submitted_log_then_pending_allocation
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.HARVESTING_to_RECONCILIATION, "errors[ERR_HARVEST_LOGS_UNVERIFIED]", "errors[ERR_ALLOCATIONS_PENDING]"]
        distinguishing_aspect: "Two ordered guards on the same transition: a SUBMITTED log blocks with ERR_HARVEST_LOGS_UNVERIFIED; after verification a PENDING allocation blocks the same transition with ERR_ALLOCATIONS_PENDING."
        test_recipe:
          setup: ["full pipeline to season HARVESTING, bed HARVEST_OPEN; certified logger V1; log VERIFIED after first guard check; recipient R1"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "Officer", email: "o@x.com", date_of_birth: "1985-01-01" }, as: GardenAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/certifications", payload: { volunteer_id: "${v1_id}", cert_type: "PRODUCE_SAFETY", expires_at: "2027-08-01T00:00:00Z" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
