# =============================================================================
# Scaffold: Pharmacy Compounding (503A/503B) — Expert tier
# =============================================================================

scenario: |
  416. Pharmacy Compounding (503A/503B): formula/master record & beyond-use
  dating, ingredient lot & potency, USP <795>/<797> environmental log, batch
  production & yield, prescription vs office-use (503B), QC/endotoxin testing,
  recall & anticipatory-compounding limit, labeling

domain_name: pharmacy-compounding
api_prefix: /pharmacy-compounding

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine          # beyond-use-dating + yield reconciliation behave like a pricing engine
  complexity_layers:
    - dual_variant_calculation                 # BUD: 503A patient-specific vs 503B office-use windows
    - cascading_side_effects                    # recall cascade, QC-fail lot-quarantine cascade, reject restock cascade
    - rate_threshold_triggers                   # anticipatory rolling limit, endotoxin EU/unit limit, yield-variance band
    - optimistic_concurrency                    # batch release vs stale-version
    - derived_field_reconciliation              # lot remaining_grams, anticipatory ledger consumed_units, prescription units_dispensed

  entity_topology: flat
  # All collections are top-level siblings under /pharmacy-compounding, linked by
  # foreign keys (facility_id, master_formulation_record_id, compounding_batch_id,
  # ingredient_lot_id, prescription_id, finished_preparation_id) carried in the
  # body or as list filters — no parent ids in URL paths beyond the resource's own.

  state_machine_shape: parallel
  # FinishedPreparation carries two independent dimensions (qc_status × dispense_status)
  # plus a RECALLED override; CompoundingBatch is branching-with-revert (reprocess loop);
  # Recall is cyclic (reopen loop).

  relationship_patterns:
    - one_to_many          # Facility -> MasterFormulationRecord, IngredientLot, CompoundingBatch, ...
    - many_to_many         # CompoundingBatch <-> IngredientLot via BatchIngredientUsage junction
    - cross_aggregate      # FinishedPreparation/Dispense reference Prescription across the batch tree
    - self_referential     # IngredientLot.parent_lot_id (a split/re-assayed lot references its source)

  role_model: segregation_of_duties
  # The pharmacist who COMPILES a batch (compiled_by_user_id) may not be the one
  # who RELEASES it (released_by_user_id); enforced as a compliance control.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: registration_type, type: enum, source: input, description: "503A patient-specific pharmacy or 503B registered outsourcing facility", constraints: "one of {503A, 503B}" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of licensure" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic facility clock; advanced only via the clock-set endpoint" }

  - name: MasterFormulationRecord
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "Preparation/formula name (e.g. 'Progesterone 100mg/mL Injection')" }
      - { name: dosage_form, type: enum, source: input, description: "Route/dosage form", constraints: "one of {ORAL_SOLID, ORAL_LIQUID, TOPICAL, NONSTERILE_OTHER, STERILE_AQUEOUS, STERILE_NONAQUEOUS}" }
      - { name: is_sterile, type: boolean, source: computed, description: "True when dosage_form starts with STERILE_; governs whether USP <797> applies and whether STERILITY+ENDOTOXIN QC are required" }
      - { name: default_bud_days_nonsterile, type: integer, source: input, description: "Base USP <795> beyond-use days for nonsterile forms", constraints: ">= 1" }
      - { name: theoretical_yield_units, type: integer, source: input, description: "Nominal finished units a full batch yields", constraints: ">= 1" }
      - { name: anticipatory_window_days, type: integer, source: input, default: 30, description: "Rolling window (days) over which OFFICE_USE anticipatory compounding is capped for 503B", constraints: ">= 1" }
      - { name: anticipatory_max_units, type: integer, source: input, description: "Max finished units producible for OFFICE_USE within the rolling window (503B)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RETIRED; RETIRED records accept no new batch starts", constraints: "one of {ACTIVE, RETIRED}" }

  - name: IngredientLot
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: parent_lot_id, type: string, source: input, required: false, description: "FK -> IngredientLot.id; set when this lot is a split/re-assayed child of a source lot" }
      - { name: component_name, type: string, source: input, description: "API/excipient chemical name" }
      - { name: lot_number, type: string, source: input, description: "Supplier lot number" }
      - { name: labeled_potency_pct, type: number, source: input, description: "Certificate-of-analysis assayed potency as percent of label (e.g. 99.4)", constraints: "0 < x <= 200" }
      - { name: endotoxin_eu_per_mg, type: number, source: input, default: 0, description: "Measured endotoxin burden of the raw component (EU/mg); relevant only for sterile compounding", constraints: ">= 0" }
      - { name: initial_grams, type: number, source: input, description: "Grams received into inventory", constraints: "> 0" }
      - { name: remaining_grams, type: number, source: computed, description: "= initial_grams - sum(grams_used over BatchIngredientUsage rows whose batch.status != REJECTED and != DRAFT)" }
      - { name: expiration_utc, type: datetime, source: input, description: "Manufacturer expiration date of the component" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> QUARANTINED -> (AVAILABLE | DISCARDED); EXPIRED set lazily by the clock check", constraints: "one of {AVAILABLE, QUARANTINED, EXPIRED, DISCARDED}" }

  - name: EnvironmentalLog
    parent: Facility
    common_fields: false
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: usp_chapter, type: enum, source: input, description: "Which USP chapter this reading documents", constraints: "one of {USP_795, USP_797}" }
      - { name: reading_type, type: enum, source: input, description: "Monitored parameter", constraints: "one of {ISO_PARTICLE_COUNT, VIABLE_AIR_CFU, SURFACE_CFU, ROOM_TEMP_C, ROOM_HUMIDITY_PCT}" }
      - { name: measured_value, type: number, source: input, description: "Numeric reading" }
      - { name: action_limit, type: number, source: input, description: "Upper action limit for this reading_type" }
      - { name: in_spec, type: boolean, source: computed, description: "= measured_value <= action_limit (all monitored parameters here are upper-bounded)" }
      - { name: reading_utc, type: datetime, source: system, description: "Facility clock value at the moment the reading was logged" }

  - name: Prescription
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: master_formulation_record_id, type: string, source: input, description: "FK -> MasterFormulationRecord.id; the formula prescribed" }
      - { name: patient_name, type: string, source: input, description: "Named patient (503A patient-specific requirement)" }
      - { name: prescriber_npi, type: string, source: input, description: "Prescriber National Provider Identifier" }
      - { name: units_prescribed, type: integer, source: input, description: "Finished units the prescription authorizes", constraints: ">= 1" }
      - { name: units_dispensed, type: integer, source: computed, default: 0, description: "Running total of finished units dispensed against this prescription" }
      - { name: written_utc, type: datetime, source: input, description: "Date prescription was written" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> (FILLED | CANCELLED); EXPIRED set lazily 180 days after written_utc", constraints: "one of {ACTIVE, FILLED, CANCELLED, EXPIRED}" }

  - name: CompoundingBatch
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: master_formulation_record_id, type: string, source: input, description: "FK -> MasterFormulationRecord.id; the formula compounded" }
      - { name: purpose, type: enum, source: input, description: "PRESCRIPTION (503A patient-specific) or OFFICE_USE (503B anticipatory/office stock)", constraints: "one of {PRESCRIPTION, OFFICE_USE}" }
      - { name: prescription_id, type: string, source: input, required: false, description: "FK -> Prescription.id; REQUIRED when purpose=PRESCRIPTION, FORBIDDEN when purpose=OFFICE_USE" }
      - { name: compiled_by_user_id, type: string, source: computed, description: "X-User-ID of the pharmacist who COMPILED the batch (set on IN_PROCESS->COMPILED)" }
      - { name: released_by_user_id, type: string, source: computed, description: "X-User-ID of the pharmacist who RELEASED the batch (must differ from compiled_by_user_id)" }
      - { name: theoretical_yield_units, type: integer, source: computed, description: "Snapshot of MFR.theoretical_yield_units at batch creation" }
      - { name: actual_yield_units, type: integer, source: input, required: false, description: "Operator-counted finished units, supplied at COMPILE", constraints: ">= 0" }
      - { name: yield_variance_pct, type: number, source: computed, description: "= round(100 * (actual_yield_units - theoretical_yield_units) / theoretical_yield_units, 2); negative = under-yield" }
      - { name: released_at_utc, type: datetime, source: computed, description: "Facility clock value captured at the RELEASE transition; anchors the anticipatory rolling window" }
      - { name: assigned_bud_utc, type: datetime, source: computed, description: "Beyond-use datetime stamped onto every FinishedPreparation produced by this batch (see bud_assignment calc)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_PROCESS -> COMPILED -> QUARANTINED -> (RELEASED | REJECTED); QUARANTINED->IN_PROCESS reprocess loop; RELEASED->RECALLED", constraints: "one of {DRAFT, IN_PROCESS, COMPILED, QUARANTINED, RELEASED, REJECTED, RECALLED}" }

  - name: BatchIngredientUsage
    parent: CompoundingBatch
    common_fields: true
    fields:
      - { name: compounding_batch_id, type: string, source: input, description: "FK -> CompoundingBatch.id" }
      - { name: ingredient_lot_id, type: string, source: input, description: "FK -> IngredientLot.id; the lot drawn from" }
      - { name: grams_used, type: number, source: input, description: "Grams of this lot charged to the batch", constraints: "> 0" }
      - { name: potency_adjusted_grams, type: number, source: computed, description: "= round(grams_used * (lot.labeled_potency_pct / 100), 4); effective active grams after potency correction" }

  - name: QualityControlTest
    parent: CompoundingBatch
    common_fields: true
    fields:
      - { name: compounding_batch_id, type: string, source: input, description: "FK -> CompoundingBatch.id" }
      - { name: test_type, type: enum, source: input, description: "QC test category", constraints: "one of {POTENCY_ASSAY, STERILITY, ENDOTOXIN, VISUAL_INSPECTION}" }
      - { name: measured_value, type: number, source: input, required: false, description: "Numeric result (assayed potency %, endotoxin EU/mg); omitted for pass/fail-only tests" }
      - { name: lower_limit, type: number, source: input, required: false, description: "Inclusive lower acceptance bound (e.g. 90 for potency)" }
      - { name: upper_limit, type: number, source: input, required: false, description: "Inclusive upper acceptance bound (e.g. 110 for potency)" }
      - { name: result, type: enum, source: system, description: "PENDING -> IN_PROGRESS -> (PASSED | FAILED); auto-evaluated against limits when measured_value present", constraints: "one of {PENDING, IN_PROGRESS, PASSED, FAILED}" }

  - name: FinishedPreparation
    parent: CompoundingBatch
    common_fields: true
    fields:
      - { name: compounding_batch_id, type: string, source: input, description: "FK -> CompoundingBatch.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: unit_serial, type: string, source: system, description: "Per-unit serial minted by the system at compile (e.g. <batchprefix>-0001)" }
      - { name: label_text, type: string, source: computed, description: "Computed label string (see label_text_generation calc): name, lot, BUD, plus '503B OUTSOURCING — OFFICE USE ONLY' or patient/prescriber for PRESCRIPTION" }
      - { name: beyond_use_utc, type: datetime, source: computed, description: "Snapshot of batch.assigned_bud_utc at preparation creation" }
      - { name: qc_status, type: enum, source: system, description: "Parallel dimension: AWAITING_QC -> (QC_RELEASED | QC_REJECTED); follows parent batch RELEASE/REJECT", constraints: "one of {AWAITING_QC, QC_RELEASED, QC_REJECTED}" }
      - { name: dispense_status, type: enum, source: system, description: "Parallel dimension: IN_INVENTORY -> DISPENSED; RECALLED override supersedes both", constraints: "one of {IN_INVENTORY, DISPENSED, RECALLED}" }

  - name: Dispense
    parent: FinishedPreparation
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: finished_preparation_id, type: string, source: input, description: "FK -> FinishedPreparation.id; the specific unit handed out" }
      - { name: prescription_id, type: string, source: input, required: false, description: "FK -> Prescription.id; REQUIRED for 503A PRESCRIPTION units, FORBIDDEN for 503B OFFICE_USE units" }
      - { name: office_account_name, type: string, source: input, required: false, description: "Receiving clinic/office name; REQUIRED for OFFICE_USE distribution, FORBIDDEN for PRESCRIPTION" }
      - { name: dispensed_utc, type: datetime, source: system, description: "Facility clock value at dispense time" }

  - name: AnticipatoryLimitLedger
    parent: MasterFormulationRecord
    common_fields: true
    fields:
      - { name: master_formulation_record_id, type: string, source: input, description: "FK -> MasterFormulationRecord.id; one ledger per formula" }
      - { name: window_start_utc, type: datetime, source: computed, description: "= facility.current_utc - MFR.anticipatory_window_days at the moment of evaluation; rolling window left edge" }
      - { name: consumed_units, type: integer, source: computed, description: "Sum of actual_yield_units over OFFICE_USE batches of the MFR with status==RELEASED whose released_at_utc >= window_start_utc" }
      - { name: remaining_units, type: integer, source: computed, description: "= max(0, MFR.anticipatory_max_units - consumed_units)" }

  - name: Recall
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: compounding_batch_id, type: string, source: input, description: "FK -> CompoundingBatch.id; the batch under recall" }
      - { name: reason, type: enum, source: input, description: "Recall cause", constraints: "one of {STERILITY_FAILURE, POTENCY_OOS, ENDOTOXIN_OOS, ENVIRONMENTAL_EXCURSION, LABELING_ERROR}" }
      - { name: classification, type: enum, source: input, description: "FDA recall class", constraints: "one of {CLASS_I, CLASS_II, CLASS_III}" }
      - { name: units_in_scope, type: integer, source: computed, description: "Count of FinishedPreparations belonging to the batch at recall initiation" }
      - { name: units_reconciled, type: integer, source: computed, default: 0, description: "Count of in-scope units set to dispense_status RECALLED" }
      - { name: status, type: enum, source: system, description: "INITIATED -> IN_PROGRESS -> (RECONCILED -> CLOSED); IN_PROGRESS->INITIATED reopen loop", constraints: "one of {INITIATED, IN_PROGRESS, RECONCILED, CLOSED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CompoundingBatch
    initial_state: DRAFT
    terminal_states: [REJECTED, RECALLED]
    transitions:
      - from: DRAFT
        to: IN_PROCESS
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/start"
        actor: CompoundingPharmacist
        preconditions:
          - "Batch is DRAFT (ERR_BATCH_NOT_IN_STATE)"
          - "MFR.status == ACTIVE (ERR_MFR_RETIRED)"
          - "At least one BatchIngredientUsage exists for the batch (ERR_NO_INGREDIENTS_CHARGED)"
          - "Every charged lot has status AVAILABLE and expiration_utc > facility.current_utc (ERR_LOT_NOT_AVAILABLE)"
          - "Every charged lot has remaining_grams >= its grams_used at this point (ERR_LOT_INSUFFICIENT_GRAMS)"
        side_effects:
          - "For each BatchIngredientUsage: decrement IngredientLot.remaining_grams by grams_used (derived-field reconciliation)"
      - from: IN_PROCESS
        to: COMPILED
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/compile"
        actor: CompoundingPharmacist
        preconditions:
          - "Batch is IN_PROCESS (ERR_BATCH_NOT_IN_STATE)"
          - "actual_yield_units supplied in body and >= 0 (ERR_INVALID_REQUEST)"
          - "yield_variance_pct within [-YIELD_TOLERANCE_PCT, +YIELD_TOLERANCE_PCT] (ERR_YIELD_OUT_OF_RANGE)"
        side_effects:
          - "Set compiled_by_user_id = X-User-ID"
          - "Compute yield_variance_pct (yield_reconciliation calc)"
          - "Compute assigned_bud_utc (bud_assignment calc)"
          - "Mint actual_yield_units FinishedPreparations: qc_status=AWAITING_QC, dispense_status=IN_INVENTORY, beyond_use_utc=assigned_bud_utc, label_text computed (label_text_generation calc), unit_serial minted"
      - from: COMPILED
        to: QUARANTINED
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/quarantine"
        actor: CompoundingPharmacist
        preconditions:
          - "Batch is COMPILED (ERR_BATCH_NOT_IN_STATE)"
        side_effects: []
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/release"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Batch is QUARANTINED (ERR_BATCH_NOT_IN_STATE)"
          - "expected_batch_version matches CompoundingBatch.version (ERR_STALE_VERSION)"
          - "X-User-ID != compiled_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Every required QC test exists and result==PASSED — required = {POTENCY_ASSAY, VISUAL_INSPECTION} always, plus {STERILITY, ENDOTOXIN} when MFR.is_sterile (ERR_QC_INCOMPLETE if missing/not-passed)"
          - "No required QC test result==FAILED (ERR_QC_FAILED)"
          - "For sterile batches: no USP_797 EnvironmentalLog with in_spec==false logged with reading_utc in [batch start, now] (ERR_ENVIRONMENTAL_EXCURSION)"
          - "If purpose==OFFICE_USE: AnticipatoryLimitLedger.remaining_units >= actual_yield_units (ERR_ANTICIPATORY_LIMIT_EXCEEDED)"
        side_effects:
          - "Set released_by_user_id = X-User-ID"
          - "Set released_at_utc = facility.current_utc"
          - "Increment CompoundingBatch.version by 1"
          - "All child FinishedPreparations qc_status AWAITING_QC -> QC_RELEASED"
          - "If purpose==OFFICE_USE: recompute AnticipatoryLimitLedger.consumed_units / remaining_units (anticipatory_consumed_units calc)"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/reject"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Batch is QUARANTINED or COMPILED (ERR_BATCH_NOT_IN_STATE)"
        side_effects:
          - "All child FinishedPreparations qc_status -> QC_REJECTED"
          - "For each BatchIngredientUsage: restore IngredientLot.remaining_grams by grams_used (compensating restock — conserves total grams)"
      - from: COMPILED
        to: REJECTED
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/reject"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Batch is QUARANTINED or COMPILED (ERR_BATCH_NOT_IN_STATE)"
        side_effects:
          - "All child FinishedPreparations qc_status -> QC_REJECTED"
          - "For each BatchIngredientUsage: restore IngredientLot.remaining_grams by grams_used (compensating restock — conserves total grams)"
      - from: QUARANTINED
        to: IN_PROCESS
        trigger: "POST /pharmacy-compounding/compounding-batches/{bid}/reprocess"
        actor: CompoundingPharmacist
        preconditions:
          - "Batch is QUARANTINED (ERR_BATCH_NOT_IN_STATE)"
          - "No FinishedPreparation of this batch has dispense_status==DISPENSED (ERR_BATCH_HAS_DISPENSED_UNITS)"
        side_effects:
          - "Void (delete) all child FinishedPreparations from the prior compile"
          - "Clear compiled_by_user_id, actual_yield_units, yield_variance_pct, assigned_bud_utc"
        note: "Cyclic revert: a quarantined batch may be reworked and re-compiled."
      - from: RELEASED
        to: RECALLED
        trigger: "system: POST /pharmacy-compounding/recalls initiates a recall against this batch"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Batch is RELEASED (ERR_BATCH_NOT_RELEASED)"
        side_effects:
          - "All child FinishedPreparations dispense_status -> RECALLED (overriding IN_INVENTORY or DISPENSED)"
          - "For each previously-DISPENSED unit bound to a 503A Prescription: Prescription.units_dispensed -= 1; if it was FILLED, revert ACTIVE"
          - "If purpose==OFFICE_USE: recompute AnticipatoryLimitLedger.consumed_units (RECALLED batch leaves the window total)"

  - entity: QualityControlTest
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /pharmacy-compounding/qc-tests/{qid}/begin"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Test is PENDING (ERR_QC_NOT_IN_STATE)"
          - "Parent batch status in {COMPILED, QUARANTINED} (ERR_BATCH_NOT_IN_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /pharmacy-compounding/qc-tests/{qid}/record"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Test is IN_PROGRESS (ERR_QC_NOT_IN_STATE)"
          - "Evaluates within limits: for ENDOTOXIN via qc_endotoxin_evaluation calc; for other numeric tests lower_limit <= measured_value <= upper_limit; for pass/fail-only tests the body pass flag is true"
        side_effects:
          - "result -> PASSED"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /pharmacy-compounding/qc-tests/{qid}/record"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Test is IN_PROGRESS (ERR_QC_NOT_IN_STATE)"
          - "Evaluates outside limits (measured_value < lower_limit or > upper_limit, endotoxin projection over ceiling, or body pass flag false)"
        side_effects:
          - "result -> FAILED"
          - "If test_type in {STERILITY, ENDOTOXIN} and parent batch MFR.is_sterile: quarantine every IngredientLot charged to the batch whose status==AVAILABLE (AVAILABLE -> QUARANTINED) as a contamination-trace cascade"

  - entity: FinishedPreparation
    initial_state: AWAITING_QC
    terminal_states: []
    note: "Two parallel dimensions: qc_status (AWAITING_QC -> QC_RELEASED | QC_REJECTED) and dispense_status (IN_INVENTORY -> DISPENSED, with a RECALLED override). They evolve independently until a recall overrides dispense_status."
    transitions:
      - from: AWAITING_QC
        to: QC_RELEASED
        trigger: "system: parent batch QUARANTINED->RELEASED"
        actor: system
        preconditions:
          - "Parent batch transitioned to RELEASED"
        side_effects: []
        note: "qc_status dimension only"
      - from: AWAITING_QC
        to: QC_REJECTED
        trigger: "system: parent batch ->REJECTED"
        actor: system
        preconditions:
          - "Parent batch transitioned to REJECTED"
        side_effects: []
        note: "qc_status dimension only"
      - from: IN_INVENTORY
        to: DISPENSED
        trigger: "POST /pharmacy-compounding/dispenses"
        actor: DispensingPharmacist
        preconditions:
          - "FinishedPreparation.qc_status == QC_RELEASED (ERR_UNIT_NOT_RELEASED)"
          - "FinishedPreparation.dispense_status == IN_INVENTORY (ERR_UNIT_NOT_IN_INVENTORY)"
          - "facility.current_utc <= beyond_use_utc (ERR_BEYOND_USE_DATE_PASSED)"
        side_effects:
          - "dispense_status -> DISPENSED"
          - "If 503A PRESCRIPTION: Prescription.units_dispensed += 1; if units_dispensed == units_prescribed then Prescription ACTIVE->FILLED"
        note: "dispense_status dimension only"
      - from: IN_INVENTORY
        to: RECALLED
        trigger: "system: recall of parent batch"
        actor: system
        preconditions:
          - "Parent batch transitioned to RECALLED"
        side_effects: []
        note: "dispense_status override; supersedes IN_INVENTORY"
      - from: DISPENSED
        to: RECALLED
        trigger: "system: recall of parent batch"
        actor: system
        preconditions:
          - "Parent batch transitioned to RECALLED"
        side_effects:
          - "If unit was DISPENSED against a 503A Prescription: Prescription.units_dispensed -= 1; if Prescription was FILLED revert to ACTIVE"
        note: "dispense_status override"

  - entity: Prescription
    initial_state: ACTIVE
    terminal_states: [FILLED, CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: FILLED
        trigger: "system: units_dispensed reaches units_prescribed on a Dispense"
        actor: system
        preconditions:
          - "Prescription.units_dispensed == units_prescribed after the dispense"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /pharmacy-compounding/prescriptions/{pid}/cancel"
        actor: DispensingPharmacist
        preconditions:
          - "Prescription is ACTIVE (ERR_PRESCRIPTION_NOT_ACTIVE)"
          - "units_dispensed == 0 (ERR_PRESCRIPTION_HAS_DISPENSES)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock check, facility.current_utc > written_utc + PRESCRIPTION_VALIDITY_DAYS"
        actor: system
        preconditions:
          - "facility.current_utc > written_utc + PRESCRIPTION_VALIDITY_DAYS (180)"
        side_effects: []
        note: "Evaluated lazily whenever the prescription is read or used in a dispense precondition."

  - entity: Recall
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: "POST /pharmacy-compounding/recalls/{rid}/advance"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Recall is INITIATED (ERR_RECALL_NOT_IN_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: RECONCILED
        trigger: "POST /pharmacy-compounding/recalls/{rid}/reconcile"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Recall is IN_PROGRESS (ERR_RECALL_NOT_IN_STATE)"
          - "units_reconciled == units_in_scope (ERR_RECALL_UNITS_OUTSTANDING)"
        side_effects: []
      - from: IN_PROGRESS
        to: INITIATED
        trigger: "POST /pharmacy-compounding/recalls/{rid}/reopen"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Recall is IN_PROGRESS (ERR_RECALL_NOT_IN_STATE)"
        side_effects: []
        note: "Cyclic: a recall under reconciliation can be reopened to widen scope."
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /pharmacy-compounding/recalls/{rid}/close"
        actor: QualityAssurancePharmacist
        preconditions:
          - "Recall is RECONCILED (ERR_RECALL_NOT_IN_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: batch-release-stale-version
    parent_entity: CompoundingBatch
    write_endpoint: "POST /pharmacy-compounding/compounding-batches/{bid}/release"
    occ_field: "expected_batch_version"
    description: |
      Releasing a CompoundingBatch whose version has advanced since the client
      last observed it is rejected. A QA pharmacist reads the batch at version V,
      but a prior release (which legitimately advances the batch's version and
      credits the anticipatory ledger) has already moved it past V; the current
      release still carrying the stale expected_batch_version V is rejected so
      it cannot double-credit the anticipatory ledger nor re-release already
      released finished preparations.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bud_assignment
    trigger: "CompoundingBatch IN_PROCESS->COMPILED (compile); side-effect of that transition records assigned_bud_utc"
    algorithm: threshold
    formula: |
      # Beyond-use datetime stamped on every FinishedPreparation of the batch.
      # base_bud_days depends on sterility / dosage form; two algorithm variants
      # by registration_type (see variants).
      if MFR.is_sterile:
        base_bud_days = STERILE_AQUEOUS_BUD_DAYS    if dosage_form == STERILE_AQUEOUS    # 14
                      else STERILE_NONAQUEOUS_BUD_DAYS                                    # 45
      else:
        base_bud_days = MFR.default_bud_days_nonsterile

      # 503B office-use stability cap (see office_use_503B variant) is applied to
      # base_bud_days BEFORE the ingredient-expiry floor.

      # Worst-case ingredient cap: BUD may never exceed the earliest charged-lot
      # expiry (a preparation cannot outlive its ingredients).
      earliest_lot_expiry = min(IngredientLot.expiration_utc over the batch's
                                BatchIngredientUsage lots)
      candidate_bud_utc = facility.current_utc + base_bud_days days
      assigned_bud_utc  = min(candidate_bud_utc, earliest_lot_expiry)
    input_set: "All IngredientLots referenced by the batch's BatchIngredientUsage rows, regardless of lot status at compile time."
    constants:
      STERILE_AQUEOUS_BUD_DAYS: 14
      STERILE_NONAQUEOUS_BUD_DAYS: 45
      OFFICE_USE_BUD_CAP_DAYS: 90
    precision: "Datetime arithmetic in whole days, UTC. Ingredient-expiry floor uses min(); ties favor the ingredient expiry."
    variants:
      - name: patient_specific_503A
        when: "batch.purpose == PRESCRIPTION (the only purpose 503A facilities allow)"
        difference: "base_bud_days uses the USP <795>/<797> default category windows directly; NO 90-day cap. assigned_bud_utc = min(current_utc + base_bud_days, earliest_lot_expiry)."
      - name: office_use_503B
        when: "batch.purpose == OFFICE_USE (only at 503B facilities)"
        difference: "base_bud_days is first capped at OFFICE_USE_BUD_CAP_DAYS=90 (outsourcing-facility stability-data limit), THEN the ingredient-expiry floor applies. assigned_bud_utc = min(current_utc + min(base_bud_days, 90), earliest_lot_expiry). For a nonsterile MFR with default_bud_days_nonsterile=180, 503A keeps 180 days but 503B is held to 90."

  - name: yield_reconciliation
    trigger: "CompoundingBatch IN_PROCESS->COMPILED (compile); side-effect records yield_variance_pct"
    algorithm: aggregation
    formula: |
      yield_variance_pct = round(100 * (actual_yield_units - theoretical_yield_units)
                                 / theoretical_yield_units, 2)
      acceptable = (-YIELD_TOLERANCE_PCT) <= yield_variance_pct <= (+YIELD_TOLERANCE_PCT)
      # theoretical_yield_units is the snapshot taken at batch creation from MFR.
    input_set: "Single batch: theoretical snapshot vs operator-counted actual_yield_units."
    constants:
      YIELD_TOLERANCE_PCT: 5.0
    precision: "2 decimal places, round_half_up. Boundary inclusive: variance exactly +5.00 or -5.00 is acceptable; +5.01 / -5.01 is ERR_YIELD_OUT_OF_RANGE."

  - name: qc_endotoxin_evaluation
    trigger: "QualityControlTest IN_PROGRESS->record on an ENDOTOXIN test (POST /pharmacy-compounding/qc-tests/{qid}/record); side-effect sets result"
    algorithm: threshold
    formula: |
      # Multi-input, non-linear: endotoxin acceptance depends on per-mg burden AND
      # the batch's potency-adjusted active mass spread across the yield, with a
      # route-tiered ceiling.
      total_active_mg = 1000 * sum(BatchIngredientUsage.potency_adjusted_grams
                                   over the batch's usage rows)
      eu_limit_per_unit = INJECTABLE_EU_LIMIT      if MFR.dosage_form == STERILE_AQUEOUS  # 175
                        else NONINJECTABLE_EU_LIMIT                                         # 350
      # measured_value on an ENDOTOXIN test is reported EU/mg of the preparation:
      projected_eu_per_unit = measured_value * (total_active_mg / theoretical_yield_units)
      result = PASSED if projected_eu_per_unit <= eu_limit_per_unit else FAILED
    input_set: "The ENDOTOXIN QualityControlTest, the batch's BatchIngredientUsage rows, the MFR dosage_form and theoretical_yield_units."
    constants:
      INJECTABLE_EU_LIMIT: 175
      NONINJECTABLE_EU_LIMIT: 350
    precision: "projected_eu_per_unit at full float precision; compare with <= (boundary value passes)."

  - name: anticipatory_consumed_units
    trigger: "OFFICE_USE batch RELEASED or RECALLED (side-effect), and on GET /pharmacy-compounding/master-formulation-records/{mid}/anticipatory-ledger"
    algorithm: chronological
    formula: |
      window_start_utc = facility.current_utc - MFR.anticipatory_window_days days
      consumed_units = sum(b.actual_yield_units
                           for CompoundingBatch b where
                             b.master_formulation_record_id == MFR.id
                             AND b.purpose == OFFICE_USE
                             AND b.status == RELEASED
                             AND b.released_at_utc >= window_start_utc)
      remaining_units = max(0, MFR.anticipatory_max_units - consumed_units)
    input_set: "OFFICE_USE batches of the MFR with status==RELEASED whose released_at_utc falls in [current_utc - window_days, current_utc]; RECALLED and REJECTED batches are excluded."
    constants: {}
    precision: "Integer unit counts. Window edge inclusive on the left (released_at_utc >= window_start_utc)."

  - name: lot_potency_adjustment
    trigger: "BatchIngredientUsage creation (POST /pharmacy-compounding/batch-ingredient-usages); remaining_grams recomputed on batch start/reject"
    algorithm: aggregation
    formula: |
      potency_adjusted_grams = round(grams_used * (lot.labeled_potency_pct / 100), 4)
      # Lot inventory ledger (derived-field reconciliation):
      IngredientLot.remaining_grams = initial_grams
        - sum(grams_used over usages whose batch.status not in {DRAFT, REJECTED})
    input_set: "Single usage row plus the parent lot; remaining_grams aggregates all usages of the lot on non-DRAFT, non-REJECTED batches."
    constants: {}
    precision: "potency_adjusted_grams to 4 decimal places round_half_up; remaining_grams to 4 decimal places."

  - name: label_text_generation
    trigger: "FinishedPreparation creation on batch COMPILE (side-effect)"
    algorithm: projection
    formula: |
      header = MFR.name + " | LOT " + upper(batch.id[0:8]) + " | BUD " + date(beyond_use_utc)
      if batch.purpose == OFFICE_USE:
        # 503B outsourcing facilities only
        label_text = header + " | 503B OUTSOURCING FACILITY — OFFICE USE ONLY — NOT FOR RESALE"
      else:  # PRESCRIPTION
        label_text = header + " | RX PATIENT: " + Prescription.patient_name
                            + " | PRESCRIBER NPI: " + Prescription.prescriber_npi
    input_set: "The batch, its MFR, beyond_use_utc, and (for PRESCRIPTION) the linked Prescription."
    constants: {}
    precision: "String; BUD date portion formatted YYYY-MM-DD."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Body FKs (facility_id, master_formulation_record_id, prescription_id, ingredient_lot_id, finished_preparation_id, compounding_batch_id) reference existing resources in the same facility"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 422
    applies_to: "POST creates carrying body FKs"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: "ERR_BATCH_NOT_IN_STATE / ERR_QC_NOT_IN_STATE / ERR_RECALL_NOT_IN_STATE / ERR_PRESCRIPTION_NOT_ACTIVE / ERR_MFR_RETIRED"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: when expected_batch_version supplied on release it must equal CompoundingBatch.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/release"
    note: "Checked after state precondition (batch QUARANTINED), before segregation/QC/anticipatory business checks."

  - priority: 7
    category: business_safety
    check: "Segregation of duties: releaser X-User-ID must differ from compiled_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/release"

  - priority: 8
    category: business_safety
    check: "All required QC tests exist and PASSED (POTENCY_ASSAY + VISUAL_INSPECTION always; STERILITY + ENDOTOXIN when MFR.is_sterile); none FAILED"
    error_id: "ERR_QC_INCOMPLETE (missing/not PASSED) / ERR_QC_FAILED (any FAILED)"
    http_status: 409
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/release"

  - priority: 9
    category: business_safety
    check: "For sterile batches, no out-of-spec USP_797 EnvironmentalLog within the batch window"
    error_id: ERR_ENVIRONMENTAL_EXCURSION
    http_status: 409
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/release (sterile MFR)"

  - priority: 10
    category: business_constraint
    check: "purpose/prescription coherence at batch creation: PRESCRIPTION requires prescription_id whose MFR & facility match; OFFICE_USE forbids prescription_id; 503A facilities may not create OFFICE_USE; OFFICE_USE only at 503B"
    error_id: ERR_PURPOSE_PRESCRIPTION_MISMATCH
    http_status: 422
    applies_to: "POST /pharmacy-compounding/compounding-batches"

  - priority: 11
    category: business_constraint
    check: "Charged lot must be AVAILABLE and not expired at start; lot remaining_grams must cover grams_used"
    error_id: "ERR_LOT_NOT_AVAILABLE / ERR_LOT_INSUFFICIENT_GRAMS"
    http_status: 409
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/start"

  - priority: 12
    category: business_constraint
    check: "actual_yield_units variance within +/- YIELD_TOLERANCE_PCT band at compile"
    error_id: ERR_YIELD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/compile"

  - priority: 13
    category: business_temporal
    check: "Beyond-use date not passed: facility.current_utc <= FinishedPreparation.beyond_use_utc at dispense"
    error_id: ERR_BEYOND_USE_DATE_PASSED
    http_status: 409
    applies_to: "POST /pharmacy-compounding/dispenses"

  - priority: 14
    category: business_constraint
    check: "Dispense channel coherence: PRESCRIPTION unit requires active same-MFR prescription_id and forbids office_account_name; OFFICE_USE unit requires office_account_name and forbids prescription_id; unit must be QC_RELEASED and IN_INVENTORY"
    error_id: ERR_DISPENSE_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /pharmacy-compounding/dispenses"

  - priority: 15
    category: business_fiscal
    check: "Anticipatory cap: for OFFICE_USE release, ledger remaining_units >= batch.actual_yield_units"
    error_id: ERR_ANTICIPATORY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /pharmacy-compounding/compounding-batches/{bid}/release (OFFICE_USE)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Facilities ---
  - method: POST
    path: "/pharmacy-compounding/facilities"
    description: "Create a compounding facility (503A pharmacy or 503B outsourcing facility)"
    roles: [SystemAdmin]
    code: 201
    input: [name, registration_type, state_code]
    output: Facility
    side_effects: ["current_utc initialized to 1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/pharmacy-compounding/facilities"
    description: "List facilities (paginated)"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Facility[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/facilities/{fid}"
    description: "Get a facility"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/pharmacy-compounding/facilities/{fid}/_clock/set"
    description: "Test-driving endpoint: set the facility's deterministic clock to an absolute UTC instant"
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: Facility
    side_effects: ["facility.current_utc = to_iso8601", "subsequent reads lazily re-evaluate Prescription EXPIRED and IngredientLot EXPIRED"]

  # --- Master Formulation Records ---
  - method: POST
    path: "/pharmacy-compounding/master-formulation-records"
    description: "Create a master formulation record (formula/master record)"
    roles: [CompoundingPharmacist]
    code: 201
    input: [facility_id, name, dosage_form, default_bud_days_nonsterile, theoretical_yield_units, anticipatory_max_units, "anticipatory_window_days?"]
    output: MasterFormulationRecord
    side_effects: ["is_sterile computed from dosage_form", "status=ACTIVE", "AnticipatoryLimitLedger created for this MFR"]

  - method: GET
    path: "/pharmacy-compounding/master-formulation-records"
    description: "List master formulation records (paginated); filter by facility_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "MasterFormulationRecord[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/master-formulation-records/{mid}"
    description: "Get a master formulation record"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: MasterFormulationRecord
    side_effects: []

  - method: POST
    path: "/pharmacy-compounding/master-formulation-records/{mid}/retire"
    description: "Retire a master formulation record (no new batch starts)"
    roles: [CompoundingPharmacist]
    code: 200
    input: []
    output: MasterFormulationRecord
    side_effects: ["status ACTIVE->RETIRED"]

  - method: GET
    path: "/pharmacy-compounding/master-formulation-records/{mid}/anticipatory-ledger"
    description: "Computed read: current rolling anticipatory-compounding ledger for the MFR"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: AnticipatoryLimitLedger
    side_effects: ["recomputes window_start_utc, consumed_units, remaining_units against facility.current_utc"]

  # --- Anticipatory Ledger (filtered-list reverse reach for AnticipatoryLimitLedger.master_formulation_record_id) ---
  - method: GET
    path: "/pharmacy-compounding/anticipatory-ledgers"
    description: "List anticipatory ledgers (paginated); filter by master_formulation_record_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["master_formulation_record_id?", "limit?", "offset?"]
    output: "AnticipatoryLimitLedger[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/anticipatory-ledgers/{alid}"
    description: "Get an anticipatory ledger by id (recomputed against the clock)"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: AnticipatoryLimitLedger
    side_effects: ["recomputes window_start_utc, consumed_units, remaining_units against facility.current_utc"]

  # --- Ingredient Lots ---
  - method: POST
    path: "/pharmacy-compounding/ingredient-lots"
    description: "Receive an ingredient lot into inventory"
    roles: [CompoundingPharmacist]
    code: 201
    input: [facility_id, component_name, lot_number, labeled_potency_pct, initial_grams, expiration_utc, "endotoxin_eu_per_mg?", "parent_lot_id?"]
    output: IngredientLot
    side_effects: ["status=AVAILABLE", "remaining_grams=initial_grams"]

  - method: GET
    path: "/pharmacy-compounding/ingredient-lots"
    description: "List ingredient lots (paginated); filter by facility_id or parent_lot_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["facility_id?", "parent_lot_id?", "limit?", "offset?"]
    output: "IngredientLot[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/ingredient-lots/{lid}"
    description: "Get an ingredient lot (re-evaluates EXPIRED against clock)"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: IngredientLot
    side_effects: ["lazily sets status EXPIRED if expiration_utc <= facility.current_utc and status was AVAILABLE"]

  - method: POST
    path: "/pharmacy-compounding/ingredient-lots/{lid}/release-quarantine"
    description: "Return a QUARANTINED lot to AVAILABLE after investigation"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: IngredientLot
    side_effects: ["status QUARANTINED->AVAILABLE"]

  # --- Environmental Logs (USP <795>/<797>) ---
  - method: POST
    path: "/pharmacy-compounding/environmental-logs"
    description: "Record a USP <795>/<797> environmental monitoring reading"
    roles: [QualityAssurancePharmacist, CompoundingPharmacist]
    code: 201
    input: [facility_id, usp_chapter, reading_type, measured_value, action_limit]
    output: EnvironmentalLog
    side_effects: ["in_spec computed = measured_value <= action_limit", "reading_utc = facility.current_utc"]

  - method: GET
    path: "/pharmacy-compounding/environmental-logs"
    description: "List environmental logs (paginated); filter by facility_id or usp_chapter"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["facility_id?", "usp_chapter?", "limit?", "offset?"]
    output: "EnvironmentalLog[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/environmental-logs/{eid}"
    description: "Get an environmental log entry"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: EnvironmentalLog
    side_effects: []

  # --- Prescriptions ---
  - method: POST
    path: "/pharmacy-compounding/prescriptions"
    description: "Create a patient-specific prescription (503A)"
    roles: [DispensingPharmacist, CompoundingPharmacist]
    code: 201
    input: [facility_id, master_formulation_record_id, patient_name, prescriber_npi, units_prescribed, written_utc]
    output: Prescription
    side_effects: ["status=ACTIVE", "units_dispensed=0"]

  - method: GET
    path: "/pharmacy-compounding/prescriptions"
    description: "List prescriptions (paginated); filter by facility_id or master_formulation_record_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["facility_id?", "master_formulation_record_id?", "limit?", "offset?"]
    output: "Prescription[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/prescriptions/{pid}"
    description: "Get a prescription (re-evaluates EXPIRED against clock)"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: Prescription
    side_effects: ["lazily sets status EXPIRED if current_utc > written_utc + 180 days and status was ACTIVE"]

  - method: POST
    path: "/pharmacy-compounding/prescriptions/{pid}/cancel"
    description: "Cancel an active prescription with no dispenses"
    roles: [DispensingPharmacist]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status ACTIVE->CANCELLED"]

  # --- Compounding Batches ---
  - method: POST
    path: "/pharmacy-compounding/compounding-batches"
    description: "Open a draft compounding batch against an MFR"
    roles: [CompoundingPharmacist]
    code: 201
    input: [facility_id, master_formulation_record_id, purpose, "prescription_id?"]
    output: CompoundingBatch
    side_effects: ["status=DRAFT", "theoretical_yield_units snapshot from MFR", "purpose/prescription coherence validated"]

  - method: GET
    path: "/pharmacy-compounding/compounding-batches"
    description: "List compounding batches (paginated); filter by facility_id, master_formulation_record_id, or prescription_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["facility_id?", "master_formulation_record_id?", "prescription_id?", "limit?", "offset?"]
    output: "CompoundingBatch[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/compounding-batches/{bid}"
    description: "Get a compounding batch"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: CompoundingBatch
    side_effects: []

  - method: POST
    path: "/pharmacy-compounding/compounding-batches/{bid}/start"
    description: "Begin compounding: DRAFT->IN_PROCESS, consume charged lot grams"
    roles: [CompoundingPharmacist]
    code: 200
    input: []
    output: CompoundingBatch
    side_effects: ["status DRAFT->IN_PROCESS", "decrement IngredientLot.remaining_grams per usage"]

  - method: POST
    path: "/pharmacy-compounding/compounding-batches/{bid}/compile"
    description: "Compile batch: IN_PROCESS->COMPILED; record yield, stamp BUD, mint finished preparations"
    roles: [CompoundingPharmacist]
    code: 200
    input: [actual_yield_units]
    output: CompoundingBatch
    side_effects: ["compiled_by_user_id set", "yield_variance_pct computed", "assigned_bud_utc computed", "FinishedPreparations minted"]

  - method: POST
    path: "/pharmacy-compounding/compounding-batches/{bid}/quarantine"
    description: "Move a compiled batch to QUARANTINED pending QA release"
    roles: [CompoundingPharmacist]
    code: 200
    input: []
    output: CompoundingBatch
    side_effects: ["status COMPILED->QUARANTINED"]

  - method: POST
    path: "/pharmacy-compounding/compounding-batches/{bid}/reprocess"
    description: "Rework a quarantined batch back to IN_PROCESS (voids finished preparations)"
    roles: [CompoundingPharmacist]
    code: 200
    input: []
    output: CompoundingBatch
    side_effects: ["status QUARANTINED->IN_PROCESS", "void FinishedPreparations", "clear compile fields"]

  - method: POST
    path: "/pharmacy-compounding/compounding-batches/{bid}/release"
    description: "QA releases a quarantined batch (segregation of duties, QC, environmental, anticipatory, OCC checks)"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: [expected_batch_version]
    output: CompoundingBatch
    side_effects: ["status QUARANTINED->RELEASED", "released_by_user_id set", "released_at_utc set", "increments CompoundingBatch.version by 1", "FinishedPreparations qc_status->QC_RELEASED", "recompute anticipatory ledger for OFFICE_USE"]

  - method: POST
    path: "/pharmacy-compounding/compounding-batches/{bid}/reject"
    description: "QA rejects a batch (restocks lots, rejects finished preparations)"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: CompoundingBatch
    side_effects: ["status ->REJECTED", "restore IngredientLot.remaining_grams per usage", "FinishedPreparations qc_status->QC_REJECTED"]

  # --- Batch Ingredient Usages (junction) ---
  - method: POST
    path: "/pharmacy-compounding/batch-ingredient-usages"
    description: "Charge an ingredient lot to a draft batch"
    roles: [CompoundingPharmacist]
    code: 201
    input: [compounding_batch_id, ingredient_lot_id, grams_used]
    output: BatchIngredientUsage
    side_effects: ["potency_adjusted_grams computed", "batch must be DRAFT (ERR_BATCH_NOT_IN_STATE)"]

  - method: GET
    path: "/pharmacy-compounding/batch-ingredient-usages"
    description: "List batch ingredient usages (paginated); filter by compounding_batch_id or ingredient_lot_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["compounding_batch_id?", "ingredient_lot_id?", "limit?", "offset?"]
    output: "BatchIngredientUsage[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/batch-ingredient-usages/{uid}"
    description: "Get a batch ingredient usage by id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: BatchIngredientUsage
    side_effects: []

  # --- QC Tests ---
  - method: POST
    path: "/pharmacy-compounding/qc-tests"
    description: "Add a QC/endotoxin test to a compiled batch"
    roles: [QualityAssurancePharmacist]
    code: 201
    input: [compounding_batch_id, test_type, "measured_value?", "lower_limit?", "upper_limit?"]
    output: QualityControlTest
    side_effects: ["result=PENDING", "parent batch must be in {COMPILED, QUARANTINED} (ERR_BATCH_NOT_IN_STATE)"]

  - method: GET
    path: "/pharmacy-compounding/qc-tests"
    description: "List QC tests (paginated); filter by compounding_batch_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["compounding_batch_id?", "limit?", "offset?"]
    output: "QualityControlTest[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/qc-tests/{qid}"
    description: "Get a QC test"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: QualityControlTest
    side_effects: []

  - method: POST
    path: "/pharmacy-compounding/qc-tests/{qid}/begin"
    description: "Move a QC test PENDING->IN_PROGRESS"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: QualityControlTest
    side_effects: ["result PENDING->IN_PROGRESS"]

  - method: POST
    path: "/pharmacy-compounding/qc-tests/{qid}/record"
    description: "Record QC result; auto PASSED/FAILED against limits (endotoxin via projection calc)"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: ["measured_value?", "pass?"]
    output: QualityControlTest
    side_effects: ["result IN_PROGRESS->PASSED/FAILED", "on STERILITY/ENDOTOXIN FAILED for sterile batch: quarantine charged IngredientLots"]

  # --- Finished Preparations ---
  - method: GET
    path: "/pharmacy-compounding/finished-preparations"
    description: "List finished preparations (paginated); filter by compounding_batch_id or facility_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["compounding_batch_id?", "facility_id?", "limit?", "offset?"]
    output: "FinishedPreparation[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/finished-preparations/{pid}"
    description: "Get a finished preparation (label, BUD, statuses)"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: FinishedPreparation
    side_effects: []

  # --- Dispenses ---
  - method: POST
    path: "/pharmacy-compounding/dispenses"
    description: "Dispense (503A patient) or distribute (503B office-use) a finished preparation unit"
    roles: [DispensingPharmacist]
    code: 201
    input: [facility_id, finished_preparation_id, "prescription_id?", "office_account_name?"]
    output: Dispense
    side_effects: ["unit dispense_status IN_INVENTORY->DISPENSED", "dispensed_utc set", "503A: Prescription.units_dispensed += 1; possibly ACTIVE->FILLED"]

  - method: GET
    path: "/pharmacy-compounding/dispenses"
    description: "List dispenses (paginated); filter by finished_preparation_id, prescription_id, or facility_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["finished_preparation_id?", "prescription_id?", "facility_id?", "limit?", "offset?"]
    output: "Dispense[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/dispenses/{did}"
    description: "Get a dispense record by id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: Dispense
    side_effects: []

  # --- Recalls ---
  - method: POST
    path: "/pharmacy-compounding/recalls"
    description: "Initiate a recall against a RELEASED batch"
    roles: [QualityAssurancePharmacist]
    code: 201
    input: [facility_id, compounding_batch_id, reason, classification]
    output: Recall
    side_effects: ["status=INITIATED", "batch RELEASED->RECALLED", "all FinishedPreparations dispense_status->RECALLED", "units_in_scope snapshot", "revert FILLED prescriptions for recalled dispensed units", "recompute anticipatory ledger for OFFICE_USE"]

  - method: GET
    path: "/pharmacy-compounding/recalls"
    description: "List recalls (paginated); filter by facility_id or compounding_batch_id"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: ["facility_id?", "compounding_batch_id?", "limit?", "offset?"]
    output: "Recall[]"
    side_effects: []

  - method: GET
    path: "/pharmacy-compounding/recalls/{rid}"
    description: "Get a recall (scope/reconciliation counters)"
    roles: [SystemAdmin, CompoundingPharmacist, QualityAssurancePharmacist, DispensingPharmacist]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: POST
    path: "/pharmacy-compounding/recalls/{rid}/advance"
    description: "Advance recall INITIATED->IN_PROGRESS"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: Recall
    side_effects: ["status INITIATED->IN_PROGRESS"]

  - method: POST
    path: "/pharmacy-compounding/recalls/{rid}/reconcile"
    description: "Mark all in-scope units accounted for; IN_PROGRESS->RECONCILED"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: Recall
    side_effects: ["units_reconciled recomputed (count of in-scope RECALLED units)", "status IN_PROGRESS->RECONCILED if all reconciled"]

  - method: POST
    path: "/pharmacy-compounding/recalls/{rid}/reopen"
    description: "Reopen a recall IN_PROGRESS->INITIATED"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: Recall
    side_effects: ["status IN_PROGRESS->INITIATED"]

  - method: POST
    path: "/pharmacy-compounding/recalls/{rid}/close"
    description: "Close a reconciled recall RECONCILED->CLOSED"
    roles: [QualityAssurancePharmacist]
    code: 200
    input: []
    output: Recall
    side_effects: ["status RECONCILED->CLOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or X-User-Role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- Not found ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id in path does not exist" }
  - { id: ERR_MFR_NOT_FOUND, http: 404, condition: "MasterFormulationRecord not found" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "IngredientLot not found" }
  - { id: ERR_PRESCRIPTION_NOT_FOUND, http: 404, condition: "Prescription not found" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "CompoundingBatch not found" }
  - { id: ERR_QC_TEST_NOT_FOUND, http: 404, condition: "QualityControlTest not found" }
  - { id: ERR_FINISHED_PREPARATION_NOT_FOUND, http: 404, condition: "FinishedPreparation not found" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall not found" }
  - { id: ERR_ENVIRONMENTAL_LOG_NOT_FOUND, http: 404, condition: "EnvironmentalLog not found" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 422, condition: "A body foreign key references a resource that does not exist in the facility" }
  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, or out-of-range numeric (negative grams_used, actual_yield_units < 0)" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit/offset out of bounds (limit < 1 or > 100, offset < 0)" }
  # --- State ---
  - { id: ERR_BATCH_NOT_IN_STATE, http: 409, condition: "Batch not in a state from which the requested transition is defined" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Recall target batch is not RELEASED" }
  - { id: ERR_QC_NOT_IN_STATE, http: 409, condition: "QC test not in the required state for begin/record" }
  - { id: ERR_RECALL_NOT_IN_STATE, http: 409, condition: "Recall not in the required state for the requested transition" }
  - { id: ERR_PRESCRIPTION_NOT_ACTIVE, http: 409, condition: "Prescription not ACTIVE for cancel/dispense" }
  - { id: ERR_MFR_RETIRED, http: 409, condition: "MasterFormulationRecord is RETIRED; cannot start new batches" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_batch_version does not match CompoundingBatch.version on release" }
  # --- Business: segregation / QC / environmental ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Releaser X-User-ID equals the compiler X-User-ID" }
  - { id: ERR_QC_INCOMPLETE, http: 409, condition: "A required QC test is missing or not PASSED at release time" }
  - { id: ERR_QC_FAILED, http: 409, condition: "A required QC test is FAILED at release time" }
  - { id: ERR_ENVIRONMENTAL_EXCURSION, http: 409, condition: "An out-of-spec USP_797 reading was logged during the batch window for a sterile batch" }
  # --- Business: constraints ---
  - { id: ERR_NO_INGREDIENTS_CHARGED, http: 409, condition: "Batch start attempted with no BatchIngredientUsage rows" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "A charged lot is not AVAILABLE or is expired at batch start" }
  - { id: ERR_LOT_INSUFFICIENT_GRAMS, http: 409, condition: "A charged lot's remaining_grams cannot cover its grams_used at batch start" }
  - { id: ERR_PURPOSE_PRESCRIPTION_MISMATCH, http: 422, condition: "purpose/prescription_id incoherent, 503A creating OFFICE_USE, or OFFICE_USE prescription mismatch" }
  - { id: ERR_YIELD_OUT_OF_RANGE, http: 422, condition: "Actual yield variance exceeds +/- YIELD_TOLERANCE_PCT at compile" }
  - { id: ERR_BEYOND_USE_DATE_PASSED, http: 409, condition: "Dispense attempted after the finished preparation's beyond_use_utc" }
  - { id: ERR_DISPENSE_CHANNEL_MISMATCH, http: 422, condition: "Dispense channel inputs incoherent with the unit's batch purpose" }
  - { id: ERR_UNIT_NOT_RELEASED, http: 409, condition: "Finished preparation qc_status is not QC_RELEASED at dispense" }
  - { id: ERR_UNIT_NOT_IN_INVENTORY, http: 409, condition: "Finished preparation dispense_status is not IN_INVENTORY at dispense" }
  - { id: ERR_BATCH_HAS_DISPENSED_UNITS, http: 409, condition: "Reprocess attempted on a batch with at least one DISPENSED finished preparation" }
  - { id: ERR_PRESCRIPTION_HAS_DISPENSES, http: 409, condition: "Cancel attempted on a prescription with units_dispensed > 0" }
  # --- Business: fiscal / quota ---
  - { id: ERR_ANTICIPATORY_LIMIT_EXCEEDED, http: 409, condition: "OFFICE_USE release would push rolling-window units over the MFR anticipatory cap" }
  - { id: ERR_RECALL_UNITS_OUTSTANDING, http: 409, condition: "Recall reconcile attempted while units_reconciled < units_in_scope" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Operations role that provisions facilities and controls the deterministic clock"
    identity: opaque
    exclusive_operations:
      - "POST /pharmacy-compounding/facilities — create facility"
      - "POST /pharmacy-compounding/facilities/{fid}/_clock/set — set facility clock"
    shared_operations:
      - "GET (read/list) endpoints across all resources"

  - name: CompoundingPharmacist
    description: "Compounds preparations: manages MFRs, lots, batch creation through compile/quarantine/reprocess"
    identity: opaque
    exclusive_operations:
      - "POST /pharmacy-compounding/master-formulation-records — create MFR"
      - "POST /pharmacy-compounding/master-formulation-records/{mid}/retire — retire MFR"
      - "POST /pharmacy-compounding/ingredient-lots — receive lot"
      - "POST /pharmacy-compounding/compounding-batches — open batch"
      - "POST /pharmacy-compounding/batch-ingredient-usages — charge lot"
      - "POST /pharmacy-compounding/compounding-batches/{bid}/start — start batch"
      - "POST /pharmacy-compounding/compounding-batches/{bid}/compile — compile batch"
      - "POST /pharmacy-compounding/compounding-batches/{bid}/quarantine — quarantine batch"
      - "POST /pharmacy-compounding/compounding-batches/{bid}/reprocess — reprocess batch"
    shared_operations:
      - "POST /pharmacy-compounding/prescriptions — create prescription (with DispensingPharmacist)"
      - "POST /pharmacy-compounding/environmental-logs — log reading (with QualityAssurancePharmacist)"
      - "GET (read/list) endpoints across all resources"

  - name: QualityAssurancePharmacist
    description: "Independent QA: runs QC tests, releases/rejects batches (segregation of duties from compiler), releases quarantined lots, runs recalls"
    identity: opaque
    exclusive_operations:
      - "POST /pharmacy-compounding/compounding-batches/{bid}/release — release batch"
      - "POST /pharmacy-compounding/compounding-batches/{bid}/reject — reject batch"
      - "POST /pharmacy-compounding/qc-tests — add QC test"
      - "POST /pharmacy-compounding/qc-tests/{qid}/begin — begin QC"
      - "POST /pharmacy-compounding/qc-tests/{qid}/record — record QC"
      - "POST /pharmacy-compounding/ingredient-lots/{lid}/release-quarantine — release quarantined lot"
      - "POST /pharmacy-compounding/recalls — initiate recall"
      - "POST /pharmacy-compounding/recalls/{rid}/advance — advance recall"
      - "POST /pharmacy-compounding/recalls/{rid}/reconcile — reconcile recall"
      - "POST /pharmacy-compounding/recalls/{rid}/reopen — reopen recall"
      - "POST /pharmacy-compounding/recalls/{rid}/close — close recall"
    shared_operations:
      - "POST /pharmacy-compounding/environmental-logs — log reading (with CompoundingPharmacist)"
      - "GET (read/list) endpoints across all resources"

  - name: DispensingPharmacist
    description: "Dispenses 503A patient units and distributes 503B office-use units; manages prescriptions at point of sale"
    identity: opaque
    exclusive_operations:
      - "POST /pharmacy-compounding/dispenses — dispense/distribute unit"
      - "POST /pharmacy-compounding/prescriptions/{pid}/cancel — cancel prescription"
    shared_operations:
      - "POST /pharmacy-compounding/prescriptions — create prescription (with CompoundingPharmacist)"
      - "GET (read/list) endpoints across all resources"
