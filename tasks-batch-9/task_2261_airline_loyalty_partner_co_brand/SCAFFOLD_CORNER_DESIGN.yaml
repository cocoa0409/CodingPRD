          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "One test drives all three §1.2.1 rules: after a successful write bumps each parent, replaying the SAME expected_*_version returns ERR_STALE_VERSION (412) on the agreement, the window and the program, and each retry with the refreshed version succeeds - so version bumping cannot be skipped on any of the three parents."
