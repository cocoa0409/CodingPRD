  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: hce_threshold_exact_equals_not_hce
        grounds:
          - calculations.hce_determination
          - entities.PlanYear.fields.hce_prior_comp_threshold_cents
          - entities.Employee.fields.hce_flag
        distinguishing_aspect: |
          Strictly-greater boundary on the integer metric prior_year_compensation_cents, reached
          through POST /employees: 15500000 cents (exactly at the threshold) yields hce_flag false
          while 15500001 cents (one cent above) yields hce_flag true.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN whose hce_prior_comp_threshold_cents is exactly 15500000."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", hce_prior_comp_threshold_cents: 15500000 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
          trigger:
            - call: "POST /employees"
              payload: { external_id: "E-EQ", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 15500000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { eq_id: $.data.id, eq_flag: $.data.hce_flag }
            - call: "POST /employees"
              payload: { external_id: "E-OVER", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 15500001, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { over_id: $.data.id, over_flag: $.data.hce_flag }
          assert:
            - "eq_flag == false  # equality is NOT highly compensated"
            - "over_flag == true"
            - "Employee.${eq_id}.hce_flag == false"
            - "Employee.${over_id}.hce_flag == true"

      - name: acp_ratio_exact_half_rounds_up
        grounds:
          - calculations.acp_test
          - entities.NondiscriminationTest.fields.nhce_acp
          - entities.NondiscriminationTest.fields.limit_acp
        distinguishing_aspect: |
          Rounding boundary on a different metric (the 4-decimal contribution ratio) reached through
          a different endpoint (POST /nondiscrimination-tests/{test_id}/compute): a raw ratio of
          exactly 0.010050 sits on the half at the 4th decimal place and must round UP to 0.0101,
          not down to 0.0100.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
            - "One NHCE Employee with a single ContributionRecord of 1000000 cents counted compensation and 10050 cents elective deferral, giving a deferral match of 10050 cents and a raw contribution ratio of exactly 0.010050."
            - "One PENDING NondiscriminationTest with test_method CURRENT_YEAR."
          setup_api_calls:
            - call: "POST /plan-years"
