      - name: transport_pending_blocks_assignment_close_then_allows_after_cancel
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_TRANSPORT_PENDING]"]
        distinguishing_aspect: "Close is blocked while a PLANNED TransportJob references the assignment (reachable only via the suspended-project repair edge: equipment IDLE with a SUSPENDED assignment); after the haul is cancelled, the same close succeeds — 409 ERR_TRANSPORT_PENDING then 200."
        test_recipe:
          setup:
            - "Class C406 daily 10000 service_interval_hours 10000; projects P406A/P406B budget 100000000; lowboy L406; mechanic M406"
            - "Assignment A406 [08-03, 08-10) ACTIVE, P406A SUSPENDED, E406 marked DOWN (A406 SUSPENDED), REPAIR work order completed -> E406 IDLE, A406 STAYS SUSPENDED (project not OPEN)"
            - "Readings 0 milli on 08-03 and 08-04 (the two chargeable days); clock at 2026-08-13 for close"
            - "TransportJob T406 PLANNED P406A->P406B with assignment_id == A406"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-406", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c406_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-406A", name: "P406A", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p406a_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-406B", name: "P406B", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p406b_id: $.data.id }
            - call: "POST /fleet/lowboys"
              payload: { lowboy_code: "LB-406", capacity_units: 1 }
              as: Dispatcher
              captures: { l406_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-406", class_id: "${c406_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e406_id: $.data.id, e406_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e406_id}", project_id: "${p406a_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e406_v}" }
              as: FleetAdmin
              captures: { a406_id: $.data.id }
            - call: "POST /fleet/assignments/${a406_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e406_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e406_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/projects/${p406a_id}/suspend"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e406_id}/mark-down"
              as: FleetAdmin
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-406", name: "Mac 406", home_project_id: "${p406a_id}" }
              as: FleetAdmin
              captures: { m406_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e406_id}", kind: "REPAIR" }
              as: FleetAdmin
              captures: { w406_id: $.data.id }
            - call: "POST /fleet/work-orders/${w406_id}/dispatch"
              payload: { mechanic_id: "${m406_id}" }
              as: FleetAdmin
            - call: "POST /fleet/work-orders/${w406_id}/start"
              as: Mechanic
              as_user_id: "${m406_id}"
            - call: "POST /fleet/work-orders/${w406_id}/complete"
              as: Mechanic
              as_user_id: "${m406_id}"
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e406_id}", from_project_id: "${p406a_id}", to_project_id: "${p406b_id}", lowboy_id: "${l406_id}", depart_at: "2026-08-12T08:00:00Z", arrive_at: "2026-08-12T12:00:00Z", assignment_id: "${a406_id}" }
              as: Dispatcher
              captures: { t406_id: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T09:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a406_id}/close"
              payload: { close_reason: "EQUIPMENT_DOWN" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/transport-jobs/${t406_id}/cancel"
              as: Dispatcher
            - call: "POST /fleet/assignments/${a406_id}/close"
              payload: { close_reason: "EQUIPMENT_DOWN" }
              as: FleetAdmin
              captures: { a406_status: $.data.status, a406_reason: $.data.close_reason }
            - call: "GET /fleet/projects/${p406a_id}"
              as: FleetAdmin
              captures: { p406a_billed: $.data.billed_total_cents }
          assert:
            - "First close: error_id == ERR_TRANSPORT_PENDING, http 409 (PLANNED transport references the assignment)"
            - "After transport cancel: close succeeds -> CLOSED with close_reason == EQUIPMENT_DOWN (mandated enum for SUSPENDED close)"
            - "Chargeable days were 08-03 and 08-04 (both idle): allocated_cents == 10000 (2 x round(10000*5000/10000)) posted to P406A.billed_total_cents == 10000 even though P406A is SUSPENDED"
            - "Equipment.${e406_id}.availability_status == IDLE after close (SUSPENDED-close does not force DOWN)"

      - name: priority_pair_state_vs_safety_covered_by_difficulty
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=9]"]
        distinguishing_aspect: "Dual-failure priority: state availability error beats business_safety service error."
