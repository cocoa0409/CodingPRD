              as_user_id: "uw-1"
          assert:
            - "after setup: Policy.${pol}.referral_required == true, written_premium_cents == 2659800, total_insured_value_cents == 60000000, status == REFERRED, referral_status == PENDING, referred_by_user_id == uw-1"
            - "trigger[0] HTTP status == 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "after trigger[0]: Policy.${pol}.status is still REFERRED, referral_status is still PENDING and referral_decided_by_user_id is still null"
            - "trigger[1] HTTP status == 200; status REFERRED -> QUOTED, referral_status == APPROVED, referral_decided_by_user_id == mgr-1"
            - "trigger[2] HTTP status == 200; status == BOUND and premium_balance_cents == 2659800 from the single INITIAL_PREMIUM entry"
            - "the referring underwriter uw-1 is allowed to BIND the policy it referred - segregation of duties constrains only the decision step, so trigger[2] succeeding is part of the claim"

      - name: corner_policy_lifecycle_authority_splits_between_underwriter_and_manager
        claim_type: Role Exclusive Operation
        grounds:
