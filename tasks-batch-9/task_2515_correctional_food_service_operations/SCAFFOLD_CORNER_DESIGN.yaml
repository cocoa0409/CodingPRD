      - name: corner_pagination_bounds_return_value_out_of_range
        claim_type: error_triggerable
        grounds:
          - validations[priority=7]
          - errors.ERR_VALUE_OUT_OF_RANGE
          - response_envelope.pagination
        distinguishing_aspect: "The pagination window is inclusive at 1 and 100 and rejects both sides plus a negative offset, so limit 100 succeeds while 101 and 0 are refused with the same range error."
        test_recipe:
          setup:
            - "Empty store; only the logical clock is pinned. The list endpoint is queried with no other filters."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "GET /cfs/service-contracts"
              payload: { limit: 101 }
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { over_limit_error: $.data.error_id }
            - call: "GET /cfs/service-contracts"
              payload: { limit: 0 }
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { zero_limit_error: $.data.error_id }
            - call: "GET /cfs/service-contracts"
              payload: { offset: -1 }
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { negative_offset_error: $.data.error_id }
            - call: "GET /cfs/service-contracts"
              payload: { limit: 100, offset: 0 }
              as: ComplianceAuditor
              as_user_id: "au-001"
          assert:
            - "${over_limit_error} == ERR_VALUE_OUT_OF_RANGE with HTTP 422"
            - "${zero_limit_error} == ERR_VALUE_OUT_OF_RANGE with HTTP 422 - the floor is 1, not 0"
            - "${negative_offset_error} == ERR_VALUE_OUT_OF_RANGE with HTTP 422"
            - "The limit 100 request returns HTTP 200 with data == [] and meta.total_count == 0, meta.has_more == false - 100 is inside the window"

