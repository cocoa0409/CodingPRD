  - section: cross_cutting_layers
    instances:
      - name: occ_plan_update_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on plan PUT: a client holding version N updates successfully (version -> N+1); a second update still carrying version N is deterministically rejected with 412."
        test_recipe:
          setup: ["Plan in DRAFT; client observed version captured from a GET"]
          setup_api_calls:
            - { call: "POST /comp/comp-plans", payload: { name: "OCC Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "GET /comp/comp-plans/${plan}", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { plan_v: $.data.version } }
          trigger:
            - { call: "PUT /comp/comp-plans/${plan}", payload: { expected_comp_plan_version: "${plan_v}", quality_pool_cents: 150000 }, as: CompAnalyst, as_user_id: an_1, captures: { plan_v2: $.data.version } }
            - { call: "PUT /comp/comp-plans/${plan}", payload: { expected_comp_plan_version: "${plan_v}", quality_pool_cents: 175000 }, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "First PUT succeeds and increments version (response version == ${plan_v} + 1)"
            - "Second PUT with the stale captured version: 412 ERR_STALE_VERSION"
            - "GET /comp/comp-plans/${plan} -> quality_pool_cents == 150000 (first write only)"
      - name: occ_pcr_create_stale_plan_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[pcr-create-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create-with-supersede OCC: creating a PCR withdraws sibling PROPOSED PCRs and bumps the plan version; a second create carrying the pre-create version is rejected instead of silently superseding a PCR it never saw."
        test_recipe:
          setup: ["P1 ACTIVE; P2 FMV_APPROVED successor; client holds plan version ${p1_v}"]
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
