      - name: estoppel_certificate_for_the_same_financing_supersedes_the_earlier_one
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/portfolio/estoppel-certificates
          - state_machines.EstoppelCertificate.ISSUED_to_SUPERSEDED
        distinguishing_aspect: |
          Supersession is keyed on the PAIR (lease_id, requested_by_mortgage_id), so the second issuance
          for the same financing retires the first while a certificate for a different financing on the
          same lease would survive. Each certificate also snapshots the lease it validated against, and
          because issuance itself bumps the lease version the second request must quote the new version -
          proving the certified figures come from the lease rather than from the request.
        test_recipe:
          setup:
            - "One insured lease with one recorded mortgage; the lease version is read immediately before each issuance."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
