  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cancellation_request_depends_on_a_live_grant_on_another_aggregate
        grounds:
          - validations[priority=43]
          - state_machines.AuthorityGrant.transitions[ACTIVE->REVOKED]
          - entities.DigitalAsset.fields.access_status
          - entities.CancellationOrder.fields.status
        distinguishing_aspect: |
          Whether POST /cancellation-orders/{order_id}/transitions {action: REQUEST} succeeds depends
          on the state of an AuthorityGrant two aggregates away: with the grant ACTIVE the first
          order moves PENDING -> REQUESTED, and after a CourtRegistrar REVOKE of that same grant the
          identical call on the sibling order is refused with ERR_NO_ACTIVE_AUTHORITY even though the
          order itself never changed state.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform StreamOne with refund_policy PRORATA_DAILY"
            - "one estate with VERIFIED death certificate and letters"
            - "TWO SUBSCRIPTION assets, each with a SubscriptionTerm, both CATALOG_DISCLOSED by one APPROVED CATALOG_ACCESS request, so two CancellationOrders exist in PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "StreamOne", platform_type: "SUBSCRIPTION", form_code: "SO-FORM-4", review_window_days: 14, refund_policy: "PRORATA_DAILY", supports_online_tool: false, supports_transfer: false, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_stream_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-R" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-R1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-R", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-R", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_stream_id}", category: "SUBSCRIPTION", account_handle: "stream-premium", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /digital-assets/${a1_id}/subscription-terms"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", billing_interval: "ANNUAL", period_fee_cents: 11999, auto_renew: true }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { term1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_stream_id}", category: "SUBSCRIPTION", account_handle: "stream-audio", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /digital-assets/${a2_id}/subscription-terms"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", billing_interval: "MONTHLY", period_fee_cents: 999, auto_renew: true }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { term2_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_stream_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "SO-FORM-4" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "GET /authority-grants"
              payload: { platform_request_id: "${req_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { grant_id: "$.data[0].id" }
            - call: "GET /cancellation-orders"
              payload: { asset_id: "${a1_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { co1_id: "$.data[0].id" }
            - call: "GET /cancellation-orders"
              payload: { asset_id: "${a2_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { co2_id: "$.data[0].id" }
          trigger:
            - call: "POST /cancellation-orders/${co1_id}/transitions"
              payload: { action: "REQUEST", effective_date: "2026-03-15" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /authority-grants/${grant_id}/transitions"
              payload: { action: "REVOKE", reason: "registrar order pending appeal" }
              as: CourtRegistrar
            - call: "POST /cancellation-orders/${co2_id}/transitions"
              payload: { action: "REQUEST", effective_date: "2026-03-15" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { err_auth: $.data.error_id }
          assert:
            - "the first REQUEST succeeds while the grant is ACTIVE: CancellationOrder.${co1_id}.status == REQUESTED"
            - "AuthorityGrant.${grant_id}.status == REVOKED with revocation_reason REGISTRAR_ORDER"
            - "DigitalAsset.${a1_id}.access_status == ACCESS_REVOKED"
            - "DigitalAsset.${a2_id}.access_status == ACCESS_REVOKED"
            - "${err_auth} == ERR_NO_ACTIVE_AUTHORITY"
            - "the second REQUEST returns HTTP 409"
            - "CancellationOrder.${co2_id}.status == PENDING (unchanged)"
            - "Estate.${est_id}.disclosed_asset_count == 0"
            - "Estate.${est_id}.open_cancellation_count == 2"
            - "a REVOKE of the already REVOKED grant returns HTTP 409 with error_id ERR_INVALID_GRANT_STATE"

      - name: election_execute_depends_on_platform_status_in_another_aggregate
        grounds:
          - validations[priority=42]
          - entities.Platform.fields.status
          - state_machines.DispositionElection.transitions[SUBMITTED->EXECUTED]
          - state_machines.DigitalAsset.transitions[disposition_status ELECTED->EXECUTED]
        distinguishing_aspect: |
          A fully countersigned, fully authorized MEMORIALIZE election in SUBMITTED cannot be executed
          while Platform.status == SUSPENDED — a field on an aggregate that the election does not
          reference directly — and the identical EXECUTE call succeeds once the provider is patched
          back to PARTICIPATING, with the election and the asset both still in their pre-attempt
          states after the refusal.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform CloudVault PARTICIPATING with supports_memorialization true"
            - "one estate with VERIFIED death certificate and letters, one CLOUD_STORAGE asset CATALOG_DISCLOSED by an APPROVED request"
            - "a MEMORIALIZE election already SUBMITTED on that asset"
            - "the provider is then PATCHed to status SUSPENDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0, status: "PARTICIPATING" }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-S" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-S1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-S", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-S", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-memorial", quoted_value_cents: 75000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "GET /digital-assets/${a_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_v1: $.data.version }
            - call: "POST /digital-assets/${a_id}/disposition-elections"
              payload: { election: "MEMORIALIZE", expected_asset_version: "${a_v1}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { el_id: $.data.id }
            - call: "POST /disposition-elections/${el_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "PATCH /platforms/${p_cloud_id}"
              payload: { status: "SUSPENDED" }
              as: EstateAdmin
          trigger:
            - call: "POST /disposition-elections/${el_id}/transitions"
              payload: { action: "EXECUTE", platform_confirmation_reference: "CV-MEM-S1" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
              captures: { err_susp: $.data.error_id }
            - call: "PATCH /platforms/${p_cloud_id}"
              payload: { status: "PARTICIPATING" }
              as: EstateAdmin
            - call: "POST /disposition-elections/${el_id}/transitions"
              payload: { action: "EXECUTE", platform_confirmation_reference: "CV-MEM-S2" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
          assert:
            - "${err_susp} == ERR_PLATFORM_SUSPENDED"
            - "the suspended EXECUTE returns HTTP 409"
            - "after the refusal: DispositionElection.${el_id}.status == SUBMITTED and executed_at == null"
            - "after the refusal: DigitalAsset.${a_id}.disposition_status == ELECTED and disposed_at == null"
            - "after the refusal: Estate.${est_id}.assets_disposed_count == 0 and administration_phase == DISCLOSURE"
            - "after the provider is restored: DispositionElection.${el_id}.status == EXECUTED with platform_confirmation_reference CV-MEM-S2"
            - "after the provider is restored: DigitalAsset.${a_id}.disposition_status == EXECUTED"
            - "after the provider is restored: Estate.${est_id}.assets_disposed_count == 1 and administration_phase == WIND_DOWN"

      - name: request_submit_depends_on_death_certificate_verification_state
        grounds:
          - validations[priority=40]
          - state_machines.Document.transitions[PENDING->VERIFIED]
          - state_machines.PlatformRequest.transitions[DRAFT->SUBMITTED]
          - entities.Document.fields.verification_status
        distinguishing_aspect: |
          The DRAFT request is complete and its letters are VERIFIED and ISSUED, yet SUBMIT is
          refused with ERR_DEATH_CERTIFICATE_NOT_VERIFIED purely because the referenced
          DEATH_CERTIFICATE Document is still PENDING; the identical SUBMIT succeeds after the
          CourtRegistrar verifies that certificate, and the estate's administration_phase only leaves
          INTAKE at that verification, not at the submission.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform CloudVault"
            - "one estate whose DEATH_CERTIFICATE Document is still PENDING and whose LETTERS_OF_AUTHORITY Document is VERIFIED"
            - "one DRAFT CATALOG_ACCESS request referencing both documents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
