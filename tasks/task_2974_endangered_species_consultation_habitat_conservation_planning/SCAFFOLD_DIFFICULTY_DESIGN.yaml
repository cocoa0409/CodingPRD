            - call: "POST /incidental-take-permits/${permit_id}/monitoring-reports"
              payload: {period_start: "2026-10-01", period_end: "2026-12-31", take_units_reported: 3.60, mitigation_units_verified: 59.72, expected_permit_version: "${permit_v1}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {r1_id: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2027-05-20T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "GET /incidental-take-permits/${permit_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {permit_v3: "$.data.version", consumed_before: "$.data.take_consumed_units", remaining_before: "$.data.take_remaining_units", status_before: "$.data.status"}
          trigger:
            - call: "POST /incidental-take-permits/${permit_id}/monitoring-reports"
              payload: {period_start: "2027-01-01", period_end: "2027-03-31", take_units_reported: 1.00, mitigation_units_verified: 59.72, expected_permit_version: "${permit_v3}"}
              as: Proponent
              as_user_id: "${proponent_id}"
          assert:
            - "the captured ${status_before} == 'SUSPENDED', ${consumed_before} == 3.60 and ${remaining_before} == 0.40 — both violated conditions are now armed"
            - "the trigger returns ERR_PERMIT_NOT_ACTIVE with HTTP 409"
            - "the trigger does NOT return ERR_TAKE_LIMIT_EXCEEDED (422), even though take_units_reported 1.00 exceeds take_remaining_units 0.40"
            - "GET /incidental-take-permits/${permit_id} still reports take_consumed_units == 3.60, take_remaining_units == 0.40, status == 'SUSPENDED' and suspension_count == 1 — the refused request moved nothing"
            - "GET /incidental-take-permits/${permit_id}/monitoring-reports returns exactly one row (R1): no MonitoringReport was created"
            - "re-sending the identical body with the stale ${permit_v1} instead returns ERR_STALE_PERMIT_VERSION (412), because the OCC gate at priority 8 precedes the permit-status gate at priority 10"
            - "after POST /monitoring-reports/${r1_id}/adjudication with decision REJECT the permit returns to 'ACTIVE' with take_consumed_units 0.00, and the same trigger body (with the then-current version) succeeds with 201 — proving the 409 was about status, not about the payload"

