        grounds:
          - calculations.tuition_benefit_tax_assessment
          - state_machines.TaxAssessment.FINAL_to_AMENDED
          - state_machines.Appointment.ACTIVE_to_TERMINATED
          - entities.StipendPolicy.fields.tuition_tax_exempt_cap_cents
          - entities.GraduateStudent.fields.tuition_benefit_ytd_cents
        distinguishing_aspect: |
          The per-row identity benefit_cents == exempt_cents + taxable_cents and the year-level ceiling
          sum(exempt) <= 525000 must both survive a compensating amendment: after two finalized terms
          the year has consumed exactly 525000 of exemption, and after the autumn appointment is
