              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerBS", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Bs D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
          trigger:
            - call: "POST /brokers/${brk_id}/suspend"
              payload: {}
              as: Coordinator
          assert:
            - "Broker.${brk_id}.status == SUSPENDED"
            - "TripRequest.${trip_id}.trip_status == SCHEDULED (reverted from ASSIGNED)"
            - "TripRequest.${trip_id}.assigned_driver_id == null"
            - "Driver.${drv_id}.status == AVAILABLE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ineligible_beats_los_on_schedule
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.TripRequest.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          A schedule request that is both (a) for a SUSPENDED member (priority 7,
          business_safety / ERR_MEMBER_INELIGIBLE) and (b) requesting a level of
          service above the covering span (priority 8, business_safety /
          ERR_LOS_NOT_AUTHORIZED) returns ERR_MEMBER_INELIGIBLE — priority 7 wins.
        test_recipe:
          setup:
            - "Member with only an expired/voided span -> SUSPENDED, and a DRAFT trip requesting BARIATRIC LOS."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-04T00:00:00Z" }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-PP1", full_name: "Prio One", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-02-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /members/${mem_id}/eligibility/recompute"
              payload: {}
              as: Coordinator
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "BARIATRIC", appointment_at: "2026-03-05T09:00:00Z", scheduled_loaded_miles: 6, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_MEMBER_INELIGIBLE (priority 7 beats priority 8 ERR_LOS_NOT_AUTHORIZED)"
            - "TripRequest.${trip_id}.trip_status == DRAFT (unchanged)"

      - name: invalid_state_beats_no_broker_on_assign
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - state_machines.TripRequest.SCHEDULED_to_ASSIGNED
        distinguishing_aspect: |
          Assigning a DRAFT trip (not yet SCHEDULED) when also no broker covers the
          member's county fails with ERR_INVALID_STATE (priority 5, state) rather
          than ERR_NO_BROKER_AVAILABLE (priority 13, business_constraint) — a
          state-vs-business_constraint category pair distinct from the safety pair.
        test_recipe:
          setup:
            - "ELIGIBLE member home_county C9 (no broker covers C9); a DRAFT trip never scheduled."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-PP2", full_name: "Prio Two", mobility_level: "AMBULATORY", home_county: "C9" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 5, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id, trip_v: $.data.version }
          trigger:
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v}" }
              as: Broker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE (priority 5 beats priority 13 ERR_NO_BROKER_AVAILABLE)"

