          quantity: "days_late measured against DAYS_PER_ACCRUAL_MONTH = 30 with effective_due_date 2026-11-14T00:00:00Z"
          comparator: "months_late = ceil(days_late / 30)"
          at: { clock: "2027-02-12T00:00:00Z", days_late: 90, months_late: 3, expected_penalty_cents: 6764 }
          at_plus_one: { clock: "2027-02-13T00:00:00Z", days_late: 91, months_late: 4, expected_penalty_cents: 9520 }
        distinguishing_aspect: |
          Day 90 is the last day of the third accrual month, so the penalty is
          2004 + 2255 + 2505 = 6764; day 91 opens a fourth month and adds 2756 for 9520. Two
          filings in two states share the same 2026-11-14 deadline and are swept one day apart
          using the sweep's state_code filter, so both buckets are observed on one organization
          and the ledger must hold the exact sum 16284. Truncating instead of ceiling the month
          count, or rounding the escalation once on the subtotal, misses at least one value.
        test_recipe:
          setup:
            - "StateProfiles CA and NV, both FYE_PLUS_4M_15D with late_fee_base_cents 2004, late_fee_escalation_pct 0.125, late_fee_cap_cents 50000 and cure_period_days 30."
