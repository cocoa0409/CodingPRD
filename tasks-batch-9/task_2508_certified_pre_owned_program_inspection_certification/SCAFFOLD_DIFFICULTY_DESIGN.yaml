              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000202", model_year: 2024, in_service_date: "2024-03-15", odometer_miles: 21000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
