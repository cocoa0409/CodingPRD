  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_site_version_rejected_then_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[parcel-option-supersede-stale-site]
          - validations[priority=9]
          - endpoints[POST /parcel-options]
        distinguishing_aspect: "The single declared OCC rule guards POST /parcel-options through expected_site_version: after the first option bumps the site to version 2, replaying the stale version 1 returns ERR_STALE_SITE_VERSION with HTTP 412 and writes nothing, and the same payload with the refreshed version succeeds."
        test_recipe:
          setup:
            - "Site Alpha in DRAFT with its version captured before any option exists."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id, s1_v0: $.data.version }
          trigger:
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 1, acres: 240, option_premium_usd: 1250000, purchase_price_usd: 42000000, premium_credit_pct: 0.5, window_start: "2027-01-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z", expected_site_version: "${s1_v0}" }
              as: SiteScreeningAnalyst
              captures: { o1_id: $.data.id }
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-200", phase_index: 2, acres: 60, option_premium_usd: 900000, purchase_price_usd: 8000000, premium_credit_pct: 0.5, window_start: "2027-01-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z", expected_site_version: "${s1_v0}" }
              as: SiteScreeningAnalyst
              captures: { e_occ: $.data.error_id }
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { s1_v1: $.data.version }
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-200", phase_index: 2, acres: 60, option_premium_usd: 900000, purchase_price_usd: 8000000, premium_credit_pct: 0.5, window_start: "2027-01-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z", expected_site_version: "${s1_v1}" }
              as: SiteScreeningAnalyst
              captures: { o2_id: $.data.id }
          assert:
            - "the first trigger returns HTTP 201 and CandidateSite.${s1_id}.version == ${s1_v0} + 1"
            - "${e_occ} == ERR_STALE_SITE_VERSION with HTTP 412"
            - "after the stale attempt GET /parcel-options?site_id=${s1_id} returns total_count == 1 and CandidateSite.${s1_id}.version is still ${s1_v0} + 1 (a rejected write does not consume a version)"
            - "${s1_v1} == ${s1_v0} + 1"
            - "the fourth trigger returns HTTP 201 with LandParcelOption.${o2_id}.status == OPTIONED"
            - "CandidateSite.${s1_id}.version == ${s1_v0} + 2 and land_control_pct == 100.00"
            - "SitingProgram.${p_id}.option_exposure_usd == 2150000.00"

