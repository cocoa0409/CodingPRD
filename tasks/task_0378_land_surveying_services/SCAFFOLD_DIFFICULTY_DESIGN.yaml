  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_double_book_half_open_adjacency_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_CREW_DOUBLE_BOOKED]
          - entities.FieldAssignment.fields.scheduled_start
          - entities.FieldAssignment.fields.scheduled_end
        distinguishing_aspect: |
          Crew double-booking uses half-open [start,end) interval semantics: a second assignment that
          starts exactly when the first ends (13:00==13:00) is ALLOWED (adjacency), while a window that
          truly overlaps (12:00-14:00 vs 09:00-13:00) is rejected with ERR_CREW_DOUBLE_BOOKED. No buffer.
        test_recipe:
          setup:
            - "A crew TECH with an existing SCHEDULED 09:00-13:00 assignment on a FIELD_READY order."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord O", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res O", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech O", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "CrewCo", survey_type: "BOUNDARY", parcel_apn: "APN-15", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { order_id: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${order_id}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${order_id}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${order_id}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T13:00:00.000Z", scheduled_end: "2026-07-01T15:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T12:00:00.000Z", scheduled_end: "2026-07-01T14:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent 13:00-15:00 assignment ${adj_id} was created (status SCHEDULED)"
            - "overlapping 12:00-14:00 request error_id == ERR_CREW_DOUBLE_BOOKED"
            - "HTTP status == 409"

      - name: instrument_reservation_buffered_interval_conflict
        grounds:
          - validations[priority=15]
          - errors[ERR_INSTRUMENT_UNAVAILABLE]
          - calculations.assignment_window_minutes
          - entities.InstrumentReservation.fields.reserved_start
          - entities.InstrumentReservation.fields.reserved_end
        distinguishing_aspect: |
          Instrument reservation uses BUFFERED interval semantics (TURNAROUND_MINUTES=60 added on each
          side), a DIFFERENT geometry than crew half-open adjacency and on a DIFFERENT resource entity
          (Instrument): a reservation for 14:30-16:00 against an instrument already HELD 09:00-13:00 is
          rejected because the 60-min buffers ([08:00,14:00) vs [13:30,17:00)) overlap, even though the
          raw windows do not touch.
        test_recipe:
          setup:
            - "An instrument already HELD by an assignment with window 09:00-13:00; a second assignment with window 14:30-16:00 needing the same instrument."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord P", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
