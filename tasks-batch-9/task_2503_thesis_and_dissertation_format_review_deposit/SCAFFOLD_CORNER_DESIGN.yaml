# =============================================================================
# §1.9 Scaffold Corner Design — task 2503, Thesis and Dissertation Format Review & Deposit
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Sections and claim_type values are taken verbatim
# from references/claim-extraction-guide.md; no category is invented. Corners that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml already exercises are emitted as `excluded_because:` stubs that
# cite the covering §1.8 instance by name and carry no test_recipe.
#
# Shared literals used by every chain (identical to §1.8 so fixtures compose):
#   clock start                2026-08-01T00:00:00Z (Registrar reg-1 owns the clock)
#   Term 2026FA                defense_deadline 2026-11-13T23:59:59Z,
#                              format_review_deposit_deadline 2026-12-04T17:00:00Z,
#                              degree_conferral_date 2026-12-18T00:00:00Z,
#                              announcement_lead_business_days 10
#   Students                   "Ada Stone" ada@u.edu / "Ben Ruiz" ben@u.edu, MASTERS, CS
#   Faculty                    "Cara Cho" cho@u.edu TENURED certified (chair),
#                              "Dev Mehta" dev@u.edu TENURE_TRACK certified,
#                              "Eli Novak" eli@u.edu ADJUNCT
#   Room                       R101 "Graduate Hall", seat_capacity 40, turnover_buffer_minutes 30
#   Segregation-of-duties ids  format reviews analyst-1, deposits analyst-2,
#                              committees dean-1, embargoes dean-2,
#                              integrity refer io-1, resolve io-2, registrar reg-1
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:
      - name: term_create_returns_201_with_all_declared_fields
        claim_type: creation
        grounds:
          - endpoints.POST /graduate-school/terms
          - entities.Term.fields.code
          - entities.Term.fields.status
          - entities.Term.fields.conferred_count
        distinguishing_aspect: "POST /graduate-school/terms with all four required inputs returns 201 with status OPEN, conferred_count 0 and every supplied deadline echoed unchanged."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
          assert:
            - "HTTP status of the trigger call == 201"
            - "Term.${term_id}.code == 2026FA"
            - "Term.${term_id}.status == OPEN"
            - "Term.${term_id}.conferred_count == 0"
            - "Term.${term_id}.announcement_lead_business_days == 10"
            - "Term.${term_id}.defense_deadline == 2026-11-13T23:59:59Z"
            - "Term.${term_id}.format_review_deposit_deadline == 2026-12-04T17:00:00Z"
            - "Term.${term_id}.degree_conferral_date == 2026-12-18T00:00:00Z"
            - "Term.${term_id}.version == 1"

      - name: term_omitted_announcement_lead_defaults_to_ten_business_days
        claim_type: defaults
        grounds:
          - entities.Term.fields.announcement_lead_business_days
          - endpoints.POST /graduate-school/terms
        distinguishing_aspect: "Omitting the optional announcement_lead_business_days stores the declared default 10, not null and not 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /graduate-school/terms"
              payload: { code: "2027SP", defense_deadline: "2027-04-16T23:59:59Z", format_review_deposit_deadline: "2027-05-07T17:00:00Z", degree_conferral_date: "2027-05-21T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
          assert:
            - "Term.${term_id}.announcement_lead_business_days == 10"
            - "Term.${term_id}.code == 2027SP"
            - "Term.${term_id}.status == OPEN"

      - name: faculty_member_graduate_faculty_certified_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.FacultyMember.fields.graduate_faculty_certified
          - entities.FacultyMember.fields.active_chair_load
          - endpoints.POST /graduate-school/faculty-members
        distinguishing_aspect: "Omitting graduate_faculty_certified stores false, so the same faculty row is later refused a CHAIR seat by validations priority 22; active_chair_load starts at 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /graduate-school/faculty-members"
              payload: { full_name: "Hal Iyer", email: "hal@u.edu", appointment_type: "TENURED" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP status of the trigger call == 201"
            - "FacultyMember.${fac_id}.graduate_faculty_certified == false"
            - "FacultyMember.${fac_id}.active_chair_load == 0"
            - "FacultyMember.${fac_id}.appointment_type == TENURED"

      - name: student_get_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET /graduate-school/students/{id}
          - entities.Student.fields.graduation_clearance_state
          - entities.Student.fields.degree_conferred
        distinguishing_aspect: "GET /graduate-school/students/{id} returns the row exactly as created, with the computed graduation_clearance_state at its BLOCKED default and degree_conferred false."
        test_recipe:
          setup:
            - "One Student 'Ada Stone' exists; no thesis has been created yet."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /graduate-school/students/${stu_id}"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
          assert:
            - "HTTP status of the trigger call == 200"
            - "the trigger response data.full_name == Ada Stone"
            - "the trigger response data.email == ada@u.edu"
            - "the trigger response data.degree_level == MASTERS"
            - "the trigger response data.program_code == CS"
            - "the trigger response data.graduation_clearance_state == BLOCKED"
            - "the trigger response data.degree_conferred == false"
            - "the trigger response data.transcript_notation == null"

      - name: theses_list_returns_paginated_envelope_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /graduate-school/theses
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two theses in the term, GET /graduate-school/theses?limit=1&offset=0 returns exactly one row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN and two MASTERS candidates each own one DRAFT thesis in it."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_a_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ben Ruiz", email: "ben@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_b_id: $.data.id }
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_a_id}", term_id: "${term_id}", title: "First Thesis", document_type: "THESIS", page_count: 101, third_party_item_count: 0 }
              as: Student
              as_user_id: "${stu_a_id}"
              captures: { thesis_a_id: $.data.id }
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_b_id}", term_id: "${term_id}", title: "Second Thesis", document_type: "THESIS", page_count: 101, third_party_item_count: 0 }
              as: Student
              as_user_id: "${stu_b_id}"
              captures: { thesis_b_id: $.data.id }
          trigger:
            - call: "GET /graduate-school/theses?term_id=${term_id}&limit=1&offset=0"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /graduate-school/theses?term_id=${term_id}&limit=1&offset=1"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "the first trigger response data array length == 1"
            - "the first trigger response meta pagination total_count == 2"
            - "the first trigger response meta pagination has_more == true"
            - "${page1_first_id} == ${thesis_a_id}"
            - "the second trigger response data array length == 1"
            - "the second trigger response meta pagination total_count == 2"
            - "the second trigger response meta pagination has_more == false"
            - "${page2_first_id} == ${thesis_b_id}"

      - name: thesis_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_THESIS_NOT_FOUND]
          - validations.priority_4
          - endpoints.GET /graduate-school/theses/{id}
        distinguishing_aspect: "A syntactically valid but unknown thesis id on a read returns ERR_THESIS_NOT_FOUND with HTTP 404, not an empty 200 envelope."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "GET /graduate-school/theses/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status of the trigger call == 404"
            - "${err_id} == ERR_THESIS_NOT_FOUND"

      - name: student_create_missing_required_email_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_3
          - endpoints.POST /graduate-school/students
        distinguishing_aspect: "Omitting the required input field email returns ERR_INVALID_REQUEST (400) and persists no Student row."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status of the trigger call == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "no Student row exists after the trigger call"

      - name: student_create_with_illegal_degree_level_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Student.fields.degree_level
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "degree_level accepts only MASTERS or DOCTORAL; the member 'POSTDOC' is refused with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "POSTDOC", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status of the trigger call == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "no Student row exists after the trigger call"

      - name: thesis_create_with_page_count_zero_rejected
        claim_type: type_constraints
        grounds:
          - entities.Thesis.fields.page_count
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "page_count carries the constraint >= 1, so 0 is refused with ERR_INVALID_REQUEST (400) before any state or FK check runs."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN and Student 'Ada Stone' exists with no thesis."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", title: "Zero Pages", document_type: "THESIS", page_count: 0 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status of the trigger call == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "no Thesis row exists after the trigger call"

      - name: thesis_computed_counters_and_states_initialised_on_create
        claim_type: computed_fields
        grounds:
          - entities.Thesis.fields.workflow_state
          - entities.Thesis.fields.integrity_state
          - entities.Thesis.fields.format_cycle_count
          - entities.Thesis.fields.documented_permission_count
          - entities.Thesis.fields.analyst_turnaround_bdays_total
          - entities.Thesis.fields.accepted_at
        distinguishing_aspect: "A freshly created Thesis carries workflow_state DRAFT, integrity_state NOT_SCREENED, all three counters at 0 and accepted_at null; third_party_item_count defaults to 0 when omitted."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN and Student 'Ada Stone' exists with no thesis."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", title: "Fresh Thesis", document_type: "THESIS", page_count: 101 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { thesis_id: $.data.id }
          assert:
            - "HTTP status of the trigger call == 201"
            - "Thesis.${thesis_id}.workflow_state == DRAFT"
            - "Thesis.${thesis_id}.integrity_state == NOT_SCREENED"
            - "Thesis.${thesis_id}.format_cycle_count == 0"
            - "Thesis.${thesis_id}.documented_permission_count == 0"
            - "Thesis.${thesis_id}.analyst_turnaround_bdays_total == 0"
            - "Thesis.${thesis_id}.accepted_at == null"
            - "Thesis.${thesis_id}.third_party_item_count == 0"
            - "Thesis.${thesis_id}.version == 1"
            - "GraduationClearance(student_id=${stu_id}).status == BLOCKED"

      - name: committee_member_create_under_unknown_committee_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.CommitteeMember.parent
          - validations.priority_4
          - errors[ERR_COMMITTEE_NOT_FOUND]
        distinguishing_aspect: "CommitteeMember is a child of Committee: seating a faculty member under an unknown committee id returns ERR_COMMITTEE_NOT_FOUND (404) and the path id is validated before the body faculty_id."
        test_recipe:
          setup:
            - "Faculty member 'Cara Cho' exists; no Committee row exists."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/faculty-members"
              payload: { full_name: "Cara Cho", email: "cho@u.edu", appointment_type: "TENURED", graduate_faculty_certified: true }
              as: Registrar
              as_user_id: "reg-1"
              captures: { fac_chair_id: $.data.id }
          trigger:
            - call: "POST /graduate-school/committees/00000000-0000-0000-0000-0000000000bb/members"
              payload: { faculty_id: "${fac_chair_id}", role: "CHAIR" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status of the trigger call == 404"
            - "${err_id} == ERR_COMMITTEE_NOT_FOUND"
            - "FacultyMember.${fac_chair_id}.active_chair_load == 0"

      - name: defense_room_booked_minutes_total_is_system_managed_and_starts_zero
        claim_type: system_fields
        grounds:
          - entities.DefenseRoom.fields.booked_minutes_total
          - entities.DefenseRoom.fields.turnover_buffer_minutes
          - entities.DefenseRoom.fields.status
          - calculations.room_booked_minutes_total
        distinguishing_aspect: "A newly created DefenseRoom reports booked_minutes_total 0 (no input can seed it), turnover_buffer_minutes at the declared default 30 and status at the declared default AVAILABLE."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /graduate-school/defense-rooms"
              payload: { code: "R101", building: "Graduate Hall", seat_capacity: 40 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { room_id: $.data.id }
          assert:
            - "HTTP status of the trigger call == 201"
            - "DefenseRoom.${room_id}.booked_minutes_total == 0"
            - "DefenseRoom.${room_id}.turnover_buffer_minutes == 30"
            - "DefenseRoom.${room_id}.status == AVAILABLE"
            - "DefenseRoom.${room_id}.seat_capacity == 40"

  # ===========================================================================
  # State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: committee_and_seat_initial_states_on_create
        claim_type: initial_state
        grounds:
          - state_machines.Committee.initial_state
          - state_machines.CommitteeMember.initial_state
          - entities.Committee.fields.member_count
          - calculations.committee_composition_counts
        distinguishing_aspect: "A new Committee starts in DRAFT with member_count 0 and approved_by_user_id null; the first seat is created CONFIRMED and lifts member_count to 1 without moving the committee out of DRAFT."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN, Student 'Ada Stone' owns a DRAFT thesis, and faculty 'Cara Cho' (TENURED, certified) exists."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_id: $.data.id }
            - call: "POST /graduate-school/faculty-members"
              payload: { full_name: "Cara Cho", email: "cho@u.edu", appointment_type: "TENURED", graduate_faculty_certified: true }
              as: Registrar
              as_user_id: "reg-1"
              captures: { fac_chair_id: $.data.id }
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", title: "Initial States", document_type: "THESIS", page_count: 101, third_party_item_count: 0 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { thesis_id: $.data.id }
          trigger:
            - call: "POST /graduate-school/committees"
              payload: { thesis_id: "${thesis_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cmte_id: $.data.id }
            - call: "POST /graduate-school/committees/${cmte_id}/members"
              payload: { faculty_id: "${fac_chair_id}", role: "CHAIR" }
              as: Student
              as_user_id: "${stu_id}"
