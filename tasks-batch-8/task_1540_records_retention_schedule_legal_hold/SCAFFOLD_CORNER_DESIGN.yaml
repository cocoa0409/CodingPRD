  # ===========================================================================
  # From Table 6 (Errors) — codes whose trigger is proven here or stubbed to §1.8
  # ===========================================================================
  - section: errors
    instances:
      - name: request_with_nonexistent_record_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCED_RECORD_NOT_FOUND]"]
        distinguishing_aspect: "A disposition request naming a well-formed but nonexistent record id fails body-reference existence with ERR_REFERENCED_RECORD_NOT_FOUND (404)."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
          trigger:
            - call: "POST /ig/disposition-requests"
              payload: { program_id: "${p}", record_ids: ["8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"], method: "SECURE_ERASE", justification: "Purge eligible record batch" }
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_REFERENCED_RECORD_NOT_FOUND"

      - name: rule_with_nonexistent_class_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCED_ENTITY_NOT_FOUND]"]
        distinguishing_aspect: "A retention rule naming a nonexistent record_class_id fails with ERR_REFERENCED_ENTITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Program; jurisdiction exist"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
