  # =========================================================================
  # The claim-extraction guide defines no per-row claim types for Table 6 - the
  # obligation is that EVERY error id in §1.6 is reachable by at least one test.
  # These instances consolidate the ids not already triggered by another section
  # or by §1.8; every instance below uses claim_type "Error Triggerability".
  # =========================================================================
  - section: errors
    instances:
      - name: path_id_not_found_sweep_across_every_resource
        claim_type: Error Triggerability
        grounds:
          - validations.priority_3_ERR_DOMAIN_NOT_FOUND
          - errors.ERR_SOURCE_SYSTEM_NOT_FOUND
          - errors.ERR_REGISTRATION_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_QUALITY_RULE_NOT_FOUND
          - errors.ERR_SCORECARD_RUN_NOT_FOUND
          - errors.ERR_FINDING_NOT_FOUND
          - errors.ERR_MERGE_PROPOSAL_NOT_FOUND
          - errors.ERR_CHANGE_REQUEST_NOT_FOUND
        distinguishing_aspect: "Each resource family owns a DISTINCT 404 id, so a shared 'not found' helper is not enough: the same unknown UUID must produce nine different error ids depending on which collection was addressed."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z. Every trigger uses the all-zero UUID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "GET /mdm/domains/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_domain: $.data.error_id }
            - call: "GET /mdm/source-systems/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_source: $.data.error_id }
            - call: "GET /mdm/stewards/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_steward: $.data.error_id }
            - call: "GET /mdm/source-registrations/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_reg: $.data.error_id }
            - call: "GET /mdm/steward-assignments/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_assign: $.data.error_id }
            - call: "GET /mdm/quality-rules/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_rule: $.data.error_id }
            - call: "GET /mdm/scorecard-runs/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_run: $.data.error_id }
            - call: "GET /mdm/quality-findings/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_finding: $.data.error_id }
            - call: "GET /mdm/merge-proposals/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_proposal: $.data.error_id }
            - call: "GET /mdm/change-requests/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_cr: $.data.error_id }
            - call: "GET /mdm/consumer-subscriptions/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { e_sub: $.data.error_id }
          assert:
            - "every trigger returns HTTP 404 with response_type == error"
            - "${e_domain} == ERR_DOMAIN_NOT_FOUND, ${e_source} == ERR_SOURCE_SYSTEM_NOT_FOUND, ${e_steward} == ERR_STEWARD_NOT_FOUND"
            - "${e_reg} == ERR_REGISTRATION_NOT_FOUND, ${e_assign} == ERR_ASSIGNMENT_NOT_FOUND, ${e_rule} == ERR_QUALITY_RULE_NOT_FOUND"
            - "${e_run} == ERR_SCORECARD_RUN_NOT_FOUND, ${e_finding} == ERR_FINDING_NOT_FOUND"
            - "${e_proposal} == ERR_MERGE_PROPOSAL_NOT_FOUND, ${e_cr} == ERR_CHANGE_REQUEST_NOT_FOUND, ${e_sub} == ERR_SUBSCRIPTION_NOT_FOUND"

      - name: registry_codes_are_globally_unique
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_DUPLICATE_DOMAIN_CODE
          - errors.ERR_DUPLICATE_SOURCE_CODE
          - errors.ERR_DUPLICATE_STEWARD_EMAIL
        distinguishing_aspect: "Domain.code, SourceSystem.code and Steward.email are unique across the whole registry (not per anything), and each collision reports its own 409 id - the second row must not be created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER, source system ERP and steward sam@mdm.test already exist."
