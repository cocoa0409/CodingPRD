# §1.9 Scaffold Corner Design — breadth probe for
# task_2681_wound_ostomy_continence_nurse_consult_service.
#
# Walked row-by-row against references/claim-extraction-guide.md's nine sections
# and this scaffold's own §1.1-§1.7 surface. Corners already asserted by a named
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) instance are emitted as
# `excluded_because:` stubs with no test_recipe.
#
# Every `setup_api_calls` chain below starts from an empty database and uses only
# endpoints declared in §1.5, with roles drawn from §1.7. The default logical
# clock is 2026-08-01T00:00:00Z; any instance that needs a different `now` moves
# it explicitly with POST /_clock/set_current_utc.
#
# Recurring reachability idioms discovered during this audit pass:
#   CERTIFY-A-NURSE : POST /woc-nurses -> two POST /woc-nurses/{id}/competency-signoffs
#                     -> POST /advance -> POST /certify. ce_credits 30 with both
#                     signoffs at the default clock yields
#                     certification_eligibility_score 64.00, clearing the
#                     ELIGIBILITY_SCORE_FLOOR 55.00 / CE_CREDIT_FLOOR 30 /
#                     SIGNOFF_FLOOR 2 gate of validations[priority=62].
#   OCC-READ-FIRST  : every write carrying expected_patient_version or
#                     expected_unit_version is preceded by GET /patients/{id} or
#                     GET /units/{id} capturing $.data.version.
#   DRIVE-TO-PLAN   : POST /consult-requests -> /triage -> /assign ->
#                     POST /skin-assessments -> /validate (by a DIFFERENT nurse,
#                     validations[priority=30]) -> POST /dressing-protocols.

scaffold_corner_design:
  - section: entities
    instances:
      - name: unit_create_returns_full_ledger_shape_zeroed
        claim_type: Creation
        grounds:
          - entities.Unit
          - endpoints[POST /units]
          - response_envelope.success
        distinguishing_aspect: "A brand-new Unit must expose all nine computed ledger/posture fields at their declared defaults, with rental_available_cents already equal to the supplied cap rather than null or 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
          assert:
            - "HTTP status is 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Unit.${u1_id}.id is a bare lowercase UUID with no type prefix, and version == 1"
            - "Unit.${u1_id}.unit_code == \"3E\", name == \"Three East\", bed_count == 18, rental_budget_cap_cents == 250000"
            - "Unit.${u1_id}.rental_encumbered_cents == 0, rental_committed_cents == 0, rental_released_cents == 0"
            - "Unit.${u1_id}.rental_available_cents == 250000 (cap 250000 - 0 - 0)"
            - "Unit.${u1_id}.open_hapi_rca_count == 0, disputed_staging_count == 0, survey_posture == OPEN"
            - "Unit.${u1_id}.last_prevalence_rate == null and last_incidence_rate == null"
            - "created_at and updated_at are ISO 8601 UTC with three fractional digits and are equal on the freshly created row"

      - name: unit_rental_budget_cap_defaults_to_zero_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Unit.fields.rental_budget_cap_cents
          - endpoints[POST /units].input
        distinguishing_aspect: "rental_budget_cap_cents is the only optional input on POST /units; omitting it must yield 0 (and therefore 0 headroom), not null and not an unbounded budget."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { unit_code: "4W", name: "Four West", bed_count: 12 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
          assert:
            - "HTTP status is 201 and Unit.${u1_id}.rental_budget_cap_cents == 0"
            - "Unit.${u1_id}.rental_available_cents == 0 — no headroom at all, so any later approve would trip validations[priority=72]"
            - "Unit.${u1_id}.survey_posture == OPEN — the posture default is independent of the budget default"

      - name: patient_optional_risk_flags_default_to_zero_and_false
        claim_type: Defaults
        grounds:
          - entities.Patient.fields.comorbidity_count
          - entities.Patient.fields.device_related_risk
          - entities.Patient.fields.ostomy_present
          - endpoints[POST /patients].input
        distinguishing_aspect: "Three independent optional acuity inputs default together; because comorbidity_count defaults to 0 and device_related_risk to false, a consult on this patient scores base_points alone with no comorbid_points and no device_points."
        test_recipe:
          setup:
            - "Unit 3E exists."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-D1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          assert:
            - "HTTP status is 201 and Patient.${p1_id}.comorbidity_count == 0, device_related_risk == false, ostomy_present == false"
            - "Patient.${p1_id}.status == ADMITTED, discharged_at == null, version == 1"
            - "Patient.${p1_id}.poa_skin_assessment_documented == false and pending_outpatient_followup_count == 0"
            - "Patient.${p1_id}.unit_id == ${u1_id} and mrn == \"MRN-D1\""

      - name: patient_get_by_id_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /patients/{patient_id}]
          - entities.Patient
        distinguishing_aspect: "A read-only GET must echo every stored field with no mutation: version stays 1 and updated_at is unchanged by the read itself."
        test_recipe:
          setup:
            - "Unit 3E exists; Patient MRN-D2 was admitted 2026-07-30T06:00:00Z with comorbidity_count 3, device_related_risk true and ostomy_present true."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-D2", unit_id: "${u1_id}", admitted_at: "2026-07-30T06:00:00Z", comorbidity_count: 3, device_related_risk: true, ostomy_present: true }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${u1_id}"
          assert:
            - "HTTP status is 200, response_type == \"object\", and data.id == ${p1_id}"
            - "data.mrn == \"MRN-D2\", admitted_at == 2026-07-30T06:00:00Z, comorbidity_count == 3, device_related_risk == true, ostomy_present == true"
            - "data.version == 1 — a GET performs no mutation, so no version increment"
            - "data.status == ADMITTED and data.unit_id == ${u1_id}"

      - name: consult_request_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /consult-requests]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count must report the full filtered set (3) rather than the returned page size (2), and has_more must flip to false on the page that exhausts the set."
        test_recipe:
          setup:
            - "Unit 3E exists with three ADMITTED patients MRN-L1, MRN-L2 and MRN-L3."
            - "One REQUESTED ConsultRequest exists for each patient, all on unit 3E."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-L1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-L2", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-L3", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p3_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Sacral erythema." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p2_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Heel erythema." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c2_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p3_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Coccyx erythema." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c3_id: "$.data.id" }
          trigger:
            - call: "GET /consult-requests"
              payload: { requesting_unit_id: "${u1_id}", limit: 2, offset: 0 }
              as: WocProgramDirector
              captures: { first_page_row0_id: "$.data[0].id" }
            - call: "GET /consult-requests"
              payload: { requesting_unit_id: "${u1_id}", limit: 2, offset: 2 }
              as: WocProgramDirector
              captures: { second_page_row0_id: "$.data[0].id" }
          assert:
            - "Page 1: HTTP 200, response_type == \"array\", exactly 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: exactly 1 row returned, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "${first_page_row0_id} != ${second_page_row0_id} — the two pages are disjoint"
            - "The union of the two pages is exactly {${c1_id}, ${c2_id}, ${c3_id}}"

      - name: get_unknown_support_surface_id_returns_surface_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_SURFACE_NOT_FOUND]
          - endpoints[GET /support-surfaces/{surface_id}]
        distinguishing_aspect: "A syntactically valid but unknown UUID in the path must produce the entity-specific 404 ERR_SURFACE_NOT_FOUND, not a generic ERR_INVALID_REQUEST and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database — no SupportSurface rows at all."
          setup_api_calls: []
          trigger:
            - call: "GET /support-surfaces/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: MaterialsCoordinator
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_SURFACE_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty string"
            - "No SupportSurface row is created as a side effect of the failed read"

      - name: formulary_product_create_missing_required_unit_cost_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /formulary-products].input
        distinguishing_aspect: "unit_cost_cents has source input with no default, so omitting it is a schema violation caught at priority 3 — before any uniqueness check at priority 55 could look at the sku."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /formulary-products"
              payload: { sku: "FOAM-99", name: "Silicone foam dressing", category: "FOAM", formulary_tier: "PREFERRED" }
              as: WocProgramDirector
              captures: { err_id: "$.data.error_id" }
            - call: "GET /formulary-products"
              payload: {}
              as: WocProgramDirector
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "The follow-up GET /formulary-products returns total_count == 0 — the rejected create persisted nothing"

      - name: consult_request_invalid_reported_stage_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - entities.ConsultRequest.fields.reported_stage
          - calculations.consult_acuity_score.constants.STAGE_WEIGHT
        distinguishing_aspect: "reported_stage must be a member of STAGE_WEIGHT's key set; an out-of-range member such as STAGE_9 is rejected at priority 3 rather than silently scoring 0 points at triage."
        test_recipe:
          setup:
            - "Unit 3E exists with ADMITTED patient MRN-E1."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-E1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_9", clinical_note: "Unstageable per bedside RN." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /consult-requests"
              payload: { patient_id: "${p1_id}" }
              as: UnitCharge
              as_user_id: "${u1_id}"
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /consult-requests?patient_id=${p1_id} returns total_count == 0"
            - "An invalid consult_type such as \"PRESSURE\" is rejected the same way — both enums are closed sets"

      - name: support_surface_order_cost_fields_computed_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.SupportSurfaceOrder.fields.projected_cost_cents
          - entities.SupportSurfaceOrder.fields.authorized_cost_cents
          - calculations.rental_cost_projection
          - calculations.vendor_service_fee
          - endpoints[POST /support-surface-orders].input
        distinguishing_aspect: "The four money fields are source computed and are absent from the endpoint's declared input, so a client attempt to dictate them is a priority-3 schema violation; the identical payload without them yields the formula's own figures."
        test_recipe:
          setup:
            - "Unit 3E exists with cap 500000 and ADMITTED patient MRN-C1."
            - "SupportSurface BED-070 is AVAILABLE at daily_rate_cents 20000."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-C1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-070", surface_class: "LOW_AIR_LOSS", daily_rate_cents: 20000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-06T00:00:00Z", authorized_days: 5, projected_cost_cents: 1, authorized_cost_cents: 1 }
              as: MaterialsCoordinator
              captures: { err_id: "$.data.error_id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-06T00:00:00Z", authorized_days: 5 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST — projected_cost_cents and authorized_cost_cents are not declared inputs of POST /support-surface-orders"
            - "The second call returns HTTP 201 with SupportSurfaceOrder.${o1_id}.billable_days == 5 (120 interval hours / BILLABLE_DAY_HOURS 24)"
            - "SupportSurfaceOrder.${o1_id}.projected_cost_cents == 100000 (5 tier-1 days at 20000, TIER_1_FACTOR 1.0)"
            - "SupportSurfaceOrder.${o1_id}.vendor_service_fee_cents == 5000 (100000 falls in [FEE_TIER_2_FLOOR 50000, FEE_TIER_3_FLOOR 200000) so FEE_PCT_TIER_2 0.05)"
            - "SupportSurfaceOrder.${o1_id}.authorized_cost_cents == 105000 and neither money field is 1"
            - "SupportSurfaceOrder.${o1_id}.fulfillment_status == REQUESTED, billing_status == UNBILLED, actual_cost_cents == null, requires_director_override == false"
            - "Unit.${u1_id}.rental_encumbered_cents == 0 — creating an order encumbers nothing"

      - name: unit_system_fields_server_minted_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Unit
          - validations[priority=3]
        distinguishing_aspect: "id, created_at, updated_at and version are common_fields owned by the server and are not members of any endpoint's input list, so supplying them is rejected rather than honored."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { unit_code: "5N", name: "Five North", bed_count: 20, id: "22222222-2222-4222-8222-222222222222", version: 99 }
              as: WocProgramDirector
              captures: { err_id: "$.data.error_id" }
            - call: "POST /units"
              payload: { unit_code: "5N", name: "Five North", bed_count: 20 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "The second call returns HTTP 201 and Unit.${u1_id}.id != \"22222222-2222-4222-8222-222222222222\""
            - "Unit.${u1_id}.version == 1, not 99"
            - "Unit.${u1_id}.created_at and updated_at are server-generated ISO 8601 UTC values"

      - name: survey_observation_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.SurveyObservation
          - endpoints[POST /survey-observations]
          - endpoints[GET /survey-observations/{observation_id}]
        distinguishing_aspect: "SurveyObservation is the scaffold's only common_fields: false entity — it carries id and created_at but no updated_at and no version, and §1.5 declares no update, no delete and no action endpoint for it, so a published round's inputs are frozen by construction."
        test_recipe:
          setup:
            - "Unit 3E exists with ADMITTED patient MRN-O1."
            - "WocNurse Nina is CERTIFIED (CERTIFY-A-NURSE idiom)."
            - "A PREVALENCE round covering 2026-08-01T00:00:00Z..2026-08-05T00:00:00Z on 3E is OPEN."
            - "One observation has been filed for MRN-O1 in that round."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-O1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "PREVALENCE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r1_id: "$.data.id" }
            - call: "POST /survey-rounds/${r1_id}/open"
              payload: {}
              as: WocProgramDirector
          trigger:
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${r1_id}", unit_id: "${u1_id}", patient_id: "${p1_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "POA", observed_stage: "STAGE_2", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { ob1_id: "$.data.id" }
            - call: "GET /survey-observations/${ob1_id}"
              payload: {}
              as: WocProgramDirector
          assert:
            - "HTTP status is 201; the SurveyObservation body contains id and created_at"
            - "The SurveyObservation body contains NO version field and NO updated_at field (common_fields: false)"
            - "§1.5 declares exactly three endpoints touching this collection — POST /survey-observations, GET /survey-observations, GET /survey-observations/{observation_id} — and no PUT, PATCH, DELETE or action endpoint"
            - "The follow-up GET /survey-observations/${ob1_id} returns HTTP 200 with byte-identical field values, including onset_at == null (omitted because classification == POA)"
            - "SurveyRound.${r1_id}.observation_count == 1 and status == OPEN"

      - name: patient_create_with_unknown_unit_id_returns_unit_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_UNIT_NOT_FOUND]
          - entities.Patient.fields.unit_id
        distinguishing_aspect: "unit_id is a body foreign key, so an unresolvable value is caught by the priority-5 body-FK pass with the parent's own 404 code, distinct from the priority-4 path-parameter pass."
        test_recipe:
          setup:
            - "Empty database — no Unit rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-X1", unit_id: "33333333-3333-4333-8333-333333333333", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "33333333-3333-4333-8333-333333333333"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /patients"
              payload: {}
              as: WocProgramDirector
          assert:
            - "HTTP status is 404 and data.error_id == ERR_UNIT_NOT_FOUND"
            - "The follow-up GET /patients returns total_count == 0"

      - name: consult_request_requesting_unit_mismatch_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_ENTITY_LINK_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology's integrity rule is field agreement, not mere existence: both Units and the Patient resolve, so priority 5 passes, and only the priority-6 cross-entity check catches requesting_unit_id != Patient.unit_id."
        test_recipe:
          setup:
            - "Units 3E and 4W both exist."
            - "Patient MRN-M9 is ADMITTED on 3E."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /units"
              payload: { unit_code: "4W", name: "Four West", bed_count: 12, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u2_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-M9", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u2_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Filed by the wrong unit's charge nurse." }
              as: UnitCharge
              as_user_id: "${u2_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_ENTITY_LINK_MISMATCH"
            - "data.error_id is not any *_NOT_FOUND code — both ${u2_id} and ${p1_id} resolve, so the priority-5 existence pass is satisfied"
            - "GET /consult-requests?patient_id=${p1_id} returns total_count == 0"
            - "Repeating the call with requesting_unit_id == ${u1_id} returns HTTP 201, proving field agreement is the only thing that changed"

  - section: state_machines
    instances:
      - name: patient_discharge_moves_admitted_to_discharged
        claim_type: Valid Transition
        grounds:
          - state_machines.Patient.ADMITTED_to_DISCHARGED
          - endpoints[POST /patients/{patient_id}/discharge]
        distinguishing_aspect: "The Patient machine is the scaffold's only two-state machine; the transition must both flip status and stamp discharged_at from the payload, bumping version exactly once."
        test_recipe:
          setup:
            - "Unit 3E exists with ADMITTED patient MRN-G1."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-G1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /patients/${p1_id}/discharge"
              payload: { discharged_at: "2026-08-02T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
          assert:
            - "HTTP status is 200 and Patient.${p1_id}.status == DISCHARGED"
            - "Patient.${p1_id}.discharged_at == 2026-08-02T00:00:00Z and admitted_at is unchanged at 2026-07-31T00:00:00Z"
            - "Patient.${p1_id}.version == 2 — exactly one increment"
            - "Unit.${u1_id}.version == 1 — discharging a patient touches no Unit counter"

      - name: consult_request_initial_state_is_requested_with_null_scoring
        claim_type: Initial State
        grounds:
          - state_machines.ConsultRequest.initial_state
          - entities.ConsultRequest
        distinguishing_aspect: "Scoring is a triage product, not a creation product: acuity_score, acuity_variant, priority_band, triaged_at and sla_due_at must all be null on a REQUESTED row even though every input needed to compute them is already present."
        test_recipe:
          setup:
            - "Unit 3E exists with ADMITTED patient MRN-G2 carrying comorbidity_count 4 and device_related_risk true."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-G2", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 4, device_related_risk: true }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "INCONTINENCE", reported_stage: "STAGE_2", clinical_note: "IAD over the buttocks." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
          assert:
            - "HTTP status is 201 and ConsultRequest.${c1_id}.status == REQUESTED"
            - "ConsultRequest.${c1_id}.acuity_score == null, acuity_variant == null, priority_band == null, triaged_at == null, sla_due_at == null"
            - "ConsultRequest.${c1_id}.assigned_nurse_id == null, revision_count == 0, escalation_count == 0, protocol_hold == false, closing_summary == null"
            - "ConsultRequest.${c1_id}.version == 1"

      - name: triage_from_returned_for_info_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ConsultRequest.RETURNED_FOR_INFO
          - validations[priority=10]
          - errors[ERR_CONSULT_INVALID_STATE]
        distinguishing_aspect: "RETURNED_FOR_INFO accepts only resubmit and cancel; triage requires REQUESTED. The rejection must not consume a revision, so revision_count stays 0 and the resubmit path remains open afterwards."
        test_recipe:
          setup:
            - "Unit 3E, CERTIFIED nurse Nina and ADMITTED patient MRN-G3 exist."
            - "Consult C1 was triaged and then returned for more information, so it sits at RETURNED_FOR_INFO with revision_count 0."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-G3", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Redness, no measurement supplied." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/return"
              payload: { reason: "Measurement and photo missing." }
              as: WocNurse
              as_user_id: "${n1_id}"
          trigger:
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_CONSULT_INVALID_STATE"
            - "ConsultRequest.${c1_id}.status == RETURNED_FOR_INFO (unchanged) and revision_count == 0"
            - "ConsultRequest.${c1_id}.acuity_score == 20.0 and priority_band == P3, left intact by the return per the TRIAGED -> RETURNED_FOR_INFO side effects"
            - "ConsultRequest.${c1_id}.sla_due_at == null — the return cleared the SLA clock and the refused triage did not restore it"

      - name: second_discharge_of_same_patient_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Patient.terminal_states
          - validations[priority=16]
          - errors[ERR_PATIENT_DISCHARGED]
        distinguishing_aspect: "DISCHARGED is terminal, and the guard is the domain-specific ERR_PATIENT_DISCHARGED at priority 16 rather than a generic invalid-state code; the second call must not overwrite discharged_at with its own payload value."
        test_recipe:
          setup:
            - "Unit 3E exists; patient MRN-G4 was discharged at 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-G4", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /patients/${p1_id}/discharge"
              payload: { discharged_at: "2026-08-02T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /patients/${p1_id}/discharge"
              payload: { discharged_at: "2026-08-03T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_PATIENT_DISCHARGED"
            - "Patient.${p1_id}.discharged_at is still 2026-08-02T00:00:00Z, not 2026-08-03T00:00:00Z"
            - "Patient.${p1_id}.version == 2 — the refused second discharge performed no write"

      - name: cancelled_consult_cannot_be_cancelled_or_closed_again
        claim_type: Idempotency
        grounds:
          - state_machines.ConsultRequest.terminal_states
          - validations[priority=10]
          - errors[ERR_CONSULT_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal for BOTH remaining action verbs: the shared cancel precondition is `status NOT IN {CLOSED, CANCELLED}`, so a repeat cancel and a close attempt must both fail with the same code and neither may re-run the cancel cascade."
        test_recipe:
          setup:
            - "Unit 3E exists with ADMITTED patient MRN-G5 and a TRAINEE nurse Nina, present only so the WocNurse-only close endpoint can be called with a real X-User-ID."
            - "Consult C1 was created and immediately cancelled from REQUESTED."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-G5", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}" }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Filed in error." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/cancel"
              payload: { reason: "Duplicate of an existing consult." }
              as: WocProgramDirector
          trigger:
            - call: "POST /consult-requests/${c1_id}/cancel"
              payload: { reason: "Second attempt." }
              as: WocProgramDirector
              captures: { err_id: "$.data.error_id" }
            - call: "POST /consult-requests/${c1_id}/close"
              payload: { closing_summary: "Attempting to close a cancelled consult." }
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "The repeat cancel returns HTTP 409 with data.error_id == ERR_CONSULT_INVALID_STATE"
            - "The close attempt also returns HTTP 409 with data.error_id == ERR_CONSULT_INVALID_STATE"
            - "ConsultRequest.${c1_id}.status == CANCELLED and closing_summary == null"
            - "ConsultRequest.${c1_id}.version is unchanged by either refused call"

      - name: escalate_then_reassign_returns_consult_to_assigned
        claim_type: cyclic
        grounds:
          - state_machines.ConsultRequest.ASSIGNED_to_ESCALATED
          - state_machines.ConsultRequest.ESCALATED_to_ASSIGNED
          - complexity_profile.state_machine_shape
          - global_constants.SLA_HOURS_BY_BAND
        distinguishing_aspect: "The escalation loop is the ConsultRequest machine's non-revision cycle: ESCALATED is not terminal and re-assignment returns the row to ASSIGNED while moving load off the old nurse onto the new one. Escalating is gated on the logical clock passing sla_due_at, so the clock must be advanced first."
        test_recipe:
          setup:
            - "Unit 3E exists with CERTIFIED nurses Nina and Omar and ADMITTED patient MRN-G6."
            - "Consult C1 was triaged at the default clock as STAGE_1 / WOUND, so acuity_score is 20.0, priority_band P3 and sla_due_at 2026-08-04T00:00:00Z, and it is ASSIGNED to Nina."
            - "The logical clock is then moved to 2026-08-05T00:00:00Z so the SLA has demonstrably passed."
