  - rule_id: non_linear_state_machine
    instances:
      - name: exhibition_status_and_settlement_axes_advance_independently
        grounds:
          - state_machines.Exhibition[axis=status].ON_VIEW_to_CLOSED
          - state_machines.Exhibition[axis=settlement_status].NOT_STARTED_to_RECONCILING
          - state_machines.Exhibition[axis=settlement_status].PAYOUTS_RELEASED_to_BOOKS_CLOSED
          - calculations.settlement_retention
          - calculations.insurance_premium_assessment
          - validations[priority=9]
          - errors[ERR_SETTLEMENT_PHASE_INVALID]
        distinguishing_aspect: |
          PARALLEL non-linearity: the settlement axis moves NOT_STARTED -> RECONCILING while the
          status axis is still ON_VIEW, and the later status move ON_VIEW -> CLOSED leaves
          settlement_status untouched at RECONCILING; BOOKS_CLOSED is then still refused because
