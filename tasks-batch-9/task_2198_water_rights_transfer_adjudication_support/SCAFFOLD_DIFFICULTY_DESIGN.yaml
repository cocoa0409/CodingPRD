            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
