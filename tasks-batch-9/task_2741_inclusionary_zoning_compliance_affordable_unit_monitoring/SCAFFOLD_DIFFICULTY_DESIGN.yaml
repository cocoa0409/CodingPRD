            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Alder Mews", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-AM-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "A-301", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Tomas Berger", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { cert_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
