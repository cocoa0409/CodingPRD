# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Claim Index)
# Task 2426 — Federally Qualified Health Center Sliding Fee & Section 330 Compliance
#
# Sections and claim_type values come from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs.
#
# Shared empty-DB bootstrap, replayed by YAML alias (anchors are defined the
# first time each call appears and reused verbatim afterwards):
#   BOOT_CORE = [*c_pg26, *c_hc, *c_site, *c_svc, *c_chair, *c_fs, *c_t1, *c_t2,
#                *c_hcv, *c_adopt]
#     -> grantee 'Corner Community Health' (H80CS00500, pps_base_rate_cents 20000,
#        medicare_upper_limit_cents 15000, nominal_fee_cap_cents 2500) with one
#        IN_SCOPE SERVICE_DELIVERY site, one IN_SCOPE REQUIRED_PRIMARY service,
#        one SEATED NON_PATIENT board seat, and an ADOPTED FeeSchedule
#        (fpg_year 2026, [2026-01-01, 2027-01-01), nominal_fee_cents 2500) whose
#        two-band ladder is NOMINAL_FULL [0,100) and FULL_CHARGE [100, null).
#        HealthCenter.version is exactly 5 after BOOT_CORE (create 1, site 2,
#        service 3, board seat 4, adopt 5); *c_hcv observes version 4.
#   BOOT_PT   = BOOT_CORE + [*c_p, *c_iv, *c_ivv]
#     -> Patient 'Val Osei' (MRN-C01, household_size 1) with a VERIFIED
#        IncomeVerification: declared_annual_income_cents 1000000, household_size 1,
#        effective_date 2026-03-01, expires_at 2027-03-01, fpg_percent 61.73,
#        uds_fpg_percent 61.73, assigned_tier_label NOMINAL_FULL.
# Logical clock default is 2026-08-01T00:00:00Z; chains set it only when needed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: health_center_creation_returns_declared_and_system_seeded_fields
        claim_type: creation
        grounds:
          - endpoints[POST /health-centers]
          - entities.HealthCenter
          - entities.HealthCenter.fields.scope_baseline_locked
          - entities.HealthCenter.fields.operational_status
          - entities.HealthCenter.fields.scope_posture
          - entities.HealthCenter.fields.governance_posture
        distinguishing_aspect: >-
          A brand-new grantee is returned with every input field echoed and every computed/system
          field seeded to its declared default — version 1, scope_baseline_locked false,
          operational_status ACTIVE, scope_posture OPEN, governance_posture GOVERNANCE_DEFICIENT
          (zero seats cannot satisfy MIN_BOARD_SEATS 3), and all six counters at 0.
        test_recipe:
          setup:
            - "Empty database; the 2026 federal poverty guideline is published so later chains can reuse this anchor"
          setup_api_calls:
            - &c_pg26
              call: "POST /poverty-guidelines"
              payload: { guideline_year: 2026, base_amount_cents: 1620000, increment_cents: 570000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cpg26_id: $.data.id }
          trigger:
            - &c_hc
              call: "POST /health-centers"
              payload: { legal_name: "Corner Community Health", grant_number: "H80CS00500", pps_base_rate_cents: 20000, medicare_upper_limit_cents: 15000, nominal_fee_cap_cents: 2500 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { chc_id: $.data.id, chc_v0: $.data.version }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "HealthCenter.${chc_id}.legal_name == \"Corner Community Health\""
            - "HealthCenter.${chc_id}.grant_number == \"H80CS00500\""
            - "HealthCenter.${chc_id}.pps_base_rate_cents == 20000"
            - "HealthCenter.${chc_id}.medicare_upper_limit_cents == 15000"
            - "HealthCenter.${chc_id}.nominal_fee_cap_cents == 2500"
            - "HealthCenter.${chc_id}.version == 1"
            - "HealthCenter.${chc_id}.scope_baseline_locked == false"
            - "HealthCenter.${chc_id}.operational_status == \"ACTIVE\""
            - "HealthCenter.${chc_id}.scope_posture == \"OPEN\""
            - "HealthCenter.${chc_id}.governance_posture == \"GOVERNANCE_DEFICIENT\""
            - "HealthCenter.${chc_id}.open_condition_count == 0"
            - "HealthCenter.${chc_id}.in_scope_site_count == 0"
            - "HealthCenter.${chc_id}.in_scope_service_count == 0"
            - "HealthCenter.${chc_id}.seated_board_count == 0"
            - "HealthCenter.${chc_id}.patient_seat_pct == 0"
            - "HealthCenter.${chc_id}.wraparound_receivable_cents == 0"

      - name: fee_schedule_retrieval_returns_the_stored_adopted_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /fee-schedules/{id}]
          - entities.FeeSchedule
          - state_machines.FeeSchedule.DRAFT_to_ADOPTED
          - calculations.fee_schedule_review_status
        distinguishing_aspect: >-
          GET /fee-schedules/{id} returns exactly the row adoption produced: status ADOPTED,
          adopted_at and last_reviewed_at both stamped with the logical clock 2026-08-01,
          reviewed_against_guideline_year back-filled from fpg_year 2026, review_status CURRENT,
          and superseded_by_fee_schedule_id null.
        test_recipe:
          setup:
            - "BOOT_CORE is executed: grantee, baseline site and service, one SEATED board seat, the two-band fee schedule, adoption"
            - "The logical clock is at its 2026-08-01T00:00:00Z default throughout"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - &c_site
              call: "POST /health-centers/${chc_id}/service-sites"
              payload: { site_name: "Corner Clinic", site_type: "SERVICE_DELIVERY", address_line: "1 Corner Ave", weekly_service_hours: 40, in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { csite_id: $.data.id }
            - &c_svc
              call: "POST /health-centers/${chc_id}/service-definitions"
              payload: { service_code: "GEN_PRIMARY_CARE", service_category: "REQUIRED_PRIMARY", delivery_method: "COLUMN_I_DIRECT", in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { csvc_id: $.data.id }
            - &c_chair
              call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "FINANCE", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cchair_id: $.data.id }
            - &c_fs
              call: "POST /health-centers/${chc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cfs_id: $.data.id }
            - &c_t1
              call: "POST /fee-schedules/${cfs_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ct1_id: $.data.id }
            - &c_t2
              call: "POST /fee-schedules/${cfs_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ct2_id: $.data.id }
            - &c_hcv
              call: "GET /health-centers/${chc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { chc_v: $.data.version }
            - &c_adopt
              call: "POST /fee-schedules/${cfs_id}/adopt"
              payload: { expected_health_center_version: "${chc_v}" }
              as: BoardChair
              as_user_id: "${cchair_id}"
          trigger:
            - call: "GET /fee-schedules/${cfs_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP 200 and response_type == \"object\""
            - "FeeSchedule.${cfs_id}.health_center_id == ${chc_id}"
            - "FeeSchedule.${cfs_id}.status == \"ADOPTED\""
            - "FeeSchedule.${cfs_id}.fpg_year == 2026"
            - "FeeSchedule.${cfs_id}.effective_start == \"2026-01-01T00:00:00.000Z\""
            - "FeeSchedule.${cfs_id}.effective_end == \"2027-01-01T00:00:00.000Z\""
            - "FeeSchedule.${cfs_id}.nominal_fee_cents == 2500"
            - "FeeSchedule.${cfs_id}.adopted_at == \"2026-08-01T00:00:00.000Z\""
            - "FeeSchedule.${cfs_id}.adopted_by_user_id == ${cchair_id}"
            - "FeeSchedule.${cfs_id}.last_reviewed_at == \"2026-08-01T00:00:00.000Z\""
            - "FeeSchedule.${cfs_id}.reviewed_against_guideline_year == 2026"
            - "FeeSchedule.${cfs_id}.review_status == \"CURRENT\""
            - "FeeSchedule.${cfs_id}.superseded_by_fee_schedule_id == null"

      - name: income_verification_computed_fields_populated_on_verify
        claim_type: computed_fields
        grounds:
          - calculations.fpg_percent
          - calculations.discount_tier_assignment
          - entities.IncomeVerification.fields.fpg_percent
          - entities.IncomeVerification.fields.uds_fpg_percent
          - entities.IncomeVerification.fields.expires_at
          - entities.IncomeVerification.fields.assigned_tier_label
          - state_machines.IncomeVerification.SUBMITTED_to_VERIFIED
        distinguishing_aspect: >-
          Both fpg_percent and uds_fpg_percent are computed server-side as 61.73 (1000000 /
          1620000 * 100 = 61.7283… rounded half-up to two decimals), expires_at is derived as
          effective_date + 365 days = 2027-03-01, and assigned_discount_tier_id resolves to the
          NOMINAL_FULL band — none of these five fields appear in the endpoint's input list.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "Patient 'Val Osei' (MRN-C01, household_size 1) is registered and has one SUBMITTED IncomeVerification for 1000000 cents, household_size 1, TAX_RETURN, effective_date 2026-03-01"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - &c_p
              call: "POST /patients"
              payload: { mrn: "MRN-C01", full_name: "Val Osei", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { cp_id: $.data.id, cp_v: $.data.version }
            - &c_iv
              call: "POST /patients/${cp_id}/income-verifications"
              payload: { declared_annual_income_cents: 1000000, household_size: 1, documentation_type: "TAX_RETURN", effective_date: "2026-03-01T00:00:00Z", expected_patient_version: "${cp_v}" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { civ_id: $.data.id }
          trigger:
            - &c_ivv
              call: "POST /income-verifications/${civ_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
          assert:
            - "HTTP 200 and IncomeVerification.${civ_id}.status == \"VERIFIED\""
            - "IncomeVerification.${civ_id}.guideline_year_used == 2026"
            - "IncomeVerification.${civ_id}.fpg_percent == 61.73"
            - "IncomeVerification.${civ_id}.uds_guideline_year_used == 2026"
            - "IncomeVerification.${civ_id}.uds_fpg_percent == 61.73"
            - "IncomeVerification.${civ_id}.assigned_discount_tier_id == ${ct1_id}"
            - "IncomeVerification.${civ_id}.assigned_tier_label == \"NOMINAL_FULL\""
            - "IncomeVerification.${civ_id}.expires_at == \"2027-03-01T00:00:00.000Z\""
            - "IncomeVerification.${civ_id}.verified_by_user_id == \"ev-1\""
            - "IncomeVerification.${civ_id}.supersedes_income_verification_id == null"
            - "Patient.${cp_id}.sliding_fee_status == \"VERIFIED\""

      - name: encounter_listing_returns_paginated_envelope_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /encounters]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          With exactly two Encounter rows in the database, GET /encounters returns
          response_type "array" with total_count 2, has_more false, and the declared defaults
          limit 10 / offset 0 echoed back.
        test_recipe:
          setup:
            - "BOOT_PT is executed"
            - "Two SELF_PAY encounters exist for Val Osei on 2026-03-15 and 2026-04-01, gross_charge_cents 8000 each"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - &c_enc
              call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-15T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cenc_id: $.data.id }
            - &c_enc2
              call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-04-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cenc2_id: $.data.id }
          trigger:
            - call: "GET /encounters"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
          assert:
            - "HTTP 200 and response_type == \"array\""
            - "total_count == 2"
            - "has_more == false"
            - "limit == 10"
            - "offset == 0"
            - "the returned data array contains exactly the ids ${cenc_id} and ${cenc2_id}"

      - name: patient_retrieval_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /patients/{id}]
          - validations[priority 6]
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: >-
          A syntactically valid UUID that no Patient row carries yields ERR_PATIENT_NOT_FOUND
          with HTTP 404 — not 400 and not an empty 200 envelope.
        test_recipe:
          setup:
            - "One Patient exists so the table is non-empty and the 404 cannot be a vacuous-table artefact"
          setup_api_calls:
            - *c_p
          trigger:
            - call: "GET /patients/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { e_pnf: $.data.error_id }
          assert:
            - "HTTP 404 and response_type == \"error\""
            - "data.error_id == \"ERR_PATIENT_NOT_FOUND\""
            - "Patient.${cp_id} is unaffected and still has sliding_fee_status == \"UNVERIFIED\""

      - name: patient_creation_missing_required_household_size_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /patients]
          - validations[priority 4]
          - errors[ERR_VALIDATION]
          - entities.Patient.fields.household_size
        distinguishing_aspect: >-
          household_size has source input with no declared default, so omitting it yields
          ERR_VALIDATION / 400 and no Patient row is created.
        test_recipe:
          setup:
            - "Empty database; the 2026 poverty guideline is published only so the chain has a legal first call"
          setup_api_calls:
            - *c_pg26
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-C99", full_name: "Nia Bell" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { e_req: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_VALIDATION\""
            - "GET /patients returns total_count == 0 — no partial Patient row was persisted"

      - name: health_center_nominal_fee_cap_default_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.HealthCenter.fields.nominal_fee_cap_cents
          - entities.BoardMember.fields.derives_over_10pct_income_from_healthcare
          - endpoints[POST /health-centers]
          - endpoints[POST /health-centers/{id}/board-members]
        distinguishing_aspect: >-
          Two distinct declared defaults are applied when their optional inputs are omitted:
          HealthCenter.nominal_fee_cap_cents becomes 2500 and
          BoardMember.derives_over_10pct_income_from_healthcare becomes false.
        test_recipe:
          setup:
            - "The 2026 poverty guideline is published"
          setup_api_calls:
            - *c_pg26
          trigger:
            - call: "POST /health-centers"
              payload: { legal_name: "Default Cap Health", grant_number: "H80CS00501", pps_base_rate_cents: 17000, medicare_upper_limit_cents: 16000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { dhc_id: $.data.id }
            - call: "POST /health-centers/${dhc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "LEGAL", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { dbm_id: $.data.id }
          assert:
            - "HealthCenter.${dhc_id}.nominal_fee_cap_cents == 2500"
            - "BoardMember.${dbm_id}.derives_over_10pct_income_from_healthcare == false"
            - "BoardMember.${dbm_id}.status == \"SEATED\""
            - "BoardMember.${dbm_id}.patient_seat_qualified == false"
            - "BoardMember.${dbm_id}.resignation_date == null"

      - name: encounter_system_fields_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Encounter.fields.pps_claim_status
          - entities.Encounter.fields.charge_adjustment_cents
          - entities.Encounter.fields.waived_amount_cents
          - validations[priority 4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: >-
          id / created_at / updated_at / version are server-minted (id is a bare UUID with no
          type prefix, version 1) and pps_claim_status is seeded UNBILLED by the system; supplying
          the read-only pps_claim_status in the request body is rejected with ERR_VALIDATION
          rather than silently honoured.
        test_recipe:
          setup:
            - "BOOT_PT is executed"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-15T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { sysenc_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-16T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000, pps_claim_status: "PAID" }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { e_sys: $.data.error_id }
          assert:
            - "Encounter.${sysenc_id}.id is a bare UUID with no type prefix"
            - "Encounter.${sysenc_id}.version == 1"
            - "Encounter.${sysenc_id}.created_at is ISO 8601 UTC with exactly three fractional digits"
            - "Encounter.${sysenc_id}.pps_claim_status == \"UNBILLED\""
            - "Encounter.${sysenc_id}.wraparound_status == \"NOT_APPLICABLE\""
            - "Encounter.${sysenc_id}.charge_adjustment_cents == 0"
            - "Encounter.${sysenc_id}.waived_amount_cents == 0"
            - "Encounter.${sysenc_id}.claim_reference == null"
            - "the second call returns HTTP 400 with data.error_id == \"ERR_VALIDATION\" — the client-supplied pps_claim_status is refused, not applied"

      - name: invalid_enum_and_out_of_range_numeric_inputs_rejected
        claim_type: type_constraints
        grounds:
          - entities.BoardMember.fields.seat_type
          - entities.Patient.fields.household_size
          - entities.Encounter.fields.gross_charge_cents
          - validations[priority 4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: >-
          Three distinct type-constraint classes each yield ERR_VALIDATION / 400: an undeclared
          enum member (seat_type "OWNER"), a numeric field below its declared floor
          (household_size 0 against ">= 1"), and a strictly-positive field at zero
          (gross_charge_cents 0 against "> 0").
        test_recipe:
          setup:
            - "BOOT_PT is executed so all three endpoints are reachable with otherwise-legal payloads"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
          trigger:
            - call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 2, seat_type: "OWNER", expertise_category: "FINANCE", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_enum: $.data.error_id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C98", full_name: "Zero Household", household_size: 0 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { e_hh: $.data.error_id }
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-15T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 0 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { e_gross: $.data.error_id }
          assert:
            - "all three calls return HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "GET /board-members?health_center_id=${chc_id} still returns total_count == 1"
            - "GET /encounters returns total_count == 0"

      - name: poverty_guideline_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.PovertyGuideline
          - endpoints[GET /poverty-guidelines/{id}]
          - validations[priority 28]
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: >-
          PovertyGuideline declares common_fields false, so its response carries id and created_at
          but neither updated_at nor version; §1.5 exposes no update or delete route for it, and
          re-publishing the same guideline_year is refused with ERR_DUPLICATE_KEY instead of
          overwriting the published figures.
        test_recipe:
          setup:
            - "The 2026 federal poverty guideline is published"
          setup_api_calls:
            - *c_pg26
          trigger:
            - call: "GET /poverty-guidelines/${cpg26_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /poverty-guidelines"
              payload: { guideline_year: 2026, base_amount_cents: 9990000, increment_cents: 990000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { e_dupg: $.data.error_id }
          assert:
            - "the GET response data carries exactly id, created_at, guideline_year, base_amount_cents, increment_cents"
            - "the GET response data contains no \"version\" key and no \"updated_at\" key"
            - "the second call returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_KEY\""
            - "PovertyGuideline.${cpg26_id}.base_amount_cents is still 1620000 and increment_cents is still 570000"

      - name: discount_tier_parent_fee_schedule_must_exist_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /fee-schedules/{id}/discount-tiers]
          - validations[priority 6]
          - errors[ERR_FEE_SCHEDULE_NOT_FOUND]
          - entities.DiscountTier.fields.fee_schedule_id
        distinguishing_aspect: >-
          A DiscountTier cannot be created under a non-existent parent: the path id is validated
          before any body-level tier check, so the response is ERR_FEE_SCHEDULE_NOT_FOUND / 404
          rather than ERR_TIER_DISCOUNT_MISMATCH or ERR_VALIDATION.
        test_recipe:
          setup:
            - "One real FeeSchedule exists so the table is non-empty"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_fs
          trigger:
            - call: "POST /fee-schedules/22222222-2222-4222-8222-222222222222/discount-tiers"
              payload: { tier_label: "ORPHAN", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_fsnf: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_FEE_SCHEDULE_NOT_FOUND\""
            - "GET /fee-schedules/${cfs_id}/discount-tiers returns total_count == 0"

      - name: encounter_site_and_service_from_different_grantees_rejected
        claim_type: cross_reference_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority 8]
          - errors[ERR_CROSS_GRANTEE_REFERENCE]
          - endpoints[POST /encounters]
        distinguishing_aspect: >-
          The flat topology is held together by foreign keys alone, so an Encounter whose
          service_site_id belongs to grantee H80CS00502 while its service_definition_id belongs to
          H80CS00500 is refused with ERR_CROSS_GRANTEE_REFERENCE / 409 even though both rows exist
          and both are IN_SCOPE.
        test_recipe:
          setup:
            - "BOOT_PT is executed for grantee H80CS00500"
            - "A second grantee H80CS00502 exists with its own IN_SCOPE SERVICE_DELIVERY site"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - call: "POST /health-centers"
              payload: { legal_name: "Second Corner Health", grant_number: "H80CS00502", pps_base_rate_cents: 19000, medicare_upper_limit_cents: 15000, nominal_fee_cap_cents: 2500 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { xhc_id: $.data.id }
            - call: "POST /health-centers/${xhc_id}/service-sites"
              payload: { site_name: "Second Corner Clinic", site_type: "SERVICE_DELIVERY", address_line: "9 Other St", weekly_service_hours: 30, in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { xsite_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${xsite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-15T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { e_xref: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_CROSS_GRANTEE_REFERENCE\""
            - "GET /encounters returns total_count == 0"
            - "Patient.${cp_id}.patient_balance_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: scope_change_request_is_created_in_the_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ScopeChangeRequest.initial_state
          - entities.ScopeChangeRequest.fields.status
          - entities.ScopeChangeRequest.fields.revision_round
          - entities.ScopeChangeRequest.fields.prepared_by_user_id
          - endpoints[POST /health-centers/{id}/scope-change-requests]
        distinguishing_aspect: >-
          A newly created change-in-scope request lands in DRAFT with revision_round 0,
          held_from_status null, reviewed_by_user_id null and prepared_by_user_id stamped with the
          acting ComplianceOfficer id — no board involvement and no counter mutation yet.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "A second site 'Corner Annex Clinic' is registered with in_initial_scope false so it sits in PROPOSED and can be the ADD_SITE target"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - &c_site2
              call: "POST /health-centers/${chc_id}/service-sites"
              payload: { site_name: "Corner Annex Clinic", site_type: "SERVICE_DELIVERY", address_line: "2 Corner Ave", weekly_service_hours: 20, in_initial_scope: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { csite2_id: $.data.id }
          trigger:
            - &c_scr_add
              call: "POST /health-centers/${chc_id}/scope-change-requests"
              payload: { request_type: "ADD_SITE", target_site_id: "${csite2_id}", justification: "Annex clinic opens to absorb overflow primary-care demand" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cscr_id: $.data.id }
          assert:
            - "HTTP 201 and ScopeChangeRequest.${cscr_id}.status == \"DRAFT\""
            - "ScopeChangeRequest.${cscr_id}.revision_round == 0"
            - "ScopeChangeRequest.${cscr_id}.held_from_status == null"
            - "ScopeChangeRequest.${cscr_id}.reviewed_by_user_id == null"
            - "ScopeChangeRequest.${cscr_id}.prepared_by_user_id == \"co-1\""
            - "ScopeChangeRequest.${cscr_id}.target_service_definition_id == null"
            - "ServiceSite.${csite2_id}.status == \"PROPOSED\""
            - "HealthCenter.${chc_id}.in_scope_site_count == 1"

      - name: service_site_reinstate_returns_a_suspended_site_to_in_scope
        claim_type: valid_transition
        grounds:
          - state_machines.ServiceSite.SUSPENDED_to_IN_SCOPE
          - endpoints[POST /service-sites/{id}/reinstate]
          - entities.ServiceSite.fields.in_scope_since
          - calculations.scope_listing_invariant
        distinguishing_aspect: >-
          Reinstating a SUSPENDED site moves it back to IN_SCOPE, re-stamps in_scope_since with the
          logical clock 2026-09-15 (not the original baseline instant), and restores
          HealthCenter.in_scope_site_count to 1.
        test_recipe:
          setup:
            - "BOOT_CORE is executed; the baseline site is IN_SCOPE and in_scope_site_count is 1"
            - "The ProjectOfficer suspends the baseline site, dropping in_scope_site_count to 0"
            - "The logical clock is advanced to 2026-09-15T00:00:00Z before reinstatement"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - &c_suspend
              call: "POST /service-sites/${csite_id}/suspend"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /service-sites/${csite_id}/reinstate"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
          assert:
            - "HTTP 200 and ServiceSite.${csite_id}.status == \"IN_SCOPE\""
            - "ServiceSite.${csite_id}.in_scope_since == \"2026-09-15T00:00:00.000Z\""
            - "ServiceSite.${csite_id}.hold_reason == null"
            - "HealthCenter.${chc_id}.in_scope_site_count == 1"
            - "HealthCenter.${chc_id}.version == 7"

      - name: encounter_bill_after_void_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Encounter.UNBILLED_to_VOID
          - state_machines.Encounter.terminal_states
          - validations[priority 11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: >-
          VOID is a terminal pps_claim_status, so POST /encounters/{id}/bill from VOID is refused
          with ERR_INVALID_STATE_TRANSITION / 409 and claim_reference stays null — the bill trigger
          departs only from UNBILLED and PENDING_ADJUSTMENT.
        test_recipe:
          setup:
            - "BOOT_PT is executed"
            - "One SELF_PAY encounter for 8000 cents is created and immediately voided for CODING_ERROR while still UNBILLED"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - *c_enc
            - call: "POST /encounters/${cenc_id}/void"
              payload: { void_reason: "CODING_ERROR" }
              as: BillingSpecialist
              as_user_id: "bs-1"
          trigger:
            - call: "POST /encounters/${cenc_id}/bill"
              payload: { claim_reference: "CLM-VOID-1" }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { e_void_bill: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Encounter.${cenc_id}.pps_claim_status == \"VOID\""
            - "Encounter.${cenc_id}.claim_reference == null"
            - "Encounter.${cenc_id}.charge_adjustment_cents == -2500"
            - "Patient.${cp_id}.patient_balance_cents == 0"

      - name: uds_report_accepted_terminal_state_rejects_further_adjudication
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.UDSReport.terminal_states
          - state_machines.UDSReport.SUBMITTED_to_ACCEPTED
          - validations[priority 11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: >-
          ACCEPTED is the UDSReport terminal state: a second adjudicate call — even one asking for
          the different decision RETURN — is refused with ERR_INVALID_STATE_TRANSITION / 409, and
          return_round stays 0 so the RETURNED->DRAFT loop can never be entered after acceptance.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "A 2026 UDSReport carries one QualityMeasureResult (5/16, benchmark 31.3), has been computed and submitted, and has been ACCEPTED by the ProjectOfficer"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - &c_uds
              call: "POST /health-centers/${chc_id}/uds-reports"
              payload: { reporting_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cuds_id: $.data.id }
            - &c_qm1
              call: "POST /uds-reports/${cuds_id}/quality-measure-results"
              payload: { measure_code: "CMS165_BP_CONTROL", numerator: 5, denominator: 16, benchmark_pct: 31.3 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cqm1_id: $.data.id }
            - &c_compute
              call: "POST /uds-reports/${cuds_id}/compute"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_uds_submit
              call: "POST /uds-reports/${cuds_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /uds-reports/${cuds_id}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: ProjectOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /uds-reports/${cuds_id}/adjudicate"
              payload: { decision: "RETURN", return_reason: "Denominators look implausible" }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { e_uds_term: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "UDSReport.${cuds_id}.status == \"ACCEPTED\""
            - "UDSReport.${cuds_id}.return_reason == null"
            - "UDSReport.${cuds_id}.return_round == 0"
            - "UDSReport.${cuds_id}.adjudicated_by_user_id == \"po-1\""

      - name: board_member_second_resign_rejected
        claim_type: idempotency
        grounds:
          - state_machines.BoardMember.SEATED_to_RESIGNED
          - validations[priority 11]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - calculations.governance_posture
        distinguishing_aspect: >-
          Resign is a once-only trigger: the second call from RESIGNED returns
          ERR_INVALID_STATE_TRANSITION / 409, term_end stays truncated to the first
          resignation_date 2026-08-01, and HealthCenter.version does not increment a second time
          (it is 6 after one resignation and still 6 after the refused repeat).
        test_recipe:
          setup:
            - "BOOT_CORE is executed; HealthCenter.version is 5 and seat 1 is SEATED"
            - "The ComplianceOfficer resigns seat 1 effective 2026-08-01, bumping HealthCenter.version to 6"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "POST /board-members/${cchair_id}/resign"
              payload: { resignation_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /board-members/${cchair_id}/resign"
              payload: { resignation_date: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_resign2: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "BoardMember.${cchair_id}.status == \"RESIGNED\""
            - "BoardMember.${cchair_id}.resignation_date == \"2026-08-01T00:00:00.000Z\""
            - "BoardMember.${cchair_id}.term_end == \"2026-08-01T00:00:00.000Z\""
            - "HealthCenter.${chc_id}.seated_board_count == 0"
            - "HealthCenter.${chc_id}.version == 6"

      - name: verify_on_refused_documentation_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.IncomeVerification.SUBMITTED_to_VERIFIED
          - validations[priority 16]
          - errors[ERR_DOCUMENTATION_REFUSED]
          - entities.IncomeVerification.fields.documentation_type
        distinguishing_aspect: >-
          The documentation_type != REFUSED precondition of SUBMITTED->VERIFIED is enforced with
          ERR_DOCUMENTATION_REFUSED / 422, and the row stays SUBMITTED with fpg_percent still null —
          a refusal to document income can never be adjudicated VERIFIED.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "Patient 'Ida Renn' (MRN-C02, household_size 1) has a SUBMITTED IncomeVerification with documentation_type REFUSED, effective_date 2026-03-01"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - &c_p_ref
              call: "POST /patients"
              payload: { mrn: "MRN-C02", full_name: "Ida Renn", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { cpr_id: $.data.id, cpr_v: $.data.version }
            - &c_iv_ref
              call: "POST /patients/${cpr_id}/income-verifications"
