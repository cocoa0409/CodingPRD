              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 900000 }, { period_index: 2, amount_usd: 950000 }, { period_index: 3, amount_usd: 1000000 }, { period_index: 4, amount_usd: 8576200 }], upfront_cost_usd: 120000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_id: "$.data.id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
