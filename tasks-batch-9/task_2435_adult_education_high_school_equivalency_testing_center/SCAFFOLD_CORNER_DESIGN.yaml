      - name: proctor_daily_load_ignores_draft_sessions
        claim_type: input_set_filtering
        grounds:
          - calculations.proctor_daily_load.input_set
          - errors[ERR_PROCTOR_DAILY_CAP_EXCEEDED]
        distinguishing_aspect: |
          The daily load counts only SCHEDULED, IN_PROGRESS and COMPLETED sessions. With a 4.00-hour cap
          and an unassigned 4-hour DRAFT session already sitting on the same date in another room, a
          disjoint 4-hour assignment projects exactly 4.00 and is accepted; assigning the DRAFT one
          afterwards then projects 8.00 and is refused for the CAP - never for an interval conflict,
          because the two windows do not overlap.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center with two ACTIVE rooms and one CERTIFIED proctor whose daily_hour_cap is 4.00."
            - "Room 1 holds a DRAFT session 2026-08-20T14:00:00Z..18:00:00Z; room 2 holds a DRAFT session 2026-08-20T09:00:00Z..13:00:00Z."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Draft Excluded Center", state_code: "SD" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-1101", seat_capacity: 10 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r1: $.data.id }
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-1102", seat_capacity: 10 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r2: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Wynn Abadi", daily_hour_cap: 4.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r1}", subtest: "MATH", starts_at: "2026-08-20T14:00:00Z", ends_at: "2026-08-20T18:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_draft: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r2}", subtest: "RLA", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T13:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
