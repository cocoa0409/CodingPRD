      - name: replaying_any_one_shot_trigger_returns_that_machines_own_already_done_error
        claim_type: Idempotency
        grounds:
          - validations[priority=22]
          - validations[priority=18]
          - errors.ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED
          - errors.ERR_MEETING_STATE_INVALID
          - errors.ERR_ADVISOR_ENGAGEMENT_STATE_INVALID
          - errors.ERR_SESSION_STATE_INVALID
        distinguishing_aspect: |
          Four one-shot triggers replayed on four different entities each return a DIFFERENT error_id -
          acknowledge -> ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED, meeting outcome ->
