          setup:
            - "Logical clock at 2026-08-05T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
