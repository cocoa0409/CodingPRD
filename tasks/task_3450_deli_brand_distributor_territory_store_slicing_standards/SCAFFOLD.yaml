scenario: "Deli Brand Distributor Territory & In-Store Slicing Standards (Boar's Head): independent distributor territories granted exclusive rights to sell and service accounts with performance obligations, refusal to supply certain mass channels to protect positioning with account approval requirements, in-store service where distributor representatives manage inventory, rotation and slicer presentation at deli counters, product freshness dating with short shelf life after opening and mandated pull practices, retailer training on slicing thickness, cross-contamination prevention and allergen separation, promotional pricing coordination within regulatory limits on distributor and retailer arrangements, plant production scheduling for a wide item count with distributor order patterns, food safety incident response spanning plants, distributors and retail delis"
domain_name: "deli-brand-distributor-standards"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching   # includes cyclic (Incident, ServiceVisit) and parallel-dimension (Order) machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "unique distributor code", constraints: "unique across Distributor; duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: name, type: string, source: input, description: "legal distributor name" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED", default: PROSPECT }
      - { name: service_level_tier, type: enum, source: input, description: "STANDARD | PREFERRED | ELITE; drives allocation priority", default: STANDARD }
      - { name: performance_score_provisional, type: number, source: computed, description: "calculations.distributor_performance_score provisional variant; recomputed on every read" }
      - { name: performance_score_final, type: number, source: computed, description: "calculations.distributor_performance_score final variant; recomputed on every read" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "unique territory code", constraints: "unique across Territory; duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: name, type: string, source: input, description: "territory display name" }
      - { name: region, type: string, source: input, description: "free-form region label" }
      - { name: status, type: enum, source: system, description: "OPEN | GRANTED | REVOKED; effective status treats REVOKED as OPEN once now >= revoked_at + TERRITORY_COOLING_OFF_DAYS", default: OPEN }
      - { name: granted_distributor_id, type: string, source: system, description: "FK -> Distributor.id; null while effectively OPEN", constraints: "nullable" }
      - { name: granted_at, type: datetime, source: system, description: "timestamp of last grant", constraints: "nullable" }
      - { name: revoked_at, type: datetime, source: system, description: "timestamp of last revocation", constraints: "nullable" }
      - { name: min_weekly_visits_per_account, type: integer, source: input, description: "performance obligation floor for service visits", default: 1 }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "store name" }
      - { name: channel, type: enum, source: input, description: "INDEPENDENT_GROCER | CONVENIENCE | FOODSERVICE | MASS_MERCHANT | CLUB_STORE; MASS_MERCHANT and CLUB_STORE are refused supply" }
      - { name: approval_status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | REJECTED | SUSPENDED", default: UNDER_REVIEW }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; must be GRANTED to the proposing distributor" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from X-User-ID of the proposing DistributorRep" }
      - { name: approved_at, type: datetime, source: system, description: "timestamp of approval", constraints: "nullable" }
      - { name: late_pulls_30d, type: integer, source: computed, description: "count of OpenedProductLog with status PULLED_LATE and pulled_at in trailing 30 days for this account" }
      - { name: training_compliant, type: boolean, source: computed, description: "calculations.training_compliance_coverage result for this account" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "unique SKU code", constraints: "unique across Product; duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: name, type: string, source: input, description: "product name" }
      - { name: base_price_cents, type: integer, source: input, description: "list price per unit in cents", constraints: "> 0" }
      - { name: shelf_life_opened_hours, type: integer, source: input, description: "hours an opened product may stay on the slicer before mandatory pull", constraints: "> 0" }
      - { name: shelf_life_unopened_days, type: integer, source: input, description: "days from production run completion until lot expiry", constraints: "> 0" }
      - { name: allergen_tags, type: array, source: input, description: "array of MILK | EGG | WHEAT | SOY | PEANUT | TREE_NUT | SESAME; empty array means no declared allergens" }
      - { name: requires_dedicated_slicer, type: boolean, source: input, description: "true forces a dedicated slicer whose dedicated_allergen is in allergen_tags", default: false }
      - { name: channel_restricted, type: boolean, source: input, description: "true = may only be authorized for INDEPENDENT_GROCER accounts", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: ACTIVE }

  - name: AccountProductAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: status, type: enum, source: system, description: "REQUESTED | AUTHORIZED | SUSPENDED | REVOKED", default: REQUESTED }
      - { name: suspension_source, type: enum, source: system, description: "NONE | INCIDENT | ACCOUNT_SUSPEND; records which cascade suspended this authorization", default: NONE }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from X-User-ID of the creating DistributorRep" }
      - { name: delivery_week, type: string, source: input, description: "Monday date YYYY-MM-DD of the requested delivery week" }
      - { name: allocation_status, type: enum, source: system, description: "PENDING | ALLOCATED | PARTIAL | SHORTED | CANCELLED", default: PENDING }
      - { name: fulfillment_status, type: enum, source: system, description: "UNSHIPPED | IN_TRANSIT | DELIVERED | REJECTED", default: UNSHIPPED }
      - { name: merchandise_total_cents, type: integer, source: computed, description: "calculations.order_total_pricing step 2", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "calculations.order_total_pricing step 4", default: 0 }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "calculations.order_total_pricing step 5", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "calculations.order_total_pricing step 6", default: 0 }

  - name: OrderLine
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty_requested, type: integer, source: input, description: "units requested", constraints: "> 0" }
      - { name: qty_allocated, type: integer, source: system, description: "units allocated by allocate-week", default: 0 }
      - { name: unit_price_cents, type: integer, source: system, description: "snapshot of Product.base_price_cents at order creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "qty_allocated * unit_price_cents, set at allocation", default: 0 }

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "unique plant code", constraints: "unique across Plant; duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: name, type: string, source: input, description: "plant name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SHUTDOWN; SHUTDOWN set by incident cascade", default: ACTIVE }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: line_code, type: string, source: input, description: "production line identifier within the plant" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: window_start, type: datetime, source: input, description: "run window start; half-open interval [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "run window end; must be strictly after window_start" }
      - { name: capacity_units, type: integer, source: input, description: "maximum units the line can produce in this window", constraints: "> 0" }
      - { name: planned_units, type: integer, source: input, description: "units planned; must be <= capacity_units", constraints: "> 0" }
      - { name: actual_units, type: integer, source: system, description: "total units produced, set at completion", constraints: "nullable" }
      - { name: waste_units, type: integer, source: system, description: "units scrapped, set at completion", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: Lot
    parent: ProductionRun
    common_fields: false
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; copied from the run" }
      - { name: available_units, type: integer, source: system, description: "unallocated units; equals actual_units - waste_units at creation" }
      - { name: allocated_units, type: integer, source: system, description: "units reserved by allocated orders not yet delivered", default: 0 }
      - { name: delivered_units, type: integer, source: system, description: "units shipped out on deliveries", default: 0 }
      - { name: expires_at, type: datetime, source: computed, description: "run completion timestamp + product.shelf_life_unopened_days" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | RECALLED | EXHAUSTED", default: AVAILABLE }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; copied from the order" }
      - { name: lines, type: array, source: input, description: "array of {lot_id, qty}; qty > 0; each lot must belong to a product line of the order" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | REJECTED", default: PENDING }
      - { name: confirmed_at, type: datetime, source: system, description: "confirmation timestamp", constraints: "nullable" }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from X-User-ID of the creating DistributorRep" }
      - { name: window_start, type: datetime, source: input, description: "visit window start" }
      - { name: window_end, type: datetime, source: input, description: "visit window end; strictly after window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUBMITTED | VERIFIED | REWORK | CANCELLED", default: SCHEDULED }
      - { name: score, type: integer, source: input, description: "0-100 service score assigned at submit", constraints: "0 <= score <= 100; nullable until submit" }
      - { name: rotation_compliant, type: boolean, source: input, description: "stock rotation check at submit", constraints: "nullable until submit" }
      - { name: slicer_presentation_ok, type: boolean, source: input, description: "slicer presentation check at submit", constraints: "nullable until submit" }
      - { name: submitted_at, type: datetime, source: system, description: "last submit timestamp", constraints: "nullable" }

  - name: Slicer
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: label, type: string, source: input, description: "slicer display label" }
      - { name: dedicated_allergen, type: enum, source: input, description: "NONE | MILK | EGG | WHEAT | SOY | PEANUT | TREE_NUT | SESAME", default: NONE }
      - { name: cleaning_verified_at, type: datetime, source: system, description: "last verified cleaning timestamp; set by service visit submit", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED", default: ACTIVE }

  - name: OpenedProductLog
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; set from X-User-ID of the RetailManager" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: slicer_id, type: string, source: input, description: "FK -> Slicer.id; slicer must belong to the same account" }
      - { name: opened_at, type: datetime, source: system, description: "opening timestamp; defaults to logical clock now, may be backdated via opened_at input" }
      - { name: pull_deadline, type: datetime, source: computed, description: "opened_at + product.shelf_life_opened_hours" }
      - { name: pulled_at, type: datetime, source: system, description: "pull timestamp", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | PULLED_ON_TIME | PULLED_LATE | FORCE_PULLED", default: OPEN }

  - name: TrainingCertification
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: associate_name, type: string, source: input, description: "certified associate name" }
      - { name: slicing_module_passed, type: boolean, source: input, description: "slicing thickness module passed" }
      - { name: allergen_module_passed, type: boolean, source: input, description: "cross-contamination / allergen separation module passed" }
      - { name: certified_at, type: datetime, source: system, description: "logical clock now at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "certified_at + CERT_VALIDITY_DAYS days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED; EXPIRED is evaluated lazily on read when now > expires_at", default: ACTIVE }

  - name: PromoProgram
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: promo_price_cents, type: integer, source: input, description: "promotional unit price; regulatory floor applies at authorization", constraints: "> 0" }
      - { name: start_date, type: string, source: input, description: "first promo date YYYY-MM-DD; closed interval [start_date, end_date]" }
      - { name: end_date, type: string, source: input, description: "last promo date YYYY-MM-DD; >= start_date" }
      - { name: budget_cents, type: integer, source: input, description: "program budget cap", constraints: "> 0" }
      - { name: estimated_units, type: integer, source: input, description: "forecast redemptions used for the provisional reserve", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | AUTHORIZED | REJECTED | SUSPENDED | SETTLED", default: DRAFT }
      - { name: unit_allowance_cents, type: integer, source: computed, description: "round_half_up((base_price_cents - promo_price_cents) * PROMO_BRAND_SHARE, 0)" }
      - { name: reserved_cents, type: integer, source: computed, description: "provisional reserve = estimated_units * unit_allowance_cents, locked at authorization", default: 0 }
      - { name: spent_cents, type: integer, source: computed, description: "final settled amount", default: 0 }
      - { name: released_cents, type: integer, source: computed, description: "reserved_cents - spent_cents at settlement", default: 0 }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id where the incident originated" }
      - { name: title, type: string, source: input, description: "incident title" }
      - { name: severity, type: enum, source: input, description: "LOW | HIGH | CRITICAL" }
      - { name: affected_run_ids, type: array, source: input, description: "array of ProductionRun ids implicated" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | CONFIRMED_RECALL | CONTAINED | RESOLVED | CLOSED", default: REPORTED }
      - { name: resolution_outcome, type: enum, source: system, description: "CONFIRMED | FALSE_ALARM; set on transition to RESOLVED", constraints: "nullable" }
      - { name: affected_account_count, type: integer, source: computed, description: "calculations.incident_scope_projection result" }

state_machines:
  - entity: Distributor
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system: first POST /territories/{id}/grant naming this distributor"
        actor: system
        preconditions: ["distributor.status == PROSPECT"]
        side_effects: ["distributor.status = ACTIVE", "increments Distributor.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /distributors/{id}/suspend"
        actor: BrandAdmin
        preconditions: ["distributor.status == ACTIVE"]
        side_effects:
          - "every ServiceVisit of this distributor with status IN {SCHEDULED, REWORK} transitions to CANCELLED"
          - "increments Distributor.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /distributors/{id}/reinstate"
        actor: BrandAdmin
        preconditions: ["distributor.status == SUSPENDED"]
        side_effects: ["increments Distributor.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /distributors/{id}/terminate"
        actor: BrandAdmin
        preconditions: ["distributor.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "every Territory with granted_distributor_id == this distributor and status GRANTED transitions to REVOKED with revoked_at = now"
          - "every Order of this distributor with allocation_status IN {PENDING, ALLOCATED, PARTIAL, SHORTED} and fulfillment_status == UNSHIPPED transitions to CANCELLED and releases its allocated lot units (FEFO-reverse: lot.expires_at DESC, then lot.created_at DESC)"
          - "increments Distributor.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /distributors/{id}/terminate"
        actor: BrandAdmin
        preconditions: ["distributor.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "every Territory with granted_distributor_id == this distributor and status GRANTED transitions to REVOKED with revoked_at = now"
          - "every Order of this distributor with allocation_status IN {PENDING, ALLOCATED, PARTIAL, SHORTED} and fulfillment_status == UNSHIPPED transitions to CANCELLED and releases its allocated lot units (FEFO-reverse: lot.expires_at DESC, then lot.created_at DESC)"
          - "every ServiceVisit of this distributor with status IN {SCHEDULED, REWORK} transitions to CANCELLED"
          - "increments Distributor.version by 1"

  - entity: Territory
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: GRANTED
        trigger: "POST /territories/{id}/grant"
        actor: BrandAdmin
        preconditions: ["territory effective status == OPEN (REVOKED counts as OPEN once now >= revoked_at + 30 days)", "expected_territory_version == territory.version"]
        side_effects:
          - "territory.granted_distributor_id = payload distributor_id; territory.granted_at = now; territory.revoked_at = null"
          - "if the named distributor.status == PROSPECT it transitions to ACTIVE"
          - "increments Territory.version by 1"
        note: "grant from GRANTED supersedes the previous holder; the same transition applies"
      - from: GRANTED
        to: GRANTED
        trigger: "POST /territories/{id}/grant (supersede)"
        actor: BrandAdmin
        preconditions: ["territory.status == GRANTED", "expected_territory_version == territory.version"]
        side_effects:
          - "territory.granted_distributor_id = payload distributor_id; territory.granted_at = now"
          - "if the named distributor.status == PROSPECT it transitions to ACTIVE"
          - "increments Territory.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /territories/{id}/revoke or distributor terminate cascade"
        actor: BrandAdmin | system
        preconditions: ["territory.status == GRANTED"]
        side_effects:
          - "territory.granted_distributor_id = null; territory.revoked_at = now"
          - "increments Territory.version by 1"
      - from: REVOKED
        to: OPEN
        trigger: "system: lazy evaluation — any read or write of the territory when now >= revoked_at + 30 days treats and persists status as OPEN"
        actor: system
        preconditions: ["territory.status == REVOKED", "now >= territory.revoked_at + 30 days"]
        side_effects: ["territory.status = OPEN", "increments Territory.version by 1"]

  - entity: Account
    initial_state: UNDER_REVIEW
    terminal_states: [REJECTED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /accounts/{id}/review with decision APPROVE"
        actor: BrandAdmin
        preconditions: ["account.approval_status == UNDER_REVIEW", "account.channel NOT IN {MASS_MERCHANT, CLUB_STORE}", "territory(account.territory_id) is GRANTED to account.distributor_id"]
        side_effects:
          - "account.approved_at = now"
          - "every AccountProductAuthorization of this account with status REQUESTED transitions to AUTHORIZED"
          - "increments Account.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /accounts/{id}/review with decision REJECT"
        actor: BrandAdmin
        preconditions: ["account.approval_status == UNDER_REVIEW"]
        side_effects: ["increments Account.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend, or system: account.late_pulls_30d reaches LATE_PULL_SUSPENSION_THRESHOLD after a late pull"
        actor: BrandAdmin | system
        preconditions: ["account.approval_status == APPROVED"]
        side_effects:
          - "every AccountProductAuthorization of this account with status AUTHORIZED transitions to SUSPENDED with suspension_source = ACCOUNT_SUSPEND"
          - "every OpenedProductLog of this account with status OPEN transitions to FORCE_PULLED with pulled_at = now"
          - "increments Account.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /accounts/{id}/reinstate"
        actor: BrandAdmin
        preconditions: ["account.approval_status == SUSPENDED"]
        side_effects:
          - "every AccountProductAuthorization of this account with status SUSPENDED and suspension_source == ACCOUNT_SUSPEND transitions to AUTHORIZED with suspension_source = NONE"
          - "increments Account.version by 1"

  - entity: AccountProductAuthorization
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "system: owning account transitions to APPROVED"
        actor: system
        preconditions: ["authorization.status == REQUESTED", "account.approval_status == APPROVED"]
        side_effects: ["increments AccountProductAuthorization.version by 1"]
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system: incident confirm-recall cascade (suspension_source = INCIDENT) or account suspension cascade (suspension_source = ACCOUNT_SUSPEND)"
        actor: system
        preconditions: ["authorization.status == AUTHORIZED"]
        side_effects: ["increments AccountProductAuthorization.version by 1"]
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "system: account reinstate (source ACCOUNT_SUSPEND only) or incident resolved FALSE_ALARM (source INCIDENT only)"
        actor: system
        preconditions: ["authorization.status == SUSPENDED", "suspension_source matches the resolving cascade"]
        side_effects: ["authorization.suspension_source = NONE", "increments AccountProductAuthorization.version by 1"]
      - from: AUTHORIZED
        to: REVOKED
        trigger: "POST /account-product-authorizations/{id}/revoke or incident resolved CONFIRMED cascade"
        actor: BrandAdmin | system
        preconditions: ["authorization.status IN {AUTHORIZED, SUSPENDED}"]
        side_effects: ["increments AccountProductAuthorization.version by 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /account-product-authorizations/{id}/revoke or incident resolved CONFIRMED cascade"
        actor: BrandAdmin | system
        preconditions: ["authorization.status IN {AUTHORIZED, SUSPENDED}"]
        side_effects: ["increments AccountProductAuthorization.version by 1"]

  - entity: Order
    initial_state: PENDING (allocation dimension) / UNSHIPPED (fulfillment dimension)
    terminal_states: [CANCELLED (allocation), DELIVERED | REJECTED (fulfillment)]
    note: "two independent state dimensions evolve on one Order row: allocation_status and fulfillment_status"
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /orders/allocate-week when every line is fully allocated"
        actor: PlantScheduler
        preconditions: ["order.allocation_status == PENDING", "sum over lines: qty_allocated == qty_requested"]
        side_effects: ["lot.available_units -> lot.allocated_units per calculations.weekly_allocation_waterfall", "calculations.order_total_pricing writes merchandise_total_cents, discount_cents, delivery_fee_cents, total_cents", "increments Order.version by 1"]
      - from: PENDING
        to: PARTIAL
        trigger: "POST /orders/allocate-week when at least one unit but not all requested units are allocated"
        actor: PlantScheduler
        preconditions: ["order.allocation_status == PENDING", "0 < sum(qty_allocated) < sum(qty_requested)"]
        side_effects: ["lot.available_units -> lot.allocated_units per calculations.weekly_allocation_waterfall", "calculations.order_total_pricing writes merchandise_total_cents, discount_cents, delivery_fee_cents, total_cents", "increments Order.version by 1"]
      - from: PENDING
        to: SHORTED
        trigger: "POST /orders/allocate-week when zero units are allocated"
        actor: PlantScheduler
        preconditions: ["order.allocation_status == PENDING", "sum(qty_allocated) == 0"]
        side_effects: ["calculations.order_total_pricing writes all money fields as 0", "increments Order.version by 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel or distributor terminate cascade"
        actor: DistributorRep | system
        preconditions: ["order.allocation_status IN {PENDING, ALLOCATED, PARTIAL, SHORTED}", "order.fulfillment_status == UNSHIPPED", "acting DistributorRep owns the order (X-User-ID == order.distributor_id) when not a system cascade"]
        side_effects: ["releases allocated lot units (lot.allocated_units -> lot.available_units, FEFO-reverse: expires_at DESC then created_at DESC)", "increments Order.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel or distributor terminate cascade"
        actor: DistributorRep | system
        preconditions: ["order.allocation_status IN {PENDING, ALLOCATED, PARTIAL, SHORTED}", "order.fulfillment_status == UNSHIPPED"]
        side_effects: ["releases allocated lot units (lot.allocated_units -> lot.available_units, FEFO-reverse)", "increments Order.version by 1"]
      - from: PARTIAL
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel or distributor terminate cascade"
        actor: DistributorRep | system
        preconditions: ["order.allocation_status IN {PENDING, ALLOCATED, PARTIAL, SHORTED}", "order.fulfillment_status == UNSHIPPED"]
        side_effects: ["releases allocated lot units (lot.allocated_units -> lot.available_units, FEFO-reverse)", "increments Order.version by 1"]
      - from: SHORTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel or distributor terminate cascade"
        actor: DistributorRep | system
        preconditions: ["order.allocation_status IN {PENDING, ALLOCATED, PARTIAL, SHORTED}", "order.fulfillment_status == UNSHIPPED"]
        side_effects: ["increments Order.version by 1"]
      - from: UNSHIPPED
        to: IN_TRANSIT
        trigger: "POST /deliveries naming this order"
        actor: DistributorRep
        preconditions: ["order.fulfillment_status == UNSHIPPED", "order.allocation_status IN {ALLOCATED, PARTIAL}"]
        side_effects: ["lot.allocated_units -> lot.delivered_units for each delivery line", "increments Order.version by 1"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /deliveries/{id}/confirm for the pending delivery of this order"
        actor: RetailManager
        preconditions: ["order.fulfillment_status == IN_TRANSIT"]
        side_effects: ["increments Order.version by 1"]
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /deliveries/{id}/reject for the pending delivery of this order, or system: incident cascade rejects a PENDING delivery"
        actor: RetailManager | system
        preconditions: ["order.fulfillment_status == IN_TRANSIT"]
        side_effects: ["lot.delivered_units -> lot.allocated_units for each delivery line (goods returned to the allocated pool)", "increments Order.version by 1"]

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /production-runs/{id}/complete"
        actor: PlantScheduler
        preconditions: ["run.status == SCHEDULED", "plant(run.plant_id).status == ACTIVE", "payload actual_units >= 0", "payload waste_units >= 0", "actual_units + waste_units <= run.capacity_units", "actual_units + waste_units > 0"]
        side_effects:
          - "creates one Lot with lot.available_units = payload.actual_units - payload.waste_units, lot.expires_at = now + product.shelf_life_unopened_days, status AVAILABLE"
          - "increments ProductionRun.version by 1"
        note: "lot conservation: lot.available_units + lot.allocated_units + lot.delivered_units + run.waste_units == run.actual_units at all times"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: incident confirm-recall cascade sets plant SHUTDOWN; every SCHEDULED run at that plant transitions to CANCELLED"
        actor: system
        preconditions: ["run.status == SCHEDULED", "plant(run.plant_id).status == SHUTDOWN"]
        side_effects: ["increments ProductionRun.version by 1"]

  - entity: Lot
    initial_state: AVAILABLE
    terminal_states: [RECALLED, EXHAUSTED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system: incident confirm-recall cascade for lots whose production_run_id is in incident.affected_run_ids"
        actor: system
        preconditions: ["lot.status == AVAILABLE"]
        side_effects:
          - "every PENDING Delivery whose lines contain this lot transitions to REJECTED and the order fulfillment REJECTED compensation restores delivered_units -> allocated_units"
      - from: QUARANTINED
        to: RECALLED
        trigger: "system: incident transition to RESOLVED with resolution_outcome CONFIRMED"
        actor: system
        preconditions: ["lot.status == QUARANTINED"]
        side_effects: []
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system: incident transition to RESOLVED with resolution_outcome FALSE_ALARM"
        actor: system
        preconditions: ["lot.status == QUARANTINED"]
        side_effects: []
      - from: AVAILABLE
        to: EXHAUSTED
        trigger: "system: lazy — when lot.available_units == 0 and lot.allocated_units == 0"
        actor: system
        preconditions: ["lot.status == AVAILABLE", "available_units == 0", "allocated_units == 0"]
        side_effects: []

  - entity: Delivery
    initial_state: PENDING
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /deliveries/{id}/confirm"
        actor: RetailManager
        preconditions: ["delivery.status == PENDING", "account.approval_status == APPROVED", "calculations.training_compliance_coverage(account) == true", "for every line lot: now < lot.expires_at", "X-User-ID == delivery.account_id"]
        side_effects: ["order(delivery.order_id).fulfillment_status = DELIVERED", "delivery.confirmed_at = now", "increments Delivery.version by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /deliveries/{id}/reject, or system: incident cascade quarantines a lot in the delivery lines"
        actor: RetailManager | system
        preconditions: ["delivery.status == PENDING", "X-User-ID == delivery.account_id when actor is RetailManager"]
        side_effects: ["for each line: lot.delivered_units -= qty and lot.allocated_units += qty", "order(delivery.order_id).fulfillment_status = REJECTED", "increments Delivery.version by 1"]

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /service-visits/{id}/submit"
        actor: DistributorRep
        preconditions: ["visit.status IN {SCHEDULED, REWORK}", "X-User-ID == visit.distributor_id", "0 <= score <= 100"]
        side_effects: ["visit.submitted_at = now", "for each slicer id in cleaned_slicer_ids: slicer.cleaning_verified_at = now", "increments ServiceVisit.version by 1"]
      - from: REWORK
        to: SUBMITTED
        trigger: "POST /service-visits/{id}/submit"
        actor: DistributorRep
        preconditions: ["visit.status IN {SCHEDULED, REWORK}", "X-User-ID == visit.distributor_id", "0 <= score <= 100"]
        side_effects: ["visit.submitted_at = now", "for each slicer id in cleaned_slicer_ids: slicer.cleaning_verified_at = now", "increments ServiceVisit.version by 1"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /service-visits/{id}/review with verdict VERIFY"
        actor: SafetyOfficer
        preconditions: ["visit.status == SUBMITTED"]
        side_effects: ["increments ServiceVisit.version by 1"]
      - from: SUBMITTED
        to: REWORK
        trigger: "POST /service-visits/{id}/review with verdict REWORK"
        actor: SafetyOfficer
        preconditions: ["visit.status == SUBMITTED"]
        side_effects: ["increments ServiceVisit.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: distributor suspension cascade"
        actor: system
        preconditions: ["visit.status IN {SCHEDULED, REWORK}"]
        side_effects: ["increments ServiceVisit.version by 1"]
      - from: REWORK
        to: CANCELLED
        trigger: "system: distributor suspension cascade"
        actor: system
        preconditions: ["visit.status IN {SCHEDULED, REWORK}"]
        side_effects: ["increments ServiceVisit.version by 1"]

  - entity: Slicer
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /slicers/{id}/decommission"
        actor: RetailManager
        preconditions: ["slicer.status == ACTIVE", "X-User-ID == slicer.account_id"]
        side_effects: ["increments Slicer.version by 1"]

  - entity: OpenedProductLog
    initial_state: OPEN
    terminal_states: [PULLED_ON_TIME, PULLED_LATE, FORCE_PULLED]
    transitions:
      - from: OPEN
        to: PULLED_ON_TIME
        trigger: "POST /opened-product-logs/{id}/pull when now <= log.pull_deadline"
        actor: RetailManager
        preconditions: ["log.status == OPEN", "X-User-ID == log.account_id", "now <= log.pull_deadline"]
        side_effects: ["log.pulled_at = now", "increments OpenedProductLog.version by 1"]
      - from: OPEN
        to: PULLED_LATE
        trigger: "POST /opened-product-logs/{id}/pull when now > log.pull_deadline"
        actor: RetailManager
        preconditions: ["log.status == OPEN", "X-User-ID == log.account_id", "now > log.pull_deadline"]
        side_effects:
          - "log.pulled_at = now"
          - "account.late_pulls_30d recomputed; if late_pulls_30d >= 3 the account auto-transitions APPROVED -> SUSPENDED with the full account-suspension cascade (authorizations SUSPENDED with source ACCOUNT_SUSPEND, other OPEN logs FORCE_PULLED)"
          - "increments OpenedProductLog.version by 1"
      - from: OPEN
        to: FORCE_PULLED
        trigger: "system: account suspension cascade"
        actor: system
        preconditions: ["log.status == OPEN"]
        side_effects: ["log.pulled_at = now", "increments OpenedProductLog.version by 1"]

  - entity: TrainingCertification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /training-certifications/{id}/revoke"
        actor: BrandAdmin
        preconditions: ["certification.status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy evaluation — any read when now > expires_at treats and persists status as EXPIRED"
        actor: system
        preconditions: ["certification.status == ACTIVE", "now > expires_at"]
        side_effects: []

  - entity: PromoProgram
    initial_state: DRAFT
    terminal_states: [REJECTED, SETTLED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /promo-programs/{id}/authorize with decision APPROVE"
        actor: BrandAdmin
        preconditions: ["program.status == DRAFT", "promo_price_cents >= round_half_up(product.base_price_cents * 0.85, 0)", "estimated_units * unit_allowance_cents <= budget_cents", "no overlapping AUTHORIZED/SUSPENDED program for the same account_id + product_id on the closed date interval"]
        side_effects: ["program.reserved_cents = estimated_units * unit_allowance_cents", "increments PromoProgram.version by 1"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /promo-programs/{id}/authorize with decision REJECT"
        actor: BrandAdmin
        preconditions: ["program.status == DRAFT"]
        side_effects: ["increments PromoProgram.version by 1"]
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system: incident confirm-recall cascade for programs whose product_id is produced by an affected run"
        actor: system
        preconditions: ["program.status == AUTHORIZED"]
        side_effects: ["increments PromoProgram.version by 1"]
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "system: incident resolved FALSE_ALARM cascade"
        actor: system
        preconditions: ["program.status == SUSPENDED"]
        side_effects: ["increments PromoProgram.version by 1"]
      - from: AUTHORIZED
        to: SETTLED
        trigger: "POST /promo-programs/{id}/settle"
        actor: BrandAdmin
        preconditions: ["program.status IN {AUTHORIZED, SUSPENDED}", "computed final settlement <= budget_cents"]
        side_effects: ["program.spent_cents = calculations.promo_settlement final variant", "program.released_cents = reserved_cents - spent_cents", "increments PromoProgram.version by 1"]
      - from: SUSPENDED
        to: SETTLED
        trigger: "POST /promo-programs/{id}/settle"
        actor: BrandAdmin
        preconditions: ["program.status IN {AUTHORIZED, SUSPENDED}", "computed final settlement <= budget_cents"]
        side_effects: ["program.spent_cents = calculations.promo_settlement final variant", "program.released_cents = reserved_cents - spent_cents", "increments PromoProgram.version by 1"]

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /incidents/{id}/transition with to TRIAGED"
        actor: SafetyOfficer
        preconditions: ["incident.status == REPORTED"]
        side_effects: ["increments Incident.version by 1"]
      - from: TRIAGED
        to: CONFIRMED_RECALL
        trigger: "POST /incidents/{id}/transition with to CONFIRMED_RECALL"
        actor: SafetyOfficer
        preconditions: ["incident.status == TRIAGED"]
        side_effects:
          - "plant(incident.plant_id).status = SHUTDOWN"
          - "link 1: every Lot with production_run_id IN incident.affected_run_ids and status AVAILABLE transitions to QUARANTINED"
          - "link 2 (caused by link 1): every PENDING Delivery whose lines contain a newly quarantined lot transitions to REJECTED with the delivered->allocated compensation, and its order.fulfillment_status = REJECTED"
          - "every AccountProductAuthorization with status AUTHORIZED whose product_id is produced by an affected run transitions to SUSPENDED with suspension_source = INCIDENT"
          - "every PromoProgram with status AUTHORIZED whose product_id is produced by an affected run transitions to SUSPENDED"
          - "every SCHEDULED ProductionRun at the plant transitions to CANCELLED"
          - "increments Incident.version by 1"
      - from: TRIAGED
        to: CLOSED
        trigger: "POST /incidents/{id}/transition with to CLOSED (early false alarm)"
        actor: SafetyOfficer
        preconditions: ["incident.status == TRIAGED"]
        side_effects: ["incident.resolution_outcome = FALSE_ALARM", "increments Incident.version by 1"]
      - from: CONFIRMED_RECALL
        to: CONTAINED
        trigger: "POST /incidents/{id}/transition with to CONTAINED"
        actor: SafetyOfficer
        preconditions: ["incident.status == CONFIRMED_RECALL"]
        side_effects: ["increments Incident.version by 1"]
      - from: CONTAINED
        to: TRIAGED
        trigger: "POST /incidents/{id}/transition with to TRIAGED (reopen on new evidence)"
        actor: SafetyOfficer
        preconditions: ["incident.status == CONTAINED"]
        side_effects: ["increments Incident.version by 1"]
        note: "cyclic: an incident may loop CONTAINED -> TRIAGED -> CONFIRMED_RECALL any number of times; cascades are idempotent on entities already in the target state"
      - from: CONTAINED
        to: RESOLVED
        trigger: "POST /incidents/{id}/transition with to RESOLVED and resolution_outcome CONFIRMED | FALSE_ALARM"
        actor: SafetyOfficer
        preconditions: ["incident.status == CONTAINED", "payload resolution_outcome IN {CONFIRMED, FALSE_ALARM}"]
        side_effects:
          - "incident.resolution_outcome = payload value"
          - "if CONFIRMED: every QUARANTINED lot of the incident transitions to RECALLED; every authorization SUSPENDED with suspension_source INCIDENT for an affected product transitions to REVOKED; plant stays SHUTDOWN"
          - "if FALSE_ALARM: every QUARANTINED lot transitions to AVAILABLE; every authorization SUSPENDED with suspension_source INCIDENT for an affected product transitions to AUTHORIZED with suspension_source NONE; every SUSPENDED promo program of an affected product transitions to AUTHORIZED; plant.status = ACTIVE"
          - "increments Incident.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /incidents/{id}/transition with to CLOSED"
        actor: SafetyOfficer
        preconditions: ["incident.status == RESOLVED"]
        side_effects: ["increments Incident.version by 1"]

concurrency_rules:
  - rule_id: territory-grant-stale-version
    parent_entity: Territory
    write_endpoint: "POST /territories/{id}/grant"
    occ_field: "expected_territory_version"
    description: |
      Granting or superseding a territory grant against a Territory whose
      version has advanced since the client last observed it is rejected.
      Because a grant from GRANTED legitimately supersedes the prior holder,
      the client's observed version is the only reliable guard: a stale
      expected_territory_version yields ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: distributor_performance_score
    trigger: "computed on every read of a Distributor (GET /distributors)"
    algorithm: weighted_scoring
    formula: |
      window = [now - 90 days, now]
      visits = ServiceVisit where distributor_id == D.id AND submitted_at IN window AND status IN {SUBMITTED, VERIFIED}
      provisional = round_half_up(mean(visits.score), 2); 0 if no such visits
      verified = visits where status == VERIFIED
      visit_component = mean(verified.score); 0 if none
      pulled = OpenedProductLog where account.distributor_id == D.id AND pulled_at IN window AND status IN {PULLED_ON_TIME, PULLED_LATE}
      on_time_pull_pct = 100 * count(status == PULLED_ON_TIME) / count(pulled); 100 if count(pulled) == 0
      orders = Order where distributor_id == D.id AND created_at IN window AND allocation_status IN {ALLOCATED, PARTIAL, SHORTED}
      fill_pct = 100 * sum(order lines qty_allocated) / sum(order lines qty_requested); 100 if sum(qty_requested) == 0
      final = round_half_up(0.5 * visit_component + 0.3 * on_time_pull_pct + 0.2 * fill_pct, 2)
    input_set: "trailing 90 days ending at the logical clock now; visits SUBMITTED or VERIFIED (provisional) vs VERIFIED only (final); pulls PULLED_ON_TIME/PULLED_LATE; orders ALLOCATED/PARTIAL/SHORTED"
    constants:
      W_VISIT: 0.5
      W_PULL: 0.3
      W_FILL: 0.2
      WINDOW_DAYS: 90
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "point-in-time field performance_score_provisional"
        difference: "mean of submitted-at-window visit scores INCLUDING unverified SUBMITTED visits; no pull/fill components"
      - name: final
        when: "field performance_score_final"
        difference: "weighted blend over VERIFIED visits only plus on-time-pull and fill-rate components"

  - name: promo_settlement
    trigger: "POST /promo-programs/{id}/authorize (provisional reserve) and POST /promo-programs/{id}/settle (final)"
    algorithm: aggregation
    formula: |
      markdown = product.base_price_cents - program.promo_price_cents
      unit_allowance_cents = round_half_up(markdown * PROMO_BRAND_SHARE, 0)
      provisional_amount = program.estimated_units * unit_allowance_cents
      final_amount = sum over payload redemption_lines of round_half_up(line.units * markdown * PROMO_BRAND_SHARE, 0)
      # PINNED ROUNDING ORDER: round each redemption line to integer cents FIRST, then sum.
      # The alternative (sum units across lines, then round once) is explicitly rejected.
    input_set: "authorize: estimated_units; settle: payload redemption_lines array of {period, units}"
    constants:
      PROMO_BRAND_SHARE: 0.6
      PROMO_FLOOR_PCT: 0.85
    precision: "integer cents, round_half_up per line then sum"
    variants:
      - name: provisional
        when: "at authorization; writes reserved_cents"
        difference: "uses forecast estimated_units; reserve = estimated_units * unit_allowance_cents"
      - name: final
        when: "at settlement; writes spent_cents and released_cents"
        difference: "uses actual redemption lines with per-line rounding; spent = final_amount, released = reserved - spent"

  - name: order_total_pricing
    trigger: "POST /orders/allocate-week, after each order's lines are allocated"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (circular-looking dependency resolved):
      (1) line_total_cents = qty_allocated * unit_price_cents, per line (integer cents, no rounding)
      (2) merchandise_total_cents = sum(line_total_cents)
      (3) tier_pct = 0.08 if merchandise_total_cents >= 500000
                     else 0.05 if >= 200000
                     else 0.02 if >= 100000
                     else 0
      (4) discount_cents = round_half_up(merchandise_total_cents * tier_pct, 0)
      (5) delivery_fee_cents = 0 if (merchandise_total_cents - discount_cents) >= 100000 else 1500
      (6) total_cents = merchandise_total_cents - discount_cents + delivery_fee_cents
      # The tier is keyed on the PRE-discount merchandise total (step 3 reads step 2).
      # The fee is keyed on the POST-discount total (step 5 reads step 4).
      # The fee never feeds back into the tier. This order is normative.
    input_set: "the order's OrderLine rows after allocation (qty_allocated > 0 lines contribute; zero-allocation lines contribute 0)"
    constants:
      TIER1_THRESHOLD_CENTS: 500000
      TIER1_PCT: 0.08
      TIER2_THRESHOLD_CENTS: 200000
      TIER2_PCT: 0.05
      TIER3_THRESHOLD_CENTS: 100000
      TIER3_PCT: 0.02
      FREE_DELIVERY_THRESHOLD_CENTS: 100000
      DELIVERY_FEE_CENTS: 1500
    precision: "integer cents, round_half_up for the discount only"
    variants: []

  - name: weekly_allocation_waterfall
    trigger: "POST /orders/allocate-week"
    algorithm: waterfall_allocation
    formula: |
      orders = Order where delivery_week == payload.delivery_week AND allocation_status == PENDING
      sort orders by: tier_rank ASC (ELITE=0, PREFERRED=1, STANDARD=2), then created_at ASC
      for each order in that order:
        for each line (in line creation order):
          pool = Lot where product_id == line.product_id AND status == AVAILABLE AND expires_at > now AND available_units > 0
          sort pool by expires_at ASC, then created_at ASC   # FEFO
          grant = min(line.qty_requested - line.qty_allocated, sum(pool.available_units))
          consume lots in FEFO order: lot.available_units -= take; lot.allocated_units += take
          line.qty_allocated += grant
        allocation_status = ALLOCATED if every line qty_allocated == qty_requested
                            else PARTIAL if sum(qty_allocated) > 0
                            else SHORTED
        then run calculations.order_total_pricing for the order
    input_set: "PENDING orders of the given delivery_week; AVAILABLE non-expired lots only"
    constants:
      TIER_RANK: { ELITE: 0, PREFERRED: 1, STANDARD: 2 }
    precision: "integer units"
    variants: []

  - name: freshness_pull_deadline
    trigger: "OpenedProductLog creation (deadline) and POST /opened-product-logs/{id}/pull (classification)"
    algorithm: threshold
    formula: |
      pull_deadline = opened_at + product.shelf_life_opened_hours hours
      on pull: pulled_at <= pull_deadline -> PULLED_ON_TIME
               pulled_at >  pull_deadline -> PULLED_LATE
      # boundary: a pull at exactly the deadline is ON TIME (<=, not <)
    input_set: "the single log being pulled"
    constants:
      LATE_PULL_SUSPENSION_THRESHOLD: 3
      LATE_PULL_WINDOW_DAYS: 30
    precision: "second-level timestamps"
    variants: []

  - name: production_capacity_check
    trigger: "POST /production-runs and POST /production-runs/{id}/complete"
    algorithm: threshold
    formula: |
      at create: require planned_units <= capacity_units; planned_units == capacity_units is allowed
      at complete: require actual_units + waste_units <= capacity_units and actual_units >= waste_units
      # boundary: equality is allowed in both checks
    input_set: "the run being created or completed"
    constants: {}
    precision: "integer units"
    variants: []

  - name: training_compliance_coverage
    trigger: "evaluated at POST /deliveries/{id}/confirm and surfaced as Account.training_compliant"
    algorithm: aggregation
    formula: |
      active = TrainingCertification where account_id == account.id AND status == ACTIVE AND now <= expires_at
      compliant = count(active where slicing_module_passed == true) >= TRAINING_MIN_CERTS
                  AND count(active where allergen_module_passed == true) >= TRAINING_MIN_CERTS
      # one certification with both modules counts toward both tallies
    input_set: "certifications of the delivery's account, excluding EXPIRED (lazy) and REVOKED"
    constants:
      TRAINING_MIN_CERTS: 2
      CERT_VALIDITY_DAYS: 180
    precision: "integer counts; boundary: exactly 2 of each module is compliant"
    variants: []

  - name: incident_scope_projection
    trigger: "computed on every read of an Incident"
    algorithm: projection
    formula: |
      affected_lots = Lot where production_run_id IN incident.affected_run_ids
      affected_accounts = distinct delivery.account_id over Delivery where status IN {PENDING, CONFIRMED}
                          AND any line.lot_id IN affected_lots
      affected_account_count = count(affected_accounts)
      # replay over the delivery log; rejected deliveries are excluded because their goods returned to the pool
    input_set: "deliveries in status PENDING or CONFIRMED whose lines reference lots of the affected runs"
    constants: {}
    precision: "integer count"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "entity-backed ownership: for DistributorRep, X-User-ID must equal the distributor that owns/will own the resource (order.distributor_id, visit.distributor_id, delivery.distributor_id, proposed account, promo program's servicing distributor, certification's account distributor); for RetailManager, X-User-ID must equal the account (delivery.account_id, slicer.account_id, log.account_id); for PlantScheduler, X-User-ID must equal the plant (run.plant_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all non-GET endpoints of entity-backed roles"
  - priority: 4
    category: existence
    check: "request body shape: required fields present, types match, enum values in declared sets, integer quantities > 0, window_start < window_end, start_date <= end_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: existence
    check: "every id referenced in path and body resolves to an existing entity, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 6
    category: state
    check: "target entity is in a from-state of the requested transition; already-terminal entities reject all further transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "terminal-state lockdown: transitions out of TERMINATED/REJECTED/CLOSED/SETTLED/RECALLED/EXHAUSTED/CONFIRMED/DELIVERED/REJECTED/PULLED_*/FORCE_PULLED/DECOMMISSIONED/EXPIRED/REVOKED are rejected"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_territory_version must equal the territory's current version on POST /territories/{id}/grant"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /territories/{id}/grant"
  - priority: 8
    category: business_safety
    check: "channel refusal: account with channel IN {MASS_MERCHANT, CLUB_STORE} may not be APPROVED (brand refuses those channels)"
    error_id: ERR_CHANNEL_REFUSED
    http_status: 422
    applies_to: "POST /accounts/{id}/review"
  - priority: 8
    category: business_safety
    check: "product channel restriction: a channel_restricted product may only be authorized for INDEPENDENT_GROCER accounts"
    error_id: ERR_PRODUCT_CHANNEL_RESTRICTED
    http_status: 422
    applies_to: "POST /account-product-authorizations"
  - priority: 8
    category: business_safety
    check: "allergen separation on opening: if product.requires_dedicated_slicer then slicer.dedicated_allergen must be IN product.allergen_tags; else if product.allergen_tags is non-empty then slicer.dedicated_allergen IN product.allergen_tags OR slicer.cleaning_verified_at >= opened_at - 24 hours; slicer must be ACTIVE and belong to the account"
    error_id: ERR_ALLERGEN_CROSS_CONTACT
    http_status: 422
    applies_to: "POST /opened-product-logs"
  - priority: 8
    category: business_safety
    check: "lot expiry: every delivery line lot must satisfy now < lot.expires_at at delivery confirmation; now == expires_at is expired"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /deliveries/{id}/confirm"
  - priority: 8
    category: business_safety
    check: "deliverable lots: every delivery line lot has status AVAILABLE (or allocated pool units) and is not QUARANTINED/RECALLED at delivery creation"
    error_id: ERR_LOT_NOT_DELIVERABLE
    http_status: 422
    applies_to: "POST /deliveries"
  - priority: 8
    category: business_safety
    check: "plant shutdown: no new production run may be scheduled at a plant with status SHUTDOWN, and no run may be completed at a SHUTDOWN plant"
    error_id: ERR_INCIDENT_ACTIVE
    http_status: 422
    applies_to: "POST /production-runs, POST /production-runs/{id}/complete"
  - priority: 9
    category: business_temporal
    check: "run window overlap: same (plant_id, line_code), excluding CANCELLED runs, half-open intervals [window_start, window_end): reject when new_start < existing_end AND existing_start < new_end; touching windows (new_start == existing_end) are allowed"
    error_id: ERR_RUN_OVERLAP
    http_status: 409
    applies_to: "POST /production-runs"
  - priority: 9
    category: business_temporal
    check: "visit spacing: same account, visits in any status except CANCELLED: reject when intervals overlap OR the gap between windows is strictly less than 30 minutes (new_start >= existing_end + 30min OR new_end + 30min <= existing_start required); exactly 30 minutes is allowed"
    error_id: ERR_VISIT_TOO_CLOSE
    http_status: 409
    applies_to: "POST /service-visits"
  - priority: 9
    category: business_temporal
    check: "promo window overlap: same account_id + product_id, programs in status AUTHORIZED or SUSPENDED, CLOSED date intervals [start_date, end_date]: reject when new_start <= existing_end AND existing_start <= new_end; a new program starting the day after the existing end is allowed, starting on the same day is not"
    error_id: ERR_PROMO_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /promo-programs/{id}/authorize"
  - priority: 10
    category: business_constraint
    check: "territory exclusivity: account.territory_id must be effectively GRANTED to the proposing distributor (and at review time still GRANTED to account.distributor_id)"
    error_id: ERR_TERRITORY_VIOLATION
    http_status: 422
    applies_to: "POST /accounts, POST /accounts/{id}/review"
  - priority: 10
    category: business_constraint
    check: "product authorization: every product in a delivery must have an AccountProductAuthorization in status AUTHORIZED for the delivery account"
    error_id: ERR_PRODUCT_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /deliveries"
  - priority: 10
    category: business_constraint
    check: "training coverage: calculations.training_compliance_coverage(account) must be true"
    error_id: ERR_TRAINING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /deliveries/{id}/confirm"
  - priority: 10
    category: business_constraint
    check: "unique code: code collides with an existing entity of the same type"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /distributors, POST /territories, POST /products, POST /plants"
  - priority: 10
    category: business_constraint
    check: "capacity: calculations.production_capacity_check bounds (planned <= capacity at create; actual + waste <= capacity and actual >= waste at complete)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /production-runs, POST /production-runs/{id}/complete"
  - priority: 10
    category: business_constraint
    check: "delivery quantity: for each line, qty <= lot.allocated_units for the lot's product pool and the lot's product appears on the order; also delivery account must be served by the order's distributor"
    error_id: ERR_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /deliveries"
  - priority: 10
    category: business_constraint
    check: "distributor must be ACTIVE to create orders, deliveries, service visits, promo programs, training certifications"
    error_id: ERR_DISTRIBUTOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /orders, POST /deliveries, POST /service-visits, POST /promo-programs, POST /training-certifications"
  - priority: 10
    category: business_constraint
    check: "account must be APPROVED to create service visits or deliveries against it"
    error_id: ERR_ACCOUNT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /service-visits, POST /deliveries, POST /promo-programs"
  - priority: 11
    category: business_fiscal
    check: "regulatory price floor: promo_price_cents >= round_half_up(product.base_price_cents * PROMO_FLOOR_PCT, 0)"
    error_id: ERR_PROMO_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /promo-programs/{id}/authorize"
  - priority: 11
    category: business_fiscal
    check: "promo budget: estimated_units * unit_allowance_cents <= budget_cents at authorize; final settlement <= budget_cents at settle"
    error_id: ERR_PROMO_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /promo-programs/{id}/authorize, POST /promo-programs/{id}/settle"

endpoints:
  - { method: POST, path: "/api/distributors", description: "create a distributor (initial status PROSPECT)", roles: [BrandAdmin], code: 201, input: [code, name, "service_level_tier?"], output: Distributor, side_effects: [] }
  - { method: GET, path: "/api/distributors", description: "list distributors with computed performance scores; filters status?, service_level_tier?", roles: [BrandAdmin, DistributorRep, RetailManager, PlantScheduler, SafetyOfficer], code: 200, input: ["status?", "service_level_tier?"], output: "Distributor[]", side_effects: ["recompute performance_score_provisional/performance_score_final per calculations.distributor_performance_score"] }
  - { method: POST, path: "/api/distributors/{id}/suspend", description: "ACTIVE -> SUSPENDED; cancels SCHEDULED/REWORK service visits", roles: [BrandAdmin], code: 200, input: [], output: Distributor, side_effects: ["ServiceVisit SCHEDULED/REWORK -> CANCELLED", "increments Distributor.version by 1"] }
  - { method: POST, path: "/api/distributors/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [BrandAdmin], code: 200, input: [], output: Distributor, side_effects: ["increments Distributor.version by 1"] }
  - { method: POST, path: "/api/distributors/{id}/terminate", description: "ACTIVE|SUSPENDED -> TERMINATED; revokes territories, cancels open orders and visits", roles: [BrandAdmin], code: 200, input: [], output: Distributor, side_effects: ["Territory GRANTED -> REVOKED", "Order open -> CANCELLED with lot release", "ServiceVisit SCHEDULED/REWORK -> CANCELLED", "increments Distributor.version by 1"] }
  - { method: POST, path: "/api/territories", description: "create a territory (initial status OPEN)", roles: [BrandAdmin], code: 201, input: [code, name, region, "min_weekly_visits_per_account?"], output: Territory, side_effects: [] }
