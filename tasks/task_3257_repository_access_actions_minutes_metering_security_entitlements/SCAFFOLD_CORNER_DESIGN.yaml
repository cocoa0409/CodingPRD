              as: Any
          assert:
            - "response envelope contains meta.api_request_id and response_type == array"
            - "data has 1 item; pagination reports total_count == 2 and has_more == true"

      - name: billing_cycle_reset_returns_summary
        claim_type: computed_read
        grounds:
          - "endpoints.POST /enterprises/{id}/billing-cycle/reset"
        distinguishing_aspect: "Reset returns reclaimed_seats and orgs_reset; after reset, a previously consumed org's consumed_actions_minutes reads 0."
        test_recipe:
          setup: ["Enterprise + TEAM Organization with 100 minutes consumed by a completed run"]
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "r1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 100, expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run_id: $.data.id }
            - call: "POST /workflow-runs/${run_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
          trigger:
            - call: "POST /enterprises/${ent_id}/billing-cycle/reset"
              payload: {}
              as: EnterpriseAdmin
              captures: { reclaimed: $.data.reclaimed_seats, orgs: $.data.orgs_reset }
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { consumed: $.data.consumed_actions_minutes }
          assert:
            - "reclaimed == 0"
            - "orgs == 1"
            - "consumed == 0"

