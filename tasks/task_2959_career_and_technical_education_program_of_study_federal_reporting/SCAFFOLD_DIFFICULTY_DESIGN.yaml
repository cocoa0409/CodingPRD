  - rule_id: resource_temporal_overlap
    instances:

      - name: committee_seat_terms_are_half_open_so_a_term_starting_on_the_end_date_is_legal
        grounds:
          - validations[priority=22]
          - errors[ERR_SEAT_TERM_OVERLAP]
          - entities.CommitteeMember.fields.term_start_on
          - entities.CommitteeMember.fields.term_end_on
          - entities.CommitteeMember.fields.seat_code
        distinguishing_aspect: |
          Seat occupancy is HALF-OPEN [term_start_on, term_end_on), so back-to-back terms touching at a single date are
          LEGAL: a start one day before the incumbent's end date is rejected, and a start exactly ON that date is
          accepted. The paired dates differ by one day, which falsifies any closed-interval implementation.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with one ACTIVE AdvisoryCommittee."
            - "An incumbent ACTIVE CommitteeMember holding seat_code EMP-3 with term_start_on 2026-01-01 and term_end_on 2027-01-01."
            - "The committee already holds three other ACTIVE members on seats EMP-1, EMP-2 and PSE-1, none of which is EMP-3."
