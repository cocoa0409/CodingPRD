              as: TourManager
              captures: { ovs3: $.data.id }
            - call: "POST /backline/tour-stops/${ovs3}/rider-lines"
              payload: { gear_model_id: "${ovm}", quantity: 1 }
              as: TourManager
              captures: { ovrl3: $.data.id }
            - call: "POST /backline/rider-lines/${ovrl3}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-14T00:00:00Z", end_date: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { overlap_err: $.data.error_id }
          assert:
            - "Adjacent window succeeds: ReservationLine.${ovr2} SOURCED reusing unit ${ovu} (end == start does not overlap)"
            - "Overlapping window fails: error_id == ERR_GEAR_UNAVAILABLE with http 409 (single unit, half-open intersection non-empty)"

      - name: cross_city_transit_buffer_overlap_semantics
        grounds:
          - calculations.gear_availability_window
          - validations[priority=8]
        distinguishing_aspect: |
          Different interval semantics than pure half-open adjacency: for a
          unit whose home_city differs from the stop city, the effective
          window start shifts back by TRANSIT_BUFFER_DAYS = 1, so a window
          starting 2026-08-15 in NYC collides with an LAX reservation ending
          2026-08-15 even though pure half-open adjacency would permit it.
        test_recipe:
          setup:
            - "Unit U home LAX reserved [2026-08-10, 2026-08-15) in LAX"
            - "New rider line at NYC stop requesting window [2026-08-15, 2026-08-18): effective start 2026-08-14 < 2026-08-15 -> collision"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Buffer Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { bfa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "BF-DRM-1", category: "DRUMS", daily_rate_cents: 25000, replacement_value_cents: 120000, weight_class: "STANDARD" }
              as: OpsManager
              captures: { bfm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${bfm}", serial_number: "BF-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { bfu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${bfa}", name: "Buffer Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { bft: $.data.id }
            - call: "POST /backline/tours/${bft}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
              captures: { bfs1: $.data.id }
            - call: "POST /backline/tour-stops/${bfs1}/rider-lines"
              payload: { gear_model_id: "${bfm}", quantity: 1 }
              as: TourManager
              captures: { bfrl1: $.data.id }
            - call: "POST /backline/rider-lines/${bfrl1}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /backline/tours/${bft}/stops"
              payload: { city_code: "NYC", venue_date: "2026-08-16T00:00:00Z", load_in_ts: "2026-08-16T10:00:00Z" }
              as: TourManager
              captures: { bfs2: $.data.id }
            - call: "POST /backline/tour-stops/${bfs2}/rider-lines"
              payload: { gear_model_id: "${bfm}", quantity: 1 }
              as: TourManager
              captures: { bfrl2: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${bfrl2}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "NYC", start_date: "2026-08-15T00:00:00Z", end_date: "2026-08-18T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { buf_err: $.data.error_id }
          assert:
            - "error_id == ERR_GEAR_UNAVAILABLE: transit buffer makes effective window [2026-08-14, 2026-08-18) which intersects [2026-08-10, 2026-08-15)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_balance_conserved_under_source_then_cancel
        grounds:
          - calculations.deposit_hold_rule
          - state_machines.ReservationLine.SOURCED_to_CANCELLED
          - entities.Artist.fields.deposit_credit_cents
        distinguishing_aspect: |
          Conserved quantity: artist net deposit exposure. INVARIANT:
          artist.deposit_credit_cents + sum(reservation.deposit_held_cents
          over non-terminal reservations) == constant across a source-then-
          cancel pair — sourcing moves 55000 from balance to held, cancelling
          moves exactly 55000 back, zero drift.
        test_recipe:
          setup:
            - "Artist topped up 55000; model replacement 300000 -> hold 55000"
            - "Capture balance after sourcing (balance 0, held 55000) and after cancel (balance 55000, held 0)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Invariant Act", tier: "STANDARD" }
              as: OpsManager
              captures: { ia: $.data.id }
            - call: "POST /backline/artists/${ia}/deposit-topups"
              payload: { amount_cents: 55000 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "IV-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 300000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { im: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${im}", serial_number: "IV-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { iu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ia}", name: "Invariant Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-I" }
              as: TourManager
              captures: { it: $.data.id }
            - call: "POST /backline/tours/${it}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { is1: $.data.id }
            - call: "POST /backline/tour-stops/${is1}/rider-lines"
              payload: { gear_model_id: "${im}", quantity: 1 }
              as: TourManager
              captures: { irl: $.data.id }
            - call: "POST /backline/rider-lines/${irl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ir: $.data.id, ir_held: $.data.deposit_held_cents }
            - call: "GET /backline/artists/${ia}"
              as: OpsManager
              captures: { ia_bal_sourced: $.data.deposit_credit_cents }
          trigger:
            - call: "POST /backline/reservation-lines/${ir}/cancel"
              payload: {}
              as: TourManager
            - call: "GET /backline/artists/${ia}"
              as: OpsManager
              captures: { ia_bal_cancelled: $.data.deposit_credit_cents }
          assert:
            - "ReservationLine.${ir}.deposit_held_cents == 55000 after sourcing"
            - "Artist.${ia}.deposit_credit_cents == 0 after sourcing (55000 top-up - 55000 hold debited)"
            - "Artist.${ia}.deposit_credit_cents == 55000 after cancel (compensation credits exactly 55000 back; balance + non-terminal held == 55000 invariant, drift-free)"
            - "GearUnit.${iu}.status == AVAILABLE and active_reservation_id == null after cancel"

      - name: shipment_weight_conserved_under_load_then_cancel
        grounds:
          - entities.Shipment.fields.booked_weight_kg
          - state_machines.ShipmentLine.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Different conserved quantity than money: shipment booked weight.
          INVARIANT: shipment.booked_weight_kg == sum(weight_kg over
          ShipmentLine with status IN {BOOKED, LOADED}) at all times — booking
          two lines (30 + 40 = 70) then cancelling the 30kg line leaves
          exactly 40, and cancelling the shipment entirely leaves 0.
        test_recipe:
          setup:
            - "Shipment capacity 100kg; two BOOKED lines of 30kg and 40kg"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Weight Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { wa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "WT-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "STANDARD" }
              as: OpsManager
              captures: { wm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${wm}", serial_number: "WT-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { wu1: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${wm}", serial_number: "WT-U2", home_city_code: "LAX" }
              as: OpsManager
              captures: { wu2: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${wa}", name: "Weight Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { wt: $.data.id }
            - call: "POST /backline/shipments"
              payload: { tour_id: "${wt}", from_city_code: "LAX", to_city_code: "NYC", ship_date: "2026-08-09T00:00:00Z", capacity_kg: 100 }
              as: LogisticsCoordinator
              captures: { wsh: $.data.id }
            - call: "POST /backline/shipments/${wsh}/lines"
              payload: { gear_unit_id: "${wu1}", weight_kg: 30, labor_minutes: 10 }
              as: LogisticsCoordinator
              captures: { wsl1: $.data.id }
            - call: "POST /backline/shipments/${wsh}/lines"
              payload: { gear_unit_id: "${wu2}", weight_kg: 40, labor_minutes: 10 }
              as: LogisticsCoordinator
              captures: { wsl2: $.data.id }
            - call: "GET /backline/shipments/${wsh}"
              as: LogisticsCoordinator
              captures: { wsh_w0: $.data.booked_weight_kg }
          trigger:
            - call: "POST /backline/shipment-lines/${wsl1}/cancel"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /backline/shipments/${wsh}"
              as: LogisticsCoordinator
              captures: { wsh_w1: $.data.booked_weight_kg }
          assert:
            - "Shipment.${wsh}.booked_weight_kg == 70 after two bookings (30 + 40)"
            - "Shipment.${wsh}.booked_weight_kg == 40 after cancelling the 30kg line (derived field reconciled exactly; no drift)"
            - "Shipment.${wsh}.tech_labor_minutes == 10 after cancel (labor also reconciled: 20 - 10)"
