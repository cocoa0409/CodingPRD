            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Smd", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 1000, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { req: $.data.id } }
