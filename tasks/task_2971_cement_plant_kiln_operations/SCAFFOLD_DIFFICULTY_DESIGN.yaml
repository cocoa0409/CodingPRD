  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: free_lime_exactly_at_the_plant_ceiling_is_in_spec
        grounds: >
          calculations.lab_spec_bounds defines FREE_LIME as in_spec = (value <= spec_max) with
          spec_max = Plant.clinker_free_lime_max_pct, an INCLUSIVE ceiling, and the KilnRun quality
          machine keys PENDING_LAB -> QUARANTINED on value > that ceiling.
        distinguishing_aspect: >
          An implementation using a strict `<` returns in_spec false at exactly 1.50, quarantines
          the run and then refuses release-clinker with ERR_FREE_LIME_OUT_OF_SPEC. The correct
          behaviour at 1.50 is in_spec true, quality_state PENDING_LAB and a successful release; the
          one-hundredth more at 1.51 must quarantine.
        test_recipe:
          setup: >
            Plant clinker_free_lime_max_pct 1.50. Two completed gas-fired runs on two kilns so each
            can be tested independently: RA gets exactly 1.50, RB gets 1.51.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
