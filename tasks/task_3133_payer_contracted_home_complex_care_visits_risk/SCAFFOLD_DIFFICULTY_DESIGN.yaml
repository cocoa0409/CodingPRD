  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_beats_clinician_assignment_check
        grounds:
          - validations.priority_5_state
          - validations.priority_8_business_safety
          - errors.ERR_VISIT_NOT_SCHEDULED
          - errors.ERR_NOT_ASSIGNED_CLINICIAN
        distinguishing_aspect: |
          Error-category pair (state) vs (business_safety). A clinician who
          is NOT the assigned clinician tries to depart a visit that is
          already in EN_ROUTE (so the state precondition ALSO fails). The
          priority table puts state (priority 5) ahead of business_safety
          (priority 8), so the response is 409 ERR_VISIT_NOT_SCHEDULED, not
          403 ERR_NOT_ASSIGNED_CLINICIAN. Reversing the order would leak
          information about the assignment to a non-assigned clinician.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment; visit V1 assigned to NP1, currently in EN_ROUTE (departed by NP1). Clinician NP2 also exists (different person)."
