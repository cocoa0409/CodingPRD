          trigger:
            - { call: "POST /locker/appointments/${appt}/no-show", payload: {}, as: PlantOperator, captures: { appt_st: $.data.status } }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1_st: "$.data[0].status", an2_st: "$.data[1].status" } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-16", date_to: "2026-08-16" }, as: PlantOperator, captures: { cd_booked: "$.data[0].booked_head", cd_st: "$.data[0].status" } }
            - { call: "GET /locker/customers/${c1}", payload: {}, as: PlantOperator, captures: { cu_strikes: $.data.no_show_strikes, cu_st: $.data.status } }
          assert:
            - "Appointment.status == NO_SHOW"
            - "both Animals.status == VOIDED"
            - "CapacityDay.booked_head == 0 (2 heads released via the two animal voidings) and status == OPEN"
            - "Customer.no_show_strikes == 1 and Customer.status == ELEVATED_DEPOSIT"
            - "Appointment.refund_cents == 0 (deposit forfeited)"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_fab_wrong_state_beats_missing_cut_sheet
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CUT_SHEET_MISSING]
        distinguishing_aspect: |
          Category pair state (4) vs business_referential (8): the animal is
          only SLAUGHTERED (not HANGING) AND no cut sheet exists; the single
          response must be the state error ERR_INVALID_STATE, not
          ERR_CUT_SHEET_MISSING.
        test_recipe:
          setup:
            - "Clock default; c1 ACTIVE; CapacityDay 2026-08-20 cap 1; confirmed HOG appointment; animal received and slaughtered (SLAUGHTERED, never weighed); no shares, no cut sheets"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
