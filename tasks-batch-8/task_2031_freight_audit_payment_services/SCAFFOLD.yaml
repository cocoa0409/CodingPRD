    code: 200
    input: []
    output: ShipmentRecord
    side_effects: []
  - method: GET
    path: "/fap/shipments"
    description: "List shipments"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["client_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: "ShipmentRecord[]"
    side_effects: []
  - method: POST
    path: "/fap/shipments/{id}/void"
    description: "REGISTERED -> VOIDED"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: ShipmentRecord
    side_effects: []

  # --- CarrierInvoice + InvoiceLine ---
  - method: POST
    path: "/fap/clients/{id}/invoices"
    description: "Capture a carrier invoice with its lines (audit RECEIVED, payment UNPAID)"
    roles: [AuditAnalyst]
    code: 201
    input: [carrier_id, invoice_number, invoice_date, currency, billed_total_minor, lines, "shipment_id?"]
    output: CarrierInvoice
    side_effects:
      - "lines array of {charge_code, billed_amount_minor} materialized as InvoiceLine rows"
      - "ERR_DUPLICATE_INVOICE_NUMBER, ERR_AMOUNT_MISMATCH when billed_total != sum(lines)"
  - method: GET
    path: "/fap/invoices/{id}"
    description: "Get an invoice"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: CarrierInvoice
    side_effects: []
  - method: GET
    path: "/fap/invoices"
    description: "List invoices"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["client_id?", "carrier_id?", "shipment_id?", "rated_contract_id?", "audit_status?", "payment_status?", "limit?", "offset?"]
    output: "CarrierInvoice[]"
    side_effects: []
  - method: POST
    path: "/fap/invoices/{id}/capture"
    description: "RECEIVED -> CAPTURED; runs duplicate_detection"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: CarrierInvoice
    side_effects: ["duplicate_detection", "shipment REGISTERED -> INVOICED when linked"]
  - method: POST
    path: "/fap/invoices/{id}/rate"
    description: "CAPTURED -> RATED (or EXCEPTION with NO_CONTRACT when no covering contract)"
    roles: [AuditAnalyst]
    code: 200
    input: ["policy?"]
    output: CarrierInvoice
    side_effects: ["line_rating (policy SHIP_DATE default, or INVOICE_DATE)"]
  - method: POST
    path: "/fap/invoices/{id}/finalize_audit"
    description: "RATED -> CLEARED or RATED -> EXCEPTION per exception_routing"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: CarrierInvoice
    side_effects: ["exception_routing", "approved_amount_minor and home_total_minor computed when CLEARED"]
  - method: POST
    path: "/fap/invoices/{id}/rerate"
    description: "EXCEPTION -> RATED; requires no active exceptions"
    roles: [AuditAnalyst]
    code: 200
    input: ["policy?"]
    output: CarrierInvoice
    side_effects: ["line_rating re-run", "ERR_EXCEPTION_STILL_ACTIVE"]
  - method: POST
    path: "/fap/invoices/{id}/void"
    description: "RECEIVED|CAPTURED -> VOIDED"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: CarrierInvoice
    side_effects: []
  - method: POST
    path: "/fap/invoices/{id}/write_off"
    description: "payment UNPAID -> WRITTEN_OFF (requires audit CLEARED)"
    roles: [FinanceController]
    code: 200
    input: []
    output: CarrierInvoice
    side_effects: []
  - method: GET
    path: "/fap/invoice-lines/{id}"
    description: "Get an invoice line"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []
  - method: GET
    path: "/fap/invoice-lines"
    description: "List invoice lines"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["invoice_id?", "gl_account_id?", "limit?", "offset?"]
    output: "InvoiceLine[]"
    side_effects: []
  - method: GET
    path: "/fap/invoices/{id}/lines"
    description: "List lines of an invoice"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: "InvoiceLine[]"
    side_effects: []
  - method: POST
