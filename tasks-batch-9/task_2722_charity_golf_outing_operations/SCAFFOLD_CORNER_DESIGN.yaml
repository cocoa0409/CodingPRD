        distinguishing_aspect: "Two preconditions guard one action and are peeled in the declared order: with a DRAFT contract AND no tier the contract error is reported, after signing the tier error appears, after the first tier the transition succeeds - and an outing with no contract row at all fails the same contract check rather than a 404."
        test_recipe:
          setup:
