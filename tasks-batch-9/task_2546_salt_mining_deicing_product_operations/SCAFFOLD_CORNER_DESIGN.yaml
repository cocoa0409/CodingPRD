  - section: endpoints
    instances:
      - name: patch_depot_updates_only_the_named_field_and_bumps_version
        claim_type: standard_crud
        grounds:
          - "endpoints[PATCH /salt/depots/{id}]"
          - entities.Depot.fields.outbound_freight_rate_per_ton
          - entities.Depot.common_fields
        distinguishing_aspect: |
          A partial update carrying one of four optional fields must leave the other three at their
          created values, bump version 1 -> 2 and move updated_at while created_at is frozen. An
          implementation that treats the PATCH body as a full replacement nulls the omitted
          capacities and silently breaks every later capacity check.
        test_recipe:
          setup:
            - "One depot created with all four numeric attributes set."
          setup_api_calls:
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id", v0: "$.data.version", created: "$.data.created_at" }
          trigger:
            - call: "PATCH /salt/depots/${depot_a}"
              payload: { outbound_freight_rate_per_ton: 9.750 }
              as: LogisticsPlanner
              captures: { rate: "$.data.outbound_freight_rate_per_ton", v1: "$.data.version", cov: "$.data.covered_capacity_tons", pad: "$.data.open_pad_capacity_tons", load: "$.data.loadout_rate_tons_per_hour" }
          assert:
            - "HTTP 200, ${rate} == 9.750, ${v0} == 1 and ${v1} == 2"
            - "${cov} == 5000, ${pad} == 5000 and ${load} == 500 are unchanged"
            - "created_at still equals ${created} and updated_at is at or after it"
            - "depot_state is still OPEN and covered_utilization_pct == 0.00"
            - "a follow-up GET /salt/depots/${depot_a} returns byte-identical values to the PATCH response"

      - name: cancelling_a_planned_shipment_frees_the_loadout_bay_for_the_blocked_one
        claim_type: conditional_action
        grounds:
          - calculations.depot_loadout_bay_conflict
          - state_machines.Shipment.PLANNED_to_CANCELLED
          - errors[ERR_LOADOUT_BAY_CONFLICT]
          - entities.Shipment.fields.required_gap_minutes
        distinguishing_aspect: |
          The same TRUCK shipment is refused and then accepted with no change to its own payload:
          while a RAIL peer occupies 08:00-10:00 the buffered block reaches 10:45 and the 10:30 truck
          collides, but the peer set is defined as PLANNED plus LOADED only, so cancelling the rail
          move makes the identical request succeed. The buffer is taken from the peer's mode (45),
          not the newcomer's (0).
        test_recipe:
          setup:
            - "A 940.00 t covered HIGHWAY_DEICING lot at Syracuse Depot, a Rochester destination depot, and one PLANNED RAIL shipment of 400 t loading 08:00-10:00."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Rochester Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 400, outbound_freight_rate_per_ton: 8.000 }
              as: LogisticsPlanner
              captures: { depot_b: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "RAIL", tons: 400, load_window_start: "2026-08-05T08:00:00Z", load_window_end: "2026-08-05T10:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { ship_rail: "$.data.id", gap: "$.data.required_gap_minutes" }
          trigger:
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 300, load_window_start: "2026-08-05T10:30:00Z", load_window_end: "2026-08-05T11:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
            - call: "POST /salt/shipments/${ship_rail}/cancel"
              payload: { reason: "railcars reassigned to a storm depot" }
              as: LogisticsPlanner
              captures: { rail_state: "$.data.status" }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 300, load_window_start: "2026-08-05T10:30:00Z", load_window_end: "2026-08-05T11:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { ship_truck: "$.data.id", truck_gap: "$.data.required_gap_minutes" }
          assert:
            - "${gap} == 45 for the RAIL row"
            - "the first TRUCK call -> HTTP 409 ERR_LOADOUT_BAY_CONFLICT (blocked window 07:15-10:45 contains the 10:30 start)"
            - "the cancel -> HTTP 200 with ${rail_state} == CANCELLED"
            - "the retried TRUCK call -> HTTP 201 with ${truck_gap} == 0"
            - "StockpileLot.${lot_id}.tons_on_hand == 940.00 and tons_reserved == 0 throughout — a PLANNED shipment moves no tonnage, so the cancel had nothing to restore"
            - "GET /salt/shipments?origin_depot_id=${depot_a} returns total_count == 2 with one CANCELLED and one PLANNED row"

      - name: manual_close_of_a_hoisted_run_with_no_batches
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /salt/production-runs/{id}/close]"
          - state_machines.ProductionRun.HOISTED_to_CLOSED
          - entities.ProductionRun.fields.open_batch_count
        distinguishing_aspect: |
          The action endpoint is reachable directly, not only as the automatic side effect of the
          last batch leaving PENDING: a HOISTED run whose open_batch_count is already 0 closes on an
          explicit call with an empty body and no OCC token.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1, one run hoisted with 1000 t and no treatment batches at all."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
              captures: { st_hoisted: "$.data.status", obc: "$.data.open_batch_count" }
          trigger:
            - call: "POST /salt/production-runs/${run_id}/close"
              payload: {}
              as: MinePlanner
              captures: { st: "$.data.status", v: "$.data.version" }
          assert:
            - "${st_hoisted} == HOISTED with ${obc} == 0"
            - "HTTP 200 and ${st} == CLOSED with ${v} == 3 (create, hoist, close)"
            - "Mine.${mine_id}.scheduled_hoist_tons_open == 0 — a CLOSED run is outside the SCHEDULED input set"
            - "GET /salt/mines/${mine_id}/hoist-capacity reports scheduled_run_count == 0"

      - name: hoist_capacity_read_derives_every_field_without_mutating
        claim_type: computed_read
        grounds:
          - "endpoints[GET /salt/mines/{id}/hoist-capacity]"
          - calculations.mine_effective_hoist_capacity
          - calculations.hoist_window_aggregate_capacity
        distinguishing_aspect: |
          A healthy mine with one SCHEDULED 1000 t run over a 24 h window must report both factors
          at 1.00, effective capacity equal to the rated 24000.00, an hourly capacity of 1000.00 and
          scheduled_hoist_tons_open of 1000.00 — and the read must leave Mine.version at 2 (create
          plus the run's OCC bump), proving it is a pure projection.
        test_recipe:
          setup:
            - "Mine rated 24000 t/day, RUNNING hoist, COMPLIANT, with one SCHEDULED run of 1000 t over 24 h."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "GET /salt/mines/${mine_id}/hoist-capacity"
              payload: {}
              as: MinePlanner
              captures: { rated: "$.data.rated_hoist_tons_per_day", hf: "$.data.hoist_factor", cf: "$.data.compliance_factor", eff: "$.data.effective_hoist_tons_per_day", hourly: "$.data.mine_hourly_capacity", open_t: "$.data.scheduled_hoist_tons_open", cnt: "$.data.scheduled_run_count" }
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { v_after: "$.data.version" }
          assert:
            - "HTTP 200 with ${rated} == 24000.00, ${hf} == 1.00, ${cf} == 1.00 and ${eff} == 24000.00"
            - "${hourly} == 1000.00 (24000.00 / 24)"
            - "${open_t} == 1000.00 and ${cnt} == 1"
            - "${v_after} == 2 — the computed read mutated nothing"
            - "ProductionRun.${run_id}.planned_tons_per_hour == 41.6667 is unchanged by the read"

      - name: release_allocations_releases_every_line_across_two_lots_at_once
        claim_type: bulk_action
        grounds:
          - "endpoints[POST /salt/delivery-orders/{id}/release-allocations]"
          - calculations.lot_tonnage_conservation
          - entities.Allocation.fields.state
        distinguishing_aspect: |
          One call must sweep every RESERVED line on the order, not just the first: two manual
          allocations drawn from two different lots both move to RELEASED, both lots are restored
          exactly, and the order returns from ALLOCATED to REQUESTED with allocated_tons back to
          0.00. A loop that breaks after the first row leaves 300.00 t stranded.
        test_recipe:
          setup:
            - "Two covered HIGHWAY_DEICING lots in NY (Syracuse 282.00 t, Rochester 940.00 t) from one run, an ACTIVE 1000 t NY contract, one 500 t order on Syracuse, and two manual allocations of 200 and 300 tons."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1300, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1300 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Rochester Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 400, outbound_freight_rate_per_ton: 8.000 }
              as: LogisticsPlanner
              captures: { depot_b: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 300, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_a: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_a}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_b}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_b: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_b}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_a}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_a: "$.data[0].id", lot_a_v: "$.data[0].version" }
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_b}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_b: "$.data[0].id", lot_b_v: "$.data[0].version" }
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts/${c_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { c_v: "$.data.version" }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 500, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${c_v}" }
              as: LogisticsPlanner
              captures: { order_id: "$.data.id" }
            - call: "POST /salt/allocations"
              payload: { delivery_order_id: "${order_id}", stockpile_lot_id: "${lot_a}", tons: 200, expected_stockpile_lot_version: "${lot_a_v}" }
              as: LogisticsPlanner
              captures: { alloc_1: "$.data.id" }
            - call: "POST /salt/allocations"
              payload: { delivery_order_id: "${order_id}", stockpile_lot_id: "${lot_b}", tons: 300, expected_stockpile_lot_version: "${lot_b_v}" }
              as: LogisticsPlanner
              captures: { alloc_2: "$.data.id" }
          trigger:
            - call: "POST /salt/delivery-orders/${order_id}/release-allocations"
              payload: { reason: "customer deferred the load to next week" }
              as: LogisticsPlanner
              captures: { st: "$.data.status", alloc: "$.data.allocated_tons" }
            - call: "GET /salt/allocations?delivery_order_id=${order_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { s1: "$.data[0].state", s2: "$.data[1].state" }
          assert:
            - "the order was ALLOCATED before the trigger (200 + 300 == requested 500)"
            - "HTTP 200 with ${st} == REQUESTED and ${alloc} == 0.00 and shorted_tons == 0"
            - "${s1} == RELEASED and ${s2} == RELEASED — both lines, in one call"
            - "StockpileLot.${lot_a}.tons_reserved == 0.00 and tons_available == 282.00"
            - "StockpileLot.${lot_b}.tons_reserved == 0.00 and tons_available == 940.00"
            - "both lots are still AVAILABLE with tons_on_hand unchanged at 282.00 and 940.00"
            - "penalty_state == NONE and shortfall_penalty_usd == 0 (the order was never SHORTED)"

      - name: allocation_lines_reachable_from_both_the_order_and_the_lot
        claim_type: cross_reference_link
        excluded_because:
          difficulty_instance: manual_reservation_then_release_restores_lot_tonnage_with_zero_drift
          rationale: |
            That instance walks the Allocation junction from both directions —
            GET /salt/allocations?delivery_order_id= and ?stockpile_lot_id= — and asserts the same
            row appears in both filtered lists before and after the release.

      - name: manual_panel_suspend_then_abandon_action_endpoints
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /salt/panels/{id}/suspend]"
          - "endpoints[POST /salt/panels/{id}/abandon]"
          - state_machines.Panel.PRODUCING_to_SUSPENDED
          - state_machines.Panel.SUSPENDED_to_ABANDONED
          - "validations[priority=13]"
        distinguishing_aspect: |
          The two manual ground-control action endpoints, which are reachable only by explicit call
          (the system paths into SUSPENDED and ABANDONED both run off DEFECT inspections). The manual
          suspend must NOT set open_defect — so no remediation is needed to leave SUSPENDED — while
          the abandon voids the HELD run rather than holding it, freezes recoverable_tons and then
          refuses a repeat because ABANDONED is terminal. An implementation that routes both actions
          through the inspection-driven cascade sets open_defect on suspend and fails here.
        test_recipe:
          setup:
            - "Mine with one PRODUCING panel (recoverable 50000.00) carrying one SCHEDULED 1000 t run."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id", rec: "$.data.recoverable_tons" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "POST /salt/panels/${panel_id}/suspend"
              payload: { reason: "convergence 0.045 in/day above the trigger level" }
              as: GroundControlEngineer
              as_user_id: "gce-1"
              captures: { st_susp: "$.data.status", susp_by: "$.data.suspended_by_user_id", defect: "$.data.open_defect", dcount: "$.data.ground_control_defect_count" }
            - call: "GET /salt/production-runs?panel_id=${panel_id}"
              payload: {}
              as: MinePlanner
              captures: { r_state_1: "$.data[0].status", r_reason: "$.data[0].held_reason" }
            - call: "POST /salt/panels/${panel_id}/abandon"
              payload: { reason: "roof conditions uneconomic to rehabilitate" }
              as: MinePlanner
              captures: { st_aband: "$.data.status", rec_frozen: "$.data.recoverable_tons" }
            - call: "GET /salt/production-runs?panel_id=${panel_id}"
              payload: {}
              as: MinePlanner
              captures: { r_state_2: "$.data[0].status" }
            - call: "POST /salt/panels/${panel_id}/abandon"
              payload: { reason: "duplicate abandonment" }
              as: MinePlanner
          assert:
            - "${rec} == 50000.00 before the trigger"
            - "call 1 -> HTTP 200 with ${st_susp} == SUSPENDED and ${susp_by} == 'gce-1'"
            - "${defect} == false and ${dcount} == 0 — a manual suspend files no inspection, so no remediation is required to resume"
            - "${r_state_1} == HELD and ${r_reason} == GROUND_CONTROL, and Mine.${mine_id}.producing_panel_count == 0 with scheduled_hoist_tons_open == 0.00"
            - "call 3 -> HTTP 200 with ${st_aband} == ABANDONED and ${rec_frozen} == 50000.00 (frozen, not zeroed)"
            - "${r_state_2} == VOIDED — abandonment voids the HELD run instead of leaving it holdable"
            - "call 5 -> HTTP 409 with error code ERR_PANEL_INVALID_STATE, and Panel.${panel_id}.version is unchanged from what call 3 left"
            - "GET /salt/panels?mine_id=${mine_id}&status=ABANDONED returns total_count == 1 and has_more == false"

  # ===========================================================================
  # 6. From Table 6 (Errors)
  #    Section 6 of the guide has no claim table — the single obligation is
  #    "verify every error code is triggerable", so every instance below carries
  #    claim_type: triggerability. Coverage map for all 49 ids in §1.6:
  #      auth/identity   ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED,
  #                      ERR_SEGREGATION_OF_DUTIES, ERR_DEPOT_NOT_OWNED
  #                        -> section: rbac
  #      shape           ERR_INVALID_REQUEST
  #                        -> entities.bid_contract_create_missing_committed_tons_rejected
  #                           and entities.treatment_batch_invalid_product_line_enum_rejected
  #      existence       ERR_MINE_NOT_FOUND -> entities.panel_create_with_unknown_mine_id_...
  #                      ERR_PANEL_NOT_FOUND -> entities.panel_get_with_unknown_uuid_...
  #                      the other 9 -> unknown_path_ids_return_entity_scoped_not_found_errors
  #      OCC             ERR_STALE_MINE_VERSION, ERR_STALE_STOCKPILE_LOT_VERSION
  #                        -> section: cross_cutting_complexity_layers
  #                      ERR_STALE_BID_CONTRACT_VERSION -> §1.8 (stubbed there and here)
  #      state           ERR_CONTRACT_INVALID_STATE -> §1.8 + state_machines.resubmitting_...
  #                      ERR_RUN_INVALID_STATE -> state_machines.close_on_scheduled_run_...
  #                      ERR_ORDER_INVALID_STATE, ERR_ALLOCATION_NOT_RESERVED -> below
  #                      ERR_PANEL_INVALID_STATE, ERR_PANEL_RESERVE_EXCEEDED -> below
  #                      ERR_SHIPMENT_INVALID_STATE, ERR_LOT_QUARANTINED,
  #                      ERR_BATCH_QC_ALREADY_DECIDED, ERR_INSUFFICIENT_LOT_TONS,
  #                      ERR_PRODUCT_LINE_MISMATCH, ERR_LOT_STATE_INVALID -> below
  #                      ERR_DEPOT_CLOSED -> validations.order_on_a_closed_depot_...
  #                      ERR_REWORK_LIMIT_EXCEEDED, ERR_PENALTY_NOT_ACCRUED -> §1.8
  #      safety          ERR_MINE_WITHDRAWAL_ORDER_ACTIVE,
  #                      ERR_GROUND_CONTROL_DEFECT_OPEN -> §1.8
  #                      ERR_HOIST_UNAVAILABLE -> below (§1.8 only asserts it is
  #                      NOT the code returned, so it needs a positive trigger)
  #                      ERR_SCREEN_SPEC_NOT_ALLOWED, ERR_ADDITIVE_DOSE_OUT_OF_SPEC -> below
  #                      ERR_PURITY_BELOW_SPEC, ERR_UNCOVERED_STORAGE_NOT_ALLOWED,
  #                      ERR_PRESEASON_WINDOW_CLOSED -> section: validations
  #      constraint      ERR_HOIST_CAPACITY_EXCEEDED, ERR_LOADOUT_BAY_CONFLICT,
  #                      ERR_COVERED_CAPACITY_EXCEEDED, ERR_NO_ELIGIBLE_STOCKPILE,
  #                      ERR_TAKE_BAND_EXCEEDED -> §1.8
  #                      ERR_PRESEASON_COVERAGE_SHORT -> below
  # ===========================================================================
  - section: errors
    instances:
      - name: unknown_path_ids_return_entity_scoped_not_found_errors
        claim_type: triggerability
        grounds:
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_DEPOT_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_FORECAST_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - "validations[priority=8]"
        distinguishing_aspect: |
          Each collection must return its OWN 404 code, not one shared ERR_NOT_FOUND: ten
          syntactically valid but unknown UUIDs on ten different collections must produce ten
          distinct error_id values. The single most common shortcut in an implementation is one
          generic not-found error, which this instance detects on nine of the ten calls.
        test_recipe:
          setup:
            - "Empty database — no setup calls are needed, because none of these ids exist."
          setup_api_calls: []
          trigger:
            - call: "GET /salt/production-runs/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/treatment-batches/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/depots/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/stockpile-lots/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/shipments/00000000-0000-0000-0000-0000000000a5"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/season-forecasts/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/bid-contracts/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/delivery-orders/00000000-0000-0000-0000-0000000000a8"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/allocations/00000000-0000-0000-0000-0000000000a9"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /salt/ground-control-inspections/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: LogisticsPlanner
          assert:
            - "every call returns HTTP 404 with the error envelope shape {error_id, message}"
            - "the ten error_id values are, in call order: ERR_RUN_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_DEPOT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_FORECAST_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_INSPECTION_NOT_FOUND"
            - "no two of the ten responses share an error_id"

      - name: treatment_batch_spec_guards_reject_a_bad_screen_and_a_bad_additive_dose
        claim_type: triggerability
        grounds:
          - errors[ERR_SCREEN_SPEC_NOT_ALLOWED]
          - errors[ERR_ADDITIVE_DOSE_OUT_OF_SPEC]
          - "validations[priority=25]"
          - "validations[priority=26]"
        distinguishing_aspect: |
          Both product-line spec guards are triggered on the same HOISTED run so their 422s cannot be
          confused with each other: FOOD_GRADE + COARSE violates only the screen table, and
          WATER_CONDITIONING + COARSE with 5.00 ppm anticaking violates only the additive window
          (its allowed range is the degenerate [0,0]).
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1, one run hoisted with 1000 t and Syracuse Depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
          trigger:
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "FOOD_GRADE", screen_spec: "COARSE", anticaking_ppm: 8.00, corrosion_inhibitor_pct: 0.00, input_tons: 500, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "WATER_CONDITIONING", screen_spec: "COARSE", anticaking_ppm: 5.00, corrosion_inhibitor_pct: 0.00, input_tons: 500, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
          assert:
            - "call 1 -> HTTP 422 with error code ERR_SCREEN_SPEC_NOT_ALLOWED (FOOD_GRADE accepts FINE only)"
            - "call 2 -> HTTP 422 with error code ERR_ADDITIVE_DOSE_OUT_OF_SPEC (WATER_CONDITIONING allows anticaking_ppm in [0,0])"
            - "neither call creates a TreatmentBatch row: GET /salt/treatment-batches?production_run_id=${run_id} -> total_count == 0"
            - "ProductionRun.${run_id}.open_batch_count == 0 and status is still HOISTED"

      - name: panel_reserve_and_panel_state_guards_reject_an_oversized_run_and_a_repeat_develop
        claim_type: triggerability
        grounds:
          - errors[ERR_PANEL_RESERVE_EXCEEDED]
          - errors[ERR_PANEL_INVALID_STATE]
          - "validations[priority=33]"
          - "validations[priority=13]"
          - calculations.panel_recoverable_tons
        distinguishing_aspect: |
          A 50001 t run over a 72 h window has an hourly rate of 694.4583, comfortably inside the
          1000.00 t/h mine capacity, so the only thing that can reject it is the panel's own
          50000.00 t reserve — this isolates priority 33 from priority 31. The second call proves the
          panel lifecycle is not idempotent: develop on an already PRODUCING panel is a 409, not a
          no-op 200.
        test_recipe:
          setup:
            - "Mine rated 24000 t/day with PRODUCING panel P-1 whose recoverable_tons is exactly 50000.00 (100000 t in place, 50 % extraction, grade tier 1.00 at 96.00 %, no insolubles penalty at 2.00 %)."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id", recov: "$.data.recoverable_tons" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
          trigger:
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 50001, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-05T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 50000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-05T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id", rate: "$.data.planned_tons_per_hour" }
          assert:
            - "${recov} == 50000.00"
            - "call 1 -> HTTP 409 with error code ERR_PANEL_RESERVE_EXCEEDED (0 + 50001 > 50000.00), NOT ERR_HOIST_CAPACITY_EXCEEDED"
            - "call 2 -> HTTP 409 with error code ERR_PANEL_INVALID_STATE (develop requires PLANNED)"
            - "call 3 -> HTTP 201 with ${rate} == 694.4444 for 50000 t over 72 h, proving the reserve edge is inclusive and that Mine.version was never consumed by the two rejected calls"
            - "Panel.${panel_id}.panel_state is still PRODUCING and Mine.${mine_id}.producing_panel_count == 1"

      - name: lot_and_shipment_guards_reject_five_distinct_illegal_moves
        claim_type: triggerability
        grounds:
          - errors[ERR_INSUFFICIENT_LOT_TONS]
          - errors[ERR_PRODUCT_LINE_MISMATCH]
          - errors[ERR_SHIPMENT_INVALID_STATE]
          - errors[ERR_LOT_QUARANTINED]
          - errors[ERR_BATCH_QC_ALREADY_DECIDED]
          - "validations[priority=35]"
          - "validations[priority=29]"
          - "validations[priority=15]"
          - "validations[priority=19]"
          - "validations[priority=16]"
        distinguishing_aspect: |
          Five different guards fire against the same 940.00 t covered lot, each isolated to exactly
          one cause: one ton too many, a destination storage kind that does not match the lot's own,
          a receive on a shipment that has not been loaded, a shipment against a quarantined lot, and
          a second QC decision on a batch that is already PASSED. Sharing one fixture makes the
          error codes mutually distinguishing rather than each merely "some 409".
        test_recipe:
          setup:
            - "A 940.00 t COVERED HIGHWAY_DEICING lot at Syracuse Depot from a PASSED batch, plus a Rochester destination depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Rochester Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 400, outbound_freight_rate_per_ton: 8.000 }
              as: LogisticsPlanner
              captures: { depot_b: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 941, load_window_start: "2026-08-05T08:00:00Z", load_window_end: "2026-08-05T09:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 400, load_window_start: "2026-08-05T08:00:00Z", load_window_end: "2026-08-05T09:00:00Z", destination_storage_kind: "OPEN_PAD" }
              as: LogisticsPlanner
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 400, load_window_start: "2026-08-05T08:00:00Z", load_window_end: "2026-08-05T09:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { ship_id: "$.data.id" }
            - call: "POST /salt/shipments/${ship_id}/receive"
              payload: {}
              as: DepotManager
              as_user_id: "${depot_b}"
            - call: "POST /salt/stockpile-lots/${lot_id}/quarantine-state"
              payload: { quarantine: true, quarantine_reason: "suspected clay contamination in the north face" }
              as: QualityLab
              as_user_id: "ql-checker-1"
              captures: { lstate: "$.data.lot_state" }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 100, load_window_start: "2026-08-06T08:00:00Z", load_window_end: "2026-08-06T09:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "FAIL" }
              as: QualityLab
              as_user_id: "ql-checker-1"
          assert:
            - "call 1 -> HTTP 409 ERR_INSUFFICIENT_LOT_TONS (941 > tons_available 940.00)"
            - "call 2 -> HTTP 409 ERR_PRODUCT_LINE_MISMATCH (destination_storage_kind OPEN_PAD != the lot's COVERED)"
            - "call 3 -> HTTP 201 with status PLANNED"
            - "call 4 -> HTTP 409 ERR_SHIPMENT_INVALID_STATE (receive requires LOADED)"
            - "call 5 -> HTTP 200 with ${lstate} == QUARANTINED and tons_on_hand still 940.00"
            - "call 6 -> HTTP 409 ERR_LOT_QUARANTINED (the 08-06 window is far outside the PLANNED shipment's buffered bay block, so it is not a bay conflict)"
            - "call 7 -> HTTP 409 ERR_BATCH_QC_ALREADY_DECIDED"
            - "StockpileLot.${lot_id}.tons_on_hand == 940.00 and tons_reserved == 0 — none of the rejected calls moved tonnage"
            - "GET /salt/shipments?origin_depot_id=${depot_a} -> total_count == 1"

      - name: depleted_lot_cannot_change_its_quarantine_state
        claim_type: triggerability
        grounds:
          - errors[ERR_LOT_STATE_INVALID]
          - "validations[priority=19]"
          - state_machines.StockpileLot.AVAILABLE_to_DEPLETED
        distinguishing_aspect: |
          ERR_LOT_STATE_INVALID is reachable only through the quarantine endpoint on a lot that is
          neither AVAILABLE nor QUARANTINED, which requires actually draining a lot to zero first:
          shipping all 940.00 t auto-depletes the origin lot, and only then does the quarantine call
          return ERR_LOT_STATE_INVALID rather than ERR_LOT_QUARANTINED.
        test_recipe:
          setup:
            - "A 940.00 t covered lot at Syracuse Depot and a Rochester depot; a 940 t TRUCK shipment is loaded and received, draining the origin lot to zero."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Rochester Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 400, outbound_freight_rate_per_ton: 8.000 }
