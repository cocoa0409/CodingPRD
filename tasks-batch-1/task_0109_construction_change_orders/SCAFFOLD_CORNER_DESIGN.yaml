              as_user_id: "gc-1"
            - call: "POST /change-orders"
              payload: { project_id: "${proj}", co_number: "CO-1", change_order_amount_cents: 50000, line_edits: [ { action: "ADD", item_no: "003", description: "X", scheduled_value_delta_cents: 50000 } ] }
              as: Contractor
              as_user_id: "gc-1"
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /change-orders/${co1}/approve"
              payload: { expected_project_version: "${pv_stale}" }
              as: Owner
              as_user_id: "owner-1"
          trigger:
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv_stale}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response error_id == ERR_STALE_PROJECT_VERSION  (stale version: project advanced from 1 to 2 by the CO approval)"

      - name: occ_stale_project_version_on_retention_release_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[retention-release-create-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: "Creating a RetentionRelease with expected_project_version stale (a prior certify bumped version) returns 412 ERR_STALE_PROJECT_VERSION on the second OCC-guarded create endpoint."
        test_recipe:
          setup:
            - "Project + SOV; PayApplication 1 certified (version advanced 1 -> 2); client still holds version 1."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "OccRR", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv_stale: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv_stale}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
          trigger:
            - call: "POST /retention-releases"
              payload: { project_id: "${proj}", amount_cents: 5000, expected_project_version: "${pv_stale}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response error_id == ERR_STALE_PROJECT_VERSION"

      - name: occ_correct_version_pay_app_create_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payapp-create-stale-project]
          - entities.PayApplication.fields.expected_project_version
        distinguishing_aspect: "Creating a PayApplication with the current expected_project_version (freshly read) succeeds with 201 and DRAFT status."
        test_recipe:
          setup:
            - "Project + SOV; client reads current version."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "OccOk", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { pv_cur: $.data.version }
          trigger:
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv_cur}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "PayApplication.status == DRAFT"

      - name: certify_bumps_project_version_derived_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Project.fields.total_completed_and_stored_cents
          - entities.Project.fields.retainage_held_cents
        excluded_because:
          difficulty_instance: transitive_cascade / payapp_certify_cascade_sovline_then_project_depth3
          rationale: "The certify cascade's recompute of Project.total_completed_and_stored_cents (450000) and retainage_held_cents (45000) is asserted there."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_revised_sum_after_co_approve
        claim_type: immediate
        grounds:
          - entities.Project.fields.revised_contract_sum_cents
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_approve_cascade_sovline_then_revised_sum_depth3
          rationale: "The approve response and subsequent project read both show revised_contract_sum_cents 1150000 in the same flow — immediate visibility is covered there."
