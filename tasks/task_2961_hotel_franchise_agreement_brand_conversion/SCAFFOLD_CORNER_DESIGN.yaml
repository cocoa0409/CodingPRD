      - name: declined_application_is_terminal_and_needs_no_review_to_decline
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Application.status
          - validations[priority=8]
          - endpoints[POST /applications/{id}/decision]
        distinguishing_aspect: "DECLINE is the one decision that carries no review gates: it is accepted straight out of UNDER_REVIEW with financial_review_status NOT_STARTED and impact_study_status NOT_STARTED, where APPROVE would be refused by priority 38 and priority 39. The resulting DECLINED state is terminal, so revision, resubmission and drafting all return ERR_APPLICATION_STAGE_INVALID, and the brand's open pipeline is released exactly as it is on approval."
        test_recipe:
          setup:
            - "One brand, one owner and one application moved to UNDER_REVIEW on 2026-08-01 with neither review axis started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
