              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SUPERSEDE_TARGET_INVALID"
            - "error_id != ERR_ENDORSEMENT_NOT_FOUND"
            - "Endorsement.${second_endorsement_id}.status is still DRAFT"
            - "Endorsement.${endorsement_id}.status is still DRAFT — it was not swept to VOIDED"
            - "Policy.${policy_id}.gross_premium_cents is still 1000000"

