# =============================================================================
# University Research Funding Management System — Scaffold (v1)
# =============================================================================

scenario: |
  University research funding management system: project initiation with proposal
  submission, peer review, funding source classification (national/provincial/
  enterprise-commissioned/internal), approval workflow, and project code
  assignment; budget preparation and adjustment with category-level budget items
  (personnel/equipment/materials/travel/conference/outsourcing), funding-agency
  rule validation, mid-term adjustment application, multi-level approval, and
  adjustment history tracking; reimbursement approval chain with invoice
  authenticity check, budget category matching, attachment completeness
  validation, project-leader/department/finance multi-level review, and
  rejection-rework handling; expense compliance check with rule-based
  pre-screening (per-diem standards, equipment threshold, conflict-of-interest
  detection, sole-source procurement justification), agency-specific rule
  mapping, and exception escalation; project closing audit with deliverable
  submission, expense final account, budget execution rate analysis, residual
  fund handling, and audit-finding rectification; indirect cost allocation with
  allocation-base configuration (direct cost/personnel cost/floor area),
  allocation rate by funding source, multi-project sharing rules, and periodic
  recalculation; event-driven synchronization with finance, procurement, HR, and
  funding-agency reporting systems; audit logging for budget changes and
  reimbursement records.

domain_name: research-funding
api_prefix: /projects

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic       # reimbursement reject-rework cycles, budget adjustment loops
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                   # AuditLog references budget-change OR reimbursement records
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0  Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1  Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Project title (1..200 chars)" }
      - { name: principal_investigator_id, type: string, source: input, description: "User id of the PI; must equal X-User-ID at creation" }
      - { name: department_id, type: string, source: input, description: "Department id (opaque string)" }
      - { name: funding_source, type: enum, source: input, description: "NATIONAL | PROVINCIAL | ENTERPRISE | INTERNAL", constraints: "Determines indirect_cost_rate and per-diem cap rule" }
      - { name: proposal_text, type: string, source: input, description: "Proposal abstract (>=200 chars at submission)" }
      - { name: requested_amount, type: number, source: input, description: "Requested total funding in CNY, non-negative, two decimal places" }
      - { name: project_code, type: string, source: computed, description: "Assigned on APPROVED transition; null until then. Format: <YYYY>-<SOURCE_ABBR>-<SEQ04> e.g. 2026-NTL-0007" }
      - { name: planned_start_date, type: integer, source: input, description: "Unix epoch seconds; must be >= now() at submission" }
      - { name: planned_end_date, type: integer, source: input, description: "Unix epoch seconds; must be > planned_start_date" }
      - { name: total_budget, type: number, source: computed, description: "Sum of approved BudgetItem.approved_amount; recomputed on every budget approval" }
      - { name: total_reimbursed, type: number, source: computed, description: "Sum of Reimbursement.amount for status==PAID; refreshed on PAID transition" }
      - { name: indirect_cost_amount, type: number, source: computed, description: "Latest IndirectCostAllocation.allocated_amount for this project; null until first allocation run" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | ACTIVE | CLOSING | CLOSED | REJECTED" }
      - { name: closing_findings_count, type: integer, source: computed, description: "Number of audit_findings on the latest ClosingAudit, 0 until audit submitted" }

  - name: PeerReview
    parent: null
    common_fields: false             # immutable append-only
    fields:
      - { name: project_id, type: string, source: input, description: "FK to Project" }
      - { name: reviewer_id, type: string, source: input, description: "Opaque reviewer user id" }
      - { name: score, type: integer, source: input, description: "Score 0..100" }
      - { name: recommendation, type: enum, source: input, description: "APPROVE | REJECT | REVISE" }
      - { name: comments, type: string, source: input, description: "Free-text comments" }

  - name: BudgetItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK to Project" }
      - { name: category, type: enum, source: input, description: "PERSONNEL | EQUIPMENT | MATERIALS | TRAVEL | CONFERENCE | OUTSOURCING" }
      - { name: requested_amount, type: number, source: input, description: "Originally requested amount, CNY, two decimals, > 0" }
      - { name: approved_amount, type: number, source: computed, description: "Equals requested_amount when project APPROVED; mutated only via accepted BudgetAdjustment" }
      - { name: spent_amount, type: number, source: computed, description: "Sum of paid Reimbursement.amount where reimbursement.budget_item_id == this.id" }
      - { name: remaining_amount, type: number, source: computed, description: "approved_amount - spent_amount" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | LOCKED (LOCKED when project enters CLOSING)" }

  - name: BudgetAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK to Project" }
      - { name: line_changes, type: array, source: input, description: "Array of {budget_item_id, delta_amount}; delta sum across array MUST equal 0 (zero-sum reallocation)" }
      - { name: justification, type: string, source: input, description: "Reason for adjustment, >=20 chars" }
      - { name: pi_decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: dept_decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: finance_decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: pinned_budget_versions, type: array, source: system, description: "Map {budget_item_id: version} captured when adjustment is submitted; revalidated at finance approval" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | REJECTED" }

  - name: Reimbursement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK to Project" }
      - { name: budget_item_id, type: string, source: input, description: "FK to BudgetItem; category MUST match expense_category" }
      - { name: expense_category, type: enum, source: input, description: "Same enum as BudgetItem.category" }
      - { name: amount, type: number, source: input, description: "Reimbursement amount in CNY, > 0, two decimals" }
      - { name: invoice_number, type: string, source: input, description: "Unique per project (case-insensitive)" }
      - { name: invoice_date, type: integer, source: input, description: "Unix epoch seconds; must be within project planned_start_date..now()" }
      - { name: invoice_authenticated, type: boolean, source: input, description: "Client-supplied authenticity flag from external invoice system" }
      - { name: attachments, type: array, source: input, description: "Array of {filename, kind} objects; required kinds INVOICE and RECEIPT must both be present" }
      - { name: vendor_id, type: string, source: input, description: "Vendor identifier; checked against PI/department in CoI screening" }
      - { name: pi_decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: dept_decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: finance_decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Filled by latest reviewer that REJECTed; cleared on resubmission" }
      - { name: rework_count, type: integer, source: computed, description: "Increments by 1 on each REWORK transition; capped at 3 (4th rework attempt blocked)" }
      - { name: compliance_findings, type: array, source: computed, description: "List of {rule_id, severity} from compliance pre-screen at SUBMITTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | PAID | REJECTED" }

  - name: ClosingAudit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK to Project; one-to-one (only one ClosingAudit per project)" }
      - { name: deliverables, type: array, source: input, description: "Array of {title, kind, url}; kinds REPORT and DATASET both required" }
      - { name: residual_fund_action, type: enum, source: input, description: "RETURN | REALLOCATE | CARRYOVER; allowed values vary by funding_source (see calc residual_fund_policy)" }
      - { name: audit_findings, type: array, source: input, description: "Array of {finding_id, severity, description, rectified}; severity in {LOW, MEDIUM, HIGH}" }
      - { name: budget_execution_rate, type: number, source: computed, description: "total_reimbursed / total_budget at audit submission; range 0.0..1.0+; chronological variant differs (see calculations)" }
      - { name: forward_execution_rate, type: number, source: computed, description: "Forward-looking variant: (total_reimbursed + sum of UNDER_REVIEW pending reimbursements) / total_budget" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RECTIFICATION_REQUIRED | CLOSED" }

  - name: IndirectCostAllocation
    parent: null
    common_fields: false             # immutable allocation snapshot per run
    fields:
      - { name: allocation_run_id, type: string, source: system, description: "Groups allocations from a single recalculation run; uuid" }
      - { name: project_id, type: string, source: system, description: "FK to Project" }
      - { name: allocation_base, type: enum, source: input, description: "DIRECT_COST | PERSONNEL_COST | FLOOR_AREA; pinned at run time" }
      - { name: allocation_rate, type: number, source: computed, description: "Funding-source-driven rate (see calc indirect_cost_rate)" }
      - { name: base_value, type: number, source: computed, description: "Project's value of allocation_base at run time (e.g., direct cost = total_reimbursed of non-OUTSOURCING categories)" }
      - { name: shared_share, type: number, source: computed, description: "Share weight when allocation_base totals across all ACTIVE projects must sum to the global pool (waterfall remainder absorbed by largest project)" }
      - { name: allocated_amount, type: number, source: computed, description: "Final allocated indirect cost in CNY, two decimals" }

  - name: ComplianceRule
    parent: null
    common_fields: true
    fields:
      - { name: rule_code, type: string, source: input, description: "Unique short code, e.g., PER_DIEM_CAP, EQUIP_THRESHOLD, COI, SOLE_SOURCE_JUSTIFICATION" }
      - { name: applies_to_funding_source, type: enum, source: input, description: "NATIONAL | PROVINCIAL | ENTERPRISE | INTERNAL | ALL" }
      - { name: applies_to_category, type: enum, source: input, description: "PERSONNEL | EQUIPMENT | MATERIALS | TRAVEL | CONFERENCE | OUTSOURCING | ALL" }
      - { name: parameters, type: object, source: input, description: "JSON object — e.g., {threshold_amount: 50000} for EQUIP_THRESHOLD, {daily_cap: 800} for PER_DIEM_CAP" }
      - { name: severity, type: enum, source: input, description: "BLOCK | ESCALATE | WARN; BLOCK rejects, ESCALATE flags compliance_findings, WARN logs only" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the rule participates in pre-screen" }

  - name: AuditLog
    parent: null
    common_fields: false             # append-only event log
    fields:
      - { name: subject_type, type: enum, source: system, description: "BUDGET_ITEM | BUDGET_ADJUSTMENT | REIMBURSEMENT (polymorphic; AuditLog rows reference one of these subjects)" }
      - { name: subject_id, type: string, source: system, description: "id of subject record" }
      - { name: action, type: enum, source: system, description: "CREATE | UPDATE | APPROVE | REJECT | REWORK | PAY | LOCK | ADJUST" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at the time of the event" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at the time of the event" }
      - { name: before_snapshot, type: object, source: system, description: "Field-level pre-image (status, amounts) for budget changes/reimbursements" }
      - { name: after_snapshot, type: object, source: system, description: "Field-level post-image" }
      - { name: occurred_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }

# =============================================================================
# §1.2  State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /projects/{projectId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "proposal_text length >= 200 (ERR_PROPOSAL_TOO_SHORT)"
          - "planned_end_date > planned_start_date (ERR_INVALID_DATE_RANGE)"
          - "planned_start_date >= now() (ERR_START_IN_PAST)"
          - "X-User-ID equals principal_investigator_id (ERR_NOT_PROJECT_OWNER)"
        side_effects:
          - "status → UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /projects/{projectId}/approve"
        actor: ResearchAdmin
        preconditions:
          - "At least 3 PeerReview rows exist for the project (ERR_INSUFFICIENT_REVIEWS)"
          - "Number of PeerReview rows with recommendation==APPROVE strictly greater than rows with recommendation==REJECT (ERR_REVIEW_CONSENSUS_NOT_MET)"
        side_effects:
          - "status → APPROVED"
          - "Mint project_code = <YYYY of now()>-<SOURCE_ABBR>-<SEQ04>; SEQ04 is a four-digit zero-padded counter monotonically increasing per (year, source) starting at 0001"
          - "All BudgetItem rows for this project transition PENDING → APPROVED with approved_amount = requested_amount"
          - "Refresh Project.total_budget"
          - "Append AuditLog rows (one per BudgetItem) with action=APPROVE"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /projects/{projectId}/reject"
        actor: ResearchAdmin
        preconditions:
          - "At least 3 PeerReview rows exist for the project (ERR_INSUFFICIENT_REVIEWS)"
        side_effects:
          - "status → REJECTED"
          - "All BudgetItem rows remain in PENDING state (terminal for this project)"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /projects/{projectId}/activate"
        actor: ResearchAdmin
        preconditions:
          - "now() >= planned_start_date (ERR_PROJECT_NOT_YET_STARTED)"
        side_effects:
          - "status → ACTIVE"

      - from: ACTIVE
        to: CLOSING
        trigger: "POST /projects/{projectId}/begin-closing"
        actor: PrincipalInvestigator
        preconditions:
          - "X-User-ID equals principal_investigator_id (ERR_NOT_PROJECT_OWNER)"
          - "No Reimbursement in status SUBMITTED or UNDER_REVIEW (ERR_OPEN_REIMBURSEMENTS_EXIST)"
        side_effects:
          - "status → CLOSING"
          - "All BudgetItem rows: status → LOCKED (no new BudgetAdjustment or Reimbursement permitted)"

      - from: CLOSING
        to: CLOSED
        trigger: "system (automatic when ClosingAudit transitions to CLOSED)"
        actor: system
        preconditions:
          - "ClosingAudit.status == CLOSED for this project"
        side_effects:
          - "status → CLOSED"
          - "Run final IndirectCostAllocation snapshot and write Project.indirect_cost_amount"

  - entity: BudgetAdjustment
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /budget-adjustments/{adjustmentId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Project.status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "Sum of line_changes[*].delta_amount == 0 within 0.01 tolerance (ERR_ADJUSTMENT_NOT_ZERO_SUM)"
          - "For each line: BudgetItem.approved_amount + delta_amount >= 0 (ERR_NEGATIVE_BUDGET)"
          - "justification length >= 20 (ERR_JUSTIFICATION_TOO_SHORT)"
        side_effects:
          - "status → UNDER_REVIEW; pi_decision = APPROVED"
          - "pinned_budget_versions captured = {bi.id: bi.version for each affected BudgetItem}"

      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /budget-adjustments/{adjustmentId}/dept-approve"
        actor: DepartmentApprover
        preconditions:
          - "dept_decision == PENDING (ERR_ALREADY_DECIDED)"
        side_effects:
          - "dept_decision = APPROVED"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /budget-adjustments/{adjustmentId}/finance-approve"
        actor: FinanceOfficer
        preconditions:
          - "dept_decision == APPROVED (ERR_DEPT_DECISION_PENDING)"
          - "For each line, the current BudgetItem.version == pinned_budget_versions[budget_item_id] (ERR_STALE_BUDGET_VERSION)"
          - "Per-line agency rule revalidation passes (ERR_AGENCY_RULE_VIOLATION)"
        side_effects:
          - "status → APPROVED; finance_decision = APPROVED"
          - "Apply each delta to BudgetItem.approved_amount (mutates approved budget)"
          - "Each affected BudgetItem.version increments by 1; updated_at refreshed"
          - "Refresh Project.total_budget"
          - "Append AuditLog (subject_type=BUDGET_ITEM) per affected line with before/after snapshots"
          - "Append AuditLog (subject_type=BUDGET_ADJUSTMENT, action=ADJUST)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /budget-adjustments/{adjustmentId}/reject"
        actor: DepartmentApprover | FinanceOfficer
        preconditions: []
        side_effects:
          - "status → REJECTED; the deciding role's *_decision = REJECTED"
          - "No mutation to BudgetItem"

  - entity: Reimbursement
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reimbursements/{reimbursementId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Project.status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "BudgetItem.status == APPROVED (ERR_BUDGET_NOT_APPROVED)"
          - "expense_category == BudgetItem.category (ERR_CATEGORY_MISMATCH)"
          - "invoice_authenticated == true (ERR_INVOICE_NOT_AUTHENTIC)"
          - "attachments include both kind=INVOICE and kind=RECEIPT (ERR_ATTACHMENTS_INCOMPLETE)"
          - "rework_count <= 3 (ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects:
          - "status → SUBMITTED"
          - "Run compliance pre-screen (calc compliance_findings); if any BLOCK severity finding, transition rolls back to DRAFT and operation fails with ERR_COMPLIANCE_BLOCK"
          - "Set rejection_reason = null"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /reimbursements/{reimbursementId}/pi-approve"
        actor: PrincipalInvestigator
        preconditions:
          - "X-User-ID equals Project.principal_investigator_id (ERR_NOT_PROJECT_OWNER)"
          - "compliance_findings does NOT contain a finding with severity ESCALATE that lacks a sole-source justification override (ERR_ESCALATION_PENDING)"
        side_effects:
          - "status → UNDER_REVIEW; pi_decision = APPROVED"

      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /reimbursements/{reimbursementId}/dept-approve"
        actor: DepartmentApprover
        preconditions:
          - "pi_decision == APPROVED (ERR_PI_DECISION_PENDING)"
        side_effects:
          - "dept_decision = APPROVED"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reimbursements/{reimbursementId}/finance-approve"
        actor: FinanceOfficer
        preconditions:
          - "dept_decision == APPROVED (ERR_DEPT_DECISION_PENDING)"
          - "BudgetItem.remaining_amount >= amount (ERR_BUDGET_INSUFFICIENT)"
        side_effects:
          - "status → APPROVED; finance_decision = APPROVED"

      - from: APPROVED
        to: PAID
        trigger: "POST /reimbursements/{reimbursementId}/mark-paid"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "status → PAID"
          - "BudgetItem.spent_amount += amount; BudgetItem.remaining_amount recomputed; BudgetItem.version increments; updated_at refreshed"
          - "Project.total_reimbursed += amount"
          - "Append AuditLog (subject_type=REIMBURSEMENT, action=PAY)"
          - "Append AuditLog (subject_type=BUDGET_ITEM, action=UPDATE) capturing the spent_amount delta"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /reimbursements/{reimbursementId}/rework"
        actor: PrincipalInvestigator
        preconditions:
          - "rework_count < 3 (ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects:
          - "status → DRAFT (cycle: DRAFT → SUBMITTED → DRAFT)"
          - "rework_count += 1"
          - "Reset pi_decision/dept_decision/finance_decision to PENDING"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /reimbursements/{reimbursementId}/reject"
        actor: DepartmentApprover | FinanceOfficer
        preconditions:
          - "rework_count < 3 (ERR_REWORK_LIMIT_EXCEEDED)"
          - "rejection_reason is provided in body (ERR_REJECTION_REASON_REQUIRED)"
        side_effects:
          - "status → DRAFT (rejection-rework loop)"
          - "the deciding role's *_decision = REJECTED"
          - "rework_count += 1"
          - "rejection_reason set from body"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (automatic when rework_count == 3 and a reject is attempted)"
        actor: system
        preconditions:
          - "rework_count == 3"
        side_effects:
          - "status → REJECTED (terminal)"

  - entity: ClosingAudit
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /closing-audits/{auditId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Project.status == CLOSING (ERR_PROJECT_NOT_CLOSING)"
          - "deliverables include both kind=REPORT and kind=DATASET (ERR_DELIVERABLES_INCOMPLETE)"
          - "residual_fund_action permitted by funding_source (ERR_RESIDUAL_ACTION_NOT_ALLOWED) — see calc residual_fund_policy"
        side_effects:
          - "status → SUBMITTED"
          - "Compute budget_execution_rate (chronological)"
          - "Compute forward_execution_rate (forward_looking)"

      - from: SUBMITTED
        to: RECTIFICATION_REQUIRED
        trigger: "POST /closing-audits/{auditId}/flag-rectification"
        actor: AuditOfficer
        preconditions:
          - "audit_findings contains at least one entry with severity==HIGH (ERR_NO_HIGH_FINDINGS)"
        side_effects:
          - "status → RECTIFICATION_REQUIRED"

      - from: RECTIFICATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /closing-audits/{auditId}/resubmit"
        actor: PrincipalInvestigator
        preconditions:
          - "All audit_findings entries with severity==HIGH have rectified==true (ERR_HIGH_FINDINGS_NOT_RECTIFIED)"
        side_effects:
          - "status → SUBMITTED (cycle)"

      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /closing-audits/{auditId}/close"
        actor: AuditOfficer
        preconditions:
          - "All audit_findings entries with severity in {MEDIUM, HIGH} have rectified==true (ERR_FINDINGS_NOT_RECTIFIED)"
        side_effects:
          - "status → CLOSED"
          - "Project automatic transition CLOSING → CLOSED (cascade)"
          - "Run final IndirectCostAllocation for the project (cascade)"
          - "Update Project.indirect_cost_amount with the resulting allocated_amount"

# =============================================================================
# §1.2.1  Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two users approve the same BudgetAdjustment at the finance step concurrently"
    guarantee: "At most one finance-approve succeeds; the second is rejected because status already advanced"
    error_id: ERR_ALREADY_DECIDED
    http_status: 409
    serialization: "First-writer-wins on BudgetAdjustment.status"

  - scenario: "Finance approves a BudgetAdjustment while another adjustment on the same BudgetItem mutates approved_amount"
    guarantee: "The later finance-approve is rejected because pinned_budget_versions no longer match BudgetItem.version"
    error_id: ERR_STALE_BUDGET_VERSION
    http_status: 409
    serialization: "Version-pinning OCC on each affected BudgetItem; first finance-approve to commit wins"

  - scenario: "Two concurrent mark-paid calls on the same Reimbursement"
    guarantee: "At most one PAID transition; second call rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Reimbursement.status"

  - scenario: "Two concurrent project approvals of different projects with the same funding_source in the same calendar year compete for the next sequence number"
    guarantee: "Each project receives a distinct project_code; sequence is monotonic per (year, source)"
    error_id: ERR_PROJECT_CODE_COLLISION
    http_status: 409
    serialization: "Sequence counter is server-minted under a per-(year,source) lock; loser retries internally; if retry exhausted, error returned"

  - scenario: "Reimbursement finance-approve and BudgetAdjustment finance-approve on the same BudgetItem race"
    guarantee: "Whichever commits second sees an updated remaining_amount; if it would now exceed remaining, it is rejected"
    error_id: ERR_BUDGET_INSUFFICIENT
    http_status: 409
    serialization: "BudgetItem.version OCC; second writer revalidates remaining_amount before commit"

# =============================================================================
# §1.3  Calculation Rules Table
# =============================================================================
calculations:
  - name: budget_execution_rate
    trigger: "ClosingAudit submit"
    algorithm: chronological
    formula: |
      # Chronological variant — only finalized (PAID) reimbursements count, in the order they were paid.
      # Two valid interpretations of the prose collapse to ONE pinned definition here:
      #   denominator pin: total_budget = sum of BudgetItem.approved_amount AS OF audit submission time
      #                    (NOT the originally requested amount).
      numer = sum of Reimbursement.amount where status == PAID and project_id == this.project_id
      denom = sum of BudgetItem.approved_amount where project_id == this.project_id
      if denom == 0:
        budget_execution_rate = 0.0
      else:
        budget_execution_rate = round(numer / denom, 4)
    input_set: "PAID reimbursements only; APPROVED+LOCKED budget items only"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "Computed as forward_execution_rate on the same ClosingAudit"
        difference: |
          numer also adds Reimbursement.amount for status IN {SUBMITTED, UNDER_REVIEW, APPROVED}.
          For identical project state with one PAID (1000) and one UNDER_REVIEW (500) against
          total_budget=2000, chronological yields 0.5000 while forward_looking yields 0.7500.

  - name: indirect_cost_rate
    trigger: "IndirectCostAllocation run (POST /allocation-runs) and on ClosingAudit close cascade"
    algorithm: tiered_pricing
    formula: |
      # Tiered rate by funding_source AND allocation_base interaction (≥3 inputs, non-linear).
      # Pinned RATE_TABLE[funding_source][allocation_base] = rate (decimal).
      RATE_TABLE = {
        NATIONAL:   {DIRECT_COST: 0.20, PERSONNEL_COST: 0.25, FLOOR_AREA: 0.15},
        PROVINCIAL: {DIRECT_COST: 0.15, PERSONNEL_COST: 0.18, FLOOR_AREA: 0.12},
        ENTERPRISE: {DIRECT_COST: 0.10, PERSONNEL_COST: 0.12, FLOOR_AREA: 0.08},
        INTERNAL:   {DIRECT_COST: 0.05, PERSONNEL_COST: 0.06, FLOOR_AREA: 0.04},
      }
      rate = RATE_TABLE[project.funding_source][allocation.allocation_base]
      # Threshold tier: if project.total_budget > LARGE_PROJECT_THRESHOLD, rate is reduced by 0.02 (floor 0.0)
      if project.total_budget > LARGE_PROJECT_THRESHOLD:
        rate = max(0.0, rate - 0.02)
    input_set: "Project.funding_source, IndirectCostAllocation.allocation_base, Project.total_budget"
    constants:
      LARGE_PROJECT_THRESHOLD: 1000000
    precision: "4 decimal places, round_half_up"

  - name: indirect_cost_amount
    trigger: "IndirectCostAllocation run; cascade from ClosingAudit close"
    algorithm: waterfall_allocation
    formula: |
      # Per project allocated amount, with multi-project sharing (waterfall).
      # Step 1: base_value pinned by allocation_base:
      #   DIRECT_COST    -> sum of Reimbursement.amount where status==PAID AND budget_item.category != OUTSOURCING
      #   PERSONNEL_COST -> sum of Reimbursement.amount where status==PAID AND budget_item.category == PERSONNEL
      #   FLOOR_AREA     -> Project.floor_area_sqm  (input parameter at run time, default 100 if absent)
      # Step 2: raw = base_value * indirect_cost_rate
      # Step 3: shared_share — when multiple ACTIVE projects share an OUTSOURCING vendor, the global pool
      #   is the sum of raw across all in-run projects, capped at GLOBAL_INDIRECT_POOL.
      #   Distribute capped pool across projects in DESCENDING order of raw amount (ranking expression),
      #   tie-break by lexicographic project_id ASC. Each project receives min(raw, remaining_pool).
      #   Rounding remainder accrues to the FIRST (largest) project (waterfall remainder rule).
      # allocated_amount = round(allocated_share, 2)
    input_set: "Projects with status==ACTIVE OR status==CLOSING at run time; allocation_base pinned per run; PAID reimbursements only"
    constants:
      GLOBAL_INDIRECT_POOL: 5000000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: periodic_recalculation
        when: "Triggered on POST /allocation-runs without a project filter"
        difference: |
          Spans every ACTIVE/CLOSING project; appends one IndirectCostAllocation row per project under a
          shared allocation_run_id. CLOSING-cascade variant runs scoped to a single project and uses the
          previous run's pool remainder as ceiling (different shared_share semantics).

  - name: per_diem_compliance_check
    trigger: "Reimbursement submit (compliance pre-screen)"
    algorithm: threshold
    formula: |
      # Boundary precision: amount STRICTLY GREATER than daily_cap triggers ESCALATE.
      # Equality (amount == daily_cap) is allowed.
      if Reimbursement.expense_category == TRAVEL:
        rule = ComplianceRule[rule_code=PER_DIEM_CAP, applies_to_funding_source=Project.funding_source OR ALL]
        cap = rule.parameters.daily_cap
        if Reimbursement.amount > cap:
          findings.append({rule_id: 'PER_DIEM_CAP', severity: 'ESCALATE'})
    input_set: "TRAVEL category reimbursements only"
    constants: {}

  - name: equipment_threshold_check
    trigger: "Reimbursement submit (compliance pre-screen)"
    algorithm: threshold
    formula: |
      # Boundary precision: amount >= threshold_amount triggers ESCALATE; (greater-than-or-equal, strict <).
      if Reimbursement.expense_category == EQUIPMENT:
        rule = ComplianceRule[rule_code=EQUIP_THRESHOLD, applies_to_funding_source=Project.funding_source OR ALL]
        threshold = rule.parameters.threshold_amount
        if Reimbursement.amount >= threshold:
          findings.append({rule_id: 'EQUIP_THRESHOLD', severity: 'ESCALATE'})
    input_set: "EQUIPMENT category reimbursements only"
    constants: {}

  - name: conflict_of_interest_check
    trigger: "Reimbursement submit (compliance pre-screen)"
    algorithm: aggregation
    formula: |
      # COI block rule — if vendor_id matches PI or department, BLOCK severity (rejects submission).
      if Reimbursement.vendor_id == Project.principal_investigator_id
         OR Reimbursement.vendor_id == Project.department_id:
        findings.append({rule_id: 'COI', severity: 'BLOCK'})
    input_set: "All categories"
    constants: {}

  - name: residual_fund_policy
    trigger: "ClosingAudit submit"
    algorithm: aggregation
    formula: |
      # Funding-source mapping table (combinatorial, ≥3 inputs, non-linear over funding_source × residual_fund_action × execution_rate).
      ALLOWED_BY_SOURCE = {
        NATIONAL:   {RETURN: True,  REALLOCATE: False, CARRYOVER: lambda er: er >= 0.95},
        PROVINCIAL: {RETURN: True,  REALLOCATE: False, CARRYOVER: lambda er: er >= 0.90},
        ENTERPRISE: {RETURN: False, REALLOCATE: True,  CARRYOVER: lambda er: True},
        INTERNAL:   {RETURN: True,  REALLOCATE: True,  CARRYOVER: lambda er: True},
      }
      allowed = ALLOWED_BY_SOURCE[project.funding_source][closing_audit.residual_fund_action]
      if isinstance(allowed, callable):
        allowed = allowed(closing_audit.budget_execution_rate)
      if not allowed:
        raise ERR_RESIDUAL_ACTION_NOT_ALLOWED
    input_set: "ClosingAudit.residual_fund_action, Project.funding_source, ClosingAudit.budget_execution_rate"
    constants: {}

  - name: project_code_minting
    trigger: "Project approve transition"
    algorithm: chronological
    formula: |
      # Pin order: (a) extract YYYY from now() UTC, (b) map source to SOURCE_ABBR table,
      # (c) atomically increment counter for (YYYY, source), (d) format SEQ as 4-digit zero-padded.
      SOURCE_ABBR = {NATIONAL: 'NTL', PROVINCIAL: 'PRV', ENTERPRISE: 'ENT', INTERNAL: 'INT'}
      year = strftime('%Y', now_utc)
      seq  = next_counter(year, project.funding_source)   # starts at 1, monotonic per (year, source)
      project_code = f'{year}-{SOURCE_ABBR[project.funding_source]}-{seq:04d}'
    input_set: "Project funding_source; per-(year, source) sequence counter"
    constants: {}
    precision: "exact"

# =============================================================================
# §1.4  Validation Rules Table (ordered)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-ID and X-User-Role headers must be present and non-empty",                                  error_id: ERR_MISSING_USER_CONTEXT,         http_status: 400, applies_to: all }
  - { priority: 2,  category: auth,                  check: "Role must be permitted to invoke the requested endpoint per RBAC matrix",                          error_id: ERR_INSUFFICIENT_PERMISSIONS,     http_status: 403, applies_to: all }
  - { priority: 3,  category: existence,             check: "Path resource ids must resolve to existing rows (validated left-to-right)",                         error_id: "ERR_*_NOT_FOUND (per resource)", http_status: 404, applies_to: "all path-id endpoints" }
  - { priority: 4,  category: state,                 check: "Target resource must be in correct state for the requested transition",                            error_id: ERR_INVALID_STATE,                http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 5,  category: state,                 check: "Project.status must be ACTIVE for new BudgetAdjustment.submit and Reimbursement.submit",            error_id: ERR_PROJECT_NOT_ACTIVE,           http_status: 409, applies_to: "POST /budget-adjustments/{id}/submit, POST /reimbursements/{id}/submit" }
  - { priority: 6,  category: business_safety,       check: "Reimbursement.invoice_authenticated must be true (BLOCK severity)",                                  error_id: ERR_INVOICE_NOT_AUTHENTIC,        http_status: 422, applies_to: "POST /reimbursements/{id}/submit" }
  - { priority: 7,  category: business_safety,       check: "Reimbursement.attachments must include kind=INVOICE AND kind=RECEIPT",                               error_id: ERR_ATTACHMENTS_INCOMPLETE,       http_status: 422, applies_to: "POST /reimbursements/{id}/submit" }
  - { priority: 8,  category: business_safety,       check: "Compliance pre-screen finds no BLOCK severity finding (e.g., COI vendor==PI)",                       error_id: ERR_COMPLIANCE_BLOCK,             http_status: 422, applies_to: "POST /reimbursements/{id}/submit" }
  - { priority: 9,  category: business_referential,  check: "Reimbursement.expense_category must equal BudgetItem.category",                                      error_id: ERR_CATEGORY_MISMATCH,            http_status: 422, applies_to: "POST /reimbursements (create), POST /reimbursements/{id}/submit" }
  - { priority: 10, category: business_constraint,   check: "BudgetAdjustment.line_changes deltas must sum to 0 within ±0.01",                                    error_id: ERR_ADJUSTMENT_NOT_ZERO_SUM,      http_status: 422, applies_to: "POST /budget-adjustments/{id}/submit" }
  - { priority: 11, category: business_constraint,   check: "BudgetAdjustment per-line: BudgetItem.approved_amount + delta_amount >= 0",                          error_id: ERR_NEGATIVE_BUDGET,              http_status: 422, applies_to: "POST /budget-adjustments/{id}/submit" }
  - { priority: 12, category: business_constraint,   check: "Reimbursement.rework_count <= 3 to attempt submission/rework/reject",                                error_id: ERR_REWORK_LIMIT_EXCEEDED,        http_status: 409, applies_to: "POST /reimbursements/{id}/submit, /rework, /reject" }
  - { priority: 13, category: business_constraint,   check: "Project approve requires >=3 PeerReview rows with APPROVE strictly outnumbering REJECT",             error_id: ERR_REVIEW_CONSENSUS_NOT_MET,     http_status: 409, applies_to: "POST /projects/{id}/approve" }
  - { priority: 14, category: business_temporal,     check: "Project planned_start_date >= now() at submit; activate requires now() >= planned_start_date",      error_id: ERR_PROJECT_NOT_YET_STARTED,      http_status: 409, applies_to: "POST /projects/{id}/submit, /activate" }
  - { priority: 15, category: business_temporal,     check: "Reimbursement.invoice_date within [Project.planned_start_date, now()]",                              error_id: ERR_INVOICE_DATE_OUT_OF_RANGE,    http_status: 422, applies_to: "POST /reimbursements (create)" }
  - { priority: 16, category: business_referential,  check: "BudgetAdjustment finance-approve revalidates BudgetItem.version against pinned_budget_versions",     error_id: ERR_STALE_BUDGET_VERSION,         http_status: 409, applies_to: "POST /budget-adjustments/{id}/finance-approve" }
  - { priority: 17, category: business_fiscal,       check: "BudgetItem.remaining_amount >= Reimbursement.amount at finance-approve",                             error_id: ERR_BUDGET_INSUFFICIENT,          http_status: 402, applies_to: "POST /reimbursements/{id}/finance-approve" }
  - { priority: 18, category: business_constraint,   check: "ClosingAudit.deliverables include BOTH kind=REPORT and kind=DATASET",                                error_id: ERR_DELIVERABLES_INCOMPLETE,      http_status: 422, applies_to: "POST /closing-audits/{id}/submit" }
  - { priority: 19, category: business_constraint,   check: "ClosingAudit.residual_fund_action allowed by funding_source × execution_rate",                       error_id: ERR_RESIDUAL_ACTION_NOT_ALLOWED,  http_status: 422, applies_to: "POST /closing-audits/{id}/submit" }
  - { priority: 20, category: business_constraint,   check: "ClosingAudit close requires all MEDIUM/HIGH audit_findings to have rectified==true",                 error_id: ERR_FINDINGS_NOT_RECTIFIED,       http_status: 409, applies_to: "POST /closing-audits/{id}/close" }
  - { priority: 21, category: business_constraint,   check: "Reimbursement.invoice_number must be unique per Project (case-insensitive)",                         error_id: ERR_DUPLICATE_INVOICE_NUMBER,     http_status: 409, applies_to: "POST /reimbursements (create)" }
  - { priority: 22, category: business_constraint,   check: "Pagination params: limit in [1,100], offset >= 0",                                                   error_id: ERR_INVALID_PAGINATION_PARAMETERS, http_status: 400, applies_to: "all list endpoints" }

# =============================================================================
# §1.5  API Endpoint Table
# =============================================================================
endpoints:
  # ------ Project lifecycle ------
  - { method: POST,  path: "/projects",                                   description: "Create a Project draft",                                roles: [PrincipalInvestigator],                  code: 201, input: [title, principal_investigator_id, department_id, funding_source, proposal_text, requested_amount, planned_start_date, planned_end_date], output: Project,         side_effects: ["status=DRAFT"] }
  - { method: GET,   path: "/projects",                                   description: "List Projects (filterable by status, funding_source)",  roles: [Any],                                    code: 200, input: ["limit?", "offset?", "status?", "funding_source?"], output: "Project[]",     side_effects: [] }
  - { method: GET,   path: "/projects/{projectId}",                       description: "Get Project",                                            roles: [Any],                                    code: 200, input: [],                                  output: Project,         side_effects: [] }
  - { method: POST,  path: "/projects/{projectId}/submit",                description: "Submit a Project for review",                            roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: Project,         side_effects: ["DRAFT→UNDER_REVIEW"] }
  - { method: POST,  path: "/projects/{projectId}/approve",               description: "Approve a Project (mints project_code, approves all BudgetItems)", roles: [ResearchAdmin],                code: 200, input: [],                                  output: Project,         side_effects: ["UNDER_REVIEW→APPROVED", "project_code minted", "BudgetItems APPROVED", "AuditLog appended"] }
  - { method: POST,  path: "/projects/{projectId}/reject",                description: "Reject a Project",                                       roles: [ResearchAdmin],                          code: 200, input: [],                                  output: Project,         side_effects: ["UNDER_REVIEW→REJECTED"] }
  - { method: POST,  path: "/projects/{projectId}/activate",              description: "Activate a Project (must be on/after planned_start_date)", roles: [ResearchAdmin],                        code: 200, input: [],                                  output: Project,         side_effects: ["APPROVED→ACTIVE"] }
  - { method: POST,  path: "/projects/{projectId}/begin-closing",         description: "Move Project to CLOSING; locks all BudgetItems",         roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: Project,         side_effects: ["ACTIVE→CLOSING", "BudgetItem.status=LOCKED"] }

  # ------ PeerReview ------
  - { method: POST,  path: "/projects/{projectId}/peer-reviews",          description: "Append a peer review (immutable)",                       roles: [PeerReviewer],                           code: 201, input: [reviewer_id, score, recommendation, comments], output: PeerReview, side_effects: [] }
  - { method: GET,   path: "/projects/{projectId}/peer-reviews",          description: "List peer reviews",                                      roles: [Any],                                    code: 200, input: ["limit?", "offset?"],               output: "PeerReview[]",  side_effects: [] }

  # ------ BudgetItem ------
  - { method: POST,  path: "/projects/{projectId}/budget-items",          description: "Add a BudgetItem to a project (only while project DRAFT)", roles: [PrincipalInvestigator],                code: 201, input: [category, requested_amount],        output: BudgetItem,      side_effects: ["status=PENDING"] }
  - { method: GET,   path: "/projects/{projectId}/budget-items",          description: "List BudgetItems for a project",                         roles: [Any],                                    code: 200, input: ["limit?", "offset?"],               output: "BudgetItem[]",  side_effects: [] }
  - { method: GET,   path: "/budget-items/{budgetItemId}",                description: "Get a BudgetItem",                                       roles: [Any],                                    code: 200, input: [],                                  output: BudgetItem,      side_effects: [] }

  # ------ BudgetAdjustment ------
  - { method: POST,  path: "/budget-adjustments",                         description: "Create a BudgetAdjustment draft",                        roles: [PrincipalInvestigator],                  code: 201, input: [project_id, line_changes, justification], output: BudgetAdjustment, side_effects: ["status=DRAFT", "all *_decision=PENDING"] }
  - { method: GET,   path: "/budget-adjustments",                         description: "List BudgetAdjustments",                                 roles: [Any],                                    code: 200, input: ["limit?", "offset?", "project_id?", "status?"], output: "BudgetAdjustment[]", side_effects: [] }
  - { method: GET,   path: "/budget-adjustments/{adjustmentId}",          description: "Get a BudgetAdjustment",                                 roles: [Any],                                    code: 200, input: [],                                  output: BudgetAdjustment, side_effects: [] }
  - { method: POST,  path: "/budget-adjustments/{adjustmentId}/submit",   description: "Submit for dept/finance review",                         roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: BudgetAdjustment, side_effects: ["DRAFT→UNDER_REVIEW", "pinned_budget_versions captured"] }
  - { method: POST,  path: "/budget-adjustments/{adjustmentId}/dept-approve",     description: "Department approval",                            roles: [DepartmentApprover],                     code: 200, input: [],                                  output: BudgetAdjustment, side_effects: ["dept_decision=APPROVED"] }
  - { method: POST,  path: "/budget-adjustments/{adjustmentId}/finance-approve", description: "Finance approval (commits deltas to BudgetItems)", roles: [FinanceOfficer],                       code: 200, input: [],                                  output: BudgetAdjustment, side_effects: ["UNDER_REVIEW→APPROVED", "BudgetItem.approved_amount mutated", "AuditLog appended"] }
  - { method: POST,  path: "/budget-adjustments/{adjustmentId}/reject",   description: "Reject (dept or finance)",                               roles: [DepartmentApprover, FinanceOfficer],     code: 200, input: ["rejection_reason"],                output: BudgetAdjustment, side_effects: ["UNDER_REVIEW→REJECTED"] }

  # ------ Reimbursement ------
  - { method: POST,  path: "/reimbursements",                             description: "Create a Reimbursement draft",                           roles: [PrincipalInvestigator],                  code: 201, input: [project_id, budget_item_id, expense_category, amount, invoice_number, invoice_date, invoice_authenticated, attachments, vendor_id], output: Reimbursement, side_effects: ["status=DRAFT", "rework_count=0"] }
  - { method: GET,   path: "/reimbursements",                             description: "List Reimbursements",                                    roles: [Any],                                    code: 200, input: ["limit?", "offset?", "project_id?", "status?"], output: "Reimbursement[]", side_effects: [] }
  - { method: GET,   path: "/reimbursements/{reimbursementId}",           description: "Get a Reimbursement",                                    roles: [Any],                                    code: 200, input: [],                                  output: Reimbursement,   side_effects: [] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/submit",    description: "Submit reimbursement (runs compliance pre-screen)",      roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: Reimbursement,   side_effects: ["DRAFT→SUBMITTED", "compliance_findings populated"] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/pi-approve",       description: "PI approves",                                    roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: Reimbursement,   side_effects: ["pi_decision=APPROVED", "SUBMITTED→UNDER_REVIEW"] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/dept-approve",     description: "Department approves",                            roles: [DepartmentApprover],                     code: 200, input: [],                                  output: Reimbursement,   side_effects: ["dept_decision=APPROVED"] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/finance-approve", description: "Finance approves",                                roles: [FinanceOfficer],                         code: 200, input: [],                                  output: Reimbursement,   side_effects: ["UNDER_REVIEW→APPROVED", "finance_decision=APPROVED"] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/mark-paid",       description: "Mark reimbursement PAID (debits BudgetItem)",     roles: [FinanceOfficer],                         code: 200, input: [],                                  output: Reimbursement,   side_effects: ["APPROVED→PAID", "BudgetItem.spent_amount += amount", "Project.total_reimbursed += amount", "AuditLog appended"] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/reject",         description: "Reject (dept/finance) — sends back to DRAFT or terminal", roles: [DepartmentApprover, FinanceOfficer], code: 200, input: ["rejection_reason"],            output: Reimbursement,   side_effects: ["UNDER_REVIEW→DRAFT (rework) or →REJECTED (rework_limit)", "rework_count++"] }
  - { method: POST,  path: "/reimbursements/{reimbursementId}/rework",         description: "PI moves SUBMITTED back to DRAFT manually",       roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: Reimbursement,   side_effects: ["SUBMITTED→DRAFT", "rework_count++"] }

  # ------ ClosingAudit ------
  - { method: POST,  path: "/closing-audits",                             description: "Create a ClosingAudit (one per project)",                roles: [PrincipalInvestigator],                  code: 201, input: [project_id, deliverables, residual_fund_action, audit_findings], output: ClosingAudit, side_effects: ["status=DRAFT"] }
  - { method: GET,   path: "/closing-audits/{auditId}",                   description: "Get a ClosingAudit",                                     roles: [Any],                                    code: 200, input: [],                                  output: ClosingAudit,    side_effects: [] }
  - { method: POST,  path: "/closing-audits/{auditId}/submit",            description: "Submit audit (computes execution rates)",                roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: ClosingAudit,    side_effects: ["DRAFT→SUBMITTED", "compute budget_execution_rate + forward_execution_rate"] }
  - { method: POST,  path: "/closing-audits/{auditId}/flag-rectification", description: "Flag for rectification when HIGH findings exist",       roles: [AuditOfficer],                           code: 200, input: [],                                  output: ClosingAudit,    side_effects: ["SUBMITTED→RECTIFICATION_REQUIRED"] }
  - { method: POST,  path: "/closing-audits/{auditId}/resubmit",          description: "PI resubmits after rectifying HIGH findings",            roles: [PrincipalInvestigator],                  code: 200, input: [],                                  output: ClosingAudit,    side_effects: ["RECTIFICATION_REQUIRED→SUBMITTED"] }
  - { method: POST,  path: "/closing-audits/{auditId}/close",             description: "Close audit; cascades Project to CLOSED + indirect cost run", roles: [AuditOfficer],                       code: 200, input: [],                                  output: ClosingAudit,    side_effects: ["SUBMITTED→CLOSED", "Project CLOSING→CLOSED", "IndirectCostAllocation snapshot written"] }

  # ------ ComplianceRule ------
  - { method: POST,  path: "/compliance-rules",                           description: "Create a compliance rule (admin)",                       roles: [ResearchAdmin],                          code: 201, input: [rule_code, applies_to_funding_source, applies_to_category, parameters, severity, "active?"], output: ComplianceRule, side_effects: [] }
  - { method: GET,   path: "/compliance-rules",                           description: "List compliance rules",                                  roles: [Any],                                    code: 200, input: ["limit?", "offset?"],               output: "ComplianceRule[]", side_effects: [] }
  - { method: PATCH, path: "/compliance-rules/{ruleId}",                  description: "Patch a compliance rule (active flag, severity)",        roles: [ResearchAdmin],                          code: 200, input: ["active?", "severity?", "parameters?", "version"], output: ComplianceRule, side_effects: ["version++"] }

  # ------ IndirectCostAllocation ------
  - { method: POST,  path: "/allocation-runs",                            description: "Run periodic indirect-cost recalculation",               roles: [FinanceOfficer],                         code: 201, input: [allocation_base, "project_id?"],    output: "IndirectCostAllocation[]", side_effects: ["one IndirectCostAllocation row per ACTIVE/CLOSING project (or just one if project_id provided)", "Project.indirect_cost_amount refreshed"] }
  - { method: GET,   path: "/allocation-runs/{runId}",                    description: "Read an allocation run snapshot",                        roles: [Any],                                    code: 200, input: [],                                  output: "IndirectCostAllocation[]", side_effects: [] }

  # ------ AuditLog ------
  - { method: GET,   path: "/audit-logs",                                 description: "List audit logs (filter by subject_type/subject_id)",    roles: [AuditOfficer, FinanceOfficer],           code: 200, input: ["limit?", "offset?", "subject_type?", "subject_id?"], output: "AuditLog[]", side_effects: [] }

  # ------ Test driving endpoints ------
  - { method: POST,  path: "/_clock/advance",                             description: "Test-only: advance the system clock to a target ISO timestamp (must be >= current clock)", roles: [TestDriver], code: 200, input: [target_iso], output: "{now: ISO8601}", side_effects: ["server clock advances; subsequent now()-dependent transitions reflect new clock"] }
  - { method: POST,  path: "/_events/emit",                               description: "Test-only: synthesize an external event for finance/procurement/HR/agency synchronization (no-op in production)", roles: [TestDriver], code: 200, input: [event_type, payload], output: "{accepted: true}", side_effects: ["AuditLog appended capturing the synthetic event"] }

# =============================================================================
# §1.6  Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_USER_CONTEXT,         http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,     http: 403, condition: "Role lacks permission for the requested endpoint" }
  - { id: ERR_NOT_PROJECT_OWNER,            http: 403, condition: "X-User-ID does not equal Project.principal_investigator_id for owner-only operation" }

  # --- Not found ---
  - { id: ERR_PROJECT_NOT_FOUND,            http: 404, condition: "Project id not found" }
  - { id: ERR_BUDGET_ITEM_NOT_FOUND,        http: 404, condition: "BudgetItem id not found" }
  - { id: ERR_BUDGET_ADJUSTMENT_NOT_FOUND,  http: 404, condition: "BudgetAdjustment id not found" }
  - { id: ERR_REIMBURSEMENT_NOT_FOUND,      http: 404, condition: "Reimbursement id not found" }
  - { id: ERR_CLOSING_AUDIT_NOT_FOUND,      http: 404, condition: "ClosingAudit id not found" }
  - { id: ERR_COMPLIANCE_RULE_NOT_FOUND,    http: 404, condition: "ComplianceRule id not found" }
  - { id: ERR_ALLOCATION_RUN_NOT_FOUND,     http: 404, condition: "Allocation run id not found" }
  - { id: ERR_PEER_REVIEW_NOT_FOUND,        http: 404, condition: "PeerReview id not found" }

  # --- State ---
  - { id: ERR_INVALID_STATE,                http: 409, condition: "Target resource not in correct state for requested transition" }
  - { id: ERR_PROJECT_NOT_ACTIVE,           http: 409, condition: "Operation requires Project.status==ACTIVE" }
  - { id: ERR_PROJECT_NOT_CLOSING,          http: 409, condition: "ClosingAudit submit requires Project.status==CLOSING" }
  - { id: ERR_PROJECT_NOT_YET_STARTED,      http: 409, condition: "Project activate before planned_start_date OR submit with start in past" }
  - { id: ERR_BUDGET_NOT_APPROVED,          http: 409, condition: "Reimbursement submit while BudgetItem not APPROVED" }
  - { id: ERR_OPEN_REIMBURSEMENTS_EXIST,    http: 409, condition: "begin-closing while reimbursements remain SUBMITTED/UNDER_REVIEW" }
  - { id: ERR_ALREADY_DECIDED,              http: 409, condition: "Decision already made on this resource" }
  - { id: ERR_PI_DECISION_PENDING,          http: 409, condition: "Department approve requested before pi_decision=APPROVED" }
  - { id: ERR_DEPT_DECISION_PENDING,        http: 409, condition: "Finance approve requested before dept_decision=APPROVED" }
  - { id: ERR_INSUFFICIENT_REVIEWS,         http: 409, condition: "Fewer than 3 PeerReview rows for the project at approve" }
  - { id: ERR_REVIEW_CONSENSUS_NOT_MET,     http: 409, condition: "APPROVE recommendations do not strictly outnumber REJECT recommendations at approve" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED,        http: 409, condition: "rework_count exceeds 3 (or would by the requested transition)" }
  - { id: ERR_HIGH_FINDINGS_NOT_RECTIFIED,  http: 409, condition: "Resubmitting an audit while HIGH findings have rectified==false" }
  - { id: ERR_FINDINGS_NOT_RECTIFIED,       http: 409, condition: "Closing audit while MEDIUM/HIGH findings have rectified==false" }
  - { id: ERR_NO_HIGH_FINDINGS,             http: 409, condition: "flag-rectification while audit_findings has no HIGH-severity entry" }
  - { id: ERR_DUPLICATE_INVOICE_NUMBER,     http: 409, condition: "Invoice number duplicates a prior reimbursement on the same project (case-insensitive)" }
  - { id: ERR_PROJECT_CODE_COLLISION,       http: 409, condition: "Concurrent project approvals could not allocate distinct project_code after retries" }
  - { id: ERR_STALE_BUDGET_VERSION,         http: 409, condition: "BudgetItem.version drifted from pinned_budget_versions during finance-approve" }

  # --- Business / Validation ---
  - { id: ERR_PROPOSAL_TOO_SHORT,           http: 422, condition: "proposal_text shorter than 200 chars at submit" }
  - { id: ERR_INVALID_DATE_RANGE,           http: 422, condition: "planned_end_date <= planned_start_date" }
  - { id: ERR_START_IN_PAST,                http: 422, condition: "planned_start_date in the past at submit" }
  - { id: ERR_ADJUSTMENT_NOT_ZERO_SUM,      http: 422, condition: "BudgetAdjustment line_changes deltas do not sum to 0 within ±0.01" }
  - { id: ERR_NEGATIVE_BUDGET,              http: 422, condition: "BudgetItem.approved_amount + delta_amount < 0" }
  - { id: ERR_JUSTIFICATION_TOO_SHORT,      http: 422, condition: "BudgetAdjustment.justification shorter than 20 chars" }
  - { id: ERR_INVOICE_NOT_AUTHENTIC,        http: 422, condition: "Reimbursement.invoice_authenticated == false at submit" }
  - { id: ERR_ATTACHMENTS_INCOMPLETE,       http: 422, condition: "Reimbursement.attachments missing INVOICE or RECEIPT kind at submit" }
  - { id: ERR_CATEGORY_MISMATCH,            http: 422, condition: "Reimbursement.expense_category != BudgetItem.category" }
  - { id: ERR_INVOICE_DATE_OUT_OF_RANGE,    http: 422, condition: "invoice_date outside [planned_start_date, now()]" }
  - { id: ERR_COMPLIANCE_BLOCK,             http: 422, condition: "Compliance pre-screen yielded a BLOCK-severity finding (e.g., COI)" }
  - { id: ERR_ESCALATION_PENDING,           http: 422, condition: "Reimbursement still has unresolved ESCALATE compliance finding at PI approve" }
  - { id: ERR_AGENCY_RULE_VIOLATION,        http: 422, condition: "Adjustment violates funding-agency rule at finance-approve revalidation" }
  - { id: ERR_BUDGET_INSUFFICIENT,          http: 402, condition: "BudgetItem.remaining_amount < Reimbursement.amount at finance-approve" }
  - { id: ERR_DELIVERABLES_INCOMPLETE,      http: 422, condition: "ClosingAudit deliverables missing REPORT or DATASET kind" }
  - { id: ERR_RESIDUAL_ACTION_NOT_ALLOWED,  http: 422, condition: "residual_fund_action not permitted by funding_source × execution_rate" }
  - { id: ERR_REJECTION_REASON_REQUIRED,    http: 422, condition: "Reject endpoint called without a non-empty rejection_reason" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit out of [1,100] or offset < 0" }
  - { id: ERR_INVALID_INPUT,                http: 400, condition: "Generic input shape error (missing required body field, wrong type)" }

# =============================================================================
# §1.7  RBAC Matrix
# =============================================================================
roles:
  - name: PrincipalInvestigator
    description: "Project owner; submits projects, drafts/submits BudgetAdjustments, drafts/submits Reimbursements, submits ClosingAudits"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects (create)"
      - "POST /projects/{id}/submit"
      - "POST /projects/{id}/begin-closing"
      - "POST /projects/{id}/budget-items (only while project DRAFT)"
      - "POST /budget-adjustments (create)"
      - "POST /budget-adjustments/{id}/submit"
      - "POST /reimbursements (create)"
      - "POST /reimbursements/{id}/submit"
      - "POST /reimbursements/{id}/pi-approve"
      - "POST /reimbursements/{id}/rework"
      - "POST /closing-audits (create)"
      - "POST /closing-audits/{id}/submit"
      - "POST /closing-audits/{id}/resubmit"
    shared_operations: ["all GETs (Any)"]

  - name: DepartmentApprover
    description: "Department-level approver for adjustments and reimbursements (segregation: cannot also act as PI on the same project)"
    identity: "opaque"
    exclusive_operations:
      - "POST /budget-adjustments/{id}/dept-approve"
      - "POST /reimbursements/{id}/dept-approve"
    shared_operations:
      - "POST /budget-adjustments/{id}/reject (with FinanceOfficer)"
      - "POST /reimbursements/{id}/reject (with FinanceOfficer)"
      - "all GETs (Any)"

  - name: FinanceOfficer
    description: "Finance approver; commits adjustments, finance-approves and marks reimbursements paid, runs allocation"
    identity: "opaque"
    exclusive_operations:
      - "POST /budget-adjustments/{id}/finance-approve"
      - "POST /reimbursements/{id}/finance-approve"
      - "POST /reimbursements/{id}/mark-paid"
      - "POST /allocation-runs"
    shared_operations:
      - "POST /budget-adjustments/{id}/reject (with DepartmentApprover)"
      - "POST /reimbursements/{id}/reject (with DepartmentApprover)"
      - "GET /audit-logs (with AuditOfficer)"
      - "all other GETs (Any)"

  - name: ResearchAdmin
    description: "Approves/rejects/activates projects, manages compliance rules"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/approve"
      - "POST /projects/{id}/reject"
      - "POST /projects/{id}/activate"
      - "POST /compliance-rules (create)"
      - "PATCH /compliance-rules/{id}"
    shared_operations: ["all GETs (Any)"]

  - name: AuditOfficer
    description: "Closes audits; flags rectification; reads audit logs"
    identity: "opaque"
    exclusive_operations:
      - "POST /closing-audits/{id}/flag-rectification"
      - "POST /closing-audits/{id}/close"
    shared_operations:
      - "GET /audit-logs (with FinanceOfficer)"
      - "all GETs (Any)"

  - name: PeerReviewer
    description: "Submits peer reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/peer-reviews"
    shared_operations: ["GET /projects/{id}/peer-reviews", "GET /projects/{id} (Any)"]

  - name: TestDriver
    description: "Test-only role for clock advance and event emission; never used in production"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations: []

  - name: Any
    description: "Read-only role label — every authenticated role above is allowed for GET endpoints"
    identity: "opaque"
    shared_operations:
      - "GET /projects, GET /projects/{id}"
      - "GET /projects/{id}/peer-reviews"
      - "GET /projects/{id}/budget-items, GET /budget-items/{id}"
      - "GET /budget-adjustments, GET /budget-adjustments/{id}"
      - "GET /reimbursements, GET /reimbursements/{id}"
      - "GET /closing-audits/{id}"
      - "GET /compliance-rules"
      - "GET /allocation-runs/{id}"
