  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: franchise_tax_rounding_order_covered
        claim_type: precision
        grounds:
          - "calculations.late_filing_penalty"
        excluded_because:
          difficulty_instance: late_fee_component_rounding_order
          rationale: "Pinned per-component rounding order and its divergence from sum-then-round (12546 vs 12547) is asserted there."

      - name: franchise_tax_variant_divergence_covered
        claim_type: variant_divergence
        grounds:
          - "calculations.franchise_tax"
        excluded_because:
          difficulty_instance: franchise_tax_estimated_vs_actual_basis
          rationale: "ESTIMATED vs ACTUAL divergence (26000 vs 34500) is asserted there."

      - name: ownership_variant_divergence_covered
        claim_type: variant_divergence
        grounds:
          - "calculations.ownership_consolidation"
        excluded_because:
          difficulty_instance: ownership_direct_vs_look_through
          rationale: "DIRECT 1000 vs LOOK_THROUGH 5000 divergence is asserted there."

