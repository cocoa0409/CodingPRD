        distinguishing_aspect: "A `business_safety` versus `business_fiscal` pair: a submission that both keeps a CONDITIONAL review (clearance count 1) and would push the account past placement_cap 1 violates both, and the safety check at priority 13 must win over the budget check at priority 35."
