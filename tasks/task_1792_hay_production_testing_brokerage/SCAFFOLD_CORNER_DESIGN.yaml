# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Hay Production, Testing & Brokerage. Breadth coverage of §1.1-§1.7 claims not
# already probed by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: grower_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Grower]
        distinguishing_aspect: "POST /api/growers returns 201 with system-managed defaults: status ACTIVE, computed counters zeroed, version 1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/growers", payload: { name: "Grower A", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
          assert:
            - "Grower.${g_id}.status == ACTIVE"
            - "Grower.${g_id}.settled_tons_ytd == 0.0"
            - "Grower.${g_id}.outstanding_balance_cents == 0"
            - "Grower.${g_id}.version == 1"
      - name: field_defaults_applied
        claim_type: defaults
        grounds: [entities.Field.fields.irrigated]
        distinguishing_aspect: "Omitting the optional irrigated field applies the declared default false."
        test_recipe:
          setup: ["Grower exists"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower B", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field B", acres: 25.0, forage_type: "MIXED" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
          assert:
            - "Field.${f_id}.irrigated == false"
      - name: site_default_moisture_controlled_false
        claim_type: defaults
        grounds: [entities.StorageSite.fields.moisture_controlled]
        distinguishing_aspect: "Omitting moisture_controlled yields a standard site (false), which selects the full 1.5% shrink rate."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/storage-sites", payload: { name: "Pad 1", region_code: "WA-YAKIMA", capacity_tons: 300.0 }, as: PlatformAdmin, captures: { s_id: "$.data.id" } }
          assert:
            - "StorageSite.${s_id}.moisture_controlled == false"
      - name: lot_creation_computed_fields
        claim_type: computed_fields
        grounds: [entities.BaleLot]
        distinguishing_aspect: "A freshly created lot reports computed fields immediately: UNGRADED tier, zero shipped/spoilage/open-allocation, allocatable == harvested at 0 months."
        test_recipe:
          setup: ["Grower/Field/Cutting CUT 2026-07-31; site cap 500.0"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower C", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field C", acres: 33.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn K", region_code: "OR-WILLAMETTE", capacity_tons: 500.0 }, as: PlatformAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c_id}", storage_site_id: "${s_id}", bale_type: "ROUND", bale_count: 10, harvested_tonnage: 6.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lot_id: "$.data.id" } }
          assert:
            - "BaleLot.${lot_id}.quality_tier == UNGRADED"
            - "BaleLot.${lot_id}.allocatable_tonnage == 6.0"
            - "BaleLot.${lot_id}.physical_tonnage == 6.0"
            - "BaleLot.${lot_id}.shipped_tonnage == 0.0"
            - "BaleLot.${lot_id}.status == ACTIVE"
            - "Cutting.${c_id}.status == HARVESTED (first lot flips CUT -> HARVESTED)"
      - name: field_invalid_forage_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Field.fields.forage_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-enum forage_type is a schema-level 400, not a business error."
        test_recipe:
          setup: ["Grower exists"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower D", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field D", acres: 10.0, forage_type: "CLOVER" }, as: Grower, as_user_id: "${g_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: lot_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Paginated list honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["Grower/Field/Cutting CUT; site; two lots (6.0t and 4.0t) harvested 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower E", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field E", acres: 33.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn L", region_code: "OR-WILLAMETTE", capacity_tons: 500.0 }, as: PlatformAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c_id}", storage_site_id: "${s_id}", bale_type: "ROUND", bale_count: 10, harvested_tonnage: 6.0, harvested_date: "2026-08-01" }, as: BrokerOps }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c_id}", storage_site_id: "${s_id}", bale_type: "ROUND", bale_count: 8, harvested_tonnage: 4.0, harvested_date: "2026-08-01" }, as: BrokerOps }
          trigger:
            - { call: "GET /api/bale-lots?limit=1&offset=0", payload: {}, as: BrokerOps }
            - { call: "GET /api/bale-lots?limit=1&offset=1", payload: {}, as: BrokerOps }
          assert:
            - "page 1 returns 1 item with total_count == 2 and has_more == true"
            - "page 2 returns 1 item with total_count == 2 and has_more == false"
      - name: grower_not_found
        claim_type: not_found
        grounds: ["errors[ERR_GROWER_NOT_FOUND]"]
        distinguishing_aspect: "Unknown grower id -> 404 ERR_GROWER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/growers/00000000-0000-4000-8000-000000000001", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_GROWER_NOT_FOUND (http 404)"]
      - name: field_not_found
        claim_type: not_found
        grounds: ["errors[ERR_FIELD_NOT_FOUND]"]
        distinguishing_aspect: "Unknown field id -> 404 ERR_FIELD_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/fields/00000000-0000-4000-8000-000000000002", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_FIELD_NOT_FOUND (http 404)"]
      - name: cutting_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CUTTING_NOT_FOUND]"]
        distinguishing_aspect: "Unknown cutting id -> 404 ERR_CUTTING_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/cuttings/00000000-0000-4000-8000-000000000003", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_CUTTING_NOT_FOUND (http 404)"]
      - name: site_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "Unknown storage-site id -> 404 ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/storage-sites/00000000-0000-4000-8000-000000000004", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_SITE_NOT_FOUND (http 404)"]
      - name: lot_not_found
        claim_type: not_found
        grounds: ["errors[ERR_LOT_NOT_FOUND]"]
        distinguishing_aspect: "Unknown lot id -> 404 ERR_LOT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/bale-lots/00000000-0000-4000-8000-000000000005", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_LOT_NOT_FOUND (http 404)"]
      - name: test_not_found
        claim_type: not_found
        grounds: ["errors[ERR_TEST_NOT_FOUND]"]
        distinguishing_aspect: "Unknown forage-test id -> 404 ERR_TEST_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/forage-tests/00000000-0000-4000-8000-000000000006", payload: {}, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_TEST_NOT_FOUND (http 404)"]
      - name: buyer_not_found
        claim_type: not_found
        grounds: ["errors[ERR_BUYER_NOT_FOUND]"]
        distinguishing_aspect: "Unknown buyer id -> 404 ERR_BUYER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/buyers/00000000-0000-4000-8000-000000000007", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_BUYER_NOT_FOUND (http 404)"]
      - name: quote_not_found
        claim_type: not_found
        grounds: ["errors[ERR_QUOTE_NOT_FOUND]"]
        distinguishing_aspect: "Unknown quote id -> 404 ERR_QUOTE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/quotes/00000000-0000-4000-8000-000000000008", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_QUOTE_NOT_FOUND (http 404)"]
      - name: contract_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "Unknown contract id -> 404 ERR_CONTRACT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/contracts/00000000-0000-4000-8000-000000000009", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_CONTRACT_NOT_FOUND (http 404)"]
      - name: load_not_found
        claim_type: not_found
        grounds: ["errors[ERR_LOAD_NOT_FOUND]"]
        distinguishing_aspect: "Unknown load id -> 404 ERR_LOAD_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/delivery-loads/00000000-0000-4000-8000-00000000000a", payload: {}, as: BrokerOps, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_LOAD_NOT_FOUND (http 404)"]
      - name: allocation_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ALLOCATION_NOT_FOUND]"]
        distinguishing_aspect: "Unknown allocation id -> 404 ERR_ALLOCATION_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/load-allocations/00000000-0000-4000-8000-00000000000b", payload: {}, as: BrokerOps, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_ALLOCATION_NOT_FOUND (http 404)"]
      - name: bso_not_found
        claim_type: not_found
        grounds: ["errors[ERR_BSO_NOT_FOUND]"]
        distinguishing_aspect: "Unknown baling-order id -> 404 ERR_BSO_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/baling-service-orders/00000000-0000-4000-8000-00000000000c", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_BSO_NOT_FOUND (http 404)"]

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cutting_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.Cutting]
        distinguishing_aspect: "A newly created cutting starts SCHEDULED with actual_cut_date null."
        test_recipe:
          setup: ["Grower/Field exist"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower F", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field F", acres: 12.0, forage_type: "GRASS" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/cuttings", payload: { field_id: "${f_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-08-10", planned_window_end: "2026-08-20" }, as: Grower, as_user_id: "${g_id}", captures: { c_id: "$.data.id", c_st: "$.data.status", c_date: "$.data.actual_cut_date" } }
          assert:
            - "Cutting.${c_id}.status == SCHEDULED"
            - "Cutting.${c_id}.actual_cut_date is null"
      - name: certify_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ForageTest.RESULTED_to_CERTIFIED, "errors[ERR_TEST_WRONG_STATE]"]
        distinguishing_aspect: "certify requires RESULTED; from SUBMITTED (no result recorded) it fails with ERR_TEST_WRONG_STATE."
        test_recipe:
          setup: ["Grower chain; lot 6.0t; test SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower G", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field G", acres: 20.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn M", region_code: "OR-WILLAMETTE", capacity_tons: 500.0 }, as: PlatformAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c_id}", storage_site_id: "${s_id}", bale_type: "ROUND", bale_count: 12, harvested_tonnage: 6.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lot_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${t_id}/submit", payload: { lab_reference: "LAB-K" }, as: LabTechnician, as_user_id: "tech-1" }
          trigger:
            - { call: "POST /api/forage-tests/${t_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_TEST_WRONG_STATE (http 409)"
            - "ForageTest.${t_id}.status == SUBMITTED (unchanged)"
      - name: deliver_from_planned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DeliveryLoad.IN_TRANSIT_to_DELIVERED, "errors[ERR_LOAD_WRONG_STATE]"]
        distinguishing_aspect: "deliver skips LOADING/IN_TRANSIT from PLANNED -> ERR_LOAD_WRONG_STATE."
        test_recipe:
          setup: ["Load PLANNED (no allocations needed for the rejection)"]
          setup_api_calls:
            - { call: "POST /api/delivery-loads", payload: { carrier_name: "CARRIER-S", capacity_tons: 25.0, planned_ship_date: "2026-08-07" }, as: BrokerOps, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/delivery-loads/${l_id}/deliver", payload: {}, as: BrokerOps, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LOAD_WRONG_STATE (http 409)"
            - "DeliveryLoad.${l_id}.logistics_status == PLANNED"
      - name: declined_quote_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Quote.ISSUED_to_DECLINED, "errors[ERR_QUOTE_NOT_ISSUABLE]"]
        distinguishing_aspect: "DECLINED is terminal: accept after decline fails with ERR_QUOTE_NOT_ISSUABLE and no side effects fire."
        test_recipe:
          setup: ["Index 20000; lane 420mi; buyer 1000000; quote GOOD 5.0t ISSUED"]
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 420, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer T", region_code: "CA-NORTH", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b_id}", forage_type: "ALFALFA", quality_tier: "GOOD", tons: 5.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b_id}", captures: { q_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q_id}/issue", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /api/quotes/${q_id}/decline", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "GET /api/quotes/${q_id}", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { q_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/quotes/${q_id}/accept", payload: { expected_quote_version: "${q_v}" }, as: Buyer, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_QUOTE_NOT_ISSUABLE (http 409)"
            - "Quote.${q_id}.status == DECLINED"
            - "no Contract is created for quote ${q_id} (GET /api/contracts?quote_id= returns empty list)"
      - name: grower_suspend_cancels_open_bsos
        claim_type: side_effect_execution
        grounds: [state_machines.Grower.ACTIVE_to_SUSPENDED, state_machines.BalingServiceOrder.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Conditional cascade: suspending a grower cancels only REQUESTED/SCHEDULED baling orders; an IN_PROGRESS order is untouched."
        test_recipe:
          setup: ["Grower with field+cutting WINDOW_OPEN; BSO-A REQUESTED (never scheduled); BSO-B scheduled (unit BALER-9, 2026-08-03) and started -> IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower H", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field H", acres: 44.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
