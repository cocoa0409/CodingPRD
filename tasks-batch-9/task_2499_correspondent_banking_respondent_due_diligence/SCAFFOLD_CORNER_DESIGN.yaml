            - call: "POST /correspondent-banking/respondents/${r_id}/monitoring-profiles"
              payload: { effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", expected_corridors: [{ jurisdiction_code: "FR", expected_monthly_usd: 100000.00, expected_monthly_count: 20 }, { jurisdiction_code: "IT", expected_monthly_usd: 100000.00, expected_monthly_count: 20 }, { jurisdiction_code: "DE", expected_monthly_usd: 100000.00, expected_monthly_count: 20 }], expected_respondent_version: "${r_ver}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { mp_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/closure-plans"
