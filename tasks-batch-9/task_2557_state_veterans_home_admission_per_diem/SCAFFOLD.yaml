scenario: |
  Generate task harder than expert level!

  2557. State Veterans Home Admission & Per Diem (state veterans home): applicant eligibility on
  service, residency and level-of-care criteria with waitlist priority rules, clinical assessment and
  admission decision with bed availability by care level, resident cost share calculation from income
  and benefits with federal per diem offsets, per diem claim submission with census reporting and
  recognition requirements, care plan development, level-of-care changes and transfer between units,
  survey and certification compliance for nursing and domiciliary care standards, resident trust fund
  management and personal needs allowance, discharge, hospitalization bed-hold and readmission policies

domain_name: state-veterans-home-admission-per-diem
api_prefix: "/svh"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only two URL families nest
  # (`/veterans-homes/{id}/care-units`, `/residents/{id}/...`) and those nestings exist purely as
  # reverse-reachability read channels plus creation-in-parent-context writes; no entity is
  # addressed by a multi-level path, and every child carries its parents as FK body fields.

  state_machine_shape: parallel
  # Resident carries two independent state dimensions on one row (`occupancy_status` ADMITTED ⇄
  # HOSPITALIZED → DISCHARGED, and `billing_status` PROVISIONAL_COST_SHARE → FINAL_COST_SHARE →
  # CLOSED) that advance under different triggers. Secondary shapes present: cyclic (Applicant
  # INELIGIBLE→SUBMITTED redetermination loop; WaitlistEntry ACTIVE⇄OFFERED offer loop; CarePlan
  # ACTIVE⇄REVIEW_DUE review loop; CareUnit CERTIFIED⇄CONDITIONAL survey loop) and branching
  # fork-join with divergent side-effect sets (PerDiemClaim SUBMITTED→{PAID, REJECTED}).

  relationship_patterns:
    - one_to_many          # VeteransHome→CareUnit, Resident→IncomeRecord/CensusDay/TrustFundTransaction
    - self_referential     # CarePlan.supersedes_care_plan_id, PerDiemClaim.corrects_claim_id,
                           # TrustFundTransaction.reverses_transaction_id
    - cross_aggregate      # CensusDay.care_unit_id crosses the Resident aggregate into the CareUnit
                           # aggregate so a claim can be assembled per unit-month across transfers

  role_model: segregation_of_duties
  # Two enforced separations: (1) the AdmissionsCoordinator user who records an admission decision
  # MUST NOT be the ClinicalAssessor user who authored the cited ClinicalAssessment; (2) the user who
  # reverses a TrustFundTransaction MUST NOT be the user who recorded it. Layered on top of peer
  # ownership (SurveyAgency owns certification, FederalPerDiemAuditor owns adjudication,
  # ResidentRepresentative acts only on its own Resident row).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
    # When "response_type" is "array", `data` is the JSON array of rows and the pagination fields
    # below live in `meta`: { "api_request_id", "api_request_timestamp", "limit", "offset",
    # "total_count", "has_more" }. `total_count` counts every row matching the filters, not the
    # page. Single-object responses carry no pagination fields.
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: VeteransHome
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the state veterans home.
        constraints: 1..200 chars, non-blank
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the operating state.
        constraints: exactly 2 uppercase letters
      - name: recognition_status
        type: enum
        source: input
        description: Federal recognition standing that gates per diem claim submission.
        default: RECOGNIZED
        constraints: "one of {RECOGNIZED, PROVISIONAL, SUSPENDED}"
      - name: recognition_effective_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the current recognition standing took effect.
        constraints: ISO date, YYYY-MM-DD
      - name: personal_needs_allowance_monthly_cents
        type: integer
        source: input
        description: Monthly personal needs allowance credited to each resident and reserved from cost-share debits.
        default: 9000
        constraints: ">= 0"
      - name: last_survey_date
        type: string
        source: system
        description: Calendar date of the most recent survey result recorded against any of this home's care units; null until the first survey.
        default: null
      - name: active_resident_count
        type: integer
        source: computed
        description: "Count of Resident rows whose care_unit_id belongs to this home and whose occupancy_status IN {ADMITTED, HOSPITALIZED}."
        default: 0
      - name: decertified_unit_count
        type: integer
        source: computed
        description: Count of this home's CareUnit rows with certification_status == DECERTIFIED.
        default: 0
      - name: recognition_suspended_reason
        type: enum
        source: computed
        description: "Why recognition is SUSPENDED; null whenever recognition_status != SUSPENDED. one of {null, UNIT_DECERTIFIED}."
        default: null

  - name: CareUnit
    parent: VeteransHome
    common_fields: true
    fields:
      - name: veterans_home_id
        type: string
        source: input
        description: FK -> VeteransHome.id; the home that operates this care unit.
      - name: unit_name
        type: string
        source: input
        description: Operating name of the unit.
        constraints: 1..120 chars, non-blank
      - name: care_level
        type: enum
        source: input
        description: Level of care this unit is licensed to deliver; fixes the federal per diem rate.
        constraints: "one of {NURSING, DOMICILIARY, ADULT_DAY_HEALTH}"
      - name: licensed_bed_count
        type: integer
        source: input
        description: Number of beds the unit is licensed for.
        constraints: ">= 1"
      - name: out_of_service_bed_count
        type: integer
        source: input
        description: Beds physically unavailable (renovation, infection control).
        default: 0
        constraints: ">= 0 and <= licensed_bed_count"
      - name: certification_status
        type: enum
        source: input
        description: Survey-and-certification standing for the unit's care standards.
        default: CERTIFIED
        constraints: "one of {CERTIFIED, CONDITIONAL, DECERTIFIED}"
      - name: last_survey_compliance_score
        type: integer
        source: computed
        description: Weighted deficiency score from the most recent survey result (see calculations.survey_compliance_score).
        default: 0
      - name: last_survey_date
        type: string
        source: system
        description: Calendar date of the most recent survey result recorded against this unit; null until the first survey.
        default: null
      - name: occupied_bed_count
        type: integer
        source: computed
        description: "Count of Resident rows with care_unit_id == this unit and occupancy_status == ADMITTED."
        default: 0
      - name: held_bed_count
        type: integer
        source: computed
        description: "Count of Resident rows with care_unit_id == this unit, occupancy_status == HOSPITALIZED and bed_hold_days_used < BED_HOLD_MAX_DAYS."
        default: 0
      - name: available_bed_count
        type: integer
        source: computed
        description: licensed_bed_count - out_of_service_bed_count - occupied_bed_count - held_bed_count (see calculations.care_unit_bed_availability).
        default: 0
      - name: waitlist_active_count
        type: integer
        source: computed
        description: "Count of WaitlistEntry rows with care_unit_id == this unit and status IN {ACTIVE, OFFERED}."
        default: 0
      - name: operational_posture
        type: enum
        source: computed
        description: "Derived gate over all child operations; one of {OPEN, RESTRICTED, FROZEN} (see calculations.care_unit_operational_posture)."
        default: OPEN
      - name: per_diem_rate_cents
        type: integer
        source: computed
        description: PER_DIEM_RATE_CENTS[care_level]; the full daily federal per diem rate for this unit's care level.
        default: 0

  - name: Applicant
    parent: VeteransHome
    common_fields: true
    fields:
      - name: veterans_home_id
        type: string
        source: input
        description: FK -> VeteransHome.id; the home applied to.
      - name: full_name
        type: string
        source: input
        description: Applicant legal name.
        constraints: 1..200 chars, non-blank
      - name: date_of_birth
        type: string
        source: input
        description: Applicant date of birth (YYYY-MM-DD).
        constraints: ISO date, YYYY-MM-DD
      - name: service_days
        type: integer
        source: input
        description: Total days of qualifying active military service.
        constraints: ">= 0"
      - name: discharge_character
        type: enum
        source: input
        description: Character of discharge from military service.
        constraints: "one of {HONORABLE, GENERAL, OTHER_THAN_HONORABLE, BAD_CONDUCT, DISHONORABLE}"
      - name: wartime_service
        type: boolean
        source: input
        description: True when any qualifying service fell inside a recognized wartime period.
        default: false
      - name: service_connected_disability_pct
        type: integer
        source: input
        description: VA service-connected disability rating percentage.
        constraints: 0..100
      - name: nursing_care_for_service_connected
        type: boolean
        source: input
        description: True when nursing care is required specifically for the service-connected disability.
        default: false
      - name: state_residency_years
        type: integer
        source: input
        description: Completed years of residency in the operating state.
        constraints: ">= 0"
      - name: requested_care_level
        type: enum
        source: input
        description: Care level requested by the applicant.
        constraints: "one of {NURSING, DOMICILIARY, ADULT_DAY_HEALTH}"
      - name: application_received_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the application was received; the tenure clock and the waitlist tie-break both key on it.
        constraints: ISO date, YYYY-MM-DD
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state; one of {SUBMITTED, ELIGIBLE, INELIGIBLE, WAITLISTED, ADMITTED, DENIED}."
        default: SUBMITTED
      - name: eligibility_reason_code
        type: enum
        source: computed
        description: "Outcome code from the last eligibility determination; one of {null, ELIGIBLE, DISCHARGE_CHARACTER_DISQUALIFYING, SERVICE_DAYS_INSUFFICIENT, RESIDENCY_INSUFFICIENT}."
        default: null
      - name: priority_class
        type: enum
        source: computed
        description: "Waitlist priority class; one of {null, CLASS_1, CLASS_2, CLASS_3, CLASS_4} (see calculations.applicant_priority_class). null until the first eligibility determination."
        default: null
      - name: priority_score
        type: integer
        source: computed
        description: Waitlist ranking score (see calculations.applicant_priority_score); 0 until the first eligibility determination.
        default: 0
      - name: declined_offer_count
        type: integer
        source: system
        description: Number of bed offers that lapsed unaccepted; each one subtracts DECLINED_OFFER_PENALTY_POINTS from priority_score.
        default: 0
      - name: redetermination_count
        type: integer
        source: system
        description: Number of times an INELIGIBLE determination was reopened with amended service/residency evidence.
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AdmissionsCoordinator who recorded the admission decision; null before the decision.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free-text note captured with the admission decision; null before the decision.
        default: null

  - name: WaitlistEntry
    parent: CareUnit
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the waiting applicant.
      - name: care_unit_id
        type: string
        source: input
        description: FK -> CareUnit.id; the unit whose queue this entry sits in.
      - name: status
        type: enum
        source: system
        description: "Queue state; one of {ACTIVE, OFFERED, ADMITTED, EXPIRED, CANCELLED}."
        default: ACTIVE
      - name: listed_at
        type: datetime
        source: system
        description: Logical-clock instant the entry was created (ISO 8601 UTC, three fractional digits).
      - name: offer_expires_at
        type: datetime
        source: system
        description: Logical-clock instant the current bed offer lapses; null unless status == OFFERED.
        default: null
      - name: priority_class_snapshot
        type: enum
        source: computed
        description: "Applicant.priority_class re-read at every queue recomputation; one of {CLASS_1, CLASS_2, CLASS_3, CLASS_4}."
      - name: rank_score_snapshot
        type: integer
        source: computed
        description: Applicant.priority_score re-read at every queue recomputation.
        default: 0
      - name: queue_position
        type: integer
        source: computed
        description: 1-based position in this unit's queue (see calculations.waitlist_queue_order); 0 for entries whose status is terminal.
        default: 0

  - name: ClinicalAssessment
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the assessed applicant.
      - name: assessed_care_level
        type: enum
        source: input
        description: Level of care the assessment concludes the applicant needs.
        constraints: "one of {NURSING, DOMICILIARY, ADULT_DAY_HEALTH}"
      - name: adl_dependency_count
        type: integer
        source: input
        description: Number of activities of daily living the applicant depends on assistance for.
        constraints: 0..6
      - name: cognitive_impairment
        type: boolean
        source: input
        description: True when the assessment documents cognitive impairment.
        default: false
      - name: behavioral_risk_flag
        type: boolean
        source: input
        description: True when the assessment documents behavioral risk requiring a specialized unit.
        default: false
      - name: skilled_nursing_hours_per_day
        type: number
        source: input
        description: Documented skilled nursing hours required per day.
        constraints: ">= 0 and <= 24, at most 2 decimal places"
      - name: assessment_date
        type: string
        source: input
        description: Calendar date the assessment was performed (YYYY-MM-DD).
        constraints: ISO date, YYYY-MM-DD
      - name: assessor_user_id
        type: string
        source: system
        description: X-User-ID of the ClinicalAssessor who created the assessment; the segregation-of-duties check compares it against the admission decider.
      - name: status
        type: enum
        source: system
        description: "Assessment lifecycle state; one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED}."
        default: DRAFT
      - name: acuity_points
        type: integer
        source: computed
        description: Priority-score contribution of this assessment (see calculations.applicant_priority_score, acuity_points term).
        default: 0
      - name: rejection_reason
        type: enum
        source: computed
        description: "Why the assessment was rejected; one of {null, ADMISSION_DENIED}. null unless status == REJECTED."
        default: null

  - name: Resident
    parent: CareUnit
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the admitted application this resident record was created from.
      - name: care_unit_id
        type: string
        source: input
        description: FK -> CareUnit.id; the unit the resident currently occupies (or holds a bed in).
      - name: admission_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of physical admission; first census day is this date.
        constraints: ISO date, YYYY-MM-DD
      - name: occupancy_status
        type: enum
        source: system
        description: "Bed-occupancy dimension; one of {ADMITTED, HOSPITALIZED, DISCHARGED}. Advances independently of billing_status."
        default: ADMITTED
      - name: billing_status
        type: enum
        source: system
        description: "Cost-share dimension; one of {PROVISIONAL_COST_SHARE, FINAL_COST_SHARE, CLOSED}. Advances independently of occupancy_status."
        default: PROVISIONAL_COST_SHARE
      - name: current_care_level
        type: enum
        source: system
        description: "Care level actually delivered; set from the admitting unit's care_level and re-stamped on transfer. one of {NURSING, DOMICILIARY, ADULT_DAY_HEALTH}."
      - name: bed_hold_days_used
        type: integer
        source: system
        description: Cumulative bed-hold days consumed across all hospitalizations in the current stay; compared against BED_HOLD_MAX_DAYS.
        default: 0
      - name: bed_hold_started_on
        type: string
        source: system
        description: "Calendar date the MOST RECENT hospitalization of this stay began; null only before the first hospitalization. It is NOT cleared at readmission or at discharge, because the census run replays the closed bed-hold interval [bed_hold_started_on, last_hospitalization_end_date) when a hospitalization and its readmission both happen between two census runs. Use occupancy_status == HOSPITALIZED (or bed_hold_active) to test whether a hold is currently open - never the nullness of this field."
        default: null
      - name: bed_hold_active
        type: boolean
        source: computed
        description: "occupancy_status == HOSPITALIZED AND bed_hold_days_used < BED_HOLD_MAX_DAYS; drives CareUnit.held_bed_count."
        default: false
      - name: last_hospitalization_end_date
        type: string
        source: system
        description: Calendar date of the most recent readmission; null before the first readmission. Used by the bed-hold interval-overlap rule.
        default: null
      - name: hospitalization_count
        type: integer
        source: system
        description: Number of hospitalizations started during this stay.
        default: 0
      - name: readmission_count
        type: integer
        source: system
        description: Number of readmissions completed during this stay.
        default: 0
      - name: monthly_cost_share_cents
        type: integer
        source: computed
        description: monthly_cost_share_cents of the governing CostShareDetermination (see calculations.governing_cost_share_selector); 0 when none exists.
        default: 0
      - name: trust_fund_balance_cents
        type: integer
        source: computed
        description: Running balance of this resident's trust fund (see calculations.trust_fund_running_balance).
        default: 0
      - name: last_census_date
        type: string
        source: system
        description: Last calendar date for which a CensusDay row has been generated; null before the first census run.
        default: null
      - name: discharge_date
        type: string
        source: system
        description: Calendar date of discharge; null unless occupancy_status == DISCHARGED.
        default: null
      - name: discharge_reason
        type: enum
        source: input
        description: "Reason recorded at discharge; one of {null, DEATH, TRANSFER_OUT, VOLUNTARY, ADMINISTRATIVE, BED_HOLD_EXPIRED}. null before discharge."
        default: null

  - name: IncomeRecord
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident whose income this record states.
      - name: income_type
        type: enum
        source: input
        description: Source of the monthly income; fixes the countable rate.
        constraints: "one of {SSA, VA_PENSION, VA_COMPENSATION, MILITARY_RETIREMENT, OTHER}"
      - name: monthly_amount_cents
        type: integer
        source: input
        description: Gross monthly amount from this source.
        constraints: ">= 0"
      - name: effective_month
        type: string
        source: input
        description: Month the amount applies to, YYYY-MM; cost-share determinations only read records whose effective_month equals their own.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: countable_rate_bps
        type: integer
        source: computed
        description: COUNTABLE_RATE_BPS[income_type]; basis points of the gross amount that count toward cost share.
        default: 0
      - name: countable_amount_cents
        type: integer
        source: computed
        description: round_half_up(monthly_amount_cents * countable_rate_bps / 10000); the per-record rounded contribution.
        default: 0
      - name: verification_status
        type: enum
        source: system
        description: "Verification standing; one of {UNVERIFIED, VERIFIED, REJECTED}. PROVISIONAL cost share counts UNVERIFIED and VERIFIED; FINAL counts VERIFIED only."
        default: UNVERIFIED
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the BusinessOfficeManager who verified the record; null while UNVERIFIED.
        default: null

  - name: CostShareDetermination
    parent: Resident
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident this determination binds.
      - name: variant
        type: enum
        source: input
        description: "Which algorithm variant produced this row; one of {PROVISIONAL, FINAL}."
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: effective_month
        type: string
        source: input
        description: Month the determination governs, YYYY-MM.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: declared_medical_expense_cents
        type: integer
        source: input
        description: Medical expenses the resident declared for the month; only the FINAL variant deducts any of it.
        default: 0
        constraints: ">= 0"
      - name: gross_countable_income_cents
        type: integer
        source: computed
        description: Sum of per-record rounded countable_amount_cents over the variant's included verification statuses.
        default: 0
      - name: pna_deduction_cents
        type: integer
        source: computed
        description: VeteransHome.personal_needs_allowance_monthly_cents of the resident's home, subtracted before tiering.
        default: 0
      - name: income_tier
        type: enum
        source: computed
        description: "Tier selected from net income BEFORE the medical deduction; one of {TIER_1, TIER_2, TIER_3}. Pins the otherwise circular cap/tier dependency."
      - name: allowed_medical_deduction_cents
        type: integer
        source: computed
        description: 0 for PROVISIONAL; min(declared_medical_expense_cents, MEDICAL_CAP_BY_TIER_CENTS[income_tier]) for FINAL.
        default: 0
      - name: tiered_share_cents
        type: integer
        source: computed
        description: Marginal-band cost share on net income after the medical deduction, each band rounded then summed.
        default: 0
      - name: resident_day_count
        type: integer
        source: computed
        description: PROVISIONAL - calendar days from max(admission_date, first of month) through the last day of the month; FINAL - count of RESIDENT_DAY CensusDay rows in the month.
        default: 0
      - name: federal_per_diem_offset_cents
        type: integer
        source: computed
        description: 0 for PROVISIONAL; for FINAL the capped federal per diem offset (see calculations.resident_cost_share_monthly step 8).
        default: 0
      - name: monthly_cost_share_cents
        type: integer
        source: computed
        description: Final monthly cost share in cents after offset and (PROVISIONAL only) proration.
        default: 0
      - name: delta_from_prior_cents
        type: integer
        source: computed
        description: monthly_cost_share_cents minus the monthly_cost_share_cents of the prior governing determination for the same resident and effective_month; 0 when this is the first.
        default: 0
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the BusinessOfficeManager who ran the determination.

  - name: CarePlan
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident this plan governs.
      - name: supersedes_care_plan_id
        type: string
        source: input
        description: FK -> CarePlan.id; the plan this one replaces on activation. null for a first plan.
        default: null
      - name: care_level
        type: enum
        source: input
        description: Level of care the plan prescribes; a transfer requires an ACTIVE plan whose care_level equals the target unit's care_level.
        constraints: "one of {NURSING, DOMICILIARY, ADULT_DAY_HEALTH}"
      - name: adl_support_level
        type: enum
        source: input
        description: Prescribed intensity of ADL support.
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: plan_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the plan was authored; review_due_date is derived from it.
        constraints: ISO date, YYYY-MM-DD
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state; one of {DRAFT, ACTIVE, REVIEW_DUE, SUPERSEDED, VOID}."
        default: DRAFT
      - name: review_due_date
        type: string
        source: computed
        description: "null while the plan is DRAFT; stamped on activation of a DRAFT as plan_date + CARE_PLAN_REVIEW_DAYS (= 90) calendar days, and re-stamped as the current logical-clock date + CARE_PLAN_REVIEW_DAYS when a REVIEW_DUE plan is re-activated."
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClinicalAssessor who authored the plan.
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent activation; null while DRAFT.
        default: null
      - name: revision_number
        type: integer
        source: computed
        description: 1 for a plan with supersedes_care_plan_id == null; otherwise superseded plan's revision_number + 1.
        default: 1

  - name: CensusDay
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident this day is reported for.
      - name: care_unit_id
        type: string
        source: input
        description: FK -> CareUnit.id; the unit the resident occupied at 23:59:59 of service_date. Crosses the aggregate so a unit-month claim survives transfers.
      - name: per_diem_claim_id
        type: string
        source: system
        description: FK -> PerDiemClaim.id; the claim currently attributing this day. null when unattributed.
        default: null
      - name: service_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) being reported; unique per resident.
        constraints: ISO date, YYYY-MM-DD
      - name: census_class
        type: enum
        source: computed
        description: "Classification from the resident's occupancy_status at 23:59:59 of service_date; one of {RESIDENT_DAY, BED_HOLD_DAY, ABSENT_DAY}."
      - name: care_level
        type: enum
        source: computed
        description: "The care_unit's care_level on service_date; one of {NURSING, DOMICILIARY, ADULT_DAY_HEALTH}."
      - name: per_diem_eligible
        type: boolean
        source: computed
        description: "census_class IN {RESIDENT_DAY, BED_HOLD_DAY}; ABSENT_DAY rows are never payable."
        default: false
      - name: payable_rate_cents
        type: integer
        source: computed
        description: PER_DIEM_RATE_CENTS[care_level] for RESIDENT_DAY, round_half_up(rate * BED_HOLD_RATE_BPS / 10000) for BED_HOLD_DAY, 0 for ABSENT_DAY.
        default: 0
      - name: claimed
        type: boolean
        source: computed
        description: "per_diem_claim_id IS NOT NULL AND the referenced claim's status IN {SUBMITTED, PAID}."
        default: false

  - name: PerDiemClaim
    parent: VeteransHome
    common_fields: true
    fields:
      - name: veterans_home_id
        type: string
        source: input
        description: FK -> VeteransHome.id; the claiming home. Its recognition_status gates submission.
      - name: care_unit_id
        type: string
        source: input
        description: FK -> CareUnit.id; the unit whose census-month this claim covers.
      - name: corrects_claim_id
        type: string
        source: system
        description: FK -> PerDiemClaim.id; the earlier claim this one corrects. null for an original claim.
        default: null
      - name: claim_month
        type: string
        source: input
        description: Census month being claimed, YYYY-MM; must be strictly earlier than the current logical-clock month at submission.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: basis
        type: enum
        source: input
        description: "Which claim-amount variant to compute; one of {CENSUS_BASIS, AUDITED_BASIS}."
        default: AUDITED_BASIS
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state; one of {DRAFT, SUBMITTED, PAID, REJECTED, VOID}."
        default: DRAFT
      - name: resident_day_count
        type: integer
        source: computed
        description: Count of attributable RESIDENT_DAY CensusDay rows for the unit-month.
        default: 0
      - name: bed_hold_day_count
        type: integer
        source: computed
        description: Count of attributable BED_HOLD_DAY CensusDay rows for the unit-month, before the monthly payable cap.
        default: 0
      - name: billable_day_count
        type: integer
        source: computed
        description: Days actually billed under the selected basis (see calculations.per_diem_claim_amount).
        default: 0
      - name: claim_amount_cents
        type: integer
        source: computed
        description: Claimed amount in cents under the selected basis.
        default: 0
      - name: census_reported_resident_count
        type: integer
        source: computed
        description: Distinct resident_id values across the attributed CensusDay rows; submission requires >= 1.
        default: 0
      - name: recognition_verified
        type: boolean
        source: computed
        description: "True when the home's recognition_status == RECOGNIZED at the moment of computation."
        default: false
      - name: correction_generation
        type: integer
        source: computed
        description: 0 for an original claim; corrected claim's correction_generation + 1 otherwise.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission; null while DRAFT or VOID.
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: Logical-clock instant of adjudication; null until PAID or REJECTED.
        default: null
      - name: paid_amount_cents
        type: integer
        source: computed
        description: claim_amount_cents frozen at the PAID transition; 0 in every other status.
        default: 0
      - name: rejection_code
        type: enum
        source: input
        description: "Reason supplied by the auditor on rejection; one of {null, CENSUS_MISMATCH, RECOGNITION_LAPSE, DUPLICATE_PERIOD}. null unless status == REJECTED."
        default: null
      - name: adjudication_note
        type: string
        source: input
        description: Free-text auditor note captured at adjudication; null until adjudicated.
        default: null

  - name: TrustFundTransaction
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident whose trust fund this posting affects.
      - name: reverses_transaction_id
        type: string
        source: system
        description: FK -> TrustFundTransaction.id; the posting this REVERSAL undoes. null for every non-REVERSAL row.
        default: null
      - name: txn_type
        type: enum
        source: input
        description: "Posting type; one of {DEPOSIT, WITHDRAWAL, PNA_CREDIT, COST_SHARE_DEBIT, REVERSAL}. REVERSAL rows are only created by the reverse endpoint."
        constraints: "one of {DEPOSIT, WITHDRAWAL, PNA_CREDIT, COST_SHARE_DEBIT}"
      - name: amount_cents
        type: integer
        source: input
        description: Absolute magnitude of the posting.
        constraints: "> 0"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents for DEPOSIT and PNA_CREDIT, -amount_cents for WITHDRAWAL and COST_SHARE_DEBIT, and -(reversed row's signed_amount_cents) for REVERSAL."
        default: 0
      - name: effective_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the posting takes effect; primary sort key of the running balance.
        constraints: ISO date, YYYY-MM-DD
      - name: balance_after_cents
        type: integer
        source: computed
        description: Running balance after this posting in (effective_date ASC, created_at ASC) order.
        default: 0
      - name: reversed
        type: boolean
        source: computed
        description: True when another TrustFundTransaction row has reverses_transaction_id == this row's id.
        default: false
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who recorded the posting; the reversal segregation-of-duties check compares against it.
      - name: memo
        type: string
        source: input
        description: Free-text memo.
        default: null

state_machines:
  - entity: Applicant
    initial_state: SUBMITTED
    terminal_states: [ADMITTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /svh/applicants/{id}/eligibility-determination"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == SUBMITTED"
          - "applicant.discharge_character IN {HONORABLE, GENERAL}"
          - "applicant.service_days >= MIN_SERVICE_DAYS (= 90 days) OR applicant.nursing_care_for_service_connected == true"
          - "applicant.state_residency_years >= MIN_STATE_RESIDENCY_YEARS (= 1 year)"
        side_effects:
          - "sets applicant.eligibility_reason_code = ELIGIBLE"
          - "recomputes applicant.priority_class per calculations.applicant_priority_class"
          - "recomputes applicant.priority_score per calculations.applicant_priority_score"
          - "increments Applicant.version by 1"
        note: "The endpoint takes no decision field; the server derives ELIGIBLE vs INELIGIBLE from the three criteria above."
      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /svh/applicants/{id}/eligibility-determination"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == SUBMITTED"
          - "at least one of the three eligibility criteria fails"
        side_effects:
          - "sets applicant.eligibility_reason_code to the FIRST failing criterion in this pinned order: (1) DISCHARGE_CHARACTER_DISQUALIFYING, (2) SERVICE_DAYS_INSUFFICIENT, (3) RESIDENCY_INSUFFICIENT"
          - "sets applicant.priority_class = null and applicant.priority_score = 0"
          - "increments Applicant.version by 1"
      - from: INELIGIBLE
        to: SUBMITTED
        trigger: "POST /svh/applicants/{id}/eligibility-determination with at least one amended_* field"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == INELIGIBLE"
          - "at least one of amended_service_days, amended_state_residency_years, amended_discharge_character is present"
          - "applicant.redetermination_count < MAX_REDETERMINATIONS (= 2)"
        side_effects:
          - "overwrites applicant.service_days / state_residency_years / discharge_character with each supplied amended_* value"
          - "increments applicant.redetermination_count by 1"
          - "sets applicant.status = SUBMITTED and applicant.eligibility_reason_code = null"
          - "increments Applicant.version by 1"
          - "the same request then immediately re-evaluates the criteria, taking SUBMITTED->ELIGIBLE or SUBMITTED->INELIGIBLE in the same call (second Applicant.version increment)"
        note: "This is the redetermination cycle: INELIGIBLE -> SUBMITTED -> {ELIGIBLE | INELIGIBLE}. redetermination_count makes the loop count observable and MAX_REDETERMINATIONS terminates it."
      - from: ELIGIBLE
        to: WAITLISTED
        trigger: "POST /svh/waitlist-entries"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == ELIGIBLE"
          - "applicant.requested_care_level == care_unit.care_level"
          - "care_unit.certification_status != DECERTIFIED"
          - "no WaitlistEntry exists with the same applicant_id and care_unit_id whose status IN {ACTIVE, OFFERED}"
        side_effects:
          - "creates WaitlistEntry with status = ACTIVE, listed_at = current logical clock"
          - "sets applicant.status = WAITLISTED"
          - "increments care_unit.waitlist_active_count by 1 and increments CareUnit.version by 1"
          - "recomputes queue_position for every ACTIVE/OFFERED WaitlistEntry on that care unit per calculations.waitlist_queue_order"
      - from: WAITLISTED
        to: WAITLISTED
        trigger: "POST /svh/waitlist-entries for a SECOND care unit"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == WAITLISTED"
          - "applicant.requested_care_level == care_unit.care_level"
          - "care_unit.certification_status != DECERTIFIED"
          - "no WaitlistEntry exists with the same applicant_id and care_unit_id whose status IN {ACTIVE, OFFERED}"
        side_effects:
          - "creates a further WaitlistEntry with status = ACTIVE, listed_at = current logical clock"
          - "leaves applicant.status at WAITLISTED"
          - "increments care_unit.waitlist_active_count by 1 and increments CareUnit.version by 1 on the newly joined unit only"
          - "recomputes queue_position for every ACTIVE/OFFERED WaitlistEntry on the newly joined care unit"
        note: "Self-loop on the queueing dimension: one applicant may hold ACTIVE entries on several units of the same care level at once, which is what makes the ADMITTED cascade's cancellation of the applicant's entries on OTHER units reachable."
      - from: WAITLISTED
        to: ADMITTED
        trigger: "POST /svh/applicants/{id}/admission-decision with decision = APPROVED"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == WAITLISTED"
          - "payload.expected_care_unit_version == care_unit.version"
          - "X-User-ID != clinical_assessment.assessor_user_id (segregation of duties)"
          - "clinical_assessment.applicant_id == applicant.id AND clinical_assessment.status == SUBMITTED"
          - "care_unit.certification_status == CERTIFIED"
          - "care_unit.operational_posture == OPEN"
          - "clinical_assessment.assessed_care_level == care_unit.care_level"
          - "care_unit.available_bed_count >= 1"
        side_effects:
          - "sets applicant.status = ADMITTED, applicant.decided_by_user_id = X-User-ID"
          - "sets clinical_assessment.status = ACCEPTED"
          - "creates Resident with occupancy_status = ADMITTED, billing_status = PROVISIONAL_COST_SHARE, current_care_level = care_unit.care_level"
          - "sets the applicant's WaitlistEntry on this care unit to ADMITTED, and every other ACTIVE/OFFERED WaitlistEntry of this applicant on other units to CANCELLED"
          - "CASCADE HOP 1: increments care_unit.occupied_bed_count by 1, which decrements care_unit.available_bed_count by 1, and increments CareUnit.version by 1"
          - "CASCADE HOP 2: because available_bed_count reached 0, care_unit.operational_posture is recomputed from OPEN to RESTRICTED"
          - "CASCADE HOP 3: because operational_posture became RESTRICTED, every OFFERED WaitlistEntry on that unit reverts to ACTIVE with offer_expires_at = null and the owning Applicant.declined_offer_count left unchanged (a posture revocation is not a decline)"
          - "creates a DRAFT CarePlan is NOT performed - care planning is an explicit follow-up call"
      - from: WAITLISTED
        to: DENIED
        trigger: "POST /svh/applicants/{id}/admission-decision with decision = DENIED"
        actor: AdmissionsCoordinator
        preconditions:
          - "applicant.status == WAITLISTED"
          - "payload.expected_care_unit_version == care_unit.version"
          - "X-User-ID != clinical_assessment.assessor_user_id (segregation of duties)"
          - "clinical_assessment.applicant_id == applicant.id AND clinical_assessment.status == SUBMITTED"
        side_effects:
          - "sets applicant.status = DENIED, applicant.decided_by_user_id = X-User-ID"
          - "sets clinical_assessment.status = REJECTED and clinical_assessment.rejection_reason = ADMISSION_DENIED"
          - "sets every ACTIVE/OFFERED WaitlistEntry of this applicant to CANCELLED and decrements each affected care_unit.waitlist_active_count by 1"
          - "increments CareUnit.version by 1 on every affected care unit (no bed counts change)"
        note: "Divergent branch of the same fork: no Resident is created, no bed is consumed, and the assessment lands REJECTED instead of ACCEPTED. Response data is null on this branch."

  - entity: ClinicalAssessment
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /svh/clinical-assessments/{id}/submit"
        actor: ClinicalAssessor
        preconditions:
          - "assessment.status == DRAFT"
          - "applicant.status IN {ELIGIBLE, WAITLISTED}"
          - "assessment.skilled_nursing_hours_per_day >= 2.00 when assessment.assessed_care_level == NURSING"
        side_effects:
          - "sets assessment.status = SUBMITTED"
          - "recomputes assessment.acuity_points"
          - "recomputes the applicant's priority_score (the acuity_points term becomes non-zero) and re-orders every queue the applicant sits in"
          - "increments ClinicalAssessment.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system event: Applicant WAITLISTED->ADMITTED side effect"
        actor: system
        preconditions:
          - "assessment.status == SUBMITTED"
          - "the admission decision cites this assessment_id"
        side_effects:
          - "sets assessment.status = ACCEPTED"
          - "increments ClinicalAssessment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system event: Applicant WAITLISTED->DENIED side effect"
        actor: system
        preconditions:
          - "assessment.status == SUBMITTED"
          - "the admission decision cites this assessment_id"
        side_effects:
          - "sets assessment.status = REJECTED and rejection_reason = ADMISSION_DENIED"
          - "increments ClinicalAssessment.version by 1"

  - entity: WaitlistEntry
    initial_state: ACTIVE
    terminal_states: [ADMITTED, EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: OFFERED
        trigger: "POST /svh/_ops/census-run (step 4)"
        actor: system
        preconditions:
          - "entry.status == ACTIVE"
          - "care_unit.operational_posture == OPEN"
          - "care_unit.available_bed_count >= 1"
          - "entry.queue_position == 1 for its care unit"
          - "no other WaitlistEntry on that care unit has status == OFFERED"
        side_effects:
          - "sets entry.status = OFFERED and entry.offer_expires_at = current logical clock + OFFER_WINDOW_DAYS (= 7) days"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /svh/_ops/census-run (step 4)"
        actor: system
        preconditions:
          - "entry.status == OFFERED"
          - "current logical clock > entry.offer_expires_at"
        side_effects:
          - "sets entry.status = ACTIVE and entry.offer_expires_at = null"
          - "increments the owning applicant.declined_offer_count by 1"
          - "recomputes applicant.priority_score, subtracting DECLINED_OFFER_PENALTY_POINTS per declined offer, floored at CLASS_BASE_POINTS[priority_class]"
          - "recomputes queue_position for every ACTIVE/OFFERED entry on that care unit"
          - "increments WaitlistEntry.version by 1"
        note: "This is the offer decline cycle ACTIVE -> OFFERED -> ACTIVE; the applicant keeps their place in line but at a penalised score."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /svh/_ops/census-run (step 4)"
        actor: system
        preconditions:
          - "entry.status == ACTIVE"
          - "applicant.declined_offer_count >= MAX_DECLINED_OFFERS (= 3)"
        side_effects:
          - "sets entry.status = EXPIRED and entry.queue_position = 0"
          - "decrements care_unit.waitlist_active_count by 1 and increments CareUnit.version by 1"
      - from: ACTIVE
        to: ADMITTED
        trigger: "system event: Applicant WAITLISTED->ADMITTED side effect on this entry's care unit"
        actor: system
        preconditions: ["entry.status == ACTIVE", "entry.care_unit_id == the admitting care unit"]
        side_effects:
          - "sets entry.status = ADMITTED and entry.queue_position = 0"
          - "decrements care_unit.waitlist_active_count by 1"
      - from: OFFERED
        to: ADMITTED
        trigger: "system event: Applicant WAITLISTED->ADMITTED side effect on this entry's care unit"
        actor: system
        preconditions: ["entry.status == OFFERED", "entry.care_unit_id == the admitting care unit"]
        side_effects:
          - "sets entry.status = ADMITTED, offer_expires_at = null, queue_position = 0"
          - "decrements care_unit.waitlist_active_count by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system event: Applicant WAITLISTED->ADMITTED (other unit) or WAITLISTED->DENIED side effect"
        actor: system
        preconditions: ["entry.status == ACTIVE"]
        side_effects:
          - "sets entry.status = CANCELLED and queue_position = 0"
          - "decrements care_unit.waitlist_active_count by 1 and increments CareUnit.version by 1"
      - from: OFFERED
        to: CANCELLED
        trigger: "system event: Applicant WAITLISTED->ADMITTED (other unit) or WAITLISTED->DENIED side effect"
        actor: system
        preconditions: ["entry.status == OFFERED"]
        side_effects:
          - "sets entry.status = CANCELLED, offer_expires_at = null, queue_position = 0"
          - "decrements care_unit.waitlist_active_count by 1 and increments CareUnit.version by 1"

  - entity: Resident
    initial_state: ADMITTED
    terminal_states: [DISCHARGED]
    transitions:
      - from: ADMITTED
        to: HOSPITALIZED
        trigger: "POST /svh/residents/{id}/hospitalization"
        actor: ClinicalAssessor
        preconditions:
          - "resident.occupancy_status == ADMITTED"
          - "payload.hospitalization_start_date >= resident.admission_date"
          - "resident.last_hospitalization_end_date IS NULL OR payload.hospitalization_start_date > resident.last_hospitalization_end_date (bed-hold intervals are half-open [start, readmission_date) and MUST NOT overlap; zero-gap adjacency is allowed)"
          - "resident.bed_hold_days_used < BED_HOLD_MAX_DAYS"
        side_effects:
          - "sets resident.occupancy_status = HOSPITALIZED, bed_hold_started_on = payload.hospitalization_start_date"
          - "increments resident.hospitalization_count by 1"
          - "sets resident.bed_hold_active = true (bed_hold_days_used still < BED_HOLD_MAX_DAYS)"
          - "CASCADE: decrements care_unit.occupied_bed_count by 1 AND increments care_unit.held_bed_count by 1, leaving care_unit.available_bed_count unchanged; increments CareUnit.version by 1"
          - "increments Resident.version by 1"
        note: "occupancy dimension only; billing_status is untouched."
      - from: HOSPITALIZED
        to: ADMITTED
        trigger: "POST /svh/residents/{id}/readmission"
        actor: ClinicalAssessor
        preconditions:
          - "resident.occupancy_status == HOSPITALIZED"
          - "payload.readmission_date > resident.bed_hold_started_on"
          - "resident.bed_hold_days_used + days_between(resident.bed_hold_started_on, payload.readmission_date) <= BED_HOLD_MAX_DAYS"
          - "care_unit.certification_status != DECERTIFIED"
        side_effects:
          - "sets resident.occupancy_status = ADMITTED and last_hospitalization_end_date = payload.readmission_date; bed_hold_started_on is LEFT IN PLACE so the closed interval [bed_hold_started_on, last_hospitalization_end_date) stays replayable by the census run"
          - "sets resident.bed_hold_days_used += days_between(bed_hold_started_on, payload.readmission_date)"
          - "increments resident.readmission_count by 1"
          - "CASCADE: decrements care_unit.held_bed_count by 1 AND increments care_unit.occupied_bed_count by 1, leaving care_unit.available_bed_count unchanged; increments CareUnit.version by 1"
          - "increments Resident.version by 1"
        note: "Occupancy cycle ADMITTED -> HOSPITALIZED -> ADMITTED. The compensating pair conserves occupied_bed_count + held_bed_count exactly."
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /svh/residents/{id}/discharge"
        actor: AdmissionsCoordinator
        preconditions:
          - "resident.occupancy_status == ADMITTED"
          - "payload.discharge_date >= resident.admission_date"
          - "payload.discharge_reason != BED_HOLD_EXPIRED"
        side_effects:
          - "sets resident.occupancy_status = DISCHARGED, discharge_date, discharge_reason, billing_status = CLOSED"
          - "sets every DRAFT CarePlan of this resident to VOID and every ACTIVE/REVIEW_DUE CarePlan to SUPERSEDED"
          - "CASCADE HOP 1: decrements care_unit.occupied_bed_count by 1 and increments CareUnit.version by 1"
          - "CASCADE HOP 2: because occupied_bed_count fell, care_unit.available_bed_count increases by 1"
          - "CASCADE HOP 3: because available_bed_count became >= 1 (and certification_status == CERTIFIED), care_unit.operational_posture is recomputed from RESTRICTED to OPEN"
          - "increments Resident.version by 1"
        note: "The next census run turns HOP 3 into a bed offer (WaitlistEntry ACTIVE->OFFERED requires posture OPEN)."
      - from: HOSPITALIZED
        to: DISCHARGED
        trigger: "POST /svh/residents/{id}/discharge"
        actor: AdmissionsCoordinator
        preconditions:
          - "resident.occupancy_status == HOSPITALIZED"
          - "payload.discharge_date >= resident.bed_hold_started_on"
        side_effects:
          - "sets resident.occupancy_status = DISCHARGED, discharge_date, discharge_reason, billing_status = CLOSED, bed_hold_active = false"
          - "CASCADE HOP 1: decrements care_unit.held_bed_count by 1 and increments CareUnit.version by 1"
          - "CASCADE HOP 2: because held_bed_count fell, care_unit.available_bed_count increases by 1"
          - "CASCADE HOP 3: because available_bed_count became >= 1, care_unit.operational_posture is recomputed toward OPEN"
          - "increments Resident.version by 1"
      - from: ADMITTED
        to: ADMITTED
        trigger: "POST /svh/residents/{id}/transfer"
        actor: AdmissionsCoordinator
        preconditions:
          - "resident.occupancy_status == ADMITTED"
          - "payload.target_care_unit_id != resident.care_unit_id"
          - "target_care_unit.veterans_home_id == source_care_unit.veterans_home_id"
          - "target_care_unit.certification_status == CERTIFIED"
          - "target_care_unit.operational_posture != FROZEN"
          - "target_care_unit.available_bed_count >= 1"
          - "an ACTIVE CarePlan exists for this resident whose care_level == target_care_unit.care_level"
        side_effects:
          - "sets resident.care_unit_id = payload.target_care_unit_id and resident.current_care_level = target_care_unit.care_level"
          - "decrements source_care_unit.occupied_bed_count by 1 and increments target_care_unit.occupied_bed_count by 1; both units' available_bed_count and operational_posture are recomputed; increments both CareUnit.version values by 1"
          - "CensusDay rows already generated keep their original care_unit_id; rows generated from the transfer date forward carry the target unit"
          - "increments Resident.version by 1"
        note: "Self-loop on the occupancy dimension: the state label is unchanged but bed accounting moves between two units, conserving the cross-unit total of occupied_bed_count + held_bed_count."
      - from: PROVISIONAL_COST_SHARE
        to: FINAL_COST_SHARE
        trigger: "POST /svh/residents/{id}/cost-share-determinations with variant = FINAL"
        actor: BusinessOfficeManager
        preconditions:
          - "resident.billing_status == PROVISIONAL_COST_SHARE"
          - "payload.expected_resident_version == resident.version"
          - "resident.occupancy_status != DISCHARGED"
          - "at least one IncomeRecord of this resident with effective_month == payload.effective_month has verification_status == VERIFIED"
        side_effects:
          - "creates a CostShareDetermination with variant = FINAL"
          - "sets resident.billing_status = FINAL_COST_SHARE"
          - "recomputes resident.monthly_cost_share_cents from the new governing determination"
          - "increments Resident.version by 1"
        note: "billing dimension; the occupancy dimension is untouched, so a HOSPITALIZED resident can also make this move."
      - from: FINAL_COST_SHARE
        to: FINAL_COST_SHARE
        trigger: "POST /svh/residents/{id}/cost-share-determinations with variant = FINAL for a later or equal effective_month"
        actor: BusinessOfficeManager
        preconditions:
          - "resident.billing_status == FINAL_COST_SHARE"
          - "payload.expected_resident_version == resident.version"
          - "resident.occupancy_status != DISCHARGED"
        side_effects:
          - "creates a new CostShareDetermination that supersedes the prior governing one for that effective_month and records delta_from_prior_cents"
          - "recomputes resident.monthly_cost_share_cents"
          - "increments Resident.version by 1"

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /svh/care-plans/{id}/activate"
        actor: ClinicalAssessor
        preconditions:
          - "plan.status == DRAFT"
          - "resident.occupancy_status != DISCHARGED"
          - "plan.supersedes_care_plan_id IS NULL OR the referenced plan belongs to the same resident and its status IN {ACTIVE, REVIEW_DUE}"
          - "if plan.supersedes_care_plan_id IS NULL then this resident has no CarePlan with status IN {ACTIVE, REVIEW_DUE}"
        side_effects:
          - "sets plan.status = ACTIVE, activated_at = current logical clock, review_due_date = current logical-clock date + CARE_PLAN_REVIEW_DAYS (= 90) days"
          - "sets the superseded plan's status = SUPERSEDED when supersedes_care_plan_id is present"
          - "sets plan.revision_number = superseded plan's revision_number + 1 (1 when there is none)"
          - "increments CarePlan.version by 1 on both plans"
      - from: ACTIVE
        to: REVIEW_DUE
        trigger: "POST /svh/_ops/census-run (step 5)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.review_due_date < payload.through_date"
        side_effects:
          - "sets plan.status = REVIEW_DUE"
          - "increments CarePlan.version by 1"
      - from: REVIEW_DUE
        to: ACTIVE
        trigger: "POST /svh/care-plans/{id}/activate on the SAME plan"
        actor: ClinicalAssessor
        preconditions:
          - "plan.status == REVIEW_DUE"
          - "resident.occupancy_status != DISCHARGED"
        side_effects:
          - "sets plan.status = ACTIVE and review_due_date = current logical-clock date + CARE_PLAN_REVIEW_DAYS days"
          - "increments CarePlan.version by 1"
        note: "Review cycle ACTIVE -> REVIEW_DUE -> ACTIVE on one row; revision_number does NOT change because no new plan was authored."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another CarePlan citing this one via supersedes_care_plan_id is activated, or the resident is discharged"
        actor: system
        preconditions: ["plan.status == ACTIVE"]
        side_effects:
          - "sets plan.status = SUPERSEDED"
          - "increments CarePlan.version by 1"
      - from: REVIEW_DUE
        to: SUPERSEDED
        trigger: "system event: another CarePlan citing this one via supersedes_care_plan_id is activated, or the resident is discharged"
        actor: system
        preconditions: ["plan.status == REVIEW_DUE"]
        side_effects:
          - "sets plan.status = SUPERSEDED"
          - "increments CarePlan.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "system event: Resident ADMITTED|HOSPITALIZED -> DISCHARGED side effect"
        actor: system
        preconditions: ["plan.status == DRAFT"]
        side_effects:
          - "sets plan.status = VOID"
          - "increments CarePlan.version by 1"

  - entity: CareUnit
    initial_state: CERTIFIED
    terminal_states: []
    transitions:
      - from: CERTIFIED
        to: CONDITIONAL
        trigger: "POST /svh/care-units/{id}/survey-result"
        actor: SurveyAgency
        preconditions:
          - "CERTIFICATION_CONDITIONAL_THRESHOLD <= survey_compliance_score < CERTIFICATION_DECERTIFY_THRESHOLD"
          - "no deficiency in the payload has severity == IMMEDIATE_JEOPARDY"
        side_effects:
          - "sets certification_status = CONDITIONAL, last_survey_compliance_score, last_survey_date"
          - "sets veterans_home.last_survey_date"
          - "recomputes operational_posture to RESTRICTED (CONDITIONAL always restricts, regardless of bed availability)"
          - "increments CareUnit.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /svh/care-units/{id}/survey-result"
        actor: SurveyAgency
        preconditions:
          - "survey_compliance_score >= CERTIFICATION_DECERTIFY_THRESHOLD OR any deficiency has severity == IMMEDIATE_JEOPARDY"
        side_effects:
          - "CASCADE HOP 1: sets certification_status = DECERTIFIED, last_survey_compliance_score, last_survey_date; increments CareUnit.version by 1"
          - "CASCADE HOP 2: because certification_status became DECERTIFIED, operational_posture is recomputed to FROZEN"
          - "CASCADE HOP 3: because this unit is now counted in veterans_home.decertified_unit_count (>= 1), veterans_home.recognition_status moves RECOGNIZED -> SUSPENDED with recognition_suspended_reason = UNIT_DECERTIFIED; increments VeteransHome.version by 1"
          - "CASCADE HOP 4: because the home's recognition_status became SUSPENDED, every PerDiemClaim of that home whose status == DRAFT is set to VOID and each such claim's version increments by 1"
      - from: CONDITIONAL
        to: CERTIFIED
        trigger: "POST /svh/care-units/{id}/survey-result"
        actor: SurveyAgency
        preconditions:
          - "survey_compliance_score == 0"
        side_effects:
          - "sets certification_status = CERTIFIED, last_survey_compliance_score = 0, last_survey_date"
          - "recomputes operational_posture from bed availability alone"
          - "increments CareUnit.version by 1"
        note: "Survey cycle CERTIFIED -> CONDITIONAL -> CERTIFIED on one row."
      - from: CONDITIONAL
        to: DECERTIFIED
        trigger: "POST /svh/care-units/{id}/survey-result"
        actor: SurveyAgency
        preconditions:
          - "survey_compliance_score >= CERTIFICATION_DECERTIFY_THRESHOLD OR any deficiency has severity == IMMEDIATE_JEOPARDY"
        side_effects:
          - "same four cascade hops as CERTIFIED -> DECERTIFIED"
      - from: DECERTIFIED
        to: CONDITIONAL
        trigger: "POST /svh/care-units/{id}/survey-result"
        actor: SurveyAgency
        preconditions:
          - "survey_compliance_score < CERTIFICATION_DECERTIFY_THRESHOLD"
          - "no deficiency in the payload has severity == IMMEDIATE_JEOPARDY"
        side_effects:
          - "CASCADE HOP 1: sets certification_status = CONDITIONAL, last_survey_compliance_score, last_survey_date; increments CareUnit.version by 1"
          - "CASCADE HOP 2: because certification_status left DECERTIFIED, operational_posture is recomputed from FROZEN to RESTRICTED"
          - "CASCADE HOP 3: because veterans_home.decertified_unit_count fell to 0, veterans_home.recognition_status moves SUSPENDED -> RECOGNIZED with recognition_suspended_reason = null; increments VeteransHome.version by 1"
        note: "Reinstatement never jumps straight back to CERTIFIED; a decertified unit must pass through CONDITIONAL."

  - entity: VeteransHome
    initial_state: RECOGNIZED
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: RECOGNIZED
        trigger: "POST /svh/veterans-homes/{id}/recognition with action = GRANT"
        actor: StateProgramAdmin
        preconditions:
          - "home.recognition_status == PROVISIONAL"
          - "home.decertified_unit_count == 0"
        side_effects:
          - "sets recognition_status = RECOGNIZED, recognition_effective_date = current logical-clock date"
          - "increments VeteransHome.version by 1"
        note: "PROVISIONAL is only reachable as a creation-time input value; this transition is the only exit."
      - from: RECOGNIZED
        to: SUSPENDED
        trigger: "system event: CareUnit -> DECERTIFIED cascade hop 3; also reachable directly via POST /svh/veterans-homes/{id}/recognition with action = SUSPEND"
        actor: system
        preconditions: ["home.recognition_status == RECOGNIZED", "home.decertified_unit_count >= 1 when reached by cascade; no unit precondition when reached by an explicit SUSPEND action"]
        side_effects:
          - "sets recognition_status = SUSPENDED, recognition_suspended_reason = UNIT_DECERTIFIED, recognition_effective_date = current logical-clock date"
          - "voids every DRAFT PerDiemClaim of this home"
          - "increments VeteransHome.version by 1"
      - from: SUSPENDED
        to: RECOGNIZED
        trigger: "system event: CareUnit DECERTIFIED -> CONDITIONAL cascade hop 3; also reachable directly via POST /svh/veterans-homes/{id}/recognition with action = RESTORE"
        actor: system
        preconditions: ["home.recognition_status == SUSPENDED", "home.decertified_unit_count == 0"]
        side_effects:
          - "sets recognition_status = RECOGNIZED, recognition_suspended_reason = null, recognition_effective_date = current logical-clock date"
          - "increments VeteransHome.version by 1"
        note: "Already-VOID claims are NOT resurrected; a new claim must be created for the month."

  - entity: PerDiemClaim
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /svh/per-diem-claims/{id}/submit"
        actor: BusinessOfficeManager
        preconditions:
          - "claim.status == DRAFT"
          - "veterans_home.recognition_status == RECOGNIZED"
          - "care_unit.certification_status != DECERTIFIED"
          - "claim.claim_month is strictly earlier than the current logical-clock month"
          - "claim.census_reported_resident_count >= 1"
          - "claim.billable_day_count >= 1"
        side_effects:
          - "sets claim.status = SUBMITTED, submitted_at = current logical clock, recognition_verified = true"
          - "recomputes resident_day_count, bed_hold_day_count, billable_day_count and claim_amount_cents from the census set at submission time"
          - "sets per_diem_claim_id = claim.id on every attributed CensusDay row, so each row's claimed flag becomes true"
          - "increments PerDiemClaim.version by 1"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /svh/per-diem-claims/{id}/adjudicate with outcome = PAID"
        actor: FederalPerDiemAuditor
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "sets claim.status = PAID, adjudicated_at, paid_amount_cents = claim.claim_amount_cents"
          - "leaves every attributed CensusDay row pointing at this claim, permanently consuming those days"
          - "increments PerDiemClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /svh/per-diem-claims/{id}/adjudicate with outcome = REJECTED"
        actor: FederalPerDiemAuditor
        preconditions:
          - "claim.status == SUBMITTED"
          - "payload.rejection_code is present"
        side_effects:
          - "sets claim.status = REJECTED, adjudicated_at, rejection_code, paid_amount_cents = 0"
          - "sets per_diem_claim_id = null on every CensusDay row attributed to this claim, restoring the unclaimed-day pool exactly"
          - "increments PerDiemClaim.version by 1"
        note: "Divergent branch of the SUBMITTED fork: PAID consumes census days and freezes paid_amount_cents; REJECTED releases the days and leaves paid_amount_cents at 0."
      - from: DRAFT
        to: VOID
        trigger: "system event: VeteransHome RECOGNIZED->SUSPENDED cascade hop 4"
        actor: system
        preconditions: ["claim.status == DRAFT"]
        side_effects:
          - "sets claim.status = VOID"
          - "sets per_diem_claim_id = null on every CensusDay row attributed to this claim"
          - "increments PerDiemClaim.version by 1"

concurrency_rules:
  - rule_id: admission-decision-stale-care-unit
    parent_entity: CareUnit
    write_endpoint: "POST /svh/applicants/{id}/admission-decision"
    occ_field: "expected_care_unit_version"
    description: |
      Recording an admission decision against a CareUnit whose version has advanced since the client
      last observed it is rejected with a stale-version error. This captures the case where another
      writer has already consumed the last bed (or listed another applicant on the same queue, which
      also bumps the unit's version), so the deciding client's view of available_bed_count and
      operational_posture is out of date.
    error_id: ERR_CARE_UNIT_VERSION_STALE
    http_status: 412
  - rule_id: cost-share-determination-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /svh/residents/{id}/cost-share-determinations"
    occ_field: "expected_resident_version"
    description: |
      Creating a CostShareDetermination against a Resident whose version has advanced since the client
      last observed it is rejected with a stale-version error. A new determination legitimately
      supersedes the prior governing one for the same effective_month, so the write cannot be resolved
      by a state precondition - the loser's determination would silently overwrite a determination it
      never saw.
    error_id: ERR_RESIDENT_VERSION_STALE
    http_status: 412
  - rule_id: correcting-claim-stale-claim
    parent_entity: PerDiemClaim
    write_endpoint: "POST /svh/per-diem-claims/{id}/correct"
    occ_field: "expected_claim_version"
    description: |
      Creating a correcting claim against a PerDiemClaim whose version has advanced since the client
      last observed it is rejected with a stale-version error. A correcting claim legitimately
      supersedes the corrected claim's census attribution, so a second correction built on a stale
      view of the target would double-attribute the same census days.
    error_id: ERR_CLAIM_VERSION_STALE
    http_status: 412

calculations:
  - name: applicant_priority_class
    trigger: "Every Applicant eligibility determination (SUBMITTED->ELIGIBLE), and every recomputation of applicant_priority_score."
    algorithm: threshold
    formula: |
      if applicant.service_connected_disability_pct >= 70
         OR applicant.nursing_care_for_service_connected == true:
          priority_class = CLASS_1
      elif applicant.wartime_service == true AND applicant.state_residency_years >= 5:
          priority_class = CLASS_2
      elif applicant.state_residency_years >= 2:
          priority_class = CLASS_3
      else:
          priority_class = CLASS_4
      # Branches are evaluated top-down and the FIRST match wins; a CLASS_1 applicant is never
      # re-tested against the CLASS_2 predicate.
    input_set: "The Applicant row's own service/residency fields only; no other entity participates."
    constants:
      CLASS_1_DISABILITY_PCT_THRESHOLD: 70
      CLASS_2_RESIDENCY_YEARS_THRESHOLD: 5
      CLASS_3_RESIDENCY_YEARS_THRESHOLD: 2
    precision: "integer enum selection; boundaries are inclusive (>= 70, >= 5, >= 2)"

  - name: applicant_priority_score
    trigger: "Applicant SUBMITTED->ELIGIBLE; ClinicalAssessment DRAFT->SUBMITTED; WaitlistEntry OFFERED->ACTIVE (decline penalty); POST /svh/_ops/census-run step 4 (tenure advance)."
    algorithm: weighted_scoring
    formula: |
      base            = CLASS_BASE_POINTS[applicant.priority_class]
      disability_pts  = min(applicant.service_connected_disability_pct, 100) * DISABILITY_POINTS_PER_PCT
      residency_pts   = min(applicant.state_residency_years, RESIDENCY_POINTS_CAP_YEARS) * RESIDENCY_POINTS_PER_YEAR
      # acuity selector: the applicant's ClinicalAssessment with the greatest created_at among rows
      # whose status IN {SUBMITTED, ACCEPTED}. If that set is empty, acuity_pts = 0.
      acuity_pts      = 0 if no such assessment else
                        min(a.adl_dependency_count, 6) * ADL_POINTS_PER_DEPENDENCY
                        + (COGNITIVE_IMPAIRMENT_POINTS if a.cognitive_impairment else 0)
                        + (BEHAVIORAL_RISK_POINTS if a.behavioral_risk_flag else 0)
      tenure_days     = days_between(applicant.application_received_date, date(current_logical_clock))
      tenure_pts      = min(max(tenure_days, 0), TENURE_POINTS_CAP_DAYS) * TENURE_POINTS_PER_DAY
      penalty         = applicant.declined_offer_count * DECLINED_OFFER_PENALTY_POINTS
      raw             = base + disability_pts + residency_pts + acuity_pts + tenure_pts - penalty
      priority_score  = max(base, raw)      # score floor: never below the class base
    input_set: "The Applicant row plus at most ONE ClinicalAssessment (greatest created_at with status IN {SUBMITTED, ACCEPTED}); DRAFT and REJECTED assessments contribute nothing."
    constants:
      CLASS_BASE_POINTS: { CLASS_1: 1000, CLASS_2: 700, CLASS_3: 400, CLASS_4: 100 }
      DISABILITY_POINTS_PER_PCT: 3
      RESIDENCY_POINTS_PER_YEAR: 5
      RESIDENCY_POINTS_CAP_YEARS: 20
      ADL_POINTS_PER_DEPENDENCY: 20
      COGNITIVE_IMPAIRMENT_POINTS: 40
      BEHAVIORAL_RISK_POINTS: -30
      TENURE_POINTS_PER_DAY: 1
      TENURE_POINTS_CAP_DAYS: 365
      DECLINED_OFFER_PENALTY_POINTS: 25
    precision: "integer points, no rounding (every term is an integer product)"
    variants: []
    note: |
      Combinatorial mode (a): five terms interact non-linearly through three min() caps, two boolean
      branches, one negative weight and an outer max() floor, so the score is NOT a linear function of
      any single input - raising declined_offer_count past the floor point stops changing the result.

  - name: waitlist_queue_order
    trigger: "WaitlistEntry creation, every WaitlistEntry status change, every applicant_priority_score recomputation, and POST /svh/_ops/census-run step 4."
    algorithm: chronological
    formula: |
      candidate_set = WaitlistEntry rows w where w.care_unit_id == unit.id
                      AND w.status IN {ACTIVE, OFFERED}
      ranking       = ORDER BY applicant.priority_score DESC,
                               applicant.application_received_date ASC,
                               w.created_at ASC
      queue_position = 1-based index in `ranking`
      # Entries whose status is ADMITTED, EXPIRED or CANCELLED are removed from the candidate set and
      # have queue_position forced to 0.
      # Offer selector: the single entry at queue_position == 1.
      # Tie-break chain is exhaustive: created_at is unique per row, and `id` is NEVER consulted.
      # Empty-candidate fallback: no offer is made and offered_waitlist_entry_count stays 0 (no error).
    input_set: "WaitlistEntry rows with status IN {ACTIVE, OFFERED} for one care unit, joined to their Applicant for the sort keys."
    constants: {}
    precision: "integer positions starting at 1"

  - name: care_unit_bed_availability
    trigger: "Any change to a Resident's occupancy_status or care_unit_id; CareUnit creation; POST /svh/care-units/{id}/survey-result."
    algorithm: aggregation
    formula: |
      occupied_bed_count = count(Resident r : r.care_unit_id == unit.id
                                 AND r.occupancy_status == ADMITTED)
      held_bed_count     = count(Resident r : r.care_unit_id == unit.id
                                 AND r.occupancy_status == HOSPITALIZED
                                 AND r.bed_hold_days_used < BED_HOLD_MAX_DAYS)
      available_bed_count = unit.licensed_bed_count
                            - unit.out_of_service_bed_count
                            - occupied_bed_count
                            - held_bed_count
      # DISCHARGED residents are excluded from both counts. A HOSPITALIZED resident whose
      # bed_hold_days_used has reached BED_HOLD_MAX_DAYS is excluded from held_bed_count, which
      # RELEASES the bed even though the resident row is not yet DISCHARGED.
      # Bed conservation invariant (exact, no drift):
      #   occupied_bed_count + held_bed_count + available_bed_count + out_of_service_bed_count
      #     == licensed_bed_count
    input_set: "All Resident rows pointing at the unit, filtered to occupancy_status IN {ADMITTED, HOSPITALIZED}."
    constants:
      BED_HOLD_MAX_DAYS: 30
    precision: "integer bed counts; available_bed_count may not be clamped - a negative value is a defect"

  - name: care_unit_operational_posture
    trigger: "Every recomputation of care_unit_bed_availability and every CareUnit certification_status change."
    algorithm: threshold
    formula: |
      if unit.certification_status == DECERTIFIED:  operational_posture = FROZEN
      elif unit.certification_status == CONDITIONAL: operational_posture = RESTRICTED
      elif unit.available_bed_count <= 0:            operational_posture = RESTRICTED
      else:                                          operational_posture = OPEN
      # Gate semantics:
      #   FROZEN     - blocks admission decisions, transfers in, readmissions and new waitlist entries
      #   RESTRICTED - blocks admission decisions and new bed offers, but ALLOWS transfers in (a
      #                clinically mandated level-of-care move may proceed while a bed remains) and
      #                ALLOWS readmission of a resident already holding a bed in that unit
      #   OPEN       - no restriction
    input_set: "The CareUnit row's own certification_status and available_bed_count."
    constants: {}
    precision: "enum selection; the availability branch keys on <= 0, so exactly 0 available beds already RESTRICTS"

  - name: survey_compliance_score
    trigger: "POST /svh/care-units/{id}/survey-result"
    algorithm: weighted_scoring
    formula: |
      score = sum over d in payload.deficiencies of
                 SCOPE_WEIGHT[d.scope] * SEVERITY_WEIGHT[d.severity]
      if any d in payload.deficiencies has d.severity == IMMEDIATE_JEOPARDY:
          outcome = DECERTIFIED                      # overrides the numeric bands entirely
      elif score >= CERTIFICATION_DECERTIFY_THRESHOLD:
          outcome = DECERTIFIED
      elif score >= CERTIFICATION_CONDITIONAL_THRESHOLD:
          outcome = CONDITIONAL
      else:                                          # score == 0
          outcome = CERTIFIED  when the unit's current certification_status != DECERTIFIED
          outcome = CONDITIONAL when the unit's current certification_status == DECERTIFIED
      # An empty deficiencies array is legal and scores exactly 0.
    input_set: "The deficiencies array supplied in the request body only; prior surveys do not accumulate."
    constants:
      SCOPE_WEIGHT: { ISOLATED: 1, PATTERN: 2, WIDESPREAD: 4 }
      SEVERITY_WEIGHT: { MINIMAL: 1, MINIMAL_HARM: 3, ACTUAL_HARM: 8, IMMEDIATE_JEOPARDY: 20 }
      CERTIFICATION_CONDITIONAL_THRESHOLD: 1
      CERTIFICATION_DECERTIFY_THRESHOLD: 25
    precision: "integer score; band boundaries are inclusive on the lower edge (score 24 -> CONDITIONAL, score 25 -> DECERTIFIED). Because ISOLATED x IMMEDIATE_JEOPARDY scores only 20, a single isolated immediate-jeopardy deficiency sits INSIDE the CONDITIONAL band numerically and is decertified purely by the severity override, which is what makes the override observable."

  - name: resident_cost_share_monthly
    trigger: "POST /svh/residents/{id}/cost-share-determinations (both variants); the value is written to CostShareDetermination.monthly_cost_share_cents and mirrored onto Resident.monthly_cost_share_cents when the new row becomes governing."
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - gross countable income, PER-RECORD rounding then sum (pinned order)
      included_statuses = {UNVERIFIED, VERIFIED} if variant == PROVISIONAL else {VERIFIED}
      gross_countable_income_cents =
          sum over IncomeRecord ir where ir.resident_id == resident.id
                                    AND ir.effective_month == determination.effective_month
                                    AND ir.verification_status IN included_statuses
              of round_half_up(ir.monthly_amount_cents * COUNTABLE_RATE_BPS[ir.income_type] / 10000)
      # STEP 2
      pna_deduction_cents = veterans_home.personal_needs_allowance_monthly_cents
      # STEP 3
      net_before_medical = max(0, gross_countable_income_cents - pna_deduction_cents)
      # STEP 4 - tier selected from net income BEFORE the medical deduction. This single pin resolves
      # the circular dependency (the medical cap depends on the tier, the tier would otherwise depend
      # on the post-deduction net). It is NOT iterated to a fixed point.
      income_tier = TIER_1 if net_before_medical <= 100000
                    TIER_2 if 100000 < net_before_medical <= 250000
                    TIER_3 if net_before_medical > 250000
      # STEP 5
      allowed_medical_deduction_cents =
          0                                                              if variant == PROVISIONAL
          min(declared_medical_expense_cents, MEDICAL_CAP_BY_TIER_CENTS[income_tier])  if variant == FINAL
      # STEP 6
      net_after_medical = max(0, net_before_medical - allowed_medical_deduction_cents)
      # STEP 7 - marginal bands, EACH BAND ROUNDED THEN SUMMED (pinned order)
      band1 = min(net_after_medical, 100000)
      band2 = min(max(net_after_medical - 100000, 0), 150000)
      band3 = max(net_after_medical - 250000, 0)
      tiered_share_cents = round_half_up(band1 * 4000 / 10000)
                         + round_half_up(band2 * 5500 / 10000)
                         + round_half_up(band3 * 7000 / 10000)
      # STEP 8 - federal per diem offset (FINAL only), capped as a share of tiered_share_cents
      resident_day_count =
          PROVISIONAL: count of calendar days from max(resident.admission_date, first day of
                       effective_month) through the last day of effective_month, inclusive
          FINAL:       count of CensusDay rows for this resident with census_class == RESIDENT_DAY
                       whose service_date falls inside effective_month
      federal_per_diem_offset_cents =
          0                                                       if variant == PROVISIONAL
          min( round_half_up(PER_DIEM_RATE_CENTS[resident.current_care_level]
                             * resident_day_count * FEDERAL_OFFSET_SHARE_BPS / 10000),
               round_half_up(tiered_share_cents * FEDERAL_OFFSET_CAP_BPS / 10000) )   if variant == FINAL
      # STEP 9 - proration (PROVISIONAL only)
      # STEP 10
      monthly_cost_share_cents =
          max(0, round_half_up((tiered_share_cents - federal_per_diem_offset_cents)
                               * resident_day_count / days_in_month(effective_month)))  if PROVISIONAL
          max(0, tiered_share_cents - federal_per_diem_offset_cents)                    if FINAL
      delta_from_prior_cents = monthly_cost_share_cents
                             - (prior governing determination for the same resident and
                                effective_month).monthly_cost_share_cents, or 0 when none exists
    input_set: "IncomeRecord rows for the resident whose effective_month equals the determination's effective_month, filtered by the variant's verification-status set; the resident's home for the PNA; for FINAL only, the resident's RESIDENT_DAY CensusDay rows inside the month."
    constants:
      COUNTABLE_RATE_BPS: { SSA: 10000, VA_PENSION: 0, VA_COMPENSATION: 8000, MILITARY_RETIREMENT: 10000, OTHER: 10000 }
      COST_SHARE_TIER_BOUNDS_CENTS: [100000, 250000]
      COST_SHARE_TIER_BPS: [4000, 5500, 7000]
      MEDICAL_CAP_BY_TIER_CENTS: { TIER_1: 5000, TIER_2: 15000, TIER_3: 30000 }
      FEDERAL_OFFSET_SHARE_BPS: 500
      FEDERAL_OFFSET_CAP_BPS: 3000
      PER_DIEM_RATE_CENTS: { NURSING: 11857, DOMICILIARY: 5502, ADULT_DAY_HEALTH: 4230 }
    precision: "integer cents throughout; round_half_up at STEP 1 (per income record), at each band of STEP 7, at each arm of the STEP 8 min(), and at STEP 10 for PROVISIONAL proration. No other rounding points exist."
    variants:
      - name: PROVISIONAL
        when: "Any POST /svh/residents/{id}/cost-share-determinations with variant = PROVISIONAL; normally run at admission before income verification and before any census run."
        difference: "Counts UNVERIFIED income at face value, deducts NO medical expense, takes NO federal per diem offset, derives resident_day_count from the CALENDAR (admission date through month end), and prorates the result by resident_day_count / days_in_month."
      - name: FINAL
        when: "Any POST /svh/residents/{id}/cost-share-determinations with variant = FINAL; requires at least one VERIFIED income record for the month."
        difference: "Counts VERIFIED income only, deducts medical expense capped by the pre-medical tier, subtracts the capped federal per diem offset, derives resident_day_count from RESIDENT_DAY CensusDay rows, and applies NO proration."
    note: |
      Dual-variant instance on the resident-finance domain: identical IncomeRecord rows and identical
      home PNA yield different monthly_cost_share_cents because the two variants disagree on the
      inclusion set, the deduction set, the day-count source and the proration rule.
      Combinatorial mode (c): STEP 4/5 form a circular-looking dependency (cap <- tier <- net <- cap)
      that STEP 4's pre-medical pin makes single-pass and well-defined.

  - name: per_diem_claim_amount
    trigger: "POST /svh/per-diem-claims (DRAFT assembly), POST /svh/per-diem-claims/{id}/correct (DRAFT assembly of the correcting claim), and re-run at POST /svh/per-diem-claims/{id}/submit."
    algorithm: tiered_pricing
    formula: |
      # Attributable census set for the claim
      S = CensusDay rows d where d.care_unit_id == claim.care_unit_id
          AND d.service_date falls inside claim.claim_month
          AND ( d.per_diem_claim_id IS NULL
                OR d.per_diem_claim_id == claim.id
                OR the claim referenced by d.per_diem_claim_id has status IN {REJECTED, VOID} )
      resident_day_count             = count(d in S : d.census_class == RESIDENT_DAY)
      bed_hold_day_count             = count(d in S : d.census_class == BED_HOLD_DAY)
      census_reported_resident_count = count(distinct d.resident_id for d in S)
      # ABSENT_DAY rows are never attributable and never counted.
      rate = PER_DIEM_RATE_CENTS[care_unit.care_level]
      if claim.basis == AUDITED_BASIS:
          bed_hold_per_day_cents = round_half_up(rate * BED_HOLD_RATE_BPS / 10000)   # ROUND PER DAY
          payable_bed_hold_days  = min(bed_hold_day_count, BED_HOLD_PAYABLE_DAYS_PER_MONTH)
          billable_day_count     = resident_day_count + payable_bed_hold_days
          claim_amount_cents     = rate * resident_day_count
                                 + bed_hold_per_day_cents * payable_bed_hold_days
      else:  # CENSUS_BASIS
          billable_day_count     = resident_day_count + bed_hold_day_count
          claim_amount_cents     = rate * billable_day_count      # bed-hold days at the FULL rate,
                                                                  # no monthly cap
    input_set: "CensusDay rows for the claim's care unit inside claim_month whose per_diem_claim_id is NULL, equal to this claim, or points at a REJECTED/VOID claim. Rows attributed to a SUBMITTED or PAID claim are excluded."
    constants:
      PER_DIEM_RATE_CENTS: { NURSING: 11857, DOMICILIARY: 5502, ADULT_DAY_HEALTH: 4230 }
      BED_HOLD_RATE_BPS: 5000
      BED_HOLD_PAYABLE_DAYS_PER_MONTH: 10
    precision: |
      Integer cents. The bed-hold half-rate is rounded ONCE PER DAY with round_half_up and only then
      multiplied by the payable day count. Rounding the monthly bed-hold total instead (sum then
      round) is WRONG and observably different: NURSING rate 11857 over 3 bed-hold days gives
      round_half_up(5928.5) * 3 = 5929 * 3 = 17787 under the pinned order versus
      round_half_up(11857 * 3 * 0.5) = 17786 under the forbidden order.
    variants:
      - name: AUDITED_BASIS
        when: "claim.basis == AUDITED_BASIS (the default)."
        difference: "Bed-hold days are paid at BED_HOLD_RATE_BPS of the full rate, rounded per day, and capped at BED_HOLD_PAYABLE_DAYS_PER_MONTH per claim month; billable_day_count therefore excludes bed-hold days beyond the cap."
      - name: CENSUS_BASIS
        when: "claim.basis == CENSUS_BASIS."
        difference: "Every attributable day - resident and bed-hold alike - is paid at the full rate with no cap, so both billable_day_count and claim_amount_cents are strictly greater whenever bed_hold_day_count > 0."
    note: |
      Dual-variant instance on the claim-reimbursement domain (a different entity domain from
      resident_cost_share_monthly): the same CensusDay rows produce different claim_amount_cents.
      Combinatorial mode (b): the pinned per-day rounding of the bed-hold half rate is the axis, and
      the alternative order changes the cents.

  - name: census_day_classification
    trigger: "POST /svh/_ops/census-run step 1, once per (resident, service_date) pair."
    algorithm: projection
    formula: |
      for each Resident r with r.occupancy_status != DISCHARGED
                            OR (r.occupancy_status == DISCHARGED AND r.discharge_date >= window_start):
        window_start = max(r.admission_date,
                           (r.last_census_date + 1 day) if r.last_census_date IS NOT NULL else r.admission_date)
        window_end   = min(payload.through_date, r.discharge_date) if r.discharge_date IS NOT NULL
                       else payload.through_date
        for each calendar date D from window_start through window_end inclusive, ascending:
            # Attribution rule: the resident's occupancy as it stood at 23:59:59 UTC of D,
            # reconstructed from persisted Resident fields ONLY (bed_hold_started_on is never
            # cleared, so the most recent bed-hold interval is always [hold_start, hold_end) ):
            #   hold_start = r.bed_hold_started_on            # null => the resident never held a bed
            #   hold_end   = r.last_hospitalization_end_date
            #                    when hold_start IS NOT NULL AND r.last_hospitalization_end_date
            #                    IS NOT NULL AND r.last_hospitalization_end_date > hold_start
            #                                                 # interval closed by a readmission
            #              = r.discharge_date + 1 day
            #                    else when r.occupancy_status == DISCHARGED
            #                                                 # interval closed by discharge; the
            #                                                 # discharge_date is itself a hold day
            #              = window_end + 1 day
            #                    otherwise                    # interval still open at this run
            #   is_hold_day(D) = hold_start IS NOT NULL AND hold_start <= D < hold_end
            # Consequence: the hospitalization_start_date itself is a BED_HOLD_DAY, and the
            # readmission_date itself is a RESIDENT_DAY. Adjacency therefore never double-counts and
            # never leaves a gap - every date in [admission_date, discharge_date] gets exactly one row.
            # PINNED LIMIT: only the MOST RECENT hold interval is reconstructible. If a resident
            # starts AND closes more than one hospitalization between two census runs, the earlier
            # intervals are no longer present in the resident row and their dates are classified
            # RESIDENT_DAY. This is a pinned consequence of the nightly-checkpoint design, not an
            # implementation choice.
            #   prior_closed_days = r.bed_hold_days_used - days_between(hold_start, hold_end)
            #                           when hold_end == r.last_hospitalization_end_date (that
            #                           interval's length is already folded into bed_hold_days_used)
            #                     = r.bed_hold_days_used
            #                           otherwise (an open interval, or one closed by discharge, is
            #                           never folded into bed_hold_days_used)
            #   bed_hold_days_used_at_end_of(D) = prior_closed_days + days_between(hold_start, D)
            # so the hospitalization start date itself counts 0 and the 31st consecutive day of one
            # unbroken hold is the FIRST ABSENT_DAY. The census run never mutates
            # r.bed_hold_days_used; that field advances only at readmission.
            if is_hold_day(D):
                census_class = BED_HOLD_DAY   if bed_hold_days_used_at_end_of(D) < BED_HOLD_MAX_DAYS
                census_class = ABSENT_DAY     otherwise
            else:
                census_class = RESIDENT_DAY
            care_unit_id = r.care_unit_id as it stands at the moment of THIS run (pinned): a transfer
                           that happens between two runs therefore attributes the still-uncensused
                           earlier dates to the NEW unit, which is exactly why the ops checkpoint is
                           expected to run before each transfer and why unit-split census tests run
                           the checkpoint once before and once after the transfer
            create CensusDay(resident_id, care_unit_id, service_date = D, census_class)
        set r.last_census_date = window_end
      # Uniqueness: at most one CensusDay row may exist per (resident_id, service_date). A second run
      # with the same or an earlier through_date creates nothing because window_start > window_end.
    input_set: "Every Resident whose stay overlaps [window_start, window_end]; DISCHARGED residents contribute days only up to and including discharge_date."
    constants:
      BED_HOLD_MAX_DAYS: 30
    precision: "whole calendar days, UTC; both window bounds inclusive"

  - name: trust_fund_running_balance
    trigger: "POST /svh/residents/{id}/trust-fund-transactions, POST /svh/trust-fund-transactions/{id}/reverse, and POST /svh/_ops/census-run steps 2 and 3."
    algorithm: chronological
    formula: |
      signed_amount_cents =
          + amount_cents                        if txn_type IN {DEPOSIT, PNA_CREDIT}
          - amount_cents                        if txn_type IN {WITHDRAWAL, COST_SHARE_DEBIT}
          - reversed_row.signed_amount_cents    if txn_type == REVERSAL
      replay order = ORDER BY effective_date ASC, created_at ASC     # `id` is never a sort key
      balance_after_cents(t) = sum of signed_amount_cents over every row at or before t in that order
      Resident.trust_fund_balance_cents = balance_after_cents(last row) , or 0 when there are none
      # Conserved-quantity invariant (money):
      #   Resident.trust_fund_balance_cents == sum(signed_amount_cents) over all of its rows, always.
      # Guards, evaluated against the balance the new row would produce:
      #   WITHDRAWAL        rejected when balance_after_cents < 0
      #   COST_SHARE_DEBIT  rejected when balance_after_cents < veterans_home
      #                                                          .personal_needs_allowance_monthly_cents
      #   DEPOSIT / PNA_CREDIT / REVERSAL are never rejected on balance grounds
      # A REVERSAL of a row R is posted with effective_date = the request's effective_date and
      # amount_cents = abs(R.signed_amount_cents); posting R then reversing R returns
      # Resident.trust_fund_balance_cents to its exact pre-R value.
    input_set: "All TrustFundTransaction rows of the resident, with no status filter (there is no soft-delete); a reversed row stays in the ledger and keeps its own signed_amount_cents."
    constants: {}
    precision: "integer cents; no rounding occurs anywhere in the ledger"

  - name: governing_cost_share_selector
    trigger: "Every read of Resident.monthly_cost_share_cents and step 3 of POST /svh/_ops/census-run."
    algorithm: chronological
    formula: |
      candidate_set = CostShareDetermination rows c where c.resident_id == resident.id
                      AND c.effective_month == target_month
      if candidate_set is empty:            governing = null and monthly_cost_share_cents = 0
      elif any c has c.variant == FINAL:    governing = the FINAL row with the greatest created_at
      else:                                 governing = the PROVISIONAL row with the greatest created_at
      # Ranking is fully pinned: variant FINAL outranks PROVISIONAL, then created_at DESC. `id` is
      # never consulted. Empty-set fallback is a zero cost share, not an error.
      # For Resident.monthly_cost_share_cents the target_month is the month of the current logical
      # clock; if that month has no determination the most recent EARLIER month's governing row is
      # used, and only when no determination exists at all is the value 0.
    input_set: "CostShareDetermination rows of the resident, unfiltered by status (the entity is immutable and has no status field)."
    constants: {}
    precision: "integer cents (pass-through of the selected row's monthly_cost_share_cents)"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The acting X-User-Role appears in the target endpoint's roles list in the API endpoint table."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 30
    category: business_constraint
    check: "Request body shape: every required field present, every enum value inside its declared set, integers non-negative where the field constraint says so, dates match YYYY-MM-DD, months match YYYY-MM, licensed_bed_count >= 1, out_of_service_bed_count <= licensed_bed_count, amount_cents > 0, adl_dependency_count in 0..6, service_connected_disability_pct in 0..100, pagination limit in 1..100 and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 40
    category: existence
    check: "Every path-templated resource exists, validated left-to-right: the {id} segment of /veterans-homes, /care-units, /applicants, /clinical-assessments, /residents, /income-records, /care-plans, /census-days, /per-diem-claims, /trust-fund-transactions."
    error_id: "ERR_HOME_NOT_FOUND | ERR_CARE_UNIT_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_INCOME_RECORD_NOT_FOUND | ERR_CARE_PLAN_NOT_FOUND | ERR_CENSUS_DAY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path-templated id"
  - priority: 45
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list (veterans_home_id, care_unit_id, applicant_id, resident_id, target_care_unit_id, clinical_assessment_id, supersedes_care_plan_id)."
    error_id: "ERR_HOME_NOT_FOUND | ERR_CARE_UNIT_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_CARE_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "POST /svh/applicants, POST /svh/veterans-homes/{id}/care-units, POST /svh/waitlist-entries, POST /svh/applicants/{id}/admission-decision, POST /svh/residents/{id}/care-plans, POST /svh/residents/{id}/transfer, POST /svh/per-diem-claims"
  - priority: 50
    category: auth
    check: "When X-User-Role == ResidentRepresentative, X-User-ID equals the Resident.id addressed by the request (path {id} for resident sub-resources, or the resident_id of the addressed child row)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes ResidentRepresentative"
  - priority: 55
    category: state
    check: "OCC: payload.expected_care_unit_version == CareUnit.version on the admission decision; payload.expected_resident_version == Resident.version on a cost-share determination; payload.expected_claim_version == PerDiemClaim.version on a claim correction."
    error_id: "ERR_CARE_UNIT_VERSION_STALE | ERR_RESIDENT_VERSION_STALE | ERR_CLAIM_VERSION_STALE"
    http_status: 412
    applies_to: "POST /svh/applicants/{id}/admission-decision, POST /svh/residents/{id}/cost-share-determinations, POST /svh/per-diem-claims/{id}/correct"
  - priority: 60
    category: state
    check: "Applicant.status permits the requested transition: SUBMITTED or INELIGIBLE for an eligibility determination, ELIGIBLE or WAITLISTED for waitlist placement, WAITLISTED for an admission decision."
    error_id: ERR_APPLICANT_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/applicants/{id}/eligibility-determination, POST /svh/waitlist-entries, POST /svh/applicants/{id}/admission-decision"
  - priority: 60
    category: state
    check: "Applicant.redetermination_count < MAX_REDETERMINATIONS (= 2) when an INELIGIBLE applicant is reopened with amended evidence."
    error_id: ERR_REDETERMINATION_LIMIT
    http_status: 409
    applies_to: "POST /svh/applicants/{id}/eligibility-determination"
  - priority: 60
    category: state
    check: "ClinicalAssessment.status == DRAFT to submit; == SUBMITTED to be cited by an admission decision."
    error_id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/clinical-assessments/{id}/submit, POST /svh/applicants/{id}/admission-decision"
  - priority: 60
    category: state
    check: "Resident.occupancy_status permits the requested move: ADMITTED to hospitalize or transfer, HOSPITALIZED to readmit, ADMITTED or HOSPITALIZED to discharge, not DISCHARGED for any of income records, cost-share determinations, care plans or trust-fund postings."
    error_id: ERR_RESIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/residents/{id}/hospitalization, POST /svh/residents/{id}/readmission, POST /svh/residents/{id}/discharge, POST /svh/residents/{id}/transfer, POST /svh/residents/{id}/income-records, POST /svh/residents/{id}/cost-share-determinations, POST /svh/residents/{id}/care-plans, POST /svh/residents/{id}/trust-fund-transactions"
  - priority: 60
    category: state
    check: "CarePlan.status IN {DRAFT, REVIEW_DUE} to activate; a supersedes_care_plan_id target must have status IN {ACTIVE, REVIEW_DUE}."
    error_id: ERR_CARE_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/care-plans/{id}/activate, POST /svh/residents/{id}/care-plans"
  - priority: 60
    category: state
    check: "IncomeRecord.verification_status == UNVERIFIED to verify."
    error_id: ERR_INCOME_RECORD_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/income-records/{id}/verify"
  - priority: 60
    category: state
    check: "PerDiemClaim.status == DRAFT to submit, == SUBMITTED to adjudicate, IN {PAID, REJECTED} to be corrected."
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/per-diem-claims/{id}/submit, POST /svh/per-diem-claims/{id}/adjudicate, POST /svh/per-diem-claims/{id}/correct"
  - priority: 60
    category: state
    check: "The TrustFundTransaction being reversed has reversed == false and txn_type != REVERSAL."
    error_id: ERR_TRANSACTION_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /svh/trust-fund-transactions/{id}/reverse"
  - priority: 60
    category: state
    check: "VeteransHome.recognition_status permits the requested recognition action: PROVISIONAL for GRANT, RECOGNIZED for SUSPEND, SUSPENDED for RESTORE; a RESTORE additionally requires decertified_unit_count == 0."
    error_id: ERR_HOME_RECOGNITION_STATE_INVALID
    http_status: 409
    applies_to: "POST /svh/veterans-homes/{id}/recognition"
  - priority: 65
    category: business_safety
    check: "Segregation of duties on admission: X-User-ID of the deciding AdmissionsCoordinator differs from the cited ClinicalAssessment.assessor_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /svh/applicants/{id}/admission-decision"
  - priority: 65
    category: business_safety
    check: "Segregation of duties on reversal: X-User-ID of the reversing actor differs from the reversed TrustFundTransaction.recorded_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /svh/trust-fund-transactions/{id}/reverse"
  - priority: 70
    category: business_safety
    check: "VeteransHome.recognition_status == RECOGNIZED when a per diem claim is submitted."
    error_id: ERR_HOME_NOT_RECOGNIZED
    http_status: 409
    applies_to: "POST /svh/per-diem-claims/{id}/submit"
  - priority: 70
    category: business_safety
    check: "CareUnit.certification_status == CERTIFIED for an admission decision or a transfer in; != DECERTIFIED for a new waitlist entry, a readmission, or a claim submission."
    error_id: ERR_UNIT_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /svh/applicants/{id}/admission-decision, POST /svh/residents/{id}/transfer, POST /svh/waitlist-entries, POST /svh/residents/{id}/readmission, POST /svh/per-diem-claims/{id}/submit"
  - priority: 72
    category: business_safety
    check: "CareUnit.operational_posture is OPEN for an admission decision, and not FROZEN for a transfer in."
    error_id: ERR_UNIT_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /svh/applicants/{id}/admission-decision, POST /svh/residents/{id}/transfer"
  - priority: 75
    category: business_safety
    check: "Care-level agreement: a submitted assessment whose assessed_care_level is NURSING carries skilled_nursing_hours_per_day >= 2.00; the cited assessment's assessed_care_level equals the target CareUnit.care_level on an admission decision; the applicant's requested_care_level equals the CareUnit.care_level on a waitlist entry; and, when the resident has an ACTIVE CarePlan, that plan's care_level equals the target unit's care_level on a transfer (the absence of any ACTIVE plan is not this rule's concern - it is caught at priority 76)."
    error_id: ERR_CARE_LEVEL_MISMATCH
    http_status: 409
    applies_to: "POST /svh/clinical-assessments/{id}/submit, POST /svh/applicants/{id}/admission-decision, POST /svh/waitlist-entries, POST /svh/residents/{id}/transfer"
  - priority: 76
    category: business_referential
    check: "A transfer requires the resident to have at least one CarePlan with status == ACTIVE."
    error_id: ERR_NO_ACTIVE_CARE_PLAN
    http_status: 409
    applies_to: "POST /svh/residents/{id}/transfer"
  - priority: 76
    category: business_referential
    check: "An admission decision requires the applicant to hold a WaitlistEntry on the payload's care_unit_id with status IN {ACTIVE, OFFERED}."
    error_id: ERR_NO_WAITLIST_ENTRY_FOR_UNIT
    http_status: 409
    applies_to: "POST /svh/applicants/{id}/admission-decision"
  - priority: 77
    category: business_referential
    check: "A transfer's target_care_unit_id differs from the resident's current care_unit_id and belongs to the same veterans_home_id."
    error_id: ERR_INVALID_TRANSFER_TARGET
    http_status: 409
    applies_to: "POST /svh/residents/{id}/transfer"
  - priority: 78
    category: business_referential
    check: "A FINAL cost-share determination requires at least one IncomeRecord for the resident with the determination's effective_month and verification_status == VERIFIED."
    error_id: ERR_INCOME_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /svh/residents/{id}/cost-share-determinations"
  - priority: 80
    category: business_referential
    check: "No WaitlistEntry already exists for the same (applicant_id, care_unit_id) with status IN {ACTIVE, OFFERED}."
    error_id: ERR_DUPLICATE_WAITLIST_ENTRY
    http_status: 409
    applies_to: "POST /svh/waitlist-entries"
  - priority: 80
    category: business_referential
    check: "At most one PerDiemClaim per (care_unit_id, claim_month) may occupy the month at a time: creating a claim is rejected when another claim for the same care unit and claim_month has status IN {DRAFT, SUBMITTED}. A PAID month is NOT caught here - it is caught one rung later at priority 82, because its census days are already consumed; a REJECTED or VOID month is free. A correcting claim is exempt entirely because it supersedes its own target's attribution."
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /svh/per-diem-claims"
  - priority: 80
    category: business_referential
    check: "A correcting claim carries the identical claim_month as its target and the target belongs to the same care unit. The correction endpoint copies claim_month and care_unit_id from the target, so the only way to violate this rule is to supply the optional confirmation echo claim_month with a value different from the target's claim_month - which is exactly what this rule rejects."
    error_id: ERR_CLAIM_MONTH_MISMATCH
    http_status: 409
    applies_to: "POST /svh/per-diem-claims/{id}/correct"
  - priority: 82
    category: business_referential
    check: "Census-day single attribution: every CensusDay row entering a claim's census set has per_diem_claim_id NULL, equal to this claim, or pointing at a REJECTED/VOID claim. A row already attributed to a SUBMITTED or PAID claim cannot be attributed again, except that a correcting claim may take over the rows attributed to the claim named by its own corrects_claim_id. Reachability: a plain creation for a (care_unit_id, claim_month) where at least one CensusDay row already points at a PAID claim is rejected here - the only legal way to revise a paid month is POST /svh/per-diem-claims/{id}/correct."
    error_id: ERR_CENSUS_DAY_ALREADY_CLAIMED
    http_status: 409
    applies_to: "POST /svh/per-diem-claims, POST /svh/per-diem-claims/{id}/correct, POST /svh/per-diem-claims/{id}/submit"
  - priority: 85
    category: business_temporal
    check: "PerDiemClaim.claim_month is strictly earlier than the month of the current logical clock at submission (the census month must be closed)."
    error_id: ERR_CLAIM_MONTH_NOT_CLOSED
    http_status: 409
    applies_to: "POST /svh/per-diem-claims/{id}/submit"
  - priority: 85
    category: business_temporal
    check: "Bed-hold interval non-overlap: hospitalization_start_date > resident.last_hospitalization_end_date when a prior hospitalization exists (half-open [start, readmission) intervals; zero-gap adjacency, i.e. start == prior end + 1 day, is allowed, and start == prior end is not)."
    error_id: ERR_BED_HOLD_OVERLAP
    http_status: 409
    applies_to: "POST /svh/residents/{id}/hospitalization"
  - priority: 85
    category: business_temporal
    check: "Date ordering: hospitalization_start_date >= admission_date; readmission_date > bed_hold_started_on; discharge_date >= admission_date; a survey_date, plan_date, effective_date or through_date is not in the future relative to the current logical clock."
    error_id: ERR_DATE_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /svh/residents/{id}/hospitalization, POST /svh/residents/{id}/readmission, POST /svh/residents/{id}/discharge, POST /svh/care-units/{id}/survey-result, POST /svh/residents/{id}/care-plans, POST /svh/residents/{id}/trust-fund-transactions, POST /svh/_ops/census-run"
  - priority: 90
    category: business_constraint
    check: "CareUnit.available_bed_count >= 1 for the target unit of an admission decision or a transfer in."
    error_id: ERR_NO_AVAILABLE_BED
    http_status: 409
    applies_to: "POST /svh/applicants/{id}/admission-decision, POST /svh/residents/{id}/transfer"
  - priority: 90
    category: business_constraint
    check: "Bed-hold day cap: resident.bed_hold_days_used < BED_HOLD_MAX_DAYS to start a hospitalization, and resident.bed_hold_days_used + days_between(bed_hold_started_on, readmission_date) <= BED_HOLD_MAX_DAYS to readmit."
    error_id: ERR_BED_HOLD_EXHAUSTED
    http_status: 409
    applies_to: "POST /svh/residents/{id}/hospitalization, POST /svh/residents/{id}/readmission"
  - priority: 92
    category: business_constraint
    check: "A per diem claim being submitted has census_reported_resident_count >= 1 and billable_day_count >= 1."
    error_id: ERR_CLAIM_CENSUS_EMPTY
    http_status: 409
    applies_to: "POST /svh/per-diem-claims/{id}/submit"
  - priority: 95
    category: business_fiscal
    check: "A WITHDRAWAL leaves the trust fund balance at or above 0."
    error_id: ERR_TRUST_FUND_INSUFFICIENT
    http_status: 409
    applies_to: "POST /svh/residents/{id}/trust-fund-transactions"
  - priority: 95
    category: business_fiscal
    check: "A COST_SHARE_DEBIT leaves the trust fund balance at or above the home's personal_needs_allowance_monthly_cents reserve."
    error_id: ERR_PNA_RESERVE_BREACH
    http_status: 409
    applies_to: "POST /svh/residents/{id}/trust-fund-transactions"

endpoints:
  # ---------- Reads: VeteransHome ----------
  - method: GET
    path: "/svh/veterans-homes/{id}"
    description: "Fetch one state veterans home with its recognition status, personal-needs-allowance policy amount, active resident count and decertified unit count."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager, FederalPerDiemAuditor, SurveyAgency]
    code: 200
    input: []
    output: VeteransHome
    side_effects: []
  - method: GET
    path: "/svh/veterans-homes"
    description: "List veterans homes, newest first by created_at DESC then name ASC, with offset pagination."
    roles: [StateProgramAdmin, AdmissionsCoordinator, BusinessOfficeManager, FederalPerDiemAuditor, SurveyAgency]
    code: 200
    input: ["state_code?", "recognition_status?", "limit?", "offset?"]
    output: VeteransHome[]
    side_effects: []
  - method: GET
    path: "/svh/veterans-homes/{id}/care-units"
    description: "List the care units of one veterans home, ordered by care_level ASC then unit_name ASC. Reverse-reachability read for CareUnit.veterans_home_id."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager, FederalPerDiemAuditor, SurveyAgency]
    code: 200
    input: ["care_level?", "certification_status?", "limit?", "offset?"]
    output: CareUnit[]
    side_effects: []
  - method: GET
    path: "/svh/veterans-homes/{id}/applicants"
    description: "List the applicants of one veterans home, ordered by application_received_date ASC then created_at ASC. Reverse-reachability read for Applicant.veterans_home_id."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager]
    code: 200
    input: ["status?", "requested_care_level?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []
  # ---------- Reads: CareUnit ----------
  - method: GET
    path: "/svh/care-units/{id}"
    description: "Fetch one care unit with its derived bed counts (occupied_bed_count, held_bed_count, available_bed_count), certification_status, operational_posture, last_survey_compliance_score and version."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager, FederalPerDiemAuditor, SurveyAgency]
    code: 200
    input: []
    output: CareUnit
    side_effects: []
  - method: GET
    path: "/svh/care-units/{id}/waitlist-entries"
    description: "List the waitlist entries queued on one care unit, ordered by queue_position ASC. Reverse-reachability read for WaitlistEntry.care_unit_id."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  # ---------- Reads: Applicant ----------
  - method: GET
    path: "/svh/applicants/{id}"
    description: "Fetch one applicant with eligibility outcome, eligibility_reason_code, priority_class, priority_score, declined_offer_count and redetermination_count."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/svh/applicants/{id}/waitlist-entries"
    description: "List the waitlist entries created for one applicant, ordered by listed_at ASC then created_at ASC. Reverse-reachability read for WaitlistEntry.applicant_id."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/svh/applicants/{id}/clinical-assessments"
    description: "List the clinical assessments recorded for one applicant, ordered by assessment_date DESC then created_at DESC. Reverse-reachability read for ClinicalAssessment.applicant_id."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicalAssessment[]
    side_effects: []
  # ---------- Reads: Resident ----------
  - method: GET
    path: "/svh/residents/{id}"
    description: "Fetch one resident with occupancy_status, billing_status, current_care_level, bed-hold counters, monthly_cost_share_cents, trust_fund_balance_cents and version."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager, FederalPerDiemAuditor, ResidentRepresentative]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: GET
    path: "/svh/residents"
    description: "Filtered list of residents, ordered by admission_date ASC then created_at ASC. Reverse-reachability read for Resident.applicant_id and Resident.care_unit_id."
    roles: [StateProgramAdmin, AdmissionsCoordinator, ClinicalAssessor, BusinessOfficeManager, FederalPerDiemAuditor]
    code: 200
    input: ["applicant_id?", "care_unit_id?", "occupancy_status?", "billing_status?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []
  - method: GET
    path: "/svh/residents/{id}/income-records"
    description: "List the income records of one resident, ordered by effective_month ASC then income_type ASC. Reverse-reachability read for IncomeRecord.resident_id."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor, ResidentRepresentative]
    code: 200
    input: ["effective_month?", "verification_status?", "limit?", "offset?"]
    output: IncomeRecord[]
    side_effects: []
  - method: GET
    path: "/svh/residents/{id}/cost-share-determinations"
    description: "List the cost-share determinations of one resident, ordered by effective_month ASC then created_at ASC. Reverse-reachability read for CostShareDetermination.resident_id."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor, ResidentRepresentative]
    code: 200
    input: ["effective_month?", "variant?", "limit?", "offset?"]
    output: CostShareDetermination[]
    side_effects: []
  # ---------- Reads: CarePlan ----------
  - method: GET
    path: "/svh/care-plans/{id}"
    description: "Fetch one care plan with status, care_level, adl_support_level, revision_number and review_due_date."
    roles: [StateProgramAdmin, ClinicalAssessor, AdmissionsCoordinator, BusinessOfficeManager, ResidentRepresentative]
    code: 200
    input: []
    output: CarePlan
    side_effects: []
  - method: GET
    path: "/svh/care-plans"
    description: "Filtered list of care plans, ordered by plan_date ASC then revision_number ASC. Reverse-reachability read for CarePlan.resident_id and CarePlan.supersedes_care_plan_id."
    roles: [StateProgramAdmin, ClinicalAssessor, AdmissionsCoordinator, BusinessOfficeManager]
    code: 200
    input: ["resident_id?", "supersedes_care_plan_id?", "status?", "limit?", "offset?"]
    output: CarePlan[]
    side_effects: []
  # ---------- Reads: CensusDay ----------
  - method: GET
    path: "/svh/census-days/{id}"
    description: "Fetch one census day with census_class, per_diem_eligible, payable_rate_cents, claimed flag and its owning per_diem_claim_id."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor]
    code: 200
    input: []
    output: CensusDay
    side_effects: []
  - method: GET
    path: "/svh/census-days"
    description: "Filtered list of census days, ordered by service_date ASC then created_at ASC. Reverse-reachability read for CensusDay.resident_id, CensusDay.care_unit_id and CensusDay.per_diem_claim_id."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor]
    code: 200
    input: ["resident_id?", "care_unit_id?", "per_diem_claim_id?", "service_date_from?", "service_date_to?", "census_class?", "claimed?", "limit?", "offset?"]
    output: CensusDay[]
    side_effects: []
  # ---------- Reads: PerDiemClaim ----------
  - method: GET
    path: "/svh/per-diem-claims/{id}"
    description: "Fetch one per diem claim with basis, status, day counts, claim_amount_cents, census_reported_resident_count, recognition_verified, correction_generation, rejection_code and version."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor]
    code: 200
    input: []
    output: PerDiemClaim
    side_effects: []
  - method: GET
    path: "/svh/per-diem-claims"
    description: "Filtered list of per diem claims, ordered by claim_month ASC then correction_generation ASC then created_at ASC. Reverse-reachability read for PerDiemClaim.veterans_home_id, PerDiemClaim.care_unit_id and PerDiemClaim.corrects_claim_id."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor]
    code: 200
    input: ["veterans_home_id?", "care_unit_id?", "corrects_claim_id?", "claim_month?", "status?", "basis?", "limit?", "offset?"]
    output: PerDiemClaim[]
    side_effects: []
  # ---------- Reads: TrustFundTransaction ----------
  - method: GET
    path: "/svh/trust-fund-transactions/{id}"
    description: "Fetch one resident trust fund transaction with signed_amount_cents, balance_after_cents and its reversed flag."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor, ResidentRepresentative]
    code: 200
    input: []
    output: TrustFundTransaction
    side_effects: []
  - method: GET
    path: "/svh/trust-fund-transactions"
    description: "Filtered list of trust fund transactions, ordered by effective_date ASC then created_at ASC. Reverse-reachability read for TrustFundTransaction.resident_id and TrustFundTransaction.reverses_transaction_id."
    roles: [StateProgramAdmin, BusinessOfficeManager, FederalPerDiemAuditor, ResidentRepresentative]
    code: 200
    input: ["resident_id?", "reverses_transaction_id?", "txn_type?", "reversed?", "limit?", "offset?"]
    output: TrustFundTransaction[]
    side_effects: []
  # ---------- Writes: VeteransHome / CareUnit ----------
  - method: POST
    path: "/svh/veterans-homes"
    description: "Register a state veterans home. recognition_status defaults to RECOGNIZED; pass PROVISIONAL to create a home awaiting federal recognition. personal_needs_allowance_monthly_cents defaults to 9000."
    roles: [StateProgramAdmin]
    code: 201
    input: [name, state_code, recognition_effective_date, "recognition_status?", "personal_needs_allowance_monthly_cents?"]
    output: VeteransHome
    side_effects: ["active_resident_count set to 0", "decertified_unit_count set to 0", "recognition_suspended_reason set to null", "last_survey_date set to null", "version set to 1"]
  - method: POST
    path: "/svh/veterans-homes/{id}/recognition"
    description: "Change a home's federal recognition posture. action GRANT moves PROVISIONAL to RECOGNIZED; action SUSPEND moves RECOGNIZED to SUSPENDED; action RESTORE moves SUSPENDED to RECOGNIZED and requires decertified_unit_count == 0."
    roles: [StateProgramAdmin]
    code: 200
    input: [action, effective_date, "note?"]
    output: VeteransHome
    side_effects: ["recognition_status set per action", "recognition_effective_date set to effective_date", "recognition_suspended_reason set to UNIT_DECERTIFIED on SUSPEND and null on GRANT/RESTORE", "version incremented"]
  - method: POST
    path: "/svh/veterans-homes/{id}/care-units"
    description: "Create a care unit (NURSING, DOMICILIARY or ADULT_DAY_HEALTH) under a home. per_diem_rate_cents is computed from PER_DIEM_RATE_CENTS for the unit's care_level; out_of_service_bed_count defaults to 0."
    roles: [StateProgramAdmin]
    code: 201
    input: [unit_name, care_level, licensed_bed_count, "out_of_service_bed_count?"]
    output: CareUnit
    side_effects: ["certification_status set to CERTIFIED", "occupied_bed_count / held_bed_count / waitlist_active_count set to 0", "available_bed_count recomputed by care_unit_bed_availability", "operational_posture recomputed by care_unit_operational_posture", "per_diem_rate_cents set from PER_DIEM_RATE_CENTS[care_level]", "last_survey_compliance_score set to 0", "last_survey_date set to null", "parent VeteransHome.version incremented"]
  - method: POST
    path: "/svh/care-units/{id}/survey-result"
    description: "Record a nursing or domiciliary survey outcome for a care unit. deficiencies is a list of objects each carrying scope (ISOLATED, PATTERN, WIDESPREAD) and severity (MINIMAL, MINIMAL_HARM, ACTUAL_HARM, IMMEDIATE_JEOPARDY); an empty list scores 0."
    roles: [SurveyAgency]
    code: 200
    input: [survey_date, deficiencies]
    output: CareUnit
    side_effects: ["last_survey_compliance_score recomputed by survey_compliance_score", "last_survey_date set to survey_date", "certification_status recomputed from the score against CERTIFICATION_CONDITIONAL_THRESHOLD and CERTIFICATION_DECERTIFY_THRESHOLD", "on entry to DECERTIFIED: operational_posture set to FROZEN, all ACTIVE/OFFERED WaitlistEntry rows for the unit set to CANCELLED with waitlist_active_count set to 0, all DRAFT PerDiemClaim rows for the unit set to VOID with their CensusDay rows released (per_diem_claim_id null, claimed false), parent VeteransHome.decertified_unit_count incremented and its recognition_status moved RECOGNIZED to SUSPENDED with recognition_suspended_reason UNIT_DECERTIFIED", "on exit from DECERTIFIED: parent VeteransHome.decertified_unit_count decremented and, when it reaches 0, recognition_status moved SUSPENDED to RECOGNIZED with recognition_suspended_reason null", "operational_posture recomputed", "CareUnit.version incremented", "parent VeteransHome.version incremented when any home field changed", "home last_survey_date set to survey_date"]
  # ---------- Writes: Applicant / Waitlist / ClinicalAssessment ----------
  - method: POST
    path: "/svh/applicants"
    description: "File an admission application against a home. status starts at SUBMITTED; priority_class and priority_score stay null until the eligibility determination runs."
    roles: [AdmissionsCoordinator]
    code: 201
    input: [veterans_home_id, full_name, date_of_birth, service_days, discharge_character, wartime_service, service_connected_disability_pct, nursing_care_for_service_connected, state_residency_years, requested_care_level, application_received_date]
    output: Applicant
    side_effects: ["status set to SUBMITTED", "declined_offer_count and redetermination_count set to 0", "eligibility_reason_code, priority_class, priority_score, decided_by_user_id and decision_note set to null", "parent VeteransHome.version incremented"]
  - method: POST
    path: "/svh/applicants/{id}/eligibility-determination"
    description: "Adjudicate service, discharge-character and state-residency criteria. Optional amended_* fields overwrite the stored evidence before the criteria run and are the only way to reopen an INELIGIBLE applicant (each reopen consumes one of MAX_REDETERMINATIONS)."
    roles: [AdmissionsCoordinator]
    code: 200
    input: ["amended_service_days?", "amended_state_residency_years?", "amended_discharge_character?", "review_note?"]
    output: Applicant
    side_effects: ["service_days / state_residency_years / discharge_character overwritten when the matching amended_* field is present", "status set to ELIGIBLE or INELIGIBLE", "eligibility_reason_code set to ELIGIBLE on ELIGIBLE, otherwise to the first failing criterion in the pinned order DISCHARGE_CHARACTER_DISQUALIFYING, SERVICE_DAYS_INSUFFICIENT, RESIDENCY_INSUFFICIENT", "priority_class recomputed by applicant_priority_class and priority_score recomputed by applicant_priority_score on ELIGIBLE; priority_class set to null and priority_score set to 0 on INELIGIBLE", "redetermination_count incremented when the pre-call status was INELIGIBLE", "decision_note set to review_note", "version incremented"]
  - method: POST
    path: "/svh/waitlist-entries"
    description: "Place an ELIGIBLE (or already WAITLISTED) applicant on a care unit's waitlist; an applicant may queue on more than one unit of their requested care level. listed_at is stamped from the logical clock; priority_class_snapshot and rank_score_snapshot freeze the applicant's current priority."
    roles: [AdmissionsCoordinator]
    code: 201
    input: [applicant_id, care_unit_id]
    output: WaitlistEntry
    side_effects: ["status set to ACTIVE", "listed_at stamped from the logical clock", "offer_expires_at set to null", "priority_class_snapshot and rank_score_snapshot copied from Applicant.priority_class and Applicant.priority_score", "Applicant.status set to WAITLISTED", "CareUnit.waitlist_active_count incremented", "queue_position of every ACTIVE/OFFERED entry on the unit recomputed by waitlist_queue_order", "CareUnit.version incremented", "Applicant.version incremented"]
  - method: POST
    path: "/svh/applicants/{id}/clinical-assessments"
    description: "Record a DRAFT clinical assessment for an applicant. acuity_points is computed from ADL dependencies, cognitive impairment and behavioral risk; assessor_user_id is taken from the X-User-ID header."
    roles: [ClinicalAssessor]
    code: 201
    input: [assessed_care_level, adl_dependency_count, cognitive_impairment, behavioral_risk_flag, skilled_nursing_hours_per_day, assessment_date]
    output: ClinicalAssessment
    side_effects: ["status set to DRAFT", "assessor_user_id set from the X-User-ID header", "acuity_points computed from ADL_POINTS_PER_DEPENDENCY, COGNITIVE_IMPAIRMENT_POINTS and BEHAVIORAL_RISK_POINTS", "rejection_reason set to null", "parent Applicant.version incremented"]
  - method: POST
    path: "/svh/clinical-assessments/{id}/submit"
    description: "Submit a DRAFT clinical assessment so an admission decision may cite it. Recomputes the applicant's priority_score, which now folds in the assessment's clinical points."
    roles: [ClinicalAssessor]
    code: 200
    input: []
    output: ClinicalAssessment
    side_effects: ["status set to SUBMITTED", "Applicant.priority_score recomputed by applicant_priority_score", "queue_position of every ACTIVE/OFFERED WaitlistEntry of the applicant recomputed by waitlist_queue_order and rank_score_snapshot refreshed", "Applicant.version incremented", "CareUnit.version incremented for every unit whose queue was reordered", "version incremented"]
  - method: POST
    path: "/svh/applicants/{id}/admission-decision"
    description: "Approve or deny a WAITLISTED applicant against a specific care unit, citing a SUBMITTED clinical assessment. decision APPROVED creates the Resident and returns it; decision DENIED returns data null. expected_care_unit_version must equal the target CareUnit.version."
    roles: [AdmissionsCoordinator]
    code: 201
    input: [decision, care_unit_id, clinical_assessment_id, expected_care_unit_version, admission_date, "decision_note?"]
    output: Resident
    side_effects: ["Applicant.status set to ADMITTED on APPROVED or DENIED on DENIED", "Applicant.decided_by_user_id set from the X-User-ID header and decision_note set to decision_note", "ClinicalAssessment.status set to ACCEPTED on APPROVED, or REJECTED with rejection_reason ADMISSION_DENIED on DENIED", "on APPROVED: Resident created with occupancy_status ADMITTED, billing_status PROVISIONAL_COST_SHARE, current_care_level from the target unit, admission_date from the payload, bed_hold_days_used 0, bed_hold_active false, hospitalization_count 0, readmission_count 0, monthly_cost_share_cents 0, trust_fund_balance_cents 0", "on APPROVED: the applicant's WaitlistEntry on the target unit set to ADMITTED and CareUnit.waitlist_active_count decremented", "on APPROVED: CareUnit.occupied_bed_count incremented, available_bed_count recomputed by care_unit_bed_availability, operational_posture recomputed by care_unit_operational_posture, VeteransHome.active_resident_count incremented", "on DENIED: the applicant's WaitlistEntry rows with status ACTIVE or OFFERED set to CANCELLED and CareUnit.waitlist_active_count decremented accordingly", "queue_position of the remaining ACTIVE/OFFERED entries on the unit recomputed by waitlist_queue_order", "CareUnit.version incremented", "Applicant.version incremented", "VeteransHome.version incremented"]
  # ---------- Writes: income and cost share ----------
  - method: POST
    path: "/svh/residents/{id}/income-records"
    description: "Declare one income stream for a resident for one month. countable_rate_bps is taken from COUNTABLE_RATE_BPS[income_type] and countable_amount_cents is derived from it; verification_status starts UNVERIFIED."
    roles: [BusinessOfficeManager]
    code: 201
    input: [income_type, monthly_amount_cents, effective_month]
    output: IncomeRecord
    side_effects: ["countable_rate_bps set from COUNTABLE_RATE_BPS[income_type]", "countable_amount_cents computed as round_half_up(monthly_amount_cents * countable_rate_bps / 10000)", "verification_status set to UNVERIFIED", "verified_by_user_id set to null", "parent Resident.version incremented"]
  - method: POST
    path: "/svh/income-records/{id}/verify"
    description: "Verify or reject a declared income stream. decision is VERIFIED or REJECTED. Only VERIFIED records enter a FINAL cost-share determination."
    roles: [BusinessOfficeManager]
    code: 200
    input: [decision]
    output: IncomeRecord
    side_effects: ["verification_status set to decision", "verified_by_user_id set from the X-User-ID header", "parent Resident.version incremented", "version incremented"]
  - method: POST
    path: "/svh/residents/{id}/cost-share-determinations"
    description: "Compute an immutable cost-share determination for one month. variant PROVISIONAL counts every non-REJECTED income record and every calendar day of the month; variant FINAL counts only VERIFIED income records and only settled RESIDENT_DAY census rows. expected_resident_version must equal the resident's current version."
    roles: [BusinessOfficeManager]
    code: 201
    input: [variant, effective_month, expected_resident_version, "declared_medical_expense_cents?"]
    output: CostShareDetermination
    side_effects: ["gross_countable_income_cents, pna_deduction_cents, income_tier, allowed_medical_deduction_cents, tiered_share_cents, resident_day_count, federal_per_diem_offset_cents and monthly_cost_share_cents computed by resident_cost_share_monthly for the requested variant", "delta_from_prior_cents set to this determination's monthly_cost_share_cents minus that of the prior determination for the same resident and effective_month (0 when none exists)", "determined_by_user_id set from the X-User-ID header", "Resident.monthly_cost_share_cents refreshed by governing_cost_share_selector", "Resident.billing_status set to FINAL_COST_SHARE when variant is FINAL", "Resident.version incremented"]
  # ---------- Writes: care plan ----------
  - method: POST
    path: "/svh/residents/{id}/care-plans"
    description: "Author a DRAFT care plan for a resident. supersedes_care_plan_id names the ACTIVE or REVIEW_DUE plan this revision will replace on activation; omit it for the resident's first plan."
    roles: [ClinicalAssessor]
    code: 201
    input: [care_level, adl_support_level, plan_date, "supersedes_care_plan_id?"]
    output: CarePlan
    side_effects: ["status set to DRAFT", "authored_by_user_id set from the X-User-ID header", "activated_at set to null", "review_due_date set to null", "revision_number set to the superseded plan's revision_number + 1, or 1 when supersedes_care_plan_id is absent", "parent Resident.version incremented"]
  - method: POST
    path: "/svh/care-plans/{id}/activate"
    description: "Activate a DRAFT or REVIEW_DUE care plan. Activating a DRAFT stamps review_due_date at plan_date + CARE_PLAN_REVIEW_DAYS days and moves the plan named by supersedes_care_plan_id to SUPERSEDED; re-activating a REVIEW_DUE plan restamps review_due_date at the current logical-clock date + CARE_PLAN_REVIEW_DAYS days and leaves revision_number unchanged."
    roles: [ClinicalAssessor]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status set to ACTIVE", "activated_at stamped from the logical clock", "review_due_date set to plan_date + CARE_PLAN_REVIEW_DAYS days when activating a DRAFT, or to the current logical-clock date + CARE_PLAN_REVIEW_DAYS days when re-activating a REVIEW_DUE plan", "the plan named by supersedes_care_plan_id set to SUPERSEDED", "Resident.current_care_level set to this plan's care_level", "Resident.version incremented", "version incremented"]
  # ---------- Writes: occupancy movements ----------
  - method: POST
    path: "/svh/residents/{id}/transfer"
    description: "Transfer an ADMITTED resident to another care unit. Requires an ACTIVE care plan whose care_level equals the target unit's care_level, and conserves the total of occupied plus held beds across the two units."
    roles: [AdmissionsCoordinator]
    code: 200
    input: [target_care_unit_id, effective_date, "transfer_note?"]
    output: Resident
    side_effects: ["Resident.care_unit_id set to target_care_unit_id", "Resident.current_care_level set to the target unit's care_level", "source CareUnit.occupied_bed_count decremented and target CareUnit.occupied_bed_count incremented", "available_bed_count recomputed by care_unit_bed_availability and operational_posture recomputed by care_unit_operational_posture on both units", "queue_position of the ACTIVE/OFFERED entries on both units recomputed by waitlist_queue_order", "CensusDay rows already generated keep their original care_unit_id, payable_rate_cents and claim attribution; only rows generated by a later census run carry the target unit", "source CareUnit.version and target CareUnit.version incremented", "Resident.version incremented"]
  - method: POST
    path: "/svh/residents/{id}/hospitalization"
    description: "Start a bed-hold when an ADMITTED resident is hospitalized. The bed stays counted against the unit as a held bed rather than an occupied bed."
    roles: [AdmissionsCoordinator, ClinicalAssessor]
    code: 200
    input: [hospitalization_start_date, "facility_note?"]
    output: Resident
    side_effects: ["occupancy_status set to HOSPITALIZED", "bed_hold_active set to true", "bed_hold_started_on set to hospitalization_start_date", "hospitalization_count incremented", "CareUnit.occupied_bed_count decremented and held_bed_count incremented", "available_bed_count recomputed by care_unit_bed_availability and operational_posture recomputed by care_unit_operational_posture", "CareUnit.version incremented", "Resident.version incremented"]
  - method: POST
    path: "/svh/residents/{id}/readmission"
    description: "Return a HOSPITALIZED resident to the held bed. The bed-hold interval [bed_hold_started_on, readmission_date) is closed and its length added to bed_hold_days_used."
    roles: [AdmissionsCoordinator, ClinicalAssessor]
    code: 200
    input: [readmission_date]
    output: Resident
    side_effects: ["occupancy_status set to ADMITTED", "bed_hold_active set to false", "bed_hold_days_used increased by days_between(bed_hold_started_on, readmission_date)", "last_hospitalization_end_date set to readmission_date", "bed_hold_started_on left unchanged (never cleared; the census run replays the closed interval from it)", "readmission_count incremented", "CareUnit.held_bed_count decremented and occupied_bed_count incremented", "available_bed_count recomputed by care_unit_bed_availability and operational_posture recomputed by care_unit_operational_posture", "CareUnit.version incremented", "Resident.version incremented"]
  - method: POST
    path: "/svh/residents/{id}/discharge"
    description: "Discharge a resident from the home. Releases the bed (occupied or held), cancels the resident's own waitlist follow-ups, and closes billing."
    roles: [AdmissionsCoordinator]
    code: 200
    input: [discharge_date, discharge_reason]
    output: Resident
    side_effects: ["occupancy_status set to DISCHARGED", "billing_status set to CLOSED", "discharge_date and discharge_reason stored", "bed_hold_active set to false; bed_hold_started_on left unchanged (never cleared)", "CareUnit.occupied_bed_count decremented when the resident was ADMITTED, or held_bed_count decremented when the resident was HOSPITALIZED", "available_bed_count recomputed by care_unit_bed_availability and operational_posture recomputed by care_unit_operational_posture", "every DRAFT CarePlan of the resident set to VOID and every ACTIVE or REVIEW_DUE CarePlan of the resident set to SUPERSEDED", "VeteransHome.active_resident_count decremented", "no bed offer is made by this endpoint; the freed bed is offered only by step 4 of the next POST /svh/_ops/census-run", "CareUnit.version incremented", "VeteransHome.version incremented", "Resident.version incremented"]
  # ---------- Writes: trust fund ----------
  - method: POST
    path: "/svh/residents/{id}/trust-fund-transactions"
    description: "Post a resident trust fund entry. txn_type DEPOSIT and PNA_CREDIT are positive; WITHDRAWAL and COST_SHARE_DEBIT are negative; REVERSAL is reserved for the reverse endpoint. balance_after_cents is the running balance produced by trust_fund_running_balance."
    roles: [BusinessOfficeManager]
    code: 201
    input: [txn_type, amount_cents, effective_date, "memo?"]
    output: TrustFundTransaction
    side_effects: ["signed_amount_cents set to +amount_cents for DEPOSIT/PNA_CREDIT and -amount_cents for WITHDRAWAL/COST_SHARE_DEBIT", "balance_after_cents computed by trust_fund_running_balance", "reversed set to false and reverses_transaction_id set to null", "recorded_by_user_id set from the X-User-ID header", "Resident.trust_fund_balance_cents set to balance_after_cents", "Resident.version incremented"]
  - method: POST
    path: "/svh/trust-fund-transactions/{id}/reverse"
    description: "Post a compensating REVERSAL entry that negates one prior trust fund entry. The original is flagged reversed and the resident's balance returns to its pre-original value when no later entry intervened."
    roles: [BusinessOfficeManager]
    code: 201
    input: ["memo?"]
    output: TrustFundTransaction
    side_effects: ["a new TrustFundTransaction created with txn_type REVERSAL, reverses_transaction_id set to the original, amount_cents equal to the original's amount_cents and signed_amount_cents equal to the negation of the original's signed_amount_cents", "the original's reversed set to true", "balance_after_cents of the new entry computed by trust_fund_running_balance", "Resident.trust_fund_balance_cents set to the new entry's balance_after_cents", "Resident.version incremented"]
  # ---------- Writes: per diem claims ----------
  - method: POST
    path: "/svh/per-diem-claims"
    description: "Open a DRAFT per diem claim for one care unit and one claim_month. basis defaults to AUDITED_BASIS; pass CENSUS_BASIS for the census-reported variant. Creation attributes the unit's unattributed CensusDay rows for the month to this claim and prices them."
    roles: [BusinessOfficeManager]
    code: 201
    input: [veterans_home_id, care_unit_id, claim_month, "basis?"]
    output: PerDiemClaim
    side_effects: ["status set to DRAFT", "correction_generation set to 0 and corrects_claim_id set to null", "every CensusDay row of the care unit whose service_date falls in claim_month and whose per_diem_claim_id is null or points at a REJECTED/VOID claim gets per_diem_claim_id set to this claim", "resident_day_count, bed_hold_day_count, billable_day_count, claim_amount_cents and census_reported_resident_count computed by per_diem_claim_amount for the declared basis", "recognition_verified set to false", "submitted_at, adjudicated_at, paid_amount_cents, rejection_code and adjudication_note set to null", "parent VeteransHome.version incremented", "CareUnit.version incremented"]
  - method: POST
    path: "/svh/per-diem-claims/{id}/correct"
    description: "Open a correcting DRAFT claim against a PAID or REJECTED claim for the same care unit and claim_month. expected_claim_version must equal the target claim's current version. basis defaults to the target's basis. claim_month is an OPTIONAL confirmation echo: the new claim always copies the target's claim_month, but when the caller supplies claim_month it must equal the target's, otherwise the write is rejected with ERR_CLAIM_MONTH_MISMATCH."
    roles: [BusinessOfficeManager]
    code: 201
    input: [expected_claim_version, "claim_month?", "basis?", "correction_note?"]
    output: PerDiemClaim
    side_effects: ["the optional claim_month echo, when present, is compared against the target's claim_month before anything is written", "a new PerDiemClaim created with status DRAFT, corrects_claim_id set to the target, claim_month and care_unit_id copied from the target, and correction_generation set to the target's correction_generation + 1", "every CensusDay row of the care unit in claim_month whose per_diem_claim_id is null or points at the target claim gets per_diem_claim_id set to the new claim, with claimed reset to false", "resident_day_count, bed_hold_day_count, billable_day_count, claim_amount_cents and census_reported_resident_count of the new claim computed by per_diem_claim_amount for the declared basis", "adjudication_note of the new claim set to correction_note", "target PerDiemClaim.version incremented", "VeteransHome.version incremented", "CareUnit.version incremented"]
  - method: POST
    path: "/svh/per-diem-claims/{id}/submit"
    description: "Submit a DRAFT claim to the federal per diem program. Requires the home RECOGNIZED, the unit not DECERTIFIED, a closed claim_month, and a non-empty census; the amount is re-priced from the live census before submission."
    roles: [BusinessOfficeManager]
    code: 200
    input: []
    output: PerDiemClaim
    side_effects: ["resident_day_count, bed_hold_day_count, billable_day_count, claim_amount_cents and census_reported_resident_count re-computed by per_diem_claim_amount", "status set to SUBMITTED", "submitted_at stamped from the logical clock", "recognition_verified set to true", "every attributed CensusDay row gets claimed set to true", "CareUnit.version incremented", "version incremented"]
  - method: POST
    path: "/svh/per-diem-claims/{id}/adjudicate"
    description: "Federal adjudication of a SUBMITTED claim. outcome PAID stores paid_amount_cents equal to claim_amount_cents; outcome REJECTED requires a rejection_code and releases the claim's census days for re-attribution."
    roles: [FederalPerDiemAuditor]
    code: 200
    input: [outcome, "rejection_code?", "adjudication_note?"]
    output: PerDiemClaim
    side_effects: ["status set to PAID or REJECTED", "adjudicated_at stamped from the logical clock", "on PAID: paid_amount_cents set to claim_amount_cents and rejection_code set to null", "on REJECTED: paid_amount_cents set to 0, rejection_code stored, and every attributed CensusDay row released with per_diem_claim_id set to null and claimed set to false", "adjudication_note stored", "CareUnit.version incremented", "version incremented"]
  # ---------- Test-driving endpoints ----------
  - method: POST
    path: "/svh/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit instant so deadline, offer-window, bed-hold and claim-month rules are deterministic. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [StateProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["the logical clock used by every timestamp, offer expiry, bed-hold day count and claim-month closure check is set to to_iso8601"]
  - method: POST
    path: "/svh/_ops/census-run"
    description: "Nightly operations checkpoint that materialises census days and runs the monthly resident-account postings. Steps execute in this pinned order: (1) generate missing CensusDay rows for every non-DISCHARGED resident through through_date, (2) credit each such resident's personal needs allowance, (3) debit each resident's governing monthly cost share, (4) recompute priority scores, issue waitlist offers into free beds and then decline/expire elapsed offers, (5) flag every ACTIVE care plan whose review_due_date is strictly earlier than through_date as REVIEW_DUE. Restricted to one home when veterans_home_id is supplied."
    roles: [StateProgramAdmin]
    code: 200
    input: [through_date, "veterans_home_id?"]
    output: { generated_census_day_count: integer, pna_credited_resident_count: integer, cost_share_debited_resident_count: integer, skipped_cost_share_debit_count: integer, offered_waitlist_entry_count: integer, expired_offer_count: integer, review_due_care_plan_count: integer, current_utc: datetime }
    side_effects: ["one CensusDay row created per resident per calendar date from the later of admission_date and the resident's last_census_date + 1 day through through_date, each classified by census_day_classification with care_level, per_diem_eligible and payable_rate_cents pinned at creation", "Resident.last_census_date advanced to through_date", "one PNA_CREDIT TrustFundTransaction posted per resident for the home's personal_needs_allowance_monthly_cents with effective_date set to through_date and memo set to 'personal needs allowance'; PINNED as once per resident per calendar month - a resident who already holds a PNA_CREDIT row whose effective_date falls in the calendar month of through_date is skipped silently and is NOT counted in pna_credited_resident_count, so re-running the checkpoint for the same month never double-credits", "one COST_SHARE_DEBIT TrustFundTransaction posted per resident whose governing monthly_cost_share_cents is greater than 0, with effective_date set to through_date and memo set to 'monthly cost share', skipped and counted in skipped_cost_share_debit_count when the posting would breach the personal-needs-allowance reserve; a resident whose governing cost share is exactly 0 is neither debited nor counted as skipped; PINNED as once per resident per calendar month in the same sense - a resident who already holds a COST_SHARE_DEBIT row whose effective_date falls in the calendar month of through_date is skipped silently and counted in NEITHER cost_share_debited_resident_count nor skipped_cost_share_debit_count", "Resident.trust_fund_balance_cents refreshed by trust_fund_running_balance", "the highest-ranked ACTIVE WaitlistEntry per free bed on each OPEN unit set to OFFERED by waitlist_queue_order with offer_expires_at set to the logical clock plus OFFER_WINDOW_DAYS days", "priority_score recomputed by applicant_priority_score for every applicant holding an entry with status ACTIVE or OFFERED on a touched unit, so the tenure term advances with the clock", "OFFERED entries whose offer_expires_at is strictly earlier than the logical clock set back to ACTIVE with Applicant.declined_offer_count incremented and Applicant.priority_score recomputed; any ACTIVE entry whose applicant has reached MAX_DECLINED_OFFERS is then set to EXPIRED with queue_position 0 in the same run", "CareUnit.waitlist_active_count and queue_position recomputed on every touched unit", "ACTIVE CarePlan rows whose review_due_date is strictly earlier than through_date set to REVIEW_DUE", "Resident.version, CareUnit.version and Applicant.version incremented for every touched row"]

errors:
  # --- auth / authz ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting X-User-Role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "X-User-Role is ResidentRepresentative and X-User-ID is not the id of the Resident addressed by the request."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same operator who performed the incompatible prior step: the assessor of the cited ClinicalAssessment on an admission decision, or the recorder of the trust fund entry being reversed."
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required field is absent, an enum value is outside its declared set, a numeric field is out of its declared range, a date is not YYYY-MM-DD, a month is not YYYY-MM, licensed_bed_count < 1, out_of_service_bed_count > licensed_bed_count, amount_cents <= 0, or pagination limit/offset are out of range."
  # --- existence ---
  - id: ERR_HOME_NOT_FOUND
    http: 404
    condition: "The addressed veterans_home_id, or a veterans_home_id supplied in a request body, matches no VeteransHome."
  - id: ERR_CARE_UNIT_NOT_FOUND
    http: 404
    condition: "The addressed care_unit_id, or a care_unit_id / target_care_unit_id supplied in a request body, matches no CareUnit."
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "The addressed applicant_id, or an applicant_id supplied in a request body, matches no Applicant."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "The addressed clinical assessment id, or a clinical_assessment_id supplied in a request body, matches no ClinicalAssessment."
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "The addressed resident_id, or a resident_id supplied as a filter on an owner-scoped read, matches no Resident."
  - id: ERR_INCOME_RECORD_NOT_FOUND
    http: 404
    condition: "The addressed income record id matches no IncomeRecord."
  - id: ERR_CARE_PLAN_NOT_FOUND
    http: 404
    condition: "The addressed care plan id, or a supersedes_care_plan_id supplied in a request body, matches no CarePlan."
  - id: ERR_CENSUS_DAY_NOT_FOUND
    http: 404
    condition: "The addressed census day id matches no CensusDay."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "The addressed per diem claim id matches no PerDiemClaim."
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "The addressed trust fund transaction id matches no TrustFundTransaction."
  # --- optimistic concurrency ---
  - id: ERR_CARE_UNIT_VERSION_STALE
    http: 412
    condition: "expected_care_unit_version on an admission decision does not equal the target CareUnit's current version."
  - id: ERR_RESIDENT_VERSION_STALE
    http: 412
    condition: "expected_resident_version on a cost-share determination does not equal the Resident's current version."
  - id: ERR_CLAIM_VERSION_STALE
    http: 412
    condition: "expected_claim_version on a claim correction does not equal the target PerDiemClaim's current version."
  # --- state preconditions ---
  - id: ERR_APPLICANT_STATE_INVALID
    http: 409
    condition: "Applicant.status does not admit the requested move: eligibility determination outside {SUBMITTED, INELIGIBLE}, waitlist placement outside {ELIGIBLE, WAITLISTED}, admission decision outside {WAITLISTED}."
  - id: ERR_REDETERMINATION_LIMIT
    http: 409
    condition: "An INELIGIBLE applicant is reopened when redetermination_count has already reached MAX_REDETERMINATIONS."
  - id: ERR_ASSESSMENT_STATE_INVALID
    http: 409
    condition: "ClinicalAssessment.status is not DRAFT on submit, or not SUBMITTED when cited by an admission decision."
  - id: ERR_RESIDENT_STATE_INVALID
    http: 409
    condition: "Resident.occupancy_status does not admit the requested move: hospitalization or transfer outside {ADMITTED}, readmission outside {HOSPITALIZED}, discharge outside {ADMITTED, HOSPITALIZED}, or any income / cost-share / care-plan / trust-fund write on a DISCHARGED resident."
  - id: ERR_CARE_PLAN_STATE_INVALID
    http: 409
    condition: "CarePlan.status is outside {DRAFT, REVIEW_DUE} on activate, or a supersedes_care_plan_id target is outside {ACTIVE, REVIEW_DUE}."
  - id: ERR_INCOME_RECORD_STATE_INVALID
    http: 409
    condition: "IncomeRecord.verification_status is not UNVERIFIED when a verification decision is posted."
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "PerDiemClaim.status is not DRAFT on submit, not SUBMITTED on adjudicate, or outside {PAID, REJECTED} on correct."
  - id: ERR_TRANSACTION_ALREADY_REVERSED
    http: 409
    condition: "The trust fund transaction being reversed already has reversed == true, or its txn_type is REVERSAL."
  - id: ERR_HOME_RECOGNITION_STATE_INVALID
    http: 409
    condition: "The recognition action does not match the home's current recognition_status (GRANT outside PROVISIONAL, SUSPEND outside RECOGNIZED, RESTORE outside SUSPENDED), or a RESTORE is attempted while decertified_unit_count > 0."
  # --- compliance / certification gates ---
  - id: ERR_HOME_NOT_RECOGNIZED
    http: 409
    condition: "A per diem claim is submitted while its VeteransHome.recognition_status is not RECOGNIZED."
  - id: ERR_UNIT_NOT_CERTIFIED
    http: 409
    condition: "The care unit is not CERTIFIED for an admission decision or transfer in, or is DECERTIFIED for a waitlist placement, a readmission, or a claim submission."
  - id: ERR_UNIT_POSTURE_BLOCKED
    http: 409
    condition: "The care unit's operational_posture is not OPEN for an admission decision, or is FROZEN for a transfer in."
  # --- clinical / referential ---
  - id: ERR_CARE_LEVEL_MISMATCH
    http: 409
    condition: "A NURSING assessment is submitted with skilled_nursing_hours_per_day < 2.00, the cited assessment's assessed_care_level differs from the target unit's care_level, the applicant's requested_care_level differs from the waitlisted unit's care_level, or the resident's ACTIVE care plan care_level differs from the transfer target unit's care_level."
  - id: ERR_NO_ACTIVE_CARE_PLAN
    http: 409
    condition: "A transfer is requested for a resident who has no CarePlan with status ACTIVE."
  - id: ERR_NO_WAITLIST_ENTRY_FOR_UNIT
    http: 409
    condition: "An admission decision names a care_unit_id on which the applicant holds no WaitlistEntry with status ACTIVE or OFFERED."
  - id: ERR_INVALID_TRANSFER_TARGET
    http: 409
    condition: "target_care_unit_id equals the resident's current care_unit_id, or belongs to a different veterans home."
  - id: ERR_INCOME_NOT_VERIFIED
    http: 409
    condition: "A FINAL cost-share determination is requested for a month in which the resident has no IncomeRecord with verification_status VERIFIED."
  - id: ERR_DUPLICATE_WAITLIST_ENTRY
    http: 409
    condition: "A WaitlistEntry with status ACTIVE or OFFERED already exists for the same (applicant_id, care_unit_id)."
  - id: ERR_CLAIM_PERIOD_OVERLAP
    http: 409
    condition: "Another PerDiemClaim for the same care_unit_id and claim_month already has status DRAFT, SUBMITTED or PAID."
  - id: ERR_CLAIM_MONTH_MISMATCH
    http: 409
    condition: "A correcting claim's target belongs to a different care unit than the correction, or the correction would carry a different claim_month than its target."
  - id: ERR_CENSUS_DAY_ALREADY_CLAIMED
    http: 409
    condition: "A CensusDay row required by the claim is already attributed to a PerDiemClaim with status SUBMITTED or PAID."
  # --- temporal ---
  - id: ERR_CLAIM_MONTH_NOT_CLOSED
    http: 409
    condition: "The claim's claim_month is the month of the current logical clock or later at submission time."
  - id: ERR_BED_HOLD_OVERLAP
    http: 409
    condition: "hospitalization_start_date is at or before the resident's last_hospitalization_end_date, so the new bed-hold interval would overlap the previous one."
  - id: ERR_DATE_OUT_OF_RANGE
    http: 409
    condition: "A supplied date violates its ordering rule against the resident's admission_date, bed_hold_started_on or prior dates, or lies in the future relative to the current logical clock."
  # --- capacity ---
  - id: ERR_NO_AVAILABLE_BED
    http: 409
    condition: "The target care unit's available_bed_count is 0 when an admission or transfer in is attempted."
  - id: ERR_BED_HOLD_EXHAUSTED
    http: 409
    condition: "bed_hold_days_used has reached BED_HOLD_MAX_DAYS at hospitalization, or closing the bed-hold interval at readmission would push bed_hold_days_used above BED_HOLD_MAX_DAYS."
  - id: ERR_CLAIM_CENSUS_EMPTY
    http: 409
    condition: "The claim being submitted has billable_day_count 0 or census_reported_resident_count 0."
  # --- fiscal ---
  - id: ERR_TRUST_FUND_INSUFFICIENT
    http: 409
    condition: "A WITHDRAWAL would drive the resident's trust fund balance below 0."
  - id: ERR_PNA_RESERVE_BREACH
    http: 409
    condition: "A COST_SHARE_DEBIT would drive the resident's trust fund balance below the home's personal_needs_allowance_monthly_cents reserve."

roles:
  - name: StateProgramAdmin
    description: "State veterans affairs program administrator who registers homes and care units, manages federal recognition posture, sets the logical clock and runs the nightly census/ops checkpoint."
    identity: opaque
    exclusive_operations: ["register a veterans home", "create a care unit", "change a home's recognition posture", "set the logical clock", "run the census/ops checkpoint"]
    shared_operations: ["read homes, care units, applicants, residents, care plans, census days, per diem claims and trust fund transactions"]
  - name: AdmissionsCoordinator
    description: "Home admissions staff who file applications, adjudicate eligibility, manage the waitlist, decide admissions, and move residents between units and occupancy states."
    identity: opaque
    exclusive_operations: ["file an applicant", "run an eligibility determination", "create a waitlist entry", "record an admission decision", "transfer a resident", "discharge a resident"]
    shared_operations: ["start a hospitalization bed-hold", "record a readmission", "read homes, care units, applicants, waitlist entries, clinical assessments, residents and care plans"]
  - name: ClinicalAssessor
    description: "Licensed clinician who performs level-of-care assessments and authors and activates resident care plans. Cannot decide admissions, enforcing segregation of duties against the coordinator."
    identity: opaque
    exclusive_operations: ["create a clinical assessment", "submit a clinical assessment", "author a care plan", "activate a care plan"]
    shared_operations: ["start a hospitalization bed-hold", "record a readmission", "read care units, applicants, waitlist entries, clinical assessments, residents and care plans"]
  - name: BusinessOfficeManager
    description: "Home business office staff who record and verify resident income, determine cost share, manage the resident trust fund, and prepare and submit per diem claims."
    identity: opaque
    exclusive_operations: ["record an income record", "verify an income record", "create a cost-share determination", "post a trust fund transaction", "reverse a trust fund transaction", "open a per diem claim", "open a correcting per diem claim", "submit a per diem claim"]
    shared_operations: ["read homes, care units, applicants, residents, income records, cost-share determinations, care plans, census days, per diem claims and trust fund transactions"]
  - name: FederalPerDiemAuditor
    description: "Federal per diem program adjudicator who pays or rejects submitted claims. Cannot create, correct or submit claims, enforcing segregation of duties against the business office."
    identity: opaque
    exclusive_operations: ["adjudicate a per diem claim"]
