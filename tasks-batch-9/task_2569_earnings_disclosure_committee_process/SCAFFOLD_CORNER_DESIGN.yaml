              captures: { foreign_officer_2: $.data.id }
            - call: "POST /disclosure/charters/${charter_b}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${foreign_officer}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_a}", internal_buffer_days: 5 }
              as: ComplianceAdmin
