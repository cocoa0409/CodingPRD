        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Booking.HELD_to_CONFIRMED
        distinguishing_aspect: |
          A confirm on a QUOTE_DRAFT booking (wrong state, priority 6) that ALSO has no signed waivers
          (priority 8 business_safety) returns the state error ERR_INVALID_STATE, not ERR_WAIVERS_INCOMPLETE
          — pairing state vs business_safety.
        test_recipe:
          setup:
            - "Booking in QUOTE_DRAFT (never held) with 0 signed waivers; both checks would fail."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vp1", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rp1", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
