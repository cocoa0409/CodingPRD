          assert:
            - "MedicationOrder.${mo_tol_id}.mme_variant == TOLERANT"
            - "MedicationOrder.${mo_tol_id}.mme_daily == 40.0"
            - "MedicationOrder.${mo_naive_id}.mme_variant == NAIVE"
            - "MedicationOrder.${mo_naive_id}.mme_daily == 30.0"

      - name: document_execution_requirement_two_witness_and_notary_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.document_execution_requirement
          - entities.Patient.fields.jurisdiction_code
          - entities.AdvanceCareDocument.fields.execution_ready
          - errors[ERR_EXECUTION_REQUIREMENT_UNMET]
        distinguishing_aspect: "The identical signature_log of two WITNESS entries makes a JUR_TWO_WITNESS document execution_ready true and leaves a JUR_NOTARY document execution_ready false, so the same evidence executes in one jurisdiction and is rejected with ERR_EXECUTION_REQUIREMENT_UNMET in the other."
