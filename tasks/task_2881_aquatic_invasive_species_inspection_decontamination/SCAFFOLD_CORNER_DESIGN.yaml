            - call: "POST /inspection-records/${rec_low}/screening"
              payload: { expected_watercraft_version: "${wc_low_v}", residual_water_present: true, standing_water_ml: 400, prior_water_body_id: "${wb_id}" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_mod}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
