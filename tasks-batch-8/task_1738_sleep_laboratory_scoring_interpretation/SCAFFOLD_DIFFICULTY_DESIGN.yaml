              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_STUDY_NOT_IN_PROGRESS (state p7 wins over safety p8), NOT ERR_SPLIT_CENTRAL_PREDOMINANCE"
            - "SleepStudy.${st1}.split_outcome remains null and status remains SCHEDULED"

      - name: schedule_temporal_beats_bed_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_AUTH_WINDOW_VIOLATION]
          - errors[ERR_BED_NIGHT_CONFLICT]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: scheduling on 2026-08-20 is
          outside order A's window [2026-08-01, 2026-08-10] AND the bed is occupied that night
          by another study; the temporal error ERR_AUTH_WINDOW_VIOLATION must win.
        test_recipe:
          setup:
            - "Bed B1 occupied on 2026-08-20 by study C (order B, window covering 2026-08-20); confirmed staffing capacity 2 that night"
            - "Order A authorized with window [2026-08-01, 2026-08-10]"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D5B-01", full_name: "Pat Ten", date_of_birth: "1979-10-10" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1", titration_capable: false }, as: LabDirector, captures: { bed1: $.data.id } }
