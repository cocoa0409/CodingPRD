scenario: |
  Generate task harder than expert level!

  2486. Trade Publication Circulation Audit (business-to-business trade publisher): qualified
  circulation definition with job function, industry and purchasing authority criteria, subscriber
  qualification collection through requests with source documentation and renewal cycles, audit
  preparation with source document retention and statement reconciliation, circulation statement
  production with paid, qualified non-paid and controlled breakdowns, list hygiene with
  undeliverable removal and requalification requirements, advertiser rate base guarantees with
  make-good obligations for shortfalls, digital audience measurement integration with website and
  newsletter metrics, audit findings resolution and statement restatement when discrepancies are
  found

domain_name: trade-publication-circulation-audit
api_prefix: /circulation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer collections joined by explicit FK body fields. Only QualificationRule and
  # SourceDocument are created through a nested path (they cannot exist without their owner);
  # every other entity is addressed at /circulation/<collection>/{id} and links by FK field.

  state_machine_shape: cyclic
  # CirculationStatement cycles UNDER_AUDIT -> FINDINGS_OPEN -> UNDER_AUDIT; AuditFinding cycles
  # RESPONSE_SUBMITTED -> REJECTED_REOPENED -> RESPONSE_SUBMITTED; QualificationRequest cycles
  # UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW; Subscriber carries two
  # independent dimensions (qualification_status x delivery_status) on the same row.

  relationship_patterns:
    - one_to_many          # Publication -> Subscriber / CirculationStatement / AdvertiserContract
    - self_referential     # CirculationStatement.restates_statement_id -> CirculationStatement.id
    - cross_aggregate      # AuditFinding.subscriber_id crosses the audit aggregate into circulation
    - polymorphic: false

  role_model: segregation_of_duties
  # The X-User-ID that prepared a CirculationStatement may not certify it; the auditor X-User-ID
  # that raised an AuditFinding may not accept its resolution.

  consistency_model: immediate

  difficulty_calibration: expert_plus
  # Deliberately above the §0.4 Expert band (12 entities / 50 endpoints / 34 errors / 7 state
  # machines / 7 calculations) because the scenario demands it: qualification scoring, statement
  # breakdown with a controlled-copy cap, rate-base make-good money ledger, digital-audience
  # dedup, list hygiene and restatement are six coupled subsystems that all feed one audited
  # number (CirculationStatement.total_qualified_copies).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Publication
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: trade publication title
        constraints: "1..200 chars, required"
      - name: frequency
        type: enum
        source: input
        description: issue frequency
        constraints: "one of {WEEKLY, MONTHLY, QUARTERLY}"
      - name: industry_code
        type: string
        source: input
        description: the industry vertical the publication serves
        constraints: "1..40 chars, required"
      - name: qualification_validity_months
        type: integer
        source: input
        description: months a verified qualification stays valid before it lapses
        default: 36
        constraints: "1..60"
      - name: renewal_grace_days
        type: integer
        source: input
        description: days before qualification_expires_at inside which a renewal verification may truncate the running window instead of being rejected as an overlap
        default: 90
        constraints: "0..365"
      - name: source_doc_retention_months
        type: integer
        source: input
        description: months a SourceDocument must be retained before it may be purged
        default: 36
        constraints: "1..120"
      - name: undeliverable_restrict_pct
        type: number
        source: input
        description: undeliverable_pct at or above which audit_posture becomes RESTRICTED
        default: 5.00
        constraints: "0.00..100.00, 2 decimals"
      - name: materiality_pct
        type: number
        source: input
        description: discrepancy_pct at or above which an audit report forces statement restatement
        default: 2.00
        constraints: "0.00..100.00, 2 decimals"
      - name: controlled_cap_pct
        type: number
        source: input
        description: maximum share of total_qualified_copies that CONTROLLED copies may occupy
        default: 25.00
        constraints: "0.00..99.00, 2 decimals"
      - name: copies_on_file_total
        type: integer
        source: computed
        description: sum of Subscriber.copies over every Subscriber of this publication, in any qualification_status and any delivery_status
        default: 0
      - name: paid_copies_on_file
        type: integer
        source: computed
        description: sum of Subscriber.copies where subscription_class == PAID (any status)
        default: 0
      - name: qualified_non_paid_copies_on_file
        type: integer
        source: computed
        description: sum of Subscriber.copies where subscription_class == QUALIFIED_NON_PAID (any status)
        default: 0
      - name: controlled_copies_on_file
        type: integer
        source: computed
        description: sum of Subscriber.copies where subscription_class == CONTROLLED (any status)
        default: 0
      - name: deliverable_copies
        type: integer
        source: computed
        description: sum of Subscriber.copies where delivery_status == DELIVERABLE
        default: 0
      - name: undeliverable_copies
        type: integer
        source: computed
        description: sum of Subscriber.copies where delivery_status == UNDELIVERABLE
        default: 0
      - name: removed_copies
        type: integer
        source: computed
        description: sum of Subscriber.copies where delivery_status == REMOVED
        default: 0
      - name: undeliverable_pct
        type: number
        source: computed
        description: "hygiene ratio: round_half_up((undeliverable_copies + removed_copies) * 100 / copies_on_file_total, 2); exactly 0.00 when copies_on_file_total == 0"
        default: 0.00
      - name: open_material_findings_count
        type: integer
        source: computed
        description: count of AuditFinding rows with severity == MATERIAL and status IN {OPEN, RESPONSE_SUBMITTED, REJECTED_REOPENED} reachable through AuditEngagement.statement_id -> CirculationStatement.publication_id == this id
        default: 0
      - name: open_critical_findings_count
        type: integer
        source: computed
        description: same walk as open_material_findings_count but severity == CRITICAL
        default: 0
      - name: audit_posture
        type: enum
        source: computed
        description: gate on child operations, recomputed by calculations.publication_audit_posture
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"

  - name: QualificationRule
    parent: Publication
    common_fields: true
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id; supplied by the nested creation path"
      - name: dimension
        type: enum
        source: input
        description: which qualified-circulation criterion this rule scores
        constraints: "one of {JOB_FUNCTION, INDUSTRY, PURCHASING_AUTHORITY}; unique per publication_id"
      - name: allowed_values
        type: array
        source: input
        description: exact string values that score the rule's points; membership is case-sensitive equality
        constraints: "1..20 non-empty strings"
      - name: points
        type: integer
        source: input
        description: points awarded when the attested value is a member of allowed_values
        constraints: "0..100"
      - name: is_mandatory
        type: boolean
        source: input
        description: when true, a qualification request that scores 0 on this dimension is rejected regardless of total score
        default: false

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id"
      - name: company_name
        type: string
        source: input
        description: subscribing company / recipient organisation
        constraints: "1..200 chars, required"
      - name: contact_email
        type: string
        source: input
        description: delivery contact address
        constraints: "1..200 chars, required"
      - name: job_function_code
        type: string
        source: input
        description: recipient job function on file; overwritten with the attested value on verification
        constraints: "1..40 chars, required"
      - name: industry_code
        type: string
        source: input
        description: recipient industry on file; overwritten with the attested value on verification
        constraints: "1..40 chars, required"
      - name: purchasing_authority_level
        type: enum
        source: input
        description: purchasing authority on file; overwritten with the attested value on verification
        constraints: "one of {NONE, RECOMMENDS, SPECIFIES, APPROVES}"
      - name: subscription_class
        type: enum
        source: input
        description: circulation class this recipient's copies are reported under
        constraints: "one of {PAID, QUALIFIED_NON_PAID, CONTROLLED}"
      - name: copies
        type: integer
        source: input
        description: copies served to this recipient per issue
        default: 1
        constraints: ">= 1"
      - name: paid_amount_cents
        type: integer
        source: input
        description: cents actually collected; must be >= 1 when subscription_class == PAID
        default: 0
        constraints: ">= 0"
      - name: qualification_status
        type: enum
        source: system
        description: qualification dimension of the two independent status dimensions on this row
        default: UNQUALIFIED
        constraints: "one of {UNQUALIFIED, PENDING_QUALIFICATION, QUALIFIED, LAPSED, REQUALIFICATION_REQUIRED}"
      - name: delivery_status
        type: enum
        source: system
        description: deliverability dimension, evolves independently of qualification_status
        default: DELIVERABLE
        constraints: "one of {DELIVERABLE, UNDELIVERABLE, REMOVED}"
      - name: undeliverable_count
        type: integer
        source: system
        description: returned/bounced copies recorded since the last requalification reinstatement
        default: 0
      - name: qualification_score
        type: integer
        source: computed
        description: score of the most recently VERIFIED QualificationRequest for this subscriber; 0 before the first verification
        default: 0
      - name: qualified_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent verification; null before the first one
      - name: qualification_expires_at
        type: datetime
        source: computed
        description: qualified_at + Publication.qualification_validity_months; null before the first verification

  - name: SourceDocument
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; supplied by the nested creation path"
      - name: doc_type
        type: enum
        source: input
        description: evidence class backing a qualification request
        constraints: "one of {SIGNED_REQUEST_CARD, WEB_FORM_CAPTURE, TELEPHONE_SCRIPT_LOG, EMAIL_CONFIRMATION}"
      - name: captured_at
        type: datetime
        source: input
        description: instant the evidence was captured from the recipient; must be <= current logical clock
      - name: storage_ref
        type: string
        source: input
        description: archive locator for the retained image/transcript
        constraints: "1..120 chars, required"
      - name: retention_expires_at
        type: datetime
        source: computed
        description: captured_at + Publication.source_doc_retention_months of the owning subscriber's publication
      - name: purge_status
        type: enum
        source: system
        description: retention state; PURGED evidence can no longer support audited circulation
        default: RETAINED
        constraints: "one of {RETAINED, PURGED}"
      - name: purged_at
        type: datetime
        source: system
        description: logical-clock instant of the purge; null while RETAINED

  - name: QualificationRequest
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id"
      - name: source_document_id
        type: string
        source: input
        description: "FK -> SourceDocument.id; must belong to the same subscriber_id"
      - name: request_channel
        type: enum
        source: input
        description: channel the qualification request arrived through
        constraints: "one of {DIRECT_MAIL, WEB, TELEPHONE, EMAIL}"
      - name: signed_at
        type: datetime
        source: input
        description: instant the recipient signed/confirmed the request; must be <= current logical clock
      - name: attested_job_function_code
        type: string
        source: input
        description: job function the recipient attested on this request
        constraints: "1..40 chars, required"
      - name: attested_industry_code
        type: string
        source: input
        description: industry the recipient attested on this request
        constraints: "1..40 chars, required"
      - name: attested_purchasing_authority
        type: enum
        source: input
        description: purchasing authority the recipient attested on this request
        constraints: "one of {NONE, RECOMMENDS, SPECIFIES, APPROVES}"
      - name: status
        type: enum
        source: system
        description: review lifecycle, cyclic through INFO_REQUESTED
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, VERIFIED, REJECTED}"
      - name: computed_score
        type: integer
        source: computed
        description: calculations.qualification_score output, recomputed on every review entry and on verification
        default: 0
      - name: info_request_count
        type: integer
        source: system
        description: times this request has been sent back for more information; capped at INFO_REQUEST_LIMIT
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID that last moved the request into UNDER_REVIEW
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of VERIFIED/REJECTED
      - name: decision_reason
        type: string
        source: system
        description: "reason recorded on REJECTED (either an operator note or the literal SUPERSEDED_BY_NEWER_REQUEST)"
      - name: effective_from
        type: datetime
        source: computed
        description: start of the qualification window this request opened on verification; null unless VERIFIED
      - name: effective_to
        type: datetime
        source: computed
        description: effective_from + Publication.qualification_validity_months; null unless VERIFIED

  - name: CirculationStatement
    parent: null
    common_fields: true
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id"
      - name: restates_statement_id
        type: string
        source: input
        description: "FK -> CirculationStatement.id; null for an original statement, set when this statement restates a RESTATEMENT_REQUIRED predecessor"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the reporting period
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the reporting period; must be <= current logical clock
      - name: statement_type
        type: enum
        source: computed
        description: PUBLISHER_STATEMENT when restates_statement_id is null, AUDITED when it is set
        constraints: "one of {PUBLISHER_STATEMENT, AUDITED}"
      - name: basis
        type: enum
        source: input
        description: which variant of calculations.statement_circulation_breakdown produced the copy counts
        default: AS_OF_PERIOD_END
        constraints: "one of {AS_OF_PERIOD_END, AUDIT_VERIFIED}"
      - name: status
        type: enum
        source: system
        description: statement lifecycle; cycles UNDER_AUDIT <-> FINDINGS_OPEN
        default: DRAFT
        constraints: "one of {DRAFT, FILED, UNDER_AUDIT, FINDINGS_OPEN, RESTATEMENT_REQUIRED, AUDIT_CLEARED, SUPERSEDED}"
      - name: paid_copies
        type: integer
        source: computed
        description: PAID slice of the breakdown
        default: 0
      - name: qualified_non_paid_copies
        type: integer
        source: computed
        description: QUALIFIED_NON_PAID slice of the breakdown
        default: 0
      - name: controlled_copies_included
        type: integer
        source: computed
        description: CONTROLLED copies admitted after the controlled_cap_pct allowance
        default: 0
      - name: controlled_copies_excess
        type: integer
        source: computed
        description: CONTROLLED copies rejected by the allowance; reported outside qualified circulation
        default: 0
      - name: total_qualified_copies
        type: integer
        source: computed
        description: paid_copies + qualified_non_paid_copies + controlled_copies_included
        default: 0
      - name: digital_reach_verified
        type: integer
        source: computed
        description: sum of DigitalAudienceSnapshot.combined_reach_deduplicated for VALIDATED snapshots whose window sits fully inside this period
        default: 0
      - name: undeliverable_pct_at_close
        type: number
        source: computed
        description: snapshot of Publication.undeliverable_pct taken at the moment the breakdown was last computed
        default: 0.00
      - name: declared_total_copies
        type: integer
        source: computed
        description: total_qualified_copies frozen at certification; the number the audit reconciles against
        default: 0
      - name: discrepancy_copies
        type: integer
        source: computed
        description: declared_total_copies - AuditEngagement.verified_qualified_copies, set when the audit report is issued
        default: 0
      - name: discrepancy_pct
        type: number
        source: computed
        description: round_half_up(abs(discrepancy_copies) * 100 / declared_total_copies, 2), set when the audit report is issued
        default: 0.00
      - name: breakdown_stale
        type: boolean
        source: system
        description: true when list hygiene changed the underlying population after the breakdown was computed; blocks certification until recompute
        default: false
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID that created the statement; may not certify it
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified the statement; null while DRAFT
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of certification
      - name: guarantees_settled_at
        type: datetime
        source: system
        description: logical-clock instant advertiser rate-base guarantees were settled against this statement

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - name: statement_id
        type: string
        source: input
        description: "FK -> CirculationStatement.id; the filed statement under audit"
      - name: auditor_org
        type: string
        source: input
        description: auditing bureau performing the engagement
        constraints: "1..120 chars, required"
      - name: fieldwork_start
        type: datetime
        source: input
        description: inclusive start of the fieldwork window on the publication
      - name: fieldwork_end
        type: datetime
        source: input
        description: inclusive end of the fieldwork window on the publication
      - name: sample_size
        type: integer
        source: input
        description: number of subscriber records the engagement will verify before reconciliation
        constraints: ">= 1"
      - name: sample_verified_count
        type: integer
        source: system
        description: sample records verified so far
        default: 0
      - name: verified_qualified_copies
        type: integer
        source: computed
        description: running sum of verified_copies accepted across recorded sample verifications
        default: 0
      - name: open_findings_count
        type: integer
        source: computed
        description: count of this engagement's AuditFinding rows with status IN {OPEN, RESPONSE_SUBMITTED, REJECTED_REOPENED}
        default: 0
      - name: status
        type: enum
        source: system
        description: engagement lifecycle; FIELDWORK auto-advances to RECONCILIATION at the sample boundary
        default: SCHEDULED
        constraints: "one of {SCHEDULED, FIELDWORK, RECONCILIATION, REPORT_ISSUED}"
      - name: report_issued_at
        type: datetime
        source: system
        description: logical-clock instant the audit report was issued

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> AuditEngagement.id"
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; null for findings that are not tied to one recipient record"
      - name: finding_type
        type: enum
        source: input
        description: nature of the audit exception
        constraints: "one of {MISSING_SOURCE_DOC, EXPIRED_QUALIFICATION, UNDELIVERABLE_NOT_REMOVED, CLASSIFICATION_ERROR, DIGITAL_METRIC_UNSUPPORTED}"
      - name: severity
        type: enum
        source: input
        description: audit severity; MATERIAL restricts the publication, CRITICAL freezes it
        constraints: "one of {MINOR, MATERIAL, CRITICAL}"
      - name: affected_copies
        type: integer
        source: input
        description: copies the exception calls into question
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: findings-resolution lifecycle; cycles RESPONSE_SUBMITTED <-> REJECTED_REOPENED
        default: OPEN
        constraints: "one of {OPEN, RESPONSE_SUBMITTED, ACCEPTED_RESOLVED, REJECTED_REOPENED}"
      - name: raised_by_user_id
        type: string
        source: system
        description: auditor X-User-ID that raised the finding; may not accept its resolution
      - name: response_note
        type: string
        source: system
        description: publisher's latest remediation note
      - name: response_count
        type: integer
        source: system
        description: number of publisher responses submitted on this finding
        default: 0
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant the auditor accepted the resolution

  - name: AdvertiserContract
    parent: null
    common_fields: true
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id"
      - name: advertiser_name
        type: string
        source: input
        description: advertiser the rate-base guarantee is owed to
        constraints: "1..200 chars, required"
      - name: insertion_count
        type: integer
        source: input
        description: paid insertions bought under this contract
        constraints: ">= 1"
      - name: gross_rate_cents_per_insertion
        type: integer
        source: input
        description: gross rate in cents charged per insertion
        constraints: ">= 1"
      - name: guaranteed_rate_base
        type: integer
        source: input
        description: qualified-circulation copies guaranteed to the advertiser per issue
        constraints: ">= 1"
      - name: shortfall_tolerance_pct
        type: number
        source: input
        description: shortfall_pct at or below which no make-good is owed
        default: 2.00
        constraints: "0.00..100.00, 2 decimals"
      - name: makegood_credit_pool_cents
        type: integer
        source: computed
        description: insertion_count * gross_rate_cents_per_insertion; the ceiling on all make-good credit this contract can carry
        default: 0
      - name: makegood_credit_committed_cents
        type: integer
        source: computed
        description: sum of MakeGoodObligation.credit_cents for this contract_id where status IN {PENDING, OFFERED, ACCEPTED}
        default: 0
      - name: makegood_credit_waived_cents
        type: integer
        source: computed
        description: sum of MakeGoodObligation.credit_cents for this contract_id where status == WAIVED
        default: 0
      - name: makegood_credit_available_cents
        type: integer
        source: computed
        description: makegood_credit_pool_cents - makegood_credit_committed_cents - makegood_credit_waived_cents
        default: 0
      - name: guarantee_status
        type: enum
        source: system
        description: ACTIVE while the rate base is enforceable; SUSPENDED_PENDING_RESTATEMENT once an audit forces the publication's statement to be restated
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED_PENDING_RESTATEMENT}"

  - name: MakeGoodObligation
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> AdvertiserContract.id"
      - name: statement_id
        type: string
        source: input
        description: "FK -> CirculationStatement.id; the statement whose shortfall created this obligation"
      - name: shortfall_copies
        type: integer
        source: computed
        description: max(0, AdvertiserContract.guaranteed_rate_base - CirculationStatement.total_qualified_copies)
        default: 0
      - name: shortfall_pct
        type: number
        source: computed
        description: round_half_up(shortfall_copies * 100 / AdvertiserContract.guaranteed_rate_base, 2)
        default: 0.00
      - name: tier_factor
        type: number
        source: computed
        description: make-good severity multiplier selected from shortfall_pct by calculations.rate_base_shortfall_makegood
        default: 0.00
      - name: per_insertion_credit_cents
        type: integer
        source: computed
        description: whole-cent credit owed per insertion, rounded BEFORE multiplication by insertion_count
        default: 0
      - name: credit_cents
        type: integer
        source: computed
        description: per_insertion_credit_cents * AdvertiserContract.insertion_count
        default: 0
      - name: bonus_insertions
        type: integer
        source: computed
        description: floor(credit_cents / AdvertiserContract.gross_rate_cents_per_insertion); the in-kind alternative offered to the advertiser
        default: 0
      - name: status
        type: enum
        source: system
        description: make-good lifecycle
        default: PENDING
        constraints: "one of {PENDING, OFFERED, ACCEPTED, WAIVED, VOID}"
      - name: offered_at
        type: datetime
        source: system
        description: logical-clock instant the publisher offered the make-good
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the advertiser accepted
      - name: closed_reason
        type: string
        source: system
        description: "reason recorded on WAIVED/VOID (operator note, or the literal RESTATEMENT_REQUIRED_CASCADE)"

  - name: DigitalAudienceSnapshot
    parent: Publication
    common_fields: true
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id; supplied by the nested creation path"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the measurement window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the measurement window; must be <= current logical clock
      - name: website_unique_visitors
        type: integer
        source: input
        description: unique website visitors measured in the window
        constraints: ">= 0"
      - name: newsletter_sends
        type: integer
        source: input
        description: newsletter messages sent in the window
        constraints: ">= 0"
      - name: newsletter_unique_opens
        type: integer
        source: input
        description: unique newsletter opens measured in the window
        constraints: ">= 0 and <= newsletter_sends"
      - name: overlap_pct
        type: number
        source: input
        description: share of newsletter openers assumed to also appear in website_unique_visitors
        default: 15.00
        constraints: "0.00..100.00, 2 decimals"
      - name: source
        type: enum
        source: input
        description: measurement provenance; only THIRD_PARTY_CERTIFIED may be validated for audit use
        constraints: "one of {INTERNAL_ANALYTICS, THIRD_PARTY_CERTIFIED}"
      - name: combined_reach_gross
        type: integer
        source: computed
        description: website_unique_visitors + newsletter_unique_opens (no dedup)
        default: 0
      - name: combined_reach_deduplicated
        type: integer
        source: computed
        description: website_unique_visitors + round_half_up(newsletter_unique_opens * (100 - overlap_pct) / 100, 0)
        default: 0
      - name: status
        type: enum
        source: system
        description: audit acceptance state of the digital metrics
        default: RECORDED
        constraints: "one of {RECORDED, VALIDATED, REJECTED}"
      - name: validated_by_user_id
        type: string
        source: system
        description: auditor X-User-ID that validated or rejected the snapshot

  - name: HygieneRun
    parent: null
    common_fields: false
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id"
      - name: run_type
        type: enum
        source: input
        description: which hygiene sweep this run performed
        constraints: "one of {UNDELIVERABLE_SWEEP, EXPIRY_SWEEP}"
      - name: undeliverable_threshold
        type: integer
        source: input
        description: undeliverable_count at or above which a recipient is removed from the list
        default: 2
        constraints: ">= 1"
      - name: executed_at
        type: datetime
        source: system
        description: logical-clock instant the sweep ran
      - name: undeliverable_flagged_count
        type: integer
        source: computed
        description: subscribers moved to delivery_status UNDELIVERABLE by this run
        default: 0
      - name: removed_count
        type: integer
        source: computed
        description: subscribers moved to delivery_status REMOVED by this run
        default: 0
      - name: lapsed_count
        type: integer
        source: computed
        description: subscribers moved to qualification_status LAPSED by this run
        default: 0
      - name: requalification_required_count
        type: integer
        source: computed
        description: subscribers moved to qualification_status REQUALIFICATION_REQUIRED by this run
        default: 0
      - name: statements_invalidated_count
        type: integer
        source: computed
        description: DRAFT statements of the publication whose breakdown_stale flipped to true because this run changed audit_posture
        default: 0
      - name: posture_before
        type: enum
        source: computed
        description: Publication.audit_posture immediately before the sweep
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: posture_after
        type: enum
        source: computed
        description: Publication.audit_posture immediately after the sweep
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"

state_machines:
  # ---- Subscriber, dimension 1 of 2: qualification_status -------------------
  - entity: Subscriber
    dimension: qualification_status
    initial_state: UNQUALIFIED
    terminal_states: []
    note: |
      Subscriber carries two independent status dimensions on the same row. This dimension is
      driven exclusively by QualificationRequest outcomes and by EXPIRY_SWEEP hygiene runs; it
      never reads delivery_status. The delivery dimension below never reads qualification_status.
    transitions:
      - from: UNQUALIFIED
        to: PENDING_QUALIFICATION
        trigger: "POST /circulation/qualification-requests"
        actor: QualificationSpecialist
        preconditions:
          - "subscriber exists and delivery_status != REMOVED OR qualification_status == REQUALIFICATION_REQUIRED"
          - "payload expected_subscriber_version equals Subscriber.version"
        side_effects:
          - "QualificationRequest created in SUBMITTED"
          - "increments Subscriber.version by 1"
      - from: LAPSED
        to: PENDING_QUALIFICATION
        trigger: "POST /circulation/qualification-requests"
        actor: QualificationSpecialist
        preconditions:
          - "payload expected_subscriber_version equals Subscriber.version"
        side_effects:
          - "QualificationRequest created in SUBMITTED"
          - "any prior QualificationRequest of this subscriber with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} is set to REJECTED with decision_reason SUPERSEDED_BY_NEWER_REQUEST"
          - "increments Subscriber.version by 1"
      - from: REQUALIFICATION_REQUIRED
        to: PENDING_QUALIFICATION
        trigger: "POST /circulation/qualification-requests"
        actor: QualificationSpecialist
        preconditions:
          - "payload expected_subscriber_version equals Subscriber.version"
        side_effects:
          - "QualificationRequest created in SUBMITTED"
          - "increments Subscriber.version by 1"
      - from: QUALIFIED
        to: PENDING_QUALIFICATION
        trigger: "POST /circulation/qualification-requests (renewal cycle)"
        actor: QualificationSpecialist
        preconditions:
          - "payload expected_subscriber_version equals Subscriber.version"
        side_effects:
          - "QualificationRequest created in SUBMITTED"
          - "qualified_at / qualification_expires_at are left untouched: the running qualification window keeps counting toward statements until the renewal is verified"
          - "increments Subscriber.version by 1"
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: "POST /circulation/qualification-requests/{id}/verify"
        actor: QualificationSpecialist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "SourceDocument.purge_status == RETAINED"
          - "publication has a QualificationRule row for all three dimensions"
          - "every mandatory QualificationRule scored > 0"
          - "computed_score >= QUALIFY_SCORE_THRESHOLD"
          - "the new qualification window does not collide with the running one under closed-interval semantics, unless the renewal grace window is open"
        side_effects:
          - "qualification_score = request.computed_score"
          - "qualified_at = current logical clock; qualification_expires_at = qualified_at + Publication.qualification_validity_months"
          - "job_function_code / industry_code / purchasing_authority_level are overwritten with the request's attested values"
          - "when the renewal grace window is open, the predecessor VERIFIED request's effective_to is truncated to the current clock"
          - "when delivery_status IN {UNDELIVERABLE, REMOVED}: delivery_status = DELIVERABLE and undeliverable_count = 0 (see delivery dimension) — this is the only reinstatement path"
          - "Publication copy counters and audit_posture recomputed"
      - from: PENDING_QUALIFICATION
        to: UNQUALIFIED
        trigger: "POST /circulation/qualification-requests/{id}/reject"
        actor: QualificationSpecialist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "subscriber.qualified_at IS NULL"
        side_effects:
          - "request.status = REJECTED, decided_at = current logical clock"
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: "POST /circulation/qualification-requests/{id}/reject (renewal refused, running window still open)"
        actor: QualificationSpecialist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "subscriber.qualified_at IS NOT NULL AND subscriber.qualification_expires_at > current logical clock"
        side_effects:
          - "request.status = REJECTED; qualified_at / qualification_expires_at unchanged"
      - from: PENDING_QUALIFICATION
        to: LAPSED
        trigger: "POST /circulation/qualification-requests/{id}/reject (renewal refused, window already elapsed)"
        actor: QualificationSpecialist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "subscriber.qualified_at IS NOT NULL AND subscriber.qualification_expires_at <= current logical clock"
        side_effects:
          - "request.status = REJECTED; qualification_status = LAPSED"
      - from: QUALIFIED
        to: LAPSED
        trigger: "POST /circulation/hygiene-runs with run_type EXPIRY_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "qualification_expires_at <= current logical clock"
        side_effects:
          - "HygieneRun.lapsed_count incremented"
          - "delivery_status untouched"
      - from: QUALIFIED
        to: REQUALIFICATION_REQUIRED
        trigger: "POST /circulation/hygiene-runs with run_type UNDELIVERABLE_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "undeliverable_count >= HygieneRun.undeliverable_threshold"
        side_effects:
          - "delivery_status = REMOVED on the same row (delivery dimension)"
          - "HygieneRun.requalification_required_count incremented"
      - from: LAPSED
        to: REQUALIFICATION_REQUIRED
        trigger: "POST /circulation/hygiene-runs with run_type UNDELIVERABLE_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "undeliverable_count >= HygieneRun.undeliverable_threshold"
        side_effects:
          - "delivery_status = REMOVED on the same row (delivery dimension)"
          - "HygieneRun.requalification_required_count incremented"
      - from: PENDING_QUALIFICATION
        to: REQUALIFICATION_REQUIRED
        trigger: "POST /circulation/hygiene-runs with run_type UNDELIVERABLE_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "undeliverable_count >= HygieneRun.undeliverable_threshold"
        side_effects:
          - "delivery_status = REMOVED on the same row (delivery dimension)"
          - "the in-flight QualificationRequest keeps its own status: it may still be reviewed and verified, which reinstates delivery"
          - "HygieneRun.requalification_required_count incremented"

  # ---- Subscriber, dimension 2 of 2: delivery_status ------------------------
  - entity: Subscriber
    dimension: delivery_status
    initial_state: DELIVERABLE
    terminal_states: []
    transitions:
      - from: DELIVERABLE
        to: UNDELIVERABLE
        trigger: "POST /circulation/hygiene-runs with run_type UNDELIVERABLE_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "1 <= undeliverable_count < HygieneRun.undeliverable_threshold"
        side_effects:
          - "HygieneRun.undeliverable_flagged_count incremented"
          - "qualification_status untouched — a still-qualified recipient can be undeliverable"
          - "Publication.deliverable_copies decreases by Subscriber.copies and Publication.undeliverable_copies increases by the same amount; copies_on_file_total unchanged"
      - from: DELIVERABLE
        to: REMOVED
        trigger: "POST /circulation/hygiene-runs with run_type UNDELIVERABLE_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "undeliverable_count >= HygieneRun.undeliverable_threshold"
        side_effects:
          - "HygieneRun.removed_count incremented"
          - "Publication.deliverable_copies decreases by Subscriber.copies and Publication.removed_copies increases by the same amount; copies_on_file_total unchanged"
          - "Publication.undeliverable_pct and audit_posture recomputed"
      - from: UNDELIVERABLE
        to: REMOVED
        trigger: "POST /circulation/hygiene-runs with run_type UNDELIVERABLE_SWEEP (system sweep)"
        actor: system
        preconditions:
          - "undeliverable_count >= HygieneRun.undeliverable_threshold"
        side_effects:
          - "HygieneRun.removed_count incremented"
          - "Publication.undeliverable_copies decreases by Subscriber.copies and Publication.removed_copies increases by the same amount; copies_on_file_total and undeliverable_pct unchanged"
      - from: REMOVED
        to: DELIVERABLE
        trigger: "POST /circulation/qualification-requests/{id}/verify (requalification reinstatement)"
        actor: QualificationSpecialist
        preconditions:
          - "delivery_status == REMOVED at the moment of verification"
          - "all verify preconditions of the qualification dimension hold"
        side_effects:
          - "undeliverable_count reset to 0"
          - "Publication.removed_copies decreases by Subscriber.copies and Publication.deliverable_copies increases by the same amount; copies_on_file_total unchanged"
          - "Publication.undeliverable_pct and audit_posture recomputed"
      - from: UNDELIVERABLE
        to: DELIVERABLE
        trigger: "POST /circulation/qualification-requests/{id}/verify (requalification reinstatement)"
        actor: QualificationSpecialist
        preconditions:
          - "delivery_status == UNDELIVERABLE at the moment of verification"
        side_effects:
          - "undeliverable_count reset to 0"
          - "Publication.undeliverable_copies decreases by Subscriber.copies and Publication.deliverable_copies increases by the same amount"

  # ---- QualificationRequest: cyclic review loop -----------------------------
  - entity: QualificationRequest
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    note: |
      Cyclic: UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW, bounded by
      INFO_REQUEST_LIMIT. computed_score is refreshed on every entry into UNDER_REVIEW, so a
      request that loops through the cycle while the logical clock advances loses points to the
      staleness penalty of calculations.qualification_score.
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /circulation/qualification-requests/{id}/review"
        actor: QualificationSpecialist
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "computed_score = calculations.qualification_score evaluated at the current logical clock"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /circulation/qualification-requests/{id}/request-info"
        actor: QualificationSpecialist
        preconditions:
          - "status == UNDER_REVIEW"
          - "info_request_count < INFO_REQUEST_LIMIT (2)"
        side_effects:
          - "info_request_count incremented by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /circulation/qualification-requests/{id}/resubmit"
        actor: QualificationSpecialist
        preconditions:
          - "status == INFO_REQUESTED"
        side_effects:
          - "any of signed_at / attested_job_function_code / attested_industry_code / attested_purchasing_authority supplied in the body overwrite the stored attestation"
          - "computed_score reset to 0 until the next review entry recomputes it"
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /circulation/qualification-requests/{id}/verify"
        actor: QualificationSpecialist
        preconditions:
          - "status == UNDER_REVIEW"
          - "SourceDocument(source_document_id).purge_status == RETAINED"
          - "the publication has QualificationRule rows for all three dimensions"
          - "every QualificationRule with is_mandatory == true scored > 0 for this request's attested values"
          - "computed_score >= QUALIFY_SCORE_THRESHOLD (70)"
          - "no closed-interval collision with the subscriber's running qualification window unless the renewal grace window is open"
        side_effects:
          - "decided_at = current logical clock; effective_from = decided_at; effective_to = effective_from + Publication.qualification_validity_months"
          - "Subscriber.qualification_status = QUALIFIED, qualification_score / qualified_at / qualification_expires_at / attested identity fields written (see Subscriber qualification dimension)"
          - "Subscriber.delivery_status reinstated to DELIVERABLE with undeliverable_count = 0 when it was UNDELIVERABLE or REMOVED"
          - "when the renewal grace window is open, the predecessor VERIFIED request's effective_to is truncated to the current logical clock"
          - "Publication copy counters, undeliverable_pct and audit_posture recomputed; increments Publication.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /circulation/qualification-requests/{id}/reject"
        actor: QualificationSpecialist
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "decided_at = current logical clock; decision_reason = body reason"
          - "Subscriber.qualification_status resolved per the Subscriber qualification dimension (UNQUALIFIED / QUALIFIED / LAPSED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system supersede on POST /circulation/qualification-requests for the same subscriber_id"
        actor: system
        preconditions:
          - "a newer QualificationRequest is created for the same subscriber_id"
        side_effects:
          - "decision_reason = SUPERSEDED_BY_NEWER_REQUEST; decided_at = current logical clock"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system supersede on POST /circulation/qualification-requests for the same subscriber_id"
        actor: system
        preconditions:
          - "a newer QualificationRequest is created for the same subscriber_id"
        side_effects:
          - "decision_reason = SUPERSEDED_BY_NEWER_REQUEST; decided_at = current logical clock"
      - from: INFO_REQUESTED
        to: REJECTED
        trigger: "system supersede on POST /circulation/qualification-requests for the same subscriber_id"
        actor: system
        preconditions:
          - "a newer QualificationRequest is created for the same subscriber_id"
        side_effects:
          - "decision_reason = SUPERSEDED_BY_NEWER_REQUEST; decided_at = current logical clock"

  # ---- CirculationStatement: cyclic audit loop + branching report outcome ----
  - entity: CirculationStatement
    initial_state: DRAFT
    terminal_states: [AUDIT_CLEARED, SUPERSEDED]
    note: |
      Cyclic: UNDER_AUDIT -> FINDINGS_OPEN -> UNDER_AUDIT, once per raise/resolve round. Branching:
      issue-report forks on discrepancy_pct against Publication.materiality_pct, with divergent
      side-effect sets (AUDIT_CLEARED does nothing downstream; RESTATEMENT_REQUIRED starts a
      four-hop cascade through Publication, AdvertiserContract and MakeGoodObligation).
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /circulation/statements/{id}/certify"
        actor: CirculationManager | PublisherExecutive
        preconditions:
          - "status == DRAFT"
          - "breakdown_stale == false"
          - "X-User-ID != prepared_by_user_id"
          - "Publication.audit_posture != FROZEN, unless restates_statement_id names a statement of the same publication in status RESTATEMENT_REQUIRED"
          - "no other statement of the same publication in status IN {FILED, UNDER_AUDIT, FINDINGS_OPEN, RESTATEMENT_REQUIRED, AUDIT_CLEARED} whose half-open period [period_start, period_end) intersects this statement's period; the statement named by restates_statement_id is excluded from the candidate set"
        side_effects:
          - "filed_at = current logical clock; certified_by_user_id = X-User-ID"
          - "declared_total_copies = total_qualified_copies (frozen for reconciliation)"
          - "when restates_statement_id is set: hop 1 — the predecessor statement moves RESTATEMENT_REQUIRED -> SUPERSEDED"
          - "when restates_statement_id is set: hop 2 — because the publication no longer holds a RESTATEMENT_REQUIRED statement, Publication.audit_posture is recomputed (leaves FROZEN)"
          - "when restates_statement_id is set: hop 3 — because audit_posture left FROZEN, every AdvertiserContract of the publication with guarantee_status == SUSPENDED_PENDING_RESTATEMENT returns to ACTIVE"
          - "increments Publication.version by 1"
      - from: FILED
        to: UNDER_AUDIT
        trigger: "POST /circulation/audit-engagements"
        actor: CirculationAuditor
        preconditions:
          - "status == FILED"
          - "fieldwork window clears the AUDIT_WINDOW_BUFFER_DAYS separation from every other engagement on the same publication"
        side_effects:
          - "AuditEngagement created in SCHEDULED"
      - from: UNDER_AUDIT
        to: FINDINGS_OPEN
        trigger: "POST /circulation/audit-findings"
        actor: CirculationAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "engagement.status IN {FIELDWORK, RECONCILIATION}"
        side_effects:
          - "AuditFinding created in OPEN; engagement.open_findings_count recomputed"
          - "Publication.open_material_findings_count / open_critical_findings_count and audit_posture recomputed; increments Publication.version by 1"
      - from: FINDINGS_OPEN
        to: UNDER_AUDIT
        trigger: "POST /circulation/audit-findings/{id}/accept-resolution (last open finding closes)"
        actor: CirculationAuditor
        preconditions:
          - "status == FINDINGS_OPEN"
          - "the accepted finding is the last one of the engagement with status IN {OPEN, RESPONSE_SUBMITTED, REJECTED_REOPENED}"
        side_effects:
          - "engagement.open_findings_count = 0"
          - "Publication.open_material_findings_count / open_critical_findings_count and audit_posture recomputed; increments Publication.version by 1"
          - "the statement returns to UNDER_AUDIT and may be driven back to FINDINGS_OPEN by a later finding (cycle)"
      - from: UNDER_AUDIT
        to: AUDIT_CLEARED
        trigger: "POST /circulation/audit-engagements/{id}/issue-report"
        actor: CirculationAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "engagement.status == RECONCILIATION"
          - "discrepancy_pct < Publication.materiality_pct"
        side_effects:
          - "discrepancy_copies / discrepancy_pct written; engagement.status = REPORT_ISSUED; report_issued_at set"
          - "no downstream cascade: AdvertiserContract and MakeGoodObligation rows are untouched"
      - from: UNDER_AUDIT
        to: RESTATEMENT_REQUIRED
        trigger: "POST /circulation/audit-engagements/{id}/issue-report"
        actor: CirculationAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "engagement.status == RECONCILIATION"
          - "discrepancy_pct >= Publication.materiality_pct"
        side_effects:
          - "hop 1 — discrepancy_copies = declared_total_copies - engagement.verified_qualified_copies; discrepancy_pct written; engagement.status = REPORT_ISSUED"
          - "hop 2 — because discrepancy_pct crossed materiality, this statement moves to RESTATEMENT_REQUIRED"
          - "hop 3 — because the publication now holds a RESTATEMENT_REQUIRED statement, Publication.audit_posture recomputes to FROZEN; increments Publication.version by 1"
          - "hop 4 — because audit_posture became FROZEN, every AdvertiserContract of the publication with guarantee_status == ACTIVE moves to SUSPENDED_PENDING_RESTATEMENT"
          - "hop 5 — because those contracts left ACTIVE, each of their MakeGoodObligation rows with status IN {PENDING, OFFERED} moves to VOID with closed_reason RESTATEMENT_REQUIRED_CASCADE, releasing credit back to makegood_credit_available_cents"
      - from: FINDINGS_OPEN
        to: RESTATEMENT_REQUIRED
        trigger: "POST /circulation/audit-engagements/{id}/issue-report"
        actor: CirculationAuditor
        preconditions:
          - "status == FINDINGS_OPEN"
          - "engagement.status == RECONCILIATION"
          - "discrepancy_pct >= Publication.materiality_pct"
        side_effects:
          - "same five-hop cascade as the UNDER_AUDIT -> RESTATEMENT_REQUIRED transition"
          - "open findings stay open: they are carried into the restatement's audit trail"
        note: "issue-report from FINDINGS_OPEN with discrepancy_pct < materiality_pct is rejected with ERR_OPEN_FINDINGS_UNRESOLVED — an audit cannot be cleared while findings are open"
      - from: RESTATEMENT_REQUIRED
        to: SUPERSEDED
        trigger: "POST /circulation/statements/{id}/certify on a successor whose restates_statement_id names this statement"
        actor: system
        preconditions:
          - "status == RESTATEMENT_REQUIRED"
          - "the successor statement is DRAFT and belongs to the same publication_id"
        side_effects:
          - "see the DRAFT -> FILED side-effect hops 1..3"

  # ---- AuditEngagement: linear with an auto-advance at the sample boundary ---
  - entity: AuditEngagement
    initial_state: SCHEDULED
    terminal_states: [REPORT_ISSUED]
    transitions:
      - from: SCHEDULED
        to: FIELDWORK
        trigger: "POST /circulation/audit-engagements/{id}/record-sample-verification"
        actor: CirculationAuditor
        preconditions:
          - "status == SCHEDULED"
          - "sample_verified_count < sample_size"
          - "statement.status IN {UNDER_AUDIT, FINDINGS_OPEN}"
        side_effects:
          - "sample_verified_count incremented by 1"
          - "verified_qualified_copies increased by body verified_copies when body evidence_ok == true, by 0 when evidence_ok == false"
        note: "when sample_size == 1 the auto-advance below fires inside the same request, so the observable end status is RECONCILIATION"
      - from: FIELDWORK
        to: FIELDWORK
        trigger: "POST /circulation/audit-engagements/{id}/record-sample-verification"
        actor: CirculationAuditor
        preconditions:
          - "status == FIELDWORK"
          - "sample_verified_count < sample_size"
        side_effects:
          - "sample_verified_count incremented by 1; verified_qualified_copies accumulated as above"
      - from: FIELDWORK
        to: RECONCILIATION
        trigger: "system auto-advance evaluated at the end of every record-sample-verification"
        actor: system
        preconditions:
          - "sample_verified_count >= sample_size after the increment"
        side_effects:
          - "engagement is frozen for further sample records: another record-sample-verification is rejected with ERR_SAMPLE_LIMIT_EXCEEDED"
      - from: SCHEDULED
        to: RECONCILIATION
        trigger: "system auto-advance on the first record-sample-verification when sample_size == 1"
        actor: system
        preconditions:
          - "sample_verified_count >= sample_size after the increment"
        side_effects:
          - "same as the FIELDWORK -> RECONCILIATION auto-advance"
      - from: RECONCILIATION
        to: REPORT_ISSUED
        trigger: "POST /circulation/audit-engagements/{id}/issue-report"
        actor: CirculationAuditor
        preconditions:
          - "status == RECONCILIATION"
          - "statement.status IN {UNDER_AUDIT, FINDINGS_OPEN}"
          - "not (statement.status == FINDINGS_OPEN and discrepancy_pct < Publication.materiality_pct)"
        side_effects:
          - "report_issued_at = current logical clock"
          - "the statement branches to AUDIT_CLEARED or RESTATEMENT_REQUIRED per the CirculationStatement machine"

  # ---- AuditFinding: cyclic resolution loop ---------------------------------
  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [ACCEPTED_RESOLVED]
    note: "Cyclic: RESPONSE_SUBMITTED -> REJECTED_REOPENED -> RESPONSE_SUBMITTED, unbounded."
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /circulation/audit-findings/{id}/respond"
        actor: CirculationManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "response_note = body response_note; response_count incremented by 1"
      - from: REJECTED_REOPENED
        to: RESPONSE_SUBMITTED
        trigger: "POST /circulation/audit-findings/{id}/respond"
        actor: CirculationManager
        preconditions:
          - "status == REJECTED_REOPENED"
        side_effects:
          - "response_note overwritten; response_count incremented by 1"
      - from: RESPONSE_SUBMITTED
        to: REJECTED_REOPENED
        trigger: "POST /circulation/audit-findings/{id}/reject-response"
        actor: CirculationAuditor
        preconditions:
          - "status == RESPONSE_SUBMITTED"
        side_effects:
          - "finding stays counted in engagement.open_findings_count and in the publication's open-findings counters"
      - from: RESPONSE_SUBMITTED
        to: ACCEPTED_RESOLVED
        trigger: "POST /circulation/audit-findings/{id}/accept-resolution"
        actor: CirculationAuditor
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "X-User-ID != raised_by_user_id"
        side_effects:
          - "resolved_at = current logical clock; engagement.open_findings_count recomputed"
          - "Publication.open_material_findings_count / open_critical_findings_count and audit_posture recomputed; increments Publication.version by 1"
          - "when this was the engagement's last non-resolved finding, the statement moves FINDINGS_OPEN -> UNDER_AUDIT"

  # ---- MakeGoodObligation: branching settlement -----------------------------
  - entity: MakeGoodObligation
    initial_state: PENDING
    terminal_states: [ACCEPTED, WAIVED, VOID]
    transitions:
      - from: PENDING
        to: OFFERED
        trigger: "POST /circulation/make-goods/{id}/offer"
        actor: CirculationManager
        preconditions:
          - "status == PENDING"
          - "AdvertiserContract.guarantee_status == ACTIVE"
          - "CirculationStatement.status IN {FILED, AUDIT_CLEARED}"
        side_effects:
          - "offered_at = current logical clock; credit stays inside makegood_credit_committed_cents"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /circulation/make-goods/{id}/accept"
        actor: AdvertiserContact
        preconditions:
          - "status == OFFERED"
          - "X-User-ID == contract_id (advertiser owns this obligation)"
          - "AdvertiserContract.guarantee_status == ACTIVE"
          - "CirculationStatement.status NOT IN {RESTATEMENT_REQUIRED, SUPERSEDED}"
        side_effects:
          - "accepted_at = current logical clock; credit stays committed (pool conservation unchanged)"
      - from: OFFERED
        to: WAIVED
        trigger: "POST /circulation/make-goods/{id}/waive"
        actor: PublisherExecutive
        preconditions:
          - "status == OFFERED"
        side_effects:
          - "closed_reason = body reason"
          - "credit moves from AdvertiserContract.makegood_credit_committed_cents to makegood_credit_waived_cents; makegood_credit_available_cents unchanged; increments AdvertiserContract.version by 1"
      - from: PENDING
        to: VOID
        trigger: "system cascade hop 5 of POST /circulation/audit-engagements/{id}/issue-report"
        actor: system
        preconditions:
          - "the owning AdvertiserContract just left guarantee_status ACTIVE"
        side_effects:
          - "closed_reason = RESTATEMENT_REQUIRED_CASCADE; credit leaves makegood_credit_committed_cents and returns to makegood_credit_available_cents"
      - from: OFFERED
        to: VOID
        trigger: "system cascade hop 5 of POST /circulation/audit-engagements/{id}/issue-report"
        actor: system
        preconditions:
          - "the owning AdvertiserContract just left guarantee_status ACTIVE"
        side_effects:
          - "closed_reason = RESTATEMENT_REQUIRED_CASCADE; credit leaves makegood_credit_committed_cents and returns to makegood_credit_available_cents"

  # ---- DigitalAudienceSnapshot: branching acceptance ------------------------
  - entity: DigitalAudienceSnapshot
    initial_state: RECORDED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: RECORDED
        to: VALIDATED
        trigger: "POST /circulation/digital-snapshots/{id}/validate with decision VALIDATE"
        actor: CirculationAuditor
        preconditions:
          - "status == RECORDED"
          - "source == THIRD_PARTY_CERTIFIED"
        side_effects:
          - "validated_by_user_id = X-User-ID"
          - "the snapshot becomes eligible for CirculationStatement.digital_reach_verified on the next statement recompute"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /circulation/digital-snapshots/{id}/validate with decision REJECT"
        actor: CirculationAuditor
        preconditions:
          - "status == RECORDED"
        side_effects:
          - "validated_by_user_id = X-User-ID; snapshot never contributes to digital_reach_verified"

concurrency_rules:
  - rule_id: statement-create-stale-publication
    parent_entity: Publication
    write_endpoint: "POST /circulation/statements"
    occ_field: "expected_publication_version"
    description: |
      Creating a CirculationStatement against a Publication whose version has advanced since the
      client last read it is rejected. A statement legitimately supersedes the publication's
      circulation picture at creation time (its breakdown is computed from the live subscriber
      population), so a second create is not blocked by any state precondition; the stale-version
      check is what protects the writer whose view of the population predates a hygiene sweep,
      a verification or a restatement cascade.
    error_id: ERR_STALE_PUBLICATION_VERSION
    http_status: 412
  - rule_id: qualification-request-create-stale-subscriber
    parent_entity: Subscriber
    write_endpoint: "POST /circulation/qualification-requests"
    occ_field: "expected_subscriber_version"
    description: |
      Creating a QualificationRequest against a Subscriber whose version has advanced since the
      client last read it is rejected. Creation legitimately supersedes any prior non-terminal
      request for that subscriber (the older request is closed as SUPERSEDED_BY_NEWER_REQUEST), so
      a second create would otherwise succeed on identical state; the stale-version check rejects
      the writer whose attestation view predates the supersede.
    error_id: ERR_STALE_SUBSCRIBER_VERSION
    http_status: 412

calculations:
  - name: qualification_score
    trigger: "POST /circulation/qualification-requests/{id}/review (on entry into UNDER_REVIEW) and POST /circulation/qualification-requests/{id}/verify (re-evaluated at the current logical clock immediately before the threshold precondition is applied)"
    algorithm: weighted_scoring
    formula: |
      # All three QualificationRule rows of the subscriber's publication MUST exist; otherwise the
      # verify precondition fails with ERR_QUALIFICATION_RULES_INCOMPLETE before scoring runs.
      rule(d)            = the QualificationRule row with dimension == d for Subscriber.publication_id
      attested(JOB_FUNCTION)        = request.attested_job_function_code
      attested(INDUSTRY)            = request.attested_industry_code
      attested(PURCHASING_AUTHORITY)= request.attested_purchasing_authority
      points(d)          = rule(d).points if attested(d) is an exact member of rule(d).allowed_values else 0
      base               = points(JOB_FUNCTION) + points(INDUSTRY) + points(PURCHASING_AUTHORITY)

      signature_age_months = number of COMPLETE calendar months from request.signed_at to the
                             current logical clock (floor; 2025-07-01 -> 2026-08-01 is 13)

      channel_bonus      = DIRECT_MAIL_BONUS        if request_channel == DIRECT_MAIL      and signature_age_months <= FRESH_WINDOW_MONTHS
                           DIGITAL_CHANNEL_BONUS    if request_channel IN {WEB, EMAIL}     and signature_age_months <= FRESH_WINDOW_MONTHS
                           0                        otherwise (TELEPHONE always, and any channel outside the fresh window)

      staleness_penalty  = 0 if signature_age_months <= FRESH_WINDOW_MONTHS
                           else min(MAX_STALENESS_PENALTY,
                                    STALENESS_PENALTY_PER_MONTH * (signature_age_months - FRESH_WINDOW_MONTHS))

      computed_score     = max(0, min(SCORE_CEILING, base + channel_bonus - staleness_penalty))

      qualifies          = computed_score >= QUALIFY_SCORE_THRESHOLD
                           AND for every rule(d) with is_mandatory == true: points(d) > 0
      # Evaluation order is pinned: the mandatory-dimension gate is checked AFTER the threshold
      # test, so a request that fails both reports ERR_QUALIFICATION_SCORE_BELOW_THRESHOLD.
    input_set: "exactly one QualificationRequest and the three QualificationRule rows of its subscriber's publication; no other request contributes"
    constants:
      QUALIFY_SCORE_THRESHOLD: 70
      SCORE_CEILING: 100
      FRESH_WINDOW_MONTHS: 12
      STALENESS_PENALTY_PER_MONTH: 5
      MAX_STALENESS_PENALTY: 30
      DIRECT_MAIL_BONUS: 10
      DIGITAL_CHANNEL_BONUS: 5
    precision: "integer points, no rounding; min/max clamp applied after the additive terms"
    variants: []

  - name: controlled_copies_cap_allowance
    trigger: "inside every evaluation of statement_circulation_breakdown, before CONTROLLED copies are admitted"
    algorithm: waterfall_allocation
    formula: |
      # The published rule reads "CONTROLLED copies may not exceed controlled_cap_pct of
      # total_qualified_copies" — and total_qualified_copies itself includes the admitted
      # CONTROLLED copies, so the dependency looks circular. The evaluation order is PINNED as the
      # closed form below: the allowance is derived from the pre-controlled core ONLY, never
      # iteratively from a running total, and never as cap_pct of the core.
      core                        = paid_copies + qualified_non_paid_copies
      controlled_allowance        = floor(core * controlled_cap_pct / (100 - controlled_cap_pct))
      controlled_copies_included  = min(controlled_raw, controlled_allowance)
      controlled_copies_excess    = controlled_raw - controlled_copies_included
      # Consequence to check: when the allowance binds, controlled_copies_included /
      # total_qualified_copies equals controlled_cap_pct exactly (300 / 1200 = 25.00%).
      # The rejected reading floor(core * controlled_cap_pct / 100) would admit 225, not 300.
    input_set: "the paid/qualified-non-paid/controlled sums produced by the enclosing breakdown variant"
    constants: {}
    precision: "integer copies; floor on the allowance, so remainder copies always land in controlled_copies_excess"
    variants: []

  - name: statement_circulation_breakdown
    trigger: "POST /circulation/statements (initial computation) and POST /circulation/statements/{id}/recompute"
    algorithm: aggregation
    formula: |
      # Eligibility is evaluated against the STATEMENT PERIOD, not against the current clock, so a
      # statement stays reproducible after the clock moves on.
      base_eligible(S) = S.publication_id == statement.publication_id
                         AND S.delivery_status == DELIVERABLE
                         AND S.qualified_at IS NOT NULL
                         AND S.qualified_at <  statement.period_end        # strict
                         AND S.qualification_expires_at >= statement.period_end   # inclusive

      # variant gate applied on top of base_eligible — see variants[]
      paid_copies                = sum(S.copies) over eligible S with subscription_class == PAID
      qualified_non_paid_copies  = sum(S.copies) over eligible S with subscription_class == QUALIFIED_NON_PAID
      controlled_raw             = sum(S.copies) over eligible S with subscription_class == CONTROLLED
      <controlled_copies_included, controlled_copies_excess> = calculations.controlled_copies_cap_allowance
      total_qualified_copies     = paid_copies + qualified_non_paid_copies + controlled_copies_included

      digital_reach_verified     = sum(D.combined_reach_deduplicated) over DigitalAudienceSnapshot D
                                   with D.publication_id == statement.publication_id
                                    AND D.status == VALIDATED
                                    AND D.window_start >= statement.period_start
                                    AND D.window_end   <= statement.period_end
      undeliverable_pct_at_close = Publication.undeliverable_pct as of this evaluation
      breakdown_stale            = false (this evaluation clears it)
    input_set: "Subscriber rows of the statement's publication in any qualification_status (the date fields, not the status enum, decide inclusion) with delivery_status == DELIVERABLE, plus VALIDATED DigitalAudienceSnapshot rows fully inside the period"
    constants: {}
    precision: "integer copies; sums are exact, no rounding"
    variants:
      - name: as_of_period_end
        when: "statement.basis == AS_OF_PERIOD_END (the publisher's own statement)"
        difference: "base_eligible only — the publisher counts every deliverable recipient whose qualification window spans period_end, whether or not retained source documentation still backs it"
      - name: audit_verified
        when: "statement.basis == AUDIT_VERIFIED (used for audited statements and restatements)"
        difference: |
          adds an evidence gate on top of base_eligible: there must exist a QualificationRequest Q
          with Q.subscriber_id == S.id AND Q.status == VERIFIED whose SourceDocument
          (Q.source_document_id) has purge_status == RETAINED AND retention_expires_at >=
          statement.period_end. Recipients whose evidence was purged drop out, which also shrinks
          `core` and therefore re-derives a SMALLER controlled_allowance — the same population
          yields a different total under the two bases.

  - name: digital_combined_reach
    trigger: "POST /circulation/publications/{id}/digital-snapshots"
    algorithm: weighted_scoring
    formula: |
      combined_reach_gross         = website_unique_visitors + newsletter_unique_opens
      combined_reach_deduplicated  = website_unique_visitors
                                     + round_half_up(newsletter_unique_opens * (100 - overlap_pct) / 100, 0)
      # Both fields are always written; only combined_reach_deduplicated may enter a statement.
    input_set: "the single snapshot being created; no cross-snapshot aggregation"
    constants: {}
    precision: "integers; round_half_up to 0 decimals on the deduplicated newsletter term BEFORE adding website visitors"
    variants:
      - name: gross_sum
        when: "reported to advertisers as unaudited 'total digital touchpoints'"
        difference: "adds newsletter opens at face value, double-counting readers who also visited the website"
      - name: deduplicated
        when: "the only variant admissible into CirculationStatement.digital_reach_verified"
        difference: "discounts newsletter opens by overlap_pct before adding, so identical inputs report a strictly smaller audience (48000/12500/15.00 -> 58625 rather than 60500)"

  - name: rate_base_shortfall_makegood
    trigger: "POST /circulation/statements/{id}/settle-guarantees"
    algorithm: tiered_pricing
    formula: |
      # Candidate set: AdvertiserContract rows with publication_id == statement.publication_id AND
      # guarantee_status == ACTIVE, processed in created_at ASC order (deterministic; id is never
      # a decision input). One MakeGoodObligation per qualifying contract.
      shortfall_copies = max(0, C.guaranteed_rate_base - statement.total_qualified_copies)
      shortfall_pct    = round_half_up(shortfall_copies * 100 / C.guaranteed_rate_base, 2)

      if shortfall_pct <= C.shortfall_tolerance_pct: no obligation is created for C

      tier_factor      = TIER_1_FACTOR if shortfall_pct <= TIER_1_MAX_PCT
                         TIER_2_FACTOR if TIER_1_MAX_PCT < shortfall_pct <= TIER_2_MAX_PCT
                         TIER_3_FACTOR if shortfall_pct >  TIER_2_MAX_PCT

      # ROUNDING ORDER IS PINNED: round to whole cents PER INSERTION first, then multiply.
      per_insertion_credit_cents = round_half_up(C.gross_rate_cents_per_insertion
                                                 * (shortfall_pct / 100) * tier_factor, 0)
      credit_cents               = per_insertion_credit_cents * C.insertion_count
      bonus_insertions           = floor(credit_cents / C.gross_rate_cents_per_insertion)
      # The rejected order — round_half_up(gross * pct/100 * factor * insertion_count, 0) — differs:
      # 850000, 31.43%, 1.50, 12 insertions -> pinned 400733*12 = 4808796; rejected 4808790.
      # If credit_cents > C.makegood_credit_available_cents the request fails with
      # ERR_MAKEGOOD_POOL_EXCEEDED and NO obligation is persisted for any contract.
    input_set: "ACTIVE AdvertiserContract rows of the statement's publication, ordered created_at ASC; the statement's total_qualified_copies as of settlement"
    constants:
      TIER_1_MAX_PCT: 5.00
      TIER_2_MAX_PCT: 10.00
      TIER_1_FACTOR: 0.50
      TIER_2_FACTOR: 1.00
      TIER_3_FACTOR: 1.50
    precision: "shortfall_pct to 2 decimals round_half_up; per_insertion_credit_cents to whole cents round_half_up; multiplication after rounding"
    variants: []

  - name: statement_reconciliation_discrepancy
    trigger: "POST /circulation/audit-engagements/{id}/issue-report"
    algorithm: threshold
    formula: |
      discrepancy_copies = statement.declared_total_copies - engagement.verified_qualified_copies
      discrepancy_pct    = round_half_up(abs(discrepancy_copies) * 100 / statement.declared_total_copies, 2)
                           # exactly 0.00 when declared_total_copies == 0
      outcome            = RESTATEMENT_REQUIRED if discrepancy_pct >= Publication.materiality_pct
                           AUDIT_CLEARED        if discrepancy_pct <  Publication.materiality_pct
                                                   AND statement.status == UNDER_AUDIT
                           ERR_OPEN_FINDINGS_UNRESOLVED if discrepancy_pct < Publication.materiality_pct
                                                   AND statement.status == FINDINGS_OPEN
      # Boundary: 1200 declared vs 1176 verified -> 2.00 == materiality_pct -> RESTATEMENT_REQUIRED.
    input_set: "one statement and the one engagement issuing the report; findings do not enter the arithmetic, only the branch guard"
    constants: {}
    precision: "2 decimals, round_half_up; comparison is >= against Publication.materiality_pct"
    variants: []

  - name: publication_audit_posture
    trigger: "any mutation that changes a Publication's subscriber population, its statements' statuses, or its findings' statuses (subscriber create/reclassify/verify, hygiene runs, finding create/accept-resolution, audit report issue, statement certify)"
    algorithm: threshold
    formula: |
      # Evaluated top to bottom; the FIRST matching clause wins.
      1. FROZEN     if open_critical_findings_count > 0
      2. FROZEN     if any CirculationStatement of this publication has status == RESTATEMENT_REQUIRED
      3. RESTRICTED if undeliverable_pct >= undeliverable_restrict_pct
      4. RESTRICTED if open_material_findings_count > 0
      5. OPEN       otherwise
      # Gate: FROZEN blocks POST /circulation/statements/{id}/certify unless the statement being
      # certified names the offending statement in restates_statement_id. RESTRICTED never blocks
      # certification by itself, but any posture CHANGE marks DRAFT statements breakdown_stale.
    input_set: "the publication's own counters plus its statements and the findings reachable through AuditEngagement.statement_id"
    constants: {}
    precision: "undeliverable_pct compared at 2 decimals with >= (5.00 restricts; 4.99 does not)"
    variants: []

  - name: publication_copies_ledger
    trigger: "POST /circulation/subscribers, POST /circulation/subscribers/{id}/reclassify, POST /circulation/hygiene-runs, POST /circulation/qualification-requests/{id}/verify"
    algorithm: aggregation
    formula: |
      copies_on_file_total              = sum(S.copies) over ALL subscribers of the publication
      paid_copies_on_file               = sum(S.copies) where subscription_class == PAID
      qualified_non_paid_copies_on_file = sum(S.copies) where subscription_class == QUALIFIED_NON_PAID
      controlled_copies_on_file         = sum(S.copies) where subscription_class == CONTROLLED
      deliverable_copies                = sum(S.copies) where delivery_status == DELIVERABLE
      undeliverable_copies              = sum(S.copies) where delivery_status == UNDELIVERABLE
      removed_copies                    = sum(S.copies) where delivery_status == REMOVED
      undeliverable_pct                 = round_half_up((undeliverable_copies + removed_copies) * 100
                                                        / copies_on_file_total, 2)   # 0.00 when total == 0
      # CONSERVED QUANTITY (class axis), invariant after every mutation and after every compensating
      # mutation: copies_on_file_total == paid_copies_on_file + qualified_non_paid_copies_on_file
      #                                  + controlled_copies_on_file
      # CONSERVED QUANTITY (delivery axis), invariant likewise:
      #   copies_on_file_total == deliverable_copies + undeliverable_copies + removed_copies
    input_set: "every Subscriber row of the publication regardless of qualification_status or delivery_status; no row is ever deleted, so copies_on_file_total is monotonic in subscriber creation only"
    constants: {}
    precision: "integer copies; undeliverable_pct 2 decimals round_half_up"
    variants: []

  - name: contract_makegood_ledger
    trigger: "POST /circulation/statements/{id}/settle-guarantees, POST /circulation/make-goods/{id}/offer, POST /circulation/make-goods/{id}/accept, POST /circulation/make-goods/{id}/waive, and the VOID cascade hop of POST /circulation/audit-engagements/{id}/issue-report"
    algorithm: aggregation
    formula: |
      makegood_credit_pool_cents      = insertion_count * gross_rate_cents_per_insertion
      makegood_credit_committed_cents = sum(M.credit_cents) for this contract_id where M.status IN {PENDING, OFFERED, ACCEPTED}
      makegood_credit_waived_cents    = sum(M.credit_cents) for this contract_id where M.status == WAIVED
      makegood_credit_available_cents = makegood_credit_pool_cents
                                        - makegood_credit_committed_cents
                                        - makegood_credit_waived_cents
      # CONSERVED QUANTITY (money axis), invariant after every forward action AND after every
      # compensating action (waive, VOID cascade):
      #   makegood_credit_pool_cents == makegood_credit_committed_cents
      #                                 + makegood_credit_waived_cents
      #                                 + makegood_credit_available_cents
      # VOID rows are excluded from every bucket, which is exactly how a voided obligation returns
      # its cents to makegood_credit_available_cents with zero drift.
    input_set: "MakeGoodObligation rows with contract_id == this contract, all statuses; VOID rows contribute to no bucket"
    constants: {}
    precision: "whole cents; no rounding (credit_cents is already an integer)"
    variants: []

validations:
  # --- 1-2: authentication / authorization ---
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # --- 10-19: existence, validated left-to-right along the path then across body FKs ---
  - priority: 10
    category: existence
    check: "publication_id in the path or body resolves to a Publication"
    error_id: ERR_PUBLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/publications/{id}, POST /circulation/publications/{id}/qualification-rules, POST /circulation/publications/{id}/digital-snapshots, GET /circulation/publications/{id}/qualification-rules, GET /circulation/publications/{id}/digital-snapshots, GET /circulation/publications/{id}/hygiene-runs, POST /circulation/subscribers, POST /circulation/statements, POST /circulation/hygiene-runs, POST /circulation/advertiser-contracts"
  - priority: 11
    category: existence
    check: "subscriber_id in the path or body resolves to a Subscriber"
    error_id: ERR_SUBSCRIBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/subscribers/{id}, GET /circulation/subscribers/{id}/source-documents, POST /circulation/subscribers/{id}/source-documents, POST /circulation/subscribers/{id}/undeliverable-events, POST /circulation/subscribers/{id}/reclassify, POST /circulation/qualification-requests, POST /circulation/audit-engagements/{id}/record-sample-verification, POST /circulation/audit-findings"
  - priority: 12
    category: existence
    check: "source_document_id in the path or body resolves to a SourceDocument"
    error_id: ERR_SOURCE_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /circulation/source-documents/{id}/purge, POST /circulation/qualification-requests"
  - priority: 13
    category: existence
    check: "qualification_request_id in the path resolves to a QualificationRequest"
    error_id: ERR_QUALIFICATION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/qualification-requests/{id}, POST /circulation/qualification-requests/{id}/review, POST /circulation/qualification-requests/{id}/request-info, POST /circulation/qualification-requests/{id}/resubmit, POST /circulation/qualification-requests/{id}/verify, POST /circulation/qualification-requests/{id}/reject"
  - priority: 14
    category: existence
    check: "statement_id in the path or body resolves to a CirculationStatement"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/statements/{id}, GET /circulation/statements/{id}/audit-engagements, POST /circulation/statements/{id}/recompute, POST /circulation/statements/{id}/certify, POST /circulation/statements/{id}/settle-guarantees, POST /circulation/audit-engagements, POST /circulation/statements (restates_statement_id when supplied)"
  - priority: 15
    category: existence
    check: "engagement_id in the path or body resolves to an AuditEngagement"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /circulation/audit-engagements/{id}/record-sample-verification, POST /circulation/audit-engagements/{id}/issue-report, POST /circulation/audit-findings"
  - priority: 16
    category: existence
    check: "finding_id in the path resolves to an AuditFinding"
    error_id: ERR_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/audit-findings/{id}, POST /circulation/audit-findings/{id}/respond, POST /circulation/audit-findings/{id}/accept-resolution, POST /circulation/audit-findings/{id}/reject-response"
  - priority: 17
    category: existence
    check: "contract_id in the path or body resolves to an AdvertiserContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/advertiser-contracts/{id}"
  - priority: 18
    category: existence
    check: "make_good_id in the path resolves to a MakeGoodObligation"
    error_id: ERR_MAKEGOOD_NOT_FOUND
    http_status: 404
    applies_to: "GET /circulation/make-goods/{id}, POST /circulation/make-goods/{id}/offer, POST /circulation/make-goods/{id}/accept, POST /circulation/make-goods/{id}/waive"
  - priority: 19
    category: existence
    check: "snapshot_id in the path resolves to a DigitalAudienceSnapshot"
    error_id: ERR_SNAPSHOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /circulation/digital-snapshots/{id}/validate"

  # --- 20: ownership (entity_backed identity) ---
  - priority: 20
    category: auth
    check: "when the acting role is AdvertiserContact, X-User-ID equals the contract_id of the targeted MakeGoodObligation (AdvertiserContact identity is entity_backed:AdvertiserContract)"
    error_id: ERR_NOT_CONTRACT_OWNER
    http_status: 403
    applies_to: "POST /circulation/make-goods/{id}/accept, GET /circulation/make-goods/{id}"

  # --- 21-22: request shape ---
  - priority: 21
    category: business_constraint
    check: "every required input field is present, integers are >= their declared minimum (copies >= 1, insertion_count >= 1, sample_size >= 1, guaranteed_rate_base >= 1, gross_rate_cents_per_insertion >= 1, website_unique_visitors >= 0, newsletter_unique_opens >= 0), percentage fields are within 0.00-100.00, and timestamps parse as ISO-8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 22
    category: business_constraint
    check: "every supplied enum value is a member of its declared value set (subscription_class, request_channel, dimension, basis, severity, decision, run_type, source, statuses used as list filters)"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST endpoints and all GET list endpoints that accept a status filter"

  # --- 25-26: optimistic concurrency (see §1.2.1) ---
  - priority: 25
    category: state
    check: "expected_publication_version equals the current Publication.version"
    error_id: ERR_STALE_PUBLICATION_VERSION
    http_status: 412
    applies_to: "POST /circulation/statements"
  - priority: 26
    category: state
    check: "expected_subscriber_version equals the current Subscriber.version"
    error_id: ERR_STALE_SUBSCRIBER_VERSION
    http_status: 412
    applies_to: "POST /circulation/qualification-requests"

  # --- 30-38: state preconditions ---
  - priority: 30
    category: state
    check: "the targeted CirculationStatement is in DRAFT"
    error_id: ERR_STATEMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /circulation/statements/{id}/recompute, POST /circulation/statements/{id}/certify"
  - priority: 31
    category: state
    check: "the targeted QualificationRequest is in UNDER_REVIEW"
    error_id: ERR_REQUEST_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /circulation/qualification-requests/{id}/request-info, POST /circulation/qualification-requests/{id}/verify, POST /circulation/qualification-requests/{id}/reject"
  - priority: 32
    category: state
    check: "the targeted entity is in a state from which the requested trigger is declared in §1.2 (request SUBMITTED for review, INFO_REQUESTED for resubmit, statement FILED for audit-engagement creation, engagement FIELDWORK for sample verification, engagement RECONCILIATION for issue-report, finding OPEN for respond, RESPONSE_SUBMITTED for accept-resolution and reject-response (a REJECTED_REOPENED finding re-enters via respond), obligation PENDING for offer, OFFERED for accept and waive, snapshot RECORDED for validate)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints not covered by priorities 30-31"
  - priority: 33
    category: state
    check: "the targeted entity is not already in a terminal state (statement AUDIT_CLEARED or SUPERSEDED, request VERIFIED or REJECTED, engagement REPORT_ISSUED, finding ACCEPTED_RESOLVED, obligation ACCEPTED or WAIVED or VOID, snapshot VALIDATED or REJECTED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 34
    category: business_constraint
    check: "AuditEngagement.sample_verified_count is strictly less than AuditEngagement.sample_size, and this subscriber_id has not already been recorded for this engagement"
    error_id: ERR_SAMPLE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /circulation/audit-engagements/{id}/record-sample-verification"
  - priority: 35
    category: business_safety
    check: "no AuditFinding of this engagement is in OPEN, RESPONSE_SUBMITTED or REJECTED_REOPENED when the computed discrepancy_pct is below Publication.materiality_pct (an immaterial variance cannot close an engagement that still has live findings)"
    error_id: ERR_OPEN_FINDINGS_UNRESOLVED
    http_status: 409
    applies_to: "POST /circulation/audit-engagements/{id}/issue-report"

  # --- 40-42: safety / compliance gates ---
  - priority: 40
    category: business_safety
    check: "X-User-ID differs from CirculationStatement.prepared_by_user_id (the preparer of a statement may never certify it)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /circulation/statements/{id}/certify"
  - priority: 41
    category: business_safety
    check: "Publication.audit_posture is not FROZEN, UNLESS the statement being certified names a same-publication statement in RESTATEMENT_REQUIRED via restates_statement_id"
    error_id: ERR_PUBLICATION_FROZEN
    http_status: 409
    applies_to: "POST /circulation/statements/{id}/certify"
  - priority: 42
    category: business_safety
    check: "CirculationStatement.breakdown_stale is false (the subscriber population or audit posture changed after the last breakdown computation, so the statement must be recomputed before it can be certified)"
    error_id: ERR_BREAKDOWN_STALE
    http_status: 409
    applies_to: "POST /circulation/statements/{id}/certify"

  # --- 50-52: referential integrity of evidence ---
  - priority: 50
    category: business_referential
    check: "the SourceDocument backing the request has purge_status == RETAINED"
    error_id: ERR_SOURCE_DOCUMENT_PURGED
    http_status: 422
    applies_to: "POST /circulation/qualification-requests, POST /circulation/qualification-requests/{id}/verify"
  - priority: 51
    category: business_referential
    check: "SourceDocument.subscriber_id equals the subscriber_id of the request being created"
    error_id: ERR_SOURCE_DOCUMENT_SUBSCRIBER_MISMATCH
    http_status: 422
    applies_to: "POST /circulation/qualification-requests"
  - priority: 52
    category: business_referential
    check: "when restates_statement_id is supplied it names a same-publication CirculationStatement whose status is RESTATEMENT_REQUIRED"
    error_id: ERR_RESTATEMENT_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /circulation/statements"

  # --- 59-64: temporal constraints ---
  - priority: 59
    category: business_temporal
    check: "period_start is strictly before period_end, and window_start is strictly before window_end"
    error_id: ERR_INVALID_PERIOD_RANGE
    http_status: 422
    applies_to: "POST /circulation/statements, POST /circulation/publications/{id}/digital-snapshots, POST /circulation/audit-engagements"
  - priority: 60
    category: business_temporal
    check: "the qualification window [now, now + qualification_validity_months] does not intersect the subscriber's running window [qualified_at, qualification_expires_at] (closed interval, endpoints inclusive), unless the current instant is at or after qualification_expires_at minus renewal_grace_days"
    error_id: ERR_QUALIFICATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /circulation/qualification-requests/{id}/verify"
  - priority: 61
    category: business_temporal
    check: "the statement's half-open period [period_start, period_end) does not overlap the period of any other CirculationStatement of the same publication in DRAFT, FILED, UNDER_AUDIT, FINDINGS_OPEN, AUDIT_CLEARED or RESTATEMENT_REQUIRED; exact adjacency (one period's end equals the next period's start) is permitted, and the statement named by restates_statement_id is excluded from the candidate set"
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /circulation/statements/{id}/certify"
  - priority: 62
    category: business_temporal
    check: "the engagement's closed fieldwork interval [fieldwork_start, fieldwork_end] keeps at least AUDIT_WINDOW_BUFFER_DAYS (14) clear days from the interval of every other AuditEngagement of the same publication (reached through statement_id) whose status is not REPORT_ISSUED; the gap is measured end-to-start in either direction, so 14 clear days is the smallest accepted separation"
    error_id: ERR_AUDIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /circulation/audit-engagements"
  - priority: 63
    category: business_temporal
    check: "the current logical clock is at or after period_end for a statement, and at or after window_end for a digital snapshot (no statement or measurement may be produced for a period that has not closed)"
    error_id: ERR_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /circulation/statements, POST /circulation/publications/{id}/digital-snapshots"
  - priority: 64
    category: business_temporal
    check: "the current logical clock is at or after SourceDocument.retention_expires_at"
    error_id: ERR_RETENTION_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /circulation/source-documents/{id}/purge"

  # --- 68-74: qualification constraint satisfaction ---
  - priority: 68
    category: business_constraint
    check: "the subscriber's publication has a QualificationRule row for each of JOB_FUNCTION, INDUSTRY and PURCHASING_AUTHORITY"
    error_id: ERR_QUALIFICATION_RULES_INCOMPLETE
    http_status: 409
    applies_to: "POST /circulation/qualification-requests/{id}/verify"
  - priority: 69
    category: business_constraint
    check: "the attested value of every QualificationRule with is_mandatory == true is a member of that rule's allowed_values (evaluated AFTER the score threshold test)"
    error_id: ERR_MANDATORY_CRITERION_NOT_MET
    http_status: 422
    applies_to: "POST /circulation/qualification-requests/{id}/verify"
  - priority: 70
    category: business_constraint
    check: "computed_score, re-evaluated at the current logical clock, is at least QUALIFY_SCORE_THRESHOLD (70)"
    error_id: ERR_QUALIFICATION_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /circulation/qualification-requests/{id}/verify"
  - priority: 71
    category: business_constraint
    check: "QualificationRequest.info_request_count is strictly less than INFO_REQUEST_LIMIT (2)"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /circulation/qualification-requests/{id}/request-info"
  - priority: 72
    category: business_constraint
    check: "no QualificationRule with this dimension already exists for the publication (one rule per dimension)"
    error_id: ERR_RULE_DIMENSION_EXISTS
    http_status: 409
    applies_to: "POST /circulation/publications/{id}/qualification-rules"
  - priority: 73
    category: business_constraint
    check: "a subscriber classified PAID has paid_amount_cents >= 1, counting the value supplied on this request or the value already stored"
    error_id: ERR_PAID_REQUIRES_PAYMENT
    http_status: 422
    applies_to: "POST /circulation/subscribers, POST /circulation/subscribers/{id}/reclassify"
  - priority: 74
    category: business_constraint
    check: "DigitalAudienceSnapshot.source is THIRD_PARTY_CERTIFIED when the decision is VALIDATE (uncertified analytics may be recorded but never validated into a statement)"
    error_id: ERR_DIGITAL_SOURCE_UNCERTIFIED
    http_status: 422
    applies_to: "POST /circulation/digital-snapshots/{id}/validate"

  # --- 80-81: fiscal checks last ---
  - priority: 80
    category: business_fiscal
    check: "the computed credit_cents for every qualifying contract is at most that contract's makegood_credit_available_cents; on violation no MakeGoodObligation is persisted for any contract in the batch"
    error_id: ERR_MAKEGOOD_POOL_EXCEEDED
    http_status: 422
    applies_to: "POST /circulation/statements/{id}/settle-guarantees"
  - priority: 81
    category: business_fiscal
    check: "at least one ACTIVE AdvertiserContract of the publication has shortfall_pct strictly greater than its shortfall_tolerance_pct"
    error_id: ERR_NO_SHORTFALL_TO_SETTLE
    http_status: 409
    applies_to: "POST /circulation/statements/{id}/settle-guarantees"

endpoints:
  # ============================== reads ======================================
  - method: GET
    path: "/circulation/publications/{id}"
    description: "fetch one publication with its live copy counters, undeliverable_pct and audit_posture; the source of expected_publication_version for OCC-guarded statement creation"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: []
    output: Publication
    side_effects: []
  - method: GET
    path: "/circulation/publications/{id}/qualification-rules"
    description: "list the qualified-circulation criteria rows of a publication (one per dimension)"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["dimension?", "limit?", "offset?"]
    output: QualificationRule[]
    side_effects: []
  - method: GET
    path: "/circulation/publications/{id}/digital-snapshots"
    description: "list digital audience measurement snapshots of a publication (the only discovery channel for snapshots)"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DigitalAudienceSnapshot[]
    side_effects: []
  - method: GET
    path: "/circulation/publications/{id}/hygiene-runs"
    description: "list list-hygiene sweeps executed against a publication, newest first, with their before/after posture and per-class counts"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["run_type?", "limit?", "offset?"]
    output: HygieneRun[]
    side_effects: []
  - method: GET
    path: "/circulation/subscribers/{id}"
    description: "fetch one subscriber with both status dimensions, qualification window and copy count; the source of expected_subscriber_version for OCC-guarded request creation"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: []
    output: Subscriber
    side_effects: []
  - method: GET
    path: "/circulation/subscribers"
    description: "filtered list of subscribers; the reverse-reachability channel for Subscriber.publication_id"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["publication_id?", "qualification_status?", "delivery_status?", "subscription_class?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []
  - method: GET
    path: "/circulation/subscribers/{id}/source-documents"
    description: "list the retained and purged source documents backing a subscriber's qualification"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["purge_status?", "limit?", "offset?"]
    output: SourceDocument[]
    side_effects: []
  - method: GET
    path: "/circulation/qualification-requests/{id}"
    description: "fetch one qualification request with its computed_score, info_request_count and effective window"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: []
    output: QualificationRequest
    side_effects: []
  - method: GET
    path: "/circulation/qualification-requests"
    description: "filtered list of qualification requests; the reverse-reachability channel for both QualificationRequest.subscriber_id and QualificationRequest.source_document_id"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["subscriber_id?", "source_document_id?", "status?", "limit?", "offset?"]
    output: QualificationRequest[]
    side_effects: []
  - method: GET
    path: "/circulation/statements/{id}"
    description: "fetch one circulation statement with its paid / qualified-non-paid / controlled breakdown, digital reach and reconciliation fields"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: []
    output: CirculationStatement
    side_effects: []
  - method: GET
    path: "/circulation/statements"
    description: "filtered list of circulation statements; the reverse-reachability channel for CirculationStatement.publication_id and CirculationStatement.restates_statement_id"
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["publication_id?", "status?", "basis?", "restates_statement_id?", "limit?", "offset?"]
    output: CirculationStatement[]
    side_effects: []
  - method: GET
    path: "/circulation/statements/{id}/audit-engagements"
    description: "list audit engagements opened against a statement (the only discovery channel for engagements)"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []
  - method: GET
    path: "/circulation/audit-findings/{id}"
    description: "fetch one audit finding with its severity, affected copies and response history"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: GET
    path: "/circulation/audit-findings"
    description: "filtered list of audit findings; the reverse-reachability channel for AuditFinding.engagement_id and AuditFinding.subscriber_id"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["engagement_id?", "subscriber_id?", "status?", "severity?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: GET
    path: "/circulation/advertiser-contracts/{id}"
    description: "fetch one advertiser contract with its rate-base guarantee and make-good credit ledger buckets"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: []
    output: AdvertiserContract
    side_effects: []
  - method: GET
    path: "/circulation/advertiser-contracts"
    description: "filtered list of advertiser contracts; the reverse-reachability channel for AdvertiserContract.publication_id"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["publication_id?", "guarantee_status?", "limit?", "offset?"]
    output: AdvertiserContract[]
    side_effects: []
  - method: GET
    path: "/circulation/make-goods/{id}"
    description: "fetch one make-good obligation; when the caller is an AdvertiserContact, X-User-ID must equal the obligation's contract_id"
    roles: [CirculationManager, PublisherExecutive, AdvertiserContact]
    code: 200
    input: []
    output: MakeGoodObligation
    side_effects: []
  - method: GET
    path: "/circulation/make-goods"
    description: "filtered list of make-good obligations; the reverse-reachability channel for MakeGoodObligation.contract_id and MakeGoodObligation.statement_id"
    roles: [CirculationManager, CirculationAuditor, PublisherExecutive]
    code: 200
    input: ["contract_id?", "statement_id?", "status?", "limit?", "offset?"]
    output: MakeGoodObligation[]
    side_effects: []

  # ================= publications, rules, subscribers, evidence ==============
  - method: POST
    path: "/circulation/publications"
    description: "register a trade publication with its qualification validity, retention, materiality, hygiene and controlled-cap policy knobs"
    roles: [CirculationManager]
    code: 201
    input: [name, frequency, industry_code, "qualification_validity_months?", "renewal_grace_days?", "source_doc_retention_months?", "undeliverable_restrict_pct?", "materiality_pct?", "controlled_cap_pct?"]
    output: Publication
    side_effects: ["all copy counters initialised to 0", "undeliverable_pct set to 0.00", "audit_posture set to OPEN", "version set to 1"]
  - method: POST
    path: "/circulation/publications/{id}/qualification-rules"
    description: "define one qualified-circulation criterion (job function, industry or purchasing authority) with its point weight, allowed values and mandatory flag"
    roles: [CirculationManager]
    code: 201
    input: [dimension, allowed_values, points, "is_mandatory?"]
    output: QualificationRule
    side_effects: ["rejects a second rule for the same dimension with ERR_RULE_DIMENSION_EXISTS", "later qualification_score evaluations read this row; existing scores are not retro-recomputed"]
  - method: POST
    path: "/circulation/subscribers"
    description: "add a recipient to a publication's file with its subscription class and copy count; the recipient starts UNQUALIFIED and DELIVERABLE"
    roles: [CirculationManager]
    code: 201
    input: [publication_id, company_name, contact_email, job_function_code, industry_code, purchasing_authority_level, subscription_class, copies, "paid_amount_cents?"]
    output: Subscriber
    side_effects: ["qualification_status set to UNQUALIFIED and delivery_status set to DELIVERABLE", "runs calculations.publication_copies_ledger: copies_on_file_total, the class counter for subscription_class, deliverable_copies and undeliverable_pct updated", "runs calculations.publication_audit_posture", "sets breakdown_stale = true on every DRAFT statement of the publication", "version set to 1"]
  - method: POST
    path: "/circulation/subscribers/{id}/source-documents"
    description: "attach source documentation evidencing a qualification request; retention_expires_at is derived as captured_at plus the publication's source_doc_retention_months"
    roles: [CirculationManager, QualificationSpecialist]
    code: 201
    input: [doc_type, captured_at, storage_ref]
    output: SourceDocument
    side_effects: ["retention_expires_at computed from Publication.source_doc_retention_months", "purge_status set to RETAINED", "immutable row: no version field, no update endpoint"]
  - method: POST
    path: "/circulation/subscribers/{id}/undeliverable-events"
    description: "record one returned or bounced delivery against a recipient; the counter alone changes nothing until a hygiene sweep evaluates it against a threshold"
    roles: [CirculationManager]
    code: 200
    input: ["reason_code?"]
    output: Subscriber
    side_effects: ["undeliverable_count incremented by 1", "delivery_status and qualification_status untouched — only POST /circulation/hygiene-runs acts on the counter", "increments Subscriber.version by 1"]
  - method: POST
    path: "/circulation/subscribers/{id}/reclassify"
    description: "move a recipient between PAID, QUALIFIED_NON_PAID and CONTROLLED; the compensating direction restores every class counter exactly"
    roles: [CirculationManager]
    code: 200
    input: [subscription_class, "paid_amount_cents?"]
    output: Subscriber
    side_effects: ["re-runs calculations.publication_copies_ledger: the old class counter decreases by copies and the new one increases by copies, copies_on_file_total unchanged", "sets breakdown_stale = true on every DRAFT statement of the publication", "increments Subscriber.version by 1"]
  - method: POST
    path: "/circulation/source-documents/{id}/purge"
    description: "purge a source document whose retention period has elapsed; the row survives as a tombstone so audited statements can still explain the gap"
    roles: [CirculationManager]
    code: 200
    input: ["purge_reason?"]
    output: SourceDocument
    side_effects: ["purge_status set to PURGED and purged_at set to the current logical clock", "any AUDIT_VERIFIED breakdown recomputed afterwards drops the recipients this document backed"]

  # ===================== subscriber qualification workflow ===================
  - method: POST
    path: "/circulation/qualification-requests"
    description: "open a qualification request against a recipient, citing the source document that evidences the attested job function, industry and purchasing authority; OCC-guarded on the recipient's version"
    roles: [CirculationManager, QualificationSpecialist]
    code: 201
    input: [subscriber_id, source_document_id, request_channel, signed_at, attested_job_function_code, attested_industry_code, attested_purchasing_authority, expected_subscriber_version]
    output: QualificationRequest
    side_effects: ["status set to SUBMITTED, info_request_count set to 0", "Subscriber.qualification_status moves to PENDING_QUALIFICATION from UNQUALIFIED, LAPSED, REQUALIFICATION_REQUIRED or QUALIFIED", "increments Subscriber.version by 1", "rejects a stale expected_subscriber_version with ERR_STALE_SUBSCRIBER_VERSION"]
  - method: POST
    path: "/circulation/qualification-requests/{id}/review"
    description: "take a submitted request into review; computed_score is evaluated here from the publication's rule rows and the request's signature age"
    roles: [QualificationSpecialist]
    code: 200
    input: ["review_note?"]
    output: QualificationRequest
    side_effects: ["status set to UNDER_REVIEW", "reviewed_by_user_id set to X-User-ID", "runs calculations.qualification_score and stores computed_score"]
  - method: POST
    path: "/circulation/qualification-requests/{id}/request-info"
    description: "bounce a request back to the recipient for missing documentation; at most INFO_REQUEST_LIMIT (2) round trips are permitted"
    roles: [QualificationSpecialist]
    code: 200
    input: [info_request_note]
    output: QualificationRequest
    side_effects: ["status set to INFO_REQUESTED", "info_request_count incremented by 1", "the third attempt fails with ERR_INFO_REQUEST_LIMIT_REACHED"]
  - method: POST
    path: "/circulation/qualification-requests/{id}/resubmit"
    description: "supply the requested information and push the request back into the review queue, optionally restating the attested criteria and signature date"
    roles: [CirculationManager, QualificationSpecialist]
    code: 200
    input: ["signed_at?", "request_channel?", "attested_job_function_code?", "attested_industry_code?", "attested_purchasing_authority?"]
    output: QualificationRequest
    side_effects: ["status set back to SUBMITTED (the cycle re-enters UNDER_REVIEW only via review)", "info_request_count preserved across the cycle"]
  - method: POST
    path: "/circulation/qualification-requests/{id}/verify"
    description: "verify a reviewed request: re-evaluates computed_score at the current logical clock, enforces the mandatory criteria, the retained source document and the qualification-window rules, then qualifies the recipient"
    roles: [QualificationSpecialist]
    code: 200
    input: ["decision_reason?"]
    output: QualificationRequest
    side_effects: ["computed_score re-evaluated at the current logical clock BEFORE the threshold precondition is applied", "status set to VERIFIED, decided_at set, effective_from set to now and effective_to set to now plus Publication.qualification_validity_months", "Subscriber.qualification_status set to QUALIFIED, qualification_score copied, qualified_at and qualification_expires_at set", "reinstates delivery_status to DELIVERABLE and resets undeliverable_count to 0 when the recipient was UNDELIVERABLE or REMOVED", "a renewal inside the grace window truncates the predecessor request's effective_to to now", "re-runs calculations.publication_copies_ledger and calculations.publication_audit_posture", "sets breakdown_stale = true on every DRAFT statement of the publication"]
  - method: POST
    path: "/circulation/qualification-requests/{id}/reject"
    description: "reject a reviewed request; the recipient falls back to UNQUALIFIED, or keeps a still-open running window as QUALIFIED, or drops to LAPSED when that window has already elapsed"
    roles: [QualificationSpecialist]
    code: 200
    input: [decision_reason]
    output: QualificationRequest
    side_effects: ["status set to REJECTED, decided_at and decision_reason stored", "Subscriber.qualification_status set to UNQUALIFIED, QUALIFIED or LAPSED per the running-window rules in §1.2"]
  - method: POST
    path: "/circulation/hygiene-runs"
    description: "execute a list-hygiene sweep over a publication: UNDELIVERABLE_SWEEP flags or removes recipients by undeliverable_count, EXPIRY_SWEEP lapses recipients whose qualification window has elapsed"
    roles: [CirculationManager]
    code: 201
    input: [publication_id, run_type, "undeliverable_threshold?"]
    output: HygieneRun
    side_effects: ["executed_at set to the current logical clock; posture_before captured before the sweep and posture_after after it", "drives the Subscriber delivery and qualification dimensions per §1.2 and counts each outcome into undeliverable_flagged_count, removed_count, lapsed_count and requalification_required_count", "re-runs calculations.publication_copies_ledger and calculations.publication_audit_posture", "when posture_after differs from posture_before, sets breakdown_stale = true on every DRAFT statement of the publication and reports how many in statements_invalidated_count", "immutable row: no version field, no update endpoint"]

  # ===================== statements and rate-base settlement =================
  - method: POST
    path: "/circulation/statements"
    description: "open a DRAFT circulation statement for a closed period and compute its paid / qualified-non-paid / controlled breakdown under the requested basis; OCC-guarded on the publication's version"
    roles: [CirculationManager]
    code: 201
    input: [publication_id, period_start, period_end, "basis?", "restates_statement_id?", expected_publication_version]
    output: CirculationStatement
    side_effects: ["status set to DRAFT; statement_type derived as AUDITED when basis == AUDIT_VERIFIED, PUBLISHER_STATEMENT otherwise", "runs calculations.statement_circulation_breakdown under the selected variant and calculations.controlled_copies_cap_allowance", "digital_reach_verified summed from VALIDATED snapshots fully inside the period; undeliverable_pct_at_close captured", "breakdown_stale set to false; prepared_by_user_id set to X-User-ID", "increments Publication.version by 1", "rejects a stale expected_publication_version with ERR_STALE_PUBLICATION_VERSION"]
  - method: POST
    path: "/circulation/statements/{id}/recompute"
    description: "recompute a DRAFT statement's breakdown, optionally switching the basis between the publisher's as-of-period-end view and the audit-verified view"
    roles: [CirculationManager]
    code: 200
    input: ["basis?"]
    output: CirculationStatement
    side_effects: ["re-runs calculations.statement_circulation_breakdown under the (possibly switched) basis and re-derives statement_type", "clears breakdown_stale to false", "declared_total_copies stays null until certification"]
  - method: POST
    path: "/circulation/statements/{id}/certify"
    description: "certify and file a statement; the preparer may never certify, a FROZEN publication blocks certification unless this statement restates the offending one, and periods may not overlap"
    roles: [CirculationManager, PublisherExecutive]
    code: 200
    input: ["certification_note?"]
    output: CirculationStatement
    side_effects: ["status set to FILED; filed_at and certified_by_user_id set; declared_total_copies frozen at total_qualified_copies", "when restates_statement_id is set: the predecessor moves RESTATEMENT_REQUIRED -> SUPERSEDED, Publication.audit_posture is recomputed out of FROZEN, and every SUSPENDED_PENDING_RESTATEMENT contract of the publication returns to ACTIVE", "increments Publication.version by 1"]
  - method: POST
    path: "/circulation/statements/{id}/settle-guarantees"
    description: "settle advertiser rate-base guarantees against a filed statement, creating one make-good obligation per contract whose shortfall exceeds its tolerance"
    roles: [CirculationManager]
    code: 201
    input: ["settlement_note?"]
    output: MakeGoodObligation[]
    side_effects: ["runs calculations.rate_base_shortfall_makegood over ACTIVE contracts of the publication in created_at ASC order", "one MakeGoodObligation per qualifying contract created in PENDING with shortfall_copies, shortfall_pct, tier_factor, per_insertion_credit_cents, credit_cents and bonus_insertions stored", "runs calculations.contract_makegood_ledger per contract: makegood_credit_committed_cents increases and makegood_credit_available_cents decreases by credit_cents", "guarantees_settled_at set on the statement", "all-or-nothing: if any contract's credit exceeds its available pool the whole request fails with ERR_MAKEGOOD_POOL_EXCEEDED and no obligation is persisted"]

  # ===================== audit engagements and findings ======================
  - method: POST
    path: "/circulation/audit-engagements"
    description: "open an audit engagement against a filed statement with a fieldwork window and a sample size; the window must clear the 14-day separation from the publication's other live engagements"
    roles: [CirculationAuditor]
    code: 201
    input: [statement_id, auditor_org, fieldwork_start, fieldwork_end, sample_size]
    output: AuditEngagement
    side_effects: ["engagement created in SCHEDULED with sample_verified_count 0 and verified_qualified_copies 0", "the statement moves FILED -> UNDER_AUDIT", "rejects a window inside the 14-day buffer with ERR_AUDIT_WINDOW_CONFLICT"]
  - method: POST
    path: "/circulation/audit-engagements/{id}/record-sample-verification"
    description: "record the auditor's verification of one sampled recipient's source documentation; the engagement auto-advances to RECONCILIATION once the sample is complete"
    roles: [CirculationAuditor]
    code: 200
    input: [subscriber_id, evidence_ok, verified_copies]
    output: AuditEngagement
    side_effects: ["sample_verified_count incremented by 1", "verified_qualified_copies increased by verified_copies when evidence_ok is true, by 0 when it is false", "auto-advances SCHEDULED or FIELDWORK -> RECONCILIATION in the same request once sample_verified_count reaches sample_size", "a further record after that is rejected with ERR_SAMPLE_LIMIT_EXCEEDED"]
  - method: POST
    path: "/circulation/audit-engagements/{id}/issue-report"
    description: "issue the audit report: reconciles the statement's declared copies against the audited figure and either clears the statement or forces a restatement with its five-hop cascade"
    roles: [CirculationAuditor]
    code: 200
    input: ["report_note?"]
    output: AuditEngagement
    side_effects: ["runs calculations.statement_reconciliation_discrepancy and writes discrepancy_copies and discrepancy_pct onto the statement", "engagement moves RECONCILIATION -> REPORT_ISSUED; report_issued_at set", "below materiality: statement -> AUDIT_CLEARED with no downstream effect", "at or above materiality: statement -> RESTATEMENT_REQUIRED, Publication.audit_posture -> FROZEN (Publication.version incremented), every ACTIVE contract -> SUSPENDED_PENDING_RESTATEMENT, and each of their PENDING or OFFERED obligations -> VOID with closed_reason RESTATEMENT_REQUIRED_CASCADE, returning credit to makegood_credit_available_cents", "rejects an immaterial report while findings are still live with ERR_OPEN_FINDINGS_UNRESOLVED"]
  - method: POST
    path: "/circulation/audit-findings"
    description: "raise an audit finding against a sampled recipient, driving the statement into FINDINGS_OPEN and re-deriving the publication's audit posture"
    roles: [CirculationAuditor]
    code: 201
    input: [engagement_id, subscriber_id, finding_type, severity, affected_copies]
    output: AuditFinding
    side_effects: ["finding created in OPEN with response_count 0; raised_by_user_id set to X-User-ID", "the statement moves UNDER_AUDIT -> FINDINGS_OPEN", "engagement.open_findings_count recomputed", "Publication.open_material_findings_count or open_critical_findings_count and audit_posture recomputed; a CRITICAL finding freezes the publication", "increments Publication.version by 1"]
  - method: POST
    path: "/circulation/audit-findings/{id}/respond"
    description: "publisher response to an open or reopened finding; the response may be rejected and the loop repeated without limit"
    roles: [CirculationManager]
    code: 200
    input: [response_note]
    output: AuditFinding
    side_effects: ["status set to RESPONSE_SUBMITTED; response_note stored; response_count incremented by 1"]
  - method: POST
    path: "/circulation/audit-findings/{id}/accept-resolution"
    description: "auditor accepts the publisher's response and closes the finding; closing the last live finding returns the statement to UNDER_AUDIT"
    roles: [CirculationAuditor]
    code: 200
    input: ["resolution_note?"]
    output: AuditFinding
    side_effects: ["status set to ACCEPTED_RESOLVED; resolved_at set to the current logical clock", "engagement.open_findings_count recomputed; when it reaches 0 the statement moves FINDINGS_OPEN -> UNDER_AUDIT", "Publication.open_material_findings_count / open_critical_findings_count and audit_posture recomputed; increments Publication.version by 1"]
  - method: POST
    path: "/circulation/audit-findings/{id}/reject-response"
    description: "auditor rejects the publisher's response and reopens the finding, closing one turn of the resolution cycle"
    roles: [CirculationAuditor]
    code: 200
    input: [rejection_note]
    output: AuditFinding
    side_effects: ["status set to REJECTED_REOPENED", "the finding stays counted in engagement.open_findings_count and in the publication's open-findings counters, so audit_posture does not relax"]

  # ============ advertiser guarantees, make-goods, digital audience ==========
  - method: POST
    path: "/circulation/advertiser-contracts"
    description: "register an advertiser insertion contract with its guaranteed rate base, shortfall tolerance and make-good credit pool"
    roles: [CirculationManager]
    code: 201
    input: [publication_id, advertiser_name, insertion_count, gross_rate_cents_per_insertion, guaranteed_rate_base, "shortfall_tolerance_pct?"]
    output: AdvertiserContract
    side_effects: ["guarantee_status set to ACTIVE", "makegood_credit_pool_cents computed as insertion_count * gross_rate_cents_per_insertion; committed and waived set to 0; available set to the full pool", "version set to 1"]
  - method: POST
    path: "/circulation/make-goods/{id}/offer"
    description: "offer a computed make-good credit to the advertiser"
    roles: [CirculationManager]
    code: 200
    input: ["offer_note?"]
    output: MakeGoodObligation
    side_effects: ["status set to OFFERED; offered_at set to the current logical clock", "the credit stays in makegood_credit_committed_cents — the ledger is unchanged by the offer"]
  - method: POST
    path: "/circulation/make-goods/{id}/accept"
    description: "advertiser accepts an offered make-good; the acting AdvertiserContact's X-User-ID must equal the obligation's contract_id"
    roles: [AdvertiserContact]
    code: 200
    input: ["acceptance_note?"]
    output: MakeGoodObligation
    side_effects: ["status set to ACCEPTED; accepted_at set to the current logical clock", "the credit remains committed: makegood_credit_committed_cents and makegood_credit_available_cents are unchanged"]
  - method: POST
    path: "/circulation/make-goods/{id}/waive"
    description: "executive waiver of an offered make-good; the compensating action that moves the credit out of the committed bucket without changing the pool"
    roles: [PublisherExecutive]
    code: 200
    input: [waiver_reason]
    output: MakeGoodObligation
    side_effects: ["status set to WAIVED; closed_reason set from waiver_reason", "re-runs calculations.contract_makegood_ledger: makegood_credit_committed_cents decreases by credit_cents and makegood_credit_waived_cents increases by the same amount; makegood_credit_available_cents and makegood_credit_pool_cents are unchanged"]
  - method: POST
    path: "/circulation/publications/{id}/digital-snapshots"
    description: "record a closed measurement window's website and newsletter metrics; both the gross and the deduplicated reach are computed on write"
    roles: [CirculationManager]
    code: 201
    input: [window_start, window_end, website_unique_visitors, newsletter_sends, newsletter_unique_opens, overlap_pct, source]
    output: DigitalAudienceSnapshot
    side_effects: ["status set to RECORDED", "runs calculations.digital_combined_reach and stores both combined_reach_gross and combined_reach_deduplicated", "rejects a window that has not closed with ERR_PERIOD_NOT_ELAPSED"]
  - method: POST
    path: "/circulation/digital-snapshots/{id}/validate"
    description: "auditor adjudication of a recorded snapshot; only a THIRD_PARTY_CERTIFIED snapshot may be validated into statement circulation"
    roles: [CirculationAuditor]
    code: 200
    input: [decision]
    output: DigitalAudienceSnapshot
    side_effects: ["decision VALIDATE sets status to VALIDATED and validated_by_user_id to X-User-ID, making combined_reach_deduplicated eligible for statement digital_reach_verified", "decision REJECT sets status to REJECTED and the snapshot never enters a statement", "VALIDATE on an INTERNAL_ANALYTICS snapshot is rejected with ERR_DIGITAL_SOURCE_UNCERTIFIED"]

  # ============================ test-driving surface =========================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical UTC clock, which every window, retention, expiry and period rule reads. Before any call the clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [CirculationManager, QualificationSpecialist, CirculationAuditor, PublisherExecutive]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["subsequent requests evaluate qualification windows, retention expiry, statement period closure and measurement windows against the new instant", "no entity is mutated and no sweep is triggered: EXPIRY_SWEEP and UNDELIVERABLE_SWEEP outcomes materialise only on POST /circulation/hygiene-runs"]

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_CONTRACT_OWNER
    http: 403
    condition: "an AdvertiserContact acts on a MakeGoodObligation whose contract_id differs from X-User-ID"
  # --- existence ---
  - id: ERR_PUBLICATION_NOT_FOUND
    http: 404
    condition: "no Publication with the given id"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "no Subscriber with the given id"
  - id: ERR_SOURCE_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no SourceDocument with the given id"
  - id: ERR_QUALIFICATION_REQUEST_NOT_FOUND
    http: 404
    condition: "no QualificationRequest with the given id"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "no CirculationStatement with the given id, including a restates_statement_id that resolves to nothing"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "no AuditEngagement with the given id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "no AuditFinding with the given id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no AdvertiserContract with the given id"
  - id: ERR_MAKEGOOD_NOT_FOUND
    http: 404
    condition: "no MakeGoodObligation with the given id"
  - id: ERR_SNAPSHOT_NOT_FOUND
    http: 404
    condition: "no DigitalAudienceSnapshot with the given id"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent, or a numeric field falls below its declared minimum, or a timestamp does not parse as ISO-8601 UTC"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "a supplied enum value is outside its declared value set"
  # --- optimistic concurrency ---
  - id: ERR_STALE_PUBLICATION_VERSION
    http: 412
    condition: "expected_publication_version does not equal the Publication's current version on POST /circulation/statements"
  - id: ERR_STALE_SUBSCRIBER_VERSION
    http: 412
    condition: "expected_subscriber_version does not equal the Subscriber's current version on POST /circulation/qualification-requests"
  # --- state preconditions ---
  - id: ERR_STATEMENT_NOT_DRAFT
    http: 409
    condition: "recompute or certify targets a statement that has left DRAFT"
  - id: ERR_REQUEST_NOT_UNDER_REVIEW
    http: 409
    condition: "request-info, verify or reject targets a QualificationRequest that is not UNDER_REVIEW"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested trigger is not declared for the target entity's current state in §1.2 (for example review on an INFO_REQUESTED request, or accept on a PENDING obligation)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target entity is in a terminal state: statement AUDIT_CLEARED or SUPERSEDED, request VERIFIED or REJECTED, engagement REPORT_ISSUED, finding ACCEPTED_RESOLVED, obligation ACCEPTED, WAIVED or VOID, snapshot VALIDATED or REJECTED"
  - id: ERR_SAMPLE_LIMIT_EXCEEDED
    http: 409
    condition: "a sample verification is recorded when sample_verified_count already equals sample_size, or the same subscriber_id is recorded twice against one engagement"
  - id: ERR_OPEN_FINDINGS_UNRESOLVED
    http: 409
    condition: "issue-report would clear a statement below materiality while findings of the engagement are still OPEN, RESPONSE_SUBMITTED or REJECTED_REOPENED"
  # --- safety / compliance ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the user who prepared a statement attempts to certify it (X-User-ID equals prepared_by_user_id)"
  - id: ERR_PUBLICATION_FROZEN
    http: 409
    condition: "certification is attempted while Publication.audit_posture is FROZEN and the statement does not restate the RESTATEMENT_REQUIRED statement that froze it"
  - id: ERR_BREAKDOWN_STALE
    http: 409
    condition: "certification is attempted while breakdown_stale is true because the subscriber population or the audit posture moved after the last breakdown computation"
  # --- referential integrity of evidence ---
  - id: ERR_SOURCE_DOCUMENT_PURGED
    http: 422
    condition: "a qualification request cites, or a verification relies on, a SourceDocument whose purge_status is PURGED"
  - id: ERR_SOURCE_DOCUMENT_SUBSCRIBER_MISMATCH
    http: 422
    condition: "the cited SourceDocument belongs to a different subscriber than the request being created"
  - id: ERR_RESTATEMENT_NOT_REQUIRED
    http: 409
    condition: "restates_statement_id names a statement of another publication or one whose status is not RESTATEMENT_REQUIRED"
  # --- temporal ---
  - id: ERR_INVALID_PERIOD_RANGE
    http: 422
    condition: "period_start is at or after period_end, or window_start is at or after window_end"
  - id: ERR_QUALIFICATION_WINDOW_OVERLAP
    http: 409
    condition: "a verification would open a qualification window intersecting the recipient's running closed window while the renewal grace window has not yet opened"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "certification would file a statement whose half-open period intersects a live statement of the same publication; exact adjacency is not an overlap"
  - id: ERR_AUDIT_WINDOW_CONFLICT
    http: 409
    condition: "the engagement's fieldwork interval leaves fewer than 14 clear days between itself and another live engagement of the same publication"
  - id: ERR_PERIOD_NOT_ELAPSED
    http: 422
    condition: "a statement period_end or a snapshot window_end lies after the current logical clock"
  - id: ERR_RETENTION_NOT_ELAPSED
    http: 409
    condition: "a purge is attempted before the SourceDocument's retention_expires_at"
  # --- qualification constraints ---
  - id: ERR_QUALIFICATION_RULES_INCOMPLETE
    http: 409
    condition: "the subscriber's publication lacks a QualificationRule row for one of JOB_FUNCTION, INDUSTRY or PURCHASING_AUTHORITY"
  - id: ERR_MANDATORY_CRITERION_NOT_MET
    http: 422
    condition: "the attested value of a mandatory criterion is outside that rule's allowed_values even though the total score reaches the threshold"
  - id: ERR_QUALIFICATION_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "computed_score, re-evaluated at verification time, is below QUALIFY_SCORE_THRESHOLD (70)"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "a third information request is attempted on one QualificationRequest"
  - id: ERR_RULE_DIMENSION_EXISTS
    http: 409
    condition: "a second QualificationRule is created for a dimension the publication already defines"
  - id: ERR_PAID_REQUIRES_PAYMENT
    http: 422
    condition: "a subscriber is created as, or reclassified to, PAID without a positive paid_amount_cents"
  - id: ERR_DIGITAL_SOURCE_UNCERTIFIED
    http: 422
    condition: "VALIDATE is requested on a DigitalAudienceSnapshot whose source is INTERNAL_ANALYTICS"
  # --- fiscal ---
  - id: ERR_MAKEGOOD_POOL_EXCEEDED
    http: 422
    condition: "a computed make-good credit exceeds the contract's makegood_credit_available_cents; nothing is persisted for the whole settlement batch"
  - id: ERR_NO_SHORTFALL_TO_SETTLE
    http: 409
    condition: "settlement is requested when no ACTIVE contract of the publication has a shortfall above its tolerance"

roles:
  - name: CirculationManager
    description: "publisher-side circulation operations: publications, qualification policy, the subscriber file, hygiene sweeps, statement preparation, guarantee settlement and finding responses"
    identity: "opaque"
    exclusive_operations:
      - "create publications and qualification rules"
      - "create, reclassify and record undeliverable events against subscribers"
      - "purge source documents whose retention has elapsed"
      - "execute hygiene runs"
      - "create and recompute statements"
      - "settle rate-base guarantees and offer make-goods"
      - "create advertiser contracts"
      - "record digital audience snapshots"
      - "respond to audit findings"
    shared_operations:
      - "certify statements (shared with PublisherExecutive, subject to ERR_SEGREGATION_OF_DUTIES)"
      - "attach source documents (shared with QualificationSpecialist)"
      - "create and resubmit qualification requests (shared with QualificationSpecialist)"
      - "read publications, subscribers, requests, statements, findings, contracts and make-goods"
      - "set the logical clock"
  - name: QualificationSpecialist
    description: "adjudicates subscriber qualification: review, information requests, verification and rejection of qualification requests"
    identity: "opaque"
    exclusive_operations:
      - "review qualification requests"
      - "request further information on a qualification request"
      - "verify qualification requests"
      - "reject qualification requests"
    shared_operations:
      - "attach source documents (shared with CirculationManager)"
      - "create and resubmit qualification requests (shared with CirculationManager)"
      - "read publications, subscribers, requests and statements"
      - "set the logical clock"
  - name: CirculationAuditor
    description: "independent auditor: engagements, sample verification, findings, report issuance and digital measurement adjudication"
    identity: "opaque"
    exclusive_operations:
      - "create audit engagements"
      - "record sample verifications"
      - "issue audit reports"
      - "raise audit findings"
      - "accept or reject finding responses"
      - "validate or reject digital audience snapshots"
    shared_operations:
      - "read publications, subscribers, requests, statements, engagements, findings and contracts"
      - "set the logical clock"
  - name: PublisherExecutive
    description: "publisher officer accountable for the certified statement and for waiving advertiser make-good credits; may never prepare the statement it certifies"
    identity: "opaque"
    exclusive_operations:
      - "waive make-good obligations"
    shared_operations:
      - "certify statements (shared with CirculationManager, subject to ERR_SEGREGATION_OF_DUTIES)"
      - "read publications, subscribers, requests, statements, findings, contracts and make-goods"
      - "set the logical clock"
  - name: AdvertiserContact
    description: "advertiser-side contact acting as its own insertion contract; X-User-ID is the AdvertiserContract id"
    identity: "entity_backed:AdvertiserContract"
    exclusive_operations:
      - "accept an offered make-good obligation"
    shared_operations:
      - "read its own make-good obligations (X-User-ID must equal the obligation's contract_id)"
