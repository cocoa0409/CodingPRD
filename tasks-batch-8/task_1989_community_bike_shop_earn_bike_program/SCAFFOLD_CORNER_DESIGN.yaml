            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${a}" }, as: ShopCoordinator, captures: { aa2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${aa1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${aa2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${a}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-SK", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
