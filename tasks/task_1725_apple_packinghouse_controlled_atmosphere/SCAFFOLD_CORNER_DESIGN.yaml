      - name: c_stub_line_overlap
        claim_type: conditional_action
        grounds: ["errors[ERR_LINE_SCHEDULE_OVERLAP]"]
        excluded_because:
          difficulty_instance: line_window_overlap_half_open
          rationale: "Half-open overlap, adjacency, and cross-line freedom asserted by the named §1.8 instance."

      - name: c_stub_room_capacity
        claim_type: conditional_action
        grounds: ["errors[ERR_ROOM_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: room_bin_capacity_aggregate
          rationale: "Aggregate capacity boundary asserted by the named §1.8 instance."

      - name: c_stub_o2_tolerance_boundary
        claim_type: conditional_action
        grounds: [entities.CARoom.fields.atmosphere_alarm]
        excluded_because:
          difficulty_instance: o2_excursion_exactly_at_tolerance_no_alarm
          rationale: "Strict-greater tolerance boundary asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # From Table 6 (Errors) — triggerability of codes not covered elsewhere
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: c_request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role / X-User-ID headers is rejected 401 before any other check."
        test_recipe:
          setup: ["grower G with lot L"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
          trigger:
            - { call: "GET /lots/${l1}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (401)"

      - name: c_select_release_empty_after_divert_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_RELEASABLE_ALLOCATIONS]", calculations.release_priority_score]
        distinguishing_aspect: "Empty-pool fallback of the selector: a room SEALED with fruit, emptied by a whole-lot diversion (stays SEALED), then OPENED with zero ACTIVE allocations — select-release rejects."
        test_recipe:
          setup: ["lot L allocated into room R; room SEALED; lot diverted (allocation released by cascade, room stays SEALED with 0 bins); room then OPENED"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /lots/${l1}/divert", payload: {}, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /ca-rooms/${r1}/select-release", payload: {}, as: StorageOperator, captures: { err: $.data.error_id } }
          assert:
            - "st == OPENED (opening an emptied room is allowed)"
            - "err == ERR_NO_RELEASABLE_ALLOCATIONS (409)"

  # ---------------------------------------------------------------------------
  # From Table 7 (RBAC)
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: c_peer_role_writes_forbidden
        claim_type: violation_to_error
        grounds: [roles.ReceivingClerk, roles.PackingSupervisor, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Peer roles cannot cross surfaces: ReceivingClerk creating a pool and PackingSupervisor creating an allocation both get 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["grower/block/lot and room R exist (created by their owning roles)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: ReceivingClerk, captures: { err1: $.data.error_id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: PackingSupervisor, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN (403)"
            - "err2 == ERR_FORBIDDEN (403)"

      - name: c_grower_scope_own_vs_other
        claim_type: violation_to_error
        grounds: [roles.Grower, "validations[priority=3]", "errors[ERR_GROWER_SCOPE_VIOLATION]"]
        distinguishing_aspect: "Grower identity is entity-backed: X-User-ID matching the lot's grower reads fine; a different grower id gets 403; list endpoints force-filter to the caller's own grower."
        test_recipe:
          setup: ["growers G1 (with lot L1) and G2 (no lots)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers", payload: { name: "Grower Two", grower_code: "G2" }, as: Admin, captures: { g2: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
          trigger:
            - { call: "GET /lots/${l1}", payload: {}, as: Grower, as_user_id: "${g1}", captures: { own: $.data.id } }
            - { call: "GET /lots/${l1}", payload: {}, as: Grower, as_user_id: "${g2}", captures: { err: $.data.error_id } }
            - { call: "GET /settlements?grower_id=${g1}", payload: {}, as: Grower, as_user_id: "${g2}", captures: { total: "$.total_count" } }
          assert:
            - "own == ${l1} (self read allowed)"
            - "err == ERR_GROWER_SCOPE_VIOLATION (403)"
            - "total == 0 (list force-filtered to caller's own grower G2, ignoring the foreign filter)"

  # ---------------------------------------------------------------------------
  # From Cross-Cutting Complexity Layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: c_version_required_missing_on_schedule_update
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[room-schedule-stale-version]", "errors[ERR_VERSION_REQUIRED]"]
        distinguishing_aspect: "OCC endpoints reject calls lacking the expected_<parent>_version field with 400 ERR_VERSION_REQUIRED (before any version comparison)."
        test_recipe:
          setup: ["room R exists"]
          setup_api_calls:
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
          trigger:
            - { call: "PUT /ca-rooms/${r1}/schedule", payload: { planned_open_date: "2026-12-01T00:00:00Z" }, as: StorageOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VERSION_REQUIRED (400)"

      - name: c_occ_stale_schedule_update_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[room-schedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A schedule update carrying version-1-behind is rejected 412; the same body with the current version succeeds and increments the room version."
        test_recipe:
          setup: ["room R exists at version 1 (captured at creation)"]
          setup_api_calls:
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id, r_v: $.data.version } }
          trigger:
            - { call: "PUT /ca-rooms/${r1}/schedule", payload: { expected_ca_room_version: "${r_v} - 1", planned_open_date: "2026-12-01T00:00:00Z" }, as: StorageOperator, captures: { err: $.data.error_id } }
            - { call: "PUT /ca-rooms/${r1}/schedule", payload: { expected_ca_room_version: "${r_v}", planned_open_date: "2026-12-01T00:00:00Z" }, as: StorageOperator, captures: { new_v: $.data.version, new_pod: $.data.planned_open_date } }
          assert:
            - "err == ERR_STALE_VERSION (412)"
            - "new_v == ${r_v} + 1 and new_pod == 2026-12-01T00:00:00Z"

      - name: c_occ_stale_pool_close_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[pool-close-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A sale between the client's read and its close attempt advances the pool version; the stale close is rejected 412 (OCC priority 7 beats the tier-11 empty check, proven when the fresh retry reaches ERR_POOL_EMPTY)."
        test_recipe:
          setup: ["pool P created (version captured), then one sale recorded (version advanced)"]
          setup_api_calls:
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id, p_v: $.data.version } }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 5, gross_revenue_cents: 10000, deduction_cents: 0 }, as: PoolManager }
          trigger:
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager, captures: { err1: $.data.error_id } }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v2: $.data.version } }
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v2}" }, as: PoolManager, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_STALE_VERSION (412)"
            - "err2 == ERR_POOL_EMPTY (409) — fresh version passes OCC, so the empty-pool constraint surfaces"

      - name: c_selector_highest_score_wins
        claim_type: selector_determinism
        grounds: [calculations.release_priority_score, "endpoints.POST /ca-rooms/{roomId}/select-release"]
        distinguishing_aspect: "The selector ranks by score: lot A (storage_life 10 -> must_release_by 2026-08-11, urgency 20, score 20.0) beats lot B (life 240 -> urgency 9, score 9.0) in the same OPENED room."
        test_recipe:
          setup: ["blocks BA (life 10) and BB (life 240); lots LA (5 bins) and LB (5 bins) allocated into room R; room sealed and opened at default clock"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "BA", variety: "GALA", storage_life_days: 10 }, as: ReceivingClerk, captures: { ba: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "BB", variety: "FUJI", storage_life_days: 240 }, as: ReceivingClerk, captures: { bb: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${ba}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { la: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${bb}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 78 }, as: ReceivingClerk, captures: { lb: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${la}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${lb}", bins: 5 }, as: StorageOperator, captures: { a2: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/select-release", payload: {}, as: StorageOperator, captures: { picked: $.data.id, reason: $.data.release_reason } }
            - { call: "GET /allocations/${a2}", payload: {}, as: Admin, captures: { a2_status: $.data.status } }
          assert:
            - "picked == ${a1} (score 20.0 beats 9.0)"
            - "reason == SELECTED"
            - "a2_status == ACTIVE (only the top-ranked allocation released)"

      - name: c_selector_tiebreak_earliest_created_wins
        claim_type: selector_determinism
        grounds: [calculations.release_priority_score, "endpoints.POST /ca-rooms/{roomId}/select-release"]
        distinguishing_aspect: "Identical scores (same block, same clock -> same must_release_by) fall to the tie-break: allocated_at ties, so created_at ASC picks the first-created allocation."
        test_recipe:
          setup: ["lots L1 and L2 from the same block (life 240), allocated in order A1 then A2 into room R; room sealed and opened (both scores 9.0)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 78 }, as: ReceivingClerk, captures: { l2: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 5 }, as: StorageOperator, captures: { a2: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/select-release", payload: {}, as: StorageOperator, captures: { picked: $.data.id } }
            - { call: "GET /allocations/${a2}", payload: {}, as: Admin, captures: { a2_status: $.data.status } }
          assert:
            - "picked == ${a1} (created_at ASC tie-break; id never consulted)"
            - "a2_status == ACTIVE"

      - name: c_stub_pool_close_cascade
        claim_type: cascade_chain
        grounds: [state_machines.Pool.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: pool_close_cascade_to_lot_closure
          rationale: "Depth-3 close cascade asserted by the named §1.8 instance."

      - name: c_stub_inspection_cascade
        claim_type: cascade_chain
        grounds: [calculations.disorder_index]
        excluded_because:
          difficulty_instance: inspection_priority_release_cascade
          rationale: "Depth-2 disorder cascade asserted by the named §1.8 instance."

      - name: c_stub_weight_invariant
        claim_type: compensating_invariant
        grounds: [calculations.weight_balance]
        excluded_because:
          difficulty_instance: run_complete_void_weight_balance_restored
          rationale: "Complete+void weight conservation asserted by the named §1.8 instance."

      - name: c_stub_bins_invariant
        claim_type: compensating_invariant
        grounds: [calculations.room_bins]
        excluded_because:
          difficulty_instance: allocate_release_bins_free_restored
          rationale: "Allocate+release bin conservation asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # From Consistency Model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: c_immediate_consistency_on_complete
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "endpoints.POST /packing-runs/{runId}/complete"]
        distinguishing_aspect: "All mutations are visible in the same request's response and in the immediately following read: the complete response itself is COMPLETED with packout_pct 85.0, and the very next GET of the lot shows balance 15000 and actual_packout_pct 85.0."
        test_recipe:
          setup: ["released lot L (19000 lbs); spec; pool; run SCHEDULED for input 4000"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 4000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 20, packed_weight_lbs: 3400, cull_weight_lbs: 400, juice_weight_lbs: 200 }, as: PackingSupervisor, captures: { st: $.data.status, pk: $.data.packout_pct } }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin, captures: { bal: $.data.weight_balance_lbs, ap: $.data.actual_packout_pct } }
          assert:
            - "st == COMPLETED and pk == 85.0 (same-response visibility)"
            - "bal == 15000 and ap == 85.0 (immediately consistent follow-up read)"
