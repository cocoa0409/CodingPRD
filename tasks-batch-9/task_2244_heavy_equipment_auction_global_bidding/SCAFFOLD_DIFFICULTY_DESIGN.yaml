              as: Bidder
              as_user_id: "${bidder_us_id}"
            - call: "POST /lots/${lot1_id}/hammer"
              payload: {}
              as: AuctionOperator
              captures: { sale1_id: "$.data.id" }
            - call: "GET /invoices"
              payload: { sale_id: "${sale1_id}" }
              as: SettlementOfficer
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /payments"
              payload: { invoice_id: "${inv1_id}", amount_cents: 12498438, method: "WIRE", currency_code: "USD" }
