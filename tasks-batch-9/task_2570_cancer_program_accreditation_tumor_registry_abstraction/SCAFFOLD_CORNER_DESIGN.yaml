  # =========================================================================
  # Guide section 2 - From Table 2 (State Machines)  [10 machines, shape: cyclic]
  # =========================================================================
  - section: state_machines
    instances:

      - name: session_hold_records_case_counts_and_computes_prospective_ratio
        claim_type: Valid Transition
        grounds:
          - state_machines[ConferenceSession].SCHEDULED->HELD
          - calculations.conference_quorum
          - endpoints[POST /cancer-registry/conference-sessions/{sessionId}/hold]
        distinguishing_aspect: |
          hold is the only transition that turns posted counts into derived state: 8 prospective
          of 10 presented must store prospective_case_ratio 0.800 and flip quorum_met true once
          all three required disciplines have 45 qualifying minutes each.
        test_recipe:
          setup:
            - "One program with a session on 2026-07-15 13:00-14:30Z (already past the 2026-08-01 clock) and one 45-minute attendance per required discipline."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-07-15T13:00:00Z", end_at: "2026-07-15T14:30:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "RADIATION_ONCOLOGY"] }
              as: AccreditationCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-SURG-1", discipline: "SURGERY", attended_minutes: 45, is_required_coordinator: true }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-MEDONC-1", discipline: "MEDICAL_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-RADONC-1", discipline: "RADIATION_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
          trigger:
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/hold"
              payload: { cases_presented_count: 10, prospective_case_count: 8 }
              as: AccreditationCoordinator
          assert:
            - "HTTP 200 and data.session_state == HELD"
            - "data.cases_presented_count == 10 and data.prospective_case_count == 8"
            - "data.prospective_case_ratio == 0.8 (0.800 at 3-decimal precision, >= PROSPECTIVE_MIN_RATIO 0.80)"
            - "data.quorum_met == true and data.credited_on == null"
            - "CancerProgram.${prog_id}.credited_sessions_12mo is still 0 - hold does not credit"

      - name: audit_initial_state_is_open_with_zeroed_discrepancy_counts
        claim_type: Initial State
        grounds:
          - state_machines[QaAudit].initial_state
          - entities.QaAudit
          - endpoints[POST /cancer-registry/qa-audits]
        distinguishing_aspect: |
          A freshly opened audit must read audit_state OPEN with verdict null, weighted_error_score
          0 and cascade_applied false, and it must not have touched the audited abstractor's
          lifetime_discrepancy_points yet.
        test_recipe:
          setup:
            - "One program, an author abstractor and a QA reviewer; one abstraction APPROVED through QA (so it is auditable)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
