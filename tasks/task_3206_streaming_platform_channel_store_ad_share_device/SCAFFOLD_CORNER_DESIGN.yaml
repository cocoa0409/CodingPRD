              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /device-models/${m3}/lab-bookings"
              payload: { bench_code: "B3", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T17:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
          trigger:
            - call: "POST /device-models/${m4}/lab-bookings"
