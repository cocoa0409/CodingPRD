        source: input
        description: "Whether the plan covers the full season or a partial subset of games."
        constraints: "one of {FULL, PARTIAL}"
      - name: game_count
        type: integer
        source: input
        description: "Number of games included in this plan."
        constraints: ">= 1"
      - name: price_multiplier_bps
        type: integer
        source: input
        description: "Basis points applied to a section's base_price_cents for this plan (10000 = 100%). FULL plans are 10000; PARTIAL plans are < 10000."
        constraints: ">= 0 and <= 10000"
      - name: includes_playoffs
        type: boolean
        source: input
        description: "Whether the plan grants playoff seating; drives the playoff priority-points accrual variant."
        default: false

