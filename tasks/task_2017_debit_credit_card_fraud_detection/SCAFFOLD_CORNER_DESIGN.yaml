            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudAnalyst, as_user_id: "analyst-2", captures: { err: "$.data.error_id" } }
          assert:
            - "403 ERR_FORBIDDEN_ROLE (note: NOT ERR_SEGREGATION_OF_DUTIES — the caller lacks the role entirely)"
      - name: cardholder_cannot_block_card
        claim_type: role_exclusive_denied
        grounds:
          - roles[Cardholder]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Block/unblock is staff-only; a Cardholder is denied even for a card on their own account (role check precedes ownership)."
        test_recipe:
          setup: ["Account with card"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-RB2", cardholder_name: "Rb Two", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-RB2", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "SOFT", reason: "CUSTOMER_REQUEST" }, as: Cardholder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
          assert:
            - "403 ERR_FORBIDDEN_ROLE; card remains ACTIVE"
      - name: gateway_cannot_read_accounts
        claim_type: role_exclusive_denied
        grounds:
          - roles[NetworkGateway]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "NetworkGateway is write-only for intake: even a harmless list read is denied (least privilege)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fraudops/accounts", as: NetworkGateway, captures: { err: "$.data.error_id" } }
          assert:
            - "403 ERR_FORBIDDEN_ROLE"
      - name: loss_accountant_cannot_file_recovery
        claim_type: role_exclusive_denied
        grounds:
          - roles[LossAccountant]
          - roles[RecoverySpecialist]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Role-level segregation (distinct from the user-level booker/filer rule): LossAccountant is denied on the filing endpoint outright — the role check fires before the referenced loss is even looked up."
        test_recipe:
          setup: ["Empty DB (the referenced loss id need not exist: role check at priority 2 precedes existence at priority 3/5)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fraudops/recovery-filings", payload: { loss_entry_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", network_reference: "NR-RB4", claimed_cents: 100 }, as: LossAccountant, captures: { err: "$.data.error_id" } }
          assert:
            - "403 ERR_FORBIDDEN_ROLE (not 404 — role check precedes existence)"

  - section: complexity_layers
    instances:
      - name: ruleset_update_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ruleset-update-stale-version]
          - errors[ERR_STALE_VERSION]
          - endpoints["PUT /fraudops/rule-sets/{id}"]
        distinguishing_aspect: "OCC on RuleSet.version: an update carrying the pre-update version (1) after a successful update (version now 2) is rejected 412; the loser's intended change is not applied."
        test_recipe:
          setup: ["DRAFT ruleset created by analyst-1 (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id", rs_v: "$.data.version" } }
          trigger:
            - { call: "PUT /fraudops/rule-sets/${rs}", payload: { expected_ruleset_version: "${rs_v}", decline_threshold: 90 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { v_after: "$.data.version" } }
            - { call: "PUT /fraudops/rule-sets/${rs}", payload: { expected_ruleset_version: "${rs_v}", decline_threshold: 85 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /fraudops/rule-sets/${rs}", as: FraudOpsManager }
          assert:
            - "first PUT succeeds: version 1 -> 2, decline_threshold == 90"
            - "second PUT with the same captured version (1) is rejected: HTTP 412 ERR_STALE_VERSION"
            - "RuleSet.${rs}.decline_threshold == 90 (the stale update left no residue) and version == 2"
      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: compromised_event_confirm_depth4_cascade
          rationale: "The depth-4 compromise-confirm cascade (and the recovery-PAID cascade) are asserted end-to-end by the two §1.8 transitive_cascade instances."
      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: decline_threshold_equality
          rationale: "Threshold boundary behavior (inclusive >= at both review and decline, plus the amount-tier step) is asserted by §1.8 boundary_precision_check and combinatorial_formula instances."
      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: shadow_rescore_under_superseding_ruleset
          rationale: "All three dual-variant pairs (shadow scoring, loss provisional/final, fp-rate bases) are asserted by the §1.8 dual_variant_calc instances."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.account_credit_balance
        distinguishing_aspect: "Immediate consistency: the resolve response itself shows RESOLVED_FRAUD, and a follow-up GET of the account in the same request chain already reflects the fraud credit — no eventual lag."
        test_recipe:
          setup: ["Account/card; manual alert claimed with a COMPLETED CONFIRMED_FRAUD contact"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CM1", cardholder_name: "Cm One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CM1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { al: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { vc: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${vc}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD", fraud_credit_cents: 5000 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { st: "$.data.alert_status" } }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager, captures: { bal: "$.data.credit_balance_cents" } }
          assert:
            - "resolve response: alert_status == RESOLVED_FRAUD in the same response body"
            - "immediate GET: Account.${acct}.credit_balance_cents == 5000 (fraud credit visible at once)"
