      - name: fifo_ties_on_vintage_are_broken_by_creation_order
        claim_type: chronological
        grounds:
          - calculations.fifo_expenditure_vintage_consumption
          - state_machines.FundLedgerEntry.OPEN_to_PARTIALLY_EXPENDED
          - endpoints[POST /facility-categories/{id}/expenditures]
        distinguishing_aspect: |
          Two PARKS collections are booked at the SAME logical instant, so vintage_at cannot
          order them and the declared created_at ASC tie-break decides. BP-1002 is paid
          first, so its 2617930 row must be consumed whole and BP-1001's row must be the one
          left PARTIALLY_EXPENDED at 2235860. An implementation that ties-breaks by entry id,
          by application id or by amount picks the wrong row to leave open, which is
          observable per-row even though the category total is identical either way.
        test_recipe:
          setup:
            - "HARBOR program with an EFFECTIVE study; BP-1001 and BP-1002 both assessed at net 5189521."
            - "The clock is set to 2026-05-10T00:00:00Z and BP-1002 is paid BEFORE BP-1001, so the PARKS fund holds two 2617930 COLLECTION rows with identical vintage_at 2026-05-10T00:00:00Z, BP-1002's created first."
            - "PARKS fund_balance_cents 5235860 and the category version is re-read for the OCC guard."
