              as: ProductionPlanner
              captures: { err_dress_expired: $.data.error_id }
          assert:
            - "after run1 completes: GrindingWheel status == DRESSING, consumed_life_units == 860, remaining_life_units == 140, dress_count == 0"
            - "after dress cycle 1: status == AVAILABLE, dress_count == 1, consumed_life_units == 0, remaining_life_units == 1000"
            - "after dress cycle 2: dress_count == 2 and remaining_life_units == 1000; after dress cycle 3: dress_count == 3 and remaining_life_units == 1000"
            - "after run4 completes the wheel is DRESSING again with consumed_life_units == 860"
            - "the fourth dress call takes the EXPIRED branch: status == EXPIRED, dress_count == 4, and consumed_life_units stays 860 (the reset is NOT applied on this branch)"
            - "${err_expired} == ERR_WHEEL_EXPIRED"
            - "${err_dress_expired} == ERR_INVALID_WHEEL_STATE (EXPIRED is terminal)"

      - name: batch_quarantine_parallel_dimensions
        claim_type: parallel_state_dimensions
        grounds: [state_machines.PowderBlendBatch, entities.PowderBlendBatch.fields.qc_status]
        excluded_because:
          difficulty_instance: batch_parallel_stage_and_qc_dimensions
          rationale: "The parallel (stage x qc_status) dimension independence, the trial invalidation cascade and the dossier demotion are all asserted by the non_linear_state_machine difficulty instance; repeating them here would duplicate the same transitions."

      - name: order_cycles_back_into_engineering_review
        claim_type: cyclic_loop
        grounds: [state_machines.ToolOrder]
        excluded_because:
          difficulty_instance: order_confirmed_returns_to_engineering_review_cycle
          rationale: "The CONFIRMED -> ENGINEERING_REVIEW -> CONFIRMED backward edge, driven by a supply-status change on the product, is the entire subject of that difficulty instance."

      - name: grade_revision_cascade_down_the_graph
        claim_type: cascade_down
        grounds: [state_machines.CarbideGrade, calculations.engineering_lead_time_days]
        excluded_because:
          difficulty_instance: grade_revision_four_hop_cascade
          rationale: "The grade -> product -> lead time -> order cascade with its four hops is covered end-to-end by the transitive_cascade difficulty instance, including the intermediate states this claim would inspect."

      - name: wheel_life_compensation_on_void
        claim_type: compensation
        grounds: [state_machines.GrindingRun, calculations.wheel_life_consumption]
        excluded_because:
          difficulty_instance: wheel_life_conserved_across_complete_and_void
          rationale: "Reversal of the COMPLETED -> VOIDED side effects with zero drift in consumed + remaining life is the conserved quantity proved by that compensating_invariant instance."

  # ===========================================================================
  - section: calculations
    instances:

      - name: sinter_hardness_window_is_symmetric_around_the_grade_target
        claim_type: constants_applied
        grounds:
          - calculations.sinter_qc_evaluation
          - calculations.sinter_qc_evaluation.constants.HARDNESS_TOLERANCE_HV
        distinguishing_aspect: "The hardness gate is |measured - grade.hardness_hv| <= 75 evaluated against the grade's own target, so with target 1600 a reading of 1525 passes and 1524 fails even though both batches share an identical 90.00% yield and an identical density."
        test_recipe:
          setup:
            - "Grade WC-P25 with hardness_hv 1600 and two pressed batches of 200 units each"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-A", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_a: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_a}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-B", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_b: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_b}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
          trigger:
            - call: "POST /tooling/powder-blend-batches/${batch_a}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.50, measured_hardness_hv: 1525 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_b}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.50, measured_hardness_hv: 1524 }
              as: MetallurgyEngineer
          assert:
            - "PowderBlendBatch.${batch_a}.yield_pct == 90.00 and qc_status == PASSED"
            - "PowderBlendBatch.${batch_b}.yield_pct == 90.00 and qc_status == FAILED"
            - "PowderBlendBatch.${batch_b}.qc_failure_reasons contains HARDNESS_OUT_OF_WINDOW and does not contain LOW_DENSITY or LOW_YIELD"
            - "both batches reach stage SINTERED and remaining_units == 180"

      - name: recipe_validation_state_resets_when_the_layer_stack_is_revised
        claim_type: correct_result
        grounds:
          - calculations.coating_validation_state
          - endpoints[POST /tooling/coating-recipes/{recipeId}/revise]
          - entities.CoatingRecipe.fields.is_validated
        distinguishing_aspect: "The validation pool is filtered by pinned_recipe_revision == recipe.revision, so a revise to revision 2 empties the pool: total_thickness_um is recomputed to 3.50, is_validated flips back to false and adhesion_class returns to null even though a COMPLETED, hf-class-2 run still exists against revision 1."
        test_recipe:
          setup:
            - "Recipe PVD-TIALN-3 at revision 1 with one COMPLETED run at adhesion_hf_class 2 and measured thickness 3.10 um"
            - "Logical clock at 2026-08-05T12:00:00Z so the run's window has elapsed"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [{ material: "TiAlN", thickness_um: 3.0 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T12:00:00Z", loaded_area_cm2: 2500.00 }
              as: CoatingEngineer
              captures: { run_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-runs/${run_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
          trigger:
            - call: "POST /tooling/coating-recipes/${recipe_id}/revise"
              payload: { layers: [{ material: "TiN", thickness_um: 0.5 }, { material: "TiAlN", thickness_um: 3.0 }], revision_note: "Add a TiN bonding layer" }
              as: CoatingEngineer
          assert:
            - "before the revise: CoatingRecipe.${recipe_id}.is_validated == true, adhesion_class == 2, total_thickness_um == 3.00"
            - "after the revise: CoatingRecipe.${recipe_id}.revision == 2 and total_thickness_um == 3.50 and layer_count == 2"
            - "after the revise: CoatingRecipe.${recipe_id}.is_validated == false and adhesion_class == null"
            - "CoatingRun.${run_id}.status is still COMPLETED with pinned_recipe_revision == 1"

