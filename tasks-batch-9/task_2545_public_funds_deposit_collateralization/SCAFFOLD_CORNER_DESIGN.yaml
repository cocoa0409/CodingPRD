              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /deposit-accounts/${acct_1}/deposits"
              payload: { amount_cents: 100000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
          assert:
            - "AFTER FUNDING acct_2 ONLY: acct_2 (group_sequence 2) has insured_amount_cents == 10000000, uninsured_amount_cents == 0, required_collateral_cents == 0, coverage_ratio_bps == 10000; acct_1 (group_sequence 1, balance 0) has insured 0 and consumes nothing"
            - "AFTER FUNDING acct_1: acct_1 has insured_amount_cents == 25000000 (the whole bucket, taken first because group_sequence 1 sorts first) and required_collateral_cents == 78750000"
            - "AFTER FUNDING acct_1: acct_2 is RETROACTIVELY re-derived to insured_amount_cents == 0, uninsured_amount_cents == 10000000, required_collateral_cents == 10500000 == round_half_up(10000000*10500/10000) — a deposit into a sibling account changed THIS account's requirement"
            - "acct_2.version incremented as a side effect of the acct_1 deposit (it was rewritten, not merely re-read)"
            - "Invariant on both accounts: insured_amount_cents + uninsured_amount_cents == ledger_balance_cents"
            - "Depository.${dep_id}.total_required_collateral_cents == 89250000 == 78750000 + 10500000; PublicUnit.${unit_id}.total_deposit_balance_cents == 110000000 and total_uninsured_cents == 85000000"
            - "Ordering is by group_sequence, never by id or created_at: the funding chronology (acct_2 first) is irrelevant to the outcome"

