          With reviewer_member_id omitted the selector ranks candidates by the
          Dice coefficient over de-duplicated keyword sets: Mei's
          [oncology, immunotherapy, genomics] against the abstract's
          [oncology, immunotherapy] scores 2*2/(3+2) = 0.8000 while Rui's
          [oncology, imaging] scores 2*1/(2+2) = 0.5000, so Mei is chosen and
          her score is persisted to 4 decimal places. Spare capacity and
          created_at are never consulted because the top score is unique.
