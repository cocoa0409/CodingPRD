scenario: |
  735. Handmade & Made-to-Order Marketplace (Etsy seller side): shop &
  listing/variation, made-to-order vs ready-to-ship & processing time, order &
  personalization note, materials/inventory & restock, shipping profile & label,
  review & dispute/case, fee (listing/transaction) & payout, vacation mode
domain_name: handmade-marketplace
api_prefix: /seller

complexity_profile:
  primary_archetype: event_sourcing            # order/payout ledger derived by replaying lifecycle events; refunds retroactively correct payout net
  secondary_archetype: pricing_engine          # fee/shipping/payout computation with tiers, rounding, dual variants
  complexity_layers:
    - optimistic_concurrency                   # OCC on Shop.version for payout create-with-supersede
    - cascading_side_effects                   # order pay -> material decrement -> stock-out -> dependent listings SOLD_OUT
    - dual_variant_calculation                 # payout estimated-vs-settled net; shop simple-vs-Bayesian rating
    - rate_threshold_triggers                  # free-shipping threshold; material reorder/out-of-stock boundaries

  entity_topology: flat
  # Peer entities linked by foreign keys; no ownership nesting in URL paths. All
  # collections are mounted one level under the /seller prefix (e.g. /seller/listings,
  # /seller/orders) and cross-reference each other by FK fields carried in the body.

  state_machine_shape: parallel
  # Order carries two independent axes (payment_status x fulfillment_status); Shop
  # and Listing carry cyclic status axes (ACTIVE<->VACATION, ACTIVE<->SOLD_OUT);
  # Case is branching (respond -> {resolve | escalate} -> divergent side effects).

  relationship_patterns:
    - one_to_many            # Shop -> Listing/Order/Material/ShippingProfile/VacationPeriod/Payout
    - cross_aggregate        # Listing -> ShippingProfile, Listing -> Material, Order -> Payout
    - polymorphic            # Order.variation_id points into a Listing.variations[] member (soft ref, not an entity FK)

  role_model: peer_roles
  # Seller owns shop-scoped resources; Buyer owns order/review/case actions; PlatformAdmin
  # is an operational superset for onboarding, suspension, escalated-case resolution and payouts.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - name: owner_seller_id
        type: string
        source: input
        description: "Opaque seller-account identifier that provisioned this shop. Stored for audit; NOT an entity FK. The shop's own id is the Seller role identity."
      - name: name
        type: string
        source: input
        description: "Shop display name."
        constraints: "non-empty, <= 120 chars"
      - name: currency
        type: enum
        source: input
        description: "Ledger currency."
        default: "USD"
        constraints: "one of {USD, EUR, GBP}"
      - name: status
        type: enum
        source: system
        description: "Shop lifecycle status."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, VACATION, SUSPENDED, CLOSED}"
      - name: max_concurrent_production
        type: integer
        source: input
        description: "Aggregate made-to-order capacity: max number of orders whose production window [paid_at, ship_by_date] may overlap at once."
        default: 3
        constraints: ">= 1"
      - name: announcement
        type: string
        source: input
        description: "Optional shop announcement banner."
        default: null
      - name: vacation_auto_reply
        type: string
        source: input
        description: "Message shown to buyers while status == VACATION."
        default: null
      - name: published_review_count
        type: integer
        source: computed
        description: "Count of Reviews on this shop with status == PUBLISHED. Recomputed on review publish/hide."
        default: 0
      - name: simple_avg_rating
        type: number
        source: computed
        description: "Variant A rating: arithmetic mean of PUBLISHED review ratings, 2 dp round_half_up; null when published_review_count == 0."
        default: null
      - name: weighted_shop_rating
        type: number
        source: computed
        description: "Variant B rating: Bayesian-damped mean (prior count 5 at prior mean 4.0), 2 dp round_half_up; null when published_review_count == 0."
        default: null
      - name: available_balance_cents
        type: integer
        source: computed
        description: "Cleared funds not yet paid out: sum of order_net_cents for COMPLETED orders with payout_id == null, minus refunds. Money-conservation quantity for Rule 9."
        default: 0
      - name: pending_balance_cents
        type: integer
        source: computed
        description: "Funds from PAID-but-not-COMPLETED orders (in flight). Excluded from payouts until the order completes."
        default: 0
      - name: lifetime_gross_cents
        type: integer
        source: computed
        description: "Running sum of order_total_cents for all orders that reached PAID (never decremented by refunds; refunds tracked separately)."
        default: 0
      - name: lifetime_fees_cents
        type: integer
        source: computed
        description: "Running sum of order_fee_cents charged across all payouts."
        default: 0

  - name: ShippingProfile
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; owning shop."
      - name: name
        type: string
        source: input
        description: "Profile label (e.g. 'US Standard')."
      - name: origin_country
        type: string
        source: input
        description: "ISO country code the parcel ships from."
        default: "US"
      - name: base_cost_cents
        type: integer
        source: input
        description: "Flat shipping cost for the first item, in cents."
        constraints: ">= 0"
      - name: per_item_cost_cents
        type: integer
        source: input
        description: "Incremental shipping cost per additional item beyond the first, in cents."
        constraints: ">= 0"
      - name: free_shipping_threshold_cents
        type: integer
        source: input
        description: "If > 0 and order item_subtotal_cents >= this value, shipping is 0. Value 0 disables free shipping."
        default: 0
        constraints: ">= 0"
      - name: processing_time_days
        type: integer
        source: input
        description: "Default handling days contributed to a listing's ship-by computation when the listing does not override."
        default: 1
        constraints: ">= 0"

  - name: Material
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; owning shop."
      - name: name
        type: string
        source: input
        description: "Material name (e.g. 'Walnut blank')."
      - name: unit
        type: string
        source: input
        description: "Stock unit label (e.g. 'piece', 'gram')."
        default: "piece"
      - name: stock_qty
        type: integer
        source: system
        description: "On-hand quantity. Decremented when a made-to-order order that consumes this material is PAID; restored on order cancel; increased by restock. Conserved quantity for Rule 9."
        constraints: ">= 0"
      - name: reorder_threshold
        type: integer
        source: input
        description: "At or below this on-hand level the material is LOW_STOCK."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Derived stock posture. IN_STOCK when stock_qty > reorder_threshold; LOW_STOCK when 0 < stock_qty <= reorder_threshold; OUT_OF_STOCK when stock_qty == 0."
        default: "IN_STOCK"
        constraints: "one of {IN_STOCK, LOW_STOCK, OUT_OF_STOCK}"

  - name: Listing
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; owning shop."
      - name: shipping_profile_id
        type: string
        source: input
        description: "FK -> ShippingProfile.id; profile used to price shipping and derive handling days."
      - name: primary_material_id
        type: string
        source: input
        description: "FK -> Material.id; the material consumed per unit for made-to-order fulfillment. Null for ready-to-ship listings that track no material."
        default: null
      - name: material_qty_per_unit
        type: integer
        source: input
        description: "Units of primary_material_id consumed per ordered unit (ignored when primary_material_id is null)."
        default: 0
        constraints: ">= 0"
      - name: title
        type: string
        source: input
        description: "Listing title."
      - name: fulfillment_type
        type: enum
        source: input
        description: "READY_TO_SHIP draws down listing.quantity; MADE_TO_ORDER produces on demand and consumes material."
        constraints: "one of {READY_TO_SHIP, MADE_TO_ORDER}"
      - name: processing_time_days
        type: integer
        source: input
        description: "Handling days from paid to ship-by. For MADE_TO_ORDER this is the production lead time; for READY_TO_SHIP typically 0-1."
        constraints: ">= 0"
      - name: price_cents
        type: integer
        source: input
        description: "Base unit price in cents (before variation delta)."
        constraints: ">= 1"
      - name: quantity
        type: integer
        source: system
        description: "On-hand sellable units for READY_TO_SHIP; decremented on order PAID, restored on cancel. Ignored (treated as unbounded) for MADE_TO_ORDER."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Listing lifecycle status."
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, INACTIVE, SOLD_OUT, REMOVED}"
      - name: personalization_enabled
        type: boolean
        source: input
        description: "Whether buyers may attach a personalization note."
        default: false
      - name: personalization_required
        type: boolean
        source: input
        description: "Whether a non-empty personalization note is mandatory at order time (only meaningful when personalization_enabled)."
        default: false
      - name: personalization_char_limit
        type: integer
        source: input
        description: "Max length of an order personalization_note against this listing."
        default: 256
        constraints: ">= 1, <= 1024"
      - name: variations
        type: array
        source: input
        description: "Array of variation objects {key, label, price_delta_cents, stock_qty}. Order.variation_id references a member's key (soft polymorphic ref, not an entity FK)."
        default: []
      - name: expires_at
        type: datetime
        source: input
        description: "Optional listing expiry timestamp; informational only in this version."
        default: null

  - name: VacationPeriod
    parent: Shop
    common_fields: false
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; shop this scheduled vacation window belongs to."
      - name: starts_at
        type: datetime
        source: input
        description: "Window start (inclusive). Half-open interval [starts_at, ends_at)."
      - name: ends_at
        type: datetime
        source: input
        description: "Window end (exclusive)."
        constraints: "ends_at > starts_at"
      - name: status
        type: enum
        source: system
        description: "All persisted vacation windows are SCHEDULED and participate in overlap checks (windows are not cancellable in this version)."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED}"
      - name: message
        type: string
        source: input
        description: "Optional auto-reply message applied while this window is active."
        default: null

  - name: Order
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; shop fulfilling the order."
      - name: listing_id
        type: string
        source: input
        description: "FK -> Listing.id; purchased listing."
      - name: variation_id
        type: string
        source: input
        description: "Soft ref to a Listing.variations[].key member; null when the listing has no variations. Not an entity FK."
        default: null
      - name: payout_id
        type: string
        source: system
        description: "FK -> Payout.id; set when this order is swept into a payout, else null."
        default: null
      - name: buyer_id
        type: string
        source: system
        description: "Opaque Buyer identity (X-User-ID of the placing buyer). Ownership of pay/review/case actions compares against this value; not an entity FK."
      - name: quantity
        type: integer
        source: input
        description: "Ordered unit count."
        constraints: ">= 1"
      - name: personalization_note
        type: string
        source: input
        description: "Buyer personalization text; required when the listing's personalization_required is true; length <= listing.personalization_char_limit."
        default: null
      - name: item_subtotal_cents
        type: integer
        source: computed
        description: "(listing.price_cents + variation price_delta_cents) * quantity. Computed at order creation."
        default: 0
      - name: shipping_cents
        type: integer
        source: computed
        description: "Shipping charge from the listing's ShippingProfile (see order_shipping_cost calc). Computed at order creation."
        default: 0
      - name: order_total_cents
        type: integer
        source: computed
        description: "item_subtotal_cents + shipping_cents. Computed at order creation."
        default: 0
      - name: order_fee_cents
        type: integer
        source: computed
        description: "Platform fees for this order (listing + transaction + payment processing); see order_fees calc. Computed at PAID."
        default: 0
      - name: order_net_cents
        type: integer
        source: computed
        description: "order_total_cents - order_fee_cents. Computed at PAID; the per-order contribution to payout net."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Amount refunded to the buyer via cancel or a RESOLVED_REFUND case."
        default: 0
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis (independent of fulfillment_status)."
        default: "UNPAID"
        constraints: "one of {UNPAID, PAID, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment axis (independent of payment_status)."
        default: "NOT_STARTED"
        constraints: "one of {NOT_STARTED, IN_PRODUCTION, SHIPPED, DELIVERED, COMPLETED, CANCELLED}"
      - name: has_open_case
        type: boolean
        source: computed
        description: "True while a Case on this order is in {OPEN, SELLER_RESPONDED, ESCALATED}. Gates payout mark-paid and drives payout ON_HOLD."
        default: false
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock time the order became PAID; null before payment."
        default: null
      - name: ship_by_date
        type: datetime
        source: computed
        description: "paid_at + effective processing days (listing.processing_time_days, falling back to the ShippingProfile's processing_time_days when the listing's is 0). Computed at PAID."
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock time of ship."
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: "Reason captured on cancel."
        default: null

  - name: Review
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the reviewed order. Must be COMPLETED and reviewed at most once."
      - name: listing_id
        type: string
        source: system
        description: "Denormalized listing reference copied from the order at creation. Not an independently validated FK (mirrors order.listing_id)."
        default: null
      - name: shop_id
        type: string
        source: system
        description: "Denormalized shop reference copied from the order at creation. Not an independently validated FK (mirrors order.shop_id)."
        default: null
      - name: buyer_id
        type: string
        source: system
        description: "Opaque Buyer identity of the reviewer (must equal the order's buyer_id)."
      - name: rating
        type: integer
        source: input
        description: "Star rating."
        constraints: "integer 1..5 inclusive"
      - name: body
        type: string
        source: input
        description: "Free-text review body."
        default: null
      - name: seller_response
        type: string
        source: system
        description: "Optional public seller reply."
        default: null
      - name: status
        type: enum
        source: system
        description: "PUBLISHED reviews count toward shop rating; HIDDEN reviews do not."
        default: "PUBLISHED"
        constraints: "one of {PUBLISHED, HIDDEN}"

  - name: Case
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the disputed order. Must be PAID."
      - name: opener_buyer_id
        type: string
        source: system
        description: "Opaque Buyer identity that opened the case (must equal the order's buyer_id)."
      - name: type
        type: enum
        source: input
        description: "Dispute reason category."
        constraints: "one of {NON_DELIVERY, NOT_AS_DESCRIBED}"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle status (branching resolution)."
        default: "OPEN"
        constraints: "one of {OPEN, SELLER_RESPONDED, ESCALATED, RESOLVED_REFUND, RESOLVED_NO_REFUND}"
      - name: reason
        type: string
        source: input
        description: "Buyer's description of the problem."
        default: null
      - name: resolution
        type: string
        source: system
        description: "Free-text resolution note recorded at resolve."
        default: null
      - name: refund_amount_cents
        type: integer
        source: system
        description: "Amount refunded when resolved RESOLVED_REFUND (0 otherwise)."
        default: 0

  - name: Payout
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; shop being paid."
      - name: status
        type: enum
        source: system
        description: "Payout lifecycle status."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, ON_HOLD, PAID}"
      - name: order_count
        type: integer
        source: computed
        description: "Number of orders swept into this payout at creation."
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of order_total_cents over swept orders."
        default: 0
      - name: fees_cents
        type: integer
        source: computed
        description: "Sum of per-order order_fee_cents over swept orders (round-per-order-then-sum; see order_fees calc)."
        default: 0
      - name: estimated_net_cents
        type: integer
        source: computed
        description: "Variant A (forward-looking): net over ALL swept orders including those with an open case; computed at payout creation."
        default: 0
      - name: settled_net_cents
        type: integer
        source: computed
        description: "Variant B (chronological/final): net recomputed at mark-paid, processing swept orders by created_at ASC, EXCLUDING orders whose case is unresolved and SUBTRACTING refunds from resolved-refund cases."
        default: null
      - name: net_cents
        type: integer
        source: computed
        description: "Working net: equals estimated_net_cents until PAID, then equals settled_net_cents."
        default: 0
      - name: scheduled_at
        type: datetime
        source: system
        description: "Logical-clock time the payout was created/scheduled."
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock time the payout reached PAID."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Shop
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: VACATION
        trigger: "POST /seller/shops/{id}/enable-vacation"
        actor: Seller
        preconditions: ["shop.status == ACTIVE", "acting Seller owns the shop (X-User-ID == shop.id)"]
        side_effects: ["vacation_auto_reply set from request if provided", "increments Shop.version by 1"]
        note: "Buyers cannot place orders while VACATION (see Order create preconditions). Cyclic with return-from-vacation."
      - from: VACATION
        to: ACTIVE
        trigger: "POST /seller/shops/{id}/return-from-vacation"
        actor: Seller
        preconditions: ["shop.status == VACATION", "acting Seller owns the shop"]
        side_effects: ["increments Shop.version by 1"]
        note: "Completes the ACTIVE<->VACATION cycle (non-linear shape for Rule 3)."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /seller/shops/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["shop.status IN {ACTIVE, VACATION}"]
        side_effects: ["all this shop's Listings in {ACTIVE, SOLD_OUT} transition to INACTIVE (cascade down, conditional on non-terminal)", "increments Shop.version by 1"]
      - from: VACATION
        to: SUSPENDED
        trigger: "POST /seller/shops/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["shop.status IN {ACTIVE, VACATION}"]
        side_effects: ["all this shop's Listings in {ACTIVE, SOLD_OUT} transition to INACTIVE", "increments Shop.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /seller/shops/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: ["shop.status == SUSPENDED"]
        side_effects: ["increments Shop.version by 1"]
        note: "Listings are NOT auto-reactivated; the seller must re-publish."
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /seller/shops/{id}/suspend with close=true"
        actor: PlatformAdmin
        preconditions: ["shop.status IN {ACTIVE, VACATION, SUSPENDED}", "request body close == true"]
        side_effects: ["status->CLOSED (terminal)", "increments Shop.version by 1"]
        note: "The suspend endpoint with close=true drives CLOSED; from ACTIVE/VACATION it first (same call) records CLOSED directly."

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [REMOVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /seller/listings/{id}/publish"
        actor: Seller
        preconditions:
          - "listing.status == DRAFT"
          - "owning Shop.status IN {ACTIVE, VACATION} (cross-entity: cannot publish under a SUSPENDED/CLOSED shop)"
          - "if fulfillment_type == READY_TO_SHIP then quantity >= 1"
        side_effects: ["listing becomes purchasable", "increments Listing.version by 1"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /seller/listings/{id}/deactivate"
        actor: Seller
        preconditions: ["listing.status == ACTIVE"]
        side_effects: ["increments Listing.version by 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /seller/listings/{id}/publish"
        actor: Seller
        preconditions: ["listing.status == INACTIVE", "owning Shop.status IN {ACTIVE, VACATION}", "if READY_TO_SHIP then quantity >= 1"]
        side_effects: ["increments Listing.version by 1"]
        note: "Reactivation reuses the publish trigger; ACTIVE<->INACTIVE forms a cycle."
      - from: ACTIVE
        to: SOLD_OUT
        trigger: "system: on order PAID, READY_TO_SHIP quantity reaches 0 OR MADE_TO_ORDER primary material reaches OUT_OF_STOCK"
        actor: system
        preconditions: ["listing.status == ACTIVE", "(READY_TO_SHIP AND quantity == 0) OR (MADE_TO_ORDER AND primary Material.status == OUT_OF_STOCK)"]
        side_effects: ["listing no longer purchasable"]
        note: "Third hop of the depth-3 pay cascade (Order -> Material -> Listing)."
      - from: SOLD_OUT
        to: ACTIVE
        trigger: "POST /seller/listings/{id}/restock"
        actor: Seller
        preconditions: ["listing.status == SOLD_OUT", "resulting quantity >= 1 for READY_TO_SHIP, or primary Material.status != OUT_OF_STOCK for MADE_TO_ORDER"]
        side_effects: ["READY_TO_SHIP: quantity increased by restock_qty", "increments Listing.version by 1"]
        note: "Completes ACTIVE<->SOLD_OUT cycle."
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /seller/listings/{id}/deactivate with remove=true"
        actor: Seller
        preconditions: ["listing.status IN {ACTIVE, INACTIVE, SOLD_OUT}"]
        side_effects: ["terminal; listing hidden from all lists except explicit id fetch"]
      - from: INACTIVE
        to: REMOVED
        trigger: "POST /seller/listings/{id}/deactivate with remove=true"
        actor: Seller
        preconditions: ["listing.status IN {ACTIVE, INACTIVE, SOLD_OUT}"]
        side_effects: ["terminal"]
      - from: SOLD_OUT
        to: REMOVED
        trigger: "POST /seller/listings/{id}/deactivate with remove=true"
        actor: Seller
        preconditions: ["listing.status IN {ACTIVE, INACTIVE, SOLD_OUT}"]
        side_effects: ["terminal"]

  - entity: Order
    initial_state: NOT_STARTED
    terminal_states: [CANCELLED]
    note: "Two independent axes: payment_status {UNPAID,PAID,REFUNDED} x fulfillment_status {NOT_STARTED,IN_PRODUCTION,SHIPPED,DELIVERED,COMPLETED,CANCELLED}. initial_state/terminal_states describe the fulfillment axis; payment axis transitions are listed with their own from/to prefixed pay:."
    transitions:
      - from: "UNPAID"
        to: "PAID"
        trigger: "POST /seller/orders/{id}/pay"
        actor: Buyer
        preconditions:
          - "order.payment_status == UNPAID"
          - "acting Buyer owns the order (X-User-ID == order.buyer_id)"
          - "owning Shop.status NOT IN {VACATION, SUSPENDED, CLOSED}"
          - "for READY_TO_SHIP: listing.quantity (or chosen variation stock_qty) >= order.quantity"
          - "for MADE_TO_ORDER consuming a material: Material.stock_qty >= material_qty_per_unit * order.quantity"
          - "count of the shop's orders whose production window [paid_at, ship_by_date] would overlap this order's window <= shop.max_concurrent_production (MADE_TO_ORDER only)"
        side_effects:
          - "payment_status -> PAID; paid_at = clock"
          - "compute order_fee_cents, order_net_cents (order_fees calc)"
          - "compute ship_by_date"
          - "fulfillment_status -> IN_PRODUCTION for MADE_TO_ORDER, else stays NOT_STARTED"
          - "READY_TO_SHIP: decrement listing.quantity / variation stock_qty by order.quantity"
          - "MADE_TO_ORDER: decrement primary Material.stock_qty by material_qty_per_unit*quantity (cascade link 1)"
          - "Shop.pending_balance_cents += order_net_cents; Shop.lifetime_gross_cents += order_total_cents"
          - "if resulting listing.quantity == 0 (READY_TO_SHIP) or Material becomes OUT_OF_STOCK (MADE_TO_ORDER) then the affected Listing(s) ACTIVE->SOLD_OUT (cascade links 2-3)"
      - from: "NOT_STARTED"
        to: "SHIPPED"
        trigger: "POST /seller/orders/{id}/ship"
        actor: Seller
        preconditions: ["order.payment_status == PAID (cross-axis)", "fulfillment_status IN {NOT_STARTED, IN_PRODUCTION}", "acting Seller owns the order's shop"]
        side_effects: ["fulfillment_status -> SHIPPED; shipped_at = clock; a shipping label is considered purchased"]
      - from: "IN_PRODUCTION"
        to: "SHIPPED"
        trigger: "POST /seller/orders/{id}/ship"
        actor: Seller
        preconditions: ["order.payment_status == PAID", "fulfillment_status IN {NOT_STARTED, IN_PRODUCTION}", "acting Seller owns the order's shop"]
        side_effects: ["fulfillment_status -> SHIPPED; shipped_at = clock"]
      - from: "SHIPPED"
        to: "DELIVERED"
        trigger: "POST /seller/orders/{id}/deliver"
        actor: Seller
        preconditions: ["fulfillment_status == SHIPPED"]
        side_effects: ["fulfillment_status -> DELIVERED"]
      - from: "DELIVERED"
        to: "COMPLETED"
        trigger: "POST /seller/orders/{id}/complete"
        actor: Buyer
        preconditions: ["fulfillment_status == DELIVERED", "acting Buyer owns the order"]
        side_effects:
          - "fulfillment_status -> COMPLETED"
          - "Shop.pending_balance_cents -= order_net_cents; Shop.available_balance_cents += order_net_cents"
          - "order becomes eligible for review and for the next payout sweep"
      - from: "NOT_STARTED"
        to: "CANCELLED"
        trigger: "POST /seller/orders/{id}/cancel"
        actor: Seller
        preconditions: ["fulfillment_status IN {NOT_STARTED, IN_PRODUCTION}", "acting Seller owns the order's shop"]
        side_effects:
          - "fulfillment_status -> CANCELLED; if payment_status == PAID then payment_status -> REFUNDED, refunded_cents = order_total_cents"
          - "restore inventory: READY_TO_SHIP quantity += order.quantity (compensation); MADE_TO_ORDER Material.stock_qty += material_qty_per_unit*quantity (compensation, Rule 9 stock invariant)"
          - "if a Listing was SOLD_OUT by this order and now purchasable, SOLD_OUT->ACTIVE"
          - "Shop.pending_balance_cents -= order_net_cents (reverse the PAID credit; money invariant Rule 9)"
      - from: "IN_PRODUCTION"
        to: "CANCELLED"
        trigger: "POST /seller/orders/{id}/cancel"
        actor: Seller
        preconditions: ["fulfillment_status IN {NOT_STARTED, IN_PRODUCTION}", "acting Seller owns the order's shop"]
        side_effects:
          - "fulfillment_status -> CANCELLED; payment_status -> REFUNDED if PAID, refunded_cents = order_total_cents"
          - "restore Material.stock_qty / listing.quantity (compensation)"
          - "SOLD_OUT->ACTIVE for any listing freed"
          - "Shop.pending_balance_cents -= order_net_cents"

  - entity: Case
    initial_state: OPEN
    terminal_states: [RESOLVED_REFUND, RESOLVED_NO_REFUND]
    transitions:
      - from: OPEN
        to: SELLER_RESPONDED
        trigger: "POST /seller/cases/{id}/respond"
        actor: Seller
        preconditions: ["case.status == OPEN", "acting Seller owns the order's shop"]
        side_effects: ["records seller message; order.has_open_case stays true"]
      - from: SELLER_RESPONDED
        to: RESOLVED_REFUND
        trigger: "POST /seller/cases/{id}/resolve with decision=REFUND"
        actor: Seller
        preconditions: ["case.status == SELLER_RESPONDED", "acting Seller owns the order's shop"]
        side_effects:
          - "refund_amount_cents = order.order_total_cents; order.refunded_cents += refund_amount_cents; order.payment_status -> REFUNDED"
          - "order.has_open_case -> false"
          - "a payout that is ON_HOLD is NOT auto-released; it must be released explicitly via POST /seller/payouts/{id}/release-hold once no swept order has_open_case"
      - from: SELLER_RESPONDED
        to: RESOLVED_NO_REFUND
        trigger: "POST /seller/cases/{id}/resolve with decision=NO_REFUND"
        actor: Seller
        preconditions: ["case.status == SELLER_RESPONDED", "acting Seller owns the order's shop"]
        side_effects: ["order.has_open_case -> false", "payout hold (if any) released only via explicit release-hold"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /seller/cases/{id}/escalate"
        actor: Buyer
        preconditions: ["case.status IN {OPEN, SELLER_RESPONDED}", "acting Buyer opened the case"]
        side_effects: ["escalated to PlatformAdmin; order.has_open_case stays true"]
      - from: SELLER_RESPONDED
        to: ESCALATED
        trigger: "POST /seller/cases/{id}/escalate"
        actor: Buyer
        preconditions: ["case.status IN {OPEN, SELLER_RESPONDED}", "acting Buyer opened the case"]
        side_effects: ["escalated to PlatformAdmin"]
      - from: ESCALATED
        to: RESOLVED_REFUND
        trigger: "POST /seller/cases/{id}/resolve with decision=REFUND"
        actor: PlatformAdmin
        preconditions: ["case.status == ESCALATED"]
        side_effects:
          - "refund_amount_cents = order.order_total_cents; order.refunded_cents += refund_amount_cents; order.payment_status -> REFUNDED"
          - "order.has_open_case -> false; any ON_HOLD payout released only via explicit release-hold"
        note: "Branch: escalated cases are resolved by PlatformAdmin (divergent actor/side-effect set from the seller-resolved branch)."
      - from: ESCALATED
        to: RESOLVED_NO_REFUND
        trigger: "POST /seller/cases/{id}/resolve with decision=NO_REFUND"
        actor: PlatformAdmin
        preconditions: ["case.status == ESCALATED"]
        side_effects: ["order.has_open_case -> false; any ON_HOLD payout released only via explicit release-hold"]

  - entity: Payout
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - from: SCHEDULED
        to: ON_HOLD
        trigger: "system: when a Case is opened on any order in this payout (cascade link from Case create)"
        actor: system
        preconditions: ["payout.status == SCHEDULED", "some order in payout has_open_case == true"]
        side_effects: ["payout frozen; mark-paid blocked until released"]
      - from: ON_HOLD
        to: SCHEDULED
        trigger: "POST /seller/payouts/{id}/release-hold"
        actor: PlatformAdmin
        preconditions: ["payout.status == ON_HOLD", "no order in payout has_open_case == true"]
        side_effects: ["payout eligible to be paid again"]
      - from: SCHEDULED
        to: PAID
        trigger: "POST /seller/payouts/{id}/mark-paid"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == SCHEDULED"
          - "no order in payout has_open_case == true (cross-entity: Payout depends on Case state, Rule 7 pair Payout<-Case)"
        side_effects:
          - "compute settled_net_cents (Variant B, chronological, excludes unresolved-case and refunded orders); net_cents = settled_net_cents"
          - "Shop.available_balance_cents -= settled_net_cents; Shop.lifetime_fees_cents += fees_cents; paid_at = clock"
        note: "A payout that went ON_HOLD must be released back to SCHEDULED before mark-paid."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: payout-create-stale-shop
    parent_entity: Shop
    write_endpoint: "POST /seller/payouts"
    occ_field: "expected_shop_version"
    description: |
      Creating a Payout sweeps every COMPLETED order of the shop that has
      payout_id == null. A create carrying a Shop.version older than the shop's
      current version is rejected: the stale version means another payout was
      already created against this shop (legitimately superseding this client's
      view by claiming those orders), so re-sweeping would double-pay. The loser
      observes a version that no longer matches and is rejected.
    error_id: ERR_STALE_SHOP_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_shipping_cost
    trigger: "POST /seller/orders (order creation)"
    algorithm: tiered_pricing
    formula: |
      delta_cents = variation.price_delta_cents if order.variation_id else 0
      item_subtotal_cents = (listing.price_cents + delta_cents) * order.quantity
      sp = ShippingProfile of listing.shipping_profile_id
      if sp.free_shipping_threshold_cents > 0 AND item_subtotal_cents >= sp.free_shipping_threshold_cents:
          shipping_cents = 0
      else:
          shipping_cents = sp.base_cost_cents + sp.per_item_cost_cents * max(0, order.quantity - 1)
      order_total_cents = item_subtotal_cents + shipping_cents
    input_set: "The one listing + optional chosen variation named on the order; its ShippingProfile."
    constants: {}
    precision: "integer cents; no fractional cents produced here"
    variants: []
    note: >
      Rule 2 mode (a): >=3 inputs (free_shipping_threshold, item_subtotal, base_cost, per_item_cost,
      quantity) with a conditional branch and a max(). Free-shipping uses >= (Rule 6 boundary): a
      subtotal exactly equal to the threshold ships free.

  - name: order_fees
    trigger: "POST /seller/orders/{id}/pay (payment side-effect)"
    algorithm: aggregation
    formula: |
      transaction_fee_cents = round_half_up(TRANSACTION_FEE_PCT * order.order_total_cents)   # to whole cents
      processing_fee_cents  = round_half_up(PAYMENT_PROCESSING_PCT * order.order_total_cents) + PAYMENT_PROCESSING_FLAT_CENTS
      order_fee_cents = LISTING_FEE_CENTS + transaction_fee_cents + processing_fee_cents
      order_net_cents = order.order_total_cents - order_fee_cents
    input_set: "Single order at PAID."
    constants:
      LISTING_FEE_CENTS: 20
      TRANSACTION_FEE_PCT: 0.065
      PAYMENT_PROCESSING_PCT: 0.03
      PAYMENT_PROCESSING_FLAT_CENTS: 25
    precision: "round_half_up to whole cents per fee component"
    variants: []

  - name: payout_net
    trigger: "POST /seller/payouts (estimated) and POST /seller/payouts/{id}/mark-paid (settled)"
    algorithm: chronological
    formula: |
      swept = Orders where shop_id == payout.shop_id AND fulfillment_status == COMPLETED AND payout_id == null,
              ordered by created_at ASC (created_at fallback ordering; never id)
      gross_cents = sum(o.order_total_cents for o in swept)
      # Rule 2 mode (b): fees are rounded PER ORDER (each o.order_fee_cents is already whole cents from
      # order_fees) THEN summed. This pinned order differs from computing fees on the aggregate gross:
      #   fees_cents = sum(o.order_fee_cents)                      # PINNED (round-per-order-then-sum)
      #   NOT round_half_up(TRANSACTION_FEE_PCT * gross_cents) + ...# forbidden sum-then-round variant
      fees_cents = sum(o.order_fee_cents for o in swept)
      estimated_net_cents = sum(o.order_net_cents for o in swept)          # Variant A
      # Variant B, at mark-paid:
      settled = [o for o in swept if o.has_open_case == false AND o.payment_status != REFUNDED]
      settled_net_cents = sum(o.order_net_cents for o in settled)          # excludes unresolved-case and refunded orders
    input_set: "COMPLETED, not-yet-paid-out orders of the shop; excludes DRAFT/UNPAID/CANCELLED."
    constants: {}
    precision: "integer cents; per-order rounding fixed upstream in order_fees"
    variants:
      - name: estimated_forward_looking
        when: "computed at payout creation and stored in estimated_net_cents"
        difference: "includes EVERY swept COMPLETED order regardless of case/refund state (optimistic)."
      - name: settled_chronological
        when: "computed at mark-paid and stored in settled_net_cents; net_cents := settled_net_cents"
        difference: "processes swept orders by created_at ASC and EXCLUDES orders that have an unresolved case or were refunded; can be lower than estimated_net_cents."
    note: >
      Rule 1 dual-variant #1 (Payout / cost-accounting domain). An order with an open-then-refunded
      case is counted in estimated_net_cents but dropped from settled_net_cents.

  - name: shop_rating
    trigger: "review publish/hide (POST /seller/reviews, POST /seller/reviews/{id}/hide)"
    algorithm: weighted_scoring
    formula: |
      pub = Reviews where shop_id == shop.id AND status == PUBLISHED
      n = count(pub); s = sum(r.rating for r in pub)
      if n == 0:
          simple_avg_rating = null; weighted_shop_rating = null; published_review_count = 0
      else:
          published_review_count = n
          simple_avg_rating   = round_half_up(s / n, 2)                                  # Variant A
          weighted_shop_rating = round_half_up((s + PRIOR_COUNT * PRIOR_MEAN) / (n + PRIOR_COUNT), 2)  # Variant B
    input_set: "PUBLISHED reviews of the shop only; HIDDEN excluded."
    constants:
      PRIOR_COUNT: 5
      PRIOR_MEAN: 4.0
    precision: "round_half_up to 2 decimal places"
    variants:
      - name: simple_average
        when: "stored in simple_avg_rating"
        difference: "plain arithmetic mean; volatile for small n."
      - name: bayesian_weighted
        when: "stored in weighted_shop_rating"
        difference: "damped toward PRIOR_MEAN by PRIOR_COUNT pseudo-reviews; diverges from simple mean when n is small."
    note: >
      Rule 1 dual-variant #2 (Shop / rating domain — different entity domain from payout_net).
      Two 5-star reviews give simple 5.00 but weighted (10+20)/7 = 4.29.

  - name: ship_by_date
    trigger: "POST /seller/orders/{id}/pay"
    algorithm: threshold
    formula: |
      effective_days = listing.processing_time_days if listing.processing_time_days > 0
                       else ShippingProfile.processing_time_days
      ship_by_date = paid_at + effective_days days
    input_set: "The paid order's listing and its ShippingProfile; paid_at from the logical clock."
    constants: {}
    precision: "whole days added to the logical-clock timestamp"
    variants: []

  - name: material_stock_status
    trigger: "material stock change (order PAID consume, order cancel restore, POST /seller/materials, POST /seller/materials/{id}/restock)"
    algorithm: threshold
    formula: |
      if stock_qty == 0:                       status = OUT_OF_STOCK
      elif stock_qty <= reorder_threshold:     status = LOW_STOCK      # boundary: <= (at threshold is LOW)
      else:                                    status = IN_STOCK
    input_set: "Single material row."
    constants: {}
    precision: "integer comparison"
    variants: []
    note: >
      Rule 6 boundary #2: stock_qty == reorder_threshold is LOW_STOCK (uses <=, not <); stock_qty == 0
      is OUT_OF_STOCK (zero edge). Distinct metric and endpoint from the free-shipping money threshold.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /seller/_clock/set_current_utc has no auth exemption (still requires PlatformAdmin)"
  - priority: 2
    category: auth
    check: "role is authorized for this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for Seller-scoped mutations, X-User-ID (== a Shop.id) equals the target resource's shop_id; for Buyer order/review/case actions, X-User-ID equals the order's buyer_id"
    error_id: ERR_NOT_SHOP_OWNER
    http_status: 403
    applies_to: "all shop-scoped mutations and buyer-owned order/review/case actions"
  - priority: 4
    category: existence
    check: "every path id and body FK resolves to an existing resource, validated left-to-right"
    error_id: ERR_SHOP_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing an id (returns the specific *_NOT_FOUND for the missing entity)"
  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed; enums valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 6
    category: business_constraint
    check: "rating is an integer 1..5 on review create"
    error_id: ERR_INVALID_RATING
    http_status: 400
    applies_to: "POST /seller/reviews"
  - priority: 7
    category: business_constraint
    check: "personalization_note length <= listing.personalization_char_limit"
    error_id: ERR_PERSONALIZATION_TOO_LONG
    http_status: 400
    applies_to: "POST /seller/orders"
  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: state
    check: "listing.status == ACTIVE at order creation (purchasable)"
    error_id: ERR_LISTING_NOT_PURCHASABLE
    http_status: 409
    applies_to: "POST /seller/orders"
  - priority: 10
    category: business_constraint
    check: "owning Shop.status NOT IN {VACATION, SUSPENDED, CLOSED} for order create and order pay"
    error_id: ERR_SHOP_ON_VACATION
    http_status: 422
    applies_to: "POST /seller/orders, POST /seller/orders/{id}/pay"
  - priority: 11
    category: business_constraint
    check: "if listing.personalization_required, order.personalization_note is present and non-empty"
    error_id: ERR_PERSONALIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /seller/orders"
  - priority: 12
    category: business_constraint
    check: "a new SCHEDULED vacation period must not overlap an existing SCHEDULED period of the same shop; intervals are half-open [starts_at, ends_at) so adjacency (existing.ends_at == new.starts_at) is allowed"
    error_id: ERR_VACATION_OVERLAP
    http_status: 409
    applies_to: "POST /seller/vacation-periods"
  - priority: 13
    category: business_temporal
    check: "for MADE_TO_ORDER pay: count of the shop's orders whose production window [paid_at, ship_by_date] overlaps this order's window (closed, aggregate capacity) must stay <= shop.max_concurrent_production"
    error_id: ERR_PRODUCTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /seller/orders/{id}/pay"
  - priority: 14
    category: business_referential
    check: "review target order is COMPLETED and belongs to the acting buyer"
    error_id: ERR_REVIEW_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /seller/reviews"
  - priority: 15
    category: business_referential
    check: "at most one review per order"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: "POST /seller/reviews"
  - priority: 16
    category: business_referential
    check: "case target order is PAID (payment_status == PAID) and belongs to the acting buyer"
    error_id: ERR_CASE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /seller/cases"
  - priority: 17
    category: business_referential
    check: "payout may not advance to PAID while any swept order has_open_case == true"
    error_id: ERR_PAYOUT_HAS_OPEN_CASE
    http_status: 409
    applies_to: "POST /seller/payouts/{id}/mark-paid"
  - priority: 18
    category: business_fiscal
    check: "resolve decision is one of {REFUND, NO_REFUND}"
    error_id: ERR_INVALID_RESOLUTION
    http_status: 400
    applies_to: "POST /seller/cases/{id}/resolve"
  - priority: 19
    category: business_fiscal
    check: "restock_qty is a positive integer"
    error_id: ERR_RESTOCK_INVALID_QTY
    http_status: 400
    applies_to: "POST /seller/materials/{id}/restock"
  - priority: 20
    category: business_fiscal
    check: "on pay, available stock covers the order: READY_TO_SHIP listing/variation stock_qty >= order.quantity, or MADE_TO_ORDER Material.stock_qty >= material_qty_per_unit * order.quantity"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /seller/orders/{id}/pay"
  - priority: 21
    category: business_fiscal
    check: "payout creation requires at least one eligible (COMPLETED, payout_id==null) order for the shop"
    error_id: ERR_PAYOUT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /seller/payouts"
  - priority: 22
    category: business_fiscal
    check: "expected_shop_version equals the shop's current version (OCC)"
    error_id: ERR_STALE_SHOP_VERSION
    http_status: 412
    applies_to: "POST /seller/payouts"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Shop ----
  - method: POST
    path: "/seller/shops"
    description: "Onboard a shop. The returned id becomes the Seller role identity (X-User-ID)."
    roles: [PlatformAdmin]
    code: 201
    input: ["owner_seller_id", "name", "currency?", "max_concurrent_production?", "announcement?", "vacation_auto_reply?"]
    output: Shop
    side_effects: ["Shop created in ACTIVE with version 1"]
  - method: GET
    path: "/seller/shops/{id}"
    description: "Fetch a shop by id."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: []
  - method: GET
    path: "/seller/shops"
    description: "List shops (admin browse)."
    roles: [PlatformAdmin]
    code: 200
    input: ["owner_seller_id?", "status?", "limit?", "offset?"]
    output: Shop[]
    side_effects: []
  - method: POST
    path: "/seller/shops/{id}/enable-vacation"
    description: "Enable vacation mode (ACTIVE->VACATION)."
    roles: [Seller]
    code: 200
    input: ["vacation_auto_reply?"]
    output: Shop
    side_effects: ["status->VACATION", "increments Shop.version by 1"]
  - method: POST
    path: "/seller/shops/{id}/return-from-vacation"
    description: "Return from vacation (VACATION->ACTIVE)."
    roles: [Seller]
    code: 200
    input: []
    output: Shop
    side_effects: ["status->ACTIVE", "increments Shop.version by 1"]
  - method: POST
    path: "/seller/shops/{id}/suspend"
    description: "Admin suspends (or closes) a shop; cascades ACTIVE/SOLD_OUT listings to INACTIVE."
    roles: [PlatformAdmin]
    code: 200
    input: ["close?"]
    output: Shop
    side_effects: ["status->SUSPENDED (or CLOSED if close=true)", "cascade listings ACTIVE/SOLD_OUT -> INACTIVE", "increments Shop.version by 1"]
  - method: POST
    path: "/seller/shops/{id}/reinstate"
    description: "Admin reinstates a SUSPENDED shop (SUSPENDED->ACTIVE)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["status->ACTIVE", "increments Shop.version by 1"]

  # ---- ShippingProfile ----
  - method: POST
    path: "/seller/shipping-profiles"
    description: "Create a shipping profile under a shop."
    roles: [Seller]
    code: 201
    input: ["shop_id", "name", "origin_country?", "base_cost_cents", "per_item_cost_cents", "free_shipping_threshold_cents?", "processing_time_days?"]
    output: ShippingProfile
    side_effects: []
  - method: GET
    path: "/seller/shipping-profiles/{id}"
    description: "Fetch a shipping profile."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: ShippingProfile
    side_effects: []
  - method: GET
    path: "/seller/shipping-profiles"
    description: "List shipping profiles; filter by shop_id (FK reverse-reachability for ShippingProfile.shop_id)."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: ShippingProfile[]
    side_effects: []

  # ---- Material ----
  - method: POST
    path: "/seller/materials"
    description: "Create a material with initial stock; status derived by material_stock_status."
    roles: [Seller]
    code: 201
    input: ["shop_id", "name", "unit?", "stock_qty", "reorder_threshold?"]
    output: Material
    side_effects: ["status computed from stock_qty vs reorder_threshold"]
  - method: GET
    path: "/seller/materials/{id}"
    description: "Fetch a material."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: Material
    side_effects: []
  - method: GET
    path: "/seller/materials"
    description: "List materials; filter by shop_id (FK reverse-reachability for Material.shop_id)."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: ["shop_id?", "status?", "limit?", "offset?"]
    output: Material[]
    side_effects: []
  - method: POST
    path: "/seller/materials/{id}/restock"
    description: "Add stock to a material; recompute status; may free MADE_TO_ORDER listings from SOLD_OUT."
    roles: [Seller]
    code: 200
    input: ["restock_qty"]
    output: Material
    side_effects: ["stock_qty += restock_qty", "recompute status", "any SOLD_OUT MADE_TO_ORDER listing whose material is no longer OUT_OF_STOCK returns to ACTIVE"]

  # ---- Listing ----
  - method: POST
    path: "/seller/listings"
    description: "Create a listing (DRAFT)."
    roles: [Seller]
    code: 201
    input: ["shop_id", "shipping_profile_id", "primary_material_id?", "material_qty_per_unit?", "title", "fulfillment_type", "processing_time_days", "price_cents", "quantity?", "personalization_enabled?", "personalization_required?", "personalization_char_limit?", "variations?", "expires_at?"]
    output: Listing
    side_effects: ["Listing created in DRAFT"]
  - method: GET
    path: "/seller/listings/{id}"
    description: "Fetch a listing by id (returns even REMOVED)."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: GET
    path: "/seller/listings"
    description: "List listings; filters cover FK reverse-reachability for shop_id, shipping_profile_id, primary_material_id."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: ["shop_id?", "shipping_profile_id?", "primary_material_id?", "status?", "fulfillment_type?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []
  - method: POST
    path: "/seller/listings/{id}/publish"
    description: "Publish/reactivate a listing (DRAFT->ACTIVE or INACTIVE->ACTIVE)."
    roles: [Seller]
    code: 200
    input: []
    output: Listing
    side_effects: ["status->ACTIVE", "increments Listing.version by 1"]
  - method: POST
    path: "/seller/listings/{id}/deactivate"
    description: "Deactivate a listing (ACTIVE->INACTIVE) or remove it (remove=true -> REMOVED terminal)."
    roles: [Seller]
    code: 200
    input: ["remove?"]
    output: Listing
    side_effects: ["status->INACTIVE, or REMOVED when remove=true", "increments Listing.version by 1"]
  - method: POST
    path: "/seller/listings/{id}/restock"
    description: "Restock a SOLD_OUT listing (SOLD_OUT->ACTIVE); READY_TO_SHIP adds restock_qty to quantity."
    roles: [Seller]
    code: 200
    input: ["restock_qty?"]
    output: Listing
    side_effects: ["READY_TO_SHIP: quantity += restock_qty", "status SOLD_OUT->ACTIVE", "increments Listing.version by 1"]

  # ---- VacationPeriod ----
  - method: POST
    path: "/seller/vacation-periods"
    description: "Schedule a vacation window; rejects overlaps with existing SCHEDULED windows of the shop."
    roles: [Seller]
    code: 201
    input: ["shop_id", "starts_at", "ends_at", "message?"]
    output: VacationPeriod
    side_effects: ["VacationPeriod created SCHEDULED"]
  - method: GET
    path: "/seller/vacation-periods/{id}"
    description: "Fetch a vacation period."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: VacationPeriod
    side_effects: []
  - method: GET
    path: "/seller/vacation-periods"
    description: "List vacation periods; filter by shop_id (FK reverse-reachability for VacationPeriod.shop_id)."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: ["shop_id?", "status?", "limit?", "offset?"]
    output: VacationPeriod[]
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/seller/orders"
    description: "Create (place) an order; prices item_subtotal/shipping/total. Buyer identity captured as buyer_id."
    roles: [Buyer]
    code: 201
    input: ["shop_id", "listing_id", "variation_id?", "quantity", "personalization_note?"]
    output: Order
    side_effects: ["compute item_subtotal_cents, shipping_cents, order_total_cents", "buyer_id = X-User-ID", "payment_status UNPAID, fulfillment_status NOT_STARTED"]
  - method: GET
    path: "/seller/orders/{id}"
    description: "Fetch an order."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/seller/orders"
    description: "List orders; filters cover FK reverse-reachability for shop_id, listing_id, payout_id."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: ["shop_id?", "listing_id?", "payout_id?", "buyer_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/seller/orders/{id}/pay"
    description: "Pay for an order (UNPAID->PAID); reserves inventory/material, computes fees and ship_by_date, runs the pay cascade."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status->PAID; paid_at set", "order_fees + ship_by_date computed", "MADE_TO_ORDER -> fulfillment IN_PRODUCTION", "inventory/material decrement + SOLD_OUT cascade", "Shop.pending_balance_cents += order_net_cents; lifetime_gross_cents += order_total_cents"]
  - method: POST
    path: "/seller/orders/{id}/ship"
    description: "Purchase a shipping label and ship (->SHIPPED). Requires payment_status PAID."
    roles: [Seller]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status->SHIPPED; shipped_at set"]
  - method: POST
    path: "/seller/orders/{id}/deliver"
    description: "Mark delivered (SHIPPED->DELIVERED)."
    roles: [Seller]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status->DELIVERED"]
  - method: POST
    path: "/seller/orders/{id}/complete"
    description: "Buyer confirms receipt (DELIVERED->COMPLETED); moves funds pending->available."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status->COMPLETED", "Shop.pending_balance_cents -= order_net_cents; available_balance_cents += order_net_cents", "order becomes payout- and review-eligible"]
  - method: POST
    path: "/seller/orders/{id}/cancel"
    description: "Seller cancels (NOT_STARTED/IN_PRODUCTION->CANCELLED); refunds if paid and restores inventory/material."
    roles: [Seller]
    code: 200
    input: ["cancel_reason?"]
    output: Order
    side_effects: ["fulfillment_status->CANCELLED; payment_status->REFUNDED if PAID; refunded_cents set", "restore inventory/material (compensation)", "free SOLD_OUT listings", "Shop.pending_balance_cents -= order_net_cents"]

  # ---- Review ----
  - method: POST
    path: "/seller/reviews"
    description: "Buyer reviews a COMPLETED order (once). Recomputes shop rating."
    roles: [Buyer]
    code: 201
    input: ["order_id", "rating", "body?"]
    output: Review
    side_effects: ["Review PUBLISHED; listing_id/shop_id denormalized from order", "recompute Shop.simple_avg_rating, weighted_shop_rating, published_review_count"]
  - method: GET
    path: "/seller/reviews/{id}"
    description: "Fetch a review."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: GET
    path: "/seller/reviews"
    description: "List reviews; filters cover FK reverse-reachability for order_id, listing_id, shop_id."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: ["order_id?", "listing_id?", "shop_id?", "status?", "limit?", "offset?"]
    output: Review[]
    side_effects: []
  - method: POST
    path: "/seller/reviews/{id}/respond"
    description: "Seller posts a public response to a review."
    roles: [Seller]
    code: 200
    input: ["seller_response"]
    output: Review
    side_effects: ["seller_response set"]
  - method: POST
    path: "/seller/reviews/{id}/hide"
    description: "Hide a review (PUBLISHED->HIDDEN); recomputes shop rating."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: Review
    side_effects: ["status->HIDDEN", "recompute Shop rating fields"]

  # ---- Case ----
  - method: POST
    path: "/seller/cases"
    description: "Buyer opens a dispute case on a PAID order; may place the order's payout ON_HOLD."
    roles: [Buyer]
    code: 201
    input: ["order_id", "type", "reason?"]
    output: Case
    side_effects: ["Case OPEN; order.has_open_case=true", "if order.payout_id set and its payout SCHEDULED -> ON_HOLD (cascade)"]
  - method: GET
    path: "/seller/cases/{id}"
    description: "Fetch a case."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/seller/cases"
    description: "List cases; filter by order_id (FK reverse-reachability for Case.order_id)."
    roles: [Seller, PlatformAdmin, Buyer]
    code: 200
    input: ["order_id?", "status?", "type?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/seller/cases/{id}/respond"
    description: "Seller responds to an OPEN case (OPEN->SELLER_RESPONDED)."
    roles: [Seller]
    code: 200
    input: ["message?"]
    output: Case
    side_effects: ["status->SELLER_RESPONDED"]
  - method: POST
    path: "/seller/cases/{id}/escalate"
    description: "Buyer escalates a case to the platform ({OPEN,SELLER_RESPONDED}->ESCALATED)."
    roles: [Buyer]
    code: 200
    input: []
    output: Case
    side_effects: ["status->ESCALATED"]
  - method: POST
    path: "/seller/cases/{id}/resolve"
    description: "Resolve a case. Seller resolves SELLER_RESPONDED; PlatformAdmin resolves ESCALATED. decision REFUND issues a full refund."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: ["decision", "resolution?"]
    output: Case
    side_effects: ["status->RESOLVED_REFUND or RESOLVED_NO_REFUND", "REFUND: order refunded + payment_status REFUNDED", "order.has_open_case=false; an ON_HOLD payout is NOT auto-released (use release-hold)"]

  # ---- Payout ----
  - method: POST
    path: "/seller/payouts"
    description: "Create a payout that sweeps the shop's COMPLETED, un-paid-out orders. OCC-guarded on Shop.version."
    roles: [Seller]
    code: 201
    input: ["shop_id", "expected_shop_version"]
    output: Payout
    side_effects: ["sweep eligible orders (set payout_id)", "compute gross_cents, fees_cents, estimated_net_cents, net_cents, order_count", "increments Shop.version by 1"]
  - method: GET
    path: "/seller/payouts/{id}"
    description: "Fetch a payout."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/seller/payouts"
    description: "List payouts; filter by shop_id (FK reverse-reachability for Payout.shop_id)."
    roles: [Seller, PlatformAdmin]
    code: 200
    input: ["shop_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/seller/payouts/{id}/mark-paid"
    description: "Admin marks a SCHEDULED payout PAID; blocked if any swept order has an open case. Computes settled_net_cents."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status->PAID; paid_at set", "compute settled_net_cents (Variant B); net_cents := settled_net_cents", "Shop.available_balance_cents -= paid net; lifetime_fees_cents += fees_cents"]
  - method: POST
    path: "/seller/payouts/{id}/release-hold"
    description: "Admin releases an ON_HOLD payout back to SCHEDULED once no swept order has an open case."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status ON_HOLD->SCHEDULED"]

  # ---- Test-driving ----
  - method: POST
    path: "/seller/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["logical clock set to to_iso8601 for all subsequent time-derived computations"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the operation."
  - id: ERR_NOT_SHOP_OWNER
    http: 403
    condition: "Acting Seller's X-User-ID != resource.shop_id, or acting Buyer's X-User-ID != order.buyer_id."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, or invalid enum value."
  - id: ERR_INVALID_RATING
    http: 400
    condition: "Review rating not an integer in 1..5."
  - id: ERR_PERSONALIZATION_TOO_LONG
    http: 400
    condition: "Order personalization_note longer than listing.personalization_char_limit."
  - id: ERR_INVALID_RESOLUTION
    http: 400
    condition: "Case resolve decision not in {REFUND, NO_REFUND}."
  - id: ERR_RESTOCK_INVALID_QTY
    http: 400
    condition: "Material restock_qty not a positive integer."
  - id: ERR_SHOP_NOT_FOUND
    http: 404
    condition: "Referenced shop id does not exist."
  - id: ERR_SHIPPING_PROFILE_NOT_FOUND
    http: 404
    condition: "Referenced shipping_profile_id does not exist."
  - id: ERR_MATERIAL_NOT_FOUND
    http: 404
    condition: "Referenced material id does not exist."
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "Referenced listing id does not exist."
  - id: ERR_VACATION_PERIOD_NOT_FOUND
    http: 404
    condition: "Referenced vacation period id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order id does not exist."
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "Referenced review id does not exist."
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "Referenced case id does not exist."
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "Referenced payout id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state (generic)."
  - id: ERR_LISTING_NOT_PURCHASABLE
    http: 409
    condition: "Order create against a listing whose status != ACTIVE."
  - id: ERR_SHOP_ON_VACATION
    http: 422
    condition: "Order create/pay while owning Shop.status IN {VACATION, SUSPENDED, CLOSED}."
  - id: ERR_PERSONALIZATION_REQUIRED
    http: 422
    condition: "Listing requires personalization but order.personalization_note is empty/absent."
  - id: ERR_VACATION_OVERLAP
    http: 409
    condition: "New SCHEDULED vacation window overlaps an existing SCHEDULED window (half-open intervals)."
  - id: ERR_PRODUCTION_CAPACITY_EXCEEDED
    http: 409
    condition: "Paying a MADE_TO_ORDER order would exceed shop.max_concurrent_production overlapping production windows."
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "On pay, stock/material insufficient to fulfill the order quantity."
  - id: ERR_REVIEW_NOT_ALLOWED
    http: 422
    condition: "Review target order is not COMPLETED, or not owned by the acting buyer."
  - id: ERR_DUPLICATE_REVIEW
    http: 409
    condition: "A review already exists for this order."
  - id: ERR_CASE_NOT_ALLOWED
    http: 422
    condition: "Case target order is not PAID, or not owned by the acting buyer."
  - id: ERR_PAYOUT_HAS_OPEN_CASE
    http: 409
    condition: "Payout mark-paid while a swept order has_open_case == true."
  - id: ERR_PAYOUT_NOT_ELIGIBLE
    http: 422
    condition: "Payout create with no COMPLETED, un-paid-out order for the shop."
  - id: ERR_STALE_SHOP_VERSION
    http: 412
    condition: "Payout create where expected_shop_version != shop.version (OCC)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Seller
    description: "Owns a shop and every shop-scoped resource (listings, materials, shipping profiles, vacation periods) and the seller side of orders/cases/reviews/payouts."
    identity: "entity_backed:Shop"
    exclusive_operations:
      - "POST /seller/shipping-profiles"
      - "POST /seller/materials"
      - "POST /seller/materials/{id}/restock"
      - "POST /seller/listings"
      - "POST /seller/listings/{id}/publish"
      - "POST /seller/listings/{id}/deactivate"
      - "POST /seller/listings/{id}/restock"
      - "POST /seller/vacation-periods"
      - "POST /seller/shops/{id}/enable-vacation"
      - "POST /seller/shops/{id}/return-from-vacation"
      - "POST /seller/orders/{id}/ship"
      - "POST /seller/orders/{id}/deliver"
      - "POST /seller/orders/{id}/cancel"
      - "POST /seller/reviews/{id}/respond"
      - "POST /seller/cases/{id}/respond"
      - "POST /seller/payouts"
    shared_operations:
      - "GET shop-scoped resources (shops/{id}, listings, materials, shipping-profiles, vacation-periods, orders, reviews, cases, payouts)"
      - "POST /seller/cases/{id}/resolve (SELLER_RESPONDED branch)"
      - "POST /seller/reviews/{id}/hide"
  - name: Buyer
    description: "Places and pays orders, confirms completion, writes reviews, opens and escalates cases."
    identity: "opaque"
    exclusive_operations:
      - "POST /seller/orders"
      - "POST /seller/orders/{id}/pay"
      - "POST /seller/orders/{id}/complete"
      - "POST /seller/reviews"
      - "POST /seller/cases"
      - "POST /seller/cases/{id}/escalate"
    shared_operations:
      - "GET listings, orders, reviews, cases the buyer is party to"
  - name: PlatformAdmin
    description: "Operational superset: onboarding, suspension, escalated-case resolution, payouts, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /seller/shops"
      - "POST /seller/shops/{id}/suspend"
      - "POST /seller/shops/{id}/reinstate"
      - "POST /seller/payouts/{id}/mark-paid"
      - "POST /seller/payouts/{id}/release-hold"
      - "POST /seller/_clock/set_current_utc"
    shared_operations:
      - "GET all resources"
      - "POST /seller/cases/{id}/resolve (ESCALATED branch)"
      - "POST /seller/reviews/{id}/hide"
