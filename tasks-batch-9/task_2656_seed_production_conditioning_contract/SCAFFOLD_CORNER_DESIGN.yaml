  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_unknown_grower
        claim_type: error_envelope
        grounds:
          - response_envelope.error
          - errors.ERR_GROWER_NOT_FOUND
        distinguishing_aspect: "Every failure uses the declared error envelope: response_type error, a data object carrying error_id and message, and the same meta block as a success - never a bare string or a top-level error_id."
        test_recipe:
          setup:
            - "One grower exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /seed-ops/growers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Returns 404 with response_type == error"
            - "data.error_id == ERR_GROWER_NOT_FOUND and data.message is a non-empty human-readable string"
            - "meta.api_request_id and meta.api_request_timestamp are present, exactly as on a 200 response"
            - "There is no top-level error_id and no top-level message field outside data"

      - name: pagination_limit_out_of_range_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Pagination arguments are range-checked rather than silently clamped: limit 101 and offset -1 each return 400 ERR_INVALID_REQUEST, while limit 100 and limit 1 - the declared bounds - both succeed."
        test_recipe:
          setup:
            - "Two growers exist"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Coteau Seed Co", region_code: "ND-11", contact_email: "office@coteau.example" }
              as: ProgramAdmin
              captures: { g2_id: $.data.id }
          trigger:
            - call: "GET /seed-ops/growers"
              payload: { limit: 101, offset: 0 }
              as: ProgramAdmin
            - call: "GET /seed-ops/growers"
              payload: { limit: 10, offset: -1 }
              as: ProgramAdmin
            - call: "GET /seed-ops/growers"
              payload: { limit: 100, offset: 0 }
              as: ProgramAdmin
            - call: "GET /seed-ops/growers"
              payload: { limit: 1, offset: 0 }
              as: ProgramAdmin
          assert:
            - "limit 101 returns 400 with data.error_id == ERR_INVALID_REQUEST, not a clamped 200 at limit 100"
            - "offset -1 returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "limit 100 returns 200 with total_count 2, has_more false and exactly 2 items"
            - "limit 1 returns 200 with total_count 2, has_more true and exactly 1 item"

      - name: not_found_family_across_path_templated_resources_not_found
        claim_type: error_catalog_coverage
        grounds:
          - validations.priority_4_path_existence
          - errors.ERR_VARIETY_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_SEED_LOT_NOT_FOUND
          - errors.ERR_SAMPLE_NOT_FOUND
          - errors.ERR_TAG_NOT_FOUND
          - errors.ERR_SETTLEMENT_NOT_FOUND
        distinguishing_aspect: "The 404 catalog is resource-specific, not a single generic code: the same unknown UUID on nine different path-templated routes yields nine different error_ids."
        test_recipe:
          setup:
            - "Empty database except one grower, so no probed id can accidentally resolve"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /seed-ops/varieties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /seed-ops/treatment-products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /seed-ops/production-fields/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /seed-ops/production-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /seed-ops/field-inspections/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FieldOfficer
            - call: "GET /seed-ops/harvest-equipment/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ConditioningManager
            - call: "GET /seed-ops/conditioning-lines/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ConditioningManager
            - call: "GET /seed-ops/conditioning-runs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ConditioningManager
            - call: "GET /seed-ops/seed-lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ConditioningManager
            - call: "GET /seed-ops/lot-samples/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CertificationAgency
              as_user_id: "agency-1"
            - call: "GET /seed-ops/certification-tags/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CertificationAgency
              as_user_id: "agency-1"
            - call: "GET /seed-ops/settlements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SettlementAccountant
              as_user_id: "acct-1"
          assert:
            - "Every call returns 404 and each carries its own error_id: ERR_VARIETY_NOT_FOUND, ERR_TREATMENT_PRODUCT_NOT_FOUND, ERR_PRODUCTION_FIELD_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_EQUIPMENT_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_SEED_LOT_NOT_FOUND, ERR_SAMPLE_NOT_FOUND, ERR_TAG_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND respectively"
            - "No call returns 200 with a null data object and none returns a generic ERR_NOT_FOUND"
            - "The one existing Grower row is untouched"

