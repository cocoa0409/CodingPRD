  # --- operations checkpoint --------------------------------------------------
  - method: POST
    path: /quality-ops-runs
    description: Run the periodic quality checkpoint against the current logical clock — expire overdue kits, release their complaints, and run the LOT/LINE/PLANT trend waterfall.
    roles: [QualityLead]
    code: 200
    input: ["dry_run?"]
    output: { run_at: datetime, kits_expired_count: integer, complaints_advanced_count: integer, signals_created_count: integer, signals_refreshed_count: integer, memberships_created_count: integer, plants_reposted_count: integer }
    side_effects:
      - "every SHIPPED kit past expected_return_by -> EXPIRED with disposition UNUSABLE and chain BROKEN; its complaint moves AWAITING_SAMPLE -> IN_RESOLUTION"
      - "trend_signal_evaluation runs the narrowest-scope-wins waterfall and creates or refreshes TrendSignals with their SignalMemberships"
      - "plant_oversight_posture re-derived for every affected plant"
      - "dry_run true returns the same counts without persisting anything"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog (57 codes)
# -----------------------------------------------------------------------------
errors:

  # --- 401 / 403 --------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header absent or blank"
    applies_to: ["all endpoints except POST /_clock/set_current_utc"]
  - id: ERR_UNKNOWN_ACTOR
    http_status: 401
    condition: "X-User-ID does not resolve to a StaffUser or Consumer, or the StaffUser has is_active false"
    applies_to: ["all endpoints except POST /_clock/set_current_utc"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the actor's role is not listed in the endpoint's roles"
    applies_to: ["all endpoints"]
  - id: ERR_AUTHORITY_TIER_INSUFFICIENT
    http_status: 403
    condition: "the deciding staff member's authority_tier rank is below the remedy's authority_tier_required rank"
    applies_to: ["POST /remedies/{id}/decide"]

  # --- 400 --------------------------------------------------------------------
  - id: ERR_VALIDATION
    http_status: 400
    condition: "a required field is missing, an enum value is not a declared member, a number falls outside its range, or a pagination parameter is out of bounds"
    applies_to: ["all POST and PATCH endpoints", "all list endpoints"]

  # --- 404 --------------------------------------------------------------------
  - id: ERR_STAFF_USER_NOT_FOUND
    http_status: 404
    condition: "no StaffUser with the given id"
    applies_to: ["GET /staff-users/{id}"]
  - id: ERR_CONSUMER_NOT_FOUND
    http_status: 404
    condition: "no Consumer with the given id"
    applies_to: ["GET /consumers/{id}", "PATCH /consumers/{id}", "GET /consumers/{id}/sentiment", "POST /contacts"]
  - id: ERR_PLANT_NOT_FOUND
    http_status: 404
    condition: "no Plant with the given id"
    applies_to: ["GET /plants/{id}", "GET /plants/{id}/production-lines", "POST /production-lines", "POST /trend-signals"]
  - id: ERR_PRODUCTION_LINE_NOT_FOUND
    http_status: 404
    condition: "no ProductionLine with the given id"
    applies_to: ["GET /production-lines/{id}", "POST /production-lots", "POST /trend-signals"]
  - id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    condition: "no Product with the given id"
    applies_to: ["GET /products/{id}", "POST /production-lots"]
  - id: ERR_PRODUCTION_LOT_NOT_FOUND
    http_status: 404
    condition: "no ProductionLot with the given id"
    applies_to: ["GET /production-lots/{id}", "GET /production-lots/{id}/complaint-rate", "POST /production-lots/{id}/hold", "POST /production-lots/{id}/release", "POST /production-lots/{id}/withdraw", "POST /trend-signals"]
  - id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    condition: "no Contact with the given id"
    applies_to: ["GET /contacts/{id}", "POST /contacts/{id}/close-no-complaint", "POST /complaints"]
  - id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    condition: "no Complaint with the given id"
    applies_to: ["GET /complaints/{id}", "all POST /complaints/{id}/* actions", "GET /complaints/{id}/signal-memberships", "POST /sample-kits", "POST /remedies", "POST /regulatory-reports"]
  - id: ERR_SAMPLE_KIT_NOT_FOUND
    http_status: 404
    condition: "no SampleKit with the given id"
    applies_to: ["GET /sample-kits/{id}", "all POST /sample-kits/{id}/* actions", "GET /sample-kits/{id}/custody-events"]
  - id: ERR_REMEDY_NOT_FOUND
    http_status: 404
    condition: "no Remedy with the given id"
    applies_to: ["GET /remedies/{id}", "POST /remedies/{id}/submit", "POST /remedies/{id}/decide", "POST /remedies/{id}/fulfill", "POST /remedies/{id}/void"]
  - id: ERR_REGULATORY_REPORT_NOT_FOUND
    http_status: 404
    condition: "no RegulatoryReport with the given id"
    applies_to: ["GET /regulatory-reports/{id}", "POST /regulatory-reports/{id}/determine", "POST /regulatory-reports/{id}/submit", "POST /regulatory-reports/{id}/withdraw"]
  - id: ERR_TREND_SIGNAL_NOT_FOUND
    http_status: 404
    condition: "no TrendSignal with the given id"
    applies_to: ["GET /trend-signals/{id}", "GET /trend-signals/{id}/memberships", "all POST /trend-signals/{id}/* actions"]
  - id: ERR_RESPONSE_TEMPLATE_NOT_FOUND
    http_status: 404
    condition: "no ResponseTemplate with the given id"
    applies_to: ["GET /response-templates/{id}", "POST /response-templates/{id}/activate", "POST /response-templates/{id}/retire", "POST /complaints/{id}/respond"]

  # --- 409 --------------------------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http_status: 409
    condition: "a unique code (staff_code, external_ref, plant_code, sku, kit_code, template_code, or line_code within a plant) already exists"
    applies_to: ["POST /staff-users", "POST /consumers", "POST /plants", "POST /production-lines", "POST /products", "POST /sample-kits", "POST /response-templates"]
  - id: ERR_CONTACT_CLOSED
    http_status: 409
    condition: "the contact is CLOSED_NO_COMPLAINT"
    applies_to: ["POST /complaints"]
  - id: ERR_CONTACT_HAS_COMPLAINTS
    http_status: 409
    condition: "the contact already has at least one complaint"
    applies_to: ["POST /contacts/{id}/close-no-complaint"]
  - id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    condition: "the complaint's handling_status does not permit the requested transition, including any transition out of terminal CLOSED"
    applies_to: ["POST /complaints/{id}/identify-product", "POST /complaints/{id}/triage", "POST /complaints/{id}/respond", "POST /complaints/{id}/mark-duplicate", "POST /complaints/{id}/unmark-duplicate", "POST /complaints/{id}/quality-hold", "POST /complaints/{id}/release-hold", "POST /complaints/{id}/resolve", "POST /complaints/{id}/close"]
  - id: ERR_REGULATORY_STATE_INVALID
    http_status: 409
    condition: "the complaint's regulatory_status does not permit the requested regulatory transition"
    applies_to: ["POST /regulatory-reports", "POST /regulatory-reports/{id}/determine", "POST /regulatory-reports/{id}/submit", "POST /regulatory-reports/{id}/withdraw", "POST /complaints/{id}/close"]
  - id: ERR_REPORT_ALREADY_OPEN
    http_status: 409
    condition: "a non-WITHDRAWN RegulatoryReport already exists for the complaint"
    applies_to: ["POST /regulatory-reports"]
  - id: ERR_REMEDY_STATE_INVALID
    http_status: 409
    condition: "the remedy's status does not permit the requested transition"
    applies_to: ["POST /remedies/{id}/submit", "POST /remedies/{id}/decide", "POST /remedies/{id}/fulfill", "POST /remedies/{id}/void"]
  - id: ERR_SAMPLE_KIT_STATE_INVALID
    http_status: 409
    condition: "the kit's status does not permit the requested transition or custody append"
    applies_to: ["POST /sample-kits/{id}/ship", "POST /sample-kits/{id}/receive", "POST /sample-kits/{id}/lab-accept", "POST /sample-kits/{id}/cancel", "POST /sample-kits/{id}/custody-events"]
  - id: ERR_TREND_SIGNAL_STATE_INVALID
    http_status: 409
    condition: "the signal's status does not permit the requested transition"
    applies_to: ["POST /trend-signals/{id}/open-investigation", "POST /trend-signals/{id}/dismiss", "POST /trend-signals/{id}/escalate-recall-evaluation", "POST /trend-signals/{id}/initiate-recall", "POST /trend-signals/{id}/close-no-action"]
  - id: ERR_LOT_STATE_INVALID
    http_status: 409
    condition: "the lot's release_status does not permit the requested transition, including any transition out of terminal WITHDRAWN"
    applies_to: ["POST /production-lots/{id}/hold", "POST /production-lots/{id}/release", "POST /production-lots/{id}/withdraw"]
  - id: ERR_TEMPLATE_STATE_INVALID
    http_status: 409
    condition: "the template's status does not permit activation or retirement, or a non-ACTIVE template was selected for a response"
    applies_to: ["POST /response-templates/{id}/activate", "POST /response-templates/{id}/retire", "POST /complaints/{id}/respond"]
  - id: ERR_REPORT_STATE_INVALID
    http_status: 409
    condition: "the report is not OPEN at determination, or not DETERMINED_REPORTABLE at submission, or already terminal at withdrawal"
    applies_to: ["POST /regulatory-reports/{id}/determine", "POST /regulatory-reports/{id}/submit", "POST /regulatory-reports/{id}/withdraw"]
  - id: ERR_PRODUCT_UNIDENTIFIED
    http_status: 409
    condition: "the complaint's product_identification_status is UNRESOLVED at triage"
    applies_to: ["POST /complaints/{id}/triage"]
  - id: ERR_LOT_WITHDRAWN
    http_status: 409
    condition: "the complaint's linked lot has release_status WITHDRAWN"
    applies_to: ["POST /complaints/{id}/respond"]
  - id: ERR_RECALL_EVALUATION_ACTIVE
    http_status: 409
    condition: "a TrendSignal containing this complaint is in RECALL_EVALUATION"
    applies_to: ["POST /complaints/{id}/release-hold"]
  - id: ERR_SIGNAL_INVESTIGATION_ACTIVE
    http_status: 409
    condition: "a TrendSignal covering this lot is in INVESTIGATION_OPEN or RECALL_EVALUATION"
    applies_to: ["POST /production-lots/{id}/release"]
  - id: ERR_REGULATORY_SUBMISSION_PENDING
    http_status: 409
    condition: "a member complaint has regulatory_status REPORTABLE with no SUBMITTED report"
    applies_to: ["POST /trend-signals/{id}/initiate-recall"]
  - id: ERR_SAMPLE_KIT_IN_FLIGHT
    http_status: 409
    condition: "the complaint's SampleKit is in REQUESTED, SHIPPED or IN_TRANSIT_INBOUND when the remedy is approved"
    applies_to: ["POST /remedies/{id}/decide"]
  - id: ERR_PLANT_UNDER_INVESTIGATION_HOLD
    http_status: 409
    condition: "the owning plant's derived oversight_posture is INVESTIGATION_HOLD"
    applies_to: ["POST /production-lots"]
  - id: ERR_KIT_INTERVAL_CONFLICT
    http_status: 409
    condition: "another SampleKit for the same consumer has a closed [occupied_from, occupied_until] interval containing the prospective shipped_at"
    applies_to: ["POST /sample-kits/{id}/ship"]
  - id: ERR_SIGNAL_WINDOW_OVERLAP
    http_status: 409
    condition: "an open signal for the same scope key has a half-open window that strictly overlaps the requested window"
    applies_to: ["POST /trend-signals"]
  - id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    condition: "revision_count has already reached MAX_REMEDY_REVISIONS"
    applies_to: ["POST /remedies/{id}/decide"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the deciding staff id equals the remedy's authored_by_ref, or the submitting staff id equals the report's determined_by_ref"
    applies_to: ["POST /remedies/{id}/decide", "POST /regulatory-reports/{id}/submit"]

  # --- 412 --------------------------------------------------------------------
  - id: ERR_STALE_COMPLAINT_VERSION
    http_status: 412
    condition: "expected_complaint_version does not equal the parent Complaint's current version"
    applies_to: ["POST /remedies"]
  - id: ERR_STALE_SAMPLE_KIT_VERSION
    http_status: 412
    condition: "expected_sample_kit_version does not equal the parent SampleKit's current version"
    applies_to: ["POST /sample-kits/{id}/custody-events"]

  # --- 422 --------------------------------------------------------------------
  - id: ERR_DUPLICATE_TARGET_INVALID
    http_status: 422
    condition: "the duplicate target is the complaint itself, does not exist, is itself DUPLICATE, or belongs to a different consumer"
    applies_to: ["POST /complaints/{id}/mark-duplicate"]
  - id: ERR_S1_MUST_BE_REPORTABLE
    http_status: 422
    condition: "a NOT_REPORTABLE determination is attempted on a complaint whose effective_severity_band is S1"
    applies_to: ["POST /regulatory-reports/{id}/determine"]
  - id: ERR_SEVERITY_TOO_LOW_FOR_RECALL
    http_status: 422
    condition: "no member complaint has effective_severity_band S1 or S2"
    applies_to: ["POST /trend-signals/{id}/escalate-recall-evaluation"]
  - id: ERR_SIGNAL_EMPTY_MEMBERSHIP
    http_status: 422
    condition: "the signal has membership_count 0 when an investigation is opened, or a manually raised window contains no eligible complaint"
    applies_to: ["POST /trend-signals/{id}/open-investigation", "POST /trend-signals"]
  - id: ERR_RECEIVED_AT_IN_FUTURE
    http_status: 422
    condition: "received_at is strictly after the logical clock"
    applies_to: ["POST /contacts"]
  - id: ERR_CUSTODY_OUT_OF_ORDER
    http_status: 422
    condition: "occurred_at is earlier than the previous custody event's occurred_at"
    applies_to: ["POST /sample-kits/{id}/custody-events"]
  - id: ERR_CUSTODY_SEQUENCE_INVALID
    http_status: 422
    condition: "the appended event_type is not REQUIRED_SEQUENCE at the next sequence position"
    applies_to: ["POST /sample-kits/{id}/custody-events"]
  - id: ERR_WINDOW_INVALID
    http_status: 422
    condition: "window_end is not strictly after window_start"
    applies_to: ["POST /trend-signals"]
  - id: ERR_SCOPE_SHAPE_INVALID
    http_status: 422
    condition: "scope_level, production_line_id and lot_id are not mutually consistent"
    applies_to: ["POST /trend-signals"]
  - id: ERR_CONSUMER_ADDRESS_MISSING
    http_status: 422
    condition: "the consumer has no postal_code when the kit is shipped"
    applies_to: ["POST /sample-kits/{id}/ship"]
  - id: ERR_TEMPLATE_TYPE_MISMATCH
    http_status: 422
    condition: "the template's applies_to_type is neither the complaint's complaint_type nor ANY"
    applies_to: ["POST /complaints/{id}/respond"]
  - id: ERR_TEMPLATE_BAND_TOO_LOW
    http_status: 422
    condition: "the template's max_band_allowed is milder than the complaint's effective_severity_band"
    applies_to: ["POST /complaints/{id}/respond"]
  - id: ERR_GOODWILL_ABOVE_MAX
    http_status: 422
    condition: "the computed payout_cents exceeds GOODWILL_MAX_PAYOUT_CENTS"
    applies_to: ["POST /remedies", "POST /remedies/{id}/submit", "POST /remedies/{id}/decide"]
  - id: ERR_BATCH_CODE_AMBIGUOUS
    http_status: 422
    condition: "the normalized batch code matches more than one lot and pack_code_date does not narrow it to exactly one"
    applies_to: ["POST /complaints", "POST /complaints/{id}/identify-product"]

# -----------------------------------------------------------------------------
# §1.7 RBAC Permission Matrix (6 roles, segregation_of_duties)
# -----------------------------------------------------------------------------
roles:

  - name: SystemAdmin
    description: Reference-data steward and clock operator. Holds no complaint-handling authority whatsoever.
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /staff-users"
      - "GET /staff-users"
      - "GET /staff-users/{id}"
      - "POST /plants"
      - "POST /production-lines"
      - "POST /products"
    shared_operations:
      - "POST /production-lots (with QualityLead)"
      - "GET /plants, GET /plants/{id}, GET /plants/{id}/production-lines, GET /production-lines/{id}"
      - "GET /products, GET /products/{id}"
      - "GET /production-lots, GET /production-lots/{id}"

  - name: CareAgent
    description: Front-line consumer-affairs agent. Logs contacts and complaints, requests kits, drafts goodwill — but never approves it and never triages.
    identity: "entity_backed:StaffUser"
    exclusive_operations: []
    shared_operations:
      - "POST /consumers, GET /consumers, GET /consumers/{id}, PATCH /consumers/{id}"
      - "POST /contacts, GET /contacts, GET /contacts/{id}, POST /contacts/{id}/close-no-complaint"
      - "POST /complaints, GET /complaints, GET /complaints/{id}"
      - "POST /complaints/{id}/identify-product, POST /complaints/{id}/respond, POST /complaints/{id}/resolve"
      - "POST /sample-kits, POST /sample-kits/{id}/ship, POST /sample-kits/{id}/custody-events"
      - "GET /sample-kits, GET /sample-kits/{id}, GET /sample-kits/{id}/custody-events"
      - "POST /remedies, POST /remedies/{id}/submit, GET /remedies, GET /remedies/{id}"
      - "GET /products, GET /products/{id}, GET /production-lots, GET /production-lots/{id}"
      - "GET /response-templates, GET /response-templates/{id}"

  - name: CareSupervisor
    description: Consumer-affairs supervisor. Triages severity, decides goodwill within an authority tier, owns duplicate management and response templates. Cannot make a regulatory determination.
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /complaints/{id}/mark-duplicate"
      - "POST /complaints/{id}/unmark-duplicate"
      - "POST /complaints/{id}/close"
      - "POST /sample-kits/{id}/cancel"
      - "POST /remedies/{id}/fulfill"
      - "POST /remedies/{id}/void"
      - "POST /response-templates"
      - "POST /response-templates/{id}/activate"
      - "POST /response-templates/{id}/retire"
    shared_operations:
      - "everything CareAgent may do, plus POST /complaints/{id}/triage (with QualityLead)"
      - "POST /remedies/{id}/decide (with QualityLead)"
      - "GET /consumers/{id}/sentiment, GET /production-lots/{id}/complaint-rate (with QualityLead)"
      - "GET /complaints/{id}/signal-memberships, GET /trend-signals, GET /trend-signals/{id}, GET /trend-signals/{id}/memberships"
      - "GET /regulatory-reports, GET /regulatory-reports/{id}"
      - "GET /plants, GET /plants/{id}, GET /plants/{id}/production-lines, GET /production-lines/{id}"

  - name: QualityLead
    description: Plant-quality owner. Runs the ops checkpoint, controls lot disposition, raises and drives trend signals up to recall initiation, and imposes quality holds on complaints.
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /quality-ops-runs"
      - "POST /production-lots/{id}/hold"
      - "POST /production-lots/{id}/release"
      - "POST /production-lots/{id}/withdraw"
      - "POST /complaints/{id}/quality-hold"
      - "POST /complaints/{id}/release-hold"
      - "POST /sample-kits/{id}/receive"
      - "POST /sample-kits/{id}/lab-accept"
      - "POST /trend-signals"
      - "POST /trend-signals/{id}/open-investigation"
      - "POST /trend-signals/{id}/dismiss"
      - "POST /trend-signals/{id}/escalate-recall-evaluation"
      - "POST /trend-signals/{id}/initiate-recall"
      - "POST /trend-signals/{id}/close-no-action"
    shared_operations:
      - "POST /complaints/{id}/triage (with CareSupervisor)"
      - "POST /remedies/{id}/decide (with CareSupervisor)"
      - "POST /production-lots (with SystemAdmin)"
      - "POST /regulatory-reports (with RegulatoryOfficer)"
      - "POST /sample-kits/{id}/custody-events (with CareAgent and CareSupervisor)"
      - "GET /production-lots/{id}/complaint-rate, GET /consumers/{id}/sentiment (with CareSupervisor)"
      - "read access across consumers, contacts, complaints, sample kits, remedies, regulatory reports, trend signals, templates, plants, lines, products and lots"

  - name: RegulatoryOfficer
    description: Regulatory-affairs officer. Owns the reportability determination and the agency filing, and nothing else. Segregation of duties forbids the same officer from determining and submitting the same report.
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /regulatory-reports/{id}/determine"
      - "POST /regulatory-reports/{id}/submit"
      - "POST /regulatory-reports/{id}/withdraw"
    shared_operations:
      - "POST /regulatory-reports (with QualityLead)"
      - "GET /regulatory-reports, GET /regulatory-reports/{id}"
      - "GET /complaints, GET /complaints/{id}"
      - "GET /trend-signals, GET /trend-signals/{id}, GET /trend-signals/{id}/memberships"

  - name: Consumer
    description: The external consumer, self-service. May read only their own consumer record.
    identity: "entity_backed:Consumer"
    exclusive_operations: []
    shared_operations:
      - "GET /consumers/{id} for their own id only"

# -----------------------------------------------------------------------------
# Segregation-of-duties matrix (role_model: segregation_of_duties)
# -----------------------------------------------------------------------------
segregation_of_duties:
  - pair: "Remedy author vs Remedy decider"
    rule: "POST /remedies/{id}/decide is rejected with ERR_SEGREGATION_OF_DUTIES (409) when the X-User-ID equals Remedy.authored_by_ref, regardless of the decider's authority_tier."
  - pair: "RegulatoryReport determiner vs submitter"
    rule: "POST /regulatory-reports/{id}/submit is rejected with ERR_SEGREGATION_OF_DUTIES (409) when the X-User-ID equals RegulatoryReport.determined_by_ref."
  - pair: "Goodwill authority ceiling"
    rule: "A decider whose authority_tier rank (TIER_1 < TIER_2 < TIER_3) is below Remedy.authority_tier_required is rejected with ERR_AUTHORITY_TIER_INSUFFICIENT (403)."
