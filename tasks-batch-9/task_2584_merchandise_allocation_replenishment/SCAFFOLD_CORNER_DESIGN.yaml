            - "The second run creation required the REFRESHED receipt version: the first creation moved the receipt STAGED -> ALLOCATING and bumped its version, so ${rcpt_v2} != ${rcpt_v1}"
            - "Creating a second transfer for the same (from 0102, to 0101, SKU-1001) sets TransferRecommendation.${tr2_id}.supersedes_recommendation_id == ${tr1_id} and moves ${tr1_id}.status to CANCELLED with reject_reason null"
            - "GET /allocation/transfer-recommendations?supersedes_recommendation_id=${tr1_id} returns exactly 1 row whose id == ${tr2_id}"
            - "GET /allocation/store-positions?store_id=0101 returns 2 rows (both items) and ?item_id=SKU-1001 returns 2 rows (both stores) - the junction is navigable from either leg"
            - "No cycle is ever created: ${run2_id}.supersedes_run_id points at ${run1_id} and ${run1_id}.supersedes_run_id is null"
  # section 1.2 state machines, transitions and relationship patterns
  - section: state_machines
    instances:
      - name: every_machines_initial_state_on_creation
        claim_type: initial_state
        grounds:
          - state_machines[AllocationProgram].initial_state
          - state_machines[Store].initial_state
          - state_machines[Receipt].initial_state
          - state_machines[AllocationRun].initial_state
          - state_machines[AllocationLine].initial_state
          - state_machines[PromoEvent].initial_state
          - state_machines[TransferRecommendation].initial_state
          - state_machines[AssortmentAction].initial_state
          - entities.Item.fields.lifecycle_state
        distinguishing_aspect: |
          Nine machines are declared and each must be born in its declared initial_state, including the four
          entities that are never created by a plain POST: AllocationLine appears only as a side effect of
          propose, AssortmentAction only from the detection sweep, and both must still start PENDING. The whole
          network is built once from an empty database in dependency order so the initial state of every
          machine is observed on the very response that created it, not inferred later. The two derived
          StorePosition dimensions are the deliberate exception - they have no initial_state and are already
          computed on the creating response.
        test_recipe:
          setup:
            - "The database is empty and the logical clock is 2026-08-01T00:00:00Z"
            - "The trigger builds program FA26, stores 0101(A,URBAN) and 0102(B,URBAN), their shelf plans (capacity 48 / pmin 12 and 24 / pmin 8), SizeProfile TOP-4SZ (all four sizes CORE), SKU-1001 SEASONAL"
            - "Position 0101 holds 4 units (S 0, M 3, L 1, XL 0) with min 12 / max 48 and forecast 9; position 0102 holds 30 units with min 8 / max 24 and forecast 5"
            - "A 20-unit receipt is spread DEMAND_DRIVEN / FORWARD_LOOKING, a PROGRAM promo event is created, a 6-unit rebalance 0102 -> 0101 is created and one detection sweep is run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
          trigger:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
