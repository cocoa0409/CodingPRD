  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assistance_request_counter_amend_cycle
        grounds:
          - state_machines.AssistanceRequest.SUBMITTED_to_COUNTERED
          - state_machines.AssistanceRequest.COUNTERED_to_SUBMITTED
          - entities.AssistanceRequest.fields.amendment_round
        distinguishing_aspect: |
          AssistanceRequest negotiation cycle (entity 1): SUBMITTED -> COUNTERED ->
          SUBMITTED loops twice; amendment_round climbs 0 -> 1 -> 2 and the second
          counter_terms replace the first — a pure A->B->A cycle, not a pipeline.
        test_recipe:
          setup: ["Event ACTIVE (intake ACCEPTING); request to RSP in DRAFT"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/counter", payload: { counter_crews: [{ crew_type: "LINE", count: 1 }], counter_note: "only one crew available" }, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: { amended_crews: [{ crew_type: "LINE", count: 1 }, { crew_type: "TREE", count: 1 }] }, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/counter", payload: { counter_crews: [{ crew_type: "TREE", count: 2 }], counter_note: "tree-heavy mix" }, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: { amended_crews: [{ crew_type: "TREE", count: 2 }] }, as: HostCoordinator, as_user_id: "${host_id}", captures: { final_round: "$.data.amendment_round", final_note: "$.data.counter_terms.counter_note" } }
          assert:
            - "AssistanceRequest.${req_id}.status == SUBMITTED after the second resubmission"
            - "AssistanceRequest.${req_id}.amendment_round == 2"
            - "AssistanceRequest.${req_id}.counter_terms.counter_note == 'tree-heavy mix'"
            - "AssistanceRequest.${req_id}.requested_crews == [{ crew_type: TREE, count: 2 }]"

      - name: crew_readiness_cycle_via_rebriefing
        grounds:
          - state_machines.Crew.CLEARED_TO_WORK_to_SAFETY_HOLD
          - state_machines.Crew.SAFETY_HOLD_to_BRIEFED
          - state_machines.Crew.BRIEFED_to_CLEARED_TO_WORK
          - state_machines.TimeSheet.SUBMITTED_to_HELD
        distinguishing_aspect: |
          Crew readiness dimension (entity 2, distinct from AssistanceRequest):
          CLEARED_TO_WORK -> SAFETY_HOLD -> BRIEFED -> CLEARED_TO_WORK cycle driven
          by a post-suspension re-briefing; the HELD timesheet round-trips back to
          SUBMITTED on hold release — and mobility_status stays ARRIVED throughout,
          proving the two dimensions evolve independently.
        test_recipe:
