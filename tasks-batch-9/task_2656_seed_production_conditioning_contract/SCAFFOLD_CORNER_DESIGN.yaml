        claim_type: variant_divergence
        grounds: [calculations.field_eligibility_assessment.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / eligibility_variant_divergence_strict_vs_decay
          rationale: "STRICT_HISTORY INELIGIBLE versus DECAY_WEIGHTED ELIGIBLE on identical field data is asserted there."

