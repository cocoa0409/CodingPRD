  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ov_auction_saleroom_halfopen
        grounds:
          - validations[priority=14]
          - errors[ERR_SALEROOM_DOUBLE_BOOKED]
          - entities.Auction.fields.saleroom_id
        distinguishing_aspect: "Two auctions on one saleroom collide iff [start,end) overlap; [10:00,12:00) vs [11:00,13:00) collides, but back-to-back [12:00,14:00) is allowed — half-open intervals, no buffer."
        test_recipe:
          setup:
            - "Saleroom sr hosts auction au1 over [2026-06-10T10:00,12:00)."
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "A1", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T12:00:00Z" }
              as: AuctionStaff
              captures: { au1: "$.data.id" }
          trigger:
            - call: "POST /auctions"
              payload: { title: "A2", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T11:00:00Z", scheduled_end: "2026-06-10T13:00:00Z" }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
            - call: "POST /auctions"
              payload: { title: "A3", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T12:00:00Z", scheduled_end: "2026-06-10T14:00:00Z" }
              as: AuctionStaff
              captures: { au3_status: "$.data.status" }
          assert:
            - "${err} == 'ERR_SALEROOM_DOUBLE_BOOKED'"
            - "${au3_status} == 'SCHEDULED'"

      - name: ov_consignor_intake_buffer
        grounds:
          - validations[priority=15]
          - errors[ERR_INTAKE_WINDOW_CONFLICT]
          - entities.Consignment.fields.intake_window_start
        distinguishing_aspect: "Two intake windows for one consignor must be >= 60 minutes apart (closed intervals + buffer): a 30-minute gap collides, but exactly a 60-minute gap is allowed — different interval semantics (closed+buffer) than the half-open saleroom rule."
        test_recipe:
          setup:
            - "Consignor cn has consignment cg1 with intake window [2026-05-02T09:00,10:00]."
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg1: "$.data.id" }
          trigger:
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T10:30:00Z", intake_window_end: "2026-05-02T11:00:00Z" }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T11:00:00Z", intake_window_end: "2026-05-02T12:00:00Z" }
              as: AuctionStaff
              captures: { cg3_status: "$.data.status" }
          assert:
            - "${err} == 'ERR_INTAKE_WINDOW_CONFLICT'"
            - "${cg3_status} == 'SUBMITTED'"

