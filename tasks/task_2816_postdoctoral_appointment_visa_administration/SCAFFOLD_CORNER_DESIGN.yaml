            - "${a72_v1} == 1"
            - "${a72_exc1} == 60000.00"
            - "${a72_v2} == ${a72_v1} + 1"
            - "the second exception carrying the pre-exception version http_status == 412"
            - "${occ_exc_err} == ERR_STALE_APPOINTMENT_VERSION"
            - "${a72_v2_check} == ${a72_v2}"
            - "${a72_exc_check} == 60000.00"
            - "${a72_exc2} == 59000.00"
            - "${a72_v3} == ${a72_v2} + 1"
            - "${a72_comp} == CLEARED"
            - "the first bench grant http_status == 201"
            - "${g72a_status} == PROVISIONED"
            - "${a72_v_accept} == ${a72_vg} + 1"
            - "the second bench grant carrying the pre-acceptance version http_status == 412"
            - "${occ_grant_err} == ERR_STALE_APPOINTMENT_VERSION"
