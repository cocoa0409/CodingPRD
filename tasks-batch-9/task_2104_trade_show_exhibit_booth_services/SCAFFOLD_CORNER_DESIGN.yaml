      - call: POST /shows
        payload:
          venue_id: ${venue_id}
          name: AutoTech 2026
          discount_deadline: '2026-09-01T00:00:00Z'
          advance_warehouse_deadline: '2026-09-10T00:00:00Z'
          move_in_start: '2026-09-19T08:00:00Z'
          move_in_end: '2026-09-20T18:00:00Z'
          show_open: '2026-09-21T09:00:00Z'
          show_close: '2026-09-23T17:00:00Z'
          move_out_end: '2026-09-25T18:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
        captures:
          show_id: $.data.id
      - call: POST /shows/${show_id}/status
        payload:
          to_status: OPEN_FOR_ORDERS
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
      trigger:
      - call: POST /booths
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          booth_number: '1024'
          sqft: 400
          booth_type: PERIMETER
        as: ShowOperations
        as_user_id: ops-1
        captures:
          err: $.data.error_id
      assert:
      - HTTP status is 400
      - ${err} == ERR_INVALID_REQUEST
      - GET /booths?show_id=${show_id} returns 0 rows
  - name: service_order_line_is_immutable_and_carries_no_version
    claim_type: immutability
    grounds:
    - entities.ServiceOrderLine
    - endpoints[GET /service-orders/{id}/lines]
    distinguishing_aspect: 'ServiceOrderLine is declared common_fields false: each line comes back with id, created_at, line_seq and line_total_cents but no version and no updated_at, and no endpoint mutates a line directly.'
    test_recipe:
      setup:
      - A show OPEN_FOR_ORDERS with one two-line ADVANCE-tier service order
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /venues
        payload:
          name: Metro Convention Center
          city: Chicago
          max_forklift_capacity_lbs: 6000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          venue_id: $.data.id
      - call: POST /shows
        payload:
          venue_id: ${venue_id}
          name: AutoTech 2026
          discount_deadline: '2026-09-01T00:00:00Z'
          advance_warehouse_deadline: '2026-09-10T00:00:00Z'
          move_in_start: '2026-09-19T08:00:00Z'
          move_in_end: '2026-09-20T18:00:00Z'
          show_open: '2026-09-21T09:00:00Z'
          show_close: '2026-09-23T17:00:00Z'
          move_out_end: '2026-09-25T18:00:00Z'
        as: ShowOperations
        as_user_id: ops-1
        captures:
          show_id: $.data.id
      - call: POST /shows/${show_id}/status
        payload:
          to_status: OPEN_FOR_ORDERS
        as: ShowOperations
        as_user_id: ops-1
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
      - call: POST /booths
        payload:
          show_id: ${show_id}
          exhibitor_id: ${ex_id}
          booth_number: '1024'
          sqft: 400
          booth_type: ISLAND
        as: ShowOperations
        as_user_id: ops-1
        captures:
          booth_id: $.data.id
          booth_v: $.data.version
      - call: POST /service-orders
        payload:
          booth_id: ${booth_id}
          service_type: ELECTRICAL
          lines: &id001
          - line_seq: 1
            catalog_item_code: ELEC-20A
            unit_qty: 4
            unit_rate_cents: 32500
            discount_pct: 0
          - line_seq: 2
            catalog_item_code: ELEC-LBR
            unit_qty: 3
            unit_rate_cents: 21750
            discount_pct: 0.1
          expected_booth_version: ${booth_v}
        as: Exhibitor
        as_user_id: ${ex_id}
        captures:
          so_id: $.data.id
      trigger:
      - call: GET /service-orders/${so_id}/lines
        payload: {}
        as: ShowOperations
        as_user_id: ops-1
      assert:
      - HTTP status is 200
      - response_type == array
      - data holds exactly 2 ServiceOrderLine rows
      - row with line_seq 1 has line_total_cents == 130000
      - row with line_seq 2 has line_total_cents == 58725
      - no row carries a version field
      - no row carries an updated_at field
  - name: create_jurisdiction_under_missing_venue_returns_404
    claim_type: parent_relationships
    grounds:
    - errors[ERR_VENUE_NOT_FOUND]
    - endpoints[POST /venues/{id}/union-jurisdictions]
    distinguishing_aspect: POST /venues/{unknown}/union-jurisdictions returns ERR_VENUE_NOT_FOUND at HTTP 404 because the path parent is validated left to right before the body is considered.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /venues/00000000-0000-4000-8000-000000000000/union-jurisdictions
        payload:
          trade: ELECTRICAL
          straight_time_rate_cents_per_hour: 11000
        as: ShowOperations
        as_user_id: ops-1
