            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-C201-FAN", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 20 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
