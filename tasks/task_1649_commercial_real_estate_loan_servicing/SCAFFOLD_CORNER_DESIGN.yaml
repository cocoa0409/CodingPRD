  # ==================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: response_envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Success bodies carry meta.api_request_id, meta.api_request_timestamp, response_type, data; error bodies carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /borrowers", payload: { legal_name: "Env Co", tax_id: "TX-ENV", contact_email: "env@x.com" }, as: MasterServicer, captures: { ok_id: $.data.id } }
            - { call: "GET /loans/00000000-0000-0000-0000-000000000000", as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "success: meta.api_request_id and meta.api_request_timestamp present, response_type == 'object', data.id present"
            - "error: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty"
      - name: retainage_release_blocked_then_allowed
        claim_type: conditional_action
        grounds:
          - "endpoints[\"POST /disbursement-requests/{id}/release-retainage\"]"
          - "validations[priority=15]"
        distinguishing_aspect: "Release is gated on a COMPLETED inspection with completed_at >= funded_at: before any inspection -> 409 ERR_RETAINAGE_RELEASE_BLOCKED; after one completes -> 200, retained_cents zeroed, reserve debited."
        test_recipe:
          setup: ["clean loan with property; reserve deposit 1000000; draw one line 100000 retainage 0.10 approved and funded at clock 2026-08-01 (funded 90000, retained 10000); inspector registered"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Rel Co", tax_id: "TX-REL", contact_email: "rel@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-REL", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Rel St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id } }
            - { call: "POST /reserve-accounts/${r_id}/deposits", payload: { amount_cents: 1000000 }, as: MasterServicer, captures: { r_v: $.data.version } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "roof", amount_cents: 100000 } ], retainage_pct: 0.10, expected_reserve_account_version: "${r_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /disbursement-requests/${d_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer }
            - { call: "POST /disbursement-requests/${d_id}/fund", as: MasterServicer, payload: {} }
            - { call: "POST /inspectors", payload: { full_name: "Rel Spect", license_no: "LIC-REL" }, as: MasterServicer, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /disbursement-requests/${d_id}/release-retainage", as: MasterServicer, payload: {}, captures: { err: $.data.error_id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T12:00:00Z", scheduled_end: "2026-08-01T13:00:00Z" }, as: MasterServicer, captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/close", payload: { outcome: "COMPLETED", condition_rating: "GOOD" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "POST /disbursement-requests/${d_id}/release-retainage", as: MasterServicer, payload: {}, captures: { d_ret: $.data.retained_cents } }
            - { call: "GET /reserve-accounts/${r_id}", as: MasterServicer, captures: { r_bal: $.data.balance_cents, r_ret: $.data.retained_cents } }
          assert:
            - "first release -> 409 ERR_RETAINAGE_RELEASE_BLOCKED (no COMPLETED inspection with completed_at >= funded_at)"
            - "after inspection completes (completed_at == funded_at date, inclusive >= passes): release succeeds, request retained_cents == 0"
            - "reserve balance_cents == 900000 (1000000 - 90000 funded - 10000 released), retained_cents == 0"

  # ==================================================================
  - section: rbac
    instances:
      - name: rbac_exclusive_operation_denials
        claim_type: role_denial
        grounds:
          - "roles[MasterServicer].exclusive_operations"
          - "roles[SpecialServicer].exclusive_operations"
          - "roles[Borrower].exclusive_operations"
          - "roles[Inspector].exclusive_operations"
        distinguishing_aspect: "Exclusive operations refuse other roles with 403 ERR_UNAUTHORIZED: SpecialServicer cannot onboard borrowers, MasterServicer cannot waive or reinstate, Borrower cannot escalate, Inspector cannot schedule inspections."
        test_recipe:
          setup: ["borrower, loan (T3 threshold 1.20) with an OPEN DSCR assessment (NOI 15000000 accepted) so a waiver target exists, and a POOR-inspection watchlist entry so an escalate target exists"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Rbac Co", tax_id: "TX-RBC", contact_email: "rbc@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-RBC", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Rbac St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 15000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer, as_user_id: "ms_user_1" }
            - { call: "GET /loans/${l_id}/covenant-assessments", as: MasterServicer, captures: { a_id: "$.data[0].id" } }
            - { call: "POST /inspectors", payload: { full_name: "Rbac Spect", license_no: "LIC-RBC" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: MasterServicer, captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/close", payload: { outcome: "COMPLETED", condition_rating: "POOR" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "GET /loans/${l_id}/watchlist-entries", as: MasterServicer, captures: { w_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /borrowers", payload: { legal_name: "SS Onboard", tax_id: "TX-SSO", contact_email: "sso@x.com" }, as: SpecialServicer, captures: { e1: $.data.error_id } }
            - { call: "POST /covenant-assessments/${a_id}/waive", payload: { waiver_reason: "ms attempt" }, as: MasterServicer, captures: { e2: $.data.error_id } }
            - { call: "POST /watchlist-entries/${w_id}/escalate", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { e3: $.data.error_id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: Inspector, as_user_id: "${i_id}", captures: { e4: $.data.error_id } }
          assert:
            - "all four return 403 with error_id == ERR_UNAUTHORIZED"
            - "assessment still OPEN; entry still ACTIVE; no borrower or inspection created"
      - name: rbac_conditional_close_outcome_denials
        claim_type: role_denial
        grounds:
          - "endpoints[\"POST /inspections/{id}/close\"]"
        distinguishing_aspect: "Conditional authorization on one endpoint: outcome COMPLETED is Inspector(assigned)-only, outcome CANCELLED is MasterServicer-only — each role attempting the other's outcome gets 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["loan with property; two SCHEDULED inspections assigned to inspector I1"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Close Co", tax_id: "TX-CLO", contact_email: "clo@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CLO", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Clo St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "Clo Spect", license_no: "LIC-CLO" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: MasterServicer, captures: { in1_id: $.data.id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: MasterServicer, captures: { in2_id: $.data.id } }
          trigger:
            - { call: "POST /inspections/${in1_id}/close", payload: { outcome: "COMPLETED", condition_rating: "GOOD" }, as: MasterServicer, captures: { e1: $.data.error_id } }
            - { call: "POST /inspections/${in2_id}/close", payload: { outcome: "CANCELLED" }, as: Inspector, as_user_id: "${i_id}", captures: { e2: $.data.error_id } }
          assert:
            - "MasterServicer attempting COMPLETED -> 403 ERR_UNAUTHORIZED (completion is inspector-exclusive)"
            - "Inspector attempting CANCELLED -> 403 ERR_UNAUTHORIZED (cancellation is servicer-exclusive)"
            - "both inspections remain SCHEDULED"

  # ==================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_disbursement_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[disbursement-create-stale-reserve]"
        distinguishing_aspect: "Creating a draw with expected_reserve_account_version one behind the current version (a deposit landed in between) -> 412 ERR_STALE_VERSION; nothing persisted."
        test_recipe:
          setup: ["clean loan; TI_LC reserve created (version 1 observed), then a deposit of 1000000 bumps it to version 2"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "OccR Co", tax_id: "TX-OCR", contact_email: "ocr@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OCR", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id, r_v1: $.data.version } }
            - { call: "POST /reserve-accounts/${r_id}/deposits", payload: { amount_cents: 1000000 }, as: MasterServicer }
          trigger:
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "stale", amount_cents: 5000 } ], expected_reserve_account_version: "${r_v1}" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
            - { call: "GET /reserve-accounts/${r_id}", as: MasterServicer, captures: { r_v2: $.data.version } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "fresh", amount_cents: 5000 } ], expected_reserve_account_version: "${r_v2}" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          assert:
            - "stale create -> 412 ERR_STALE_VERSION"
            - "fresh create with the post-deposit version -> 201 SUBMITTED"
      - name: occ_assumption_create_stale_loan_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[assumption-create-stale-loan]"
        distinguishing_aspect: "Loan version moved by a delinquency mark+cure cycle (v1 -> v3) since the client read it: assumption create carrying the v1 expectation -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["clean loan (version captured at creation); payment-status DELINQUENT then CURRENT (two mutations, version now 3)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "OccL Co", tax_id: "TX-OCL", contact_email: "ocl@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OCL", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id, l_v1: $.data.version } }
            - { call: "POST /loans/${l_id}/payment-status", payload: { to_status: "DELINQUENT" }, as: MasterServicer }
            - { call: "POST /loans/${l_id}/payment-status", payload: { to_status: "CURRENT" }, as: MasterServicer }
          trigger:
            - { call: "POST /loans/${l_id}/assumption-requests", payload: { proposed_assumptor_name: "Stale Buyer", proposed_assumptor_tax_id: "TX-STB", proposed_net_worth_cents: 900000000, expected_loan_version: "${l_v1}" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "412 with error_id == ERR_STALE_VERSION; no AssumptionRequest persisted"
      - name: loan_derived_fields_reconcile
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Loan.fields.current_dscr"
          - "entities.Loan.fields.days_delinquent"
        excluded_because:
          difficulty_instance: watchlist_risk_score_tiered_with_synergy
          rationale: "That instance asserts current_dscr == 0.9500, current_ltv == 0.7000 and days_delinquent == 30 after the mutating chain — derived-field reconciliation is verified there."

  # ==================================================================
  - section: consistency_model
    instances:
      - name: review_response_reflects_transition_immediately
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[\"POST /financial-statements/{id}/review\"]"
        distinguishing_aspect: "Immediate consistency: the review response itself carries the ACCEPTED status and reviewed_by_user_id, and a subsequent GET agrees — no lag."
        test_recipe:
          setup: ["loan with one SUBMITTED rent roll"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Imm Co", tax_id: "TX-IMM", contact_email: "imm@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-IMM", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "RENT_ROLL", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", occupancy_pct: 95 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer, as_user_id: "ms_user_9", captures: { st: $.data.status, rev: $.data.reviewed_by_user_id } }
            - { call: "GET /financial-statements/${s_id}", as: MasterServicer, captures: { st2: $.data.status } }
          assert:
            - "review response: status == ACCEPTED and reviewed_by_user_id == ms_user_9 in the same response"
            - "GET afterwards: status == ACCEPTED (no reconciliation lag)"
