          difficulty_instance: transitive_cascade / validate_hapi_cascades_case_rca_unit_posture_and_order_hold
          rationale: "That §1.8 instance walks hops 1 -> 1b -> 2 -> 3 -> 4 -> 5 of the single validate call and asserts each hop's mutation plus the ordering dependency between them, which is exactly this layer's claim."

      - name: dual_variant_acuity_delta_on_variant_switch
        claim_type: dual_variant_calculation
        grounds:
          - calculations.consult_acuity_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / consult_acuity_provisional_vs_final_diverges
          rationale: "Both variants of consult_acuity_score are computed on the same wound there and the band/SLA delta on the switch is asserted, so a second layer-level instance would restate it."

  # ==========================================================================
  # SECTION: consistency_model  (claim-extraction-guide section 9).
  # complexity_profile.consistency_model is `immediate`, so there is exactly one
  # applicable row: every mutation — including every hop of the deepest cascade
  # in the scaffold — must be observable in the same request's response and in
  # the very next read, with no lag, no retry and no reconciliation step.
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_hop_is_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED
          - calculations.consult_acuity_score
          - calculations.poa_determination
          - endpoints[GET /consult-requests/{consult_id}]
          - endpoints[GET /pressure-injury-cases/{case_id}]
          - endpoints[GET /units/{unit_id}]
          - endpoints[GET /skin-assessments]
        distinguishing_aspect: "One validate call mutates four different entities across four hops, and every one of them is readable at once: the response body already carries the post-hop-1 assessment, and the four reads that follow with no intervening call show the recomputed acuity/band/SLA, the reclassified case, the incremented unit counter, and a filtered LIST projection that agrees field-for-field with the single-entity read."
        test_recipe:
          setup:
            - "Unit U1 exists with open_hapi_rca_count 0 and survey_posture OPEN."
            - "Patient P1 was admitted 2026-07-30T00:00:00Z on U1 with comorbidity_count 2 and device_related_risk true, so its POA window closed at 2026-07-31T00:00:00Z."
            - "WocNurse N1 is CANDIDATE; ConsultRequest C1 (WOUND, reported_stage STAGE_2) was triaged at the default clock 2026-08-01T00:00:00Z — intake_provisional acuity 55.0 (35 + 10 + 10), band P2, sla_due_at 2026-08-02T00:00:00Z — then assigned to N1."
            - "N1 filed SkinAssessment A1 on the SACRUM with observed_stage STAGE_2 and measured_area_cm2 12.0 at observed_at 2026-08-01T00:00:00Z, which recomputed C1 under assessed_final to 60.0 (35 + 10 + 10 + 5), still band P2, and auto-created PressureInjuryCase K1 (UNDETERMINED / OPEN)."
            - "The logical clock stays at 2026-08-01T00:00:00Z for the whole recipe, so every timestamp below is exact rather than approximate."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "IMM-U1", name: "Immediate Probe Med-Surg", bed_count: 18, rental_budget_cap_cents: 100000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "IMMMRN0001", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z", comorbidity_count: 2, device_related_risk: true, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Ida Immediate", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Device-related sacral breakdown under the immobiliser." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_2", measured_area_cm2: 12.0, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: false }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "GET /pressure-injury-cases?skin_assessment_id=${a1_id}"
              payload: {}
              as: WocProgramDirector
              captures: { k1_id: "$.data[0].id" }
          trigger:
            - call: "POST /skin-assessments/${a1_id}/validate"
              payload: { confirmed_stage: "STAGE_3", present_on_admission_confirmed: false }
              as: WocProgramDirector
            - call: "GET /consult-requests/${c1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "GET /pressure-injury-cases/${k1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "GET /units/${u1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "GET /skin-assessments?patient_id=${p1_id}&validation_status=VALIDATED"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "Call 1's own response body (not a later read) already shows validation_status == VALIDATED, confirmed_stage == STAGE_3, poa_determination == HAPI, validated_by_user_id set and version == 2"
            - "Call 2 shows hop 1b with no lag: ConsultRequest.${c1_id}.acuity_score == 85.0 (STAGE_3 weight 60 + 10 comorbidity + 10 device + 5 area, TYPE_MULTIPLIER 1.0), acuity_variant == ASSESSED_FINAL, priority_band == P1 (up from P2) and sla_due_at == 2026-08-01T04:00:00Z, re-anchored on the original triaged_at 2026-08-01T00:00:00Z with the P1 SLA of 4 hours"
            - "Call 2 also shows status == ASSESSED and version == 5 (1 create, +1 triage, +1 assign, +1 assessment, +1 validate hop 1b)"
            - "Call 3 shows hops 2 and 3 with no lag: PressureInjuryCase.${k1_id}.classification == HAPI, status == RCA_REQUIRED, rca_due_at == 2026-08-04T00:00:00Z (clock + RCA_DUE_HOURS) and version == 3 (1 create, +1 hop 2, +1 hop 3)"
            - "Call 4 shows hop 4 with no lag: Unit.${u1_id}.open_hapi_rca_count == 1, survey_posture == OPEN (one open RCA is below the RESTRICTED floor of 2) and version == 2"
            - "Call 5 shows the negative half of hop 1: Patient.${p1_id}.poa_skin_assessment_documented == false and version == 2 — the POA-only Patient write did NOT fire on a HAPI determination, so the only bump came from filing the assessment"
            - "Call 6 proves the list projection is not a lagging denormalisation: total_count == 1 and data[0] carries id == ${a1_id}, validation_status == VALIDATED, confirmed_stage == STAGE_3 and poa_determination == HAPI — identical to call 1's body"
            - "No hop needed a second request, a retry or a reconciliation step to become visible; the whole cascade is observable immediately after the single validate call"
