      - name: unsecured_limit_takes_the_lesser_of_tier_cap_and_ebitda_share
        claim_type: threshold
        grounds:
          - calculations.unsecured_credit_limit
          - calculations.offtaker_credit_tier
          - entities.Offtaker.fields.unsecured_credit_limit_usd
        distinguishing_aspect: |
          The limit is a min() of two limbs and each limb must be able to win. A PRIME
          buyer on 60000000.00 of EBITDA is bound by the EBITDA share (3000000.00 <
          25000000.00), while a PRIME buyer on 900000000.00 is bound by the hard tier
          cap (25000000.00 < 45000000.00) - and the DECLINED buyer is 0.00 by both
          limbs at once, which is the case an implementation that indexes
          TIER_EBITDA_PCT without a DECLINED key crashes on. Three buyers, three
          different limbs of the same formula.
        test_recipe:
          setup:
            - "Three buyers submitted for qualification: a PRIME buyer with small EBITDA, a PRIME buyer with very large EBITDA, and a buyer whose score lands in DECLINED."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { small_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Aurora Holdings PLC", credit_rating: "AA", rating_agency: "SP", reported_ebitda_usd: 900000000.00, net_debt_to_ebitda: 1.0, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { large_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Deadbeat Industries Ltd", credit_rating: "CCC", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 8.0, disclosure_framework: "NONE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { declined_id: $.data.id }
            - call: "POST /ppa/offtakers/${small_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${large_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
          trigger:
            - call: "POST /ppa/offtakers/${declined_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "Offtaker.${small_id}: credit_score 83.70, credit_tier PRIME, unsecured_credit_limit_usd == 3000000.00 = min(25000000.00, round(60000000.00 * 0.05, 2)) - the EBITDA limb binds"
            - "Offtaker.${large_id}: credit_score == 92.60 = 0.55*92 + 0.30*90 + 0.15*100, credit_tier PRIME, unsecured_credit_limit_usd == 25000000.00 = min(25000000.00, 45000000.00) - the tier cap binds"
            - "the trigger returns 200 with Offtaker.${declined_id}.credit_score == 21.50 = 0.55*20 + 0.30*20 + 0.15*30, credit_tier DECLINED"
            - "Offtaker.${declined_id}.unsecured_credit_limit_usd == 0.00 by both limbs (TIER_CAP_USD.DECLINED 0.00 and TIER_EBITDA_PCT.DECLINED 0.00), not an error and not null"
            - "no deal exists yet, so no collateral_threshold_usd has been snapshotted anywhere - the limit is an Offtaker-level figure until a deal copies it"

      - name: credit_support_requirement_rounds_up_to_a_whole_increment
        claim_type: aggregation
        grounds:
          - calculations.credit_support_requirement
          - calculations.deal_expected_volume
          - endpoints.POST_/ppa/deals
          - entities.Deal.fields.credit_support_required_usd
        distinguishing_aspect: |
          Two deals for the same PRIME buyer straddle the collateral threshold. The
          50 MW deal is 280620.00 over the 3000000.00 line, which is 1.12248
          increments - and the requirement is 500000.00, not 250000.00 (round-half-up
          of 1.12) and not 280620.00 (the raw residual). The 25 MW deal sits under the
          line and requires nothing at all. The ceiling is applied to the residual
          after netting, not to the gross exposure, so an implementation that ceils
          exposure/increment would demand 3250000.00 on the first deal.
        test_recipe:
          setup:
            - "CHAIN A through the QUALIFIED buyer and a 100 MW PRE_DEVELOPMENT solar project; no deal yet."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 50.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 26.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { over_deal_id: $.data.id }
          trigger:
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { under_deal_id: $.data.id }
          assert:
            - "Deal.${over_deal_id}.expected_annual_mwh == 122640.00 = round(50.000 * 0.28 * 8760, 2) and contract_price_usd_per_mwh == 26.75 = 26.00 + 0.00 shape + 0.75 SHARED basis"
            - "Deal.${over_deal_id}.exposure_usd == 3280620.00 = round(122640.00 * 26.75, 2) and collateral_threshold_usd == 3000000.00, snapshotted from the buyer"
            - "Deal.${over_deal_id}.credit_support_required_usd == 500000.00: residual 280620.00, 280620.00 / 250000.00 = 1.12248, ceil -> 2 increments"
            - "that value is specifically NOT 250000.00 (round-half-up of 1.12248), NOT 280620.00 (the raw residual) and NOT 3250000.00 (ceiling of the gross exposure)"
            - "the trigger returns 201 with Deal.${under_deal_id}.exposure_usd == 1394550.00 = round(61320.00 * 22.75, 2), which is at or below the 3000000.00 threshold"
            - "Deal.${under_deal_id}.credit_support_required_usd == 0.00 and credit_status == NOT_SUBMITTED, so the under-threshold branch demands nothing"
            - "Project.${project_id}.contracted_mw == 75.000 and available_mw == 25.000 after both deals, and both deals share the same 3000000.00 threshold snapshot"

      - name: deemed_expected_mwh_rounds_half_up_at_the_fourth_decimal
        claim_type: precision
        grounds:
          - calculations.deemed_generation
          - endpoints.POST_/ppa/settlement-periods/{id}/calculate
          - entities.MeterInterval.fields.expected_mwh
        distinguishing_aspect: |
          33.333 MW of wind gives an hourly expectation of 13.99986 MWh exactly, which
          is the one place in the scenario where the fourth decimal is decided by the
          rounding mode: round_half_up gives 13.9999, truncation gives 13.9998 and a
          two-decimal implementation gives 14.00. The hour is uncurtailed, so
          deemed_mwh must be exactly 0.0000 and delivered_mwh must equal the metered
          10.0000 - the precise expectation is computed and stored even when it is not
          used to make anyone whole.
        test_recipe:
          setup:
            - "CHAIN C on a 100 MW WIND project driven to OPERATIONAL before the deal is written, so the execute call finds the empty CP template and the deal becomes EFFECTIVE in one request."
