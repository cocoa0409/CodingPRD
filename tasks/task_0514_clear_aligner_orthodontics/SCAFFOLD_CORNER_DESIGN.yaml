scaffold_corner_design:
  # ═══════════════════════════════════════════════════════════════════════════
  # Section: entities
  # ═══════════════════════════════════════════════════════════════════════════
  - section: entities
    instances:
      - name: create_patient_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /patients with email, full_name, state_code, date_of_birth returns 201 and a server-minted id with is_minor_at_intake defaulting false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { email: "new@x.com", full_name: "New Pat", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
          assert:
            - "response.status == 201"
            - "Patient.${pid}.full_name == New Pat"
            - "Patient.${pid}.is_minor_at_intake == false"

      - name: get_patient_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Patient, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /patients/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_case_missing_required_list_price_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.TreatmentCase.fields.list_price_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases omitting list_price_cents (required, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { email: "req@x.com", full_name: "Req", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT" }
              as: Patient
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_bad_intake_channel_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.TreatmentCase.fields.intake_channel, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases with intake_channel='MAIL' (not in enum {IMPRESSION_KIT, IN_OFFICE_SCAN}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { email: "enum@x.com", full_name: "Enum", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "MAIL", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: case_system_id_and_status_ignored_from_input
        claim_type: System Fields
        grounds: [entities.TreatmentCase.fields.status, entities.TreatmentCase]
        distinguishing_aspect: "POST /cases initializes status=INTAKE_PENDING server-side; a status value in the request body is ignored, and id/created_at/version are server-minted."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { email: "sys@x.com", full_name: "Sys", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "TreatmentCase.${cid}.status == INTAKE_PENDING"
            - "TreatmentCase.${cid}.version == 1"

      - name: is_minor_at_intake_computed_true_for_recent_dob
        claim_type: Computed Fields
        grounds: [entities.Patient.fields.is_minor_at_intake, entities.IntakeRecord.fields.captured_at]
        distinguishing_aspect: "A patient born 2012-01-01 with intake captured at the default clock (2026-05-01) is age 14 < 18, so is_minor_at_intake computes true after the intake is captured."
        test_recipe:
          setup: ["Clock at default 2026-05-01; patient DOB 2012-01-01; case + intake created."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { email: "minor2@x.com", full_name: "Minor2", state_code: "CA", date_of_birth: "2012-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id }
            - call: "POST /cases/${cid}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TKM2" }
              as: Patient
              as_user_id: "${pid}"
          trigger:
            - call: "GET /patients/${pid}"
              payload: {}
              as: BillingAdmin
              captures: { minor: $.data.is_minor_at_intake }
          assert:
            - "Patient.${pid}.is_minor_at_intake == true"

      - name: list_cases_pagination_envelope
        claim_type: Listing
        grounds: [entities.TreatmentCase, endpoints]
        distinguishing_aspect: "GET /cases returns an array envelope with pagination fields total_count and has_more honoring default limit 10."
        test_recipe:
          setup: ["At least one case exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { email: "list@x.com", full_name: "List", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
          trigger:
            - call: "GET /cases"
              payload: {}
              as: BillingAdmin
          assert:
            - "response.response_type == array"
            - "response.meta.total_count >= 1"
            - "response.meta.has_more == false"

  # ═══════════════════════════════════════════════════════════════════════════
  # Section: state_machines
  # ═══════════════════════════════════════════════════════════════════════════
  - section: state_machines
    instances:
      - name: approve_from_draft_plan_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentPlan.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a plan still in DRAFT (never SUBMITTED) is not a defined transition and returns ERR_INVALID_STATE (409); the case stays UNDER_REVIEW."
        test_recipe:
          setup: ["Case UNDER_REVIEW with a DRAFT plan (not yet submitted)."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr X1", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "sm1@x.com", full_name: "SM1", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id }
            - call: "POST /cases/${cid}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TKS1" }
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /cases/${cid}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /plans"
              payload: { case_id: "${cid}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TreatmentCase.${cid}.status == UNDER_REVIEW"

      - name: cancel_retainer_twice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RetainerSubscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED RetainerSubscription is terminal; a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COMPLETED case with an ACTIVE retainer that is then cancelled."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr X2", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "ret@x.com", full_name: "Ret", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id }
            - call: "POST /cases/${cid}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TKR" }
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /cases/${cid}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /plans"
              payload: { case_id: "${cid}", author_clinician_id: "${clin_id}", proposed_step_count: 1, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${cid}", term_months: 12, down_payment_cents: 240000, apr_bps: 0 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "POST /cases/${cid}/activate"
              payload: {}
              as: ManufacturingOps
            - call: "GET /cases/${cid}/aligner-steps"
              payload: {}
              as: ManufacturingOps
              captures: { s1: "$.data[0].id" }
            - call: "POST /aligner-steps/${s1}/complete-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /shipments"
              payload: { step_id: "${s1}", carrier_code: "GROUND", window_start: "2026-05-02T00:00:00Z", window_end: "2026-05-03T00:00:00Z" }
              as: ManufacturingOps
              captures: { sh1: $.data.id }
            - call: "POST /shipments/${sh1}/dispatch"
              payload: {}
              as: ManufacturingOps
            - call: "POST /cases/${cid}/checkins"
              payload: { reported_step_index: 1, photo_quality_score: 0.9 }
              as: Patient
              as_user_id: "${pid}"
              captures: { chk: $.data.id }
            - call: "POST /checkins/${chk}/assess"
              payload: { tracking_assessment: "ON_TRACK" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /cases/${cid}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /retainers"
              payload: { case_id: "${cid}", cadence: "QUARTERLY", per_shipment_fee_cents: 5000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
          trigger:
            - call: "POST /retainers/${ret_id}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "RetainerSubscription.${ret_id}.status == CANCELLED"

      - name: refinement_grant_increments_count_and_billable_on_second
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TreatmentCase.ACTIVE_to_REFINEMENT
          - calculations.refinement_fee
          - entities.TreatmentCase.fields.refinement_count
          - entities.RefinementRequest.fields.is_billable
        distinguishing_aspect: "The 1st granted refinement (refinement_count pre=0) is free (is_billable=false); after one more cycle, the 2nd grant (pre=1 >= INCLUDED_REFINEMENTS) is billable and raises total_contracted_cents by 30000."
        test_recipe:
          setup: ["Case ACTIVE with an OFF_TRACK checkin; one refinement already GRANTED (count=1) and resumed; a second OFF_TRACK checkin and refinement REQUESTED."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr X3", license_state_codes: ["CA"], role_type: "ORTHODONTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "ref2@x.com", full_name: "Ref2", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id }
            - call: "POST /cases/${cid}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TKR2" }
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /cases/${cid}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /plans"
              payload: { case_id: "${cid}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${cid}", term_months: 12, down_payment_cents: 300000, apr_bps: 0 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "POST /cases/${cid}/activate"
              payload: {}
              as: ManufacturingOps
            - call: "POST /cases/${cid}/checkins"
              payload: { reported_step_index: 1, photo_quality_score: 0.9 }
              as: Patient
              as_user_id: "${pid}"
              captures: { chk1: $.data.id }
            - call: "POST /checkins/${chk1}/assess"
              payload: { tracking_assessment: "OFF_TRACK" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /refinements"
              payload: { case_id: "${cid}", triggering_checkin_id: "${chk1}", additional_step_count: 2 }
              as: Patient
              as_user_id: "${pid}"
              captures: { ref1: $.data.id }
            - call: "POST /refinements/${ref1}/grant"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /cases/${cid}/resume"
              payload: {}
              as: ManufacturingOps
            - call: "POST /cases/${cid}/checkins"
              payload: { reported_step_index: 2, photo_quality_score: 0.9 }
              as: Patient
              as_user_id: "${pid}"
              captures: { chk2: $.data.id }
            - call: "POST /checkins/${chk2}/assess"
              payload: { tracking_assessment: "OFF_TRACK" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /refinements"
              payload: { case_id: "${cid}", triggering_checkin_id: "${chk2}", additional_step_count: 2 }
              as: Patient
              as_user_id: "${pid}"
              captures: { ref2: $.data.id }
          trigger:
            - call: "POST /refinements/${ref2}/grant"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { bill: $.data.is_billable }
            - call: "GET /cases/${cid}"
              payload: {}
              as: BillingAdmin
              captures: { tc: $.data.total_contracted_cents, rc: $.data.refinement_count }
          assert:
            - "RefinementRequest.${ref2}.is_billable == true"
            - "TreatmentCase.${cid}.refinement_count == 2"
            - "TreatmentCase.${cid}.total_contracted_cents == 330000"

      - name: refinement_first_grant_free_count_one
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TreatmentCase.ACTIVE_to_REFINEMENT
          - calculations.refinement_fee
          - entities.RefinementRequest.fields.is_billable
        distinguishing_aspect: "The very first granted refinement (refinement_count pre=0 < INCLUDED_REFINEMENTS=1) is free: is_billable=false and total_contracted_cents is unchanged at 300000."
        test_recipe:
          setup: ["Case ACTIVE with an OFF_TRACK checkin; a first refinement REQUESTED."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr X3b", license_state_codes: ["CA"], role_type: "ORTHODONTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "ref1@x.com", full_name: "Ref1", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id }
            - call: "POST /cases/${cid}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TKR1" }
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /cases/${cid}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /plans"
              payload: { case_id: "${cid}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${cid}", term_months: 12, down_payment_cents: 300000, apr_bps: 0 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "POST /cases/${cid}/activate"
              payload: {}
              as: ManufacturingOps
            - call: "POST /cases/${cid}/checkins"
              payload: { reported_step_index: 1, photo_quality_score: 0.9 }
              as: Patient
              as_user_id: "${pid}"
              captures: { chk1: $.data.id }
            - call: "POST /checkins/${chk1}/assess"
              payload: { tracking_assessment: "OFF_TRACK" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /refinements"
              payload: { case_id: "${cid}", triggering_checkin_id: "${chk1}", additional_step_count: 2 }
              as: Patient
              as_user_id: "${pid}"
              captures: { ref1: $.data.id }
          trigger:
            - call: "POST /refinements/${ref1}/grant"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { bill: $.data.is_billable }
            - call: "GET /cases/${cid}"
              payload: {}
              as: BillingAdmin
              captures: { tc: $.data.total_contracted_cents, rc: $.data.refinement_count }
          assert:
            - "RefinementRequest.${ref1}.is_billable == false"
            - "TreatmentCase.${cid}.refinement_count == 1"
            - "TreatmentCase.${cid}.total_contracted_cents == 300000"

      - name: start_production_out_of_order_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=13]", state_machines.AlignerStep.PLANNED_to_IN_PRODUCTION, "errors[ERR_STEP_ORDER_VIOLATION]"]
        distinguishing_aspect: "Starting production on step 2 while step 1 is only MANUFACTURED (not SHIPPED) returns ERR_STEP_ORDER_VIOLATION (422)."
        test_recipe:
          setup: ["Case ACTIVE; step 1 MANUFACTURED (not shipped); step 2 PLANNED."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr X4", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "ord@x.com", full_name: "Ord", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pid: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pid}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pid}"
              captures: { cid: $.data.id }
            - call: "POST /cases/${cid}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TKO" }
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /cases/${cid}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pid}"
            - call: "POST /plans"
              payload: { case_id: "${cid}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
