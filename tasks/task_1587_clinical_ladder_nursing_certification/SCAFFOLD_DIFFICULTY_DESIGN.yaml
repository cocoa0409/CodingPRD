              as: Nurse
              as_user_id: "${nv_id}"
              captures: { w_err: $.data.error_id }
          assert:
            - "w_err == ERR_INVALID_STATE (parent Application WITHDRAWN blocks scoring of its PENDING assignment)"

      - name: claim_approve_gated_by_certification_current
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
          - state_machines.Certification.CURRENT_to_LAPSED
          - validations[priority=25]
        distinguishing_aspect: |
          Entity pair ReimbursementClaim -> Certification (different pair from
          ReviewAssignment -> Application): approving a claim is rejected when
          the underlying certification has LAPSED between claim submission and
          approval, even though the claim itself is SUBMITTED.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse E holds BASIC certification expiring 2026-08-10"
            - "Claim submitted on 2026-08-01 while certification CURRENT"
