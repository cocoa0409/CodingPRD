          - validations.priority_27
          - validations.priority_46
          - validations.priority_47
          - validations.priority_56
          - validations.priority_60
          - validations.priority_61
        distinguishing_aspect: |
          Six warranty codes are separated on one dealer: a hull that never
          shipped is 409, 2.99 mm of deformation is 422 while exactly 3.00 mm is
          accepted, a VERIFIED storage review is 422 when the dealer never
          acknowledged the guidance although a VIOLATED review needs no
          acknowledgement, a repeat review is 409 ALREADY_DONE, a repeat waiver
          is 409 NOT_WAIVABLE, and once the dealer is SUSPENDED intake answers
          ERR_CUSTOMER_NOT_ACTIVE ahead of the undelivered-hull check.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls SELLABLE and STORED."
            - "Customer CUS-CD-1 which has NEVER acknowledged the storage guidance, so storage_guidance_acknowledged_at is null."
            - "Shipment SHP-CD-2 with trailer_cube_capacity_m3 3.0000 carrying hull 1 only: 2.0000 of 3.0000 is 66.67 pct, above the 60.00 seal floor, so hull 1 becomes DELIVERED at 2026-08-02T00:00:00Z while hull 2 stays STORED."
