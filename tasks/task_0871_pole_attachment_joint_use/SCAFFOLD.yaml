# =============================================================================
# Pole-Attachment & Joint-Use Management — Seed Tables (Expert)
# =============================================================================

scenario: |
  Pole-Attachment & Joint-Use Management: pole inventory & owner, attachment application
  & make-ready survey, engineering & fee/rental, permit & FCC shot-clock, field audit &
  unauthorized attachment, transfer & abandonment, invoicing, dispute

domain_name: pole-attachment-joint-use
api_prefix: /joint-use

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [dual_variant_calculation, cascading_side_effects, optimistic_concurrency, scheduled_actions]

  entity_topology: flat
  # Peer entities under a common /joint-use prefix, wired by FK references
  # (pole_id, attacher_id, application_id, ...) rather than nested URL ownership.

  state_machine_shape: branching
  # AttachmentApplication forks ESTIMATE_ACCEPTED -> {PERMIT_GRANTED, PERMIT_DENIED}
  # with divergent side-effect sets; Dispute is cyclic (UNDER_REVIEW <-> INFO_REQUESTED).

  relationship_patterns:
    - one_to_many          # PoleOwner -> Poles/Crews; Attacher -> Applications/Attachments/Invoices
    - cross_aggregate      # Application references Pole and Attacher across aggregate boundaries
    - polymorphic          # Dispute subject is either an Invoice or an UnauthorizedAttachmentFinding

  role_model: segregation_of_duties
  # Four-eyes: the Engineer who signs a make-ready survey (surveyor_user_id) MUST NOT be
  # the PermitOfficer who grants/denies the resulting permit (permit_officer_user_id).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PoleOwner
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered name of the pole-owning utility" }
      - { name: owner_category, type: enum, source: input, description: "ELECTRIC_UTILITY | ILEC | MUNICIPAL", constraints: "one of {ELECTRIC_UTILITY, ILEC, MUNICIPAL}" }
      - { name: annual_rental_rate_cents, type: integer, source: input, description: "Annual pole-attachment rental in cents per 12 inches of occupied communication space per year" }
      - { name: make_ready_labor_rate_cents_per_hour, type: integer, source: input, description: "Labor rate in cents/hour used by the make-ready fee calculation" }

  - name: MakeReadyCrew
    parent: null
    common_fields: true
    fields:
      - { name: pole_owner_id, type: string, source: input, description: "FK -> PoleOwner.id; the owner that fields this make-ready crew" }
      - { name: crew_name, type: string, source: input, description: "Crew label" }
      - { name: region, type: string, source: input, description: "Service region tag" }

  - name: Pole
    parent: null
    common_fields: true
    fields:
      - { name: pole_owner_id, type: string, source: input, description: "FK -> PoleOwner.id; owner of this pole" }
      - { name: tag, type: string, source: input, description: "Owner-scoped external pole number; unique within pole_owner_id" }
      - { name: height_ft, type: integer, source: input, description: "Total pole height in feet (informational)" }
      - { name: usable_communication_space_inches, type: integer, source: input, description: "Total vertical communication space (inches) available for attachments" }
      - { name: occupied_space_inches, type: integer, source: computed, description: "SUM(Attachment.allotted_space_inches WHERE pole_id==this AND status==ACTIVE); starts 0" }
      - { name: reserved_space_inches, type: integer, source: computed, description: "SUM(AttachmentApplication.reserved_space_inches WHERE pole_id==this AND status==ESTIMATE_ACCEPTED); starts 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE (initial) -> RETIRED", constraints: "one of {ACTIVE, RETIRED}" }

  - name: Attacher
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Attaching entity name (CATV/telecom/ISP)" }
      - { name: cin, type: string, source: input, description: "Company identification number; globally unique" }
      - { name: contact_email, type: string, source: input, description: "Billing/notice contact" }
      - { name: credit_limit_cents, type: integer, source: input, default: 5000000, description: "Max allowed outstanding balance; accept-estimate is blocked above it" }
      - { name: account_balance_cents, type: integer, source: computed, description: "SUM(Invoice.amount_cents WHERE attacher_id==this AND status IN {ISSUED, OVERDUE}); starts 0" }

  - name: AttachmentApplication
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; the pole the attacher wants to attach to" }
      - { name: attacher_id, type: string, source: input, description: "FK -> Attacher.id; the applicant" }
      - { name: requested_space_inches, type: integer, source: input, description: "Vertical communication space requested (inches, > 0)" }
      - { name: requested_position_inches, type: integer, source: input, description: "Requested attachment position: height above ground in inches (> 0)" }
      - { name: purpose, type: enum, source: input, description: "FIBER | COAX | POWER_SUPPLY | WIRELESS", constraints: "one of {FIBER, COAX, POWER_SUPPLY, WIRELESS}" }
      - { name: reserved_space_inches, type: integer, source: system, description: "Space reserved on the pole while status==ESTIMATE_ACCEPTED (equals requested_space_inches); 0 otherwise" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: surveyed_at, type: datetime, source: system, description: "Logical clock when the make-ready survey was submitted; null until then" }
      - { name: estimate_issued_at, type: datetime, source: system, description: "Logical clock when the engineering estimate was issued; refreshed on re-issue; null until then" }
      - { name: estimate_expires_at, type: datetime, source: computed, description: "estimate_issued_at + ESTIMATE_VALIDITY_DAYS; null until an estimate is issued" }
      - { name: estimate_accepted_at, type: datetime, source: system, description: "Logical clock when the estimate was accepted; null until then" }
      - { name: survey_deadline, type: datetime, source: computed, description: "submitted_at + SURVEY_SHOT_CLOCK_DAYS (FCC shot clock)" }
      - { name: estimate_deadline, type: datetime, source: computed, description: "surveyed_at + ESTIMATE_SHOT_CLOCK_DAYS; null until surveyed" }
      - { name: permit_deadline, type: datetime, source: computed, description: "estimate_accepted_at + PERMIT_SHOT_CLOCK_DAYS; null until accepted" }
      - { name: make_ready_required, type: boolean, source: system, description: "Copied from the make-ready survey; null until surveyed" }
      - { name: make_ready_fee_estimate_cents, type: integer, source: computed, description: "Make-ready fee, ESTIMATE variant (forward-looking, +CONTINGENCY_PCT); set when estimate issued" }
      - { name: make_ready_fee_final_cents, type: integer, source: computed, description: "Make-ready fee, FINAL variant (actual labor hours, no contingency); set at permit grant" }
      - { name: annual_rental_fee_cents, type: integer, source: computed, description: "First partial-year prorated rental for this attachment; set at permit grant" }
      - { name: surveyor_user_id, type: string, source: system, description: "X-User-ID of the Engineer who submitted the survey (SoD anchor); null until surveyed" }
      - { name: permit_officer_user_id, type: string, source: system, description: "X-User-ID of the PermitOfficer who ruled on the permit; null until permit decision" }
      - { name: permit_decision, type: enum, source: system, description: "GRANTED | DENIED; null until decided", constraints: "one of {GRANTED, DENIED}" }
      - { name: permit_issued_at, type: datetime, source: system, description: "Logical clock at the permit decision; null until decided" }
      - { name: shot_clock_status, type: enum, source: computed, description: "ON_TIME if permit_issued_at <= permit_deadline else LATE; null until decided", constraints: "one of {ON_TIME, LATE}" }
      - { name: make_ready_invoice_id, type: string, source: system, description: "Id of the MAKE_READY invoice issued at accept-estimate (reverse index: Invoice.application_id); null until accepted" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> SURVEYED -> ESTIMATE_ISSUED -> {ESTIMATE_ACCEPTED, ESTIMATE_REJECTED, ESTIMATE_EXPIRED}; ESTIMATE_ACCEPTED -> {PERMIT_GRANTED, PERMIT_DENIED}; any non-terminal -> WITHDRAWN", constraints: "one of {SUBMITTED, SURVEYED, ESTIMATE_ISSUED, ESTIMATE_ACCEPTED, ESTIMATE_REJECTED, ESTIMATE_EXPIRED, PERMIT_GRANTED, PERMIT_DENIED, WITHDRAWN}" }

  - name: MakeReadySurvey
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AttachmentApplication.id; the application surveyed" }
      - { name: crew_id, type: string, source: input, description: "FK -> MakeReadyCrew.id; crew booked for the make-ready window" }
      - { name: surveyor_user_id, type: string, source: system, description: "X-User-ID of the Engineer submitting the survey" }
      - { name: window_start, type: datetime, source: input, description: "Make-ready field-work window start (ISO 8601)" }
      - { name: window_end, type: datetime, source: input, description: "Make-ready field-work window end (must be > window_start)" }
      - { name: estimated_labor_hours, type: number, source: input, description: "Estimated make-ready labor hours (>= 0)" }
      - { name: make_ready_required, type: boolean, source: input, description: "Whether any make-ready work is needed at all" }
      - { name: existing_attacher_count, type: integer, source: input, description: "Count of existing attachers whose lines must be transferred (>= 0)" }
      - { name: complexity_class, type: enum, source: input, description: "SIMPLE | COMPLEX (drives the labor multiplier)", constraints: "one of {SIMPLE, COMPLEX}" }
      - { name: findings, type: string, source: input, description: "Free-text survey findings" }

  - name: Attachment
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; pole the equipment is attached to" }
      - { name: attacher_id, type: string, source: input, description: "FK -> Attacher.id; current owner of the attachment" }
      - { name: application_id, type: string, source: input, description: "FK -> AttachmentApplication.id; the granting application (null for attachments created by finding legalization)" }
      - { name: allotted_space_inches, type: integer, source: system, description: "Vertical space occupied on the pole (inches)" }
      - { name: position_inches, type: integer, source: system, description: "Attachment position (height above ground, inches); occupies [position_inches, position_inches + allotted_space_inches]" }
      - { name: authorized, type: boolean, source: system, description: "true if created via a granted permit; false if created by legalizing an unauthorized finding" }
      - { name: transferred_from_attacher_id, type: string, source: system, description: "Prior owner's attacher id if this attachment was created by a transfer (audit pointer); null otherwise" }
      - { name: status, type: enum, source: system, description: "ACTIVE (initial) -> {TRANSFERRED, ABANDONED}", constraints: "one of {ACTIVE, TRANSFERRED, ABANDONED}" }

  - name: UnauthorizedAttachmentFinding
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; pole where the unauthorized attachment was found" }
      - { name: attacher_id, type: string, source: input, description: "FK -> Attacher.id; the responsible attacher" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the FieldAuditor who logged the finding" }
      - { name: audited_at, type: datetime, source: system, description: "Logical clock when the finding was logged" }
      - { name: discovered_space_inches, type: integer, source: input, description: "Vertical space the unauthorized attachment occupies (inches, > 0)" }
      - { name: discovered_position_inches, type: integer, source: input, description: "Position (height above ground, inches) of the unauthorized attachment (> 0)" }
      - { name: good_faith, type: boolean, source: input, description: "true selects the GOOD_FAITH back-rental variant, false selects BAD_FAITH" }
      - { name: estimated_install_years_ago, type: integer, source: input, description: "Estimated years the unauthorized attachment has existed (>= 1); used by the BAD_FAITH variant" }
      - { name: penalty_cents, type: integer, source: computed, description: "Tiered unauthorized-attachment penalty" }
      - { name: back_rental_cents, type: integer, source: computed, description: "Back rental (dual-variant GOOD_FAITH vs BAD_FAITH)" }
      - { name: penalty_invoice_id, type: string, source: system, description: "Id of the UNAUTHORIZED invoice raised at finding creation (reverse index: Invoice.finding_id)" }
      - { name: resulting_attachment_id, type: string, source: system, description: "Id of the Attachment created when the finding is legalized (reverse index returned on this finding); null otherwise" }
      - { name: status, type: enum, source: system, description: "FLAGGED (initial) -> {LEGALIZED, REMOVED, DISPUTED}; DISPUTED -> {LEGALIZED, REMOVED}", constraints: "one of {FLAGGED, LEGALIZED, REMOVED, DISPUTED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: attacher_id, type: string, source: input, description: "FK -> Attacher.id; billed party" }
      - { name: pole_owner_id, type: string, source: input, description: "FK -> PoleOwner.id; owner context for ANNUAL_RENTAL true-up; null for other types" }
      - { name: application_id, type: string, source: system, description: "FK -> AttachmentApplication.id; set for MAKE_READY / first-year ANNUAL_RENTAL invoices; null otherwise" }
      - { name: finding_id, type: string, source: system, description: "FK -> UnauthorizedAttachmentFinding.id; set for UNAUTHORIZED invoices; null otherwise" }
      - { name: invoice_type, type: enum, source: input, description: "MAKE_READY | ANNUAL_RENTAL | UNAUTHORIZED", constraints: "one of {MAKE_READY, ANNUAL_RENTAL, UNAUTHORIZED}" }
      - { name: amount_cents, type: integer, source: computed, description: "Invoice total in cents" }
      - { name: line_items, type: array, source: computed, description: "List of {label, attachment_id?, amount_cents} rows; ANNUAL_RENTAL rounds each line then sums" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: due_at, type: datetime, source: computed, description: "issued_at + INVOICE_DUE_DAYS" }
      - { name: status, type: enum, source: system, description: "ISSUED (initial) -> {PAID, VOID, OVERDUE}; OVERDUE -> {PAID, VOID}", constraints: "one of {ISSUED, PAID, VOID, OVERDUE}" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: attacher_id, type: string, source: input, description: "FK -> Attacher.id; the disputing attacher" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; disputed invoice (exactly one of invoice_id / finding_id set)" }
      - { name: finding_id, type: string, source: input, description: "FK -> UnauthorizedAttachmentFinding.id; disputed finding (exactly one of invoice_id / finding_id set)" }
      - { name: reason, type: string, source: input, description: "Free-text dispute grounds" }
      - { name: round_count, type: integer, source: computed, description: "Number of INFO_REQUESTED->UNDER_REVIEW cycles completed; starts 0" }
      - { name: resolution, type: enum, source: system, description: "UPHELD | ADJUSTED; null until resolved", constraints: "one of {UPHELD, ADJUSTED}" }
      - { name: adjusted_amount_cents, type: integer, source: input, description: "New invoice amount applied on an ADJUSTED resolution; null otherwise" }
      - { name: status, type: enum, source: system, description: "OPEN (initial) -> UNDER_REVIEW <-> INFO_REQUESTED; UNDER_REVIEW -> {RESOLVED_UPHELD, RESOLVED_ADJUSTED}; any non-terminal -> WITHDRAWN", constraints: "one of {OPEN, UNDER_REVIEW, INFO_REQUESTED, RESOLVED_UPHELD, RESOLVED_ADJUSTED, WITHDRAWN}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Pole
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /joint-use/poles/{poleId}/retire"
        actor: JointUseCoordinator
        preconditions:
          - "occupied_space_inches == 0 AND reserved_space_inches == 0 (ERR_POLE_HAS_ATTACHMENTS)"
          - "no AttachmentApplication for this pole in a non-terminal status {SUBMITTED, SURVEYED, ESTIMATE_ISSUED, ESTIMATE_ACCEPTED} (ERR_POLE_HAS_ATTACHMENTS)"
        side_effects: []

  - entity: AttachmentApplication
    initial_state: SUBMITTED
    terminal_states: [ESTIMATE_REJECTED, ESTIMATE_EXPIRED, PERMIT_GRANTED, PERMIT_DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SURVEYED
        trigger: "POST /joint-use/applications/{appId}/survey"
        actor: Engineer
        preconditions:
          - "Pole.status == ACTIVE (cross-entity; ERR_POLE_NOT_ACTIVE)"
          - "MakeReadyCrew exists and belongs to the pole's owner (ERR_CREW_NOT_FOUND)"
          - "window_end > window_start (ERR_INVALID_WINDOW)"
          - "crew has no other survey window overlapping [window_start, window_end) — half-open, adjacency allowed (ERR_CREW_DOUBLE_BOOKED)"
        side_effects:
          - "create MakeReadySurvey with surveyor_user_id = X-User-ID"
          - "copy make_ready_required, surveyor_user_id onto the application"
          - "set surveyed_at = clock; estimate_deadline = surveyed_at + ESTIMATE_SHOT_CLOCK_DAYS"

      - from: SURVEYED
        to: ESTIMATE_ISSUED
        trigger: "POST /joint-use/applications/{appId}/estimate"
        actor: Engineer
        preconditions:
          - "expected_application_version matches AttachmentApplication.version (ERR_STALE_VERSION)"
        side_effects:
          - "compute make_ready_fee_estimate_cents (ESTIMATE variant) and annual_rental_fee_cents preview"
          - "set estimate_issued_at = clock; estimate_expires_at = estimate_issued_at + ESTIMATE_VALIDITY_DAYS"
          - "increments AttachmentApplication.version by 1"
        note: "Re-callable while ESTIMATE_ISSUED to re-issue a revised estimate (supersede); see concurrency_rules."

      - from: ESTIMATE_ISSUED
        to: ESTIMATE_ISSUED
        trigger: "POST /joint-use/applications/{appId}/estimate"
        actor: Engineer
        preconditions:
          - "expected_application_version matches AttachmentApplication.version (ERR_STALE_VERSION)"
        side_effects:
          - "recompute make_ready_fee_estimate_cents and annual_rental_fee_cents preview (supersedes prior estimate)"
          - "refresh estimate_issued_at = clock; estimate_expires_at = estimate_issued_at + ESTIMATE_VALIDITY_DAYS"
          - "increments AttachmentApplication.version by 1"

      - from: ESTIMATE_ISSUED
        to: ESTIMATE_EXPIRED
        trigger: "system (POST /_clock/set_current_utc when clock > estimate_expires_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ESTIMATE_ISSUED
        to: ESTIMATE_ACCEPTED
        trigger: "POST /joint-use/applications/{appId}/estimate-decision (decision=ACCEPT)"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this application: X-User-ID == attacher_id (ERR_UNAUTHORIZED)"
          - "clock <= estimate_expires_at, i.e. status is still ESTIMATE_ISSUED not ESTIMATE_EXPIRED (ERR_ESTIMATE_EXPIRED)"
          - "requested_space_inches <= Pole.usable_communication_space_inches - occupied_space_inches - reserved_space_inches (ERR_INSUFFICIENT_POLE_SPACE)"
          - "Attacher.account_balance_cents + make_ready_fee_estimate_cents <= Attacher.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "set reserved_space_inches = requested_space_inches (Pole.reserved_space_inches rises)"
          - "issue MAKE_READY Invoice for make_ready_fee_estimate_cents; set make_ready_invoice_id"
          - "Attacher.account_balance_cents recomputed upward"
          - "set estimate_accepted_at = clock; permit_deadline = estimate_accepted_at + PERMIT_SHOT_CLOCK_DAYS"

      - from: ESTIMATE_ISSUED
        to: ESTIMATE_REJECTED
        trigger: "POST /joint-use/applications/{appId}/estimate-decision (decision=REJECT)"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this application (ERR_UNAUTHORIZED)"
        side_effects: []

      - from: ESTIMATE_ACCEPTED
        to: PERMIT_GRANTED
        trigger: "POST /joint-use/applications/{appId}/permit (decision=GRANTED)"
        actor: PermitOfficer
        preconditions:
          - "X-User-ID != surveyor_user_id (four-eyes SoD; ERR_SEGREGATION_OF_DUTIES)"
          - "no ACTIVE Attachment on the pole whose [position, position+space] is within CLEARANCE_INCHES (= 12) inches of [requested_position_inches, requested_position_inches + requested_space_inches] (ERR_CLEARANCE_VIOLATION)"
        side_effects:
          - "set permit_officer_user_id = X-User-ID; permit_decision = GRANTED; permit_issued_at = clock"
          - "compute shot_clock_status (ON_TIME if permit_issued_at <= permit_deadline else LATE)"
          - "compute make_ready_fee_final_cents (FINAL variant using actual_labor_hours); true-up MAKE_READY invoice amount to final fee; Attacher.account_balance_cents recomputed"
          - "create Attachment (ACTIVE, authorized=true, allotted_space_inches=requested_space_inches, position_inches=requested_position_inches)"
          - "convert reservation to occupancy: reserved_space_inches -> 0; Pole.occupied_space_inches rises by allotted_space_inches"
          - "compute annual_rental_fee_cents (first partial-year proration); issue first-year ANNUAL_RENTAL Invoice; Attacher.account_balance_cents recomputed"

      - from: ESTIMATE_ACCEPTED
        to: PERMIT_DENIED
        trigger: "POST /joint-use/applications/{appId}/permit (decision=DENIED)"
        actor: PermitOfficer
        preconditions:
          - "X-User-ID != surveyor_user_id (four-eyes SoD; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set permit_officer_user_id = X-User-ID; permit_decision = DENIED; permit_issued_at = clock"
          - "release reservation: reserved_space_inches -> 0 (Pole.reserved_space_inches falls)"
          - "CASCADE: MAKE_READY invoice (make_ready_invoice_id) -> VOID"
          - "CASCADE(link): voided invoice drops out of Attacher.account_balance_cents (recomputed downward)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /joint-use/applications/{appId}/withdraw"
        actor: Attacher
        preconditions: ["acting Attacher owns this application (ERR_UNAUTHORIZED)"]
        side_effects: []
      - from: SURVEYED
        to: WITHDRAWN
        trigger: "POST /joint-use/applications/{appId}/withdraw"
        actor: Attacher
        preconditions: ["acting Attacher owns this application (ERR_UNAUTHORIZED)"]
        side_effects: []
      - from: ESTIMATE_ISSUED
        to: WITHDRAWN
        trigger: "POST /joint-use/applications/{appId}/withdraw"
        actor: Attacher
        preconditions: ["acting Attacher owns this application (ERR_UNAUTHORIZED)"]
        side_effects: []
      - from: ESTIMATE_ACCEPTED
        to: WITHDRAWN
        trigger: "POST /joint-use/applications/{appId}/withdraw"
        actor: Attacher
        preconditions: ["acting Attacher owns this application (ERR_UNAUTHORIZED)"]
        side_effects:
          - "release reservation: reserved_space_inches -> 0 (Pole.reserved_space_inches falls)"
          - "CASCADE: MAKE_READY invoice (make_ready_invoice_id) -> VOID; Attacher.account_balance_cents recomputed downward"

  - entity: Attachment
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED, ABANDONED]
    transitions:
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /joint-use/attachments/{attId}/transfer"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this attachment: X-User-ID == attacher_id (ERR_UNAUTHORIZED)"
          - "new_attacher_id references an existing Attacher (ERR_ATTACHER_NOT_FOUND)"
        side_effects:
          - "create a new ACTIVE Attachment (same pole_id, allotted_space_inches, position_inches, authorized=true) owned by new_attacher_id, transferred_from_attacher_id = prior owner"
          - "Pole.occupied_space_inches net unchanged (old attachment leaves ACTIVE set, new one enters)"
        note: "Compensating pair on pole occupied space: -allotted (old TRANSFERRED) then +allotted (new ACTIVE) nets to zero."

      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /joint-use/attachments/{attId}/abandon"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this attachment: X-User-ID == attacher_id (ERR_UNAUTHORIZED)"
        side_effects:
          - "Pole.occupied_space_inches falls by allotted_space_inches (space released)"

  - entity: UnauthorizedAttachmentFinding
    initial_state: FLAGGED
    terminal_states: [LEGALIZED, REMOVED]
    transitions:
      - from: FLAGGED
        to: DISPUTED
        trigger: "system (POST /joint-use/disputes with finding_id set)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FLAGGED
        to: LEGALIZED
        trigger: "POST /joint-use/findings/{findingId}/resolve (resolution=LEGALIZE)"
        actor: JointUseCoordinator
        preconditions:
          - "Pole.status == ACTIVE (cross-entity; ERR_POLE_NOT_ACTIVE)"
          - "discovered_space_inches <= Pole.usable_communication_space_inches - occupied_space_inches - reserved_space_inches (ERR_INSUFFICIENT_POLE_SPACE)"
        side_effects:
          - "create Attachment (ACTIVE, authorized=false, allotted_space_inches=discovered_space_inches, position_inches=discovered_position_inches, attacher_id=finding.attacher_id); set resulting_attachment_id"
          - "Pole.occupied_space_inches rises by discovered_space_inches"

      - from: DISPUTED
        to: LEGALIZED
        trigger: "POST /joint-use/findings/{findingId}/resolve (resolution=LEGALIZE)"
        actor: JointUseCoordinator
        preconditions:
          - "Pole.status == ACTIVE (ERR_POLE_NOT_ACTIVE)"
          - "discovered_space_inches <= Pole.usable_communication_space_inches - occupied_space_inches - reserved_space_inches (ERR_INSUFFICIENT_POLE_SPACE)"
        side_effects:
          - "same as FLAGGED -> LEGALIZED"

      - from: FLAGGED
        to: REMOVED
        trigger: "POST /joint-use/findings/{findingId}/resolve (resolution=REMOVE)"
        actor: JointUseCoordinator
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: REMOVED
        trigger: "POST /joint-use/findings/{findingId}/resolve (resolution=REMOVE)"
        actor: JointUseCoordinator
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /joint-use/invoices/{invoiceId}/pay"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this invoice: X-User-ID == attacher_id (ERR_UNAUTHORIZED)"
          - "no non-terminal Dispute (status IN {OPEN, UNDER_REVIEW, INFO_REQUESTED}) references this invoice (cross-entity; ERR_INVOICE_UNDER_DISPUTE)"
        side_effects:
          - "Attacher.account_balance_cents falls by amount_cents (invoice leaves the {ISSUED, OVERDUE} set)"
      - from: OVERDUE
        to: PAID
        trigger: "POST /joint-use/invoices/{invoiceId}/pay"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this invoice (ERR_UNAUTHORIZED)"
          - "no non-terminal Dispute references this invoice (ERR_INVOICE_UNDER_DISPUTE)"
        side_effects:
          - "Attacher.account_balance_cents falls by amount_cents"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (POST /_clock/set_current_utc when clock > due_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "POST /joint-use/invoices/{invoiceId}/void  OR  cascade from permit DENIED / application WITHDRAWN"
        actor: JointUseCoordinator
        preconditions: []
        side_effects:
          - "Attacher.account_balance_cents falls by amount_cents"
      - from: OVERDUE
        to: VOID
        trigger: "POST /joint-use/invoices/{invoiceId}/void"
        actor: JointUseCoordinator
        preconditions: []
        side_effects:
          - "Attacher.account_balance_cents falls by amount_cents"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=UNDER_REVIEW)"
        actor: JointUseCoordinator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=INFO_REQUESTED)"
        actor: JointUseCoordinator
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=UNDER_REVIEW)"
        actor: Attacher
        preconditions:
          - "acting Attacher owns this dispute: X-User-ID == attacher_id (ERR_UNAUTHORIZED)"
        side_effects:
          - "round_count += 1 (one negotiation cycle completed)"
        note: "Cyclic: UNDER_REVIEW <-> INFO_REQUESTED can repeat any number of rounds."
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=RESOLVED_UPHELD)"
        actor: JointUseCoordinator
        preconditions: []
        side_effects:
          - "if finding_id set: finding stays as-is; if invoice_id set: invoice unchanged"
      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=RESOLVED_ADJUSTED, adjusted_amount_cents=N)"
        actor: JointUseCoordinator
        preconditions:
          - "invoice_id is set and its Invoice.status IN {ISSUED, OVERDUE} (ERR_INVALID_STATE)"
          - "adjusted_amount_cents provided and >= 0 (ERR_VALIDATION)"
        side_effects:
          - "set resolution = ADJUSTED"
          - "CASCADE: Invoice.amount_cents := adjusted_amount_cents"
          - "CASCADE(link): Attacher.account_balance_cents recomputed from the new invoice amount"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=WITHDRAWN)"
        actor: Attacher
        preconditions: ["acting Attacher owns this dispute (ERR_UNAUTHORIZED)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=WITHDRAWN)"
        actor: Attacher
        preconditions: ["acting Attacher owns this dispute (ERR_UNAUTHORIZED)"]
        side_effects: []
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /joint-use/disputes/{disputeId}/transition (to_state=WITHDRAWN)"
        actor: Attacher
        preconditions: ["acting Attacher owns this dispute (ERR_UNAUTHORIZED)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-issue-stale-application
    parent_entity: AttachmentApplication
    write_endpoint: "POST /joint-use/applications/{appId}/estimate"
    occ_field: "expected_application_version"
    description: |
      Issuing an engineering estimate against an application whose version has
      advanced since the Engineer last observed it is rejected. A prior estimate
      issue legitimately supersedes the fee preview and bumps the application
      version; a second issue still carrying the stale version is rejected on
      the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: make_ready_fee
    trigger: "estimate issue (ESTIMATE variant) and permit grant (FINAL variant)"
    algorithm: surcharge_stack
    formula: |
      labor_rate = pole.owner.make_ready_labor_rate_cents_per_hour
      mult = COMPLEXITY_MULTIPLIER_COMPLEX if complexity_class == COMPLEX else COMPLEXITY_MULTIPLIER_SIMPLE
      if not make_ready_required:
        base_labor = 0
      else:
        base_labor = hours * labor_rate * mult          # ESTIMATE uses estimated_labor_hours; FINAL uses actual_labor_hours
      transfer_cost = existing_attacher_count * PER_EXISTING_ATTACHER_TRANSFER_CENTS
      subtotal = base_labor + transfer_cost
      ESTIMATE variant: fee = round_half_up(subtotal * (1 + CONTINGENCY_PCT))
      FINAL variant:    fee = round_half_up(subtotal)     # actual hours, NO contingency
    input_set: "single application's survey; existing_attacher_count is the surveyed count"
    constants:
      PER_EXISTING_ATTACHER_TRANSFER_CENTS: 7500
      COMPLEXITY_MULTIPLIER_SIMPLE: 1.0
      COMPLEXITY_MULTIPLIER_COMPLEX: 1.75
      CONTINGENCY_PCT: 0.15
    precision: "integer cents, round_half_up"
    variants:
      - name: ESTIMATE
        when: "at estimate issue; uses estimated_labor_hours and adds a contingency buffer"
        difference: "multiplies subtotal by (1 + CONTINGENCY_PCT)"
      - name: FINAL
        when: "at permit grant; uses actual_labor_hours reported by the PermitOfficer"
        difference: "no contingency; the MAKE_READY invoice is trued-up by (FINAL - ESTIMATE)"
    note: "Dual-variant across the Application/Estimate domain; pairs with back_rental_and_penalty on the Finding domain."

  - name: annual_rental_true_up
    trigger: "POST /joint-use/invoices for an ANNUAL_RENTAL true-up over an attacher's active attachments under one pole owner"
    algorithm: aggregation
    formula: |
      candidates = Attachment WHERE attacher_id == invoice.attacher_id
                   AND status == ACTIVE
                   AND pole.pole_owner_id == invoice.pole_owner_id
      order candidates by created_at ASC (stable; no id tie-break)
      per_line(a) = round_half_up(owner.annual_rental_rate_cents * a.allotted_space_inches / 12)
      amount_cents = SUM over ordered candidates of per_line(a)     # ROUND PER LINE, THEN SUM (pinned)
      line_items = [{attachment_id: a.id, amount_cents: per_line(a)} for a in candidates]
    input_set: "ACTIVE attachments of the attacher on poles owned by pole_owner_id"
    constants: {}
    precision: "integer cents, round_half_up; rounding applied per line BEFORE summation"
    note: |
      Nested-rounding order matters: round-per-line-then-sum differs from sum-then-round.
      Example rate=1000, three ACTIVE attachments of 1 inch each: per_line=83 each ->
      sum=249, NOT round(1000*3/12)=250. The pinned order yields 249.

  - name: annual_rental_first_year_proration
    trigger: "permit grant"
    algorithm: threshold
    formula: |
      full_year = owner.annual_rental_rate_cents * attachment.allotted_space_inches / 12
      remaining_days = (date(permit_issued_at.year, 12, 31) - date(permit_issued_at)).days + 1
      annual_rental_fee_cents = round_half_up(full_year * remaining_days / DAYS_IN_YEAR)
    input_set: "the single attachment created at grant"
    constants:
      DAYS_IN_YEAR: 365
    precision: "integer cents, round_half_up"

  - name: back_rental_and_penalty
    trigger: "unauthorized-attachment finding creation"
    algorithm: tiered_pricing
    formula: |
      annual_line = round_half_up(owner.annual_rental_rate_cents * discovered_space_inches / 12)
      # Penalty tier (threshold on discovered_space_inches):
      penalty_cents = PENALTY_TIER1_CENTS if discovered_space_inches <= UNAUTHORIZED_TIER1_MAX_INCHES
                      else PENALTY_TIER2_CENTS
      # Back rental (dual-variant):
      GOOD_FAITH variant (good_faith == true): back_rental_cents = annual_line * BACK_RENTAL_GOOD_FAITH_YEARS
      BAD_FAITH  variant (good_faith == false): back_rental_cents = annual_line * min(estimated_install_years_ago, BACK_RENTAL_BAD_FAITH_MAX_YEARS)
      UNAUTHORIZED invoice amount = penalty_cents + back_rental_cents
    input_set: "single finding; owner is the pole's owner"
    constants:
      UNAUTHORIZED_TIER1_MAX_INCHES: 12
      PENALTY_TIER1_CENTS: 25000
      PENALTY_TIER2_CENTS: 50000
      BACK_RENTAL_GOOD_FAITH_YEARS: 1
      BACK_RENTAL_BAD_FAITH_MAX_YEARS: 5
    precision: "integer cents, round_half_up"
    variants:
      - name: GOOD_FAITH
        when: "good_faith == true"
        difference: "back rental is exactly BACK_RENTAL_GOOD_FAITH_YEARS (1) year"
      - name: BAD_FAITH
        when: "good_faith == false"
        difference: "back rental is min(estimated_install_years_ago, 5) years — multi-year exposure"
    note: "Dual-variant on the Finding (compliance) domain; distinct from make_ready_fee (cost accounting)."

  - name: shot_clock_status
    trigger: "permit decision (grant or deny)"
    algorithm: threshold
    formula: |
      permit_deadline = estimate_accepted_at + PERMIT_SHOT_CLOCK_DAYS days
      shot_clock_status = ON_TIME if permit_issued_at <= permit_deadline else LATE   # boundary: equality is ON_TIME
    input_set: "single application"
    constants:
      SURVEY_SHOT_CLOCK_DAYS: 45
      ESTIMATE_SHOT_CLOCK_DAYS: 14
      PERMIT_SHOT_CLOCK_DAYS: 60
      ESTIMATE_VALIDITY_DAYS: 30
      INVOICE_DUE_DAYS: 30
    precision: "whole days on the logical clock; boundary is inclusive (<=)"

  - name: pole_occupied_space
    trigger: "any attachment create/transfer/abandon; permit grant; finding legalize"
    algorithm: aggregation
    formula: |
      Pole.occupied_space_inches = SUM(Attachment.allotted_space_inches
                                       WHERE pole_id == Pole.id AND status == ACTIVE)
    input_set: "ACTIVE attachments on the pole"
    constants: {}
    precision: "integer inches"
    note: "Conservation invariant: forward (attach/legalize) and compensating (abandon) keep this equal to the ACTIVE sum."

  - name: attacher_account_balance
    trigger: "any invoice issue/pay/void/amount-adjust"
    algorithm: aggregation
    formula: |
      Attacher.account_balance_cents = SUM(Invoice.amount_cents
                                          WHERE attacher_id == Attacher.id AND status IN {ISSUED, OVERDUE})
    input_set: "the attacher's ISSUED and OVERDUE invoices"
    constants: {}
    precision: "integer cents"
    note: "Conservation invariant: forward (issue) and compensating (void/adjust) keep this equal to the outstanding sum."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per the RBAC matrix (incl. entity_backed ownership: acting Attacher's X-User-ID equals the resource's attacher_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all mutating endpoints

  - priority: 3
    category: existence
    check: "Path and referenced FK resources exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or FK inputs

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers positive where required, window_end > window_start"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all POST endpoints
    note: "ERR_INVALID_WINDOW is the window-specific variant for survey windows."

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the transition (includes application ESTIMATE_EXPIRED blocking accept)"
    error_id: "ERR_INVALID_STATE (or specific: ERR_ESTIMATE_EXPIRED, ERR_POLE_HAS_ATTACHMENTS, ERR_INVOICE_ALREADY_TERMINAL)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "Optimistic concurrency: expected_application_version equals AttachmentApplication.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /joint-use/applications/{appId}/estimate"

  - priority: 7
    category: business_safety
    check: "Four-eyes segregation of duties: permit officer's X-User-ID != the application's surveyor_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /joint-use/applications/{appId}/permit"

  - priority: 8
    category: business_referential
    check: "Cross-entity state guards: survey requires Pole.status==ACTIVE; accept requires ESTIMATE_ISSUED not EXPIRED; invoice pay requires no non-terminal Dispute; finding legalize requires Pole.status==ACTIVE"
    error_id: "ERR_POLE_NOT_ACTIVE | ERR_ESTIMATE_EXPIRED | ERR_INVOICE_UNDER_DISPUTE"
    http_status: 409
    applies_to: "survey, estimate-decision, invoice pay, finding resolve"

  - priority: 9
    category: business_temporal
    check: "Crew make-ready window must not overlap another survey window on the same crew; [start,end) half-open, adjacency (touching endpoints) allowed"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /joint-use/applications/{appId}/survey"

  - priority: 10
    category: business_temporal
    check: "Vertical clearance: new attachment's [position, position+space] must be >= CLEARANCE_INCHES (= 12) inches away from every ACTIVE attachment interval on the pole; the gap between the new interval and each existing ACTIVE interval (measured between nearest endpoints; negative if they overlap) must be >= 12 inches"
    error_id: ERR_CLEARANCE_VIOLATION
    http_status: 409
    applies_to: "POST /joint-use/applications/{appId}/permit (GRANTED)"

  - priority: 11
    category: business_constraint
    check: "Pole capacity: requested/discovered space <= usable_communication_space_inches - occupied_space_inches - reserved_space_inches"
    error_id: ERR_INSUFFICIENT_POLE_SPACE
    http_status: 409
    applies_to: "estimate-decision (ACCEPT), finding resolve (LEGALIZE)"

  - priority: 12
    category: business_fiscal
    check: "Credit limit: account_balance_cents + make_ready_fee_estimate_cents <= credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /joint-use/applications/{appId}/estimate-decision (ACCEPT)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- PoleOwner ---
  - { method: POST, path: "/joint-use/pole-owners", description: "Register a pole owner", roles: [JointUseCoordinator], code: 201, input: [legal_name, owner_category, annual_rental_rate_cents, make_ready_labor_rate_cents_per_hour], output: PoleOwner, side_effects: [] }
  - { method: GET, path: "/joint-use/pole-owners/{ownerId}", description: "Get a pole owner", roles: [JointUseCoordinator, Engineer, PermitOfficer, FieldAuditor, Attacher], code: 200, input: [], output: PoleOwner, side_effects: [] }

  # --- MakeReadyCrew ---
  - { method: POST, path: "/joint-use/crews", description: "Register a make-ready crew", roles: [JointUseCoordinator], code: 201, input: [pole_owner_id, crew_name, region], output: MakeReadyCrew, side_effects: [] }
  - { method: GET, path: "/joint-use/crews", description: "List crews (filter by owner)", roles: [JointUseCoordinator, Engineer], code: 200, input: ["pole_owner_id?", "limit?", "offset?"], output: "MakeReadyCrew[]", side_effects: [] }
  - { method: GET, path: "/joint-use/crews/{crewId}", description: "Get a crew", roles: [JointUseCoordinator, Engineer], code: 200, input: [], output: MakeReadyCrew, side_effects: [] }

  # --- Pole ---
  - { method: POST, path: "/joint-use/poles", description: "Register a pole", roles: [JointUseCoordinator], code: 201, input: [pole_owner_id, tag, height_ft, usable_communication_space_inches], output: Pole, side_effects: ["occupied_space_inches=0, reserved_space_inches=0, status=ACTIVE"] }
  - { method: GET, path: "/joint-use/poles", description: "List poles (filter by owner)", roles: [JointUseCoordinator, Engineer, PermitOfficer, FieldAuditor, Attacher], code: 200, input: ["pole_owner_id?", "limit?", "offset?"], output: "Pole[]", side_effects: [] }
  - { method: GET, path: "/joint-use/poles/{poleId}", description: "Get a pole (incl. occupied/reserved space)", roles: [JointUseCoordinator, Engineer, PermitOfficer, FieldAuditor, Attacher], code: 200, input: [], output: Pole, side_effects: [] }
  - { method: POST, path: "/joint-use/poles/{poleId}/retire", description: "Retire a pole with no attachments/reservations/open applications", roles: [JointUseCoordinator], code: 200, input: [], output: Pole, side_effects: ["status -> RETIRED"] }

  # --- Attacher ---
  - { method: POST, path: "/joint-use/attachers", description: "Register an attacher", roles: [JointUseCoordinator], code: 201, input: [company_name, cin, contact_email, "credit_limit_cents?"], output: Attacher, side_effects: ["account_balance_cents=0"] }
  - { method: GET, path: "/joint-use/attachers/{attacherId}", description: "Get an attacher (incl. account_balance_cents)", roles: [JointUseCoordinator, Engineer, PermitOfficer, FieldAuditor, Attacher], code: 200, input: [], output: Attacher, side_effects: [] }

  # --- AttachmentApplication ---
  - { method: POST, path: "/joint-use/applications", description: "Submit an attachment application", roles: [Attacher], code: 201, input: [pole_id, attacher_id, requested_space_inches, requested_position_inches, purpose], output: AttachmentApplication, side_effects: ["status=SUBMITTED; submitted_at=clock; survey_deadline=submitted_at+SURVEY_SHOT_CLOCK_DAYS"] }
  - { method: GET, path: "/joint-use/applications", description: "List applications (filter by pole/attacher)", roles: [JointUseCoordinator, Engineer, PermitOfficer, Attacher], code: 200, input: ["pole_id?", "attacher_id?", "limit?", "offset?"], output: "AttachmentApplication[]", side_effects: [] }
  - { method: GET, path: "/joint-use/applications/{appId}", description: "Get an application", roles: [JointUseCoordinator, Engineer, PermitOfficer, Attacher], code: 200, input: [], output: AttachmentApplication, side_effects: [] }
  - { method: POST, path: "/joint-use/applications/{appId}/survey", description: "Submit make-ready survey (SUBMITTED->SURVEYED)", roles: [Engineer], code: 201, input: [crew_id, window_start, window_end, estimated_labor_hours, make_ready_required, existing_attacher_count, complexity_class, findings], output: MakeReadySurvey, side_effects: ["create MakeReadySurvey; app->SURVEYED; surveyor_user_id set; estimate_deadline set"] }
  - { method: POST, path: "/joint-use/applications/{appId}/estimate", description: "Issue/re-issue engineering estimate (SURVEYED->ESTIMATE_ISSUED, or supersede)", roles: [Engineer], code: 200, input: [expected_application_version], output: AttachmentApplication, side_effects: ["compute make_ready_fee_estimate_cents; set estimate_issued_at, estimate_expires_at; increments AttachmentApplication.version by 1"] }
  - { method: POST, path: "/joint-use/applications/{appId}/estimate-decision", description: "Attacher accepts or rejects the estimate", roles: [Attacher], code: 200, input: [decision], output: AttachmentApplication, side_effects: ["ACCEPT: reserve space, issue MAKE_READY invoice, set permit_deadline; REJECT: -> ESTIMATE_REJECTED"] }
  - { method: POST, path: "/joint-use/applications/{appId}/permit", description: "PermitOfficer grants or denies the permit (FCC shot-clock evaluated)", roles: [PermitOfficer], code: 200, input: [decision, "actual_labor_hours?"], output: AttachmentApplication, side_effects: ["GRANTED: SoD+clearance checks, final make-ready true-up, create Attachment, occupy space, issue ANNUAL_RENTAL invoice; DENIED: release reservation, VOID make-ready invoice (cascade)"] }
  - { method: POST, path: "/joint-use/applications/{appId}/withdraw", description: "Attacher withdraws a non-terminal application", roles: [Attacher], code: 200, input: [], output: AttachmentApplication, side_effects: ["-> WITHDRAWN; if was ESTIMATE_ACCEPTED release reservation and VOID make-ready invoice"] }

  # --- MakeReadySurvey (created via /survey) ---
  - { method: GET, path: "/joint-use/surveys", description: "List surveys (filter by application/crew)", roles: [JointUseCoordinator, Engineer], code: 200, input: ["application_id?", "crew_id?", "limit?", "offset?"], output: "MakeReadySurvey[]", side_effects: [] }
  - { method: GET, path: "/joint-use/surveys/{surveyId}", description: "Get a survey", roles: [JointUseCoordinator, Engineer], code: 200, input: [], output: MakeReadySurvey, side_effects: [] }

  # --- Attachment (created via permit grant / finding legalize / transfer) ---
  - { method: GET, path: "/joint-use/attachments", description: "List attachments (filter by pole/attacher/application)", roles: [JointUseCoordinator, Engineer, PermitOfficer, FieldAuditor, Attacher], code: 200, input: ["pole_id?", "attacher_id?", "application_id?", "limit?", "offset?"], output: "Attachment[]", side_effects: [] }
  - { method: GET, path: "/joint-use/attachments/{attId}", description: "Get an attachment", roles: [JointUseCoordinator, Engineer, PermitOfficer, FieldAuditor, Attacher], code: 200, input: [], output: Attachment, side_effects: [] }
  - { method: POST, path: "/joint-use/attachments/{attId}/transfer", description: "Transfer an attachment to another attacher", roles: [Attacher], code: 200, input: [new_attacher_id], output: Attachment, side_effects: ["old -> TRANSFERRED; create new ACTIVE attachment for new_attacher_id; pole occupied space net unchanged"] }
  - { method: POST, path: "/joint-use/attachments/{attId}/abandon", description: "Abandon an attachment", roles: [Attacher], code: 200, input: [], output: Attachment, side_effects: ["-> ABANDONED; Pole.occupied_space_inches falls"] }

  # --- UnauthorizedAttachmentFinding ---
  - { method: POST, path: "/joint-use/findings", description: "Log an unauthorized-attachment finding (field audit)", roles: [FieldAuditor], code: 201, input: [pole_id, attacher_id, discovered_space_inches, discovered_position_inches, good_faith, estimated_install_years_ago], output: UnauthorizedAttachmentFinding, side_effects: ["auditor_user_id=X-User-ID; audited_at=clock; compute penalty_cents + back_rental_cents; issue UNAUTHORIZED invoice; status=FLAGGED"] }
  - { method: GET, path: "/joint-use/findings", description: "List findings (filter by pole/attacher)", roles: [JointUseCoordinator, FieldAuditor, Attacher], code: 200, input: ["pole_id?", "attacher_id?", "limit?", "offset?"], output: "UnauthorizedAttachmentFinding[]", side_effects: [] }
  - { method: GET, path: "/joint-use/findings/{findingId}", description: "Get a finding", roles: [JointUseCoordinator, FieldAuditor, Attacher], code: 200, input: [], output: UnauthorizedAttachmentFinding, side_effects: [] }
  - { method: POST, path: "/joint-use/findings/{findingId}/resolve", description: "Legalize or remove a flagged/disputed finding", roles: [JointUseCoordinator], code: 200, input: [resolution], output: UnauthorizedAttachmentFinding, side_effects: ["LEGALIZE: capacity check, create Attachment (authorized=false), occupy space; REMOVE: -> REMOVED"] }

  # --- Invoice ---
  - { method: POST, path: "/joint-use/invoices", description: "Generate an ANNUAL_RENTAL true-up invoice over an attacher's active attachments under one owner", roles: [JointUseCoordinator], code: 201, input: [attacher_id, pole_owner_id, invoice_type], output: Invoice, side_effects: ["compute amount_cents via round-per-line-then-sum; status=ISSUED; due_at set; account_balance_cents rises"] }
  - { method: GET, path: "/joint-use/invoices", description: "List invoices (filter by attacher/owner/application/finding)", roles: [JointUseCoordinator, Attacher], code: 200, input: ["attacher_id?", "pole_owner_id?", "application_id?", "finding_id?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/joint-use/invoices/{invoiceId}", description: "Get an invoice", roles: [JointUseCoordinator, Attacher], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/joint-use/invoices/{invoiceId}/pay", description: "Pay an invoice (blocked while under dispute)", roles: [Attacher], code: 200, input: [], output: Invoice, side_effects: ["-> PAID; account_balance_cents falls"] }
  - { method: POST, path: "/joint-use/invoices/{invoiceId}/void", description: "Void an invoice", roles: [JointUseCoordinator], code: 200, input: [], output: Invoice, side_effects: ["-> VOID; account_balance_cents falls"] }

  # --- Dispute ---
  - { method: POST, path: "/joint-use/disputes", description: "Open a dispute over an invoice or a finding", roles: [Attacher], code: 201, input: [attacher_id, "invoice_id?", "finding_id?", reason], output: Dispute, side_effects: ["status=OPEN; if finding_id set the finding -> DISPUTED"] }
  - { method: GET, path: "/joint-use/disputes", description: "List disputes (filter by attacher/invoice/finding)", roles: [JointUseCoordinator, Attacher], code: 200, input: ["attacher_id?", "invoice_id?", "finding_id?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: GET, path: "/joint-use/disputes/{disputeId}", description: "Get a dispute", roles: [JointUseCoordinator, Attacher], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/joint-use/disputes/{disputeId}/transition", description: "Advance a dispute (review, request-info, respond, resolve, withdraw)", roles: [Attacher, JointUseCoordinator], code: 200, input: [to_state, "adjusted_amount_cents?"], output: Dispute, side_effects: ["cyclic UNDER_REVIEW<->INFO_REQUESTED; RESOLVED_ADJUSTED cascades invoice amount + attacher balance"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set the clock reads exactly this default and never falls back to wall-clock. On set, ISSUED invoices past due_at -> OVERDUE and ESTIMATE_ISSUED applications past estimate_expires_at -> ESTIMATE_EXPIRED.", roles: [JointUseCoordinator], code: 200, input: [to_iso8601], output: null, side_effects: ["advance clock; ISSUED->OVERDUE for past-due invoices; ESTIMATE_ISSUED->ESTIMATE_EXPIRED for expired applications"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role/X-User-ID missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity_backed ownership mismatch (acting Attacher's X-User-ID != resource attacher_id)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive integer, etc." }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Survey window_end <= window_start" }
  - { id: ERR_POLE_OWNER_NOT_FOUND, http: 404, condition: "pole_owner_id does not resolve" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew_id does not resolve, or crew belongs to a different owner than the pole" }
  - { id: ERR_POLE_NOT_FOUND, http: 404, condition: "pole_id / poleId does not resolve" }
  - { id: ERR_ATTACHER_NOT_FOUND, http: 404, condition: "attacher_id / new_attacher_id does not resolve" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "appId does not resolve" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "surveyId does not resolve" }
  - { id: ERR_ATTACHMENT_NOT_FOUND, http: 404, condition: "attId does not resolve" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "findingId does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoiceId / invoice_id does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "disputeId does not resolve" }
  - { id: ERR_DUPLICATE_CIN, http: 409, condition: "Attacher cin already registered" }
  - { id: ERR_DUPLICATE_POLE_TAG, http: 409, condition: "Pole tag already used for this pole_owner_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_ESTIMATE_EXPIRED, http: 409, condition: "Estimate acceptance attempted after the application went ESTIMATE_EXPIRED" }
  - { id: ERR_POLE_NOT_ACTIVE, http: 409, condition: "Operation requires Pole.status == ACTIVE" }
  - { id: ERR_POLE_HAS_ATTACHMENTS, http: 409, condition: "Pole retire blocked by active attachments, reservations, or open applications" }
  - { id: ERR_INVOICE_UNDER_DISPUTE, http: 409, condition: "Invoice pay blocked while a non-terminal Dispute references it" }
  - { id: ERR_INVOICE_ALREADY_TERMINAL, http: 409, condition: "Invoice already PAID or VOID" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version does not match AttachmentApplication.version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Permit officer's X-User-ID equals the application's surveyor_user_id (four-eyes violation)" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew make-ready window overlaps another survey window on the same crew" }
  - { id: ERR_CLEARANCE_VIOLATION, http: 409, condition: "New attachment interval is within CLEARANCE_INCHES (= 12) inches of an existing ACTIVE attachment on the pole" }
  - { id: ERR_INSUFFICIENT_POLE_SPACE, http: 409, condition: "Requested/discovered space exceeds available communication space (usable - occupied - reserved)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "account_balance_cents + make_ready_fee_estimate_cents exceeds credit_limit_cents" }
  - { id: ERR_DISPUTE_SUBJECT_INVALID, http: 422, condition: "Dispute must reference exactly one of invoice_id / finding_id" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: JointUseCoordinator
    description: "Operator that administers owners, poles, crews, attachers; generates rental invoices; voids invoices; legalizes/removes findings; reviews and resolves disputes; drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /joint-use/pole-owners"
      - "POST /joint-use/crews"
      - "POST /joint-use/poles"
      - "POST /joint-use/poles/{poleId}/retire"
      - "POST /joint-use/attachers"
      - "POST /joint-use/invoices"
      - "POST /joint-use/invoices/{invoiceId}/void"
      - "POST /joint-use/findings/{findingId}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /joint-use/disputes/{disputeId}/transition (coordinator legs: review, request-info, resolve)"
      - "GET (all read endpoints)"

  - name: Engineer
    description: "Pole-owner engineering staff. Conducts make-ready surveys and issues engineering estimates. surveyor_user_id (X-User-ID) is the SoD anchor."
    identity: opaque
    exclusive_operations:
      - "POST /joint-use/applications/{appId}/survey"
      - "POST /joint-use/applications/{appId}/estimate"
    shared_operations:
      - "GET (owners, poles, crews, applications, surveys, attachments, attachers)"

  - name: PermitOfficer
    description: "Pole-owner permitting authority. Grants or denies permits; must be a different X-User-ID than the surveyor (four-eyes)."
    identity: opaque
    exclusive_operations:
      - "POST /joint-use/applications/{appId}/permit"
    shared_operations:
      - "GET (owners, poles, applications, attachments, attachers)"

  - name: FieldAuditor
    description: "Field inspector who logs unauthorized-attachment findings during audits."
    identity: opaque
    exclusive_operations:
      - "POST /joint-use/findings"
    shared_operations:
      - "GET (poles, findings, attachments, attachers)"

  - name: Attacher
    description: "The attaching company. Submits applications, accepts/rejects estimates, withdraws, transfers/abandons attachments, pays invoices, opens/responds to disputes."
    identity: "entity_backed:Attacher"
    exclusive_operations:
      - "POST /joint-use/applications"
      - "POST /joint-use/applications/{appId}/estimate-decision"
      - "POST /joint-use/applications/{appId}/withdraw"
      - "POST /joint-use/attachments/{attId}/transfer"
      - "POST /joint-use/attachments/{attId}/abandon"
      - "POST /joint-use/invoices/{invoiceId}/pay"
      - "POST /joint-use/disputes"
    shared_operations:
      - "POST /joint-use/disputes/{disputeId}/transition (attacher leg: respond, withdraw)"
      - "GET (own applications, attachments, invoices, disputes, findings, poles, attachers)"
