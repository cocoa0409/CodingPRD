  - rule_id: non_linear_state_machine
    instances:

      - name: meter_install_and_health_dimensions_evolve_in_parallel
        grounds:
          - state_machines.Meter.install_status.SHIPPED_to_INSTALLED
          - state_machines.Meter.health_status.HEALTHY_to_SUSPECT
          - state_machines.Meter.health_status.SUSPECT_to_FAULTED
          - state_machines.Meter.health_status.FAULTED_to_HEALTHY
          - calculations.meter_missing_minutes
          - entities.Meter.fields.install_status
          - entities.Meter.fields.health_status
          - entities.Meter.fields.fault_count
        distinguishing_aspect: |
          Meter carries two independent state dimensions on one row: install_status walks
          SHIPPED -> INSTALLED and stays INSTALLED while health_status walks the cycle
          HEALTHY -> SUSPECT -> FAULTED -> HEALTHY across three different endpoints, and the
          combined state (INSTALLED x FAULTED) is what drives the household cascade - install_status
          is never touched by any health transition.
        test_recipe:
          setup:
            - "Market DMA-505 with one quota cell (target 1, base incentive 2000), a published 2026Q3 universe of 120000 households and a published edit rule set whose fault_missing_minutes_threshold is 1440 (suspect floor 720)."
            - "One ACTIVE household whose single TV_TUNER meter is INSTALLED and HEALTHY."
            - "One 350-minute interval on 2026-08-10 ingested at clock 2026-08-11T00:00:00Z."
            - "An OPEN run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z), window_minutes 1440, so the meter's coverage shortfall is 1440 - 350 == 1090 minutes."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Epsilon", market_code: "DMA-505", dma_rank: 5, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m5_id: "$.data.id" }
