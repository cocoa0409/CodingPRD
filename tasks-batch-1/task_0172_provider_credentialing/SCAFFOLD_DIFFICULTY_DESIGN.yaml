      - name: sanction_score_conservation_hit_then_resolve
        grounds:
          - state_machines.SanctionsScreening.OPEN_to_RESOLVED
          - calculations.sanction_score
          - entities.Provider.fields.sanction_score
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Provider.sanction_score (sanction points). Forward (record HIT)
          +severity_weight, compensating (resolve) -severity_weight. The invariant
          'sanction_score == sum of severity_weight over OPEN HITs' returns sanction_score to its pre-HIT
          value of 0 after HIT-then-resolve, and credentialing_status leaves EXCLUDED.
        test_recipe:
          setup:
            - "Provider with one verified license. OIG source severity_weight 3. One HIT screening recorded (sanction_score 3, EXCLUDED)."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /sanctions-sources"
              payload: { org_id: "${org_id}", source_code: "OIG_LEIE", severity_weight: 3 }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { src_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
