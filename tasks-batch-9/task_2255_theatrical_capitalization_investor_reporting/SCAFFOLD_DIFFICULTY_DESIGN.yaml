      assert:
      - 'Pre-termination: pool_share_pct == 0.4445 for ${rp1}, 0.3333 for ${rp2}, 0.2222 for ${rp3}; GET /productions/${pr} total_pool_points == 9'
      - 'After termination: ${rp3}.status == "TERMINATED" with pool_share_pct == 0.0000; ${rp1}.pool_share_pct == 0.5714 and ${rp2}.pool_share_pct == 0.4286; total_pool_points == 7'
      - 'After reinstatement: ${rp3}.status == "ACTIVE"; pool_share_pct back to 0.4445 / 0.3333 / 0.2222 for ${rp1} / ${rp2} / ${rp3}'
      - 'After reinstatement: GET /productions/${pr} total_pool_points == 9 (exactly the pre-termination value)'
      - 'pool_points themselves were never mutated: 4 / 3 / 2 throughout'
