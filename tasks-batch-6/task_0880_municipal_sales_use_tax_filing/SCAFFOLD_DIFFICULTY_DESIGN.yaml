            - "TaxReturn.${ret_id}.vendor_discount_cents == 1020"
            - "TaxReturn.${ret_id}.net_return_due_cents == 66980"

      - name: nexus_established_at_exact_threshold
        grounds:
          - calculations.nexus_determination
