              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_b}/accept"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_b}/receive"
              payload: {}
              as: IntakeStaff
              as_user_id: "staff-r"
            - call: "POST /reuse/items"
