          assert:
            - "trigger step 2 responds HTTP 200 with $.data.eligible_count == 1 and $.data.consensus_mean == 2.0000"
            - "trigger step 2: $.data.guidance_anchored == false, $.data.band_low == 1.7000, $.data.band_high == 2.3000, $.data.outlier_excluded_count == 0, $.data.dispersion_pct == 0.00"
            - "trigger step 4 responds HTTP 409 with $.data.error_id == ERR_NO_ELIGIBLE_ESTIMATES"
            - "trigger step 4 returns no consensus payload fields alongside the error"
            - "EstimateSubmission.${est_id}.status == ACCEPTED throughout (the row is filtered out by the window, not mutated)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: draft_send_blocked_by_superseded_cited_disclosure
        grounds:
          - state_machines.ResponseDraft.APPROVED_to_SENT
          - state_machines.Disclosure.PUBLISHED_to_SUPERSEDED
          - entities.ResponseDraft.fields.pinned_disclosure_version
          - errors[ERR_PINNED_DISCLOSURE_STALE]
          - validations[priority=9]
        distinguishing_aspect: |
          The ResponseDraft -> Disclosure pair: an APPROVED draft may only be sent while the cited
          Disclosure is still PUBLISHED at exactly the version pinned at approval, so publishing a
          replacement guidance row (which supersedes the cited one and bumps it to version 3) makes
          the send fail with ERR_PINNED_DISCLOSURE_STALE without any change to the draft itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Issuer PIN with one INSTITUTIONAL_HOLDER contact."
            - "A PUBLISHED GUIDANCE_UPDATE disclosure D1 for EPS / FY2026 (version 2 after publication)."
