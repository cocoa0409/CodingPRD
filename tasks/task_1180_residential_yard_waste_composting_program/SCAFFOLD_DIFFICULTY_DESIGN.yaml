            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-08-01", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /facilities", payload: { name: "Compost Central", daily_receiving_capacity_lbs: 50000, safety_contamination_item_limit: 5 }, as: ProgramAdmin, captures: { fac: $.data.id } }
            - { call: "POST /facility-deliveries", payload: { facility_id: "${fac}", route_id: "${route_a}", delivery_date: "2026-06-15", window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T11:00:00Z" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { del: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: ProgramAdmin }
