            - { call: "POST /regatta-ops/duty-assignments/${d_pro}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_j2}", position: "TIMEKEEPER", window_start_utc: "2026-08-05T14:00:00Z", window_end_utc: "2026-08-05T15:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_tk: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${d_tk}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/jury-panels/${pnl}/recuse", payload: { member_id: "${m_j2}" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/duty-assignments/${d_pro}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 201 with DutyAssignment.${d_pro}.status == PROPOSED and duty_minutes == 120: the conflict is not checked at proposal time"
            - "trigger call 2 returns HTTP 409 with error_id ERR_JURY_CONFLICT_OF_INTEREST, and DutyAssignment.${d_pro}.status stays PROPOSED"
            - "trigger call 3 returns HTTP 201 and trigger call 4 returns HTTP 200 with DutyAssignment.${d_tk}.status == CONFIRMED: only position PRO collides with a jury seat"
            - "after trigger call 4, ClubMember.${m_j2}.assigned_duty_minutes == 180 (120 proposed plus 60 confirmed), because POST /duty-assignments books the minutes and confirm is a ledger no-op"
            - "trigger call 5 returns HTTP 200 with JuryPanel.${pnl}.status == FORMING and seated_member_count == 1: the seat for ${m_j2} carries recused true"
            - "trigger call 6 returns HTTP 200 with DutyAssignment.${d_pro}.status == CONFIRMED, because a recused judge on a FORMING panel is no longer a seated non-recused judge"
            - "ClubMember.${m_j2}.assigned_duty_minutes is still 180 after trigger call 6"

  # =========================================================================
  # From Cross-Cutting Complexity Layers
  # =========================================================================
  # Active layers are dual_variant_calculation, cascading_side_effects,
  # optimistic_concurrency and selector_policy. The guide's table has no
  # `selector_policy` row, so its claims are carried by the calculations section
  # above: assign_division_selects_narrowest_eligible_band_over_wider_and_wrong_type
  # and division_merge_selects_nearest_band_midpoint_target exercise both selectors,
  # including their deterministic tie-break chains.
  - section: complexity_layers
    instances:

      - name: stale_expected_boat_version_on_certificate_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[certificate-create-stale-boat]
          - endpoints[POST /rating-certificates]
          - errors[ERR_STALE_BOAT_VERSION]
          - entities[Boat]
        distinguishing_aspect: |
          Boat.version advances on certificate create AND on issue, so a measurer who filed one
          certificate and re-used the version they first read is 412 ERR_STALE_BOAT_VERSION, a
          re-read makes the very same payload succeed, and the refused 412 itself leaves
          Boat.version untouched so the re-read value stays current.
        test_recipe:
          setup:
            - "One licensed measurer and one owner with a single MONOHULL boat, freshly created at version 1."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_v1: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_v1}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_1: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.5, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_v1}" }, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "GET /regatta-ops/boats/${b_a}", payload: {}, as: Measurer, as_user_id: "${m_mea}", captures: { b_v2: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.5, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_v2}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_2: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_1}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 69.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_v2}" }, as: Measurer, as_user_id: "${m_mea}" }
          assert:
            - "trigger call 1 returns HTTP 201 with RatingCertificate.${c_1}.status == DRAFT and Boat.${b_a}.version == 2"
            - "trigger call 2 returns HTTP 412 with error_id ERR_STALE_BOAT_VERSION, creates no RatingCertificate row and leaves Boat.${b_a}.version at 2"
            - "trigger call 3 returns HTTP 200 with version == 2, so ${b_v2} == 2"
            - "trigger call 4 returns HTTP 201 with RatingCertificate.${c_2}.rating_value == 170.4 and Boat.${b_a}.version == 3"
            - "trigger call 5 returns HTTP 200 with RatingCertificate.${c_1}.status == ISSUED and Boat.${b_a}.version == 4: issue bumps the parent version just like create"
            - "trigger call 6 returns HTTP 412 with error_id ERR_STALE_BOAT_VERSION, because ${b_v2} is now two writes behind"
            - "exactly two RatingCertificate rows exist for boat ${b_a} after trigger call 6"

      - name: stale_then_current_expected_regatta_version_on_document_publish
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[document-publish-stale-regatta]
          - endpoints[POST /race-documents]
          - errors[ERR_STALE_REGATTA_VERSION]
          - entities[Regatta]
        distinguishing_aspect: |
          Regatta.version advances on every publication, so the version read before the notice of
          race is stale for the sailing instructions and the version read before the sailing
          instructions is stale for the first amendment: each stale attempt is 412
          ERR_STALE_REGATTA_VERSION and writes no RaceDocument and no revision counter.
        test_recipe:
          setup:
            - "One chair and a DRAFT regatta at version 1 with nor_revision 0 and si_revision 0."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_nor1: $.data.id } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_si1: $.data.id } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race amendment 1", effective_utc: "2026-07-20T00:00:00Z", amends_document_id: "${doc_nor1}", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v3: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race amendment 1", effective_utc: "2026-07-20T00:00:00Z", amends_document_id: "${doc_nor1}", expected_regatta_version: "${reg_v3}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_nor2: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 201 with revision 1, status EFFECTIVE, Regatta.${reg}.status NOR_PUBLISHED, nor_revision 1 and version 2"
            - "trigger call 2 returns HTTP 412 with error_id ERR_STALE_REGATTA_VERSION: ${reg_v1} is 1 while the regatta now reads 2, and si_revision stays 0"
            - "trigger call 3 returns HTTP 200 with version == 2, so ${reg_v2} == 2"
            - "trigger call 4 returns HTTP 201 with revision 1, Regatta.${reg}.status SI_PUBLISHED, si_revision 1 and version 3"
            - "trigger call 5 returns HTTP 412 with error_id ERR_STALE_REGATTA_VERSION, RaceDocument.${doc_nor1}.status is still EFFECTIVE and nor_revision is still 1"
            - "trigger call 6 returns HTTP 200 with version == 3, so ${reg_v3} == 3"
            - "trigger call 7 returns HTTP 201 with RaceDocument.${doc_nor2}.revision == 2, RaceDocument.${doc_nor1}.status == SUPERSEDED, Regatta.${reg}.nor_revision == 2, status still SI_PUBLISHED and version 4"
            - "exactly three RaceDocument rows exist for regatta ${reg}: the two refused publications wrote nothing"

      - name: certificate_suspension_chain_reaches_entry_division_and_race
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: cascading_side_effects / certificate_suspension_cascades_entry_division_and_race_block
          rationale: |
            The deepest cascade of the scaffold (certificate SUSPENDED -> pinned entries
            withdrawn -> division counters and status -> PENDING race blocked) is already
            walked end-to-end there, hop by hop, including the ordering claim that the
            division re-evaluation runs after the entry rewrite and the assertion that
            terminal entries are left alone.

      - name: corrected_time_and_series_variants_both_produce_expected_results
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calculation / corrected_time_tod_versus_tot_on_identical_elapsed
          rationale: |
            Both variants of corrected_time on identical elapsed data, and the delta between
            them, are asserted there with author-computed literals; the LOW_POINT versus
            BONUS_POINT pair of series_standing is covered by
            series_standing_low_point_versus_bonus_point_on_identical_race_data.

  # =========================================================================
  # From Consistency Model
  # =========================================================================
  # consistency_model is `immediate`, so there is no `eventual` or `saga` row to emit:
  # no field in section 1.1 is declared as lagging and no endpoint runs a multi-step
  # workflow that could be compensated halfway.
  - section: consistency_model
    instances:

      - name: derived_counters_are_visible_in_the_same_response_that_moves_them
        claim_type: immediate
        grounds:
          - complexity_profile[consistency_model immediate]
          - endpoints[POST /entries/{id}/assign-division]
          - endpoints[GET /divisions/{id}]
          - entities[Division]
          - calculations[entry_division_assignment_selection]
        distinguishing_aspect: |
          The selector result and every counter it moves are readable without any second write:
          the assign-division response already carries division_id, and the immediately following
          reads of the division and the regatta show assigned_entry_count 1 and, after the
          confirmation, confirmed_division_count 1 with no intervening refresh step.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, division A (MONOHULL 150.0-230.0, min_entries 2), fleet_minimum 2."
            - "Two owners with measured, ISSUED certificates whose rating values 171.3 and 218.8 both fall inside division A's band."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-3308", boat_name: "Sea Fable", owner_member_id: "${m_h2}", boat_type: "MONOHULL", loa_meters: 9.6 }, as: Competitor, as_user_id: "${m_h2}", captures: { b_b: $.data.id, b_b_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_b}", rule_code: "TOD_PHRF", sail_area_m2: 52.0, hull_length_m: 9.4, displacement_kg: 4100, draft_m: 1.95, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_b_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_b: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_b}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_b}", certificate_id: "${c_b}", helm_member_id: "${m_h2}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h2}", captures: { e_b: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/divisions/${div_a}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_b}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions/${div_a}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 200 and its own response body already carries Entry.${e_a}.division_id == ${div_a} and registration_status SUBMITTED"
            - "trigger call 2 returns HTTP 200 with Division.${div_a}.assigned_entry_count == 1, accepted_entry_count == 0 and status PROVISIONAL: no second write was needed for the counter to move"
            - "trigger call 3 returns HTTP 200 and Division.${div_a}.assigned_entry_count reads 2 on the response of trigger call 4 without any refresh call in between"
            - "trigger call 4 returns HTTP 200 with Division.${div_a}.status == CONFIRMED in the same response body"
            - "trigger call 5 returns HTTP 200 with Regatta.${reg}.confirmed_division_count == 1, proving the parent counter was written inside the confirm request"

      - name: duty_ledger_reversal_is_visible_without_any_re_read_delay
        claim_type: immediate
        excluded_because:
          difficulty_instance: derived_ledger_reconciliation / duty_release_restores_member_and_mark_boat_minute_ledgers
          rationale: |
            That instance already reads ClubMember.assigned_duty_minutes and
            MarkBoat.committed_minutes immediately after each booking and each release and
            asserts the exact restored totals, which is precisely the `immediate` claim for
            the two ledger fields most likely to be implemented as a lagging denormalisation.
