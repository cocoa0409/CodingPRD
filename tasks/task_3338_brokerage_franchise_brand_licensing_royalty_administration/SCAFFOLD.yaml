    path: "/franchise/agreements/{id}/compliance-audits"
    description: "Reverse-reachability: list audits of an agreement"
    roles: [FranchisorOps, FranchiseeAdmin, BrandAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ComplianceAudit[]"
    side_effects: []
