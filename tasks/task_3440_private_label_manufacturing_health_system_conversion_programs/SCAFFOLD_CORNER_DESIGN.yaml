  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; a single-resource create yields response_type 'object'."
        test_recipe:
          setup: ["None"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/facilities"
              payload: { name: "Fac ENV", health_system_name: "HS ENV", facility_type: "CLINIC", ship_to_address: "56 Vine St" }
              as: SupplyChainAdmin
              captures: { f_id: $.data.id }
          assert:
            - "Response top level has meta (with non-empty api_request_id and ISO8601 api_request_timestamp), response_type == 'object', and data holding the Facility"
            - "No pagination fields appear on a single-object response"
      - name: list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, "endpoints.\"GET /supply/manufacturing-lots\""]
        distinguishing_aspect: "Default pagination is limit 10 / offset 0: 11 lots yield total_count 11, has_more true, and exactly 10 rows on the first page."
