  - name: access_charge_subtotals_round_each_leg_before_summing
    grounds:
    - calculations.access_charge_rating
    - state_machines.UsageBatch.JURISDICTIONALIZED_to_RATED
    - entities.UsageBatch.fields.intrastate_amount_usd
    - entities.CallDetailRecord.fields.rated_amount_usd
    distinguishing_aspect: |
      Mode (b): access_charge_rating pins the rounding order as round-each-leg-then-add — the signaling leg 2.437500 rounds to 2.44 and the factor leg 12.285000 rounds to 12.29 for a 14.73 intrastate subtotal, whereas summing first (14.722500) and rounding once would post 14.72 and a 32.46 batch total. One cent of divergence is observable, and the order is pinned, not left to the implementer. This is not mode (a)'s nested min/max interaction or mode (c)'s circular-looking evaluation order.
