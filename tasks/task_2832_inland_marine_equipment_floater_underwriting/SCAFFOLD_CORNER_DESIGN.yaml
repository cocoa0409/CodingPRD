            - "trigger[0] HTTP status == 409 and error_id == ERR_REFERRAL_NOT_PENDING; Policy.${pol}.referral_status is still NOT_REQUIRED and referral_decided_by_user_id is still null"
            - "trigger[1] HTTP status == 409 and error_id == ERR_FLOATER_NOT_IN_REQUIRED_STATE; InstallationFloater.${fl}.status is still ACTIVE and Jobsite.${js}.active_floater_count is still 1"
            - "trigger[2] HTTP status == 409 and error_id == ERR_REPORT_ALREADY_ADJUDICATED; ValueReport.${r1}.status is still ACCEPTED and CoveragePart.${cpR}.earned_reported_premium_cents is still 19110 (no double earning)"
            - "trigger[3] HTTP status == 409 and error_id == ERR_CLAIM_NOT_SETTLED; Claim.${clm}.adjustment_status is still OPEN, salvage_status is still NOT_APPLICABLE and no LOSS ledger row exists"
            - "trigger[4] HTTP status == 200; EquipmentItem.${it1}.status == REMOVED, removed_at == 2026-09-10T00:00:00Z, and exactly one ENDORSEMENT_RETURN row is appended with amount_cents == -154324 (173318 * 325 remaining days / 365)"
            - "trigger[5] HTTP status == 409 and error_id == ERR_ITEM_ALREADY_OFF_RISK; still exactly one ENDORSEMENT_RETURN row (the second delete is not idempotent-success, it is a refusal)"
            - "trigger[6] HTTP status == 409 and error_id == ERR_ITEM_ALREADY_OFF_RISK - activate on a REMOVED item fails the same target-entity check"
            - "trigger[7] HTTP status == 200; Policy.${pol}.status == CANCELLED and CoveragePart.${cpS}.status == CoveragePart.${cpF}.status == CoveragePart.${cpR}.status == VOID"
            - "trigger[8] HTTP status == 409 and error_id == ERR_PART_VOID - the target part is VOID, which is the priority 40 check and therefore beats the priority 41 ERR_POLICY_NOT_MUTABLE that the CANCELLED policy would also fail"
            - "trigger[9] HTTP status == 409 and error_id == ERR_PART_VOID; CoveragePart.${cpS}.deductible_cents is still 100000"
            - "all six refusals share HTTP 409 but carry six distinct error ids, and Policy.${pol}.premium_balance_cents equals the exact sum of its PREMIUM ledger rows after every one of them"

  # =========================================================================
  - section: rbac
    instances:

      - name: corner_rate_development_is_actuary_exclusive
        claim_type: Role Exclusive Operation
        grounds:
          - rbac.Actuary.exclusive_operations
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Only the Actuary may create and publish a rate cell: the identical POST /rate-rules body returns 201 for Actuary and 403 ERR_ROLE_NOT_PERMITTED for Underwriter and UnderwritingManager, while the GET read is shared with both of them and denied to ClaimsAdjuster."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "HEADER MANIPULATION: the `as:` values are the lint-visible placeholders for the endpoint's declared roles. trigger[0] must be issued with X-User-Role: Underwriter, trigger[1] with X-User-Role: UnderwritingManager, trigger[2] with X-User-Role: Underwriter, trigger[5] with X-User-Role: ClaimsAdjuster. All other calls use the role shown."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              as_user_id: "act-1"
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "GENERATOR", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 120, theft_hazard_grade: "C" }
              as: Actuary
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "GENERATOR", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 120, theft_hazard_grade: "C" }
              as: Actuary
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
              as_user_id: "act-1"
            - call: "GET /inland-marine/rate-rules/${rr}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/rate-rules/${rr}"
              payload: {}
              as: UnderwritingManager
          assert:
            - "trigger[0] (X-User-Role Underwriter) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "trigger[1] (X-User-Role UnderwritingManager) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "trigger[2] (X-User-Role Underwriter) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED, and RateRule.${rr}.status is still DRAFT afterwards"
            - "trigger[3] (Actuary act-1) HTTP status == 200, RateRule.${rr}.status == PUBLISHED and published_at == 2026-08-01T00:00:00Z"
            - "trigger[4] HTTP status == 200 - the read is a shared operation for Underwriter"
            - "trigger[5] (X-User-Role ClaimsAdjuster) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED - the adjuster is not on the rate-rule read either"
            - "after all triggers: exactly 1 RateRule row exists (the two rejected GENERATOR creates wrote nothing)"
            - "the same Actuary user id act-1 both drafted and published the cell: rate development carries no segregation-of-duties constraint, unlike referral and settlement"

      - name: corner_adjustment_authority_and_payment_authority_are_disjoint_roles
        claim_type: Role Exclusive Operation
        grounds:
          - rbac.ClaimsAdjuster.exclusive_operations
          - rbac.UnderwritingManager.exclusive_operations
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The three adjustment verbs (inspect, adjust, salvage-recovery) are ClaimsAdjuster-only and settle is UnderwritingManager-only, so a manager inspecting and an adjuster settling both get 403 ERR_ROLE_NOT_PERMITTED - a role denial that fires before the segregation-of-duties check on the same endpoint."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One IN_FORCE T2_URBAN policy with one ACTIVE ACV excavator insured at 8160000, part deductible 100000, per_item_limit 20000000, aggregate 200000000, and one OPEN claim on that item."
            - "HEADER MANIPULATION: trigger[0] must be issued with X-User-Role: UnderwritingManager, trigger[1] with X-User-Role: Underwriter, trigger[4] with X-User-Role: ClaimsAdjuster and X-User-ID: adj-2, trigger[5] with X-User-Role: Underwriter."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
