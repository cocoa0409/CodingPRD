# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Aircraft Management & Owner Services
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: owner_creation_returns_server_minted_fields
        claim_type: creation
        grounds: [entities.Owner]
        distinguishing_aspect: "POST /owners with all required fields returns 201 with a server-minted id, created_at, and version == 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          assert:
            - "Owner.${o_id}.legal_name == \"Aeris Holdings LLC\""
            - "Owner.${o_id}.version == 1"
            - "Owner.${o_id}.id is a UUID without any type prefix"

      - name: aircraft_create_missing_required_tail_number
        claim_type: required_fields
        grounds: [entities.Aircraft.fields.tail_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required tail_number is rejected with ERR_VALIDATION (400) before any state or uniqueness check runs."
        test_recipe:
          setup: ["one owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_VALIDATION and http 400"

      - name: aircraft_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Aircraft, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /aircraft/{id} with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /aircraft/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_NOT_FOUND and http 404"

      - name: aircraft_create_extra_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Aircraft]
        distinguishing_aspect: "Client-supplied id/version/total_time_hours in the create payload are ignored; the server mints its own values."
        test_recipe:
          setup: ["one owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N210JX", model: "G650", home_base_icao: "KTEB", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99, total_time_hours: 5000.0 }
              as: AccountExecutive
              captures: { a_id: $.data.id }
          assert:
            - "Aircraft.${a_id}.id != \"8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2\""
            - "Aircraft.${a_id}.version == 1"
            - "Aircraft.${a_id}.total_time_hours == 0.0"

      - name: aircraft_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Aircraft.fields.total_time_hours]
        distinguishing_aspect: "A newly registered aircraft starts with total_time_hours 0.0 and version 1 without the client supplying either."
        test_recipe:
          setup: ["one owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N220JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
          assert:
            - "Aircraft.${a_id}.total_time_hours == 0.0"
            - "Aircraft.${a_id}.version == 1"

      - name: expense_billed_and_statement_locked_on_certify
        claim_type: computed_fields
        grounds: [entities.Expense.fields.statement_id, state_machines.Expense.POSTED_to_BILLED]
        distinguishing_aspect: "Certifying a statement flips in-period POSTED expenses to BILLED and stamps statement_id; the statement filter then returns exactly those expenses."
        test_recipe:
          setup:
            - "Agreement ACTIVE; expense E1 FUEL 250000 (service 2026-08-05, paid 2026-08-07) POSTED"
            - "Statement for 2026-08 generated by AccountExecutive ae-1"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N230JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: FUEL, amount_cents: 250000, service_date: "2026-08-05", paid_date: "2026-08-07", vendor_name: "Meridian Fuel", tax_use: OWNER_USE }
              as: FinanceController
              captures: { e1_id: $.data.id }
            - call: "POST /statements"
              payload: { aircraft_id: "${a_id}", period: "2026-08" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /statements/${stmt_id}/certify"
              as: FinanceController
              as_user_id: "fc-1"
          assert:
            - "Expense.${e1_id}.status == BILLED"
            - "Expense.${e1_id}.statement_id == ${stmt_id}"
            - "GET /expenses?statement_id=${stmt_id} returns exactly 1 expense"
            - "MonthlyStatement.${stmt_id}.certified_by_user_id == \"fc-1\""

      - name: trip_charter_without_quote_rejected
        claim_type: type_constraints
        grounds: [entities.TripRequest.fields.charter_quote_cents, "errors[ERR_QUOTE_REQUIRED]"]
        distinguishing_aspect: "A CHARTER trip create omitting charter_quote_cents fails with ERR_QUOTE_REQUIRED (422); the same payload with trip_use OWNER_USE succeeds without a quote."
        test_recipe:
          setup: ["owner and aircraft exist"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N240JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 5.0 }
              as: FlightOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_QUOTE_REQUIRED and http 422"

  - section: state_machines
    instances:
      - name: owner_use_trip_auto_approves_on_create
        claim_type: side_effect_execution
        grounds: [state_machines.TripRequest.REQUESTED_to_APPROVED]
        distinguishing_aspect: "An OWNER_USE trip lands directly in APPROVED at creation (system auto-approval), while a CHARTER trip lands in REQUESTED."
        test_recipe:
          setup: ["owner and aircraft exist"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N250JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 3.0 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
          assert:
            - "TripRequest.${t_id}.status == APPROVED immediately on the create response"

      - name: trip_decline_after_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TripRequest.REQUESTED_to_DECLINED, "errors[ERR_TRIP_INVALID_STATE]"]
        distinguishing_aspect: "Decline is only valid from REQUESTED; an APPROVED trip rejects decline with ERR_TRIP_INVALID_STATE and stays APPROVED."
        test_recipe:
          setup: ["agreement exists (PENDING suffices); CHARTER trip approved by owner"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N260JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 5.0, charter_quote_cents: 900000 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
            - call: "POST /trips/${t_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /trips/${t_id}/decline"
              payload: { reason: "changed my mind" }
              as: Owner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_TRIP_INVALID_STATE"
            - "TripRequest.${t_id}.status remains APPROVED"

      - name: contract_counter_after_execute_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.VendorContract.PROPOSED_to_COUNTERED, "errors[ERR_CONTRACT_INVALID_STATE]"]
        distinguishing_aspect: "EXECUTED is terminal for negotiation: countering an executed contract fails with ERR_CONTRACT_INVALID_STATE."
        test_recipe:
          setup: ["owner, aircraft, and an EXECUTED contract"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N270JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /contracts"
              payload: { aircraft_id: "${a_id}", vendor_kind: HANGAR, vendor_name: "Teterboro Hangars", unit: MONTH, rate_cents_per_unit: 4500000, term_start: "2026-09-01", term_end: "2027-08-31" }
              as: ContractsManager
              captures: { vc_id: $.data.id }
            - call: "POST /contracts/${vc_id}/propose"
              as: ContractsManager
            - call: "POST /contracts/${vc_id}/execute"
              as: AccountExecutive
          trigger:
            - call: "POST /contracts/${vc_id}/counter"
              payload: { rate_cents_per_unit: 4300000 }
              as: ContractsManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_CONTRACT_INVALID_STATE"
            - "VendorContract.${vc_id}.status remains EXECUTED"

      - name: budget_reject_revise_resubmit_cycle
        claim_type: cyclic
        grounds: [state_machines.OperatingBudget.REJECTED_to_DRAFT, state_machines.OperatingBudget.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "The budget machine loops REJECTED -> DRAFT on PATCH (revision), clearing rejection_reason, and the revised budget can be resubmitted and approved."
        test_recipe:
          setup: ["agreement ACTIVE; budget FY2026 drafted with fuel_cents 1200000"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N280JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /budgets"
              payload: { aircraft_id: "${a_id}", fiscal_year: 2026, fuel_cents: 1200000, maintenance_cents: 960000, crew_cents: 2400000, hangar_cents: 600000, insurance_cents: 480000, other_cents: 240000 }
              as: AccountExecutive
              captures: { b_id: $.data.id }
            - call: "POST /budgets/${b_id}/submit"
              as: AccountExecutive
            - call: "POST /budgets/${b_id}/reject"
              payload: { reason: "fuel too low" }
              as: Owner
              as_user_id: "${o_id}"
          trigger:
            - call: "PATCH /budgets/${b_id}"
              payload: { fuel_cents: 1440000 }
              as: AccountExecutive
            - call: "POST /budgets/${b_id}/submit"
              as: AccountExecutive
            - call: "POST /budgets/${b_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
          assert:
            - "after PATCH: OperatingBudget.${b_id}.status == DRAFT and rejection_reason is null and fuel_cents == 1440000"
            - "after resubmit + approve: OperatingBudget.${b_id}.status == APPROVED"

      - name: filing_reject_refile_cycle
        claim_type: cyclic
        grounds: [state_machines.ComplianceFiling.REJECTED_to_FILED]
        distinguishing_aspect: "A REJECTED filing loops back to FILED via a re-file that updates reference_no and valid_until; the authority can then accept it."
        test_recipe:
          setup: ["owner and aircraft exist; REGISTRATION filing drafted"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N290JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: REGISTRATION, authority: "FAA Registry", reference_no: "REG-1", valid_until: "2026-12-31" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: REJECTED, notes: "reference number illegible" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /filings/${f_id}/file"
              payload: { reference_no: "REG-2", valid_until: "2027-06-30" }
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
          assert:
            - "after re-file: ComplianceFiling.${f_id}.status == FILED and reference_no == \"REG-2\" and valid_until == \"2027-06-30\""
            - "after second decision: ComplianceFiling.${f_id}.status == ACCEPTED"

      - name: program_suspend_pauses_accrual
        claim_type: conditional_cascade
        grounds: [state_machines.TripRequest.SCHEDULED_to_COMPLETED, state_machines.MaintenanceProgram.ENROLLED_to_SUSPENDED]
        distinguishing_aspect: "Trip completion mints a PROGRAM_ACCRUAL expense only when the program is ENROLLED at completion time; with the program SUSPENDED the trip completes but no accrual expense exists."
        test_recipe:
          setup:
            - "Agreement ACTIVE; program SUSPENDED (QUOTED -> ENROLLED -> SUSPENDED) at rate 15000"
            - "QUALIFIED crew pair; ACCEPTED INSURANCE_COI valid_until 2027-01-01; OWNER_USE trip SCHEDULED"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N300JB", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /programs"
              payload: { aircraft_id: "${a_id}", program_name: "JetCare hourly", rate_per_hour_cents: 15000 }
              as: MaintenancePlanner
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/enroll"
              as: MaintenancePlanner
            - call: "POST /programs/${prog_id}/suspend"
              as: MaintenancePlanner
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Sam Officer", crew_role: FIRST_OFFICER, hire_date: "2026-02-01" }
              as: FlightOpsManager
              captures: { c2_id: $.data.id }
            - call: "POST /crew/${c2_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c2_id}/complete-training"
              payload: { training_hours: 28, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: INSURANCE_COI, authority: "Avemco", reference_no: "COI-3001", valid_until: "2027-01-01" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 5.0 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T13:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T13:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t_id}/schedule"
              as: FlightOpsManager
          trigger:
            - call: "POST /trips/${t_id}/complete"
              payload: { block_hours_actual: 5.0 }
              as: FlightOpsManager
          assert:
            - "TripRequest.${t_id}.status == COMPLETED"
            - "Aircraft.${a_id}.total_time_hours == 5.0"
            - "GET /expenses?aircraft_id=${a_id}&category=PROGRAM_ACCRUAL returns an empty list"

      - name: event_complete_spawns_successor_forecast
        claim_type: side_effect_execution
        grounds: [state_machines.MaintenanceEvent.SCHEDULED_to_COMPLETED, calculations.maintenance_forecast]
        distinguishing_aspect: "Completing a SCHEDULED event stamps actual_aircraft_hours from the airframe (0.0 on a fresh aircraft) and auto-creates a successor FORECAST event with previous_event_id set and due_at_aircraft_hours == actual + interval (0.0 + 100.0 == 100.0)."
        test_recipe:
          setup: ["owner and aircraft exist (fresh, total_time_hours 0.0); base event INSPECTION_100H interval 100.0 due at 350.0, scheduled"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N310JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /events"
              payload: { aircraft_id: "${a_id}", event_code: "INSPECTION_100H", interval_hours: 100.0, due_at_aircraft_hours: 350.0 }
              as: MaintenancePlanner
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/schedule"
              payload: { scheduled_date: "2026-08-03" }
              as: MaintenancePlanner
          trigger:
            - call: "POST /events/${ev_id}/complete"
              as: MaintenancePlanner
          assert:
            - "MaintenanceEvent.${ev_id}.status == COMPLETED and actual_aircraft_hours == 0.0"
            - "GET /events?previous_event_id=${ev_id} returns exactly one event with status FORECAST, event_code == INSPECTION_100H, due_at_aircraft_hours == 100.0"
            - "MaintenanceEvent.${ev_id}.completed_at == \"2026-08-01T00:00:00Z\" (logical clock default, never set)"

      - name: maintenance_overdue_at_exact_due_hours_blocks_schedule
        claim_type: precondition_enforcement
        grounds: [calculations.maintenance_forecast, "errors[ERR_MAINTENANCE_OVERDUE]"]
