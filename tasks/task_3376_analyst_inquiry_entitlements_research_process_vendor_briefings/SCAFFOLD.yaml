# =============================================================================
# PRD Benchmark Scaffold — Analyst Inquiry Entitlements, Research Process &
# Vendor Briefings (Gartner-style research firm)
#
# §1.0–§1.7 live in this file. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml (never as top-level keys here).
# =============================================================================

scenario: |
  Analyst Inquiry Entitlements, Research Process & Vendor Briefings (Gartner): client contract structures with seat-based access, inquiry allowances and role-based research entitlements, analyst inquiry scheduling with topic routing, preparation requirements and note delivery, comparative market research methodology with vendor inclusion criteria, evaluation dimensions and scoring with fact-check cycles, vendor briefing and fact-check processes with strict separation between research and sales relationships, publication embargo, reprint licensing and permitted marketing use of research by vendors, peer review and methodology governance with vendor appeals of placement, conference and event programming with sponsorship boundaries, client renewal driven by measured research utilization

domain_name: "analyst-research-entitlements"
api_prefix: "/research"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - rate_threshold_triggers

  entity_topology: graph
  # Many-to-many junctions (VendorInclusion, VendorBriefing, SalesRelationship,
  # Sponsorship) plus cross-aggregate references (Analyst-authored documents feed
  # Vendor inclusion; Vendor spend feeds ConferenceEvent revenue). No URL nesting
  # deeper than one parent hop.

  state_machine_shape: cyclic
  # InquiryRequest re-routes after an analyst decline; ResearchDocument loops
  # PUBLISHED -> REVISED -> FACT_CHECK -> CLEARED -> PUBLISHED; VendorInclusion
  # loops EXCLUDED -> UNDER_APPEAL -> APPEAL_DENIED -> UNDER_APPEAL.

  relationship_patterns:
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # An analyst holding an active sales relationship with a vendor may not brief,
  # evaluate or fact-check that vendor; the author of a document may not peer
  # review it; the sales organisation may not touch research status.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Subscribing enterprise legal name"
      - name: industry
        type: string
        source: input
        description: "Client industry label"
      - name: region
        type: enum
        source: input
        description: "Contracting region"
        constraints: "one of {NA, EMEA, APAC}"
      - name: contract_status
        type: enum
        source: system
        description: "Contract lifecycle state; starts ACTIVE at creation"
        constraints: "one of {ACTIVE, RENEWAL_REVIEW, RENEWED, CHURNED}"
      - name: contract_start_utc
        type: datetime
        source: input
        description: "Term start instant"
      - name: contract_end_utc
        type: datetime
        source: input
        description: "Term end instant; drives the automatic RENEWAL_REVIEW transition"
      - name: seat_count_contracted
        type: integer
        source: input
        description: "Seats paid for in the contract"
        constraints: ">= 1"
      - name: inquiry_allowance_total
        type: integer
        source: input
        description: "Inquiry units included in the term"
        constraints: ">= 0"
      - name: reprint_tier
        type: enum
        source: input
        description: "Reprint licensing tier available to this account"
        constraints: "one of {NONE, STANDARD, PREMIUM}"
      - name: active_seat_count
        type: integer
        source: computed
        description: "Count of Seats on this account whose status is ACTIVE"
      - name: provisioned_seat_count
        type: integer
        source: computed
        description: "Count of Seats on this account whose status is PROVISIONED"
      - name: revoked_seat_count
        type: integer
        source: computed
        description: "Count of Seats on this account whose status is REVOKED"
      - name: consumed_inquiry_units
        type: integer
        source: computed
        description: "Inquiry units settled by COMPLETED or NO_SHOW or late-CANCELLED inquiries"
      - name: reserved_inquiry_units
        type: integer
        source: computed
        description: "Inquiry units held by inquiries whose status is SCHEDULED or IN_PREP"
      - name: remaining_reserved_units
        type: integer
        source: computed
        description: "RESERVATION-variant ledger remainder: inquiry_allowance_total - consumed_inquiry_units - reserved_inquiry_units"
      - name: remaining_consumed_units
        type: integer
        source: computed
        description: "CONSUMPTION-variant ledger remainder: inquiry_allowance_total - consumed_inquiry_units"
      - name: utilization_score
        type: number
        source: computed
        description: "SEAT_WEIGHTED research-utilization score 0..100 driving the dashboard posture band"
      - name: utilization_score_active_weighted
        type: number
        source: computed
        description: "ACTIVE_WEIGHTED research-utilization score 0..100; the variant the contract-renewal gate reads"
      - name: renewal_posture
        type: enum
        source: computed
        description: "Derived renewal risk band"
        constraints: "one of {HEALTHY, WATCH, AT_RISK}"
      - name: renewal_decided_at
        type: datetime
        source: system
        description: "When the renewal decision was recorded"

  - name: Seat
    parent: ClientAccount
    common_fields: true
    fields:
      - name: client_account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the subscribing account that owns this seat"
      - name: seat_email
        type: string
        source: input
        description: "Named user's email; unique within the account"
      - name: research_role
        type: enum
        source: input
        description: "Role-based research entitlement profile"
        constraints: "one of {EXECUTIVE_VIEWER, PRACTITIONER, ARCHITECT, STRATEGIST}"
      - name: seat_kind
        type: enum
        source: input
        description: "Named seat or shared pool seat"
        constraints: "one of {NAMED, SHARED}"
        default: "NAMED"
      - name: status
        type: enum
        source: system
        description: "Seat lifecycle state"
        constraints: "one of {PROVISIONED, ACTIVE, REVOKED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Activation instant; null until activated"
      - name: revoked_at
        type: datetime
        source: system
        description: "Revocation instant; null until revoked"
      - name: entitlement_document_types
        type: array
        source: computed
        description: "Document types this seat may open, derived from research_role plus seat-level overrides. Role matrix: EXECUTIVE_VIEWER [MARKET_GUIDE]; PRACTITIONER [MARKET_GUIDE, COMPARATIVE_MATRIX, HYPE_PROFILE]; ARCHITECT [MARKET_GUIDE, COMPARATIVE_MATRIX, HYPE_PROFILE, CRITICAL_CAPABILITIES]; STRATEGIST [MARKET_GUIDE, COMPARATIVE_MATRIX, CRITICAL_CAPABILITIES]. entitlement_override_types are appended in the order supplied and de-duplicated."
      - name: entitlement_override_types
        type: array
        source: input
        description: "Optional extra document types granted on top of the role matrix"
        default: []
      - name: last_inquiry_at
        type: datetime
        source: system
        description: "Instant of the most recent inquiry submitted from this seat"

  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Analyst display name"
      - name: practice_area
        type: enum
        source: input
        description: "Primary research practice"
        constraints: "one of {CIO_TECH, DATA_ANALYTICS, SECURITY, ERP_FINANCE}"
      - name: topic_routes
        type: array
        source: input
        description: "Topic route codes this analyst accepts for inquiry routing"
      - name: seniority
        type: enum
        source: input
        description: "Analyst seniority band; drives inquiry routing rank"
        constraints: "one of {ASSOCIATE, SENIOR, VP, DISTINGUISHED}"
      - name: status
        type: enum
        source: input
        description: "Analyst availability"
        constraints: "one of {ACTIVE, ON_LEAVE, EMERITUS}"
        default: "ACTIVE"
      - name: open_inquiry_count
        type: integer
        source: computed
        description: "Inquiries assigned to this analyst in ROUTED, SCHEDULED or IN_PREP"
      - name: integrity_flag
        type: enum
        source: computed
        description: "Research-independence flag driven by active sales relationships"
        constraints: "one of {CLEAR, CONFLICT_REVIEW, CONFLICT_BLOCKED}"
      - name: conflicted_vendor_ids
        type: array
        source: computed
        description: "Vendors with which this analyst holds an ACTIVE SalesRelationship"
      - name: inquiries_completed_total
        type: integer
        source: computed
        description: "Lifetime count of inquiries this analyst completed"

  - name: InquiryRequest
    parent: Seat
    common_fields: true
    fields:
      - name: seat_id
        type: string
        source: input
        description: "FK -> Seat.id; the seat that spends the allowance unit"
      - name: analyst_id
        type: string
        source: system
        description: "FK -> Analyst.id; set by topic routing, cleared on decline and re-routed"
      - name: topic_route
        type: string
        source: input
        description: "Requested topic route code used by the routing selector"
      - name: question_summary
        type: string
        source: input
        description: "Client's inquiry question"
      - name: preparation_notes
        type: string
        source: input
        description: "Client-supplied preparation notes; required before the inquiry enters IN_PREP"
        default: ""
      - name: requested_start_utc
        type: datetime
        source: input
        description: "Client's requested start instant"
      - name: duration_minutes
        type: integer
        source: input
        description: "Requested inquiry length in minutes"
        constraints: "one of {30, 45, 60}"
      - name: scheduled_start_utc
        type: datetime
        source: system
        description: "Confirmed start instant; null until scheduled"
      - name: status
        type: enum
        source: system
        description: "Inquiry lifecycle state"
        constraints: "one of {SUBMITTED, ROUTED, SCHEDULED, IN_PREP, COMPLETED, NO_SHOW, CANCELLED}"
      - name: units_consumed
        type: integer
        source: computed
        description: "Allowance units this inquiry settles: 1 for COMPLETED, NO_SHOW and late CANCELLED; 0 otherwise"
      - name: note_delivered
        type: boolean
        source: system
        description: "Whether the analyst delivered inquiry notes"
      - name: note_reference
        type: string
        source: input
        description: "Free-text reference to the delivered note artefact"
        default: ""
      - name: routing_attempt_count
        type: integer
        source: computed
        description: "How many times topic routing has selected an analyst for this inquiry"
      - name: declined_analyst_ids
        type: array
        source: system
        description: "Analysts that already declined this inquiry; excluded from re-routing"
      - name: settled_at
        type: datetime
        source: system
        description: "Instant the inquiry reached a terminal state"

  - name: ResearchDocument
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Published research title"
      - name: doc_type
        type: enum
        source: input
        description: "Research artefact class; selects the default embargo length"
        constraints: "one of {MARKET_GUIDE, COMPARATIVE_MATRIX, HYPE_PROFILE, CRITICAL_CAPABILITIES}"
      - name: practice_area
        type: enum
        source: input
        description: "Practice that owns the document"
        constraints: "one of {CIO_TECH, DATA_ANALYTICS, SECURITY, ERP_FINANCE}"
      - name: lead_analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; the authoring analyst and the peer-review segregation-of-duties anchor"
      - name: editorial_status
        type: enum
        source: system
        description: "Editorial dimension of the document state (parallel to embargo_status)"
        constraints: "one of {DRAFT, PEER_REVIEW, FACT_CHECK, CLEARED, PUBLISHED, REVISED}"
      - name: embargo_status
        type: enum
        source: system
        description: "Embargo dimension of the document state; independent of editorial_status"
        constraints: "one of {EMBARGOED, RELEASED}"
      - name: embargo_days
        type: integer
        source: input
        description: "Embargo length in days; when omitted it defaults by doc_type: MARKET_GUIDE 30, COMPARATIVE_MATRIX 45, HYPE_PROFILE 14, CRITICAL_CAPABILITIES 21"
        constraints: ">= 0"
      - name: published_at
        type: datetime
        source: system
        description: "Publication instant; null until first published"
      - name: embargo_until
        type: datetime
        source: computed
        description: "published_at + embargo_days, weekend-rolled forward to the next Monday 00:00:00Z when it lands on Sat/Sun"
      - name: peer_reviewer_analyst_id
        type: string
        source: input
        description: "Analyst assigned to peer review; must differ from lead_analyst_id"
        default: ""
      - name: peer_verdict
        type: enum
        source: system
        description: "Reviewer verdict for the current review round"
        constraints: "one of {NOT_ASSIGNED, PENDING, APPROVE, REVISE}"
      - name: peer_review_round
        type: integer
        source: computed
        description: "How many peer-review rounds this document has entered"
      - name: fact_check_open_count
        type: integer
        source: computed
        description: "Inclusions on this document whose fact_check_status is REQUESTED or VENDOR_RESPONDED or DISPUTED"
      - name: included_vendor_count
        type: integer
        source: computed
        description: "Inclusions on this document whose inclusion_status is INCLUDED or APPEAL_UPHELD"
      - name: placement_locked
        type: boolean
        source: computed
        description: "True once the document has been published; the placement snapshot is frozen"
      - name: revision_count
        type: integer
        source: computed
        description: "How many times the document has been reopened for revision"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: "Vendor legal name"
      - name: hq_region
        type: enum
        source: input
        description: "Vendor headquarters region"
        constraints: "one of {NA, EMEA, APAC}"
      - name: employee_count_band
        type: enum
        source: input
        description: "Size band used by inclusion criteria"
        constraints: "one of {SMB, MIDMARKET, ENTERPRISE}"
      - name: status
        type: enum
        source: system
        description: "Vendor registry state; every registered vendor is ACTIVE, so the value is system-initialized at creation and never client-supplied"
        constraints: "one of {ACTIVE}"
      - name: active_sales_relationship_count
        type: integer
        source: computed
        description: "Count of SalesRelationship rows for this vendor whose status is ACTIVE"
      - name: briefing_eligible
        type: boolean
        source: computed
        description: "True when the vendor has at least one INCLUDED placement on a PUBLISHED document and no unresolved separation violation"
      - name: last_briefing_at
        type: datetime
        source: system
        description: "Instant of the most recent HELD briefing; null when none"

  - name: VendorInclusion
    parent: ResearchDocument
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: "FK -> ResearchDocument.id; the comparative research the vendor is evaluated in"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor under evaluation"
      - name: inclusion_status
        type: enum
        source: system
        description: "Placement dimension of the inclusion state"
        constraints: "one of {PROPOSED, UNDER_EVALUATION, INCLUDED, EXCLUDED, UNDER_APPEAL, APPEAL_UPHELD, APPEAL_DENIED, SUPERSEDED}"
      - name: fact_check_status
        type: enum
        source: system
        description: "Fact-check dimension of the inclusion state, a second state axis on the same row that evolves independently of inclusion_status"
        constraints: "one of {NOT_STARTED, REQUESTED, VENDOR_RESPONDED, ADJUDICATED, DISPUTED, LAPSED}"
      - name: dimension_scores
        type: array
        source: input
        description: "Evaluation rows supplied at creation: [{dimension, raw_score, weight_pct}]"
      - name: weighted_total_score
        type: number
        source: computed
        description: "Weighted evaluation score; each dimension rounded to 2dp before summing, sum rounded to 2dp"
      - name: inclusion_criteria_met_count
        type: integer
        source: input
        description: "How many of the six published inclusion criteria the vendor satisfies"
        constraints: "0..6"
      - name: criteria_evaluated_at
        type: datetime
        source: system
        description: "Instant the criteria count was recorded"
      - name: fact_check_round
        type: integer
        source: computed
        description: "Fact-check rounds opened for this inclusion"
      - name: fact_check_due_utc
        type: datetime
        source: computed
        description: "Vendor response deadline: request instant + 14 days, weekend-rolled to Monday 23:59:59Z"
      - name: fact_check_requested_at
        type: datetime
        source: system
        description: "Instant the current fact-check round was opened"
      - name: fact_check_response_at
        type: datetime
        source: system
        description: "Instant the vendor responded in the current round"
      - name: fact_check_late
        type: boolean
        source: computed
        description: "True when the response landed strictly after fact_check_due_utc"
      - name: reprint_tier
        type: enum
        source: input
        description: "Reprint licence tier purchased for this placement"
        constraints: "one of {NONE, STANDARD, PREMIUM}"
        default: "NONE"
      - name: permitted_marketing_use
        type: enum
        source: input
        description: "Contractually permitted marketing use of the placement"
        constraints: "one of {NO_USE, INTERNAL_ONLY, SOCIAL_SNIPPET, FULL_REPRINT}"
        default: "NO_USE"
      - name: reprint_copies_authorized
        type: integer
        source: input
        description: "Copies the licence authorizes"
        constraints: ">= 0"
        default: 0
      - name: reprint_copies_used
        type: integer
        source: computed
        description: "Copies consumed against the licence"
      - name: reprint_fee_cents
        type: integer
        source: computed
        description: "Licence fee in cents: tier base plus marginal overage copies, then a volume discount keyed on the pre-discount total"
      - name: appeal_filed_at
        type: datetime
        source: system
        description: "Instant the most recent appeal was filed; null when never appealed"
      - name: appeal_grounds
        type: string
        source: input
        description: "Vendor's stated grounds for the most recent appeal"
        default: ""
      - name: appeal_count
        type: integer
        source: computed
        description: "Lifetime count of appeals filed for this inclusion; capped at 2"
      - name: appeal_window_closes_at
        type: datetime
        source: computed
        description: "Publication instant + 30 days; the last instant an appeal may be filed"
      - name: placement_locked
        type: boolean
        source: computed
        description: "True once the parent document is published; freezes weighted_total_score"
      - name: lead_analyst_conflicted
        type: boolean
        source: computed
        description: "True when the document's lead analyst holds an ACTIVE SalesRelationship with this vendor"

  - name: VendorBriefing
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor requesting the briefing"
      - name: analyst_id
        type: string
        source: system
        description: "FK -> Analyst.id; assigned by briefing routing, cleared when screening fails"
      - name: briefing_topic
        type: string
        source: input
        description: "Topic the vendor wants to brief on"
      - name: requested_start_utc
        type: datetime
        source: input
        description: "Requested briefing start instant"
      - name: duration_minutes
        type: integer
        source: input
        description: "Briefing length in minutes"
        constraints: "one of {30, 45, 60}"
      - name: status
        type: enum
        source: system
        description: "Briefing lifecycle state"
        constraints: "one of {REQUESTED, SCREENED, SCHEDULED, HELD, DECLINED, REVOKED_BY_SEPARATION}"
      - name: separation_check_result
        type: enum
        source: computed
        description: "Outcome of the research/sales separation screening"
        constraints: "one of {PENDING, PASS, FAIL_SALES_RELATIONSHIP}"
      - name: held_at
        type: datetime
        source: system
        description: "Instant the briefing was recorded as held; null otherwise"

  - name: SalesRelationship
    parent: Analyst
    common_fields: true
    fields:
      - name: analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; the analyst with the commercial tie"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor paying the analyst"
      - name: relationship_type
        type: enum
        source: input
        description: "Nature of the commercial tie"
        constraints: "one of {SPONSORSHIP, PAID_ADVISORY, SPEAKING_FEE}"
      - name: annual_value_cents
        type: integer
        source: input
        description: "Annual value of the relationship in cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Relationship lifecycle state"
        constraints: "one of {ACTIVE, TERMINATED}"
      - name: started_at
        type: datetime
        source: system
        description: "Instant the relationship became ACTIVE"
      - name: terminated_at
        type: datetime
        source: system
        description: "Instant the relationship was terminated; null while ACTIVE"

  - name: ConferenceEvent
    parent: null
    common_fields: true
    fields:
      - name: event_name
        type: string
        source: input
        description: "Conference name"
      - name: venue_region
        type: enum
        source: input
        description: "Region the event is held in"
        constraints: "one of {NA, EMEA, APAC}"
      - name: start_utc
        type: datetime
        source: input
        description: "Event start instant"
      - name: end_utc
        type: datetime
        source: input
        description: "Event end instant"
      - name: status
        type: enum
        source: system
        description: "Event programming lifecycle state"
        constraints: "one of {DRAFT, PROGRAMMING, AGENDA_LOCKED, COMPLETED, CANCELLED}"
      - name: research_session_minutes
        type: integer
        source: computed
        description: "Total minutes of sessions whose session_kind is RESEARCH_SESSION"
      - name: sponsor_session_minutes
        type: integer
        source: computed
        description: "Total minutes of sessions whose session_kind is SPONSOR_KEYNOTE"
      - name: sponsor_minute_share
        type: number
        source: computed
        description: "sponsor_session_minutes / total session minutes, 4dp, 0 when no sessions exist"
      - name: sponsorship_revenue_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Sponsorship rows whose status is ACTIVE"
      - name: agenda_locked_at
        type: datetime
        source: system
        description: "Instant the agenda was locked; null otherwise"
      - name: sessions
        type: array
        source: computed
        description: "Agenda rows: [{session_title, session_kind, duration_minutes, sponsor_vendor_id}]"

  - name: Sponsorship
    parent: ConferenceEvent
    common_fields: true
    fields:
      - name: conference_event_id
        type: string
        source: input
        description: "FK -> ConferenceEvent.id; the event being sponsored"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the sponsoring vendor"
      - name: tier
        type: enum
        source: input
        description: "Sponsorship tier; PLATINUM carries an exclusive window"
        constraints: "one of {PLATINUM, GOLD, SILVER}"
      - name: amount_cents
        type: integer
        source: input
        description: "Contracted sponsorship amount in cents"
        constraints: ">= 0"
      - name: exclusivity_start_utc
        type: datetime
        source: input
        description: "Start of the tier exclusivity window (half-open)"
      - name: exclusivity_end_utc
        type: datetime
        source: input
        description: "End of the tier exclusivity window (exclusive)"
      - name: status
        type: enum
        source: system
        description: "Sponsorship lifecycle state"
        constraints: "one of {PENDING, ACTIVE, CANCELLED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Instant the sponsorship became ACTIVE"
      - name: cancelled_at
        type: datetime
        source: system
        description: "Instant the sponsorship was cancelled; null otherwise"
      - name: sponsor_slot_counted
        type: boolean
        source: computed
        description: "True while this ACTIVE sponsorship contributes to sponsorship_revenue_cents"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ClientAccount
    initial_state: ACTIVE
    terminal_states: [RENEWED, CHURNED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_REVIEW
        trigger: "system event — evaluated on every write that touches this account and on every GET of the account once the logical clock reaches contract_end_utc - 90 days"
        actor: system
        preconditions:
          - "logical clock >= contract_end_utc - 90 days"
          - "contract_status == ACTIVE"
        side_effects:
          - "contract_status = RENEWAL_REVIEW; updated_at refreshed; version incremented"
          - "renewal_posture recomputed from utilization_score (AT_RISK when utilization_score < 40, WATCH when < 70, else HEALTHY)"
        note: "The clock boundary is inclusive: the clock reading exactly contract_end_utc - 90 days enters RENEWAL_REVIEW."

      - from: RENEWAL_REVIEW
        to: RENEWED
        trigger: "POST /research/clients/{id}/renewal-decisions with decision RENEW"
        actor: ResearchDirector
        preconditions:
          - "contract_status == RENEWAL_REVIEW"
          - "utilization_score_active_weighted >= 40 (the ACTIVE_WEIGHTED variant is the one the gate reads)"
          - "no Seat on this account is in PROVISIONED status (every contracted seat must have been activated or revoked)"
        side_effects:
          - "contract_status = RENEWED; renewal_decided_at = clock; version incremented"
          - "utilization_score recomputed one final time and frozen into renewal_posture"
        note: "utilization_score exactly 40 passes (>= semantics)."

      - from: RENEWAL_REVIEW
        to: CHURNED
        trigger: "POST /research/clients/{id}/renewal-decisions with decision CHURN"
        actor: ResearchDirector
        preconditions:
          - "contract_status == RENEWAL_REVIEW"
        side_effects:
          - "contract_status = CHURNED; renewal_decided_at = clock; version incremented"
          - "every Seat on this account with status ACTIVE transitions to REVOKED; active_seat_count recomputed"
          - "every SalesRelationship whose analyst has no other ACTIVE account is untouched — the churn cascade stops at Seat"

  - entity: Seat
    initial_state: PROVISIONED
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /research/seats/{id}/activate"
        actor: ClientAdmin
        preconditions:
          - "the owning ClientAccount.contract_status == ACTIVE"
          - "Seat.status == PROVISIONED"
        side_effects:
          - "Seat.status = ACTIVE; activated_at = clock; version incremented"
          - "entitlement_document_types computed from research_role plus entitlement_override_types"
          - "ClientAccount.active_seat_count incremented; ClientAccount.provisioned_seat_count decremented"
          - "ClientAccount.utilization_score recomputed; ClientAccount.renewal_posture recomputed"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /research/seats/{id}/revoke"
        actor: ClientAdmin
        preconditions:
          - "Seat.status == ACTIVE"
        side_effects:
          - "Seat.status = REVOKED; revoked_at = clock; version incremented"
          - "entitlement_document_types = []"
          - "ClientAccount.active_seat_count decremented; ClientAccount.revoked_seat_count incremented"
          - "ClientAccount.utilization_score recomputed (SEAT_WEIGHTED variant); ClientAccount.renewal_posture recomputed"
          - "when the recomputed ClientAccount.utilization_score < 40 the account enters the AT_RISK posture, and when ClientAccount.active_seat_count < ceil(seat_count_contracted / 2) the account's contract_status moves ACTIVE -> RENEWAL_REVIEW with updated_at refreshed"

      - from: PROVISIONED
        to: REVOKED
        trigger: "POST /research/seats/{id}/revoke"
        actor: ClientAdmin
        preconditions:
          - "Seat.status == PROVISIONED"
        side_effects:
          - "Seat.status = REVOKED; revoked_at = clock; version incremented"
          - "ClientAccount.provisioned_seat_count decremented; ClientAccount.revoked_seat_count incremented"
          - "ClientAccount.utilization_score recomputed; ClientAccount.renewal_posture recomputed"

  - entity: InquiryRequest
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ROUTED
        trigger: "system event — topic routing runs inside POST /research/inquiry-requests"
        actor: system
        preconditions:
          - "the owning Seat.status == ACTIVE"
          - "the owning ClientAccount.contract_status == ACTIVE"
        side_effects:
          - "analyst_id = the topic-routing selector winner; routing_attempt_count = 1; status = ROUTED; version incremented"
          - "Analyst.open_inquiry_count incremented on the winner"
          - "Seat.last_inquiry_at = clock"

      - from: ROUTED
        to: SCHEDULED
        trigger: "POST /research/inquiry-requests/{id}/schedule"
        actor: Analyst
        preconditions:
          - "X-User-ID == InquiryRequest.analyst_id"
          - "status == ROUTED"
          - "scheduled_start_utc >= clock (the requested slot is not in the past)"
          - "the requested [scheduled_start_utc, scheduled_start_utc + duration_minutes) window does not overlap any other SCHEDULED or IN_PREP inquiry of the same analyst"
          - "the analyst has fewer than 3 inquiries whose scheduled_start_utc falls on the same UTC calendar day as the requested slot"
          - "ClientAccount.remaining_reserved_units >= 1"
        side_effects:
          - "status = SCHEDULED; scheduled_start_utc = the supplied instant; version incremented"
          - "ClientAccount.reserved_inquiry_units incremented; remaining_reserved_units recomputed"
          - "remaining_consumed_units unchanged (the CONSUMPTION ledger does not move until settlement)"

      - from: SCHEDULED
        to: ROUTED
        trigger: "POST /research/inquiry-requests/{id}/decline"
        actor: Analyst
        preconditions:
          - "X-User-ID == InquiryRequest.analyst_id"
          - "status == SCHEDULED"
        side_effects:
          - "the declining analyst is appended to declined_analyst_ids and removed from eligibility for re-routing"
          - "topic routing re-runs over the remaining eligible analysts; analyst_id = the new winner; routing_attempt_count incremented"
          - "status = ROUTED; scheduled_start_utc cleared; version incremented"
          - "ClientAccount.reserved_inquiry_units decremented (the reservation is released); remaining_reserved_units recomputed"
          - "the previous analyst's Analyst.open_inquiry_count decremented; the new analyst's incremented"

      - from: SCHEDULED
        to: IN_PREP
        trigger: "system event — evaluated whenever the inquiry is read or written once the logical clock reaches scheduled_start_utc - 24 hours"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "logical clock >= scheduled_start_utc - 24 hours"
        side_effects:
          - "status = IN_PREP; version incremented"
          - "preparation_notes becomes mandatory for the completion step (an empty preparation_notes blocks COMPLETED with ERR_PREPARATION_NOTES_REQUIRED)"
        note: "The boundary is inclusive: the clock reading exactly scheduled_start_utc - 24 hours enters IN_PREP."

      - from: IN_PREP
        to: COMPLETED
        trigger: "POST /research/inquiry-requests/{id}/complete with outcome COMPLETED"
        actor: Analyst
        preconditions:
          - "X-User-ID == InquiryRequest.analyst_id"
          - "status == IN_PREP"
          - "logical clock >= scheduled_start_utc"
          - "note_delivered == true"
          - "preparation_notes is non-empty"
        side_effects:
          - "status = COMPLETED; units_consumed = 1; settled_at = clock; version incremented"
          - "ClientAccount.reserved_inquiry_units decremented; ClientAccount.consumed_inquiry_units incremented; both ledger remainders recomputed"
          - "ClientAccount.utilization_score recomputed; renewal_posture recomputed"
          - "Analyst.open_inquiry_count decremented; Analyst.inquiries_completed_total incremented"

      - from: IN_PREP
        to: NO_SHOW
        trigger: "POST /research/inquiry-requests/{id}/complete with outcome NO_SHOW"
        actor: Analyst
        preconditions:
          - "X-User-ID == InquiryRequest.analyst_id"
          - "status == IN_PREP"
          - "logical clock >= scheduled_start_utc"
        side_effects:
          - "status = NO_SHOW; units_consumed = 1; note_delivered = false; settled_at = clock; version incremented"
          - "ClientAccount.reserved_inquiry_units decremented; ClientAccount.consumed_inquiry_units incremented; both ledger remainders recomputed"
          - "ClientAccount.utilization_score recomputed; renewal_posture recomputed"
          - "Analyst.open_inquiry_count decremented"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /research/inquiry-requests/{id}/cancel"
        actor: SeatHolder
        preconditions:
          - "X-User-ID == the id of the Seat named by InquiryRequest.seat_id"
          - "status == SCHEDULED or status == IN_PREP"
        side_effects:
          - "free cancellation (logical clock <= scheduled_start_utc - 24 hours): units_consumed = 0; ClientAccount.reserved_inquiry_units decremented only"
          - "late cancellation (logical clock > scheduled_start_utc - 24 hours): units_consumed = 1; ClientAccount.reserved_inquiry_units decremented AND ClientAccount.consumed_inquiry_units incremented"
          - "status = CANCELLED; settled_at = clock; version incremented"
          - "Analyst.open_inquiry_count decremented; ClientAccount.utilization_score recomputed in both branches"

      - from: IN_PREP
        to: CANCELLED
        trigger: "POST /research/inquiry-requests/{id}/cancel"
        actor: SeatHolder
        preconditions:
          - "X-User-ID == the id of the Seat named by InquiryRequest.seat_id"
          - "status == IN_PREP"
        side_effects:
          - "late cancellation (the clock is already past scheduled_start_utc - 24 hours by construction): units_consumed = 1; ClientAccount.reserved_inquiry_units decremented AND ClientAccount.consumed_inquiry_units incremented"
          - "status = CANCELLED; settled_at = clock; version incremented"
          - "Analyst.open_inquiry_count decremented; ClientAccount.utilization_score recomputed"

      - from: ROUTED
        to: CANCELLED
        trigger: "POST /research/inquiry-requests/{id}/cancel"
        actor: SeatHolder
        preconditions:
          - "X-User-ID == the id of the Seat named by InquiryRequest.seat_id"
          - "status == ROUTED"
        side_effects:
          - "status = CANCELLED; units_consumed = 0; settled_at = clock; version incremented"
          - "Analyst.open_inquiry_count decremented on the routed analyst"

  - entity: ResearchDocument
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PEER_REVIEW
        trigger: "POST /research/documents/{id}/submit-for-review"
        actor: Analyst
        preconditions:
          - "editorial_status == DRAFT or editorial_status == REVISED"
          - "peer_reviewer_analyst_id is set and differs from lead_analyst_id"
        side_effects:
          - "editorial_status = PEER_REVIEW; peer_verdict = PENDING; peer_review_round incremented; version incremented"

      - from: REVISED
        to: PEER_REVIEW
        trigger: "POST /research/documents/{id}/submit-for-review"
        actor: Analyst
        preconditions:
          - "editorial_status == REVISED"
          - "peer_reviewer_analyst_id is set and differs from lead_analyst_id"
        side_effects:
          - "editorial_status = PEER_REVIEW; peer_verdict = PENDING; peer_review_round incremented; version incremented"

      - from: PEER_REVIEW
        to: FACT_CHECK
        trigger: "POST /research/documents/{id}/peer-verdicts with verdict APPROVE"
        actor: Analyst
        preconditions:
          - "X-User-ID == peer_reviewer_analyst_id"
          - "editorial_status == PEER_REVIEW"
        side_effects:
          - "peer_verdict = APPROVE; editorial_status = FACT_CHECK; version incremented"
          - "for every VendorInclusion on this document whose inclusion_status is INCLUDED: fact_check_status REQUESTED, fact_check_requested_at = clock, fact_check_round incremented, fact_check_due_utc = clock + 14 days weekend-rolled forward to the following Monday 23:59:59Z when the 14th day lands on Sat/Sun"
          - "fact_check_open_count recomputed on the document"

      - from: PEER_REVIEW
        to: DRAFT
        trigger: "POST /research/documents/{id}/peer-verdicts with verdict REVISE"
        actor: Analyst
        preconditions:
          - "X-User-ID == peer_reviewer_analyst_id"
          - "editorial_status == PEER_REVIEW"
        side_effects:
          - "peer_verdict = REVISE; editorial_status = DRAFT; version incremented"

      - from: FACT_CHECK
        to: CLEARED
        trigger: "system event — fires when the last open fact-check of the document is adjudicated ACCEPT"
        actor: system
        preconditions:
          - "editorial_status == FACT_CHECK"
          - "at least one VendorInclusion on this document has inclusion_status == INCLUDED"
          - "every VendorInclusion on this document whose inclusion_status is INCLUDED has fact_check_status == ADJUDICATED"
        side_effects:
          - "editorial_status = CLEARED; fact_check_open_count = 0; version incremented"

      - from: CLEARED
        to: PUBLISHED
        trigger: "POST /research/documents/{id}/publish"
        actor: ResearchDirector
        preconditions:
          - "editorial_status == CLEARED"
        side_effects:
          - "editorial_status = PUBLISHED; published_at = clock; embargo_status = EMBARGOED; embargo_until = published_at + embargo_days (weekend-rolled to the next Monday 00:00:00Z); revision_count unchanged; version incremented"
          - "CASCADE (depth 3, trigger = publish): (1) every VendorInclusion on this document gets placement_locked = true and freezes weighted_total_score; (2) for each such inclusion whose inclusion_status is INCLUDED, the linked Vendor.briefing_eligible becomes true; for each whose inclusion_status is EXCLUDED, appeal_window_closes_at = published_at + 30 days; (3) the document's included_vendor_count is recomputed from the frozen snapshot"

      - from: PUBLISHED
        to: REVISED
        trigger: "POST /research/documents/{id}/revise"
        actor: Analyst
        preconditions:
          - "editorial_status == PUBLISHED"
        side_effects:
          - "editorial_status = REVISED; revision_count incremented; version incremented"
          - "for every VendorInclusion on this document with inclusion_status in {INCLUDED, APPEAL_UPHELD}: placement_locked = false, fact_check_status = REQUESTED, fact_check_round incremented, fact_check_requested_at = clock, fact_check_due_utc recomputed"
          - "fact_check_open_count recomputed"

      - from: REVISED
        to: FACT_CHECK
        trigger: "system event — fires immediately after a revision opens fact-check rounds"
        actor: system
        preconditions:
          - "editorial_status == REVISED"
          - "at least one VendorInclusion on this document has fact_check_status == REQUESTED"
        side_effects:
          - "editorial_status = FACT_CHECK; version incremented"

    note: "editorial_status and embargo_status are parallel dimensions on the same row. embargo_status moves EMBARGOED -> RELEASED on its own schedule (see below) and does not change editorial_status."

  - entity: ResearchDocument
    dimension: embargo_status
    initial_state: EMBARGOED
    terminal_states: [RELEASED]
    transitions:
      - from: EMBARGOED
        to: RELEASED
        trigger: "system event — evaluated on every read or write of the document once the logical clock reaches embargo_until"
        actor: system
        preconditions:
          - "logical clock >= embargo_until"
        side_effects:
          - "embargo_status = RELEASED; version incremented"
        note: "Inclusive boundary: the clock reading exactly embargo_until releases the embargo. A document whose editorial_status is DRAFT/CLEARED before it is ever published keeps embargo_status = EMBARGOED with embargo_until null; the transition only applies once published_at is set."

  - entity: VendorInclusion
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: UNDER_EVALUATION
        trigger: "system event — fires when the inclusion is created with a complete dimension_scores set"
        actor: system
        preconditions:
          - "dimension_scores weights sum to exactly 1.00"
        side_effects:
          - "inclusion_status = UNDER_EVALUATION; weighted_total_score computed; criteria_evaluated_at = clock; version incremented"

      - from: UNDER_EVALUATION
        to: INCLUDED
        trigger: "POST /research/vendor-inclusions/{id}/finalize with outcome INCLUDE"
        actor: ResearchDirector
        preconditions:
          - "inclusion_status == UNDER_EVALUATION"
          - "inclusion_criteria_met_count >= 4"
          - "weighted_total_score >= 2.50"
        side_effects:
          - "inclusion_status = INCLUDED; version incremented"
          - "the parent ResearchDocument.included_vendor_count recomputed"

      - from: UNDER_EVALUATION
        to: EXCLUDED
        trigger: "POST /research/vendor-inclusions/{id}/finalize with outcome EXCLUDE"
        actor: ResearchDirector
        preconditions:
          - "inclusion_status == UNDER_EVALUATION"
        side_effects:
          - "inclusion_status = EXCLUDED; version incremented"
          - "when the parent document is already PUBLISHED, appeal_window_closes_at = published_at + 30 days"

      - from: EXCLUDED
        to: UNDER_APPEAL
        trigger: "POST /research/vendor-inclusions/{id}/appeals"
        actor: VendorRep
        preconditions:
          - "X-User-ID == VendorInclusion.vendor_id"
          - "inclusion_status == EXCLUDED or inclusion_status == APPEAL_DENIED"
          - "appeal_count < 2"
          - "the parent document is PUBLISHED and the logical clock <= appeal_window_closes_at"
        side_effects:
          - "inclusion_status = UNDER_APPEAL; appeal_filed_at = clock; appeal_grounds stored; appeal_count incremented; version incremented"

      - from: APPEAL_DENIED
        to: UNDER_APPEAL
        trigger: "POST /research/vendor-inclusions/{id}/appeals"
        actor: VendorRep
        preconditions:
          - "X-User-ID == VendorInclusion.vendor_id"
          - "appeal_count < 2"
          - "the parent document is PUBLISHED and the logical clock <= appeal_window_closes_at"
        side_effects:
          - "inclusion_status = UNDER_APPEAL; appeal_filed_at = clock; appeal_grounds replaced; appeal_count incremented; version incremented"
        note: "This is the appeal loop: EXCLUDED -> UNDER_APPEAL -> APPEAL_DENIED -> UNDER_APPEAL, capped at appeal_count == 2."

      - from: UNDER_APPEAL
        to: APPEAL_UPHELD
        trigger: "POST /research/vendor-inclusions/{id}/appeal-decisions with outcome UPHOLD"
        actor: ResearchDirector
        preconditions:
          - "inclusion_status == UNDER_APPEAL"
        side_effects:
          - "inclusion_status = APPEAL_UPHELD; version incremented"
          - "the parent ResearchDocument.included_vendor_count recomputed"
          - "when the parent document's editorial_status == PUBLISHED, the document moves PUBLISHED -> REVISED (revision_count incremented) and every inclusion on it with inclusion_status INCLUDED or APPEAL_UPHELD gets fact_check_status = REQUESTED"

      - from: UNDER_APPEAL
        to: APPEAL_DENIED
        trigger: "POST /research/vendor-inclusions/{id}/appeal-decisions with outcome DENY"
        actor: ResearchDirector
        preconditions:
          - "inclusion_status == UNDER_APPEAL"
        side_effects:
          - "inclusion_status = APPEAL_DENIED; version incremented"
          - "the placement snapshot is unchanged; appeal_count stays at its current value so a second appeal remains possible"

      - from: INCLUDED
        to: SUPERSEDED
        trigger: "system event — fires when a newer VendorInclusion for the same (document_id, vendor_id) pair is created"
        actor: system
        preconditions:
          - "a VendorInclusion row for the same document_id and vendor_id has been created with a later created_at"
        side_effects:
          - "inclusion_status = SUPERSEDED; placement_locked = false; version incremented"
          - "the parent ResearchDocument.included_vendor_count recomputed"

    note: "inclusion_status and fact_check_status are parallel dimensions on the same row; a fact-check round never changes inclusion_status and an appeal never changes fact_check_status."

  - entity: VendorInclusion
    dimension: fact_check_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: REQUESTED
        trigger: "system event — fires when the parent document enters FACT_CHECK or is revised"
        actor: system
        preconditions:
          - "inclusion_status is INCLUDED or APPEAL_UPHELD"
        side_effects:
          - "fact_check_status = REQUESTED; fact_check_requested_at = clock; fact_check_round incremented; fact_check_due_utc = fact_check_requested_at + 14 days weekend-rolled forward to the following Monday 23:59:59Z when the 14th day lands on Sat/Sun"

      - from: REQUESTED
        to: VENDOR_RESPONDED
        trigger: "POST /research/vendor-inclusions/{id}/fact-check-responses"
        actor: VendorRep
        preconditions:
          - "X-User-ID == VendorInclusion.vendor_id"
          - "fact_check_status == REQUESTED"
        side_effects:
          - "fact_check_status = VENDOR_RESPONDED; fact_check_response_at = clock; fact_check_late = (clock > fact_check_due_utc); version incremented"
          - "a late response additionally sets the parent document's peer_review_round-independent penalty: the inclusion's weighted_total_score is reduced by 0.25 (floor 0.00) and, when fact_check_late is true for two consecutive rounds, inclusion_status moves to EXCLUDED"

      - from: REQUESTED
        to: LAPSED
        trigger: "system event — evaluated on every read or write of the inclusion once the logical clock passes fact_check_due_utc"
        actor: system
        preconditions:
          - "fact_check_status == REQUESTED"
          - "logical clock > fact_check_due_utc"
        side_effects:
          - "fact_check_status = LAPSED; fact_check_late = true; version incremented"
          - "the parent ResearchDocument.fact_check_open_count recomputed"
        note: "Strict boundary: a response at exactly fact_check_due_utc is on time; one second later the cycle lapses."

      - from: VENDOR_RESPONDED
        to: ADJUDICATED
        trigger: "POST /research/vendor-inclusions/{id}/fact-check-decisions with outcome ACCEPT"
        actor: ResearchDirector
        preconditions:
          - "fact_check_status == VENDOR_RESPONDED"
        side_effects:
          - "fact_check_status = ADJUDICATED; version incremented"
          - "the parent ResearchDocument.fact_check_open_count recomputed; when it reaches 0 and editorial_status == FACT_CHECK the document moves to CLEARED"

      - from: VENDOR_RESPONDED
        to: DISPUTED
        trigger: "POST /research/vendor-inclusions/{id}/fact-check-decisions with outcome DISPUTE"
        actor: ResearchDirector
        preconditions:
          - "fact_check_status == VENDOR_RESPONDED"
          - "fact_check_round < 3"
        side_effects:
          - "fact_check_status = DISPUTED; version incremented"

      - from: DISPUTED
        to: REQUESTED
        trigger: "system event — fires immediately after a dispute, opening the next fact-check round"
        actor: system
        preconditions:
          - "fact_check_status == DISPUTED"
        side_effects:
          - "fact_check_status = REQUESTED; fact_check_round incremented; fact_check_requested_at = clock; fact_check_due_utc recomputed"
        note: "This is the fact-check loop: REQUESTED -> VENDOR_RESPONDED -> DISPUTED -> REQUESTED, capped at fact_check_round == 3."

  - entity: VendorBriefing
    initial_state: REQUESTED
    terminal_states: [HELD, DECLINED, REVOKED_BY_SEPARATION]
    transitions:
      - from: REQUESTED
        to: SCREENED
        trigger: "system event — separation screening runs inside POST /research/vendor-briefings"
        actor: system
        preconditions:
          - "no Analyst with an ACTIVE SalesRelationship to this vendor has the briefing topic in topic_routes"
        side_effects:
          - "status = SCREENED; separation_check_result = PASS; analyst_id = the briefing-routing selector winner; version incremented"
        note: "Briefing routing selector: eligibility = Analyst.status == ACTIVE AND briefing_topic IN Analyst.topic_routes AND Analyst.integrity_flag == CLEAR; ranking = open briefing count ASC, then created_at ASC; empty pool = 403 ERR_BRIEFING_SEPARATION_FAILED (every topic-eligible analyst is conflicted) and no VendorBriefing row is created."

      - from: SCREENED
        to: SCHEDULED
        trigger: "system event — the slot is confirmed when the briefing is created with a requested_start_utc that passes the buffer check"
        actor: system
        preconditions:
          - "the requested [requested_start_utc, requested_start_utc + duration_minutes) window, expanded by a 15-minute buffer on both sides, does not overlap any other SCHEDULED or HELD briefing of the assigned analyst"
        side_effects:
          - "status = SCHEDULED; version incremented"

      - from: SCREENED
        to: DECLINED
        trigger: "POST /research/vendor-briefings/{id}/record-briefing with held_at omitted and decline_reason present"
        actor: Analyst
        preconditions:
          - "status == SCREENED or status == SCHEDULED"
        side_effects:
          - "status = DECLINED; version incremented; the vendor's last_briefing_at is unchanged"

      - from: SCHEDULED
        to: HELD
        trigger: "POST /research/vendor-briefings/{id}/record-briefing"
        actor: Analyst
        preconditions:
          - "X-User-ID == VendorBriefing.analyst_id"
          - "status == SCHEDULED"
          - "logical clock >= requested_start_utc"
        side_effects:
          - "status = HELD; held_at = clock; version incremented"
          - "the linked Vendor.last_briefing_at = clock; the linked Vendor.briefing_eligible recomputed"

      - from: REQUESTED
        to: REVOKED_BY_SEPARATION
        trigger: "CASCADE from POST /research/sales-relationships — see SalesRelationship.ACTIVE -> ACTIVE (side-effect chain)"
        actor: system
        preconditions:
          - "a SalesRelationship for the same (analyst_id, vendor_id) pair became ACTIVE while this briefing was in REQUESTED, SCREENED or SCHEDULED"
        side_effects:
          - "status = REVOKED_BY_SEPARATION; separation_check_result = FAIL_SALES_RELATIONSHIP; version incremented"

      - from: SCREENED
        to: REVOKED_BY_SEPARATION
        trigger: "CASCADE from POST /research/sales-relationships"
        actor: system
        preconditions:
          - "a SalesRelationship for the same (analyst_id, vendor_id) pair became ACTIVE while this briefing was open"
        side_effects:
          - "status = REVOKED_BY_SEPARATION; separation_check_result = FAIL_SALES_RELATIONSHIP; version incremented"

      - from: SCHEDULED
        to: REVOKED_BY_SEPARATION
        trigger: "CASCADE from POST /research/sales-relationships"
        actor: system
        preconditions:
          - "a SalesRelationship for the same (analyst_id, vendor_id) pair became ACTIVE while this briefing was open"
        side_effects:
          - "status = REVOKED_BY_SEPARATION; separation_check_result = FAIL_SALES_RELATIONSHIP; version incremented"

  - entity: SalesRelationship
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /research/sales-relationships — creation cascade (the row is created ACTIVE and immediately propagates)"
        actor: system
        preconditions:
          - "the referenced Analyst exists and the referenced Vendor exists"
        side_effects:
          - "CASCADE (depth 4, trigger = sales-relationship creation): (1) Analyst.conflicted_vendor_ids gains this vendor_id and Analyst.integrity_flag becomes CONFLICT_BLOCKED once that list holds 3 or more entries, otherwise CONFLICT_REVIEW; (2) every VendorBriefing for this (analyst_id, vendor_id) pair whose status is REQUESTED, SCREENED or SCHEDULED moves to REVOKED_BY_SEPARATION with separation_check_result = FAIL_SALES_RELATIONSHIP; (3) every VendorInclusion whose parent ResearchDocument.lead_analyst_id == this analyst_id AND whose vendor_id == this vendor_id AND whose inclusion_status is PROPOSED or UNDER_EVALUATION gets lead_analyst_conflicted = true and reverts to PROPOSED; (4) the linked Vendor.active_sales_relationship_count incremented and Vendor.briefing_eligible recomputed"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /research/sales-relationships/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status = TERMINATED; terminated_at = clock; version incremented"
          - "Analyst.conflicted_vendor_ids loses this vendor_id; Analyst.integrity_flag drops back to CONFLICT_REVIEW while 1 or 2 ties remain and to CLEAR when none remain"
          - "the linked Vendor.active_sales_relationship_count decremented; Vendor.briefing_eligible recomputed"
          - "briefings already REVOKED_BY_SEPARATION are NOT restored; the compensating action does not resurrect a terminal briefing"

  - entity: ConferenceEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROGRAMMING
        trigger: "POST /research/conference-events/{id}/sessions — the first agenda row opens programming"
        actor: EventProgrammer
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status = PROGRAMMING; the session row is appended to sessions; research_session_minutes / sponsor_session_minutes / sponsor_minute_share recomputed; version incremented"

      - from: PROGRAMMING
        to: PROGRAMMING
        trigger: "POST /research/conference-events/{id}/sessions"
        actor: EventProgrammer
        preconditions:
          - "status == PROGRAMMING"
          - "appending the row keeps sponsor_session_minutes / total session minutes <= 0.40"
          - "when the row is a SPONSOR_KEYNOTE with a sponsor_vendor_id, that vendor must not hold an ACTIVE PLATINUM sponsorship whose exclusivity window overlaps the event window unless it is that vendor's own sponsorship"
        side_effects:
          - "the session row is appended; research_session_minutes / sponsor_session_minutes / sponsor_minute_share recomputed; version incremented"

      - from: PROGRAMMING
        to: AGENDA_LOCKED
        trigger: "POST /research/conference-events/{id}/lock-agenda"
        actor: EventProgrammer
        preconditions:
          - "status == PROGRAMMING"
          - "the agenda has at least one RESEARCH_SESSION"
        side_effects:
          - "status = AGENDA_LOCKED; agenda_locked_at = clock; version incremented"

      - from: AGENDA_LOCKED
        to: PROGRAMMING
        trigger: "POST /research/conference-events/{id}/sessions"
        actor: EventProgrammer
        preconditions:
          - "status == AGENDA_LOCKED"
          - "the request supplies a session row whose session_kind is RESEARCH_SESSION"
        side_effects:
          - "status reverts to PROGRAMMING; the session row is appended; sponsor_minute_share recomputed; version incremented"
        note: "Reopening programming is the only way to add agenda rows after a lock; sponsor rows alone do not reopen the agenda."

      - from: AGENDA_LOCKED
        to: COMPLETED
        trigger: "system event — evaluated on read once the logical clock passes end_utc"
        actor: system
        preconditions:
          - "status == AGENDA_LOCKED"
          - "logical clock > end_utc"
        side_effects:
          - "status = COMPLETED; version incremented"

  - entity: Sponsorship
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /research/sponsorships/{id}/activate"
        actor: EventProgrammer
        preconditions:
          - "status == PENDING"
          - "the linked ConferenceEvent.status is DRAFT or PROGRAMMING"
        side_effects:
          - "status = ACTIVE; activated_at = clock; sponsor_slot_counted = true; version incremented"
          - "ConferenceEvent.sponsorship_revenue_cents incremented by amount_cents; ConferenceEvent.version incremented"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /research/sponsorships/{id}/cancel"
        actor: EventProgrammer
        preconditions:
          - "status == ACTIVE"
          - "the linked ConferenceEvent.status is DRAFT or PROGRAMMING (a locked agenda can no longer be un-sold)"
        side_effects:
          - "status = CANCELLED; cancelled_at = clock; sponsor_slot_counted = false; version incremented"
          - "ConferenceEvent.sponsorship_revenue_cents decremented by amount_cents; ConferenceEvent.version incremented"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: inclusion-create-stale-document
    parent_entity: ResearchDocument
    write_endpoint: "POST /research/documents/{id}/vendor-inclusions"
    occ_field: "expected_document_version"
    description: |
      Creating a VendorInclusion against a ResearchDocument whose version has
      advanced since the client last observed it is rejected. The product
      spec allows a newer inclusion for the same (document, vendor) pair to
      legitimately supersede an older one, so a second create is not blocked
      by any state precondition — the stale-version check is what keeps the
      evaluation snapshot coherent.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: relationship-create-stale-analyst
    parent_entity: Analyst
    write_endpoint: "POST /research/sales-relationships"
    occ_field: "expected_analyst_version"
    description: |
      Creating a SalesRelationship against an Analyst whose version has
      advanced since the client last observed it is rejected. An analyst may
      hold several commercial ties to the same vendor (a sponsorship and a
      paid advisory, for example), so a second create is legitimate under the
      product semantics; the stale-version check keeps the separation cascade
      from replaying against an outdated view of the analyst.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sponsorship-create-stale-event
    parent_entity: ConferenceEvent
    write_endpoint: "POST /research/sponsorships"
    occ_field: "expected_conference_event_version"
    description: |
      Creating a Sponsorship against a ConferenceEvent whose version has
      advanced since the client last observed it is rejected. Several
      sponsorships for one event are legitimate (different vendors, different
      tiers, non-overlapping windows), so the second create is not blocked by
      a state precondition; the stale-version check protects the revenue and
      exclusivity arithmetic from an outdated event view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: inquiry_allowance_ledger
    trigger: "recomputed on every InquiryRequest state change and on every ClientAccount read"
    algorithm: aggregation
    formula: |
      # Subject: one ClientAccount A.
      consumed_units(A) = count(InquiryRequest where seat.client_account_id == A
                                and status IN {COMPLETED, NO_SHOW})
                        + count(InquiryRequest where seat.client_account_id == A
                                and status == CANCELLED and units_consumed == 1)
      reserved_units(A) = count(InquiryRequest where seat.client_account_id == A
                                and status IN {SCHEDULED, IN_PREP})

      # CONSUMPTION variant — the renewal-overage report
      A.remaining_consumed_units = A.inquiry_allowance_total - consumed_units(A)

      # RESERVATION variant — the scheduling gate
      A.remaining_reserved_units = A.inquiry_allowance_total - consumed_units(A) - reserved_units(A)

      # Both are exposed; neither is derived from the other.
      A.consumed_inquiry_units = consumed_units(A)
      A.reserved_inquiry_units = reserved_units(A)
    input_set: "InquiryRequests whose seat belongs to A. COMPLETED, NO_SHOW and late-CANCELLED inquiries are settled and consume a unit; SCHEDULED and IN_PREP inquiries are reserved but not yet settled; ROUTED, SUBMITTED and free-CANCELLED inquiries consume nothing."
    constants:
      LATE_CANCEL_UNITS: 1
      FREE_CANCEL_UNITS: 0
    precision: "integer units, no rounding"
    variants:
      - name: CONSUMPTION
        when: "renewal overage reporting and the utilization score's usage component"
        difference: "ignores reserved_units entirely, so an account with open SCHEDULED inquiries reads a larger remainder"
      - name: RESERVATION
        when: "the scheduling gate on POST /research/inquiry-requests/{id}/schedule"
        difference: "debits both settled and reserved units, so the gate blocks a new booking before the settled ledger would"

  - name: research_utilization_score
    trigger: "recomputed on seat activation, seat revocation, inquiry settlement, and contract renewal review"
    algorithm: weighted_scoring
    formula: |
      # Subject: one ClientAccount A. Three weighted components, each capped at its weight.
      activation_term = 40 * min(1, active_seat_count / (0.80 * seat_count_contracted))
      usage_term      = 35 * min(1, consumed_inquiry_units / (0.70 * usage_denominator))
      retention_term  = 25 * min(1, (1 - revoked_seat_count / seat_count_contracted) / 0.95)
      utilization_score = round_half_up(activation_term + usage_term + retention_term, 2)

      # SEAT_WEIGHTED: usage_denominator = inquiry_allowance_total
      # ACTIVE_WEIGHTED: usage_denominator = round_half_up(inquiry_allowance_total * active_seat_count / seat_count_contracted, 2)

      # Guard: when seat_count_contracted == 0 the score is 0.00; when the usage
      # denominator is 0 the usage_term is 0 (never NaN); when active_seat_count
      # is 0 the ACTIVE_WEIGHTED variant returns 0.00 outright.
      # renewal_posture = AT_RISK when score < 40, WATCH when 40 <= score < 70, HEALTHY when score >= 70.
    input_set: "Seats of A in ACTIVE and REVOKED status; settled InquiryRequests of A (CONSUMPTION variant of the ledger)."
    constants:
      ACTIVATION_WEIGHT: 40
      USAGE_WEIGHT: 35
      RETENTION_WEIGHT: 25
      ACTIVATION_TARGET_RATE: 0.80
      USAGE_TARGET_RATE: 0.70
      RETENTION_TARGET_RATE: 0.95
      AT_RISK_CEILING: 40
      WATCH_CEILING: 70
    precision: "2 decimal places, round_half_up, applied once to the summed terms"
    variants:
      - name: SEAT_WEIGHTED
        when: "the account dashboard read (GET /research/clients/{id})"
        difference: "normalizes the usage term against the full contracted allowance, so an account that bought seats it never activated is penalised"
      - name: ACTIVE_WEIGHTED
        when: "the contract-renewal gate on POST /research/clients/{id}/renewal-decisions"
        difference: "pro-rates the allowance denominator to the activated footprint, so the same account scores higher once unused seats are excluded"

  - name: vendor_evaluation_weighted_score
    trigger: "computed when a VendorInclusion is created and frozen when the parent document is published"
    algorithm: weighted_scoring
    formula: |
      # Subject: one VendorInclusion I with dimension_scores rows (dimension, raw_score, weight_pct).
      # PINNED ROUNDING ORDER — round each dimension first, then sum, then round the sum.
      points(d) = round_half_up(weight_pct(d) * raw_score(d), 2)
      I.weighted_total_score = round_half_up(sum(points(d) for d in I.dimension_scores), 2)

      # The rejected alternative (sum the unrounded products, round once at the end)
      # produces a different cent for the same inputs and MUST NOT be used.
    input_set: "dimension_scores rows supplied at creation; weights must sum to exactly 1.00 and raw_score is on a 0.00..5.00 scale."
    constants:
      SCALE_MIN: 0.00
      SCALE_MAX: 5.00
      INCLUSION_SCORE_FLOOR: 2.50
      LATE_FACT_CHECK_PENALTY: 0.25
      SCORE_FLOOR: 0.00
    precision: "2 decimal places, round_half_up, applied per dimension and again to the sum"
    variants:
      - name: ROUND_PER_DIMENSION
        when: "always — this is the pinned order"
        difference: "sums already-rounded dimension points"
      - name: ROUND_TOTAL_ONLY
        when: "never — documented only to pin the rejection"
        difference: "rounds the unrounded sum once, which yields a different cent (3.85 instead of 3.86 on the reference inputs)"

  - name: reprint_license_fee
    trigger: "recomputed on every reprint-copy adjustment and on inclusion finalization"
    algorithm: tiered_pricing
    formula: |
      # Subject: one VendorInclusion I with a reprint licence.
      # PINNED EVALUATION ORDER — the volume-discount bracket is selected from the
      # PRE-discount total, which itself already contains the overage component.
      base_fee        = TIER_BASE_FEE_CENTS[I.reprint_tier]
      overage_copies  = max(0, I.reprint_copies_used - INCLUDED_COPIES[I.reprint_tier])
      overage_fee     = overage_copies * OVERAGE_PER_COPY_CENTS[I.reprint_tier]
      pre_discount    = base_fee + overage_fee
      discount_pct    = 0.15 when pre_discount >= 1000000
                        else 0.10 when pre_discount >= 500000
                        else 0.00
      I.reprint_fee_cents = round_half_up(pre_discount * (1 - discount_pct)
                                          * USE_MULTIPLIER[I.permitted_marketing_use], 0)
    input_set: "reprint_tier, permitted_marketing_use and reprint_copies_used on the inclusion; the fee is 0 when reprint_tier is NONE."
    constants:
      TIER_BASE_FEE_CENTS: { NONE: 0, STANDARD: 250000, PREMIUM: 600000 }
      INCLUDED_COPIES: { NONE: 0, STANDARD: 500, PREMIUM: 2000 }
      OVERAGE_PER_COPY_CENTS: { NONE: 0, STANDARD: 900, PREMIUM: 700 }
      USE_MULTIPLIER: { NO_USE: 0.00, INTERNAL_ONLY: 0.50, SOCIAL_SNIPPET: 0.75, FULL_REPRINT: 1.00 }
      VOLUME_DISCOUNT_HIGH: 0.15
      VOLUME_DISCOUNT_LOW: 0.10
      VOLUME_DISCOUNT_LOW_FLOOR_CENTS: 500000
      VOLUME_DISCOUNT_HIGH_FLOOR_CENTS: 1000000
    precision: "0 decimal places (whole cents), round_half_up, applied once at the end"
    variants:
      - name: BRACKET_FROM_PRE_DISCOUNT
        when: "always — this is the pinned order"
        difference: "selects the discount bracket from base + overage before discounting"
      - name: BRACKET_FROM_POST_DISCOUNT
        when: "never — documented only to pin the rejection"
        difference: "would re-select the bracket after discounting and can drop an order into a lower bracket"

  - name: fact_check_response_deadline
    trigger: "computed when a fact-check round is opened"
    algorithm: chronological
    formula: |
      # Subject: one VendorInclusion I whose fact-check round opened at T.
      raw_due   = T + 14 calendar days
      if weekday(raw_due) is Saturday:  due_date = raw_due + 2 days
      elif weekday(raw_due) is Sunday:  due_date = raw_due + 1 day
      else:                             due_date = raw_due
      I.fact_check_due_utc = date(due_date) at 23:59:59Z
      I.fact_check_late    = (I.fact_check_response_at > I.fact_check_due_utc)
    input_set: "the instant the round was opened (fact_check_requested_at) and the instant the vendor responded (fact_check_response_at)."
    constants:
      RESPONSE_WINDOW_DAYS: 14
      DUE_TIME_OF_DAY: "23:59:59Z"
    precision: "second precision, UTC; weekend roll is calendar-based, not business-day based"
    variants:
      - name: CALENDAR_WINDOW
        when: "always"
        difference: "rolls a weekend landing forward to the following Monday rather than counting business days"

  - name: sponsor_minute_share
    trigger: "recomputed on every agenda-session append and every sponsorship activation or cancellation"
    algorithm: threshold
    formula: |
      # Subject: one ConferenceEvent E.
      total_minutes   = sum(session.duration_minutes for session in E.sessions)
      sponsor_minutes = sum(session.duration_minutes for session in E.sessions
                            where session.session_kind == SPONSOR_KEYNOTE)
      E.sponsor_minute_share = 0 when total_minutes == 0
                               else round_half_up(sponsor_minutes / total_minutes, 4)
      # Gate: a new SPONSOR_KEYNOTE row is accepted only when the recomputed
      # share is <= 0.4000. Exactly 0.4000 is allowed; 0.4001 is rejected.
    input_set: "agenda rows appended to E; the gate is evaluated on the post-append state."
    constants:
      SPONSOR_SHARE_CEILING: 0.4000
    precision: "4 decimal places, round_half_up"
    variants:
      - name: POST_APPEND_GATE
        when: "always"
        difference: "evaluates the share after the candidate row is included, so the boundary is inclusive at exactly 0.4000"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present on every request except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the X-User-Role value is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "request body is well formed: every required input field is present, enum members are in range, integers satisfy their declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "referenced resources exist, validated left to right in the order the endpoint's input list declares them; a missing resource reports its own entity-specific error — ERR_CLIENT_ACCOUNT_NOT_FOUND, ERR_SEAT_NOT_FOUND, ERR_ANALYST_NOT_FOUND, ERR_INQUIRY_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_VENDOR_INCLUSION_NOT_FOUND, ERR_BRIEFING_NOT_FOUND, ERR_SALES_RELATIONSHIP_NOT_FOUND, ERR_CONFERENCE_EVENT_NOT_FOUND or ERR_SPONSORSHIP_NOT_FOUND"
    error_id: ERR_SEAT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or a body foreign key"

  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition exists; a terminal resource rejects every further transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "research independence: the acting analyst must hold no ACTIVE SalesRelationship with the vendor in play, and a peer reviewer must differ from the document's lead analyst"
    error_id: ERR_SEPARATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: ["POST /research/vendor-briefings", "POST /research/vendor-inclusions/{id}/fact-check-responses", "POST /research/documents/{id}/submit-for-review", "POST /research/vendor-inclusions/{id}/finalize"]

  - priority: 7
    category: business_temporal
    check: "time windows: a requested inquiry slot must not be in the past, an appeal must be filed on or before appeal_window_closes_at, a fact-check response must land on or before fact_check_due_utc, and a vendor read of an EMBARGOED document is refused"
    error_id: ERR_INQUIRY_START_IN_PAST
    http_status: 400
    applies_to: ["POST /research/inquiry-requests", "POST /research/inquiry-requests/{id}/schedule", "POST /research/vendor-inclusions/{id}/appeals", "POST /research/vendor-inclusions/{id}/fact-check-responses", "GET /research/documents/{id}"]

  - priority: 8
    category: business_constraint
    check: "uniqueness, capacity and overlap: seat email unique within the account, no overlapping analyst inquiry windows, at most 3 inquiries per analyst per UTC day, briefing slots keep a 15-minute buffer, PLATINUM sponsor exclusivity windows must not overlap, the sponsor minute share must stay at or below 0.4000, an inclusion may be appealed at most twice"
    error_id: ERR_INQUIRY_SLOT_OVERLAP
    http_status: 409
    applies_to: ["POST /research/seats", "POST /research/inquiry-requests/{id}/schedule", "POST /research/vendor-briefings", "POST /research/sponsorships", "POST /research/conference-events/{id}/sessions", "POST /research/vendor-inclusions/{id}/appeals"]

  - priority: 9
    category: business_referential
    check: "a referenced entity must itself be in the state the operation requires: the seat must be ACTIVE and its account ACTIVE before an inquiry may be submitted, and the linked conference event must still be DRAFT or PROGRAMMING before a sponsorship may be activated"
    error_id: ERR_SEAT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /research/inquiry-requests", "POST /research/sponsorships/{id}/activate"]

  - priority: 10
    category: business_fiscal
    check: "inquiry allowance: the RESERVATION ledger must have at least one unit free before an inquiry may be scheduled"
    error_id: ERR_INQUIRY_ALLOWANCE_EXHAUSTED
    http_status: 409
    applies_to: ["POST /research/inquiry-requests/{id}/schedule"]

  - priority: 11
    category: business_constraint
    check: "optimistic concurrency: the expected_<parent>_version supplied in the body must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /research/documents/{id}/vendor-inclusions", "POST /research/sales-relationships", "POST /research/sponsorships"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; every deadline, embargo, renewal window and capacity day is evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock set; time-derived fields (Seat entitlement expiry, ResearchDocument.embargo_status, InquiryRequest IN_PREP entry, ClientAccount RENEWAL_REVIEW entry, VendorInclusion.fact_check_status lapse) are re-evaluated on the next read or write"]

  # --- ClientAccount --------------------------------------------------------
  - method: POST
    path: "/research/clients"
    description: "Create a client account with its contract terms"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, industry, region, contract_start_utc, contract_end_utc, seat_count_contracted, inquiry_allowance_total, reprint_tier]
    output: ClientAccount
    side_effects: ["contract_status=ACTIVE; active/provisioned/revoked seat counts and both ledger remainders start at 0 and inquiry_allowance_total; utilization_score computed (0.00 with no seats); renewal_posture derived"]

  - method: GET
    path: "/research/clients/{id}"
    description: "Read an account with its computed utilization, ledger remainders and renewal posture"
    roles: [PlatformAdmin, ClientAdmin, ResearchDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["SEAT_WEIGHTED utilization_score recomputed; renewal_posture recomputed; ACTIVE -> RENEWAL_REVIEW evaluated against the clock"]

  - method: POST
    path: "/research/clients/{id}/renewal-decisions"
    description: "Record the renewal decision; RENEW is gated on measured research utilization"
    roles: [ResearchDirector, PlatformAdmin]
    code: 200
    input: [decision]
    output: ClientAccount
    side_effects: ["contract_status -> RENEWED or CHURNED; renewal_decided_at stamped; version incremented; CHURN additionally revokes every ACTIVE seat and recomputes active_seat_count"]

  # --- Seat -----------------------------------------------------------------
  - method: POST
    path: "/research/seats"
    description: "Provision a seat on an account"
    roles: [ClientAdmin, PlatformAdmin]
    code: 201
    input: [client_account_id, seat_email, research_role, "seat_kind?", "entitlement_override_types?"]
    output: Seat
    side_effects: ["status=PROVISIONED; owning ClientAccount.provisioned_seat_count incremented; utilization_score recomputed"]

  - method: GET
    path: "/research/seats/{id}"
    description: "Read a seat with its derived entitlement document types"
    roles: [ClientAdmin, PlatformAdmin, SeatHolder, ResearchDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Seat
    side_effects: []

  - method: GET
    path: "/research/seats"
    description: "List seats filtered by account, status or research role"
    roles: [ClientAdmin, PlatformAdmin, ResearchDirector, ComplianceOfficer]
    code: 200
    input: ["client_account_id?", "status?", "research_role?"]
    output: Seat[]
    side_effects: []

  - method: POST
    path: "/research/seats/{id}/activate"
    description: "Activate a provisioned seat, deriving its role-based research entitlements"
    roles: [ClientAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Seat
    side_effects: ["status=ACTIVE; activated_at stamped; entitlement_document_types derived from research_role plus overrides; owning account's active/provisioned counts updated; utilization_score and renewal_posture recomputed"]

  - method: POST
    path: "/research/seats/{id}/revoke"
    description: "Revoke a seat; drops its entitlements and re-derives account utilization"
    roles: [ClientAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Seat
    side_effects: ["status=REVOKED; revoked_at stamped; entitlement_document_types=[]; owning account's active (or provisioned) and revoked counts updated; utilization_score recomputed; renewal_posture recomputed; account contract_status moves to RENEWAL_REVIEW when active_seat_count falls below half of seat_count_contracted"]

  # --- Analyst --------------------------------------------------------------
  - method: POST
    path: "/research/analysts"
    description: "Register an analyst with topic routes"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, practice_area, topic_routes, seniority, "status?"]
    output: Analyst
    side_effects: ["integrity_flag=CLEAR; conflicted_vendor_ids=[]; counters at 0"]

  - method: GET
    path: "/research/analysts/{id}"
    description: "Read an analyst with integrity flag and load counters"
    roles: [PlatformAdmin, ResearchDirector, ComplianceOfficer, Analyst, SeatHolder]
    code: 200
    input: []
    output: Analyst
    side_effects: []

  - method: GET
    path: "/research/analysts"
    description: "List analysts filtered by practice area, topic route or status"
    roles: [PlatformAdmin, ResearchDirector, ComplianceOfficer, SeatHolder, Analyst]
    code: 200
    input: ["practice_area?", "topic_route?", "status?"]
    output: Analyst[]
    side_effects: []

  # --- InquiryRequest -------------------------------------------------------
  - method: POST
    path: "/research/inquiry-requests"
    description: "Submit an inquiry; topic routing assigns the analyst and the seat's allowance is committed at scheduling time. Routing selector: (a) eligibility = Analyst.status == ACTIVE AND topic_route IN Analyst.topic_routes AND Analyst.id NOT IN InquiryRequest.declined_analyst_ids AND Analyst.integrity_flag != CONFLICT_BLOCKED; (b) ranking = seniority rank DESC (DISTINGUISHED 4, VP 3, SENIOR 2, ASSOCIATE 1), then open_inquiry_count ASC, then created_at ASC; (c) tie-break = created_at ASC, never id; (d) empty pool = 409 ERR_ANALYST_NOT_ELIGIBLE and no InquiryRequest row is created."
    roles: [SeatHolder]
    code: 201
    input: [seat_id, topic_route, question_summary, requested_start_utc, duration_minutes, "preparation_notes?"]
    output: InquiryRequest
    side_effects: ["status=ROUTED with analyst_id set by the topic-routing selector; routing_attempt_count=1; Analyst.open_inquiry_count incremented; Seat.last_inquiry_at stamped"]

  - method: GET
    path: "/research/inquiry-requests/{id}"
    description: "Read an inquiry"
    roles: [SeatHolder, Analyst, PlatformAdmin, ResearchDirector, ClientAdmin]
    code: 200
    input: []
    output: InquiryRequest
    side_effects: ["SCHEDULED -> IN_PREP evaluated against the clock"]

  - method: GET
    path: "/research/inquiry-requests"
    description: "List inquiries filtered by seat, analyst or status"
    roles: [SeatHolder, Analyst, PlatformAdmin, ResearchDirector, ClientAdmin]
    code: 200
    input: ["seat_id?", "analyst_id?", "status?"]
    output: InquiryRequest[]
    side_effects: []

  - method: POST
    path: "/research/inquiry-requests/{id}/schedule"
    description: "Analyst confirms the slot; reserves one allowance unit"
    roles: [Analyst]
    code: 200
    input: [scheduled_start_utc]
    output: InquiryRequest
    side_effects: ["status=SCHEDULED; scheduled_start_utc set; owning account's reserved_inquiry_units incremented and remaining_reserved_units recomputed; remaining_consumed_units unchanged"]

  - method: POST
    path: "/research/inquiry-requests/{id}/decline"
    description: "Analyst declines; the inquiry re-routes to the next eligible analyst"
    roles: [Analyst]
    code: 200
    input: ["decline_reason?"]
    output: InquiryRequest
    side_effects: ["status=ROUTED; declining analyst appended to declined_analyst_ids; analyst_id replaced by the re-routing selector winner; routing_attempt_count incremented; scheduled_start_utc cleared; reserved_inquiry_units released"]

  - method: POST
    path: "/research/inquiry-requests/{id}/complete"
    description: "Close out a prepared inquiry as COMPLETED or NO_SHOW"
    roles: [Analyst]
    code: 200
    input: [outcome, note_delivered, "note_reference?"]
    output: InquiryRequest
    side_effects: ["status=COMPLETED or NO_SHOW; units_consumed=1; settled_at stamped; reserved_inquiry_units decremented and consumed_inquiry_units incremented; utilization_score recomputed; Analyst.open_inquiry_count decremented"]

  - method: POST
    path: "/research/inquiry-requests/{id}/cancel"
    description: "Seat holder cancels; free up to 24 hours before the slot, unit-consuming after"
    roles: [SeatHolder, ClientAdmin]
    code: 200
    input: ["cancel_reason?"]
    output: InquiryRequest
    side_effects: ["status=CANCELLED; settled_at stamped; free cancellation releases the reservation only; late cancellation also consumes the unit and recomputes utilization_score"]

  # --- ResearchDocument -----------------------------------------------------
  - method: POST
    path: "/research/documents"
    description: "Open a research document in DRAFT"
    roles: [Analyst, ResearchDirector]
    code: 201
    input: [title, doc_type, practice_area, lead_analyst_id, "embargo_days?", "peer_reviewer_analyst_id?"]
    output: ResearchDocument
    side_effects: ["editorial_status=DRAFT; embargo_status=EMBARGOED; peer_verdict=NOT_ASSIGNED; counters at 0"]

  - method: GET
    path: "/research/documents/{id}"
    description: "Read a document; vendor reads are refused while the embargo is active"
    roles: [Analyst, ResearchDirector, ClientAdmin, SeatHolder, VendorRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ResearchDocument
    side_effects: ["EMBARGOED -> RELEASED evaluated against the clock"]

  - method: GET
    path: "/research/documents"
    description: "List documents filtered by lead analyst, editorial status or type"
    roles: [Analyst, ResearchDirector, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["lead_analyst_id?", "editorial_status?", "doc_type?"]
    output: ResearchDocument[]
    side_effects: []

  - method: POST
    path: "/research/documents/{id}/submit-for-review"
    description: "Assign peer review; the reviewer must differ from the lead analyst"
    roles: [Analyst, ResearchDirector]
    code: 200
    input: [peer_reviewer_analyst_id]
    output: ResearchDocument
    side_effects: ["editorial_status=PEER_REVIEW; peer_verdict=PENDING; peer_review_round incremented"]

  - method: POST
    path: "/research/documents/{id}/peer-verdicts"
    description: "Reviewer returns APPROVE (advances to fact check) or REVISE (returns to draft)"
    roles: [Analyst]
    code: 200
    input: [verdict, "comments?"]
    output: ResearchDocument
    side_effects: ["APPROVE: editorial_status=FACT_CHECK and every INCLUDED inclusion opens a fact-check round; REVISE: editorial_status=DRAFT"]

  - method: POST
    path: "/research/documents/{id}/publish"
    description: "Publish a cleared document; starts the embargo and freezes the placement snapshot"
    roles: [ResearchDirector]
    code: 200
    input: []
    output: ResearchDocument
    side_effects: ["editorial_status=PUBLISHED; published_at stamped; embargo_status=EMBARGOED; embargo_until computed; placement snapshot cascade locks every inclusion and re-derives Vendor.briefing_eligible"]

  - method: POST
    path: "/research/documents/{id}/revise"
    description: "Reopen a published document; re-opens fact-check rounds"
    roles: [Analyst, ResearchDirector]
    code: 200
    input: [revision_reason]
    output: ResearchDocument
    side_effects: ["editorial_status=REVISED then FACT_CHECK; revision_count incremented; every INCLUDED inclusion re-opens a fact-check round with a fresh due date"]

  # --- Vendor ---------------------------------------------------------------
  - method: POST
    path: "/research/vendors"
    description: "Register a vendor in the research universe"
    roles: [PlatformAdmin, VendorRep]
    code: 201
    input: [vendor_name, hq_region, employee_count_band]
    output: Vendor
    side_effects: ["status=ACTIVE; briefing_eligible=false; counters at 0"]

  - method: GET
    path: "/research/vendors/{id}"
    description: "Read a vendor with its separation exposure and briefing eligibility"
    roles: [PlatformAdmin, ResearchDirector, ComplianceOfficer, VendorRep, Analyst]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # --- VendorInclusion ------------------------------------------------------
  - method: POST
    path: "/research/documents/{id}/vendor-inclusions"
    description: "Propose a vendor for a comparative document; carries the dimension scores"
    roles: [Analyst, ResearchDirector]
    code: 201
    input: [vendor_id, dimension_scores, inclusion_criteria_met_count, expected_document_version, "reprint_tier?", "permitted_marketing_use?", "reprint_copies_authorized?"]
    output: VendorInclusion
    side_effects: ["inclusion_status=UNDER_EVALUATION; weighted_total_score computed with the pinned per-dimension rounding order; fact_check_status=NOT_STARTED; reprint_fee_cents computed; any older inclusion for the same (document_id, vendor_id) pair becomes SUPERSEDED; ResearchDocument.version incremented"]

  - method: GET
    path: "/research/vendor-inclusions/{id}"
    description: "Read an inclusion with its score, fact-check and licence state"
    roles: [Analyst, ResearchDirector, VendorRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: VendorInclusion
    side_effects: ["REQUESTED -> LAPSED evaluated against the clock"]

  - method: GET
    path: "/research/vendor-inclusions"
    description: "List inclusions filtered by document, vendor or placement status"
    roles: [Analyst, ResearchDirector, VendorRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["document_id?", "vendor_id?", "inclusion_status?"]
    output: VendorInclusion[]
    side_effects: []

  - method: POST
    path: "/research/vendor-inclusions/{id}/finalize"
    description: "Set the placement; INCLUDE is gated on inclusion criteria and the weighted score"
    roles: [ResearchDirector]
    code: 200
    input: [outcome]
    output: VendorInclusion
    side_effects: ["inclusion_status=INCLUDED or EXCLUDED; parent document's included_vendor_count recomputed; EXCLUDED on a published document sets appeal_window_closes_at"]

  - method: POST
    path: "/research/vendor-inclusions/{id}/appeals"
    description: "Vendor appeals an exclusion; at most two appeals per inclusion"
    roles: [VendorRep]
    code: 200
    input: [appeal_grounds]
    output: VendorInclusion
    side_effects: ["inclusion_status=UNDER_APPEAL; appeal_filed_at stamped; appeal_grounds stored; appeal_count incremented; VendorInclusion.version incremented"]

  - method: POST
    path: "/research/vendor-inclusions/{id}/appeal-decisions"
    description: "Research governance decides the appeal; UPHOLD changes placement, DENY leaves the door open for one re-file"
    roles: [ResearchDirector]
    code: 200
    input: [outcome, "rationale?"]
    output: VendorInclusion
    side_effects: ["inclusion_status=APPEAL_UPHELD or APPEAL_DENIED; UPHOLD recomputes included_vendor_count and, on a published document, reopens it for revision with fresh fact-check rounds"]

  - method: POST
    path: "/research/vendor-inclusions/{id}/fact-check-responses"
    description: "Vendor answers the fact-check request; a response after the deadline is flagged late"
    roles: [VendorRep]
    code: 200
    input: [response_summary, correction_offered]
    output: VendorInclusion
    side_effects: ["fact_check_status=VENDOR_RESPONDED; fact_check_response_at stamped; fact_check_late computed against fact_check_due_utc; a late response applies the score penalty"]

  - method: POST
    path: "/research/vendor-inclusions/{id}/fact-check-decisions"
    description: "Research governance accepts the correction or disputes it and opens another round"
    roles: [ResearchDirector]
    code: 200
    input: [outcome]
    output: VendorInclusion
    side_effects: ["ACCEPT: fact_check_status=ADJUDICATED and the parent document clears when no open round remains; DISPUTE: fact_check_status=DISPUTED then REQUESTED with a fresh due date"]

  - method: POST
    path: "/research/vendor-inclusions/{id}/reprint-copy-adjustments"
    description: "Consume or return licensed reprint copies; recomputes the licence fee"
    roles: [VendorRep, PlatformAdmin]
    code: 200
    input: [delta_copies, "permitted_marketing_use?"]
    output: VendorInclusion
    side_effects: ["reprint_copies_used adjusted; reprint_fee_cents recomputed with the pinned bracket order; the adjustment is refused when the resulting copies_used would be negative"]

  # --- VendorBriefing -------------------------------------------------------
  - method: POST
    path: "/research/vendor-briefings"
    description: "Vendor requests a briefing; separation screening runs before any analyst is assigned"
    roles: [VendorRep]
    code: 201
    input: [vendor_id, briefing_topic, requested_start_utc, duration_minutes]
    output: VendorBriefing
    side_effects: ["status=SCREENED with separation_check_result=PASS and analyst_id assigned by briefing routing, or status=DECLINED with separation_check_result=FAIL_SALES_RELATIONSHIP; slot confirmed as SCHEDULED when the buffer check passes"]

  - method: GET
    path: "/research/vendor-briefings/{id}"
    description: "Read a briefing"
    roles: [VendorRep, Analyst, ResearchDirector, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: VendorBriefing
    side_effects: []

  - method: GET
    path: "/research/vendor-briefings"
    description: "List briefings filtered by vendor, analyst or status"
    roles: [VendorRep, Analyst, ResearchDirector, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["vendor_id?", "analyst_id?", "status?"]
    output: VendorBriefing[]
    side_effects: []

  - method: POST
    path: "/research/vendor-briefings/{id}/record-briefing"
    description: "Analyst records the briefing as held, or declines it"
    roles: [Analyst, ResearchDirector]
    code: 200
    input: ["held_at?", "decline_reason?"]
    output: VendorBriefing
    side_effects: ["HELD: status=HELD, held_at stamped, Vendor.last_briefing_at updated and Vendor.briefing_eligible recomputed; DECLINED: status=DECLINED"]

  # --- SalesRelationship ----------------------------------------------------
  - method: POST
    path: "/research/sales-relationships"
    description: "Register a commercial tie; immediately triggers the separation cascade"
    roles: [SalesRep, ComplianceOfficer]
    code: 201
    input: [analyst_id, vendor_id, relationship_type, annual_value_cents, expected_analyst_version]
    output: SalesRelationship
    side_effects: ["status=ACTIVE; Analyst.conflicted_vendor_ids updated and integrity_flag=CONFLICT_REVIEW; open briefings for the pair revoked by separation; conflicted inclusions revert to PROPOSED; Vendor.active_sales_relationship_count incremented and briefing_eligible recomputed; Analyst.version incremented"]

  - method: GET
    path: "/research/sales-relationships/{id}"
    description: "Read a commercial tie"
    roles: [ComplianceOfficer, ResearchDirector, PlatformAdmin, SalesRep]
    code: 200
    input: []
    output: SalesRelationship
    side_effects: []

  - method: GET
    path: "/research/sales-relationships"
    description: "List commercial ties filtered by analyst, vendor or status"
    roles: [ComplianceOfficer, ResearchDirector, PlatformAdmin, SalesRep]
    code: 200
    input: ["analyst_id?", "vendor_id?", "status?"]
    output: SalesRelationship[]
    side_effects: []

  - method: POST
    path: "/research/sales-relationships/{id}/terminate"
    description: "End a commercial tie and clear the analyst's conflict flag"
    roles: [ComplianceOfficer, SalesRep]
    code: 200
    input: ["termination_reason?"]
    output: SalesRelationship
    side_effects: ["status=TERMINATED; terminated_at stamped; Analyst.conflicted_vendor_ids pruned and integrity_flag back to CLEAR when no tie remains; Vendor.active_sales_relationship_count decremented; briefings already REVOKED_BY_SEPARATION are not restored"]

  # --- ConferenceEvent ------------------------------------------------------
  - method: POST
    path: "/research/conference-events"
    description: "Create a conference event in DRAFT"
    roles: [EventProgrammer, PlatformAdmin]
    code: 201
    input: [event_name, venue_region, start_utc, end_utc]
    output: ConferenceEvent
    side_effects: ["status=DRAFT; sessions=[]; minute counters and sponsorship_revenue_cents at 0"]

  - method: GET
    path: "/research/conference-events/{id}"
    description: "Read an event with its agenda mix and sponsorship revenue"
    roles: [EventProgrammer, PlatformAdmin, ResearchDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ConferenceEvent
    side_effects: ["AGENDA_LOCKED -> COMPLETED evaluated against the clock"]

  - method: POST
    path: "/research/conference-events/{id}/sessions"
    description: "Append an agenda row; the sponsor minute share gate runs on the post-append state. duration_minutes is an integer >= 15; session_kind is RESEARCH_SESSION or SPONSOR_KEYNOTE."
    roles: [EventProgrammer]
    code: 200
    input: [session_title, session_kind, duration_minutes, "sponsor_vendor_id?"]
    output: ConferenceEvent
    side_effects: ["session appended; research_session_minutes, sponsor_session_minutes and sponsor_minute_share recomputed; DRAFT opens PROGRAMMING; a RESEARCH_SESSION reopens a locked agenda to PROGRAMMING"]

  - method: POST
    path: "/research/conference-events/{id}/lock-agenda"
    description: "Lock the agenda for delivery"
    roles: [EventProgrammer, ResearchDirector]
    code: 200
    input: []
    output: ConferenceEvent
    side_effects: ["status=AGENDA_LOCKED; agenda_locked_at stamped"]

  # --- Sponsorship ----------------------------------------------------------
  - method: POST
    path: "/research/sponsorships"
    description: "Sell a sponsorship package; PLATINUM windows must not overlap"
    roles: [SalesRep, EventProgrammer]
    code: 201
    input: [conference_event_id, vendor_id, tier, amount_cents, exclusivity_start_utc, exclusivity_end_utc, expected_conference_event_version]
    output: Sponsorship
    side_effects: ["status=PENDING; sponsor_slot_counted=false; ConferenceEvent.version incremented"]

  - method: GET
    path: "/research/sponsorships/{id}"
    description: "Read a sponsorship package"
    roles: [SalesRep, EventProgrammer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Sponsorship
    side_effects: []

  - method: GET
    path: "/research/sponsorships"
    description: "List sponsorships filtered by event, vendor or status"
    roles: [SalesRep, EventProgrammer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["conference_event_id?", "vendor_id?", "status?"]
    output: Sponsorship[]
    side_effects: []

  - method: POST
    path: "/research/sponsorships/{id}/activate"
    description: "Activate a pending package; books its revenue onto the event"
    roles: [EventProgrammer, SalesRep]
    code: 200
    input: []
    output: Sponsorship
    side_effects: ["status=ACTIVE; activated_at stamped; sponsor_slot_counted=true; ConferenceEvent.sponsorship_revenue_cents incremented by amount_cents; ConferenceEvent.version incremented"]

  - method: POST
    path: "/research/sponsorships/{id}/cancel"
    description: "Cancel an active package before the agenda locks; reverses the revenue"
    roles: [EventProgrammer, ComplianceOfficer]
    code: 200
    input: ["cancel_reason?"]
    output: Sponsorship
    side_effects: ["status=CANCELLED; cancelled_at stamped; sponsor_slot_counted=false; ConferenceEvent.sponsorship_revenue_cents decremented by amount_cents; ConferenceEvent.version incremented"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing on a request that requires them"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum member is out of range, an integer bound is violated, or dimension_scores weights do not sum to exactly 1.00"
  - id: ERR_CLIENT_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no ClientAccount exists for the supplied id or body foreign key"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "no Seat exists for the supplied id or body foreign key"
  - id: ERR_ANALYST_NOT_FOUND
    http: 404
    condition: "no Analyst exists for the supplied id or body foreign key"
  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "no InquiryRequest exists for the supplied path id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no ResearchDocument exists for the supplied path id or body foreign key"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "no Vendor exists for the supplied id or body foreign key"
  - id: ERR_VENDOR_INCLUSION_NOT_FOUND
    http: 404
    condition: "no VendorInclusion exists for the supplied path id"
  - id: ERR_BRIEFING_NOT_FOUND
    http: 404
    condition: "no VendorBriefing exists for the supplied path id"
  - id: ERR_SALES_RELATIONSHIP_NOT_FOUND
    http: 404
    condition: "no SalesRelationship exists for the supplied path id"
  - id: ERR_CONFERENCE_EVENT_NOT_FOUND
    http: 404
    condition: "no ConferenceEvent exists for the supplied path id or body foreign key"
  - id: ERR_SPONSORSHIP_NOT_FOUND
    http: 404
    condition: "no Sponsorship exists for the supplied path id"
  - id: ERR_ANALYST_NOT_ELIGIBLE
    http: 409
    condition: "topic routing finds no eligible analyst: no ACTIVE analyst lists the topic route, or every candidate is conflicted or has already declined"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition exists, including any transition attempted from a terminal state"
  - id: ERR_SEPARATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "an analyst with an ACTIVE SalesRelationship to the vendor attempts to brief, evaluate or fact-check that vendor; also raised when the assigned peer reviewer equals the document's lead analyst"
  - id: ERR_INQUIRY_START_IN_PAST
    http: 400
    condition: "the requested or confirmed inquiry start instant is strictly before the logical clock"
  - id: ERR_INQUIRY_ALLOWANCE_EXHAUSTED
    http: 409
    condition: "the RESERVATION ledger remainder is below 1, so no further inquiry can be scheduled for the account"
  - id: ERR_INQUIRY_SLOT_OVERLAP
    http: 409
    condition: "the confirmed inquiry window overlaps another open inquiry of the same analyst"
  - id: ERR_ANALYST_DAILY_INQUIRY_CAP
    http: 409
    condition: "the analyst already holds 3 inquiries whose scheduled start falls on the requested UTC calendar day"
  - id: ERR_BRIEFING_SLOT_CONFLICT
    http: 409
    condition: "the requested briefing window, expanded by the 15-minute buffer, overlaps another open briefing of the assigned analyst"
  - id: ERR_BRIEFING_SEPARATION_FAILED
    http: 403
    condition: "no analyst free of a sales tie to the vendor can take the briefing topic, so the briefing is refused at screening"
  - id: ERR_DUPLICATE_SEAT_EMAIL
    http: 409
    condition: "seat_email already exists on the same ClientAccount"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "the appeal was filed after appeal_window_closes_at"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "appeal_count is already 2 for this inclusion"
  - id: ERR_EMBARGO_ACTIVE
    http: 403
    condition: "a VendorRep reads a ResearchDocument whose embargo_status is EMBARGOED"
  - id: ERR_FACT_CHECK_RESPONSE_LATE
    http: 409
    condition: "the fact-check cycle already lapsed because the clock passed fact_check_due_utc"
  - id: ERR_INCLUSION_CRITERIA_NOT_MET
    http: 409
    condition: "finalize INCLUDE attempted with fewer than 4 inclusion criteria met, or with a weighted_total_score below 2.50"
  - id: ERR_SEAT_NOT_ACTIVE
    http: 409
    condition: "an inquiry is submitted from a seat whose status is not ACTIVE, or from an account whose contract_status is not ACTIVE"
  - id: ERR_SPONSOR_EXCLUSIVITY_OVERLAP
    http: 409
    condition: "a PLATINUM sponsorship window overlaps another ACTIVE PLATINUM window on the same event, or an agenda SPONSOR_KEYNOTE row names a vendor whose exclusive window covers the event"
  - id: ERR_SPONSOR_SHARE_EXCEEDED
    http: 409
    condition: "appending the agenda row would push sponsor_minute_share above 0.4000"
  - id: ERR_AGENDA_LOCKED
    http: 409
    condition: "a SPONSOR_KEYNOTE row is appended to an agenda that is already AGENDA_LOCKED"
  - id: ERR_EVENT_AGENDA_LOCKED
    http: 409
    condition: "a sponsorship is activated against a ConferenceEvent whose agenda is already locked"
  - id: ERR_REPRINT_COPIES_EXCEEDED
    http: 409
    condition: "a reprint copy adjustment would drive reprint_copies_used below 0 or above reprint_copies_authorized"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the expected_<parent>_version supplied in the body does not equal the parent's current version"
  - id: ERR_RENEWAL_UTILIZATION_TOO_LOW
    http: 409
    condition: "renewal decision RENEW attempted while utilization_score is below 40, or while a Seat on the account is still PROVISIONED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Operator of the research platform: seeds reference data, drives the logical clock and performs recovery operations"
    identity: "opaque"
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /research/clients", "POST /research/analysts"]
    shared_operations: ["POST /research/seats", "POST /research/seats/{id}/activate", "POST /research/seats/{id}/revoke", "POST /research/vendors", "POST /research/conference-events", "POST /research/clients/{id}/renewal-decisions", "GET /research/clients/{id}", "GET /research/documents/{id}", "POST /research/vendor-inclusions/{id}/reprint-copy-adjustments"]

  - name: ClientAdmin
    description: "Administrator of a subscribing client account: manages seats and cancels inquiries on behalf of the account"
    identity: "entity_backed:ClientAccount"
    exclusive_operations: ["POST /research/seats", "POST /research/seats/{id}/activate", "POST /research/seats/{id}/revoke"]
    shared_operations: ["GET /research/clients/{id}", "GET /research/seats/{id}", "GET /research/seats", "GET /research/inquiry-requests/{id}", "GET /research/inquiry-requests", "POST /research/inquiry-requests/{id}/cancel", "GET /research/documents/{id}"]

  - name: SeatHolder
