            - "Bill introduced with appropriation_requested_cents 12000000, so fiscal_status is NOTE_PENDING, then referred with hearing window [2026-10-05T14:00:00Z, 2026-10-05T16:00:00Z) giving report_deadline_utc 2026-10-12T16:00:00Z."
            - "An INCREMENTAL_COST note filed with the standard two-line set and SUBMITTED but deliberately NOT certified, so the bill is still NOTE_PENDING when the first report is attempted."
