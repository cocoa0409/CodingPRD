  - section: state_machines
    instances:

      - name: open_policy_activation_moves_status_only_and_leaves_war_axis_attached
        claim_type: valid_transition
        grounds:
          - state_machines.OpenPolicy.status.DRAFT_to_ACTIVE
          - state_machines.OpenPolicy.war_cover_status
          - endpoints.POST /open-policies/{id}/activate
        distinguishing_aspect: |
          The activate trigger moves the status axis DRAFT -> ACTIVE and bumps
          version to 2 while the independent war_cover_status axis stays exactly
          where §1.2 initialised it (ATTACHED) and every money aggregate stays
          0.00 — activation books no risk.
        test_recipe:
          setup:
            - "one DRAFT OpenPolicy whose limit tower satisfies per_certificate <= conveyance <= annual_aggregate"
          setup_api_calls:
            - call: "POST /open-policies"
              payload: { policy_number: "OP-2596-A", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
          assert:
            - "POST /open-policies/${pol_id}/activate returned 200"
            - "OpenPolicy.${pol_id}.status == \"ACTIVE\" and version == 2"
            - "OpenPolicy.${pol_id}.war_cover_status == \"ATTACHED\" — the war axis is untouched by the status axis"
            - "OpenPolicy.${pol_id}.aggregate_insured_value_booked == 0.00 and aggregate_premium_booked == 0.00 and certificates_issued_count == 0"

      - name: open_policy_activate_from_active_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.OpenPolicy.status.DRAFT_to_ACTIVE
          - validations.priority_8
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          ACTIVE is not a terminal state of the OpenPolicy.status machine and no
          transition accepts `activate` from ACTIVE, so the second activate
          fails with ERR_INVALID_STATE at 409 (not ERR_ALREADY_TERMINAL) and
          leaves version at 2 — the rejected call is not a write.
        test_recipe:
          setup:
            - "one OpenPolicy already moved DRAFT -> ACTIVE"
          setup_api_calls:
            - call: "POST /open-policies"
              payload: { policy_number: "OP-2596-A", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
