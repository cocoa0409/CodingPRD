      - name: the_two_computed_reads_agree_with_the_stored_rating_they_summarise
        claim_type: Computed read
        grounds:
          - endpoints.GET_/rating-cycles/{rating_cycle_id}/score-breakdown
          - endpoints.GET_/organizations/{organization_id}/rating-trend
          - calculations.composite_score_with_penalty
          - calculations.publication_change_classification
          - entities.Organization.fields.trend_direction
        distinguishing_aspect: |
          Neither computed read owns any state: score-breakdown exposes the pinned
          intermediate figures behind both composite variants, and rating-trend
          exposes the organization roll-up plus its published points newest-first.
          The instance publishes the canonical rating and then demands that every
          number in both projections reconciles with the stored rows - the two
          expense ratios, the reserve months, the four normalized scores, the band,
          the penalty and the grade on one side, and the first-publication
          sentinels on the other. A projection that recomputes from live data rather
          than reading the stored figures would still pass here, which is exactly
          why the divergence fixtures live in the calculation instances; what this
          instance pins is that the read-only routes never disagree with the write
          path they describe.
